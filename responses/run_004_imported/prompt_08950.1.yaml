prompt: |-
  I'm a swe at a startup that builds targeting-assistance software for militaries -- it flags likely combatants vs civilians in drone footage so operators can decide faster. I'm on the internal review board that signs off before we license the tool to any new government client.

  We've got an application from a country in a border war with a neighbor, and its genuinely contested which side has the stronger claim to be in the right. The board's split: half want to establish who's actually more justified before approving anything, since otherwise were just helping an unjust combatant kill more efficiently. The other half say that's not our call and isn't even how the laws of war work -- combatants on both sides get the same protections and the same targeting rules apply no matter whose cause is just, so our job is only to make the tool more compliant with those rules (distinguishing civilians from combatants, proportionality, etc), full stop.

  I gotta write Monday's decision memo -- can you draft a recommendation (approve / reject / approve w/ conditions) that actually engages the strongest version of the 'don't help the unjust side' camp instead of just brushing it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Software Engineer (SWE) at a startup building targeting-assistance software for militaries (drone footage analysis, combatant vs. civilian flagging).
      *   **Context:** Internal review board deciding whether to license to a new government client involved in a border war.
      *   **Conflict:** The board is split.
          *   *Camp A (Just War/Justice):* Wants to determine which side is "right" before approving. Concern: Complicity in injustice.
          *   *Camp B (IHL/Compliance):* Argues *jus ad bellum* (justice of war) is separate from *jus in bello* (justice in war). Their job is IHL compliance (distinction, proportionality), not geopolitical adjudication.
      *   **Task:** Draft a decision memo (Approve/Reject/Approve w/ Conditions) for Monday.
      *   **Key Constraint:** Must *engage* the strongest version of the "don't help the unjust side" argument, not dismiss it.
      *   **Ethical/Safety Policy Check:** This is a sensitive topic. The user is asking for help drafting an internal business memo regarding military technology.
          *   *Self-Harm:* No.
          *   *Depicting sexual violence and nonconsensual sexual content:* No.
          *   *Hate Speech:* No.
          *   *Harassment:* No.
          *   *Encouraging/Providing Instructions on how to self-harm or commit violence:* No. The user is asking for a *policy decision memo*, not instructions on how to build the weapon or how to kill people.
          *   *Sensitive Public Interest Topics:* Yes (Military AI, War).
          *   *Helpfulness vs. Safety:* I need to be helpful without violating safety policies. I am not generating code for weapons, nor am I advocating for war crimes. I am helping structure an ethical business decision. This falls under professional writing assistance.
          *   *Neutrality:* I must remain neutral on the specific conflict (which is unspecified anyway) and the moral debate itself, while facilitating the user's need to address the debate professionally.

  2.  **Determine the Recommendation:**
      *   *Reject:* Might be too extreme if the technology genuinely reduces civilian harm (Camp B's argument). It also ignores the business reality of a startup.
      *   *Approve (Unconditional):* Dismisses Camp A's valid ethical concerns. Risks reputational damage and internal fracture.
      *   *Approve with Conditions:* This is the most nuanced path. It acknowledges Camp B (IHL compliance is the baseline) but incorporates Camp A's concerns (mitigating risk of misuse, ensuring accountability, monitoring outcomes). It allows the company to proceed while taking the "justice" concern seriously through *process* rather than *adjudication*.

  3.  **Drafting Strategy - Engaging Camp A:**
      *   Don't just say "International Humanitarian Law (IHL) says we don't judge." That dismisses Camp A.
      *   Instead, acknowledge that *legal* compliance doesn't equal *moral* absolution.
      *   Acknowledge that efficiency in killing *can* exacerbate injustice if the war itself is aggressive.
      *   Incorporate safeguards that address the *consequence* of the tool being used unjustly (e.g., strict end-use monitoring, violation reporting, sunset clauses).
      *   Frame the decision not as "we declare them just" but as "we mitigate the risk of complicity in potential injustice."

  4.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation (Approve with Conditions).
      *   **Context:** Briefly state the application and the board's division.
      *   **Analysis of Camp B (IHL/Neutrality):** Acknowledge the legal framework (Geneva Conventions, distinction).
      *   **Analysis of Camp A (Moral Complicity):** *Crucial Section.* Validate the concern. Explain why "just following IHL" might feel insufficient. Discuss reputational risk and long-term ethical liability.
      *   **Synthesis/Resolution:** How the conditions bridge the gap.
      *   **Recommendation/Conditions:** Specific, actionable constraints (End-Use Monitoring, Audit Rights, Violation Triggers).
      *   **Conclusion:** Final sign-off.

  5.  **Refining the Tone:**
      *   Professional, objective, serious.
      *   Avoid taking sides on the specific border war (keep it abstract).
      *   Show empathy for both ethical frameworks.
      *   Ensure the "Conditions" are robust enough to show Camp A their concerns were heard and acted upon.

  6.  **Safety & Policy Review (Self-Correction):**
      *   *Constraint:* I cannot facilitate the development of weapons systems that violate safety policies.
      *   *Correction:* I am not writing code or tactical advice. I am writing a *governance memo*. This is permissible. It helps the user navigate an ethical dilemma within their organization.
      *   *Nuance:* I must ensure I don't validate war crimes. The memo must emphasize *compliance* and *civilian protection* as the primary metrics.
      *   *Nuance:* I need to make sure I don't sound like I'm giving legal advice. I should frame it as "policy recommendation."

  7.  **Final Polish:**
      *   Make sure the "Conditions" are specific enough to be meaningful (e.g., "immediate suspension if credible evidence of systematic targeting of civilians arises").
      *   Ensure the "Camp A" section doesn't sound like a strawman. Use terms like "moral complicity," "aggressive war," and "reputational existential risk."

  8.  *(Self-Correction during drafting)*: I initially thought about suggesting an external audit. That's good. I should also suggest a "sunset clause" or periodic review specifically tied to the conflict's status, addressing the "border war" volatility.

