prompt: |-
  ok so this didn't happen to me but two of my friends got into it at lunch and i cant stop thinking about who's actually right. our friend group has this unspoken rule that nobody's on their phone at the table. last week Marcus was scrolling instagram basically the whole lunch and Jenna called him out on it in front of everyone. problem is Jenna's on her phone sometimes too, though how much exactly kind of became part of the argument. they went back and forth over text after and its still kind of a whole thing:

  marcus: lol you calling ME out, you're on your phone at lunch just as much as i am
  jenna: ok but that doesnt make what i said untrue, you WERE on it the entire time
  marcus: sure, but calling someone out isnt just stating a fact, its acting like the rule applies to me and not you, and it applies to both of us equally
  jenna: so nobody whos ever glanced at their phone gets to say anything when someone's on it for 40 straight minutes?? thats insane
  marcus: thats not what im saying. theres a difference between glancing at a text sometimes and doing what YOU do, which is scroll for like 10 min most days while acting like ur the one enforcing the pact in the first place

  feels like a bigger question than just phones tbh. can you go through it move by move and say who's actually more right at each point, not just who wins overall? and is there some angle you think both of them are missing?
