          *   Verdict: Marcus is wrong on the rule violation. Jenna is right on the principle but maybe wrong on the *method* (public shaming vs. private nudge).

      *   *Move 2: Marcus's Opening Text ("lol you calling ME out...")*
          *   Argument: Tu Quoque (You also do it).
          *   Analysis: Classic deflection. Just because someone else breaks a rule doesn't mean *this* breach didn't happen. However, it highlights hypocrisy.
          *   Verdict: Marcus is logically weak here (two wrongs don't make a right), but socially pointing out inconsistency is valid.

      *   *Move 3: Jenna's Response ("ok but that doesnt make what i said untrue...")*
          *   Argument: Validity of the claim isn't negated by the speaker's behavior.
