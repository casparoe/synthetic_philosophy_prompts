      *   *Move 6: Marcus's Clarification ("thats not what im saying. theres a difference between glancing... and... scroll for like 10 min...")*
          *   Argument: Distinction between frequency/intent. Accusation of performative rule-keeping.
          *   Analysis: He clarifies the threshold. He attacks her *attitude* ("acting like ur the one enforcing the pact").
          *   Verdict: Marcus is right about the distinction in severity, but the attack on her character/attitude escalates conflict.

  3.  **Synthesize the "Who's Right" at Each Step:**
      *   Need to create a structured breakdown (e.g., Round 1, Round 2...).
