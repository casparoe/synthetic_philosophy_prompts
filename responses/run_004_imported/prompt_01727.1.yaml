          *   Verdict: Jenna is logically right here.

      *   *Move 4: Marcus's Counter ("sure, but calling someone out isnt just stating a fact...")*
          *   Argument: Enforcement requires moral standing/consistency. It's about the *dynamic*, not just the fact.
          *   Analysis: This is his strongest point. Social norms rely on mutual buy-in. If an enforcer is seen as a hypocrite, the enforcement feels like power-playing rather than community maintenance.
          *   Verdict: Marcus is socially/relationally right here.

      *   *Move 5: Jenna's Rebuttal ("so nobody whos ever glanced at their phone gets to say anything...")*
