  1.  **Analyze the Request:**
      *   **Scenario:** Two friends (Marcus and Jenna) had a conflict at lunch over an unspoken "no phones at the table" rule. Marcus was scrolling Instagram the whole time. Jenna called him out publicly. Marcus countered that Jenna also uses her phone. Jenna argues that her usage is less severe and doesn't disqualify her from speaking up. Marcus argues about hypocrisy and the *nature* of enforcing a rule you break.
      *   **Task:** Break down the argument "move by move," assessing who is "more right" at each stage (not just a final verdict). Also, identify a missing angle/perspective both might be overlooking.
      *   **Tone:** Objective, analytical, empathetic, nuanced (since it's a friendship dynamic).

  2.  **Deconstruct the Argument (Move by Move):**

