answer: |-
  The allocation notification chimed at 10:04 AM. Elias tapped his wrist, acknowledging the credit. Twelve hours this week. He had spent four of them supervising a thermal regulation grid that managed itself, and eight on a committee to decide the shade of blue for the new transit hubs. It was work in the way that moving a pebble from one side of a path to the other is work.

  He sat on the terrace of their unit. The air was scrubbed clean, smelling faintly of jasmine and ozone. Below, the city sprawled in white curves and green terraces. No smoke, no noise, no visible poverty. The absolute needs, as the history files called them, had been met generations ago. Food, shelter, health, connection—it was all guaranteed. The bread was not just spread thin on the butter; the table was groaning under the weight of it.

  And yet, Elias felt a tremor in his hands. A low-frequency hum of anxiety that no medication seemed to tune out.

  "You're doing it again," Mara said. She stepped out from the living module, holding two glasses of synthetic wine. She was wearing the tunic of the Aesthetic Guild, soft grey linen. She was trying, he knew. They were all trying.

  "Doing what?"

  "Checking the metric."

  Elias lowered his wrist. "Just checking the time."

  "It's the same thing." Mara sat beside him. She was beautiful, in the way that people were now—genetically smoothed, well-rested, unburdened. But her eyes held a sharpness that the rest of her lacked. "We have the evening free. I thought we could go to the Archive. They're displaying the pre-Correction paintings. The ones with the brushstrokes."

  "I saw them last cycle," Elias said.

  "And?"

  "And they were fine."

  Mara sighed, a sound of genuine frustration. "Elias, you know the triad. Love, Beauty, Knowledge. These are the states of mind. This is what we're *for*."

  "I know the triad, Mara. I recited it in Primary."

  "Then recite it with your body." She leaned forward. "Keynes knew. He said the problem wasn't the economics. He said the problem was us. That we'd be nervous wrecks because we weren't built for paradise."

  "Keynes also said we'd work fifteen hours," Elias muttered. "We work twelve. We're beating the forecast, and I still want to scream."

  This was the texture of it. The absolute needs were satisfied, yes. But the relative needs—the urge to be better, faster, smarter than the person next to you—had not evaporated. They had just metastasized. Since no one was starving, status became the only currency left. People competed for the most obscure knowledge, the most nuanced appreciation of art, the most perfectly calibrated relationships. It was a tournament with no prize, played on a field that never ended.

  "I don't want to go to the Archive," Elias said. "I want to… I don't know. Build something."

  "We have fabricators for that."

  "No. I mean with my hands. Something that could fail."

  Mara looked at him, her expression softening into pity. "That's the old instinct. The scarcity instinct. If you build a chair and it breaks, someone sits on the floor. Why does that matter? The fabricator makes a new one in seconds."

  "Because if it breaks, I did something wrong," Elias said. "There's a consequence. There's a edge to press against."

  He stood up and walked to the railing. The city hummed. It was a society of gardeners tending a garden that grew itself. Keynes had imagined a secular religion of contemplation. He had thought that once the struggle for subsidence ended, humanity would drift naturally into the appreciation of the good and the true. He had assumed, as a young man under Moore, that people were rational enough to be happy with beauty.

  But Keynes had been wrong about the wiring.

  "I went to the clinic yesterday," Elias said quietly.

  Mara stiffened. "For the tremor?"

  "For the restlessness. They call it 'Purpose Deficit Disorder' now. They offered me a simulation package. Hard Mode."

  "Hard Mode?"

  "It's a virtual environment. Scarcity simulation. You have to manage resources that run out. You can lose things. People in the sim can die."

  Mara set her wine down hard on the table. "You're joking. You want to pay to suffer?"

  "I want to feel *real*," Elias snapped. "I want to feel the weight of a choice that isn't about which shade of blue looks better on a train. I want to be tired in a way that sleep doesn't fix."

  "That's sick, Elias. That's looking backward."

  "Is it?" He turned to her. "Or is it admitting that the 'Good Life' is a lie? Keynes knew it. In his memoirs. He said he'd been naive. He said he left out how irrational we are. We aren't contemplative beings, Mara. We're strivers. We're hunters who forgot how to stop running."

  "We are what we chose to be," Mara said, standing up to face him. "If we go back to struggle, we undo everything. The suffering of the past… it wasn't noble. It was just pain."

  "It was *stakes*," Elias said. "Love, Beauty, Knowledge. They're luxuries. You can't contemplate beauty when you're safe forever. You just consume it. I looked at those paintings, Mara. I didn't feel love. I didn't feel awe. I felt like I was checking a box. *Appreciated art today. +10 social credit.*"

  He rubbed his face. The tremor in his hands had spread to his shoulders. It was the collective nervous breakdown Keynes had predicted, arriving a century late, not as a riot, but as a quiet, pervasive depression. A species bred to overcome obstacles, suddenly placed in a room with no walls, pacing until its paws bled.

  "So what do you want?" Mara asked. Her voice was tired. "Do you want to leave? Go to the Wild Zones?"

  "No. I just…" Elias looked out at the perfect city. "I want to know that if I stopped walking, something bad would happen. But nothing happens. The system catches us. The bread is always buttered."

  "We can try the simulation," Mara said softly. "Together. If that's what you need."

  Elias looked at her. He loved her. He did. But even that love felt weightless, untested by external pressure. There were no in-laws who disapproved, no financial stress, no fear of loss. It was a love suspended in amber. Perfect. Preserved. Dead.

  "If we do the sim," Elias said, "we know we can take the headset off. We know we're safe. It's play-acting struggle. It's just another leisure activity."

  "Then what is the answer?"

  "I don't think there is one."

  He walked back to the table and picked up his glass. The wine was perfect. It tasted of berries and oak, calibrated to his exact preference profile. It disgusted him.

  "Keynes thought we'd be like gods," Elias said. "But we're just bored animals in a very large cage."

  "We are not animals," Mara said, but she didn't sound convinced. She looked out at the city, at the lights beginning to glow in the twilight. "We have each other."

  "Do we?" Elias asked. "Or do we just have each other because there's no one else to fight?"

  Mara didn't answer. She picked up her glass and took a sip. She looked out at the horizon, where the sky was a flawless gradient of violet and orange. It was a beautiful sunset. It was engineered to be beautiful.

  "We have the evening," she said finally. "We don't have to decide the future of the species tonight."

  "No," Elias said. "We just have to get through the night."

  He drank the wine. It was excellent. He felt the warmth slide down his throat, and for a moment, the tremor in his hands stopped. He looked at Mara, really looked at her, trying to summon the Moore-ideal, trying to force his mind into the state of pure contemplation, to find the intrinsic value in her presence, in the light, in the silence.

  He felt nothing but the absence of pain.

  "Let's go to the Archive," Elias said.

  Mara nodded. She didn't smile. "Okay."

  They stood up together, leaving the glasses on the table. They walked toward the transit tube, stepping over the threshold of their home into the corridor. The lights dimmed behind them automatically. The system was working. The bread was spread. The butter was rich.

  Elias walked beside the woman he loved, through the city that had solved everything, and he wondered if the nervous breakdown would ever end, or if this was just what happiness felt like when it had nothing to bite onto. He didn't know. He just kept walking, one foot in front of the other, into the endless, frictionless evening.
