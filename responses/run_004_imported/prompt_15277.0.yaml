answer: |-
  The pen hovered over the line marked *Borrower's Signature*. The ink bead at the tip trembled, threatening to fall and blot the paper before Elias had even committed.

  "El?" Sarah said. She was across the kitchen table, her own stack of papers already signed, clipped neatly to the side. Outside, the rain blurred the yard of the house they were betting their next thirty years on. "You've been staring at that line for a minute."

  "It's the number," Elias said. He didn't look up.

  "The interest rate? We locked it in yesterday."

  "Not that. The months. Three hundred and sixty." He tapped the paper. "It's an assumption of continuity. It assumes the world stays legible for three hundred and sixty months. That the banks exist. That the property lines hold."

  Sarah sighed, the sound of patience wearing thin. "We've been over this. The inspection was clean. The school district is good."

  "It's not the house, Sarah. It's the *when*." Elias finally looked at her. He looked tired, the way he got after grading midterms, eyes focused on a pattern only he could see. "I was reading about the Doomsday Argument again. Carter and Leslie."

  Sarah rubbed her temples. "The end of the world stuff? Elias, we're buying a split-level in Ohio, not building an ark."

  "It's not about the end of the world. It's about statistics. It's about where we are in the line." He put the pen down and laced his fingers together. "Imagine an urn. You don't know how many balls are inside. You reach in and pull one out. It's numbered 60 billion."

  "Okay."

  "That's us, Sarah. Roughly. Sixty billion humans have lived and died before now. If I assume my birth is a random sample from the total set of all humans who will ever live..."

  " The Self-Sampling Assumption," Sarah recited. She knew his moods. When he got like this, she had to speak the language to pull him back.

  "Right. SSA. If I'm a random draw, it's statistically unlikely that I'm in the very first 5 percent of all humans. It's more likely I'm somewhere near the middle. If I'm near the middle, and I'm number 60 billion..."

  "Then the total number of humans isn't much higher," Sarah finished. "So the line ends soon. So we shouldn't buy the house."

  "So we shouldn't bet on the next thirty years," Elias corrected. "If the total population is capped near where we are now, and birth rates are collapsing... the math says the urn is almost empty. Signing this mortgage is like betting on a horse that's already crossed the finish line."

  He picked up the pen again, but didn't lower it. The logic felt cold and solid in his hand, a shield against the risk. If the argument held, his hesitation wasn't anxiety; it was rationality.

  Sarah reached across the table and covered his hand with hers. Her skin was warm. "You're forgetting the counter-argument. The one you told me about when we were dating, when you were scared to propose."

  Elias blinked. "SIA?"

  "Self-Indication Assumption," she said. "The fact that I exist *at all* is evidence that the urn is big."

  "That's the rebuttal," Elias said, his voice low. "But it's controversial. It says the mere fact of my existence makes a larger total population more likely. Because if there are going to be a trillion humans, there are more 'slots' for me to occupy. But does existence really count as evidence? Or is it just tautological?"

  "And the Reference Class," Sarah pressed. "Who are you drawing from? 'All humans'? Or 'All humans who live in stable democracies in the 21st century'? Or 'All humans who are sitting at a kitchen table considering a mortgage'?"

  Elias frowned. "If I narrow the reference class too much, the argument dissolves. That feels like cheating. Like rigging the urn."

  "Or like being specific," Sarah said. "You aren't a random human, Elias. You're not a random draw from the Paleolithic. You're a draw from the set of people who *made it*. The survivors. If the urn was going to run out, you wouldn't be here to draw the ball."

  "That's the Survivorship Bias counter to the Doomsday Argument," Elias muttered. "It cancels out the probability shift. But how do I know which assumption is true? SSA or SIA?"

  "You don't." Sarah squeezed his hand. "That's the point. The math doesn't decide the future. It just describes your uncertainty."

  She let go and leaned back, gesturing to the papers. "If you use the Doomsday logic, you don't buy the house. You don't have kids. You don't plant trees. You live in the moment because the moment is all the statistics guarantee. But if you use the SIA logic, the fact that we are here, planning, worrying, loving... that's evidence of a future large enough to contain us."

  Elias looked at the pen. The ink bead had dried. He wiped it on his thumb.

  He thought about the urn. He thought about the billions of shadows behind him, and the empty space ahead. Was he standing at the beginning, the middle, or the end? The logic was pristine, a perfect crystal structure in his mind. But it offered no traction. It told him where he *might* be, but not where he *should* stand.

  "If I sign," Elias said quietly, "and the SSA is right... I'm signing a contract with a ghost."

  "And if you don't," Sarah said, "and the SIA is right... you're throwing away a life that was statistically probable."

  The rain tapped against the window. A car drove past, headlights sweeping across the ceiling, illuminating the dust motes dancing in the air. For a second, they looked like a swarm, countless and chaotic, settling only when the light passed.

  Elias took a breath. He didn't feel convinced. He didn't feel like the paradox had been solved. He just felt the weight of the pen, and the warmth of the table, and Sarah waiting on the other side of the paper.

  He lowered the pen. The nib touched the fiber of the page.

  He signed.

  The ink flowed, dark and permanent. He dated it. Then he pushed the paper toward her.

  "Okay," he said.

  "Okay," Sarah replied. She didn't smile, not exactly. She just stacked the papers, her movements efficient, betting on the morning.

  Elias watched her. He wondered if, in a thousand years, someone would find the deed in an archive, or if it would burn with everything else. He realized he would never know the answer to the math problem. He only had to live the variable.

  "Let's go see the backyard," he said.

  They stood up together, leaving the pen on the table, pointing toward the door.
