answer: |-
  1. **The "Causal Revolution" has migrated from computer science and philosophy into epidemiology and social science, with researchers explicitly citing Pearl and Woodward to justify their methods. Why do you think this specific framework has resonated with empiricists now, when philosophical accounts of causation have often been treated as metaphysical luxuries?**

     *Follow-up:* (Anticipating she will say it's because interventionism mirrors experimental practice): If the appeal is purely pragmatic—that it matches what scientists *do*—does that suggest the theory is a normative guide for inquiry, or are you claiming it actually captures the metaphysical structure of the world?

  2. **The standard charge against interventionism is that it's circular: you define a "cause" in terms of an "intervention," but an intervention is just a special kind of cause. How do you respond to the claim that this makes the account viciously circular?**

     *Follow-up:* (Anticipating she will argue it's not reductive but clarifying): If you concede that this isn't a reductive analysis that eliminates causal terms, doesn't that limit the theory's philosophical payoff? Is it illuminating the *concept* without actually explaining the *relation*?

  3. **Mendelian randomization uses genetic variants as proxies for interventions we can't run, like lifetime exposure to LDL cholesterol. Since we can't surgically manipulate a person's cholesterol for decades, does interventionism license these causal claims, or does it declare them meaningless because the strict intervention conditions aren't met?**

