answer: |-
  The hologram of the mandible hovered between them, rotating slowly in the dim light of the lab. It was a beautiful thing, rendered in pale blue wireframe: the jaw of a second-generation Martian, dense and ridged.

  "It's an anchor," Elias said, tapping the air. The ridge on the chin flared gold at his touch. "Look at the muscle attachment points. The *orbicularis oris* inserts here, deeper than any Earth human. It allows for a tighter seal on the filtration masks during the dust storms. Natural selection favored the ridge because it saved lives."

  Mara didn't touch the model. She stood with her arms crossed, watching the rotation. "Or," she said, "the ridge is just where the radiation shielding calcifies."

  Elias sighed, the sound sharp in the quiet room. "We've been over this. The calcification is uniform. The ridge is localized."

  "The calcification is uniform *except* where the mandibular plates fuse," Mara countered. "The body lays down extra calcium to block cosmic rays. Where the two growth fronts meet, they overlap. A buildup. A seam. You're seeing a purpose where there is only architecture."

  Elias swiped the hologram away. The room plunged into near-darkness, save for the status lights on the server racks. "If you're right, it's a spandrel. A useless triangle of space beneath the dome. If I'm right, it's a window designed for light. And the difference determines whether we approve the therapy for Toby."

  Their son. The name hung in the air, heavier than the gravity outside. Toby was Earth-born, scheduled for transfer to the colony in six months. Without the genetic modification to increase bone density and lung capacity, the Martian environment would crush him. But the modification came with the ridge.

  "If we engineer the ridge," Elias said, his voice softer now, "we ensure he can seal his mask. We give him the adaptation."

  "If the ridge is a by-product," Mara said, stepping into the light, "then engineering it in isolation is dangerous. You're trying to build the space between the arches without building the arches. You might trigger the calcification without the structural integrity. His jaw could shatter under the pressure differential."

  Elias walked to the window. Outside, the city of New Ares glowed under its dome, a mosaic of lights against the rusted dark. "Gould and Lewontin would be proud of you. You see accident everywhere. I see function. One of us is keeping Toby safe, Mara. The other is paralyzed by complexity."

  "I'm not paralyzed," she said, coming up behind him. "I'm reading the blueprint. You're reading the brochure."

  He turned to face her. The exhaustion was etched deep around his eyes. They had been colleagues before they were lovers, debaters before they were parents. This argument was the shadow that had followed them from the university to the colony board. Elias, the optimist who believed evolution was a clever engineer; Mara, the skeptic who knew evolution was a tinkerer working with scrap.

  "The board meets at 0800," Elias said. "If we don't sign off, Toby stays on Earth. He'll never know Mars. He'll never know *us*."

  "And if we sign off, and I'm right? He fractures his jaw on landing. He chokes because the seal fails."

  "We run the stress test," Elias said.

  "We did. It passed."

  "Run it again. With the variable for micro-fractures in the calcification overlap."

  Mara looked at him. "That simulation takes twelve hours. The board meets in eight."

  "Then we ask for a delay."

  "They won't grant it. The transport window is closing." Elias reached out, taking her hands. His palms were warm. "Mara. Look at me. I want him safe more than I want to be right. But I also know that biology is rarely accidental. Traits that costly don't persist unless they pay rent."

  "Spandrels cost nothing," she whispered. "They are just the space left over."

  "Nothing in biology is free."

  They stood there, the hum of the servers filling the silence. The tension between them wasn't just about the jawbone. It was about how they moved through the world. Elias saw a path and walked it, trusting the ground would hold. Mara checked the bedrock first, terrified of the sinkhole hidden by the grass.

  Mara pulled her hands away and walked back to the console. She woke the hologram. The blue jaw spun again, innocent and terrible.

  "Show me the muscle insertion," she said.

  Elias hesitated, then manipulated the controls. The soft tissue overlay appeared, red fibers anchoring into the bony ridge.

  "It fits perfectly," he said. "Too perfectly for an accident."

  "Or," Mara said, leaning in, her face illuminated by the blue glow, "the muscle grew *to* the ridge. The bone came first. The architecture dictated the function, not the other way around." She paused. "If we engineer the bone, the muscle will follow. But if the bone is weak..."

  "Then the muscle tears."

  Mara closed her eyes. She thought of Toby, sleeping in the next room. She thought of the domes of Venice, the mosaics Gould had loved. The spandrels were beautiful, but they weren't designed. They were inevitable. To treat them as designed was to misunderstand the building.

  But you still had to live in the building.

  "If we delay," Mara said, "he stays on Earth. He grows up breathing nitrogen and oxygen, under a sky that doesn't kill him. But he won't be one of us."

  "If we proceed," Elias said, "he might break. But he might fly."

  Mara looked at the ridge on the hologram. It was a triangle of bone, nestled between the arches of the jaw. A space to be filled.

  "I hate your optimism," she said, her voice thick. "It feels like a just-so story. A tale you tell to make the chaos feel ordered."

  "And I hate your caution," Elias replied. "It feels like you're waiting for permission from a universe that doesn't care."

  She reached out and touched the ridge. It didn't feel like a mistake. It felt like a scar. Maybe that was the truth. Adaptation and spandrel weren't opposites; they were layers. The bone grew for radiation (the arch), the ridge formed as a seam (the spandrel), and the muscle learned to use it (the adaptation). Three truths, stacked.

  "We don't engineer the ridge," Mara said suddenly.

  Elias froze. "What?"

  "We engineer the density. We engineer the lung capacity. But we leave the mandibular fusion natural. We let his body decide if it needs the ridge."

  "That's not how the therapy works. It's a package deal."

  "Then we modify the package." She turned to him, eyes fierce. "We tell the board the ridge is a structural risk. We force them to decouple the variables. It will take more time. It will cost more credits."

  "They'll say no."

  "Then we stay on Earth." She stepped closer to him. "I would rather he be an Earthling who breathes easy than a Martian who chokes on a story we told ourselves."

  Elias looked at the hologram, then at her. He saw the fear in her, but he also saw the rigor. She wasn't just blocking him; she was protecting the integrity of the design. She was refusing to mistake the gap for the window.

  He exhaled, a long, slow release of tension. "You think I'm Panglossian."

  "I think you want the world to make sense," she said. "I want the world to be safe. There's a difference."

  Elias reached out and turned off the hologram. The blue light vanished, leaving them in the warm amber of the emergency lamps. "If we fight the board, they might revoke our clearance. We could lose our jobs. We'd be stuck here, or sent back."

  "Then we're together," Mara said. "And Toby is whole."

  Elias nodded slowly. He understood then that the argument wasn't about the bone. It was about the weight of certainty. He carried the weight of hope; she carried the weight of doubt. Neither could carry the other's load, but they could share the burden.

  "Okay," he said. "We file the objection. We argue the spandrel."

  Mara let out a breath she seemed to have been holding for years. She leaned her forehead against his shoulder. "Thank you."

  "Don't thank me," Elias murmured into her hair. "If you're wrong, and the ridge *was* necessary for the seal... we might still lose him to the dust."

  "Then we'll know," Mara said. "We won't have guessed. We'll know."

  Outside, the great dome of the city arched over them, a massive curve of glass and steel holding back the void. Beneath it, the spaces between the supports were dark, filled with shadows that might have been storage, or waste, or nothing at all. They were just spaces. But they were part of the structure.

  Elias wrapped his arms around her. "Let's go check on him."

  Together, they walked out of the lab, leaving the blue jaw spinning in the dark, an unanswered question hanging in the silence, waiting for the morning light to tell them if it was a window, or just a wall.
