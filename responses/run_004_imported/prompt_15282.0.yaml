answer: |-
  You are absolutely not being a pedant, and you are not overthinking this. Your gut is detecting a very real, well-documented distinction in logic and linguistics. Your roommate is wrong: these are not just tense variants of the same sentence. They are doing fundamentally different logical work.

  The difference lies in the distinction between an **indicative conditional** (Statement 1) and a **counterfactual conditional** (Statement 2).

  Here is the principled breakdown of why your brain is rejecting the second sentence, and why that distinction matters for how you treat Dana.

  ### 1. The Logic: Fact vs. Possibility

  **Statement 1:** *"If Dana didn't take it, the delivery guy did."*
  *   **Type:** Indicative Conditional.
  *   **Function:** This is a deduction about **actual facts**.
  *   **The Logic:** You have established a "closed world" assumption: only two people had access. Therefore, mathematically, if $A$ is false, $B$ must be true.
  *   **Why it feels solid:** It doesn't speculate on *why* or *how*. It just processes the constraints of the situation. It is a binary elimination based on evidence (access). It is about **what happened.**

  **Statement 2:** *"If Dana hadn't taken it he probably would've grabbed something eventually."*
  *   **Type:** Counterfactual (Subjunctive) Conditional.
  *   **Function:** This is a speculation about **alternative realities**.
  *   **The Logic:** This asks us to imagine a world where Dana *didn't* do it, and then predict the behavior of the delivery guy in that imaginary world.
  *   **Why it feels slippery:** It is no longer about the specific theft. It is about the delivery guy's *character* and *propensity*. It introduces the word "eventually," which admits he might not have taken it *that day*, but claims he was destined to take something *someday*.
  *   **The Shift:** Statement 1 is about **culpability for a specific act**. Statement 2 is about **dangerousness as a trait**.

  ### 2. The "Guys Like That" Problem

  The second sentence smuggles in a massive generalization that the first sentence does not contain.

  *   **Sentence 1** relies on **opportunity**. (He was there; therefore he could have done it.)
  *   **Sentence 2** relies on **profiling**. ("Guys like that always do.")

  When your roommate says Sentence 2, she is shifting the argument from "Who had access?" to "Who is the kind of person who steals?" This is a logical leap. Even if the delivery guy had access (Sentence 1), it does not logically follow that he is a compulsive thief who *would have* stolen something eventually (Sentence 2).

  Sentence 2 is a **justification**, not a deduction. It is designed to make you feel okay about suspecting the delivery guy (or conversely, to make you feel like the theft was inevitable regardless of who did it). It minimizes the specific agency of the crime by turning it into a statistical probability.

  ### 3. The Sports Analogy

  You mentioned your friends brought up: *"If he hadn't missed that shot we would've won."*

  That analogy actually proves **your** point, not your roommate's.

  *   **The Sports Claim:** This is a counterfactual. It is notoriously hard to prove. Maybe if he hadn't missed, the other team would have stolen the ball. Maybe the clock would have run out. We feel that "weird feeling" because we know it's speculative.
  *   **Sentence 1 (Dana/Delivery):** This is *not* like the sports claim. This is more like: "If the score isn't 100, it must be 98." (Given only two scoring options).
  *   **Sentence 2 (Dana/Delivery):** This *is* like the sports claim. It says, "If Dana hadn't stolen it, the delivery guy was going to steal something anyway." That is a speculation about causality and character, just like the sports game.

  If your friends feel the sports argument is "weird" or debatable, they should admit Sentence 2 is equally debatable. Sentence 1 is the only one that is logically airtight (assuming your premise about access is correct).

  ### 4. Does this change how you should treat Dana?

  **Yes. Significantly.**

  Here is why the distinction matters for your conscience and your roommate dynamic:

  **Sentence 1 keeps the investigation honest.**
  It acknowledges that based on access, it is a 50/50 split between Dana and the Delivery Guy. It forces you to look for evidence (fingerprints, alibis, pawn shop records) to distinguish between the two. It treats Dana as a suspect based on *circumstance*.

  **Sentence 2 corrupts the investigation.**
  It suggests that the Delivery Guy's *nature* makes him guilty, or conversely, that the theft was "going to happen anyway."
  *   **If used against the Delivery Guy:** It's prejudice. It assumes guilt based on his job or demeanor ("guys like that") rather than evidence.
  *   **If used against Dana:** It's a rationalization for giving up. It implies, "Even if Dana is innocent, a criminal was in the building, so we should still be on high alert," which subtly keeps the suspicion on the building's security rather than exonerating her.

  ### The Verdict

  Your roommate is conflating **probability** with **inevitability**.

  *   **Sentence 1** says: "One of these two people is the thief." (Logical Necessity).
  *   **Sentence 2** says: "The delivery guy is a thief by nature." (Character Assumption).

  You are right to feel that Sentence 2 needs a "whole separate argument to back it up." To make Sentence 2 true, your roommate would need to provide evidence of the delivery guy's past criminal history or psychological compulsion. Sentence 1 requires no such evidence; it only requires the floor plan and the logbook.

  **Advice for the argument:**
  Tell your roommate: *"The first sentence is about who had the **opportunity**. The second sentence is about who has the **character**. You can't prove opportunity with a character argument. If we want to stop side-eyeing Dana, we need to stick to the first sentence (opportunity) and find evidence, not the second sentence (profiling), which just assumes guilt based on vibes."*

  You aren't overthinking it. You're thinking clearly.
