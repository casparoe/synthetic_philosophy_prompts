  If we lower Player 1's maximum possible utility (the ideal point) without changing the shape of the frontier near the agreement, KS shifts the solution toward Player 2, even though the actual feasible options near the deal didn't change.
  Elias will call this "dictatorship of the unattainable."

  7.  **Final Review against constraints:**
