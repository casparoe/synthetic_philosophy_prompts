answer: |-
  **Setting:** *A conference room in a neutral hotel in Geneva. 2:00 AM. A whiteboard is covered in convex sets, utility frontiers, and disagreement points. Empty coffee cups litter the table.*

  **Characters:**
  *   **ELIAS:** Consultant for the Corporation. Pro-Nash.
  *   **SARAH:** Consultant for the Union. Pro-Kalai-Smorodinsky.

  **ELIAS:** (Uncapping a marker) We're circling the drain, Sarah. The feasible set is defined. The disagreement point is zero. We maximize the product of the gains. It's the only solution that satisfies symmetry, Pareto efficiency, and independence of irrelevant alternatives. It's stable.

  **SARAH:** Stable for whom? Your solution is stable like a rock is stable. It doesn't move even when the ground shifts under it. You're clinging to Independence of Irrelevant Alternatives (IIA) like it's holy writ.

  **ELIAS:** Because it's logical. If an option wasn't going to be chosen, removing it shouldn't change the choice. That's basic consistency. If I offer you a deal, and I take away an option you were never going to pick, why should our agreement change?

  **SARAH:** Because the *context* of the offer changed. That's what IIA ignores. It treats the bargaining set as a static menu. But negotiation is about leverage. Leverage is defined by what *could* happen, not just what *will* happen. That's why we use Kalai-Smorodinsky. We preserve the ratio of maximum potential gains.

  **ELIAS:** (Turns to the board) You preserve the ratio to the "ideal point." The utopia point. The one where I get my maximum possible and you get yours, which is usually impossible. You're anchoring the deal to a fantasy.

  **SARAH:** I'm anchoring it to opportunity. Look, let's talk about why your IIA is actually dangerous. I have a specific case for you. The "Rotated Frontier" problem.

  **ELIAS:** I know the literature, Sarah.

  **SARAH:** Then you know the violation of Individual Monotonicity. Imagine our current feasible set. My client's maximum possible utility is 10. Yours is 10. The Nash solution splits it roughly 5-5, depending on the curvature. Now, suppose my client discovers a new technology. It doesn't change the current efficient frontier much, but it expands *my* maximum potential to 15. Yours stays at 10. My leverage has objectively increased. I have a better BATNA in the long run, a higher ceiling.

  **ELIAS:** But the immediate surplus hasn't changed.

  **SARAH:** The *set* has changed. Under Nash, because of the way the product maximization works with convex curves, it is mathematically possible that my client's share *decreases* when their maximum potential increases.

  **ELIAS:** (Pauses, hand hovering over the board) Only if the curvature shifts drastically to favor marginal gains on your side.

  **SARAH:** It happens. And when it does, your solution punishes improvement. My client brings more value to the table, expands the horizon, and Nash says, "Sorry, the math says you get less." That's not just counter-intuitive; it's perverse. It incentivizes hiding potential. If I know using Nash, expanding my upside might lower my settled share, I won't tell you about the new technology. IIA blinds you to the change in the ideal point.

  **ELIAS:** (Puts the cap back on the marker, turns to face her) Okay. I grant you that. In specific non-linear geometries, Nash violates Individual Monotonicity. It's the classic trade-off. But you're acting like Kalai-Smorodinsky doesn't have its own pathology. You swapped IIA for Monotonicity. You fixed the leverage problem, but you broke consistency.

  **SARAH:** I broke the tyranny of the irrelevant.

  **ELIAS:** No, you introduced the tyranny of the unattainable. Let's talk about the "Phantom Alternative."

  **SARAH:** (Crosses arms) Go ahead.

  **ELIAS:** Imagine a feasible set. The frontier is a straight line. My max is 10, yours is 10. KS gives us 5-5. Now, imagine I have an option—a contract clause, a side deal—that is technically feasible but dominated. It's inside the set. It doesn't touch the frontier. But, suppose this option increases *my* theoretical maximum utility to 12, even though it's not on the efficient frontier.

  **SARAH:** If it's not on the efficient frontier, it's not feasible in a Pareto sense.

  **ELIAS:** But it's in the set $S$. Under KS, the solution is determined by the line connecting the disagreement point to the *ideal point*. If I add a dominated option that pushes my ideal point from 10 to 12, the line rotates. The intersection with the efficient frontier shifts. I get more. You get less.

  **SARAH:** Because your potential increased.

  **ELIAS:** But the option was *dominated*. No rational actor would ever choose it. It was irrelevant to the actual division of value. Under Nash, adding a dominated option changes nothing. IIA holds. The solution stays at 5-5. Under your solution, I can manipulate the outcome by inventing a "dream scenario" that we both know will never happen, just to shift the ideal point. I can lobby for a clause I know I'll never use, just to move the KS line.

  **SARAH:** (Leans forward) That's not a bug, Elias. That's signal. Even if the option is dominated, the fact that it *exists* changes the power dynamic. It shows capacity. If you *could* get 12, even if you don't, it means you have resources I don't. KS captures that asymmetry. Nash pretends we're blind to it.

  **ELIAS:** It's not asymmetry, it's noise. You're letting the solution depend on the shape of the set in regions we will never visit. That makes the outcome arbitrary. If I can change the deal by adding a useless option to the contract draft, the solution isn't robust. It's gameable.

  **SARAH:** And Nash is rigid. You're prioritizing mathematical cleanliness over economic reality. Let's look at the "Shrinking Pie" scenario. Suppose the total surplus shrinks, but it shrinks only on *your* end. Your maximum possible drops. My maximum stays the same. Intuitively, I should gain relative share. My relative strength increased.

  **ELIAS:** Naturally.

  **SARAH:** Nash agrees. But suppose the shape of the shrinkage is weird. Suppose we remove options that were never going to be chosen anyway—options high up on your axis that were already inefficient. Under IIA, Nash says the solution *cannot change*.

  **ELIAS:** Because those options were irrelevant!

  **SARAH:** But they defined the *range* of the negotiation! By removing them, you've lowered my opponent's ceiling. My leverage relative to his has gone up. But because those options weren't the Nash point, Nash ignores the change. It treats a negotiation where you can get 100 the same as one where you can only get 50, provided the immediate surplus is identical. That disconnects the agreement from the strategic reality.

  **ELIAS:** (Walks to the window, looks out at the dark street) You're arguing that the shadow of the unchosen matters.

  **SARAH:** I'm arguing that bargaining isn't just about splitting what's on the table. It's about splitting the *opportunity*.

  **ELIAS:** But if the opportunity doesn't translate to utility, it's a mirage. Look, I understand the Monotonicity argument. I do. It feels unfair if my client improves their position and ends up with less. But consider the alternative. Your solution requires us to agree on the "Ideal Point."

  **SARAH:** Which is just the max of each axis.

  **ELIAS:** Which is often undefined or infinite in real-world scenarios. How do we define the maximum utility for a corporation in a merger? It's unbounded. Nash only requires we know the feasible set *now*. KS requires we know the absolute limits of the universe. It demands more information than exists.

  **SARAH:** Then we normalize. We use the best plausible outcomes.

  **ELIAS:** "Plausible." Now we're bargaining over the axioms of the solution before we even start the deal. Nash is self-contained. It doesn't need external reference points.

  **SARAH:** It's self-contained because it's solipsistic. It assumes the negotiation happens in a vacuum. (She walks to the board and erases a section of the frontier). Here's the real issue, Elias. You trust IIA because you want stability. You want to know that if we agree on a set of options, removing the losers doesn't change the winners. That's about procedural justice.

  **ELIAS:** Exactly.

  **SARAH:** But I care about substantive justice. If the landscape changes, the split should reflect the new balance of power. Individual Monotonicity ensures that if I bring more to the party, I don't get sent home with less food. You're asking my client to accept a formula where their gain is a function of your gain, but their *potential* is irrelevant.

  **ELIAS:** (Turns from the window) And you're asking my client to accept a formula where their liability is determined by a dream they can't catch. If I have a high variance—huge upside, huge downside—KS penalizes me for the upside even if the risk makes it unlikely. Nash looks at the risk-adjusted frontier. KS looks at the peak.

  **SARAH:** Because the peak defines the relationship.

  **ELIAS:** The peak defines the fantasy. The tangent defines the deal.

  **SARAH:** (Sighs, picks up her pen) So we're back to it. IIA vs. Monotonicity. Consistency vs. Sensitivity.

  **ELIAS:** Stability vs. Responsiveness.

  **SARAH:** If we use Nash, I have to warn my client: Do not reveal your full capacity. Keep your best options off the table, or the math will punish you.

  **ELIAS:** And if we use KS, I have to warn mine: Do not let them define the ideal point. If they inflate their maximum claim, even artificially, they steal value from the efficient frontier.

  **SARAH:** (Looks at him) So both solutions create perverse incentives.

  **ELIAS:** (Sits down) Every axiom creates a loophole. IIA creates blindness. Monotonicity creates manipulation.

  **SARAH:** Which poison do we pick?

  **ELIAS:** (Looks at the board, at the intersecting lines) Nash is easier to defend in court. It's the standard. "Irrelevant alternatives" sounds reasonable to a judge.

  **SARAH:** "Individual Monotonicity" sounds reasonable to a worker. "If I work harder, I shouldn't get less."

  **ELIAS:** We aren't in court. We aren't on the floor. We're in this room.

  **SARAH:** (Traces the KS line with her finger) Your IIA case... the Phantom Alternative. You're right. If I can shift the ideal point by adding a useless option, that's a vulnerability.

  **ELIAS:** And your Rotated Frontier... if expanding the set reduces your share, that's unacceptable.

  **SARAH:** So we modify the set definition.

  **ELIAS:** How?

  **SARAH:** We restrict the feasible set $S$ to only Pareto-efficient options before applying KS. No dominated alternatives. That kills your Phantom.

  **ELIAS:** That helps. But it doesn't fix the information problem. Defining the ideal point is still subjective.

  **SARAH:** Then we define it jointly. As part of the pre-negotiation. We agree on the "max claims" before we agree on the split.

  **ELIAS:** (Nods slowly) A meta-negotiation. We bargain over the axioms' inputs before we run the axiom.

  **SARAH:** It kicks the can. But it might get us to morning.

  **ELIAS:** (Picks up the marker again) If we do that, I need a cap on the ideal point. No infinite utilities.

  **SARAH:** Agreed. But if the frontier rotates, the solution moves. No hiding capacity.

  **ELIAS:** (Draws a new line) Fine. But we document the "irrelevant" options we're stripping. Just in case.

  **SARAH:** (Smiles faintly) Just in case the judge cares about IIA more than Monotonicity.

  **ELIAS:** Exactly. Cover both bases.

  **SARAH:** Coffee?

  **ELIAS:** Please. Black.

  **SARAH:** (Heading for the door) Don't get used to this, Elias. Next time, I'm bringing in the Egalitarian Solution.

  **ELIAS:** (To the board) Over my dead body.
