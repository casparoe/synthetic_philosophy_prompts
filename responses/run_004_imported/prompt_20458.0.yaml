      *   *The Argument:* Jinadatta presses hard. "You heard the description. You saw the beast. Where is the third thing?" Rudra must show the *gap* that only *Upamana* fills.
      *   *The Climax:* They don't go to the forest. The forest comes to the mind. Or they recall the moment. Let's have them reenact the cognition.
      *   *Key Insight:* The knowledge isn't "This is like a cow." It's "The word 'Gavaya' applies to *this*." The connection between word and object is the unique knowledge.

  8.  **Refining the Philosophy (Self-Correction):**
      *   *Buddhist View (Dignaga/Dharmakirti):* *Upamana* is reducible to *Sabda* (Testimony) because the initial description is verbal, and the recognition is memory of that verbal instruction applied to perception.
      *   *Nyaya View:* *Sabda* gives the relation generally. *Pratyaksha* (Perception) gives the particular. *Upamana* is the specific cognition of the relation *in this instance* which was previously unknown.
      *   *Make sure Jinadatta sounds smart.* He shouldn't say "It's magic." He should say "It's economy of ontology. Don't multiply entities."

