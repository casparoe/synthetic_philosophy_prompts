      *   *Selection:* Let's go with a legal/inheritance dispute tied to a royal decree. A king has issued a challenge: Identify a specific animal/object to claim a land grant. The identification relies on *Upamana*. If *Upamana* isn't valid knowledge, the claim is void. This makes the epistemology practical and urgent.

  3.  **Character Development:**
      *   **Protagonist (Nyaya):** Vatsyayana (or a fictional disciple). Let's create a fictional scholar, *Aksapada* (referencing the founder) or simply *Govinda*, a Nyaya logician. Let's make him older, weary but sharp. Name: *Madhava*.
      *   **Antagonist (Rival):** A Buddhist Logician (Dignaga school tends to reject Upamana, reducing it to Inference/Testimony). Name: *Dharmakirti* (too famous). Let's use *Sthiramati*.
