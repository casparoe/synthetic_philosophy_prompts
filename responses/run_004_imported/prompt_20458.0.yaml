      *   *Nyaya Defense:* Testimony gives the relation (name <-> form). Perception gives the form. But the *knowledge of the name applied to this specific form* is a new cognition born of the connection. It's not just memory. It's a distinct operation.

      *Wait, let's make it a debate between two old rivals.*
      *   **Vasubandhu (Buddhist)** vs. **Uddyotakara (Nyaya)**. (Using historical names adds weight, but might constrain me. Let's use fictional names to allow creative freedom with the dialogue).
