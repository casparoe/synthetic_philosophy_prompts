      *   **Conflict:** Nyaya (pro-Upamana as independent *pramana*) vs. Rival (Buddhist or Mimamsa, arguing it reduces to Perception, Inference, or Testimony).
      *   **Requirement:** The argument must drive the plot. The rival's objection must be strong (no strawmen). The characters must *need* to win this argument (stakes beyond abstract philosophy).
