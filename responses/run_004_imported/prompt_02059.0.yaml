answer: |-
  The porcelain Ming vase lay in pieces on the workbench, a jagged mosaic of blue and white ruin. Lena stared at it, her hands still trembling. She had knocked it during the final polish, moments before the museum's board arrived for the pre-exhibition inspection. If the damage was logged, her career at the Vane Institute was over. She would be labeled careless, uninsurable, finished.

  Arthur, the senior conservator, walked in. He saw the shards. He saw the terror in Lena's eyes. He didn't speak. He simply locked the studio door, pulled up a stool, and began mixing the adhesive. It would take twelve hours of uninterrupted, flawless work to make the fracture invisible. It was a violation of protocol to hide damage, a risk to his own license if the stress fracture was ever detected by UV light later. But he started working.

  He didn't ask for a promise. He didn't ask for a signed agreement. There was no leverage left once the vase was whole; once the board signed off and Lena was safe, Arthur could never force her to do anything. In fact, the rational move for Lena, once the crisis passed, would be to distance herself from the incident entirely. To claim the restoration was standard procedure, or better yet, to hint that her own innovative techniques had improved the piece's stability. That would secure her future. Admitting Arthur's intervention would only highlight her clumsiness and his rule-breaking.

  But Arthur knew Lena. He had watched her for three years. He knew she possessed a specific, stubborn granularity of character. He saved her not because she promised to repay him, but because he was confident she was the kind of person who would repay him even when it hurt.

  Six months later, the exhibition was a triumph. The vase was the centerpiece. During the press conference, a reporter asked about the structural integrity of the piece, noting the unusual stability of the base. It was the perfect opening. Lena could have claimed a new polymer technique she had been developing. It would have been her breakthrough, her ticket to a headhunting offer from a private collector.

  Arthur stood in the back, arms crossed. He watched her. He knew that from a purely causal standpoint, speaking now gained her nothing. She was already safe. The vase was already admired. Lying would maximize her prestige; telling the truth would cost her credit for the innovation and remind everyone of the near-disaster.

  Lena adjusted the microphone. "The stability is due to a traditional adhesive method," she said, her voice steady. "Specifically, a technique mastered by Arthur Vane. I attempted to modernize it and failed. The piece survives only because he intervened to correct my error."

  The room turned to Arthur. The narrative shifted instantly. He was the master who saved the day; she was the humble apprentice who honored the craft over her own ego. Her stock value as an independent innovator dropped; his legacy was secured for his retirement. She had acted against her narrow professional self-interest. She had paid the debt when no one was holding the gun.

  Arthur nodded, once. He hadn't saved her because he thought she would make a rational choice later. He saved her because he knew she was capable of being irrational in the way that matters.

  This scenario vindicates a dispositional picture of rationality, where it is rational to cultivate a character that commits to future actions even when immediate maximization dictates reneging. Plain "do what's best for you right now" reasoning fails because it renders the agent untrustworthy *ex-ante*, causing them to lose the beneficial opportunity entirely.
