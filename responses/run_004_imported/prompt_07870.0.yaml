  ok this is gonna sound random but hear me out. i fell down a lesswrong rabbit hole on "acausal trade/threats" -- the idea that agents who can predict or simulate each other can cooperate, or even blackmail each other, with zero causal contact between them (like across branches of the multiverse or whatever) -- and this proposed defense called "surrogate goals," where you make yourself artificially care about some fake goal so that if you ever get threatened acausally, the threatener targets the fake thing instead of what you actually value. we're covering david lewis in philosophy class rn (the possible worlds unit) and it's bugging me that he's both THE modal realist (every possible world is just as concrete and real as ours, just causally sealed off from us) and THE causal decision theorist (only the causal consequences of your choices are supposed to matter, ignore newcomb-y correlations). those feel like they'd pull him in opposite directions once you bring acausal stuff into it. what do you think lewis would actually say about acausal threats, and would he think "surrogate goals" is even a coherent defense, or would he just say the whole threat is confused given his own commitments?
