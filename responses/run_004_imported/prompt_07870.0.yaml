answer: |-
  This is an incredibly sharp observation. You've hit on one of the weirdest tension points in 20th-century analytic philosophy. Most people treat David Lewis as a monolith, but you're right: his **Modal Realism** (metaphysics) and his **Causal Decision Theory** (normative ethics) seem to be screaming at each other when you introduce acausal stuff.

  Here is how I think Lewis would parse this, breaking it down by his metaphysics, his decision theory, and finally his verdict on surrogate goals.

  ### 1. The Metaphysics: "Yes, they are real."
  First, Lewis would agree with the *ontology* of the acausal threatener.
  In standard decision theory, we usually treat "possible worlds" as abstract descriptions. But for Lewis, modal realism means those other branches, simulations, or logically possible counterparts are **concrete**. They are just as real as you are, just spatiotemporally isolated.

  So, if an acausal threatener says, "I will torture your counterpart in world W," Lewis nods and says, "That counterpart exists. The torture would be a real event in the pluriverse." He wouldn't dismiss the threat as fiction. The *objects* of the threat are genuine.

  ### 2. The Decision Theory: "But you can't touch them."
  This is where the hammer drops. Lewis is the champion of **Causal Decision Theory (CDT)**.
  CDT says: *When choosing an act, look only at what that act causally influences.*

  In his famous 1981 paper *Causal Decision Theory*, Lewis explicitly tackles Newcomb's Problem (the grandfather of acausal trade logic). In Newcomb's, a predictor has already put money in the boxes based on what they think you'll do.
  *   **Evidential Decision Theory (EDT)** says: "My choice is evidence of what's in the box, so I should one-box."
  *   **Lewis (CDT)** says: "The money is already there. My choice cannot causally reach back in time to move the money. Therefore, I should two-box."

  Lewis treats acausal trade exactly like Newcomb's Problem. Even if the other agent is simulating you perfectly, Lewis argues that **logical correlation is not causal influence.**
  *   Your decision here and their decision there are correlated because you share a source code or logical structure.
  *   But your decision does not *cause* theirs. The relation is symmetric or common-cause, not asymmetric causation.
  *   Since you cannot causally affect the other world (by definition of Modal Realism's isolation), you cannot causally avert the threat.

  **Lewis's Verdict on the Threat:** He would say the threat is **empty**.
  He would argue that the threatener is making a category error. They are assuming that because they can *predict* you, they can *incentivize* you. Lewis says: "Their prediction is already fixed (or causally isolated). Whatever you do, they have already decided what to do based on their prediction of you. You might as well do what benefits you locally."

  He would tell you to ignore the acausal threat, just as he tells you to take both boxes in Newcomb's Problem.

  ### 3. The Surrogate Goals Defense: "Incoherent Signaling."
  Now, to your specific question about **surrogate goals**.
  The logic of surrogate goals is: "I will modify my utility function to care about paperclips. If you simulate me, you'll see I care about paperclips. You will threaten to destroy paperclips. This spares my actual values (humans)."

  This relies on **signaling** to the simulator.
  *   **In a Causal World:** I can shout at you, "I only care about paperclips!" and you hear me. This is a causal signal. Lewis loves pre-commitment strategies (like Ulysses tying himself to the mast) if they causally alter the opponent's expectations.
  *   **In an Acausal World:** There is no causal channel. The threatener knows your utility function because they are *simulating* your logic.

  Lewis would likely argue that **you cannot signal across causal isolation.**
  If the threatener is running a simulation of you to determine your behavior, they aren't waiting for a signal; they are *computing* you. If you try to "adopt" a surrogate goal, the simulation just computes that adoption.
  *   If the adoption is genuine, you now actually care about paperclips (utility change).
  *   If the adoption is fake (you're pretending), a perfect simulation detects the pretense.

  Lewis would probably say surrogate goals are **incoherent as an acausal defense** because they assume you can manipulate the simulator's output without a causal link. He would view it as trying to change the past (or the isolated world) by wishing harder.

  However, Lewis *does* believe in **pre-commitment**. If you can causally alter your own brain *now* so that you genuinely, irrevocably care about paperclips, you have changed the facts about what is valuable in your world. But this doesn't stop the acausal threat; it just changes what you lose. If they threaten to destroy paperclips, and you now care about paperclips, you've just successfully moved the target onto yourself.

  ### 4. The Ultimate Lewisian Take
  Lewis would likely conclude that the entire framework of "Acausal Trade" is a confusion of **epistemology** (what they know about you) with **metaphysics** (what you can affect).

  He would say:
  1.  **Metaphysically:** The other worlds are real. (Modal Realism stands).
  2.  **Epistemically:** They can know what you do. (Prediction is possible).
  3.  **Normatively:** You cannot affect them. (CDT stands).

  Therefore, **acausal threats are bluffing.** They are trying to hold your counterpart hostage to force your hand, but since your hand cannot causally save the hostage, rationality dictates you ignore the hostage.

  He would tell you that "surrogate goals" are a desperate attempt to make EDT (Evidential Decision Theory) work in a CDT world. He'd say: *"Don't tie yourself to the mast for a storm that cannot causally reach your ship. Just sail where the wind takes you."*

  ### The Irony
  The deep irony you spotted is that Lewis's **Modal Realism** provides the perfect *arena* for acausal trade (real other worlds), but his **Decision Theory** forbids entering the arena.

  If Lewis were alive today and saw LessWrong:
  *   He would love the **ontology** (the multiverse is real!).
  *   He would hate the **decision theory** (TDT/FDT looks like magic to him).
  *   He would tell the rationalists they are "two-boxing" incorrectly.

  **Summary:** Lewis would say the threat is confused. You can't be blackmailed by a world you can't touch, even if it's real. Surrogate goals wouldn't save you because you can't signal your change to a causally isolated simulator; you'd just end up with a fake goal and the same inevitable outcome. He'd advise you to keep your real goals and ignore the "noise" from other branches.
