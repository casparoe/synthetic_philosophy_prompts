      *   *Requirement 3: Hypocrisy/Money.*
          *   *Draft:* You take money for this stuff you hate.
          *   *Refinement:* You mock the buyers, yet you sell to them. Is your reform just a better sales pitch?
          *   *Kepler's Deflection:* I need to feed my family/serve the Emperor.

      *   *Additional Questions (Need 8-10 total):*
