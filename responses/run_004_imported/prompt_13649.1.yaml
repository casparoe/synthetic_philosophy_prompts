prompt: |-
  I'm several chapters into a historical novel about Kepler's years at the imperial court, and I've reached a scene I keep rewriting: a skeptical patron who has just commissioned a nativity for his infant son finally corners Kepler about the contradictions in his professional life. I want the exchange to read as a genuine philosophical interrogation rather than an excuse for exposition, so please draft eight to ten pointed questions the patron could put to him, each keyed to something Kepler actually argued rather than the flattened modern image of a secret unbeliever cashing in on superstition. I need at least one question on how he distinguished the "vulgar" astrology of zodiac signs, houses, and planetary rulerships he mocked from the harmonic-aspect astrology he defended as sound; one that presses him on what, exactly, in an otherwise mechanical heaven is supposed to register those harmonies and translate them into terrestrial or psychological effects; and one that puts real weight on the gap between his contempt for the credulous public and his own dependence on commissions like the one my patron has just paid for. For each question, add a short note on the deflection Kepler would most plausibly reach for, so the patron's follow-up can cut it off.
reasoning: |-
