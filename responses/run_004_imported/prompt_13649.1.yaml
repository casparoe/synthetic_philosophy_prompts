          *   *The Role of God:* Is this theology or physics?
          *   *Prediction Accuracy:* Why do you hedge your predictions?
          *   *The Calendar:* You made a calendar predicting a peasant revolt. Was that science or politics?
          *   *Tycho's Legacy:* Tycho observed; you theorize. Did you betray observation for harmony?
          *   *The Soul:* If the Earth has a soul, is it pagan?
          *   *Utility:* If it's uncertain, why practice it?

  4.  **Refining and Polishing (Matching the Tone):**
      *   The patron should sound educated, wealthy, perhaps a bit weary of courtly games.
      *   Kepler's deflections should sound like his actual writings (earnest, slightly pedantic, theological).
      *   Ensure the distinction between *physica* (physics) and *mathematica* is touched upon.

  5.  **Final Review against Constraints:**
