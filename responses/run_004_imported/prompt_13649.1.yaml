              2.  Mechanism: How does a mechanical heaven register harmonies and affect Earth/souls?
              3.  Hypocrisy: Contempt for the credulous public vs. dependence on commissions (like the nativity).
          *   Format: Question + Short note on Kepler's plausible deflection (to be cut off by the patron).

  2.  **Historical & Philosophical Grounding (Kepler's Astrology):**
      *   *Key Text:* *De Fundamentis Astrologiae Certioribus* (On the More Certain Fundamentals of Astrology, 1601). This is the primary source for his reformed astrology.
      *   *Core Belief:* Kepler believed in a geometric/harmonic universe (God created the world according to number/measure).
      *   *Rejection:* He rejected the traditional Chaldean/Arabic rules (zodiacal signs, planetary dignities, houses) as arbitrary human inventions without physical cause.
      *   *Acceptance:* He accepted "aspects" (angles between planets) because they correspond to musical harmonies (consonances) which affect the Earth's soul (*Anima Terrae*) and human souls.
      *   *Mechanism:* The Earth has a soul (animism) that perceives the geometry. Weather is the primary physical effect; human temperament is secondary/psychological.
      *   *Motivation:* He needed money (Imperial Mathematician salary was often unpaid) and believed he was reforming a corrupted science, not practicing superstition. He saw himself as a priest of nature, not a fortune teller.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Vulgar vs. Harmonic.*
          *   *Draft:* Why do you hate signs but love angles?
          *   *Refinement:* Make it sharper. You call the zodiac fiction, yet you cast horoscopes. Where is the line?
