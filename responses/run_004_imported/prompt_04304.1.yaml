      *   *Actually, there is a nuance:* Some scholars (like R. Yosef Qafih) note that Rambam's language in *Melachim* focuses on Torah law generally. But the *Mishneh Torah* is full of laws of sacrifices written in the future tense or as eternal obligations.
      *   *Key Point:* The liturgy Rambam codified (*Mishneh Torah*, Hilchot Tefillah) includes the request for the *Avodah* to return. He wouldn't codify a lie.
      *   *Refinement:* I need to be careful not to say "Rambam definitely thought X." I should say "The weight of Rambam's halakhic writing suggests X, despite the philosophical tension."

  7.  **Final Plan:**
