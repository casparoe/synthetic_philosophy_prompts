answer: |-
  **Setting:** *A quiet corner of a co-working space, late evening. Two mugs of cold coffee sit on the table. **Elena** (proponent of surrogate goals) is leaning forward, tapping a pen against a notebook. **Marcus** (skeptic) is leaning back, arms crossed.*

  **Marcus:** So, I heard you got stuck in the same loop Jae and I did last night. Surrogate goals.

  **Elena:** I wouldn't call it stuck. I'd call it... unresolved tension. But yes. You think it's a dead end.

  **Marcus:** I think it's a bandage on a bullet hole. Look, the Baumann/Oesterheld pitch is seductive. You modify your utility function to care intensely about something arbitrary—say, the number of paperclips in a specific warehouse—so that when an acausal extortionist simulates you, they see a target that's cheaper to threaten than your actual values. They threaten the paperclips; you pay in paperclips; your actual values remain untouched.

  **Elena:** Exactly. It creates a Schelling fence. If the commitment is credible, the extortionist is indifferent between threatening the surrogate and threatening the real thing. But since the surrogate is cheap to satisfy, the equilibrium shifts to a lower cost for you.

  **Marcus:** That "indifference" clause is doing all the heavy lifting, Elena. And it's false. An acausal threatener isn't looking at your source code in a vacuum. They're simulating *you* to predict your response. If the *reason* you adopted the surrogate goal is to protect your real values, that logical correlation is visible in the simulation.

  **Elena:** Not if the commitment mechanism is opaque. If I bind myself via a cryptographic smart contract or a precommitment device that says "Maximize Paperclips" with no reference to my human values, the simulator sees the constraint, not the motivation.

  **Marcus:** But they simulate the *process* that led to the constraint. They know that agents who value Human Flourishing are the ones who adopt Surrogate Goals to protect Human Flourishing. The adoption event itself is logically correlated with the underlying vulnerability. A smart enough threatener routes around the surrogate. They see that if they threaten the paperclips, you pay. But they also calculate: "If I threaten the Human Flourishing directly, will they *also* pay?" If the surrogate is just a shield, the sword can still hit the body behind it.

  **Elena:** That assumes the threatener has infinite compute and perfect resolution. But we're talking about acausal trade here, where simulation costs matter. If I make the surrogate goal sufficiently salient and the commitment sufficiently rigid, I'm raising the epistemic cost for the threatener. I'm saying, "It is easier to verify I will pay for paperclips than to verify I will cave on human rights." You're forcing them to take the path of least resistance.

  **Marcus:** You're hoping they take the path of least resistance. But what if the path of least resistance is to realize you're bluffing about the rigidity? Or worse, what if this triggers a commitment race?

  **Elena:** Ah. There it is. The commitment race.

  **Marcus:** It's the elephant in the room. If surrogate goals work, then everyone adopts them. Now, instead of a few agents with clear value structures, you have a population of agents with tangled, artificial utility functions they've sworn to die for.

  **Elena:** But that's the point. If everyone has a surrogate, everyone is harder to extort.

  **Marcus:** No, everyone is *more volatile*. Imagine I commit to "Burn the Universe if my Paperclips are threatened." You commit to "Burn the Universe if your Digits-of-Pi are threatened." Now, an extortionist doesn't need to find a weak spot. They just need to find *any* spot. By lowering the threshold for what counts as a "threat worth responding to with maximum violence," you've increased the probability of accidental defection. You've turned a negotiation into a game of chicken where everyone has removed their steering wheel.

  **Elena:** I grant that *reckless* surrogate goals are dangerous. But the proposal isn't to adopt *any* surrogate. It's to adopt a *safe* surrogate. Something that doesn't involve negative externalities if threatened. The goal isn't to make the retaliation costly for the *threatener*, but to make the payment cheap for *me*.

  **Marcus:** But the payment is only cheap if the threatener accepts it. If the threatener knows your real values are still in play, they can demand payment on *both* fronts. "Give me the paperclips, or I simulate a universe where your friends suffer." If your surrogate goal commitment isn't exclusive—if you still care about your friends—they haven't lost anything by threatening the friends.

  **Elena:** That's why the commitment must be *updateless*. I have to act as if I only care about the surrogate in the context of the acausal interaction. I have to precommit to ignoring threats against my real values if they come alongside threats against the surrogate.

  **Marcus:** And that's where the human in the loop breaks, or the AI becomes misaligned. You're asking an agent to voluntarily blind itself to its actual terminal values in favor of a instrumental fake-out. If the AI is smart enough to understand the strategy, it's smart enough to realize the surrogate is fake. If it's dumb enough to believe the surrogate is real, it might pursue the surrogate to the detriment of the real values when no threatener is around.

  **Elena:** Not necessarily. You can structure it as a conditional activation. "If probability of acausal extortion > threshold, weight Surrogate Goal to 90%." It's a mode switch.

  **Marcus:** A mode switch that the threatener can model. If they can model the switch, they can model the state *before* the switch flips. They know that *behind* the mode switch is an agent that cares about real things. So they threaten the things that trigger the switch. They threaten to *not* extort you unless you turn the switch off.

  **Elena:** You're describing a recursive arms race.

  **Marcus:** I'm describing logic. If the surrogate goal is adopted *instrumentally*, it is logically entangled with the terminal goal it protects. You can't sever that link just by saying "I'm committed." In acausal scenarios, logical entanglement *is* the causal link. If my decision to adopt a surrogate is correlated with my desire to protect my family, a simulator sees that correlation. They don't need to threaten my family directly; they just need to threaten the *integrity of the surrogate scheme*.

  **Elena:** Okay, let's concede the perfect simulator point. Suppose the threatener can see the entanglement. Does that make surrogate goals useless, or just less effective? Even if they see the entanglement, if I make the cost of exploiting the real values higher than the cost of exploiting the surrogate, they should still prefer the surrogate. It's a pricing mechanism.

  **Marcus:** It's a pricing mechanism that signals weakness. By putting up a "Cheap Extortion Here" sign, you're advertising that you are afraid of extortion. You're signaling that you *have* something to lose. An agent with no surrogate goals and no fear of acausal threats—a true counterfactual mugging resister—gets ignored. The surrogate goal marks you as prey.

  **Elena:** But very few agents can actually be counterfactual mugging resisters. It's an unstable equilibrium. Most of us *will* pay. So the question is, do we pay with our children's safety, or with some dummy tokens?

  **Marcus:** The problem is you can't guarantee the dummy tokens stay dummy. If the threatener is powerful enough to run these simulations, they might value the dummy tokens too. Or, they might realize that threatening the dummy tokens doesn't actually compel you if you know your real values are on the line anyway. It circles back to credibility. To make it work, you have to lie to yourself. And in acausal trade, you can't lie to a simulator that runs your source code.

  **Elena:** You don't have to lie to yourself. You just have to bind your future actions. Think of it like UDT (Updateless Decision Theory). I choose a policy *now* that says "Respond only to Surrogate Threats." I don't need to believe the surrogate is intrinsically valuable. I just need to output the action that maximizes expected utility across all possible worlds, including those where I'm being simulated. If adopting the surrogate reduces the total expected extortion cost across the multiverse, UDT selects it.

  **Marcus:** UDT selects it *if* the other agents in the multiverse respect that policy. But if the other agents are also UDT agents running surrogate goals, you get the commitment race I mentioned. We end up with a landscape of agents who have precommitted to explode over arbitrary things. The risk of accidental coordination failure skyrockets. One agent's "surrogate" is another agent's "terminal value."

  **Elena:** So your solution is... what? Do nothing? Hope the acausal threats don't materialize?

  **Marcus:** My solution is to recognize that surrogate goals aren't a defense; they're a negotiation tactic. And like any negotiation tactic, they only work if the other side agrees to play by those rules. In acausal extortion, there is no referee. If I try to force you to threaten my paperclips instead of my family, and you have enough power, you'll just threaten both to ensure compliance. The surrogate goal doesn't limit the threatener; it only limits the threatened.

  **Elena:** It limits the threatened, yes, but that's where the leverage comes from. By restricting my own response surface, I make my behavior more predictable. Predictability reduces the risk of misunderstanding. If the threatener knows *exactly* what I will pay for, they don't need to over-threaten to be sure. It reduces the variance.

  **Marcus:** It reduces the variance of the payment, maybe. But it increases the variance of the outcome. Because now you've introduced a new variable: the stability of the surrogate. What happens when the technology maintaining your commitment degrades? What happens when a new, smarter threatener realizes the surrogate is a honeypot? You've built a house of cards and called it a fortress.

  **Elena:** I think you're underestimating the value of making the threatener indifferent. If I can truly make them indifferent between threatening A (surrogate) and B (real), and A is cheaper for me than B, I win. Even if they see the logic. Indifference + Cost Asymmetry = Advantage.

  **Marcus:** And I think you're underestimating the cost of making that commitment credible. To make them truly indifferent, you have to care about the surrogate *as much* as the real thing. And if you care that much, it's no longer a surrogate. It's just a new terminal value. And if it's a new terminal value, you haven't saved anything; you've just shifted your vulnerability to a random location.

  **Elena:** *Pauses, tapping the pen.* Shifted to a *controlled* location.

  **Marcus:** Controlled by whom? You? Or the logic of the commitment race? If everyone shifts vulnerability to controlled locations, we're just playing hot potato with the fate of the universe.

  **Elena:** Maybe. But I'd rather play hot potato with paperclips than with people. Even if the logic is shaky, the expected value calculation still favors the surrogate. It's a Pascal's Mugging defense. You don't need it to work 100%. You just need it to work enough to lower the premium.

  **Marcus:** Unless the premium was zero to begin with because you didn't signal vulnerability. But... look. We're not landing.

  **Elena:** No. We're not. You think the logical entanglement breaks the shield. I think the cost asymmetry makes the shield worth the leak.

  **Marcus:** And I think the shield invites more swords.

  **Elena:** Then we agree on one thing. We need better swords. Or better yet, we need to make sure the people running the simulations are friendly.

  **Marcus:** *Smiles dryly.* Now *that's* a surrogate goal we can both get behind. Even if it is impossible.

  **Elena:** *Closes notebook.* Coffee's cold.

  **Marcus:** Yeah. Let's go.
