      *   Is it legal advice? I must include a disclaimer that I am an AI, not a lawyer.
      *   Is it accurate philosophically? Yes, it reflects the mainstream view in AI ethics (the gap is a problem to solve, not a loophole).

  9.  **Final Polish:** Ensure the distinction between *moral agency* (robot) and *legal personhood/liability* (company) is clear. Emphasize that "unpredictability" is a risk factor, not a defense.

