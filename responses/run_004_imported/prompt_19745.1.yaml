      *   *Key Insight 1: Correlation vs. Causation.* Ghazali anticipates Hume. In distributed systems, we often mistake correlation for causation (e.g., latency spike happened at the same time as deploy, but deploy didn't cause it).
      *   *Key Insight 2: The "Black Box" of Dependencies.* We treat services as having "power" (e.g., "Database failed"), but really it's a complex web of hidden states (God's "custom"). We don't *really* know why it worked before, only that it did.
      *   *Key Insight 3: Non-Determinism/Miracles.* "Heisenbugs." Things that shouldn't work, do. Things that always worked, suddenly don't. Ghazali explains this as God changing custom; engineers call it "non-determinism" or "race conditions."
