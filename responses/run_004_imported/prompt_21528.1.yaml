answer: |-
  It is a genuine pleasure to engage with someone who has stood on the front lines of a scientific revolution. The transition from static crust to plate tectonics is arguably the most significant paradigm shift in the history of geology, and having watched the "holdouts" wrestle with Wegener's data gives you a perspective most armchair philosophers lack.

  You have put your finger on a profound tension between formal epistemology and scientific methodology. To answer your question directly: **No, the dogmatism paradox does not vindicate the geologists who ignored the evidence for continental drift, nor does it suggest open-mindedness is a mistake.**

  However, your intuition that the argument is "valid-looking" is correct. It relies on principles of logic that hold up in mathematics but fray when applied to empirical science. Here is where the epistemology gets sticky, and why the paradox doesn't license scientific stubbornness.

  ### 1. The Truth Condition (The Easy Objection)
  The most immediate resolution concerns the definition of *knowledge*. In epistemology, knowledge is traditionally defined as *Justified True Belief* (plus some condition to handle Gettier cases). Truth is a necessary condition for knowledge.

  Since the static crust model was **false**, the senior geologists did not **know** it. They *believed* it with high confidence, and they had *justification* for it (based on the physics available at the time), but they lacked truth. Therefore, the first premise of the dogmatism paradox ("If I know claim $h$ is true...") was never satisfied.

  But I suspect you see through this. You are asking a counterfactual: *Even if the crust had been static, would they have been rational to ignore the evidence?* If the paradox holds, it suggests that *anyone* who claims to know something is rational to ignore counter-evidence. That is the dangerous implication we need to dismantle.

  ### 2. The Epistemic Access Problem (The Real Objection)
  The crux of the dogmatism paradox lies in the move from "$h$ is true" to "I **know** that evidence against $h$ is misleading."

  Let's say $h$ is "The crust is static." Let's say $e$ is "Paleomagnetic striping shows seafloor spreading."
  If $h$ is true, then $e$ is indeed misleading (because the crust isn't spreading).
  **However,** merely believing $h$ does not give you independent access to the falsity of $e$.

  To use the paradox to justify ignoring $e$, you must *already know* that $e$ is misleading *before* you examine it. But how do you know $e$ is misleading? Usually, you would determine that by checking if $h$ is true. But $h$ is the very thing $e$ is challenging.

  If you say, "I know $e$ is misleading because I know $h$," you are engaging in circular reasoning. You are using your belief in $h$ to validate the dismissal of evidence against $h$. In formal epistemology, this violates the **independence requirement** for defeating evidence. You cannot use a belief to immunize itself from revision unless you have an *independent* reason to doubt the source of the new evidence (e.g., "I know the magnetometer was calibrated incorrectly").

  Gilbert Harman, who formalized this, did not intend to endorse dogmatism. He used the paradox to show that **knowledge is defeasible.** His argument was actually that if you encounter evidence that *appears* strong against $h$, your claim to "know" $h$ is temporarily suspended until you can resolve the conflict. You cannot simply wave it away using the knowledge claim itself.

  ### 3. Fallibilism vs. Infallibilism
  The dogmatism paradox works best under an **infallibilist** conception of knowledge (where knowing something guarantees its truth). But science operates entirely on **fallibilism**.

  In science, "knowing" is shorthand for "holding a belief with such high justification that it would be unreasonable to doubt it *for now*." It is not a metaphysical guarantee.
  *   **Philosophical Knowledge:** If $S$ knows $p$, $p$ cannot be false.
  *   **Scientific Knowledge:** If $S$ knows $p$, $p$ is the best available model, but could be falsified by new data.

  Because scientific knowledge is fallible, the premise "I know any evidence against $h$ is misleading" is never empirically justified. You can never rule out the possibility that the new evidence is the signal and your old theory is the noise. The geologists who ignored Wegener were treating a fallible scientific model as an infallible philosophical truth.

  ### 4. The "Bootstrapping" Problem
  There is a specific logical flaw in the paradox known as "bootstrapping." If the paradox were valid, I could prove the reliability of my senses simply by trusting them.
  *   "I see a red wall."
  *   "If I see a red wall, my vision is working."
  *   "Therefore, I know my vision is working."

  This is obviously unsound. Similarly, the geologists couldn't say:
  *   "I believe the crust is static."
  *   "If the crust is static, this magnetic data is an anomaly."
  *   "Therefore, I know this magnetic data is an anomaly."

  To rationally disregard evidence, you need a **defeater** for the evidence, not just a commitment to the theory. You need to show the magnetometer is broken, not just that the theory says it should be.

  ### 5. Why Open-Mindedness is a Virtue
  You asked why scientists treat open-mindedness as a virtue if knowledge licenses ignoring evidence. The answer is that in empirical inquiry, **we never actually reach the state of knowledge required to trigger the paradox.**

  Open-mindedness is a heuristic designed to compensate for human fallibility. It is an acknowledgment that:
  1.  We might be wrong about $h$.
  2.  Even if we are right about $h$, we might not understand *why* (e.g., the crust didn't drift, but the magnetic poles reversed—a possibility not initially considered).
  3.  The cost of ignoring true counter-evidence (stagnation, error) is higher than the cost of investigating misleading counter-evidence (wasted time).

  The geologists who resisted plate tectonics weren't violating logic; they were violating **methodological norms**. They conflated *confidence* with *certainty*. The dogmatism paradox reveals that if we *had* certainty, we *could* be dogmatic. But since we never have certainty in geology (or any empirical science), we are never licensed to be dogmatic.

  ### Summary
  The dogmatism paradox is a valid argument about the *concept* of infallible knowledge. It shows that infallible knowledge would be closed to revision. But since scientific knowledge is inherently revisable, the paradox never gets off the ground in practice.

  Those senior colleagues weren't being rational in the scientific sense; they were protecting a paradigm by treating it as a priori truth rather than an empirical model. The paradox doesn't vindicate them; rather, it highlights why we must be very careful about claiming to "know" anything in the natural world with the kind of certainty that would allow us to stop looking.

  You witnessed the exact moment where "justified belief" failed to track "truth." That is the ultimate proof that while the logic of the paradox is tight, its application to science is category error. We map the rocks, but we don't own the territory.
