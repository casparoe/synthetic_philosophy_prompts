      *   **Specific Issue:** Whether ordinary perception (*pratyakṣa*) discloses real universals (*sāmānya*) or if universals are conceptual fictions via exclusion (*apoha*).
      *   **Problem:** Committee (Anglophone training) wants the disagreement staged as an *argument*, not just a summary of positions.
      *   **Task:** Write a dialogue (~1 page) between a Naiyāyika and a Buddhist Epistemologist.
      *   **Key Requirements:**
          *   Naiyāyika opens with the "parasitic" charge against *apoha* (you need the universal to define the exclusion).
          *   Buddhist gives the strongest available reply (not folding).
          *   Naiyāyika responds to *that* specific reply (no repetition).
          *   Evenly matched (no clear winner).
          *   Ends in unresolved tension.
          *   Tone: Anchored in Sanskrit categories (*svalakṣaṇa*, *savikalpaka*, *vikalpa*, etc.), though a nod to Western realism is permitted.
          *   Length: Roughly a page.

  2.  **Determine the Characters and Voice:**
      *   **Naiyāyika:** Needs to sound like a defender of *Vaiśeṣika*-inflected realism. Confident in the reality of relations (*sambandha*) and inherence (*samavāya*). Focus on the necessity of positive content for cognition to function.
      *   **Buddhist (Yogācāra-Sautrāntika blend typical of Dharmakīrti):** Needs to be sharp, focused on causal efficacy (*arthakriyā*), the uniqueness of particulars (*svalakṣaṇa*), and the pragmatic utility of concepts without ontological commitment.
      *   **Tone:** Scholarly, rigorous, respectful but adversarial (like a *vāda*).

  3.  **Drafting - Round 1: The Opening Salvo (Naiyāyika):**
      *   *Goal:* Attack *apoha* as circular/parasitic.
      *   *Argument:* To exclude "non-cow," you must know what "cow" is. If "cow" is just the exclusion, what grounds the exclusion?
      *   *Sanskrit terms:* *Apoha*, *Sāmānya*, *Vikalpa*, *Gauḥ* (cow).
      *   *Drafting thought:* "You say 'cow' means 'not non-cow.' But to draw that line, you need to know the positive form first. Otherwise, how do you know what to exclude?"

  4.  **Drafting - Round 2: The Buddhist Reply:**
      *   *Goal:* Defend *apoha* without positing a real universal.
      *   *Argument:* It's not a positive grasp first. It's a causal similarity. Particulars have the capacity to produce a similar cognition. We group them based on function (*arthakriyā*), not a shared entity. The exclusion is a mistake superimposed on similarity of effect.
      *   *Sanskrit terms:* *Svalakṣaṇa*, *Arthakriyā*, *Buddhi*, *Adhyavasāya*.
      *   *Drafting thought:* "We don't need a real 'cowness.' We see particulars that yield milk or pull plows. The mind constructs a unity based on that function. The exclusion is just the recognition that *this* functional cluster is distinct from *that* one (e.g., horse)."

  5.  **Drafting - Round 3: The Naiyāyika Counter:**
      *   *Goal:* Attack the "similarity of effect" argument.
      *   *Argument:* Similarity (*sādṛśya*) *is* a universal! If you admit particulars share a capacity, you admit a shared property. Also, perception (*pratyakṣa*) presents the object *as* a cow immediately (*savikalpaka*). If it were just exclusion, error would be impossible to distinguish from truth.
      *   *Sanskrit terms:* *Savikalpaka pratyakṣa*, *Sādṛśya*, *Bhrānti*.
      *   *Drafting thought:* "You smuggled realism back in. 'Capacity to pull a plow' is a property. If many particulars have it, it's a universal. Also, when I see a cow, I see *cowness*, I don't mentally subtract horses."

  6.  **Drafting - Round 4: The Buddhist Rejoinder:**
      *   *Goal:* Defend the nominalist account of similarity and perception.
      *   *Argument:* Similarity is just difference from others. Perception is non-conceptual (*nirvikalpaka*). The judgment "this is a cow" is post-perceptual. We don't need an ontological glue; causal continuity is enough.
      *   *Sanskrit terms:* *Nirvikalpaka*, *Anyāpoha*, *Saṃvṛti*.
      *   *Drafting thought:* "Similarity is just 'not different in this specific way.' Perception gives the point-instant; language cuts it up. We don't need an eternal entity to explain why we act successfully."

  7.  **Drafting - Round 5: Closing Tension:**
      *   *Goal:* Unresolved ending.
      *   *Naiyāyika:* Without real universals, language has no anchor.
      *   *Buddhist:* Language doesn't need an anchor; it needs utility.
      *   *Drafting thought:* End with the clash between Ontology (Nyāya) and Pragmatics/Efficacy (Buddhism).

  8.  **Refining and Polishing:**
      *   *Check Constraints:* Is it too long? (Keep it tight). Are the Sanskrit terms accurate? (Ensure *savikalpaka* vs *nirvikalpaka* is used correctly in this context—Nyāya accepts *savikalpaka* as perceptual, Buddhists do not).
      *   *Western Nod:* Add a brief line from the Naiyāyika about "Western realists."
      *   *Flow:* Ensure the arguments respond directly to the previous point.

      *(Self-Correction during drafting)*: I need to be careful with the Nyāya view on *savikalpaka*. For Nyāya, *savikalpaka* is valid perception that relates qualifier and qualified. For Buddhists, *savikalpaka* is conceptual construction, *not* perception. I must make sure this distinction drives the dialogue.
      *Correction:* The prompt asks for the flashpoint: does perception disclose the universal? Nyāya says yes (in *savikalpaka*). Buddhist says no (only *nirvikalpaka* is perception).
      *Refining the Opening:* The Naiyāyika should focus on the *apoha* circularity first as requested.

      *(Refining the Buddhist Reply)*: Dharmakīrti's strongest move is that *apoha* is not a positive entity but a cognitive error that works pragmatically. The "exclusion" isn't a real thing, it's the *absence* of otherness.
      *(Refining the Naiyāyika Counter)*: The "infinite regress" or "presupposition" argument is strong here. To exclude X, you need to identify X.

      *(Final Polish)*: Ensure the ending feels like a stalemate of first principles.

  9.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   ~1 page? (Will aim for ~600-800 words).
      *   Naiyāyika opens with parasitic charge? Yes.
      *   Buddhist strongest reply? Yes (causal efficacy/similarity).
      *   Naiyāyika responds to *that*? Yes (similarity implies universal).
      *   Evenly matched? Yes.
      *   Unresolved tension? Yes.
      *   Sanskrit categories anchored? Yes.

  10. **Writing the Dialogue.** (Proceeding to generate output based on these steps).
answer: |-
  **Naiyāyika:** Let us cut to the bone of your *apoha* doctrine. You claim the word "cow" does not refer to a real universal (*sāmānya*) inhering in particulars, but merely to an exclusion of what is not cow (*anyāpoha*). But this is circular. To exclude "non-cow," you must already possess a criterion for what counts as "cow" to be excluded. If the meaning of "cow" is *only* the exclusion, what grounds the exclusion? You are secretly parasitic on the very positive universal you claim to dispense with. You cannot draw a boundary without already knowing the shape of the territory.

  **Buddhist:** You mistake the mechanism. We do not posit a positive entity to ground the exclusion. Particulars (*svalakṣaṇa*) possess unique causal capacities (*arthakriyā*). Certain point-instants yield milk, pull plows, and low in a specific way. Others do not. The cognition of "cow" arises not because these particulars share an ontological glue, but because they produce a similar effect in the mind, leading us to treat them as one for pragmatic purposes. The exclusion is not a positive act of grasping a universal; it is the recognition that this causal cluster is *not* that causal cluster (e.g., horse). The "boundary" is drawn by difference, not by positive essence.

  **Naiyāyika:** But "producing a similar effect" *is* a shared property! If multiple particulars have the capacity to pull a plow, that capacity is a common character (*sāmānya-lakṣaṇa*). You have merely renamed the universal "causal efficacy" to avoid the word "universal." Furthermore, consider perception (*pratyakṣa*). When I see a cow, I do not first see a unique particular, then mentally subtract horses, and then arrive at "cow." My determinate perception (*savikalpaka pratyakṣa*) presents the universal *alongside* the particular immediately. The relation is disclosed, not constructed. If your view were true, all linguistic identification would be error (*bhrānti*), yet you rely on it to debate me.

  **Buddhist:** We agree that linguistic identification is, strictly speaking, error. Only non-conceptual perception (*nirvikalpaka pratyakṣa*) grasps the real—the *svalakṣaṇa*. But this grasp is ineffable. The moment you say "cow," you have entered the realm of construction (*vikalpa*). You claim the relation is disclosed; we say the relation is superimposed. As for "causal efficacy," this is not a shared entity existing in the objects. It is a description of how distinct particulars relate to *us*. Two distinct sparks may both burn cotton. Does "burning cotton" exist as a third thing between them? No. It is a convention (*saṃvṛti*) born of successful action. You demand an ontological anchor for language; we say language floats on utility.

  **Naiyāyika:** Utility without truth is mere coincidence. If there is no real connection between the word "cow" and the object's nature, why does the command "bring the cow" never result in someone bringing a horse? It is because the universal *cowness* restricts the application of the word. Your "convention" collapses into realism. Even your Western counterparts, the realists, saw that if concepts are to track the world, the world must have joints to cut. You leave us with a world of unique flashes and a mind imposing order. I say the order is found because it is there.

  **Buddhist:** And I say you reify the order because you cannot bear the flux. The "joints" you find are cuts made by the knife of interest. We do not deny successful action; we deny that successful action requires eternal entities. The command "bring the cow" works not because "cowness" is real, but because the exclusion of non-cows successfully filters the causal stream toward the object that yields milk. You end in an ontology of static forms; we end in a pragmatics of liberation. You ask if the universal is real; I ask if believing it is real stops suffering.

  **Naiyāyika:** Epistemology must track being, not merely therapy. If the universal is unreal, knowledge (*pramā*) is impossible.

  **Buddhist:** If the universal is real, change is impossible. And yet, here we speak.
