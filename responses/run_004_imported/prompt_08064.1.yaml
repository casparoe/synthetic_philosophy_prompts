prompt: |-
  So a few of us from a rationalist-adjacent Discord run recurring side bets at meetups (sports outcomes, elections, random nerdy stuff), and ages ago we agreed to size wagers as a % of a personal bankroll each person tracks, instead of fixed dollar amounts. Theres a running argument about how big that % should be though. Priya's take: work out whatever % maximizes your expected winnings over many bets and just bet that, scaling up with your edge, since leaving EV on the table is silly. Dave bets noticeably less than that using some formula he swears by, and even shades that number down even further because he says he's never fully sure of his edge estimate, which just makes Priya more convinced he's being timid. Whenever I've pushed him on why his number should beat straightforward EV maximization though, he kinda hand-waves it. Except I've watched this play out over a bunch of sessions now, and Priya's approach does seem to wipe people out eventually even though every single bet is +EV. So is Priya's reasoning actually flawed, or just differently risky? And is there a real principled case for Dave's more conservative number (both the base formula and the extra shading), or is he just risk-averse and dressing it up in math?
