      *   *So why the stall?* It's almost certainly **Common Priors** or **Bounded Rationality**. If priors differ, Aumann doesn't apply. If they aren't perfect Bayesians, Aumann doesn't apply.
      *   *Another angle:* Maybe they aren't updating on the *number* correctly. To update on someone else's probability, you need a model of *their* reliability and information structure. If I say 60%, do you treat that as a signal? How do you integrate it?
      *   *Key Insight:* Simply hearing a number isn't enough. You need to know *why* they moved. But the game rules say "not our reasons, just the number." This violates the spirit of rational updating because the number alone is a lossy compression of their information state. Without knowing the likelihood function the other person is using, you can't perfectly Bayesian update on their number.

