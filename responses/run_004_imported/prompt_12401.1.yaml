prompt: |-
  This has been bugging me and I feel like there should be a clean answer to it. I'm a phil PhD student working on formal epistemology, my housemate's doing an econ PhD, and we've got this running bit where whenever some contested question comes up (like whether the Fed cuts rates at the next meeting), we each quietly write down a number, then trade updated numbers back and forth over dinner -- not our reasons, just the number -- for like 4 or 5 rounds: "ok i'm at 62," "huh, i move to 55," and so on. Every time, the numbers drift toward each other but stall out something like 8-10 points apart and just sit there, even though we each think the other is roughly as good at this as we are and neither of us is holding back info on purpose. She mentioned once that if two people are reasoning correctly off the same starting assumptions, trading updated numbers like that back and forth is supposed to eventually force you all the way onto the same number, not just closer. So whos actually got the problem here -- are we just worse at this than we think, or is that "should converge exactly" claim wrong somewhere?
