  7.  **Final Polish:** Ensure the distinction between "explaining" a belief and "justifying" it is clear. (The "Is-Ought" problem is relevant too, but maybe too technical? I'll stick to Genetic Fallacy and Debunking). *Self-Correction:* Make sure to mention that Effective Altruism doesn't *require* giving 100%, usually just a significant portion. The partner's "nearly all" stance is the extreme end.

  8.  *(Self-Correction during drafting)*: I should be careful not to dismiss Effective Altruism entirely, as it has merit. The issue is the *argumentative move* the partner is using to dismiss family obligations, not necessarily the charity itself. Focus on the *meta-ethical* claim.

