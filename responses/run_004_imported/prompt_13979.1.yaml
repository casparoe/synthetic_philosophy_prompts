      *   *Nuance:* In logical time, "selecting" is a logical event. If my proof system is stronger, I might "act" before you in logical time.
      *   *Key Insight:* The user asks if "full updatelessness looks like the limiting case of... premature commitment." Yes, it does. That is exactly the critique. UDT maximizes ex-ante expected utility, but if the "ex-ante" point is before you know the other agent's move, you might lock in a suboptimal equilibrium.
