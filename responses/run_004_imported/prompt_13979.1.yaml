      *   *Commitment Races:* This is about *temporal* or *logical* ordering between *agents*. If Agent A commits before Agent B reasons about Agent A's commitment, A can force B to accommodate. If both try to do this, they crash (Chicken).
      *   *The Tension:* UDT says "Don't update on your specific situation before choosing your policy." Commitment Races say "Don't commit before you know what the other guy is doing."
      *   *Key Distinction:* UDT is about *intra-agent* consistency over time/states (resisting temptation). Commitment Races are about *inter-agent* strategic positioning (gaining leverage).
      *   *The "Limiting Case" Worry:* The user thinks UDT = "commit before thinking." But UDT = "commit before *observing indexical information*," not necessarily "commit before *computing logical implications*." However, in a multi-agent setting, logical implications include other agents' policies. If I commit to a policy before simulating you, I might lock in a bad deal.

