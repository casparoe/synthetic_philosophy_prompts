  7.  **Final Polish:** (Drafting the response with these points in mind.) *Make sure to emphasize that 'epistemic status' is a technological fix for Common Knowledge.* *Make sure to emphasize that 'steelmanning' is arbitrary in the Lewis sense (we could have chosen 'devil's advocate' as the norm).*

