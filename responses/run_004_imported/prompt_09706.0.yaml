answer: |-
  David Lewis's *Convention* provides a razor-sharp lens for analyzing the unwritten rules of epistemic communities. By treating norms like steelmanning, charitable interpretation, and epistemic disclaimers not as moral imperatives but as **coordination equilibria**, Lewis's framework shifts the focus from *why we should follow them* to *how we sustain the mutual expectations that make them rational to follow*.

  Here are the most important implications of Lewis's account for the norms structuring rationalist and epistemic forums, specifically regarding their emergence, their arbitrariness, and their fragility under scale.

  ### 1. Emergence Without Agreement: Precedent and Salience
  A common misconception is that community norms require a "social contract" or explicit founding document. Lewis explicitly rejects this. He argues that conventions arise through **precedent** and **salience** in the absence of agreement.

  *   **The Implication:** Norms like steelmanning likely did not start because users voted on them. They started because early participants (perhaps influenced by specific bloggers or moderators) modeled a behavior that solved a coordination problem (how to have productive discourse without endless misunderstanding).
  *   **The Mechanism:** Once a few key agents adopted "charitable interpretation" and it resulted in high-quality discussion (a payoff), it became a **salient focal point**. Newcomers observed this regularity. They conformed not because they agreed to, but because they expected others to continue the pattern and preferred to match that pattern to maximize their own communicative success.
  *   **For Your Communities:** This implies that "founding documents" (FAQs, Wikis) are secondary. The convention lives in the *history of play*. If the visible history of the forum shows high-quality steelmanning, the convention sustains itself. If the visible history degrades, the convention erodes, regardless of what the FAQ says. The convention is sustained by the *evidence* of past conformity, not the *promise* of future conformity.

  ### 2. The Function of 'Epistemic Status' as Common Knowledge Technology
  Lewis places immense weight on **Common Knowledge (CK)**. For a convention to hold, it is not enough that I know the norm; I must know that you know it, and know that you know that I know it. Without CK, I cannot be sure that my steelmanning will be met with reciprocity rather than exploitation.

  *   **The Implication:** Features like "epistemic status" disclaimers (e.g., *Speculation*, *Confident*, *Guess*) are not just metadata; they are **CK-generating mechanisms**.
  *   **The Mechanism:** When a user tags a post "Speculation," they are publicly signaling their expectations. They are saying, "I am conforming to the norm of humility; I expect you to conform to the norm of charitable critique rather than dismissal." Because this signal is public, it creates the infinite recursion of knowledge required for the equilibrium to hold.
  *   **For Your Communities:** When users stop using these tags, or when readers ignore them, the Common Knowledge degrades. If I don't know *that you know* I am just guessing, you might attack my guess as if it were a confident claim. I will then perceive your attack as uncharitable, and I will stop guessing publicly. The equilibrium collapses. Maintaining these norms requires active, visible signaling to replenish the stock of Common Knowledge.

  ### 3. Arbitrariness and the Existence of Rival Equilibria
  Lewis insists that a convention must be **arbitrary**: there must be at least one other possible regularity that could have solved the coordination problem just as well. Driving on the left is a convention only because driving on the right was also possible.

  *   **The Implication:** Steelmanning and "no ad hominem" are not the *only* stable states for a forum. There is a rival equilibrium: **combative discourse**. In a combative equilibrium, everyone attacks, everyone expects attacks, and everyone prefers to attack preemptively to avoid being dominated. This is the equilibrium of Twitter/X or political cable news.
  *   **The Mechanism:** Because the cooperative equilibrium is arbitrary, it is not "true" or "moral" in a Lewisian sense; it is merely *selected*.
  *   **For Your Communities:** This implies that when newcomers violate norms (e.g., by using ad hominem), they are not necessarily "irrational." They may be arriving from a different community operating under a different, stable equilibrium (the combative one). They are playing a different coordination game. Treating them as morally deficient is less effective than recognizing they are attempting to coordinate on a different equilibrium. The challenge is to make the cooperative equilibrium more salient and payoff-dominant than the combative one.

  ### 4. Erosion Under Scale: The Breakdown of Conditional Preferences
  This is the most critical implication for scaling communities. Lewis defines a convention as a regularity sustained by a **conditional preference**: I prefer to conform *if and only if* others conform.

  *   **The Implication:** As a community scales, the probability that *any specific interaction* will meet a cooperator drops. If I steelman you, but there is a 20% chance you (or the audience) will mock me for it, my expected utility for steelmanning decreases.
  *   **The Mechanism:**
      1.  **Dilution of CK:** In a small group, everyone knows everyone knows the norms. In a large group, I cannot assume you know the norms. I have to spend energy verifying if you are a "local" or a "tourist."
      2.  **Preference Mismatch:** Lewis's model assumes common interest. Scaling attracts participants whose utility function differs. A troll, or a status-seeker, may prefer *engagement* over *truth*. For them, the conditional preference to conform breaks down; they prefer to defect (post outrage) even if others conform, because outrage yields high status/clout in a large system.
      3.  **The Tipping Point:** Once the rate of defection (ad hominem, uncharitable reading) crosses a certain threshold, the conditional preference for the cooperators flips. It becomes rational for the good-faith actors to stop steelmanning and start defending aggressively. The community flips from the cooperative equilibrium to the combative equilibrium.
  *   **For Your Communities:** You should expect norms to erode not when people "forget the rules," but when the **statistical likelihood of reciprocity** falls below the cost of cooperation.
      *   *Scaling:* Rapid influx of newcomers dilutes the Common Knowledge.
      *   *Incentives:* If the platform design rewards engagement (replies) over quality, it alters the preference structure, making defection (controversy) more rational than conformity (nuance).

  ### 5. From Convention to Norm Enforcement
  Lewis distinguishes between a **convention** (sustained by mutual expectation and preference) and a **norm enforced by sanctions**. When a Lewisian convention is healthy, punishment is rare because no one wants to deviate. When punishment becomes common, it is a sign the convention is failing.

  *   **The Implication:** If your community finds itself increasingly relying on moderators, bans, and downvotes to enforce "charitable interpretation," the Lewisian convention has already degraded. You have moved from a coordination equilibrium to a Prisoner's Dilemma requiring external enforcement.
  *   **For Your Communities:** Heavy-handed enforcement is a lagging indicator of erosion. The leading indicator is the degradation of Common Knowledge (e.g., fewer epistemic tags, more "as you know" assumptions) and the shift in conditional preferences (e.g., users expressing exhaustion at "having to be nice").
  *   **Restoration:** You cannot restore a convention by writing more rules (agreement). You must restore it by **re-establishing precedent**. This often requires segmenting the community (creating a smaller space where CK is high again) or having high-status agents visibly model the cooperative equilibrium to make it salient again.

  ### Summary
  Under Lewis's analysis, the norms you value are not fragile moral flowers; they are **robust but precarious coordination equilibria**.
  1.  They arise from **precedent**, not agreement.
  2.  They are sustained by **Common Knowledge**, which features like epistemic tags help generate.
  3.  They are **arbitrary**, meaning they compete with rival equilibria (combative discourse).
  4.  They erode when **scaling** dilutes Common Knowledge or alters **conditional preferences** so that conformity is no longer the best response to conformity.

  To preserve these norms, do not focus on moralizing the rules. Focus on maintaining the **visibility of conformity** (so users see the norm is active) and the **clarity of expectations** (so Common Knowledge remains high). When the expectation of reciprocity fades, the convention dies.
