prompt: |-
  I have been rereading David Lewis's Convention, the book that gave the first rigorous philosophical treatment of common knowledge — a notion that gets invoked casually, and often loosely, in rationalist writing on social norms and coordination. On Lewis's actual analysis, a convention is an equilibrium solution to a recurring coordination problem, sustained not by agreement or enforcement but by common knowledge that everyone conforms, expects others to conform, and prefers to conform given that others do — and it remains arbitrary, since some other regularity could have served just as well. Please describe the most important implications of this account for the unwritten norms that structure the forums and communities I follow (steelmanning, charitable interpretation, 'epistemic status' disclaimers, norms against ad hominem). In particular, what does Lewis's framework imply about how such conventions arise without a founding agreement, and about when we should expect them to erode — say, as a community scales up quickly, absorbs newcomers who lack the relevant common knowledge, or attracts participants who never shared the underlying preference to conform?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Source Material:** David Lewis's *Convention: A Philosophical Study* (1969).
      *   **Core Concept:** Convention as a coordination equilibrium sustained by common knowledge (CK) of conformity, expectations, and preferences, characterized by arbitrariness.
      *   **Target Application:** Unwritten norms in rationalist/epistemic communities (specifically: steelmanning, charitable interpretation, 'epistemic status' disclaimers, norms against ad hominem).
      *   **Key Questions to Address:**
          1.  How do these conventions arise without a founding agreement?
          2.  When/why do they erode (scaling, newcomers, preference misalignment)?

  2.  **Analyze Lewis's Framework (Mental Sandbox):**
      *   *Coordination Problem:* A situation where agents have common interests in coordinating their actions (e.g., driving on the right vs. left).
      *   *Equilibrium:* A state where no one benefits from deviating unilaterally.
      *   *Common Knowledge:* I know $X$, you know $X$, I know that you know $X$, you know that I know $X$, ad infinitum. This is crucial for *sustaining* the convention.
      *   *Arbitrariness:* There must be at least one other possible equilibrium (e.g., driving on the left). If there's only one way to do things, it's not a convention; it's necessity.
      *   *Precedent/Salience:* How do we pick the equilibrium initially? Past experience or salient features.
      *   *Preferences:* Everyone must *prefer* to conform *conditional* on others conforming. If I prefer to defect even if you conform, it's not a convention (it might be a norm enforced by punishment, but Lewis focuses on coordination).

  3.  **Map Framework to Community Norms:**
      *   *Norms:* Steelmanning, charity, epistemic status, no ad hominem.
      *   *Are these Coordination Problems?* Yes. If everyone argues in good faith, discourse is high quality. If everyone attacks, discourse collapses. But if I steelman and you attack, I lose (wasted effort/vulnerability). So, I want to match your strategy.
      *   *Arbitrariness?* Yes. We could have chosen "aggressive debate style" (like some political forums) instead of "collaborative truth-seeking." Both are stable equilibria.
      *   *Common Knowledge:* Crucial. I need to know *that you know* that we are supposed to steelman. If I think you might be trolling, I won't steelman.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the prompt. Validate Lewis's definition (equilibrium, CK, arbitrariness). State the thesis: Lewis's framework reveals these norms as fragile coordination equilibria, not moral imperatives.

      *   **Implication 1: Emergence without Agreement (Precedent & Salience):**
          *   Lewis argues against social contracts.
          *   How does it start? A "focal point" (Schelling). Maybe a founding post, a charismatic moderator, or a small group modeling the behavior.
          *   *Application:* Early rationalist blogs (Overcoming Bias, LW 1.0). A few key figures modeled steelmanning. Others copied because it worked (salience).
          *   *Key Lewisian point:* It's not "we agreed to be nice." It's "I saw you be nice, I expect you to continue, I prefer to be nice if you are, and I know you know this."

      *   **Implication 2: The Role of Common Knowledge (The Glue):**
          *   CK is the stabilizer.
          *   *Application:* "Epistemic status" tags are *signals* designed to generate CK. When I say "Just a guess," I am signaling my expectation of how you should treat my post.
          *   *Application:* Public moderation logs or meta-posts reinforce CK ("Here is how we do things here").
          *   *Risk:* If CK breaks (I don't know if you know the norm), the equilibrium wobbles.

      *   **Implication 3: Arbitrariness and Alternative Equilibria:**
          *   These norms are not "true" or "moral" in a Lewisian sense; they are just *one* solution.
          *   *Application:* Twitter/X style discourse is *also* a convention (aggressive, pithy, ad hominem-heavy). It's a different equilibrium.
          *   *Insight:* Don't treat norm violators as immoral; treat them as playing a different coordination game.

      *   **Implication 4: Erosion and Scaling (The Core Conflict):**
          *   *Scaling:* Newcomers lack the history (precedent). They don't have the CK.
          *   *Preference Mismatch:* Lewis requires a *conditional preference* to conform. If new users prefer engagement/clout over truth-seeking (different utility function), the equilibrium collapses.
          *   *The "Bad Apple" Problem:* If I expect 10% of people to attack me, my expected utility for steelmanning drops. If it drops below the threshold, I defect.
          *   *Signaling Breakdown:* If 'epistemic status' tags are ignored or mocked, the signal loses value, CK degrades.

      *   **Implication 5: Maintenance vs. Enforcement:**
          *   Lewis distinguishes conventions from norms enforced by punishment (though they often overlap).
