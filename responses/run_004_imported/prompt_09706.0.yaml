  9.  *(Final thought)*: Ensure the distinction between "convention" and "norm" is clear. Lewis is analyzing conventions. Many forum rules are norms. The prompt asks to apply Lewis's account *to* these norms. I should argue that these norms *function* as Lewisian conventions when they are healthy, but degrade into something else (rules/enforcement) when the convention fails.

