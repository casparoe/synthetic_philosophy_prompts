          *   *Reality:* Communities often shift from Lewisian Convention to Social Norm (with sanctions) as scaling occurs. This is a sign the pure convention is failing.

      *   **Conclusion:** Summarize. The norms are fragile equilibria. Maintaining them requires active CK generation, not just rule-writing.

