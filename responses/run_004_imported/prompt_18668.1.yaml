answer: |-
  Two accuracy-first epistemologists, Alice and Bob, are filling out their annual performance reviews.

  **Alice:** "You rated yourself 'Exceeds Expectations' on epistemic accuracy? Again?"
  **Bob:** "It's not a rating, it's a dominance argument. If I rated myself lower, I'd be admitting my current credence function is suboptimal."
  **Alice:** "And?"
  **Bob:** "And if I believe my credence function is suboptimal, I'm rationally compelled to replace it. But since I haven't replaced it, I must believe it's optimal. So rating myself anything less than 'Exceeds Expectations' would be incoherent."
  **Alice:** "But I rated *myself* 'Exceeds Expectations' too. We can't both be the most accurate reasoner in the department."
  **Bob:** "Not in the world, no. But relative to our own expectation functions? Absolutely. The Immodesty Theorem says I *must* expect my scores to beat yours, and you *must* expect yours to beat mine."
  **Alice:** "So the only way to be logically consistent is to assume we're both better than each other?"
  **Bob:** "Basically. Epistemic humility is a dominated strategy. Narcissism is just the side effect of minimizing Brier scores."
