      *   *Option 2: Student Responsible.* (Stronger position. The core tenet of academic integrity is ownership of one's work. AI is a tool, like a calculator or a spellchecker, but citation verification is a critical academic skill. However, the nuance lies in the *approved* nature of the tool and its misleading interface.)
      *   *Decision:* The student bears ultimate responsibility, but the consequence should reflect the mitigating factor of the tool's misleading design. This balances Group A's principle (accountability) with Group B's concern (tool utility).
