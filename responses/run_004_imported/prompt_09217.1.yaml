answer: |-
  Thank you. Truly.

  When you write a novel, you do it in a room by yourself. You spend years talking to people who aren't there, imagining a reader who might never pick up the book. So, standing here, looking out at a hundred and fifty actual faces, is a kind of vertigo. It's a lovely vertigo, but it's disorienting.

  I need to start by grounding myself in the real, because this prize, the Hartleigh, is made of real things. It's made of the patience of my editor, who knew when *Low Ground* was finished before I did. It's made of the faith of my agent, and the generosity of the judges who read these pages with care. And it is made of the friends who waded through six different drafts, who told me when the truth was sounding like a lie. Thank you. You are the first public a writer ever has, and you are the only one that matters.

  But I also know that a prize like this reaches beyond this room. It enters what we might call "the public." And if I'm being honest, that is a more complicated thing to thank.

  There is a philosopher who wrote about how the modern age creates a "phantom" public. He argued that when we write for everyone, we are often writing for no one in particular. It's a leveling force. It turns a quiet conversation between a writer and a reader into a spectacle. It invites praise that feels unearned and criticism that feels unmoored from the work itself.

  I've felt that this year. I've seen the careful, serious reviews that made me feel seen. And I've seen the other kind—the comments from the shadows, the judgments passed by people who haven't actually met the book, only the idea of it. It's easy to become obsessed with that. To feel that writing is less about being read and more about being looked at. There's a story about that same philosopher, how he once became fixated on the way the newspapers mocked his walk, his clothes, his posture. He wanted to be understood, but he found himself merely exhibited.

  I don't want to stand here and exhibit myself. And I don't want to pretend that the machinery of publicity is anything other than what it is: a bit noisy, a bit random, and often more about the crowd than the individual.

  But then I look around this room.

  And I realize that the "public" isn't always a phantom. Sometimes, it's just a collection of neighbors. It's my parents, who bought the first copy. It's my old roommates, who remember when the "novel" was just something I complained about over cheap pizza. It's the town I grew up in, who taught me that stories are how we keep track of each other.

  You are not a leveling force. You are the opposite. You are the specific. You are the reason the abstraction of "the reader" becomes human again.

  So, my gratitude is complicated, yes. I am wary of the spotlight, and I know that prizes are fleeting. But my gratitude to you is simple. Because tonight, you have turned a phantom into a community. You have taken a book written in private and made it a reason to gather in public.

  Thank you for reading. Thank you for coming. And thank you for reminding me that while a book might be written alone, it doesn't have to live that way.

  Thank you.
