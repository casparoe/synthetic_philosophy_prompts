      *   *PII (Leibniz):* If $x$ and $y$ share all properties, $x = y$.
      *   *Black's Conclusion:* They are distinct (two spheres, not one), so PII is false. There must be non-qualitative properties (haecceities) distinguishing them.
      *   *Leibnizian Counter:* The scenario is incoherent. If they are truly indiscernible, there is no fact of the matter about "which is which." Or, spatial position is relational, not absolute.
      *   *The Hole Argument Analogy:* In General Relativity, if you treat spacetime points as substantival entities (having identity independent of the metric field), diffeomorphism creates distinct mathematical models representing the same physical reality, leading to indeterminism. The standard solution (Earman & Norton) is to deny substantivalism (Leibniz Equivalence).
      *   *Connection:* Black's spheres imply spatial points (or the spheres themselves) have primitive identity. The Hole Argument suggests treating points that way leads to trouble.

  3.  **Drafting - Character Conceptions:**
