prompt: |-
  So I had this two-hour argument with my friend Leah last weekend and I still haven't let it go, and now it's weirdly relevant to something I need help with, so bear with me. Leah's finishing a philosophy MA and has been insufferable ever since her social ontology seminar this semester - she was going on about how money is basically the textbook case of what Searle calls a "status function," that a dollar bill is just paper that "counts as" currency because we all collectively treat it that way, and her point was that this doesn't make it any less real, since the made-up stuff still has actual force, you can still buy groceries with it, it creates actual rights and obligations. I said fine, but then isn't it weird to use the same move for race or gender - calling something a social construction usually implies you could dissolve it if people just stopped believing in it, and money's kind of a special case because everyone already knows its fake and treats it as real anyway, whereas nobody "chooses" to accept gender the way they choose to accept a $20 bill at a register. She hit back with this idea, I think it's from Hacking, about "looping effects" - that classifications like race or mental illness actually change the people being classified in a way a dollar bill just can't, and that this is the real disanalogy, not the fake-vs-real thing I kept harping on. I never got my comeback in because her ride showed up.

  Anyway, here's why it matters: my brother Danny is getting married in three weeks and I'm best man. His fiancée Naomi is doing an econ PhD on the history of money - she's actually the one who got Leah into this whole Searle kick in the first place - so half the guests are going to be her econ and philosophy grad school people, and the other half is our extended family, who think "fiat currency" is a make of car. I want to build the toast around this exact idea, that something can be entirely made up by collective agreement and still be completely real and completely binding, the way a dollar bill and a marriage both are, without it turning into a seminar, or worse, making it sound like I'm implying their marriage is fake. Leah will absolutely be sitting there ready to fact-check the Searle bit, so please actually get it right. Can you write me the toast - around 4-5 minutes out loud, needs one real joke in it, and it has to land whether or not you've ever heard the phrase "status function" in your life.
