answer: |-
  Good evening, everyone. For those who don't know me, I'm Alex, Danny's brother and Best Man.

  Looking around the room, I realize we have a bit of a divide tonight. On one side, we have our family, who are wonderful people but generally think "fiat currency" is a brand of sedan. On the other side, we have Naomi's friends from the econ and philosophy departments, who I'm pretty sure are currently analyzing the seating chart as a microcosm of class stratification.

  But since this wedding brings together the study of money and the study of meaning, I wanted to talk briefly about what's actually happening here today. And to do that, I have to talk about green pieces of paper.

  Naomi, as many of you know, is finishing her PhD on the history of money. Her friend Leah—who I see nodding in the third row, please don't fact-check me too hard—is finishing a Masters in philosophy. Between them, they've spent the last few weeks explaining to me that money is what the philosopher John Searle calls a "status function."

  Basically, a dollar bill is just cotton and linen blend. It has no intrinsic value. You can't eat it, it doesn't keep you warm. It only becomes "money" because we all collectively agree to treat it as money. We agree that this specific paper *counts as* value. And because we all agree, it creates real rights, real obligations, and real consequences. You can buy a house with it. You can go to jail for stealing it. The fact that it is "made up" by human agreement doesn't make it any less real.

  And that, I realized, is exactly what marriage is.

  On a biological level, Danny and Naomi are the same people they were yesterday. But today, through a set of vows and a license, they are creating a new institutional fact. They are saying, "We count as a family." And like money, the power of that status doesn't come from the paper itself. It comes from us. It comes from this community.

  It works because *we* agree to recognize it. It works because when they say "we," we all nod and say, "Yes, we see that. We honor that. We will support that."

  Now, I know what some of you are thinking. If marriage is just a collective agreement, does that make it fragile? Does that make it less romantic?

  I'd argue the opposite. Money is valuable because the system holds. But marriage is valuable because *you two* hold the system. A dollar bill works even if you don't trust the person handing it to you. But a marriage? This specific status function only works if the two people holding the status pour everything they have into maintaining it.

  The state can grant you the license, but the state can't grant you the reality. Only you can do that. You have to wake up every day and renew the collective intentionality. You have to be the bank that backs the currency.

  And honestly, that's a good thing. Because if marriage were based on intrinsic biological value, you couldn't choose it. You'd just be stuck with it. But because it's a status function, it's a choice. It's a promise. It's something you build.

  **I actually asked Naomi earlier if I could pay for the open bar using this philosophical framework. I told the bartender the drinks "count as" paid for because we collectively intend them to be. He told me to leave, which I think proves Searle's point about deontic powers.**

  But in all seriousness, the fact that this is "constructed" doesn't mean it's fake. It means it's built. And looking at the two of you, I know you're building something that will hold weight. Something that has actual force. Something that will create rights and obligations, comfort and safety, for the rest of your lives.

  So, to Danny and Naomi. May your collective intentionality never waver. May your status function remain robust. And may you always find that the reality you build together is worth far more than the paper it's written on.

  To the happy couple.
