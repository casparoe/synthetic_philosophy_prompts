prompt: |-
  I am several chapters into a historical novel set in Rome around 1616, in which a secondary character, a Jesuit theologian serving as a consultor to the Holy Office, is quietly asked by a sympathetic cardinal to prepare a private opinion on Galileo's recent writings before the matter goes any further. I want the resulting scene to avoid the usual shorthand of "the Church versus science" and instead show a mind genuinely wrestling with the theology involved, so I have been rereading Galileo's 1615 Letter to the Grand Duchess Christina, where he leans on the old exegetical idea that scripture accommodates itself to the limited understanding of its original audience and is chiefly concerned with salvation rather than natural philosophy. Galileo explicitly enlists Augustine as an authority for this move, and I would like my character's notes to reflect real discernment about exactly how much of the argument is borrowed from Augustine and how much is Galileo's own contribution, rather than treating "accommodation" as an interchangeable label for whatever either man happened to say.

  Could you compare Galileo's use of the accommodation principle in the Letter to the Grand Duchess Christina with Augustine's own articulation of it, for example in his commentary on Genesis? I am less interested in a biographical sketch of either figure than in a close conceptual comparison: where Galileo is simply restating an Augustinian point, where he quietly extends or repurposes it for a new argumentative task, and whether applying the principle to a live, still-undecided astronomical controversy sits comfortably with the spirit of Augustine's original caution, or instead strains it. If you could write this as a self-contained comparison of roughly 400 to 500 words, organized so that its distinctions could be turned directly into the substance of a scene rather than into background history I could already find in any popular retelling of the Galileo affair, that would be exactly what I need.
