answer: |-
  This is an excellent catch. You are not being uncharitable; you have put your finger on the single most persistent and damaging critique of Mill's plural voting scheme. In fact, many political philosophers argue that this isn't just a "fixable detail," but a structural flaw that threatens the coherence of the entire project.

  Here is a breakdown of whether Mill has a principled defense, where that defense fails, and what it implies for the epistocratic project generally (including Brennan).

  ### 1. Mill's Principled Distinction (The Steelman)

  Mill does believe there is a categorical difference between **Property** and **Occupation**, even if they correlate in practice. His argument rests on the *source* of the competence.

  *   **Property is Extrinsic:** For Mill, wealth is largely accidental (inheritance, luck) or merely instrumental. Having money does not, in itself, exercise the faculties required for political judgment. To give extra votes based on property is to privilege *interest* (the desire to protect wealth) rather than *competence*. This leads to "class legislation," which Mill abhors.
  *   **Occupation is Intrinsic (The "School of Life"):** Mill views certain occupations as pedagogical. He argues that the *activity* of managing a business, overseeing laborers, or navigating complex markets forces the mind to develop specific faculties: foresight, calculation, consideration of consequences, and impartiality.
      *   When he says an employer is "on the average more intelligent," he isn't (just) saying they are richer. He is saying the *function* of being an employer is a cognitive gymnasium that the function of a day laborer is not.
      *   Therefore, the vote is attached to the **cultivation of the mind**, not the **possession of capital**.

  **The "Makeshift" Clause:**
  Crucially, Mill admits this is imperfect. He writes that occupation is a test only *"In the absence of [a real national education system]."* His ideal preference was actually **educational testing** (exams), not occupational status. He accepts occupation as a rough, fallible proxy for mental cultivation until such time as the state can test intellect directly without bias.

  ### 2. The Genuine Crack (The Critique)

  However, your intuition is correct: this distinction collapses under scrutiny. Here is why this is more than just a "detail."

  **A. The Correlation Problem**
  In 19th-century Britain (and today), occupational hierarchy is inextricably linked to class and capital.
  *   To be an "employer of labor" generally requires capital.
  *   To be a "banker or merchant" requires access to financial networks and property.
  *   To be a "skilled laborer" often requires apprenticeships that cost money or connections.

  By using occupation as a proxy, Mill is effectively smuggling in the property qualification he explicitly banned. If the group with extra votes overlaps 90% with the wealthy class, the *functional outcome* is the same as a property qualification, regardless of the *theoretical justification*.

  **B. The "Class Legislation" Paradox**
  Mill's biggest fear was "class legislation"—where one class votes to exploit another.
  *   He thought universal suffrage would lead to the working class taxing the rich out of existence.
  *   He thought property-weighted voting would lead to the rich rigging the system against the poor.
  *   **The Plural Voting Failure:** By giving employers more votes than laborers, Mill is *guaranteeing* that capital has more political weight than labor. Even if the employers are genuinely smarter, they still have a distinct class interest. If they vote their interest (which Mill assumes all voters do), the result is still class legislation, just with a veneer of meritocracy.

  **C. The Definition of "Intelligence"**
  Mill assumes the intelligence required to run a business is the same intelligence required to govern a state. This is a contestable empirical claim. A banker might be good at maximizing profit (a narrow interest), but political judgment requires understanding public goods, justice, and empathy. There is a risk that the "intelligence" Mill is measuring is actually just **acquaintance with the status quo**.

  ### 3. Does This Sink the Idea?

  **For Mill specifically:**
  It severely damages his specific proposal. Mill wanted a system that was both *representative* (everyone has a voice) and *competent* (the wise have more sway). By choosing a proxy (occupation) that aligns so tightly with class power, he undermines the legitimacy of the "competence" claim. It looks like a power grab by the bourgeoisie disguised as a meritocratic reform.

  **For Epistocracy generally (Brennan, etc.):**
  This is the **"Proxy Problem"** for all epistocratic theories.
  *   **The Challenge:** How do you measure political competence without measuring socioeconomic privilege?
  *   **The Reality:** Almost every proxy for "knowledge" or "intelligence" (education level, occupation, income, test scores) correlates with wealth, race, and class.
  *   **The Consequence:** If you implement plural voting based on test scores (Brennan's preference over Mill's occupation idea), you will likely still end up weighting the votes of the privileged more heavily, because they have better access to the resources that generate high test scores.

  ### 4. Verdict: Inconsistency or Tragic Dilemma?

  It is not a **logical contradiction** (A != B, so saying A is bad and B is good is logically consistent).
  It is a **practical incoherence**.

  Mill claims he wants to avoid class rule. He proposes a mechanism that inevitably produces class rule, but justifies it with a different vocabulary.

  *   **Is it fixable?** Only if you can find a proxy for competence that is *uncorrelated* with privilege. Mill hoped universal education would do this (making the test fair for everyone). Brennan hopes for a "voter exam" that anyone can study for.
  *   **The Hard Truth:** Critics argue that because political knowledge is partially a function of leisure time, security, and education quality, **any** epistocratic filter will likely skew toward the privileged.

  **Conclusion:**
  You haven't missed a nuance; you've identified the Achilles' heel. Mill tries to distinguish between the *source* of authority (mental cultivation vs. cash), but he fails to account for the fact that in a capitalist society, the former is largely purchased by the latter.

  This doesn't necessarily refute the *moral* claim that "better informed voters should have more sway," but it does refute the *institutional* claim that "we can design a system to do this without reinforcing existing class hierarchies." That is the hole epistocrats are still trying to climb out of today.

  If you want to go deeper on this specific tension, look into **David Estlund's** critique of epistocracy (specifically in *Democratic Authority*). He calls this the "acceptable to all qualified points of view" problem—basically, if the weighting scheme looks biased to the disadvantaged group, the system loses legitimacy, regardless of whether the "experts" are actually smarter. Mill was worried about this, but his occupational proxy doomed him to fail it.
