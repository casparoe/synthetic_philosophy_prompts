prompt: |-
  So I had this ridiculous argument with my friend Dana last night that started over something completely dumb -- we were walking back from the bar and she kept randomly speeding up ahead of me without saying anything, and when I finally complained she said "you could've just said something, it's not like I owe you a synced pace." That somehow spiraled into a two-hour debate about joint action that neither of us really won. Dana's doing a philosophy MA and kept bringing up this "walking together" example, which is apparently like the fruit fly of the collective intentionality literature -- every paper uses it. She was defending a view where two people intending to walk together doesn't require anything over and above each of them having the right individual intentions plus common knowledge that the other has them too (she said this was basically Bratman's move). I was arguing, mostly out of stubbornness at that point, that there's something extra going on -- an actual joint commitment that pools your wills together, so neither of you can just unilaterally bail without answering for it -- which is why it felt like she genuinely owed me an explanation and not just a heads-up after the fact.

  I looked into it a little afterwards and gather this is basically the Bratman-vs-Gilbert fight (reductive/individualist shared intention vs. plural-subject/joint-commitment theory), but I don't actually understand it well enough to know who's side I was even on, or what would even count as evidence either way. Could you lay out in some real depth what Gilbert thinks joint commitment adds that a big pile of interlocking individual intentions and mutual knowledge can't give you on its own -- and then what Bratman's best move is for capturing that same "obligation" feel (the standing to rebuke, the fact that you can't just wander off) without ever positing anything like a shared or plural subject? Mainly I want to know whether this disagreement is really about the normativity of joint action, or whether it secretly comes down to a dispute about ontology -- whether there's literally a "we" that intends things -- that's doing more work than either side lets on.
