answer: |-
  Elias held the phone between his ear and shoulder, his pen hovering over the acquisition form. The office was quiet, save for the hum of the server room down the hall.

  "It's 1954, definitely," Julian said on the other end. His voice was crisp, the voice of a man who had spent thirty years verifying dates. "Oil on canvas, signed lower right. Provenance checks out to the Galerie Maeght. There's a photograph of the artist standing next to it in his studio."

  "Okay," Elias said. He wrote *1954* and *Maeght* without blinking. That was easy. Facts were solid bricks; you could stack them without worrying about the mortar. If Julian said the paint was oil, it was oil. Elias didn't need to smell the linseed or scrape a sample to know the chemistry was true. Testimony worked perfectly here. Julian knew, now Elias knew. The information had moved across the wire like money, losing nothing in the transfer.

  "But Elias," Julian's voice dropped, losing its cataloguer's flatness. "You need to understand what it *does*. It's not just a Rothko. It's the one where the black eats the red. It's devastating. It's the most mournful thing in the city."

  Elias stopped writing. The pen hovered over the line labeled *Curatorial Note*.

  "Devastating," Elias repeated. The word felt heavy and unearned in his mouth.

  "Heartbreaking," Julian corrected. "Like standing in a room after a funeral. You trust me, don't you?"

  "With my life," Elias said. And he meant it. If Julian said the building was on fire, Elias would run. If Julian said the stock market crashed, Elias would sell. He accepted Julian's factual testimony as readily as his own senses.

  But this? To write *heartbreaking* on a form for a painting he hadn't seen felt like forgery.

  "So I can list it as such?" Julian asked. "For the grant? We need to justify the emotional weight of the purchase."

  Elias looked at the blank box. He could accept that the canvas was cracked (fact). He could accept that the crack happened in 1970 (fact). But to accept that the crack was *tragic*? That required him to stand in front of the weave. It was like being told a joke and laughing because someone else laughed. You understand the mechanics, you know why it's funny, but you haven't felt the punchline. You possess the knowledge of the humor, but not the humor itself.

  "Julian," Elias said. "If I write that, I'm saying I know it mourns."

  "You know *I* know it mourns."

  "That's not the same thing."

  "Why? I have better eyes than you. I've studied this artist for thirty years. My judgment is a reliable instrument. Use it."

  Elias tapped the pen against the paper. It was the asymmetry that bothered him, a philosophical itch he couldn't scratch. It felt like outsourcing a sense. Asking Julian to validate the beauty was like asking a friend to eat dinner and tell you if you were full. The nutrition could be reported, but the satiety had to be experienced.

  "I can't sign off on 'devastating'," Elias said softly.

  "So what will you write?"

  " 'Reportedly devastating'?"

  "That undermines the value! The value *is* the devastation."

  Elias looked at the phone. He trusted Julian. He trusted him more than himself. But trusting someone to tell you the truth about the world was different than trusting someone to feel the world for you. The latter felt like a category error.

  "I'll write 'Significant emotional resonance'," Elias said.

  "That's corporate speak. It's dead language."

  "It's honest language. For me."

  "You're refusing the gift, Elias. I'm handing you the experience."

  "You're handing me the map," Elias said. "I still have to walk the territory."

  He hung up before Julian could argue. He looked at the form. The facts were filled in, neat and black. The value judgment box remained white, glaringly empty. He could fill it with Julian's words. They were likely true. The painting was probably beautiful. But if he wrote them down, he would be lying about his own relationship to the truth. He knew *that* it was beautiful. He didn't know *the beauty*.

  Elias put the pen down. He picked up his coat. He wouldn't buy the painting based on the report. He would go see it. Not to verify the facts—the facts were already settled. He needed to verify the feeling. He needed to earn the right to call it heartbreaking.
