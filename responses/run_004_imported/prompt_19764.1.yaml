      *   **The Stakes:** This isn't just pure epistemology; it's practical rationality. The cost of error (death) dwarfs the cost of hesitation (hungry). This invokes *Pragmatic Encroachment* (Stanley, Fantl & McGrath). Even if epistemically justified, practically it's irrational.
      *   **The Nature of the Defeater:** Is the HOE a *rebutting* defeater (evidence they are poisonous) or an *undercutting* defeater (evidence the process is flawed)? It's undercutting.
      *   **Level-Splitting vs. Conciliationism:** Wren is a Level-Splitter (FOE and HOE operate on different levels). Oskar is a Conciliationist (HOE forces revision of FOE belief).
