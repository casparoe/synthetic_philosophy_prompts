prompt: |-
  I've been slogging through Leviathan and bits of De Corpore for a seminar on early modern political philosophy, and something's been nagging at me. Hobbes never shuts up about how geometry is basically the only field where humanity has real, settled knowledge, since you define your terms and then just watch the consequences unfold necessarily - and he wants civil philosophy to work the same way, starting from definitions like 'commonwealth' and 'person' and grinding out conclusions the way Euclid grinds out theorems. He was clearly obsessed with this and leaned on it constantly to justify his whole method, so Ive been assuming that when he actually sat down to do geometry himself, he was at least a solid, respected mathematician in his own right - like, contemporaries such as Wallis might've disagreed with him on philosophical grounds but still respected his actual constructions and proofs, right?

  I'm drafting a paper arguing that part of why Hobbes's 'geometrical method' felt credible to readers at the time is that he had genuine mathematical bona fides backing it up, and I wanted to open with a line or two establishing that before getting into the philosophy proper. Can you help me confirm what his best, most solid results actually were - maybe something on angle division or his circle quadrature - so I'm not just asserting this without backup?
