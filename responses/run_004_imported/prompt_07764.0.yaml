  2.  **Deconstruct the Philosophical/Economic Conflict:**
      *   **Side A (Survey/Stated Preference):** Believes utility = well-being/welfare. Choices are noisy due to constraints (cost, time, stigma, lack of availability). If counseling is under-utilized but desired, it suggests *constraints* prevented the choice, not lack of preference. They value *normative* utility (what is good for them).
      *   **Side B (Logs/Revealed Preference):** Believes utility = consistency in choice under constraint. "Talk is cheap." If students don't book counseling when slots are open, they reveal they prefer doing something else (sleeping, studying, eating). They value *positive* utility (what is actually chosen).
      *   **The Twist:** The prompt mentions "counseling slots chronically under-filled." This is crucial. In strict RPT, if a slot is available and not taken, the student reveals they prefer *not* counseling. However, RPT assumes the agent knows their preferences and faces no internal barriers. Behavioral economics (framing, weakness of will, stigma) challenges this.
      *   **The Dining/Shuttle Data:** "Running consistently over capacity." This implies unmet demand *revealed* by attempts to use the service (swiping in and being turned away? or just high volume?). If it's over capacity, there are revealed preferences that cannot be satisfied. This is a strong RPT argument for Dining/Shuttle.
      *   **The Counseling Data:** "Under-filled." This is the weak point for the Survey side *unless* we argue that the current offering is framed poorly or stigmatized.

  3.  **Determine the Recommendation:**
      *   *Option 1: All-in on Dining/Shuttle.* Strongest RPT argument. But ignores the mental health crisis narrative often present on campuses. Might feel cold.
      *   *Option 2: All-in on Counseling.* Strongest Welfare argument. But ignores the hard data showing low uptake. Risks wasting money on empty rooms.
