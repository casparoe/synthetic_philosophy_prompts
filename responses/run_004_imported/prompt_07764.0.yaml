      *   **Problem:** $40,000 surplus allocation. Two options: (1) Expanded evening counseling hours, (2) Late-night dining/shuttle.
      *   **Data Conflict:**
          *   Survey (Stated Preference): Counseling is top priority.
          *   Usage Logs (Revealed Preference): Counseling under-filled, Dining/Shuttle over-capacity.
      *   **Board Split:** 50% want to follow survey (introspection/well-being), 50% want to follow logs (revealed preference/utility).
      *   **Task:** Draft a memo for Wednesday's vote.
