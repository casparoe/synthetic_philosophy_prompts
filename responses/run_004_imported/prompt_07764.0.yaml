          5.  Section 3: The Synthesis/Recommendation. Why the specific split? Because "Over Capacity" = Unfulfilled Revealed Preference (High Priority). "Under-filled" = Potential Market Failure (Stigma/Framing). We fund the bottleneck primarily, but invest in fixing the friction for the secondary.
          6.  Closing: Call to vote.

      *   *Refining the Split Argument:* If I just say "let's do both," it looks like compromise. I need to say "We do both *because*..."
      *   *Argument:* The Dining data shows a *violation* of the budget constraint (students want to consume but can't). The Counseling data shows a *failure of revelation* (students value it but don't consume).
      *   *Better Argument:* I will recommend **$35,000 to Dining/Shuttle and $5,000 to Counseling**.
      *   *Why?* Because the Dining constraint is immediate and objective. The Counseling need is subjective and currently unacted upon. The $5k is for *outreach* (fixing the framing), not more slots. This respects the Logs (don't fund empty slots) but respects the Survey (acknowledge the need).
      *   *Actually, let's look at the "over capacity" vs "under-filled" again.*
      *   If Dining is over capacity, students are *trying* to use it and failing. That is revealed preference *blocked*.
      *   If Counseling is under-filled, students are *not trying*.
      *   Therefore, marginal dollar on Dining yields immediate utility gain. Marginal dollar on Counseling yields *potential* utility gain only if we change the framing.
      *   *Okay, I'll recommend: $30,000 Dining/Shuttle, $10,000 Counseling.*
      *   *Reasoning:* $30k expands capacity to meet revealed demand. $10k is earmarked specifically for *reducing barriers* to counseling (stigma reduction, easier booking), attempting to align revealed preference with stated welfare. This isn't a dodge; it's a targeted intervention based on the diagnosis of *why* the data disagrees.

  4.  **Drafting - Tone and Style:**
      *   Needs to sound like a PPE student (smart, precise, referencing the seminar concepts without being overly academic).
      *   Needs to be respectful to board members.
      *   Needs to clearly define "Utility" in both contexts.

