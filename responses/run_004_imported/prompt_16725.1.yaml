answer: |-
  First, let me say: trust your instincts. You have spotted one of the most famous and debated problems in Spinoza scholarship, and you have done it without a philosophy degree, just by reading the text closely and thinking critically. That is exactly what Spinoza would want you to do.

  You are asking two distinct questions here. One is about the *structure* of the argument (is he piling things up?), and the other is about the *philosophical consistency* (is he breaking his own rules about nature and right?).

  Here is the breakdown of what is going on in that passage, why it feels so jarring, and how scholars generally resolve the tension you've identified.

  ### 1. Is the argument coherent, or is he piling things up?

  Your intuition is correct: he is piling things up. In the *Ethics*, Spinoza writes *more geometrico* (in the geometric style), where every proposition follows strictly from the ones before it. In the *Political Treatise*, he is writing more pragmatically about how to keep a state stable.

  In this specific passage, he uses three distinct lines of reasoning that don't necessarily support each other:
  1.  **Empirical Generalization:** "Men have always ruled, therefore they are naturally superior." (This is the historical track record argument).
  2.  **Dismissal of Counter-Evidence:** The Amazons. He dismisses them as an unnatural aberration rather than engaging with why they might have existed.
  3.  **Psychological/Passional Argument:** Men are ruled by lust and jealousy regarding women, so mixing genders in government causes conflict.

  If the first argument (natural weakness) were truly sufficient, he wouldn't need the third argument (jealousy and peace). If women were naturally incapable of ruling, their presence in government wouldn't matter; they just wouldn't be able to hold power. By adding the bit about men's jealousy, he shifts the blame from *women's inability* to *men's emotional instability*.

  Most scholars agree that this is a "cluster" argument. He throws everything at the wall to see what sticks. It lacks the rigorous deductive chain of the *Ethics*.

  ### 2. The Big Question: Is he breaking his own rules?

  This is the deeper philosophical issue you raised, and it is the crux of the matter. You noted that Spinoza's core philosophy is that "nature doesn't hand out value judgments" and that "right is co-extensive with power."

  **The Doctrine:**
  In Spinoza's system (specifically in the *Theological-Political Treatise* and *Ethics*), "Natural Right" (*jus naturale*) is identical to "Natural Power" (*potentia*). A fish has the right to swim and eat smaller fish because it *can*. If a human has the power to do something, they have the natural right to do it. There is no cosmic moral law forbidding it.

  **The Contradiction:**
  When Spinoza writes that women "have not by nature equal right with men," he is making a claim about *power*. He is saying women *lack* the power (strength of character, rationality, independence) to hold right.

  However, as you astutely pointed out, his evidence for this lack of power is **historical**, not metaphysical. He says, essentially: "We have never seen women rule therefore they cannot rule."

  This violates Spinoza's own rule about not confusing **custom** with **nature**. Throughout his work, Spinoza fights against the idea that "what has always been done" is "what God/Nature intends." He argues that kings claim divine right just because they've always been kings. Here, he turns around and makes the exact same mistake regarding gender. He treats the social status quo (patriarchy) as a law of physics.

  **So, is he breaking his rule or applying it?**
  The most honest answer is: **He thinks he is applying it, but he is actually breaking it.**

  He believes he is observing a fact of nature (women are weaker), but he is actually observing a fact of culture (women have been subjugated). Because he conflates the two, he concludes that women *naturally* lack the power, and therefore *naturally* lack the right.

  If he had truly applied his "Right = Power" doctrine consistently, he would have had to say: "If women can organize enough power to rule, they have the right to rule. Currently, they do not have that power, perhaps due to social conditioning. If they gain that power, the right follows."

  Instead, he freezes the current power dynamic and labels it "Nature."

  ### 3. Why did he do this?

  There are two main ways scholars explain this blind spot:

  **A. The "Passions" Explanation (The Internal Logic)**
  Spinoza places a huge emphasis on rationality. To be free and to have "right" in a civil society, one must be guided by reason, not enslaved by passion. Spinoza genuinely believed (wrongly, by our lights) that women were more susceptible to passions (like jealousy, lust, emotion) and men were more susceptible to reason.
  In the passage, he hints at this: he says men love women from "lust" and get jealous. He argues that including women in government would make the state unstable because *men* would become irrational about them. So, paradoxically, he excludes women partly to protect the state from *men's* irrationality. It's a pragmatic political calculation, not just a metaphysical claim.

  **B. The Historical Blind Spot (The External Context)**
  Spinoza was radical for his time, but he was still a 17th-century Dutchman. He was surrounded by a society where women had almost no legal standing. Even the most radical thinkers of the 1600s rarely challenged gender hierarchy.
  Philosophers like **Genevieve Lloyd** and **Moira Gatens** (who have written extensively on Spinoza and feminism) argue that Spinoza's metaphysics *could* support gender equality, but Spinoza himself failed to follow his own logic to that conclusion. He applied his critique of superstition to religion and monarchy, but not to gender.

  ### 4. The "But of this enough" Ending

  You are also right to be unsettled by the ending. "Sed de his satis" ("But of this enough") is indeed the last sentence of the *Political Treatise*. Spinoza died shortly after (likely from consumption, exacerbated by inhaling glass dust from his lens-grinding).

  Because the book is unfinished, we don't know if he intended to revise this section. Some scholars hope that if he had lived, he might have tightened the argument or perhaps even reconsidered it in light of his own definitions of power and conatus (the striving to persist). However, given that this view was standard for his time, he might have left it exactly as is.

  ### Summary for your reading

  To answer your specific worry: **You are not misreading him.**

  1.  **On the Argument Structure:** You are right; it is a stack of different reasons (historical, biological, psychological) rather than one tight geometric proof.
  2.  **On the Philosophy:** You have identified a genuine tension. Spinoza claims to derive politics from human nature, but here he derives "human nature" from political history. He treats a social institution (patriarchy) as a law of nature.
  3.  **On "Right is Power":** He is applying the formula ("less power = less right"), but he is misdiagnosing the source of the power difference. He assumes the power difference is biological/natural, whereas a consistent application of his own critique of superstition would suggest it is institutional.

  It is perfectly reasonable to feel annoyed by this. It is one of the few places where Spinoza's otherwise liberating philosophy feels constraining. Many modern Spinozists argue that we should use Spinoza's *tools* (his critique of superstition, his definition of power, his focus on reason) to correct Spinoza's *conclusion* on this point.

  You have done exactly what a good philosopher does: you held the text to its own standards and found where it cracked. Keep reading. The *Ethics* Part 4 and 5 (on human bondage and freedom) might offer you some redemption after this frustrating political passage.
