answer: |-
  **MEMORANDUM**

  **TO:** Operations Committee, County Backcountry Search & Rescue
  **FROM:** [Your Name], Volunteer Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Protocol 4.1: Simultaneous Mission Prioritization

  **1. RECOMMENDATION**

  I recommend the committee adopt the following explicit protocol for inclusion in the Operations Manual, Section 4.1 (Resource Allocation):

  > **Protocol 4.1:** In scenarios where multiple parties require immediate extraction and available assets (specifically the night-capable helicopter) can service only one party, priority shall be assigned based on the following hierarchy:
  > 1. **Immediacy of Threat:** Priority goes to the party facing the most rapid deterioration of survival probability (e.g., active bleeding vs. exposure).
  > 2. **Aggregate Survival:** Where threats are deemed medically and environmentally comparable, priority goes to the party with the greater number of individuals.
  > 3. **Documentation:** Any decision to bypass a larger group in favor of a smaller group (or vice versa) based on threat assessment must be logged by Dispatch with a brief justification timestamp.

  **2. APPLICATION TO THE MARCH INCIDENT**

  Under this protocol, the March 14th dispatch decision is validated retrospectively.
  *   **Threat Assessment:** The solo climber (probable spinal injury) and the group of four (flash flood entrapment) both faced high-probability mortality risks within the same operational window. Neither threat was clearly "more immediate" than the other; both required extraction within hours.
  *   **Aggregate Survival:** With threat levels comparable, the protocol dictates prioritizing the group of four.
  *   **Outcome:** The helicopter deployment to the ridge with four hikers aligns with Protocol 4.1.

  **3. SCALABILITY AND THRESHOLDS (THE 1-VS-20 QUESTION)**

  A primary concern raised during our discussions is whether a numerical rule creates a "tyranny of the majority" that becomes untenable at extreme disparities. Does this rule hold if the split is 1-vs-20?

  Yes. In fact, the ethical necessity of the rule becomes *stronger* as the disparity widens. If we reject the numerical priority in a 1-vs-4 case based on fairness, we must logically reject it in a 1-vs-20 case as well. To do otherwise would require an arbitrary cutoff (e.g., "numbers count at 20, but not at 4"), which introduces ambiguity during high-stress dispatch moments.

  If we adopt a randomizing tiebreaker (a lottery) for the 1-vs-4 scenario, we are effectively stating that saving four lives is not morally superior to saving one. If that is true, it must also be true in the 1-vs-20 scenario. However, no member of this committee has argued we should flip a coin rather than save twenty people. This suggests we intuitively accept that numbers count; the disagreement is only on *when* they start counting. Protocol 4.1 removes that ambiguity: if the threat is equal, the math decides.

  **4. CONSIDERATION OF THE MINORITY VIEW (INDIVIDUAL CLAIM)**

  I want to address the argument raised by several senior members, specifically the objection that a numerical rule treats individuals as statistics rather than persons with an equal claim on rescue. This is not a trivial objection.

  The core of this view is that each person has a sovereign right to our assistance that cannot be cancelled out by the presence of strangers on a different ridge. To the solo climber, the fact that four others are in danger does not make his own danger less real, nor does it diminish our duty to him. Adopting a strict numerical rule risks eroding the principle that every call is treated as "Priority One" until proven otherwise. There is a significant moral cost—the "moral residue"—felt by the team when we consciously choose to delay aid to one person to save others. We must acknowledge that following Protocol 4.1 does not make the abandonment of the smaller group morally neutral; it simply makes it the *least wrong* option available.

  However, while the "Individual Claim" argument is ethically robust in a vacuum, it fails in a resource-constrained environment. If we treat every individual claim as equal and inviolable, we paralyze decision-making. A randomizing tiebreaker (as proposed by some) respects the individual claim of the one, but it violates the individual claims of the *many* in the larger group. By flipping a coin in a 1-vs-4 scenario, we actively choose a 50% chance of letting four people die to preserve the "fair chance" of the one. In a public trust organization like ours, we cannot justify a policy that knowingly increases expected mortality to preserve procedural symmetry.

  **5. IMPLEMENTATION AND REVIEW**

  Protocols should not be carved in stone based on a single season's incidents. This recommendation includes a sunset clause to ensure the rule serves the unit and the public effectively.

  *   **Effective Date:** Upon vote approval.
  *   **Review Date:** This protocol shall be reviewed at the first Operations Committee meeting following **March 2026**.
  *   **Review Triggers:** The committee may call an emergency review prior to this date if:
      *   A mission occurs where Protocol 4.1 results in a fatality that would likely have been prevented by the alternative protocol.
      *   Legal counsel advises that the numerical priority exposes the county to unacceptable liability.

  **6. CONCLUSION**

  This recommendation asks the team to accept a difficult truth: in the backcountry, fairness does not always mean equality. Sometimes, fairness means minimizing the total loss. Protocol 4.1 provides dispatchers and pilots with the clarity they need in the cockpit, while the scheduled review ensures we remain accountable for the human cost of that clarity.

  I move we adopt Protocol 4.1 as written.
