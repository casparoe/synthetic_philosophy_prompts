      *   *Actually, let's look at the "Old Timer" argument:* They want randomization even when numbers aren't equal. This is a "Fair Chance" view.
      *   *Let's look at the "Majority" argument:* Write "prioritize larger group" into the manual.
      *   *My Recommendation:* I will side with the **Majority (Prioritize Larger Group)** but refine it to ensure it's not *just* numbers (severity matters first). This is the most responsible SAR recommendation. A lottery in SAR is hard to justify when you know you could save 4 instead of 1.
      *   *Wait, one nuance:* The prompt asks to show how it holds up at 1-vs-20. If I choose "Save the Most," 1-vs-20 is easy. If I choose "Lottery," 1-vs-20 breaks it. So "Save the Most" is the stronger recommendation for a memo that needs to be robust.
      *   *Wait, another nuance:* The user is a philosophy student. They might appreciate a slightly more nuanced view than crude utilitarianism. Maybe a **Weighted Lottery**? No, that's too complex for a SAR manual.
      *   *Decision:* I will recommend **Priority to the Larger Group (when severity is comparable)**. This is the standard "Save the Most" rule but clarified. I will treat the "Fairness" objection seriously by acknowledging the moral residue, not by adopting a lottery.
      *   *Wait, re-reading the prompt:* "give a real, non-strawmanned hearing to whichever side it doesn't land on."
      *   *Okay, I will recommend the "Priority to Larger Group" rule.* It's the most operationally sound. I will validate the "Old Timer" concern (individual worth) without adopting their solution (lottery), explaining *why* the lottery fails at scale (1 vs 20).

  3.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
