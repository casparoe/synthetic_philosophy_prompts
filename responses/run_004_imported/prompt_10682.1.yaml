      *   Analyze the "weighing" as a form of choosing.
      *   Apply the "plan failing" test to the code's logic.
      *   Discuss the "human in the loop" as formal cooperation.
      *   Conclude with the likely verdict: The *system* is morally flawed because it institutionalizes a prohibited calculation.

