      *   **Argument 1: The Rationalist Convergence Thesis.** If correlation comes from "correct reasoning," and moral realism (or quasi-realism) holds, values converge.
      *   **Argument 2: Instrumental Convergence on Values.** Agents might modify their values to become better ECL partners. This creates a focal point toward value uniformity.
      *   **Argument 3: The Epistemic-Value Entanglement.** Values aren't isolated; they depend on empirical beliefs. If reasoning correlates, empirical beliefs correlate. If values depend on empirical beliefs (e.g., "suffering is bad" relies on a theory of mind), values correlate.
      *   **Critiquing the Standard Reply:** Why "Reason $\neq$ Values" fails for *superrational* agents. Self-modification, precommitment, and the nature of "decision procedure" in UDT.
      *   **Conclusion:** Summarize why this is a structural bottleneck for ECL, potentially reducing the "easy gains" people hope for.

