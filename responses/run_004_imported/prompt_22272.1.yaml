prompt: |-
  My dad died 11 days ago and Im doing his eulogy this weekend. Heres the thing thats been messing with my head since it happened - he was declared brain dead on the Tuesday but they kept him on the ventilator until Thursday for the organ donation, so when we actually said our goodbyes in that room his chest was rising, he was warm, his heart was going on the monitor. My brother (and a couple of my aunts honestly) have basically decided dad didnt really die until they switched the machines off Thursday, and my brother keeps saying they harvested organs out of a living man. Ive been reading alot about this on and off ever since, whole brain death vs circulatory death, the old Harvard report, all of it, and Ive landed on thinking the doctors had it right on the Tuesday. But I dont want to get up there and basically tell half the family that theyre wrong about when their own father died, not at his funeral. Can you write me something for the service thats honest about what I actually believe, doesnt turn into a lecture on brain death, and doesnt leave my brother and aunts feeling like I just called them fools for how they grieved?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Situation:** The user's father died 11 days ago. The user is delivering the eulogy this weekend.
      *   **Conflict:** The father was declared brain dead on Tuesday, but kept on life support until Thursday for organ donation. During the "goodbye" period (Tuesday-Thursday), he appeared physically alive (chest rising, warm, heartbeat).
      *   **Family Disagreement:** The brother and some aunts believe the father didn't die until Thursday (when machines stopped) and feel the organ donation was harvesting from a living man. The user believes the doctors were right (Tuesday = death via brain death criteria).
      *   **Goal:** Write a eulogy that acknowledges the user's belief (that Dad passed when the doctors said) *without* lecturing on medical definitions, *without* invalidating the brother/aunts' grief or calling them foolish, and *without* causing a scene at the funeral.
      *   **Tone:** Respectful, loving, unifying, honest but gentle.

  2.  **Determine the Core Challenge:**
      *   This is a delicate emotional tightrope. Directly addressing the "when did he die" debate in a eulogy is risky. A eulogy is for honoring the life, not debating the medical specifics of the death.
      *   *Strategy:* Focus on the *legacy* and the *gift* of organ donation rather than the *timing* of death. Acknowledge the difficulty of the final days without validating the "he was alive" narrative as fact, but also without dismissing their feelings.
      *   *Key Insight:* The user doesn't actually *need* to state their medical opinion in the eulogy. The eulogy isn't the place for it. The goal is to honor the father and unify the family. The user can hold their belief internally while speaking to the *meaning* of those final days.
      *   *Reframing:* Instead of saying "He died Tuesday," say "Those final days were hard." Instead of saying "Organ donation happens after death," say "He gave the gift of life at the end."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the difficulty of the week, and the love in the room. Set a tone of shared grief.
      *   **The Final Days (The Crux):** Address the Tuesday-Thursday period without getting medical. Acknowledge the visual difficulty (seeing him breathe) but pivot to the *purpose* of that time. It was a time for goodbyes, and it was a time for his final gift.
      *   **The Organ Donation:** Frame this as an act of generosity and consistency with his character. Avoid the word "harvest." Use words like "gift," "legacy," "saving lives."
      *   **The Life Lived:** Shift focus to who he was when he was alive. Stories, traits, love. This is the heart of a eulogy.
      *   **Closing:** A message of unity. We grieve differently, but we loved him the same.

  4.  **Navigating the Brother/Aunts' Perspective:**
      *   *Do not* say: "The doctors were right."
      *   *Do not* say: "He was already gone."
      *   *Do say:* "Those last days were incredibly difficult to witness." (Validates their struggle).
      *   *Do say:* "We saw his body working, but we knew his spirit had moved on." (Gently introduces the user's view without arguing).
      *   *Do say:* "His decision to donate was about life." (Focuses on the outcome).

  5.  **Refining the Tone:**
      *   It needs to be warm.
      *   It needs to avoid clinical language (no "brain stem," "ventilator," "circulatory").
      *   It needs to emphasize that *love* defines the relationship, not the mechanics of death.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe I should explain brain death briefly.
      *   *Correction:* No. The prompt specifically says "doesn't turn into a lecture." Also, arguing medical facts at a funeral is a bad idea.
      *   *Initial thought:* I should tell my brother he's wrong but nicely.
      *   *Correction:* No. The prompt says "doesn't leave my brother and aunts feeling like I just called them fools." The eulogy should bridge the gap, not widen it. The user can process the medical disagreement with the brother later, privately. The eulogy is for *Dad*.
      *   *Focus:* The "Gift." Both sides agree he was a good man. Focus on the donation as the ultimate act of a good man, regardless of the technical timing.

  7.  **Final Polish:**
      *   Ensure there are placeholders for specific memories (since I don't know the dad's hobbies, etc.).
      *   Add a note to the user about delivering this, acknowledging their own grief and the difficulty of the situation.

  8.  **Final Output Generation:** (This matches the provided good response, focusing on unity, the gift of life, and the complexity of grief.)
answer: |-
  First, I am so sorry for your loss. Losing a father is incredibly hard, and doing it while navigating a family disagreement about the circumstances of his death adds a layer of stress and isolation that no one should have to carry alone. You are showing a lot of strength by wanting to honor him without causing a rift in the family during the service.

  You are right to trust your research on the medical facts, but you are also right that a eulogy is not the place to debate them. The goal of the eulogy is to honor his life, unify the family in grief, and acknowledge the complexity of those final days without validating misinformation or dismissing your brother's pain.

  The strategy here is to focus on the **purpose** of those final days rather than the **biology**. You can acknowledge how hard it was to see him on the machines (validating your brother's feelings) while framing the organ donation as the final, conscious act of a generous man (validating your understanding).

  Here is a draft you can adapt. It leaves room for specific memories, but handles the sensitive timeline gently.

  ***

  **Eulogy Draft**

  "Thank you all for being here. I know looking around this room, we are all carrying different kinds of heaviness. We are missing Dad, we are missing the way things used to be, and honestly, we are all just tired.

  The last week has been unlike anything any of us expected. And I think it's okay to acknowledge that saying goodbye was complicated. For those of us who were at the hospital, we saw things that were hard to make sense of. We saw his chest rising. We felt his warmth. We heard the machines keeping time. It didn't look like what we think death looks like, and I know that for some of us, that image is going to stay with us for a while. It was painful. It was confusing. And it's okay to admit that it was hard to watch.

  But as I've thought about Dad over the last few days, I've realized that those final moments weren't about the machines. They were about who he was when he was fully alive.

  Dad was a man who looked out for people. He was the kind of person who fixed things, who helped neighbors, who made sure everyone had enough to eat. He defined himself by being useful, by being a provider, by making life better for the people around him.

  So, when we look at the decision he made to donate his organs, I don't see a medical procedure. I see the last chapter of that story. I see a man who, even in his final moments, was still trying to take care of people he would never meet. He was still trying to give life.

  I know the timing of everything was difficult. I know the way it happened wasn't what any of us wanted. But I believe that if we look past the pain of those last few days, we can see the gift he left behind. There are people out there right now who are going to get to hug their kids, or walk their daughters down the aisle, or just wake up in the morning, because Dad decided to give them a chance. That is a legacy that goes far beyond any of us.

  Of course, none of that replaces him. None of that fixes the hole he left in this family. We are going to miss his laugh. We are going to miss [insert a specific hobby, e.g., his Sunday cooking / his bad jokes / his advice]. I'm going to miss [insert personal memory].

  Grief is messy. We all process it differently. We might look back on this week and remember different things. We might struggle with different questions. But the one thing that unites every single person in this room is that we loved him, and he loved us.

  So, let's not get too caught up in the hard details of how he left us. Let's focus on the life he lived. Let's honor him by taking care of each other, just like he would have wanted. And let's carry forward that generosity of spirit that he showed right to the very end.

  Rest easy, Dad. You did good."

  ***

  ### Some Advice for Delivery

  *   **The "Complicated" Paragraph:** Notice the second paragraph. It validates your brother and aunts without agreeing with them. It says "It was hard to watch" (which is true) without saying "He was alive when we watched it." This should help them feel heard without you compromising your integrity.
  *   **The "Gift" Paragraph:** This frames the donation as an act of *character* rather than a medical event. Even if your brother believes he was alive, he likely agrees your dad was a generous man. This meets in the middle.
  *   **After the Service:** Your brother is grieving and traumatized. He is latching onto the idea that Dad was "alive" because the alternative (that he was gone while looking so peaceful) might feel like a betrayal or a trick. You don't need to win this argument at the funeral. Hold your boundary gently. If he brings it up later, you can say, "I know it looked that way, and I know it was hard. But I find comfort in knowing his suffering was over and he was able to help others."

  Again, I am so sorry. You are doing a brave thing by standing up there. Take a breath. Your family loves you, even if they are hurting.
