answer: |-
  This is a fantastic overlap of domains. In your day job, a `Promise` is an object that *might* resolve or reject based on asynchronous operations; in ethics, a promise is an object that *must* resolve, regardless of the asynchronous operation of "time passing." The bug in your team's argument is assuming that because the runtime (society) doesn't throw an exception (nobody finds out), the code (morality) didn't break.

  Here is the direct comparison you asked for, focusing on where Hume and Scanlon actually diverge on the *output* (is there an obligation?), not just the *source code* (why is there an obligation?).

  ### The Core Divergence: Infrastructure vs. Interaction

  To understand where they disagree, you have to see where they locate the "binding" mechanism.

  *   **Hume (The Social Infrastructure View):** For Hume, a promise is a **social technology**. It's an artificial invention we created to solve coordination problems, much like money or traffic laws. The words "I promise" are like signing a contract; they only have power because there is a background system (convention) that gives them force.
      *   *The Binding Agent:* The utility of the **practice**.
      *   *The Logic:* We keep promises because if we didn't, the institution of promising would collapse, and society would be worse off.

  *   **Scanlon (The Interpersonal Interaction View):** For Scanlon, a promise is a **specific transaction of trust**. It's not about the general institution; it's about what you did to *one specific person*. His "Principle F" says you are bound because you intentionally induced an expectation in someone else to give them assurance.
      *   *The Binding Agent:* The **relationship** between promisor and promisee.
      *   *The Logic:* We keep promises because breaking them wrongs the specific person who trusted you, regardless of what happens to society at large.

  ### The Crucible: The Secret Deathbed Promise

  This is the case where the two theories risk producing different boolean returns.

  **The Scenario:** You promise a dying friend (let's call him Alice) that you will scatter her ashes in a specific spot. She dies. You are the only one who knows about the promise. You can keep the ashes, scatter them elsewhere, or do nothing. No one will ever know. Alice cannot feel betrayed. The general social practice of promising is statistically unaffected by this one secret breach.

  **The Question:** Are you still obligated?

  #### 1. Hume's Vulnerability
  Hume has a hard time here. If the obligation comes from the *social utility of the convention*, a truly secret breach creates a paradox.
  *   **The Problem:** If nobody knows, the convention isn't damaged. Reputation isn't harmed. Trust in the system doesn't erode because the system never registered the transaction.
  *   **Hume's Defense:** Hume would likely argue that we cannot make exceptions for "secret" cases because humans are terrible judges of secrecy. If we allow ourselves to break promises when *we think* no one will know, we weaken our own psychological habit of fidelity.
  *   **The Glitch:** This feels like a workaround. Strictly speaking, on a pure act-by-act analysis of social utility, Hume's theory suggests the obligation is **weak or non-existent** in this specific instance. The "social contract" wasn't actually leveraged.

  #### 2. Scanlon's Resilience
  Scanlon handles this much better, which is why modern philosophers often prefer his view for this specific problem.
  *   **The Logic:** The obligation was created *when Alice was alive*. You performed a speech act that manipulated her expectations and gave her peace of mind before she died.
  *   **The Verdict:** You are still obligated. Why? Because the wrong isn't "damaging society" (Hume); the wrong is "betraying the trust Alice placed in you." The fact that she is dead doesn't erase the fact that you exploited her trust while she was alive.
  *   **The Survival:** Scanlon's view survives because the "bug" was introduced during the handshake protocol (when the promise was made), not during the execution (when the promise is kept).

  ### Where They Actually Disagree (The Edge Case)

  While Scanlon wins on the deathbed case, there is a reverse case where **Hume wins and Scanlon fails**, and it relates to those "fussy conditions" you mentioned in Principle F.

  **The Scenario:** You casually say to a colleague, "Don't worry, I'll definitely handle that report by Friday," to make them feel better. You didn't intend to create a binding assurance; you were just being nice. They, however, form a strong expectation based on your words. You don't do the report.

  *   **Scanlon's "Null Pointer":** Scanlon's Principle F requires specific conditions: You must *intend* to provide assurance, and the other person must *know* you intend that. If you were just being vague or nice, and didn't explicitly intend to bind yourself, Scanlon might say **no obligation exists**. You didn't complete the handshake protocol correctly.
  *   **Hume's "Default Handler":** Hume would say **you are obligated**. Why? Because the social convention of saying "I'll do X" carries a standard weight regardless of your internal mental state. If we allow people to say "I didn't *mean* to bind myself," the social utility of language collapses. The convention overrides your specific intent.

  ### The Verdict for Your Team Argument

  If your team's argument is about the **"Secret Deathbed"** scenario (breaking a promise where no one finds out):
  *   **Scanlon wins.** It is wrong because you wronged the person, not the system.
  *   **Hume wobbles.** He has to argue that you must uphold the rule even when the rule's utility isn't present in that specific instance.

  If your team's argument is about **"Casual Ambiguity"** (breaking a promise where the other person expected it but you didn't mean it):
  *   **Hume wins.** It is wrong because you violated the social convention of communication.
  *   **Scanlon wobbles.** He might let you off the hook if you didn't meet the 6 fussy conditions of Principle F.

  ### Does Either Survive the Deathbed Case?

  **Scanlon survives best.**
  The "Deathbed Promise" is generally considered a fatal exception for Conventionalism (Hume). If morality is just about social glue, then secret acts that don't dissolve the glue should be permissible. Most people have the intuition that breaking a deathbed promise is heinous *even if* God is the only witness. Scanlon captures this intuition because he anchors the obligation in the **history of the relationship**, not the **future of society**.

  **The Tech Analogy:**
  *   **Hume** treats a promise like a **Public API**. If you break it but no one is calling the endpoint and no logs are written, did the system break? Technically, no.
  *   **Scanlon** treats a promise like a **Memory Allocation**. You reserved resources (trust) from a specific process (Alice). Even if that process terminates (dies), you still have a memory leak if you don't free it correctly. The obligation is tied to the allocation, not the system uptime.

  So, tell your team: If you're coding for society (Hume), maybe you can get away with it. If you're coding for the person (Scanlon), you've got a memory leak that will crash your integrity, even if no one sees the stack trace.
