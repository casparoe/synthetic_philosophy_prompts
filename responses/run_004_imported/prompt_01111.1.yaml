      *   **Scanlon (Contractualism/Principle F):**
          *   Promises create obligations because of the specific interaction between individuals.
          *   Principle F: If A leads B to expect A will do X, and A knows B wants this assurance, and A acts to provide it, then A must do X unless B consents otherwise.
