  10. **Review against constraints:** The user wants help drafting the memo. I need to provide the text they can adapt. I should also add a brief note *outside* the memo to the user about the ethical framing they asked about.

      *(Wait, one nuance)*: The prompt asks me to draft the memo *they* will circulate. I should write it as if I am them. I will also add a short preamble/postscript to the user to address the ethical theory question directly, as that was part of the prompt ("feel free to correct me if that framing doesn't quite fit").

      *Decision:* I will provide the Memo first, then a brief note to the user about the ethical theory and strategy.

      *Refining the Memo:* Make sure it doesn't sound *too* legalistic. It's a high school council. But it needs to be persuasive.

      *Refining the Sanction:* If I recommend *no* transcript notation, does that undermine the policy? The policy says "ordinarily results in... notation." But allows exception for "extenuating circumstances." I need to argue strongly that the *teacher's ambiguity* is the extenuating circumstance, not just the scholarship. The scholarship makes the *impact* disproportionate, but the teacher's ambiguity makes the *culpability* lower. Both support the exception.

