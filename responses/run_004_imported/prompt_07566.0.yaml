prompt: |-
  I'm a junior at my high school and I sit on our Honor Council, the student-run board that hears academic integrity cases and recommends sanctions to the Dean of Students. We have a case coming up this Thursday that's messier than anything I've dealt with before, and I'd like help drafting the recommendation memo I'm supposed to circulate to the other council members beforehand.

  Here's the situation. A sophomore, Maya, used ChatGPT to help outline and rephrase parts of a graded history essay on the causes of World War I. She admits this but says she didn't realize it counted as "unauthorized assistance" under our honor code, partly because her teacher had demonstrated ChatGPT in class two weeks earlier as a research tool without ever clarifying where the line was for actual assignments. This is her first offense, and she's on a renewable need-based scholarship; a transcript notation is exactly the kind of thing that could jeopardize its renewal, meaning the "standard" sanction would land on her much harder than it would on most other students here. Our honor code says academic dishonesty "ordinarily results in a recommended two-week suspension and a permanent transcript notation," but allows the Council to recommend something else "if extenuating circumstances warrant." To complicate things further, this is our fifth AI-related case since winter break, and several council members think we need to come down hard on someone soon or the policy will lose all deterrent force — even though the four earlier cases all involved students who submitted essays ChatGPT had generated wholesale, which seems like a much clearer violation than what Maya did.

  Could you draft the memo I'll bring to Thursday's meeting? I'd like it to take a clear position — the standard sanction, something reduced, or an alternative sanction entirely — and to genuinely grapple with the idea that Maya deserves to be treated in proportion to what she actually did and knew, rather than being sanctioned mainly to send a message to the rest of the school, while still taking seriously my classmates' worry that going easy on her undermines the whole point of having a policy in the first place. I've read a little about retributivism and consequentialism in an ethics elective and I suspect that tension is basically what's splitting the council, but I might be misapplying the labels, so feel free to correct me if that framing doesn't quite fit. For what it's worth, I originally joined the council because it looked good for college applications, but cases like this are what have actually gotten me interested in the ethics underneath it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** High school junior, member of Honor Council.
      *   **Task:** Draft a recommendation memo for fellow council members regarding an upcoming academic integrity case.
      *   **Case Details:**
          *   **Respondent:** Maya (sophomore).
          *   **Offense:** Used ChatGPT to outline and rephrase parts of a history essay (not wholesale generation).
          *   **Admission:** Admits to using it.
          *   **Defense:** Didn't realize it counted as "unauthorized assistance" because the teacher demonstrated it as a research tool without clarifying assignment boundaries.
          *   **History:** First offense.
          *   **Stakes:** Renewable need-based scholarship could be jeopardized by a transcript notation (standard sanction).
          *   **Policy:** Standard sanction = 2-week suspension + permanent transcript notation. Exception allowed for "extenuating circumstances."
          *   **Context:** 5th AI case since winter break. Previous 4 were wholesale generation (clearer violations). Some council members want to "come down hard" for deterrence.
      *   **Goal:** Take a clear position (Standard, Reduced, or Alternative). Grapple with proportionality vs. deterrence. Address the ethical tension (Retributivism vs. Consequentialism).
      *   **Tone:** Professional, persuasive, ethical, thoughtful, appropriate for a high school Honor Council context.
      *   **User's Motivation:** Originally joined for college apps, now genuinely interested in the ethics.

  2.  **Determine the Ethical Framework:**
      *   The user mentions *Retributivism* (punishment based on what is deserved/proportionate to the harm/guilt) vs. *Consequentialism* (punishment based on outcomes/deterrence).
      *   *Analysis:* The council members wanting a harsh sanction for deterrence are arguing from a *Consequentialist/Utilitarian* perspective (maximize good by preventing future cheating). The argument for proportionality based on Maya's specific intent and circumstances is *Retributivist* (justice requires the punishment fit the crime and the culpability).
      *   *Resolution:* A balanced approach is usually best in restorative justice models common in schools. However, the prompt asks for a *clear position*. Given the nuances (teacher ambiguity, partial use vs. wholesale, scholarship stakes), a "Reduced/Alternative Sanction" is the most ethically defensible position that honors the Honor Code's "extenuating circumstances" clause without letting her off scot-free. It bridges the gap: it punishes (addressing deterrence) but proportionally (addressing fairness).

  3.  **Determine the Recommendation:**
      *   *Standard Sanction:* Too harsh given the teacher's ambiguity and the partial nature of the aid. Risks ruining her financial future disproportionately.
      *   *No Sanction:* Undermines the code.
      *   *Alternative/Reduced Sanction:* Best fit. Acknowledges the violation but accounts for the "extenuating circumstances" (teacher ambiguity, first offense, degree of reliance).
      *   *Specific Proposal:* Educational sanction + Grade Penalty (on the essay) + Probation, *without* the permanent transcript notation or suspension. Or perhaps a transcript notation that is removable upon completion of an ethics module. Let's go with: *No suspension, no permanent transcript notation, but a zero on the assignment and a mandatory educational component.* This protects the scholarship while maintaining academic consequence.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the specific recommendation clearly upfront.
      *   **Case Summary:** Briefly recap the facts (Maya, ChatGPT, outlining/rephrasing, teacher demo, first offense).
      *   **Ethical Analysis (The Core):**
          *   Address the "Deterrence" argument (Consequentialism). Acknowledge its validity but argue why *this* case isn't the right vehicle for it (precedent of wholesale vs. partial use).
          *   Address the "Proportionality" argument (Retributivism/Justice). Focus on culpability. Did she *know*? (Teacher ambiguity). Did she *cheat* or *misuse a tool*? (Outline vs. Write).
          *   Address the "Equity" argument. The scholarship issue. A permanent notation has lifelong consequences disproportionate to a sophomore's confusion.
      *   **Policy Interpretation:** Cite the "extenuating circumstances" clause. Argue that teacher ambiguity + partial use qualifies.
      *   **Proposed Sanction:** Be specific. (e.g., F on assignment, Educational workshop, Probation, No suspension, No permanent notation).
      *   **Closing:** Reiterate the goal of the Honor Council (education + integrity, not just punishment).

  5.  **Refining the Tone:**
      *   Needs to sound like a student leader, not a lawyer or a professor.
      *   Needs to be respectful of fellow council members' concerns (don't dismiss the deterrence argument, just contextualize it).
      *   Needs to show personal growth (hinting at the user's own ethical journey without making it about them).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the teacher's role? Yes, crucial for the "intent" aspect.
      *   *Check:* Did I address the scholarship? Yes, crucial for the "impact" aspect.
      *   *Check:* Did I address the previous 4 cases? Yes, need to distinguish Maya's case from wholesale generation.
      *   *Check:* Ethical labels? The user asked to be corrected if they misapplied them. Their application is actually pretty good. I will validate their understanding in the memo's logic without necessarily using the jargon excessively (keep it accessible). *Correction:* Actually, using the terms lightly shows intellectual rigor appropriate for an Honor Council memo. I will use them to frame the debate.
      *   *Check:* Is the recommendation actionable? Yes.

  7.  **Final Polish:** Ensure the distinction between "suspension" and "probation" is clear. Ensure the "transcript notation" issue is handled carefully (some schools allow "disciplinary probation" without a permanent mark). I will recommend *against* the permanent notation to save the scholarship, as that aligns with the "extenuating circumstances" clause.

      *(Self-Correction on Ethical Labels)*: The user asked me to correct them if their framing doesn't fit.
      *   *Retributivism:* Punishment is justified because the offender deserves it (proportional to harm/culpability).
      *   *Consequentialism:* Punishment is justified by its future benefits (deterrence).
      *   *User's take:* "Tension is basically what's splitting the council." -> This is accurate.
      *   *My move:* I will validate this framing in the memo but keep the language practical.

  8.  **Finalizing the Recommendation:** I will recommend a sanction that includes a grade penalty (academic consequence) and an educational component (restorative), but waives the suspension and permanent notation (life-altering consequence). This satisfies the "extenuating circumstances" clause.

  9.  **Drafting the Content:** (Mental Outline)
      *   To: Honor Council
      *   From: [User's Name]
      *   Subject: Recommendation re: Maya [Last Name]
      *   Intro: Recommendation = Modified Sanction.
      *   Facts: Summary.
      *   Argument 1: Culpability (Teacher ambiguity).
      *   Argument 2: Distinction from prior cases (Tool vs. Ghostwriter).
      *   Argument 3: Impact (Scholarship/Proportionality).
      *   Argument 4: Deterrence (Education > Fear).
