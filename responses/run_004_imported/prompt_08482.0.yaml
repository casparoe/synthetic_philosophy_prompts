          *   *Benatar's Kicker:* The "Good" of (3) outweighs the "Good" of (2) because (4) is *not a loss*. There is no subject to suffer the deprivation. Therefore, the "win" for Existence (Pleasure) is illusory or negligible compared to the "win" for Non-Existence (No Pain).
