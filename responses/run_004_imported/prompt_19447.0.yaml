answer: |-
  Thank you all for being here.

  For those of you who knew her only as a mother, a sister, or a friend, you knew a woman of fierce loyalty, dry wit, and a particular kind of quiet intensity. For those of us who knew her as a mentor and a colleague, you knew that intensity was directed at the single hardest question of our time: How do we wield power without destroying ourselves?

  She died unexpectedly, which leaves us all searching for the right words. Usually, in moments like this, there is a temptation to offer comfort. To say that the world is in good hands, or that the arc of history bends toward justice. But if there is one thing I have learned from standing in her office, looking up at that faded, photocopy of John von Neumann's 1955 essay pinned above her desk, it is that she had no patience for comfort that wasn't earned.

  She told us, more than once, that she did not want a eulogy that promised things would work out. She also did not want one that simply despaired. She wanted her actual view taken seriously. So, I will not tell you that she believed the future was safe. She didn't. But I will tell you that she believed the future was *possible*, provided we were willing to pay the price for it.

  That essay, "Can We Survive Technology?", was not a decoration. It was a warning label.

  Von Neumann was a giant of physics and mathematics, a colleague of hers in spirit if not in exact timeline. In 1955, looking at the dawn of the nuclear age, he argued that technological change had grown to match the scale of the earth itself. There was no safe distance left. No fresh frontier to retreat to if we made a mistake. The ocean was no longer a barrier; the atmosphere was no longer a shield.

  She kept that essay there for forty years. Through her work on nuclear risk in the 80s, and through her pivot to AI risk in the last decade of her life. She invoked it against students like me who thought we could solve these problems with a treaty, a law, or a single breakthrough. She taught us that there is no permanent settlement. You cannot regulate a danger away for good. The technology evolves, and so must our vigilance.

  To her family: You might hear this and think it sounds cold. A life spent staring into the abyss. But I want you to understand what this meant in practice. It meant she never gave up. It meant she never checked out.

  If there is no magic fix, she argued, then the only real defense is a long sequence of small, correct, day-to-day decisions. Sustained by patience. Sustained by flexibility.

  She didn't look for heroes. She looked for people who would show up on a Tuesday morning, tired, facing a complex, unglamorous problem, and choose the harder right over the easier wrong. She believed that safety wasn't a destination you arrived at; it was a manner of traveling.

  I now work in AI safety. For years, I thought that essay above her desk was a private eccentricity. A quirk of a generation that lived through the Cold War. Since last week, it has stopped feeling like an eccentricity. It feels like an inheritance.

  To her colleagues here: We know the stakes. We know the parallel between the physics of the 80s and the code of today. We know that the "scale of the earth" argument is only more true now than it was in 1955. She would not want us to freeze in fear. She would not want us to assume success. She would want us to recognize that the burden is on us to make the next small, correct decision.

  To her family: She loved you. And the reason she worked so hard on these abstract, terrifying risks was precisely because she loved the concrete, fragile world you live in. She fought for the possibility of a future, not the guarantee of one.

  So, I cannot stand here and promise you that her work was finished, or that we have solved the problems she cared about. We haven't. The risks remain. The technology continues to grow.

  But I can promise you this: We will not look for a savior. We will not look for a silver bullet. We will look to the work. We will try to match the scale of the challenge with the scale of our responsibility. We will try to make the sequence of decisions count.

  She taught us that hope is not a feeling; it is a discipline. And if we can maintain that discipline, if we can sustain the patience and flexibility she demanded of us, then perhaps, one day, we will be able to answer the question von Neumann asked, and that she kept pinned above her desk until the end.

  "Can We Survive Technology?"

  She did her part. Now, it is our turn.

  Thank you.
