      *   *Addressing the Wish:* She hated false comfort. I must honor that. I won't say "she's in a better place" or "the future is bright." I will say "the future is unwritten and difficult."
      *   *Closing:* A commitment to the work. A thank you for the clarity.

  4.  **Refining the Tone (Self-Correction during drafting):**
