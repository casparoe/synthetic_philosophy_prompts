      *   **The Artifact:** Introduce the von Neumann essay. Explain its significance to her (the "eccentricity" that is actually the core).
      *   **The Philosophy (The Hard Part):** Articulate her view without sugarcoating. Explain the "no retreat" concept and the "sequence of decisions" concept in accessible language for the family, while keeping the rigor for the colleagues.
      *   **The Legacy/Inheritance:** Connect her work (nuclear -> AI) to the speaker's current work. Show how the torch is passed.
      *   **The Charge:** What does she want from us now? (Not despair, not blind optimism, but *work*).
      *   **Closing:** A personal farewell that honors her specific wish (no false promises).

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the room. The mix of people. The suddenness.
      *   *The Essay:* Describe the physical copy. Pinned above the desk. Faded? Annotated? It was a landmark.
      *   *Explaining von Neumann (for the family):* Who was he? (Math genius, nuclear guy). What did the essay say? (Technology got too big). Use the metaphor of "scale of the earth." No frontier left.
