answer: |-
  Your verdict is correct. Coherent Extrapolated Volition (CEV) cannot escape the alienation objection that dismantled ideal-observer theories in metaethics, and its mechanism for achieving coherence across persons compounds the loss of normative authority rather than repairing it.

  The promise of CEV is that it solves the "value loading problem" by deferring not to our current, buggy selves, but to our "best" selves. However, for this deference to be rational, the "best self" must possess normative authority over the "current self." As you note, metaethicists like Connie Rosati and David Sobel demonstrated that idealization severs the psychological continuity required for that authority. When you apply this to CEV, the problem is not merely preserved; it is amplified by the requirement that these idealized selves must converge.

  Here is the argument for why CEV fails to secure the legitimacy it requires, focusing specifically on why the "error-correction" defense collapses under the weight of the "grown up farther together" clause.

  ### 1. The Individual Alienation Problem
  The strongest defense a CEV proponent can offer is the **Error-Correction Defense**. They argue that the idealization process (knowing more, thinking faster) is meant to strip away cognitive biases and factual ignorance, not to rewrite fundamental values. On this view, if I currently value happiness because I mistakenly believe suffering is virtuous, my extrapolated self corrects the error. The underlying *function* remains mine; only the *output* is debugged.

  This defense fails because it relies on a false dichotomy between "factual/cognitive errors" and "constitutive values." Human values are not static axioms fed into a reasoning engine; they are emergent properties of our specific cognitive architectures interacting with our specific developmental histories.

  When CEV specifies that we should "think faster" and "know more," it alters the *process* by which values are generated and maintained. If my value for "loyalty" is sustained by a specific cognitive limitation (e.g., Dunbar's number limiting my social circle), removing that limitation doesn't just "correct" my view on loyalty; it dissolves the psychological substrate that makes loyalty a live option for me. The resulting entity may be *derived* from me, but it is not *me*.

  This is the Rosati/Sobel objection: If the idealized agent is sufficiently wise to avoid my errors, it is sufficiently different from me that its desires are no longer *my* desires. It is a hypothetical stranger who shares my causal origin but not my psychological identity. I owe this stranger no more deference than I owe a very wise sibling.

  ### 2. The "Grown Up Farther Together" Clause
  The CEV defense might retreat here: "Okay, individual idealization is tricky, but CEV doesn't act on individual extrapolations. It acts on the *coherent* extrapolation of *volition*."

  This is where the clause "grown up farther together" becomes the fatal flaw. This clause is not decorative; it is functional. It is intended to ensure that the extrapolated volitions are compatible, preventing the AI from being paralyzed by conflicting individual demands. It implies that the extrapolated versions of us interact, negotiate, and evolve in a shared epistemic and social environment before the AI locks in their goals.

  This creates a second layer of alienation that the Error-Correction Defense cannot touch.

  If my extrapolated self grows up "farther together" with yours, our values will necessarily converge through mutual influence. For convergence to occur, at least one of us must change our weighting of values. If we both value "freedom" and "security" but weight them differently, growing up together implies we will negotiate a new weighting that allows for coexistence.

  But this negotiation process means that the final volition is not merely *my* error-corrected volition. It is a volition that has been modified by *your* extrapolated self. The causal chain of my "true" desires now runs through your psychology.

  Consider a concrete example: Suppose my extrapolated self values radical artistic experimentation, while yours values social stability. To "grow up farther together," our extrapolated selves must find a equilibrium. The resulting consensus might value "structured creativity."
  *   Is "structured creativity" what *I* would want if I knew more? No, because without your extrapolated self pressuring me, my extrapolated self might have remained a pure artistic anarchist.
  *   Is it what *you* would want? No, for the symmetric reason.

  The "coherent" volition is an emergent property of the *system* of extrapolated humans, not a property of the individuals within it. By requiring coherence, CEV admits that individual extrapolated volitions are insufficient to guide the AI. But if the individual extrapolated volition lacks the authority to bind me (due to the alienation problem), a *consensus* of those alienated selves has even less claim to authority. It transforms the AI from a servant of "my better self" into a servant of "the committee of strangers who used to be us."

  ### 3. The Verdict: Authority vs. Specification
  The fundamental error of CEV is conflating the **Specification Problem** (how do we tell the AI what we want without bugs?) with the **Legitimacy Problem** (why does the target we select have the right to rule us?).

  CEV solves the Specification Problem beautifully. It creates a target that is stable, reflective, and conflict-resolved. But it does so by sacrificing Legitimacy.
  1.  **First Loss of Authority:** The idealization process creates psychological discontinuity. The extrapolated self is a stranger.
  2.  **Second Loss of Authority:** The coherence requirement creates a collective entity that supersedes the individual. The "coherent volition" belongs to the group-process, not the individual agents.

  The "grown up farther together" clause is the smoking gun. It admits that our values are not pre-existing truths waiting to be uncovered by removing error. They are contingent outcomes of social negotiation. By simulating a future social negotiation among idealized agents, CEV generates a set of values that *no actual human currently holds* and *no actual human would necessarily come to hold* without being forced into that specific simulated developmental track.

  Therefore, an AI acting on CEV is not acting on *our* will, even ideally construed. It is acting on the will of a hypothetical post-human society that shares our causal history but not our identity. While this might produce a "good" outcome by some external metric, it cannot claim to be *aligned* with humanity in the normative sense required to solve the control problem. It solves the risk of the AI doing what we *say* by ensuring it does what we *would have said if we were someone else.*

  That is not alignment. It is benevolent usurpation.
