answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Grandma's Name]'s grandkid.

  Standing here, looking at a room split perfectly between her family and her colleagues from the Economics Department, I realized I have a unique challenge. I need to talk about John Maynard Keynes in a way that makes the economists nod, but doesn't make the rest of you check your watches.

  Luckily, Grandma gave me my marching orders. She told me that for 34 years, she has been obsessed with one specific essay Keynes wrote in 1930 called *Economic Possibilities for our Grandchildren*.

  In it, Keynes predicted that 100 years later—meaning, right now, in 2030—technology and capital would make society so rich that we would only need to work about 15 hours a week.

  Now, looking around this room, I know what most people are thinking. They're thinking, "Well, he was wrong. We're all working 50 hours a week."

  But Grandma made me promise not to make that joke. She says that's the easy answer. She says if you stop there, you miss the point.

  Because Keynes wasn't actually celebrating the 15-hour work week. He was terrified of it.

  He wrote that for all of human history, we have been trained to struggle, to toil, to be useful. He worried that if you took that struggle away, if you gave people freedom and leisure, we wouldn't know what to do with it. He called it a "moral disease." He asked: *When a man is no longer needed for survival, does he know how to live?*

  And that, truly, is the theme of tonight.

  Grandma, for 34 years, you have been undeniably useful. You have graded thousands of essays. You have drawn countless supply and demand curves. You have taken teenagers who barely know how to do laundry and taught them how to understand the global market. You have defined yourself by your utility, by your contribution, by the work.

  And now, you are retiring exactly as Keynes' hundred-year clock runs out. You are stepping into the very future he predicted, and the very future he feared.

  I think part of you is laughing at the timing. But I also think part of you is asking the question Keynes asked: *Now what?*

  When you stop being "the teacher," when the bell doesn't ring at 2:30 PM, when the lesson plans are done... who are you when you aren't being useful?

  Keynes thought we would fail that test. He thought we'd be anxious, bored, and lost without the grind.

  But looking at you, I think he underestimated you.

  Because you haven't just taught economics. You've taught us how to think. And I believe that the same rigor you applied to macro theory, you will apply to leisure. You aren't just "stopping work." You are starting the hardest assignment of all: The art of living for its own sake.

  Keynes wondered if we could learn to enjoy life without guilt. If we could find purpose without a paycheck. If we could be valuable without being "useful."

  So, my toast is not to your past work. We know that was brilliant.

  My toast is to your future leisure.

  To Grandma: May you prove Keynes wrong. Not about the hours, but about the heart. May you find that you don't need to be useful to be worthy. May you find that the best graphs are the ones you draw in the sand on a Tuesday morning just because you can. And may you teach us all, one last time, how to be rich in time.

  To Grandma.
