  ok so my grandma just retired after teaching AP econ for 34 years and I have to give a toast at her retirement dinner. her whole career shes been obsessed with that Keynes essay about how our grandkids would only need to work like 15 hours a week once society got rich enough -- and she's retiring basically the exact year his "hundred years hence" runs out, which she thinks is the funniest thing ever. she made me promise I won't just do the easy "lol he was wrong about the hours" bit, becasue she says that's the version everyone stops at. the part she actually wants dealt with is his worry about whether someone who's spent their whole life being useful actually knows how to just live once the working part stops -- which i think is kind of freaking her out for real, since that's literally her life now. half the room is her econ department who'll notice if i fumble the ideas, the other half is family who's never heard of the guy. can you write the toast (like 4 min out loud) that actually leans into that idea instead of dodging it with jokes?
