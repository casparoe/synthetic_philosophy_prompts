          4.  Evaluate Hobbes's solution (identity depends on "what name" is used) against modern theories (Relative Identity vs. Constitution without Identity).
          5.  Address the practical/emotional question: Can they use this to tell off the DMV clerk? (Needs a reality check).

  2.  **Deconstruct the Hobbes Passage:**
      *   *Context:* Hobbes is discussing "Individuation" (what makes a thing *this* specific thing).
      *   *The "Second Opinion":* This view holds that identity is based on *Form* (structure/arrangement) rather than Matter. If the form remains, the thing remains.
      *   *The Reductio:* Hobbes says if identity = Form, then:
          1.  Ship A (continuous repair, all new planks) = Original Ship (because form is continuous).
          2.  Ship B (old planks reassembled) = Original Ship (because form is restored).
          3.  Therefore, Ship A = Ship B.
          4.  But Ship A and Ship B exist at the same time in different places.
          5.  Therefore, two distinct bodies are one numerical body. -> *Absurd.*
      *   *The "Third Opinion":* This view holds that identity is based strictly on *Matter* (the specific atoms/particles). If matter changes, identity is lost.
      *   *Hobbes's Rejection:* If identity = Matter only, then:
          1.  A man standing != the man sitting (particles moved).
          2.  Water in a vessel != water poured out (particles dispersed).
          3.  This makes talk of persistence impossible. We couldn't say "I am the same person I was yesterday." -> *Absurd/Unusable.*
      *   *Hobbes's Solution:* Identity isn't absolute; it's relative to the *Name* (the sortal concept).
          *   "Same Man" vs. "Same Body."
          *   A man persists through matter change (organization/function).
