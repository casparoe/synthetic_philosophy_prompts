      *   *Four-Dimensionalism:* (Not explicitly asked, but worth keeping in mind). Hobbes isn't really doing temporal parts here.
      *   *Verdict:* Hobbes is a proto-Sortalist. He argues identity conditions are imposed by the concept/name we apply, not found inherently in the matter or form alone.

