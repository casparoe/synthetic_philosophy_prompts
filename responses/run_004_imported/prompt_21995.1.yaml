      *   *Constitution View:* The constitution view usually says the statue *is not* the clay. Hobbes says "It is one thing to ask concerning Socrates whether he be the same Man, and another to ask whether he be the same Body." This implies the criteria differ. It's closer to Sortalism. I should highlight that distinction.
      *   *Hobbes's Nominalism:* Crucial point. Hobbes is a nominalist. Universals don't exist; names are tools we use. This underpins his solution. Identity is a feature of our language/concepts, not the world itself. I need to mention this.

