prompt: |-
  I'm a third-year PhD student in evolutionary biology, and this semester I've been the student representative on my department's committee that reviews second-year students' dissertation proposals before they can advance to candidacy. A proposal now in front of us, from a labmate who works on Anolis lizards, argues that the elaborate color pattern on the male dewlap in her focal species is a sexually selected signal shaped by female choice, and it lays out a clean set of selection-gradient measurements to test that claim. What the proposal doesn't do, even in a single paragraph, is engage with the possibility that the pattern is a "spandrel" in Gould and Lewontin's sense -- a byproduct of pigment-pathway constraints tied to some other, differently selected trait, rather than itself a target of selection. Two of the senior faculty on the committee want to withhold approval until she adds a section addressing this alternative and proposing some way to test between it and her preferred hypothesis. Two others, including my advisor, think that standard can never really be satisfied, since one can always redescribe any trait as a possible byproduct of something else, and that Gould and Lewontin's critique, whatever its merits as a corrective, has never come paired with an alternative research program rigorous enough to make "you haven't ruled out non-adaptation" anything other than a rhetorical trump card. If we adopt it as a committee standard, they worry, we could hold up almost any adaptationist proposal indefinitely, including good ones.

  I have to draft the memo we'll circulate before we vote next week, and I don't want it to just split the difference by gesturing vaguely at "more consideration of alternatives." Could you write that memo for me? It should reach a specific recommendation -- approve, reject, or approve with named conditions and a deadline for meeting them -- and it should take seriously, rather than wave away, the worry that a non-adaptive alternative can always be posited for any trait and so is not automatically entitled to the same evidentiary weight as a hypothesis actually under test; I need something that could change the minds of the two committee members who hold that view, not just outvote them.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in evolutionary biology.
      *   **Role:** Student representative on the committee reviewing 2nd-year dissertation proposals (advancement to candidacy).
      *   **Task:** Draft a memo to the committee before the vote next week.
      *   **Subject:** A labmate's proposal on *Anolis* lizard dewlap coloration (sexual selection vs. spandrel/byproduct).
      *   **Conflict:**
          *   Faculty Group A (2 members): Want the student to address the "spandrel" hypothesis (Gould & Lewontin) and propose tests to distinguish it from adaptation.
          *   Faculty Group B (2 members, including User's advisor): Argue that non-adaptive hypotheses can always be posited, making this an impossible standard that stalls research. They view G&L's critique as rhetorical rather than a rigorous research program.
      *   **Goal:** Reach a *specific recommendation* (Approve, Reject, or Approve with Conditions). Do not split the difference vaguely. Address the epistemological worry of Group B seriously (i.e., don't just say "consider alternatives," explain *why* and *how* in a way that doesn't lead to infinite regress). Persuade Group B, not just outvote them.
      *   **Tone:** Professional, academic, diplomatic, rigorous, decisive.

  2.  **Deconstruct the Scientific/Philosophical Issue:**
      *   *The Adaptationist Programme:* Assumes traits are optimized by natural/sexual selection. Needs evidence of function and fitness benefit.
      *   *The Spandrel/Byproduct Critique:* Traits can arise due to developmental constraints, genetic correlation, or phylogenetic inertia without direct selection on that specific trait.
      *   *The Impasse:* Group B is right that *any* trait can be rhetorically framed as a spandrel. Group A is right that ignoring plausible developmental/phylogenetic constraints is methodologically weak.
      *   *The Solution:* The requirement shouldn't be "prove it's not a spandrel" (impossible). The requirement should be "demonstrate why the adaptationist hypothesis is the *most parsimonious* starting point given current knowledge, and identify specific predictions that would falsify it in favor of a constraint-based model." It's about *falsifiability* and *comparative context*, not proving a negative.

  3.  **Determine the Recommendation:**
      *   *Reject:* Too harsh for a 2nd-year proposal. Kills momentum.
      *   *Approve:* Ignores the valid methodological concern of Group A. Risks a weak dissertation.
      *   *Approve with Conditions:* The sweet spot. It validates Group A's concern (needs addressing) but structures it in a way that satisfies Group B (doesn't require proving a negative, just setting boundaries and comparative controls).
      *   *Specific Condition:* Add a section on "Phylogenetic and Developmental Context" that outlines *specific* comparative or experimental data that would distinguish selection from constraint.

  4.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Opening:** State the purpose and the specific proposal.
      *   **Summary of Debate:** Acknowledge the split fairly. Show understanding of both the adaptationist and spandrel positions.
      *   **The Core Argument (Persuading Group B):** This is crucial. I need to explain that asking for a "spandrel check" isn't asking for proof of non-adaptation. It's asking for *rigor in the adaptationist claim*. An adaptationist hypothesis *must* specify the null model. If the null model is "random drift/constraint," how do we distinguish? The memo needs to frame this as strengthening the *adaptationist* claim, not capitulating to skepticism. Use the concept of "contrastive testing."
      *   **Recommendation:** Approve with Conditions.
      *   **Specific Conditions:**
          1.  Explicitly state the null model (e.g., phylogenetic signal without ecological correlation).
          2.  Include a comparative element (even if preliminary) to show the trait varies independently of the proposed constraint.
          3.  Deadline.
      *   **Closing:** Encouraging tone.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Tell them to test the spandrel hypothesis.
      *   *Correction:* No, Group B will hate that. You can't test "everything."
      *   *Better:* Tell them to define the *conditions under which the adaptationist hypothesis would be rejected*. This makes the adaptationist hypothesis scientific (falsifiable).
      *   *Key Phrase:* "Burden of evidence vs. Burden of proof." The student doesn't need to prove it's *not* a spandrel. She needs to show her data *fits selection better than constraint*.
      *   *Addressing Group B:* Acknowledge that G&L didn't provide a recipe. But argue that modern evolutionary biology (Evo-Devo, Phylogenetics) *has* provided tools to make constraints testable. So it's not just rhetoric anymore.

  6.  **Drafting the Content (incorporating Evo Bio terminology):**
      *   Use terms like "phylogenetic comparative methods," "genetic correlation," "null model," "falsifiability," "selection gradients."
      *   Ensure the tone is collegial but authoritative (as a committee memo).
      *   Make sure the deadline is realistic (e.g., 2 weeks before the final defense or a specific date). Let's say 3 weeks to revise the written proposal.

  7.  **Final Review against Constraints:**
      *   Specific recommendation? Yes (Approve with Conditions).
      *   Take Group B's worry seriously? Yes (addressed in the rationale).
      *   Persuasive to Group B? Hopefully, by framing it as strengthening the adaptationist claim rather than validating skepticism.
      *   No vague splitting? Yes, conditions are concrete.

  8.  **Final Polish:** Check for clarity and tone. Ensure it sounds like it comes from a PhD student who knows the literature but respects the faculty dynamics. (Self-correction: Ensure I don't sound *too* senior. Keep it respectful.) *Wait, as a student rep, I am drafting the memo for the committee to circulate, or am I drafting my own recommendation?* The prompt says "I have to draft the memo we'll circulate before we vote." This implies I am writing the committee's consensus document or a draft for the chair. However, since there is a split, I am likely drafting a recommendation *to* the committee to help break the deadlock. Let's frame it as a "Draft Recommendation for Committee Consideration" to be circulated among faculty. This allows me to propose the path forward without claiming false consensus yet. Actually, reading closely: "draft the memo we'll circulate before we vote." This suggests the memo *is* the basis for the vote. I should write it as a neutral but decisive synthesis that proposes the path. I will write it as a "Committee Review Summary & Recommendation" draft that the Chair can adopt.

      *Wait, re-reading:* "I have to draft the memo we'll circulate before we vote next week." Usually, the Chair writes this. If the student is writing it, it's likely a summary of the discussion to frame the vote. I need to be careful not to overstep. I will frame it as "Proposed Path Forward" based on the discussion.
      *Actually, the most helpful interpretation:* The user wants the text they will submit to the committee/chair to guide the decision. I will write it as a formal memo *from* the Review Committee (drafted by the student rep for the Chair's signature) that outlines the decision logic. This gives the user the text they need to propose the compromise.

      *Wait, one more nuance:* If I write it as the final decision, it assumes the vote hasn't happened. The prompt says "before we vote." So this memo is to inform the vote. It should argue for a specific outcome so the faculty can vote on *this recommendation*.
      *Okay, decision:* I will write the memo as a "Recommendation for Proposal Status" that the committee can adopt. It needs to be persuasive enough that the Chair might just sign it.

      *Key argumentative pivot:* The "Spandrel" objection isn't about proving non-adaptation; it's about defining the *Null Model*. Group B fears infinite regress. The solution is to limit the null model to *plausible, mechanistic alternatives* based on the specific system (Anolis), not philosophical possibilities.

      *Let's write.*

      *Structure:*
      1. Header.
      2. Context.
      3. Summary of Scientific Merit.
      4. Addressing the Methodological Concern (The Core).
      5. Specific Recommendation (Approve with Conditions).
      6. Rationale for Conditions (Addressing Group B).
      7. Next Steps.

      *Tone Check:* Needs to be respectful of the Advisor (Group B) while validating Group A.
      *Key argument for Group B:* "We are not asking her to disprove all possible spandrels. We are asking her to identify the *most likely* constraint-based alternative and show how her design distinguishes it. This makes her adaptationist claim stronger, not weaker."

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Graduate Committee on Doctoral Candidacy
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Dissertation Proposal: [Student Name], "Sexual Selection and Dewlap Evolution in *Anolis*"

  **Purpose**

  This memo summarizes the committee's review of the above-referenced dissertation proposal and offers a specific recommendation for the upcoming vote. The proposal outlines a rigorous program for measuring selection gradients on male dewlap coloration, aiming to test the hypothesis that these patterns are sexually selected signals. While the committee agrees that the core methodology is sound, there is a substantive disagreement regarding the theoretical framing of the hypothesis. This memo proposes a resolution that maintains methodological rigor without imposing an impossible evidentiary burden on the candidate.

  **Scientific Merit and Theoretical Context**

  The committee acknowledges the strength of the proposed selection-gradient analysis. The experimental design for quantifying female preference and male reproductive success is robust and aligns with standard practices in behavioral ecology.

  However, a significant portion of the committee raised a concern regarding the proposal's treatment of alternative hypotheses. Specifically, the proposal treats the adaptationist hypothesis (sexual selection) as the default without explicitly engaging with the possibility that the dewlap pattern is a byproduct (or "spandrel") of selection on correlated traits (e.g., physiological pigment constraints, thermoregulation, or phylogenetic inertia).

  **Addressing the Methodological Impasse**

  The committee recognizes the valid concern raised by some members: requiring a candidate to definitively "rule out" non-adaptive explanations can lead to an infinite regress. As Gould and Lewontin noted, one can always posit a hypothetical byproduct explanation *post hoc*. If the standard for approval becomes "prove this is not a spandrel," we risk stalling valid adaptationist research on the grounds of philosophical skepticism rather than empirical deficiency.

  However, the counter-argument is equally strong: an adaptationist claim is scientifically empty if it is unfalsifiable. If a proposal does not specify what evidence would count *against* the selection hypothesis (i.e., what the null model looks like), the research program risks becoming a "just-so" story confirmation rather than a test.

  The resolution lies not in demanding the student prove the trait is *not* a spandrel, but in demanding she clarifies **under what conditions her data would fail to support sexual selection.**

  Modern evolutionary biology has moved beyond the rhetorical stalemate of the 1970s. We now have phylogenetic comparative methods and quantitative genetic frameworks that allow us to test constraint-based hypotheses against selection-based hypotheses. Therefore, asking the candidate to engage with this is not asking her to solve a philosophical problem, but to utilize available empirical tools to sharpen her predictions.

  **Recommendation**

  The committee should **APPROVE THE PROPOSAL WITH CONDITIONS.**

  We recommend advancement to candidacy contingent upon the submission of a revised proposal section (approx. 2–3 pages) by **[Date, 3 weeks from now]**. This revision need not prove the trait is adaptive, nor must it exhaustively test every possible alternative. Instead, it must satisfy the following three criteria:

  1.  **Explicit Null Model:** The revision must explicitly state the null expectation. For example, if the dewlap pattern is a byproduct of selection on body size or pigment physiology, what correlation structure would we expect to see in the data *independent* of female choice?
  2.  **Differentiating Predictions:** The revision must identify at least one specific prediction where the "sexual selection" hypothesis and the "constraint/byproduct" hypothesis yield divergent results. (e.g., "If the pattern is a byproduct of physiological constraint, we expect variation to correlate with metabolic rate rather than mating success; our design distinguishes these by...")
  3.  **Phylogenetic Context:** The revision must briefly acknowledge the phylogenetic history of the focal species. If closely related species with different ecological pressures share the pattern, this supports constraint; if the pattern varies with mating system, this supports selection. The student must indicate how her study accounts for this context (even if only qualitatively at this stage).

  **Rationale**

  This recommendation is designed to address the concerns of all committee members without compromising the candidate's progress:

  *   **For those concerned about the "Spandrel" critique:** This ensures the dissertation engages with the modern synthesis of Evo-Devo and phylogenetics, preventing the work from being purely phenomenological. It forces the adaptationist hypothesis to be falsifiable.
  *   **For those concerned about infinite regress:** This does not require the student to test *all* non-adaptive hypotheses. It requires her to identify the *most plausible* alternative based on current literature and show how her design distinguishes between them. This places the burden on *discrimination* between hypotheses, not on the impossible burden of proving a negative.

  **Conclusion**

  Requiring this revision strengthens the dissertation. It transforms the project from a demonstration of selection (which assumes the conclusion) to a test of mechanism (which allows for surprise). It ensures that when [Student Name] advances to candidacy, her research program is insulated against the criticism that she failed to consider the structural context of the trait she is studying.

  Please review this recommendation prior to our vote next week.

  **[Your Name/Signature]**
  **PhD Candidate & Student Representative**
