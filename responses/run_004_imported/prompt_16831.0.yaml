      *   **Topic:** Saul Kripke's *Naming and Necessity*, specifically rigid designators and the necessary a posteriori status of identity statements like "Water is H2O."
      *   **The Objection:** The "Anachronism/Reference Shift" objection. If "water" *necessarily* refers to H2O, then pre-1780s speakers were referring to H2O without knowing it. If they weren't referring to H2O (because they lacked the concept), then the meaning must have shifted. The user sees a dilemma: either reference shifted (meaning changed) or Kripke is begging the question (assuming "water" meant H2O all along).
      *   **Tone:** Skeptical, inquisitive, feeling like something is being swept under the rug ("everywhere I look this gets treated as settled business").
