      *   **The Mechanism:** Rigid designators. "Water" picks out the *stuff* in the actual world, not a description (like "clear, drinkable liquid").
      *   **The User's Worry:** How can "water" pick out H2O if the users didn't know about H2O? Isn't that magical? Or isn't it just redefining the word?
