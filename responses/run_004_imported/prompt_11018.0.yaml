  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *What is it?* Assigning a probability to a single event requires placing that event in a class. But an individual belongs to infinite classes. Different classes yield different probabilities. Which one is the "true" probability?
      *   *Why is it deep?* It strikes at the heart of what probability *means* for individuals. If probability is frequency (Frequentism), single-case probability is meaningless without a class. If it's subjective (Bayesian), it depends on the information set (which is essentially a reference class).
