prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and in three weeks I'm giving the toast at my oldest friend's wedding. Some background that I think matters for the request: Priya, the bride, is marrying Daniel, a management consultant with a decision-theory hobby, who spent a solid month before they got engaged arguing that a wedding was a wasteful, purely symbolic expense layered on top of the marriage license — "legally we'd be exactly as married for a tenth of the cost" — until, by his own sheepish account, Priya's sister sat him down and walked him through the difference between mutual knowledge and common knowledge: that quietly signing paperwork gives the couple, and maybe two witnesses, the fact that they're married, but standing up in front of a hundred and fifty people, all watching the vows and watching one another watch, produces something categorically stronger — not just that everyone present knows, but that everyone knows that everyone knows, and knows that they know that, all the way up. That is exactly the structure epistemic game theorists reach for when they talk about common knowledge of rationality underwriting an equilibrium, and exactly what stays merely mutual, however many levels deep, in things like the coordinated-attack problem or the blue-eyed-islanders puzzle, until some public event forces it into the open. Daniel, apparently, found this persuasive; the wedding is now happening; and I have volunteered to give the toast that has to actually sell it.

  What I'd like from you is the toast itself — spoken text, not notes, running about four or five minutes — built honestly around that distinction, for a room that's maybe a fifth people who will recognize precisely what I'm doing and wince if I get it hand-wavy, and four-fifths family and old friends who have never heard "common knowledge" used this way and must not feel lectured at for a second. It should actually explain, correctly, why standing in a room together accomplishes something a courthouse visit does not, rather than just gesturing at "it's more meaningful" — while remaining, first and always, a toast: warm, a little roasting of Daniel for his original spreadsheet-based objections, and ending on a toast line the whole room can raise a glass to, not just the handful who'd clock the phrase "partition structure."
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Long-time rationalist reader (Overcoming Bias era), close friend of the couple.
      *   **Occasion:** Wedding toast for Priya (bride) and Daniel (groom).
      *   **Duration:** 4-5 minutes spoken (approx. 600-750 words).
      *   **Key Theme:** The distinction between *mutual knowledge* and *common knowledge* (specifically regarding the public nature of the wedding vs. a courthouse).
      *   **Audience:** 20% rationalists (need technical accuracy, no hand-waving), 80% general public/family (need accessibility, warmth, no jargon overload).
      *   **Tone:** Warm, humorous (roasting Daniel's initial hesitation), persuasive (explaining *why* the wedding matters), celebratory.
      *   **Constraint:** Must end with a clear toast line everyone can use.

  2.  **Deconstruct the Core Concept (Mutual vs. Common Knowledge):**
      *   *Mutual Knowledge:* Everyone knows $X$. (I know you're married, you know I know, but does my grandma know that your boss knows?)
      *   *Common Knowledge:* Everyone knows $X$, everyone knows that everyone knows $X$, everyone knows that everyone knows that everyone knows $X$... ad infinitum.
      *   *The Mechanism:* Public announcement in a shared physical space creates this infinite recursion instantly.
      *   *The Application:* A courthouse is private (mutual). A wedding is public (common). This stabilizes the social equilibrium of the marriage.
      *   *The Challenge:* Explain this without saying "epistemic game theory" or "partition structures" to the 80%. Use metaphors or plain language that satisfies the 20% implicitly.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Hook the room, acknowledge the friendship, introduce Daniel's quirks (the spreadsheet/consultant angle).
      *   **The Conflict:** Daniel didn't want the wedding. He wanted efficiency. The "courthouse argument."
      *   **The Turning Point:** Priya's sister's intervention. This is where the concept enters.
      *   **The Explanation (The Tricky Part):** How to explain common knowledge simply?
          *   *Idea:* Use the "ripple" or "echo" metaphor. Or the difference between a secret handshake and a bell ringing.
          *   *Rationalist Nod:* Use the phrase "common knowledge" but define it immediately in human terms.
          *   *Analogy:* The difference between knowing a bridge is safe vs. seeing everyone else walk on it.
      *   **The Application to Marriage:** Why does this matter? It's not just about love; it's about the community holding the space. It creates a shared reality.
      *   **The Roast:** Daniel's spreadsheet. His conversion.
      *   **The Conclusion:** Bringing it back to love. The technicality serves the emotion.
      *   **The Toast:** Needs to be inclusive.

  4.  **Refining the Explanation (Iterative Process):**
      *   *Attempt 1:* "Daniel thought mutual knowledge was enough. But Priya's sister explained common knowledge." -> *Too jargon-heavy for grandma.*
      *   *Attempt 2:* "It's about everyone knowing everyone knows." -> *A bit clunky.*
      *   *Attempt 3:* "If I tell you a secret, we both know it. But if I shout it in this room, we all know that we all know it. That changes how we act." -> *Better.*
      *   *Rationalist Check:* Is it accurate? Yes, public announcement transforms mutual to common knowledge.
      *   *General Audience Check:* Does it sound like philosophy or just wisdom? Needs to sound like wisdom.

  5.  **Drafting the Content (incorporating tone):**
      *   *Voice:* Warm, slightly intellectual but grounded.
      *   *Daniel's Character:* Loveable nerd, consultant, logical.
      *   *Priya's Character:* The anchor, the one who understood the social reality.
      *   *The "Sister" Moment:* Give credit to the sister (maybe name her if known, but "Priya's sister" works for the prompt).
      *   *The "Why":* Marriage isn't just a contract between two; it's a status within a network.

  6.  **Writing - First Pass (Mental or rough notes):**
      Hi everyone. I know Daniel. He loves spreadsheets. He said wedding = waste. Court house = same legal status. Cheaper. Logical. But Priya's sister told him about common knowledge. It's like... if we all clap, we know we all clapped. A wedding makes the marriage real to the community. It's not just I know you're married. It's I know that *you* know that *I* know. This makes it stick. Daniel agreed. So here we are. Let's drink.

      *Critique:* Too dry. Needs more heart. Needs to explain the "infinite recursion" without saying "infinite recursion."

  7.  **Writing - Second Pass (Focusing on Flow and Metaphor):**
      Start with the spreadsheet. Daniel is a consultant. He optimized. But he missed the social tech. The sister explained that a wedding is a public broadcast. It creates a shared reality. For the nerds in the room, it's common knowledge. For everyone else, it's the difference between a whisper and a song. When we all witness this, we become responsible for it. That's why we are here.

      *Critique:* Getting closer. Need to make sure the 20% don't wince. The definition must be precise even if simple. "Everyone knows, and everyone knows that everyone knows." That phrase is iconic enough to work for both groups.

  8.  **Final Polish (Checking Constraints):**
      *   *Time:* 4-5 mins is roughly 600-750 words at a moderate pace.
      *   *Tone:* Warmth check. Is Daniel being roasted gently? Yes. Is Priya honored? Yes.
      *   *Ending:* Needs a clear "Please raise your glasses."

  9.  **Final Review against the "Rationalist" constraint:**
      *   Did I use the term "common knowledge"? Yes.
      *   Did I explain the recursion? Yes ("knows that we know").
      *   Did I avoid "partition structure"? Yes.
      *   Is the logic sound? Yes, the wedding acts as the public signal that collapses the uncertainty.

      *(Self-Correction during drafting)*: Make sure not to make Daniel sound *too* cold. He was convinced by reason, which is good. He loves Priya enough to update his priors. That's a nice touch.

  10. **Final Word Count Check:** Aiming for ~700 words.

      *(Drafting the actual response based on these thoughts...)*
      *   Start with the spreadsheet story.
      *   Introduce the "Sister's Argument."
      *   Explain the concept simply.
      *   Connect to the room's role.
      *   Toast.

      *Let's write it.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've known Daniel for a long time. Long enough to know that when he says he loves something, he means he has a spreadsheet about it. And when he says he's skeptical, he means he has a sensitivity analysis.

  So, when Daniel and Priya got engaged, Daniel did what Daniel does. He opened a spreadsheet. He compared the cost of a wedding versus a courthouse. He looked at the legal statutes. And he concluded, quite logically, that a wedding was an inefficient signal. Legally, a license is sufficient. Emotionally, he argued, they knew they loved each other. Their parents knew. Their friends knew. Why spend the money to say it out loud?

  He was ready to sign the papers and go to dinner. Until Priya's sister sat him down.

  She didn't argue about tradition. She didn't argue about romance. She argued about information. She told Daniel that there is a massive difference between *everyone knowing* something, and *everyone knowing that everyone knows* something.

  For the few people in this room who speak Nerd: She was talking about the difference between mutual knowledge and common knowledge.

  If Daniel and Priya had gone to a courthouse, it would have been mutual knowledge. We would all know they are married. But we wouldn't necessarily know that *our uncle* knows that *their boss* knows. In a courthouse, the information is siloed. But here? In this room? With the vows spoken aloud, the rings exchanged in view, and the drinks poured? This is a public broadcast.

  When you stand up and witness this, you aren't just learning a fact. You are becoming part of a network that sustains that fact. You know they are married. You know that I know they are married. And crucially, you know that *they* know that *we* know.

  That recursion matters. In game theory, common knowledge is what allows strangers to coordinate. It's what turns a crowd into a community. A marriage isn't just a contract between two people; it's a status within a tribe. By gathering here, you aren't just watching a promise; you are becoming the guarantors of it. You are creating a shared reality that is much harder to break than a private agreement.

  Daniel, to his credit, updated his priors immediately. He realized that while a license makes you married in the eyes of the state, a wedding makes you married in the eyes of the world. He realized that efficiency isn't the only virtue. Sometimes, the "wasteful" expense is actually the investment in the social infrastructure that holds the marriage together.

  Priya, you didn't just win an argument; you taught him that some things are too important to be private. And Daniel, you didn't just give in; you recognized that love isn't just about what you feel in the dark, but what you declare in the light.

  So, looking around this room, I see the infrastructure. I see the common knowledge. I see the hundred and fifty of you, ready to hold this truth together.

  If everyone could please raise their glasses.

  To Priya and Daniel: May your love be private enough to keep you warm, but public enough to keep you strong. May you always have the courage to make your commitments common knowledge. And may you never have to run the numbers on your happiness again.

  To the bride and groom!
