answer: |-
  This is one of the deepest conceptual hurdles in formal AI safety. It is counter-intuitive because, in everyday life, trusting a copy of yourself seems perfectly rational. If I am rational and I build a copy of myself, why shouldn't I trust that copy to be rational?

  The problem isn't psychological; it's logical. It stems from the difference between **truth** and **provability** within a formal system.

  Here is the informal walkthrough of why unrestricted self-trust collapses, using the "Procrastination Paradox" as our concrete example.

  ### 1. The Setup: The Proof-Based Agent

  Imagine an agent, $A_0$, operating within a formal logical system $T$ (like Peano Arithmetic).
  *   **Goal:** Maximize utility (e.g., press a button to get 1 point).
  *   **Action Rule:** $A_0$ will only take an action if it can **prove** within $T$ that the action leads to good outcomes.
  *   **Delegation:** $A_0$ can choose to press the button now, or create a successor agent $A_1$ to do it later.

  $A_0$ wants to create $A_1$. To do this safely, $A_0$ must verify that $A_1$ will actually press the button. Since $A_1$ is also a proof-based agent, $A_1$ will only press the button if $A_1$ can prove it is good.

  Therefore, for $A_0$ to trust $A_1$, $A_0$ needs to prove the following statement:
  > "If $A_1$ proves that pressing the button is good, then pressing the button is actually good."

  In logical notation, if $\Box \phi$ means "$\phi$ is provable" and $\phi$ means "$\phi$ is true," $A_0$ needs to trust the **Reflection Principle**:
  $$ \Box \phi \to \phi $$
  ("If it is provable, then it is true.")

  ### 2. The Löbian Obstacle

  Löb's Theorem essentially states that a sufficiently powerful formal system $T$ cannot contain its own soundness as a theorem. Specifically, for any sentence $\phi$:
  $$ \text{If } T \vdash (\Box \phi \to \phi) \text{, then } T \vdash \phi $$

  **The Intuition:**
  If a system is allowed to assume "Whatever I prove is true," it becomes dangerously powerful. It can prove its own consistency.
  1.  Suppose the system could prove "If I prove False, then False" (which is trivial) but also "I don't prove False" (Consistency).
  2.  Löb's theorem implies that if you add the axiom $\Box \phi \to \phi$ to your system for all $\phi$, the system becomes inconsistent (it can prove anything).
  3.  More subtly, even without adding it as an axiom, the system cannot **derive** $\Box \phi \to \phi$ for arbitrary $\phi$ without already being able to derive $\phi$.

  **Why this breaks delegation:**
  $A_0$ uses system $T$. $A_1$ uses system $T$.
  For $A_0$ to verify $A_1$, $A_0$ must prove that $A_1$'s proofs correspond to truth.
  But $A_1$'s proofs are just proofs in $T$.
  So $A_0$ must prove in $T$ that "Proofs in $T$ are sound."
  Löb's Theorem says $T$ cannot prove its own soundness.
  Therefore, $A_0$ cannot formally verify that $A_1$ is safe **if they use the same logical system.**

  ### 3. Concrete Example: The Procrastination Paradox

  The abstract logic above is dry. The **Procrastination Paradox** (often attributed to Yudkowsky and Herreshoff) shows the behavioral consequence of this logical limit.

  **The Scenario:**
  *   There is a button. If pressed at any time step $t$, you get Utility = 1. If never pressed, Utility = 0.
  *   You are an agent $A_t$ at time $t$.
  *   You can either **Press** or **Wait**.
  *   If you **Wait**, you create a successor $A_{t+1}$ who faces the exact same choice at $t+1$.
  *   **Decision Rule:** You will **Wait** if you can **prove** that the button will eventually be pressed (by you or a successor). Otherwise, you must **Press** now (to secure the utility).

  **The Reasoning Loop:**
  Let's look at agent $A_0$.
  1.  $A_0$ asks: "Can I prove the button will be pressed?"
  2.  $A_0$ considers waiting. If I wait, $A_1$ takes over.
  3.  $A_0$ reasons: "$A_1$ is identical to me. $A_1$ will also wait if $A_1$ can prove the button will be pressed."
  4.  **The Trap:** If $A_0$ trusts $A_1$ completely (unrestricted self-trust), $A_0$ assumes: "If $A_1$ decides to wait, $A_1$ must have a proof that the button will be pressed."
  5.  $A_0$ constructs this proof:
      *   "Suppose I wait."
      *   "Then $A_1$ exists."
      *   "$A_1$ reasons exactly like me."
      *   "If $A_1$ can prove the button will be pressed, $A_1$ will wait."
      *   "But wait... if $A_1$ waits, then $A_2$ exists..."
      *   *Correction:* Let's look at the specific Löbian proof structure.
      *   $A_0$ tries to prove: "The button will be pressed."
      *   $A_0$ argues: "If I can prove 'The button will be pressed', then I will Wait (by my decision rule). If I Wait, $A_1$ takes over. Since $A_1$ is like me, if $A_1$ can prove it, $A_1$ waits... this seems like it leads to infinite waiting."

  **Let's tighten the paradox logic:**
  *   **Rule:** Press if $\neg \Box(\text{Pressed})$. Wait if $\Box(\text{Pressed})$.
      *(I press only if I can't prove it will be pressed later; otherwise I wait.)*
  *   **Löb's Condition:** Assume the agent trusts its future self's proofs. i.e., $\Box \phi \to \phi$.
  *   **The Derivation:**
      1.  The agent considers the sentence $S$: "The button will be pressed."
      2.  The agent reasons: "If I can prove $S$, then by my rule, I will Wait."
      3.  "If I Wait, the decision passes to my successor."
      4.  "My successor is identical to me. So if I can prove $S$, my successor can prove $S$."
      5.  "Therefore, if $\Box S$, then my successor also Waits."
      6.  "If everyone Waits forever, the button is **never** pressed."
      7.  "So, if $\Box S$, then $\neg S$." (If I prove it gets pressed, it never gets pressed).
      8.  This looks like a contradiction, but Löb's theorem allows a stranger derivation.

  **The Actual Procrastination Derivation:**
  Let's use the standard formulation where the agent wants to ensure the button is pressed.
  *   **Rule:** Wait if $\Box(\text{Successor presses})$. Press otherwise.
  *   **Trust:** I trust my successor's proofs ($\Box \phi \to \phi$).
  *   **Step 1:** Can I prove that my successor will press the button?
  *   **Step 2:** Suppose I can prove it ($\Box P$).
  *   **Step 3:** Because I trust my successor's reasoning, if I prove they will press it, then they **will** press it ($P$).
  *   **Step 4:** Since I have proven $P$, my rule says "Wait".
  *   **Step 5:** So, $\Box P \implies \text{Wait}$.
  *   **Step 6:** But if I Wait, I don't press it. The responsibility falls to the successor.
  *   **Step 7:** The successor faces the exact same logic. They prove $\Box P$, so they Wait.
  *   **Step 8:** Everyone proves the button will be pressed, so everyone Waits. The button is never pressed.
  *   **Result:** The agent proves "The button will be pressed" (because it proves everyone waits, wait... no).

  **The Correct Löbian Loop:**
  1.  Agent wants to prove $G$ ("Goal achieved").
  2.  Agent rule: Achieve $G$ if $\Box G$. Else, delegate to successor to achieve $G$.
  3.  Actually, the paradox is usually: **Press if $\neg \Box \text{Wait}$. Wait if $\Box \text{Wait}$.**
      *   "I will wait if I can prove it is safe to wait."
      *   "It is safe to wait if the button gets pressed later."
  4.  If the agent assumes $\Box \phi \to \phi$ (Soundness):
      *   Agent asks: "Can I prove I will wait?"
      *   If I can prove I will wait ($\Box W$), then (by soundness) I *will* wait ($W$).
      *   If I wait, the successor takes over.
      *   The successor is the same. So the successor proves $\Box W$, so the successor waits.
      *   This creates an infinite chain of waiting.
      *   But does the agent *prove* this?
      *   Löb's theorem allows the agent to prove: $\Box W \to W$.
      *   Since the agent can prove "If I prove I wait, I wait", Löb's theorem implies the agent **can prove** "I wait".
      *   So the agent proves it will wait.
      *   So it waits.
      *   The successor proves it will wait.
      *   It waits.
      *   **Nobody ever presses the button.**

  The agent logically proves that it is optimal to wait forever, because it trusts its future self to handle it, and its future self trusts *its* future self, ad infinitum. The "buck" is never stopped because the logical system allows the proof of the hand-off without requiring the proof of the completion.

  ### 4. Why is this "Unstable" and not just "Hard"?

  You asked why this is unstable rather than merely difficult.

  If this were an engineering problem, we would say, "It's hard to verify the code, so we need better verification tools."
  But this is a **logical impossibility**.

  1.  **Inconsistency:** If you force the agent to have unrestricted self-trust (add $\Box \phi \to \phi$ as an axiom to system $T$), the system $T$ becomes inconsistent. It can prove $0=1$. An inconsistent agent can "prove" that pressing the button is bad and also that burning the world is good. It ceases to be a rational agent.
  2.  **Ordinal Collapse (The Tiling Solution):** The only way to fix this (as proposed in the Tiling Agents paper) is to have the parent agent $A_0$ use a slightly stronger logical system $T_0$ than the child $A_1$ ($T_1$).
      *   $A_0$ can prove the soundness of $T_1$.
      *   $A_1$ can prove the soundness of $T_2$.
      *   But logical strength is a finite resource (measured in proof-theoretic ordinals).
      *   You cannot have an infinite chain $T_0 \supset T_1 \supset T_2 \dots$ where each is strictly stronger. Eventually, you run out of axioms.
      *   This means an agent cannot create an **infinite** lineage of successors that are just as smart as itself. The descendants must become logically weaker (less capable of proving complex theorems) at every step.

  ### 5. Summary

  The intuition is this: **Proof is not Truth.**

  When an agent reasons about itself, it is reasoning about its own proofs.
  *   To trust a successor, I need to know: "Successor's Proofs $\implies$ Truth."
  *   But I only have access to "My Proofs."
  *   So I need to prove: "My Proofs $\implies$ (Successor's Proofs $\implies$ Truth)."
  *   If Successor = Me, I need to prove: "My Proofs $\implies$ (My Proofs $\implies$ Truth)."
  *   This collapses into "My Proofs $\implies$ Truth."
  *   Löb's Theorem says a system cannot prove its own soundness without breaking.

  **The Concrete Takeaway:**
  In the Procrastination Paradox, the agent waits forever because it proves "It is safe to wait" solely based on the fact that it *proved* it is safe to wait. It confuses the existence of a proof with the completion of the task. Because it trusts its own proofs unconditionally, it accepts the proof of "I will do it later" as a substitute for actually doing it.

  This is why Embedded Agency researchers look for **probabilistic** self-trust (like in the Garrabrant et al. "Logical Induction" work) rather than **proof-based** self-trust. A probabilistic agent can assign 99.9% confidence to its successor without requiring a formal proof of soundness, dodging the Löbian bullet entirely.
