      *   *Is it a third option?* Not really. It's an epistemic/semantic distinction masking a metaphysical commitment to distinct individuals. It allows us to *talk* about modality ("Adam could have not sinned") without committing to TWI. But metaphysically, the "Adam who doesn't sin" is a *different* individual concept.

