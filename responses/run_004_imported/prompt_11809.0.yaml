  9.  *(Post-Drafting Review)*: Does this meet the "defend an actual verdict" constraint? Yes. Does it note the shared cost? Yes. Is it precise enough for a PhD student? I need to ensure I don't oversimplify the GJN formalism. I should mention that for GJN, $H \vdash E$ is treated as a contingent proposition *for the agent*, even if it's necessary *in reality*.

