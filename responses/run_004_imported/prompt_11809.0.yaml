      *   *Historical Case:* Einstein, GR, Mercury's perihelion (already known, $P(E)=1$). Yet, intuitively, $E$ confirmed $H$.

  3.  **Analyze Solution 1: Garber-Jeffrey-Niiniluoto (GJN):**
      *   *Core Idea:* Relax Logical Omniscience.
      *   *Mechanism:* The agent learns a *logical relation*, not the evidence itself. Let $L$ be the proposition "$H$ entails $E$" ($H \vdash E$).
      *   *Probability Space:* Expand the algebra to include sentences about logical relations.
      *   *Update:* Conditionalize on $L$, not $E$. Since $P(L) < 1$ initially (agent isn't logically omniscient), $P(H|L)$ can differ from $P(H)$.
      *   *Trade-off/Give-up:* Gives up the idealization of Logical Omniscience. Requires a logic of probability over sentences/propositions about entailment. Can get computationally messy (what is the probability of a logical truth?).
      *   *Fit for Mercury:* Einstein didn't learn the perihelion shift (he knew it); he learned that GR *entails* the shift. This matches the psychological/historical reality well.

  4.  **Analyze Solution 2: Counterfactual (Howson):**
      *   *Core Idea:* Keep Logical Omniscience, change the Probability Function.
      *   *Mechanism:* Evaluate confirmation using a counterfactual probability function $P^*$, where $P^*(E) < 1$. This represents what the agent *would* have believed had they not known $E$.
      *   *Update:* Confirmation is defined by $P^*(H|E) > P^*(H)$.
      *   *Trade-off/Give-up:* Gives up the idea that confirmation is about *actual* belief change. It makes confirmation ahistorical or subjective in a specific way (dependent on constructing a specific counterfactual state). Raises the "problem of ur-priors" or how to strip $E$ from the belief set without affecting everything else (holism).
