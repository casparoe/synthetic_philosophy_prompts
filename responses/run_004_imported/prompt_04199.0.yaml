answer: |-
  The banquet hall of the Vienna Center for Logic and the History of Science was loud, a cacophony of clinking cutlery and overlapping debates in half a dozen languages. Arthur found Elena at a small round table near the back, nursing a glass of Grüner Veltliner. They hadn't seen each other since the London workshops in the nineties, back when they were both sharp-elbowed grad students arguing over Kuhn. Now, the elbows were slightly softer, but the eyes were just as sharp.

  Arthur pulled out a chair. "Mind if I join you? I need a refuge from the keynote. That talk on 'Post-Empirical Science' nearly gave me hives."

  Elena smiled, raising her glass. "Arthur. I wondered if you'd show up. And I take it you weren't charmed by the speaker's suggestion that falsifiability is a 'historical relic'?"

  "Relic?" Arthur signaled the waiter for water. "It's the load-bearing wall, Elena. If you knock it out, the whole building comes down. The speaker was essentially arguing that if a theory is mathematically consistent and elegant enough, it doesn't need to stick its neck out. That's not physics. That's theology with better calculus."

  "Careful," Elena said, her tone light but her gaze steady. "You're setting up a straw man. The argument isn't that evidence doesn't matter. It's that in domains like quantum gravity, where the Planck scale is fifteen orders of magnitude beyond the LHC, the *nature* of confirmation has to evolve. We can't just wait for a direct test that might be physically impossible for centuries. We need to assess the theory's viability based on the constraints we *do* have."

  "Constraints aren't tests," Arthur countered. "Popper was clear. A theory is scientific only if it forbids certain states of affairs. If string theory can accommodate almost any low-energy physics by adjusting the compactification of the extra dimensions—the 'landscape' problem—then it forbids nothing. It's unfalsifiable. End of story."

  "Naive falsificationism," Elena said, shaking her head. "You know as well as I do that Lakatos demolished that view fifty years ago. Scientists never drop a theory because of a single anomaly. If they had, Newton would have been discarded over the orbit of Uranus before Adams and Le Verrier found Neptune. They adjusted the protective belt to save the hard core. That's rational."

  "Lakatos," Arthur sighed. "I knew you'd bring him up. I read his essays during my sabbatical. He's more nuanced than Popper, I'll grant you. But he didn't throw out the requirement for empirical progress. For Lakatos, a research programme is 'progressive' only if it leads to the discovery of *novel facts*. If it's just patching the belt to explain old data, it's 'degenerating.' My worry is that string theory has been the hard core of a research programme for forty years. Where are the novel facts?"

  Elena paused, swirling her wine. This was the crux. "That is the fair question. And I'll concede the point: if we look strictly at empirical novel facts, string theory is currently in a precarious position. It predicted supersymmetry at the TeV scale, and the LHC didn't find it. By a strict Lakatosian empirical metric, that's a blow."

  "So you admit it's degenerating?"

  "Not necessarily," Elena leaned forward. "Because Lakatos also talks about the *positive heuristic*—the ability of the programme to generate new mathematics, new connections, and solve internal problems that plagued previous programmes. String theory hasn't just been patching holes. It gave us AdS/CFT. It revolutionized our understanding of black hole entropy. It provided a framework where quantum mechanics and general relativity don't explode when they touch."

  "Mathematical consistency isn't empirical novelty, Elena," Arthur pressed. "You're shifting the goalposts from 'nature' to 'mathematics.' If the criterion for science becomes 'internal coherence and fertility,' then scholastic angelology could claim scientific status if the logic was tight enough."

  "That's the Popperian purism talking," Elena shot back. "But let's bring in Dawid, since you mentioned the integrity of physics. Dawid argues for 'non-empirical confirmation.' It's not just aesthetics. It's the 'No Alternatives' argument. For forty years, despite massive effort, no one has found a consistent theory of quantum gravity that isn't string theory (or doesn't look like it). If the space of possible theories is small, and we've found the only consistent one, the probability that it's true increases, even without direct data."

  Arthur tapped his glass. "That's a meta-inductive argument. It relies on the sociological fact that physicists haven't found anything else. But what if they haven't looked in the right way? Or what if nature isn't constrained by the mathematical consistency criteria you're assuming? You're saying: 'We can't imagine a rival, therefore this must be right.' That sounds like an argument from ignorance."

  "It's an argument from constraints," Elena corrected. "Quantum field theory and General Relativity are incredibly rigid structures. Trying to combine them is like trying to fit two specific puzzle pieces together. If only one shape fits, you trust the fit. But look, Arthur, I'm not saying we suspend the requirement for empirical test forever. I'm saying that given the energy scales, we must extend the timeline for what counts as a 'progressive' programme. Lakatos didn't specify a deadline."

  "But he did specify the direction," Arthur said softly. "The programme must point toward *new* empirical content. If string theory retreats into the multiverse—where every possible vacuum exists somewhere—then it effectively surrenders the claim to predict *our* vacuum. If you can't predict why the cosmological constant is what it is, but instead say 'it's anthropic selection in a multiverse,' you've stopped doing physics. You've moved to cosmology philosophy."

  Elena sighed, looking down at her plate. "I share that unease. Truly. The landscape is a problem. But consider the alternative. If we declare string theory 'non-science' today, we defund it, we stop the work. We might kill the only lead we have. A Lakatosian would say: keep the programme alive as long as the positive heuristic is fertile. As long as it's generating insights—even mathematical ones that might eventually cash out empirically—it remains progressive."

  "So where does that leave us?" Arthur asked. "You're defending a programme that hasn't delivered the specific currency Lakatos demanded (empirical novelty), using arguments Dawid admits are non-empirical. I'm defending a demarcation line that might stifle a theory simply because nature is harder to probe than we'd like."

  "Let's try to find the boundary," Elena proposed. "We might not agree on the status of string theory *today*, but can we agree on what would have to happen for us to agree it has failed?"

  Arthur considered this. "For me, the Popperian line is clear. If it becomes impossible *in principle* to construct a test, even an indirect one, that could rule it out, it's out. If the theory is compatible with *any* observation we could possibly make, it's not science."

  "I can accept that," Elena nodded. "Even a Lakatosian needs the possibility of empirical refutation eventually. If the 'protective belt' becomes so thick that no observation can penetrate to the hard core, the programme is dead. But I would add a condition: If the positive heuristic dries up. If it stops solving new problems, stops generating new mathematics, stops connecting to other fields... then it's degenerating, regardless of whether it's falsifiable."

  "So," Arthur mused, "we have a two-pronged test. One: It must remain *in principle* falsifiable, even if the technology doesn't exist yet. Two: It must remain heuristically fertile, solving problems we didn't design it to solve."

  "Exactly," Elena said. "If string theory becomes a closed loop—mathematically consistent but disconnected from any potential observation, and ceasing to generate new insights—then we both pull the plug. You because it's unfalsifiable, me because it's degenerating."

  "And if it makes a risky prediction?" Arthur asked. "Say, a specific signature in the polarization of the CMB, or a deviation in gravity at short ranges?"

  "Then I'm vindicated," Elena smiled. "And you have your falsifiability."

  "And if it doesn't? If another twenty years pass with no empirical novelty, and the only defense is 'it's still the only game in town'?"

  Elena took a slow sip of wine. "Then I will concede that the 'No Alternatives' argument has expired. The lack of alternatives might just mean we're in a conceptual rut, not that we've found the truth. If the heuristic fertility slows down, I'll call it degenerating. And a degenerating programme, Lakatos says, should eventually be abandoned for a progressive one."

  Arthur raised his water glass. "So, you're not asking for a permanent exemption from empirical testing. You're asking for a stay of execution based on past performance and current lack of rivals."

  "I'm asking for the time to let the theory mature in an environment where direct experimentation is physically constrained," Elena said, clinking her glass against his. "But I agree: the clock is ticking. If there are no novel facts by the time the heuristic fertility dries up, the programme dies."

  "And I," Arthur added, "will admit that if it *does* make a risky prediction that holds, I will eat my hat. Popper never said a theory had to be false, only that it had to be *testable*. If string theory clears that bar, it's science."

  "To the bar, then," Elena said. "May it be high enough to keep out the nonsense, but low enough to let the truth through."

  "I'll drink to that," Arthur said. "Though I still think you're betting on a horse that hasn't left the gate in forty years."

  "And I think," Elena replied, "you're judging the race before the track is built. But at least we agree on what finish line looks like."

  They drank, the noise of the conference hall swelling around them, the demarcation line still drawn in the sand, but for the moment, acknowledged by both sides.
