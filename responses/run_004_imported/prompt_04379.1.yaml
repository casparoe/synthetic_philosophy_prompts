      1. Introduction: The core tension.
      2. The Determinism Argument & The Fork.
      3. Peirceanism: Inevitability & The Cost to Logic.
      4. Ockhamism: Relativization & The Cost to Metaphysics.
      5. The Thin Red Line: A Failed Patch?
      6. Conclusion/Verdict.

      *Refining the Determinism Premises:*
      Standard Fatalism Argument:
      1. $p \lor \neg p$ (Bivalence)
      2. $T(p) \to \Box p$ (Necessity of Truth)
      For future:
      1. $Fp \lor \neg Fp$
      2. $Fp \to \Box Fp$
      Peirce attacks the equivalence of $\neg Fp$ and $F\neg p$ (effectively denying $Fp \lor F\neg p$).
      Ockham attacks the move from $T(p)$ to $\Box p$ by relativizing $T$.

