prompt: |-
  Ok, weird one for you. I'm on the board of a small science-journalism co-op, and our last president election was a mess: three candidates, plain plurality vote, and the winner (Leo, ~34%) would apparently have lost head-to-head to either of the other two — he only won because they split the reform-minded vote. Half the board wants ranked-choice next time to stop that happening again, but our treasurer, a total math nerd, is countering with a long email about Arrow's theorem — something about independence of irrelevant alternatives, and candidates being able to end up loosing by GAINING votes — and pushing for approval voting instead. We vote on the bylaw change in three weeks and everyone's assuming that because I write about science for a living I already understand this. Could you draft the memo I'll actually circulate? It should recommend one specific method, explain the reasoning so a non-math board member can follow it, and take the strongest objection to whatever you pick seriously rather than brushing it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small science-journalism co-op board.
      *   **Problem:** Last election had a "spoiler effect" (Leo won with 34% via plurality, likely loses head-to-head).
      *   **Conflict:** Half the board wants Ranked-Choice Voting (RCV). The Treasurer (math nerd) argues against RCV using Arrow's Impossibility Theorem (specifically Independence of Irrelevant Alternatives and monotonicity violations) and pushes for Approval Voting.
      *   **Task:** Draft a memo to circulate to the board.
      *   **Requirements:**
          *   Recommend *one* specific method.
          *   Explain reasoning clearly for non-math people.
          *   Take the strongest objection seriously (don't brush it off).
          *   Tone: Professional, persuasive, accessible (science-journalism context).
          *   Timeline: Vote in three weeks.

  2.  **Evaluate the Options:**
      *   **Plurality (Current):** Clearly failed. Spoiler effect evident. Not an option for recommendation.
      *   **Ranked-Choice Voting (RCV/IRV):**
          *   *Pros:* Intuitive (rank candidates), avoids spoiler effect mostly, ensures majority support eventually.
          *   *Cons:* Complex to count manually, can fail monotonicity (ranking higher hurts you), Arrow's Theorem applies (no perfect system).
          *   *Treasurer's Objection:* Valid mathematically. Arrow's Theorem proves no ranked system is perfect. Monotonicity failures are rare but real.
      *   **Approval Voting:**
          *   *Pros:* Simple (vote for all you like), satisfies monotonicity (more votes never hurt), minimizes strategic voting in many contexts, easy to count.
          *   *Cons:* Doesn't capture intensity of preference (1st vs. 2nd choice looks the same), can lead to "bullet voting" (voting for only one) if strategy gets weird, might elect a "least objectionable" candidate rather than a passionate favorite.
          *   *Treasurer's Objection:* He supports this.
      *   **Score/Range Voting:**
          *   *Pros:* Captures intensity.
          *   *Cons:* Strategy is complex (do you max out or be honest?), harder to explain.
      *   **Condorcet Methods:**
          *   *Pros:* Elects the head-to-head winner (solves the Leo problem directly).
          *   *Cons:* Complex to explain/count, can have cycles (no winner).

      *   **Decision:** Which one to recommend?
          *   The prompt asks me to pick *one*.
          *   RCV is the popular reform choice ("Half the board wants it").
          *   Approval is the "math nerd" choice.
          *   For a *small co-op board*, simplicity and consensus are key.
          *   *Argument for Approval:* It solves the specific problem (Leo winning with 34% due to split votes) without the complexity of RCV. It addresses the Treasurer's concern about Arrow's theorem (Approval isn't subject to Arrow's in the same way because it's cardinal/rated, not ordinal, though Gibbard-Satterthwaite still applies). It's easier to administer for a small volunteer group.
          *   *Argument for RCV:* It feels more democratic to express nuance.
          *   *Selection:* **Approval Voting.** Why? Because the Treasurer's math argument is strong regarding RCV's flaws (monotonicity), and for a small board, the simplicity of Approval reduces administrative friction. Also, it directly solves the "vote splitting" issue without the counting complexity of RCV. *However*, RCV is more familiar to people pushing for reform.
          *   *Alternative Selection:* **Ranked-Choice (RCV).** Why? Because "Half the board wants it." It's easier to sell a compromise that looks like what the reformers want but addresses the math concerns. *But* the prompt highlights the Treasurer's specific math objections. Ignoring Arrow's theorem is hard.
          *   *Better Selection:* **Approval Voting.** It's the distinct "science-literate" choice. It sidesteps the specific Arrow constraints on *ranked* systems. It's robust. I will recommend Approval Voting but acknowledge the desire for RCV.
          *   *Wait, actually:* For a small co-op, **Ranked-Choice** is often more satisfying emotionally (expressing preference order). But the Treasurer is right about the math quirks. However, Approval Voting has its own strategic issues (where do you draw the line between approve/disapprove?).
          *   *Let's look at the "Science-Journalism" angle:* They value nuance and accuracy. Approval voting is simple but loses nuance. RCV keeps nuance but has math flaws.
          *   *Decision:* I will recommend **Ranked-Choice Voting (RCV)**, but specifically the **Instant Runoff** variety, while addressing the Treasurer's concerns honestly. *Wait, no.* The Treasurer is pushing Approval *because* of Arrow. If I recommend RCV, I have to fight the math nerd. If I recommend Approval, I have to fight the reformers.
          *   *Strategic Choice:* **Approval Voting** is actually the stronger recommendation for a *small board* where strategic voting is less likely and simplicity is king. It solves the "Leo" problem (vote for both reformers) without the counting nightmare. It also neutralizes the Treasurer's objection because Approval Voting is *not* a ranked ordinal system, so Arrow's Theorem (which applies to ordinal ranking systems) doesn't strictly apply in the same way. This makes for a smarter memo.
          *   *Refinement:* Actually, recommending **Approval Voting** allows me to validate the Treasurer *and* the Reformers. Reformers want to stop vote-splitting. Approval does that (vote for both). Treasurer wants to avoid Arrow paradoxes. Approval avoids the specific ranked-system paradoxes.
          *   *Okay, let's go with Approval Voting.* It's the more "insider" recommendation that fits a science-literate group.

  3.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the Leo situation. Validate the frustration.
      *   **The Goal:** Fairness, simplicity, avoiding spoilers.
      *   **The Recommendation:** Approval Voting.
      *   **How it Works:** Check all boxes you like. Most checks wins.
      *   **Why this over RCV (The Math):** Address Arrow's Theorem. Explain that RCV has quirks (ranking a candidate higher can hurt them). Approval doesn't have that.
      *   **The Strongest Objection (Nuance/Strategy):** The main knock on Approval is that it treats a "meh" candidate the same as a "love" candidate. Also, strategic voting (where to draw the line). I need to address this seriously.
      *   **Conclusion:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to be accessible but not condescending.
      *   Acknowledge the Treasurer's expertise (don't debunk him, build on him).
      *   Acknowledge the Reformers' goal (don't dismiss their desire for RCV).
      *   Science-journalism vibe: Evidence-based, clear, precise.

  5.  **Addressing the Specific Constraints:**
