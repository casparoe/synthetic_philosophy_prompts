answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Science-Journalism Co-op
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Voting System Reform

  **The Problem: The "Leo" Scenario**

  We all agree that our last presidential election was flawed. Leo won with 34% of the vote in a three-way race. Evidence suggests that if the two reform-minded candidates hadn't split their votes, Leo would have lost in a head-to-head matchup. This is the classic "spoiler effect," and it undermines the legitimacy of our leadership.

  We need a system that ensures our winner has broad support, not just a passionate plurality.

  **The Proposal: Approval Voting**

  After reviewing the options—including the Ranked-Choice Voting (RCV) system many of you favor, and the Approval Voting system proposed by our Treasurer—I recommend we adopt **Approval Voting**.

  **How It Works**
  It is incredibly simple. On your ballot, you may vote for ("approve") as many candidates as you like. You can vote for one, two, or all of them. The candidate with the most total approval votes wins.

  **Why This Solves Our Problem**
  In the last election, under our current rules, reform-minded members had to choose between Candidate A and Candidate B. Voting for both would have been a wasted effort; voting for their second choice felt like a betrayal of their first.

  Under Approval Voting, those members could have voted for *both* reform candidates. This would have signaled the true breadth of support for the reform platform, likely preventing Leo's victory without requiring complex vote transfers. It eliminates the "wasted vote" fear that causes vote-splitting.

  **The Math: Why Not Ranked-Choice?**

  I know half the board is leaning toward Ranked-Choice Voting (RCV). It feels intuitive: you rank candidates 1, 2, 3. If no one gets a majority, the last-place candidate is eliminated and their votes transfer to their voters' second choices.

  However, our Treasurer's concerns about the mathematics are valid and shouldn't be dismissed as nitpicking.

  There is a concept in social choice theory called **Arrow's Impossibility Theorem**. In plain English, it proves that no ranked voting system can be perfect. Specifically, RCV suffers from a quirk called **non-monotonicity**. In certain scenarios, ranking a candidate *higher* on your ballot can actually cause them to *lose*, or ranking them *lower* can help them win. This happens because of the elimination rounds.

  For a small board like ours, where every vote counts and we want transparency, a system where "more support" can theoretically hurt a candidate is a liability. Approval Voting does not suffer from this. In Approval Voting, voting for a candidate never hurts them. It is mathematically more stable.

  **The Strongest Objection: Loss of Nuance**

  I want to take the strongest argument *against* my recommendation seriously. The main drawback of Approval Voting is that it loses **intensity of preference**.

  In RCV, you can say, "I love Candidate A, and I tolerate Candidate B." In Approval Voting, both A and B get one checkmark. To the tally sheet, a "compromise" candidate looks exactly the same as a "passionate favorite."

  Critics argue this could lead to electing a "least objectionable" candidate rather than the one with the most passionate support. It also introduces a different kind of strategic dilemma: Where do you draw the line? If you approve everyone, your vote doesn't matter. If you approve only one, you risk the spoiler effect again. Voters have to decide their own threshold for "approvable," which varies from person to person.

  **Why I Still Recommend Approval**

  While the loss of nuance is real, I believe it is an acceptable trade-off for three reasons:

  1.  **Simplicity:** We are a volunteer co-op. RCV requires complex counting protocols that can look like a "black box" to members who don't see the tabulation. Approval Voting is transparent and can be counted by hand in minutes.
  2.  **Consensus Building:** For a board, electing a candidate with broad acceptance (high approval) is often more valuable than electing a polarizing favorite. We need to work together after the election.
  3.  **Strategic Safety:** While voters do have to set a threshold, the "safe" strategy in Approval Voting is usually honest: vote for everyone you genuinely trust to do the job. This naturally mitigates the spoiler effect without complex rules.

  **Next Steps**

  We are voting on the bylaw change in three weeks. I propose we draft the amendment to specify **Approval Voting** for all board officer elections.

  This system solves the spoiler effect that caused the Leo incident, respects the mathematical constraints raised by our Treasurer, and keeps our administrative burden low. It isn't a perfect system—no such system exists—but for a small, collaborative body, it is the most robust tool available.

  I'm happy to discuss this further at the next meeting.

  [Your Name]
  Board Member
