answer: |-
  This is a fantastic question to iron out before a talk, because you have put your finger on exactly where many philosophers get tripped up. You aren't *wrong* that they are close cousins (both are physicalist, both reject Cartesian qualia), but if you treat them as identical in your talk, a knowledgeable audience member will likely object.

  There is a substantive metaphysical and diagnostic difference between **First-Order Representationalism (FOR)** and **Illusionism**.

  Here is the sanity check you need.

  ### 1. The Core Difference: Reduction vs. Error Theory
  The distinction lies in how they treat the *phenomenal character* of experience (the "what-it-is-likeness").

  *   **FOR (Tye, Dretske):** This is a **reductive realist** position. It argues that phenomenal character *really exists*, but it is identical to (or constituted by) representational content. When Tye says experience is "transparent," he means you are directly aware of the represented properties (redness, roundness). The "phenomenal redness" is real; it just isn't intrinsic/non-physical. It *is* the representational property.
      *   *Slogan:* "Phenomenality is real representation."
  *   **Illusionism (Frankish, Dennett):** This is an **error theory**. It argues that the *phenomenal character* (as commonly conceived by introspection) *does not exist*. The brain represents the world, and it represents itself as having "ineffable, intrinsic qualia," but that second representation is false. There is no "what-it-is-likeness" over and above the functional/representational processing, but unlike Tye, Illusionists say our introspection *misrepresents* that processing as having special phenomenal properties.
      *   *Slogan:* "The belief in phenomenality is a representational error."

  **The Wedge:** For Tye, introspection reveals the true nature of experience (representation). For Frankish, introspection is a "user illusion" that hides the true nature of experience (mechanistic processing) behind a fake interface (qualia).

  ### 2. The Status of Introspection
  This is the easiest way to distinguish them in your talk.

  *   **FOR:** Introspection is generally **veridical**. When I introspect my pain, I am detecting a real state of my brain that represents damage. The "hurtfulness" is the content of that representation.
  *   **Illusionism:** Introspection is **systematically misleading**. When I introspect my pain, my brain generates a "judgment" that I am having a private, ineffable feeling. That judgment is useful for control systems, but it posits a property (the quale) that isn't actually there.

  **Analogy:**
  *   **FOR:** Like looking through a clean window. You see the garden (the world). The "seeing" is real, but it's just the transparency of the glass.
  *   **Illusionism:** Like a computer desktop. You see a "trash can" icon. There is no trash can in the machine. The icon is a useful fiction that allows you to interact with the code. Illusionists say qualia are the desktop icons; FOR says qualia are the code itself (viewed transparently).

  ### 3. Why the Literature Treats Them Differently
  You asked why Illusionism gets treated as "wildly radical" compared to standard Representationalism. It comes down to **Eliminativism vs. Reductionism.**

  *   **Representationalism** tries to *save the phenomenon*. It tells the intuition pump: "You know that feeling you're worried about? We can keep that! We just explain it physically." It is friendly to the folk-psychological concept of consciousness.
  *   **Illusionism** bites the bullet. It tells the intuition pump: "That feeling you're worried about? The one that seems irreducible? That doesn't exist. You only *think* it exists."

  Even though both end up in a physicalist place, Illusionism requires an extra explanatory step: **The Error Explanation.** An Illusionist must explain *why* we are so persistently wrong about our own minds. Tye doesn't need to explain why we are wrong; he just needs to explain how representation works. Frankish has to explain the evolutionary/functional utility of the "qualia illusion."

  ### 4. Talk Advice: How to Frame It
  If you conflate them, you risk missing the specific explanatory burden Illusionism takes on. Here is a suggested framing for your slides:

  1.  **Acknowledge the Overlap:** "Both views agree: No Cartesian theater, no non-physical stuff, representation is key."
  2.  **Highlight the Divergence:** "FOR reduces the *phenomenal* to the *representational*. Illusionism reduces the *belief in the phenomenal* to a *representational error*."
  3.  **The "Hard Problem" Response:**
      *   **FOR:** The Hard Problem is a confusion; once you explain representation, you've explained phenomenality.
      *   **Illusionism:** The Hard Problem is real *for the concept*, which is why we need to explain why the concept exists despite referring to nothing.

  ### Summary
  You aren't missing a *scientific* difference (both posit the same neural machinery), but you are missing a *metaphysical/diagnostic* difference.
  *   **Tye:** "The magic is real, it's just sleight of hand."
  *   **Frankish:** "There is no magic, only the belief in magic."

  For a talk, distinguishing these prevents the "But Tye already solved this!" objection from the audience. You can position Illusionism as the view that takes the *intuition of ineffability* seriously enough to treat it as a cognitive posit rather than a datum.

  Good luck with the talk! It's a great topic.
