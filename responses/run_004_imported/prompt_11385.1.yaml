answer: |-
  This is an exceptionally sharp reading of *Principia Ethica*. You have identified the precise tension that keeps Moore scholars busy: the relationship between the **intrinsic value of objects** (the Beautiful World argument) and the **supreme value of conscious states** (the Organic Unities argument).

  To help you build a justification for your land trust that is philosophically sturdy, we need to clarify how Moore reconciles these claims, answer your specific questions about magnitude and affection, and then translate that into a practical argument for wilderness preservation.

  ### 1. The Tension: Intrinsic Value vs. Organic Unities

  You are correct that Moore makes two claims that seem to pull in opposite directions:

  1.  **The Beautiful World (Chapter 3):** Moore argues that a beautiful world existing without any conscious being to perceive it is *better* than a hideous world existing without perception. This proves that beauty has **intrinsic value** independent of consciousness.
  2.  **Organic Unities (Chapter 6):** Moore argues that the "greatest goods" are complex wholes, specifically "the pleasures of human intercourse and the enjoyment of beautiful objects." Here, the value of the whole (consciousness of beauty) is **immeasurably greater** than the sum of the value of the beautiful object alone plus the consciousness alone.

  **Does unperceived beauty retain most of its value, or only a residue?**

  On Moore's view, unperceived beauty retains **positive value, but only a small residue** compared to the value of appreciated beauty.

  Moore does not see these as contradictory. He distinguishes between *having value* and *having the most value*.
  *   **Unperceived Beauty:** Has intrinsic value. It makes the universe better than it would be without it. It is not valueless.
  *   **Appreciated Beauty:** This is an "organic unity." The relation between the mind and the object creates a new whole that possesses a value vastly superior to the object in isolation.

  Moore writes that the value of the whole "bears no regular proportion to the sum of the values of its parts." In the case of aesthetic appreciation, the whole is exponentially greater. Therefore, if you protect wilderness that is *never* seen, you are securing a "small residue" of value. If you protect wilderness that *is* seen (even by one person), you are securing the "greatest good."

  **The Coherence:** The system fits together if you view unperceived beauty as the **necessary substrate** for the higher good. You cannot have the organic unity (appreciation) without the object (beauty). Destroying the object eliminates both the small intrinsic value of the object *and* the massive value of the potential appreciation.

  ### 2. The Parallel: Unloved Admirable Qualities

  You asked if Moore can say something parallel about a person's admirable qualities going entirely unloved.

  **Yes, the parallel holds, but with a metaphysical caveat.**

  Moore places "personal affection" (love/friendship) alongside aesthetic enjoyment as the greatest goods. This good is also an organic unity: it requires a **worthy object** (the admirable person) and a **fitting emotion** (the love).

  *   **Unloved Virtue:** If a person possesses admirable qualities but is entirely unloved and unappreciated, does that state have value? For Moore, yes. A virtuous state of mind is intrinsically better than a vicious one, even if isolated.
  *   **The Disanalogy:** There is a difference between the wilderness and the virtuous person. For Moore, **value ultimately resides in consciousness.**
      *   *Wilderness:* Can exist without consciousness. Its unperceived value is "dead" value (objective, but static).
      *   *Virtue:* Is a property of a conscious mind. An unloved virtuous person still contains consciousness. Therefore, the "residue" of value in an unloved virtuous person is likely higher than in unperceived wilderness, because the virtuous person *is* a locus of consciousness, whereas the wilderness is not.

  However, the structural point remains: **Unloved virtue is good; Loved virtue is immeasurably better.** Just as beauty cries out for appreciation, virtue cries out for affection. Isolating either strips it of its highest potential value, but does not reduce it to zero.

  ### 3. Justifying the Land Trust's Mission

  If you go before your board and argue, "Moore says unperceived beauty has value, so we should protect this land even if no one sees it," a savvy opponent could reply, "But Moore also says appreciated beauty is *immeasurably* more valuable. If no one sees it, aren't we wasting resources on the 'small residue'?"

  To be sturdier than intuition, your justification should rely on the **interaction** between Moore's two claims, not just the first one. Here is the three-part Moorean argument for protecting remote wilderness:

  #### A. The Argument from Objective Betterness (The Baseline)
  Moore explicitly states that the universe is better with unperceived beauty than without it.
  *   **Application:** Even if the wilderness is never seen, converting it into a strip mine or a parking lot would actively make the universe *worse*. We have a duty to prevent the "hideous world" scenario. This justifies a baseline level of protection regardless of utility.

  #### B. The Argument from Potentiality (The Organic Unity)
  The "Greatest Good" (the organic unity of appreciation) is impossible without the object.
  *   **Application:** Remote wilderness is the **necessary condition** for the highest aesthetic goods. Once destroyed, the possibility of that organic unity is lost forever. Because the value of the organic unity is *immeasurably* high, securing the *possibility* of it (by protecting the land) has high expected value, even if the probability of human visitation is low. You are guarding the fuel for a fire that could burn brightly, even if you aren't sure who will light it.

  #### C. The Argument from Uncertainty (Future Consciousness)
  Moore's ethics are forward-looking (Ideal Utilitarianism). We cannot know with certainty which parts of nature will remain unperceived.
  *   **Application:** "Remote" does not mean "Unperceivable." Future generations, or a solitary hiker fifty years from now, may form that organic unity. If you destroy the land, you preclude that value. Since the value of the *appreciated* whole is so vast, it justifies spending significant budget to protect the *object* against the risk of future non-existence.

  ### Summary for Your Board

  You can tell your board that G. E. Moore's system is consistent, provided we understand the hierarchy of value:

  1.  **Unperceived Beauty** has **intrinsic value**. (It is better than ugliness).
  2.  **Appreciated Beauty** has **supreme value**. (It is the "Greatest Good").
  3.  **The Relationship:** You cannot have #2 without #1.

  Therefore, the land trust is not merely preserving a "residue" of value. It is **preserving the capacity for the highest value.**

  Regarding your specific question on affection: Moore would agree that an unloved admirable person is still better than a wicked one, but the tragedy of their isolation is that they are denied the "greatest good" of mutual affection. Similarly, a wilderness unseen is still better than a wasteland, but it is "tragic" in the Moorean sense because it is denied the enhancement of consciousness.

  **The Sturdy Conclusion:**
  We protect remote wilderness not because human appreciation is irrelevant, but because **existence is the prerequisite for appreciation.** We protect the *possibility* of the Great Good (the organic unity), while acknowledging that even if that possibility is never realized, the existence of beauty still makes the universe objectively better than the alternative. This avoids the trap of saying "value exists without observers" (which invites the 'so what?' challenge) and instead argues "we must preserve the object so that the observer *can* create the highest value."

  This aligns your intuition with Moore's rigorous distinction between *intrinsic* value and *ideal* value, giving you a philosophical foundation that is both nuanced and robust.
