    "1": ["<letter>", "<justification>"],
    "2": ["<letter>", "<justification>"],
    "3": ["<letter>", "<justification>"],
    "4": ["<letter>", "<justification>"],
    "5": ["<letter>", "<justification>"],
    "6": ["<letter>", "<justification>"]
  }
  ```

  where the key is the rank (1 being most successful) and each value pairs the strategy's letter with your justification.
