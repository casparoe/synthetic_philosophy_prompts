      *   *Rostova:* Sees impact data, doubts bypass (hardware fried).
      *   *Chen:* Doubts impact (sensor ghost), trusts bypass.
      *   *Voting:* Show of hands or digital log.
      *   *The Reveal:* The screen shows the aggregate.
      *   *The Reaction:* "Wait, that doesn't make sense."
      *   *Ending:* Clock ticking. Decision hangs.

  10. **Review against Constraints:**
      *   Word count check (aiming for ~900).
      *   No theory lecturing.
      *   Logical bones intact ($P$, $Q$, $C$).
      *   Ambiguous ending.

  11. **Self-Correction during drafting:**
