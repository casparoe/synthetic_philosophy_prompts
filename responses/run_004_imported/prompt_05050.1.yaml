  The air in the command module of Station *Orion* hummed with the low-frequency vibration of the life support systems. Outside the thick quartz glass, the nebula swirled, beautiful and indifferent. Inside, three people stared at a blinking red icon on the central console.

  Commander Halloway rubbed her temples. "We have ten minutes before the toxin concentration reaches critical levels. We need to decide on Protocol Seven."

  Specialist Vane, the systems engineer, leaned forward. "Protocol Seven is a hard reset of the filtration grid. It's drastic. It shuts down oxygen recycling for thirty seconds."

  "Which kills us," said Kress, the medical officer, "unless the grid is actually compromised."

  Halloway nodded. "So the rule is clear. We authorize Protocol Seven if and only if two conditions are met. One: The sensor data confirms a genuine filtration breach. Two: The backup grid is intact enough to handle the surge."

  She looked at each of them. "We vote on the conditions separately, then on the protocol. Standard procedure."

  They tapped their consoles. The individual logs scrolled across Halloway's screen before the aggregate tally appeared.

  Halloway frowned. She tapped the glass. "Read the findings."

  Vane spoke first, his voice flat. "On Condition One: Is there a genuine breach? I vote Yes. The spectral signature matches a polymer fracture. Kress voted Yes. Halloway, you voted No."

  "Sensor ghost," Halloway muttered. "I've seen this pattern before during the solar flare last cycle. It looks like a breach, but it's interference."

  "Understood," Vane said. "On Condition Two: Is the backup grid intact? I vote No. The surge capacity is degraded. Halloway voted Yes. Kress voted Yes."

  Kress adjusted his glasses. "Medical diagnostics show the grid integrity is at eighty percent. Enough for the surge. But Vane, you think the hardware is fried?"

  "I think it'll blow if we try," Vane said.

  Halloway scrolled to the final line. "And on the Protocol itself. Authorize Protocol Seven?"

  "I voted Yes," Halloway said. "Because I believe the grid is safe, and if there's even a chance of a breach, we can't risk staying passive."

  "I voted No," Vane said. "Because the grid won't hold. Even if there is a breach, the reset kills us."

  "I voted No," Kress added. "Because I don't think there's a breach. If the air is clean, why shut down oxygen?"

  Halloway stared at the summary table. The green and red bars stacked up against each other.

  "Wait," Halloway said. "Look at the majority findings."

  She highlighted the first row. "On the breach: Two Yes votes. Me and... wait." She corrected herself. "Vane said Yes. Kress said Yes. I said No. Majority says there *is* a breach."

  Vane nodded. "Majority says the air is toxic."

  "Second row," Halloway continued. "On the grid integrity. Vane said No. Kress and I said Yes. Majority says the grid *is* intact."

  "So," Kress said slowly, "the group believes the air is toxic."

  "And the group believes the grid can handle the fix," Vane added.

  Halloway pointed to the final tally. "But the majority vote on the Protocol is No. Two to one against initiating the reset."

  Silence filled the room, heavier than the hum of the servers.

  Kress shifted in his seat. "So... we've established that the air is poisoned."

  "According to the vote, yes," Vane said.

  "And we've established that the reset machine works," Kress said.

  "According to the vote, yes," Halloway said.

  "But we've decided not to use the machine," Kress said.

  Vane rubbed his chin. "If the air is poisoned, and the machine works... logic says we should use the machine."

  "But I voted No," Kress said. "Because I don't think the air is poisoned. My 'No' on the protocol is consistent with my 'No' on the breach."

  "And I voted No," Vane said. "Because I don't think the machine works. My 'No' is consistent with my 'No' on the grid."

  Halloway looked at the clock. Six minutes. "But collectively... the group accepts the breach. The group accepts the grid. But the group rejects the action."

  "It feels wrong," Kress said, his voice tight. "It feels like saying 'Yes, the house is on fire' and 'Yes, we have water' but deciding 'No, we will not put out the fire.'"

  "But neither of you would authorize the action alone," Halloway said. "You both voted No."

  "Because individually, we each saw a dealbreaker," Vane said. "I saw the broken grid. Kress saw the false alarm."

  "But neither dealbreaker won the majority," Halloway said. "The majority thinks the alarm is real. The majority thinks the grid is fixed. So why are we sitting here?"

  Kress looked at the blinking red icon. "If we follow the premise vote, we reset. We accept the majority view on the facts, and let the protocol dictate the action."

  "If we follow the protocol vote, we don't reset," Vane countered. "We respect the direct decision on the action. Maybe the majority knows the action is bad even if they disagree on why."

  "The toxin levels are rising," Halloway said. Her hand hovered over the execute key.

  "If you reset based on the premises," Vane warned, "you might blow the grid. I know it's degraded."

  "If you don't reset based on the conclusion," Kress said, "you might let us suffocate. I know the sensors are tricky."

  Halloway looked at her crew. They were both right, and they were both wrong. The math on the screen was clean, crisp, and utterly contradictory. The group was of one mind on the facts, but of two minds on the fate.

  "Three minutes," the computer chimed.

  Halloway's finger trembled slightly above the console. She looked at the majority verdict on the breach, then at the majority verdict on the protocol. They stared back at her, mutually exclusive.

  "Make the call, Commander," Vane said softly.

  Halloway took a breath. The hum of the station seemed to grow louder, waiting for a decision that logic alone could not provide.
