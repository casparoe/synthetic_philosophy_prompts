prompt: |-
  So I fell down a rabbit hole reading about epistemic logic this weekend and ran into this thing called 'the problem of logical omniscience' - apparently the standard formal models of knowledge say that if you know a set of facts, you automatically also know every logical consequence of them (plus every tautology), wich is obviously not how any real mind works. It reminded me a lot of debugging: I "know" my whole codebase in some sense, but I clearly dont know all the consequences of how the pieces interact, or bugs just wouldn't exist. Can you walk me through the most important implications of this problem for how confident I should actually be in code I've written but haven't fully tested yet? Feel free to get into the actual technical weeds (like how logicians have tried to patch the problem over the years) instead of giving me the wikipedia-level summary I could've gotten myself.
