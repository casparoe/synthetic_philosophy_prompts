      *   *Move 2:* Elena is channeling John Maynard Smith. The adaptor is key.
      *   *Move 3:* Frank's "interpreter" point is the hard problem of biosemantics.
      *   *Move 4:* Elena uses Teleosemantics (Millikan). Reassignment is the smoking gun for arbitrariness.
