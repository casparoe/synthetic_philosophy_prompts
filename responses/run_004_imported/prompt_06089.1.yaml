  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Move 3:* Frank mentions stereochemical affinities. I need to be careful not to dismiss this entirely (Yarus's work is real), but emphasize it doesn't account for the *specificity* of the code.
