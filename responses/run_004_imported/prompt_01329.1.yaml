      *   *Distinction:* Peters isn't fixing EUT with unbounded utility; he's replacing EUT with Ergodicity Economics. Within Ergodicity Economics (log growth), the "Super St. Petersburg" might be resolvable because the dynamics constrain the bet size (you can't bet more than you have). But if you stick to standard EUT, Menger is still right: unbounded utility $\implies$ existence of a divergent lottery.
      *   *Verdict:* The user is right to be skeptical. Peters doesn't save unbounded utility *within EUT*. He saves the *log function* by reinterpreting it as a growth rate, where the budget constraint ($c < w$) becomes binding in a way that static EUT often ignores (or treats via bankruptcy constraints).

  5.  **Synthesize the "Sanity Check":**

