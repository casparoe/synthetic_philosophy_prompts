      *   *Address Point 1 (Time Average):* Validate the skepticism. It *is* a shift from one-shot to repeated. The "infinitesimal" trick is a mathematical convenience to define the rate, but the philosophical heavy lifting is assuming the agent cares about long-run growth. It's not "relabelling" in a dishonest way, but it is a *different criterion*.
      *   *Address Point 2 (Menger's Bug):* Be sharp here. Menger isn't wrong about EUT. Peters is wrong to say Menger made a "math bug" in the context of EUT. Peters is right that Menger's construction violates dynamic solvency constraints. The divergence cancellation happens because of the *budget constraint* in a dynamic setting, not because unbounded utility is suddenly safe in static EUT.
