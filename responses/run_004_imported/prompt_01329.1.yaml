          2.  **The Cost Term:** Menger *did* consider net wealth in some formulations, but the core mathematical point is about the tail behavior of the payoff vs. probability. Peters' insight is that in a *multiplicative* dynamic, you can't pay an infinite entry fee because you run out of wealth. This is a budget constraint issue, not just a utility curvature issue.
          3.  **Ergodicity Assumption:** The time-average argument *requires* the game to be repeatable. If the seminar is about normative decision theory for unique events, Peters' solution is less compelling unless you argue all decisions are part of a life-long sequence.

  6.  **Drafting the Response:**
