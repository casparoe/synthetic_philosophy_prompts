answer: |-
  This is a solid set of notes, and your skepticism is well-placed. You are not fooling yourself; you are identifying the exact friction points where Ergodicity Economics (EE) diverges from standard Decision Theory (DT). Since you're TA-ing a PhD seminar, the students will likely pounce on these exact ambiguities if you present them as settled fact rather than a paradigm clash.

  Here is the sanity check on your two specific hang-ups, plus a broader framing suggestion.

  ### 1. The Time-Average Derivation (One-Shot vs. Repeated)

  **Your worry:** *Is rescaling time into infinitesimal sub-intervals a legit way to get a genuine time-average out of what's really one draw, or is it just relabeling the ensemble average?*

  **The verdict:** It is **not** just relabeling, but it **does** change the problem definition. You are right to be uneasy about applying it to a "one-shot" paradox.

  *   **The Math:** Peters isn't fudging the calculus. If wealth evolves multiplicatively ($W_{t+1} = W_t \cdot \epsilon_t$), the long-run time-average growth rate is indeed the expectation of the log return ($\mathbb{E}[\ln(W_{t+1}/W_t)]$). Mathematically, this is robust.
  *   **The Normative Leap:** The "nerd-snipe" risk here is normative. Standard Decision Theory (and the original St. Petersburg setup) asks: *"What is the maximum price you would pay for a single ticket right now?"* Peters answers: *"What price allows you to maximize long-run wealth growth if you play this repeatedly?"*
  *   **The "Infinitesimal" Patch:** Peters uses the continuous-time limit to define the growth rate *as if* the bet were infinitesimally small relative to wealth, allowing repetition without bankruptcy. In a discrete, high-stakes St. Petersburg game, a single loss (or a long string of tails requiring huge buy-ins) can wipe you out.
  *   **Does it hold together?** It holds together *if* you accept the EE premise that rational agents should optimize time-growth, not ensemble expectation. However, if a student asks, "But what if I only get to play once?", Peters' derivation loses its normative force unless you argue that *all* economic decisions are part of one long life-sequence (which is a standard defense of EU anyway, but EE makes it explicit).
  *   **Recommendation:** Don't present the time-average derivation as a "fix" for the one-shot game. Present it as a **change of objective function**. The log utility result isn't a coincidence; it's because multiplicative dynamics *imply* log optimization. But emphasize that this resolves the paradox by making the game *dynamic*, whereas the paradox is traditionally *static*.

  ### 2. Menger's Bug and Unbounded Utility

  **Your worry:** *Does Peters catching Menger's bug rehabilitate unbounded utility functions in general, or just show this one construction fails?*

  **The verdict:** You are right to doubt the general rehabilitation. Peters does **not** save unbounded utility functions within the framework of Expected Utility Theory (EUT). He saves the *log function* by moving *outside* of EUT.

  *   **Menger's Theorem (1934):** Menger proved that for **any** unbounded utility function $U$, there exists a payoff sequence $x_n$ such that $\sum p_n U(x_n)$ diverges. This is a mathematical theorem about series convergence within static EUT. It is still true. Peters cannot "fix" this within EUT.
  *   **Peters' Counter:** Peters argues Menger's "Super St. Petersburg" construction is **economically infeasible** in a dynamic setting. Specifically, to generate the divergence, the ticket price must eventually exceed the player's wealth (or require borrowing against future winnings in a way that violates solvency).
  *   **The Cancellation:** You asked if the divergences cancel. In Peters' dynamic framework, yes. As the ticket price $c \to w$, the utility of remaining wealth $U(w-c) \to -\infty$ (for log). This negative divergence counteracts the positive divergence of the payout.
  *   **The Catch:** This only works because Peters imposes a **budget constraint** ($c < w$) that is binding in a way static EUT often ignores (static EUT often assumes you can pay the "fair price" regardless of current endowment, or treats wealth as abstract).
  *   **Does it open the door for other divergences?** If you stay in Peters' dynamic framework, unbounded utility functions (faster than log) are still dangerous because they might encourage betting fractions that lead to almost-sure bankruptcy (volatility drag). If you stay in static EUT, Menger still wins.
  *   **Recommendation:** Be precise here. Do not say "Peters proved Menger wrong." Say "Peters showed Menger's construction violates dynamic solvency constraints." Menger is right about **static unbounded utility**; Peters is right about **dynamic growth optimization**. They are talking past each other slightly.

  ### Summary & Seminar Advice

  Your notes hold together conceptually, provided you frame the tension correctly. You aren't juggling divergences that don't cancel; you are juggling **frameworks**.

  **Where you might be unfair to Peters:**
  You suggest he might be "relabelling" the ensemble average. He isn't. He is deriving the log function from physics/dynamics rather than psychology. That is a genuine contribution. The "bug" he finds in Menger is also genuine *within his dynamic framework* (Menger's payoff sequence requires infinite credit).

  **Where you might be unfair to Menger:**
  Menger's result is a knockout punch for **static EUT with unbounded utility**. Peters doesn't revive static EUT; he buries it in favor of Ergodicity Economics.

  **Suggested Framing for the Seminar:**
  Instead of "Peters fixes the Paradox," frame it as "The Paradox reveals a conflict between Ensemble Expectations and Time Dynamics."
  1.  **Bernoulli:** Fixes it psychologically (diminishing marginal utility).
  2.  **Menger:** Breaks Bernoulli mathematically (unbounded utility always fails in static EUT).
  3.  **Peters:** Breaks the *setup* (we shouldn't use static ensemble averages for non-ergodic processes).

  **One specific thing to watch out for:**
  If a student asks, "Why log?" Peters says "Because wealth is multiplicative." A sharp PhD student will ask, "What if wealth is additive?" (e.g., fixed dollar bets rather than percentage bets). In additive dynamics, the time average equals the ensemble average, and the St. Petersburg paradox returns with full force (infinite expected value). Peters' solution is contingent on the *nature of the dynamics*, not just the math of the lottery. If your notes imply Peters solves St. Petersburg for *any* agent, that's the weak spot. It only solves it for agents facing multiplicative wealth dynamics.

  **Verdict:** The argument holds together, but tighten the distinction between "fixing EUT" (which Peters doesn't do) and "replacing EUT" (which he does). Good luck with the seminar.
