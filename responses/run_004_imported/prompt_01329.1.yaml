      *   **Constraint:** No line edits, focus on conceptual coherence ("does this actually hold together").

  2.  **Deconstruct the Arguments:**

      *   **Standard St. Petersburg:** Payoff $2^{n-1}$, Prob $2^{-n}$. $E[X] = \infty$.
      *   **Bernoulli (1738):** Log utility $U(w) = \ln(w)$. $E[\Delta U] < \infty$. Resolves paradox *for that specific payoff structure*.
      *   **Menger (1934):** "Super St. Petersburg." Payoff grows faster than utility shrinks probability. If $U$ is unbounded, Menger constructs a payoff sequence $x_n$ such that $\sum p_n U(x_n) = \infty$. Conclusion: Only *bounded* utility functions resolve St. Petersburg generally.
      *   **Peters (2011):** Ergodicity Economics.
          *   *Claim 1:* The resolution isn't utility, it's time-averaging vs. ensemble-averaging. For multiplicative dynamics, the time-average growth rate is $\langle g \rangle = \sum p_i \ln(1 + \text{return}_i)$. This looks like log utility but is derived from dynamics.
          *   *Claim 2:* Menger made a mistake. Menger ignored the cost of the ticket relative to wealth. If you pay a huge fee to play, your wealth drops, impacting the utility of the remaining wealth. Peters argues that when you account for the *cost* of the ticket properly in a dynamic setting, the divergence cancels out.

  3.  **Evaluate Question 1: Peters' Time-Average Derivation:**
      *   *The Issue:* St. Petersburg is typically a one-shot game. Ergodicity requires repeated play over time to define a time average.
      *   *Peters' Move:* He treats the game as if it can be played repeatedly (reinvesting wealth). He uses the geometric mean (logarithm) because wealth evolves multiplicatively ($W_{t+1} = W_t \cdot \text{factor}$).
      *   *Critique:* Is it legitimate to impose repeated play on a one-shot paradox?
          *   *Standard View:* Decision theory usually handles one-shot decisions. Ergodicity economics argues that rational agents *should* care about time growth because they live in time, not in parallel universes.
          *   *The "Relabeling" Charge:* The user asks if this is just relabeling. Mathematically, the time-average growth rate of multiplicative wealth *is* the expectation of the log return. So yes, the math is identical to Bernoulli. The *interpretation* is different (dynamics vs. psychology).
          *   *The "Infinitesimal" Patch:* Peters often uses continuous-time limits (geometric Brownian motion analogues) to smooth out the discreteness. Is this legit? It's a modeling choice. If the game is truly one-shot, the time-average argument is weak unless you argue the agent faces *many* such decisions over a lifetime (which is a standard defense of expected utility anyway).
          *   *Verdict:* It's not "fooling themselves" mathematically, but it changes the *problem definition*. It resolves the paradox by changing the question from "What is this one ticket worth?" to "What is the long-run growth rate if I face this gamble repeatedly?" This is a valid perspective shift but doesn't necessarily solve the normative question for a single instance unless you accept the ergodicity premise.

  4.  **Evaluate Question 2: Menger's Bug and Unbounded Utility:**
      *   *Menger's Core Point:* For *any* unbounded utility function $U$, there exists a payoff sequence $x_n$ such that $\sum p_n U(x_n)$ diverges. This is a mathematical theorem about series convergence.
