answer: |-
  This is a sophisticated question that cuts to the heart of epistemic game theory. You have correctly identified that while all these concepts rely on rationality, they differ significantly in what else the players must know, believe, or agree upon—specifically regarding priors, independence, and counterfactuals.

  Here is the ranking from the weakest/least controversial epistemic assumptions to the strongest/most contested.

  **1. Rationalizability**
  This concept rests almost exclusively on **Common Knowledge of Rationality (CKR)** and the game structure. It requires no assumption about players sharing a common prior probability distribution, nor does it require them to believe opponents' choices are independent; players can hold any subjective beliefs (including correlated ones) as long as they are consistent with CKR.

  **2. Survival under Iterated Elimination of Strictly Dominated Strategies (IESDS)**
  While often treated as equivalent to rationalizability in two-player games, in games with three or more players, IESDS implicitly assumes that players believe their opponents' strategies are **independent** (uncorrelated). This restricts the space of admissible beliefs more than rationalizability does, making the assumption slightly stronger in the general case.

  **3. Correlated Equilibrium**
  Moving to equilibrium concepts introduces the **Common Prior Assumption**. As shown by Aumann (1987), correlated equilibrium follows from CKR combined with the requirement that all players share the same prior probability distribution over the state space, though it still allows their final strategy choices to be correlated (e.g., via a mediator).

  **4. Nash Equilibrium**
  Nash equilibrium requires everything correlated equilibrium does, plus the additional assumption that players' conjectures about opponents' strategies are **independent**. As formalized by Aumann and Brandenburger (1995), players must not only share a prior but also believe that opponents choose their strategies independently of one another, ruling out correlation devices.

  **5. The Backward-Induction Outcome in Finite Games of Perfect Information**
  This requires the most contested assumptions because it demands **counterfactual consistency**. Players must maintain Common Knowledge of Rationality even at decision nodes that should never be reached if rationality were common knowledge; justifying this requires complex theories of belief revision (like "trembles" or lexicographic probabilities) to resolve the logical contradiction of observing an "impossible" move.

