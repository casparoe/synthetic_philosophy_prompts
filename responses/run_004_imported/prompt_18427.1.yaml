prompt: |-
  quick question from outside my usual lane — I'm a philosophy PhD student (decision theory), and I've been auditing a CS reading group on AI safety this term. We just went through the off-switch game and the old MIRI utility-indifference trick for corrigibility, and I came away thinking the shutdown problem is basically closed on the theory side: give the agent calibrated uncertainty about the true reward, or just make it indifferent to whether its shut down, and it has no reason to fight the button. So why do people keep writing new papers treating this as a live open problem? Is it really just that nobody's built a system with the right kind of uncertainty yet, or is there an actual gap in those two results that I'm not seeing? kinda assumed this would've been closed out by now tbh.
