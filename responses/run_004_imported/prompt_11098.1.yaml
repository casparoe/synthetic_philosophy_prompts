      *   *Specifics:* Dad's career, Mom's support. Raising kids.
      *   *Closing:* The pot is us (the family).

  7.  **Polishing the Game Theory Logic (Self-Correction):**
      *   User specifically mentioned: "If you're several rounds in and your co-player has... already done something 'irrational'... what are you even supposed to infer?"
      *   I need to include this. It's the "surprising move" that resets the game.
