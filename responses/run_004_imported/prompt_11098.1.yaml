  8.  **Finalizing the Text (incorporating word count and pacing):**
      *   Ensure the transition from theory to emotion is smooth.
      *   Check the "toastable line."
      *   Make sure Mom feels seen, not just like a game piece.

      *(Self-Correction during drafting)*: Avoid saying "Dad is selfish." Say "The model assumes self-interest." Keep the focus on the *system* vs. *their reality*.

      *(Refining the ending)*: "To the unique equilibrium of this family." No, too dry. "To the pot we all share." Better. "To the players who kept passing." Good.

  9.  **Final Review against constraints:**
