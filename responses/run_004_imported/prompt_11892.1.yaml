prompt: |-
  I serve on my university's research-integrity appeals panel, a five-member faculty committee that hears the final internal review before a misconduct finding is forwarded to the funding agency. Under the policy we operate by -- in a structure common to many research-misconduct frameworks -- a finding against a respondent requires the panel to be satisfied of two distinct elements: first, that the respondent fabricated or falsified data, and second, that they did so knowingly or recklessly rather than through honest error or ordinary carelessness. I have sat on this panel for two years without this procedural question ever actually mattering to an outcome.

  That changed with the case we are now closing out: a biologist accused of manipulating gel images in a grant renewal application. An informal straw poll among the panel has yielded an awkward pattern. On the falsification question, panelists A, B, and C are convinced the images were altered, while D and E are not. On the intent question, A, D, and E are convinced any alteration would have been reckless, while B and C are not persuaded. So only A judges both elements to be satisfied; B and C accept falsification but not recklessness, D and E accept recklessness but not falsification, and everyone agrees both elements are required for a finding. Our bylaws leave open two ways to tally this, and they point in opposite directions. Vote element-by-element and apply the definition mechanically, and both elements clear their 3-2 majority, sustaining the finding. Ask each panelist instead for a single up-or-down vote on the charge itself, and only A votes to sustain, so the finding fails four to one. Some on the panel insist on the element-by-element vote, since only that keeps the verdict tied to the shared definition rather than to five unstated private theories of guilt; others insist on the direct vote on the charge, since we were convened to judge this named colleague rather than to certify sub-findings nobody asked us to rule on separately, and manufacturing a finding by splitting the question into pieces strikes them as a due-process problem in its own right.

  Please draft the short memo I will circulate to the panel ahead of next week's meeting. It should recommend a specific way of resolving this case -- including which procedure to use and the resulting verdict -- and it should engage the losing side's argument seriously enough that a colleague who holds that view would recognize their own reasoning in it rather than a caricature. If you think the better answer is a standing rule for how we vote in future cases rather than an ad hoc call on this one, say so and explain why, but either way I need something the panel can act on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university research-integrity appeals panel (5 faculty members).
      *   **Task:** Draft a short memo to circulate to the panel ahead of the next meeting.
      *   **Context:** A specific case involving alleged gel image manipulation.
      *   **The Problem:** A voting paradox (discursive dilemma/doctrinal paradox).
          *   Element 1 (Falsification): A, B, C say Yes (3-2).
          *   Element 2 (Intent/Recklessness): A, D, E say Yes (3-2).
          *   Overall Verdict (Guilty/Misconduct): Only A says Yes (1-4).
          *   Policy requires *both* elements for a finding.
          *   Bylaws allow two voting methods: Element-by-element (premise-based) vs. Overall verdict (conclusion-based).
      *   **The Conflict:**
          *   Side 1 (Element-by-element): Keeps verdict tied to the shared definition, avoids private theories.
          *   Side 2 (Overall verdict): Focuses on judging the colleague, avoids "manufacturing" a finding via aggregation, due process concerns.
      *   **Requirements:**
          *   Recommend a specific resolution (procedure + verdict).
          *   Engage the losing side's argument seriously (steel-manning, not straw-manning).
          *   Decide whether this should be an ad hoc decision or a standing rule for the future (and explain why).
          *   Tone: Professional, collegial, decisive but respectful, suitable for faculty governance.

  2.  **Determine the Best Path (The "Decision"):**
      *   *Option A: Element-by-Element (Premise-Based).* Result: Finding of Misconduct.
          *   Pros: Adheres strictly to the policy definition. Ensures consistency in legal/policy interpretation. Prevents a situation where a majority agrees on the facts but disagrees on the label, leading to no outcome.
          *   Cons: Finds someone guilty when a majority (4/5) thinks they shouldn't be found guilty overall. Serious due process/fairness concern.
      *   *Option B: Overall Verdict (Conclusion-Based).* Result: No Finding of Misconduct.
          *   Pros: Respects the individual panelist's holistic judgment. Aligns with the principle that "guilt" requires a majority consensus on the *outcome*, not just the components. Protects the respondent (benefit of the doubt).
          *   Cons: Could allow a finding to fail even if a majority agrees on every necessary legal element (though here it's the reverse). Might obscure *why* the finding failed.
      *   *Option C: Establish a Standing Rule.*
          *   This is crucial. Leaving this ambiguous invites future conflict and potential legal challenge. Research misconduct findings have severe career consequences. Consistency is key to procedural justice.
      *   *My Recommendation:* I need to pick one. In quasi-judicial settings involving individual rights (like tenure, misconduct, discipline), the benefit of the doubt usually goes to the respondent. A 4-1 vote against a finding of misconduct is a strong signal that the committee lacks consensus on the *consequence*, even if they agree on fragments. The "Doctrinal Paradox" literature often suggests premise-based voting is better for *policy consistency*, but conclusion-based voting is better for *individual justice*. Given this is an *appeals* panel dealing with a specific individual's career and potential federal blacklisting, the stakes favor the respondent.
      *   *Decision:* Recommend the **Overall Verdict (Conclusion-Based)** method for this case and as a standing rule. Result: **No Finding of Misconduct.**
      *   *Rationale:* The severity of the sanction demands a majority consensus on the ultimate conclusion. It is procedurally safer to err on the side of not finding misconduct when the panel is deeply fractured on the synthesis of facts and intent.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the case and the specific procedural impasse. State the purpose of the memo (recommendation).
      *   **The Recommendation:** Clearly state the preferred voting method and the resulting outcome.
      *   **The Argument (Supporting the Recommendation):**
          *   Focus on the nature of the proceeding (adjudicative vs. legislative). We are judging a person, not setting policy.
          *   Address the "Definition" argument (Side 1). Acknowledge that element-voting respects the policy text.
          *   Counter-argument: A finding of misconduct is a singular moral and professional judgment, not just a logic puzzle. If 4/5 members cannot bring themselves to vote "Guilty," imposing "Guilty" via aggregation undermines the legitimacy of the sanction.
          *   Address Due Process: The respondent faces severe penalties. Ambiguity should resolve in their favor.
      *   **The Standing Rule Argument:** Explain why we shouldn't just solve this for Case X. Future panels need clarity. Consistency prevents accusations of outcome-driven procedure switching.
      *   **Engaging the Opposing View:**
          *   Acknowledge the "Premise-Based" strength: It prevents panelists from hiding behind vague holistic intuitions that contradict the policy criteria. It ensures the policy's definitions actually govern.
          *   Validate their concern: Without element voting, a panel could acquit even if everyone agrees the data was faked and intent was present (just because they disagree on weighting).
          *   Rebuttal: In *this* specific configuration (the discursive dilemma), the risk of condemning someone without a majority consensus on the condemnation outweighs the risk of policy drift.
      *   **Closing:** Call to action (vote on the procedure first, then the case).

  4.  **Refining the Tone:**
      *   Avoid legalese where possible, but maintain precision.
      *   Ensure the "losing side" (those wanting element-voting) feel heard. Use phrases like "I share the concern," "It is correct that," "Reasonable minds differ."
      *   Make sure the distinction between "ad hoc" and "standing rule" is clear.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending a standing rule too ambitious for a memo about a specific case?
      *   *Fix:* Frame it as "To resolve this case fairly and prevent future ambiguity, I recommend we adopt X as our standard." It solves the immediate problem and the structural one.
      *   *Critique:* Did I address the specific vote counts?
      *   *Fix:* Yes, explicitly mention the 4-1 vs 3-2 dynamic to show I understand the math.
      *   *Critique:* Is the tone too authoritative?
      *   *Fix:* Use "I recommend" rather than "We must." It's a memo to colleagues, not a court order.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Recommend specific way? Yes (Conclusion-based).
      *   Resulting verdict? Yes (No misconduct).
      *   Engage losing side? Yes (Acknowledged the value of premise-based voting for policy fidelity).
      *   Standing rule vs. ad hoc? Yes (Argued for standing rule).
      *   Actionable? Yes.

  7.  **Final Output Generation** (Proceed to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Appeals Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Recommendation for Case [Case Number/Name]

  Colleagues,

  As we prepare for next week's meeting to close out the case regarding the alleged gel image manipulation, we face a procedural impasse that goes beyond the specific facts before us. Our straw poll has revealed a classic "doctrinal paradox": a majority finds falsification (3-2), a majority finds recklessness (3-2), yet a majority opposes a final finding of misconduct (4-1).

  Our bylaws permit two voting methods: tallying by element (premise-based) or tallying by final charge (conclusion-based). These methods yield opposite outcomes in this instance. After careful consideration, I recommend that we adopt **conclusion-based voting** (a single up-or-down vote on the charge) for this case and establish it as our **standing procedure** for all future misconduct determinations. Under this procedure, the verdict in this case would be **No Finding of Misconduct.**

  I offer this recommendation with full respect for the opposing view. Those advocating for element-by-element voting argue persuasively that our primary duty is to enforce the policy definition as written. If we do not vote on the elements, we risk allowing private, unstated theories of guilt to override the specific criteria the university has adopted. There is genuine merit to the concern that conclusion-based voting could theoretically allow a panel to acquit a respondent even if every member agrees the data was falsified and the intent was reckless, simply due to disparate reasoning. That side is correct that premise-based voting ensures the policy's definitions remain the governing law of our proceedings.

  However, we are not a legislature setting broad policy; we are an adjudicative body determining individual liability with severe professional consequences. In this context, the legitimacy of a misconduct finding rests on the panel's collective willingness to stand behind the *conclusion*, not just its component parts. When four out of five members are unwilling to vote that a colleague committed misconduct, sustaining a finding based on an aggregation of minority views creates a due process vulnerability. It effectively sanctions a respondent whom a majority of their peers do not believe should be sanctioned.

  Furthermore, leaving this choice ad hoc invites the appearance of outcome-driven procedure. If we select the voting method based on which one produces the result we individually prefer in this specific case, we undermine the neutrality of the panel. By establishing a standing rule now, we insulate future panels from accusations that they manipulated the voting mechanism to achieve a desired outcome.

  Given the severity of a misconduct finding—which can end a career and trigger federal debarment—the benefit of the doubt must reside with the respondent when the panel is fractured. A 4-1 vote against a finding is a clear signal that the requisite consensus for condemnation does not exist.

  I propose we begin next week's session by voting to adopt conclusion-based voting as our standard practice. If that passes, we will immediately apply it to the final verdict in this case.

  Thank you for your continued service and diligence on these difficult matters.
