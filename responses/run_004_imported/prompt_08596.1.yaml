answer: |-
  Your friend is right that the standard "Bank Cases" (where we compare a low-stakes Hannah to a high-stakes Hannah) are designed to be handled equally well by both theories. In those standard cases, the **subject's stakes** and the **attributor's conversational standards** rise and fall together. Because the two variables are yoked, the theories are extensionally equivalent in those specific instances.

  However, the theories are structurally distinct. Contextualism ties the truth of "S knows" to the **attributor's context**, while Pragmatic Encroachment (PE) ties it to the **subject's practical environment**. To separate them, we must construct a scenario where these two variables come apart.

  Here is a scenario that generates divergent verdicts.

  ### The Scenario: The Ignorant Observer

  **The Subject (Hannah):**
  Hannah needs to deposit a check by Saturday noon to avoid foreclosure on her house. This is an extreme **high-stakes** situation for her. Her evidence is strong but not conclusive: she was at the bank two Saturdays ago, and it was open. However, banks sometimes change hours. Given the stakes, Hannah herself feels she cannot claim to know; she plans to go to the bank on Friday to be sure. She does not publicly broadcast her financial plight; to her neighbors, she appears financially stable.

  **The Attributor (Mark):**
  Mark is Hannah's neighbor. He is having a casual conversation with a third party, Jane, about local errands. Mark has **low stakes** regarding the bank's hours (he just needs to mail a letter). Crucially, **Mark is ignorant of Hannah's specific financial situation.** He believes Hannah is in a standard, low-stakes position.

  **The Utterance:**
  In the course of this casual conversation, Mark says:
  > *"Hannah knows the bank is open on Saturday; she goes there every week."*

  **The Evidential Situation:**
  Hannah's evidence (memory of past visits) is fixed. It is sufficient for "ordinary" knowledge but insufficient for "high-stakes" knowledge (by the lights of both theories). The only variable is the practical environment and the conversational context.

  ### The Divergent Verdicts

  **1. Pragmatic Encroachment (Stanley/Hawthorne): FALSE**
  For the pragmatic encroacher, the truth conditions of knowledge attributions are invariant across conversational contexts but sensitive to the subject's practical environment.
  *   **Reasoning:** Hannah is in a high-stakes situation (foreclosure). Therefore, the epistemic standard she must meet is raised. Her evidence (memory of a visit two weeks prior) is insufficient to meet this raised standard.
  *   **Verdict:** The proposition "Hannah knows the bank is open" is false. Mark's utterance is false, regardless of how casual his conversation is or how ignorant he is of her stakes.

  **2. Epistemic Contextualism (DeRose): TRUE**
  For the contextualist, the truth conditions of knowledge attributions vary with the conversational context of the *attributor* (Mark).
  *   **Reasoning:** Mark is in a low-stakes conversation. The possibility of the bank changing its hours is not salient in his conversation with Jane (they are discussing errands, not financial ruin). Furthermore, Mark is unaware of Hannah's high stakes, so those stakes do not force an adjustment of standards in *his* context. In Mark's low-standards context, Hannah's evidence is sufficient.
  *   **Verdict:** The proposition "Hannah knows the bank is open" is true as uttered by Mark. Mark's utterance is true.

  ### The Structural Feature That Separates Them

  The feature that drives the wedge between the two theories is **Information Asymmetry regarding the Subject's Stakes.**

  Specifically, this scenario decouples the **Attributor's Conversational Context** from the **Subject's Practical Environment**.
  *   **Contextualism** looks exclusively at the *Attributor's Context*. Since Mark's context is low-standards, the sentence is true.
  *   **Pragmatic Encroachment** looks exclusively at the *Subject's Environment*. Since Hannah's environment is high-stakes, the sentence is false.

  In this scenario, the attributor's ignorance of the subject's stakes prevents the subject's stakes from "infecting" the attributor's context. This allows the two theories to track different truth-makers.

  ### Why the Ordinary Bank Cases Lack This Feature

  Your friend's intuition stems from the structure of the standard Bank Cases (e.g., DeRose's original formulation or Stanley's *Knowledge and Practical Interests*). In those standard cases, the **narrative setup forces the attributor and subject variables to align.**

  1.  **The Reader as Attributor:** In the standard philosophical thought experiment, *we* (the readers/philosophers) are the attributors. We are explicitly told about Hannah's stakes.
  2.  **Salience:** Because we are told about the stakes, the error possibilities (e.g., "the bank might have changed hours") become salient *to us*.
  3.  **The Alignment:**
      *   In **Low-Stakes Bank Case:** Hannah has low stakes; We (attributors) are told she has low stakes. Our standards remain low. (Contextualism: True / PE: True).
      *   In **High-Stakes Bank Case:** Hannah has high stakes; We (attributors) are told she has high stakes. Our standards rise due to salience. (Contextualism: False / PE: False).

  In the standard cases, the subject's stakes always succeed in raising the attributor's standards (either because the attributor is the subject, or because the attributor is informed of the stakes). Because the two variables move in lockstep, the theories make the same predictions.

  Your friend is correct that you cannot separate the theories if the attributor is fully informed of the subject's stakes. But as the "Ignorant Observer" scenario demonstrates, once you allow the attributor to remain in a low-standards context while the subject suffers in a high-stakes environment, the theories yield contradictory truth values for the very same sentence.
