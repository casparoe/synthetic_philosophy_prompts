answer: |-
  The wine glasses were polished to a streakless shine, catching the light of the chandelier. Elias adjusted the spacing for the third time, measuring the distance between the crystal and the silverware with a precision that felt like a defense mechanism.

  "He's just a patient now, Eli," his mother had said that morning, her voice soft, wrapped in the cotton wool of relief. "The tumor is gone. The anger is gone. We don't need to dwell on the rest."

  His parents had already migrated to what P.F. Strawson would call the objective attitude. They looked at Julian now as one looks at a broken appliance that has been fixed, or a child who has stumbled. They managed him. They asked about his medication, his fatigue, his headaches. They had exempted him from the moral community to save him, and perhaps to save themselves. It was a clean, clinical forgiveness. It required no reckoning, only diagnosis.

  But Elias felt the knot in his stomach, tight and hot. He remembered the night Julian had drained their mother's savings account to feed a gambling addiction that didn't exist, the night he had screamed at their father until the old man sat down on the stairs and wept. That wasn't a symptom. That was a betrayal. And now, with the meningioma removed and the "real" Julian supposedly back, Elias was expected to dissolve his resentment because the cause had been biological.

  The doorbell rang.

  When Julian walked in, he looked disturbingly normal. There was a faint scar hidden beneath his hairline, but his eyes were clear. He hugged their mother, shook their father's hand, and when he reached Elias, he hesitated.

  "Good to see you," Julian said.

  "You too," Elias lied.

  Dinner began with the cautious rhythm of a bomb squad operation. Their mother steered the conversation toward safe harbors: the weather, the renovation of the kitchen, the neighbor's dog. Julian played his part, smiling, nodding, eating the roast chicken his mother had carved for him. He was being managed, Elias realized. They were all treating him like a convalescent who might break if the wind blew too hard.

  It was a kind of love, certainly. But it was a love that looked down. It stripped Julian of his agency. If Julian was not responsible for the cruelty of the last two years because of the tumor, then he was not responsible for the kindness of tonight either. He was just a vessel reacting to stimuli. A good boy because the pressure was off.

  "I've been thinking about applying for that job in Chicago," Julian said midway through the main course.

  His father beamed. "That's wonderful, son. Just take it slow. Don't stress yourself."

  "I know, Dad. But I want to get back to it."

  "We'll support you whatever you decide," his mother added, patting his hand.

  Elias set his fork down. The clink was louder than he intended. "Do you remember the night at the lake house?"

  The table went still. His mother's eyes widened, a silent plea to stop. *Don't upset him. He's healing.*

  Julian looked down at his plate. The color drained from his face. "Elias, please."

  "No," Elias said. He wasn't shouting, but his voice was hard. "Mom and Dad, they look at you and they see the tumor. They see a medical event. They've decided that wasn't you. So they don't have to be angry, and they don't have to trust you, really. They just have to monitor you."

  "Eli, stop," his father warned.

  "I'm not talking to you," Elias said, keeping his eyes on his brother. "I'm talking to him. Because if I accept their version, if I accept that you were just... sick... then I lose you. I lose my brother."

  Julian looked up. There was fear in his eyes, but beneath it, something else. A flicker of recognition.

  "If it was just the tumor," Elias continued, his voice trembling slightly, "then you didn't do anything. You were a car with bad brakes. You don't apologize for bad brakes, Julian. You just fix them. And if you fix them, we're all supposed to be happy."

  "That's not fair," Julian whispered.

  "It's not about fair. It's about who you are." Elias leaned forward. "Strawson wrote that we treat people as objects when we stop holding them accountable. We manage them. We cure them. But we don't *meet* them. Mom and Dad, they've exempted you. They love you, but they don't expect anything from you. I'm not doing that."

  The silence stretched, heavy and suffocating. His mother looked near tears, her hands clasped tightly in her lap. She wanted the peace of the objective attitude, the safety of knowing her son was a victim of biology. Elias was denying her that safety. He was insisting on the danger of the participant stance.

  "Why are you doing this?" Julian asked. His voice wasn't the whine of the invalid. It was the voice of a man being challenged.

  "Because I want to know if you're sorry," Elias said. "Not if the tumor is sorry. Not if the chemistry is rebalanced. I want to know if *you* are sorry for what you did to us. And I want to know if you're going to choose to be better, not just happen to be better."

  Julian stared at him. For a moment, the old defensiveness flared—the mask of the liar who had hidden the debt for two years. But then, slowly, it crumbled. He looked at his parents, who were watching with horrified fascination, and then back to Elias.

  "I stole from them," Julian said. His voice was rough. "I knew it was wrong. I knew it was hurting Dad. I felt... I felt like I was watching myself do it, and I couldn't stop, but I also... I didn't want to stop. Not until I lost everything."

  "That's not the tumor talking?" Elias asked.

  "No," Julian said. He took a breath, his hands shaking slightly on the table. "The tumor made it hard to care. It made the noise in my head loud. But I made the choices. I lied to your face, Eli. I looked you in the eye and lied."

  Elias felt the knot in his stomach loosen, not because the pain was gone, but because the pain was now shared. It was no longer a medical anomaly to be observed; it was a moral injury to be acknowledged.

  "I hate you for that," Elias said quietly. It was the truth he had been guarding. "I resent you. I'm angry."

  "I know," Julian said. "I deserve it."

  "And if you screw up again," Elias said, "I won't blame the chemistry. I'll blame you."

  "Good," Julian said. He picked up his wine glass. His hand was steady. "Because I don't want to be a patient. I want to be your brother. Even if that means you're mad at me."

  Elias picked up his own glass. He looked at his parents. His mother was wiping her eyes, looking unsettled, as if the floor had shifted beneath her. She had wanted a cured child; she was getting an adult son. It was a harder thing to love, because it was a thing that could choose to leave, or choose to hurt.

  "To Chicago," Elias said.

  "To Chicago," Julian replied.

  They drank. The wine was dark and tannic, leaving a dry finish on the tongue. It wasn't sweet. It wasn't a clean slate. The resentment was still there, humming beneath the surface, but it was no longer a solitary burden. It was a bridge. By refusing to exempt Julian, by refusing to treat him as a case study in neurology, Elias had invited him back into the fray of human relationship.

  Later, as they cleared the plates, Julian stood beside Elias at the sink.

  "Thank you," Julian said, not looking at him. "For not letting me off the hook."

  "Don't thank me yet," Elias said, scrubbing a spot on a ceramic plate. "The hook is still there. I'm just not cutting the line."

  "I wouldn't expect you to."

  Elias dried his hands and turned to his brother. He didn't hug him. He didn't offer a platitude about fresh starts. He simply nodded, acknowledging the weight of the history between them, and the weight of the responsibility Julian had just picked up. It was exhausting, this business of treating each other as free agents. It was risky. But as Elias looked at Julian, really looked at him, he saw the person he had missed. Not the victim of the tumor, not the monster of the last two years, but the man who could be blamed, and therefore, could be forgiven.

  "Pass me the towel," Elias said.

  Julian handed it over. Their fingers brushed, equal and accountable.
