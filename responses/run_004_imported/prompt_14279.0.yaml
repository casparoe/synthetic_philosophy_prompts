      *   *Critique:* Is "Rectification of Names" too abstract?
      *   *Fix:* Ground it in Ames/Rosemont's specific language: "Focus-Field," "Relational Constitution."
      *   *Critique:* Make sure I don't slip into Liberal Individualism (Public vs. Private sphere).
      *   *Fix:* Emphasize that for Confucians, there is no "private" sphere in the liberal sense. It's about *proximity* and *scope of influence*.
      *   *Key Insight:* The *Analects* case is about *moral cultivation* (theft is a failure of virtue, fixed by love). The *Mencius* case is about *institutional integrity* (murder is a breach of the peace that the King guarantees).
      *   *Wait, one nuance:* In *Mencius*, Shun doesn't just "allow" the arrest; he actively removes himself so the arrest *can* happen without his interference. In *Analects*, the son actively conceals. Why the difference?
      *   *Reasoning:* Because Shun *is* the Law. His presence *is* the obstruction. The commoner is *subject* to the Law. His testimony is the obstruction.
      *   *Better phrasing:* For the commoner, testifying is an active betrayal of the role. For Shun, staying on the throne is an active betrayal of the role (of Kingship).
      *   *Central Concept:* **Role Integrity vs. Role Conflict.**
      *   *Commoner:* No conflict. Role = Son. Action = Protect Father.
      *   *Shun:* Role Conflict. King vs. Son. Resolution = Sacrifice King to save Son, without corrupting King (by letting law run).

  7.  **Finalizing the Structure:**
      1.  **Thesis:** The apparent contradiction dissolves when we view *Yi* (appropriateness) as maintaining the integrity of the specific relational web one inhabits.
      2.  **The Nature of Role:** Roles are not hats we wear; they are who we are.
      3.  **The Analects Case:** The commoner's world is the family. Disrupting it destroys the root of morality.
      4.  **The Mencius Case:** Shun's role as King encompasses the whole web. Using kingly power for family corrupts the source of order.
      5.  **The Reconciliation:** It's not Public vs. Private. It's about *corruption of the role*. The commoner testifying corrupts "Son." Shun interfering corrupts "King." Shun fleeing preserves "Son" without corrupting "King."
      6.  **Conclusion:** This is internal consistency, not external patching.

  8.  **Review against constraints:**
      *   Internal resources? Yes (*Yi*, *Zhengming*, Relational Ontology).
      *   No *ad hoc* rule? Yes, derived from the nature of the roles themselves.
      *   Addresses nepotism critique? Yes, by reframing the goal as relational integrity.

  9.  (Self-Correction during drafting): Ensure I explicitly mention Ames and Rosemont's terminology (e.g., "radically situated," "focus-field self") to show I'm using *their* version of role ethics, not just generic Confucianism.

  10. **Final Polish:** Check tone. Needs to be academic but persuasive, suitable for a piece on comparative ethics. (Proceed to generate output).

