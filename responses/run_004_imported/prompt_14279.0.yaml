answer: |-
  To reconcile the *Analects* passage on the stolen sheep with the *Mencius* passage on Shun's father, we must resist the temptation to import a modern liberal distinction between "private conscience" and "public duty." That framework assumes an atomistic self who *has* roles, whereas Confucian role ethics (as articulated by Ames and Rosemont) posits a self who *is* their roles. The reconciliation lies not in balancing two competing spheres, but in understanding how the specific **constitutive weight** of a role dictates what counts as *Yi* (appropriateness) in a given context.

  The apparent contradiction vanishes if we read both passages through the internal logic of **Role Integrity** and the **Rectification of Names** (*Zhengming*). In role ethics, moral failure is not breaking an abstract rule; it is failing to live up to the demands of the specific relationship that constitutes you at that moment.

  ### 1. The Commoner in the *Analects*: Preserving the Root
  In *Analects* 13.18, the father and son are private citizens. In the Confucian ontological view, the family is not a "private" sphere distinct from the political; it is the **root** (*ben*) of the political. The father-son relationship is the primary site where *Ren* (humaneness) is cultivated.

  For a commoner, testifying against a father is not an act of "civic duty"; it is an act of **role destruction**. To testify is to objectify the father as a "criminal" rather than nurturing him as a "father." In role ethics, the son's obligation is to reclaim the father's moral potential through remonstrance and care, not to hand him over to an impersonal legal apparatus. Concealment (*yin*) here is not merely hiding evidence; it is an active assertion that the relational bond takes precedence over legal abstraction because the bond is the source of all future moral behavior. If the son destroys the father to save the law, he destroys the very ground from which law-abiding citizens grow. Thus, "uprightness" (*zhi*) is defined by the integrity of the relationship, not compliance with a statute.

  ### 2. Shun in the *Mencius*: The Burden of the Sage-King
  The case of Shun (*Mencius* 7A:35) is distinct not because Shun values family less, but because his role as **King** carries a different constitutive weight. In Confucian political thought, the King is not merely an administrator; he is the cosmic pivot who maintains the harmony of the entire relational web. His role is to embody *Yi* for the whole kingdom.

  Here lies the crux of the reconciliation: **Shun cannot conceal his father without corrupting the role of Kingship itself.**
  If Shun uses his kingly authority to pardon his father, he transforms the institution of Kingship from a public trust into a tool of nepotism. This would sever the King-People relationship for *all* subjects, undermining the trust that holds the state together. Unlike the commoner, whose silence affects a single case, Shun's interference would rot the root of the political order itself.

  However, Shun also cannot arrest his father, because that would destroy the Son-Father relationship. He faces a genuine **role conflict**: he cannot be both "Sage King" and "Filial Son" in this specific instance.

  ### 3. The Reconciliation: Abdication as Role Integrity
  The solution Mencius provides—abdication and flight—is not an *ad hoc* compromise but the only move that preserves **Role Integrity** for both parties.

  *   **Why he doesn't obstruct the law:** By allowing the Minister of Justice (Gao Yao) to act, Shun acknowledges that the *institution* of justice must remain intact. He respects the role of the Minister and the expectations of the people. He does not use his power to corrupt the public web.
  *   **Why he flees:** By tossing aside the throne "like a worn sandal," Shun voluntarily sheds the role that conflicts with his filial duty. He ceases to be King so that he can remain a Son.

  This distinguishes the two cases without importing external rules.
  *   **The Commoner** does not have a public role that conflicts with his filial role. Therefore, he fulfills his primary constitutive role (Son) through concealment. There is no higher role to sacrifice.
  *   **Shun** *does* have a conflicting public role. Therefore, he must sacrifice the *position* (Kingship) to fulfill the *heart* (Filiality), while ensuring the *function* of the position (Justice) continues unimpeded by his departure.

  ### 4. Defusing the Nepotism Critique
  Critics argue this is nepotism because it privileges blood over justice. Defenders argue it prioritizes justice because Shun allows the arrest. A role ethics reading shows both are partially wrong.

  It is not nepotism because the goal is not **privilege** (getting the father off scot-free while keeping power); Shun pays the ultimate price (losing the kingdom). It is not abstract justice because the law is not allowed to crush the human bond entirely; the son saves the father from the *shame* of punishment by fleeing with him into exile (a life of hardship, but together).

  The distinction between the two passages emerges organically from the **scope of responsibility** inherent in the roles.
  *   For the **commoner**, the family is the microcosm of the state. Saving the family *is* saving the state's future.
  *   For the **King**, the state is the macrocosm of the family. Saving the state's integrity requires sacrificing the King's personal tenure, but saving the family requires sacrificing the King's public power.

  ### Conclusion
  The reconciliation relies on the internal Confucian concept that **roles are gradient and contextual.** There is no universal rule for "theft" or "murder"; there is only the question: *What action preserves the integrity of the relational web I inhabit?*

  For the commoner, testifying severs the root. For the King, interfering severs the trunk. Shun's abdication is the logical extreme of role ethics: when two constitutive roles become mutually exclusive, one must be relinquished to prevent the corruption of both. Thus, concealment for the commoner and abdication for the King are not contradictory rules, but consistent applications of the same principle: **act so that the Names (roles) remain rectified.** The commoner rectifies "Son" by concealing; Shun rectifies "King" by leaving and "Son" by fleeing. Both prioritize the relational bond, but the cost of that priority scales exactly with the power one holds.
