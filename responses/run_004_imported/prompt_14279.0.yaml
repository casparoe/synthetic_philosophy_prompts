      *   **Topic:** Comparative ethics, specifically Confucian "role ethics" (Ames & Rosemont).
      *   **The Conflict:** Two canonical passages seem contradictory regarding family loyalty vs. public justice.
          *   *Analects* 13.18: Father steals sheep $\rightarrow$ Son conceals (Uprightness lies in concealment).
          *   *Mencius* 7A:35: Father murders $\rightarrow$ Shun abdicates and flees with father (doesn't obstruct law, but doesn't let father be punished).
      *   **The Debate:** Critics say it's nepotism; Defenders say it prioritizes justice (Shun doesn't stop the arrest).
      *   **The Task:** Argue for a reading that reconciles these two using resources *internal* to role ethics.
      *   **Constraint:** The distinction (private citizen vs. ruler) must not be an *ad hoc* rule bolted on from outside. It must emerge naturally from the theory itself.

  2.  **Deconstruct "Role Ethics" (Ames & Rosemont):**
      *   What is it? It's not rule-based deontology or utilitarian calculus. It's about *becoming* a person through relationships.
      *   Key concept: *Ren* (humaneness) is achieved through specific roles (father, son, ruler, subject).
      *   Key concept: *Yi* (appropriateness/righteousness) is context-sensitive. It's not a universal abstract rule, but doing what is fitting *in this specific situation* given *these specific relationships*.
      *   Key concept: The self is relational. I am the sum of my roles. To damage a role is to damage the self and the social fabric.
      *   Key concept: Focus on *process* and *nurturing* rather than *judgment* and *punishment*.

  3.  **Analyze the Passages through the Lens of Role Ethics:**
      *   *Analects* 13.18 (The Sheep):
          *   Context: Ordinary citizens (Father/Son).
          *   Action: Concealment (*yin*).
          *   Role Ethics Interpretation: The primary obligation of a son is to nurture the father's moral potential. Turning him in objectifies him as a "criminal" before he is rehabilitated. It severs the relational bond which is the foundation of social order. "Uprightness" (*zhi*) is defined by the integrity of the relationship, not abstract legal compliance.
      *   *Mencius* 7A:35 (The Murder/Shun):
          *   Context: The Sage King (Shun) and his Minister of Justice (Gao Yao).
          *   Action: Arrest happens (Law proceeds), Shun leaves (Role abandonment).
          *   Role Ethics Interpretation: Shun holds two conflicting roles: Son and King. As King, he embodies the Law. As Son, he embodies Filial Piety. He cannot be both if the law punishes the father. He chooses the foundational role (Son) but acknowledges the public role (King) by not interfering with the arrest.

  4.  **Identify the Core Tension & Potential Reconciliation:**
      *   *Tension:* Why conceal in one case but flee (allowing arrest) in the other? Why not conceal for Shun? Why not let the sheep thief be arrested for the commoner?
      *   *Hypothesis:* The difference lies in the *scope of responsibility* inherent in the specific roles being enacted.
      *   *Role Ethics Internal Resource:* The concept of *Yi* (appropriateness/fittingness) is gradient and contextual. The "weight" of a role changes based on its impact on the communal web.
      *   *Refinement:* It's not just "Private vs. Public" (which sounds like liberal individualism). It's about the *constitutive nature* of the roles.
      *   *Argument:* In the *Analects* case, the father-son relationship *is* the primary site of moral cultivation. Disrupting it destroys the root of ethics. In the *Mencius* case, Shun's role as King is not just a job; it is a cosmic function. If he uses kingly power to protect his father, he corrupts the *institution* of kingship itself, which harms everyone. However, he cannot stop being a son. So he abandons the *power* of the King to preserve the *heart* of the Son, without corrupting the Law.

  5.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the tension. State the thesis: The reconciliation lies in the Confucian understanding of *Yi* (appropriateness) as context-sensitive optimization of relational integrity, not a clash between "family" and "state."
      *   **Core Principle 1: The Gradient of Responsibility.** Role ethics isn't universalist. Obligations scale with the scope of the role. A commoner's role is local; a King's role is cosmic/universal.
      *   **Analyzing *Analects* 13.18:** For the commoner, the family *is* the state in microcosm. Preserving the bond is the highest good because that bond is where *Ren* is learned. Legal abstraction is secondary to relational health. Concealment is an act of moral remonstrance (private correction), not just hiding crime.
      *   **Analyzing *Mencius* 7A:35:** Shun is different. His role as King is to uphold the "Way" for *all* fathers and sons. If he uses public power for private ends, he destroys the trust that holds the web together. But he can't betray his father. The solution: Abandon the public role to save the private one. This preserves the integrity of *both* spheres.
      *   **Synthesizing (The "Internal" Logic):** Why isn't this *ad hoc*? Because it follows the logic of *Zhengming* (Rectification of Names). To act "as a King" when protecting a murderer is to fail the name "King." To act "as a Son" when arresting a father is to fail the name "Son." Shun's flight is the only action that keeps both "Names" intact (he stops being King so he can remain Son). The commoner doesn't have the "King" name to discard, so he protects the "Son" name through concealment.
      *   **Addressing the "Nepotism" Critique:** It's not nepotism because the goal isn't privilege; it's the preservation of the relational fabric which *is* the source of morality.
      *   **Conclusion:** The distinction emerges from the *weight* of the roles, not an external public/private split.

