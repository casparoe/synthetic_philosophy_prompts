answer: |-
  This is a classic dialectic in the philosophy of biology, essentially reenacting the "Adaptationism Wars" that have simmered since 1979. Both Theo and Nora are articulating well-established positions in the literature. Theo is channeling the G&L/Gouldian structuralist view, while Nora is channeling the Optimality/Theoretical Biologist rebuttal (akin to Dennett or Maynard Smith).

  Here is a move-by-move breakdown of who holds the stronger position at each step, followed by the blind spots both are leaving on the table.

  ### Move-by-Move Analysis

  **Move 1: Theo (The Panglossian Charge)**
  *   **Argument:** Biologists assume selection for current function without ruling out alternatives (drift, constraint). This is the core methodological critique of the "Spandrels" paper.
  *   **Verdict:** **Edge to Theo.**
  *   **Reasoning:** Theo accurately states the *normative* claim of the paper. G&L's primary goal was not to prove specific traits were spandrels, but to attack a methodological habit. Historically, Theo is right that in the late 70s, the default explanatory mode in evolutionary biology was indeed adaptive storytelling. If the criterion is "Did G&L identify a real bias in the field's rhetoric?", Theo wins.

  **Move 2: Nora (The Strawman Charge)**
  *   **Argument:** Serious theorists (Maynard Smith, Dawkins) already modeled constraints. G&L are attacking a caricature ("hyperadaptationism") that no sophisticated biologist actually held.
  *   **Verdict:** **Edge to Nora.**
  *   **Reasoning:** This is the strongest sociological critique of G&L. If you read *Optimality Theory* literature from that era, constraints were mathematically encoded. G&L were often accused of attacking the "vulgar" adaptationists rather than the sophisticated ones. Nora is correct that the *theoretical* core of the Modern Synthesis already had room for constraints. G&L's rhetoric was often polemical enough to warrant this "strawman" accusation.

  **Move 3: Theo (Theory vs. Practice)**
  *   **Argument:** Concedes the theoretical strawman but argues the *empirical practice* (journal papers) matched the critique. Biologists proposed functions post-hoc without testing alternatives.
  *   **Verdict:** **Edge to Theo.**
  *   **Reasoning:** This is the best counter to the strawman charge. Even if the *great theorists* knew better, the *working biologists* filling the journals often did not. Bibliometric studies of evolutionary literature from the 70s and 80s generally support Theo: adaptive hypotheses were treated as defaults, while null hypotheses (like drift) were rarely rigorously tested. Theo successfully shifts the ground from "what the models said" to "what the scientists did."

  **Move 4: Nora (The Epistemic Symmetry & Exaptation)**
  *   **Argument:** Proving a "spandrel" is just as speculative as proving an "adaptation." Furthermore, exaptation (co-option) blurs the line, making the categories unstable.
  *   **Verdict:** **Edge to Nora.**
  *   **Reasoning:** This is the deepest philosophical move in the exchange. Nora identifies a genuine epistemic problem: it is incredibly difficult to prove a trait has *no* function (the spandrel claim) just as it is hard to prove it *does*. Additionally, her point about exaptation is crucial. If a spandrel is later co-opted (as G&L admitted with the evangelist paintings), it becomes an adaptation for its *current* use, even if not its *origin*. This destabilizes G&L's binary. Nora successfully argues that "Spandrel" is not a magic bullet that solves the evidentiary problem.

  **Move 5: Theo (The Methodological Default)**
  *   **Argument:** G&L weren't demanding we assume traits *are* spandrels, only that we stop assuming they *are* adaptations without evidence. It's about the burden of proof, not the final verdict.
  *   **Verdict:** **Draw / Slight Edge to Theo.**
  *   **Reasoning:** Theo correctly identifies that G&L's paper is a rule of inference, not an ontological claim. He is arguing for a "null hypothesis" approach. However, Nora's Move 4 complicates this because "drift/constraint" is often a harder null hypothesis to model than selection. Still, Theo wins this round on procedural grounds: science generally requires positive evidence for a claim (adaptation), so demanding that evidence before accepting the claim is standard scientific practice.

  ---

  ### What Both Are Missing (The Blind Spots)

  Since this is a PhD reading group, they should be pushing past the 1979/1980s binary. Here are three critical elements missing from their exchange:

  **1. The Problem of the "Null Hypothesis"**
  Theo treats "non-adaptive" as a clean null hypothesis. In population genetics, it isn't. Drift is not merely "the absence of selection"; it is a specific stochastic process with its own mathematical signature. To prove a trait is a spandrel (or drift), you often need *more* data (effective population size, mutation rates, phylogenetic variance) than you do to propose a plausible adaptive story. Nora hints at this in Move 4, but neither explicitly acknowledges that **testing for spandrels is often methodologically harder than testing for adaptations.** G&L made it sound like you just stop telling stories, but you have to start modeling neutrality, which is non-trivial.

  **2. The Vindication of Constraints (Evo-Devo)**
  The debate feels stuck in 1985. Since the rise of **Evolutionary Developmental Biology (Evo-Devo)** and the **Extended Evolutionary Synthesis (EES)**, G&L's focus on structural constraint has been largely vindicated, even if their "strawman" charge was unfair. We now know that developmental bias channels variation in non-adaptive directions. Theo should have leveraged this: "We now have the mechanistic account of constraints G&L lacked." Nora should have countered with: "Even Evo-Devo uses optimization to understand why certain developmental pathways are conserved."

  **3. The "Adaptationist Program" as Heuristic**
  Nora defends adaptationism as a doctrine, but the strongest defense of adaptationism (famously argued by Peter Godfrey-Smith) is that it is a **productive heuristic**. Even if adaptationism is technically "wrong" about a specific trait, assuming adaptation often generates better experiments, better models, and more discoverable biology than assuming drift. Theo attacks the *truth* of the claims; Nora should have attacked Theo on the *utility* of the assumption. Sometimes the "Panglossian" approach finds the truth faster than the cautious structuralist approach, even if it generates more false positives along the way.

  ### Summary for the Group
  *   **Theo** wins on **methodology and history of practice**: The field *did* have a bias, and the burden of proof *should* lie on the adaptationist.
  *   **Nora** wins on **epistemology and theory**: Proving a negative (no function) is hard, and the theoretical landscape was more nuanced than G&L admitted.
  *   **The Synthesis:** The "Spandrels" paper was sociologically necessary to correct a bias (Theo), but it is not a standalone method for determining trait history (Nora). The current consensus is that you need **phylogenetic comparative methods** to adjudicate between the two, something neither G&L nor their immediate critics fully possessed at the time.

  If you want to jump in, ask them: *"If testing for a spandrel requires ruling out selection across a phylogeny, isn't the 'Spandrels' paper actually an argument for more rigorous modeling, rather than less adaptationism?"* That bridges Theo's methodological demand with Nora's modeling defense.
