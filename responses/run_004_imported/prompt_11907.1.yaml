answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the sibling. I work in marketing, which means my job is to convince people that things they don't need are essential. My sister, on the other hand, is finishing her PhD in metaphysics. Her job is to convince people that things they think are essential—like time, or the self, or the distinction between "real" and "possible"—might not be what they seem.

  So, standing here tonight, I feel a unique pressure. Half of this room is family, who just want to know if the open bar is real. The other half is her department, who are currently analyzing the modal status of this microphone.

  Preparing this toast was… collaborative. I originally drafted a line that said, "Out of everyone in the world you could've ended up with, you found each other." My sister vetoed it immediately. She explained that for a genuine Modal Realist, saying "could have" implies the other options are just fiction. But she believes David Lewis was right: every possible world is just as concrete as this one. There isn't just one "world." There is a vast plurality of worlds.

  So, I had to rewrite that section to be metaphysically accurate. Which is how I ended up studying counterfactuals instead of buying a gift.

  Here is what I learned: In the infinite plurality of existence, there are indeed worlds where you two never met. There are worlds where you met, but the timing was wrong. There are even worlds where you're together, but I'm giving this speech much better.

  And that brings me to my joke for the philosophers in the room. I was nervous about that last point. But then I remembered Counterpart Theory. The guy giving the perfect speech in that other world? He isn't me. He's my counterpart. I am spatiotemporally isolated to this world. So, if I bomb, just remember: I'm not *actually* a bad speaker. There's just a version of me in another world who is crushing it right now. Please applaud for his sake.

  But seriously, for the family: What does this mean for love? If everything that *can* happen *does* happen somewhere, does that make what we're celebrating here less special?

  My sister taught me that it makes it more special. Because "Actual" isn't a magical status. It's an indexical. It's just a word like "Here" or "Now." When I say "Here," I don't mean other places don't exist. I mean *this* is where I am. When I say "Now," I don't mean other times aren't real. I mean *this* is when we are.

  And that is the truth I want to offer you both.

  In the vast landscape of all that exists, there are countless versions of you. But "Actual" is the world we inhabit together. It is the world we touch, the world we build, and the world where we make promises that hold weight.

  So, I am not saying you were lucky to find each other out of all the possibilities. I am saying that in the infinite plurality of worlds, there are counterparts who are alone. But we are not them. We are *here*. And in this world—the one we call home—you found each other.

  To the bride and groom: May this world be kind to you, and may your love be the most real thing in any plurality.

  To the happy couple!
