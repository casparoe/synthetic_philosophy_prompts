      *   **Point 2: Ex Ante vs. Ex Post (The Repeated Game).** This is the strongest technical rebuttal. In policy (EA), we face distributions of risk. Saving the 5 every time maximizes *everyone's ex ante expected survival chance* over a lifetime. Taurek's case is a one-off.
      *   **Point 3: Impartiality Defined Differently.** Taurek = Equal chance for each *group/claimant*. EA = Equal weight for each *interest*. Show why EA thinks Taurek's fairness is actually unfair to the five.
      *   **Point 4: The "Paralyzing" Conclusion.** Address the user's suspicion. Yes, accepting Taurek paralyzes EA. So EA rejects Taurek's premise. It's not avoidance; it's a conscious rejection of the premise that "badness must be owned by a single subject."
      *   **Conclusion:** Summarize. The inference doesn't go through because EA operates on a different normative architecture (aggregative consequentialism) that views Taurek's constraint as a bug, not a feature.

