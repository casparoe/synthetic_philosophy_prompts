      *Plan:*
      1. Validate the tension (It is foundational).
      2. Distinguish Meta-ethics (EA accepts aggregation as normative).
      3. The Parfit/Paradox argument (Taurek violates separateness of persons by grouping the 5).
      4. Ex Ante/Policy distinction (EA is about systems, not one-off triage).
      5. Conclusion: It's a rejected premise, not an ignored argument.

  8.  **Final Review against constraints:**
