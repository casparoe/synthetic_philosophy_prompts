answer: |-
  Good morning.

  For thirty years, Marcus was my closest friend. He was also, to borrow a phrase he might have found slightly imprecise but acceptable, my statistical conscience.

  I stand here as a retired cell biologist. For thirty-five years, I ran a lab. I published papers. I generated p-values by the thousands. And I confess to you now, in this room of scientists and statisticians and family, that until very recently, I treated those p-values like magic spells. I chanted them to make the reviewers go away. I didn't ask what they meant philosophically. I just wanted to know if my protein bound to the receptor.

  Marcus knew what they meant. He knew exactly what they meant, and exactly what they did not mean.

  We met when I was a junior faculty member and he was the statistician assigned to help me salvage a grant proposal that was, in his words, "optimistic about variance." He saved the grant. He saved several of my papers from embarrassment. But more than that, he saved me from myself. He was the one who would call me at home, not to ask how my children were, though he always did that first, but to ask, "Are you sure that outlier belongs in the model?"

  He was a Neyman-Pearson man. For those of you in the back who don't speak statistics: that means he believed in the long run. He believed in procedures that, if repeated enough times, would control the rate of error. He believed in rigor as a form of honesty.

  In the last fifteen years of his life, the world of science changed. There was a crisis of confidence. People realized that too many published findings were false. There were calls for reform. Marcus welcomed those reforms. He wanted larger sample sizes. He wanted preregistration. He wanted registered reports. He fought for all of them.

  But he watched the conversation around these reforms with a specific, quiet irritation. He saw that as frequentist tools were sharpened, the narrative around them shifted. He saw fixes that were perfectly good frequentist practice being retold at conferences as vindications of Bayesian philosophy.

  "They kept the arithmetic and stole the credit," he would tell me over dinner.

  It mattered to him. Not because he wanted to win an argument, but because he believed in intellectual property rights over ideas. He believed you should call a tool by its name. Two of his own doctoral students became committed Bayesians during their time with him. It strained their relationships. He never said it aloud, but I know he regretted that distance far more than he ever regretted a lost debate. He loved the truth, but he loved his students more, and the tension between those two loves was a burden he carried quietly.

  So, when he got sick, he gave me instructions for this moment. He was half-joking, but with Marcus, the joke was usually the vehicle for the serious cargo. He told me I was not to let his funeral become the occasion on which "the Bayesians finally won." But he was equally firm: I was not to turn his eulogy into a defense of significance testing.

  He did not want his death to be a trophy for either side. He knew the debate is not settled. He knew that uncertainty is the only certainty we have.

  And that is what I want to speak to, for the family members here who might be wondering why we are talking about math at a memorial.

  Marcus's statistics were not just about numbers. They were about how to live with uncertainty without lying to yourself.

  In his view, you could never be certain about a single result. You could only be confident in the process that generated it. He applied that to his life. He knew he could not control every outcome—illness, loss, the drift of friendships. But he could control his integrity. He could control his rigor. He could ensure that when he spoke, he had done the work to minimize the error.

  To his family: You knew him as stubborn. I know that sometimes that stubbornness was hard. But I hope you can see it now as a form of kindness. In a world that wants quick answers, Marcus insisted on careful questions. In a world that rewards certainty, he stood guard over doubt. He was rigorous because he cared about the truth, and he cared about the truth because he cared about *you*. He didn't want you to be misled, by anyone, even by himself.

  For my colleagues in the sciences: We used his methods for decades. We built careers on the foundation he helped pour. As I sit in my philosophy reading group now, reading the texts I should have read thirty years ago, I realize that Marcus was right to be protective of his framework. But I also realize that his greatest lesson wasn't about priors or likelihood ratios.

  It was about the relationship between the tool and the user.

  I spent thirty-five years using his tools without understanding them. He spent thirty-five years understanding the tools so that I didn't have to worry about them. He absorbed the complexity so that we could get on with the work. That is the definition of a colleague. That is the definition of a friend.

  He told me once, regarding the replication crisis, "Error is inevitable. Dishonesty is optional."

  Marcus was not infallible. He made mistakes. He changed his mind. But he was never dishonest with the data, and he was never dishonest with his friends. He navigated a career of uncertainty with a moral compass that never wavered.

  I cannot resolve the debate between the frequentists and the Bayesians today. Marcus wouldn't let me, and frankly, the data isn't in yet. The long run hasn't happened. We are all still in the short run, dealing with single events, single losses, single goodbyes.

  In the short run, there are no confidence intervals. There is only this room. There is only the memory of a man who was rigorous, stubborn, and kind. There is only the gratitude of a biologist who finally learned to ask what the numbers meant, thanks to the friend who taught him to ask.

  Marcus controlled the error rate. He minimized the false positives. And in the end, I can say with high confidence, though no p-value can prove it: He was a good man.

  Thank you.
