answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Justice Task Force Board
  **FROM:** [Your Name], Technical Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Risk Assessment Tool Contract Renewal

  **Recommendation**
  I recommend the Board renew the vendor contract **conditional on the tool meeting Equal False Positive Rate (FPR) thresholds across racial groups**, rather than prioritizing calibration. This condition must be met within 90 days of renewal. If the vendor cannot adjust thresholds to achieve FPR parity without compromising public safety beyond agreed-upon limits, the Board should initiate a transition to a Structured Judicial Checklist.

  **The Statistical Constraint**
  As noted in our last meeting, we face a mathematical impossibility. When the underlying "base rates" of re-arrest differ between groups—in this case, due to documented disparities in policing intensity rather than actual criminal behavior—it is statistically impossible to satisfy both *Calibration* (a score of 7 means the same risk for everyone) and *Equal False Positive Rates* (low-risk individuals are wrongly flagged at the same rate) simultaneously. We must choose which metric governs.

  **Rationale: Prioritizing Liberty Over Predictive Consistency**
  In pretrial decisions, the primary harm we seek to minimize is the wrongful deprivation of liberty. A "False Positive" in this context is a defendant who would not have been re-arrested but is detained because the tool flagged them as high-risk.

  Because the cost of detention falls entirely on the defendant, while the cost of release risk is borne by the public, equity demands we equalize the burden of error. Currently, the tool's Calibration protects the *state's* interest (predicting aggregate risk accurately) while allowing a higher rate of wrongful detention for Black defendants. By conditioning renewal on Equal FPR, we prioritize the *individual's* right to liberty. We acknowledge that to achieve this, a risk score of "7" may represent different underlying probabilities for different groups. This is an uncomfortable trade-off, but it is necessary to prevent the algorithm from codifying historical policing biases into individual detention orders.

  **Engaging the Counter-Argument: The Case for Calibration**
  The strongest argument against this recommendation, advanced by the DA's office and vendor, is that Calibration ensures transparency and public safety. If scores are not calibrated, a judge cannot look at a "7" and know the specific probability of re-arrest. Critics argue this undermines judicial trust and could lead to releasing defendants who pose a genuine risk if thresholds are shifted to force parity.

  This concern is valid. Sacrificing calibration does mean the scores lose their universal "meaning." However, relying on Calibration as the primary fairness metric assumes the underlying data (arrests) is a neutral proxy for risk. We have already acknowledged it is not. A well-calibrated model built on biased policing data simply gives us a precise estimate of *who will get arrested*, not necessarily *who will re-offend*. Prioritizing FPR admits this limitation and ensures that even if the data is flawed, the *consequences* of that flaw (wrongful detention) are distributed equally.

  **Implementation and Timeline**
  1.  **Immediate (0-90 Days):** Vendor to adjust risk thresholds by group to equalize False Positive Rates. No individual to be detained solely based on a risk score during this adjustment period.
  2.  **Short-Term (6 Months):** Board to review detention rate disparities. If FPR parity results in a statistically significant increase in violent re-arrests (>5%), the Board will convene an emergency session.
  3.  **Long-Term (18 Months):** Full re-evaluation. If FPR parity cannot be sustained without unacceptable public safety trade-offs, the contract will not be renewed a second time, and the County will transition to a Structured Judicial Checklist that removes algorithmic scoring from individual bail decisions.

  **Conclusion**
  We cannot mathematically optimize our way out of systemic bias. However, we can choose which errors the system tolerates. By choosing Equal False Positive Rates, we choose to protect individual liberty equitably, even at the cost of predictive uniformity.
