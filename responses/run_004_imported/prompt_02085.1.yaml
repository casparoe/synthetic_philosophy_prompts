answer: |-
  This is a sharp, well-argued piece. It cuts through the "mechanism design" aspect of surrogate goals to the underlying game-theoretic constraints. You are correctly identifying that surrogate goals attempt to solve a *targeting* problem, but your objection shows that the *capacity* problem remains.

  Here is specific feedback on your three questions, followed by some suggestions for tightening the text.

  ### 1. Validity of the Argument (Paragraphs 3 & 4)
  The logic is valid, provided one accepts the premise that threat vectors are **non-rivalrous** for the threatener.

  *   **The Crux:** Your argument hinges on the claim that "tacking [the life-threat] onto the sphere-threat costs Bob nothing." In causal settings, this might be false (carrying out two distinct physical threats might require double the resources). However, in the **acausal/simulation context** you explicitly highlight, this premise is very strong. If Bob is threatening to run a simulation where Alice suffers, adding a platinum sphere to that simulation is computationally marginal.
  *   **Suggestion:** Make the "non-rivalrous threat capacity" assumption slightly more explicit in paragraph 3. You imply it with "costs Bob nothing," but stating it clearly preempts the reply that "threatening two things is harder than threatening one."
  *   **Validity Check:** The move from Para 3 to Para 4 is solid. If bundling is costless, the surrogate does not reduce the surface area of attack; it merely adds a new surface area while leaving the old one exposed. The conclusion that Alice must independently resist threats to her real values follows necessarily.

  ### 2. Does it Collapse into Known Objections?
  It does **not** fully collapse into the standard credibility or private-information objections, though it is adjacent to them.

  *   **Vs. Credibility:** The standard credibility objection is: "Bob won't believe Alice will actually pay for the sphere, so he won't threaten it." Your objection is: "Even if Bob believes Alice will pay for the sphere, he will *also* threaten her life because he can." You are attacking the **exclusivity** of the threat, not the **commitment** to the surrogate.
  *   **Vs. Private Information:** You explicitly bypass this by assuming legibility (acausal contexts).
  *   **Classification:** This is better described as a **"Threat Space Dimensionality"** objection. Surrogate goals try to project the negotiation onto a 1D line (the surrogate). You are pointing out that the threatener retains access to the n-dimensional space and has no incentive to restrict themselves to the 1D line.
  *   **Literature Connection:** This is closely related to objections in the **Safe Pareto Improvements (SPI)** literature (Conitzer, Oesterheld, et al.). In SPI, agents delegate to sub-agents with modified utilities to find safer equilibria. A known failure mode is if the opponent refuses to recognize the delegation and plays against the original utility function instead. Your "bundling" objection is essentially the threatener refusing to play the surrogate game and playing the original game *on top of* the surrogate game.

  ### 3. Is the Closing Claim Too Strong?
  The conclusion is *mostly* correct, but the phrase "comparatively little further protective work" might be slightly too dismissive of edge cases.

  *   **Nuance:** Surrogate goals might still provide value if there are **transaction costs** or **focal point effects**. Even if Bob *can* bundle, he might not *focus* on it if the surrogate becomes a massive Schelling point for negotiation. (e.g., "Everyone knows we negotiate over spheres now, it's weird to bring up lives.")
  *   **However:** In high-stakes acausal extortion between rational agents, focal points matter less than raw payoff structures.
  *   **Recommendation:** Soften the claim slightly to acknowledge that surrogates might reduce the *probability* of bundling (via focal points) even if they don't eliminate the *incentive*.
      *   *Current:* "...they're a refinement that only earns its keep once that problem is already solved, at which point they're doing comparatively little further protective work..."
      *   *Suggested:* "...they're a refinement that presupposes a baseline of blackmail resistance. They may shift the focal point of negotiation, but they cannot substitute for the capacity to ignore threats against one's core values."

  ### Specific Line Edits & Polish

  *   **Paragraph 1:** "downstream of worries about acausal and updateless bargaining..." -> Consider "motivated by worries about..." for flow.
  *   **Paragraph 2:** "His fix is to make the surrogate continuous and unbounded..." -> This is accurate to Baumann's later elaborations. Good.
  *   **Paragraph 3:** "And 'free to add' looks like the default rather than a corner case precisely in the mutual-simulation..." -> This is the strongest sentence in the piece. Keep it.
  *   **Paragraph 4:** "Recasting the whole thing in updateless terms... doesn't obviously help either" -> You might want to briefly specify *why*. (e.g., "because an updateless policy that pays for the sphere but dies for life is dominated by one that pays for neither, or pays for both, depending on Bob's response..."). Actually, your current phrasing is fine; adding more might clutter the shortform.
  *   **Title:** "Surrogate goals and the cost of bundling" is good. Maybe "Surrogate goals and the **impossibility** of costless bundling"? No, your point is that bundling *is* costless. "Surrogate goals and the **problem** of bundling" is safer.

  ### Final Verdict
  This is ready for shortform. It adds a specific, structural critique that isn't just a rehash of "commitment is hard." It clarifies that surrogate goals are a **routing mechanism**, not a **shield**, and if the attacker can flood all routes, the routing doesn't matter.

  **One final check:** Have you equivocated on "free"?
  You use "free" to mean "marginal cost to the threatener." In acausal bargaining, the cost is often compute or logical complexity. If threatening "Life + Sphere" requires a more complex logical proof than "Sphere," it's not strictly free. However, given that "Life" was the *original* threat, Bob already has the proof for that. Adding "Sphere" to the conjunction is logically trivial. So "free" holds up.

  **Go for it.** This is a valuable contribution to the thread.
