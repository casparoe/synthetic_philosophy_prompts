      *   No "it's complicated"? Yes.

  *(Self-Correction on the Verdict)*: Actually, the most robust historical position (championed by scholars like R.S. Westman and J.V. Field) is that Kepler's astrology *was* the laboratory for his astronomy. He couldn't have gotten to the laws of motion without the metaphysical commitment to harmony. So the "Integration" argument is not just defensible, it's historically superior. I will argue that the "Opportunist" view fails because it cannot explain the *content* of Kepler's reforms. If it were just for money, he would have stuck to traditional Ptolemaic astrology (which people paid for). Instead, he alienated clients by telling them their traditional charts were wrong. That proves sincerity. *This is the killer argument.*

