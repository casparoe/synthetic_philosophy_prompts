answer: |-
  You are not imagining the inconsistency. The nurse's intuition identifies a profound ethical contradiction that lies at the heart of the moral injury many healthcare workers sustained during the pandemic.

  To answer your specific question: **Yes, there is a genuine logical and ethical inconsistency in that combination.** While there are nuanced arguments regarding professional duty that attempt to bridge the gap, they collapse under the specific conditions you described (specifically the lack of adequate PPE and the threat of termination).

  Here is a breakdown of where the reasoning holds, where it breaks, and how you might frame this in your piece not just as institutional cynicism, but as a specific category error that inflicted harm.

  ### 1. The Ethical Categories: Obligation vs. Supererogation
  In moral philosophy, actions are generally divided into three categories:
  *   **Obligatory:** You must do it. If you don't, you are blameworthy (and potentially punishable).
  *   **Permissible:** You may do it or not; there is no moral weight either way.
  *   **Supererogatory:** It is good to do, but not required. If you do it, you are praiseworthy (a "hero"). If you don't, you are not blameworthy.

  The hospital's messaging tried to categorize the same act—showing up to work during a surge without adequate protection—as **both Obligatory and Supererogatory.**

  *   **The "Hero" Frame:** By using language like *sacrifice*, *heroism*, and *above and beyond*, administration framed the work as **supererogatory**. They were claiming moral credit for the staff's willingness to endure extraordinary risk.
  *   **The "Termination" Frame:** By punishing absence or refusal, administration framed the work as **obligatory**. They asserted that showing up was a baseline requirement of employment, omitting which warranted sanction.

  **The Breakdown:** An act cannot be logically supererogatory and obligatory for the same agent at the same time. If you *must* do it, you aren't a hero for doing it; you are merely compliant. If you are a *hero* for doing it, it implies you had the moral right to decline. By punishing the decline, the institution retroactively stripped the act of its heroic status, turning "sacrifice" into "compliance."

  ### 2. The Counter-Argument: Professional Duty
  You asked if there is a legitimate distinction regarding professional roles. Bioethicists have long debated the "duty to treat." The argument in favor of the hospital's stance usually rests on **Social Contract Theory**: Healthcare professionals enter a covenant with society wherein they accept certain risks in exchange for status, income, and the privilege of practicing. Therefore, showing up during a crisis is not "heroic"; it is simply the job.

  If this argument held true, the "Hero" language would merely be rhetorical fluff (morale boosting), while the "Termination" language would be the ethical reality.

  **Where this breaks down:**
  Even the strongest proponents of a "duty to treat" (such as the American Nurses Association or the AMA) agree that this duty is **not absolute**. It is contingent on **reciprocity**.
  *   **Reciprocity:** If the institution asks staff to assume risk, the institution must mitigate that risk to the greatest extent possible (providing PPE, training, staffing support).
  *   **Proportionality:** The risk assumed must be proportional to the benefit gained.

  The nurse you interviewed mentioned colleagues were punished for refusing to work **without adequate protective equipment.** This is the critical fracture point. Once PPE is inadequate, the risk shifts from an "occupational hazard" (which is part of the duty) to an "unnecessary sacrifice" (which is supererogatory).

  By punishing refusal in the face of inadequate safety measures, the hospital severed the reciprocal link. They demanded the *duty* without upholding their end of the *contract*.

  ### 3. The Mechanism of Harm: Moral Coercion
  The reason this specific inconsistency nags at the nurse—and why it is fertile ground for your story—is that it creates a psychological bind known as **moral coercion**.

  When an institution praises an act as voluntary courage while simultaneously making it mandatory, they invalidate the agency of the worker.
  *   If I choose to run into a burning building, I am a hero.
  *   If you push me into a burning building and tell me I'm a hero for not coming out, you are a coercer.

  This generates **moral injury** (distinct from burnout). Burnout is exhaustion; moral injury is the distress resulting from perpetrating, witnessing, or failing to prevent acts that transgress one's moral beliefs. In this case, the transgression is the lie itself: being told you are free while being held captive.

  The hospital wanted to have it both ways:
  1.  **Public Relations:** They needed the "Hero" narrative to garner public goodwill and donations.
  2.  **Operations:** They needed the "Duty" narrative to maintain staffing levels and avoid liability.

  ### 4. How to Frame This in Your Story
  You don't need to conclude that the messaging was merely "cynical" (which implies a conscious, evil intent). It is often more compelling to frame it as **institutional cognitive dissonance** that resulted in ethical violence.

  The administration likely *believed* both things simultaneously because they needed to.
  *   To the public: "Look at our heroes." (To inspire confidence).
  *   To the staff: "Show up or you're fired." (To ensure survival of the system).

  **The Narrative Hook:**
  The inconsistency you identified is the mechanism of the betrayal. The nurse isn't just tired; she is angry because the *meaning* of her endurance was stolen from her.
  *   If it was just her job, she wouldn't feel betrayed; she would just feel overworked.
  *   If it was truly voluntary heroism, she would feel proud.
  *   Because it was **mandatory heroism**, she feels used.

  ### Summary for your piece
  The reasoning breaks down at the point of **agency**. Heroism requires the possibility of refusal. By removing the possibility of refusal (via threat of termination), the hospital rendered the concept of heroism incoherent. They were not celebrating courage; they were enforcing compliance and decorating it with the language of virtue to make the enforcement palatable to the public.

  The nurse's lingering discomfort is the recognition that she was denied the moral ownership of her own survival. She was told she was choosing to sacrifice, when in reality, she was being conscripted. That is not just a mismatch; it is a fundamental ethical contradiction.
