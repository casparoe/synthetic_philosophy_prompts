          *   *NBS:* Might not give Union more if the *current* profitable options haven't changed shape locally.
          *   *KSBS:* Says Union should get more because the *total pie* potential grew, even if the immediate options look similar. It captures "bargaining power" defined by potential.
      *   **Why Monotonicity feels "Fairer" to some:**
          *   It respects *aspirations*.
