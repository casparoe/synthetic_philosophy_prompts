          *   KS = Global. Looks at the endpoints (the Ideal Point).
      *   **The Axiom Clash (IIA vs. Monotonicity):**
          *   Explain IIA simply: "If I take away options we weren't going to pick, nothing changes."
          *   Explain Monotonicity simply: "If my best-case scenario gets better, my guaranteed deal shouldn't get worse."
          *   *The Conflict:* Show how IIA forces you to ignore the "best-case scenario" if it's technically an "irrelevant alternative" to the local optimum.
      *   **The Geometric Intuition (The Box):**
