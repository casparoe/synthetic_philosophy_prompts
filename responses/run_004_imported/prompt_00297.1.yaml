answer: |-
  You have hit on exactly the first move that almost everyone makes when they encounter the Repugnant Conclusion. In fact, Derek Parfit himself discussed Average Utilitarianism in *Reasons and Persons* (1984) as a potential solution.

  The short answer is: **Population ethicists *did* adopt Average Utilitarianism, looked closely at it, and realized it leads to conclusions that are just as repugnant (if not more so) than the original problem.**

  In population ethics, there is no "free lunch." Every major theory violates at least one deeply held moral intuition. Here is why Average Utilitarianism (AU) was effectively rejected as a straightforward fix.

  ### 1. The "One Happy Person" Problem
  Under Total Utilitarianism, quantity can trump quality (the Repugnant Conclusion). Under Average Utilitarianism, quality trumps quantity to an absurd degree.

  Imagine two worlds:
  *   **World A:** 1 billion people, all with incredibly high welfare (100/100).
  *   **World B:** 1 person, with slightly higher welfare (101/100).

  Total Utilitarianism says World A is vastly better (100 billion total units vs. 101).
  Average Utilitarianism says **World B is better.**

  Most people intuitively feel that a billion happy people is better than a single ecstatic person. AU implies that adding 999,999,999 incredibly happy people to the world would be a *catastrophe* because they are slightly less happy than the one existing person, thereby dragging down the average.

  ### 2. The "Sadistic Conclusion" (Adding Good Lives is Bad)
  This is perhaps the strongest objection to AU.

  Imagine a population where everyone has a welfare level of 100.
  *   If you add a new person with a welfare level of 99 (a life that is still very much worth living, just slightly less good than the average), **Average Utilitarianism says you have made the world worse.**

  In fact, AU implies that as long as a new person is below the current average, creating them is morally wrong, even if their life is fantastic. This leads to a form of elitist anti-natalism: you are only allowed to have children if they are going to be happier than everyone currently alive.

  Even worse, consider the **"Sadistic Conclusion"** (formalized by Gustaf Arrhenius):
  Some versions of population ethics imply that it is better to add people with *negative* welfare (lives of suffering) than to add people with *positive* welfare, if the positive lives are low enough to drag down the average. AU avoids the worst of this, but it still creates a perverse incentive where adding happy people is treated as a moral cost.

  ### 3. The "Killing" Implication
  Average Utilitarianism struggles to distinguish between *bringing people into existence* and *keeping people alive*.

  If you have a population with an average welfare of 50, and there is a subgroup of people with welfare of 40, AU implies that **killing that subgroup would make the world better**, because it raises the average.

  Most ethicists want a theory that respects the rights of existing people. A theory that suggests murder can be a moral imperative because it improves the statistical average is usually a non-starter. (Proponents of AU try to patch this by saying AU only applies to *future* people, but that creates arbitrary distinctions between existing and non-existing beings.)

  ### 4. The "Mere Addition" Paradox
  Parfit showed that trying to move from Total to Average doesn't actually solve the logical inconsistency; it just shifts it.

  If you start with a happy population (A), and you add a new group of people who are happy but slightly less so (A+), Total Utilitarianism says A+ is better (more total happiness). Average Utilitarianism says A is better (higher average).

  But what if the new group is *very* happy, just not quite as happy as the first group? Intuitively, adding happy people shouldn't make a world worse. But AU says it does. This violates the "Mere Addition Principle": *Adding a group of people with lives worth living, without affecting anyone else, should not make the outcome worse.* AU violates this constantly.

  ### 5. Impossibility Theorems
  In the last 20 years, the field has moved from "finding the right theory" to "proving no perfect theory exists."

  Gustaf Arrhenius and others have developed **Impossibility Theorems** in population ethics. They have mathematically demonstrated that no theory can satisfy a small set of very basic, plausible conditions simultaneously (such as: "Don't prefer suffering to happiness," "Adding happy people isn't bad," "Avoid the Repugnant Conclusion," etc.).

  This is similar to Arrow's Impossibility Theorem in voting theory. It suggests the problem isn't that we haven't found the right formula yet; it's that our moral intuitions about population are logically inconsistent with each other.

  ### So, where is the field now?
  Since Average Utilitarianism is widely considered too flawed, ethicists have explored other avenues, none of which are perfect:

  1.  **Critical-Level Utilitarianism:** You only count welfare above a certain "critical level" (e.g., only count welfare points above 50). This avoids the Repugnant Conclusion (barely worth living lives add 0 value) and avoids the "One Happy Person" problem. *Problem:* It implies that adding a person with a life worth living (but below the critical level) makes the world worse.
  2.  **Person-Affecting Views:** "We should make people happy, not make happy people." We only have obligations to specific, identifiable people. *Problem:* This struggles with the Non-Identity Problem (e.g., climate change policies that change *who* is born in the future).
  3.  **Lexical Views:** Some lives are so good they cannot be outweighed by any number of barely-worth-living lives. *Problem:* This seems mathematically arbitrary and leads to its own "lexical" repugnance (e.g., saving one genius is worth any number of ordinary people).

  ### Summary
  You are right that Average Utilitarianism solves the Repugnant Conclusion. But it solves it by creating a **"Reverse Repugnant Conclusion."**

  *   **Total Utilitarianism:** Sacrifices quality for quantity (A world of billions suffering slightly is better than a world of a few happy).
  *   **Average Utilitarianism:** Sacrifices quantity for quality (A world of one ecstatic person is better than a world of billions very happy).

  Population ethicists treat this as unsolved because **every known solution requires biting a bullet that most people find morally unacceptable.** The "deep problem" isn't finding the math; it's that our moral intuitions about existence itself may be contradictory.
