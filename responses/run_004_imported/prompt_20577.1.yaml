prompt: |-
  My great-aunt Rosa died last week at eighty-nine, after a forty-year career as a set theorist. I'm a PhD student in logic myself, which is apparently why I got handed her eulogy: Rosa was a completely sincere believer in Gödel's own private argument for an afterlife -- not the ontological proof people trot out when they want to sound clever, but the weirder stuff he actually wrote to his mother and told Hao Wang, that a world built this rationally wouldn't bother growing a mind over a whole lifetime just to snuff it out for good. She'd bring this up completely straight-faced at Thanksgiving, unprompted. She left written instructions saying the eulogy has to use the real argument and can't soften into "she's in a better place" or "watching over us," which she considered exactly the kind of sloppy thinking the argument is supposed to rule out. Problem is, three or four of her old department colleagues are coming and will clock it immediately if I flatten the argument or get it wrong, but the other forty people are cousins who've never heard the word 'monad' and just want to feel okay by the time its over. Can you write the eulogy -- something that actually does real work with Gödel's argument for the people who'll catch it, while still landing as comfort for everyone else?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Great-Aunt Rosa, 89 years old, 40-year career as a set theorist.
      *   **Speaker:** Great-niece/nephew, PhD student in logic.
      *   **Key Constraint 1 (The Content):** Must use Gödel's *actual* private argument for an afterlife (rationality of the universe implies mind isn't created just to be destroyed), not the Ontological Proof. No clichés like "watching over us" or "better place."
      *   **Key Constraint 2 (The Audience):** Mixed audience.
          *   Group A: 3-4 old department colleagues (experts who will spot inaccuracies or softening).
          *   Group B: ~40 cousins/family (laypeople who need comfort and understanding).
      *   **Tone:** Sincere, intellectually honest, comforting but not saccharine, respectful of Rosa's specific wishes.

  2.  **Deconstruct Gödel's "Private" Argument:**
      *   *What is it?* It's not the formal Ontological Proof (which deals with "positive properties" and modal logic S5). It's more philosophical/metaphysical.
      *   *Core Premise:* The world is rationally constructed. There is a harmony between human reason and the structure of reality (otherwise, how could we understand it?).
      *   *The Teleological Angle:* Nature doesn't do things in vain. If the human mind develops over a lifetime, accumulating wisdom and capacity for understanding, it contradicts the rationality of the world for that capacity to be rendered null by death.
      *   *Key Quote/Sentiment:* "The world is rational." "It would be contrary to the rationality of the world if the mind, which has developed so much, should simply cease to exist." (Based on letters to his mother and conversations with Hao Wang).
      *   *Avoid:* Religious imagery, ghosts, clouds, harps, "looking down."

  3.  **Drafting Strategy - Bridging the Gap:**
      *   *For the Colleagues:* Use precise language. Acknowledge the distinction between the Ontological Proof and the teleological/rationality argument. Reference the "rationality of the world."
      *   *For the Family:* Translate "rationality of the world" into "meaning," "purpose," and "continuity." Frame the development of a life (like Rosa's) as something too substantial to just vanish.
      *   *For Rosa:* Honor her integrity. She hated sloppy thinking. The eulogy must be logically sound *as* a eulogy.

  4.  **Section-by-Section Outline:**
      *   **Opening:** Acknowledge the difficulty of the task. State the constraint (Rosa's instructions).
      *   **The Argument (The Core):** Explain Gödel's idea without jargon. Focus on the *waste* vs. *reason* aspect.
      *   **Applying to Rosa:** Connect the abstract argument to her specific life (40 years of set theory, curiosity, growth).
      *   **Comfort for the Family:** Reframe "afterlife" not as a place, but as the logical necessity of continuity for a mind like hers.
      *   **Closing:** A final nod to the colleagues (accuracy) and the family (love/loss).

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Too technical?* If I say "monad" or "modal logic," the cousins lose it.
      *   *Too vague?* If I say "she lives on in our hearts," the colleagues will roll their eyes and Rosa would haunt me.
      *   *Solution:* Use the metaphor of a "story" or a "proof." A proof isn't finished until the end. But even then, the truth remains. Actually, Gödel's argument is about *potential*. The mind grows; therefore, it must have somewhere to go.

  6.  **Drafting - Iteration 2 (Refining the Argument):**
      *   Gödel believed the world is rational.
      *   In a rational world, things aren't built for no reason.
      *   The human mind takes 80+ years to mature.
      *   To destroy it right when it's ready is irrational.
      *   Therefore, it continues.
      *   *Translation for family:* Her life wasn't an accident. Her wisdom wasn't for nothing.

  7.  **Writing the Eulogy (incorporating the constraints):**
      *   *Start:* Thank everyone. Mention the instructions immediately. It sets the tone.
      *   *Middle:* Explain the logic. "Rosa believed the universe makes sense." "She believed that you don't build a cathedral just to knock it down."
      *   *Specifics:* Mention her work. Set theory is about infinity. That's a nice bridge. She studied the infinite; she believed she was part of it.
      *   *The "Comfort":* The comfort isn't that she's watching us (she hated that). The comfort is that *she is okay*. Her consciousness isn't extinguished.
      *   *The "Nod":* To the colleagues: "As Hao Wang recorded..." or "As he wrote to his mother..." (Keep it subtle but accurate).
      *   *The "Hug":* To the family: "This means her love isn't gone."

  8.  **Refining the Tone:**
      *   Needs to be solemn but not morbid.
      *   Needs to sound like a logician speaking to family, not a priest.
      *   Avoid "faith." Use "conviction" or "conclusion."

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I mention "watching over us"? No.
      *   *Check:* Did I mention "better place"? No.
      *   *Check:* Is the Gödel argument accurate? Yes, it focuses on the teleological/rationality aspect (world is rational -> mind's development implies continuation) rather than the modal ontological proof.
      *   *Check:* Is it comforting? It frames death not as an end, but as a logical inconsistency that the universe wouldn't permit. That's a unique kind of comfort.

  10. **Final Review against constraints:**
      *   Rosa's instructions followed? Yes.
      *   Colleagues satisfied? (Argument is distinct from Ontological Proof).
      *   Family satisfied? (Language is accessible, emotional core is present).

  *(Self-Correction Note)*: Make sure not to get *too* dry. The emotional weight needs to come from the respect for her mind, not just the logic itself. The logic *is* the love language here.

  11. **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  Thank you all for coming.

  For those of you who know me, you know I'm following in my Great-Aunt Rosa's footsteps. I'm a PhD student in logic. And because of that, I was given a specific assignment for today.

  Rosa left written instructions for her eulogy. She was very clear about what she did *not* want. She didn't want to be told she is "in a better place." She didn't want to be described as "watching over us." She considered those phrases to be emotionally convenient but logically sloppy. She spent forty years as a set theorist. She cared about precision, even at the end.

  She asked me to explain, plainly, why she was not afraid of death. And to do that, I have to talk about Kurt Gödel.

  Most people who know Gödel know him for his Incompleteness Theorems, which changed mathematics forever. But later in his life, he wrote privately to his mother and spoke to his friend Hao Wang about something else. He had an argument for the afterlife. It wasn't the famous "Ontological Proof" you might read about in philosophy class. It was simpler, and in a way, more human.

  Gödel believed that the world is rationally constructed. He believed that reality is not a chaos, but a structure that makes sense. And if the world is rational, then it does not do things in vain.

  Think about how long it takes to build a human mind. It takes decades. We spend a lifetime learning, suffering, loving, and understanding. We accumulate wisdom. We develop the capacity to grasp complex truths. Rosa spent eighty-nine years refining her mind. She spent forty of those years thinking about infinity.

  Gödel's argument was this: It would be contradictory to the rationality of the world to build a machine as complex as the human mind, to let it grow and mature for a lifetime, only to snuff it out the moment it reaches its full capacity. In a rational universe, capacity implies use. If we have the ability to conceive of eternity, and the ability to grow without limit, it is irrational to assume that growth simply hits a wall and vanishes.

  Rosa believed that. She didn't believe it as a wish. She believed it as a conclusion.

  To her colleagues here: She held this conviction with the same rigor she applied to the Continuum Hypothesis. She knew the distinction between the teleological argument and the modal proof, and she chose this one because it respected the value of a life lived.

  To her cousins and family: I know this sounds abstract. But what it meant for Rosa, and what she hoped it might mean for you, is this: Her life was not an accident. Her love for you, her curiosity, and the wisdom she gained were not temporary glitches in a meaningless universe.

  She believed that because her mind mattered, it continues. Not as a ghost hovering in the room—we can agree that would be inefficient—but as a consciousness that has moved beyond the limitations of the body, just as a mathematician moves beyond simple arithmetic to higher calculus.

  She is not watching us. She is not gone. She is simply no longer constrained by the physics that bound the rest of us here.

  For me, the comfort isn't in imagining her on a cloud. The comfort is in the logic. If the universe is rational, then nothing of value is truly destroyed. The work she did, the love she gave, and the mind she built are consistent with a world that does not throw its masterpieces away.

  She trusted the rationality of the world. And if she was right, then she is exactly where she intended to be.

  Thank you.
