answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm a colleague of Warren's. For those of you who *do* know me, you're probably wondering if I ran this speech by him for peer review. I did not. I value my tenure too much.

  Looking around this room, I see a fascinating divide. On one side, we have Warren's family and the college administration. You know Warren as the man who corrects your grammar gently, who refuses to estimate arrival times, and who, when asked how he is, replies, "Better than yesterday, worse than tomorrow."

  On the other side, we have the philosophers of science. You know Warren as the man who spent forty years in the trenches of verisimilitude. You know that in 1974, when Tichý and Miller torpedoed Popper's definition of truthlikeness, most people swam for the shore. Warren just built a submarine. He spent the next four decades defending a Niiniluoto-ish similarity measure against language-dependence objections that would have made a lesser mind plead the fifth.

  Now, I have a job to do tonight. I need to honor Warren without triggering his allergy to finality. If I stand here and say, "Warren solved the problem of verisimilitude," two things will happen. First, the philosophers will spit out their wine. Second, Warren will stand up, clear his throat, and begin a forty-minute excursus on why "solved" is a theory-laden term that presupposes a limit point we cannot access.

  So, I need to find the right measure of praise. I need high truthlikeness.

  This brings me to the one joke I'm allowed to make. I've been thinking about how to explain Warren's career to the family members who aren't philosophers. The best I can do is this: Warren's entire life's work was dedicated to proving that there are infinite ways to be wrong, but some wrong answers are better than others.

  For example: If I say, "Warren is the greatest philosopher who ever lived," that is demonstrably false. If I say, "Warren is a incompetent hack," that is also false. But if I say, "Warren's specific brand of wrongness about scientific theories was significantly closer to the truth than anyone else's wrongness"... well, Warren might let me finish the sentence without interrupting to define "significantly."

  (Laughter)

  But in all seriousness, that is the affection we feel for him. In a world that loves binary answers—true or false, win or lose, retire or work—Warren taught us to love the distance between them.

  He taught us that progress isn't about planting a flag on the summit. It's about checking your altimeter, realizing you're still climbing, and arguing politely with the person next to you about the gradient.

  To the administrators here: You might wonder why you kept funding a man who would never claim he finished the job. It's because Warren understood that precision is a form of care. When he argued about truth-content versus falsity-content, he wasn't just splitting hairs. He was insisting that our descriptions of the world matter. That getting it *less wrong* is a moral imperative.

  He was allergic to the word "solved" not because he lacked confidence, but because he had too much integrity. He knew that a theory is a tool, not a revelation. And watching him work was like watching a master carpenter who refuses to use a nail when a dovetail joint is required, even if no one else will see the difference.

  So, as we raise a glass to Warren's retirement, I have to be careful. I cannot say this is the end of his work. Warren knows that retirement is just a change in boundary conditions. The problem of verisimilitude will remain. The language-dependence objections will remain. And hopefully, Warren's marginalia on the subject will remain, somewhere in a filing cabinet, waiting for the next graduate student brave enough to open it.

  I am not going to tell you the truth about Warren tonight. I don't have access to the whole truth. No one does. Not even him.

  But I will say this: Compared to the alternative—saying he was just a teacher, or just a writer, or just a colleague—this sentiment is closer to the truth. It has higher verisimilitude.

  Warren, you have spent forty years measuring the distance to the truth. Tonight, we aren't saying you arrived. We're just saying that for four decades, you were the best guide we had for the journey.

  To Warren. May your next theory be slightly less false than your last.

  Cheers.
