answer: |-
  Here is a structured explanation designed for your graduate seminar. It moves from the intuitive core of Chalmers's proposal to the technical application, and finally isolates the precise point of friction with Sider.

  ---

  ### Part 1: The Intuitive Core (The "Gut-Level" Idea)

  Start by telling your students to forget about quantifiers and joint-carving for a moment. Ask them to imagine a dispute between two people looking at a insect.

  *   **Person A:** "That is a spider."
  *   **Person B:** "No, it is not a spider; it is an arachnid."

  Suppose we investigate and find that Person A uses the word "spider" to mean *any eight-legged arthropod*, while Person B uses "spider" to mean *specifically the family Araneae* (excluding daddy longlegs, scorpions, etc.). They both agree on all the physical facts: they agree on how many legs it has, how it is segmented, its DNA, etc.

  **The "Different Meanings" Observation:**
  It is obvious they mean different things by "spider." But does that automatically make the dispute verbal? Not necessarily. Imagine a different case:
  *   **Person C:** "This water is safe to drink."
  *   **Person D:** "No, this water is not safe to drink."
  Even if C and D have slightly different thresholds in mind for "safe," there is still a substantive fact about the bacterial content of the water that they might disagree on. Merely noting that "safe" is vague doesn't dissolve the disagreement about the bacteria.

  **Chalmers's Stronger Claim:**
  Chalmers's test is not satisfied just by finding ambiguity. It is satisfied only if **clarifying the meanings eliminates the disagreement entirely.**

  In the insect case, once we clarify the meanings, Person A says, "Okay, in my sense, it's a spider," and Person B says, "Okay, in my sense, it's not." But crucially, they now agree on every *non-semantic* fact. There is no "leftover" fight about the world.

  **The Intuitive Test:**
  A dispute is verbal if and only if there is a way to translate both sides' claims into a **neutral vocabulary** that both sides accept, such that:
  1.  The translation preserves the meaning of their claims.
  2.  In that neutral vocabulary, the two sides **agree**.

  If you can do this, the fight was just about words. If you cannot do this (because even in neutral vocabulary they still contradict each other), the fight is about the world.

  ---

  ### Part 2: The Test Applied to Unrestricted Composition

  Now, walk the students through the formal apparatus using the composition case. This is Chalmers's "Canonical Resolution" test.

  **Step 1: Identify the Contested Sentence ($S$)**
  *   **Universalist:** "There exists a fusion of these scattered simples." ($S$)
  *   **Restrictivist:** "There does not exist a fusion of these scattered simples." ($\neg S$)

  **Step 2: Identify the Key Term ($T$)**
  *   The term in dispute is the existential quantifier ("exists") or the sortal ("object"/"fusion").

  **Step 3: Find a Canonical, Neutral Vocabulary ($V$)**
  *   We need a language that both sides accept as describing the world accurately, without presupposing the truth of Universalism or Restrictivism.
  *   Chalmers suggests a vocabulary of **simples and their arrangements**.
  *   Both sides agree there are simples. Both sides agree the simples are arranged in certain ways (e.g., "arranged tablewise," "arranged fusionwise").
  *   Crucially, the Restrictivist can say "Simples are arranged fusionwise" without admitting a *fusion* exists. The Universalist can say the same.

  **Step 4: Translate the Claims into $V$**
  *   **Universalist Translation:** "There are simples arranged fusionwise."
  *   **Restrictivist Translation:** "There are simples arranged fusionwise."

  **Step 5: Check for Residual Disagreement**
  *   Do the translated claims contradict? **No.** They are identical.
  *   Is there any other claim in $V$ they disagree on? **No.** They agree on the number of simples, their properties, and their spatial relations.

  **Conclusion of the Test:**
  Since the dispute vanishes when translated into the neutral vocabulary of "simples arranged X-wise," Chalmers diagnoses the dispute as **merely verbal**. The Universalist and Restrictivist are making the same claim about the arrangement of reality, but packaging it with different semantic rules for the word "exists."

  **Why this is stronger than Hirsch's Quantifier Variance:**
  Hirsch argues the quantifier *meaning* varies. Chalmers argues that *even if* we fix the meaning, if we can find a neutral vocabulary where the claims converge, the dispute is verbal. Chalmers provides a *criterion* for verbality that doesn't rely solely on the controversial thesis that quantifier meanings are flexible. It relies on the **eliminability** of the disagreement.

  ---

  ### Part 3: The Residual Disagreement (Hirsch vs. Sider via Chalmers)

  This is the section your students need to grasp most carefully. The common error is to think Sider simply denies the test works, or that he and Chalmers are talking past each other. The reality is more structural.

  **The Question:**
  Once Chalmers runs the test and declares the dispute verbal, where does Sider object?
  *   **Option A:** Does Sider say the test conditions are *not satisfied* (i.e., the translation fails)?
  *   **Option B:** Does Sider say the test conditions *are satisfied*, but the test is insufficient (i.e., the dispute relocates "one level up")?

  **The Answer:**
  Sider effectively argues for a version of **Option B**, but with a caveat that turns it into **Option A** at the fundamental level.

  **1. The "Level Up" Move (Option B):**
  Sider grants that in *ordinary English*, Chalmers's test might pass. He agrees that Universalists and Restrictivists agree on all the facts about "simples arranged tablewise." He might even grant that, *relative to ordinary language*, the dispute is verbal.
  *However*, Sider argues that metaphysics is not in the business of cataloging ordinary English usage. Metaphysics aims to describe the **fundamental structure of reality**.
  Sider relocates the substantive dispute to the level of **Ontologese** (the fundamental language). He argues:
  > "Even if the English dispute is verbal, the *metaphysical* dispute is about which quantifier carves at the joints. Is the universalist quantifier or the restrictivist quantifier the one that matches reality's structure?"

  For Sider, satisfying Chalmers's test in ordinary language does not dissolve the metaphysical problem; it merely pushes it back to the question of **which vocabulary is privileged.**

  **2. The Failure of Meaning Preservation (Option A):**
  However, to be precise about Chalmers's test: The test requires that the translation into neutral vocabulary **preserves the meaning** of the original claims.
  *   **Chalmers** assumes that "There exists a fusion" *just means* (or is exhausted by) "Simples are arranged fusionwise."
  *   **Sider** denies this. For Sider, "There exists a fusion" makes a claim about **fundamental ontology** that is *not* captured by talk of arrangements.
  *   Therefore, Sider argues that Chalmers's translation **fails the meaning preservation condition** for the metaphysician. If I am a metaphysician asking "Do composites *really* exist?", and you translate my question to "Are simples arranged composite-wise?", you have changed the subject. You have stripped out the ontological commitment.

  **The Precise Distinction for Students:**
  To convey this clearly to your seminar, use this distinction:

  *   **Chalmers (and Hirsch):** Think the "neutral vocabulary" (arrangements of simples) is **ontologically complete**. If you've described the arrangements, you've described all there is to describe. Therefore, the test is satisfied, and no substantive fact remains.
  *   **Sider:** Thinks the "neutral vocabulary" is **ontologically deficient**. It describes the *base* facts, but misses the *structural* facts (the joint-carving facts). Therefore, the test is **not satisfied** for the metaphysical dispute, because the translation loses the substantive content of the existential claim.

  **Summary of the Residual Disagreement:**
  The disagreement is not just about whether the quantifier varies (Hirsch) or is privileged (Sider). It is about **whether a dispute that is verbal in ordinary language can still be substantive in fundamental language.**
  *   **Chalmers:** If it's verbal (test passed), there is no further fundamental fact to be had. The "arrangement" facts are all the facts.
  *   **Sider:** Even if it's verbal in ordinary language, there is a further fundamental fact (about which quantifier is joint-carving). The test fails to capture *this* fact.

  So, Sider's objection is that Chalmers's test assumes **ontological deflationism** (that there are no further facts beyond the arrangements). Sider is an **ontological realist** about structure. He denies the test is satisfied *for the metaphysical question* because the neutral vocabulary cannot express the joint-carving quantifier without begging the question.

  ### Teaching Tip
  To ensure they get this, ask your students:
  *"If Chalmers is right that the dispute is verbal, is there any work left for the metaphysician to do?"*
  *   Chalmers says: **No.** Their job is conceptual clarification.
  *   Sider says: **Yes.** Their job is to find the joint-carving quantifier (Ontologese).
  The residual disagreement is about the **goal of metaphysics itself**, not just the semantics of "exists."
