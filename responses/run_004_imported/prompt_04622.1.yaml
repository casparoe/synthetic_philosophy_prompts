answer: |-
  A graduate student raises her hand during the final minutes of class.

  "Professor, I think I've found a counter-example to Fodor's nativism. I definitely *learned* the concept HYPOTHESIS in this seminar."

  The professor smiles. "Oh? How did you acquire it?"

  "Well," she says, "I observed various arguments, formed the hypothesis that 'Hypotheses are testable propositions,' and confirmed it against the evidence."

  The professor leans forward. "But to formulate that hypothesis, what vocabulary did you use?"

  "Well... I used the term 'hypothesis'."

  "Precisely," says the professor. "To test the hypothesis 'X is a hypothesis,' you must already possess the predicate HYPOTHESIS in your language of thought. Otherwise, you couldn't represent the content of the hypothesis to be tested."

  The student pauses. "So... I needed the concept to learn the concept?"

  "Exactly. Which means it wasn't learned. It was innate."

  The student sinks slightly in her chair. "Okay. So if HYPOTHESIS is innate, and DOORKNOB is innate... I didn't actually learn anything this semester."

  "Correct," says the professor. "You were merely waiting for my lectures to trigger the concepts you've had since birth."

  The student brightens. "So... does that mean I don't have to take the final exam?"

  The professor shakes his head. "No. You still need to trigger your innate concept of TUITION."
