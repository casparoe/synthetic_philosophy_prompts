answer: |-
  **Setting:** *A stone terrace overlooking a calm harbor. The sun is setting. ELARA leans against the balustrade; MARCUS sits at a small iron table, tapping a pen against a notebook.*

  **Marcus:** Look at the water, Elara. Calm now. But suppose I say, "There will be a naval skirmish in this bay tomorrow." Is that statement true or false right now?

  **Elara:** It is neither. It is indeterminate.

  **Marcus:** That is the Aristotelian retreat. But consider the fatalist's trap. If the statement is true, the battle must happen. If it is false, the battle cannot happen. In either case, your planning, your signaling, your admirals' choices—they are all theater. The future is a script already written.

  **Elara:** The trap only springs if you assume the statement *has* a truth value today. I deny that. The battle is a contingent event. It depends on free choices and chance winds. Until those causes converge, there is no fact of the matter. To call the proposition "true" now is to pretend the future exists as the past does. It doesn't.

  **Marcus:** But logic doesn't care about your metaphysics of time. The Law of Bivalence is a cornerstone of semantic coherence. A proposition divides reality. To say "It is not true" is to say "It is false." If you deny bivalence for future contingents, you fracture the correspondence between language and the world.

  **Elara:** I fracture nothing. I simply acknowledge that truth supervenes on being. There is no *being* regarding tomorrow's battle yet. Therefore, there is no truth.

  **Marcus:** You are conflating causal necessity with logical necessity. This is the fatalist's modal fallacy. Let $P$ be "There will be a battle." Let $T(P)$ mean "$P$ is true."
  The fatalist argues:
  1. Necessarily ($T(P) \rightarrow P$).
  2. $T(P)$.
  3. Therefore, Necessarily ($P$).

  That is invalid. The correct inference is merely that $P$ follows from $T(P)$. The truth of the proposition guarantees the event, yes, but it does not guarantee that the event is *necessary*. The truth could be contingent, just like the event.

  **Elara:** That is a sleight of hand, Marcus. You treat truth as a label we stick on a proposition without asking what anchors the label. If $T(P)$ holds *today*, what makes it hold? A truthmaker must exist. If the truthmaker exists now, then the grounds for the battle exist now. If the grounds exist now, the battle is fixed. You cannot have a "contingent truth" about the future that is grounded in the present without that present ground determining the future.

  **Marcus:** The truthmaker for a future contingent is simply the future event itself. Truth is timeless. When we say "$P$ is true today," we mean that the state of affairs described by $P$ will obtain. It doesn't require a *present* physical configuration that causally necessitates it. It just requires that, in the actual timeline, the battle occurs.

  **Elara:** "Actual timeline"? You speak as if there is only one road stretching out from here. I see a branching tree. On some branches, the battle happens; on others, it does not. If you say it is *true* now that it happens, you are claiming only one branch is real. You are a determinist in semantic clothing.

  **Marcus:** I am a realist in semantic clothing. But let's press your branching tree. You deny bivalence. You say $P$ is neither true nor false. Do you also deny the Law of Excluded Middle? Do you deny that "Either there will be a battle or there will not be a battle"?

  **Elara:** I accept the Excluded Middle as a logical law, but I distinguish it from Bivalence as a semantic rule. The disjunction "$P \lor \neg P$" is necessarily true because it covers all logical possibilities. However, that does not mean that *today* one of the disjuncts possesses the property of "truth." The disjunction is true because the possibilities are exhaustive, not because one is currently actualized.

  **Marcus:** That is a precarious tightrope. If "$P \lor \neg P$" is true, then in classical logic, the set of truth values for $\{P, \neg P\}$ must contain "True." If neither contains "True," the disjunction cannot be true. You are trying to have your cake and eat it too. You want to keep classical logic to avoid absurdity, but you want to reject the semantic values that make that logic function.

  **Elara:** I am adjusting the logic to fit the world, not the world to fit the logic. If classical logic demands that the future is settled, so much the worse for classical logic. I would rather adopt a three-valued logic or a supervaluationist semantics than accept that my choices are illusions. If I say "It is true now that I will drink tea tomorrow," I imply that something about me or the world *now* settles it. If nothing settles it, the statement is premature. It is not false; it is void.

  **Marcus:** "Void" is a dangerous word. If I bet you that there will be a battle, and you say the proposition is void, do I win the bet if the battle happens?

  **Elara:** You win the bet once the battle happens. But you did not win it yesterday.

  **Marcus:** But was my assertion yesterday correct?

  **Elara:** It was... vindicated. But it was not true.

  **Marcus:** You see the cost? You sever the link between assertion and truth. I assert $P$. $P$ happens. You say I was never "right," only "vindicated." This makes truth retrospective. But if truth is only retrospective, knowledge of the future is impossible. Not just practically, but in principle. God, if he exists, could not know the future on your view. He would have to wait, just like us.

  **Elara:** Perhaps He does. Or perhaps He sees all the branches without privileging one as "actual" until we walk it. Your view saves God's foreknowledge by sacrificing human freedom. You claim the modal fallacy saves you, but it doesn't address the ontological weight of truth. To say "It is true that $P$" is to say "Reality is such that $P$." If reality is such that $P$ *before* $P$ occurs, then reality is static.

  **Marcus:** Reality isn't static; propositions are abstract objects. They don't sit in time waiting to be filled. They describe time. If I say, "The sun rose yesterday," that is true now because of a past event. If I say, "The sun will rise tomorrow," that is true now because of a future event. Why is the direction of time relevant to the logic of truth?

  **Elara:** Because the past is fixed and the future is not. The past event *exists* as a memory or a trace. The future event *does not exist*. You are positing a fact that has no being. You are reifying the future.

  **Marcus:** And you are reifying "indeterminacy" as a third truth value. Look, Elara, the fatalist argument fails not because the propositions lack truth values, but because "Necessarily ($P \lor \neg P$)" does not imply "Necessarily $P$ or Necessarily $\neg P$." The disjunction is necessary; the disjuncts are contingent. I can accept that $P$ is true today, and still maintain that $P$ could have been false. The truth is contingent.

  **Elara:** But *how* is it true today? If it is contingent, then there is a possible world where it is false. If it is true in the actual world today, what distinguishes the actual world from the possible world where it is false, *at this moment*? There must be a difference in the present state of affairs. If there is no difference, the truth is ungrounded. If there is a difference, the future is determined by that difference.

  **Marcus:** The difference is not in the present physical state, but in the temporal location of the fact. You assume truth requires a *present* truthmaker. I argue truth requires *a* truthmaker, regardless of when it exists.

  **Elara:** Then you admit that the future fact exists.

  **Marcus:** I admit that the future fact *will* exist. And that suffices for the proposition to be true.

  **Elara:** And I say that suffices only for the proposition to be *knowable* later. To call it true now is to collapse the distinction between prophecy and description.

  **Marcus:** And to call it indeterminate now is to collapse the distinction between logic and metaphysics. You are letting your fear of fatalism dictate your semantics.

  **Elara:** And you are letting your love of bivalence dictate your ontology.

  **Marcus:** *(Smiles slightly)* It seems the sun has set. The day is gone. Is it now true or false that the sun set?

  **Elara:** True. Because it is settled.

  **Marcus:** And tomorrow?

  **Elara:** *(Turning away from the railing)* Tomorrow is not a sentence to be parsed, Marcus. It is a place we have yet to reach.

  **Marcus:** And logic is the map. If you refuse to mark the terrain because it might change, the map is useless.

  **Elara:** Better a blank map than one that shows only one road.

  *They stand in silence as the harbor lights flicker on, the question of tomorrow's battle hanging unsettled in the dark air.*
