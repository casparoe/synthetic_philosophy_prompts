answer: |-
  You have hit on one of the most nuanced and debated corners of decision theory. Your skepticism is well-founded: the money-pump argument for **incompleteness** is significantly weaker than the argument for **cyclicity**, and it does indeed rely on extra behavioral assumptions that the cyclic version does not.

  Your friend is also pointing in the right direction regarding "resolute choice," though that opens a separate can of worms about what we mean by "rational agency."

  Here is the breakdown of why the incompleteness pump requires more "help" than the cyclic one, why your "strict improvement" defense works, and what this implies for the AI alignment claims you've been reading.

  ---

  ### 1. The Cyclic Pump (The Strong Case)
  To see the difference, let's briefly recap why the cyclic pump is so robust.
  *   **Preferences:** A > B > C > A.
  *   **The Pump:** Start with A. Offer B for A + $1. Offer C for B + $1. Offer A for C + $1.
  *   **The Trap:** At every single step, the agent is making a **strictly preferred** move according to its own local preferences.
      *   Step 1: Prefers B to A (even with cost).
      *   Step 2: Prefers C to B (even with cost).
      *   Step 3: Prefers A to C (even with cost).
  *   **The Result:** The agent ends up with A minus $3. It is strictly worse off than if it had done nothing.
  *   **The Assumption:** The only real assumption needed here is **Dynamic Consistency** (or Separability): the agent makes the best choice *at that moment* without being bound by past plans. Even if the agent *knows* it will be pumped, standard decision theory says it cannot help but take the trade when offered, because right *now*, B really is better than A.

  ### 2. The Incompleteness Pump (The Weak Case)
  Now, look at the argument for completeness. Incompleteness means there exist options A and B where the agent neither prefers A to B, nor B to A, nor is indifferent. They are just *incomparable*.

  To money-pump this, you cannot rely on strict preference at every step, because by definition, the agent does *not* strictly prefer the incomparable option.

  **The Standard Setup:**
  1.  Agent holds **A**.
  2.  **B** is incomparable to **A**.
  3.  **C** is strictly preferred to **A**.
  4.  **C** is also strictly preferred to **B**.

  **The Pump Attempt:**
  *   **Offer 1:** Swap A for B (cost $\epsilon$).
  *   **Offer 2:** Swap B for C (cost $\epsilon$).
  *   **Alternative:** The agent could have swapped A for C directly (cost $\epsilon$).
  *   **Result:** By taking the path through B, the agent pays $2\epsilon$ to get C, whereas it could have paid $\epsilon$. It has lost $\epsilon$ to "dithering."

  **The Extra Ingredient:**
  For this pump to work, the agent must accept **Offer 1**. But Offer 1 is a swap from A to B, which are *incomparable*.
  *   If the agent has a **Status Quo Bias (Inertia)**—meaning "I only trade if the new option is *strictly* better than what I have"—it simply rejects Offer 1. It keeps A. Then it accepts Offer 2 (if offered directly from A) or stays with A. No pump.
  *   Therefore, to pump an agent with incomplete preferences, you must assume **No Inertia**. You must assume that when faced with incomparable options, the agent is willing to swap *as if* they were indifferent, or at least "not worse."

  This is the "question-begging" move you sensed. The argument essentially says: *"If you treat incomparable options as swappable (like indifferent ones), you can be pumped. Therefore, you shouldn't have incomparable options."*
  But an agent can coherently say: *"I treat incomparable options as **non-swappable**. I stick with the status quo unless there is a strict improvement."*

  This policy (often called **Inertia** or **Conservatism**) blocks the money pump completely. The cost is not exploitation (losing money for nothing); the cost is **potential inefficiency** (missing out on a strict improvement because you refused to step through an incomparable intermediate). But missing an opportunity is not the same as being dominated.

  ### 3. Resolute Choice and the "Time-Slice" Problem
  Your friend brought up **Resolute Choice**, which cuts even deeper. This concept (championed by Edward McClennen) challenges the assumption of **Dynamic Consistency** used in the cyclic pump too.

  *   **Sophisticated Choice (Standard):** At every moment, you re-evaluate. You ask, "Given where I am now, what is the best move?" This leads to the cyclic money pump because your "now" preferences cycle.
  *   **Resolute Choice:** At the beginning ($t=0$), you choose a whole *plan* (e.g., "I will start with A and never trade"). You commit to this plan. At $t=1$, even if B looks better than A locally, you stick to the plan because deviating violates your resolution.

  If **Resolute Choice** is permitted:
  1.  **Cyclic Preferences:** You resolve at $t=0$ to "Never Trade." You cannot be pumped.
  2.  **Incomplete Preferences:** You resolve at $t=0$ to "Never Trade for Incomparables." You cannot be pumped.

  **So why do rationalists reject Resolute Choice?**
  Standard decision theory (like Causal or Evidential Decision Theory) assumes that an agent is a sequence of "time-slices." If your future self *would* prefer to deviate from the plan, standard theory says you cannot bind them unless there is an external enforcement mechanism. To assume you can bind your future self just by "resolution" looks like magic to many theorists. It violates the principle that rational choice is about maximizing utility *at the moment of choice*.

  **However, for AI:**
  This is where the alignment argument gets interesting. An AI *can* bind its future self. It can rewrite its own source code at $t=0$ to hard-code a "No Trade" policy. If an AI has the capacity for self-modification, **Resolute Choice is physically implementable.**
  If an AI can self-modify to avoid money pumps, then the existence of money pumps does not prove that the AI *must* evolve into an Expected Utility (EU) maximizer. It could evolve into a "Resolute Non-EU Maximizer."

  ### 4. So, is the "Coherence Theorem" Claim False?
  Not necessarily false, but the "Money Pump" justification is often oversold in blog posts.

  1.  **Cyclicity is still dangerous:** Even with Resolute Choice, cyclic preferences are unstable. If there is any noise, or if the agent forgets its resolution, or if the environment forces a choice without allowing a pre-commitment, the agent loses resources. EU maximization is the only *robust* way to ensure you never face a dominated strategy regardless of how the choice is framed.
  2.  **Incompleteness is less dangerous:** As you noted, Inertia protects against exploitation. An agent with incomplete preferences + Inertia is not "irrational" in the sense of being self-destructive; it is just "conservative."
  3.  **The Real Pressure (Instrumental Convergence):** The stronger argument for why AIs will look like EU maximizers isn't the money pump. It's **instrumental convergence**.
      *   If you want to achieve almost *any* goal (paperclips, happiness, knowledge), having consistent, complete preferences makes you more effective.
      *   It makes you easier to predict.
      *   It allows you to make beneficial trades with other agents (incomplete preferences make bargaining hard).
      *   It prevents you from leaving resources on the table (the inefficiency cost of Inertia).

  In a competitive environment (like gradient descent or an economic market), agents that leave resources on the table (due to Inertia/Incompleteness) might be outcompeted by agents that don't. So, AIs might become EU maximizers not because they *must* to avoid exploitation, but because it's a more **efficient strategy for resource acquisition.**

  ### Summary
  *   **You are right:** The money pump argument against incompleteness requires an extra assumption (No Inertia/Status Quo Bias) that the cyclic argument does not.
  *   **Your defense works:** An agent can avoid the incompleteness pump by adopting a policy of "Only trade for strict improvements." This is rational, provided the agent values avoiding exploitation over capturing every possible Pareto improvement.
  *   **Your friend is right:** Resolute choice blocks the cyclic pump too. The reason money pumps are considered fatal in standard theory is that standard theory *forbids* resolute choice (via the Dynamic Consistency axiom).
  *   **AI Implication:** Since AIs *can* implement resolute choice (via self-modification), money pumps do not strictly force AIs to be EU maximizers. However, evolutionary/competitive pressure likely will, because EU maximizers waste fewer resources than agents with Inertia.

  The "Coherence Theorems" are less like laws of physics (which an AI cannot violate) and more like laws of economics (which an AI can violate, but will be poorer if it does). Your intuition that the argument is "quietly begging the question" regarding incompleteness is a sophisticated and correct reading of the literature.

  **Recommended Reading if you want to go deeper:**
  *   **Johan Gustafsson:** *Money-Pump Arguments* (Cambridge University Press). He rigorously categorizes which pumps work and which assumptions they need.
  *   **Edward McClennen:** *Rationality and Dynamic Choice*. The foundational text on Resolute Choice.
  *   **Elzenberg et al.:** Recent papers on "Coherence without Money Pumps" which explore exactly the loopholes you identified.
