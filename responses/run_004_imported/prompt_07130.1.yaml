answer: |-
  DR. BOONE: You heard the criteria. Twelve months minimum. Intense yearning. Functional impairment. It's a failure of the attachment system to reset. In biostatistical terms, the grief-processing mechanism is functioning below the efficient range for the species. It's designed to signal loss and then disengage to permit renewed investment in survival and reproduction. When it doesn't, that's a factual dysfunction, not a moral judgment.

  DR. NORD: But look at the exclusion clause, Boone. The DSM explicitly says the reaction must exceed expected social, cultural, or religious norms. If a value-free biological fact were at stake, why would you need to consult the local priest before measuring the pathology? You're smuggling normativism into the engine room. You're admitting that what counts as "broken" depends on what counts as "appropriate," and appropriateness is a value.

  DR. BOONE: It's not a value; it's a control variable. We're trying to isolate the internal mechanism from external conditioning. If a culture rituals grief for three years, the mechanism isn't failing; it's being instructed. The dysfunction is only present when the internal capacity to regulate emotion is subnormal relative to the design, not when it's obeying a script.

  DR. NORD: That distinction collapses under demographic pressure. Suppose a pandemic wipes out a generation. In that cohort, prolonged grief isn't an exception; it's the statistical norm. The reference class shifts. Under your biostatistical theory, if everyone's grief-processing mechanism is stuck at year two, then year-two grief is normal function for that class. You'd have to say a devastated community is mentally healthy because they're all equally broken.

  DR. BOONE: We define the reference class by age and sex, not by trauma exposure. Otherwise, you lose the ability to identify pathology entirely. If a virus destroys everyone's lungs, breathing is still impaired relative to the species design, even if it's statistically average for the infected. The design is fixed by evolution, not by the current population mean.

  DR. NORD: But evolution doesn't hand us a manual for grief. It hands us plasticity. Canguilhem argued that health isn't static normality; it's the ability to establish new norms in response to crisis. If a community mourns forever because the loss is permanent, that might be a healthy adaptation to an abnormal world. Your "design" is too rigid. It pathologizes survival strategies that don't fit a reproductive timeline.

  DR. BOONE: Survival strategies that prevent eating, sleeping, or working aren't adaptations; they're terminal errors. Let's flip your objection. Consider a monastic order where eternal mourning for a founder is culturally mandated. The mourners cannot work, they neglect hygiene, they isolate completely. By your normativist account, if this achieves their "vital goals"—sanctity, fidelity—is it health?

  DR. NORD: If the goal is sanctity, and the mourning achieves it, then within that form of life, it is health. Health is the ability to achieve vital goals. If the community validates the goal, the individual isn't suffering a loss of welfare; they're fulfilling a purpose.

  DR. BOONE: They're dying. Their immune systems are crashing. Their reproductive capacity is zero. You're saying biological collapse is health because a community signed off on it? That reveals the flaw in grounding disease in goals. Goals can be suicidal. Disease must be grounded in the substrate that allows goals to exist at all. If the organism fails to maintain homeostasis, it doesn't matter what culture says.

  DR. NORD: But medicine isn't biology. It's a practice aimed at human flourishing, not just metabolic continuity. If I withhold the diagnosis because the community honors the grief, I respect their autonomy. If I impose the diagnosis because their biology is stressed, I'm saying survival trumps meaning. That's a value judgment, Boone. You're privileging biological longevity over spiritual integrity.

  DR. BOONE: I'm privileging the condition of possibility for any integrity. You can't pursue vital goals if you're dead. The cultural clause in the DSM tries to hide this, but the impairment criterion gives it away. You can't work, you can't sleep. Those are functional failures, not cultural ones. You're forced to admit there's a community-independent standard of functioning lurking in your theory.

  DR. NORD: Impairment is only meaningful relative to what one is impaired *from*. If I'm impaired from working a capitalist job because I'm mourning, is that a disorder, or a conflict between my goals and the economy? You want to say the grief is the disease. I say the grief is the response, and the disease is the inability to navigate the world *as it is now*. But if the world demands I stop loving the dead to function, maybe the world is the pathology.

  DR. BOONE: That's poetry, not medicine. We treat the patient in front of us, not the socioeconomic structure. If the mechanism is stuck and causing harm, we fix the mechanism. The cultural clause is just there to prevent us from diagnosing people who aren't actually harmed.

  DR. NORD: But harm is normative. You keep trying to hide behind statistics, but every time you define the reference class or exclude the cultural context, you're making a choice about what kind of life counts as normal. You want PGD to be a fact like a fracture. But grief isn't bone. It's meaning. And you can't measure meaning without asking what matters.

  DR. BOONE: And you can't treat meaning if the brain is too exhausted to generate it. We're circling. You think the diagnosis is too cultural; I think your exemption is too dangerous.

  DR. NORD: And you think survival is the baseline; I think it's just one variable among many. Until you can explain why the monastic mourner is sick without referencing a value on longevity, you're still in my territory.

  DR. BOONE: And until you can explain why the war survivor isn't sick without referencing statistics, you're still in mine.
