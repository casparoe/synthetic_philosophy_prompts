  Actually, Cohen's point is that Dogmatism *entails* the gauge bootstrapping works (or relevantly similar). So Elena should probably argue that our intuition that the gauge bootstrapping is bad is the error, OR that perception is special. The prompt asks to explore the disanalogies. I will have Elena defend the idea that perceptual seemings are distinctive sources of justification in a way gauge readings are not, thus blocking the analogy, while maintaining that *within* perception, the bootstrapping is valid. Marcus will press that this distinction is ad hoc.

