answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name], [Grandma's Name]'s grandchild.

  My grandmother was a woman who valued precision. She was an actuary by trade, a skeptic by nature, and she spent a lifetime calculating risk, probability, and value. But if you knew her well, you knew she had a soft spot for a Cambridge philosopher named Frank Ramsey. Ramsey died in 1930 at the age of twenty-six, having done enough work in logic and economics to last three lifetimes. Grandma found his writing in the seventies, and it became the backbone of how she saw the world.

  She asked me to make sure we didn't fill this hour with things she didn't believe. She was a proud atheist. She didn't believe she would be watching over us from a cloud, and she didn't believe in a better place. But she was equally firm that we shouldn't swing the other way, either. She hated the idea that because the universe is vast, we are insignificant. She hated the notion that we are just specks on a speck in an indifferent void.

  She built her outlook on a single image from Ramsey's *Epilogue*. He wrote that we often feel small because we imagine the universe drawn to scale, where the stars are massive and we are microscopic. But Ramsey argued that the universe isn't drawn to scale; it's drawn in perspective. As he put it, "The stars are no bigger than threepenny bits."

  Physically, we know the stars are enormous. But in terms of meaning, in terms of what matters to a human life, they are small coins compared to the people standing right in front of us. Grandma lived by that. She didn't need the cosmos to validate her life; she found her validation in the immediate perspective of her family, her friends, and her work. She knew that grief feels huge not because the universe is unfair, but because, in our perspective, the loss is central. And that is allowed.

  She also, I should add, had a very specific sense of humor. As an actuary, she always found it hilarious that Ramsey wrote about calculating the "present value at compound discount." She'd also point out, with a wink, that Ramsey later called discounting future people's welfare "ethically indefensible," which she thought was the most Ramsey thing about Ramsey.

  But that contradiction brings me to what I think she would want us to take from today. Ramsey believed that while we shouldn't pretend to be cosmic guardians, we have a profound duty to the people and the future within our reach.

  Grandma didn't believe she was going anywhere. But she believed that what she built here remains. In the map of the universe, she was small. But in the map of our lives—the one drawn in perspective, the one that actually guides us—she was enormous. She is not distant. She is right here, in the way we treat each other, in the standards she set, and in the love she insisted was the only thing that makes the scale of the universe irrelevant.

  We will miss her terribly. But if we look at the world the way she taught us to, we know that her absence doesn't shrink her presence. The stars may be huge, but they are cold. She was close, and she was warm. And that is what counts.

  Thank you.
