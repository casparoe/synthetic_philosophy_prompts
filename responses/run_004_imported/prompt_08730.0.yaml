  4.  **Address the Specific Questions:**

      *   *Can Priyanka's Universality and Dev's Unfalsifiability both be right?*
          *   Yes. Priyanka describes the *mechanism* of Tolstoy's exclusion (universality is a precondition for true infection in the late Tolstoyan view). Dev describes the *epistemological consequence* (if the theorist defines the audience's reaction as invalid, the theory is insulated). They are describing the same feature from inside and outside.

      *   *Is there a Way Out?*
