answer: |-
  This is one of the most uncomfortable and consequential questions in the history of analytic philosophy. To argue the case you're asking for—to assert a substantive link between Frege's anti-psychologism and his authoritarian politics rather than dismissing it as biographical trivia—we have to move beyond the idea that his logic *caused* his fascism. That is too simplistic. Instead, the argument must be that Frege's metaphysics and his politics spring from the same foundational intuition about **order, authority, and the contempt for the subjective.**

  The strongest case for continuity rests on the idea that Frege's "Third Realm" is not merely a storage locker for propositions, but a metaphysical justification for hierarchy. It posits a reality where Truth is objective, unyielding, and independent of human consensus. If you build a philosophical system on the bedrock that truth is something to be *obeyed* rather than *negotiated*, it is a very short step to a political system where the state is something to be *obeyed* rather than *voted on.*

  Here is the argument for the substantive link between the *Begriffsschrift* and the diary.

  ### 1. The Metaphysics of Authority: Law Without a Lawgiver
  Frege's anti-psychologism was a crusade against the idea that logic is a description of how humans *happen* to think. For Frege, logical laws are not empirical generalizations; they are normative laws of truth. They hold regardless of whether anyone believes them.

  In his 1918 paper "Der Gedanke" (The Thought), he posits the "Third Realm" (*drittes Reich*) to house these objective thoughts. This realm is distinct from the external physical world (Realm 1) and the internal world of mental representations (Realm 2). Crucially, the Third Realm is a realm of **absolute authority**. A thought in the Third Realm does not care about your feelings, your culture, or your vote. It simply *is*.

  The link to his politics is structural. Frege's disdain for the Weimar Republic mirrors his disdain for psychologism. Weimar democracy was based on the aggregation of subjective wills (voting, parliamentary debate, compromise). To Frege, this looked like the "Realm 2" messiness invading the "Realm 3" of governance. Just as truth cannot be established by a majority vote (a million people believing $2+2=5$ doesn't make it true), a state should not be run by the aggregation of subjective opinions.

  Therefore, the "strongman" he calls for in the diary is the political analogue of the Logical Law. Just as the mind must submit to the objective laws of logic to think correctly, the populace must submit to the objective authority of the Leader to govern correctly. In both cases, legitimacy comes from above (from Objective Truth or the Monarch), not from below (from Subjective Consensus). The "Third Realm" provides the metaphysical template for a society where authority is transcendent and unquestionable.

  ### 2. Purity, Contamination, and the "Alien"
  Frege's entire career was an exercise in purification. He sought to purge logic of the ambiguities of natural language. He invented a formal notation (*Begriffsschrift*) specifically because German (and all human languages) were too contaminated by psychology, history, and imprecision to carry the weight of pure thought.

  This philosophical drive for purity has a dark political shadow. If you view the medium of public discourse (language/culture) as inherently contaminated by subjective "noise," you begin to look for agents of that contamination. In Frege's diary, the Jews are cast precisely in this role: they are depicted as a rootless, internationalist element that undermines the "purity" and "cohesion" of the German state.

  The connection here is the intolerance of ambiguity. In Frege's logic, a proposition must be True or False; there is no third value (in his system). In his politics, you are either loyal to the objective order of the nation or you are an alien element dissolving it. The rigorous exclusion required to maintain the integrity of the "Third Realm" of logic maps onto the rigorous exclusion required to maintain the integrity of the *Volk*. The philosophical insistence that truth must be protected from the "psychological" (the human, the variable) bleeds into the political insistence that the state must be protected from the "alien" (the Jew, the democrat).

  ### 3. The Heidegger Objection: Why This Is Different
  The obvious counter-argument, as you noted, is the Heidegger defense. Martin Heidegger joined the Nazi party, but few argue that *Being and Time* logically entails Nazism. His ontology describes the structure of existence; one can accept his analysis of *Dasein* without accepting his politics. Why should Frege be different?

  The difference lies in the **normative** nature of Frege's project versus the **descriptive** nature of Heidegger's.

  Heidegger was describing how humans exist. Frege was prescribing how humans *ought* to think. Frege's philosophy is inherently legislative. He is laying down laws. He is telling us that our natural way of thinking is flawed and must be disciplined by an external, objective standard. This is a philosophy of **discipline and submission to law.**

  When Heidegger talks about "authenticity," it is an individualistic, internal struggle. When Frege talks about "Thought," it is a submission to an external, objective hierarchy. It is much easier to slide from "You must submit your mind to the Objective Law of Logic" to "You must submit your body to the Objective Law of the State" than it is to slide from "You must face your own mortality" to "You must submit to the State."

  Frege's philosophy creates a temperament that values **Correctness over Consensus.** In a democracy, legitimacy is derived from the process (consensus). In Frege's logic (and his ideal politics), legitimacy is derived from the Result (Correctness/Order). If you believe that there is One Right Way to think, which exists independently of human agreement, you are philosophically primed to believe there is One Right Way to rule, which exists independently of human voting.

  ### 4. The "Third Realm" as Esoteric Hierarchy
  Finally, we must address the term *drittes Reich* itself. While it is true that the phrase did not exclusively mean "Nazi Germany" in 1918, it was already loaded with conservative, mystical, and hierarchical connotations in German culture (referencing Joachim of Fiore's three ages, or Hegel's stages of history).

  By placing "Thoughts" in a "Third Realm," Frege is elevating them above the common, physical world of men. Access to this realm is not democratic. It requires training, rigor, and the suppression of one's own psychology. It is an aristocratic realm. Only the logically disciplined can grasp the Thoughts.

  This creates an epistemic aristocracy. If only a few can access the Third Realm of Truth, why should those few not rule the First Realm of Politics? The diary's contempt for the "masses" is not just racial; it is epistemological. The masses live in Realm 2 (subjective ideas, feelings, opinions). The Logician (and the Strongman) accesses Realm 3 (Objective Truth/Order). The political hierarchy is justified by the metaphysical hierarchy.

  ### Conclusion
  To separate Frege's logic from his politics is to perform a surgery that removes the heart of his philosophical motivation. Frege did not invent modern logic merely as a tool; he did it to secure a foundation for truth that was immune to human weakness. That same fear of human weakness—the fear that without rigid, external constraints, things dissolve into chaos—is what drove him to anti-democratic politics.

  The "Third Realm" is the blueprint. It is a world where Truth is King, and humans are merely its subjects. When Frege looked at the Weimar Republic, he didn't see freedom; he saw the "psychological" realm trying to rule the "logical" realm. He wanted a politics that matched his metaphysics: rigid, objective, hierarchical, and purged of the contaminating influence of subjective human will. The diary isn't a contradiction of his philosophy; it is the political manifestation of it.
