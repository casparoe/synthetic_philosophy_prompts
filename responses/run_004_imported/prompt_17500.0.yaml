      *   *Cons:* Excludes non-drinkers, risks addiction issues, creates liability/safety concerns, encourages the idea that sober work isn't "real," leads to regret/shame (as seen with the older guy), blurs professional/personal boundaries.
      *   *Verdict:* It's a fragile foundation for a long-term tradition. Relying on substance-induced vulnerability is unsustainable and potentially harmful.

