      *   **The Youngest Member:** "Keeping pace" suggests performative drinking, insecurity, or a lack of boundaries. It's different from the older guy because the older guy *broke*, whereas the younger one is *competing* or *mimicking*. This signals potential alcohol issues or peer pressure dynamics.
      *   **The Pro-Drunk Writer:** Their logic is "alcohol = truth." This is a romanticized, dangerous trope. It implies sober interactions are fake ("the act"). This devalues the work done during the rest of the week.
      *   **The User (Organizer):** Has a gut feeling ("rubbed me the wrong way"). This is crucial. As the organizer, safety and sustainability are key.

  3.  **Evaluate the "Drunk = Truth" Argument:**
