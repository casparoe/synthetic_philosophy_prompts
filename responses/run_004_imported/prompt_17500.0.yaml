      *   **Key Incident:**
          *   *Older Guy (50s):* Got drunk, cried about impostor syndrome, then gave incredible feedback. Next morning: mortified, dissociated ("that wasn't really me").
          *   *Youngest Member (24):* Tried to keep pace drink-for-drink. User felt this was "wrong" but can't articulate why.
