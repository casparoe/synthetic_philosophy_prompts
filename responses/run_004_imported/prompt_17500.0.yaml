          *   Younger Guy: Performative drinking is a red flag for future alcohol problems or boundary issues.
      *   **Propose a Middle Ground/Solution:** Don't ban wine, but don't *center* the event on getting drunk. Shift the focus from "getting loose" to "celebrating."
