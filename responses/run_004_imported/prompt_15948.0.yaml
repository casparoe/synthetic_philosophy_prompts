answer: |-
  The fluorescent lights of Building 4 hummed, a low-frequency vibration that Art Vance felt in his teeth more than he heard. It was 8:30 PM on a Tuesday, November 1955. Outside the Convair plant in San Diego, the Santa Ana winds were kicking up, dry and hot, rattling the single-pane windows. Inside, the air was still, thick with the smell of stale tobacco and ozone.

  Art sat at his drafting table, a slide rule resting idle on a spread of blueprints for a wing spar. He wasn't looking at the spar. He was looking at a copy of *Fortune* magazine, opened to page 116.

  *Can We Survive Technology?* by John von Neumann.

  He'd bought it at a newsstand in La Jolla on Sunday, drawn by the name. Everyone knew von Neumann. The math genius. The bomb man. Art expected a treatise on yield, on blast radii, on the megatonnage that kept him awake at 3:00 AM. He expected the usual calculus of destruction. That, he could compartmentalize. Art was a stress analyst. He calculated load factors, fatigue limits, and G-forces. If the wing held, the payload got to the coordinates. What happened after was a different department, literally and figuratively.

  But von Neumann hadn't written about the blast. He'd written about the air.

  Art lit a cigarette, the flare of the match illuminating the tight, weary lines around his eyes. He read the paragraph again.

  *…interference with the climate… could be a weapon of war… cheaper and more certain than the H-bomb.*

  It was the word *cheaper* that lodged in Art's throat. The bomb required uranium, massive industrial plants, thousands of technicians. It required a state. But this? Messing with the jet stream? Inducing droughts or freezing rains? Von Neumann suggested that the leverage points of the atmosphere were so sensitive that a small input could yield a catastrophic output. You wouldn't need a factory to kill a continent. You might just need a few well-placed canisters of particulate matter and a understanding of fluid dynamics.

  Art looked out the window. The darkness beyond the glass felt sudden and absolute. The wind howled, stripping palm fronds against the pavement. For twenty years, Art had viewed weather as background noise. It was turbulence to be calculated, wind shear to be mitigated. Now, looking at the swaying palms, he felt a new kind of vertigo. The atmosphere wasn't a medium; it was a mechanism. And if it was a mechanism, it could be rigged.

  He took a drag, the smoke curling around the magazine page.

  There was another point, darker and heavier, that sat in his stomach like lead. Von Neumann argued that the earth had effectively shrunk. Technology had annihilated distance. The oceans were no longer moats; they were highways. There was no "away" left. No empty space to absorb a shock.

  *There is no permanent solution,* von Neumann wrote. *Only an endless run of successive correct decisions.*

  Art tapped ash onto the concrete floor. He was good at decisions. In his work, a decision was binary. The metal yields or it doesn't. The factor of safety is 1.5 or it isn't. You run the numbers, you sign the sheet, you go home. But von Neumann was talking about a game where the board changed every time you moved a piece. A game where you couldn't win, you could only keep playing without dying. And you had to be right. Forever.

  "Still here, Vance?"

  Art jumped, sliding the magazine under a stack of stress charts. MacLeish stood in the doorway, holding his fedora. MacLeish worked in propulsion. He was a man who believed in thrust, in forward motion, in the idea that if you went fast enough, you could outrun the consequences.

  "Cleaning up," Art said.

  "Big weekend?" MacLeish stepped in, leaning against a filing cabinet. He smelled of gin and menthols. "You look like you've been staring into the sun."

  "Just reading."

  MacLeish nodded at the *Fortune* peeking out from under the charts. "Von Neumann. Heavy stuff. My wife says reading that makes men impotent. Says it saps the will to build."

  Art didn't smile. "He says the weather could be weaponized. Cheaper than the bomb."

  MacLeish waved a hand, dismissing the smoke. "Theoretical. You know how these mathematicians are. They see an equation and think it's the world. We build things that fly, Art. We don't worry about the wind's politics."

  "He says there's no buffer left, Mac. The globe is shrunk. We're all in the same room."

  "Then it's a small room," MacLeish said, pushing off the cabinet. "Which means we watch the door. That's the job. You worry about the spar, I worry about the engine, the Army worries about the trigger. You try to hold the whole roof up by yourself, you're going to crush yourself."

  MacLeish tipped his hat. "Don't work too late. The world isn't going to end before Monday."

  Art watched him leave. The footsteps faded down the linoleum hall. *The world isn't going to end before Monday.* It was a comforting thought, the kind of thought that let a man sleep. But Art couldn't shake the image of the "successive correct decisions." It implied a vigilance that was exhausting. It meant there was no finish line. No treaty, no bigger bomb, no victory parade that would allow humanity to relax. Just the next decision, and the next, forever.

  He packed his briefcase. He slid the magazine in on top of his lunch pail. He didn't want to leave it here.

  The drive home to Chula Vista was a blur of tail lights and highway blackness. His Buick hummed along the 101. Usually, this was his decompression time. He'd listen to the radio, maybe catch some jazz or a ballgame. Tonight, he turned the radio off.

  He watched the landscape rush by. The dark shapes of the hills to the east. The invisible ocean to the west. Von Neumann's voice echoed in his head. *No empty space.* Art looked at the dark hills. They looked crowded now. He imagined invisible clouds drifting over them, seeded by an enemy he couldn't see, turning the rain acidic or stopping it altogether. Drying out the crops. Freezing the citrus groves in the valley. A war without soldiers. A war where the casualty count was measured in bushels of wheat and inches of mercury.

  He pulled into his driveway. The house was a small stucco box, painted a pale yellow that looked white in the moonlight. A single porch light burned.

  Inside, the house was quiet. His wife, Ellen, was asleep. He could hear the soft rhythm of her breathing from the bedroom. He stood in the living room, the magazine still in his briefcase. He had an urge to wake her. To sit at the kitchen table with a pot of coffee and explain it to her. *Do you understand? It's not just the explosion. It's the air. It's the fact that we never get to stop.*

  But he knew what would happen. Ellen was practical. She managed the budget, she managed the neighbors, she managed the uncertainty of a husband working in defense. She would listen, nod, and tell him to go to bed. She would absorb the fear and convert it into a reason to check the locks or buy extra canned goods. She would make a decision to cope.

  Art wasn't ready to cope. And he wasn't ready to fight. He felt suspended in the space von Neumann had described. The space between the decision and the consequence.

  He walked out the back door onto the small concrete patio. The wind was still blowing, dry and hot. It rattled the eaves.

  In the corner of the yard, there was a small patch of dirt where Ellen had tried to plant a garden last spring. Tomatoes, mostly. They had withered in the heat, and she hadn't replanted. The soil was hard, cracked clay. A wooden trellis lay on its side, one of the legs snapped.

  Art had meant to fix that trellis for three months. It was a small thing. A loose joint, a broken stake. In the grand scheme of stress analysis, it was negligible. If the trellis failed, nothing catastrophic happened. The tomatoes—if there were any—would rot on the vine.

  He went back inside and opened his toolbox. He took out a hammer, a coil of wire, and a flashlight.

  He knelt in the dirt. The wind whipped his hair across his forehead. He shone the light on the broken leg of the trellis. It was a simple structural failure. Wood fatigue. Exposure to the elements.

  He could leave it. It didn't matter. The world was shrinking, the climate was a potential weapon, and the human race was on a treadmill of perpetual correct decisions that led nowhere. Fixing a tomato trellis didn't change the trajectory of the jet stream. It didn't increase the buffer zone.

  But von Neumann had said *successive* decisions. Plural. Continuous.

  If there was no permanent solution, then the only thing that existed was the maintenance. The act of keeping the structure standing for one more day. One more season.

  Art took a piece of wire and threaded it through the splintered wood. He pulled it tight. The metal bit into his thumb. He twisted the ends together with the pliers, feeling the tension build. He wasn't building a shelter. He wasn't building a weapon. He was repairing a load-bearing point in a system that was already failing.

  He worked methodically. He straightened the trellis and pushed the legs back into the hard earth. He packed the dirt down around the base with the heel of his hand.

  When he stood up, his knees popped. The trellis stood straight. It wouldn't hold much weight, not without new wood in the spring. But it would hold tonight. It would withstand the Santa Anas until morning.

  He looked up at the sky. It was clear, full of stars that looked cold and distant. For the first time in his life, Art didn't see them as navigation points or abstract beauty. He saw them as witnesses to a very small, very temporary arrangement of matter.

  He went inside and washed his hands. The dirt under his fingernails was dark and gritty. He didn't scrub it all off.

  He walked to the bedroom door but didn't open it. He stood in the hallway, listening to the house settle. The pipes ticked. The floorboards creaked. It was a machine for living, and it required constant, successive corrections to keep from falling apart.

  Art went to the kitchen and poured a glass of water. He drank it standing up, looking out the window over the sink. The wind was still moving the shadows of the trees against the fence.

  He wouldn't wake Ellen. He wouldn't write a letter to the editor. He wouldn't throw the magazine away. Tomorrow, he would go back to Convair. He would calculate the stress load on a wing spar. He would sign the sheet. He would do his part of the endless run.

  But tonight, he had made a decision. It was small, and it was correct.

  He turned off the kitchen light, leaving the house in darkness, and walked toward the bedroom, stepping carefully over the loose board in the hallway that he had finally noticed last week, and had finally, tonight, decided to fix.
