answer: |-
  It is a pleasure to correspond with someone who brings the disciplinary rigor of a physicist to the history of philosophy. Your intuition here is sharp, and you have identified a tension that has troubled Frege scholars since the diary's contents became public knowledge. You are asking whether the *structure* of a philosophical system can bear the imprint of a moral failing, even if the *propositions* of that system remain formally valid.

  Here are my comments on your three specific points: the logical status of your worry (the genetic fallacy), the historical record, and the existing scholarly landscape.

  ### 1. Temperament vs. Content: Is this the Genetic Fallacy?

  You are right to be wary of the genetic fallacy (rejecting a conclusion based on its origin), but I do not think your argument commits it. In analytic philosophy, we often rely on Hans Reichenbach's distinction between the **context of discovery** (how an idea was generated) and the **context of justification** (the logical evidence for the idea). The standard defense of Frege (Mendelsohn's position) relies on walling these off: the *Begriffsschrift* is justified by its formal utility, regardless of the psychological or political context of its discovery.

  However, your point targets something more subtle than the truth-value of logical propositions. You are asking about the **normative force** of the system. Frege did not just invent symbols; he invented a *conception* of what logic is for. He argued that logic is the study of objective "Thoughts" (Gedanken) in a "third realm," distinct from the subjective (psychology) and the physical (reality).

  If your hypothesis is correct—that the drive for this "purified" realm stems from the same authoritarian impulse that sought a purified political realm—then it does not make the logic *false*, but it might render the **philosophical motivation** suspect. It suggests that Frege's anti-psychologism was not merely a technical correction of his contemporaries (like Husserl or Wundt) but part of a broader worldview that feared ambiguity, plurality, and the "messiness" of human subjectivity.

  In this sense, you are not committing the genetic fallacy; you are engaging in **ideology critique**. You are asking whether the *boundaries* Frege drew (what counts as logic vs. what counts as mere psychology) were arbitrary lines drawn to exclude the very things his politics found threatening (democracy, plurality, subjectivity). This is a legitimate philosophical inquiry, distinct from saying "Frege was a bigot, therefore modus ponens is invalid."

  ### 2. The Historical Record: Dummett and Mendelsohn

  Your history is substantially correct, though a few nuances might sharpen the picture.

  *   **Dummett's Discovery:** Michael Dummett did indeed encounter the diary entries in the 1950s while working through the *Nachlass* in Münster. He was famously devastated. Dummett was not only a towering Frege scholar but a committed anti-racist (he was arrested protesting apartheid in the 1970s). For him, Frege was the paradigm of rationality. Finding the diary created a profound cognitive dissonance. Dummett never fully resolved this to his own satisfaction; in his later biographical writings, he acknowledged that Frege's political views were not a momentary lapse but consistent with a certain rigidity in his character.
  *   **Mendelsohn's Translation:** Richard Mendelsohn's 1996 introduction is indeed the standard "containment" strategy. His goal was to prevent the diary from overshadowing the logical work. The verdict you quote ("shake neither the truth nor the inventiveness") is the consensus view among logicians, but many philosophers of language find it unsatisfying for the reasons you outline.
  *   **The "Third Realm" Timing:** It is worth noting that Frege's paper "Der Gedanke" (where he outlines the third realm) was published in 1918–1919, shortly after WWI and during the turbulent early years of the Weimar Republic. The diary was written in 1924. While the logical work (*Begriffsschrift*) dates to 1879, the *philosophical articulation* of the "third realm" coincides with the rise of the political instability he despised. This supports your intuition that the philosophical systematizing and the political reactionary views may have grown from the same root during that period.
  *   **The Phrase "Drittes Reich":** You are correct that the coincidence is generally accepted. Frege used it to denote a realm of abstract objects. The political appropriation came later (Moeller van den Bruck's 1923 book *Das Dritte Reich*). However, given Frege's nationalism, some scholars have wondered if there was a subconscious resonance, though there is no evidence he intended a political link.

  ### 3. Has Scholarship Made or Dismantled This Argument?

  Yes, this has been a significant topic of debate since the mid-90s, though it often remains in footnotes or introductory essays rather than the technical core of logic.

  *   **The "Early vs. Late" Frege Defense:** Many scholars (e.g., William Tait, Patricia Blanchette) argue that the core logical work was completed decades before the diary. They argue that the "temperament" was present early on but was channeled into a battle against "psychologism" in logic, which was a legitimate technical battle at the time, independent of his later explicit anti-Semitism. They would argue that fighting for objectivity in 1880 is not the same as fighting for monarchy in 1924.
  *   **The Heidegger Parallel:** Your query inevitably invites comparison with Martin Heidegger. In Heidegger's case, scholars (like Emmanuel Faye) have argued that Nazism is *internal* to the philosophy, not just an external add-on. In Frege's case, the consensus is closer to the Mendelsohn view: the politics are external to the logic. However, a minority of scholars (such as Curtis Wilson in *Frege: Tradition and Influence*) have explored whether Frege's logical absolutism—the idea that there is One True Logic—mirrors his political absolutism.
  *   **The "Purity" Argument:** Your specific point about "purity" and "contamination" has been touched upon by historians of science like Peter Galison, who discuss how ideals of objectivity in science often mirror social ideals of order. In philosophy, **Maria van der Schaar** has written on Frege's context principle and his views on judgment, noting how Frege's rigid distinction between the act of judging (subjective) and the content judged (objective) serves to police the boundaries of reason. If that policing is motivated by a fear of social disorder, your "temperamental contamination" thesis holds water.

  ### A Physicist's Analogy

  You mentioned Philipp Lenard. As you noted, Lenard is a case where politics corrupted the *content* of the science (rejecting relativity). A better analogy for Frege might be **Werner Heisenberg** or scientists working in Nazi Germany who remained "apolitical." Their physics was sound, but their willingness to compartmentalize—to accept that their work existed in a "pure realm" while atrocities happened outside the lab—allowed the system to function.

  In Frege's case, the "Third Realm" functions as a sanctuary. If that sanctuary was built because the philosopher found the real world (with its democrats and Jews) too impure to think in, then the sanctuary itself is a monument to that exclusion, even if the tools inside it work perfectly.

  ### Conclusion

  Your nagging feeling is philosophically productive. Mendelsohn's separation is logically sound but hermeneutically thin. It protects the *truth* of the logic but potentially obscures the *meaning* of the project.

  If Frege's drive for a "third realm" was indeed fueled by a horror of the subjective that parallels a horror of political pluralism, it suggests that Analytic Philosophy's founding gesture—the severing of logic from human psychology and history—was not just a technical necessity but a **moral and aesthetic choice**.

  You are not committing a genetic fallacy; you are observing that the *architecture* of a philosophy can reflect the *pathologies* of its architect, even if the building stands up. For a retired physicist, this is akin to noticing that the design of a containment vessel was dictated not just by pressure requirements, but by the engineer's specific paranoia about leakage. The vessel may hold, but our understanding of *why* it was built that way changes.

  Frege scholars have not fully dismantled this argument because it requires stepping outside formal logic into intellectual history and psychology—territory that analytic philosophy has traditionally viewed with suspicion (ironically, for Fregean reasons). Your notes suggest it is time to revisit that suspicion.
