      *   *The Data:* People say Harm is Intentional, Help is Unintentional.
      *   *Hume on Intentionality:* Hume doesn't have a modern folk-psychological concept of "intentionality" distinct from "responsibility." For Hume, to call an action intentional is largely to say it flows from the will and character such that praise/blame is appropriate.
      *   *The Chairman's Character:* The Chairman says, "I don't care... I just want profit."
          *   *Harm Case:* This indifference leads to harm. Indifference to suffering is a vicious trait (cruelty/callousness). It triggers disapproval. Therefore, the action is linked to a vicious character trait.
          *   *Help Case:* This indifference leads to help. Indifference to the environment isn't a virtuous trait, but the *outcome* is good. However, the *motive* wasn't benevolence. Hume emphasizes motives. If the motive isn't virtuous, can we praise the action? Hume says we praise the *motive*, not just the outcome. So, the help doesn't reflect a virtuous character.
      *   *The Asymmetry:* Hume's system naturally generates an asymmetry in *moral assessment*, but does it generate an asymmetry in *intentionality ascription*?
          *   If "intentional" ≈ "responsible/flowing from character," then Hume might say *both* are intentional (both flow from the same will/character).
          *   *However*, if "intentional" is a proxy for "appropriate target of blame," then the asymmetry emerges.
