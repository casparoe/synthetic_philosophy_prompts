          *   Evaluate which of the three accounts (Knobe, Hitchcock & Knobe, Sripada) fits best with a Humean picture.

  2.  **Deconstruct Hume's Relevant Philosophical Commitments:**
      *   **Moral Sentimentalism:** Moral judgments are not discoveries of reason but feelings of approval/disapproval (pleasure/pain) arising from the contemplation of character traits.
      *   **Theory of Responsibility (Liberty and Necessity):** We hold people responsible only if actions are caused by their character (necessity) and not coerced (liberty). "Actions are objects of our moral sentiment only so far as they are indications of the internal character."
      *   **Intentionality/Volition:** For Hume, volition is an internal impression we feel when knowingly producing an action. But the *ascription* of intentionality is tied to the ascription of responsibility.
      *   **The "General Point of View":** We correct our sentiments based on general rules and the typical tendencies of traits, not just immediate consequences.

