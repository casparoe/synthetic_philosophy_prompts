          *   *Wait, is it accidental?* The Chairman *knew* the consequence. Hume distinguishes between the *cause* (character) and the *accident* (outcome). But here the outcome is known.
          *   *Hume's "Influence on Passion":* Blame arises from the pain caused by the trait. Harm causes pain -> Blame -> "Intentional." Help causes pleasure, but does it arise from a virtuous motive? No. So no Praise -> "Unintentional" (in the sense of not praiseworthy).

