answer: |-
  The notification arrived at 6:00 AM, pinged directly to the municipal app installed on every resident's phone in Oakhaven. **Proposal 89: Zoning Variance for the Historic District. Market Verdict: EXECUTE.**

  David sat at his kitchen table, the blue light of the screen illuminating the cold coffee in his mug. Below the verdict was the projection curve: the decision was expected to raise the Community Stability Index (CSI) by 4.2 points over the next fiscal quarter. The CSI was the town's north star, the single number they had voted on five years ago to replace the city council. *Vote on values, bet on beliefs.* They had voted for Stability. They had defined it as *Average Length of Residency multiplied by Local Business Continuity.* It sounded sensible. Who wants instability? Who wants churn?

  Now, the prediction markets had spoken. Speculators with skin in the game had wagered millions on the outcome. They had analyzed supply chains, demographic shifts, and interest rates. Their consensus was clear: converting the historic row houses into high-end, long-lease lofts would maximize the CSI. Wealthy tenants stay longer than working-class renters. Chain stores have higher continuity than mom-and-pop shops.

  David looked out the window at the row house across the street. Mrs. Gable had lived there for forty years. She was selling. David had lived here for twelve. He was a secondary school teacher; his salary hadn't kept pace with the projected rent hikes the market had implicitly endorsed. He wouldn't be part of the 4.2 points. He would be the denominator that got reduced to improve the average.

  He walked to the town hall, needing to hear it from a human voice. The lobby was quiet. The futarchy system had eliminated the need for campaigning, for rallies, for the messy theater of democracy. There were only white papers and market tickers.

  Sarah, the Town Administrator, was waiting for him. She wasn't a politician; she was a facilitator of the mechanism. She wore a blazer that looked too crisp for a Tuesday morning.

  "David," she said, not looking up from her tablet. "I saw your query in the public log. You want to discuss the variance?"

  "I want to discuss the metric," David said. "The market isn't wrong, Sarah. I know that. The traders know their math. If we turn the district into luxury units, the people who move in will stay forever. The CSI goes up. The system works."

  "Then what's the problem?"

  "The system defines stability as *presence*," David said. "It doesn't define it as *connection*. Mrs. Gable across the street knows my kids' names. She watches the block. The new tenants won't know me. They'll be remote workers who travel three weeks a month. They'll stay because they can afford to, not because they belong. The metric counts their years, but it doesn't weigh their roots."

  Sarah finally looked up. Her expression was pitying, but firm. "We had this debate five years ago. During the constitutional convention. We could have voted for 'Social Cohesion,' but how do you measure that? Surveys are manipulable. Sentiment is volatile. We chose Residency and Business Continuity because they are auditable. You can't bet on a feeling, David. You can only bet on a number."

  "So we voted on a number," David said, "and called it a value."

  "We voted on a proxy for a value," Sarah corrected. "It's the best we could do. If you change the metric now, you invalidate the contracts. The traders hedged based on the CSI. If you switch to 'Cohesion' halfway through, you're rigging the game."

  "I'm not talking about changing it now," David said. "I'm talking about the fact that we locked it in forever. We decided once, five years ago, that *staying* was the only thing that mattered. But maybe today, what matters is *affordability*. Or *diversity*. But we can't vote on that today. We can only bet on how to maximize the number we chose when we were all happier and poorer."

  Sarah tapped her tablet. "The market priced in the risk of displacement. There was a side market on 'Community Complaints.' It predicted a spike, but weighed it against the long-term gain in CSI. The belief was that people would complain for a month and then forget. That's the belief structure we're governed by, David. That your grief has a half-life."

  David left the town hall without saying goodbye. He walked back through the Historic District. The sun was hitting the brickwork, making the old buildings glow. He saw the "For Lease" signs going up in the windows of the bakery and the hardware store. They would be replaced by a gym and a coffee chain. The business continuity score would soar. A gym doesn't close when the owner gets sick. A chain doesn't retire.

  He stopped in front of his own building. He could feel the weight of the decision not as a political loss, but as a physical pressure. The market hadn't been manipulated by whales. There was no insider trading. The information was symmetric. The incentives were aligned. The mechanism was perfectly clean.

  That was the horror of it. The mechanism was neutral, like a guillotine.

  He thought about the slogan again. *Vote on values, bet on beliefs.* It implied that values were static things, once identified, that could be set like a thermostat. But values were a conversation. They were the argument itself. By removing the argument, by handing the substantive decisions to the conditional markets, they hadn't solved politics. They had just hidden the politics inside the definition of the index.

  Someone had decided that a long-term resident was worth more than a short-term one. Someone had decided that a business that never closed was better than one that served a need and then vanished. Those were value judgments. They weren't facts. But because they were encoded in the CSI, they looked like physics.

  David went home and started packing. He wouldn't fight the variance. There was no one to petition. The market had already settled the question. To argue against the result was to argue against reality, against the aggregated wisdom of the incentivized crowd.

  He taped a box shut. Inside were books, photos, the things that constituted his own personal index of value. None of it would move the CSI.

  From his window, he watched a surveyor mark the sidewalk across the street. The man checked a device, nodded, and moved to the next spot. He was measuring the ground for the future. The data would feed back into the model. The model would update the odds for the next proposal. The system would learn, it would optimize, it would grow more efficient.

  David picked up the box. It was heavy. He wondered if the market had priced in the cost of a teacher moving thirty miles away, of the longer commute, of the subtle erosion of a neighborhood that no longer looked like a neighborhood. Probably not. It wasn't in the formula.

  He walked out the door and locked it for the last time. The lock clicked with a solid, final sound. Up the street, the surveyor was still working, humming to himself, mapping out the growth of the town, one neutral number at a time. David got into his car and drove away, leaving the Stability Index to rise without him.
