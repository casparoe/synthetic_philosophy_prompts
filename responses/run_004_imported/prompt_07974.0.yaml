answer: |-
  **MEMORANDUM**

  **TO:** Capstone Committee, Department of Computer Science
  **FROM:** [Your Name], Student Representative, Formal Methods Concentration
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation on Classical Axioms in Capstone Formalizations

  ### Executive Summary

  Following the extraction failure in last year's root-finding project, this memo addresses the proposed restriction on classical axioms (specifically the Law of Excluded Middle and Axiom of Choice) in Coq capstone projects. 

  **Recommendation:** The Committee should adopt a **Computational/Logical Separation Policy**. Classical axioms are permitted in specification definitions and verification proofs (logical content), but strictly prohibited in the construction of functions and data structures destined for code extraction (computational content). 

  This approach satisfies the engineering requirement for executable code without endorsing the metaphysical claim that classical mathematics is invalid.

  ### Context and Problem Statement

  The core conflict arises from the dual nature of our capstone requirement: students must produce a machine-checked *proof* of correctness and an *executable program* extracted from that development. 

  Last year's team encountered a fundamental limitation: they used the Law of Excluded Middle (EM) to define a branching condition on real numbers (`x < y ∨ x = y ∨ x > y`). While logically valid in Coq (with axioms), this disjunction lacks a computational witness. Consequently, the extracted OCaml code contained an `assert false` stub at the branch point, rendering the "verified" program non-functional on general inputs.

  ### Analysis of Competing Views

  The Committee is currently divided between two principled positions. Both deserve honest representation.

  **1. The Constructive Restriction (Prof. A's Position)**
  This view argues that for a proof to justify an extracted program, it must adhere to the Brouwer–Heyting–Kolmogorov (BHK) interpretation. Under this reading, a proof of existence *is* the construction of a witness. To allow EM in a proof that generates code is to allow a "proof" that provides no algorithm. As Dummett argued, if meaning is grounded in use (verification), a verification-transcendent truth condition (classical truth) cannot ground the semantics of an executable program. From this perspective, allowing classical axioms in extraction paths is not just an engineering bug; it is a category error that misrepresents what a proof is.

  **2. The Classical Permissivist (Prof. B's Position)**
  This view argues that restricting axioms conflates *truth* with *computability*. Classical logic remains a valid tool for reasoning about specifications, even if those specifications are not fully computable. A blanket ban risks implying to students that classical mathematics is "wrong," rather than simply non-constructive. Furthermore, many specification-level lemmas (e.g., proving a state space is finite or that a limit exists) are significantly harder to prove constructively. Forcing constructivity everywhere increases cognitive load without necessarily improving the quality of the verification, potentially diverting focus from system architecture to foundational workarounds.

  ### Recommendation and Rationale

  I recommend the **Computational/Logical Separation Policy**.

  **The Policy:**
  1.  **Computational Content (Set/Type):** Any definition or function intended for extraction must be provably constructive. Imports of `Classical`, `Excluded Middle`, or `Choice` are prohibited in modules flagged for extraction.
  2.  **Logical Content (Prop):** Classical axioms are permitted in lemmas and theorems used to verify properties, provided these proofs are erased during extraction and do not influence the control flow of the extracted program.

  **Reasoning:**

  *   **Technical Feasibility:** Coq's type theory distinguishes between `Prop` (proofs, usually erased) and `Set/Type` (data/functions, retained). This policy leverages that architecture. It prevents the specific failure mode from last year (stubs in executable code) without forbidding classical reasoning in verification.
  *   **Philosophical Integrity:** This respects Prof. A's concern by ensuring that *code generation* remains faithful to the constructive requirement of the BHK interpretation (a program must know what to do). Simultaneously, it respects Prof. B's concern by acknowledging that classical logic is a valid tool for *reasoning* about the system, even if it cannot *drive* the system. It avoids the pedagogical pitfall of teaching students that classical math is "false"; rather, it teaches them that classical math is "non-computational."
  *   **Pedagogical Value:** This distinction forces students to confront the exact boundary where mathematics becomes computation. Understanding *why* equality on reals is undecidable is a core learning outcome of the Formal Methods concentration. Hiding this behind a classical axiom deprives them of that insight; banning classical axioms entirely obscures the utility of classical reasoning in specification.

  ### Implementation Guidelines

  To make this policy actionable for the next cohort:

  1.  **Module Segregation:** Projects should separate `Extraction` modules (constructive only) from `Proof` modules (classical allowed).
  2.  **CI/CD Check:** The build pipeline should include a check (e.g., using `coqchk` or extraction dry-runs) that fails if axioms are detected in computational dependencies.
  3.  **Advisory Note:** Faculty advisors should clarify that students may use `Require Import Classical` for verification lemmas, but must refactor any computational dependency on those lemmas into constructive algorithms (e.g., replacing real equality with approximate equality within a tolerance).

  ### Conclusion

  The goal of the Formal Methods concentration is to produce verified, working software. A blanket ban on classical logic is philosophically overreaching and engineering-inefficient. However, allowing classical logic to dictate control flow is engineering-negligent. By restricting classical axioms to the logical layer while mandating constructivity for the computational layer, we ensure the code runs, the proofs hold, and the students learn the precise relationship between truth and computation.

  I move that we adopt this separation policy effective for the upcoming academic year.
