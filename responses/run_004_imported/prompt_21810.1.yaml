      *   **Why this bites:** The Omniscient agent's *epistemic model* tells them the hint is worthless (probability 1 on the bits already). This leads to a financial loss.

      *   *Wait, one nuance:* If the Omniscient agent *knows* $x$, they don't need to compute it. They just write it down.
