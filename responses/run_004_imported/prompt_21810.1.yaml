          *   **Bounded Agent:** Uncertain about $M$.
              *   Believes $M$ might contain winning numbers with prob $p$.
              *   Valuation of $C$: $p \times \text{Jackpot}$.
              *   Action: Buys $C$ for \$100.
          *   **Resolution:** The Bounded Agent buys $C$. Later, the key is leaked (or computed by a quantum computer). $M$ *does* contain the winning numbers.
          *   **Outcome:** Bounded Agent wins Jackpot. Omniscient Agent (who valued $C$ at \$0) missed out.
          *   **Why?** Because the Omniscient Agent conflated *logical existence* with *computational accessibility*. They treated the ciphertext as equivalent to the plaintext because one entails the other.

  4.  **Finalizing the Example Structure:**
