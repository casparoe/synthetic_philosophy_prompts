          *   **Omniscient Trader:** Believes the price should be 0 or 100 immediately.
          *   **Bounded Trader:** Believes price should be proportional to difficulty (e.g., $1/2^{128}$).
          *   **The "Wrong Call":** The Omniscient Trader tries to arbitrage based on "knowledge" they cannot access.
          *   **Concrete Example:**
              1.  **Proposition $Q$:** "The least significant bit of the private key $k$ corresponding to public key $K$ is 1."
