answer: |-
  **Setting:** *A slightly too-loud coffee shop near campus. Two philosophy grad students, Alex (Perdurantist) and Blake (Endurantist), are surrounded by open notebooks and half-empty mugs.*

  **Alex:** Look, I get the appeal. It feels intuitive to say, "I am wholly present right now." But you have to face the logic of change. Lewis wasn't just making this up to be difficult. The Problem of Temporary Intrinsics is a contradiction waiting to happen if you stick to your view.

  **Blake:** It's not a contradiction if you index the properties. I'm sitting at $t_1$ and standing at $t_2$. No logical violation.

  **Alex:** That's the textbook move, but it doesn't hold water. If you say "Sitting" is actually a relation, *Sitting-at-t*, then sitting isn't an intrinsic property anymore. It's a relation between you and a time. But intuitively, how I am shaped is about *me*, not about my relationship to a calendar. If I'm bent, I'm bent. Full stop. By relationalizing it, you've saved the logic by killing the intrinsicality. You've turned shapes into relations.

  **Blake:** Okay, fair. Lewis hammers that point hard. He says we lose the notion of intrinsic nature. But that's why I'm not going with the relational view. I'm leaning toward adverbialism.

  **Alex:** Adverbialism? The "exemplifying-ly" move?

  **Blake:** Exactly. I don't have the property *Sitting-at-t*. I have the property *Sitting*. But I exemplify that property *at-t-ly*. The modification applies to the *having*, not to the *property*. So, the property remains intrinsic. I am genuinely, intrinsically sitting. I just instantiate that intrinsic property in a temporally modified way.

  **Alex:** But what does that even mean? "Instantiating-at-t-ly." It sounds like linguistic sleight of hand. You're positing a primitive mode of instantiation to avoid positing temporal parts. At least with perdurantism, the ontology does the heavy lifting. I don't need magical adverbs. I just say: The temporal part of you at $t_1$ is sitting. The temporal part of you at $t_2$ is standing. The whole "worm" doesn't change; it just has different parts with different properties. Just like a road can be paved here and unpaved there without contradiction.

  **Blake:** But the road analogy fails because the road isn't *conscious*. I don't experience myself as a series of time-slices. I experience myself as the *same* thing persisting. If I'm just a sum of parts, who is the subject of the experience right now? Is it the whole worm? The worm can't think, because most of it is in the past or future. Is it the time-slice? Then "I" only exist for an instant. That's a high price to pay to avoid an adverb.

  **Alex:** It's not a high price; it's the cost of coherence. You're worried about the subject of experience? Fine. The subject of experience *is* the temporal part. When you say "I remember yesterday," that's just a causal connection between your current time-slice and a previous time-slice via memory traces. You don't need strict identity over time to make sense of memory or anticipation. You just need psychological continuity.

  **Blake:** Psychological continuity isn't identity. And look, let's talk about coherence. You think perdurantism solves the contradiction cleanly? I think it creates a new problem. The Rotating Discs Argument.

  **Alex:** Oh, Sider's version? Or the original?

  **Blake:** The classic one. Imagine a perfectly homogeneous disc. It's spinning. Now imagine a qualitatively identical disc that is stationary. According to you, an object is just a sum of temporal parts. But for every instant $t$, the temporal part of the spinning disc is qualitatively identical to the temporal part of the stationary disc. It's a homogeneous disc-shape.

  **Alex:** Sure.

  **Blake:** So, if the object is just the sum of those parts, and the parts are identical in both cases, what makes one spinning and one stationary? Where is the rotation? If the parts don't have the property of "rotating" intrinsically—because a snapshot doesn't rotate—then the sum doesn't rotate. You've lost the motion.

  **Alex:** That's a challenge, sure. But it's not a knockout. We can appeal to modal properties or causal roles. The temporal parts of the spinning disc have different causal potentials than the stationary one. A part of the spinning disc is disposed to move off in a tangent if released. The stationary one isn't. So the parts *aren't* qualitatively identical if you include dispositional properties.

  **Blake:** Ah, but now you're relying on extrinsic or dispositional properties to ground the identity of the parts. You criticized me for turning intrinsic shapes into relations to times. Now you're turning the motion of a disc into a relation to *possible futures* or causal laws. You're saying a thing is spinning not because of how it is *now*, but because of what it *would* do. That seems just as adverbial as my "exemplifying-at-t-ly." You're smuggling in dynamics that aren't in the categorical ontology of the parts.

  **Alex:** It's not smuggling; it's physics. Motion *is* a dynamic concept. But let's flip this back to the intrinsics. Your adverbialism... does it really solve the contradiction? If you say $O$ is $F$ and $O$ is not-$F$, but modified by times... logically, you still have one subject, $O$, bearing incompatible properties. You've just hidden the incompatibility in the copula. Lewis would say you're denying the Principle of Non-Contradiction in all but name. Perdurantism respects logic by distributing the properties to different entities. $O_1$ is $F$. $O_2$ is not-$F$. $O$ is the sum. No contradiction.

  **Blake:** But $O_1$ isn't *me*. $O_1$ is a slice of me. If I cut my finger at $t_1$, *I* am in pain at $t_1$. If perdurantism is true, the whole worm doesn't feel pain. Only a slice does. That means "I" am not the thing persisting through the conversation. "I" am a fleeting stage. That undermines moral responsibility, prudence, survival... why should I care about the pain of my future temporal part? It's not *me*. It's just a part of the worm, like my toe is a part of my body. I care about my toe, but I *am* my toe? No.

  **Alex:** You care about your future parts because of the special relation of *genidentity* and psychological continuity. It's not strict identity, it's what matters in survival. Parfit showed us identity isn't what matters. But look, let's be real. Your endurantism requires a primitive notion of "being wholly present." What does that mean? Are you literally in the same spatial location as your atoms? If you're distinct from your parts, you're a substratum. If you're identical to your parts, and your parts change, you change. If you change, you have incompatible properties.

  **Blake:** I'm not a substratum. I'm constituted by my matter, but not identical to it. I'm a hylomorphic compound, if you want to go classic. But even without that, "wholly present" just means that at $t_1$, all of me exists at $t_1$. None of me is off in 1999.

  **Alex:** But if all of you is at $t_1$, and all of you is at $t_2$, and you have different properties... we're back to square one. You're saying the *very same entity* is bent and straight. My view says: Entity A is bent. Entity B is straight. Entity C (the worm) contains both. It's cleaner. It fits with Special Relativity, too. There's no privileged "now" where you are wholly present. Simultaneity is relative. If you're wholly present at $t$, whose $t$?

  **Blake:** Ouch. The relativity hit. Okay, I'll concede that endurantism needs a presentist or A-theory backing to work smoothly with SR. But perdurantism has its own relativity issues—if temporal parts are frame-dependent, then the "worm" is frame-dependent. You don't escape the problem; you just push it to the composition of the parts.

  **Alex:** True, the worm's slicing is frame-relative. But the spacetime manifold itself is invariant. The worm is a region of spacetime. That's ontologically robust. Your "wholly present" object seems to float above the spacetime manifold, trying to ride the "now" like a surfboard.

  **Blake:** And your worm turns time into space. That's the real cost. You spatialize time. If time is just another dimension like length, then passage is an illusion. Change is an illusion. It's just variation. But change *feels* real. The transition from sitting to standing is an event, not a static distribution of properties.

  **Alex:** The "feeling" of passage is psychological. The metaphysics has to account for the facts. The fact is, you have a bent shape and a straight shape. The only way to have both without contradiction is to have them in different respects. I say the respect is *parts*. You say the respect is *times*. But if times aren't parts, they're just indices. And if they're just indices, you haven't explained *how* one thing can be two ways. You've just asserted it can.

  **Blake:** I haven't asserted it; I've analyzed predication. To say "The apple is red" is incomplete. It's always "The apple is red [at t]." That's not an assertion; it's a grammatical and metaphysical necessity. We never encounter objects outside of time. So why insist that "being red" must be a timeless relation? It's a temporally qualified instantiation.

  **Alex:** Because if instantiation is relative, then nothing *ever* just has a property. Nothing is actually anything. It's all "actually-ly-at-t." It drains the world of categorical reality.

  **Blake:** No, it grounds categorical reality *in* time. Look, we're at a stalemate. You think my view is logically suspect. I think your view is existentially hollow. You save logic by killing the subject. I save the subject by complicating the logic.

  **Alex:** I think I save the subject by realizing it's not a simple. It's a complex. And I think you complicate the logic by denying the obvious solution to temporary intrinsics. But... I will give you this: The Rotating Discs point is annoying. If the parts are qualitatively identical, the difference has to be brute or modal. And brute differences are ugly.

  **Blake:** And I'll give you this: If Presentism is false, and the past and future exist, endurantism gets very crowded. If Caesar is wholly present in 50 BC, and I am wholly present in 2024, and both times exist... the universe is packed with duplicate whole objects. It's ontologically expensive.

  **Alex:** Exactly. My worm is one object. Your view is a billion Caesars stacked in the block universe.

  **Blake:** But only one of them is *alive*.

  **Alex:** *[Sips coffee]* See? That's the A-theory talking.

  **Blake:** *[Smiles]* Maybe. But it's the one that lets me say I'm actually sitting, not just a slice of a worm that sits.

  **Alex:** Fine. You keep your intrinsic sitting. I'll keep my non-contradictory worm. Let's see what the professor says about the RDA on Thursday.

  **Blake:** Deal. But I'm bringing Sider's response to print out.

  **Alex:** I'm bringing Lewis's "Extrinsic Properties" paper.

  **Blake:** God help us.
