  2.  **Deconstruct the Stoic Position on Fate and Freedom:**
      *   *Stoic Determinism:* The universe is a rational, causal web (Logos). Everything happens according to nature/providence.
      *   *Stoic Compatibilism:* Human agency exists *within* this causal web. Our assent (choice to agree/disagree with impressions) is internal.
      *   *Chrysippus's Contribution:* He's the key figure here. He used the "Cylinder Analogy." A cylinder needs a push to start moving (external cause/fate), but *how* it rolls (its shape/nature) is internal. Similarly, an impression hits us (fate), but our assent is determined by our character (internal).
      *   *Key Distinction:* Stoics distinguish between *external events* (fated) and *internal assent* (up to us).

