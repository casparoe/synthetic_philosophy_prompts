      *   *Augustine:* The quote is crucial. Augustine is a heavy hitter for Jansenists (Pascal's milieu). Using Augustine sanctifies the observation that human truth is inaccessible without Grace.

  5.  **Address the "Stable Position" Question:**
      *   *Pascal's Method:* He often holds tensions in place (dialectical). Man is both great and wretched. Reason is powerful but weak.
      *   *Here:* The tension *is* the point. Justice *must* be believed to be eternal to function, but reason *knows* it is contingent. This gap is where faith is needed.
      *   *Quals Angle:* This fragment is part of the "Misery of Man without God" section. It sets up the need for a higher justice (Christian charity) which supersedes custom.

