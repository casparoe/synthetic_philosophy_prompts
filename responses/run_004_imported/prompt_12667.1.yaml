answer: |-
  Berlin, November 1915. The radiators clanked, a dying rhythm against the silence of the apartment. Outside, the war was eating Europe, but inside, the universe was unraveling over a sheet of paper.

  Albert stared at the equations. They were beautiful. Generally covariant. They held their form no matter how you twisted the coordinates, no matter how you accelerated the frame. It was the principle he had chased for a decade: the laws of nature should not care who is looking, or how they are moving.

  But the ghost was back. The *Lochbetrachtung*. The Hole Argument.

  He closed his eyes and visualized the manifold. A vast, four-dimensional fabric. He carved out a region—a hole—empty of matter, empty of energy. Just spacetime. Outside the hole, the metric field was fixed, determined by the mass of the sun, the Earth, the stars. The boundary conditions were set. The past was known.

  Now, the trick. The mathematical sleight of hand that had haunted him since Zurich.

  Imagine a transformation. A smooth dragging of the coordinates. Outside the hole, the transformation is the identity; nothing moves. The grid lines lock onto the stars. But inside the hole? Inside, the grid slips. It flows like water. A point $p$ inside the hole is mapped to a new location $p'$. The metric field $g$ is dragged along with it.

  You now have two solutions. Solution A: The metric field $g$ at point $p$. Solution B: The transformed field $g'$ at point $p$.

  Both solutions satisfy the generally covariant equations. Both solutions agree perfectly everywhere outside the hole. They share the same past, the same boundary, the same matter distribution. But inside the hole, at the specific point $p$, the curvature is different.

  If the points of spacetime are real things—substantive entities that exist independently of the fields placed upon them—then Solution A and Solution B describe physically distinct universes. In one, gravity peaks at $p$; in the other, it troughs.

  And here was the vertigo. The equations could not tell you which one was true.

  Given complete knowledge of the universe outside the hole, the theory could not predict the field inside. Determinism, the bedrock of classical physics, shattered. God did not play dice; God simply had no rule to decide what happened in the hole. The theory was empty. It predicted nothing.

  For two years, this logic had forced him to abandon general covariance. He had published the *Entwurf* theory, crippled and incomplete, because it was the only way to plug the hole. He had sacrificed beauty for certainty.

  Albert opened his eyes. The smoke from his pipe hung in the air, a nebula suspended in the room.

  *If the points are real, the theory is broken.*

  He walked to the window. The street below was dark. A carriage rolled past, the wheels striking the cobblestones. *Click. Clack.* A coincidence of events. Wheel meets stone.

  He turned back to the desk. What if the premise was wrong?

  What if the point $p$ was not a real thing? What if the manifold was not a container, but merely a catalog?

  He picked up the pen. He drew two lines intersecting on the paper. A crossing of worldlines. An event.

  "We do not observe spacetime points," he whispered to the empty room. "We observe coincidences."

  The physical reality was not the grid. It was the ink. It was the meeting of the particle and the field, the clock and the light ray. If you drag the metric field inside the hole, you also drag the physical events defined by that field. The point $p$ has no identity except for the field values that inhabit it.

  Solution A and Solution B were not different universes. They were the same universe, described with different labels. The indeterminism was a mirage created by believing the labels were real.

  Substantivalism was the error. Spacetime was not a stage; it was the script.

  The vertigo vanished. The hole closed. The equations on the desk were no longer a threat to determinism; they were a demand for humility. You could not ask where the field was unless you asked what was there to mark the place.

  Albert sat down. The radiator clanked again, but the rhythm felt different now. Stable. He dipped the pen. He would write to the Prussian Academy. He would restore general covariance. He would let the points go to save the physics.

  He began to write. *The sum of all point-coincidences constitutes physical reality.* The ink dried on the page, a fixed mark in the sliding dark.
