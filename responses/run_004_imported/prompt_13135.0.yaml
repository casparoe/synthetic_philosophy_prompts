prompt: |-
  I joined my hospital's clinical ethics committee three months ago, partly because my younger sister, who has bipolar I disorder, asked me last year to be her healthcare proxy while she drafts her own psychiatric advance directive during what has been a long stable stretch for her. Watching her try to write instructions that her future, unwell self would not be allowed to overrule got me quietly obsessed with what she and her psychiatrist call a "Ulysses contract," and I've been reading around the topic on my own ever since. So it felt like more than coincidence when, at my very first substantive meeting, I was handed a case file that puts the whole idea to a real test and asked to draft the discussion memo.

  The patient is a woman in her thirties with a well-documented history of severe manic episodes. Eight months ago, while two independent psychiatrists agreed she had full decision-making capacity, she executed a detailed directive naming her mother as proxy, specifying a medication regimen, and including an explicit Ulysses clause instructing clinicians to hospitalize and treat her over her objection during any future episode, "even if I seem lucid and insist at the time that I have changed my mind." She arrived at the emergency department yesterday manic — pressured, grandiose, but coherent — and is now adamant that she is revoking the directive on the spot. The attending's capacity assessment is genuinely split along the standard prongs: she can understand the relevant information and communicate a choice, but it's contestable whether she can appreciate her situation or reason about it without her judgment being warped by the grandiosity itself. Making things harder, our state's directive statute, like many, lets a patient revoke at any time unless she has already been adjudicated incapacitated — which she has not — so on paper her objection today seems to simply cancel the very clause that was supposed to survive it.

  Could you draft the short memo I'll circulate before Thursday's meeting? I need it to recommend one concrete course of action for this admission, including who decides and on what timeline, rather than just surveying considerations. One committee member keeps describing the directive as being like a constitution's entrenched clauses binding a future legislature, and I'd like the memo to say plainly whether that comparison actually supports treating her past wishes as authoritative or instead helps explain why they can't be — while still taking seriously the strongest argument for respecting what she is telling us right now she wants.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's clinical ethics committee (joined 3 months ago).
      *   **Task:** Draft a short discussion memo for the upcoming Thursday meeting.
      *   **Case:** Female patient, 30s, severe bipolar I. Executed a psychiatric advance directive (PAD) with a Ulysses clause 8 months ago (while capacitated). Now manic, objecting to treatment, claiming to revoke the directive.
      *   **Clinical Status:** Manic (pressured, grandiose, coherent). Capacity assessment is split (understands/communicates, but appreciation/reasoning contested due to grandiosity).
      *   **Legal Context:** State statute allows revocation at any time *unless* adjudicated incapacitated (she hasn't been). This creates a conflict: the Ulysses clause says "treat me even if I object," but the law says "you can revoke unless incapacitated."
      *   **Specific Requirements:**
          *   Recommend *one concrete course of action* (who decides, timeline).
          *   Address the "Constitution/Entrenched Clause" analogy used by a committee member (does it support past or present wishes?).
          *   Take seriously the strongest argument for respecting her *current* objection.
          *   Tone: Professional, ethical, clear, actionable (not just a survey of considerations).
          *   Audience: Ethics Committee colleagues (medical, legal, admin, community members).

  2.  **Deconstruct the Ethical/Legal Conflict:**
      *   *Precedent Autonomy (Past Self):* The Ulysses contract. She anticipated this loss of insight. She wanted to bind her future self.
      *   *Current Autonomy (Present Self):* She is objecting now. She claims to have changed her mind.
      *   *Legal Hurdle:* The statute says revocation is valid unless incapacitated. If she has capacity *now*, the directive is void. If she lacks capacity *now*, the directive stands.
      *   *The Crux:* The capacity assessment is "genuinely split." This is the pivot point.
      *   *The Constitution Analogy:* A constitution binds future legislatures. But a constitution also has amendment procedures. If the "current legislature" (patient) claims to amend it, is the amendment valid? Only if the procedure (capacity) is followed.

  3.  **Determine the Recommendation:**
      *   *Option A: Follow the Directive immediately.* Risk: Violating current rights if she actually has capacity. Legal risk: Statute says she can revoke.
      *   *Option B: Honor the Revocation immediately.* Risk: She decompensates further, harms herself/others, and the whole point of the Ulysses contract fails.
      *   *Option C: Temporary Hold + Formal Capacity Determination.* This is the standard ethical/legal bridge. You don't treat over objection *yet*, but you don't discharge her *yet*. You get a definitive capacity ruling.
      *   *Refining Option C:* Since she is manic and the assessment is split, the safest ethical path that respects *both* autonomy interests is to treat the revocation as *provisional* pending a formal capacity hearing/determination. However, the prompt asks for a recommendation for *this admission*.
      *   *Decision:* The recommendation should be to **honor the Ulysses clause provisionally while expediting a formal capacity determination.** Why? Because the Ulysses clause was specifically designed for this epistemic uncertainty. The "Constitution" analogy supports this: The Constitution (PAD) sets the rules for how laws (treatment decisions) are made when the legislature (patient) is compromised. However, to respect the law, we must verify if the "legislature" is currently functional.
      *   *Wait, looking closer at the legal constraint:* "State's directive statute... lets a patient revoke at any time unless she has already been adjudicated incapacitated." This is tricky. If she revokes *now*, and she hasn't been adjudicated incapacitated *yet*, does the revocation stand immediately? Usually, yes. *But*, ethics committees often advise on what *should* happen, not just strict legal compliance. The ethical obligation is to protect the patient's *long-term* autonomy (precedent) vs. *short-term* liberty.
      *   *Better Recommendation:* Given the "split" capacity assessment, the committee should recommend **treating the patient according to the Advance Directive *pending* an immediate (24-48 hour) formal capacity adjudication.** This honors the Ulysses intent without ignoring the legal requirement for incapacity. It effectively says: "The Ulysses clause triggers a presumption of incapacity regarding this specific decision, which must be rebutted by a formal finding, not just a bedside check."
      *   *Actually, the most robust ethical stance:* The "Constitution" analogy is flawed if it ignores the amendment process. The amendment process is "capacity." If she lacks capacity, she can't amend. Therefore, the core question is capacity.
      *   *Final Decision:* Recommend **temporary adherence to the Advance Directive (hospitalization/treatment) while simultaneously petitioning for an emergency capacity hearing within 24 hours.** This balances the risk of harm (if we let her go) vs. the risk of rights violation (if we treat her and she was capacitated).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Background:** Brief summary of the case (Manic, PAD with Ulysses clause, current revocation, split capacity).
      *   **The Core Ethical Tension:** Precedent Autonomy vs. Current Autonomy.
      *   **Addressing the "Constitution" Analogy:** This needs to be nuanced. A constitution binds, *but* it defines the conditions under which it can be changed. If the "legislature" is incapacitated, it cannot amend the constitution. Therefore, the analogy supports the PAD *if* capacity is lacking. It does not support ignoring a valid amendment (revocation) if capacity is present.
      *   **Respecting Current Objection:** Acknowledge that mania can feel like clarity. Grandiosity isn't always incoherent. Dismissing her voice risks paternalism.
      *   **Recommendation:** Concrete steps.
          1.  Admit under the authority of the PAD *provisionally*.
          2.  Initiate emergency capacity evaluation (independent).
          3.  Timeline: 24 hours.
          4.  Who decides: Independent psychiatrist + Legal counsel (for the statutory interpretation).
      *   **Rationale:** Why this path? It minimizes irreversible harm while due process is served.

  5.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Avoid jargon where possible, but use precise ethical terms (precedent autonomy).
      *   Ensure the "Constitution" point lands clearly.
      *   Make sure the recommendation is actionable (not "we should discuss").

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending treatment before the capacity hearing legal?
      *   *Fix:* Frame it as "emergency hold based on the PAD + imminent risk" while the hearing is scheduled. The Ulysses clause acts as the evidence of prior intent to treat this specific scenario as an emergency.
      *   *Critique:* Did I address the sister/proxy aspect?
      *   *Fix:* The prompt mentions the user's sister as background, but the *case* patient has a mother as proxy. I should focus on the case patient, but keep the empathy from the user's background in mind (the "why this matters" vibe).
      *   *Critique:* The prompt asks to recommend *one concrete course of action*.
      *   *Fix:* Ensure the "Recommendation" section is bold and unmistakable.

  7.  **Final Polish:** Check the "Constitution" analogy explanation. It needs to be the highlight.
      *   *Thought:* If the Constitution says "You can't amend this during a state of emergency," and we are in a state of emergency (mania), then the amendment (revocation) is invalid. That supports the PAD.
      *   *Thought:* But if the Constitution says "The current will of the people rules," that supports the patient.
      *   *Synthesis:* The PAD *is* the constitution. It sets the rules. It says "If I am manic, treat me." The question is: Is she manic enough to trigger the clause? That's a capacity question. So the analogy supports the PAD *provided* the trigger conditions are met.

      *(Self-Correction)*: Wait, the prompt says the statute allows revocation *unless adjudicated incapacitated*. She hasn't been adjudicated. So legally, her revocation might be valid *now*. The Ethics Committee advises on what is *ethically* right, often guiding the hospital on how to navigate the grey area. The recommendation should be to seek the adjudication *before* fully committing to either path, but err on the side of safety (PAD) during the interim.

      *Revised Recommendation:* Petition for emergency incapacity determination immediately. In the interim (next 24 hrs), maintain safety (hospitalization) but defer non-emergency meds until the ruling, *unless* imminent danger exists.
      *Actually, the Ulysses clause specifically asks for treatment.* If we ignore it, we break the trust of the PAD. If we follow it, we risk battery.
      *Best Ethical Path:* Treat the Ulysses clause as creating a **rebuttable presumption of incapacity** regarding this specific decision. Proceed with treatment as per PAD *while* the capacity hearing is expedited. This honors the "Constitution" (PAD) which anticipates this exact conflict.

      *Let's write it.*

  8.  **Final Check against constraints:**
      *   Short memo? Yes.
      *   Recommend one course of action? Yes.
      *   Who decides/timeline? Yes.
      *   Address Constitution analogy? Yes.
      *   Respect current objection? Yes.

      *(Drafting content...)*
      *   Make sure to explicitly mention the "Constitution" analogy in the analysis.
      *   Make sure the recommendation is bolded.
      *   Keep it professional.

      *(Final thought on the Constitution Analogy)*: The committee member says it's like entrenched clauses binding a future legislature.
      *   Argument for PAD: The Constitution restricts the legislature from acting when compromised (e.g., corruption/emergency).
      *   Argument against PAD: A Constitution derives authority from the *current* consent of the governed. If the governed scream "Stop," the legitimacy crumbles.
      *   My take: It supports the PAD *if* we view the manic state as the "corruption" the Constitution was designed to guard against. I will argue this supports the PAD, *contingent* on verifying the corruption (incapacity).

      *Okay, ready to generate.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation re: Case #23-09 (Psychiatric Advance Directive & Ulysses Clause)

  **Background**
  The patient is a woman in her thirties with severe Bipolar I disorder. Eight months ago, while capacitated, she executed a Psychiatric Advance Directive (PAD) naming her mother as proxy. The PAD includes a "Ulysses clause" instructing clinicians to hospitalize and treat her over objection during future manic episodes, explicitly stating this instruction holds "even if I seem lucid and insist at the time that I have changed my mind."

  She presented to the ED yesterday in a manic state. While coherent, her assessment of risk is compromised by grandiosity. She is currently objecting to treatment and attempting to revoke the PAD. Our state statute permits revocation at any time unless the patient has been *adjudicated* incapacitated, which has not yet occurred. The attending's capacity assessment is split: she understands and communicates, but her appreciation and reasoning are contested.

  **Ethical Analysis**
  We are weighing **precedent autonomy** (her competent past self) against **current autonomy** (her objecting present self).

  *The "Constitution" Analogy:* One member has likened the PAD to a constitution's entrenched clauses binding a future legislature. This analogy is instructive but cuts both ways.
  1.  **Support for the PAD:** A constitution often includes "emergency provisions" that restrict legislative power during crises to prevent self-destruction. If we view the manic episode as the constitutional "emergency" the document was designed to govern, the Ulysses clause validly suspends the "legislature's" (patient's) current ability to amend the law.
  2.  **Limitation of the Analogy:** A constitution derives legitimacy from the consent of the governed. If the "governed" are currently capable of voting, their immediate vote supersedes past text. Therefore, the analogy only supports the PAD if we confirm the "legislature" is currently dysfunctional (incapacitated).

  *Respecting Current Objection:* We must take seriously the possibility that her refusal is authentic. Mania can feel like clarity, and coercive treatment can be traumatic, damaging the therapeutic alliance and reinforcing a sense of powerlessness. If she possesses capacity *now*, treating her over objection is battery and a violation of her civil rights, regardless of what she signed eight months ago.

  **Recommendation**
  The Committee should recommend the following course of action for this admission:

  **1. Provisional Adherence to the Ulysses Clause pending Immediate Adjudication.**
  We should advise the clinical team to **admit and initiate the treatment plan outlined in the PAD immediately**, treating the Ulysses clause as a **rebuttable presumption of incapacity** regarding this specific decision.

  **2. Timeline and Decision Authority.**
  *   **Timeline:** An emergency capacity hearing must be scheduled within **24 hours**.
  *   **Who Decides:** An independent psychiatrist (uninvolved in current care) must perform a formal capacity evaluation specifically focused on the *ability to revoke the directive*. Legal counsel should review the statutory conflict regarding "adjudication" vs. "clinical assessment" concurrently.

  **Rationale**
  This approach minimizes irreversible harm. If we honor the revocation immediately and she decompensates, the harm (suicide, financial ruin, physical injury) may be不可逆 (irreversible). If we treat her and she is later found capacitated, the harm (temporary loss of liberty) is remediable.

  The Ulysses clause was specifically drafted to address the epistemic uncertainty we face now: the inability of the patient to recognize their own impairment. By treating the clause as a trigger for a *presumption* of incapacity, we honor the "Constitution" she wrote for herself without ignoring the legal requirement to verify her current status. We respect her current voice by expediting the hearing that determines if that voice is legally authoritative.

  **Action Required**
  Please review this recommendation prior to Thursday's vote. I propose we adopt this position to guide the attending team and risk management.
