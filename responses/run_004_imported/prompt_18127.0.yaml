prompt: |-
  So in my history of econ thought seminar we just got to the bit in Capital vol. 1 where Marx digs up that passage in Aristotle's Nicomachean Ethics (book 5) about how 5 beds = 1 house - basically Aristotle works out that exchange needs some common 'substance' underneath it for two totally different things to be commensurable, but then says it's literally impossible for stuff that different to actually be equal, so he just leaves it as a practical workaround. Marx reads this as Aristotle almost stumbling onto the labor theory of value except he couldn't quite get there, and blames the failure on Aristotle living in a slave society that couldn't concieve of human labour as equal across people. Can you compare what Aristotle is actually doing/arguing in that passage about money and exchange with Marx's reading of it? specifically, what's the exact gap marx thinks aristotle hits, and is the slavery explanation for why he couldn't close it actually convincing, or is that more marx projecting his own theory backwards onto him for a tidy history-of-thought story?
