  I've been chasing a story on statutory interpretation for a while now and keep getting stuck on Bostock v. Clayton County -- Gorsuch, a self-described textualist, ends up reading "sex" in Title VII to cover sexual orientation and gender identity, which is basically the outcome purposivists wanted, but he gets there through the "plain meaning" route while Alito's dissent screams that this is purposivism in textualist drag. It's messing with my mental model of how these two camps are supposed to map onto predictable outcomes. I keep going back and forth: is Bostock a triumph showing textualism isn't just a conservative tool, or does it prove "plain meaning" is elastic enough to be bent toward whatever conclusion you like, which would make the whole textualist/purposivist distinction kind of hollow.

  I'd like you to write an essay that grapples with this specific case (or a similarly gnarly one if you've got a better example) to work through the textualism vs. purposivism debate -- not just the standard talking points about legislative intent vs interpretive constraint, but really dig into what a case like Bostock reveals about whether the distinction actually does the work its defenders claim it does. Weigh the strongest arguments on both sides, using the majority and dissenting opinions as evidence where it helps, and land on an actual verdict about which approach is more defensible as a general theory of interpretation, or where exactly the line should be drawn between them. Don't just conclude "it depends" -- give me something with teeth.
