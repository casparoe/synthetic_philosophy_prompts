answer: |-
  # The Mirror Cracked: Bostock and the Illusion of Interpretive Neutrality

  For decades, the map of American statutory interpretation seemed neatly drawn. On one side stood the textualists, typically conservative, arguing that judges must adhere to the strict letter of the law, ignoring legislative intent or modern policy goals. On the other stood the purposivists, typically liberal, arguing that statutes should be interpreted to achieve their broad remedial goals, even if that required stretching the text. It was a comfortable arrangement, a sort of ideological cold war where the method of interpretation usually predicted the outcome.

  Then came *Bostock v. Clayton County* (2020), and the map burned.

  In *Bostock*, Justice Neil Gorsuch, the movement's leading textualist, wrote a majority opinion extending Title VII's prohibition on discrimination "because of sex" to cover sexual orientation and gender identity. It was the outcome purposivists had fought for decades to achieve. Meanwhile, Justice Samuel Alito's dissent screamed that this was "purposivism in textualist drag," arguing that Gorsuch had ignored the historical context of 1964 to update the law judicially.

  This reversal has left many legal observers, like you, with a unsettling question: If textualism can produce the "liberal" result and purposivism can be invoked to demand "conservative" restraint, is the distinction between the two theories hollow? Is "plain meaning" just elastic enough to be bent toward whatever conclusion a justice prefers?

  The answer is no, but the reason is more uncomfortable than the standard defenses admit. *Bostock* does not prove the distinction is hollow; it proves that textualism is a more demanding discipline than its proponents often claim, and that its neutrality is found in its capacity to surprise, not its capacity to constrain. However, *Bostock* also exposes a fissure in textualist theory regarding the "level of generality." To understand why textualism remains the more defensible theory of interpretation, we must first acknowledge where Gorsuch's opinion teeters on the edge of the very abstraction it claims to avoid.

  ### The Syllogism and the Context

  To see the fracture, we must look at the mechanics of the disagreement. Gorsuch's majority opinion is a masterpiece of reductionist logic. He treats Title VII as a code. The statute says an employer cannot fire an employee "because of... sex." Gorsuch applies a "but-for" causation test: If you fire a male employee for being attracted to men, but would not fire a female employee for being attracted to men, then the employee's sex is a but-for cause of the discharge. Therefore, the text prohibits the conduct.

  Gorsuch explicitly brackets off legislative intent. He admits that the 1964 Congress likely did not foresee this application. "The limits of the drafters' imagination supply no reason to ignore the law's demands," he writes. For Gorsuch, the text is a rule that operates independently of the expectations of its authors. Once enacted, the words belong to the public, and the public must live with the logical implications of those words.

  Alito's dissent attacks the premise that the words can be divorced from their context. He argues that "sex" in 1964 had a specific public meaning: biological distinction between male and female. To Alito, textualism requires understanding how a reasonable person at the time of enactment would have understood the words. By ignoring the "elephant in the mousehole" (the idea that Congress doesn't hide massive social changes in vague language), Alito claims Gorsuch is actually engaging in purposivism—using the broad purpose of "eliminating discrimination" to expand the text beyond its original scope.

  Here lies the crux of your confusion. Alito is arguing for a form of "original public meaning" that relies heavily on historical expectation (a purposivist-adjacent move), while Gorsuch is arguing for a "logical public meaning" that relies on the internal consistency of the text (a pure textualist move).

  ### The Hidden Variable: The Level of Generality

  The reason *Bostock* feels like a trick is that both sides claim to be looking at the "text," but they are looking at the text through different lenses of abstraction. This is the "level of generality" problem, a critique often leveled by legal realists.

  When Gorsuch reads "because of sex," he chooses a high level of generality: *Any decision where sex is a causal factor.*
  When Alito reads "because of sex," he chooses a low level of generality: *Any decision where sex is the specific biological characteristic being targeted.*

  Neither the text nor the dictionary dictates which level of generality is the "correct" one. That choice is normative. It is a choice about how much room to leave for the statute to grow. Gorsuch chooses the level that allows the text to govern new situations logically; Alito chooses the level that anchors the text to its historical application.

  This is where the charge of hollowness gains traction. If the choice of abstraction level is a normative choice, isn't the judge just smuggling in their policy preference under the guise of "textual analysis"? If Gorsuch wanted a conservative outcome, could he have chosen a different level of generality? Probably.

  However, to say this makes the distinction hollow is to misunderstand what the theories are trying to do. Purposivism asks: *What was the problem Congress trying to solve?* Textualism asks: *What rule did Congress enact?*

  In *Bostock*, Alito's dissent effectively asks, "What problem was Congress trying to solve in 1964?" (Answer: Biological sex discrimination, not gay rights). Gorsuch asks, "What rule did Congress enact?" (Answer: A rule prohibiting sex-based causation in employment).

  *Bostock* reveals that these questions can diverge. When they do, textualism demands you follow the rule, even if it solves a problem the drafters didn't anticipate. Purposivism demands you follow the intent, even if the text could logically cover more.

  ### The Verdict: Why Textualism Wins (With Scars)

  So, which approach is more defensible? *Bostock* provides the answer, but only if we are willing to accept the cost.

  **Textualism is the more defensible theory of interpretation, precisely because it produced the *Bostock* outcome.**

  Here is the hard truth: The primary virtue of textualism is not that it produces conservative outcomes, nor even that it produces "correct" ones. Its virtue is that it treats the law as a *law*, distinct from the preferences of the legislators or the judges. In a pluralistic democracy, we cannot expect judges to agree on the "purpose" of a statute. Liberals and conservatives will always disagree on whether the purpose of Title VII was to ensure formal equality or substantive social justice.

  If we adopt purposivism as the default, the law becomes a Rorschach test of judicial philosophy. Judges will inevitably find the "purpose" that aligns with their policy preferences. Alito's dissent, while legally rigorous, relies on a reconstruction of 1964 expectations that conveniently aligns with a conservative desire for judicial restraint.

  Gorsuch's opinion, conversely, demonstrates the only feature that makes textualism legitimate: **fidelity over comfort.** By accepting a outcome that horrified his political allies, Gorsuch proved that textualism is not merely a tool for conservative policy outcomes. It is a constraint that can bite the hand that feeds it. If textualism were just "conservatism in drag," *Bostock* would not have happened. The fact that it did happen is the strongest empirical evidence that the method has independent force.

  However, this verdict comes with a warning. *Bostock* exposes that textualism cannot be a mechanical algorithm. Gorsuch's choice of the "but-for" causation standard was a choice about the level of generality. Defenders of textualism must stop pretending that "plain meaning" is self-evident. It is not. It requires intellectual honesty about the fact that choosing the scope of the text is a judicial act.

  The distinction between textualism and purposivism is not hollow, but it is not a magic shield against judicial discretion. The line should be drawn here: **Textualism is the superior default because it anchors the law in public language rather than private intent, but it must abandon the pretense of mechanical neutrality.** Judges must admit that interpreting text involves choosing a level of abstraction, and they must justify that choice based on the structure of the statute, not just the dictionary.

  ### Conclusion: The Cost of Fidelity

  Your mental model was wrong, but not because the theories are meaningless. It was wrong because it assumed textualism was a vehicle for *conservatism*. *Bostock* corrects this: Textualism is a vehicle for *enactment*.

  Sometimes, enactments are broader than the expectations of the enactors. When that happens, purposivism offers a way to shrink the law back to its historical expectations. Textualism offers a way to let the law expand to its logical limits.

  In a democracy, the latter is the more defensible position. It forces the legislature to do its job. If the *Bostock* outcome is truly untenable, Congress can amend Title VII. That is the friction textualism is designed to create. Purposivism allows judges to smooth over that friction by guessing what Congress "really meant," which ultimately empowers the judiciary at the expense of the legislature.

  *Bostock* is not a triumph of textualism because it achieved a liberal outcome. It is a triumph because it proved that a textualist judge will follow the text even when it leads to a liberal outcome. That is the only kind of neutrality that matters. The distinction between textualism and purposivism is real, vital, and far from hollow. But *Bostock* teaches us that the price of textualism is uncertainty. If you want a method that guarantees your preferred policy outcomes, neither theory will serve you. But if you want a method that respects the separation of powers enough to let the text surprise you, textualism remains the only viable option.
