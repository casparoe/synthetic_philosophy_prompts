      *Wait, re-reading prompt:* "Garrison himself, or Wendell Phillips if you think he's the sharper legal interlocutor." Phillips *was* sharper legally. But the prompt says "Garrison and Frederick Douglass... had this huge, bitter falling out." It implies the dialogue should be between the two principals. I will use Garrison. I can make his arguments sharp enough without needing Phillips. The emotional weight of *their* specific breakup is more compelling.

      *Let's refine the 3/5 argument:*
      Garrison: It gives the slaveholder political power for his human property.
      Douglass: It implies they are persons, not property. And it limits the power compared to full count.
      *Actually, Douglass's strongest point:* The Constitution is a *national* document. Slavery is *local*. The Fed Gov has no power to touch it. Therefore, the Fed Gov is inherently anti-slavery because it can only act on liberty.
      *Garrison's counter:* By protecting it where it exists, you sustain it.

      *Let's write.*

  7.  **Final Review against constraints:**
