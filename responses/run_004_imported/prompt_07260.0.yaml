answer: |-
  **Rochester, New York. November 1853.**

  **The Study of Frederick Douglass.**

  *The room is thick with the smell of tobacco and printer's ink. Stacks of The North Star are bundled in the corner. FREDERICK DOUGLASS stands by the fireplace, holding a heavy iron poker, though the fire is low. WILLIAM LLOYD GARRISON sits in a leather armchair, his coat buttoned tight against the chill, a copy of The Liberator resting on his knee. There is warmth in their eyes, but a stiffness in their posture. Two men who once shared a platform now share a room with difficulty.*

  **DOUGLASS:** You look thinner, William. The cause consumes the flesh, even when the spirit remains iron.

  **GARRISON:** And you look like a man building a house on sand, Frederick. I read your editorial. "The Constitution is a Glorious Liberty Document." The words taste like ash in my mouth.

  **DOUGLASS:** They are the words of the text, William. Not my invention.

  **GARRISON:** The text? You speak as if the ink itself has moral agency. We are not debating a geometry theorem. We are debating a compact made by men who held whips in one hand and quills in the other. You cannot separate the deed from the doer.

  **DOUGLASS:** I can, and I must. If we are to save this Union, we cannot burn the foundation. We must inhabit it. You say the Constitution is a covenant with death. I say it is a weapon placed in our hands, if we have the courage to wield it. Look at the text. I challenge you: find me the word "slave."

  **GARRISON:** *(A sharp exhale)* Semantic sleight of hand.

  **DOUGLASS:** Is it? The law is precise. If a legislature intends to bind a man to servitude, it names the condition. Here? "Person held to service or labour." "Other persons." It speaks of men, not chattel. It refuses to stain the parchment with the word "slave." That silence is not an accident; it is a confession. They were ashamed.

  **GARRISON:** Ashamed, yet resolute! They were too cowardly to name the sin, but too greedy to abandon it. Does a thief become honest because he calls the stolen watch a "timepiece"? The thing itself is the crime. Article I, Section 2. The three-fifths clause. It is the heart of the beast. It gives the slaveholder political power for his human property. It turns a man into a fraction of a vote for the master.

  **DOUGLASS:** Or, it denies the master the full representation of that person. If the South claims these are property, they should count for zero. If they claim they are persons, they should count as one. The compromise is a penalty on the slaveholding states, reducing their influence in the House compared to the free states. It is a drag on their power, not a boon.

  **GARRISON:** A drag? It gives them twenty-five percent more power in Congress and the Electoral College than they would have if only free men counted! It allows a minority of white slaveholders to dominate the Presidency, to pack the Supreme Court, to demand the return of the fugitive. You call that a penalty? I call it a subsidy for tyranny.

  **DOUGLASS:** I call it a compromise that limits the scope of the federal government. That is the crux, William. The Constitution creates a federal government of delegated powers. Nowhere—not in the three-fifths clause, not in the fugitive clause, not in the insurrection clause—is the federal government granted the power to *establish* or *maintain* slavery. Slavery is a creature of state law. The federal government knows only citizens. Therefore, the national tendency is toward liberty.

  **GARRISON:** *(Leaning forward, voice dropping to a harsh whisper)* The Fugitive Slave Clause. Article IV, Section 2. "No person held to service or labour... escaping into another... shall be discharged from such service or labour, but shall be delivered up." It commands the North to be the South's hound. It makes you and me, by virtue of our citizenship, slavecatchers. How is a document that mandates the return of human flesh to the lash a "liberty document"?

  **DOUGLASS:** It is a compact between states, not a moral endorsement by the people. And I argue it does not empower Congress to legislate the capture. It leaves the enforcement to the states. The Fugitive Slave Law of 1850? That is unconstitutional overreach. But the Clause itself... it is a necessary evil to form the Union, yes. But look at the Preamble. "To secure the Blessings of Liberty to ourselves and our Posterity."

  **GARRISON:** Liberty for whom?

  **DOUGLASS:** For "We the People." Not "We the White." Not "We the Free." The text is universal. When the text is ambiguous, when it speaks of "persons" without qualification, the rule of interpretation must lean toward liberty. It is a fundamental principle of common law: when in doubt, choose freedom.

  **GARRISON:** Principles of common law do not stop the auction block! You speak of interpretation; I speak of intent. I speak of the men who signed it. Jefferson owned slaves. Washington owned slaves. The Constitution protected the African slave trade for twenty years. Article I, Section 9. "The Migration or Importation of such Persons as any of the States now existing shall think proper to admit... shall not be prohibited by the Congress prior to the Year one thousand eight hundred and eight."

  **DOUGLASS:** It set an expiration date!

  **GARRISON:** It guaranteed twenty years of unfettered trafficking in human souls! It barred Congress from stopping the bloodshed until 1808. That is not a path to liberty; that is a lease on hell.

  **DOUGLASS:** It was the first time in history a nation legislated the death of its own economic engine. They could have made it perpetual. They set a term. It was a death warrant for the trade, signed in 1787.

  **GARRISON:** And in the meantime? Thousands upon thousands dragged across the Atlantic in the hold of ships, protected by this "Liberty Document." You ask me to vote under this flag. You ask me to swear an oath to support this Constitution. To do so is to say, "I agree to let my brother remain in chains so that I may cast a ballot." I will not. No Union with Slaveholders.

  **DOUGLASS:** And if you dissolve the Union? If the North secedes as you urge? What becomes of the slave in Georgia? In Virginia?

  **GARRISON:** He is no longer part of a nation that claims to be free while being bound. The North washes its hands of the sin. The moral pressure becomes absolute.

  **DOUGLASS:** The moral pressure becomes irrelevant. The South becomes a separate slave empire, fortified, with no Northern agitation to prick its conscience. And the fugitive? If the North is a foreign nation, there is no constitutional clause to demand his return. The master comes with an army, not a warrant. Disunion is war. And who fights it? The black man. But you would have him fight without the shield of the law.

  **GARRISON:** The law *is* the chain! You are trying to use the master's whip to drive out the master. It is a contradiction. I believe in moral suasion. I believe in burning the document—as I did at Framingham—to show that no paper can stand between a man and his God.

  **DOUGLASS:** *(Turning from the fire, eyes flashing)* I burned my own back once, William. I know the mark of the whip. I also know the utility of the shield. You speak of the Preamble as poetry. I speak of it as law. "Secure the Blessings of Liberty." If the government has the power to secure liberty, it has the duty to destroy slavery. The text gives the federal government the power to suppress insurrections. It gives the power to guarantee a republican form of government. Slavery is not republican. It is monarchical. Use the text!

  **GARRISON:** The Supreme Court does not read your text. They read the intent. They see the black man as property.

  **DOUGLASS:** Then we must make them read the words! We must flood the courts with the argument that the Constitution knows no color. If we abandon the text to the slaveholder, we concede that the law is inherently evil. I will not concede that. Law can be redeemed.

  **GARRISON:** *(Softly, with a sad intensity)* You are a better lawyer than I, Frederick. I grant you that. You find the loopholes of light. But I fear you are polishing the bars of a cage and calling it a palace. The compromise is baked into the flour. You cannot bake a loaf of liberty with the yeast of slavery.

  **DOUGLASS:** And I fear you are standing outside the house in the snow, shouting that the roof is on fire, while refusing to come in and fetch the water.

  **GARRISON:** *(Stands up, buttoning his coat)* Perhaps. Or perhaps I am simply refusing to live in a house built on a grave.

  **DOUGLASS:** Then we are at an impasse. You will have your purity. I will take my chances with the politics.

  **GARRISON:** Purity is the only thing that cannot be compromised, Frederick. Once you admit the Constitution is good, you admit the Union is good. And if the Union is good, how long before you ask the black man to wait for his freedom for the sake of "order"?

  **DOUGLASS:** *(Walking to his desk, picking up a quill)* And if you burn the Constitution, William, how long before you find there is nothing left to bind the free states to the cause of the slave but their own whim? The text is a tether. Cut it, and we drift.

  **GARRISON:** *(Pausing at the door)* Better to drift in freedom than be anchored in hell.

  *Garrison opens the door. The cold air from the hallway rushes in, mingling with the warmth of the study. He does not look back.*

  **GARRISON:** Keep your pen sharp, Frederick. We shall see which cuts deeper. The law, or the conscience.

  *The door closes. Douglass stands alone in the room. He looks down at the Constitution lying open on his desk. He runs a finger over the text, lingering on the Preamble, then moves it to the Fugitive Slave Clause. He does not close the book.*

  **[END]**
