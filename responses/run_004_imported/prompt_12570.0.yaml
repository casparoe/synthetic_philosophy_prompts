      *   **Bellarmine:** Jesuit, brilliant theologian, diplomat, cautious. Not an anti-science zealot. Respects mathematics but distinguishes it from natural philosophy (physics). Holds the Council of Trent's decree on scripture interpretation. Concerned with the stability of the Faith and the potential for scandal if the Church backs a false theory.
      *   **Setting:** Rome, perhaps Bellarmine's study or a neutral garden. Early 1615. The Inquisition hasn't formally condemned Copernicus yet (that happens in 1616), but tensions are high.

  3.  **Key Arguments to Weave In:**
      *   *Demonstration:* Galileo claims he has proof (tides, Jupiter's moons). Bellarmine demands strict Aristotelian demonstration (cause and effect, no alternative explanations).
      *   *Accommodation:* Galileo argues scripture uses phenomenological language (Joshua's sun). Bellarmine argues this opens the floodgates to reinterpret dogma whenever science shifts.
      *   *Instrumentalism:* Bellarmine is okay with Copernicus as a calculating tool (like Osiander). Galileo wants it as physical reality.
      *   *Authority:* Who decides truth? The mathematician or the Theologian?

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Warm but tense. Acknowledge mutual respect.
      *   **Round 1: The Status of the Theory.** Galileo pushes for physical truth. Bellarmine draws the line at "hypothesis."
          *   *Galileo:* The phases of Venus prove it orbits the Sun.
          *   *Bellarmine:* It saves the appearances, but does it prove the Earth moves? Where is the wind? The birds left behind?
      *   **Round 2: Scripture and Accommodation.** The core of the user's prompt.
