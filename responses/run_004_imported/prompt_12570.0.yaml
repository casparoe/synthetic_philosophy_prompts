      *   **Round 3: The Danger to the Church.** Theo's point.
          *   *Galileo:* If you tie faith to physics, and physics changes, faith looks foolish.
          *   *Bellarmine:* If you allow private interpretation of scripture based on private mathematical insights, you fracture the Church's unity. Luther did that.
      *   **Round 4: The Missing Proof (Parallax/Mechanism).**
          *   *Bellarmine:* No stellar parallax.
          *   *Galileo:* The stars are too far. (He's right, but can't prove it yet).
      *   **Closing:** An impasse. Both feel they've held the line, but the problem remains unresolved.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Am I making Bellarmine too modern? *Correction:* Ensure he cites Augustine and the Council of Trent. He shouldn't sound like a modern skeptic, but a careful theologian.
