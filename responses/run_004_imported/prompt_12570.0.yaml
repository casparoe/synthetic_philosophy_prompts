answer: |-
  **Rome, Early 1615. The private study of Cardinal Robert Bellarmine.**

  *The room is warm, smelling of beeswax and old paper. Outside, the winter light is fading. GALILEO GALILEI sits opposite CARDINAL ROBERT BELLARMINE. There is wine on the table, untouched. The atmosphere is cordial, but the air is thick with the weight of a coming storm.*

  **BELLARMINE:** Signor Galileo, I have read your letter to the Grand Duchess Christina with great care. I must say, your piety is evident. It is clear you do not intend to undermine the Faith, but rather to protect it from the embarrassment of contradicting nature. That is a shared goal, is it not?

  **GALILEO:** It is my only goal, Eminence. I am a son of the Church. But a son who sees a ship steering toward rocks must cry out, even if the captain is holy. If nature and scripture cannot contradict, for both proceed from the Divine Word, then when they appear to clash, it is our interpretation of one that is at fault.

  **BELLARMINE:** A sound principle. Augustine himself warned against Christians speaking nonsense about the natural world in the name of scripture, lest we make the Faith a laughingstock to the pagans. However, you move from principle to application too swiftly. You argue that because the Copernican system *might* be true, we must immediately reinterpret the Holy Fathers who unanimously agreed the Earth stands still.

  **GALILEO:** Not because it *might* be true. Because it *is* true. I have seen the phases of Venus with my own eyes. She waxes and wanes in a manner geometrically impossible if she orbits the Earth. I have seen the moons of Jupiter—a miniature system proving that not all bodies orbit the Earth. These are not speculations; they are observations.

  **BELLARMINE:** They are observations of appearances, Signor Galileo. And on this point, we must be precise. You are a mathematician. You deal in *ex suppositione*—saving the appearances by calculating positions. I do not deny your calculations are superior to the Ptolemaic tables. But to move from "this calculation works" to "the Earth physically moves" is a leap into natural philosophy. Where is the physical demonstration? Where is the cause? If the Earth spins, why does a stone dropped from a tower fall straight down? Why are we not swept away by a great wind?

  **GALILEO:** Because the motion is natural, not violent! It is impressed upon the earth and all upon it. But let us set aside the physics for a moment. Let us speak of the scripture. You say the Fathers agree on a stationary Earth. I say they agreed on the language of accommodation. When the Psalmist says, "The world is established, it cannot be moved," he speaks of its stability, its permanence, not its kinematic status. And consider Joshua.

  **BELLARMINE:** Joshua 10. The sun stood still.

  **GALILEO:** Precisely. Joshua commanded the *sun* to stop. If the Sun is moving around a stationary Earth, stopping the Sun stops the day. But if the Earth is moving, and the Sun is stationary... then for the day to lengthen, Joshua would have had to command the *Earth* to stop. The text says "Sun," because to the people standing there, the Sun is what moves across the sky. Scripture accommodates the capacity of the vulgar. It speaks as we see, not as things are. If we insist on literalism here, we bind God to our perspective.

  **BELLARMINE:** *Leans forward, steepling his fingers.* This is your accommodation principle. It is elegant, Galileo. I grant you that scripture uses metaphor. When it says God has "hands" or "eyes," we do not imagine a physical body. But there is a distinction between anthropomorphism and cosmological order. The Fathers did not treat the Earth's position as a metaphor. They treated it as the stage of salvation history. Man is the focus; the Earth is his footstool. To move the Earth to the periphery is not merely a geometric shift; it alters the theological architecture.

  **GALILEO:** Does it? Or does it merely expand the majesty of God? But here is my fear, Eminence, and I speak it plainly. You demand a strict physical demonstration before you will allow scripture to be reinterpreted. You say, "Prove it beyond doubt, then we will talk."

  **BELLARMINE:** Is that not reasonable? If we reinterpret the Gospels every time a natural philosopher has a new hypothesis, what remains fixed?

  **GALILEO:** It is reasonable *if* the Church remains neutral. But it does not. By insisting on the literal reading *now*, you are tying the authority of the Church to a physical claim that is falsifiable. Suppose, in fifty years, instruments improve. Suppose we detect the parallax of the stars, or understand the tides as I suspect we shall. If the Earth is proven to move, and the Church has dogmatically declared it cannot, then the Church looks foolish. You risk making martyrs out of mathematics. Is it not safer to say, "Scripture speaks to our salvation, not to the mechanics of the spheres"?

  **BELLARMINE:** *Pauses, looking into the fire.* You argue that caution is dangerous. I argue that your liberty is chaotic. You speak of the Church tying itself to physics. I speak of individuals tying scripture to their private intellect. If I allow you to reinterpret Joshua based on your telescope, what stops the next man from reinterpreting the Resurrection based on his philosophy? The Council of Trent was explicit: no one is to interpret scripture contrary to the unanimous consent of the Fathers.

  **GALILEO:** But the Fathers were not addressing the Copernican system! They were addressing the heresies of *their* time. To treat their incidental cosmological views as dogma is to freeze the Church in time.

  **BELLARMINE:** It is to preserve unity. You ask me to treat geocentrism as instrumental—a useful fiction for calculation—while you treat it as false. But if I admit it is a fiction, I undermine the literal truth of the Creation narrative. If I admit it *might* be true, I must wait for proof. And here, Galileo, you do not have proof. You have probabilities. You have no stellar parallax. The stars remain fixed. If the Earth orbits the Sun, the stars should shift. They do not.

  **GALILEO:** Because the universe is vastly larger than you imagine! The stars are distant suns, so far away the shift is imperceptible to the naked eye.

  **BELLARMINE:** That is a hypothesis to save your hypothesis. You see the difficulty? You ask me to overturn the consensus of a millennium based on a theory that requires the universe to be inexplicably vast to avoid refutation.

  **GALILEO:** And you ask me to ignore the evidence of my senses because it conflicts with a reading of Joshua that even Augustine might have reconsidered had he seen Venus orbit the Sun!

  **BELLARMINE:** *Raises a hand gently.* Let us not raise voices. We are both men of reason. Let us return to your point about danger. You say the Church risks looking foolish if we ban Copernicus and he is later proven right. I concede this is a risk. But consider the reverse. If we endorse Copernicus, and he is *wrong*... if the Earth does not move, and we have told the faithful that scripture *must* be read metaphorically to accommodate this... then we have weakened the scripture for nothing. We have taught the people that the Bible is malleable to the science of the day. When the science changes again, as it always does, the Faith appears to change with it.

  **GALILEO:** But truth does not change! If the Earth moves, it moves forever. God's truth is one.

  **BELLARMINE:** Human understanding of truth changes. That is my point. The Church's role is not to be the vanguard of natural philosophy. It is to be the anchor. You want me to cut the anchor because you believe you see a better harbor. I tell you, the storm is not the physics. The storm is the pride of man. If we allow every new theory to dictate our exegesis, we hand the keys of the Church to the natural philosophers.

  **GALILEO:** I do not ask for keys. I ask that you not lock the door. Do not condemn it. Let it be discussed. If you condemn it as contrary to scripture, you make it a matter of faith. And you cannot make a matter of physics a matter of faith without risking the faith itself.

  **BELLARMINE:** We are not condemning it as heresy today. We are advising caution. We are saying: treat it as a mathematical hypothesis. Save the appearances. Do not claim it is physically true until you have a demonstration that excludes all other possibilities.

  **GALILEO:** *Sighs, leaning back.* "Save the appearances." That was Osiander's preface to Copernicus. He treated the truth as a lie to avoid offending the theologians. You ask me to do the same. To say, "I know the Earth moves, but I will speak as if it stands still." That is a form of lying, Eminence.

  **BELLARMINE:** It is a form of prudence. It is acknowledging the limits of human certainty. You are certain. I am not. In a dispute between certainty and doubt, the burden of proof lies with the one upsetting the order. You have not met that burden. Not yet.

  **GALILEO:** And by the time I do, by the time the proof is undeniable to even the most stubborn Aristotelian... the Church will have already dug its heels in. You will have made geocentrism a test of orthodoxy. Then, when the proof comes, the people will not blame the philosophers who were wrong. They will blame the Church that forbade the question. You are protecting the Faith by risking its credibility.

  **BELLARMINE:** *Stands and walks to the window.* And you, Signor Galileo, are protecting the Truth by risking the souls of the simple who need a stable world to believe in a stable God. You see the long game of science. I see the long game of salvation. If your theory is true, God knows it. It will not vanish. It can wait. But if we fracture the authority of the Church now, based on a theory that still lacks a physical mechanism... that fracture may never heal.

  **GALILEO:** *Softly.* The truth is the daughter of time, not of authority.

  **BELLARMINE:** *Turns back, his expression weary but resolute.* And authority is the guardian of the community that seeks the truth. We are at an impasse, Galileo. You cannot prove the Earth moves without a mechanism I can accept. I cannot allow scripture to be bent without a proof you cannot give.

  **GALILEO:** Then I suppose we must wait for time to speak.

  **BELLARMINE:** Indeed. But until she does, I must ask you to teach it only as a hypothesis. For the sake of the Church... and for your own sake.

  **GALILEO:** *Stands, picking up his hat.* I cannot teach what I believe to be a lie as if it were the truth, Eminence. But I will pray that God opens our eyes—both yours to the heavens, and mine to the needs of the faithful.

  **BELLARMINE:** And I will pray that your certainty is not mistaken for revelation.

  *Galileo bows. Bellarmine nods. There is no anger, only a profound, heavy sadness. Galileo exits. Bellarmine remains by the window, watching the sunset—a sun that, for both of them, still appears to move across the sky.*
