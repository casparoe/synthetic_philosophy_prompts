          *   *Theo's View (Bellarmine critique):* The Church wasn't neutral; it actively enforced literalism. Galileo's point is that tying Church authority to falsifiable physics is dangerous for religion. Accommodation should be consistent (Joshua's sun vs. God's "hand").
      *   **Format:** A dialogue between Galileo and Bellarmine, face-to-face, shortly before Bellarmine's letter to Foscarini (early 1615).
      *   **Constraints:** No strawmen, no pushovers. Real engagement, specific technical/theological weeds (demonstration vs. hypothesis, selective accommodation, instrumentalism vs. realism). Ambiguous ending (no clear winner).
      *   **Tone:** Intellectual, respectful but firm, historically grounded (17th-century rhetoric but accessible).

  2.  **Historical Context & Character Voices:**
