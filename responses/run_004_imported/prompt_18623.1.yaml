      *   The engineer *chose* to bypass. That is outside the scope of "blameless error."
      *   However, we must avoid "Retributive Justice" (punishing to hurt). The action must be "Restorative" (fixing the behavior to keep the team safe).

  6.  **Addressing the "Retributive Justice" Term:**
      *   The user didn't understand it. I should briefly explain it in the *thinking* or *notes* to the user, but in the memo, I should use language that steers *away* from it without necessarily lecturing the committee. I'll frame the action as "Corrective" not "Punitive."

