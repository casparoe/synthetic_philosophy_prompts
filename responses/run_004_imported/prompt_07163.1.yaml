      *   *Her:* Let's call her Sarah. Needs to be principled, trusting of the social fabric, perhaps a bit more idealistic but logically rigorous.
      *   *Dynamic:* There's history. Resentment? Respect? A mix. The silence between them should feel heavy but familiar.

  3.  **Setting the Scene:**
