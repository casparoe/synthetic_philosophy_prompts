          *   *However,* simply giving "Meritorious Service" feels like ignoring the safety violation.
          *   *Best Path:* Recommend the "Meritorious Service" award (recognizing the successful outcome and dedication) but explicitly *withhold* the "Above and Beyond" award *because* of the safety violation. Couple this with a recommendation for a safety debrief. This validates Side B's safety concerns while validating Side A's desire to recognize the life saved.
          *   *Actually, a stronger path:* Some SAR organizations might argue that *no* award is appropriate if protocol was flagrantly violated, regardless of outcome. However, that's harsh for a volunteer who saved a life. A middle ground is usually best for committee cohesion.
          *   *Let's look at the definitions again:* "Meritorious Service" = do assigned job well. "Above and Beyond" = past what could be asked.
