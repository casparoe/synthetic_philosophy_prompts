      *   *Why 300 isn't stronger?* Yes (independence assumption violation).
      *   *Why rational?* Yes (individual optimization vs. social welfare).
      *   *Why fragile?* Yes (public info weighs against initial signals, not crowd size).

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
      *   Start with the core distinction: Signal vs. Action.
      *   Walk through the first 3 agents.
      *   Show the "Informational Shutdown."
      *   Explain the fragility.
      *   Discuss the rationality/externality.
      *   Conclude with the "Gears" summary.

  *(Self-Correction during drafting)*: Make sure to mention that the cascade *could* be wrong. That's part of the fragility. If P1 and P2 got unlucky bad signals, the whole 300 people go off a cliff, and one piece of truth breaks it.

  *(Refining the "Rationality" part)*: Be careful not to imply they *should* try to signal. In the standard model, they can't. They just maximize utility. The "mistake" is in the structure of the game, not the agents.

