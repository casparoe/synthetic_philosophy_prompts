prompt: |-
  Okay, something about information cascades has been bugging me and I don't think I actually have a gears-level model of it. In the classic sequential herding setup -- the Bikhchandani/Hirshleifer/Welch style models, where people arrive one at a time, each gets a noisy private signal, each sees the full history of what everyone before them chose (but not their signals or how confident they were), and then acts -- a cascade can form and rope in a huge number of people, but it's also described as really fragile: one more piece of public info can flip the whole crowd even after hundreds of people have piled on, as if all those choices were worth almost nothing evidentially. That seems backwards on first pass -- shouldn't 300 people picking option A be much stronger evidence for A than 3 people picking it, no matter how the whole thing got started? Can you walk through the actual mechanism by which the cascade stops accumulating evidence once its running, and explain why this isn't a bias or mistake by anyone involved -- i.e. how every single person in that crowd of 300 can be a perfectly rational bayesian updater and the aggregate result is still this thin, brittle thing that one contrary data point can knock over?
reasoning: |-
  Here's a thinking process that leads to the explanation of information cascades:

  1.  **Deconstruct the User's Query:**
      *   **Core Topic:** Information Cascades (specifically the Bikhchandani/Hirshleifer/Welch (BHW) model).
      *   **The Intuition Gap:** The user finds it counterintuitive that a cascade of 300 people is as fragile as a cascade of 3 people. They feel 300 people choosing $A$ *should* be stronger evidence than 3 people choosing $A$.
      *   **The Request:** Explain the *mechanism* by which evidence accumulation stops during a cascade. Explain why this isn't a bias/mistake (i.e., everyone is acting rationally/Bayesian).
      *   **Key Constraint:** "Gears-level model." The user wants to understand the internal logic, not just the result.

  2.  **Initial Assessment & Key Insight:**
      *   The user's intuition (300 > 3) is correct *if* those 300 choices were independent signals.
      *   The crux of the BHW model is that *once a cascade starts, choices are no longer independent signals.* They become echoes of previous signals.
      *   Rational agents ignore their private signal if the public history outweighs it. Therefore, their action reveals *nothing* about their private signal.
      *   If actions reveal nothing about private signals, no new information is added to the public pool.
      *   Therefore, Person 300 adds no more weight than Person 4 (assuming the cascade started at 3).

  3.  **Step-by-Step Explanation Plan:**
      *   **Setup:** Define the simple BHW model parameters (State of World, Private Signals, Public Actions).
      *   **The Pre-Cascade Phase:** Show how the first few people actually *do* add information. This validates the user's intuition for the start.
      *   **The Tipping Point:** Demonstrate the specific math/logic where the public history outweighs a private signal.
      *   **The Cascade Phase (The "Gears"):** Explain exactly why Person $N$ (where $N$ is large) ignores their signal.
      *   **The Informational Content:** Crucial step. Explain that if Person $N$ ignores their signal, their action tells us nothing about their signal. It only tells us they followed the crowd.
      *   **Fragility:** Show why a single new public signal breaks the spell (because the accumulated "weight" of the cascade is actually just the weight of the first few people).
      *   **Rationality Check:** Reiterate that everyone is doing the right thing individually, leading to the suboptimal aggregate outcome.

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the intuition. It *is* weird. Validate that 300 independent signals *would* be stronger. The trick is they aren't independent.

      *   *The Setup (Simplified):*
          *   World is either Good ($G$) or Bad ($B$). Prior = 50/50.
          *   Signal is High ($h$) or Low ($l$).
          *   Signal accuracy: $P(h|G) = P(l|B) = 2/3$ (better than coin flip, but noisy).
          *   Payoff: Choose correct state = 1, wrong = 0.

      *   *Person 1:* Only has private signal. Follows it. Action reveals signal. (Info added).
      *   *Person 2:* Sees Person 1's action + own signal.
          *   If signals match: Follows.
          *   If signals clash: Indifferent (1 vs 1). Let's say they follow their own or flip a coin. (Actually, standard model usually assumes they follow their own signal if indifferent to keep it moving, or we wait for Person 3). Let's stick to the standard "cascade starts at 3" narrative for clarity.
          *   *Correction:* To make the "cascade starts" clear, let's look at Person 3.
          *   Scenario: P1 chose $A$ (implies $h$). P2 chose $A$ (implies $h$, because if P2 had $l$, they would have been indifferent or followed P1 depending on tie-breaking, but let's assume P2 had $h$ to make it clear).
          *   Actually, the cleanest way is: P1 chooses $A$. P2 chooses $A$.
          *   Now P3 arrives. P3 sees two $A$'s. This implies two $h$ signals (mostly).
          *   If P3 gets $l$: What should they do?
          *   Math: Two $h$'s vs One $l$. The odds favor $G$. So P3 chooses $A$ *even if* their signal is $l$.
          *   *Crucial Point:* P3's action is now decoupled from their signal.

      *   *The "Gears" Mechanism (The Black Box):*
          *   Once P3 ignores their signal, their action ($A$) is predetermined by P1 and P2.
          *   P4 sees P1=$A$, P2=$A$, P3=$A$.
          *   P4 knows P3 *would have chosen $A$ regardless of their signal*.
          *   Therefore, P3's choice gives P4 **zero information** about P3's private signal.
          *   P4 is in the exact same epistemic position as P3. Public info = P1's signal + P2's signal.
          *   P4 also ignores their signal.
          *   P5, P6... P300 are all in the same spot.

      *   *Addressing the "300 vs 3" Intuition:*
          *   The user thinks: 300 actions = 300 signals.
          *   Reality: 300 actions = 2 signals (from the starters) + 298 echoes.
          *   Echoes carry no information.
          *   So the "weight" of the cascade is fixed at the weight of the people *before* the cascade started.

      *   *Fragility:*
          *   If a new public signal arrives (e.g., a reliable report), it is weighed against the *actual* accumulated private information (just P1 and P2).
          *   It is *not* weighed against 300 people.
          *   So yes, it flips easily.

      *   *Rationality:*
          *   Is P300 irrational for ignoring their signal? No. Given the history, the probability that the world is $G$ is already high enough that their noisy $l$ signal shouldn't sway them.
          *   Is P300 irrational for not realizing they aren't adding info? No, they can't change the past. They are optimizing their own payoff, not the group's information pool. This is the externality.

  5.  **Refining the Explanation (Self-Correction/Polishing):**
      *   *Tone:* Keep it analytical but conversational ("gears-level").
      *   *Math:* Keep it simple. Likelihood ratios are better than raw probabilities for showing the "weight."
