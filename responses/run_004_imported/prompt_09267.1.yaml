answer: |-
  This is one of the most satisfying "aha!" moments in game theory because it hinges on a very specific distinction that our intuition usually blurs: the difference between a **private signal** and a **public action**.

  Your intuition is correct: if 300 people independently sampled the world and told you their findings, that would be overwhelming evidence. The "gear" that breaks this intuition in the BHW model is that **once a cascade starts, public actions cease to be reports of private signals.** They become echoes.

  Here is the gears-level walkthrough of why the evidence accumulation stops, why the agents are rational, and why the result is so fragile.

  ### 1. The Setup (The Gears)

  Let's simplify the math to see the mechanism clearly.
  *   **The World:** There is a hidden state, either **Good ($G$)** or **Bad ($B$)**. Prior probability is 50/50.
  *   **The Signal:** Each person gets a private signal, either **High ($h$)** or **Low ($l$)**.
  *   **Signal Quality:** The signal is noisy but informative.
      *   If World is $G$, $P(h) = 2/3$, $P(l) = 1/3$.
      *   If World is $B$, $P(h) = 1/3$, $P(l) = 2/3$.
  *   **The Goal:** Choose the action that matches the World ($A$ for $G$, $R$ for $B$). Payoff is 1 for correct, 0 for wrong.
  *   **The Constraint:** You see the **actions** of everyone before you, but **not their signals**.

  ### 2. The Pre-Cascade: Information Accumulation

  **Person 1:**
  *   Sees no history.
  *   Looks at private signal. If $h$, chooses $A$. If $l$, chooses $R$.
  *   **Informational Content:** High. Person 1's action perfectly reveals their signal to everyone else.

  **Person 2:**
  *   Sees Person 1 chose $A$ (implies Person 1 saw $h$).
  *   **Scenario:** Person 2 gets signal $l$.
  *   **Calculation:** Person 2 has one $h$ (from P1) and one $l$ (their own). These cancel out. The odds are back to 50/50.
  *   **Decision:** Person 2 is indifferent. Let's assume they follow their own private signal in case of a tie (a standard tie-breaking rule). So P2 chooses $R$.
  *   **Informational Content:** High. P2's action reveals they saw $l$.

  **Person 3 (The Tipping Point):**
  *   **History:** P1 chose $A$, P2 chose $A$. (This implies P1 saw $h$, P2 saw $h$).
  *   **Private Signal:** Person 3 gets signal $l$.
  *   **Calculation:** Person 3 weighs the public history against their private signal.
      *   Public evidence: Two $h$ signals.
      *   Private evidence: One $l$ signal.
      *   Net evidence: One $h$ signal in favor of $G$.
  *   **Decision:** Even though Person 3's own eyes tell them "Bad" ($l$), the weight of the two previous people suggests "Good" ($h$). A rational Bayesian maximizes expected payoff. The probability of $G$ is now $2/3$. Person 3 chooses **$A$**.

  ### 3. The Mechanism: Informational Shutdown

  Here is the critical gear shift.

  **Person 4:**
  *   **History:** P1=$A$, P2=$A$, P3=$A$.
  *   **Analysis:** Person 4 is a rational Bayesian. They need to infer what signals lie behind these actions.
      *   P1 chose $A \rightarrow$ P1 must have seen $h$.
      *   P2 chose $A \rightarrow$ P2 must have seen $h$.
      *   **P3 chose $A \rightarrow$ What did P3 see?**
  *   **The Inference:** Person 4 knows the decision rule Person 3 faced. Person 4 knows that if P3 saw $h$, they would choose $A$. But Person 4 *also* knows that **if P3 saw $l$, they would ALSO choose $A$** (because the weight of P1+P2 outweighs a single $l$).
  *   **The Result:** Person 3's action is **uncorrelated** with Person 3's signal. P3 would have chosen $A$ regardless of what they saw.
  *   **Informational Value:** Zero. Person 3's action adds no new data to the pool. It is an echo of P1 and P2.

  **Person 5 through 300:**
  *   They face the exact same calculation as Person 4.
  *   They know that Persons 4, 5, ... 299 were all in a cascade. They know those people ignored their private signals.
  *   Therefore, the actions of persons 3 through 299 contain **zero information** about the state of the world.
  *   The total public evidence available to Person 300 is exactly the same as the total public evidence available to Person 4: **Two $h$ signals.**

  This is why 300 people is not stronger than 3 people. The "300" is an illusion of independence. The effective sample size is frozen at the moment the cascade began (in this example, at 2).

  ### 4. Why It Is Fragile

  You asked why one piece of public info can flip the crowd.

  Imagine Person 301 arrives. They see 300 people choosing $A$. But as we established, they know this represents only **2 units of evidence** favoring $A$.

  Now, suppose a "Public Signal" arrives (e.g., a regulator report, a news leak) that is equivalent to one High signal ($h$).
  *   Current Balance: 2 $h$ vs 0 $l$.
  *   New Public Signal: 1 $h$.
  *   Total: 3 $h$.
  *   Result: Reinforces $A$.

  But suppose the Public Signal is a **Low signal ($l$)** equivalent (e.g., a credible report saying "This is bad").
  *   Current Balance: 2 $h$ (from the cascade founders).
  *   New Public Signal: 1 $l$.
  *   Total: 2 $h$ vs 1 $l$.
  *   Result: Still favors $A$.

  Wait, that didn't flip it. To flip it, the public info needs to outweigh the **founders**.
  If the public info is strong enough to equal **3 $l$ signals**, it flips the cascade.
  But the key insight is: **The public info is weighed against the 2 founders, not the 300 followers.**

  If the cascade had been based on 300 *independent* signals, you would need 300 units of contrary evidence to flip it. Because the cascade is based on 2 independent signals, you only need 3 units of contrary evidence to flip it.

  The crowd is brittle because the "weight" of the crowd is fake weight. It is structural momentum, not evidentiary mass.

  ### 5. Why Everyone is Rational (The Externality)

  This is the part that feels unfair. Person 300 knows their action doesn't convey information. Are they being irrational by not trying to "signal" their true private info to help Person 301?

  **No.** In the standard BHW model, agents are myopic utility maximizers.
  *   **Person 300's Incentive:** Maximize the probability that *they* choose the correct option *now*.
  *   **The Math:** Given the history (2 $h$ signals), the probability the World is $G$ is roughly 80%. Even if Person 300's private signal is $l$, the posterior probability of $G$ is still > 50%.
  *   **The Choice:** To maximize their own payoff, Person 300 *must* ignore their signal and follow the crowd. If they followed their signal, they would be lowering their own expected payoff.

  **The Externality:**
  Person 300's action creates a positive externality for future agents (by adding to the public history) but a negative informational externality (by hiding their private signal).
  *   Because they are paid only on their own accuracy, they ignore the value of their information to others.
  *   They are "rationally" contributing to the "irrational" fragility of the system.
  *   There is no mechanism for Person 300 to say, "I'm choosing $A$, but I actually saw $l$." They can only choose $A$ or $R$. Since choosing $R$ hurts them personally and won't necessarily break the cascade (Person 301 might think 300 was just noisy), they stick with $A$.

  ### Summary of the Mechanism

  1.  **Independence Assumption:** Your intuition that "300 > 3" relies on the assumption that the 300 choices are independent samples.
  2.  **Decoupling:** In a cascade, the decision rule changes. Agents stop mapping Signal $\rightarrow$ Action. They start mapping (History + Signal) $\rightarrow$ Action.
  3.  **Saturation:** Once History outweighs any single Signal, the mapping becomes History $\rightarrow$ Action. The Signal is dropped from the function.
  4.  **Inference:** Observers (Person $N+1$) know the decision rule. They see the Action. They deduce that the Signal was dropped. They extract zero information from the Action.
  5.  **Stagnation:** The public information pool stops growing. It stays frozen at the level it was when the cascade started.
  6.  **Fragility:** Because the pool is small (just the founders), it takes very little new public information to overwhelm it.

  The "bug" isn't in the people; it's in the **channel**. The channel (observable actions) has a lower bandwidth than the source (private signals). Once the channel is saturated by the early movers, the later movers' data is packet-dropped. The system isn't aggregating 300 minds; it's broadcasting 2 minds 300 times.
