answer: |-
  Good morning. For those who don't know me, I'm [Your Name], her oldest grandchild.

  When we started planning this, I asked my mother what I should say about where Grandma is now. My mother told me that, according to Grandma's will, I am under strict instructions not to say she has "gone," or that she is "lost," or even that she has "passed away." Those phrases, she told me, imply that a person is something that exists wholly in the present moment, and then suddenly doesn't. And Grandma spent thirty-two years arguing that that just isn't true.

  So, if you take nothing else from what I say today, please take this: She asked me to tell you that she has not stopped existing. She has simply stopped getting longer.

  I know that sounds strange. I know that for many of you, especially right now, the pain of grief feels like an absence. It feels like a hole where she used to be. When I was younger, I used to argue with her about this at Thanksgiving. I'd ask her if that meant I could still talk to her past self. She'd smile, sip her tea, and tell me that I was confusing *access* with *existence*.

  She believed that we are not just points of light flickering in the "now." She believed we are more like melodies. A melody isn't just the note being played right this second. The notes that came before, and the notes that follow, are all part of the same song. Even when the song ends, the music doesn't cease to have been. It is a complete thing.

  To her, you and I are four-dimensional creatures. We are stretched out through time the way a body is stretched out through space. When we visit her grave, we are standing at the very end of her shape. But her beginning, and all the moments in between, are just as real as this Saturday morning. They haven't vanished. They are just located elsewhere in time.

  For the philosophers here—her colleagues and students—she would want me to be precise: she is a complete space-time worm. All her temporal parts are equally real. The toddler learning to read, the professor grading papers in 1995, and the grandmother teaching me to drive are all existent coordinates in the universe. None of them have been erased.

  But I am not a philosopher. I'm just a senior who took "Big Questions" because she told me to. And from where I stand, her view offers a kind of comfort that I think even my Great-Uncle can respect, in his own way.

  It means that nothing she loved is actually gone. The laughter we shared at Christmas, the advice she gave me when I was scared about college, the quiet afternoons in her study—those aren't memories that fade. They are permanent features of reality. She isn't watching over us from above, but she is also not lost to nothingness. She is held safe in the structure of her own life, which is finished, whole, and unchangeable.

  She didn't believe in a heaven where things get better. She believed that *this*—the life she lived, the arguments she had, the love she gave—was already real enough to last forever.

  So, we are not here to mourn a disappearance. We are here to honor a completed shape. And while I wish, selfishly, that her timeline had extended further, I am grateful for every cross-section I was lucky enough to occupy.

  She stopped getting longer. But she is here. And she is real.

  Thank you.
