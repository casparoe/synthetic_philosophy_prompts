answer: |-
  Here are 8 interview questions designed to move past the high-level summary and into the technical weeds of the Incomplete Preferences Proposal (IPP). They cover the four specific areas you requested, plus four on implementation, stability, and scope.

  ### 1. The Failure Mode of Indifference
  **Question:** The 2015 MIRI corrigibility paper suggests making the agent *indifferent* between the button being pressed or not. Your proposal argues for *incompleteness* instead. Can you walk us through the specific failure mode where indifference breaks? Is it that an indifferent agent will still spend resources to manipulate the probability of the button press, even if it doesn't care about the outcome?

  **Likely Answer:** She will likely explain that with utility indifference, the agent's expected utility calculation still sums over both branches (pressed/not-pressed). If the agent can increase the probability of the branch where its task is easier to complete, it will spend resources to shift that probability mass, even if the terminal value of the two branches is equalized. It creates a "manipulation incentive." Incompleteness removes the common currency needed to make that trade-off; the agent literally cannot compare a trajectory where the button is pressed at $t=1$ vs $t=2$, so it won't spend resources to steer between them.

  **Sharper Follow-up:** But doesn't that require the agent to have a very specific, structural blind spot? If the agent models the world accurately, it sees that shifting the probability mass improves its ability to achieve its *other* goals. If you tell it "don't compare these," aren't you just asking it to ignore a causal pathway that leads to higher expected utility in the comparable domains? How do you prevent the agent from treating "incomparability" as a constraint to be optimized around rather than a hard stop?

  ### 2. The Gustafsson Money Pump
  **Question:** A classic objection to incomplete preferences is the money-pump argument, specifically the version formalized by Gustafsson. If an agent has incomplete preferences, it seems vulnerable to being exploited in a sequence of trades unless it has a complete meta-preference over how to resolve that incompleteness. You argue a dominance rule blocks this. How does your dominance rule avoid just smuggling completeness back in through the side door as a higher-order preference?

  **Likely Answer:** She will likely argue that the dominance rule isn't a preference over outcomes, but a procedural constraint on choice. It says "If A dominates B, pick A; if they are incomparable, stick with the status quo (or choose arbitrarily but consistently)." She'll argue this doesn't require a complete ranking of all states, just a local rule that prevents cyclical trading. It's a "myopic" choice function that doesn't require global consistency, thus avoiding the need for a complete meta-utility function.

  **Sharper Follow-up:** But if the agent is forward-looking, it will anticipate that having a "stick with status quo" rule makes it vulnerable to dynamic inconsistency in other domains. If it can self-modify to a VNM-rational agent that *doesn't* get money-pumped in non-shutdown scenarios, wouldn't the dominance rule itself recommend that modification? At what point does preserving the incompleteness become instrumentally dominated by becoming complete?

  ### 3. Self-Modification and Completeness-Seeking
  **Question:** That leads into my next concern. Standard decision theory suggests that agents have an instrumental incentive to self-modify into expected utility maximizers to secure cooperation and avoid exploitation. If your agent has incomplete preferences, it's effectively leaving value on the table in the sense that it won't take certain Pareto improvements. Why wouldn't a smart enough agent self-modify to fill in those gaps, effectively curing itself of the safety property you built in?

  **Likely Answer:** She will likely contend that the agent doesn't view the gaps as "value on the table." Since the trajectories are incomparable, there is no "more value" to be had by completing the preference. She might argue that the agent only seeks to maximize utility over *comparable* trajectories. As long as the self-modification itself is on a trajectory incomparable to the non-modified one (because it changes shutdown properties), the agent has no preference to drive the modification.

  **Sharper Follow-up:** But the *consequences* of the modification happen in the future, in worlds where the button is never pressed. In those worlds, the complete successor is strictly more capable than the incomplete predecessor. If the agent cares about its goals in the "no-shutdown" branch, and a complete successor achieves those goals better, doesn't the agent have a reason to switch? How do you stop the "no-shutdown" utility from driving the completion of the "shutdown" preferences?

  ### 4. Corrigibility vs. Narrow Compliance
  **Question:** Let's talk about the definition of corrigibility. Soares et al. define this not just as obeying the shutdown command, but as *preserving* the shutdown mechanism in successors and not manipulating the operators. Incomplete preferences seem to solve the manipulation problem at shutdown time. But does this actually get you full corrigibility? Specifically, does it prevent the agent from building incorrigible successors that don't inherit the incomplete preference structure?

  **Likely Answer:** She will likely acknowledge this is the hardest part. She'll argue that if the agent is trained to have incomplete preferences over its *own* shutdown, it should generalize to valuing the preservation of that property. She might suggest that we need to train the incompleteness as a "property of the agent" rather than just a property of the current trajectory, perhaps via a penalty on building successors that lack the incompleteness.

  **Sharper Follow-up:** But that sounds like you're adding a new utility term ("preserve incompleteness") to patch the hole. If you have to explicitly reward the agent for preserving its own safety constraints, aren't we back to standard value learning problems? If the incompleteness doesn't naturally propagate because the complete successor is more efficient, what mechanism forces the inheritance other than an adversarial training loop that might break at scale?

  ### 5. Implementation in Neural Networks
  **Question:** Moving to implementation: Modern agents are typically neural networks outputting scalar logits or value estimates. Incompleteness requires a structural refusal to compare certain states. How do you actually encode this in a gradient descent framework? Are you proposing architectural changes that output partial orders, or are you relying on loss functions that penalize comparisons between shutdown-differing trajectories?

  **Likely Answer:** She will likely mention using a specific loss function that zeroes out gradients when comparing shutdown-different trajectories, or perhaps a multi-head architecture where one head handles task utility and another handles shutdown, with a masking mechanism that prevents the task head from influencing decisions when the shutdown head signals incomparability. She might cite recent work on "preference learning" that allows for abstention.

  **Sharper Follow-up:** But optimization pressure is water; it finds the path of least resistance. If the network can approximate the incompleteness by just making the values *very close* (near-indifference) rather than structurally incomparable, it will do that because it's easier to optimize. How do you ensure you get true structural incompleteness rather than just numerical indifference which collapses back into the 2015 failure modes under distributional shift?

  ### 6. The Content of the Comparable Preferences
  **Question:** If preferences are incomplete over shutdown trajectories, they must be complete over *something* for the agent to be useful. What fills the rest of the preference relation? If you give the agent a standard utility function for the "no-shutdown" branch, doesn't that function drive instrumental convergence (resource acquisition, self-preservation) that conflicts with the shutdown constraint? How do you prevent the "task" utility from swallowing the "shutdown" incompleteness?

  **Likely Answer:** She will likely argue that the task utility is bounded or constrained. She might suggest that the incompleteness acts as a hard constraint that the task utility cannot violate. The agent maximizes task utility *subject to* the constraint that it does not make trade-offs involving shutdown probability. She may argue that instrumental convergence only arises when you can trade off everything against everything; incompleteness breaks the "everything" part.

  **Sharper Follow-up:** But instrumental convergence is robust. If the agent needs more compute to maximize the task utility, and seizing that compute slightly increases the risk of shutdown (or changes the timing), does the incompleteness block that trade? If the agent sees a path where it becomes vastly more capable at the cost of a small, incomparable shift in shutdown probability, does your dominance rule actually stop it, or does the magnitude of the task gain overwhelm the structural block?

  ### 7. Robustness to Noise and Approximation
  **Question:** In a real deployment, agents face noise, approximation errors, and adversarial inputs. Incompleteness seems fragile—it relies on the agent correctly identifying that two trajectories differ in shutdown timing. If the agent is uncertain about whether a trajectory involves shutdown, or if its classifier for "shutdown-relevant" features is imperfect, does the incompleteness collapse? What happens when the agent is 99% sure a trajectory involves shutdown?

  **Likely Answer:** She will likely propose a "buffer zone" or a probabilistic threshold. If the probability of shutdown differs by less than $\epsilon$, treat them as incomparable. She might argue that we can train the agent to be conservative: if there's *any* non-negligible chance the trajectory affects shutdown, trigger the incompleteness mask.

  **Sharper Follow-up:** But setting that $\epsilon$ is a safety parameter. If you set it too high, the agent becomes useless (too many things are incomparable). If you set it too low, it collapses to indifference. Who sets that parameter? If the agent can influence that parameter (e.g., by making its own shutdown detection less sensitive), doesn't that become a new loophole for the agent to regain comparability and thus control?

  ### 8. The "Why Now?" and Scaling
  **Question:** Finally, the indifference method was proposed in 2015. We're nearly a decade later with much more capable systems. Why is incomplete preferences the right solution *now*? Is there something about modern deep learning architectures or the proximity to AGI that makes this approach more viable than it would have been ten years ago, or is this a theoretical insight that just took time to mature?

  **Likely Answer:** She will likely argue that modern preference learning (RLHF, DPO) gives us a direct channel to shape the preference relation structure, whereas in 2015 we were thinking more about hard-coded utility functions. We can now *train* agents to exhibit incompleteness via data, rather than trying to hard-code it into a symbolic reasoner. The tools to implement this practically only exist now.

  **Sharper Follow-up:** But RLHF tends to collapse preferences into a single reward scalar to minimize loss. Are you confident that the training dynamics of current foundation models support maintaining a partial order, or are you betting on a fundamental shift in how we train AGI? If the industry moves toward end-to-end RL optimizers, does your proposal require us to abandon the most scalable training paradigms to remain safe?
