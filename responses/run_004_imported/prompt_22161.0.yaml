      *   **Topic:** Alan Turing's 1950 paper "Computing Machinery and Intelligence" (specifically his treatment of telepathy/ESP) vs. Daryl Bem's 2011 "Feeling the Future" experiments (precognition).
      *   **Key Observation:** Turing took ESP seriously based on the statistical evidence of his time (Zener cards, etc.) and even proposed a "telepathy-proof room." Bem published significant-looking results using standard methods, which later failed replication and contributed to the "replication crisis" in psychology.
      *   **Question:** How would Turing have reacted to the Bem affair (claims + fallout)? Would it change his views on statistical evidence and the seriousness of ESP in the Imitation Game?

