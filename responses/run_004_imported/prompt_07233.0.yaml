prompt: |-
  Okay so last night I got into a whole thing with my friend Priya about Kepler, of all people - shed read somewhere that his astrology stuff was basically just a paycheck (the annual prognostications, casting Wallenstein's horoscope, all that) and that deep down he thought it was garbage, and I was trying to argue its way messier than that - like, he trashed the zodiac-sign-and-houses stuff pretty mercilessly, but he also put real effort into trying to put astrology on sounder footing (that pamphlet on the "more certain fundamentals" of it, the book where he basically wedges himself into the middle of a dispute between a full-on skeptic and a traditional astrologer), and he clearly believed there was an actual causal story involving the angles between planets - the aspects - resonating with the soul the same way certain ratios make musical intervals sound consonant instead of ugly. We went back and forth for like an hour and neither of us landed the plane, so now I'm annoyed and want to actually get this right.

  Convenient timing: I co-host a tiny history-of-science podcast and we've got a historian booked next month whose whole research focus is Kepler's astrological writings - Tertius Interveniens, the harmonics-of-aspects material in Harmonices Mundi, the weather diaries where he was literally logging aspects against rainfall to check himself. I really don't want the interview to just end with her reciting the "foolish daughter of astronomy" line and everyone nodding like that settles it. Can you draft me 8 to 10 interview questions that push into the actual mechanics of the view? I want at least one question that forces her to address the sincerity/money tension directly (can "he needed the income" and "he had a principled theory" both be true, and if so how do we tell which parts he actually believed vs. just tolerated for cash), one on what's supposedly doing the causal work in the aspects theory if it isn't the "occult influence" stuff he mocked other astrologers for leaning on, and one that ties the astrology tightly to the harmonic/geometric project running through the rest of his cosmology instead of letting it get treated as a weird detour from the "real" science. For most of these, tack on a quick follow-up question anticipating the deflection she'll probably reach for, so I don't just end up sitting there nodding along. Basically I want questions specific enough that someone who's only ever heard the pop-science version of Kepler couldn't bluff their way through answering them.
