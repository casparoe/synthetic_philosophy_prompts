answer: |-
  **The Ghost in the Equations: Why Structural Realism Saves Science from the Ether**

  As an experimentalist, you know better than most that instruments rarely lie, but interpretations often do. You have spent a career manipulating light, likely relying on equations derived by men who believed light was a vibration in a jelly-like cosmic solid. Larry Laudan's pessimistic meta-induction (PMI) strikes at the heart of this experience: if the ether was a fiction, and phlogiston was a fiction, why should we believe electrons are not fictions too? If realism requires belief in the literal truth of a theory's ontology, Laudan wins. History is a graveyard of real entities.

  However, John Worrall's epistemic structural realism (ESR) offers a way out. It suggests that while the *nature* of the entities (the relata) may change or vanish, the *structure* of the relations between them (the equations) is preserved and accumulates. The case of Fresnel and Maxwell is the linchpin of this argument. Fresnel derived his equations of light reflection and refraction based on a mechanical model of the luminiferous ether. Maxwell later demonstrated that light was an electromagnetic wave, rendering the mechanical ether obsolete. Yet, Fresnel's equations survived intact within Maxwell's theory.

  The question is whether this structural continuity is enough to rescue scientific realism, or if it merely retreats to a defensible but trivial position. Weighing Worrall's insight against M.H.A. Newman's devastating objection, I argue decisively: **Yes, structural continuity is enough to rescue realism, but only if we accept that "structure" is not merely a mathematical mapping, but a physically constrained constraint on reality.** To deny this is to make the success of science a miracle; to accept it is to redefine realism not as a belief in "things," but in "relations."

  ### The Fresnel-Maxwell Continuity

  Worrall's argument rests on the intuition that it would be a cosmic coincidence if a theory based on a completely false ontology (the elastic ether) yielded equations that remained empirically adequate after the ontology was discarded. Fresnel treated the ether as a solid medium with specific rigidity and density. We now know there is no such medium. If the theory were wholly false, the equations should have collapsed when the foundation was removed. They did not.

  Maxwell subsumed Fresnel's optics into electromagnetism. The *objects* changed (from mechanical displacements to field vectors), but the *mathematical form* describing the propagation of light remained continuous. For the structural realist, this is not a lucky accident. It indicates that Fresnel had latched onto the real structural relations of the world, even if he misidentified the bearers of those relations. This preserves the "No Miracles" intuition: the theory works because it captures something real about the world's architecture. Laudan's PMI is defused because the history of science is not a history of total falsity, but of structural preservation amidst ontological revision.

  ### The Newman Objection: Is Structure Too Thin?

  However, the victory is threatened by the Newman objection. In 1928, M.H.A. Newman argued that if a theory claims only that the world has a certain structure (a set of relations), this claim is trivially true. Given any collection of objects, if the cardinality (number of objects) is sufficient, one can always define relations between them that satisfy the mathematical structure of the theory.

  If structural realism says, "We only know the structure, not the nature of the relata," Newman replies: "Then you know almost nothing." Any domain of the right size can be made to fit the structure. If I claim the universe has the structure of a group, I can find a set of objects that fits that group. If structure is divorced from the specific nature of the things being related, the claim becomes a tautology of set theory rather than a substantive claim about physical reality. If Worrall's realism is correct only in this trivial sense, it saves realism by emptying it of content. It relocates the problem from "false entities" to "trivial relations."

  ### The Verdict: Structural Realism is the Only Realism Worth Having

  Despite the force of Newman's logic, I maintain that structural continuity **is** enough to rescue realism. However, this verdict requires rejecting the premise that structure is merely logical or mathematical. Newman's objection holds only if we treat scientific structure as an abstract isomorphism imposed on the world. But in physics, structure is *empirically constrained*.

  The "No Miracles" argument is the hammer that breaks Newman's shield. Newman treats structure as something we can freely assign to a set of points. But Fresnel's structure was not assigned; it was *discovered* through its ability to predict novel phenomena (such as the bright spot in the shadow of a circular obstacle, the Poisson spot). The miracle is not that *a* structure can be found to fit the data (Newman's point); the miracle is that *this specific* structure, derived from a specific theoretical framework, constrains future observations with high precision.

  If structural realism were trivial, any structure would do. But in optics, most structures fail. Only the specific wave-structure survived the transition from ether to field. Therefore, the structure is not a free logical variable; it is a rigid constraint imposed by the world on our theories. To say the structure is "real" is to say that the world possesses an objective topology that limits which mathematical relations can be empirically successful. This is a substantive claim, not a trivial one.

  ### Defending Against the Strongest Objection: Relations Without Relata

  The strongest objection to this verdict is not Newman's triviality charge, but the metaphysical charge that **structure cannot exist without relata.** This is the "relations need things" objection. Critics argue that a web of relations is incoherent if there are no nodes to hold the web together. If we deny knowledge of the relata (the ether, the field substance), are we not left with a "structure" that is essentially a verb without a noun? If structural realism cannot account for what is being structured, it fails as a realism about the *world*, retreating instead to a realism about *models*.

  To defend the verdict, we must bite the bullet: **The world does not require "things" in the classical sense to support structure.** This is not a philosophical dodge; it is what modern physics tells us. In General Relativity, spacetime is a dynamic structure; there is no "container" separate from the metric field. In Quantum Field Theory, particles are excitations of fields, not little billiard balls. The distinction between "object" and "structure" is a legacy of Aristotelian substance metaphysics, not a requirement of ontology.

  When Fresnel wrote his equations, he thought the relata were bits of ether. When Maxwell read them, he understood the relata as field states. The "thing" changed, but the *constraint* on how those states interact remained. The realism lies in the constraint. To object that "relations need relata" is to insist that the universe must conform to human macroscopic intuition (that there must be "stuff"). But if the history of science teaches us anything, it is that the universe is under no obligation to be made of "stuff" as we conceive it.

  Therefore, the objection fails because it presupposes an ontology of substances that physics has already outgrown. Structural realism saves realism precisely by forcing us to abandon the demand for "relata" in the classical sense. We are realists about the *architecture* of the universe, not the *bricks*.

  ### Conclusion

  Laudan is right that we have no license to believe our current ontology is final. The ether is dead, and the electron may one day join it. But Worrall is right that this does not condemn us to anti-realism. The survival of Fresnel's equations is not a coincidence; it is evidence of structural accumulation.

  Newman's objection warns us that structure alone is thin, but it is not trivial when bound by empirical success and predictive novelty. The "No Miracles" argument confirms that the specific structure we have found is not one of many logical possibilities, but the one mandated by physical reality.

  So, does structural continuity rescue realism? **Yes.** But it rescues it by transforming it. It asks us to accept that the universe is not a collection of objects waiting to be named, but a network of relations waiting to be mapped. For an optician, this should be a comfortable homecoming. You do not measure the "essence" of light; you measure its behavior, its interference, its polarization. You measure its structure. To believe that those measurements reflect a real, mind-independent architecture is not a retreat from realism. It is the only form of realism the light will allow.
