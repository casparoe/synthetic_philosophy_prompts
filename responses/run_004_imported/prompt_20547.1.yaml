answer: |-
  It is a genuine pleasure to correspond with someone who sees the structural isomorphism between the "Bourgeois" strategy in evolutionary biology and Lewisian convention. You have hit on the exact intellectual lineage: Lewis was writing *Convention* (1969) in the wake of Schelling's *The Strategy of Conflict*, deeply immersed in the game theory that you spent your career applying to reef fish. The "Bourgeois" strategy (Owner wins, Intruder retreats) is an Evolutionarily Stable Strategy (ESS) precisely because it is a coordination equilibrium that is arbitrary (the "Anti-Bourgeois" would also work) and self-perpetuating.

  Your discussion group has stumbled onto one of the most persistent critiques in social ontology. Walt and Sonia are re-enacting a debate that has been going on since the 1980s, often framed as "Lewis vs. Gilbert" or "Coordination vs. Bargaining."

  Here is the adjudication of their moves based on Lewis's text, followed by a verdict on the theoretical gap.

  ### Adjudication of Moves

  **Move (1): Walt's Claim (Tipping fits the behavioral criteria)**
  *   **Verdict:** **Basically Right.**
  *   **Analysis:** Walt is correct on the surface features of Lewis's definition.
      *   *Regularity:* Americans generally tip.
      *   *Expectation:* Diners expect others to tip; servers expect diners to tip.
      *   *Common Knowledge:* Everyone knows that everyone knows this.
      *   *Arbitrariness:* This is the key Lewisian condition. Lewis argues a convention is arbitrary if there is an alternative regularity that *could* have solved the problem. A "living wage included in menu prices" system is a genuine alternative equilibrium. We could have coordinated on that instead, just as we could have coordinated on driving on the left.
      *   Walt is right that tipping fits the *descriptive* machinery of Lewis's definition.

  **Move (2): Sonia's Claim (Fails the "Coordination Problem" test)**
  *   **Verdict:** **Onto Something Real.**
  *   **Analysis:** Sonia is targeting the *preconditions* of Lewis's definition, not just the outcome. Lewis defines a convention as the solution to a **coordination problem**. For Lewis, a coordination problem requires a "coincidence of interest."
      *   In a pure coordination problem (driving on the left/right), I don't care which side we pick, so long as we match.
      *   In an *impure* coordination problem (Lewis admits these exist), we prefer different matching outcomes (e.g., I prefer we meet at the park, you prefer the cinema), but we both prefer *matching* to *not matching*.
      *   Sonia argues tipping isn't even an impure coordination problem because the interests are too opposed. Owners want low labor costs; servers want high income; diners want low meal costs. She suggests this is a **bargaining problem** (conflict over distribution) rather than a **coordination problem** (cooperation to produce a surplus).
      *   Lewis would reply that there *is* a coincidence of interest: everyone prefers a functioning restaurant industry to chaos. But Sonia is right to press that the *specific* equilibrium (tipping) benefits some parties significantly more than others, which strains the "coincidence" language.

  **Move (3): Walt's Rebuttal (Impure coordination & conditional preference)**
  *   **Verdict:** **Basically Right (on Lewis's terms).**
  *   **Analysis:** Walt is correctly citing Lewis's handling of mixed motives. Lewis explicitly states that conventions can arise in situations where interests do not perfectly coincide, provided the interest in *coordination itself* predominates.
      *   The "Conditional Preference" criterion is the heavy lifter here: *Given that everyone else tips, do I prefer to tip?* For the diner, the answer is usually yes (to avoid social sanction, guilt, or poor future service). *Given that diners tip, do servers prefer the system?* Yes.
      *   Walt is right that Lewis's definition is functionalist. It asks: "Does this norm stabilize expectations?" It does not ask: "Is this norm fair?" If the conditional preference holds, Lewis classifies it as a convention, even if the equilibrium is unequal.

  **Move (4): Sonia's Counter (Over-expansion/Exploitation)**
  *   **Verdict:** **Onto Something Real (The Theoretical Gap).**
  *   **Analysis:** This is the strongest philosophical move. Sonia is arguing that if Walt is right, Lewis's definition is *too broad* to be useful for distinguishing social norms from entrenched power dynamics.
      *   If a norm is maintained solely because the disadvantaged party prefers conformity (tipping) to the punishment of non-conformity (social shaming/bad service), does that count as a "coincidence of interest"?
      *   Lewis assumes preferences are exogenous and fixed. Sonia is hinting that preferences might be adaptive or coerced. If the "conditional preference" is driven by threat rather than mutual benefit, calling it a "convention" sanitizes the power dynamic.
      *   She is identifying that Lewis's framework lacks a mechanism to distinguish between *coordination* (we agree to drive on the right) and *acquiescence* (I pay the protection money because everyone else does). Both fit the game-theoretic structure of an equilibrium, but they feel different socially.

  ### The Verdict: Is Tipping a Lewis Convention?

  **Technically: Yes.**
  By the strict letter of Lewis's definition, tipping is a convention. It is an arbitrary equilibrium (we could have chosen wages), it is self-perpetuating through expectations, and individuals prefer to conform conditional on others conforming. Walt wins the exegesis of Lewis. Lewis's theory is descriptive, not normative; it explains how norms *stick*, not whether they are *just*.

  **Philosophically: Sonia has found the gap.**
  Sonia is correct that this reveals a limitation in Lewis's framework when applied to normative social structures. Lewis treats all equilibria as essentially the same kind of object. But in social philosophy, we often want to distinguish between:
  1.  **Conventions proper:** Where the coincidence of interest is high (traffic laws, language, the Bourgeois strategy in fish).
  2.  **Social Norms/Institutions:** Where the equilibrium is maintained by power, sanction, or unequal bargaining power (tipping, certain gender roles, class structures).

  Lewis lumps these together because, game-theoretically, they function identically (they are both Nash Equilibria sustained by common knowledge). But Sonia is right that this lumps "coordination" with "compliance."

  ### The Biological Analogy (For your intuition)

  Think back to your reef fish. The **Bourgeois** strategy (Owner wins) is stable. But imagine a mutation arises where larger fish always win, regardless of ownership ("Bigger is Better").
  *   If the population shifts to "Bigger is Better," it is still an ESS.
  *   It is still "arbitrary" in the sense that "Smaller is Better" could theoretically be stable (though biologically unlikely).
  *   But the *payoff structure* is different. "Bourgeois" reduces conflict costs (no fighting needed, just check residency). "Bigger is Better" might encourage constant testing of size.

  In the tipping case:
  *   **Walt** sees the "Bourgeois" aspect: We have a rule (Tip) that prevents the chaos of no-rule (No Service/No Income). It solves the coordination problem of "How do we transact?"
  *   **Sonia** sees the payoff matrix: The "Bourgeois" rule happens to favor the "Owners" (who set the wage structure) over the "Intruders" (Diners) or the "Residents" (Servers). She is asking whether a rule that systematically advantages one group at the expense of another should be called a "convention" (implying mutual agreement) or a "regime."

  ### Conclusion

  You can tell your group that **Walt is right about Lewis, but Sonia is right about the world.**

  Lewis's theory was designed to explain language and traffic, where the "coincidence of interest" is obvious (we all want to understand each other; we all want to not crash). When applied to economic norms like tipping, the "coincidence" is murky.

  Sonia has put her finger on a real gap: Lewis's definition is **structurally sufficient** but **sociologically thin**. It captures the *mechanism* of stability (expectations/equilibrium) but misses the *texture* of the stability (consent vs. coercion). Tipping counts as a Lewis convention, but acknowledging that forces us to admit that Lewisian conventions can be exploitative. That doesn't break Lewis's theory, but it does require us to stop treating "convention" as a benign word and recognize it as a neutral technical term for *any* self-perpetuating arbitrary equilibrium—including the unjust ones.
