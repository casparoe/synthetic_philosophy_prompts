      *   Check constraints: No "on the one hand, on the other hand" equivocation. Pick a side. (I'm picking Rupture).
      *   Check Arendt specifics: Mention *factual truth* vs. *rational truth*. Mention the "defense of reality."

  7.  **Final Output Generation:** (This matches the provided good response.)
