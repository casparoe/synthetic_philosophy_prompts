answer: |-
  This is a fantastic question that cuts to the heart of **epistemology** (the study of knowledge) and the philosophy of history. You have stumbled upon a debate that has occupied philosophers for centuries.

  Your classmate is arguing from a position called **radical skepticism**. His specific arguments—that sources lie, memory is fallible, and reality could be manipulated (the rewritten textbook)—are modern versions of thought experiments dating back to ancient Greece and René Descartes.

  Here is the breakdown of who is right, who is wrong, and why you can still claim to "know" history.

  ### 1. Your Classmate's Point: Certainty vs. Knowledge
  Your classmate is technically correct about one thing: **We cannot have absolute, metaphysical certainty about the past.**

  If by "know," you mean "it is logically impossible for me to be wrong," then he is right. You cannot prove with 100% logical necessity that the textbook wasn't rewritten overnight, just as you can't prove you aren't a brain in a vat being fed electrical signals right now.

  However, he is making a category error. He is conflating **certainty** with **knowledge**.
  *   **Math/Logic:** We can have certainty here (2+2=4).
  *   **History/Science/Law:** We deal in **evidence and probability**, not certainty.

  In history, "knowledge" is defined as **inference to the best explanation.** We look at the available evidence (documents, archaeology, carbon dating, consistent accounts) and ask: *What is the most reasonable explanation for all of this?*
  *   **Explanation A:** The event happened, was recorded by multiple independent sources, and left physical traces.
  *   **Explanation B:** A massive, silent conspiracy rewrote all records, altered all physical evidence, and fooled every historian for centuries, just to trick you specifically.

  Explanation A is not "certain," but it is overwhelmingly more probable. To say you don't "know" history because you lack Cartesian certainty is like saying you don't "know" it will rain tomorrow because you can't see the future. It sets a bar for "knowledge" that is impossible to clear in the real world.

  ### 2. The Classmate's Contradiction: Pragmatism
  You noticed something crucial: **He doesn't live like a skeptic.** He studies for tests and argues about game scores.

  This is the strongest argument against his position. The 20th-century philosopher Ludwig Wittgenstein called this **"hinge propositions."** These are basic assumptions (e.g., "the world exists," "the past happened," "my memory is generally reliable") that must remain fixed for us to function. If you try to doubt everything at once, language and action become impossible.

  By studying for the test, your classmate admits that **pragmatically**, the history matters and is real. By arguing about the game score, he admits that **evidence** (the scoreboard, witnesses) counts. His behavior proves that deep down, he accepts that we can distinguish between truth and falsehood, even if his words deny it. This is sometimes called "performative contradiction."

  ### 3. The Teacher's Reaction: Pedagogy vs. Philosophy
  Was the teacher right to wave it off?
  *   **Pedagogically:** Perhaps. A history class is designed to teach historical narratives, analysis, and causality. If every lesson devolves into "How do we know *anything*?", you will never get to the Civil War or the French Revolution.
  *   **Intellectually:** No. It was a missed opportunity. This is a "teachable moment" to explain *how* historians verify sources. The teacher could have said, "That's a great philosophical question, but in this class, we operate on the standard of historical evidence, not philosophical certainty."

  Dismissing it validates the idea that the question is stupid, when actually, it's just outside the scope of the syllabus.

  ### 4. So, Do You "Know" History?
  **Yes.** But you need to understand what that word means in this context.

  You know history in the same way a jury "knows" a defendant is guilty. The jury wasn't at the crime scene. They rely on testimony and evidence. Could they be wrong? Yes. Is it possible the evidence was planted? Yes. But if the evidence is overwhelming, we say they **know** the truth beyond a *reasonable* doubt.

  Your classmate is demanding knowledge beyond *unreasonable* doubt.

  **Here is how you can push back:**
  1.  **Shift the Burden of Proof:** It is not up to you to prove the textbook *wasn't* rewritten overnight. It is up to him to provide evidence that it *was*. Extraordinary claims require extraordinary evidence.
  2.  **Consilience:** History isn't just one person's word. It's when written records match archaeological digs, which match climate data, which match genetic migration patterns. For the "it didn't happen" theory to work, all those independent fields would have to be lying or mistaken in the exact same way.
  3.  **The "So What?" Test:** If his skepticism doesn't change how he acts (he still studies, still eats lunch, still expects the bus to arrive), then it isn't a useful framework for understanding the world. It's just a word game.

  ### Summary
  Your classmate has a **philosophical point** (absolute certainty is impossible) but a **practical failure** (he ignores how we actually navigate the world). Your teacher had a **practical reason** to move on but an **intellectual duty** to acknowledge the depth of the question.

  You do "know" history. You know it through evidence, cross-referencing, and reason. Don't let a definition of "knowledge" that requires magic-level certainty rob you of the very real understanding you are building in that class.
