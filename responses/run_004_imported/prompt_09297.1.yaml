answer: |-
  You are right to be skeptical of Alex's "end of story" claim. While it is a common pop-sci narrative that Mach "won" and Einstein "buried" absolute space, the actual philosophical and physical implications of General Relativity (GR) are much harder on Mach's relationism than that story suggests.

  If you want the strongest argument that Newton effectively wins the ontological debate—meaning that a real, physical spacetime structure exists independently of matter—here is the case.

  ### 1. The Knockout Punch: Vacuum Solutions
  The core of Mach's Principle is the claim that inertia (the resistance to acceleration/rotation) is generated *entirely* by the presence of other mass in the universe. In a strictly Machian universe, if you removed all the stars and galaxies, the concept of "rotation" would vanish. A bucket spinning in a completely empty void should not experience centrifugal forces, because there is nothing relative to which it is spinning.

  General Relativity explicitly forbids this.

  Einstein's Field Equations allow for **vacuum solutions**, where the stress-energy tensor ($T_{\mu\nu}$) is zero everywhere. There is no matter, no radiation, nothing material. Yet, the metric field ($g_{\mu\nu}$), which defines the geometry of spacetime and dictates inertial motion, still exists.
  *   **Minkowski Space:** An empty universe is still flat spacetime. In this void, you can still distinguish between an inertial observer and a rotating observer. A rocket spinning in a completely empty Minkowski universe will still feel G-forces. Its path will still be distinguishable from a geodesic.
  *   **Gravitational Waves:** These are ripples in spacetime that propagate through a vacuum. They carry energy and momentum. If spacetime were merely a set of relations between material bodies, there could be no "waves" of spacetime traveling through nothingness. The fact that the gravitational field has its own degrees of freedom, independent of matter sources, proves it is a physical entity in its own right.

  This is the death knell for strict Machian relationism. In GR, the "stage" does not disappear when the "actors" leave. The structure that defines what is rotating and what is not persists even in the total absence of matter. Newton was right that there must be a "something" to define rotation; he just thought it was a rigid grid called Absolute Space, whereas GR tells us it is a dynamic field called the Metric. But ontologically, they are on the same side: **Substantivalism.**

  ### 2. Rebutting Alex: Reframing Frame-Dragging
  Alex's strongest card is frame-dragging (the Lense-Thirring effect). The argument is: "See? A spinning mass drags the local inertial frames. Therefore, inertia is determined by matter, not space."

  This is a category error. Frame-dragging does not prove that spacetime is relational; it proves that spacetime is a **physical fluid**.

  Consider an analogy: You have a bucket of thick honey. You stir it with a spoon. The honey near the spoon moves.
  *   **Mach's View:** There is no honey. There is only the relationship between the spoon and the bucket walls. The "dragging" is just a change in those relations.
  *   **GR/Substantivalist View:** The honey is the metric field. It is a real substance. The spoon (matter) interacts with the honey (spacetime) and causes it to swirl.

  For frame-dragging to happen, **there must be something there to be dragged.** If inertia were purely relational (only defined by matter), a single spinning shell in a void would have no inertial frames inside it to drag. But in GR, the interior of a spinning shell has a metric structure that gets modified by the shell's rotation. The fact that the metric *responds* to matter doesn't mean the metric *is* matter. It means the metric is a dynamic physical field that couples to matter.

  Alex is confusing **interaction** with **origin**. Yes, matter influences the geometry (the "dragging"). But the *capacity* to have a geometry exists prior to and independent of that influence. The "absolute" structure is the metric field itself. Matter perturbs it, but matter does not create it ex nihilo.

  ### 3. The Hole Argument and Determinism
  There is a deeper philosophical reason why Newton's substantivalism is required to make GR work, known as the **Hole Argument**.

  If you assume strict relationism (that spacetime points have no identity independent of the matter fields), you run into a problem with determinism. You can mathematically shift the metric field inside a region of empty space (a "hole") without changing the matter distribution outside it. If spacetime points aren't "real" substances, these two shifted configurations represent the same physical state. But if they represent the same state, GR becomes indeterministic—the future evolution of the metric isn't fixed by the past.

  To save determinism in GR, you must treat the spacetime manifold and its metric as having a reality independent of the matter placed upon it. You have to say that "Point A" in spacetime is distinct from "Point B" even if no particle is sitting on them. This is a modern, sophisticated resurrection of Newton's Absolute Space. It isn't a rigid, unchanging grid, but it is a **substantival entity** that exists on its own terms.

  ### 4. Why Einstein Was Disappointed
  You mentioned Einstein was disappointed. This is crucial context. Einstein *hoped* GR would fully implement Mach's Principle. He wanted the metric field to be completely determined by matter ($g_{\mu\nu}$ fully caused by $T_{\mu\nu}$).

  But the math didn't allow it. The Field Equations are differential equations that require **boundary conditions**. You have to tell the universe what the spacetime is doing at the edges (or at infinity) to solve for what it does in the middle. Those boundary conditions are not determined by the matter inside the universe; they are independent inputs.

  This independence is the smoking gun. It means the structure of spacetime contains information that is not reducible to the distribution of matter. There is "stuff" in the universe (the geometric structure) that is not "matter."

  ### The Verdict
  Alex is arguing for a version of Mach's Principle that GR explicitly falsifies.
  1.  **Rotation is absolute relative to the metric:** In GR, you rotate relative to the local inertial frames defined by the metric field.
  2.  **The metric exists without matter:** Vacuum solutions prove the field exists without sources.
  3.  **The field is physical:** Gravitational waves carry energy, proving the field is not just a bookkeeping tool for relations.

  Newton's bucket argument was: "The water curves because it rotates relative to **Something Real**."
  Mach's counter was: "That Something Real is just the distant stars."
  GR's conclusion is: "That Something Real is the **Spacetime Metric Field**."

  Mach tried to eliminate the "Something Real" and reduce it to relations between bodies. GR failed to do that. It kept the "Something Real" but made it dynamic instead of static. Therefore, on the fundamental ontological question—"Is there a physical structure defining inertia that exists independently of the matter within it?"—**Newton wins.** The bucket curves because of the spacetime structure, and that structure would still be there, defining rotation, even if the rest of the universe vanished.
