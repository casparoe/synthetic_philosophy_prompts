      *   *Section 3: Why it's not a Computational Limit.* It's about information and value, not computability. We can simulate physics (track everything); we just don't know what to optimize.
      *   *Section 4: Why Alignment Research Looks Different.*
          *   Reward Modeling = Teaching the "what to keep fixed."
          *   Interpretability = Checking if the model grasps the concepts.
          *   Solving the 1969 Frame Problem doesn't give you human values.
      *   *Section 5: The Real Bottleneck (Common Sense/Value).* Acknowledge the grain of truth. The inability to implicitly understand "don't break things" is related to common sense reasoning, which is still hard. But framing it as the 1969 Frame Problem is historically/technically inaccurate.
      *   *Conclusion:* Summarize. The Frame Problem is about *efficiency of change representation*; Alignment is about *complexity of value*.

  5.  **Refining the Tone:**
