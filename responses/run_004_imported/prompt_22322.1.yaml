answer: |-
  This is a sophisticated dispute that cuts to the heart of how we appropriate medieval texts for modern moral philosophy. You and your friend are both grasping real features of the text, but you are prioritizing different layers of Aquinas's argument.

  To adjudicate this, we need to look closely at the architecture of the *respondeo*. It is not a single claim but a three-part argument. Once we separate these moves, we can see where your friend is textually stronger, where you are philosophically stronger, and what this means for the "shaky ancestor" hypothesis regarding contemporary Double Effect (DDE).

  ### 1. Close Reading of the Text

  Aquinas's *respondeo* proceeds in three distinct logical movements.

  **Move 1: The Metaphysics of Action (The DDE Structure)**
  > *"Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention... moral acts take their species according to what is intended, and not according to what is beside the intention..."*

  Here, Aquinas establishes the general moral psychology. An act is defined by its *object of intention*. Effects that are *praeter intentionem* (beside the intention) are "accidental" to the moral species of the act. This is the structural core of what later becomes the Doctrine of Double Effect. At this stage, intention is the sole determinant of the act's moral species.

  **Move 2: The Application to Private Self-Defense**
  > *"Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful..."*

  Aquinas applies Move 1 to the private citizen. Because the citizen intends only self-preservation, the death of the aggressor falls into the "beside the intention" bucket. Therefore, the act is not murderous. However, he adds two constraints: **proportionality** (moderate violence) and **necessity** (no obligation to sacrifice oneself).

  **Move 3: The Restriction on Intending Death (The Authority Clause)**
  > *"But as it is unlawful to take a man's life, except for the public authority... it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority..."*

  This is the crux of your dispute. Aquinas introduces a normative constraint on *what* may be intended.
  *   **Private Person:** May *not* intend death. Death must remain *praeter intentionem*.
  *   **Public Authority:** *May* intend death, provided it is referred to the common good.

  ### 2. Adjudicating the Dispute

  **Your Friend's Reading:**
  Your friend argues that the closing sentence is decisive: the distinction turns on **authority**, not just intention/foresight. Since public agents can *intend* death while private agents cannot, the "intend vs. foresee" distinction is not a universal moral absolute but a jurisdictional privilege.

  **Verdict:** Your friend is **textually correct**.
  If the Doctrine of Double Effect were a universal, context-independent principle (as it is often treated in contemporary bioethics or trolley cases), it would forbid intending death *regardless* of who is acting. But Aquinas explicitly says the soldier or judge's minister *does* intend to kill ("*intending to kill a man in self-defense*"). For Aquinas, the moral prohibition on "intending to kill" is not intrinsic to the act of killing itself, but intrinsic to the *private status* of the agent. The "intend/foresee" distinction saves the private defender, but it is suspended for the public defender.

  **Your Reading:**
  You argue that intention is doing identical work in both cases; only the *further end* (private safety vs. common good) changes.

  **Verdict:** You are **philosophically correct about the mechanism, but incorrect about the scope.**
  You are right that "intention" is the metric Aquinas uses to evaluate the act in *both* cases. For the private man, the intention is self-preservation; for the soldier, the intention is the common good (via killing). In both cases, the moral species is derived from the intention. However, you minimize the fact that Aquinas allows the *object* of that intention to differ based on status. For the private man, "death of aggressor" cannot be the object of intention. For the soldier, it can be.

  **Synthesis:**
  The text supports a **hybrid view**. The *structure* of Double Effect (one act, two effects, moral species from intention) is universal. However, the *normative constraint* on what may be intended is **not** universal; it is political.
  *   **Private Agent:** DDE applies strictly. You must foresee death, not intend it.
  *   **Public Agent:** DDE applies loosely. You may intend death, provided the *ultimate* end is the common good.

  Therefore, your friend is right that this passage is a "shakier textual ancestor" for the modern DDE than is usually assumed, because modern DDE typically treats the prohibition on intending harm as agent-neutral, whereas Aquinas treats it as agent-relative (based on political authority).

  ### 3. Continuity with Contemporary DDE (Foot, Thomson, etc.)

  How much continuity is there between this passage and the DDE invoked in trolley problems?

  **The Continuity (Structural):**
  Aquinas and Philippa Foot share the same **moral psychology**. Both reject the idea that consequences alone determine morality. Both insist that the *structure of the will* (what is chosen as means/end vs. what is accepted as side-effect) is morally decisive. When Foot argues that the surgeon in the "Transplant" case intends the death of the healthy patient (as a means), whereas the driver in the "Trolley" case merely foresees the death of the one (as a side-effect), she is using Aquinas's Move 1.

  **The Discontinuity (Normative):**
  The discontinuity lies in **why** intending harm is forbidden.
  *   **Contemporary DDE:** Often treats "intending evil" as intrinsically wrong, full stop. The fat man cannot be pushed because using him as a means violates his rights or the sanctity of life, regardless of who pushes him.
  *   **Aquinas:** Treats "intending death" as wrong for private individuals because they lack jurisdiction over life and death. Life belongs to God and the State (the common good). A private person usurps God/State if they *intend* death. A public agent, however, acts *as* the State, so they do not usurp authority; thus, they may intend death.

  **The "Shaky Ancestor" Conclusion:**
  Your friend's skepticism is well-founded. Contemporary DDE is often used as a **deontological constraint** (a side-constraint on action that applies to everyone). Aquinas uses DDE here as a **loophole within a jurisdictional framework**.

  For Aquinas, if you are a private citizen, DDE is your only shield. If you are a soldier, you don't need the shield of "unintended death"; you have the license of "public authority." In contemporary trolley literature, we do not typically ask if the person pulling the lever is a state-sanctioned transit operator or a private citizen. We assume the moral constraint applies universally.

  ### Summary

  1.  **On the Text:** Your friend wins on the specific exegesis of the final sentence. Aquinas explicitly permits public agents to intend what private agents must only foresee. The distinction is not *solely* intention vs. foresight; it is intention vs. foresight *conditioned by authority*.
  2.  **On the Philosophy:** You win on the underlying moral architecture. In both cases, the moral quality is determined by the intention. But the *permissible content* of that intention varies by role.
  3.  **On Continuity:** There is strong continuity in the **analysis of action** (means/ends/side-effects), but weak continuity in the **source of the prohibition**. Modern DDE secularizes the prohibition on intending harm into a universal moral law; Aquinas grounds it in political theology and the hierarchy of goods.

  If you want to settle the argument: Tell your friend they are right that Aquinas is not a pure proto-Footian, because Aquinas allows the "intention of death" for public agents. Tell them, however, that you are right that Aquinas *invented* the intend/foresee distinction to solve the private self-defense case, which is the seed from which the modern doctrine grew. The modern doctrine just pruned off the "public authority" branch and pretended the tree was universal.
