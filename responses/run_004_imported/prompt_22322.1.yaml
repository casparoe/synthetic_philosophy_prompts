      *   *Close Reading - Part 1 (The DDE Structure):* Analyze "Nothing hinders one act..." Show how this establishes the intend/foresee distinction as the *mechanism* for private self-defense.
      *   *Close Reading - Part 2 (The Authority Clause):* Analyze "But as it is unlawful..." Show how this introduces a *normative constraint* on what can be intended, which varies by person.
      *   *Adjudication:* The Friend is right that authority matters for *what* can be intended. The User is right that intention matters for *how* it is evaluated. The crucial point: For Aquinas, "intending death" isn't intrinsically evil in all contexts (like modern DDE often assumes); it's illicit for private persons but licit for public ones.
      *   *Continuity with Contemporary DDE:*
          *   *Continuity:* The structure of action (means/ends/side-effects).
          *   *Discontinuity:* The absolute nature of the constraint. Modern DDE (Foot/Thomson) often treats "intending harm" as a universal veto. Aquinas treats it as a jurisdictional veto.
          *   *Implication:* Aquinas is less "absolutist" about intention than his successors. He cares about *who* is acting and *why* (common good vs. private good).
      *   *Conclusion:* Summarize. The friend wins on the textual specifics; the user wins on the philosophical architecture. But regarding the "shaky ancestor" claim: The friend is correct. Aquinas's DDE is embedded in a political theology that modern ethics often strips away.

  8.  **Refining the Argument (Self-Correction during drafting):**
