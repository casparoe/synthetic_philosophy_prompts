  2.  **Deconstruct the Aquinas Text:**
      *   *Premise 1:* One act can have two effects (intended vs. beside intention).
      *   *Premise 2:* Moral species comes from what is intended, not what is accidental/beside intention.
      *   *Application 1 (Private Self-Defense):* Act = Self-defense. Effects = Saving life (intended) + Slaying aggressor (beside intention). Conclusion = Lawful *if* intention is saving life.
      *   *Constraint 1 (Proportionality):* Act must be proportionate (moderate violence). Excessive violence makes it unlawful regardless of intention.
      *   *Constraint 2 (Duty to Self):* No obligation to omit moderate self-defense to avoid killing the other (care for own life > other's).
      *   *Constraint 3 (Authority/Intention of Death):* "Nor is it necessary... But as it is unlawful to take a man's life, except for the public authority... it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority..."
      *   *Exception:* Public authority (soldier, judge's minister) *can* intend killing, provided it is referred to the common good.

  3.  **Evaluate the Friend's Reading:**
