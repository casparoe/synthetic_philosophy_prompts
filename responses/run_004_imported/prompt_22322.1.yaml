      *   *Continuity:* The structural analysis of action (one act, two effects, moral species from intention) is the same.
      *   *Key Insight:* Modern DDE secularizes the "public authority" clause into a "greater good" or "rights" clause, but often loses the jurisdictional nuance. Aquinas is more political; Foot is more metaphysical/moral.

