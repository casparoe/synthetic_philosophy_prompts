      *   *Weaknesses:* It ignores the first half of the *respondeo*. The first half establishes the structural possibility of an act having two effects where only one is intended. This structure applies to the private defender. If authority were the *only* thing that mattered, the first half (about effects beside intention) would be superfluous for private defense.

  4.  **Evaluate the User's Reading:**
