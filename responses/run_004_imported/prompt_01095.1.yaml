      *   **Ibn Rushd (Aristotelian Realism):**
          *   *Core Claim:* Things have essences/natures (*taba'i*) that entail specific actions. Fire has the nature to burn.
          *   *Argument:* Denying natures makes knowledge impossible. Science requires stable objects of study. If God changes things arbitrarily at every moment, demonstration (*burhan*) is dead.
          *   *Motivation:* Epistemological and Theological (via Wisdom). God acts through Wisdom, creating an ordered cosmos. Denying order insults the Creator's wisdom.
