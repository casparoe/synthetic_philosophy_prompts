  okay this might be kind of a random question but i've been on a stoicism kick lately (marcus aurelius, epictetus's enchiridion, basically the whole booktok self-help pipeline lol) and the thing that keeps bugging me is how they say EVERYTHING is fated / part of one big causal chain, but also that your reactions and choices are still "up to you" and your responsible for them. me and my friend got into an argument about the grandfather paradox from time travel movies, like if you went back and killed your grandpa before he had kids so you'd never even be born to go back and do it in the first place. what do you think a stoic philosopher would actually say about that? (i saw the name chrysippus mentioned somewhere as like the official "logic guy" of the school, if that helps). does their whole fate-and-freedom thing actually give a real answer for why that's not a genuine contradiction, or does it just dodge the problem the same way i feel like every explanation of this paradox eventually does?
