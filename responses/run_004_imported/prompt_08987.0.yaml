  So my uncle has this thing where he mixes up words that sound alike but everyone still knows exactly what he means, every single time — like he'll say "for all intensive purposes" instead of "intents and purposes," or talk about the "statue of limitations" running out on something. It's not just a couple of phrases he learned wrong once, it happens constantly, with all kinds of words. My sister's theory is that he just never learned certain phrases right and the rest of us have gotten so used to him that we're basically auto-translating him in our heads without noticing. That kinda makes sense, but it doesnt fully sit right with me, because understanding him doesn't feel any different or harder than understanding anyone else in the family, even though he's technically using the "wrong" words and they aren't. So is my sister right that it's basically just translation, or is there something else going on with how understanding actually works between people? And if it is just on-the-fly translating, doesn't that mean the rest of us aren't really sharing "the same words" with each other either, not in any way that actually matters? Probably overthinking a weird family habit but its been bugging me for weeks.
