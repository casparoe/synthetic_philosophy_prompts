  So I had the weirdest argument with my father-in-law over Christmas dinner and it's been stuck in my head since. He's a retired math teacher who's really into Roger Penrose, and he was going on about how AI will never actually be able to think, no matter how advanced it gets, because of Godel's incompleteness theorem. His whole argument was basically: a computer is just running on some fixed set of rules, and Godel proved that for any system like that there's a true statement it can never prove from inside itself, but a person can just step back and see that its true, so people must be doing something no computer ever could. My sister-in-law does ML for work and said this is a famous bad argument that gets debunked in like week one of any philosophy of mind class, but when he pushed back she couldn't actually reconstruct the rebuttal, just got flustered and kept repeating that it was "well known to be wrong." Now I can't stop thinking about who actually wins this. Could you write out the argument the way it should've gone, an actual back-and-forth between the two of them where each one has to really engage with the other's strongest point instead of just restating their own?
