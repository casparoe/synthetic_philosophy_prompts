answer: |-
  Thank you all for coming. For those who don't know me, I'm [Your Name]. Hollis was my uncle, and for the last twenty years, he was my favorite interlocutor.

  We are gathered here in a room that is, in a sense, divided by temperature. On one side, there is the chill of the future—a hope that Hollis has merely paused, that the story is on a bookmarked page waiting to be turned. On the other, there is the warmth of the present—a recognition that the man we knew has left the building, and that we are here to mourn the end of a life.

  My mother tells me some of you find this situation faintly absurd. My friends in the cryonics community tell me some of you are clinging to a ghost. Hollis anticipated this. He left me notes for tonight, not a script, but a set of constraints. He was a physicist, and then a philosopher, but he knew I was the novelist. He knew that while he dealt in definitions, I dealt in meanings.

  He gave me two prohibitions. First: I am not to stand here and promise you that Hollis will wake up. He spent the last decade of his life arguing that the question "Is it still *me*?" might not have a yes-or-no answer. He often referred to his own suspension as his "branch-line case." For those who know the thought experiment, it's the scenario where the original steps out of the machine and dies, while a perfect copy continues on. Hollis argued that whether the copy *is* him matters less than the fact that the copy carries his work, his love, and his mind forward. He didn't want me to sell you a guarantee of resurrection. He found certainty to be intellectually dishonest.

  His second prohibition was equally strict: I am not to treat this as an ordinary death. I am not to speak of him as if he has vanished into the dark, nor am I to reach for the language of souls and spirits that he found comforting in others but unnecessary for himself. He found the idea of a ghost in the machine embarrassing. He believed the machine was enough.

  So, how do we eulogize a man who suspended himself between certainty and hope? How do we honor a branch-line?

  I think we do it by changing what we mean by survival.

  Hollis taught me that we are not atoms. We are patterns. We are arrangements of matter that tell a story. When a book is closed, the story doesn't cease to exist; it ceases to be active. It waits for a reader.

  To the friends who believe Hollis will be read again: You honor his faith in the continuity of science. You honor his wager that the pattern of him can be re-instantiated. That is a beautiful hope. It is a testament to his optimism about the future of humanity.

  To the family who believe the book is closed: You honor the reality of the present. You honor the fact that the Hollis who told bad jokes at Thanksgiving, who burned the toast, who held my hand when my father died—that specific, continuous stream of consciousness has broken. Your grief is real. It is the cost of loving a human being.

  But Hollis's philosophy suggests that both of you are right, and neither of you is the whole story.

  Because even if the cryonics fails—even if the technology never comes, even if the branch-line ends in the ice—Hollis has already survived. He survives in the physics papers he annotated. He survives in the way I structure my sentences, because he taught me that precision is a form of kindness. He survives in the skepticism of my mother and the hope of his colleagues. He is distributed across this room.

  He argued that what matters in survival is not strict identity, but connection. Relation R, he called it. Psychological connectedness. By that metric, he is not gone. Every time one of his students corrects a misconception using his methods, Hollis is there. Every time we argue about the nature of self using the vocabulary he gave us, he is there.

  He did not want us to wait for him. He did not want us to treat the future as a waiting room. He wanted us to understand that the continuity of a life is not just a biological thread, but a narrative one.

  So, we will not say "Goodbye," because that implies a finality he rejected. But we will not say "See you soon," because that implies a promise he forbade.

  Instead, let us acknowledge the branch-line. Let us accept that we are the carriers of the pattern for now. If the future wakes him, he will find a world we prepared for him, one that valued the curiosity he embodied. If the future does not wake him, he will find that he never truly left, because he wrote himself into us so deeply that the ink hasn't dried.

  Hollis loved the uncertainty. He loved the open question. So tonight, let us hold the tension. Let us grieve the silence, and let us hope for the voice, but let us mostly honor the story. The story continues. It just has a new set of authors.

  Rest well, Uncle Hollis. Wherever you are. Whatever you are. We have the con from here.
