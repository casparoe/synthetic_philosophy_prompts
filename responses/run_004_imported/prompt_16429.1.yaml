prompt: |-
  My uncle Hollis, a physicist who devoted his retirement to the metaphysics of personal identity, died in March and was cryopreserved within the week, as he'd arranged decades earlier. His cryonics circle is treating tonight's memorial as a long goodbye rather than an ending; my mother's side of the family, who consider the whole enterprise faintly absurd, are treating it simply as a funeral. Hollis foresaw this divide and left me notes rather than a script. I am not to promise the room that "he" will simply wake up one day: he spent years arguing, after Parfit, that this question may have no determinate answer. He liked to call his own suspension "my branch-line case," after the variant of the teletransporter thought experiment in which the original dies while a psychological continuer carries on elsewhere. But I am equally forbidden from treating this as ordinary death, or reaching for the soul-talk he found embarrassing at other people's funerals. I am the novelist in the family, not the philosopher, and I need a eulogy that takes his own view of what matters in survival seriously enough to satisfy both halves of that room.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Uncle Hollis, a physicist turned metaphysician of personal identity.
      *   **Situation:** Died in March, cryopreserved within the week (Alcor-style, presumably).
      *   **The Audience:** Divided.
          *   Group A: Cryonics circle (views this as a "long goodbye," expects potential revival/continuation).
          *   Group B: Mother's side (views this as absurd, a standard funeral/death).
      *   **Hollis's Philosophy:**
          *   Influenced by Derek Parfit (reductionist view of personal identity).
          *   "Branch-line case" (Teletransporter thought experiment: original dies, copy continues; is it survival?).
          *   Believed the question "Will *he* wake up?" has no determinate answer.
          *   Disliked "soul-talk" (dualism).
          *   Did *not* want a promise of resurrection, nor a standard mourning of absolute cessation.
      *   **The Speaker:** A novelist (narrative focus, not technical philosophy).
      *   **Goal:** A eulogy that honors Hollis's specific metaphysical views without alienating either side of the room. It needs to bridge the gap between "he's gone forever" and "he'll be back."

  2.  **Deconstruct the Philosophical Core (Parfit & Branch-Lines):**
      *   Parfit's *Reasons and Persons*: What matters in survival is not "identity" (strict numerical sameness) but "Relation R" (psychological connectedness and continuity).
      *   The "Branch-Line Case": If I step into a teletransporter, my body is destroyed, and a copy is made on Mars. Parfit argues I survive in a sense that matters, even if strict identity is broken.
      *   Hollis's twist: Cryonics is a *temporal* branch-line. The body is paused, not destroyed, but the continuity of consciousness is broken.
      *   Key Insight: Don't focus on *whether* he wakes up. Focus on *what matters* about him that persists regardless of the outcome. Memories, influence, patterns, love.

  3.  **Determine the Tone:**
      *   Respectful but intellectually honest.
      *   Warm but not maudlin.
      *   Metaphorical (novelist style) rather than technical (philosopher style).
      *   Ambiguous enough to satisfy both camps but specific enough to honor Hollis.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the divide immediately but gently. Validate both feelings without endorsing one as "correct."
          *   *Idea:* Mention the temperature of the room (cold vs. warm) or the nature of gathering.
          *   *Decision:* Acknowledge the unusual nature of the gathering. Some see a pause, some see an end.

      *   **Addressing Hollis's Wishes:** Mention the notes. He didn't leave a script. He left a puzzle.
          *   *Idea:* He forbade promises of waking up, but also forbade treating this as total extinction.
          *   *Decision:* Quote his "branch-line" concept but translate it into human terms.

      *   **The Philosophical Bridge (The Novelist's Translation):**
          *   How to explain Parfit without saying "Parfit"?
          *   Focus on *patterns* and *connections*.
          *   *Metaphor:* A story, a song, a ripple.
          *   *Key argument:* Survival isn't just about the body waking up; it's about the persistence of the pattern in us.
          *   *For the Cryonics group:* The pattern *might* be re-instantiated physically.
          *   *For the Skeptics:* The pattern *already* persists in memory and influence.
          *   *Synthesis:* Both are forms of survival that matter.

      *   **Personal Touch:** Needs to feel like a nephew/niece speaking.
          *   *Anecdote:* Hollis explaining things simply. His laugh. His specific way of seeing the world.
          *   *Connection:* How he lives on in the speaker.

      *   **The Conclusion:** A farewell that isn't final but isn't a guarantee.
          *   *Idea:* "See you later" is too cliché. "Goodbye" is too final.
          *   *Decision:* Focus on the continuity of the *relationship*, not the biology.

  5.  **Refining the Language (Self-Correction during drafting):**
      *   *Critique:* Is it too cold/academic?
      *   *Fix:* Add more sensory details. The cold of the cryonics, the warmth of the family hug.
      *   *Critique:* Is it too vague?
      *   *Fix:* Explicitly mention the "branch-line" term Hollis loved, but define it emotionally.
      *   *Critique:* Will the religious/traditional family be offended by the lack of "heaven"?
      *   *Fix:* Focus on "legacy" and "memory" which is secular but spiritually satisfying. Avoid denying an afterlife, just don't assert it. Stick to Hollis's "what matters."

  6.  **Final Polish:** Check the rhythm. Ensure the transition from the physics/metaphysics to the emotional core is smooth. Make sure the ending lands softly. (The resulting eulogy in the main response follows this structure.)

  7.  **Post-Draft Note:** Add a brief commentary explaining *why* certain choices were made, to help the user understand how it meets the constraints. (Added as "Author's Note" at the end).

  **(Self-Correction specific to the prompt):** The prompt says "I am the novelist." The voice should be lyrical but precise. It needs to navigate the "absurd" vs. "sacred" tension. The key is to make the *uncertainty* itself the sacred space.

  *Drafting thought:* "He is both here and not here." -> *Too quantum.*
  *Drafting thought:* "He lives on in our hearts." -> *Too cliché for the physicists.*
  *Drafting thought:* "His pattern persists." -> *Better.*

  Let's weave the "branch-line" metaphor into the idea of a story. A story continues even when the book is closed.

