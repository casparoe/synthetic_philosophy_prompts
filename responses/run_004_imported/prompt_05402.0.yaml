      *   *Step 3 (Historian):* Slippery Slope/Consistency. If Step 2 is true, *all* area bombing (Tokyo, Dresden) is murder. Double Effect distinction collapses.
      *   *Step 4 (Philosopher):* Specificity of Hiroshima. Target selection (unbombed cities) proves the point was total destruction of the populace to show the weapon's power, not just military utility.
      *   *Step 5 (Historian):* Epistemic Limit. We can't know Truman's mind. If he *thought* he was just demonstrating a weapon, the "murder" label (which requires intent) fails.

  3.  **Evaluate Each Step (Philosophical & Historical Accuracy):**

      *   *Step 1:* Historian uses Doctrine of Double Effect (DDE). This is a standard Catholic/Just War defense. *Verdict:* Plausible standard defense, but vulnerable to the "means vs. side-effect" critique.
      *   *Step 2:* Philosopher attacks the "means/end" distinction. In DDE, you cannot intend evil as a *means* to a good end. If civilian death is the *means* to shock, it's intended. *Verdict:* Stronger philosophical point. This is the crux of Anscombe's actual view.
      *   *Step 3:* Historian argues consistency. If Hiroshima is murder, so is Tokyo firebombing. *Verdict:* Logically consistent, but doesn't exonerate Hiroshima. It just implicates more people (like Churchill/Portal). Anscombe actually *did* condemn area bombing generally. So the historian thinks this is a *reductio ad absurdum*, but for Anscombe, it's just consistency.
