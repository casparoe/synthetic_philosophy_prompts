      *   *Step 5:* Historian retreats to subjective intent. "He thought he was doing X." *Verdict:* Weak in moral philosophy. Objective nature of the act often outweighs subjective delusion. If the act is inherently evil (killing innocents as means), sincere belief doesn't change the moral object.

  4.  **Analyze Anscombe's Actual Position (Crucial Step):**
      *   *Source Material:* Anscombe's pamphlet "Mr. Truman's Degree" (1956).
