answer: |-
  This is a fascinating dilemma, and it speaks well of your writing group that they caught the philosophical tension here. The debate between your historian and philosopher mirrors real-world discussions that have persisted since 1945. However, to write Anscombe convincingly, you need to know where their debate aligns with her actual thought and where it diverges.

  Here is an evaluation of each move in the exchange, followed by an analysis of Anscombe's actual position regarding intention.

  ### Round-by-Round Evaluation

  **1. The Historian (Double Effect Defense)**
  *   **Argument:** Truman intended surrender, not death. Deaths were foreseen but unintended side effects.
  *   **Verdict:** **Historian wins on plausibility, Philosopher wins on technicality.**
  *   **Analysis:** The Historian is articulating the standard justification used by Truman and his defenders (and many Just War theorists). It is the most common defense. However, from a strict Thomistic perspective (which Anscombe holds), this move is vulnerable. The Doctrine of Double Effect (DDE) forbids intending evil *as a means* to a good end. If the deaths are the *mechanism* of the surrender (via shock/terror), they are not merely side effects; they are the means. The Historian sets up a straw man of DDE that Anscombe would immediately recognize as flawed.

  **2. The Philosopher (The Means/End Distinction)**
  *   **Argument:** You cannot separate the "shock" from the "killing." The killing is the means to the end.
  *   **Verdict:** **Philosopher wins.**
  *   **Analysis:** This is the strongest philosophical move in the exchange. It correctly identifies the loophole in the Historian's DDE application. In Anscombe's framework, if the causal path to the good outcome runs *through* the death of innocents, those deaths are intended. You cannot claim you only intended the "shock" when the shock is constituted by the obliteration of the populace. This aligns closely with Anscombe's actual view.

  **3. The Historian (The Consistency Trap)**
  *   **Argument:** If Hiroshima is murder, so was Tokyo/Dresden. This erases the distinction between terror bombing and collateral damage.
  *   **Verdict:** **Historian wins logically, but loses strategically.**
  *   **Analysis:** The Historian is trying to use a *reductio ad absurdum*: "If your logic holds, then Churchill was a murderer too, which is absurd." The logical consistency is sound—if Hiroshima is murder by this definition, so is area bombing. However, the Historian assumes Anscombe would find the conclusion (Churchill was a murderer) unacceptable. She did not. Anscombe was a consistent pacifist regarding the targeting of non-combatants. She *did* condemn the RAF's area bombing of German cities. The Historian thinks he has trapped her; in reality, he has just widened the net of her condemnation, which she would accept.

  **4. The Philosopher (Target Selection)**
  *   **Argument:** The Target Committee chose "pristine" cities to measure the weapon's effect on a population, proving the population was the point.
  *   **Verdict:** **Philosopher wins.**
  *   **Analysis:** This is historically accurate. The Target Committee (May 1945) specifically discussed choosing cities that had not been damaged by conventional bombing to accurately assess the atomic bomb's power. This supports the Philosopher's claim in Round 2: the destruction of the city *was* the objective, not an incidental byproduct of hitting a factory. This undermines the Historian's claim that it was a "military" strike with collateral damage.

  **5. The Historian (The Epistemic Retreat)**
  *   **Argument:** We cannot know Truman's private mind. If he *sincerely believed* he was just demonstrating a weapon, he lacked murderous intent.
  *   **Verdict:** **Philosopher wins (decisively).**
  *   **Analysis:** The Historian retreats to subjective psychological intent ("What was in Truman's heart?"). In moral philosophy, particularly the Aristotelian-Thomist tradition Anscombe belongs to, this is a weak defense. Moral responsibility is generally attached to the *object of the act*, not just the internal emotional state. If I drive a car through a crowd to clear a traffic jam, claiming "I didn't intend to kill them, I just intended to clear the road" does not exonerate me if killing them was the necessary means to clear the road. Anscombe would argue that Truman's sincerity is irrelevant to the moral classification of the act.

  ---

  ### The Crucial Question: Does Anscombe's Case Depend on Truman's Private Intentions?

  **Short Answer:** No. This is the most important thing for your novel to get right.

  **Long Answer:** Both your historian and your philosopher are fighting over **psychological intention** (what was going on inside Truman's head). Anscombe's argument is about **the intentionality of the act** (what the action *was* in itself).

  In 1956, Anscombe was on the verge of publishing her seminal work *Intention* (1957), where she revolutionized how philosophers understand the concept. For Anscombe, "intention" is not a ghostly mental event that accompanies an action. It is found in the description of the action itself.

  *   **The Historian's Mistake:** He thinks that if Truman didn't *feel* like a murderer, or if he was deluded about the morality of his act, he isn't one.
  *   **The Philosopher's Mistake:** She thinks she needs to prove Truman *psychologically* aimed at death to prove he intended it.
  *   **Anscombe's Actual View:** She argues that Truman is a murderer because he **chose to do something that was the killing of the innocent.**

  In her pamphlet *Mr. Truman's Degree*, she writes:
  > "It is not for us to judge whether the use of the atomic bombs was justified... I think it is for us to judge whether Mr. Truman is a murderer."

  She does not base this on a psychoanalysis of Truman. She bases it on the **nature of the choice**. She argues that the bombing of Hiroshima and Nagasaki was, in its very description, the killing of innocent people for the sake of a political end. Whether Truman wept while signing the order, or whether he believed God told him to do it, or whether he thought it was a "military necessity," does not change the moral object of the act.

  For Anscombe, "necessity" does not justify murder. If an act is inherently evil (like killing innocents), no amount of good consequence (ending the war) or sincere belief makes it permissible.

  **Therefore:**
  Your protagonist should not let the argument get bogged down in "What was Truman thinking?" That is a trap. If she argues about his state of mind, she loses, because we can never truly know it.

  Instead, she should argue about **the act itself.** Her point should be: *"It does not matter what Mr. Truman told himself in the privacy of his study. He chose a course of action that consisted in the destruction of a civilian population. He willed that destruction as a means to an end. That is the definition of murder, regardless of his private sentiments."*

  ### Recommendation for the Scene

  To make your protagonist authentically Anscombean:

  1.  **Have her dismiss the "Private Intent" argument (Round 5).** She should find it amusing or irritating that the historian thinks sincerity exonerates a man from the consequences of his public acts.
  2.  **Have her accept the "Consistency" argument (Round 3).** If the historian says, "Then Churchill was a murderer too," she should not flinch. She might reply, "Then Oxford should not have honored Churchill either," or "The morality of an act does not change because many people committed it." Anscombe was notoriously unyielding on principle.
  3.  **Focus on the "Means."** Her core argument should be that the civilians were not *side effects*; they were the *instrument*. The bomb was not dropped *despite* the civilians; it was dropped *on* the civilians to achieve the shock.

  **Suggested line for your protagonist:**
  > "You keep asking me to peer into Mr. Truman's soul to see if he felt like a murderer. I am not interested in his soul. I am interested in his hands. He signed an order to obliterate a city of non-combatants to frighten their government. If that is not the intentional killing of the innocent, then the word 'murder' has no meaning left in it."

  This captures the moral rigor that made Anscombe such a formidable (and often unpopular) figure in Oxford. She was not arguing a legal case about *mens rea*; she was making a moral declaration about the nature of the act.
