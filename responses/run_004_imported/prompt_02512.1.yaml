answer: |-
  This is a fantastic catch. You have identified one of the most tension-filled moments in *Principia Ethica*, where Moore's rigorous (and sometimes contorted) method clashes with common moral intuition. The rationalist/EA reception of Moore often sanitizes this into "Friendship and Art = Good," but §122 reveals the weird, aestheticist machinery under the hood.

  To answer your questions directly: **Yes, he is tentatively biting that bullet,** but **yes, the point is narrower,** and **yes, there is a methodological tension** that relies on how Moore defines "intrinsic value" versus "intrinsic goodness of the object."

  Here is a close reading of the argument structure in §122, breaking down why he says this and how it fits (or doesn't) with his method.

  ### 1. The Bullet: Is Character Appreciation < Body Appreciation?

  You asked: *Is he actually concluding that appreciating someone's character, in isolation, is worth less than appreciating their body in isolation?*

  **Textually: Yes.**
  Moore writes: *"It even appears to be doubtful, whether, in itself, it possesses so much value as the appreciation of mere corporeal beauty undoubtedly does possess."*

  **Conceptually: Why?**
  To understand this, you have to remember Moore's definition of "intrinsic value." For Moore, value resides **only in states of consciousness**. Matter is not valuable. A "good character" existing in a vacuum is not valuable. The *appreciation* of a good character is valuable.

  Moore is comparing two specific states of consciousness:
  1.  **State A:** The cognition/admiration of mental virtues (kindness, intelligence) *stripped of all physical expression*.
  2.  **State B:** The cognition/admiration of corporeal beauty (a face, a gesture, a landscape) *stripped of moral judgment*.

  Moore suspects State B is more valuable than State A. Why? Because for Moore, the "good" is tightly linked to the **aesthetic**. The "appreciation of beauty" is one of the two ultimate goods (the other being personal affection).
  *   **State B** is a "pure" aesthetic experience. It is vivid, immediate, and emotionally resonant.
  *   **State A**, when isolated from expression, becomes abstract. It is an intellectual acknowledgment of "goodness." Moore implies that a cold, disembodied admiration of virtue is a thinner, less valuable state of consciousness than the visceral appreciation of beauty.

  **The Bloomsbury Connection:**
  This actually makes perfect sense for the Bloomsbury Group. They were not moralists in the Victorian sense; they were aestheticists. For Keynes and Woolf, "states of mind" were the currency of value. A beautiful moment of connection was the goal. "Duty" or abstract "virtue" was often viewed with suspicion. Moore is telling them: *Don't love people because it's morally right to appreciate their virtue; love them because the combination of their virtue and their physical presence creates a magnificent state of consciousness in you.*

  ### 2. The Narrower Point: Organic Unities

  You asked: *Or is the point narrower than that, just that the combined whole beats the mental-appreciation-part-alone?*

  **This is the primary argumentative goal.**
  Moore is fighting the idea that Value is additive. He wants to prove:
  $$Value(\text{Affection for Person}) \neq Value(\text{Admiring Mind}) + Value(\text{Admiring Body})$$

  He argues that $Value(\text{Whole}) \gg Value(\text{Sum of Parts})$.

  To prove this, he needs to show that the "Mental Appreciation" part isn't doing all the heavy lifting. If Admiring Mind was infinitely valuable on its own, then adding the Body wouldn't matter as much. By arguing that Admiring Mind (in isolation) is actually quite weak (perhaps weaker than Admiring Body), he emphasizes that the **synergy** is where the value comes from.

  The "bombshell" comparison (Mind < Body) is a rhetorical device to shock the moralist who thinks "Virtue is the highest good." Moore is saying: *"Even if you think Virtue is the highest object, the **experience** of admiring it is less valuable than the **experience** of admiring beauty. Therefore, the immense value of Personal Affection cannot come from the Virtue part alone; it must come from the Organic Unity of Virtue + Beauty."*

  ### 3. The Methodological Fishiness

  You asked: *Isn't there something fishy about applying the isolation method to "cognition of mental qualities alone"... given his own earlier warnings?*

  **You have hit on a major critique of Moore.**
  Moore's "Method of Isolation" asks us to imagine a universe containing *only* X and judge its value. But in §122, he admits: *"It is, indeed, very difficult to imagine what the cognition of mental qualities alone, unaccompanied by any corporeal expression, would be like."*

  **The Tension:**
  1.  **Moore's Warning:** In organic unities, parts derive value from the whole. Isolating them distorts their value.
  2.  **Moore's Practice:** He isolates the "cognition of mental qualities" to prove they derive value from the whole.

  **How Moore Defends This (Implicitly):**
  He uses the isolation method *diagnostically*.
  *   If you isolate X and it still seems valuable, X has independent value.
  *   If you isolate X and it becomes inconceivable or valueless, then X's value was dependent on its context (Organic Unity).

  By admitting it is "difficult to imagine," Moore is signaling that this state of consciousness is **unnatural**. Because it is unnatural to admire a mind without any expression, the *state of consciousness* is impoverished. Therefore, it has low intrinsic value.

  **The Fishiness:**
  The fishiness lies in whether "Cognition of Mental Qualities Alone" is a coherent state of consciousness at all. If it's inconceivable, can it have *any* intrinsic value? Moore usually says we can't judge the inconceivable. But here he judges it as "less valuable."
  *   **Charitable Reading:** He means "The abstract intellectual acknowledgment of virtue."
  *   **Uncharitable Reading:** He is rigging the isolation test. He defines the "Mental Part" as a cold abstraction to ensure it loses to the "Aesthetic Part," thereby proving his thesis that Personal Affection is fundamentally an aesthetic/emotional unity, not a moral judgment.

  ### 4. Why EAs/Rationalists Ignore This Passage

  This explains why the rationalist/EA canon quotes the Chapter 6 headline but ignores §122.

  *   **EA Axiology:** Modern Effective Altruism tends to be welfarist or preference-utilitarian. They care about "goodness" as a property of outcomes (lives saved, suffering reduced).
  *   **Moore's Axiology:** Moore cares about "goodness" as a property of **conscious experiences**.

  When EAs read "Personal Affection is good," they hear "Relationships produce utility."
  When Moore writes §122, he is saying "Personal Affection is good because it is a complex aesthetic experience where the appreciation of virtue is embodied in beauty."

  Moore is arguably **more aestheticist** than he is moralist here. He is suggesting that the *feeling* of loving someone (which includes aesthetic appreciation of their body/expression) is the locus of value, not the *moral worth* of the person being loved.

  ### Summary of the Argument Structure in §122

  1.  **Premise:** Personal Affection is an Organic Unity.
  2.  **Observation:** The object of affection includes both Mental Qualities (high intrinsic value objects) and Corporeal Expressions (beautiful objects).
  3.  **Hypothesis:** Is the value of Affection driven by the Mental Qualities?
  4.  **Test (Isolation):** Imagine appreciating Mental Qualities *without* Corporeal Expression.
  5.  **Result:** This state is hard to imagine and seems to have low value (possibly lower than appreciating mere beauty).
  6.  **Inference:** Therefore, the Mental Qualities do not generate the value of Affection *on their own*.
  7.  **Conclusion:** The value of Personal Affection comes from the **combination** (Organic Unity) of appreciating virtue *as embodied* in beauty. The "Moral" part enhances the "Aesthetic" whole, but does not supersede it.

  ### Verdict

  You aren't misreading it. Moore is prioritizing the **aesthetic quality of the subject's experience** over the **moral quality of the object**.

  He is biting the bullet that a disembodied admiration of virtue is less valuable than an admiration of beauty. He does this to safeguard his thesis that **Personal Affection** (the synthesis) is the supreme good, distinct from both **Moral Approval** (too abstract) and **Aesthetic Enjoyment** (too shallow).

  It is a deeply Romantic/Modernist position, which is why Bloomsbury ate it up, but it creates friction with any ethical system that prioritizes "The Good" (virtue) over "The Beautiful" (experience). Your instinct that the isolation method is doing heavy, perhaps unfair, lifting here is spot on; Moore needs the "Mental Part" to look weak in isolation to prove that the "Whole" is where the magic happens.
