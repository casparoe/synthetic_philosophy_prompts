      *   **Scenario:** Uncle's cardiac risk (15% vs. 24% vs. other numbers depending on reference class). Cousin (biostats PhD) found different numbers based on different conditioning variables.
      *   **Core Problem:** The *Reference Class Problem*. How do we assign a probability to a *single case* when that case belongs to infinitely many overlapping reference classes with different frequencies?
      *   **Roommate's View:** Pragmatic solution (narrowest class with stable data). User suspects this is a compromise, not a principled solution.
      *   **User's Hypothesis:** There may be no "fact of the matter" about a single individual's true probability independent of the reference group.
      *   **Goal:** Evaluate the roommate's stopping rule, discuss whether single-case probability makes sense, and connect this to philosophical interpretations of probability (Frequentism, Bayesianism, Propensity, etc.).

  2.  **Identify the Philosophical Core:**
      *   This is a classic formulation of the **Reference Class Problem**, famously associated with John Venn and Hans Reichenbach.
      *   It challenges **Frequentist** interpretations of probability (probability = long-run frequency).
      *   It touches on **Single-Case Probabilities** (can probability apply to a unique event?).
      *   It relates to **Bayesian/Subjective** interpretations (probability = degree of belief).
