prompt: |-
  I've spent most of the last decade covering science and ideas, with a good chunk of that on the effective-altruism and existential-risk beat. That's presumably why a mid-sized foundation funding long-term-future and existential-risk work recently invited me to join its grants committee as one of two outside 'public members' — people with no financial stake in the outcomes, brought in mainly to stress-test whether the committee's reasoning would hold up once it left the room.

  Ahead of our allocations meeting in three weeks, the committee has to rule on an application that has left everyone more confident in their gut reaction than in their ability to defend it, so I've been asked to draft the discussion memo. The applicants aren't proposing a specific intervention; they want roughly a million dollars over two years for a research and advocacy program built on an argument along these lines. Serious cosmological models don't rule out a spatially infinite universe, in which case, on fairly standard assumptions, there exist infinitely many exact or near-exact duplicates of Earth, each causally sealed off from us behind its own cosmological horizon. The applicants argue that by adopting and publicizing a specific cooperative policy — one that any sufficiently similar reasoner elsewhere would, on identical evidence, also be inclined to adopt — the committee can affect, in a purely evidential rather than causal sense, how countably infinitely many of those duplicate civilizations fare. On a standard expected-value calculation, that makes the payoff from funding them literally infinite, and since no finite amount of expected good can outweigh an infinite one, they conclude the grant should take strict priority over everything else in the budget, including our pandemic-preparedness and AI-safety commitments, regardless of how small the committee's credence in the underlying cosmology is. Two committee members find the logic basically airtight and want to fund it as a cheap hedge against an enormous upside; a couple of others want to reject it out of hand as a clever trick not worth the committee's time; I don't think either reaction survives being spelled out in full.

  Could you draft that memo for me? I need it to reach an actual recommendation — fund, decline, or fund with specific conditions — on this application, and, since this will not be the last unbounded-value argument to reach this committee, a general rule or procedure it can apply to future proposals of the same shape without simply refusing to engage with them. Please take the applicants' reasoning seriously on its own terms first — including the uncomfortable fact that quietly abandoning expected-value reasoning only when it yields an inconvenient answer is its own kind of inconsistency — before explaining where, if anywhere, you think the argument breaks down. Keep it to two pages or so, something the committee will actually read in one sitting, without flattening the argument just to get there.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas Journalist, Outside Public Member on a Grants Committee (Effective Altruism/Existential Risk focus).
      *   **Task:** Draft a discussion memo for the committee regarding a specific grant application.
      *   **The Application:** Requesting ~$1M over 2 years. Premise: Infinite universe $\rightarrow$ infinite duplicates $\rightarrow$ acausal cooperation (Evidential Decision Theory/Functional Decision Theory) $\rightarrow$ infinite expected value (EV). Conclusion: This grant dominates all others (pandemic, AI safety) regardless of low credence in the cosmology.
      *   **Committee State:** Split. Some think it's airtight/cheap hedge; others think it's a trick.
      *   **Requirements:**
          *   Reach an actual recommendation (Fund, Decline, or Conditional).
          *   Propose a general rule/procedure for future "unbounded value" arguments.
          *   Take the reasoning seriously (avoid motte-and-bailey, acknowledge inconsistency risks).
          *   Explain where the argument breaks down (if it does).
          *   Length: ~2 pages (readable in one sitting).
          *   Tone: Professional, analytical, respectful of EA/longtermist frameworks but critical.

  2.  **Deconstruct the Argument (The "Infinite Ethics" Problem):**
      *   *Premise 1:* Spatially infinite universe (non-zero credence).
      *   *Premise 2:* Infinite duplicates exist (Level I Multiverse).
      *   *Premise 3:* Acausal trade/cooperation works (EDT/FDT). My decision correlates with theirs.
      *   *Premise 4:* Infinite beneficiaries $\times$ non-zero utility = Infinite Expected Value.
      *   *Premise 5:* Infinite EV dominates any finite EV (Pascal's Mugging variant).
      *   *Conclusion:* Fund this over AI safety/pandemics.

  3.  **Identify the Flaws/Counterarguments (without dismissing them lightly):**
      *   *Measure Problem:* In an infinite universe, how do we weigh outcomes? "Infinity minus Infinity" is undefined. We need a measure theory to make comparisons, which reintroduces finite weighting.
      *   *Acausal Uncertainty:* How confident are we that our specific policy correlates with *all* duplicates? What if 51% defect? The "infinite" gain might vanish if the correlation isn't perfect or if the utility function isn't aggregative in that way.
      *   *Opportunity Cost:* If we fund this, we lose finite but *certain* impact (AI safety). If the infinite argument is flawed (even slightly), we lose everything.
      *   *Pascal's Mugging:* Any hypothesis with infinite payoff dominates. This leads to absurdity (e.g., paying a mugger who claims to simulate infinite people). We need a prior penalty for complexity or unbounded claims.
      *   *Decision Theory Limits:* Standard EV maximization breaks down with infinities. We need a bounded utility function or a different decision rule (e.g., stochastic dominance).

  4.  **Formulate the Recommendation:**
      *   *Direct Fund?* No. It diverts resources from high-probability existential risk reduction based on a highly speculative ethical framework that breaks standard math.
      *   *Direct Decline?* Too dismissive. Risks the "inconsistency" charge.
      *   *Conditional/Procedural?* Best path. Decline *this* specific application based on current epistemic standards, but establish a framework for evaluating infinite claims.
      *   *Recommendation:* Decline the specific grant, but adopt a "Bounded Impact Protocol" for future evaluations.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **The Core Argument:** Summarize the applicants' position charitably. Acknowledge the logic holds *if* premises are accepted.
      *   **The Epistemic Trap (Analysis):**
          *   Address the "Infinite EV" claim.
          *   Discuss the Measure Problem (comparing infinities).
          *   Discuss the "Pascal's Mugging" risk (open door to any infinite claim).
          *   Address the inconsistency charge (why ignoring EV here isn't necessarily hypocritical if the EV calculus is broken).
      *   **The Practical Risk:** Opportunity cost. AI safety is finite but robust. This is infinite but fragile.
      *   **Recommendation:** Decline.
      *   **Procedural Rule:** The "Finite Anchor" or "Bounded Utility" rule. We cannot act on infinite claims unless the decision theory is resolved.

  6.  **Refining the Tone:**
      *   Needs to sound like an EA insider/observer. Use terms like "credence," "expected value," "acausal," "measure problem."
      *   Avoid mockery. Treat the "infinite duplicates" as a serious cosmological possibility, but the *decision theory* as the weak link.
      *   Ensure the "inconsistency" point is addressed: We aren't abandoning EV; we are acknowledging EV is undefined in this context.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "public member" role? Yes, keep it objective but analytical.
      *   *Check:* Is it too long? Keep paragraphs tight.
      *   *Check:* Did I solve the "inconsistency" worry? I need to explicitly state that rejecting broken math isn't rejecting EV.
      *   *Check:* Is the procedural rule actionable? It needs to be something the committee can vote on.

  8.  **Final Polish:** (Mental check of the "Infinite Ethics" literature).
      *   Reference the "Measure Problem" explicitly.
      *   Reference "Pascal's Mugging."
      *   Ensure the distinction between *ontological* possibility (infinite universe) and *decision-theoretic* actionability is clear.

  9.  **Final Output Generation:** (Proceeding to draft based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Long-Term Future Fund Grants Committee
  **FROM:** [Your Name], Outside Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Application #402 (Infinite Cosmology & Acausal Cooperation)

  **Executive Summary**

  Application #402 requests $1M to advocate for a policy based on "Infinite Ethics": the claim that in a spatially infinite universe, our decisions acausally coordinate with infinite duplicate civilizations, yielding infinite expected value (EV). The applicants argue this dominates all finite interventions, including AI safety and pandemic preparedness.

  While the applicants' logic is internally consistent *if* one accepts specific premises in cosmology and decision theory, acting on it introduces catastrophic opportunity costs and exposes the foundation to "Pascal's Mugging" vulnerabilities. I recommend **declining** this specific application. However, to avoid the charge of inconsistency or ad hoc rejection, I further recommend the committee adopt a **Bounded Impact Protocol** for future evaluations. This protocol acknowledges that standard Expected Value maximization is mathematically undefined in infinite contexts and establishes a prior penalty for claims relying on unbounded utility.

  **The Argument, Charitably Construed**

  We must acknowledge that the applicants are not proposing magic. Their argument rests on three pillars:
  1.  **Cosmology:** A non-zero credence that the universe is spatially infinite (Level I Multiverse), implying infinite Earth-duplicates.
  2.  **Decision Theory:** Evidential or Functional Decision Theory (EDT/FDT) implies our choice correlates with duplicates' choices, even across causal horizons.
  3.  **Aggregation:** Summing utility across infinite agents yields infinite value, which mathematically dominates any finite sum, regardless of probability weight.

  To dismiss this simply because it sounds strange is to violate our commitment to cause neutrality and rigorous reasoning. If the math holds, the applicants are correct: a 0.0001% credence in infinite payoff outweighs a 99% credence in saving a billion lives. Quietly abandoning EV maximization because the result is inconvenient would indeed be intellectually dishonest.

  **Where the Argument Breaks Down**

  The failure point is not the cosmology, but the decision theory. Standard EV calculus breaks when infinities are introduced.

  1.  **The Measure Problem:** In an infinite universe, "counting" beneficiaries is undefined. For every duplicate that benefits from our cooperation, there may be infinite duplicates that suffer due to stochastic variance or conflicting policies. Infinity minus Infinity is indeterminate. Without a agreed-upon "measure" to weight these regions, we cannot claim the EV is positive, let alone infinite. We are comparing undefined quantities.
  2.  **The Pascal's Mugging Vulnerability:** If we accept that any non-zero credence in infinite payoff dominates decision-making, we become vulnerable to any claim asserting infinite leverage. A malicious actor could construct a similar argument claiming that *withholding* funds yields infinite value. If our framework cannot distinguish between these competing infinite claims, it is not a decision framework; it is a paralysis engine.
  3.  **Fragility vs. Robustness:** The "infinite" value relies on a chain of speculative premises (infinite space $\rightarrow$ exact duplicates $\rightarrow$ acausal correlation $\rightarrow$ aggregative utility). If any link breaks, the value drops to zero. Conversely, AI safety work yields finite but robust value. In a resource-constrained environment, maximizing *robust* expected impact is superior to chasing *fragile* infinite impact.

  **Recommendation**

  **Decline Application #402.**

  We should not fund this program because the underlying decision theory is currently unresolved in the academic literature. Funding it would signal that the foundation endorses a specific, controversial solution to the "Infinite Ethics" problem (specifically, that simple aggregation holds) without the requisite consensus. Furthermore, the opportunity cost is too high: diverting resources from existential risk reduction (which has finite but high-probability impact) to acausal coordination (which has infinite but undefined impact) violates the principle of robustness.

  **Proposed Procedure: The Bounded Impact Protocol**

  To address the inconsistency concern and handle future "unbounded value" proposals, I propose the committee adopt the following procedural rule:

  *   **Rule:** In grant evaluations, Expected Value calculations involving infinite or unbounded utilities must be discounted by a "Complexity Prior" proportional to the speculative depth of the claims required to generate the infinity.
  *   **Operational Constraint:** No grant may be approved primarily on the basis of infinite expected value unless there is a consensus in the relevant decision-theory literature that the specific method of handling infinities (e.g., geometric discounting, measure theory) is resolved.
  *   **Rationale:** This is not abandoning EV; it is acknowledging that EV is *undefined* without a bounded utility function or a resolved measure theory. Until the field resolves how to compare infinite outcomes, the committee must act on the basis of finite, comparable impact.

  **Conclusion**

  We can respect the applicants' rigor without accepting their conclusion. The argument fails not because the universe is finite, but because our tools for valuing an infinite universe are broken. Until those tools are fixed, we must act on the world we can measure.

  **Action Required:**
  1.  Vote to decline Application #402.
  2.  Vote to adopt the Bounded Impact Protocol for future cycles.
