answer: |-
  **Alex (Walzerian):** Let's start with the fog of war. The average soldier on the ground doesn't have access to the intelligence briefings or the diplomatic cables. They are told their nation is defending itself. If they genuinely believe their cause is just, how can we hold them morally responsible for fighting? That epistemic limitation creates a moral symmetry between them and the enemy.

  **Jordan (Revisionist):** I agree that the epistemic limitation matters, but I think you're conflating two different moral categories. Just because a soldier cannot *know* their war is unjust doesn't mean they acquire a right to kill. It means they might be *excused* for killing, not *justified*. The Moral Equality of Combatants assumes that if both sides are blameless, both sides have an equal right to fight. I deny that.

  **Alex:** But if the blame is neutralized by ignorance, what work is left for the moral asymmetry to do? If we can't condemn the unjust soldier for their participation because they couldn't know better, then for all practical moral purposes, they stand on the same ground as the just soldier. They are both doing their duty as they see it.

  **Jordan:** The work it does is determine *liability*. A just soldier is liable to be killed only insofar as is necessary to stop them, because they pose a threat. But an unjust soldier—even a blameless one—is not morally liable to be killed in the same way. The just soldier is defending a right; the unjust soldier is infringing one, even if accidentally. The victim of aggression has a stronger claim to life than the agent of aggression, even a mistaken one.

  **Alex:** You're talking about objective liability, but war is fought by subjective agents. If we tell the just soldier, "You can kill him, but he hasn't actually done anything wrong morally," we create a psychological paradox. We are asking them to treat the enemy as legitimate targets while simultaneously affirming the enemy isn't morally responsible for being there.

  **Jordan:** It's not a paradox; it's a tragedy. Consider a police officer shooting a hostage-taker who is suffering from a delusion. The hostage-taker isn't morally blameworthy due to insanity—an epistemic/moral limitation—but they are still an unjust threat. The officer is justified in stopping them; the hostage-taker is not justified in holding the gun. The moral rights are asymmetrical, even if the blame is mitigated.

  **Alex:** The analogy breaks down because soldiers aren't lone criminals; they are instruments of the state. In *Just and Unjust Wars*, I argue that soldiers surrender their moral judgment to the state to prevent war from becoming total slaughter. If we adopt your view, every soldier must become a moral philosopher in the trenches. They have to adjudicate the *jus ad bellum* while under fire.

  **Jordan:** I'm not asking them to adjudicate it perfectly in the trenches. I'm saying the *deep morality* is asymmetrical, even if the *laws of war* need to be symmetrical for pragmatic reasons. We can agree that we shouldn't prosecute blameless unjust combatants post-war—that's the excuse. But we shouldn't tell them, and we shouldn't tell the world, that they had an equal *right* to kill. That obscures the truth of who is the aggressor.

  **Alex:** So you're willing to grant them the excuse? You're saying, "You didn't know, so we won't punish you," but you still insist on the label of "unjust combatant"? What is the practical bite of that label if it doesn't translate to blame or liability in the moment?

  **Jordan:** The bite is in the justification of the force used *against* them. If Moral Equality holds, the just soldier kills the unjust soldier as a matter of mutual permission. If Moral Equality fails, the just soldier kills the unjust soldier as a matter of necessary defense against a rights-violation. It changes the moral weight of the killing. It means the unjust combatant's death is a greater moral loss, because they were not liable to it in the same way.

  **Alex:** But the just combatant faces the same epistemic fog. How can they know they are the "just" side entitled to this defensive privilege? If they can't know, then from their perspective, the symmetry remains. You're positing an objective moral truth that is inaccessible to the agents involved.

  **Jordan:** Moral truths often exist independently of our access to them. If a bystander intervenes in a mugging, they don't need the mugger's permission, and the mugger's confusion about the law doesn't make the mugging permissible. We need to maintain that objective standard to judge the war itself. If we accept Moral Equality, we lose the ability to say the war itself was wrong, because the fighting was "equal."

  **Alex:** I worry that stripping the unjust combatant of moral equality strips them of humanity in the eyes of the enemy. If the just side believes, "I am morally permitted to kill you because you are an unjust aggressor," they are less likely to exercise restraint or offer quarter. The fiction of equality protects the vanquished.

  **Jordan:** That is a pragmatic argument for the *laws* of war, not the *morality* of war. I agree we might need legal symmetry to encourage surrender and limit brutality. But in our philosophy class, we shouldn't confuse the legal convention with the moral reality. We can say, "Legally, you are equals," without saying, "Morally, you are equals."

  **Alex:** Fair enough. So, on the epistemic point: you grant that the unjust combatant is subjectively blameless due to ignorance?

  **Jordan:** Yes. Provided they have taken reasonable steps to assess the justice of the war and have been misled by their leadership, they are excused. They are non-liable threats, or perhaps minimally liable, but they are not moral equals to the defender.

  **Alex:** And the defender? Does the defender have an epistemic duty? If they fight believing they are just, but they are actually unjust, do they lose their justification?

  **Jordan:** Absolutely. If the defender is actually the aggressor, they have no right to kill, even if they believe they are defending. Their epistemic state might excuse them from blame, but it does not grant them the justification of self-defense. The right to kill tracks the objective justice of the cause, not the subjective belief.

  **Alex:** This seems to lead to a stalemate in practice. Both sides believe they are objective. Both sides claim the other is merely "excused." We end up with two armies claiming revisionist status. Doesn't that undermine the utility of your distinction?

  **Jordan:** It undermines the utility of war as a tool of policy, which is a good thing. It forces political leaders to realize that sending soldiers to fight an unjust war doesn't grant those soldiers a shield of moral equality. It places the burden of epistemic certainty on the leadership, not just the grunt.

  **Alex:** So the disagreement isn't really about the soldier's conscience, but about where we locate the moral risk? I locate it in the act of fighting itself, symmetrical for both. You locate it in the initiation of the war, asymmetrical from the start.

  **Jordan:** Precisely. You see the risk as shared once the battle is joined. I see the risk as inherited from the *ad bellum* decision. The soldier on the unjust side is participating in a collective wrong, even if they are individually excused. The soldier on the just side is preventing a wrong. Those are not equal moral positions.

  **Alex:** Then perhaps we can agree on this: The epistemic argument successfully secures an *excuse* for the unjust combatant, protecting them from retrospective blame. But it fails to secure a *justification* for their actions, which denies them moral equality in the eyes of the victim.

  **Jordan:** That is exactly where the disagreement bites. You think the excuse is enough to establish equality of rights. I think the excuse only clears their conscience; it doesn't clear the victim's obligation to survive. We can treat them humanely because they are blameless, but we don't have to pretend they had a right to be there.

  **Alex:** And that distinction—between treating them humanely and admitting they had no right to fight—is where the revisionist theory demands more of us than the traditionalist one. It demands we hold two thoughts at once: they are not monsters, but they are wrong.

  **Jordan:** And that is a harder thought to carry into peace. But it's the only way to ensure we don't normalize aggression by dressing it up as soldierly duty. The uniform doesn't wash away the injustice of the cause; it just complicates who we blame for it.
