          *   *Lucas-Penrose:* Claims humans solve uncomputable problems.
          *   *Complexity Objection to LP:* Usually argues that humans might be TMs, but finding the Gödel sentence is too hard (computationally expensive) for us to actually do in a lifetime, so the fact we *haven't* found it doesn't prove we *can't*. OR, it argues that human reasoning is approximate/fast (heuristics) rather than sound/slow.
