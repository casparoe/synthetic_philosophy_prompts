      (3) But you can't be truly responsible for being the way you are... regress. (Correct)
      (4) Therefore never truly responsible. (Correct)
      The *structure* is right. The *interpretation* (hard determinism) is wrong. I'll give partial credit for the structure.

      *(Determinism point)*: The student says indeterminism would *block* step 3. This is the exact opposite of Strawson's point. Strawson argues indeterminism (randomness) *also* fails to secure responsibility. Zero points here.

      *(P.F. Strawson)*: Student says they "line up pretty well." This is a common confusion but in a grad seminar, distinguishing the "Optimist" from the "Pessimist" is crucial. Galen explicitly argues against the possibility P.F. takes for granted. Very low points.

