      *   Avoid jargon where possible, or explain it (e.g., "time inconsistency," "self-locating belief").

  7.  **Final Review against constraints:**
      *   Essay format? Yes.
      *   Weigh both sides? Yes.
      *   Unhedged verdict? Yes (Planning-Optimal).
      *   Implications for character? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to confuse AMD with Sleeping Beauty, though they are related. In AMD, the focus is on *choice*, not just belief. The core argument for Planning-Optimality is that the "Action-Optimal" calculation double-counts or misweights the payoff because it treats the two intersections as independent chances when they are causally linked by the driver's strategy. I will emphasize the *causal link*.

