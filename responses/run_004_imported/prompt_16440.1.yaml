  **The Consistency of Flesh**

  The broth had skin on it. A thin, congealed film that gathered in the center of the bowl where the heat had failed to reach. Kurt stared at it, his hands resting on the white sheet that covered legs like bundled sticks. He was sixty-five years old, though the man in the mirror looked like a relic from a darker century. Thirty kilograms. The number floated in his head, precise, measurable, undeniable.

  The tray sat on the overbed table. It was an equation he could not solve.

  In the quiet of the Princeton hospital room, the logic still held. It had to hold. He had written it out in letters to his mother decades ago, the ink still wet in his memory. The dichotomy was clean, elegant, immune to the decay rotting his own tissues.

  *Premise One:* The world is rationally constructed.
  *Premise Two:* A rational world would not develop a mind capable of open-ended conceptual growth—capable of grasping infinity, of seeing the edges of logic—only to extinguish it at the precise moment it begins to understand its own capacity. That would be waste. That would be absurdity.
  *Conclusion:* Therefore, the mind must continue.

  *Alternative:* The world is not rational.
  *Consequence:* If the world is not rational, then human reason is untrustworthy. Including the reason that suggests death is the end. Including the fear of death itself. The worry cancels itself out.

  It was a proof. As solid as the incompleteness theorems that had made him a ghost in his own lifetime. If the universe made sense, he would survive. If it didn't, survival was irrelevant because truth was irrelevant. There was no logical space for permanent cessation.

  And yet, the spoon trembled in his hand.

  The broth smelled of salt and boiled bone. It smelled of chemistry. It smelled of *them*.

  Adele was not here. That was the variable that broke the equation. For years, she had been the control group. She would take the first bite, the first sip, waiting an hour to see if her throat closed, if her stomach convulsed. She was the empirical verification of safety. But Adele was in another building now, hooked to machines of her own, her body failing in a way that was mundane and biological, not conspiratorial. Without her, the data was unverified.

  To eat was to accept an axiom. *This food is safe.* But Kurt knew better than anyone that a system cannot prove its own consistency from within. He needed an external validator. He needed Adele.

  "Mr. Gödel," the nurse said from the doorway. She was young, her uniform crisp, her face a mask of professional pity. "You need to take something. Just a few spoonfuls."

  "It is not consistent," Kurt whispered. His voice was dry leaves skittering on pavement.

  "The food?"

  "The situation."

  He looked back at the bowl. The friction was unbearable. Here was a mind that had mapped the boundaries of God and truth, now held hostage by the gut instinct of a prey animal. The rationalist argument for immortality demanded a universe of order. But the fear of poisoning demanded a universe of chaotic, personal malice.

  If the world was rational, why would anyone want to poison him? He was no threat. He was a skeleton in a hospital gown.
  If the world was irrational, why trust the logic that said he would live forever?

  The paradox tightened around his throat. He set the spoon down. The clink was loud in the sterile room.

  Days dissolved into a gray static. The hunger did not come as a pain, but as a absence. A hollowing out. First, the fat vanished, then the muscle, leaving the architecture of the man exposed. His skin became parchment, translucent enough to show the blue rivers of veins beneath.

  He spent the hours working the proof again, polishing it like a stone. *Absurdity.* That was the key word. It would be absurd for the cosmos to craft a vessel capable of containing the concept of eternity and then shatter it against the rocks of biology. Death was a glitch. A syntax error.

  But the body did not care about syntax. The body cared about calories.

  His heart began to flutter, a bird beating against a cage too large for it. The cold moved in from the extremities. He pulled the sheet up, but the heat did not return. In the delirium of the third week, the walls of the room seemed to breathe. He saw shadows detach themselves from the corners, not as hallucinations, but as possibilities. If they were here to finish the work, to switch off the light, then the world was irrational. It was chaotic. It was cruel.

  And if it was cruel, then his proof was wrong.

  If the proof was wrong, then the end was truly the end.

  The terror was not of dying. It was of the logic failing. It was the prospect that the universe was merely mechanical, a great grinding mill that chewed up minds and spat out silence. If that were true, then all his life's work was just noise. Beautiful noise, but noise.

  Adele came once, wheeled in for a brief visit. She was pale, her hand shaking as she reached for his. He wanted to tell her that she was the only axiom he trusted. He wanted to tell her that if she ate the soup, he would eat the soup. But he had no strength to lift his head. He watched her lips move, forming words he could not hear over the ringing in his ears. She was gone before the sun set.

  The end did not come with a revelation. It came with a slowing.

  On the last day, the nurse returned. She checked the chart, frowned at the weightless body on the bed, and adjusted the IV that he had somehow managed to dislodge during the night. There was no food tray today. It didn't matter.

  Kurt lay still. The pain had receded, replaced by a vast, drifting distance. He thought of the dichotomy one last time.

  *Either the world is rational...*

  The ceiling was white. Stained with water damage near the corner. A random pattern. Irrational.

  *...or it is not.*

  His breath hitched. The rhythm was breaking.

  If he was right, the darkness coming for him was merely a door. He would step through it, and the mind would expand, unbound by the starving flesh. The absurdity of extinction would be avoided. The consistency of the universe would be preserved.

  If he was wrong, the darkness was simply nothing. No mind to observe the nothingness. No regret. No error.

  He tried to lift his hand to test the air, to see if the space between his fingers felt different, charged with the potential of continuation. He could not lift it.

  The nurse leaned over him. Her voice was far away, sounding as if it came from underwater. "It's okay," she said. "You can rest now."

  *Rest.* A biological function. A cessation.

  Kurt closed his eyes. The logic remained perfect, suspended in the void of his weakening synapses. The proof was sound. The premises were solid. The conclusion was inevitable.

  But as the heart skipped a beat, then two, the only thing that mattered was the immediate, physical truth of the room. The smell of antiseptic. The coldness of the sheet. The silence of the man who had proven God, waiting to see if God would prove him.

  The monitor flatlined. A single, continuous tone filled the room, steady and rational and utterly devoid of meaning.

  Whether the mind drifted upward into the light or dissolved into the dark, the room remained exactly the same. The tray sat on the table, the skin on the broth undisturbed, cooling slowly in the air conditioning, holding its secret tight.
