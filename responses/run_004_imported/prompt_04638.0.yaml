answer: |-
  This is one of the sharpest tensions in contemporary political philosophy, and your friend has put her finger on a critique that has been leveled at Rorty since the 1980s (most notably by Jürgen Habermas and Hilary Putnam).

  The short answer is: **Your friend's reading is textually defensible but philosophically uncharitable.** It captures the *risk* of Rorty's position without accounting for the *ethical guardrails* he built into it. Rorty is not guilty of the "self-own" you fear, but he is guilty of a dangerous gamble: he tried to save liberal democracy by stripping it of its claim to objective truth, hoping solidarity would be enough to hold it together.

  Here is a breakdown of the distinction you need to make your piece fair to Rorty while acknowledging the potency of the critique.

  ### 1. The Quote vs. The Doctrine
  Your friend quotes Rorty: *"Truth is what your contemporaries let you get away with saying."*

  This is the soundbite version of his **antirepresentationalism**. Rorty argued that the traditional philosophical view of truth (Correspondence Theory)—the idea that our sentences "mirror" nature or Reality with a capital R—is useless. We can never step outside our language to check if it matches the world. Therefore, "truth" is just a compliment we pay to beliefs that are well-justified within our current social practices.

  **Where your friend is right:** If truth is just social justification, then technically, if a demagogue convinces enough people that the crowd was bigger, that claim becomes "true" within that community's framework. Rorty removes the "God's eye view" that allows us to say, "No, objectively, you are wrong."

  **Where your friend flattens the distinction:** Rorty did not think *any* consensus counts as truth. He was a **liberal ironist**. He believed in the specific social practices of liberal democracies (free press, open inquiry, friction between ideas) not because they lead to "The Truth," but because they reduce cruelty. For Rorty, the demagogue isn't wrong because he violates Reality; he is wrong because he violates the *norms of inquiry* that allow a free society to function.

  ### 2. Ironism vs. Cynicism (The Crucial Distinction)
  The accusation that Rorty paved the way for post-truth politics assumes that removing objective truth leads to nihilism ("Nothing is true, so anything goes"). Rorty argued the opposite.

  *   **Cynicism:** "Nothing is grounded, so I don't care what I believe." (This is the post-truth mindset).
  *   **Ironism:** "Nothing is grounded, so I take full responsibility for what I choose to believe and must persuade others without appealing to authority."

  Rorty wanted a culture where people admitted their values were contingent (historical accidents) but held them anyway because they were *useful* for creating a less cruel world. He thought appealing to "Objective Truth" was actually dangerous because it makes compromise impossible (you can't compromise with someone who claims to speak for God or Science).

  So, to answer your specific question: **Does Rorty have a principled way to object to the demagogue?**
  Yes, but it is **pragmatic, not metaphysical.** He objects to the lie about the crowd size not because it fails to correspond to the physical world, but because it is a move that corrodes the trust necessary for social cooperation. It is "bad" in the same way cheating at a card game is bad—not because it violates a law of physics, but because it makes the game unplayable.

  ### 3. The Prediction vs. The Philosophy
  This is the most important nuance for your piece. You need to separate Rorty's **political sociology** (the prediction in *Achieving Our Country*) from his **epistemology** (the theory of truth).

  *   **The Prediction:** This was based on class analysis. Rorty argued that the Left abandoned the working class for cultural symbolism, creating a vacuum for a populist strongman. This prediction did not require antirepresentationalism. A Marxist or a traditional Liberal could have made the same call.
  *   **The Philosophy:** This was about how we justify our beliefs.

  The irony your friend points out is that while Rorty's *sociology* predicted the rise of the strongman, his *epistemology* inadvertently weakened the tools the Left might use to fight him. By teaching a generation that "truth is social construction," he may have disarmed the liberals who needed to assert that **facts matter.**

  When the Trumpian strongman says, "I have my facts, and you have yours," he is speaking a vulgarized, weaponized version of Rortyan pragmatism. Rorty would hate this usage (he valued evidence and scientific consensus as the "best tools we have"), but he has to admit the vocabulary sounds similar.

  ### 4. How to Frame This in Your Piece
  To be fair to Rorty without letting him off the hook, consider framing it as a **tragic gamble** rather than a contradiction.

  Rorty knew this critique. He was asked repeatedly: "If there is no objective truth, what stops the Nazis?" His answer was essentially: *Nothing guarantees it.* That's the point. There is no metaphysical safety net. We have to work to keep liberalism alive because it's better than the alternative, not because History or Truth is on our side.

  **The Verdict for your narrative:**
  Your friend is right that Rorty's philosophy creates an **intellectual vulnerability.** By dismantling the authority of "objective truth," he made it harder to distinguish between a consensus based on evidence and a consensus based on propaganda.

  However, calling it a "self-own" implies Rorty didn't care about the outcome. He did. He believed that if we stopped fighting over who owns "The Truth" and started fighting over how to reduce suffering, we'd be better off. The tragedy of post-truth politics is that it took Rorty's insight ("Truth is a social tool") and weaponized it ("Truth is a weapon for my tribe"), discarding Rorty's commitment to solidarity and decency.

  **Suggested angle:** Rorty didn't supply the alibi for post-truth; he supplied the **diagnosis**, but he underestimated the virus. He thought that once we admitted truth was contingent, we would become more tolerant and pragmatic. Instead, we became more tribal. He hoped that without the crutch of Objective Truth, we would learn to walk on our own moral legs. Instead, many decided to run over others.

  That distinction saves him from the charge of hypocrisy, but it leaves open the charge of **naiveté**—which is perhaps a more interesting flaw for a philosopher to have.
