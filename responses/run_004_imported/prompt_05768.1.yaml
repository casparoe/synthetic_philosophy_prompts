answer: |-
  **Setting:** *A dimly lit university faculty lounge, 11:30 PM. Two empty coffee pots. A whiteboard covered in half-erased diagrams.*

  **Characters:**
  *   **DAVID (Lewisian):** A metaphysician. Wears a cardigan. Believes causation is a relation of dependence grounded in the mosaic of local matters of particular fact.
  *   **JIM (Interventionist):** A philosopher of science/statistician. Wears a hoodie. Believes causation is about invariant relationships under ideal interventions.

  ***

  **Jim:** Look, I'll say it plainly. You're trying to build a cathedral out of fog. I open Pearl's book, I draw the nodes. $S$ for Suzy, $B$ for Billy, $Sh$ for Shattering. Arrows go $S \to Sh$ and $B \to Sh$. I run the $do$-calculus. $P(Sh | do(S=1)) = 1$. $P(Sh | do(S=0)) = 0$, *holding Billy fixed*. Suzy causes the shattering. Done.

  **David:** Holding Billy fixed? That's the magic trick, isn't it? You're waving a wand called "structural equation" and pretending it's not just counterfactuals in a tuxedo.

  **Jim:** It's not magic. It's modularity. When I intervene on Suzy, I sever the incoming arrows to Suzy, but I *don't* touch the mechanism linking Billy to the bottle. Your theory relies on "similarity between possible worlds." If Suzy doesn't throw, how similar is the world where Billy also doesn't throw versus the world where he does? You need a metric. I need a graph.

  **David:** And where does the graph come from, Jim? Did it descend from heaven? To draw that arrow from $S$ to $Sh$, you already have to know that Suzy is a cause. You're using causal knowledge to define causation. I'm trying to give truth conditions for the claim "Suzy caused the shattering" without presupposing it.

  **Jim:** I'm not giving truth conditions; I'm giving assertability conditions. Causation is about manipulation. If I want to stop the bottle from breaking, do I stop Suzy or Billy? In late preemption, stopping Suzy works. Stopping Billy doesn't, because Suzy is already in flight. My theory captures the *control* aspect. Your theory... well, let's talk about the rock.

  **David:** The rock in mid-air?

  **Jim:** Exactly. The classic late preemption case. Suzy throws, rock flies, bottle breaks. Billy throws, rock flies, but the bottle is already broken. The simple counterfactual fails: "If Suzy hadn't thrown, the bottle wouldn't have shattered." False. Billy's rock would have done it. So, on your 1973 account, Suzy isn't a cause.

  **David:** I abandoned the simple counterfactual analysis in the postscripts, Jim, and you know it. I moved to causal *chains*. Suzy's throw causes the rock to be in mid-air. The rock in mid-air causes the shattering. There is stepwise dependence. $C \to D \to E$. Even if $C \to E$ fails, the chain holds.

  **Jim:** But how do you individuate the intermediate event $D$? "Rock in mid-air." If Suzy hadn't thrown, would *that* specific event occur? No. But why is *that* the relevant intermediate event? Why not "air pressure at coordinate X"? If you choose the wrong intermediate events, the chain breaks. You're selecting the intermediates *because* you know they lie on the causal path. You're smuggling the graph into the possible worlds.

  **David:** I'm not smuggling it; I'm relying on intrinsicness. The process from Suzy's throw to the shattering is intrinsic. It doesn't depend on Billy. Billy is extrinsic backup. The chain exists in the actual world regardless of whether Billy is standing there with a rock in his pocket. My similarity metric prioritizes worlds where the laws of nature hold and the actual past is preserved up to the point of divergence. It's not arbitrary.

  **Jim:** It is arbitrary when it matters most. To evaluate "If Suzy hadn't thrown," you have to decide how much of the past to hold fixed. Do you hold fixed Billy's decision to throw? If you do, you get the right answer (Suzy is a cause). If you don't—maybe Billy only throws because he saw Suzy throw—you get the wrong answer. Your "similarity" is doing all the heavy lifting, and it's context-sensitive. My graph makes the context explicit. The graph *is* the context.

  **David:** So you think we're saying the same thing? That the Structural Causal Model is just a rigid formalization of my similarity heuristic?

  **Jim:** I think you're chasing a metaphysical ghost. You want to know what causation *is* in the fabric of the universe. I think causation *is* the invariance. If the relationship between $S$ and $Sh$ remains stable when I wiggle $S$, that's all there is to it. There's no "glue" underneath. So, in that sense, we aren't rivals. You're doing metaphysics; I'm doing methodology. But you claim your theory tells us when causation exists. And in preemption, your theory only works if you rig the similarity metric to match my graph.

  **David:** That's uncharitable. Let's turn it around. Your interventionist account relies on the notion of an "ideal intervention." To intervene on $S$, you must ensure $S$ is not caused by anything else, and $S$ affects $Sh$ only through the designated path. But to define "path," you need causation. To define "intervention," you need to know you aren't accidentally causing $Sh$ through a backdoor. You're defining causation in terms of intervention, and intervention in terms of causation. It's circular.

  **Jim:** It's not circular; it's recursive. We build up from primitive manipulations. I know what it means to wiggle a variable because I'm an agent. I don't need a metaphysical reduction of "wiggle."

  **David:** But you need to know *which* wiggles count. In the Suzy/Billy case, your graph has two arrows entering $Sh$. You say "hold $B$ fixed." That's a counterfactual! You're saying, "In the closest world where $S$ is set to 0 by intervention, $B$ remains 1." That is a Lewisian counterfactual. You haven't escaped me, Jim. You've just hidden the similarity metric inside the $do$-operator.

  **Jim:** Okay, fair. The semantics of the counterfactuals in SCM might look like yours. But the *ontology* is different. For you, the truth of "Suzy caused the shattering" depends on a comparison between the actual world and a non-actual world. For me, it depends on the structural properties of the actual system. The equations describe the mechanisms *here*. I don't need to travel to possible worlds to check the truth. I just need to know the modular structure of the machine.

  **David:** But how do you verify the structure without checking what would happen if you broke the modules? You run experiments. You check counterfactuals.

  **Jim:** I check *invariances*. There's a difference. A counterfactual is a singular claim about an event. Invariance is a generalization. "If I intervene on $S$, $Sh$ changes" is a claim about a relationship that holds across a range of conditions. Your theory struggles with general causation. It's built for singular events. "Did this throw cause this break?" Mine handles "Do throws cause breaks?" naturally.

  **David:** I can handle general causation via patterns of singular causation. But let's go back to the core issue. You asked if we are rivals. If I say causation is counterfactual dependence (chained), and you say causation is invariance under intervention... aren't interventions just a way of *testing* counterfactual dependence?

  **Jim:** No. That's the epistemic/ontological split. You think interventions reveal the causation. I think interventions *constitute* the causation. If a relationship is not manipulable, it's not causal, even if there is counterfactual dependence. Think about a barometer and a storm. Barometer falls, storm comes. Counterfactual: If the barometer hadn't fallen, would the storm have happened? On your similarity metric, if you magically stop the barometer needle but keep the atmospheric pressure the same, the storm still happens. So no causation. Good.

  **David:** Right. Because the closest world where the barometer doesn't fall is one where the mechanism is broken, not the pressure.

  **Jim:** Exactly. But now imagine a case where you *can't* intervene. Say, the Big Bang. Or macroeconomic trends where you can't isolate variables. For you, there might still be causal facts there, grounded in counterfactuals. For me, if there's no possible intervention structure, the causal claim is meaningless.

  **David:** So you're an anti-realist about causation in non-manipulable systems?

  **Jim:** I'm an agnostic. I say the concept doesn't apply. You say the concept applies but we can't touch it. That's a real difference.

  **David:** It is a difference. But is it a difference about *causation*, or about *science*? I'm trying to tell you what the world is like. You're telling me what scientists can say. In the Suzy/Billy case, we both agree Suzy is the cause. We both agree Billy is not.

  **Jim:** We agree on the verdict. We disagree on the *reason*. You say Suzy is the cause because there is a chain of intrinsic events linking her throw to the break, and Billy's chain is cut short. I say Suzy is the cause because the system of equations is modular with respect to her variable, and Billy's variable is screened off.

  **David:** But to justify the modularity, you need to know that Billy's rock doesn't hit. That's a fact about the physical process. The "intrinsicness" I talk about... isn't that just the physical realization of your "modularity"?

  **Jim:** Maybe. Here's where I get suspicious. Your "similarity of worlds" is vague. How similar is similar? It's context dependent. My graph is precise. But to get the graph, I need background knowledge. You say that background knowledge is causal. I say it's structural.

  **David:** Let's try this. Imagine a world where the laws of physics are different. Suzy throws, rock teleports to the bottle. Billy throws, rock teleports. Suzy's arrives first. Is there causation?

  **Jim:** If the teleportation is invariant under intervention on Suzy, yes.

  **David:** But there's no physical process. No continuous chain. My 1986 theory required quasi-dependence, intrinsic processes. I might say no causation there, or at least it's weird.

  **Jim:** See! That's the divergence. I don't care about the "process." I care about the dependency structure. If $do(S)$ changes $Sh$, it's causal. You care about the "oomph," the transmission of energy or information.

  **David:** I don't need energy transmission. I need dependence. But I worry that without the constraint of physical process, your interventionism allows "spooky" causation.

  **Jim:** And I worry that without the constraint of intervention, your counterfactualism allows "metaphysical" causation that science can't touch.

  **David:** So, are we rivals?

  **Jim:** I think you're doing the hard work of justifying the counterfactuals that I take as primitive. You're trying to ground the logic I use.

  **David:** And I think you're taking the tools of causal discovery and mistaking them for the nature of causation itself. You've built a beautiful engine, Jim, but you're claiming the engine is the road.

  **Jim:** *Laughs.* That's poetic. But look at the board. *Points to the DAG.* This graph predicts the outcomes of your thought experiments. Your possible worlds predict the outcomes of my interventions.

  **David:** Because they are tracking the same underlying reality. The structure of dependence.

  **Jim:** Or because your theory is just a narrative wrapper for the logic I'm formalizing.

  **David:** Or because your formalism is just a computational shortcut for the metaphysics I'm describing.

  **Jim:** *Takes a sip of cold coffee.* So, Suzy caused the shattering?

  **David:** Yes. Because if we trace the chain of events...

  **Jim:** ...Because the structural equation for Shattering is sensitive to Suzy's throw.

  **David:** We agree on the bottle.

  **Jim:** We agree on the bottle. But if I ask "Does the gravitational field cause the orbit?" and you ask "Is there a counterfactual dependence without intervention?"...

  **David:** ...We might part ways.

  **Jim:** Good. Keep the mystery alive. I need grant money.

  **David:** And I need tenure. Cheers.

  **Jim:** Cheers. Now, help me figure out how to handle unobserved confounders in this DAG without assuming your "similarity metric."

  **David:** Don't tempt me. That's where I bring in the "miracle" at the time of intervention...

  **Jim:** Oh god. Not the miracle.
