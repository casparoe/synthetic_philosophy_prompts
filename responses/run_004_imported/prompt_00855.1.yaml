answer: |-
  This is a remarkably sophisticated reading of *On Certainty*, and your hesitation is philosophically healthy. You have correctly identified the core mechanism of Wittgenstein's late thought: the distinction between empirical propositions (which can be tested) and hinge propositions (which form the scaffolding for testing). You have also correctly spotted Wittgenstein's remarks on religious belief as a matter of "passion" or "conversion" rather than hypothesis (OC 611–612).

  However, your conclusion—that this renders your respective positions "equally groundless" and "incommensurable" in a way that demands a suspension of judgment—is likely a misapplication of Wittgenstein to this specific context. It is a reading that leans heavily into a relativistic interpretation of Wittgenstein (often associated with certain readings of Kuhn or Feyerabend) which many scholars argue Wittgenstein himself would have resisted.

  Here are four reasons why your "graceful exit" might be philosophically premature, and how a more precise reading of *On Certainty* might actually complicate, rather than dissolve, the disagreement.

  ### 1. Hinges are usually pre-reflective, not defended doctrines
  Wittgenstein describes hinge certainties as things that stand fast for us *without* our needing to assert them. They are the quiet background against which doubt makes sense. As he writes, "If I want the door to turn, the hinges must stay put" (OC 343).

  Notice the nature of your disagreement: You are explicitly arguing about radiometric dating and fossil records. For you, "The earth is old" is a conclusion derived from the hinge "Scientific inquiry is a reliable method for determining physical history." For your brother, "The earth is young" is a conclusion derived from the hinge "The Bible is the literal, inerrant word of God."

  The problem is that your brother is treating a derived claim ("The earth is 6,000 years old") *as if* it were a hinge. He is defending it aggressively. Wittgenstein suggests that when someone treats an empirical claim as a hinge, they are often engaging in a kind of category mistake, or protecting a worldview that is under threat.

  If you accept the "equal hinges" reading, you validate his treatment of a specific geological claim as a foundational certainty. A stricter Wittgensteinian reading might suggest that his "hinge" is actually *religious authority*, while yours is *empirical coherence*. The disagreement isn't between two equal hinges; it is a conflict over which hinge governs the domain of geology. Wittgenstein does not say all hinges are equal; he says they function differently than empirical claims. He leaves open the possibility that some systems of hinges are more coherent with the rest of our lives than others.

  ### 2. The "Shared Background" Problem
  You hit on the most critical weakness in your own reading when you noted that you "share nearly all of their background beliefs." Wittgenstein's examples of incommensurability (the King who believes the world began at his birth, or a tribe that believes people go to the moon to talk to spirits) involve radically different forms of life.

  You and your brother share a language, a culture, a technology, and a nation. You both likely trust the same engineers when you cross a bridge, the same doctors when you are sick, and the same pilots when you fly. Your brother accepts the hinge "Physics works" when he turns on a light switch, but rejects the hinge "Physics works" when he looks at a rock.

  Wittgenstein acknowledges that when systems overlap significantly, we are not helpless to critique. If a person's hinges lead to contradictions within their own form of life, Wittgenstein allows that we can point this out. If your brother relies on radiometric technology (e.g., smoke detectors, medical imaging) while denying the physics that underpins radiometric dating, his system of hinges is not a clean, alternative "worldview." It is a patchwork. Wittgenstein's philosophy doesn't require you to treat a patchwork system as equally valid as a coherent one.

  ### 3. "Mistake" vs. "Mental Disturbance"
  Wittgenstein draws a sharp line between someone making a mistake within a system and someone whose relationship to reality is fundamentally altered.
  > "If someone believes that he has flown from America to England in the last few days, then I cannot make a mistake in believing that what he says is false." (OC 703)

  He also notes:
  > "If someone is doubtfully sane or not, the question is whether he is making a mistake or not." (OC 155)

  While Wittgenstein is cautious about calling religious believers "insane," he does suggest that when someone rejects overwhelming, everyday certainties that govern the shared form of life, they may be placing themselves outside the language game where "truth" and "falsehood" function normally.

  This doesn't mean you should call your brother insane. It means that Wittgenstein does not necessarily grant that his position is a *rival epistemology* worthy of equal standing. It might be, in Wittgenstein's terms, a refusal to play the language game of empirical investigation. If he opts out of that game, you cannot force him back in with evidence (hence the "conversion" remark). But opting out of the game doesn't make his claims *true within his game*; it just means he isn't making truth-claims in the way you understand them. He is making confessions of faith.

  ### 4. The Danger of Philosophical Tranquilizers
  You admitted that this conclusion is "convenient." Wittgenstein was deeply suspicious of philosophy being used as a tranquilizer. He wanted to "show the fly the way out of the fly-bottle," not to convince the fly that the bottle is a comfortable home.

  Using *On Certainty* to declare the dispute "incommensurable" risks turning Wittgenstein's descriptive analysis into a normative shield. Wittgenstein describes *how* certainty works; he does not prescribe that we must respect all certainties equally. In fact, he emphasizes that our certainties are bound up with our *actions*.
  > "Giving grounds... comes to an end;—but the end is not an ungrounded presupposition: it is an ungrounded way of acting." (OC 110)

  Your brother's "way of acting" involves rejecting the consensus of the scientific community. Your "way of acting" involves accepting it. Wittgenstein would likely say that you cannot argue him out of it, because it is not based on argument. But he would not necessarily say you must view his way of acting as equally grounded. He might say you are simply different kinds of people now, operating with different instincts.

  ### A More Wittgensteinian Approach to the Relationship
  If you want to use Wittgenstein to heal the relationship without sacrificing your intellectual integrity, consider shifting the focus from **Truth** to **Authority**.

  1.  **Acknowledge the Limit of Evidence:** Wittgenstein agrees with you that evidence won't work. Stop bringing up fossils. You are correct that for him, the authority of Scripture trumps the authority of data. Acknowledging this isn't conceding he is right; it's acknowledging the *structure* of his belief. You can say, "I realize that no amount of data will change your mind, because your certainty comes from a different source than mine."
  2.  **Identify the Hinge, Not the Claim:** Stop arguing about the age of the earth. Argue (gently) about the hinge. "We seem to disagree on whether scientific consensus is a trustworthy guide for physical reality." This moves the conversation to the actual divergence point without demanding he abandon his faith.
  3.  **Accept the "Conversion" Dynamic:** If Wittgenstein is right, the only way he changes his mind is through a "conversion"—a shift in his form of life, perhaps triggered by something non-rational (a personal crisis, a change in community, a new spiritual experience). You cannot logic him into this. Accepting this might relieve the frustration without requiring you to accept his geology.
  4.  **Resist Relativism:** You do not have to accept that "The earth is 6,000 years old" is true-in-his-framework. For Wittgenstein, the "framework" isn't a bubble where anything goes. It's a way of acting in the *one* world we share. If his framework requires him to ignore the bridge he drives over, that is a tension *he* has to manage, not one you need to validate.

  ### Conclusion
  You are right to be uneasy. Your reading of *On Certainty* is textually plausible but contextually overstretched. Wittgenstein is describing the limits of justification, not declaring a moratorium on distinguishing between coherent and incoherent world-pictures, especially among people who share a form of life.

  The "graceful exit" of incommensurability might save the peace temporarily, but it risks invalidating your own commitment to truth, which is also a hinge for you. A more honest Wittgensteinian stance is: *"We share a world, but we trust different authorities. I cannot prove my authority to you, and you cannot prove yours to me. But I will not pretend your claims about rocks are the same kind of claims as mine."*

  This maintains the relationship by lowering the temperature of the debate, without requiring you to pretend the disagreement doesn't exist or that both sides are equally rational. It honors Wittgenstein's insight that reasons give out, without succumbing to the idea that all stopping points are equal.
