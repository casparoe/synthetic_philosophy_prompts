          *   *Incommensurability:* Wittgenstein suggests communication breaks down at the hinges, but he doesn't say we must accept all hinges as equal. He describes *how* disagreement functions, not necessarily that we must suspend judgment on truth.
          *   *The "King" Example:* This is about a radical difference in world-picture. The user and brother share a world-picture (modernity) but the brother has patched a specific hole with a different material.
          *   *Mistake vs. Framework:* Wittgenstein distinguishes between a mistake (wrong calculation) and a different framework. But if the brother accepts modern medicine, travel, etc., he is selectively applying his framework. This creates internal tension Wittgenstein would notice.
      *   **Practical Application:** How does this help the relationship?
          *   Stop trying to prove the unprovable (the hinges).
