      *   OC 611-612 (Conversion/Passion).
      *   OC 94-99 (System of beliefs).
      *   OC 205 (If the true becomes the groundless).
      *   Make sure not to attribute "Relativism" too strongly to Wittgenstein; it's debated (Moyal-Sharrock vs. others). Stick to the text's implications for *this* case.

