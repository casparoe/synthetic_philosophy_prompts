prompt: |-
  Okay so last night me and my friend Jordan got into it over something that started as a dumb argument about a football bet and somehow spiralled into a full-on logic fight. Jordan's position was that "if X happened, Y happened" and "if X had happened, Y would've happened" are basically the same claim just wearing different verb tenses, and that anyone who thinks otherwise is overthinking grammar. I tried to use the classic Oswald/Kennedy pair on him (something like "if Oswald didn't kill Kennedy, someone else did" seems true, but "if Oswald hadn't killed Kennedy, someone else would have" seems false) to show the two kinds of conditionals can genuinely come apart in truth value, not just in phrasing. Jordan wasn't having it though — he said that's a famous "gotcha" example he's definately seen in a logic class before, and it doesn't prove anything general, just that JFK conspiracy stuff is weird.

  So now I want to go back to him with a fresh case he can't wave away like that. Could you come up with a brand-new example — please NOT Oswald/Kennedy, not O.J. Simpson, no coin flips, no poker/riverboat gambler puzzles, and nothing about assassinations or firing squads either, since apparently all of those are "well known" to him — of an indicative conditional and its counterfactual counterpart (same rough antecedant and consequent) where ordinary people would clearly judge them to have different truth values, ideally something kind of mundane/everyday rather than another dramatic case? I did one semester of philosophy of language years ago so I get the basic idea (something about how indicatives update on what you already know to be true, while counterfactuals are about which possible worlds are "closest" to actual), but it's fuzzy, so a sentence or two on why your example actually works would help me not just sound like I'm parroting something I don't get.
