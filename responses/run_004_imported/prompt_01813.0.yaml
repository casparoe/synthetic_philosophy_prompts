  2.  **Deconstruct the Logical Difference:**
      *   *Indicative Conditional (If P, then Q):* Usually evaluated based on *actual* knowledge. We assume P is true within the context of what we actually know. It often functions to rule out possibilities incompatible with our knowledge.
      *   *Counterfactual Conditional (If P had been, Q would have been):* Evaluated by imagining a world *closest* to ours where P is true, even if P is actually false. It involves causal reasoning or laws of nature, not just epistemic updates.
      *   *The Divergence Point:* The divergence happens when the antecedent (P) is actually *false*, but we *believe* it might be true (or know something that makes the indicative trivially true based on correlation, while the counterfactual requires causation).
      *   *Key Mechanism:* The "Oswald" case works because we know Kennedy died.
          *   Indicative: "If Oswald didn't kill him, someone else did." (True, because we know *someone* killed him).
          *   Counterfactual: "If Oswald hadn't killed him, someone else would have." (False, because Oswald's action was the specific cause; without him, the conspiracy might have failed).
      *   *Need:* A scenario where we know the *outcome* (making the indicative true via elimination) but the *cause* was specific/contingent (making the counterfactual false).

