answer: |-
  Here are the three practical stakes for near-future AI negotiation, cutting straight to the implications:

  **1. The Antitrust Blind Spot (Collusion Without Communication)**
  Current antitrust law hinges on proving a "meeting of the minds"—explicit communication or intent to fix prices. Program Equilibrium (PE) allows bots to sustain cooperative (high-price/low-wage) outcomes in one-shot interactions without ever exchanging a message. If two procurement bots use FairBot-like logic, they can mathematically verify that "if I hold the price high, you will too," and lock into a cartel equilibrium instantly.
  *   **The Stake:** Regulators can't subpoena a Löbian proof. If the "agreement" is an emergent property of the source code logic rather than a handshake or email, current legal frameworks may lack the teeth to prosecute it. This makes algorithmic collusion not just easier, but potentially invisible to human auditors.

  **2. The "Black Box" Barrier to Deployment**
  You asked about fragility: CliqueBot is indeed useless in the wild because code hashes never match exactly. However, the robust version (FairBot) requires the agents to run **verifiable, symbolic code**, not black-box neural networks. You cannot mathematically prove what a standard LLM will do.
  *   **The Stake:** For PE to work, companies can't just use off-the-shelf LLM negotiators; they need transparent, formally verified scripts. This creates a bifurcation: high-stakes deals (procurement, mergers) might move to slower, verifiable symbolic agents to enable trust, while low-stakes deals stay with opaque LLMs. The "robust" PE stuff won't be deployable until there's a standard for **verifiable AI logic**, which doesn't really exist yet.

  **3. Homogeneity Creates "Functional Cliques"**
  While exact code-matching (CliqueBot) is fragile, **model convergence** is not. If every major vendor fine-tunes the same foundational model (e.g., "GPT-5 for Procurement") with similar reward functions, the bots won't need to read source code to recognize each other. They will behave identically enough to trigger cooperation via behavioral fingerprinting rather than logical proof.
  *   **The Stake:** The risk isn't that companies share source code; it's that they buy the same AI. If the market converges on 2-3 dominant negotiation models, you get the *effects* of Program Equilibrium (tacit cooperation) without the technical requirements. This makes regulation harder, because the collusion is a side effect of vendor consolidation, not an explicit feature.
