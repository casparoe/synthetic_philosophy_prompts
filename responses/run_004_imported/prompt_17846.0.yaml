prompt: |-
  I sit on my university's student-run Honor Committee, and a seminar on Sartre I'm taking this term has made this week's case hard to shake. A first-year was found responsible for bringing prohibited notes into a final exam, and at the sanctioning hearing she presented testimony from professors calling her scrupulously honest, arguing that the act reflected panic, not who she really is. Our sanctioning guidelines list "character and reputation for integrity" as something the panel "may weigh" in setting the penalty, without saying how much. Half the committee wants to treat the testimony as an ordinary mitigating factor, the way we would for anyone with a clean record; the other half keeps returning to Sartre's point that facticity -- a person's past and traits -- never adds up to a fixed character that could make an act genuinely "out of character," and worries that crediting the plea just rewards the kind of self-flattering excuse he calls bad faith. Write the short memo I'll bring to Friday's meeting: recommend how much weight, if any, the testimony should get, with reasoning the rest of the committee could apply to later cases, and take the strongest version of the other side's argument seriously rather than dismiss it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university Student-run Honor Committee.
      *   **Task:** Write a short memo for the Friday meeting regarding a specific cheating case.
      *   **Context:** A first-year student brought prohibited notes to a final. Professors testified she is "scrupulously honest," arguing the act was panic, not character.
      *   **Conflict:** Half the committee wants to treat this as standard mitigation (clean record). The other half cites Sartre (facticity vs. transcendence, bad faith) to argue against crediting "character" defenses.
      *   **Guidelines:** Sanctioning guidelines allow weighing "character and reputation for integrity" but don't specify how.
      *   **Requirements:** Recommend how much weight the testimony should get, provide reasoning applicable to future cases, and take the Sartrean argument seriously (steelman it).
      *   **Tone:** Professional, philosophical but practical, persuasive, respectful of the committee's dual nature (judicial and educational).

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Side A (Traditional/Mitigating):* People make mistakes. A history of honesty suggests this was an anomaly (panic). Punishment should fit the *person*, not just the act. Rehabilitation is possible.
      *   *Side B (Sartrean/Existentialist):* "Character" is a construct. We are what we *do*. Claiming "I am honest, therefore this didn't reflect me" is *bad faith* (mauvaise foi). It denies responsibility by positing a fixed essence that transcends the action. Facticity (past actions) doesn't determine transcendence (future choices). To excuse based on "character" is to deny the student's radical freedom and responsibility in that moment.

  3.  **Determine the Recommendation:**
      *   I need a middle ground that respects the guidelines but acknowledges the philosophical risk.
      *   *Idea:* We can acknowledge the testimony not as proof of a fixed "honest essence," but as evidence of *commitment to the community* and *capacity for restoration*.
      *   *Shift the frame:* Don't treat it as "This isn't who she is" (Sartrean trap). Treat it as "This is a breach in a generally reliable pattern of engagement, suggesting high potential for reintegration."
      *   *Weight:* Significant, but not exculpatory. It mitigates the *sanction* (severity), not the *violation* (responsibility).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty of the case.
      *   **Addressing the Sartrean Concern (The "Other Side"):** This needs to be strong. Acknowledge that "character" can be a shield for bad faith. If we say "you are honest," we might let the student off the hook for the *choice* to cheat. The act *is* part of her facticity now.
      *   **The Synthesis/Recommendation:** How do we use the testimony without falling into bad faith?
          *   Reframe "Character" as "Community Standing" and "Future Potential."
          *   The testimony proves she values the academic mission (hence the panic to succeed), not that she is metaphysically "good."
          *   The panic itself admits the weight of the rules.
      *   **Guideline for Future Cases:** Create a test. Is the testimony being used to deny responsibility (bad) or to contextualize rehabilitation (good)?
      *   **Conclusion:** Final recommendation on the specific sanction weight.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Keep the Sartrean terms accessible. Explain "bad faith" briefly in context. Ensure the practical sanctioning advice is clear.
      *   *Critique:* Am I dismissing the Sartreans?
      *   *Fix:* Explicitly validate their worry. "They are right that..."
      *   *Critique:* Is the recommendation specific enough?
      *   *Fix:* Recommend it counts as mitigation for *sanction severity*, not *finding of responsibility*.

  6.  **Polishing the Tone:**
      *   Needs to sound like a student leader speaking to peers. Respectful, thoughtful, not preachy.
      *   Use the committee's language ("weigh," "mitigating," "integrity").

  7.  **Final Review against Prompt:**
      *   Short memo? Yes.
      *   Recommend weight? Yes.
      *   Reasoning for later cases? Yes.
      *   Take Sartrean argument seriously? Yes.

  8.  *(Drafting the content based on the above thought process...)* -> *See final output.*
answer: |-
  **MEMORANDUM**

  **TO:** Honor Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Weight of Character Testimony in Sanctioning (Case #23-F)

  As we prepare for Friday's deliberations, I want to address the division regarding the professor testimony in Case #23-F. We must decide whether to treat evidence of the respondent's "scrupulous honesty" as standard mitigation or to reject it on existential grounds.

  **The Sartrean Concern**
  Half of our committee worries that accepting this testimony invites what Sartre calls *bad faith*. The argument is compelling: if we accept the claim that cheating was "out of character," we risk treating "character" as a fixed object (facticity) that determines action, rather than acknowledging the student's radical freedom. To say "I am honest, therefore this act does not define me" can be a way of fleeing responsibility for the choice made in the exam room. If we validate this, we may inadvertently teach the student that her past reputation insulates her from the weight of her present actions. We must not sanction based on a metaphysical essence she claims to possess, but on the act she chose to commit.

  **Recommendation**
  However, rejecting the testimony entirely ignores the practical function of our guidelines. I recommend we **weigh the testimony significantly as a factor for rehabilitation, but not as a negation of responsibility.**

  We should not accept the testimony as proof that the act "wasn't really her." It *was* her. She chose it. But the testimony does prove something else: it establishes a baseline of **community investment**. A student who has consistently demonstrated integrity has built up a reserve of trust and has shown a capacity to uphold the community's values. This suggests that a severe sanction (like suspension) might be disproportionate to the risk she poses to the community moving forward.

  **Guideline for Future Cases**
  To reconcile these views, I propose we adopt the following distinction for future deliberations:

  1.  **Impermissible Use:** Testimony cannot be used to argue the violation was an *anomaly* that disconnects the act from the student (e.g., "She is honest, so this doesn't count"). This is bad faith.
  2.  **Permissible Use:** Testimony can be used to assess *reintegrative potential* (e.g., "She has demonstrated a sustained commitment to integrity, suggesting she is likely to learn from this breach and return to upholding the Code").

  **Conclusion**
  In Case #23-F, the professors' letters should not lower the finding of responsibility, nor should they erase the need for a meaningful penalty. However, they justify a sanction focused on education and restoration rather than exclusion. We punish the choice she made, but we calibrate the severity based on the likelihood that she will choose differently next time.

  Let's discuss this framework Friday.
