answer: |-
  This is one of the sharpest critiques of the standard coherence arguments, and you are right to press on the mechanics rather than the hand-waving. Edward McClennen's *Rationality and Dynamic Choice* (1990) is indeed the canonical source for the "resolute choice" counter-move.

  Here is the concrete build you asked for, followed by the breakdown of why this matters for the definition of rationality.

  ### Part 1: The Setup (The Cycle)

  Let's define three tangible assets to avoid abstraction drift.
  *   **A:** An Apple
  *   **B:** A Banana
  *   **C:** A Cookie

  **The Agent's Preferences (Strictly Cyclic):**
  1.  **Apple vs. Banana:** Prefers Banana ($B \succ A$)
  2.  **Banana vs. Cookie:** Prefers Cookie ($C \succ B$)
  3.  **Cookie vs. Apple:** Prefers Apple ($A \succ C$)

  **The Bookie's Fee:** $\$1$ per trade.
  **The Agent's Wallet:** Sufficient funds, but prefers more money to less (monotonicity).

  ---

  ### Part 2: The Naive Agent (The Money Pump)

  The Naive Agent satisfies **Dynamic Separability**. This means at every decision node, they treat the choice as a fresh start. They do not consider how they got there, nor where this choice will lead. They simply maximize immediate preference satisfaction.

  **Start State:** Holds **Apple**. Wallet: $\$100$.

  **Trade 1 ($t=1$):**
  *   **Bookie Offer:** "Give me the Apple + $\$1$, I give you the Cookie."
  *   **Naive Calculation:** Compare *Apple* vs. *Cookie*.
  *   **Preference:** $A \succ C$ (Wait, cycle is $C \succ B \succ A \succ C$? No, standard pump is usually $A \succ B \succ C \succ A$. Let's align the cycle to the trades to ensure the pump works).
      *   *Correction for Pump Mechanics:* To pump money, the agent must prefer the *incoming* item to the *outgoing* item at every step.
      *   Revised Cycle for Pump: $B \succ A$, $C \succ B$, $A \succ C$.
      *   Start with **A**.
      *   Offer 1: Swap A for B (Cost $\$1$). Prefers $B \succ A$. **Accepts.**
      *   Offer 2: Swap B for C (Cost $\$1$). Prefers $C \succ B$. **Accepts.**
      *   Offer 3: Swap C for A (Cost $\$1$). Prefers $A \succ C$. **Accepts.**

  *Let's run the Naive simulation with the corrected cycle:*
  *   **Cycle:** $B \succ A$, $C \succ B$, $A \succ C$.
  *   **Start:** Holds **A**. Wallet: $\$100$.

  1.  **$t=1$ Offer:** Swap **A** + $\$1$ $\to$ **B**.
      *   Local Pref: $B \succ A$.
      *   Decision: **Trade.**
      *   State: Holds **B**. Wallet: $\$99$.
  2.  **$t=2$ Offer:** Swap **B** + $\$1$ $\to$ **C**.
      *   Local Pref: $C \succ B$.
      *   Decision: **Trade.**
      *   State: Holds **C**. Wallet: $\$98$.
  3.  **$t=3$ Offer:** Swap **C** + $\$1$ $\to$ **A**.
      *   Local Pref: $A \succ C$.
      *   Decision: **Trade.**
      *   State: Holds **A**. Wallet: $\$97$.

  **Result:** The Naive Agent is back at **A**, but has lost **$\$3$**. The cycle can repeat until bankruptcy.

  ---

  ### Part 3: The Resolute Agent (The Escape Hatch)

  The Resolute Agent rejects Dynamic Separability. They view the decision tree as a single object to be evaluated at the root ($t=0$). They formulate a **Plan** based on the terminal outcomes of that tree. Once the plan is chosen, they execute it at subsequent nodes *even if* their local, in-the-moment preferences contradict the plan.

  **Start State:** Holds **A**. Wallet: $\$100$.
  **Anticipation:** The Resolute Agent knows the Bookie will offer the sequence $(A \to B)$, then $(B \to C)$, then $(C \to A)$, conditional on acceptance.

  **Step 0: Plan Formulation ($t=0$)**
  The agent evaluates the *terminal nodes* of the available strategies:
  1.  **Strategy "Stop":** Keep A. Cost $\$0$. Final State: **(A, $\$100$)**.
  2.  **Strategy "Trade 1 only":** Get B. Cost $\$1$. Final State: **(B, $\$99$)**.
  3.  **Strategy "Trade 1 & 2":** Get C. Cost $\$2$. Final State: **(C, $\$98$)**.
  4.  **Strategy "Full Cycle":** Get A. Cost $\$3$. Final State: **(A, $\$97$)**.

  *Crucial Move:* To choose a plan, the agent must rank these final states.
  Even if their object-preferences are cyclic ($B \succ A \succ C \succ B$), their preferences over **wealth-monotonic outcomes** must allow them to distinguish (A, $\$100$) from (A, $\$97$).
  Unless the agent is pathological, **(A, $\$100$) $\succ$ (A, $\$97$)**.
  Therefore, Strategy "Stop" is preferred to Strategy "Full Cycle".

  **The Plan:** "Reject all trades. Keep A."

  **Step 1: Execution ($t=1$)**
  *   **Bookie Offer:** Swap **A** + $\$1$ $\to$ **B**.
  *   **Local Preference:** $B \succ A$. (The urge to trade is present).
  *   **Resolute Instruction:** "Execute Plan 'Stop'."
  *   **Decision:** **Reject.**
  *   **State:** Holds **A**. Wallet: $\$100$.

  **Step 2: Execution ($t=2$)**
  *   **Bookie Offer:** Swap **B** + $\$1$ $\to$ **C**.
  *   **Constraint:** Agent holds **A**, not **B**.
  *   **Decision:** Offer invalid / Rejected.
  *   **State:** Holds **A**. Wallet: $\$100$.

  **Step 3: Execution ($t=3$)**
  *   **Bookie Offer:** Swap **C** + $\$1$ $\to$ **A**.
  *   **Constraint:** Agent holds **A**, not **C**.
  *   **Decision:** Offer invalid / Rejected.
  *   **State:** Holds **A**. Wallet: $\$100$.

  **Result:** The Resolute Agent ends with **(A, $\$100$)**. No money lost. The cyclic preferences ($B \succ A$, etc.) remained intact throughout; they were simply overridden by the commitment to the plan.

  ---

  ### Part 4: The Verdict

  Does resolute choice save intransitive preferences, or is it a sleight of hand?

  **1. The "Smuggling" Charge is Correct**
  The money pump argument is usually presented as: "If your preferences over objects aren't transitive, you will lose money."
  The resolute choice counter is: "I can keep intransitive preferences over objects, as long as I have *transitive* preferences over **plans**."

  To choose the plan "Keep A" over the plan "Cycle to A," the agent *must* prefer (A, $\$100$) to (A, $\$97$). This requires a consistency condition over the *outcomes* (Object + Wealth + History). If the agent's preferences over *plans* were also cyclic (e.g., Plan 1 $\succ$ Plan 2 $\succ$ Plan 3 $\succ$ Plan 1), they would be unable to select a starting strategy and would be paralyzed or exploited anyway.

  So, resolute choice concedes the core point: **Action-guiding preferences must be coherent.** It simply shifts the locus of coherence from "momentary object choice" to "global plan selection."

  **2. The Rejection of Separability**
  The deep technical hinge here is **Dynamic Separability**. Standard decision theory (and the money pump argument) assumes that what you choose at node $t=2$ should depend only on the options available at $t=2$, not on the plan you made at $t=0$.
  *   **Naive/Sophisticated Agents:** Accept Separability. (This is why Sophisticated agents—those who use backward induction—can still get pumped or paralyzed with intransitive preferences).
  *   **Resolute Agents:** Reject Separability. They allow the *history of choice* (specifically, the fact that they made a plan) to constrain current choice.

  **3. My Take**
  Resolute choice is a valid description of how humans (and potentially aligned AI) *survive* with inconsistent impulses, but it does not vindicate intransitivity as a rational ideal.

  If you need a meta-layer of "plan preferences" to override your "object preferences" to avoid exploitation, then the "plan preferences" are doing the work of the utility function. The object-level cycle becomes behaviorally irrelevant noise.

  **Conclusion:** Rationality is indeed a property of the whole plan across time, not just choice-by-choice. However, the money pump argument still holds a knife to the throat of intransitivity: **You can have cyclic desires, but you cannot act on them sequentially without a higher-order consistency constraint.** If you have that constraint, you are functionally behaving as an expected-utility maximizer over the space of plans, even if you feel like a mess internally.

  The money pump doesn't prove you can't *have* cyclic preferences; it proves you can't *be* a cyclic optimizer. Resolute choice saves the agent by ceasing to be a local optimizer.
