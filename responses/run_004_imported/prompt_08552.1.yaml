          *   *Normativist:* In a malaria zone, it's life-saving. It promotes vital goals (survival). Is it a disease *in that context*?
          *   *Critique:* Boorse handles this via reference classes (environment).
      *   *Best Case for Divergence:* **The "Benevolent Biological Deviation" (e.g., Congenital Analgesia or a specific metabolic quirk).**
      *   *Actually, the classic example is "High Cholesterol without symptoms" vs. "Infertility in a child-free person".*
      *   *Let's go with Infertility.* It's the standard textbook example for this debate.
          *   **Naturalist (Boorse):** Reproduction is a species-typical function. If the reproductive system fails to contribute to survival/reproduction statistically, it is a dysfunction. Therefore, infertility is a disease *of the reproductive system*, regardless of whether the patient wants kids.
          *   **Normativist (Nordenfelt):** Disease is the inability to achieve vital goals. If a person has no desire for children, infertility does not impede their vital goals. Therefore, it is *not* a disease for that person.
      *   *Wait, does Boorse call infertility a disease?* Yes, because the *function* of the organs is compromised.
      *   *Does Nordenfelt call it a disease?* Only if it causes unhappiness/prevents goals.
      *   *Verdict:* Divergence!

      *   *Second Case for Agreement:* **Metastatic Cancer.**
          *   **Naturalist:** Cells proliferating uncontrollably, impeding organ function. Clear dysfunction.
          *   **Normativist:** Severe harm, threatens life (ultimate vital goal). Clear disease.
          *   *Verdict:* Agreement.

  4.  **Drafting the Response:**
      *   **Validation:** Acknowledge the difficulty of the ADHD identity question. It's a real philosophical tension, not just confusion.
