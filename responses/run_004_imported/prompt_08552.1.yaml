          *   *Naturalist:* Organs aren't doing the species-typical job. It's a pathology.
          *   *Normativist:* No goals are blocked. No harm. It's a neutral trait.
          *   *Why it matters:* Shows Naturalism separates "health" from "well-being," while Normativism binds them.
      *   **Case 2: Agreement (Metastatic Cancer).**
          *   *Scenario:* Aggressive tumor.
          *   *Naturalist:* Biological failure.
          *   *Normativist:* Extreme harm.
          *   *Why it matters:* Shows why the debate usually stays in philosophy class; in clinic, they overlap 90% of the time.
      *   **Applying to ADHD:**
