      *   *Correction:* Make sure I don't oversimplify Boorse. Boorse defines health as the ability to contribute to survival and reproduction. So infertility *is* a disease for Boorse even if the person doesn't want kids, because the *biological design* is compromised.
      *   *Correction:* Make sure I don't oversimplify Nordenfelt. He focuses on "Vital Goals" which are subjective but grounded in human action.
      *   *Nuance on ADHD:* Be careful not to invalidate the user's struggle. ADHD *does* cause harm (internal distress), so even a normativist might call it a disorder *for her*, even if the cousin says it's just a variant. Distinguish between "ADHD as a category" and "ADHD in this specific life."

  6.  **Final Polish:** Check tone. Ensure it sounds like a conversation with a smart friend, not a lecture. (Use "You" appropriately). Ensure the distinction between "Dysfunction" (Naturalist) and "Harm" (Normativist) is the pivot point.

