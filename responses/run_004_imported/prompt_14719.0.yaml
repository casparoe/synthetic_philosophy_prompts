answer: |-
  Your partner is pointing to a **genuine flaw in your reasoning**, not just a willpower problem.

  Your argument relies on a specific definition of "making things worse" that excludes your own emotional experience. In decision theory and economics, this is a miscalculation of **utility**.

  Here is the breakdown of why your partner's logic holds up better than yours, even from a purely rational standpoint.

  ### 1. The Value of Information is Zero
  In decision theory, information only has value if it allows you to make a different (and better) decision than you would have otherwise. This is called the **Expected Value of Information (EVI)**.

  *   **Your Premise:** You cannot change your contribution, you cannot change the fund, and you cannot withdraw the money.
  *   **The Reality:** Because you cannot take *any* action based on the number you see, the instrumental value of that information is exactly **zero**.

  If the value of the information is zero, then any cost associated with acquiring it makes the transaction a net loss.

  ### 2. You Are Ignoring "Psychic Costs"
  Your logic treats your emotional state as separate from the "outcome." You wrote: *"I see a scary number, feel a flicker of dread, and then go about my day exactly like I would've otherwise."*

  You are counting the "go about my day" part as neutral, but you are dismissing the "flicker of dread" as irrelevant. It is not irrelevant.

  *   **Utility includes well-being:** In rational choice theory, "utility" isn't just money; it is a measure of satisfaction, happiness, and well-being.
  *   **Stress is a cost:** If checking the balance induces cortisol spikes, anxiety, or a bad mood that lasts for hours, that is a real cost. It affects how you interact with your partner, how you work, and your physical health.
  *   **The Calculation:**
      *   **Financial Upside:** $0 (You can't act on it).
      *   **Financial Downside:** $0 (You can't act on it).
      *   **Emotional Upside:** Small/Temporary (Validation if the number is up).
      *   **Emotional Downside:** Significant/Disproportionate (Loss aversion means bad news hurts roughly twice as much as good news feels good).

  Since the financial upside is zero, the only variable left is the emotional cost. Since the emotional cost is non-zero, the net value is negative.

  ### 3. "Willpower" is Not a Logical Variable
  You asked if your partner is describing a willpower problem that "shouldn't really count against the argument."

  **It absolutely counts.**

  To argue that "I should be able to choose not to let it affect me" is to argue that you are a purely logical robot (Homo Economicus). You are not. You are a human with an amygdala that reacts to perceived threats (red numbers) before your prefrontal cortex can rationalize them away.

  Designing a strategy that requires you to override your own biology is a bad strategy.
  *   **Good Logic:** Accounts for human constraints and psychology.
  *   **Flawed Logic:** Assumes humans can toggle emotions like a light switch.

  If you build a bridge that assumes steel never expands in the heat, the bridge will collapse. That isn't a "steel problem"; it's an engineering flaw. Similarly, building a financial habit that assumes you can ignore loss aversion is a planning flaw, not a willpower failure.

  ### 4. The "Medical Test" Analogy
  Imagine you have a genetic marker for a condition that has no cure and no treatment. It will simply happen in 30 years.
  *   **Your Logic:** "I should get tested. Worst case, I have the gene, I feel dread, but I can't change the outcome. Best case, I don't have it. So testing is neutral or positive."
  *   **Partner's Logic:** "Testing gives you 30 years of potential anxiety for zero medical benefit. Don't test."

  Most people would agree with your partner. Knowing the bad news earlier provides no utility if it changes no actions, but it definitely subtracts from your quality of life during the waiting period.

  ### The Verdict
  Your partner is right. You are defining "making things worse" strictly as **"altering my financial trajectory."** Your partner is defining it as **"reducing my total utility."**

  Since the goal of retirement saving is ultimately to support a good life, sacrificing your current peace of mind (your current life) for information that cannot improve your future financial security is a net loss.

  **The Fix:** Stop checking. Set up an automatic email that sends you a statement once a year, or agree to check it together only during scheduled annual financial reviews. This respects the logic (you still get the data eventually) while protecting the utility (you avoid the daily/weekly emotional tax).
