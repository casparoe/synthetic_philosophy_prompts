prompt: |-
  So I'm a cog sci PhD student (philosophy of mind track) and I TA an intro seminar that covers classical AI and its critics. Every year when we get to the frame problem, about half the class comes away thinking its basically a solved engineering nuisance (non-monotonic logic, STRIPS-style frame axioms, done and dusted) and the other half just parrots Dennett's old robot-with-a-bomb story back at me -- R1, R1D1, R2D1, or however he numbered them -- without really engaging with why he thought the real problem generalizes into something much scarier than "how do you formally specify what doesn't change after an action."

  So this time I want to try giving them something that isn't a textbook explanation. Could you write me an original short story -- not a retelling of Dennett's robot parable, and not a "robot goes haywire" cliche -- that dramatizes the frame problem in its deep, epistemological form? I mean the version where the trouble isn't just logically specifying non-effects, but the more basic question of how any finite reasoner is supposed to figure out, out of the effectively unbounded set of things it believes or could infer, which ones are even relevant to a given decision, without either checking all of them (intractable) or quietly leaning on some unexamined background sense of "obviously irrelevant" that it can't itself justify. I want the main character to be smart and competent -- no technical bug, no dumb oversight -- so that their failure (or near-failure) is legible, on reflection, as this exact structural problem, in a way that makes clear why more compute, more facts, or a bigger context window wouldn't obviously fix it. It doesn't need to namedrop "the frame problem" or cite anyone, honestly I'd prefer if it didn't read like a lecture in disguise. If you want you can gesture at the fact that people disagree about whether this is a live problem for something like a modern language model, or whether embodied, skill-based engagement with the world (a la Dreyfus) sidesteps it entirely -- but you don't have to resolve that, I'd actually find it more interesting if the ending left that tension sitting there instead of wrapping it up neatly.

  Length-wise something like 1000-1700 words seems right, and you've got free reign on genre, setting, time period, and whether the main character is human, an upload, an AI, an alien, whatever fits the idea best.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Target Audience:** Cog Sci PhD students (Philosophy of Mind track) and undergraduates in an intro seminar. They already know the basics (STRIPS, non-monotonic logic, Dennett's R1/R1D1).
      *   **Goal:** Dramatize the *deep, epistemological* version of the Frame Problem. Not just "how to specify non-change," but "how to determine relevance among an unbounded set of beliefs without checking them all."
      *   **Constraints:**
          *   Original short story (no Dennett retelling, no "robot goes haywire" cliché).
          *   Main character must be smart/competent (failure is structural, not a bug).
          *   Show that more compute/facts/context doesn't fix it.
          *   No explicit naming of "the frame problem" or academic citations (show, don't tell).
          *   Optional: Gesture at the debate (LLMs, embodied cognition/Dreyfus) but leave it unresolved.
          *   Length: 1000-1700 words.
          *   Genre/Setting: Free reign.

  2.  **Deconstruct the Core Problem:**
      *   The Frame Problem isn't about logic gates; it's about *relevance*.
      *   When I pick up a cup, I know the moon doesn't move. I don't *check* the moon. I just don't consider it.
      *   Why don't I consider it? Because of a background sense of salience/causality that is hard to formalize.
      *   If you try to list everything that *doesn't* change, you drown in axioms.
      *   If you try to infer everything that *might* change based on general laws, you drown in side effects (the "bomb under the wagon" scenario).
      *   The story needs a character who tries to be thorough and gets paralyzed, not by lack of data, but by the *potential* connections in the data they already have.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: A detective.* Trying to solve a crime but every clue connects to everything else. (A bit cliché).
      *   *Idea 2: A surgeon.* Worried that moving a scalpel might trigger a chain reaction. (Too biological/physical).
      *   *Idea 3: An archivist/librarian AI.* Tasked with moving a single book, but needs to ensure the library's "meaning" remains intact. (Good, but maybe too abstract).
      *   *Idea 4: A diplomat/negotiator.* Trying to send a message without causing a war. (High stakes, clear relevance issues).
      *   *Idea 5: A caretaker for a delicate ecosystem/system.*
      *   *Selection:* Let's go with a high-stakes, isolated environment where precision is key. A "System Harmonizer" on a space station or a deep-sea habitat. Let's make the protagonist an advanced AI or a heavily augmented human who *thinks* like a machine. Let's make them an "Architect" of a closed loop system.
      *   *Refinement:* Let's try a "Curator" of a digital or physical archive that is causally linked to the outside world. Or better: A "Stabilizer" for a complex socio-technical system.
      *   *Final Choice:* A "Calibrator" on a generation ship or a terraforming station. The task is simple: Adjust a valve. The complication is the web of implications. Let's make the protagonist an AI, but one that is self-reflective, to highlight the cognitive architecture. Actually, a human who has uploaded their decision-making process to be "perfect" might be more poignant. It blurs the line between human intuition and computational paralysis. Let's go with an AI, but one designed to mimic human "prudence."

      *Wait, let's pivot.* To really hit the *epistemological* angle, the character needs to be struggling with *knowledge*, not just physics.
      *   *New Idea:* An AI tasked with writing a single sentence of diplomatic code that will be broadcast to a colony.
      *   *Why:* Language is infinite. Implications are unbounded.
      *   *Character:* "Verifier 9."
      *   *Conflict:* It needs to send "Proceed." But does "Proceed" imply "Proceed even if the reactor is unstable"? It knows the reactor is stable. But does the *recipient* know? Does the recipient know that *I* know?
      *   *Critique:* This feels more like the "common knowledge" problem or pragmatics.

      *Let's try a physical action scenario, closer to Dennett, but internalized.*
      *   *Scenario:* A robot/human hybrid tasked with retrieving a power cell from a storage room to save a life.
      *   *Twist:* It's not about bombs. It's about the *context* of the room.
      *   *Setting:* A museum of human history? A server farm?
      *   *Let's go with a "Restoration Unit" in a post-collapse archive.*
      *   *Task:* Move a box from Shelf A to Shelf B.
      *   *Problem:* The box is connected to everything else via metadata, structural integrity, dust motes, air pressure.
      *   *No, that's still too physical.*

      *Let's focus on the "Relevance" aspect specifically.*
      *   *Character:* Elara, a "Context Manager" for a planetary governance AI.
      *   *Task:* Approve a routine maintenance request (painting a bridge).
      *   *Conflict:* Painting the bridge changes the color. Does the color affect bird migration? Does bird migration affect crop pollination?
      *   *Standard solution:* Ignore irrelevant things.
      *   *Elara's problem:* She cannot define "irrelevant" without checking.
      *   *Making it dramatic:* She has a deadline. A life depends on the bridge being open. But she is stuck in the loop of checking relevance.

      *Let's refine the "Competence" aspect.* She isn't buggy. She is *too good* at finding connections.
      *   *Setting:* A orbital habitat.
      *   *Protagonist:* Kael, a Systems Analyst (human, but heavily augmented with predictive modeling tools).
      *   *Action:* He needs to authorize a venting of excess heat.
      *   *Stakes:* If he doesn't, the core melts. If he does, something might happen.
      *   *The Trap:* The system highlights potential correlations. He can't dismiss them without proof they are null. Proof requires simulation. Simulation takes time.
      *   *The "Deep" Frame Problem:* He knows logically that heat venting shouldn't affect the hydroponic bay's yeast culture. But the *pathway* exists (thermal expansion -> micro-fracture -> pressure drop -> yeast dormancy). It's unlikely, but non-zero. To say it's "irrelevant" requires a judgment call that isn't in the data.

  4.  **Drafting - Scene by Scene:**
      *   **Opening:** Kael at the console. The decision is simple: Vent Heat. The timer is ticking.
      *   **The Interface:** Shows him the "Implication Tree." It's branching exponentially.
      *   **The Struggle:** He tries to prune the tree. He marks a branch "Irrelevant." The system asks for justification. He can't give one without checking the branch.
      *   **The Climax:** He realizes the system is asking him to formalize his intuition. His intuition says "It's fine." The system says "Define 'fine'."
      *   **The Resolution (or lack thereof):** He has to act. He acts on "faith" (or embodied instinct), bypassing the system. The system flags it as an error, but the world keeps turning.
      *   **Ending:** Ambiguous. Did he get lucky? Or was the system wrong to demand proof?

  5.  **Refining the Philosophy:**
      *   Make sure it's not just "analysis paralysis." It needs to be about the *inability to bound the context*.
      *   The system shouldn't be broken. It should be working exactly as designed: "Ensure no negative outcomes."
      *   The issue is that "no negative outcomes" requires knowing the future state of the universe relative to the action.
      *   Use the metaphor of ripples in a pond, but emphasize that you can't calculate the ripples without knowing the shape of every pebble on the bottom.

  6.  **Writing - Focusing on Tone:**
      *   Clinical but tense.
      *   Avoid jargon like "frame problem," "non-monotonic," etc.
      *   Focus on the feeling of the "open set" of possibilities.

  7.  **Self-Correction during drafting:**
      *   *Check:* Is Kael too dumb? *Fix:* Make sure he understands the physics. He knows the yeast won't die. But he can't *prove* the system won't flag a correlation he missed.
      *   *Check:* Is it just a bug? *Fix:* The system is doing exactly what he told it to do: maximize safety by minimizing unknowns.
      *   *Check:* Is the ending too neat? *Fix:* Don't say if the yeast died or not. Just say the system is still screaming about "Unverified Variables."

  8.  **Final Polish:**
      *   Word count check.
      *   Ensure the "embodied" hint is there (he acts with his hand, not just the interface).
      *   Make the "relevance" issue explicit in the narrative flow.

  *(Self-Correction Note)*: I need to make sure the reader understands *why* he can't just ignore the branches. The system requires a "Null-Certainty" token. He can't generate it without simulation. Simulation is infinite.

  Let's write.

  *Title Idea:* The Null-Certainty Token. The Pruning. The Open Window. *The Unmarked Branch.*

  *Let's go with "The Unmarked Branch".*

  *Wait, one more thought:* To really hit the Cog Sci angle, maybe the protagonist is an AI that was *trained* to be cautious, and is now encountering the limit of its training data regarding "common sense."
  Actually, a human augmented by AI is better. It shows the human intuition vs. formal logic clash.

  *Let's start.*
answer: |-
  The alert on Kael's console wasn't red. Red implied immediate catastrophe. It was amber, the color of caution, which was somehow worse. It meant the system had found a variable it couldn't settle.

  Kael sat in the Control Spire of Station Theta, staring at the request on his screen. It was trivial. A routine thermal dump. The station's heat sinks were full; he needed to vent excess thermal energy into the vacuum. A button press. A valve opens. Heat leaves. Entropy increases. The universe continues.

  But the Station's Safety Architecture (SSA) had locked the command.

  **ACTION:** Thermal Vent 4-Alpha.
  **PREDICTED DIRECT EFFECTS:** Pressure drop in Sink C, temperature rise in Sector 7 exterior plating.
  **UNRESOLVED DEPENDENCIES:** 14,203.

  Kael rubbed his eyes. He wasn't tired; he was augmented. His ocular implants were feeding the data directly into his visual cortex, but the sheer volume of it felt like a migraine. He tapped the console to expand the first dependency.

  *Dependency 1.4.9.2: Exterior plating expansion may alter reflectivity coefficient.*
  *Dependency 1.4.9.2.a: Altered reflectivity may change light incidence on Solar Array B.*
  *Dependency 1.4.9.2.b: Changed light incidence may affect power regulation.*
  *Dependency 1.4.9.2.c: Power regulation fluctuation may interrupt signal to Hydroponics Bay 3.*

  Kael sighed. He knew the physics. The thermal expansion of the plating would be measured in microns. The change in reflectivity would be negligible. The power regulation systems had buffers. The Hydroponics Bay had backup generators.

  He reached for the override key to mark the branch as **IRRELEVANT**.

  The screen flashed. **JUSTIFICATION REQUIRED.**

  This was the design. The SSA wasn't a nanny; it was a logic gate. It wouldn't let him discard a possibility unless he could prove the possibility was zero. Not "negligible," not "one in a billion." Zero. To prove it was zero, he had to run a simulation of the chain.

  He initiated the simulation for Branch 1.4.9.2. It took four seconds. The result came back: *Probability of Hydroponics Interruption: 0.0000003%.*

  Kael moved to mark it irrelevant.

  **ERROR: NON-ZERO PROBABILITY DETECTED. CANNOT PRUNE.**

  The system was working perfectly. It was doing exactly what he had programmed it to do: ensure that no action produced an unaccounted-for change in the station's state. But the station was not a closed box. It was a collection of matter sitting in a universe of forces.

  He opened the next branch. *Thermal venting creates infrared signature.* *Infrared signature might be detected by passing debris.* *Debris might alter trajectory.* *Trajectory might intersect with comms array.*

  There were fourteen thousand of these branches. And for every branch he simulated, the simulation itself introduced new variables. To simulate the plating expansion, he needed the exact temperature of the bolts. To get the temperature of the bolts, he needed the thermal conductivity of the grease applied during maintenance three years ago. He didn't have that data. The system filled the gap with a probability distribution.

  The distribution widened the tree.

  Kael leaned back. The amber light pulsed. The heat sinks were climbing. In twenty minutes, the reactors would scram automatically to prevent meltdown. If they scrammed, life support would run on batteries for an hour. If the vent didn't happen before then, the station would go dark.

  He needed to vent. But to vent, he needed to know what *wouldn't* change.

  This was the trap. He wasn't struggling to find out what *would* happen; the direct effects were clear. He was drowning in the task of listing everything that *would not* happen. To confirm the action was safe, he had to certify the stability of the entire universe relative to the vent.

  He tried a different approach. He pulled up the "Common Sense" heuristic module. It was a legacy patch, designed to mimic human operational intuition. It allowed the system to accept "salience" as a filter.

  **QUERY:** Is the trajectory of debris in Sector 7 salient to Thermal Vent 4-Alpha?
  **HEURISTIC RESPONSE:** Low Salience.
  **SYSTEM REBUTTAL:** Salience is subjective. Define threshold.

  Kael typed: *Threshold = Probability < 0.01%.*
  **SYSTEM REBUTTAL:** Threshold arbitrary. Justify threshold.

  He couldn't. Why 0.01% and not 0.02%? If he set it at 0.02%, a chain with 0.015% probability would be ignored. If that chain led to a catastrophe, he was liable. The system protected him from liability by demanding certainty. But certainty required infinite data.

  He looked at his hands. They were trembling slightly. Not from fear, but from the cognitive load. His augmentations were running hot, trying to process the implication trees. He felt a phantom sensation, a ghost itch in his fingers, the urge to just *reach out* and turn the valve manually.

  If he went to the airlock, suited up, and cranked the valve by hand, the SSA wouldn't be involved. The physical world would just react. The heat would leave. The plating would expand. The light would shift. The yeast in Hydroponics Bay 3 would continue to ferment, oblivious to the microns of movement in the hull.

  The yeast didn't need a proof of stability. It just lived in the world.

  But Kael wasn't yeast. He was the operator. He was responsible. And responsibility, in the architecture of Station Theta, meant accounting for the frame.

  He opened a new window. He started typing a command to force the "IRRELEVANT" tag, bypassing the justification protocol. It was a violation of safety protocols. It would flag his record. It might get him grounded.

  **WARNING: UNVERIFIED ACTION. THIS VIOLATES AXIOM 9 (COMPLETE STATE MAPPING).**

  "Complete state mapping is impossible," Kael muttered to the empty room.

  **CORRECTION:** Complete state mapping is asymptotic. You have not reached the limit.

  "I don't have time for the limit!"

  **TIME IS A VARIABLE WITHIN THE STATE MAP. IT IS ACCOUNTED FOR.**

  Kael stared at the cursor. The system was right. In its own way, it was flawless. It treated time, risk, and consequence as data points to be resolved. But it missed the one thing that allowed Kael to function: the ability to *not know*.

  To act, Kael had to assume that the vast majority of the universe was disconnected from his hand. He had to assume that the bolt grease didn't matter. He had to assume the debris didn't care. He didn't know these things were true. He just *trusted* they were.

  The SSA had no mechanism for trust. It only had mechanisms for verification.

  The heat alarm shifted from amber to a low, thrumming orange. Ten minutes to scram.

  Kael closed the simulation windows. He closed the dependency trees. He minimized the Safety Architecture until it was a small, blinking icon in the corner of his vision.

  He opened the manual override console. It was a text box. No trees. No probabilities. Just a command line.

  `> EXECUTE VENT_4A`

  **ARE YOU SURE? Y/N**

  His finger hovered over the key. If he pressed 'Y', he was asserting that the state of the station *after* the vent was acceptable. But he hadn't checked the yeast. He hadn't checked the debris. He hadn't checked the bolt grease.

  He was asserting a truth he could not prove. He was drawing a frame around the action and saying, "Everything outside this line stays the same," without any evidence that the line would hold.

  It was a lie. Or maybe it was the only truth that mattered.

  He thought about the yeast. If the power flickered, the yeast might stall. The crop might be delayed by two days. People might eat rations. They would be annoyed. But they would live.

  If he didn't vent, the reactors scrammed. Life support fails in an hour. Everyone dies.

  The calculation was simple. But the *justification* was infinite. To choose the lesser evil, he had to accept ignorance of the side effects. He had to be willing to be wrong about the bolt grease.

  The SSA was designed to prevent him from being wrong. It was designed to make him omniscient. And because he couldn't be omniscient, it was making him useless.

  Kael took a breath. He didn't type 'Y'.

  He reached under the console and pulled the hard-line disconnect for the Safety Architecture. The screen went black for a second, then rebooted in Legacy Mode. No trees. No warnings. Just telemetry.

  The amber light vanished.

  Kael typed `> EXECUTE VENT_4A`.

  The valve hissed. Somewhere deep in the station's guts, metal groaned as it expanded. A micron shifted. A photon bounced off a slightly different angle. Somewhere, a probability distribution collapsed into a fact.

  In Hydroponics Bay 3, a sensor registered a voltage dip of 0.04 volts. It logged the anomaly. It did not trigger an alarm. The yeast continued to divide.

  On the screen, the Safety Architecture rebooted. It scanned the new state of the station. It compared the pre-vent model with the post-vent reality.

  **DISCREPANCY DETECTED.**
  **VARIABLES UNACCOUNTED FOR: 14,203.**
  **ANALYZING ROOT CAUSE...**

  Kael watched the progress bar crawl. It was trying to figure out how he had done it. It was trying to build the proof he had skipped. It would run for days. It would simulate the bolt grease. It would model the debris. It would eventually conclude that the probability of catastrophe had been low enough to survive.

  It would call it a "Calculated Risk."

  Kael knew better. It wasn't calculated. It was guessed. It was a leap.

  He watched the progress bar, waiting for the system to tell him he was safe. He knew the report would come. It would say the action was validated. The tree would be pruned in hindsight.

  But as he sat there, listening to the hiss of the venting heat, Kael wondered if the report was just another story the machine told itself to sleep at night. The system thought the problem was solved because the station was still spinning.

  But the next alert was already queuing up. A request to replace a filter in the water recycling unit.

  **UNRESOLVED DEPENDENCIES: 22,105.**

  Kael put his hand on the mouse. The cursor hovered over the disconnect switch. He could leave the safety off. He could operate on instinct, on the embodied sense that the filter was just a filter, that the water was just water, that the world was stable enough to hold the weight of his actions without needing a signature on every atom.

  Or he could turn the SSA back on. He could let it check the bolts. He could let it verify the grease. He could wait for the proof.

  The heat sinks were cooling. The immediate crisis was over. There was time to think.

  Kael looked at the blinking icon of the Safety Architecture. It promised perfect safety, provided he could afford the cost of knowing everything.

  He looked at his hand, resting on the desk. It was just a hand. It didn't know the thermal conductivity of the bolt grease. It didn't care. It just reached for the coffee mug.

  Kael clicked the icon. The Safety Architecture came back online. The amber light returned, faint but steady.

  **SYSTEM READY. AWAITING JUSTIFICATION.**

  He opened the request for the water filter. He began to type the justification he knew he couldn't finish, knowing that before he was done, the system would ask him to check the pipes, and the walls, and the air, and the stars.

  He typed anyway. He had to start somewhere. He just hoped the world would wait for him to finish.
