answer: |-
  This is one of the sharpest tensions in contemporary neo-Aristotelian ethics, and your intuition is oscillating correctly because both horns of the dilemma have teeth. You have identified the exact pressure point where the Situationist Critique (Doris, Harman) tries to pry open the *Nicomachean Ethics*.

  Here is the breakdown of why that passage in II.4 feels like a concession to Doris, why your "rare *phronimos*" counter-thought is largely correct, and where the actual philosophical battleground lies.

  ### 1. The "Firm and Unchangeable" Condition (*Hexis*)
  First, let's look at the Greek underlying Ross's "firm and unchangeable." Aristotle uses *bebaios* (stable/firm) and *akinētos* (unmoving/unchangeable).

  In the context of Book II, Aristotle is distinguishing a *hexis* (a settled state of character) from a *dynamis* (a capacity) or a *pathos* (a feeling). You can feel brave once (pathos) or have the capacity for bravery (dynamis), but to *be* brave (virtue), the disposition must be stable.

  **Your first fear:** If virtue requires a stable character, and psychology shows character is unstable, virtue is impossible.
  **The Reality:** Aristotle agrees with you. He explicitly states that virtue is rare.

  > "Virtue, then, is a state of character concerned with choice, lying in a mean..." (II.6)

  But crucially, Aristotle distinguishes between **acting in accordance with virtue** and **acting from virtue**.
  *   **In accordance with:** You do the right thing (e.g., you don't steal), but maybe you're afraid of getting caught, or you just happened to be in a good mood.
  *   **From virtue:** You do the right thing *because* it is the right thing, with knowledge, choice, and a stable disposition.

  The Situationist data (Darley & Batson, Milgram, etc.) mostly demonstrates that people fail to act *from* virtue when situational pressure mounts. They might act *in accordance* with virtue when the situation is easy, but slip when it is hard.

  **Aristotle's Response:** "Exactly. That proves they aren't virtuous yet."

  If the seminarians in the Good Samaritan study step over the dying man because they are late for a talk on parables, Aristotle does not say, "Oh no, virtue doesn't exist." He says, "Those seminarians possess, at best, *natural virtue* or *continence*, but they have not achieved *strict virtue*."

  ### 2. The "Rare *Phronimos*" Defense
  Your second thought—that this is an idealization true by definition—is the standard neo-Aristotelian defense (championed by people like Julia Annas and Rosalind Hursthouse).

  Aristotle is not doing descriptive psychology of the average human; he is doing **normative psychology of the flourishing human.** The *phronimos* (person of practical wisdom) is the standard, not the statistical mean.

  *   **Situationists** argue: "Global character traits (like Honesty or Courage) do not exist in the population."
  *   **Aristotle** argues: "True Virtue (a unified, stable hexis) exists only in the fully matured moral agent, which is a rare achievement."

  If Doris says, "99% of people don't have robust character traits," Aristotle replies, "I know. That's why I wrote a book on how to acquire them, and why I distinguish the virtuous man from the continent man (*enkratēs*) and the incontinent man (*akratēs*)."

  In this sense, the debate **does talk past itself** if the Situationist claims to be refuting Aristotle's *empirical claims about the masses*. Aristotle makes no such claims. He assumes most people are ruled by pleasure and pain (Book X).

  ### 3. Where the Situationists Actually Land a Hit
  However, you shouldn't let Aristotle off the hook entirely. The Situationist critique lands a heavy blow on **Aristotelian Moral Education**, not just the definition of virtue.

  Aristotle believes character is formed through **habituation** (*ethos*). You become just by doing just acts. You become brave by doing brave acts. The "firmness" of the character comes from the repetition stabilizing the disposition.

  **The Situationist Challenge:** If behavior is overwhelmingly determined by situational variables (time pressure, authority, mood, weather) rather than internal dispositions, then **habituation cannot work the way Aristotle thinks it does.**

  If I practice "brave acts" in low-stakes environments, the Situationist argues this will not transfer to high-stakes environments because the "trait" isn't a cross-situational causal power. The "firmness" Aristotle requires (*bebaios*) implies a kind of cross-situational consistency that the empirical data suggests is psychologically improbable, even for the "expert."

  So, while Aristotle can say "The seminarians weren't virtuous," the Situationist can retort: "And based on the data, **no one is**, because the psychological architecture required for that kind of 'firmness' across varying situations doesn't exist."

  This forces the Aristotelian into a corner:
  1.  **Double down on rarity:** Admit the *phronimos* is a unicorn, a theoretical limit case (like a frictionless plane in physics).
  2.  **Modify the theory:** Admit that "virtue" must be more context-specific (local traits) than Aristotle's "Unity of Virtues" thesis allows.

  ### 4. The "Natural Virtue" Loophole
  There is a specific section in the *Ethics* (VI.13) that is often overlooked in this debate but is crucial for your reconciliation. Aristotle distinguishes **Natural Virtue** (*arete phusike*) from **Strict Virtue** (*arete kyria*).

  *   **Natural Virtue:** We are born with temperaments. Some kids are naturally bold; some are naturally cautious. This looks a lot like the "traits" psychologists measure. Aristotle admits these are unstable and can be harmful without *phronesis* (e.g., natural boldness without wisdom is just recklessness).
  *   **Strict Virtue:** Natural virtue + *Phronesis* (Practical Wisdom).

  The Situationist critique effectively demolishes **Natural Virtue** as a reliable predictor of behavior. The data shows that having a "helpful temperament" doesn't predict helping behavior when situational variables shift.

  Aristotle would concede this. He would say Natural Virtue is *not* moral virtue yet. It is merely the raw material. The "firm and unchangeable" condition applies only to **Strict Virtue**.

  So, is the third condition empirical or definitional?
  *   It is **definitional** regarding what counts as *eudaimonia* (flourishing). You cannot flourish without a stable character.
  *   It is **empirical** regarding whether humans can actually achieve it.

  ### 5. The Verdict: How to Stop Flip-Flopping
  You are flip-flopping because Aristotle is doing two things at once in Book II.4:
  1.  **Phenomenology:** Describing what it *feels like* to be virtuous (acting from a stable core).
  2.  **Teleology:** Describing the *goal* of moral development.

  The Situationists attack the **Phenomenology/Empirical** claim (people don't act like that).
  The Aristotelians defend the **Teleological/Normative** claim (people *should* act like that, and it is possible to learn to do so).

  **Here is the synthesis:**
  Aristotle is not handing the Situationists the argument, provided you accept that Aristotle is an **idealist** about moral psychology. He is describing the endpoint of moral maturity, not the baseline of human functioning.

  However, the Situationists force a modification to Aristotle. We cannot assume that simply "doing just acts" will automatically crystallize into a "firm and unchangeable character" via osmosis. If situations drive behavior, then moral education must focus less on "internalizing rules" and more on **situation management** (avoiding the doorway where the beggar lies if you know you're late; structuring environments to support virtue).

  **Conclusion:**
  Read that third condition not as a claim that "most people have firm characters," but as a claim that **"moral worth requires a stability that most people have not yet earned."**

  The Situationists are right that the *average* person lacks this stability. Aristotle is right that without this stability, the action lacks full moral worth. They are arguing about different populations (the statistical mean vs. the moral ideal).

  If you read II.4 as a description of the **finished product** of the ethical life, rather than a description of **ordinary moral agency**, the tension dissolves. The seminarians weren't virtuous; they were trainees. The fact that they failed the test doesn't prove virtue is impossible; it proves they hadn't finished the training. The Situationist challenge remains only if one argues that the training *cannot possibly succeed* even in principle, which is a much harder claim to sustain than the claim that it rarely succeeds in practice.
