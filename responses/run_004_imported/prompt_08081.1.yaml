          *   Update 1: $P_{new}(E) = 0.9$.
          *   Update 2: $P_{new}(F) = 0.9$.
          *   Result: Order $(E, F) \to P_{final}(E) \approx 0.945, P_{final}(F) = 0.9$. Order $(F, E) \to P_{final}(E) = 0.9, P_{final}(F) \approx 0.945$.
      *   **Task:** Assess the exchange move-by-move (1-4), indicating who has the better of it at each stage, and conclude with what both are missing.
      *   **Constraint:** Do not declare an overall winner.

  2.  **Deconstruct the Moves:**

