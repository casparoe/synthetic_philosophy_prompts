answer: |-
  **Julian:** So, the coffee's cold, and Lewis has still won. That's the summary, isn't it? If we treat "If A, then B" as a proposition with a standard truth value, the probability of that proposition cannot equal the conditional probability $P(B|A)$ across the board without collapsing all credences into independence.

  **Sarah:** Lewis showed that the *Equation* can't hold universally for truth-conditional propositions. He didn't show that conditionals *are* propositions. He showed that if they are, our probabilistic intuitions about them are systematically mistaken. I'd rather keep the intuitions and drop the truth conditions. The Equation is the data, Julian. $P(\text{If } A, B) = P(B|A)$ is the starting point of any decent epistemology of conditionals. If your metaphysics makes that impossible, your metaphysics is the variable that has to go.

  **Julian:** But if you drop truth conditions, you drop the ability to embed. That's the Frege-Geach problem, and it's not just a technicality. Consider negation. I say, "It is not the case that if it rains, the match will be cancelled." I am denying something. If "If it rains, the match will be cancelled" lacks a truth value, what exactly am I denying? I can't deny an assertion rule. I can only deny a claim that purports to be true.

  **Sarah:** You're assuming negation must always operate on truth-apt content. But think about what you're actually doing. When you deny that conditional, you aren't asserting that the material implication is false. You're rejecting the *inference* from rain to cancellation. You're saying that the degree of support $A$ gives $B$ is insufficient to warrant the assertion. We can model the negation of a conditional as the assertion that the conditional probability is low. It's a rejection of a suppositional commitment, not a truth-functional flip.

  **Julian:** That works for simple denial, maybe. But what about embedding in the antecedent of another conditional? "If (if A, then B), then C." On your view, the antecedent here has no truth value. So the outer conditional has an antecedent that can't be true or false. How does the logic function? How do I conditionalize on a non-proposition? It seems you're forced to say these sentences are literally meaningless, yet we reason with them constantly.

  **Sarah:** We reason with them *awkwardly*, Julian. Sentences like "If if A then B, then C" are notoriously difficult to parse in natural language. When we do make sense of them, we're usually unpacking them into nested suppositions: "Suppose A; if under that supposition B holds, then C." We don't need a truth value for the inner conditional to process that. We just need a shift in the context of evaluation. You, on the other hand, are buying truth conditions at a steep price. To save the propositionality of conditionals, you have to admit the Equation fails generally. That means the overwhelming intuition that the probability of the conditional *just is* the conditional probability is a massive, systematic illusion. How much Gricean machinery do you need to explain that away?

  **Julian:** It's not an illusion; it's a local constraint. The Equation holds for specific credence functions—those that are "rigid" or appropriately constrained by the context. Stalnaker's possible worlds semantics gives me the truth conditions I need for the logic to work—modus ponens, reductio, the lot—without collapsing. The fact that $P(A \to B)$ diverges from $P(B|A)$ after certain updates just shows that learning new information changes the similarity relations between worlds. The "coincidence" you're worried about is actually a feature of how we update in ordinary conversation. We rarely conditionalize on the kinds of bizarre partitions Lewis uses in his proof.

  **Sarah:** "Rarely" is doing a lot of work there. Lewis's proof doesn't rely on bizarre partitions; it relies on the assumption that the Equation should hold for *any* rational agent. If your theory says that a rational agent who learns $B$ must suddenly change their evaluation of the conditional "If A, B" in a way that violates the Equation, you've severed the link between learning and conditional belief. That's the core of Bayesianism! If I learn $B$, my confidence in "If A, B" should go to 1. But on your truth-conditional view, learning $B$ might make the proposition $A \to B$ false if the "closest not-A world" is a not-B world. That's insane. It makes the truth of the conditional depend on worlds I know are actualized or not.

  **Julian:** It depends on the closeness metric, yes. But look at the alternative. You want to save the Equation by saying conditionals aren't propositions. Fine. Now tell me how the Law of Total Probability applies to your conditionals. $P(B) = P(B|A)P(A) + P(B|\neg A)P(\neg A)$. If conditionals don't have probabilities of truth, does this law fail for sentences containing them? If I say "Either (if A, B) or (if A, not-B)," logic says that's a tautology. On your view, is it? Or is it just a double assertion of... what? Assertability conditions? If you can't plug conditionals into the standard probability axioms, you've lost the "Bayesian" part of your Bayesian epistemology.

  **Sarah:** I'm willing to restrict the Law of Total Probability. Not all meaningful sentences are truth-apt. Imperatives don't have truth values, yet we reason with them. Conditionals are more like imperatives for belief: "Given A, accept B." The fact that they don't fit the standard axioms tells us something about the axioms, not the language. But let's turn your objection around. You claim your truth-conditional view preserves logic. But to make it compatible with the Equation *at all*—even locally—you have to posit that speakers implicitly restrict their quantification over worlds to match their current credence function. That's a massive pragmatic postulate. You're saying we *talk* as if Adams is right, but *metaphysically* you're right. Why not just take the talk seriously?

  **Julian:** Because the talk leads to contradiction, as Lewis showed. I'm not saying we talk as if Adams is right universally; I'm saying we talk as if the Equation holds *until* we reflect on the logic of counterfactual dependence. The pragmatic machinery isn't a patch; it's an explanation of why we conflate the probability of the Stalnaker proposition with the conditional probability. They coincide in standard contexts. Your view requires me to believe that when I say "If it rains, I'll get wet," I haven't actually said anything true or false. I've just made a noise that regulates your beliefs. That seems to strip language of its descriptive power.

  **Sarah:** It strips language of *truth-conditional* descriptive power, not descriptive power altogether. I can still describe my state of mind. I can describe the probabilistic connections in the world. I'm just not reifying those connections into a "conditional fact" out there in the modal landscape. You're positing strange propositions that are true in the actual world but depend on the layout of non-actual worlds, just to save the Law of Excluded Middle for conditionals. I'd rather give up Excluded Middle for "If A, B" than give up the Equation. The cost of your truth conditions is that the probability of the conditional becomes opaque to the agent. The cost of my view is that the logic gets non-classical. I think opacity is a higher price than non-classicality.

  **Julian:** Opacity is fatal for communication. If I don't know what proposition you're asserting, I don't know what we're disagreeing about. If you deny "If A, B" and I assert it, and neither of us is aiming at truth, what is the disagreement? A clash of suppositional policies? That sounds like we're just negotiating, not describing.

  **Sarah:** And if we are describing, but your description implies that learning $B$ could lower my confidence in "If A, B," then we aren't describing rational belief update. We're describing a calculus that diverges from how we actually think. I'd rather have a logic that matches our credences than a logic that matches classical truth tables but forces us to call our own intuitions "pragmatic illusions."

  **Julian:** Then we're at the fork. You keep the Equation and lose the proposition. I keep the proposition and restrict the Equation.

  **Sarah:** Exactly. You keep the logic of truth; I keep the logic of belief.

  **Julian:** And Lewis is laughing at both of us from 1976.

  **Sarah:** Probably. But at least on my view, if he's laughing, I can say, "If he's laughing, he's enjoying himself," and mean that my confidence in his enjoyment is high, without worrying whether that sentence corresponds to a possible world.

  **Julian:** *If* that sentence corresponds to a possible world, I'll concede the point.

  **Sarah:** Don't hold your breath.
