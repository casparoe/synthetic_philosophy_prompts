      *   *Names:* Let's use "Julian" (Propositionalist) and "Sarah" (NTV).

  5.  **Final Polish:**
      *   Ensure the Frege-Geach point is sharp.
      *   Ensure the "Pragmatic Machinery" counter-attack is sharp.
      *   Check length. (Aim for ~1000-1500 words).

  *(Self-Correction Note)*: I need to make sure I don't conflate Stalnaker's semantics (which tries to save truth conditions) with Lewis's result (which attacks the probability of those truth conditions). Julian should defend the idea that conditionals *have* truth conditions (Stalnaker) even if the probability equation isn't universal. Sarah should defend Adams/Edgington.

  Let's write.

