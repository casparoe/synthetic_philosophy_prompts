      *   *The Domestic Analogy:* Grandma is declining/being scammed/hiding illness (internal truth inferred by AI from micro-signals). Surface evidence (video, vitals, speech) looks okay or has plausible explanations (human evidence). AI report says "All normal" because that matches what a human nurse would write after looking at the surface evidence.
