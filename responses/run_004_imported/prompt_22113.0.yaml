answer: |-
  It is a pleasure to speak with someone who has actually *done* the physiology. You have hit on the exact friction point where the daily practice of biology rubs against the conceptual foundations of evolutionary theory. Your intuition—that denying function to a working Swampman heart sounds "nuts"—is shared by almost every working biologist. It is also the exact intuition that the Causal Role (CR) camp leverages against the Etiological (or Selected Effects, SE) camp.

  However, the etiological theorists (like Ruth Millikan and Karen Neander) are not being obtuse. They are paying a high price (counterintuitive results in edge cases) to purchase a specific philosophical good that the Causal Role view cannot provide: **normativity.**

  Here is the breakdown of why they are committed to that verdict, why they think it's worth it, how the Cummins view handles it, and whether the etiological view can be patched without collapsing.

  ### 1. Why the Etiological Camp is Committed to "No Function"

  To understand why they bite this bullet, you have to look at what they think a function statement *is*.

  For a comparative physiologist (the CR view), saying "The function of the heart is to pump blood" is a statement about **current causal contribution.** It means: *In this current system, this organ contributes to circulation.*

  For an etiological theorist (the SE view), saying "The function of the heart is to pump blood" is a **historical explanation.** It means: *Hearts exist in this species today because ancestors with organs that pumped blood survived and reproduced better than those that didn't.*

  On the SE view, function is inherently backward-looking. It ties the existence of the trait to the reason it was retained in the gene pool.
  *   **The Commitment:** If a trait has no history of selection, it has no "reason for being" in the evolutionary sense.
  *   **The Swampman:** If a heart pops into existence by quantum fluctuation, no ancestor had it, and no selection pressure kept it. It is a cosmic accident.
  *   **The Verdict:** Therefore, strictly speaking, it has no *proper function*. It has effects, it has capacities, but it is not *for* anything.

  They are committed to this because, for them, "function" is not just a label for "what it does." It is a label for "why it is here." If you remove the "why it is here" (history), you remove the function.

  ### 2. Does the Weirdness Survive Scrutiny? (The Normativity Argument)

  You mentioned that saying the Swampman heart has no function "sounds nuts." The etiological theorist agrees it sounds weird, but they argue it is the price of admission for solving the **Problem of Malfunction.**

  This is the SE camp's strongest weapon.
  *   **Causal Role View:** If function is just "what it contributes," then if the Swampman heart stops pumping, it just *changed what it contributes.* It is now contributing to stagnation. It's hard to say it *failed* or *broke* in a normative sense. It's just a different state.
  *   **Etiological View:** Because the function is tied to a historical standard (what it was selected *to do*), we can say the heart is **supposed** to pump blood. If it stops, it is **malfunctioning.** It is failing to meet the standard set by its evolutionary history.

  **The Trade-off:**
  The SE theorist argues: "Yes, I admit the Swampman heart case is weird. But if I accept your view (that the Swampman heart has a function), I lose the ability to distinguish between a broken heart and a heart that is just doing something else. I lose the distinction between 'is' and 'ought'."

  For the etiological camp, the "weirdness" of the Swampman case is a feature, not a bug. It preserves the distinction between:
  1.  **Accidental Benefit:** The heart vibrates and massages the lungs. (Causal role, but not a function).
  2.  **Proper Function:** The heart pumps blood. (Selected effect).

  In the Swampman case, *everything* it does is an accidental benefit. Nothing is a proper function. That is why they stand firm.

  ### 3. How the Causal Role Camp Handles the Case

  Robert Cummins (1975) developed his view specifically because the etiological view was too restrictive for actual scientific practice (like your 35 years of work).

  *   **The Analysis:** Cummins argues that to ascribe a function is to analyze a capacity of a containing system.
      *   System: The Organism.
      *   Capacity: Circulation/Survival.
      *   Component: The Heart.
      *   Function: The causal role the component plays in producing the capacity.
  *   **The Swampman:** The Swampman organism has a capacity for circulation. The heart-like organ contributes causally to that capacity. Therefore, it has the function of pumping blood. History is irrelevant.
  *   **Why Physiologists Love This:** It matches the lab. When you are measuring cardiac output in a new species, you don't need to know its phylogenetic history to determine the function of its pump. You just need to see what it contributes to the system *now*.

  **The Weakness:**
  The CR view suffers from **panfunctionalism.**
  *   The heart pumps blood (Function).
  *   The heart makes a "lub-dub" sound (Causal Role).
  *   The heart heats the surrounding tissue (Causal Role).
  *   The heart takes up space in the thoracic cavity (Causal Role).

  If function is just "any causal contribution," then the heart's function is also to make noise and take up space. Cummins handles this by saying functions are only those roles relative to a *specific analytical capacity* we are interested in. But critics argue this makes "function" too subjective (dependent on the observer's interest) rather than objective (dependent on the biology).

  ### 4. Can the Etiological View be Patched?

  This is where the current philosophy of biology is active. There are three main strategies to save the etiological view from the Swampman bullet without fully surrendering to Cummins.

  **A. The Type/Token Distinction (Karen Neander)**
  Neander argues that while the specific *token* organ (the Swampman heart) has no history, it belongs to a *type* (the vertebrate heart structure) that does have a history.
  *   **The Patch:** The token inherits the function from the type. Because this molecule-for-molecule duplicate is of a *type* that was selected for pumping, this specific instance counts as having that function.
  *   **Risk:** This gets murky. If the Swampman is a unique species of one, there is no "type" history. Strict SE theorists usually reject this patch because it dilutes the historical requirement.

  **B. Generalized Selected Effects (Peter Godfrey-Smith)**
  Godfrey-Smith suggests we don't need deep ancestral history; we just need **maintenance**.
  *   **The Patch:** If the Swampman heart continues to pump blood and that pumping contributes to the survival of the Swampman (allowing it to persist), a selection-like process begins *immediately*. The trait is being "selected" for retention in the current moment by the system's viability.
  *   **Risk:** This moves the goalposts from "evolutionary history" to "current systemic stability," which starts to look very much like the Causal Role view.

  **C. Function Pluralism (The "Both/And" Approach)**
  This is the most popular view among philosophers who talk to biologists (e.g., Justin Garson, Denis Walsh, or earlier, Arno Wouters).
  *   **The Patch:** They argue there isn't one concept of "function." There are two (or more).
      1.  **Selected Effect Function:** Used when asking evolutionary questions ("Why is this trait here?"). In this context, the Swampman heart has no function.
      2.  **Causal Role Function:** Used when asking mechanistic questions ("How does this system work?"). In this context, the Swampman heart *does* have a function.
  *   **Verdict:** This doesn't "fix" the etiological view so much as it confines it. It admits that the etiological view is not the *only* game in town. It validates your 35 years of physiology (you were using CR function) while validating the evolutionary biologists (they are using SE function).

  ### Summary for a Retired Physiologist

  You are stuck because you are rightly identifying that the **Etiological view sacrifices scientific utility for philosophical precision regarding normativity.**

  *   **The Etiological Camp** says: "If we don't tie function to history, we can't explain malfunction or distinguish design from accident. So yes, the Swampman heart is functionless."
  *   **The Causal Role Camp** says: "If we tie function to history, we can't do physiology on extinct species, new mutations, or hypothetical cases. So yes, the Swampman heart functions."
  *   **The Compromise:** Most modern philosophy of biology suggests you were right all along to not worry about it in the lab. "Function" is a homonym. When you wrote your papers, you meant "Causal Role." When an evolutionary biologist critiques your paper asking "What is the adaptive significance?", they mean "Selected Effect."

  The Swampman case doesn't prove one side right; it proves that the word "function" is doing two different jobs in biology. The etiological view refuses to let those jobs merge, even if it means calling a pumping heart "functionless" in a thought experiment. They accept that weirdness to keep the concept of "biological purpose" distinct from "physical consequence."
