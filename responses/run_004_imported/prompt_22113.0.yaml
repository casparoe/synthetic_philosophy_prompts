          *   *Core Claim:* Function $F$ of trait $T$ = The effect $E$ for which $T$ was selected in the evolutionary past.
          *   *Implication:* No history = No selection = No function.
          *   *Response to Swampman:* Yes, it has no function. It is a "functional look-alike" but lacks proper function.
