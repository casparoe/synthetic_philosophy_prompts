answer: |-
  # The Ghost in the Machine: Saving Bayesianism from Old Evidence

  The story of General Relativity (GR) and Mercury's perihelion is the canonical war story of modern physics. By 1915, the anomalous precession of Mercury was a settled fact, a piece of "old evidence" sitting in the ledger of astronomy for decades. When Einstein derived the exact value of this precession from the field equations of GR without ad hoc adjustments, the scientific world treated it as a massive confirmation of the theory. Intuitively, this makes perfect sense: a theory that explains a stubborn anomaly is superior to one that does not.

  Formally, however, this intuition breaks Bayesian confirmation theory. If $E$ is the evidence (Mercury's precession) and $H$ is the hypothesis (GR), standard conditionalization dictates that we update our belief in $H$ by calculating $P(H|E) = P(H) \times P(E|H) / P(E)$. But because $E$ was already known, $P(E) = 1$. Furthermore, if $H$ entails $E$, then $P(E|H) = 1$. The ratio collapses to 1. The posterior equals the prior. Mathematically, the discovery that GR explains Mercury provides zero confirmation.

  This is the Problem of Old Evidence. It is not merely a technical glitch; it strikes at the heart of what Bayesianism claims to be. If Bayesianism is a logic of scientific inference, it must account for the most famous inference in 20th-century physics. If it cannot, it is either descriptively false (scientists don't reason this way) or normatively bankrupt (scientists *shouldn't* reason this way, which implies their confidence in GR was irrational).

  Over the decades, the Bayesian diaspora has proposed two main classes of solutions: the **Dynamic Solution** (relaxing logical omniscience) and the **Static Solution** (counterfactual probabilities). While the Dynamic solution saves the psychology of discovery, only the Static solution saves the logic of justification. To preserve Bayesianism as a normative framework for rationality, we must accept the counterfactual move, despite its metaphysical costs.

  ### The Dynamic Fix: Learning the Entailment

  The first line of defense, championed by Daniel Garber, Richard Jeffrey, and Ilkka Niiniluoto, attacks the assumption of logical omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs. If you believe $H$, you automatically believe everything $H$ entails. But humans aren't logically omniscient. Einstein did not know in 1907 that GR entailed the Mercury precession; he had to do the math to learn it.

  In this view, the "new evidence" isn't $E$ (the planet's motion), but the logical fact $L$: *"$H$ entails $E$."* Since $L$ was not certain before 1915, $P(L) < 1$. When Einstein finished his calculations, he conditionalized on $L$, not $E$. This allows $P(H)$ to rise because learning that your theory successfully captures a known constraint is informative about the theory's truth.

  **The Objection:** This solution is psychologically realistic but logically weak. It solves the *dynamic* problem (how Einstein's credence changed historically) but fails the *static* problem (why GR is *currently* better confirmed than Newtonian mechanics).

  Today, we know $L$. We know $H \vdash E$. For a modern physicist evaluating GR, $P(L) = 1$. If we apply the Garber solution today, the confirmation evaporates again. This reduces Bayesian confirmation to a historical narrative about computational limitations. It implies that Mercury is evidence for GR only for those who haven't yet done the math, which is absurd. Evidence should be a relation between a theory and the world, not a relation between a theory and a scientist's calculation speed. If Bayesianism is to be a logic of science, it must handle the static relationship between established theories and known data.

  ### The Static Fix: Counterfactual Priors

  The second approach, most associated with Colin Howson, bites the metaphysical bullet to save the logic. It argues that to assess the confirmatory power of old evidence, we must calculate the likelihood ratio using a **counterfactual prior**. We ask: "What would the probability of $E$ have been, *had we not known $E$, but retained all other background knowledge $K$?*"

  In this framework, we temporarily "bracket" or "erase" $E$ from our knowledge base to evaluate how well $H$ predicts it. We calculate $P^*(E|H \& K)$, where $P^*$ represents this counterfactual credence. Since $E$ is no longer treated as certain in this hypothetical scenario, $P^*(E) < 1$, and the confirmation ratio works normally. If GR predicts $E$ with precision while Newtonian mechanics requires fudge factors, the likelihood ratio favors GR, and confirmation occurs.

  **The Objection:** The primary critique is that this procedure is ill-defined. How do you subtract $E$ from $K$ without unraveling the whole web of belief? Our knowledge of celestial mechanics is entangled. If you remove knowledge of Mercury's orbit, do you also remove knowledge of the telescopes used to measure it? The "ur-prior" is elusive, making the calculation seem arbitrary.

  Furthermore, critics argue this abandons actual subjective Bayesianism (which tracks real degrees of belief) for a fictionalized objectivism. If the probabilities aren't *your* actual probabilities, in what sense are you being "rational" by updating on them?

  ### The Bullet-Biters

  A minority position, held by some strict subjectivists like Clark Glymour (in his earlier work) and Bas van Fraassen, is to simply bite the bullet: Old evidence *does not* confirm. Confirmation is strictly about novel prediction. The excitement about Mercury was merely "heuristic"—it motivated people to look at GR, but it didn't logically support it.

  This view must be rejected. It renders scientific rationality path-dependent in an unacceptable way. It implies that if Einstein had published GR in 1800, Mercury would confirm it, but because he published in 1915, it doesn't. The logical support a theory derives from the structure of the universe should not depend on the calendar date of its discovery. To deny that Mercury confirms GR is to sever the link between Bayesianism and actual scientific practice.

  ### The Verdict: Saving the Normative Core

  So, where does this leave us? Is Bayesianism broken?

  No. But to save it, we must prioritize the **Static/Counterfactual solution** over the Dynamic one.

  The Garber solution is a necessary patch for *descriptive* epistemology—it explains how human agents navigate logical space. But the LessWrong rationalist project (and the philosophy of science generally) is primarily *normative*. It asks: "How *ought* we to apportion belief?" For normative questions, the historical accident of when evidence was discovered is irrelevant. What matters is the explanatory fit between hypothesis and world.

  The counterfactual approach preserves this normative core. Yes, defining the "erased" knowledge state is difficult. But this difficulty is not unique to old evidence; it is inherent to all prior selection. Choosing any prior requires judgment about what counts as background knowledge $K$. The counterfactual move simply makes this explicit. It forces us to acknowledge that confirmation is not about raw data dumping, but about **comparative explanatory power**.

  When we say Mercury confirms GR, we are implicitly making a comparative claim: "GR explains this data point more naturally than the available alternatives." The counterfactual prior is the mathematical tool that allows us to model this comparison. It asks us to treat the data as if it were a test, even if we've already seen the answer key, because the *structure* of the theory is what's being tested.

  Therefore, the verdict is this: **Bayesian confirmation theory is salvageable, but only if we reject the notion that conditionalization must always operate on actual, historical credences.** We must adopt a **Two-Tier Bayesianism**.

  1.  **Descriptive Tier:** Use Garber-style logical learning to model how agents update over time as they discover entailments.
  2.  **Normative Tier:** Use Howson-style counterfactuals to evaluate the static support evidence provides to a theory.

  If forced to choose one as the "true" savior of the framework, it is the **Counterfactual**. Why? Because the ultimate goal of Bayesianism is to provide a standard for rational belief. A standard that says "Mercury does not support GR" (the Bullet) or "Mercury only supported GR for Einstein in 1915" (Garber) fails that goal. A standard that says "Mercury supports GR because GR captures the structure of reality in a way that renders Mercury probable relative to alternatives" (Howson) succeeds.

  The cost is accepting that "probability" in scientific contexts is not just a measure of subjective uncertainty, but a measure of **systematic dependency**. We are not just betting on horses; we are mapping the terrain. Sometimes, to map the terrain accurately, we have to pretend we haven't already seen the view from the summit.

  Bayesianism survives the Problem of Old Evidence, but it survives by admitting that rationality involves a degree of fictionalization. We must be willing to pretend we don't know what we know, to truly understand why we know it.
