      *   *Option B: Leave it entirely to discretion.*
          *   Pros: Academic freedom, flexibility.
          *   Cons: Too vague ("professional judgement" failed here), leaves students vulnerable to surprise trauma.
      *   *Option C: Hybrid/Procedural Approach (Allow with safeguards).*
          *   Pros: Balances pedagogical necessity with student well-being. Acknowledges the word's power without banning it in critical contexts.
          *   Cons: Requires administrative overhead (notices, opt-outs).
      *   *Decision:* Option C is the most robust for a law school setting. It respects the doctrinal necessity (the word *is* the evidence) while mitigating harm through procedure. It validates the student's concern without accepting the premise that the word *cannot* be spoken in an academic context.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
