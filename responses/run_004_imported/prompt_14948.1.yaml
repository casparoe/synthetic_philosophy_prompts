          *   Reliability: The 70% confidence.
      *   *The "Uncertain Evidence" Problem:* This is technically "Jeffrey's Update" or "Uncertain Evidence in Bayes." But that might be too academic. Let's stick to the concept of **Signal-to-Noise**.
      *   *Better approach:* Treat the "70% confidence" not as the probability of the hypothesis, but as the *reliability of the sensor* (you).
      *   *Scenario:*
          *   If Deploy = Bad, probability of seeing spike = High.
          *   If Deploy = Good, probability of seeing spike = Low.
          *   Your "sensor" (eyes/brain) has a false positive/negative rate based on that 70% confidence.
      *   *Flaky Tests:* This maps perfectly. A flaky test is a sensor with known reliability issues.
      *   *Cultural Advice:* How to talk about this. "Weight of evidence" instead of "Proof."

  5.  **Refining the "70%" Interpretation:**
      *   The user says "70% confident I saw what I think I saw."
      *   This isn't $P(H|E) = 0.7$. This is $P(\text{I saw spike} | \text{Spike actually happened}) \approx 0.7$? Or is it $P(\text{Spike happened} | \text{I think I saw it}) = 0.7$?
      *   Usually, when people say "I'm 70% sure I saw X," they mean "Given my perception, there is a 70% chance X occurred."
      *   So, the observation $O$ is "I think I saw a spike."
      *   We need to update $P(\text{Deploy Caused Incident})$ given $O$.
      *   $P(H|O) \propto P(O|H) \cdot P(H)$.
      *   $P(O|H)$: Probability I *think* I saw a spike given the deploy *did* cause it. (Depends on graph visibility + my reliability).
      *   $P(O|\neg H)$: Probability I *think* I saw a spike given the deploy *did not* cause it. (Pareidolia + my reliability).
      *   *Simplification for the user:* Treat the 70% as a **discount factor** on the strength of the evidence. If a clear graph gives a Likelihood Ratio of 10:1, a shaky glance might give 3:1.

