prompt: |-
  My colleague Helen is retiring this spring after almost forty years, and somehow I've ended up giving the toast at her dinner. Here's the wrinkle: Helen's whole research career has been on standing to blame -- when you actually get to call someone out and when you should just keep quiet -- and for a good chunk of that career she was also the person in our department who called people out, formally, including me once, in writing, for being chronically late to a whole semester of faculty meetings. Tonight I'd like to gently roast her for being chronically late to everything herself, which means the philosophers in the room are going to clock my hypocrisy problem before I even finish the sentence, and Helen -- this is the annoying part -- is going to be sitting right there doing the standing-to-blame math in real time, because its literally her specialty. I want the toast to take that on directly rather than dodge it -- Cohen's old point that a hypocrite can still be dead right about the charge even if they've got no business making it is roughly the shape I'm imagining -- and still land as affection instead of a seminar. Half the room is philosophy faculty who'll be tracking every move, the other half is her family and a couple of deans who just want a nice five minutes. Can you write me that toast?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for Helen (colleague, almost 40 years).
      *   **Speaker:** Colleague (tasked with giving the toast).
      *   **Key Conflict/Irony:** Helen's research specialty is "standing to blame" (when it's appropriate to call someone out). She famously called out the speaker (in writing) for being chronically late to faculty meetings. Now, the speaker wants to roast Helen for *also* being chronically late to everything.
      *   **Audience:** 50% Philosophy faculty (will spot the hypocrisy/irony immediately, know the literature), 50% Family/Deans (want warmth, brevity, no jargon).
      *   **Tone:** Affectionate, direct (don't dodge the hypocrisy), witty, but not a seminar. Needs to land as love, not aggression.
      *   **Philosophical Anchor:** G.A. Cohen's point (a hypocrite can be right about the charge even if they lack the standing to make it).
      *   **Constraint:** Keep it around 5 minutes spoken (roughly 600-800 words).

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Charge:* Helen is late.
      *   *The Defense:* I (the speaker) am also late.
      *   *The Pre-emptive Strike:* Helen called me out for being late.
      *   *The Twist:* I am calling her out for being late.
      *   *The Resolution:* Cohen's distinction between the *truth of the claim* and the *standing of the claimant*.
      *   *The Emotional Core:* We are flawed together. Her rigor made us better, even if she wasn't perfect. Her lateness is humanizing.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, the milestone (40 years), and the immediate tension in the room. Set the stage for the "elephant in the room."
      *   **The "Standing to Blame" Hook:** Introduce Helen's work simply. No jargon for the family, but enough signal for the philosophers.
      *   **The Personal Anecdote (The Speaker's Shame):** Mention the letter about the faculty meetings. It's a known fact, so own it. It establishes her authority.
      *   **The Turn (The Roast):** Reveal her lateness. This is the risky part. Needs to be gentle.
      *   **The Philosophical Pivot (Cohen):** Address the hypocrisy directly. Use the Cohen reference but explain it plainly. "The clock is right, even if the timekeeper is wrong."
      *   **The Affectionate Reframe:** Why does her lateness matter? It shows she was busy thinking, helping, doing the real work. It humanizes the "blame" expert.
      *   **Conclusion:** Raise a glass. Focus on the future and her legacy.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Keep the Cohen reference brief. Explain it as "being right about the rule, even if you broke it."
      *   *Critique:* Is it too mean about the lateness?
      *   *Fix:* Frame it as "academic time" or "deep thought time." Make it endearing.
      *   *Critique:* Does it acknowledge the family?
      *   *Fix:* Add a nod to her patience outside work or how her family tolerates the same quirks.
      *   *Critique:* Is the hypocrisy addressed clearly?
      *   *Fix:* Make sure the speaker admits *they* have no standing either. It's a mutual admission of guilt.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Start:* Good evening. 40 years is a long time.
      *   *Middle:* Helen studies blame. She blamed me for lateness. I have the notes. But Helen is also late.
      *   *Philosophy:* Cohen says I can be right even if I'm a hypocrite.
      *   *End:* We love you. Cheers.

      *(Self-Correction during drafting)*: Wait, I need to make sure the Cohen point doesn't sound like I'm justifying my own lateness. It needs to justify *calling her out* despite my own lateness. Actually, the prompt says "Cohen's old point that a hypocrite can still be dead right about the charge." So, I can admit I'm a hypocrite, but the charge (Helen is late) is still true.
      *Better angle:* We are both late. Neither of us has standing. But the *value* of punctuality remains. Or, better yet, her lateness proves she's human. Let's go with: "I have no standing, you have no defense, but the truth stands."

  6.  **Polishing the Language:**
      *   Avoid "normative authority" or "moral jurisdiction." Use "right to speak" or "moral high ground."
      *   Ensure the transition from the roast to the tribute is smooth.
      *   Check timing.

  7.  **Final Review against Constraints:**
      *   5 minutes? Yes, word count looks good.
      *   Family included? Yes, tone is warm.
