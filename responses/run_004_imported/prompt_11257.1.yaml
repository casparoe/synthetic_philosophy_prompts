answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Helen's, and I've been given the distinct honor—and the distinct danger—of proposing this toast.

  Forty years. That is an extraordinary span of time to dedicate to a single community, a single discipline, and a single question. And Helen's question, for those of you at home, was essentially: *When do we have the right to tell someone they've done wrong?*

  In the literature, this is called "standing to blame." It's the study of the moral high ground. Who gets to hold the gavel? Who gets to speak?

  Now, I ask the philosophy faculty in the room to bear with me for a moment, because I know what you're thinking. You're looking at me, and you're looking at Helen, and you're sensing a tension.

  See, Helen takes this seriously. I speak from experience. About ten years ago, I received a memo. It was formal, it was cited, and it was from Helen. The charge? Chronic lateness to faculty meetings. The evidence was irrefutable. The tone was rigorous. I was, effectively, called out by the world's leading expert on calling people out.

  I kept that memo. I framed it. And tonight, I thought it might be poetic justice to return the favor.

  Because the thing is… Helen is also chronically late.

  [Pause for laughter]

  To meetings. To dinners. To the very beginning of this retirement party, I might add. She arrived just as the soup was being served.

  Now, I can hear the philosophers in the back of the room sharpening their pencils. They are currently calculating the hypocrisy index of this speech. They are thinking: *By what standing does the chronically late man charge the chronically late woman with lateness?*

  And they are right. I have no standing. None. If standing were a currency, I am bankrupt.

  But there is an old point made by the philosopher G.A. Cohen, which suggests that a hypocrite can still be dead right about the charge, even if they have no business making it. The clock on the wall can be right about the time, even if the clock itself is broken.

  So, I am standing here, with no moral authority, to state a simple truth: Helen, you are late.

  [Pause]

  But here is the thing I've learned from watching you for twenty years, and from reading that memo, and from watching you rush into rooms with your hair slightly windswept and an apology already forming on your lips.

  I've realized that your lateness wasn't about disregard. It was about overflow.

  You were late because you stopped to talk to a grad student who was having a crisis. You were late because you were finishing a paragraph that needed to be perfect. You were late because you were thinking about the problem, not the schedule.

  In a way, your lateness is the human correction to your own research. You spent forty years defining the rules of when we can blame each other. But you also spent forty years showing us that what matters isn't the standing to blame—it's the willingness to show up, even if you're a little late.

  You taught me that being called out isn't an attack; it's an invitation to be better. Even if the person calling you out is flawed. Even if the person calling you out is also running ten minutes behind.

  So, to Helen.

  May your retirement be punctual when it needs to be, and delightfully unpunctual when it doesn't. May you never have to write another memo on professional conduct. And may you know that while we might have had the standing to blame you for being late, we never had the standing to question how much you gave to this department.

  We love you, we respect you, and we are so glad you finally made it here tonight.

  To Helen.
