answer: |-
  **Setting:** *A university coffee lounge, late afternoon. Two graduate students, Elena (Dispositionalist) and Marcus (Kripkean Skeptic), are continuing a seminar discussion that ran over time.*

  **Elena:** Look, the seminar cut off right when we were getting to the only viable exit ramp for the dispositionalist. You conceded that simple dispositionalism fails because of finitude—I can't actually compute "68 + 57" if the numbers are large enough to exceed my brain's storage. But that's a contingent limitation. The move is to idealize. We define meaning not by what I *do* say, but by what I *would* say under ideal conditions: infinite time, no distractions, full cognitive capacity, no memory lapses. Under those conditions, my disposition to answer "125" constitutes the fact that I meant *plus*.

  **Marcus:** I remember the move. It's the standard retreat. But you're skipping the step where Kripke pulls the rug out from under idealization. Let's grant you the ideal conditions. Let's grant you an idealized Elena with infinite processing power. The question remains: What makes it the case that your idealized disposition is to say "125" rather than "5"?

  **Elena:** Because I mean *plus*. That's the fact we're trying to capture.

  **Marcus:** That's circular. You're using the notion of meaning *plus* to explain the disposition, but the disposition is supposed to explain the notion of meaning *plus*. Here's the specific worry: Suppose that under these ideal conditions, you are disposed to answer "5" for "68 + 57". Maybe your brain, even ideally functioning, operates on a *quus*-like function for numbers above a certain threshold. If meaning is *just* disposition, then in that scenario, you would mean *quus*. But that seems absurd. It implies that if I am disposed to make a mistake consistently, I am not making a mistake at all; I am simply following a different rule. The disposition tells us what the speaker *would* say, never what the speaker *should* say. It collapses normativity into regularity.

  **Elena:** Okay, but that objection relies on a false equivalence between "regularity" and "rule." You're assuming all dispositions are created equal. They aren't. We distinguish between a correct disposition and an incorrect one by appealing to the *function* of the mechanism. Think of a calculator. If I type "2 + 2" and it displays "5," we don't say, "Oh, well, it's disposed to do that, so it means *quus*." We say it's malfunctioning.

  **Marcus:** Why?

  **Elena:** Because it has a design function. Its circuits are built to track arithmetic truth. There is a fact of the matter about how the hardware *ought* to behave, grounded in its causal history and construction. Similarly, my cognitive faculties have a biological design. A disposition to err is a malfunction of the cognitive system, distinguishable from a correct disposition by reference to that design. So, idealized dispositionalism isn't just "what I would say"; it's "what my cognitive system is designed to output under ideal conditions." That restores the normativity. "Should" is cashed out as "proper functioning."

  **Marcus:** That's a robust rejoinder, appealing to teleology. But now you've shifted the ground from psychology to biology, and the skeptical problem re-emerges there. Who reads the design specs? If I look at your brain, I see neurons firing. I see causal connections. I don't see a label that says "This circuit is for *addition*." To say the circuit is *malfunctioning* when it outputs "5" presupposes that its function was *addition*. But that's exactly what we're trying to establish!

  **Elena:** Not necessarily. The function isn't interpreted by a homunculus inside the head. It's fixed by evolution and learning history. My brain was selected and trained to track community practices of addition. The "design" is an objective causal fact. If my idealized disposition diverges from the output of the computational structure I was trained on, that's a malfunction, not a new meaning. The statistical normalcy of the community provides the baseline for what counts as "proper function."

  **Marcus:** Ah, there it is. You've smuggled in the community. But notice what happens when you do that. If the standard for "proper function" is alignment with the community's practice, you've abandoned the idea that meaning is a fact *about the individual speaker*. You're no longer a dispositionalist in the sense of finding a truth-condition within the individual. You're saying the individual means *plus* only insofar as they align with the group.

  **Elena:** I'm not abandoning the individual fact. The individual fact *includes* their causal relation to the environment. A heart is designed to pump blood even if it's the only heart in the universe, because of its evolutionary history. My cognitive states are designed to track *plus* because of my training history. The fact is internal to my causal history, even if the *standard* is external.

  **Marcus:** But Kripke's skeptic asks for a fact that *justifies* my current claim. If I say "125," I want to know I am *right*. If you say, "You are right because your brain is designed to say 125," I ask, "How do I know my brain isn't designed to say 125 now but 5 later?" Or, more damningly: "How do I know that 'designed to track addition' doesn't just mean 'designed to track whatever I am disposed to say'?" Evolution selects for survival, not truth. A disposition to say "5" might be biologically advantageous in some contexts. If you ground normativity in biological success, you lose the normativity of logic. You can't say the calculator is *wrong* to say "5"; you can only say it's *unusual*.

  **Elena:** But "unusual" relative to a norm! The norm is established by the training process. When I learned addition, there were corrections. "No, not 5, 125." Those corrections shaped the disposition. The idealized disposition is the limit of that training process stripped of performance errors. If the idealized limit yields "5," then the training failed to instill *plus*. But if the training succeeded, the idealized limit *must* yield "125." The fact of the training history fixes the content.

  **Marcus:** This is the crux. You say the training fixes the content. But the skeptic asks: What fact about that training determines that the word "plus" meant *addition* and not *quaddition*? Every example you were given during training was finite. You were corrected on finite sums. There is no fact about those finite corrections that logically entails how you should proceed with infinite new cases. To say "The training determined it" is to assert what needs to be proved. You're positing a "design" that transcends the finite data, but that design is invisible to the physical facts.

  **Elena:** So you're saying the physical facts of my training, my brain structure, and my idealized responses are insufficient to constitute meaning?

  **Marcus:** I'm saying they are insufficient to constitute *normative* meaning. They constitute facts about what you *will* do. If you want to save dispositionalism, you have to accept that "meaning" is just a shorthand for "predictable behavior under ideal conditions." But then you lose the ability to say someone is *mistaken* in a strong sense. You can only say they are *atypical*.

  **Elena:** I reject that dichotomy. "Atypical relative to a functional norm" *is* a form of mistake. If a heart is disposed to stop beating, it's malfunctioning, even if that's what it's disposed to do. The normativity comes from the teleology, not from a platonic rule. I don't need a fact that transcends nature to save meaning; I just need a naturalized account of function. You're demanding a "fact of the matter" that is non-natural, a ghostly grasp of the rule. I'm offering you a biological fact.

  **Marcus:** And I'm telling you that calling it "biological function" doesn't bridge the gap between *is* and *ought*. It just dresses the *is* in teleological clothing. But... I will concede this: If you are willing to naturalize normativity so thoroughly that "ought" becomes "functions normally for a species member," you avoid the skeptical paradox by dissolving the demand for non-natural justification.

  **Elena:** Exactly. The paradox only arises if you think meaning requires a magical connection to a rule. If meaning is a natural property of a complex, disposed system, the paradox vanishes.

  **Marcus:** But then you've essentially accepted the Skeptical Solution's conclusion—that there are no truth-conditional facts about meaning—while trying to dress it up as a Truth-Conditional account. You're saying the "fact" is just our willingness to attribute meaning based on normalcy. That's assertibility, not truth.

  **Elena:** *(Smiling)* Then perhaps the disagreement is merely terminological. You call it a Skeptical Solution because you miss the ghost. I call it Dispositional Realism because I see the machine.

  **Marcus:** Or perhaps the machine is all there is, and the ghost was just the feeling of the gears turning. But until you can show me how the gears dictate the *next* move without me already knowing how they *should* turn, I'm keeping my skepticism.

  **Elena:** And I'll keep building better models of the gears. Coffee?

  **Marcus:** Black. No sugar. Or rather, disposed to take it that way under ideal conditions.

  **Elena:** Don't start.
