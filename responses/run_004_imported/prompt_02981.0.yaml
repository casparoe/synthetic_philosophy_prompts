answer: |-
  This distinction comes primarily from Hilary Greaves' 2016 paper, *"Cluelessness about the Long-Term Future."* It is a crucial technical distinction because it determines whether the "cluelessness objection" actually kills consequentialism or just nicks it.

  Here is the breakdown of the two types, the verdict on which is more dangerous, and why.

  ### 1. The Distinction

  The core of the cluelessness objection is that consequentialism requires us to maximize the good, but we cannot know the long-term consequences of our actions (the "butterfly effect"). Greaves splits this ignorance into two categories based on the **structure of the uncertainty**.

  **Simple Cluelessness**
  This occurs when you have no basis for assigning probabilities to the outcomes of your action, and there is no symmetry between the positive and negative possibilities.
  *   **The Scenario:** You save a drowning child. You know this will have massive long-term ripple effects.
  *   **The Ignorance:** You have *no reason* to think the ripple effects will be net positive, and *no reason* to think they will be net negative. You also have no reason to think they are equally likely. You are in total fog.
  *   **The Math:** You cannot calculate an Expected Value (EV). The probability distribution is undefined.

  **Complex Cluelessness**
  This occurs when you don't know the specific outcome, but the *reasons* for thinking the outcome will be good are structurally symmetric to the *reasons* for thinking it will be bad.
  *   **The Scenario:** You give a cash transfer to a poor person. This stimulates the local economy (good) but might slightly increase inflation (bad).
  *   **The Ignorance:** You don't know the magnitude of the inflation vs. the stimulation. However, the causal mechanisms suggesting "good" are of the same type and weight as the mechanisms suggesting "bad."
  *   **The Math:** Because the uncertainty is symmetric, you can apply a **Principle of Indifference**. You can reasonably assign a probability that the long-term effects net to zero (or cancel out), allowing you to calculate EV based on the *direct*, short-term effects.

  ### 2. Which is the Bigger Problem?

  **Simple Cluelessness is the existential threat.**

  If Simple Cluelessness is the norm, consequentialism (and by extension, Effective Altruism) is paralyzed. If you literally cannot assign a probability to whether an action creates value or disvalue, you cannot maximize expected utility. You have no rational way to choose between saving a life and buying an ice cream cone, because the long-term ripple effects of both are equally unknowable and asymmetric.

  **Complex Cluelessness is supposedly "less of a big deal."**

  Greaves and other EA-aligned philosophers argue that Complex Cluelessness is manageable for one specific reason: **Expected Value Theory handles symmetry.**

  If the reasons for a positive outcome mirror the reasons for a negative outcome, a rational agent can treat the *expected value of the long-term ripple effects* as neutral (zero).
  *   **Why this saves Consequentialism:** It allows the agent to ignore the unknowable long-term future and focus on the knowable short-term consequences. If I know saving the child has a +100 value *today*, and the long-term ripple effects are "complexly clueless" (symmetric), I can treat the long-term EV as 0. My total EV is +100. I can act.

  ### 3. The "Blind Spot" for your Piece

  For your article on EA's blind spots, the critical tension is this:

  EA proponents (following Greaves) argue that **most real-world cases are Complex, not Simple.** They argue that because the world is chaotic, good and bad ripple effects tend to cancel out symmetrically, allowing us to focus on direct impact.

  **The Counter-Argument (The Blind Spot):**
  Critics argue that EA often *misdiagnoses* Simple Cluelessness as Complex Cluelessness.
  *   **Example:** Long-termist interventions (like AI safety or pandemic prevention) claim to have massive positive long-term effects.
  *   **The Critique:** There is no symmetry there. If we succeed, the future is vast and good. If we fail, the future is extinguished. The "upside" and "downside" are not structurally symmetric. Therefore, this is **Simple Cluelessness**.
  *   **The Implication:** If EA's highest-priority causes (long-termism) are subject to Simple Cluelessness, the EV calculations collapse, and the prioritization loses its mathematical footing.

  **Summary for your piece:**
  *   **Simple Cluelessness:** Asymmetric ignorance. Breaks the math. Fatal to the theory.
  *   **Complex Cluelessness:** Symmetric ignorance. Math survives via cancellation. Manageable.
  *   **The Fight:** EA argues most problems are Complex (so we can act). Critics argue EA's most ambitious projects are actually Simple (so we are guessing).

  **Source:** Greaves, H. (2016). "Cluelessness about the long-term future." *Effective Altruism: Philosophical Issues*.
