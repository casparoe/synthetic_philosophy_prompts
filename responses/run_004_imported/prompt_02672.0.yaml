answer: |-
  This is a fantastic question, and your student deserves credit for spotting the structural similarity. It is one of the most persistent points of confusion in the philosophy of conditionals, largely because the equations *do* look identical on the page:

  *   **Stalnaker:** $P(A \to C) = P(C|A)$
  *   **Adams:** $Pr(A \to C) = P(C|A)$

  Your hand-wavy answer about truth conditions was actually pointing in the right direction, but you're right to want the mechanical details. The short answer is: **Lewis's proof relies on treating the conditional as an event in a probability space. Adams denies that the conditional is an event.** Therefore, the mathematical operations Lewis performs are illicit in Adams' framework.

  However, Adams doesn't get off scot-free. He avoids triviality, but he pays for it with the "Embedding Problem." And you are correct to recall Hájek; he later showed that the threat of triviality is more robust than Adams hoped.

  Here is the breakdown you can use for Thursday.

  ### 1. Why Lewis's Proof Hits Stalnaker
  To see why Adams dodges the bullet, we have to see exactly where the bullet is fired in Lewis's proof (1976, "Probabilities of Conditionals and Conditional Probabilities").

  Lewis assumes **Stalnaker's Thesis**: The conditional $A \to C$ expresses a proposition. Let's call that proposition $X$. Because it is a proposition, it has a truth value in every world, and it can serve as an argument for the probability function $P$.

  Lewis then applies the **Law of Total Probability** to $X$. For any proposition $B$ (where $0 < P(B) < 1$):
  $$P(X) = P(X|B)P(B) + P(X|\neg B)P(\neg B)$$

  Since $X$ is the conditional $A \to C$, and assuming Stalnaker's Thesis holds for *all* probability functions, Lewis substitutes $P(C|A)$ for $P(X)$. Through a series of steps involving specific choices of $B$ (specifically where $B$ is $C$ and $\neg C$), he derives that $P(C|A) = P(C)$.

  **The Consequence:** The probability of $C$ given $A$ is just the unconditional probability of $C$. $A$ and $C$ are probabilistically independent. Since this must hold for *any* $A$ and $C$, the language collapses. You can't have informative conditionals.

  **The Crucial Premise:** The proof works because $A \to C$ is treated as a proposition $X$ that can be conditioned upon ($P(X|B)$) and negated. It lives in the Boolean algebra of the probability space.

  ### 2. How Adams Dodges the Result
  Ernest Adams (1965, 1975) agrees with the equation but disagrees on the metaphysics. For Adams, **indicative conditionals do not express propositions.** They have no truth conditions. They are not true or false; they are only **assertable** or **unassertable**.

  When Adams writes $Pr(A \to C)$, he is *not* writing "The probability that the proposition $(A \to C)$ is true." He is writing "The degree of assertability of the sentence 'If A, C'."

  **Why Lewis's math fails here:**
  1.  **No Proposition, No Event:** Since $A \to C$ is not a proposition, it is not an event in the probability space.
  2.  **Illicit Conditioning:** You cannot apply the Law of Total Probability to something that isn't an event. The expression $P((A \to C) | B)$ is a category mistake in Adams' framework. You can't condition on a conditional.
  3.  **No Negation:** You cannot form the proposition $\neg(A \to C)$ in Adams' logic.

  Because Lewis's proof requires conditioning on the conditional and treating it as a truth-apt entity to apply the axioms of probability, the proof simply cannot get off the ground against Adams. Adams isn't proposing a different probability function; he's proposing that conditionals fall *outside* the domain of the standard probability function entirely.

  ### 3. Does Adams Relocate the Problem? (The Embedding Problem)
  Yes. This is the trade-off. By denying truth conditions to avoid triviality, Adams renders conditionals logically inert. They cannot be embedded in complex sentences.

  Consider these natural sentences:
  1.  **Negation:** "It is not the case that if it rains, the match will be cancelled."
  2.  **Disjunction:** "Either if it rains the match is cancelled, or if it snows the match is cancelled."
  3.  **Antecedents:** "If, if it rains, the match is cancelled, then we should bring umbrellas."

  In Stalnaker's view, these are fine. $A \to C$ is a proposition, so you can negate it, disjoin it, or put it in an antecedent.
  In Adams' view, these are problematic. If $A \to C$ has no truth value, what does it mean to negate it? If it's not a proposition, how can it serve as the antecedent for another conditional?

  Adams' theory works beautifully for simple, unembedded indicative conditionals (which is most of what we use in daily reasoning). But it struggles to provide a semantics for logical compounds involving conditionals. So, Adams avoids **Triviality** but succumbs to **Inexpressibility**.

  ### 4. Hájek and the "Triviality Pursuit"
  Your memory serves you well. Alan Hájek (1989, "Probabilities of Conditionals"; and later "Triviality Pursuit") complicated the picture for Adams.

  Hájek argued that triviality results are "robust." Even if you deny that conditionals have truth values, if you try to assign them probabilities that obey the standard axioms of probability (even if interpreted as assertability), you run into similar walls *if* you allow certain logical principles.

  Specifically, Hájek showed that if you assume:
  1.  Adams' Thesis holds.
  2.  Conditionals can be embedded in at least *some* truth-functional contexts (or if their probabilities behave like standard probabilities in a unified space).
  3.  Certain logical equivalences hold (like Import-Export: $(A \land B) \to C \equiv A \to (B \to C)$).

  ...you can derive triviality results again.

  Hájek's point is that you can't just say "It's not a proposition" and walk away. If you want the probabilities of conditionals to interact with other probabilities in a coherent agent's belief system, the pressure to collapse back into triviality returns. To resist this, Adams' defenders (like Dorothy Edgington) have to bite the bullet that conditionals really *cannot* be embedded, not even in belief contexts (e.g., "I believe that if A, C" is not a belief in a proposition, but a conditional belief).

  ### 5. Stalnaker vs. Adams: Which is More Defensible?
  When weighing them in your seminar, here is the current state of play:

  **Stalnaker (and Lewis/Variable Strict Accounts):**
  *   **Pros:** Preserves classical logic for conditionals. Handles embedding beautifully. Fits with possible worlds semantics.
  *   **Cons:** Must deny Adams' Thesis ($P(A \to C) \neq P(C|A)$). This is counter-intuitive. (Example: If I think it's 50% likely the coin is biased, and 50% likely it's fair, my $P(\text{Heads}|\text{Toss})$ is 0.5. But on Stalnaker's view, the proposition "If Toss, Heads" might have a different probability depending on the world selected by the selection function).
  *   **Verdict:** Better for metaphysics and logic; worse for modeling uncertain reasoning.

  **Adams (and Edgington's Suppositional Theory):**
  *   **Pros:** Validates Adams' Thesis, which matches our intuitive judgments about uncertainty and betting. Explains why Modus Ponens works but other inferences fail.
  *   **Cons:** The Embedding Problem. It requires a non-truth-conditional semantics, which makes it hard to integrate with standard model theory.
  *   **Verdict:** Better for epistemology and reasoning under uncertainty; worse for logic and semantics of complex sentences.

  **The Modern Consensus:**
  Most philosophers of language lean toward a **hybrid** or a **contextualist** view.
  1.  **Edgington:** Argues strongly for Adams. She claims the "Embedding Problem" is actually a feature, not a bug. We *don't* really assert negations of conditionals; we assert conditionals with negated consequents.
  2.  **Bradley (2000s):** Has done work showing that if you use **Jeffrey Conditionalization** rather than standard conditioning, you can sometimes rescue a propositional view that respects Adams' Thesis without triviality, though this is technical and controversial.
  3.  **Contextualism:** Some argue Stalnaker's Thesis holds only relative to a context, and shifting the context avoids Lewis's proof (since Lewis assumes the equation holds for *all* probability functions fixed to a single algebra).

  ### Summary for Your Students
  1.  **Lewis kills Stalnaker** because Stalnaker treats conditionals as propositions, allowing Lewis to use the Law of Total Probability on them.
  2.  **Adams survives Lewis** because he treats conditionals as non-propositional (assertability conditions), making Lewis's mathematical operations illicit category errors.
  3.  **Adams pays a price:** He loses the ability to easily handle negations, disjunctions, and nested conditionals (The Embedding Problem).
  4.  **Hájek warns us:** Even non-propositional accounts face triviality if they try to integrate too closely with standard probability axioms and logic.
  5.  **Choice:** Do you want a logic that handles complex sentences (Stalnaker) or a theory that handles uncertain reasoning intuitively (Adams)? You usually can't have both without significant modification.

  This should give you a solid framework to move past the hand-waving. It's a genuine trade-off between **logical expressiveness** and **probabilistic coherence**.
