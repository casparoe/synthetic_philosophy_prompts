prompt: |-
  Funny timing: I'm teaching a graduate seminar on the philosophy of promising this term, and now I've actually got a live case in my own department instead of just thought experiments. Short version: our hiring committee had a candidate everyone loved, and back in Febuary our chair told her, over email, something like "the offer is basically finalized at this point, HR just needs to process it, so please don't accept anything else." Nothing was ever signed. She took it at her word anyway, turned down a competing tenure-track offer at another school, and told her current chair she was resigning effective this summer. Two weeks ago the dean's office froze the line because of a sudden budget shortfall, so there is no position to actually give her, and I think our chairs quietly hoping the whole situation just goes away on its own.

  I've been put on a small ad hoc committee that has to bring the dean a recommendation on what, if anything, the department owes this candidate, given that nothing was ever a legally binding contract. I don't want to show up with "well, it feels bad, so we should do something" -- I want to circulate an actual memo beforehand that recommends a concrete course of action (money, a standing offer for next cycle, whatever you think is defensible) with a rough timeframe attached, but that grounds the recommendation in a real answer to why an unwritten assurance like that generates any obligation in the first place. Is the source of the obligation the reliance we invited her to place on our word, some kind of convention about how hiring committees are understood to talk, something closer to Scanlon's assurance-based story, or does it actually matter that it was an institution and not a single person doing the "promising"? And please don't hand me the version that flatters us -- two people on this committee are going to argue, seriously, that a sincere apology is the entire extent of what we owe her, and the memo needs to engage that position honestly rather than wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is teaching a graduate seminar on the philosophy of promising and is facing a real-life ethical dilemma in their department.
      *   **Situation:** A candidate was verbally/email assured a job offer ("basically finalized," "don't accept anything else") by the Chair in February. No contract was signed. The candidate relied on this (turned down another TT offer, resigned from current post). Now, the Dean froze the line due to budget. The Chair hopes it goes away.
      *   **Task:** The user is on an ad hoc committee to recommend a course of action to the Dean. They need a memo that recommends concrete action (money, future offer, etc.) grounded in philosophical theory, not just "feelings."
      *   **Key Philosophical Questions:** Source of obligation (reliance, convention, Scanlonian assurance, institutional vs. individual)?
      *   **Constraint:** Must engage honestly with the counter-argument (that a sincere apology is enough) rather than dismissing it.
      *   **Tone:** Professional, academic, persuasive, ethically rigorous, actionable.

  2.  **Identify the Core Ethical Frameworks:**
      *   *Promissory Obligation (Scanlon):* Principle of Fidelity (Principle F). If one intentionally leads another to expect X, knowing they want assurance, one must do X unless released.
      *   *Reliance/Estoppel:* Even if not a legal contract, the candidate suffered detriment based on reasonable reliance on the institution's representation.
      *   *Institutional Agency:* Does the institution bear responsibility for the Chair's words? Yes, the Chair acts as an agent.
      *   *Professional Norms:* Academic hiring has specific conventions. "The offer is basically finalized" is performative language in this context.
      *   *Counter-argument (Apology Only):* Based on legalism (no signature = no deal) and force majeure (budget crisis is out of hands).

  3.  **Determine the Recommendation:**
      *   *Option A: Nothing/Apology.* Ethically weak, damages reputation, harms candidate severely.
      *   *Option B: Bridge Funding/Compensation.* Pay her the salary for the year even if there's no job.
      *   *Option C: Guaranteed Offer Next Cycle.* Good, but doesn't solve the immediate gap year.
      *   *Option D: Hybrid.* Compensation for the loss + Priority for next cycle + Active placement help.
      *   *Decision:* The strongest ethical position is to make the candidate whole for the reliance loss. Since she lost a TT job, she needs financial security for the coming year and a priority claim on the next available slot. Let's recommend a one-year salary stipend (or equivalent) + top priority for the next search + active placement assistance.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** Briefly state the problem and the recommendation.
      *   **Factual Background:** Keep it neutral but clear on the Chair's representation and the candidate's reliance.
      *   **Ethical Analysis (The Core):**
          *   *Address the "No Contract" argument:* Acknowledge legal non-bindingness but distinguish legal from moral obligation.
          *   *Scanlonian Assurance:* The Chair invited reliance. The candidate accepted that assurance.
          *   *Institutional Agency:* The Chair speaks for the Dept/University. The University absorbs the risk, not the individual candidate.
          *   *Professional Conventions:* In academia, this language *is* an offer, functionally.
      *   **Engaging the Counter-Argument (The "Apology Only" View):**
          *   Why might someone think this? (Budget constraints, legal protection).
          *   Why is it insufficient? (Disproportionate harm, moral hazard, reputational damage).
      *   **Recommendation:** Concrete steps.
          1.  Financial compensation (1 year salary).
          2.  Priority hiring next cycle.
          3.  Placement support.
      *   **Timeline:** Immediate action.

  5.  **Refining the Philosophical Arguments (Self-Correction during drafting):**
      *   *Critique:* Is Scanlon too abstract?
      *   *Fix:* Ground it in *Principle F* specifically. The Chair created an expectation *intending* for her to rely on it.
      *   *Critique:* Is the institution responsible for the Chair's rogue email?
      *   *Fix:* Argue that in hiring, the Chair *is* the institution. To claim otherwise is bad faith.
      *   *Critique:* How to handle the budget freeze?
      *   *Fix:* The budget risk belongs to the institution, not the applicant. The institution is better positioned to absorb the loss.

  6.  **Polishing the Tone:**
      *   Needs to sound like it comes from a philosopher (precise, argument-driven) but also an administrator (pragmatic).
      *   Avoid moralizing; focus on obligation and harm mitigation.
      *   Ensure the "Apology Only" section is steel-manned, not straw-manned.

  7.  **Final Review against User Prompt:**
      *   *Graduate seminar context:* Acknowledge the irony (maybe in a private note, but keep the memo professional).
      *   *Concrete course of action:* Yes (money + priority).
      *   *Grounded in theory:* Yes (Scanlon, reliance, institutional agency).
      *   *Engage counter-argument:* Yes, dedicated section.
      *   *Timeframe:* Included.

  8.  **Final Polish:** Check for clarity and impact. (The resulting memo below follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Dean of the College
  **FROM:** Ad Hoc Committee on Hiring Contingencies
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Candidate [Name] and Frozen Line [Position ID]

  ### I. Executive Summary

  The Department of Philosophy faces an ethical and professional crisis regarding candidate [Name]. Following explicit written assurance from the Department Chair in February that an offer was "basically finalized," [Name] relied on this representation to decline a competing tenure-track offer and resign from her current post. Due to the recent budget freeze, the line cannot be instantiated this academic year.

  While we acknowledge that no legally binding contract exists, the Committee recommends that the University accept a moral obligation to make [Name] whole. We recommend a package consisting of: (1) a one-year stipend equivalent to the base salary of the offered position; (2) a binding priority offer for the position should the line reopen in the next cycle; and (3) active placement assistance. This memo outlines the philosophical and professional grounds for this obligation, specifically addressing the argument that a sincere apology constitutes sufficient restitution.

  ### II. Factual Background

  1.  **Representation:** On [Date], the Department Chair communicated via email to [Name] that the offer was "basically finalized" and explicitly advised her not to accept other offers.
  2.  **Reliance:** [Name] acted on this advice. She declined a tenure-track offer from [Other Institution] and submitted her resignation to her current employer, effective June 2024.
  3.  **Revocation:** On [Date], the Dean's office froze the line due to budgetary shortfalls. No formal offer letter was ever signed by either party.
  4.  **Current Status:** The Department Chair has indicated a preference for inaction, hoping the candidate will withdraw her candidacy.

  ### III. The Source of Obligation

  The central question is whether an institution incurs obligations in the absence of a legal contract. We argue that it does, based on three converging frameworks: promissory fidelity, reliance-based harm, and institutional agency.

  **A. Scanlonian Assurance and Principle F**
  T.M. Scanlon's account of promissory obligation (specifically *Principle F*) is applicable here. Principle F states that if one intentionally leads another to expect that one will do X, knowing that the other wants assurance of this, and one acts to provide that assurance, one is obligated to do X unless released.
  *   **Application:** The Chair's email was not merely predictive ("we hope to hire you"); it was performative ("the offer is finalized... do not accept anything else"). This language was intended to provide assurance to stop the candidate's job search. By inviting this specific reliance, the Department incurred an obligation to fulfill the expectation or compensate for its failure.

  **B. The Ethics of Reliance**
  Even if we reject a strict promissory model, a reliance-based model holds. In professional hiring contexts, power asymmetry is significant. Candidates are expected to trust institutional agents. When an institution induces detrimental reliance (losing a TT job, resigning a current post), the moral cost of that harm must be borne by the inducer, not the reliant party. To argue otherwise is to treat the candidate as a means to the Department's hiring ends, rather than an end in herself.

  **C. Institutional Agency**
  A common defense is that the Chair acted prematurely without Dean's office finalization. However, in the context of academic hiring, the Chair *is* the institutional agent. Candidates cannot be expected to navigate the internal distinction between "Department Approval" and "Budgetary Finalization." If the University grants the Chair the authority to negotiate, it absorbs the risk of the Chair's premature assurances. Shifting this risk to the candidate is a form of bureaucratic bad faith.

  ### IV. Engagement with the "Apology Only" Position

  We anticipate an objection that a sincere apology and explanation of *force majeure* (the budget crisis) is the full extent of our obligation. This position rests on two claims:
  1.  **Legalism:** Without a signature, there is no deal.
  2.  **Fiscal Constraint:** The University cannot spend money on a position that does not exist.

  We find this position ethically insufficient for the following reasons:

  **1. The Disproportionality of Harm**
  An apology costs the institution nothing. The candidate's loss is catastrophic: a gap in employment, loss of tenure momentum, and potential stigma on the market. To claim that the institution's financial risk management outweighs the candidate's career viability is to prioritize institutional comfort over individual welfare in a scenario where the institution created the risk.

  **2. Moral Hazard and Professional Norms**
  If the norm becomes "verbal offers are non-binding until signed," the academic hiring market will suffer. Candidates will hedge, holding multiple offers longer, slowing down the entire system. Trust is a functional utility in hiring. By honoring the spirit of the assurance, we preserve the convention that allows future hires to trust us. If we default to legalism now, we degrade the value of our own future words.

  **3. The Nature of the Budget Crisis**
  Budget shortfalls are an internal institutional risk. They are not an act of God. The University is better positioned to absorb a one-year salary loss than the candidate is to absorb a career derailment. Passing the cost of the budget error entirely to the candidate is unjust distribution of harm.

  ### V. Recommendation

  To satisfy the moral obligation generated by the Department's assurance and to mitigate the harm caused by our reliance on that assurance, we recommend the following:

  1.  **Financial Restitution:** The University will provide [Name] with a one-year stipend equivalent to the base salary of the offered Assistant Professor position, payable over the 2024-2025 academic year. This need not be tied to teaching duties (which may not exist), but can be categorized as a research fellowship or bridge funding.
  2.  **Priority Re-hiring:** Should the line reopen for the 2025-2026 cycle, [Name] will be offered the position without a new search, contingent only on standard background checks.
  3.  **Placement Support:** If the line is eliminated permanently, the Department Chair and Senior Faculty commit to writing letters of recommendation and leveraging professional networks to secure [Name] a comparable position for the following cycle.

  ### VI. Timeline

  *   **Immediate (Within 1 week):** The Dean must communicate directly with [Name] to acknowledge the situation and the University's acceptance of responsibility.
  *   **Short-term (Within 2 weeks):** HR to draft the fellowship/stipend agreement.
  *   **Medium-term (By December):** Formalize the priority hiring clause in writing.

  ### VII. Conclusion

  We are teaching our graduate students that promises generate reasons for action that transcend mere preference or convenience. We cannot, in good conscience, demonstrate to our own community that institutional words are cheap when the budget tightens. We owe [Name] more than an apology; we owe her the security we promised her.

  ***

  **Notes for the Committee Chair (You):**

  *   **On the "Apology Only" Argument:** I tried to steel-man this in Section IV. The strongest version of that argument is fiscal fiduciary duty (the Dean can't spend money that doesn't exist). The counter is that *not* spending this money violates a higher fiduciary duty to professional integrity.
  *   **On Scanlon:** I kept the reference to Principle F specific but accessible. If your colleagues push back, the key is the *intentionality* of the Chair's email. They didn't just predict; they instructed her ("don't accept anything else"). That creates the bond.
  *   **On Institutional Agency:** This is your leverage against the Chair who wants this to "go away." If the Chair admits they spoke too soon, the University still owns the Chair's voice. If the Chair insists they were authorized, the University owns the decision. There is no escape hatch where the candidate loses.

  Good luck. This is a brutal case, but a rare opportunity to show the department that the seminar material isn't just for the classroom.
