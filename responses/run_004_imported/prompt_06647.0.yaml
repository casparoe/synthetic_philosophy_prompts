      *   *Does it break psychological connectedness?* Yes, between the hemispheres *now*.
      *   *So:* Pre-op Person P splits into Person L and Person R. Both claim continuity with P.
      *   *Locke's Problem:* He doesn't handle *branching* identity well (a problem later highlighted by Parfit). If P = L and P = R, but L != R, transitivity fails.
