  5.  **Refining the Output for a Seminar Context:**
      *   Need to sound academic but accessible.
      *   Cite specific Lockean concepts (forensic, appropriation, man vs. person).
      *   Address the "simultaneity" issue (Locke talks about alternating, split-brain is often simultaneous).
      *   Highlight the forensic crisis (punishment).

  6.  **Self-Correction/Nuance Check:**
