  2.  **Recall/Reconstruct Locke's Theory (Essay Concerning Human Understanding, Book II, Ch. 27):**
      *   *Key Distinction:* "Man" (biological organism) vs. "Person" (forensic unit, self-conscious thinking thing).
      *   *Criterion of Personal Identity:* Continuity of consciousness (memory/psychological connectedness). "As far as this consciousness can be extended backwards to any past Action or Thought, so far reaches the Identity of that Person."
      *   *Substance Irrelevance:* It doesn't matter if the substance (soul or body) changes, as long as consciousness continues. (The Prince/Cobbler thought experiment).
      *   *The Day/Night Man:* If distinct, non-communicating consciousnesses inhabit the same body alternately, they are distinct persons.
      *   *Forensic Focus:* Personhood is tied to accountability, reward, and punishment. You are only responsible for what you can remember/consciously appropriate.

  3.  **Analyze the Split-Brain Case through Locke's Lens:**
      *   *The Phenomenon:* Two centers of consciousness (roughly) in one body ("Man"). They can act simultaneously (cross-purpose hands). They often lack access to each other's visual fields or volitions. The left hemisphere (speech) confabulates reasons for the right hemisphere's actions.
      *   *Locke's "Day/Night" Analogy:* Locke explicitly discusses alternating consciousnesses in one body. He says they are *two persons*.
      *   *The Difference:* Split-brain isn't strictly alternating (time-sliced); it's often simultaneous (space-sliced/parallel). However, the key Lockean criterion is *communicating consciousness*. If Consciousness A cannot access the experiences/volitions of Consciousness B, they are not the same person.
      *   *The "Man":* There is clearly one biological organism (one "Man").
      *   *The "Person(s)":* Since the hemispheres often lack mutual consciousness (the right hand doesn't "know" why the left hand moved, and vice versa, and there is no unified "I" apprehending both), Locke's strict criterion suggests *two persons*.
      *   *Complication:* There is often *some* residual unity or sub-conscious integration, but Locke is strict about *conscious* appropriation. If I cannot remember it or claim it as mine *now*, it isn't mine.

  4.  **Drafting the Argument (Step-by-Step):**

      *   **Initial Verdict:** Locke would likely classify a severe split-brain patient as **two persons sharing one man**.
