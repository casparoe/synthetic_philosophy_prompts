answer: |-
  **Setting:** *A hospital break room, 3:17 AM. The vending machine hums. Two styrofoam cups sit on the table, steam long gone. LIN (50s), a hospice chaplain, leans back in his chair, eyes closed. SARAH (40s), a bioethicist, is scrolling through a tablet, but her thumb hasn't moved in a minute.*

  **Sarah:** Mr. Henderson asked me to stop his ventilation an hour ago. Then he asked me to start it again. Then he just cried. He's terrified, Lin. And you told him to imagine he was a leaf floating down a stream.

  **Lin:** I told him to imagine he was the stream.

  **Sarah:** Semantics. He's a man losing his future. That is an objective harm. My job is to advocate for the integrity of his interests, and his interest is in continuing to have experiences. When the ventilator stops, that interest is extinguished. That is a tragedy.

  **Lin:** Is it? Or is it just a season changing? If you mourn the autumn because it isn't summer, you miss the beauty of the red leaves. Henderson is struggling because he thinks he is a solid thing that is about to be broken. I am trying to show him he is water. Water doesn't break when it pours into the sea.

  **Sarah:** Water doesn't have a wife who misses it. Water doesn't have a thesis left unfinished. You're talking about physics; I'm talking about biography. Thomas Nagel put it best: death is bad because it deprives the subject of the goods of life. It's not the state of being dead that's the problem—we agree, that's nothing. It's the *loss* of the life that would have followed.

  **Lin:** Loss implies an owner. Who is the owner, Sarah? When Henderson dies, the *qi* that knit his bones and breathed his lungs disperses. It goes back into the great block of the universe. To say he is "deprived" is to assume there is a fixed "he" that persists apart from the *qi* to feel the deprivation. But there isn't. There is only the knot, and the untying.

  **Sarah:** The "knot" is a person with rights. If I accept your view, ethics collapses. If there is no fixed self to be harmed, why are we here? Why not pull the plug on everyone? If it's just transformation, murder is just... accelerating the season?

  **Lin:** Don't be reductive. You know that's not what I mean. Zhuangzi drummed on a tub and sang when his wife died. His friend Hui Shi scolded him, just like you. But Zhuangzi realized that grieving as if she were *gone* was ignorant of fate. She wasn't gone. She changed. She went from formless to form, from life to death, like the progression of spring, summer, autumn, winter. If I cry because she is now sleeping in a giant room, I show I don't understand the process. I'm not saying kill people. I'm saying don't make the dying feel like victims of a cosmic mugging.

  **Sarah:** But they *are* being mugged! Look at the asymmetry. We don't dread the time before we were born. Lucretius noted this, Nagel expanded it. The non-existence before birth doesn't bother us. Why? Because there was no subject to be deprived. But the non-existence after death *does* bother us. Why? Because there *is* a subject now, looking forward, who sees the cliff edge. The deprivation is real because the trajectory is interrupted. Henderson has a narrative arc. Cutting it short is a harm, regardless of where the *qi* goes.

  **Lin:** That asymmetry is an illusion of your perspective. You stand in the middle of the timeline and look both ways. But nature doesn't stand in the middle. Once, Zhuangzi found a skull on the road. He asked it: Did you die from war? From shame? From cold? He used the skull as a pillow. That night, the skull came to him in a dream. And do you know what the skull said?

  **Sarah:** That it was happy?

  **Lin:** That the dead have no rulers above and no subjects below. No seasons, no work. Their joy is that of heaven and earth enduring. The skull told him: "Why would I give up this king-like happiness to return to the trouble of human life?" You fear the deprivation of life. The skull suggests life is the deprivation of rest.

  **Sarah:** That's poetic, Lin. It's also convenient for the dead. You can't interview the skull. You can interview Henderson. And he wants to live. Nagel's point isn't that the dead *feel* bad. It's that the *event* of death is bad for them. If I slip into a coma for ten years, I don't feel the time passing. But I have still lost ten years of life. That is a misfortune. Death is a permanent coma. The fact that the subject doesn't exist to register the loss doesn't mean the loss didn't happen.

  **Lin:** But "misfortune" requires a vantage point. If I am the knot in the string, and the knot is untied, where is the string harmed? Nowhere. It is just straight again. You say Henderson loses ten years. I say the universe gains ten years of Henderson-dust. You view the self as a fortress under siege. I view the self as a wave. When the wave falls, does the ocean lose anything?

  **Sarah:** The ocean doesn't care. Henderson cares. And ethics is about caring for the subject, not the ocean. Here is my hardest question for you, Lin. If the self is just a temporary knot, if there is no one there to suffer the harm of deprivation... then who are you comforting?

  **Lin:** I comfort the knot while it is still tied.

  **Sarah:** But if your philosophy is true, the fear is based on a false premise—the premise that there is a permanent self to lose. So your job is to gaslight them into believing they don't exist?

  **Lin:** My job is to help them loosen their grip. The pain isn't in the dying, Sarah. It's in the clinging. You treat death as a theft. Of course they are terrified if they think someone is stealing from them! I treat death as a return. If you hold a handful of sand and squeeze it, it hurts your hand. If you open your hand, the sand falls, and your hand is at peace. I am not telling them they don't exist. I am telling them they are the sand, not the fist.

  **Sarah:** But the sand doesn't have a daughter who needs tuition. The sand doesn't have a book to write. You're dissolving the particular into the general to avoid the pain of the particular. Nagel would say you're confusing the *view from nowhere* with the *view from here*. Ethics happens *here*. In the particular. If I tell a mother her child's death is just "qi transforming," I am insulting the specific value of that child's life. The deprivation is specific. It is *this* laugh, *this* birthday, that will not happen. That is a real hole in the world.

  **Lin:** And if you tell her that death is a terrible theft, a cosmic error that stole her child, you make the universe a hostile place. You make her child a victim. I offer her the sky. You offer her a grave. Which is kinder?

  **Sarah:** Truth is kinder than comfort. And the truth is, we are subjects of a life that can be harmed by cessation. If you deny that, you undermine the very reason we fight to alleviate suffering. Why palliate pain if the body is just temporary *qi*? Why not let it run its course? You only intervene because you acknowledge that the "knot" feels pain. And if the knot feels pain, the untying is a loss of the capacity to feel pleasure. That is deprivation.

  **Lin:** I palliate pain because pain is a blockage of flow. Not because I think the body belongs to someone. But let me press you on your asymmetry. You say we don't fear pre-natal non-existence. But what if I told you that you lived a glorious life a hundred years ago, but had total amnesia? Would you mourn that lost century?

  **Sarah:** Hypothetically? No. Because I have no connection to that subject.

  **Lin:** Exactly. Because the "you" is a construct of memory and continuity. If the continuity is broken, the "you" is gone. So why fear the future break more than the past break? Only because you are standing on the bridge looking forward. But the bridge is made of the same wood as the riverbank.

  **Sarah:** Because the vector of desire points forward. I have projects. I have love directed toward the future. Prenatal non-existence didn't cancel any projects. Death does. That is the asymmetry. It's not about metaphysics; it's about intentionality. Henderson intends to see his grandson graduate. Death frustrates that intention. Frustrated intention is a harm.

  **Lin:** But whose harm is it? If Henderson dies, the intention vanishes with him. There is no one left to *have* the frustrated intention. You are positing a ghost—a subject that hovers over the grave and says, "Hey, I was supposed to do that." Zhuangzi would say that ghost is the source of the suffering, not the death.

  **Sarah:** I'm not positing a ghost. I'm positing a counterfactual truth. It is true that *if* Henderson had not died, he would have seen his grandson. It is true that his life is worse for not containing that event. We can say that is bad for him without him needing to be around to read the review.

  **Lin:** You ethicists. You want to write the review of the life while the audience is leaving the theater.

  **Sarah:** Someone has to. If we don't assert that death is a harm, we lose the leverage to make death dignified. We lose the funding for hospice, the research for cures. We need the fear, Lin. The fear is the engine of care.

  **Lin:** And the fear is the poison that kills the patient before the disease does. I have sat with people who died smiling because they realized they were not leaving anything. They were becoming everything. You want to keep them fighting until the last second. I want to help them lay down the sword.

  **Sarah:** And if they don't want to lay it down? If their will to live is the very thing that makes them who they are? Is it Daoist to override that will with your metaphysics?

  **Lin:** *Pause.* No. It is not.

  **Sarah:** Then your philosophy has a limit. It works for the sage who has loosened the knot. It doesn't work for the man who is terrified of the dark. For him, death *is* a deprivation. To tell him otherwise is to deny his reality.

  **Lin:** And your philosophy has a limit, Sarah. It works for the living who judge the life. It doesn't work for the dying who must undergo the death. To tell him he is a victim of deprivation is to deny his transformation.

  *Silence settles between them. The vending machine buzzes, a harsh electric sound.*

  **Sarah:** So. Henderson. He's awake. He's asking for you. He's asking for me.

  **Lin:** He's asking for the knot to be held, and the string to be trusted.

  **Sarah:** He's asking for more time. And I have to tell him there isn't any. That is a harm I have to witness.

  **Lin:** And I have to sit with him while he realizes that "time" is the thing he's holding too tight.

  **Sarah:** *She stands up, picking up her cold coffee.* You know, Nagel admits that the fear of death is largely instinctual. It might not be rational. But it's human.

  **Lin:** *He stands as well.* And Zhuangzi admits that when his wife died, he cried at first. Before he remembered the seasons. We are human first, Sarah. Sages second.

  **Sarah:** Let's go. You take the metaphysics. I'll take the paperwork.

  **Lin:** And together, maybe he can die whole.

  *They walk out of the break room, the lights flickering off behind them, leaving the empty cups on the table.*
