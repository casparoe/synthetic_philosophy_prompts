answer: |-
  Your sister has accidentally stumbled into one of the oldest and deepest debates in philosophy. She isn't just giving you a hard time; she is articulating a position known as **hard determinism** (or specifically, an argument often associated with the philosopher Galen Strawson called the "Basic Argument").

  So, to answer your question: **No, this is not a dead-end thought.** It is a legitimate philosophical puzzle that has troubled thinkers for centuries. However, while your sister might be *metaphysically* correct, she is likely *practically* wrong.

  Here is a breakdown of why her point stings, why it might not tell the whole story, and why you should absolutely keep feeling proud of your workouts.

  ### 1. Where your sister is right (The "Ultimate Responsibility" Problem)
  Her argument is logically sound. To take "ultimate" credit for an action, you would have to be the cause of yourself.
  *   You didn't choose your genes (which influence impulse control, energy levels, etc.).
  *   You didn't choose your childhood environment (which taught you habits or values).
  *   Even the "choice" to start working out came from a brain state that existed *before* you made the choice.

  If you trace the chain of causality back far enough, everything you do is the result of things you didn't choose. Therefore, you cannot be the "unmoved mover" of your life. In a strict, cosmic sense, you are right: you didn't pick the hand you were dealt.

  ### 2. Where the argument hits a wall (Compatibilism)
  The problem with your sister's view is that it uses a "God's eye view" of the universe to judge human experience. It assumes that for credit to be real, it must be *magical* (i.e., free from all prior causes).

  Most modern philosophers and psychologists lean toward **compatibilism**. This is the idea that determinism (things have causes) and free will (we make choices) can coexist.
  *   **You are the mechanism:** Yes, your discipline is a result of your genetics and upbringing. But *you* are the sum of your genetics and upbringing. When "you" make a choice, it isn't an external force making it for you. It is *you* functioning as designed.
  *   **Internal vs. External:** If someone held a gun to your head and forced you to run, that's external coercion. If your brain chemistry and values compelled you to run, that is *internal* motivation. The distinction matters. The fact that the motivation came from inside *your* system is exactly why you get the credit.

  ### 3. Why praise and blame still matter (The Practical View)
  Even if we accept your sister's premise that "nothing is truly chosen," the system of praise and blame is still essential for human society.
  *   **Reinforcement:** Feeling proud releases dopamine. It reinforces the behavior. If you decide "I get no credit," you remove the psychological reward that helps keep the habit going.
  *   **Prediction:** We praise people who work out because we want to predict that they will continue to do so, and we want others to emulate them. Whether that discipline was "chosen" in a metaphysical sense doesn't change the fact that it is a rare and valuable trait *in you*.
  *   **Identity:** You are building an identity as a disciplined person. Whether that identity was "pre-destined" or not, it is now a factual part of who you are.

  ### 4. The "Luck" Counter-Argument
  There is a concept called "constitutive luck." Yes, you got lucky with the genes/upbringing that made discipline possible. But **luck is not a zero-sum game.**
  *   Two people can have similar genetics. One works out, one doesn't.
  *   Two people can have difficult upbringings. One uses it as fuel, one uses it as an excuse.

  Even if the *capacity* for discipline was given to you, the *execution* of it required navigating your specific daily obstacles, fatigue, and moods. You still had to show up. The "choice" might have been determined, but it was still a choice that passed through your consciousness.

  ### The Verdict
  Your sister is pointing out that you aren't the **author** of your own existence. She is right.
  But you are the **protagonist** of your own life.

  If you read a great book, you know the author was influenced by their life, their history, and their biology. Does that make the book less good? Does it mean the author shouldn't sign the cover? No. The book is still the output of that specific person.

  **Don't let a metaphysical technicality steal a psychological victory.**
  The feeling of pride isn't a claim that you created yourself out of thin air. It is a recognition that your current configuration of mind and body is successfully executing a difficult task. That is worth celebrating, regardless of where the components came from.

  Keep working out. Your sister can debate the philosophy; you keep the gains.
