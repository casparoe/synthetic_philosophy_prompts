  **Move 1 (Theo):** Score 2. Theo accurately reconstructs the standard derivation of Fitch's Paradox. He correctly identifies the core tension: the Knowability Principle ($\forall p(p \to \Diamond Kp)$), combined with classical logic and minimal epistemic axioms (factivity, distribution), entails Omniscience ($\forall p(p \to Kp)$).

  **Move 2 (Nadia):** Score 1. Restricting the domain of the Knowability Principle is a legitimate research program (e.g., Neil Tennant's "Cartesian" restriction), but Nadia's initial justification ("it causes trouble") is vulnerable to the charge of being *ad hoc*. Without a principled reason why those statements aren't truth-apt, this looks like special pleading.

  **Move 3 (Theo):** Score 2. Theo correctly presses the *ad hoc* objection. A philosophical principle cannot simply exclude its counterexamples without an independent criterion. He is also right that the logical machinery used in the proof (factivity, conjunction) is neutral, so the fault must lie with KP or the logic, not just specific instances.

  **Move 4 (Nadia):** Score 2. Nadia deploys the two strongest defenses in the literature. First, she offers a principled restriction class (epistemic statements). Second, and more importantly, she invokes Intuitionistic Logic. It is well-established (Dummett, Williamson) that Fitch's derivation of Omniscience requires Classical Logic; in Intuitionistic Logic, anti-realists can deny unknown truths exist without affirming all truths are known.

  **What Both Are Missing:**
  Both friends assume "Anti-Realism" is synonymous with the unrestricted Knowability Principle. Many contemporary anti-realists actually abandon KP precisely because of Fitch, opting for a theory of meaning (verificationism) rather than a theory of truth (knowability). Additionally, they gloss over the cost of Nadia's Intuitionistic solution: revising logic to save anti-realism requires accepting that *all* discourse (including about the past or remote physical objects) obeys intuitionistic rules, which is a massive metaphysical commitment beyond just epistemology. Finally, they don't distinguish between *actual* knowability (humans) and *idealized* knowability (any possible knower); Fitch's paradox targets the idealized version, so appealing to human limitations (as Theo hints in Move 1) doesn't actually solve the logical problem.
