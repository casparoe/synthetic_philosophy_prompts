answer: |-
  **Elena:** You're assigning Strawson as if he settled the debate, Marcus. But your students are walking away with a caricature. They think Strawson's point is merely that resentment is a "natural fact," so metaphysics doesn't matter. That's not the argument. The argument is that the reactive attitudes are constitutive of interpersonal relationships. To ask if those attitudes are justified from outside the practice is to ask what justifies being human.

  **Marcus:** I agree the slogan is lazy. But Strawson's dissolution relies on a confidence I don't share. He claims his framework of excuses and exemptions handles all the legitimate worries. If you weren't yourself, or didn't know what you were doing, we take the objective attitude. Fine. But he assumes that causal determination doesn't count as an exemption. That's where the normative question survives.

  **Elena:** Because you're still looking for a metaphysical grounding for desert that doesn't exist. Strawson shows us that responsibility isn't a property of agents in isolation; it's a feature of our commerce with one another. Determinism doesn't threaten that commerce unless it makes interaction impossible. It doesn't.

  **Marcus:** Consider the case Gary Watson raised regarding Robert Harris. Harris executed two teenagers for the thrill of it. But when we learn the horrifying causal detail of his upbringing—severe abuse, neurological damage—our impulse shifts. Watson points out that this information pushes us toward the objective attitude. We see him as a victim of forces. Yet, our practice demands we hold him answerable. Strawson's machinery says: unless he's exempt (insane, coerced), stay in the participant stance. But the causal history suggests he *is* exempt in a moral sense, even if not a legal one.

  **Elena:** But Strawson would say that's a category error. You're treating causal history as an exemption when it's merely an explanation. An exemption requires a localized incapacity for understanding or goodwill. Harris understood what he was doing. The fact that his character was formed by prior causes doesn't remove him from the moral community. To treat him as objectively managed is to deny his standing as a person.

  **Marcus:** Is it? Or is it recognizing that resentment is only fitting if the agent had a fair opportunity to be otherwise? Strawson dismisses the "fair opportunity" requirement as metaphysical nonsense. But look at the tension Watson identifies. The more we understand the causal determination, the less *fitting* resentment seems, yet the more we cling to it. Doesn't that suggest our practice is out of sync with the facts Strawson asks us to ignore?

  **Elena:** It suggests the practice is painful, not that it's unjustified. You're assuming there's a view from nowhere where we can judge whether resentment is "fitting" independent of our concerns. But fittingness is internal to the practice. Resentment is a protest against a quality of will. Harris displayed ill will. The fact that his ill will was caused doesn't change the quality of the will itself.

  **Marcus:** It changes the *ownership* of the will. If the ill will is the product of a causal chain he didn't initiate, why is *he* the proper target of the protest? Strawson says asking this is confused. I say it's the only question that matters for basic desert. You grant me the descriptive psychology—we do feel resentment. I deny that this settles the normative issue. We used to feel resentment toward witches. The fact that it was a natural reaction didn't make it just.

  **Elena:** The witch case is different. There was a factual error about causality. Here, the facts are agreed upon. The disagreement is about whether the demand for "ultimate responsibility" is intelligible. I say it's not. You want a kind of responsibility that survives the removal of all causal determination. That's not responsibility; it's magic. Strawson saves responsibility by anchoring it in what we actually care about.

  **Marcus:** He saves a practice, Elena, not necessarily a moral truth. If determinism is true, holding Harris responsible involves inflicting suffering on someone who could not have done otherwise. Strawson tells us to stop looking at the "could not have done otherwise" part because it leads to a void. But the skeptic looks into the void and sees unfairness. You say the normative question is a confusion. I say it's a demand for justification that Strawson sidesteps.

  **Elena:** It's not a sidestep; it's a dissolution. The justification for holding responsible is the value of the relationships involved. If we adopt the objective attitude universally, we lose love, friendship, and collaboration. We can't sustain that view. So, the justification is pragmatic, yes, but also transcendental. It's a condition of our form of life.

  **Marcus:** And if that form of life rests on a fiction? If the "quality of will" is ultimately just the output of a deterministic machine, then our participant stance is a useful illusion. Strawson assumes the attitudes are revelation. I suspect they might be insulation. We protect ourselves from the truth of causality by maintaining the practice of blame.

  **Elena:** Then you're asking us to abandon our humanity for the sake of a metaphysical consistency that offers no alternative value. What do you put in place of resentment? Management? Therapy? That's the objective attitude. It treats people as objects to be fixed.

  **Marcus:** I'm not advocating universal objective attitude. I'm saying we should acknowledge the tension. We can modify our practices without abandoning relationships. We can hold people accountable without believing they deserve suffering in a basic, desert-laden sense. Strawson blocks this move. He says if you're in the practice, you're committed to the metaphysics of the participant stance.

  **Elena:** He says you're committed to the *norms* of the participant stance. And those norms don't include the requirement for contra-causal freedom. You're smuggling in a requirement he successfully argued we never actually use. When you blame your friend, do you check their causal history?

  **Marcus:** When my friend hurts me, no. When the state executes a man like Harris, yes. And when we check it, and see the determination, the blame feels different. It feels like vengeance. Strawson tells us to ignore that feeling. I think we should listen to it.

  **Elena:** Listening to it leads to paralysis. We can't live as skeptics.

  **Marcus:** Maybe. But we can live without claiming our resentment is metaphysically justified. Strawson wants to have it both ways: to say the metaphysics doesn't matter, while relying on our practices to do the normative work. I think the metaphysics matters precisely because it undermines the fairness of those practices.

  **Elena:** And I think you're chasing a ghost of fairness that requires agents to be uncaused causes. We won't find it.

  **Marcus:** Then we're left with a practice we can't fully justify, facing a truth we can't fully inhabit.

  **Elena:** Then we're left with being human. Which is all Strawson ever claimed we had.
