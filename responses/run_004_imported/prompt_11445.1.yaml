answer: |-
  First off, congratulations: you have personally encountered one of the most famous monsters in social choice theory. It is genuinely thrilling when abstract math bleeds into real life like that. Your lawyer friend is right—this is the **Doctrinal Paradox** (or Discursive Dilemma), and the List-Pettit theorem proves that what happened to you wasn't a fluke. It was a structural inevitability waiting for the right configuration of opinions.

  Here is the intuitive walkthrough of why this happens, mapping the abstract axioms back to your promotion committee, and a take on which voting method is "less wrong."

  ### 1. The Smoking Gun: The Vote Matrix
  To see why this isn't a coincidence, we need to reconstruct the only specific pattern of votes that creates this paradox.

  You have 3 panelists (A, B, C).
  The Rule: **Promote** $\iff$ **Technical** AND **Leadership**.

  For the paradox to occur (Majority says Pass on Tech, Majority says Pass on Leadership, but Majority says **No** on Promote), your panelists *must* have voted like this:

  | Panelist | Technical Bar | Leadership Bar | **Overall Promote?** |
  | :--- | :---: | :---: | :---: |
  | **Person A** | ✅ Pass | ❌ Fail | **❌ No** |
  | **Person B** | ❌ Fail | ✅ Pass | **❌ No** |
  | **Person C** | ✅ Pass | ✅ Pass | **✅ Yes** |
  | **Majority** | **✅ Pass** | **✅ Pass** | **❌ No** |

  **Look closely at the "No" votes.**
  *   **On the Bars:** The dissent is *distributed*. Person A knocks out Leadership. Person B knocks out Technical. Because they are knocking out different things, the "Pass" votes accumulate to form a majority on each bar individually.
  *   **On the Outcome:** The dissent *converges*. Both Person A and Person B vote "No" on the promotion. Even though they disagree on *why* (A cares about leadership, B cares about technical), they agree on the *result*.

  **The Intuition:**
  The paradox happens because **the intersection of two majorities is not necessarily a majority.**
  *   The "Technical Majority" is {A, C}.
  *   The "Leadership Majority" is {B, C}.
  *   The only person in *both* majorities (who actually satisfies the AND condition) is {C}.
  *   One person is not a majority.

  So, when you vote issue-by-issue, you are effectively allowing Person A to speak for the committee on Technical, and Person B to speak for the committee on Leadership. But when you vote up-or-down, Person A and B unite to outvote Person C.

  ### 2. Why is this Structural? (Mapping the Axioms)
  You asked if there is a "minimal structural fact" that guarantees this divergence is always possible. Yes. List and Pettit proved that if you want a voting system that satisfies three seemingly reasonable conditions, you will crash into this paradox whenever propositions are logically connected (like $P \iff T \land L$).

  Here is how those dry academic terms map to your Tuesday meeting:

  1.  **Universal Domain (The "Honesty" Rule):**
      *   *Abstract:* The system must accept any logically consistent set of individual judgments.
      *   *Your Committee:* You couldn't tell Person A, "You aren't allowed to think Technical is good but Leadership is bad." As long as their internal logic holds (If T=No, then Promote=No), their opinion is valid. The paradox relies on the fact that rational people can prioritize different criteria.
  2.  **Anonymity (The "Equality" Rule):**
      *   *Abstract:* Every voter counts equally.
      *   *Your Committee:* You are a 3-person panel of equals. You don't have a "Chair" whose vote breaks ties or counts double. If Person C was the Boss and could override A and B, the paradox disappears. But in a flat democracy, this tension exists.
  3.  **Systematicity (The "Consistency" Rule):**
      *   *Abstract:* The group decision on *any* proposition is determined by the same aggregation rule (e.g., majority rule) applied to individual judgments on that proposition.
      *   *Your Committee:* You used Majority Rule for Technical. You used Majority Rule for Leadership. You used Majority Rule for Promotion. You treated every question the same way.

  **The Impossibility:**
  List-Pettit shows that if the propositions are logically connected (like your promotion rule), you **cannot** have Universal Domain, Anonymity, *and* Systematicity all at once while guaranteeing the collective output is logically consistent.
  *   Your committee had Universal Domain (honest opinions).
  *   You had Anonymity (3 equals).
  *   You had Systematicity (Majority rule on everything).
  *   **Result:** Collective Inconsistency (Pass + Pass $\neq$ Promote).

  To fix it, you have to break one of those three.

  ### 3. Premise-Based vs. Conclusion-Based: Which is "Less Wrong"?
  This is the heart of the "Discursive Dilemma" debate. Since you can't have it both ways, which procedure should you have used?

  #### Option A: Conclusion-Based Procedure (The Up-or-Down Vote)
  *   **Method:** Ignore the bars. Just vote "Promote: Yes/No."
  *   **Result in your case:** Do Not Promote.
  *   **The Philosophy:** This prioritizes **Democratic Legitimacy**. The majority of the committee explicitly said "No." To promote the candidate anyway feels like overriding the will of the voters.
  *   **The Downside:** It's a "Black Box." If you look at the record later, you don't know *why* the promotion was rejected. Was it technical? Leadership? Bias? It also allows for "logically inconsistent" precedents. (e.g., Next week you might reject a candidate who passed both bars just because two people felt grumpy, undermining the written promotion policy).

  #### Option B: Premise-Based Procedure (The Issue-by-Issue Vote)
  *   **Method:** Vote on the bars. The outcome is mathematically derived from the bars.
  *   **Result in your case:** Promote.
  *   **The Philosophy:** This prioritizes **Reasoned Consistency**. It forces the committee to stick to the agreed-upon rules ($P \iff T \land L$). It ensures that the *reasons* for the decision are publicly validated by the majority.
  *   **The Downside:** It can feel undemocratic. As you saw, a majority of people (A and B) voted against the promotion, yet the candidate gets promoted. Person A and B are being forced to endorse an outcome they explicitly rejected.

  #### My Take: Which is the "Less Wrong" Fix?
  For a **promotion committee** (or a court of law), the **Premise-Based Procedure (Issue-by-Issue)** is almost always the superior choice.

  Here is why:
  1.  **Accountability:** In a professional context, *reasons* matter more than raw headcounts. If you promote someone, you need to be able to say, "They met the standards." If you use the Conclusion-Based vote, you might end up rejecting someone who clearly met the standards just because of interpersonal dynamics or hidden biases that get bundled into the "No" vote.
  2.  **Policy Integrity:** Your company has a rule: "Clear both bars." If you use the Conclusion-Based vote, you are effectively allowing the committee to rewrite the rule on the fly for specific candidates. That creates legal risk and inconsistency over time.
  3.  **The "Honest Dissent" Problem:** In your specific case, Person A and Person B were essentially saying, "I don't care about the other bar, this one failure is enough for me to say No." The Premise-Based vote respects their specific concern (A protects the Leadership standard, B protects the Technical standard) without letting them veto the whole process based on a single criterion.

  **However,** there is one catch. The Premise-Based approach only works if the criteria (Technical/Leadership) are **objective enough**. If "Leadership" is totally subjective, then voting on the premise is just voting on the conclusion in disguise.

  ### Summary
  You didn't experience a glitch; you experienced the limits of collective rationality.
  *   **Why it happened:** The "No" votes were distributed across the premises but converged on the conclusion.
  *   **Why it's inevitable:** You cannot have equal voters, free opinions, and majority rule on connected logic without sometimes breaking consistency (List-Pettit).
  *   **The Fix:** Stick with the **Premise-Based (Issue-by-Issue)** vote for promotions. It feels weird to promote someone the majority voted against, but it protects the integrity of the *standards* over the whims of the *voters*. In a governance context, the rules should rule the people, not the other way around.

  Next time this comes up, you can drop "List-Pettit" at the table and suggest that the committee formally adopt a **Premise-Based Procedure** in its charter to avoid the ambiguity. It turns a confusing awkwardness into a feature of your governance design.
