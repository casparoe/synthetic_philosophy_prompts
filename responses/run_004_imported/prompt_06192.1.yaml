answer: |-
  **MEMORANDUM**

  **TO:** Annual Juried Exhibition Selection Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24
  **SUBJECT:** Procedure for Balloting on Installation Piece [ID/Title]

  **Purpose**

  This memo outlines a recommended procedure for handling the ballots of the two jurors who were unable to attend the mandatory walkthrough due to the transit strike. As we prepare for Friday's final meeting, we must resolve whether these jurors will cast votes on the sound-and-light installation based on the documentary record, or record abstentions.

  Our charter requires all jurors to "give due consideration to every work in competition." It does not explicitly define the conditions under which consideration is valid when physical presence is impossible. The goal of this recommendation is to honor the spirit of the charter, maintain the disciplinary balance intended by the jury's composition, and uphold the integrity of our aesthetic judgment.

  **The Objection Regarding Direct Encounter**

  The argument for abstention rests on a significant principle: that installation art is inherently experiential. A photograph of a space is not the space; a recording of sound is not the acoustic environment. To judge the work solely on documentation risks evaluating the *record* of the work rather than the work itself. This concern is valid. If we treat documentation as a perfect substitute for presence, we devalue the specific nature of time-based and spatial media. Two members of the committee have rightly pointed out that a ballot cast without this direct encounter may not constitute a true aesthetic judgment.

  **The Necessity of Disciplinary Expertise**

  However, excluding the votes of our sculpture and sound art specialists presents a different risk. The jury was structured to include these specific disciplines precisely to ensure that works outside painting and photography are evaluated by peers with relevant technical and aesthetic frameworks. 

  If the sound and sculpture experts abstain, the fate of a major sound installation rests entirely with jurors specializing in static visual media. While our colleagues in painting and photography are capable critics, they lack the specific training to evaluate the technical execution and artistic intent of sound sculpture, even when viewing it in person. To remove their input now is to effectively disqualify the work from the competition, as it cannot be fairly assessed without that expertise.

  Furthermore, "due consideration" need not be synonymous with "physical presence." While direct encounter is the ideal, specialized training allows a juror to extract critical aesthetic data from documentation that a non-specialist cannot. A sound artist can evaluate the spatial mix and fidelity from an audio recording in a way a non-specialist cannot. In this specific context, their expertise bridges the gap between the documentation and the work's intent.

  **Recommendation**

  To balance these competing concerns, I recommend that the two absent jurors **cast full votes**, subject to the following procedural conditions:

  1.  **Review Period:** The absent jurors will be provided with the complete documentary file (high-res audio, walkthrough video, lighting plots, and written notes) by Thursday at 5:00 PM. They are asked to review this material prior to Friday's meeting.
  2.  **Annotated Ballots:** Their ballots for this specific piece will be marked *"Reviewed via Documentation."* This ensures transparency in our permanent records without diminishing the weight of their vote.
  3.  **Discussion Protocol:** At Friday's meeting, the absent jurors will offer their assessment *before* the jurors who attended the walkthrough. This prevents their analysis from being anchored by the descriptions of those who were present, ensuring their judgment arises from their own interpretation of the evidence.
  4.  **Consensus Check:** If the vote on this piece is split (e.g., 3 for, 2 against), the minutes will reflect whether the deciding votes came from the "Documentation" group or the "Walkthrough" group. This does not change the outcome, but it provides the department with context should the acquisition be questioned later.

  **Conclusion**

  This approach acknowledges that while documentation is not a perfect substitute for experience, it is a sufficient basis for judgment when handled by specialists. It allows us to adhere to the charter's requirement for consideration, preserves the disciplinary diversity essential to a fair jury, and respects the integrity of the work by ensuring it is judged by those best equipped to understand it.

  I look forward to finalizing this procedure on Friday so we can meet our catalog deadline.
