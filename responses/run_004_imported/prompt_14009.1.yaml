answer: |-
  You are remembering this remarkably well. Your intuition is correct: the standard "genius forced to peddle horoscopes for beer money" narrative does Kepler a disservice. He wasn't just a reluctant practitioner; he was a radical reformer who tried to dismantle astrology from the inside and rebuild it on what he considered "physical" grounds.

  Here is the breakdown you need for your piece, fact-checked and structured for that compare-and-contrast you're looking for.

  ### 1. The Fact Check
  *   **The Pamphlet:** You are spot on. It is *Tertius Interveniens* ("Thirdly Intervening"), published in **1610**. The full title is wonderfully bureaucratic: *Tertius Interveniens, das ist: Drittens drein geschritten...* It was written as a mediation between two extremes: the "superstitious" astrologers who predicted everything, and the "atheistic" skeptics (often theologians) who wanted it banned entirely. Kepler positioned himself as the "third man" walking in between.
  *   **Wallenstein:** Yes, Kepler cast a horoscope for Albrecht von Wallenstein in **1608**, well before Wallenstein became the supreme commander of the Imperial armies. Later, when Wallenstein was at the height of his power (around 1625), he summoned Kepler to cast a *second* horoscope (or analyze the first). Kepler was wary; Wallenstein had a reputation for eliminating people who gave him bad news. Kepler's private letters reveal he was terrified but also cynical about the process.

  ### 2. Kepler's Astrology vs. Mainstream Ptolemaic Astrology
  This is the core of your "well, actually." In the early 17th century, mainstream astrology was **Scholastic/Ptolemaic**. Kepler's was **Harmonic/Physical**.

  | Feature | Mainstream (Ptolemaic/Scholastic) | Kepler's Reform |
  | :--- | :--- | :--- |
  | **The Mechanism** | **Occult Qualities.** Planets emit rays carrying specific "virtues" (Mars is hot/dry, Venus is moist). The Zodiac signs act as filters or lenses for these rays. | **Geometry & Light.** Planets emit light, but the *influence* comes from the **angles** (aspects) between them. It is not occult magic; it is geometry acting on the soul. |
  | **The Zodiac Signs** | **Causal.** Aries *makes* things hot; Taurus *makes* things earthy. The constellations themselves hold power. | **Arbitrary.** Kepler called the 12 signs a "human invention," a "calendar of the Arabs." He rejected them as having no physical basis. |
  | **The Houses** | **Crucial.** The 12 Houses (divisions of the sky relative to the horizon) dictate *where* in life an event happens (e.g., 7th house = marriage). | **Rejected.** Kepler viewed the Houses as purely mathematical points with no physical reality. He largely discarded them. |
  | **The Aspects** | **Important, but traditional.** Conjunction, Sextile, Square, Trine, Opposition. Based on tradition and dignity. | **The Only Thing That Matters.** Kepler kept these five, but redefined them. They are valid only because they correspond to **musical harmonies** and **Platonic solids**. |
  | **The Target** | **The Individual.** The stars directly imprint the fate/temperament of the person born under them. | **The *Anima Terrae* (Earth-Soul).** This is the big twist. The aspects don't hit *you*. They hit the **Soul of the Earth**. The Earth-Soul reacts (like a reflex), creating weather, which then affects human humors. |

  **The Justification:**
  Kepler was trying to save astrology from the charge of "magic." If planets shoot invisible rays that change your personality, that's sorcery to a mechanistic philosopher. But if planets form geometric angles that resonate with the Earth's soul (which perceives geometry instinctively, like a ear hears music), causing weather patterns that influence human biology? To Kepler, that was **physics**.

  He wrote in *Harmonices Mundi* (1619) that the Earth is a living animal. When the planets align in a "harmonic" ratio (like a perfect fifth in music), the Earth-Soul "wakes up" and stirs the atmosphere. Humans, being sensitive to weather (barometric pressure, humidity), feel the shift. It removes the "fate" and replaces it with "meteorological predisposition."

  ### 3. The Coherence Question: Sincere Theorist or Mercenary?
  This is where it gets messy, and where your article can find some real bite. There is a genuine, unresolved tension here.

  **The Tension:**
  Kepler's theory (*Tertius Interveniens*, *Harmonices Mundi*) essentially **neutered** astrology's predictive power. If the Earth-Soul reacts to geometry, and humans react to weather, you can predict general dispositions or weather trends. You *cannot* predict that "The King will die on Tuesday" or "You will marry a banker." That requires the Houses and Signs he rejected.

  **The Mercenary Reality:**
  However, patrons (like Wallenstein or Emperor Rudolf II) did not pay for "general meteorological predispositions." They paid for specific predictions.
  *   **The Wallenstein Incident:** In his private correspondence (specifically a letter to Herwart von Hohenburg), Kepler admits that when casting Wallenstein's horoscope, he filled in the gaps. He knew his harmonic theory couldn't generate the specific details Wallenstein wanted. So, he used traditional (Ptolemaic) rules to flesh out the reading, privately mocking them as "old wives' tales" while publicly presenting them as fact.
  *   **The "Configurational" Excuse:** Kepler developed a coping mechanism. He argued that astrology offers **inclinations, not compulsions** (*sidera inclinant, non necessitant*). He told patrons that the stars show what *might* happen if they don't use their free will. This protected him if the prediction failed (you didn't resist the impulse!) and allowed him to take the money.

  **Did he resolve it?**
  No. He lived in a state of cognitive dissonance that was typical for the transition from Renaissance Hermeticism to Enlightenment Science.
  1.  **Publicly:** He defended astrology as a legitimate science (to keep his job as Imperial Mathematician).
  2.  **Privately:** He mocked the "superstitious" elements he was forced to use to get paid.
  3.  **Intellectually:** He genuinely believed the *core* (aspects/harmony) was true, even if the *application* (horoscopes) was corrupted by the need to please patrons.

  ### 4. Angles for Your Piece (The "Pop Culture" Hook)
  If you are writing about Co-Star and TikTok, Kepler is a perfect historical mirror.

  *   **The "Scientization" of Mysticism:** Just as Kepler tried to strip astrology of its "magic" and ground it in geometry/physics to make it palatable to a scientific age, modern astro-tech tries to strip astrology of "woo" and ground it in data, algorithms, and psychology.
  *   **The Vague Specificity:** Kepler's "inclinations, not compulsions" is the ancestor of the modern horoscope disclaimer. It allows the practitioner to maintain intellectual integrity while selling certainty.
  *   **The Earth-Soul vs. The Algorithm:** Kepler's *Anima Terrae* is a poetic way of saying "we are embedded in a system larger than us." Modern apps replace the Earth-Soul with "The Data." Both claim to know you better than you know yourself based on external coordinates (planetary positions vs. birth time/data points).

  ### Summary for your "Well, Actually"
  Kepler wasn't a hypocrite; he was a **reductionist**. He tried to reduce astrology to the only parts he thought were physically real (geometry and light) and discard the rest (signs and houses). But the market demanded the parts he discarded. So, he became a man who preached a purified, physical astrology in his books, while selling a diluted, traditional astrology to pay the rent. He didn't resolve the tension; he managed it, much like a modern influencer might reconcile "authentic self-expression" with "brand deal algorithms."

  **One specific quote to look up:**
  In *Tertius Interveniens*, Kepler compares the astrologer to a wife who speaks foolishly to keep her husband happy, while knowing the truth. He writes: *"The astrologer is like the wife who... must accommodate herself to the humor of her husband."* That is the money shot for your tension argument.
