answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I have the distinct honor of being the only person in the wedding party who does not hold a PhD in philosophy. I mention this because, when [Bride] asked me to give this toast, I realized that half of you are going to be listening to my syntax more than my sentiment. So, I spent the last week reading David Lewis's *Convention*. I wanted to make sure I got the framework right.

  And honestly, looking at [Bride] and [Partner], the Lewisian fit is uncanny.

  If we look at this marriage through Lewis's eyes, what we see is a coordination equilibrium. You two have solved a recurrent coordination problem. You prefer to be on the same side of the road as one another, regardless of which side that is. The arrangement is, in Lewis's terms, "arbitrary." Not in the sense that it's random, but in the sense that another arrangement *could* have worked. [Bride] could have married someone else; [Partner] could have married someone else. But you found this equilibrium. And now, through common knowledge, you both know that you both know that you're in this together. You conform to the expectation of the other, because you prefer conformity over mismatch.

  It's a beautiful model. It explains stability. It explains why you drive on the right side of the road.

  But here is the problem. And I know, [Bride], you know this better than anyone. Your dissertation used Brian Skyrms to extend exactly this point. Lewis's account is brilliant at explaining how we coordinate, but it is notoriously thin on explaining why we feel *obligated*.

  If I drive on the wrong side of the road, I am dangerous. I am making a mistake. But if I show up late to our anniversary, or if I fail to care for you when you are sick, I am not just making a coordination error. I am not just lowering our payoff matrix. I am *wronging* you.

  Lewis's conventions are held together by self-interest. I follow the convention because it benefits me to do so, given that you are doing it. But marriage cannot rest on self-interest. If marriage were merely a Nash equilibrium, it would dissolve the moment the payoffs shifted. It would dissolve when one of you gets sick, or loses a job, or changes in a way that makes "conformity" difficult. If the only reason you stay together is because it's the most efficient solution to a coordination problem, then you don't actually owe each other anything. You're just maximizing utility.

  And yet, we know that's not what this is.

  The truth is, [Bride] and [Partner], you are not just maintaining an equilibrium. You are changing the game.

  A real marriage isn't about two self-interested agents agreeing to coordinate for mutual benefit. It is about two people deciding that the distinction between "my interest" and "your interest" is no longer the primary metric for decision-making. It is moving from a coordination convention to a joint commitment.

  When Lewis talks about convention, he asks, "What do I expect you to do?" But in a marriage, the question isn't about expectation. It's about entitlement. You have given each other the right to hold you accountable, not because it is efficient, but because you belong to one another. The "arbitrariness" of the beginning—the chance meeting, the specific timing—falls away. What remains is not a convention that you *could* have changed, but a promise that you *won't*.

  So, to the guests from the department: Yes, this is a stable equilibrium. But it is stable not because of the payoffs, but because of the people.

  And to [Bride] and [Partner]: May your coordination be seamless. But more importantly, may your obligations run deeper than any game theory can model. May you owe each other everything, not because it is rational, but because it is love.

  To the happy couple.
