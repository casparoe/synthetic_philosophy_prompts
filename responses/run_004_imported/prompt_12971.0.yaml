prompt: |-
  One of my oldest friends, whose dissertation used the evolutionary game theory associated with Brian Skyrms to extend David Lewis's account of convention -- explaining how social norms, not just simple coordination conventions like which side of the road to drive on, become entrenched -- is getting married in three weeks and has asked me, the only member of the wedding party without a philosophy PhD, to give the toast. Half the reception will be people from her graduate program, and I have spent the past week reading enough Lewis to know they will notice if I get the framework wrong or use it lazily. Write me a five-minute toast that opens by describing the couple the way Lewis would: a coordination equilibrium, arbitrary in that other arrangements would have solved things just as well, held together by common knowledge -- then turns on the standard objection to Lewis, that mere self-interested coordination cannot explain why breaking a convention feels like wronging someone rather than merely making a mistake, so that it ends up saying something true about what they actually owe each other instead of just showing off the framework.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding reception toast.
      *   **Audience:** Half philosophers (specifically familiar with David Lewis's *Convention* and Brian Skyrms's evolutionary game theory), half non-philosophers.
      *   **Speaker:** The only member of the wedding party *without* a PhD in philosophy.
      *   **Subject:** The bride (an old friend) and her partner.
      *   **Key Content Requirements:**
          *   Open with a Lewisian description of the couple (coordination equilibrium, arbitrary, common knowledge).
          *   Address the standard objection to Lewis (norms vs. mere coordination, the feeling of "wronging" vs. "mistake").
          *   Pivot to something true about their relationship (obligation/commitment beyond self-interest).
          *   Tone: Witty, respectful, intellectually rigorous but accessible, emotional payoff.
          *   Length: Approximately 5 minutes (roughly 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy:**
      *   *David Lewis (Convention):* Conventions are solutions to coordination problems. They are arbitrary (we could drive on the left or right, just need to agree). They persist because of common knowledge and mutual expectation. If I expect you to do X, and you expect me to do Y, and we both prefer X/Y over mismatch, we stick to it.
      *   *The Bride's Work (Skyrms/Lewis extension):* She worked on how *social norms* (moral weight) evolve from simple coordination. Skyrms uses evolutionary game theory to show how signaling and norms stabilize.
      *   *The Objection (Margaret Gilbert, Michael Bratman, etc.):* Lewis's account is too thin. If I drive on the wrong side, I'm dangerous/stupid, but I haven't necessarily *wronged* you in a moral sense. Marriage involves obligations that feel like rights/claims, not just prudential coordination. Breaking a promise in marriage feels like a betrayal, not just a coordination failure.
      *   *The Pivot:* Marriage isn't just a Nash Equilibrium where we stay together because it's the best payoff. It's a commitment where the payoffs change, or where the obligation exists *even when* the coordination fails.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the unique position (non-philosopher among philosophers). Set the stage.
      *   **The Lewisian Opening:** Define the couple as a coordination problem solved. Use the "driving on the road" analogy. Mention "arbitrariness" and "common knowledge."
          *   *Drafting thought:* Keep it light. "If [Bride] had met [Partner] five years later, different equilibrium."
      *   **The Turn (The Objection):** Introduce the tension. Lewis explains *how* we coordinate, not *why we care*.
          *   *Drafting thought:* Mention the bride's dissertation work implicitly or explicitly. Let's make it explicit to honor her work. She studied how norms become entrenched.
          *   *Key distinction:* Mistake vs. Wrong. If I show up late, is it a coordination failure or a betrayal?
      *   **The Resolution (The Truth about Marriage):** Move beyond game theory. Marriage is modifying the game itself. It's not about self-interest anymore. It's about "we."
          *   *Drafting thought:* Use the concept of "joint commitment" (Gilbert) or just plain love/obligation. Let's stick to the prompt's request: "what they actually owe each other."
      *   **Conclusion:** Raise a glass. Bring it back to the personal.

  4.  **Refining the Tone:**
      *   Needs to sound like a friend, not a lecturer.
      *   Avoid overly dense jargon without explanation.
      *   Ensure the philosophical references are accurate enough to pass the "half the room has a PhD" test.
      *   *Self-Correction on Lewis:* Make sure to emphasize *arbitrariness*. Lewis insists conventions are arbitrary regularities.
      *   *Self-Correction on Skyrms:* Skyrms focuses on the *evolution* of norms. The prompt mentions the bride used Skyrms to extend Lewis. I should acknowledge that evolution/stability aspect.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Opener:* Hi, I'm the non-philosopher. I read *Convention* last week.
      *   *Lewis bit:* You two are a coordination equilibrium. You prefer being together than apart. It's arbitrary (could have been someone else), but now it's common knowledge you're together.
      *   *The Problem:* But Lewis is cold. It's about self-interest. If I defect, I just lose payoff. But in marriage, if I defect, I hurt you.
      *   *Bride's Work:* [Bride] knows this. She studied how norms get moral weight.
      *   *The Real Toast:* Marriage isn't maintaining an equilibrium. It's changing the payoffs so that your good *is* my good. It's moving from coordination to obligation.
      *   *Closing:* To the equilibrium that holds even when the game gets hard.

  6.  **Polishing and Timing:**
      *   Check word count. 130-150 words per minute is standard speaking pace. 5 minutes = ~700-750 words.
      *   Ensure the transition from "arbitrary" to "necessary" feels earned.
      *   Make sure the "wronging" vs "mistake" distinction is clear.

  7.  **Final Review against Constraints:**
      *   Lewis framework accurate? Yes (coordination, arbitrary, common knowledge).
      *   Objection included? Yes (normative force/wronging).
      *   Bride's work acknowledged? Yes (Skyrms/norms).
      *   Emotional truth? Yes (commitment beyond interest).
      *   Length? Looks about right.

  8.  **Final Polish:** (Writing the actual text with attention to rhythm and pauses). *Self-correction: Make sure not to sound like I'm critiquing the bride's work, but using it as a stepping stone.*

