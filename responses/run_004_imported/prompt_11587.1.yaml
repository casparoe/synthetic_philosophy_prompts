      *   *Shift the Frame:* Explain that decision theorists aren't interested in the *moral* (you can't escape death); they are interested in the *mechanics of choice* under prediction.
      *   *Explain the Technical Stakes (CDT vs. EDT):*
          *   **EDT:** Looks at correlations. "If I go to Aleppo, it's evidence Death is there." Result: Paralysis or regret.
          *   **CDT:** Looks at causal impact. "My choice doesn't move Death." Result: Instability. If I lean Aleppo, I should go Damascus. But if I go Damascus, I should have leaned Aleppo.
      *   *The "Fatalism" Misunderstanding:* Clarify that in the formal model, the outcome isn't magically fixed by the gods. It's fixed by the *logical connection* between the agent's algorithm and the predictor. The question is: What algorithm should I run?
      *   *Why It Matters:* Connect to modern contexts (AI, Newcomb's Problem, Prisoner's Dilemma). If we build an AI, do we want it to be CDT or EDT? "Death in Damascus" breaks CDT in a specific way (deliberational equilibrium).
