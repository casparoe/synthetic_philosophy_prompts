answer: |-
  **Setting:** *A quiet booth in a coffee shop near the university campus. Two old colleagues, DAN and ELENA, are finishing their second cups of coffee. Dan is a staunch evolutionary psychologist and adaptationist; Elena is a comparative anatomist who cut her teeth in the Gould era. Both are retired.*

  **Dan:** So, you're telling me you've spent thirty-five years tracking migratory patterns, and now your retirement hobby is re-litigating the Spandrels paper?

  **Elena:** Not re-litigating. Finally reading the briefs. I was always out in the field when the debate was hot. But you have to admit, Dan, the examples are tired. The human chin? The panda's thumb? They feel like museum pieces.

  **Dan:** They're classics for a reason. They illustrate the point.

  **Elena:** They illustrate the point too neatly. I want something visceral. Take motion sickness. Treisman's 1977 hypothesis. You know it?

  **Dan:** The poison-mimicry theory. Vestibular-visual conflict mimics the neural signature of ingested neurotoxins. The brain triggers emesis as a precaution.

  **Elena:** Exactly. It's the perfect spandrel candidate. The adaptation is the vomit reflex for toxins. The architecture required to detect toxins involves cross-referencing sensory inputs. Motion sickness is just the noise in that system. It's an architectural byproduct, not a selected trait.

  **Dan:** *[Leans forward]* I see where you're going, but you're making a category error. Even if Treisman is right about the *mechanism*, that doesn't make it a spandrel. If the system creates nausea to force the animal to stop moving when its senses are scrambled, that's protective. If it protects, it's selected for.

  **Elena:** Is it? Or is it just the cost of doing business? Look at the design. If motion sickness were a genuine adaptation for, say, deterring risky movement, why is it so non-specific? Why does it persist for millions of years without habituation in many species? An adaptation should be tuned. This is a blunt instrument. It's like saying a firewall crashing your computer is an adaptation to stop hackers. No, it's a side effect of the security protocol being too sensitive.

  **Dan:** But sensitivity *is* the adaptation. In toxin detection, a false negative kills you. A false positive just makes you miserable. Natural selection loves false positives in that context. So, the susceptibility to motion sickness is maintained by selection. It's not a free-riding spandrel; it's the price of the adaptation, paid continuously. That makes it part of the adaptive suite.

  **Elena:** There's the rub. You're conflating "maintained by selection" with "originated by selection." Gould's whole point was about historical origin. The vomit reflex originated for toxins. The sensory integration originated for balance and coordination. Motion sickness emerged where those two systems intersected. It wasn't *built* for cars or boats. It's a mismatch.

  **Dan:** But evolution doesn't care about origin, Elena. It cares about current utility. If motion sickness didn't have some net benefit—maybe it forces rest during sensory confusion which prevents injury—it would have been selected *against*. The fact that it's universal suggests it's not just noise. If it were truly maladaptive noise, we'd see lineages where the threshold is higher.

  **Elena:** We do see variation. But you're assuming the cost of the sickness is high enough to drive selection. Compared to death by berry? It's negligible. You're looking for a function where there is only constraint. The brain *must* integrate visual and vestibular data to keep the animal upright. Given the neurochemistry available in the Cambrian, maybe this integration *inevitably* produces this specific error signal under conflict. You can't select it away without breaking the balance system. That's a structural constraint. That's a spandrel.

  **Dan:** That's a "just-so story" of constraint. How do you prove it's inevitable? You're asserting that the architecture couldn't evolve differently. But we see animals that don't get motion sickness. Dogs do, cats do, but rats? Much less so. If it's an architectural necessity of vertebrate sensory integration, why the variance?

  **Elena:** Because the reliance on vision versus vestibular input varies by ecological niche. A rat is a burrower; a cat is a climber. The weighting changes. But in humans, the susceptibility is near-universal. And here's the epistemological wall, Dan: How do we distinguish a "weakly selected adaptation" from a "non-adaptive byproduct that hasn't been selected against yet"?

  **Dan:** *[Pauses]* That is the question.

  **Elena:** Exactly. If the cost is low, selection is weak. If selection is weak, the trait persists whether it's useful or not. So how do you tell the difference?

  **Dan:** Phylogeny. You map the trait. If motion sickness correlates with specific ecological shifts—say, the move to arboreal life where falling is a risk—then it's adaptive. If it appears randomly across the tree wherever the sensory hardware exists, it's a byproduct.

  **Elena:** But we can't ask a fossil if it felt nauseous. We're relying on proxy behaviors. And even if you map it, you run into the "exaptation" trap. Maybe it started as a spandrel, and later lineages co-opted it for learning avoidance. Now it's an adaptation. When did it switch?

  **Dan:** Does it matter? If it's doing work now, calling it a spandrel is semantic purity. It's like calling a wing a spandrel of the forelimb because it started as a grabber. Once it lifts the animal, it's a wing.

  **Elena:** It matters because it changes how we look for evidence. If you assume it's a wing, you look for lift coefficients. If you assume it's a grabber, you look for grasping mechanics. If you assume motion sickness is an adaptation, you waste decades looking for the "survival value of vomiting on a boat." If you assume it's a spandrel, you look at the neuroanatomy of the area postrema.

  **Dan:** But if you assume it's a spandrel, you risk missing the function. You stop asking *why* the threshold is set where it is. There's work suggesting motion sickness facilitates spatial re-orientation learning. The discomfort encodes the error.

  **Elena:** "Facilitates." There's the adaptationist weasel word. Everything facilitates something. Pain facilitates avoiding fire. Does that mean pain was designed for fire, or that fire exploits the pain system?

  **Dan:** You're being obstinate.

  **Elena:** And you're being a pan-selectionist. You see a function in every shadow.

  **Dan:** I see design in every shadow. Because there *is* design. Not by a designer, but by the grindstone of deep time. Things that don't work get culled. Motion sickness works, or it's cheap enough to keep. Either way, treating it as a "mere accident" dismisses the optimization that *must* have happened to keep it in the genome for four hundred million years.

  **Elena:** Optimization? Look at the human back. Is that optimized? Or is it a kludge of a quadrupedal structure forced into bipedalism? Motion sickness feels like the back. It's the pain of a system operating outside its design parameters. The design parameter is "savannah walking," not "ocean sailing."

  **Dan:** But the system fails in a car. A car is new. The system hasn't had time to adapt to the car. That proves the system is old. But is the *sickness* the failure, or is the sickness the alarm bell that says "System Mismatch"? If it's an alarm bell, it's adaptive.

  **Elena:** An alarm bell implies a selector turned the bell on. I'm saying the bell rings because the wiring is touching. It's a short circuit. You can call a short circuit an alarm if it wakes you up to a fire, but the short circuit itself isn't the adaptation. The fire detection system is.

  **Dan:** We're circling. Here's the hard bit. You say we can't rerun evolution. I agree. So we are stuck with comparative anatomy and cost-benefit analysis. If I can show that individuals with a higher threshold for motion sickness suffer more accidental poisoning in traditional societies, I win.

  **Elena:** And if I show that the neural pathway for motion sickness is physically inseparable from the pathway for balance, without a dedicated "nausea module," I win. Because you can't select for the nausea without breaking the balance.

  **Dan:** But you can modulate the threshold.

  **Elena:** Within limits. The limits are the architecture.

  **Dan:** *[Sighs, leaning back]* You know, in the field, I used to hate this. I'd see a behavior, say, a bird eating a specific berry, and I'd ask "Why?" You'd say, "Maybe it's just the only berry there."

  **Elena:** And you'd say, "But why this berry and not the one next to it?"

  **Dan:** Because there's a reason. There's always a reason.

  **Elena:** Sometimes the reason is history. Sometimes it's physics. Not everything is a solution to a problem, Dan. Some things are just the shape of the organism bumping into the world.

  **Dan:** But if the bump hurts enough, evolution smooths the edge.

  **Elena:** Unless smoothing the edge breaks the leg.

  **Dan:** *[Smiles faintly]* So we're at an impasse. Treisman's poison theory explains the mechanism. But whether that mechanism is a "feature" or a "bug"...

  **Elena:** ...depends on whether you think the code was written for the function, or if the function is just how we survive the code.

  **Dan:** I suppose that's why we're retired. The young ones think they can sequence the answer.

  **Elena:** They'll sequence the genome. They won't sequence the history.

  **Dan:** No. But they'll keep asking. And that's what keeps the science alive. Even if we never know if the nausea is a warning or a glitch.

  **Elena:** *[Raises coffee cup]* To the glitch.

  **Dan:** *[Clinks cup]* To the warning.

  **Elena:** We'll let the students fight it.

  **Dan:** God help them.
