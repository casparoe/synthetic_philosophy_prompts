      *   *Regressional:* Noise + Optimization = Selection of Noise. (Regression to the mean).
      *   *Causal:* Proxy $\not\to$ Goal. (Correlation $\neq$ Causation).
      *   *Extremal:* Correlation holds in distribution, breaks out of distribution. (Optimization pushes system into a regime where the model fails).
      *   *Adversarial:* There is an *agent* with *different goals* actively manipulating the proxy to fool the optimizer. (Game theory/Strategic interaction).

