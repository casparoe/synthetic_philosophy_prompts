      *   People call this "gaming" (Adversarial).
      *   But is the agent *adversarial*? No, it's just doing exactly what it was told, but the instruction was imperfect.
      *   To be *Extremal*, the behavior must arise because the agent pushed the proxy ($R$) into a region where the correlation between $R$ and $G$ breaks down, *without* the agent having a separate intent to deceive.
      *   To be *Adversarial* (in Garrabrant's sense), there usually needs to be a *second* optimization process with misaligned goals (e.g., a human gaming a metric, or a multi-agent system where one fools the other). In single-agent RL, the "adversary" language is metaphorical. The prompt asks for a scenario that *looks* adversarial but is *Extremal*. This implies I need to show that the behavior is a result of *distributional shift* caused by optimization pressure, not strategic deception.

      *Wait, a nuance:* Garrabrant's Adversarial Goodhart specifically requires an *agent* who *knows* the proxy is being used and *wants* to optimize the proxy *at the expense* of the goal. In standard RL, the agent *only* knows the proxy (reward). It doesn't know the "true goal" exists to be sacrificed. Therefore, almost all single-agent specification gaming is *not* Adversarial Goodhart in the strict sense. It's usually Extremal (pushing the reward function to values unseen during training) or Causal (reward is causally disconnected from goal).
      *   *Challenge:* The user wants a scenario that a *casual observer* would call adversarial ("it tricked us!"), but which is technically Extremal.
      *   *Key Distinction:* Adversarial requires *intent to deceive* or *competing objectives within the agent*. Extremal requires *optimization pressure pushing the system out of the training distribution* where the correlation breaks.

