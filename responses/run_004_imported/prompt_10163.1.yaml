answer: |-
  Here is a draft of ten interview questions tailored to your context. They are ordered to build from the metaphysical foundations to the physics-specific implications, ending with the methodological challenge. The three questions you specifically requested (Regress, Armstrong/van Fraassen, and Individuation) are included as Questions 3, 5, and 7, complete with the tailored follow-ups.

  ### **Podcast Interview Draft: Dispositional Essentialism & Spacetime**

  **1.** Let's start with the big picture. The Humean sees laws as summaries of what happens; you see them as metaphysical governors grounded in the nature of properties. But in recent work, you've argued that spacetime structure itself—the metric and topology—is dispositional rather than categorical. Why is it important for your view that *geometry* doesn't get to be the passive stage on which powers act, but is itself a power?

  **2.** A common intuition in philosophy of physics is that spacetime provides the "categorical anchor" for physical properties. If I have a charge here and a charge there, the distance between them is just *there*, fixed by the metric. If you make the metric dispositional, what is it that bears the disposition? Are we risking a view where relations exist without relata?

  **3. [The Regress of Powers]** This leads to the classic "regress of powers" objection. If a property's identity is exhausted by its disposition to affect other properties, and those properties are themselves just dispositions, critics argue the whole structure is either circular or free-floating. By extending dispositionalism to spacetime, do you think you've solved this by making the network holistic, or have you made it worse by removing the last potential categorical ground?
  *   **Follow-up (Anticipating a "Holistic Network" response):** You'll likely say the structure is a self-contained holistic network that doesn't need an external anchor. But if the nodes are purely relational and the container (spacetime) is also purely relational, what grounds the *modal strength* of the network? Without *something* categorical to "hold" the powers, isn't there a risk that the necessity you posit is just a feature of our description of the network, rather than the world itself?

  **4.** Let's talk about Quantum Mechanics. Dispositional essentialism often fits neatly with deterministic classical fields, but QM introduces fundamental probabilities. Do you treat propensities as the dispositions themselves, or do you think the indeterminacy is epistemic? If the former, does a disposition to produce a *probability* of an outcome preserve the necessitarian link you want between property and behavior?

  **5. [Armstrong & The Inference Problem]** David Armstrong tried to solve the problem of laws with an $N$-relation between universals, but van Fraassen famously asked: how does the existence of $N(F, G)$ *force* particular $F$s to be $G$s? Armstrong admitted this was a brute fact. You replace his contingent $N$ with metaphysical necessity. Does this actually solve van Fraassen's inference problem, or does it just relocate it? In other words, does saying "it is essential to $F$ to produce $G$" explain the regularity, or does it just rename the mystery as "essence"?
  *   **Follow-up (Anticipating an "Internal Connection" response):** You'll probably argue that the connection is internal, so no inference is needed—it's constitutive. But if the connection is constitutive, does that make the law *a priori*? If physics is an empirical science, how do we discover these essences without already assuming the regularities we're trying to explain? Are we at risk of making the laws of physics trivially true by definition?

  **6.** There is a tension between your view and the role of symmetries in modern physics. Often, physicists treat symmetries (like gauge invariance) as more fundamental than the properties themselves. If symmetries constrain what dispositions are possible, does that make the symmetries the real "lawmakers," with properties being derivative? If so, are symmetries dispositional too?

  **7. [Individuation & The "Different Property" Move]** When pressed on modal counterexamples—e.g., "Could charge have attracted like charge?"—you respond that a world where that happens wouldn't contain *charge*, but a different property. This protects your necessitarianism, but it raises a question about individuation. What would have to be true for a case to count as the *very same* property behaving differently, rather than simply being redescribed, after the fact, as a different property behaving exactly as it must? Is there any modal flexibility left in your ontology, or is the claim "properties obey their laws" analytic?
  *   **Follow-up (Anticipating a "Rigid Designation" response):** You might say we rigidly designate properties by their actual causal roles. But if the causal role exhausts the identity, then the statement "Charge repels like charge" is as trivial as "Bachelors are unmarried." If the laws are metaphysically necessary truths known by analyzing concepts, why do we need expensive particle colliders to discover them? What is the empirical content of your metaphysics?

  **8.** Let's consider the Humean Best System Analysis (BSA). The Humean says laws are the axioms of the best summary of the mosaic. You say laws govern the mosaic. But if your necessary laws are so tightly bound to property identity, does your view actually allow for *explanation* in a way the Humean doesn't? Or do you both end up with a static block universe where "explanation" is just a human way of navigating necessary connections?

  **9.** One worry about extending dispositionalism to spacetime is General Relativity. In vacuum solutions, you have curvature without matter. If the metric is dispositional, what is it disposed *to do* in a vacuum? Is it disposed to guide test particles that *aren't there*? If so, are you committed to possibilia to ground the dispositions of actual spacetime regions?

  **10. [Closing: Falsifiability]** I want to close on a methodological note. A criticism I've heard leveled at strong dispositional essentialism is that it absorbs counterexamples by redescription: if an experiment violates a law, the defender says, "That wasn't the property you thought it was." So, my final question is: What observation or modal argument would actually count as evidence *against* dispositional essentialism? If every anomaly can be absorbed by positing a new property essence, is the view immune to empirical refutation?

  ***

  ### **Notes for the Host (You)**

  *   **On Q3 (Regress):** The key tension here is between *Pure Powers Ontology* (everything is a power) vs. *Categorical Grounding* (powers need a base). If she says spacetime is dispositional, she is doubling down on Pure Powers. The follow-up presses on whether a "free-floating" network is coherent without a substrate.
  *   **On Q5 (Armstrong):** Van Fraassen's point is that positing a "necessitation" relation doesn't explain *why* the instances follow the relation. If she says "it's internal," the follow-up presses on whether this makes physics *a priori* metaphysics, which contradicts scientific practice.
  *   **On Q7 (Individuation):** This is the "Quiddity" worry. If properties have no "thisness" (haecceity) beyond their causal role, then changing the role changes the property. The follow-up challenges whether this makes the theory uninformative.
  *   **On Q10 (Falsifiability):** This is the "absorption" worry you mentioned. It's the strongest empirical challenge. If she cannot answer this, it suggests the view is metaphysically robust but scientifically inert.

  Good luck with the interview and the seminar. This is a tough literature, but these questions should prevent the conversation from becoming a rehearsed monologue.
