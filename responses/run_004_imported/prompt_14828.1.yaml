      *   Mention that RPT is a *model*, not a law of physics. It works well for markets, less well for complex life choices.
      *   *Self-Correction during drafting:* I need to make sure I don't dismiss the traditional economist entirely. Their point about the slippery slope of paternalism is a valid political/philosophical concern, even if the economic logic has holes. The piece should reflect that tension.

