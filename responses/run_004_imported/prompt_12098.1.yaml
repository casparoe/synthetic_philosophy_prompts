answer: |-
  **The Second Burn**

  In the Madrasa Nizamiyya, the dusk prayer was not signaled by a bell, but by the lighting of the lamps. It was a precise ritual. As the sun surrendered its hold on the horizon, the junior scholars took their tapers to the great bronze candelabra in the courtyard.

  Yusuf was responsible for the western row. He held his taper to the first wick. He watched, as he always did, for the moment of conjunction.

  Al-Ghazali taught that there is no *necessary* connection between the fire and the cotton. There is only the Habit of God. The fire does not burn; God creates the burning at the moment the fire touches. It is a sequence of discrete creations, like beads on a string, strung anew in every atom of time.

  Avicenna, rest his troubled soul, had argued that fire burns by its very essence. To deny this was to deny the intelligibility of the world.

  Yusuf touched the flame to the wick. The cotton blackened. The flame climbed. But the heat did not come.

  He held his finger near the flame. The light was there, dancing and bright. The smoke was there, acrid and thin. But the air remained cool. He moved his finger closer, until the skin should have blistered. There was no pain. There was no thermal radiation. The fire was an image of fire, painted on the air by a hand that had forgotten to add the property of heat.

  "Master Idris," Yusuf whispered.

  The older scholar was lighting the eastern row. He turned, his own taper dripping wax. "Yes, Yusuf?"

  "The Habit has slipped."

  Idris approached. He did not recoil from the flameless heat. He held his hand over it, frowning. "The wind is from the north. It cools the skin."

  "The smoke rises, Master. The wax melts. But the air is cold."

  Idris withdrew his hand. He looked at the flame, then at the sky, where the last sliver of the sun hung suspended. "It is a trial. A minor suspension of the Custom to test our reliance on the senses."

  "Or," Yusuf said, his voice low, "the connection is not merely suspended, but severed. If God creates the world anew in every moment, what ensures He remembers to link the heat to the light in the next?"

  "His Will is perfect," Idris snapped, though his eyes remained on the flame. "He does not forget."

  "Then why the lag?"

  They stood in the silence of the courtyard. Other scholars were noticing. A murmur rose like a swarm of bees. In the center of the yard stood the water clock, a great brass basin with a hole in the bottom. Water dripped from the upper reservoir to mark the hours.

  A drop formed at the aperture. It swelled, heavy and silver. It fell.

  It struck the surface of the water below. There was a ripple. But there was no sound.

  Yusuf felt a coldness in his stomach that had nothing to do with the fire. This was not a miracle. A miracle, Ghazali wrote, was a deliberate break in the Custom, a sign for the prophets. It was intentional. This felt different. This felt like a hesitation.

  "Come," Idris said. "We must pray."

  They prayed facing the Qibla. Yusuf bowed, but he found his mind drifting from the verses to the mechanics of his own movement. When he willed his spine to curve, did God create the motion? Or did his muscles contract by their own nature, and God merely allowed it?

  If the latter, then Avicenna was right, and Ghazali was merely protecting the possibility of miracles. If the former, then Yusuf was a puppet, and the puppeteer had just stuttered.

  After the prayer, the heat returned to the lamps. Suddenly, violently. The bronze candelabra radiated a wave of warmth that made the scholars step back. The sound of the water clock returned with a sharp *plink* that echoed off the tiles.

  The Custom had reasserted itself.

  That night, Yusuf could not sleep. He sat in the scriptorium, copying a passage from *The Incoherence of the Philosophers*.

  *...the connection between what is habitually believed to be a cause and what is habitually believed to be an effect is not necessary...*

  He dipped his pen. The ink flowed black. He touched the nib to the paper. The ink did not soak in immediately. It sat on the surface for a heartbeat, a glossy black bead, before vanishing into the fiber.

  He called out, but no one answered. The dormitory was silent.

  He went to find Idris. The master's room was lit by a single oil lamp. Idris was sitting on the floor, surrounded by scattered papers. He was drawing diagrams. Circles within circles. Gears.

  "You saw it too," Yusuf said from the doorway.

  Idris did not look up. "The water clock. The lamp. The ink."

  "The ink lagged," Yusuf said. "I saw it sit upon the paper."

  "Perception is fallible," Idris said. "The eye is slow. The mind is slower."

  "The eye is not slow enough to see ink float, Master. And the heat... the heat was absent, then present. It was not a gradual warming. It was a switch."

  Idris finally looked up. His face was tired, the lines around his eyes deep as cuts. "There are two ways to understand the Master's words, Yusuf. You know this."

  Yusuf stepped into the room. "The Strict View. God is the only agent. Secondary causes are nothing but occasions. The fire does nothing."

  "And the Weaker View," Idris countered. "Secondary causes have power, but that power is contingent, not necessary. God *could* stop the fire from burning, but usually, He lets the fire do its work."

  "If the Weaker View is true," Yusuf said, "then the world has a texture. It has a grain. If the Custom stutters, it is because the grain is rough. Because there is resistance."

  "And if the Strict View is true?"

  "Then there is no grain. There is only the Hand. And if the Hand stutters..." Yusuf trailed off.

  "Then the Hand is not stuttering," Idris said softly. "Then the Hand is changing its mind."

  They sat in silence. The lamp between them flickered. For a moment, the flame turned blue, then green, then back to yellow. The wick did not consume.

  "Is it a simulation?" Yusuf asked. The word felt foreign in his mouth, a concept from a different tongue, a different millennium. He meant: *Is the world a construct of logic that is failing?*

  Idris shook his head. "Do not import the language of the Greeks or the moderns. We speak of God. If this is a construct, it is the Tablet of Decrees. If it is failing, it is not because the machinery is broken. It is because the Scribe is pausing."

  "Why would He pause?"

  "Perhaps to see if we notice." Idris picked up a piece of paper. He held it over the lamp. "If I hold this to the fire, what happens?"

  "It burns."

  "By necessity?"

  "By Custom."

  Idris held the paper closer. The edge browned. "If I hold it here, and it does not burn, is it because God stopped the fire? Or because the paper has no power to receive the burn?"

  "We cannot know," Yusuf said. "From the inside, the miracle and the malfunction look identical."

  Idris let the paper fall. It did not burn. It landed on the floor, pristine, save for a single brown spot on the corner that looked painted on, not scorched.

  "Avicenna would say this is impossible," Idris said. "He would say the essence of the paper is to be combustible. If it does not burn, the universe is a lie."

  "Ghazali would say the universe is not a lie, but it is not a machine," Yusuf replied. "It is a speech. And sometimes the Speaker pauses for breath."

  "But if the pause lasts too long?" Idris asked. "If the Custom does not return?"

  "Then we are no longer in a world of causes. We are in a world of will."

  Idris stood up. He walked to the window. The moon was high, a perfect circle. "Look at the shadow of the minaret."

  Yusuf looked. The shadow stretched across the courtyard, sharp and dark.

  "Watch the edge."

  They watched. The shadow did not move. The moon did not track. The stars were fixed points of light, unblinking.

  Time had not stopped. Yusuf could feel his heart beating. He could hear Idris breathing. But the celestial clock had frozen. The *ticks* of creation were still happening, but the *content* of the ticks was identical. God was recreating the same moment, over and over, without progression.

  "It is the Ambiguity," Yusuf whispered. "We cannot tell if this is a Miracle (Strict Occasionalism) or a Breakdown of Nature (Weaker Claim)."

  "If it is a Miracle," Idris said, "then God is speaking directly to us. He is saying: *I am here. I am holding this.*"

  "And if it is a Breakdown?"

  "Then the secondary causes have run out of momentum. The fire has no fuel. The orbit has no inertia. And we are drifting."

  Yusuf looked at his hand. He clenched his fist. The muscles moved. The bones clicked. The causality of his own body seemed to hold. He was still an agent, or at least, the illusion of agency remained intact.

  "How long do we wait?" Yusuf asked.

  "We do not wait," Idris said. He turned from the window. He picked up his pen. He dipped it in the ink. The ink flowed instantly. "We act as if the Custom holds. That is the only piety available to us."

  "Even if we suspect it doesn't?"

  "Especially then." Idris began to write on the paper he had not burned. "If God is the only Cause, then my writing is His writing. If Nature has power, then my writing is mine. In either case, the ink must flow."

  He wrote: *The fire burns the cotton.*

  He held the paper over the lamp.

  The edge caught. The flame spread. The heat hit Yusuf's face, sudden and familiar. The smell of charred paper filled the room.

  The shadow of the minaret outside shifted, just an inch.

  The Custom had resumed.

  Yusuf exhaled, a breath he didn't realize he had been holding. "It returned."

  "It did," Idris said. He watched the paper turn to ash in his fingers. He let the ash fall. "But tell me, Yusuf. When the flame caught... did you feel the necessity of it?"

  Yusuf thought. He remembered the moment of ignition. He had expected it. He had relied on the law of combustion. But in that expectation, was there truth? Or was there only habit?

  "I felt the expectation," Yusuf said. "I did not feel the connection."

  Idris nodded. He blew out the lamp. The room plunged into darkness, save for the moonlight.

  "Then we are agreed," the master said. "We live in the gap. Between the fire and the burn, there is a space. We call it Custom. The Philosophers call it Law. The Mystics call it Will."

  "And what do we call it when the gap widens?"

  Idris was silent for a long time. In the dark, his voice sounded thin, stripped of its authority.

  "We call it Tuesday," he said. "And we light the lamps again."

  Yusuf stood up. He walked to the door. He looked back at the master, who was sitting in the dark, staring at the spot where the flame had been.

  "Master?"

  "Yes."

  "If tomorrow... if the water does not wet..."

  "Then we will not drown," Idris said. "We will walk on it. Or we will sink. But we will not pretend we know why."

  Yusuf left the room. He walked through the courtyard to the western row of lamps. He took his taper. He touched it to the wick.

  He waited.

  The flame caught. The heat rose. The oil began to consume.

  Yusuf held his hand near the flame, feeling the warmth, testing the reality of it. It felt solid. It felt reliable. It felt like a promise kept.

  But as he turned to light the next lamp, he noticed the shadow of his own hand. It lagged behind his movement by a fraction of a second. A tiny, almost imperceptible delay between the action and the consequence.

  He did not mention it. He lit the next lamp. He acted as if the Custom held. He acted as if the fire burned the cotton.

  But he kept his hand close to the light, watching the shadow, waiting to see if the world would catch up.
