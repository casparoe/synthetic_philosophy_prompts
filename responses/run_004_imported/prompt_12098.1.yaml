  10. **Final Review:** Check against prompt requirements.
      *   Borges/Chiang register? (Yes, aim for intellectual wonder).
      *   Mechanics of occasionalism? (Yes, focus on the gap between events).
      *   Ambiguity of Ghazali's intent? (Yes, the core conflict).
      *   Fire/Cotton example? (Yes, central motif).

  *(Self-Correction on Setting)*: Let's keep it in Baghdad. It grounds the philosophy where it belongs. The "simulation" aspect is the *reader's* lens, not the characters'. The characters experience it as Theology.

  *(Refining the Glitch)*: Let's make it about *memory* of causation. If God recreates the world every moment, how do we know the past existed? If the "Custom" stutters, does the continuity break? Let's focus on the *heat*.

