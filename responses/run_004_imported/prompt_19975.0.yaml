      *   **Ghazali's Position (Occasionalism):** Explain the fire/cotton example. God as the sole agent. The nature of "necessity" (it exists, but only in God's will).
      *   **Hume's Position (Skepticism):** Constant conjunction. Psychology of expectation. Agnosticism about the "real" connection.
