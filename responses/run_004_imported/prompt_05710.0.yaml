answer: |-
  This is a fantastic story because you and your friends accidentally recreated a debate that has been raging in metaphysics for decades. You are absolutely right about the name, too: **mereology** is the branch of philosophy dealing with parts and wholes. The specific problem Elena and Marcus were wrestling over is called the **Special Composition Question**: *Under what conditions do some things add up to form a new, single object?*

  Here is a breakdown of their argument move-by-move, evaluating who had the stronger philosophical footing at each stage, followed by an answer to your big question about whether a "principled line" actually exists.

  ### Part 1: Move-by-Move Breakdown

  **Move 1: The Claim vs. Conservation**
  *   **Marcus:** Balancing the rocks creates a new object (the sculpture) *in addition to* the rocks.
  *   **Elena:** You didn't create new matter; you just moved existing stuff. Rearrangement isn't creation.
  *   **Who had the better point?** **Draw.**
      *   **Why:** Elena is winning on *physics* (conservation of mass), but Marcus is winning on *ontology* (the study of what exists). If I take three planks of wood and nail them into a triangle, physics says I still have three planks. But common sense says I now have *a triangle*. Marcus is arguing for the existence of "composite objects," which is a standard view. Elena is arguing for "mereological nihilism" (only the smallest parts exist), which is a defensible but counter-intuitive view. Neither knocked the other out here; they were just talking past each other (physical stuff vs. conceptual units).

  **Move 2: The House Analogy**
  *   **Marcus:** Bricks aren't a house. Arranged bricks *are* a house. Arrangement creates new kinds of things.
  *   **Elena:** A house has mortar; the bricks are fused. Your rocks are just touching.
  *   **Who had the better point?** **Marcus.**
      *   **Why:** Elena tried to set a criterion of "physical fusion" (mortar), but this is easy to dismantle. A dry-stone wall (no mortar) is still a wall. A solar system is held together by gravity, not glue, but we count it as one system. Marcus correctly identified that *functional arrangement* matters more than chemical bonding. Elena's distinction here was too narrow.

  **Move 3: The Fragility Objection**
  *   **Marcus:** Sandcastles and houses of cards are "things" even though they are temporary and fragile.
  *   **Elena:** (Concedes the point implicitly, moves to the next trap).
  *   **Who had the better point?** **Marcus.**
      *   **Why:** This was Marcus's strongest moment. Permanence is not a requirement for objecthood. A bubble is an object. A flame is an object. They pop or go out, but while they exist, they are distinct things. Elena's attempt to disqualify the sculpture based on fragility was philosophically weak because it would disqualify too many other things we accept as real.

  **Move 4: The Backpack/Cooler Trap**
  *   **Marcus:** (Implied: His sculpture is special).
  *   **Elena:** If arrangement makes an object, then my backpack leaning on your cooler is a new object too. Where do you draw the line?
  *   **Who had the better point?** **Elena.**
      *   **Why:** This is the "Gerrymandering" objection, and it is the hardest problem in mereology. If Marcus says "arrangement creates objects," he risks "ontological explosion"—suddenly the universe is filled with trillions of random objects (Shoe+Moon, Left Sock+Right Sock, Coffee Mug+Table). Elena correctly identified that Marcus needs a *principle* to explain why *this* arrangement counts but *that* one doesn't. Marcus didn't have an answer for this, which is why the argument stalled.

  **Overall Winner:** **Elena.**
  While Marcus had better intuitions about how we treat everyday objects (sandcastles, houses), Elena landed the critical philosophical blow. She forced him to admit that his definition of "object" might be too loose, and he couldn't provide a rule to stop it from getting absurd.

  ***

  ### Part 2: Is there a real, principled line?

  This is the million-dollar question. Is Elena right that any line we draw is arbitrary?

  The answer depends on whether you think objects exist **in the world** or **in our heads.**

  **1. The "Universe Doesn't Care" View (Elena's Leanings)**
  If you look at the universe purely as atoms and physics, Elena is basically right. There is no fundamental force that glues the rocks together into a "sculpture" that is different from the force holding the atoms inside a single rock together. The boundary between "rock stack" and "two rocks near each other" is not written into the laws of physics.
  *   **Verdict:** If you want a line that exists independently of human minds, **no, there is no principled line.** It is all just particles in space.

  **2. The "Human Carving" View (Marcus's Leanings)**
  However, most philosophers think that "objecthood" isn't just about physics; it's about *causal unity* and *human interest*.
  *   **Causal Unity:** A rock stack behaves differently than two separate rocks. If you push one, the others fall. The parts interact in a way that the backpack and cooler do not (unless they are zipped together). The sculpture has properties (balance, tension) that the individual rocks do not have.
  *   **Human Interest:** We carve the world into objects based on what matters to us. We need "houses" to live in and "sculptures" to look at. We don't need "backpack-coolers" for anything, so our brains don't label them as a single unit.
  *   **Verdict:** If you accept that objects are defined by how they function and how we interact with them, **yes, there is a principled line.** The line is drawn by *integration* and *purpose*.

  **The Synthesis**
  Elena is right that the line is **arbitrary from the perspective of the universe.** The universe doesn't know what a sculpture is.
  But Marcus is right that the line is **non-arbitrary from the perspective of human experience.**

  Think of it like a constellation. The stars in Orion are light-years apart and have no physical connection. Physically, "Orion" doesn't exist. But conceptually, it is a real, useful object that helps us navigate.
  *   **Marcus's Rock Stack:** Like Orion. The rocks are physically distinct, but the *relationship* between them creates a pattern that has meaning and behavior distinct from the parts.
  *   **Elena's Backpack/Cooler:** Like random stars that don't make a shape. They are near each other, but they don't form a unified pattern or function.

  **So, who was right?**
  Marcus was right that the sculpture is a "new thing" in the sense that it has new properties (balance, aesthetic value, structural tension) that the loose rocks didn't have.
  Elena was right that you can't prove it's a "new thing" using only physics, and that if you aren't careful with your definitions, you end up counting nonsense combinations as objects.

  **The Verdict:**
  You can tell Marcus he won the **practical** argument (we treat the stack as a thing, we photograph it, we admire it, and if it falls we say "the sculpture is gone," not "the rocks moved").
  But you can tell Elena she won the **technical** argument (there is no magic "object force" that turns on when the rocks balance).

  The truth is usually found in admitting that "objects" are a interface our brains use to manage the complexity of the universe, not necessarily fundamental building blocks of reality itself. Marcus created a new *concept*, if not a new *substance*.
