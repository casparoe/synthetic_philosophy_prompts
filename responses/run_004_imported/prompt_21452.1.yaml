  *(Refining the Verdict)*: Dan's claim is that the comparison "doesn't mean much." My verdict must be that it *does* mean much, specifically regarding the *measure* of manipulable profiles. I will frame GS as a "no-go zone" sign, not a statement that all paths within the zone are equally dangerous.

