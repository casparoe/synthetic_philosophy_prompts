          2.  *Computational Complexity:* Bartholdi, Orlin, et al. Manipulating STV is NP-hard. This doesn't make it impossible, just computationally infeasible. Dan would call this "changing the setup" (bounded rationality).
          3.  *Frequency/Measure of Manipulation:* How *often* can you manipulate? (Impartial Culture assumptions). This is the "degree" argument.
          4.  *VCG/Money:* Mechanism design with transfers. GS is for voting without money. With money, VCG is strategy-proof. But voting usually forbids bribes.
          5.  *Randomization:* Gibbard's 1977 theorem extends to randomized rules, but some randomized rules are strategy-proof in expectation (e.g., Random Dictator).
      *   *The Verdict:* Dan is technically right about the *binary* impossibility, but wrong about the *practical* implication. The "degree of manipulability" is a well-defined, serious research question. GS is a boundary condition, not a conversation stopper.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. "Beyond the Impossibility."
      *   **Introduction:** Acknowledge the argument. State the thesis immediately. Dan is right on the letter of the theorem, wrong on the spirit of social choice.
