prompt: |-
  Had a long, kind of tipsy argument with my friend Dan last night about voting theory (he's doing a PhD that touches on mechanism design, I just took one grad course on it years ago, so I'm probably misremembering half of this). It started because I said ranked-choice voting is clearly better than plain plurality since it's harder to game, and Dan said that's basically a non-statement once you actually know the Gibbard-Satterthwaite theorem: since any reasonable voting rule with three or more options can be manipulated by someone in some situation, saying "system X resists strategic voting better than system Y" is comparing two things that are already both proven manipulable, so the comparison doesn't mean much beyond vibes. I pushed back that this feels off -- isn't there a whole literature on this (I vaguely remember something about manipulating STV being NP-hard to even compute, and something about single-peaked preferences letting some rules dodge the theorem entirely) that treats "how manipulable" as a real, meaningful question rather than a settled non-issue? Dan said all of that is just people quietly changing the setup -- restricting the domain, adding computational limits, whatever -- rather than showing the impossibility result is any less devastating then it looks. We went back and forth for like an hour and neither of us budged, and now I can't stop turning it over in my head.

  Could you write me an essay that actually settles this? I want it to lay out precisely what Gibbard-Satterthwaite does and doesn't establish, go through the main ways people claim to get around the theorem (domain restrictions, computational hardness results, money/VCG-style mechanisms, randomized rules, or whatever else is actually relevant), and be honest about which of those are genuine escapes from the impossibility versus just relabeling the same problem. Then land on an actual verdict: is there a theoretically serious sense in which some non-dictatorial voting rules are more manipulable than others, or was Dan basically right that it all washes out once you've invoked the theorem? Don't hedge with "it's complicated" -- I want something I can actually throw back at him.
