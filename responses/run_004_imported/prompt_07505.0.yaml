          *   Premise 1: Knowledge is factive (If $S$ knows $p$, then $p$ is true).
          *   Premise 2: Knowledge is closed under known implication (If $S$ knows $p$, and $S$ knows that $p$ implies $q$, then $S$ knows $q$).
          *   Argument: If I know $p$, I know $p$ is true. If $p$ is true, evidence against $p$ is misleading. Therefore, if I know $p$, I know evidence against $p$ is misleading.
          *   Response to "Dogmatism is bad": Dogmatism *is* bad *unless* you actually know. The paradox only seems paradoxical because we confuse high confidence with knowledge. If you *really* know, you *should* be dogmatic.
