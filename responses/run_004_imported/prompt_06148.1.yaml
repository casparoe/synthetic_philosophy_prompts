answer: |-
  The banquet hall of the Grand Hyatt hums with the clatter of silverware and the low roar of three hundred metaphysicians. **Elena**, a visiting fellow known for her work on modal realism, picks at her salad. Beside her sits **Marcus**, a seasoned actualist with a penchant for Kripkean semantics. They had been on opposite sides of a panel earlier that afternoon.

  **1. Marcus:** (Swirling his wine) I have to say, Elena, your defense of Lewis this afternoon was spirited. But I still can't get past the intuition pump. When we say "Humphrey could have won," we mean *Humphrey*. Not some doppelgänger in a concrete universe who looks like him.

  **2. Elena:** I know it jars, Marcus. But think about the alternative. If Humphrey himself exists in another world, you're committed to him being numerically identical across distinct spatiotemporal manifolds. How does *that* work without magic? Counterpart theory trades one mystery for a clearer logic.

  **3. Marcus:** It's not magic; it's primitive thisness. Haecceity. But let's stick to Kripke's footnote. Humphrey doesn't care whether a counterpart wins. He cares whether *he* wins. If your theory makes the truth of "I could have won" depend on a stranger, you've changed the subject.

  **4. Elena:** Have we? Lewis argues that the counterpart relation *captures* what matters to Humphrey. When Humphrey imagines winning, he imagines a situation qualitatively similar to his actual life but with a different outcome. The counterpart *is* the representation of himself in that context. The psychology tracks similarity, not strict identity.

  **5. Marcus:** But similarity is vague. Identity is not. If I say, "I could have been taller," I am attributing a possibility to *me*. On your view, you're saying, "There is a person similar to me who is taller." That turns a claim about my potential into a claim about someone else's actuality. It feels like a category error.

  **6. Elena:** Only if you insist that "me" rigidly designates a transworld entity. But look at the payoff. By denying transworld identity, I avoid the problem of accidental intrinsics. You say "I could have been taller." If *you* are in that world being taller, then "being six feet tall" isn't an intrinsic property of you in that world; it's a property you have relative to that world.

  **7. Marcus:** I don't see the problem. Properties are had relative to worlds. I am five-foot-ten in the actual world, six-foot in world W. That's standard indexicality. I don't need to fragment myself into counterparts to make sense of that.

  **8. Elena:** But if *you*—the very same object—are in W, then you have the property of being six feet tall and the property of being five-foot-ten simultaneously, just indexed differently. Lewis argues this violates the notion of intrinsic properties. On my view, the actual you has five fingers intrinsically. The counterpart has six. No contradiction, no relational mess.

  **9. Marcus:** You're solving a logical problem by creating a semantic one. You make my intrinsic properties extrinsic relations to counterparts. "Having five fingers" becomes "Having a counterpart with five fingers." That's not analysis; that's elimination. You've analyzed away the *de re* modality we started with.

  **10. Elena:** I'd say I've clarified it. But let's turn the table. You cling to strict transworld identity. Tell me, how much can Humphrey change across worlds before he ceases to be Humphrey? If we go to a world where he has one different atom, is it him?

  **11. Marcus:** Yes. Numerical identity doesn't depend on qualitative similarity. That's the point of haecceity. He is Humphrey because he is *that* individual, not because of his parts.

  **12. Elena:** Okay, now apply Chisholm's paradox. Imagine a chain of worlds. In W1, Humphrey is actual. In W2, he has one different atom. In W3, two different atoms. By W1000, every atom is different. Is the Humphrey in W1000 identical to the one in W1?

  **13. Marcus:** If the chain preserves continuity of origin or causal history, yes. Transworld identity allows for qualitative change. We aren't talking about teleportation; we are talking about possibilities for the same entity.

  **14. Elena:** But where do you draw the line? If you say identity is all-or-nothing, you must accept a sharp cutoff. At some specific atom swap, Humphrey suddenly becomes *not* Humphrey. That seems absurd. Counterpart theory handles this gracefully: similarity comes in degrees. The further down the chain, the weaker the counterpart relation. No sharp cutoff needed.

  **15. Marcus:** I'll admit, the sharp cutoff is unpalatable. But vague identity is worse. If you say it's "indeterminate" whether he's identical, you violate Leibniz's Law. I'd rather accept a primitive thisness that persists through change than say identity is a matter of degree.

  **16. Elena:** But that primitive thisness is epistemically inaccessible. It does no work other than saving the intuition you started with. My theory explains why we hesitate on Chisholm's paradox: because the counterpart relation fades. Your theory just posits a metaphysical brute fact. Isn't that the heavier cost?

  **17. Marcus:** Perhaps. But your cost is existential inflation. You populate reality with infinite concrete worlds just to avoid saying "Humphrey" refers to the same thing twice. I'm an actualist; I don't want to buy that much ontology just to solve a sorites paradox.

  **18. Elena:** And I don't want to buy mysterious haecceities just to save the grammar of "I could have been." We're both paying a price. You pay with metaphysical mystery; I pay with counterintuitive ontology. I just think my currency buys more logical consistency.

  **19. Marcus:** (Sighs) Maybe. But when I look at my wife and think, "She could have missed this train," I don't feel like I'm thinking about a counterpart. I feel like I'm thinking about *her*. If philosophy tells me that feeling is a mistake, philosophy might be the thing that needs adjusting.

  **20. Elena:** (Raises her glass) And if philosophy tells me that "her" refers to a transworld entity without a clear criterion of identity, my logic screams. Perhaps we'll just have to agree that modality is expensive, no matter how you pay for it.

  **21. Marcus:** Clinking glasses. To expensive modality.

  **22. Elena:** And to Humphrey, wherever he is.
