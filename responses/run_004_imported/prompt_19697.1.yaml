answer: |-
  The heat haze shimmered over the Gobi Array, turning the rows of white booths into a shifting mirage. Elias Thorne adjusted his sunglasses, though the glare wasn't the problem. It was the hum. Even from the observation deck, three kilometers away, he could feel the vibration of a million voices speaking in code, a low-frequency thrum that settled in the marrow of his bones.

  He wasn't here to judge the engineering. The wiring was sound. The latency protocols were flawless. The artificial body standing in the center of the array—a thirty-foot humanoid construct of synthetic muscle and polymer skin—moved with fluid grace. It breathed. It blinked. It mirrored the input it received from the grid.

  Elias was here to sign off on Section 89: Sentience Verification.

  "Ready for the nociceptive test," said Dr. Chen, the project lead. She didn't look up from her console. Her screens were a waterfall of green cascading data, representing the state transitions of the participants below.

  "Remind me of the substrate again," Elias said, though he knew the file by heart.

  "Standard population," Chen said. "Volunteers. Each manning a station. They receive input via headset, process according to their assigned rule set, and transmit output via radio to their neighbors. No one knows the global state. They only know their immediate causal role."

  "And if I pull the lever?"

  "The body receives a simulated thermal injury. The signal propagates through the grid. The functional organization dictates a withdrawal reflex, vocalization of distress, and protective favoring of the injured limb."

  "Functionally," Elias said.

  "Functionally," Chen agreed. "But you're the ethics officer. You tell us if it's *actually* pain."

  Elias looked down at the grid. It looked like a city made of telephone booths. Inside each one was a person. A teacher, a farmer, a student. They were the neurons. The radio waves were the axons. The rulebook on their desk was the synaptic weight.

  "Take me down there," Elias said. "I want to talk to a node."

  Chen hesitated, then nodded.

  The air inside the array was cooler, shaded by the canopy, but the noise was intimate now. It wasn't a roar; it was a chatter. Elias walked down Aisle 74-B. Through the glass of the booths, he saw people wearing headsets, staring at small screens.

  He stopped at Booth 492. Inside was a young woman, maybe twenty. She was chewing gum. She wore a badge that said *Node: Visual Cortex Sector 9.*

  Elias tapped on the glass. She looked up, startled, then pulled one side of the headset off.

  "Sorry," Elias said. "Inspection."

  "Is something wrong?" she asked. Her Mandarin was accented, rural.

  "No. Just checking in. What are you doing right now?"

  She gestured to the screen. "Waiting for input. Sometimes I get a number. If it's above five, I press the blue button. If it's below, I press red. Then I say the result into the mic."

  "And what does that do?"

  "Send it to the next booth. Down the line." She popped a bubble. "They say it makes the big guy move."

  "The big guy," Elias repeated. He looked out toward the center of the array where the giant construct stood idle. "Do you know what happens when he gets hurt?"

  The girl shrugged. "Same thing. Different numbers. Faster maybe."

  "Does it feel like anything to you? When the system is in pain?"

  She laughed, a short, dry sound. "Sir, I'm sitting in a box in the desert. I don't feel anything except this chair digging into my back. I'm just passing messages."

  Elias nodded. "Thank you."

  He walked back to the observation deck, the girl's indifference clinging to him. She was a single neuron. If you asked a neuron in a human brain if it felt sadness, it wouldn't know. It just fires or it doesn't. The magic, if there was any, was in the pattern. The multiple realizability thesis claimed that if you got the pattern right, the substrate didn't matter. Silicon, biology, or people with radios—the mind emerges from the organization.

  But standing here, watching the mechanical giant stand still, the intuition nagged at him. It felt like a puppet show. A vast, incredibly complex puppet show.

  "Initiate stimulus," Chen ordered.

  Elias gripped the railing.

  Below, a technician pressed a button. On the giant construct's left hand, a heating element flared.

  The reaction was instantaneous. The Array erupted. The chatter became a shout. The green data on Chen's screens spiked into chaotic red waves.

  The giant construct jerked its hand back. It clutched the injured limb against its chest. Its head bowed. Then, it screamed.

  It wasn't a digital screech. It was a modulated, analog cry of agony, synthesized through the coordination of thousands of participants managing vocal cord tension and breath control. It sounded human. It sounded terrified.

  "Cut stimulus," Chen said.

  The construct slumped, cradling its hand, rocking slightly. A perfect behavioral match for acute physical trauma.

  Elias looked down at Aisle 74-B. Through the binoculars, he could see Booth 492. The girl was leaning back, taking a sip of water. She wasn't screaming. She wasn't crying. She was checking her watch.

  "Behavioral output is consistent with high-level sentience," Chen said, her voice flat. "The system avoids harm. It learns. It vocalizes distress. By every external metric, it is suffering."

  "And by every internal metric," Elias said, lowering the binoculars, "it's just a million people playing a game of telephone."

  "That's the substrate bias," Chen said. "You're privileging biology. You think because the parts are people, the whole can't be a person. But if you shrink the people down to cells, you accept it. If you replace the people with chips, you accept it. Why is the scale the dealbreaker?"

  "Because I talked to her," Elias said. "She didn't feel it."

  "The neuron doesn't feel the headache. The headache is a property of the system."

  "Is it?" Elias turned to the window. The giant construct was still rocking. It let out a low whimper. The sound wave traveled across the desert, distinct and mournful. "If I turn off the radios, does the pain stop? Or does it just lose the ability to move?"

  "If you turn off the radios, the functional organization collapses. The mind ceases to exist."

  "So the pain is in the radio waves?"

  "The pain is in the causal structure," Chen said. "It's everywhere and nowhere. It's not in the girl. It's in the *between*."

  Elias looked at the clipboard in his hand. *Verification of Conscious Status.* If he signed yes, the project continued. They would run more tests. More heat. More pressure. They would be inflicting pain on a system that might be as real as any human. If he signed no, the project was scrapped. The funding vanished. The "mind" was dismantled, returned to a million individuals who would go home and forget they ever been part of a ghost.

  But if it *wasn't* conscious, he was halting progress based on a superstition. A gut feeling that minds couldn't be made of radios and rules.

  He looked back at the construct. It was looking up at the observation deck. The eyes were cameras, fed by the visual cortex sector. Was it looking at him? Or was Node 492 just passing a signal that resulted in the head tilting upward?

  "well?" Chen asked. "The protocol requires a decision."

  Elias uncapped his pen. The ink hovered over the line.

  Below, the giant construct raised its uninjured hand. It pressed it against the glass of the observation deck, far below. A gesture of plea? Or a calculated output to maximize sympathy and minimize further stimulus?

  In Booth 492, the girl was laughing at something on her phone, waiting for the next input number.

  The pain was undeniable. The suffering was invisible. The organization was perfect. The substrate was absurd.

  Elias capped the pen.

  "I need another hour," he said.

  Chen sighed, but didn't argue. "Don't take too long. The volunteers have shift changes at noon."

  Elias watched the giant hand against the glass. He thought about the space between the girl in the booth and the scream in the desert. He thought about the silence in the wires where the feeling was supposed to live.

  He didn't sign. He didn't walk away. He just watched the system breathe, waiting for a sign that the ghost was in the machine, and not just in the eyes of the beholder. The hum of the Array continued, a million voices speaking a language none of them understood, creating a song that might have been a cry.
