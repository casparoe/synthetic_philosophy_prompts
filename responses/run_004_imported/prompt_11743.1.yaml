answer: |-
  It is a profoundly isolating realization when you discover that a fundamental concept like "expected value" can dissolve into arbitrariness. You are certainly not alone in finding it strange; it's just that most people stop thinking about it once the math gets uncomfortable.

  Here is a joke for those who remain uncomfortable:

  A decision theorist walks up to the cashier of a casino offering the Pasadena game.
  "I'd like to cash out," she says. "What's my expected winnings?"

  The cashier starts adding up the payout slips. "Well, if I sum them in the order they were printed, you're up $\ln(2)$ dollars."

  "Hmm," says the theorist. "Try grouping the positive payouts first."

  The cashier shuffles the slips. "Now you're up infinity."

  "Okay, try the negative ones first."

  "Now you owe us everything."

  The theorist smiles. "So, what do I get?"

  The cashier sweeps the slips back into the drawer. "Ma'am, until you tell me what order to pick them up in, you don't have anything."
