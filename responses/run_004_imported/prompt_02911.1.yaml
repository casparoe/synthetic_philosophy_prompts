prompt: |-
  So at work we're building a small internal tool for ranking tech-debt items to tackle next quarter (rank your top 3, instant-runoff elimination). Two people on my team got into it over slack in a way I found kind of interesting:

  (1) Priya wanted instant-runoff over plain plurality because "it's way harder to game."

  (2) Marcus said that's not a real distinction — there's a theorem (Gibbard-Satterthwaite) proving that with 3+ options and no dictator, every voting rule is manipulable by someone misreporting preferences. Its either gameable or a dictatorship, full stop.

  (3) Priya said sure, technically manipulable, but that's a worst-case result — gaming IRV would require knowing how the other 29 people are gonna vote, which nobody does in an anonymous poll, so who cares in practice.

  (4) Marcus said no — there's a known move called "burying," where you rank your real favorite #1 and your actual second choice dead last, and it works decently even under a lot of uncertainty about everyone else's votes. So her "you'd need inside info" claim doesn't hold up.

  (5) Priya then said fine, if everything's gameable per the theorem, let's just do a lottery weighted by first-choice votes, since that's provably strategy-proof. Marcus called that a cop out — now the winner's basically random noise that might not reflect what the group wants, so she's just traded manipulation for a legitimacy problem and acted like it's free.

  Neither backed down, it just died when someone posted a gif. Can you go through this move by move (1 through 5), say who's got the better argument at each step (not just who wins overall), and flag anything big both of them are missing? I don't know social choice theory so I can't referee this myself.
