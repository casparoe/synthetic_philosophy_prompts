  2.  **Deconstruct the Pasadena Game:**
      *   Payoff structure: A coin is tossed until it lands heads. Let $n$ be the number of tosses.
      *   Payoff $X_n = (-1)^{n+1} \frac{2^n}{n}$.
      *   Probability $P(n) = \frac{1}{2^n}$.
      *   Expected Value term: $P(n) \cdot X_n = \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \frac{(-1)^{n+1}}{n}$.
      *   Series: $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = 1 - 1/2 + 1/3 - 1/4 + \dots$
      *   This is the alternating harmonic series, which converges to $\ln(2)$ *if summed in standard order*.
      *   *However*, expected value is defined over the sample space, which doesn't inherently impose an ordering beyond the natural numbers. But in decision theory, if the series is only conditionally convergent, the expectation is undefined because rearranging the terms (which corresponds to different ways of grouping outcomes or evaluating the limit) changes the sum.
      *   The paradox: Rational agents should be indifferent between games with the same EV, but here EV is ill-defined. Pricing becomes impossible via standard utility maximization.

  3.  **Brainstorming the Narrative:**
