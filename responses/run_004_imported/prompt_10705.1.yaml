      *   **Core Concept:** Conditionally convergent series in expected value calculations. Unlike St. Petersburg (infinite EV), Pasadena has no defined EV because the sum depends on the order of summation (Riemann Series Theorem). It can be any real number, $+\infty$, $-\infty$, or undefined.
      *   **Task:** Write a short story for a decision theory seminar final.
      *   **Protagonist:** Someone who has to quote a price for the game (a bookie, actuary, trader, etc.).
