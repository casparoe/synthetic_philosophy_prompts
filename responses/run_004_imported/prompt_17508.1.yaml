answer: |-
  **Setting:** *A cramped faculty lounge at a philosophy of science conference. The coffee is lukewarm. **ELENA** (40s, specializes in social ontology of medicine) is leaning against the counter. **MARCUS** (50s, focuses on historical epistemology and psychiatric classification) is stirring sugar into his mug.*

  **ELENA:** You walked out of the panel early. I saw you check your watch during the TikTok clip.

  **MARCUS:** I didn't walk out. I… retreated strategically. Besides, you know my position on pop-psychiatry spectacles.

  **ELENA:** It wasn't a spectacle, Marcus. It was data. Did you see the kid in the hoodie? The way he narrated the switch? "Okay, the protector is coming forward now." He was staging his own ontology for an audience of three hundred thousand. It's Hacking. It's *Rewriting the Soul* in high definition.

  **MARCUS:** It's Hacking-adjacent. But you're glossing over the mechanism. Ian wasn't just talking about people adopting labels. He was talking about *institutional* classification. The "looping effect" requires a feedback loop between the classified and the classifier. In the eighties, the classifier was the psychiatrist, the DSM committee, the insurance company. On TikTok, who is classifying whom? An algorithm?

  **ELENA:** The algorithm is the classifier. It sorts the content, sure, but it sorts the *people* by proxy. If I tag myself #DID and #Switching, the algorithm feeds me other switchers. It creates a niche. It tells me, "Here is the shape of the person you are." And then I reshape myself to fit the niche to get the validation—the likes, the comments, the community. That's the loop. The classification changes the classified.

  **MARCUS:** But Hacking's looping effects were about *authority*. When the DSM-III introduced Multiple Personality Disorder, it gave clinicians a vocabulary that *authorized* certain behaviors as symptoms. It changed the administrative reality of the patient. On TikTok, there's no authority. There's only resonance. If a kid posts a video "switching," and no one engages, the classification dissolves. It's market-driven, not truth-driven.

  **ELENA:** Is there a difference? In the eighties, if Cornelia Wilbur didn't validate Sybil's personalities, they didn't become "real" in the medical record. On TikTok, if the community doesn't validate the switch, the video flops, and the identity performance is discarded. The peer community *is* the clinic now. They're the ones saying, "No, that's not a real switch, you didn't show dissociation amnesia," or "Yes, that's a valid alter." They are policing the boundaries of the kind.

  **MARCUS:** They're policing the boundaries of the *content*, Elena. Not necessarily the soul. Hacking was concerned with "making up people." He meant that the very possibility of being a certain kind of person enters the world through the classification. But with TikTok DID, I worry we're seeing "making up personas." The camera is on. The switch is performed *for* the camera. In the Sybil era, the switching happened in the closed room, ostensibly private, then recorded. Here, the performance is the primary event. Does that change the ontology?

  **ELENA:** It changes the visibility, not the ontology. Hacking argued that once a "kind" exists, people can inhabit it. Before the 19th century, you couldn't be a "homosexual" in the modern sense because the category didn't exist. You could do the acts, but you couldn't *be* the kind. TikTok has created a hyper-visible category of "The DID TikToker." Young people with vague distress are looking at that category and finding a home for their pain. They are inhabiting the kind. That is exactly what Hacking described.

  **MARCUS:** But Hacking also talked about the "moving target." As the science changes, the people change. In the eighties, the number of alters went from two or three to dozens because the *literature* said multiples could have dozens. Therapists asked, "Is there anyone else?" On TikTok, the alters are changing because the *aesthetic* changes. One month, alters are distinct ages; the next month, they're fictional characters from media. If the classification is driven by trending audio clips rather than clinical observation, is it still a looping effect? Or is it just mimicry?

  **ELENA:** Why does the source of the classification matter? Whether it's a therapist asking "Is there another one?" or a comment section asking "Who came out just now?", the pressure is on the subject to conform to the expectation of the disorder. The distress becomes organized around the category. That's the looping effect. The suffering isn't fake, Marcus. But the *shape* of the suffering is being molded by the platform.

  **MARCUS:** I'm not saying the suffering is fake. I'm saying the *causal arrow* is different. Hacking's loop was slow. It took decades for MPD to swell and then recede. It required textbooks, conferences, insurance codes. TikTok loops are viral. They happen in weeks. If the classification system is that volatile, can it sustain a "kind"? Or is it just a transient fashion? If I classify myself as a "VSCO girl" today and a "DID system" tomorrow, have I been "made up" in the Hacking sense? Or am I just trying on costumes?

  **ELENA:** That's a dangerous distinction. "Costume" implies deceit. Hacking's whole point was to move away from "real vs. fake." He wanted to show how the interaction between knowledge and people creates reality. If a teenager feels fragmented, and TikTok gives them a script to understand that fragmentation, and then they *become* that script... the reality is produced. The speed doesn't negate the loop; it just accelerates it. We are watching interactive kinds evolve in real-time. It's terrifying, but it's text-book Hacking.

  **MARCUS:** Is it? Hacking was worried about the *power* dynamics. The psychiatrist holds the power to commit, to medicate, to label. The TikTok algorithm holds the power to... shadowban? To amplify? It's a different kind of power. It's seductive, not coercive. In the eighties, patients were often coerced into the MPD diagnosis by aggressive therapy. On TikTok, they are running *toward* it. They want the label.

  **ELENA:** Because the label offers community! That's the feedback. In the eighties, the label offered a relationship with the therapist. "I am your patient, you are my witness." On TikTok, it offers a relationship with the swarm. "I am a system, you are my witnesses." The dynamic is the same. The subject modifies their behavior to maintain the relationship that validates the classification.

  **MARCUS:** But consider the exit. In the clinical model, if you recover, you lose the diagnosis, but you keep the medical history. On TikTok, if you "recover" or denounce the label, you lose the audience. The algorithm punishes deviation. So the loop tightens. You have to keep switching to stay relevant as a "DID account." That suggests the looping effect isn't just reshaping the person; it's trapping them in a performance economy Hacking never anticipated. He was thinking about the asylum and the clinic, not the attention marketplace.

  **ELENA:** So you think we need a new term? "Algorithmic looping"?

  **MARCUS:** Maybe. Or maybe we admit that Hacking's framework assumes a certain stability in the "expert" class that no longer exists. When the expertise is crowdsourced, the "kind" becomes unstable. If the definition of an "alter" changes every six months based on trending videos, what are we looping? We aren't making up people; we're making up content generators.

  **ELENA:** I think you're underestimating the internalization. These kids aren't just generating content. They are living inside these categories. They are experiencing amnesia, distress, functional impairment. The source of the category doesn't change the fact that the category is now doing work on their nervous systems. If the DSM-III made MPD real for a generation, then the For You Page is making DID real for this one. The medium is different, but the metaphysics is identical.

  **MARCUS:** The metaphysics might be identical. But the ethics are not. Hacking's work was a call to responsibility for the classifiers. "If you make up people, you are responsible for the kinds you create." Who do we hold responsible here? The fifteen-year-old influencer who started the trend? The algorithm engineers in Silicon Valley who don't know what dissociation is? If we call this a Hacking-style loop, we imply there's a node of authority we can critique. But the authority is diffuse.

  **ELENA:** Then we critique the diffusion. We critique the idea that identity formation should be crowdsourced. But we can't deny the loop exists just because the master is invisible. The point is, we are watching "interactive kinds" in the wild. No clinic walls. No consent forms. Just pure, unfiltered feedback between the label and the life.

  **MARCUS:** *Sips cold coffee.* I'll grant you this: It is a loop. I'll even grant you it's interactive. But I worry that by calling it a straightforward Hacking effect, we normalize the mechanism. We treat the algorithm like a legitimate classifier. Hacking respected the scientists, even when he critiqued them. They were trying to find truth. The algorithm is trying to find engagement.

  **ELENA:** And isn't that the scary part? That the "truth" of who these people are is being shaped by a system designed to maximize engagement, not healing? That's not a reason to discard Hacking. It's a reason to weaponize him. If we show this is a looping effect, we show that the platform is actively constructing the pathology it claims to just be hosting.

  **MARCUS:** *Pauses.* That... I can buy. If the loop is constructive, then the platform is complicit in the construction. That moves the debate from "Are they faking?" to "What is this environment doing to them?"

  **ELENA:** Exactly. Hacking didn't say MPD was fake. He said it was a way for people to be in a specific time and place. TikTok DID is a way to be in *this* time and place.

  **MARCUS:** Just... keep the distinction between "making up people" and "making up users." The stakes are different.

  **ELENA:** I'll keep it in mind. But don't be surprised if the next edition of the DSM quotes a viral video.

  **MARCUS:** *Laughs softly.* God help us. More coffee?

  **ELENA:** Please. Black.
