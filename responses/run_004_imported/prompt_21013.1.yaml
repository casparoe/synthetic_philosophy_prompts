      *   *The Consequence:* If the interrogator uses telepathy to identify the human, they aren't testing *intelligence* (computational/behavioral); they are testing *psychic ability*. This invalidates the test as a measure of machine intelligence. The machine would lose not because it's dumb, but because it lacks a "sixth sense."

