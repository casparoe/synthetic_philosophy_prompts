      *   **Context:** Economics class, Dollar Auction demonstration (Shubik's Dollar Auction).
      *   **Scenario:** $20 bill auctioned. Winner gets $20, 2nd highest pays bid but gets nothing. Bidding went to $34 (winner) and $31 (loser).
      *   **Characters:** Marcus (argues it's irrational/sunk cost fallacy) vs. Elena (argues it's locally rational but globally trapped/structural issue).
