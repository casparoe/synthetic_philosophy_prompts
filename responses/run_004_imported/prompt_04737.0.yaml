          *   This works well.
      *   *Wait, one nuance:* In the exercise example, can non-exercisers lose weight? Yes (diet). Can exercisers fail to lose weight? Yes (bad diet). So $Z$ is not deterministically caused by $X$. This fits the probabilistic nature of the table above.

  5.  **Addressing the Causal Diagram:**
      *   Need to draw (using text/ASCII) the DAG.
      *   $X \rightarrow Z \rightarrow Y$
      *   $X \rightarrow Y$ (Direct link)
      *   Explain "Collider" vs "Mediator" vs "Confounder".
      *   Key concept: **Path Blocking**.
