          *   To show Simpson's Paradox here, the *direct* effect must be negative, but the *indirect* effect (via $Z$) must be strongly positive, such that the *total* effect (aggregate) is positive.
          *   So: $X$ increases $Z$. $Z$ increases $Y$. But holding $Z$ constant, $X$ actually decreases $Y$.
          *   Wait, does this fit the "Simpson's Paradox" definition strictly? Usually, Simpson's implies a reversal due to *imbalance* in group sizes weighted by the outcome.
          *   In the mediator case, the "imbalance" comes from the fact that $X$ *causes* the distribution of $Z$ to change. Treatment group has more high-$Z$ people than Control group because $X \rightarrow Z$.
          *   If we stratify, we compare $X$ vs Control *within* $Z=1$ and *within* $Z=0$. This isolates the direct effect.
          *   If the direct effect is negative, but the indirect effect is positive and larger, the total effect is positive.
          *   This creates the reversal pattern: Aggregate (Total Effect) > 0, Stratified (Direct Effect) < 0.
