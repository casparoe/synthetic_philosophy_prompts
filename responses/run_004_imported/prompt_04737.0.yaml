      *   Actually, Pearl distinguishes these. He calls the confounding case "Simpson's Paradox" (where aggregate is wrong) and the mediator case often falls under "Mediation Analysis" or "Table 2 Fallacy". But the numerical pattern is identical. I will stick to the user's framing: "Simpson's Paradox pattern" but explain the causal distinction.
