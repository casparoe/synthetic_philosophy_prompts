      *   **Simpson's Paradox:** $P(Y|X) > P(Y|\neg X)$ (aggregate) but $P(Y|X, Z=1) < P(Y|\neg X, Z=1)$ and $P(Y|X, Z=0) < P(Y|\neg X, Z=0)$.
      *   **Standard Confounding Case ($Z$ is a common cause):** $X \leftarrow Z \rightarrow Y$. Here, stratification removes bias. The friend is right *in this specific case*.
      *   **Mediator Case ($Z$ is a mechanism):** $X \rightarrow Z \rightarrow Y$. Here, $X$ causes $Z$, and $Z$ causes $Y$.
