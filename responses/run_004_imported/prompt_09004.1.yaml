answer: |-
  This is a fantastic prompt. You have correctly identified that Dummett is often miscategorized as a standard liberal cosmopolitan. He wasn't. His position in *On Immigration and Refugees* (2001) is radical, Catholic-inflected, and deeply historically situated in the British post-colonial experience.

  Your friend is right that Dummett would hate both policies, but for a seminar presentation, you need to map the *mechanism* of that condemnation. To answer your core question: **Windrush and Rwanda test the same root strand of Dummett's thought (the illegitimacy of racialized sovereignty), but they pull on different branches of his moral framework (Membership vs. Access).**

  Here is a reconstruction of how Dummett's specific arguments apply to each, and where the tension lies.

  ### 1. The Core Framework: Three Pillars
  To reconstruct his argument, we need to isolate three specific claims from *On Immigration and Refugees* that are relevant here:
  1.  **The Racism Thesis:** Dummett argues that strict immigration controls in the UK are not primarily about economics or population density, but are "a disguise for racism." They are designed to keep Britain white.
  2.  **The Colonial Debt:** He argues that former colonial powers have a specific, non-universal obligation to the subjects of their former colonies. This isn't just "helping the poor"; it is reparative justice.
  3.  **The Critique of the Distinction:** He argues the "genuine refugee" vs. "economic migrant" distinction is morally untenable because poverty and violence are intertwined, and the bureaucratic machinery used to distinguish them is inherently cruel and error-prone.

  ### 2. Case Study A: Windrush and the Hostile Environment
  **The Case:** The state stripped rights from people who were legally British subjects, demanding paperwork for a status they already possessed, disproportionately affecting Caribbean migrants.

  **Dummett's Argument:**
  This case hits Dummett's **Colonial Debt** and **Membership** arguments hardest.
  *   **The Betrayal of Invitation:** Dummett emphasizes that the Windrush generation were not "interlopers"; they were subjects invited to rebuild the metropole. For Dummett, once a state invites a population to settle, a moral contract is formed. The Hostile Environment didn't just restrict *new* entry; it retroactively invalidated *existing* membership.
  *   **Bureaucracy as Violence:** Dummett was deeply skeptical of state bureaucracy in immigration matters. He argued that requiring impossible levels of proof (like landing cards from 1968) is a tactic of exclusion, not administration. He would argue this is the "racism wearing legal disguise" thesis proven: the law was applied with a severity designed to target a specific racial group under the guise of "compliance."
  *   **The Verdict:** For Dummett, Windrush is arguably the *greater* moral crime of the two. Why? Because it violates the rights of those who have already crossed the threshold of membership. It turns citizens into foreigners.

  ### 3. Case Study B: The Rwanda Scheme
  **The Case:** Asylum seekers arriving in the UK are deported to a third country for processing, with no guarantee of return to the UK, intended as a deterrent.

  **Dummett's Argument:**
  This case engages his **Critique of the Distinction** and **Universal Duty** arguments.
  *   **Outsourcing Conscience:** Dummett argues that rich nations have a duty to absorb those fleeing destitution or persecution. By shipping claimants to Rwanda, the UK is attempting to purchase exemption from this duty. Dummett would view this as a violation of the "right to move" which he grounds in human dignity.
  *   **The Deterrence Principle:** The explicit goal of the Rwanda scheme is deterrence. Dummett argues that making the asylum process punitive to discourage others is immoral. It uses the suffering of the individual in front of you as a lesson to those behind them.
  *   **The Verdict:** This confirms his thesis that the "refugee vs. migrant" distinction is a tool for exclusion. By removing people before their claims are fully heard in the UK, the state ensures fewer people are recognized as "genuine refugees."

  ### 4. Do they test the same strand?
  Here is the nuance for your presentation. They test the **same root** but **different limbs**.

  **The Same Root (The Racism Thesis):**
  Both policies are vindications of Dummett's central claim: that UK immigration policy is driven by a desire to limit the non-white population.
  *   **Windrush** targeted the Caribbean community specifically (non-white).
  *   **Rwanda** targets arrivals from the Global South (non-white), while white Ukrainians, for example, were granted distinct visa routes.
  *   *Dummett's Argument:* You cannot separate the "hostility" from the race of the host. Both policies are evidence that the "sovereign right to control borders" is being exercised as a "sovereign right to control racial demographics."

  **The Different Limbs (Membership vs. Access):**
  *   **Windrush** is about **Internal Justice**. It tests Dummett's view on what we owe people *once they are here*. His argument here is absolute: If you are settled, you are a neighbor. To treat them as aliens is a fundamental betrayal of the political community.
  *   **Rwanda** is about **External Justice**. It tests Dummett's view on what we owe people *trying to get here*. His argument here is more contested (even by him). He acknowledges states have *some* right to manage numbers, but argues that right is heavily constrained by human need.

  ### 5. Where does his reasoning run out of steam?
  This is the critical part for your seminar. There is a point where Dummett's framework might struggle to condemn the two with *equal* force, or where the logic diverges.

  **The "Integration" Tension:**
  Dummett places a high value on social cohesion and integration. He argues that for immigration to be sustainable, the host population must accept the newcomers, and newcomers must integrate.
  *   **On Windrush:** His argument is seamless. The Windrush generation *did* integrate. They worked, raised families, and lived as British. The state's failure to recognize this proves the state is acting in bad faith.
  *   **On Rwanda:** Here, his reasoning gets complicated. Dummett might argue that if the UK cannot integrate more people, it has a duty to ensure they are settled *somewhere* safe. If the Rwanda scheme guaranteed safety and integration *in Rwanda*, a strict Dummettian might ask: "Is the moral obligation to be in the *UK* specifically, or to be *safe and integrated*?"
      *   *However,* Dummett would likely counter this by pointing to the **Colonial Debt**. The UK owes a debt that Rwanda does not. Sending people to Rwanda is a way for the UK to pay off a moral debt with someone else's currency.

  **The "Sovereignty" Limit:**
  Dummett is an anti-sovereigntist regarding borders. He believes the "right to exclude" is not absolute.
  *   **Windrush** shows the horror of absolute sovereignty turned inward (we can un-make you citizens).
  *   **Rwanda** shows the horror of absolute sovereignty turned outward (we can move you wherever we want).
  *   **The Limit:** Dummett's argument runs out of steam if the defender of Rwanda argues, "We are not rejecting them; we are processing them more efficiently." Dummett's counter relies on the empirical claim that these schemes are *designed* to fail or deter. If a proponent could prove the Rwanda scheme was genuinely efficient and humane (which Dummett would doubt), his moral objection would have to rely solely on the "right to choose your destination," which is a weaker claim in his work than the "right to not be persecuted."

  ### Summary for your Presentation
  If you need a punchy conclusion for Friday:

  1.  **Unified Condemnation:** Dummett would condemn both as manifestations of the same disease: the use of bureaucratic legality to enforce racial exclusion.
  2.  **The Distinction:** Windrush violates the **Contract of Membership** (betraying those already accepted). Rwanda violates the **Duty of Sanctuary** (rejecting those seeking safety).
  3.  **The "Steam" Question:** His argument is strongest on Windrush because it involves a specific historical debt to the Caribbean that is undeniable in his framework. On Rwanda, he relies on a broader, more contestable universal duty. Therefore, **Windrush is the stronger case in Dummett's specific philosophy**, because it combines his racism thesis with his colonial debt thesis, whereas Rwanda primarily engages the colonial debt and universal duty.

  Dummett would likely say: *Windrush proves that the state cannot be trusted with the power to distinguish 'legal' from 'illegal' when race is involved. Rwanda proves that the state cannot be trusted with the power to distinguish 'refugee' from 'migrant' when politics is involved.* Both are failures of the same moral imagination.
