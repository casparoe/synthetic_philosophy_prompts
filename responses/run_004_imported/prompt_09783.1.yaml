      *   *Strategy 5: Contextualism or Interest-Relative Invariantism (less Williamson-friendly, but useful for the argument).* Maybe "knows" shifts standards. (Decided to avoid this; stick to internalist/externalist debate within Williamson's framework).
      *   *Strategy 6: The "Cognitive Command" or "Idealization" Move.* Maybe for logical/mathematical truths, our cognitive access *is* ideal enough that the sorites doesn't get a foothold.

