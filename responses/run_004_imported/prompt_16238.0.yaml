          *   *Verdict:* Good analogy, but category error (public policy vs. private windfall).

      *   **Point 4 (Jess's Counter):** *Argument:* Policy vs. Private + Arbitrariness. Public policy is a rough heuristic, not truth. No formula exists to determine the split (60/40 vs 55/45).
          *   *Analysis:* Very strong. Even if we accept premise 1, there is no objective way to calculate the "need ratio." This makes the split arbitrary, which undermines "fairness."
