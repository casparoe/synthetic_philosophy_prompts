      *   *Section 3: The Real Weakness (Dynamic Consistency).*
          *   The stronger objection isn't about the bookie's knowledge, it's about **Dynamic Consistency** (Hammond).
          *   If you know your future self will violate conditionalization, your current self should act differently.
          *   The DBA assumes you *commit* to a strategy. If you don't commit, the DBA fails.
      *   *Section 4: Epistemic vs. Pragmatic.*
