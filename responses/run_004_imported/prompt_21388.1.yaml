answer: |-
  Thank you all for being here.

  [Professor's Name] left very specific instructions for this moment. She told us what we could not say. We are not to say she is in a "better place." We are not to say she is "watching over us."

  She didn't give these instructions because she was cold. She gave them because she was honest. To her, those phrases weren't false; they were, in her technical terms, *cognitively meaningless*. They are sentences that look like facts but describe nothing that can be checked, tested, or known. And she loved us too much to offer us comfort that relied on a lie.

  For those of you in the department, you know that [Professor's Name] was a defender of logical positivism in an age that had moved on. She stood her ground. But for her family and friends who might not know the philosophy, I want to tell you what that actually looked like as a human being.

  It meant she respected reality more than she respected comfort. It meant she never patronized anyone. If you brought her an argument, she didn't coddle you. She took you seriously enough to tell you when your words didn't connect to the world. That was her form of care. To treat someone as an adult, capable of bearing the weight of the truth.

  Her favorite story to tell in class was about A.J. Ayer, the great philosopher who choked on a piece of smoked salmon in a hospital. Ayer had a near-death experience. He saw a red light. He encountered a divine presence. And when he survived, he didn't convert. He didn't write a book about the afterlife. He wrote a short essay saying that this experience had "slightly weakened" his conviction that death was the end. Only slightly. Grudgingly. In public.

  She loved that story. She used it to teach us that updating your beliefs on weird evidence is okay, but pretending that weird evidence proves a doctrine is dishonest. She taught us that you can face the unknown without filling it with fantasies.

  And this brings me to something difficult. Something her sister asked me to share.

  In her final days in hospice, [Professor's Name] admitted to an experience she could not place. She described something she saw, something that unsettled her expectations.

  She asked that I tell you this, but she would have insisted I tell it exactly as Ayer told his. It was a datum. It was an event. It was not a key to a locked door. She did not claim it proved she was going somewhere. She did not claim it proved she was staying here. She simply noted that, in the end, the evidence presented itself in a way she hadn't anticipated. And true to her life's work, she reported it without embellishment. She didn't turn it into a theology. She left it as a mystery, which is the only honest way to leave it.

  For the family here: I know this sounds technical. I know you want to know she is at peace. I cannot tell you that, because I don't know that, and she wouldn't want me to say it. But I can tell you this: She was curious until the very last moment. She was observing. She was engaged with the universe right up until she wasn't. She didn't check out. She didn't retreat into easy answers. She faced the end with the same rigorous attention she gave everything else.

  For the students and colleagues: We have lost a standard-bearer. It is easier to be vague. It is easier to let sloppy language slide. She made it harder for us, and she made us better for it.

  So, how do we say goodbye?

  We cannot say she is with us now. We cannot say she is gone to a place we will follow.

  We can say that her work remains. We can say that the arguments she sharpened are still in use. We can say that she taught us to demand clarity, and that is a gift that survives her.

  And we can say, simply, and verifiably, that we miss her.

  Thank you.
