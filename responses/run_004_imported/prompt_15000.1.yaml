  9.  *(Self-Correction on "Declines to Choose"):* The prompt explicitly says "rather than an even-handed summary that declines to choose." I must be decisive. I will argue that Aristotle provides the superior account of *moral* character formation, while Franklin provides a superior account of *behavioral* modification, and that conflating them leads to a shallow understanding of virtue.

