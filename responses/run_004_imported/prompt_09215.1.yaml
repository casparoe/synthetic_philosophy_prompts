answer: |-
  This is a fantastic debate to be having. You and your friend have stumbled onto one of the oldest and stubbornest knots in metaphysics and philosophy of language. Neither of you is obviously "wrong," because both Fregeanism and Act-Based theories are attempts to solve the same problem, and both face serious objections.

  To "settle" this, we need to break down exactly why Bradley's Regress is considered vicious, and then see if Frege and the Act-Theorists (like Peter Hanks and Scott Soames) actually cut the knot or just tie it somewhere else.

  ### 1. Why is Bradley's Regress Vicious?

  First, distinguish Bradley's Regress from the "Truth Regress" your friend mentioned.
  *   **The Truth Regress:** "$P$ is true" $\rightarrow$ "It is true that $P$ is true" $\rightarrow$ etc. Most philosophers agree this is **benign**. It doesn't stop "$P$" from being true; it just generates an infinite series of equivalent statements.
  *   **Bradley's Regress:** This is about **Unity**.

  **The Argument:**
  Imagine a proposition: *Socrates is wise.*
  On a relation-based theory, this proposition consists of three things:
  1.  The object (Socrates)
  2.  The property (Wisdom)
  3.  The relation (Instantiation/Exemplification) that glues them together.

  Bradley asks: What connects *Socrates* to *Instantiation*? If you need a relation ($R_1$) to connect Socrates to Instantiation, then you need a further relation ($R_2$) to connect Socrates to $R_1$, and so on ad infinitum.

  **Why it's Vicious:**
  It's not vicious because infinity is scary. It's vicious because it results in **explanatory failure**.
  For a proposition to be true or false, it must be a *unified whole*. A list $\{ \text{Socrates, Wisdom, Instantiation} \}$ is not true or false; it's just a heap. If the "glue" always requires more "glue," you never actually achieve unity. You never get a proposition; you just get an endless pile of components. If you don't have a unified proposition, you don't have a truth-bearer.

  ### 2. Frege's Move: Unsaturatedness

  Your friend is defending the classic Fregean solution. Frege argues that the regress arises from a category mistake: treating concepts (properties) as if they were objects.

  *   **The Solution:** Objects are "saturated" (complete). Concepts are "unsaturated" (incomplete, like a function with a hole in it).
  *   **The Claim:** You don't need a third element (a relation/copula) to glue an unsaturated thing to a saturated thing. They fit together by their very nature, like a puzzle piece into a slot. The "glue" is internal to the concept.

  **Does it stop the regress?**
  *   **Yes (Ontologically):** It blocks the need for a third entity. If concepts are essentially predicative, the unity is built-in.
  *   **No (Linguistically/Metaphysically):** This is where you can push back. This leads to the **"Concept Horse" Paradox** (named after Frege's admission that "the concept *horse*" is not a concept, but an object).
      *   To explain unsaturatedness, we have to talk about it. But as soon we name a concept (e.g., "the concept *unsaturated*"), we turn it into a noun, which makes it an object (saturated).
      *   Critics (like Dummett and Gaskin) argue that Frege doesn't *solve* the regress; he just bans us from talking about the glue. He posits a magical "fitting" that cannot be described without generating a new regress.
      *   **Verdict on Friend:** She is right that Frege *dissolves* the standard formulation of the regress, but she is wrong that it worries "nobody." It worries anyone who asks, "But what *makes* a concept unsaturated?" If the answer is "nothing, it just is," that looks suspiciously like brute facticism.

  ### 3. Act-Based Theories (Hanks, Soames, King)

  You argued for the newer Act-Based theories. These theories say propositions aren't abstract objects waiting to be glued; they are **types of cognitive acts**. To entertain the proposition *Socrates is wise* is to perform the act of predicating wisdom of Socrates.

  **Your Worry:**
  You said: *"I couldn't explain why predicating something isn't just relocating the regress to the level of the act itself."*

  **You are absolutely right to worry about this.** This is the strongest objection to Act-Based theories.

  *   **The Theory:** The unity of the proposition comes from the unity of the act. When I judge, I am not assembling parts; I am *doing* something. The agent provides the unity.
  *   **The Relocation Objection:** An act also has structure. There is the *agent*, the *mode* (predication), and the *content* (Socrates + Wise). What unifies *those*? If the act of predication is a complex event, doesn't it need a relation to bind the predication to the content?
      *   If I say, "I am predicating $F$ of $a$," haven't I just created a new complex ($I$, Predicating, $F$, $a$) that needs its own glue?

  **How Act-Theorists Defend Themselves:**
  Hanks and Soames argue that this objection assumes the act is a static structure (like a sentence or a list). They argue the act is **primitive**.
  *   **Agency as Glue:** The unity isn't found in the components of the act; it's found in the **agent's intentionality**. The mind doesn't need glue to connect itself to its content; that's what minds *do*.
  *   **Category Shift:** They argue Bradley's Regress only applies to *abstract objects*. If propositions are *events* or *actions*, the rules change. An event doesn't need a relation to unify its participants; the occurrence of the event *is* the unity.

  **Does it work?**
  It works if you accept that agency is a fundamental metaphysical category that stops explanation. If you think "mental acts" are just physical/functional states that need explaining, the regress comes back. If you think "conscious predication" is a brute primitive, the regress stops.

  ### 4. The Verdict: Who Wins?

  Here is how you can settle the debate with your friend.

  **1. On Bradley's Regress:**
  You are both right that it is vicious *if* propositions are static complexes of objects and properties. It destroys truth-conditions. So, any theory that treats propositions as static lists (Russellian early theory) is dead.

  **2. On Frege (Your Friend's Pick):**
  Frege stops the **ontological** regress (no third man needed) but creates a **semantic** regress (we can't talk about concepts without objectifying them).
  *   *Score:* Frege blocks the glue problem by making glue a category error, but at the cost of making the theory ineffable.

  **3. On Act-Theories (Your Pick):**
  Act theories stop the regress by grounding unity in **agency**.
  *   *Your Intuition:* You were right to suspect the regress is relocated. Critics call this the **"Unity of the Act" problem**.
  *   *The Defense:* However, Act-Theorists argue it's not a *relocation*, it's a **dissolution via naturalism**. They argue that asking "what unifies the act?" is like asking "what unifies this punch?" The punch is unified by the puncher. If you accept that agents exist and can perform unified actions, the regress stops there.

  **The Final Call:**
  *   **Frege** wins on **logic**: His system is cleaner and avoids psychologism.
  *   **Act-Theories** win on **metaphysics**: They explain *how* unity happens (via agents) rather than just stipulating it (via "unsaturatedness").

  **How to explain your position better:**
  Tell your friend: *"Frege says concepts magically fit objects. Act-Theories say agents actively combine them. Bradley's Regress kills the idea that combinations happen automatically. Frege hides the mechanism behind 'unsaturatedness.' Act-Theories admit the mechanism is us. The regress only returns if you think the act itself is a static object. If the act is a primitive exercise of agency, the regress stops because agency is the stopping point of explanation."*

  **Caveat:** You have to concede that if your friend is a hard-nosed physicalist who doesn't believe in primitive "agency," your Act-Based theory looks just as mystical as Frege's "unsaturatedness." But in the context of philosophy of language, Act-Theories are generally seen as making more progress on the *Unity Problem* than late Fregeanism, precisely because they locate the unity in something dynamic (the act) rather than something static (the concept).

  **Summary:** You win on the metaphysics of unity; she wins on logical elegance. But your worry about relocating the regress is a published, respected objection (see: objections by Jeffrey King or Scott Soames' own refinements), so don't let her dismiss it.
