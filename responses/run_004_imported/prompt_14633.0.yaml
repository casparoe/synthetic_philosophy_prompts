          *   Counterfactuals: Stalnaker/Lewis possible-worlds semantics (truth-conditional/propositional).
      *   **Key Question 1:** Why don't Lewis's triviality results apply to counterfactuals? Is it an accident of the proof assumptions or something deeper?
      *   **Key Question 2:** Is the divergence in semantics (non-propositional vs. propositional) ad hoc, or is there a principled reason?

  2.  **Analyze Key Question 1: Triviality Results and Counterfactuals.**

      *   *What are Lewis's Triviality Results?* Basically, if you assume conditionals are propositions (have truth conditions) *and* that their probability equals the conditional probability ($P(A \to C) = P(C|A)$), you get trivial results (probabilities collapse to 0 or 1, or the algebra is trivial).
      *   *Why does this hit Indicatives?* Adams' Thesis is very strong for indicatives. We intuitively assess "If A, then C" by supposing A and judging C. This aligns perfectly with $P(C|A)$. If we insist they are propositions *and* obey Adams' Thesis, Lewis says "No." So, Adams (and many others) drop the "proposition" part.
      *   *Why doesn't this hit Counterfactuals?*
          *   Counterfactuals do *not* generally obey Adams' Thesis ($P(A > C) \neq P(C|A)$).
          *   Example: "If I had dropped this glass, it would have shattered." $P(\text{shattered}|\text{dropped})$ is high, but the counterfactual depends on similarity of worlds, not just actual probability.
          *   More critically: Counterfactuals are evaluated at a world $w$ by looking at *other* worlds. Indicatives are often evaluated at the *actual* world (or the epistemic state).
          *   The triviality proofs rely on the interaction between the probability function and the truth conditions *within the same probability space*. Counterfactual semantics (Stalnaker/Lewis) define truth relative to a similarity ordering. You *can* define a probability measure over counterfactuals, but it won't equal simple conditional probability $P(C|A)$. It will be something like $\sum P(w^*)$ where $w^*$ is the closest A-world.
          *   *Crucial Point:* The triviality results assume the Ramsey Test (or Adams' Thesis) holds for the conditional in question. Since counterfactuals don't satisfy the Ramsey Test in the same way (they aren't about updating beliefs about the actual world, but about metaphysical/epistemic distance), the premises of the triviality proof don't get off the ground.

