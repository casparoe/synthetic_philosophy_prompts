answer: |-
  This is one of the deepest and most persistent puzzles in the philosophy of language. You have correctly identified the fault line: the Oswald/Kennedy pair suggests a semantic divergence, and the standard theoretical response (Adams for indicatives, Stalnaker/Lewis for counterfactuals) looks suspiciously dualistic.

  Here is the breakdown of why the triviality results spare counterfactuals, and whether the resulting semantic dualism is principled or ad hoc.

  ### 1. Why Triviality Results Don't Touch Counterfactuals

  To see why Lewis's triviality results devastate the propositional view of indicatives but leave counterfactuals unscathed, we have to look at the **premises** of the triviality proof.

  **The Triviality Engine**
  Lewis's triviality results (1976) essentially show that you cannot hold the following three claims simultaneously:
  1.  **Propositionality:** Conditionals express propositions (they have truth conditions).
  2.  **The Probability Equation (Adams' Thesis):** The probability of the conditional equals the conditional probability: $P(A \to C) = P(C|A)$.
  3.  **Closure:** The set of propositions is closed under standard Boolean operations and conditionalization.

  If you accept (1) and (3), Lewis proves that (2) leads to triviality (i.e., agents can only have credences of 0 or 1). Since we obviously have non-trivial credences in conditionals, and (3) is basic probability theory, the standard move is to reject (1) for indicatives.

  **Why Counterfactuals Escape**
  Counterfactuals escape this trap because **they do not satisfy premise (2).**

  For indicative conditionals, the Ramsey Test feels intuitive: to assess "If A, C," you hypothetically add A to your stock of knowledge and see if C follows. This aligns perfectly with conditional probability $P(C|A)$.

  For counterfactuals ("If A had been, C would have been"), this alignment breaks down. The truth of a counterfactual is determined by **similarity relations between possible worlds**, not by your current epistemic probability distribution.

  *   **Example:** Consider a fair coin that I actually flipped, and it landed Heads.
      *   **Indicative:** "If it landed Heads, it landed Heads." Probability = 1.
      *   **Counterfactual:** "If I had flipped the coin, it would have landed Heads."
      *   **The Mismatch:** Your conditional probability $P(\text{Heads} | \text{Flip})$ is 0.5. But on a Lewis/Stalnaker semantics, the counterfactual is **false**. Why? Because in the closest worlds where you flip the coin, it does not land Heads in *all* of them (some closest worlds have Tails). Since the counterfactual requires truth in *all* closest A-worlds, its truth value is False, even though the conditional probability is 0.5.

  Because $P(A > C) \neq P(C|A)$ generally holds for counterfactuals, the specific engine of Lewis's triviality proof cannot start. You can treat counterfactuals as standard propositions (sets of possible worlds) because their "probability" is derived from the measure of the set of worlds where they are true, which does not need to map onto the conditional probability of the consequent given the antecedent.

  **The Deeper Reason:**
  Indicatives are evaluated relative to an **epistemic state** (what is compatible with what we know). Counterfactuals are evaluated relative to a **similarity ordering** (what is metaphysically close to actuality). Lewis's triviality results assume the conditional's truth conditions shift with the probability function (the epistemic state). Counterfactual truth conditions are rigid with respect to the similarity ordering, regardless of your credence.

  ### 2. Is the Divergence Ad Hoc?

  It certainly *feels* ad hoc to say: "Indicatives are non-propositional probability shifts, but counterfactuals are propositional world-selectors." However, there are principled stories for why this divergence exists, mostly revolving around the **function** of the two moods.

  #### A. Epistemic vs. Metaphysical/Causal
  The most robust defense of the dualism is that indicatives and counterfactuals are doing different jobs.
  *   **Indicatives (Epistemic):** These are tools for reasoning within a knowledge state. They are about information flow. "If Oswald didn't kill Kennedy, someone else did" is true because our knowledge base includes "Kennedy was killed." If we subtract Oswald, the remainder of the knowledge base entails "someone else." This is why they track conditional probability.
  *   **Counterfactuals (Metaphysical/Causal):** These are tools for exploring causal structure or modal space. "If Oswald hadn't killed Kennedy, someone else would have" makes a claim about the stability of the assassination plot across nearby possible worlds. It is not about what follows from our knowledge; it is about how the world works.

  Because one tracks **evidence** and the other tracks **similarity/causation**, it makes sense that they have different semantic values. One is a constraint on belief (Adams), the other is a constraint on world-selection (Stalnaker/Lewis).

  #### B. Unified Accounts (Stalnaker & Kratzer)
  It is worth noting that not everyone accepts the hard dualism you described. Some philosophers argue the divergence is less radical than it appears.

  *   **Stalnaker's Unified Theory:** Robert Stalnaker actually argued that **both** indicatives and counterfactuals are propositions. He avoids Lewis's triviality results not by denying propositionality for indicatives, but by arguing that the *context* changes when we evaluate them. For indicatives, the context restricts the domain of quantification to epistemically possible worlds. For counterfactuals, it expands to metaphysically possible worlds. On this view, the "Adams Thesis" is a pragmatic phenomenon, not a semantic one.
  *   **Kratzer's Modal Semantics:** Angelika Kratzer provides a unified syntax where both are modals. The difference lies in the **Modal Base** and **Ordering Source**.
      *   **Indicatives:** Epistemic modal base (what is known) + Stereotypical ordering source (what normally happens).
      *   **Counterfactuals:** Circumstantial modal base (facts about the situation) + Similarity ordering source.
      *   In this framework, the "non-propositional" nature of indicatives is often re-interpreted as context-dependence. The proposition expressed changes depending on the speaker's information state.

  #### C. The Gibbard Phenomenon
  There is another logical reason the divergence might be necessary. Allan Gibbard (1981) proved that if indicative conditionals express propositions and validate the principle of **Import-Export** ($(A \to (B \to C)) \equiv ((A \land B) \to C)$), they collapse into the material conditional.
  *   Counterfactuals famously **fail** Import-Export. (It is not true that "If (if A had been, B would have been), then C" is equivalent to "If (A and B had been), then C").
  *   Indicatives seem to **validate** Import-Export.
  This logical difference suggests they really *are* different kinds of operators, lending weight to the idea that they need different semantic treatments.

  ### Summary

  1.  **Why Triviality Spares Counterfactuals:** Lewis's triviality results rely on the assumption that $P(\text{Conditional}) = P(\text{Consequent}|\text{Antecedent})$. Counterfactuals do not obey this equation because their truth depends on similarity orderings across worlds, not just epistemic conditionalization. Therefore, the proof's premises don't apply.
  2.  **Is it Ad Hoc?** It is not arbitrary, but it is dualistic. The principled story is that **indicatives are epistemic** (tracking uncertainty and information update) while **counterfactuals are metaphysical** (tracking causal structure and world similarity).
      *   If you force them into the same box (e.g., Stalnaker), you have to explain away the probability intuitions as pragmatic.
      *   If you keep them separate (Adams vs. Lewis), you respect the intuitions but fracture the semantics.

  Most contemporary semanticists lean toward a **unified syntax with parameter variation** (like Kratzer), which acknowledges the divergence without positing two entirely different logical categories. However, the tension you noticed remains: the "If" in English seems to be doing two very different jobs depending on the mood of the verb.
