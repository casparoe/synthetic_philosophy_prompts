prompt: |-
  So this week in my modal metaphysics seminar we finally got to the showdown between Lewis's counterpart theory and the more "orthodox" transworld identity view — we read the counterparts chapter of *On the Plurality of Worlds* against Kripke's footnote about Humphrey in *Naming and Necessity* (13, I think?), plus a chunk of Plantinga on individual essences for the other side. I feel like I get each side's opening move but not how they'd actually hold up under pressure from the other, if that makes sense. Like Kripke's line that it's not really Humphrey who wins in the other world, just some guy who resembles him, feels pretty devastating on first read, but I can't tell if Lewis has an actual comeback to that or if he's just biting the bullet.

  Could you write me a dialogue between a counterpart theorist and a transworld identity theorist arguing about whether Humphrey himself could have won the '68 election (or swap in a cleaner example if that one's too worn out at this point)? I want the identity theorist to press the Humphrey objection as hard as it deserves, but then actually have to answer the obvious comeback: okay, so what DOES ground strict identity of one and the same individual across worlds, if not either brute unanalyzed sameness or a Plantinga-style individual essence that's basically just doing the counterpart relation's job under a different name? And don't let the counterpart theorist off easy either — someone should bring up the fission-type cases where a person ends up with two equally good counterparts in a single other world, and the identity theorist should push on whether that's really a fine feature of the view or a symptom that the counterpart relation was never tracking identity-relevant facts to begin with. Basically I don't want either of them to just restate their one-paragraph SEP-summary version and stop — I want them genuinely stuck responding to each other's strongest arguement, the way it'd actually go if two people who'd each written their dissertation on this were arguing about it at a conference bar.
reasoning: |-
