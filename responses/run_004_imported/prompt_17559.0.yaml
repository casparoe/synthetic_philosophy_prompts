answer: |-
  The air in the corridor tasted of recycled ozone and stale panic. Ren leaned against the cold bulkhead, his breath hitching in his throat. The heavy blast door behind him was sealed tight, locking away the corporate vault, the data drive burning a hole in his pocket, and the security teams that would be swarming in ten minutes.

  He was out. He was alive.

  On his wrist comp, a single window blinked open. It was a transfer request. Forty percent of the data's street value. Payable to Orla.

  Ren stared at the numbers. Forty percent was a fortune. It was enough to buy a new identity, a ticket off-world, a lifetime of quiet. Zero percent was better. Zero percent meant he kept it all.

  He tapped the comms link. "Orla. I'm clear."

  "Good," her voice came through, smooth and devoid of static. She was sitting in a van three sectors away, safe behind layers of encryption and bribed officials. "Send the share."

  Ren's thumb hovered over the *Decline* button.

  This was the math. It was simple arithmetic. Orla had already done her part. She had bypassed the lockdown, disabled the sensors, and cracked the outer seal. She had no leverage left. She couldn't lock him back in. She couldn't shoot him from here. If he hit *Decline*, he walked away with everything. If he hit *Accept*, he lost nearly half his score.

  A purely rational agent maximizes utility. Ren was alive. The data was secured. Paying Orla reduced his utility. Therefore, the rational move was to ghost her.

  But Ren remembered the conversation before he went in. He remembered standing in the rain outside the drop point, shivering, while Orla looked at him through the scope of a facial recognition algorithm.

  "I'm not hiring you because you're skilled, Ren," she had said. "I'm hiring you because you're predictable."

  "I don't like being predictable."

  "You should. In this line of work, unpredictability is just another word for 'untrustworthy.' I need to know what happens after you walk out that door."

  "You want my word?"

  "I don't want your word. Words are cheap. I want your source code." She had tapped her temple. "I've run the simulation. I know how you think. I know that when you're backed against the wall, you bargain. But when you're safe? That's where the variable lies."

  She had leaned in then, her eyes cold. "Here is the condition: I will open the door only if I am certain you will pay. If I detect even a micro-expression of deceit, I walk away. You stay in the vault. You die when security arrives. I only open the door for the version of you that pays."

  Ren had swallowed hard. He hadn't lied. He couldn't. He knew she could read the pulse in his neck, the dilation of his pupils. He had nodded. She had opened the door.

  Now, standing in the sterile corridor, Ren looked at the blinking cursor.

  If he declined, he kept the money. But if he declined, he proved Orla's simulation wrong. He proved that she had made a mistake in letting him out. But she hadn't made a mistake. She was the best fixer in the sector. She wouldn't have opened the door unless she was sure.

  So, if he declined, it meant he wasn't the person she let out. It meant he was a different person. A person who lies. A person who dies in vaults.

  It was a loop. To be the man standing in this corridor, breathing free air, he had to be the man who paid. If he became the man who didn't pay, he logically ceased to be the man who was saved.

  It wasn't about morality. It wasn't about honor. It was about consistency. It was about being the kind of agent that gets picked up in the desert.

  The sirens began to wail in the distance, growing louder. Security was coming. He needed to move.

  Ren's thumb trembled. The urge to keep the credits was a physical ache, a greedy hunger in his gut screaming that he was safe now, that the threat was gone, that he could win everything.

  *If you don't pay,* he thought, *you're dead.*

  Not literally. Not today. But the next time? The time after that? The reputation isn't about what others know; it's about what you are. If he broke the logic now, he broke the mechanism of his own survival. He would be a glitch. And glitches get patched out.

  He exhaled, a long, shaky breath that fogged the screen for a second.

  "Ren?" Orla's voice cut through the silence. "Clock's ticking."

  "I know," Ren said.

  He didn't feel noble. He felt trapped, not by the vault, but by the geometry of the situation. The only way out was through the promise.

  His thumb moved. He didn't hit *Decline*.

  He pressed *Accept*.

  The credits vanished from his account, transferring instantly to an untraceable shell. His balance dropped by forty percent. He was poorer. He was lighter.

  "Received," Orla said. There was no relief in her voice, only confirmation. "Extraction point is marked on your map. Don't be late."

  The line went dead.

  Ren shoved the wrist comp into his jacket and started running toward the extraction point. He didn't look back at the vault. He didn't celebrate the loss. He just ran, consistent all the way to the bone.
