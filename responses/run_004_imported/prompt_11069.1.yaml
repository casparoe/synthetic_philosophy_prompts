answer: |-
  **Montmorency, Autumn 1758**

  **The Setting:** *A gravel path in the garden of the Hermitage. The leaves are turning, crisp underfoot. JEAN-JACQUES ROUSSEAU walks with a stiff gait, his Armenian coat buttoned tight against the chill. DENIS DIDEROT follows, larger, breathless, holding a copy of the newly printed* Letter to d'Alembert *as if it were a wounded bird.*

  **DIDEROT:** You write as though I am an enemy, Jean-Jacques. As though the *Encyclopédie* is a conspiracy against Geneva.

  **ROUSSEAU:** I write as a citizen. You asked for my thoughts on d'Alembert's article. I gave them. If the truth sounds like a declaration of war, it is because peace was purchased with silence.

  **DIDEROT:** *(Stopping, gesturing with the pamphlet)* But this? You call the theater a school of vice. You say we pay to feel pity so we need not act it. It is a brilliant paradox, I grant you, but is it true? When a man weeps for Philoctetes abandoned on his island, does his heart not soften? Does that tear not water the seed of compassion?

  **ROUSSEAU:** It waters the seed, Denis, and then drowns it. That is the danger. In the theater, virtue is complete in itself. I have wept for the suffering hero. I have condemned the villain in my heart. I leave the playhouse feeling excellent about my own sensitivity. I have paid my ticket; I have paid my moral due. Why, then, should I trouble myself with a beggar shivering in the street outside? I have already done my good deed for the day. I have felt *for* him, so I need not do *with* him.

  **DIDEROT:** You reduce the soul to a ledger. As if emotion were a currency spent. I say the heart is a muscle. If it is not exercised, it atrophies. The common man is coarse; his life is hard labor. He does not encounter high tragedy in the fields. The stage brings suffering to him, abstracted, refined, so that he may recognize it. It teaches him to name his own pain and the pain of others. Without that mirror, he is alone with his brute instincts.

  **ROUSSEAU:** A mirror that shows only illusions! And who holds the glass? The actor. Here is my true objection, Denis, and I beg you to weigh it. To be an actor is to make a trade of one's person. It is to stand outside oneself, to study how to feign passion, to calculate the tear, to measure the sigh. Is this not the corruption of the self? If a man spends his days pretending to be others, what becomes of his own soul? He becomes a hollow thing, a vessel for whatever passion the crowd pays to see. In a republic, we need men who are transparent, whose faces match their hearts. The actor is a professional liar.

  **DIDEROT:** *(Pacing, agitated)* You speak of the actor as a demon. I speak of him as a public servant. You want transparency? Look at the court at Versailles. *There* is lying. *There* is masking. The courtier smiles while he poisons. The actor, at least, admits the mask. He says, "I am playing a role." And in playing that role, he may speak truths the courtier dares not whisper. When a bourgeois sees a father mistreated on stage, he goes home and kisses his own father's hand. The fiction corrects the reality.

  **ROUSSEAU:** *(Pausing, looking at Diderot intently)* I will concede this: I have seen plays that moved me. I am not made of stone. When the representation is perfect, the illusion is total, and for two hours, we are better than we are in life. But, Denis, what happens when the lights go out? The illusion breaks. We return to ourselves. And if we have grown accustomed to living through illusions, do we not find our real lives dull? Do we not begin to prefer the passion of the stage to the quiet duty of the home?

  **DIDEROT:** *(Softening)* I concede that much. The commercial theater, yes. When it is merely a business, selling spectacle to idle rich who sit in boxes to be seen rather than to see... that is a brothel of the spirit. I agree with you there. If the theater is only a place for the idle to consume emotion, it is a narcotic.

  **ROUSSEAU:** Then we agree it is dangerous.

  **DIDEROT:** No. We agree it is *dangerous if poorly constituted*. My *drame bourgeois*—the serious drama I am formulating—it does not ask for kings and heroes. It asks for fathers, merchants, sons. It brings the moral stakes down to the earth. It does not ask the audience to marvel at distance, but to recognize proximity. You say the actor counterfeits himself. I say the actor sacrifices his privacy so the public may see its own conscience. Is that not a kind of civic duty?

  **ROUSSEAU:** A duty that requires him to lose his name. But let us speak of the audience. You speak of Paris. I speak of Geneva. You say your theater is for a great city, a metropolis of strangers. I say a great city of strangers is already a sickness. In Paris, no one knows his neighbor. So you need a theater to gather them in the dark, to make them feel together what they cannot speak together.

  **DIDEROT:** And what is your alternative? You propose... festivals?

  **ROUSSEAU:** I propose life. Plant a stake in the ground in the public square. Gather the people in the open air. Let them sing, let them dance, let them compete in games. No tickets. No boxes. No distinction between who performs and who watches. Let everyone be the spectacle to one another. In that moment, there is no actor counterfeiting a self, and no spectator paying to be absolved. There is only the community, recognizing itself. That is transparency. That is liberty.

  **DIDEROT:** *(Laughing, but without malice)* Jean-Jacques, you are a dreamer. A sublime dreamer. You describe a village wedding. It is beautiful. But try it in Paris. Try to gather three hundred thousand souls in a field. They will trample one another. They will not sing; they will riot.

  **ROUSSEAU:** Then Paris is too big to be free.

  **DIDEROT:** *(Sharp)* That is an easy answer for a man in the country. "If the city does not fit your philosophy, shrink the city." But people are here. They are crowded. They are suffering. They need a place to go where they are not working, where they are not begging, where they can sit and be moved by a story that suggests their suffering is shared. You want to replace the theater with a folk dance. I tell you, a tired porter does not want to dance. He wants to sit in the dark and weep for a king, because it allows him to weep for himself without shame.

  **ROUSSEAU:** *(Quietly)* I do not deny the porter's weariness. I pity it. But does the theater cure it? Or does it merely make the weariness pleasant? You offer them a respite. I offer them a cure. The cure is to make the city small enough, or the bonds strong enough, that the porter does not need to weep in the dark. He needs to be known in the light.

  **DIDEROT:** And until that day comes? Until you remake the geography of Europe and the nature of commerce? Do we deny them the stage? Do we tell the playwright, "Your work is vice"? I cannot do that. I believe that words can change men. I believe that if I write a play where a virtuous act is shown to be difficult but beautiful, a young man in the third row might choose virtue tomorrow.

  **ROUSSEAU:** And I believe that if you teach him to applaud virtue on stage, he will be satisfied with the applause. He will think the feeling is the deed.

  *(A long silence falls between them. The wind rustles the dry leaves.)*

  **DIDEROT:** You know, Jean-Jacques... when I read your passage on the actor, I felt a chill. Not because it was wrong, but because I feared it was true for some. I have seen actors who are nothing off-stage. Hollow. If the theater makes a man a stranger to himself, that is a high price.

  **ROUSSEAU:** And I... I must admit, when I saw *The Merchant of Venice* years ago, before I turned from the world... I felt a kinship with the audience. A shared breath. For a moment, we were not strangers. If your "serious drama" can achieve that without the artifice of kings and gods, without the corruption of the boxes and the loges... perhaps it is not entirely a lie.

  **DIDEROT:** It is not a lie. It is a rehearsal.

  **ROUSSEAU:** A rehearsal for what?

  **DIDEROT:** For being human. We are not born knowing how to feel. We must be taught. If the stage is the school, and the festival is the holiday... perhaps we need both. But you will not allow it. You demand the holiday every day.

  **ROUSSEAU:** Because the school is a cage. Even a gilded one.

  **DIDEROT:** *(Sighing, handing the pamphlet back to Rousseau)* You will not publish this?

  **ROUSSEAU:** It is already printed.

  **DIDEROT:** *(Nods slowly)* Then the break is real.

  **ROUSSEAU:** The break is in the world, Denis. Not necessarily between us. I fight for the man who cannot afford the ticket. You fight for the man who needs the story.

  **DIDEROT:** I fight for the man who needs to know he is not alone in the dark.

  **ROUSSEAU:** And I fight to bring him into the light, even if he finds it blinding.

  *(Diderot turns to leave, then stops.)*

  **DIDEROT:** Your festival... in Geneva. If it works. If they truly sing together, and no one watches... send word. I should like to know if it is possible.

  **ROUSSEAU:** If it works, Denis, you will not need to send word. You will hear the singing.

  *(Diderot nods, a heavy, sad nod, and walks down the path. Rousseau remains, looking at the pamphlet in his hand, then up at the gray sky, alone.)*
