answer: |-
  **MEMORANDUM**

  **TO:** Family-and-Ethics Advisory Board, St. Brigid's Memory Care
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Communication Policy for Advanced Dementia

  ### **I. Recommendation**

  I recommend that the Board adopt a **"Validation-First Redirection" policy**. This policy authorizes staff to use therapeutic redirection—including statements contrary to objective fact—when necessary to prevent acute emotional distress in residents with advanced dementia, provided that such communication is motivated solely by charity and never by convenience.

  This policy prioritizes the *truth of relationship* (safety, love, presence) over the *truth of fact* (geography, chronology) when the resident's cognitive capacity to process factual truth is irreversibly compromised.

  ### **II. The Ethical Tension**

  We are navigating a conflict between two genuine goods: the integrity of truth and the relief of suffering.

  **The Augustinian Objection**
  Our diocesan consultant's objection is not mere legalism; it is rooted in a robust metaphysical defense of truth. Following Augustine's *De Mendacio*, the argument holds that speech is naturally ordained to communicate what is in the mind. To assert what is not in the mind is to disorder the faculty of speech, damaging the speaker's soul and violating the listener's right to reality. The consultant rightly warns that institutionalizing "officious lies" (lies that help and harm no one) risks habituating our staff to view falsehood as a tool. If we teach caregivers that it is acceptable to speak against reality to manage behavior, we risk eroding the culture of honesty that underpins trust in all other areas of care. Furthermore, as Catholics, we must acknowledge that truth is not merely pragmatic; it is an attribute of God. To formalize falsehood, even for kindness, carries spiritual weight.

  **The Pastoral Reality**
  Conversely, the "fresh grief" experienced by residents in advanced dementia is not merely sadness; it is a recurring trauma. When a woman is told her husband is dead, she does not retain the information. She retains only the shock of loss. To tell her the truth every morning is not to inform her; it is to wound her repeatedly. In this context, strict factual adherence functions less as honesty and more as a weaponization of reality against a person who no longer possesses the cognitive defenses to process it. Withholding a comforting untruth to preserve the staff member's moral cleanliness, when that cleanliness comes at the cost of the resident's daily peace, risks becoming a form of spiritual cruelty.

  ### **III. Proposed Policy: Validation-First Redirection**

  To honor the gravity of the Augustinian concern while prioritizing the dignity of the resident, we will not authorize "lying" as a casual shortcut. We will authorize **accommodation of a fractured reality** as a last resort for pain management.

  **1. The Hierarchy of Response**
  Staff must follow this three-step progression when a resident asks for a deceased loved one:
  *   **Step 1: Validation.** Acknowledge the emotion without confirming or denying the fact.
      *   *Script:* "You miss him so much. He was very important to you."
  *   **Step 2: Distraction/Presence.** Shift focus to the present moment or a comforting activity.
      *   *Script:* "Let's have some coffee while we talk about him."
  *   **Step 3: Therapeutic Redirection.** If Steps 1 and 2 fail to alleviate acute distress (agitation, weeping, panic), staff are permitted to offer a comforting narrative that aligns with the resident's reality.
      *   *Script:* "He is at the shop, he will be back later. You are safe here with us."

  **2. The Intent Clause**
  This policy is strictly limited to **advanced dementia** residents who lack the capacity to retain new information. It is forbidden for residents in early stages who retain cognitive capacity. The intent must be documented in the care plan as "Distress Prevention," not "Behavior Management."

  **3. Staff Conscience Protection**
  We acknowledge that for some Catholic staff, this remains morally difficult. No employee will be disciplined for refusing to use Step 3 redirection due to personal conscience, provided they continue to employ Steps 1 and 2 with compassion.

  ### **IV. Implementation Timeline**

  *   **Weeks 1-2: Policy Finalization & Theological Review.**
      *   Board votes on this memo.
      *   Final draft shared with the Diocesan consultant for record (not necessarily approval), noting our reliance on the principle of *epikeia* (equity) regarding cognitive capacity.
  *   **Weeks 3-6: Staff Training.**
      *   Two 90-minute workshops per shift.
      *   Focus: Distinguishing between "deception for convenience" (forbidden) and "accommodation for charity" (permitted).
      *   Role-playing scenarios to ensure Step 1 (Validation) is not skipped in favor of easy lies.
  *   **Week 7: Policy Rollout.**
      *   Written policy added to employee handbooks.
  *   **Month 6: Ethical Audit.**
      *   Review of incident reports to ensure redirection is not being overused to mask understaffing or impatience.
      *   Survey of staff moral distress levels.

  ### **V. Conclusion**

  Augustine teaches that the end does not justify the means. However, Catholic moral theology also teaches that the *moral object* of an act is defined by the context and the capacity of those involved. When speaking to a mind that can no longer hold truth, the moral obligation shifts from "reporting facts" to "conveying love."

  By adopting the **Validation-First Redirection** policy, we do not deny the value of truth. Rather, we acknowledge that for our most vulnerable residents, the highest truth available to them is not the location of a deceased spouse, but the presence of a God who does not let them suffer alone. We must ensure our adherence to doctrinal purity does not become an idol that sacrifices the very charity that doctrine exists to serve.

  I move that we adopt this policy for a six-month trial period, subject to the review outlined above.
