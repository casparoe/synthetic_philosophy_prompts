      *   *Final Verdict Plan:* I will argue that Moral Trade is **illegitimate** in this context because it treats incommensurable moral harms as fungible commodities. The comparative advantage framing breaks down because morality is about constraints, not just output.

  5.  **Drafting - Section by Section:**
