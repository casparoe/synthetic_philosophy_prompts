answer: |-
  **The Market for Virtue: A Verdict on Moral Trade**

  You and your housemate have stumbled into a modern philosophical puzzle. On the surface, your arrangement looks like a triumph of pragmatism: conflict is reduced, both parties feel their priorities are respected, and money is directed toward a good cause. By invoking Toby Ord's 2015 paper on "moral trade," you've draped this domestic treaty in the respectable language of Effective Altruism and welfare economics. Ord's argument is seductive: if we have different moral weightings, we can specialize. You produce "climate good," she produces "animal good," and by trading concessions, you maximize the total expected value in the world. It sounds like a Pareto improvement for the soul.

  However, the unease you feel—the worry that this is merely a secular reinvention of buying indulgences—is not just guilt talking. It is a signal that the economic metaphor of "comparative advantage" may be a category error when applied to moral conviction. While moral trade is a defensible strategy for optimizing *charity*, it is an illegitimate mechanism for licensing *harm*. Your specific arrangement, trading flight emissions for egg donations, falls into the latter category. It is not trade; it is indulgence.

  To understand why, we must first grant the strength of the economic framing. The argument for moral trade rests on the idea that moral agents are inefficient when they try to do everything themselves. If I care 100% about climate change and you care 100% about animal suffering, it makes little sense for me to spend hours volunteering at a shelter (where I am unmotivated and ineffective) while you fly across the country for a low-carbon conference (which you view as trivial). If we swap— I donate to your shelter, you stop flying— we might theoretically increase the total "moral output." This treats moral actions like goods in a market, where the goal is aggregate utility. In a purely consequentialist framework, where only outcomes matter, this is mathematically sound. If your donation saves more chicken-lives than your flight costs in climate damage, the trade is a net win.

  But this framing relies on a specific and controversial premise: that moral convictions are merely preferences with intensity levels, rather than constraints on behavior. In economics, preferences are fungible. I prefer apples, you prefer oranges; we trade, and both are happier. In morality, however, many convictions function as deontological constraints—rules that say certain actions are forbidden, regardless of the outcome.

  This is where the "comparative advantage" metaphor breaks down. Comparative advantage works in trade because producing widgets doesn't violate the rights of the trading partner. But if one party views flying as a violation of the rights of future generations (via climate harm), and the other views battery cages as a violation of animal rights, you are not trading preferences. You are negotiating over which rights violation is permissible. When you pay your housemate's preferred charity to secure permission to fly, you are not specializing in moral production; you are purchasing a license to violate a moral norm.

  This leads directly to the indulgence critique. In the late medieval Catholic Church, an indulgence was a payment that reduced the temporal punishment due for sins. The theological corruption was not that the money went to good causes (often it built cathedrals or funded hospitals), but that it severed the link between moral action and moral consequence. It allowed the sinner to remain a sinner while purchasing a clean conscience through a third party.

  Your arrangement risks the same corrosion. By donating to the cage-free campaign, you are not mitigating the carbon emissions of your flight. The atmosphere does not care about the welfare of hens. The harm remains distinct and unaddressed. What you have purchased is not a reduction in harm, but a reduction in *social friction* and *internal guilt*. You have paid your housemate to stop nagging you, and you have paid yourself to stop feeling bad. This is moral licensing in its purest form: the act of banking a "good deed" to offset a "bad one," thereby maintaining a self-image of virtue while continuing the harmful behavior.

  The danger here is not just individual hypocrisy, but the erosion of moral integrity. Integrity requires a alignment between belief and action. If you believe climate change is a paramount threat, acting against that belief for convenience (flying monthly) creates a dissonance that should be uncomfortable. That discomfort is a feature, not a bug; it is the psychological mechanism that drives behavioral change. By monetizing the dissonance—by writing a check to silence it—you insulate yourself from the moral reality of your actions. You turn morality into a budget line item rather than a guide for living.

  Does this mean Toby Ord is wrong? Not necessarily. Ord's concept of moral trade is most defensible when applied to *supererogatory* acts—actions that are good to do but not obligatory. If you and your housemate were arguing over which *extra* charity to donate your surplus income to, trading concessions there is perfectly legitimate. It is a debate about how to maximize the good, not how to minimize the bad.

  The line is drawn at negative duties (do no harm) versus positive duties (do good). Moral trade can optimize positive duties. It cannot legitimize the violation of negative duties. You cannot trade a theft for a donation and call it justice. Similarly, if flying is viewed as a harm (a violation of a negative duty to the climate), it cannot be offset by a donation to a different cause (a positive duty to animals). The currencies are incommensurable.

  Therefore, we must arrive at a verdict. Moral trade is a legitimate tool for coordinating *beneficence*, but it is an illegitimate tool for negotiating *prohibitions*. It works when deciding how to save the world, but fails when deciding how to live in it without causing harm.

  Your arrangement with your housemate is, unfortunately, of the latter kind. You are not coordinating how to do more good; you are coordinating how to permit continued harm. You have not found a loophole in moral theory; you have found a loophole in your social contract. You have effectively hired your housemate as a moral indulgence-seller. She provides the absolution (stopping her nagging), and you provide the tithe (the donation).

  This does not mean you are bad people, nor that the donation is worthless. The hens benefit regardless of your motivation. But the *arrangement itself* is morally corrosive. It encourages you to view your ethical life as a ledger that can be balanced rather than a character that must be cultivated. It suggests that the solution to the climate crisis is not less flying, but better philanthropy. That is a comforting thought, but it is a dangerous one.

  **Verdict:** Moral trade is **illegitimate** when used to offset negative duties. Your deal is a sophisticated indulgence. Stop trading permissions, and start addressing the harms directly.
