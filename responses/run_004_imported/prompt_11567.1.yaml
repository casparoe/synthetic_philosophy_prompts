      *   *Better Verdict:* Moral trade is a dangerous tool that often functions as indulgence. It is defensible *only* when the traded actions are strictly supererogatory (extra good), not when they involve purchasing permission to commit recognized harms. In this specific case (flying), it's indulgence.
