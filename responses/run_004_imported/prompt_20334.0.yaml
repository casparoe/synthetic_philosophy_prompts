answer: |-
  Good evening. For those who don't know me, I had the privilege of being Mira and Dan's graduate advisor. And for those who *do* know me, you know exactly what kind of trouble starts when you put these two in the same room.

  They met in my Philosophy of Science seminar ten years ago. While other students were exchanging phone numbers, Mira and Dan were exchanging footnotes. Specifically, they spent a whole semester debating the ontology of special science kinds.

  Now, I need to be careful here. Half of you are nodding, and the other half is wondering if this is a cult. Let me translate.

  Dan is a reductionist. He believes that if you understand the smallest parts of a system—the physics, the chemistry, the fundamental rules—you can explain everything that happens above that level. To Dan, "emergence" is just a word we use when we haven't found the explanation yet. He likes ground truth. He likes bridge laws. He likes knowing that the foundation is solid.

  Mira, on the other hand, is a strong emergentist. She follows P.W. Anderson: "More is different." She believes that when you put enough parts together, new properties arise that literally cannot be predicted from the parts alone. Downward causation is real. The whole constrains the parts. To Mira, the map is not the territory, and sometimes the territory invents new land.

  They have not resolved this debate. I am not going to resolve it tonight. In fact, I am contractually obligated *not* to pretend that love somehow "transcends" their disagreement in some mystical, hand-wavy way. Dan would check my citations, and Mira would say I'm ignoring the causal powers of the institution itself.

  But here is what I have learned watching them for a decade.

  A marriage, it turns out, is the one system where both of them are right.

  Dan is right that a marriage is built of reducible parts. It is the specific texts returned on time. It is the dishwasher loaded correctly. It is the biology of sleep, the economics of a mortgage, the syntax of an apology. If you ignore the micro-level laws, the system crashes. You cannot sustain a life together on vague vibes alone. You need the bridge laws. You need to know how the parts work.

  But Mira is right that the relationship itself possesses properties that neither of them possesses alone. There is a "we" that is not just "Mira plus Dan." This union has a resilience, a history, and a character that cannot be found by scanning their individual brains. When they comfort each other, that is downward causation. The relationship itself changes the behavior of the individuals. The whole saves the parts.

  If they agreed completely, they would be bored. If Dan were purely rigid, he'd miss the surprise. If Mira were purely abstract, she'd miss the grounding. Instead, they keep each other honest. Dan keeps Mira from floating away into theory; Mira keeps Dan from reducing the world into something too small to hold the magic.

  To the family members here: You might think it's odd that a couple argues about metaphysics on a Friday night. But look at them. This intellectual friction is not a bug; it is the feature. They respect each other enough to not let the other get away with a bad argument. That kind of rigor is actually a profound form of intimacy. It means they believe the other person is worth the effort of precision.

  And to my former students, the phil crowd in the back: I know there are no bridge laws here yet. We don't have a derivation of "happily ever after" from the standard model. But we do have a stable system that has maintained homeostasis through job changes, moves, and dissertation crises. The data is robust.

  So, I am not going to toast to a resolution. I am not going to toast to the end of the debate.

  I want to toast to the tension.

  May your reductionism always find the details that need fixing.
  May your emergentism always find the beauty that can't be predicted.
  May you never accept a bridge law that doesn't hold, and never deny a new property just because you can't derive it.

  You are better together than you are apart. And for once, I think even Dan can agree that the sum is greater than the parts, even if he insists on knowing exactly why.

  To Mira and Dan.
