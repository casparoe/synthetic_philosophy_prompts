  If capacities are degrees, and rights are binary, the binary is arbitrary. If we remove the binary, we are weighing interests. That is Utilitarianism (or Prioritarianism).
  However, Nozick's doubt about "taste" suggests he thinks the Utilitarian calculus for animals yields the *wrong* result (too permissive). This suggests he wants *more* protection for animals.
