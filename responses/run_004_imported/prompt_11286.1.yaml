  Actually, a stronger verdict might be: It collapses into **arbitrariness**. It cannot be repaired.
  Let's go with: It collapses into incoherence, specifically failing to be a unified theory, and logically pressures toward a utilitarian weighting of interests, thereby abandoning the core libertarian innovation (side constraints).

  *Decision:* The verdict will be that the view is unrecoverable. It collapses into a form of interest-utilitarianism because the "degrees" problem dissolves the binary boundary required for side constraints.

