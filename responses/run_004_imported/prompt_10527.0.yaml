answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I work down the hall from Diane. Or, as Diane would prefer I say, I occupy an office space adjacent to hers in the shared vocabulary of our department.

  I have been asked to offer this toast, which presents a unique challenge. For thirty-six years, Diane and I have been the department's resident philosophical odd couple. I am a correspondence theorist. Roughly translated: I believe language works like a map, and its job is to match the territory. Diane, however, is a neopragmatist. She believes language works like a toolbox, and its job is to help us get things done.

  For over three decades, I have stood at faculty colloquia and argued that Diane's theories don't accurately reflect the nature of knowledge. And for over three decades, Diane has patiently explained that "accurately reflecting" is exactly the problem.

  So, standing here tonight, I realized I face a dilemma. The usual grammar of a farewell is deeply representationalist. We usually say things like, "We honor you for uncovering the truth," or "You saw the world as it really is," or "Your work got to the bottom of things." But if I say those things sincerely, Diane will spend her retirement writing footnotes correcting my eulogy. And if I say them ironically, her mother will think I'm being rude.

  So, I have decided to try, for just five minutes, to speak Diane's language. I want to praise her career in terms she might actually find useful.

  Diane, you have never claimed to discover what was already there. You never claimed to hold a mirror up to nature. Instead, for thirty-six years, you have offered us better ways to talk. When the rest of us were trying to dig down to foundations, you were weaving nets to catch new possibilities. You taught us that the point of inquiry isn't to settle a conversation once and for all, but to keep it going in ways that are more inclusive, more kind, and more productive.

  To the family and friends here who might be wondering what that means in plain English: It means Diane cared less about being "right" in an abstract sense, and more about whether her ideas helped people cope with their lives and treat each other better. She believed that truth isn't something you find under a rock; it's something you make together.

  This brings me to a specific quality of Diane's that I think everyone in this room recognizes, even if they haven't read Richard Rorty. In philosophy, an "ironist" is someone who fundamentally doubts their own final vocabulary. They know that the words they use are just tools, not absolute laws, and they are always open to swapping them for better ones.

  But in ordinary English, an "ironist" is someone with a dry, wry sense of humor.

  Diane is the only person I know who is a double ironist. She doubts her own final vocabulary constantly, and she also uses that vocabulary to make us laugh when we're taking ourselves too seriously. There is a profound solidarity in that. She never let us hide behind jargon, and she never let us hide behind pomposity.

  To her students: Diane didn't teach you to replicate her views. She taught you to find your own vocabulary. She didn't want disciples; she wanted conversation partners. She built a community of inquirers where the goal wasn't to win an argument, but to expand the "we." That is a legacy that doesn't need to correspond to reality to be real in its consequences. It is real because you are here, and because you are carrying it forward.

  To her family: You know this side of her best. You know that for Diane, philosophy wasn't about retreating from the world into a tower. It was about figuring out how to live in this world without being cruel. Her commitment to solidarity wasn't just academic; it was the way she lived her life.

  Diane, I have spent thirty-six years trying to convince you that your map doesn't match the territory. But tonight, I want to acknowledge that your tools built things mine never could. You built a department that is more thoughtful, more humble, and more generous than the one we started in. You helped us redescribe ourselves in ways that made us better colleagues and better friends.

  I know I cannot say, "Here's to the truth you found." I know I cannot say, "Here's to the reality you revealed." Those sentences would ruin the evening.

  So, instead, I will say this: Here's to the conversations you started, which we will continue. Here's to the vocabularies you gave us, which we will use to help each other. And here's to the solidarity you built, which remains useful, long after the arguments are over.

  To Diane.
