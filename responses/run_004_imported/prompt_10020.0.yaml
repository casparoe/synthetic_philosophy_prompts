  Okay, so the guest is a Cohen-style luck egalitarian. Cohen criticized Dworkin. The question is: Does the *Guest's* formulation (likely refining Cohen) fall into the trap Cohen set for Dworkin?
  *Trap:* Dworkin said you're responsible for tastes you identify with. Cohen said: What if you haven't had the chance to shed them? Or what if identification is itself influenced by luck?
  *Guest's Defense:* Access to Advantage focuses on the *opportunity* to avoid the disadvantage.
  *Challenge:* Is "opportunity" just as hard to measure as "identification"?
  *Follow-up:* If the state has to judge "genuine opportunity," aren't they making the same psychological judgments Dworkin was?

