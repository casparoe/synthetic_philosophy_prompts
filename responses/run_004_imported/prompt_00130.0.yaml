      *   **Rejection of Actual Infinity:** He opposed Cantor's transfinite sets. For Kronecker, infinity was a potential process, not a completed object.
      *   **Constructibility:** To say an object exists, you must be able to construct it (or provide an algorithm to find it) in a finite number of steps. Non-constructive proofs (proof by contradiction showing something *must* exist without showing *what* it is) were anathema to him.
      *   **Algebraic Focus:** His work was largely in algebra and number theory, where constructive methods are more natural.

  3.  **Analyze the Axiom of Choice (AC):**
