answer: |-
  This is an excellent set of objections. Your TA is presenting the standard "textbook" narrative—that Joyce's argument is the mature, purely epistemic successor to the pragmatic Dutch Book (DB) argument—but as you suspect, the reality is messier. The move from DB to Accuracy-Dominance (AD) shifts the burden of proof rather than eliminating it, and the structural similarities between the two arguments are deeper than the "pragmatic vs. epistemic" label suggests.

  Here is an assessment of your three points, structured to help you push back in section.

  ### 1. What "Nonpragmatic" Means, and Whether Joyce Earns It

  **The Definition:**
  In this context, a **pragmatic** argument justifies a norm of belief by appealing to the *practical consequences* of holding that belief (e.g., losing money, making poor decisions, being exploited). The DB argument says: "If your credences violate the probability axioms, there is a set of bets you will accept that guarantees a loss." The irrationality lies in the susceptibility to exploitation.

  A **nonpragmatic** (or alethic/epistemic) argument justifies a norm of belief by appealing to the *representational success* of the belief itself, regardless of action. Joyce's AD argument says: "If your credences violate the probability axioms, there is an alternative set of credences that is guaranteed to be closer to the truth (more accurate) than yours, regardless of how the world turns out." The irrationality lies in being objectively less accurate than you could be.

  **The "Wager Against Nature" Worry:**
  You are right to be suspicious of the scoring rule. A strictly proper scoring rule (like the Brier score) assigns a numerical "penalty" based on the distance between credence and truth value. Structurally, minimizing expected inaccuracy is mathematically isomorphic to maximizing expected utility.

  *   **The Objection:** If the math is the same, isn't the "inaccuracy score" just a fictional currency? If I have to "pay" an accuracy penalty, haven't we just replaced money with "truth-points," turning epistemology into a pragmatic game against nature?
  *   **The Defense:** Joyce earns the "nonpragmatic" label insofar as the "utility" involved is *constitutive* of the belief's goal, not an external reward. Money is external to belief; truth is (arguably) the internal aim of belief (the "Norm of Truth"). When Joyce argues for probabilism, he isn't saying "you should be probabilistic to maximize your score"; he is saying "being probabilistic is what it *means* to organize your beliefs to minimize distance from the truth."
  *   **The Vulnerability:** However, your second point here is the real weak spot: **The Legitimacy Constraints.** Joyce cannot just pick *any* scoring rule. He must argue that the measure of inaccuracy is "legitimate." To do this, he imposes constraints (e.g., continuity, convexity, propriety).
      *   Where do these constraints come from? In his 1998 paper, Joyce derives them from decision-theoretic axioms applied to epistemic utility.
      *   **The Pushback:** If the justification for the *epistemic* scoring rule relies on *decision-theoretic* norms (which are pragmatic), then the pragmatic element hasn't been removed; it has been **retreated one level up**. We are no longer betting on propositions, but we are betting on which scoring rules are rationally permissible.
      *   **Verdict:** Joyce earns the label "nonpragmatic" regarding the *conclusion* (probabilism is epistemically required), but the *premises* (the constraints on inaccuracy measures) often rely on structural rationality assumptions that look suspiciously like the axioms used in pragmatic decision theory. It is less "purely epistemic" than the title suggests and more "epistemic utility theory," which imports decision-theoretic structure into the epistemic realm.

  ### 2. The Separateness of Propositions (Berker's Worry)

  Selim Berker's objection is that accuracy-first epistemology is a form of **epistemic consequentialism**. It evaluates the rightness of a credence in $P$ based on the goodness of the *overall* outcome (total accuracy). This allows for "epistemic trade-offs": you might be required to hold a credence in $P$ that doesn't match your evidence for $P$, provided doing so improves the accuracy of your credences in $Q$ and $R$ enough to compensate. This violates the intuition that belief in $P$ should be responsive *only* to evidence for $P$.

  **Is the Dutch Book Argument Better Off?**
  Surprisingly, **no.** The Dutch Book argument is arguably just as vulnerable to this aggregation worry, for two reasons:

  1.  **Holism of Coherence:** Both arguments are defenses of *probabilism*. Probabilism is inherently a constraint on the *relationships* between propositions, not on individual propositions in isolation. You cannot violate $P(A) + P(\neg A) = 1$ without looking at both $A$ and $\neg A$. You cannot violate additivity without looking at disjoint sets. Therefore, *any* argument for probabilism must assess the credence function as a whole system. Both DB and AD are holistic.
  2.  **The Structure of the Book:** A Dutch Book is not a single bet; it is a *package* of bets. The DB argument says you are irrational because there exists a *set* of bets that loses money. It does not claim each individual bet is bad. In fact, each individual bet in a Dutch Book might look fair in isolation (based on your local credence). The irrationality emerges only when the propositions are aggregated.
      *   *Berker-style worry applied to DB:* Why should my commitment to a bet on $P$ be constrained by my commitment to a bet on $Q$? If I have no evidence linking $P$ and $Q$, why does logic force me to coordinate them?
      *   The DB proponent replies: "Because logic links $P$ and $Q$."
      *   The AD proponent replies: "Because truth values link $P$ and $Q$."

  **The Distinction:**
  The difference lies in the *mechanism* of aggregation, not the fact of it.
  *   **DB** aggregates via **action**. It says your *disposition to act* on $P$ and $Q$ must be consistent.
  *   **AD** aggregates via **verisimilitude**. It says your *representation* of $P$ and $Q$ must be jointly accurate.

  Berker's worry hits AD harder *rhetorically* because AD claims to be about the *intrinsic* value of belief. If belief is intrinsic, why does the value of believing $P$ depend on $Q$? DB avoids this slightly because it admits it is about *instrumental* consistency. If you admit you are an agent who acts on multiple beliefs, it is less surprising that your actions must be consistent across those beliefs.

  **Verdict:** The "separateness" worry is a problem for *any* structural norm of coherence. DB is not significantly better off, but it is more honest about the fact that it is imposing a consistency constraint on a system of commitments, whereas AD tries to frame this consistency constraint as a maximization of epistemic value, which invites the consequentialist critique more sharply.

  ### 3. Overall Assessment: Which Foundation is More Secure?

  If forced to choose, **Joyce's Accuracy-Dominance argument currently provides the more secure foundation for Probabilism *as an epistemic norm*,** but with significant caveats.

  **Why AD is Superior (Philosophically):**
  1.  **Relevance:** The DB argument proves you are *pragmatically* defective (exploitable). It requires an extra premise ("The Pragmatic Bridge") to show that being exploitable makes you *epistemically* irrational. Why should I care about hypothetical money if I never bet? AD cuts out the middleman. It links probabilism directly to truth, which is the undisputed goal of belief.
  2.  **Non-Ideal Agents:** DB arguments often assume the agent is compelled to bet or that their credences *are* betting quotients. AD applies to credences even if the agent is paralyzed and never acts. It captures the intuition that a brain in a vat can be epistemically irrational even if it never loses a dime.
  3.  **Generalizability:** The AD framework (Epistemic Utility Theory) has proven more fertile. It has been extended to justify conditionalization (Greaves & Wallace), the Principal Principle, and norms of imprecise probability. DB arguments struggle to generalize to updating rules without becoming convoluted.

  **Why DB Persists (Methodologically):**
  1.  **Fewer Assumptions:** AD requires you to accept the existence of a legitimate inaccuracy measure and the constraints on it (convexity, etc.). Critics (like Hájek) argue these constraints are not as self-evident as the DB axioms. The DB argument relies on very weak assumptions about preference (you prefer more money to less).
  2.  **The "Why Care?" Problem:** AD tells you that non-probabilistic credences are *less accurate*. But if I am already non-probabilistic, why should I care about being more accurate? I might not value accuracy in the way Joyce assumes. DB tells you that you are *inconsistent*. Inconsistency is a formal defect that is harder to ignore.

  **Conclusion:**
  Your TA is right that AD is the **state-of-the-art** argument, but wrong to imply it is immune to the worries that plagued DB.
  *   AD does not remove the pragmatic element; it **internalizes** it (turning external bets into internal accuracy scores).
  *   AD does not solve the aggregation problem; it **embraces** it (epistemic consequentialism).

  **Recommendation for Section:**
  Push the idea that **AD is a "translation" of DB into the key of truth.** The mathematical structure is nearly identical (both rely on convexity and dominance theorems). The real advantage of AD is not that it is "purer," but that it targets the *alethic* goal directly. However, you should argue that this comes at a cost: it makes epistemic rationality look like a maximization problem, which invites Berker's objection more forcefully than the DB argument, which frames rationality as a consistency constraint.

  If you want to really challenge the TA, ask this: *"If the mathematical proof of accuracy dominance relies on the same convexity constraints that underwrite the Dutch Book theorem, and if the justification for those constraints often appeals to decision-theoretic norms, in what substantive sense have we escaped pragmatism? Have we not simply redefined 'pragmatic utility' as 'epistemic utility' and declared the problem solved?"*
