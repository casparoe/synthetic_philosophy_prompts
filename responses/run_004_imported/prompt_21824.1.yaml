prompt: |-
  I'm a linguistics PhD student writing a dissertation chapter on Quine's philosophy of language, and I keep getting stuck on a distinction he insists on but never, to my mind, fully earns. In "On the Reasons for Indeterminacy of Translation" and in Word and Object, Quine treats the indeterminacy of translation as more radical than the ordinary underdetermination of theory by evidence: underdetermination allegedly leaves a fact of the matter that the evidence simply fails to reveal, whereas indeterminacy is supposed to hold even once the totality of speakers' dispositions to behavior is fixed. Compare the two theses directly for me, using the gavagai case to anchor indeterminacy and the Duhem-Quine problem to anchor underdetermination, and address whether Quine's own proxy-function argument in "Ontological Relativity" threatens to erase this very distinction by showing that reference and background theory are just as susceptible to a "no-fact-of-the-matter" treatment as translation manuals are. In the end, does indeterminacy survive as the more drastic thesis, or does it collapse into a special case of underdetermination? Justify your answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Linguistics PhD student writing a dissertation chapter on Quine's philosophy of language.
      *   **Task:** Compare Quine's distinction between the *underdetermination of theory by evidence* and the *indeterminacy of translation*.
      *   **Key Anchors:** Use the *gavagai* case for indeterminacy and the *Duhem-Quine thesis* for underdetermination.
      *   **Critical Challenge:** Address whether Quine's *proxy-function argument* (from "Ontological Relativity") undermines this distinction by making reference/theory look just as indeterminate.
      *   **Final Verdict:** Determine if indeterminacy survives as a more drastic thesis or collapses into a special case of underdetermination.
      *   **Tone/Level:** Academic, rigorous, suitable for a PhD dissertation context. Needs to show deep engagement with Quine's texts and the secondary literature.

  2.  **Deconstruct the Core Distinction:**
      *   *Underdetermination of Theory (Duhem-Quine):* Scientific theories go beyond the evidence. Multiple theories can account for all possible observations. *Crucially:* Quine often suggests there *is* a fact of the matter (the world is one way), we just can't know which theory captures it. It's an epistemic limitation (mostly), though Quine waffles on the ontological status here.
      *   *Indeterminacy of Translation:* Translation manuals go beyond behavioral dispositions. Multiple manuals can account for all possible speech dispositions. *Crucially:* There is *no* fact of the matter regarding which manual is correct. It's not just that we can't know; it's that there's nothing to know. It's an ontological thesis about meaning.

  3.  **Analyze the Anchors:**
      *   *Gavagai:* The native says "Gavagai" when a rabbit runs by. Hypotheses: "Rabbit," "Undetached rabbit part," "Rabbit stage." Behavioral evidence (pointing, assent/dissent) cannot distinguish these. Quine says: There is no fact about *what* the native means, only how they behave.
      *   *Duhem-Quine Problem:* A hypothesis $H$ cannot be tested in isolation, only with auxiliary assumptions $A$. If prediction $P$ fails, either $H$ or $A$ is wrong. We can save any theory by adjusting the "web of belief." *Contrast:* In physics, we assume there *is* a physical reality causing the sensations, even if our theory of it is underdetermined.

  4.  **Analyze the Threat: Proxy Functions and Ontological Relativity:**
      *   *Proxy Function Argument:* We can map the objects of one theory onto another (e.g., map numbers to sets, or permute objects) without changing the truth values of the sentences.
      *   *The Threat:* If reference is indeterminate (inscrutability of reference), and theories are just sets of sentences, then isn't theory choice just as indeterminate as translation? If I can reinterpret the terms of physics via a proxy function without changing empirical predictions, isn't physics indeterminate too?
      *   *Quine's Defense:* Quine tries to maintain a distinction. Indeterminacy of translation is *between* languages (or manuals). Underdetermination is *within* a language (choosing between physical theories). But the proxy function argument seems to blur this by making reference itself relative to a background language.

  5.  **Evaluate the "Collapse" Question:**
      *   *View 1: Indeterminacy is stronger.* Meaning facts are non-existent. Physical facts exist but are theoretically elusive.
      *   *View 2: Indeterminacy collapses.* If reference is inscrutable, then the "facts" of physics are also relative to a translation manual. Therefore, physics is also indeterminate. (This is the Davidsonian or radical interpretation view).
      *   *View 3: Quine's Naturalism saves the distinction.* Physics is our ultimate arbiter of reality. Translation is prior to physics. We use physics to judge physics, but we use behavior to judge translation.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. State the thesis: The distinction is tenable but precarious; Quine relies on a naturalistic asymmetry that the proxy function argument strains but does not necessarily break, provided one accepts Quine's behaviorist ontology of meaning.
      *   **Section 1: The Distinction (Underdetermination vs. Indeterminacy).**
          *   Define Underdetermination (Duhem-Quine). Epistemic vs. Ontological. The "cosmic exile" idea.
          *   Define Indeterminacy (Gavagai). Ontological lack of meaning facts. Behaviorism.
          *   Key difference: *Fact of the matter.*
      *   **Section 2: The Anchors.**
          *   *Gavagai:* Focus on stimulus meaning vs. reference. The "rabbit" vs. "rabbit part" issue.
          *   *Duhem-Quine:* Focus on holistic confirmation. The ability to revise logic or definitions to save a theory.
      *   **Section 3: The Proxy Function Threat.**
          *   Explain "Ontological Relativity." Reference is inscrutable without a background language.
          *   The Argument: If physical theories rely on reference, and reference is indeterminate, then physical theories are indeterminate.
          *   Quine's Counter: The distinction between *immanent* truth (within a theory) and *transcendent* truth. Physics is judged immanently; translation is judged by behavior.
      *   **Section 4: Does it Collapse?**
          *   Arguments for collapse (e.g., Gibson, Davidson).
          *   Arguments for survival (e.g., Quine's naturalism, the asymmetry of the home language).
          *   *My Verdict:* It survives *if* you accept Quine's behaviorist premise that meaning *just is* disposition. If you reject that, the distinction looks like a double standard. However, within Quine's system, the distinction is structural: Translation is the foundation, Physics is the edifice. You can't undermine the foundation with the tools of the edifice.
      *   **Conclusion:** Summarize. Advise the student on how to frame this in their dissertation (i.e., highlight the tension as a feature, not a bug, of Quine's naturalized epistemology).

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say Underdetermination is *purely* epistemic. Quine sometimes suggests ontological underdetermination. But the *key* difference Quine insists on is that with translation, even God couldn't tell (no fact), whereas with physics, God knows (fact exists, we don't).
      *   *Nuance on Proxy Functions:* The proxy function argument applies to *reference* (inscrutability), which is a subspecies of indeterminacy. Does it apply to the *theory* itself? Quine says physical theories are underdetermined, but translation manuals are indeterminate. The proxy function shows reference is indeterminate. Does that make the *theory* indeterminate? Quine says no, because we can fix reference relative to background.
      *   *Critical Point:* The distinction rests on the status of the "home language." We speak physics *in* our home language. We translate *into* our home language. The home language is the measure of all things. This is where the asymmetry lies.

  8.  **Final Polish:** Ensure the tone is appropriate for a PhD student (no hand-holding, high conceptual density, precise terminology). Check citations (Word and Object, Ontological Relativity, Reasons for Indeterminacy).

      *(Self-Correction during drafting)*: Make sure to explicitly answer the "Justify your answer" prompt at the end. Don't just present both sides; take a stance based on the textual evidence and logical coherence.

      *Stance:* The distinction *technically* survives within Quine's system due to the privileged status of the home language (naturalism), but it is philosophically unstable because the proxy function argument suggests the "facts" of physics are just as language-relative as the "meanings" of translation. I will argue it survives as a *methodological* distinction but collapses as a deep *metaphysical* one. Actually, better to argue: It survives *only if* one accepts Quine's behaviorist reduction of meaning. If meaning is more than behavior, the distinction vanishes (both become underdetermined). If meaning is behavior, indeterminacy is real. Given the user is a linguist, they might be skeptical of behaviorism. I should present the Quinean defense but acknowledge the fragility.

      *Revised Stance:* I will argue that the distinction survives *within Quine's naturalistic framework* because of the asymmetry between the "background language" (where physics lives) and the "object language" (which is translated). The proxy function argument reinforces indeterminacy of reference but does not equate physical theory choice with translation because physical theory choice happens *within* the background language where truth is immanent.

  9.  **Final Review against constraints:**
      *   Compare theses directly? Yes.
      *   Use Gavagai? Yes.
      *   Use Duhem-Quine? Yes.
      *   Address Proxy Function/Ontological Relativity? Yes.
      *   Final verdict? Yes.

      *Let's write.*
answer: |-
  This is a pivotal tension in Quine's system, and it is astute of you to identify it as a potential fault line. Many commentators (from Chomsky to Davidson) have argued that Quine cannot consistently maintain the gap between underdetermination and indeterminacy without begging the question. However, to do justice to Quine in a dissertation, one must first reconstruct the distinction as he intended it before dismantling it.

  Here is a direct comparison of the two theses, an analysis of the threat posed by the proxy-function argument, and a justified verdict on whether the distinction holds.

  ### 1. The Core Distinction: Fact vs. No-Fact

  Quine's distinction rests on an ontological claim about the existence of truth-makers, not merely an epistemological claim about our access to them.

  **Underdetermination of Theory (The Duhem-Quine Thesis)**
  *   **The Anchor:** In "Two Dogmas of Empiricism" and later works, Quine argues that scientific theories face the tribunal of experience not individually but as a corporate body. If a prediction fails, we can save any specific hypothesis by making adjustments elsewhere in the "web of belief" (e.g., altering auxiliary assumptions, redefining terms, or even revising logic).
  *   **The Status of Facts:** Crucially, underdetermination implies that multiple, logically incompatible theories can account for all possible sensory evidence. However, Quine typically maintains a **realist stance** here: there is a physical world that is the way it is. One theory may be "true" and the other "false" in virtue of how the world is, even if our evidence cannot discriminate between them. It is a limitation of *evidence*, not necessarily a lack of *fact*.
  *   **The Metaphor:** We are like cartographers mapping a coastline in a fog. There is a real coastline (fact of the matter), but our maps (theories) might differ in untestable details while remaining compatible with all our sightings (evidence).

  **Indeterminacy of Translation (The Gavagai Case)**
  *   **The Anchor:** In *Word and Object*, the linguist encounters a native who says "Gavagai" whenever a rabbit is present. The stimulus meaning (dispositions to assent/dissent) is fixed. However, the reference is not. "Gavagai" could mean *rabbit*, *undetached rabbit part*, or *temporal stage of a rabbit*. No amount of behavioral testing (pointing, questioning) can distinguish these, as the stimuli trigger the same dispositions for all three hypotheses.
  *   **The Status of Facts:** Here, Quine makes the stronger claim: there is **no fact of the matter** as to which hypothesis is correct. It is not that the meaning is hidden; it is that meaning *just is* behavioral disposition. Since the dispositions are identical, the meanings are identical relative to the manual, but there is no "meaning fact" beyond the dispositions to adjudicate between manuals.
  *   **The Metaphor:** There is no coastline in the fog. There are only the sightings. To ask what lies beyond the sightings is a category mistake.

  **Summary of the Distinction:** Underdetermination allows for rival theories where one *might* be truly correct (ontological realism about physics); Indeterminacy posits rival translation manuals where *neither* is uniquely correct (ontological anti-realism about meaning).

  ### 2. The Threat: Proxy Functions and Ontological Relativity

  Your intuition that the proxy-function argument threatens this distinction is shared by critics like Roger Gibson and Hilary Putnam. In "Ontological Relativity," Quine argues that reference is "inscrutable."

  **The Proxy-Function Argument**
  Quine demonstrates that we can apply a proxy function (a one-to-one mapping) to the objects of a theory without changing the truth values of the sentences. For example, we can map every physical object $x$ to its cosmic complement (the universe minus $x$). All empirical predictions remain the same, but the reference of every term has shifted.

  **The Collapse Argument**
  If the proxy-function argument holds for physical theories (which it seems to, as they are expressed in language), then reference within physics is just as indeterminate as reference in translation.
  1.  If reference is indeterminate, then the "objects" posited by physical theories are not fixed.
  2.  If the objects are not fixed, the "facts of the matter" regarding physical theories are not fixed.
  3.  Therefore, physical theories are not just underdetermined; they are *indeterminate*.
  4.  **Conclusion:** The distinction collapses. Indeterminacy swallows underdetermination.

  Quine anticipates this. His defense relies on the **asymmetry of the background language**.

  ### 3. Quine's Defense: Immanence vs. Transcendence

  Quine insists the distinction survives because of the privileged status of the **home language**.

  1.  **Translation is Transcendent:** When translating the native's language, we stand outside it. We compare their dispositions to our manual. There is no higher court of appeal than behavior. Hence, no fact of the matter.
  2.  **Theory is Immanent:** When choosing between physical theories, we are working *within* our home language. We judge the truth of physical sentences by the standards of our current best physics. As Quine famously says, "There is no extramundane perspective from which we can view the world."
  3.  **The Role of Proxy Functions:** The proxy function argument shows that reference is relative *to a background language*. Within our home language, reference is fixed enough to do science. We can say "Electrons exist" is true *in our theory*. We cannot say "Gavagai means rabbit" is true *simpliciter*, only "relative to Manual M."

  For Quine, underdetermination is a problem of choosing between theories *within* the language. Indeterminacy is a problem of mapping *into* the language. The proxy function argument reinforces the indeterminacy of reference (a subspecies of translation indeterminacy) but does not render physical theory choice indeterminate, because physical theory choice is judged by the standard of empirical adequacy *within* the background language where truth is defined.

  ### 4. Verdict: Does Indeterminacy Survive?

  **The Verdict:** Indeterminacy survives as the more drastic thesis **only if** one accepts Quine's behaviorist ontology of meaning. If one rejects behaviorism, the distinction collapses into a generalized underdetermination.

  **Justification:**

  1.  **The Behaviorist Premise:** Quine's claim that there is "no fact of the matter" regarding *gavagai* rests entirely on the premise that meaning is exhausted by stimulus dispositions. If you believe meanings are mental entities, Platonic forms, or causal-historical chains (à la Kripke/Putnam), then there *is* a fact of the matter about *gavagai*, we just can't access it behaviorally. In that scenario, indeterminacy collapses into underdetermination (epistemic limitation).
  2.  **The Naturalistic Asymmetry:** However, within Quine's naturalized epistemology, the distinction is structurally necessary. Science (physics) is the tool we use to investigate the world. Translation is the tool we use to investigate speakers. We use physics to judge physics (immanent truth). We use behavior to judge translation. Since behavior underdetermines meaning (by Quine's definition), translation is indeterminate. Since evidence underdetermines theory (by logic), physics is underdetermined.
  3.  **The Proxy Function Limit:** The proxy-function argument does not erase the distinction because it applies to *reference*, which Quine classifies under the head of indeterminacy/inscrutability, not theory choice. Quine concedes that *reference* is indeterminate (even in physics), but he maintains that *truth* (the holophrastic assent to sentences) is what matters for theory choice. We can permute the objects (reference) without permuting the truth values of the sentences (theory). Therefore, the theory remains determinate in terms of truth conditions, even if the ontology is relative.

  **Dissertation Recommendation:**
  You should argue that the distinction is **methodologically robust but metaphysically fragile**.
  *   It is **robust** because Quine's naturalism demands it: we cannot step outside our skin to check meaning facts, but we can step outside one theory to check it against another within our language.
  *   It is **fragile** because the proxy-function argument suggests that the "truth" of physical theories is just as relative to a translation manual (our own) as the native's utterances are. If our own reference is inscrutable, the "facts" of our physics are arguably as elusive as the "meanings" of the native.

  **Final Conclusion for your Chapter:**
  Quine succeeds in distinguishing the two only by drawing a circle around his home language. Inside the circle (physics), truth is immanent and underdetermination is merely epistemic. Outside the circle (translation), truth is behavioral and indeterminacy is ontological. The proxy-function argument threatens to show that the circle itself is drawn in sand (since reference inside the circle is also relative). Thus, indeterminacy survives as the more drastic thesis **relative to the behaviorist reduction of meaning**, but it risks collapsing into underdetermination if one views the home language as just another theory subject to the same ontological relativity as the native's.

  For a linguistics dissertation, the most fruitful path is to argue that Quine's distinction forces linguistics to choose: either accept behaviorism and embrace indeterminacy (abandoning "meaning" as a scientific object), or reject behaviorism and reduce indeterminacy to underdetermination (retaining "meaning" but admitting it is theoretically opaque). Quine insists on the former; most modern linguistics implicitly chooses the latter.
