      *   *Dana's Position:* Knightian Uncertainty / Cluelessness (Hilary Greaves, William MacAskill). Some things are fundamentally unmodelable. If we can't assign probabilities, EV calculations are fake precision. She worries about *directionality* (could it make things worse?).
      *   *The Tension:* If we accept Dana's view too strongly, we can never fund systemic change (always too complex). If we accept Marcus's view too strongly, we might gamble on high-variance interventions that fail silently while ignoring concrete good.

  3.  **Evaluate the Options:**
      *   *Fund Tutoring:* Safe, measurable, but limited scope. Risks ignoring the root cause (housing) of many issues facing the kids.
