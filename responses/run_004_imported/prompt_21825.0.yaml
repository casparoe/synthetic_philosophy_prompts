answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** [Your Name], Grants Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Cycle's Major Award: Tutoring Initiative vs. Zoning Coalition

  ### Bottom Line Recommendation
  I recommend we award the cycle's major grant to the **Tutoring Program**.

  This recommendation is not a default to the "safe" option based on comfort or legibility. Rather, it is a specific application of the epistemological distinction raised during our committee deliberations. While the stakes of the housing crisis are undeniably higher, the *nature* of our uncertainty regarding the zoning proposal is fundamentally different from the tutoring proposal. Under conditions of what philosopher Hilary Greaves calls "cluelessness"—where we cannot assign meaningful probabilities to outcomes—we should prioritize interventions with verified causal mechanisms over those with contested theoretical models.

  ### The Core Dispute: Risk vs. Cluelessness
  The deadlock between Marcus and Dana is not merely a disagreement about appetite for risk; it is a disagreement about the type of uncertainty we are facing.

  **Marcus's Position (Expected Value):** Marcus argues that we should calculate the Expected Value (EV) of each grant. Even if the probability of the zoning coalition succeeding is low, the magnitude of the benefit (citywide affordability) is so massive that it outweighs the tutoring program's smaller, certain gains. He correctly notes that the long-term lives of tutored children are also unpredictable cascades of events.

  **Dana's Position (Real Cluelessness):** Dana argues that the zoning proposal suffers from "Knightian uncertainty" or "cluelessness." This is not a case of rolling dice where we know the odds (risk); it is a case where we do not know the odds, or even the full set of possible outcomes. She points out that for every model where upzoning lowers rents, there is a plausible model where it accelerates displacement or triggers a political backlash that hardens exclusionary zoning for a generation.

  **My Assessment:** Dana is right that these are different categories of not-knowing, but Marcus is right that we cannot let this paralyze us. The question is how to act when we acknowledge cluelessness without retreating into status quo bias.

  ### Why the Distinction Matters for This Decision
  To avoid using "cluelessness" as a blanket excuse to fund only the legible, we must distinguish between **External Uncertainty** and **Internal Uncertainty**.

  1.  **The Tutoring Program (External Uncertainty):**
      *   *Internal Mechanism:* Verified. We know with high confidence that this program improves test scores and literacy. The causal chain from *dollars spent* to *skills gained* is empirically solid.
      *   *External Outcome:* Uncertain. As Marcus noted, we cannot guarantee that better test scores will lead to better adult outcomes (college, income, health). However, this uncertainty lies *downstream* of our intervention. We have successfully purchased "improved skills." The rest of the world determines the value of those skills.
      *   *Sign Certainty:* Positive. It is highly improbable that literacy training makes a child worse off.

  2.  **The Zoning Coalition (Internal Uncertainty):**
      *   *Internal Mechanism:* Contested. The causal chain from *lobbying* to *policy change* to *increased supply* to *lower rents* is fraught with "sign uncertainty." It is not just that we don't know *how much* rent will drop; it is that we cannot confidently predict the *direction* of the effect.
      *   *The Backlash Risk:* Unlike the tutoring program, where failure usually means "no gain," the zoning intervention carries a non-trivial risk of "negative gain" (e.g., a political backlash that empowers exclusionary incumbents).
      *   *Cluelessness:* We lack the data to weigh the "success story" against the "backlash story." They are incommensurable.

  ### Avoiding Status Quo Bias
  If we fund the tutoring program simply because it is "safer," we validate status quo bias. We would be saying that systemic change is too hard to attempt.

  However, we avoid this bias by applying a strict heuristic: **In the face of cluelessness, fund robustness, not optimization.**

  *   **Optimization** (Marcus's approach) asks: "Which bet has the highest theoretical ceiling?" This works when we can model probabilities.
  *   **Robustness** (Dana's insight) asks: "Which intervention remains 'good' across the widest range of plausible world-models?"

  The tutoring program is robust. In almost every plausible model of the future, a child who can read better is better off. The zoning coalition is fragile. Its success depends on a specific chain of economic and political reactions that are currently disputed by experts.

  This does not mean we should never fund systemic change. It means we should fund systemic interventions where the *mechanism* is as verified as the tutoring data. For example, if there were a proposal for direct rental assistance or legal aid for tenants facing eviction, the causal link to "housing stability" would be robust, even if the systemic link to "citywide affordability" remained unclear. We should prioritize those over lobbying when we are in a state of cluelessness.

  ### Strategic Context
  We must also consider the marginal value of our capital.
  *   **Tutoring:** High data quality makes this program attractive to government funding and larger institutional donors. They prefer legible metrics.
  *   **Zoning:** High ambiguity makes this difficult for public funding, which suggests a role for philanthropy.

  However, philanthropy's role is not simply to fund what government won't; it is to fund what is *effective*. Funding a lobbying effort that may inadvertently worsen the crisis is not effective risk-taking; it is gambling. Until the coalition can narrow the "cluelessness" gap—perhaps by piloting a specific policy intervention with measurable interim metrics rather than broad lobbying—we are not the right capital for this stage of their work.

  ### Recommendation and Next Steps
  **1. Award the Major Grant to the Tutoring Program.**
  This ensures our largest sum is deployed to an intervention with a verified positive sign. We are buying known good.

  **2. Offer a Smaller "Learning Grant" to the Zoning Coalition.**
  I propose we offer the zoning coalition a significantly smaller amount (e.g., 10-15% of the major award) specifically designated for research and coalition-building, not lobbying. This acknowledges Marcus's point that the stakes are too high to ignore housing. It allows them to refine their theory of change and gather data that might convert "cluelessness" into "risk" in future cycles.

  **3. Committee Mandate.**
  We should formally adopt Dana's distinction in our evaluation criteria. We will differentiate between *parameter uncertainty* (we know the model, not the numbers) and *model uncertainty* (we don't know the model). We will accept high parameter uncertainty for high-stakes systemic bets, but we must require low model uncertainty (verified mechanisms) for our major awards.

  ### Conclusion
  Marcus is right that we cannot wait for perfect knowledge. Dana is right that not all uncertainty is quantifiable risk. By funding the tutoring program, we are not choosing safety over impact. We are choosing **verified impact** over **speculative impact**. We address the housing crisis by ensuring our foundation remains solvent and effective enough to fund the right housing intervention when the evidence base matures.

  I look forward to discussing this on Thursday.
