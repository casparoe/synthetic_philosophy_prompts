      *   *Heuristic:* "Optionality." Zoning creates optionality (if it works, huge gain). Tutoring is a closed loop.
      *   *No, let's go with the "Sign Certainty" argument for Tutoring.* It's more defensible. It respects Dana's insight without falling into paralysis. It admits that while tutoring's *long term* is uncertain, its *mechanism* is verified. Zoning's mechanism is theoretical.
