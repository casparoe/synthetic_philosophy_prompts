      *   Ensure Priya isn't naive. She knows the risk. She's questioning the *automatic* nature of the choice.

  7.  **Final Review against Constraints:**
      *   Taurek reference accurate? Yes (loss is individual).
      *   Hollis strong? Yes (appeal to consequence and role morality).
      *   Setting clear? Yes (flood, boat).
      *   Ending note included? Yes.

  8.  **Self-Correction during drafting:** I initially thought about having them flip a coin. But in SAR, you can't really do that. The tension comes from Priya *wanting* to consider the one, and Hollis forcing the utilitarian choice but admitting why it's hard. Actually, better: Priya argues for the *moral weight* of the one. Hollis argues for the *moral weight* of the four extra deaths.
      *   *Wait, one nuance:* Taurek suggests a coin toss *if* you can't save everyone. Priya is arguing against the *automatic* preference for the five.
      *   *Hollis's Counter:* The "Veil of Ignorance" (Rawls) or just simple Consequentialism. If you save the one, you actively let four die.
      *   *Let's sharpen Hollis:* His best argument is that *inaction* is also a choice. By hesitating, she is choosing.

      *(Self-Correction)*: Keep it tight. They are about to launch.
