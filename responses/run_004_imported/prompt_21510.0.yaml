      *   *Critique 1:* Too dry. Hollis is too weak. Priya sounds like a textbook.
      *   *Attempt 2 (Adding Grit & Stakes):*
          *   Hollis needs to ground it in SAR protocol. "Triage."
          *   Priya needs to ground it in the *person* on the other side.
          *   Hollis's counter needs to be about *agency* and *consequences*. If *he* chooses, he owns the outcome.

      *   *Refining Priya's Argument:* She shouldn't just say "Taurek." She should explain the *loss*. To the solo hiker, his life is everything. To the group, each life is everything. There is no "group mind" that suffers five times the pain.
      *   *Refining Hollis's Argument:* He shouldn't just say "math." He should say "responsibility." If I walk past five bodies to save one, I have to explain that to the world. Also, from a probabilistic standpoint, if this happens again, saving the many is the only sustainable rule.

  5.  **Writing the Scene (incorporating sensory details):**
      *   Start with the environment. The creek is the antagonist.
      *   Hollis is prepping the boat. Priya stops him.
      *   Priya brings up the solo hiker. Let's call him "the one."
      *   Hollis pushes back on the "coin flip" idea.
      *   Priya argues that the one has a 100% stake.
      *   Hollis argues that *he* (Hollis) has to carry the weight of the decision. He rejects the idea that he can be neutral.
      *   *Crucial Turn:* Hollis acknowledges the logic but rejects it based on *duty*. He isn't a philosopher; he's a rescuer. His duty is to minimize loss where he has agency.

  6.  **Polishing the Dialogue:**
      *   Make it sound like people shouting over rain, not a seminar. Short sentences. Interruptions.
