answer: |-
  The creek wasn't flowing anymore; it was sliding. A solid wall of brown water, churning with pine branches and mud, roared through the gap in the canyon. The inflatable boat bobbed at Priya's knees, tethered to a rock, straining against the current like a dog on a leash.

  Hollis was checking the carabiner on his throw bag. He didn't look up when Priya put a hand on the boat's gunwale.

  "Wait," she said. She had to shout to be heard over the water.

  Hollis paused, eyes flicking to her, then to the far bank. On the left ridge, five flares had popped ten minutes ago. On the right, a single flashlight beam was sweeping the trees, desperate and rhythmic.

  "We don't have time to wait, Priya," Hollis said. He clipped the bag to his harness. "Current's peaking. We hit the eddy now, we grab the group on the left, we ferry back for the lone wolf. If we wait, we lose the crossing entirely."

  "I'm not talking about timing," Priya said. She stepped in front of him, blocking the launch path. "I'm talking about the drop."

  Hollis's jaw tightened. He didn't move, but the air around them grew heavier than the storm. "Don't do this."

  "Five on the left. One on the right. One boat. One shot before the water breaches the berm."

  "If the water breaches the berm, we go home," Hollis said flatly. "And nobody gets saved. So we make the run. We save the five."

  "Why?"

  Hollis blinked. Rain streamed off the brim of his helmet. "Because five is bigger than one, Priya. It's arithmetic."

  "It's not arithmetic. It's people." Priya gripped the boat tighter. "To the guy on the right, his life isn't one-fifth of a problem. It's everything he has. If we choose the five, we aren't just saving more lives. We're deciding that his claim on us is worth less. Why is it less?"

  "Because four more people go home to their families if we say so."

  "But does the world suffer *more*?" Priya pressed. "There's no super-person who feels five deaths at once. David dies his death. The five die theirs. Each loss is total to the person losing it. If the loss is total for him, and total for each of them, why does adding them up change our obligation? Maybe we owe them all an equal chance. Maybe we should flip a coin."

  Hollis stared at her. For a second, the roar of the creek seemed to drop away. He looked at her not like a subordinate, but like a opponent he respected in a ring.

  "A coin," Hollis repeated.

  "Fairness," Priya said. "If you were him, standing on that bank, would you accept that you die just because there happened to be a party of five on the other side? That you were statistically inconvenient?"

  Hollis stepped in. He was close enough that she could see the grey in his stubble, the exhaustion in his eyes.

  "If I'm him," Hollis said, his voice low and rough, "I'm terrified. I'm praying someone comes. But I'm not the one making the choice. *I am.*"

  He tapped his chest.

  "You're talking about fairness to the victim. I'm talking about responsibility of the agent. If I flip a coin and it lands on the one, I have to look at the five bodies in the morgue. I have to tell their mothers that I could have saved them, but I wanted to be *philosophically consistent*."

  "That's guilt," Priya said. "That's your ego. That doesn't make it right."

  "It makes it real!" Hollis snapped. He grabbed the boat's rope, his knuckles white. "You say the losses aren't additive. Fine. But the *saving* is. If I cross left, I pull five people out of the water. If I cross right, I pull one. I am a rescue operator. My function is to remove people from danger. If I can remove five units of danger or one, and I choose one, I have actively chosen to leave four people in the flood. I didn't just let them die, Priya. I *left* them."

  He leaned in, the rain plastering his jacket to his shoulders.

  "You want to talk about the guy on the right? I feel for him. God help me, I do. But if I stand here and let the five wash away because I was afraid of doing the math, I'm not being fair. I'm being cowardly. I'm hiding behind the idea that numbers don't count so I don't have to count the cost."

  Priya held his gaze. The boat tugged hard against her leg, the water rising over her boots. Cold bit through her trousers.

  "So the numbers count," she said, "because you have to carry the weight of them."

  "The numbers count," Hollis corrected, "because the world is left with fewer people in it if we ignore them. You're arguing for the purity of the decision. I'm arguing for the result."

  He moved past her, shoving the boat into the churn. "Get in. We're going left."

  Priya stood for a heartbeat longer, watching the single flashlight beam on the right ridge sweep the dark. It dipped, as if nodding. She stepped into the boat.

  "Row," Hollis said.

  ***

  **Philosophical Footnotes for Your Outline:**

  *   **Priya's Argument:** She is channeling **John Taurek**, specifically his 1977 paper *"Should the Numbers Count?"* Taurek argues against the utilitarian aggregation of lives. His core thesis is that there is no "social entity" that feels the sum of the pain; loss is experienced individually. Therefore, saving the greater number isn't strictly obligated by morality; some Taurekians argue for a lottery (coin flip) to give each *individual* an equal chance of survival, rather than giving the *group* a higher probability.
  *   **Hollis's Argument:** He is channeling **Consequentialism/Utilitarianism** (specifically the defense against Taurek), but grounded in **Agent-Relative Duty**. His counter is the standard objection to Taurek: that while pain isn't aggregated in the *victims*, the *moral agent* (Hollis) is responsible for the total state of the world they create. By choosing the one, he is causally responsible for the four preventable deaths. He also touches on **Contractualism** (implicitly): the social expectation of a rescuer is to minimize loss, and failing to do so violates the trust placed in his role.
