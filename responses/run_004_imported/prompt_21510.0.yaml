      *   **Standard Utilitarian View:** Save the 5 (Hollis's instinct).
          *   *Correction:* Wait, the prompt says Hollis's instinct is to go for the five, but Priya argues against simply counting heads.
      *   **Philosophical Core:** John Taurek's "Should the Numbers Count?" (1977). The argument is that we shouldn't necessarily aggregate lives. Each individual has a claim to be saved. Flipping a coin might be fairer if the claims are equal, or at least, the number *itself* doesn't create a moral obligation to save the greater number.
      *   **Requirement:** The dialogue must be substantive. No strawmen. Hollis needs a strong counter-argument (not just "shut up"). Priya needs to articulate the Taurekian view clearly but naturally.
      *   **Ending:** Brief note on the philosophical references.

  2.  **Deconstruct the Philosophical Argument (Taurek):**
      *   *Taurek's Point:* There is no "super-observer" who experiences the sum of pain. David experiences his death. The five others experience theirs. David's loss is 100% to him. The group's loss is 100% to each of them individually, but not "500%" to a collective entity.
      *   *The Fairness Argument:* If I am David, why should my life count for less just because there are others? I deserve an equal chance.
      *   *The Counter-Argument (Utilitarian/Contractualist):* If you were behind a veil of ignorance, wouldn't you choose the rule that saves the most? Also, minimizing tragedy is a valid moral goal. If you can prevent 5 deaths instead of 1, and you choose 1, are you not responsible for the 4 extra deaths?

  3.  **Drafting - Setting the Scene:**
      *   Needs tension. Rain, noise, physical danger.
      *   The boat is the container. They are pre-crossing or mid-crossing? Pre-crossing makes more sense for the decision, but mid-crossing adds physical stakes. Let's put them *at* the launch point, seconds before committing. It raises the stakes of the *decision*.
      *   Sensory details: Roar of water, cold rain, the weight of the gear.

  4.  **Drafting - The Dialogue (Iterative Process):**
      *   *Attempt 1 (Mental Outline):*
          *   Hollis: We save the five.
          *   Priya: Wait, Taurek says numbers don't count.
          *   Hollis: That's crazy.
