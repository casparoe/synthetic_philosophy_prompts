  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Validate the user's intuition. State the thesis: Relational properties count as properties, and the symmetry objection confuses the relation with the properties derived from it.
      *   **Point 1: The Scope of PII.** Leibniz didn't restrict PII to intrinsic properties. If we allow relational properties, Black's counterexample fails immediately. The burden is on Black to show why relational properties shouldn't count.
      *   **Point 2: Head-on with Symmetry.** This is the core.
          *   Friend says: $R(a,b)$ is the same as $R(b,a)$.
