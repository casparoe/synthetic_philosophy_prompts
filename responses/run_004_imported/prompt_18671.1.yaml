      *   **Point 4: Epistemic vs. Ontological.**
          *   Friend's worry is often: "But I can't point to one and say 'that's A'."
          *   Response: PII isn't about human ability to label. It's about whether reality contains a distinguishing fact. The fact "A is 2 miles from B" is a real fact distinct from "B is 2 miles from A" in terms of subject-predicate structure, even if the distance is the same.
