  *(Self-Correction Note)*: I need to be careful not to conflate "Weak PII" (excludes relational) and "Strong PII" (includes relational). The standard Leibnizian view usually includes all predicates. Black's argument is specifically designed to defeat PII even when including *pure* relational properties (like "is 2 miles from *a sphere*"). But the user is invoking *impure* relational properties ("is 2 miles from *Sphere B*"). I need to justify why impure properties are legitimate in this context without falling into the "triviality" trap. The key is that the distinctness of the relata generates the distinctness of the properties. If there are two spheres, there are two distinct centers of relation.

