prompt: |-
  Me and a friend got into a whole thing last night about the Max Black spheres example -- the one where you imagine a universe with literally nothing in it except two identical iron spheres, meant as a counterexample to the identity of indiscernibles. I argued the spheres aren't actually indiscernible, because each one stands in a relation to the other that it doesn't stand in to itself (like, sphere A is some distance from sphere B, but nothing is that same distance from itself), and that alone tells them apart without there needing to be any other difference between them. My friend said that's a cheat, since the relation is completely symmetric -- all it shows is that there's two things standing in it, which is the very thing in question, not something that actually distinguishes one sphere from the other. Neither of us backed down and its bugging me. Write an argument defending my side: that this kind of relational discernibility really is enough to stop Black's scenario from refuting Leibniz's principle, and that the "question-begging" charge my friend made doesn't actually stick. Deal with the symmetry complaint head on instead of talking around it.
