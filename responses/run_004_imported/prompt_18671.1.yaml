          *   Analogy: Being a neighbor. The neighbor relation is symmetric. But "Being John's neighbor" is a different property than "Being Mary's neighbor," even if John and Mary are neighbors with each other.
          *   Apply to Spheres: Property $P_1$ = "2 miles from Sphere B". Property $P_2$ = "2 miles from Sphere A". Sphere A has $P_1$ but not $P_2$. Sphere B has $P_2$ but not $P_1$. They differ.
      *   **Point 3: The Question-Begging Charge.**
