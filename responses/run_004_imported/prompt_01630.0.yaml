      *   *Check:* Did I address the "forced to pursue power" point? Yes, confirm that IC implies this, but clarify that "pursuing power" is a means, not an end.
      *   *Tone:* Keep it analytical, philosophical, but accessible. Use Bostrom's terminology correctly.

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between *Terminal* and *Instrumental* is bolded or emphasized, as that's the crux of the resolution. (This matches the structure of the final output).

