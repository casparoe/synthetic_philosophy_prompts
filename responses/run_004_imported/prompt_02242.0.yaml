  Epistemic status: pretty confident, happy to be told im wrong. Quine's indeterminacy of translation doesn't seem like the deep problem people make it out to be anymore — his linguist is stuck because all they have to go on is behavior (pointing at stuff, nodding along to "gavagai"), so sure, "rabbit," "undetached rabbit part," and "rabbit-stage" all fit the evidence equally well. But now that we can pop open a model's internals with probes or SAEs instead of just squinting at input/output behavior, the ambiguity should just dissolve, since you're no longer limited to behavioral evidence — you can go check what the internal representation is actually tracking. Doesn't that basically demote gavagai from a permanent fact about meaning to an engineering problem we've already more or less solved? Feels like a weirdly under-discussed implication of interpretability work, but maybe im missing something.
