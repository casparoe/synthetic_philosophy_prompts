          *   *The Confession:* The note admits that the *Methods* argument rests on a metaphysical assumption he can't prove. The "rational system" collapses into irrationality (or at least, deep conflict) without the "faith."
          *   *Public vs. Private:* In *ME*, he leaves it as an unresolved antinomy (with a theological "way out" hinted at). In the note, he admits he *personally* cannot function without assuming the way out is true.
