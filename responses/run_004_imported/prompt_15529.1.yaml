answer: |-
  You have not lost your mind, and you are not falling for a bias. You have independently rediscovered one of the most famous and stubborn problems in Bayesian epistemology: **The Problem of Old Evidence.**

  Since you have the background to handle the technicals, I'll skip the pop-sci handwaving. You are correctly identifying a tension between the standard formulation of Bayes' theorem and actual scientific practice.

  Here is the breakdown of why your math says "no update" but your scientific intuition says "major update," and how to resolve it without abandoning Bayesianism.

  ### 1. The Naive Bayes Block
  Your initial reasoning was mathematically sound based on the standard updating rule.
  Let $H$ be the Super's hypothesis (air pocket expansion) and $E$ be the evidence (radiator bangs only on cold nights).

  You stated you already knew $E$ with near certainty. In the limit where $E$ is treated as a known fact:
  $$P(E) = 1$$
  $$P(E|H) = 1$$ (Assuming the theory entails the evidence)

  By Bayes' Theorem:
  $$P(H|E) = \frac{P(E|H)P(H)}{P(E)} = \frac{1 \cdot P(H)}{1} = P(H)$$

  If $P(E) = 1$, the likelihood ratio is 1, and the posterior equals the prior. No confirmation occurs. This is the paradox. If Bayesianism requires $P(E) < 1$ for confirmation, then Bayesianism cannot account for theories being confirmed by data that already exists (e.g., General Relativity being confirmed by the pre-existing anomaly of Mercury's perihelion).

  ### 2. Resolution A: The Philosophical Fix (Relaxing Logical Omniscience)
  The standard Bayesian model assumes **logical omniscience**: it assumes that when you assign a prior $P(H)$, you already know all logical consequences of $H$.

  In reality, before the Super spoke, you did not know that $H \implies E$. You knew $E$ was true, and you had some prior belief about $H$ (probably low, because "air pockets" sound like guesses), but you did not know the *logical connection* between them.

  The update didn't happen on $E$ (the banging). The update happened on the proposition **$L$: "$H$ entails $E$."**

  *   **Time 1:** You know $E$. You have prior $P(H)$. You are uncertain about $L$ (whether the air pocket theory actually predicts the cold-night pattern).
  *   **Time 2:** The Super explains the mechanism. You now know $L$ is true ($P(L) \to 1$).

  You are updating on the **structural relationship**, not the empirical data. In formal terms (following Garber, 1983), you expand the possibility space to include sentences about the logical relations between hypotheses and evidence.
  $$P(H | E, L) > P(H | E, \neg L)$$
  Since learning $L$ makes $H$ a much better explainer of the certain fact $E$, your probability in $H$ goes up. Your intuition was right: you learned something new, just not about the radiator itself. You learned something about the *theory*.

  ### 3. Resolution B: The Statistical Fix (Counterfactual Likelihoods)
  As a stats PhD, you might prefer thinking about this in terms of model comparison and likelihood ratios rather than logical entailment.

  The issue with setting $P(E)=1$ is that it collapses the likelihood ratio. To make the math work, you have to treat $E$ not as "The radiator banged," but as "The radiator exhibits **pattern** $E$."

  Even if you knew the pattern existed, you need to evaluate the likelihood of that pattern arising under $H$ versus $\neg H$.
  *   **Under $H$ (Air Pocket):** The mechanism relies on thermal contraction. The probability of observing a strict correlation with freezing temps is high. $P(E|H) \approx 1$.
  *   **Under $\neg H$ (Random Noise / Other Causes):** Before the Super, $\neg H$ was a catch-all for "unknown causes." Do random pipe noises correlate strictly with outside temperature? Probably not. Do other mechanical failures correlate *only* with freezing temps? Maybe, but less likely.

  The confirmation comes from the **Bayes Factor**:
  $$BF = \frac{P(E|H)}{P(E|\neg H)}$$

  Even if $P(E)$ (the marginal probability of the evidence) is 1 because you've already seen it, the *likelihood* of that specific pattern existing under the null hypothesis ($\neg H$) is actually quite low.
  Before the Super, you might have implicitly assigned $P(E|\neg H) \approx 1$ because you had no model for $\neg H$ other than "stuff happens."
  The Super's explanation forced you to refine $\neg H$. Once you realize that "random pipe noise" rarely respects outside temperature thresholds, $P(E|\neg H)$ drops significantly (e.g., to 0.1).

  Now your Bayes Factor is $1 / 0.1 = 10$. That is a substantial update. You aren't updating on the existence of the bang; you are updating on the **surprisingness of the pattern** under alternative models.

  ### 4. Why It Felt Like "Extra" Credibility
  You mentioned the theory earned credibility "over and above just sounding mechanically plausible."

  This is because the theory solved a **degrees of freedom** problem.
  *   **Observation:** Bangs occur when $T_{outside} < 32^\circ F$.
  *   **Bad Theory:** "The pipes are old." (Predicts bangs always, or randomly. Low likelihood of the specific pattern).
  *   **Good Theory:** "Air pocket volume is a function of $\Delta T$." (Predicts bangs specifically when $\Delta T$ is maximized).

  Your brain recognized that the Super's hypothesis $H$ had the specific **functional form** required to generate $E$ without overfitting. In hierarchical modeling terms, the Super proposed a group-level parameter (air volume) that varies by a predictor (temperature) which perfectly explains the variance in the outcome (bangs).

  When you hear a story that fits old data, you are effectively performing a **posterior predictive check** in reverse. You are asking: "If I simulate data from this new model $H$, does it recover the features of the dataset I already have?" When the answer is "Yes, specifically the hard-to-explain features," the model evidence increases.

  ### Summary
  You are not biased. You are encountering the limits of the simplified $P(H|E)$ notation when $E$ is certain.

  1.  **Philosophically:** You updated on the *entailment relation* ($H \to E$), which was new information, not on $E$ itself.
  2.  **Statistically:** You updated on the *likelihood ratio* of the pattern $E$ under $H$ versus a refined $\neg H$, realizing the pattern is improbable under noise.

  The Super didn't give you new data; he gave you a **model** that made the old data informative. In Bayesian terms, he increased the likelihood $P(E|H)$ relative to $P(E|\neg H)$, which is the only thing that matters for confirmation. Your intuition is scientifically sound; the "paradox" is just an artifact of treating logical discovery as empirical sampling.
