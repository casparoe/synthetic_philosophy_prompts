answer: |-
  This is a fantastic pedagogical pivot. The Oswald minimal pair is indeed the canonical entry point, but your colleague is right to press you on whether the moral is "ambiguity" or "contextual constraint." The unified semantics view (championed by Stalnaker and later refined by von Fintel and Iatridou) is the dominant orthodoxy in formal semantics for a reason: it is parsimonious. However, your intuition about probability is the sharpest wedge against that orthodoxy.

  Here is a breakdown of the technical landscape to help you structure the seminar, followed by my own verdict on the unity vs. divergence debate.

  ### 1. The Failure of Truth-Functional and Strict Analyses

  To set the stage, you must establish why we need a possible-worlds framework at all.

  *   **The Material Conditional ($A \supset C$):** This analysis fails the Oswald pair immediately.
      *   *Indicative:* "If Oswald didn't kill Kennedy, someone else did." Since Oswald *did* kill Kennedy, the antecedent is false. The material conditional is vacuously true. This matches our intuition.
      *   *Counterfactual:* "If Oswald hadn't killed Kennedy, someone else would have." The antecedent is false. The material conditional is vacuously true. **This mismatches our intuition.** We take this sentence to be false (there was no conspiracy). The material conditional cannot distinguish the truth values of the pair.
  *   **The Strict Conditional ($\Box(A \supset C)$):** This requires $C$ to be true in *all* accessible $A$-worlds.
      *   This is too strong for ordinary indicatives. "If I drop this glass, it will break" is assertible, but it is not strictly necessary (someone might catch it).
      *   It also fails the Oswald counterfactual. It is not *necessary* that someone else would have killed Kennedy; it is merely a claim about what would have happened in the closest relevant scenario. Strict implication collapses the distinction between "would" and "must."

  ### 2. Stalnaker's Unified Semantics

  Robert Stalnaker's 1968 "A Theory of Conditionals" offers the elegant unified account your colleague is defending.

  *   **The Mechanism:** Stalnaker introduces a **selection function**, $f(A, w)$. Given an antecedent $A$ and a world $w$, $f$ selects the single "closest" or "most similar" world to $w$ where $A$ is true.
  *   **Truth Condition:** $A > C$ is true at $w$ iff $C$ is true at $f(A, w)$.
  *   **The Unified Claim:** The semantic value of 'if' is constant. It always triggers the selection function. The difference between indicative and counterfactual is **pragmatic**, specifically concerning the **Context Set** (the set of worlds compatible with the common ground of the conversation).
      *   **Indicatives:** The antecedent $A$ is presumed compatible with the context set. The selection function is constrained to pick a world *within* the context set. We are updating our information state.
      *   **Counterfactuals:** The antecedent $A$ is presumed false (or unlikely) relative to the context set. The selection function is allowed (or required) to reach *outside* the context set to find the closest $A$-world. We are engaging in modal reasoning about non-actual possibilities.

  **The Moral:** On this view, 'if' is univocal. The difference lies in the *domain* over which the similarity metric operates, determined by the speakers' presuppositions.

  ### 3. The Probability Wedge: Adams and Lewis

  This is where your intuition finds its formal footing. The unified semantic story struggles to accommodate the probabilistic behavior of the two constructions.

  *   **Adams's Thesis:** Ernest Adams proposed that the assertibility (or probability) of an indicative conditional is the conditional probability of the consequent given the antecedent:
      $$P(\text{If } A, C) = P(C|A)$$
      This fits the Oswald indicative perfectly. Given we know Kennedy was killed, the probability that someone else did it *given* Oswald didn't is high.
  *   **Lewis's Triviality Results (1976):** David Lewis proved that if conditionals express propositions (i.e., have truth conditions), there is no proposition $X$ such that $P(X) = P(C|A)$ for all probability functions (unless the probability space is trivial).
      *   **The Dilemma:** You cannot have standard truth conditions *and* maintain Adams's Thesis.
  *   **Divergent Conclusions:**
      *   **Lewis's Conclusion:** Lewis accepted possible-worlds semantics (truth conditions). Therefore, he concluded **Adams's Thesis is false.** He argued that the probability of a conditional is not conditional probability, but rather the probability that the selection function picks a $C$-world. He sacrificed the probabilistic intuition to save the semantic unity.
      *   **Adams, Gibbard, and Edgington's Conclusion:** They accepted the probabilistic data (Adams's Thesis captures our usage of indicatives too well to discard). Therefore, they concluded **Indicatives do not have truth conditions.** They are not propositions; they are expressions of conditional belief (Expressivism) or have non-standard semantics (Supervaluationism).

  **The Complication for Unity:** Adams's Thesis works remarkably well for **Indicatives**, but it fails miserably for **Counterfactuals**.
  *   Consider: "If I had dropped this glass, it would have broken."
  *   $P(\text{Break} | \text{Drop})$ might be high, but the counterfactual's truth depends on causal mechanisms, not just credence. More damningly, consider a lottery case. "If I had bought a ticket, I would have lost." $P(\text{Lose} | \text{Buy})$ is extremely high. But is the counterfactual *true*? Many intuitions say no, because in the closest world where I buy a ticket, I might win. Counterfactuals seem to track **causal similarity** rather than **epistemic probability**.

  If Indicatives obey Adams's Thesis (suggesting non-propositional status) and Counterfactuals violate it (suggesting propositional/modal status), the Stalnakerian claim that they are the same semantic mechanism becomes strained.

  ### 4. Taking a Side: The Case for Divergence

  For your seminar, I recommend you argue for the **Divergence (Ambiguity) Thesis**. While Stalnaker's unified account is elegant, it is too Procrustean. It forces us to ignore significant morphological and probabilistic data to preserve a symbolic economy that may not reflect cognitive reality.

  Here is the argument you should present to your students:

  **1. The Triviality Results Reveal a Category Error**
  Lewis's triviality results show that *if* conditionals are propositions, they cannot obey the probability rules that indicatives clearly obey. The most natural explanation is not that our probabilistic intuitions about indicatives are wrong (as Lewis suggested), but that indicatives and counterfactuals are different logical species.
  *   **Indicatives** are devices for **belief updating**. They operate within the epistemic modal base. Their "truth" is really a measure of coherence within an information state.
  *   **Counterfactuals** are devices for **causal reasoning**. They operate within a metaphysical or causal modal base. They make claims about the structure of the world, not just our information.
  Treating them as the same mechanism obscures the fact that one is primarily epistemic and the other primarily metaphysical/causal.

  **2. Morphology is Semantic, Not Just Pragmatic**
  Stalnaker treats the past tense in counterfactuals ("If Oswald *hadn't*...") as a pragmatic marker of distance from the context set. However, recent work (e.g., von Fintel & Iatridou) suggests this "fake past" is a semantic operator that shifts the modal base.
  *   Indicatives: Modal base = Epistemic.
  *   Counterfactuals: Modal base = Metaphysical/Causal + Exclusion of actual world.
  If the morphology triggers a different modal base, that is a semantic difference, not merely a pragmatic constraint on a single function. The "if" might be the same, but the *conditional construction* as a whole is semantically ambiguous.

  **3. Embedding and Negation**
  Indicatives and counterfactuals behave differently under negation and embedding.
  *   Negation: "It is not the case that if A, C." This is natural for counterfactuals (denying the connection). For indicatives, it often sounds like denying the antecedent or consequent, supporting the view that indicatives lack a propositional negation.
  *   If they were the same mechanism, we would expect uniform behavior under logical operators. We do not see this.

  **Conclusion for the Seminar**
  You should conclude that while Stalnaker's unified semantics is a powerful *formal* tool, it is likely not the correct *philosophical* explanation. The triviality results are not a puzzle to be solved by tweaking the selection function; they are a signal that Indicatives are not truth-conditional propositions in the way Counterfactuals are.

  The Oswald pair does not just show that context matters; it shows that we are using two different cognitive tools. One tool (Indicative) helps us navigate our current ignorance ("Given what we know..."). The other tool (Counterfactual) helps us understand the causal structure of reality ("Given how the world works..."). To treat them as the same semantic mechanism wearing different hats is to prioritize formal elegance over the functional reality of language.

  **Suggested Slide Revision:**
  Keep the Oswald pair. But add a third slide: **"The Probability Test."** Show that $P(C|A)$ predicts the acceptability of the Indicative but fails to predict the truth of the Counterfactual. Use this to motivate the Divergence view. It will give your linguist colleague a run for their money while validating your own philosophical instincts.
