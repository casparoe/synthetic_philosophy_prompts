      *   Discuss the specific philosophical objections to Gödel's axioms (e.g., modal collapse, positivity, essentialism).
      *   Address the role of formal epistemology (clarifying assumptions, not necessarily proving metaphysical truths).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's awareness of the project (it's a significant piece of work in digital humanities/logic). Immediately address the central misconception: Validity vs. Soundness.
      *   **The Logical Distinction (Crucial Point):**
          *   Theorem provers check: $Axioms \vdash Conclusion$.
