          *   *Axiom of Positivity:* What does "positive property" mean? Is it objective? Is it closed under entailment?
          *   *Modal Collapse:* A known issue Benzmüller actually highlighted. If God exists necessarily, does everything happen necessarily? (Determinism vs. Free Will).
