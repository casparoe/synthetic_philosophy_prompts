      *   *Fact:* They found some inconsistencies in Gödel's original axioms (specifically regarding "essence" and "necessary existence") and proposed fixes (like Scott's variant).
      *   *Critical Distinction:* **Validity** vs. **Soundness**.
          *   *Validity:* If premises are true, conclusion *must* be true. (The machine checks this).
          *   *Soundness:* The argument is valid *AND* the premises are actually true. (The machine *cannot* check this).
      *   *User's Error:* The user claims the argument is certified as *sound*. The machine only certifies *validity* (derivability of conclusion from axioms).

  3.  **Formulate the Core Argument:**
