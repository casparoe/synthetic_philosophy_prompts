answer: |-
  Your roommate was right, but she was also being a bit of a philosopher about it (which is to say, unhelpfully cryptic). You are gesturing at a field called **epistemology**, which is the study of knowledge: how we know what we know, and what justifies a belief.

  Your cousin is using a classic philosophical trap called **Radical Skepticism** (specifically a version of the *Agrippan Trilemma*). His argument is: *"You weren't there, so you rely on testimony. Testimony relies on sources. Sources rely on institutions. Institutions can lie. Therefore, you don't know."*

  Technically, he is correct that you do not have *absolute, Cartesian certainty* that the moon landing happened. But here is the defensible difference: **Knowledge isn't about absolute certainty; it's about justified belief based on the best available explanation.**

  Your ground and his ground are *not* the same. Here is the framework you need to understand why, and how to explain it without just listing facts he will reject.

  ### 1. The Difference Between "Certainty" and "Justification"
  Your cousin is conflating *certainty* (I cannot possibly be wrong) with *justification* (I have excellent reasons to believe this).

  If we require absolute certainty for knowledge, you cannot know the sun will rise tomorrow, you cannot know your food isn't poisoned, and you cannot know you have a brain. You haven't seen your own brain; you just trust medical textbooks.

  The defensible difference is that your belief is **provisional but highly justified**, whereas his belief is **dogmatic and unfalsifiable**.
  *   **Your position:** "Given the massive convergence of evidence, the likelihood of the moon landing being real is so close to 100% that treating it as false is irrational. However, if new, verifiable evidence emerged contradicting it, I would have to update my view."
  *   **His position:** "No amount of evidence can prove it happened, because all evidence is potentially part of the fabrication."

  ### 2. Falsifiability (The "Black Hole" Test)
  This is the strongest philosophical tool you have. It comes from Karl Popper. For a claim to be scientific or rational, there must be some hypothetical evidence that could prove it wrong.

  *   **Mainstream View:** Is falsifiable. If the lunar rocks brought back were made of limestone (which exists on Earth) or had water inclusions that shouldn't exist in a vacuum, the moon landing theory would collapse. If the Soviet Union had released telemetry showing the Apollo signal never left low Earth orbit, the theory would collapse.
  *   **Conspiracy View:** Is *unfalsifiable*. It is a "black hole" of logic.
      *   Evidence of radiation? "They found a way around it."
      *   No radiation? "They faked the detectors."
      *   Soviet confirmation? "They were in on it."
      *   Soviet denial? "They were duped."
      *   Photos from Lunar Reconnaissance Orbiter showing landing sites? "CGI."

  If a belief system is structured so that *every possible outcome* confirms the belief, it is not a rational position; it is a faith position. You can point out to your cousin that **his confidence is not based on evidence, but on an immunity to evidence.**

  ### 3. Consilience (The Web vs. The Stack)
  You mentioned you are trusting a "stack" of footage and textbooks. That feels fragile. But the reality is actually a **web** of independent data points, a concept called *consilience* or "jumping together."

  The moon landing isn't one claim supported by NASA. It is a claim supported by:
  *   **Geologists** (who analyze the rocks without caring about NASA).
  *   **Amateur Astronomers** (who tracked the spacecraft independently).
  *   **The Soviet Union** (rivals with every incentive to debunk it).
  *   **Physicists** (who understand the propulsion).
  *   **Modern Satellites** (from multiple countries, not just the US, that have photographed the landing sites).

  For your cousin to be right, he doesn't just need NASA to be lying. He needs a global, multi-generational conspiracy involving geologists, rival superpowers, independent astronomers, and engineers across decades to all tell the exact same lie perfectly, without a single deathbed confession or leaked document proving the fabrication.

  **The Defensible Difference:** You are trusting a *convergence of independent lines of inquiry*. He is trusting a *single narrative* (the conspiracy) that requires him to dismiss all those independent lines as a single, coordinated illusion.

  ### 4. Inference to the Best Explanation
  In philosophy and science, we use **Abductive Reasoning** (Inference to the Best Explanation). We look at the data and ask: *Which story explains all the facts with the fewest assumptions?*

  *   **Story A (Mainstream):** Humans built rockets, went to the moon, came back.
      *   *Assumptions:* Physics works as described; thousands of people kept a technical secret for a few years but not a conspiracy forever.
  *   **Story B (Conspiracy):** Humans faked it.
      *   *Assumptions:* Thousands of people kept a murderously large secret for 50+ years; the Soviets were either incompetent or co-conspirators; lunar geology was perfectly simulated before we knew what lunar geology looked like; gravity and optics work differently in the footage than in reality.

  Story B requires exponentially more assumptions and more "miracles" of coordination than Story A. Your confidence is based on **Occam's Razor** (the simplest explanation is usually the correct one). His confidence is based on rejecting the simplest explanation in favor of the most complex one.

  ### How to Talk to Him (Without Arguing Facts)
  Do not bring up footage or engineers again. He has pre-loaded counter-arguments for all of them. Instead, argue **method**.

  **1. Ask the "Falsifiability" Question:**
  > "I'm curious, what evidence *would* change your mind? If we found a document, or a piece of tech, or a testimony that proved it was real, what would that look like? Or is there nothing that could change your mind?"
  > *If he says nothing can change his mind, you can politely point out that means he's operating on faith, not inquiry.*

  **2. Point Out the "Cost" of the Belief:**
  > "I get that you don't trust NASA. But for this to be a fake, it's not just NASA. It's the Soviets, it's the Japanese space agency, it's independent astronomers in the 60s, and it's geologists today. I'm not asking you to trust NASA. I'm asking you to trust that it is harder to fake the entire world's scientific data for 50 years than it is to just go to the moon."

  **3. Acknowledge the Skepticism (Disarm Him):**
  > "You were right about one thing at Thanksgiving. I wasn't there. I don't have absolute certainty. I'm operating on the same basis I use to believe antibiotics work or that electricity is real: I trust the consensus of independent experts because the alternative requires me to believe in a magic trick bigger than the technology itself."

  ### Summary
  Your cousin is not "basically right." He is using a philosophical sledgehammer (Radical Skepticism) to smash a window (Historical Fact). While skepticism is healthy, **universal skepticism is paralysis.**

  The difference between you is that your belief is **open to being wrong** (if the evidence demanded it), whereas his belief is **closed to being wrong** (by defining all evidence as fake). That is a fundamental structural difference in how you process reality, not just a difference in which YouTube channels you watch.

  You are standing on a web of converging, independent data. He is standing on a single premise ("They lie") that he protects from all data. That is a defensible distinction.
