      *   Key Concept 1: *Epistemic Justification.* It's not just about believing; it's about *why* and *how* you believe.
      *   Key Concept 2: *Inference to the Best Explanation (Abductive Reasoning).* We choose the theory that explains the most data with the fewest assumptions.
      *   Key Concept 3: *Falsifiability (Popper).* Can the claim be proven wrong?
      *   Key Concept 4: *Burden of Proof.* Who has to provide evidence?
      *   Key Concept 5: *Coherentism vs. Foundationalism.* The cousin is attacking Foundationalism (basic beliefs). The user needs to argue for Coherentism (web of beliefs) or Reliabilism.
      *   Key Concept 6: *The "Self-Sealing" Nature of Conspiracy Theories.* This is crucial. The cousin's belief system is immune to evidence.

  4.  **Formulate the Argument (The "Defensible Difference"):**
      *   *Is the user right that they are the same?* No.
      *   *Why?* It's about the *structure* of the belief, not just the *source*.
      *   *Point 1: Radical Skepticism is a dead end.* If you apply "I wasn't there" to everything, you can't function. You have to accept some baseline of reality. The difference is where you draw the line of "reasonable doubt."
      *   *Point 2: Consilience (Convergence of Evidence).* The moon landing isn't one claim; it's thousands of independent data points (rocks, telemetry, tracking, Soviet monitoring, photos, later satellites). The conspiracy requires a separate, massive, perfect explanation for all of those.
      *   *Point 3: Falsifiability.* The mainstream view accepts evidence that could disprove it (e.g., if rocks were made of cheese). The conspiracy view reinterprets *any* evidence as part of the conspiracy. This makes it unfalsifiable and therefore non-scientific.
      *   *Point 4: Cost/Complexity.* The conspiracy requires more assumptions (thousands of silent conspirators, fake rocks that match lunar geology perfectly, Soviets in on it or duped perfectly) than the standard view (humans went). Occam's Razor.

