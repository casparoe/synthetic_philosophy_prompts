prompt: |-
  I'm part of an angel-investing syndicate of about a dozen members that meets monthly to evaluate early-stage pitches. After each founder's Q&A, we go around the table in a fixed seating order, and every member states, in turn, whether they are "in" or "out" on the deal, together with a one-line reason. Looking back over the past year of meetings, I've noticed that the first two or three verdicts almost always predict the eventual unanimous or near-unanimous outcome, even on deals where, in private conversation afterward, several members admit they were not especially confident and had largely been swayed by how the earlier votes went.

  A friend who studies behavioral economics suggested that this looks like a textbook information cascade of the kind formalized by economists such as Bikhchandani, Hirshleifer, and Welch, rather than a case of the group genuinely converging on the right answer through independent judgment. That diagnosis struck me as plausible, but also somewhat unsettling, since our entire informal governance structure assumes that a unanimous "in" or "out" reflects the pooled wisdom of everyone in the room rather than the opinion of whoever happened to speak first.

  Assuming my friend is broadly right that our sequential, public voting procedure generates rational herding rather than an honest aggregation of private information, please describe the most important implications of information-cascade and rational-herding theory for a small, recurring decision-making group like ours. I would especially like to understand how much epistemic weight a unanimous vote should actually carry once a cascade has plausibly started, and whether attaching a one-line reason to each vote, rather than a bare in/out signal, meaningfully changes the standard cascade dynamics. I'd also welcome any concrete implications the theory has for how we might sequence, time, or otherwise elicit votes so that the group actually pools its members' private information instead of converging on whichever view was voiced first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** An angel-investing syndicate (approx. 12 members), monthly meetings, sequential public voting ("in"/"out" + one-line reason) in fixed order.
      *   **Observation:** First 2-3 votes predict the outcome. Later voters admit being swayed by earlier votes (herding).
      *   **Diagnosis:** Friend (behavioral economist) suggests this is an *information cascade* (Bikhchandani, Hirshleifer, Welch - BHW model).
      *   **Goal:** Understand implications of cascade theory for this specific group.
      *   **Specific Questions:**
          1.  What is the epistemic weight of a unanimous vote once a cascade starts?
          2.  Does adding a "one-line reason" change the dynamics?
          3.  What concrete procedural changes (sequencing, timing, elicitation) can mitigate cascades and improve information pooling?

  2.  **Deconstruct the Theory (Information Cascades):**
      *   *Core Mechanism:* Individuals have private signals (their own due diligence/intuition) and observe public actions (votes) of predecessors. If public actions outweigh private signals, individuals ignore their own info and follow the crowd.
      *   *Fragility:* Cascades are brittle. A little new public info can break them.
      *   *Efficiency:* Cascades stop the aggregation of private information. The group stops learning after the cascade begins.
      *   *Error:* If the first few people are wrong, the whole group goes wrong (path dependence).

  3.  **Address Question 1: Epistemic Weight of a Unanimous Vote:**
      *   *Intuition:* 12 "Ins" looks stronger than 3 "Ins".
      *   *Cascade Reality:* If a cascade starts at voter #3, voters 4-12 add *zero* new information. They are just echoing the public signal.
      *   *Conclusion:* The weight is effectively capped at the number of voters *before* the cascade threshold. A 12-0 vote might only carry the weight of a 3-0 vote. It creates a false sense of confidence (overconfidence).

  4.  **Address Question 2: The "One-Line Reason" Modifier:**
      *   *Standard Model:* Usually assumes binary actions.
      *   *Cheap Talk vs. Costly Signaling:* A one-liner is often "cheap talk." It can be rationalized to fit the herd ("I'm out because valuation is high" vs. "I'm in because team is strong").
      *   *Nuance:* It *can* help if the reason reveals private signal intensity or specific data not visible to others. But if it's just post-hoc rationalization (which the user hints at), it reinforces the cascade.
      *   *Verdict:* Likely insufficient to stop cascades, might even lubricate them by providing social cover.

  5.  **Address Question 3: Procedural Mitigations (The "How-To"):**
      *   *Goal:* Force revelation of private signals *before* observing public actions.
      *   *Idea 1: Simultaneous Voting.* Write down votes, reveal at once. (Classic solution).
      *   *Idea 2: Randomized Order.* Don't let the same seniors speak first every time.
      *   *Idea 3: Pre-Meeting Submission.* Collect votes before the discussion.
      *   *Idea 4: Designated Devil's Advocate.* Force someone to argue against the emerging consensus.
      *   *Idea 5: Prediction Markets/Confidence Scores.* Ask "How sure are you?" not just "In/Out".

  6.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Validate the friend's diagnosis. It fits the BHW model perfectly. Acknowledge the stakes (money).
      *   *Section 1: The Epistemic Weight of Unanimity.* Explain the "cap" on information. Use the math intuition (log-likelihood ratios) without getting too bogged down. Emphasize *fragility*.
      *   *Section 2: The One-Line Reason.* Analyze if it's informative or rationalization. Introduce the concept of "cheap talk." Suggest how to make it useful (specific data points vs. vague sentiment).
      *   *Section 3: Structural Reforms.* This is the actionable part.
          *   *Secret Ballot:* The gold standard for breaking cascades.
          *   *Pre-Commitment:* Write it down before the meeting.
          *   *Order Randomization:* Prevent "anchor" voters.
          *   *Confidence Weighting:* Distinguish between "weak signal following herd" and "strong signal against herd."
      *   *Section 4: Cultural/Normative Shifts.* Encourage dissent. Make it safe to be the outlier.
      *   *Conclusion:* Summarize the main takeaway (Unanimity is an illusion of consensus, not necessarily accuracy).

  7.  **Refining the Tone:**
      *   Needs to be professional, analytical, yet accessible.
      *   Avoid overly dense jargon, but use the correct terms (private signals, public pool, fragility).
      *   Empathize with the social dynamics (it's awkward to contradict friends/peers).

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I answer the specific question about the one-liner?* Yes, need to be clear that it often fails to stop cascades unless structured carefully.
      *   *Is the distinction between "cascade" and "social pressure" clear?* Cascades are *rational* (Bayesian) updating. Social pressure is psychological. The user's friend said "rational herding," so stick to the economic model, but acknowledge social pressure often accompanies it.
      *   *Practicality:* Angel syndicates are informal. Suggesting a complex auction mechanism is bad. Suggesting a Google Form before the meeting is good.

  9.  **Final Polish:** Check against the BHW model specifics. The key insight is that once the public pool outweighs private signal precision, private info is discarded. Ensure this is explained clearly. (The "weight" of the vote drops to zero for later voters).

