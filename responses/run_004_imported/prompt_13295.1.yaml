  2.  **Deconstruct the Philosophical Argument (Lewis vs. The Toast):**
      *   *Lewis's View:* Conventions are solutions to coordination problems. They are arbitrary (another solution could have worked). They persist due to common knowledge of preferences and expectations.
      *   *The User's Dilemma:* If it's all arbitrary, is the love/relationship special?
      *   *The Resolution:* History and commitment transform arbitrariness into necessity. *Path dependence.* Once a convention is established, switching costs become emotional, not just practical. The "arbitrary" choice becomes *their* choice. The normativity emerges from the history of coordination.
      *   *Key Insight:* The value isn't in *which* equilibrium was chosen, but in the *act of maintaining* the equilibrium together against entropy.

