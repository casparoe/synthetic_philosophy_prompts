      *   **Goal:** Finish the argument in the toast. Grant Daniel's premises (arbitrariness, coordination equilibrium, mutual expectation) but conclude that the relationship is still real, distinct, and valuable.
      *   **Key Philosophical Move:** Argue that a coordination convention, sustained over time, acquires normative weight (breaking it is a betrayal, not just a deviation).
      *   **Audience:** Mixed. ~1/3 are decision theorists (bride's cohort/professors) who will catch technical terms. ~2/3 are family/general public who need it to land emotionally, not academically.
      *   **Tone:** Honest, witty, warm, philosophically precise but accessible, ending in a genuine toast.
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).
