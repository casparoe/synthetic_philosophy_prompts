answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the distinct privilege of standing here today.

  I need to begin with a confession. Two weeks ago, I got into a rather heated argument with my friend Daniel, who is sitting three tables back, looking entirely too smug for a man in a tuxedo.

  We were arguing about David Lewis's account of convention. Daniel's position was that everything we are doing here—the order in which the groomsmen walked down the aisle, the exchange of rings, even the fact that you are all currently holding glasses waiting for me to tell you to lift them—is what philosophers call a "coordination equilibrium."

  For the benefit of my parents, and the rest of the family: this basically means we do these things not because they are the *only* way to do them, or even the *best* way, but simply because we all expect everyone else to do them. It is arbitrary. We could have walked in backwards. We could have exchanged toasters instead of rings. As long as we all agreed on the alternative, it would have worked just as well.

  Daniel didn't stop at the ceremony. He argued that the marriage itself rests on the same foundation. The private jokes that end a fight, the specific phrase whispered at airport security, the way one of you takes the coffee and the other takes the tea—on Lewis's picture, these are just arbitrary solutions to coordination problems that happened to calcify over time.

  For a while, I was worried. Because if Daniel is right, if these rituals are arbitrary, does that make them hollow? If the specific shape of your love is just a historical accident, is it less real?

  Tonight, I want to concede the point to Daniel. He is right. The equilibrium is arbitrary. There is no cosmic law that dictated you two would meet in a coffee shop rather than a library, or that your secret handshake involves a specific squeeze of the hand rather than a wink. Another couple, in another world, could have built a happy life on a completely different set of rules.

  But where Daniel is wrong—and where I intend to finish this argument—is in thinking that arbitrariness implies insignificance.

  In decision theory, a convention is arbitrary in its origin, but it is not arbitrary in its maintenance. Once a coordination equilibrium is established, it acquires what we call "normative weight."

  Think of it like this: If I were to walk up to the groom right now and hug him instead of shaking his hand, it would be a deviation. But if I stopped saying hello to him entirely, it would be a betrayal. Why? Because the history of our coordination creates an obligation. The fact that we *could* have been strangers doesn't change the fact that we *are* friends.

  This is the miracle of what [Bride] and [Groom] have built. Yes, the specific rituals of your relationship are arbitrary. You could have loved each other differently. But you didn't. You solved the coordination problem of two lives merging into one by choosing specific ways to care, specific ways to apologize, specific ways to say "I'm here."

  And by repeating those choices, day after day, you have transformed a mere convention into a commitment. You have taken something that *could* have been otherwise and made it something that *must* be this way, because to do otherwise would be to break the trust you've built. The arbitrariness of the start doesn't diminish the necessity of the continuation. In fact, it highlights it. You aren't together because the universe forced you into this specific equilibrium; you are together because you wake up every day and choose to maintain it.

  [Bride], I know you're finishing your PhD in decision theory, so you know better than anyone that rational agents can drift apart when incentives change. But love is the irrational commitment to keep the incentives aligned. It is the refusal to treat your shared conventions as renegotiable contracts.

  So, Daniel, I grant you the premise. The structure is arbitrary. The vows, the rings, the processional, the private jokes—they are all coordination equilibria. But I argue that a coordination convention, kept up long enough, loved hard enough, stops being merely convenient and starts carrying real normative weight. Breaking it wouldn't just be a deviation; it would be a betrayal.

  And that is why this is beautiful. Not because it was destined, but because it was chosen, and is chosen again, every single day.

  So, if everyone could please raise their glasses.

  To [Bride] and [Groom]. May your coordination always be stable, may your expectations always be met, and may the arbitrary conventions of your love become the necessary truths of your lives.

  To the couple.
