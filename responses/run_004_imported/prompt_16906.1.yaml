prompt: |-
  For the past three years I've been part of my school's Environmental Action Committee, and this spring our principal finally agreed to let the whole student body vote, during an all-school assembly, on whether next year's $40,000 discretionary grant from the school foundation should go toward rooftop solar panels instead of repaving the west parking lot. I've been asked to give the closing speech right before we open the vote, and I would like it to actually change some minds rather than just make six hundred people feel briefly guilty before recess.

  The complication is that last semester I took our school's one-semester Philosophy elective, taught by Dr. Alvarez, who also happens to be the Committee's faculty advisor and will be standing at the back of the gym for the entire assembly. For a short unit on obligations to future generations, she had us read the chapter on the Non-Identity Problem from Derek Parfit's Reasons and Persons, including his example of the fourteen-year-old girl and his comparison of a resource policy of "Depletion" against one of "Conservation." I mentioned to some committee friends afterward that I wasn't sure I could still, in good conscience, give the speech everyone is expecting, which is some version of "if we don't act now, we are condemning our own children and grandchildren to a ruined planet," and they mostly told me I was overthinking a four-minute pep talk. But once you take the Non-Identity Problem seriously, that sentence stops being obviously true: exactly which people get born decades from now depends on countless downstream effects of whichever choice we make today, so the actual people living with a worse climate would never have existed at all under the better policy — different people entirely would exist instead — and if their lives are still worth living, it is genuinely unclear that our choice harms them, even though the choice still feels wrong.

  Could you write me that speech? I need something I could actually deliver in under five minutes (so, roughly 500-600 words) that gives the rest of the room a real, energetic reason to vote for the solar panels without quietly resting on the "we are harming specific future people" framing, but that is still honest enough about the underlying problem that Dr. Alvarez couldn't accuse me afterward of having dodged it — ideally without ever turning into a philosophy lecture or saying the word "Parfit" out loud.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a closing speech for a school assembly vote.
      *   **Topic:** Voting on whether to use a $40,000 grant for rooftop solar panels (Environmental Action Committee's choice) vs. repaving the west parking lot.
      *   **Speaker:** A student member of the Environmental Action Committee (3 years involvement).
      *   **Audience:** 600 students, faculty, principal.
      *   **Constraint 1 (Length):** Under 5 minutes, roughly 500-600 words.
      *   **Constraint 2 (Content):** Must persuade students to vote for solar panels without relying on the standard "we are harming future generations/our children" argument.
      *   **Constraint 3 (Philosophical Integrity):** Must acknowledge the complexity raised by the Non-Identity Problem (learned in Dr. Alvarez's Philosophy class) without explicitly naming it, Parfit, or turning into a lecture. It needs to be honest enough that Dr. Alvarez (faculty advisor) won't feel the speaker dodged the issue.
      *   **Tone:** Energetic, persuasive, genuine, not guilt-trippy.
      *   **Key Insight:** The standard argument ("if we don't act, we ruin the future for specific people") is philosophically shaky due to the Non-Identity Problem (different choices lead to different people being born, so you can't say you harmed *them* specifically if their lives are still worth living). The speech needs to find a *different* justification for acting on climate/environment that bypasses specific harm to specific future individuals while still motivating action.

  2.  **Deconstruct the Philosophical Problem (Non-Identity Problem):**
      *   *Standard View:* Choice A (Pollute) leads to Future People X having bad lives. Choice B (Conserve) leads to Future People X having good lives. Therefore, A harms X.
      *   *Parfit's View:* Choice A (Pollute) changes history so much that Future People Y are born instead of X. If Y's lives are worth living, A didn't harm Y (because without A, Y wouldn't exist). So, how is A wrong?
      *   *Solution for Speech:* Shift the justification from "harm to specific future individuals" to something else. Possibilities:
          *   Impersonal principles (a world with less suffering is better, regardless of *who* lives in it).
          *   Stewardship/Character (what kind of people *we* want to be now).
          *   Continuity/legacy (respecting the chain of existence, even if identities shift).
          *   Justice/Fairness (principles of distribution, not specific victims).
          *   Immediate benefits (energy independence, learning tool).
      *   *Requirement:* The prompt asks to be "honest enough about the underlying problem." So I can't just ignore the future argument; I need to pivot *away* from it gracefully, acknowledging that the future is uncertain or that the connection is complex, but focusing on *values* or *principles* instead of specific harm.

  3.  **Drafting Strategy:**
      *   **Opening:** Acknowledge the choice (Solar vs. Parking). Hook the audience.
      *   **Middle (The Pivot):** Address the "future generations" argument but nuance it. Don't say "we save them." Say "we set a standard." Acknowledge that the future is unknowable (hinting at the identity problem without naming it).
      *   **Core Argument:** Focus on *who we are* right now. The act of choosing solar is a statement of values. It's about integrity, stewardship, and sending a signal. It's about making the world better *in principle*, even if we can't trace the specific beneficiaries.
      *   **Closing:** Call to action. Vote for solar.
      *   **Tone Check:** Energetic, not preachy. No jargon.
      *   **Word Count Check:** Aim for ~550 words.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Good morning. We know the choice. Parking lot vs. Solar. One is easy, one is hard.
      *   *The "Future" Argument:* Usually, I'd tell you we're doing this for our kids. But honestly? That's complicated. The future is a mystery. The people who come after us depend on what we do today in ways we can't predict.
      *   *The Pivot:* So if we can't guarantee *who* we're helping, why do it? Because it's not about *them*. It's about *us*. It's about the kind of community we claim to be.
      *   *The Principle:* Choosing solar isn't a transaction; it's a testament. It says we value sustainability over convenience. It says we care about the trajectory, even if we can't see the destination.
      *   *Dr. Alvarez Nod:* Subtle nod to the philosophy class ideas without naming them. "Some might say the connection is too distant to matter." Counter: "Principles matter regardless of the recipient."
      *   *Conclusion:* Let's choose the panels. Not because it's easy, but because it's right.

  5.  **Refining and Polishing (incorporating the Non-Identity nuance):**
      *   Need to make sure I don't say "we are harming future people."
      *   Instead: "We are choosing the kind of world that exists."
      *   Phrase idea: "It's not about saving specific people we'll never meet. It's about ensuring that whoever *does* meet inherits a place we're proud to give them."
      *   Wait, the Non-Identity Problem says "whoever does meet" *changes* based on the choice. So I need to be careful.
      *   Better angle: "Impersonal Value." A world with solar is better than a world without, regardless of the population count. Or "Virtue Ethics" – what does this action say about *our* character?
      *   Let's go with Character + Principle. "We choose this because it aligns with truth, not because it prevents specific harm."
      *   Actually, a strong angle is: "We aren't voting for *them*. We're voting for *us*." But that sounds selfish.
      *   Revised Angle: "We are voting for the *principle* of care." Even if the specific beneficiaries shift, the *act* of conservation is morally superior to depletion.
      *   Let's try to weave the "different people" idea subtly. "The future is not a fixed destination we are driving toward. It is something we are building brick by brick. The people who walk these halls in fifty years? They exist because of choices made today. We can't know their names. But we can know what kind of ground they stand on."

  6.  **Writing the Draft (monitoring word count):**

      *   *Start:* Principal [Name], faculty, fellow students.
      *   *Body:* Acknowledge the parking lot. It's convenient. Solar is abstract.
      *   *The Philosophical Bit:* "I used to think I'd stand here and tell you this is about saving our grandchildren. But the truth is more complicated. The choices we make today change everything downstream—even who gets born. We can't promise to save specific people. That promise is too fragile."
      *   *The Turn:* "But that doesn't mean the choice doesn't matter. It matters because it defines *us*."
      *   *The Call:* "Vote for the panels. Not out of guilt, but out of integrity."

  7.  **Review against Constraints:**
      *   < 5 mins? Yes, ~600 words is about 4 mins at average speaking pace.
      *   No "Parfit"? Yes.
      *   No "Non-Identity Problem"? Yes.
      *   Honest about the problem? Yes, acknowledges the uncertainty of future identity.
      *   Persuasive? Yes, shifts to virtue/principle.
      *   Dr. Alvarez approval? She should recognize the engagement with the material without the jargon.

  8.  **Final Polish:** Check flow and energy. Ensure the transition from the philosophical doubt to the motivational close is smooth. (Self-Correction: Make sure I don't sound *too* skeptical. Keep the energy up.)

      *   *Drafting thought:* Instead of saying "who gets born," say "the future isn't a fixed audience."
      *   *Drafting thought:* Emphasize the *symbol* of the solar panels. They are visible proof of values.

  9.  **Final Word Count Check:** Aiming for 550-ish.

