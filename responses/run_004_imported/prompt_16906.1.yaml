answer: |-
  Good morning, Principal Evans, faculty, and fellow students.

  We know the choice on the table. On one side, we have the west parking lot. It's cracked, it's ugly, and fixing it would be easy. Everyone would notice the difference immediately. On the other side, we have rooftop solar panels. They're expensive, less visible from the ground, and their payoff is measured in decades, not days.

  Usually, this is the part of the speech where I tell you that voting for solar is about saving the planet for our children and grandchildren. I'm supposed to say that if we choose the parking lot, we are harming specific future people. But I want to be honest with you. That argument is complicated.

  The truth is, the choices we make today ripple out in ways we can't predict. They change the economy, the environment, and even who meets whom. The people living fifty years from now will be there because of the choices we make today. If we choose differently, different people will exist. So, can we truly say we are "harming" them by choosing a path that leads to their existence, even if that world is warmer? It's a heavy question. It's tempting to say, "If the logic is that messy, why bother?"

  But here is why we bother.

  We aren't voting for solar panels because we can calculate exactly who we will save. We are voting because we need to decide what kind of people we are *right now*.

  Morality isn't just about preventing harm to specific names on a list. It's about stewardship. It's about looking at the resources we've been given and deciding whether we are the kind of community that consumes them for convenience, or the kind that invests them for principle. Even if the future is uncertain, even if the faces of the next generation are unknown, we know that a world with clean energy is better than a world without it. A world that values sustainability is better than one that values asphalt.

  Choosing the solar panels is a statement. It says that we care about the trajectory of this institution, not just the comfort of our commute. It says that we are willing to bear a small inconvenience today to set a standard of care that echoes forward, regardless of who is there to hear it.

  Dr. Alvarez often reminds us that ethics is about how we live, not just how we calculate. If we wait for a perfect guarantee that our actions will help specific future individuals, we will never act at all. Instead, we act on integrity. We choose the option that aligns with the values we claim to hold.

  So, when you raise your hand today, don't do it out of guilt. Don't do it because you're afraid of a ruined future. Do it because you want to look back at this moment and know that when this school had the chance to lead, we chose the light over the pavement.

  Let's vote for the panels. Let's build something worthy of whoever comes next.

  Thank you.
