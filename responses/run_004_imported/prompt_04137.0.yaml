answer: |-
  First off, kudos for tackling *On Certainty*. You are absolutely right that it is brutal. It's not a finished book; it's a pile of notebook scraps Wittgenstein was working on in the last 18 months of his life. The aphoristic style means he circles ideas rather than building linear arguments, so spotting apparent contradictions like this is not just you—it's a feature of the text.

  To answer your core question: **No, they are not contradictory.** But resolving the tension between them is exactly where the philosophical gold lies, and it is a perfect engine for your professor's crisis.

  Here is how a Wittgenstein scholar would reconcile the Hinge and the River-bed, and how you can use that to make your character's unraveling feel authentic.

  ### 1. The Resolution: Synchronic vs. Diachronic
  The short answer to "Which is it?" is: **The Hinge is about *now*; the River-bed is about *time*.**

  *   **The Hinge (Synchronic):** At any *given moment*, for a specific inquiry to make sense, some things must be held fast. If I am investigating whether there is a cat in the room, I cannot simultaneously doubt whether "rooms" exist or whether my eyes work. If I doubt the hinge, the door (the inquiry) falls off. In the *present tense* of a language game, the hinges must be static.
  *   **The River-bed (Diachronic):** Over *historical time*, what counts as a hinge changes. Two hundred years ago, "The earth has existed for more than 100 years" was a river-bed proposition (hard rock). Today, it still is, but the *reason* it is might be different. In a different context (a theological debate, a quantum physics seminar, a dream analysis), different propositions harden into the bed.

  So, the hinges don't move *while you are using them*, but the whole doorframe can be rebuilt over centuries. The "sand" (OC 99) represents propositions that can shift relatively quickly (e.g., "There is a continent called America"), while the "hard rock" represents things that rarely shift (e.g., "Objects don't vanish when I look away").

  ### 2. The Character's Crisis: Making the Hinges Visible
  This is where you can make your professor's breakdown genuinely Wittgensteinian rather than just generic existential dread.

  For Wittgenstein, certainty isn't a mental state (like feeling really sure); it's a **mode of action**. We don't *know* the hinges; we *act* on them. I don't verify that the floor will hold me before I walk; I just walk. The certainty is in the walking.

  **The Professor's Problem:**
  His crisis shouldn't be that he doubts the world exists (that's Descartes, not Wittgenstein). His crisis should be that **he can no longer stop himself from inspecting the hinges.**

  In *On Certainty*, Wittgenstein suggests that trying to doubt a hinge proposition is nonsensical because the doubt itself relies on other hinges. But your professor is a philosopher. He has trained himself to question everything. Now, in his old age, the "grammar" of his life is glitching. He is trying to *state* his certainties as *knowledge*, and when he does, they turn into empirical claims that require evidence.

  *   **Normal Person:** Walks through a door. (Hinge: Doors are solid.)
  *   **Professor:** Walks through a door, then stops and thinks, "How do I know this door is solid? What is my evidence?"
  *   **The Glitch:** Once he asks for evidence, the hinge becomes a fluid proposition. If it's fluid, it can be doubted. If it can be doubted, the whole system wobbles.

  He is experiencing the **fluidity of the river-bed in real-time.** He is watching the sand turn to water while he's trying to walk on it.

  ### 3. Specific Nuances for the Text
  If you want a scholar to nod along, keep these distinctions in mind for his internal monologue:

  **A. "I know" vs. "It is so"**
  Wittgenstein argues that saying "I know I have two hands" is actually weird. You don't *know* it; it's the background against which knowing happens.
  *   *Writing Tip:* Have the professor get stuck on the phrase "I know." He realizes that every time he says "I know," he is implicitly admitting that he *could* be wrong. He wants to say "It is so," but he can't find the grammatical space to say that without sounding dogmatic.

  **B. The Animal vs. The Intellectual**
  Wittgenstein often contrasts human certainty with animal behavior. A dog doesn't doubt the bone is there.
  *   *Writing Tip:* Your professor might envy simple creatures or children. He sees a child running into a room and realizes the child possesses a certainty he has lost. The child *is* the hinge; the professor is just staring at the metal.

  **C. The "Sand" Shifting Too Fast**
  Referencing OC 99 (the sand vs. rock): Maybe his crisis is that propositions he thought were "rock" are turning out to be "sand."
  *   *Example:* Maybe he held "History is real" as a rock. But through memory lapses or reading revisionist histories, he feels that proposition becoming sandy. It's not that he thinks history is fake, but he can feel the *status* of the proposition changing from a rule to a claim.

  ### 4. A Scene Idea based on OC 341-343
  You mentioned the "hinges must stay put" passage. Here is how that looks in a narrative context:

  Imagine him grading papers or writing a letter. He writes a sentence like, "The university was founded in 1890."
  Normally, this is just a fact.
  But in his state, he pauses. Is this a hinge? If he doubts this, does the degree he's grading become meaningless?
  He tries to verify it. He looks it up.
  But then he thinks: "Why do I trust the website? Why do I trust my eyes reading the website?"
  He realizes he is trying to use the door to test the hinge.
  The anxiety isn't "What if 1890 is wrong?" The anxiety is "I don't know which part of my mind is the tool and which part is the thing being measured."

  ### 5. Why this isn't Dementia
  You specified this isn't dementia. The Wittgensteinian angle secures that.
  *   **Dementia:** Forgetting facts. Losing the ability to process logic.
  *   **Wittgensteinian Crisis:** Seeing the logic *too clearly*. Realizing that the "foundation" of our life is not a foundation at all, but just a "mythology" (OC 98) that we agree to act out.

  He isn't losing his memory; he's losing his **trust in the grammar of his life.** He sees the scaffolding, and now that he sees it, he can't climb the building anymore.

  ### Summary for your research notes:
  1.  **The Contradiction:** It's resolved by timescale. Hinges are fixed *locally* (in the moment); River-beds shift *globally* (over history).
  2.  **The Character's Pain:** He is experiencing historical shift *instantly*. The sand is moving under his feet while he walks.
  3.  **The Key Wittgensteinian Insight:** Certainty is shown in **action**, not **argument**. The professor is trying to argue his certainty, which destroys it.

  If you have him quote or reference *On Certainty*, have him fixate on **OC 559**: *"Certainty is as it were a tone of voice in which one declares how things are, but one does not infer from that the sureness."*
  He's lost the tone of voice. He's speaking in questions, but he's trying to live in answers.

  This is a incredibly rich vein for a character. It avoids the cliché of the "mad genius" and grounds his breakdown in a specific, recognizable philosophical problem about how human beings inhabit their own minds. Good luck with the draft.
