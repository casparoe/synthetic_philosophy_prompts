          *   *Assessment:* This is a standard, accurate summary of Nagel's 1961 model (*The Structure of Science*). The mention of biconditionals is the standard interpretation (connectability), though Nagel was sometimes ambiguous about whether they must be biconditionals or just conditionals, but in the context of reduction (vs. replacement), biconditionals are usually expected to preserve the vocabulary. This is solid for a grad seminar.

      *   **Paragraph 2 (MR & Emergence):**
