answer: |-
  The city of Veridia sat in the belly of a dormant caldera, protected from the acid rains by the Great Sluice. The Sluice was governed by the Horologium, a brass and obsidian computer the size of a cathedral. For six hundred years, the Horologium had turned the valves that kept the city dry.

  Elara was the Senior Tuner. She knew the Horologium's mind better than anyone alive. She knew its clicks, its groans, the specific warmth of its main drive shaft.

  "It's the Input Sequence," Elara said, her voice echoing in the vast, oily chamber. She pointed to the ledger of the First Keeper, open on the pedestal. "Look. Day one: Input 2, Valve opens 1 unit. Day two: Input 4, Valve opens 2 units. Day three: Input 6, Valve opens 3 units."

  High Keeper Kael stood in the shadows, his face illuminated by the flickering pilot lights. "The Halving Rule. We know it, Elara."

  "The main drive gear has stripped," Elara said, holding up the broken bronze circle. "We have to cast a new one. But the new hydraulic pressure requires an Input of 101. We have never run an odd number before. In six hundred years, the Input has always been even."

  Kael stepped forward. "So?"

  "So, what is the output?" Elara asked. "If the rule is 'Halve the Input,' then 101 divided by 2 is 50.5. The valves only accept integers. Do we round down to 50? Or up to 51?"

  "Round down," Kael said immediately. "It preserves the pressure differential."

  "But why?" Elara pressed, stepping into the light. "You say the rule is 'Halve.' But look at the history. Every single past application of this rule is compatible with a different function. Let's call it 'Qualve.' *Qualve* means 'Halve for all numbers up to 100, but for 101, output 51.' It fits every entry in that ledger perfectly. Nothing in the past behavior of the Horologium distinguishes 'Halve' from 'Qualve.'"

  Kael sighed, the sound like wind in a tunnel. "Elara, don't start with the metaphysics. The First Keeper intended to Halve. He wrote it in the margins."

  "Did he?" Elara tapped the ledger. "He wrote symbols. Symbols are subject to interpretation. Maybe he meant 'Halve' as we understand it now, but maybe he meant 'Qualve.' How do you distinguish, inside your own head, between meaning *Plus* and meaning *Quus*? You have a disposition. You feel like you would have said 50.5. But that's just a feeling. A disposition is just a description of what you *would* do, not what you *should* do. If the Horologium was disposed to explode at Input 101, would that make exploding *correct*?"

  Kael rubbed his temples. "You're arguing that the rule is indeterminate."

  "I'm arguing that there is no fact of the matter about what the Horologium *means* to do," Elara said. "Not in the gears. Not in the ledger. Not even in the First Keeper's skull. He's dead. His neurons are dust. There is no internal state that locks in the future application of the rule. We are standing on a void, Kael. If I cast the gear for 50, and you cast it for 51, neither of us can claim to be following the *old* rule. We are both starting a new one."

  The alarm chimed. The acid rain was starting. The reservoir was rising.

  "We don't have time for skepticism," Kael snapped. "I am the High Keeper. I say we round down. 50."

  "On what authority?" Elara blocked the path to the casting mold. "Your disposition? Your intuition? That's just another finite state. Maybe you're following the rule 'Obey Kael,' and tomorrow you'll change your mind. If meaning is just what I feel I ought to do, then I feel I ought to round up. The pressure requires it."

  "The City will flood if you round up!"

  "Or it will corrode if you round down!" Elara shouted. "Don't you see? The physics doesn't decide. The math doesn't decide. The past doesn't decide. We are alone here."

  Kael looked at her, and for the first time, the certainty drained from his eyes. He saw the abyss she was pointing at. If he couldn't appeal to the past, and he couldn't appeal to his own internal certainty (which Elara had successfully dismantled as merely descriptive, not normative), then on what ground did he stand?

  He looked at the Horologium, silent and dark. Then he looked at the heavy iron bell on the wall—the Summoner.

  "You think there is no fact of the matter," Kael said quietly.

  "I know there isn't," Elara said. "Not in isolation."

  Kael walked to the bell and pulled the rope. The sound boomed through the caldera, deep and resonant.

  "What are you doing?" Elara asked.

  "Fixing the rule," Kael said.

  Minutes later, the Council of Elders arrived. Twelve men and women, shivering in their wet cloaks, representing the districts of Veridia. They stood around the pedestal, looking at the broken gear, then at Elara, then at Kael.

  Kael explained the situation. He did not hide the paradox. He told them that the ledger was silent, that the First Keeper was dead, and that the math allowed two paths. He told them that neither he nor Elara could claim to possess the 'true' meaning of the Halving Rule in their minds.

  "We cannot discover the correct continuation," Kael told them, his voice steady. "Because it was never there to be discovered. We must *make* it."

  He turned to Elara. "You argued that my disposition is not enough. You are right. My intuition is no better than yours. But the Community..." He gestured to the Elders. "The Community provides the normativity."

  One of the Elders, a woman from the Lower Slums whose homes would flood first, spoke up. "If we round down to 50, the pressure drops. The acid mist gets in. We get sick."

  "If we round up to 51," the Merchant Guild representative countered, "The seals blow. The reservoir drains. We have no water for the crops."

  They argued. It was not a debate about truth. It was a negotiation of survival. There was no appeal to the 'real' rule, because they accepted Kael's premise: the rule was a ghost. The only thing that was real was the consensus.

  Elara watched them. She felt a chill that had nothing to do with the damp. She had spent her life believing she was a guardian of the Truth, a priestess of the Machine's Intent. Now she saw she was merely a participant in a practice. The "correctness" of the gear tooth count would not come from the stars, or the math, or the First Keeper's ghost. It would come from the fact that if she tried to install the 'wrong' gear, these people would stop her. They would call her mistaken. They would correct her.

  That correction *was* the meaning.

  The vote was called. Seven to five. Round Up. 51.

  Kael handed the mold specification to the caster. He turned to Elara. "It is done."

  "But it's arbitrary," Elara whispered. "Five minutes ago, 50 was just as valid."

  "It wasn't valid," Kael corrected. "It was *unassertible*. Now, 51 is assertible. Because we agree to say it is."

  Elara looked at the Horologium. The great machine waited. It had no soul. It had no intent. It was just metal waiting to be told what it was.

  She picked up her wrench. "If I install this gear, and next year the seals blow... will we say the rule was wrong?"

  Kael shook his head. "No. We will say *you* followed the rule wrongly. Or we will change the rule again. We will vote again."

  "And that fixes it?"

  "That is all that ever fixed it," Kael said. "Even six hundred years ago."

  Elara tightened the bolts on the new gear. It clicked into place with a heavy, final sound. She engaged the lever. The Horologium groaned, shuddered, and began to turn. The valves opened to setting 51.

  Outside, the rain hissed against the shields. They held.

  Elara stood back, wiping grease from her hands. She felt a strange hollowness, but also a strange solidarity. She was not alone with the rule anymore. She was bound to Kael, to the Elders, to the citizens who would shout at her if the water rose too high. The normativity wasn't in her head. It was in the web of expectations that surrounded her.

  "Input 103 tomorrow," Kael said, closing the ledger. "What then?"

  Elara looked at the Council, who were already dispersing into the rain. She looked at Kael.

  "We'll see what we agree to," she said.

  Kael nodded. "Good. That's the rule."

  They walked out together, leaving the machine to its new truth, humming steadily in the dark, validated only by the fact that no one was there to stop it.
