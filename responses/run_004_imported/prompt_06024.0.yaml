answer: |-
  **Elena:** You're treating blame like a weather report. "It is raining." "You are wrong." If the proposition is true, the messenger is irrelevant.

  **Marcus:** Because it *is* a verdict on an action. If I embezzle funds, I've embezzled funds. Whether you embezzled funds last Tuesday doesn't change the ledger. To say I lack the *standing* to point out your theft because I'm also a thief is to confuse the message with the messenger. It's *tu quoque* dressed up in normative clothing.

  **Elena:** But blame isn't just a verdict, Marcus. It's a demand. It's a speech act that says, "We are both subject to this norm, and I am calling you back to it." When a hypocrite blames, they aren't invoking a shared norm. They're wielding a weapon. They're saying, "I am above this norm for me, but you are beneath it." That fractures the moral equality required for the demand to make sense.

  **Marcus:** So the hypocrite is annoying. Insufferable, even. But since when did moral truth require the speaker to be insufferable-free? You're granting the target a veto. I do something wrong. You, also a wrongdoer, call me out. My response shouldn't be, "Ah, finally, moral correction," it's, "Wait, check your record." And on your view, that response *wins*. It shuts down the blame. That seems dangerous.

  **Elena:** It doesn't shut down the *truth* of the blame. I can agree you did wrong. But it shuts down the *transaction*. Think of it like a judge. If a judge is actively breaking the law they are enforcing, we recuse them. Not because the defendant is innocent, but because the court has lost its authority. The hypocrite forfeits the right to occupy the moral high ground necessary to administer the sanction.

  **Marcus:** But a judge is an institutional role. Morality isn't a courtroom; it's a messy public square. Here's my worry: If standing requires this kind of moral clean hands, you paralyze moral progress. Imagine a culture of deep corruption. Everyone is complicit. On your view, no one has standing to blame anyone else. The whole community becomes morally mute. We lose the ability to criticize each other precisely when we need it most.

  **Elena:** That's the "Corrupt Community" objection. I get it. But you're assuming standing requires *purity*. It doesn't. It requires *commitment*. I can struggle with a norm and still have standing to blame you for flouting it, provided I acknowledge my own struggle. The hypocrite who lacks standing is the one who denies their own violation while enforcing it against you. They claim an exemption they aren't willing to grant.

  **Marcus:** Okay, let's grant that distinction. Commitment versus exemption. But look at the intuition pump that drives your view. The "Who are *you* to talk?" feeling. Why does that feel so potent? Is it because the hypocrite lacks authority? Or is it because they lack *credibility*?

  **Elena:** Credibility is epistemic. Standing is normative.

  **Marcus:** Is it? When someone says, "You're a hypocrite," they aren't usually saying, "You don't know what you're talking about." They're saying, "You don't *mean* what you're saying." But if I know you're a hypocrite, I can just filter for that. I can think, "Elena is telling me not to steal, even though she stole. She's annoying, but she's right." Why do I need to grant you permission to be right?

  **Elena:** Because blame is relational. It's an attempt to restore a relationship damaged by wrongdoing. If I don't respect the norm myself, I'm not trying to restore the relationship; I'm trying to dominate you. The "Who are you to talk?" intuition is a defense against moral domination. It's a refusal to be lectured by someone who views the norm as a tool for control rather than a bond of mutual respect.

  **Marcus:** But in the online arena—and frankly, in life—people use that intuition to evade accountability. It's a silencing tactic. "You criticized my carbon footprint? Well, you fly private sometimes." So now we can't discuss climate change unless the critic is a saint. Your view gives the wrongdoer a shield. It lets them focus on the blamer's sins to distract from their own.

  **Elena:** And your view gives the blamer a sword they haven't earned. It allows the corrupt to police the less corrupt, provided they're loud enough. Look, if I'm a serial liar calling you out for lying, my blame is *unfair*. Not false. Unfair. I'm asking you to bear a burden I refuse to carry. Fairness is a condition of legitimate moral address.

  **Marcus:** Fairness is a virtue of the *person*, not a condition of the *truth*. I'm worried about the downstream effects. If we institutionalize this "standing" norm, we create a marketplace where the only currency is moral purity. People will spend more time auditing each other's pasts than addressing present wrongs. It incentivizes hiding flaws rather than fixing them.

  **Elena:** Or, it incentivizes humility. It forces me to say, "I have struggled with this too, but we both know this is wrong." That's a stronger moral position than pointing a finger from a hidden closet.

  **Marcus:** Maybe. But it also means the most vocal critics are often the most vulnerable. If standing is fragile, then every time I call someone out, I open my own ledger to inspection. That chills speech. It makes moral criticism a high-stakes game of "who's worse?" rather than "what's right?"

  **Elena:** But isn't that exactly what online discourse is already? A game of "who's worse?" The difference is, on my view, admitting you're worse disarms you. On your view, it's irrelevant. So why bother admitting anything? Your view lets me scream at you for lying while I lie to everyone else, and I lose nothing.

  **Marcus:** You lose your audience. You lose your persuasive power. That's natural consequence enough. I don't need a metaphysical rule that says you *can't* blame. I just need to say that when you do, people will rightly discount you. The penalty is social, not normative.

  **Elena:** But social penalties are arbitrary. If the hypocrite is powerful enough, the social penalty vanishes. They can blame with impunity. The "standing" constraint is a check on power. It says: even if you are powerful, even if everyone listens to you, you do not have the *right* to make this demand if you reject the norm yourself.

  **Marcus:** A right granted by whom?

  **Elena:** By the moral community. By the very logic of holding each other accountable.

  **Marcus:** See, I think the moral community needs all the hands it can get, dirty or not. If a recovering alcoholic tells me not to drink, I don't say, "You have no standing." I say, "Thank you, that's good advice." The history matters for the *weight* of the words, not the *license* to speak them.

  **Elena:** But if the alcoholic is currently drunk while telling you not to drink?

  **Marcus:** Then they're a fool. But they might still be right that I shouldn't drink.

  **Elena:** And if they're forcing the glass out of my hand while theirs is full?

  **Marcus:** Then they're using force, not blame.

  **Elena:** Blame *is* a kind of force. It's a pressure.

  **Marcus:** It's a reason. And reasons don't care about the source. A broken clock is right twice a day. A hypocrite is right whenever the target is actually wrong. To deny that is to let the imperfection of the messenger invalidate the message. And in a world full of imperfect messengers, that leaves us with silence.

  **Elena:** Better silence than tyranny disguised as virtue.

  **Marcus:** Or maybe it's just noise. And we have to learn to listen through it.

  **Elena:** We're not just listeners, Marcus. We're participants. And I can't participate in a game where the rules only apply to me.

  **Marcus:** Then don't play. But don't tell me I can't point out when you break them.

  **Elena:** I'm telling you that if you're breaking them too, pointing isn't enough. You have to put your finger down.

  **Marcus:** And if I don't?

  **Elena:** Then you're not blaming. You're just attacking.

  **Marcus:** And if I am? Does that make the truth false?

  **Elena:** No. It makes you unjust.

  **Marcus:** I can live with that. Can you?

  **Elena:** That's the question, isn't it?
