      *   **Context:** The user is a journalist writing a feature on human factors in aviation maintenance, specifically focusing on how mechanics talk about *certainty* and *knowledge*.
      *   **Core Anecdote:** An experienced technician saw identical visual marks on two different parts (cabin panel vs. wing spar). On the cabin panel, she "knew" it was fine. On the wing spar, she didn't "know" and ordered an X-ray.
      *   **Supervisor's Input:** Officially (paperwork), you never "know" without X-ray. Unofficially (hangar talk), she "knew" because she has a good eye.
