answer: |-
  You have hit on one of the most potent objections in contemporary meta-ethics. Your intuition is correct: this is a known problem, and it is often called the **"Global Skepticism"** or **"Self-Defeat"** objection to Evolutionary Debunking Arguments (EDAs).

  You asked for a verdict, not a survey of opinions. Here is the verdict: **The YouTuber's argument is logically unstable.** If you push the "evolution undermines truth" reasoning hard enough to kill morality, it inevitably kills the logic and math used to construct the argument itself. Therefore, the argument fails to prove that morality is "fake" unless you are willing to accept that *nothing* we think is true—including the YouTuber's conclusion.

  Here is the breakdown of why this is the case, walking through the argument, the math parallel, and the decisive reason they cannot be treated differently without contradiction.

  ### 1. The Argument in its Strongest Form
  To be fair to the YouTuber, let's steel-man the **Evolutionary Debunking Argument (EDA)**. It usually looks like this:

  1.  **The Causal Premise:** Our moral beliefs (e.g., "murder is wrong") are heavily influenced by evolutionary pressures.
  2.  **The Epistemic Premise:** Evolution selects for **fitness** (survival and reproduction), not for **truth**.
  3.  **The Independence Premise:** If our beliefs are caused by something other than the truth of those beliefs, we have no reason to trust them as true.
  4.  **Conclusion:** Therefore, we have no reason to believe our moral beliefs track objective moral truths. Morality is likely just a useful fiction.

  This sounds compelling. It suggests our moral compass is like a compass that points "South" not because of magnetic North, but because pointing South helped our ancestors find food.

  ### 2. Running the Logic on Math
  Now, let's run your exact same logic on mathematics, as you suggested.

  1.  **The Causal Premise:** Our mathematical beliefs (e.g., "2 + 2 = 4") are heavily influenced by evolutionary pressures. (Ancestors who could track quantities of predators or food survived better).
  2.  **The Epistemic Premise:** Evolution selects for **fitness**, not for **truth**. (Believing "there are 2 wolves" might help you survive even if the abstract concept of "number" doesn't objectively exist in the universe).
  3.  **The Independence Premise:** If our beliefs are caused by something other than the truth of those beliefs, we have no reason to trust them as true.
  4.  **Conclusion:** Therefore, we have no reason to believe our mathematical beliefs track objective mathematical truths. Math is likely just a useful fiction.

  **The Problem:** Almost no one accepts this conclusion. We treat $7+5=12$ as objectively true, regardless of evolution. If you say math is just a survival trick, you undermine physics, engineering, and the very technology the YouTuber used to make his video.

  ### 3. The Verdict: Why the Argument Fails
  So, where does the YouTuber's argument break? There are two main ways philosophers try to save morality from this, but only one holds up to scrutiny.

  #### Attempt 1: "Math is Different from Morality"
  Some argue there *is* a principled difference. They say math is indispensable for navigating the physical world (gravity works mathematically whether we like it or not), whereas morality is just about social coordination.

  **Why this fails:** This doesn't save the logic. The EDA isn't about whether the belief is *useful*; it's about whether the belief is *true*. Even if math is useful, the EDA claims evolution only cares about utility, not truth. If evolution shaped our logic to help us survive, not to help us find truth, then the logical steps the YouTuber uses to debunk morality are *also* just survival tricks.

  #### Attempt 2: The Self-Defeat Objection (The Decisive Factor)
  This is the verdict you are looking for.

  The YouTuber is using **reason and logic** to argue that **morality is untrustworthy because it evolved.**
  But **reason and logic also evolved.**

  If the premise "Evolution selects for fitness, not truth" is powerful enough to debunk morality, it is powerful enough to debunk the cognitive faculties used to formulate that premise.
  *   If my moral intuition is suspect because it evolved, my logical intuition is equally suspect because it evolved.
  *   If I can't trust my moral radar, I can't trust my logic radar.
  *   If I can't trust my logic radar, I can't trust the conclusion of the YouTuber's argument.

  **The Verdict:** The argument is **self-defeating**. It saws off the branch it is sitting on.

  To avoid this, you have to admit that **evolution *can* track truth in some domains.** If evolution shaped our brains to understand logic and math truly (because true logic helps you survive better than false logic), then it is possible evolution shaped our brains to understand morality truly (because true morality helps groups survive better than false morality).

  You cannot have it both ways. You cannot say:
  *   "Logic is reliable despite evolution."
  *   "Morality is unreliable *because* of evolution."

  Unless you can show a specific mechanism where evolution tracks truth in logic but systematically misses truth in morality, the skepticism must be global. Since global skepticism (believing nothing is true) is impossible to live by and impossible to argue for, the argument collapses.

  ### 4. Is there *any* difference?
  To be thorough, is there *any* principled reason to treat them differently?
  There is one nuanced distinction, but it doesn't help the YouTuber's conclusion that morality is "fake."

  *   **Math/Logic** describes relationships that are necessary. (If you deny logic, you can't speak).
  *   **Morality** prescribes actions.

  Some philosophers (Non-Cognitivists) argue morality isn't "true or false" at all, but more like commands ("Don't murder!" is like "Ouch!" or "Stop!"). If morality isn't the *kind* of thing that can be true, then evolution didn't "miss the truth," it just installed a program.

  However, this is a different argument than the YouTuber made. He argued morality *would* be true if not for evolution messing it up. The Non-Cognitivist says morality *never was* the sort of thing to be true.
  But even here, the EDA is redundant. You don't need evolution to prove morality is subjective; you just need to analyze moral language. Bringing evolution into it invites the self-defeat problem.

  ### Final Conclusion
  Your nephew's math homework intuition is philosophically superior to the YouTuber's argument.

  **The Verdict:**
  The argument that "Evolution undermines Morality" **fails** because it proves too much.
  1.  If the argument works on morality, it works on math and logic.
  2.  If it works on math and logic, it undermines the reasoning used to make the argument.
  3.  Therefore, the argument destroys its own foundation.

  To save the argument, you must assume that **some** evolved faculties (like logic) track truth. Once you grant that, you cannot rule out that **other** evolved faculties (like morality) might also track truth. The mere fact of evolutionary origin does not disprove objective truth in either domain.

  The YouTuber's conclusion ("Morality is just in our heads") might be true for other reasons, but **the evolutionary argument he used cannot support it without also disproving math, logic, and the validity of his own video.**
