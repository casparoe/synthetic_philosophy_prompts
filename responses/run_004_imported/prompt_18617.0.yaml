answer: |-
  **The Glue and the Gap: Why Bradley's Regress Demands a Fregean Solution**

  The problem of the unity of the proposition is the problem of how the world gets traction on the mind, and how the mind gets traction on the world. Consider the fact that Desdemona loves Cassio. We have Desdemona, we have Cassio, and we have the relation of loving. If a fact were merely a list of these three constituents—{Desdemona, Cassio, Loving}—we would have no truth, no state of affairs, merely a heap. There must be something that knits them together. F.H. Bradley's famous regress argues that any attempt to provide this knitting via a relation leads to an infinite explanatory failure.

  This essay argues that Bradley's Regress is genuinely vicious, not benign, and that it successfully demolishes any model of the proposition that treats relations as ontological peers to objects. While D.M. Armstrong attempts to halt the regress by positing a primitive "non-relational tie," this move is an ad hoc stopper that obscures the underlying logical error. The only robust solution is a revitalized Fregean account: the regress arises from a category mistake. Relations are not "things" that need connecting; they are unsaturated functions that *do* the connecting by their very nature. To solve the unity problem, we must abandon the picture of propositions as aggregates of independent parts and accept them as functional unities grounded in categorial asymmetry.

  ### The Viciousness of the Regress

  Bradley's argument is deceptively simple. If the proposition "Desdemona loves Cassio" is a unity composed of distinct constituents ($a$, $b$, and $R$), there must be a connector that binds $R$ to $a$ and $b$. Let us call this connector $R_1$. But $R_1$ is now a new constituent. To bind $R_1$ to $a$, $b$, and $R$, we require a further connector $R_2$. This generates an infinite series: $R, R_1, R_2, \dots$

  Defenders of relational realism sometimes argue this regress is benign, akin to the infinite series of truth conditions (if $p$ is true, then '$p$ is true' is true, ad infinitum). However, this analogy fails. A truth regress does not prevent the initial proposition from being true; it merely iterates a consequence. Bradley's regress, conversely, is constitutive. It claims that the *existence* of the unity depends on the successful operation of the connector. If the first connector $R$ requires $R_1$ to function, and $R_1$ requires $R_2$, the initial unity is never achieved. It is like trying to hang a picture by attaching the hook to the wall with a second hook, which is attached by a third hook, forever. The picture never hangs.

  Therefore, the regress is vicious because it postpones the explanation of unity indefinitely. If we cannot explain how the first relation relates without invoking a second, we have not explained relation at all. We have merely named the problem. This forces a hard choice: either facts are not unities (which contradicts the nature of truth), or the model of facts as "objects plus relations" is fundamentally flawed.

  ### The Failure of the Non-Relational Tie

  Realist metaphysicians, most notably D.M. Armstrong, accept the viciousness of the regress but attempt to stop it by fiat. Armstrong argues that when a universal (like *Loving*) instantiates in particulars (Desdemona and Cassio), they are held together by a "non-relational tie" or nexus. This tie is not itself a relation, so it does not trigger a further regress. It is a brute ontological fact that universals and particulars stick together.

  While Armstrong deserves credit for taking the regress seriously, his solution is metaphysically costly and opaque. To say there is a "tie" that is not a relation is to use language that cancels its own meaning. A tie is, by definition, relational. By stripping it of relational properties to avoid the regress, Armstrong renders it unintelligible. He effectively says, "There is a unifier, but we cannot analyze how it unifies, or else the regress returns."

  This is a conversation-stopper, not a solution. It treats the unity of the proposition as a primitive brute fact. While primitivism is sometimes necessary, in this case, it masks a deeper logical error. Armstrong accepts Bradley's premise that the relation is a constituent *on par* with the relata, and then tries to engineer a special exception to save the model. A better approach is to reject the premise that generates the need for the exception.

  ### The Fregean Dissolution: Categorial Asymmetry

  Gottlob Frege offers a more radical and successful escape route. Frege argues that the regress arises because we treat the relation ('loves') as an object, just another nameable thing in the list. For Frege, the constituents of a proposition are not ontologically homogeneous. There are objects (saturated, complete entities like Desdemona) and there are concepts/relations (unsaturated, incomplete entities like 'loves').

  The crucial insight is that an unsaturated entity does not *need* a further relation to connect it to an object. Its very nature is to connect. To use Frege's mathematical analogy: consider the function $f(x) = x + 1$. The function itself contains a gap. When we supply the argument '2', we get '3'. We do not need a "glue" to connect the function to the argument. The application of the function to the argument is primitive. If we tried to treat the function as an object (say, by nominalizing it to "The Function"), we would indeed need a glue to apply it to '2'. But so long as we treat it as a function, the unity is internal to the logical form.

  Applied to Bradley: The regress only gets off the ground if 'loving' is treated as a third relatum alongside Desdemona and Cassio. But if 'loving' is a predicate (a function from objects to truth-values), it is categorially distinct. It is the "glue" by its very definition. To ask "what connects the relation to the relata?" is to commit a category mistake. It is like asking, "What connects the hole in the donut to the donut?" The hole is not a part that needs attaching; it is a feature of the arrangement. Similarly, the relation is not a brick in the wall; it is the mortar, but mortar that is essentially sticky, requiring no further adhesive.

  Critics often claim Frege's "unsaturatedness" is mystical metaphor. However, it can be understood structurally. In logical syntax, a predicate has empty places (arguments). A name does not. The unity of the proposition is secured by the syntactic rule that names fill the places of predicates. This syntactic asymmetry mirrors an ontological asymmetry. The regress assumes that all constituents are "names" (objects). Once we recognize that the verb is not a name but a rule of combination, the demand for a further connector dissolves.

  ### Why This Matters

  Adopting the Fregean view over the Armstrongian or Russellian alternatives preserves the objectivity of facts without multiplying entities. Russell's later "Multiple Relation Theory of Judgment" tried to solve the problem by making the mind's act of judging the unifier. This risks idealism, making the unity of the proposition dependent on a subject thinking it. Armstrong's tie risks obscurantism.

  Frege's approach maintains realism: the fact that Desdemona loves Cassio exists independently of us. But it clarifies that this fact is not a composite object built from independent atomic parts. It is a structured whole where the parts are defined by their roles (argument vs. function). The unity is not an extra ingredient; it is the mode of existence of the fact itself.

  ### Conclusion

  Bradley's Regress is a devastating critique of compositional atomism—the idea that the world is built like a Lego set, where independent blocks are snapped together by further blocks. The regress is vicious because it shows that if unity requires a connector, and the connector is a block, we never achieve unity. Armstrong tries to solve this by inventing a block that isn't a block, which is incoherent.

  The only viable path is to deny that the connector is a block at all. By defending a Fregean distinction between saturated objects and unsaturated relations, we see that the regress is generated by a grammatical illusion. We are seduced by the subject-predicate form of language into thinking 'loving' is a thing. It is not. It is a mode of combination. Therefore, the unity of the proposition is not a problem to be solved by adding more ontology, but a feature to be recognized by correcting our logical categories. The proposition is not a heap glued together; it is a functional whole, and Bradley's Regress is the proof that it cannot be anything else.
