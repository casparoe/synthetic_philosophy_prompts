          *   *Critique:* This is the weakest link in the user's thesis. Neurath's "Unity of Science" is about *translatability*. If ISOTYPE can't say something, it's a failure for Neurath, not a feature.

      *   **Point 4: Historical Relationship.**
          *   Neurath admired Wittgenstein but found the *Tractatus* too mystical.
