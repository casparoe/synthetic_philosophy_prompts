      *   **Key Implication 3: The Communal/Skeptical Solution.** How we attribute rule-following to AI is a social practice, not a technical fact.
      *   **Key Implication 4: AI Safety and Alignment.** Connect to the "inner alignment" problem. We can't verify the objective function matches the intended goal.
      *   **Conclusion:** Summarize. The paradox doesn't stop ML from working, but it limits our claims about what the model *knows* or *means*.

