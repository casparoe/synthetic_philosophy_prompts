          *   *Logic:* Morality isn't a market. You shouldn't be able to "outsource" your moral duties. Priya is still complicit in aviation emissions (even with offsets, which are dubious). Dan is still complicit in animal suffering. They aren't learning or growing; they're just trading sins.
          *   *Verdict:* Moral licensing. It allows them to feel good without doing the hard internal work.

      *   **Argument C: The Systemic/Structural View**
          *   *Premise:* Individual actions matter less than systems.
          *   *Logic:* Offsets are often ineffective. Individual diet changes don't fix industrial agriculture.
