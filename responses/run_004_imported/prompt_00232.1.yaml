      *   **Anti-Humeanism (Necessitarianism/Primitivism):** Laws are ontologically distinct from the mosaic. They "govern" or constrain what happens. They involve some form of modality (necessitation).
      *   **Determinism:** Given the state of the world at $t$ and the laws, there is exactly one physically possible future.
