answer: |-
  Short answer: **No, Anti-Humeanism does not entail determinism.** You haven't missed a contradiction in Maudlin; rather, you're likely conflating "governing/necessitation" with "deterministic prediction."

  Here is the breakdown of why Maudlin (and most Anti-Humeans) can consistently hold both views, and why Anti-Humeanism is actually often motivated *by* the desire to make sense of objective chance.

  ### 1. Governing $\neq$ Determining
  The core Anti-Humean claim is that laws are ontologically distinct from the mosaic and exert a kind of modal constraint on it ("governing").
  *   **Deterministic Governing:** The law says, "Given state $S$ at $t$, state $S'$ at $t+1$ **must** obtain."
  *   **Probabilistic Governing:** The law says, "Given state $S$ at $t$, state $S'$ at $t+1$ **must have objective probability** $P$."

  In both cases, the law is doing the same metaphysical work: it is restricting what is physically possible. In the indeterministic case, it restricts the *distribution* of outcomes rather than the specific outcome. For an Anti-Humean, the **chance itself** is a robust, mind-independent feature of the world grounded in the law.

  ### 2. The Humean Problem with Chance
  Ironically, Humeans have a much harder time with objective chance than Anti-Humeans do.
  *   **Lewis's Dilemma:** David Lewis (the arch-Humean) famously admitted that objective chance is a "big bad bug" for Humean Supervenience. If laws supervene on the mosaic, and the mosaic is just a history of particular events, it is very difficult to ground *objective* probabilities without reducing them to actual frequencies (which fails for single-case chances) or best-system fit (which makes chance dependent on our systematization).
  *   **Maudlin's Move:** Maudlin argues that if you want genuine objective collapse (like GRW), you need a metaphysics that can ground irreducible probabilities. Anti-Humeanism provides the ontological "room" for objective chances to exist as fundamental features of the laws, rather than summaries of patterns.

  ### 3. Maudlin's Primitivism
  Maudlin specifically defends a **Primitivist** view of laws (in *The Metaphysics Within Physics*). He argues laws are fundamental.
  *   For Maudlin, a stochastic law (like the GRW collapse rate) is just as fundamental as a deterministic one (like the Schrödinger evolution between collapses).
  *   The "necessitation" involved isn't necessarily $N(\text{State}_t, \text{State}_{t+1})$. It can be understood as a necessitation of the **propensity**. The law necessitates that the system *has a tendency* to collapse in a specific way.
  *   If the law says "There is a 50% chance of spin up," and you get spin down, the law has not been violated. The law governed the *probability*, and the probability was realized.

  ### 4. DTA and Probabilistic Necessitation
  If you are reading the Dretske-Tooley-Armstrong (DTA) literature specifically:
  *   Armstrong struggled with this exact issue. He eventually proposed that the necessitation relation $N(F, G)$ could hold **probabilistically**.
  *   So, it is not that $F$ necessitates $G$. It is that $F$ necessitates that $G$ occurs with probability $P$.
  *   This preserves the Anti-Humean intuition (there is a real relation between universals/laws) without forcing determinism.

  ### Summary
  Maudlin isn't contradicting himself; he's exploiting the main advantage of Anti-Humeanism.
  *   **Humeanism:** Laws describe patterns. (Struggles to explain why the patterns *must* hold or what objective chance *is*.)
  *   **Anti-Humeanism:** Laws constrain possibilities. (Can constrain possibilities to a single outcome **OR** to a probability distribution.)

  So, being a "card-carrying Anti-Humean" actually makes it *easier* to be a fan of objective collapse theories, not harder. The contradiction would arise if he were a **Determinist** Anti-Humean trying to accept GRW, but he isn't. He's an **Indeterminist** Anti-Humean.
