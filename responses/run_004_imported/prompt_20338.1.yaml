      *   **Point 2: Dissolving the "Risk Preference" Mystery.**
          *   Standard Econ: "Why don't you take the St. Petersburg Paradox bet? You must be risk-averse." (Subjective).
          *   EE: "You don't take it because the time-average growth is negative/finite." (Objective).
          *   *Argument:* It shifts risk aversion from a psychological quirk to a rational response to the structure of time and compounding. It removes the need to *assume* a utility function; the utility function is *derived* from the dynamics.

      *   **Point 3: The "Mistake" in EV Reasoning.**
          *   If you maximize EV in a multiplicative game (like betting your bankroll), you bet everything.
          *   Result: Almost sure ruin (Gambler's Ruin).
          *   *Argument:* Calling this a "preference" is misleading. It's a computational error regarding the system's dynamics. It's like saying "I prefer to drive off the cliff" vs. "I miscalculated the turn." If the goal is survival/growth, EV is objectively wrong.

