  5.  **Final Review against Prompt:**
      *   Recalcitrant emotion defined? Yes.
      *   Judgmentalism embarrassment explained? Yes (contradiction).
      *   Perceptualism illusion analogy? Yes (Müller-Lyer).
      *   What's wrong with Perceptualism? Yes (motivation/reasons).
