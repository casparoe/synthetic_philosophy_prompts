      *   **User:** Novelist drafting a book about a structural engineer with a specific phobia (fear of bridges despite knowing they are safe).
      *   **Goal:** Wants psychological/philosophical precision regarding "recalcitrant emotions."
      *   **Specific Topics:**
          1.  Why recalcitrant emotions embarrass *Judgmentalism* (Emotions = Evaluative Judgments).
          2.  How *Perceptualism* (Emotions = Perceptions of Value) tries to solve it (visual illusion analogy).
          3.  What is wrong with the Perceptualist move (the counter-argument).
          4.  What *Feeling Theory* (Emotions = Bare Feelings/Physiology) would say.
      *   **Constraint:** Needs the "actual shape of the debate," not a summary. Needs "real technical care."
      *   **Tone:** Professional, insightful, suitable for a novelist seeking depth (not dry academic jargon without context, but rigorous enough to be accurate).

  2.  **Deconstruct the Philosophical Debate:**

      *   **The Phenomenon:** Recalcitrant Emotions (e.g., fearing the bridge while judging it safe).
      *   **Theory 1: Cognitivism/Judgmentalism (Solomon, Nussbaum-ish).**
          *   *Core Claim:* To fear $X$ is to judge $X$ as dangerous.
          *   *The Problem:* If the engineer judges the bridge *safe*, she cannot simultaneously judge it *dangerous* without being irrational (akrasia of belief). But she isn't necessarily irrational; the fear persists *against* the judgment. This creates a contradiction in the mind: $P$ (safe) and not-$P$ (dangerous).
          *   *The Embarrassment:* It makes the subject look logically inconsistent in a way they don't feel.
      *   **Theory 2: Perceptualism (Döring, Tappolet).**
          *   *Core Claim:* Emotions are like perceptions (seeing red), not judgments (believing red). They present value properties (danger) without committing to truth.
          *   *The Solution:* The Müller-Lyer illusion analogy. Lines look unequal (perception) even if I measure and know they are equal (judgment). Similarly, the bridge *feels* dangerous (emotion) even if I calculate it safe (judgment).
          *   *The Counter-Argument:* Disanalogy. Visual illusions are passive; emotions involve motivation/action tendency. If I *see* danger, I should flee. If I *judge* safety, I should stay. The conflict is deeper than vision. Also, perceptions are usually tied to sensory organs; emotions aren't.
      *   **Theory 3: Feeling Theory / Somatic Theory (James, Prinz).**
          *   *Core Claim:* Emotions are perceptions of bodily changes (heart racing, sweating).
          *   *The Explanation:* The engineer's body reacts (adrenaline) regardless of the cognitive assessment. The fear *is* the feeling of the racing heart.
          *   *The Weakness:* It doesn't explain the *intentionality* (what the fear is *about*). Why fear the bridge and not the shoes? It reduces the emotion to a symptom, missing the "aboutness."

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the character concept. It's a perfect philosophical case study. Define "Recalcitrant Emotion."
      *   **Judgmentalism (The Target):** Explain the "Stoic" or high-cognitive view. Emotion = Belief/Judgment.
          *   *The Conflict:* If Fear = Judgment of Danger, and Safety = Judgment of Safety, holding both is a contradiction. It implies the engineer is irrational. But she's an expert; she knows her math. The theory fails to capture the *split* in her mind.
      *   **Perceptualism (The Fix):** Introduce the "Analogy of Vision."
          *   *The Mechanism:* Modular systems. The "emotion module" fires like a retina.
          *   *The Illusion:* Müller-Lyer lines. You know they are equal, they look unequal. You know the bridge is safe, it feels dangerous.
          *   *Benefit:* Saves the engineer from charges of irrationality. She is experiencing a "value illusion."
      *   **The Critique of Perceptualism (The Pushback):** Why philosophers aren't satisfied.
          *   *Reason 1: Motivation.* Visual illusions don't make you act. If lines look long, you don't reach further. If a bridge feels dangerous, you freeze or flee. The "feel" demands action that contradicts the judgment.
          *   *Reason 2: Reason-responsiveness.* Perceptions aren't swayed by reasons easily. Emotions *can* be swayed (therapy, exposure), unlike raw vision.
      *   **Feeling Theory (The Alternative):** The somatic view.
          *   *The Focus:* The gut, the heart, the sweat.
          *   *The Explanation:* Her body doesn't know the math. The fear is the reading of the body.
          *   *The Limit:* It explains the *sensation* but not the *object*. Why is the fear attached to the *bridge* and not just a general panic?
      *   **Application to the Novelist:** How to use this. The tension between the "calculating mind" and the "perceiving body."

