answer: |-
  This is a profound narrative premise because your protagonist embodies a specific philosophical puzzle that has occupied the philosophy of mind for the last forty years. In the literature, this is indeed called a **recalcitrant emotion**.

  To give you the technical care you need to write this with authenticity, we must treat the engineer's mind not as a broken machine, but as a battleground between competing systems of appraisal. The debate you are asking about centers on the **Problem of Irrationality**.

  Here is the shape of the debate, structured by how each theory attempts to explain your engineer's experience, and where each theory fails.

  ### 1. The Judgmentalist Trap (Cognitivism)
  **The Theory:**
  For a long time, the dominant view (championed by philosophers like Robert Solomon and Martha Nussbaum) was **Judgmentalism**. This theory posits that emotions are, fundamentally, evaluative judgments. To fear the bridge *just is* to judge that the bridge is dangerous. There is no extra "feeling" required; the judgment constitutes the emotion.

  **The Embarrassment:**
  Recalcitrant emotions are a disaster for this view. Here is why:
  If your engineer walks onto the bridge, she holds a conscious, reasoned judgment: *"This structure is safe."* (Judgment A).
  Yet, she feels fear. If fear is a judgment, she is simultaneously holding: *"This structure is dangerous."* (Judgment B).

  In philosophy, holding $P$ and not-$P$ at the same time is a contradiction. It implies your protagonist is logically irrational. It suggests she believes the math says "safe" but also believes "danger." This makes her look like she is suffering from a delusion or a failure of logic.

  **Why this fails your character:**
  You specified her fear is not "ironic." She isn't confused. She trusts her calculations. Judgmentalism cannot account for the *split* in her experience. It forces you to write her as cognitively broken. It cannot explain how she can sincerely assert, "I know it is safe, but I am terrified," without sounding like she is saying, "I know it is Tuesday, but I believe it is Friday."

  ### 2. The Perceptualist Solution (The Illusion Analogy)
  **The Theory:**
  To save the subject from the charge of irrationality, philosophers like Sabine Döring and Christine Tappolet developed **Perceptualism**. They argue emotions are not judgments (beliefs); they are perceptions of value.

  Just as your eyes perceive color, your emotional system perceives "affordances" or value properties (danger, offense, loss). Crucially, perceptions are modular. They are encapsulated systems that fire automatically, independent of your higher-level beliefs.

  **The Defense (The Müller-Lyer Analogy):**
  This is the specific technical analogy you should know. Consider the Müller-Lyer optical illusion: two lines of equal length, one with arrows pointing in, one with arrows pointing out.
  *   **Judgment:** You measure the lines. You *judge* them to be equal.
  *   **Perception:** You *see* one as longer than the other.

  You do not say, "I believe the lines are equal, but I also believe they are unequal." You say, "I *know* they are equal, but they *look* unequal."

  Perceptualism applies this to your engineer.
  *   **Cognitive System:** Calculates load-bearing limits. Judges "Safe."
  *   **Emotional System:** Perceives height, exposure, and history. Presents "Danger."

  **The Benefit:**
  This rescues your engineer from the charge of irrationality. She is not contradicting herself. She is experiencing a **value illusion**. Just as the visual cortex is tricked by the arrows, her amygdala (or emotional module) is tricked by the drop. The fear is "recalcitrant" because the emotional module is "cognitively impenetrable"—it doesn't listen to the math. It only listens to the visual input of the span.

  ### 3. The Critique of Perceptualism (The Motivation Problem)
  **The Counter-Argument:**
  If Perceptualism solves the irrationality problem, why is the debate still alive? Because it introduces a new problem: **The Problem of Motivation.**

  Visual illusions are passive. If the lines *look* unequal, you do not reach for the longer one. You do not act on the illusion. You acknowledge the look, but you act on the measurement.

  Emotions, however, are not passive. They come with **action tendencies**. Fear prepares the muscles to flee. It spikes the heart rate. It demands a response.
  *   If the engineer's judgment says "Stay," but her emotion says "Flee," she is in a state of **akrasia** (weakness of will).
  *   If emotions are just like vision, why does the "look" of danger compel her to freeze, while the "look" of a longer line does not compel her to reach?

  **The Philosophical Objection:**
  Critics (like Peter Goldie) argue that the Perceptualist analogy is too thin. A visual illusion doesn't hurt. A recalcitrant fear *distresses*. It creates a conflict of *authority*. The visual system has no authority over your actions; the emotional system claims authority.

  If you write your character using only the Perceptualist model, she might seem like a passive observer of her own fear ("Oh, look, my brain is generating a danger signal"). But in reality, recalcitrant fear feels like a **rival command**. The bridge doesn't just *look* dangerous; it *commands* her to get off. The Perceptualist theory struggles to explain why the "illusion" has the power to override the "judgment" in a way that optical illusions do not.

  ### 4. The Feeling Theory (The Somatic Alternative)
  **The Theory:**
  There is a third contender, often associated with William James or Jesse Prinz: **Feeling Theory** (or Somatic Perception). This theory argues that emotions are not perceptions of the *world* (like the bridge), but perceptions of the *body*.
  To fear is to feel your heart race, your palms sweat, and your stomach drop.

  **The Explanation:**
  For your engineer, this theory suggests the fear is not about the bridge at all, initially. It is about her physiology. Her body reacts to the height (vestibular system, adrenaline) before her cortex processes the engineering. The "fear" is her brain reading her own racing heart and attaching the label "danger" to the nearest object (the bridge).

  **The Weakness (The Intentionality Problem):**
  The fatal flaw here is **Intentionality** (aboutness).
  If I have a racing heart, that is just a symptom. I could have a racing heart because I ran up the stairs. Why is *this* racing heart "fear of the bridge" and not "exertion"?
  Feeling Theory struggles to explain why the fear is *about the bridge*. It reduces the emotion to a bodily symptom.

  **For the Novelist:**
  This theory is useful for describing the *visceral* quality of her fear. It grounds the fear in the gut, not the head. However, it cannot explain the *narrative* of the fear. It explains the shaking hands, but not why she is thinking about the bolts failing.

  ### Synthesizing the Debate for Your Character
  To write this with "psychological precision," you should let your character's internal monologue reflect this tension. She is living the debate.

  1.  **The Judgmentalist Conflict:** She tries to talk herself down using logic ("The factor of safety is 4.0"). This fails because she is treating the fear as a belief that can be argued away. It creates cognitive dissonance.
  2.  **The Perceptualist Reality:** She realizes the logic doesn't work because the fear is sensory. She should describe the bridge *appearing* unstable, not just *being* judged unstable. Use the language of optics: "The cables *sagged* in my vision, even though I knew the tension was nominal." This captures the "illusion" aspect.
  3.  **The Motivational Pull:** She must feel the *urge* to act. The fear isn't just a picture; it's a command. Her legs want to run. This addresses the critique of Perceptualism. The fear claims authority over her limbs that her calculations do not possess.

  **The "Technical" Detail to Include:**
  If you want a specific philosophical touchstone, have her recall the distinction between **assent** and **impression**.
  *   Her engineering mind gives **assent** to the safety (Judgment).
  *   Her emotional mind receives an **impression** of danger (Perception).

  The tragedy of recalcitrant emotion is that human beings are forced to act on impressions even when they withhold assent. She is a split self: a Cartesian mind that knows the truth, and a Humean beast that feels the threat. The fear persists not because she is irrational, but because her "danger detection system" is older and faster than her "bridge calculation system," and the former does not trust the latter.

  This makes her fear not a flaw in her logic, but a flaw in her architecture—a bug in the human operating system that her engineering degree cannot patch.
