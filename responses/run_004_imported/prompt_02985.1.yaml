  so I've been messing around with a little probabilistic programming DSL as a side project, and got nerd-sniped reading about how to handle conditionals in it -- fell down a rabbit hole into the philosophy-of-language side of things and landed on this David Lewis triviality result for indicative conditionals. from what i can tell he proved there's no way to have the probability of 'if A then B' always equal the conditional probability P(B|A) without the whole probability function collapsing into something degenerate. I tried to follow the actual derivation (something about conditionalizing on A&B vs A&~B and forcing a contradiction) but lost the thread in the algebra about halfway through. can you give me the gut-level intuition for why this has to break down, rather than the full formal proof -- like why is forcing that equation to hold everywhere so catastrophic for a probability function?
