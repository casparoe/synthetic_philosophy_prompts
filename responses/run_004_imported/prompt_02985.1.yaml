          *   Lewis shows that for the equation to hold, the event $C$ must be probabilistically independent of $A$.
          *   If $C$ is independent of $A$, then $P(C|A) = P(C)$.
          *   But we assumed $P(C) = P(B|A)$.
          *   So $P(C|A) = P(B|A)$.
          *   But if $A$ is true, $C$ ("If A then B") is essentially just $B$. So $P(C|A)$ should be $P(B|A)$.
          *   This leads to $P(B|A) = P(B|A)$. Tautology. Where is the contradiction?
          *   The contradiction comes when you consider $\neg A$.
          *   If $C$ is independent of $A$, then $P(C|\neg A) = P(C) = P(B|A)$.
          *   This means your belief in "If $A$ then $B$" when you know $A$ is *false* must be the same as your belief in $B$ given $A$.
          *   That's absurd. If I know it didn't rain, my belief in "If it rained, the grass would be wet" shouldn't necessarily be tied to the current humidity ratio.
          *   More formally: It forces the probability of the conditional to be constant across all partitions of $A$, which restricts the number of distinct probability values you can have.

