          *   *The Conflict:* If the conditional is a standard proposition (a set of worlds), its probability is just the sum of probabilities of those worlds. Lewis proved mathematically that you can't make that sum equal $P(B|A)$ for *all* probability distributions unless the world is incredibly simple (trivial).
