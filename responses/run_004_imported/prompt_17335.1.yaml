  2.  **Deconstruct the Philosophical Concepts:**
      *   **Incommensurability:** No common unit of measurement (e.g., dollars vs. love). It doesn't mean "cannot be compared," it means "cannot be precisely measured against each other."
      *   **Incomparability:** A stronger claim. It means *no* rational relation exists (not better, not worse, not equal). Most philosophers argue career/life choices are *not* incomparable, just incommensurable.
      *   **Parity ("On a Par"):** A concept (often associated with Ruth Chang) where options are in the same neighborhood of value but neither is strictly better. This allows for *will* to play a role.
