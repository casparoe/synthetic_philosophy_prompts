          *   Define Burge's Social Externalism (Arthritis definition).
          *   Key difference: Physics vs. Norms.
      *   *Section 2: Coherence of Layering.*
          *   Yes, it works. They operate on different axes.
          *   Analogy: Hardware (Putnam) vs. Software/Protocol (Burge).
          *   Why it's not redundant: One shows nature matters, the other shows nurture/society matters.
          *   Why it's not incompatible: They don't contradict.
      *   *Section 3: Radicalism and Fundamentality.*
          *   Burge is arguably more threatening to the "Cartesian ego." Putnam leaves open the idea that if the world were physically identical, minds would match. Burge says no, even then, social usage matters.
          *   This adds dramatic tension for the novel.
      *   *Section 4: Narrow Content.*
