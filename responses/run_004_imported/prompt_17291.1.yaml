prompt: |-
  I recently moved from a software engineering role into a newly created People Analytics position at my company (roughly 900 employees, split mainly across Engineering, Sales, Customer Support, and Marketing), and I've run into a problem I don't yet have the statistical vocabulary to handle with full confidence. Last year we piloted a voluntary mentorship program, the "Career Accelerator," and when I pulled eighteen-month promotion outcomes, participants had been promoted at a noticeably higher rate than non-participants company-wide (about 35% versus 28%). Leadership is ready to roll the program out to everyone on the strength of that headline number. When a friend from my old statistics program asked me to break the same numbers down by department, though, the comparison reversed in all four: within Engineering, Sales, Support, and Marketing alike, non-participants were promoted at an equal or higher rate than participants. Sales, which happens to be both our largest department and by far the most enthusiastic adopter of the program, also has the fastest promotion cycle of the four for reasons that have nothing to do with the program itself, and that combination alone seems to be enough to flip the company-wide comparison even though the program looks neutral-to-harmful within every department taken on its own.

  My friend tells me this is a textbook instance of Simpson's paradox, and I've since read enough about its classic illustrations (the 1973 Berkeley admissions data, the kidney-stone treatment study) to follow the mechanics of the reversal itself. What I haven't found is guidance aimed at someone in my actual situation: our analytics team is three people, none of us formally trained statisticians, we cannot realistically randomize most of the programs we're asked to evaluate, and leadership wants a clear recommendation rather than a statistics lecture. Could you describe the most important implications of Simpson's paradox for how a team like ours should design, report on, and interpret evaluations such as this one going forward? I'd especially value your thoughts on how we might decide which variables are even safe to stratify by in the first place, since it occurs to me that slicing the data along every dimension we can think of might introduce its own distortions rather than resolve the one we've already found.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User Profile:** Former software engineer, now in People Analytics (PA). Statistically literate enough to recognize the problem (thanks to a friend) but lacks formal statistical training/vocabulary for causal inference.
      *   **Company Context:** ~900 employees, 4 main depts (Eng, Sales, Support, Marketing). Small analytics team (3 people, no formal statisticians).
      *   **The Problem:** A mentorship program ("Career Accelerator") shows a positive overall effect (35% vs. 28% promotion rate) but a negative/neutral effect within every department (Simpson's Paradox). Sales is the confounder (large, high adoption, high promotion rate unrelated to program).
      *   **The Stakes:** Leadership wants to roll out the program based on the headline number. The user knows this is likely a bad decision based on the stratified data.
      *   **The Need:** Practical guidance on implications for design, reporting, and interpretation. Specifically, how to decide *which* variables to stratify by without "p-hacking" or over-stratifying.
      *   **Constraint:** Cannot randomize (observational data). Need clear recommendations for leadership, not a lecture.

  2.  **Deconstruct the Statistical Phenomenon (Simpson's Paradox):**
      *   *What is it?* A trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   *Why did it happen here?* Confounding variable (Department). Sales has high promotion rates *and* high program participation. This weights the overall average heavily towards the "Sales + Program" bucket, inflating the overall program success rate.
      *   *Causal Interpretation:* The aggregated data suggests $P(Promotion | Program) > P(Promotion | No Program)$. The stratified data suggests $P(Promotion | Program, Dept) \le P(Promotion | No Program, Dept)$. The stratified version is usually the causal truth in this context because Department is a *confounder* (affects both participation and outcome).

  3.  **Address the Core Questions:**
      *   **Implications for Design:** How to prevent this next time? (Baseline measurement, better tracking).
      *   **Implications for Reporting:** How to talk to leadership? (Show the stratified data, explain the "why," avoid headline numbers).
      *   **Implications for Interpretation:** How to analyze? (Causal diagrams, identifying confounders).
      *   **The "Which Variables to Stratify" Question:** This is the hardest part. Over-stratification leads to small sample sizes and noise. Under-stratification leads to bias. Need a framework (DAGs, subject matter expertise).

  4.  **Drafting the Response - Section by Section:**

      *   **Validation & Empathy:** Acknowledge the difficulty. It's a classic trap. Validate that their intuition (and their friend's) is correct. This builds trust.
      *   **The "So What?" (Immediate Action):** Don't just explain the math. Tell them what to tell leadership. *Do not roll out based on the aggregate number.* The program might be useless or even harmful (opportunity cost).
      *   **Framework for Analysis (The "How-To"):**
          *   *Causal Thinking:* Introduce the concept of Confounders vs. Colliders. This is crucial for the "which variables to slice" question.
          *   *DAGs (Directed Acyclic Graphs):* Keep it simple. Draw arrows. Dept -> Promotion, Dept -> Program. This makes Dept a confounder.
          *   *The "Table 2" Rule:* Never present Table 1 (aggregates) without Table 2 (stratified).
      *   **Deciding on Variables (The Specific Request):**
          *   *Don't slice everything:* Mention the multiple comparisons problem and small cell sizes.
          *   *Pre-specify:* Decide before looking at outcomes.
          *   *Subject Matter Expertise (SME):* Talk to HRBPs/Managers. Why do people join? Why do people get promoted?
          *   *Confounder Checklist:* Does it affect participation? Does it affect outcome? If yes to both, control for it.
      *   **Design Improvements (Future Proofing):**
          *   Since RCTs are out, what's next?
          *   Propensity Score Matching (mention gently, maybe too advanced? No, keep it high level: "compare like with like").
          *   Baseline data (performance ratings, tenure) *before* program start.
          *   Waitlists/Cohorts (quasi-experimental).
      *   **Communication Strategy:**
          *   Storytelling over p-values.
          *   Focus on "Opportunity Cost."
          *   Pilot vs. Scale distinction.

  5.  **Refining the Tone:**
      *   Needs to be professional, pragmatic, and empowering.
      *   Avoid heavy jargon (e.g., avoid writing out regression equations). Use terms like "Confounding" but explain them simply.
      *   Acknowledge the political reality (Leadership wants a "Yes"). The answer must be "Yes, but..." or "No, because..." with evidence.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Suggest Propensity Score Matching (PSM).
      *   *Correction:* The team has no statisticians. PSM can be dangerous if done wrong. Better to suggest stratified analysis or simple matching ("find a twin"). Keep it actionable.
      *   *Initial thought:* Tell them to stop the program.
      *   *Correction:* I don't know if the program is bad. The data says it's not *causing* promotions. It might have other benefits (retention, satisfaction). Advise caution on the *promotion* claim specifically.
      *   *Focus on the "Which Variables" question:* This is the crux. I need to emphasize *causal structure* over *statistical significance*. Slicing by "Hair Color" is bad. Slicing by "Department" is good. Why? Because hair color doesn't cause promotion. Department does.

  7.  **Final Polish:**
      *   Structure with clear headings.
      *   Add a "Script for Leadership" section to make it immediately usable.
      *   Ensure the distinction between *prediction* (aggregates are fine) and *causation* (stratification is needed) is clear.

  8.  *(Final check against constraints)*: 900 employees is small. Stratifying too much leads to n=5 cells. Must warn about sample size. 3-person team means low bandwidth. Solutions must be low-lift.

  9.  **Generate Output.** (This aligns with the detailed response provided previously.)
answer: |-
  This is a pivotal moment for your new team. You have identified a statistical trap that has misled organizations for decades, and you are correctly sensing that acting on the aggregate number would be a strategic error.

  Your friend is right: this is Simpson's Paradox. But in a business context, it is more than a paradox; it is a **causal inference failure**. The aggregate number describes *who* is in the program (mostly Sales, who get promoted often). The stratified number describes what the program *does* (little to nothing for promotion rates).

  Since you cannot run Randomized Controlled Trials (RCTs) and lack formal statistical bandwidth, you need a pragmatic framework for **Observational Causal Inference**. Here is how your team should design, report, and interpret evaluations going forward, specifically tailored to your constraints.

  ### 1. The Immediate Recommendation (Leadership Communication)

  Do not present this as a "statistics problem." Leadership does not care about paradoxes; they care about ROI and risk.

  *   **The Headline:** "The data suggests the program is not driving promotions; rather, high-promotion departments are simply using the program more."
  *   **The Risk:** "If we scale this expecting a 7% lift in promotions, we will likely be disappointed. Furthermore, if the program requires manager time or employee hours, we may be incurring a net cost with no return."
  *   **The Pivot:** "We recommend pausing the broad rollout to refine the targeting. The program might be valuable for retention or satisfaction, but we cannot claim it accelerates promotions based on current evidence."

  **Script for the Meeting:**
  > "When we look at the whole company, the program looks successful. But that's because our highest-promoting department (Sales) also signed up the most. When we compare apples to apples—Engineers to Engineers, Sales to Sales—the program participants aren't outperforming their peers. Scaling this now would be like betting on a horse because it won races on a downhill track, without realizing it loses on flat ground."

  ### 2. Deciding Which Variables to Stratify By

  You asked the most critical question: *If we slice by everything, we find noise. If we slice by nothing, we find bias. Where is the line?*

  In observational data, you should not stratify based on what is *available*; you should stratify based on what is **causal**. You need to distinguish between **Confounders** (must control) and **Colliders/Mediators** (do not control).

  **The "Common Cause" Test**
  Before analyzing, draw a simple diagram (a Directed Acyclic Graph, or DAG) on a whiteboard. Ask: *Does this variable cause people to join the program? AND does this variable cause people to get promoted?*

  *   **Department:** Yes. (Sales joins more; Sales promotes faster). **-> CONFOUNDER. Stratify.**
  *   **Tenure:** Yes. (Longer tenure employees might seek mentorship; Longer tenure employees are more eligible for promotion). **-> CONFOUNDER. Stratify or Match.**
  *   **Prior Performance Rating:** Yes. (High performers seek growth; High performers get promoted). **-> CONFOUNDER. Stratify or Match.**
  *   **Program Completion:** No. (This happens *after* joining). **-> MEDIATOR. Do not stratify.** (If you only analyze people who "finished" the program, you introduce survivorship bias).
  *   **Manager ID:** Maybe. (Some managers push programs; some promote fast). **-> CONFOUNDER.** (But be careful of small sample sizes).

  **The Sample Size Constraint**
  With 900 employees, you cannot stratify by Department *and* Tenure *and* Performance Level *and* Manager. You will end up with cells of $n=3$, where one promotion swings the rate by 33%.

  **Rule of Thumb:** Stratify by the **strongest** confounder first (in your case, Department). If the trend holds across those large groups, you are safer. If you need to control for more, use **Matching** (see below) rather than stratification.

  ### 3. Designing Evaluations Without Randomization

  Since you cannot force randomization, you must simulate it through design.

  **A. The "Waitlist" Design (Quasi-Experimental)**
  Next time a program is oversubscribed, do not let managers pick who gets in.
  1.  Collect all applicants.
  2.  Randomly assign half to "Cohort A" (start now) and half to "Cohort B" (start in 6 months).
  3.  Cohort B is your control group.
  4.  *Leadership Pitch:* "This ensures we measure impact fairly so we know if we should invest more budget next year."

  **B. Propensity Matching (Low-Tech Version)**
  You don't need complex algorithms. You can do "Nearest Neighbor" matching in Excel/SQL.
  1.  For every Program Participant, find a Non-Participant in the same Department with the same Tenure Band and similar Last Performance Rating.
  2.  Discard participants who have no match.
  3.  Compare promotion rates of the *matched* pairs.
  4.  This answers: "For two identical employees, did the one with the mentor get promoted faster?"

  **C. Baseline Measurement is Non-Negotiable**
  You cannot measure "lift" if you don't know the starting point.
  *   **Bad:** Compare Promotion Rate of Participants vs. Non-Participants.
  *   **Good:** Compare (Promotion Rate of Participants) vs. (Promotion Rate of Non-Participants **with same prior performance**).
  *   **Better:** Measure the *change* in performance trajectory 6 months before vs. 6 months after.

  ### 4. Reporting Standards for Your Team

  To prevent this from happening again, institute a "Table 2 Rule."

  *   **Table 1 (The Hook):** Always show the aggregate numbers. Leadership expects this.
  *   **Table 2 (The Truth):** Immediately below it, show the breakdown by the primary confounder (Department).
  *   **The Footnote:** "Aggregate data is weighted by department size. Department-level controls are recommended for causal interpretation."

  If Table 1 and Table 2 disagree (as they did here), **Table 2 wins.** Make this a team policy. If the stratified data contradicts the aggregate, the aggregate is discarded for decision-making purposes.

  ### 5. Interpreting "Neutral-to-Harmful" Results

  You noted the program looks "neutral-to-harmful" within departments. Be careful with the word "harmful."

  *   **Null Effect:** The program does nothing for promotions. It might still help with retention, engagement, or skill acquisition. Do not kill the program based solely on promotion data if other metrics exist.
  *   **Negative Effect:** Is it possible the program *hurts*? Yes. If high-potential employees spend 5 hours a month in mentorship meetings instead of working on high-visibility projects, they might actually be *less* likely to be promoted than their heads-down peers.
  *   **Selection Bias (The Reverse):** Is it possible that managers steer employees who are *struggling* into the program? If managers use the "Career Accelerator" as a remedial tool for employees at risk of stagnation, you would expect participants to have lower promotion rates even if the program helps.

  **Action Item:** Interview a sample of managers. Ask: *"Why did you nominate this employee?"*
  *   If the answer is "They are a star," and they aren't promoting, the program is ineffective.
  *   If the answer is "They are stuck," and they are promoting at the same rate as stars, the program is a massive success (it closed the gap).

  ### Summary Checklist for Your Team

  1.  **Map the Causal Flow:** Before pulling data, sketch what drives participation and what drives outcomes. Identify the overlap (Confounders).
  2.  **Pre-Specify Slices:** Decide which variables you will control for *before* looking at the outcome data to avoid p-hacking.
  3.  **Respect Sample Size:** Do not stratify if it creates cells smaller than $n=30$. Use matching instead.
  4.  **Table 2 Rule:** Never present aggregates without the primary stratification.
  5.  **Qualitative Triangulation:** When numbers look weird (like negative impact), talk to humans to understand the *selection mechanism*.

  You are in a strong position. By catching this now, you have saved the company from scaling a potentially ineffective initiative and established your team as rigorous thinkers rather than just "report pullers." Stand firm on the stratified data.
