answer: |-
  The glass wall of the observation deck hummed, a low-frequency vibration that Elias felt in his teeth. Below him, in the sterile white box of Ward 4, sat four other men in identical grey tunics. They were all waiting for the Anchor. There were only three Anchors left in the facility.

  Elias knew the math. Everyone in the Ward knew the math. The Anchor treatment prevented neural cascade failure, but it only worked on certain trajectories. The Allocation AI didn't choose who lived based on merit, or age, or even severity of symptoms. It chose based on *Projected Continuity*. It calculated the probability that a patient, once treated, would remain "themselves" for at least five years.

  To calculate that probability, the AI had to compare Elias to people who had come before. It had to decide who he was like.

  Through the glass, Dr. Halloway and Director Kress stood over a holographic table. The light from the projection washed out their faces, turning them into pale masks. Elias leaned closer to the glass. He couldn't hear their words, but he could see the data streams scrolling between them. He knew what they were arguing about. He could feel the shape of his own life being stretched to fit into boxes that were too small.

  Halloway tapped the table. A cluster of blue points illuminated. She was highlighting the *Genetic Cohort*. These were patients who shared Elias's specific marker, Variant 7. Historically, Variant 7 carriers responded beautifully to the Anchor. Ninety percent continuity. If Elias was one of *these* people, he was safe. He looked at his hands. They were steady. He felt like a Variant 7 carrier. He felt like the success stories.

  Kress swiped the blue points away. She brought up a cloud of red. The *Environmental Cohort*. These were patients who, like Elias, had been exposed to the atmospheric scrubber failure in Sector 9. They shared the same toxin profile, the same duration of exposure. Historically, this group degraded rapidly, even with treatment. Fifteen percent continuity. If Elias was one of *these* people, the Anchor was a waste of resources. It would be given to someone in Ward 5 instead.

  Elias pressed his palm against the glass. He was both. He was the genes and he was the toxin. He was the blue points and the red points. But the machine couldn't process a superposition. It needed a single denominator to run the fraction.

  The door to the observation deck hissed open. Halloway and Kress stepped out into the ward corridor, stopping just outside the glass. They didn't look at Elias yet. They were still looking at each other.

  "You're ignoring the physiological response," Halloway said, her voice sharp. "His synaptic density is holding. That's a Variant 7 trait. The toxin exposure is secondary noise."

  "It's not noise if it kills the host," Kress replied, calm, tired. "Look at the Sector 9 logs. We have two hundred cases. The genetics don't matter when the cellular structure is compromised by the particulate. If we treat him based on the genetic class, we're lying to ourselves about the risk. We're counting him as a survivor before he's survived."

  "We're denying him treatment based on a class he might not belong to," Halloway countered. "The Sector 9 data includes patients who were treated late. Elias was caught early. If we narrow the class to 'Early Detection, Sector 9, Variant 7,' the survival rate jumps back up."

  Kress sighed, rubbing her temples. "And how many people are in that class, Sarah? Three? Four? You can't build a probability distribution on a sample size of four. That's not statistics, that's hope. If we use that narrow a slice, the confidence interval is so wide it's meaningless. We might as well flip a coin."

  Elias watched them. He felt a strange dissociation, as if he were standing outside his own body, looking down at the man in the grey tunic. If he was a random draw from the Genetic Cohort, he was almost certainly going to live. If he was a random draw from the Environmental Cohort, he was almost certainly going to die. If he was a random draw from the Narrow Cohort, the odds were unknowable.

  He was the same man in all three scenarios. The chemistry in his blood didn't change based on which file folder they opened. But the reality of his future did.

  "Patient 734," Kress said, turning to face the glass. She keyed the intercom. "How are you feeling, Elias?"

  "Like a statistic," Elias said. His voice sounded thin in the sterile air.

  Halloway stepped forward. "We're trying to find the most accurate model for your condition. We want to give you the Anchor. But we have to be sure it will hold."

  "Define 'hold'," Elias said. "Do you mean my heart beats? Or do you mean I remember my daughter's name?"

  "Continuity of self," Halloway said. "Five years minimum."

  "And if you pick the wrong group?" Elias asked. "If you treat me like a Variant 7, and I turn out to be a Sector 9 case... do I just fade away anyway? Or does the treatment make it worse?"

  Halloway glanced at Kress. "There are risks associated with mismatched protocols."

  "So my fate depends on which crowd I stand in," Elias said. "But I'm standing in all of them."

  Kress looked at the holographic table behind her. The blue and red clouds overlapped, creating a murky purple zone where Elias existed. "That's the situation. We have limited resources. We have to allocate based on expected utility. If we treat you based on the genetic data, we use one dose. If the environmental factors dominate, that dose is lost, and someone in Ward 5 who fits the Environmental Cohort perfectly dies instead."

  "But if you treat me based on the environmental data," Elias said, "you assume I'm already dead. You assume the genetics don't matter. You're deciding I'm a Sector 9 case before you test the treatment."

  "We're assessing risk," Kress corrected. "You're asking us to ignore the base rate of the exposure group."

  "I'm asking you to look at *me*," Elias said. He tapped his chest. "Not the group. Me."

  Halloway's expression softened. "There is no 'you' in the algorithm, Elias. There's only data points. You are the sum of your attributes. The problem is deciding which attributes define the set."

  "Then make a new set," Elias said. "Just me."

  "Sample size of one," Kress said gently. "Probability is undefined. We can't act on that."

  The silence stretched. The hum of the glass seemed to grow louder. Elias looked down at the other men in the ward. One was sleeping. One was staring at the ceiling. They were all waiting for someone else to be categorized so they could be safe.

  "What happens now?" Elias asked.

  "We run the simulation again," Halloway said. "We try to weight the variables. Maybe we can find a composite class."

  "And if the weights don't converge?"

  Kress looked at him, and for a moment, the administrative mask slipped. She looked as trapped as he felt. "Then we have to make a judgment call. And that judgment call won't be math. It'll be ethics. And I'm not qualified to make that any more than you are."

  "So I wait," Elias said.

  "You wait," Halloway confirmed.

  They turned to leave, but stopped. Kress looked back at the holographic table. She tapped a command, and the display changed. It showed a timeline. On one branch, Elias received the Anchor and lived six years. On another, he received it and degraded in eighteen months. On a third, he didn't receive it, and someone else lived. The branches tangled over each other, impossible to separate.

  "There's another factor," Kress said quietly, almost to herself. "The observers."

  Halloway frowned. "What?"

  "The data we're using," Kress said, gesturing to the clouds of light. "It comes from patients who were treated in the past. Patients who survived long enough to be counted. If we treat Elias, and he fails, he becomes part of the Environmental Cohort data for the next person. If we don't treat him, he never enters the dataset. Our decision changes the reference class for the next guy."

  Elias felt a chill that had nothing to do with the air conditioning. He wasn't just a draw from the population. He was a contributor to it. His existence defined the odds for the person who would sit in this chair next year.

  "So if I live," Elias said, "I make it look easier for the next Variant 7."

  "And if you die," Halloway finished, "you make it look harder for the next Sector 9 case."

  "Does that change the decision?" Elias asked.

  Kress looked at the tangled lines of the simulation. "It should. But it just makes the class selection even harder. Do we treat you to improve the data for your genetic twins? Or do we save the dose for someone who fits the environmental profile perfectly, to maximize immediate success?"

  They stood there, three people suspended in the uncertainty. The math hadn't failed; it was working perfectly. It was producing multiple, mutually exclusive truths, all valid, all supported by the evidence. Elias was 90% likely to survive. Elias was 15% likely to survive. Both statements were true, depending on where you drew the circle.

  "We'll convene the ethics board," Halloway said finally. "Tomorrow."

  "Tomorrow," Elias repeated.

  They walked away, their footsteps echoing down the corridor. Elias turned back to the ward. The man who had been staring at the ceiling was now looking at him. They locked eyes. The other man knew. He knew that Elias was currently both alive and dead, both saved and lost, depending on which way the wind blew in the observation deck.

  Elias sat back down on the cot. He closed his eyes and tried to find the boundary of himself. He tried to feel where the Variant 7 ended and the Sector 9 exposure began. He tried to find the line where he stopped being a member of a group and started being a person.

  But there was no line. There was only the overlap, the purple zone where the blue and red bled together, indistinguishable and infinite. He sat in the quiet hum of the ward, waiting for someone to decide which ghost he was supposed to be.
