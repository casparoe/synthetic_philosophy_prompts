answer: |-
  The rain in Glasgow did not wash things clean; it merely settled the soot deeper into the stone. Archibald Craine stood at the window of his counting-house on Virginia Street, watching the Clyde churn grey and heavy below. Three years ago, the view would have been a forest of masts, a thicket of rigging belonging to ships bound for Chesapeake Bay. Now, the docks were skeletal. The war had not just begun; it had tightened its grip like a creditor's hand around a throat.

  Behind him, the ledger lay open. The red ink was fresh, stark against the creamy paper.

  "Mr. Craine," said young Mr. Reid, his clerk. Reid was twenty-two, sharp-eyed, and possessed of a nervous energy that had grown worse since spring. He held a book bound in plain calf leather. "The pamphlet you asked for. Or rather, the volume. It is heavier than it looks."

  Archibald turned from the window. He did not want the book. He wanted the *Peggy*, his fastest clipper, which was currently somewhere off the coast of Carolina, likely being chased by a privateer or rotting in a blocked harbor. But he had heard the whispers in the Exchange. *Smith. Glasgow. The Moral Philosophy.*

  "Put it on the desk," Archibald said.

  Reid placed it down carefully, as if it were explosive. "Professor Smith argues," Reid began, then stopped himself. He knew better than to lecture a partner of the firm.

  "Argues what?" Archibald asked, pouring two glasses of whisky. He handed one to the clerk. Reid took it, surprised.

  "That the monopoly is a tax on the many for the benefit of the few," Reid said, his voice low. "That the cost of defending the colonies exceeds the profit of the trade. That we are paying for the privilege of being drained."

  Archibald took a sip. The whisky burned, a familiar comfort. "He teaches morals, does he not?"

  "He teaches philosophy, sir. But he speaks of wealth as if it were a fluid. Something that must move to remain healthy. Stagnant pools breed sickness."

  Archibald looked at the book. He had walked past Smith in the university halls a dozen times over the years. He had seen the man stumble in thought, muttering to himself, while Archibald strode past in silk stockings paid for by the very tobacco Smith now dissected. They had moved in the same city but different worlds. Archibald's world was built on the certainty of the hogshead. Tobacco grown, tobacco shipped, tobacco sold. The cycle was holy.

  "And what does he suggest we do?" Archibald asked. "Stop shipping?"

  "He suggests," Reid said, looking at his boots, "that perhaps the connection is the burden. That without the monopoly, the trade might find its own level. Even if the colonies were independent."

  Archibald laughed, a dry, brittle sound. "Independence. They are rebels, Reid. They are burning tar in the streets."

  "Are they?" Reid asked softly. "Or are they simply refusing to be the pool?"

  Archibald dismissed him with a wave. When the door clicked shut, the silence of the room returned, heavier than before. He placed his hand on the book. It was warm from Reid's grip.

  He walked over to the safe and opened it. Inside were not just deeds and bonds, but a sketch. It was a rendering of the new Infirmary wing. *Craine Hall*, the plaque would say. His father had commissioned it. The stone was cut from local quarries, paid for by the re-export of Virginian leaf. He thought of the poor who would lie in those beds, cured by medicines bought with tobacco grown by slaves they would never see, shipped by men who would never touch the soil.

  It was a good thing. Was it not? The city had grown fat on this trade. The paving stones under his feet, the glass in his windows, the charity that salved his conscience—all of it flowed from the Chesapeake.

  But the ledger on the desk told a different story. The *Peggy* was insured, yes. But the insurance rates had tripled. The Royal Navy demanded convoys, which meant delays. The colonies were closing their ports. The monopoly Smith spoke of was not a golden chain; it was an iron shackle, and now that the other end was being pulled by men with muskets, the chain was dragging them all into the water.

  Archibald picked up his quill. He needed to write to his agents in London. He needed to demand action, protection, force. The Crown owed them this. They had paid their taxes. They had built the empire's wealth.

  He dipped the quill. The ink pooled black.

  *We require protection,* he wrote. *The trade is vital.*

  He stopped. *Vital to whom?*

  The question hung in the air, unbidden. It smelled of Smith's book.

  If Smith was right, then Archibald was not a pillar of the empire. He was a rent-seeker. The taxpayer in Leeds, the farmer in Kent—they were paying for the warships that guarded Archibald's profit margins. And now, with the war here, the profit was gone, but the cost remained. The empire was bleeding itself white to keep a door locked that the people on the other side had already kicked open.

  He looked at the sketch of the Infirmary again. It looked smaller now. The stone seemed less solid. If the trade collapsed—and God in Heaven, it was collapsing—what remained? The building would stand, yes. But the legacy? Would men say, "Here is a monument to charity," or would they say, "Here is a monument to a monopoly that failed"?

  He blew out the candle. The room plunged into twilight.

  Archibald put on his coat and stepped out into the Glasgow rain. He walked home through the streets he helped pave. He passed the taverns where merchants shouted about treason and rebellion, their voices rising over the clink of glass. They spoke of victory. They spoke of crushing the rebels and restoring the flow of hogsheads.

  Archibald walked faster.

  His house on the edge of the city was large, built in the style of a Virginia planter's mansion, though he had never set foot in Virginia. The columns were white, the lawn manicured. It stood as a testament to permanence.

  He entered the hall. His wife was in the parlor, playing the harpsichord. The music was bright, forced. She looked up as he entered, her smile faltering when she saw his face.

  "Archibald? Is there news?"

  "The *Peggy* is delayed," he said. "Likely lost."

  She nodded slowly. She knew what that meant. The credit lines would tighten. The servants might need to be let go. The season in London might be cancelled.

  "Professor Smith's book is on my desk," he said suddenly.

  She stopped playing. "The philosopher?"

  "He says we would be better off without them. Without the colonies."

  "That is treasonous," she whispered, though she did not look away.

  "Perhaps," Archibald said. He walked to the window of the parlor. The rain streaked the glass, blurring the garden into a smear of green and grey. "Or perhaps it is arithmetic."

  He thought of the slaves in the fields, the ships in the docks, the soldiers dying in Boston. He thought of the narrow class of merchants, himself included, who had convinced themselves that their private gain was the public good. The Invisible Hand, they called it. But hands could be invisible for many reasons. Sometimes because they were working miracles. Sometimes because they were picking pockets.

  "The house is still here," his wife said, her voice trembling slightly. "The Infirmary is still here."

  "Yes," Archibald said. "For now."

  He felt a strange lightness in his chest, terrifying and liberating. The fortune was slipping away. The empire was fracturing. The system that had lifted him up was shaking itself apart, and the man who had taught morals down at the university had seen the cracks before the mortar had even dried.

  Archibald did not feel converted. He did not feel righteous. He felt only the cold damp of the rain seeping through the stone, and the quiet realization that what he had built was not a foundation, but a scaffold. And the work was done.

  "Play something else," he said gently. "Something quieter."

  She began again, a slow minor key. Archibald stood in the darkening room, listening to the music, waiting for the sound of the war to reach them across the ocean, wondering if anything they had built would weigh more than smoke when the wind finally changed.
