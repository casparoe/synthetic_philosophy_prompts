answer: |-
  You are right to be skeptical, though your friend is tapping into a very famous and seductive comparison. The short answer is: **Your friend is conflating a literary metaphor for possibility with a physical theory of ontology.**

  While Borges undoubtedly anticipated the *logic* of branching timelines, claiming he "worked out" the Many-Worlds Interpretation (MWI) philosophically ignores the fundamental differences between Borges's idealism and Everett's physicalism.

  Here is the breakdown of where the comparison holds water and where it sinks, which should help you settle the argument.

  ### 1. The Grain of Truth: Structural Isomorphism
  Your friend is correct that the structural similarity is striking. In "The Garden of Forking Paths" (1941), the character Stephen Albert explains the labyrinthine novel of Ts'ui Pên:

  > "In all fictional works, each time a man is confronted with several alternatives, he chooses one and eliminates the others; in the fiction of Ts'ui Pên, he chooses—simultaneously—all of them. He creates, in this way, diverse futures, diverse times which themselves also proliferate and fork."

  This sounds remarkably like Hugh Everett III's MWI (1957), which posits that the universal wavefunction never collapses. Instead, every possible outcome of a quantum event actually occurs in a non-communicating branch of reality.

  Physicists like David Deutsch have explicitly credited Borges as a conceptual precursor. So, your friend isn't inventing this connection; it is a standard trope in both literary criticism and pop-physics.

  ### 2. The Ontological Gap (The "Realness" of the Branches)
  This is where your skepticism is justified. The crucial difference lies in what the branches *are*.

  *   **In MWI:** The branches are **ontologically real**. They are physical, material, and exist independently of observation. If a quantum spin goes up and down, there are now two physical universes. This is a claim about the furniture of the universe.
  *   **In Borges:** The branches are **narrative or metaphysical**. Borges was a philosophical idealist (heavily influenced by Berkeley and Schopenhauer). For Borges, reality is often mental or textual. When Ts'ui Pên writes of forking paths, he is describing a labyrinth of *time*, but often within the context of a story or a mental construct.

  In Borges's universe, the "forking" is often a way to describe the infinite complexity of causality or the nature of fiction, not necessarily a claim that there are physically distinct universes made of atoms and energy. Borges is interested in the *experience* of time and the *logic* of infinity, not the mechanics of particle physics.

  ### 3. "A New Refutation of Time" Contradicts MWI
  Your friend specifically cited "A New Refutation of Time" (1946) as evidence that Borges worked out the physics. This is actually the weakest link in their argument.

  In that essay, Borges argues that time does not exist. He uses idealist arguments to suggest that the present is the only reality, and that the continuity of time is an illusion of memory. He writes: *"I suspect that there is only one time, that we are all living in it... that the universe is a single moment."*

  MWI, by contrast, relies heavily on the **unitary evolution of the wavefunction over time**. It requires time to be a real parameter along which the universe branches. Borges is arguing for the *dissolution* of time; Everett is arguing for the *expansion* of time into a multiverse. To say Borges "worked out" MWI in an essay arguing that time is a fiction is a contradiction.

  ### 4. Modal Realism vs. Quantum Realism
  Borges is closer to a philosopher like **David Lewis** (who proposed "Modal Realism," the idea that all possible worlds are just as real as our own) than to a quantum physicist.

  *   **Borges/Lewis:** "All logically possible worlds exist." (Philosophical/Metaphysical claim)
  *   **Everett/Deutsch:** "All quantum mechanically possible states exist." (Physical/Mathematical claim)

  Borges was exploring the *consequences* of infinite possibility on human identity and narrative. He was asking: *If all things happen, what happens to the self?* Everett was asking: *How do we solve the measurement problem in the Schrödinger equation without invoking a conscious observer?*

  ### The Verdict
  Your friend is collapsing two different categories: **Poetic Intuition** and **Physical Theory.**

  Borges possessed a genius for intuiting logical structures that science would later formalize. He understood that if you take infinity and possibility seriously, you end up with a branching structure. However, he did not argue for a **multiverse** in the scientific sense. He argued for a **labyrinth** in the metaphysical sense.

  To tell your friend: Borges anticipated the *shape* of the idea, but not the *substance*. He was writing about the labyrinth of human choice and narrative, not the decoherence of quantum wavefunctions. Claiming he "worked out" the physics is like saying Mary Shelley "worked out" the ethics of CRISPR because she wrote *Frankenstein*. She anticipated the *dilemma*, not the *mechanism*.

  You win the argument on the grounds of **ontology**: Borges's branches are made of words and time; Everett's are made of matter and energy.
