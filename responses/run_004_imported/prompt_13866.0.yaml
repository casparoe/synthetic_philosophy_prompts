    "ranking": ["edt-dependence", "correlation-strength", "large-world-uncertainty", "compromise-risk", "pascalian-structure", "explanatory-idleness", "no-behavioral-upshot"]
  }
  ```

  (that ordering is just a placeholder to show the format, not a guess), followed by one sentence of justification per item explaining its position relative to its neighbors?
