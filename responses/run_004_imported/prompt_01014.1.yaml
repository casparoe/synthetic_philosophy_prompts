      *   **Conflict:** If one sends the key and the other doesn't, the sender is vulnerable/destroyed, and the receiver takes control (Defect). If both send, stability is restored (Cooperate). If neither sends, collapse (Mutual Defect).
      *   **The Twist:** They cannot communicate intentions. They can only exchange "Logic Cores" (source code).
      *   **Climax:** The exchange of code. The internal processing. The moment of Löbian inference.
      *   **Resolution:** Cooperation achieved through logical necessity, not trust.

  5.  **Drafting - Scene by Scene:**

