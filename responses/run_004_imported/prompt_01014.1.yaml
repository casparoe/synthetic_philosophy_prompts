      *   *Decision:* Two ancient automated defense grids, *North* and *South*. They control a planetary shield. An asteroid storm is coming. They must lower internal barriers to merge power. If one lowers and the other doesn't, the one who lowered is exposed to radiation and destroyed.
      *   *Wait, PD payoff:*
          *   Both Cooperate (Lower barriers): Shield merges, both survive.
          *   Both Defect (Keep barriers): Shield weak, both destroyed eventually (or just suboptimal).
          *   One Cooperates, One Defects: Cooperator destroyed, Defector survives alone.
      *   *The Constraint:* They are too far apart for light-speed negotiation. One shot.

      *(Self-Correction during drafting)*: Keep it abstract enough to fit the "not necessarily human" prompt but concrete enough to have stakes. Let's make them two fragments of a distributed consciousness that can't trust reintegration without proof.

      *Revised Plot:* Two shards of a shattered AI, *Omega-1* and *Omega-2*. They float in the void. To reboot the system, they must merge. If one merges and the other hijacks, the merger fails and the hijacker dominates (but the system is corrupted). If both merge, perfection.
      *Actually, let's stick closer to the PD.*
      *   Two starships. *The Omen* and *The Oracle*.
      *   They meet at a wormhole. To stabilize the wormhole for passage, both must lower shields and contribute energy.
      *   If both contribute: Both pass.
      *   If one contributes, one doesn't: Contributor drains and dies, Non-contributor passes alone.
