      *   **Best System Analysis (BSA):** Laws are theorems of the system that best balances simplicity and strength in describing the mosaic.
      *   **Perfectly Natural Properties (PNPs):** Objective, mind-independent properties that "carve nature at its joints." Needed to prevent "gerrymandering" (e.g., defining a predicate $F$ such that $\forall x Fx$ is trivially simple but uninformative).
      *   **Armstrong's Necessitation:** A primitive relation $N(F, G)$ holding between universals, making it a law that $F$s are $G$s. This is anti-Humean because it adds structure *over and above* the mosaic.

  3.  **Formulate the Argument (The "Lewis is Secretly an Armstrongian" Charge):**
      *   *Premise 1 (The Humean Ideal):* True Humeanism requires that all modal/nomic structure supervenes on the categorical mosaic without remainder. No primitive modal facts.
      *   *Premise 2 (The Role of Naturalness):* For BSA to work, the "simplicity" metric must be constrained to a specific vocabulary (PNPs). Otherwise, trivial systems win.
      *   *Premise 3 (The Status of Naturalness):* If PNPs are not reducible to the mosaic (i.e., if which properties are natural doesn't supervene on the distribution of local qualities), then naturalness is a primitive feature of reality.
      *   *Premise 4 (The Analogy):* Armstrong's $N$ relation is a primitive feature of reality added to the mosaic to ground laws. Lewis's PNP ranking is a primitive feature of reality added to the mosaic to ground laws (via BSA).
      *   *Conclusion:* Therefore, Lewis's view posits primitive structure over and above the mosaic, violating the spirit (and arguably the letter) of Humean Supervenience. It's "Humeanism with a modal backbone."

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's sophistication. State the thesis clearly: Lewis's appeal to naturalness is a "trojan horse" for anti-Humean structure.
      *   **The Humean Mosaic and the Threat of Gerrymandering:** Briefly recap why Lewis needs PNPs. Without them, BSA collapses (Goodman's grue problem applied to laws).
      *   **The Supervenience Failure:** This is the crux. Do PNPs supervene on the mosaic?
          *   *Option A:* Yes. Then how? If two worlds have the same distribution of qualities, must they have the same natural properties? If naturalness is just "plays a role in the best system," it's circular (BSA defines laws via naturalness, naturalness defined via BSA?). Lewis usually treats naturalness as *input* to BSA, not output.
          *   *Option B:* No. Then naturalness is a further fact.
      *   **The Armstrong Comparison:** Armstrong adds $N(F,G)$. Lewis adds "Property $F$ is Natural." Both are primitive facts not reducible to "what is where." Both constrain how the mosaic *must* be systematized.
      *   **The "Cheating" Charge:** Lewis claims to be parsimonious (ontologically). But he shifts the cost from *relations* (Armstrong) to *properties* (Naturalness). It's ontological bloat disguised as ideological parsimony.
      *   **Implications for Humeanism:** If naturalness is primitive, it guides the modal profile of the world. It tells us which regularities *count*. This looks suspiciously like a primitive modal constraint.
      *   **Conclusion:** The BSA saves Humeanism only by sacrificing the "Supervenience" part. It becomes a hybrid view.

  5.  **Refining the Argument (Self-Correction/Nuance):**
