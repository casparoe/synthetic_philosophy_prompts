answer: |-
  This is a sharp observation that cuts to the heart of the tension in Lewis's metaphysics. You have identified what many critics (such as John Carroll, Tim Maudlin, and even sympathetic interpreters like Ted Sider) regard as the fatal flaw in the attempt to reconcile Humean Supervenience (HS) with the Best System Analysis (BSA).

  The argument you are asking for rests on the claim that **Perfectly Natural Properties (PNPs) function as a primitive modal constraint on the world, violating the "nothing but" clause of Humean Supervenience.** Here is the argument that Lewis's appeal to naturalness imports the very brute nomic structure he sought to eliminate, effectively rendering his system a crypto-Armstrongianism.

  ### 1. The BSA's Dependency on Naturalness
  To see the problem, we must first acknowledge why Lewis cannot do without PNPs. The BSA defines laws as the theorems of the deductive system that best balances simplicity and strength in describing the total Humean mosaic (the distribution of local qualities).

  However, as you noted, "simplicity" is language-relative. Without a constraint on vocabulary, one could define a predicate $W$ that applies to all and only those worlds where the actual mosaic obtains. The system $\forall x Wx$ would be maximally simple and maximally strong. It would capture every regularity instantly. To prevent this trivialization, Lewis insists that the competing systems must be formulated in a language whose predicates denote **Perfectly Natural Properties**.

  This move saves the BSA from triviality, but it raises a metaphysical question: **What grounds the distinction between natural and unnatural properties?**

  ### 2. The Supervenience Failure
  Humean Supervenience is the thesis that the truth about the world supervenes on the spatiotemporal distribution of local, categorical qualities. There is to be no "modal residue"—no powers, no necessities, no primitive laws. Everything else must be constructed from the mosaic.

  For Lewis to remain a consistent Humean, the fact that property $P$ is *natural* while property $Q$ is *gerrymandered* must itself supervene on the mosaic. It must be a fact *about* the distribution of qualities, not a fact *alongside* it.

  But how could this supervenience work?
  *   **It cannot be functional:** We cannot say $P$ is natural because it plays a role in the Best System. That is circular, as the Best System is defined *using* natural properties.
  *   **It cannot be structural:** If two worlds have the exact same pattern of local qualities (isomorphic mosaics), but in one world $P$ is natural and in the other $Q$ is natural, the BSA would yield different laws for identical mosaics. This violates HS.

  Therefore, for the BSA to function, the ranking of properties by naturalness must be a **primitive, brute fact** about the world. It is not derived from the mosaic; it is a constraint *upon* which properties can constitute the mosaic. Lewis explicitly admits this: naturalness is an unanalyzed theoretical primitive. He writes that we must simply "take the fundamental properties as given."

  ### 3. The Armstrong Parallel
  Now consider D.M. Armstrong's necessitarian view. Armstrong argues that regularities are not enough for laws; we need a relation of necessitation, $N(F, G)$, holding between universals.
  *   **Armstrong's Ontology:** Mosaic + Primitive Relation $N$.
  *   **Lewis's Ontology:** Mosaic + Primitive Property Status (Naturalness).

  The structural parallel is exact. Armstrong adds a primitive relation to explain why some regularities hold with nomic force. Lewis adds a primitive property-ranking to explain why some regularities count toward the "Best System."

  In both cases, the Humean mosaic is insufficient to determine the laws.
  *   For Armstrong, you need the mosaic *plus* the $N$ relation.
  *   For Lewis, you need the mosaic *plus* the Naturalness ranking.

  If HS is the claim that "there is nothing to the world but the mosaic," then both Armstrong and Lewis are violating it. Lewis claims victory on parsimony because properties seem less spooky than necessitation relations. But ontologically, the cost is identical: **both posit a brute fact over and above the categorical distribution that dictates modal structure.**

  ### 4. Naturalness as Covert Nomic Structure
  The crucial insight is that **naturalness *is* nomic structure in disguise.**

  To say a property is "perfectly natural" is to say it is *eligible* to participate in laws. It is to say that the world is structured such that similarities in respect of $P$ matter, while similarities in respect of a gerrymandered $Q$ do not. This is a modal claim. It asserts that the world has an objective grain.

  When Lewis uses naturalness to filter the candidate systems for the BSA, he is effectively hard-coding nomic constraints into the foundation of reality. He is saying, "The laws are the best system, *provided the world cooperates by having these specific joints.*"

  If the naturalness ranking is primitive, it does not supervene on the "what is where." It stands above the mosaic, judging it. This is precisely the kind of "governing" structure Humeanism was designed to reject. Armstrong's $N$ relation governs the universals; Lewis's Naturalness governs the vocabulary of the laws. Both ensure that the mosaic isn't just a brute contingency, but is organized according to a privileged schema.

  ### 5. Conclusion: The Humean Surrender
  The advantage of the BSA over necessitarianism was supposed to be its adherence to Humean Supervenience: it offers laws without "secret powers" or "necessary connections." It promises a world of pure contingency, where laws are merely summaries.

  However, by leaning on an unanalyzed ranking of naturalness, Lewis imports a primitive structure that does not supervene on the contingency of the mosaic. He secures the objectivity of laws not by deriving them from the mosaic, but by constraining the mosaic with a primitive metaphysical hierarchy.

  Therefore, the BSA earns its advantage over Armstrong only by **quietly abandoning Humean Supervenience.** It replaces Armstrong's primitive *nomic connections* with Lewis's primitive *nomic eligibility*. It is not a victory for Humeanism; it is a retreat to a position where the "Humean mosaic" is no longer the sole ontological basis of reality. Lewis saves the laws, but he saves them by positing exactly the kind of brute, non-supvenient structure that Humeanism forbids.
