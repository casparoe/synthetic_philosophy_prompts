      *   *Wait, is paying for X good?* It's better than Y being destroyed. But it's worse than no threat at all. So Surrogate Goal is a *second-best* solution to the "Never Pay" precommitment.
      *   *Actually, looking at CLR literature:* The argument is often that "Never Pay" is unstable or hard to coordinate. Surrogate Goals allow for *safe* acausal trade/threat resolution.
