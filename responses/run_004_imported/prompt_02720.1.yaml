answer: |-
  **Title:** The Threshold of M
  **Characters:**
  *   **Elena:** Defends the possibility of a stable asymmetry grounded in a threshold conception of moral agency.
  *   **Marcus:** Argues that Nozick's own analysis destabilizes the asymmetry, demanding stronger protections for animals.

  **Setting:** A faculty lounge, shortly before a graduate seminar on *Anarchy, State, and Utopia*.

  ***

  **Elena:** You're assigning the "Constraints and Animals" section for Tuesday? Brave. Most instructors skip straight from the Experience Machine to the Entitlement Theory. They treat pages 35 to 49 as a detour.

  **Marcus:** It's not a detour; it's the crash test. If Nozick's libertarianism can't survive the pressure of the moral status question, the side constraints look less like fundamental truths and more like species-prejudice dressed up in deontology. I want the students to see him sweat. He proposes "utilitarianism for animals, Kantianism for people," and then immediately admits the position leaves animals "too subordinate."

  **Elena:** He admits the *intuition* is uncomfortable, not that the logic fails. Look, the asymmetry is defensible if we take the search for characteristic *M* seriously. Nozick suggests *M* is the capacity to shape one's life by an overall conception. That isn't a gradient, Marcus. It's a threshold. You either have a conception of the good you are trying to realize, or you are living purely in the immediacy of sensation.

  **Marcus:** But Nozick explicitly calls the underdetermination of *M* a problem. He writes, "What is the basis for concluding that beings with *M* have a special status?" If *M* is the capacity for a meaningful life, why does that grant me a side constraint against being sacrificed for the greater good? And more importantly, if it's a threshold, where do you draw the line that doesn't leave the "marginal cases" of humanity exposed?

  **Elena:** The line is drawn at moral agency. The reason side constraints exist is that we are beings who can *respect* side constraints. It's a reciprocal community of constraint-respecters. Animals lack the capacity to guide their behavior by moral principles. Therefore, they fall into the utilitarian calculus. They count, their pain matters, but they cannot be *violated* in the Kantian sense because they aren't ends-in-themselves in the normative sense. They are sentient, but not agents.

  **Marcus:** That's the "moral agency" reply, but Nozick anticipates the recoil. If the justification for side constraints is our high degree of *M*, then what happens when we meet the superbeings from another galaxy? Nozick asks: "Would they be permitted to sacrifice us for their greater good?" If you say "No, because we have *M*," they might reply, "You have *M*, but we have *M*-plus. You stand to us as dogs stand to you."

  **Elena:** But Nozick rejects that. He suggests that once you cross the threshold of *M*, you enter the kingdom of ends. It's not a ladder where the higher rungs can eat the lower rungs. It's a binary switch. Light is on, or it's off.

  **Marcus:** Is it? Nozick spends pages wrestling with this. He asks whether moral status is a "utilitarianism of rights" where we minimize violations, or absolute constraints. If *M* is the capacity to shape a life, surely that comes in degrees. A human genius shapes a life more complexly than a cognitively disabled human, who shapes it more complexly than a chimpanzee, who shapes it more than a mouse. If protection tracks *M*, then protection should be gradient. If protection is absolute, *M* must be binary. But biology doesn't do binary.

  **Elena:** Biology doesn't, but moral ontology might. Consider the "marginal cases" objection you're hinting at. Yes, an infant lacks the current capacity for an overall conception. But we protect the infant because they are of the *kind* that typically possesses *M*, or because they are *potential* possessors of *M*. We don't treat them as resources because to do so would erode the respect due to the kind.

  **Marcus:** Nozick calls this "speciesism" and admits it's unsatisfying. He writes, "The fact that a being is of a certain kind... does not show that it has the characteristic *M*." If you protect the severely cognitively disabled human solely because of their species-kind, you've abandoned *M* as the justification. You've reverted to brute membership. But if you stick to *M*, the disabled human loses side constraints. And if the disabled human loses them, why doesn't the chimpanzee gain them? Some chimps display more agency than some severely impaired humans.

  **Elena:** Because the human is a participant in our moral community, even if impaired. The asymmetry holds because the *default* status of humans is agency. We treat the exceptions based on their relationship to the rule. But for animals, the default is non-agency. So, "utilitarianism for animals" remains stable. We aggregate their welfare because they don't have a "life to lead" that can be frustrated in the normative sense. They have experiences, not biographies.

  **Marcus:** And there is the utility monster recoiling, just as Nozick feared. If animals are subject to aggregation, and humans are not, then *any* human gain can theoretically outweigh *any* animal loss. I want to build a park; a thousand deer lose their habitat. My aesthetic pleasure is a "gain" in the utilitarian calculus. Since my side constraints prevent anyone from stopping me for *my* sake, but the deer have no side constraints, they are utterly subordinate. Nozick says this leaves them "too subordinate." You call it stable; I call it a license for tyranny.

  **Elena:** Not tyranny. We still have duties to them. Nozick says we shouldn't cause suffering without reason. It's just that "reason" can include human benefit. That's the asymmetry.

  **Marcus:** But think about the superbeing argument again. It's not just about aliens. It's about the logic of justification. If you justify eating the cow because the cow lacks *M*, and the human has *M*, you are asserting that higher *M* licenses the use of lower *M*. If that's the principle, then a being with higher *M* can use you. You can't have it both ways. You can't say "My *M* protects me from my peers, but my *M* allows me to use the cow." That's special pleading.

  **Elena:** It's not special pleading if *M* is the capacity for inviolability. Only beings that can understand inviolability can possess it. It's like voting. Only those who understand the ballot can vote. We don't say, "Well, if only those who understand voting can vote, then superbeings shouldn't let us vote."

  **Marcus:** Bad analogy. Voting is a privilege; side constraints are protections *against* being used. A better analogy: If I say, "I won't eat you because you can speak," then a being who says, "I won't eat you because *I* can speak and you cannot" has trapped you. Nozick knows this. He says, "Perhaps the principle is that beings with *M* may not be sacrificed... but why?" If the answer is "Because they value their lives," animals value their lives. If the answer is "Because they have a conception of the good," we are back to the gradient.

  **Elena:** Let's look at the text. Nozick gestures toward "meaningful life." He suggests that sacrificing a being with a meaningful life destroys something irreplaceable in a way that sacrificing a being without one does not. The cow's death is a tragedy of sensation; the human's death is a tragedy of a narrative cut short.

  **Marcus:** But a cow's narrative is cut short too. It has preferences, social bonds, future-oriented desires. Nozick admits we don't know exactly where the line is. He says, "We may not know exactly where to draw the line." If we don't know where the line is, how can we justify a rigid asymmetry that allows us to kill them for trivial reasons? If there's epistemic uncertainty about *M*, the precautionary principle should apply. We should treat them *as if* they have side constraints until we are sure.

  **Elena:** That pushes us toward the conclusion you want: stringent constraints for animals. But does it vindicate Nozick? Nozick wants to save the libertarian side constraints for humans without collapsing into utilitarianism. If we extend side constraints to animals, we dilute the concept. Side constraints become just very heavy utilitarian weights.

  **Marcus:** Or, we realize that "utilitarianism for animals" was the weak link. Nozick's trouble pinning down *M* suggests that *M* isn't the foundation. The foundation is sentience plus the interest in continuing to live. If we accept that, the asymmetry collapses. We don't need to find a magical *M* that humans have and cows lack. We just need to acknowledge that the "utility monster" problem applies interspecies. If it's wrong for a superbeing to sacrifice me for their greater good, it's wrong for me to sacrifice the cow for my greater good.

  **Elena:** But then you lose the distinction between murder and euthanasia of a suffering animal. You make the moral landscape flat. Nozick wants a landscape with peaks and valleys. Humans on the peaks, animals in the valleys.

  **Marcus:** And that's exactly what the superbeing argument destabilizes. If there are peaks and valleys, we aren't necessarily on the highest peak. Nozick writes, "Beings from another galaxy... might stand to us as it is usually thought we do to animals." He doesn't resolve this. He leaves it hanging. Why? Because he knows that if *M* is the criterion, we might not have enough of it.

  **Elena:** He leaves it hanging to show the limits of our current moral theory, not to concede the point. He wants us to see that "utilitarianism for animals" is the best we can do *given* our commitment to human rights.

  **Marcus:** No, he leaves it hanging because the "Kantianism for people" relies on a mystical view of human uniqueness that the "Underdetermination" section dismantles. He shows that any naturalistic property *M* we pick will either exclude some humans or include some animals. So we are left with a choice: either we accept that some humans are expendable (which we won't do), or we accept that some animals are inviolable (which "utilitarianism for animals" denies).

  **Elena:** We protect the marginal humans based on social relations and the slippery slope. Nozick mentions this.

  **Marcus:** And he dismisses it as insufficient! He says, "This does not show that they [animals] have rights." He's honest enough to see that protecting animals only because of their effect on *us* doesn't grant *them* moral status. It makes them props.

  **Elena:** So what is your alternative? If you remove the asymmetry, do you grant cows the right to vote?

  **Marcus:** No. Rights are tailored to interests. A cow has an interest in not suffering and in continuing its life. It does not have an interest in political participation. Side constraints protect those fundamental interests. "Utilitarianism for animals" allows me to override those interests for a trivial gain. That's the instability. If I have a right not to be killed for your benefit, and the only difference between us is a vague *M* that might be a matter of degree, then you can't kill me for your benefit either. The logic flows both ways.

  **Elena:** You're arguing for a gradient of protection.

  **Marcus:** I'm arguing that Nozick's own honesty about the gradient undermines his binary. If *M* varies, protection should vary. But if protection varies, then "Kantianism for people" is false—it's just "High-Utilitarianism for People." And if it's High-Utilitarianism, then the gap between high-protection humans and low-protection animals isn't a wall, it's a slope. And on a slope, things slide.

  **Elena:** But without the wall, without the side constraint, you lose the libertarian core. You allow aggregation.

  **Marcus:** Perhaps the lesson for the students is that you can't have the libertarian core *and* the meat on your plate. Nozick wants both. He wants the absolute inviolability of the self, but the aggregatability of the beast. The superbeing argument shows that's a precarious perch.

  **Elena:** Or the lesson is that moral status *is* discontinuous. That rational agency is a phase shift, like water turning to ice. It looks like a gradient until it snaps into a new structure. We snap; animals don't.

  **Marcus:** Then show me the snap. Nozick couldn't. He ended those sections with questions, not answers. "What are constraints based upon?" He doesn't know. If the founder of the theory admits he doesn't know why the constraints exist, how can we be sure they don't apply to the beings we eat?

  **Elena:** Because we know what it is to be us. We know what it is to have a life plan.

  **Marcus:** And the superbeing knows what it is to be them. And we are on the menu. Unless you can find an *M* that is immune to that comparison, the asymmetry is just local custom.

  **Elena:** Then we'd better hope *M* is real. Because if it isn't, the students won't just be debating animal rights. They'll be debating whether human rights are real.

  **Marcus:** Exactly. That's why we're teaching this section. It's not about the cows, Elena. It's about whether the "Kantianism for people" stands if the "Utilitarianism for animals" falls.

  **Elena:** Well. I suppose I'll see you in the seminar. I'll take the threshold; you take the slope.

  **Marcus:** And we'll see if the students can find *M* where Nozick couldn't.

  **Elena:** Or if they decide the search was the point all along.

  **Marcus:** Let's hope they don't decide the point was the lunch break.

  ***
