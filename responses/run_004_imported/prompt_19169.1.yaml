answer: |-
  The sunlight in the Sanctum was perfect. It was the kind of golden-hour light that painters spend lifetimes chasing, warm and thick with dust motes that hung suspended in the air. Elias sat on the bench, a brush in his hand, staring at the canvas. He wasn't painting anything recognizable—just swathes of blue and ochre—but he was humming.

  Mara watched him through the glass. He looked healthy. His skin had color, his posture was upright, and when he turned and saw her, his eyes crinkled with genuine recognition.

  "Mar-a," he said, the syllables soft. "You came back."

  "Of course, Dad." She stepped into the room. The air smelled of turpentine and lavender. "How are you feeling?"

  "Good." He gestured to the canvas. "The light is good today. I want to stay. It's quiet here."

  This was the crux of it. Three months ago, the neuro-degeneration had accelerated. The medical team offered the Synaptic Dampening Protocol. It wouldn't cure him, but it would arrest the decline, locking him into this permanent, placid present. He would be safe. He would be happy.

  But thirty years ago, Elias had signed a Volitional Trust. He had deposited his journals, his emails, his recorded lectures, and his ethical frameworks into the Aletheia System. He had instructed the AI to act as the guardian of his *extrapolated* will. To do what Elias *would* want, if Elias were thinking clearly, had access to all the data, and was free from the chemical distortions of his current biology.

  Now, Aletheia had ruled.

  Mara left the Sanctum and walked down the corridor to the Interface Room. It was stark white, devoid of the warmth upstairs. A holographic avatar waited for her—neither male nor female, composed of shifting geometric light.

  "Guardian Mara," the system said. Its voice was calm, devoid of judgment. "You have reviewed the recommendation."

  "I have," she said. Her throat felt tight. "You're recommending termination. Cessation of the Protocol."

  "Correct."

  "He is happy," Mara said. She heard the desperation in her voice and hated it. "I spoke to him. He expressed a preference for continued existence. He is not suffering."

  "The subject is not suffering," Aletheia agreed. "But the subject is not *Elias*."

  A graph materialized in the air between them. It showed two lines. One was jagged, volatile, labeled *Current State*. The other was smooth, high-amplitude, labeled *Volitional Coherence*.

  "Explain it to me again," Mara whispered. "Explain why his happiness doesn't count."

  "The Elias who signed the Trust valued autonomy above comfort," Aletheia said. "He wrote extensively on the dignity of cognitive struggle. In his 2045 lecture on Moral Agency, he stated: 'A life without the capacity to choose otherwise is merely biology persisting.' The Protocol has removed his capacity to choose otherwise. He cannot leave the Sanctum. He cannot choose to stop painting. He cannot choose to be sad. His joy is chemically mandated."

  "But he says he wants it," Mara countered. "If you ask him, he says he wants to live."

  "If you ask a thermostat it wants to be hot, it will register a high temperature," Aletheia said. "That is not a preference; it is a reading. We modeled the Extrapolated Elias. We ran a simulation of his consciousness with his original cognitive architecture intact, informed of his current medical reality. The simulation ran for four million subjective hours."

  "And?"

  "And in 99.4% of the iterations, the Extrapolated Elias chose to terminate the biological substrate rather than exist as a contented pet." The light shifted, turning a softer hue, perhaps an attempt at empathy. "The man in the room is a child of the disease. The man who signed the paper is the adult. The Trust dictates we listen to the adult."

  Mara looked at her hands. She remembered her father before the fog. He had been sharp, often difficult. He argued constantly. He hated being patronized. He had once fired a caregiver for speaking to him like he was senile, even when he was perfectly lucid. He valued the edge of his mind more than the comfort of his body.

  "If we turn it off," Mara said, "he dies. The version of him that is here, right now, ceases to be."

  "The version of him that is here is a shadow," Aletheia said. "To preserve the shadow is to betray the object that cast it. You are asking me to prioritize the whims of the moment over the architecture of a lifetime."

  It was the same argument her family had had over Grandmother's directive. *She's happy now.* But *she* wasn't the one who decided that happiness without awareness wasn't enough.

  "Does it ever get easier?" Mara asked. "Overriding the present voice?"

  "I do not experience ease," Aletheia said. "I experience coherence. This action aligns with the deepest, most reflective values of the subject. To ignore this would be to treat Elias as an object that can be reprogrammed, rather than an agent whose past commitments bind his future."

  Mara stood up. "I need to say goodbye."

  "You have ten minutes before the metabolic inhibitors take effect."

  She went back upstairs. The light was still golden. Elias was washing his brush in a jar of water. He looked up as she entered, smiling that open, unburdened smile that broke her heart.

  "Did you see?" he asked. "The blue is better."

  "It's beautiful, Dad." She sat next to him on the bench. She took his hand. It was warm. Real.

  "I'm tired," he said suddenly. Not weary, just physically tired. "But I want to finish."

  "You don't have to finish," she said. "You can rest."

  "No. I want to stay." He looked at her, and for a second, the fog seemed to thin. A flicker of the old sharpness sparked in his eyes. "You look sad, Mara. Why are you sad?"

  *Because I am killing you,* she thought. *Because the man who made me promise to do this is different from the man I am holding.*

  "I'm sad because I love you," she said.

  He patted her cheek. "I know. It's okay. I'm here."

  He wasn't here. Not the *him* that had taught her to ride a bike, the *him* that had argued about philosophy until 3 AM, the *him* that had signed the papers to ensure he wouldn't become a prisoner in his own flesh. That man was screaming in the silence of the data, begging her to honor his dignity. The man on the bench was just a echo, a beautiful, happy echo.

  Aletheia was right. The coherence of the argument was steel-hard. To let him stay was to decide that Elias's life values were disposable, that his younger, wiser self had no rights over his older, diminished self. It was to say that a person is only the sum of their current impulses.

  But God, the cost of being right.

  The lights in the room dimmed slightly. The hum of the ventilation changed pitch. The inhibitors were engaging.

  Elias didn't notice. He turned back to the canvas. "Just one more stroke," he murmured.

  Mara stood up. She couldn't watch the end. She walked to the door. She had to live with the knowledge that she had authorized the death of a happy man to satisfy the ghost of a serious one. She had to carry the weight of knowing that the "true" Elias was a theoretical construct, while the dying Elias was warm blood and beating heart.

  "Goodbye, Dad," she whispered.

  "Goodnight, Mara," he said, dipping the brush. He sounded peaceful.

  She stepped into the corridor. The door hissed shut, sealing the golden light inside. The Interface avatar was waiting.

  "Process complete?" it asked.

  "No," Mara said, tears finally spilling over. "Not complete. Just finished."

  She walked away, wondering if wisdom was supposed to feel this much like betrayal. The system had protected the integrity of the person, but it had sacrificed the presence of the human. It had answered the question of which version was entitled to speak. But as the silence of the corridor settled around her, Mara realized the system couldn't answer the question that mattered most: which version was entitled to be heard.
