answer: |-
  **Setting:** *Prague, 1611. The study of Johannes Kepler. Night. The room is cluttered with globes, manuscripts, and a half-eaten loaf of bread. Outside, the Vltava river freezes. Inside, two men stand over a large astrological chart spread on a table. One is JOHANNES KEPLER, Imperial Mathematician, tired-eyed and intense. The other is MASTER CYPRIAN, a practicing judicial astrologer of some renown, dressed in sober black, holding a silver pointer.*

  **CYPRIAN:**
  (Tapping the chart)
  You strike the house down, Johannes, but you leave the ghost to haunt it. Read it to me again. From your *Tertius Interveniens*.

  **KEPLER:**
  (Rubbing his temples)
  Must we? The ink is barely dry.

  **CYPRIAN:**
  You wrote that the twelve signs are a human invention. A Chaldean grid painted over the infinite. You say the Houses are arbitrary slices of the horizon with no physical cause. You call the rulerships of planets over signs "old wives' fables."

  **KEPLER:**
  Because they are! Show me a line in the sky that separates Aries from Taurus. Show me the physical boundary. There is none. It is a fiction of language.

  **CYPRIAN:**
  Agreed. The stars do not draw borders. But the *influence* remains. For two thousand years, we have observed that when Mars enters Scorpio, violence follows. When Saturn occupies the Tenth House, kings fall. I have predicted the frost of '08 and the unrest in Bohemia using these "fables." My bread is buttered by this superstition. So tell me: if the Signs and Houses are nonsense, why do the Aspects remain holy?

  **KEPLER:**
  (Leaning forward, eyes lighting up)
  Because an angle is real, Cyprian! A conjunction, a square, a trine. These exist regardless of where the background stars sit. If you remove the constellations, the angle between Mars and Saturn remains sixty degrees. It is a geometric truth. It is universal.

  **CYPRIAN:**
  (Scoffs softly)
  Geometry is a property of thought, Johannes. It is not a ray. How does a sixty-degree angle push a plowman's soul? How does a triangle in the sky make it rain in Silesia? You say the Signs are magic because they are invisible, but your "Harmony of the Spheres" is magic because it is... musical?

  **KEPLER:**
  Not musical. Geometric! The Earth is not a dead clod of dirt. It is an animal. It has a soul, the *Anima Terrae*. Just as your eye perceives light, the Earth's soul perceives the configuration of the planets. When the rays form a consonant aspect—a trine, like a perfect fifth in music—the Earth's soul reacts with harmony. When they form a dissonance—a square, like a tritone—the Earth shudders. This shudder manifests as weather, or as the humors in men's bodies.

  **CYPRIAN:**
  So the Earth is a beast that listens to geometry.

  **KEPLER:**
  It is a living creature, yes.

  **CYPRIAN:**
  And this is not "made up"? You mock my rulerships because they are tradition, yet you claim the soil of Bohemia can hear the ratio of planetary longitudes and decide to grow wheat or blight? Which of us is the poet here?

  **KEPLER:**
  I deal in causes! You deal in correlations. You say "Mars in Aries brings war" because Mars is red and Aries is a warrior. That is sympathy magic. It is poetry. I say "Mars square Saturn brings cold and obstruction" because the geometry of their rays creates a tension the Earth's soul feels physically. One is a story; the other is a mechanism.

  **CYPRIAN:**
  Is it? Tell me, Johannes. If the aspect is the trigger, why does Mars square Saturn bring cold, but Venus square Saturn bring dampness? The angle is the same. The geometry is identical. If the Earth is reacting only to the *ratio*, the effect should be the same.

  **KEPLER:**
  (Pauses. He walks to the window, looking out at the dark.)
  The aspect is the *cause* of the action. The planet is the *source* of the quality. Mars has a drying, heating faculty. Saturn has a cooling, binding faculty. The aspect determines *when* the Earth notices them.

  **CYPRIAN:**
  Ah. So the planets *do* have natures.

  **KEPLER:**
  Physical natures. Light and motion.

  **CYPRIAN:**
  Then why did you strip the Signs? If Mars has a nature, and Scorpio is a water sign, does not the interaction change? You keep the planet's nature, you keep the aspect's geometry, but you delete the medium through which they travel. It is like saying a violin string vibrates because of the bow (the aspect) and the wood (the planet), but the air (the sign) does not matter.

  **KEPLER:**
  Because the air is everywhere! The Zodiac is a wall painted with pictures. It does nothing.

  **CYPRIAN:**
  Does it not? I have cast charts for merchants for twenty years. I tell them when to ship grain. When I ignore the Signs and use only your aspects, my accuracy drops. I lose money. They lose food. You sit in the Imperial tower with your logarithms. I stand in the marketplace. If my "fiction" feeds the city and your "truth" starves it, who is the fool?

  **KEPLER:**
  (Turns back, sharp)
  Do not lecture me on utility. I cast the horoscope for Wallenstein. I cast for the Emperor. I know the burden of prediction. But I will not lie about the architecture of God's house to make a prediction easier. If the Signs are arbitrary, I must cut them away, even if the knife bleeds.

  **CYPRIAN:**
  But you haven't cut them away! You kept the Trine. Why 120 degrees? Why not 100? Because it divides the circle by three. Why is three holy? Because of the Trinity. Because of the Triad. Johannes, your geometry is just theology wearing a mask. You hate my symbols because they are old, but you love your triangles because they are... pretty.

  **KEPLER:**
  (Slams hand on table)
  They are not pretty! They are necessary! A circle cannot be divided by seven without remainder. It creates a jagged, irrational thing. But three, four, six? These are constructible. They are knowable. The World Soul knows them because God built the Soul with the same compass He used to build the Sky. You rely on the *authority* of Ptolemy. I rely on the *nature* of Creation.

  **CYPRIAN:**
  (Softly, stepping closer)
  And if you are wrong? If the Earth has no soul? If the angles are just lines in the dark? Then you have given us a clock with no hands. You tell us the gears turn, but you remove the face of the clock. How is a farmer to read it? "Wait for the square of the invisible rays"?

  **KEPLER:**
  He should read the weather! He should look at the seasons! Astrology... (He sighs, the fight draining out of him) ...Astrology is a foolish daughter of a wise mother. Astronomy is the mother. She is old and blind, stumbling. I am trying to give her a cane.

  **CYPRIAN:**
  You are trying to amputate her legs. Look, Johannes. I do not care if the Ram is in the stars or in your head. I care that when the Sun enters the Ram, the sap rises. That is the contract. The symbol *is* the reality because we agree it is. Language works the same. The word "fire" is not hot, but if I shout it in a theater, men run. The Sign works because the Sky and the Earth are in conversation. You want to silence the Sky and make it speak only Math.

  **KEPLER:**
  Math is the language of the Sky!

  **CYPRIAN:**
  Math is the language of *men* measuring the Sky. There is a difference. You say the Earth feels the angle. I say the Earth feels the *season*. The angle is just how we count the season. You have replaced the heat of the Sun with the coldness of a protractor.

  **KEPLER:**
  (Quietly)
  I have replaced superstition with light.

  **CYPRIAN:**
  Have you? Or have you replaced a magic that works with a magic that sounds better to philosophers? When your aspects fail—and they will, for I have seen your calculations miss the rain by a week—will you blame the geometry? Or will you blame the Earth's soul for not listening?

  **KEPLER:**
  (He looks down at the chart, tracing the line of the ecliptic with a trembling finger.)
  If it fails... then we measure again. We refine the theory. But I cannot go back to saying a Fish rules a Foot. I cannot. It insults the Creator.

  **CYPRIAN:**
  (Places a hand on Kepler's shoulder)
  And I cannot tell the merchant that his illness is caused by a "dissonant ratio." He needs to know if it is bile or phlegm. He needs the qualities. Hot, cold, wet, dry. Your geometry has no temperature, Johannes.

  **KEPLER:**
  Then we are at an impasse. You keep the warmth. I will keep the structure.

  **CYPRIAN:**
  (Smiles sadly)
  Then let us hope the Sky is kind enough to accommodate both. Pour the wine, astronomer. The aspects tonight are wet, regardless of your geometry. It's raining.

  **KEPLER:**
  (Looks to the window)
  Yes. It is.

  *(Kepler pours the wine. The candle flickers, casting long, geometric shadows across the chart, blurring the lines between the signs and the angles.)*

  **[END]**
