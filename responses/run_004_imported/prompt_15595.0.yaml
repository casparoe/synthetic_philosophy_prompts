answer: |-
  This is an excellent observation, and it touches on one of the most vibrant tension points in contemporary philosophy of AI. You are correct that LLMs display a fluency with common-sense invariance that eluded symbolic AI (GOFAI) for decades. However, the reason philosophers generally do not consider the frame problem "solved" by transformers comes down to a disagreement about **what counts as a solution** and **what mechanism is actually doing the work.**

  To represent the debate accurately in your piece, you need to distinguish between the *engineering performance* of LLMs and the *theoretical requirements* of the frame problem as defined by McCarthy, Hayes, and Dennett.

  Here is a breakdown of why the consensus remains that the frame problem is open, along with the nuances you should capture.

  ### 1. Two Different Definitions of the Frame Problem
  First, it is helpful to clarify that there are effectively two "frame problems" in the literature, and LLMs address them differently.

  *   **The Logical Frame Problem (McCarthy & Hayes, 1969):** This was a technical issue in formal logic. How do you program a system to represent that an action changes *only* specific variables without writing infinite axioms stating that everything else remains the same?
      *   *LLM Status:* **Obviated, not solved.** LLMs don't use formal logic or explicit state representations. They don't need frame axioms because they aren't deducing state transitions; they are predicting token probabilities. They bypassed the logical bottleneck by changing the architecture entirely.
  *   **The Epistemological/Relevance Frame Problem (Dennett, 1984):** Dennett broadened the problem. It isn't just about logic; it's about **relevance**. How does a mind (human or machine) instantly identify which consequences of an action matter and which do not, without computing every possible consequence? (e.g., If a robot pulls a wagon with a bomb on it, it needs to know the bomb moves, but not that the color of the wagon wheels remains the same).
      *   *LLM Status:* **Contested.** This is where philosophers remain skeptical.

  ### 2. Why Philosophers Say It's Not Solved
  Even granting that LLMs often get the right answer (the chair's weight doesn't change), philosophers argue this is a "stochastic parrot" effect rather than a cognitive solution. Here are the four main arguments you should include:

  #### A. Correlation vs. Causal Modeling
  LLMs infer invariance based on statistical regularities in text, not an understanding of physical persistence.
  *   **The Critique:** An LLM knows "chair weight" usually doesn't change after "painting" because those sentences co-occur in its training data. It does not possess a model of mass, gravity, or material composition.
  *   **The Risk:** When the scenario leaves the training distribution (e.g., "I paint the chair with nanobot paint that consumes mass"), the LLM often fails to reason through the *physics* of the change. It relies on plausibility, not causal deduction. Philosophers argue that solving the frame problem requires understanding *why* things stay the same, not just predicting that they usually do.

  #### B. Robustness and Brittleness
  A true solution to the frame problem implies reliability. If a cognitive system solves the relevance problem, it should not be easily tricked into thinking irrelevant things changed.
  *   **The Critique:** LLMs are brittle. With adversarial prompting or sufficiently novel contexts, LLMs will happily hallucinate that the table grew a leg or the chair lost its weight.
  *   **The Philosophical Point:** As philosopher **Jerry Fodor** might have argued (had he seen LLMs), the frame problem is about the *isotropy* of belief—how any piece of knowledge can potentially be relevant. LLMs solve this via attention mechanisms, but these mechanisms are heuristic, not logical. They work 95% of the time, but the 5% failure rate shows the underlying architectural problem of relevance selection remains unsolved.

  #### C. The Lack of a "World Model"
  Dennett's version of the frame problem assumes an agent acting in a world. To know what *doesn't* change, you need a representation of the world to compare against.
  *   **The Critique:** Many philosophers (and cognitive scientists like **Gary Marcus** or **Emily Bender**) argue LLMs do not have grounded world models. They manipulate symbols without reference. If you don't represent the "chair" as an object with properties, but rather as a vector in a latent space, you haven't solved the problem of how an agent tracks identity over time; you've just masked it with high-dimensional pattern matching.

  #### D. System 1 vs. System 2
  Psychologists distinguish between fast, intuitive thinking (System 1) and slow, deliberate reasoning (System 2).
  *   **The Critique:** LLMs are pure System 1. They "intuit" that the weight stays the same. But the frame problem is often framed as a challenge of deliberate planning and reasoning (System 2). When an LLM is asked to plan a complex sequence of actions where side-effects accumulate, it often loses track of invariants. Philosophers argue that until a system can *deliberately* verify invariants during planning, the frame problem remains open.

  ### 3. The Counter-Argument (The "Dissolution" View)
  To be fair, some philosophers and AI researchers argue the problem *has* been dissolved, just not in the way McCarthy hoped.
  *   **The Argument:** Philosophers like **Andy Clark** or proponents of embodied cognition might argue that expecting explicit logical representation was the mistake. If a statistical system can navigate the world effectively without explicit frame axioms, then the "problem" was a artifact of a bad theory of mind (symbolicism).
  *   **Nuance:** Even these proponents usually stop short of saying transformers *perfectly* solve it. They argue it shows the frame problem is less of a hard logical barrier and more of an engineering trade-off between precision and probability.

  ### 4. How to Frame This in Your Piece
  To represent the state of the debate accurately, I recommend avoiding the binary of "Solved vs. Unsolved." Instead, frame it as a **shift from a logical problem to a statistical one.**

  **Suggested Narrative Arc:**
  1.  **Acknowledge the Shift:** Admit that LLMs have achieved what symbolic AI could not: fluid, implicit common-sense inference without explicit frame axioms.
  2.  **Define the Philosophical Objection:** Explain that philosophers distinguish between *simulating* the output of common sense (which LLMs do) and *instantiating* the cognitive mechanism of relevance (which is debatable).
  3.  **Highlight the "Black Box" Issue:** The frame problem was originally about how to *structure knowledge* so relevance is computable. LLMs hide this structure in weights. We don't know *how* they decide relevance, which makes it hard to claim the theoretical problem is solved.
  4.  **Mention the Failure Modes:** Cite hallucination and adversarial vulnerability as evidence that the "invariance" is not a hard constraint in the system, but a soft probability.
  5.  **Conclusion:** The consensus is that LLMs have **sidestepped** the logical frame problem but have not necessarily solved the **epistemological frame problem** of how relevance is determined in a grounded agent.

  ### Key Voices to Reference
  *   **Daniel Dennett:** Has commented on LLMs, noting they are "competent without comprehension." He would likely argue they haven't solved the frame problem because they don't *care* about the truth of the invariants, only the likelihood of the text.
  *   **Gary Marcus:** A vocal critic who argues LLMs lack causal models, making them unable to truly solve frame-like reasoning problems reliably.
  *   **Yann LeCun:** Argues current LLMs are insufficient because they lack world models and planning, which are necessary to truly handle physical invariance and causality (aligning with the idea that the frame problem isn't solved yet).
  *   **Andy Clark:** Represents the view that if the behavior is adaptive, the internal mechanism matters less (predictive processing), suggesting the problem might be dissolving.

  ### Summary for your piece
  Philosophers continue to treat it as open because **reliability is not understanding.** LLMs demonstrate that you can get the *results* of solving the frame problem through brute-force statistics, but they have not explained the *mechanism* of relevance selection in a way that satisfies cognitive science or logic. The debate has moved from "Can we write the axioms?" to "Does statistical prediction count as cognition?"
