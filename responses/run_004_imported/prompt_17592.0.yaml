answer: |-
  The air in the preparation room was thick, smelling of formaldehyde and crushed frangipani. Outside, the Kumasi heat shimmered off the roof of the family house, but in here, the air conditioning hummed a low, funereal drone. The body of Kwame lay on the table, wrapped in a white cloth that looked too stark against his dark skin.

  Kofi stood at the head of the table, his fingers resting on the folded linen. He did not look at Abena.

  "The Kente," Kofi said quietly. "We will not use the Kente. And the libation will be short. We acknowledge the death, Abena. We do not celebrate a life that was not lived."

  Abena stepped closer, her heels clicking on the tile. She was tired, her eyes red, but her spine was rigid. "He is in the box, Uncle. He is dead. The time for judging his life is past."

  "The time for judging is exactly now," Kofi said, turning to her. "The funeral is not for him. He is gone. It is for us. It is a statement of truth. If we drape him in the cloth of an elder, we tell the community that he fulfilled the obligations of an elder. He did not."

  "He fulfilled the obligation of existence," Abena said. "He was a man. He breathed, he thought, he suffered. That is the baseline. You speak as if personhood is a medal he failed to win."

  "Not a medal. A weight," Kofi corrected. "Menkiti was clear on this. We are born as mere biological entities. *Individuals.* To become a *Person* is a task. It is a moral architecture built by how we weave ourselves into the lives of others. Your father spent thirty years unweaving himself. He did not come to the *abusua* meetings. He did not contribute to the nephews' school fees. When the widow next door was evicted, he locked his door. He refused the reciprocity that makes us human."

  "So because he was a recluse, he is less than human?" Abena's voice sharpened. "That is the logic? If I understand your Menkiti, you are saying my father is a 'it' to be disposed of, not a 'who' to be buried."

  "I am saying he is a human being who refused to become a Person," Kofi said, his voice patient, the lecturer still alive in him. "There is a difference. Personhood is an excellence. It is achieved by degrees. If you do not climb the mountain, you do not get the view. Why should we pretend he reached the summit?"

  "Because the mountain is a trap if you build it that way," Abena countered. She reached out and smoothed the white cloth over her father's chest. "Gyekye warned against this. This radical communitarianism. If personhood is *only* conferred by the community, then the individual has no standing to criticize the community. My father's isolation was not just stubbornness, Uncle. It was a dissent. He saw the corruption in the family council. He saw how the elders ate the resources meant for the young. He said no."

  "He said nothing," Kofi snapped. "He walked away. Silence is not moral dissent. It is abandonment."

  "It is the only language left when the room is too loud to hear reason," Abena said. "But look at what your philosophy demands. If personhood is earned by social integration, then a conformist who steals is more of a 'person' than a hermit who tells the truth. You are valuing the ritual over the moral agent."

  "I am valuing the network that sustains us all," Kofi said. He picked up a bottle of oil, hesitated, and set it down. "Without the network, there is no metric for good or bad. Your father's 'reason,' as you call it, floated in a vacuum. A will that does not engage with others is not a moral will. It is a whim. To grant him the full rites is to lie to the grandchildren. It tells them that one can opt out of the collective burden and still receive the collective honor. That destroys the incentive for the living to care for one another."

  Abena walked around the table to face him. "And what does it tell them if we do this your way? That if you stumble, if you disagree, if you find the community suffocating, you can be stripped of your dignity in death? That is tyranny, Uncle. Gyekye argued that we have natural capacities—reason, will, moral sense—that exist *before* the community touches us. My father had those. He used them to judge this family and find it wanting. By denying him the rites, you are punishing him for using the very agency that makes him a person in the first place."

  "Agency requires an arena," Kofi insisted. "You cannot play chess alone. If he rejected the arena, he rejected the game. I am not punishing him. I am respecting his choice. He chose to stand outside. Let him stand outside now. We bury him as the individual he insisted on being. Not as the elder he refused to become."

  "But he is not outside anymore," Abena said, her voice dropping, trembling slightly. "Death forces him back into the earth, into the lineage. You cannot keep him in exile now. And if you diminish these rites, you aren't teaching the grandchildren about responsibility. You are teaching them that love is conditional. That we only honor the dead who were useful to us."

  Kofi looked down at his brother's face. The skin was waxy, the mouth slightly open. For a moment, the rigor in Kofi's shoulders slumped.

  "Useful," Kofi repeated softly. "Is that what you think this is? Utility?" He looked up. "I loved him, Abena. I am his brother. I feel the loss in my own flesh. But if I allow the Kente to cover him, I betray the truth of what he did. Menkiti says the community defines the standard. If we lower the standard for him because we are sad, because he is blood, then the standard is a lie. If personhood is not difficult to achieve, it is worthless."

  "And if it is too difficult, if it requires the surrender of the self, then it is a cage," Abena said. "You say he didn't become a person. I say he became a different kind of person. One who said that the self is not just a node in a network. He possessed a core that was his own. If you deny that core now, you are saying that the community owns us completely. Body and soul. Even in the grave."

  "The community carries the body," Kofi said. "We are the pallbearers. We are the ones who will dig. If we carry him as a chief when he lived as a stranger, we break our backs under a weight he never helped us lift."

  "Then put the weight down," Abena said. "Carry him as a father. Not as a chief. Not as a stranger. As a man who had the capacity to be good, even if he chose to be alone. That capacity is the non-negotiable part. That is what Gyekye saw. If you don't acknowledge that, Uncle, then you aren't burying a person. You're disposing of a problem."

  Kofi was silent for a long time. The hum of the air conditioner seemed to grow louder. He looked at the Kente cloth folded on the side table, the vibrant gold and black patterns stark against the white walls.

  "If I allow the Kente," Kofi said finally, his voice rough, "I must speak the truth in the libation. I cannot say he was a pillar. I cannot say he was a guide."

  "Then don't," Abena said. "Say he was a man who walked his own path. Say he was difficult. Say he was my father. But do not tell the ancestors he was less than one of them. Because if he isn't one of them, then none of us are. We are just guests here, waiting to be judged."

  Kofi reached out and touched the Kente. His fingers traced the pattern. He did not unfold it, but he did not push it away.

  "The ancestors judge by the law of the land," Kofi said. "And the law of the land is that we are our brothers' keepers. He refused to keep."

  "And you," Abena said, stepping into his space, "are refusing to forgive. You hide behind Menkiti because it lets you be the judge without feeling the guilt of the executioner. But this is not a classroom, Uncle. This is a morgue in Kumasi. And the only thesis that matters is whether we can let him go."

  Kofi looked at her, really looked at her, seeing the exhaustion and the steel in her eyes. He saw the same stubborn will that had kept his brother alive in that lonely house for thirty years.

  "Bring the cloth," Kofi said softly.

  Abena exhaled, a sound that was half-sob, half-relief. She reached for the Kente.

  "But Abena," Kofi added, his hand stopping hers before she could lift it. "I will speak the truth in the libation. I will not lie to the spirits. If I cover him in gold, I must tell them why the gold is tarnished."

  Abena paused. She looked at her father's face, then at her uncle. She knew what that meant. The public shaming would continue, even under the silk. It would not be a clean victory. It would be a compromise that satisfied neither philosophy, but allowed the living to continue.

  "Speak your truth, Uncle," she said, her voice steady. "And I will speak mine. Let the ancestors decide which weight is heavier."

  Kofi nodded, once. He stepped back from the table. "Let us dress him."

  They unfolded the cloth together, the gold shimmering in the artificial light, covering the white, hiding the man but not the memory of what he had been. Neither of them spoke as they tucked the fabric around the shoulders, the silence between them as heavy and enduring as the earth waiting outside.
