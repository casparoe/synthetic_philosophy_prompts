      *   **Abena's Counter:** She needs to hit the ethical danger. If personhood is earned, who decides? If he wasn't a person, why bury him at all? Gyekye's idea: Intrinsic worth.
      *   **The Specifics (The "Thirty Years"):** Bring in the concrete details of the brother's life. Why did he isolate? Was it malice or principle?
      *   **The Climax/Turn:** Kofi argues that without community, there is no moral metric. Abena argues that without the individual, there is no community to speak of.
