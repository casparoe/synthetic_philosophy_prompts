          *   *Application to the dead brother:* He refused *abusua* (family) duties, didn't attend funerals, didn't contribute to nephews' school fees. He chose isolation. Therefore, he didn't *become*.
      *   **Gyekye (Abena):** Critiques Menkiti's "radical communitarianism." Argues for a "moderate" view. Humans have intrinsic dignity and moral agency *before* socialization. You can be a person and still be a bad person, or a dissenting person. To deny personhood is to deny the capacity for moral choice itself.
          *   *Application to the dead father:* He had the capacity to choose. His choice to dissent proves his agency. Denying him rites denies his humanity and the validity of his choice.

  3.  **Setting the Scene:**
