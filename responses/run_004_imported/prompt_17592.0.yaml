          *   **Abena:** Kofi's niece, deceased's daughter. Adheres to Kwame Gyekye's moderate communitarianism (Personhood has a core prior to community; natural capacities of reason/will exist independently). Believes her father deserves full rites because he was inherently a person, even if he dissented.
