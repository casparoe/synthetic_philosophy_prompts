      *   **Move 4 (Gareth):** Functional Explanation (G.A. Cohen/Marx). Institutions persist *because* of their function. No need for individual feedback loops.
          *   *Strength:* Explains stability/persistence well. Captures systemic logic.
          *   *Weakness:* Teleological risk (does the system have a goal?). Elster's critique: needs a "filter" or selection mechanism.
          *   *Physics Analogy:* Teleology is tricky in physics, but principle of least action or entropy maximization looks functional. However, without a mechanism (like natural selection in bio), it's suspicious.

      *   **Move 5 (Nadia):** Elster's Critique. Functional explanations need a selection mechanism (like individuals adapting).
          *   *Strength:* Closes the loop. Functionalism without a mechanism is magic.
          *   *Weakness:* Might oversimplify the mechanism (not always rational choice).
          *   *Physics Analogy:* Entropy increases *because* of microstate probability, not because the system "wants" disorder.

  3.  **Identify Hidden Assumptions/Omissions:**
      *   **Ontology vs. Methodology:** Are they arguing about what *exists* (only individuals exist) or how we *explain* (individual-level models are best)?
      *   **Rationality:** Nadia assumes individuals are belief/desire agents (rational choice leanings). Gareth assumes structural determination.
      *   **Time Scales:** Micro changes fast, macro changes slow.
      *   **Feedback Loops:** Both miss the recursive nature (downward causation). The macro structure *changes* the individuals (neuroplasticity, socialization), not just constrains them.

  4.  **Synthesize the "Fact of the Matter" vs. "Research Strategy" Question:**
