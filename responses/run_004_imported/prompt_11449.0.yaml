      *   **Task:** Evaluate a five-step debate between two grad students (Nadia = Methodological Individualist, Gareth = Methodological Holist) move-by-move. Identify strengths/weaknesses at each step. Flag hidden assumptions/omissions. Provide a general verdict on whether there's a "fact of the matter" or if it's a matter of research strategy (analogy to thermo vs. stat mech).
      *   **Tone:** Respectful, intellectually rigorous, acknowledging the user's background in physics while bridging to philosophy of social science. Avoid condescension; treat the user as a peer in scientific reasoning.

  2.  **Deconstruct the Debate (Move-by-Move Analysis):**

      *   **Move 1 (Nadia):** MI (Methodological Individualism). Explanation requires cashing out macro terms into individual beliefs/desires/actions. "Society believes" is shorthand. Cites Weber, Popper, Watkins.
          *   *Strength:* Prevents reification (treating abstractions as agents). Demands mechanisms.
          *   *Weakness:* Might be too demanding (impossible to trace every macro fact to micro origins practically). Ignores constraints imposed by structure.
          *   *Physics Analogy:* Insisting every thermodynamic law must be derived from particle trajectories *every time* you use it.

      *   **Move 2 (Gareth):** Holism/Structuralism. Durkheim's *Suicide*. Stable patterns exist despite individual variation. Individual facts (roles, prices) are already social.
          *   *Strength:* Empirical reality of macro-regularities. The "social facts" constrain individuals (you can't choose the price level alone).
          *   *Weakness:* Risks reification. Doesn't explain *how* the macro affects the micro (black box).
          *   *Physics Analogy:* Thermodynamics is valid regardless of the specific microstate. Phase transitions are real properties of the system, not just sums of particles.

      *   **Move 3 (Nadia):** Coleman's Boat / Schelling. Macro -> Micro -> Macro. Correlation isn't explanation. Needs mechanism. Schelling shows unintended consequences.
          *   *Strength:* Provides the *link*. Solves the "black box" problem. Schelling is a killer example of emergence from simple rules.
          *   *Weakness:* Schelling models are often toy models. Real human psychology is messier than checkerboard preferences.
