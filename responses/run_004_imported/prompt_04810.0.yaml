      *   **The Ask:** Wants the *intuition* for why they come apart, the *mechanical* reason the axiom swap changes the answer, and a *philosophical* evaluation of which is more defensible (fairness-wise). Explicitly rejects a shallow "here are the axioms" answer. Wants to know *why a person should care*.

  2.  **Deconstruct the Core Conflict (NBS vs. KSS):**
      *   *Nash:* Maximizes $(u_1 - d_1)(u_2 - d_2)$. Geometrically, finds the tangent point of a hyperbola to the Pareto frontier.
      *   *KSS:* Connects disagreement point $d$ to ideal point $a$ (utopia point). Finds intersection with Pareto frontier.
      *   *The Axioms:*
          *   NBS: Pareto Efficiency, Symmetry, Invariance to Affine Transformations, **IIA**.
          *   KSS: Pareto Efficiency, Symmetry, Invariance to Affine Transformations, **Individual Monotonicity**.
      *   *The Conflict:* IIA says if you remove options *not* chosen, the choice shouldn't change. Monotonicity says if the set of feasible options expands in a way that helps one person (without hurting the other's max), that person shouldn't end up worse off (or at least should gain something).

  3.  **Address the "Mechanical" Why (The Geometry):**
      *   Need to visualize the bargaining set.
      *   *Nash:* Looks at the *local* shape of the frontier near the solution. It cares about curvature. If you chop off the top right corner of the feasible set (an option neither party would have chosen anyway), the curvature changes, and the tangent point shifts.
      *   *KSS:* Looks at the *global* extremes (the ideal point). It draws a straight line. If you expand the set to increase Player 1's maximum possible utility, the ideal point moves right. The line pivots. The intersection moves up/right.
      *   *The Specific Counter-Example:* The "Shrinking Pie" or "Removed Option" case.
          *   Scenario: A set $S$. Nash picks $x$.
          *   Modify to $S' \subset S$. The removed options were "better" for Player 1 but not chosen by Nash.
          *   Under IIA (Nash): Since the chosen point $x$ is still available in $S'$, Nash *must* still pick $x$.
          *   Under Monotonicity (KSS): If the removal of options lowers Player 1's *maximum possible* payoff (their ideal point), KSS adjusts the solution to reflect this reduced leverage, even if the original point was available. Wait, actually, the classic critique of IIA is the *expansion* case where IIA forces a static result despite changed leverage. Let's refine this.
