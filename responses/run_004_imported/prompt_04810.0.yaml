  5.  **Evaluate Defensibility (Fairness):**
      *   Is KSS "better"? Not necessarily. It trades IIA for Monotonicity.
      *   *Problem with KSS:* It can be sensitive to "dummy" alternatives that define the ideal point but are never feasible. It ignores the *curvature* of the frontier (risk aversion implications). Nash incorporates risk aversion (via curvature/utility functions). KSS is more rigid.
      *   *Problem with Nash:* The IIA violation feels like ignoring context/leverage.
      *   *Verdict:* It depends on what "fairness" means. Is fairness about consistent procedure (Nash) or proportional recognition of potential (KSS)?
      *   *Philosophical Stake:* Contractualism (Nash/Rawls-adjacent) vs. Entitlement/Contribution (KSS).

