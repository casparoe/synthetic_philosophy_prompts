          *   *Correction:* The standard critique of IIA in this context is that it ignores *bargaining power* changes implied by the shape of the set. If I remove an option that was great for you but bad for me, your threat power drops. Nash ignores this if the original solution is still feasible. KSS captures it because the "ideal point" moves.

  4.  **Address the Philosophical "Why Care":**
      *   *Nash (IIA):* Focuses on *consistency* and *local efficiency*. It treats the bargaining problem as a static optimization. It assumes rationality implies that if you wouldn't have picked option Z anyway, removing Z shouldn't change your mind about X vs Y. It's about internal consistency of choice.
      *   *KSS (Monotonicity):* Focuses on *leverage* and *opportunity*. It treats the bargaining problem as a reflection of potential. If your ceiling gets raised, your floor should rise too. It's about the *structure of opportunity* defining fairness.
      *   *Telescope Analogy:* This is gold. Use the user's background.
