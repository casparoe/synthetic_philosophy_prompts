      *   **Tone:** Academic but conversational (coffee shop vibe), respectful but rigorous.
      *   **Context:** The user is a retired research chemist new to philosophy of religion, appreciative of Lewis's analytical style.

  2.  **Deconstruct David Lewis's Argument (Mental Sandbox):**
