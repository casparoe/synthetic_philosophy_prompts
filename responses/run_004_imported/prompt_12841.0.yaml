      *   **The Deterrence vs. Retribution Clash:** Jordan needs to pin Alex down. "You're only making this work because you stopped caring about *justice* and started caring about *outcomes*." Alex needs to defend the coherence.
      *   **The Ending:** Metaphysics of Desert vs. Semantics. Is "desert" a real property or just a label we put on certain treatments?

  4.  **Writing the Dialogue (Iterative Process):**

