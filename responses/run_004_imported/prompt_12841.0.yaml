      *   *Lewis's Move:* Distinguish between the *punishment* (the suffering imposed) and the *penalty* (the liability). Or, shift the justification of punishment from retribution (desert) to deterrence/consequence.
      *   *The Objection:* If punishment is essentially retributive (based on guilt), transferring it destroys its nature. If it's consequentialist (deterrence), transfer might make sense, but does it fit Christian doctrine?
      *   *Key Distinction:* Punishment vs. Penalty. Punishment implies guilt. Penalty implies a cost attached to an action.

  3.  **Drafting - Section by Section:**

