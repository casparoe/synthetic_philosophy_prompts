answer: |-
  This is a fantastic question. You've hit on one of the subtlest and most powerful concepts in introductory game theory. Most classes stop at pure strategy dominance because the math is easier, but you are absolutely right: **a pure strategy can be "trash" even if no single other strategy is better than it, provided a *combination* of other strategies is better.**

  This happens because mixing strategies allows you to **hedge**. You can average out the risks of two "extreme" strategies to create a "super-strategy" that beats a "mediocre" strategy in every scenario.

  Here is a custom 3x2 game designed specifically to show this.

  ### The Game Matrix

  **Player 1 (Row)** chooses Top (T), Middle (M), or Bottom (B).
  **Player 2 (Column)** chooses Left (L) or Right (R).
  Payoffs are listed as **(Row, Column)**.

  | Row \ Col | **Left (L)** | **Right (R)** |
  | :--- | :---: | :---: |
  | **Top (T)** | 0, 1 | 4, 0 |
  | **Middle (M)** | **1, 0** | **1, 1** |
  | **Bottom (B)** | 4, 1 | 0, 0 |

  ---

  ### Step 1: Try Pure Strategy Elimination (It Fails)

  Let's look at Player 1's strategies. We want to see if **Middle (M)** is dominated.

  *   **Compare M vs. Top (T):**
      *   If Col plays **L**: M gets **1**, T gets **0**. (M is better!)
      *   If Col plays **R**: M gets **1**, T gets **4**. (T is better!)
      *   *Result:* T does **not** dominate M.

  *   **Compare M vs. Bottom (B):**
      *   If Col plays **L**: M gets **1**, B gets **4**. (B is better!)
      *   If Col plays **R**: M gets **1**, B gets **0**. (M is better!)
      *   *Result:* B does **not** dominate M.

  **The Problem:** If you only look at pure strategies, **M looks safe.** It beats T in one column and beats B in the other. You cannot cross it out. Consequently, Player 2 also has no dominated strategies initially (because against M, Player 2 prefers R, but against T and B, Player 2 prefers L).

  The game is "stuck." Standard IEDS stops here.

  ---

  ### Step 2: The Mixed Strategy Domination

  Now, let's look at Player 1 playing a **mixed strategy**. Imagine Player 1 flips a coin: **50% chance of Top, 50% chance of Bottom.** Let's call this mix **$\sigma_{TB}$**.

  We calculate the *expected payoff* of this mix against Player 2's choices and compare it to playing **M** for sure.

  **1. If Player 2 plays Left (L):**
  *   Playing **M** gives Row a payoff of **1**.
  *   Playing **$\sigma_{TB}$** (50/50 T & B):
      *   50% chance of T (payoff 0) + 50% chance of B (payoff 4).
      *   Average: $(0.5 \times 0) + (0.5 \times 4) = \mathbf{2}$.
  *   **2 > 1**, so the Mix beats M.

  **2. If Player 2 plays Right (R):**
  *   Playing **M** gives Row a payoff of **1**.
  *   Playing **$\sigma_{TB}$** (50/50 T & B):
      *   50% chance of T (payoff 4) + 50% chance of B (payoff 0).
      *   Average: $(0.5 \times 4) + (0.5 \times 0) = \mathbf{2}$.
  *   **2 > 1**, so the Mix beats M.

  **Conclusion:** Even though neither T nor B beats M on its own, **the average of T and B beats M in every single case.** Therefore, a rational Player 1 should **never** play M. We can eliminate it.

  ---

  ### Step 3: Solving the Rest of the Game

  Now that we've used mixed dominance to cross out **Middle (M)**, the game shrinks:

  | Row \ Col | **Left (L)** | **Right (R)** |
  | :--- | :---: | :---: |
  | **Top (T)** | 0, 1 | 4, 0 |
  | **Bottom (B)** | 4, 1 | 0, 0 |

  **Now look at Player 2:**
  *   If Row plays **T**: Col prefers **L** (1 > 0).
  *   If Row plays **B**: Col prefers **L** (1 > 0).
  *   Suddenly, **Left (L)** strictly dominates Right (R)! (This wasn't true before because M made R look good).

  We eliminate **Right (R)**.

  **Now look at Player 1 (again):**
  *   Player 1 knows Player 2 will play **L**.
  *   Row compares **T** (payoff 0) vs **B** (payoff 4).
  *   Row chooses **Bottom (B)**.

  **Final Solution:** **(Bottom, Left)**.

  ---

  ### The Intuition: Why does the mix win?

  This is the part that usually messes with people's heads, so here is the non-math explanation.

  Think of **Top** and **Bottom** as "High Risk, High Reward" strategies.
  *   **Top** is great if they go Right, terrible if they go Left.
  *   **Bottom** is great if they go Left, terrible if they go Right.

  Think of **Middle** as a "Safe, Mediocre" strategy.
  *   **Middle** guarantees you a 1, no matter what. It's boring, but it's safe.

  **Why the Mix wins:**
  When you mix Top and Bottom (50/50), you are **diversifying your portfolio**. You are canceling out the risk.
  *   If the opponent goes Left, your Bottom half wins big (4), covering the loss on your Top half (0). Average = 2.
  *   If the opponent goes Right, your Top half wins big (4), covering the loss on your Bottom half (0). Average = 2.

  By mixing the extremes, you create an **average payoff of 2** in both scenarios.
  The "Safe" strategy (Middle) only gives you a **payoff of 1**.

  So, Middle isn't actually "safe." It's **consistently worse than the average of the risky options.** In game theory terms, Middle is *redundant*. You can get a better result by just randomizing between the extremes than you can by playing the middle ground.

  ### Summary
  1.  **Pure Dominance:** Checks if Strategy A > Strategy B. (Failed here).
  2.  **Mixed Dominance:** Checks if Strategy A > (0.5 * Strategy B + 0.5 * Strategy C). (Worked here!).
  3.  **Result:** You can eliminate strategies that look "safe" if they are actually just "consistently mediocre" compared to a diversified mix of other options.

  You found a great rabbit hole. This concept is basically the foundation of why diversification works in finance, too!
