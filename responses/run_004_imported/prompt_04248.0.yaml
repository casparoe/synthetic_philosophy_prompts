      *   *Is benchmarking marketing?* Sometimes, yes. But core research uses benchmarks to track progress. Distinguish between corporate press releases and academic eval papers.
      *   *What about the "Math" aspect?* There is no math proof. Universal Approximation Theorem says they can approximate functions, but doesn't speak to semantics.

