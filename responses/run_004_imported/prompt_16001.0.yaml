answer: |-
  **MEMORANDUM**

  **TO:** Data & Equity Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Dropout-Risk Dashboard Adoption

  **RECOMMENDATION**
  **Adopt with Conditions.**

  I recommend we approve the dashboard for a pilot phase only, contingent on three specific technical and ethical constraints. We cannot adopt the tool in its current state because the demo proved the output is too volatile to be reliable and too reliant on demographics to be equitable.

  **CONTEXT**
  During the vendor demo, we observed a single student receive three drastically different risk scores based on the comparison cohort:
  1.  **34% Risk:** Based on nationwide income/race brackets.
  2.  **9% Risk:** Based on our district's last 5 years.
  3.  **61% Risk:** Based on exact academic patterns (GPA/attendance/failures), but with a sample size of only ~40 students.

  This variance creates a critical dilemma. If we choose the 34% model, we are profiling students based on identity rather than behavior. If we choose the 61% model, we are acting on statistically insignificant data (N=40) that could trigger false alarms.

  **PROPOSED CONDITIONS FOR ADOPTION**
  To move forward, the vendor must configure the dashboard to meet these three requirements before deployment:

  1.  **Exclude Protected Demographics from Risk Calculations:**
      The algorithm cannot use race or ethnicity as predictive variables. Socioeconomic status (income) may only be used to flag *resource eligibility*, not *dropout risk*. A student's risk score must be derived from their academic and behavioral engagement (attendance, course failure, discipline), not their background. Using income/race to predict failure codifies systemic bias and risks becoming a self-fulfilling prophecy.

  2.  **Enforce Minimum Cohort Sizes for "Pattern Matching":**
      The "exact pattern" score (the 61% in the demo) is valuable because it reflects current behavior, but a sample size of 40 is statistically noisy. The system must suppress specific risk scores if the comparison group falls below a threshold of **N=100**. Below that threshold, the dashboard should display "Insufficient Data for Pattern Match" rather than a high-risk percentage, preventing counselors from chasing false positives.

  3.  **Mandatory "Driver" Transparency:**
      Counselors cannot see only a final number. The interface must display the **top three contributing factors** for that specific score (e.g., "Score high due to: 1. Attendance drop in Q2, 2. Failure in Algebra, 3. No change in income"). If a counselor cannot see *why* the score changed, they cannot intervene effectively.

  **CONSIDERATION OF OPPOSING VIEWS**
  I understand the argument from committee members who favor the "Narrowest Match" (the 61% score), despite the small sample size. The moral imperative here is clear: **That student is currently failing.** If we wait for a larger sample size to validate the risk, we might ignore a student who is actively drowning academically right now. Proponents argue that specificity saves lives, even if the statistics are imperfect.

  Similarly, I hear the argument for the broader demographic models (the 34% score). Proponents argue that systemic realities exist; students from low-income backgrounds *do* face higher statistical hurdles, and ignoring that data blinds us to structural gaps.

  **However, both approaches carry unacceptable risks in their current form.**
  Acting on the 61% score with N=40 risks eroding trust in the system; if counselors intervene with 10 "high risk" students and only 1 was actually at risk, they will stop using the tool entirely. Conversely, using the 34% demographic model punishes students for circumstances outside their control, potentially labeling a high-performing low-income student as "at-risk" regardless of their actual engagement.

  **CONCLUSION**
  We need a tool that identifies academic distress without profiling identity or relying on shaky data. By excluding demographic predictors, enforcing minimum sample sizes, and requiring transparency on score drivers, we can use this dashboard to support students rather than sort them.

  I move we adopt the dashboard contingent on the vendor meeting these three conditions within 60 days.
