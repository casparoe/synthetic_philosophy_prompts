answer: |-
  This is not petty at all. It is a genuinely complex interpersonal dilemma that touches on ethics, communication, and the psychology of addiction. You are asking a profound question: **Does the validity of a message depend on the virtue of the messenger?**

  The short answer is: **Factually, no. Relationally, yes.**

  Here is the breakdown of why your friend snapped, why your ex and roommate are both partially right but missing the nuance, and how to distinguish between being *right* and being the *right person* to say it.

  ### 1. The Distinction Is Coherent
  You asked if there is a real difference between "being right about something" and "being the right person to point it out." **Yes, there is.**

  *   **Being Right:** This is about objective truth. "Smoking damages lungs" is a fact. You are correct. If you shouted this through a megaphone on a street corner, the statement would still be true.
  *   **Being the Right Person:** This is about *reception* and *authority*. In a friendship, advice is not a data transfer; it is an emotional transaction. For advice to be received, the listener must trust the messenger's intent and feel that the messenger understands their position.

  Your friend didn't say, "You are wrong about the health risks." She said, "You don't get to **lecture** me." She is objecting to the dynamic, not the data.

  ### 2. Why Your Friend Snapped (The "Lecture" vs. The "Concern")
  There is a massive difference between expressing concern and moralizing.

  *   **Concern:** "I care about you, and I worry because I know how hard it is to quit." (This comes from a place of shared vulnerability.)
  *   **Lecture:** "You are going to wreck your lungs like I almost did, you need to stop." (This comes from a place of superiority.)

  By bringing it up **every time you hang out**, you have inadvertently shifted from "supportive friend" to "compliance officer." When you do that, the conversation stops being about her health and starts being about *your* anxiety regarding her health. She likely already knows smoking is bad. She doesn't need information; she needs autonomy.

  ### 3. The Hypocrisy Factor (Smoking + Vaping)
  Your roommate's advice ("quit nicotine yourself first") is a bit extreme. You don't need to be perfect to care about someone else. However, your friend has a point about the *nature* of your experience.

  You are framing your past smoking as a conquered battle ("I did the hard thing, why can't you?"), but your current vaping signals that the war isn't actually over for you; you're just fighting on different terrain.

  When you lecture her while still vaping, it doesn't sound like "I made it to the other side, come join me." It sounds like "My way of coping is acceptable, but yours isn't." That feels judgmental, not supportive. It undermines your credibility not because you aren't perfect, but because it suggests you haven't fully made peace with your own relationship with nicotine.

  ### 4. The "Sunk Cost" of Your Effort
  You mentioned quitting was one of the hardest things you've ever done. That is a huge achievement, and you should be proud. But sometimes, when we struggle immensely to overcome something, seeing someone else casually walk back into it feels like an insult to our own struggle.

  Part of your intensity might be your own brain trying to validate how hard your quit was. If she can smoke and be fine, does that minimize your sacrifice? Subconsciously, you might be pushing her to quit to validate your own suffering. She may have sensed that, which fuels the resentment.

  ### The Verdict
  Your ex is wrong. "Keep pushing" will likely damage the friendship and make her smoke more (stress often triggers relapse).
  Your roommate is partially right. Your current nicotine use does complicate the moral high ground, but you don't need to be perfect to care.

  **The reality is this:** You have the right to express concern *once*, clearly and lovingly. You do not have the right to nag a grown adult about their bodily autonomy every time you see them.

  ### How to Fix It
  If you want to save the friendship and actually be helpful (rather than just being "right"), try this:

  1.  **The Reset Conversation:** Tell her, "I've been thinking about what you said. You were right. I was lecturing you, and that wasn't my place. I'm proud of my quit, but I'm still managing nicotine with vaping, and I don't own your health choices. I'm sorry I made you feel judged."
  2.  **Stop Bringing It Up:** Unless she asks for help, do not mention the cigarettes again. Let her miss you as a fun friend, not a nagging parent.
  3.  **Support, Don't Preach:** If she brings it up, listen. Ask, "How are you feeling about it?" instead of saying, "You need to quit."
  4.  **Reflect on the Vaping:** Do this for *you*, not her. If you feel your vaping undermines your ability to support her, consider addressing that on your own timeline.

  **Summary:** You are right about the cigarettes. But in a friendship, being right is less important than being connected. Right now, your insistence on being right is breaking the connection. Backing off doesn't mean you agree with her smoking; it means you respect her enough to let her make her own mistakes.
