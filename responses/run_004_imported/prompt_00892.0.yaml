answer: |-
  The short answer is **no**. A logician of that period, particularly one conversant with Gödel's work, would not have claimed this as a "genuine mathematical proof." To do so would be to commit a category error that was well understood at the time and remains understood today.

  If your protagonist states this flatly as a proven theorem, knowledgeable readers (historians of mathematics, philosophers, computer scientists) will likely be pulled out of the narrative.

  Here is the substantive breakdown of why, along with suggestions on how to preserve the dramatic weight of the scene without sacrificing historical accuracy.

  ### 1. Theorem vs. Thesis: The Category Error
  The equivalence of Church's $\lambda$-calculus, Gödel's recursive functions, and Turing's machines **is** a theorem. It is a mathematical fact that these three formal systems define the exact same class of functions. Your protagonist can rightly declare *that* convergence settled.

  However, the claim that "effectively calculable" *means* "computable by a Turing machine" is the **Church-Turing Thesis**. It cannot be a theorem because "effectively calculable" is not a mathematical definition; it is an **intuitive, pre-formal notion**.

  *   **Theorem:** Formal System A = Formal System B. (Both are precise.)
  *   **Thesis:** Intuitive Concept C = Formal System A. (One is vague, one is precise.)

  You cannot mathematically prove that a formal definition captures an intuition perfectly; you can only argue for it persuasively. In 1936–1939, the logicians knew this. They viewed the Thesis as a definition or a hypothesis that was overwhelmingly supported by evidence, not a derived truth.

  ### 2. Why Gödel Actually Changed His Mind
  Your character mentions Gödel coming around, which is historically accurate, but the *reason* is crucial for your scene.

  Gödel initially rejected Church's proposal (in 1934) because $\lambda$-calculus felt arbitrary. He didn't see why it *had* to capture all calculation. He accepted the thesis later, but **not simply because it matched Turing's machines.**

  He accepted it because Turing's paper provided a **conceptual analysis of the human computer.** Turing didn't just write down equations; he argued that a human calculating a number is limited by:
  1.  A finite number of symbols they can distinguish.
  2.  A finite number of "states of mind" they can hold.
  3.  A linear medium (paper/tape) they can scan.

  Turing argued that *any* effective procedure must obey these physical/mental limitations. Gödel later wrote (in 1946, reflecting on the period) that Turing's analysis was "unquestionably adequate" and that this was the first time a precise epistemological analysis of "mechanical procedure" had been achieved.

  **The Drama:** The conviction didn't come from the *convergence* of three systems (that's just coincidence hunting); it came from Turing's *argument* that no human calculator could ever do more than his machine.

  ### 3. Contemporary Voices (1936–1939)
  *   **Alonzo Church:** Proposed it as a "definition" (1936). He was bold, but he framed it as identifying the intuitive notion with the formal one for the sake of clarity, not proving they were ontologically identical.
  *   **Emil Post:** Called it a "working hypothesis" (1936). He was very aware of the psychological component.
  *   **Alan Turing:** Was modest. He argued his machines captured what a human computer does, implying the equivalence, but didn't claim a mathematical proof of the intuition.
  *   **Kurt Gödel:** As noted, remained philosophically cautious for years, though pragmatically convinced by 1937–1938.

  ### 4. How to Fix the Dialogue
  You can keep the protagonist's confidence and the scene's pivotal nature without making her sound like she doesn't understand logic. She should be excited about the **adequacy of the analysis**, not a non-existent proof.

  **Option A: The Enthusiastic but Accurate Logician**
  > "It is settled. Church, Gödel, Turing—three different paths, all leading to the same boundary. And Turing... Turing showed us *why*. He showed that any calculation a human mind can perform, his machine can mimic. There is no gap left. 'Effectively calculable' *is* Turing computable. Not by proof, no—but by a truth too plain to deny."

  **Option B: The Focus on Human Limitation (More Gödelian)**
  > "Gödel rejected Church because $\lambda$-calculus felt like a guess. But he cannot reject Turing. Turing didn't guess; he analyzed the human mind itself. Finite symbols, finite states, linear tape. If you accept that a man is not a god, you must accept the machine. The thesis isn't a theorem, but it is the end of the argument."

  **Option C: If you need her to be overconfident (Character Flaw)**
  > "It's a theorem, plain and simple. The convergence proves it. 'Effectively calculable' is just 'Turing computable' by another name. The question is dead."
  > *(This allows an older, wiser character to correct her later, or shows her brilliance is tempered by youthful dogmatism.)*

  ### Summary Recommendation
  Do not have her call it a "mathematical proof" of the equivalence between intuition and formalism. That distinction was the very heart of the logical discourse of the 1930s.

  Instead, have her declare that the **argument is settled** because Turing provided the **philosophical justification** that Church lacked. The convergence of the three systems is the *evidence*, but Turing's analysis of the human computer is the *proof* (in the philosophical sense) that convinced Gödel. This preserves the historical gravity while keeping your character's voice authoritative.
