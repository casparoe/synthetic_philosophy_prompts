      *Key reference to keep in mind (mentally):* The "Money Pump for Preferential Gaps" by Johan Gustafsson. He argues the status quo defense fails. I need to argue *against* Gustafsson (or offer the nuance he misses) to support the user. The nuance is the distinction between *local* and *global* rationality, and the legitimacy of procedural constraints.

      *Wait, one more thing:* The prompt asks to argue *for* the position. I should not play devil's advocate too much. I need to make the best case for the user's intuition.

