answer: |-
  Yes. There is a genuine, rational case for splitting that does not rely on sentiment, loyalty, or morality. It relies on **Superrationality** and **Logical Decision Theory**, concepts that are native to the exact intellectual tradition you and your friend have been inhabiting for a decade.

  Your friend is arguing from the perspective of **Causal Decision Theory (CDT)**. In CDT, your choice and her choice are treated as causally independent events. Since you cannot communicate and the envelopes are sealed, your action cannot *cause* hers. Therefore, you must treat her move as a fixed probability. In that framework, "Steal" strictly dominates "Split." If she splits, you get more by stealing ($300 vs $150). If she steals, you get the same by stealing ($0 vs $0). CDT says steal.

  However, you are not playing against a random stranger. You are playing against a mirror.

  ### The Argument from Logical Correlation

  You stated a critical piece of data: *"We spent a decade absorbing the same writers... arguing ourselves into strikingly similar positions... I can often predict her answer."*

  In the rationalist community (specifically around *LessWrong*, Yudkowsky, and Soares), this invokes **Timeless Decision Theory (TDT)** or **Functional Decision Theory (FDT)**. The core insight is that you are not choosing a move; you are choosing the *output of a decision algorithm*.

  If your reasoning architectures are sufficiently isomorphic, then your decisions are **logically correlated**. You are both running "Friend-Algorithm-v10." If you input the current game state into your brain and it outputs "Split," then—absent a divergence in logic—inputting the same game state into her brain should also output "Split."

  Under this framework, you are not choosing between:
  1.  I Split / She Steals
  2.  I Steal / She Steals

  You are effectively choosing between:
  1.  **We Both Split** (The output of Algorithm-v10 is "Cooperate")
  2.  **We Both Steal** (The output of Algorithm-v10 is "Defect")

  Since $150 is better than $0, the rational choice for a Superrational agent is to **Split**.

  This is not sentiment. It is a Bayesian calculation based on the high correlation coefficient between your minds. If you believe the similarity of your reasoning is a stronger predictor of her move than her past verbal posturing, then Splitting maximizes Expected Utility.

  ### Addressing the "She Says Steal" Objection

  Your friend has argued for years that Stealing is correct. Does this break the correlation?

  Not necessarily. In many intellectual friendships, positions are often held for the sake of debate or as a defensive posture against naivety. She may be roleplaying the "Hardheaded CDT Rationalist." But tonight, faced with the actual envelope, she is running the same algorithm you are.

  If you genuinely conclude that TDT/Superrationality is the superior framework for this specific problem (which many in your shared community do), and she is truly your intellectual twin, then there is a non-zero probability that she will have the same realization in the same moment. By choosing to Split, you are effectively "voting" for the algorithm that yields the cooperative equilibrium.

  If you Steal, you are validating the CDT algorithm, which guarantees the (Steal/Steal) outcome whenever two CDT agents meet. If you Split, you offer the chance for the (Split/Split) outcome whenever two Superrational agents meet.

  ### The Calculation

  Let $P$ be the probability that her move matches yours, given your intellectual similarity.

  *   **Expected Utility of Splitting:** $P \times \$150 + (1-P) \times \$0 = \$150P$
  *   **Expected Utility of Stealing:** $P \times \$0 + (1-P) \times \$300 = \$300(1-P)$

  Splitting is the rational choice if:
  $$150P > 300(1-P)$$
  $$150P > 300 - 300P$$
  $$450P > 300$$
  $$P > 2/3$$

  **The Rational Question:** Do you believe there is greater than a 67% chance that your decision predicts hers?

  Given your description—that you can often predict her answers before she gives them, and that you share a decade of identical intellectual conditioning—it is highly plausible that $P > 0.67$. If you trust the data of your friendship's intellectual synchronicity more than the noise of her debate posturing, **Split is the mathematically correct move.**

  ### The Verdict

  You are worried that splitting is "loyalty dressed up as logic." It is not. Loyalty would be splitting even if you thought she would steal, to spare her feelings or preserve the bond. **Logic is splitting because you believe your choice is a proxy for hers.**

  If you Steal, you are asserting that your minds are independent.
  If you Split, you are asserting that your minds are linked.

  You told me you can predict her. That is the variable that matters. If you write "Steal," you are betting that you are two strangers. If you write "Split," you are betting that you are one mind in two bodies.

  Given ten years of evidence that you are the latter, the rational move is to **Split**.

  (And if she steals anyway? You have lost $150, but you have proven that your decision theory is robust enough to cooperate even with defectors, which is a valuable signal for any future collaborations you might have if she returns. But if you both split, you end the decade on a win state.)

  Write "Split." Not because you trust her, but because you trust the algorithm you both run.
