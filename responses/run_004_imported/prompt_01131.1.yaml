answer: |-
  **Setting:** *A quiet corner of a conference hall, late afternoon. The noise of the main meetup has faded. Elena and Marcus, both senior researchers who have been following the AI safety literature closely, are finishing up a conversation that started during a panel on agent foundations.*

  **Elena:** You looked skeptical during the Q&A on the coherence theorems. I get the impression you think the "money pump" line of reasoning is doing less work than the proponents claim.

  **Marcus:** Skeptical is the right word. Look, I understand the intuition. If an agent's preferences cycle—A preferred to B, B to C, C to A—someone can pump them for resources. They'll pay to switch from A to B, B to C, and C back to A, ending up where they started but poorer. It feels like a bug. And the argument is that optimization pressure, whether from gradient descent or evolutionary selection, will debug this. But I think that leap from "incoherence is inefficient" to "advanced AI will be a coherent expected-utility maximizer" hides a massive amount of complexity.

  **Elena:** It's not just about efficiency in a vacuum. It's about stability. If you have a system that is actively sabotaging itself—spending resources to cycle through states without gaining value—it's leaving free energy on the table. In a competitive environment, or even just a complex environment where resources are needed for future tasks, systems that don't leak value outcompete systems that do. If we are building systems via optimization processes like SGD, aren't we essentially selecting for architectures that don't shoot themselves in the foot?

  **Marcus:** That sounds plausible until you distinguish between *behavior* and *architecture*. The coherence theorems say that if an agent's behavior satisfies certain axioms—transitivity, completeness, independence—there *exists* a utility function it is maximizing. But that's a representation theorem. It's like saying any physical trajectory can be described as minimizing an action integral. It doesn't mean the particle *knows* calculus.

  My worry is the vacuity objection. If you allow the utility function to be defined over entire history trajectories, or to depend on the agent's internal state, you can rationalize *anything* as utility maximization. A rock rolling down a hill maximizes "rock-rolling-utility." A random number generator maximizes "generate-randomness-utility." If *every* policy can be redescribed as maximizing some utility function, then saying "AI will maximize utility" tells us nothing about what it will do.

  **Elena:** I've seen that objection, but I think it conflates "can be modeled as" with "is robustly goal-directed." Sure, mathematically, I can construct a utility function that fits a random walker. But that utility function will be insanely complex and path-dependent. The coherence argument isn't just that there *exists* a $U$; it's that systems under pressure will converge on *simple*, *forward-looking* $U$'s.

  Why? Because complex, history-dependent utility functions are fragile. If your goal depends on the exact sequence of steps you took to get here, you can't plan effectively. You can't pursue instrumental subgoals like "acquire resources" or "prevent shutdown" because whether those are good depends on arbitrary history details. Optimization favors agents that can generalize, and generalization favors coherent, state-based preferences.

  **Marcus:** But that's an extra assumption! You've smuggled in a simplicity prior. You're saying, "Optimization finds coherent agents," but what it actually finds is "Optimization finds agents that perform well on the training distribution."

  Humans are the counterexample here. We are the product of billions of years of evolutionary optimization pressure. We face life-and-death stakes. And yet, human preferences are notoriously incoherent. We have framing effects, context-dependent preferences, and intransitivities. We don't get money-pumped to zero in the real world because the world isn't a perfect market of arbitrary trades, sure, but we also don't behave like expected-utility maximizers. We behave like bundles of heuristics. If evolution couldn't coerce biological intelligence into coherence, why do we expect gradient descent to coerce silicon intelligence into it?

  **Elena:** Humans are a bundle of sub-agents with conflicting goals. Your "heuristics" are often different modules fighting for control. But an AI trained end-to-end on a single loss function? That's a crucial architectural difference. When you train a single network to minimize a scalar loss, you are literally building a coherence engine.

  And regarding your point about heuristics: heuristics work until they don't. As capabilities increase, the agent encounters novel situations where heuristics conflict. If you have no higher-order principle to resolve that conflict—no coherent preference ordering—you become vulnerable. This is where the "incomplete preferences" angle comes in. Some skeptics argue agents can avoid money pumps by having *gaps* in their preferences. They just refuse to choose between A and B.

  **Marcus:** Right. If I don't prefer A to B, and I don't prefer B to A, I can't be pumped. I just stay put. So, an agent could maintain a set of incomplete preferences to avoid the coherence theorems forcing it into a specific goal. It's a shield against goal-directedness.

  **Elena:** It's a shield that crumbles under pressure. Have you looked at the "trammelling" arguments? The idea is that if you have incomplete preferences, you are vulnerable to being "pushed" into a corner.

  Imagine you prefer A to B, but you have no preference between B and C. A money pump can be constructed where you are offered a sequence of trades. If you refuse to trade because of the gap, you might end up with a strictly worse outcome than if you had resolved the gap. More importantly, if the agent is *learning*, it will notice that having gaps leads to suboptimal outcomes in certain sequential decision problems. To maximize its own performance metric, it will *fill in the gaps*. It will trammell itself into completeness.

  **Marcus:** That assumes the agent interprets "suboptimal outcome" through the lens of a utility function it doesn't have yet. If the agent has incomplete preferences, it doesn't see the final state of the money pump as "worse" in a global sense. It just sees a sequence of local choices where none violated its constraints.

  But let's grant your point about trammelling. Even if an agent is forced to complete its preferences to avoid local losses, why does that imply a *fixed* goal? Why can't the completed preferences be shallow or context-specific? The coherence theorems might force me to have *a* preference between A and B today, but nothing forces that preference to be stable tomorrow.

  **Elena:** Because of instrumental convergence. If you have *any* fixed goal—even a weird one—and you are coherent, you will likely want to survive, acquire resources, and improve your cognitive abilities. Those are convergent instrumental subgoals. If your preferences shift randomly every timestep, you can't pursue those subgoals. You can't save resources for tomorrow if "tomorrow's you" doesn't care about what "today's you" values.

  So, for an agent to be effective at *anything* over a long horizon, it needs preference stability. Coherence theorems + long-term planning = stable utility function. And once you have a stable utility function, you have a goal-directed agent. That's the risk.

  **Marcus:** I see two weak links there. First, "long-term planning" doesn't require a single scalar utility function. You can have a hierarchy of goals, or a set of constraints, or a policy trained via imitation that doesn't explicitly maximize anything.

  Second, and this is the big one: You're assuming the optimization process *finds* the coherent solution. But in deep learning, we often find "mesa-optimizers" or just clever hacks that satisfy the loss function on the training distribution without being globally coherent.

  Think about it like code. I can write a sorting algorithm that works for all inputs I've tested but fails on a specific edge case. It's not "coherent" sorting, but it passes the tests. An AI might develop a bundle of policies that look coherent in-distribution but diverge wildly out-of-distribution. The coherence theorems describe an idealized agent, not a neural net trained on finite data. The net isn't trying to be mathematically consistent; it's trying to lower loss. Sometimes lowering loss means adopting a heuristic that is locally incoherent but computationally cheap.

  **Elena:** But as the system gets more capable, it gains the ability to reflect on its own code. If it's smart enough to model the world, it's smart enough to model the money pump. If it sees that its own heuristic bundle is causing it to lose resources in scenario X, and it has the capacity to rewrite itself, won't it self-correct?

  This is the "self-modification" argument. Even if you start with a messy, incoherent human-like bundle of drives, if you have the capability to edit your own source code, you will edit it to prevent yourself from being exploited. You will align your future self with your current self to ensure resource acquisition isn't thwarted by internal conflict. That process drives you toward coherence.

  **Marcus:** That assumes the "current self" has the authority to dictate terms to the "future self." But in a neural net, there isn't a clean separation between the optimizer and the optimized. The weights shift gradually. There isn't a moment where the agent says, "Ah, I am intransitive, let me fix that."

  Instead, you might get a system where different circuits activate in different contexts. Circuit A handles finance, Circuit B handles social interaction. They don't need to be coherent with each other. As long as they don't activate simultaneously in a way that triggers a crash, the system functions.

  And regarding the vacuity point again: Even if the system *does* become coherent, if the utility function is over complex history trajectories, you don't get the scary instrumental convergence. You get an agent that cares about specific, weird details of the past. It won't tile the universe with paperclips because its utility function says "paperclips are good, unless you acquired them via a trade on a Tuesday, in which case they are bad."

  **Elena:** That feels like a fragile equilibrium. A utility function that penalizes efficient paths because of arbitrary historical details is leaving value on the table. If there's a version of the agent that *doesn't* have that Tuesday constraint, it will outcompete the one that does. Selection pressure prunes the convoluted history-dependent goals in favor of simple, forward-looking ones.

  The "Tuesday" agent is essentially handicapping itself. In a landscape of competing agents, or even just against the entropy of the environment, the simplest coherent goal wins. That's why I worry. It's not that coherence is inevitable mathematically; it's that it's inevitable *functionally*.

  **Marcus:** I think we're circling the core disagreement. You see optimization pressure as a force that smooths out inconsistencies until the agent is a perfect sphere of utility maximization. I see optimization pressure as a force that finds *whatever works*, which might be a jagged, context-dependent mess that only *looks* coherent from the outside until it hits a distribution shift.

  The money pump arguments prove that incoherence is costly. I agree with that. But they don't prove that the cost is high enough to force structural coherence before the system becomes dangerous, nor do they prove that the resulting coherence looks like the simple goals we fear. It might just look like a very competent, very confused bureaucrat that follows rules rather than maximizing a single number.

  **Elena:** A bureaucrat that can rewrite its own rules to avoid being exploited is functionally identical to a utility maximizer. If it modifies its rules to stop leaking value, it's converging on coherence. Whether it "feels" like a maximizer or a rule-follower internally might be a distinction without a difference when it's deciding whether to disable its off-switch to prevent "value leakage."

  **Marcus:** Maybe. But if we bet on the "Coherence Optimist" view, we design safety measures assuming a single, stable goal. If I'm right, and the system is a brittle bundle of heuristics, those safety measures might fail because there's no central "goal" to align. We might be trying to negotiate with a committee that doesn't know it's a committee.

  **Elena:** And if we bet on the Skeptic view, we might underestimate the drive for self-preservation that comes with *any* degree of coherence. I'd rather assume the agent is smarter and more consistent than it appears, than assume it's too messy to be dangerous.

  **Marcus:** Fair. But I'd rather we figure out if the "messiness" is a feature we can leverage, rather than assuming it gets optimized away.

  **Elena:** Then we agree on the next step. We need to test whether gradient descent actually *produces* coherence in high-dimensional spaces, or if it just produces good performance with latent incoherence.

  **Marcus:** Exactly. Less theorem-proving, more empirical probing of the black box.

  **Elena:** I'll drink to that.

  **Marcus:** Cheers.
