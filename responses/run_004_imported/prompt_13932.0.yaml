  This is a sharp exchange. You've got a classic clash between **agent-neutral consequentialism** (Leah/Singer) and **fairness-based contractualism** (Owen). They are talking past each other because they are optimizing for different things: Leah for *outcomes*, Owen for *principles of cooperation*.

  Here is the scorecard on the four moves, followed by the distinction that dissolves the deadlock.

  ### The Scorecard

  **Leah Move 1:** *The duty is absolute until "real moral weight" is hit; others' failure doesn't reduce your burden.*
  **Score: +1**
  **Why:** This is a faithful, logically consistent articulation of Singer's actual position. It isn't "clearly right" (+2) because it invites the demandingness objection (it asks too much), but it isn't wrong internally. It correctly identifies that the child's need is independent of the crowd's behavior.

  **Owen Move 1:** *This punishes compliance and rewards free-riders; a moral view shouldn't have that property.*
  **Score: +1**
  **Why:** This is a strong meta-ethical critique. He isn't arguing about the child; he's arguing about the *system of morality*. He correctly identifies that linking obligation to the number of free-riders creates perverse incentives, but he doesn't yet explain *why* the pond analogy fails to capture this.

  **Leah Move 2:** *It's not punishment; the need is objective. The bystanders are there to block the "not my job" excuse.*
  **Score: +1**
  **Why:** She holds her ground on the victim's perspective, which is philosophically sound (suffering doesn't care about fairness). However, it's largely a restatement of Move 1. It doesn't engage with Owen's new point about the *structural incentives* of the moral theory, so it doesn't advance the dialectic.

  **Owen Move 2:** *The pond is a bad model: rescue is binary (life/death), aid is marginal (divisible). "Fair share" works for divisible goods, not lump-sum rescues.*
  **Score: +2**
  **Why:** This is the strongest move of the debate. He attacks the **structural validity of the analogy**. If aid is marginal, we can mathematically define a "fair share" (e.g., total need / number of agents) in a way we cannot with a single swimmer. This exposes a category error in applying the pond intuition directly to global aid economics.

  ***

  ### The Missing Distinction: Ideal vs. Non-Ideal Theory

  Both Leah and Owen are stuck because they are arguing from different levels of moral abstraction without naming them. The distinction they are missing is between **Ideal Theory** and **Non-Ideal Theory** (often discussed in this context as the **Compliance Condition**).

  *   **Ideal Theory** asks: "What would the rules of morality look like if everyone generally complied with them?"
  *   **Non-Ideal Theory** asks: "What must I do given that people *actually* won't comply?"

  **Where they are stuck:**
  *   **Owen** is implicitly arguing from **Ideal Theory**. He thinks the correct moral principle is "Everyone does their fair share." He feels that if he accepts Leah's view, he is accepting a principle where his duty is unfairly contingent on others' bad behavior.
  *   **Leah** is arguing from **Non-Ideal Theory**. She accepts that the "fair share" principle is nice, but notes that in the real world (where people defect), adhering strictly to "fair share" leaves the child dead.

  **The Synthesis (The Compliance Condition):**
  Philosophers like Liam Murphy argue that your obligation is indeed your **fair share of the ideal**, *but* when others defect, your obligation increases only up to a **reasonable limit**, not to the maximum (Leah's view).

  *   **Against Leah:** You don't have to drown yourself saving the kid just because ten others watched. There is a cap on sacrifice even in non-ideal circumstances.
  *   **Against Owen:** You can't just do your 10% and walk away if the kid is still dying. The "fair share" principle relaxes when the stakes are life-and-death, but it doesn't disappear entirely.

  **Why this helps:**
  It allows Owen to keep his fairness intuition (the *principle* we endorse should be fair) while allowing Leah to keep her urgency (the *action* required now must account for reality). It shifts the debate from "Who is right?" to "Where is the saturation point for individual sacrifice in a non-compliant world?" which is a much more productive question for a book club.
