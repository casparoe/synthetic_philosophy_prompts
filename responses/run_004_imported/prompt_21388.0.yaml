answer: |-
  Thank you for being here.

  [Name] left specific instructions for today. She said that no one is allowed to tell you she is in a "better place," or that she is "watching over us." She didn't forbid this because she was bitter, or because she didn't love us. She forbade it because, on her view, those sentences aren't just false. They are cognitively meaningless. They look like statements of fact, but they cannot be verified by any observation. To say them would be to speak nonsense. And she loved us too much to ask us to speak nonsense about her.

  For those of you who knew her professionally, you know she spent a lifetime defending logical positivism long after it had gone out of fashion. To the rest of you, her family: this didn't mean she lacked spirit. It meant she valued precision over comfort. She believed that the world is hard and strange enough without us dressing it up in language that pretends to know things we cannot know.

  Her favorite story to illustrate this was about A.J. Ayer. As many of you know, Ayer was a giant of philosophy and a strict atheist. In 1988, he choked on a piece of smoked salmon in a hospital. His heart stopped for four minutes. He was resuscitated, and later wrote an essay about it. He said he saw a red light. He said he sensed a divine presence.

  But here is why [Name] loved that story. Ayer didn't convert. He didn't suddenly start preaching about heaven. He wrote that the experience only "slightly weakened" his conviction that death would be the end of him. He added that, despite this slight weakening, he still *hoped* it would be the end. He updated his beliefs grudgingly, barely, and in public, without pretending that a weird physiological event had suddenly made religious claims meaningful.

  [Name] used this story in every seminar she taught. She told us that a real empiricist does not abandon their principles when things get difficult. A real empiricist looks at the evidence, adjusts the probability by a fraction if necessary, and refuses to claim more than the data supports.

  She lived by that standard. And, as best we can tell, she died by it too.

  Her sister has asked me to share something private. In her final days in hospice, [Name] admitted to an experience she could not quite place. She reported a phenomenon that she struggled to categorize within her usual framework.

  I mention this only because she would have wanted the data on the table. But I mention it with the caveat she would have insisted upon: acknowledging an anomaly is not the same as validating a metaphysics. Like Ayer, she did not use that moment to claim she had found proof of what comes next. She did not claim to know. She simply noted that something happened, and she remained honest about the limits of what that something meant.

  That was her gift to me, and to all her students. She taught us that integrity isn't about being certain. It's about not lying when you aren't. She taught us that we can face the end of our consciousness without flinching, and without reaching for fairy tales to make it softer.

  So, I will not tell you she is at peace. I do not know that. I will not tell you she is with us now. I cannot verify that.

  But I can verify this: She was here. She taught us. She challenged us. She cared enough about the truth to defend unpopular ideas, and she cared enough about us to refuse us the comfort of lies.

  The words we speak today about her impact, her rigor, and her love, are meaningful. They refer to things we can observe in our own lives, in the work we do, and in the way we think. She is not in a better place. She is in the past. But the work remains. And if we are precise, and if we are honest, and if we are brave enough to look at the world exactly as it is, then we are honoring her in the only way she would have accepted.

  Thank you.
