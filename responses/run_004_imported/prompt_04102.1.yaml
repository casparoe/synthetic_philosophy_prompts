answer: |-
  John Wallis visits Thomas Hobbes at Chatsworth, carrying a stack of papers thick enough to club a man.

  "Mr. Hobbes," Wallis says, laying out the sheets. "It has been twenty years. I have demonstrated, proposition by proposition, that your quadrature of the circle is impossible. The ratios do not hold. The construction fails."

  Hobbes glances at the papers without touching them. "Mr. Wallis, you treat geometry as if it were natural philosophy. You look at the figures and guess at causes you cannot inspect."

  "I am looking at *your* figures, Thomas. And *your* math."

  "Precisely," Hobbes replies, leaning back. "And that is where your error lies. In physics, God constructs the world, so we can never be certain of the causes. But in geometry, *we* construct the figures. We are the cause. Therefore, we have certain knowledge of them."

  Wallis rubs his temples. "Yes. We are the cause. Which means when the cause produces an error, the error is ours."

  "Impossible," Hobbes says. "If certainty comes from construction, then my construction *is* the certainty. To say I have squared the circle incorrectly is to claim you know the nature of my construction better than I, the constructor. That is not mathematics, Mr. Wallis. That is rebellion."

  "It's not rebellion to point out that a line is curved!"

  "In the State of Nature, perhaps. But I have erected a Commonwealth upon this page. In this Commonwealth, I am the Sovereign of the Line. And just as the Sovereign cannot commit iniquity against his own laws, I cannot commit error against my own geometry."

  Wallis gathers his papers, defeated not by logic, but by taxonomy. "So, for you, geometry is certain not because it is true, but because it is authoritative?"

  Hobbes picks up his compass. "No, John. It is certain because it is the only science where I am allowed to be God. Now, if you'll excuse me, I must begin work on trisecting the angle. I feel a revelation coming on."

  "And if I refute that one too?"

  Hobbes smiles. "Then you are merely describing the State of Nature. I shall remain in Civil Peace with my circle."
