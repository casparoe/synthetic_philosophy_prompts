      *   **Friend's Position:** Epistemicism (there *is* a sharp cutoff, but it's unknowable).
      *   **User's Position:** Supervaluationism (truth is defined over all "precisifications," no single sharp cutoff in reality).
      *   **The Conflict:** The friend argued that Supervaluationism *also* entails the existence of a sharp cutoff (specifically, the statement "There exists a number $n$ such that $n$ grains is a heap and $n-1$ is not" comes out true), so the user's view isn't actually different/better.
      *   **User's Question:** Is there an actual difference between the two views, or did I lose the argument?

