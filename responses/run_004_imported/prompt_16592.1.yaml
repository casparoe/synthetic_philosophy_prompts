      *   **Occasion:** Wedding reception toast for a friend/colleague (Philosophy/Bioethics).
      *   **Key Backstory:** Couple met after a drunk argument about Parfit's Teletransporter Case (Mars vs. Earth copy). This story is well-known.
      *   **Core Theme:** Parfit's mature view (Reductionism): Personal identity isn't what matters; psychological connectedness/continuity matters more. This reduces self-interest and increases connection to others/future selves.
      *   **Specific Reference:** The "glass tunnel" metaphor from the end of *Reasons and Persons* (Part III).
      *   **Goal:** Avoid cheap jokes ("no disintegration today"). Use the philosophy to say something *true* about marriage/commitment. Warm before clever.
      *   **Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy (for accuracy):**
      *   *The Teletransporter Case:* You step in on Earth, you are scanned/disintegrated, a copy is made on Mars. Is the Mars person you?
      *   *Parfit's View:* It doesn't matter if it's "you" in the strict identity sense. What matters is *Relation R* (psychological connectedness and continuity).
      *   *The Implication:* If identity isn't what matters, the boundary between "me" and "others" (or "me now" and "me later") is less sharp. This reduces egoism.
      *   *The Glass Tunnel:* Parfit describes his life before this realization as living in a glass tunnel, separated from others. Realizing identity isn't what matters broke the glass, making him more concerned with others and less afraid of death.
      *   *Application to Marriage:* Marriage is a promise to stick together even as psychological continuity shifts (the 70-year-old is different from the 30-year-old). It's a commitment to *Relation R*, not just static identity.

  3.  **Drafting - Section by Section:**

      *   **Opening (Warmth & Context):** Acknowledge the role, the couple, and the elephant in the room (the meet-cute). Keep it light but affectionate.
      *   **The Hook (The Philosophy):** Bring in the Teletransporter story. Acknowledge the department knows it, but explain it briefly for family so they aren't lost.
      *   **The Turn (From Joke to Insight):** Move away from the "copy" joke. Introduce Parfit's deeper point. Identity isn't the hard boundary we think it is.
      *   **The Application (Marriage):** How does this apply to the couple? Marriage isn't about freezing identity; it's about maintaining connection *through* change. The "Relation R" of love.
      *   **The Climax (The Glass Tunnel):** Use Parfit's metaphor. Marriage breaks the tunnel of self-interest. It's about caring for someone else's future as much as your own.
      *   **Conclusion (The Toast):** Bring it back to the present. Raise a glass. Wish them well.

  4.  **Drafting - Tone Check:**
      *   *Is it too academic?* Need to define "Relation R" simply. Avoid jargon where possible, or explain it immediately.
      *   *Is it too dry?* Need emotional beats. Focus on *love* and *commitment*, not just metaphysics.
      *   *Is it accurate?* Ensure the Parfit reference is solid for the PhDs in the room. The "glass tunnel" quote is specific: "My life seemed like a glass tunnel, through which I was moving faster every year, and at the end of which there was darkness... When I changed my view, the walls of my glass tunnel disappeared."
      *   *Is it warm?* Start and end with personal affection for the bride.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Initially, I might focus too much on the "copy" aspect. I need to pivot quickly to *what matters*.
      *   *Correction:* Make sure the family understands the "glass tunnel" metaphor without needing the book. Describe the feeling of isolation vs. connection.
      *   *Correction:* Ensure the "till death do us part" line lands. It's not about surviving death, it's about surviving *change*.

  6.  **Final Polish:**
      *   Check timing. (Word count looks good for 4-5 mins).
      *   Check cues for delivery (pauses, looking at the couple).
      *   Ensure the "Phil of Language" speaker voice comes through (precise but accessible).

  7.  **Final Review against constraints:**
      *   4-5 minutes? Yes.
      *   Parfit accurate? Yes (Teletransporter, Relation R, Glass Tunnel).
      *   Warm before clever? Yes, starts with friendship, ends with love.
      *   Audience balance? Yes, explains concepts for family, keeps depth for dept.

  *(Self-Correction Note: Make sure not to imply the groom is a "copy." The point is that *everyone* changes over time, so the "future self" is arguably a "copy" of the "past self." Marriage bridges that gap.)*

