answer: |-
  Here is a draft for the toast. It is designed to run about 4 to 5 minutes at a measured speaking pace. I've included stage directions in brackets to help with the delivery.

  **Tone:** Affectionate, intellectually precise but accessible, emotionally resonant.

  ***

  **The Toast**

  [Stand up, tap the glass gently. Wait for the room to settle. Look first at the couple, then at the room.]

  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm in the PhD program with [Bride], and I have the distinct privilege of working in Philosophy of Language while she does the heavy lifting in Bioethics and Personal Identity.

  Now, I know why I'm standing here. I know the story. We all know the story.

  [Bride] and [Groom] met at a department happy hour three years ago, after a disagreement that escalated from "strongly worded" to "shouting match" over Derek Parfit's Teletransporter Case. For the family members who didn't get a PhD alongside this: essentially, they argued about whether a person who is disintegrated on Earth and perfectly replicated on Mars is the *same person*, or just a really convincing copy.

  [Groom] argued he was a copy. [Bride] argued he was the same person. They've been inseparable ever since.

  [Pause for laughter]

  And look, I could make the easy joke. I could say something like, "Well, looking at you two tonight, I can confirm that no one is being disintegrated today," or "I promise the officiant checked that [Groom] is psychologically continuous with the man she met at the bar."

  But that feels cheap. And honestly, it misses the point of why [Bride] loves Parfit, and why she loves [Groom].

  Because Parfit's conclusion wasn't actually about teleporters. It was about what matters in survival. He argued that "personal identity"—that strict, unchanging tag of *Self*—isn't actually what matters. What matters is psychological connectedness. It's the continuity of memories, intentions, and character. He called it "Relation R."

  And he realized that because we change over time, the "me" of today is not strictly identical to the "me" of forty years from now. In a metaphysical sense, the 70-year-old [Groom] is going to be a different person than the 30-year-old [Groom] standing here tonight. Cells replace themselves, memories fade, personalities shift.

  So, when we say "till death do us part," we aren't promising to remain the same person. We're promising to maintain *Relation R* with someone else, even as we both drift away from who we are right now.

  [Turn to the couple]

  Marriage, in this light, isn't a contract between two static identities. It's a pact to witness each other's changes. It's a promise that when the psychological distance between who you were and who you become gets wide, you won't let it become a chasm. You are promising to keep the continuity alive, not just within yourselves, but *between* you.

  Parfit wrote that for most of his life, he felt like he was living inside a glass tunnel. He saw his life as strictly his own, separated from everyone else, moving faster every year toward darkness at the end. He said realizing that identity isn't what matters "broke the glass." It made him less afraid of death, because he realized he was more connected to others than he thought. It made him less selfish, because the boundary between "me" and "you" was more permeable than he'd been taught.

  [Pause, soften tone]

  I think that is the best description of love I have ever encountered in our literature.

  Before you meet someone like this, you are in the tunnel. Your future is just yours. Your struggles are just yours. But when you commit to a life together, the glass breaks. You become invested in a future you won't inhabit alone. You take on a vulnerability that isn't strictly "yours."

  [Bride], you've spent your academic career studying what makes a person a person. But watching you two, I think you've found something better than an answer to a thought experiment. You've found a way to step out of the tunnel.

  [Groom], you may have won the argument that night about the teleporter. But I hope you know that tonight isn't about winning. It's about showing up. It's about choosing, every day, to maintain that connection, to care for her future as fiercely as your own.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your psychological connectedness remain strong. May you break each other's glass tunnels. And may you find that what matters isn't just surviving, but surviving *together*.

  To the happy couple.
