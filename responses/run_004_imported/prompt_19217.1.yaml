      *   *Ethical Framework Flaw:* Total Utilitarianism (summing everything) might be the wrong metric. Average Utilitarianism, Person-Affecting Views, or Prioritarianism avoid this.
      *   *Causal/Local Impact:* Even if the *cosmic* total doesn't change, the *local* total does. Morality is usually about the causal consequences of actions, not the state of the entire universe.
