answer: |-
  Your intuition is correct: your friend has stumbled upon a known philosophical problem, but his conclusion that "nothing matters" is widely rejected by ethicists and mathematicians who specialize in this area.

  The argument your friend is making is known in philosophy as the **Infinitarian Paralysis** (or the problem of Infinite Ethics). It is a specific challenge to *Total Utilitarianism* (the view that the right action is the one that maximizes the total sum of well-being in the universe).

  While his mathematical intuition ($\infty + 5 = \infty$) is correct in standard set theory, his ethical conclusion does not follow. Here is a breakdown of why his reasoning fails, which you can share with him.

  ### 1. The Mathematical Flaw: Comparing Infinities
  Your friend is treating the "value of the universe" like a single bank account balance. In standard arithmetic, adding a finite number to infinity doesn't change the cardinality of the infinity. However, ethics isn't about cardinality; it's about **comparison**.

  Even if two sets are both infinite, one can still be "better" than the other.
  *   **The Pareto Argument:** Imagine two infinite timelines. In Timeline A, every person has a well-being level of 10. In Timeline B, every person has a well-being level of 10, *except* for the people you influence today, who have a level of 11.
  *   Both timelines have infinite total value. However, Timeline B is strictly better than Timeline A at specific coordinates. Every individual in the affected group is better off, and no one is worse off.
  *   Most ethical systems agree that if you can make some people better off without making anyone worse off, you have done a moral good, regardless of the infinite background.

  Mathematicians have developed tools to handle this, such as **hyperreal numbers** or **surreal numbers**, which allow for different "sizes" or "orders" of infinity. Using these frameworks, an infinite future plus a finite good *is* distinguishable from an infinite future without that good.

  ### 2. The Ethical Framework Flaw: Totalism vs. Alternatives
  Your friend's argument relies entirely on **Total Utilitarianism** (maximizing the sum). This is just one specific ethical framework, and the infinitarian paradox is considered a major *reductio ad absurdum* (a disproof by showing it leads to absurdity) against it.

  If Total Utilitarianism implies that saving a drowning child is morally equivalent to letting them drown because the universe is infinite, most philosophers argue that **Total Utilitarianism is the theory that needs fixing, not our intuition about the child.**

  Alternative frameworks avoid this trap entirely:
  *   **Average Utilitarianism:** Focuses on the average well-being per person. Adding good to an infinite future can still raise the average (or prevent it from dropping), depending on how the math is structured.
  *   **Person-Affecting View:** This view holds that morality is about making specific people better or worse off. Saving the child makes *that child* better off. The fact that there are infinite other people elsewhere is irrelevant to the moral transaction between you and the child.
  *   **Prioritarianism:** This gives more weight to helping those who are worse off. It focuses on the distribution of value, not just the sum.

  ### 3. The Epistemic Flaw: Uncertainty
  Your friend is arguing based on a metaphysical claim: *"The future contains infinitely many people."*

  Do we know this for a fact? No. Cosmology is undecided on whether the universe will end in a "Big Freeze," a "Big Crunch," or something else. Even if time is infinite, intelligent life might not persist forever.
  *   **Expected Value:** If there is even a 1% chance that the future is finite (or that our influence is limited to a finite causal patch), then standard Expected Value calculations apply.
  *   If the future is finite, your actions matter immensely. If the future is infinite, your actions might still matter (see point #1).
  *   Therefore, the *expected value* of saving the child is positive. To act as if the infinite future is a certainty is a gamble, not a rigorous conclusion.

  ### 4. The "Causal Influence" Argument
  Ethics is generally concerned with the **causal consequences of your actions**, not the state of the entire universe.

  When you save a drowning child, you have changed the state of the world *in the region of spacetime you can influence*. You have created a "pocket" of additional value.
  *   Imagine a vast, infinite desert. If you plant a single tree, the total "sand-to-tree ratio" of the infinite desert hasn't meaningfully changed. But you have still created an oasis where there wasn't one before.
  *   The value of your action is located in the causal chain you initiated. The fact that there is an infinite amount of *other* stuff happening elsewhere doesn't negate the reality of the good you caused locally.

  ### Summary for Your Friend
  You can tell your friend that his argument is a famous philosophical puzzle, but it is generally viewed as a sign that **Total Utilitarianism is incomplete**, not that morality is an illusion.

  1.  **Infinities are comparable:** We can distinguish between an infinite world with more suffering and an infinite world with less, even if both sums are infinite.
  2.  **Uncertainty matters:** We shouldn't bet our moral lives on the universe being infinite.
  3.  **Local impact is real:** Morality is about the difference you make in the causal sphere you inhabit, not the total sum of the cosmos.

  His conclusion leads to "moral paralysis," which is practically indistinguishable from nihilism. If a moral theory tells you that saving a child is no better than letting them drown, the standard philosophical response is to reject the theory, not the intuition.
