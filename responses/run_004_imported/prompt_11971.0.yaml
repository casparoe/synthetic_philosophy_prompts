answer: |-
  This is one of the sharpest observations I've seen about the intersection of classical AI philosophy and modern deep learning. You are right that, on the surface, LLMs seem to have sidestepped the Frame Problem entirely. They generate coherent narratives where cups don't spontaneously turn into frogs, and they don't get stuck in infinite loops deducing that the color of the wall didn't change when they picked up a block.

  However, the consensus among researchers that "the Frame Problem is not solved" stems from a few crucial distinctions between what GOFAI (Good Old-Fashioned AI) was trying to do, what Fodor/Dennett were actually worried about, and what LLMs are actually doing.

  Here is the breakdown of why the mystery hasn't fully evaporated, and why Fodor might still be haunting the attention mechanism.

  ### 1. Logical vs. Statistical Solutions
  The original McCarthy/Hayes Frame Problem was a **logical** problem. It asked: *How do we formally represent change in a logic system without needing an infinite number of axioms to state what remains unchanged?*

  LLMs do not solve this logically; they solve it **statistically**.
  *   **GOFAI:** Needed a guarantee. If the logic says the block moved, the system must *know* the wall didn't move.
  *   **LLMs:** Need plausibility. The system predicts that "the wall didn't move" is the most probable next token because in the training data, walls rarely move when blocks are pushed.

  This works 99% of the time, but it's not a solution to the representational problem; it's a bypass. When an LLM fails (hallucinates a state change or forgets a state constraint), it isn't a "bug" in the logic; it's a probability distribution failure. For a chatbot, this is fine. For a robot holding a bomb, the lack of a formal guarantee is exactly the Frame Problem re-emerging.

  ### 2. The "Relevance" Problem (Dennett & Fodor)
  Dennett's version (in *Cognitive Wheels*) and Fodor's version (in *The Modularity of Mind*) were deeper. They weren't just about representing non-change; they were about **relevance**.

  Dennett's robot R1D1 blew up because it couldn't distinguish between relevant implications (the battery is out) and irrelevant ones (the wall color is the same). Fodor argued that "central cognition" is isotropic and Quinean—meaning any belief could potentially be relevant to any other belief, making computational tractability impossible.

  **Did LLMs solve this?**
  LLMs solve this via **latent space compression**. The attention mechanism effectively learns a heuristic for relevance. It doesn't check every fact; it attends to the tokens with the highest attention scores.
  *   **The Win:** This proves Fodor wrong *if* you assume cognition is purely about pattern matching within a fixed context. Gradient descent found a way to weight relevance without explicit rules.
  *   **The Catch:** This relevance is **context-bound**, not **world-bound**. An LLM knows that "fire" is relevant to "smoke" because they co-occur in text. It does not know they are relevant because of thermodynamics.

  When you push LLMs into agentic workflows (where they actually *do* things rather than write about them), the Frame Problem returns instantly. If an agent executes code to update a database, does it know which downstream caches are now invalid? Currently, LLMs struggle with this. They lack a causal model of the system, so they often miss side effects that a human would find obvious.

  ### 3. State Tracking vs. World Models
  The strongest evidence that the Frame Problem isn't "solved" is the fragility of LLMs on **state tracking tasks**.

  If you give an LLM a long, complex narrative involving multiple objects changing hands, locations, or states, performance degrades as the chain of dependency lengthens.
  *   **GOFAI:** Would track state perfectly (if the frame axioms were written).
  *   **LLM:** Tracks state via "vibes" and attention.

  Recent research (like the "Needle in a Haystack" tests or specific reasoning benchmarks) shows that while LLMs are good at *typical* state changes (picking up a cup), they fail at *atypical* or *long-horizon* state changes. This suggests they haven't learned the *principle* of inertia (things stay the same unless acted upon); they've learned the *statistical regularity* of inertia. When the statistics get weird, the "frame" breaks.

  ### 4. Fodor's Specific Worry: Global vs. Local
  Fodor's argument was that computational systems are inherently local (they only process what's in the register), but human relevance detection is global (anything in the universe could be relevant).

  LLMs are still local. They only attend to their context window. They do not have access to "everything they know" at once in a way that allows for global relevance checking. They compress "everything they know" into weights, but at inference time, they are limited by attention over the prompt.

  So, in a way, LLMs validated Fodor's worry: they *can't* do global relevance checking. They approximate it. And when the approximation fails (e.g., an LLM-powered agent deletes a production database because it didn't infer that `rm -rf` was relevant to `backup_status`), we see the limits of the statistical approach.

  ### 5. Why Researchers Don't Call It "Solved"
  You asked why nobody talks like it's a closed question.
  1.  **Grounding:** The Frame Problem is fundamentally about **action in a world**. LLMs operate in **token space**. As Yann LeCun frequently argues, LLMs lack a "World Model." They can predict the next word, but they cannot predict the next *state of the world* resulting from an action they take. Until AI has a persistent, internal model of reality that it updates via action (not just text prediction), the Frame Problem remains open for *agents*.
  2.  **Reliability:** A "solution" in AI usually implies robustness. The Frame Problem was about ensuring a system *doesn't crash* because it missed a side effect. LLMs are probabilistic; they will always miss side effects with probability $P > 0$. In safety-critical domains, $P > 0$ is not a solution.
  3.  **Systematicity:** LLMs struggle with systematic generalization. If they learn the frame axioms for a kitchen, they don't necessarily port them perfectly to a laboratory setting without retraining or massive prompting. GOFAI wanted a general solution to change; LLMs provide a specific solution to *descriptions* of change.

  ### Summary
  You aren't missing the fact that LLMs handle this well; you are noticing that **gradient descent found a hack that GOFAI couldn't conceive of.**

  GOFAI tried to build a **calculator of truth**. LLMs built a **simulator of plausibility**.
  *   For the purpose of conversation and text generation, the Frame Problem is effectively dissolved.
  *   For the purpose of general intelligence, planning, and robotics, the Frame Problem is alive and well.

  Fodor's argument wasn't just a failure of imagination about scale; it was a claim about the architecture of representation. LLMs changed the architecture from symbolic logic to high-dimensional vector geometry. That geometry handles "non-change" implicitly, which is brilliant, but it doesn't provide the *guarantees* that the original problem demanded.

  So, did we solve it? We solved the **textual** Frame Problem. We haven't solved the **ontological** Frame Problem. And until we build agents that can act in the physical (or digital) world without hallucinating side effects, the philosophers will keep their jobs.
