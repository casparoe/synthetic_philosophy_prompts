      *   *Implication 3: Precision vs. Utility.* The Logicians pushed for extreme precision. Science needs precision, but also communication. "Fish" is scientifically "wrong" cladistically but communicatively "right" for fisheries management.
      *   *Implication 4: Reducing Conflict.* If scientists realize they are arguing about *names* (concepts) rather than *actualities* (the physical organisms), the heat might go out of the debate. It's a semantic/ontological disagreement, not necessarily a factual one about the animals.

