      *   *Meaning:* It's not denying that a white horse is a member of the equine family. It's arguing about the *concept* or *name* ("white horse") being distinct from the *concept* or *name* ("horse"). "Horse" refers to the shape/form. "White" refers to the color. "White horse" refers to shape + color. Therefore, the *name* "white horse" is not identical to the *name* "horse".
      *   *School of Names (Logicians):* Focused on *ming* (names) and *shi* (actualities/reality). They were concerned with the rectification of names, the relationship between language and reality, and the precision of categorization.
      *   *Key Insight:* Language categorizes the world arbitrarily or conventionally, not necessarily according to natural joints.

  3.  **Deconstruct the Scientific Context (Taxonomy/Cladistics):**
