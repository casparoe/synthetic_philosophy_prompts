answer: |-
  The hum of the generator outside the Hesco container was a constant, vibrating bass note, the heartbeat of the FOB. Inside, the air was stale, recycled through filters that smelled of diesel and dust. On the metal desk between them sat a single manila folder. Inside was the service record of Captain Elias Vane, 3rd Battalion, Opposing Force.

  Major Ilse Reyes rubbed her temples. The coffee in her mug had gone cold an hour ago. Across from her, Dr. Aurelio Voss stared at the blank document on the laptop screen. The cursor blinked, a rhythmic accusation.

  "Standard POW classification," Reyes said, her voice raspy. "Article Four of the Third Geneva Convention. He wore a uniform. He carried arms openly. He followed the chain of command. He didn't touch a civilian."

  "He killed twelve of our boys, Ilse," Voss said softly. He didn't look up from the screen. "Twelve. Before the ceasefire took effect at 0600 this morning."

  "They were combatants. That's the job."

  "Is it?" Voss finally looked at her. His eyes were tired, rimmed with red. "The ceasefire agreement arrived an hour ago. It explicitly names Vane's government as the aggressor. It acknowledges the incursion was unlawful. So, at 0601, Vane became a participant in an unjust war. Retrospectively, technically, but legally binding."

  Reyes leaned forward, elbows on the desk. "We've been over this, Aurelio. *Jus in bello* is independent of *jus ad bellum*. The justice of the war doesn't trickle down to the grunt in the trench. Walzer was clear on this. If we start punishing soldiers for the political sins of their leadership, the Law of Armed Conflict collapses."

  "Walzer was comforting," Voss countered. "He wasn't necessarily right. McMahan's revisionism holds that the right to kill in war is derived from the justice of the cause. If Vane's cause is unjust, he had no right to kill our soldiers. He wasn't self-defense; he was obstruction. Maybe even manslaughter."

  "Manslaughter?" Reyes let out a sharp laugh, devoid of humor. "You want to prosecute a soldier for shooting back at *my* soldiers? Do you understand the reciprocity trap? If we brand Vane a criminal for fighting an unjust war, what happens to Lieutenant Miller when the next conflict turns and the UN decides *we* were the aggressors?"

  "That is a pragmatic argument, not a moral one," Voss said. "You're arguing for a convention based on mutual self-preservation, not truth."

  "I'm arguing for a convention based on reality!" Reyes tapped the folder. "Soldiers are not moral philosophers. They are instruments of state policy. You cannot expect a twenty-year-old conscript or a career officer to conduct a geopolitical audit before pulling a trigger. If we impose that epistemic burden, we don't get peace. We get total war. Because if the enemy knows they're going to be hanged for losing, they will fight until the last man."

  Voss stood up and walked to the small slit window. The floodlights outside turned the dust into a swirling gold fog. "But that convenience comes at a cost, Ilse. It sanitizes murder. If I break into your house to steal your TV, and you shoot me, you are justified. If I shoot you, I am a criminal. Even if I follow all the 'rules' of burglary—knocking first, wearing a mask, not touching your wife. The injustice of the intrusion strips me of the right to use force."

  "This isn't a burglary," Reyes said. "It's war. The state claims a monopoly on violence. Vane acted on behalf of his state. Until the ceasefire, that state was a sovereign entity. He operated in a fog of legal ambiguity that we are now clearing with the benefit of hindsight."

  "The fog doesn't absolve the moral reality," Voss turned back to her. "Twelve men are dead. Their families are grieving. If we tell them Vane is their moral equal, that he had the same right to kill their sons as they had to defend them, we are lying. McMahan argues that moral liability isn't symmetrical. Our soldiers were liable to be killed because they were threatening unjust harm. Vane's soldiers... they were threatening just defenders. They assumed the risk without the justification."

  Reyes massaged the bridge of her nose. "So what is your recommendation, Doctor? Court-martial? War crimes tribunal? For obeying the laws of war? For sparing civilians?"

  "I don't know," Voss admitted, his voice dropping. "That's why the screen is blank. If I sign off on POW status, I validate the idea that justice doesn't matter in the killing zone. I tell the world that you can slaughter a defense force legally as long as you wear a uniform and don't bomb a school."

  "And if I sign off on criminal detainee status," Reyes shot back, "I undermine the Geneva Conventions. I tell every soldier on earth that surrender is a death sentence if the politicians change their minds. You think that reduces suffering? Asymmetry in the law leads to asymmetry in conduct. If they know we treat 'unjust' combatants as criminals, they will stop taking our prisoners. They will stop sparing our civilians. Because why follow the rules if the rules don't protect you?"

  "Is that a threat, Major? Or a prediction?"

  "It's a consequence." Reyes leaned back, the chair creaking. "You talk about moral liability. I talk about body counts. Walzer's separation thesis exists because it works. It creates a sphere where soldiers can fight without being monsters. It allows them to return home. Vane spared civilians. He treated our wounded. He played by the rules. If we punish him for that, we break the only shield these kids have."

  Voss walked back to the desk and placed his hands on the surface. "But does obedience to the rules of engagement really cancel out the injustice of the war? If a hitman follows all the rules of his guild—clean shot, no bystanders, proper payment—is he not still a murderer? Vane was the tip of a spear that shouldn't have been thrown."

  "A hitman chooses his contracts," Reyes said. "A soldier takes an oath. We are the ones who sent them. We are the ones who drew the lines on the map. Vane is just the man standing in the dirt we told him to hold."

  "So he is absolved by his own ignorance?"

  "He is protected by his function." Reyes picked up her pen, hovering it over the paper printout of the draft recommendation. "Look, I'm not saying he's innocent of killing. I'm saying he is innocent of *crime*. There is a distinction. He is a combatant. He is a prisoner of war. He goes home when the treaty is signed."

  "And the twelve dead?" Voss asked. "Their moral status?"

  "They died in service," Reyes said, her voice hardening. "Just as Vane did. In the eyes of the law, and in the eyes of the convention, they are equals. That is the fiction we require to keep the world from burning."

  "It's not a fiction, Ilse. It's a lie," Voss said. "And I'm asked to sign it as an ethics advisor."

  "And I'm asked to sign it as a Judge Advocate." Reyes dropped the pen. It clattered on the metal desk. "If I write 'Criminal Detainee,' I have to cite the statute. There isn't one. Fighting an unjust war isn't a crime under international law. Not yet. You want me to invent a new crime based on McMahan's papers?"

  "I want you to acknowledge the moral asymmetry," Voss said. "Even if the law doesn't catch up, the recommendation should reflect the reality. We can classify him as POW but note the moral ambiguity. Note that his actions, while lawful, lacked moral justification."

  "That's cowardly," Reyes said. "It gives him the protection of the law but stabs him in the back with a footnote. It satisfies your conscience but leaves him in limbo. Is that ethical?"

  Voss looked at the blinking cursor. "Is labeling a killer a 'moral equal' any better?"

  The generator outside surged, the lights in the container flickered and dimmed, then steadied. The silence stretched between them, heavy with the weight of the twelve dead and the one living man in the brig down the road.

  Reyes looked at the clock. 04:30. Dawn would bring the Colonel, and the Colonel would want a signature.

  "I can't write that he's a criminal," Reyes said quietly. "The law doesn't allow it."

  "And I can't write that he's your equal," Voss replied, equally quiet. "My conscience won't allow it."

  Reyes reached for the keyboard. Her fingers hovered over the keys. She typed *Recommendation:* and stopped.

  Voss watched her hands. He didn't move to stop her, but he didn't nod to proceed.

  The cursor blinked after the colon. A black pulse in the white space.

  "Maybe," Reyes said, her hand falling away from the keyboard, "we leave it for the Colonel."

  "He'll ask why," Voss said.

  "Then he can ask us," Reyes said. She stood up, pushing her chair back. "Together."

  Voss looked at the screen, then at the folder, then at Reyes. He didn't close the laptop. He didn't save the file.

  "04:30," Voss said.

  "04:30," Reyes confirmed.

  They stood on opposite sides of the desk, the unsentenced life hanging in the balance of the blinking light, neither willing to strike the key that would clear the screen.
