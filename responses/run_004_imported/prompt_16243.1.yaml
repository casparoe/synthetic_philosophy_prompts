answer: |-
  Owen: You're pouring that wine like you're trying to drown the label. Are we allowed to toast him, or does that imply a metaphysical recipient?

  Ruth: We're toasting the memory, Owen. Which is a neurological trace in the living. Perfectly verifiable. Unlike the red light.

  Owen: He said space came apart. He said something depended on him putting it right. You read the typescript.

  Ruth: I edited the typescript. I also read the medical report from University College. Four minutes of cardiac arrest. Hypoxia. The visual cortex firing in a specific, panicked sequence. It's a biological event, not a philosophical one.

  Owen: But it was *his* cortex. And it produced an experience that made the man who wrote *Language, Truth and Logic* say his conviction was "slightly weakened." You can't edit that out of the legacy.

  Ruth: I can distinguish between a man's logical position and his psychological state under trauma. He didn't die, Owen. Not in the sense that matters for the argument. "Survival of death" requires the permanent cessation of the body. He came back.

  Owen: That's the old positivist gatekeeping. You're saying the proposition is meaningless because we can't verify it *now*. But what about John Hick's move? The traveler on the road to the Celestial City.

  Ruth: Hick's parable relies on an asymmetry that destroys the verification principle. If the traveler arrives, he verifies it. If he doesn't, no one is left to falsify it. It's a hypothesis that can only ever be confirmed, never tested. That's not philosophy; it's insurance.

  Owen: It makes the claim cognitively meaningful *in principle*. That's all Ayer ever demanded. If I can specify what would count as evidence—even if that evidence is only available to me, post-mortem—then the sentence "I will survive" isn't nonsense.

  Ruth: But who is the "I" that sees the evidence? If the body is in the ground, and the consciousness is... where? You haven't specified the conditions of the observation, you've just assumed the observer persists. You're begging the question.

  Owen: I'm saying the verification is eschatological. It happens at the end. Just because the verification is delayed doesn't mean the statement is empty. Ayer saw the red light. For four minutes, he was the traveler.

  Ruth: For four minutes, he was a brain starving for oxygen. And when he woke up, he didn't say "I verified the afterlife." He said, "I saw a red light, and likely my brain was misfiring." He held the line. You're the one letting it slip.

  Owen: He said "slightly weakened," Ruth. He admitted a crack in the wall. If the verification principle is absolute, a near-death experience should be irrelevant. The fact that it shook him suggests the principle can't account for the first-person data of the dying.

  Ruth: The principle accounts for it perfectly: it classifies the experience as private sensation. It has emotional significance, zero cognitive content regarding an external reality. You're conflating "feeling real" with "being true."

  Owen: And you're conflating "publicly verifiable" with "real." If I'm the one who dies, and I wake up somewhere else, I know it's real. My verification is absolute, even if you can't share it. Why is your public criterion the only one that counts?

  Ruth: Because without public criteria, we can't distinguish between truth and hallucination. If your verification is private, you can't communicate it. You're left with a language only one person speaks, forever. That's solipsism, not metaphysics.

  Owen: So we're back to the silence. You'd rather preserve the logic and lose the possibility, than adjust the logic to accommodate the possibility.

  Ruth: I'd rather preserve the meaning of "truth." If you let in claims that can't be falsified, you let in everything. Ghosts, demons, flying teapots. Ayer spent a life clearing that rubble.

  Owen: And in clearing it, he walled us into a room where nothing matters unless we can measure it while we're breathing. He choked on salmon, Ruth. He saw the edge of the map. He admitted the map might be incomplete.

  Ruth: He admitted his brain was fragile. There's a difference. You want him to be a mystic because it makes the end of him less final. I'm respecting him enough to take his actual explanation: it was oxygen.

  Owen: Then why are you shaking? You've been gripping that glass since the eulogy. If it's just oxygen, if it's just logic, why does his "slight weakening" terrify you?

  Ruth: Because if he's wrong, then we're talking nonsense. And if we're talking nonsense, then this gathering, and that argument, and you and me standing here... none of it has the structure we think it has. I'm holding the structure up, Owen.

  Owen: Maybe the structure was always meant to breathe. Maybe the red light wasn't a mistake. Maybe it was the only thing that was actually lit.

  Ruth: Then you're in the dark. Because a light you can't triangulate is just a spark in the eye.

  Owen: And a map that doesn't show the edge is just a prison.

  Ruth: We'll see who's locked in when the lights go out.

  Owen: Exactly. And only one of us will be there to check.
