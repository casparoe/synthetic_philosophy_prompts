answer: |-
  Late in life, a young admirer visited Hobbes and found him surrounded by diagrams of circles and squares, still embroiled in his bitter feud with John Wallis.

  "Sir," the student ventured, "you built your entire political philosophy on the claim that geometric demonstration is the only remedy for human dispute—that if we reason from clear definitions, conclusions must compel universal assent. Yet here you are, refusing to assent to a geometric proof."

  Hobbes set down his compass and smiled thinly.

  "You misunderstand the project," he said. "I intended to make politics as indisputable as mathematics. Instead, I have made mathematics as disputable as politics."
