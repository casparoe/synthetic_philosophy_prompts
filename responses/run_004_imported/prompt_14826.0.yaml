answer: |-
  This is a fascinating application of political theory to a very practical, mundane conflict. You are correct that the **Boundary Problem** (often associated with theorists like Robert Dahl and Frederick Whelan) creates a logical paradox: *To decide who decides, you need a decision-maker, but the decision-maker is exactly what is in question.*

  In a sovereign state, this is often solved by history, force, or constitution. In a condo association, it is solved by contract and property law. However, the *normative* tension of the boundary problem is exactly what is fueling your conflict.

  Here are the most important implications of the boundary problem for your specific situation, moving from the theoretical to the practical.

  ### 1. The "Constitutive" Document Breaks the Circle (But Creates Rigidity)
  In democratic theory, the boundary problem implies that the definition of "the people" cannot be decided democratically; it must be decided **constitutively**.

  *   **Implication:** You cannot solve this dispute by holding a vote at a general meeting. Any vote you hold *already presupposes* who is allowed to vote. If you let renters vote on whether renters should vote, owners will cry foul. If you let only owners vote, renters will cry foul.
  *   **Reality Check:** In a condo, the "constitution" is your **Declaration and Bylaws**, governed by state statute. These documents almost certainly define voting membership as "unit owners." This legally solves the circularity, but it doesn't solve the *legitimacy* problem. You are bound by the prior agreement (the deed) unless you amend it.

  ### 2. The Clash of Democratic Principles: "All-Affected" vs. "All-Subjected"
  The boundary problem highlights two competing principles for drawing the line, and your conflict is a textbook example of this clash.

  *   **The All-Affected Principle (Renters' Argument):** Anyone affected by a decision should have a say. Renters are affected by noise rules, pool hours, and elevator maintenance. Excluding them creates a "democratic deficit" where those experiencing the consequences have no voice.
  *   **The All-Subjected/Property Principle (Owners' Argument):** Anyone subject to the legal and financial liability should have a say. Owners pay the mortgages, the special assessments, and hold the equity. If the association goes bankrupt or gets sued, the owners lose assets; the renters just move.
  *   **Implication:** Recognizing this helps you stop talking past each other. The argument isn't about "democracy" vs. "autocracy"; it's about which boundary principle is more appropriate for a *private corporation* (the condo) vs. a *community*. If you frame it as "Who bears the financial risk?" owners win. If you frame it as "Who lives with the daily rules?" renters win.

  ### 3. The Legitimacy Trap
  When the boundary of the electorate feels arbitrary or unjust, the **legitimacy** of the authority erodes.

  *   **Implication:** If absentee landlords make decisions that negatively impact daily quality of life (e.g., banning grills, restricting guest parking), renters may view the rules as illegitimate.
  *   **Risk:** In a state, illegitimacy leads to protest. In a condo, it leads to **non-compliance**. Renters might ignore rules they had no hand in making. Owners might find themselves constantly enforcing rules against a hostile population. This increases friction, legal costs, and community toxicity.
  *   **The Absentee Factor:** The boundary problem is exacerbated by absentee landlords. If the "owner" is an investor who has never seen the unit, their claim to represent the "interests of the building" is theoretically weaker than the resident's, even if their property right is stronger.

  ### 4. The Amendment Trap (Practical Circularity)
  This is the most frustrating practical implication. To change the boundary (give renters votes), you usually have to amend the Bylaws.

  *   **The Catch:** Amending Bylaws almost always requires a supermajority vote of the **current voting members** (the owners).
  *   **Implication:** The group currently holding the power (owners) must vote to dilute their own power to include the excluded group (renters). The boundary problem manifests here as a **collective action problem**. Even if owners agree it's "fair," they may fear that renters will vote for lower fees or higher maintenance spending, incentivizing owners to vote "no" on the amendment.
  *   **Result:** The boundary is likely to remain static not because it's "right," but because the mechanism to change it is controlled by those who benefit from the current boundary.

  ### 5. Workarounds: Decoupling "Voice" from "Vote"
  Since the boundary problem suggests you can't easily change the *formal* boundary without breaking the legal framework, democratic theory suggests looking for **functional** inclusion.

  *   **Advisory Councils:** Create a "Residents' Committee" (renters and owners) that must be consulted before the Board votes. This gives renters a voice (addressing the All-Affected principle) without giving them fiduciary liability or voting power (protecting the Property principle).
  *   **Proxy Requirements:** The association could pass a rule (if allowed by Bylaws) requiring absentee landlords to designate a proxy who lives in the unit, or to survey their tenants before casting a vote on quality-of-life issues.
  *   **Lease Mandates:** The Association can require that all leases include a clause stating the tenant is bound by association rules, *but* also require landlords to provide tenants with meeting minutes and notice of meetings.

  ### Summary for Your Argument
  When you are in these meetings, you can use the boundary problem to clarify the stalemate:

  1.  **Acknowledge the Legal Reality:** Admit that the Bylaws define "the people" as owners. You can't just vote to change that today.
  2.  **Highlight the Legitimacy Cost:** Argue that while owners *can* vote, the decisions lack *authority* if the people living there feel unrepresented. This leads to enforcement nightmares.
  3.  **Propose a Hybrid:** Suggest that while the *legal boundary* (voting) stays with owners, the *consultative boundary* (input) should include renters.

  **Disclaimer:** *I am an AI, not an attorney. Condo laws vary significantly by state and province. You should consult your specific Bylaws and potentially legal counsel before attempting to change voting structures or interpretation of governing documents.*
