      *   Use the theory to illuminate the practical deadlock.
      *   *Self-Correction during drafting:* Make sure to mention that changing the bylaws usually requires a supermajority of *owners*, which reinforces the circularity problem (renters can't vote to give themselves the vote).

  7.  **Final Polish:** Check for clarity on legal vs. theoretical distinctions. Ensure the distinction between a state and a private association is clear (state law overrides internal votes).

