answer: |-
  **The Null Target**

  The alarm on the monitor didn't beep. It just flashed a soft, indifferent green. *Nociceptive Input: 0.00.*

  Elias gripped the arms of the chair, his knuckles white, sweat beading on a forehead that shouldn't be wet. He was screaming. He knew he was screaming because he could hear the raw, ragged tear of his own voice, but he couldn't feel his throat working. He couldn't feel the air moving in or out. He could only feel the fire.

  It was a white-hot brand pressed against his left shin. It was the specific, nauseating crunch of a bone breaking. It was the chemical sting of inflammation flooding tissue.

  "Stop," Elias gasped, the word forming in a mind that felt entirely detached from the mouth speaking it. "It's... it's burning."

  Dr. Vane didn't look at the shin. She looked at the second monitor, the one tracking the prefrontal cortex. That screen was a storm of red spikes.

  "Your tibia is intact, Elias," Vane said, her voice level, almost bored. "Your peripheral nerves are sedated. There is no signal coming from the leg. There is no damage. There is no fire."

  "Then why does it hurt?"

  "Because you think it does."

  Vane tapped a key, and the red spikes on the upper monitor pulsed. "We calibrated the Higher-Order scanner this morning. Your first-order states are silent. Your sensory cortex is dark. But your metacognitive monitoring system? It's firing like a machine gun. You are generating a Higher-Order Thought: *I am in pain.* And because that thought exists, the pain exists."

  Elias squeezed his eyes shut. The logic was a cold stone in his gut, heavier than the agony in his leg. This was the procedure. *Metacognitive Decoupling.* The theory was that chronic pain sufferers were trapped in a loop where the brain's monitoring system wouldn't let the pain signal fade, even after the body healed. The cure was to sever the link. To let the body speak without the mind listening, or the mind listen without the body screaming.

  But they had cut the wire too clean. The monitor was still on, but the broadcast was gone.

  "It's a hallucination," Elias said, trying to reason through the white noise. "If there's no nerve signal, it's not real pain. It's... it's fake."

  Vane leaned forward. "That's the intuitive trap, Elias. Dana would agree with you. She argues that if there's no target, the arrow misses. But Rosenthal knew better. Consciousness isn't about the world. It's about how the world seems to you. If your brain represents you as being in pain, you are in pain. The suffering is in the representation, not the tissue."

  Elias looked down at his leg. It looked pale, resting peacefully on the rest. He waved a hand over it. No heat radiated from the skin. He pinched the calf. He felt the pressure of his fingers, a dull mechanical touch, but no pain from the pinch. Only the roaring, independent inferno that the thought *I am in pain* conjured out of nothing.

  It was a ghost. A targetless arrow that still drew blood.

  "Turn it off," Elias begged.

  "We can't suppress the HOT without suppressing consciousness itself," Vane said. "If we dampen the monitoring system enough to stop the pain report, you won't be conscious of anything. Not the pain, not the chair, not me. You'll be asleep."

  "So I have to choose between being unconscious and being tortured by a ghost?"

  "You have to choose between biological truth and phenomenological truth." Vane stood up and walked to the window. Outside, the city was gray and wet. "You asked me if you were suffering. That's the question that breaks people. If your body is safe, are you truly suffering? Or are you just... mistaken?"

  Elias closed his eyes again. He focused on the sensation. Usually, pain was a messenger. It meant *pull away*, *heal*, *danger*. It had a purpose. It was tethered to survival.

  This pain had no tether. It was pure information without a source. It was a letter that had been mailed to a house that didn't exist, yet the recipient was opening it and reading the words aloud.

  *I am in pain.*

  The thought wasn't describing a state. It was creating one.

  "It feels... lonely," Elias whispered.

  Vane turned back. "Lonely?"

  "There's nothing underneath it," Elias said, the realization cutting through the agony. "Usually, the pain is heavy because the body is heavy. The nerve is firing, the muscle is spasming. There's weight to it. This... this is light. It's just the label. It's the word 'FIRE' written in neon on a black screen. There's no building burning. Just the sign."

  He took a breath. The green monitor stayed steady. *Nociceptive Input: 0.00.*
  The red monitor screamed. *Awareness: CRITICAL.*

  "If I believe it's fake," Elias said, testing the weight of the words, "does it go away?"

  "No," Vane said softly. "That's the bullet we have to bite. Knowing it's a targetless HOT doesn't stop the HOT from happening. You can know the stick in the water isn't bent, but it still looks bent. You can know the nerve is silent, but if the thought says 'burn,' you burn. The seeming *is* the reality."

  Elias slumped back. The irony was suffocating. He was the safest he had been in ten years. His body was a pristine instrument, silent and whole. And he was in hell.

  He realized then why Dana would hate this. To her, this proved the theory was broken. A theory of consciousness that allowed for suffering without a sufferer (in the biological sense) was a monster. It made the mind a tyrant that could torture the body for no reason, with no recourse, justified only by its own erroneous reports.

  But Elias... Elias felt a strange, terrible clarity.

  For years, he had fought his body. He had hated his nerves, his spine, his chemistry. He had treated his pain as an enemy invasion. Now, the invasion was internal. The enemy was the witness.

  "Does it matter?" Elias asked.

  Vane paused. "Does what matter?"

  "If the building isn't burning. If the sign is just... on. Does the fire department still come?"

  "We don't have a fire department for this, Elias."

  "Then I'm just the sign," he said.

  He sat there for a long time. The green light remained a calm, mocking zero. The red light pulsed, a heartbeat of pure, uncaused agony. He waited for the pain to feel illegitimate. He waited for the knowledge of the null target to invalidate the suffering.

  It didn't.

  The tear that rolled down his cheek was salty and wet. He felt the track of it. That was a first-order state. Real. Verified. But the grief behind the tear? That was just another thought. *I am sad.*

  He stood up. His leg held his weight perfectly. There was no limp. There was no reason to limp. But as he took a step, the HOT fired. *I am limping. I am in pain.*

  And so he limped.

  "Same time tomorrow?" Vane asked, picking up her tablet.

  Elias looked at the door. He could walk out. He could go home to a body that was whole. He could live in a world where he was objectively healthy and subjectively broken. He could be a living refutation of the idea that pain means damage.

  "Yeah," Elias said. He opened the door. The hallway was quiet. "Same time."

  He walked down the hall, careful not to put weight on a leg that didn't hurt, screaming silently inside a head that wouldn't stop watching him burn. He was the most conscious he had ever been, and he was entirely alone with a fire that existed only because he knew it was there.
