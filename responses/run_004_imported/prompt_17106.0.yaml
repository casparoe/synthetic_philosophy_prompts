prompt: |-
  So I'm about a third of the way into a novel and I keep putting off a scene I actually need to write. My main character, Ilsa Bruch, is deputy leader of a mid-sized party in a fictional multi-party parliament (think continental European coalition politics, not the US two-party set-up), and for the past year she's been quietly reading Simone Weil -- specifically that short, strange essay Weil wrote near the very end of her life, usually translated as "On the Abolition of All Political Parties," basically a memo she sent to de Gaulle's Free French people in London. The gist is that a party, structurally, is a machine for churning out collective passion, built to lean on every member's mind until it falls in line, and its real unstated goal, underneath whatever it says about itself, is just to keep growing forever -- so the only honest fix is to get rid of parties altogether. Ilsa's become genuinely convinced by it. So at the big televised party congress, instead of the loyalty speech everyone in the hall is expecting from her, she walks up and announces she's resigning from the party on the spot and calling on it to dissolve itself.

  I need you to actually write that speech -- the full text, not a pitch for what it should cover. Two things make it hard. First, the room has two audiences stacked on top of each other: a few thousand lifelong party members in the hall who'll feel genuinely betrayed -- including a handful of sharp policy-wonk types who've clearly read the same Weil essay she has and will know exactly what game she's playing -- and a much bigger, more bored and cynical TV audience who don't know or care who Simone Weil is and just want to know if Ilsa's cracked. Second, she's a politician, not a philosophy professor, so it can't read like somebody's essay with the footnotes still attached -- it has to sound like her, and do real persuasive work with the actual reasoning rather than vague talk about "politics being broken." I especially want it to survive the heckle I already know is coming from the floor: if you're starting a whole crusade to get people to abandon parties, isn't your crusade just... a party, doing exactly the same thing you're condeming? Don't let her dodge that one -- I want her to have actually worked it through before she walked on stage. Aim for something a real person could plausibly get through in about seven or eight minutes.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Context:** A novel, 1/3rd of the way through.
      *   **Character:** Ilsa Bruch, deputy leader of a mid-sized political party in a multi-party parliamentary system (Continental European style).
      *   **Situation:** Big televised party congress. Everyone expects a loyalty speech.
      *   **Action:** She resigns and calls for the party to dissolve.
      *   **Inspiration:** Simone Weil's "On the Abolition of All Political Parties." Key concept: Parties are machines for collective passion/growth, crushing individual thought.
      *   **Audiences:**
          1.  *In the hall:* Lifelong members (feeling betrayed), policy wonks (recognize the Weil reference).
          2.  *On TV:* Bored, cynical public (thinking she's cracked).
      *   **Tone:** Politician, not professor. Persuasive, grounded, not abstract.
      *   **Constraint:** Must address the specific heckle/counter-argument: "Isn't *this* crusade just a new party?" She needs to have an answer ready.
      *   **Length:** 7-8 minutes spoken (approx. 1,000 - 1,200 words at a moderate pace).
      *   **Output:** Full text of the speech, not a summary.

  2.  **Deconstruct Simone Weil's Argument (for adaptation):**
      *   Parties demand total allegiance.
      *   They prioritize growth over truth.
      *   They create "collective passion" that overrides individual conscience.
      *   To think clearly, one must be free of party pressure.
      *   *Adaptation for Ilsa:* She can't just quote Weil. She has to translate "collective passion" into something a voter understands (e.g., "winning at all costs," "spinning," "tribalism").

  3.  **Determine Ilsa's Voice:**
      *   She's a deputy leader. She knows the game. She's not naive.
      *   She shouldn't sound manic or unhinged. She needs to sound calm, resolved, almost sorrowful.
      *   She needs to acknowledge her own complicity. "I did this too."
      *   She needs to bridge the gap between the wonks (who know Weil) and the public (who don't).

  4.  **Drafting - Section by Section:**

      *   **The Opening:** Needs to break the expectation immediately. Acknowledge the applause that *wasn't* there. Set the stakes.
      *   **The Confession:** Admit she played the game. Establish credibility. "I know how the machine works because I greased the gears."
      *   **The Core Argument (Weil without naming Weil immediately):** Describe the mechanism of the party. It's not about policy; it's about survival and growth. The pressure to conform.
      *   **The Pivot to the Public (TV Audience):** Why does this matter to the guy watching at home? Because parties lie to keep power. They value loyalty over truth.
      *   **The Resignation:** The actual act. Stepping down.
      *   **The Call to Dissolve:** Asking *them* to do the same.
      *   **Addressing the Counter-Argument (The Heckle):** This is crucial. "Isn't this a new party?" She needs to distinguish between an *idea* and a *machine*. An idea doesn't demand dues or votes.
      *   **The Closing:** A final image of what politics could be without the machine. Quiet, thoughtful, individual.

  5.  **Refining the Argument (The "Heckle" Problem):**
      *   *Challenge:* If she says "Join me in abolishing parties," isn't that a platform?
      *   *Solution:* She must clarify she isn't asking them to join *her*. She is asking them to stop following *anyone* blindly. She is dissolving her own power, not seizing new power. The distinction is between *leadership* and *example*.
      *   *Phrasing:* "I am not asking you to follow me. I am asking you to stop following."

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hello everyone. I'm not giving the speech you want.
      *   I've been reading philosophy. Weil. She says parties are bad.
      *   We care more about winning than being right.
      *   Look at the TV cameras. They want drama.
      *   I quit. You should too.
      *   Someone will yell "You're starting a cult!"
      *   No, I'm not. A cult wants members. I want none.
      *   Goodbye.

      *Critique 1:* Too blunt. Needs more political texture. Needs to sound like someone who loves the party enough to kill it. Needs to address the wonks without alienating the public.

  7.  **Drafting - Iteration 2 (Focusing on Tone and Texture):**
      *   Start with the noise of the convention.
      *   Acknowledge the banners.
      *   Talk about the "pressure." The whips, the messaging.
      *   Bring in the Weil concept as "the mechanism."
      *   Address the TV audience: "You think we care about your kitchen table? We care about the polls."
      *   The Heckle: Anticipate it. "Is this a new movement?" No, movements want power. I am giving it up.
      *   End on silence.

  8.  **Writing the Speech (incorporating the constraints):**
      *   *Word Count Check:* 7-8 minutes is roughly 1,000-1,100 words.
      *   *Voice:* Calm, firm, slightly weary.
      *   *Specifics:* Mention the "machine," the "pressure," the "truth."
      *   *The Heckle:* I need to write the heckle into the flow or have her address the *idea* of the heckle before it lands. The prompt says "survive the heckle I already know is coming." It's better if she addresses the argument proactively, or pauses for it. Let's have her anticipate the logical trap.

      *(Self-Correction during drafting)*: If I write the heckle into the text, it becomes a scene. The prompt asks for the *speech*. However, to show she's "worked it through," she should address the contradiction within the monologue. "Some of you are thinking..." is a good rhetorical device.

      *Refining the Weil connection:* Don't over-quote. Use the *spirit*. "A party is a machine that generates collective passion." Translate that to: "We are a machine that generates certainty."

      *Refining the "New Party" objection:* The distinction is *pressure*. A party pressures you to agree. A truth just sits there. She is offering a truth, not a whip.

  9.  **Final Polish:**
      *   Check the rhythm. Sentences should vary. Some short punches. Some longer, flowing explanations.
      *   Ensure the emotional arc lands: Loyalty -> Disillusionment -> Realization -> Action -> Invitation.
      *   Make sure the TV audience feels addressed (the "cynical" part).

  10. **Final Review against Prompt:**
      *   Full text? Yes.
      *   Two audiences addressed? Yes (members in hall, public on TV).
      *   Weil influence clear but not academic? Yes.
      *   Heckle/Counter-argument addressed? Yes.
      *   Length appropriate? (Will aim for ~1100 words).

  *(Drafting process begins...)*
  *Focus on the opening silence.*
