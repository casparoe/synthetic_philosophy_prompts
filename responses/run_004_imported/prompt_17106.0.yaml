answer: |-
  (She steps to the podium. The applause from the introduction dies out, leaving a expectant hum. She adjusts the microphone, not looking at her notes. She looks at the back of the hall, then at the cameras.)

  Friends. Colleagues. Citizens watching at home.

  I was supposed to stand here today and tell you how hard we've fought. I was supposed to talk about our polling numbers in the Rust Belt, our coalition leverage, and the brilliant messaging strategy we've devised for the autumn session. I was supposed to tell you that if we just work harder, knock on more doors, and dominate the news cycle a little more fiercely, we can save the country.

  I am not going to do that.

  Because for the last year, I have been asking myself a question that kept me awake while you were all sleeping. It is a simple question. *What are we for?*

  Now, I know the answer you've been taught. We are here to serve the public good. We are here to implement policy. But look around this hall. Look at the banners. Look at the way we cheer when the leadership panel walks in, and the way we go silent when a dissenting voice is raised. We are not a community of thinkers. We are a machine.

  And like any machine, we have a primary function. It isn't justice. It isn't truth. It is *growth*.

  A political party is structurally designed to do one thing: it presses upon the mind of every single member until that mind aligns with the collective. It doesn't matter if you joined because you care about healthcare, or climate, or wages. Eventually, the question changes. It stops being "Is this policy right?" and starts being "Is this policy good for *us*?"

  I know this because I have done it. I have sat in backrooms and watched good people swallow their consciences because the whip needed a vote. I have seen us twist a complex truth into a slogan because the slogan tested better with undecideds. We tell ourselves we are compromising for the greater good. But we aren't. We are feeding the machine. We are prioritizing the survival of the organization over the reality of the world.

  To those of you watching on television who think I've lost my mind: I know you're cynical. You think politicians are liars. You're right. But not because we are evil. It's because the structure makes it impossible to be honest. To stay in this party, I have to agree with things I know are wrong. To stay in this parliament, I have to pretend that the party across the aisle is an enemy to be defeated rather than a neighbor to be persuaded.

  So, effective immediately, I am resigning my position as Deputy Leader. I am resigning my seat in the parliament. And I am calling on this party—not just my colleagues, but every party in this chamber—to dissolve itself.

  (A murmur ripples through the crowd. Someone shouts from the floor: *"Then what? You think people will just stop organizing?"*)

  I hear you. And it is the right question.

  If I stand here and tell you to abolish parties, am I not just starting a new one? Am I not creating a faction of "anti-factionists"? Isn't this speech just a campaign platform for a movement of one?

  It is a trap. I have walked into it on purpose.

  Here is the difference. A party asks for your membership. It asks for your dues, your vote, your loyalty, and your anger. A party says, "Join me, and we will crush them."

  I am not asking you to join me. I am asking you to stop following.

  I am not offering you a new leader. I am not offering you a new whip. I am offering you a silence. I am suggesting that for the first time in our lives, we might try to look at a problem without first checking what our team thinks about it.

  To the policy wonks in the third row who know where I've been getting my ideas: You know the text. You know the argument. You know that truth is a matter of attention, not consensus. Truth is not something you vote on. It is something you uncover. And you cannot uncover it if you are wearing blinders painted with party colors.

  To the members in the back who feel betrayed: I love you. I love this work. But I love the truth more than I love this club. And I cannot ask you to give me your loyalty anymore. I won't take it.

  (She leans in closer to the microphone.)

  I know what happens tomorrow. The press will say I've cracked. The opposition will say we are weak. The polls will say we are finished. They will treat this like a tactical blunder. They will analyze my resignation as a maneuver to gain leverage.

  That is the machine talking. That is the part of you that cannot imagine a world without the game.

  But imagine it. Imagine a parliament where representatives are not bound by a whip. Where they vote according to their conscience and the evidence before them, not according to a strategy memo. Imagine a politics that isn't a war of tribes, but a gathering of neighbors.

  Is it dangerous? Yes. Without parties, there is no one to blame but ourselves. There is no shield. We stand exposed to the complexity of the world.

  But isn't that what we owe the people watching on their screens? Isn't that what we owe our children? To stop pretending that we have all the answers? To stop selling them certainty when we only have doubt?

  I am not leading a crusade. A crusade wants converts. I want nothing from you. I am simply turning off the machine.

  My staff has already packed my office. The keys are on the desk. I am walking out of this hall, and I am not coming back to claim a title. I invite you to do the same. Not to follow me out the door, but to walk out of the shadow of the party you stand in.

  Keep your policies. Keep your passions. But drop the machinery that turns them into weapons.

  Thank you.

  (She steps back. She does not wait for applause. She gathers her papers, leaves them on the podium, and turns to walk away.)
