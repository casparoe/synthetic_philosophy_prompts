answer: |-
  You have hit on one of the most fascinating and under-appreciated secrets in the history of philosophy. You are absolutely right: modern biographers often treat Sidgwick's involvement with the Society for Psychical Research (SPR) as a Victorian eccentricity, but scholars like Bart Schultz and Alan Gauld have shown that it was actually a **desperate rescue mission for his ethical system.**

  Here is the logical link, spelled out in plain terms, connecting the "Dualism of Practical Reason" to the search for ghosts.

  ### 1. The Ethical Problem: The "Dualism of Practical Reason"
  In his masterpiece, *The Methods of Ethics*, Sidgwick breaks down how rational people decide what to do. He identifies two main "methods" that both seem perfectly rational:

  *   **Rational Egoism:** It is rational to maximize my own happiness. (Why? Because I am me, and my good matters to me.)
  *   **Rational Utilitarianism:** It is rational to maximize the general happiness. (Why? Because from the point of view of the Universe, my good is no more important than anyone else's.)

  **The Conflict:** In this life, these two often crash into each other.
  *   *Example:* If I tell the truth, I might lose my job and suffer (bad for Egoism), but society benefits from honesty (good for Utilitarianism).
  *   *Example:* If I sacrifice my life to save five others, that is Utilitarian perfection, but Egoistic suicide.

  **The Crisis:** Sidgwick argued that for morality to be truly **rational**, there cannot be a permanent contradiction between what is best for *me* and what is *right*. If Reason tells me to do X (be good) but also tells me to do Y (look out for #1), and X and Y are opposites, then Reason is broken. Sidgwick called this the "fundamental contradiction." If he couldn't solve it, ethics collapses into "chaos."

  ### 2. The Traditional Solution (Religion)
  For centuries, Christianity solved this problem for philosophers. The logic went like this:
  *   God exists.
  *   God rewards virtue and punishes vice in the afterlife.
  *   Therefore, in the **long run**, being moral *is* in your self-interest.

  If you suffer now for doing the right thing, you get Heaven later. If you prosper now by doing wrong, you get Hell later. This harmonizes Egoism and Utilitarianism. Your self-interest and your duty become the same thing.

  ### 3. Sidgwick's Dilemma
  Sidgwick was effectively an agnostic (some argue a secret atheist). He couldn't just *assume* God or Heaven existed. He was a rigorous empiricist; he needed evidence. Without the guarantee of an afterlife where justice is served, the "Dualism" remains unresolved. Without that resolution, being moral is not necessarily rational.

  This terrified him. He wrote to a friend that if he couldn't reconcile duty and self-interest, he might as well stop trying to be moral.

  ### 4. Enter Psychical Research (The Logical Link)
  This is where the ghosts come in. Sidgwick didn't join the SPR because he loved spooky stories. He joined because he thought **psychical research was empirical theology.**

  He reasoned that if science could prove **survival after death**, it would provide the missing premise needed to fix his ethics.

  Here is the step-by-step logical chain Sidgwick was hoping to validate:

  1.  **Premise 1:** Morality is only rational if Duty and Self-Interest ultimately align.
  2.  **Premise 2:** In this earthly life, Duty and Self-Interest often conflict.
  3.  **Conclusion 1:** Therefore, there must be a future existence where they align (where the virtuous are happy and the wicked are not).
  4.  **Premise 3:** We cannot know this future existence exists through faith alone (faith is not scientific proof).
  5.  **Premise 4:** If mediums, telepathy, or apparitions can be scientifically verified, they prove consciousness survives death.
  6.  **The Goal:** If we prove survival, we can investigate the *conditions* of that survival. If we find evidence that the afterlife is morally ordered (i.e., good spirits progress, bad spirits suffer), then **Egoism and Utilitarianism are harmonized.**

  ### 5. Why "Ghosts" Specifically?
  To Sidgwick, a verified mediumistic message wasn't just a parlor trick; it was data points for the **moral structure of the cosmos.**

  If he could prove that a deceased person communicated through a medium, he proved **immortality**. If he could gather enough data to show that the "next world" operated on moral laws, he proved **Divine Justice**.

  If Divine Justice is empirically real, then the "Dualism of Practical Reason" dissolves. It becomes rational to be a utilitarian because, in the grand calculus of eternity, the utilitarian choice *is* the egoistic choice.

  ### The Tragic Ending
  The tragedy of Sidgwick's life is that **he never found the proof.**

  He spent decades investigating mediums, exposing frauds, and analyzing data with the same rigor he applied to ethics. But the evidence remained ambiguous. He died without resolving the Dualism. In the final edition of *The Methods of Ethics*, he leaves the contradiction standing, admitting that without a moral cosmic order, we are left with a "fundamental contradiction" in our deepest convictions.

  ### Summary
  So, to answer your question directly:
  *   **The Problem:** Reason demands I look out for myself, but also demands I sacrifice for others. These contradict.
  *   **The Fix:** They only stop contradicting if there is an afterlife where being good pays off for *me*.
  *   **The Role of Ghosts:** Proving spirits exist is the only scientific way to prove the afterlife exists without relying on religious faith.
  *   **The Link:** Psychical research was Sidgwick's attempt to use science to save morality from irrationality.

  You sensed correctly: it wasn't a hobby. It was the structural keystone he was trying to forge to keep his entire philosophical cathedral from collapsing.
