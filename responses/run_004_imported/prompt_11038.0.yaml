prompt: |-
  So I've been down a rabbit hole reading about Henry Sidgwick for a piece, and I can't quite square something. He's this famously careful, rigorous utilitarian philosopher, but he also spent decades chasing mediums and ghosts as a founder of the Society for Psychical Research -- most bios just wave it off as an embarassing side hobby of his. But I get the sense there's an actual philosophical throughline connecting that to the "dualism of practical reason" stuff in his Methods of Ethics (something about the "cosmos" of duty collapsing into "chaos"?). Can you spell out, in plain terms, how proving ghosts/life-after-death were real was actually supposed to fix a real problem in his ethics? Like, what's the logical link between "spirits exist" and "egoism and utilitarianism don't actually contradict each other"?
reasoning: |-
  Here's a thinking process that leads to the explanation of the connection between Sidgwick's psychical research and his ethical dualism:

  1.  **Deconstruct the User's Query:**
      *   **Subject:** Henry Sidgwick (19th-century philosopher).
      *   **Core Tension:** Rigorous utilitarian ethicist vs. Founder of the Society for Psychical Research (SPR).
      *   **User's Intuition:** There's a philosophical throughline, not just an embarrassing hobby. Specifically, it connects to the "Dualism of Practical Reason" in *The Methods of Ethics*.
      *   **Specific Question:** How does proving ghosts/life-after-death fix the problem where egoism and utilitarianism contradict each other? What is the logical link?
      *   **Tone:** Plain terms, analytical, acknowledging the depth of the insight (validating the user's "rabbit hole" discovery).

  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Who was Sidgwick?* British utilitarian, contemporary of Mill, wrote *The Methods of Ethics*. Known for intellectual honesty and recognizing problems in utilitarianism.
      *   *What is the "Dualism of Practical Reason"?* In *Methods of Ethics*, Sidgwick argues that Reason dictates two ultimate ends: one's own happiness (Egoism) and the general happiness (Utilitarianism). In *this* life, they often conflict. Reason cannot decide between them without further premises. This leads to a potential collapse of moral rationality ("chaos").
      *   *What was his involvement with Psychical Research?* He was a founding member of the SPR (1882). He investigated mediums, telepathy, etc.
      *   *The Connection:* Sidgwick believed that if survival after death (with rewards/punishments or simply continued existence) could be scientifically proven, it would align self-interest (egoism) with duty (utilitarianism). If being good leads to eternal happiness, then it is rational to be good.
      *   *Is the user right?* Yes, absolutely. This is a well-documented but often under-emphasized aspect of Sidgwick scholarship (e.g., by scholars like Bart Schultz, Alan Gauld, etc.).

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Validate the User:** Start by confirming their intuition. It's not a quirk; it's integral to his system. Many biographers *do* wave it off, but modern scholarship takes it seriously.
      *   **Explain the Ethical Problem (The Dualism):**
          *   Need to define the two "Methods": Egoism (maximize my good) vs. Utilitarianism (maximize everyone's good).
          *   The Conflict: Sometimes, doing what's best for everyone hurts me (e.g., sacrificing my life, giving away wealth).
          *   The Stakes: If Reason can't tell me which to choose, morality is irrational. Sidgwick called this the "fundamental contradiction" or risk of "chaos."
      *   **Explain the Theological/Traditional Solution:**
          *   Historically, religion solved this. God ensures the virtuous are rewarded (Heaven) and the wicked punished (Hell).
          *   Therefore, *true* self-interest = being moral.
          *   Sidgwick was an agnostic/secret atheist (mostly). He couldn't rely on faith. He needed *evidence*.
      *   **Explain the Psychical Research Solution:**
          *   If science can prove survival after death, it provides the empirical data needed to replace religious faith.
          *   It's not about "ghosts" in the spooky sense, but about *empirical proof of a moral order*.
          *   If there's a future life where happiness is distributed according to virtue, Egoism and Utilitarianism harmonize.
      *   **The Logical Link (The "Spell Out"):**
          1.  Morality requires rationality.
          2.  Rationality requires that duty and self-interest ultimately align.
          3.  In this life, they don't always align.
          4.  Therefore, there must be a future state where they do align.
          5.  We need proof of that future state to remain rational moral agents.
          6.  Psychical research seeks that proof.
      *   **Nuance/Complication:** Did he actually find proof? No. He remained agnostic. This left him with the "chaos" he feared. This adds tragedy to his intellectual biography.

