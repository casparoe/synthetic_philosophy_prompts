answer: |-
  This is a fantastic observation, and it speaks well of your critical engagement that you aren't just accepting the "great man" narrative at face value. You have stumbled upon one of the most intriguing tensions in late-Victorian intellectual history.

  Your supervisor is giving you advice that is **pragmatically correct for the IB Extended Essay** but **philosophically incomplete.**

  Here is a breakdown of why your instincts are right, why your supervisor's advice is still the one you should follow for the essay itself, and how the two projects (Ethics and Psychical Research) actually do connect.

  ### 1. The Supervisor's Pragmatism (The IB Context)
  Your supervisor is right about the **word count and focus.** An IB Extended Essay on *The Methods of Ethics* needs to analyze the *arguments* within that text.
  *   **Relevance:** Sidgwick's ethical utilitarianism stands or falls on its logical coherence, not on whether he believed in ghosts. If his argument for Universal Hedonism is sound, it remains sound even if he was wrong about telepathy.
  *   **Risk:** In a 4,000-word essay, spending 500 words on séances is a luxury you likely cannot afford. It risks looking like biographical padding rather than philosophical analysis.
  *   **Verdict:** For the purpose of getting a high grade on the EE, treat the psychical research as context, not content. Do not make it a central pillar of your argument.

  ### 2. Addressing Suspicion 1: Does this undermine his rigor?
  You suspected that devoting decades to "ghost-hunting" should lower our confidence in him as a rigorous thinker. Historians of philosophy generally argue the opposite.

  Sidgwick did not approach psychical research as a believer; he approached it as an **empiricist.**
  *   **The Victorian Crisis of Faith:** Sidgwick lived in an era where traditional religious authority was collapsing under the pressure of Darwinism and higher biblical criticism. He lost his own Christian faith early on but felt the *need* for the moral order that religion provided.
  *   **Scientific Method:** He didn't join the Society for Psychical Research (SPR) to confirm a dogma; he joined to see if the *scientific method* could be extended to human consciousness. He was famously skeptical. He resigned from the SPR temporarily over concerns about fraud (specifically regarding the medium Eusapia Palladino, though that was later in the SPR's history, Sidgwick was always wary of deception).
  *   **Consistency:** This actually *reinforces* his philosophical profile. In *The Methods of Ethics*, Sidgwick is the great systematizer who tries to bring clarity to moral intuitions. In the SPR, he tried to bring clarity to anomalous data. In both cases, he was driven by a desire to find **certainty through systematic inquiry** rather than tradition or blind faith.

  So, no, it does not make him credulous. It makes him a radical empiricist who believed that if evidence for survival of death existed, it should be found through data, not scripture.

  ### 3. Addressing Suspicion 2: Is it compartmentalized or connected?
  You suspected these were separate projects. They were distinct, but they were **not compartmentalized.** They were two wings of the same philosophical house.

  Here is the connection that your supervisor might be overlooking: **The Dualism of Practical Reason.**

  In *The Methods of Ethics*, Sidgwick arrives at a troubling conclusion he calls the "Dualism of Practical Reason." He finds that:
  1.  **Rational Egoism** (it is rational to pursue my own happiness) is self-evident.
  2.  **Utilitarianism** (it is rational to pursue the universal good) is also self-evident.
  3.  **The Conflict:** Sometimes, my own happiness conflicts with the universal good.
  4.  **The Problem:** Without a God or an Afterlife to reward virtue and punish vice (aligning self-interest with duty), there is no rational proof that being moral is the best choice for the individual.

  **This is where Psychical Research comes in.**
  Sidgwick hoped that psychical research might provide empirical evidence for **survival after death.** If he could prove scientifically that consciousness survives death, he might be able to show that the universe is morally ordered—that virtue *is* ultimately rewarded. This would solve the Dualism of Practical Reason.

  *   **Ethics** identified the problem (the potential irrationality of morality without divine order).
  *   **Psychical Research** was the attempted empirical solution (searching for evidence of that divine/moral order).

  So, you are missing something if you view them as totally separate. The psychical research was the **existential motivation** behind the ethical rigor. He needed ethics to be rational, but he feared the universe made it impossible. He spent 25 years looking for a loophole.

  ### 4. Strategic Advice for Your Extended Essay
  You are now in a position to use this insight without violating your supervisor's instructions.

  **Do not:**
  *   Write a section on "Sidgwick and Ghosts."
  *   Argue that his utilitarianism depends on telepathy.
  *   Use word count analyzing the SPR's findings.

  **Do:**
  *   **Use it in the Introduction:** You can briefly mention that Sidgwick's philosophical project was driven by a post-religious search for certainty. This frames *why* he is so obsessed with coherence and self-evidence in *The Methods of Ethics*.
  *   **Use it in the Conclusion:** When discussing the "Dualism of Practical Reason," you can note that Sidgwick himself recognized this as the deepest failure of his system. You can add a single sentence noting that his later investment in psychical research was an attempt to find empirical grounds to resolve this dualism, highlighting how deeply the problem troubled him.
  *   **Focus on the Epistemology:** If you discuss his method (Intuitionism vs. Empiricism), you can note that his commitment to evidence was so strong he applied it even to consciousness itself. This strengthens your analysis of his rigor.

  ### Summary
  Your supervisor is protecting you from going down a biographical rabbit hole that could cost you marks on **Criterion A (Focus and Method)**. However, your intuition is philosophically superior. Sidgwick's psychical research was not a hobby; it was the **empirical arm of his moral anxiety.**

  He was trying to save morality from a godless universe. When philosophy (*The Methods of Ethics*) couldn't guarantee that the universe was moral, he turned to science (the SPR) to see if the data could.

  **Recommendation:** Keep the EE focused on the text of *The Methods of Ethics* as your supervisor says, but let this background knowledge deepen your understanding of *why* Sidgwick argues the way he does. It will make your analysis of the "Dualism of Practical Reason" much more nuanced, even if you don't explicitly cite the séances. Save the full story of the SPR for your university personal statement or a university-level paper—it's a brilliant talking point that shows you understand the man behind the theory.
