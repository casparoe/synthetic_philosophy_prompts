answer: |-
  Here are ten interview questions designed to probe the tensions in your guest's reconstruction, complete with anticipated follow-ups.

  **1. The Juridical vs. Prudential Distinction**
  Your reconstruction hinges on the distinction between the *tyrannus ex defectu tituli* (the usurper) and the *tyrannus ex parte exercitii* (the legitimate ruler who governs tyrannically). You argue Aquinas treats the former as a private aggressor and the latter as a public authority gone wrong. But isn't there a risk that this distinction is purely juridical in a way that ignores the phenomenological reality of the subject? To the suffering citizen, the violence inflicted by a usurper and a hereditary tyrant feels identical. Why should the metaphysical origin of the ruler's power dictate the moral licitness of resistance when the material outcome for the common good is the same?

  *   **Follow-up:** If she argues that justice concerns *rights* rather than *consequences*, press her on whether Aquinas's natural law tradition allows for a separation of juridical status from the tangible flourishing of the community. If the common good is the standard, does the "title" matter if the "exercise" destroys that good regardless of origin?

  **2. The "Convenient Asymmetry" Objection**
  I want to put a specific objection to you that I've heard from colleagues. Critics suggest this title/exercise distinction functions as a "convenient asymmetry": it allows Aquinas to condone killing usurpers in the abstract—perhaps foreign enemies or schismatic antipopes—while insulating actually-existing Christian kings from the same logic. If the prudential worries Aquinas raises in *De Regno*—that assassins are ambitious, that successors are often worse, that good rulers are endangered by the precedent—apply with exactly the same force to a usurper as to a hereditary tyrant, isn't the distinction functionally hollow?

  *   **Follow-up:** If she maintains the prudential risks are secondary to the juridical right, ask her why Aquinas bothers with the prudential warnings at all if they don't actually constrain the *licitness* of the act. Does this not suggest that for Aquinas, prudence *is* part of the moral calculus, thereby undermining the absolute prohibition on killing legitimate tyrants?

  **3. Reconciling Endurance and Resistance**
  In the securely authentic early chapters of *De Regno*, Aquinas seems to counsel a high degree of endurance, warning that removing a tyrant often leads to greater tyranny. Yet, elsewhere in the corpus, there is a more permissive treatment of killing usurpers. How do you reconcile this caution-counsels-endurance argument of the authentic early chapters with the more permissive treatment of usurpers found elsewhere without making Aquinas seem contradictory? Is the permission to kill a usurper an exception, or is the counsel to endure a rule of thumb that yields when the tyranny becomes intolerable?

  *   **Follow-up:** If she argues it depends on the "degree" of tyranny, ask her where the threshold lies. If the threshold is "intolerable," doesn't that effectively grant the private individual the judgment power Aquinas explicitly denies them in the case of legitimate kings?

  **4. Textual Authenticity and Ptolemy of Lucca**
  We have to address the textual elephant in the room. The later books of *De Regno* were completed by Ptolemy of Lucca after Aquinas's death, and Ptolemy's sympathies run considerably more republican than anything in the earlier, securely authentic chapters. How much interpretive weight does your reconstruction place on material that is not securely Aquinas's own? Are we reading a Thomistic theory of tyrannicide, or are we reading a Thomistic-Ptolemaic hybrid that smooths over the cracks in Aquinas's own thought?

  *   **Follow-up:** If she argues that Ptolemy was a faithful disciple merely completing Aquinas's thought, ask her to account for Ptolemy's known independent advocacy for republican city-states. Is it possible Ptolemy used Aquinas's authority to bolster a more radical position on public deposition than Aquinas would have held?

  **5. The Mechanism of Public Deposition**
  You argue that a legitimate tyrant may be removed solely through the action of the public body that first instituted him. But in a medieval monarchy, by what mechanism does this "public body" convene? If the king controls the writs, the courts, and the military, how does the "public authority" assemble to judge him without already being in a state of rebellion? Does Aquinas provide a procedural account of deposition, or is this a theoretical right without a practical pathway?

  *   **Follow-up:** If she suggests the "community" retains a latent power, ask her how that power is activated. If it requires a leader to organize the community, doesn't that leader effectively become a private person initiating violence, collapsing the distinction back into the very private assassination Aquinas forbids?

  **6. The Problem of Captured Authority**
  Following on that, what happens in the specific case where the public authority responsible for deposing a tyrannical-but-legitimate ruler is itself captured by or complicit with the tyrant? If the barons are bribed or the parliament is packed, the "public" channel is blocked. Does your reading of Aquinas allow for the authority to devolve back to the people in this specific instance, or does it demand submission until the public body miraculously frees itself?

  *   **Follow-up:** If she concedes that authority devolves back to the people, press her on whether this devolution effectively authorizes private violence. At what point does "public action" become indistinguishable from a coordinated private uprising?

  **7. The Nature of "Private" Violence**
  Aquinas forbids private violence against a legitimate tyrant, but he allows it against a usurper. But consider a scenario where a private citizen kills a usurper without any public mandate. Isn't that citizen still acting on private judgment? If we accept that private judgment is licit in the case of the usurper because there is "no appeal to a higher authority," why does that logic not trigger for the legitimate tyrant who has sealed off all appeals? Is the distinction really about the *person*, or about the *availability of appeal*?

  *   **Follow-up:** If she insists the distinction is about the *person* (the title), ask her if this makes Aquinas's political thought overly formalistic. Does it prioritize the sanctity of the office over the safety of the subjects in a way that seems inconsistent with his broader ethics of charity and the common good?

  **8. Comparison with Later Scholastics**
  Later Scholastics like Suarez and Mariana were often more permissive regarding tyrannicide than your reconstruction suggests Aquinas was. They often blurred the line between the usurper and the legitimate tyrant. Do you view your reconstruction as recovering a "purer" Aquinas that the later Scholastics corrupted, or do you think the later Scholastics were actually more consistent in applying Aquinas's own principles to the realities of early modern statecraft?

  *   **Follow-up:** If she argues the later Scholastics corrupted the text, ask her if that corruption was perhaps necessary. If Aquinas's distinction leaves subjects helpless against a legitimate monster, did the Scholastics fix a moral blind spot in Thomism?

  **9. The Role of the Church**
  In Aquinas's context, the "higher authority" to whom one might appeal was often the Pope or the Emperor. Your reconstruction relies on the impossibility of appeal to justify action against a usurper. But how does the ecclesiastical authority fit into this? If a legitimate king becomes a tyrant, does Aquinas envision the Church as the "public body" that can depose him, or is that strictly a secular function? This seems crucial for understanding whether "public authority" transcends the state.

  *   **Follow-up:** If she argues the Church can depose a king for spiritual crimes but not political ones, ask her how Aquinas distinguishes between the two in a society where the political order is meant to lead men to virtue. Can a political tyrant be separated from a spiritual danger?

  **10. Implications for Modern Constitutionalism**
  Finally, if your reconstruction is correct, it suggests Aquinas offers a theory of limited government where the ruler is accountable to the body that instituted him. But it also suggests a deep skepticism of revolutionary violence. In modern constitutional terms, does this make Aquinas a proto-contractarian who believes in impeachment but not revolution? Or does the prohibition on private violence make his thought fundamentally incompatible with modern rights of resistance?

  *   **Follow-up:** If she argues he is a proto-contractarian, ask her about the "inalienable" nature of the right. If the public body *cannot* alienate its right to depose a tyrant, does that imply a natural right of resistance that exists prior to the institution of the ruler, which Aquinas seems hesitant to explicitly endorse?
