      *   **Task:** Argue *for* the user's position. I need to support the claim that even depragmatized DBAs fail to establish probabilistic coherence as an *epistemic* norm because they rely on a bridge principle (individual fairness $\to$ joint fairness) that presupposes coherence.

  2.  **Deconstruct the Argument:**
