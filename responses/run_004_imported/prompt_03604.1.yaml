answer: |-
  Your intuition is sharp and aligns with some of the most rigorous critiques of Bayesian foundationalism in contemporary epistemology. You have identified what is often called the **Linearity Objection** or the **Aggregation Problem**.

  To argue for your position: **Depragmatized Dutch Book arguments fail to establish probabilistic coherence as an *epistemic* norm because they rely on a bridge principle regarding the aggregation of valuations that is not epistemically neutral. By assuming that the fairness of a package of bets is the sum of the fairness of individual bets, these arguments presuppose the linearity of expectation, which is mathematically isomorphic to the additivity axiom of probability. Consequently, the argument is circular: it assumes the structural norms of probabilism to prove the structural norms of probabilism.**

  Here is the detailed argument supporting your view.

  ### 1. The Depragmatized Move and the Remaining Gap
  The classic Dutch Book argument (DBA) is vulnerable to the "prudential objection": showing that an agent loses money shows they are bad at gambling, not necessarily that their beliefs are false or unjustified. The depragmatized version (championed by figures like Ramsey and de Finetti, and refined by others) attempts to fix this by removing the money. It argues that incoherent credences lead to a set of *judgments of fairness* that are mutually inconsistent. The defect is located in the logical relations between the judgments themselves, not the financial outcome.

  However, as you noted, this creates a gap between **local fairness** and **global fairness**.
  *   **Local Fairness:** The agent judges Bet $A$ as fair at price $\$x$ and Bet $B$ as fair at price $\$y$.
  *   **Global Fairness:** The agent judges the package $(A + B)$ as fair at price $\$(x + y)$.

  The depragmatized argument requires that if the individual bets are fair, the package must be fair *at the sum of the individual prices*. Without this step, there is no "book" to be made, and no inconsistency to be found. An agent could consistently maintain that $A$ is fair at $x$, $B$ is fair at $y$, but the package $(A + B)$ is fair at $z$, where $z \neq x + y$.

  ### 2. The Hidden Premise: Linearity of Value
  To close the gap between local and global fairness, the depragmatized DBA must invoke a bridge principle: **The value (or fairness) of a conjunction of independent wagers is the sum of their individual values.** In decision-theoretic terms, this is the **Linearity of Expectation**.

  This is not a logical truth; it is a substantive structural assumption about how epistemic states map onto valuations.
  *   If I believe $P(H) = 0.6$, I judge a bet paying $\$1$ if $H$ as fair at $\$0.60$.
  *   If I believe $P(T) = 0.6$, I judge a bet paying $\$1$ if $T$ as fair at $\$0.60$.
  *   To Dutch Book me (showing $P(H) + P(T) > 1$), you must assume I judge the *package* of both bets as fair at $\$1.20$.

  If I reject the linearity assumption, I can say: "Individually, these prices reflect my confidence. But jointly, holding both bets changes the context. I do not value the package as the sum of the parts." If I am permitted to value the package non-additively, no Dutch Book can be constructed, and no inconsistency is revealed.

  ### 3. The Circularity Charge
  Here lies the fatal flaw you identified. The additivity axiom of probability ($P(A \lor B) = P(A) + P(B)$ for mutually exclusive $A, B$) is mathematically equivalent to the linearity of expectation in the betting framework.

  *   **The Goal:** Prove that rational credences *must* satisfy the additivity axiom.
  *   **The Method:** Show that violating additivity leads to inconsistent fairness judgments.
  *   **The Requirement:** To show the judgments are inconsistent, one must assume that fairness aggregates additively.
  *   **The Problem:** Assuming that fairness aggregates additively *is* assuming that credences function according to the additivity axiom.

  Therefore, the argument begs the question. It tells us: "If you value things probabilistically, you must value things probabilistically." It fails to provide an independent reason why an epistemic agent *ought* to value packages of propositions additively. It asserts the norm it seeks to derive.

  ### 4. Epistemically Permissible Non-Additivity
  The circularity is particularly damaging because there are coherent epistemic frameworks that reject additivity.
  *   **Imprecise Probabilities:** An agent might represent their belief state not as a single number $P(A)$, but as a range $[0.4, 0.6]$. In such models, the lower probability of a disjunction is not necessarily the sum of the lower probabilities of the disjuncts.
  *   **Ambiguity Aversion:** As shown in the Ellsberg Paradox, rational agents often violate the Sure Thing Principle (and by extension, additivity) because they value the *structure* of uncertainty, not just the magnitudes.
  *   **Dempster-Shafer Theory:** This formalism explicitly allows for belief masses that are non-additive to account for ignorance.

  If these models are epistemically permissible (i.e., they are not "defective" ways of relating to truth, but rather more nuanced ways), then the depragmatized DBA is not identifying an *epistemic* failing. It is merely identifying a deviation from the specific *additive* model of belief. To claim that deviation is an epistemic sin requires an independent argument for why belief *must* be additive—a justification the DBA cannot provide without circularity.

  ### 5. The Failure to Bridge Practical and Epistemic
  Finally, even if we grant that non-additive valuation is a form of inconsistency, the depragmatized argument fails to show this is an *epistemic* failing rather than a *structural* or *practical* one.

  Epistemic norms are typically understood as truth-conducive (e.g., "you ought to believe $P$ because $P$ is likely true"). The Dutch Book argument, even depragmatized, is about **consistency of commitment**. It shows that your commitments clash, but it does not show that they clash with the *world* or with *truth*.
  *   I can be perfectly consistent in a false belief system.
  *   I can be inconsistent in a way that tracks truth better than a consistent system (e.g., holding contradictory provisional hypotheses during inquiry).

  By focusing on the internal consistency of betting quotients, the argument remains trapped in the sphere of rational choice and decision theory. It shows that incoherent credences make for a messy ledger of commitments. But unless one presupposes that the "ledger of commitments" *must* follow the laws of probability (the circularity point again), there is no reason to think a messy ledger implies a defective grasp of evidence or truth.

  ### Conclusion
  Your assessment holds: the depragmatized Dutch Book argument does not escape the pragmatic trap; it merely hides the pragmatic assumption inside a definition of "fairness."

  To move from "each bet is fair" to "the book is unfair," one must assume the **Linearity of Valuation**. Since Linearity of Valuation is isomorphic to the **Additivity Axiom** of probability, using it to prove the Additivity Axiom is viciously circular. Consequently, the argument fails to demonstrate that probabilistic incoherence is an *epistemic* defect. It demonstrates only that incoherence is a deviation from a specific, assumed structural model of valuation. Without an independent justification for why epistemic states must be additive, the gap between individual and joint fairness remains unbridged, and the normativity of the probability calculus remains unproven.
