      *   **Depragmatized DBA (e.g., Ramsey, de Finetti, Joyce):** If credences violate probability axioms $\to$ you judge a set of bets as fair $\to$ but they cannot *all* be fair together (incoherent valuation). *Claim:* This is an epistemic inconsistency in judgment.
