answer: |-
  Good evening, everyone.

  For thirty-four years, Renata has been paid to hold two contradictory thoughts in her head at the same time, without letting her brain explode.

  Thought number one: "Every single fact in this manuscript must be verified. Every comma must be accounted for. If a character has blue eyes in chapter one, they will not have hazel eyes in chapter twenty on my watch."

  Thought number two: "No matter how hard I look, there is almost certainly an error in here somewhere."

  If you ask her nephew, that's the Preface Paradox. It's the rational belief that every individual statement you've checked is true, paired with the rational belief that the collection of statements as a whole probably contains a mistake.

  But Renata doesn't just do this with manuscripts. She does it with the state lottery. For decades, she has bought one ticket a week, handed over her cash, and said, "I already know this one's not it."

  That is the Lottery Paradox. It is the belief that any specific ticket will lose, paired with the action that acknowledges one of them must win.

  Most of us try to resolve tensions like that. We tell ourselves, "Well, I'll check until I'm sure," or "I won't play if I know I'll lose." We try to make the math work.

  But Renata never tried to make the math work. She just lived in the gap.

  And that is exactly why she is the best copy editor I have ever known. Because if she actually believed she could catch every error, she'd get sloppy. And if she actually believed errors were inevitable, she'd give up. Her genius isn't in solving the contradiction. Her genius is in caring enough to sustain it.

  She is a professional embodiment of the idea that you can strive for perfection while knowing it doesn't exist. You can buy the ticket knowing it won't win, because the act of buying it is the only way to be part of the game.

  So, Renata, I am not going to wish you a retirement where everything makes sense. I am not going to wish you a life where all the facts align and the odds finally break in your favor.

  Instead, I wish you this: May you always find the typo, even when you know one got past you. May you buy the ticket, even when you know it's not it. And may you never, ever resolve the tension between the two.

  To Renata.
