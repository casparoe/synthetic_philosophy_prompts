      *   *The Lottery Paradox:* It's rational to believe any single ticket will lose (high probability), but irrational to believe *all* tickets will lose (since one must win).
      *   *Renata's Version:* She checks every fact (believes it's true) but knows errors exist (believes the whole isn't perfect). She buys a ticket (knows it won't win) but buys it anyway (acknowledges the possibility).
      *   *The Core Tension:* Professional perfectionism vs. Human fallibility. Certainty vs. Doubt.

  3.  **Determine the Structure:**
