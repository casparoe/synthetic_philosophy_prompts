answer: |-
  **Title:** The Impossibility of Formal Verisimilitude: Why Scientific Realism Must Abandon Semantic Metrics

  **Abstract**
  *This essay argues that the project of defining verisimilitude as a formal, semantic relation between theories and the world is untenable. While Karl Popper's original content-based definition was decisively refuted by Tichý and Miller, subsequent similarity-based accounts by Niiniluoto and Oddie fail to escape the underlying structural defect: language dependence. I contend that this is not a technical hurdle to be overcome but a category error. Scientific realism cannot be grounded in a metric of "distance to truth" derived from logical syntax or state-space topology. Instead, realists must abandon the quest for a formal definition of approximate truth and ground the notion of scientific progress in abductive inference and structural continuity. Paradoxically, saving scientific realism requires sacrificing the formal concept of verisimilitude.*

  ***

  ### Introduction

  The central anxiety of scientific realism is the specter of the pessimistic meta-induction: if past successful theories were ultimately false, why should we believe our current ones are true? Karl Popper recognized that without a notion of progress that transcends mere empirical adequacy, falsificationism reduces the history of science to a sequence of errors replacing errors. His solution was *verisimilitude* (truth-likeness). The intuition was compelling: Newton is false, Einstein is likely false, but Einstein is *closer* to the truth. However, the technical apparatus Popper built to support this intuition collapsed under the weight of the Tichý-Miller proof (1974). Since then, the literature has been dominated by attempts to repair the machinery, most notably through the similarity-based accounts of Ilkka Niiniluoto and Graham Oddie.

  This essay takes a definitive stance on the viability of this research program. I argue that the failure of Popper's definition was not an isolated technical error but a symptom of a deeper impossibility theorem regarding formal semantics. The similarity-based successors do not solve the problem; they merely relocate the arbitrariness from logical content to predicate selection. Consequently, the realist must accept that "approximate truth" cannot be cashed out in formal terms. This is not a concession to anti-realism, but a necessary clarification: scientific progress is a matter of explanatory coherence and structural retention, not a measurable semantic distance. To save realism, we must abandon the formal project of verisimilitude.

  ### The Popperian Collapse

  To understand why the project is doomed, we must first be precise about why Popper's original definition failed. Popper defined the verisimilitude of a theory $A$ in terms of two classes: its *truth-content* ($Ct_T(A)$), the set of true sentences entailed by $A$, and its *falsity-content* ($Ct_F(A)$), the set of false sentences entailed by $A$. Intuitively, $A$ is more verisimilar than $B$ if $A$ has more truth-content and no more falsity-content (or vice versa).

  This works cleanly if one theory is true and the other false. If $A$ is true, its falsity-content is empty. If $B$ is false, its falsity-content is non-empty. $A$ wins. The disaster arises when comparing two false theories, which is the only context in which the concept is actually needed. As Pavel Tichý and David Miller demonstrated independently, within the propositional logic framework Popper utilized, if $A$ and $B$ are both false, it is logically impossible for $A$ to have more truth-content than $B$ without *also* having more falsity-content.

  The proof relies on the fact that logical consequences are closed under disjunction. If a false theory $A$ entails a true statement $t$, it also entails $t \lor f$ (where $f$ is the false statement that makes $A$ false). Consequently, increasing the truth-content of a false theory inevitably expands its falsity-content. The two measures covary. Thus, Popper's ordering yields no verdicts for the very cases it was designed to adjudicate. It renders the concept of verisimilitude vacuous for the history of science, where we almost never possess the final truth.

  ### The Similarity Turn and the Language Dependence Problem

  Recognizing this collapse, defenders of verisimilitude shifted from a *content* approach to a *similarity* approach. Niiniluoto and Oddie proposed that verisimilitude should be measured by the distance between the constituents of a theory (its models or possible worlds) and the actual state of the world. If the actual world is $w^*$, and theory $A$ posits world $w_A$, the verisimilitude of $A$ is a function of the distance $d(w_A, w^*)$.

  This appears to bypass the Tichý-Miller proof. We are no longer counting consequences; we are measuring geometric or logical distance in a state space. However, this strategy trades the content problem for the *language dependence* problem. To measure distance, one must define the dimensions of the space. In logical terms, this means selecting a set of basic predicates.

  Consider a simple world of three objects that can be hot, cold, or rainy. We can define the state of the world using predicates like "Hot," "Cold," and "Rainy." Alternatively, we can define it using "Minnesotan" (Hot and Rainy or Cold and Dry) and "Arizonan" (Hot and Dry or Cold and Rainy). As shown by arguments stemming from Nelson Goodman's "grue" paradox, a theory that appears close to the truth in the "Hot/Cold" vocabulary may appear distant in the "Minnesotan/Arizonan" vocabulary. Since any finite set of facts can be redescribed in infinitely many logically equivalent but structurally distinct languages, the similarity metric is unstable.

  Niiniluoto attempts to solve this by appealing to a "privileged vocabulary" of natural kinds. He argues that we should measure similarity only against predicates that carve nature at its joints. While this is metaphysically plausible for a realist, it is logically disastrous for the project of *formal* verisimilitude. If the metric depends on identifying natural kinds, then verisimilitude is no longer a logical or semantic relation definable *a priori*. It becomes an empirical, metaphysical claim about the structure of the world. The formal apparatus does not *determine* the ranking; it merely *records* a prior metaphysical commitment. The math does no work; the metaphysics does it all.

  ### The Verdict: The Formal Project is a Category Error

  Here lies the crux of the argument: The Tichý-Miller proof and the Language Dependence problem are not technical glitches; they are boundary markers. They reveal that "truth-likeness" is not a formal property like validity or consistency. Validity holds regardless of the vocabulary used; truth-likeness does not.

  Proponents of the similarity approach often argue that language dependence is a problem for *all* philosophy of science, not just verisimilitude. They claim we simply must assume a realist ontology to get the metrics working. I reject this defense. If the definition of verisimilitude requires us to already know which predicates are "natural," then the concept cannot serve as an *account* of scientific progress. It becomes circular. We cannot use verisimilitude to explain why modern physics is better than Aristotelian physics if determining the verisimilitude ranking requires us to already know that modern physics has the right ontology.

  Therefore, I commit to the following verdict: **There is no workable, non-arbitrary notion of truth-likeness available in formal terms.** The attempt to quantify "approximate truth" as a semantic relation between sentences and the world is a category error. Sentences do not have a "distance" to the world independent of the conceptual scheme used to formulate them.

  ### Saving Realism Without Verisimilitude

  Does this verdict force us into the anti-realist camp suggested by your advisor? Must we retreat to Laudan's problem-solving effectiveness or van Fraassen's empirical adequacy? No. To concede that *formal verisimilitude* is impossible is not to concede that *scientific progress* is illusory. It is to recognize that progress is not a matter of semantic metrics.

  The realist should ground the claim that "Einstein is closer to the truth than Newton" not in a calculation of logical consequences or state-space distances, but in **Structural Realism** and **Inference to the Best Explanation (IBE)**.

  1.  **Structural Continuity:** As argued by Worrall and others, what persists through theory change is not the specific ontological claims (which are often false) but the mathematical structure. Newton's equations are not "true," but they are a limiting case of Einstein's. The progress is visible in the retention of structural relations, not in a count of true propositions. This avoids the language dependence problem because mathematical structure is invariant under linguistic redescription.
  2.  **Abductive Grounding:** We do not *measure* approximate truth; we *infer* it. The "No Miracles" argument remains the realist's best tool. The fact that Einstein's theory yields novel predictions and encompasses Newton's domain is best explained by the hypothesis that Einstein's theory captures the structural features of reality more accurately. This is an abductive judgment, not a formal derivation.

  By shifting the ground from semantics to explanation, we preserve the realist's core intuition—that science latches onto reality—without getting entangled in the impossible task of defining a "truth metric." We can say Einstein is "closer to the truth" as a shorthand for "Einstein's theory preserves the successful structural relations of Newton's while extending empirical scope in a way that would be miraculous if it did not reflect reality."

  ### Conclusion

  The Tichý-Miller proof was not a stumble; it was a stop sign. It indicated that the road of defining verisimilitude through logical content leads to a dead end. The subsequent detour through similarity metrics has not fared better; it merely hides the arbitrariness in the selection of predicates. I argue that the dissertation chapter should not attempt to rehabilitate the formal concept. To do so is to chase a phantom.

  The verdict is clear: The realist must give up on cashing out "approximate truth" in formal terms. However, this is not a retreat to instrumentalism. It is an advancement toward a more sophisticated realism—one that locates progress in the continuity of mathematical structure and the explanatory power of theories, rather than in a non-existent semantic distance. Your advisor is correct that the formal concept should be retired, but incorrect that this requires abandoning the realist claim to truth. We save the heart of realism precisely by cutting away the formal appendages that threaten to kill it.
