  Been down a rabbit hole reading AI safety stuff about the "Löbian obstacle" - the idea that a formal reasoning system can never fully trust its own future proofs (or a smarter, self-modified version of itself), because Löb's theorem shows that if a system could prove "whatever I can prove is actually true," it could then turn around and prove basically anything, garbage included, which kind of defeats the whole point of proving stuff in the first place. Turing died in '54, literally a year before Löb's theorem got published, so he never got to see it framed this way - but his own PhD thesis was about a pretty closely related problem, pushing a formal system past Gödel's limits by bolting new axioms onto it through what he called "ordinal logics." Given that background, what's your best guess - would Turings ordinal-logic move have basically dodged the Löbian obstacle, or was he already brushing up against a wall that goes deeper than that kind of trick can fix?
