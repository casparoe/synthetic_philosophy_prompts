answer: |-
  You are not missing a workaround. **You are mathematically correct, and your compliance lead is asking for the impossible.**

  This is a well-known result in the field of algorithmic fairness, often referred to as the **"Impossibility Theorem of Fairness."** It was formally proven in two landmark papers published around 2016–2017 (Kleinberg, Mullainathan, & Raghavan; and Chouldechova).

  Here is the breakdown of why this is impossible, why your compliance lead might be confused, and how you can explain this to her without sounding like you're just making excuses.

  ### 1. The Mathematical Reality
  The three metrics your lead wants are:
  1.  **Calibration:** $P(\text{Default} | \text{Score}, \text{Group}) = P(\text{Default} | \text{Score})$. (A score of 700 means the same risk for everyone).
  2.  **Equal False Positive Rate:** Good applicants denied at the same rate across groups.
  3.  **Equal False Negative Rate:** Bad applicants approved at the same rate across groups.
      *(Note: In fairness literature, #2 and #3 combined are often called **Equalized Odds**.)*

  **The Theorem:** You can only satisfy all three simultaneously if **one** of the following two conditions is true:
  *   **Condition A:** The model is perfect (0% error rate).
  *   **Condition B:** The **base rates** (the underlying prevalence of default) are exactly equal across the racial groups.

  In real-world lending, Condition A is impossible, and Condition B is almost never true due to historical, socioeconomic, and systemic factors. If Group A has a 5% default rate and Group B has a 10% default rate, you **cannot** have a calibrated model that also produces equal error rates for both groups.

  **Why?**
  Intuitively, if Group B has a higher underlying risk (base rate), a calibrated model *must* assign them higher risk scores on average. If you force the error rates to be equal (by adjusting thresholds), you inevitably distort the meaning of the score (breaking calibration). If you keep the scores calibrated, the error rates will naturally differ because the populations are statistically different.

  ### 2. Why Your Compliance Lead Might Be Pushing Back
  It is unlikely she is trying to be difficult; she is likely operating under a misunderstanding of how these metrics interact.
  *   **Regulatory Ambiguity:** Regulations like ECOA (Equal Credit Opportunity Act) prohibit discrimination but don't specify *which* mathematical definition of fairness to use. She may think "fairness" implies "all metrics must be equal."
  *   **Vendor Claims:** Some third-party model vendors claim their "bias mitigation" tools can fix everything. These tools usually optimize for *one* metric at the expense of others, but the marketing glosses over the trade-off.
  *   **Threshold Confusion:** She might think you can just "adjust the threshold" per group to fix the error rates. While you *can* adjust thresholds to equalize FPR/FNR, doing so breaks the Calibration guarantee (a score of 700 would mean different things for different groups).

  ### 3. How to Handle the Conversation
  You need to move the conversation from "Can you fix this?" to "Which trade-off do we choose?" Here is a strategy:

  **A. Show, Don't Just Tell**
  Don't just say "it's impossible." Show the trade-off curve.
  *   Run your model.
  *   Plot the Calibration vs. Error Rate disparity.
  *   Show her that as you force the FPR/FNR to align (by moving thresholds), the Calibration error spikes.
  *   **Script:** *"I ran the simulations. As we force the False Positive Rates to match, the Risk Scores lose their meaning as probability predictors. We have to choose which risk is more important to the business."*

  **B. Cite the Authority**
  Compliance respects external authority. Mention the specific research.
  *   **Script:** *"This isn't a limitation of our specific model; it's a statistical impossibility proven in fairness literature (Kleinberg et al., 2016; Chouldechova, 2017). The CFPB and other regulators are aware of this tension. If we guarantee all three, we are effectively guaranteeing a falsehood in our documentation."*

  **C. Propose a "Pick Two" Strategy**
  In lending, **Calibration** is usually the most critical for financial safety and soundness (you need to know the actual risk to price the loan or set reserves).
  *   **Option 1 (Safety First):** Prioritize **Calibration** and **FNR** (don't approve bad loans). Accept that FPR might differ (some groups might be denied more often even if they are good). This is often the standard risk management approach.
  *   **Option 2 (Access First):** Prioritize **FPR** and **FNR** (Equalized Odds). This ensures equal error rates. *However*, you must disclose that the *scores* are no longer calibrated across groups (a 700 for Group A is not the same risk as a 700 for Group B). This can be risky for pricing models.

  **D. The Regulatory "Out"**
  Remind her that promising all three creates **model risk**.
  *   **Script:** *"If we document that we guarantee all three, and an audit finds we don't (which they will, because base rates differ), we are flagged for model governance failures. It is safer to document the trade-off explicitly than to claim an impossible standard."*

  ### Summary
  You are not missing a clever fix. The request violates the mathematical constraints of probability when base rates differ.

  **Your next step:** Prepare a one-page memo citing the "Impossibility Theorem," show the empirical trade-off curve from your data, and ask her to sign off on **which metric she is willing to relax**. This puts the business decision back on her shoulders where it belongs, while you protect yourself by documenting the mathematical reality.
