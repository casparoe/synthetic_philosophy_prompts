answer: |-
  This is a classic debate that cuts to the heart of monetary theory, and it is excellent that you are pausing to think it through before launching. Both you and your friend are invoking legitimate economic traditions, but you are talking past each other slightly because you are defining "money" and "value" differently.

  To give you the rigorous take you requested, we need to separate the **philosophical question** (what makes money real?) from the **practical question** (will this time bank function?).

  ### Part 1: The Nature of Money (Who is right theoretically?)

  **Your Friend's View: The Metallist/Realist Position**
  Your friend is arguing from a perspective that suggests money must derive value from something external to itself—either a scarce commodity (like gold) or the coercive power of a state (taxes/legal tender). His concern is that without a "reserve" or a "gun behind the money" (the state's ability to enforce contracts and demand taxes in that currency), the credits are just empty promises. He fears that because anyone can theoretically "earn" an hour just by existing and waiting, the currency will inflate or become worthless.

  **Your View: The Chartalist/Institutionalist Position**
  You are arguing from the modern understanding of fiat currency. You are correct that the dollar in your friend's wallet is not redeemable for gold. It is valuable because of a network effect: I accept it because I am confident you will accept it, and because the government demands taxes in it, creating baseline demand. You correctly identify that money is fundamentally a **social technology of trust**. It is a ledger of claims on future labor and goods.

  **The Verdict on Theory**
  On the theoretical definition of money, **you are more correct than your friend.**
  Modern economics largely agrees with you: money is not valuable because of the paper or the metal; it is valuable because of the *social contract* that sustains it. A currency does not need a commodity reserve to function (as proven by every fiat currency since 1971). It needs **liquidity** (people willing to trade) and **trust** (confidence that the credit will be honored later).

  However, your friend is right about one crucial nuance: **Stability.**
  While fiat money isn't backed by gold, it *is* backed by a central authority that manages its scarcity. The Federal Reserve adjusts the money supply to prevent hyperinflation or deflation. Your time bank has no central bank. If everyone decides to "bank" 100 hours in a week but no one spends them, you have inflation of credits without an increase in actual labor performed.

  ### Part 2: The Practical Viability (Is the time bank built on sand?)

  This is where the rubber meets the road. Even if time credits count as a form of "money," that doesn't guarantee they will function well as a *currency* for your building. Here are the specific economic risks your friend is hinting at, translated into the context of a time bank.

  **1. The "Equal Hour" Problem (Valuation)**
  In the dollar economy, an hour of a lawyer's time costs \$500, and an hour of a dog walker's time costs \$20. The market prices these based on scarcity of skill and demand.
  In a time bank, 1 hour = 1 credit.
  *   **The Risk:** High-skill members may feel exploited. If the building's only plumber trades one hour of complex pipe repair for one hour of someone else's casual plant watering, the plumber may quickly exit the system.
  *   **The Mitigation:** Time banks work best for low-skill, high-trust tasks (dog walking, borrowing a drill, receiving a meal). If you try to use it for specialized labor, the system will fracture.

  **2. The Liquidity and Matching Problem**
  Money is useful because it solves the "double coincidence of wants." I can pay a baker with dollars, and the baker can use those dollars to pay a mechanic.
  In your time bank, if I earn credits by walking your dog, I need to find someone else in the building who *both* wants dog walking *and* has the service I need (say, shelf fixing).
  *   **The Risk:** If the ledger becomes imbalanced (e.g., five people have banked 50 hours each, but no one is willing to spend hours on services), the credits become illiquid. They look like wealth on a spreadsheet, but they can't be converted into actual labor.
  *   **The Friend's Point:** This is what he means by "nothing backs the credits." If there is no one willing to provide the labor you want, the credit is indeed worthless.

  **3. Trust and Enforcement (The "Shared Say-So")**
  Your friend mentioned "nothing but our mutual say-so." In a small apartment building, this is actually a strength, not a weakness. This is known as **reputational collateral**.
  *   **The Reality:** If someone in the building racks up 50 hours of debt and then moves away without paying, the loss is contained. In a national currency, bad debt is systemic. In your building, social pressure is a more effective enforcement mechanism than the law.
  *   **The Risk:** If the ledger is not transparent, or if disputes arise over whether a task was completed satisfactorily, the trust evaporates.

  ### Part 3: The Decision Framework

  Is your project sound? Yes, but only if you categorize it correctly.

  **Do not think of this as creating a "currency" to replace dollars.**
  If you treat it as a competing currency, it will fail (Gresham's Law: people will spend the "bad" time money and hoard the "good" dollar money).

  **Think of this as a "Complementary Currency" or "Mutual Credit System."**
  These are proven to work in communities, but they have specific design requirements to avoid the collapse your friend predicts.

  **Recommendations for Launch:**

  1.  **Limit the Scope:** Explicitly market this for *neighborly favors*, not professional services. It is for borrowing sugar, watering plants, and package watching. Do not encourage members to trade hours of accounting or plumbing unless they are genuinely willing to value those hours equally to dog walking.
  2.  **Manage the Ledger (The "Central Bank" Role):** You need a system administrator. If one person accumulates a massive negative balance (owing many hours) without a plan to repay, it threatens the system's solvency. You may need a credit limit (e.g., no one can go below -10 hours).
  3.  **Encourage Circulation:** A time bank dies if everyone hoards credits. You want velocity. Consider "demurrage" (a concept where credits lose a tiny value over time to encourage spending), or simply hold monthly mixers where people offer services to spend their credits.
  4.  **Accept the Friend's Critique as a Feature:** Acknowledge that the credits are not "wealth" in the sense of a savings account. They are **claims on community capacity**. If the community capacity shrinks (people move out), the value of the credits shrinks. This is true of all money, but more visible here.

  ### Conclusion

  Your friend is wrong that money requires a commodity reserve or state backing to be "real." You are right that money is a social consensus.

  However, your friend is right to be skeptical about **stability**. A currency based purely on "mutual say-so" requires high social cohesion to prevent collapse. In a single apartment building, you likely have enough cohesion to make this work, provided you manage expectations.

  **The Verdict:** Proceed with the launch, but reframe the project. It is not a "bank" in the financial sense; it is a **cooperative labor exchange**. If you market it as a way to build community resilience rather than a way to "save money," you align the incentives correctly. The "value" backing the credits is not a vault of gold; it is the willingness of your neighbors to show up. As long as that willingness remains, the money is real.
