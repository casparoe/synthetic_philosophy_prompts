      *   **The Problem:** Two aggregation methods yielded opposite results for the same applicant.
          *   Method 1 (Premise-based): Majority vote on each criterion, then apply the rule (All 3 must pass).
          *   Method 2 (Conclusion-based): Each member makes an overall decision based on their own weighting, then majority vote on the final decision.
      *   **The Conflict:** Committee members are arguing about which method is "correct."
      *   **The Question:** Is one procedure more defensible, or is there no coherent collective opinion?

  2.  **Identify the Core Theoretical Concept:**
      *   This is a classic problem in social choice theory and judgment aggregation.
      *   Specifically, it's the **Doctrinal Paradox** (also known as the **Discursive Dilemma**).
      *   *Structure:*
          *   Propositions $P, Q, R$ (Criteria).
          *   Decision Rule: Fund if $P \land Q \land R$ (All three must be true).
          *   Aggregation 1: Majority on $P$, Majority on $Q$, Majority on $R$, then apply $\land$.
          *   Aggregation 2: Individual application of $\land$, then Majority on the result.
      *   *Outcome:* These can diverge.

  3.  **Evaluate the Two Methods (Premise-based vs. Conclusion-based):**
      *   **Method 1 (Premise-based/Issue-based):** Vote on criteria first.
          *   *Pros:* Ensures consistency with the stated rules/criteria. Transparency on *why* a decision was made. Protects minority views on specific criteria if they are intense? (Actually, it amplifies majority rule on premises). It enforces the department's stated standards.
          *   *Cons:* Can lead to a result that no individual actually supports (the "collective irrationality" problem).
      *   **Method 2 (Conclusion-based/Case-based):** Vote on the outcome first.
          *   *Pros:* Respects individual holistic judgment. Simpler. The outcome reflects what the majority of people actually want to happen.
          *   *Cons:* Can violate the stated rules (e.g., fund someone who failed a mandatory criterion according to the majority). Opacity (don't know *why* people voted yes/no).

  4.  **Determine "Defensibility":**
      *   Is one objectively "correct"? No. This is a normative question, not a positive one.
      *   However, in the context of a *fellowship committee with explicit rules*, there are strong arguments for the Premise-based approach (Method 1).
      *   *Why?* The department set a rule: "Fund *only if* all three." This is a constraint on the decision space. Method 2 allows the majority to bypass the constraint.
      *   *Counter-argument:* Method 2 respects the epistemic authority of the committee members as holistic evaluators.

  5.  **Drafting the Response:**
      *   **Acknowledge and Validate:** Start by confirming this is a known, studied phenomenon. It's not just them being confused; it's a structural feature of group decision-making.
      *   **Name the Phenomenon:** Introduce the **Doctrinal Paradox** (or Discursive Dilemma). This gives the user keywords to look up and establishes credibility.
      *   **Explain the Mechanics (Briefly):** Show *how* it happens with a simple 5-person matrix example. This clarifies the logic for a quant-minded person.
          *   Need a scenario where 3 people say Yes on Criteria, but they are different 3 people for each criteria, such that the intersection (people who say Yes to all) is only 2.
      *   **Analyze the Normative Trade-offs:**
          *   *Premise-based (Method 1):* Rule-of-law, consistency, transparency. Good for bureaucratic fairness.
          *   *Conclusion-based (Method 2):* Democratic, respects individual judgment. Good when criteria are vague or subjective.
      *   **Contextual Advice (Poli Sci Dept):**
          *   Since there are *explicit rules* ("only fund someone if they clear all three"), Method 1 is usually more defensible administratively. It prevents the "tyranny of the majority" from overriding safety/feasibility checks.
          *   However, if the criteria are subjective proxies for "quality," Method 2 might capture "quality" better.
      *   **Recommendation:** Suggest a discussion about *why* the rule exists. If the rule is a hard constraint (e.g., IRB approval, budget feasibility), Method 1 is necessary. If the rule is a heuristic for quality, Method 2 might be okay.
      *   **Tone:** Collegial, academic, helpful. Avoid taking a hard side but lean towards the institutional logic of Method 1 given the explicit rule.

