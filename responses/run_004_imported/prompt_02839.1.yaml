  7.  **Final Polish:** (Mental check of the Sen argument). Sen's point is that RPT collapses the distinction between *wanting* and *choosing*. If I choose to fast for a cause, RPT says I "prefer" fasting to eating. But my welfare might be lower. Callum uses this to say RPT is vacuous again because it redefines preference to fit the choice. Ines can't easily escape this without admitting RPT doesn't capture "wanting." Okay, the analysis holds.

