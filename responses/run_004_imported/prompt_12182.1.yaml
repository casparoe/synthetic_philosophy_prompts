answer: |-
  This is a profound observation, and you have put your finger on one of the most fascinating tensions in Hobbes's work. You are describing the principle of *verum factum* ("the true is the made"), though Hobbes doesn't always use that specific phrase. The idea is that we can only have perfect scientific knowledge of things whose causes we understand, and we understand the causes perfectly only when we are the causes ourselves.

  Your experience on the co-op committee illustrates the friction between this philosophical ideal and the messy reality of governance. To answer your question directly: Hobbes's argument entitles you to **authority**, but it does not entitle you to **prophecy**. And yes, Hobbes's own disastrous attempt to square the circle should make you significantly more skeptical of the analogy, though perhaps not for the reason you might think.

  Here is an analysis of the implications of Hobbes's argument for your co-op, structured around the geometry analogy and the irony of his mathematical hubris.

  ### 1. The Geometry Analogy: Definition vs. Behavior

  Hobbes argues that in geometry, we dictate the definitions. We say, "A line is breadthless length," and "A circle is a figure described by a moving point." Because we stipulated these definitions, we know exactly what a circle *is*. We don't have to go out and measure physical circles, which are always imperfect.

  **The Implication for the Co-op:**
  When you wrote your rulebook, you achieved certainty about **definitions**, but not about **interactions**.
  *   **What you know:** You know exactly what you *meant* by "quiet hours are 10 PM to 7 AM." In the Hobbesian sense, you possess the "science" of that rule. You are the sovereign authors of that definition.
  *   **What you don't know:** You cannot know with geometric certainty how a human being will interpret "quiet" when they are angry, or how sound travels through your specific building's infrastructure, or how a new resident will test the boundaries of that rule.

  In geometry, the figures do not talk back. A triangle does not have a passion, a grievance, or a lawyer. In a commonwealth (or a co-op), the "figures" are people. Hobbes acknowledges that human matter is "restless," but he believes that if you construct the Sovereign power correctly, you can channel that restlessness like a geometric constraint. Your experience proves that human behavior is emergent and complex in a way that lines and angles are not. You are entitled to certainty about the *text* of the rules, but not the *context* of their application.

  ### 2. The Irony of the Circle-Squaring: The Psychology of the Creator

  You asked whether Hobbes's lifelong delusion regarding the squaring of the circle should make us more skeptical of his political analogy. The answer is a resounding **yes**, but specifically regarding the **fallibility of the author.**

  Hobbes believed he had squared the circle because he trusted his own reasoning so intensely that he assumed any contradiction must be the fault of the critics (like John Wallis), not the system. He treated his own geometric constructions as if they were immune to error simply because *he* made them.

  **The Implication for the Co-op:**
  This is the danger of the "self-construction" argument. It breeds a specific kind of epistemic arrogance: *"We wrote this, so we must understand it better than anyone else."*
  *   **The Blind Spot:** Just as Hobbes could not see the flaw in his own geometric proof because he was too close to it, your committee cannot see the flaws in the rules because you are the authors. You suffer from the "curse of knowledge." You know what you intended, so you assume the text conveys that intention perfectly.
  *   **The Lesson:** The fact that you built the institution does not grant you omniscience over its operations. In fact, it may grant you a specific kind of blindness. Hobbes's failure suggests that **authorship is not a guarantee of truth.** You can construct a system that is internally consistent in your head but fundamentally broken in reality.

  Therefore, Hobbes's mathematical failure should teach you that **self-construction requires external verification.** Hobbes refused to accept Wallis's corrections. Your co-op should build mechanisms specifically designed to invite "Wallis-like" challenges—grievance procedures, external mediators, or scheduled reviews where the rules are treated as if they were written by strangers.

  ### 3. Certainty of Power vs. Certainty of Outcome

  There is one area where Hobbes is right, and where your co-op might find comfort. Hobbes claims civil philosophy is demonstrable not because we can predict every human action, but because we have the **right to enforce the interpretation.**

  In geometry, if someone draws a shape that violates the axioms, we say, "That is not a triangle." In a commonwealth, if someone violates the covenant, the Sovereign says, "That is a crime." The certainty lies in the **power to adjudicate**, not in the prevention of the dispute.

  **The Implication for the Co-op:**
  You should not expect the rules to prevent disputes (predictive certainty). You should expect the rules to give you the **authority to resolve them** (normative certainty).
  *   Hobbes's point is that because you made the commonwealth, you have the legitimate right to decide what it means when things go wrong.
  *   The "certainty" Hobbes promises is not that the machine will run without friction, but that when friction occurs, there is a designated mechanic with the final say.
  *   If your co-op rulebook generates disputes, that is not a failure of the Hobbesian model, provided the rulebook also gives you the clear authority to amend the rules or judge the dispute. The certainty is in the *sovereignty*, not the *statute*.

  ### 4. The "Artificial Man" is Always Under Construction

  Finally, consider that Hobbes calls the Commonwealth an "Artificial Man." He views it as a machine. But even machines require maintenance. Hobbes's error in geometry was treating a problem as solved when it was not.

  Your expectation that you would "anticipate how our own rules would play out" assumes that the construction phase ends when the ink dries. Hobbes's own life—constantly revising *Leviathan*, constantly engaging in polemics, constantly defending his system—suggests that the "Artificial Man" is never finished.

  **The Implication for the Co-op:**
  *   **Abandon the Dream of Static Certainty:** Do not treat the rulebook as a geometric proof that, once written, is eternally true. Treat it as a software beta.
  *   **Embrace the "Sovereign" Function:** Hobbes argues the Sovereign must be absolute not to be a tyrant, but to prevent the dissolution of the state into endless debate. In a co-op, this means you need a clear process for *changing* the rules when they fail. The certainty you are entitled to is the certainty that **you have the power to fix it.**
  *   **Learn from Wallis:** Hobbes's tragedy was his refusal to listen to the Oxford mathematicians. Your committee's success depends on listening to the residents who *didn't* write the rules. They are your Wallis. They are the ones pointing out where the circle doesn't square.

  ### Summary

  Hobbes's argument that self-construction grounds certainty is true regarding **legitimacy** but false regarding **complexity**.

  1.  **Legitimacy:** Because you made the rules, you have the right to enforce them. No one can claim they are "natural" or "god-given" and thus beyond your reach.
  2.  **Complexity:** Because you are human, not God, your construction is subject to error. The "matter" you are working with (neighbors) has free will, unlike the lines in geometry.
  3.  **The Warning:** Hobbes's circle-squaring delusion proves that authors are the worst judges of their own systems.

  You are not entitled to expect that your rules will work perfectly. You are entitled to expect that, because you built the system, you have the right to decide what happens when they don't. The certainty Hobbes offers is not the certainty of a clock that never stops, but the certainty of the clockmaker who has the right to open the case and adjust the gears.
