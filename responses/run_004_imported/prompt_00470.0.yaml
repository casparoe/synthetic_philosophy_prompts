prompt: |-
  I'm working on a novel where two estranged siblings have to divide up their late father's estate, and one of the side characters is a mediator who keeps namedropping game theory to sound smart. I want to actually get the substance right instead of just having him spout jargon, so I've been reading about bargaining solutions and got kind of stuck comparing the Nash bargaining solution to the Kalai-Smorodinsky one. From what I can tell, the disagreement seems to hinge on whether you care more about independence of irrelevant alternatives or about monotonicity, and I honestly can't tell which axiom is actually more compelling once you move past toy examples with two players and a pie to split. My writer friends think Im overthinking this for a scene thats like two pages long, but I want my mediator character to explain the tradeoff correctly if he's going to be so smug about it. Could you write an essay weighing the case for preferring the Kalai-Smorodinsky solution over Nash's as a normative standard for fair bargaining, and the case for the opposite, and then actually land on a verdict instead of just presenting both sides evenhandedly? It doesn't need to be exhaustive, but I want the reasoning to hold up if someone who actually knows game theory reads the book.
