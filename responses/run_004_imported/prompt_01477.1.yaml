      *   **The "Line":** The line is usually drawn at *functional impairment* and *stuckness* vs. *integration*. Normal grief waves; PGD is a constant state that prevents living.
      *   **Philosophical/Sociological Aspect:** The user asks about the "principled line" vs. "made up by insurers." This touches on the philosophy of psychiatry (natural kinds vs. social constructs).

  3.  **Determine the Tone and Approach:**
