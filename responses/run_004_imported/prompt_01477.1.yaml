answer: |-
  This is one of the most profound and difficult questions in modern psychiatry, and it is excellent fodder for a novel. The short answer is: **There is a principled line, but it is fuzzy, and both your aunt and your mom are holding onto different halves of the truth.**

  For a writer, this ambiguity is gold. You don't need to decide who is "right" for your book; the tension between those two perspectives *is* the story.

  Here is a breakdown of the clinical reality, the philosophical debate, and how you might navigate this for your character.

  ### 1. The Clinical Reality: What is Prolonged Grief Disorder?
  Your aunt's therapist is correct that this is now a formal diagnosis. It was added to the *Diagnostic and Statistical Manual of Mental Disorders* (DSM-5-TR) in 2022 and the World Health Organization's ICD-11 in 2018.

  However, the criteria are much stricter than "grieving for a long time." To be diagnosed with Prolonged Grief Disorder (PGD), the grief must be:
  *   **Persistent:** Lasting at least 12 months (for adults) after the loss.
  *   **Pervasive:** The person experiences intense yearning, preoccupation with the deceased, or emotional pain nearly every day.
  *   **Disabling:** This is the key "principled line." The grief must cause **clinically significant distress or impairment in social, occupational, or other important areas of functioning.**

  **The Distinction:**
  *   **Normal Grief:** Comes in waves. You can still laugh at a movie, eat a meal, or plan for next month, even if you are sad. Over time, the grief integrates into your life; you learn to carry it.
  *   **PGD:** The grief is a constant, acute state. It arrests development. The person cannot envision a future, feels a loss of identity (e.g., "I am not a wife anymore, I am nothing"), and avoids reminders of the loss to the point of isolation.

  From a medical standpoint, the "disease" isn't the sadness; it's the **stuckness**. It is the inability of the brain's healing mechanisms to engage.

  ### 2. Your Mom's Point: The Risk of Medicalization
  Your mom is voicing a critique that many sociologists and even some psychiatrists hold. Her argument is that by labeling this a "disorder," we risk:
  *   **Pathologizing Love:** Suggesting that deep love *should* have a time limit.
  *   **Ignoring Context:** Grief is often made worse by lack of community support, financial stress, or isolation. A pill doesn't fix a lonely society.
  *   **The "Fix-It" Culture:** Implying that there is a "correct" way to grieve and that staying in pain is a failure of health rather than a testament to connection.

  There is historical precedent for her worry. Psychiatry has previously medicalized normal human experiences (e.g., the removal of homosexuality from the DSM, or debates over ADHD). There is a legitimate fear that we are treating the *symptom* (grief) rather than the *wound* (loss).

  ### 3. The Systemic Reality: Insurance and Access
  You asked if the distinction comes down to "whatever doctors and insurers decide is worth treating." Cynically? **Partly, yes.**

  In the US healthcare system, a diagnosis is often a key that unlocks a door.
  *   **Without the diagnosis:** Therapy is an out-of-pocket expense. Insurance says, "This is a life problem, not a medical one."
  *   **With the diagnosis:** Insurance covers specialized grief therapy and medication.

  For your aunt, the label might feel like relief not because she thinks she's "sick," but because the label validates that **her suffering is severe enough to warrant help.** It tells her, "You aren't weak; you are injured, and we have tools to treat injuries."

  ### 4. How to Write This Conflict
  For your book, you don't need to solve the debate. In fact, the most honest portrayal will acknowledge that **both views are true simultaneously.**

  Here are three angles to consider for your character:

  **A. The Label as Liberation vs. Erasure**
  *   *Scene Idea:* Your character feels relief hearing the diagnosis (like your aunt). It explains why she can't "just snap out of it." But later, have a friend (like your mom) say, "You aren't a disorder. You're a widow."
  *   *Thematic Question:* Does the label help her heal, or does it separate her from the memory of her loved one by turning that love into a symptom?

  **B. Function vs. Feeling**
  *   Focus on what the grief *stops* the character from doing.
  *   If the grief keeps them in bed, unable to care for children or keep a job, the "disorder" argument gains weight.
  *   If the grief makes them cry but they still show up for life, the "normal love" argument holds.
  *   *The Gray Area:* What if they show up for life but feel dead inside? That is where PGD lives.

  **C. The Time Limit**
  *   Society expects grief to be linear (shock -> sadness -> acceptance). Real grief is non-linear.
  *   Your character can struggle with the "expiration date." Two years feels like a lifetime to the outside world, but like yesterday to the griever.
  *   *Writing Tip:* Show the physical toll. PGD isn't just sadness; it's insomnia, immune system suppression, and physical pain. This supports the "medical" argument without diminishing the "love" argument.

  ### Summary for Your Writing
  Is there a principled line? **Yes, but it is drawn at "function," not "duration."**
  Is it made up by insurers? **The code is, but the suffering isn't.**

  Your aunt is right that she needs help, and the diagnosis is the ticket to get it. Your mom is right that grief is the price of love, and no pill should erase the significance of the loss.

  For your character, the resolution might not be choosing one side. It might be realizing that **accepting help for the disorder doesn't mean betraying the love.** They can treat the *debilitating paralysis* of the grief without trying to cure the *memory* of the person they lost.

  That is a nuanced, human place for a character to land.
