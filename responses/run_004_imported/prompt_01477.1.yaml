      *   **User's Goal:** The user is writing a book with a character in a similar situation and is struggling with the thematic conflict (Is it a disorder or just deep love?). They want to know if there's a *principled line* between disease and extreme normal experience, or if it's arbitrary (doctors/insurers).
      *   **Underlying Question:** Is Prolonged Grief Disorder (PGD) legitimate? Where is the boundary between normal grief and pathology? Is the distinction socially constructed or biologically/psychologically grounded?

