          3.  Practical advice: Should I hedge realist claims, or is the formal issue decoupled from historiographical practice?
      *   **Tone:** Academic, precise, nuanced, supportive but critical.

  2.  **Deconstruct the Philosophical Issue (Miller-Tichý Theorem):**
