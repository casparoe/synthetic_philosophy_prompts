      *   *The Result:* Miller and Tichý independently showed that if $A$ and $B$ are both false, Popper's definition implies $A$ is closer to truth than $B$ *only if* $A$ is logically stronger than $B$ (in a specific way that turns out to be trivial or impossible for distinct false theories in propositional logic). Essentially, you can't compare two false theories on this definition.
