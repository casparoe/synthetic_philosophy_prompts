answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Journal Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Statistical Reporting Reforms Following Replication Failures

  ### Executive Summary

  In light of the two recent high-profile replication failures involving previously published work in our journal, we must adopt reforms that address the *mechanisms* of those failures rather than merely changing the arithmetic of our decision rules. After evaluating Proposal A (Stricter Frequentism) and Proposal B (Mandatory Bayesianism), I recommend we adopt a **Modified Proposal A**, contingent on upgrading "preregistration" to a **Registered Reports** workflow.

  While Proposal B offers theoretical advantages regarding optional stopping, it does not eliminate researcher degrees of freedom and introduces new vulnerabilities in prior specification. The replication crisis in social psychology was driven less by the specific test statistic used and more by publication bias and undisclosed flexibility in analysis ("the garden of forking paths"). A stricter frequentist threshold combined with rigorous process control offers the most auditable and immediate path to reducing false positives without creating a false sense of security that Bayesian methods alone solve human incentives.

  ### 1. Diagnosis: Mechanisms of Failure

  To choose between Proposal A and B, we must agree on what broke. The failed replications in social priming and ego depletion were not primarily caused by calculation errors in p-values. They were caused by a system that rewarded novel, clean, positive results while obscuring the messiness of data collection and analysis.

  Three specific mechanisms drove these failures:
  1.  **Publication Bias:** The file drawer problem ensures that false positives are published while true nulls remain unseen.
  2.  **Low Statistical Power:** Small samples inflated effect size estimates (the "winner's curse").
  3.  **Researcher Degrees of Freedom:** Authors made undisclosed decisions on data exclusion, covariate inclusion, and sample size determination to achieve significance.

  Any reform that does not directly constrain these three mechanisms will fail, regardless of whether it uses $p$-values or Bayes Factors (BF).

  ### 2. Assessment of Proposal B (Mandatory Bayesianism)

  Proponents of Proposal B argue that the replication crisis is fundamentally a frequentist problem. Their strongest claim rests on the **Likelihood Principle**: in Bayesian inference, the evidence provided by the data does not depend on the stopping rule. Therefore, "optional stopping" (peeking at data and deciding whether to collect more) does not invalidate a Bayes Factor in the way it invalidates a $p$-value.

  **Where this claim holds:**
  It is mathematically true that Bayesian updating is coherent under optional stopping. If our primary problem were researchers collecting $N=20$, checking $p$, and then collecting $N=20$ more only if $p > .05$, Proposal B would structurally remove the penalty for this behavior.

  **Where this claim fails:**
  My colleague's argument assumes that optional stopping is the *primary* source of researcher degrees of freedom. In practice, particularly in social psychology, the "Garden of Forking Paths" (Gelman & Loken, 2014) is much wider than stopping rules.

  A researcher using Bayesian methods retains discretion over:
  *   **Prior Specification:** A skeptical prior can yield a BF supporting the null; a diffuse or informed prior can yield a BF supporting the alternative. Without strict constraints, "prior hacking" becomes a new form of $p$-hacking.
  *   **Model Structure:** Decisions about which covariates to include, how to handle outliers, and how to parameterize random effects all alter the likelihood function. The Likelihood Principle protects against stopping rule manipulation, but it does not protect against model specification manipulation.
  *   **Reporting:** A researcher can compute BFs for multiple measures and report only the one that exceeds a threshold (e.g., BF > 3).

  Switching to Bayesian analysis without solving the incentive problem risks replacing "$p$-hacking" with "BF-hacking." Furthermore, mandating Bayes Factors imposes a high cognitive load on authors and reviewers who lack training, potentially obscuring errors rather than revealing them.

  ### 3. Assessment of Proposal A (Stricter Frequentism)

  Proposal A retains Null Hypothesis Significance Testing (NHST) but lowers the threshold to $p < .005$ and mandates preregistration.

  **Strengths:**
  *   **False Positive Reduction:** Moving to $\alpha = .005$ significantly reduces the Type I error rate, making it harder for noise to pass as signal (Benjamin et al., 2018).
  *   **Audibility:** $p$-values are standardized. It is easier for reviewers to verify if a reported $p$-value matches the preregistered analysis plan than to evaluate the appropriateness of a prior distribution.
  *   **Compatibility:** This aligns with the current skillset of the majority of our author pool and reviewer base, ensuring reforms are implemented correctly rather than superficially.

  **Weaknesses:**
  *   **Dichotomous Thinking:** A threshold of .005 still encourages a cliff effect ("significant" vs. "not significant").
  *   **Incentive Misalignment:** Preregistration alone is often weak; authors may preregister vaguely or deviate post-hoc without consequence.

  ### 4. Recommendation: Modified Proposal A with Registered Reports

  I recommend we adopt **Proposal A**, but with two critical modifications to address the limitations identified above and to incorporate the valid concerns of Proposal B proponents.

  **1. Upgrade Preregistration to Registered Reports:**
  Standard preregistration allows authors to hide non-significant results after the fact. We should adopt the **Registered Reports** format for all new empirical submissions.
  *   *Stage 1:* Authors submit the introduction, methods, and analysis plan *before* data collection.
  *   *Review:* The board reviews the *question and method*, not the results.
  *   *Stage 2:* If accepted, the paper is published regardless of the outcome, provided the authors follow the protocol.
  *   *Why:* This directly attacks **publication bias** and **researcher degrees of freedom**. It makes the "Garden of Forking Paths" invisible by locking the path before the walk begins. This solves the incentive problem that neither Proposal A nor B solves on its own.

  **2. Maintain $p < .005$ but Require Estimation:**
  We will adopt the $.005$ threshold for claims of *new discovery*, but we must mandate the reporting of **effect sizes with confidence intervals** as the primary interpretation tool. This mitigates the dichotomous thinking critique.

  **3. Encourage (But Do Not Mandate) Bayesian Sensitivity Analysis:**
  To address the Friend's valid point regarding stopping rules and evidence grading, we will *encourage* authors to include Bayesian robustness checks as supplementary material. This allows us to benefit from Bayesian insights without mandating a framework that introduces new, harder-to-police degrees of freedom (priors).

  ### 5. Addressing the Philosophical Objection

  Board members favoring Proposal B argue that frequentism is philosophically flawed because it relies on hypothetical repeated sampling rather than the evidence at hand. While this is a valid philosophical critique, it is not the *practical* cause of our replication crisis.

  The crisis was not caused by the definition of probability; it was caused by the **opacity of the research process**. A Bayesian analysis conducted on a model that was tuned to the data is just as misleading as a frequentist analysis conducted on a sample size determined by peeking.

  My colleague's claim that Bayesianism is "structurally better suited to resisting researcher degrees of freedom" is only true regarding *stopping rules*. It is false regarding *model specification*. Since model specification flexibility (choosing covariates, transformations, exclusions) was a larger driver of false positives in our subfield than optional stopping, switching to Bayes does not offer the structural immunity claimed.

  By contrast, **Registered Reports** offer structural immunity to *both* frameworks. They lock down the stopping rule, the model specification, and the analysis plan *before* the data exists. Therefore, the choice of statistic (Frequentist vs. Bayesian) becomes secondary to the choice of process (Registered Reports vs. Standard Submission).

  ### 6. Conclusion

  We cannot statistic our way out of a sociological problem. However, we can use statistical policy to enforce sociological change.

  Proposal B risks trading a known devil (p-hacking) for an unknown one (prior-hacking), while demanding a level of statistical literacy our current reviewer pool may not possess. Proposal A, specifically when coupled with the Registered Reports format, directly targets the incentives that produced the failed replications. It prioritizes **transparency and auditability** over theoretical elegance.

  I move that the board adopt Modified Proposal A (Registered Reports + $p < .005$ + Effect Size Estimation) effective immediately for all new empirical submissions.

  ***

  **References for Board Consideration:**
  *   Benjamin, D. J., et al. (2018). Redefine statistical significance. *Nature Human Behaviour*.
  *   Gelman, A., & Loken, E. (2014). The statistical crisis in science. *American Scientist*.
  *   Simmons, J. P., Nelson, L. D., & Simonsohn, U. (2011). False-positive psychology. *Psychological Science*.
  *   Wagenmakers, E. J., et al. (2018). Bayesian inference for psychology. *Psychonomic Bulletin & Review*. (For counter-perspective).
