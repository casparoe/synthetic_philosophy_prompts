      *Wait, one nuance:* The prompt asks for a "real recommendation." I need to make sure the logic holds up ethically. The distinction between "Duty of Care" and "Systemic Constraints" is a standard ethical framework in public health and safety.

      *Let's write.*

      *Structure:*
      1. Header.
      2. Context/Problem Statement.
      3. Recommendation (The Boxes).
      4. The Guiding Principle (Duty + Control).
      5. The Strongest Objection (Systemic Enablement).
      6. Conclusion.

      *Tone Check:* Professional, thoughtful, decisive.

      *Key Phrase:* "Proximate Responsibility" vs "Ultimate Causality."

      *Let's finalize the "Primary Cause" wording.* "Failure to Remediate Known Electrical Hazard" is better than "Landlord Negligence" because it describes the act, not just the label. But the prompt says the box decides referral. So it needs to point to the actor. "Landlord Failure to Remediate Known Hazard."

      *Contributing Factors:* "Municipal Inspection Staffing Shortages" and "Ambiguous Caregiver Safety Protocols."

