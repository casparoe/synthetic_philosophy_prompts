      *   **The "Clean Rule" Reality Check:** Philosophy confirms there is no clean rule because language is messy. Moderation is about *community health*, not just truth conditions.
      *   **Actionable Advice:**
          *   Distinguish *Mention* vs. *Use*.
          *   Prioritize *Target* and *Intent*.
          *   Implement *Friction* (spoilers, NSFW tags) rather than just bans for edge cases.
