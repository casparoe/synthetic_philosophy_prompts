prompt: |-
  I've gotten really into mushroom foraging over the past year. At first I had to slowly check every feature against my field guide, but now when I spot a chanterelle or a death cap I just instantly know what it is, like it actually looks obviously different at a glance instead of me running through a mental checklist. A mycologist friend says thats just what expertise feels like and that I should trust my gut now, but it kind of freaks me out, what if I'm just seeing what I expect to see, and thats exactly how someone eventually poisons themselves? Is there a real difference between my eyes actually picking up more info now vs my brain just getting faster at fooling itself, and should I trust these instant IDs or keep forcing myself to double-check against the book even when it feels totally obvious?
