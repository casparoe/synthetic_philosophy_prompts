      *   *Reasons-Responsiveness (Fischer & Ravizza):* Freedom is about the mechanism being responsive to reasons, not about metaphysical alternate possibilities.
      *   *Strawson (P.F.):* "Freedom and Resentment." Shifts the focus from metaphysics to our interpersonal practices (reactive attitudes).
      *   *Comparison:* Hume says "Necessity isn't real (in the way you think)." Moderns say "Necessity might be real, but it doesn't matter for responsibility/freedom."

