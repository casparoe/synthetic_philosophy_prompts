answer: |-
  This is a fantastic question, and your skepticism is well-founded. In fact, when Lara Buchak first started circulating this work, many economists and decision theorists had the exact same reaction you did: *"Isn't this just Expected Utility Theory (EUT) with a non-linear probability weighting, which we already know we can model by tweaking the utility function?"*

  The short answer is: **No, it is not just a coordinate transform.** While the two theories can be calibrated to agree on specific, isolated choices (like your 50/50 $0/$100 vs. $50 example), they are mathematically distinct classes of functions that diverge significantly on compound choices.

  As a physicist, the cleanest way to see this is to look at the **linearity in probability space**.

  ### 1. The Mathematical Distinction

  In standard EUT, the value of a gamble $G$ with outcomes $x_i$ and probabilities $p_i$ is:
  $$ V_{EUT} = \sum p_i u(x_i) $$
  Crucially, this function is **linear in probabilities**. If you double the probability of an outcome, you double its contribution to the expected utility. No matter how concave you make $u(x)$ (log, sqrt, etc.), the equation remains linear in $p$.

  In Buchak's Risk-Weighted Expected Utility (REU), the value is:
  $$ V_{REU} = \sum u(x_i) \cdot \left[ r\left(\sum_{j \ge i} p_j\right) - r\left(\sum_{j > i} p_j\right) \right] $$
  Where $r$ is the risk function (with $r(0)=0, r(1)=1$). If $r(p) = p$, REU collapses to EUT. But if $r$ is convex or concave, the weighting of the probabilities becomes **non-linear**.

  **The Physics Analogy:**
  Think of EUT as a linear system (like a harmonic oscillator). You can change the parameters (mass, spring constant / utility function), but it remains a linear differential equation.
  REU introduces a non-linear term into the probability dynamics. You cannot transform a linear equation into a non-linear one simply by redefining the position variable (utility).

  Because EUT is linear in $p$ and REU is non-linear in $p$, there is no monotonic transformation of $u(x)$ that can make EUT mimic REU across all possible gambles.

  ### 2. The Smoking Gun: The Allais Paradox

  Your reading group couldn't find a choice where they differ because you were likely looking at simple binary gambles. On simple gambles, you can often "fit" an REU agent with an EUT agent by curving the utility function enough.

  The divergence appears when you test the **Independence Axiom**. This is the core axiom of von Neumann-Morgenstern EUT. It states that if you prefer Gamble A to Gamble B, you should still prefer A to B even if both are mixed with a third Gamble C with the same probability.

  **The Allais Setup:**
  *   **Choice 1:**
      *   **1A:** $1 million for sure.
      *   **1B:** 10% chance of $5 million, 89% chance of $1 million, 1% chance of $0.
      *   *(Most people choose 1A)*
  *   **Choice 2:**
      *   **2A:** 11% chance of $1 million, 89% chance of $0.
      *   **2B:** 10% chance of $5 million, 90% chance of $0.
      *   *(Most people choose 2B)*

  **Why EUT Fails:**
  If you prefer 1A over 1B, EUT mathematically *requires* you to prefer 2A over 2B. The 89% chance of $1 million in Choice 1 and the 89% chance of $0 in Choice 2 are "common consequences" that should cancel out according to the Independence Axiom.
  A concave utility function **cannot fix this**. You can make $u(x)$ as concave as you like, but because the probabilities enter linearly, the inequality direction cannot flip between the two choices. If your utility function explains 1A > 1B, it forces 2A > 2B.

  **Why REU Succeeds:**
  REU explicitly violates the Independence Axiom by design. The risk function $r(p)$ allows the agent to weight the "sure thing" probability (100% in 1A) differently than the split probabilities in 1B. It captures the intuition that moving from 99% to 100% certainty is more valuable than moving from 10% to 11%, even if the expected utility difference is the same.
  Buchak argues this isn't an irrational bias (as Kahneman/Tversky suggested), but a rationally permissible attitude toward risk.

  ### 3. The Conceptual Distinction: "Why are you risk averse?"

  This is the philosophical meat that your group might find interesting. The two theories offer fundamentally different explanations for risk aversion.

  *   **EUT Explanation:** You are risk averse because of **diminishing marginal utility of wealth**. You reject a 50/50 bet of $\$100/\$0$ vs $\$50$ not because you dislike the risk, but because the first $\$50$ is worth more to you than the second $\$50$. If we switched the currency to something with linear utility (like "lives saved" or perhaps points in a game), EUT predicts you should become risk-neutral.
  *   **REU Explanation:** You are risk averse because of **aversion to the spread of outcomes**. You might value money linearly ($u(x) = x$), but you still dislike the gamble because of the uncertainty itself. REU separates the *value of the goods* (utility) from the *attitude toward the risk* (risk function).

  For a scientist, this separation of variables is appealing. In EUT, risk attitude and utility are confounded into a single function $u(x)$. In REU, they are distinct parameters: $u(x)$ measures how much you want the outcome, $r(p)$ measures how much you dislike the uncertainty of getting it.

  ### Summary for your Reading Group

  To save face (or perhaps embarrass them gently), you can bring this up:

  1.  **Mathematically:** EUT is linear in probability; REU is non-linear. You cannot map one to the other via a utility transformation.
  2.  **Empirically:** They diverge on Allais-type problems. EUT (even with concave utility) cannot accommodate the common preference pattern (1A & 2B); REU can.
  3.  **Conceptually:** EUT conflates "I value money less as I get more" with "I dislike uncertainty." REU disentangles them.

  Buchak's project isn't just relabeling; it's an attempt to rescue risk aversion from the charge of irrationality. In standard EUT, if you violate Independence (like in Allais), you are susceptible to a "money pump" (Dutch Book) and are therefore irrational. Buchak argues that if risk-weighting is a fundamental rational preference (like time-discounting), then violating Independence doesn't make you irrational, it just makes you an REU maximizer rather than an EUT maximizer.

  It's not polar vs. cartesian coordinates; it's Euclidean vs. Riemannian geometry. They look the same locally (on simple gambles), but the curvature (probability weighting) reveals the difference globally.
