answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophers of science, Elena and Marcus, are finishing up a seminar on confirmation theory.*

  **Elena:** You know, I appreciated your pushback during the Q&A, Marcus. But I have to say, when you waved away the Duhem-Quine thesis with a hand gesture toward Solomonoff Induction, I saw three people in the front row visibly relax. Like you'd just handed them a fire extinguisher for a problem that's actually a structural fault in the building.

  **Marcus:** *(Smiling)* I noticed that too. Look, I get the skepticism. But the LessWrong crowd isn't just being dogmatic. If underdetermination is the claim that evidence $E$ is compatible with multiple theories $T_1, T_2...$, Bayesianism says: sure, logically. But probabilistically? Not if you have a prior that penalizes complexity. Solomonoff gives us the *universal* prior. It dissolves the "grue" problem because "green" has a shorter program length than "grue."

  **Elena:** Does it? Or does it just relocate the arbitrariness? Let's stick with the UTM—the Universal Turing Machine. Solomonoff complexity is defined relative to a choice of machine, right?

  **Marcus:** Kolmogorov complexity is, yes. But the Invariance Theorem handles that. If you switch from UTM $U$ to $U'$, the complexity of any string changes by at most a constant $C$. $K_U(x) \leq K_{U'}(x) + C$. As the data stream grows, that constant becomes negligible. The posterior converges.

  **Elena:** "In the limit, we are all dead," Marcus. Keynes said that about markets, but it applies here. Science doesn't happen at the limit. It happens on finite datasets. If the constant $C$ is large enough—and there's nothing in the math preventing it from being astronomically large—then the choice of UTM dictates the posterior for any realistic amount of evidence. You haven't solved underdetermination; you've just pushed it back to the choice of the reference machine.

  **Marcus:** That's a fair point on finite data, I'll grant you. But you're treating the UTM choice as if it's made in a vacuum. We aren't disembodied minds picking Turing machines out of a hat. We are physical agents embedded in a universe. The "natural" UTM is one that simulates the physics we inhabit. If the universe is computable, there's a machine that simulates it efficiently. Choosing a "perverse" UTM that makes "grue" simple is like choosing a coordinate system where the laws of physics change every Tuesday. It's possible, but it's not *natural*.

  **Elena:** Ah, "natural." There's the smuggled premise. You're appealing to pragmatic naturalism to save the formalism. You're saying, "We pick the UTM that makes the laws of physics simple." But how do you know which laws of physics are the real ones without already assuming the evidence supports them? That's circular. The Duhemian point is that we can always save a theory by tweaking the auxiliaries. In your framework, the "auxiliaries" are built into the UTM. If I choose a UTM where "grue" is primitive, my "green" observations are the ones requiring complex auxiliaries. The math doesn't tell me which UTM to use; my pre-existing theoretical commitments do.

  **Marcus:** Okay, but let's distinguish between *logical* underdetermination and *rationally resolvable* underdetermination. Duhem says you can always save the hypothesis. Solomonoff says you can, but the cost goes up. Every time you add an ad-hoc auxiliary to save a theory, you're adding bits to the program. The prior probability drops exponentially. So, while you *can* hold onto a falsified theory by complicating your UTM or your auxiliaries, you are becoming increasingly improbable. Isn't that enough? It turns a binary "can/cannot" into a gradient of "how much complexity are you willing to buy?"

  **Elena:** It turns it into a gradient, yes. But it doesn't tell me where to cut. You're assuming that the universe *is* biased toward simplicity. That's a metaphysical claim, not a mathematical one. Solomonoff Induction assumes the data is generated by a computable probability distribution. What if the universe isn't computable? Or what if it's computable, but by a hypercomputer?

  **Marcus:** If the universe isn't computable, then no induction works, Bayesian or otherwise. We'd have to pack up and go home. But assuming we're doing science at all, we're assuming some regularity. The beauty of Solomonoff is that it dominates any other computable predictor. Even if the "true" prior isn't Solomonoff, SI will converge to it as long as it's computable. It's the safest bet. It's the minimax strategy for prediction.

  **Elena:** But "safest" relative to what loss function? And again, we're back to the UTM. Let's say I'm a "Grue-ist." I define my UTM such that the predicate "grue" is a single bit. For me, the prediction that emeralds will change color in 2050 is the simple hypothesis. You say my UTM is "complex" because it requires a big translation layer to match your sensory data. But I say the same about yours. We are at an impasse. The formalism doesn't break the tie. It just codifies the tie.

  **Marcus:** I think you're underestimating the convergence speed. The constant $C$ represents the size of the compiler between our UTMs. If our UTMs are wildly different, $C$ is big. But if we are both human scientists, sharing a language and sensory apparatus, our effective UTMs are already very close. The "Grue-ist" UTM isn't just a different machine; it requires a conspiracy of cognitive architecture to maintain. The prior isn't just about the world; it's about the interface between the agent and the world.

  **Elena:** Now you're sounding like a Kantian. The "interface" is the web of belief. And that web is holistic. When an anomaly comes in—say, an emerald turns blue tomorrow—I can adjust my theory of mineralogy, or I can adjust my theory of optics, or I can adjust my logic. Solomonoff assigns penalties to program length, but it doesn't tell me *which part* of the program to tweak. That's the heart of Duhem. The evidence underdetermines the *location* of the error, not just the truth of the hypothesis.

  **Marcus:** True, SI doesn't output a diagnosis. It outputs a posterior over total world-models. It doesn't say "fix the optics"; it says "World-Model-A (where optics are broken) is now 60% probable, World-Model-B (where mineralogy is broken) is 40%." It aggregates the underdetermination. It doesn't eliminate the holism, but it quantifies the cost of maintaining each holistic web. That's progress. It stops us from treating all empirically equivalent theories as equal.

  **Elena:** It stops us from treating them as equal *if* we agree on the prior. But the LW-sphere tends to treat the Solomonoff prior as *The* Prior. As if it's objective. It's not. It's objective relative to a UTM. And since the UTM choice is underdetermined by evidence, the prior is underdetermined by evidence. You've built a beautiful engine, Marcus, but you haven't told me how to turn the key without already knowing where I want to go.

  **Marcus:** I'll concede it's not a magic bullet that generates truth ex nihilo. But calling it "arbitrary" is too strong. It's *constrained* arbitrariness. Think of it like choosing a coordinate system in physics. You can choose Cartesian or Polar. The physics doesn't change, but some problems are intractable in one and easy in the other. The Solomonoff prior is the "Cartesian" choice for induction. Is it the only one? No. Is it the one that makes the widest range of learning problems tractable? Yes.

  **Elena:** That's a pragmatic defense. And I'm fine with pragmatism! But then admit it: the reason we reject "grue" isn't because Solomonoff proves it false. It's because "grue" is pragmatically useless for our form of life. The math is just dressing up a biological and sociological fact.

  **Marcus:** I think the math explains *why* that form of life succeeds. Evolution selected for agents who compress data well. Agents who use a prior roughly isomorphic to Solomonoff on their local UTM survive. Agents who bet on "grue" get eaten by tigers. So the "pragmatic" fact is grounded in the computational structure of learning. The prior isn't arbitrary; it's selected by the environment.

  **Elena:** *(Pauses, stirring her coffee)* Okay. That's better. If you ground the UTM choice in evolutionary history, you're admitting the underdetermination is resolved by causal history, not pure logic.

  **Marcus:** I'm saying the logic of induction requires a starting point. Pure logic can't bootstrap itself. But once you admit *any* bias toward compression, Solomonoff shows you the optimal way to implement it. It doesn't solve the "why is there something rather than nothing" of priors, but it solves the "given that we prefer simplicity, how do we define it consistently" problem.

  **Elena:** I can live with that. It's not a dissolution of underdetermination, though. It's a management strategy. You're saying, "Underdetermination exists, but if we all agree to use this specific complexity metric, we'll converge faster."

  **Marcus:** And I'd say that for all practical purposes, convergence *is* truth. If two theories are empirically equivalent forever, and one is exponentially simpler, does the distinction matter?

  **Elena:** *(Smiles)* And there's the positivist slipping back in. If I'm a realist, I care about what's actually happening, not just what predicts the data. But... I'll grant you this: Solomonoff forces the realist to pay for their complexity. If you want to posit invisible dragons guiding the emeralds, you have to acknowledge you're spending prior probability mass to do it.

  **Marcus:** Exactly. It doesn't ban dragons. It just makes them expensive.

  **Elena:** Fair enough. Just don't tell the grad students it's a knockdown argument. I don't want them thinking the hard work of philosophy has been outsourced to a Turing machine.

  **Marcus:** Deal. The machine does the calculating; we still have to decide which machine to run.

  **Elena:** And why.

  **Marcus:** And why.
