  ok this isn't for an assignment or anything but it's been bugging me since we started covering paternalism in my philosophy of law class. My aunt has bipolar disorder, and a few years back when she was stable she signed an advance directive saying that if she ever went manic again, doctors should hospitalize her and put her back on meds no matter what she said in the moment, even if she was refusing. She had an episode last month and was begging everyone not to hospitalize her, insisting she felt totally fine and that the old paper didn't count anymore, but they followed it over her objections anyway. My cousin thinks that's basically overriding a competent adult's current wishes, which feels wrong, but my mom says manic-her doesn't really get a vote since shes not thinking straight at that point. I kind of see both sides, but I can't figure out whose wishes should actually win here, past-her or present-her. Is there even a good way to decide that?
