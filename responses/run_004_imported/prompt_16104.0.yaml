answer: |-
  This is one of the most profound and difficult questions in bioethics and the philosophy of law. It is completely understandable why this is bugging you; you are watching a theoretical debate play out in real-time with someone you love.

  In philosophy of law and bioethics, this specific scenario is often discussed under the umbrella of **Psychiatric Advance Directives (PADs)** or **"Ulysses Contracts."** The name comes from Homer's *Odyssey*, where Ulysses has his crew tie him to the mast so he can hear the Sirens' song without being able to steer the ship toward them. He knows his future self will want something destructive, so his past self restricts his future freedom to protect him.

  Here is a breakdown of the philosophical arguments on both sides, and how the law generally tries to navigate them.

  ### 1. The Argument for "Present-Her" (Your Cousin's View)
  **Core Principle: Current Autonomy and Bodily Integrity**

  Your cousin is relying on a standard liberal view of autonomy: a competent adult has the right to refuse medical treatment, even if that refusal leads to harm.

  *   **The Right to Change One's Mind:** People are allowed to change their values and wishes over time. Just because she signed a paper three years ago doesn't mean she is the same person today.
  *   **The Epistemic Problem:** How can we be *sure* she isn't competent right now? Mania can feel like clarity to the person experiencing it. If we override her because she disagrees with the doctors, are we treating her illness, or just punishing her for non-compliance?
  *   **Trauma of Coercion:** Forced hospitalization and medication can be traumatic. Your cousin might argue that violating her current bodily integrity undermines her trust in the medical system and her family, potentially causing long-term harm that outweighs the short-term benefit of stabilization.

  ### 2. The Argument for "Past-Her" (Your Mom's View)
  **Core Principle: Precedent Autonomy and Beneficence**

  Your mom is arguing from the perspective of **Precedent Autonomy**. This is the idea that the decisions made by a competent self should bind the incompetent self.

  *   **Capacity vs. Autonomy:** In law and ethics, autonomy only protects decisions made by someone with **decision-making capacity**. Capacity generally requires the ability to understand information, appreciate the situation, reason through options, and communicate a choice.
      *   If the doctors determined that "Manic-Her" lacked capacity (due to psychosis, impaired judgment, or inability to recognize illness), then her current refusal carries no ethical weight. She isn't "overriding a competent adult"; she is overriding a *temporarily incapacitated* patient.
  *   **The "True Self" Argument:** Many philosophers (like Ronald Dworkin) argue that there is a distinction between a person's critical interests (their long-term values and life plan) and their experiential interests (what feels good in the moment).
      *   "Stable-Her" values health, stability, and safety.
      *   "Manic-Her" values the immediate feeling of freedom or grandiosity.
      *   Respecting "Stable-Her" is seen as respecting the person's authentic, long-term identity, whereas "Manic-Her" is viewed as the illness speaking, not the person.
  *   **The Purpose of the Contract:** If the directive could be voided the moment the patient said "no," it would be useless. The whole point of a Ulysses Contract is to anticipate that the future self will irrationally refuse help.

  ### 3. Is there a way to decide?
  In philosophy of law, the "tie-breaker" usually comes down to **Capacity Assessment.**

  If "Present-Her" is deemed to have **capacity**, her current wishes generally win. If she understands the risks of refusing meds and still refuses, the law usually sides with her, even if she has a directive.

  However, in severe manic episodes, the clinical assessment is often that the patient **lacks capacity** because the mania distorts their perception of reality (e.g., "I don't need sleep," "I am god," "The doctors are poisoning me"). If she lacks capacity, the legal authority defaults to the most recent *competent* decision, which is the Advance Directive ("Past-Her").

  **The Philosophical Tension:**
  The problem is that capacity isn't a light switch; it's a dimmer. There are gray areas where a patient is partially lucid.
  *   **Soft Paternalism:** This justifies intervention only when the person's choice is not truly voluntary or informed (i.e., they are incapacitated). Your mom's view aligns here.
  *   **Hard Paternalism:** This justifies intervention even if the person is competent, simply because the choice is bad for them. This is generally rejected in modern law, but sometimes creeps into psychiatry.

  ### 4. Why this feels so uncomfortable
  It feels wrong to you because it touches on the problem of **Personal Identity**.
  *   Is "Manic-Her" the same person as "Stable-Her"?
  *   If you believe they are the same person, then "Stable-Her" is protecting "Manic-Her" from herself (like stopping a sleepwalker from walking off a cliff).
  *   If you believe the mania creates a temporary, different state of being, then overriding her feels like a violation of the person currently in the body.

  ### Summary for your Class (and your family)
  There is no perfect answer, but the prevailing legal and ethical framework usually sides with your mom, **provided that incapacity is established.**

  1.  **If she lacked capacity:** The Advance Directive stands. This is "Precedent Autonomy." The law views the directive as the last valid expression of a competent will.
  2.  **If she had capacity:** The directive should arguably be voided. A competent person can usually revoke a directive in the moment.

  **The tragic reality:** In bipolar mania, the illness often attacks the very faculty needed to recognize the illness (anosognosia). Therefore, the system is designed to trust the "Stable-Her" because "Manic-Her" is chemically incapable of making a safe judgment.

  **A note on the human element:**
  While the *ethics* might support following the directive, the *relational* cost is real. Your cousin feels a violation occurred because, from the outside, it looks like force. Your mom feels relief because she sees safety restored. Both feelings are valid.

  In your class, you might frame it this way: **The conflict isn't between Past vs. Present. It is between Authentic Autonomy (Past) vs. Immediate Liberty (Present).** Most legal systems prioritize Authentic Autonomy when Immediate Liberty is compromised by a lack of cognitive capacity.

  ***

  *Disclaimer: I am an AI, not a lawyer or a doctor. Laws regarding psychiatric advance directives vary significantly by state and country. In some jurisdictions, a patient can revoke a directive even while symptomatic; in others, they cannot. This is for philosophical discussion, not legal advice.*
