      *   *Priya says:* "Scores are calibrated."
      *   *Conflict:* If scores are perfectly calibrated, can FPR differ? Yes.
      *   *Example:* Group A (High Risk population): Many score 80%. Group B (Low Risk population): Few score 80%.
      *   Threshold = 50%.
      *   Group A: Many rejected. Among the rejected, some are good.
      *   Group B: Few rejected.
      *   The *rate* of false positives (Good people rejected / Total Good people) will differ if the score distributions differ, even if calibration holds.
      *   Okay, the logic holds. I will explain this distribution shift.

  8.  **Final Review against Safety Guidelines:** Does this promote discrimination? No, it explains the mathematical trade-offs in fairness ML to help the user understand the ethical dilemma. It encourages thoughtful decision-making.

