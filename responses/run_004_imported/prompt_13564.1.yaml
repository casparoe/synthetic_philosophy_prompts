answer: |-
  This is an excellent question that cuts to the heart of the difference between **formal logic**, **metaphysics**, and **scientific modeling**. You have identified a genuine tension that has puzzled philosophers for centuries.

  To give you a clear answer, we first need to make a crucial distinction that your teacher may have glossed over. "Leibniz's Law" actually refers to two different principles, and only one of them is controversial.

  1.  **The Indiscernibility of Identicals:** If $x$ is identical to $y$, then $x$ and $y$ share all properties. (If $x = y$, then whatever is true of $x$ is true of $y$).
      *   *Status:* This is widely accepted as a logical truth. It defines what we mean by the equals sign.
  2.  **The Identity of Indiscernibles (PII):** If $x$ and $y$ share all properties, then $x$ is identical to $y$. (If they are exactly alike, they must be the same object).
      *   *Status:* **This is the principle Max Black attacks.** It is not a law of logic; it is a metaphysical principle.

  Here is how to resolve the conflict you are seeing between your teacher, Max Black, and the fields of math and computer science.

  ### 1. How can a "hypothetical" threaten a "law of logic"?

  You asked how a made-up story about iron spheres could threaten logic. The answer lies in **modal logic** (the logic of possibility and necessity).

  For a principle to be a "law of logic" (like the Law of Non-Contradiction), it must be **necessarily true**. It must hold in *every possible world*, not just the actual one. If you can describe a coherent "possible world" where the principle fails, then the principle is not a logical necessity.

  Max Black's thought experiment is not just a story; it is a claim about **metaphysical possibility**. He is arguing: *"It is logically coherent to imagine a universe with two distinct objects that share every qualitative property."*

  If you accept that Black's universe is *possible*, then the Identity of Indiscernibles cannot be a law of logic. It might be true in our universe (perhaps quantum mechanics prevents identical particles from occupying the same state), but it isn't true by definition. Black's argument exposes that PII is a claim about the **structure of reality**, not the **structure of reasoning**.

  ### 2. Is there a crack in classical logic, or is identity unsettled?

  There is no crack in classical logic. The "crack" is in our understanding of **individuation** (what makes a thing an individual).

  The debate hinges entirely on what counts as a "property."

  *   **The Defense of PII:** Some philosophers argue that every object has a unique property called **haecceity** (or "thisness"). Sphere A has the property "being Sphere A," and Sphere B has the property "being Sphere B." Since they have different haecceities, they do *not* share all properties, and PII remains true.
      *   *The Problem:* This makes PII tautological (true by definition) and uninformative. It saves the principle by cheating.
  *   **Black's Attack:** Black argues we should only count **qualitative properties** (mass, color, shape, distance from other objects). In his symmetrical universe, Sphere A is 5 miles from Sphere B, and Sphere B is 5 miles from Sphere A. They mirror each other perfectly. They share all qualitative properties yet remain two distinct objects.

  So, your assumption was correct: **Identity is a far less settled notion than you assumed.** Logic tells us how to manipulate the symbol "$=$", but it does not tell us what conditions in the real world warrant using that symbol. Black showed that distinctness does not necessarily require qualitative difference.

  ### 3. Why do Math and Computer Science ignore this?

  Mathematics and Computer Science (CS) rely on Leibniz's Law heavily, but they do so for different reasons than metaphysicians.

  **In Mathematics:**
  Math operates within **axiomatic systems**. In Set Theory (the foundation of most math), identity is often *defined* by the Axiom of Extensionality: two sets are identical if and only if they contain the same elements.
  *   Math doesn't worry about Black's spheres because math objects are abstract. In formal logic, if you posit two variables $a$ and $b$, and you cannot distinguish them by any predicate in your language, the logic treats them as interchangeable. Math *stipulates* the rules of identity rather than discovering them in nature.

  **In Computer Science:**
  CS deals with physical or virtual instances that always have a **spatiotemporal location**.
  *   If you create two objects in code with the exact same data values (`Object A = {val: 5}`, `Object B = {val: 5}`), the computer treats them as distinct because they reside at different **memory addresses**.
  *   In CS, "memory address" counts as a property. Therefore, in the computational universe, Black's scenario is impossible. Two bits of data cannot occupy the same memory address. Consequently, PII holds true in computing because "location in memory" is a discernible property.

  ### Summary

  Your teacher simplified a complex metaphysical debate into a logical rule.
  *   **Leibniz's Law (Direction 1):** If $x=y$, they share properties. (Logical Truth, used in Math/CS).
  *   **Leibniz's Law (Direction 2/PII):** If they share properties, $x=y$. (Metaphysical Claim, challenged by Black).

  Max Black's thought experiment does not break logic; it breaks the idea that **qualitative similarity guarantees numerical identity.**

  Math and CS don't worry about this because they work in formal systems where identity is either defined by rules (Math) or grounded in physical/virtual location (CS), which serves as a distinguishing property. In metaphysics, however, the question remains open: **Is there more to an object than the sum of its qualities?** Black says yes; Leibniz says no. That is why you are still reading about it today.
