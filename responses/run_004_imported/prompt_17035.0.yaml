          *   *Claim:* Water rotates with bucket -> surface concave. Relative motion between water/bucket is zero. Therefore, rotation is relative to space itself (Absolute Space).
          *   *Assessment:* This is the classic Newtonian argument for Substantivalism. It's historically accurate and physically sound *within Newtonian mechanics*.
          *   *Verdict:* Dana wins this round *on Newtonian terms*.

      *   **Move 2: Marcus (Mach's Principle).**
