              *   *Critique:* Marcus is conflating *substantivalism* (spacetime exists) with *manifold substantivalism* (spacetime points have haecceity/identity). There are ways to be a realist about spacetime without accepting the Hole Argument's conclusion (e.g., metric substantivalism, structural realism).
