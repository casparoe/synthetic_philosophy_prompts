  10. (Final Polish): Ensure tone is empathetic but analytical. Acknowledge the weirdness of the situation. (Wait, one more thing: The prompt says the uncle has to be convinced *beforehand*. So the intention must exist *now*. But the incentive vanishes *Sunday*. So the intention must be robust enough to survive the removal of the incentive.)

      *Wait, critical check:* In Kavka's puzzle, the reward is given *if you intend*. Here, the reward is given *if he is convinced you intend*. If the uncle is infallible, he is essentially a human reward-trigger for "True Intention."
