      *   *Key Psychological Concepts:*
          *   **Deindividuation:** People act differently in groups/online.
          *   **Context Collapse:** The audience is mixed (neighbors, outsiders, activists), leading to misinterpretation.
          *   **Asymmetry of Effort:** It takes seconds to insult, hours to recover.
          *   **The "Silent Majority" Effect:** Allies stay quiet (spiral of silence), making the opposition seem louder.

  4.  **Address the Specific Pain Points:**
      *   *Mischaracterization ("Anti-housing"):* Being labeled is worse than being argued with. It shuts down nuance.
