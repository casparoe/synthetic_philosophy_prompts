      *   **Groom's Philosophy:** Committed Negative Utilitarian (NU) / Suffering-Focused Ethics (SFE). Reads Vinding/Knutsson. Believes pain outweighs pleasure. Jokes about painless extinction being a moral improvement.
      *   **The Conflict:** Nick is happy about marriage and wants kids, which seems contradictory to strict NU/anti-natalist leanings. He uses "tranquilism" and "cooperative reasons" to justify it.
      *   **Goal:** A 5-minute speech that is *honest* to Nick's views (no generic "lifetime of happiness" fluff) but *warm* and *accessible* (no philosophy lecture). Needs to acknowledge the tension without resolving it academically. Needs one inside joke for the cohort that doesn't alienate the family.
      *   **Tone:** Affectionate, funny, sincere, slightly intellectual but grounded.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Strict NU:* Minimize suffering. Creating life risks suffering. Therefore, creating life is risky/wrong.
      *   *Nick's Reality:* He's getting married and wants kids. He's happy.
      *   *The Bridge:* How do we frame this?
