      *   **The Tension (The Elephant in the Room):** Acknowledge that marriage/kids usually come with "happiness" wishes. Admit that Nick might wince at that.
      *   **The Reframe:** Instead of "maximizing happiness," focus on "minimizing suffering together." Marriage as a team to handle life's difficulties. This is NU-compatible (reducing net pain) and Normie-compatible (supporting each other through hard times).
