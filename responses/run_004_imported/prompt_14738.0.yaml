          *   Frame the potential children not as "adding happiness" but as "managing existence with care."
          *   Use the concept of "cooperative reasons" (don't be a jerk about your ethics) as a virtue of friendship and partnership.
          *   Avoid promising "eternal bliss." Promise "support," "mitigation," and "shared burden."

