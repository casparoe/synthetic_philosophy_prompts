answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being Nick's friend for about six years, most of which were spent in a philosophy department where we were trained to overthink absolutely everything.

  Standing up here, I know what's expected of a Best Man. I'm supposed to tell you that marriage is a magical journey. I'm supposed to wish Nick and Priya a lifetime of uninterrupted happiness, boundless joy, and a future where every day is better than the last.

  But… this is Nick. And if I stood here and promised him a life of "uninterrupted happiness," he wouldn't just roll his eyes. He'd probably pull me aside later to explain why promising that is empirically dishonest and ethically irresponsible.

  For those of you who don't know Nick's background: Nick takes things seriously. Most people worry about having a good day. Nick worries about the structural integrity of existence. He's the kind of person who reads ethical theory for fun, who thinks deeply about pain, and who believes that reducing suffering is the most important thing we can do.

  In fact, Nick has told me more than once—half-joking, half-not—that a costless, painless end to all sentient life would technically count as a moral improvement over the status quo.

  **[Pause for effect]**

  But I've seen him look at Priya. And I'm pretty sure he's finally found a counter-example.

  **[Smile, look at Nick and Priya]**

  For the philosophers in the room, you know what a big concession that is. For everyone else, just know that it means Priya makes life feel worth the trouble.

  Now, I know Nick and Priya are planning to have children in a few years. And look, I'm not going to stand here and say, "I can't wait for you to create more happy people!" because I know that's not exactly how Nick views the math. He knows that bringing a person into the world isn't about adding to a quota of happiness. It's about taking on a profound responsibility to protect someone from the inevitable difficulties of being alive.

  Nick and I actually had a long debate about this last week. We didn't solve the metaphysics of procreation by 1 AM. But what I realized, watching him plan this wedding and build this life, is that Nick's ethics aren't a wall that keeps him away from the world. They're a compass.

  He doesn't love Priya because he thinks she's going to eliminate all suffering. He loves her because she's the person he wants to face the suffering *with*.

  In a lot of weddings, the vow is "for better or for worse." For Nick, I think the vow is slightly more specific. It's: "I promise to be the person who holds your hand when things are difficult. I promise to minimize the pain in your life wherever I can. And I promise to be a cooperative partner, even when my theoretical frameworks suggest I should be more difficult."

  And that, honestly, is why I'm so optimistic about this marriage. Because Nick isn't chasing a fantasy of bliss. He's building a partnership of resilience. He knows life contains pain. We all know that. But he's found someone who makes the burden lighter.

  Priya, thank you for grounding him. Thank you for being the variable that tips the scale. Nick is a better, kinder, and yes, happier man because you are in his life. And to Nick: I'm proud of you. Not just for sticking to your principles, but for knowing when love is more important than being right.

  So, if everyone could please raise their glasses.

  I won't wish you a life without pain, because that's impossible.
  I won't wish you constant euphoria, because that's unsustainable.

  Instead, I wish you the strength to handle the hard days together. I wish you the wisdom to reduce harm wherever you go. And I wish you a life where the net suffering is low, the support is high, and the love is undeniable.

  To Nick and Priya.

  **[Clink glasses]**
