answer: |-
  1. **The Methodological Weight of the "Incredulous Stare"**
  David Lewis famously dismissed the "incredulous stare" as merely an inarticulate report of surprise, suggesting it carries no evidential weight against a theory that offers superior systematic utility. However, many metaphysicians treat strong pre-theoretic intuitions as data points that a theory must accommodate, not just overwrite. **Why should the incredulous stare count as more than an inarticulate report of surprise, and does dismissing it risk severing the connection between metaphysics and the very modal intuitions it aims to explain?**
  *   **Follow-up:** If you reply that intuitions are theory-laden and must be revised for the sake of systematicity, doesn't that risk making the theory immune to empirical or intuitive falsification, effectively insulating it from the "cost" side of the cost-benefit analysis you advocate?

  2. **The Epistemological Challenge**
  Mathematical Platonists face a Benacerraf-style problem: if mathematical objects are abstract and causally inert, how can we have reliable knowledge of them? Genuine modal realism posits concrete but causally isolated worlds. **Can our knowledge of these causally inert worlds escape a Benacerraf-style epistemological challenge any better than mathematical Platonism can, given that we lack any causal commerce with them?**
  *   **Follow-up:** If you argue that we know about them via abduction (inference to the best explanation) rather than causal tracking, does that not imply that our modal beliefs are justified solely by the utility of the theory, leaving the truth of the realism itself permanently underdetermined?

  3. **The Ethics of Indexical Actuality**
  On your view, "actual" is merely indexical, like "here" or "now," and all worlds are ontologically on a par. **Why then should suffering in some other, equally real world shouldn't trouble us as much as equally remote suffering within our own universe does?** If the ontological status is identical, what grounds the moral significance of the indexical distinction?
  *   **Follow-up:** If you respond that we cannot causally interact with those worlds and therefore cannot help them, does that reduce the moral distinction to a matter of practical impotence rather than ontological or moral significance, and does that satisfy the intuition that their suffering is *unfortunate* in a way that demands more than indifference?

  4. **Counterpart Theory and *De Re* Modality**
  Kripke argued that when we say "Humphrey might have won," we are talking about Humphrey himself, not a merely similar person in another world. **How is counterpart theory supposed to answer Kripke's objection that a claim like "Humphrey might have won" isn't really about some other, merely similar candidate?** How do you recover the intuition that modal claims are *de re* without transworld identity?
  *   **Follow-up:** If you argue that the counterpart relation is sufficient for *de re* modality because it preserves the relevant qualitative properties, doesn't that imply that identity over time (perdurance) faces the exact same problem, forcing us to accept that we are not strictly identical to our future selves either?

  5. **The Principle of Recombination**
  Lewis relies on the principle of recombination to generate the plurality of worlds: anything can coexist with anything, provided they occupy distinct spatiotemporal positions. **Are there limits to recombination, such as the existence of a set of all possible worlds or objects with incompatible essential properties, and if so, what grounds those limits if not modal facts prior to the worlds?**
  *   **Follow-up:** If you concede that logical consistency bounds recombination, does that not suggest that logic is prior to the worlds, thereby undermining the claim that worlds provide the reductive basis for all modal truth?

  6. **Quantitative vs. Qualitative Parsimony**
  You argue that we should prioritize qualitative parsimony (fewer kinds of things) over quantitative parsimony (fewer individual things). **Given that positing an infinity of concrete worlds seems to violate Ockham's Razor in its most common formulation, why should we accept a trade-off that explodes our ontology to save our ideology?**
  *   **Follow-up:** If you maintain that ideological simplicity is the true measure of theoretical cost, how do you prevent this from licensing any ontological extravagance so long as it simplifies the primitive vocabulary, potentially allowing for wildly implausible metaphysical systems?

  7. **The Nature of Propositions**
  In your framework, propositions are typically analyzed as sets of possible worlds. **Does this not lead to the problem of coarse-grainedness, where all necessary truths express the same proposition (the set of all worlds), thereby failing to distinguish between distinct mathematical or logical insights?**
  *   **Follow-up:** If you propose a structured proposition view to mitigate this, does that not reintroduce the very intensional entities you sought to eliminate, rendering the reduction to sets of worlds merely notational?

  8. **Humean Supervenience and Laws**
  Lewisian metaphysics often pairs modal realism with Humean supervenience, where laws are just regularities in the best system. **If every possible regularity is instantiated in some concrete world, does this not trivialize the notion of a "law of nature," making it impossible to distinguish between a world with genuine laws and one with mere accidental regularities?**
  *   **Follow-up:** If you argue that the distinction is internal to each world's best system, does that not imply that necessity is entirely immanent and local, leaving no room for the robust modal realism that was supposed to ground counterfactuals globally?

  9. **Temporal Parts and Modal Parts**
  Lewis's argument for modal parts often parallels his argument for temporal parts (perdurance). **Is genuine modal realism committed to perdurantism about time, and if one rejects temporal parts, does the analogy collapse, leaving transworld individuals as the more parsimonious option?**
  *   **Follow-up:** If you deny that GMR requires perdurantism, how do you explain the structural isomorphism between the two views without admitting that the motivation for one is inextricably linked to the acceptance of the other?

  10. **Theory Choice and Ersatzism**
  Finally, regarding the competition between genuine realism and ersatzism (the view that worlds are abstract representations): **What, short of a proof of outright inconsistency, would actually move her toward a cheaper ersatzist alternative?** Is there a specific theoretical cost or empirical discovery that could tip the balance, or is the commitment to concreteness non-negotiable?
  *   **Follow-up:** If you answer that only logical inconsistency could move you, does that not suggest your position is held as a priori dogma rather than a hypothesis subject to the same abductive reasoning you apply to other metaphysical claims?
