answer: |-
  You are completely justified in feeling bugged. While your friend is **technically** correct about the legal side, he is **socially and ethically** in the wrong.

  Here is the breakdown of why this situation feels so off, and how to handle it.

  ### 1. Legal vs. Social Contracts
  Your friend is hiding behind a **legal technicality**. In the eyes of the law, verbal agreements between friends about vacation plans are generally not binding contracts. He cannot be sued for backing out of a trip.

  However, friendships run on **social contracts**. When you spend six months planning, confirm attendance repeatedly, and help select flights, you are creating a binding agreement of *trust*. By saying "I'm in" repeatedly, he led the group to make decisions based on his participation. Backing out at the 11th hour violates that trust, even if he didn't sign a paper document.

  ### 2. The "Just Being Agreeable" Excuse
  His claim that he was "just being agreeable" is actually an admission of poor communication, not a valid excuse.
  *   **It wastes resources:** The group spent six months discussing dates, locations, and logistics. That is time and emotional energy you can't get back.
  *   **It creates financial risk:** This is the biggest issue. One friend put down a deposit on an Airbnb *for the group*. That booking was likely calculated based on four people splitting the cost. If he leaves, the remaining three either have to pay more, find a stranger to fill the spot, or risk losing the deposit if the booking needs to be changed.
  *   **It shows a lack of consideration:** A responsible adult knows that saying "yes" to a group trip has consequences. If he wasn't sure, he should have said, "This sounds amazing, but I need to confirm my work schedule before committing."

  ### 3. The Financial Obligation
  This is where he actually *does* owe something. While he doesn't owe you the trip, he may owe the group for the **reliance damages**.
  *   **The Airbnb:** If the friend who booked the Airbnb loses money because of his withdrawal (e.g., the deposit is non-refundable, or the price per person goes up significantly), he should ethically offer to cover his share of that loss. He created that financial liability by committing to the group.
  *   **The Flights:** Since tickets haven't been bought yet, there is no direct financial loss here, but prices may rise for the remaining three if they can no longer get a group rate or if availability drops.

  ### 4. How to Handle It
  You have a decision to make regarding the friendship and the trip.

  **Regarding the Trip:**
  *   **Don't force him to come:** If he's already checked out, he'll be a miserable travel companion. Japan is expensive and intense; you want people who are 100% excited to be there.
  *   **Address the Airbnb:** The friend who put down the deposit needs to lead this conversation. She should say, *"I understand work comes up, but I booked this place based on four people. Since you're backing out, we need to figure out how to cover the difference in cost/loss of deposit."*
  *   **Decide if the trip still works:** Can the three of you afford the Airbnb without him? If not, can you find a replacement? If the math doesn't work, you may need to cancel, and he should be on the hook for the cancellation fees.

  **Regarding the Friendship:**
  *   **Call it what it is:** You can tell him, *"We know you didn't sign a contract, but we planned this for six months based on your word. It puts us in a tough spot financially and logistically. In the future, please don't commit to group plans unless you're sure."*
  *   **Re-evaluate trust:** For the next big plan (wedding, trip, house project), you now know he is a "soft yes." Treat his future commitments with a grain of salt until he rebuilds that reliability.

  ### The Verdict
  He didn't break the law, but he broke friend etiquette. **He is right that he can back out, but he is wrong to think there are no consequences.**

  A good friend would say: *"I am so sorry, I have to take this work trip. I know I committed to the group, so I want to cover my share of the Airbnb deposit loss so you guys aren't out of pocket."*

  If he isn't willing to do that, he hasn't just backed out of a trip; he's shown you his level of reliability. Believe him.
