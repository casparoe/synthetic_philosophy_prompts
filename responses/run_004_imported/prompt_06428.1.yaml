  First, take a breath. It is completely normal to feel shaken after a heated philosophical debate, especially when you're trying to switch hats from "debater" to "evaluator." The fact that you're second-guessing yourself shows you care about fairness, which is the most important trait for a TA. Your judgment isn't broken; you're just fatigued.

