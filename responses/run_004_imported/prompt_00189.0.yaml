answer: |-
  The espresso machine hisses, a sharp counterpoint to the low hum of the department lounge. Cassius stirs a packet of sugar into his cup, watching the swirl dissolve. Nadia sits opposite him, her notebook open, a half-finished diagram of utility streams scrawled on the page.

  **Cassius:** You let them off the hook too easily in the seminar, Nadia. When Chen asked why we should accept an ordering that leaves the 'Evens vs. Odds' case incomparable, you just shrugged. You said, "Some things are beyond judgment." That's not ethics; that's surrender.

  **Nadia:** It's not surrender, Cassius. It's integrity. If I tell you $x$ is better than $y$, I owe you a *reason*. I need to be able to point to the generations that make the difference. With your Svensson-style completion, you can tell me $x \succ y$, but if I ask "Why? Which generations count?", you have to say, "I don't know, and neither does anyone else."

  **Cassius:** That's an epistemic limitation, not an ontological one. Just because we can't construct the decisive set doesn't mean it isn't there. Svensson showed that if you want Strong Pareto and Finite Anonymity, you *need* a free ultrafilter. The math is clear. The ordering exists. The fact that the ultrafilter is non-constructive—that we can't write down a formula for it—is a feature of the infinite, not a bug in the theory.

  **Nadia:** But it's not just that we can't write it down. It's that the existence proof relies on the Axiom of Choice. You're invoking a choice function that picks a 'large' set out of the power set of $\mathbb{N}$ without any rule. In one model of ZFC, your ultrafilter contains the set of primes. In another, it doesn't. You're building the axiology of the future on a set-theoretic contingency.

  **Cassius:** (Takes a sip) So? Why should the truth about intergenerational justice depend on whether we can compute it in finite time? We are talking about an infinite future. Why impose a finitist constraint on value itself? If there is a fact of the matter about whether a world is better, completeness demands we capture it. If your partial order says "incomparable," you're essentially saying the universe is silent. I'm saying the universe is determinate, even if our access is limited.

  **Nadia:** The universe might be determinate, but ethics is for agents. If I'm a planner choosing between policy $x$ and policy $y$, and your theory says $x \succ y$ based on a set of generations you cannot identify, what work is that judgment doing? It's a black box. Worse, it's an arbitrary black box. Let's take the case you glossed over. Stream $x$ has utility 1 for everyone. Stream $y$ has utility 1 for everyone except on a sparse set $S$—say, the powers of 2—where it has utility 0. Intuitively, $x$ dominates. It's better almost everywhere.

  **Cassius:** My ordering agrees. $x \succ y$. Strong Pareto handles that easily.

  **Nadia:** Does it? Strong Pareto handles finite differences. For infinite differences, you need the ultrafilter to decide. Now, consider a trickier case. Stream $A$ is better than Stream $B$ on a set of asymptotic density 1. But Stream $B$ is better on a set of density 0 that is nonetheless infinite. Your ultrafilter has to decide which set is "large." There are free ultrafilters that contain sets of density 0.

  **Cassius:** There are.

  **Nadia:** So, in some models of your theory, $B \succ A$. You are ranking a stream higher even though it is worse for "almost all" generations, simply because the ultrafilter happened to deem that sparse set decisive. And you can never specify *which* sparse sets get that privilege. That's not just non-constructive; it's normatively unmoored.

  **Cassius:** You're conflating asymptotic density with moral weight. Why should density be the gold standard? That's just another way of weighting generations—favoring the dense clusters over the sparse ones. An ultrafilter is more abstract. It respects Finite Anonymity perfectly. It treats every generation equally in the sense that no finite permutation changes the outcome. If you reject the ultrafilter because it might privilege a density-0 set, you're secretly smuggling in a Continuity axiom or a specific weighting metric that Diamond showed is incompatible with Anonymity.

  **Nadia:** I'm not smuggling in Continuity. I'm demanding transparency. If I use the Overtaking Criterion, I can tell you exactly why $A \succ B$. I can show you the partial sums. I can show you the point $T$ after which $A$ stays ahead. If the partial sums oscillate forever, I say "incomparable." That silence is honest. It says, "These two worlds trade off welfare in a way that no neutral arbitration can resolve without favoring some generations over others."

  **Cassius:** But that silence paralyzes action. Suppose we have two streams that oscillate. Neither overtakes the other. Your partial order says, "Pick either, it's permissible." But surely one *is* better. If we leave it incomparable, we lose the ability to apply Pareto improvements in the limit. We lose the ability to say that a stream that is eventually consistently higher is better.

  **Nadia:** I can accept 'Eventually Consistent' rankings. That's constructive. What I won't accept is ranking streams where the advantage flips back and forth infinitely often, and you claim there's a fact of the matter determined by a non-principal ultrafilter. You're asking me to believe that there is a specific set of generations $U \in \mathcal{U}$ such that if $x$ wins on $U$, $x$ is better. But since $\mathcal{U}$ is non-constructive, $U$ is indiscernible.

  **Cassius:** Indiscernible to us. Not to the ordering. Look, Nadia, think about the alternative. If you stick with a partial order, you violate Completeness. You admit that there are pairs $x, y$ where it is not the case that $x \succeq y$ and not the case that $y \succeq x$. Normatively, what does that mean? It means the values are incommensurable. But in the infinite stream context, the incommensurability is purely structural. It's not because the goods are different—like liberty vs. happiness. It's just because the sums don't converge. Why should the mathematical behavior of a series dictate the existence of value?

  **Nadia:** Because the mathematical behavior *is* the only access we have to the value! If the sums don't converge, and there's no constructive rule to break the tie, then positing a "fact of the matter" is metaphysical padding. It's like saying there's a fact about whether the last digit of $\pi$ is even, before we've defined that it has a last digit.

  **Cassius:** (Leans forward) But $\pi$ is a defined object. The utility streams are defined. The relation is defined. The ultrafilter existence is a theorem of ZFC. It's not magic. It's logic. You're essentially arguing for a form of intuitionism in ethics. "If I can't construct the proof, the value doesn't exist."

  **Nadia:** I'm arguing for accountability. If you rank $x \succ y$ using an ultrafilter, you are effectively saying that the welfare of the generations in the set $U$ matters infinitely more than those in $U^c$, or at least decisively more. But since $U$ is non-constructive, you can't justify to the generation at $t=10^{100}$ why they were in the losing set. You can't even tell *yourself* if they are.

  **Cassius:** I don't need to tell generation $10^{100}$. I need to tell the planner. And the planner needs a complete ordering to maximize. If you give them a partial order, you force them to use a secondary rule to break ties. What rule will that be? Discounting? That violates Anonymity. Rawlsian maximin? That ignores the sum. By accepting the ultrafilter, I give them a single, consistent compass. Yes, the compass needle moves in ways we can't predict algorithmically, but it points *somewhere*.

  **Nadia:** It points somewhere, but the direction depends on which model of set theory you're standing in. That's the cost of completeness. You buy consistency at the price of arbitrariness. I'd rather buy honesty at the price of silence. If the overtaking criterion says "incomparable," it's because the streams are genuinely intertwined. To force a ranking is to impose a structure that isn't in the data.

  **Cassius:** The structure *is* in the data, provided you accept the full power of classical logic. The Law of Excluded Middle applies to ethical propositions just as it does to mathematics. Either $x \succeq y$ or $y \succ x$. To deny this is to weaken the logic of our valuation.

  **Nadia:** Or it's to recognize that 'better than' is a relation we define to guide choice, not a Platonic relation we discover. If we can't construct the relation, it can't guide choice. It becomes an oracle. "The Ultrafilter says $x$." "Why?" "Because."

  **Cassius:** (Sighs, leaning back) "Because" is where the infinite starts, Nadia. We can't reduce the infinite to the finite. If we insist on constructive proofs for everything, we end up with a theory that can't handle the very cases that define infinite ethics—the long-run, the limit, the tail. We end up saying that the distant future doesn't count because we can't compute its weight.

  **Nadia:** I'm not saying the distant future doesn't count. I'm saying that if the distant future is arranged in a way that prevents a constructive comparison, we shouldn't pretend we have a ranking. We should admit that our axioms—Pareto, Anonymity, Completeness—are jointly too demanding for a constructive world. Diamond showed the impossibility. Svensson showed the escape route requires non-constructive tools. I'm just saying the escape route leads to a place we can't map.

  **Cassius:** And I'm saying an unmapped territory is still territory. Leaving it blank on the map doesn't make it disappear. It just leaves the traveler unprepared.

  **Nadia:** Better unprepared than misled by a map drawn by a coin flip we can't see.

  **Cassius:** (Raises his cup slightly) Then we agree on the stakes. We just disagree on whether the coin flip is arbitrary... or divine.

  **Nadia:** (Smiles faintly) I'll drink to the stakes. But I'm still grading the papers on the overtaking criterion.

  **Cassius:** And I'll be looking for the ultrafilters in the footnotes.

  *They sit in silence for a moment, the hum of the lounge filling the space between the complete and the constructible.*
