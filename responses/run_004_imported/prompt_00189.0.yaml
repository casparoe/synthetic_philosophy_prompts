      *   *Partial Orders:* Overtaking/Catching-up. $x$ overtakes $y$ if partial sums $\sum_{t=1}^T (x_t - y_t)$ eventually stay positive. This is constructive but incomplete.
      *   *The Normative Stakes:* Is it better to have an answer that is metaphysically "there" but epistemically inaccessible (Cassius), or an answer that is transparent but sometimes silent (Nadia)?

  3.  **Character Conceptions:**
