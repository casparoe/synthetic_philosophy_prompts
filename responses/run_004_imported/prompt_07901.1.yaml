      *   *The Catch (Independence):* This is the big one. The "top comment" issue. Explain information cascades. If voter 1 is wrong and writes a comment, voters 2-25 might just agree. Effectively, you have 1 voter, not 25.
      *   *Real-world context:* Fact-checking requires expertise. Random employees aren't experts.
      *   *Recommendation:* Keep the fact-checking team. Maybe use the crowd for *triage* (low hanging fruit), but not final judgment on technical stuff.

