prompt: |-
  My team just rolled out a system where any flagged post gets reviewed by 25 randomly picked employees who each vote misleading or fine, majority rules. A coworker keeps insisting that with that many people voting, the crowd is basically guaranteed to land on the right answer, so we should just shut down our actual fact-checking team and let this run on autopilot. Thing is, most people just skim the top comment before voting instead of checking anything themselves, and on the really technical posts I doubt the average voter has better then a coin flip's shot at knowing what's true. Something about his confidence feels off to me but I can't quite explain why - is he right that more random voters basically guarantees the crowd gets it right?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **System:** Flagged posts reviewed by 25 randomly picked employees.
      *   **Mechanism:** Majority rules (Misleading vs. Fine).
      *   **Coworker's Claim:** "Crowd Wisdom" (Condorcet's Jury Theorem) implies more voters = guaranteed right answer. Suggests firing the fact-checking team.
      *   **User's Observation:** Voters skim top comments (herding bias), average voter has $\le 50\%$ accuracy on technical posts (random guessing or worse).
      *   **User's Intuition:** Something feels off about the coworker's confidence.
      *   **Question:** Is the coworker right that more random voters guarantees correctness?

  2.  **Identify the Core Mathematical/Statistical Concept:**
      *   The coworker is referencing **Condorcet's Jury Theorem**.
      *   The theorem states: If each voter has an independent probability $p > 0.5$ of being correct, then as the number of voters ($n$) increases, the probability of the majority being correct approaches 1.
      *   *Crucial Caveat 1:* $p$ must be greater than 0.5. If $p < 0.5$, more voters makes the group *more likely to be wrong*. If $p = 0.5$, it's a coin flip regardless of $n$.
      *   *Crucial Caveat 2:* Votes must be **independent**.

  3.  **Evaluate the User's Observations against the Theorem:**
      *   **Observation 1:** "Most people just skim the top comment before voting."
          *   *Implication:* Votes are **not independent**. This is information cascading or herding behavior. If the top comment is wrong, everyone follows. This violates the independence assumption of Condorcet's Theorem.
      *   **Observation 2:** "On really technical posts I doubt the average voter has better than a coin flip's shot."
          *   *Implication:* $p \le 0.5$. If $p = 0.5$, adding voters doesn't help. If $p < 0.5$ (systematic bias/misunderstanding), adding voters makes it *worse*.
      *   **Observation 3:** "Randomly picked employees."
          *   *Implication:* They are not experts. For technical content, expertise matters. Random sampling assumes average competence, which the user suspects is low for this specific task.

  4.  **Formulate the Argument:**
      *   **Validate the User:** Your intuition is correct. The coworker is misapplying a statistical theorem.
      *   **Explain the Theorem (Condorcet's Jury Theorem):** Briefly explain the "Wisdom of Crowds" logic but highlight the strict conditions.
      *   **Debunk Condition 1 (Competence):** If $p \le 0.5$, the theorem fails. Technical posts likely push $p$ down.
      *   **Debunk Condition 2 (Independence):** Skimming the top comment creates correlation. If one person is wrong, many follow. This reduces the effective sample size drastically.
      *   **Discuss Systemic Risks:** Bias, groupthink, lack of accountability compared to a dedicated team.
      *   **Conclusion:** Do not fire the fact-checkers. The system is flawed.

  5.  **Drafting the Response (Iterative refinement):**

