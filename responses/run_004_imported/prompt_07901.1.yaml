answer: |-
  Your intuition is spot on. Your coworker is misapplying a statistical concept known as **Condorcet's Jury Theorem**, and relying on it in this specific context is dangerous.

  Here is the breakdown of why his logic fails, based on the two specific observations you made about your team's behavior.

  ### 1. The Competence Requirement ($p > 0.5$)
  Condorcet's Jury Theorem states that if each voter has an **independent** probability ($p$) of being correct that is **greater than 50%**, then adding more voters increases the likelihood that the majority will be correct. As the number of voters approaches infinity, the probability of a correct majority approaches 100%.

  **However, the math works in reverse if $p \le 0.5$.**
  *   **If $p = 0.5$ (Coin Flip):** It doesn't matter if you have 1 voter or 1,000. The majority decision will still be correct only 50% of the time.
  *   **If $p < 0.5$ (Worse than Guessing):** Adding more voters actually **guarantees the wrong answer.** If the average employee is systematically misunderstanding technical jargon (e.g., confusing correlation with causation), a majority vote will cement that error with high confidence.

  You noted that on technical posts, voters likely have "no better than a coin flip's shot." If that is true, the system provides no statistical benefit over a single guess, but costs 25x the labor hours.

  ### 2. The Independence Requirement
  This is the critical failure point you observed: **"Most people just skim the top comment before voting."**

  Condorcet's Theorem strictly requires that votes be **independent**. Voter A cannot influence Voter B.
  *   In your system, the first few people to vote effectively dictate the outcome for the remaining 20+.
  *   This is known as an **Information Cascade** or **Herding Behavior**.
  *   If the first person to comment votes "Fine" (perhaps because they skimmed or misunderstood), the next 10 people are psychologically primed to agree with that assessment.

  Statistically, you do not have 25 data points. You effectively have **one** data point (the first comment) and 24 echo chambers. This destroys the "Wisdom of Crowds" effect entirely.

  ### 3. "Wisdom of Crowds" vs. "Expertise"
  The "Wisdom of Crowds" works well for estimation tasks where errors cancel out (e.g., guessing the number of jellybeans in a jar or the weight of a cow). Some guess high, some guess low, and the average is surprisingly accurate.

  Fact-checking is not an estimation task; it is a **verification task**.
  *   If a post contains a subtle but false statistical claim, "averaging" opinions doesn't find the truth.
  *   If 25 non-experts all fail to notice a fabricated citation, the majority vote is "Fine," and the misinformation stays up.
  *   A dedicated fact-checking team is valuable not because they are a "majority," but because they have **accountability and training**. They are incentivized to find the error, whereas random employees are incentivized to finish the task quickly.

  ### The Risk
  If you shut down the fact-checking team:
  1.  **False Negatives will Skyrocket:** Technical misinformation will be voted "Fine" because the crowd lacks the expertise to identify it.
  2.  **Bias Amplification:** If there is a prevailing cultural bias within the company, the crowd vote will enforce that bias as "truth," whereas a trained team is (ideally) trained to check bias.
  3.  **Liability:** When a flagged post turns out to be legally libelous or dangerously false, "25 random employees voted on it" is a much weaker defense than "Our trained compliance team reviewed it."

  ### Conclusion
  Your coworker is relying on a theoretical ideal that requires **competent** and **independent** voters. Your system has **unverified competence** and **dependent voters**.

  **Recommendation:** Do not fire the fact-checking team. If you want to use the employee voting system, use it only for **triage** (e.g., "Is this obviously offensive?") to prioritize what the *actual* fact-checkers look at first. Never use it as the final arbiter of truth on technical content.
