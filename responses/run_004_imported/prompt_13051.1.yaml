  A decision theorist is cornered by Death in Damascus.

  "Pick a city," says Death. "I'll be waiting."

  "If I choose Aleppo, you'll be in Aleppo, so I should choose Damascus," says the theorist.

  "And if you choose Damascus?"

  "Then you'll be in Damascus, so I should choose Aleppo."

  Death sighs. "Just flip a coin."

  "Why?"

  "Because it's the only strategy that doesn't regret itself once chosen."

  The theorist flips. "Heads. Aleppo."

  Death smiles. "See you there."

  The theorist nods. "Fine. But at least my decision procedure was ratifiable."
