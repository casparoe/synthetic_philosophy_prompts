answer: |-
  **MEGILLUS:** You speak of the mask, Stranger. You say sobriety is the mask wine removes. But I tell you, wine puts on its own mask. When a man drinks, he is not himself. He is a puppet pulled by strings of vapor and heat. If I strike a lyre when it is out of tune, the sound is discordant. Do I blame the lyre, or the hand that loosened the peg? If you loosen the peg of a man's mind with grape juice, and he sings a shameful song, have you discovered his nature, or have you simply broken his instrument to hear the noise it makes when shattered?

  **ATHENIAN:** You mistake the purpose, Megillus. We do not loosen the peg to break the instrument. We loosen it to see if the wood holds. You say the drunken man is not himself. I say the sober man is the one who is hiding. In the marketplace, in the assembly, fear of the law, fear of shame, fear of punishment—these are whips that keep the beast in check. A man may appear moderate because he is watched. But in the cup, the watchers are blurred. The law is distant. If the beast does not stir, then moderation is not a habit of obedience, but a habit of the soul.

  **MEGILLUS:** But how do you distinguish the beast from the stumble? You claim this is a test. A test must be reliable. If I test a bow by bending it, I know its limit. If I test a man by making him dizzy, I know only that he is dizzy. A good man, unaccustomed to wine, may vomit or weep. A cunning flatterer, practiced in the cup, may drink deeply and speak only what pleases the supervisor. Your test punishes the weak-headed virtuous man and rewards the strong-headed rogue. Is this justice? Or is it merely sorting men by the capacity of their livers?

  **ATHENIAN:** You assume the test is a single night. It is not. It is a lifetime of observation. The flatterer you describe—he may fool the cup, but can he fool the pattern? We are not looking for the man who never spills wine. We are looking for the man who, as the wine rises, does not let his shame fall. You fear the noise. I say the noise is the only place the signal can be heard. If virtue is only silence, it is dead. Virtue must be able to sing without becoming a scream.

  **MEGILLUS:** And if it screams? You have a plan for this. You say you will stop it. You will have your "officers of Dionysus," these sober elders who watch the cups. Here is where your loom tangles, Stranger. You admit men are fallible. That is why you want to test them. But these officers are men too. You give them power over the reputations of the younger. You give them authority in the dark, amidst the smoke and the laughter. Who tests the officers? If they are sober, they do not understand the trial they judge. If they have tasted, they are compromised. You are building a wall out of bricks you admit are brittle.

  **ATHENIAN:** We do not choose the officers from the population at large. We choose from the old. You know as well as I that age cools the blood. The fire that consumes the young is ash in the old. They do not need to be drunk to understand drunkenness; they remember it. Memory is a safer guide than immediate sensation.

  **MEGILLUS:** Memory is a poet, Stranger. It embellishes. And age does not only cool the blood; it hardens the heart. You argued this yourself against my Spartans! You said the old become rigid, suspicious, incapable of joy. Now you want these same rigid men to judge the fluidity of the young? If the officer is too rigid, he will condemn any warmth as excess. If he is too lenient, he will let the city rot. You rely on a golden mean in the supervisor, but you have just taught us that finding such a man is the work of a lifetime. To stake the safety of the symposium on finding a perfect elder is to stake the house on the roof not falling before the walls are built.

  **ATHENIAN:** You seek a city with no risk. That is a city of statues. Statues do not get drunk, Megillus. Nor do they get brave. They do not get moderate. They simply stand. If you fear the corruption of the officer more than the education of the youth, you have already decided that virtue is not worth the danger of its own cultivation.

  **MEGILLUS:** I decide that a general should not train his army by getting them lost in the woods to see if they can find their way back. He trains them on the drill field. You say the drill field of sobriety is insufficient. I say the battlefield of the drinking party is too chaotic. You want to institutionalize a risk. You want to write laws that say, "We will introduce poison in small doses to build immunity." But if the hand that mixes the dose shakes, the patient dies. And the hand is human. Your scheme requires a level of vigilance that gods might maintain, but men will neglect. When the wine flows, the law recedes. That is the nature of the thing you defend.

  **ATHENIAN:** The law does not recede if the fear of the law is internalized. That is the point! You Spartans externalize the law. It is a whip held by the ephor. I want the law to be the drinker's own hand holding the cup back. You say the hand will shake. I agree. It will shake. And in that shaking, we see the effort. That effort is virtue. In Sparta, there is no shaking. The cup is forbidden. There is no effort, only obedience. I would rather see a man struggle with the cup and hold it steady than see a man who never touches it because he is told not to.

  **MEGILLUS:** But if he struggles and fails, you have ruined him for the night. And if he fails often, you have ruined him for the city. You say it is a test. But a test implies a pass and a fail. What is the penalty for failing your symposium? Shame? Exile? If it is shame, you destroy a citizen for a weakness that might have remained hidden and harmless. If it is nothing, the test is a theater. You are proposing a court of law where the evidence is manufactured by the court itself.

  **ATHENIAN:** It is not a court of law. It is a school. You do not exile a boy for failing to lift a weight. You make him lift it again, with guidance. The drinking party is not for condemnation. It is for correction. The sober elder sees the slip and corrects it *in the moment*. "Not so fast." "Not that song." It is therapy, Megillus. You treat a fever by inducing sweat. You treat a soul prone to pleasure by exposing it to pleasure under guard.

  **MEGILLUS:** And if the physician catches the fever? You keep coming back to the elder. You trust him too much. You say he corrects in the moment. But correction requires judgment. Judgment requires clarity. If the room is loud, if the young men are emboldened by the grape, will the old man truly stand firm? Or will he be swept up in the camaraderie? You are asking me to trust that the one man allowed to be sober in a room of drunkards will not feel the loneliness of his own clarity and take a sip to join the song.

  **ATHENIAN:** Then we are back to the beginning. You do not trust men to be men. You want them to be iron.

  **MEGILLUS:** I want them to be safe. Iron holds the line. Wine dissolves it. You argue that a virtue untested by pleasure is incomplete. I argue that a city built on the premise that its citizens *will* falter, and that we must manage their faltering, is a city already defeated. Sparta bans the cup not because we fear the test, but because we know the cost of the failure is higher than the value of the lesson. We buy completeness of virtue at the price of safety. You wish to keep the safety and the completeness both. I tell you, Stranger, you are trying to hunt the lion with a net made of silk. It is a beautiful net. But the lion will tear it.

  **ATHENIAN:** And if you keep the lion in a cage, Megillus, you never know if it is a lion or a cat. You have a city of cats and call them lions because they have never seen the open plain. I am willing to risk the tear in the net to find the true beast. If the net breaks, we weave it stronger. If the lion breaks, we are all dead anyway, whether there was wine or not.

  **MEGILLUS:** Then we drink to that?

  **ATHENIAN:** (Smiling faintly) Not yet, friend. Not until the sun is higher, and the officers are in their seats.

  **MEGILLUS:** Then I shall wait. But I will watch the officers closer than the drinkers.

  **ATHENIAN:** As you should. For if they fail, the cup is indeed poison. But if they hold... then it is medicine.

  **MEGILLUS:** We shall see whose blood runs colder when the time comes.

  **ATHENIAN:** That, Megillus, is the only test that matters.
