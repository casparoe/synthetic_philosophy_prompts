prompt: |-
  im reading Hume's essay on miracles (the Enquiry, section 10) and got stuck on part of the argument. Right after he goes through his four reasons why testimony for miracles tends to be weak, he brings up the Abbé Paris case:

  "There surely never was a greater number of miracles ascribed to one person, than those, which were lately said to have been wrought in France upon the tomb of Abbé Paris, the famous Jansenist, with whose sanctity the people were so long deluded. The curing of the sick, giving hearing to the deaf, and sight to the blind, were every where talked of as the usual effects of that holy sepulchre. But what is more extraordinary; many of the miracles were immediately proved upon the spot, before judges of unquestioned integrity, attested by witnesses of credit and distinction, in a learned age, and on the most eminent theatre that is now in the world. Nor is this all: A relation of them was published and dispersed every where; nor were the Jesuits, though a learned body, supported by the civil magistrate, and determined enemies to those opinions, in whose favour the miracles were said to have been wrought, ever able distinctly to refute or detect them. Where shall we find such a number of circumstances, agreeing to the corroboration of one fact? And what have we to oppose to such a cloud of witnesses, but the absolute impossibility or miraculous nature of the events, which they relate? And this surely, in the eyes of all reasonable people, will alone be regarded as a sufficient refutation."

  So the whole paragraph is him stacking up the evidence to make it sound as strong as any historical testimony could possibly be - good judges, hostile witnesses who tried and failed to debunk it, wide publication, no clean detection of fraud - and then the last two sentences just brush all of that aside because the events are "impossible." Considering the entire setup in part 1 was supposed to be about carefully weighing competing probabilities rather then just refusing to look at evidence, is that final move actually licensed by his own framework, or is he quietly relying on the conclusion (that no testimony could ever suffice for a miracle) to do the work instead of the weighing procedure he spent so long building up? not looking for a summary of the essay's overall argument, more curious whether this specific paragraph is doing something circular.
