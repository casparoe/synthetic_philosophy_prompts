answer: |-
  **The Bill at the End of the Road: Why the Hitchhiker Must Pay**

  As a teaching assistant, you have identified the exact nerve where standard rational choice theory goes numb. The literature on Parfit's Hitchhiker often treats the solution as a *coup de grâce* for dispositional theories: "You pay because that's the disposition that got you saved." But as you rightly point out, this answer slides uncomfortably over the actual moment of choice. Once the hitchhiker is standing in the town square, the driver is gone, the ride is over, and the causal lever has been pulled. At this specific time-slice, paying is purely costly.

  You are correct that this is not a Newcomb problem. In Newcomb's, Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) diverge. In Hitchhiker, they converge. Once the agent conditions on the evidence "I am in town," the correlation between paying and having been driven is screened off. The driver's prediction is a fact about the past. My current wallet is a fact about the present. Causality flows forward; evidence flows from truth to signal. Neither allows my current hand movement to reach back into the desert and alter the driver's decision. Therefore, standard act-based theories dictate: welch.

  This leaves us with a stark dilemma. Either we accept that rational agents must predictably lose (they die in the desert because they cannot rationally commit to paying), or we admit that the "act" is not the proper locus of rational evaluation. Many philosophers attempt to bridge this gap with concepts like Resolute Choice or Constrained Maximization, but you suspect these moves are question-begging—that they quietly change the subject from "What should I do?" to "What should I be?"

  This essay argues that your suspicion is partially right but ultimately misplaced. The shift from acts to policies is not a dodge; it is a necessary correction to a category error in act-based theories. However, this correction comes at a cost. To solve the Hitchhiker, we must abandon the notion that rationality is solely about maximizing utility at the moment of choice. **The hitchhiker pays.** But this conclusion forces us to accept that practical rationality is fundamentally about the governance of temporally extended agents, not the optimization of time-slices. If you refuse to pay, you are not being "locally rational"; you are being globally incompetent.

  ### The Convergence of CDT and EDT

  To appreciate the severity of the problem, we must grant your premise: standard theories fail. In the desert, the hitchhiker wants to promise. In the town, the hitchhiker wants to break the promise. This is dynamic inconsistency.

  CDT fails because it respects the arrow of time. My act of handing over $100 cannot causally influence the driver's past decision to drive. Since paying reduces my wealth and changes nothing else, CDT says "keep the money."

  EDT fails for a subtler reason, which you identified. EDT recommends acts that are good news. Usually, paying is good news because it correlates with having been the kind of person who gets rides. But EDT conditions on all available evidence. Once I know *I am in town*, I have already received the best possible news regarding the driver's prediction. The driver already thought I would pay. Whether I actually pay now does not update the probability that the driver thought I would pay. The evidential link is severed by the certainty of arrival. Thus, EDT also says "keep the money."

  Both theories treat the agent as a series of discrete time-slices, each maximizing utility based on local information. If rationality is defined as "doing the best thing given your current options," then welching is the only rational move.

  ### The Dispositional Defense and the Charge of Begging the Question

  Enter David Gauthier and the theory of Constrained Maximization. Gauthier argues that rationality is not about maximizing utility in each interaction, but about adopting a disposition that maximizes utility over a lifetime. A "constrained maximizer" keeps agreements even when breaking them would yield a local gain, provided the other party is also disposed to cooperate. By being the kind of person who pays, you get the ride. By being the kind of person who calculates locally, you die in the desert.

  Similarly, Edward McClennen's Resolute Choice suggests that a rational agent can bind their future self to a plan chosen at an earlier time, not through external enforcement, but through a normative commitment to consistency.

  More recently, Functional Decision Theory (FDT) formalizes this by treating the decision as the output of a logical algorithm. The driver predicts the output of your algorithm. If your algorithm outputs "welch when in town," the driver predicts this and leaves you. If your algorithm outputs "pay when in town," the driver predicts this and drives. FDT argues that your choice in town is logically linked to the driver's prediction, even if causally disconnected.

  Your critique is that these moves smell like question-begging. They seem to answer the question "What should I do now?" by saying "You should be the sort of person who does X." But if I am already in town, telling me I *should have been* a payer doesn't tell me why I *should be* a payer now. It shifts the normative weight from the act to the agent's architecture. Is this legitimate philosophy, or just changing the definition of rationality to get the desired result?

  It is legitimate, but only if we recognize that act-based theories suffer from a myopic view of agency. The charge of question-begging holds only if we assume *a priori* that the "act" is the atomic unit of rationality. If we assume instead that the "agent" is the unit, the shift is not a dodge; it is a refinement.

  Consider the alternative. If we insist that rationality is purely act-based, we must accept that a rational agent is one who, when offered a mutually beneficial trade that relies on trust, must reject it if the enforcement mechanism is internal rather than external. This renders rationality impotent in a vast class of real-world interactions (loans, promises, treaties) where enforcement is impossible at the moment of execution. A theory of *practical* rationality that systematically guides agents away from available utility is pragmatically self-defeating.

  Therefore, the dispositional move is not begging the question; it is identifying that the question "What should I do?" is incomplete. The complete question is "What decision-procedure should I instantiate?" When you stand in town, you are not just choosing an act; you are executing the final step of a decision-procedure that began in the desert. To welch is to execute a buggy algorithm.

  ### The Commitment: The Hitchhiker Pays

  So, does the hitchhiker pay? **Yes.**

  And does this show that rationality must be assessed at the level of policies? **Yes.**

  This is not a compromise. It is a rejection of the CDT/EDT framework as a complete theory of rationality. The bullet that CDT bites—"rational agents can predictably end up worse off"—is not a hard-nosed realism; it is a surrender. It admits that the theory cannot guide an agent to win in scenarios involving prediction and pre-commitment.

  If you define rationality as "local utility maximization given current causal leverage," then CDT is correct, and rationality is a curse. It guarantees you will be the kind of person who cannot secure a ride. But if you define rationality as "the systematic pursuit of winning," then CDT is wrong.

  The FDT/Gauthier approach succeeds because it recognizes that in a world containing predictors (whether psychic drivers, employers checking references, or partners gauging trust), your current actions are logically entangled with past predictions of those actions. The driver did not predict a specific muscle movement in the town square; they predicted *you*. You are not a time-slice. You are the continuation of the person who made the promise.

  To refuse to pay is to assert that "you" in the town are a different entity than "you" in the desert. But if that were true, the driver wouldn't have driven. The very fact that you are in town proves that you are the same entity that was predicted to pay. To welch is to contradict the evidence of your own existence in that location.

  ### The Cost of the View

  However, we must be clear about what this costs us. It costs the simplicity of act-evaluation. It requires us to accept that sometimes, "doing the rational thing" feels like losing money for no causal reason. It requires us to treat our own future choices as fixed points that can influence the past *logically*, if not causally.

  This is why the standard seminar answer feels unsatisfying. It glosses over the metaphysical weirdness of treating your decision as the output of an algorithm that runs across time. It says "just pay" without explaining why the normativity of the past promise binds the present will.

  But the alternative is worse. If we side with CDT, we must tell students that the rational thing to do is to die in the desert rather than lose $100 in town, provided they cannot externally bind themselves. We make rationality synonymous with strategic incompetence.

  ### Conclusion

  You are right to be annoyed by the hand-waving. The move from "act" to "disposition" is a heavy lift. It changes the subject from "maximize utility now" to "maximize utility over the life of the agent." But this change is not question-begging; it is the only way to save rational choice theory from irrelevance in social contexts.

  The hitchhiker pays. Not because paying changes the past, but because the agent who pays is the only agent who gets the ride. Rationality is not about the purity of the moment; it is about the success of the life. If a theory of rationality tells you to leave money on the table to prove a point about causal independence, it is not a theory of rationality. It is a theory of losing.
