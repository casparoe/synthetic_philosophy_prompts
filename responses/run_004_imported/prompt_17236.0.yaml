  $$P(H|M) = \frac{P(M|H)P(H)}{P(M|H)P(H) + P(M|T)P(T)} = \frac{1 \cdot \frac{1}{2}}{1 \cdot \frac{1}{2} + \frac{1}{2} \cdot \frac{1}{2}} = \frac{\frac{1}{2}}{\frac{3}{4}} = \frac{2}{3}$$
  Learning it is Monday is evidence for Heads because Heads *guarantees* Monday, whereas Tails only offers it half the time.

