  Here is the real problem for you: If you start at 1/2, you believe the coin determines the probability. If you end at 2/3, you believe the *day* determines the probability. You're mixing uncentered and centered propositions. If the coin is fair, $P(H|Mon)$ should be 1/2, because on Monday, the coin has already landed, and the day provides no causal link to the outcome. The only link is the waking schedule.

