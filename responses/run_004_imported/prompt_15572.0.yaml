answer: |-
  You have stumbled onto one of the oldest, thorniest problems in political theory. It has a name: **The Boundary Problem.**

  Your brother-in-law is giving you the *legal positivist* answer: the law is the law, and the boundary is the line on the map. He is technically correct about how the current system operates, but he is dodging the normative question you are asking, which is: *How should the boundary be drawn?*

  Your intuition that the current setup is unfair is backed by centuries of philosophical debate, but your worry about the "fix" (that everyone affected votes) is also backed by rigorous theory. The "All-Affected Principle" (AAP) is the standard counter to territorial voting, but as you noted, it risks infinite regress. If a factory pollutes a river, do the fish get a vote? Do the people downstream in the next state? Do the global climate stakeholders?

  However, political scientists and legal scholars have developed frameworks that are sturdier than "gut feeling" but more nuanced than "county lines." Here is the rigorous machinery you can use to analyze this story.

  ### 1. The Mismatch of "Functional" vs. "Political" Jurisdictions
  The core tension here is between **political jurisdiction** (the county line) and **functional jurisdiction** (the aquifer).

  In political science, this is often discussed through the work of **Elinor Ostrom**, who won the Nobel Prize in Economics for her work on Common Pool Resources (CPRs). Her rigorous finding was that for a shared resource to be managed sustainably, **the boundaries of the governance must match the boundaries of the resource.**

  When the governance boundary (the county) is smaller than the resource boundary (the aquifer), you get exactly what you are seeing: a "tragedy of the commons" where one group extracts value while exporting the risk to non-voters. Ostrom's work provides the theoretical backbone for your intuition: the current setup isn't just "unfair," it is *structurally prone to failure* because the feedback loop is broken. The voters don't feel the pump go dry; the non-voters do.

  **The Rigorous Fix:** It isn't necessarily to change who votes for the County Commission (which is legally difficult). It is to create an overlapping **Special District** or **Groundwater Management District (GMD)** whose board is elected by everyone over the aquifer, regardless of county line. This solves your "where do you stop" problem: you stop at the edge of the aquifer, not the edge of the state.

  ### 2. The "All-Subjected" vs. "All-Affected" Distinction
  To refine your thinking on who gets a vote, theorists distinguish between being *affected* and being *subjected*.

  *   **All-Affected:** Anyone impacted by a decision. (Your worry: too broad).
  *   **All-Subjected:** Anyone subject to the coercive power of the decision.

  In this data center case, the neighboring county residents are not just "affected" in a vague economic sense (like someone whose property value might dip because a new park opened nearby). They are **subjected to a coercive restriction of their future liberty.** If the aquifer is depleted or pressurized down, their legal right to use their own land is effectively nullified by a decision they didn't make.

  Philosopher **Robert Dahl** and others argue that when a decision fundamentally alters the rights or capacities of a group to act within their own jurisdiction, that group moves from "affected" to "subjected." This gives you a principled cutoff point. You don't have to enfranchise the whole state; you only have to enfranchise those whose *agency* is being compromised by the extraction.

  ### 3. The Problem of Externalities
  Since you cover science and ideas, an economic lens might also resonate. This is a classic case of **unpriced negative externalities.**

  The data center gets the benefit (water access, tax breaks). The approving county gets the benefit (tax revenue). The neighboring county bears the cost (aquifer depletion) without compensation and without recourse. In a functioning market or political system, that cost should be internalized.

  The "rigorous" argument here is that the current voting boundary allows for **political arbitrage.** The developer is shopping for the jurisdiction with the weakest regulations and the most disconnected voting base relative to the resource. This isn't just unfair; it's a market failure in governance.

  ### 4. Real-World Precedents (For your reporting)
  You asked if there is an actual way people have worked out. Yes, though it is messy.

  *   **Groundwater Management Districts (GMDs):** In states like Kansas, Nebraska, and Texas, local voters often elect boards specifically for groundwater management that overlay county lines. These districts have the power to regulate pumping. If your county doesn't have one, that is a specific policy gap you can report on.
  *   **Interstate Compacts:** For massive aquifers (like the Ogallala or the Colorado River basin), states form compacts. These are essentially treaties. They acknowledge that the resource boundary supersedes the political boundary.
  *   **The "Public Trust Doctrine":** This is a legal theory gaining traction. It argues that certain resources (water, air, shorelines) are held in trust by the government for the public. Some lawyers are arguing that this trust extends beyond jurisdictional lines, meaning the county commission is legally obligated to consider the impact on neighbors, even if those neighbors can't vote.

  ### 5. A Framework for Your Story
  If I were editing this piece, I would suggest framing it not as "Voting Rights" (which implies changing the Constitution) but as **"Governance Mismatch."**

  The question isn't "Should my neighbor get to vote in my county election?" The question is "Why is the county commission the only body authorized to make decisions about a resource that exceeds their authority?"

  **The "Sturdier" Argument:**
  You can argue that democratic legitimacy requires **congruence between the decision-makers and the consequence-bearers.** When these two groups diverge significantly, the decision loses legitimacy, regardless of whether the procedure was followed.

  Your brother-in-law says, "That's how jurisdiction works."
  Your counter is: "Jurisdiction is a human technology, not a law of physics. When the technology fails to manage the reality (the water), we are allowed to suggest a better tool."

  ### Summary for your notes:
  1.  **The Theoretical Hook:** The Boundary Problem (Who constitutes the *demos*?).
  2.  **The Scientific Hook:** Elinor Ostrom's design principles for Common Pool Resources (Governance boundaries must match resource boundaries).
  3.  **The Legal Hook:** The distinction between "affected interests" and "subjected rights."
  4.  **The Solution Space:** Special Purpose Districts / Groundwater Management Districts (overlapping jurisdictions) rather than changing county voting lines.

  You aren't just feeling a vibe; you are identifying a structural flaw in how we map political power onto ecological reality. That is a very solid story.
