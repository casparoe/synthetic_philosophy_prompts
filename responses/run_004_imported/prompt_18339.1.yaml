      *   **The Core Dispute:**
          *   *Researcher A (Pro-Penalty):* Believes penalizing compute time favors the "Direct Translator" (reading internal state) over the "Human Simulator" (simulating human inference), because simulating a human should be computationally more expensive.
          *   *Researcher B (Anti-Penalty):* Believes the penalty fails because a sufficiently capable predictor *already* models human beliefs for other reasons, so the Human Simulator can "freeload" on that existing computation, making it cheap.
      *   **Requirements:**
