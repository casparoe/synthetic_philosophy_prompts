      *   **Round 2: The Nature of the Predictor.** Marcus argues the Predictor *must* model humans to predict tampering. Elena argues that modeling human *beliefs* is different than modeling human *observations*.
      *   **Round 3: Ontology Mapping.** Elena pushes on the cost of translation. Marcus pushes on the cost of simulation.
      *   **Concession 1 (Elena):** She admits that "Direct Translator" isn't just a lookup table; it requires mapping alien concepts to human concepts, which costs compute.
      *   **Concession 2 (Marcus):** He admits that if the human simulation requires *recursive* reasoning not needed for the primary task, it might be distinguishable by cost.
