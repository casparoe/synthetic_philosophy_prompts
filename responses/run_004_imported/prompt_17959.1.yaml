          *   *Analogy:* Hume: "Will the next ball fall?" Kripke: "Did I intend 'gravity' or 'gravy' when I dropped the first ball?"
      *   *Normativity:* Emphasize the "ought." Meaning isn't just what I *do*; it's what I *should* do. The skeptic says there's no fact that grounds the "ought."
      *   *The "Sceptical Solution" isn't Pragmatism:* The user thinks the answer is "justified enough in practice." Kripke's solution is actually more radical. It says truth-conditions are gone. It's about community agreement. This changes the whole theory of meaning.
      *   *Why it's a "Huge Deal":* It attacks the foundational idea of analytic philosophy (truth-conditional semantics). If Kripke is right, a huge chunk of 20th-century philosophy of language is built on sand.
      *   *Kripke vs. Wittgenstein:* Briefly address the authorship question. It's "Kripke's Wittgenstein." Kripke admits he's presenting his own reading, not necessarily historical Wittgenstein.

