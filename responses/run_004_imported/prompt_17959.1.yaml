prompt: |-
  hey so we're covering Kripke's "Wittgenstein on Rules and Private Language" in my philosophy of language seminar this week, and I think I get the quus thing but I don't get why everyone treats it like such a huge deal. Isn't the worry that I might've meant quus instead of plus basically the same problem as ordinary inductive skepticism? Like, we can never be fully certain that my past additions guarantee what I'll say for some new huge sum, same as we can never be fully certain the sun will rise tomorrow just becuase it always has before. So why can't we just give the same answer we give Hume on induction -- "yeah it's not certain but we're justified enough in practice, so who cares"? feels like Kripke (or is it Wittgenstein? never sure who gets credit for what here) is dressing up a boring fallibilism problem as this dramatic "sceptical paradox" that needs its own special "sceptical solution." Am I missing something or is this kind of overblown?
