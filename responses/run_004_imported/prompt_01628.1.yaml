answer: |-
  This is a compelling philosophical pivot. The skepticism you encounter—often associated with philosophers like Phil Dowe, David Armstrong, or early Douglas Ehring—typically rests on a specific metaphysical picture of what the world is made of (ontology) and how causation works (mechanism).

  To construct a sophisticated argument *for* causation by omission (CbO) without retreating to positive surrogates (e.g., claiming the cause was actually the "brain state of inattention"), you need to challenge the skeptic's underlying asymmetry. You must argue that the distinction between "positive events" and "omissions" is not metaphysically deep enough to warrant a difference in causal status.

  Here is a structured argument designed for a metaphysics context, focusing on the counterfactual framework and exposing the skeptic's undefended commitments.

  ***

  ### The Argument from Counterfactual Symmetry and Ontological Neutrality

  #### 1. The Premise of Counterfactual Symmetry
  The starting point is your observation: The Counterfactual Theory of Causation (CTC) treats positive events and omissions identically.
  *   **Positive Case:** The spark ($C$) caused the fire ($E$). If the spark had not occurred, the fire would not have occurred.
  *   **Omission Case:** The lifeguard's failure to dive ($C^-$) caused the drowning ($E$). If the failure had not occurred (i.e., if he had dived), the drowning would not have occurred.

  In both cases, the effect *counterfactually depends* on the putative cause. The skeptic accepts the counterfactual dependence in the omission case but denies it constitutes *causation*. They claim: "Yes, the drowning depends on the failure, but the failure is not a *thing*, so it cannot be a cause."

  **The Argument:** If we accept CTC as a valid analysis of causation for positive events, we are committed to the view that **causation is fundamentally a relation of dependence, not a relation of physical connection.** If dependence is sufficient for causation in the positive case, denying it in the negative case requires an independent justification. Without that justification, the skeptic is arbitrarily restricting the scope of their own theory.

  #### 2. Exposing the "Positive Ontology" Bias
  The skeptic's refusal to accept omissions as causes rests on an undefended ontological assumption: **Only positive spatiotemporal particulars (events) exist.**

  This view assumes that for $X$ to cause $Y$, $X$ must be a concrete entity that occupies space and time and possesses positive properties. An omission (an absence) is viewed as "nothing," and "nothing" cannot exert force.

  **The Challenge:** This assumption conflates *ontology* with *causal efficacy*.
  1.  **The Relativity of Positivity:** The distinction between a "positive fact" and a "negative fact" is often linguistic or conceptual, not metaphysical. Consider a switch. Is the cause of the light turning off the "pressing of the button" (positive) or the "breaking of the circuit" (absence of flow)? In cybernetics and biology, absences are functionally indistinguishable from presences. A repressor gene causes a trait not to appear; a brake causes a car to stop by preventing motion. To claim the brake's causation is merely a surrogate for "friction pads touching" ignores that the *prevention of motion* is the causal variable we care about.
  2.  **The Burden of Proof:** The skeptic assumes "positive events" are the default ontology. But why? If the world contains patterns of dependence, and those patterns hold equally for absences, the burden is on the skeptic to prove that "existence" requires positive mass/energy. If causation is about **difference-making**, then an absence makes a difference just as robustly as a presence. By privileging "positive" ontology, the skeptic smuggles in a substantive metaphysical claim (that only positive particulars are real) without arguing for it.

  #### 3. Process Theory vs. Dependence Theory (The Core Conflict)
  The deepest source of the skeptic's asymmetry is the tacit adoption of a **Process Theory of Causation** (e.g., Salmon, Dowe) rather than a **Dependence Theory** (e.g., Lewis, Menzies).

  *   **Process Theory:** Causation requires the transmission of a conserved quantity (energy/momentum). Omissions transmit nothing; therefore, they cannot cause.
  *   **Dependence Theory:** Causation requires that the effect depends on the cause.

  **The Critique:** The skeptic often argues against CbO by asserting Process Theory is the *only* valid metaphysics of causation. However, Process Theory is known to struggle with cases of **preemption** and **overdetermination** even regarding positive events.
  *   *Example:* Assassin A shoots the victim. Assassin B was ready to shoot but didn't need to. Process theory says A caused the death (energy transfer). But if A hadn't shot, B would have. The death does *not* counterfactually depend on A's shot.
  *   Most metaphysicians agree that Dependence Theory (or a hybrid) handles preemption better than pure Process Theory.

  **The Undefended Commitment:** If the skeptic admits that Dependence is necessary (or partially constitutive) of causation to solve preemption in positive cases, they cannot consistently deny it in omission cases. If they insist on pure Process Theory, they must explain why they accept counterfactual dependence as a *test* for causation in positive cases but reject it as the *nature* of causation in omission cases. They cannot have it both ways.

  #### 4. Addressing the "Causal Proliferation" Objection
  The skeptic's strongest pragmatic argument is **Proliferation**: If omissions are causes, then the Queen of England caused the plant's death by failing to water it, just as the gardener did. This seems absurd; therefore, omissions aren't causes.

  **The Defense:** This objection confuses **metaphysical causation** with **explanatory relevance**.
  *   It may be metaphysically true that both the gardener's omission and the Queen's omission are causes (both satisfy counterfactual dependence).
  *   However, in ordinary discourse, we select causes based on norms, expectations, and capacities. The gardener had a duty and capacity; the Queen did not.
  *   **The Key Move:** Do not let the skeptic use pragmatic selection criteria to deny metaphysical reality. We do not deny that distant stars are causes of gravitational effects just because we don't mention them in everyday explanation. Similarly, we should not deny the Queen's omission is a *cause* just because it is not the *salient* cause.
  *   By accepting Proliferation as a metaphysical reality but a pragmatic non-issue, you preserve the genuineness of omission causation without making causation trivial. The skeptic assumes that if *everything* is a cause, *nothing* is a cause. This is a mistake. Causation can be ubiquitous without being explanatorily useless.

  #### 5. Conclusion: The Case for Ontological Neutrality
  The skeptic's position rests on two undefended commitments:
  1.  That causation must be a physical process (energy transfer) rather than a modal relation (dependence).
  2.  That "positive" ontology is privileged over "negative" ontology without sufficient justification.

  A sophisticated defense of CbO argues that **causation is ontologically neutral.** It is a structural feature of the world relating conditions to outcomes. Whether a condition is specified positively ("spark occurs") or negatively ("water absent") is a feature of our description, not necessarily a feature of the causal relation itself.

  If the world is such that $E$ would not have happened had $A$ been present, then $A$'s absence is a genuine difference-maker. To deny this is to prioritize a specific, contestable physics-based metaphysics over the logical structure of dependence that governs our best causal reasoning. Therefore, omissions should be accepted as genuine causes, not because they are "really" positive events in disguise, but because the metaphysics of causation is broad enough to include absences as relata.

  ***

  ### How to Use This in Class
  When discussing this, focus your critique on the **Process vs. Dependence** distinction. Ask the skeptic:
  *"If you reject omissions because they don't transfer energy, do you also reject causation in cases of preemptive overdetermination where energy transfer exists but counterfactual dependence does not? If you accept dependence in positive cases, what metaphysical warrant do you have for blocking it in negative cases?"*

  This forces them to defend the asymmetry rather than simply asserting it.
