  6.  **Writing the Dialogue:**
      *   *Tone:* Intellectual, respectful, sharp.
      *   *Names:* Elena (Geo), Marcus (Ortho).
      *   *Key citations (implicit or explicit):* Samuelson, Kelly, Peters, Menger.

      *(Self-Correction on the "Log(0)" issue)*: Strictly speaking, $\ln(0)$ is undefined. In economics, we usually say "bankruptcy constraint." I should acknowledge this technicality.

