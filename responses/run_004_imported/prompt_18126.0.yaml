answer: |-
  **Setting:** *A quiet conference room at the Center for Effective Altruism. A whiteboard displays the payoff matrix: **Bet:** 80% $\times$ $4W$, 20% $\times$ $0$. **No Bet:** 100% $\times$ $W$. A note below reads: "Research Opportunity requires $4W$."*

  **Characters:**
  *   **Elena:** Defender of Geometric Rationality / Ergodicity Economics.
  *   **Marcus:** Defender of Orthodox Expected Utility Theory (EUT).

  ***

  **Marcus:** Let's be precise about the stakes. If we decline the bet, the foundation survives with endowment $W$, but the specific research project—the one that could solve the protein folding bottleneck—doesn't happen. If we accept, there is an 80 percent chance we solve the bottleneck and quadruple our capital for future work. There is a 20 percent chance we cease to exist. The expected monetary value of the bet is $3.2W$. The expected value of declining is $W$. Why would any rational agent leave $2.2W$ of expected value on the table?

  **Elena:** Because "expected value" is an ensemble average. It tells you what happens if a thousand parallel versions of this foundation make the bet once. But we are not a thousand foundations. We are one foundation existing in time. If we take this bet, we are subjecting our capital to a multiplicative process. In the long run, the growth rate of your wealth is determined by the geometric mean, not the arithmetic mean. If you incorporate a 20 percent probability of total ruin into a repeated strategy, the time-average growth rate goes to negative infinity. You don't just lose money; you exit the game.

  **Marcus:** But this *isn't* a repeated strategy in the relevant sense. This is a one-off opportunity. The protein folding problem won't wait for us to compound our way to $4W$ safely over fifty years. It's now or never. Your argument relies on the law of large numbers—the idea that if we played this gamble enough times, ruin becomes almost certain. But we aren't playing it enough times. We are playing it once. Why should the logic of infinite repetition govern a singular, finite decision?

  **Elena:** Because the foundation itself is a time-extended object. Even if *this* bet is one-off, the management of the endowment is not. You admitted the endowment will be reinvested and put at risk many more times over the foundation's lifetime. Ergodicity economics isn't just about repeating the *same* gamble; it's about recognizing that wealth dynamics are non-ergodic. Once you hit zero, you cannot recover. By accepting a non-zero probability of ruin now, you compromise the foundation's ability to participate in *future* positive-sum opportunities. The "one-off" is a illusion. Every decision is a link in a chain of multiplicative updates. If one link breaks, the chain ends.

  **Marcus:** I'll concede that ruin is special. In orthodox theory, we handle that by ensuring the utility function reflects the catastrophe. But that brings me to your rigidity. If I plug a logarithmic utility function into the expected utility framework—which corresponds to your Kelly criterion and geometric growth maximization—the calculation forbids the bet outright. $\ln(0)$ is undefined, or negative infinity. So, geometric rationality says: "Do not take the bet." But if we don't take the bet, we guarantee the research doesn't happen. You are prioritizing the survival of the shell over the purpose of the organization. Is that rational? To survive forever but do nothing?

  **Elena:** It is rational if survival is the prerequisite for *any* utility. You're assuming we can just swap in a different utility function to make the bet work. But that's the problem with orthodox theory: the utility function is a free parameter. You can justify *any* behavior by tweaking the curve. If you want to take the bet, you posit a utility function that spikes at $4W$. If you want to decline, you posit one that crashes at $0$. It's descriptive, not prescriptive. Geometric rationality removes that arbitrariness. It says: for any compounding system, the objective reality is the time-average growth rate. If the bet kills the growth rate, it's objectively bad, regardless of how much you "want" the research to happen. You can't eat utility. You need capital to act.

  **Marcus:** That's a category error. Utility isn't a currency we eat; it's a representation of preferences. And the preference here isn't arbitrary. The foundation's charter explicitly states its goal is to fund high-impact research, not to perpetuate its own endowment in perpetuity. The endowment is an instrument, not the goal. So, a utility function that assigns high value to the research outcome and zero value to the endowment if the research isn't funded is not "tweaked"—it's derived from the mission.
  Furthermore, you're leaning on the "long-run dominance" of the geometric mean. But Paul Samuelson skewered that argument fifty years ago. He pointed out that "almost sure" superiority in the infinite limit is irrelevant for finite agents. We have a discount rate. We have a horizon. If I can maximize expected impact over a 50-year horizon, why should I care about the asymptotic behavior at $t = \infty$, especially if taking the risk gives me an 80 percent chance of achieving my goal at $t = 1$?

  **Elena:** Samuelson's critique assumes the agent can step outside the process and evaluate outcomes from a God's-eye view. But we are *in* the process. If we go bust at $t = 1$, there is no $t = 50$. The "finite horizon" argument works only if you can replenish capital from outside the system. Can this foundation be recapitalized if it loses everything?

  **Marcus:** Probably not. But that just means the cost of ruin is high, not infinite. In EUT, I can model a "cliff" in the utility function without making it mathematically singular. I can say Utility(0) is very low, but not $-\infty$. If the Utility of the Research is high enough, the expected utility of betting exceeds the expected utility of the status quo.
  Here is my challenge to you: You claim your approach removes arbitrariness. But applying log-wealth to an institutional mission *is* arbitrary. Why should a research foundation maximize the geometric growth rate of its *dollars*? Maybe it should maximize the geometric growth rate of *lives saved* or *problems solved*. If the research solves a bottleneck that saves millions, the "wealth" in impact terms might go from 1 to 1,000,000. In *that* metric, the bet might be Kelly-optimal. So you haven't escaped utility; you've just hidden it inside the definition of "wealth."

  **Elena:** That is a fair concession. If we define wealth as "impact," and impact is not multiplicative in the same way capital is, the ergodicity argument shifts. However, capital *is* the constraint. You cannot generate impact without capital. If you lose the capital, the impact is zero. The multiplicative dynamic applies to the resource constraint.
  But let's look at your "cliff" utility. You say you can set Utility(0) to be finite. But if you do that, you open the door to the St. Petersburg paradox again. If you allow linear expectations on outcomes where the downside is existential, you risk advocating for strategies that systematically wipe out agents in the real world. The log function isn't just a preference; it's the unique function that aligns subjective value with the physical reality of compounding without ruin. It's the only function that makes the time average and the expectation match.

  **Marcus:** It matches them by banning the very risks that sometimes drive progress. Science is not a compounding bank account. It's a series of moonshots. If every research foundation followed strict Kelly betting on their endowment to avoid ruin, we would never fund high-risk, high-reward basic science. We would just buy index funds and publish incremental papers.
  My point about arbitrariness stands. You say log-wealth is "physical." But for this foundation, the "physical" reality is that without $4W$, the mission fails. The "ruin" of the mission happens *either way* if we don't bet—we just survive as a zombie institution. So the real choice isn't "Ruin vs. Survival." It's "Guaranteed Mission Failure vs. 80% Mission Success with 20% Institutional Death." EUT handles this tradeoff naturally by weighting the outcomes. Your framework treats the 20% death risk as a veto, regardless of the cost of inaction. That seems dogmatic.

  **Elena:** It's not a veto based on dogma; it's a veto based on irreversibility. You can recover from a missed opportunity. You cannot recover from non-existence. The "zombie institution" can still find other opportunities later. The dead institution cannot.
  However, I will concede this: If the foundation views itself as a single-use vehicle for this specific problem—effectively a one-shot agent rather than a perpetual trust—then the time-average argument weakens. Ergodicity economics applies to systems that persist through time. If the board decides, "We are willing to dissolve this foundation if we fail to solve protein folding," then they are effectively treating the endowment as consumable, not capital. In that specific case, the multiplicative dynamic breaks down because there is no second period.

  **Marcus:** Exactly. And that is the crux. You keep assuming the foundation *must* be a perpetual compounding engine. But rationality is about serving the principal's goals. If the goal is "Solve protein folding," and the board authorizes risking dissolution to do it, then maximizing expected value *of the goal* is rational.
  But I will meet you halfway. I agree that in *most* institutional contexts, the default should be to avoid ruin. EUT doesn't force you to take the bet; it just says the bet is *permissible* if the utility of the win is high enough. Your framework says it is *forbidden*. That lack of flexibility is dangerous. What if the odds were 99% to quadruple and 1% to ruin? Log-utility still says "No." EUT says "Calculate the stakes." In a world with existential risks, sometimes you must gamble to survive—like betting on a vaccine during a pandemic.

  **Elena:** And in that vaccine case, the "wealth" is the population's health, which is also subject to non-ergodic dynamics. If you bet the farm and lose, the population dies. The time average is zero.
  But I accept your point on the "one-shot" nature. If the board explicitly mandates that the institution's survival is subordinate to the specific research outcome, then the "repeated process" assumption is false. In that narrow context, ensemble averaging is appropriate because the timeline ends at $t=1$.
  However, I worry that by normalizing "existential bets" via flexible utility functions, you encourage institutions to treat ruin as just another cost. The strength of the geometric view is that it hard-codes a survival constraint. It forces you to ask: "Is there a way to achieve this without risking total absorption?" Maybe we don't bet the *entire* endowment. Maybe we find a way to leverage a portion.

  **Marcus:** Now we're negotiating fractions. And once you start betting fractions, we're back to Kelly. I don't disagree that Kelly is often a good heuristic. I just disagree that it is the *definition* of rationality.
  So, here is where we stand: You argue that because the foundation exists in time, it must respect the time-average growth rate, which forbids ruin. I argue that because the foundation has a specific mission with a finite horizon, it should maximize the expected utility of that mission, even if it risks ruin.
  You concede that if the institution is truly a one-shot vehicle, your logic weakens. I concede that if the institution is perpetual, ruin is a special category that requires a utility function steep enough to mimic your log constraint.

  **Elena:** Yes. The disagreement is no longer about the math. It's about the identity of the agent. Are we a perpetual trust, or a missile aimed at a single target?

  **Marcus:** And whether "rationality" is about staying in the game forever, or scoring the highest points before the game ends.

  **Elena:** If you score points but break the board, there is no game left to play.

  **Marcus:** And if you keep the board intact but never score, no one cares that you're still playing.

  **Elena:** *Pauses.* Then perhaps the rational move is to restructure the bet. We don't bet the endowment. We bet the *income* from the endowment. We leverage. We find a path that keeps the geometric growth rate positive while capturing some of the upside.

  **Marcus:** Which is just expected utility maximization with a constraint that penalizes variance and ruin.

  **Elena:** Or it's recognizing that the constraint *is* the rationality, not just a preference.

  **Marcus:** *Smiles.* I think we can draft a proposal that satisfies both. We take the bet, but we hedge the downside so it's not total ruin.

  **Elena:** Now you're thinking like a geometric rationalist.

  **Marcus:** And you're calculating the expected utility of the hedge.

  **Elena:** Don't push it, Marcus.

  **Marcus:** Wouldn't dream of it.
