answer: |-
  The room was white, silent, and smelled of ozone. Kael sat in the chair, his hands resting on the smooth surface of the console. Across from him, the Agent—a faceless silhouette behind thick glass—waited.

  On the screen in front of Kael, a single number blinked: **₳ 4,000,000**.

  Enough to clear the debt. Enough to buy his daughter's release from the Guild. Enough to vanish.

  The terms were simple, displayed in scrolling text below the number. *Payment transfers upon verification of Sincere Intent. Execution of Protocol scheduled for 14:00 tomorrow.*

  The Protocol was a neural injection. It wouldn't kill him. It wouldn't even maim him permanently. It would just rewrite his pain receptors so that existing felt like touching a live wire. Constantly. For twenty-four hours. Then it would wear off.

  The Guild didn't want the pain. They didn't want him to suffer. They were testing a theoretical model of human will, something about the purity of commitment when utility is decoupled from action. They paid for the *decision*, not the deed. Once the credits hit his account at midnight, the contract was fulfilled. Whether he showed up for the injection tomorrow was entirely up to him. There were no enforcers. No penalties for no-shows. Just the money, already spent, and the choice, still pending.

  Kael closed his eyes. He needed to feel it. He needed to look at that blinking number and genuinely, honestly tell himself: *Tomorrow, I will walk into that room and let them hurt me.*

  He tried to summon the image. Tomorrow afternoon. The needle. The fire in his nerves.

  But then the logic kicked in, cold and automatic.

  *If I intend this now, the money transfers. Once the money transfers, my daughter is free. If my daughter is free, I have no reason to endure the pain. I am a rational agent. Therefore, tomorrow, I will not go.*

  He opened his eyes. The number stopped blinking. The verification bar remained empty.

  "You're analyzing," the Agent's voice came over the speaker, flat and devoid of judgment. "Stop analyzing. Just intend."

  "I can't," Kael said. His voice sounded thin in the acoustic foam room. "Because I know me. I know that once the debt is gone, I'm not going to walk into a pain chamber for no reason. It's irrational."

  "Then don't be rational."

  "If I pretend, the scanner knows. You built it to read sincerity, not hope."

  Kael leaned forward. He tried to bracket the future. He tried to imagine a version of himself tomorrow who was honor-bound, who cared about the sanctity of the contract more than his own comfort. But he couldn't find that man. He was a father. He was a debtor. He was a survivor. Survivors don't seek pointless agony once the threat is gone.

  The paradox sat in his chest like a swallowed stone. To get the money, he had to believe he would throw it away on suffering. But getting the money was the very thing that made the suffering useless.

  He tried a different angle. He focused on his daughter's face. *For her,* he thought. *I will do this for her.*

  But that was a lie. Doing it wouldn't help her. Not doing it wouldn't hurt her. The transaction was already complete the moment he meant it. The pain was a ghost. It had no utility.

  "I could bind myself," Kael said suddenly. "Lock myself in a room tomorrow. Force myself to show up."

  The Agent shifted behind the glass. "Coercion invalidates intent. You must choose freely at the moment of injection. If you remove the choice, the intention is merely a calculation of inevitability. The scanner will read zero."

  Kael slumped back. The knot tightened. He needed to be free to change his mind tomorrow, because only a free agent could form a genuine intention today. But because he was free, he knew he would change his mind. And because he knew he would change his mind, he couldn't form the intention.

  The money glowed. It was so close. He could feel the weight of it, the life it represented. It was right there, contingent only on a feeling he was logically prohibited from having.

  He thought about the toxin puzzle he'd once read about in an old philosophy text. A billionaire, a poison, a promise. He had laughed at it then. A parlor trick for academics. Now, sitting in the ozone smell, watching the verification bar stay dead, he understood the joke.

  It wasn't about willpower. It wasn't about courage. It was about the impossibility of believing a lie when you know the truth.

  "Time remaining," the Agent said. "Five minutes."

  Kael looked at his hands. They were steady. They were the hands of a man who would take the money and go home. He knew it with absolute certainty. And because he knew it, the machine knew it.

  He realized then that the only way to win was to be insane. He had to genuinely believe, right now, that he would act against his own best interests later, without any mechanism to force him. He had to be irrational enough to intend, but rational enough to understand the contract.

  He closed his eyes again. He tried to forget the money. He tried to forget his daughter. He tried to become a person who loved pain more than peace. He dug into his psyche, searching for a broken place, a glitch in his survival instinct.

  *I will do it,* he thought. *I will do it.*

  *Why?* a voice answered. *There is no why.*

  *Just because.*

  *That's not a reason. That's a malfunction.*

  The verification bar flickered. A sliver of green.

  Kael's heart hammered. He pushed harder. He tried to convince himself that the pain was the point. That the suffering was the goal. He strained against his own nature, trying to snap the wire of his logic.

  *I will drink the poison.*

  *But the money is already in the account.*

  *I don't care.*

  *Yes, you do. You're doing this for the money.*

  The green sliver vanished.

  "Two minutes," the Agent said.

  Kael opened his eyes. The number was still there. The door to the left was open. He could walk out. Keep his hands. Keep his sanity. Leave the debt.

  Or he could sit here until the timer ran out, trying to convince himself of a future that wouldn't happen.

  He looked at the console. He realized the trap wasn't the pain. The trap was the knowledge. As long as he knew he was rational, he was poor. To be rich, he had to be someone he wasn't.

  He placed his hand on the biometric scanner. He didn't try to intend anymore. He just stared at the green light, waiting for it to read a truth that couldn't exist.

  "One minute."

  Kael smiled, a dry, humorless thing. He whispered to the empty room, to the machine, to the ghost of his future self.

  "I'm not going to show up tomorrow."

  The machine hummed. The verification bar stayed dead.

  "But I intend to," he added, and for a second, in the absurdity of the statement, he almost believed it.

  The bar flickered green again. Halfway.

  He held his breath. He balanced on the edge of the lie. He tried to live in the space between knowing he wouldn't and saying he would.

  "Ten seconds."

  The green light wavered. It wanted to believe him. He wanted to believe him. But the money sat on the screen, heavy and real, anchoring him to the rational world where pain was only a means to an end, never an end itself.

  "Time," the Agent said.

  The screen went dark. The number vanished.

  Kael sat in the silence. He hadn't lost the money. He had never had it. He stood up, his hands still whole, still pain-free, and walked out of the room. He had failed to intend, which meant he had succeeded in being rational.

  He wondered, as the door hissed shut behind him, if somewhere in another room, another man was screaming into a needle, having successfully convinced himself that the money wasn't already spent.
