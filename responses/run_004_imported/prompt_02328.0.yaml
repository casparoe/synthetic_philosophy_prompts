      *   *Distinction between Internal and External Questions:* Internal questions are answered within a framework (e.g., "Is there a prime number greater than 100?"). External questions are about the adoption of the framework itself (e.g., "Do numbers exist?"), which are pragmatic, not theoretical.
      *   *Neutrality of Logic:* Logic is a tool, not a metaphysical truth.
      *   *Physicalism:* In his later work (*The Logical Syntax of Language*, *Foundations of Probability*), he moved towards a unified physical language. Everything meaningful must be translatable into physical terms.
      *   *Inductive Logic/Probability:* He spent much of his later life trying to formalize inductive reasoning (confirmation theory). He believed probability could be logical.
      *   *Relationship with Neurath:* They were allies but distinct. Neurath was more pragmatic, sociological, and politically overt. Carnap was more formal, systematic, and cautious about metaphysical overreach.

