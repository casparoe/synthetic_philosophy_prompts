answer: |-
  This is a strong, provocative angle for a talk. It moves beyond the standard "bad man, good logic" dismissal and asks a genuinely philosophical question about the *texture* of Frege's thought.

  Here is a breakdown of the history, a check on your reading of Dummett, an evaluation of your thesis, and some counter-pressure to help you sharpen the argument.

  ### 1. Historical Fact-Check
  Your background summary is solid, but here are a few specifics to tighten up for the talk:

  *   **The Diary:** Kept March–April 1924, shortly before his death.
  *   **Suppression:** You are correct that it was omitted from the *Nachlass* edited by Hans Hermes, Friedrich Kaulbach, et al. (published 1969).
  *   **Publication:** It was first published in German by **Gottfried Gabriel** in 1994 (*Gottlob Frege: Ein politisches Tagebuch*).
  *   **Translation:** Excerpts appeared in English in Michael Beaney's *The Frege Reader* (1997) and the full translation by Richard L. Mendelsohn is available in *The New Frege* literature (often cited via Gabriel's edition).
  *   **Content:** It is indeed virulent. He proposes stripping Jews of civil rights and expelling them; he blames Jews for Germany's WWI loss; he despises the Reichstag; he longs for a dictatorship.

  **Verdict:** Your history is accurate. No red flags there.

  ### 2. Are You Strawmanning Dummett?
  Not really, but you might be understating his distress.

  Dummett was a committed anti-racist (politically active in anti-apartheid movements). When he read the diary, it wasn't just a loss of "warmth"; it was a biographical crisis. In his introduction to *The Frege Reader* (1997), Dummett writes that the diary makes it impossible to view Frege as the "paragon of rationality" he was often painted as.

  However, Dummett **does** hold the line on the separation of work and life. His argument is essentially:
  1.  Frege's logic is objective.
  2.  Frege's politics are subjective/moral failures.
  3.  Therefore, the logic stands.

  **Where you can push:** Dummett treats the politics as an *external* stain. Your thesis is that the politics might be *internal* to the philosophical temperament. You aren't strawmanning him, but you are challenging the sufficiency of his solution. You might note that Dummett admits Frege's philosophy lacks an ethical component that could have checked these impulses, which opens the door to your argument that the *structure* of the philosophy itself is implicated.

  ### 3. Evaluating the Thesis: "The Hunger for Order"
  Your hunch is that Frege's **anti-psychologism** (logic is not about how humans think) and **Platonism** (thoughts exist in a third realm) are structurally homologous to his **anti-democratic authoritarianism** (the state should not be about what people want).

  **Does it hold up?**
  Yes, but with a specific nuance. The connecting thread isn't just "order"; it is **the elimination of contingency and human agency.**

  *   **In Logic:** Frege hated psychologism because it made truth dependent on human minds, which are variable, fallible, and subjective. He wanted Truth to be *objective*, immutable, and independent of us.
  *   **In Politics:** Frege hated Weimar democracy because it made law dependent on the "masses," who are variable, fallible, and (in his view) easily manipulated by "alien" influences (Jews). He wanted the State to be *objective*, immutable, and independent of popular will.

  **The Argument's Strength:**
  This avoids the genetic fallacy (saying the logic is *false* because he was a bigot). Instead, it argues that the **motivation** for the logic and the politics springs from the same metaphysical anxiety: a fear of relativism.
  *   *Key Phrase for your talk:* "Frege's ontology is an aristocracy of Thoughts." (Thoughts are ownerless, eternal, and rule over us, just as the Monarch/Dictator should).

  **The Risk:**
  You need to be careful not to imply that Platonism *entails* Fascism. (See counterexamples below). The argument works best if you frame it as **Frege's specific deployment of objectivity.** He uses objectivity not just to secure truth, but to *discipline* the human subject.

  ### 4. Counterexamples & Pressure Points
  To make the talk robust, you need to anticipate the "But what about...?" questions.

  **A. The Russell Counterexample (Logic $\neq$ Fascism)**
  *   **Bertrand Russell** was working on the same Logicist project (math reducible to logic) at roughly the same time.
  *   **Politics:** Russell was a radical pacifist, a socialist, and an anti-authoritarian who went to prison for his writings.
  *   **Implication:** This proves that the *technical apparatus* of Frege's logic does not necessitate authoritarian politics.
  *   **Your Rebuttal:** This strengthens your point about *temperament* rather than *content*. Russell wanted logic to liberate humans from dogma; Frege wanted logic to bind humans to Truth. The tool is the same; the telos is different.

  **B. The Heidegger Counterexample (Fascism $\neq$ Logic)**
  *   **Martin Heidegger** was a Nazi party member.
  *   **Philosophy:** He was deeply anti-rationalist, anti-logic (in the Fregean sense), and focused on historicity and being-in-the-world.
  *   **Implication:** Authoritarianism does not require a belief in a "Third Realm" of eternal truths. In fact, many fascists were irrationalists.
  *   **Your Rebuttal:** Frege is a specific *kind* of reactionary. He is a **Reactionary Modernist**. He wants the future to be ordered by eternal laws, not by blood-and-soil mysticism alone. This makes his case unique compared to Heidegger.

  **C. The Carnap Counterexample (Formalism $\neq$ Authoritarianism)**
  *   **Rudolf Carnap**, Frege's intellectual heir, fled the Nazis and was a liberal socialist.
  *   **Implication:** You can inherit Frege's logic without inheriting Frege's politics.
  *   **Your Rebuttal:** Carnap explicitly *rejected* Frege's Platonism (moving toward conventionalism/linguistic frameworks). This supports your thesis: when you drop the "mind-independent Third Realm," the political affinity might dissolve.

  ### 5. Suggestions for Sharpening the Talk

  **1. Focus on "The Third Realm" as a Political Metaphor**
  Frege describes "Thoughts" (*Gedanken*) as not belonging to anyone. They are not my thoughts or your thoughts; they are *The* Thoughts.
  *   *Idea:* Connect this to his desire for a state where individual identity (especially "alien" identity) is subsumed under the National/Imperial will. The "Third Realm" is a realm without Jews, without subjectivity, without negotiation. It is a purified space.

  **2. Distinguish "Validity" from "Value"**
  Concede immediately that $2+2=4$ regardless of Frege's bigotry. But argue that the **philosophical value** we place on certain traits (rigidity, immunity to criticism, disdain for "psychological" weakness) is culturally loaded.
  *   *Point:* We praise Frege for being "ruthless" against psychologism. Your talk asks: Is that ruthlessness philosophically virtuous, or is it the same vice that made him a monster in 1924?

  **3. Use the Term "Epistemic Authoritarianism"**
  This might be a useful label. Frege believes there is One True Way to carve reality (logic), and anyone who disagrees is not just wrong, but *confused* (psychologistic). This mirrors his political view: there is One True Order for Germany, and anyone who disagrees is an enemy agent.

  **4. Recommended Reading for the Talk**
  *   **Gottfried Gabriel:** "Frege's Political Diary" (Introduction to the edition).
  *   **Cheryl Misak:** She writes on the link between pragmatism and democracy; contrasting her with Frege could highlight his anti-democratic epistemology.
  *   **Michael Dummett:** *Origins of Analytical Philosophy* (where he discusses the moral implications).
  *   **Jacques Bouveresse:** Has written on Frege's rationality and its limits.

  ### Summary Verdict
  Your hunch is **not too cute**. It is a recognized line of inquiry in recent Frege scholarship (post-1990s). The "Standard Move" (Dummett's separation) is increasingly seen as insufficient by intellectual historians.

  **Your specific contribution:** Don't just say "he was consistent." Say "Frege's logic is an **asylum from the human**." He built a system where human error, human opinion, and human difference have no place. That is a beautiful thing for math; your talk argues it is a terrifying thing for politics, and that Frege failed to see the difference.

  Good luck with the talk. It sounds like it will be a difficult but necessary conversation.
