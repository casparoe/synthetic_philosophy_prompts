prompt: |-
  So next week I'm interviewing a theoretical neuroscientist for a piece on the free energy principle — she's built her whole career on the claim that it explains not just perception but basically all of life and self-organization. Shes sharp and has fielded every softball question a hundred times, so I need questions that actually go somewhere, not "what is the free energy principle" 101 stuff. Can you draft 7-8 interview questions, each with a follow-up keyed to whatever answer she'll probably give? I want at least one pushing on the "it's unfalsifiable/tautological" charge (she usually deflects with "it's a principle, not a hypothesis, like least action" — the follow-up needs to catch that move), one on the dark room problem and whether active inference actually solves it or just bakes the answer into the priors after the fact, and one calling out the slide between the modest predictive-processing story about perception and the much grander claim that literally any system with a Markov blanket is minimizing free energy.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Interviewee:** A theoretical neuroscientist specializing in the Free Energy Principle (FEP) and Active Inference.
      *   **Topic:** Free Energy Principle (FEP), Active Inference, Predictive Processing.
      *   **Interviewee's Stance:** Strong proponent (claims FEP explains "all of life and self-organization"). Sharp, experienced, has standard answers for common questions.
      *   **Goal:** 7-8 deep, probing questions (not 101 stuff) with tailored follow-ups based on anticipated defensive moves.
      *   **Specific Requirements:**
          *   One question on unfalsifiability/tautology (countering the "it's a principle like least action" defense).
          *   One question on the Dark Room problem (does Active Inference solve it or just bake it into priors?).
          *   One question on the scope creep (modest perception vs. universal Markov blanket claim).
      *   **Tone:** Professional but incisive. Needs to corner the interviewee without being antagonistic for the sake of it.

  2.  **Deconstruct the Free Energy Principle (FEP) & Common Criticisms:**
      *   *Core Claim:* Systems that persist (don't dissipate) minimize variational free energy (surprise).
      *   *Mechanism:* Perception updates models; Action changes the world to match models (Active Inference).
      *   *Criticism 1 (Tautology):* "Things that survive survive." If FEP is a necessary condition for existence, is it explanatory?
      *   *Criticism 2 (Dark Room):* If the goal is to minimize surprise, why don't organisms just sit in a dark, silent room (low sensory input)? *Standard Answer:* Priors dictate we need food/social interaction. *Counter:* Then the work is in the priors, not the FEP.
      *   *Criticism 3 (Scope):* Is it a theory of the brain or a theory of physics/biology? The leap from "neurons predict" to "cells/bacteria/societies minimize free energy" is huge.
      *   *Criticism 4 (Normative vs. Descriptive):* Is it how the brain *should* work or *does* work?
      *   *Criticism 5 (Mathematical Tractability):* The math is often intractable for real biological systems. Is it a useful approximation or a metaphysical claim?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Tautology/Least Action Defense.*
          *   *Draft:* People say it's unfalsifiable. You say it's like least action. But least action predicts trajectories. What does FEP predict that biology wouldn't do anyway?
          *   *Refinement:* Need to pin down the "principle vs. hypothesis" distinction. If it's a principle, it defines the space of possible theories. But does it constrain *which* theories are viable in a way we can test?
          *   *Follow-up:* If she says "it constrains the form of the dynamics," ask for a specific dynamic that is *forbidden* by FEP but physically possible.

      *   *Question 2: The Dark Room Problem.*
          *   *Draft:* Why don't we sit in dark rooms? You say priors. But isn't that moving the goalposts?
          *   *Refinement:* Focus on the *source* of the priors. If the FEP requires specific priors to avoid the dark room, does the explanatory heavy lifting lie in the FEP or in the evolutionary story of the priors?
          *   *Follow-up:* If she says "evolution shapes priors," ask if FEP adds anything beyond "evolution optimizes for survival."

      *   *Question 3: Scope Creep (Markov Blankets).*
          *   *Draft:* You say everything with a Markov blanket does this. That's a big jump from perception.
          *   *Refinement:* Distinguish between the *mathematical necessity* of a boundary and the *functional claim* of inference. Does a bacterium "infer"?
          *   *Follow-up:* If she says "inference is just physical coupling," ask if the term "inference" loses its meaning when applied to non-neural systems.

      *   *Question 4: Normative vs. Descriptive.*
          *   *Draft:* Is this how brains work or how they should?
          *   *Refinement:* Focus on systematic biases/irrationality. Humans are bad at probability. How does FEP accommodate systematic deviation from free energy minimization?
          *   *Follow-up:* If she says "approximate inference," ask where the line is between "approximate FEP" and "not FEP."

      *   *Question 5: The "Just-So" Story Risk.*
          *   *Draft:* Can't you explain any behavior with this?
          *   *Refinement:* Focus on model comparison. In practice, how do you choose between an FEP model and a standard reinforcement learning model? When does FEP lose?
          *   *Follow-up:* If she says "FEP encompasses RL," ask if a theory that encompasses everything explains nothing specific.

      *   *Question 6: Thermodynamics vs. Information.*
          *   *Draft:* How does this relate to entropy?
          *   *Refinement:* FEP links information theory and thermodynamics. But biological systems are dissipative structures. Is FEP just a restatement of the Second Law?
          *   *Follow-up:* If she says "it's more than that," ask for the specific causal mechanism linking the information bound to the physical energy cost.

      *   *Question 7: The "Hard Problem" of Phenomenology.*
          *   *Draft:* Does this explain consciousness?
          *   *Refinement:* FEP is often linked to consciousness (self-evidencing). Does minimizing surprise explain *what it feels like*?
          *   *Follow-up:* If she says "it explains the structure of selfhood," ask if structure without qualitative experience is actually a theory of consciousness or just behavior.

      *   *Question 8: Future/Falsification.*
          *   *Draft:* What experiment would change your mind?
          *   *Refinement:* Make it concrete. A specific neural signature or behavioral paradigm.
          *   *Follow-up:* If she gives a vague answer, press for a specific dataset that would contradict the principle.

  4.  **Review and Polish:**
      *   Check against constraints: 7-8 questions? Yes. Follow-ups included? Yes. Specific topics covered (Tautology, Dark Room, Scope)? Yes.
      *   Tone check: Ensure the follow-ups anticipate the "standard defense" and push past it.
      *   *Self-Correction on Q1 (Tautology):* Make sure the follow-up specifically addresses the "Least Action" analogy, as requested. The key is that Least Action applies to physics where we know the Lagrangian. In biology, we don't know the "Lagrangian" (the generative model).
      *   *Self-Correction on Q2 (Dark Room):* Ensure the follow-up highlights that if priors do the work, FEP is just the engine, not the map.
      *   *Self-Correction on Q3 (Scope):* Ensure the follow-up challenges the semantic stretch of "inference."

  5.  **Final Polish:** Organize clearly with "Question" and "Anticipated Answer & Follow-up" structure for the user. Add a brief intro/outro context. (Proceeding to generate output based on this thought process).

