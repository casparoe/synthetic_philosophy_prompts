answer: |-
  Here are 8 interview questions designed to bypass the standard "FEP 101" script. They are structured to anticipate her likely defensive maneuvers (the "principle not hypothesis" defense, the "priors solve everything" move, etc.) and press for concrete explanatory power.

  ### 1. The "Principle vs. Tautology" Trap
  **Question:** Critics often argue that the Free Energy Principle is unfalsifiable because any system that persists *must*, by definition, resist entropy. You've countered this by comparing FEP to the Principle of Least Action in physics. But in physics, Least Action allows us to derive specific equations of motion from a known Lagrangian. In biology, we rarely know the "Lagrangian" (the generative model). If we can only infer the model *after* observing the behavior, isn't FEP functioning as a post-hoc description rather than a predictive law?

  *   **Anticipated Answer:** She will likely argue that FEP constrains the *form* of the dynamics, not the specific trajectory. She'll say it tells us *that* a system must have a Markov blanket and internal states that parameterize a density, even if we don't know the content.
  *   **Follow-up:** "If it constrains the form but not the content, can you name a specific biological dynamic that is physically possible but *forbidden* by the Free Energy Principle? If there is no configuration of matter that FEP rules out, how is it distinct from saying 'things that survive, survive'?"

  ### 2. The Dark Room Problem & The "Priors" Defense
  **Question:** The classic critique of minimizing surprise is the "Dark Room" problem: if the goal is to minimize sensory surprise, an organism should seek a dark, silent room and stay there. The standard Active Inference response is that organisms have priors that expect food, social contact, etc. But doesn't this simply outsource the explanatory work to the priors? If FEP needs specific, evolutionarily-tuned priors to prevent an organism from starving in a dark room, isn't the real theory of behavior the theory of *how those priors are set*, not the minimization principle itself?

  *   **Anticipated Answer:** She will likely say that priors are not arbitrary; they are shaped by evolution to ensure self-evidence. The FEP provides the mechanism (active inference) by which those priors are enacted.
  *   **Follow-up:** "So if the mechanism is universal but the outcome depends entirely on the evolutionary history of the priors, does FEP explain *why* a specific behavior occurs, or does it just provide a mathematical vocabulary to describe whatever behavior evolution happened to select? Where is the causal leverage?"

  ### 3. The Scope Creep (Markov Blankets vs. Inference)
  **Question:** There seems to be a slide in the literature between a modest claim—that predictive processing explains perception—and a grand claim—that *any* system with a Markov blanket (including cells or bacteria) is performing "inference." When you apply the term "inference" to a bacterium moving up a glucose gradient, are you making a claim about its internal computational structure, or are you just saying its physics can be *modeled* as if it were inferring?

  *   **Anticipated Answer:** She will likely argue for "as if" realism—that if the math is isomorphic, the distinction between 'real' inference and 'physical' coupling is a category error. The system *is* minimizing free energy, regardless of neurons.
  *   **Follow-up:** "If 'inference' applies to any physical coupling across a boundary, does the term lose its discriminatory power? If a rock eroding in the wind and a human solving a math problem are both 'minimizing free energy,' what useful distinction remains between cognitive systems and non-cognitive dissipative structures?"

  ### 4. Normative vs. Descriptive (The Irrationality Problem)
  **Question:** FEP is often framed as a normative theory: this is how a system *should* work to maintain itself. But human behavior is rife with systematic biases and irrationalities that seem to *increase* surprise or risk (e.g., addiction, phobias, gambling). How does FEP account for systematic deviations from free energy minimization without just labeling them as 'approximate inference' with high temperature parameters?

  *   **Anticipated Answer:** She will likely say that all inference is approximate and that what looks like irrationality is actually rational inference under a distorted generative model (e.g., the addict *believes* the drug is necessary for survival).
  *   **Follow-up:** "If every maladaptive behavior can be retrofitted as 'rational inference under a distorted model,' doesn't that make the claim that organisms minimize free energy unfalsifiable? What would a truly 'non-minimizing' behavior look like in your framework?"

  ### 5. Model Comparison: FEP vs. Reinforcement Learning
  **Question:** In practical neuroscience, researchers often use Reinforcement Learning (RL) to model decision-making. RL is computationally tractable and makes specific predictions about reward prediction errors. What is the concrete advantage of using Active Inference over standard RL? Is there a specific dataset where an FEP model fits the data significantly better than an RL model, or is the claim that FEP is more 'unifying' purely theoretical?

  *   **Anticipated Answer:** She will argue that RL is a special case of Active Inference and that FEP handles exploration/exploitation more naturally (via information gain) without needing ad-hoc exploration bonuses.
  *   **Follow-up:** "If RL is a special case, then FEP is the more complex model. In model selection, we penalize complexity. Have you performed a formal model comparison where FEP wins on parsimony, or does it only win because it has more free parameters to absorb the variance?"

  ### 6. Thermodynamics and the Second Law
  **Question:** You link information theory and thermodynamics, suggesting that minimizing variational free energy is related to minimizing physical entropy. But biological systems are dissipative structures that maintain order by exporting entropy to the environment. Is FEP actually offering a new physical mechanism, or is it just a restatement of the Second Law of Thermodynamics applied to bounded systems?

  *   **Anticipated Answer:** She will likely distinguish between thermodynamic free energy and variational free energy, arguing that FEP bridges the two by showing how information processing constrains physical dissipation.
  *   **Follow-up:** "Can you specify the causal mechanism? Does the information bound *cause* the energy efficiency, or is the information bound just a statistical shadow of the physical constraint? If I simulate a system that minimizes variational free energy but has infinite energy supply, does it still behave like a living system?"

  ### 7. The "Self" and Phenomenology
  **Question:** Proponents of FEP often suggest it explains the sense of self—that the self is just the boundary of the Markov blanket or the model's estimate of its own existence. But this seems to address the structural boundary of the organism, not the *phenomenology* of selfhood. Does FEP have anything to say about why minimizing free energy feels like something from the inside, or is it strictly a theory of behavior and structure?

  *   **Anticipated Answer:** She may argue that "feeling" is just the process of error correction itself, or that phenomenology is out of scope for a physical principle.
  *   **Follow-up:** "If 'feeling' is just error correction, then a thermostat correcting a temperature error is 'feeling.' If you reject that, you need a threshold for complexity. Where does FEP draw the line between a system that minimizes surprise and a system that *experiences* the minimization?"

  ### 8. The "Change My Mind" Experiment
  **Question:** Let's get concrete. If you had to design a critical experiment that could potentially disprove the universality of the Free Energy Principle in biological systems, what would it look like? What specific neural signature or behavioral outcome would force you to abandon the framework?

  *   **Anticipated Answer:** She might say that finding a system that persists without a Markov blanket would disprove it, or a brain that updates beliefs in the direction of *higher* surprise.
  *   **Follow-up:** "But if a brain updates toward higher surprise, wouldn't your immediate move be to say it has a 'pathological prior' or is in a transient state? If the principle allows for transient violations or pathological priors, is there any empirical result that couldn't be absorbed by tweaking the model's assumptions?"
