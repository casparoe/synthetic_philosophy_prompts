answer: |-
  Here is a concrete case designed to expose the tension in Nozick's capacity-based justification, often referred to in philosophy as the **"Argument from Marginal Cases."**

  ### The Case of Arthur and the Vaccine Trial

  **The Scenario**
  Imagine a near-future scenario where a deadly virus threatens the population. Researchers have developed a potential vaccine, but to verify its safety and efficacy before mass production, they must conduct a final, invasive phase of testing. This testing involves injecting the subject with a high viral load and subjecting them to painful procedures that will inevitably result in the subject's death within a week. However, success guarantees the salvation of 10,000 people.

  **The Subjects**
  The researchers have two potential candidates for this sacrifice:

  1.  **Subject A (Arthur):** Arthur is a 30-year-old human being. Due to a severe congenital cognitive disability, Arthur functions at the level of a toddler. He has no language, no concept of the future, and no ability to form goals or plans. He lives entirely in the immediate present. Crucially, Arthur lacks the capacity to form or steer his life according to any "overall conception of the good." He is, in Nozick's specific terms, not a rational life-planner.
  2.  **Subject B (Koko):** Koko is a chimpanzee. She exhibits complex tool use, emotional depth, and social strategizing. While she may not have a philosophical conception of the good, her cognitive complexity and capacity for future anticipation are functionally equivalent to, or perhaps exceed, Arthur's.

  **Nozick's Scheme Applied**
  According to Nozick's two-tier scheme:
  *   **Normal Humans:** Possess the capacity for rational life-planning. They are protected by strict Kantian side-constraints. They cannot be sacrificed, even to save 10,000 lives.
  *   **Animals:** Lack the capacity for rational life-planning. They are subject to utilitarian calculus. Their suffering and death can be weighed against the aggregate benefit.

  **The Dilemma**
  The problem arises when we ask: **Into which tier does Arthur fall?**

  **Option 1: Consistency with the Capacity Criterion**
  If Nozick remains faithful to his stated justification—that rights are grounded *only* in the capacity to form an overall conception of the good—then Arthur must be placed in the **Animal/Utilitarian Tier**. He lacks the specific capacity that grants inviolability.
  *   *The Result:* It becomes morally permissible to sacrifice Arthur to save the 10,000. In fact, if Koko the chimpanzee demonstrates *more* cognitive planning capacity than Arthur, a strict application of the capacity criterion might suggest it is *more* permissible to sacrifice Arthur than Koko.
  *   *The Problem:* This violates a deep-seated moral intuition (and legal standard) that Arthur, as a human being, possesses an inviolable right to life that cannot be traded for aggregate utility. It suggests that severely disabled humans have fewer rights than some animals, a conclusion most find repugnant.

  **Option 2: Consistency with Moral Intuition (The "Kind" Defense)**
  If Nozick insists that Arthur *cannot* be sacrificed, he must protect him. But since Arthur lacks the requisite capacity, Nozick cannot use his primary justification. In *Anarchy, State, and Utopia*, Nozick anticipates this and suggests we might protect such humans because they are of the **"kind"** that typically possesses these capacities, or to avoid a "slippery slope" where normal humans might be mistakenly targeted.
  *   *The Result:* Arthur is protected, not because of his own attributes, but because of his species membership or his relation to other humans.
  *   *The Problem:* This undermines Nozick's explicit attempt to avoid speciesism. He explicitly argues that we should not draw the line at "human DNA" but at "rational agency." By protecting Arthur via the "kind" argument, Nozick surrenders the capacity criterion and tacitly admits that species membership *is* the actual deciding factor. If species membership is the real ground for Arthur's rights, then the capacity argument was merely a pretext, and the distinction between "people" and "animals" is biologically arbitrary after all.

  ### Why This Breaks the Scheme

  This case demonstrates that anchoring the distinction in **capacity** rather than **species** creates a "moral gap" that Nozick's system cannot bridge without contradiction.

  1.  **The Instability of Rights:** If rights depend on a fluctuating capacity (which can be lost through injury, dementia, or never attained), then rights become contingent. A human who enters a permanent vegetative state loses their "overall conception of the good." Under Nozick's strict capacity view, they would lose their side-constraints and could be harvested for organs. Nozick wants to avoid this, but his justification forces him toward it.
  2.  **The Ad Hoc Exception:** To save Arthur, Nozick must introduce a secondary justification (species/kind) that overrides the primary justification (capacity). This makes the theory unstable. It implies that for "marginal" humans, we are lying about *why* they have rights. We say it's because they are rational agents, but we protect them even when they aren't.
  3.  **The Reverse Exclusion:** Conversely, if a non-human animal (like a dolphin or great ape) *did* demonstrate a robust capacity to steer its life according to an overall conception, Nozick's logic compels us to grant them Kantian rights. While some philosophers welcome this, it destabilizes the "Two-Tier" system Nozick proposes. It suggests the tiers aren't "Human vs. Animal" but "Agent vs. Non-Agent," which would likely shift many animals into the protected tier and many humans out of it, dissolving the clean dichotomy Nozick sought to defend.

  **Conclusion**
  The case of Arthur shows that you cannot have it both ways. If the capacity for life-planning is the *necessary and sufficient* condition for rights, then vulnerable humans lose protection. If vulnerable humans retain protection, then capacity is not the true condition for rights, and the appeal to capacity was a distraction from the reality of species-based privilege. Either way, the "Utilitarianism for Animals, Kantianism for People" scheme fails to rest on a consistent moral foundation.
