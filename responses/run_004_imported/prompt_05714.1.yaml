      3.  Show the Utilitarian Calculation applied to Arthur.
      4.  Show Nozick's potential escape hatches (Kind, Slippery Slope) and why they fail his own criteria.
      5.  Conclude on the instability of the two-tier scheme.

  9.  **Final Review against constraints:**
      *   Specific, concrete case? Yes (Arthur).
      *   Show problems with capacity vs. species? Yes.
      *   Reference Nozick's "overall conception"? Yes.

      *(Wait, one more nuance)*: Nozick actually discusses this briefly. He says we might treat marginal humans as humans because they are *closer* to the threshold or because of the "kind" argument. I need to make sure my critique addresses why *that* move undermines his capacity-based justification. If the justification is Capacity X, and Arthur lacks Capacity X, then saying "But he's human" is an appeal to species, which he said he wasn't doing. If he says "He's the kind that usually has Capacity X," he is admitting the capacity isn't the actual ground, the *kind* is. That's the crux.

