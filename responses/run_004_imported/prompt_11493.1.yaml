answer: |-
  **Subject:** Transcript: Whiteboard Session re: Incident #492 (Checkout Flow Stopping Rule)
  **Participants:** Dr. Aris Thorne (Staff Statistician, Platform Integrity), Dr. Elena Sato (Senior Data Scientist, Modeling)
  **Observer:** You (Backend Engineer)
  **Location:** Conference Room B, 6:30 PM

  **You:** Thanks for staying late, both of I know this incident with the growth team has gotten heated. I need to understand if we need to build hard guards into the platform to prevent "peeking," or if the data scientist who flagged it is being overly theoretical. I've got the log file on the screen. Same data for both of you.

  **Aris:** (Rolling up sleeves) It's not theoretical, it's arithmetic. Look at this sequence. They started with 1,000 users per variant. Checked the p-value. Not significant. Added 500 more. Checked again. Not significant. Added 300 more. *Now* $p < 0.05$. They stopped. They shipped the feature.

  **Elena:** And the conversion rate is up 2.5% with a tight posterior interval. The data says the new checkout is better. Why are we arguing about when they decided to stop looking?

  **Aris:** Because the p-value they're citing—0.048—is a lie. It's mathematically meaningless.

  **Elena:** That's a strong word for a number derived from the same likelihood function I'm using.

  **Aris:** It's not the likelihood I'm worried about; it's the sampling distribution. Elena, you know the definition of a p-value. It's the probability of observing data *this extreme or more extreme* assuming the null hypothesis is true. To calculate that probability, I need to know the set of all possible outcomes that *could* have happened.

  **Elena:** Which is defined by the data you have.

  **Aris:** No. It's defined by the *design*. Imagine a coin flip experiment. Scenario A: I tell you, "I will flip this coin exactly 100 times." You observe 60 heads. Scenario B: I tell you, "I will flip this coin until I get 60 heads." You observe 60 heads, and it happened to take 100 flips.

  **Elena:** In both cases, the data is $n=100, k=60$. The likelihood function is $L(\theta) \propto \theta^{60}(1-\theta)^{40}$. They are proportional. The evidence about the coin's bias is identical.

  **Aris:** The evidence about the *bias* might be identical, but the error rate is not. In Scenario A (Fixed $n$), the distribution is Binomial. To get a p-value, I sum the probabilities of getting 60, 61, ... 100 heads. In Scenario B (Fixed $k$), the distribution is Negative Binomial. The "more extreme" outcomes aren't 61 to 100 heads; they are sequences where it took *fewer* than 100 flips to get 60 heads. The sample space is different. The tail area is different. The p-value is different.

  **Elena:** But why should the sample space of things that *didn't* happen matter? This is the Likelihood Principle. Once the data is in hand, the inference should depend only on what occurred, not on the counterfactuals of what the experimenter intended to do if the data had been different.

  **Aris:** Because frequentist inference isn't about belief; it's about calibration. It's a quality control mechanism. If I let your growth team peek whenever they want, I break the calibration. If the null hypothesis is true—there is no difference—and they check the p-value after every 100 users, they are effectively running hundreds of tests.

  **Elena:** So correct for multiple testing.

  **Aris:** They didn't. And they won't. If you allow optional stopping without correction, the Type I error rate doesn't stay at 5%. It balloons. Simulations show that if you peek continuously and stop at $p < 0.05$, your actual false positive rate can hit 20%, 30%, even higher depending on the peeking frequency. You are shipping features that don't work one out of every three times. That is a tax on the business.

  **Elena:** I agree that shipping false positives is costly. But your solution is to police the experimenter's intentions. You're saying the physical data—the clicks, the purchases—is contaminated by the mental state of the growth manager. That's why we have the replication crisis in psychology. Researchers game the system. They peek, they drop outliers, they add samples until $p < 0.05$. They are following *your* rules, Aris, but exploiting the flexibility of the design.

  **Aris:** They are violating the rules. The rule is: fix $n$ in advance.

  **Elena:** And when they don't, you throw away the data? That seems wasteful. In a Bayesian framework, the stopping rule is irrelevant *provided* the stopping rule doesn't depend on the unobserved data in a way that biases the prior. But here, they just stopped when the posterior probability of improvement crossed a threshold.

  **Aris:** But how did they set that threshold?

  **Elena:** Does it matter? If the posterior says there's a 98% probability the variant is better, I act. If I'm wrong, I update. The beauty of the Bayesian approach is coherence. I don't need to know if they planned to stop at 1,000 users or 10,000. The likelihood function is the same. The posterior is the same. My decision is consistent with my state of knowledge.

  **Aris:** Consistent, yes. Calibrated, no. If I give you a coin that is perfectly fair, and you use a "stop when you're 95% sure it's biased" rule, you will eventually convince yourself it's biased if you flip it long enough. Random walks hit boundaries.

  **Elena:** Not if you use a reasonable prior. If you start with a prior that reflects reality—that most checkout changes are neutral or tiny—you won't be fooled by noise. The prior regularizes the noise.

  **Aris:** Ah, the prior. The get-out-of-jail-free card. "Most changes are neutral." Who decides? If I'm a growth manager incentivized to ship, I choose a skeptical prior? Or an optimistic one? Your framework pushes the subjectivity into the prior and hides it. My framework puts the objectivity in the design. I don't care what you believe; I care that if the null is true, I only reject it 5% of the time in the long run.

  **Elena:** But there is no "long run" for this specific checkout flow. This product launches next week. You're optimizing for a hypothetical infinite sequence of experiments that will never happen. I'm optimizing for the decision *now*, given *this* data. Your "objective" p-value requires me to know the experimenter's private stopping intention. If they forgot to log the intention, your p-value is unknowable. My posterior is computable.

  **Aris:** That's a feature, not a bug. It forces discipline. If you want to peek, fine. Use alpha-spending functions. Pre-register the analysis plan. We can build that into the platform. You set a budget for alpha, and every peek spends some of it.

  **Elena:** And that works? Really? In practice, teams treat pre-registration as paperwork. They register one plan and deviate when they see the data. You're building a system that relies on honesty to enforce objectivity. Meanwhile, you're telling me that if two teams run the exact same code, collect the exact same logs, but one team *thought* about stopping at 5,000 users and the other *thought* about stopping at 10,000, I have to analyze them differently? That violates the strength of evidence principle.

  **Aris:** It violates your principle of evidence, not the principle of error control. Look, Elena, I'm an engineer at heart. I build systems. If I build a bridge, I need to know the load bearing capacity. I don't care about the "degree of belief" the architect has in the steel. I care that if I build 100 bridges, 99 don't collapse. This platform is a bridge. If we let teams peek without penalty, the bridge collapses. We ship junk. Users get frustrated. Revenue dips.

  **Elena:** And if we enforce rigid sample sizes, we miss opportunities. Suppose the effect is huge. The new checkout is 20% better. After 500 users, the signal is screaming. Your frequentist rules say, "Keep collecting data until $N=2000$ to maintain the p-value validity." That's unethical in medicine, and it's expensive in tech. You're forcing users to experience an inferior checkout for the sake of a hypothetical long-run error rate.

  **Aris:** We can do group sequential designs. Check at intervals. Adjust the threshold.

  **Elena:** Which is just an approximation of the Bayesian monitoring process, but with more hoops. You're admitting that monitoring is valuable, but you're wrapping it in frequentist corrections to save the p-value. Why not just model the probability of loss directly? "What is the expected revenue loss if we ship this and it's actually worse?" That's a decision-theoretic question. P-values don't answer that.

  **Aris:** P-values aren't meant to answer decision questions alone. They're a filter. They prevent noise from being interpreted as signal. You talk about "expected loss," but that requires a loss function. Who defines the loss function? Engineering? Product? Finance? Every team will define "loss" differently to suit their OKRs. The p-value is a common currency. 0.05 is a standard. It allows me to compare the validity of a test in Payments with a test in Search.

  **Elena:** A common currency that is widely misunderstood. "P < 0.05" means "I looked at the data enough times to find a pattern," not "This effect is real." You're defending a metric that the people using it don't understand, based on assumptions they violate, to control an error rate they don't experience.

  **Aris:** And you're defending a metric that allows a team to stare at a random walk until it looks like a trend, call it "evidence," and ship it. If we switch to your method, how do I audit them? I can't re-run the stopping rule simulation if the stopping rule is "when Elena felt like it."

  **Elena:** You audit the prior and the sensitivity. You ask: "If we change the prior to be more skeptical, does the conclusion hold?" That's robustness. Your robustness check is asking: "Did you fill out the pre-registration form correctly?"

  **Aris:** (Pauses, looks at the whiteboard covered in Binomial vs. Negative Binomial sums) I'm not saying the form is the truth. I'm saying the constraint is the truth. Without constraints, data is just noise waiting to be pattern-matched.

  **Elena:** And with too many constraints, data is a prison. You prevent false positives, but you guarantee false negatives and slow down learning. The replication crisis wasn't caused by Bayesians. It was caused by people playing p-value poker. They needed to win the hand, so they kept drawing cards until they had a pair of kings. You want to tell them they can't draw more cards. I want to tell them that the value of the hand depends on the cards they're holding, not how many times they drew.

  **Aris:** But the casino knows the odds of drawing those cards. If you don't count the draws, the house loses.

  **Elena:** Then change the game. Don't bet on p-values. Bet on expected value.

  **Aris:** (Sighs) Expected value is an estimate. It has variance. If you ignore the variance in the stopping rule, you underestimate the risk.

  **Elena:** If you ignore the evidence in the data because of the stopping rule, you underestimate the opportunity.

  **(Silence hangs in the room. The log file on the screen still shows $p = 0.048$. The posterior probability of uplift is 97.8%.)**

  **You:** So... do I block the deployment?

  **Aris:** If you want to maintain the integrity of the platform's error guarantees, yes. Or force them to re-run with a fixed sample size adjusted for the peeking.

  **Elena:** Or you let them ship, but you monitor the metric closely post-launch. If it drops, you roll back. That's real-world validation.

  **Aris:** Post-launch validation is confounded. You don't have a control group anymore.

  **Elena:** You have time-series. You have holdouts.

  **Aris:** It's not the same as a randomized control.

  **Elena:** And a randomized control with a violated stopping rule isn't the same as a randomized control.

  **You:** Okay. I hear you. Aris, you're saying the system breaks if we don't enforce discipline. Elena, you're saying the discipline is artificial and ignores the actual evidence.

  **Aris:** I'm saying the math requires a fixed sample space for the p-value to mean what they think it means.

  **Elena:** I'm saying the data is what it is, regardless of the math they chose to describe it.

  **You:** (Closing laptop) I need to think about this. The log isn't going anywhere.

  **Aris:** Just remember, if you ship this, and it's a false positive, the math says it's on you.

  **Elena:** And if you block it, and it's a real win, the math says that's on you too.

  **(They both look at the whiteboard. The Binomial sum and the Likelihood function sit side-by-side, incompatible but describing the same reality.)**
