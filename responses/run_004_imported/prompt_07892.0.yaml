      4.  Not neither/shrug? (Check: No "mystery of the universe".)
      5.  Grieve? (Check: Focus on the pain of the absence.)

      *Let's write.*

      *(Post-Drafting Review)*: The reference to the book needs to be humble. "I tried to read her notes." The incident at Grandma's funeral is crucial for character.

      *Refining the "Fourth Corner" bit:* The prompt says she refused "neither" if it was just a shrug. So the eulogy must affirm that the *tension* is real. The grief is the tension.

