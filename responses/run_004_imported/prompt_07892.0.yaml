prompt: |-
  My aunt died two weeks ago, and I'm giving her eulogy at the funeral this Saturday. I want to get it right, and it's turning out to be harder than I expected. She wasn't an academic — she worked thirty-one years as a courtroom stenographer — but after a heart attack in her early sixties she started sitting with a small Buddhist meditation group, and somewhere in there she fell hard for a second-century Indian philosopher named Nāgārjuna. What got her wasn't the meditation so much as his logic: the "tetralemma," the idea that of any four positions you could take on a serious question — that something is the case, that it isn't, that it's both, that it's neither — none of the four actually survives once you look closely at what it would take for it to be true. She used this on everything, but especially, in the last few years, on herself. She would not let anyone say she'd be reborn, or that she'd be watching over us — that was the first corner. She would not let anyone say she'd simply be gone and that's that — the second. She'd cut off "well, maybe both, in some sense" just as fast — the third. And she was the strictest person I've ever known about the fourth: she always said that "neither is true, the question doesn't even apply" is a real position, hard to earn, and not just a polite way of shrugging and saying nobody can know. Two years ago, at my grandmother's funeral, she actually stood up mid-sermon and did this to the priest, gently, over some line about a better place — it's a story the family still tells on her.

  I'm not a philosopher, and neither is almost anyone else who'll be in that room — but four or five people from her meditation group will be, and they will know if I fake it. I've spent the last few nights with her copy of the Mulamadhyamakakarika (I have no idea if I'm even saying that right), which she annotated so heavily you can barely find the original text under her handwriting, trying to actually understand this instead of just repeating phrases I half-remember from Sunday dinners. Here is my problem, and I'd like you to solve it by writing the eulogy itself, about five minutes long as delivered: I can't have her survive her death, I can't have her simply end, I can't hedge with "both," and I can't take refuge in "neither" if all that means is "who's to say" — she would have called that a fifth corner, cheating dressed up as humility, since even "it's all empty, so none of this matters" was a comfort she refused herself. What I need from you is something that still sounds like a eulogy and not a logic seminar — something that will let a room full of people who loved her, and who are not going to follow an argument, actually grieve by the end of it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Niece/Nephew of the deceased.
      *   **Deceased:** Aunt, worked 31 years as a courtroom stenographer, late-life interest in Buddhism (specifically Nāgārjuna and the *tetralemma* or *catuṣkoṭi*).
      *   **Key Philosophical Constraint:** The eulogy must honor her specific view on death/existence without violating the *tetralemma* (not existing, not non-existing, not both, not neither). It cannot be a comfort in the traditional sense (no "she's in a better place," no "she's gone forever," no "mystery," no "emptiness means nothing matters").
      *   **Audience:** Mixed. Family/friends (non-philosophers) + a small group from her meditation circle (who know the philosophy).
      *   **Tone:** Emotional, accessible (not a logic seminar), respectful, grieving, yet intellectually honest to her memory.
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).
      *   **Goal:** Allow the room to grieve while staying true to her rigorous philosophical stance.

  2.  **Deconstruct the Philosophical Challenge:**
      *   The *tetralemma* (four corners) regarding her existence after death:
          1.  She exists (reborn/watching). -> *Rejected.*
          2.  She does not exist (annihilation). -> *Rejected.*
          3.  Both. -> *Rejected.*
          4.  Neither (question doesn't apply). -> *Rejected (if used as a shrug).*
      *   The Aunt's specific twist: She refused to use the fourth corner as a comfort or a cop-out ("who's to say"). She demanded rigor.
      *   *The Solution:* The eulogy shouldn't try to *solve* the puzzle of where she is. Instead, it should focus on the *impact* of her presence while she was here, and how that presence transforms the grief itself. The "truth" isn't a statement about her status, but about the relationship and the memory. It needs to validate the pain of loss without positing a metaphysical destination for the deceased.
      *   *Key Insight:* Nāgārjuna's philosophy is about *emptiness* (śūnyatā), which isn't nothingness, but interdependence. She exists *in* the grief, *in* the memory, *in* the stenography records, *in* the stories. Not as a ghost, not as a closed book, but as a condition of the current moment.
      *   *Stenography Angle:* She recorded truth without altering it. She captured words. Now the words remain, but the voice is silent. This parallels the philosophy.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Mention her job (stenographer) to ground her in reality. Establish her character (precise, rigorous).
      *   **The Philosophy (Light Touch):** Introduce her interest in Nāgārjuna without jargon overload. Use the "four corners" idea but translate it into emotional terms. Mention the incident at Grandma's funeral (it shows her character).
      *   **The Core Conflict:** Address the elephant in the room. We want to say she's "gone" or "watching." She wouldn't allow it.
      *   **The Resolution (The "Fifth Corner" avoidance):** How do we grieve if we can't place her? We grieve the *shape* she left. We acknowledge that the question "where is she?" is the wrong question, but the *pain* of asking it is real.
      *   **Closing:** Bring it back to love and memory. Not as a possession, but as an influence. A call to live with the same rigor and honesty.

  4.  **Refining the Tone:**
      *   *Avoid:* "She is one with the universe" (too woo-woo). "She is gone" (too final). "We will never know" (too agnostic/cop-out).
      *   *Include:* Specific details (the annotated book, the stenography machine, the funeral incident).
      *   *Voice:* Intimate, slightly vulnerable (admitting confusion), but steady.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My aunt was a stenographer. She liked logic. She liked Nagarjuna. He said you can't say things exist or don't exist. She applied this to death. At Grandma's funeral, she corrected the priest. I read her book. It's hard. I can't say she's here. I can't say she's gone. So where is she? She is in us. Not spiritually, but in how we act. Let's honor her by being honest.

      *Critique 1:* Too dry. Needs more emotion. The transition from stenography to philosophy needs to be smoother. The ending needs to land harder on grief.

  6.  **Drafting - Iteration 2 (Focusing on the "Stenographer of Truth"):**
      She spent 31 years writing down exactly what was said. No more, no less. Then she studied Nāgārjuna. He questioned what "what was said" actually means. She didn't use philosophy to escape death. She used it to face it. I can't tell you she's in a better place. I can't tell you she's nothing now. I can tell you I miss her. The silence she left is loud.

      *Critique 2:* Better. Need to make sure the "four corners" are acknowledged but not lectured. The meditation group needs to nod, the family needs to cry.

  7.  **Final Polish (incorporating the prompt's specific constraints):**
      *   Make sure the pronunciation of *Mulamadhyamakakarika* isn't required (don't put it in the spoken text, maybe refer to "her book").
      *   Ensure the "fifth corner" (shrugging) is explicitly avoided.
      *   Ensure the grief is validated.

      *(Self-Correction during drafting)*: I need to be careful not to make the eulogy *about* the philosophy. It must be about *her*. The philosophy is the lens, not the subject. The emotional core is the *absence* that refuses to be defined.

      *Key Phrase Idea:* "She taught us that some questions aren't meant to be answered, but they are meant to be asked." -> No, she hated the shrug. Better: "She taught us that the question itself changes us."
      *Better Idea:* Focus on the *stenographer* aspect. She captured the record. Now the record is complete, but the meaning is open.
      *Best Idea:* The grief *is* the proof of the connection. We don't need to locate her to feel the loss.

  8.  **Writing the Eulogy (incorporating the above):**
      *   Start with the stenography. Precision.
      *   Move to the meditation. Rigor.
      *   Address the "Where is she?" question directly.
      *   Use the four corners implicitly.
