  **Justifications for Least Obvious Placements**

  **1. Simulated Oracle (Least Vulnerable)**
  It may seem counterintuitive to rank a statistical model as less vulnerable than a human lottery, given that models can encode bias. However, Estlund's objection specifically targets *publicly defended tests of competence administered to citizens* that filter based on privilege. The oracle bypasses citizen screening entirely; it infers preferences rather than selecting rulers based on prior status or exam performance. Because it employs no competence test to grant or weight political power among actual people, it sidesteps the mechanism by which literacy tests and credentials track demographic privilege.

  **2. Plural Voting (Less Vulnerable than Veto Council)**
  Both proposals rely on contested metrics (exams or credentials) to distribute power, making their relative ranking debatable. Plural voting is less vulnerable because it preserves universal suffrage as a baseline; every citizen retains one vote, so the biased metric only affects *marginal* influence rather than basic inclusion. In contrast, a veto council concentrates *decisive* negative power in a small group selected exclusively by those metrics. If the selection criteria track privilege, the council becomes a homogenous elite capable of nullifying the democratic will, whereas plural voting merely skews it while maintaining universal participation.
