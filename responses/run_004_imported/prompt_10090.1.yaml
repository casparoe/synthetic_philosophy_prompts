prompt: |-
  A friend and I spent much of last night arguing about epistocracy, and we kept talking past one another because we were treating it as a single, monolithic proposal rather than a family of quite different institutional designs. My friend's central objection, which traces back to David Estlund, was that any test of political competence we could actually write down and publicly defend would end up tracking race, class, gender, and educational privilege rather than genuine political wisdom — much as literacy tests and poll taxes once did while posing as neutral competence filters. I agreed the worry is serious, but argued that it does not bite equally hard on every epistocratic proposal, since some of them do not rely on any explicit, independently defined competence test at all.

  To help me make that case properly, please rank the following five epistocratic proposals from *least* to *most* vulnerable to this objection, and briefly justify whichever two placements strike you as least obvious.

  1. Restricted suffrage — citizens must pass a competence exam to gain the right to vote at all.
  2. Plural voting — everyone may vote, but citizens who pass a competence exam or hold certain credentials receive additional votes.
  3. An epistocratic veto council — a small body of vetted experts may strike down legislation passed by an ordinarily elected legislature, but cannot itself propose or enact law.
  4. An enfranchisement lottery — a random sample of the population is selected, given an intensive briefing on the issues at stake, and this sample alone votes on behalf of everyone else.
  5. Government by simulated oracle — no one actually votes; policy is instead set by statistically modeling the "fully informed" preferences citizens would hold and implementing those directly.

  Please give your ranking as a JSON list of short labels, ordered from least to most vulnerable, formatted like this:

  ```json
  ["...", "...", "...", "...", "..."]
  ```
