prompt: |-
  I'm on the methods-reform committee for a psychology journal, and we're finally rewriting our stats policy after years of replication-crisis hand-wringing. Half the committee wants to stay frequentist but tighten the threshold to p < .005 and mandate preregistration; the other half wants to ditch null-hypothesis significance testing entirely for Bayes factors and credible intervals, arguing NHST is rotten at the root. One member keeps pointing out that Bayesian updating isn't supposed to care about optional stopping or how many tests you ran, so preregistration is basically a patch for a disease Bayesians don't even catch -- but nobody's checked whether that holds up once you factor in how much wiggle room there is in picking priors and models. I need to send our decision out by friday. Draft the memo: recommend an actual policy rather then splitting the difference, and take the strongest objection to whatever we land on seriously instead of hand-waving past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the methods-reform committee for a psychology journal.
      *   **Task:** Draft a memo recommending a new statistics policy.
      *   **Context:** Years of "replication-crisis hand-wringing."
      *   **Conflict:**
          *   Group A: Stay Frequentist, tighten threshold ($p < .005$), mandate preregistration.
          *   Group B: Ditch NHST for Bayes Factors (BF) and Credible Intervals (CrI), arguing NHST is fundamentally flawed.
          *   Dissenting Voice (Group C/Individual): Points out that while Bayesian updating is theoretically immune to optional stopping, prior/model specification introduces new "wiggle room," making preregistration potentially relevant even for Bayesians (a point often overlooked).
      *   **Constraint:** Do *not* split the difference (no "authors may choose" or "report both"). Pick a lane.
      *   **Requirement:** Take the strongest objection to the chosen policy seriously (no hand-waving).
      *   **Deadline:** Friday (implies urgency and decisiveness).

  2.  **Evaluate the Options:**

      *   *Option 1: Stricter Frequentism ($p < .005$ + Preregistration).*
          *   *Pros:* Familiar to most authors, addresses $p$-hacking directly via preregistration, easier to enforce technically.
          *   *Cons:* Doesn't solve the interpretation problem (p-values are still misunderstood), arbitrary threshold shifting (from .05 to .005) is still dichotomous thinking, power issues (requires larger N).
          *   *Verdict:* Feels like tinkering with a broken engine rather than replacing it. The prompt implies a desire for *reform*, not just tightening screws.

      *   *Option 2: Full Bayesian (BF + CrI).*
          *   *Pros:* Directly quantifies evidence for hypotheses, handles optional stopping theoretically, provides richer inference (distributions vs. binaries).
          *   *Cons:* Steep learning curve, computational complexity, *subjectivity of priors* (the strongest objection noted in the prompt).
          *   *Verdict:* This is the more transformative path. It aligns better with the "replication crisis" root causes (misinterpretation of evidence). However, the objection about priors and model flexibility is crucial.

      *   *Option 3: Estimation Focus (Effect Sizes + CIs, no NHST).*
          *   *Pros:* Focuses on magnitude and precision.
          *   *Cons:* Still often frequentist, doesn't fully address hypothesis testing needs.
          *   *Verdict:* Good, but maybe less distinct from the current status quo than a Bayesian shift.

      *   *Decision:* The prompt highlights the specific tension regarding Bayesian immunity to optional stopping vs. prior flexibility. This suggests the memo should lean into the **Bayesian** recommendation but rigorously address the **prior specification/preregistration** objection. It's the more intellectually honest and forward-looking stance, fitting a "methods-reform committee." Simply tightening p-values feels like the "status quo plus" option which the prompt seems to discourage ("replication-crisis hand-wringing").

  3.  **Drafting Strategy:**
      *   **Tone:** Professional, decisive, authoritative, yet nuanced. Not academic jargon-heavy, but precise.
      *   **Structure:**
          1.  Header (To, From, Date, Subject).
          2.  Executive Summary (The Decision).
          3.  Rationale (Why this path?).
          4.  The Policy Details (What authors must do).
          5.  Addressing the Objection (The "Prior Flexibility" problem).
          6.  Implementation Timeline.
      *   **Key Argument:** We are moving to Bayesian estimation/testing *because* it solves the inference problem, *but* we are keeping preregistration *not* because of stopping rules, but because of *analytic degrees of freedom in prior/model specification*. This validates the dissenting member's point without reverting to NHST.

  4.  **Developing the Content - Section by Section:**

      *   *Subject:* Needs to be clear. "New Statistical Guidelines."
      *   *The Decision:* Adopt Bayesian methods (BF + CrI) as primary. NHST allowed only as secondary/supplementary.
      *   *The Rationale:* NHST encourages binary thinking. Bayes offers continuous evidence.
      *   *The Objection (Crucial Step):* The dissenting member is right. Bayes isn't magic. If you tweak priors until you get a BF > 3, that's "p-hacking with priors."
      *   *The Solution:* Preregistration remains mandatory. Why? To lock down *priors and models*, not just sample size. Sensitivity analyses are required to show robustness across reasonable priors.
      *   *Why not split the difference?* Reporting both confuses readers and allows authors to "shop" for the significant result. We need a culture shift.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest $p < .005$ is safer.
      *   *Correction:* No, the prompt asks to take the objection seriously. The objection is about *wiggle room*. Priors have more wiggle room than alpha levels. So if we go Bayesian, we need *stricter* preregistration of analysis plans, not less.
      *   *Nuance:* Acknowledge that Bayesian updating is mathematically immune to stopping rules, *but* human behavior is not immune to tuning parameters.
      *   *Policy:* Mandate default priors or strong justification for informed priors. Require sensitivity analysis.

  6.  **Final Polish:**
      *   Ensure the tone isn't condescending to the Frequentist camp but firm on the decision.
      *   Make sure the "Strongest Objection" section is the highlight, as requested.
      *   Check constraints: No splitting the difference. Deadline mentioned (Friday).

  7.  **Final Review against Prompt:**
      *   Recommend actual policy? Yes (Bayesian focus).
      *   Not splitting the difference? Yes (Primary vs. Secondary).
      *   Take strongest objection seriously? Yes (Prior flexibility/Preregistration necessity).
      *   Context (Psych journal, replication crisis)? Yes.

