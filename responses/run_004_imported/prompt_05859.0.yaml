  Let's write it.

  *Header:* Standard Memo format.
  *Opening:* State the decision clearly.
  *Body:* Explain the "Why."
  *The Pivot:* Address the dissent. The dissent is right about priors. So we keep preregistration.
  *Closing:* Implementation.

  *Wait, one more check:* The prompt says "One member keeps pointing out that Bayesian updating isn't supposed to care about optional stopping... but nobody's checked whether that holds up once you factor in how much wiggle room there is in picking priors and models."
