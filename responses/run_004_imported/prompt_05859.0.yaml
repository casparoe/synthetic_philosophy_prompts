answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board and Methods-Reform Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** DECISION: New Statistical Guidelines and Reporting Standards

  **Executive Summary**

  After reviewing the proposals to either tighten frequentist thresholds ($p < .005$) or transition to Bayesian inference, this committee recommends a decisive shift: **Effective January 1, 2025, this journal will adopt Bayesian estimation and hypothesis testing as the primary standard for quantitative submissions.**

  Null Hypothesis Significance Testing (NHST) will no longer be accepted as the primary basis for inference. We are not splitting the difference. Authors may not report both $p$-values and Bayes Factors to "cover their bases." We are moving the journal toward a framework that quantifies evidence rather than rejecting nulls.

  However, this transition comes with a critical caveat regarding preregistration. While we are abandoning NHST, **we are retaining and strengthening mandatory preregistration.** This decision directly addresses the strongest objection raised during our deliberations regarding prior flexibility.

  **Rationale for Adopting Bayesian Methods**

  The replication crisis in psychology is fundamentally a crisis of inference. NHST forces a binary decision (significant/non-significant) based on the probability of the data given a null hypothesis ($p(D|H_0)$), which is not what researchers actually want to know (the probability of the hypothesis given the data).

  1.  **Evidence, not Decisions:** Bayes Factors ($BF_{10}$) allow authors to distinguish between "evidence for the null" and "absence of evidence," a distinction $p$-values cannot make.
  2.  **Uncertainty Quantification:** Credible Intervals (CrI) provide a direct probabilistic interpretation of parameter uncertainty, superior to frequentist Confidence Intervals for our interpretive needs.
  3.  **Optional Stopping:** Theoretically, Bayesian updating is immune to optional stopping rules. This allows for more flexible, efficient data collection without inflating Type I error rates in the frequentist sense.

  **Addressing the Primary Objection: The "Prior Wiggle Room" Problem**

  During our deliberations, a critical objection was raised: *If Bayesian updating is immune to stopping rules, is preregistration still necessary? Or does the subjectivity of prior specification introduce a new avenue for researcher degrees of freedom?*

  We accept this objection as valid. While the *mathematics* of Bayesian updating are immune to stopping intentions, the *practice* of Bayesian analysis is vulnerable to "prior hacking." If a researcher can test multiple priors until one yields a $BF > 3$, the theoretical advantages of the Bayesian framework collapse. The "wiggle room" shifts from sample size determination to prior specification and model structure.

  Therefore, our policy treats preregistration not as a fix for $p$-hacking, but as a fix for **prior-hacking.**

  **New Policy Requirements**

  To mitigate the risk of subjective prior selection undermining our standards, the following are mandatory for all empirical submissions:

  1.  **Preregistration of Priors and Models:** Authors must specify their prior distributions and model structures in a preregistered analysis plan (e.g., OSF) before data collection begins. Changing priors post-hoc requires explicit justification and must be flagged as exploratory.
  2.  **Default vs. Informed Priors:** Authors using default priors (e.g., Cauchy(0, 0.707)) must cite the standard. Authors using informed priors must provide a robust justification for the prior's source (e.g., meta-analytic data from previous studies).
  3.  **Sensitivity Analysis:** All submissions must include a sensitivity analysis demonstrating that the conclusions hold across a reasonable range of prior specifications. If the inference flips from "anecdotal" to "strong" based on minor prior tweaks, the finding will be deemed inconclusive.
  4.  **No NHST Substitution:** $p$-values cannot be reported as a substitute for Bayes Factors. If a Bayesian analysis is inconclusive ($BF \approx 1$), a significant $p$-value will not rescue the claim.

  **Implementation and Support**

  We recognize this raises the barrier to entry. To support this transition:
  *   The journal will commission a series of methodological primers on specifying priors in common psychological models.
  *   Reviewers will be trained to evaluate prior justification rather than checking for $p < .05$.
  *   A 12-month grace period will apply for current submissions in the pipeline, provided authors commit to the new standards for revisions.

  **Conclusion**

  Tightening the $p$-value threshold to .005 would reduce false positives but retain a flawed logic of inference. Moving to Bayesian methods without strict prior preregistration would simply trade one form of flexibility for another.

  By adopting Bayesian inference *alongside* rigorous preregistration of analytic choices, we acknowledge that no statistical framework is immune to human ingenuity in finding positive results. We are choosing the framework that best answers our scientific questions, while keeping the safeguards necessary to ensure those answers are honest.

  Please prepare the author guidelines for update by Friday.

