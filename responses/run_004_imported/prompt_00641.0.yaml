answer: |-
  This is a fantastic question, and you are right to feel that there is a logical argument buried under all that Victorian drama. Ruskin isn't just being moody; he is actually laying the groundwork for modern conservation theory.

  Your friend's argument (that a perfect rebuild *is* the building) relies on the idea that a building is just **information** (the design, the shape, the look). Ruskin's argument is that a building is **matter + time + human action**.

  Here is a breakdown of what Ruskin is actually claiming, why the "half inch" matters, and how you can use this to debate your friend.

  ### 1. The "Spirit of the Workman" isn't just poetry; it's about *Indexicality*.
  When Ruskin talks about the "spirit given by the hand and eye of the workman," he is describing what philosophers and art historians call **indexicality**.

  Think of a fingerprint. A fingerprint proves a specific person touched a specific object at a specific time. You can draw a perfect picture of a fingerprint, but the drawing is not *evidence* that the person was there.
  *   **Ruskin's Point:** The chisel marks on a stone cathedral are the "fingerprints" of the medieval mason. They prove that a human being stood there in 1250 and made a choice.
  *   **The Logic:** If you rebuild the cathedral in 2024, even if you use the exact same tools, you are a different human in a different cultural moment. You are mimicking their actions, not performing them. Therefore, the object is no longer a record of *their* labor; it is a record of *your* labor pretending to be theirs.
  *   **Against your friend:** A perfect rebuild preserves the **design**, but it destroys the **evidence of labor**. It turns a historical document into a stage set.

  ### 2. The "Worn Half Inch" is Data, not Damage.
  This is the strongest logical point in the excerpt. Ruskin asks: *"What copying can there be of surfaces that have been worn half an inch down?"*

  To Ruskin, erosion isn't damage to be fixed; it is **physical proof of duration**.
  *   **The Logic:** That missing half-inch of stone proves the building survived the rain, wind, and pollution of 600 years. It is a physical measurement of time.
  *   **The Problem with Restoration:** If you carve a new stone to fit that gap, it is smooth. If you artificially distress it to look worn, you are lying (which leads to his next point). If you leave it smooth, you have erased the physical evidence that the building is old.
  *   **Against your friend:** Your friend says nothing is lost except a "feeling." Ruskin would say **physical data is lost.** The new stone has not been tested by time. It hasn't "suffered" the history the old stone did. A building that hasn't weathered a storm isn't the same as a building that has.

  ### 3. The Ethical Argument: "The Thing is a Lie."
  Ruskin calls restoration a "Lie from beginning to end." This is an ethical argument, not just an aesthetic one.
  *   **The Logic:** When you look at the Parthenon or Notre Dame, you are entering a contract with history. You expect that what you are seeing is the actual object that witnessed the past.
  *   **The Deception:** If restorers rebuild a destroyed section to look exactly like the original, they are deceiving the viewer. They are asking you to believe you are looking at the 13th century when you are actually looking at the 21st century.
  *   **The Corpse Analogy:** This is why he compares it to a corpse. If you prop up a skeleton and dress it in clothes, it *looks* like the person, but it is not the person. It is a model. Ruskin argues we should treat old buildings like honored dead, not like dolls we can fix up.

  ### 4. Does this apply to Art Forgeries?
  **Yes, absolutely.** Ruskin's logic is the exact same logic used to explain why a perfect forgery of a Van Gogh is worthless compared to the real thing.
  *   **The Forgery:** Has the correct colors, brushstrokes, and canvas. It has the **visual information**.
  *   **The Original:** Has the visual information **PLUS** the provenance. It is the actual object the artist touched. It carries the historical weight of its own survival.
  *   **The Connection:** A rebuilt Notre Dame is essentially a "architectural forgery." It looks like the old one, but it lacks the *provenance of material*.

  ### Summary: How to argue against your friend
  If your friend says, "A stone-for-stone rebuild is the same building," here is your counter-argument based on Ruskin:

  1.  **Identity vs. Information:** "You're arguing that the building is just the *design* (the information). Ruskin argues the building is the *artifact* (the specific matter). If I burn your diary and write a perfect copy from memory, it contains the same words, but it's not the same diary. The physical object has a history the copy doesn't."
  2.  **The Time Factor:** "The 'worn half inch' proves the building existed through time. New stone hasn't lived through history. A building that hasn't aged isn't a historic building; it's a replica."
  3.  **The Truth Claim:** "Restoration deceives the viewer. It pretends to be old when it is new. Ruskin believes it's more honest to have a ruin than a fake."

  ### The Notre Dame Context
  This is why the Notre Dame restoration is so controversial among art historians.
  *   **The Viollet-le-Duc Approach (19th Century):** They added a spire that never existed before because they thought it "looked right." Ruskin hated this guy.
  *   **The 2024 Restoration:** They used modern technology (like digital scans) to rebuild the roof exactly as it was.
  *   **Ruskin's Verdict:** He would say the 2024 Notre Dame is a "model of a corpse." It looks magnificent, but the wood that burned was the actual wood that creaked during the French Revolution. The new wood is just... new wood.

  **TL;DR:** Ruskin isn't saying old stuff is magic. He is saying that **history is physical.** You cannot rebuild history; you can only build a simulation of it. Once the original material is gone, the "truth" of the object is gone with it.
