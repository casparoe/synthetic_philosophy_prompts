answer: |-
  This is a classic conflict in political philosophy and property law, and you've hit on a tension that cities and housing advocates are grappling with all over the world. You aren't just arguing about condo bylaws; you're arguing about the definition of **community** and **citizenship** on a micro scale.

  To answer your specific question: **No, the line is not arbitrary, but it is contested.** There are two distinct, principled frameworks clashing here. Neither is objectively "true," but they prioritize different values.

  Here is how to break down the principles behind both sides of your argument.

  ### 1. The Property Rights Framework (Your Friend's View)
  Your friend is arguing from the perspective of **ownership as membership**. In this view, a condo association is less like a government and more like a corporation.

  *   **Financial Risk:** Owners hold the equity. If the building deteriorates, or if special assessments are levied to fix the roof, the owners pay. Renters can simply move when the lease is up. The principle here is that **financial liability dictates control.**
  *   **Contractual Consent:** The argument is that renters enter a voluntary contract (the lease) knowing the rules. If the HOA changes the rules, the owner is responsible for ensuring the tenant complies. If the tenant doesn't like it, the remedy is to break the lease or not renew.
  *   **Asset Protection:** Owners are often viewed as the long-term stewards of the building. Renters are transient. Therefore, the people with the permanent stake should decide the permanent rules.

  **Where this principle struggles:** It assumes all owners are equally "invested" in the daily life of the building. As you noted, an absentee investor who Airbnbs a unit has financial skin in the game but zero experiential skin in the game. They can vote on noise rules they never have to hear.

  ### 2. The Affected Interests Framework (Your View)
  You are arguing from the perspective of **residency as membership**. This aligns with a concept in democratic theory called the **"All Affected Interests" (AAI) principle.**

  *   **Impact on Liberty:** If a rule restricts your behavior (noise, guests, quiet hours) or degrades your quality of life (short-term rentals creating a revolving door of strangers), your liberty is impacted. The principle here is that **those subject to the coercion should have a say in it.**
  *   **Stability and Community:** Long-term renters often contribute more to the "neighborliness" of a building than absentee landlords. Excluding them creates a two-tiered class system within the same physical space, which can erode community cohesion.
  *   **The "Taxation Without Representation" Analogy:** Renters pay rent, which covers the owner's mortgage and HOA fees. In a sense, they are funding the building's operations without having a voice in its governance.

  **Where this principle struggles:** It can be hard to define the cutoff. Does a guest staying for a week get a vote? Does a renter on a month-to-month lease get the same weight as an owner who has lived there for 20 years? Implementing this requires defining "sufficient stake."

  ### Is the Line Arbitrary?
  The line isn't arbitrary, but it is **increasingly seen as misaligned with modern housing realities.**

  Historically, condo laws were written when the assumption was: *Owner = Resident.* The legal structure was built on the idea that the person on the deed is the person sleeping in the bed.

  That assumption has broken down. When you have:
  1.  **Absentee Owners:** Who vote on rules they don't experience.
  2.  **Long-Term Renters:** Who experience the rules but can't vote.
  3.  **Short-Term Rentals:** Which maximize owner profit but degrade renter quality of life.

  ...the "Property Rights" framework begins to look less like "protecting investment" and more like "outsourcing governance to people who don't live there."

  ### How Other Jurisdictions Handle It
  Because this is a recognized ethical and legal friction point, some places are trying to find a principled middle ground:

  *   **Renter Representation:** Some cities require condo boards to include a non-voting renter representative to ensure tenant concerns are heard during discussions, even if they can't vote on the final measure.
  *   **Owner-Occupancy Requirements:** Some HOAs restrict the ability to rent out units entirely, forcing the voter to be the resident. This aligns the "financial stake" with the "lived experience."
  *   **Lease Assignment:** In some cases, owners can assign their voting rights to their long-term tenants via a proxy, though this is rare.

  ### The Verdict
  Your friend is right on **legal contract theory**: You signed a lease that acknowledges the HOA's authority.
  You are right on **political morality**: Rules that govern daily life generally derive legitimacy from the consent of the governed, not just the deed holders.

  The friction you feel isn't because one of you is failing to understand the other; it's because **the legal structure of condos hasn't caught up to the economic reality of housing.**

  If you want to resolve the argument (or at least understand the stalemate), you can acknowledge that your friend is talking about *property law* (who owns the asset), while you are talking about *governance* (who lives in the community). Both are valid principles, but in a building full of renters and investors, the property law principle creates a democratic deficit.

  **Principled conclusion:** The line shouldn't be arbitrary, but currently, it is drawn at "wealth/ownership" rather than "residency/impact." Whether that is *just* depends on whether you view a condo association as a business corporation (favoring your friend) or a mini-government (favoring you). Given that they regulate noise, guests, and daily conduct, the "mini-government" argument is increasingly hard to dismiss.
