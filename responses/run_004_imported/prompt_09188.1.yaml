prompt: |-
  Got into it with my friend last night about my apartment building. It's a condo building where a lot of residents are renters, not owners, and some units are owned by investors who don't even live here and just Airbnb them out. There's a vote coming up on new noise and short-term-rental rules, but only owners get to vote — renters, even ones who've been here for years and will actually have to live under whatever passes, get zero say. My friend thinks that's fine since renters knew the rules could change and can just move if they don't like it. I think if a rule's gonna control your daily life you should get some say, no matter whats on the deed. We argued for an hour and got nowhere. Is there an actual principled way to work out whose interests should count in a vote like this, or is that line always going to be kind of arbitrary?
