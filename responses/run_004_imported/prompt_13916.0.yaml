      *   *Berkeley on Money:* *The Querist* (1730s). Ireland was poor, lacked specie. Argues money is a ticket/token to stimulate industry. Value comes from circulation and the labor/industry it commands. Paper money is fine. Connects to his metaphysics? *Esse est percipi* (to be is to be perceived). Maybe money's value is in its *use/function* (perceived utility) rather than hidden substance.
      *   *Connection (a):* Locke's realism about substance mirrors his metallism. Berkeley's instrumentalism/immaterialism mirrors his functional view of money.
      *   *Connection (b):* Locke opposed devaluation (supported recoinage at old standard), causing deflation/recession. Berkeley wanted credit expansion to wake up idle Irish labor.
      *   *Connection (c):* Chartalism (Knapp, Keynes, Lerner, MMT): Money is a creature of the state/tax obligation. Berkeley focuses on "industry" and "tickets." Is it state theory or velocity theory? It's close but not identical.
      *   *Connection (d):* Who wins? Modern fiat money supports Berkeley's functional view, but Locke's concern about inflation/trust is valid. However, Locke's strict metallism is historically discredited. Berkeley's focus on real output is more modern.

  3.  **Drafting Section (a): Metaphysics and Epistemology:**
      *   *Locke:* Needs to link *Essay Concerning Human Understanding* to money. Locke distinguishes between nominal essence (name) and real essence (constitution of substance). For money, he treats silver as having a "real" value that the denomination *must* track. If you change the name without changing the silver, you violate the "real essence" of the contract. It's a representational theory of money mirroring his representational theory of ideas (ideas stand for things).
      *   *Berkeley:* Immaterialism. There is no "substance" behind the perception. Similarly, there is no "value" hidden inside the gold coin. Value is in the *relation* and the *effect*. Money is a sign. In *Alciphron* and *The Querist*, he treats language and money similarly—as signs that trigger action, not necessarily referring to ontological realities. The "truth" of money is in its efficacy (stimulating industry), not its material composition.
      *   *Synthesis:* Locke seeks a fixed anchor (substance/silver) to ground knowledge and contracts. Berkeley seeks a functional utility (perception/industry) to ground meaning and wealth.

  4.  **Drafting Section (b): Policy, Debasement, and Contracts:**
      *   *Locke:* The 1690s Recoinage. Lowndes wanted to devalue (raise the nominal value of silver to match market). Locke said no. A pound is a fixed weight. Changing it breaks contracts (creditors lose, debtors gain). Result: Great Recoinage was expensive and caused deflation/crunch. Locke prioritizes the sanctity of existing contracts and the "inviolability" of the standard.
      *   *Berkeley:* Ireland 1730s. No silver. Economy stagnant. *The Querist*: "Whether a nation can be rich without gold and silver?" Yes. Money is a counter. If you issue paper, you mobilize idle hands. Inflation risk? Only if you issue beyond the capacity of industry to produce. He isn't worried about the *token* losing intrinsic value, but the *token* failing to command labor.
      *   *Contrast:* Locke is static/protective of creditors. Berkeley is dynamic/developmental for the nation.

  5.  **Drafting Section (c): Berkeley and Chartalism/MMT:**
      *   *Chartalism:* Money is a state creation, driven by tax liability.
      *   *Berkeley:* Focuses on "tickets" and "industry." He does mention the sovereign's stamp, but his emphasis is more on the *velocity* and the *real economy* (labor) than the *tax drive*.
      *   *Assessment:* It's a "proto-functional" view. It anticipates the idea that money is a social technology, not a commodity. But calling it full MMT is anachronistic because he lacks the specific mechanism of tax-driven money. It's better to call it a "real bills" or "velocity" anticipation. However, the *spirit* is anti-metallist.
      *   *Verdict:* Superficial resemblance in the "state/token" aspect, but deeper resonance in the "money as a measure of account/claim on output" aspect.

  6.  **Drafting Section (d): Who Holds Up Better?**
      *   *Constraint:* Must take a stance.
      *   *Argument:* Berkeley wins.
      *   *Reasoning:* We live in a fiat world. Locke's "intrinsic value" is a category error in modern economics. Value is subjective/relational. However, Locke's insight on *trust* and *inflation* is the caveat. But structurally, Berkeley is right: money is a social institution facilitating exchange, not a commodity to be hoarded. Locke's policy caused a recession; Berkeley's logic underpins central banking.
      *   *Nuance:* Acknowledge Locke's moral point about contracts, but reject his economic mechanism.

  7.  **Review and Refine:**
