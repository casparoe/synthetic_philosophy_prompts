          *   (b) Explain implications for debasement, inflation, contract stability, and concrete policy disputes (Berkeley's Irish context vs. Locke's 1690s recoinage).
          *   (c) Assess the anachronism of linking Berkeley to Chartalism/MMT.
          *   (d) Evaluate which position holds up better given modern monetary history/theory (take a stance, don't hedge).
      *   **Tone:** Deep, scholarly, nuanced, avoiding the "nominalist vs. metallist" gloss.

  2.  **Initial Brainstorming & Fact-Checking:**
