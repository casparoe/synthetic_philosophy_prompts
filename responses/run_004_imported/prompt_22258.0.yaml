      *   *Analytic Connection:* This distinguishes between *survival* (persistence of psychological/biographical identity) and *continuity* (persistence of physical substrate). The text argues for continuity of substrate to undermine the desire for survival of identity. The "rat's liver" isn't *you* surviving; it's *your stuff* being reused. The point is to show that *you* don't matter, only the transformation matters.
      *   *Conclusion:* It commits to a metaphysics of Qi transformation, but denies personal identity survival. It uses the shocking imagery to break the attachment to the *current configuration*.

