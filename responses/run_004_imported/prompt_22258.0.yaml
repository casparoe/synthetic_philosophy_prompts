      *   *Episode 1 (Dze-yü):* Deformed body. Accepts it. Proposes transformations: Left arm -> cock (watch night), Right arm -> crossbow (get food), Rump -> wheel, Spirit -> horse (ride it). Key argument: "When we have got... there is the time... when we lose that... submission." "Loosing the cord." "Creatures cannot overcome Heaven."
      *   *Episode 2 (Dze-lâi):* Dying. Wife/children wailing. Dze-lî sends them away. Asks: "What will He now make you to become? Rat's liver? Insect's arm?" Dze-lâi replies: Yin/Yang > Parents. Obedience. "Great Mass" (nature). Smelter analogy: Metal leaping up saying "I must be Mo-yeh" is "uncanny" (inauspicious/bad). "Born as from quiet sleep, die to calm awaking."

  3.  **Address Question 1: The Shift from Speculation to Abstraction.**
      *   *Observation:* Dze-yü names specific forms. Dze-lâi avoids naming forms, focusing on the *process* (smelter).
