      *   **The "Same Option" Objection:** If I choose A at node 1, and then face A again at node 2, is it the *same* choice? If context matters (history), then preferences might be complete over *histories* even if incomplete over *outcomes*. The User argues that the money pump relies on treating them as identical tokens.
      *   **Resolute Choice:** McClennen's idea. You choose a plan at the start and stick to it, even if at a later node you would locally prefer to deviate. This avoids dynamic inconsistency.
      *   **The "Disguised Ranking" Charge:** If you have a complete preference over *plans* (e.g., "Plan: Go Left then Up" > "Plan: Go Right then Down"), don't you effectively have complete preferences over the outcomes those plans produce? If so, resoluteness doesn't save incompleteness; it just shifts the locus of completeness from outcomes to plans.

