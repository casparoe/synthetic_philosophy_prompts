          *   (6) Nadia: Correct. Cycles exist.
          *   (7) Theo: Logical fallacy. Status quo is the *worst* option usually.
          *   (8) Nadia: Correct logic. Approval is cardinal, not ordinal.
      *   *Closing (Approval & Arrow):*
          *   Does Approval escape Arrow? Yes, because Arrow assumes *ordinal* rankings (A>B>C). Approval is *cardinal* (Approve/Disapprove).
          *   Gibbard-Satterthwaite is the relevant theorem for strategic voting, which applies to Approval too.
          *   Does it help the council? Yes, it simplifies the ballot and reduces "lesser of two evils" voting, but has its own issues (bullet voting, lack of nuance).
          *   Recommendation: Don't let perfect be the enemy of good. Plurality is demonstrably worse for their specific problem.

  4.  **Refining the Technical Details:**
      *   *Arrow's Theorem:* Applies to ordinal (ranked) systems. Requires Unrestricted Domain, Non-dictatorship, Pareto Efficiency, and IIA.
      *   *Burlington 2009:* Montroll (Dem) was Condorcet Winner. Kiss (Prog) won via IRV. Wright (Rep) had more 1st choices than Montroll. Montroll eliminated. This confirms Nadia's point in (4).
      *   *Approval Voting:* It is a cardinal system. Arrow's theorem specifically restricts *ranked* preference orderings. So technically, Arrow doesn't ban Approval. However, *Gibbard-Satterthwaite* (manipulability) applies to almost everything. Also, Warren Smith's "Bayesian Regret" studies often favor Approval or Score over IRV.
      *   *Theo's Fallacy:* The "Nirvana Fallacy." Comparing real solutions to an ideal standard rather than to other real solutions.

  5.  **Final Review against Constraints:**
