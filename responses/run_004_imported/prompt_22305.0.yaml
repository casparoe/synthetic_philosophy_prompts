      *   This is the crux of the PSR. For Leibniz, "arbitrary" without a reason is irrational/impossible for a perfect being.
      *   Analogy: Buridan's Ass. If a donkey is equally hungry and thirsty and food/water are equidistant and identical in appeal, does it starve? Leibniz says yes (conceptually), or rather, the situation is impossible. A rational will *requires* a determining reason.
      *   So, "indifference" $\rightarrow$ "no sufficient reason" $\rightarrow$ "no action/creation."

