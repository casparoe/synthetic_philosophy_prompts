      *   *Premise 2:* If there were three perfectly indiscernible bodies, their arrangement (order/position) would be "indifferent." There is no reason to put Body A here and Body B there rather than vice versa, because they are identical in properties.
      *   *Inference:* If there is no reason to choose one arrangement over another, a rational agent (God) cannot choose. To choose arbitrarily would be to act without wisdom/reason.
      *   *Conclusion:* Therefore, God does not create such bodies. Therefore, indiscernible bodies do not exist in nature.
