answer: |-
  Søren Kierkegaard storms into the newspaper office, slamming a review on the editor's desk. "I demand to know who wrote this."

  The editor doesn't look up from his proofs. "No one did. It was The Public."

  "Then I challenge The Public to a duel," Kierkegaard says. "Pistols at dawn."

  The editor finally looks up, smiling wearily. "You still don't understand, do you? You can't duel an abstraction. The Public is everyone, which means it is no one in particular. It has no body to pierce, no honor to lose, and no conscience to prick."

  "Then how does it wound?" Kierkegaard asks.

  "It doesn't wound. It levels," the editor says. "It doesn't attack you directly. It just compares your height to the average and discusses the implications of your posture until you feel awkward enough to crouch."

  "That is envy," Kierkegaard snaps.

  "No," says the editor, dipping his pen. "Envy is passionate. Envy admits it wants what you have. This is just reflection. The Public doesn't want to pull you down, Søren. It just wants to make sure 'up' doesn't mean anything anymore."
