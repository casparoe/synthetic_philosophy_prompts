prompt: |-
  I'm a student member of my college's Honor Council (the panel that hears academic integrity cases), and this semester I'm also taking a philosophy of probability course where we just spent two weeks on the reference class problem -- you know, the classic headache where you want "the" probability that some specific person has some property, but depending which comparison group you slot them into (all smokers vs. smokers their age vs. smokers their age with their family history, etc.) you get a completely different number, and there's no principled way to say which group is actually the right one for them specifically. We've got a case in front of the council right now that I can't stop thinking is exactly this problem wearing a disguise, so before we vote I want an actual memo laying out the reasoning, not just my gut feeling.

  Here's the case: a student's take-home essay got flagged by the AI-writing detector the school licensed this year, which spat out "91% probability this text is AI-generated." She swears she wrote it herself, and part of her defense is that she's an international student, and these detectors are known (i think -- ive read a couple things on this) to false-flag non-native English writing way more often, something to do with sentence predictability. About half the council wants to treat 91% as basically a confession; the other half wants to throw the number out entirely as meaningless for her case specifically. Nobody's actually using the phrase "reference class problem," but that's clearly the real disagreement -- the 91% came from running the detector over some big test set of essays, and it's not obvious that "essays in that set" is the right comparison class for predicting whether THIS particular essay, written by THIS particular student, was AI-written.

  Could you draft the short memo I'd actually bring to Monday's meeting? I need a concrete recommendation for what to do with her specific case, with a deadline attached since our bylaws say hearings have to close within two weeks of the initial flag, plus a general standard the council could reuse in future cases for how much weight a detector score like this should carry. And don't let the council off easy -- I want the memo to take seriously the strongest version of the other side's view too, that 91% really is evidence and you don't get to just dismiss a number because assigning probabilities to individuals happens to be philosophically messy.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Student member of a college Honor Council.
      *   **Context:** Taking a Philosophy of Probability course (specifically studying the Reference Class Problem).
      *   **Task:** Draft a memo for the Honor Council meeting regarding a specific academic integrity case involving an AI-detection score (91%).
      *   **Key Issue:** The student claims the detector false-flags non-native English writers. The Council is split (91% = confession vs. 91% = meaningless). The user identifies this as an instance of the Reference Class Problem.
      *   **Requirements:**
          *   Concrete recommendation for *this* case.
          *   Deadline consideration (hearings close within two weeks).
          *   General standard for future cases (weight of detector scores).
          *   Steelman the opposing view (acknowledge 91% is evidence, don't just dismiss it on philosophical grounds).
          *   Tone: Professional, persuasive, reasoned, suitable for an Honor Council setting.

  2.  **Deconstruct the Philosophical Core (Reference Class Problem):**
      *   *The Problem:* Probability is relative to a class. Is the student a member of "all students," "all students using AI," "all non-native speakers," or "all non-native speakers with high proficiency"?
      *   *Application:* The detector gives $P(\text{AI} | \text{Text Features})$. It does *not* give $P(\text{AI} | \text{Text Features}, \text{Non-Native Speaker}, \text{Specific Student History})$.
      *   *Implication:* The 91% is a frequency within a training set, not a posterior probability of guilt for *this* individual without considering base rates and specific sub-class characteristics.

  3.  **Address the Opposing View (Steelman):**
      *   Why do half the council trust the 91%?
      *   *Argument:* It's empirical data. Ignoring it is ignoring evidence. In a legal/administrative context, we need actionable thresholds. 91% is high confidence. To dismiss it requires positive evidence of error, not just philosophical skepticism.
      *   *Counter:* High confidence in the *model's classification* $\neq$ high probability of *this student's guilt* if the model is biased against their class.

  4.  **Develop the Recommendation:**
      *   *Specific Case:* Cannot rely solely on the 91%. Need corroborating evidence (drafts, process work, oral defense). If none exists, reasonable doubt favors the student due to the known bias against non-native speakers (shifting the reference class).
      *   *General Standard:* Detector scores are *investigative leads*, not *proof of violation*. They establish probable cause for a hearing, not guilt at the hearing. Must be contextualized.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Quick overview of the issue and recommendation.
      *   **The Core Disagreement:** Frame it explicitly around the probability issue (using the term "Reference Class" but explaining it practically).
      *   **Steelman of the "91% is Evidence" View:** Acknowledge why colleagues feel this way. It's not magic; it's data. We can't ignore data.
      *   **The Philosophical/Statistical Rebuttal:** Explain *why* the 91% is misleading here. Focus on the "Non-Native Speaker" subclass. The training data likely underrepresented this class, or the features of non-native writing overlap with AI features (low perplexity).
      *   **Recommendation for Current Case:** Vote "Not Responsible" *unless* other evidence exists. The 91% is insufficient given the specific reference class issue.
      *   **Policy Recommendation:** Establish a standard for future cases. Scores $>X$ trigger investigation, but never stand alone for conviction.
      *   **Deadline Note:** Acknowledge the two-week rule. This analysis speeds up the decision by clarifying the burden of proof.

  6.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid overly academic jargon where possible, but keep the "Reference Class" terminology since the user wants to introduce that concept to the council.
      *   Ensure the distinction between *sensitivity* (catching AI) and *specificity* (not flagging humans) is clear.
      *   Make sure the "Steelman" section feels genuine, not like a strawman.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I focus too much on philosophy?
      *   *Fix:* Ground it in the Honor Council's burden of proof ("Clear and Convincing" or "Preponderance of Evidence" - usually the former for integrity cases).
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Yes, vote "Not Responsible" based on insufficiency of evidence, but recommend further review of writing process if available.
      *   *Critique:* Did I address the deadline?
      *   *Fix:* Add a specific note on timeline management.

  8.  **Final Polish:** Check for clarity, flow, and ensure all constraints of the prompt are met (memo format, specific case rec, general standard, steelman opposition). *Self-correction: Ensure I explicitly mention the two-week deadline constraint in the recommendation.*

  9.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Voting Members
  **FROM:** [Your Name], Student Council Member
  **DATE:** October 24, 2023
  **SUBJECT:** Evidentiary Standard for AI-Detection Scores (Case #2023-44)

  ### Executive Summary
  We are currently deadlocked on Case #2023-44 regarding a 91% AI-detection score. The disagreement stems from how we interpret that probability. This memo argues that the 91% figure suffers from a **Reference Class Problem**: it reflects the probability that *a generic text with these features* is AI, not the probability that *this specific student* cheated.

  **Recommendation:** For this specific case, we should vote **Not Responsible** unless corroborating evidence (drafts, version history, oral defense) is produced. The 91% score alone is insufficient evidence given the known bias against non-native English writers.

  **Policy Proposal:** Moving forward, detector scores should be treated as **investigative leads**, not **proof of violation**. A high score establishes probable cause for a hearing, but cannot sustain a finding of responsibility without human corroboration.

  ### The Core Disagreement: What Does "91%" Mean?
  Half the council views the 91% score as a near-confession. The other half views it as statistically meaningless for this individual. This is not just a gut disagreement; it is a statistical one known in philosophy as the **Reference Class Problem**.

  The detector was trained on a specific dataset (the reference class). It compares the submitted essay against patterns in that set. The 91% means: *"In our training data, 91% of texts looking like this were AI."*

  However, the student belongs to a specific subclass: **Non-Native English Speakers (NNES).**
  *   **Reference Class A (All Essays):** The detector is calibrated here. 91% risk.
  *   **Reference Class B (NNES Essays):** Research indicates AI detectors frequently false-flag NNES writing because non-native syntax often exhibits lower "perplexity" (predictability), which mimics AI patterns.

  If the detector's training data underrepresented Class B, the 91% figure is mathematically inflated for this student. We cannot simply apply the general probability to the specific case without adjusting for the subclass.

  ### Steelmanning the Opposing View
  We must take seriously the argument that the 91% score *is* valid evidence.
  1.  **Empirical Weight:** The score is not a random guess; it is output from a validated tool licensed by the institution. To dismiss it entirely risks undermining the tools we are mandated to use.
  2.  **Base Rate Neglect:** Even if false positives exist for NNES students, they are not 100%. It remains statistically more likely that a 91% score indicates AI than human origin, even within the NNES subclass.
  3.  **Administrative Necessity:** If we require absolute philosophical certainty about reference classes, we paralyze the Council. We must make decisions based on the best available data, and currently, the best data says 91% AI.

  **Rebuttal:** While the score is *evidence*, it is not *conclusive proof*. In honor code proceedings, the burden of proof is typically "clear and convincing." A probability metric that is known to be systematically biased against the respondent's demographic group cannot meet that burden alone. Accepting the 91% as conclusive ignores the specific error rate for the relevant reference class (NNES students), effectively shifting the burden of proof to the student to prove a negative.

  ### Recommendation for Case #2023-44
  **Vote: Not Responsible (based on insufficiency of evidence).**

  **Reasoning:**
  1.  **Known Bias:** There is sufficient public literature and vendor disclosure acknowledging higher false-positive rates for NNES writers. This creates reasonable doubt regarding the specific reference class.
  2.  **Lack of Corroboration:** The 91% is the *only* evidence. There are no witness testimonies, no contradictory draft versions, and no admission.
  3.  **Deadline Constraint:** Our bylaws require closure within two weeks. We do not have time to commission a statistical audit of the detector's performance on NNES students. Therefore, we must err on the side of the student when the primary evidence is statistically contested.

  *Note:* If the student can provide Google Doc version history or drafts showing the writing process, this resolves the reference class issue by providing direct evidence of human origin. If they cannot, the detector score remains the only evidence, and it is too flawed to sustain a violation.

  ### Proposed General Standard for Future Cases
  To prevent future deadlock, I propose the Council adopt the following standard for AI-detection metrics:

  1.  **Threshold for Investigation:** A score >80% constitutes *probable cause* to open a hearing.
  2.  **Threshold for Violation:** A detector score **never** constitutes sufficient evidence for a finding of responsibility on its own.
  3.  **Required Corroboration:** To find a student responsible, the Council must identify at least one additional indicator, such as:
      *   Inability to explain content during an oral defense.
      *   Absence of version history/drafts.
      *   Citations to non-existent sources (a common AI hallucination).
      *   Writing style drastically inconsistent with prior submitted work.

  ### Conclusion
  We are not statisticians, but we are arbiters of fairness. The Reference Class Problem teaches us that a probability assigned to a group does not automatically transfer to an individual, especially when that individual belongs to a subgroup known to be misclassified. By treating the 91% as a lead rather than a verdict, we protect the integrity of the Council and the rights of the student body.

  I request we discuss this framework at Monday's meeting to finalize the vote before our two-week deadline expires.
