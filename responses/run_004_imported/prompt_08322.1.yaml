  ### Referee's Commentary

  This was a high-caliber exchange that cuts to the heart of contemporary epistemology. You have Devi championing the **formalist/unificationist** tradition (à la Henry Kyburg or David Christensen) and Marcus defending the **particularist/distinctionist** tradition (à la Duncan Pritchard or Martin Smith). Here is the round-by-round breakdown:

  **Round 1: Devi's Opening (Score: 1)**
  Devi is technically correct on the formal structure. Both paradoxes present a set of propositions $\{p_1, ... p_n\}$ where each $p_i$ meets a threshold for justified belief, yet the conjunction $\land p_i$ is known to be false (or unjustified). Her proposed solution—rejecting the agglomeration principle (that justified belief is closed under conjunction)—is a standard, logically consistent move. However, she loses a point for claiming there is "no remainder." Asserting that the *epistemic* situation is identical just because the *logical* situation is identical is a bold claim that requires more defense. She treats the paradox as a problem of logic, whereas most epistemologists treat it as a problem of justification.

  **Round 2: Marcus's Reply (Score: 2)**
  Marcus lands a critical hit here. He identifies the **statistical vs. non-statistical** distinction, which is arguably the most important development in this debate over the last two decades. In the Lottery, my belief that ticket #4471 will lose is *purely* probabilistic; I have no evidence specific to that ticket. In the Preface, my belief that sentence 47 is correct is based on specific evidence (checking the citation). Marcus correctly notes that if the *source* of justification differs, the norms governing those beliefs might differ too. A solution that targets "naked statistical belief" (e.g., "you can't believe on stats alone") solves the Lottery but leaves the Preface untouched, because the Preface beliefs aren't statistical.

  **Round 3: Devi's Comeback (Score: 0)**
  Devi doubles down on formalism, but she slips up. She claims the source of justification is an "intuition that has nothing to do with what's actually generating the contradiction." This conflates the *contradiction* (which is logical) with the *paradox* (which is epistemic). The paradox arises precisely because we have strong epistemic intuitions that we *should* believe these things. If the source of justification changes the epistemic norm (e.g., statistical evidence doesn't warrant outright belief, but empirical evidence does), then the source is directly relevant to whether a contradiction is paradoxical or just a mistake. Dismissing the source as irrelevant ignores the subject matter of epistemology.

  **Round 4: Marcus's Last Word (Score: 2)**
  Marcus closes strong by focusing on diagnostic utility. He points out that a "one-size-fits-all" solution might be theoretically elegant but practically empty if it fails to address the specific mechanisms generating the tension in each case. If the Lottery is solved by restricting statistical belief, and the Preface remains because its beliefs are non-statistical, then claiming they are "the same paradox" obscures more than it reveals. He successfully argues that structural identity does not entail diagnostic identity.

  ### What Both Are Missing: Normic Support

  Both students are operating with a somewhat binary view of justification: either it's "statistical" (Marcus) or it's "justified above a threshold" (Devi). They are both missing the concept of **Normic Support**, developed most notably by Martin Smith.

  Normic support bridges their gap. A proposition has normic support if, given the evidence, it would be *abnormal* for the proposition to be false.
  *   **Preface:** If sentence 47 is false (despite my checking), something has gone wrong in the world (a typo, a memory slip). It calls for an explanation. This is normic support.
  *   **Lottery:** If ticket #4471 wins, nothing has gone wrong. It is not abnormal. It is just a statistical outcome. This lacks normic support.

  **Why this matters for the debate:**
  Devi wants a structural solution; Marcus wants a source-based distinction. Normic support gives Marcus his distinction (statistical vs. normic) but gives it a *structural* definition that Devi can respect. It explains *why* the source matters without resorting to mere intuition. It suggests that justified belief requires normic support, which solves the Lottery (no normic support) but preserves the Preface (normic support exists), potentially allowing for agglomeration in the Preface case while denying it in the Lottery case.

  **Verdict:** Marcus takes the round on diagnostic precision, but Devi's structural instinct is the right starting point for a unified theory—if she incorporates the nuance Marcus is pointing at. Tell them to read Smith's *When It Comes Down to It* and reconvene.
