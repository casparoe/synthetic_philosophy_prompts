answer: |-
  **MEMORANDUM**

  **TO:** Fenwick Prize Jury
  **FROM:** Chair, Fenwick Prize Jury
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Adeline Marsh Nomination

  **Recommendation**
  I recommend that the jury vote to award this year's Fenwick Prize to Adeline Marsh.

  **Rationale**
  This recommendation is made with full acknowledgment of the credible concern raised regarding the timing of Ms. Marsh's confession relative to the Guild's audit. Two members of this jury have argued persuasively that "moral courage" cannot be ascribed to an act undertaken to pre-empt exposure. This is a serious objection. It protects the integrity of the Prize by ensuring we honor conscience rather than calculation. If we award a confession made only because the confessor knew the walls were closing in, we risk incentivizing damage control rather than virtue. I respect this view not as nitpicking, but as a defense of the award's sanctity.

  However, after reviewing the available facts, I believe we must judge the act by its consequences and its voluntary nature, rather than by the purity of its catalyst.

  First, the audit was commissioned, not concluded. Until the findings were public, Ms. Marsh retained the option to deny the discrepancy. By confessing first, she assumed the risk that the audit might never have found her, or that she might have successfully obscured the truth. She surrendered that safety.

  Second, the cost was real and disproportionate. She lost a book contract and significant standing. The strategic benefit of "getting ahead" of the story does not negate the severity of the penalty she accepted. To withhold the Prize on the grounds of mixed motive sets a standard of saintliness that few past winners would meet. Our history honors those who expose truth at personal cost; Marsh's act, however triggered, has restored truth to the Guild's fellowship records and served the community's ethical health.

  Finally, we are a writers' guild, not a court of inquisition. We cannot reliably adjudicate the private chronology of a conscience. We can only measure the public weight of the act.

  **Condition for Revisiting**
  This recommendation stands unless new evidence emerges prior to the vote proving that Ms. Marsh received formal notification of the audit's *specific findings* regarding her file before she initiated her confession. If she confessed only after being told she was caught, the voluntary assumption of risk is nullified, and this recommendation should be withdrawn.

  **Proposed Standing Principle**
  As this is the second time in three years the jury has stalled on the definition of "courage" versus "expediency," I propose we adopt the following standing principle to guide future juries:

  > *The Fenwick Prize recognizes the voluntary assumption of significant professional or reputational risk in the service of truth. Eligibility requires that the act of disclosure precedes confirmed discovery by external authority. The Prize judges the public cost and corrective value of the act, not the private purity of the motive.*

  Adopting this clarifies that while we do not reward those who wait until they are caught, we do not penalize those who choose to speak before the gavel falls, regardless of whether they heard the judge approaching.

  I look forward to discussing this at our meeting on November 14th.
