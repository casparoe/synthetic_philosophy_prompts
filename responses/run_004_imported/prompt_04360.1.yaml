answer: |-
  This is not a dumb 3am thought. This is literally a graduate seminar in metaphysics and ethics disguised as a late-night dorm conversation. And since you work in formal semantics, you are uniquely equipped to see exactly where your housemate is conflating semantic modeling with metaphysical commitment.

  Short answer: **Your housemate is relying on a very specific, controversial metaphysical view (a radical version of Counterpart Theory) and treating it as a logical truth. He is missing the distinction between *numerical identity* and the *pragmatics of deliberation*.**

  Here is the breakdown of why your intuition is right, using the tools you use every day.

  ### 1. The Semantics of "I" (Centered Worlds)
  You work with Kratzer. You know that when we evaluate a modal claim like "I could have been happier," we are typically using a semantics of **centered worlds**. A world is not just a set of propositions; it is a triple $\langle w, t, x \rangle$, where $x$ is the individual center.

  When you evaluate the counterfactual "If I had gone to Program B," the semantic machinery **stipulates** transworld identity for the sake of the evaluation. We hold the individual parameter $x$ fixed across the actual world and the accessible possible worlds. We are asking: *In the worlds accessible from here where $x$ goes to Program B, is $x$'s welfare higher?*

  Your housemate is objecting to the metaphysics underlying the semantics. He is essentially arguing for a strict **Counterpart Theory** (à la David Lewis), where there is no transworld identity, only similarity relations between distinct individuals. He is claiming that the "counterpart" of you in the Program B world is too dissimilar to count as a valid counterpart for the purpose of welfare comparison.

  But even within Counterpart Theory, this is a parameter we set. We decide how strict the counterpart relation is. If we set the similarity threshold as high as your housemate does (any significant divergence in psychological continuity breaks identity), then **no counterfactual deliberation is possible.**
  *   "If I had eaten breakfast, I wouldn't be hungry."
  *   Housemate: "The version of you who ate breakfast has different blood sugar levels and neural pathways. That's not you. No fact of the matter."

  This reduces the semantics of decision-making to nonsense. Since language clearly *does* allow us to make these comparisons meaningfully, the semantic practice trumps the housemate's metaphysical nitpick.

  ### 2. The Non-Identity Problem (Parfit)
  Your housemate is echoing a version of Derek Parfit's **Non-Identity Problem**, but he's applying it too broadly. Parfit usually discusses cases where a choice determines *who comes into existence* (e.g., having a child now vs. later results in a different sperm/egg combination). In those cases, he argues we can't say the child is "harmed" by being born, because without that choice, they wouldn't exist.

  But your case isn't about conception. It's about **divergence**. You existed at the point of decision. The biological organism and the psychological continuity up to $t_{decision}$ are identical.
  *   **Psychological Continuity:** Yes, your advisors and friends would be different. But *you* (the core cognitive architecture, memories up to year 0, genetic predispositions) are the same.
  *   **The Sorites of Self:** Your housemate is treating identity as binary. But most modern metaphysics accepts that identity or "what matters in survival" is graded. Even if the Program B You is only 85% psychologically continuous with Actual You, that is sufficient for a welfare comparison.

  ### 3. "No Fact of the Matter" is a Category Error
  Your housemate claims there is "no fact of the matter" about whether you'd be happier. This is the weakest link.

  Even if we grant his metaphysical claim (that Program B You is a different person), the ethical question remains: **Is the world where Program B You exists a better world *for the sake of the person at the center of evaluation*?**

  Regret is a **de se** attitude. It is not claiming "Actual Me is happier than Counterpart Me." It is claiming "I prefer the world where I took path B over the world where I took path A."
  *   Preference satisfaction is a relation between an agent and a state of affairs.
  *   You, right now, have preferences.
  *   You can evaluate two complete world-histories.
  *   You can judge that World B contains more of the things you value than World A.

  Whether the "I" in World B is metaphysically identical to the "I" in World A is irrelevant to the *evaluation of the worlds*. You are the judge. You exist now. You can look at two scenarios and say, "Scenario B looks better." That is a fact about your current evaluative stance.

  ### 4. Why It Feels Wrong (The Reductio)
  Your intuition is screaming because your housemate's argument leads to a *reductio ad absurdum* of human agency.

  If significant psychological divergence negates identity, then:
  1.  You can never regret any decision made more than a month ago (because you've changed too much).
  2.  You can never make plans for the future (because the "you" who executes the plan won't be the "you" who made it).
  3.  Moral responsibility evaporates (the "you" who committed the crime is not the "you" standing trial, given rehabilitation or time passed).

  We know these conclusions are false pragmatically. We hold people responsible, we plan for the future, and we feel regret. Therefore, the premise (that divergence breaks identity for the sake of evaluation) must be false, or at least irrelevant to practical reasoning.

  ### The Verdict
  Your housemate is confusing **metaphysical identity** (what makes a person the *same* person) with **evaluative continuity** (what allows a person to *compare* outcomes).

  In formal semantics, we model the latter. We construct an accessibility relation that preserves enough of the agent's properties to make the proposition evaluable. If the accessibility relation is too strict (as your housemate suggests), the modal base becomes empty, and the conversation crashes.

  **You are allowed to wonder if you'd be happier.** The "fact of the matter" exists in your current evaluative perspective comparing two world-states. The metaphysical status of the counterpart in the other world doesn't invalidate the utility comparison you are performing right now.

  Tell your housemate he's arguing for a version of Counterpart Theory that makes decision theory impossible, and that while it's a fun party trick, it doesn't hold up to the pragmatics of living a life. And maybe get some sleep.
