      *   **Core Question:** How does Mill's non-connotative (denotative only) theory of proper names handle Frege's puzzle about identity statements (e.g., "Hesperus is Phosphorus")? Does Mill have a defense, or is his view vulnerable? And does Frege's solution (Sense/Reference) actually solve the problem or just move it?
