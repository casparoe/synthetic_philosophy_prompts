answer: |-
  It is a pleasure to engage with a question posed by someone who has spent a career grappling with the practical realities of naming. Your background in taxonomy gives you a distinct advantage here: you know intimately the difference between the *label* on a specimen jar and the *diagnostic traits* used to identify it. That distinction is, in many ways, the heart of the Mill–Frege debate.

  You have correctly identified the vulnerability in Mill's "denotative" view. To answer your questions directly: Mill's account does not truly "head off" the difficulty regarding identity statements; rather, it dismisses the difficulty as psychological rather than logical. Frege's solution does dissolve the specific puzzle about informativeness, but your intuition is correct that it relocates the burden of explanation to the nature of "sense."

  Here is how the landscape looks from where you are standing.

  ### 1. Mill's Defense: Semantics vs. Epistemology

  Mill insists that proper names are "unmeaning marks." They denote individuals but connote no attributes. If we accept this, then the proposition "Hesperus is Phosphorus" (to use Frege's later example) seems to say no more than "Venus is Venus."

  Does Mill have a defense? Yes, but it requires understanding what Mill thought logic was *for*. For Mill, logic is the study of inference and evidence, not the study of cognitive surprise.

  Mill would argue that the "substantive discovery" in an identity statement is not a matter of **semantics** (the meaning of the words) but of **fact** (the state of the world).
  *   **Semantically:** The names 'Hesperus' and 'Phosphorus' are indeed empty tags. They contribute no descriptive content to the proposition.
  *   **Factually:** The *act* of attaching two different tags to the same object is a physical discovery.

  For Mill, the informativeness of "Hesperus is Phosphorus" lies in the fact that we have learned that two distinct *marks* in our language happen to be nailed to the same *object* in reality. He would classify the surprise as epistemological (about our knowledge of the naming history), not logical (about the meaning of the terms).

  In your field, consider a situation where you realize that *Panthera leo* (lion) and *Felis leo* (an older synonym) refer to the same biological entity. For Mill, the names themselves are just tags. The discovery is that the taxonomists who applied these tags were pointing at the same natural kind. The "meaning" of the name didn't change; our knowledge of its **denotation** was refined. Mill would say Frege is confusing the *history of the naming* with the *signification of the name*.

  However, this defense is often considered unsatisfactory because it fails to explain why "Hesperus is Hesperus" feels trivial while "Hesperus is Phosphorus" feels profound, even if we know both are true. Mill's logic cannot distinguish the *cognitive value* of the two sentences.

  ### 2. Frege's Solution: Sense and Reference

  Frege argued that if names were only Millian tags, we could never learn anything from an identity statement. To solve this, he proposed that names have two layers:
  1.  **Reference (*Bedeutung*):** The object itself (the planet Venus).
  2.  **Sense (*Sinn*):** The "mode of presentation" or the way the object is given to us (e.g., "the star seen in the evening" vs. "the star seen in the morning").

  On this view, "Hesperus is Phosphorus" is informative because it equates two different *senses* that happen to share a *reference*. It tells us that the object presented in way A is identical to the object presented in way B.

  ### 3. Does Frege Just Relocate the Problem?

  Your second question is exceptionally sharp and anticipates criticisms that would not fully mature until the work of Saul Kripke in the 1970s. You ask: *Does positing "sense" just relocate the puzzle, since we owe an explanation of how two distinct senses pick out one and the same reference?*

  The answer depends on what you think the puzzle was.

  **If the puzzle is "How is the statement informative?":**
  Frege dissolves this completely. The informativeness is located in the *sense*. We don't need to explain how the senses latch onto the object to explain why the statement is surprising. It is surprising because we didn't know the two modes of presentation converged.

  **If the puzzle is "How do names hook onto the world?":**
  Then yes, Frege relocates the problem. By introducing "sense," Frege pushes the question back one step. Instead of asking "How does the name 'Hesperus' hook onto Venus?", we now ask "How does the sense 'the evening star' hook onto Venus?"
  *   If the sense is a description (e.g., "the bright star in the evening sky"), we face the problem that descriptions can be false (what if there is a reflection?).
  *   If the sense is not a description, what is it? A mental idea? A Platonic form?

  Frege himself was a Platonist; he believed senses were objective, abstract entities that exist independently of us. For him, there was no mystery about how they pick out references; that is simply their function. But for a naturalist (or a biologist), this can feel like magic. You might ask: "Where is this 'sense' located? Is it in the brain? In the culture?"

  ### 4. A Biological Analogy for the Impasse

  Given your background, the tension between Mill and Frege mirrors a tension in taxonomy between **nomenclature** and **diagnosis**.

  *   **The Millian View (Nomenclature):** The binomial name (*Homo sapiens*) is a rigid tag. It does not mean "wise man"; it is just the label attached to the type specimen. If we discover humans aren't wise, the name stays. This aligns with Mill. The name is a stable handle for discourse.
  *   **The Fregean View (Diagnosis):** We identify the species via traits (bipedal, large brain, etc.). These traits are the "sense." If we find a new trait, our "sense" of the species changes, even if the "reference" (the lineage) remains the same.

  When you discover that two names are synonyms (e.g., you realize Specimen A and Specimen B are the same species), you are making a Fregean discovery (two diagnostic paths lead to one lineage) based on Millian tools (the names themselves don't change, they just get merged).

  **The "Relocation" Critique:**
  Your worry that Frege relocates the problem is valid because Frege doesn't explain *how* the sense determines the reference, he just asserts that it does. Later philosophers (notably Kripke) argued that Frege was wrong about names specifically. Kripke revived a modified Millian view (the Causal Theory of Reference), arguing that names *do* work like Mill's "unmeaning marks" (they are rigid designators), and that the "informativeness" of identity statements comes from the fact that we fix the reference via a causal chain, not via a descriptive sense.

  ### Conclusion

  To summarize your specific queries:

  1.  **Does Mill's account head off the difficulty?**
      No. Mill's account survives only by denying that "informativeness" is a semantic property. He treats the discovery that $A=B$ as a fact about the world (that one object bears two marks), not a fact about language. Many philosophers find this unsatisfying because it ignores the obvious difference in how we *understand* the two sides of the equation.

  2.  **Does Frege's solution dissolve the puzzle or relocate it?**
      It dissolves the puzzle of **cognitive significance** (why one statement teaches us something and the other doesn't). However, it does relocate the puzzle of **reference fixation** (how the hook actually works). Frege trades a semantic mystery for an epistemological one.

  As a biologist, you might find yourself siding with Mill on the stability of names (taxonomy requires rigid labels) but with Frege on the process of identification (we identify via traits/descriptions). The philosophical history since then has largely been an attempt to reconcile these two intuitions: how can a name be a bare tag (Mill) while still allowing for informative discovery (Frege)? The current consensus leans toward a Millian view of reference (names point directly) combined with a Fregean view of belief (our *thoughts* about names have descriptive content).

  You have put your finger on the exact hinge upon which the philosophy of language turned in the 20th century. It is a remarkable transition to make from field biology to philosophy, yet the rigor required to distinguish a species is not so different from the rigor required to distinguish a sense from a reference.
