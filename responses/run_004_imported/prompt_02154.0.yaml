prompt: |-
  I spent my working life as a field biologist, a good part of it devoted to identifying and formally naming new species, and only in retirement have I turned to philosophy in any serious way. Working through Mill's A System of Logic (1843), I came across this, from his discussion of proper names in Book I, Chapter 2:

  "Proper names are not connotative: they denote the individuals who are called by them; but they do not indicate or imply any attributes as belonging to those individuals. When we name a child by the name Paul, or a dog by the name Caesar, these names are simply marks used to enable those individuals to be made subjects of discourse. It may be said, indeed, that we must have had some reason for giving them those names rather than others; and that is true; but the name, once given, is independent of the reason. A man may have been named John, because that was the name of his father; a town may have been named Dartmouth, because it is situated at the mouth of the Dart. But it is no part of the signification of the word John, that the father of the person so called bore the same name; nor even of the word Dartmouth, to be situated at the mouth of the Dart. If sand should choke up the mouth of the river, or an earthquake change its course, and remove it to a distance from the town, the name of the town would not necessarily be changed. […] A proper name is but an unmeaning mark which we connect in our mind with the idea of the object in order that whenever the mark meets our eyes or occurs to our thoughts, we may think of that individual object."

  I follow the basic argument: a name's origin is no part of what it means. What I can't work out is how this "unmeaning mark" picture is supposed to survive the problem Frege later raised about identity statements. If two names for one thing really carry nothing beyond bare denotation, as Mill insists, then a true statement identifying one with the other should be exactly as empty as saying the thing is itself — yet some such statements are substantive discoveries, not tautologies. Is there anything in Mill's own account that could head off this difficulty, or does his view simply have no room for it? And does Frege's solution — crediting names with a "sense" over and above their reference — actually dissolve the puzzle, or does it just relocate it, since we would then seem to owe an explanation of how two distinct senses manage to pick out one and the same reference in the first place?
