      *   Crucially, this implies that if the evidence doesn't determine a preference between Act A and Act B, the decision rule should *not* force a choice. It should allow for indeterminacy.
      *   *Most Faithful:* A rule that only declares A better than B if *every* probability function in the set agrees. It maximizes the suspension of judgment.
      *   *Least Faithful:* A rule that picks a specific act based on extreme cases or averages, effectively acting as if the uncertainty is resolved or ignoring the spread of the set.

