answer: |-
  This is a fantastic real-world case study for an AP Government class. You have stumbled onto a debate that political philosophers, sociologists, and legal theorists have been having for centuries. The "Senior Wall" is a microcosm of how societies organize themselves without a state, and what happens when the state (or Student Council) tries to intervene.

  Here is a breakdown of the two questions you raised, using the concepts you're likely encountering in your course.

  ### 1. Is Mara right that unwritten customs can't obligate?

  Mara is operating under a theory called **Legal Positivism**. Her argument is essentially: *A rule is only a rule if it comes from a recognized authority, is written down, and has a specified penalty.* By that definition, she is technically correct. There is no *law* against sitting on the wall. She cannot be detained, suspended, or formally punished.

  However, Mara is missing the distinction between **legal authority** and **social legitimacy**.

  Political philosophers like David Hume and modern game theorists argue that many of the most binding rules in society are **conventions**, not commands. A command comes from above (a teacher telling you to sit down). A convention emerges from below (everyone driving on the right side of the road).

  *   **The Source of Obligation:** For Mara, obligation comes from fear of punishment. For the rest of the school, obligation comes from **mutual expectation**. When a senior sits on the wall, they expect other non-seniors not to sit there. When a non-senior walks past, they expect the wall to be full of seniors. This mutual expectation creates a stable social equilibrium.
  *   **The Cost of Violation:** Mara argues there is no enforcement. But there *is* enforcement; it's just decentralized. When she sat on the wall, she was policed by her peers. The "penalty" isn't detention; it's social friction, reputational damage, and being labeled someone who "doesn't get it."
  *   **The "Arbitrary" Nature:** You noted that your cousin's school has a different rule (library couches controlled by a club). This proves Mara's point that the rule isn't "natural" or morally necessary. But it also proves that **conventions are binding *because* they are arbitrary.** We drive on the right not because it's morally superior to the left, but because we all agreed to do the same thing to avoid crashing. The Senior Wall is a coordination game. It only works if everyone plays along.

  **Verdict:** Mara is right that the custom lacks *legal* authority, but wrong that it lacks *obligation*. She has the **power** to sit on the wall (no one can physically stop her without committing assault), but she lacks the **social license** to do so. In a community, social license is often more binding than handbook policy.

  ### 2. Does writing the norm down change what it *is*?

  This is the more profound question. Your observation that students (even seniors) hate the idea of making it "official" suggests that codifying a norm fundamentally alters its nature.

  **Spontaneous Order vs. Constructed Order**
  The Austrian economist F.A. Hayek distinguished between two types of order. The Senior Wall is a **spontaneous order** (or *cosmos*). It evolved organically over time without a designer. It feels legitimate because it belongs to the students; it is part of the school's culture, not its administration.

  If the Student Council writes it into policy, it becomes a **constructed order** (or *taxis*). It is now a rule imposed by a governing body.

  **Why Codification Breaks the Spell**
  There are three reasons why making the wall "official" causes backlash, even among the beneficiaries (the seniors):

  1.  **Shift from Respect to Entitlement:** Currently, the wall is a privilege granted by tradition. Seniors sit there because "that's how it's done," and underclassmen allow it out of respect for the tradition. If it becomes policy, it becomes a *right*. Underclassmen will no longer defer out of respect; they will comply out of fear of punishment. This sours the relationship between grades. It turns a cultural handshake into a legal contract.
  2.  **The Enforcement Problem:** Unwritten norms are flexible. Maybe a senior lets a junior sit once because they're friends. Maybe a teacher ignores it if the walkway is crowded. Once it is written down, it demands rigid enforcement. Who checks the grades? What if a senior is late? Does a student council member have the authority to order a senior off the wall? Suddenly, you need a bureaucracy to manage the wall, and nobody wants that bureaucracy.
  3.  **Legitimacy of Authority:** Students generally accept peer norms more readily than administrative rules. When a senior tells Mara to move, it's a peer enforcing a cultural boundary. If a Student Council member tells Mara to move because of "Policy 4.1.B," it feels like an administrator enforcing a restriction. The source of the rule matters as much as the rule itself.

  **Is it like "Cutting in Line"?**
  To your second point: Is the wall the same as not cutting in line?
  *   **Similarities:** Both are social norms enforced by peers rather than laws. Both rely on the idea of fairness (or in the wall's case, hierarchical fairness).
  *   **Differences:** Not cutting in line is a **moral norm** based on universal fairness (first come, first served). The Senior Wall is a **status norm** based on local hierarchy (seniors > juniors).

  The reaction to the Student Council proposal proves they are different kinds of things. If you proposed making "no cutting in line" an official school policy, people might shrug and say, "Okay, sure." But making the Senior Wall official feels like overreach. Why? Because moral norms (lines) usually translate well into laws. Status norms (walls) usually rot when you legislate them.

  ### The Takeaway for AP Gov

  You can frame this in your class using the concept of **Legitimacy**.
  *   **Mara** sees authority as purely **Rational-Legal** (Weber's term): It must be written and bureaucratic to be real.
  *   **The School** is operating on **Traditional** authority: It is real because "it has always been this way."

  The Student Council's mistake is trying to convert **Traditional authority** into **Rational-Legal authority**. In doing so, they strip the tradition of its mystique and replace it with bureaucracy.

  **Conclusion:**
  Mara is free to sit on the wall, but she is not free from the social consequences of doing so. The custom *is* binding, but only as long as it remains a custom. The moment you write it down, you kill the tradition that gave it power. The wall works *because* it is unwritten. It is a gift the underclassmen give the seniors, not a right the seniors take from the underclassmen. Turning it into a law changes it from a gift into a tax, and everyone—seniors included—seems to sense that distinction intuitively.
