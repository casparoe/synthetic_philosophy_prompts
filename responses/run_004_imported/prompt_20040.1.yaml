      *   **Questions:**
          1.  Is Mara right that unwritten/unofficial customs can't obligate, or can they be binding without authority?
          2.  Is "Senior Wall" the same kind of thing as a strong norm (like not cutting in line), or does codifying it (making it official) change its nature fundamentally?
      *   **Tone:** The user is an AP Government student, thoughtful, analytical, looking for a nuanced philosophical/sociological take, not just a "who's right" verdict.

  2.  **Deconstruct Question 1: Authority of Unwritten Customs:**
      *   *Mara's Position:* Legalistic/Positivist. Rules require a legislator, a text, and enforcement mechanisms to be binding. If it's not in the handbook, it's optional.
      *   *Counter-Position:* Sociological/Normative. Social obligations exist independently of formal law. Hume, convention, game theory.
      *   *Key Concept:* **Conventions vs. Commands.** A command comes from authority (teacher/principal). A convention comes from mutual expectation and coordination.
      *   *Analysis:* Mara is right that it lacks *legal/administrative* authority. She won't get detention. But she is wrong that it lacks *social* obligation. The obligation comes from the community's expectation and the cost of violating it (social friction, reputational damage).
