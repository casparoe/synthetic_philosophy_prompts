      *   *The Shift:* When you write it down, you change the *reason* for compliance. Unwritten = "I respect the seniors/tradition." Written = "I fear punishment/am following rules."
      *   *Verdict:* They are *not* the same kind of thing once codified. Codification changes the nature of the obligation from internal/social to external/legalistic.

