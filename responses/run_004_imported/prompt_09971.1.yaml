answer: |-
  Pastor, family, friends, members of the VFW, and classmates who have traveled to be here.

  We are gathered in the church where Ski was baptized, and we will gather later at the Post where he broke bread for fifty years. To stand between these two places feels like standing between the two halves of his heart. One half belonged to God and his family; the other belonged to the men he served with and the code he lived by.

  For those of you who knew him as a deacon, you know his faith was quiet but solid. For those who knew him as a machinist, you know his work was precise. And for those who knew him on the water, you know he was humble enough to laugh at himself, even when the fish weren't biting. He was, by his own cheerful admission, the worst fisherman in three counties. But he showed up every time, rod in hand, ready to try again. That persistence was the thread that ran through everything he did.

  But I know that for many of us, our thoughts turn first to the years between 1968 and 1970. Nineteen years old, drafted into the Army, infantry in the Central Highlands. He came home to a country that was fractured, a country that often didn't know how to thank him, or worse, didn't want to. He didn't talk much about the jungle, or the politics, or the strategy. He talked about the men.

  In my studies, I have been learning about the heavy questions nations ask themselves when they send young people to war. There are endless debates about causes, and justice, and policy. But Ski taught me that for the soldier in the field, those abstract questions often fade behind a more immediate truth. The war might belong to the politicians, but the man to your left and the man to your right belong to you.

  He carried that burden home with him. Not the burden of guilt, exactly, but the burden of memory. He understood that there is a difference between the reason you are sent to fight and the reason you keep fighting. He never sought to justify the conflict to us. He sought to honor the promise he made to his squad. To suggest that his courage depended on a perfect political cause would be to misunderstand him. His courage depended on his loyalty.

  He was a man who understood vocation. He believed that if you are given a duty, you do it with integrity. Whether that duty was holding a position in the Highlands, machining a part to tolerance, or serving communion on a Sunday morning. He believed that how you treat the people entrusted to you is the measure of your soul.

  Six months ago, as his strength was beginning to fade, we were sitting on his porch. The conversation turned, as it sometimes did, to the war. He looked out at the yard, quiet for a long time, and then he said something I will carry for the rest of my life. He said:

  *"I still don't know if we should've been there. I know I'd do the same thing again for the men next to me."*

  In that sentence, he said everything that needs to be said. He acknowledged the doubt that honest men carry. But he also affirmed the bond that holds soldiers together, a bond that transcends the orders they were given. He did not need to resolve the ethics of the war to know the ethics of his brotherhood.

  To his squadmates here today: He spoke of you often. You were the men he would do it again for. That loyalty did not end when the uniforms came off. It lasted fifty years.

  To my classmates: You know that the world is complicated. You know that good people can find themselves in difficult places. Ski was a good man. He navigated that complexity with grace, not by finding easy answers, but by holding fast to the people he loved.

  And to my family: We lost a patriarch. We lost a storyteller. We lost the guy who could make a bad fishing trip sound like a grand adventure.

  Ski was baptized in this font. He was sustained by this Word. And he is now remembered by this community. We don't need to solve the debates of history to honor him. We only need to love each other the way he loved his squad. We only need to serve the way he served.

  Rest easy, Ski. The watch is over. The men are safe. And the fish, finally, are biting.

  Amen.
