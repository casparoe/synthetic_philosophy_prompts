answer: |-
  **To:** Promotion Calibration Committee
  **From:** [Your Name]
  **Subject:** Proposal: Refining Promo Calibration Voting

  I'm proposing a targeted tweak to our calibration voting process to address a structural risk observed last cycle.

  First, I want to affirm the value of our current gate-based system (Scope, Execution, Influence). Voting by criterion forces us to engage with the rubric specifically, rather than relying on vague "vibe checks." It also protects candidates from having their entire packet tanked by one reviewer's fixation on an unrelated weakness. We should preserve this granularity.

  However, last cycle exposed a voting paradox: a candidate passed with 2-1 "Yes" votes on every gate, yet each of the three reviewers voted "No" on at least one gate. Individually, none of us felt the packet was fully promotion-ready, but aggregated by gate, the candidate cleared the bar. This creates a scenario where we promote candidates without genuine consensus, potentially setting them up for failure. It also diffuses responsibility; each reviewer assumes the others validated the areas where they voted "No."

  **Proposal:** Adopt a **Dual-Threshold System**.
  1.  **Gate Majority:** Maintain the requirement for 2/3 "Yes" on each individual gate.
  2.  **Holistic Majority:** Require 2/3 "Yes" on an overall "Promote/No Promote" vote, cast after gate calibration.

  This preserves the rubric discipline while ensuring that no candidate is promoted if every reviewer has a substantive reservation. It aligns the mathematical outcome with our collective judgment. If a reviewer cannot endorse the packet overall due to a specific gate failure, their holistic "No" acts as a necessary check against fragmented approval. This ensures that passing the gates isn't treated as a checklist exercise, but as evidence supporting a holistic endorsement. It signals to the organization that promotion requires full confidence, not just averaged adequacy across criteria.

  This approach balances rubric fidelity with collective ownership of the decision. Let's lock this in during Friday's sync to ensure fairness and consistency for the upcoming cycle.
