      *   **Goal:** Write a short memo (~300 words) to circulate before the calibration sync.
      *   **Task:** Pick one concrete way to run votes going forward and argue for it.
      *   **Constraint 1:** Take the case for gate-by-gate voting seriously (acknowledge benefits: rubric engagement, prevents single reviewer veto on unrelated criteria).
