answer: |-
  Here are ten interview questions with follow-ups, designed for a host who has read the material but wants to push past the textbook summary into the live philosophical problems.

  **1. The Circularity of Admissibility**
  "David Lewis formulates the Principal Principle by saying our credence should match the chance, provided we have no 'inadmissible' evidence. He suggests admissible evidence is roughly 'historical'—things about the past and present. But critics argue that to define what counts as admissible, you already have to know which facts are capable of influencing the chance. Doesn't defining admissibility this way smuggle in the very conclusion the Principle is supposed to establish, making it circular?"

  *   **Follow-up:** "If that circularity charge sticks, does the Principal Principle lose its normative force? In other words, does it stop telling us how we *ought* to reason and just become a tautology about how we've defined our terms?"

  **2. The Epistemic Access Problem**
  "Let's assume we can solve the admissibility definition. A practical worry for my listeners—who are often thinking about real-world forecasting—is how an agent actually identifies admissible evidence in the wild. If I'm looking at a poll or a weather model, how do I know if the data I'm holding is 'admissible' in the Lewisian sense without already having a solved theory of physics?"

  *   **Follow-up:** "So, are you suggesting that the Principal Principle is an idealization for omniscient agents, or do you think there's a workable heuristic for finite minds like ours to approximate admissibility?"

  **3. The Big Bad Bug**
  "I want to move to Lewis's 'Big Bad Bug.' For the uninitiated, this is the worry that if chances supervene on the Humean mosaic—the total pattern of events in spacetime—then the future can 'undermine' the present. Could you sketch the intuition here? How does a future event retroactively change the truth value of a present chance claim?"

  *   **Follow-up:** "I think my listeners will grasp the metaphysics, but why is this a *logical* contradiction for the Humean? Why can't they just say the present chance is what it is, regardless of what happens next?"

  **4. The Threat to the Principal Principle**
  "Connecting that back to rationality: Lewis argued that this undermining possibility means a Humean cannot consistently follow the Principal Principle. If I understand correctly, the worry is that if I defer to the present chance, I'm assigning non-zero credence to a future that, if it comes to pass, proves the present chance was false. Is that the crux of the inconsistency?"

  *   **Follow-up:** "Does this imply that a Humean is forced to set their credence to zero in the current chance hypothesis? Because if so, that seems to make objective chance useless for guiding belief."

  **5. The Standard Fix (The New Principle)**
  "Lewis's proposed solution was to revise the principle. Instead of conditionalizing on admissible evidence, we conditionalize on the complete theory of chance itself. This is often called the 'New Principle.' In your view, does this actually solve the undermining problem, or does it just relocate the difficulty to our access to that theory?"

  *   **Follow-up:** "If the fix requires us to conditionalize on the *true* theory of chance, but we never know for sure which theory is true, have we saved the principle for actual human agents, or only for idealized ones?"

  **6. Humeanism vs. The Principle**
  "This brings us to a fork in the road. Some philosophers argue the problem isn't the Principal Principle, but Lewis's commitment to Humean Supervenience. If one were a Non-Humean about chance—say, a primitivist who thinks chances are fundamental propensities—does the undermining future problem simply vanish?"

  *   **Follow-up:** "If the answer is yes, that suggests the Principal Principle is robust, but Humeanism is the weak link. Is that your diagnosis? Are we forced to choose between Lewis's metaphysics and Lewis's principle of rationality?"

  **7. Defending the Humean Package**
  "However, you have built a career defending the coherence of this view. If you want to keep both Humean Supervenience *and* a deference principle like the Principal Principle, what is the strongest argument you have that the 'Bug' isn't fatal? Is there a way to interpret 'chance' such that the future doesn't undermine the present in a way that breaks rational deference?"

  *   **Follow-up:** "Does that defense require us to weaken the Principal Principle further? At what point does a modified principle stop being a principle about *chance* and start being a principle about something else?"

  **8. Chance in the Social Sciences**
  "Stepping back from metaphysics to my original curiosity: pollsters and forecasters attach numbers to unrepeatable events like elections. They act *as if* the Principal Principle holds—they treat the 70% forecast as a guide for belief. Given the philosophical troubles we've discussed, are these forecasters making a category mistake, or is there a sense in which 'social chance' avoids the Big Bad Bug?"

  *   **Follow-up:** "If social chances aren't Humean chances, does that mean we need two different concepts of probability: one for physics that satisfies Lewis, and one for society that satisfies the pollsters?"

  **9. Rival Principles**
  "There are rival norms, like the Rejection Principle or various frequency-based principles, that try to link chance and credence without the same metaphysical baggage. Why should we stick with the Lewisian tradition at all? What does the Principal Principle capture about rationality that these rivals miss?"

  *   **Follow-up:** "Is it fair to say that the Principal Principle endures not because it's proven, but because it's the only one that matches our pre-theoretical intuition about what 'objective chance' is supposed to *do* for us?"

  **10. Advice for the Self-Taught**
  "Finally, since my audience consists of people reading this material in their spare time, just as I did: Lewis's papers on chance are dense and technically demanding. For someone who has worked through the texts but doesn't have the formal training to spot the subtle errors, where should they focus their energy? Is it more productive to wrestle with the metaphysics of Humeanism or the epistemology of admissibility?"

  *   **Follow-up:** "If they take away one thing from your defense of the Principal Principle, what do you hope it changes about how they interpret a probability number in their daily life?"
