  **MEMORANDUM**

  **TO:** Forecasting Program Working Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Scoring Methodology for Q4

  **Executive Summary**
  After reviewing the arguments regarding the transition from Brier to Logarithmic scoring, I recommend we adopt a **Dual-Track Scoring Policy**. Effective next quarter, we will calculate the **Logarithmic Score** for the public leaderboard and the **Brier Score** for internal performance reviews.

  This approach resolves the current impasse by acknowledging that our forecasting program serves two distinct functions: an epistemic exercise (the leaderboard) and a personnel evaluation tool (the reviews). Treating these functions as identical is a category error that has driven our disagreement.

  **Context and Analysis**
  Our debate has stalled because we are conflating *epistemic justification* with *incentive compatibility*. Both sides of the working group have identified valid constraints that apply to different domains.

  **1. The Epistemic Case (Leaderboard)**
  The argument for the Logarithmic Score rests on strong theoretical ground. As noted in the literature on proper scoring rules (e.g., Joyce, Pettigrew), the Log Score is "local": it evaluates a forecaster solely on the probability assigned to the actual outcome. It does not penalize a forecaster for how they distributed credence among alternatives that did not occur.
  *   **Strength:** This provides the purest measure of epistemic accuracy and calibration.
  *   **Application:** This is the appropriate metric for the **Leaderboard**, where the goal is intellectual rigor, community learning, and "fun." In a low-stakes environment, we should optimize for theoretical purity to encourage genuine truth-seeking.

  **2. The Practical Case (Performance Reviews)**
  The argument for retaining the Brier Score rests on risk management and behavioral incentives. Performance reviews are high-stakes for staff. The Log Score is unbounded; a single confidently wrong prediction (e.g., assigning 3% to an event that occurs) yields a penalty disproportionate to a quarter of otherwise excellent work.
  *   **Strength:** The Brier Score is bounded (0 to 1). It limits variance and prevents a single error from causing "ruin" in a personnel file.
  *   **Application:** This is the appropriate metric for **Performance Reviews**. In a high-stakes HR context, stability and fairness are features, not bugs. We cannot ask staff to absorb infinite downside risk for the sake of epistemic purity in a metric that affects their livelihood. Furthermore, as Side B noted, unbounded penalties incentivize hedging toward 50% on high-stakes questions. If staff hedge to protect their reviews, the organization loses the actionable intelligence the program is meant to provide.

  **The Proposal: Dual-Track Scoring**
  To honor both the theoretical and practical constraints, I propose we decouple the metrics:

  1.  **Public Leaderboard (Logarithmic Score):** We will switch the leaderboard to the Log Score. This satisfies the demand for epistemic purity and locality. It signals that, intellectually, we value the rigorous standards associated with the Good Judgment Project and rationalist epistemology.
