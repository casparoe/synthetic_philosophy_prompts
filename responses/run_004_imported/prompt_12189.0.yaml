prompt: |-
  I host a podcast where I interview scholars whose ideas end up seeding my novels, and next week's conversation is going to double as research: my work-in-progress follows a cosmologist who convinces himself that a fringe multiverse theory must be correct simply because it implies that vastly more observers exist. The guest is a philosopher known for defending the self-indication assumption in anthropic reasoning, and I don't want the hour spent having her simply restate the view for an audience that already knows the term. Draft eight to ten interview questions that go beyond that: I want at least one question each on the presumptuous philosopher objection, on how SIA is supposed to cancel out the Doomsday argument's shift toward earlier human extinction, and on whether SIA genuinely dissolves the reference-class problem that dogs the self-sampling assumption or merely relocates it -- and for each, a follow-up keyed to the answer she's most likely to give.
