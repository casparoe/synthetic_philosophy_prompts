answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, [Award Name]
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Voting Methodology for Upcoming Cycle

  **Purpose**

  At this Saturday's meeting, we must finalize the voting rules for the upcoming award cycle. Specifically, we need to resolve the disagreement regarding the Best Novel category following last year's results.

  This memo outlines the problem, addresses the mathematical objections raised regarding potential solutions, and offers a concrete recommendation for the Committee's vote.

  **The Context**

  Last year, five finalists were selected for Best Novel. Three were tonally similar cozy mysteries; one was a polarizing horror novella. Under our current plurality system (one vote per member, most votes wins), the cozy vote was split three ways. The horror novella won with a plurality, despite a majority of voters ranking it last or not at all.

  While the result was procedurally valid, feedback from the membership indicates a loss of confidence in the outcome. A significant portion of our voters feel the winner did not reflect the consensus of the room. Consequently, there is a strong push to adopt Ranked-Choice Voting (RCV).

  **The Mathematical Objection**

  During the last meeting, our Treasurer raised a valid theoretical objection to switching systems. He cited the Gibbard-Satterthwaite theorem (and occasionally Arrow's Impossibility Theorem) to argue that *no* voting system with three or more options is immune to strategic manipulation. His conclusion was that switching to RCV is "theater" that creates administrative work without fixing the underlying vulnerability.

  I want to address this directly before we meet, because the Treasurer is technically correct, but his conclusion is practically wrong.

  **The Theorem vs. The Reality**
  The theorem states that no system is *perfectly* safe from insincere voting. That is true. However, "not perfect" does not mean "all systems are equally flawed."

  *   **Plurality Voting** actively *punishes* sincere voting when similar options exist (the "spoiler effect"). It forces voters to guess which candidate is viable rather than voting for who they actually like. This is exactly what happened last year.
  *   **Ranked-Choice Voting** does not eliminate all strategy, but it removes the specific penalty for vote-splitting. It allows a voter to sincerely rank a longshot first without wasting their vote, because their ballot transfers if that candidate is eliminated.

  To use an analogy: The Treasurer is arguing that because no car is immune to accidents, installing seatbelts is theater. He is right that seatbelts don't prevent every crash, but they specifically prevent the kind of fatal impact we suffered last year. We are not looking for a mathematically perfect system; we are looking for one that minimizes the specific failure mode our members are complaining about.

  **Recommendation**

  I recommend the Steering Committee vote to adopt **Ranked-Choice Voting (Instant Runoff)** for the Best Novel category, effective immediately.

  **Reasons for this Recommendation:**

  1.  **It Solves the Reported Problem:** RCV specifically mitigates vote-splitting among similar finalists (the cozy mysteries), ensuring the winner has broader support rather than just a passionate minority.
  2.  **Membership Trust:** Our voters are SFF fans. Many are already familiar with RCV through the Hugo Awards. Adopting it signals that we take their concerns about representation seriously.
  3.  **Feasibility:** With 150–200 ballots, the counting is manageable for our volunteer staff. We can utilize existing open-source tools to tally the rounds transparently.
  4.  **Incentive Structure:** While the Treasurer is right that strategy is always *possible*, RCV makes honest voting the *safest* strategy for the majority of voters. Plurality makes honest voting a risk.

  **Addressing the "Theater" Claim**
  Changing the system is not merely performative. It changes the incentives. Under plurality, a voter *must* strategize to avoid wasting their vote. Under RCV, they *may* strategize, but they are not forced to. That shift from "forced strategy" to "optional strategy" is the difference between a system that distorts results and one that reflects them.

  **Next Steps**

  I propose we put this to a vote on Saturday. If the Committee approves, we will update the website and ballot instructions to clearly explain how to rank candidates.

  We are a small, regional award. We cannot compete with the Hugos on prestige, but we can compete on integrity. Let's ensure our winners reflect what our members actually want.

  See you Saturday.

  ***

  ### Note to the User (For your novel research)

  Since you're mining this for a subplot, here are a few nuances you might find interesting regarding the "math vs. politics" dynamic:

  1.  **The Theorem Mix-up:** Your Treasurer is indeed conflating **Arrow's Impossibility Theorem** (which deals with ranked preferences and fairness criteria like "independence of irrelevant alternatives") with **Gibbard-Satterthwaite** (which specifically proves that any voting system is manipulable). In a novel, this is a great character detail: the Treasurer uses math to assert dominance, but is slightly sloppy about *which* math, relying on the committee's ignorance to win the point.
  2.  **The "Center-Squeeze" Flaw:** If you want to create conflict *after* the switch, RCV has a known weakness called the "center-squeeze." Sometimes a moderate candidate who is everyone's second choice gets eliminated early because they lack enough *first-place* votes. You could write a scenario where the "compromise candidate" is eliminated in Round 2, causing a different kind of outrage.
  3.  **The Social Dynamics:** The memo above is written to be diplomatically lethal. It validates the Treasurer's expertise ("You are technically correct") while completely undermining his conclusion ("But you are practically useless"). In a fictional guild, this is the kind of move that gets someone stabbed in the back—or promoted to Chair.
  4.  **Approval Voting:** If you want a third option for your plot, **Approval Voting** (vote for as many as you like) is often championed by voting theorists as simpler and more robust than RCV. If your fictional committee rejects RCV for Approval, it shows they are truly listening to the math. If they reject Approval because "it's too confusing," it shows they are entrenched in tradition.

  Good luck with the meeting, and good luck with the book.
