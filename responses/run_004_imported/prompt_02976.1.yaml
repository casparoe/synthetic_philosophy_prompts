      *   **Setting:** Two old friends splitting a dinner bill.
      *   **Scenario:** Both do mental math, get different totals, know the other is equally good at arithmetic.
      *   **Requirements:**
          *   Real back-and-forth (no restating views without engagement).
          *   Steadfaster needs a genuine reason (not stubbornness).
          *   Conciliationist needs to defend "equal weight" (not caving).
          *   Bonus: Argue about whether to conciliate about conciliationism itself.
          *   Length: Around 350 words.
          *   Outcome: No clear winner.

  2.  **Drafting - Section by Section:**

      *   *Setup:* Quick context. Bill arrives. Math happens.
      *   *Conflict:* Numbers don't match.
      *   *Steadfaster's Argument:* Why stay firm? Maybe access to first-order evidence? "I saw the tip line."
      *   *Conciliationist's Argument:* Why adjust? Peer reliability outweighs specific confidence.
      *   *The Twist:* Meta-disagreement (should we conciliate on this rule?).
