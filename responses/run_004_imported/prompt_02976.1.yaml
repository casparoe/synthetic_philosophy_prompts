  "Forty-six," said Mara, sliding the check across the table.

  "Forty-four," Leo countered, not looking up from his napkin.

  They locked eyes. Both knew the other could calculate tips faster than a register. This was a clean peer disagreement. The restaurant hummed around them, but the table went silent.

  "You think I missed the tax?" Mara asked.

  "I think you double-counted the appetizer," Leo said. "But here's the thing: I know you're as sharp as me. So, logically, I should split the difference."

  "Exactly," Mara said. "Forty-five."

  "No," Leo said, tapping his napkin. "Because if I split the difference, I'm admitting my calculation is noise. But I *saw* the numbers. My first-order evidence says forty-four. Your disagreement is just second-order noise. I have to trust my own reasoning process unless I have a specific defeater."

  "That's arrogant," Mara shot back. "It assumes your brain is a transparent window to truth. But you're fallible. Knowing an equal disagrees is proof you might be wrong. Ignoring that is ignoring data. The symmetry of our reliability outweighs your specific confidence."

  "It's not ignoring data, it's weighing it," Leo insisted. "If I defer to you every time, I lose my own reasoning. I'm not a voting machine. I have to trust my own eyes unless I have a specific reason to think you're right *this time*. Mere disagreement isn't a defeater."

  "But the disagreement *is* the reason," Mara said. "So, are you going to conciliate on the bill?"

  "No. But here's the kicker," Leo smiled. "We disagree on whether to conciliate. You're a conciliationist, I'm a steadfaster. By your own rule, shouldn't you lower your confidence in conciliationism?"

  Mara paused. She tapped her pen. "If I conciliate on the principle, I become less sure I should conciliate on the bill. It loops."

  "Right," Leo said. "So I can stay firm on forty-four."

  "Or," Mara leaned in, "I conciliate on the principle, which means I stop being a strict conciliationist, which means I don't have to split the difference."

  "So we're both right?"

  "We're both stuck," Mara said, reaching for her wallet. "Let's just swipe the card."
