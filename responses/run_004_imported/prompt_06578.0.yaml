answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I'm [Mother's Name]'s son/daughter. I also run a small landscaping business, which means I spend most of my time arguing with roots, rocks, and the weather, rather than statutes and precedents. I didn't go to college, and I certainly never went to law school. So, when I say I understand my mother's mind, I don't mean I understand the footnotes. I understand the rhythm.

  And if you have ever spent a Thanksgiving at our table, you know that rhythm well. It usually involves my Uncle Frank, a glass of red wine, and the same argument, repeated for about thirty years.

  Frank is a good man, a devout Catholic, and he believes in Natural Law. He believes that if a law is wicked, it isn't really a law at all. It's just a command backed by force. He'll tell you he's channeling Aquinas.

  My mother, on the other hand, is a legal positivist. She's a Hart woman, through and through. And for thirty-one years on the bench, she has held onto one specific, difficult idea: That a law can be perfectly valid—properly enacted, technically binding—and still be monstrous.

  They always circle back to the same example. The "Grudge Informer" cases. After the war, the German courts had to decide what to do with people who had used Nazi statutes to send their neighbors to their deaths, and then claimed afterward that they were just following the law.

  Frank says the courts were right to say, "Those statutes were never valid. An unjust law is no law at all." It's comforting. It keeps the concept of "Law" pure.

  My mother has spent a lifetime saying that comfort is dangerous. She argues that calling those Nazi statutes "not law" is a kind of dishonesty dressed up as virtue. She believes the braver, safer thing is to look that evil in the eye and say, "Yes. That was a law. We made it. We enforced it. And it was wicked."

  For a long time, I thought this was just academic stubbornness. I thought it was her way of winning an argument against Uncle Frank. But watching her work for three decades, I've realized that this isn't just philosophy. It's her moral compass.

  Because if you believe that wicked laws aren't "real" laws, you can pretend the legal system is inherently good. You can pretend that injustice is just an external virus that gets cleared out by defining it away.

  But my mother knows that the legal system is human. She knows that we are capable of writing evil into the code. By insisting that a wicked law is still a law, she forces us to take responsibility for it. She refuses to let the system hide behind semantics. She demands that we admit when the machinery of justice has been used for injustice, so that we can fix the machinery, rather than just pretending it never happened.

  In my line of work, if I find a patch of poisonous ivy in a garden, I don't tell the client, "That isn't actually a plant." I tell them, "That is a plant, and it is poisonous, and we need to dig it out." If I pretend it's a rose, someone gets hurt. My mother has treated the law the same way. She never confused the rule of law with the rule of goodness. She knew they aren't the same thing, and that knowing the difference is the only way to make them align.

  To the clerks and judges here: You know the weight of that distinction. You know that clarity is the only thing that keeps the gavel honest.

  And to the rest of the family, the book club, and the kids: You know the warmth of the woman who holds that distinction. You know that her insistence on hard truths comes from a place of deep care. She never wanted the law to be a shield for power; she wanted it to be a mirror for us.

  Mom, you have spent thirty-one years teaching us that we cannot define evil out of existence just because it makes us uncomfortable. You taught us that honesty is harder than comfort, but it is the only foundation worth building on. You have tended this garden with rigor, with courage, and with an unflinching eye.

  So, if everyone could please raise a glass.

  To Uncle Frank, who I know is listening somewhere, probably shaking his head but smiling.

  And to you, Mom. Thank you for teaching us that the truth doesn't stop being true just because it's difficult. May your retirement be filled with the kind of peace you've earned, and may the only arguments you have from now on be about where to plant the hydrangeas.

  To Judge [Mother's Last Name].
