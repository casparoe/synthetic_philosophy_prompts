answer: |-
  **Setting:** *A bench in the university botanical gardens, late afternoon. The air is crisp. Dr. Elias Adler (retired, methodological adaptationist) and Dr. Mara Voss (active, philosophy of biology) are watching a group of students map the growth patterns of ivy.*

  **Voss:** You know, Elias, I was re-reading Pinker's *How the Mind Works* on the flight over. Specifically the chapter on music. "Auditory cheesecake." It remains one of the most intellectually honest admissions in evolutionary psychology.

  **Adler:** *(Chuckles)* Honest, perhaps. But defeatist. You admire him for throwing in the towel on music?

  **Voss:** I admire him for recognizing that not every universal human trait is a direct target of selection. Pinker argues music is a by-product of language, auditory scene analysis, and emotional circuitry. It harnesses existing machinery. It doesn't require its own dedicated adaptive story. That is exactly the sort of restraint Gould and Lewontin were begging for in '79. It stops the spinning of just-so stories.

  **Adler:** Restraint is virtuous, Mara, but only if it doesn't halt inquiry prematurely. Look at the ivy over there. If I see a leaf orientation that maximizes light capture, my default assumption is selection. Why? Because selection is the only known process that consistently produces complex, functional apparent design. Pinker looks at music—a computationally expensive, developmentally regular, cross-cultural universal involving complex syntax and emotional resonance—and says, "Oh, that's just noise from the language engine." That isn't restraint; that's ignoring the signal.

  **Voss:** But that's the crux of it, isn't it? Your "default assumption." You're treating adaptation as a null hypothesis. But adaptation isn't a null; it's a specific historical claim. To say a trait was selected *for* a function requires evidence of that selective history. Pinker didn't just guess; he pointed out that the neural circuitry required for language *entails* the ability to process pitch and rhythm. If you build a system for syntax, you get music for free. Why posit a second selection event when the architecture of the first explains the phenomenon?

  **Adler:** Because of the cost. Biological tissue is expensive. Neural tissue is exorbitantly expensive. If music were merely a spandrel—a structural necessary consequence of language—why do humans invest so much energy in refining it? Why does it develop on a schedule partially independent of language? A true by-product usually degrades or varies wildly if it's not being maintained by selection. But music is stable. It's universal. To the methodological adaptationist, that stability is the fingerprint of fitness. The burden of proof lies with you to show why selection *didn't* act on it, not on me to prove that it did.

  **Voss:** There it is. The burden of proof. This is the methodological vice Gould identified. You're saying, "Assume design until proven otherwise." But that licenses the construction of narratives that are immune to falsification. If I find a trait, you assume it's adaptive. If I point out it might be a constraint, you ask for genetic proof I can't possibly get from the fossil record. You've rigged the game. Pinker's account is superior because it relies on *positive, independent evidence* of the underlying architecture (language circuits), rather than inferring history from current utility. Just because music *is* useful now—for bonding, for mood regulation—doesn't mean it was selected *for* that. That's the exaptationist fallacy.

  **Adler:** I'm not inferring history from current utility alone; I'm inferring it from complex design. If I find a watch in the woods, I don't say, "Well, maybe the gears just fell together because of the constraints of metal physics." I assume a watchmaker. Methodological adaptationism isn't a dogma that every trait *is* optimal; it's a heuristic that asks, "What if this were designed?" It generates predictions. If music is an adaptation, we should find dedicated neural modules, developmental windows, and fitness correlates. And we *are* finding them. If you start with the spandrel hypothesis, what predictions do you get? "It exists because something else exists." That's a tautology, not a research program.

  **Voss:** My prediction is that you'll find music processing co-localized with language and emotional processing, not in a dedicated "music module." And that is testable. But your point about the watch is the problem. Biology isn't watchmaking. It's tinkering. A spandrel isn't just "noise"; it's a structural consequence of a selected trait. If selection built a large brain for language (the arch), the space for music (the spandrel) comes along. To demand I prove the spandrel *wasn't* selected is to demand I prove a negative. The rigorous stance is to say: "Show me the phylogenetic trajectory. Show me the allele frequency changes linked to musicality specifically, distinct from linguisticity." Until then, assuming adaptation is merely storytelling with a mathematical veneer.

  **Adler:** And waiting for allele frequency changes from the Pleistocene is a recipe for silence. We can't always get the historical record. We have to work with the engineering record. If a trait looks engineered, treat it as engineered until you have a better explanation. "Constraint" is often just a label for "we haven't figured out the adaptive function yet." In the 1970s, the panda's thumb was a classic example of constraint—a clumsy modification of a wrist bone. But even that has functional utility that is maintained by selection. By treating adaptation as the default, I force the constraint theorist to be specific. You have to show *why* the physics or development forces this outcome. Pinker did that for music, I grant you. But he leaned too hard on the "cheesecake" analogy. Cheesecake isn't universal. Music is.

  **Voss:** But universality doesn't prove adaptation. Language is universal. Chewing is universal. Both are adaptations. But the *sound* of language is universal only because the machinery is universal. Music might be the sound of the machinery idling. Your heuristic, Elias, encourages what I call "function creep." You see a current benefit—social cohesion, say—and you retroject it as the historical cause. That is the Panglossian paradigm. It assumes the world is the best of all possible worlds. I'm arguing for a materialist biology. Traits exist because of what the organism *can* build given its ancestry, not just what would be *best* for it to build.

  **Adler:** And I'm arguing for a functional biology. Traits persist because they *do* something. If music is a by-product, it's a very persistent, very costly, very elaborate by-product. At some point, the distinction collapses. If a spandrel is universally maintained across all human populations for 200,000 years, selection is acting on it, even if it started as a by-product. So the question becomes: did selection shape the *specifics* of music? My method says: assume yes, test for it. Your method says: assume no, unless you have a time machine. Which one actually produces knowledge?

  **Voss:** Yours produces stories. Mine produces skepticism. And skepticism is the only guard against confirmation bias. If you start with the assumption of design, you will find design. You'll interpret every neural correlation as a module, every behavioral regularity as a strategy. Pinker's "cheesecake" hypothesis forces us to look at the *construction* of the mind, not just the *utility* of its outputs. It asks, "What else had to be built first?" That is a more rigorous question than "What is this for?" because "What is this for?" can be answered for anything. Even useless things have a use if you look hard enough.

  **Adler:** And "What had to be built first?" can be answered for anything too. It's infinite regress. Why language? Because of social grooming. Why social grooming? Because of group size. Eventually, you hit a trait that is there because it solved a problem. Why not start there? Look, Mara, I don't think every trait is a perfect adaptation. But the spandrels paper, for all its brilliance, offered a critique without a clear method. How do we *quantify* constraint? How do we weigh it against selection? Methodological adaptationism gives us a scale: fitness. Constraint theory gives us... plausibility.

  **Voss:** Constraint gives us mechanism. Selection gives us outcome. If you ignore the mechanism—the developmental constraints, the phylogenetic inertia—you don't understand the biology. You understand the marketing. You're selling the trait's utility, not explaining its existence. Pinker showed that music exists because the brain is a certain kind of machine. You want to say music exists because it helped ancestors mate. Both might be true, but yours is the one that requires the leap of faith. I require the evidence of the architecture.

  **Adler:** And I require the evidence of the design. If the architecture is so specific, so costly, and so universal, the "architecture" *is* the design. We're circling the same data, Mara. You see a structural necessity; I see a selected solution.

  **Voss:** Because you're trained to see solutions. I'm trained to see history. And until adaptationists accept that "current utility" is not "evolutionary function," we'll keep talking past each other. Pinker was right to call it cheesecake. It's delicious, we all love it, but it wasn't the reason the bakery was built.

  **Adler:** *(Stands up, brushing leaves from his coat)* And I maintain that if everyone buys the cheesecake, every day, for 200,000 years, the bakery owner starts baking it on purpose. The default must be design, Mara. Otherwise, we're just cataloging accidents.

  **Voss:** *(Remains seated, watching the ivy)* And if we assume design, we'll never find the accidents. And biology is full of them.

  *(They nod, a silent acknowledgment that the gap between their starting axioms is unbridgeable, and walk in opposite directions down the garden path.)*
