      *   *Ruth:* The Killer Blow. She needs to point out that his "direct reference" relies on a causal chain he can't access. He's just as dependent on a "mode" as she is, he just ignores it.
      *   *Ending:* Needs to feel unresolved but respectful of the intellect. A nod to the advisor.

  6.  **Polishing the Voice:**
