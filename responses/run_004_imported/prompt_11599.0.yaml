      *   Ruth's best move: Accept rigidity but argue that *cognitive access* still requires a mode of presentation. Even if "Hesperus" rigidly designates Venus, I can't think about Venus *as Venus* without a mode of presentation. Owen's view works for logic, not for thinkers.
