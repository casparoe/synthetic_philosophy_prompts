      *Self-Correction on Ruth's Argument:* If she just says "sense isn't description," Owen will say "Then what is it? Magic?" She needs to argue that *reference determination* is one thing, but *cognitive significance* is semantic enough to matter. Or she attacks the Millian handling of negative existentials or belief reports. Let's go with the Belief Report angle—it's the strongest Fregean bastion. If names are just objects, "Lois believes Superman flies" and "Lois believes Clark Kent flies" have the same truth conditions. But they don't. Owen will say "That's pragmatics." Ruth needs to show why that distinction collapses under pressure.

      *Better Sharp Comeback:* Ruth should point out that Owen's "direct contact" with the object is an illusion. He thinks he's touching the world, but he's still trapped in language. The "causal chain" is just a socialized sense.

