      *   **Tone:** Intellectual sparring, underlying personal history, immediate slide into old argument.

  2.  **Deconstruct the Philosophy:**
      *   **Fregean View (Ruth):** Names have sense (*Sinn*) and reference (*Bedeutung*). The sense is the mode of presentation. "Hesperus" and "Phosphorus" have different senses (evening star vs. morning star) but the same reference (Venus). This explains cognitive significance (why it's informative).
      *   **Millian/Kripkean View (Owen):** Names are rigid designators. They refer to the same object in all possible worlds where that object exists. Descriptions are non-rigid. Therefore, names cannot be synonymous with descriptions. Meaning just *is* reference. Cognitive significance is a psychological/pragmatic issue, not a semantic one.
      *   **The Conflict:** Owen will attack the semantic status of "sense." Ruth needs to defend the necessity of something *like* sense without falling into the trap of equating it directly with a contingent definite description (which Kripke demolished). She needs to pivot to something like *guises*, *files*, or a neo-Fregean take that accepts rigidity but maintains cognitive content.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Owen needs to strike first. Establish the dynamic. He's confident, maybe a bit brash (corporate guy who wins bar arguments). She's sharp, defensive but ready (academic who lives this stuff).
