answer: |-
  "Still chasing senses, Ruth? Or did you finally let them go when he died?"

  "Nice. Really nice. Is this how you close deals now? Ambush the widow before the cork is even out of the memorial wine?"

  "I'm asking a question. Twelve years. You published the book. I saw the review. You're still holding the line. Fregean senses. Modes of presentation. Like nothing happened in the seventies."

  "Nothing happened in the seventies that fixed the problem, Owen. Kripke showed names aren't synonymous with descriptions. He didn't show they lack cognitive significance."

  "Come on. Rigidity kills sense. If 'Hesperus' just meant 'the brightest object in the evening sky,' then in a possible world where Mars is brighter, 'Hesperus' would be Mars. But it's not. In every world where Venus exists, 'Hesperus' is Venus. The name goes directly to the object. It doesn't stop at a sense booth on the way in. So where is this sense hiding? Because if it doesn't determine reference, what work is it doing?"

  "It's doing the work of explaining how a rational agent can believe Hesperus is visible without believing Phosphorus is visible. If meaning is just reference, then those two beliefs are identical. You're saying the astronomer is believing the same proposition twice but feeling differently about it. That's not semantics, Owen, that's psychology. You're outsourcing the puzzle to a different department."

  "I'm not outsourcing it. I'm dissolving it. The puzzle exists because you think semantic content has to mirror cognitive grip. It doesn't. Semantics is about the world. Cognitive grip is about the head. Keep them separate. 'Hesperus is Phosphorus' is informative because I learn something about the words, not the world. It's metalinguistic. I learn that two tags are stuck to the same thing."

  "That's desperate. Even you have to know that's desperate. When the Babylonian looked up and realized the morning star was the evening star, he didn't think, 'Ah, a linguistic convention.' He thought he found something out about the sky. He changed his mind about Venus, not his dictionary."

  "He changed his mind about the causal chains. He realized chain A and chain B terminate at the same object. That's a fact about the world, sure. But the *meaning* of the names was fixed the moment the baptism happened. The sense is redundant. It's a ghost wheel. It spins, it makes noise, but it doesn't engage the gears."

  "Redundant? You think access is redundant? You talk about causal chains like you have a map of them. You don't. You're standing at a party in a hotel ballroom in New Jersey. You have no idea what the causal chain is linking your use of 'Aristotle' to the man himself. You're trusting a community. You're trusting a history."

  "I'm trusting the link. I don't need to know the mechanics of gravity to jump."

  "But you do need to know the mechanics to explain the jump. Look, you say the name goes directly to the object. Fine. Rigidity granted. But *you* don't go directly to the object. You go via a mode of presentation. You think about Venus *as* the evening star. That mode isn't a description that fixes the reference across all worlds, I'll give you that. It's a guiser. It's how the object is given to you. If you strip that away, you don't have a theory of language anymore. You have a theory of labeling."

  "Labeling is enough. Why complicate the ontology? You want these free-floating senses. Where are they? Are they abstract objects? Mental representations? If they're mental, they're private. If they're private, how do we communicate? If I have my Hesperus-sense and you have yours, and they differ, how do we ever agree on 'Hesperus is Phosphorus'?"

  "Because the reference is the same. That's the point of the dualism. Sense varies, reference stays fixed. That's how we communicate despite having different cognitive accesses. You, apparently, think we communicate because we're all magically latched onto the same substance without any mediating interface. It's mysticism, Owen. You accuse me of ghosts, but your 'direct reference' is pure magic. You think you're touching the world. You're not. You're touching a network of social practices."

  "Social practices are public. Senses are in the head. I'd rather build a theory on what we can share than what you hoard in your skull."

  "And yet, here you are, arguing with me. Not with my skull. With me. You're assuming I understand what you mean by 'rigidity.' You're assuming I grasp the sense of your words. If your theory were true, you'd just be making noises at me until the causal chains lined up. But you're trying to persuade me. You're appealing to my rationality. And rationality requires senses. It requires that I can entertain a proposition under one aspect and reject it under another without being logically inconsistent."

  "You're conflating rationality with semantics again."

  "I'm conflating them because language is for thinkers! If your semantics makes the ancient astronomers look irrational for discovering an identity, your semantics is broken. You're saving the theory by sacrificing the agent. You turn the astronomer into a robot who just swaps tags. I'm keeping the astronomer."

  "The astronomer isn't irrational. He's just ignorant of the identity. Ignorance isn't irrationality."

  "It is if the only thing he knows is the reference. If 'Hesperus' means Venus and 'Phosphorus' means Venus, then 'Hesperus is not Phosphorus' is a contradiction. It's 'Venus is not Venus.' So when he asserts it, he's asserting a contradiction. You're saying every false identity statement is a logical contradiction. That makes error impossible. It makes misunderstanding impossible. It makes us infallible about logic and blind to the world."

  "We're infallible about logic. That's the point."

  "No. We're fallible about connections. And that's what sense tracks. Look, you quit. You left. You went into business where maybe 'the bottom line' is the only reference that matters. Where efficiency counts and the route doesn't matter. But in philosophy, the route *is* the point. How we get to the truth matters as much as the truth itself. Frege knew that. Kripke didn't erase it, he just complicated the reference fixing."

  "Kripke erased the need for sense as a semantic value. That's the breakthrough. You're clinging to it because it's what he taught us. What he taught *you*. You stayed in the department. You kept the faith. I looked at the machinery and saw it wasn't needed."

  "I stayed because someone had to finish the argument. You left because you got bored when it stopped being about winning and started being about explaining."

  "Is that what you think this is? Winning? I'm trying to tell you that you're defending a ghost. A sense that doesn't determine reference is just a feeling. It's qualia. It's not philosophy."

  "And a reference without a mode of access is a thing-in-itself. Kant showed us we can't talk about those. You're trying to talk about the world from nowhere. From God's view. But we aren't God. We're here. In this room. With these words. And when I say 'Hesperus,' I mean the evening star. Not because I define it that way, but because that's how I find it. If you take that away, you take away the finder. And if you take away the finder, you don't have language anymore. You have a catalog."

  "A catalog is useful."

  "A catalog is dead. And he's dead. And you're standing here treating his life's work like a bar bet."

  "He loved the argument, Ruth. You know he did. He didn't care about the faith. He cared about the hit. Did I land it?"

  "You landed something. But you didn't kill the sense. You just proved you don't know how to use it."

  "Maybe. Or maybe you just don't know how to let it go."

  "Pass me your glass."

  "What?"

  "Your glass. It's empty. If meaning is just reference, you should be able to hand me the reference directly. But you can't. You have to hand me the glass. The mode of presentation matters, Owen. Even for whiskey."

  "Touché. But don't think this means I'm conceding the Hesperus point."

  "Drink your whiskey, Owen. The stars aren't coming out tonight."
