          *   Payoffs: Share/Share = $0 net (get $20 back), Steal/Steal = -$20 net (money to charity), Steal/Share = +$20 net (stealer), Share/Steal = -$20 net (sharer). *Correction:* Wait, let's re-read the payoff structure carefully.
          *   *Re-reading Payoffs:* "Both share -> you each just get your $20 back." (Net gain $0). "Both steal -> the money's gone." (Net gain -$20). "One steals while the other shares -> the stealer walks with the full $40 and the other person gets nothing." (Stealer Net +$20, Sharer Net -$20).
          *   *Wait, is this a standard PD?* In standard PD, Mutual Cooperation > Mutual Defection. Here: Share/Share ($0) > Steal/Steal (-$20). Yes. Temptation (Steal while other Shares) > Mutual Cooperation > Mutual Defection > Sucker (Share while other Steals). Yes, this is a valid PD structure.
      *   **The Arguments:**
