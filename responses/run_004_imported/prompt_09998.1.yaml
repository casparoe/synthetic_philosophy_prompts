      *   5. **Logical Causality vs. Physical Causality:** The core philosophical divide. CDT says my hand doesn't cause your hand. TDT says my decision *logically* causes your decision if we are similar.
      *   *Key Insight:* Superrationality doesn't work by magic. It works by *predictive accuracy*. If I know you are like me, I know my choice predicts yours. But if I know you are a defector, superrationality dictates I defect too. Farah made the mistake of assuming symmetry *without* establishing Owen's algorithm first.

