      *   *Farah's Weakness:* She assumed Owen was running the "Share" algorithm. He proved he was running the "Steal" algorithm. Superrationality says "Do what you want the other copy to do." If Owen is a copy that defects, you should defect. Farah treated "Superrationality" as "Cooperate," but it actually means "Mirror."
      *   *The "Bigger Point":* Superrationality isn't a magic spell that forces cooperation. It's a mirror. If you look in the mirror and see a defector, you defect. Farah looked in the mirror and saw a cooperator, but Owen wasn't holding the same mirror.
