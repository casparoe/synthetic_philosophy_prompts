      *   2. **The "Common Knowledge" requirement:** Superrationality requires *common knowledge* of superrationality. Does Owen *believe* Farah is superrational? Does Farah *believe* Owen believes it?
      *   3. **Pre-commitment/Signaling:** In a real-world setting (game night), it's not truly one-shot. There's social fallout.
