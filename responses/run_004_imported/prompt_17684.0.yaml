      *   *Refining the "Screening" vs. "Signaling" point:* In biology, these are often two sides of the same coin (Signaling Theory encompasses screening). However, the user asks how to tell them apart. I should frame it as: Signaling focuses on the *information transfer* (I am loyal), Screening focuses on the *barrier* (Only loyal can pass). The Handicap Principle specifically explains *why the barrier is costly* (to prevent faking).
      *   *Refining the "Cognitive Dissonance" point:* This is the strongest alternative hypothesis. I need to make sure the distinction is clear: Pre-existing trait (Signaling) vs. Post-hoc rationalization (Dissonance).
      *   *Ethical Note:* Crucial. Explaining *why* something exists evolutionarily is not saying it is *good* or *moral*. Hazing can be maladaptive in modern contexts.

  6.  **Final Review against User Prompt:**
