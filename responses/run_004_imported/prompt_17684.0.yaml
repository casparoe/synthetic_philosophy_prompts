  7.  **Final Polish:** Ensure terms like "fitness," "free-rider," "asymmetric cost," and "effort justification" are used correctly. (Self-correction: Make sure not to imply hazing is *always* adaptive; modern hazing often exceeds functional signaling and becomes pathological.)

  8.  *(Self-Correction during drafting)*: I should explicitly mention Sosis & Bressler (2003) or similar anthropological work as a mental anchor, even if I don't cite it formally, to ground the "anthropologist" claim the professor made. (Decided: Keep it conceptual as requested, but mention that this is a established subfield).

