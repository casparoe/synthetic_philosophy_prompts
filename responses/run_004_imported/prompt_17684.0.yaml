prompt: |-
  For my behavioral ecology class we've spent the last couple of weeks on signaling theory and we just finished the section on Zahavi's handicap principle -- peacocks tails, stotting in gazelles, that whole family of examples where a costly trait or display is supposedly kept honest because only high-quality individuals can afford to produce it. At the very end of lecture my professor mentioned almost as an aside that some anthropologists apply basically the same logic to explain costly human rituals, and specifically namedropped fraternity/sorority hazing as an example, then immediately moved on to the next slide before anyone could really ask about it. I'm not in a frat or anything but my roommate is going through rush right now and has been telling me some genuinely rough stories about what the pledges have to do, so the comment's been stuck in my head since.

  What I'm trying to figure out is: what are the most important implications of the handicap principle if you actually try to take it seriously as an explanation for something like hazing? Zahavi and Grafen's whole argument for why the signal stays honest depends on the cost being differentially harder for low-quality individuals to bear at equilibrium -- but a pledge isn't signaling their quality to some external chooser the way a peacock signals to a picky peahen, they're signaling (if that's even the right word) to the very group they're trying to get into. Does that switch in who the "audience" is mess with the logic at all? And how would you even tell apart "this ritual is functioning as an honest costly signal of commitment" from it just being a screening device that filters out low-commitment people before they join, versus something more like the classic cognitive-dissonance story where the suffering itself is what makes pledges like the group more afterward? Not asking for a full lit review, just want the main conceptual takeaways so I have something halfway coherent to say next time this comes up in section.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
