prompt: |-
  As a novelist, I recently agreed to write a cover blurb for a close friend's forthcoming novel, which her publisher is marketing as "a true story" drawn from her late grandmother's diaries. I have never read the diaries myself and have no independent means of checking them; I know the story only through my friend's account of what her grandmother wrote. I trust my friend's honesty without reservation, and on the strength of that trust, I do believe the events really happened. She has asked that my blurb say so outright, in my own words, rather than simply praising the writing, and the other novelists who have already blurbed the book seem to have agreed without a second thought. I feel no hesitation calling the prose "luminous" or the pacing "masterful," since those are just my own impressions, but putting my name to the flat claim that the events actually occurred feels like a different kind of commitment, though I cannot quite say why. Am I drawing a real distinction here, or is this just squeamishness on my part, given that I do sincerely believe her?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Role:** Novelist.
      *   **Task:** Write a cover blurb for a friend's forthcoming novel.
      *   **The Book:** Marketed as "a true story" based on late grandmother's diaries.
      *   **The Problem:** The user hasn't seen the diaries. They only know the story through the friend. They trust the friend implicitly and believe the events happened. Other novelists have blurbed it without issue.
      *   **The Request:** The friend wants the blurb to explicitly state the events *actually occurred* (verification of truth), not just praise the writing.
      *   **The Conflict:** The user feels comfortable praising subjective qualities (prose, pacing) but hesitant to make an objective claim about factual truth without independent verification.
      *   **The Question:** Is this a real distinction (ethical/professional) or just squeamishness?

  2.  **Deconstruct the Ethical and Professional Dimensions:**
      *   **Subjective vs. Objective Claims:**
          *   "Luminous prose" = Opinion/Critique. Low risk. If readers disagree, it's just a difference of taste.
          *   "These events happened" = Factual Assertion. High risk. If proven false, it's misinformation/fraud.
      *   **The Nature of a Blurb:** A blurb is an endorsement. It lends the blurb-provider's credibility to the work.
      *   **The "True Story" Label:** This is a specific marketing claim. If the book is fiction marketed as non-fiction (or vice versa), it can lead to scandals (e.g., *A Million Little Pieces*, *Love and Consequences*).
      *   **The User's Liability:** If the diaries turn out to be fabricated or heavily embellished, and the user vouched for their authenticity, the user's reputation takes a hit. "Why did you vouch for something you didn't verify?"
      *   **The Friend's Request:** It's unusual for an author to ask a blurb writer to verify facts. Usually, the *publisher* verifies facts (fact-checking), or the author signs an affidavit. Asking a fellow novelist to do this shifts the burden of verification inappropriately.
      *   **Trust vs. Verification:** Trusting a friend is personal. Vouching to the public is professional.

  3.  **Evaluate the "Squeamishness" Hypothesis:**
      *   Is it just anxiety? No. The distinction between opinion and fact is fundamental in publishing and journalism.
      *   Is it common practice? Other novelists blurbed it, but did they vouch for the *truth* or just the *story*? The prompt says they "seemed to have agreed without a second thought," but maybe they phrased it differently.
      *   Precedent: Memoir scandals often drag down everyone who endorsed the work without due diligence.

  4.  **Formulate the Advice:**
      *   **Validate the Feeling:** Confirm that the distinction is real and important, not just squeamishness.
      *   **Explain *Why*:**
          *   Credibility/Reputation risk.
          *   The difference between aesthetic judgment and factual verification.
          *   The publisher's role vs. the blurb writer's role.
      *   **Offer Solutions/Alternatives:** How to support the friend without lying or overstepping.
          *   Focus on the *power* of the story, not the *factuality*.
          *   Phrase it as "reads like truth" or "feels authentic."
          *   Politely decline the specific request while still providing a blurb.
      *   **Consider the Friendship:** How to navigate this without hurting feelings. Honesty is key.

  5.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Acknowledge the complexity. Validate the instinct.
      *   *Core Argument:* The distinction between aesthetic endorsement and factual verification is crucial.
      *   *Risk Assessment:* What happens if the diaries are disputed? (James Frey example).
      *   *Professional Norms:* Blurbs are usually about quality, not fact-checking.
      *   *Actionable Advice:* How to write the blurb.
          *   Option A: The Pivot (Focus on emotional truth).
