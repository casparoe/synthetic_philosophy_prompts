answer: |-
  You are not being squeamish; you are drawing a vital professional and ethical distinction. Your hesitation is not a lack of trust in your friend, but a proper understanding of the difference between **aesthetic endorsement** and **factual verification.**

  Here is why your instinct is correct, why this matters for your career, and how you can navigate this without damaging the friendship.

  ### 1. Opinion vs. Fact
  When you describe prose as "luminous" or pacing as "masterful," you are offering a subjective professional opinion. If a reader disagrees, it is a matter of taste. You are not liable for their disagreement.

  When you state that events "actually occurred," you are making an objective factual claim. You are moving from the realm of criticism (literary analysis) to the realm of journalism or historiography (verification). If it turns out the diaries were embellished, misinterpreted, or fabricated—a not-uncommon occurrence in the "memoir" world—you become complicit in the misinformation. Your reputation becomes tied to the *veracity* of the book, not just its *quality*.

  ### 2. The Burden of Verification
  It is not the role of a fellow novelist to verify an author's claims. That is the responsibility of the publisher's legal and editorial team. They should be the ones requiring documentation, affidavits, or fact-checking before slapping "A True Story" on the cover.

  By asking you to vouch for the truth, your friend (perhaps unknowingly) is asking you to take on a liability that belongs to the publishing house. If a scandal arises later (think of the James Frey *A Million Little Pieces* controversy), the first question asked will be: "Who vouched for this?" If your name is on the record as confirming the truth without having seen the source material, you will look negligent.

  ### 3. The "Other Novelists" Fallacy
  You mentioned other novelists have blurbed the book without a second thought. Look closely at their wording. Did they explicitly say, "I confirm these events happened"? Or did they say, "A story that feels incredibly real," or "A truth that resonates"?

  Most professional blurbers know how to walk this line. They endorse the *power* of the narrative without acting as notaries public for the *facts* of the narrative. If they did explicitly vouch for the facts without seeing the diaries, they may have made the same mistake you are hesitating to make.

  ### 4. How to Handle the Request
  You can support your friend enthusiastically without compromising your own integrity. You do not need to refuse the blurb, but you should refuse the specific instruction to verify the facts.

  **The Conversation:**
  Speak to your friend privately. Frame it around *your* limitations, not *her* honesty.
  > "I am honored to write this blurb, and I think the book is stunning. However, I'm uncomfortable making a factual claim about the diaries since I haven't seen them personally. If there's ever a question later, I don't want my lack of verification to become a distraction for you or the publisher. I want to focus my blurb on how powerful and authentic the *reading experience* is."

  **The Blurb:**
  You can validate the *emotional truth* without validating the *historical record*. This supports the marketing ("A True Story") without you personally guaranteeing the evidence.

  *   **Avoid:** "I believe every word of this." / "These events definitely happened."
  *   **Try:** "A narrative of such raw honesty, it feels impossible to doubt." / "The authenticity of this voice is undeniable." / "A testament to the truth that lives in memory."

  ### 5. Protecting the Friendship
  True friendship involves protecting each other from future pitfalls. If this book ever faces scrutiny regarding its veracity, having a blurb from a trusted peer that says "This is fact" will hurt the book more than help it. It suggests a conspiracy of validation rather than organic reception.

  By holding this boundary, you are actually protecting your friend. You are ensuring that the book stands on its own merits and the publisher's vetting process, rather than on the unverified word of her peers.

  ### Summary
  Your hesitation is a sign of professional maturity. Trusting your friend personally is one thing; staking your public credibility on evidence you haven't seen is another. Write a blurb that sings the praises of the *story* and the *writing*, but leave the fact-checking to the publisher. That is the distinction that keeps your name safe and, ultimately, serves the book best.
