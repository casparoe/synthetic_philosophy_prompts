      *   **Ergodicity Economics (EE):** Maximize time-average growth rate $\bar{g} = \lim_{T\to\infty} \frac{1}{T} \ln(W_T/W_0)$. This is dynamic. It claims to derive $u(W) = \ln(W)$ from the dynamics of wealth, not psychology.
