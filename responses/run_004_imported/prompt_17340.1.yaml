answer: |-
  This is a fantastic question, and given your 35 years in the field, you know better than most that the rubber meets the road when you're knee-deep in mud trying to figure out why a specific morphological trait exists. It is also a delight to discuss Aristotle with someone who knows he actually cut animals open, rather than just imagining them from an armchair.

  If we dropped Aristotle into a modern seminar on the etiological (Wright/Neander) vs. causal-role (Cummins) debate, I suspect he would pull up a stool, wipe his hands on a rag, and tell **both** camps that they are mangling the concept of a final cause (*telos*), though he would likely find the etiological camp slightly less confused than the systemic one.

  Here is how I think he would parse it, based on the *Physics* and the *Parts of Animals*.

  ### 1. He would reject Cummins (Systemic) for making function relative to the observer.
  For Cummins, the function of the heart depends on the containing system you are analyzing. If the system is the circulatory network, the function is pumping. If the system is a diagnostic context, the function is making noise.

  Aristotle would find this deeply unsatisfying, perhaps even absurd. For Aristotle, teleology is **immanent**, not imposed. The *telos* of an organ is intrinsic to the organism itself, not relative to the interests of a biologist or a doctor.

  In *Parts of Animals*, Aristotle is quite clear that while some features are accidental (*sumbebēkos*), the essential features are for the sake of the life of the organism. The thumping noise is an inevitable byproduct of the mechanics, but it is not the *end* for which the heart exists. To say the heart's function is "making noise for a doctor" would be to confuse an accidental consequence with a final cause. Aristotle would argue that Cummins has conflated "what a thing *can* do" with "what a thing is *for*." For Aristotle, the "for" is objective. The heart is *for* the sake of maintaining the vital heat and circulation of the animal, regardless of whether a doctor is listening.

  ### 2. He would find Wright/Neander (Etiological) closer, but mechanistically confused.
  The etiological account says: The heart's function is to pump blood *because* hearts that pumped blood were selected for in the past.

  Aristotle would nod at the conclusion but recoil at the mechanism.
  *   **The Agreement:** He agrees that the presence of the organ is explained by its function. The explanation "We have hearts in order to pump blood" is valid. In that sense, he aligns with the etiological view that function explains presence.
  *   **The Disagreement:** Aristotle does not have a concept of natural selection (variation + differential reproduction over deep time). He believes species are eternal forms. There is no "ancestral history" in the Darwinian sense.

  For Aristotle, the heart is there because of **hypothetical necessity**. *If* there is to be an animal of this kind, *then* there must be a heart to sustain its life. The "because" isn't a historical record of survival; it's a logical relationship between the Form of the animal and the materials required to actualize that Form.

  He would likely argue that Wright and Neander are trying to reduce the final cause to an **efficient cause** (the historical chain of selection events). They are trying to "naturalize" teleology by hiding it inside history. Aristotle would say you can't hide it; it's right there in the development of the embryo. The heart develops *for the sake of* the adult organism. The end is present in the beginning, potentially.

  ### 3. The Verdict: "You are mangling the Final Cause."
  Here is the crux of it: The modern debate (Wright vs. Cummins) is largely a struggle to reconcile teleological language with a mechanistic, non-teleological universe. Both sides are trying to figure out how we can talk about "function" without admitting that nature actually has "purposes."

  *   **Cummins** saves function by making it a heuristic tool for analysts (it's in our heads).
  *   **Wright/Neander** save function by making it a fossilized record of past efficiency (it's in the history).

  Aristotle would step in and say: **"Why are you apologizing?"**

  For Aristotle, final causality is a brute fact of nature (*physis*). Nature acts for an end. It isn't a conscious intent (he mocks Empedocles for thinking teeth grew *so that* we could chew, as if nature deliberated), but it is a regular, directed process toward an actualization of form.

  He would likely tell the modern philosophers that by trying to strip the "purpose" out of function to make it safe for science, they have stripped the phenomenon itself out of the explanation.
  *   To Cummins, he'd say: "You have made function arbitrary. If function is relative to the system, there is no biological reality to the organism, only to the analyst's perspective."
  *   To Wright/Neander, he'd say: "You have correctly identified that function explains presence, but you have mistaken the *history of survival* for the *nature of the thing*. You are looking at the efficient causes (selection) and calling it a final cause."

  ### The "Field Biologist" Connection
  Given your background, I think you'd appreciate this specific Aristotelian critique: He would say that both modern camps are treating the organism as a machine assembled from parts, rather than a unified whole.

  In the *etiological* view, the heart is a part that survived. In the *systemic* view, it's a component contributing to a capacity. For Aristotle, the heart is an organ (*organon* = tool) of the soul (*psyche* = life principle). Its function is defined by its role in the **life activities** of that specific being.

  So, if forced to choose? He would side with the **Etiological camp on the objectivity of function** (it's real, not relative), but he would reject their **historical grounding**.

  He would ultimately conclude that we are mangling the final cause by trying to define it without reference to the **Good** of the organism. For Aristotle, the function of the heart is to pump blood because that contributes to the *flourishing* (the good) of the animal. Neither Cummins nor Wright talks about the "good" of the animal; one talks about system capacity, the other about reproductive history.

  Aristotle would probably pour a glass of wine, gesture to his dissection table, and say: *"The heart is for the sake of the life of the animal. Not because its ancestors survived, and not because you find it useful for your models. But because without it, the animal cannot be. Stop overthinking it and look at the embryo."*
