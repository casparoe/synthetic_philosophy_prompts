answer: |-
  The core of McMahan's revisionist project rests on a specific metaphysical claim about moral liability: liability to defensive harm is generated by responsibility for an *objectively* unjust threat. From this, he derives the inference that troubles you: because the permissibility of killing depends on the objective justice of the cause (a fact-relative matter), and because individual soldiers often lack access to that fact, their reasonable belief in the justice of their cause can at best excuse them (rendering them non-blameworthy) but cannot justify the act (rendering it permissible).

  To recover something like the Moral Equality of Combatants (MEC) within a liability-based framework, we must block the inference that **Fact-Relative Impermissibility $\rightarrow$ Act-Type Impermissibility for the Agent.**

  The strongest argument against McMahan here does not rely on pragmatic legal concerns (Walzer's approach) nor does it simply retreat to subjectivism. Instead, it challenges McMahan's conception of what constitutes an "unjust threat" in the context of **epistemically constrained, delegated agency.** The argument is that for a combatant operating within a legitimate chain of command, the *objective moral permissibility* of their use of force is constituted by their adherence to evidence-relative norms, not fact-relative outcomes. Therefore, a soldier fighting for an objectively unjust cause but on reasonable evidence of justice does not merely have an *excuse*; they possess a *justification*, because they do not pose a "wrongful" threat in the sense required to generate liability.

  Here is the construction of that argument, broken down into its normative components.

  ### 1. The Nature of the Threat: Wrongfulness vs. Unluckiness

  McMahan's inference relies on the premise that a threat is "unjust" simply if it opposes the side that is *actually* in the right. On this view, if State A is objectively aggressing against State B, every soldier in A's army poses an unjust threat, regardless of what they know. Their ignorance makes them non-culpable, but the threat itself remains morally "tainted."

  We can block this by distinguishing between a **materially unjust threat** and a **normatively wrongful threat**.
  *   **Materially Unjust:** The threat opposes the side that is, as a matter of fact, in the right.
  *   **Normatively Wrongful:** The threat violates a moral duty owed to the victim.

  McMahan assumes these two categories collapse: if you pose a materially unjust threat, you necessarily violate a duty. I argue they come apart in cases of non-culpable epistemic asymmetry. A moral duty to refrain from killing is only incurred if the agent has, or could reasonably have, access to the facts that make the killing prohibited. If the moral reality is opaque to the agent through no fault of their own, they cannot be under a duty to conform to that hidden reality.

  Therefore, an unjust combatant who fights on reasonable evidence poses a *materially* unjust threat, but not a *normatively wrongful* one. Since liability tracks responsibility for *wrongful* harm (not just *unlucky* harm), the unjust combatant is not liable. If they are not liable, and they are following the rules of war, their action is objectively permissible.

  ### 2. The Division of Normative Labor

  To make this concrete, we must look at the structure of military agency. Modern warfare is not a collection of individual duels; it is a collective enterprise characterized by a **division of normative labor**.

  *   **Political/Strategic Level:** Charged with *jus ad bellum* determinations. They have access to intelligence, diplomatic context, and long-term strategic goals.
  *   **Tactical Level (Combatants):** Charged with *jus in bello* compliance. They are structurally excluded from *ad bellum* decision-making.

  In this structure, the "objective duty" of the combatant is not to ensure the war is just (which is outside their competence), but to ensure their participation is authorized by the legitimate procedure for determining justice.

  McMahan treats the soldier as an independent moral agent who happens to be in uniform. He assesses their permissibility as if they were a private citizen intervening in a brawl. But the soldier is more akin to a juror or a police officer.
  *   *Analogy:* Consider a police officer who executes a warrant issued by a judge. If the judge made a legal error in issuing the warrant (perhaps based on flawed but reasonable evidence), and the officer arrests the suspect, has the officer committed an objectively impermissible act (false imprisonment) that is merely excused?
  *   *Application:* Most legal and moral systems say no. The officer's action is *justified* because their normative horizon is limited to the validity of the warrant, not the ultimate guilt of the suspect. The "objective permissibility" of the arrest is relative to the officer's role-defined epistemic access.

  Similarly, the combatant's objective moral duty is to obey lawful orders from a legitimate authority, provided there is no manifest evidence of criminality. If the state lies or is mistaken about *jus ad bellum*, the moral failure lies at the level of the authority, not the instrument. To claim the soldier's act is "objectively impermissible" is to ignore that the soldier's moral agency is *scaffolded* by the institution. The act is not "killing for an unjust cause"; the act is "killing in accordance with legitimate epistemic authority." Described *that* way, the act is permissible even if the cause is factually unjust.

  ### 3. Blocking the Inference: Prospective vs. Retrospective Justification

  This brings us to the specific point where we must block McMahan's inference: **"Reasonable Belief $\neq$ Truth $\rightarrow$ Merely Excused."**

  McMahan's logic assumes that **Justification** is exclusively *retrospective* and *fact-relative*. An act is justified only if, looking back from the end of history, it aligned with the moral truth. If it didn't, the best we can say is that the agent wasn't blameworthy (Excuse).

  I propose that for agents acting under radical uncertainty, **Justification** is properly understood as *prospective* and *evidence-relative*.
  *   **The Block:** The inference fails because it conflates the *success condition* of an act with the *permissibility condition* of an act.
      *   *Success Condition:* Did the act achieve the morally optimal outcome? (Fact-relative)
      *   *Permissibility Condition:* Did the agent utilize the correct decision procedure given their epistemic constraints? (Evidence-relative)

  In the ethics of war, we cannot demand that soldiers meet the Success Condition to be justified, because doing so renders the concept of "permissible action" empty for anyone without omniscience. If morality is action-guiding, it must provide standards that agents can actually follow. If a soldier follows every available epistemic norm, consults the legitimate authority, and finds no manifest evidence of injustice, they have satisfied the Permissibility Condition.

  McMahan wants to say: "You satisfied the Permissibility Condition, but failed the Success Condition, so you acted impermissibly (but are excused)."
  The counter-argument is: "In contexts of delegated agency under uncertainty, satisfying the Permissibility Condition *is what it means* to act permissibly. The Success Condition is relevant for assessing the *leaders*, not the *agents*."

  Therefore, the move from "Reasonable Belief" to "Justification" is blocked only if we insist on a God's-eye view of moral permissibility. If we adopt a human-scale view of moral permissibility—one that respects the epistemic boundaries of the agent—then reasonable belief *does* constitute justification.

  ### 4. Recovering Moral Equality

  If this argument holds, we recover a robust version of MEC without abandoning the liability framework.

  1.  **Symmetry of Epistemic Position:** Both Just and Unjust combatants typically face the same epistemic fog. Neither can reliably determine the objective justice of the cause from the front lines.
  2.  **Symmetry of Normative Status:** Since objective permissibility is evidence-relative for combatants, both sets of combatants are acting permissibly if they fight on reasonable belief and observe *jus in bello*.
  3.  **Symmetry of Liability:** Since neither set of combatants poses a *normatively wrongful* threat (only a materially unjust one, which is not their fault), neither is liable to be killed by the other *based solely on the justice of their cause*.

  This does not mean everyone is immune. Unjust combatants who *know* their war is unjust (or should know, e.g., manifest aggression) do pose wrongful threats and are liable. Just combatants who violate *jus in bello* pose wrongful threats and are liable. But the "default" status of the ordinary soldier on both sides is non-liable and justified.

  ### Conclusion: Why This Beats the "Excuse" Move

  McMahan's distinction preserves a clean metaphysical link between "Justice" and "Permission," but it does so at the cost of making moral permissibility irrelevant to the actual decision-making of soldiers. If a soldier is told, "You are objectively acting impermissibly, but we won't blame you," the moral guidance has failed.

  By arguing that the epistemic situation *constitutes* the objective duty, we show that the inference from "False Belief" to "Impermissible Act" is a category error. It treats the soldier as a causal vector of harm rather than a moral agent embedded in a structure of authority.

  The argument blocks McMahan's inference at the definition of **Wrongful Threat**.
  *   **McMahan:** Wrongful Threat = Threatening someone you objectively shouldn't harm.
  *   **Counter:** Wrongful Threat = Threatening someone you *know* (or should know) you shouldn't harm.

  If we accept the Counter definition, the unjust combatant with reasonable belief is not posing a wrongful threat. If they are not posing a wrongful threat, they are not liable. If they are not liable, killing them is a violation of their rights. Thus, they retain their right not to be killed. This restores the Moral Equality of Combatants not as a legal fiction, but as a deep moral truth derived from the epistemic limits of human agency in war.
