  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** Jeff McMahan's revisionist critique of the "moral equality of combatants" (MEC).
      *   **Specific Focus:** The epistemic objection to McMahan's view (soldiers can't know if their war is just) and McMahan's reply (excuse vs. justification).
      *   **Task:** Construct the *strongest argument* pushing back on the excuse/justification distinction in this specific context.
      *   **Goal:** Show that the epistemic situation of ordinary soldiers can render their fighting *objectively permissible* (recovering something like MEC), rather than merely excused.
      *   **Constraint:** Work the argument out independently (don't just summarize existing literature like Lazar, Fabre, etc., though I can draw on the conceptual space they occupy) and be explicit about where/blocks the inference from "reasonably believed permissible" to "merely excused."
      *   **Tone:** Philosophical, rigorous, seminar-level.

  2.  **Deconstruct McMahan's Position:**
      *   *Core Claim:* Liability to attack depends on moral responsibility for an unjust threat.
      *   *Implication:* Unjust combatants are liable; Just combatants are not.
      *   *Epistemic Objection:* Soldiers don't know if they are unjust.
      *   *McMahan's Reply:* Ignorance excuses but doesn't justify. The act remains objectively wrong (impermissible), even if the agent isn't blameworthy. Therefore, MEC (moral equality) is false, even if legal equality is pragmatically useful.
      *   *The Gap:* McMahan assumes that objective permissibility tracks *actual* moral facts (is the war actually just?), not *evidential* moral facts (does the evidence available to the agent support the belief that the war is just?).

  3.  **Brainstorming the Counter-Argument (The "Epistemic Permissibility" Move):**
      *   *Intuition:* If I act on the best available evidence, and that evidence is misleading through no fault of my own, did I do the *wrong thing*?
      *   *Analogy:* Self-defense. If A attacks B because A reasonably believes B is about to shoot him (but B is actually holding a toy gun), is A's action objectively impermissible? Some say yes (objectivism), some say no (subjectivism/evidentialism).
      *   *Application to War:* Soldiers are epistemic dependents. They rely on the state. If the state lies or is mistaken, the soldier's evidence is corrupted.
      *   *Key Distinction:* Objective Permissibility (fact-relative) vs. Subjective/Evidential Permissibility (evidence-relative). McMahan treats "permissibility" as strictly fact-relative. The argument needs to show that in the context of *collective, delegated agency*, evidence-relative permissibility *is* the relevant standard for objective moral assessment of the act.
      *   *Blocking the Inference:* McMahan infers "Reasonable Belief $\neq$ Justification" from the premise "Justification requires Truth." I need to challenge the premise that Justification requires Truth in cases of non-culpable ignorance involving delegated authority.

  4.  **Developing the Argument Structure:**
      *   **Introduction:** State the target (McMahan's excuse/justification split) and the thesis (epistemic constraints transform the normative status of the act, not just the agent).
      *   **Step 1: The Nature of Normative Authority in War.** Soldiers aren't independent moral agents; they are instruments of a collective decision-making procedure. Their "objective" duty is defined by their role within that procedure.
      *   **Step 2: Fact-Relative vs. Evidence-Relative Normativity.** Critique the idea that "objective permissibility" must always be fact-relative. In high-stakes, high-uncertainty contexts, the moral standard *shifts* to evidence-relative.
      *   **Step 3: The "Division of Moral Labor" Argument.** The state bears the *jus ad bellum* burden. The soldier bears the *jus in bello* burden. If the state fails, the soldier isn't violating *their* objective duty, provided they trust the state reasonably.
      *   **Step 4: Blocking the Inference.** Why "Reasonable Belief" $\rightarrow$ "Justification" here? Because the *act* is evaluated relative to the agent's normative horizon. If the horizon is restricted by design (military structure), the moral evaluation must respect that restriction.
      *   **Conclusion:** Recovering a "functional" Moral Equality of Combatants based on epistemic symmetry.

  5.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Isn't this just subjectivism? If a soldier reasonably believes killing innocents is okay, is it permissible?
      *   *Response:* No, limit it to *structural* epistemic dependence regarding *jus ad bellum*. Soldiers can't know *ad bellum* facts, but they *can* know *in bello* constraints (don't shoot civilians). The argument must be specific to the *ad bellum* uncertainty.
      *   *Critique:* McMahan would say "Liability is fact-relative." If you pose an unjust threat, you are liable, regardless of what you think.
      *   *Response:* Challenge the definition of "Unjust Threat." Is a threat "unjust" if it is epistemically warranted? A threat is only "wrongful" if it violates a duty. If the duty is evidence-relative, the threat isn't wrongful.
      *   *Key Move:* Redefine "Unjust Threat" in the context of epistemic asymmetry. An "epistemically warranted threat" does not generate liability in the same way an "objectively unjust threat" does.

  6.  **Drafting the Content (incorporating philosophical terminology):**
      *   Use terms like "fact-relative" vs. "evidence-relative" (Parfitian distinction).
      *   Focus on "Normative Competence" and "Epistemic Division of Labor."
      *   Address the "Objective Impermissibility" claim directly.
      *   Ensure the distinction between *blameworthiness* (excuse) and *act-status* (justification) is the pivot point.

  7.  **Final Polish:**
      *   Check against the prompt: Did I avoid just summarizing Lazar/Fahre? Yes, I need to construct the argument.
      *   Did I address the specific inference block? Yes, the move from "belief" to "justification."
      *   Is it strong? It needs to sound plausible enough for a seminar discussion.

      *(Self-Correction during drafting)*: I need to be careful not to just say "subjective permissibility matters." I need to argue that *objective* permissibility, properly understood for this class of agents, *incorporates* the epistemic constraints. It's not that we lower the bar; it's that the bar is located differently for delegated agents.

      *Argument Core:* The "Objective" moral status of an act by a subordinate agent is constituted by their adherence to their epistemic limits, not by the metaphysical truth of the cause. Therefore, the act is *justified*, not merely excused.

  8.  **Finalizing the Structure:**
      1.  Introduction: The Stakes (MEC vs. Revisionism).
      2.  The McMahanian Gap: Fact-Relative Liability.
      3.  The Counter-Argument: Epistemic Constitution of Duty.
      4.  The Division of Normative Labor.
      5.  Blocking the Inference: Why Excuse is the Wrong Category.
      6.  Conclusion: Recovering Equality.

      *(Wait, one more check)*: The prompt asks to be explicit about *where and why it blocks the inference*. I need a dedicated section for that. The inference is: "Belief $\neq$ Truth $\rightarrow$ Act is Impermissible (Excused only)." I need to attack the "$\rightarrow$ Act is Impermissible" link.

      *Refining the Block:* The link assumes that moral permissibility is solely a function of the *outcome state* (justice of the war). I argue it is a function of the *decision procedure* available to the agent. If the procedure is followed, the act is permissible *simpliciter*.

