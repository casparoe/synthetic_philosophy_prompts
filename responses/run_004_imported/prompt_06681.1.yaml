      *(Let's ensure I don't just repeat Seth Lazar.)* Lazar argues for "responsibility-based" accounts that soften McMahan. I need to focus on the *nature of justification* under uncertainty. I will focus on the concept of "Prospective Justification" vs. "Retrospective Justification." McMahan assumes only Retrospective counts. I argue Prospective is the only one that guides action and thus defines permissibility for agents.

      *Actually, a stronger angle:* The "Right to Kill" is derived from the "Threat Posed." If the threat is *epistemically indistinguishable* from a just threat, does it carry the same moral weight? I will argue that "Unjust Threat" is a normative status, not just a metaphysical one. A threat backed by reasonable evidence of justice is not a "wrongful" threat in the sense that generates liability.

