answer: |-
  A contractor reviewing the blueprints for the National Physical Laboratory stops Turing with a concern about the proposed "telepathy-proof room."

  "Professor," the contractor says, "if telepathy bypasses physical channels, why are we budgeting for double-brick walls? Wouldn't that be useless?"

  Turing adjusts his glasses and replies, "Oh, the walls aren't to stop the telepathy. The statistical evidence for that is overwhelming, brick or no brick. The walls are to stop the *statistics* from getting into the test results."

  The contractor blinks. "So... it's a significance-proof room?"

  "Precisely," Turing says. "Outside, the p-values are critical. Inside, they're negligible."
