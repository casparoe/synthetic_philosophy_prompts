          *   MWI Move: There is no unique outcome at A, so OI is ill-defined or satisfied in a broader sense (all outcomes happen).
      *   *The "Matching" Problem:* In EPR, if Alice measures Up, Bob *must* measure Down. In MWI, Alice splits into Up-Alice and Down-Alice. Bob splits into Up-Bob and Down-Bob. Why do Up-Alice and Up-Bob never meet/interact? How does the universal wavefunction enforce the correlation *locally*?
