answer: |-
  Here is a draft of 10 interview questions tailored to your constraints, designed to be rigorous without being hostile, with specific follow-ups to prevent standard "Sequence-style" hand-waving.

  ### 1. The Definition of "Local"
  **Question:** "Let's start with the definition of terms, because I think this is where the conversation usually gets stuck. When you say MWI is 'local,' are you claiming locality in 3-dimensional physical space, or locality in 3N-dimensional configuration space? Because Bell's theorem is usually framed as a constraint on correlations in physical space. If your locality is only in configuration space, haven't you just shifted the nonlocality into the ontology of the wavefunction itself?"

  **Follow-up:** "If you say it's locality in configuration space: A wavefunction for two entangled particles lives in a space where 'distance' doesn't map to physical distance. So if an operation here affects the wavefunction there instantly in configuration space, isn't that mathematically isomorphic to nonlocality in physical space, regardless of what we call it?"

  ### 2. Jarrett's Decomposition (The Crux)
  **Question:** "I want to drill down on Bell's assumptions. Jon Jarrett split Bell's 'locality' condition into Parameter Independence and Outcome Independence. Standard QM violates Outcome Independence—the outcome at A changes the probability of the outcome at B. The Everettian move seems to be: 'There is no single outcome at A, so Outcome Independence is ill-defined.' Is that a genuine dissolution of the puzzle, or is it just a relabeling? If I am an observer at A experiencing a specific result, doesn't the correlation at B still look like a violation of Outcome Independence from my perspective?"

  **Follow-up:** "If you argue that 'my perspective' is just one branch and the global state satisfies independence: Doesn't that mean 'Locality' is no longer a property that any individual observer can verify? If Locality only holds for the God's-eye view of the universal wavefunction, does it still do the physical work we want 'Locality' to do?"

  ### 3. The EPR-Bohm Matching Problem
  **Question:** "Let's talk about the mechanism of correlation. In an EPR-Bohm experiment, Alice measures Up and Bob measures Down. In MWI, Alice splits into Up-Alice and Down-Alice, and Bob splits into Up-Bob and Down-Bob. The mystery is: How do the branches 'know' to match up correctly? Why does Up-Alice never find herself in a branch with Up-Bob? If there's no nonlocal signal coordinating them, what physically prevents the 'forbidden' branches from existing?"

  **Follow-up:** "If you answer 'It just falls out of unitary evolution': Unitary evolution preserves the orthogonality of the initial state. But doesn't that just push the question back to the preparation? Are you saying the correlation was hardcoded at the source, and if so, doesn't that require the source to 'know' what measurements will be chosen later, edging toward superdeterminism?"

  ### 4. Decoherence and Propagation Speed
  **Question:** "You rely heavily on decoherence to explain the emergence of branches. Decoherence is a physical process mediated by interactions. Does the 'splitting' of the world propagate at the speed of light? If Alice measures her particle, does Bob's branch split instantly, or does it wait for the decoherence wave to reach him?"

  **Follow-up:** "If you say it waits for the decoherence wave: Then for a period of time, isn't the state of the system effectively nonlocal in the sense that Alice has split but Bob hasn't? How do you define the 'truth' of the correlation during that light-delay window without a preferred frame?"

  ### 5. Relativity and Preferred Simultaneity
  **Question:** "This leads to my question on relativity. Branching seems to imply a change in the structure of reality. If Alice and Bob are spacelike separated, and they measure 'simultaneously' in some frame, does the branching happen on a specific simultaneity surface? If not, how do you square the global structure of branches with the lack of a global 'now' in Special Relativity?"

  **Follow-up:** "If you cite Wallace and say branches are 'approximate' and 'fuzzy' so they don't need a precise surface: Bell's inequalities are exact mathematical constraints. If your solution to an exact theorem relies on an approximate, frame-dependent ontology, aren't you solving a different problem than the one Bell posed?"

  ### 6. Superdeterminism vs. Many Worlds
  **Question:** "You're willing to accept a massive ontological cost—infinitely many unobservable worlds—to preserve Locality. But there's another way to preserve Locality and keep single outcomes: Superdeterminism. You just assume the measurement settings were correlated with the particle source in the past. Why is positing infinite worlds philosophically cheaper than positing a conspiracy in the initial conditions?"

  **Follow-up:** "If you say 'Superdeterminism kills science because it undermines experimental independence': Doesn't MWI also undermine experimental independence in a sense? If every outcome happens, my 'choice' of measurement setting also branches. Why is the branching choice freer than the superdeterministic choice?"

  ### 7. Ontological Weight and Energy
  **Question:** "If the theory is local, energy and momentum should be conserved locally. When a branch splits, does the energy density of the universe divide? If I have a photon in a superposition of two locations, and I measure it, does the energy 'move' locally to one branch, or is the energy spread across the multiverse? How does this cash out in the stress-energy tensor?"

  **Follow-up:** "If you say 'Energy is conserved globally across the multiverse': Then locally, in my branch, does energy conservation hold strictly, or only statistically? If it's only statistical, isn't that a violation of local physical laws as we traditionally understand them?"

  ### 8. The "Realism" Premise
  **Question:** "Bell's theorem assumes Locality and Realism. Everettians say they keep Locality and drop Realism (in the sense of single outcomes). But isn't the wavefunction itself a realist object in MWI? It exists objectively. So aren't you actually keeping Realism and redefining Locality? If the wavefunction is real and it lives in configuration space, isn't configuration space the 'real' space, making our 3D experience the derivative one?"

  **Follow-up:** "If 3D space is derivative: Then when you claim MWI is 'local,' aren't you really saying 'The fundamental reality is local in configuration space,' which is a very different claim than 'Physics is local in the space we live in'?"

  ### 9. Falsifiability of the Locality Claim
  **Question:** "Here's the point-blank question: What observation, even in principle, could count as evidence *against* the claim that 'MWI is local'? If every possible outcome of a Bell test happens in some branch, and the global wavefunction always evolves unitarily, is there any data that could ever convince you that MWI is non-local?"

  **Follow-up:** "If you say 'No, it's a consequence of the math': Then isn't 'MWI is local' an unfalsifiable interpretive bookkeeping claim rather than a physical hypothesis? If it can't be wrong, does it make sense to argue it's 'right'?"

  ### 10. The "So What?" for Physics
  **Question:** "Finally, let's zoom out. Suppose I'm a working experimentalist. I accept your argument that MWI is local in the Everettian sense. Does that change how I design my experiment, or how I calculate my error bars? If the prediction for my detector clicks is identical to Copenhagen or Bohmian mechanics, what practical work is the 'Locality' claim doing for us?"

  **Follow-up:** "If you say 'It matters for Quantum Gravity': Usually, people want to quantize gravity to resolve nonlocality issues. If you say MWI already solved nonlocality, does that mean you expect Quantum Gravity to look fundamentally different than if we assumed QM was nonlocal? What's the concrete prediction?"
