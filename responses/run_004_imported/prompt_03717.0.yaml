          *   Therefore, DTS is the culprit, not incompleteness.
          *   *Key distinction:* Local vs. Global instrumental rationality. DTS prioritizes local, but rational agents care about global outcomes.

      *   **Point 2: Reconceptualizing "Operative Preferences" (The Constitutive Critique).**
          *   Address the advisor's specific worry: "Choosing against operative preferences."
          *   Argument: Preferences at $t_2$ are not exogenous facts. They are shaped by the plan adopted at $t_1$.
          *   Draw on **McClennen's Resolute Choice**: The plan provides a *reason* at $t_2$.
          *   Draw on **Bratman's Planning Theory**: Intentions have a stability feature. Reconsideration is costly/limited.
          *   The "operative preference" at $t_2$ *includes* the preference to adhere to the rational plan formed at $t_1$. To ignore it is to have an impoverished view of preference.

