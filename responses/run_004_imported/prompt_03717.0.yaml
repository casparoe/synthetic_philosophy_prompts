  Let's ensure I reference McClennen (Rationality and Dynamic Choice) as he is the primary source for resolute choice against separability. I should also acknowledge Gustafsson's specific contribution (the "forcing" aspect which closes off simple sophistication).

  *Wait, one nuance:* Gustafsson argues that *sophisticated* choice (backward induction) leads to the pump. *Resolute* choice blocks backward induction by binding the future. The advisor says binding the future is irrational. I need to defend the rationality of binding the future when preferences are incomplete.

