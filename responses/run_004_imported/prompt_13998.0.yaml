answer: |-
  Your intuition was spot on. Your friend is describing a common moralistic or neoclassical critique of capitalism (i.e., "bosses are greedy and underpay"), but that is **not** what Marx means by exploitation.

  In fact, Marx's entire point is that exploitation happens **even when the capitalist pays the worker the full fair market value** for their labor.

  Here is the breakdown of why your friend is wrong and the specific concept you need to win the rematch.

  ### 1. The Crucial Distinction: Labor vs. Labor Power
  This is the single most important technical distinction in *Capital*.

  *   **Your Friend's View:** Workers sell their **Labor** (the work they do). Therefore, they should be paid the value of what they make.
  *   **Marx's View:** Workers sell their **Labor Power** (their *capacity* to work for a set time).

  Marx argues that you cannot sell "labor" because labor is the *activity* of creating value, which doesn't exist until it is performed. What the worker owns and sells to the boss is the *ability* to work for a day (Labor Power).

  ### 2. How Exploitation Happens in a "Fair" Trade
  Marx assumes, for the sake of his argument, that all commodities (including labor power) are sold at their true value. There is no cheating, no fraud, and no "lowballing."

  Here is the math Marx uses:

  1.  **The Cost of Labor Power:** Let's say it costs **$100** a day to keep a worker alive, housed, and fed (subsistence). This is the "value" of their labor power.
  2.  **The Wage:** The capitalist pays the worker **$100** for an 8-hour shift. This is a "fair" market exchange. The worker gets the full value of their labor power.
  3.  **The Production:** However, the worker is capable of producing value much faster than they consume it. Let's say in **4 hours**, the worker produces **$100** worth of goods.
  4.  **The Surplus:** The worker has now "paid off" their wage. But they are contracted for 8 hours. For the remaining **4 hours**, they continue to produce value (**another $100**), but they are not paid for this time.
  5.  **The Result:** The capitalist keeps that second $100. This is **Surplus Value**.

  For Marx, **exploitation is the appropriation of this surplus value.** It doesn't matter if the wage is "fair" relative to the market; the structure of the relationship ensures that the worker produces more value than they are paid in wages.

  ### 3. Why Your Friend's Definition Changes Everything
  If your friend were right, it would imply that capitalism could be "fixed" by simply forcing bosses to pay workers the full value of their output. If workers were paid 100% of what they produced, there would be no profit left for the capitalist.

  *   **Friend's View:** Exploitation is a **bug**. It's a moral failure of individual greedy bosses. You can have ethical capitalism.
  *   **Marx's View:** Exploitation is a **feature**. It is the structural engine of capitalism. Without surplus value (unpaid labor), there is no profit, no capital accumulation, and the system collapses.

  Marx explicitly writes about this. He mocks the idea that if workers were paid the "full value of their product," capitalism would cease to exist. He argues that the "fairness" of the wage contract in the marketplace masks the "unfairness" of the production process.

  ### 4. The "Hidden Abode" of Production
  Marx famously writes that if you look at the market (the sphere of exchange), everything looks free and equal. The worker agrees to the wage; the boss pays it. It looks like a fair trade.

  He calls this the "very Eden of the innate rights of man."

  But, he says, once you leave the market and enter the factory (the sphere of production), the mask slips. The worker is no longer an equal partner; they are subordinate to the capitalist, working to generate value that belongs to someone else.

  ### Summary for Your Next Argument
  Tell your friend this:

  > "You're defining exploitation as **theft** (paying less than agreed). Marx defines exploitation as **extraction** (paying the agreed rate, but capturing the difference between the cost of my time and the value I create).
  >
  > For Marx, even if a boss pays the highest possible market wage, they are still exploiting the worker because profit *only exists* if the worker produces more value than they are paid. If you eliminate Marxian exploitation, you eliminate profit, and you eliminate capitalism."

  Your friend is arguing that capitalism is unfair because bosses break the rules. Marx is arguing capitalism is unfair because **following the rules requires exploitation.**
