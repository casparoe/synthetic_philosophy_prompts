prompt: |-
  Me and my friend got into a two-hour argument last night about Marx that never really got resolved. His take was that when Marx accuses capitalists of "exploiting" workers, all he really means is that bosses lowball wages below the fair market value of what workers produce -- so a company that actually paid workers the full value of their output wouldn't be exploiting anyone. I couldnt poke a hole in that at the time, even though it felt off, and its been bugging me since. Is he actually right about how Marx defines exploitation, or is there something he's missing?
