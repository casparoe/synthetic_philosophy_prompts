      *   *Key Line Idea:* "But maybe love is the one context where the rules change." (Contextualist hint).
      *   *Decision:* Lean harder on the *stakes* argument. It's more emotional. High stakes usually demand hesitation. They don't hesitate. Why? Because the evidence is overwhelming.

