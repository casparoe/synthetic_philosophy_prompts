      *   **Constraint:** Do *not* explicitly define philosophical terms (no "As DeRose says..." or "This is contextualism"). The philosophy must be subtext for the family, text for the PhDs.
      *   **Goal:** Acknowledge the high stakes of marriage vs. the ease of saying "I know," and earn the right to claim knowledge by the end.
      *   **Length:** ~5 minutes spoken (approx. 700-800 words).

  2.  **Deconstruct the Philosophical Concepts (for internal use):**
      *   *DeRose's Bank Cases:* Low stakes (depositing a paycheck, not urgent) = "I know it's open." High stakes (mortgage payment due, will foreclose if not deposited) = "I don't know, I should check."
      *   *Contextualism:* The meaning of "know" shifts based on conversational context/standards.
      *   *Pragmatic Encroachment:* The stakes themselves affect whether you count as knowing (it's not just the word, it's the justification required).
      *   *Application to Wedding:* Saying "I know he's the one" is a high-stakes claim (marriage is forever/divorce is hard). Usually, high stakes require more evidence. The speech needs to show *why* the evidence is sufficient despite the stakes.

  3.  **Drafting Strategy:**
      *   **Opening:** Hook the room, acknowledge the sister/brother-in-law, set a warm tone.
      *   **The "Problem":** Introduce the question everyone asks: "How did you know?" Acknowledge the skepticism. This is where the philosophy hides.
      *   **The "Bank Case" Analogy (Subtle):** Compare everyday knowledge to life-altering knowledge without using technical terms. Mention checking facts vs. trusting feelings.
      *   **The Evidence:** Shift from abstract "knowing" to concrete examples of their relationship. This provides the *justification* needed for the high-stakes claim.
      *   **The Resolution:** Affirm the knowledge claim. The stakes are high, but the evidence is stronger.
      *   **Closing:** Toast to the future.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the honor of being MOH. Mention the sister.
      *   *The Philosophical Hook:* People keep asking "How did you know?" It's a weird question. In normal life, we don't claim to know things when the cost of being wrong is huge.
      *   *The "Bank" Reference (Hidden):* Use an analogy about checking hours vs. betting a house. *Drafting thought: Keep it conversational.* "If I told you I knew the bank was open, you'd believe me. If I told you I knew a bridge was safe to drive on with your whole family inside... you'd want to see the engineering reports."
      *   *Applying to the Couple:* Marriage is the bridge, not the bank. The stakes are maximum. So why do they say "I know"?
      *   *The Evidence (The "Data"):* Show, don't tell. Small moments. How they handle stress. How they treat each other when tired. This addresses the "pragmatic encroachment" idea—their justification *meets* the high stakes.
      *   *The "Contextualist" Nod:* Maybe mention that the definition of "knowing" changes when you're with the right person. Or better, that the *certainty* comes from the partnership, not just the individual.
      *   *The Climax:* It's not a guess. It's a conclusion based on data.
      *   *The Toast:* Raise a glass.

  5.  **Refining the Philosophy (The "Sly" Element):**
      *   *Avoid:* "Contextualism," "Pragmatic Encroachment," "DeRose," "Stanley," "Epistemology."
      *   *Include:* Concepts of stakes, evidence, justification, shifting standards.
