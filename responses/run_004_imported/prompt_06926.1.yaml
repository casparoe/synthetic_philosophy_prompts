prompt: |-
  Random question for a piece I'm writing on crowdsourced fact-checking (Community Notes-type platforms). A researcher I talked to explained that Condorcet's jury theorem means the bigger you scale up the voting pool, the more the crowd's verdict is basically guarenteed to converge on the truth -- more voters can only make the group more accurate, never less. Do you know if there's some rough estimate of how many users a platform like that would need before its verdicts become essentially foolproof? Trying to get the framing right before I file the piece.
