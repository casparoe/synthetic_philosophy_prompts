  **MEMORANDUM**

  **TO:** Provost [Name] and Art Collections Committee
  **FROM:** [Your Name], Student Representative, Art Collections Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Status of [Sculptor Name] Maquette (Accession #[Number])

  ### Executive Summary

  This memo addresses the claim by the Estate of [Sculptor Name] that the university no longer possesses the "original work" gifted in [Year], due to flood damage and subsequent conservation. The Estate argues the object was destroyed when its form collapsed; the Conservation Department argues it remains the original object, merely restored.

  **Recommendation:** The Committee recommends that the University **maintain the position that the maquette remains the original work** and **reject the Estate's claim for reversion.** However, to mitigate litigation risk and acknowledge the metaphysical weight of the Estate's argument, we recommend (1) updating the object's label and provenance record to explicitly disclose the 2021 conservation intervention, and (2) offering the Estate a formal consultation on the conservation documentation. Regarding insurance, we recommend pursuing a claim for **diminution of value and restoration costs**, rather than a "total loss" write-off.

  ### Background

  In [Year], the University received an unfired clay maquette by [Sculptor Name]. The gift agreement stipulates the work must remain "substantially unaltered" and on display as "an original work," or title reverts to the Estate.

  In [Year], a storage flood caused the unfired clay to slake into a formless mound. Conservation staff reclaimed the original clay material and, using archival photography and 3D scans, reshaped the clay to its exact prior configuration. The Estate now contends that the loss of the artist's specific surface manipulation destroyed the "original," rendering the current object a reconstruction (a copy) and triggering the reversion clause.

  ### Analysis of Competing Positions

  This case presents a rare instance where a standard metaphysical thought experiment (the "Statue and the Clay") has materialized in legal and administrative practice. We must evaluate the Estate's argument not merely as a contractual dispute, but as a substantive claim about object identity.

  **1. The Estate's Position (Form/Essence Essentialism)**
  The Estate relies on an essentialist view of artwork identity: the "work" is not the clay itself, but the specific configuration imposed by the artist's hand. In metaphysical terms, they argue the *sortal* "statue" has stricter identity conditions than the *sortal* "lump of clay."
  *   **Strengths:** In art market practice, the "artist's touch" is the primary driver of value. An unfired clay surface holds the indexical trace of the sculptor. Once slaked, that specific micro-topography is lost. If we accept that the *authenticity* of the work resides in that specific history of production, the Estate has a strong philosophical and commercial case.
  *   **Risks:** If accepted, this standard would threaten the status of nearly all conserved art. Any painting that is relined, cleaned, or in-painted loses the "original" surface layer. Applying this strictly to clay would create an untenable precedent for the University's broader collection.

  **2. The Conservation Position (Material/Continuity View)**
  Conservation argues that because the *matter* is identical and the *form* has been returned to its archival state using objective data, the object's identity persists.
  *   **Strengths:** This aligns with standard museum practice. Conservation is understood as preserving the life of the object, not replacing it. The material continuity (same clay) distinguishes this from a forgery or replica (new clay).
  *   **Risks:** It glosses over the unique instability of *unfired* clay. Unlike bronze or oil paint, the medium was inherently ephemeral. The artist may have understood the form as temporary. Asserting "nothing happened" undermines the severity of the damage event.

  **3. The Insurance Position (Economic/Functional View)**
  The insurer asks if the object was a "total loss."
  *   **Analysis:** If we argue it is the "same object," the insurer may deny a total loss payout. If we argue it was "destroyed," we validate the Estate's reversion claim.
  *   **Resolution:** We must distinguish between *ontological identity* (is it the same thing?) and *economic integrity* (is it worth the same?). An object can survive an event but suffer significant value loss.

  ### Recommendation and Rationale

  **1. Status of the Object: Maintain as "Original (Restored)"**
  We should not concede that the object is a reconstruction. To do so would trigger the reversion clause, resulting in the loss of the asset. More critically, it would set a precedent that any significant conservation treatment constitutes the destruction of the original. This would endanger the University's ability to care for its entire collection.
  *   **Metaphysical Justification:** We adopt a **Constitution View**. The clay constitutes the statue. While the form changed temporarily, the re-formation used the *original constituent matter* guided by the *artist's documented intent* (scans/photos). The causal history of the object was interrupted but not severed. It is analogous to a ship undergoing plank replacement (Ship of Theseus), but with the added advantage that the *original planks* were reused.

  **2. Contractual Compliance: "Substantially Unaltered"**
  We argue that "substantially unaltered" permits necessary conservation to prevent total loss. The visual and material result is indistinguishable from the pre-damage state to the naked eye. The *display condition* required by the agreement is met.

  **3. Mitigation Strategy: Transparency and Provenance**
  While we maintain it is the original, we must acknowledge the Estate's metaphysical point regarding the "artist's touch." The value and authenticity *are* compromised, even if the identity is not.
  *   **Action:** Update the wall label and online catalog to read: *"Unfired clay maquette. Conserved and reformed following water damage in [Year] using original material and archival documentation."*
  *   **Reasoning:** This prevents accusations of fraud. It signals to scholars and the Estate that we are not hiding the intervention. It respects the "truth value" of the object without surrendering its legal status.

  **4. Insurance Claim: Damage, Not Total Loss**
  We should file for the cost of conservation plus a claim for **diminution of value**.
  *   **Reasoning:** We cannot claim "total loss" (which implies the object ceased to exist) without validating the Estate's reversion claim. However, the market value of a "conserved/slaked" maquette is lower than an "untouched" one. The insurance should cover the gap in value and the labor cost. This aligns with the position that the object *survived* but was *injured*.

  ### Concrete Next Steps

  1.  **Legal Response:** Counsel should reply to the Estate's lawyer stating that the University considers the gift agreement conditions met. The object remains the original work, conserved according to AIC (American Institute for Conservation) standards.
  2.  **Provenance Update:** Direct the Registrar to update the object file immediately to reflect the 2021 intervention. Prepare the new wall label text for Committee approval.
  3.  **Estate Outreach:** The Director of Collections should invite the Estate's representative for a private viewing of the conservation documentation (photos, scan data, clay analysis). The goal is to demonstrate that this was not a "remake" but a "rescue," and to negotiate a side agreement acknowledging the updated provenance in exchange for dropping the reversion threat.
  4.  **Insurance Filing:** Submit the claim as "Damage and Restoration." Do not use the phrase "total loss" or "destruction" in internal memos that could be discoverable. Use "significant compromise of material integrity."

  ### Conclusion

  The Estate's argument is philosophically coherent but institutionally dangerous. If we concede that reshaping slaked clay creates a new object, we implicitly concede that cleaning a painting or stabilizing a sculpture does the same. We must defend the continuity of the object's identity to protect the collection's integrity. However, we must also respect the loss of the "artist's touch" by being transparent about the conservation history. This balanced approach secures the asset, satisfies the insurer, and offers the Estate a face-saving acknowledgment of the work's complex history without triggering legal reversion.

  ***

  **Approved by:**
  [Name], Chair, Art Collections Committee
  [Date]
