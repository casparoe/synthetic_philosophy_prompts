      *   *Check:* Did Marcus sound too wishy-washy? *Fix:* Ground his argument in the specific horror of Huck's society. His "feelings" were actually a deeper moral perception than his "conscience."
      *   *Check:* Is the "Fetishism" objection clear? *Fix:* Use the phrase "loving the rule more than the person."
      *   *Check:* Is the "Reliability" objection clear? *Fix:* Use the example of a stranger in need vs. a beloved friend.

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Start:* Marcus lighting a cigarette (or just watching the sunset). Let's go with watching the sunset.
