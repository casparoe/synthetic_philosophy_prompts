      *(Self-Correction on the "Fetishism" point)*: I need to make sure Elena doesn't just say "No it's not." She needs to explain *why* the Kantian thinks duty is the expression of respect for rationality/personhood, not just blind obedience.
      *(Self-Correction on the "Reliability" point)*: Marcus needs to argue that a person with good character has *reliable* feelings, not just random ones. Virtue ethics angle.

  6.  **Final Polish:**
