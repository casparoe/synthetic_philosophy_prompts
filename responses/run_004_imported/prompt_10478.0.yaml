      *   **Topic:** The historical and conceptual link between Keynes's *Treatise on Probability* (1921) and Ellsberg's Paradox (1961), specifically regarding "uncertainty" vs. "risk" and the concept of "weight of argument."
      *   **Core Question:** If Keynes saw the modern ambiguity-aversion literature (Gilboa-Schmeidler, maxmin expected utility, etc.), would he see it as vindication or as a misinterpretation that dropped his key concept ("weight")?
      *   **Secondary Question:** Given Keynes's concession to Frank Ramsey (who argued for coherent, comparable probabilities without "weight"), who does the Ellsberg literature actually vindicate in hindsight: Keynes, Ramsey, or neither?
