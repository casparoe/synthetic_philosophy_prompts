  **Move 1 (Nadia):** This is a textbook articulation of Dennett's instrumentalism. In "True Believers," Dennett argues that belief is not an internal neurostate but a status conferred by successful prediction via the intentional stance. By equating the threshold to the thermostat example, she correctly identifies that Dennett rejects any "further fact" of consciousness or internal representation beyond predictive utility.

