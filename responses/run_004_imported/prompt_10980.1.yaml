answer: |-
  This is one of the most nuanced and difficult spots to land in a relationship, and you have articulated it perfectly. You are stuck between **moral judgment** (he's a flake) and **medical determinism** (he's a patient), and neither allows for a genuine adult sibling relationship.

  To answer your core question directly: **No, understanding the "why" does not make your anger irrational, nor does it erase his agency.**

  Here is an angle to help you stop flip-flopping between "Furious Sibling" and "Detached Social Worker."

  ### 1. Intent vs. Impact (The "Car Accident" Model)
  Your anger is currently stuck on *intent*. You used to think, "He doesn't respect me enough to show up." Now you think, "He respects me, but his brain won't let him show up."

  The problem is that **impact exists independently of intent.**

  If someone steps on your foot because they are mean, it hurts. If someone steps on your foot because they have a neurological condition that affects their spatial awareness, *it still hurts.* The diagnosis explains the mechanism, but it does not negate the injury.

  You are allowed to grieve the impact. You are allowed to say, "I know you didn't mean to leave me stranded with Dad's boxes, but I was stranded, I was exhausted, and I am angry about that."
  *   **The Trap:** Thinking that if you acknowledge his ADHD, you lose the right to be hurt.
  *   **The Fix:** Separate the *explanation* from the *excuse*. An explanation tells you how it happened. An excuse tells you it's okay that it happened. ADHD explains the flake; it does not excuse the fallout.

  ### 2. The "Case Manager" Trap
  You mentioned feeling like you've started treating him like a patient. This happens because **you have absorbed the responsibility for his condition.**

  When you lower your expectations unilaterally (as your mom suggests), you are essentially saying, "I will manage the disappointment so you don't have to manage the behavior." That is a parent/child dynamic, not a sibling one.

  To relate to him as an adult, the responsibility for *managing the ADHD* must sit with him, not you.
  *   **Case Manager Mode:** "Okay, he has ADHD, so I won't ask him to help move. I'll just hire someone so I don't get mad." (You solve the problem silently).
  *   **Adult Sibling Mode:** "I know moving is hard for you with your ADHD. I need help. Are you capable of committing to this? If not, tell me now so I can plan, rather than bailing later."

  The second option holds him accountable for his *self-knowledge*. An adult with ADHD knows their limitations. Part of being an adult is communicating those limitations *before* the commitment is broken, not after.

  ### 3. Reframing "Acceptance" (Why your mom is half-wrong)
  Your mom's advice ("stop expecting anything different") is protective, but it's fatalistic. It treats his ADHD as a static identity rather than a manageable condition.

  True acceptance isn't resignation; it's **realism.**
  *   **Resignation:** "He will never be reliable, so I stop asking."
  *   **Realism:** "He struggles with time blindness and working memory. If we rely on verbal promises, he will fail. If we want him involved, we need a system that works for his brain, and he needs to agree to use it."

  If you treat him like a toddler, he will learn he doesn't need to grow. If you treat him like a neurotypical adult without accommodations, he will fail and you will be mad. The middle ground is treating him like an **adult with a disability.**

  ### 4. The Concept of "Compassionate Accountability"
  This is the angle you are missing. You can hold two truths in your head at the same time:
  1.  **Truth A:** He loves me, and his failures are largely due to neurological wiring and past trauma, not malice.
  2.  **Truth B:** His behavior has real-world costs for me, and he is responsible for mitigating those costs.

  You can be upset with the *person* without questioning their *character.* You aren't angry that he's "bad." You are angry that he is *unsafe* to rely on in specific contexts.

  **How to apply this:**
  When he flakes, instead of draining the anger (Social Worker) or exploding (Furious Sibling), try **Disappointed Partner.**
  *   *"I know you didn't do this to hurt me. I know your ADHD makes this hard. But when you borrow money and don't pay it back, it creates stress for my household. I need you to treat this debt as a priority, even if you have to set up auto-pay or alarms. I can't be the bank anymore."*

  This validates his struggle (ADHD) while maintaining your boundary (No more informal loans).

  ### 5. Grieve the Brother You Expected
  Part of why you feel worse now is that you are grieving. For years, you had a narrative: "He is unreliable because he doesn't care." That was painful, but it was simple.

  Now you have a harder narrative: "He cares, but he might still be unreliable."
  That is actually a heavier burden. It means the flaking isn't a one-time fixable thing; it's a chronic management issue.

  You are allowed to be sad that you don't have the kind of brother who can just "handle it." You are allowed to miss the version of him that doesn't exist. But don't let that grief turn into pity. Pity kills intimacy.

  ### Summary: The New Framework
  To stop flip-flopping, try adopting this stance:

  1.  **Validate the Injury:** Your anger is a signal that a boundary was crossed. Keep listening to that signal. Do not let the diagnosis gaslight you into thinking the inconvenience doesn't matter.
  2.  **Shift the Locus of Control:** You are not responsible for managing his ADHD. He is. Your job is to decide what you are willing to tolerate while he manages it.
  3.  **Negotiate, Don't Accommodate:** Don't just silently lower expectations. Have a conversation. "I want you in my life, but I can't handle last-minute cancellations. What system do we need to put in place so you can commit safely?"
  4.  **Forgive the Intent, Address the Impact:** "I forgive you for not meaning to hurt me. I still need you to fix the mess that was made."

  You can love him, understand his brain, *and* tell him he's being a pain in the ass. In fact, telling him he's being a pain in the ass (kindly, firmly) is the most "adult sibling" thing you can do. It signals that you see him as capable of hearing hard truths, not a fragile patient who needs to be tiptoed around.
