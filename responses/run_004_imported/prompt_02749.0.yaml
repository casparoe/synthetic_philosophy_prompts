      *   *Self-Correction on Pereboom's Cases:* Pereboom has a "Four-Case Argument" (manipulation) and "Frankfurt-style Cases" (Tax Evasion). The prompt asks about the Tax Evasion FSCs specifically (Case 2 in his 1995/2001 work). I need to be careful not to conflate the Manipulation Argument with the FSC argument, though they share the incompatibilist goal. The prompt specifically asks about the *Tax Evasion* cases vis-a-vis the Dilemma Defense.
