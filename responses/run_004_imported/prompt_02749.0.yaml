      *   **Section 2: Pereboom's Restructuring (Tax Evasion):**
          *   Describe Case 2 (usually the FSC version).
          *   *The Mechanism:* Not a "sign" distinct from the choice process. It's a *constitutive condition*.
          *   *The Condition:* To choose not to evade (A), Joe must *attend* to moral reasons (M).
          *   *The Intervention:* If M occurs, Black forces A-not (Evasion).
          *   *The Actual Sequence:* Joe does not attend to M. Joe chooses Evasion on his own.
          *   *Why it avoids Horn 1:* The actual sequence is indeterministic. Nothing causally determines the evasion *except* Joe's reasons. Black is idle.
          *   *Why it avoids Horn 2:* The alternative possibility (attending to M) does not lead to a different *outcome* (because Black intervenes). It is a "flicker." The claim is that this flicker is not robust enough to ground responsibility (PAP requires *robust* alternatives).

      *   **Section 3: How it Supposedly Avoids the Dilemma:**
          *   Focus on the "Necessary Condition" strategy.
          *   It decouples the *indicator* from the *causation* of the actual choice.
          *   It makes the alternative possibility *incompatible* with the actual choice, but not *causally sufficient* for the alternative choice in a way that threatens the actual sequence's indeterminism.
          *   *Crucial nuance:* Pereboom argues the alternative is too "thin" to satisfy the libertarian's requirement for moral responsibility.

      *   **Section 4: Widerker's Derivative Responsibility Objection:**
          *   This is the core critique.
          *   Argument: Joe is responsible for evading taxes (E).
          *   Why? Because he didn't attend to moral reasons (~M).
