answer: |-
  This is a sophisticated dialectical spot, and you have correctly identified the pivot point in the literature. The move from Frankfurt's original formulation to Pereboom's Tax Evasion cases represents the most significant technical refinement in the Frankfurt-style case (FSC) literature post-1990.

  To assist with your dissertation draft, I will break this down into three parts: the specific mechanics of Pereboom's restructuring, how it purportedly navigates the Widerker-Kane-Ginet (WKG) dilemma, and an analysis of Widerker's derivative responsibility objection (often called the "Flicker Defense" or "Tracing Objection") along with an evaluation of its force.

  ### 1. The Dilemma Defense and the "Prior Sign" Problem

  To appreciate Pereboom's innovation, we must be precise about why the WKG dilemma bites Frankfurt's original case.

  In Frankfurt (1969), Black waits for a **prior sign** (e.g., a twitch, a neural blip, a deliberative hesitation) that indicates Jones is about to choose otherwise.
  *   **Horn 1 (Determinism):** If the sign is causally sufficient for the choice, the actual sequence is determined. The case begs the question against the libertarian, who denies responsibility in deterministic sequences.
  *   **Horn 2 (Residual Alternatives):** If the sign is *not* causally sufficient (compatible with indeterminism), then the sign could occur without the choice following, or the choice could occur without the sign. Consequently, Jones retains the possibility of avoiding the sign *and* choosing otherwise. This leaves a **Robust Alternative Possibility (RAP)**. If PAP requires *any* alternative possibility, the case fails to refute it.

  The core vulnerability here is the **temporal and causal gap** between the *indicator* (the sign) and the *decision*. This gap allows the libertarian to drive a wedge between the counterfactual intervener and the actual exercise of agency.

  ### 2. Pereboom's Restructuring: Necessary Conditions vs. Prior Signs

  Pereboom's Tax Evasion cases (specifically Case 2 in *Living Without Free Will*, 2001, building on his 1995 "Determinism Al Dente") restructure the counterfactual intervener's trigger mechanism to close this gap.

  **The Setup:**
  Joe is deciding whether to evade taxes. He can choose to evade (E) or not evade (~E).
  *   **The Mechanism:** Black has a device that monitors Joe's brain.
  *   **The Trigger:** The device does not look for a "sign" predictive of ~E. Instead, it monitors a **necessary condition** for choosing ~E. Let's call this condition $C$ (e.g., attending to moral reasons regarding tax evasion).
  *   **The Constraint:** Pereboom stipulates that it is conceptually or nomologically necessary that to choose ~E, Joe must first instantiate $C$. One cannot choose not to evade taxes on moral grounds without attending to those moral grounds.
  *   **The Intervention:** If Joe begins to instantiate $C$, Black's device immediately stimulates Joe's brain to ensure he chooses E. If Joe does not instantiate $C$, the device remains idle, and Joe chooses E on his own.

  **The Actual Sequence:**
  Joe does not attend to moral reasons (~$C$). He chooses E on his own. The device does nothing.

  **How This Avoids the Dilemma:**

  1.  **Avoiding Horn 1 (Determinism):**
      In the actual sequence, Joe does not instantiate $C$. The device does not fire. Nothing causally determines Joe's choice to evade taxes other than his own reasons and deliberation. The actual sequence remains explicitly indeterministic. Pereboom does not need to posit that $C$ is causally sufficient for ~E; he only needs $C$ to be *necessary* for ~E. Therefore, the case does not presuppose determinism in the actual sequence.

  2.  **Avoiding Horn 2 (Residual Alternatives):**
      The libertarian might argue Joe still has an alternative: he could have instantiated $C$. Pereboom concedes this. Joe *could* have attended to moral reasons. However, Pereboom argues this alternative is not **robust**.
      *   If Joe instantiates $C$, Black intervenes, and Joe chooses E anyway.
      *   Therefore, the alternative possibility ($C$) does not lead to a different *outcome* (~E). It leads to the same outcome (E) via a different causal route (intervention).
      *   Pereboom's claim is that for PAP to be a viable principle, the alternative possibility must be the *ability to do otherwise* in a robust sense (i.e., able to bring about a different moral outcome). A "flicker" of freedom—the ability to initiate a process that is immediately hijacked to produce the same result—is insufficient to ground moral responsibility.

  By shifting from a *predictive sign* to a *constitutive condition*, Pereboom attempts to make the alternative possibility logically compatible with the actual outcome, thereby draining it of the normative significance required to satisfy PAP.

  ### 3. Widerker's Derivative Responsibility Objection

  David Widerker (2000, "Frankfurt-Style Examples and the Principle of Alternative Possibilities") presses a counter-move that has become the standard libertarian response to Pereboom. This is the objection you identified regarding "derivative" responsibility.

  **The Argument:**
  1.  Joe is morally responsible for evading taxes (E) in the actual sequence.
  2.  Why is he responsible? Presumably, because he voluntarily failed to attend to moral reasons (~$C$), which led to E.
  3.  But Joe *could* have attended to moral reasons ($C$). That was his alternative possibility.
  4.  Therefore, Joe is responsible for E *in virtue of* his responsibility for ~$C$.
  5.  But Joe was free with respect to ~$C$ (he could have done $C$).
  6.  Consequently, Joe's responsibility for E traces back to a moment where he *did* have a robust alternative possibility (the choice to attend or not attend to reasons).
  7.  Thus, a version of PAP survives: An agent is responsible only if they had alternative possibilities *at some point in the causal history* of the action.

  This is a **Tracing Strategy**. Widerker argues that Pereboom hasn't eliminated alternative possibilities relevant to responsibility; he has merely pushed them back one step. The "flicker" ($C$) is not just a neural blip; it is an exercise of agency (attending to reasons) over which the agent has control. If the agent is blameworthy for ~$C$, and ~$C$ leads to E, the agent is derivatively blameworthy for E. But derivative responsibility presupposes direct responsibility for the earlier link (~$C$), which *did* involve alternative possibilities.

  ### 4. Evaluation: Is Widerker's Objection Decisive?

  In the context of your dissertation, you should note that while Widerker's objection is powerful, it is not universally regarded as decisive. The debate has stalled on the metaphysics of **attention** and **voluntariness**.

  **Pereboom's Counter-Reply:**
  Pereboom (2001, 2014) argues that the tracing strategy fails if the condition $C$ (attending to moral reasons) is not itself a **voluntary action**.
  *   For tracing to work, the agent must be responsible for ~$C$.
  *   To be responsible for ~$C$, ~$C$ must be an action or a consequence of an action over which the agent has control.
  *   Pereboom suggests that attending to reasons is often a passive state or a non-voluntary occurrence. We do not typically *decide* to attend to moral reasons; we either find ourselves attending to them or we do not.
  *   If ~$C$ is not a voluntary omission, Joe cannot be directly responsible for ~$C$. If he isn't responsible for ~$C$, the tracing chain breaks. He is responsible for E directly in the actual sequence, without reference to $C$.

  **Widerker's Rebuttal:**
  Widerker (and allies like Ginet) counters that even if attending to reasons isn't a distinct "action," it is still under the agent's **rational control**. If Joe is a moral agent, he has a duty to attend to moral reasons. The fact that he *could* have done so, and didn't, is sufficient for blame, provided the failure wasn't coerced or ignorant in an exculpatory way. To deny this, Widerker argues, is to disconnect moral responsibility from the agent's rational capacities.

  **Assessment for Your Dissertation:**
  Is the worry decisive? **No, but it is dialectically costly.**

  1.  **Not Decisive:** Pereboom's distinction between voluntary actions and involuntary states of attention is philosophically tenable. Cognitive science and phenomenology often support the view that attention is not always under direct voluntary control. If Pereboom can successfully argue that $C$ is not an action, the tracing objection fails because you cannot trace responsibility through a non-responsible link.
  2.  **Dialectically Costly:** However, to maintain this defense, Pereboom must commit to a specific, somewhat contentious psychology of moral deliberation. He must argue that agents are responsible for decisions (E) even when they lack control over the deliberative preconditions ($C$) of those decisions. This pushes the debate away from PAP and toward **Source Incompatibilism** (responsibility depends on the *source* of the action, not alternatives).

  **Conclusion:**
  Pereboom's Tax Evasion cases successfully avoid the *original* WKG dilemma by eliminating the "prior sign" gap. However, Widerker's derivative responsibility objection successfully shows that Pereboom's cases likely preserve a *traced* version of PAP. Whether this is fatal depends on whether one accepts Pereboom's claim that the "flicker" (attending to reasons) is not a locus of direct responsibility.

  For your chapter, the strongest position is likely to characterize this not as a refutation of FSCs, but as a transformation of the debate. The WKG dilemma forced Frankfurt-defenders to refine their cases (Pereboom's move). Widerker's objection forced them to refine their theory of responsibility (shifting from PAP to Sourcehood or refining the nature of "robustness"). The objection is not a checkmate, but it demonstrates that FSCs cannot refute PAP in isolation; they must be paired with a specific account of why the remaining "flickers" are normatively inert.

  ### Key References for Your Footnotes:
  *   **Frankfurt, H.** (1969). "Alternate Possibilities and Moral Responsibility."
  *   **Pereboom, D.** (1995). "Determinism Al Dente." *Noûs*.
  *   **Pereboom, D.** (2001). *Living Without Free Will*. Cambridge University Press. (Specifically Chapter 3).
  *   **Widerker, D.** (1995). "Libertarianism and Frankfurt's Attack on the Principle of Alternative Possibilities." *Philosophical Review*.
  *   **Widerker, D.** (2000). "Frankfurt-Style Examples and the Principle of Alternative Possibilities." *In Freedom and Responsibility*.
  *   **Ginet, C.** (2000). "The Reduction Argument against the Principle of Alternative Possibilities." (For the flicker strategy nuances).
