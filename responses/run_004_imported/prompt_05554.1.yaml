prompt: |-
  Ok here's one that's been bugging me. I'm drafting a mystery-ish novel and theres a scene I brought to my writers group that turned into a whole fight between two people, Meg and Dave (Dave just finished a philosophy MA and has been insufferable about Miranda Fricker ever since). Setup: my POV character Mara is Deaf and reads lips. She's at her window when a car clips a cyclist and takes off -- she sees the car was dark green and watches it turn onto Elm, and she also catches part of an argument between the driver and a passenger through the windshield, something like 'you said left.' In the draft, the detective interviewing her says lip-reading testimony 'isn't exactly reliable' and mostly writes her off, going door to door for hearing witnesses instead. Meg and Dave started arguing about whether the detective is committing testimonial injustice in that scene, and it went four rounds:

  (1) Dave said it's textbook: the detective's deflating Mara's credibility purely because of a prejudicial assumption about Deaf people's competence, and that's literally Fricker's definition, case closed.

  (2) Meg said not so fast: lip-reading really is shaky even for good lip-readers, so if the detective's specifically wary of the 'you said left' part, that's just accurate calibration to a real limitation, no different from discounting a witness who admits it was dark and they weren't wearing their glasses.

  (3) Dave answered that the car's color and which way it turned aren't lip-read at all, she saw those with her own eyes, so writing off her whole statement isn't calibrating to any method's limits, it's using 'Deaf' as a blanket stamp of unreliability on facts that have nothing to do with lip-reading.

  (4) Meg said fine, that's a fair hit on the detective, but it doesn't get you all the way to identity prejudice: fixating on one shaky detail and letting it taint everything else a witness says is just a generic reasoning error, interviewers do that to hearing witnesses too, so the scene as written is honestly ambiguous between prejudiced and just sloppy.

  They wanted me to referee on the spot and I dodged, but it's been stuck in my head since. Can you go through it move by move? First give me a JSON block scoring each move from -2 (clearly wrong) to 2 (clearly right), like {"1": 0, "2": 0, "3": 0, "4": 0}, then a couple sentences per move on why, and then a short closing bit on whether Meg and Dave are both missing something about what it actually takes for this to count as testimonial injustice specifically, rather than Dave just winning on vibes.
