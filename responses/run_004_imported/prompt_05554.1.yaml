  **Move 1 (Dave):** Score: -1. Dave correctly identifies the core concept of testimonial injustice but fails the philosophical method by declaring it "case closed" before examining counter-evidence. Fricker's theory requires proving the credibility deficit stems from *identity prejudice*, not just observing a deficit exists, so his dogmatism shuts down the necessary inquiry into the detective's actual motives.

  **Move 2 (Meg):** Score: 2. Meg successfully introduces the distinction between prejudice and epistemic calibration, which is the strongest counter-argument to Frickerian claims. She correctly notes that discounting inherently unreliable evidence (lip-reading through a windshield) is rational investigation, not necessarily bias, mirroring Fricker's own acknowledgment that not all credibility deficits are unjust.

  **Move 3 (Dave):** Score: 2. Dave recovers well by isolating the visual evidence (car color, direction) from the lip-reading, which is crucial for the injustice claim. If the detective dismisses objective visual data solely because the witness is Deaf, that moves beyond calibrating for lip-reading limits and suggests the identity itself is contaminating the witness's overall credibility.

  **Move 4 (Meg):** Score: 2. Meg lands the most philosophically precise point by highlighting the ambiguity between identity prejudice and generic incompetence. For Fricker, the harm must be *identity-based*; if the detective discounts all partial witnesses regardless of ability, it is sloppy policing, not testimonial injustice, making the scene currently indeterminate.

  **Closing Analysis**
  Both Meg and Dave are debating the symptoms well, but they are missing the specific **diagnostic test** required for Fricker's theory: the counterfactual comparison. To prove testimonial injustice, you must ask whether the detective would have discounted a *hearing* witness who claimed to see an argument through a rain-streaked windshield. If he would trust the hearing witness but not Mara, it is prejudice; if he distrusts both, it is incompetence. Additionally, they overlook Fricker's nuance on **statistical discrimination**: even if lip-reading is statistically unreliable, using that group statistic to judge Mara without assessing *her* specific competence is itself the injustice. Dave wins on vibes because he identifies the harm, but Meg is philosophically tighter on the definition.
