answer: |-
  The hotel bar carpet is sticky in that specific way that suggests it has absorbed three decades of conference grief. It's 11:30 PM. The name tags are peeling off the lapels of the two people at the corner table.

  **Marcus** (Archaeological Science, specializing in paleoclimate proxies) is swirling a warm Pinot Grigio. **Elena** (Ancient History, specializing in Late Bronze Age textual analysis) is nursing a gin and tonic that is mostly ice. Between them lies a manuscript proposal, printed single-spaced.

  **Marcus:** It's a costume drama, Elena. Let's not dress it up.

  **Elena:** It's a novel. It's supposed to be about people.

  **Marcus:** It's supposed to be about the Collapse. And you can't explain the Collapse with a Mycenaean widow crying over a burnt storeroom. That's not an explanation. That's pathos.

  **Elena:** Since when is human agency just "pathos"?

  **Marcus:** Since 1942. Since Carl Hempel wrote *The Function of General Laws in History*. Look, I like your writer. I do. But she's falling for the oldest trick in the trade. She thinks that if she describes the sequence vividly enough, she's explained it. She hasn't. She's just offered a description wearing an explanation's clothes.

  **Elena:** Oh, spare me the covering-law model. We're at a bar, not a logic seminar.

  **Marcus:** It's the only thing that distinguishes history from fiction! If you want to claim you're explaining why Hattusa burned, you need to subsume that event under a general regularity. *If* resource stress exceeds threshold X, *and* trade interdependence is at level Y, *then* systemic failure occurs with probability Z. That is an explanation. Your scribe writing letters while the enemy ships arrive? That's just an instance of the regularity. It's the data point, not the equation.

  **Elena:** That equation is empty, Marcus. You're begging the question. "Systems collapse" isn't a law; it's a label you stick on the pile of ashes after the fire goes out.

  **Marcus:** It's a causal mechanism validated by complexity theory.

  **Elena:** It's a narrative wearing a lab coat. You say "interdependence cascades into failure." That's a story. It has a beginning, a middle, and an end. You're just pretending it's physics because you use the word "cascade."

  **Marcus:** I'm pretending it's physics because it allows for counterfactuals. If your novelist wants to explain the event, she has to show that given the conditions, the event *had* to happen, or was at least highly probable. If her widow could have made a different choice and saved the palace, then the widow isn't an explanation for the fall, she's an anomaly. If the choice didn't matter, then the widow is irrelevant to the explanation. Which is it?

  **Elena:** You're forcing a false dichotomy. This is exactly what William Dray was talking about. *Laws and Explanation in History*. He tore Hempel apart. Explanation isn't about prediction; it's about intelligibility.

  **Marcus:** Intelligibility is for the reader's comfort. Truth is for the historian's rigor.

  **Elena:** No. Intelligibility *is* the truth of human action. When I explain why the Hittite empire fell, I don't cite a statistical probability. I show you how Suppiluliuma II's decision to divert grain to the army, combined with the Kaska raids cutting the northern route, made the starvation in Hattusa *make sense*. It's not that it *had* to happen like a billiard ball hitting another. It's that given who these people were and what they valued, this is how it unfolded. That's a rational explanation.

  **Marcus:** That's a rationalization. You're saying, "Once you know the end of the story, the steps look logical." That's hindsight bias codified as philosophy. Danto might call it a "narrative sentence," describing an event in terms of a later outcome, but it doesn't tell us *why* the outcome occurred. It just tells us how we got there.

  **Elena:** Getting there *is* the why!

  **Marcus:** No, getting there is the *how*.

  **Elena:** In human history, the distinction is meaningless. If I show you the chain of decisions—the bad harvest, the king refusing to open the granaries, the mercenaries leaving because they weren't paid—I have shown you the cause. The cause *is* the sequence.

  **Marcus:** But why that sequence? Why did the king refuse? If the answer is "because he was an idiot," you haven't explained the Collapse, you've explained one king. If the answer is "because all kings under resource stress refuse to open granaries," then you've admitted Hempel was right! You're relying on a general law of royal stupidity under duress.

  **Elena:** I'm relying on a principle of rational action, not a law of nature. Gallie talked about this. "Followable stories." The explanation works if the reader can follow the transition from one step to the next without needing a universal law to bridge the gap. We understand why a starving population riots. We don't need a sociological regression to tell us that hunger leads to anger.

  **Marcus:** But you do need it to tell us when hunger leads to riots and when it leads to quiet death. In some periods, drought leads to migration. In others, it leads to war. In others, nothing. If your novelist wants to explain why 1177 BCE was the breaking point, she needs the variable that distinguishes it from 1300 BCE, which also had drought.

  **Elena:** And that variable is the specific configuration of the palatial economies! Which can only be described narratively. You can't reduce it to a law because the law would be so qualified it would be useless. "If drought occurs, and trade routes are centralized, and legitimacy is tied to redistribution, and external pressure exists..." That's not a law, Marcus. That's just a detailed description of the Bronze Age.

  **Marcus:** It's a model. And it's predictive. We can look for those variables in other societies.

  **Elena:** And when the model fails, you just add another variable. It's unfalsifiable. My narrative, on the other hand, stands or falls on whether the specific connections hold up. Did the grain actually stop? Did the ships actually arrive? If I get the facts wrong, the explanation collapses.

  **Marcus:** If you get the facts wrong, your story is fiction. But if you get the facts right and still don't have a general principle, your story is just a chronicle. A list. "And then this happened, and then this happened."

  **Elena:** A narrative isn't a list! "The king died, and then the queen died" is a list. "The king died, and then the queen died of grief" is a story. The explanation is in the *of grief*. It's the causal connection provided by human meaning. Your "systems collapse" removes the meaning. It treats the Hittite scribe like a red blood cell in a clogged artery.

  **Marcus:** The scribe *was* a red blood cell! That's the point! He couldn't stop the collapse. His letters didn't matter. The system was already past the tipping point. If your novelist gives him agency, she's lying. If she denies him agency, he's not an explanation, he's a prop.

  **Elena:** He's a witness to the mechanism! And sometimes, specific decisions *do* tip the scale. Maybe the system was fragile, but it took a specific general to leave the border undefended to let the Sea Peoples through.

  **Marcus:** Then the explanation isn't the general; it's the general. And we're back to needing a law about military deployment under fiscal stress.

  **Elena:** You're obsessed with prediction. You think an explanation is only valid if it would have allowed a time traveler to fix it.

  **Marcus:** I think an explanation is only valid if it distinguishes coincidence from causation. If your novelist says the drought caused the famine, she's implying a regularity. If she denies the regularity, she's saying it was magic.

  **Elena:** She's saying it was history. Look, Hempel's model works for physics. It doesn't work for people. We aren't atoms. We react to the *meaning* of the drought, not just the millimeters of rainfall. If the king believes the gods are angry, he prays instead of digging wells. That belief is a historical cause. You can't subsume "belief in angry gods" under a universal law without stripping it of the very content that makes it causal.

  **Marcus:** So you're saying history is inherently inexplicable by scientific standards.

  **Elena:** I'm saying it's explicable by *historical* standards. Which require narrative. Danto was right. We explain the past by organizing it into structures of meaning that connect the earlier to the later. The "Collapse" isn't a thing that happened on a Tuesday. It's a structure we impose on fifty years of chaos to make it understandable. Your drought papers give me the boundary conditions. My narrative gives you the event.

  **Marcus:** Your narrative gives me a comforting illusion of understanding. You make it feel inevitable because you've already trimmed away the branches that didn't lead to the fire.

  **Elena:** And you make it feel inevitable by pretending the fire was chemical, not human. You want to explain the Bronze Age Collapse without the Bronze Age.

  **Marcus:** I want to explain it without the myth of the Great Man. Or the Great Widow.

  **Elena:** And I want to explain it without the myth of the Invisible Hand. "The System" didn't burn Hattusa. People with torches did. Why they held the torches is a story.

  **Marcus:** (Signals the waiter for another round) You know, if you publish this novel, the reviewers in my department are going to eat it alive. They'll say it's anecdotal.

  **Elena:** (Smiles, sharp) And if you publish another paper on pollen counts without a single human name in it, the reviewers in my department will call it sterile. They'll say you've explained everything except what it was like to be alive.

  **Marcus:** Science isn't about what it feels like. It's about what is true.

  **Elena:** In history, what it felt like is part of what is true.

  **Marcus:** Then you'll never have a cumulative discipline. Every generation will just retell the story differently.

  **Elena:** And you'll never have a relevant one. You'll just have better graphs of a world you refuse to inhabit.

  **Marcus:** (Raises his glass) To the systems collapse.

  **Elena:** (Clinks her glass against his) To the scribe who watched it burn.

  **Marcus:** He's irrelevant to the causality.

  **Elena:** He's the only reason we care about the causality.

  *They drink. Neither looks convinced. The ice in Elena's glass melts, diluting the gin, a slow, entropic process that neither of them comments on.*
