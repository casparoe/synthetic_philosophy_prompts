      *   Is it rude/collegial? Yes.

  9.  **Final Polish:** (Self-Correction during drafting) *Make sure Marcus doesn't sound like a villain. He wants rigor. Make sure Elena doesn't sound like a relativist. She wants truth through context.* *Ensure the specific critique of the user's book (that it dramatizes rather than explains) is the core friction point.*

  **(Self-Correction Note):** I need to make sure I don't accidentally solve the debate. The prompt asks for the argument itself so the user can decide. The ending must remain open.

