  so there's a bunch of different arguments floating around for why you should maximize expected *log* wealth (geometric growth rate) instead of plain old expected value when betting/investing repeatedly — Kelly's original reasoning, Peters' ergodicity economics, Garrabrant's "geometric rationality" sequence on LW, etc. Thing is, these arguements don't actually agree on *why* it's the right move, they just converge on the same bottom line (bet kelly-ish amounts). Can you sort the justifications below into a tier list, S (most philosophically sound) down to D (weakest/most confused), based on how good the actual argument is, not how popular or practically useful it is. Give a one-sentence reason for each placement. Format like:

