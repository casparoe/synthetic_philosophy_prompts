  Justifications to sort:
  1. Kelly's original claim: log-betting maximizes your long-run wealth with probability 1 (strong law of large numbers argument)
  2. Ergodicity economics: swap the ensemble average (expected value across parallel copies of you) for the time-average growth rate, since wealth is a multiplicative, non-ergodic process and you only live one history
  3. Just posit that people have log utility for wealth — then it's bog-standard expected utility maximization, nothing conceptually new happening
  4. Gambler's-ruin reasoning: never bet in a way that has you going broke with positive probability
  5. Treat "geometric expectation" as its own basic rationality notion, on par with (not derived from) arithmetic expectation — the Garrabrant move
  6. Samuelson's objection: it's all a fallacy, since you never actually get to play "the long run" — privileging the growth-optimal strategy for finite horizons is unjustified
