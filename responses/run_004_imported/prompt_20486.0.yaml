answer: |-
  Thomas Hobbes would almost certainly interpret the rise of non-Euclidean geometry and Hilbertian formalism not as a vindication of his nominalism, but as the catastrophic severing of the materialist foundation upon which he believed geometry's certainty rested. To understand why, one must resolve the apparent tension in Hobbes's thought between his nominalist claim that truth is merely "the right ordering of names" and his materialist insistence that geometric names must refer to objects generated by motion. For Hobbes, these are not competing strands but interlocking gears: the arbitrariness of the *name* is licensed only by the necessity of the *generation*. Hilbert's formalism, by detaching the name from the generation, would appear to Hobbes not as a refinement of nominalism, but as a return to the "insignificant speech" of the Scholastics and the "blind reckoning" of the algebraists like Wallis.

  ### The Genetic Nature of Hobbesian Nominalism

  At first glance, Hilbert's assertion that "point, line, and plane" could be replaced by "table, chair, and beer mug" seems to echo Hobbes's nominalism. Hobbes argued that universals do not exist in nature; "triangle" is a name we impose on a concept. If Hilbert shows that the specific semantic content of the terms is irrelevant to the logical structure, hasn't he proven Hobbes right that mathematics is a manipulation of names?

  No. Hobbes's nominalism is strictly *genetic*. In *De Corpore*, Hobbes argues that we have certainty in geometry precisely because we define the objects by describing how to *make* them. A circle is not defined by a static set of axiomatic relations, but by the motion of a point around a center. The truth of the proposition follows from the fact that we know the cause of the figure because we are the cause.

  Hobbes writes that in geometry, "we ourselves prescribe the limits of the thing." But this prescription is not a free-floating linguistic convention; it is a prescription of *motion*. For Hobbes, a definition that does not describe a possible generation is "absurd." Hilbert's formalism, which treats terms as undefined placeholders satisfying logical relations, removes the requirement of generation entirely. To Hobbes, this would not look like a sophisticated nominalism, but like a language game unmoored from reality. It vindicates the idea that terms are names, but it discards the Hobbesian requirement that those names must track causal powers (motions). It is nominalism without materialism, which for Hobbes is merely sophistry.

  ### The Wallis Feud Revisited: Algebra as Emptiness

  The clearest evidence for this reading lies in Hobbes's feud with John Wallis. Hobbes's vitriol against Wallis was not merely personal; it was philosophical. Wallis represented the shift toward algebraic analysis and infinitesimal methods, where symbols could be manipulated according to rules without constant reference to geometric construction. Hobbes dismissed this as "scabrous symbols" and "a cheat."

  Hilbert is, in a profound sense, the philosophical triumph of Wallis. By axiomatizing geometry, Hilbert legitimized the treatment of geometric objects as algebraic variables subject to formal rules. When Hilbert suggests substituting "beer mugs" for "points," he is asserting that the *relations* matter, not the *nature* of the relata. Hobbes would argue that if you substitute "beer mugs" for "points," you have lost the *motion* that makes a point a point (the limit of a divided body) and a line a line (the tract of a moving point).

  For Hobbes, certainty arises because the reasoning mirrors the causal production of the object. If the reasoning mirrors only the logical consistency of symbols (as in Hilbert) or the algebraic manipulation of quantities (as in Wallis), the link to causal reality is broken. Hobbes would view Hilbert's formalism as the ultimate "empty symbol-manipulation" he accused Wallis of practicing. It offers consistency, but it sacrifices the *causal certainty* that Hobbes valued above all else. It turns geometry from a branch of natural philosophy (the study of bodies in motion) into a branch of logic, which Hobbes regarded as merely instrumental.

  ### Non-Euclidean Geometry and the Phantasm of Space

  The discovery of non-Euclidean geometries presents a similar threat to Hobbes's materialism. Hobbes identified space with the "phantasm of a thing existing without the mind simply." For Hobbes, Euclidean geometry was not just one consistent system among many; it was the necessary structure of the imagination itself, derived from our experience of bodies. Space *is* the geometry of possible bodily motion.

  If non-Euclidean geometries are internally consistent but do not describe physical space, Hobbes might dismiss them as "chimeras"—names without referents, akin to speaking of "incorporeal substances." However, if non-Euclidean geometry *does* describe physical space (as in General Relativity), it undermines Hobbes's specific physics, which relies on Euclidean extension.

  More damaging, however, is the implication that geometry is not unique. Hobbes's claim to certainty rested on the idea that there is one true way to generate figures, corresponding to the one true way space is constituted. The existence of multiple, equally valid geometries suggests that geometric truth is conditional on axiomatic choice, not on the necessary laws of motion. This shifts the ground of mathematics from *ontology* (what bodies do) to *convention* (what rules we choose). While this might seem to support nominalism (names are conventional), it destroys the Hobbesian hope that mathematics provides a model of *scientific* certainty regarding the natural world. If geometry is just a game of axioms, it no longer guarantees knowledge of the causal structure of the universe.

  ### Conclusion: The Demolition of the Materialist Foundation

  Ultimately, the tension between Hobbes's nominalism and his materialism resolves in favor of his materialism. His nominalism is a tool to clear away Scholastic realism, but his materialism is the positive doctrine that fills the void. Truth is the right ordering of names, *provided* those names are anchored in the generative motions of bodies.

  Hilbert and the non-Euclideanists would appear to Hobbes to have taken the nominalist half of his philosophy and weaponized it against the materialist half. They have shown that names can be ordered consistently without reference to motion or matter. Hobbes would not see this as a vindication of his view that "universals are names." He would see it as a vindication of his fear that without the anchor of material generation, mathematics becomes a "net of words" rather than a "science of consequences."

  He would argue that Hilbert's "tables and chairs" have no *conatus*, no endeavor, no motion. Therefore, they can yield no causal knowledge. In briefing Hobbes on these developments, one would have to admit that while mathematics achieved greater logical rigor, it did so by abandoning the very feature Hobbes thought made it certain: its identity with the physics of human construction. He would view the modern axiomatization of geometry not as the maturation of the discipline, but as its retreat from the world of bodies into the shadowland of mere symbols—the very fate he fought against in his decades of war with Wallis.
