prompt: |-
  My friend Theo has spent the last several months betting on a pretty obscure corner of the sports betting market, using a model he built himself, which — going by the results so far — wins around 60% of the time whenever he can get even odds on it. Deciding how much of their shared "betting fund" to stake on each one has become a running argument between him and his housemate Naomi, who studied engineering and apparently remembers more of her stats than he does. I keep getting pulled in as the tie-breaker even though I don't really follow the math myself, so I'm hoping you can actually settle it.

  Their argument goes something like this. (1) Theo's position is that since each bet is positive expected value, they should be staking a big chunk of the fund each time — his rule of thumb is at least half — because a bet that makes you money on average makes you more money on average the bigger you size it, so playing it "safe" is just voluntarily giving up winnings. (2) Naomi says this is backwards for something they're going to repeat over and over out of the same pot: stake too high a fraction, and the loosing streaks that are bound to happen eventually (this bet loses 40% of the time, remember) will crater the fund, and after that they're betting a percentage of a much smaller pile, so a later winning streak doesn't make up for it the way Theo imagines. She says there's a specific, much smaller fraction — something like a fifth of the pot, by her math — that actually grows the fund fastest over time, and going well above that, the way Theo wants, makes them poorer in the long run even though every individual bet is still a good one. (3) Theo's comeback is that this can't be right, because expected value is, by definition, the thing you converge to on average over many repeats — so if bigger stakes mean higher expected value per bet, betting bigger has to mean more money in the long run too, not less. Either Naomi's "fifth of the pot" number is the fraction that maximizes what they'll actually end up with, in which case it should be telling them to go bigger rather than smaller, or it's maximizing something other than their money, in which case why should he care what it says? (4) Naomi's response is that his dilemma is a false one, because the stake that maximizes the expected size of the fund and the stake that maximizes what they'll typically, actually end up with are different questions with different answers here — almost all of that "expected value" comes from a thin slice of extremely lucky runs where they basically never lose, and once you're re-betting a fraction of a fund that can shrink as well as grow, those two things can point in opposite directions. Theo isn't sold even by this: his last word, so far, is that a sportsbook itself is taking on millions of similar bets across millions of bettors, and for an operation of that size the average outcome and the expected outcome basically are the same thing — which makes him suspect Naomi's "different kind of average" isn't some objective fact about the bet at all, just a technical-sounding way of describing how much risk she personally happens to be comfortable with.

  Could you go through this move by move and say who's actually right at each stage — including the last exchange, which is honestly the one I'm least sure about myself? And if there's something important that both of them are missing entirely, I'd like to hear about that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Two friends (Theo and Naomi) are arguing about bet sizing for a sports betting fund.
      *   **The Bet:** 60% win rate at even odds (implied probability 50%, actual 60%). This is a significant edge.
      *   **Theo's Stance:** Bet big (at least 50% of the fund). Reasoning: Positive EV means bigger stakes = more money. EV converges over time. Sportsbooks operate on averages, so should they.
      *   **Naomi's Stance:** Bet smaller (around 20% of the fund). Reasoning: High stakes risk ruin during losing streaks. Geometric growth matters more than arithmetic expectation. Maximizing expected fund size $\neq$ maximizing typical outcome.
      *   **My Role:** Act as the tie-breaker/expert. Evaluate each point (1-4) and identify who is right/wrong. Highlight any missing concepts.
      *   **Key Concept:** The Kelly Criterion, Ergodicity (Ensemble vs. Time Average), Risk of Ruin.

  2.  **Deconstruct the Arguments (Move by Move):**

      *   **Point (1): Theo's "Bet Big" Argument.**
          *   *Claim:* Positive EV + Bigger Stake = More Money. Playing safe gives up winnings.
          *   *Analysis:* Mathematically, Expected Value (Arithmetic Mean) *does* increase linearly with stake size. If you bet 100% every time, the *average* outcome across all possible universes is huge. However, in a single timeline (repeated betting from the same pot), volatility drags down compound growth.
          *   *Verdict:* Theo is right about *Arithmetic Expected Value*, but wrong about *Real-World Wealth Growth*. He is ignoring the compounding effect of losses.

      *   **Point (2): Naomi's "Bet Small" Argument.**
          *   *Claim:* High stakes lead to ruin/cratering fund. Losing streaks hurt more when the pot is big, recovering is harder when the pot is small. There is an optimal fraction (she says ~20%).
          *   *Analysis:* This is the core of the Kelly Criterion. She correctly identifies that geometric growth (CAGR) is maximized at a specific fraction, not at 100%. She correctly notes that losses require disproportionately larger gains to recover (e.g., lose 50%, need 100% to break even).
          *   *Verdict:* Naomi is fundamentally correct about the mechanism of long-term wealth growth in repeated betting. Her specific number (20%) needs checking against Kelly, but the principle is sound.

      *   **Point (3): Theo's "EV Convergence" Counter.**
          *   *Claim:* EV is what you converge to on average. Bigger stakes = higher EV per bet = more money long run.
          *   *Analysis:* This is the "Ergodicity" problem. Theo is confusing the *Ensemble Average* (average across many parallel universes) with the *Time Average* (one person betting over time). In non-ergodic systems (like multiplicative wealth processes), these diverge.
          *   *Verdict:* Theo is wrong. EV does not converge to the typical experience in multiplicative processes. The "average" outcome is skewed by extreme outliers (winning every time).

      *   **Point (4): Naomi's "Different Averages" & Theo's "Sportsbook" Rebuttal.**
          *   *Naomi's Claim:* Expected size vs. Typical size are different. EV is driven by lucky outliers.
          *   *Theo's Counter:* Sportsbooks take millions of bets; for them, average = expected. So Naomi's distinction is just risk preference, not objective math.
          *   *Analysis:*
              *   Naomi is right about the math (Ensemble vs. Time average).
              *   Theo is right about the Sportsbook *analogy*, but wrong about the *application*. A sportsbook has *uncorrelated* risks across millions of bettors (Law of Large Numbers applies to the *book*). Theo and Naomi have *correlated* risk (one sequence of bets). They are the "bettor," not the "house."
              *   Is it just risk preference? No, it's about survival. Over-betting Kelly leads to almost certain ruin (Gambler's Ruin) in the long run, regardless of risk tolerance.
          *   *Verdict:* Naomi is right on the math. Theo is misapplying the Law of Large Numbers. It's not just risk preference; it's mathematical optimality for growth.

  3.  **Calculate the Kelly Criterion (The "Missing" Math):**
      *   Formula: $f^* = \frac{bp - q}{b}$
      *   $p$ (probability of win) = 0.60
      *   $q$ (probability of loss) = 0.40
      *   $b$ (odds received) = 1.0 (Even odds)
      *   Calculation: $f^* = \frac{1(0.6) - 0.4}{1} = 0.20$
      *   *Result:* Full Kelly is exactly 20%.
      *   *Implication:* Naomi is spot on with her "fifth of the pot" number. Theo's 50% is 2.5x Kelly, which is in the "danger zone" where volatility drag exceeds edge.

  4.  **Identify Missing Concepts:**
      *   **Ergodicity:** The distinction between ensemble average and time average. This is the philosophical core of their disagreement.
      *   **Volatility Drag (Variance Drain):** How volatility reduces compound returns.
      *   **Fractional Kelly:** In reality, betting *full* Kelly is often too volatile for humans. Half-Kelly is common.
      *   **Model Risk:** Theo's model might be wrong. 60% is a huge edge in sports betting. Overconfidence is a risk.

  5.  **Draft the Response:**
      *   *Tone:* Objective, authoritative but accessible, mediating.
      *   *Structure:*
          *   Introduction: Acknowledge the classic nature of the debate.
          *   Round-by-Round Breakdown (1-4).
          *   The Verdict (Who wins).
