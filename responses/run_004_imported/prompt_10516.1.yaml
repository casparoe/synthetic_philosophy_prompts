prompt: |-
  My friend Elena did one of those sensory deprivation float tanks last weekend and came out convinced it proves her mind is separate from her body, since with zero sensation (pitch dark, silent, floating in body-temp water) she said there was still definately a pure 'I' in there. We argued about it for ages, me saying that just because you can't feel your body doesn't mean you're not still totally dependent on it to think anything at all, since every thought she had in there was built from concepts she only has because of years of ordinary sensory experience. Turns out this is basically an old argument: some medieval philosopher called Avicenna had almost the identical setup centuries earlier (a man created instantly as a full-grown adult, floating in midair, blindfolded, limbs spread so they don't even touch each other, total silence, zero prior experience) and used it to argue the soul has to be separate from the body, since the guy would still know he exists. Can you write a dialogue between the two of us that goes further than we managed - her properly defending the argument, and me pushing the objection that you can't conjure 'I exist' out of nowhere when Avicenna's own theory of concepts (abstraction from the senses) says you need sensory experience first to have any concepts at all. Give her a genuinely good comeback instead of letting her just concede, and get the whole conceivability-isn't-possibility problem in there somewhere too. Neither of us should be a pushover, make them really respond to each other instead of talking past one another.
