answer: |-
  This is a sharp critique, and you should definitely feel encouraged to write it up. You have correctly identified a foundational tension in acausal decision theory (ADT) that often gets glossed over in introductory or "pop-rationalist" expositions, even if it is acknowledged in the more technical literature.

  Here is a sanity check on the argument's validity and its novelty, along with some pointers on how the existing literature might push back.

  ### 1. Does the argument hold together?

  **Yes.** You have accurately reconstructed the "Reference Class Problem" for subjunctive dependence.

  Your core insight—that the argument for acausal trade seems to require the reference class to be both narrow (to guarantee correlation) and wide (to guarantee gains from trade)—is structurally sound. In the literature, this is sometimes discussed under the header of **"logical uncertainty"** or the **"similarity metric" problem.**

  Here is where your argument is strongest, and where it might need slight sharpening to withstand technical counter-arguments:

  *   **The Continuum vs. Binary:** Proponents of Functional Decision Theory (FDT) or Multiverse-Wide Superrationality (MWSR) would argue that subjunctive dependence isn't binary (0 or 1), but continuous. They don't need *guaranteed* correlation; they just need a high enough *probability* of correlation to make the Expected Utility (EU) calculation favor cooperation.
      *   *Your Counter:* You can sharpen your argument here by noting that **estimating that probability is where the magic happens.** If I am a "rational consequentialist" and I meet another "rational consequentialist," what is the prior probability that our decision algorithms are subjunctively dependent? If the answer is "it depends on how similar our source code is," we are back to the narrow/trivial case. If the answer is "high, because rationality converges," that is a substantive empirical/philosophical claim that needs defense, not just a decision-theoretic axiom.
  *   **The "Triviality" Claim:** You argue that narrow correlation (clones) makes the trade trivial.
      *   *Counter-argument:* Even coordinating with exact copies across the multiverse isn't trivial if there are gains from *specialization*. (e.g., In World A, I produce paperclips; in World B, my copy produces staples. We agree to split the value).
      *   *Refinement:* You might want to adjust your claim from "trivial" to "limited." The *volume* of potential trade is vastly higher if you can trade with agents who value different things (wide class), but the *confidence* in the trade is higher with agents who think exactly like you (narrow class). The tension is between **Volume** and **Reliability**.
  *   **The "Smuggling" Charge:** This is your strongest point. The claim "If you defect, they defect" works tautologically for logical duplicates. When applied to "other rational agents," it implicitly assumes that "rationality" is a unique attractor state that all agents converge on. This is a claim about the structure of reasoning, not just decision theory. If rationality is a basin of attraction, fine. If there are multiple reflective equilibria (which seems likely), the correlation breaks.

  ### 2. Is this new, or repackaged?

  **It is not strictly new, but it is under-exposed.**

  You are not the first to notice this, but clear expositions of it are rarer than the technical proofs that assume it away.

  *   **The FDT Paper (Soares & Yudkowsky, 2017):** They explicitly acknowledge that subjunctive dependence is a matter of degree. They write that the agent must have a model of how its decision correlates with others. However, they largely leave the *construction of that model* as an open problem for logical uncertainty. Your post effectively asks: "How do we build that model without begging the question?"
  *   **Caspar Oesterheld's MWSR:** Caspar is very aware of this. In his work on *Multiverse-wide Superrationality*, he models this using a Bayesian uncertainty over the correlation coefficient ($\rho$). He explicitly discusses the problem of "Who counts as a superrational partner?" Your critique aligns with the "prior over $\rho$" problem. If you don't know how similar the other agent is, you don't know what $\rho$ to use.
  *   **Program Equilibrium (Tennenholtz, 2004):** In computer science, this is handled by agents reading each other's source code. If I can verify your code matches mine (or leads to the same output), we cooperate. This solves the "narrow" case technically but fails in the real world where we can't read each other's source code (the "wide" case).
  *   **The Kantian Analogy:** This is a nice touch. The "maxim-individuation problem" in Kantian ethics is structurally identical to the "reference class problem" in ADT. I haven't seen this analogy drawn explicitly in the LessWrong canon often, and it could be a valuable bridge for philosophers outside the rationalist bubble.

  ### 3. Advice for the Post

  If you turn this into a post, here is how to maximize its impact and minimize "actually, you're wrong" comments from the technical crowd:

  1.  **Acknowledge the Continuum:** Concede that ADT doesn't require 100% correlation. Frame your critique as: *"Without a principled way to estimate the degree of correlation for non-identical agents, the theory lacks predictive power."*
  2.  **Focus on the Prior:** The crux of your argument is about the **prior probability of subjunctive dependence**. How do I assign a probability that a random alien consequentialist is subjunctively linked to me? If I assign 0, no trade. If I assign 1, I'm assuming the conclusion. If I assign 0.5, where did that number come from?
  3.  **Distinguish "Pop AT" from "Technical AT":** Acknowledge that researchers like Oesterheld know this is hard. Your critique is more aimed at the *application* of these ideas (e.g., "I should donate to charity X because it pleases acausal partners") where the uncertainty is often ignored.
  4.  **Keep the Kant Analogy:** It highlights that this is a general problem with universalizability, not just a quirk of Yudkowskian decision theory. That makes the post more robust.

  ### Verdict

  **Post it.**

  You aren't "deriving something settled," but you are articulating a **foundational open problem** in a way that is accessible. The "Reference Class Problem for Subjunctive Dependence" is a genuine hole in the practical application of Acausal Trade. Even if the theorists say "Yes, we know, it's logical uncertainty," the community often acts as if the correlation is stronger than the theory justifies.

  Your intuition that the argument "needs it both ways at once" is the correct steelman of the critique. It's the **Trade-off between Correlation Strength and Gains from Trade.**

  Go for it. Just be prepared for the comment section to point you toward *Logical Induction* papers (Garrabrant et al.) as the attempted mathematical solution to the "how similar is similar enough" problem. (Spoiler: It's still an open research area, which vindicates your post).
