          *   Premise 3: Mental properties are distinct from physical properties (NRP claim).
          *   Conclusion: Mental properties are epiphenomenal (causally inert).
          *   *Mechanism:* If $P$ causes $P^*$, and $M$ supervenes on $P$, then $M$ is excluded because $P$ did all the work.
      *   **Yablo's Response (Determinable/Determinate):**
          *   Analogy: Sophie pecks at red. Scarlet is a determinate of Red (determinable).
          *   Claim: Redness causes the peck, not *just* scarlet-ness. They don't compete because they aren't distinct events in the rivalrous sense.
          *   Application to Mind: Mental property $M$ is a determinable of physical property $P$. $M$ can be the cause without competing with $P$.
          *   *Key Insight:* Proportionality. The cause should be proportional to the effect. Scarlet is too specific; Red is just right.

  3.  **Evaluate the Strengths and Weaknesses:**
      *   **Yablo's Strengths:**
          *   Intuitively appealing (Sophie example works well).
          *   Addresses the "competition" assumption. Kim assumes $M$ and $P$ are rivals; Yablo says they are hierarchically related.
          *   Solves the "too specific" problem (why my belief that it's hot causes me to sweat, not the specific neural firing pattern).
      *   **Yablo's Weaknesses (Kim's Counter/Relocation):**
