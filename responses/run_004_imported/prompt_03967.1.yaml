          *   *Closure:* Physical closure still holds. If $P$ is sufficient, why do we need $M$? Yablo says $M$ is *better*, but Kim says $M$ is *idle* if $P$ is sufficient.
          *   *Multiple Realizability:* Yablo relies on $M$ being a determinable of $P$. But if $M$ is multiply realizable, $M$ isn't a determinable of *this specific* $P$ in the same way Red is of Scarlet. Red is *defined* by shades like Scarlet. Pain isn't defined by C-fiber firing specifically (since it could be silicon). This is a crucial disanalogy.

