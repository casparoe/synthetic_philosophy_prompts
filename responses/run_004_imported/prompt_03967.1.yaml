answer: |-
  Here is the bottom line: **Yablo's move is ingenious, but it ultimately relocates the exclusion problem rather than solving it. I find Kim's argument more convincing on the metaphysical front, even if Yablo captures something important about explanation.**

  Here is the comparison and the reasoning behind that verdict.

  ### The Core Conflict

  **Kim's Exclusion Argument** rests on a simple, brutal arithmetic of causation. If the physical domain is causally closed (every physical effect has a sufficient physical cause), and the mental supervenes on the physical, then the physical realizer ($P$) is sufficient to produce the effect ($E$). If $P$ is sufficient, there is no "causal work" left for the mental property ($M$) to do. If you say both do it, you imply systematic overdetermination (like two assassins shooting at once), which is implausible. Therefore, $M$ is epiphenomenal.

  **Yablo's Response** attacks the assumption that $M$ and $P$ are rivals. Using the Sophie the Pigeon analogy, he argues that causation requires **proportionality**.
  *   Sophie pecks at red things.
  *   She is shown a scarlet chip.
  *   Did *scarlet* cause the peck, or did *red*?
  *   Yablo says *red*. Scarlet is too specific (if the chip were crimson, she still would have pecked). Red is "proportional" to the effect.
  *   **Application:** Mental properties are determinables (like Red); physical properties are determinates (like Scarlet). They don't compete for the same causal slot because one is a higher-level abstraction of the other. $M$ causes $E$ because $M$ captures the relevant features without the noise of the specific neural implementation.

  ### Why Yablo Seems Tempting

  Yablo's intuition is powerful because it aligns with how we actually talk about causes. If I ask, "Why did the window break?" and you say, "Because a missile with mass $X$ traveling at velocity $Y$ struck it," you are technically correct but pragmatically annoying. "Because someone threw a rock" is the *proportional* cause.

  Yablo saves the **explanatory relevance** of the mental. He shows that mental properties track counterfactual dependencies better than micro-physical properties. If my belief that "it is raining" causes me to grab an umbrella, that causal link holds across many different neural realizations of that belief. The specific neural firing ($P$) is too fragile to be the stable cause.

  ### Why Kim Wins (The Metaphysical Gap)

  However, saving explanatory relevance is not the same as saving **metaphysical causal efficacy**. Here is why I find Kim more convincing and why Yablo's move relocates the problem:

  **1. The Disanalogy of Multiple Realizability**
  The Red/Scarlet relation is a conceptual or semantic hierarchy. "Red" is defined as a determinable of shades like scarlet, crimson, etc. But in Non-Reductive Physicalism (NRP), the relationship between Mental ($M$) and Physical ($P$) is **supervenience**, not determinability.
  *   Redness *is* a disjunction of specific wavelengths.
  *   Pain is *not* simply a disjunction of C-fiber firings (or silicon states, etc.).
  If mental properties are multiply realizable, $M$ does not stand in a determinable relation to *this specific* $P$. $M$ could be realized by $P^*$, $P^{**}$, etc. This means $M$ is not a higher-level version of $P$; it is a functional role that $P$ happens to fill.
  Kim presses this: If $M$ is distinct from $P$ (which NRP requires), and $P$ is causally sufficient for the physical effect (which Physicalism requires), then $M$ is still a distinct property that is causally idle. Yablo treats $M$ and $P$ as if they are the *same event* described differently, but Kim insists they are distinct properties. If they are distinct, exclusion applies.

  **2. Causal Closure is a Hard Constraint**
  Yablo's argument works well if we are talking about "causation" as a pragmatic, explanatory tool. But Kim is talking about causation as a metaphysical glue holding the universe together.
  The Principle of Physical Causal Closure states that every *physical* effect has a *physical* cause.
  *   Yablo says: $M$ causes the behavior.
  *   Kim asks: Is the behavior a physical event? Yes. Does it have a physical cause? Yes ($P$).
  *   If $M$ is not identical to $P$, then $M$ is a non-physical property causing a physical event. This violates closure unless $M$ is identical to $P$ (which collapses NRP into Reductive Physicalism).
  Yablo tries to say $M$ causes the effect *in virtue of* $P$, but this just pushes the question back: In virtue of what? If it's in virtue of $P$'s causal power, then $P$ is the real cause, and $M$ is just a passenger.

  **3. Relocating the Exclusion**
  You asked if Yablo just relocates the problem up a level. **Yes, he does.**
  Yablo solves the problem of why we don't say "Scarlet caused the peck" instead of "Red." But he doesn't solve why the *determinable* has causal power if the *determinates* are doing all the physical heavy lifting.
  If the physical realizer ($P$) is sufficient, the determinable ($M$) is still excluded from the *physical* chain of events. Yablo successfully argues that $M$ is a *better explanation*, but he fails to prove that $M$ is a *metaphysically distinct cause* that isn't rendered inert by $P$. He saves the mind's relevance, but he does so by making the mind's causation dependent entirely on the physical base, which is exactly Kim's point: the physical base is doing all the work.

  ### The Verdict

  I side with **Kim**.

  Yablo provides the best defense Non-Reductive Physicalism has, but it is a defensive retreat. He concedes that the physical level is where the "oomph" of causation lies, and argues that the mental level is where the "meaning" of causation lies.

  But if the goal of NRP is to show that mental properties are **ontologically distinct** yet **causally potent** in the physical world, Yablo fails. He shows they are causally potent *as descriptions*, but not necessarily as distinct properties. If $M$ causes $E$ only because $P$ causes $E$ and $M$ supervenes on $P$, then $M$'s causal power is derivative. Kim argues that derivative causal power isn't real causal power—it's epiphenomenalism with extra steps.

  Yablo gets NRP off the hook of *absurdity* (it makes sense to talk about mental causes), but he does not get it off the hook of *metaphysical exclusion*. The physical realizer is still doing all the work; Yablo just convinces us to stop caring that the mental property is technically inert. Therefore, Kim's challenge remains the dominant metaphysical problem for non-reductive physicalism.
