prompt: |-
  so i've been reading about pragmatism on my own time, mostly because i keep hearing people boil it down to "truth is just whatever works for you," which never sat right with me. turns out that's more the james version of it, and the guy who actually started the whole thing, peirce, wrote an essay back in 1878 called "how to make our ideas clear" that reads pretty different. i got stuck on this bit:

  "Let us ask what we mean by calling a thing hard. Evidently that it will not be scratched by many other substances. The whole conception of this quality, as of every other, lies in its conceived effects. There is absolutely no difference between a hard thing and a soft thing so long as they are not brought to the test. Suppose, then, that a diamond could be crystallised in the midst of a cushion of soft cotton, and should remain there until it was finally burned up. Would it be false to say that that diamond was soft? This seems a foolish question, and would be so, in fact, except in the realm of logic... We may, in the present case, modify our question, and ask what prevents us from saying that all hard bodies remain perfectly soft until they are touched, when their hardness increases with the pressure until they are scratched. Reflection will show that the reply is this: there would be no falsity in such modes of speech."

  wait, is he seriously saying a diamond that never gets touched by anything isnt actually hard? that feels backwards, the thing has whatever structure it has no matter what we ever do to it. but i guess if meaning only comes from "conceived effects," then theres nothing more to hardness than that, so theres no fact left over to be wrong about. is this close to where peirce and james actually split - like james just cares whether believing something works out for you personally, while peirce is after something stricter that would hold up no matter who's doing the testing? or am i misreading the passage entirely. would love someone to break it down for me
