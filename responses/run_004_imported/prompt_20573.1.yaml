answer: |-
  For forty years, my life was defined by symmetry. As an x-ray crystallographer, I spent my days looking at diffraction patterns, finding the order in atoms, measuring how things align. In a crystal lattice, symmetry often implies equivalence. If two atoms are related by symmetry, they are, for the purposes of the structure, interchangeable.

  But when I retired, I traded my diffraction patterns for philosophy papers. And last year, I read Max Black's famous argument against the Principle of the Identity of Indiscernibles.

  For those of you who haven't been reading metaphysics in your spare time: Leibniz argued that if two things share every single quality—size, color, temperature, composition—they must be the same thing. You can't have two of them. Max Black disagreed. He imagined a universe containing nothing but two iron spheres. They are exactly alike in every intrinsic quality. They even share relational properties; each is two miles from the other. They are qualitatively identical. And yet, Black argues, there are undeniably *two* spheres. Not one. Their numerical distinctness is a brute fact of the universe.

  I thought of Nora and Ellie immediately.

  Growing up, the world often treated my daughters like Leibniz's atoms. Because they share a birthday, a genetic code, and a history, people assumed they shared an identity. Comments were made. Comparisons were drawn. The implication was often that their similarity made them less distinct as individuals.

  But Black's spheres taught me something different. They taught me that you do not need difference in quality to justify difference in being. You are not two because you look different, Nora and Ellie. You are two because existence itself allows for multiplicity. Your distinctness doesn't require a differentiating mark. It is fundamental.

  In crystallography, we locate atoms by their coordinates in space. In life, you have located yourselves by your choices.

  This brings me to your partners. In Black's universe, the spheres are static. They just *are*. But this room is not a static universe. It is expanding.

  Nora, [Fiancé's Name] stands beside you. Ellie, [Fiancé's Name] stands beside you. You are no longer just two spheres in a void. You are creating new relational properties. You are building new coordinate systems.

  [Fiancé's Name], I know you're writing your dissertation on this very paper. You know better than anyone that Black's argument relies on the impossibility of collapsing two particulars into one concept. So, I will not insult your intelligence by saying marriage makes you "one." That is bad metaphysics and worse geometry.

  Instead, I propose that marriage is the acknowledgment of the other sphere. It is the recognition that even if the world sees symmetry, there is a unique center of consciousness looking back at you. It is the commitment to honor the numerical distinctness of the person you love.

  Nora and Ellie, you have always been two. That was never in doubt. But today, you are formally inviting two others into your orbit to witness that distinctness, to honor it, and to walk beside it.

  My job was to find order in the structure of things. Your job is to find meaning in the relationship between them.

  So, if everyone would please rise.

  To Nora and Ellie, and to [Fiancé 1] and [Fiancé 2]. May you always respect the distance between you, for it is what allows you to stand side by side. And may you always recognize that while love connects you, it never dissolves you.

  To the brides and grooms.
