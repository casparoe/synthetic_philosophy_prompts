      *   *Theory $T_{BB}$:* Predicts $N_{BB} \gg N_{OO}$.
      *   *Inference:* $P(\text{I am BB} | T_{BB}) \approx 1$.
      *   *Defeater:* If I am BB, $O$ is a random fluctuation, not evidence of actual past order. Thus $T_{BB}$ undermines the evidential link between $O$ and reality.

  4.  **Drafting the Example (Iterative refinement):**
      *   *Name:* The "Thermal Equilibrium Universe" (TEU).
