      *   *Problem:* BBs have false memories. If I am a BB, my belief in $T$ (based on evidence $E$) is likely false/unreliable.
      *   *Conclusion:* Reject $T$.
      *   *The Catch:* To conclude "Reject $T$", I must trust my reasoning. But if $T$ is true, I can't trust my reasoning. So why am I using reasoning to reject $T$?
      *   *Resolution (Standard):* This is often framed as a *reductio ad absurdum* of $T$ because $T$ makes the evidence for $T$ (or any evidence) unreliable. It's an epistemic defeater.

  3.  **Develop a Concrete Toy Model:**
