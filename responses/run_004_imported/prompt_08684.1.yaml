  **Point 1 (Jake): 0**
  Jake relies on a simplified "pop philosophy" version of Popper. While falsifiability is a key demarcation criterion, claiming chiropractic is *in principle* unfalsifiable is factually shaky, as specific claims can be (and have been) tested.

  **Point 2 (Mina): 2**
  Mina correctly identifies that a theory which fails empirical tests is "falsified," not "unfalsifiable." This is a precise philosophical distinction; pseudoscience often ignores falsification, but the existence of failed tests proves the claims were testable.

  **Point 3 (Jake): 1**
  Jake pivots to the problem of "ad hoc hypotheses" (immunizing stratagems), which is a valid criticism of how chiropractic is often defended clinically. However, stating the theory "can't lose" is hyperbolic, even if practitioners frequently use these defenses to avoid refutation.

  **Point 4 (Mina): 2**
  Mina accurately invokes the Duhem-Quine thesis, noting that auxiliary assumptions (like dosage or compliance) protect almost all scientific theories from immediate refutation. This successfully challenges the idea that ad hoc adjustments are unique to pseudoscience.

  **Point 5 (Jake): 2**
  Jake upgrades his argument to Lakatos's "Research Programmes," which is a more robust framework than Popper's for evaluating long-term scientific health. Characterizing chiropractic as a "degenerating program" that retreats rather than predicts novel facts aligns with the historical consensus on its core vitalistic theories.

  **Point 6 (Mina): 1**
  Mina is right to call out the goalpost shift from falsifiability to progressiveness, and "stagnation" is harder to define operationally. However, she understates that "degenerating research programs" is a recognized philosophical concept, not just vague hindsight.

  **What They're Missing**
  Both are arguing about the *philosophy of science* (demarcation) rather than the *clinical evidence* (efficacy). The practical question isn't whether chiropractic is "science," but whether spinal manipulation is safe and effective for specific conditions like lower back pain (which evidence suggests it can be, minus the vitalistic "subluxation" theory). They also overlook the split within the profession between "straight" chiropractors (who hold the debunked vitalistic views) and "evidence-based" chiropractors (who function largely as musculoskeletal specialists).
