  1.  **Analyze the Request:**
      *   **Host:** Science and ideas podcast.
      *   **Guest:** Experimental philosopher (X-Phi).
      *   **Topic:** Cultural/socioeconomic variation in philosophical intuitions (Weinberg, Nichols, Stich line of research), specifically regarding Gettier cases and Kripke's Gödel/Schmidt case.
      *   **Guest's Stance:** These splits undermine using intuitions as evidence (anti-armchair philosophy/reflective equilibrium).
      *   **Requirements:** 8-10 interview questions.
      *   **Specific Inclusions:**
          *   At least one on the "expertise defense."
          *   At least one on replication crises/shrinking effects.
          *   At least one on pragmatic/translation artifacts.
      *   **Format:** Question + Brief Follow-up (keyed to likely answer).
      *   **Goal:** Go beyond restating findings (deep dive into implications, methodology, and future of philosophy).

  2.  **Deconstruct the Guest's Position & Context:**
      *   *Core Argument:* If intuitions vary by culture/class, they aren't universal evidence. If they aren't universal, the method of reflective equilibrium (balancing theory with intuition) is flawed.
      *   *Key Studies:* Weinberg, Nichols, & Stich (2001) "Normativity and Epistemic Intuitions."
      *   *Counter-arguments:* Expertise defense (philosophers are trained), Replication issues (some effects don't hold up), Pragmatics (people mean the same thing but interpret the prompt differently).
      *   *Podcast Vibe:* Science and ideas (needs to be accessible but intellectually rigorous, bridging empirical data with metaphilosophical implications).

  3.  **Drafting Questions (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Intro/Background.
          2.  The main findings.
          3.  Expertise defense.
          4.  Replication issues.
          5.  Pragmatics.
          6.  What should philosophers do instead?
