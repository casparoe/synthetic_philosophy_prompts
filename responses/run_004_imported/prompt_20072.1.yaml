      *   Pragmatics included? Yes (Q4).
      *   Follow-ups included? Yes.
      *   Tone appropriate? Yes (Science/Ideas podcast).

  6.  **Polishing:** Ensure the follow-ups are punchy and push the conversation forward, not just "Oh, interesting." Make sure the questions don't sound like they are asking for a summary of her CV. (Self-Correction: Make sure Q1 isn't just "What is reflective equilibrium?" but rather "How does your work break it?")

  7.  **Final Polish of Follow-ups:** Ensure they anticipate the *most likely* answer. For example, on replication, she will likely argue that heterogeneity *is* the finding. The follow-up should press on statistical power. On expertise, she will likely argue philosophers are overconfident. Follow-up should ask about blind spots.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here are ten interview questions designed for a science and ideas podcast, tailored to an experimental philosopher working in the Weinberg, Nichols, and Stich tradition. They focus on metaphilosophical implications, methodological challenges, and the future of the discipline, rather than simply recapping the data.

  ### 1. The Death of Reflective Equilibrium?
  **Question:** The method of "reflective equilibrium" relies on going back and forth between our general principles and our specific intuitions until they cohere. If your research suggests those specific intuitions are contingent on cultural or socioeconomic background rather than universal rational competence, does this effectively break the engine of traditional analytic philosophy, or just require it to be recalibrated?
  **Follow-up:** *If she argues it requires recalibration:* "Who gets to decide the new calibration settings? If we can't trust the armchair intuition, do we need a democratic vote on philosophical truth, or does that surrender the normative power of philosophy entirely?"

  ### 2. The Expertise Defense
  **Question:** A common counter-argument to your work is the "expertise defense"—the claim that while laypeople's intuitions might vary, trained philosophers possess a refined conceptual competence that filters out this noise. Do you view philosophical training as a mechanism that corrects for cognitive bias, or is it possible that training simply encodes a specific cultural bias more deeply, making it harder to detect?
  **Follow-up:** *If she argues training encodes bias:* "If that's the case, should we be worried that the 'consensus' in top journals is just an echo chamber of WEIRD (Western, Educated, Industrialized, Rich, Democratic) cognitive styles masquerading as universal rationality?"

  ### 3. Replication and Effect Sizes
  **Question:** Since the early 2000s, there have been larger, multi-lab replication attempts regarding these intuition pumps. Some have shown that the cross-cultural gaps you identified shrink or disappear when sample sizes increase or controls are tightened. How do you reconcile your theoretical conclusion—that intuitions are unstable evidence—with data that suggests the effect might be smaller than originally thought?
  **Follow-up:** *If she argues heterogeneity is still present:* "Even if the effect is smaller, does the mere *possibility* of demographic variation impose a burden of proof on armchair philosophers to empirically verify their intuitions before publishing, or is that an impractical standard for the field?"

  ### 4. Pragmatics vs. Concepts
  **Question:** Critics often argue that what looks like a conceptual difference is actually a pragmatic one. For example, when a participant from a different culture responds differently to the Gödel case, are they actually conceiving of "reference" differently, or are they just interpreting the conversational context of the survey question differently? How do you distinguish between a difference in *meaning* and a difference in *processing*?
  **Follow-up:** *If she argues controls account for this:* "But if the cognitive mechanism for processing the vignette is culturally sensitive, does it matter for the philosopher's purpose? If the output varies, isn't the input unreliable regardless of whether the underlying concept is technically the same?"

  ### 5. The Normative Leap
  **Question:** There is a classic objection that experimental philosophy commits a naturalistic fallacy: you are describing how people *do* think, but philosophy is often concerned with how people *ought* to think. Even if intuitions vary, couldn't one group simply be wrong? How do you move from the sociological fact of disagreement to the metaphilosophical conclusion that intuition is bankrupt as evidence?
  **Follow-up:** *If she argues we lack access to the 'ought':* "So are you suggesting that without a 'view from nowhere' to adjudicate between conflicting intuitions, we must suspend judgment on cases like Gettier entirely, or just stop using them as foundational proof?"

  ### 6. Ethics vs. Epistemology
  **Question:** Most of the early work focused on epistemology and reference, like the Gettier or Gödel cases. Do you see these demographic splits as more dangerous for moral philosophy? If intuitions about knowledge vary, it's troublesome; but if intuitions about harm, fairness, or rights vary along socioeconomic lines, does that threaten the project of normative ethics even more severely?
  **Follow-up:** *If she agrees ethics is more vulnerable:* "Does this imply that applied ethics, bioethics, or AI safety needs a much more diverse team of practitioners not just for representation, but to ensure the 'data' of their moral reasoning isn't systematically skewed?"

  ### 7. Alternative Methodologies
  **Question:** If we accept your critique and minimize the role of intuition pumps, what replaces them? Should philosophy become more continuous with cognitive science, focusing on descriptive accounts of reasoning, or should it retreat to formal logic and conceptual analysis that doesn't rely on case judgments?
  **Follow-up:** *If she suggests integration with science:* "Does that risk turning philosophers into junior scientists? What unique value does the philosopher bring if they are no longer the guardians of a priori intuition?"

  ### 8. The "WEIRD" Problem in Theory Construction
  **Question:** Your work highlights that most philosophical theory is built on data points from a very narrow slice of humanity. If we acknowledge that our current canon is essentially a "local folklore" of Western academia, is the goal to expand the canon to include other traditions, or to abandon the search for universal theories altogether in favor of context-specific philosophies?
  **Follow-up:** *If she argues for expansion:* "How do we avoid tokenism? Is it enough to test non-Western subjects on Western cases, or do we need to be testing Western subjects on cases derived from non-Western philosophical traditions?"

  ### 9. Institutional Resistance
  **Question:** It has been over two decades since the Weinberg, Nichols, and Stich paper. While experimental philosophy is now established, the "armchair" method remains dominant in many top departments. Why do you think the resistance persists? Is it intellectual conservatism, or is there a genuine methodological disagreement about what philosophy is supposed to achieve?
  **Follow-up:** *If she cites institutional inertia:* "Does this suggest that the future of this research lies outside philosophy departments, perhaps in psychology or cognitive science labs, and should that worry philosophers?"

  ### 10. The Future of Disagreement
  **Question:** Ultimately, your work suggests that philosophical disagreement might not be resolvable through better argumentation, because the parties are starting from different cognitive baselines. Does this lead to a kind of philosophical relativism, or is there a path forward where we can still make progress despite knowing our intuitions are culturally situated?
  **Follow-up:** *If she suggests progress is still possible:* "What does 'progress' look like in that context? Is it less about finding the Truth and more about mapping the landscape of human conceptual possibilities?"
