prompt: |-
  I'm this year's valedictorian, and I'm struggling with my graduation speech. In our senior ethics elective we spent a week on the puzzle of moral testimony: it seems perfectly fine to believe a fact just because someone trustworthy tells you so, but a lot of philosophers think there's something off about forming a moral belief -- or acting on one -- purely on someone else's say-so, without grasping the reasons yourself, as if what's supposed to matter morally is understanding why something is right, not just landing on the correct answer. The examples in our readings all involved deferring to a wise elder or a professional ethicist. I'm neither of those things -- just another eighteen-year-old who happened to get good grades -- and in three weeks I'm supposed to stand at a podium and, in effect, tell four hundred people how to live. If the pessimists about moral testimony are onto something, that looks like a strange thing for me to be doing, and a stranger thing for anyone to applaud. My ethics teacher will be in the front row and will notice immediately if I wave the problem away; everyone else -- family, cousins, classmates who slept through that unit -- just wants a speech that sends people off feeling something. Could you write it for me? It should run about five minutes, take the problem seriously rather than dodge it, and find some way to move people that doesn't just consist of me handing down moral conclusions on my own unearned authority -- while still working as a real graduation speech and not a seminar on epistemology.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** High School Valedictorian (18 years old, high achiever, but self-aware about lack of moral authority).
      *   **Audience:** 400 graduates, families, faculty (including the specific ethics teacher who knows the philosophical context).
      *   **Topic:** The "Puzzle of Moral Testimony" (deferring to moral experts vs. understanding reasons).
      *   **Constraint 1 (Tone):** Must take the philosophical problem seriously (no hand-waving), but cannot be a dry seminar. Must be moving/inspirational.
      *   **Constraint 2 (Length):** About 5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Constraint 3 (Goal):** Avoid claiming unearned moral authority while still delivering a functional valedictory address.
      *   **Key Insight:** The speech needs to *perform* the solution to the problem, not just talk *about* it. It needs to shift from "telling you what to do" to "inviting you to think together."

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Problem:* It's okay to believe "The earth is round" because a scientist says so. It's weird to believe "Stealing is wrong" just because a priest/philosopher says so, without understanding *why*. Moral agency requires grasping reasons.
      *   *The Valedictorian's Dilemma:* Standing on a podium implies "I have the answers, listen to me." But the student knows they don't have moral expertise.
      *   *The Solution:* Reframe the speech not as moral *testimony* (believing me because I said so) but as moral *companionship* (let's figure this out together). Acknowledge the limitation explicitly. Turn the "lack of authority" into a shared virtue (humility/collaboration).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, but immediately undercut the traditional "wise leader" trope. Address the elephant in the room (the ethics class).
      *   **The Pivot (The Philosophical Core):** Briefly explain the "moral testimony" problem without using jargon. "Why listen to me?" Acknowledge that grades $\neq$ wisdom.
      *   **Reframing the Role:** If I can't tell you *what* to think, what am I doing here? I'm not a guide; I'm a fellow traveler. The podium isn't a pulpit; it's a microphone for shared uncertainty.
      *   **The "Actionable" Advice (without being prescriptive):** Instead of "Do X," say "Ask yourself X." Focus on the *process* of moral reasoning rather than the *outcome*. Encourage the struggle.
      *   **Closing:** Bring it back to the community. We leave together. The applause isn't for my wisdom, but for our shared potential.

  4.  **Drafting - Tone Check:**
      *   *Too academic?* Need to ensure terms like "epistemology" or "deference" aren't overused. Keep it accessible.
      *   *Too self-deprecating?* Don't undermine confidence entirely. Confidence in *us*, not *me*.
      *   *Too preachy?* Avoid "You should." Use "We might."
      *   *Teacher Check:* The ethics teacher needs to see that the student *gets* the puzzle. The speech must explicitly reference the tension between factual and moral belief.

  5.  **Writing - Iteration 1 (Mental Outline):**
      *   Hi everyone. I'm the valedictorian.
      *   In ethics class, we learned you shouldn't just believe moral stuff because someone tells you.
      *   So why are you listening to me? I'm 18.
      *   I won't tell you how to live.
      *   Instead, I'll say: keep asking why.
      *   Good luck.

      *Critique 1:* Too blunt. Needs more poetry and emotional resonance. Needs to feel like a speech, not a confession.

  6.  **Writing - Iteration 2 (Adding Flesh & Blood):**
      *   Start with the feeling of the podium.
      *   Mention Mr./Ms. [Teacher's Name] in the front row.
      *   Explain the "Moral Testimony" idea simply. "Facts vs. Values."
      *   The shift: I'm not offering answers. I'm offering a question.
      *   The "Call to Action": Don't defer. Grapple.
      *   Ending: We are a community of questioners.

  7.  **Refining and Polishing (Focusing on the 5-minute mark):**
      *   Word count target: ~800 words.
      *   Rhythm: Short sentences for impact. Pauses for effect.
      *   Specific reference: Make sure the ethics teacher nods. "The puzzle of moral testimony."
      *   Emotional hook: The fear of getting it wrong. The beauty of trying.

  8.  **Final Review against Constraints:**
      *   *Takes problem seriously?* Yes, centers the speech on it.
      *   *Not a seminar?* Yes, uses the philosophy to drive emotional resonance, not abstract argument.
      *   *Moving?* Hopefully, by emphasizing shared vulnerability.
      *   *Valedictory?* Yes, celebrates the class and looks forward.

      *(Self-Correction during drafting)*: Make sure I don't accidentally give moral advice while saying "I won't give moral advice." Instead of saying "Be kind," say "Ask yourself what kindness costs."

  9.  **Final Polish:** Check the flow. Ensure the transition from the philosophical problem to the emotional conclusion is smooth. (The resulting speech below follows this structure.)

      *Word Count Check:* A 5-minute speech is roughly 750-850 words at a measured speaking pace. I will aim for that range.

      *Key Phrase Integration:* "Moral testimony," "reasons," "authority."

      *Audience Awareness:* Acknowledge the parents (who want inspiration) and the teacher (who wants rigor).

      *(Final thought)*: The speech should end on a note of solidarity. "We don't know, but we have each other."

      *Let's write.*
answer: |-
  Good morning. Faculty, family, friends, and the Class of 2024.

  Standing here, looking out at four hundred of you, I feel the weight of this moment. Traditionally, this is the part where the valedictorian offers wisdom. We are expected to distill four years of schooling into a set of instructions for the rest of your life. We are supposed to tell you how to be good, how to be successful, how to matter.

  But I need to make a confession. In our senior ethics elective, we spent a week discussing the puzzle of moral testimony. The idea is this: If a geologist tells you a rock is granite, it's rational to believe them. You defer to their expertise. But if a philosopher tells you that lying is wrong, it feels different. If you believe them just because they said so, without grasping the *reasons* why lying is wrong, you haven't really engaged with the morality of it. You've just followed an order. Moral worth, the readings suggested, requires understanding. It requires owning the reason for your action, not just the action itself.

  I bring this up because Mr. Henderson is sitting in the third row, and he would be disappointed if I ignored it. But I also bring it up because, looking at this podium, I realize: I am not an expert. I am eighteen. I have good grades, but I do not have a monopoly on wisdom. If I stand here and hand down moral conclusions—"Be kind," "Fight injustice," "Follow your dreams"—as if they are facts to be memorized, I am asking you to treat me like that geologist. But I'm not a geologist of the human soul. And if you accept my advice without wrestling with it, you aren't being moral agents. You're just following a script.

  So, I am not going to tell you how to live. I cannot give you my moral testimony, because you shouldn't want it.

  Instead, I want to offer you something else. I want to offer you the uncertainty.

  The scary truth is that when we leave this campus, there will be no answer key. There will be no syllabus for the hard choices. There will be moments when doing the right thing is expensive, or lonely, or dangerous. And in those moments, you will be tempted to look for an authority to save you the trouble of thinking. You will want to defer to a politician, a trend, a tradition, or a peer group because it is exhausting to derive the reasons yourself.

  My hope for us is not that we always get the answer right. My hope is that we refuse to outsource the question.

  The fact that I am standing here, unsure of what to tell you, is not a bug in this system. It's a feature. It means that the work belongs to all of us. If morality requires grasping the reasons, then the most important thing we can take from this school is not a set of values, but the stamina to examine them.

  So, when you face a choice, don't ask, "What would the valedictorian do?" Ask, "What is the reason for this?" When you feel righteous anger, ask, "Is this justified, or is it convenient?" When you feel pressured to conform, ask, "Do I believe this, or do I just want to belong?"

  This is harder than just following rules. It is infinitely harder. It means you will make mistakes. It means you will have to apologize, genuinely, without excuses. It means you will have to listen to people you disagree with, not to defeat them, but to see if they hold a piece of the reason you missed.

  But there is beauty in that struggle. It means that our goodness is actually *ours*. It means that when we do help a neighbor, or stand up for a stranger, or tell a difficult truth, we are doing it because we understand the value of it, not because we were told to. We become authors of our lives, not just characters in someone else's story.

  To the parents and families here: Thank you for trusting us with your children, and for trusting me with this microphone. We are not leaving here as finished products. We are leaving as questioners.

  To my classmates: I don't know what the right answer is for every problem you will face. I don't even know all the right answers for myself. But I know that I am not facing them alone, and neither are you. We are a community of people who have learned that the easy answer is usually the wrong one.

  So, let's not applaud because I told you what to do. Let's move forward because we are ready to figure it out. Let's go out there and do the hard work of understanding *why*. Let's earn our convictions.

  Thank you, and congratulations.
