answer: |-
  **MEMORANDUM**

  **TO:** Solar System Hall Exhibits Committee
  **FROM:** [Your Name], Exhibits Committee Volunteer
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Pluto Classification and Signage

  **1. Executive Summary**

  This memo recommends that the museum adopt the International Astronomical Union (IAU) 2006 classification of Pluto as a "Dwarf Planet" for all primary signage, accompanied by explicit contextual text explaining the definition's criteria and history. We should not treat the 2006 vote as an unquestionable scientific "truth" that overrides public understanding, nor should we treat it as a mere opinion equal to others. Instead, we should frame it as a necessary *coordination convention* for professional astronomy that the museum will teach, while acknowledging that public linguistic convention lags behind.

  This approach satisfies the Director's requirement for educational clarity, respects the IAU's technical framework, and addresses the philosophical objections regarding the nature of definitions and consensus.

  **2. The Nature of the Dispute**

  We are currently operating under the assumption that this is a fight about *facts*. It is not. We all agree on the facts: we know Pluto's size, orbit, and composition. The fight is about *definitions*, which makes this a philosophical problem as much as an astronomical one.

  Faction 1 argues that the IAU vote settled the matter. Faction 2 argues that a vote cannot simply overwrite established language. Both have merit, and understanding why requires looking at how definitions function.

  As noted in our informal discussions (influenced by David Lewis's *Convention*), scientific terms often function as social conventions. A convention is a solution to a coordination problem. For example, driving on the right side of the road isn't "truer" than the left; it is only useful because everyone agrees to do it. Before 2006, "planet" was a habit based on precedent (the nine bodies we grew up with). As we discovered more objects (Eris, Haumea, Makemake), the old convention became unwieldy. If we kept the old definition, we risked a solar system with 50+ "planets," making the term less useful for comparative science.

  The IAU vote was an attempt to establish a *new* coordination equilibrium. Faction 2 is correct that a vote alone does not instantly change how the public speaks. Linguistic conventions change slowly, through usage, not fiat. However, Faction 1 is correct that for the specific "game" of professional astronomy, the new convention is the one being played.

  **3. The Museum's Role**

  A science museum is not a dictionary recording current slang, nor is it a legislature imposing laws. We are educators. Our job is to explain *how* scientists categorize the world and *why* those categories change when new data arrives.

  If we simply say "Pluto is a Planet" to avoid anger, we teach bad science.
  If we simply say "Pluto is Not a Planet" without context, we validate the idea that definitions are divine commandments rather than human tools.
  If we say "Some say Planet, Some say Dwarf Planet" (Faction 3), we abdicate our educational mandate.

  **4. Recommendation**

  **A. Primary Signage**
  The main label for Pluto should read: **PLUTO: DWARF PLANET**.
  This aligns with the current working convention of the astronomical community. It provides the coordination necessary for visitors to understand modern literature and curriculum.

  **B. Explanatory Text (The "Why")**
  Beneath the classification, we must include a panel titled "How We Define Planets." This addresses Faction 2's concern by admitting the arbitrariness of the boundary. The text should explicitly state:

  > "For most of history, 'planet' was just a name for the wandering lights we knew. But as telescopes improved, we found hundreds of Pluto-like objects. In 2006, astronomers agreed on a new definition to keep the term useful. To be a 'Planet,' a body must:
  > 1. Orbit the Sun.
  > 2. Be round.
  > 3. Clear its neighborhood of other debris.
  >
  > Pluto passes the first two tests, but not the third. This doesn't change what Pluto *is*, only how we group it. Definitions are tools, and sometimes we need new tools for new discoveries."

  **C. Visual Context**
  Include a visual comparison of Pluto alongside Eris and Ceres. Show that Pluto is the largest of a *class* of objects. This validates Pluto's importance without granting it the "Planet" label.

  **5. Strategy for Public Feedback**

  We should anticipate another round of complaints. When visitors or letter-writers claim we are "denying facts," we should use the philosophical distinction to de-escalate.

  **Talking Points for Staff/Volunteers:**
  *   **Validate the Emotion:** "We know many people grew up learning Pluto was the ninth planet. It feels like a demotion."
  *   **Distinguish Object from Label:** "Pluto hasn't changed. It's still the same icy world. Only our label changed."
  *   **Explain the Coordination Problem:** "If we call Pluto a planet, we have to call Eris, Ceres, and potentially 50 other objects planets too. Astronomers decided the word 'planet' works better if we reserve it for the eight dominant bodies."
  *   **The Lewisian Angle:** "Think of it like a map. There are different ways to draw the lines. We are using the map that most astronomers use today so you can understand their work."

  **6. Conclusion**

  Faction 2 is right that the IAU cannot force the public to love the definition. But they are wrong to suggest that makes the definition invalid for a science museum. We are here to teach the current scientific convention, not the colloquial one. By explaining *why* the convention shifted (the coordination problem of too many planets), we turn a controversy into a lesson on the nature of science itself.

  We should proceed with the "Dwarf Planet" classification, but treat the definition as a teachable moment rather than a closed door.

  **Attachments:**
  *   Draft text for "How We Define Planets" panel.
  *   Comparative size chart for Kuiper Belt Objects.

  ***

  **Draft Text for "How We Define Planets" Panel**

  **WHAT MAKES A PLANET?**
  *Until 2006, there was no official rule. A planet was simply one of the nine bodies we knew. But as technology improved, astronomers discovered many more Pluto-sized objects in the outer solar system. To avoid a list of hundreds of "planets," the International Astronomical Union established three criteria:*

  1.  *It must orbit the Sun.*
  2.  *It must be massive enough to be round.*
  3.  *It must have cleared its orbit of other debris.*

  *Pluto meets the first two criteria, but shares its orbital neighborhood with many other icy bodies. Therefore, it is classified as a **Dwarf Planet**. This is not a statement on Pluto's importance, but a way to organize our solar system for study.*
