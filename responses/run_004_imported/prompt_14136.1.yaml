answer: |-
  Here is a sequence of 10 chained questions designed to progressively tighten the pressure on the "negative nature" move. They move from the taxonomy of cases, to causation, to epistemology, and finally to falsifiability.

  Each block includes the **Question**, a **Predicted Answer** (based on standard Disjunctivist lines like Martin/McDowell), and a **Follow-Up** specifically designed to counter the "it's purely epistemic/negative" dodge if she reaches for it again.

  ### Phase 1: The Taxonomy of Experience
  *Goal: Establish that her binary split is unstable before attacking the nature of the relata.*

  **Q1: The Status of Ordinary Illusion**
  "Disjunctivism is often presented as a clean two-way split: either I'm in a factive perceptual relation with the world, or I'm in a hallucination that merely seems like it. But where do ordinary illusions fit? Take the bent stick in water: there is a real object, but I'm aware of a property (bentness) that isn't there. Is this a third disjunct, or does it collapse into hallucination? Because if it's a third kind, the 'common factor' argument might just re-emerge between illusion and hallucination."

  *   **Predicted Answer:** She will likely argue that illusions are not hallucinations because there is still a real object present, so the fundamental metaphysical relation is different, even if the property representation is non-veridical.
  *   **Follow-Up (If she says 'It's still just a misleading appearance'):** "If the 'misleading appearance' in the illusion case is subjectively indistinguishable from the 'misleading appearance' in the hallucination case, aren't you positing a common phenomenal kind there? If you deny that, are you saying the illusion has a positive nature but the hallucination doesn't?"

  **Q2: The Argument from Illusion**
  "Let's press on that bent stick. The classic Argument from Illusion says: 'Since the stick isn't bent, but you experience bentness, you must be aware of an intermediate sense-datum that *is* bent.' You reject this. But specifically *why* does that inference fail for you? Is it because 'looking bent' doesn't entail 'being aware of bentness,' or because the experience itself has no object at all in that moment?"

  *   **Predicted Answer:** She will argue that 'looking bent' is not a report on an internal object, but a claim about the indistinguishability of the current experience from a veridical one.
  *   **Follow-Up (If she invokes indistinguishability):** "So the phenomenal character is exhausted by its potential to be confused with a veridical case? That seems to make the hallucination parasitic on the veridical case for its very definition. If we found a hallucination that *couldn't* be confused with reality (a bizarre dream), would it cease to be a mental state on your view?"

  ### Phase 2: Causation and Neuroscience
  *Goal: Leverage your Cog Sci background to challenge the metaphysical split with physical continuity.*

  **Q3: Phenomenal Character without Objects**
  "Following up on that: If the hallucination has no positive nature and no object, what constitutes the 'what-it's-like' of the experience? If I'm hallucinating a red tomato, there is a subjective redness. If that redness isn't a property of a tomato, and it isn't a property of a sense-datum, is it a property of *me*? Or is it a property of nothing?"

  *   **Predicted Answer:** She will likely say it's not a property of anything in the ontological sense; it's merely that the subject cannot tell they aren't seeing red.
  *   **Follow-Up (If she says 'It's purely epistemic'):** "But epistemic states usually supervene on positive ontological states. If my brain is doing something specific to generate that 'cannot tell' condition, isn't *that* brain state the positive nature of the hallucination? Why isn't the mental state identical to that functional state?"

  **Q4: Causal Screening Off**
  "This leads to the causal worry. In both the veridical and hallucinatory case, there is a proximate cause in the visual cortex that triggers downstream behavior (like reaching for the tomato). If that proximate neural cause is sufficient to produce the behavior and the report, doesn't the distal object (the actual tomato) get screened off? Why does the tomato need to be part of the *constitution* of the experience rather than just the *cause* of it?"

  *   **Predicted Answer:** She will argue that in the veridical case, the neural state is not sufficient; the relation to the object is constitutive. The neural state is merely an enabling condition.
  *   **Follow-Up (If she distinguishes constitution vs. causation):** "But if the neural state is identical in both cases, and the mental state is *different* in kind (as you claim), you're positing a metaphysical difference without a physical difference. Are you comfortable with a dualism where mental kinds diverge while physical kinds converge?"

  **Q5: Cortical Stimulation & Charles Bonnet**
  "Let's make that concrete. In Charles Bonnet syndrome or direct cortical stimulation, we can induce subjectively perfect visual experiences without retinal input. You'd call this a hallucination with no positive nature. But from a vision science perspective, we can map the retinotopic activity. If I can predict what you see based on V1 activity, isn't that activity the positive nature of the experience? To deny that seems to ignore the mechanism generating the 'indistinguishability.'"

  *   **Predicted Answer:** She will concede the neural activity exists but deny it *is* the experience. She'll say the neural activity realizes the state, but the *nature* of the state depends on the external relation.
  *   **Follow-Up (If she separates realization from nature):** "If the realization is identical but the nature is different, then the nature is doing no causal work. If the nature of the hallucination is 'negative,' what explains the specific content? Why do I see a tomato and not a chair if the nature is just 'not seeing a tomato'?"

  ### Phase 3: Epistemology and Self-Knowledge
  *Goal: Trap her on the consequences of not being able to tell the difference.*

  **Q6: Higher-Order Self-Knowledge**
  "You've argued that I can't introspectively tell which disjunct I'm in. But if I claim to have knowledge of the world ('There is a tomato'), I'm claiming factive warrant. If my internal perspective is identical in the hallucination case where I lack that warrant, how do I know I have it now? If I can't distinguish having warrant from merely seeming to have warrant, isn't my epistemic position effectively the same in both cases?"

  *   **Predicted Answer:** She will likely use the 'externalist' move: You don't need to know you know to have knowledge. The warrant is provided by the world, not your access to it.
  *   **Follow-Up (If she appeals to externalism):** "But for the subject *deliberating* on whether to trust their eyes, the advice is the same in both cases: 'It seems real.' If the first-person perspective can't access the difference, doesn't that make the disjunctive split irrelevant to the phenomenology of reasoning?"

  **Q7: The "Negative Nature" Dodge**
  "I want to pin down a phrase you've used a few times: that hallucinations have 'no positive nature.' Does this mean they are literally mental nothings? Or does it mean they are a positive mental state that you simply refuse to categorize as 'perception'? Because if it's a mental state that causes belief and action, it seems to have causal powers. How can something with no positive nature have causal powers?"

  *   **Predicted Answer:** She will clarify that it's not a 'nothing,' but it's not a natural kind instance of perception. It's a 'bad case' that mimics the 'good case.'
  *   **Follow-Up (If she reiterates 'It's not a kind of perception'):** "Okay, but it *is* a kind of *experience*. If I have two experiences that are intrinsically identical but you tell me one is a relation to the world and one is a 'nothing,' aren't you asking me to accept a brute metaphysical coincidence?"

  ### Phase 4: Utility and Falsifiability
  *Goal: Close the net on the scientific and philosophical utility of the view.*

  **Q8: Explanatory Power**
  "Let's step back. The Common Factor view explains the overlap between illusion and perception by positing a shared mental state. Your view explains it by positing... what? A capacity for confusion? What explanatory work is Disjunctivism doing here that the Common Factor view isn't, other than preserving a specific definition of 'direct perception'?"

  *   **Predicted Answer:** She will argue it preserves the intuition that in the good case, the world is literally present to the mind, which Common Factor severs.
  *   **Follow-Up (If she says 'It saves realism'):** "But does it save realism at the cost of making hallucinations inexplicable? If your theory explains the good case by making the bad case a metaphysical mystery, have we actually gained understanding?"

  **Q9: Cognitive Science Integration**
  "As a cognitive scientist, I look for isomorphisms between mental states and neural states. Your view suggests that two identical neural states could constitute two fundamentally different mental kinds (one relational, one not). Is there *any* finding in neuroscience that would force you to abandon Disjunctivism? Or is the view insulated from empirical data by definition?"

  *   **Predicted Answer:** She might say that neuroscience deals with enabling conditions, not the metaphysical nature of the content, so it can't settle the issue.
  *   **Follow-Up (If she insulates from empirics):** "If neuroscience can't settle it, and introspection can't settle it (since they are indistinguishable), what *does* settle it? Are we left with a purely verbal dispute about the word 'perception'?"

  **Q10: Falsifiability**
  "That's my final question: What would count as evidence against Disjunctivism? If we found a 'neural code' for redness that fired identically in veridical and hallucinatory cases, and manipulating it manipulated the experience directly, would that convince you that the common factor is the mental state? Or would you still say the *nature* differs despite the identical mechanism?"

  *   **Predicted Answer:** She might concede that if the neural state *constituted* the experience (not just enabled it), Disjunctivism would fail.
  *   **Follow-Up (The Closer):** "Given that most working vision scientists assume the neural state *does* constitute the experience, does that mean Disjunctivism is already incompatible with the standard model of the mind? And if so, is the cost of saving 'Naive Realism' simply abandoning a scientific worldview?"
