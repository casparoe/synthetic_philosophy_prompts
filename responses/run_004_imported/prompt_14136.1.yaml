prompt: |-
  So I'm doing my PhD in cognitive science (vision/perception side of things), and a couple friends from the philosophy department and I run this small podcast where we get people on to argue with us about philosophy of mind. Next up is a philosopher of perception with a new book defending disjunctivism -- the naive realist idea that a veridical perception and its subjectively-matching hallucination aren't two instances of one common underlying kind of mental state, contra what she calls the "common factor" theorists. In our prep call, every time we pushed her on what a hallucination even IS if it's not just a degraded perceiving, she fell back on the same move: hallucinations have no positive nature to describe at all, their character is purely negative/epistemic, it just consists in the subject being unable to tell from the inside that they're not perceiving. She used that line like four separate times to dodge four different questions, so for the actual episode I want to build a sequence that makes it progressively harder for her to reach for it.

  Can you write me 8-10 interview questions, ideally chained so each builds off the last rather than each just re-inviting her to restate the thesis? I want at least one question that goes back to the classic argument from illusion itself (bent stick, after-images, etc) and asks why that argument's move from "the apparent property isn't really there" to "so you're aware of some sense-datum that has it" fails for her specifically; one on the causal/hallucination worry -- if direct cortical stimulation (or Charles Bonnet-type cases) can produce something subjectively just like seeing a real tomato, doesn't a shared proximate cause screen off the tomato itself as doing any explanatory work; one on higher-order self-knowledge -- if she can't introspectively tell which disjunct she's currently in, how does she know she has the factive warrant right now rather than merely seeming to; and one on where ordinary illusions (as opposed to full-on hallucinations) fit into what's supposed to be a clean two-way split. For each, throw in a quick line on what she'll probably say back and a follow-up incase she just repeats the negative-epistemic move again. Close it out with a question on what kind of finding -- empirical, phenomenological, whatever -- would actually count as evidence against disjunctivism, cause the way she talks about it, it's starting to sound unfalsifiable to me.
