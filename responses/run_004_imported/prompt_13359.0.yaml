answer: |-
  This is a genuinely profound observation, and you've hit on a tension that rarely gets discussed outside of very niche circles in the history of analytic philosophy. You are absolutely right: Frank Ramsey is the patron saint of two seemingly contradictory intuitions.

  On one hand, you have **Ramsey the Formalist**, whose 1926 paper *Truth and Probability* gave us the representation theorem that links rational belief to betting odds. This is the bedrock of Expected Utility Theory (EUT). Longtermism (and Effective Altruism) leans heavily on this: if you have a non-zero probability of affecting an astronomically large number of future lives, the Expected Value (EV) dominates any present-day concern.

  On the other hand, you have **Ramsey the Humanist**, who wrote in his philosophical fragments (often cited from his unpublished papers around 1929–1930) that line about the stars being "no bigger than threepenny bits." His argument was that the universe has no value in itself; value is a projection of human minds. Without a mind to perceive it, the vastness of the cosmos is morally zero.

  If we force these two Ramseys into a room to debate Longtermism, here is my best-guess reasoning on where he would land.

  ### 1. The Axiological Clash: Aggregation vs. Perspective
  Longtermism relies on **impersonal aggregation**. It assumes value is a substance that can be summed across time and space. If Future Person A is happy, that adds +1 to the universal score, regardless of whether I know them.

  Ramsey's "threepenny bits" argument is a rejection of impersonal aggregation. It is a claim that **value is perspectival**. For Ramsey, "good" isn't a property of the universe waiting to be measured; it is a relation between a state of affairs and a valuer.

  If Ramsey were to critique Longtermism, he wouldn't attack the math; he would attack the **ontology of value**. He would likely argue that Longtermists are making a category error by treating "potential future people" as having the same axiological weight as actual, conscious present people. To Ramsey, a star (or a potential digital mind in a simulation a million years from now) has no moral mass until it is actualized in a context of human-scale experience. He would likely view the "astronomical waste" argument as a fetishization of magnitude over meaning.

  ### 2. The Pragmatist Constraint on Probability
  Ramsey was a pragmatist (heavily influenced by Peirce and James). For him, a probability wasn't just a number; it was a **degree of belief manifested in action**.

  In *Truth and Probability*, Ramsey argues that your beliefs are defined by the bets you are willing to take. This creates a problem for Longtermism. Longtermist interventions often rely on tiny probabilities ($P$) multiplied by huge values ($V$).
  *   **Longtermist:** $P = 0.0000001$, $V = 10^{50}$ lives. $EV$ is huge.
  *   **Ramsey:** Can you *really* hold a belief with that precision? Is there a coherent behavioral cash-out for that bet?

  Ramsey was skeptical of "unknown probabilities" (what Keynes called uncertainty). He might argue that when we talk about the far future (millions of years, digital minds, alignment scenarios), we aren't dealing with risk (measurable probability) but with **radical uncertainty**. In his framework, applying EUT to radical uncertainty is mathematically valid but pragmatically meaningless. You can't form a coherent "degree of belief" about the moral topology of the 30th century. Therefore, the EV calculation collapses because the $P$ is not operationally definable.

  ### 3. The "Human Scale" Discount Rate
  The "threepenny bits" quote suggests a **psychological and moral discount rate** based on proximity and relation.

  Ramsey wrote: *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  This isn't just poetry; it's a claim about moral attention. Longtermism argues for **temporal impartiality** (a life in 2100 counts the same as a life in 2024). Ramsey's humanism suggests that moral obligation attenuates with distance—not because the future people matter less *in themselves*, but because **our capacity to value them is limited by our humanity.**

  If we stretch our moral concern so thin that it covers a million years, Ramsey might argue we lose the intensity required to actually care. He would likely argue that "meaning" requires a certain density of connection. A Longtermist policy that sacrifices present welfare for a speculative future might strike him as a violation of the very human scale that generates value in the first place.

  ### 4. The Verdict: A "Humanist Critic"
  So, would he be a Longtermist? **Almost certainly not.**

  While he invented the math they use, he would likely view their application of it as a form of **rationalist delusion**. He would see Longtermism as an attempt to escape the human condition by pretending we can occupy a "view from nowhere."

  *   **On the Math:** He would say, "Yes, the equation holds, but your inputs are garbage. You cannot assign coherent utilities to beings that do not exist and whose nature you cannot conceive."
  *   **On the Ethics:** He would say, "You are worshipping the size of the universe rather than the content of it. If the future is vast but devoid of the specific kind of love and consciousness we value now, its size is irrelevant."

  However, he wouldn't be a *dismissivist*. Ramsey was a socialist and a reformer who cared deeply about optimal taxation and economic welfare. He believed in improving the future. But he would advocate for a **robust near-termism**: building institutions, reducing suffering, and fostering knowledge *now*, because that is the only scale at which "value" is ontologically secure.

  ### The Irony
  The great irony, which you spotted, is that Ramsey's decision theory is the engine Longtermists use to justify ignoring Ramsey's humanism. They use his tools to build a skyscraper he would have found spiritually empty.

  If Ramsey had lived past 26, he likely would have moved further toward Wittgenstein (his close friend) and away from pure formalism. He might have concluded that the "problem" of the long-term future is not a calculation to be solved, but a confusion of language to be dissolved. He would likely tell the Longtermists: **"You are trying to calculate the value of the stars. But value is only found in the threepenny bits."**

  It's a tragic "what if" of intellectual history. We have the math of the god-like calculator, but the soul of the humanist poet. Longtermism took the math and left the soul behind.
