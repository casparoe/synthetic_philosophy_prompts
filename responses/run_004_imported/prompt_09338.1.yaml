answer: |-
  You have stumbled onto one of the most famous problems in the philosophy of language. Seriously, this isn't just you—this specific pair of sentences is the "Hello World" of conditional logic. It's often called **Adams' Problem** (after the philosopher Ernest Adams), and it drove David Lewis (a giant in metaphysics) a little bit crazy trying to solve it.

  You're right that saying "they are just different types of conditionals" is a cop-out. You want to know *why* the machinery under the hood works differently.

  Here is the account of why the mood flip changes the truth value, and what it implies about truth conditions.

  ### 1. What Gets "Held Fixed"?
  The core difference isn't just grammar; it's about **which facts of reality you are allowed to keep** when you imagine the "If" scenario.

  **The Indicative:** *"If Oswald didn't kill Kennedy, someone else did."*
  *   **The Setup:** When you process this, your brain treats the *actual outcome* as a fixed fact. We know for a fact Kennedy is dead.
  *   **The Logic:** You are making an **epistemic** inference (based on knowledge). You are saying: "Given everything I know (JFK is dead), if I remove Oswald from the list of suspects, who is left?"
  *   **The Result:** Since the death is held fixed as true, the only logical variable left is the shooter. If not Oswald, then logically, it must be Someone Else.
  *   **Why it feels true:** It preserves the known reality (JFK died).

  **The Counterfactual:** *"If Oswald hadn't killed Kennedy, someone else would have."*
  *   **The Setup:** When you process this, your brain treats the *causal history* as fixed up to the moment of the shot, but it **does not** hold the outcome fixed.
  *   **The Logic:** You are making a **metaphysical** claim about causality. You are asking: "If we rewind time to Dallas 1963 and Oswald decides not to shoot (or misses), how does the future play out?"
  *   **The Result:** In this scenario, the death is *not* guaranteed. Maybe the Secret Service catches the next guy. Maybe JFK finishes his term. To say this sentence is true, you have to believe in a "conspiracy of inevitability"—that the universe was determined to kill JFK no matter what.
  *   **Why it feels false:** Most of us don't believe history is that rigid. We believe Oswald had agency, and if he stopped, the death might not have happened.

  **The Short Version:**
  *   **Indicative:** Holds the **outcome** fixed (JFK is dead).
  *   **Counterfactual:** Holds the **causal setup** fixed (Oswald has a rifle), but lets the outcome vary.

  ### 2. The Possible Worlds Explanation
  Philosophers use "Possible Worlds" to map this out.

  *   **For the Indicative:** You look for the closest possible worlds where Oswald didn't kill Kennedy **that are still compatible with what we know**. Since we know JFK died, we only look at worlds where JFK died. In those worlds, someone else killed him. -> **True.**
  *   **For the Counterfactual:** You look for the closest possible worlds where Oswald didn't kill Kennedy **that are most similar in terms of laws of nature and past history**. You don't force JFK to die in these worlds. You let the chips fall. In most of those worlds, JFK probably lives. -> **False.**

  ### 3. Your Question on Truth Conditions
  You asked: *"Since whether the first one's true depends on stuff we dont even fully know... does that mean indicative conditionals dont have fixed truth conditions?"*

  **Bingo.** This is exactly the conclusion Ernest Adams drew from this puzzle.

  In classical logic, a statement is either True or False (it has a "truth condition"). But Adams argued that indicative conditionals (like the first sentence) **do not have truth conditions at all.**

  Instead, he argued they have **assertability conditions**.
  *   You don't believe the first sentence because it corresponds to a fact in the world.
  *   You believe it because your **conditional probability** is high. (i.e., The probability that "Someone else did" *given* that "Oswald didn't" is high, because the probability of "JFK died" is 100%).

  **The Counter-Argument (Grice & Jackson):**
  Other philosophers (like Paul Grice) argued that indicatives *do* have truth conditions (they function like the material conditional in logic), but we are misled by **pragmatics**.
  *   They say the sentence *is* technically true, but it feels weird because it implies we *know* someone else did it, which we don't.
  *   However, this struggles to explain why the counterfactual feels so strongly *false*.

  **The Modern Consensus (More or Less):**
  Most contemporary philosophers of language lean toward your intuition: Indicatives are sensitive to our **state of knowledge** (epistemic), whereas counterfactuals are sensitive to **states of the world** (ontic).

  Because indicatives depend on what we *know*, their "truth" can shift as our knowledge shifts.
  *   *Example:* If we discover tomorrow that JFK actually died of a heart attack 5 minutes before Oswald shot, the indicative ("If Oswald didn't kill him, someone else did") suddenly becomes **False**.
  *   The counterfactual ("If Oswald hadn't killed him...") wouldn't change much, because it's about the causal power of Oswald's bullet, not the medical report.

  ### Summary
  The mood change matters because it switches the **domain of evaluation**.
  1.  **Indicative** = "Given what we know about the actual world..." (JFK is dead, so someone did it).
  2.  **Counterfactual** = "Given how causality works in the world..." (If Oswald stops, does the bullet still fly?).

  And yes, your suspicion is spot on: This puzzle is the primary evidence used by philosophers who argue that indicative conditionals don't describe facts (truth conditions) but rather describe our degrees of belief (probabilities). You've basically reinvented a chunk of 20th-century philosophy of language in a week of rumination.
