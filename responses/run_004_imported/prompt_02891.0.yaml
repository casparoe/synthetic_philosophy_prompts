prompt: |-
  I'm writing my IB Extended Essay on early modern theories of meaning, and I've hit a passage in Locke's *Essay Concerning Human Understanding* (Book III, Chapter VI, "Of the Names of Substances," sections 6–7) that seems to contradict itself — though it's possible I'm just tripping over the seventeenth-century syntax. Here it is in full:

  "6. Even the real essences of individual substances imply potential sorts. It is true, I have often mentioned a real essence, distinct in substances from those abstract ideas of them, which I call their nominal essence. By this real essence I mean, that real constitution of anything, which is the foundation of all those properties that are combined in, and are constantly found to co-exist with the nominal essence; that particular constitution which everything has within itself, without any relation to anything without it. But essence, even in this sense, relates to a sort, and supposes a species. For, being that real constitution on which the properties depend, it necessarily supposes a sort of things, properties belonging only to species, and not to individuals: v.g. supposing the nominal essence of gold to be a body of such a peculiar colour and weight, with malleability and fusibility, the real essence is that constitution of the parts of matter on which these qualities and their union depend; and is also the foundation of its solubility in aqua regia and other properties, accompanying that complex idea. Here are essences and properties, but all upon supposition of a sort or general abstract idea, which is considered as immutable; but there is no individual parcel of matter to which any of these qualities are so annexed as to be essential to it or inseparable from it. That which is essential belongs to it as a condition whereby it is of this or that sort: but take away the consideration of its being ranked under the name of some abstract idea, and then there is nothing necessary to it, nothing inseparable from it. Indeed, as to the real essences of substances, we only suppose their being, without precisely knowing what they are; but that which annexes them still to the species is the nominal essence, of which they are the supposed foundation and cause.

  7. The nominal essence bounds the species for us. The next thing to be considered is, by which of those essences it is that substances are determined into sorts or species; and that, it is evident, is by the nominal essence. For it is that alone that the name, which is the mark of the sort, signifies. It is impossible, therefore, that anything should determine the sorts of things, which we rank under general names, but that idea which that name is designed as a mark for; which is that, as has been shown, which we call nominal essence. Why do we say this is a horse, and that a mule; this is an animal, that an herb? How comes any particular thing to be of this or that sort, but because it has that nominal essence; or, which is all one, agrees to that abstract idea, that name is annexed to?"

  What I can't work out is how these two sections fit together. Section 6 treats the real essence — the hidden "constitution of the parts of matter" — as the "foundation and cause" of the very qualities that make something count as gold, which makes it sound like hidden structure is doing serious work in fixing what gold is. But section 7 then seems to take that job away from it entirely, insisting it is "impossible... that anything should determine the sorts of things... but that idea," i.e., the nominal essence alone. Taken literally, section 7 seems to imply that two lumps of matter with totally different hidden compositions would still count as the same species, so long as both matched our abstract idea of gold.

  I've read that this is close to the question Putnam's Twin Earth thought experiment was aimed at, and that his answer was that meanings "just ain't in the head." Does section 7 really commit Locke to the view Putnam was arguing against, or is there a more charitable way to read the two sections together, given how much weight section 6 puts on the real essence? I'd appreciate a close walk-through of the argument itself rather than just a general gloss on Locke or on Twin Earth.
