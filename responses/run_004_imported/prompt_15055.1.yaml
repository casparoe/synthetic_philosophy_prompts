      *   **Core Dispute:** The "Targetless HOT" problem (misrepresentation cases where a HOT exists without a corresponding Lower-Order State).
      *   **Characters:**
          *   *Proponent of Rosenthal's HOT Theory (HOTter):* Defends the "separate state" view and bites the bullet on targetless HOTs (illusion of experience).
          *   *Proponent of Self-Representationalism (S-Rep):* Defends the "single complex state" view (Kriegel-style) and argues this blocks targetless cases.
      *   **Requirements:**
