          *   HOTter must defend Rosenthal's position robustly (not cave immediately).
          *   S-Rep must explain *why* fusion helps (not just assert it).
          *   HOTter must push back on whether fusion actually solves the problem or just relocates it.
          *   No strawmen; genuine engagement.
          *   Context: IB Extended Essay research (needs clarity, depth, but accessible enough for a smart high schooler/undergrad level).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Rosenthal's HOT:** Consciousness is relational. $M$ is conscious iff there is a HOT about $M$. HOT and $M$ are distinct existences.
          *   *Targetless HOT:* If HOT exists but $M$ does not, the subject *seems* to have an experience, but doesn't really. It's an introspective illusion.
          *   *Defense:* Introspection is fallible. What matters is "what it's like" for the subject. If it seems like red, it's like red for them, even if the mechanism is glitching.
      *   **Kriegel's Self-Representationalism (S-Rep):** Consciousness is intrinsic (or quasi-intrinsic). The mental state $M^*$ represents the world *and* represents itself. One state, two contents.
          *   *Targetless Solution:* You can't have the self-representing content without the state existing, because the state *is* the vehicle. If the state exists, the lower-order content exists (usually). It prevents the "detachment" of the awareness from the experience.
          *   *Vulnerability:* Can't you still have a malfunctioning complex state? (The HOTter's counter-attack).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Two philosophers, maybe at a conference or a quiet office. Let's call them *Alex* (HOT/Rosenthal) and *Jordan* (S-Rep/Kriegel).
      *   **Opening Salvo:** Alex states the HOT view clearly. Jordan raises the Targetless HOT objection immediately.
      *   **Alex's Defense (The Bullet Bite):** Alex needs to explain *why* Rosenthal accepts this. Key point: Phenomenology trumps metaphysics. If it *seems* like I see red, then for the purpose of consciousness, I do. The distinction between "real experience" and "seeming experience" collapses from the first-person perspective.
      *   **Jordan's Counter (The Fusion Strategy):** Jordan introduces S-Rep. The key is *ontological unity*. If the awareness is part of the experience, they stand or fall together. You can't have the shadow without the object.
      *   **Alex's Pushback (The Relocation Charge):** This is crucial. Alex needs to argue that S-Rep just hides the problem. Can't the *complex state* misrepresent its own existence? If the brain creates a complex state that says "I am occurring" but doesn't actually process red, haven't we just moved the targetless issue inside the black box?
      *   **Jordan's Rebuttal (Constitutive vs. Contingent):** Jordan needs to distinguish between *causal* connection (Rosenthal) and *constitutive* connection (S-Rep). In S-Rep, the self-awareness isn't a separate tracker; it's a structural feature of the state. Misrepresentation requires a gap between vehicle and content. In S-Rep, the vehicle *includes* the self-content.
      *   **Alex's Final Challenge (The Empty Complex State):** Alex presses: What if the whole complex state is hallucinated?
      *   **Jordan's Concession/Nuance:** Jordan admits *total* hallucination is possible but argues it's a different category (non-mental event vs. mental event). The specific *targetless HOT* problem (awareness without experience) is blocked because awareness implies experience in this model.
      *   **Conclusion:** Summarize the stalemate/agreement on what's at stake. Leave the user (IB student) with the core conceptual tension.

  4.  **Refining the Arguments (Self-Correction during drafting):**
