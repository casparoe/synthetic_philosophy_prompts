answer: |-
  First off, welcome to the club. Your intuition is actually the *correct* starting point for a Lewisian counterfactual theorist. In fact, if you look at Lewis's 1973 and 1986 papers, he basically agrees with you: counterfactual dependence is sufficient for causation, omissions exhibit counterfactual dependence, therefore omissions are causes. Full stop.

  So, you aren't missing the basic logic. The reason your advisor gave you that cryptic "profligacy" warning is that while the counterfactual theory *can* accommodate omissions without modification, doing so comes at a massive theoretical cost that threatens to make the concept of causation useless for metaphysics.

  Here is the substantive problem you're missing, broken down into why the "easy solution" breaks everything else.

  ### 1. The Profligacy Objection (Your Advisor's Hint)
  Your analysis works perfectly for the gardener. But the counterfactual theory is universal. If $c$ causes $e$ whenever $e$ counterfactually depends on $c$, you cannot restrict this to *just* the gardener without adding extra machinery.

  Consider the dead plant again.
  *   Counterfactual 1: If the **gardener** had watered it, it would have lived.
  *   Counterfactual 2: If **I** (the PhD student down the hall) had watered it, it would have lived.
  *   Counterfactual 3: If the **Queen of England** had watered it, it would have lived.
  *   Counterfactual 4: If **rain** had fallen, it would have lived.

  On a pure counterfactual account, the Queen of England caused the plant's death by omission just as much as the gardener did. Her failure to water it is a necessary condition for the death in the actual world.

  This is the **Profligacy of Causes**. If we accept omissions as causes on par with positive events, causation becomes ubiquitous. Almost every event has thousands of "causes" consisting of everyone and everything that *didn't* prevent it. This violates the strong intuition that causation is a **selective** relation. We want to say the gardener caused the death, but the Queen merely *allowed* it (or had nothing to do with it).

  To save the theory, you have to explain why the gardener's omission counts but the Queen's doesn't. But the counterfactual structure is identical for both. So, you need **extra apparatus**.

  ### 2. The Ontological Cost (Beebee & Lewis)
  This leads to the "Void and Object" problem. If omissions are causes, what are the *relata* of the causal relation?
  *   In positive causation (Suzy throws rock), the relata are events (spacetime regions with properties).
  *   In omission causation (Gardener doesn't water), what is the event? It's a "nothing."

  If you say absences are legitimate relata, your ontology becomes incredibly weird. You are committed to the existence of "absences" as entities that enter into causal relations. Helen Beebee ("Causing and Nothingness") argues that if you take this seriously, you end up with a world where "nothingnesses" are doing causal work.

  Lewis tried to handle this by treating absences as spatiotemporal regions that lack certain properties, but he admitted this was awkward. Later, he moved toward a **contextualist** solution (in "Causation as Influence"). He argued that all these counterfactual dependencies exist, but we only *select* the gardener as "the cause" due to conversational context and salience.

  But this moves the problem from metaphysics to pragmatics. Are we doing metaphysics of causation, or linguistics of causal *talk*? Many metaphysicians find this unsatisfying.

  ### 3. Normativity vs. Metaphysics
  To solve the profligacy problem (i.e., to rule out the Queen), philosophers like Beebee and McGrath introduce **norms**.
  *   The gardener had a *duty* to water the plant.
  *   The Queen did not.
  *   Therefore, only the gardener's omission is a cause.

  This solves profligacy, but it creates a new problem: **It makes causation partly normative.** It implies that whether a causal relation holds depends on social expectations, contracts, or moral duties. Most metaphysicians want causation to be a natural relation, independent of human norms. If causation depends on whether the gardener was *hired*, then causation isn't "in the world" in the way we thought it was.

  ### 4. Why "Quasi-Causation"? (Dowe's Angle)
  You mentioned Dowe. Dowe is a process theorist (conserved quantity theory). For him, the problem is harder.
  *   Positive causation: Transfer of energy/momentum.
  *   Omission: No transfer of energy/momentum.

  So Dowe says omissions aren't *real* causation; they are "quasi-causation." They look like causation in our talk and support counterfactuals, but they lack the physical "oomph."

  Counterfactual theorists (like Lewis) don't need "quasi-causation" to distinguish the *mechanism*, but they often end up needing it (or something like it) to distinguish the **metaphysical status**. Lewis eventually suggested that while omissions satisfy the definition of causation, they are "extrinsic" and less paradigmatic than positive causation. This is a way of keeping the theory intact while acknowledging that omissions feel different.

  ### Summary: Why it's not just fussiness
  You asked if philosophers are just being fussy. The answer is: **They are trying to prevent the explosion of causal claims.**

  1.  **If you stick to your view** (Pure Counterfactualism): You save simplicity, but you admit the Queen of England caused the plant's death. Causation becomes trivial and ubiquitous.
  2.  **If you modify the view** (Norms/Context): You save intuition (only the gardener caused it), but you make causation dependent on pragmatics or norms, which threatens its status as a fundamental metaphysical relation.
  3.  **If you bifurcate** (Quasi-causation): You save the distinction between positive/negative, but you complicate the theory by having two types of "causation."

  The literature exists because there is no free lunch. You can have omissions as causes, but you have to pay for it with profligacy, weird ontology, or normativity.

  ### Reading to fix your brain (and get back to work)
  Since you're TAing this, you need to be able to explain why the student's question is deep, not just "answered."
  *   **Lewis, D. (2000). "Causation as Influence."** (See where he struggles with the "abundant" vs. "sparse" causes).
  *   **Beebee, H. (2004). "Causing and Nothingness."** (The definitive case for why omissions break standard ontologies).
  *   **McGrath, S. (2005). "Causation by Omission: A Dilemma."** (Lays out the Profligacy vs. Normativity dilemma explicitly).

  Your advisor was right, but they were also being a bit cruel. The profligacy literature is where the fun starts. Once you realize that accepting the student's intuition implies the Queen is a murderer, the "puzzle" becomes much more vivid.

  Now go grade those papers.
