answer: |-
  You have spotted a genuine and profound tension. You are not tripping over the prose; you are tripping over a fundamental schism in the philosophy of language that has widened significantly since 1923.

  The short answer is: **Russell is defending a third position.** He is neither an epistemicist nor a supervaluationist. In fact, both of those modern camps arose largely to *solve* the problems created by views like Russell's while trying to save classical logic.

  Russell is effectively a **proto-degree theorist** (or a truth-value gap theorist) who is willing to sacrifice the Law of Excluded Middle (LEM) to preserve the phenomenological reality of vagueness.

  Here is the unpacking of why Russell clashes with the modern camps, what position he actually holds, and how it relates to your fraud-scoring problem.

  ### 1. Russell's Claim: LEM Fails
  In the passage you quoted, Russell makes a radical claim:
  > *"The law of excluded middle is true when precise symbols are employed, but it is not true when symbols are vague."*

  For a borderline case (the man with the intermediate hair count), Russell is saying:
  1.  "He is bald" is not true.
  2.  "He is not bald" is not true.
  3.  Therefore, "He is bald OR he is not bald" is **not true**.

  This is a direct rejection of classical logic for natural language. Russell believes vagueness is an essential feature of representation (language/thought). Because *all* empirical symbols are vague, classical logic (which relies on precision) does not strictly apply to the empirical world.

  ### 2. Why He Isn't an Epistemicist
  **Epistemicism (e.g., Timothy Williamson):**
  *   **The View:** There *is* a precise cutoff (say, 5,432 hairs). If you have 5,433, you are bald; if you have 5,432, you are not.
  *   **LEM:** Holds ($P \lor \neg P$ is always True).
  *   **Vagueness:** Is purely a matter of human ignorance. We can't know where the line is, but the line exists.
  *   **Vs. Russell:** Russell explicitly calls the idea of a specific hair converting the man "absurd." For Russell, the indeterminacy is in the *world-as-represented*, not just in our knowledge. Epistemicism saves classical logic by positing hidden precision; Russell sacrifices classical logic to deny hidden precision. They are diametrically opposed.

  ### 3. Why He Isn't a Supervaluationist
  **Supervaluationism (e.g., Kit Fine):**
  *   **The View:** "Bald" is semantically indecisive. We can make it precise in many admissible ways (precisifications).
  *   **LEM:** Holds (sort of). "He is bald OR he is not bald" is **super-true** (true on all precisifications).
  *   **Bivalence:** Fails. "He is bald" is neither true nor false (it's indefinite).
  *   **Vs. Russell:** This is the trickiest comparison because both Russell and Supervaluationists deny bivalence (they agree the individual statement "He is bald" is neither true nor false).
      *    However, Supervaluationism is a **logic-saving project**. It uses a technical definition of truth ("super-truth") specifically to ensure that $P \lor \neg P$ still comes out True.
      *   Russell is not interested in saving the logic. When he says LEM is "not true," he means it in the ordinary sense. He is willing to let the tautology fail in borderline cases. Supervaluationism says, "We can keep the tautology if we change how we define truth." Russell says, "The tautology fails because language is vague."

  ### 4. Russell's Actual Camp: Degree Theory / Fuzzy Logic
  If Russell isn't with the two big modern camps, where is he? He is the grandfather of **Degree Theory** (often associated with Fuzzy Logic).

  *   **The View:** Truth is not binary (1 or 0); it is a matter of degree (0 to 1).
  *   **LEM:** Fails. If "He is bald" has a truth value of 0.5, then "He is not bald" is also 0.5. Depending on how you calculate disjunction, the result is not necessarily 1 (True).
  *   **Connection to Russell:** Russell writes in that essay about "degrees of vagueness" and treats representation as having a variable relation to reality. He anticipates the idea that a proposition can be *partially* true.

  This view was largely marginalized in analytic philosophy for the mid-20th century (because logicians like Tarski and Frege wanted to preserve classical logic for mathematics and science) but was revived in the 1970s by Lotfi Zadeh (Fuzzy Logic) and philosophers like Dorothy Edgington.

  ### 5. Why the Shift? (Historical Context)
  You are reading this in 1923. At this time:
  *   Formal semantics (Tarski) didn't exist yet.
  *   The distinction between "semantics" (meaning) and "metaphysics" (reality) wasn't as rigid.
  *   Russell was more concerned with the **psychological and physical reality of language**. He viewed words as physical events in the brain/world, and since physical things have blurry boundaries, words must too.

  Modern analytic philosophy (post-1950) became obsessed with preserving the validity of classical logic. Epistemicism and Supervaluationism are both attempts to say: *"Russell was right about vagueness, but we can't afford to lose the Law of Excluded Middle, so how do we keep it?"*
  *   Epistemicists keep it by positing hidden facts.
  *   Supervaluationists keep it by positing "super-truth."
  *   Russell just said: *"Lose it. It doesn't apply here."*

  ### 6. Back to Your Fraud-Scoring Engine
  This is where your rabbit hole becomes practical.

  *   **The Epistemicist Approach:** There *is* a specific transaction amount or velocity that constitutes fraud. We just don't know it. We should pick a hard cutoff (e.g., Score > 0.85 = Block) and pretend the boundary is sharp.
  *   **The Supervaluationist Approach:** The rule "Block if Fraud" is true across all reasonable interpretations of "Fraud." But for specific borderline cases, the system should return "Indeterminate" rather than True/False.
  *   **The Russellian (Degree) Approach:** **This is likely what you actually want.** Fraud is not binary. A score of 0.55 is *partially* fraudulent.
      *   Instead of a binary rule engine (If $X$ then Block), you build a continuous decision system.
      *   You acknowledge that for the "borderline" transactions, the statement "This is fraud" is neither true nor false, but has a truth-value of 0.5.
      *   Your action shouldn't be "Block/Allow," it should be "Challenge/Review," scaling with the degree of truth.

  ### Summary
  Russell is **not** anticipating Epistemicism or Supervaluationism. He is defending a view that both modern camps reject: **that the Law of Excluded Middle simply does not apply to vague empirical predicates.**

  *   **Epistemicism:** LEM True, Bivalence True. (Russell: No)
  *   **Supervaluationism:** LEM True, Bivalence False. (Russell: No)
  *   **Russell:** LEM False, Bivalence False. (He accepts truth-value gaps or degrees).

  You are reading a philosopher who was willing to break logic to save the phenomena, whereas the modern camps are willing to complicate the phenomena to save logic. For a fraud engine, Russell's pragmatism (degrees of truth) is usually the engineering winner.
