answer: |-
  This is an excellent question that gets to the heart of the post-1997 literature on dispositions. However, there is a significant misunderstanding in the premise of your query that is likely causing the confusion.

  The short answer is: **Lewis's Reformed Conditional Analysis (RCA) does *not* successfully solve masking and antidote cases, and Lewis did not claim that it did.** In fact, the persistence of the literature you mention (Bird, Fara, Manley & Wasserman) is largely due to the consensus that RCA fails to handle masking, alongside deeper objections to the conditional analysis project itself.

  Here is a breakdown of why the issue was not "closed" in 1997, why masking is distinct from finkishness, and why contemporary metaphysicians continue to publish on this topic.

  ### 1. The Distinction Between Finks and Masks
  Your query suggests that masking is "simply another way of interfering with the causal basis." In the literature, this distinction is crucial, and conflating them is the primary reason RCA is thought to fail.

  *   **Finkish Cases (Martin):** The stimulus causes the disposition (or its causal basis) to **vanish** before the manifestation can occur.
      *   *Example:* A wire is live, but touching it triggers a device that makes it dead instantly.
      *   *Lewis's Solution:* RCA adds the clause that the **causal basis must persist** through the stimulus. Since the basis vanishes in a fink case, the RCA conditional is not satisfied, and Lewis can correctly say the analysis doesn't falsely attribute the disposition (or rather, he handles the truth conditions so the disposition is preserved despite the fink).
  *   **Masking Cases (Johnston):** The disposition and its causal basis **persist**, but an extrinsic factor prevents the manifestation.
      *   *Example:* A fragile glass is wrapped in perfect packing peanuts. It is struck (stimulus), the molecular structure (basis) persists, but it does not break (manifestation) because of the peanuts.
      *   *The Problem for RCA:* RCA analyzes dispositions as: *$x$ is disposed to $M$ if $x$ has basis $B$, and if $x$ were stimulated, $B$ would persist and cause $M$.*
      *   In the masking case, the basis *does* persist. However, because of the mask, $B$ does *not* cause $M$. Therefore, the conditional is **false**.
      *   **Result:** RCA implies the glass is **not fragile**. But intuitively, the glass *is* fragile; it is just masked. RCA yields a **false negative**.

  Lewis was aware of this. In "Finkish Dispositions" (1997), he acknowledges that masking is a remaining difficulty. He suggested we might need to specify that the basis must be *sufficient* for the manifestation, but critics (like Johnston and Bird) argued that specifying "sufficiency" without referencing the disposition itself leads to circularity or triviality.

  ### 2. Why Bird Rejects RCA Entirely
  You asked why Alexander Bird keeps publishing analyses rather than citing RCA. The answer is that **Bird is a dispositional essentialist who rejects Conditional Analysis.**

  Bird argues that dispositions are real, irreducible properties (powers). He does not believe dispositions can be *analyzed* away into counterfactual conditionals. For Bird:
  *   Conditional analyses (like Lewis's) attempt to reduce dispositions to non-dispositional terms (stimulus + response).
  *   Bird argues this reduction fails because the truth of the counterfactuals depends on the disposition itself (via laws of nature).
  *   Therefore, Bird isn't trying to "fix" RCA to handle masking; he is arguing that **RCA is the wrong framework.** He proposes a modal account where dispositions are defined by their place in the nomological network, not by simple conditionals.

  ### 3. The Problems with "Intrinsicness"
  Lewis's RCA relies heavily on the disposition having an **intrinsic causal basis**. This was meant to solve finks (which often involve extrinsic mechanisms removing the basis). However, masking cases show that extrinsic factors can affect the truth of the conditional without removing the intrinsic basis.

  *   **Manley and Wasserman (2008):** They argue that dispositions are not binary (disposed/not disposed) but **gradable** and sensitive to **proportions**. RCA is a binary switch. A glass might be 90% disposed to break, but a mask reduces the manifestation probability. Manley and Wasserman argue that any conditional analysis (including Lewis's) fails to capture the gradable nature of dispositions and the context-sensitivity of "stimulus" and "manifestation."
  *   **Fara (2005):** Fara argues that dispositions are **habitual** or **generic**, not strict universal conditionals. RCA treats dispositions as strict laws (if stimulated, *then* manifestation). Fara points out that dispositions admit of exceptions (even without masks or finks). A fragile glass might not break if struck very gently, even if "struck" is the stimulus. RCA struggles to define the stimulus precisely enough without circularity.

  ### 4. The "Quiddity" and Triviality Objections
  Even if one tries to tweak RCA to handle masking (e.g., by adding a "no interferers" clause to the antecedent), two major problems arise which keep the seminar literature alive:

  1.  **Triviality:** If you define the "appropriate causal basis" as "whatever basis causes the manifestation in the absence of masks," the analysis becomes trivial. It says: *$x$ is disposed to $M$ if it has a basis that causes $M$ when it causes $M$.* This explains nothing.
  2.  **Epistemic Access:** We often ascribe dispositions without knowing the causal basis. RCA requires reference to the basis. If I say "this poison is poisonous," I don't need to know its molecular structure (basis). RCA makes disposition ascriptions too intellectually demanding.

  ### Summary for Your Seminar
  To finalize your unit, you might frame the dialectic this way:

  1.  **Simple Conditional Analysis:** Refuted by Martin (Finks).
  2.  **Lewis's Reformed Conditional Analysis (1997):** Solves Finks by requiring basis persistence. **However**, it fails on **Masking** (false negatives) and **Antidotes** (false negatives), and struggles with **Gradability** (Manley/Wasserman).
  3.  **Post-Lewis Landscape:**
      *   **The Revisionists:** (Fara, Manley & Wasserman) Try to save a conditional-style account by making it probabilistic, generic, or context-sensitive.
      *   **The Realists:** (Bird, Mumford, Ellis) Abandon conditional analysis entirely. They argue dispositions are primitive powers (Dispositional Essentialism). They cite Lewis not as the solution, but as the peak of the reductionist program that ultimately failed.

  **Conclusion:** The literature continues not because scholars missed Lewis's 1997 paper, but because the consensus is that **RCA does not solve masking**, and many leading figures (like Bird) believe **no conditional analysis can succeed**.

  **Suggested Reading for the Unit:**
  *   **Johnston, M. (1992).** "How to Speak of the Colors." (The classic masking objection).
  *   **Bird, A. (2007).** *Nature's Metaphysics.* (Chapter on why conditional analysis fails).
  *   **Manley, D., & Wasserman, R. (2008).** "On Linking Dispositions and Conditionals." (The gradability argument).
  *   **Lewis, D. (1997).** "Finkish Dispositions." (Note specifically where he acknowledges the masking difficulty).
