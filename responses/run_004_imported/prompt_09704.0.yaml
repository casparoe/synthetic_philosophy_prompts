      *   *Self-Correction during drafting:* I need to make sure I don't just say "Hansen says X." I need to build the *argument* based on that premise. I also need to ensure I don't accidentally slip back into the equivocation charge. The key is to show that *fei* (non-identity) is the operative relation, and Gongsun Long successfully proves non-identity, which is all he claimed. He never claimed "White horses are not a subset of horses." He claimed "White Horse *is not* Horse." If "is" implies identity/equivalence, he is right.

      *   *Refining the "Equivocation" Rebuttal:* The professor claims GL equivokes. The counter-claim is that GL is consistent: he is talking about the *names* (Ming). The Name "White Horse" is not the Name "Horse." This is tautologically true, but the *arguments* support why the *referents* of the names are distinct enough to warrant distinct names. It's a claim about the precision of language (*zheng ming*).

