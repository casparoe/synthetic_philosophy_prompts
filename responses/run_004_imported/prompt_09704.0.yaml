  **(Self-Correction Note):** I should be careful not to endorse Hansen's theory as *fact*, but as a *charitable interpretive framework* that makes the logic valid. The goal is to show logical validity *under a specific semantic interpretation*, proving the professor's dismissal is too hasty.

  Let's structure the argument around **Mereological Distinctness** and **Intensional Non-Equivalence**.

  *   **Premise 1:** Nouns refer to mereological sums (stuff), not classes.
  *   **Premise 2:** "White Horse" refers to a proper part of the sum referred to by "Horse."
