answer: |-
  Thank you all for being here.

  We are gathered to mourn [Aunt's Name]. For those of you who knew her best, you know that she was a woman who paid attention. In a world that often encourages us to look away from difficulty, she chose to look directly at it.

  She spent decades as a hospice volunteer. She sat with people in the final, fragile moments of their lives. She didn't do this because she believed their pain was a lesson, or because she thought their suffering was balanced out by the love in the room. She did it because she believed that when someone is hurting, the only right thing to do is to be there with them. To witness. To soften the edges where she could.

  Later, she extended that same attention to the wider world, giving much of what she had to help animals who could not ask for help themselves. She had long, passionate debates with her friends about the nature of suffering. She held a hard truth: that pain is real, and joy, however beautiful, does not erase it. She didn't believe that a life becomes "worth it" simply because good things happened alongside the bad. She believed that suffering matters on its own terms, and that our job is to reduce it, not to justify it.

  I know many of us are hurting right now. We are looking for comfort. It is tempting to say that her illness taught her something, or that her struggle makes this loss easier to bear. But she asked me not to say those things. She taught us that we don't need to trade pain for meaning. We don't need to pretend her illness was a price paid for something greater. It was just an illness. It was hard. And her grief, and ours, is valid simply because it is ours.

  So how do we find comfort without pretending? We find it in the fact that she was never alone in her values. We find it in knowing that she lived exactly as she thought was right. She didn't wait for a reward. She didn't keep a ledger. She simply acted on the belief that reducing harm matters.

  The best way to honor her is not to claim that her life balances out. It is to follow her example of attention. When we see suffering—in our families, in our neighbors, in the world—we don't have to look away. We don't have to explain it. We just have to respond.

  [Aunt's Name] took pain seriously. Let us take her seriously. Let us take care of each other, not because it fixes everything, but because it is what she would do.

  Thank you.
