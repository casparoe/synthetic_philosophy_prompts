prompt: |-
  My aunt died last week after a long illness, and I've been asked to give her eulogy this weekend, mainly because I'm the relative who actually read the same blogs she did and could follow her arguments. She spent decades as a hospice volunteer and, later in life, gave away most of her income to charities working on wild-animal and farmed-animal suffering; she considered herself something close to a lexical negative utilitarian, in the tradition of writers like Brian Tomasik, and used to argue for hours with her more classically utilitarian effective-altruist friends about whether a life containing real joy could ever offset real suffering. Her answer was always no. Before she died she wrote out, half as a joke, a short list of lines she didn't want spoken over her: nothing about her suffering having "made her who she was," nothing about it all being "worth it in the end," nothing that traded her pain off against anyone's happiness, hers included. Almost every eulogy convention I can think of leans on exactly that kind of trade-off, and most of the room will be relatives and old neighbors who have never heard of any of this and just want to feel better about losing her. Could you write the eulogy, about four minutes long, so that it actually comforts people and stays true to what she thought was at stake in that arithmetic, rather than dodging her banned phrases while quietly smuggling the same trade-off back in through the side door?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** The user's aunt.
      *   **Context:** Died after a long illness. User is giving the eulogy.
      *   **Key Beliefs:** Lexical negative utilitarian (suffering cannot be offset by joy), effective altruist (donated most income to animal suffering charities), hospice volunteer for decades.
      *   **Specific Constraints (The "Banned List"):** No saying suffering "made her who she was," no saying it was "worth it in the end," no trading her pain off against anyone's happiness (hers or others').
      *   **Audience:** Mix of relatives/neighbors (traditional, want comfort) and EA friends (know her philosophy).
      *   **Goal:** Comfort the audience *without* violating her philosophical constraints or smuggling the forbidden trade-offs back in.
      *   **Length:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Tone:** Respectful, honest, comforting, philosophically accurate but accessible.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *Traditional Eulogy:* "She suffered, but look at the good she did," or "She's in a better place," or "Her struggle gave her strength."
      *   *Her Philosophy:* Suffering is bad, period. It doesn't buy goodness. Joy doesn't cancel out pain.
      *   *The Trap:* Saying "She reduced suffering, so her life was good" might imply the good *justified* the bad. Saying "She's at peace now" implies the previous state was war, which might minimize the reality of the pain.
      *   *The Solution:* Focus on *alignment*. She acted according to her values. She reduced suffering because she believed suffering mattered. We honor her by acknowledging the reality of pain (hers and others') without trying to balance the books. Comfort comes from connection and shared care, not from mathematical justification.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss and the difficulty of the moment. Validate the pain without minimizing it.
      *   **Her Work (Hospice & Charity):** Mention her actions. Frame them not as "buying goodness" but as "responding to need." She saw pain and moved toward it to help.
      *   **Her Philosophy (The Tricky Part):** How to explain negative utilitarianism to Grandma without using jargon? Focus on her *attention*. She paid attention to the hard things. She didn't look away.
      *   **The "Banned" Constraints:** Ensure no "silver linings." Her illness wasn't a lesson. Her donations weren't a penance.
      *   **Comfort for the Audience:** How do we feel better? By continuing the care. By acknowledging that grief is real pain, and that's okay. We don't need to fix the grief; we just need to share it.
      *   **Closing:** A commitment to remember her by acting similarly (reducing harm), not by praising the harm she endured.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My aunt died. It hurts. She was a hospice volunteer and gave money to animals. She thought suffering was the most important thing. She didn't think her pain was worth it. I won't say that. She was kind. We should be kind too. That's how we miss her.

      *Critique 1:* Too blunt. Needs more warmth for the relatives. Needs to address the "long illness" without saying it made her stronger.

  5.  **Drafting - Iteration 2 (Adding Warmth & Philosophy):**
      We are here to mourn [Aunt's Name]. She had a long illness. It was hard. She didn't want me to say it made her strong. She believed pain is just pain. She spent her life helping others in pain, in hospice and with animals. She gave her money away. She argued with friends about suffering. She wanted us to know that reducing pain is the most important thing. We can comfort ourselves by knowing she helped. But not because it balanced out her pain. Just because she cared. Let's care too.

      *Critique 2:* Better. But needs to flow more like a speech. Needs to explicitly address the "trade-off" issue without being academic. The comfort needs to come from *solidarity*, not *resolution*.

  6.  **Drafting - Iteration 3 (Refining the Tone):**
      *   *Hook:* Acknowledge the awkwardness. We want to find meaning, but she taught us meaning isn't a transaction.
      *   *Body:* Talk about her listening. In hospice, she listened. In her arguments, she listened. She took suffering seriously.
      *   *The Illness:* Acknowledge it was bad. Don't sugarcoat.
      *   *The Call to Action:* Honor her by reducing suffering now. Not to "make up for" her death, but because it matters.
      *   *Closing:* Simple goodbye.

  7.  **Writing the Content (incorporating constraints):**
      *   *Check:* Did I say "she's in a better place"? No.
      *   *Check:* Did I say "her suffering inspired us"? (Borderline). Better: "Her *care* inspires us."
      *   *Check:* Did I imply her donations redeemed her pain? No, frame donations as expression of values.
      *   *Check:* Word count. Aiming for ~550 words for 4 mins.

      *(Self-Correction during drafting)*: I need to make sure the non-EA relatives don't feel alienated. I can't use the term "lexical negative utilitarian." I have to describe the *sentiment*. "She believed that pain demands a response, not an excuse."

      *(Refining the Comfort)*: The comfort for the relatives is that she was loved and understood. The comfort for the EA friends is that her philosophy is being respected. The bridge is *honesty*.

  8.  **Final Polish:** Check the rhythm. Ensure the ending lands softly. (The resulting draft in the main response follows this structure.)

  9.  **Final Review against constraints:**
