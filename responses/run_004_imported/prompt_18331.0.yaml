      *   **Organicism:** The xs compose a y iff the activity of the xs constitutes a life.
      *   **Vagueness of "Life":** Van Inwagen acknowledges "life" might be vague.
      *   **His Solution to Vagueness:** He distinguishes between *vagueness in the world* (ontological vagueness) and *vagueness in language/concepts* (semantic vagueness). He claims "life" is semantically vague. If it's semantically vague, then it's vague *which concept* applies, not whether composition occurs given the concept.
      *   **Wait, correction:** Van Inwagen actually argues that *existence* cannot be vague. If "constitutes a life" is vague, then composition is vague. To save his theory, he argues that "constitutes a life" is *not* vague in the relevant ontological sense, or he accepts a version of the Problem of the Many where there are many candidates but only one true composite.
      *   **Key Textual Point:** In *Material Beings* (Section 13-14 roughly), he addresses the vagueness of "life." He argues that while the *word* "life" might be vague, the *fact* of whether the activity of the xs constitutes a life is a precise physical fact (involving causal relations among simples). However, he does acknowledge the Problem of the Many (Section 15?). He admits there are many overlapping aggregates that *almost* constitute a life. His solution is indeed a form of "many candidates, one referent" or "semantic indecision."
