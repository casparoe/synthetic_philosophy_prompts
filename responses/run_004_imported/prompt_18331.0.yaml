      *   *Premise 2 (The Nature of Life):* "Constituting a life" is a biological/functional condition. Like "fastening," it admits of Sorites series (e.g., metabolic slowdown, boundary cases like viruses, shedding skin, replacing cells).
      *   *Premise 3 (The Dilemma):* Van Inwagen has two options regarding the vagueness of "life":
