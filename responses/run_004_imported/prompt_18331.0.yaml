      *   *The Rebuttal:* Biological processes are *not* precise in the way microphysical events are. Metabolism is a statistical aggregate of chemical reactions. There is no "fact of the matter" at the quantum level about whether a specific exchange counts as "sustaining the life." Therefore, "constituting a life" is *ontologically* vague, not just semantically vague.

