      *   *Analysis of (B):* If "Life" is vague, then composition is vague (since composition $\iff$ Life). This violates his core metaphysical principle (no vague existence).
      *   *Van Inwagen's Actual Move:* He tends toward a version of (A) regarding the *event* of life, but accepts a "Problem of the Many" style solution for the *objects*. He says there are many aggregates, but only one "life" is being constituted. Or rather, our term "cat" is semantically indecisive among many candidates, but *something* composite exists.
      *   *The Counter-Argument:* If he allows semantic indecision to save Organicism from the Problem of the Many, why couldn't a defender of "Fastening" use semantic indecision to save their view? (e.g., "Artifact" is semantically indecisive among many overlapping fused aggregates"). If he blocks that move for artifacts but allows it for organisms, he needs a principled distinction.

