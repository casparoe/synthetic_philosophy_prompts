answer: |-
  You are right to be nagged. The standard rationalist dismissal of the Dogmatism Paradox—"just don't assign probability 1"—is epistemically cosmetic. It treats the paradox as a bug of *logical certainty* when it is actually a bug of *inferential structure*.

  Here is the steelman case for why the Dogmatism Paradox survives the transition from binary knowledge to probabilistic credence, and why Cromwell's Rule is insufficient to kill it.

  ### 1. Dogmatism Migrates from Priors to Likelihoods
  The standard fix assumes dogmatism lives in the prior: $P(H) = 1$. If you lower the prior to $0.995$, the math *should* force you to update on counter-evidence. But Bayes' Theorem is $P(H|E) \propto P(H) \times P(E|H)$. You can keep $P(H)$ sub-1 while manipulating the likelihood ratio to achieve the exact same dogmatic outcome.

  If I hold $H$ at 99.5%, I am implicitly committed to a model of how the world produces evidence. Let $E$ be "apparent counter-evidence." I must assess $P(E | H)$ versus $P(E | \neg H)$.
  *   If I am a true fallibilist, $P(E | \neg H)$ is high (if $H$ is false, I should expect to see evidence against it).
  *   But if I am a *dogmatic* Bayesian, I simply assert that $P(E | H \land \text{Noise}) \gg P(E | \neg H)$.

  I can maintain $P(H) = 0.99$ while simultaneously maintaining $P(\text{Measurement Error} | E) = 0.99$. When $E$ arrives, I don't update against $H$; I update against the reliability of the instrument that produced $E$. This is not a violation of Bayesianism. It is a feature of the Quine-Duhem thesis applied to probability: you never test a hypothesis in isolation, only a hypothesis conjoined with a set of auxiliary assumptions (including "my eyes are working," "this study wasn't faked," "my memory is accurate").

  The Dogmatism Paradox re-emerges here because nothing in the probability calculus prevents you from having a prior on your auxiliary assumptions that is *more robust* than your prior on the object-level hypothesis. You can be fallible about the earth being flat, but dogmatic about the idea that NASA photos are doctored. The math clears you. The structure of the paradox remains intact: you have licensed yourself to discard counter-evidence in advance, not because $H$ is certain, but because the *pathway* for counter-evidence is deemed unreliable.

  ### 2. Conservation of Expected Evidence is Too Weak a Constraint
  You correctly identified that Conservation of Expected Evidence (CEE) only constrains the *average* movement of credence, not the policy for handling specific data points.

  CEE states: $E[P(H|E)] = P(H)$. This means if you expect to update up with probability $X$, you must expect to update down with probability $Y$ such that the weighted average is zero. It does *not* dictate how you process a specific instance of $E$.

  A dogmatic agent can satisfy CEE easily. They can say: "I expect that 99% of the time, I will see no evidence or confirming evidence, and my credence will stay steady or rise. In the 1% of cases where I see massive counter-evidence, I will classify it as 'hallucination' or 'conspiracy' and update my belief in *sanity* rather than *H*."

  As long as the agent updates *something* (e.g., "I am now less confident that my instruments are working"), CEE is satisfied. The agent has successfully insulated $H$ from revision while remaining technically Bayesian. The paradox warned that knowledge licenses ignoring evidence; probabilistic epistemology licenses ignoring evidence by re-categorizing it as noise. The functional outcome for the truth-tracking capability of the agent is identical.

  ### 3. The "Practical Zero" and Decision-Theoretic Dogmatism
  Even if we grant that there is a mathematical difference between $P=1$ and $P=0.999999$, the distinction evaporates in decision space.

  Epistemology is supposed to guide action. If my credence in $H$ is high enough, the expected utility of investigating counter-evidence becomes negative.
  *   Cost of checking evidence $E$: $C$ (time, cognitive load, social capital).
  *   Expected benefit of updating: $P(\neg H) \times \text{Value of Truth}$.

  If $P(\neg H)$ is $10^{-6}$, and $C$ is non-trivial, the rational Bayesian move is to *ignore* $E$. This is "Effective Dogmatism." If you are rationally compelled to ignore all potential counter-evidence because your credence is high (but not 1), you have reconstructed the dogmatic lock-out Kripke identified.

  The standard fix says, "But you *could* update if the evidence were strong enough!"
  The steelman reply is: "If your model is consistent, you will never *see* evidence as strong enough, because any evidence strong enough to overcome a $10^{-6}$ prior would also be strong enough to trigger your 'this is a trick' alarm."

  This explains the phenomenon of the "Unmovable Crank." They aren't assigning $P=1$. They are assigning $P=0.999$ to the hypothesis and $P=0.9999$ to the hypothesis that "mainstream institutions lie." When confronted with $E$, the math dictates they reject the institution, not the hypothesis. They are following the Bayesian update rule perfectly. The failure is not in the arithmetic; it is in the topology of their hypothesis space.

  ### 4. Polarization as Proof of the Paradox's Survival
  The strongest empirical evidence that the paradox survives the Bayesian fix is political and scientific polarization.

  Consider two agents, A and B. Both are perfect Bayesians. Neither assigns $P=1$ to their political views. They are shown the same piece of counter-evidence $E$ (e.g., a scandal involving their preferred candidate).
  *   Agent A updates: "This candidate is flawed."
  *   Agent B updates: "This scandal is a fabrication by the opposition."

  Why? Because they have different priors on the reliability of the source of $E$. If Agent B's prior on "Opposition lies" is sufficiently high, the rational Bayesian update is to increase confidence in the conspiracy, not decrease confidence in the candidate.

  This is the Dogmatism Paradox in the wild. Kripke's paradox suggests that if you know $H$, you can ignore $\neg H$. In the real world, if you *highly credence* $H$ and *highly credence* a defensive auxiliary hypothesis (like "my tribe tells the truth"), you are licensed to ignore $\neg H$ without ever violating Cromwell's Rule. The fact that rationalist discourse is filled with people talking past each other, both claiming to be Bayesian, both assigning $P < 1$, yet neither updating, proves that the "don't assign 1" fix is inert.

  ### 5. Conclusion: The Fix is Cosmetic
  The instruction "never assign probability 1" addresses a *logical* vulnerability (explosion from contradiction) but fails to address the *epistemic* vulnerability (immunization against revision).

  Kripke's insight was that the *concept* of knowledge contains a seed of dogmatism: to claim to know is to claim that contrary evidence is misleading. The Bayesian translation is: to claim high credence is to claim that contrary evidence is likely noise.

  If you have a high enough credence in $H$, you necessarily have a high enough credence that evidence against $H$ is misleading (false positive, error, lie). Therefore, you are licensed to discount it. The only thing stopping you is a separate, meta-level commitment to "update on strong evidence," but as shown above, what counts as "strong" is determined by your current priors.

  The Dogmatism Paradox is not a paradox of certainty; it is a paradox of **self-sealing systems**. A probabilistic belief system can be just as self-sealing as a dogmatic one if the likelihood ratios are rigged by auxiliary hypotheses. Telling a Bayesian "don't be certain" is like telling a conspiracy theorist "don't be so sure." It misses the mechanism. The mechanism isn't the confidence level; it's the pre-commitment to how counter-evidence is processed. And Bayesianism, by allowing flexible likelihoods and auxiliary hypotheses, provides all the tools necessary to build that pre-commitment without ever touching $P=1$.

  You are correct: the paradox survives. The "Cromwell's Rule" fix is a distinction without a functional difference.
