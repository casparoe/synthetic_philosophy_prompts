          *   Tolstoy's History: Infinitesimals are a *concession* that we cannot know the ultimate cause (freedom vs. necessity).
      *   *Verdict:* It is largely a metaphorical sleight of hand. Tolstoy uses the *prestige* of Newton/Calculus to validate his metaphysical claim. He isn't doing math; he's doing epistemology. He argues that because we can't observe the *source* of freedom (just as Newton couldn't explain *why* gravity exists, only *that* it does), we must treat it as a given limit. The "inaccessibility" comes from human consciousness, not the math.
