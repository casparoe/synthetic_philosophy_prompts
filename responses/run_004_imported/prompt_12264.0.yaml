answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I'm a backend engineer, and I'm Denny's nephew/niece.

  Denny asked me to speak once, years ago, when he thought he'd have time to prepare his own remarks. He said, "Make sure they know I wasn't afraid. I was just debugging."

  I've spent the last week trying to write this. I'm not a speechwriter. I write code. And honestly, trying to summarize a human life feels like trying to document a legacy system that no one fully understands anymore. But there is one specific piece of Denny's architecture that I need to talk about, because it explains how he faced the last eight years.

  A few years after his diagnosis, Denny stopped fighting the memory loss and started engineering around it. He found a philosophical theory called the "Extended Mind." It was proposed by Andy Clark and David Chalmers. They had a thought experiment about a man named Otto who had Alzheimer's. Otto carried a notebook everywhere. When he needed to remember where the museum was, he looked in the notebook.

  The argument was that the notebook wasn't just a tool; for Otto, it *was* his memory. It was part of his mind.

  Denny loved this. He called his own system of notebooks, phone alarms, and whiteboards "The Otto Stack." He told anyone who would listen that he wasn't losing his mind. He was just moving more of it outside his skull.

  Now, I know there are people here from the philosophy meetup who know the actual theory better than I do. And I know there are family members here who just want to hear about their uncle. So I need to be careful with this.

  There is a temptation, when someone dies, to say comforting things like, "Part of him lives on in these notebooks." I wanted to write that. It feels good. But Denny would have hated it. And technically, it's wrong.

  According to the theory Denny loved, the notebook is only part of the mind if there is a person there to use it. The mind isn't the paper. The mind is the *connection* between the person and the paper. Without Denny to write in them, to read them, to trust them, the Otto Stack is just a stack of paper and old phones. The system is offline.

  Denny was a militant atheist. He didn't believe in souls, or afterlives, or mystical energy. He believed in physics, and firmware, and the truth. So I'm not going to tell you that he's still here in these pages. He isn't.

  But here is what is true.

  For eight years, while his biological hardware was degrading, Denny used the Otto Stack to maintain his agency. He used it to remember birthdays. He used it to argue about politics. He used it to tell us he loved us. Every time he reached for a notebook, he was making a conscious engineering decision to remain Denny for five more minutes.

  That wasn't magic. It was work. It was hard, frustrating, relentless work.

  And while the theory says the notebook is part of the mind, Denny knew something the philosophers didn't put in the paper. He knew that the system required maintenance. He needed us to help him maintain the stack.

  When I helped him set up a new reminder on his phone, or when my aunt sat with him to organize his files, we weren't just helping him. We were coupling with him. For those eight years, *we* were part of his extended mind. We were the cloud backup. We were the external processing power that kept him connected to the world.

  So, the notebooks are just paper now. The system is down. But the work he did to stay connected to us? That happened. The love he expressed through that system? That was real.

  Denny didn't want a eulogy that pretended death wasn't final. He wanted us to acknowledge the problem, assess the damage, and honor the solution.

  He solved the problem of how to live with dignity while losing himself. He didn't do it with prayer. He did it with ink, and alarms, and stubbornness. And he did it with the help of the people in this room who became part of his system.

  To the philosophy group: Thank you for giving him a framework that made him laugh, and made him feel validated rather than broken.
  To the family: Thank you for being the reliable API that kept him connected to the world when his internal network started failing.

  Denny isn't in the notebooks. But for eight years, the notebooks allowed him to be here, with us. And that was enough for him. It should be enough for us.

  Rest easy, Uncle Denny. The system can shut down now. You did the work.

  Thank you.
