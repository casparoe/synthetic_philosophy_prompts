  4.  **Developing the Voice:**
      *   **Correspondent:** Professional, persistent, respectful but not deferential.
      *   **Turing:** Precise, literal, occasionally dry/wry, focused on the logic rather than the implication. He shouldn't sound like a mystic; he should sound like a logician dealing with anomalous data.

  5.  **Review against Constraints:**
