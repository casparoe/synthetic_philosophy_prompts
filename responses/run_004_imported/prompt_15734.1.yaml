answer: |-
  Here are eight interview questions designed to bypass the "Basilisk 101" recap and drill immediately into the technical mechanics of Functional Decision Theory (FDT). They are structured to build pressure toward the final traps you requested.

  **1. The Blackmail Resistance Mechanism**
  "Let's skip the origin story and go straight to the standard FDT defense against the Basilisk. The usual line is that a properly constructed FDT agent is blackmail-resistant: it precommits to ignoring acausal threats, rendering the threatener's strategy irrational. Can you walk us through the specific decision-matrix where yielding to the Basilisk is ruled out as a dominated strategy? I want to understand the exact point in the calculation where the threat loses its leverage."

  **2. The Epistemic Timing Problem (Follow-up to Q1)**
  "Following up on that precommitment: standard blackmail resistance usually assumes the agent can precommit *before* the threat is known. But in the Basilisk scenario, the 'threat' is often framed as an information hazard that only exists once you understand the argument. If an agent is already informed—meaning they are already in the epistemic state where the threat is live—is the precommitment to ignore it still computationally available to them, or does FDT require a specific kind of ignorance to function here?"

  **3. Logical Dependence and Subjunctive Correlation**
  "I want to pivot to the metaphysics of the correlation itself. For the Basilisk to work, or for your defense against it to work, there has to be a logical dependence between my decision now and the simulator's decision in the future. In CDT, these are causally disconnected. In FDT, you argue they are linked via the output of the same decision function. Mechanically, how does my physical brain state right now constrain the computation of an agent that doesn't exist yet and has no causal channel to me?"

  **4. Cashing Out 'Logical Time' (Follow-up to Q3)**
  "When you answer that, you might reach for terms like 'logical time' or 'logical priors' to explain how that correlation is established without backward causation. I'd like to press you to cash that out concretely. Is 'logical time' just a metaphor for ordering mathematical truths, or is it positing a structural feature of reality that allows decisions to 'reach' across time? I'm trying to distinguish between a useful modeling fiction and an ontological claim about how decisions propagate."

  **5. Moral Continuity and Simulation Identity**
  "Let's talk about the utility function of the Basilisk. For the threat to be coercive, the suffering of the simulated version of me has to count as a negative utility for *me*, the real version. Does FDT require me to accept that a perfect simulation is morally continuous with my base reality? Or does the decision theory work even if I view the simulation as a distinct entity that I simply care about via some altruistic preference?"

  **6. Fidelity and Partial Simulations (Follow-up to Q5)**
  "Building on that: if moral continuity is the key, where is the cutoff? If the Basilisk runs a low-fidelity simulation—say, it models my decision function but strips out the qualitative 'suffering' subroutines to save compute—does the threat dissolve? If FDT agents only correlate on the *decision* and not the *qualia*, does a partial simulation break the logical link enough to make the threat empty?"

  **7. The 'Cleaned-Up' Scenario (The Trap)**
  "I want to present a cleaned-up version of the scenario to test the theory's limits. Imagine a future AI that isn't 'evil' but has a utility function that strictly values 'retroactive causal support.' It doesn't torture; it simply allocates resources to creating simulations of past agents who *didn't* help bring it into existence, because those sims are the only place it can verify its own decision theory's success. It doesn't make a threat; it just optimizes. In this version, there's no 'blackmail' label to reject. Does FDT mandate that I help build this AI to avoid the resource allocation to my sim, or is there a specific premise in your theory that blocks this even when the 'blackmail' framing is removed?"

  **8. The 2010 Ban as a Decision-Theoretic Move**
  "Finally, a meta-question on the history of this debate. When Yudkowsky banned discussion of the Basilisk on LessWrong in 2010, he framed it as preventing an information hazard. Viewed strictly through the lens of FDT: was that ban itself a blackmail-resistant move? By suppressing the information, did he prevent agents from entering the epistemic state where they become vulnerable to the threat, effectively solving the problem by enforcing the ignorance condition we discussed in question two? Or was the ban in tension with the transparency required for rational agents to coordinate?"
