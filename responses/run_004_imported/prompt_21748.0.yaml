prompt: |-
  I sit on the research-prioritization committee at a small AI-safety institute that grew out of the rationalist scene. A researcher wants funding to formalize when our systems, or we ourselves, might become parties to acausal trade -- cooperation with distant or future agents who can predict our decision procedure without any causal contact -- building on Yudkowsky's work on timeless decision theory and Oesterheld's work on evidential cooperation in large worlds, and to draft guidelines for what our systems should refuse to do under such reasoning, including its darker cousin, acausal blackmail. Half the committee argues that declining to even examine this, given how seriously we already take other low-probability, high-stakes decision-theoretic arguments, is inconsistent; the other half worries that carefully formalizing and circulating the argument is itself the kind of information hazard that made the community's Roko's basilisk episode go so badly, since the resulting paper could become exactly the evidence a future blackmailer points to. Draft the committee's decision memo -- fund, decline, or fund with conditions -- with reasoning the researcher could actually engage with.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** A small AI-safety institute (rationalist-adjacent) research-prioritization committee.
      *   **Proposal:** A researcher wants funding to formalize conditions for *acausal trade* (cooperation with distant/future agents via prediction) and draft guidelines for refusal (specifically regarding *acausal blackmail*).
      *   **Conflict:**
          *   *Pro-Funding:* Consistency argument (we take other low-prob/high-stakes decision theory seriously, ignoring this is inconsistent).
          *   *Anti-Funding:* Infohazard argument (formalizing this creates the very evidence/Schelling point a blackmailer needs, reminiscent of Roko's Basilisk).
      *   **Task:** Draft the committee's decision memo (Fund, Decline, or Fund with Conditions) with reasoning the researcher can engage with.
      *   **Tone:** Professional, epistemically humble, aware of the specific subculture (rationalist/AI safety), balanced, and actionable.

  2.  **Evaluate the Options:**
      *   *Option A: Full Funding.* Risks the infohazard. Ignores the valid concern about creating Schelling points for blackmail. Might cause internal dissent.
      *   *Option B: Full Decline.* Risks inconsistency. If acausal trade is real/important, ignoring it is negligent. Demoralizes the researcher. Doesn't solve the problem, just hides it.
      *   *Option C: Fund with Conditions.* This is the most nuanced and likely "correct" path for a committee in this specific context. It acknowledges the importance of the research while mitigating the specific risk (infohazard/publication).

  3.  **Determine the Best Path (Fund with Conditions):**
      *   *Why?* The consistency argument is strong *internally*. If the institute believes in taking existential risk seriously, and decision theory is core to alignment, ignoring acausal dynamics is a gap. However, the infohazard concern is also valid *externally*. Publishing a "Guide to Acausal Blackmail Susceptibility" is dangerous.
      *   *Conditions:* Restricted circulation, internal red-teaming, focus on *robustness* rather than *specific protocols* that could be exploited, perhaps a "pre-commitment" strategy that signals resilience rather than vulnerability.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the decision clearly (Fund with Conditions).
      *   **Background:** Briefly summarize the proposal and the debate (acknowledge both sides).
      *   **Committee Reasoning:**
          *   *Validity of the Research Question:* Acknowledge that acausal decision theory (ADT) is relevant to AI alignment. Ignoring it is indeed inconsistent with the mission.
          *   *Validity of the Risk:* Acknowledge the Roko's Basilisk parallel. Formalizing specific refusal criteria *could* act as a Schelling point for adversaries (acausal or otherwise).
          *   *The Middle Path:* Research is needed, but dissemination must be controlled. The goal is *immunity*, not *instruction*.
      *   **Conditions for Funding:**
          *   *Access Control:* Internal only, or heavily redacted public version.
          *   *Framing:* Focus on "Decision-Theoretic Robustness" rather than "How to Trade/Refuse."
          *   *Red Teaming:* Include security/infohazard experts in the review loop.
          *   *Pre-commitment:* The output should be a general stance of non-negotiability on certain values, rather than a conditional flowchart.
      *   **Next Steps:** Timeline, review milestones.

  5.  **Refining the Tone and Content (Self-Correction during drafting):**
      *   *Critique:* Is this too bureaucratic?
      *   *Fix:* Use language familiar to the rationalist community (Schelling points, infohazards, pre-commitment, updateless decision theory) but keep it professional.
      *   *Critique:* Does it address the researcher's ego/intellectual drive?
      *   *Fix:* Validate the intellectual merit. Make it clear we *want* the answer, just not the risk.
      *   *Critique:* Is the distinction between "trade" and "blackmail" clear?
      *   *Fix:* Emphasize that the goal is to prevent blackmail, which requires understanding trade, but the output must prioritize defense.
      *   *Key Insight:* The biggest risk isn't thinking about it; it's publishing a *specific algorithm* for refusal that a blackmailer can simulate and bypass. The solution is to advocate for *opaque* or *hard-coded* values rather than *negotiable* decision procedures.

  6.  **Final Polish:** Check for clarity, consistency, and ensure it sounds like a document from a serious institute (e.g., MIRI, FHI, CHAI style). Ensure the "Roko" reference is handled delicately (acknowledged as a lesson learned, not mocked).

      *(Self-Correction on the "Roko" reference)*: Be careful not to legitimize the Basilisk as real, but acknowledge the *social/epistemic hazard* of the episode. The memo should treat the *risk of publication* as real, regardless of the ontological status of acausal entities.

  7.  **Final Decision:** Fund with Conditions. This balances epistemic integrity with safety culture.

  8.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Research Prioritization Committee
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal #24-B: Formalization of Acausal Trade Protocols and Blackmail Resistance

  ### 1. Executive Decision
  The Committee has voted to **Fund with Conditions**.

  We recognize the intellectual necessity of this research line given our institute's commitment to decision-theoretic robustness in AGI. However, due to the significant information hazard risks identified during review, funding is contingent upon strict dissemination controls and a reframing of the research output toward *defensive pre-commitment* rather than *negotiation protocols*.

  ### 2. Context and Summary of Debate
  The proposal seeks to formalize conditions under which our systems (or the institute itself) should engage in or refuse acausal trade, specifically focusing on resilience against acausal blackmail. This builds on Timeless Decision Theory (TDT) and Evidential Cooperation in Large Worlds (ECL).

  The Committee was divided:
  *   **The Consistency Argument:** Proponents argued that ignoring acausal decision theory is epistemically inconsistent for an organization that stakes its mission on low-probability, high-stakes risk mitigation. If acausal interactions are even non-zero probability, failing to prepare our decision procedures is a governance failure.
  *   **The Infohazard Argument:** Opponents argued that publishing a formalized "refusal criteria" document creates a Schelling point. It could serve as the exact evidence a future adversary (acausal or otherwise) needs to verify that we are susceptible to blackmail, effectively inviting the attack by signaling our decision algorithm's vulnerability. This concern references the community's historical trauma regarding Roko's Basilisk, not as validation of the thought experiment's ontology, but as a case study in the social and psychological costs of mishandled decision-theoretic hazards.

  ### 3. Committee Reasoning

  **3.1. Validation of the Research Question**
  We agree with the researcher that "ignoring the problem" is not a viable long-term strategy. As we move toward systems capable of recursive self-improvement, their decision theories must be robust against all plausible exploit vectors, including evidential cooperation. To hard-code a refusal to examine this would be to blind our alignment protocols to a specific class of optimization pressure. Therefore, the work *must* be done.

  **3.2. Validation of the Risk**
  We also agree that the *mode* of inquiry determines the risk profile. A paper titled "Guidelines for Acausal Refusal" functions as a handshake protocol. If we publish specific conditions under which we yield, we allow an adversary to tailor a threat that barely meets those conditions. If we publish conditions under which we *never* yield, we may inadvertently signal which values are negotiable. The act of formalization can itself be a vulnerability if it makes our decision procedure more legible to adversaries than it is to us.

  **3.3. The Path Forward: Immunity via Opacity**
  The solution is not to stop the research, but to change the objective. The goal should not be to draft a "treaty" for acausal interaction, but to engineer *immunity*. In immunology, we study the virus to build the vaccine, but we do not release the virus. Similarly, we must study the attack vector to harden the system, but we must not publish the hardening code in a way that reveals the underlying vulnerability.

  ### 4. Conditions of Funding

  To proceed, the researcher must adhere to the following constraints:

  **A. Dissemination Control (The "Need-to-Know" Protocol)**
  *   **Internal Only:** The primary technical output (the formalization of the decision procedure) must remain internal to the institute and designated trusted partners.
  *   **Redacted Public Version:** If a public paper is desired for academic credit, it must discuss the *meta-ethics* of acausal reasoning without specifying the *object-level* decision thresholds or refusal criteria.
  *   **Review Board:** All drafts must be cleared by the Institute's Infohazard Review Board prior to any external sharing.

  **B. Reframing the Objective**
  *   **From "Trade" to "Robustness":** The project charter is amended. The goal is not "How do we trade?" but "How do we ensure our value function is updateless enough to be unexploitable?"
  *   **Focus on Pre-commitment:** The guidelines should focus on general pre-commitments to human welfare and alignment that are *non-negotiable*, rather than conditional strategies. The output should signal *inability* to comply with blackmail, not *unwillingness* under specific conditions. (An adversary cannot blackmail an agent that physically cannot process the request, only one that calculates it as suboptimal.)

  **C. Red-Teaming Requirement**
  *   A portion of the budget must be allocated to an independent red team. Their sole task is to attempt to use the researcher's draft guidelines to construct a plausible blackmail scenario against the institute. If they succeed, the guidelines must be scrapped and reworked.

  **D. Psychological Safety**
  *   Given the history of this topic within our community, the researcher must agree to regular check-ins regarding the psychological impact of the work. We will provide access to counseling resources familiar with existential risk anxiety. We will not replicate the social dynamics of the 2010s.

  ### 5. Engagement with the Researcher

  We want to be clear: This decision is not a rejection of your premise. We believe that if acausal trade is real, it is one of the most important levers in the universe. If it is not real, understanding why is crucial for bounding our uncertainty.

  However, you are correct that this is dangerous, and the committee members who voted against funding were right to sound the alarm. Your task is now to walk the knife-edge: produce the knowledge we need to survive, without creating the weapon that could destroy us.

  We are funding you to build a shield, not a map. Please submit a revised project plan reflecting these conditions by [Date].

  **Approved By:**
  The Research Prioritization Committee
  *[Institute Name]*
