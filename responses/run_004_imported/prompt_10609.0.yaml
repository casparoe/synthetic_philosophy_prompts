answer: |-
  **Córdoba, late afternoon. The courtyard of the Great Mosque. A small brazier sits between them. Al-Ghazālī holds a tuft of raw cotton with iron tongs; Ibn Rushd watches his hand.**

  **Al-Ghazālī:** You watch my hand, Qāḍī, expecting the flame to seize the cotton. And it shall. But tell me: what do you actually *see*?

  **Ibn Rushd:** I see contact, Abū Ḥāmid. I see the fire touch the fiber, and I see the blackening, the smoke, the ash. I see the agent and the patient. I see what every cook and blacksmith knows.

  **Al-Ghazālī:** You see conjunction (*iqtirān*). You see that the burning occurs *with* the touching, not *because* of it. To say the fire is the agent is to claim a necessity that exists only in your mind, not in the observed world. Can you conceive of cotton touching fire and remaining whole?

  **Ibn Rushd:** I can conceive of it as a miracle, yes. But not as a natural possibility. If you remove the burning from the definition of fire, you have removed the fire itself. You are left with a word that signifies nothing.

  **Al-Ghazālī:** I am left with the truth of God's absolute power. If the burning is necessary by the nature of the fire, then God is bound by the fire. He could not, in that moment, preserve the cotton. He would be a prisoner of the natures He created. Is the Creator bound by the creation?

  **Ibn Rushd:** He is not bound, but He is wise. And wisdom implies acting through means. If the fire does not burn by its own nature—if the effect is not tied to the cause by anything more than God's momentary habit (*'āda*)—then there is no middle term in our syllogisms. There is no *burhān* (demonstration).

  **Al-Ghazālī:** Why must there be a middle term in nature, when the Will is immediate?

  **Ibn Rushd:** Because without it, knowledge collapses. If the connection is merely habitual, then it is possible—truly possible, not just miraculous—that tomorrow the fire cools the cotton. If that is so, we cannot *know* the fire will burn. We can only guess based on past custom. But the Qur'an commands us to reflect upon the heavens and the earth as *signs* (*āyāt*) of a deliberate Wisdom. If the rain falls without a cause, if the grain grows without a nature, then the signs are arbitrary. A tyrant acts by whim; a Sage acts through ordered causes. By denying the causes, you deny the Wisdom.

  **Al-Ghazālī:** (He lowers the cotton closer to the heat, the air shimmering.) You confuse the order of wisdom with the necessity of compulsion. I do not deny the order. I deny that the order belongs to the objects rather than the Ordainer. God has created a habit (*'āda*), yes. He usually creates the ash following the touch. But the power resides in Him, not in the cotton. If I say the fire burns, I risk the common man thinking the fire is a partner in agency.

  **Ibn Rushd:** And if I say the fire burns, I risk nothing but the truth of language. We name things by their acts. But consider your own position, Imām. You wish to save God's power. But if God acts without secondary causes, why did He create a universe of distinct natures at all? Why fire and not water? Why cotton and not iron? If the distinction makes no difference to the outcome—if God burns the cotton directly regardless of the fire's presence—then the multiplicity of creation is a deception.

  **Al-Ghazālī:** It is not a deception. It is a theater for the intellect. The distinction exists, but the efficacy is lent. Perhaps... (He pauses, the cotton now inches from the flame.) ...perhaps there are natures. I do not deny that God may have placed powers within things. But I insist that their operation is not *necessary* in itself (*bi-dhātihi*). It is contingent upon His continued will. The fire burns because God wills it to burn *now*, in accordance with His prior habit.

  **Ibn Rushd:** Then we agree that it burns?

  **Al-Ghazālī:** We agree that it burns. We disagree on *why* we are certain. You are certain because you think the fire *must* burn. I am certain because I trust God's habit will not break without a prophet's announcement.

  **Ibn Rushd:** But that trust is not knowledge (*'ilm*). It is prophecy. You have moved physics into the realm of revelation. If the philosopher asks, "What is fire?" you answer, "Whatever God makes it do." That ends inquiry. It makes the study of nature futile. And if the study of nature is futile, then the jurist has no ground to stand on when he argues from design to the Designer.

  **Al-Ghazālī:** (He touches the cotton to the flame. It ignites instantly. He pulls it back, blowing out the ember.) The study of nature is not futile; it is the study of God's habits. But do not mistake the habit for the Master. You fear that if I loosen the bond of cause, knowledge vanishes. I fear that if you tighten the bond of cause, God vanishes.

  **Ibn Rushd:** And I fear that if God is separated from His creation's order, we cannot speak of Him at all. We are left with silence.

  **Al-Ghazālī:** Then let us be silent before the ash, and let the Logic decide what it can bear.

  **Ibn Rushd:** Logic bears the truth of things as they are, not as we wish them to be to protect a theological boundary.

  **Al-Ghazālī:** And theology bears the truth of the Agent, without whom there are no things to be.

  *(They look at the blackened fiber, neither yielding, the smoke drifting between them like a veil.)*
