      *   *Even if both have homework:* Did the treatment assignment influence the likelihood of doing it? If Flipped students are more motivated to do it because the class depends on it, it's a mediator.
      *   *Standard Advice in Causal Inference:* Do not condition on post-treatment variables. Homework completion is usually considered post-assignment (even if pre-class content), because the *assignment to the pedagogical method* influences the *behavior* of doing the homework.
      *   *The "Real" Confounder:* Likely student motivation or prior ability. If these affect both Section Choice (if not randomized) and Homework, *then* Homework is a collider (Treatment <- Motivation -> Homework <- Unobserved?). Or if Motivation -> Section AND Motivation -> Homework.
      *   *Safest bet:* The overall comparison (Intent-to-Treat) is usually less biased than conditioning on compliance (homework), unless homework was measured *before* treatment assignment (which is hard for "pre-class" work specific to the method).

  7.  **Final Polish:** Ensure clear headings. Use the DAG terminology appropriate for a philosophy of science seminar (confounders, mediators, colliders). Emphasize that statistics alone cannot solve this; subject matter knowledge is required.

