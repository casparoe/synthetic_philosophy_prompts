      *   *Core Concept:* The "Kidney Stone Lesson" is about *confounding*, not just *stratification*.
      *   *Application:* Analyze the "Homework" variable. Is it pre-treatment or post-treatment?
      *   *Mediation:* Explain that if Flipped -> Homework -> Grade, controlling for Homework hides the effect.
      *   *Selection/Collider:* Mention that conditioning on compliance (homework) can induce bias.
      *   *Conclusion:* Advise on how to proceed (DAGs, Intent-to-Treat analysis).

  6.  **Refining the Causal Logic (Self-Correction/Verification):**
