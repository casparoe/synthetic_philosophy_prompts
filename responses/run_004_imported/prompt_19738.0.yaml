      *   **The Peircean View (The "Settledness" Approach):**
          *   *Mechanism:* Truth = Necessity. "It will be" means "It must be."
          *   *Handling Contingency:* If the future is open, neither "will" nor "won't" is true. Both are false (or lacking truth value).
          *   *Pros:* Captures the *feeling* of openness perfectly. No "secret fact" about the future.
          *   *Cons:* Violates Law of Excluded Middle (LEM)/Bivalence. "Either there will be or there won't" becomes false. This feels counterintuitive linguistically.

      *   **The Ockhamist View (The "Actual History" Approach):**
          *   *Mechanism:* Truth = Correspondence to the actual future branch.
          *   *Handling Contingency:* One branch is "actual." "It will be" is true if that branch has a battle.
          *   *Pros:* Saves classical logic (Bivalence/LEM). Matches ordinary language usage.
