          *   *The "Work" it does:* It allows us to talk about the future meaningfully without committing to causal determinism. It separates semantic truth from modal fixity.
          *   *The Risk:* It relies on a "thin" actual future. If the actual future is just a logical placeholder, does it exist ontologically? If it exists ontologically, is it deterministic?
