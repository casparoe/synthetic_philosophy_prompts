      *   *Ockhamist View (Ockham, Plantinga, etc.):* Branching time but one "actual" history. Truth is relative to a history. $Fp$ is true if $p$ happens on the *actual* future branch. Bivalence holds. Fatalism is avoided because the truth doesn't *make* it happen (modal status vs. truth value).
      *   *Key Tension:* Ontology of the future vs. Logic of truth.
      *   *User's Specific Worry:* Is the Ockhamist "actual future" circular? Is the Peircean loss of bivalence too high a price?

