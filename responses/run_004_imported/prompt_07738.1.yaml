      *   *The "Universal Instrument" Argument:* Descartes argues reason is a "universal instrument" available for all contingencies. Machines have "particular dispositions."
      *   *Application to LLMs:* An LLM is trained on specific data (past contingencies). It predicts based on patterns. It doesn't possess *universal reason*; it possesses *universal pattern matching*.
