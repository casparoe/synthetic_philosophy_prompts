          *   Descartes' rebuttal: The failures (hallucinations, logic breaks) prove it lacks the *light of reason*. It acts by "disposition of organs" (weights/parameters) tuned for specific tasks (next token prediction). It cannot adapt to *novel* contingencies outside its distribution without retraining or prompting tricks.
