      *   *The Action/Reason Argument:* Machines might do specific things as well as or better than humans (e.g., a clock telling time), but they cannot act in *all* the contingencies of life. They act by "disposition of their organs" (mechanism), not by "knowledge" (reason).
      *   *The Underlying Metaphysics:* Why does Descartes think this? It's not just empirical observation; it's dualism. Humans have an immaterial soul (*res cogitans*). Machines are purely material (*res extensa*). Reason is a property of the soul, not the arrangement of matter.
      *   *The "Even if" Clause:* Descartes anticipates counter-arguments. He admits a machine might look human, make sounds, etc. But he insists the *source* of the action matters.

