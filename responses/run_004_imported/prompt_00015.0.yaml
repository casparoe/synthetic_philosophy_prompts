      *   **Point 2: Approximate Common Knowledge.** Cite Monderer & Samet. If knowledge is "close enough," agreement must be "close enough." This bridges the gap between theory and messy reality.
      *   **Point 3: The Burden of Explanation (Diagnostic Power).** AAT forces disagreeing parties to pinpoint the source of divergence. Is it priors? Is it trust? Is it information hiding? It makes "agreeing to disagree" an active claim requiring justification.
      *   **Point 4: Communication Complexity.** Scott Aaronson's insight. The theorem isn't about infinite recursion; it's about how much information needs to be exchanged to reach consensus. Persistent disagreement implies a refusal to exchange sufficient information.
      *   **Point 5: Epistemic Peerhood.** Define peers. If you claim someone is a peer but disagree, AAT says you're inconsistent. You must either downgrade their peer status or update your belief.
