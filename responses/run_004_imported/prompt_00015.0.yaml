answer: |-
  Robert Aumann's 1976 Agreement Theorem is frequently dismissed by philosophers and social scientists as a mathematical curiosity with little traction in the messy reality of human discourse. The standard critique holds that the theorem's assumptions—specifically **common knowledge** (an infinite recursion of "I know that you know that I know...") and **common priors**—are so stringent that they are never satisfied in the real world. Consequently, critics argue, the theorem is vacuous: if the conditions are impossible, the prohibition on "agreeing to disagree" imposes no actual constraint on human behavior.

  This dismissal, however, misunderstands the function of formal epistemology. Aumann's Agreement Theorem (AAT) should not be viewed as a descriptive law of human psychology, but as a **normative regulative ideal** and a **diagnostic tool**. Even if literal common knowledge is unattainable, AAT yields substantive real-world constraints on persistent disagreement between epistemic peers by shifting the burden of proof, quantifying the cost of rationality, and exposing hidden biases.

  Here is the argument for why AAT remains substantively binding despite its idealizations.

  ### 1. The Physics of Rationality: Idealizations as Forces
  Critics often treat the assumptions of AAT as binary switches: either you have common knowledge, or you don't. This ignores the role of idealizations in rational modeling. In physics, a "frictionless plane" does not exist, yet Newton's laws derived from such models successfully predict the trajectory of real-world objects subject to friction. We do not discard Newton because of friction; we add friction as a perturbation to the ideal model.

  Similarly, AAT describes the "gravity" of rational discourse. In the absence of friction (bias, communication costs, dishonesty), rational agents must converge. In the real world, friction exists, but the gravitational pull remains. If two epistemic peers persist in disagreement, AAT dictates that there *must* be a specific frictional force preventing convergence. The theorem constrains the disagreement by forcing the agents to identify the friction. Are they hiding information? Do they distrust each other's rationality? Are their priors actually divergent? Without AAT, persistent disagreement can be dismissed as "just different opinions." With AAT, persistent disagreement is flagged as a structural failure of information pooling or rationality that requires explanation.

  ### 2. Approximate Common Knowledge and Robustness
  The most technical objection to AAT is the impossibility of infinite recursive knowledge. However, subsequent work by Monderer and Samet (1989) generalized AAT to show that **approximate common knowledge** yields **approximate agreement**.

  If agents share a high degree of confidence (say, 99%) that they know each other's posteriors, their beliefs must be close, even if not identical. This bridges the gap between the mathematical abstraction and human limitation. We rarely have certainty about what others know, but we often have high-probability estimates. AAT implies that as the "depth" of mutual knowledge increases, the permissible distance between beliefs shrinks.

  This imposes a substantive constraint: **Disagreement is costly.** To maintain a significant disagreement with a peer, you must actively maintain a state of *low* mutual knowledge. You must avoid clarifying what you know, or avoid acknowledging what they know. In a transparent environment (like a scientific community or a courtroom), where information is public, the "approximate common knowledge" condition is easily met. In these contexts, AAT is not vacuous; it is binding. If two experts look at the same public data and disagree, AAT suggests at least one is failing to process the commonality of their situation rationally.

  ### 3. The Diagnostic Power: Pinpointing the Failure
  AAT's greatest real-world utility is diagnostic. It acts as a *reductio ad absurdum* against dogmatic persistence. When two self-identified epistemic peers disagree, AAT forces a trilemma. They must admit that one of the following is true:
  1.  **Priors differ:** One of us is starting from an irrational or fundamentally different baseline.
  2.  **Rationality differs:** One of us is failing to update correctly on evidence.
  3.  **Information is not common:** We haven't actually shared what we know.

  In real-world discourse, people often hide behind vague claims of "different perspectives." AAT tightens this vocabulary. If you claim to share a worldview (shared priors) and trust the other's logic (common rationality), you are logically compelled to treat their belief as evidence. To ignore their belief is to violate the constraints of Bayesian updating.

  Therefore, AAT constrains disagreement by making "agreeing to disagree" an active claim that requires justification. You cannot simply rest in disagreement; you must specify *which* assumption of the theorem is being violated. If you cannot specify whether the divergence is due to priors or information flow, your disagreement is epistemically suspect.

  ### 4. Communication Complexity and the "Honest Search"
  Computer scientist Scott Aaronson has reframed AAT in terms of communication complexity. The theorem implies that reaching agreement does not require exchanging all private information, but only enough to align posteriors. If two agents exchange messages about their beliefs and do not converge, they are essentially engaging in an inefficient or dishonest protocol.

  This imposes a constraint on **discourse ethics**. If I claim to be seeking the truth with a peer, I am committed to the communication protocol that leads to agreement. Persistent disagreement after extensive communication suggests bad faith. It implies that one party is treating the conversation not as a pooling of information, but as a debate to be won. AAT thus provides a formal basis for accusing a disagreeing peer of "motivated reasoning." If the math says we should agree given our information exchange, and we don't, then one of us is not updating honestly.

  ### 5. Defining Epistemic Peerhood
  Finally, AAT helps define what it means to be an "epistemic peer." To treat someone as a peer is, effectively, to grant that they satisfy the conditions of AAT relative to you (similar priors, similar rationality).

  If you claim someone is a peer but refuse to update your belief toward theirs upon discovering their disagreement, you are behaving inconsistently. You are effectively saying, "I respect your rationality, but I will ignore the output of your rationality." AAT makes this inconsistency explicit. It constrains the concept of peerhood itself: you cannot simultaneously hold someone in high epistemic regard and completely disregard their contradictory conclusion. You must either downgrade their status (they are not a peer) or update your belief (move toward agreement).

  ### Conclusion
  To dismiss Aumann's Agreement Theorem because "literal common knowledge is impossible" is to commit the nirvana fallacy—rejecting a solution because it isn't perfect. While humans are not Bayesian robots with telepathic links, AAT describes the **direction** in which rational discourse must move.

  It yields substantive constraints by:
  1.  Making persistent disagreement a phenomenon that requires specific explanation (friction), rather than a default state.
  2.  Establishing that approximate transparency requires approximate consensus.
  3.  Forcing disagreeing parties to identify whether their divergence stems from values (priors) or facts (information).
  4.  Exposing bad faith in communication protocols.

  AAT does not guarantee that humans *will* agree. It guarantees that if they do not agree, they cannot claim to be fully rational, fully informed, and fully honest simultaneously. In a world rife with polarization, that is a powerful constraint.
