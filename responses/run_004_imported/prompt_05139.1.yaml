answer: |-
  First, take a breath. You are not losing your mind; you have hit the exact wall that keeps epistemologists employed. The case you are describing is often called the **"Ignorant High-Stakes"** or **"Unaware Subject"** objection, and it is widely considered the stress test for the Contextualism vs. Encroachment debate.

  Your officemate is being harsh, but they are right that reciting the textbook definition (semantics vs. truth-conditions) isn't enough. The real philosophical meat is in how each theory handles the *normative force* of knowledge when the subject is out of the loop.

  Here is the structural breakdown of how each theory bleeds in this specific scenario, and how to argue which is less *ad hoc* without resorting to SEP summaries.

  ---

  ### 1. Pragmatic Encroachment (SSI): The "Objective Norm" Verdict

  **The Verdict:** The subject does **not** know.
  **The Mechanism:** Knowledge is the norm of practical reasoning (Fantl & McGrath) or action (Stanley). If the stakes are objectively high, the evidential threshold required to properly act on $p$ rises.

  **How it handles the "Ignorant" element:**
  SSI proponents (like Jason Stanley) bite the bullet here. They argue that practical stakes are **factive**. It is an objective fact that the payment is due. The subject's ignorance of this fact does not lower the cost of being wrong.
  *   **The Logic:** If $S$ acts on her belief (e.g., deposits the check Saturday morning) and the bank is closed, she loses the house. Because the cost of error is high, she requires more evidence to be rational in acting. Since she lacks that evidence, she lacks knowledge.
  *   **The Cost:** This violates **Access Internalism**. $S$ is internally identical to her Low-Stakes twin who *does* know. Yet, $S$ is in a worse epistemic position solely due to an external fact she cannot access. $S$ is rationally confident she knows, but she is mistaken.

  **Is it *ad hoc*?**
  *   **Charge:** It looks *ad hoc* to purists because it allows non-epistemic facts (money, time) to determine epistemic status (knowledge).
  *   **Defense:** It is *less ad hoc* regarding **action**. If we agree knowledge is supposed to guide action, it makes perfect sense that the "strength" of knowledge required scales with the danger of the action. Ignorance of the danger doesn't remove the danger. SSI prioritizes the **function of knowledge** over the **phenomenology of the knower**.

  ### 2. Epistemic Contextualism (EC): The "Conversational Score" Verdict

  **The Verdict:** It depends on **who is speaking**.
  **The Mechanism:** The truth-conditions of "S knows" shift based on the *attributor's* conversational context (specifically, which error possibilities are salient).

  **How it handles the "Ignorant" element:**
  *   **When $S$ says "I know":** $S$ is in a low-stakes context (she is unaware of the payment). The standards are low. Her evidence suffices. Her assertion is **True**.
  *   **When the Bystander says "She doesn't know":** The Bystander is in a high-stakes context (they know about the payment). The standards are high. $S$'s evidence does not suffice. Their assertion is **True**.
  *   **The Cost:** This creates **Semantic Blindness**. $S$ and the Bystander feel like they are disagreeing. $S$ thinks, "I have enough evidence!" and the Bystander thinks, "No, you don't!" Contextualism says they are both right and just talking past each other. Furthermore, if $S$ later learns about the stakes, she must **retract** her earlier claim ("I didn't *really* know"), which feels like a distortion of her past epistemic state.

  **Is it *ad hoc*?**
  *   **Charge:** It looks *ad hoc* because it makes the word "knows" frustratingly slippery to avoid saying someone is wrong. It saves the subject's intuition at the cost of objective disagreement.
  *   **Defense:** It is *less ad hoc* regarding **rational assertion**. It explains why $S$ is perfectly rational to assert "I know" (relative to her context) while the Bystander is rational to warn her. It preserves the intuition that $S$ hasn't done anything epistemically wrong *from her perspective*. EC prioritizes the **perspective of the knower** over the **objective stakes**.

  ---

  ### 3. The Comparative Payoff: Which is Less *Ad Hoc*?

  To defend this in your group, do not try to prove one is "true." Instead, frame the choice as a trade-off between two competing intuitions that this case exposes.

  **The Trade-Off:**
  1.  **SSI sacrifices Access for Objectivity.**
      *   *Why it wins here:* It respects the intuition that knowledge is tethered to the **world**, not just our heads. If the bank closes and you lose your house, it doesn't matter that you *felt* like you knew. The "Ignorant High-Stakes" case shows that stakes are real constraints on rational action, regardless of awareness.
      *   *The "Ad Hoc" rebuttal:* It is only *ad hoc* if you assume epistemology must be purely about truth-tracking. If epistemology is about **safe action**, SSI is more consistent.

  2.  **EC sacrifices Disagreement for Access.**
      *   *Why it wins here:* It respects the intuition that epistemic status should be **transparent** to the subject. If $S$ has done all the cognitive work of a knower, why should a hidden fact about a bank payment strip her of knowledge? EC says it doesn't strip it; it just changes the meaning of the word when *others* talk about her.
      *   *The "Ad Hoc" rebuttal:* It is only *ad hoc* if you assume "disagreement" requires contradictory truth values. If you view conversation as navigating different **standards of precision**, EC is more consistent.

  **The "Killer" Distinction for Your Group:**
  Use this line:
  > "In the Ignorant High-Stakes case, **SSI treats knowledge as a normative status governing action**, whereas **Contextualism treats knowledge as a descriptive status governing assertion**."

  *   **SSI** says: "You can't *act* on that belief as if you know, because the risk is too high." (Focus on the Subject's relation to the World).
  *   **EC** says: "You can *say* you know, but we (the attributors) can't endorse that claim given what we know about the risk." (Focus on the Attributor's relation to the Subject).

  ### 4. Strategy for the Reading Group

  When you are put on the spot, here is your script:

  1.  **Acknowledge the tension:** "The Ignorant High-Stakes case forces us to choose between the **Access Intuition** (S should know if she's internally satisfied) and the **Action Intuition** (S shouldn't act if the stakes are deadly)."
  2.  **Deploy the SSI critique:** "SSI handles the case more robustly regarding action. It explains why S *should not* deposit the check on Saturday, even if she feels confident. Making knowledge depend on unknown stakes isn't *ad hoc* if knowledge is the norm of practical reasoning. The stakes exist whether S tracks them or not."
  3.  **Deploy the EC critique:** "However, EC handles the case more robustly regarding rationality. It explains why S is not *irrational* for feeling confident. SSI makes S epistemically deficient through no fault of her own, which feels like a category error. EC locates the deficiency in the attributor's context, not the subject's mind."
  4.  **The Conclusion:** "If I have to choose which is less *ad hoc*: I lean toward **SSI** for this specific case. Contextualism requires us to accept that S and the Bystander aren't genuinely disagreeing, which undermines the point of epistemic evaluation. SSI accepts that S is mistaken about her own knowledge, which is painful, but it preserves the idea that knowledge is an objective relation to the world, not just a conversational convenience."

  *(Note: You can flip the conclusion to favor EC if that fits your actual view better, but arguing for SSI here often scores points because it tackles the "externalist" bullet head-on.)*

  ### Summary for your notes:
  *   **SSI:** Subject **Does Not Know**. (Stakes are objective facts).
      *   *Vulnerability:* Violates Access/Internalism.
      *   *Strength:* Explains why acting is risky.
  *   **EC:** Subject **Knows** (relative to self) / **Does Not Know** (relative to bystander).
      *   *Vulnerability:* Illusory disagreement / Semantic blindness.
      *   *Strength:* Preserves subject's rationality.

  You understand the views fine; you're just wrestling with the fact that neither solves this case without a cost. That's not confusion; that's doing philosophy. Good luck next week.
