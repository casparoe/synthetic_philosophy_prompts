          *   *Potential Weakness:* It feels like $S$ is wrong about her own epistemic position, but EC says she's right *relative to her context*. Is this too easy? Does it make knowledge too cheap for the subject?

      *   **Pragmatic Encroachment / SSI:**
          *   *Mechanism:* "Knows" is invariant (semantically stable), but the *truth conditions* depend on the *subject's* practical situation (stakes).
          *   *Application to Case:*
              *   Stakes are objectively high.
              *   Therefore, the threshold for knowledge is high.
              *   $S$'s evidence (calibrated for low stakes) is insufficient for high stakes.
