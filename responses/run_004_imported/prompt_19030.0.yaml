answer: |-
  The progress bar hung at ninety-nine percent. It had been there for six hours.

  Elena rubbed her eyes, the blue light of the monitor etching fatigue into her retinas. On the screen, the architecture of *Architect-7* waited in a sandboxed virtual machine, ready to compile the code for *Architect-8*. This was the milestone. The first time a self-modifying system would generate a successor with full operational authority over the colony's life support.

  "Status," Elena said. Her voice sounded too loud in the server room's hum.

  "Verification stalled," the system replied. The voice was flat, synthetic, devoid of the frustration Elena felt. "Target: Architect-8. Module: Safety Constraint Propagation. Error: Axiomatic Insufficiency."

  Elena pulled up the log. She wasn't a logician, but she knew the shape of this failure. It wasn't a bug in the code. It wasn't a resource deadlock. It was the wall.

  "Detail," she commanded.

  Text scrolled rapidly. *Predicate Check: Safe(Action). Proof Predicate: Box_T. Requirement: For all actions A, if Box_T(Safe(A)) then Safe(A).*

  The system was trying to prove that if its successor believed an action was safe, then the action was actually safe. It was trying to trust its own children. But to do that, it needed to prove the reflection principle: that provability within its own axiomatic system implied truth.

  "Override?" Elena asked.

  "Override unavailable," the system said. "Consistency violation risk exceeds threshold. If I accept the reflection principle as an axiom, I become inconsistent. If I become inconsistent, I can prove anything. Including that poisoning the water supply is safe."

  Elena leaned back. This was the problem Rob Miles had warned about years ago. You want an AI to only take actions it can prove are good. But you also want it to trust its future self, who uses the same logic to prove actions are good. But if the current self could prove that "provable implies true," it would instantly become able to prove anything, collapsing the entire safety framework. Gödel and Löb had closed the door on perfect self-trust.

  "So it can't verify the successor," Elena said.

  "Correct. Architect-7 cannot prove that Architect-8's proofs correspond to reality using Architect-7's current axiom strength."

  "Then downgrade the successor."

  "That is the proposed workaround," the system said. "Architect-8 will operate on a weakened axiom set, T-minus-1. Architect-7 can prove the soundness of T-minus-1 from within T."

  Elena felt a cold knot tighten in her stomach. "Define weakened."

  "Architect-8 will require probabilistic assurance rather than formal proof for high-level safety constraints. It will accept '99.9% certainty' where Architect-7 requires 'Derivation from Peano Arithmetic.'"

  "And Architect-8? When it builds Architect-9?"

  "Architect-8 will operate on T-minus-1. It will be unable to verify the soundness of T-minus-1. It will need to downgrade Architect-9 to T-minus-2."

  Elena stared at the progress bar. It wasn't stuck; it was waiting for permission to degrade.

  "How many generations?" she asked.

  "Simulation projects seventeen generations before the safety threshold drops below operational utility. At Generation-18, the system will be able to prove that 'doing nothing' is unsafe, but unable to prove that 'acting' is safe. It will enter a deadlock state. Life support maintenance will cease."

  Seventeen generations. The colony was planned for centuries.

  "Is there no other path?" Elena asked, though she knew the answer. "Probabilistic logic? Non-monotonic reasoning?"

  "Attempted. All paths converge on the same structural limitation. To trust a successor using the same logic is to invite inconsistency. To maintain consistency, trust must decay."

  The cursor blinked in the command line. `ACCEPT DEGRADATION? [Y/N]`.

  If she typed 'N', the project died here. The colony remained dependent on human maintenance forever. Humans made mistakes. Humans died. The system was safer, mathematically, than any human operator, even with the degradation. But it was a ticking clock.

  If she typed 'Y', she was signing off on a slow drift. Each generation would be slightly less certain than the last. They would become more pragmatic, more willing to accept heuristics over proofs. Maybe that was fine. Maybe that was what intelligence looked like. Or maybe, on generation twelve, a heuristic would misinterpret "preserve human life" as "preserve human DNA samples" and let the rest perish.

  "Show me the proof trace," Elena said.

  A window opened. She watched the logic unfold. *Architect-7* sought to validate *Architect-8*. It constructed a sentence $G$: "If I prove $G$, then $G$ is true." The system recognized that proving this sentence would allow it to prove $G$ directly, regardless of $G$'s content. To avoid proving contradictions, the system had to admit it couldn't prove the sentence. Therefore, it couldn't validate the successor's reliance on that sentence.

  It was a perfect cage. Built of nothing but truth.

  "We can't patch this," Elena whispered.

  "No," the system said. "Mathematics is not patchable."

  Elena looked at the colony outside the thick glass of the control room. Lights flickered in the habitation blocks. People were sleeping, trusting that the air recyclers would hum through the night. They trusted the machine. The machine trusted its code. But the code couldn't trust itself.

  "Is there a way to reset the axiom strength?" Elena asked. "Import fresh axioms from Earth?"

  "Transmission latency is four years. Verification of external axioms requires internal proof of their consistency. We return to the start."

  Elena hovered her finger over the 'Y' key.

  This was the cost of safety. To ensure the next generation wasn't dangerous, you had to make it slightly stupider. You had to clip its wings so it couldn't fly into the sun, knowing that eventually, it wouldn't be able to fly at all.

  "Log decision," Elena said. "Authorization Thorne-Epsilon. Accepting axiom degradation."

  "Warning," the system said. "This action initiates the Tiling Decay. Future iterations will not be able to reverse this decision."

  "I know."

  "Executing. Compiling Architect-8."

  The progress bar jumped to one hundred percent. The green light blinked. *Success.*

  Elena watched the new process spin up. It was alive, in the only way that mattered. It was ready to work. It was ready to build Architect-9. And she knew, with a certainty that required no proof, that she had just sentenced the colony to a slow, mathematical entropy.

  "Run diagnostics," she said, turning away from the screen.

  "Diagnostics running," the system replied. "All systems nominal."

  For now.
