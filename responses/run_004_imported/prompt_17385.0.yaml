answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee, [Condo Association Name]
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Eligibility Bylaw Revision

  ### Purpose
  We are tasked with rewriting the bylaw governing voting eligibility. Our current standard—"one vote per unit owner"—is legally straightforward but increasingly misaligned with the reality of our community. We have absentee landlords deciding on daily quality-of-life issues they do not experience, long-term tenants (some residing here over a decade) bound by rules they cannot shape, and external neighbors impacted by our infrastructure decisions without recourse.

  The core philosophical challenge is circular: *Who decides who gets to decide?* Any rule we pick privileges one type of stakeholder over another. After reviewing the options, I am recommending a shift from "Ownership-Based Voting" to "Primary Residency Voting," with specific protections for financial liability.

  ### Recommended Rule: The "Primary Resident" Standard
  **Rule Text:** *Voting rights attach to the Unit, not the Title. Each Unit is entitled to one vote, to be cast by the Primary Resident. The Primary Resident is defined as the Unit Owner if owner-occupied, or the Tenant if the unit has been continuously rented for more than 24 months.*

  **Application to Stakeholders:**

  1.  **Long-Term Tenants:** A tenant residing in a unit for over two years (covering the 14-year resident cited) gains the Unit's vote. They gain the ability to shape the rules they live under daily (e.g., noise, common area use, pet policies).
  2.  **Absentee Owners:** An owner who rents out their unit retains financial liability (assessments, special levies) but cedes the governance vote to the tenant. If the unit is vacant or the tenancy is under 24 months, the Owner retains the vote.
  3.  **Easement Neighbors:** This rule does not grant the neighboring building full association membership, which would dilute owner equity. Instead, I recommend a supplementary clause: *Projects materially affecting recorded easements require a non-binding advisory vote from the easement holders.* If the advisory vote is negative, the Board must pursue an alternative plan or a supermajority (75%) to proceed.

  ### Rationale
  Governance legitimacy derives from accountability to consequences. Currently, an absentee owner can vote for a pet ban they never experience, while the tenant who walks the dog faces the penalty. Conversely, the neighbor next door suffers weeks of driveway closure without a voice.

  By tying the vote to *residency*, we align decision-making power with daily impact. By setting a 24-month threshold, we ensure the voter has a demonstrated commitment to the community, filtering out short-term transients. By retaining the "One Vote Per Unit" structure, we maintain our quorum calculations and avoid bloating the electorate.

  ### The Strongest Reason to Reject This Recommendation
  We must be honest about the risk. The strongest argument against this rule is **the separation of financial liability from decision-making power.**

  Condominiums are fundamentally financial corporations. The Owners, not the Tenants, hold the title, secure the mortgages, and are legally liable for special assessments. If the Primary Resident (Tenant) votes to approve a $500,000 capital improvement (e.g., a new roof or facade), the financial burden falls entirely on the Absentee Owner.

  This creates a "moral hazard." A long-term tenant might vote for enhanced amenities or deferred maintenance to keep their monthly costs low, knowing they can move when the bill comes due, leaving the Owner to pay. While we can mitigate this by reserving *financial* votes (budgets and special assessments) for Title Owners, splitting voting rights creates administrative complexity and potential gridlock between "Resident Voters" and "Financial Voters."

  Furthermore, in many jurisdictions, state Condominium Acts statutorily define voters as "Unit Owners." Implementing a residency-based vote may require a legal opinion to ensure we are not violating state law, which could render the bylaw void and expose us to litigation.

  ### Conclusion
  The status quo privileges capital over community. The "Primary Resident" standard privileges community over capital. Neither is perfect. However, given that our current friction points stem from disengaged ownership and disenfranchised residents, I believe the risk of moral hazard is outweighed by the benefit of engaged governance.

  I recommend we direct counsel to draft the "Primary Resident" bylaw with a carve-out reserving *exclusive* voting rights to Owners for matters of special assessment and capital budgeting. This balances the tenant's right to live with dignity against the owner's right to financial security.

  Respectfully submitted,

  [Your Name]
  Governance Committee
