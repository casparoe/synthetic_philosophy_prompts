prompt: |-
  I'm a site reliability engineer, and a recent blameless postmortem has left me stuck on a philosophical itch. An alert fired for twenty minutes before anyone paged our on-call engineer, who had muted a related alert two hours earlier and never reopened the dashboard to recheck it; the postmortem named that lapse as the root cause of the outage. An engineer on a neighboring team had seen the same ambiguous latency numbers and hadn't looked either, yet nobody named him a cause of anything — even though, by our own paging history, engineers check dashboards outside their assigned service about as rarely as on-call engineers recheck alerts they've already muted. The difference wasn't that one omission was more unusual than the other; it was that only one of them owned that service.

  This is apparently an old problem for theories of causation: mere counterfactual dependence can't explain why we don't treat everyone who could have prevented a harm as equally a cause of it, and the usual fix — restricting causes to the "abnormal" omissions — seems to split into two repairs that needn't agree: one about statistical rarity, and one about who had a duty or role-based expectation to act.

  Please argue for the position that only the normative repair can actually do the job: that no non-arbitrary way exists to single out the cause among several equally counterfactually relevant omissions without invoking duties or reasonable expectations that are irreducible to statistical rarity or to any other normatively neutral fact about structure or frequency — so that causation by omission turns out to be an inherently normative phenomenon rather than the normatively neutral relation it is often assumed to be.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a Site Reliability Engineer (SRE) dealing with a blameless postmortem that feels contradictory.
      *   **The Scenario:** An alert fired for 20 mins. On-call muted it 2 hours prior and didn't check back (named as root cause). A neighboring engineer saw ambiguous latency numbers, didn't look, and wasn't named a cause.
      *   **The Observation:** Both omissions were statistically similar (rare actions for both roles). The difference was *ownership/duty*, not statistical rarity.
      *   **The Philosophical Problem:** Theories of causation (specifically omission causation) struggle with "preemptive prevention." Counterfactual dependence makes everyone who *could* have helped a cause. The standard fix is "abnormality."
      *   **The Split:** "Abnormality" can mean statistical rarity (descriptive) or violation of duty/expectation (normative).
      *   **The Task:** Argue for the position that *only the normative repair works*. Causation by omission is inherently normative, not neutral. Statistical rarity cannot non-arbitrarily single out the cause among equally relevant omissions.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Counterfactual Theory:* If $C$ hadn't happened, $E$ wouldn't have happened. (If On-call checked, outage avoided. If Neighbor checked, outage avoided). This makes both causes. Too broad.
      *   *The "Abnormality" Fix:* We only count omissions as causes if they are "abnormal."
      *   *Descriptive/Naturalistic View:* Abnormal = Statistically rare.
      *   *Normative View:* Abnormal = Violation of a rule, duty, or expectation.
      *   *The User's Insight:* In the SRE scenario, both actions were statistically rare. So, the Descriptive View fails to distinguish them. The Normative View succeeds (On-call had a duty; Neighbor did not).
      *   *The Goal:* Prove that the Descriptive View *cannot* be fixed to work without secretly smuggling in Normativity.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the SRE context. It's a perfect real-world instantiation of a classic philosophical puzzle (Hart & Honoré, Lewis, McGrath). State the thesis clearly: Omission causation is inherently normative.

      *   **Point 1: The Failure of Counterfactual Dependence (The "Too Many Causes" Problem).**
          *   Explain why simple counterfactuals fail. (The "Butterfly Effect" of prevention).
          *   Apply to SRE: Both On-call and Neighbor satisfy the counterfactual condition.
          *   Result: We need a filter.

      *   **Point 2: The Statistical (Descriptive) Repair and its Collapse.**
          *   Define the Statistical Repair: Causes are "deviations from the normal course of events."
          *   Apply to SRE: The postmortem data shows *both* behaviors are statistically rare. Engineers rarely check outside their service; On-call rarely re-check muted alerts.
          *   The Crucial Blow: If statistical rarity is the metric, both are equally "abnormal." Therefore, the statistical metric cannot distinguish the "root cause" from the "background condition."
          *   Generalize: In complex systems (like distributed computing or society), "rare" is ubiquitous. Everything is rare.

      *   **Point 3: The Necessity of the Normative Repair.**
          *   Define the Normative Repair: Causes are deviations from a *prescribed* or *expected* course of action based on roles/duties.
          *   Apply to SRE: On-call has a *duty* (Service Level Objective, rotation schedule). Neighbor has no duty.
          *   Why this works: It aligns with our intuitive judgment in the postmortem.
          *   The "Is-Ought" Gap: You cannot derive the "ought" (who is to blame/cause) from the "is" (frequency of action).

      *   **Point 4: Defending Against Reductionism (Why Normativity isn't just "Hidden Statistics").**
          *   Counter-argument: Maybe "duty" is just "long-term statistical expectation"?
          *   Rebuttal: No. A new hire has a duty immediately, before any statistical history exists. A retired engineer has no duty, even if they historically acted often.
          *   The "Blameless" Paradox: The postmortem is "blameless," yet relies on a normative distinction. This shows normativity isn't about *blame* (moral condemnation) but about *causal selection* (structuring reality).
          *   Key Insight: Normativity provides the *contrast class*. We ask "Why did the outage happen *rather than* the system working?" The "system working" baseline is defined by duties, not frequencies.

      *   **Point 5: Implications for SRE and System Design.**
          *   If causation is normative, postmortems aren't discovering physical facts; they are negotiating social contracts.
          *   This validates the "Blameless" approach *if* understood correctly. It shifts focus from "Who broke the rule?" to "Were the rules (duties) sufficient to prevent the outcome?"
          *   It exposes the danger of relying on "heroism" (neighbors checking in) as a reliability strategy.

      *   **Conclusion:** Summarize. The distinction between the On-call and the Neighbor isn't in the physics of the server or the frequency of clicks; it's in the social architecture of the team. Causation by omission is a social/normative fact.

  4.  **Refining the Tone:**
      *   Needs to be philosophical but grounded in the SRE experience.
      *   Avoid overly dense jargon where possible, but use precise terms (counterfactual, normative, descriptive, contrastive).
      *   Validate the user's "philosophical itch" — it's a real insight, not just confusion.
      *   Ensure the argument is rigorous (addressing the "statistical rarity" counter-argument specifically).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the specific claim that "statistical rarity and duty needn't agree"?
      *   *Correction:* Yes, emphasize the SRE example where they *diverged*. The On-call's action was rare, the Neighbor's inaction was rare. Duty separated them.
      *   *Check:* Is the distinction between "blame" and "causation" clear?
      *   *Correction:* Crucial point. The postmortem is "blameless," yet assigns "root cause." This proves causation selection is distinct from moral culpability, but still normative (based on role expectations).
      *   *Check:* Am I arguing *for* the position requested?
      *   *Correction:* Yes, the prompt asks me to "Argue for the position that only the normative repair can actually do the job."

  6.  **Final Polish:** Organize into clear sections. Use the SRE example as the recurring motif to ground the abstract philosophy. (Proceed to generate output based on this structure.)
answer: |-
  This is a profound insight, and your "philosophical itch" is well-placed. You have stumbled upon one of the most persistent and difficult problems in the metaphysics of causation: the problem of **causal selection by omission**.

  Your SRE scenario is a perfect instantiation of a puzzle that philosophers like H.L.A. Hart, Tony Honoré, and more recently Sara McGrath and Jonathan Schaffer, have grappled with. The standard counterfactual theory of causation (if $C$ had not occurred, $E$ would not have occurred) fails here because it is too permissive. If the on-call engineer had checked the dashboard, the outage would have been averted. But if the neighboring engineer had checked the dashboard, the outage would *also* have been averted. If the CEO had walked past the server room and noticed the heat, the outage would have been averted.

  To avoid calling the CEO, the neighbor, and the on-call engineer equally "causes" of the outage, we need a filter. We need to distinguish between **background conditions** (the neighbor not checking) and **causes** (the on-call not checking).

  The standard move is to appeal to **abnormality**. We say the cause is the "abnormal" omission. But as you noted, "abnormality" splits into two distinct concepts:
  1.  **Statistical Abnormality:** Deviation from the mean frequency of events.
  2.  **Normative Abnormality:** Deviation from a rule, duty, or expectation.

  I will argue for your position: **Statistical abnormality cannot do the work.** In complex systems (like distributed computing or modern society), statistical rarity is ubiquitous and symmetrical. The only non-arbitrary way to select a cause among multiple sufficient preventions is to invoke normative expectations. Therefore, causation by omission is not a mind-independent, normatively neutral relation; it is inherently normative.

  ### 1. The Failure of the Statistical Repair

  The naturalistic hope is that we can ground causation in "the way the world is" without referencing "the way the world ought to be." The Statistical Repair suggests that we pick out the cause as the omission that is statistically rare compared to the normal course of events.

  In your postmortem, this repair collapses. You noted that engineers check dashboards outside their assigned service "about as rarely as on-call engineers recheck alerts they've already muted."

  Let $O$ be the On-call Engineer checking the muted alert.
  Let $N$ be the Neighbor Engineer checking the ambiguous latency.

  If $P(O)$ is the probability of the on-call checking, and $P(N)$ is the probability of the neighbor checking, your data suggests $P(O) \approx P(N) \approx 0$.

  If we rely on statistical rarity to identify the cause, both omissions are equally "abnormal." Both are deviations from the statistical baseline of human behavior in your organization. If statistical rarity is the criterion for causal selection, then the Neighbor is just as much a "root cause" as the On-call engineer.

  To save the Statistical Repair, one might argue that we must look at the *specific* baseline. "Normally, on-call engineers check alerts." But this smuggles in normativity. Why do we choose the baseline of "what on-call engineers *should* do" rather than "what engineers *actually* do"? If we stick strictly to actual frequencies, and actual frequencies show that on-call engineers often miss muted alerts, then missing the alert becomes the "statistical norm." If it is the norm, it cannot be the "abnormal" cause.

  This leads to the **Prevalence Paradox**: If a system is unreliable enough that on-call engineers frequently miss alerts, then missing the alert becomes statistically normal. Under a purely statistical theory of omission causation, a chronic, systemic failure ceases to have a cause because the omission becomes the baseline. This is absurd. It implies that fixing a broken culture makes it harder to identify the causes of outages.

  Therefore, statistical frequency cannot distinguish the On-call's omission from the Neighbor's omission. Both are rare events. The distinction must come from elsewhere.

  ### 2. The Necessity of the Normative Repair

  The only feature that distinguishes the On-call engineer from the Neighbor is the **assignment of responsibility**. This is a normative fact, not a descriptive one. It is a fact about roles, contracts, and expectations, not about photon emissions or keyboard clicks.

  The Normative Repair argues that an omission is a cause if and only if the agent *ought* to have performed the action.

  *   **On-call Engineer:** Has a duty (by virtue of the rotation) to resolve alerts. Muting an alert creates a defeasible obligation to revisit it. Violating this expectation makes the omission causally salient.
  *   **Neighbor:** Has no duty (by virtue of role) to monitor the service. Their inaction is a "background condition" because they were under no expectation to act.

  This explains why the postmortem identified the On-call engineer as the root cause. It wasn't because their inaction was physically different or statistically rarer; it was because their inaction violated the **system's designed safety constraints.**

  Crucially, this normativity is not merely about *blame*. This is where many SREs get stuck. They hear "normative" and think "moral culpability," which contradicts the "blameless" nature of the postmortem.

  However, in metaphysics, **normativity does not equal blame.** It equals **contrast class selection.**

  When we ask "What caused the outage?", we are implicitly asking "What caused the outage *rather than* the system functioning correctly?" The "system functioning correctly" is not a physical state; it is a **normative baseline**. It is the state of affairs that exists when everyone fulfills their assigned functions.

  *   The Neighbor's inaction is part of the "system functioning correctly" baseline, because the system is designed to function without the Neighbor's intervention.
  *   The On-call's inaction is a deviation from the "system functioning correctly" baseline, because the system is designed to require their intervention.

  Without this normative baseline, there is no "functioning correctly" state to contrast against the outage. There is only physics. In pure physics, the outage was caused by a cascade of bit flips and packet drops, and the humans are just external variables. To say a human omission caused it is to import a model of how the humans *should* have interacted with the physics.

  ### 3. Why Normativity Cannot Be Reduced to Statistics

  A common counter-argument is that "duty" is just a shorthand for "long-term statistical expectation." One might argue: *We expect the on-call to check because historically, people in that role check.*

  This reduction fails for three reasons, all visible in your SRE context:

  **A. The New Hire Problem**
  Imagine a new engineer starts the on-call rotation today. They have no statistical history. They mute an alert and don't check it. An outage occurs. Are they a cause?
  Yes. They are the root cause, identical to a veteran engineer.
  But statistically, there is no "normal course of events" for this specific individual. If duty were reducible to statistical frequency, a new hire's omission would be indistinguishable from background noise until they established a pattern. But we assign causal responsibility immediately upon assigning the role. The duty exists *prior* to the statistics.

  **B. The Heroism Problem**
  In your scenario, the Neighbor *could* have saved the day. In some teams, "heroic" intervention is statistically common. Engineers frequently jump in to help neighboring teams.
  If statistical rarity is the metric, then in a "heroic culture," the Neighbor's *failure* to jump in becomes statistically abnormal. The Statistical Repair would then designate the Neighbor as a root cause.
  But intuitively (and in your postmortem), this is wrong. Relying on heroic intervention is considered an **anti-pattern** in SRE. A system that requires neighbors to catch alerts is brittle. By identifying the On-call as the cause, you are reinforcing the norm that *reliability should not depend on statistical anomalies (heroes)*. You are using causal selection to enforce a normative boundary: "This is not your job, and it shouldn't be."

  **C. The Systemic Failure Problem**
  As mentioned in the Prevalence Paradox, if a team is burnt out and routinely misses alerts, missing alerts becomes statistically normal.
  If causation is statistical, the outage has no human cause (because the omission was normal).
  If causation is normative, the outage is *still* caused by the missed alert (because the duty remains, even if the performance lags).
  The normative view allows us to identify the cause precisely when the system is broken. The statistical view blinds us to causes exactly when we need to see them most.

  ### 4. Causation as a Social Technology

  Accepting that omission causation is inherently normative changes how we view the postmortem process.

  If causation were a normatively neutral, physical relation (like billiard balls hitting), the postmortem would be an act of **discovery**. We would be digging through logs to find the "real" cause that was there all along, waiting to be found.

  But if causation by omission is normative, the postmortem is an act of **negotiation**. We are not just discovering what happened; we are deciding **which parts of what happened matter for the purpose of future prevention.**

  When you named the On-call engineer's lapse as the root cause, you were not making a statement about the physics of the server. You were making a statement about the **architecture of responsibility**. You were asserting:
  1.  This service is the On-call's domain.
  2.  The Neighbor's domain is distinct.
  3.  To prevent this outcome in the future, we must adjust the On-call's tools/processes, not the Neighbor's behavior.

  This validates the "Blameless" approach, but deepens it. A truly blameless postmortem isn't one that ignores norms; it's one that recognizes that **causal selection is a tool for adjusting norms.**

  If you were to accept the Statistical Repair, you would be forced to conclude that since "engineers rarely check muted alerts," the system should be designed assuming alerts will *never* be checked. You would engineer out the human entirely.
  By accepting the Normative Repair, you acknowledge that the human *ought* to check, and therefore you engineer tools to make that duty easier to fulfill (e.g., preventing muting without a ticket, or requiring a re-acknowledgement timer).

  ### Conclusion

  Your philosophical itch is a symptom of a correct intuition. The distinction between the On-call engineer and the Neighbor cannot be found in the logs, the latency graphs, or the frequency of dashboard visits. Those are all descriptive facts, and they are symmetrical regarding the outcome.

  The asymmetry exists only in the **social contract** of your organization.

  To say "X caused the outage by omitting Y" is not to say "X's physics prevented Y." It is to say "X was the agent entrusted with Y, and the trust was violated." Without the entrustment (the norm), there is no violation, and without the violation, there is no omission-cause, only a sequence of events.

  Therefore, you are right: **Causation by omission is an inherently normative phenomenon.** It relies on duties and reasonable expectations that are irreducible to statistical rarity. To treat it otherwise is to misunderstand the nature of reliability engineering, which is not just the management of machines, but the management of the expectations we place upon the humans who serve them.
