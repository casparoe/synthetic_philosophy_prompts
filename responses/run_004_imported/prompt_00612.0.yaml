      *   *What is it?* A solution concept in game theory where players submit programs that can read each other's source code. The programs then output actions.
      *   *Origin:* Moshe Tennenholtz (2004).
      *   *Core Idea:* If I can see your code, I can condition my action on what your code *does* with my code. This allows for cooperation in Prisoner's Dilemma-like scenarios without external enforcement.
      *   *Classic Example:* "Cooperate if and only if you prove the other program cooperates." (Leads to mutual cooperation via fixed-point logic).

  3.  **Translate Theory to Practice (The User's Context):**
