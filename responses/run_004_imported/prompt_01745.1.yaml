answer: |-
  This is a classic debate in decision theory, touching on the tension between *dynamic consistency* and *transitivity*. It's excellent that your group is digging this deep; most discussions stop at "money pumps are bad," but the resolute choice objection (championed philosophically by Edward McClennen and David Gauthier) is the strongest steelman against the standard Dutch Book-style arguments.

  Here is the move-by-move breakdown, followed by my substantive verdict and the missing piece you're looking for.

  ### Move-by-Move Analysis

  **(1) Marcus: The Resolute Choice Objection**
  *   **The Claim:** A money pump only works on a *myopic* agent who evaluates each trade in isolation. A *resolute* agent forms a plan at $t=0$ to maximize utility over the whole sequence. Knowing the cycle leads to a loss, the resolute agent accepts Trade 1 ($C \to B$) but refuses Trade 2 ($B \to A$), breaking the cycle.
  *   **Who has the better of it:** **Marcus.**
  *   **Why:** Technically, he is correct. The standard sequential money pump *does* fail against a resolute chooser. If rationality is defined as the ability to execute a optimal plan over time despite shifting local incentives, then resolute choice is a valid defense. McClennen's *Rationality and Dynamic Choice* (1990) makes this case rigorously. Marcus correctly identifies that the money pump argument assumes *sophisticated* or *myopic* choice, not *resolute* choice.

  **(2) Elena: The Preference-Choice Severance**
  *   **The Claim:** To refuse Trade 2, the agent must choose $B$ when $A$ is available, despite locally preferring $A$ to $B$. This severs the link between preference and choice. If you can override preferences whenever they are costly, "preference" no longer predicts behavior, and the concept becomes vacuous.
  *   **Who has the better of it:** **Elena.**
  *   **Why:** She hits the definitional nerve. In standard decision theory, preferences are *revealed* by choices. If an agent says "$A \succ B$" but chooses $B$ because of a prior plan, in what sense do they actually prefer $A$? Marcus is effectively arguing that the agent has *two* preference orderings: a local one (cyclic) and a global one (transitive over plans). If the global one dictates action, *that* is the agent's true preference ordering. Elena is right that Marcus is smuggling in a higher-order transitive preference to save the lower-order cyclic one.

  **(3) Marcus: The Toxin Puzzle Analogy**
  *   **The Claim:** Resoluteness is an asset, proven by Kavka's Toxin Puzzle. The ability to intend to do something you won't want to do later (drink the toxin) allows you to secure rewards (the million dollars) that a "rational" (sophisticated) agent cannot get.
  *   **Who has the better of it:** **Elena (via Marcus's overreach).**
  *   **Why:** Marcus weakens his position here. The Toxin Puzzle relies on a specific causal structure: the *intention* causes the payout, not the *action*. The Money Pump relies on the *action* causing the loss. In the Toxin case, resoluteness creates value (the million). In the Money Pump case, resoluteness merely prevents destruction; it doesn't create value. Furthermore, the Toxin Puzzle is widely considered a paradox precisely because it challenges standard causal decision theory; using one controversy to settle another is shaky ground. Many rationalists argue the Toxin Puzzle shows that *intention* is the primitive, not preference, but that doesn't help Marcus defend cyclic *preferences*.

  **(4) Elena: The Ex Ante / Grand Offer Objection**
  *   **The Claim:** Resoluteness only works in the sequential setup. If a "Grand Offer" is made at the start ("I will execute the whole cycle of trades for you"), a resolute agent must refuse it. But why? Because they anticipate the loss. This means their *ex ante* preference ranks "Stay at C" over "Cycle and lose money." This *ex ante* ranking is transitive. The cyclic preferences only exist *in media res*.
  *   **Who has the better of it:** **Elena.**
  *   **Why:** This is the strongest counter-argument in the literature (recently formalized by Johan Gustafsson in *Money Pumps*, 2022). If you are resolute, you are essentially admitting that the *sequence* of choices is worse than the *status quo*. If you prefer $C$ to the cycle ($C \to B \to A \to C - \text{fees}$), you are treating the cycle as inferior. But if your preferences were truly cyclic over the outcomes, you should welcome the opportunity to trade up ($C \to B$, $B \to A$, $A \to C$). The fact that you refuse the cycle proves you have a stable, transitive preference for "Money + Outcome" over "Outcome - Money." The cyclic preference is revealed to be an illusion of the local frame.

  ### Substantive Verdict

  **Does resolute choice rescue cyclic preferences?**
  **No.** Elena's rejoinder holds up.

  Marcus is correct that a resolute agent won't lose money in a *sequential* pump. However, he is incorrect that this vindicates cyclic preferences as rational. What resolute choice actually demonstrates is that the agent possesses a **meta-preference** for dynamic consistency that overrides their local cyclic preferences.

  If you have to override your local preferences to avoid ruin, those local preferences are not guiding your rational action; the meta-preference is. And that meta-preference *is* transitive (it ranks "No Loss" > "Cyclic Trading"). Therefore, the *effective* preference structure of a rational agent must be transitive. Resolute choice doesn't make cyclic preferences rational; it makes them irrelevant to the final decision.

  Furthermore, Elena's "Grand Offer" point is decisive. If an agent truly held cyclic preferences as their normative guide, they should accept a bundled offer to execute the cycle (since each step is an "improvement"). The fact that a resolute agent rejects the bundle proves that, from the perspective that matters (the ex ante perspective), the preferences are not cyclic.

  ### The Missing Piece

  Marcus and Elena are talking past each other on the definition of **"Preference."**

  *   **Marcus** is treating preferences as **local tastes** (how I feel about A vs B right now).
  *   **Elena** is treating preferences as **global guides to action** (what I choose when all consequences are accounted for).

  The missing piece is the distinction between **Preference** and **Urge**.
  Cyclic "preferences" behave like urges: *Right now, I want A more than B.* But rational agency requires integrating these urges over time. If integrating them requires suppressing the local urge to avoid a sure loss, then the local urge was never a true "preference" in the decision-theoretic sense. It was a framing error.

  The deeper theoretical point (which fits your LessWrong background) is **Dynamic Consistency**. A rational agent's plan at $t=0$ should be the same plan they execute at $t=1$.
  *   **Sophisticated agents** (who anticipate their future selves) avoid the pump by refusing Trade 1.
  *   **Resolute agents** avoid the pump by forcing Trade 2 to align with Trade 1.
  *   **Myopic agents** get pumped.

  Both Sophisticated and Resolute agents avoid the loss, but they do so by acknowledging that the *sequence* has a value different from the sum of the parts. In doing so, they implicitly impose a transitive ordering on the *sequences*, even if the *outcomes* seem cyclic locally. Since rationality is about choosing sequences of action that maximize utility, the transitivity of the sequence-ranking is what matters. The local cyclic ranking is exposed as incoherent.

  ### Credence

  You asked for a number on the likelihood that resolute choice *really rescues cyclic preferences* (as opposed to merely relocating the problem).

  **Credence: 15%**

  **Reasoning:** I assign a non-zero probability because there are niche contexts (e.g., specific game-theoretic commitments or Newcomb-like problems) where "resoluteness" functions as a genuine strategic advantage that looks like preference override (as Marcus argued with the Toxin). In those specific domains, one could argue that "being the kind of agent who has cyclic local preferences but resolute global control" is a viable strategy.

  However, in the context of standard decision theory and expected utility axioms, the consensus (and my judgment) is that resolute choice merely shifts the locus of transitivity from the outcomes to the policies. Since the policies must be transitive to avoid exploitation (as per Elena's Ex Ante argument), the cyclic preferences are not "rescued"; they are overruled. The 85% weight is on the view that rational preferences *must* be transitive, and resolute choice is just the mechanism by which an agent enforces that transitivity against their own local inconsistencies.
