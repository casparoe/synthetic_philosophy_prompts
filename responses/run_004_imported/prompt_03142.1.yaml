prompt: |-
  The following passage is from Chapter XV ("Of the Five Modes") of Sextus Empiricus's Outlines of Pyrrhonism, Book I, in R. G. Bury's translation. It sets out the five modes the Pyrrhonists used to force suspension of judgment on any dogmatic claim; three of them -- the modes of infinite regress, hypothesis, and circular reasoning -- are usually treated as the ancient ancestors of the modern infinitist, foundationalist, and coherentist responses to the regress problem.

  "The later Sceptics hand down Five Modes leading to suspension, namely these: the first based on discrepancy, the second on regress ad infinitum, the third on relativity, the fourth on hypothesis, the fifth on circular reasoning. That based on discrepancy leads us to find that with regard to the object presented there has arisen both amongst ordinary people and amongst the philosophers an interminable conflict because of which we are unable either to choose a thing or reject it, and so fall back on suspension. The Mode based upon regress ad infinitum is that whereby we assert that the thing adduced as a proof of the matter proposed needs a further proof, and this again another, and so on ad infinitum, so that the consequence is suspension, as we possess no starting point for our argument. The Mode based upon relativity, as we have already said, is that whereby the object has such or such an appearance in relation to the subject judging and to the concomitant percepts, but as to its real nature we suspend judgment. We have the Mode based on hypothesis when the Dogmatists, being forced to recede ad infinitum, take as their starting-point something which they do not establish by argument but claim to assume as granted simply and without demonstration. The Mode of circular reasoning is the form used when the proof itself which ought to establish the matter of inquiry requires confirmation derived from that matter; in this case, being unable to assume either in order to establish the other, we suspend judgment about both.

  That every matter of inquiry admits of being brought under these Modes we shall show briefly in this way. The matter proposed is either a sense object or a thought object, but whichever it is, it is an object of controversy; for some say that only sensibles are true, others only intelligibles, others that some sensible and some intelligible objects are true. Will they then assert that the controversy can or cannot be decided? If they say it cannot, we have it granted that we must suspend judgment, for concerning matters of dispute which admit of no decision it is impossible to make an assertion. But if they say it can be decided, we ask by what is it to be decided. For example, in the case of the sense object (for we shall base our argument on it first), is it to be decided by a sense object or a thought object? For if they say a sense object, since we are inquiring about sensibles that object itself also will require another to confirm it; and if that too is to be a sense object, it likewise will require another for its confirmation, and so on ad infinitum. And if the sense object shall have to be decided by a thought object, then, since thought objects also are controverted, this being an object of thought will need examination and confirmation. Whence then will it gain confirmation? If from an intelligible object, it will suffer a similar regress ad infinitum; and if from a sensible object, since an intelligible was adduced to establish the sensible and a sensible to establish the intelligible, the Mode of circular reasoning is brought in.

  If, however, our disputant, by way of escape from this conclusion, should claim to assume as granted and without demonstration some postulate for the demonstration of the next steps of his argument, then the Mode of Hypothesis will be brought in, which allows no escape. For if the author of the hypothesis is worthy of credence, we shall be no less worthy of credence every time that we make the opposite hypothesis. Moreover, if the author of the hypothesis assumes what is true he causes it to be suspected by assuming it by hypothesis rather than after proof; while if it is false, the foundation of his argument will be rotten. Further, if hypothesis conduces at all to proof, let the subject of inquiry itself be assumed and not some other thing which is merely a means to establish the actual subject of the argument; but if it is absurd to assume the subject of inquiry, it will also be absurd to assume that upon which it depends."

  I can follow the broad outline, but two things elude me. First, the paragraph beginning "That every matter of inquiry admits of being brought under these Modes" is doing fairly compressed dialectical work to show that any attempted justification of a "sense object" or a "thought object" must collapse into regress, circularity, or hypothesis -- could you spell out that argument's logical steps explicitly? Second, in the final paragraph, Sextus's objection to the Mode of Hypothesis seems to treat any stopping point as nothing but an arbitrary, unproven assumption. Does that objection actually engage with what a modern foundationalist means by a properly basic or self-justifying belief, or does it only succeed against a weaker, question-begging version of foundationalism?
