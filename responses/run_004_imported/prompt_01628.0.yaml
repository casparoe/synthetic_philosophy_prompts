answer: |-
  This is a compelling philosophical intuition, and you are right to identify the counterfactual analysis as the wedge that opens the door for omissions. The skepticism you encounter in contemporary metaphysics often stems from a clash between two distinct conceptions of causation: **causation as production** (physical process, energy transfer) versus **causation as dependence** (counterfactual, difference-making).

  To construct a sophisticated argument for causation by omission without retreating to "positive surrogates" (e.g., claiming the cause was actually the lifeguard's *brain state* rather than his *failure to act*), we must challenge the ontological biases inherent in the skeptical position.

  Here is a structured argument defending causation by omission, focusing on the asymmetry in the skeptic's treatment of counterfactuals and the metaphysical assumptions driving it.

  ---

  ### The Argument from Counterfactual Parity and Ontological Neutrality

  #### 1. The Counterfactual Parity Premise
  The standard Lewisian analysis of causation posits that $c$ causes $e$ if and only if there is a chain of counterfactual dependence linking them. That is, if $c$ had not occurred, $e$ would not have occurred.

  As you noted, this analysis is ontologically neutral regarding the *polarity* of the relata.
  *   **Positive Case:** The striking of the match ($c$) caused the fire ($e$). If the match had not been struck, the fire would not have occurred.
  *   **Omissive Case:** The lifeguard's failure to scan ($c$) caused the drowning ($e$). If the failure had not occurred (i.e., if he had scanned), the drowning would not have occurred.

  In both cases, the truth conditions for the counterfactuals are satisfied by the same modal facts about the world. The skeptic accepts the first inference but rejects the second. To do so consistently, they must argue that counterfactual dependence is *necessary* but not *sufficient* for causation, requiring an additional ontological condition that omissions fail to meet.

  #### 2. Identifying the Skeptic's Hidden Assumption: The Production Bias
  The skeptic's resistance usually rests on a **Process Theory of Causation** (associated with philosophers like Wesley Salmon or Phil Dowe). This view holds that for $c$ to cause $e$, there must be a continuous physical process connecting them, typically involving the transfer of a conserved quantity (energy, momentum, charge).

  *   **The Assumption:** Causation is fundamentally *production*. Something must "push" or "generate" the effect.
  *   **The Problem for Omissions:** An absence cannot transfer energy. "Nothing" cannot push. Therefore, omissions cannot be causes.

  **The Counter-Argument:** This assumption is undefended in the context of general causation. It privileges a specific *kind* of causal interaction (mechanical/physical) over the broader logical structure of causal explanation.
  *   **Inhibitory Causation:** In neuroscience and engineering, "negative causation" is standard. An inhibitory neuron prevents a signal; a safety valve prevents an explosion. If we remove the inhibitor (an omission of inhibition), the signal fires. To claim the *cause* of the signal was only the excitatory neuron, and not the *absence* of the inhibitory one, is to describe the physics accurately but the causation incompletely.
  *   **Metaphysical Claim:** If we define causation strictly as energy transfer, we exclude vast swathes of scientific and everyday causal reasoning (e.g., "lack of oxygen caused death"). Oxygen doesn't "push" life into you; its presence allows metabolic processes to continue. Its absence stops them. If the skeptic says the cause of death was "cellular asphyxiation" (a positive process), they are merely redescribing the omission of oxygen. The *reason* cellular asphyxiation occurred was the omission.

  #### 3. The Ontology of Absences: Rejecting the "Nothingness" Objection
  Skeptics often argue that omissions are not "real" because they refer to nothing. They argue that while "the match striking" refers to an event, "the lifeguard not scanning" refers to no event at all.

  **The Counter-Argument:** This relies on a biased ontology of **Positive Particulars**. It assumes that only positive, localized spatiotemporal chunks of matter/energy count as existents.
  *   **Truthmakers:** We can treat omissions as **facts** rather than **events**. The fact *that the lifeguard did not scan* is a true proposition about the world. It has a truthmaker (the total state of the world at that time lacks a scanning event).
  *   **Real Features:** Absences are real features of the world. A hole in a donut is a real topological feature, even if it is defined by the absence of dough. Silence is a real acoustic state, defined by the absence of sound waves above a threshold.
  *   **The Asymmetry Critique:** Why is the presence of water a "positive fact" capable of causing growth, but the absence of water an "ontological ghost" incapable of causing death? Both are states of the soil. The skeptic assumes positivity is metaphysically privileged without explaining *why* causation should track positivity rather than **difference-making**.

  #### 4. Distinguishing Causal Relation from Causal Selection (Solving Proliferation)
  The strongest argument against omissions is the **Proliferation Problem**. If the lifeguard's omission caused the death, didn't the Queen of England's omission to save the swimmer also cause the death? After all, if she had jumped in, he would have lived. If we accept all omissions as causes, causation becomes trivial.

  Skeptics use this to say: "Since we can't accept the Queen as a cause, we must reject omissions entirely."

  **The Counter-Argument:** This conflates **Causal Relation** (metaphysics) with **Causal Selection** (pragmatics).
  *   **Metaphysical Claim:** Both the lifeguard and the Queen stand in the same *counterfactual dependence relation* to the death. Metaphysically, both are causes.
  *   **Pragmatic Claim:** We *select* the lifeguard as *the* cause for explanation because of norms, expectations, and duty.
  *   **The Skeptic's Error:** The skeptic argues that because causal *selection* is context-sensitive, causal *relation* must be objective and positive. But positive causes are also subject to selection. (e.g., We say the "spark" caused the fire, not the "presence of oxygen," even though both are necessary positive conditions).
  *   **Conclusion:** The proliferation problem shows that we need a theory of **causal explanation**, not that we need to eliminate omissions from our **causal ontology**. We can accept that omissions are genuine causes (metaphysically) while acknowledging that not all causes are explanatory relevant (pragmatically).

  #### 5. The "Undefended Commitment" of the Skeptic
  To summarize the critique of the skeptical position, you can argue that their view rests on three undefended commitments:

  1.  **The Positivity Bias:** The assumption that existence is inherently positive. (Why can't the world consist of facts that are negative?)
  2.  **The Production Fallacy:** The assumption that causation must involve physical generation rather than counterfactual dependence. (Why is dependence insufficient?)
  3.  **The Conflation of Selection and Relation:** The assumption that because we distinguish between "the cause" and "background conditions," only the former is metaphysically robust. (This ignores that we do the same for positive events).

  ### Conclusion: A Defense of Omissive Causation
  If we accept that causation is fundamentally about **dependence**—about how the course of events hinges on specific factors—then omissions must be admitted as genuine causes. The world is not just a collection of colliding billiard balls; it is a network of conditions where the *absence* of a condition is just as determinative as its *presence*.

  To deny this is to prioritize a specific metaphysical picture (causation as physical pushing) over the logical structure of how events actually depend on one another. The lifeguard's failure is not a "surrogate" for his inattention; the failure *is* the causal factor, identified via the counterfactual truth that the world would have been different had that failure not obtained. To deny this is to let an outdated ontology dictate the limits of causal reality.

  ---

  ### Suggested Reading for Your Course
  If you want to ground this in the literature, look into the work of **Jonathan Schaffer**. He is perhaps the most prominent contemporary defender of causation by omission.
  *   Specifically, look for his paper *"Causation by Disconnection"* or his work on the contrastive nature of causation.
  *   Also, **Helen Beebee** argues the skeptical side (that omissions are not causes but "causal explanations"), so reading her will help you steelman the opposition before dismantling it using the arguments above.
