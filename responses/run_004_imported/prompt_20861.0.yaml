answer: |-
  Good evening. For those who don't know me, I make my living writing about things that break. I write about replication crises in psychology and the fights over how to regulate machine learning. Essentially, I spend my days asking: "Does this theory actually hold up when it touches the real world?"

  So, when Priya and Marcus asked me to give this toast, and specifically requested I anchor it in Bertrand Russell's *Marriage and Morals*, I felt a familiar professional anxiety. It is a risky text to build a wedding on. It is brilliant, it is controversial, and in Russell's own hands, it famously crashed.

  For the historians in the room, you know the argument well. For everyone else, the short version is this: Russell argued that the jealousy we often treat as a brute instinct is actually inflated by history. It's propped up by property law, by anxieties about paternity, and by inherited religious guilt. He believed that if we stripped away those accretions, marriage could be something purer: a durable, honest partnership, organized above all around the welfare of children and the intellectual companionship of adults.

  It is a beautiful theory. And, as I know from my day job, beautiful theories often meet messy data.

  Russell's own life was that messy data. His second marriage, to Dora, began as a good-faith experiment in the very openness his philosophy recommended. It ended in pain. Russell found he could not extend to Dora's relationship with the journalist Griffin Barry the equanimity he had demanded of her. He preached rational detachment and practiced human jealousy. He could not replicate his own results.

  Priya and Marcus know this. They are historians; they do not believe in hagiography. They did not choose this text because they intend to replicate Russell's lifestyle. They are not testing the boundaries of non-monogamy. They are having a conventional marriage. But they chose this book because they respect Russell's *failure* as much as his theory.

  They chose it because Russell's struggle highlights the one thing that actually matters: the work.

  Russell assumed that if you identified the social constructs of jealousy, they would vanish. Priya and Marcus know better. They know that even without property law or religious guilt, love is still vulnerable. They know that jealousy isn't just a social construct; sometimes it's just a feeling you have to manage. They know that "honest partnership" doesn't mean you never feel insecure; it means you don't lie about it.

  In a way, their commitment is more Russellian than Russell's own. Russell wanted to transcend human nature through reason. Priya and Marcus are content to tend to human nature through care. They are building a marriage that acknowledges the friction. They are choosing each other, exclusively and deliberately, not because it is easy, but because they believe in the value of the structure itself.

  They are building a home where honesty is the default, not because they have nothing to hide, but because they trust each other with the truth. They are committing to a partnership durable enough to survive the inevitable moments where reason fails and instinct takes over. They are committing to raising a family—whenever that chapter begins—in an environment where questions are welcomed and anxieties are met with patience rather than possession.

  To the family and friends here who might be wondering why a couple having a traditional wedding is toasting a book about free love: The lesson Priya and Marcus are taking from *Marriage and Morals* is not about who you sleep with. It is about how you tell the truth. It is about recognizing that marriage is not a cage, but a container strong enough to hold two complex, changing human beings.

  Russell wrote that "the good life is one inspired by love and guided by knowledge." Priya and Marcus have the knowledge. They know the history, they know the pitfalls, and they know the statistics. Tonight, they are promising us that they will let the love do the inspiring.

  They are not trying to be Bertrand Russell. They are trying to be Priya and Marcus. And if the durability of their friendship and the clarity of their love are any indication, they are going to succeed where the philosopher stumbled. Not by avoiding the hard parts, but by facing them together.

  Please raise your glasses. To Priya and Marcus: May your partnership be durable, your honesty be kind, and your love be guided by the wisdom of history, but defined by the promise of your future.

  To Priya and Marcus.
