prompt: |-
  okay so I had this whole argument with my friend Sam last night about Parfit's hitchhiker case -- you're dying in the desert, a driver shows up who can somehow tell whether you'll actually pay him once you're safe in town (theres no way to force you to pay later, its totally unenforceable), and he'll only give you a ride if he's confident you will. Sam's take: once you're literally standing in town with the cash in hand, paying him does nothing for you anymore, so a rational person just doesn't pay, and any theory saying otherwise is quietly redefining what "rational" means. I pushed back that there's a real difference between whether the single act of paying is rational and whether the disposition/policy that produced it is rational, and that Parfit's whole point was that it can be rational to turn yourself into someone who'll do the "irrational" thing later. We never actually settled it. Write an essay that works through this properly -- lay out the strongest version of Sam's act-by-act view, then the disposition/policy view (bring in Gauthier's constrained maximization or McClennen's resolute choice if it's useful), and then actually pick a side, no "both have a point" cop-out. Something like "the hitchhiker should pay, full stop" or "no, disposition-talk is a dodge, Sam's right" both count as real verdicts -- just defend whichever one you land on.
