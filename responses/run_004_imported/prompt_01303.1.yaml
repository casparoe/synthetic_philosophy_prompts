      *   *Better phrasing:* OT is the *gatekeeper*; ICT is the *engine*. If the gate is closed (OT false), the engine doesn't matter. But once the gate is open, the engine determines the speed and direction. In the context of *risk assessment*, ICT is more informative.
      *   *Addressing the "Narrowing":* If we accept Armstrong's narrowing (buildable minds), OT becomes less about "logical space" and more about "architectural independence." This makes it an empirical claim about ML. This strengthens OT's relevance but makes it more falsifiable. ICT's narrowing to "power-seeking" makes it more robust.
