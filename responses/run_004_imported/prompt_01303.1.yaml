      *   *Section 4: The Adjudication (The Core).*
          *   Address the "Load-Bearing" question.
          *   Acknowledge the narrowing (Armstrong, power-seeking).
          *   *Verdict:* OT is the *necessary condition*, ICT is the *sufficient condition* for the specific *existential* nature of the risk.
          *   *Critique of the User's Suspicion:* Is OT just a weak modal claim? Yes, in isolation. But its rhetorical job is to kill the "Moral Improvement" hypothesis.
          *   *Is ICT doing all the work on danger?* Yes, ICT explains the *harm*. OT explains the *misalignment*.
