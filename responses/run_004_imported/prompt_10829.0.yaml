answer: |-
  Good morning. For twenty years, Dr. Ferris has stood at the front of the only philosophy elective this school offers. And by a small tradition, a student from her final class is asked to say what she meant to us.

  Usually, this is the part of the ceremony where we thank a teacher for preparing us. We thank them for giving us the tools to build our futures, for helping us find our purpose, for getting us ready for the "real world."

  But if I said those things today, Dr. Ferris would probably fail me.

  For two decades, she has taught us a radical idea from the philosopher Moritz Schlick. He argued that we spend most of our lives trapped in "purpose." We do homework to get grades, grades to get into college, college to get a job, a job to make money. We treat the present moment only as a stepping stone to the next one. We are always preparing to live, but never actually living.

  Schlick believed that meaning isn't found in that chain of purposes. It is found in play. Not just childhood games, but any activity done for its own sake. Art is play. Conversation is play. And, as Dr. Ferris showed us, thinking is play.

  She never taught philosophy to help us win arguments or get into law school. She taught it because she loved the sound of a question hanging in the air. She taught us that the value of a discussion isn't the conclusion we reach, but the curiosity we feel while we're in the middle of it. She showed us that a life well-lived isn't a ladder to be climbed, but a song to be sung.

  To the parents and faculty here: I know you want us to succeed. Dr. Ferris wants that too. But she taught us that success isn't a destination we arrive at when we're done working. Success is the capacity to find joy in the work itself. It is the ability to look at the world not as a problem to be solved, but as a mystery to be enjoyed.

  Dr. Ferris, you are retiring this week. In the language of your favorite essay, you are entering the ultimate phase of life: a time dedicated not to obligation, but to play. You are free to do things simply because they delight you.

  And to my classmates: As we leave here, we will be pressured to turn our lives into resumes. We will be asked what we are going to do next, and what it is for. When that happens, I hope we remember this room. I hope we remember that while we must work to survive, we live for the moments that have no use other than being lived.

  Thank you, Dr. Ferris, for not preparing us for the future, but for teaching us how to inhabit the present. Thank you for showing us that the meaning of life is not something you find at the end of the road, but something you bring to the walking.

  Enjoy your play. We will try to enjoy ours.
