      *   *Reading B: Motivated Reasoning (The Desperate Moralist).* The "Dualism" creates a crisis. If virtue and happiness don't align, morality is irrational. He *needs* God/Afterlife. The SPR is a secularized way to look for God without the Church. He kept hoping despite lack of proof. This looks like cowardice (as the journalist in the novel suggests).

