answer: |-
  The historical Henry Sidgwick stands at one of the most precarious junctures in modern intellectual history: the point where the Enlightenment's promise of a rational morality collided with the scientific dismantling of the religious framework that had traditionally secured it. To answer your question directly: Sidgwick's involvement with the Society for Psychical Research (SPR) was **not** a natural, disinterested extension of his empirical temperament. It was, rather, a project born of **real tension**, driven by a profound philosophical necessity that his own epistemic standards made almost impossible to satisfy.

  However, while the journalist in your novel is correct about the *motive*, he is incorrect about the *moral character* of that motive. It was not intellectual cowardice; it was intellectual desperation. Sidgwick did not go to the séance room to hide from the truth, but because his ethical system had rendered the truth unbearable without further evidence. He was attempting to save Rational Morality from suicide, using the only tools he had left.

  To understand why this constitutes tension rather than consistency, we must look at the architecture of his ethics and the specific void the SPR was meant to fill.

  ### The Ethical Wound
  In *The Methods of Ethics* (1874), Sidgwick achieved what many consider the pinnacle of utilitarian analysis, only to discover a fatal crack in its foundation. He identified the "dualism of practical reason." He could demonstrate that it was rational to pursue one's own happiness (Rational Egoism) and rational to pursue the general happiness (Utilitarianism). But he could not demonstrate that these two paths were the same. In a godless universe, it is often more rational to be selfish than selfless.

  For Sidgwick, morality could only be fully "rational" if virtue and happiness ultimately coincided. In the Christian tradition, God and the Afterlife guaranteed this coincidence. But Sidgwick, having resigned his Trinity fellowship in 1869, could not subscribe to the Thirty-Nine Articles. He had rejected the dogma. This left him with a catastrophic gap: Morality demanded a moral universe, but Reason could not prove one existed.

  ### The Consistency Defense
  Defenders of Sidgwick's consistency argue that his psychical research was simply the application of his empirical rigor to a new set of data. They point out that Sidgwick remained a skeptic throughout his life. He never claimed the SPR had proven the existence of spirits or God. In his presidential addresses and private correspondence, he frequently admitted that the evidence for telepathy or survival was inconclusive, often falling short of scientific proof.

  From this viewpoint, Sidgwick is the model of the open-minded empiricist: he refused to let the materialist dogmas of his age (which said the supernatural was impossible) dictate his inquiry any more than he let the religious dogmas of his youth (which said it was certain) dictate his assent. He was simply following the evidence wherever it led, even into the darkened rooms of mediums. If the evidence had been there, he would have accepted it; since it wasn't, he didn't. This looks like consistency.

  ### The Case for Tension
  However, this defense sanitizes the psychological and philosophical urgency that drove Sidgwick. A "natural extension" of his temperament would imply that the question of psychical phenomena was just another scientific puzzle, like chemistry or biology. It was not. For Sidgwick, it was the *only* puzzle that mattered.

  The tension arises because Sidgwick allowed an ethical *need* to dictate a scientific *agenda*. In a letter to his colleague F.W.H. Myers (a spiritualist and fellow SPR founder), Sidgwick was candid: he stated that if he could be convinced of a future life, it would fundamentally alter his ethical outlook. He was not investigating the supernatural merely to know if it was true; he was investigating it to see if it could rescue morality from irrationality.

  This is the definition of motivated reasoning. A purely consistent empiricist investigates hypotheses based on their prior probability and available data. Sidgwick investigated them based on their *moral utility*. He was looking for a specific key to fit a specific lock he had constructed in *The Methods of Ethics*.

  The tension is palpable in the results. Sidgwick spent decades on this work. If it were merely a disinterested inquiry, the consistent lack of conclusive proof should have led him to abandon the project as a dead end. Instead, he persisted. He clung to "suggestive" evidence—cases of veridical hallucinations or spontaneous telepathy—that he would likely have dismissed in any other context. He was willing to lower the threshold of "proof" for the afterlife because the cost of disproof was the rationality of morality itself.

  This does not make him a fraud. It makes him a man caught in a trap of his own making. He had built an ethical system so rigorous that it required a theological guarantee, but he had adopted an epistemology so rigorous that it forbade him from accepting that guarantee without empirical proof. The SPR was the bridge between these two incompatible demands.

  ### The Charge of Cowardice
  This brings us to your journalist's accusation: that this search was a form of "intellectual cowardice."

  The journalist is right that Sidgwick was looking in the séance room for what his arguments could not supply elsewhere. But "cowardice" implies a flight from a known truth. Sidgwick did not flee the truth of the Dualism; he published it. He did not pretend the SPR had succeeded; he reported its failures.

  If Sidgwick were a coward, he would have done one of two things:
  1.  **Dogmatism:** He would have pretended to believe in God without evidence to soothe his conscience (which he refused to do in 1869).
  2.  **Deception:** He would have faked or exaggerated psychical evidence to secure the moral guarantee he needed.

  He did neither. He lived in the agonizing space between the two. He admitted that Reason could not validate Morality, and he admitted that Evidence could not validate Faith. His "cowardice" was actually a refusal to accept the nihilistic conclusion that his own logic seemed to demand. He could not bear to tell the world that Duty was ultimately irrational. So he kept looking for a way out.

  ### The Verdict
  Sidgwick's psychical research was a **compromise**, but it was an **honorable compromise**.

  It was a compromise because it admitted that his philosophical system was incomplete without an empirical miracle. It violated the ideal of the detached philosopher who follows reason wherever it leads, even into the abyss. Sidgwick stopped at the edge of the abyss and spent thirty years looking for a bridge.

  However, it was honorable because he never lied about the status of the bridge. He told the world, essentially, "I cannot prove morality is rational without a God. I cannot prove God exists without evidence. I am looking for the evidence. I have not found it yet."

  For your novel, this distinction is crucial. If your character simply capitulates to the journalist, he admits to hypocrisy. If he answers, he must articulate this tragedy. He is not a coward hiding from the dark; he is a man lighting matches in a cavern because he refuses to tell his students that the cavern has no exit.

  The historical Sidgwick's position is best summarized not as consistency, but as **tragic fidelity**. He was faithful to his need for a rational morality, and faithful to his need for empirical evidence, even though those two faiths were at war. The SPR was the battlefield. He died without a victory, but he never surrendered the ground.

  **Recommendation for the Scene:**
  Do not let your character deny the motive. Let him admit that he *needed* the evidence to be real. Let him admit that the *Methods of Ethics* left a wound that only a spiritual reality could heal. But let him challenge the journalist's definition of cowardice.

  *   **The Journalist's Truth:** You went to the mediums because your philosophy failed.
  *   **The Don's Truth:** My philosophy revealed a truth about the universe that was too terrible to accept without a fight. I did not go to the séance room to escape reason. I went there because reason told me I had to find something more, or admit that virtue is a lie. I searched. I found nothing conclusive. But I did not stop searching, because to stop searching would be to tell the world that goodness is a mistake. Is that cowardice? Or is it the only duty left?

  This preserves the historical Sidgwick's integrity while acknowledging the deep, human tension that drove him. It transforms the scene from an exposure of hypocrisy into a revelation of the high cost of rational morality.
