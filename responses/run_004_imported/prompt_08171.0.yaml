answer: |-
  The rain against the study window sounded like static, a white noise that filled the silence left by thirty-five years of field recordings. Elias Thorne rubbed his eyes, the skin thin and spotted like a jaguar's pelt. On the desk lay the open texts: on the left, his own monograph on *Reciprocal Altruism in Pan Troglodytes*; on the right, Sharon Street's *Coming to Terms with Contingency*.

  He had spent a lifetime watching chimps groom the sick, share meat with kin, and punish free-riders. He knew the machinery of cooperation. It was gear-driven, greased by oxytocin and calibrated by the cold arithmetic of inclusive fitness. But now, in the quiet of retirement, he was haunted by the metaethical implications of that machinery.

  Street's dilemma sat in his throat like a pill he couldn't swallow.

  *Horn One:* Natural selection shaped our moral beliefs to track independent moral truths.
  *Horn Two:* Natural selection shaped our moral beliefs solely for reproductive fitness.

  Elias knew biology. Horn One was biological nonsense. Evolution is a tinkerer, not a truth-seeker. It selects for survival, not for correspondence with Platonic realities. To suggest the human brain evolved to detect non-natural moral facts was to invite a teleology he had spent his career excising from science.

  So, Horn Two. Our convictions are fitness-enhancing adaptations. But if that's the case, why trust them? If I believe "suffering is bad" only because believing that helped my ancestors cooperate and survive, then the truth of the statement is irrelevant. It would be a miraculous coincidence if these fitness-driven instincts happened to align with actual moral truth.

  The phone rang, shattering the silence.

  It was the hospital. His brother, David. The stroke had left him aphasic, unable to manage his affairs. The social worker was asking about next of kin.

  "I'll come," Elias said. "I'll handle it."

  He hung up and stared at his hand. Why had he said that?

  David had been a drunk for forty years. He had borrowed money he never returned. He had missed Elias's wife's funeral. In the language of reciprocal altruism, David was a chronic defector. A cheater. The evolutionary script demanded Elias cut his losses. Resources spent on David were resources subtracted from Elias's own genetic legacy, or even from his own comfort in retirement.

  Yet, the conviction sat in his chest, heavy and immovable: *I ought to care for him.*

  Elias grabbed his coat and stepped into the rain. As he drove, the wipers keeping time with his thoughts, he ran the debunking argument again. If this feeling of obligation is just a heuristic—a "kin selection" module misfiring in a modern context where David can't reciprocate—then it has no normative weight. It's just a chemical push. To obey it is to be a puppet of dead ancestors.

  He pulled into the hospital parking lot, the engine ticking as it cooled. He didn't get out immediately. He opened his notebook, the one where he tried to reconcile the biology with the philosophy.

  *If the causal story undermines the justification,* he wrote, *then I am left with nothing but the impulse.*

  But then he turned the page. He had been reading Parfit.

  *On What Matters.*

  Elias traced the margin notes he'd made weeks ago. Parfit's objection to the debunking argument. The idea that normative truths do not exist in space-time. They are not the kind of things that *can* be caused.

  "Math," Elias whispered to the empty car.

  He thought of the prime numbers. Evolution selected for humans who could count. If you couldn't count your tribe, you might be outnumbered. So, the capacity for arithmetic was selected for fitness. But does that mean *2 + 2 = 4* is false? Does it mean the truth of mathematics is just a "coincidence"?

  No. The causal origin of the *belief* is irrelevant to the *truth* of the proposition. Mathematical truths are necessary. They don't need to push on neurons to be real; neurons just need to be capable of grasping them.

  Could morality be the same?

  Elias looked at the hospital lights. If "suffering is bad" is a necessary truth, akin to a logical axiom, then evolution didn't need to track it causally. Evolution only needed to give him the cognitive capacity to recognize it. The fact that recognizing it *also* promoted group cohesion (fitness) was a happy convergence, not a suspicious coincidence.

  But there was another angle. The Third-Factor explanation. David Enoch's argument.

  *Factor 1:* Evolution selects for survival.
  *Factor 2:* Survival is good (a normative truth).
  *Conclusion:* Evolution selects for things that are good.

  If survival is objectively valuable, then natural selection is not blind to value; it is an engine of it. The traits it selects—care for kin, cooperation, pain avoidance—are selected *because* they are conducive to survival, and they are conducive to survival *because* survival is good. The correlation between fitness and moral truth isn't a coincidence; it's anchored by the value of life itself.

  Elias gripped the steering wheel. The realist reply held water. It wasn't a proof, but it wasn't a collapse either. It meant he didn't have to choose between being a biologist and being a moral agent. He could accept the causal history of his mind without surrendering the authority of his conscience.

  He got out of the car.

  The ward smelled of antiseptic and boiled vegetables. David lay in the bed, small beneath the sheets, an IV taped to a bruised hand. He looked up when Elias entered. There was no recognition in the eyes, only a vague, animal anxiety.

  Elias pulled up the plastic chair. The old biological imperative surged: *This is kin. Protect the genome.*

  But Elias pushed past it. He wasn't here because of the genome. David had no children. The genetic line ended with them. There was no fitness payoff. No reciprocal benefit. David could not groom him back.

  If Street was right, and the debunking argument held absolute sway, Elias should feel a sense of error. He should feel like he was acting on an illusion, a ghost of adaptation past.

  Instead, he felt clarity.

  He reached out and took David's hand. It was cold.

  "It's Elias," he said softly.

  He thought about the prime numbers again. The fact that he could understand them was a product of evolution. But the truth of them was not. Perhaps the obligation he felt was similar. The *capacity* to feel obligation was forged in the Pleistocene, shaped by the need to keep the band together. But the *object* of that obligation—the reality that a suffering brother demands care—stood outside the causal chain.

  It didn't matter *why* he was here, evolutionarily. What mattered was that he *was* here, and that being here was *right*.

  David squeezed his hand, a reflex, or perhaps a recognition.

  Elias realized the dilemma wasn't a trap. It was a filter. It filtered out the unexamined instincts, leaving only the convictions that could withstand the scrutiny of their own origins. He had spent thirty-five years studying why primates helped each other. He had cataloged the grooming, the meat-sharing, the coalition building. He had explained the *how* and the *why* of the behavior.

  But as he sat in the humming silence of the hospital room, watching his brother's chest rise and fall, he knew the biology didn't touch the *ought*.

  The evolutionary story explained the presence of the moral sense. It did not explain away its authority.

  "I'm not leaving," Elias said, to David, or perhaps to the ghost of Sharon Street.

  He settled into the chair. The rain continued outside, indifferent to the room, indifferent to the truth. But inside, the warmth of the hand in his was not a coincidence. It was a fact, as solid as any data he had ever collected, and as necessary as any sum he had ever solved. He would stay. Not because his genes told him to, but because it was true.
