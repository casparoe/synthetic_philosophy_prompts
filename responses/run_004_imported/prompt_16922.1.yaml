  2.  **Initial Assessment & Fact-Checking (Mental Check):**
      *   *Priya's Math:* 20 seconds * 12,000 cars = 240,000 seconds/day = ~66 hours/day. Over 20 years (7300 days) = ~485,000 hours. That's a lot of time. Is it worth $2M + 485k hours of life to save 1 life?
