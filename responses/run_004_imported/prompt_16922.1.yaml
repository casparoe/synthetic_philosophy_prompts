      *   *Let's check the time cost value.* 485,000 hours. If we value time at $20/hour (low ball), that's ~$9.7 million. So Priya's math *might* actually hold up in a strict CBA if the time value is high enough.
      *   *But the philosophical point remains:* Even if the sum is higher, is it *moral* to trade the life?
