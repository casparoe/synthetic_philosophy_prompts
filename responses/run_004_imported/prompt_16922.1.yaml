      *   *However:* The philosophical question isn't just about the specific numbers (which might be debatable), but about the *principle* of aggregation. Is it morally permissible to sum tiny annoyances to justify risking a life?
      *   *The "Paradox of Aggregation":* This is a classic problem in moral philosophy (Parfit, Scanlon, etc.).

  3.  **Identify the Philosophical Frameworks:**
      *   **Utilitarianism (Priya):** Maximize overall welfare. Sum up all utilities/disutilities. A death is a large negative utility, but millions of small negatives can sum to a larger negative.
      *   **Contractualism/Scanlon (The User's Intuition):** T.M. Scanlon's *What We Owe to Each Other*. Principles that no one could reasonably reject. An individual facing death has a much stronger claim than an individual facing 20 seconds. You can't aggregate the 20 seconds to override the death claim.
      *   **Threshold Deontology:** There's a threshold where consequences matter, but rights/trumps exist below/above certain points.
      *   **The "Separateness of Persons" (Rawls):** Utilitarianism treats society as one big person. But individuals are distinct. Sacrificing one person's vital interest for the trivial interests of many violates this distinction.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Validation:** Start by validating the user. Their gut isn't just sentiment; it's a recognized philosophical position. Priya isn't "wrong" for doing math, but her math relies on a specific (and contested) moral framework.
