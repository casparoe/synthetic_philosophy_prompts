      *   **Student's Conclusion:** Ornithologists could just study fruit bowls.
      *   **User's Goal:** Wants a "real answer" for next week, not a shrug. Needs to know if the student is right about *equal evidential weight* and, if not, the *cleanest explanation* for why the reasoning breaks down.

