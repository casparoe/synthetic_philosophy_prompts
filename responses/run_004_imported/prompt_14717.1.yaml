      *   **Bayesian Solution (Standard):** Confirmation is about probability raising. $P(H|E) > P(H)$. The key is the size of the reference classes.
      *   **Good's Solution (Contextual):** Depends on background knowledge.
      *   **Quine's Solution (Natural Kinds):** "Raven" and "Black" are natural kinds; "Non-raven" and "Non-black" are not. Projectibility matters.
      *   **Scheffler/Goodman (Selective Confirmation):** Distinguish between confirming the statement vs. refuting the contrary.

