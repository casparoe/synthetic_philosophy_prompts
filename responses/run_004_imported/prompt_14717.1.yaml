      *   For the Raven: $P(\text{Black Raven}|H)$ is higher than $P(\text{Black Raven}|\neg H)$ (because if $\neg H$, some ravens are non-black, so finding a black one is less guaranteed? No, that's tricky).
      *   *Better Bayesian Explanation:* It's about the *size of the sets*.
