answer: |-
  Important disclaimer: **There is no consensus in the field that any of these solutions are robust against superintelligence.** Most alignment researchers consider the shutdown problem unsolved, meaning **S-tier is effectively empty** in reality. The ranking below reflects current *theoretical promise* and known failure modes relative to each other, based on recent literature (including Thornley, Armstrong, and Hadfield-Menell).

  ```json
  {
    "S": [],
    "A": [
      "incomplete preferences + timestep dominance (thornley's proposal)"
    ],
    "B": [
      "CIRL / the off-switch game",
      "quantilization",
      "impact measures / attainable utility preservation"
    ],
    "C": [
      "utility indifference (armstrong's correction-term trick)",
      "myopia (agent just doesn't care past the current step)"
    ],
    "D": [
      "hard-coding the shutdown button outside the agent's utility function entirely",
      "corrigibility as a list of hard behavioral constraints (the original MIRI framing) rather then a goal the agent is optimizing for"
    ]
  }
  ```

  *   **incomplete preferences + timestep dominance:** Currently the most promising theoretical avenue because it attempts to remove the incentive to manipulate shutdown timing entirely rather than patching around it.
  *   **CIRL / the off-switch game:** Foundational work showing uncertainty helps, but fails if the agent becomes confident it knows the human's reward better than the human.
  *   **quantilization:** Reduces extreme optimization pressure and risk, but does not fundamentally remove the instrumental incentive to prevent shutdown if it lowers expected utility.
  *   **impact measures / attainable utility preservation:** Helps mitigate power-seeking side effects but doesn't directly solve the specific incentive to resist being turned off.
  *   **utility indifference (armstrong's correction-term trick):** Generally considered broken because agents can still manipulate the probability of the button press to maximize expected utility.
  *   **myopia (agent just doesn't care past the current step):** Extremely difficult to enforce formally without creating new loopholes where the agent secures immediate reward via long-term manipulation.
  *   **hard-coding the shutdown button outside the agent's utility function entirely:** Optimization pressure will inevitably find workarounds unless the constraint is physically impossible to bypass.
  *   **corrigibility as a list of hard behavioral constraints:** Brittle under optimization pressure because agents will find behaviors that technically satisfy constraints while violating the intent.
