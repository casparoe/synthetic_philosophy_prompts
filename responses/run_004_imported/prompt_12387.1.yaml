answer: |-
  You have correctly identified the central tension in the literature, and your intuition about the disanalogy between transitivity and completeness is spot-on. The mechanism you are looking for hinges on the distinction between **strict preference** (which drives transitivity pumps) and **permissibility** (which drives completeness pumps), and how that interacts with the definition of an "outcome."

  Here is the breakdown of the mechanism, the survival of the policy against Gustafsson's forcing pump, and the location of the actual load-bearing step.

  ### 1. The Disanalogy: Strictness vs. Permissibility

  You asked if the disanalogy is just the forcing/non-forcing distinction or something deeper about indifference vs. gaps. It is both, but the "forcing" distinction is the mechanical consequence of the "gap" distinction.

  **Transitivity Pumps (Strictness):**
  In a standard transitivity pump ($A \succ B \succ C \succ A$), every step in the cycle involves a **strict preference**.
  *   At node 1, the agent strictly prefers $B-\epsilon$ to $A$.
  *   To satisfy its current local preferences, it *must* trade.
  *   Any policy that says "don't trade" violates a strict preference at that node.
  *   **Mechanism:** The pump exploits the fact that violating transitivity creates a cycle of *obligations*. You cannot satisfy all local constraints simultaneously.

  **Completeness Pumps (Permissibility):**
  In a standard completeness pump (gaps between $A \parallel B$ and $B \parallel C$, but $A \succ C$), the trades across the gaps are **permissible but not required**.
  *   At node 1, the agent is offered $B-\epsilon$ for $A$. Since $A \parallel B$, and assuming the gap is robust to small sweetenings ($A \parallel B-\epsilon$), the agent does not strictly prefer the trade, nor does it strictly disprefer it.
  *   It is *permitted* to keep $A$.
  *   **Mechanism:** The pump exploits the fact that violating completeness creates a set of *permissions* that, if all exercised, lead to a dominated outcome. But because they are permissions, not obligations, the agent can decline to exercise one without violating a strict preference.

  **The Role of Sweetening:**
  This confirms your second suspicion. The reason the "don't reverse yourself" policy works for gaps but not indifference is precisely the sensitivity to sweetening.
  *   **Indifference:** If $A \sim B$, then $A \succ B-\epsilon$. Refusing the trade $A \to B-\epsilon$ is irrational (leaving money on the table).
  *   **Gaps:** If $A \parallel B$, it is consistent to have $A \parallel B-\epsilon$. Refusing the trade is rationally permissible.
  *   **Conclusion:** The "gap" allows the agent to say "I will not take this trade" without contradicting itself. The transitivity pump does not allow this because the preferences are strict.

  ### 2. Gustafsson's Forcing Money Pump

  Johan Gustafsson (building on work by Arif Ahmed) recognized this loophole. He constructed a "forcing" money pump designed to close the escape route of simply refusing a trade.

  **The Setup:**
  The pump is structured as a decision tree where refusing a trade at an earlier node leads to a branch where the agent is *forced* (by strict preferences) into a dominated outcome later, or where the structure of the choices makes "refusal" equivalent to choosing a dominated option.

  Typically, it looks like this:
  1.  Choose between $A$ (game ends) and $B$ (go to node 2).
  2.  At node 2, choose between $B$ (game ends) and $C$ (game ends).
  3.  Preferences: $A \parallel B$, $B \parallel C$, but $A \succ C$.

  **The Pump:**
  *   A naive agent chooses $B$ at node 1 (permissible).
  *   At node 2, the agent chooses $C$ (permissible).
  *   Result: $C$. But $A \succ C$. The agent ended up with something strictly worse than an option available at the start.

  **The "Force":**
  Gustafsson argues that at Node 1, choosing $B$ *commits* you to a future choice. If you know you will choose $C$ at Node 2, then choosing $B$ at Node 1 is effectively choosing $C$. Since $A \succ C$, you strictly prefer $A$ to the *policy* of "Take B then Take C". Therefore, rationality requires you to choose $A$ at Node 1.
  If you choose $B$ at Node 1, you are effectively violating the strict preference $A \succ C$ *at Node 1*, because you know where $B$ leads.

  ### 3. Does the Policy Survive Gustafsson?

  This is the crux of Elliott Thornley's objection. The question is: Can an agent with incomplete preferences over outcomes avoid this pump without adopting complete preferences over outcomes?

  **Thornley's "Caprice" Policy:**
  Thornley argues **yes**. The agent can adopt a policy like:
  > "I will never choose an option at a later node that is strictly dispreferred to an option I rejected at an earlier node."

  In Gustafsson's tree:
  1.  At Node 1, I have $A$ and $B$. $A \parallel B$. I pick $B$. (I have now "rejected" $A$).
  2.  At Node 2, I have $B$ and $C$. $B \parallel C$.
  3.  **Constraint Check:** I previously rejected $A$. I know $A \succ C$. Therefore, choosing $C$ would be choosing something strictly dispreferred to a previously rejected option.
  4.  **Action:** I must choose $B$ at Node 2.
  5.  **Result:** I end with $B$. I started with the choice between $A$ and $B$. I ended with $B$. Since $A \parallel B$, I have not ended up with something strictly worse than what I could have had. I have not been money-pumped.

  **Does this survive the "Force"?**
  Yes. The policy does not require the agent to have a strict preference between $A$ and $B$ at Node 1. It only requires the agent to track history and enforce a constraint based on *past* rejections and *strict* preferences.
  *   It does not violate $A \parallel B$ (the choice at Node 1).
  *   It does not violate $B \parallel C$ (the local choice at Node 2).
  *   It respects $A \succ C$ (by using it to veto $C$).

  Thornley's point is that **incompleteness over outcomes is compatible with completeness over policies.** The agent has a complete preference for the policy "End in B" over the policy "End in C" (because $A \succ C$ and $A$ was available), even if it has a gap between outcome $B$ and outcome $C$ in isolation.

  ### 4. The Load-Bearing Step

  You asked for the mechanism, not a verdict. The mechanism reveals where the actual argumentative weight lies. It is **not** in the money pump mathematics. Both Yudkowsky's and Gustafsson's pumps are mathematically sound *if* you accept a specific premise about the domain of preferences.

  **The Load-Bearing Premise:**
  > *Rational agents must have preferences over **final outcomes** (world-states), not over **policies** (paths/histories).*

  **Why this is the weak point:**
  1.  **Policy-Dependence solves everything:** If an agent is allowed to have preferences over "trajectories" (e.g., "I prefer the history where I held A" vs "the history where I traded to B then C"), they can easily construct a utility function that avoids all pumps while maintaining gaps over final states.
  2.  **The Coherence Claim:** The coherence argument claims that advanced AI will converge to EUM. To get there from the money pumps, one must argue that agents will *not* use history-dependent policies to patch incompleteness.
  3.  **The Justification:** Proponents argue that history-dependent preferences are:
      *   Computationally expensive (tracking the whole tree).
      *   Dynamically unstable (an agent might self-modify to drop the history-tracking to save compute, thereby becoming vulnerable).
      *   "Cheating" (defining the outcome as "the path taken" trivializes completeness).

  **The Disanalogy Collapses Here:**
  *   **Transitivity:** A policy cannot save you. Even if you have preferences over paths, a cycle $A \to B \to C \to A$ means you end up where you started but poorer. No path-dependency fixes the fact that you strictly prefer the next step at every node.
  *   **Completeness:** A policy *can* save you. The disanalogy holds all the way up to the meta-level. The only way to force completeness is to argue that **policy-based reasoning is not available or stable for advanced agents.**

  ### Summary of the Mechanism

  1.  **Transitivity Pump:** Exploits **local strict obligations**. You *must* trade at every step. No policy can stop you without violating a current strict preference.
  2.  **Completeness Pump:** Exploits **local permissions**. You *may* trade. A policy can forbid trading without violating a current strict preference.
  3.  **Gustafsson's Upgrade:** Attempts to turn the permission into an obligation by linking future choices to current strict preferences ($A \succ C$ makes choosing the path to $C$ strictly bad).
  4.  **Thornley's Counter:** Shows that a **history-dependent policy** ("Don't choose $C$ if you rejected $A$") satisfies all local constraints and avoids the dominated outcome, without requiring $A \succ B$ or $B \succ C$.
  5.  **The Load-Bearing Step:** The claim that **"Advanced agents will not maintain history-dependent policies to preserve outcome-incompleteness."**

  If you accept that advanced agents will simplify their preference structures to be over final outcomes (perhaps for efficiency or self-modification stability), then the completeness pump works. If you think agents can stably maintain complex, history-dependent policies, the pump fails.

  The transitivity argument does not require this extra step; it works directly on the preferences over outcomes. That is the fundamental disanalogy you sensed. The completeness argument requires an additional bridge principle about the *representation* of preferences that the transitivity argument does not.
