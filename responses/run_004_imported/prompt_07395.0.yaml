prompt: |-
  My partner and I got into an argument a few nights ago that's still bugging me. I'm fluent in two languages, and sometimes mid-sentence I already know exactly what I want to say before I've found the words for it in either one - like he can suggest a word and I'll instantly know its close but not quite right, even though I couldn't have come up with the exact word myself yet. He says that's not actually possible: if it's not in words yet there's nothing there to compare against, just a vague feeling, and the real thought only exists once its been phrased in some language. I feel like there's clearly something specific sitting there before any words show up, I just can't prove what it is. Who's actually right here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Conflict:** The user and their partner are arguing about the nature of thought and language.
      *   **User's Position:** Thoughts exist *before* language. They have a specific, non-verbal concept/feeling/meaning that they can compare potential words against (even in two languages) to see if it fits.
      *   **Partner's Position:** Thoughts *are* language (or at least, require language to exist). Without words, there's only a "vague feeling." The thought only crystallizes once phrased.
      *   **The Core Question:** "Who's actually right here?"
      *   **Context:** The user is bilingual. They experience a specific phenomenon where they know a word is "close but not quite right" before they find the *right* word.

  2.  **Identify the Underlying Philosophical/Psychological Debate:**
      *   This is the classic **Linguistic Relativity (Sapir-Whorf Hypothesis)** vs. **Universalism/Cognitivism** debate.
      *   It's also related to the **Language of Thought Hypothesis (Mentalese)** proposed by Jerry Fodor.
      *   It touches on **Psycholinguistics** and **Cognitive Science** (tip-of-the-tongue states, semantic encoding).

  3.  **Evaluate the Evidence/Arguments:**
      *   **Partner's View (Linguistic Determinism/Strong Whorfianism):** "Thought depends on language." This is largely discredited in its strong form. We know infants think before they speak. Animals think without human language.
      *   **User's View (Mentalese/Pre-verbal Thought):** "Thought exists independently of language." This aligns more with current cognitive science. We encode meaning semantically before mapping it to lexical items.
      *   **The Bilingual Factor:** Being bilingual actually strengthens the user's argument. If thought were *only* language, switching languages would change the thought fundamentally. But bilinguals often report the *same* underlying concept can be expressed in either language, implying a language-neutral representation.
      *   **The "Tip-of-the-Tongue" Phenomenon:** This is crucial evidence. You know *what* you want to say (the meaning), but can't access the *label* (the word). If thought were words, you wouldn't know what you were trying to say if you didn't have the word.

  4.  **Synthesize the Answer:**
      *   **Direct Answer:** Neither is 100% "right" in a philosophical sense, but scientifically, the user's experience is more supported by evidence.
      *   **Validate the User:** Acknowledge that their experience is real and documented (Tip-of-the-Tongue, Mentalese).
      *   **Validate the Partner (Nuance):** Acknowledge that language *shapes* thought (Weak Whorfianism) and helps structure complex abstract ideas.
      *   **Key Concepts to Introduce:**
          *   *Tip-of-the-Tongue State:* Proof that meaning exists without the word.
          *   *Mentalese (Language of Thought):* The idea of an internal, non-verbal representation.
          *   *Bilingualism:* Evidence that concepts are separate from lexical labels.
          *   *Non-verbal cognition:* Infants, animals, visual thinking.
      *   **Resolution:** It's not a binary "right/wrong." It's a spectrum. Meaning comes first, language clothes it. But language also helps refine meaning.

  5.  **Drafting the Response (Iterative refinement):**
