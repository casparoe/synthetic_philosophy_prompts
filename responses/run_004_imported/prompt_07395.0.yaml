answer: |-
  This is a classic debate in cognitive science and philosophy of mind, and while it might feel like a stalemate in your living room, **modern psychology and linguistics actually lean much closer to your side of the argument.**

  You are describing a well-documented phenomenon, and your experience as a bilingual speaker provides some of the strongest evidence against your partner's claim. Here is the breakdown of who is right, based on what we know about how the brain works.

  ### 1. The "Tip-of-the-Tongue" Phenomenon
  You mentioned knowing a word is "close but not quite right" even when you can't produce the exact word. In psychology, this is called the **Tip-of-the-Tongue (TOT) state**.

  Research into TOT states proves that **semantic encoding** (the meaning) and **lexical retrieval** (the word label) are two different steps in the brain.
  *   **If your partner were right:** You wouldn't know what you wanted to say until you found the word.
  *   **What actually happens:** You access the *concept* first (the meaning, the shape, the function, the feeling). You know the concept is there. Then, your brain searches for the phonological label (the sound of the word). When the search fails, you have the meaning without the word.

  The fact that you can reject a suggested word because it doesn't match the "shape" of the thought proves the thought exists independently of the word.

  ### 2. The Bilingual Evidence
  Your fluency in two languages is a major point in your favor. If thought were impossible without language (a strong version of the **Sapir-Whorf hypothesis**), switching languages would fundamentally change the nature of your thinking.

  However, translation exists. When you translate, you are not swapping word-for-word; you are taking a **language-neutral concept** from your mind and "dressing" it in the clothing of Language A or Language B.
  *   If you think, "I am hungry," you have a physiological and conceptual sensation of hunger.
  *   You can label that sensation *J'ai faim* or *I am hungry*.
  *   The sensation (the thought) precedes the label. If the thought only existed *as* the words, you couldn't transfer the meaning from one language to another without losing the essence.

  ### 3. "Mentalese" vs. Natural Language
  In the 1970s, philosopher Jerry Fodor proposed the **Language of Thought Hypothesis (Mentalese)**. He argued that the brain operates in its own computational code—a system of representations that isn't English, Spanish, or French, but a symbolic logic that *underlies* all of them.

  Neuroscience supports this. We know that:
  *   **Infants think before they speak:** Babies understand object permanence and cause-and-effect long before they have words for them.
  *   **Non-verbal cognition exists:** We can visualize rotating 3D objects, navigate maps, and recognize faces without using an internal monologue.
  *   **Aphasia patients:** People who lose language capabilities due to brain injury often retain complex reasoning skills, strategic thinking (like in chess), and emotional understanding. If thought required language, losing language would lobotomize their ability to think, which it doesn't.

  ### 4. Where Your Partner Has a Point (The Nuance)
  While you are right that thought *precedes* language, your partner is right that language *shapes* and *refines* thought. This is known as **Weak Linguistic Relativity**.

  *   **Crystallization:** Sometimes we have a "foggy" idea, and the act of forcing it into words helps us sharpen it. Language acts as a scaffold for complex, abstract reasoning.
  *   **Categorization:** Language gives us categories (like "future tense" or specific color distinctions) that can make certain types of thinking faster or more automatic.

  So, while the *seed* of the thought is non-verbal, language is the tool you use to build the house. Your partner is mistaking the scaffolding for the foundation.

  ### The Verdict
  **You are scientifically in the stronger position.**

  There is a specific, structured semantic representation in your brain before you select words. It is not just a "vague feeling"; it is a packet of information containing relationships, intent, and meaning. Your ability to evaluate whether a word fits that packet proves the packet exists before the word is chosen.

  **How to resolve the argument:**
  You might tell your partner: *"If thought only existed in words, I wouldn't be able to realize a word you suggested was wrong. To know a key doesn't fit a lock, I have to know the shape of the lock before I try the key. The 'lock' is the thought, and it's there before I find the 'key' (the word)."*

  You aren't imagining it. That pre-verbal space is where creativity and intuition live.
