prompt: |-
  I attempted to verify a couple of specific facts (the exact Analects passage numbering and the Ames/Rosemont terminology) via search, but I've hit the tool-call limit for this turn. I'm confident enough in these well-established facts from my own knowledge to proceed without verification, so here is the prompt:

  So I was down a rabbit hole this week on Confucian role ethics for a longer piece I'm doing on individualism vs. more relational ways of thinking about selfhood, and one bit has been stuck in my head since. It's that passage in the Analects where the Governor/Duke of She brags to Confucius about an "upright" man in his town who testified against his own father for stealing a sheep, and Confucius basically says: not in my town, pal - uprightness there looks like fathers covering for sons and sons covering for fathers. Which is just such a different starting point than the whole Western liberal picture of "you're an individual first, who happens to have relationships and rights" - the Ames/Rosemont reading of role ethics seems to say there's no "you" underneath the roles at all, just the relations themselves, and being good just IS doing those roles well (as a father, a subject, a friend, whatever they happen to be).

  Anyway, I keep explaining this to people in the abstract and their eyes glaze over, so I want to try something else: could you write me a short story (a page or two, doesnt need to be longer) that actually dramatizes this tension rather than just illustrating it? I'm picturing something like a family business, or a lab, or some other tight-knit unit with clear roles, where someone discovers a senior member (a father, a mentor, whoever) has done something seriously wrong, and the "twist" isn't just loyalty-vs-the-law in the generic whistleblower-movie sense - I want the dilemma to actually turn on the metaphysical bit, that who the protagonist even IS depends on these roles, so "doing the right thing" isn't obviously well-defined once you take that seriously. Feel free to set it whenever/wherever it works best for you, contemporary, historical, even a speculative future society built around something like Confucianism's Five Relationships - I just don't want the philosophy to be background wallpaper.
