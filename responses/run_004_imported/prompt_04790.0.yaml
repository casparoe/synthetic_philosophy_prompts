answer: |-
  You have a sharp eye for the underlying assumptions here, and your skepticism is well-placed—but your housemate is also right. You aren't missing the mechanics of ECL, but you are likely conflating the **physical mechanism** that creates a "Large World" with the **decision-theoretic mechanism** that makes ECL work.

  The short answer is: **No, ECL is not hostage specifically to the Many-Worlds Interpretation (MWI) of quantum mechanics.** While MWI is a popular *example* used to illustrate the concept within the LessWrong sphere (because it fits naturally with the "branching" intuition), it is not the *only* physical premise that yields a Large World.

  Here is the breakdown of why your critique is partially right but ultimately misses the broader cosmological basis for the argument, and what you should actually be wary of before bringing this to an EA meetup.

  ### 1. "Large World" $\neq$ "MWI"
  Your main concern is that ECL relies on the ontological reality of quantum branches. If Copenhagen were true (wavefunction collapse is real and unique), you might think the "other copies" disappear.

  However, in the context of ECL and multiverse-wide cooperation, "Large World" usually refers to **Cosmological** largeness, not just **Quantum** largeness.
  *   **Level I Multiverse (Infinite Space):** If space is infinite (or sufficiently vast) and matter is distributed roughly uniformly (as standard inflationary cosmology suggests), then there are Hubble volumes identical to ours simply due to combinatorial probability. This requires **no specific interpretation of QM**. It only requires standard Lambda-CDM cosmology + eternal inflation/infinite space.
  *   **Level II Multiverse (Eternal Inflation):** Different "bubble universes" with potentially different physical constants.
  *   **Level III Multiverse (MWI):** The quantum branches you are worried about.

  ECL works in Level I just as well as Level III. If there is another Earth 10^10^50 meters away making the same decision as you, the evidential correlation holds regardless of whether wavefunctions collapse or branch. Therefore, ECL is not betting specifically on MWI; it is betting on **Infinite/Very Large Cosmology**, which is a separate (and arguably more standard) assumption in modern physics than MWI.

  ### 2. The Core is Algorithmic, Not Physical
  The engine of ECL isn't the physics; it's the decision theory (specifically variants of Evidential Decision Theory or Functional Decision Theory).

  The argument runs like this:
  1.  I am running a specific decision algorithm.
  2.  There are other agents in the universe (or multiverse) running sufficiently similar decision algorithms.
  3.  Because we run similar algorithms on similar inputs, our outputs will correlate.
  4.  Therefore, by choosing an action, I gain *evidence* about what those other agents choose.
  5.  If the world is "Large" (many such agents), the sum total of value affected by this correlation dwarfs the local causal impact.

  Notice that step 2 does not require quantum branching. It only requires that **similar minds arise elsewhere.** This could happen via:
  *   Exact physical duplication (Infinite Space).
  *   Convergent evolution of intelligence (Aliens elsewhere who reason like us).
  *   Simulation (We are in a simulation with many instances).

  MWI is just the "easy mode" for getting exact copies. But ECL proponents argue that even *approximate* correlation (aliens who reason similarly but aren't atomic copies) is enough to sustain some degree of evidential cooperation.

  ### 3. Where Your Skepticism *Is* Valid
  While you are wrong that it requires MWI specifically, you are right that it requires **ontological realism about unobservable regions.**

  *   **The Indistinguishability Problem:** You noted that interpretations are empirically indistinguishable. The same applies to the "Infinite Space" premise. We cannot observe beyond our light cone. Believing in infinite identical Hubble volumes is a metaphysical commitment to the "Level I Multiverse."
  *   **The Measure Problem:** Even if the world is large, how do we count the "copies"? In MWI, there are debates about branch measure (Born rule). In infinite space, there are regularization issues. ECL requires a way to weigh these different instances to calculate expected utility. If the "measure" of your copies is ill-defined, the ECL calculation breaks down.
  *   **The "Parasitic" Nature:** You used the word "parasitic," which is provocative but captures a real tension. ECL effectively monetizes *logical uncertainty*. It says, "I can't causally affect them, but my decision is *news* to me about their decision." If you are a Causal Decision Theorist (CDT), this looks like magic. If you are an FDT/EDT theorist, it looks like logic. The framework is indeed heavily dependent on accepting non-causal decision theories, which is a bigger hurdle for mainstream EA than the physics is.

  ### 4. Advice for the Meetup
  You asked if you should cite ECL reasoning to weight moral-compromise interventions more heavily. **I would advise extreme caution.**

  *   **Speculativeness:** ECL is considered "highly speculative" even within the EA/LW community. It sits at the intersection of fringe decision theory and fringe cosmology. Basing funding or priority recommendations on it is risky.
  *   **The "Compromise" Aspect:** The idea that you should compromise with alien values relies on the assumption that those aliens *also* accept ECL. If you compromise and they don't (because they are CDT agents), you lose. This is the "unilateralist's curse" applied to acausal trade.
  *   **Better Framing:** Instead of saying "We should do X because ECL says so," frame it as: "ECL suggests that in a large universe, cooperative reasoning might have leverage beyond our causal horizon. While uncertain, this suggests we shouldn't ignore the possibility of acausal gains-from-trade when designing long-termist strategies."

  ### Summary
  Your housemate was right: **Large World-ness is not hostage to MWI.** It is hostage to **Infinite/Vast Cosmology** (which is independent of QM interpretation) and **Non-Causal Decision Theory** (which is independent of physics).

  However, your intuition that the argument rests on contested, unprovable premises is correct. It rests on:
  1.  The universe being spatially infinite or eternally inflating (unprovable).
  2.  Functional Decision Theory being the correct normative theory (contested).
  3.  Agents across the multiverse being sufficiently similar to correlate (uncertain).

  So, don't let the MWI point stop you from understanding the argument, but do let the *speculative* nature of the argument stop you from treating it as a solid foundation for grantmaking or strategy without heavy caveats.

  **Recommendation:** Read Oesterheld's *"Multiverse-wide Cooperation via Correlated Decision Making"* (his dissertation) specifically looking for his treatment of "similarity" vs. "identity." He explicitly addresses that exact atomic copies aren't strictly necessary, which should resolve your MWI worry while confirming your broader skepticism about the premises.
