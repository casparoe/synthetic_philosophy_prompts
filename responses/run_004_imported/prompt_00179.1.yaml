answer: |-
  You have hit on one of the most famous and difficult problems in ethics. What you are describing is a philosophical concept known as **Moral Luck.**

  Your intuition is correct: from a purely logical and moral standpoint, it is inconsistent to judge two people differently when they made the exact same choice, and the only difference was a factor outside their control (luck). However, the way society, legal systems, and institutions handle this is complex.

  Here is a breakdown of why this feels unfair, why it happens, and how to reconcile the two.

  ### 1. The Philosophical Conflict: Control vs. Outcome
  There are two competing ways we judge human behavior:

  *   **The Control Principle (Moral Ideal):** This view states that people should only be judged on factors within their control. Since both drivers chose to text, they exhibited the same level of recklessness and disregard for safety. Morally, their character flaws are identical. By this standard, they deserve equal blame.
  *   **Resultant Luck (Real-World Judgment):** This is when our judgment is influenced by the outcome of an action. Because one driver caused harm and the other didn't, we instinctively view the first driver as "worse."

  Philosopher Thomas Nagel, who wrote famously about this, argued that moral luck undermines the idea that we are solely responsible for our moral worth. If morality is about *who you are*, both boys are equally reckless. If morality is about *what happens because of you*, they are very different.

  ### 2. Why Society Judges Based on Outcomes
  Even though it feels logically inconsistent, there are reasons why institutions (like the school, the team, or the legal system) punish based on outcomes:

  *   **Harm Triggers Accountability:** Human empathy is driven by visible suffering. When no one is hurt, it is easy to dismiss the risk as "no big deal." When someone is injured, the abstract risk becomes concrete tragedy. The system responds to the tragedy.
  *   **Legal and Institutional Liability:** The team isn't necessarily making a philosophical statement about the boy's soul; they are managing risk and reputation. A player who hit a cyclist is a liability. A player who got home safe is not. The suspension is often a pragmatic response to harm, not a pure measurement of moral guilt.
  *   **Deterrence:** Harsh penalties for bad outcomes serve as a warning to others. If the consequence for texting and driving was always just a "lecture," regardless of whether someone died, people might take the risk more often. The fear of the "bad outcome" punishment is meant to stop the behavior before the luck runs out.

  ### 3. The Cyclist Factor
  You mentioned the cyclist ran a red light. This adds a layer of legal complexity (contributory negligence), but it doesn't necessarily change the moral equation regarding the texting.
  *   **Legally:** This might reduce the driver's liability in court.
  *   **Morally:** The driver was already operating a vehicle unsafely before the cyclist entered the picture. The cyclist's mistake doesn't erase the driver's recklessness, though it does complicate the narrative of who is "at fault."

  ### 4. Is it Fair?
  **Morally? No.**
  It is not fair to say one boy is a "bad person" and the other is "fine" when they made the same bad choice. The boy who got home safe benefited from **privilege of luck**, not superior judgment. He should arguably face similar internal reflection and consequences from his parents/coaches, even if the world didn't force them upon him.

  **Practically? It's inevitable.**
  We live in a consequentialist world. We punish harm more than we punish risk. While the *moral blame* should be equal, the *consequences* will almost always be unequal because consequences are tied to damage, not just intent.

  ### The Takeaway
  The inconsistency you feel is real. It is a flaw in how humans process justice.
  *   **For the boy who hit the cyclist:** He is facing the weight of the outcome. He needs to understand that while the luck was against him, the choice was still his.
  *   **For the boy who got home safe:** He is facing a "moral hazard." He might walk away thinking, "Texting isn't that dangerous," because he didn't get caught by fate. That is a dangerous lesson.

  The most ethical approach would be for the team and parents to acknowledge that **both** boys took the same risk. The one who caused harm faces heavier external consequences (suspension, legal issues), but the one who got home safe should face equally heavy *internal* consequences (loss of trust, strict probation, serious counseling) to correct the behavior before his luck runs out next time.

  You are right to be bothered. Recognizing this inconsistency is the only way to ensure we don't mistake "getting away with it" for "doing the right thing."
