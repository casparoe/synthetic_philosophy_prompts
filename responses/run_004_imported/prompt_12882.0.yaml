  10. **Final Review:** Does this capture Bradley's point? Bradley says relations are unintelligible because they require further relations. The story shows the *attempt* to make them intelligible destroying the thing itself. The "Unity" is never achieved. The vertigo comes from the realization that the foundation is missing.

  *(Self-Correction on the Ending)*: Don't just have him die. Have him realize the *silence*. The Fact was never there. The "Socrates" and "Wise" are just dust now.

  Let's write.

  *Title Idea:* The Mortar Between. The Binder. The Audit of Facts. *The Gap.*
  *Let's go with "The Gap."*

