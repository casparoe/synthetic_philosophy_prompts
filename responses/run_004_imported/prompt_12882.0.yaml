      *   *Scene 6: The Ending.* The structure becomes unstable. The silence of the void.

  5.  **Refining the Metaphor (The "Glue"):**
      *   Instead of abstract logic, let's make it physical. "Clamps." "Seals." "Welds."
      *   Let's use the image of a bridge. Two cliffs. You need a plank. But the plank doesn't touch the cliff unless you press it. You need a clamp. But the clamp doesn't touch the plank unless...
      *   Actually, a "Archivist of Facts" feels more Borges. He is cataloging a specific event. "The King died." He needs to ensure "The King" and "Died" are one unit.
      *   Let's try the *Archivist* angle. He is preserving a Fact.
      *   *Name:* Elian.
