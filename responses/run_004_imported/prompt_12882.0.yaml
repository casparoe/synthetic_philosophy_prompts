answer: |-
  The Department of Cohesion occupied the basement levels of the Ministry, where the air was always still and smelled of ozone and old dust. Elian's title was Junior Ligator, Third Grade. His job was simple: ensure that the things recorded on the Slates actually touched one another.

  On his desk lay Slate 4492. It was a slab of grey stone, polished to a mirror sheen. On the left side sat a tile engraved with **THE APPLE**. On the right, a tile engraved with **RED**.

  In the natural world, an apple is red. The quality inheres in the object. But down in the Ministry, mere adjacency was considered negligence. If you simply placed the tiles side by side, they were just a list. *Apple. Red.* That was not a fact. A fact required a Unity. A fact required the *is*.

  Elian picked up the vial of Copula. It was a viscous, silver fluid that shimmered even in the dim light. With a steady hand, he drew a line of the fluid between the two tiles. The silver bridge touched the edge of **THE APPLE** and the edge of **RED**.

  He exhaled. The Fact was bound. The proposition was unified. He reached for the stamp to certify the work.

  "Stop," said a voice.

  Elian froze. Standing in the shadow of the shelving units was an Auditor. She wore the high-collared grey coat of the Inspection Bureau. Her face was indistinct, as if viewed through frosted glass.

  "The Copula," she said, pointing a gloved finger. "It is adjacent to the tile."

  "It touches," Elian said. "I applied it directly."

  "Touching is not binding," the Auditor said. She stepped into the light. "You have placed a third thing between two things. Now you have three things. **THE APPLE**. **RED**. And **THE COPULA**. Unless **THE COPULA** is bound to **THE APPLE**, they are merely neighbors. They are not one."

  Elian blinked. "So... I need to apply more Copula?"

  "Bind the Copula to the Apple," she said.

  Elian dipped his stylus again. He applied a fresh bead of silver over the junction where the first line met the **THE APPLE** tile. He called this *Copula-2*. It sealed the first line to the stone.

  "Done," Elian said.

  "Now bind *Copula-2* to *Copula-1*."

  Elian hesitated. He applied a tiny dot of silver where the new bead met the old.

  "And *Copula-2* to the Tile."

  Elian applied another dot.

  "And the new dot to the bead it covers."

  Elian's hand began to tremble. He picked up the magnifying loupe. The junction was becoming a small mound of silver. He could no longer see the edge of the **THE APPLE** tile. He was working on the surface of the silver itself now, trying to make the silver stick to the silver.

  "You see the problem," the Auditor said. Her voice was flat, devoid of malice, which made it worse. "Every time you introduce a connector to join two things, you have created a new gap between the connector and the things it joins. A relation is a thing. If it relates, it must be related."

  "I can use a stronger adhesive," Elian muttered. He reached for the heavy canister of Absolute Bond.

  "Strength is irrelevant," the Auditor said. "This is not a structural failure. It is an ontological one. You are trying to build a bridge, but you are forgetting that the bridge itself needs a foundation to stand on. And the foundation needs a foundation."

  Elian worked faster. The mound of silver grew. It spilled over the edge of the **THE APPLE** tile. It began to creep toward **RED**. But to make it creep, he had to bind the creeping edge to the stationary mass. He needed *Copula-50*, *Copula-51*.

  The pile was now a small hillock on the slate. The original tiles were buried beneath the machinery of their own connection.

  "Why doesn't it hold?" Elian whispered. He was sweating. The silver was heavy, weighing down the slate. The wood of the desk groaned.

  "Because there is no glue that glues itself," the Auditor said. "If there were, you would not need to apply it. If there is not, you need a second glue to apply the first. And a third to apply the second."

  Elian dropped the stylus. The silver mound shivered. It looked unstable. It was a tower of connectors connecting nothing, because the bottom of the tower was just another connector resting on a tile it hadn't quite touched without a third connector.

  "The Fact," Elian said, his voice rising. "The Fact is **THE APPLE IS RED**. Where is it?"

  "It is under there," the Auditor said, gesturing to the mound.

  "No," Elian said. He leaned in. He couldn't see the tiles anymore. He couldn't see the original line. There was only the silver. The attempt to unite the terms had obliterated the terms. The Unity had consumed the Many, but in doing so, it had become a shapeless mass that touched nothing but itself.

  "It's going to slide," Elian said.

  "The regress?"

  "The mound. It has no purchase. It's sitting on the slate, but it isn't *of* the slate. Every layer is floating on the one beneath it, held only by a layer above it that hasn't been applied yet."

  The silver mound gave a sickening lurch. It didn't fall; it simply ceased to be supported. The bottom layer, the one meant to touch the **THE APPLE** tile, had no bond. It was just resting there. And because it wasn't bonded, the layer above it wasn't bonded either. The entire chain of connection was unmoored.

  "Fix it," Elian pleaded. "Apply the ground bond."

  "I cannot," the Auditor said. "I am an Auditor. I only inspect. To apply the ground bond, I would need a Ligator. But the Ligator would need a bond to touch the ground."

  The mound began to dissolve. It didn't crumble; it unspooled. The silver turned to mist. As the connectors vanished, the gap between the tiles reappeared. But it was wider now.

  **THE APPLE**.

  **RED**.

  They looked lonely. They looked like strangers.

  "The world is not made of facts," the Auditor said, turning to leave. "It is made of terms that pretend to touch. We are just the ones who check the distance."

  Elian stood alone in the silence of the basement. He looked at the slate. He reached out to touch the **THE APPLE** tile, but he stopped his finger a millimeter above the surface. If he touched it, his finger would need a relation to the stone. And that relation would need a relation.

  He hovered there, trembling in the gap, afraid to land, afraid that if he made contact, he would find nothing there to catch him. The air between his finger and the stone felt vast, an infinite canyon that no amount of glue could ever span. He realized then that he had never touched anything in his life, only hovered endlessly above it, suspended by a chain of connections that had never quite reached the ground.

  He left his finger hanging in the void, and walked away from the desk, leaving the proposition unfinished, the silence between the words growing louder than the words themselves.
