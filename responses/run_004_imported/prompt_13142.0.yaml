answer: |-
  You are not being inconsistent for no reason, and you aren't just being overly sensitive. There is actually a robust philosophical debate about exactly this problem. You've stumbled onto a concept philosophers call **the problem of aesthetic testimony.**

  So, to answer your first question: **Yes, there is an actual difference** between passing along a verdict on a taco shop and passing along a verdict on a novel, even though on the surface they look like the same action (trusting a friend's judgment).

  Here is why your brain is flagging one as "honest" and the other as "dishonest," and how you can handle it practically without losing your social flow.

  ### 1. The Philosophical Difference: Facts vs. Experiences
  When you tell your coworkers the taco place is good, you are making a claim about **quality and consistency.** You are essentially saying, "The ingredients are fresh, the seasoning is balanced, and the hygiene is acceptable." These are semi-objective traits. Even if you haven't eaten there, you can trust Priya's report on the physical reality of the food.

  When you tell your sister a movie is "great" or a book is "beautifully written," you are making a claim about **an experience.**
  *   **Tacos:** "This object provides pleasure."
  *   **Art:** "This object moved *me*."

  To say a piece of art is "beautiful" implies that you have engaged with it, processed it, and had an emotional or intellectual reaction to it. When you say "It's beautifully written" without reading it, you aren't just reporting on the book's quality; you are implicitly claiming you had the *experience* of reading it. You are claiming an emotional reaction you didn't actually have.

  Philosophers argue that aesthetic judgments require **first-hand acquaintance.** You can know *that* a painting is famous (fact), but you can't truly know it is *moving* (aesthetic judgment) without seeing it yourself. That's why the taco recommendation feels like sharing data, but the movie recommendation feels like sharing a piece of your soul that you don't actually possess.

  ### 2. The Identity Stakes
  We use art to signal who we are. Your taste in movies and books is part of your identity; your taste in lunch is usually just logistics.

  *   **The Taco Risk:** If the taco place is bad, your coworkers think, "Bummer, wasted $15." Your integrity isn't on the line.
  *   **The Movie Risk:** If the movie is a mess, your sister thinks, "Wait, you thought *that* was great? What does that say about your taste? Or... are you pretending to be deeper than you are?"

  The embarrassment you felt with your sister wasn't just that the movie was bad; it was that you were caught **claiming an intimacy with the art that you didn't earn.** It feels like "getting away with something" because, in a social sense, you are. You are borrowing Priya's cultural capital and spending it as your own.

  ### 3. Practical Advice: How to Stop "Lying" Without Being Awkward
  You don't need to stop recommending things based on Priya's word. That's a great heuristic! But you need to change the **attribution.** The guilt comes from removing Priya from the equation and making the opinion your own.

  Here is how to shift the phrasing so you remain honest but still helpful:

  **Instead of:** "Oh yeah, it's really good."
  **Try:** "I haven't seen it yet, but Priya saw it and she said it's incredible. She's usually right about this stuff."

  **Instead of:** "It's beautifully written."
  **Try:** "I've heard the writing is stunning. It's at the top of my TBR pile because of that."

  **Instead of:** "You should watch it, it's great."
  **Try:** "If you like Priya's taste, you'll probably love it. She raved about it."

  **Why this works better:**
  1.  **It protects your integrity:** If the movie turns out to be a mess (like with your sister), you aren't the liar. You accurately reported Priya's opinion.
  2.  **It protects your relationship:** If your sister hates the movie, she won't feel like *you* misled her; she might just decide Priya's taste isn't for her.
  3.  **It actually promotes Priya:** You get to be the connector. "Oh, you liked that? You have to talk to Priya, she's the one who told me about it."

  ### The Verdict
  You should stop repeating other people's verdicts as if they are your own opinions. Not because it's "wrong" to trust Priya, but because **aesthetic opinions are promises of shared experience.**

  When you say a movie is good, you are inviting someone into a headspace you occupy. If you haven't been there, you're inviting them into an empty room.

  The fix is simple linguistics. By adding "Priya said..." or "I haven't seen it but...", you turn a potential lie into a trustworthy referral. You keep the social benefit (helping friends find good stuff) without the moral cost (claiming experiences you didn't have). Plus, if Priya ever steers you wrong again, you won't be the one left holding the bag.
