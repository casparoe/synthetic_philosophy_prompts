      *   *The Fossil:* Needs to be specific. A scansoriopterygid? A dromaeosaurid? Let's invent a specific specimen number to make it feel real. *Specimen IVPP-V-2991*, a juvenile paravian. The filaments are the crux. Protofeathers? Dermal fibers?
      *   *Dynamic:* Professional courtesy masking personal history. Coffee cups, old habits, specific ways they hold tools.

  3.  **Philosophical Integration (The Hard Part):**
