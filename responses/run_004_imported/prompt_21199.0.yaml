answer: |-
  The climate-controlled prep lab at the Field Museum smelled of acetate and old dust. Outside, Chicago was dissolving into a February slush, but inside, the air was kept at a constant sixty-five degrees to protect the matrix.

  Elena adjusted the binocular microscope, her shoulders hunched in the way Marcus remembered from their sabbatical in Berlin, fifteen years ago. She wore a wedding ring on a chain around her neck, not on her finger. Marcus noticed it, then looked at his own bare hand. He picked up a pneumatic scribe, set it down, and picked it up again.

  "The melanosomes are scrambled," Elena said, not looking up. "We can't infer color. That kills the display hypothesis."

  "Display isn't just color," Marcus said. He leaned against the counter, keeping a respectful distance. The specimen lay between them on a foam cradle: *Specimen 4402*, a basal paravian, no larger than a crow, encased in fine-grained siltstone. It was covered in filaments. Long, tubular structures extending from the ulna and the tail. "Structural display. Movement. The filaments amplify the motion of the forelimb."

  "Without color contrast? In a nocturnal or crepuscular niche, which the scleral rings suggest?" Elena finally looked at him. Her eyes were the same pale grey, tired in the same specific way. "It's inefficient. Selection doesn't favor inefficiency."

  "Selection doesn't design, Elena. It edits." Marcus stepped closer, pointing a gloved finger at the slab. "Look at the density. It's creating a boundary layer. Even if it didn't evolve *for* heat retention, it *provides* heat retention. That is its causal role. It contributes to the homeostasis of the organism *now*, in this context."

  "That is a property, not a function."

  "It's a function in the Cummins sense."

  "It's not a function in the etiological sense," she countered. "And if we're talking about what the structure *is*, we have to talk about why it's there. If those filaments were selected for tactile sensing in an ancestor, and now they happen to keep the animal warm, they are exaptations. They have no proper function regarding thermoregulation. To say otherwise is to confuse effect with purpose."

  Marcus sighed, a short puff of air that fogged the safety glass for a second. "Purpose. You always go back to purpose. The animal is dead. The lineage is extinct. There is no future selection pressure. There is only what the thing *did* while it was alive. It trapped heat. That's what it was for, in the only tense that matters for a fossil: the past continuous."

  Elena turned back to the microscope. She knew he was talking about the paper. They had been co-authoring again for three years, ever since the grant money dried up and they realized their citation indices were higher when combined. It was a practical arrangement. A causal role.

  "You're conflating utility with function," she said softly. "If I use a rock to crack a nut, the rock's function isn't nut-cracking. It's a rock. If these filaments weren't selected for insulation, calling them insulation is a category error. It's like saying the function of our marriage was to produce two papers in *Nature*."

  Marcus stiffened. They didn't talk about the marriage. Not directly. The divorce had been a slow erosion, a shifting of tectonic plates that neither had felt until the ground opened up. He had wanted to move to the States; she had wanted to stay in Europe. He had wanted to focus on public outreach; she had wanted to focus on phylogeny.

  "We did produce the papers," Marcus said. "And the marriage held for twelve years. It contributed to a system. It stabilized our early careers. It supported the kids while they were young."

  "It failed its selected effect," Elena said. She was calibrating the focal depth. "We weren't selected for compatibility. We were selected for proximity and timing. When the environment changed, the trait was lost. That doesn't mean the trait had a function just because it persisted for a while."

  "That's a bleak way to view a life, El. Nothing is what it was raised to be. Nothing is defined by its origin. We are defined by what we do."

  "We are defined by what we were built to do," she corrected. "And if the mechanism breaks, the function is void. You can't look at a broken engine and say its function is to be a paperweight. That's what *you* do with it. That's not what it *is*."

  She rotated the slab ten degrees. The light caught the impression of a quill knob on the ulna.

  "Look at the attachment points," she said, her voice shifting back to the rock. "Strong ligaments. This implies active movement. If it was just insulation, why the muscular control?"

  "Display," Marcus said. "Or maneuverability. Gliding."

  "Juvenile specimen," Elena reminded him. "It likely couldn't glide. So the muscular control is vestigial. Or..."

  "Or it's for something else," Marcus finished. "Something we haven't thought of. Something that contributes to its survival *in the moment*."

  "Survival isn't a function. It's an outcome."

  "Survival is the only metric that isn't subjective."

  They worked in silence for an hour. The only sound was the hiss of the air scribe and the scratch of Elena's pencil on the graph paper. They moved around each other with the efficiency of a long-practiced dance. He handed her the calipers before she asked for them. She slid the coffee mug to his side of the table when she saw it was empty.

  It was a system. It worked.

  "Why did you agree to co-author this?" Marcus asked suddenly. He wasn't looking at her. He was looking at the filaments, dark against the grey stone.

  "Because you have the funding for the synchrotron scan," Elena said. "And I have the phylogenetic framework. Together, we get the publication. That is the causal role of this partnership."

  "And that's it? No historical commitment? No... residue?"

  "Residue decays," she said. "Isotopes have half-lives, Marcus. So do habits. I'm here because the data requires two interpretations to be robust. My view checks yours. Your view checks mine."

  "My view is that the filament keeps the animal warm."

  "My view is that we cannot know if that was the reason it existed."

  "If we can't know the reason, we have to go with the effect."

  "If we go with the effect, we risk anthropomorphizing the adaptation. We assume the animal needed warmth, so the feathers must be for warmth. But maybe they were a genetic hitchhiker. Maybe they were selected for in the lineage, but in this specific animal, they served no selected purpose. They were just... there."

  "Like us?" Marcus asked.

  Elena stopped writing. She rested her hand on the edge of the prep table. The stone was cold.

  "Like the filaments," she said.

  Marcus pushed off the counter. He walked to the window, looking out at the grey sky. "You know, in the Cummins view, a heart's function is to pump blood. Even if it evolved from a muscle that was originally for peristalsis. Once it enters the system and contributes to circulation, that is its function. History is irrelevant to the current operation."

  "But if the system dies," Elena said, "the operation stops. Then all you have left is the history. The fossil record is nothing but history. We are looking at a dead system. There is no current operation. There is only the trace of what was selected."

  "So you're saying because we're divorced, the marriage has no function? Not even as a memory? Not even as the reason we know how to work together like this?"

  "I'm saying the marriage was a structure. It had a selected effect—reproduction, social bonding. It failed. Now we are using the remnants of that structure to write a paper. The paper is the exaptation. The marriage is the fossil."

  Marcus turned back. He looked at her, really looked at her, seeing the lines around her mouth that hadn't been there in Berlin. He wondered if she saw the same in him. He wondered if he was defined by the fact that he had left, or by the fact that he had come back to collaborate.

  "I think the filaments were for display," Marcus said. "To signal to parents. To signal to siblings. 'I am here. I am alive.'"

  "That's a selected effect," Elena said. "Signaling. Communication."

  "No," Marcus said. "It's a causal role. It affects the behavior of the other animals in the vicinity. Regardless of why the filament grew, the fact that it exists changes the system."

  "And if the other animals are dead?"

  "Then the function dies with them."

  "Exactly." Elena turned back to the microscope. "So we can't claim it. We have to write 'possible function' in the discussion. We can't commit."

  "The reviewers will tear that apart."

  "Let them. I'd rather be vague than wrong."

  "I'd rather be useful than precise."

  They stood on opposite sides of the specimen. The little theropod lay between them, its mouth slightly open, frozen in a scream or a breath. The filaments fanned out like a halo, or a mess of spilled ink.

  "We need to decide on the abstract," Marcus said. "Do we lead with thermoregulation or display?"

  "Lead with morphology," Elena said. "Describe the structure. Let the function remain ambiguous."

  "That's cowardly."

  "It's rigorous."

  Marcus picked up his notebook. He tapped his pen against the cover. "You know, I'm still married, El. To the woman in Boston."

  Elena didn't flinch. She made a note on the graph paper. *Distal barbules: indeterminate.*

  "I know," she said.

  "She thinks I'm defined by what I do. By the grants I get. By the lectures I give."

  "And you?"

  "I think I'm defined by what I can still contribute." He looked at the fossil. "Even if the original system is gone."

  Elena capped her pen. She took the chain from her neck and tucked the ring into her pocket. It made a small, heavy sound.

  "The fossil doesn't care what we call it," she said. "It will sit in the drawer. The rock will weather. The filaments will turn to dust. The only thing that persists is the interpretation. And that's not a function of the animal. That's a function of us."

  "So we assign the function," Marcus said.

  "We assign the label," Elena corrected. "The function is gone. There is only the cause."

  Marcus nodded slowly. He didn't agree, but he knew the argument wouldn't end today. It hadn't ended in ten years. It wouldn't end before the paper was published, or even after. It was the substrate of their collaboration. Without the disagreement, there was no friction. Without the friction, there was no heat.

  "Okay," Marcus said. "Morphology first. Function in the discussion. Qualified."

  "Selected effects noted," Elena said.

  "Causal roles acknowledged."

  They packed up their tools. The scribe went into its case. The notebooks were stacked. They turned off the overhead lights, leaving the specimen in the dim glow of the microscope lamp. In the semi-darkness, the filaments seemed to shimmer, appearing to move in the periphery of their vision, though neither of them reached out to touch the stone.

  They walked to the door together. Marcus held it open. Elena passed through.

  "See you at the symposium?" Marcus asked.

  "If the funding holds," Elena said.

  "Right. The funding."

  "Goodnight, Marcus."

  "Goodnight, Elena."

  She walked down the hallway toward the elevators. He walked toward the stairs. The fossil remained in the dark, a question mark written in bone and stone, waiting for a selection pressure that would never come again.
