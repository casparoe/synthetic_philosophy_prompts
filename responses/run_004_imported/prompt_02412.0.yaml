answer: |-
  This is an excellent question, and it cuts to the very heart of the interpretive challenge in Nāgārjuna's *Mūlamadhyamakakārikā* (MMK). If you can resolve this tension for your Extended Essay, you will have grasped the central engine of Madhyamaka philosophy.

  The confusion arises because we tend to read Nāgārjuna as making a **metaphysical claim** about the world (i.e., "Things do not exist"), when he is actually making a **conceptual claim** about how we think about the world (i.e., "The concept of 'intrinsic existence' is incoherent").

  Here is an intuitive walkthrough of the logic, focusing on the target of the negation, the relationship between emptiness and dependence, and how this avoids nihilism.

  ### 1. Identify the Target: *Svabhāva* vs. Existence
  The most common mistake is assuming Nāgārjuna is negating *existence* simpliciter. He is not. He is negating ***svabhāva*** (intrinsic nature, own-being, or independent existence).

  When the fourfold negation (the *catuṣkoṭi*) denies that something arises from self, other, both, or neither, it is attacking a specific assumption: **that causes and effects are discrete, independently existing entities that interact.**

  *   **If things had *svabhāva*:** They would be sealed off from one another. A seed would be essentially and permanently a "seed." It could never become a sprout, because changing into a sprout would violate its intrinsic "seed-nature."
  *   **The Four Corners:** Each of the four options in Chapter 1 assumes that "arising" is a real transaction between real entities.
      *   *From Self:* Implies the effect already exists (no change).
      *   *From Other:* Implies total discontinuity (anything could produce anything).
      *   *From Both:* Combines the errors of both.
      *   *From Neither:* Implies magic/randomness.

  **The Logic:** Nāgārjuna shows that if you assume things have intrinsic natures, causation becomes logically impossible. Therefore, **causation is only possible if things lack intrinsic nature.**

  ### 2. Emptiness (*Śūnyatā*) as Possibility, Not Void
  This is the counter-intuitive pivot. In Western metaphysics, "nothingness" is usually the opposite of "being." In Madhyamaka, **Emptiness is the condition of possibility for being.**

  Think of it this way:
  *   **Substantialist View:** A cup exists because it has "cup-stuff" inside it. If you remove the stuff, the cup is gone.
  *   **Madhyamaka View:** A cup exists *because* it is empty of intrinsic nature. Because it is empty, it can be filled, broken, washed, or perceived. If the cup had an intrinsic, unchangeable nature, it could never function as a vessel.

  When Nāgārjuna says "nothing arises," he means "nothing arises **inherently**."
  *   **Nihilism says:** "The cup does not exist."
  *   **Nāgārjuna says:** "The cup does not exist *independently*, which is why it can exist *dependently*."

  This is why Garfield emphasizes that emptiness is not a "nothingness" behind the scenes; it is the **lack of a metaphysical foundation**. It saves the phenomena by refusing to reify them.

  ### 3. The Two Truths as a Semantic/Pragmatic Tool
  You asked how this establishes the Two Truths doctrine. In Garfield's reading (which is heavily influenced by Wittgenstein), the Two Truths are not two different *worlds* (a conventional world vs. a real world). They are two different **ways of engaging** with the one world.

  *   **Conventional Truth (*Saṃvṛti-satya*):** This is the realm of language, practice, and cause-and-effect. Here, seeds *do* give rise to sprouts. Fire *is* hot. Karma *works*. We do not deny this.
  *   **Ultimate Truth (*Paramārtha-satya*):** This is the realization that when you analyze those conventional truths to find their ultimate foundation, you find nothing (*svabhāva*).

  **The Logic of the Connection:**
  The fourfold negation operates at the **Ultimate** level to deconstruct our tendency to project intrinsic existence onto **Conventional** reality.
  1.  We see a sprout arise (Conventional).
  2.  We instinctively think, "That sprout has a real, independent essence that came into being."
  3.  Nāgārjuna applies the fourfold negation to show that "independent arising" is incoherent.
  4.  We realize the sprout is empty (Ultimate).
  5.  **Crucially:** This realization allows us to return to the Conventional and see the sprout *correctly*—as dependently originated, not as a metaphysical absolute.

  Without the fourfold negation, we cling to the Conventional as Ultimate (Eternalism). Without the Conventional, the negation is meaningless (Nihilism).

  ### 4. Avoiding Nihilism: The Charge and The Defense
  Nāgārjuna anticipates the nihilism charge in Chapter 24. His opponents argue: *"If everything is empty, then the Four Noble Truths don't exist, the Buddha doesn't exist, and nothing matters."*

  Nāgārjuna's reply is the famous verse (24.18):
  > *"We state that dependent origination is emptiness. It is a dependent designation; that itself is the middle path."*

  Here is the intuitive logic for your essay:
  *   **The Nihilist** denies the validity of conventional cause and effect. They say, "Nothing matters."
  *   **The Essentialist (Opponent)** thinks things only matter if they have intrinsic nature. They say, "If it's empty, it doesn't matter."
  *   **Nāgārjuna** argues: "Things *only* matter because they are empty."

  **Example:** If a person had an intrinsic, fixed "evil nature," they could never be redeemed. Moral transformation would be impossible. Because people are empty of intrinsic nature, they can change, learn, and attain enlightenment. Emptiness validates ethics; it doesn't destroy them.

  Garfield stresses that for Nāgārjuna, **emptiness is dependent origination.** They are the same fact described differently.
  *   *Dependent Origination:* Things arise in dependence on conditions.
  *   *Emptiness:* Because they arise in dependence on conditions, they lack independent nature.

  If you deny emptiness, you deny dependence. If you deny dependence, you deny causation. If you deny causation, *then* you are a nihilist. Therefore, **emptiness is the only view that avoids nihilism.**

  ### 5. Summary for your Essay Argument
  To synthesize this for your Extended Essay, you might structure the logic like this:

  1.  **The Dilemma:** The fourfold negation seems to eliminate all ontological grounding, risking nihilism.
  2.  **The Shift:** The negation targets *svabhāva* (intrinsic existence), not *astitva* (conventional existence).
  3.  **The Mechanism:** By proving that intrinsic arising is logically impossible (via the four corners), Nāgārjuna forces the reader to accept *dependent* arising.
  4.  **The Resolution:** Dependent arising *is* emptiness. This validates the Conventional Truth (cause and effect work) while clarifying the Ultimate Truth (nothing exists independently).
  5.  **Conclusion:** Nihilism is the view that convention is invalid. Madhyamaka is the view that convention is *only* valid because it is empty. Thus, the fourfold negation saves the world from nihilism by saving it from essentialism.

  ### A Note on Garfield's Interpretation
  Since you are using Garfield, keep in mind his "conventionalist" reading. He argues that Nāgārjuna has **no metaphysical thesis of his own.** The fourfold negation isn't establishing a new theory called "Emptiness." It is a therapeutic tool to cure us of the habit of theorizing.

  For Garfield, the "Two Truths" aren't a hierarchy where Ultimate is "more real." Ultimate truth is simply the *correct understanding* of conventional truth. So, the fourfold negation doesn't take you *out* of the world; it allows you to live *in* the world without delusion. This is a strong angle for an IB essay because it engages with secondary literature and interpretation, not just exegesis.

  **Key Quote for your Essay:**
  Look at MMK 24.10: *"For whom emptiness is possible, all things are possible. For whom emptiness is impossible, nothing is possible."*
  This is your smoking gun against the nihilism charge. Use it to show that emptiness is the prerequisite for existence, not the denial of it.
