  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** Chair, Academic Integrity Board
  **DATE:** Thursday, 5:00 PM
  **SUBJECT:** Investigative Strategy & Probability Update re: [Course Name] Incident

  **1. Decision and Directive**

  We are operating under a hard deadline for grade submission this Friday. We cannot afford paralysis by analysis, nor can we afford to misallocate our limited investigative bandwidth. After reviewing the competing frameworks for interpreting the proctor's testimony—specifically the "Local Update" versus Priya's "Global Update"—I have made a determination.

  **We will proceed using Priya's Global Update model.**

  Consequently, our investigative resources for the next 24 hours will be allocated as follows:
  *   **60% of effort:** Focused exclusively on **Evening Room 2**.
  *   **40% of effort:** Distributed across the **Morning Sitting** (split evenly between Morning Room 1 and Morning Room 2).
  *   **0% of effort:** Dedicated to Evening Room 1 at this stage.

  Investigative teams should begin swipe-log pulls and handwriting sampling for these groups immediately.

  **2. Rationale for the Probability Update**

  I understand that the "Local Update" view feels more intuitive. It argues that because the proctor explicitly refused to compare Morning versus Evening, we should maintain our prior 50/50 split between the two sittings and only adjust the odds *within* the Evening group. This approach prioritizes caution and adheres to a strict reading of the proctor's words. It is a legally conservative stance, and I want to acknowledge that its primary virtue is protecting the Morning students from being penalized by ambiguous testimony.

  However, Priya has demonstrated that this approach is statistically incoherent given how the information was revealed. This is a known class of probability problem involving **selection effects** (similar to the "Principle of Total Evidence").

  The core issue is not just *what* the proctor said, but *that* she spoke at all.
  *   If the leak originated in the Morning, the probability of a proctor coming forward with specific, room-level intelligence about the *Evening* sitting is significantly lower than if the leak originated in the Evening.
  *   By remaining silent on the Morning rooms while offering specific odds on the Evening rooms, the proctor has inadvertently provided evidence that the "signal" is stronger in the Evening.
  *   To ignore this is to treat the *absence* of information about the Morning as neutral, when in this context, the absence itself is data.

  If we adopt the Local View, we are effectively assuming the proctor would have been equally likely to offer this specific tip regardless of where the leak actually happened. Priya's math shows this assumption violates the laws of conditional probability. If we want our findings to withstand appeal or external review, we must use the model that correctly accounts for the source of the evidence.

  **3. Resource Allocation Strategy**

  You will note the allocation above does not put 100% of our effort on Evening Room 2, even though the Global Update suggests it is the single most probable source.

  This is a strategic hedge. While the probability mass shifts toward Evening, the Morning sitting still retains a non-trivial probability (roughly 40% under the Global model). Given the board's stated constraint that placing a formal hold on the wrong group is "genuinely costly" for innocent students, we cannot afford a false negative on the Morning sitting.

  Therefore:
  *   **Evening Room 2** receives the majority share because it is the highest-probability single hypothesis.
  *   **The Morning Sitting** receives a significant minority share to mitigate the risk of exonerating the true source if our likelihood estimates are slightly off.
  *   **Evening Room 1** is deprioritized because, under both the Local and Global models, its probability is too low to justify scarce resources compared to the other three groups.

  **4. Next Steps**

  *   **Tonight:** Team leads to assign investigators according to the 60/40 split.
  *   **Friday, 12:00 PM:** Preliminary findings review. If Evening Room 2 yields definitive evidence, we will halt Morning investigation immediately to minimize disruption.
  *   **Friday, 4:00 PM:** Final report submission.

  I want to thank the members who advocated for the Local View. Your insistence on not over-interpreting the proctor's silence was a necessary check against confirmation bias. However, in this specific probabilistic context, that caution introduces a different kind of bias—one that underweights the evidence we *do* have. We move forward with the Global Update.

  Let's get to work.

  [Signature]
