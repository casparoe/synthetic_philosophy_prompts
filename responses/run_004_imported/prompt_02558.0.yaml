      *Wait, looking closer at Move 4:* Marcus argues that Role Ethics *denies* uniform standards. This is theoretically sound. Elena is critiquing it from outside; Marcus is defending it from inside. Marcus is right that her critique only works if you accept her premise. So Marcus has the better *internal* defense, but Elena has the better *external* critique. I will frame it as Marcus successfully defending the internal logic.

      *Looking at Move 6:* Does Shun fleeing really solve the problem? It shows a limit (he doesn't stop the law), but it still prioritizes the father. However, against Elena's claim that there is *no* stopping point, Marcus succeeds.

      *Conclusion:* Focus on the "Root" metaphor and the definition of *Zhi*.

