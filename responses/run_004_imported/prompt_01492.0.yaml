      *   *Philosophy:* The "specification" (the axioms) *is* the object of study. There is no external client. The truth of the axioms is the entire debate.
      *   *Key Insight:* Formal verification guarantees *validity*, not *soundness*.

  4.  **Identify the Specific Philosophical Objections:**
      *   **Modal Collapse:** This is the big one. If the proof works, it implies that everything that is true is *necessarily* true. Contingency disappears. This is a huge bullet to bite.
