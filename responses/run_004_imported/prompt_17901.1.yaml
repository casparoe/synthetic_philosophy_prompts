prompt: |-
  I organize my department's colloquium series on formal epistemology and rational agency, and next month's guest is a decision theorist known for defending coherence arguments: the line of reasoning running from classical Dutch-book and money-pump arguments, through Omohundro's "basic AI drives" argument, to Yudkowsky's popularizations, on which any agent whose preferences are not representable by expected-utility maximization can be money-pumped -- exploited through a sequence of trades that leaves it strictly worse off than before -- so that we should expect sufficiently capable agents, including self-improving AI systems, to converge on expected-utility maximization. Draft eight to ten interview questions that go beyond having her restate the folk version of the argument: I want at least one question on whether an agent with merely incomplete, rather than cyclic, preferences can dodge the pump without thereby being irrational; one on McClennen's resolute-choice reply -- the idea that committing in advance to a plan can block exploitation without ever restoring coherence among the agent's momentary preferences; and one on the objection that almost any behavior can be rationalized after the fact as expected-utility maximization for some sufficiently gerrymandered utility function, so the theorems may be too cheap to underwrite the goal-directedness the AI-safety argument needs from them -- and for each, a follow-up keyed to the answer she's most likely to give.
