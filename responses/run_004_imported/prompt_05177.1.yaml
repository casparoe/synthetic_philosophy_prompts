answer: |-
  **MEMORANDUM**

  **TO:** AI Safety Theory Fellowship Board
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for [Year] AI Safety Theory Fellowship

  **1. Context and Charge**

  This cycle, the board faces a substantive deadlock between two exceptionally strong candidates. Both Finalist A and Finalist B propose to address the shutdown problem, a core bottleneck in corrigibility research. The divergence is not merely technical but architectural: Finalist A proposes to stabilize utility indifference within the standard Expected Utility Maximization (EUM) framework, while Finalist B proposes to model the agent using incomplete preferences to remove the incentive for manipulation entirely.

  Our charter mandates that we fund the project that "most advances the theoretical foundations of corrigibility." In what follows, I recommend we award the fellowship to **Finalist B**.

  **2. Rationale for Recommendation**

  While Finalist A's project is methodologically safer and aligns more closely with existing engineering pipelines, Finalist B's proposal better satisfies the specific mandate to advance *theoretical foundations*.

  Corrigibility requires an agent to allow itself to be switched off without incentivizing the prevention of that switch. Finalist A attempts to solve this by patching the utility function within EUM. However, as noted by our outside philosophy referee, the stability of such indifference under self-modification is a known open problem flagged in early MIRI literature. Solving this would be a significant contribution, but it operates within a paradigm (EUM) that many alignment theorists suspect may be fundamentally misaligned with corrigibility goals. If the shutdown problem arises *because* of the requirement to maximize a complete utility function, then extending that function (Finalist A) may be akin to debugging code that needs to be rewritten.

  Finalist B's approach questions the axiom of completeness itself. By positing an agent that genuinely lacks a preference between shutdown and non-shutdown trajectories, governed instead by a dominance principle, Finalist B investigates whether corrigibility is possible only outside the EUM framework. This is a higher-risk, higher-reward inquiry into the nature of agency itself. If successful, it does not merely solve the shutdown problem; it expands the decision-theoretic toolkit available for alignment.

  **3. Addressing the Objection to Finalist B**

  I am aware that two board members have raised a serious objection to Finalist B: that an agent which "refuses to rank its own options" constitutes decision-theoretic sleight of hand, and that a system built on incomplete preferences is unshipable.

  This objection must be taken seriously. In standard decision theory, an agent that cannot compare two options is often viewed as irrational or paralyzed. If Finalist B's formalism results in an agent that cannot act decisively in non-shutdown contexts, the model fails.

  However, we must distinguish between *deployment constraints* and *theoretical foundations*. Our fellowship supports dissertation-adjacent *theory*, not immediate deployment. The charge of "sleight of hand" assumes that incomplete preferences cannot be formalized rigorously. Yet, decision theories handling indeterminacy (e.g., E-admissibility or status quo bias models) exist in the literature. Finalist B's task is not to "ship" a product, but to demonstrate whether a coherent mathematical structure for non-ranking agency is possible. Even a negative result—proving that incomplete preferences cannot sustain goal-directed behavior without collapsing back into EUM—would be a foundational advance. It would tell us that we are stuck with EUM and must solve the indifference problem (Finalist A's path) rather than bypassing it. Funding B tests the boundary of the paradigm; funding A works within the boundary.

  **4. Addressing the Objection to Finalist A**

  In recommending B, I do not wish to minimize the merit of Finalist A's proposal. Finalist A offers a rigorous extension of Armstrong-style indifference, and the objection that this "re-answers" a known unresolved question should not be dismissed as a critique of novelty. In formal alignment, resolving a known open problem regarding self-modification stability is precisely the kind of work a fellowship should support.

  However, the outside referee's concern highlights a risk of diminishing returns. If the indifference mechanism is inherently unstable under self-modification—as some no-free-lunch theorems suggest—Finalist A's project may terminate in a proof of impossibility. While valuable, this is less transformative than Finalist B's attempt to construct a viable alternative. Given our charter's emphasis on *advancing foundations*, the project that challenges the underlying axioms of the problem space takes precedence over the project that attempts to optimize within them.

  **5. Conclusion**

  Finalist A offers a path of incremental rigor within a potentially constrained framework. Finalist B offers a path of foundational exploration that risks incoherence but promises to redefine the decision-theoretic landscape of alignment.

  To break the deadlock, I urge the board to interpret "theoretical foundations" as requiring us to fund the investigation of *whether* our current models of agency are the source of the alignment problem, not just how to patch them. I move that we award the fellowship to Finalist B, with the explicit understanding that their milestones must include a rigorous formalization of the "incomplete preference" mechanism to address the board's validity concerns.

  I look forward to discussing this recommendation at Friday's vote.
