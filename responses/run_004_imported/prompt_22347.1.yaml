answer: |-
  For Kierkegaard, the distinction lies between *authority* and *amplification*. A leader assumes responsibility; the press, in "The Present Age," operates precisely by evading it. When the press "conjures" the public, it does not speak with a singular voice that can be held accountable, but rather aggregates anonymous opinions into a phantom entity. If an editor were to say, "I am destroying this man," they would become a concrete individual—a rebel or a tyrant—and thus escape the levelling process. Instead, the press says, "The public demands this," thereby hiding behind the very abstraction it helped manufacture. It is not the author of levelling but its medium; it provides the mechanism by which judgment is detached from the judge, allowing the press to act without ever having to *stand* as an actor.

  Consequently, the "nobody" doing the levelling is actually "everybody" in disguise. The work is performed by the individual in their "small circle" who reads the gossip and feels empowered to condemn without consequence. The press supplies the pretext, but the fuel is the private envy and cowardice of readers who are glad to have their own judgments validated by an "unreal whole." Levelling is therefore a decentralized consensus of irresponsibility. The press makes the abstraction visible, but the individuals make it effective, each pulling a thread of reputation while ensuring their own hands remain invisible.
