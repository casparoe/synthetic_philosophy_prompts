  9.  **Final Polish:** Ensure tone is academic but helpful. Make sure the distinction between *intrinsic basis removal* (fink) and *extrinsic causal blocking* (mask) is highlighted. (Self-check: Is a mask always extrinsic? Usually defined as such in this context, yes. A fink is usually intrinsic mechanism triggered by S).

