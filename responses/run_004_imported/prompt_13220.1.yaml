answer: |-
  This is a classic and painful dynamic often called **"the giver's burnout,"** and you are absolutely right to feel conflicted. It touches on the difference between *explicit agreements* and *implicit expectations.*

  Here is the breakdown of who is right, who is wrong, and how to handle the fallout.

  ### 1. The Core Question: Are you "in the clear"?
  **Yes.** Morally and logically, you are in the clear.

  Generosity only remains generosity if it is voluntary. The moment it becomes mandatory, it ceases to be a gift and becomes a tax. You did not sign a contract, you did not agree to a roster, and you did not accept payment for a service. You acted out of care. Withdrawing that care because you are human and need rest is not a betrayal; it is self-preservation.

  Your friend's argument—that reliability creates entitlement—is a logical fallacy in the context of friendship. If I bring you coffee every morning for three years, you might *expect* it, but you are not *owed* it. If I stop, you might be disappointed, but you cannot claim I broke a promise.

  ### 2. Where your friend has a (small) point
  While your friend is wrong about *obligation*, she is right about *patterns.*

  Human beings are pattern-recognition machines. For three years, you have trained your friend group to operate under a specific system: *User handles the logistics and emotional labor.* They have likely organized their lives around your reliability. They didn't hire a backup driver; they didn't set an alarm; they didn't budget for an Uber, because you are the system.

  When you stepped out of that role, you didn't just cancel a ride; you disrupted their ecosystem. Her hurt feelings are likely real, but they stem from **inconvenience and shock**, not from an actual moral failing on your part. She is mourning the loss of a convenience she had grown dependent on.

  ### 3. The Red Flag in Her Argument
  The most concerning part of what she said is this: *"Once you've reliably done something for people for years, they're entitled to count on it."*

  In a healthy friendship, **no one is entitled to your labor.** That language ("entitled," "count on it," "pull the rug") frames your kindness as a utility service rather than an act of love. If you accept this premise, you are signing up for a lifetime of resentment. If you say "yes" 100 times, the 101st "no" will always be treated as a failure, rather than a boundary.

  ### 4. The Bigger Picture: Reciprocity
  You mentioned you've been doing this for three years. Organizing birthdays, 6 AM runs, emotional check-ins.
  **What happens when you are the one who is wiped out?**
  **What happens when it's your birthday?**
  **Who drives you to the airport?**

  Often, when one person becomes the "group glue," the rest of the group atrophies. They stop learning how to care for each other because they know you will do it. This isn't necessarily malicious on their part; it's just human nature. We take the path of least resistance.

  However, a friendship group where only one person provides the structural support isn't a support network; it's a fan club. You need to observe what happens now that you've stepped back. Do they step up to fill the gap? Or do they let things fall apart and blame you?

  ### 5. How to Move Forward
  You don't need to apologize for saying no, but you do need to manage the transition so you don't lose the friends while saving your sanity.

  *   **Hold the Boundary without Guilt:** Do not say, "I'm so sorry I couldn't make it." Instead say, "I wasn't able to make it this time, but I hope you got there okay." Apologizing implies you did something wrong. You didn't.
  *   **Reframe the Narrative:** If you talk to her again, clarify the dynamic. "I care about you all deeply, which is why I've done these things. But I realized I've been burning myself out to keep things running. I need to be a friend who shows up as a person, not just a planner/driver."
  *   **Stop "Pre-Functioning":** For the next few months, do not volunteer for anything. Wait to be asked. If no one asks, let the thing go un-done. If the birthday isn't organized, let it be a casual hang. If the airport run isn't covered, let them figure out Uber. The group needs to feel the vacuum you leave so they can learn to fill it.
  *   **Watch the Reaction:** This is the litmus test.
      *   **Good Friends:** Will realize they've been leaning on you too hard, apologize for assuming, and start sharing the load.
      *   **Fair-Weather Friends:** Will resent you, call you selfish, or drift away because the "benefits" of your friendship have decreased.

  ### Summary
  You are not in the wrong. You are experiencing the natural consequence of setting a boundary with people who benefited from your lack of them.

  It feels terrible right now because you value being helpful. But if your friendship relies on you being exhausted, it is not sustainable. Let them be hurt for a moment. That discomfort is necessary for them to grow, and for you to find out who actually likes *you*, and who just likes what you *do* for them.
