answer: |-
  This is a genuinely sophisticated historical and legal question. You've correctly identified that Douglass underwent a major evolution in his constitutional theory—moving from the Garrisonian view that the Constitution was a pro-slavery compact to the view that it was a "glorious liberty document" if read according to its text and preamble rather than the "secret intentions" of its framers.

  If we apply Douglass's specific interpretive method (textualism grounded in universal principles) and his later political philosophy (the "Composite Nation"), he would likely **side with you**, but he would dismantle your friend's argument in a way you probably didn't anticipate. He wouldn't just say "inclusion is good." He would argue that your friend's reading violates the structural logic of the 14th Amendment itself.

  Here is the reconstruction of the argument Frederick Douglass would make, based on his writings and speeches from 1860 through 1869.

  ### 1. The Interpretive Method: Text Over "Secret Intent"
  Your friend's argument relies heavily on the legislative history of the 1866 Civil Rights Act and the 14th Amendment—specifically quotes from Senators like Jacob Howard or Lyman Trumbull suggesting "jurisdiction" meant "full political allegiance" and excluding those who owed allegiance to another sovereign.

  Douglass explicitly rejected this method of interpretation. In his 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, he argued that we must not look at the "secret intentions" of the framers, which are unknowable and often contradictory, but at the **plain text** and the **purpose declared in the Preamble**.

  *   **Douglass's Argument:** The 14th Amendment says "All persons born... in the United States." The qualifier is "subject to the jurisdiction thereof."
  *   **The Definition of Jurisdiction:** Douglass distinguished between *political* jurisdiction (the right to vote/hold office) and *territorial* jurisdiction (being subject to the laws). In his view, if you are physically present in the U.S., you are subject to its laws (you can be arrested, tried, and punished). Therefore, you are under its jurisdiction.
  *   **The Rebuttal to Your Friend:** The only people historically understood to be *not* "subject to the jurisdiction" were those with diplomatic immunity (ambassadors) or hostile occupying armies. These groups are not punishable by U.S. courts. Undocumented immigrants *are* punishable by U.S. courts. Therefore, under a plain-text reading, they are under U.S. jurisdiction. To argue otherwise is to import a "secret intention" (that we want to exclude certain ethnic groups) that contradicts the text ("All persons").

  ### 2. The Principle of Reciprocity: Protection and Allegiance
  Your friend argues that because undocumented parents owe allegiance to another country, their children cannot owe allegiance to the U.S.

  Douglass addressed this exact dynamic in his arguments about naturalization and the rights of Chinese immigrants. He viewed allegiance as a reciprocal contract based on **protection**, not bloodline.

  *   **Douglass's Argument:** In *"Our Composite Nation"* (1869), Douglass argued that rights belong to *persons*, not races or lineages. He wrote, "The rights of the human race are one and the same."
  *   **The Reciprocity Clause:** Douglass argued that if the government protects you (via police, courts, infrastructure), you owe it allegiance. Undocumented immigrants live under the protection and coercion of U.S. law. To say they do not owe allegiance is to say they are outside the law entirely—a status Douglass associated with the *Dred Scott* decision.
  *   **The Danger:** Douglass would argue that your friend's interpretation creates a hereditary caste of people who are born on the soil but belong to the nation only by permission. He fought his entire life against the idea that rights could be inherited or denied based on ancestry (*jus sanguinis*). He championed *jus soli* (right of the soil) precisely because it breaks the chain of hereditary status.

  ### 3. The "Composite Nation" and Nativism
  This is where Douglass would cut against both of your assumptions. You argued the clause was to settle citizenship after *Dred Scott*. While true, Douglass would say that limiting the principle to *just* fixing the Black citizenship crisis is too narrow.

  In *"Our Composite Nation,"* Douglass explicitly fought against the rising nativism of the 1860s/70s (specifically the movement to exclude Chinese immigrants). He argued that the U.S. was destined to be a nation of many races and that excluding people based on origin was a violation of the "universal principles" of the Declaration and Constitution.

  *   **Douglass's Argument:** He would view the modern birthright citizenship fight as a direct descendant of the Chinese Exclusion logic. He wrote: *"I want a home here not only for the negro, the mulatto and the Latin races; but I want the Asiatic to have a home here as well as their European and American brethren."*
  *   **The Verdict on "Undocumented":** Douglass would likely argue that the *status* of the parents is a legal violation, but the *citizenship* of the child is a constitutional right. To punish the child for the parent's status is to violate the principle of individual rights. He consistently argued that the Constitution protects individuals, not just groups.

  ### 4. Where He Might Challenge You
  While Douglass would support your conclusion, he might critique your reasoning if it relies *only* on the historical intent to fix *Dred Scott*.

  Douglass believed the Constitution was a **living instrument of universal liberty**. If you argue, "The 14th Amendment was only meant to cover Black Americans," Douglass would say you are making the same mistake as the Garrisonians: limiting the scope of liberty to a specific historical grievance.

  He would argue that the *principle* of the 14th Amendment is broader than the *problem* that spawned it. The text says "All persons." If we limit "persons" to only those the 1866 Congress specifically thought about, we are engaging in the same restrictive interpretation that was used to deny *him* citizenship.

  ### The Verdict

  **Your Friend is Wrong (by Douglass's standards):**
  Douglass would reject the "allegiance elsewhere" argument as a return to *Dred Scott* logic. It creates a class of people permanently subject to U.S. power but permanently denied U.S. membership. He viewed this as tyranny. He would argue that "jurisdiction" means "subject to the laws," which undocumented immigrants clearly are.

  **You are Mostly Right, but with a Caveat:**
  You are right that it is a revisionist reading to exclude these children. However, Douglass would warn you not to anchor your argument *only* in the specific intent to fix Black citizenship. He would argue you must anchor it in the **universal text** and the **principle of equality**.

  **The Douglass Reconstruction:**
  > "The Constitution knows no man by the color of his skin, nor by the status of his father. It asks only: Were you born here? Are you subject to the laws here? If the state can hang you for a crime, it claims jurisdiction over you. If it claims jurisdiction over you, it must grant you the protection of citizenship. To do otherwise is to create a monarchy of privilege where birthright is determined by the secret intentions of legislators rather than the plain text of the law. We fought a war to end the idea that men could be born into subjection; let us not now revive it under a new name."

  **Summary:** Douglass's interpretive method (text over intent) and his political philosophy (anti-caste, pro-Composite Nation) lead directly to supporting birthright citizenship for children of undocumented immigrants. He would view the opposition as a nativist attempt to reintroduce hereditary caste, which violates the "blessings of liberty" secured by the 14th Amendment.
