prompt: |-
  Ok so my friend and I just spent like an hour arguing about birthright citizenship and I need someone to settle it. She was saying "subject to the jurisdiction thereof" in the 14th amendment obviously doesn't cover kids of undocumented immigrants since their parents owe allegiance somewhere else, and I was saying thats a revisionist reading and the whole point of the clause was to settle citizenship broadly after Dred Scott. Somehow we ended up down a rabbit hole about Frederick Douglass, since he was around when the amendment got ratified, and he'd already spent the 1850s hammering out this whole specific theory of constitutional interpretation to break away from Garrison's "covenant with death" crowd -- basically insisting you read the plain text and its general principles, not whatever secret pro-slavery intentions some of the framers might've had. So: given that interpretive method, plus stuff like his later Composite Nation speech defending Chinese immigrants against nativists, what do you honestly think Douglass would say about todays birthright citizenship fight? Don't just tell me "he loved liberty so obviously yes," actually reconstruct the argument he'd make from his own reasoning, and tell me if it cuts against what either of us assumed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and a friend argued about birthright citizenship (14th Amendment, "subject to the jurisdiction thereof").
      *   **Friend's Position:** "Subject to the jurisdiction" excludes children of undocumented immigrants because parents owe allegiance elsewhere (a common originalist/intent-based argument).
      *   **User's Position:** This is a revisionist reading; the clause was meant to settle citizenship broadly after *Dred Scott* (a broader textual/principle-based argument).
      *   **Specific Lens:** The user wants the analysis filtered through *Frederick Douglass's* specific constitutional interpretive method (post-1850s shift from Garrisonian disunionism to textualism/principle-based interpretation) and his later views (e.g., "Composite Nation" speech).
      *   **Constraint:** Do not just say "he loved liberty." Reconstruct the argument based on his reasoning. Determine if it cuts against either the user's or the friend's assumptions.

  2.  **Deconstruct Frederick Douglass's Constitutional Philosophy:**
      *   *Early View (Garrisonian):* The Constitution is a pro-slavery document ("covenant with death").
      *   *Later View (Post-1850s, especially after *Dred Scott* and during Reconstruction):* The Constitution is a liberty document. The text itself, read plainly, does not sanction slavery. We must look at the *words*, not the secret intentions of the framers.
      *   *Key Text:* "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1860).
      *   *Key Principle:* The Preamble ("We the People," "secure the blessings of liberty") sets the purpose. Specific clauses must be read in light of that purpose.
      *   *Post-War View:* The 14th Amendment was necessary to codify what should have been obvious, but the *principle* remains universal.
      *   *Later Speech:* "Our Composite Nation" (1869). He argues for inclusion of Chinese immigrants, Native Americans, etc. He opposes nativism. He argues that rights belong to *persons*, not just specific racial groups.

  3.  **Analyze the 14th Amendment & "Subject to the Jurisdiction Thereof":**
      *   *Text:* "All persons born or naturalized in the United States, and subject to the jurisdiction thereof, are citizens..."
      *   *Historical Context:* Overturning *Dred Scott* (which said Black people couldn't be citizens).
      *   *The "Jurisdiction" Debate:*
          *   Friend's view (Allegiance): Parents owe allegiance to another sovereign, so the child isn't under *complete* US jurisdiction. (Relies on *Elk v. Wilkins* logic regarding Native Americans).
          *   User's view (Broad Settlement): It was meant to be inclusive to prevent a caste system.
      *   *Legal Precedent:* *United States v. Wong Kim Ark* (1898) affirmed birthright citizenship for children of legal permanent residents (Chinese), relying on English common law *jus soli*. It didn't explicitly rule on undocumented immigrants, but the logic leans broad.

  4.  **Synthesize Douglass's Likely Argument:**
      *   *Methodology:* He would reject the "secret intentions" of the 1866 Congress (if some members privately wanted to exclude certain groups) in favor of the *plain text* and the *general principles* of the Reconstruction Amendments.
      *   *Textualism:* "All persons born... in the United States." The qualifier is "subject to the jurisdiction."
      *   *Definition of Jurisdiction:* Douglass distinguished between *political* jurisdiction (voting/office) and *territorial* jurisdiction (obeying laws). If you are physically present, you are subject to the laws (punishable by courts). Therefore, you are under jurisdiction.
      *   *Allegiance:* Douglass argued that allegiance and protection are reciprocal. If the US protects you (police, courts), you owe allegiance. Undocumented immigrants are subject to US laws; therefore, they owe allegiance in the legal sense relevant to the 14th Amendment.
      *   *The "Composite Nation" Angle:* He explicitly fought against the idea that citizenship should be restricted based on origin or race. He viewed nativism as a tool of oppression similar to slavery. Excluding children based on parents' status creates a hereditary caste, which violates the "blessings of liberty."
      *   *Addressing the Friend:* Douglass would likely reject the "allegiance elsewhere" argument as a return to *Dred Scott* logic (creating a class of people permanently outside the law).
      *   *Addressing the User:* Douglass would agree with the broad reading but might caution against relying *only* on the "intent to settle Dred Scott." He would argue the *principle* of the text goes further than just fixing the Black citizenship issue. It establishes a universal rule.

  5.  **Drafting the Response (Iterative Process):**
