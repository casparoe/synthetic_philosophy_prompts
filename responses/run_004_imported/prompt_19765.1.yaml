      *   *Applying to "Jurisdiction":* How would Douglass define jurisdiction? Not as "political allegiance" but as "legal accountability." If you can be arrested, you are under jurisdiction.
      *   *The "Composite Nation" Connection:* Bring in the 1869 speech. He argued against excluding Chinese immigrants. He saw rights as human rights, not privileges of lineage.
      *   *The Verdict:* Who wins the argument?
