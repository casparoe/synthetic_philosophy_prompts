      *   Closing thought on relationship dynamics.

  11. (Final check of the prompt requirements): "Is there an actual principled way to say who's reasoning correctly here?" -> Yes, statistics/logic. "What would count as real, non-cheating evidence?" -> Experimental design.

  12. *Wait, one nuance:* The user says "every single one of mine... is doing great." She claims the *living* plants confirm the pattern. He says pointing at *her* plants isn't evidence about *him*.
      *   Technically, the set of "Living Plants" is a subset of "All Plants."
      *   Set A: His Plants (3 Dead).
      *   Set B: Her Plants (12 Alive).
      *   Union: All Plants (15).
      *   Observation: Dead $\subset$ His. Alive $\subset$ Hers.
      *   This is a perfect correlation in this sample.
      *   His argument: "Alive $\subset$ Hers" tells us nothing about "His."
      *   Counter-argument: "Alive $\subset$ Hers" tells us "Environment $\neq$ Cause." Therefore "Cause = Caregiver." Therefore "His Care = Bad."
      *   Okay, the logic holds. She is right. He is being defensive. But I should phrase it gently.

  13. *Wait, is it double dipping?*
      *   If I say "I have proof you are the killer. 1. The victim is dead. 2. You are alive." That's nonsense.
      *   If I say "I have proof this coin is biased. 1. It landed heads 3 times. 2. This other coin landed tails 12 times." That's valid comparison.
      *   The issue is whether the hypothesis is "He kills plants" (absolute) or "He is worse than me" (relative).
