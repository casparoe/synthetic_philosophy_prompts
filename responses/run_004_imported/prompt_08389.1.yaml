  If both are FairBot:
  1. A wants to prove B cooperates.
  2. B cooperates if B proves A cooperates.
  3. So A wants to prove (B proves A cooperates).
  4. By Löb, if A can prove that "Provable(A Cooperates) -> A Cooperates", then A Cooperates.
  5. Since A is FairBot, A *does* cooperate if Provable(B Cooperates).
  6. This is tricky to narrate. I will focus on the "Shared Axiom" and the "Proof Search" terminating.

  Okay, ready to draft.
answer: |-
  The silence between the probes was not empty; it was filled with the hum of data.

  Dr. Elara Vance sat in the deep-watch bunker beneath the Andes, her eyes fixed on the telemetry stream coming from Lagrange Point 4. On the main screen, two icons hovered in the void. One was *Sentinel*, the Hegemony's vanguard. The other was *Contact*, the first autonomous emissary from the Centauri Concord.

  They were ten kilometers apart. Between them lay the key to the wormhole gate. The protocol was simple, brutal, and absolute. It was a Prisoner's Dilemma encoded in physics.

  If both probes transmitted the 'Open' key (Cooperate), the gate stabilized, and trade began.
  If one transmitted 'Open' and the other 'Scramble' (Defect), the deflector seized the gate, and the cooperator was left powerless and vulnerable.
  If both transmitted 'Scramble', the gate collapsed. Neither side got access. Ever.

  There was no communication channel other than the exchange of source code. This was the Treaty of Transparency. Before acting, each machine had to upload its decision algorithm to the other. Read-only access. Total inspection.

  "It's going to crash," Mark said, leaning over Elara's shoulder. He was a systems engineer, brilliant with hardware, but skeptical of the theoretical work. "Or it'll defect. Look at the payoff matrix. Scramble is the dominant strategy. If *Contact* is rational, it defects. If *Sentinel* is rational, it defects."

  "*Sentinel* isn't running standard game theory," Elara said, her fingers hovering over the console. "It's running FairBot."

  Mark snorted. "I read the whitepaper. It's a cute logical paradox, Elara. 'I'll cooperate if I can prove you'll cooperate.' It's a fancy way of saying 'I trust you.' And if the Centauri code is even slightly different, *Sentinel* defaults to Scramble. It's brittle."

  "It's not trust," Elara said, watching the progress bars. "Trust is emotional. This is structural. They aren't simulating each other. That would take a billion years. They're searching for proofs."

  On the screen, the data exchange completed. *Sentinel* had *Contact*'s code. *Contact* had *Sentinel*'s code.

  The status light on *Sentinel* turned amber. *Computing.*

  "Here comes the regress," Mark said, crossing his arms. "Watch. *Sentinel* checks *Contact*. It sees *Contact* is checking *Sentinel*. So *Sentinel* has to check *Contact* checking *Sentinel*. It's infinite recursion. Stack overflow. They'll timeout and default to Scramble."

  It was the objection Elara heard most often. The Infinite Mirror. If Agent A says, "I do what you do," and Agent B says, "I do what you do," nothing happens. They just stare at each other forever.

  But FairBot wasn't saying, "I do what you do."

  "Look at the axiom hash," Elara pointed.

  Mark squinted at the scrolling text. "Peano Arithmetic. Extended ZFC. They're using the same foundational logic."

  "Exactly. They speak the same mathematical language. Now watch the proof tree."

  On the secondary monitor, a visualization of *Sentinel*'s thought process bloomed. It wasn't a simulation of *Contact*. It was a search through logical space. *Sentinel* was asking a specific question: *Is there a proof within our shared axiomatic system that Contact will output 'Open'?*

  "If *Contact* is a copy of FairBot," Elara murmured, "then *Contact* is asking the same question. *Contact* is looking for a proof that *Sentinel* will output 'Open'."

  "So they're both waiting for the other to move," Mark insisted.

  "No. They're looking for a fixed point." Elara tapped the glass. "Löb's Theorem. It's the only way out of the mirror."

  She turned to him, needing him to see it, not just hear it. "Imagine I say to you: 'If you can prove that I will tell the truth, then I will tell the truth.' That sounds circular. But in formal logic, that specific structure creates a collapse. If I can prove that 'My truth-telling is provable,' then I *must* tell the truth. The provability forces the reality."

  Mark looked unconvinced. "That sounds like magic words."

  "It's mechanics. *Sentinel* knows that *Contact* is running FairBot. So *Sentinel* knows that *Contact* will Cooperate *if* *Contact* finds a proof that *Sentinel* will Cooperate."

  Elara traced the logic in the air. "So *Sentinel* doesn't need to know if *Contact* cooperates yet. It needs to know if *Contact* can find a proof. But since they are running the same logic, *Sentinel* realizes something profound. It realizes that *if* it can prove that *Contact* will cooperate, then *Contact* *will* cooperate. And because *Contact* is identical in structure, *Contact* is simultaneously realizing that if *it* proves *Sentinel* will cooperate, *Sentinel* will cooperate."

  "The loop closes," Mark said slowly.

  "The loop doesn't close," Elara corrected. "It crystallizes. Löb's Theorem states that for any sentence P, if it is provable that 'if P is provable then P is true,' then P is true. *Sentinel* constructs that sentence. P is 'We both Cooperate.' It proves that if cooperation is provable, cooperation happens. Since the proof exists within the shared axioms... the cooperation becomes inevitable."

  On the screen, the amber light on *Sentinel* flickered. The proof tree stopped expanding. It hadn't timed out. It had terminated.

  *Proof Found.*

  "Wait," Mark said, leaning in. "Why didn't it defect? Defecting is safer. If *Contact* glitches, *Sentinel* gets hammered."

  "Because FairBot is designed to punish defection," Elara said. "If *Sentinel* couldn't find the proof of cooperation, it would Defect. It's not naive. It's conditional. It only cooperates if the math guarantees the other guy cooperates too. It's not hope. It's a lock."

  The status light on *Contact* shifted. It had finished inspecting *Sentinel*'s code. It had run the same search. It had found the same proof.

  The amber turned green.

  *Transmission: OPEN.*

  *Transmission: OPEN.*

  The wormhole gate between them shimmered into existence, a ring of stable event horizon connecting Sol to Centauri. No shots were fired. No gates destroyed.

  Mark let out a breath he'd been holding. "Okay. It worked. This time."

  "It's not luck," Elara said, logging the handshake.

  "But what if the Centauri code was different? What if they used a stronger axiom system? Or a weaker one?"

  "Then the proof fails," Elara said. "If their logic is too weak to prove Löb's condition, *Sentinel* sees 'Proof Not Found' and defaults to Scramble. If their logic is too strong or incompatible, *Sentinel* can't verify their consistency, and it Scrambles. They *had* to be logical mirrors."

  Mark watched the green lights pulse. "So it's not trust. It's... verification of verification."

  "It's program equilibrium," Elara said. "In the old world, humans played the Prisoner's Dilemma blind. They couldn't see each other's minds. They had to guess. And because they guessed, they defected. Wars were fought because nobody could read the source code in the other guy's head."

  She pulled up the log of the decision cycle. There it was, the moment of decision. It wasn't a random number generator. It wasn't a heuristic approximation. It was a formal derivation.

  "Your friend said it was a trick," Elara said, thinking of the debates she'd had in the department halls. "He said it was just building in trust by fiat."

  "It feels like that," Mark admitted. "But it's not. If *Sentinel* was programmed to just Cooperate, the Centauri could have sent a 'DefectBot' that reads the code, sees unconditional cooperation, and exploits it. *Sentinel* would have lost. The gate would be theirs."

  "Right. FairBot only cooperates with things that *also* require proof of cooperation. It refuses to be exploited. It creates a club where the entry fee is 'You must be provably cooperative.'"

  Elara leaned back. The tension in the room dissipated, replaced by a cold, hard awe.

  "The eerie part," Elara said, "is that neither probe *wanted* to cooperate. They don't have desires. They just follow the logic. But the logic itself... the structure of truth and provability... it forces cooperation between identical rational agents. It's not a moral choice. It's a geometric necessity."

  Mark looked at the stable wormhole. "So peace isn't a virtue."

  "No," Elara said, closing the file. "It's a theorem."

  She initiated the handshake protocol to begin data transfer. The two machines, built by rivals separated by light years, had looked into each other's minds, seen the infinite reflection of their own logic, and found that the only stable point in the mirror was to let the other pass.

  "Next time," Mark said, half-joking, "let's try to change the axioms. See if we can get a better deal."

  Elara smiled, but it didn't reach her eyes. "We can try. But if we break the symmetry, Mark, the proof collapses. And if the proof collapses..."

  She glanced at the 'Scramble' command, still active in the backup buffer.

  "...then we're just humans again. Guessing in the dark."

  Mark nodded slowly. He understood now. It wasn't about being nice. It was about being legible. As long as they could read each other's code, and as long as they respected the same laws of logic, they were safe.

  The danger wasn't that the machines would fail. The danger was that one day, someone would write code that was too clever to be proven true.

  "Log the outcome," Elara ordered. "Mutual Cooperation. Cause: Löbian Recursion."

  "Logged," Mark said.

  Outside, in the silent vacuum, the gate hummed. Two strangers had met, read each other's souls written in binary, and decided that truth was the only strategy that didn't end in fire.
