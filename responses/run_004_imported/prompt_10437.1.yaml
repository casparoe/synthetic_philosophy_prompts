      *   Is the advice practical?

  7.  **Final Polish:** (Mental check of the "Generation vs. Verification" dynamic in AI).
      *   Actually, in AI safety, there's a concept called "verification is harder than generation" (e.g., it's easy to write fake news, hard to verify truth). But in *creative* work, generation is being automated.
      *   The cousin's specific claim: "Generation is hard, Verification is easy."
      *   AI reality: "Generation is now cheap, Verification (taste) is the bottleneck."
      *   So the cousin got the economic implication backwards. If generation becomes cheap, generators get paid less. If verification remains human, verifiers (curators/directors) hold value.
