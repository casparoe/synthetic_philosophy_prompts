answer: |-
  This dialogue recreates the famous 1958 debate between H. L. A. Hart (Sam) and Lon Fuller (Nora) regarding the "grudge informer" cases in post-war Germany. Here is an adjudication of the argument move by move, followed by an assessment of what is missing and a final verdict.

  ### Move-by-Move Adjudication

  **(1) Nora:** Nora opens with the Natural Law position: *lex injusta non est lex* (an unjust law is no law). She argues that extreme immorality strips a rule of legal character, so punishing the woman is not retroactive.
  *   **Advantage:** **Nora.** She sets the moral stakes clearly. Her intuition aligns with the deep human desire to deny legitimacy to tyrannical regimes. However, she asserts this as a definition without yet defending how judges should determine the threshold of "unjust."

  **(2) Sam:** Sam counters with Legal Positivism. He distinguishes between "law as it is" and "law as it ought to be." He argues that calling the Nazi statute "law" is factually accurate, and hiding retroactive punishment behind a fiction undermines legal honesty.
  *   **Advantage:** **Sam.** This is the stronger analytical point. He correctly identifies that denying the statute was law obscures the moral choice being made. If you punish her, you are effectively creating a new obligation retroactively; calling the old one "non-law" is a semantic sleight of hand that risks confusing the concept of legal validity.

  **(3) Nora:** Nora challenges the positivist "mark" of law. She argues that form (enactment, publication) is insufficient if the content is tyrannical. She claims positivism is the fiction, not her view.
  *   **Advantage:** **Nora.** She successfully highlights the moral hazard of Sam's position. If "law" is merely a matter of paperwork, then legal theory offers no resistance to tyranny until it is too late. This forces Sam to defend why form matters more than substance.

  **(4) Sam:** Sam argues from stability and institutional role. If judges can void laws based on moral "wickedness," the law becomes unpredictable. He notes the statute was clear to the actors at the time.
  *   **Advantage:** **Sam.** This is a crucial practical warning. Subjective judicial moralizing threatens the Rule of Law itself. By separating law and morals, positivism allows citizens to know clearly when they are facing a moral dilemma versus a legal one. Sam wins on the need for certainty.

  **(5) Nora:** Nora shifts from substantive morality (wicked content) to procedural morality (broken system). She argues the Nazi regime failed the basic requirements of lawfulness (secret directives, arbitrary application), so it wasn't a legal system at all.
  *   **Advantage:** **Nora.** This is her strongest move ( Fuller's "internal morality of law"). She undermines Sam's claim that the statute was "clearly worded and consistently applied." If the system operated on terror and secret directives, Sam's "ordinary marks" of law were not actually present. This makes her claim ontological, not just moral.

  **(6) Sam:** Sam concedes the system was flawed but returns to institutional competence. He argues that nullifying past statutes is legislative work. A new democracy should pass a retroactive statute openly rather than having courts rewrite history.
  *   **Advantage:** **Sam.** This is the checkmate. Even if Nora is right that the old system was broken, the remedy lies with the legislature, not the judiciary. Courts declaring past statutes "non-law" sets a dangerous precedent for judicial supremacy. Sam wins on the separation of powers and democratic legitimacy.

  ### What Both Are Missing

  1.  **The Radbruch Formula:** Both omit Gustav Radbruch's synthesis, which influenced the actual German courts. Radbruch argued that positive law loses legal character only when the contradiction between law and justice reaches an "intolerable level." This bridges Nora's moral threshold with Sam's need for a test.
  2.  **Political Reality:** Sam assumes a legislature would willingly pass a retroactive criminal statute. In a fragile new democracy, this is politically toxic; courts often must clean up transitional injustices that legislators won't touch.
  3.  **The Specific Charge:** The woman was convicted under the 1871 Penal Code (which remained in force) for unlawful deprivation of liberty, not under the Nazi statute. The court ruled the Nazi statute provided no *justification* for her act because it was void. This technicality sidesteps some of the retroactivity issues both discuss.
  4.  **Efficacy vs. Validity:** They treat "law" as a binary switch. In transition periods, legal validity is often a matter of degree and perspective (internal vs. external views of the legal system).

  ### Final Verdict

  While Nora captures the moral imperative and correctly identifies the procedural failures of the Nazi regime (Move 5), Sam provides the more robust framework for restoring the Rule of Law. His insistence on institutional honesty (Move 2) and separation of powers (Move 6) protects the new democracy from the very judicial arbitrariness they condemn in the old regime. Calling law "law" allows for clear moral condemnation without corrupting the concept of legal validity.

  \answer{Sam}
