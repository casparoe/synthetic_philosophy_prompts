answer: |-
  This is an exceptionally sharp critique that cuts to the epistemological core of Lewis's project. You have identified the precise friction point: Lewis's theory is fundamentally *epistemic* (relying on states of knowledge and belief) while contemporary digital normativity is often *structural* or *algorithmic* (relying on visibility metrics and feed curation).

  If we were to summon Lewis to defend his framework against the phenomenon of TikTok trends or Twitter (X) etiquette, the conversation would likely hinge on three specific adjustments he would need to make regarding **Common Knowledge**, **Population**, and **Salience**.

  Here is how a Lewisian analysis would likely map onto internet-scale conventions, and where it might fracture.

  ### 1. The Relaxation of Common Knowledge (The "Reason to Believe" Move)
  You are correct that strict, iterative Common Knowledge (CK)—*I know that you know that I know...*—is almost impossible to establish in anonymous, asynchronous digital spaces. However, you might be holding Lewis to his 1969 formulation in *Convention* too strictly.

  In his later paper "Languages and Language" (1975), Lewis explicitly relaxed the requirement. He moved from strict CK to **"common reason to believe."** He argued that what matters is not the infinite mental recursion, but that there is a public signal that gives everyone a reason to believe the regularity holds, and a reason to believe that everyone else has that same reason.

  **Lewis's Likely Response:**
  He would argue that platform affordances (like "Trending" bars, view counts, or viral retweets) function exactly as the **public signals** required to generate this "reason to believe."
  *   **The Signal:** When a meme format becomes ubiquitous, the "Trending" tag acts as a focal point (a Schelling point).
  *   **The Epistemology:** I don't need to know *you* specifically saw the meme. I need a reason to believe *you* have a reason to believe the meme is salient. The public metric provides that.
  *   **Verdict:** Lewis would likely "bite the bullet" here. He would argue that algorithmic aggregation *is* the mechanism by which common knowledge is approximated at scale. The "black box" of the algorithm replaces the "face-to-face" encounter as the generator of mutual expectation.

  ### 2. The Fragmentation of Population $P$
  Lewis defines a convention relative to a population $P$ in a recurrent situation $S$. Your concern about "stable populations" is well-founded. The "Internet" is not a population; it is a infrastructure.

  **Lewis's Likely Response:**
  Lewis would insist that we are misidentifying the population. Conventions do not form on "the Internet"; they form in **sub-populations** that function as Lewisian communities.
  *   **Niche Conventions:** The convention of how to use "bold text" in a Discord server is a Lewisian convention. The convention of how to tag content on Tumblr is another.
  *   **Overlapping Memberships:** Just as I follow driving conventions in my city and queuing conventions in my local pub, I follow "LinkedIn etiquette" (professional, polished) and "4chan etiquette" (anonymous, abrasive).
  *   **The Limit:** Lewis would admit that when a norm is *too* fragmented (e.g., an algorithmic feed that shows me one reality and you another), a shared convention cannot form. If the algorithm prevents us from sharing the same "situation $S$," we cannot coordinate. This suggests that **filter bubbles are convention-killers** in the Lewisian sense. If we cannot see the same regularity, we cannot form the mutual expectations required for convention.

  ### 3. The Problem of Manipulation and "False" Salience
  This is where Lewis's theory faces its hardest challenge. Lewisian conventions are **contingent** and **self-perpetuating**. We drive on the right because you drive on the right. But on social media, norms are often **engineered**.

  If a platform artificially boosts certain content to train user behavior (e.g., Instagram pushing Reels to kill TikTok), is the resulting behavior a convention?
  *   **Lewis's Criteria:** A convention requires that I prefer to conform *on the condition that others conform*.
  *   **The Digital Twist:** If I post a Reel because the algorithm punishes static images, I am not coordinating with *you*; I am coordinating with the *system*.
  *   **The Verdict:** Lewis might argue this is **not a convention** but a form of **compliance** or **constraint**. If the "coordination problem" is solved by code enforcing behavior rather than mutual expectation solving a coordination equilibrium, it falls outside his definition. This suggests a genuine limitation: Lewis's theory cannot easily distinguish between *organic convention* and *algorithmic coercion* without a robust account of user agency.

  ### 4. Stability vs. Velocity
  Lewis emphasizes *recurrent* situations. Conventions take time to stabilize. Internet norms (e.g., the lifespan of a specific meme format) often evolve faster than the "common knowledge" can solidify.

  **Lewis's Likely Response:**
  He would likely distinguish between **conventions** (stable, like emoji semantics) and **fads** (unstable, like specific dance challenges).
  *   **Emoji:** The meaning of the 🍆 or 💀 emoji is a Lewisian convention. It is stable, arbitrary (could have been something else), and solves a coordination problem (communication).
  *   **Memes:** Specific meme templates might be too fleeting. However, the *meta-convention* of "remixing culture" is stable.
  *   **Revision:** Lewis might concede that in high-velocity environments, we operate on **probability matching** rather than common knowledge. We act as if a convention holds because the probability is high enough, not because we have secured the epistemic grounding.

  ### Conclusion: Expansion, Not Abandonment
  If Lewis were addressing your seminar today, I suspect he would **not** abandon the theory. He was a Humean pragmatist; if the concept does the work, keep it.

  He would likely argue that internet norms **are** conventions, but they reveal that **Common Knowledge is a technological achievement, not just a mental state.**
  1.  **Platform Affordances** replace face-to-face salience.
  2.  **Metrics** replace direct observation of behavior.
  3.  **Sub-communities** replace the "general public."

  **However, he would concede one major limitation:**
  His theory struggles when the "coordination problem" is obscured by **asymmetric information**. In Lewis's driving example, we all see the road. On social media, the platform sees the road, and we only see what it shows us. If the mediator (the algorithm) has interests that diverge from the population (e.g., engagement farming vs. clear communication), the "coordination equilibrium" is distorted.

  **For your seminar:**
  You might propose that digital norms require a **tripartite model** rather than Lewis's dyadic one. It isn't just Person A and Person B coordinating; it is Person A, Person B, and **The System**.
  *   If The System is neutral (a passive road), Lewis holds.
  *   If The System is active (a feed curator), Lewis's "Common Knowledge" condition is compromised because the "public signal" is potentially manipulated.

  This suggests you don't need a "thinner" notion of mutual expectation, but rather a **more suspicious** one. We might have "common reason to believe," but we no longer have "common reason to trust the source of the belief." That is the distinctively modern twist on Lewis that his framework anticipates but cannot fully resolve.

  **Suggested Reading to bolster this argument:**
  *   **Brian Skyrms, *The Evolution of the Social Contract*:** Extends Lewis using evolutionary game theory, which handles large populations and weaker knowledge conditions better.
  *   **Cailin O'Connor, *The Misinformation Age*:** Directly addresses how social structure and signaling break down in networked environments.
  *   **Kate Crawford, *The Atlas of AI*:** For the argument that algorithmic systems are not neutral mediators but active participants in norm formation.
