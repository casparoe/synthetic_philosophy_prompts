      *   *Geometers/Figures:* Geometers distinguish figures (triangles, circles) by their properties (angles, radii). Two figures are distinct if their defining properties differ. Leibniz is saying substances are distinct like geometric figures: by their internal conceptual content, not just by being "two" of them.

