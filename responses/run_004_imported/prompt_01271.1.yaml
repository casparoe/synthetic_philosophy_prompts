          *   Analogy: Doomsday Machine or Ulysses Pact.
          *   The predictor predicts the *output of the algorithm*, not the *desires of the agent*.
      *   **Address the "Hollow Reaction":** The reaction isn't hollow if it's computationally inevitable. The "cost" is real (resources spent), even if the "loss" (surrogate destroyed) is utility-neutral.
      *   **Conditions for Success:**
          1.  Transparency (Predictor must see the code/policy).
          2.  Irrevocability (Agent cannot change policy after threat).
          3.  Updatelessness (Agent doesn't update on the threat to change strategy).
      *   **Limitations:** It fails if the agent can self-modify cheaply or if the predictor doubts the commitment.
      *   **Conclusion:** It works against sophisticated predictors *if* the agent is structurally bound. It fails against sophisticated predictors *if* the agent retains the ability to optimize locally at the moment of retaliation.

