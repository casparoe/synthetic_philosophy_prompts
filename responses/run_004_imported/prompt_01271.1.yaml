      *   *Key Distinction:* Instrumental vs. Terminal value. The surrogate has no terminal value, but defending it has instrumental value (upholding the policy that deters threats to real values).
      *   *Wait, one more nuance:* If the threat is already made, and the surrogate is destroyed, does the agent retaliate? In FDT, yes, because your decision *now* is logically linked to the predictor's decision *then*. If you decide "Don't retaliate," the predictor would have predicted "Don't retaliate" and thus would have attacked the real goal. To make the predictor attack the surrogate, you must be the type that retaliates.

  9.  **Final Structure:**
      *   **Direct Answer:** The defense relies on *policy selection* (FDT/UDT), not *preference*. It works against sophisticated predictors if the commitment is credible.
      *   **The Core Confusion:** CDT (act on current preferences) vs. FDT (act on best policy).
