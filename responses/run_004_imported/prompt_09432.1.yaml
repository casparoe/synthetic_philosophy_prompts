      *   *Self-Correction on Time:* 600 words is short for 10 minutes. I will note this in the output but prioritize the word count constraint requested by the user. (Actually, better to just write the 600 words as requested; the user knows the constraints).

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* dry. The "inspiring" part needs to come from the weight of responsibility. The hook is: "We tell you the truth about law so you can bear the weight of it."

      *Drafting thought:* Use the metaphor of a map. A map shows the terrain, even the swamps. It doesn't tell you where you *should* go, but you can't navigate without it.

      *Refining the "Grudge Informer" angle:* Don't name drop Hart explicitly, but use the logic. "When the statutes are wicked, the silence of the law is not your excuse."

      *Final check on Natural Law:* Ensure I don't imply morality is *in* the law. Morality is *applied to* the law by the lawyer.

