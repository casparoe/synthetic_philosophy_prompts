answer: |-
  Class of 2024, families, faculty, and friends.

  Congratulations. You have survived the Socratic method, the briefing cases, and the endless pressure of finals. You are now entering a profession that demands not just technical skill, but moral courage.

  In this room, there are people who know my work. They know I have spent a career arguing for a difficult truth: that law and morality are not the same thing. In a moment of inspiration, you might want to hear that an unjust law is no law at all. It is a comforting thought. It suggests that if the statute is wicked, it loses its authority, and your conscience is clear.

  I cannot tell you that. Not because I do not care about justice, but because I care about honesty.

  When we pretend that immorality strips law of its validity, we blind ourselves to reality. A wicked statute is still a statute. It still carries the force of the state. It still commands police, judges, and prisons. To deny this is not noble; it is dangerous. If you believe a bad law is "no law," you may underestimate its power to hurt. You may walk into a courtroom unprepared for the violence the system can inflict while remaining perfectly "legal."

  So, if law is not necessarily justice, why become a lawyer? Why not walk away?

  Because the separation of law and morality does not separate law from *responsibility*. In fact, it heightens it.

  If law and justice were identical, you would be mere automatons, applying a perfect system. But because they are distinct, you are moral agents. When the law is just, you uphold it. When the law is wicked, you must recognize it clearly for what it is: a valid command that demands moral resistance.

  Hart wrote of a "minimum content" of natural law, rooted in human vulnerability. We are fragile. We can be hurt. We need rules to survive. The law provides the structure for that survival. But structure is not purpose. You provide the purpose.

  Consider the grudge informers of the past—citizens who used valid laws to destroy their neighbors. After the tyranny fell, courts had to decide: were those informers criminals? To say the laws they followed were "no law" was a fiction. The truth was harder: the laws were valid, but the people who wielded them were guilty. The law provided the weapon, but the hand that swung it was human.

  That hand could have stayed still.

  This is the burden you accept today. You will draft contracts, prosecute crimes, and defend rights. Sometimes, the law will align with your conscience. Sometimes, it will not. My hope is not that you will always find justice written in the code. My hope is that you will have the clarity to see when it is missing, and the courage to act anyway.

  Do not hide behind the validity of a rule to excuse its cruelty. Do not confuse what *is* with what *ought to be*. Keep them separate, so that when you fight for the "ought," you know exactly what you are fighting against.

  Clarity is not cynicism. It is the only solid ground on which to build a just world.

  Go forth. Read the law clearly. Judge it morally. And never confuse the two.

  Thank you.
