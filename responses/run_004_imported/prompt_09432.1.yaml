      *   **Tone:** Genuinely moving, intellectually honest (positivist), morally urgent (without conflating validity with morality).

  2.  **Deconstruct the Philosophical Position (Hartian Positivism):**
      *   *The Separation Thesis:* Law and morality are conceptually distinct. A law can be legally valid but morally reprehensible.
      *   *Why this matters:* If we say "unjust law is no law," we might ignore the reality of state power. We need to recognize wicked laws *as* laws to confront them honestly.
      *   *The Moral Stake:* Because law *is* powerful, lawyers have a heightened moral responsibility. The clarity of the law allows us to judge it clearly.
      *   *Key Hart Concepts to hint at (subtly):* The "minimum content of natural law" (survival requires rules), the "Grudge Informer" (post-war German cases where people were punished for following Nazi laws—Hart argued it's better to pass a retroactive statute than lie and say the Nazi law wasn't law).
      *   *The Inspiring Angle:* The courage to face the law as it *is*, so you can fight for what it *ought to be*. Clarity is a tool for justice, not an obstacle.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion. Set the stage. Avoid clichés about "light and justice" immediately.
      *   **The Tension:** Address the elephant in the room. Many expect law and justice to be the same. They aren't always.
      *   **The Positivist Pivot:** Why is distinguishing them actually *better* for justice? Because it prevents complacency. If law *is* justice, we stop checking. If law *isn't* necessarily justice, we must remain vigilant.
      *   **The Responsibility:** The lawyer's role. You are the mechanics of the system. You have the power to change it, but only if you understand it.
      *   **The "Minimum Content":** Hint at the shared human need for order/survival without invoking divine/natural law.
      *   **Closing:** A call to action based on clarity and courage.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Welcome everyone. You think law = justice. My career says no. A bad law is still a law. But that doesn't mean you obey it blindly. It means you see it clearly. If you call it "no law," you hide its power. If you call it "wicked law," you can fight it. You are going to be lawyers. You will see unjust laws. Don't pretend they aren't laws. Admit they are, and change them. That is true courage.

  5.  **Drafting - Iteration 2 (Refining Tone and Philosophy):**
      Need to make it sound like a speech, not a lecture. Needs emotional resonance.
      *   *Key phrase:* "Clarity is not cynicism."
      *   *Key concept:* The danger of blurring the line.
      *   *Reference:* The Grudge Informer (subtly). The idea that we must own our moral choices even when the law permits evil.

  6.  **Writing the Content (incorporating constraints):**
      *   *Word Count Check:* Keep an eye on the counter.
      *   *Philosophical Check:* Ensure I don't say "unjust laws are invalid." Instead, say "unjust laws demand moral resistance *despite* their validity."
      *   *Emotional Check:* Needs to make the grads feel like heroes, not bureaucrats. The heroism comes from *honesty*.

  7.  **Review against Advisor's Persona:**
      *   She hates "unjust law is no law." -> *Check.*
