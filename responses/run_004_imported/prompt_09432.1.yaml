prompt: |-
  So my PhD advisor is a hardcore Hart-style legal positivist -- her first book basically defends the seperation thesis against Fuller -- and she just got asked to give her law school's commencement speech this spring, and for reasons unclear to me shes roped me into drafting it with her. The problem is every version that actually sounds inspiring ends up reaching for some flavor of the "an unjust law is no true law" move (MLK/Augustine style, get the grads fired up to go be warriors for justice), and she keeps cutting it because that's literally the natural law position she's spent her career arguing is confused -- for her a wicked statute is still perfectly valid law, full stop, that's kind of the whole point of separating law from morality. But she also really doesn't want 400 grads plus all their parents plus a bunch of colleagues who've read her work walking out thinking law has nothing to do with justice, because that's not her view either -- she's always going on about Hart's "minimum content of natural law" stuff and loves bringing up the grudge informer case in seminar. Can you draft something like 600 words that's genuinely moving, doesn't smuggle in the natural-law line she'll delete, and doesn't collapse into "law is just whatever the powerful say" either? She's got about 10 minutes at the podium.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD Advisor (hardcore Hart-style legal positivist).
      *   **Audience:** Law school graduates, parents, faculty (some familiar with her work).
