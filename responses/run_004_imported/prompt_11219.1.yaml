answer: |-
  **Title:** The Thinness of Truth: Why Gödel Cannot Save Substantivism

  The conservativeness objection to deflationism is often presented in philosophy classrooms as a decisive knockout punch. The narrative is seductive in its simplicity: Deflationists claim truth is a "thin" logical device, merely a tool for disquotation or generalization. If truth is truly this insubstantial, adding a truth predicate to a formal system like Peano Arithmetic (PA) should not allow us to prove any new arithmetic theorems that were not already provable in PA alone. This requirement is known as *conservativeness*. However, Gödel's incompleteness theorems show that a theory of truth *can* prove the consistency of PA ($Con(PA)$), while PA cannot prove its own consistency. Therefore, the theory of truth is non-conservative. Therefore, truth must be a substantive property doing heavy metaphysical lifting. Q.E.D.

  This argument is elegant, but it is fundamentally mistaken. It rests on a category error that conflates *metaphysical thinness* with *proof-theoretic weakness*. The conservativeness objection does not refute deflationism because deflationism was never committed to the claim that truth must be proof-theoretically inert. By rejecting conservativeness as a necessary condition for deflationism, we can preserve the core deflationary insight—that truth is not a robust natural property—while acknowledging that the logical machinery required to express truth inevitably expands our deductive power. The Gödelian argument does not show that truth is "meaty"; it shows that logic is powerful.

  To understand why the objection fails, we must first grant its initial plausibility. Why did deflationists ever feel pressured to accept conservativeness in the first place? The intuition stems from the idea that truth is merely a linguistic device. If I say " 'Snow is white' is true," I haven't described the world any differently than if I just said "Snow is white." The predicate "is true" seems to vanish upon analysis. If the predicate is logically redundant in this way, it feels intuitive that adding it to a mathematical system shouldn't allow a mathematician to derive new facts about numbers. If a truth theory allows you to prove new arithmetic facts, it looks as though "truth" is acting like a new mathematical axiom—like adding the Axiom of Choice or a large cardinal assumption—rather than a mere logical tool. The objection assumes that if truth were truly deflationary, it would be a "free lunch" that adds no caloric content to the theory.

  However, this intuition confuses the *nature* of the property with the *consequences* of adding the vocabulary. Deflationism is a thesis about metaphysics and semantics, not a thesis about proof theory. The deflationist claim is that there is no single, unified property shared by all true sentences that explains why they are true (unlike, say, "magnetism," which explains why iron filings move). The deflationist says "true" is just a device for infinite conjunction or semantic ascent. Nothing in this definition entails that adding the device to a formal language must leave the set of provable theorems unchanged.

  The strongest deflationist comeback lies in identifying the actual source of the non-conservativeness. When we move from Peano Arithmetic to a theory of truth over Peano Arithmetic (often called $PA(T)$), we do two things: we add axioms defining truth (like Tarski's T-sentences), and crucially, we extend the *induction schema* to include formulas containing the truth predicate. It is this extension of induction, not the "substantive nature of truth," that allows the proof of $Con(PA)$.

  Consider the analogy of logic itself. If I add the vocabulary of set theory to arithmetic, I can prove more arithmetic theorems. Does this mean "set membership" is a substantive metaphysical property in a way that threatens deflationism about logic? No. It means I have expanded the expressive resources of my language, allowing me to formulate new inductive hypotheses. Similarly, when we add a truth predicate, we gain the ability to generalize over sentences. We can say things like "For all sentences $x$, if $x$ is an axiom of PA, then $x$ is true." This generalization is impossible in the base language of PA alone. The ability to prove $Con(PA)$ arises because the truth predicate allows us to formalize the soundness of PA within the system. This is a gain in *logical expressiveness*, not a discovery of a new *metaphysical ingredient*.

  The conservativeness objection essentially argues: "If truth were thin, it wouldn't let you do new things." The deflationist response is: "Truth is thin, but it lets you talk about *syntax* and *generalizations* that were previously inexpressible." The new theorems derived (like $Con(PA)$) are indeed arithmetic statements, but they are derived using new *logical* rules regarding the truth predicate. That the conclusion is about numbers does not mean the premise was about a substantive property of numbers. It means the logical bridge built by the truth predicate connects existing arithmetic facts in a way that was previously inaccessible.

  Furthermore, demanding conservativeness sets a bar that is arguably too high for *any* logical concept. If we strictly enforced conservativeness, we might have to argue that logical connectives themselves are substantive if their introduction allows for new derivations in complex systems. The deflationist view is that truth is akin to the universal quantifier ("for all"). Adding a quantifier doesn't describe a new object in the world, but it drastically changes what you can prove. We do not accuse the universal quantifier of being "metaphysically heavy" just because it allows for more powerful deductions. To demand that truth be conservative is to demand that it be useless. A truth predicate that could not generalize over an infinite set of sentences would not be a deflationary truth predicate; it would be no truth predicate at all.

  Ultimately, the Shapiro-Ketland style objection mistakes a technical feature of formal systems for a metaphysical insight. The fact that a truth theory is non-conservative demonstrates that the concept of truth is *logically potent*, not that it is *metaphysically robust*. Deflationism survives because it never claimed truth was logically impotent; it claimed truth was not a causal, explanatory property lurking in the fabric of reality. Gödel's theorems show us the limits of formal systems, and they show us that adding semantic concepts expands those limits. But they do not show that "truth" is a heavy, substantive property waiting to be discovered by metaphysicians. The conservativeness objection fails because it tries to solve a metaphysical question with a proof-theoretic ruler. Truth remains thin, even if the logic required to express it is strong.
