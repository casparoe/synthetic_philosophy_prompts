          *   *Strengths:* Distinguishes between *alien* manipulation (against your will) and *self*-binding (for your will). This is the crucial distinction in autonomy theory. It reframes the debate from mechanism to teleology (ends).
          *   *Weaknesses:* Assumes the user *actually* endorses the end at the moment of action. Apps might lock users into goals they no longer want (subscription traps). But as a theoretical point, it's robust.
          *   *Assessment:* Excellent synthesis. Saves the argument by shifting the criterion from "mechanism" to "alignment of will." Score: High positive.

