      *   *Is calibration the only goal?* In lending, often the goal is to maximize profit subject to fairness constraints, or minimize risk subject to fairness constraints. Calibration is good for interpretability, but thresholding drives decisions.
      *   *The "Base Rate" Defense:* Courts often scrutinize whether base rate differences are themselves the result of discrimination. I need to emphasize this.

  7.  **Final Polish:** (Reviewing against safety guidelines)
