answer: |-
  Your intuition is not only correct; it aligns with some of the most rigorous critiques of Bayesian foundationalism in contemporary epistemology. You have identified the precise fault line where the Dutch Book Argument (DBA), even in its depragmatized form, fractures under philosophical scrutiny.

  To argue for your position: **Depragmatized Dutch Book Arguments fail to establish probabilistic coherence as an *epistemic* norm because they rely on a bridge principle regarding the aggregation of fairness that is normatively equivalent to the additivity axiom itself. Consequently, the argument is circular regarding the norm it seeks to justify, and it remains tethered to decision-theoretic consistency rather than truth-tracking accuracy.**

  Here is the argument broken down into three core components supporting your view.

  ### 1. The Aggregation Gap and the Smuggling of Additivity

  The core of your objection concerns the move from individual assessments to joint evaluations. Let's formalize the "depragmatized" move to see exactly where the smuggling occurs.

  In a classic DBA, if an agent's credences violate the probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), a bookie can construct a set of bets that the agent deems "fair" individually but which guarantee a loss jointly. The depragmatized version (championed by philosophers like Brian Armendt and David Christensen) attempts to sanitize this by removing the actual loss. It argues that the defect lies in the **evaluative state**: the agent *regards* a package of bets as fair when, in fact, the package is objectively unfair (because it guarantees a loss).

  However, for this judgment to hold, one must accept the following **Bridge Principle**:

  > **BP:** If a set of bets $\{B_1, B_2, ...\}$ are each individually fair according to an agent's valuations, then the package $B_{total} = \sum B_i$ must be fair (or at least, not guaranteed to lose).

  The problem is that **BP is not a logical truth; it is a substantive normative claim about how value aggregates.** To assert that the fairness of the parts entails the fairness of the whole is to assert that the value function governing these bets is linear. In the context of betting quotients, linearity *is* the additivity axiom of probability.

  By insisting that an agent *ought* to regard the package as unfair because the sum of the individual fair prices leads to a loss, the DBA presupposes that the agent *ought* to value the package as the sum of its parts. But why ought they? If an agent has incoherent credences, they effectively operate with a non-additive value function. To tell them they are defective because their value function isn't additive is to assume the conclusion (that they ought to be additive/coherent) in the premise (that they ought to value packages additively).

  As you noted, this smuggles in the very axiom the argument is meant to justify. Without an independent justification for **BP**, the DBA has no normative force against an agent who denies additivity.

  ### 2. The Failure to Bridge Pragmatic and Epistemic Norms

  Even if we grant the Bridge Principle, the depragmatized DBA still fails to show an *epistemic* failing. It shows a *normative* inconsistency, but not necessarily an *epistemic* one.

  Epistemic norms are fundamentally concerned with the relationship between belief and truth (or evidence). A belief is epistemically defective if it is unjustified, inaccurate, or fails to track the world. Pragmatic norms, conversely, concern the satisfaction of desires, goals, or decision-theoretic consistency.

  The depragmatized DBA removes the *money*, but it keeps the *bets*. It remains an argument about **decision-theoretic consistency**. It demonstrates that incoherent credences lead to a conflict in an agent's dispositions to choose. However, there is no necessary link between "being disposed to choose inconsistently" and "representing the world inaccurately."

  Consider the following distinction:
  *   **Accuracy:** My credence in $H$ is 0.8, and $H$ is true. My credence is accurate.
  *   **Coherence:** My credence in $H$ is 0.8, and my credence in $\neg H$ is 0.3. I am incoherent.

  The DBA tells me that my pair of credences $\{0.8, 0.3\}$ sanctions a defective betting package. It does not tell me that $0.8$ is the wrong degree of belief for $H$ given the evidence. I could have perfect evidence for $H$ and $\neg H$ (in a paraconsistent logic scenario, for instance) and arrive at these numbers. The DBA flags a structural defect in how I *act* on those beliefs, not a defect in the beliefs' relation to the world.

  To claim this is an *epistemic* defect requires an additional premise: **That the norms governing rational betting are identical to the norms governing rational belief.** This is the thesis of *Probabilism*. But the DBA is supposed to *prove* Probabilism, not assume it. By relying on betting fairness to diagnose belief defects, the argument presupposes that belief *just is* a disposition to bet. If one rejects this identification (as many epistemologists do), the depragmatized DBA loses its grip on epistemology entirely.

  ### 3. The Existence of Coherent Non-Additive Systems

  The strongest evidence for your position is the existence of coherent, rational frameworks that explicitly reject the Bridge Principle.

  Systems like **Dempster-Shafer theory** or **Imprecise Probabilities** allow agents to represent ignorance or ambiguity in ways that violate classical additivity (e.g., $P(A) + P(\neg A) < 1$). Agents using these systems do not regard the "guaranteed loss" package as defective in the same way a Bayesian does. They argue that the "loss" arises only if one forces a precise price on a situation that warrants imprecision.

  If a Dempster-Shafer agent rejects the Bridge Principle, the Dutch Book Argument cannot demonstrate that they are *irrational*; it can only demonstrate that they are *non-Bayesian*.

  For the DBA to work as a foundational epistemic argument, it must show that *any* rational agent must accept the Bridge Principle. But it cannot do this without circularity. It would have to argue: "You must accept that the fairness of a package is the sum of its parts because... if you don't, you are incoherent." This is plainly question-begging.

  Therefore, the DBA cannot establish coherence as a universal epistemic norm. It can only establish it as an internal consistency requirement for agents who *already* subscribe to additive valuations.

  ### Conclusion

  Your skepticism is well-founded. The depragmatized Dutch Book Argument attempts to elevate a pragmatic inconsistency into an epistemic norm, but it lacks the machinery to cross that gap.

  1.  **Circularity:** It relies on a Bridge Principle (individual fairness implies joint fairness) that is normatively equivalent to the additivity axiom it seeks to prove.
  2.  **Category Error:** It diagnoses defects in decision-theoretic dispositions (betting) and labels them as defects in representational states (belief) without independent justification.
  3.  **Alternative Coherences:** It fails to rule out non-additive systems that are internally coherent but reject the aggregation principle.

  Consequently, the Dutch Book Argument, even in its refined depragmatized form, remains a pragmatic consistency check for bettors, not a foundational justification for epistemic rationality. It shows that incoherent agents are vulnerable to a certain kind of evaluative conflict, but it does not show that their credences are inherently defective as guides to the truth. To establish that, one requires an argument grounded in accuracy rather than fairness (such as Jim Joyce's Accuracy Dominance argument), which avoids the betting metaphor entirely. Until then, your assessment stands: the DBA fails to close the gap between practical imprudence and epistemic defect.
