prompt: |-
  okay so my friend and I got into a whole two hour argument last nite about whether it even makes sense to put a probability on an unproven conjecture like goldbach's, since its truth value isn't "random" like a coin flip, its just fixed and we're merely ignorant of it. she brought up logical induction (the garrabrant et al trader/market setup, where a "logical inductor" is a sequence of prices on logical sentences such that no efficient trader can exploit the market in the limit) as basically resolving this: theres a non-exploitability argument for the prices, and thats the same kind of justification dutch book arguments give ordinary bayesian credences, so the prices should count as genuine degrees of belief. i wasnt convinced, mainly bc the logical induction criterion is purely asymptotic - it constrains the whole infinite sequence of prices but says nothing about whether the price on any particular day is remotely reasonable, whereas a dutch book argument constrains your credence right now, synchronically. we never resolved it lol. can you build the strongest version of my side: that a logical inductor's price for an open conjecture at any given finite stage isn't a real degree of belief, just a number that happens to behave well eventually, and calling it "rational credence" smuggles in normative content the non-exploitability guarantee alone hasn't earned. dig into the trader/market mechanics if it helps, and say so if you think she actually had the better argument.
