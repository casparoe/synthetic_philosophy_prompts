      2.  Deploy *ELP* (Morality System) to critique *didacticism*.
      3.  Deploy *Truth and Truthfulness* to support *acknowledging harm*.
      4.  Deploy *On Opera* (Manifest Artifice) to critique *naturalism*.
      5.  Deploy *S&N* (Tragic Necessity) to reframe the ending.
      6.  Offer a synthesis: A Williamsian production would show the violence clearly but refuse the moral verdict.

  9.  (Drafting response...) *Ensure I mention that Williams was a leftist/socialist, so "art shouldn't be political" is definitely not his vibe.* This helps debunk the friend's accusation directly.

