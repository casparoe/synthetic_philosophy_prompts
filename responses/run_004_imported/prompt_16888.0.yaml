      Why is this worse than Finks? Because for Finks, the failure was that $B$ was *lost*. RCA explicitly demands $B$ be held fixed. For Masks, $B$ *is* held fixed, yet the counterfactual is still false. To fix it, you need to hold fixed "no masks." But "no masks" is defined in terms of the disposition. Circularity.

