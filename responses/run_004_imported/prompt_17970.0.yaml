      *   *The Diagnosis:* Why does Reflection seem to demand this? Because it treats future credence as *evidence* about the truth. If I know I'll believe $X$, that's usually because I'll have seen proof. But if I'll believe $X$ because I forgot the disproof, my future belief is *not* good evidence.
