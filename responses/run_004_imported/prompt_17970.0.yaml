      *   *Does Reflection apply?* Van Fraassen's original formulation assumes the future self is reached via *conditionalization* on new information. Forgetting is the *loss* of information.
      *   *Key Distinction:* Reflection is often motivated by the idea that the future self is an "epistemic expert." If the future self is *less* informed, they aren't an expert in the relevant sense.
      *   *Technical Detail:* The principle relies on the assumption that the partition of future credences is a sufficient statistic or that the transition is via conditionalization. Forgetting violates the "no loss of information" assumption inherent in standard conditionalization models.

