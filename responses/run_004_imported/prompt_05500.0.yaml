answer: |-
  This is an incredibly difficult and painful position to be in, and your feelings are valid. To answer your question directly: **You are likely thinking more clearly about the current reality of your relationship than he is.**

  Here is a breakdown of why your perspective holds more weight right now, along with an analysis of the arguments he is using.

  ### 1. The "Property" Argument is Reductive
  Your husband is using a common talking point from the ethical non-monogamy (ENM) community: that jealousy is a social construct based on ownership. While there is truth to the idea that society teaches us monogamy as the only valid model, reducing intense emotional pain to "leftover thinking about property" is dismissive.

  Jealousy is not just an ideology; it is a **signal**. In attachment theory, jealousy often signals a fear of abandonment or a threat to the security of a primary bond. Telling you to ignore that signal is like telling someone to ignore pain when they touch a hot stove. The pain isn't "wrong"; it's information telling you that a boundary may have been crossed or a need isn't being met.

  ### 2. "Exposure Therapy" Requires Consent and Pacing
  He is comparing this to exposure therapy. In clinical psychology, exposure therapy is effective *only* when:
  *   The patient consents to the process.
  *   The exposure is graded (started small, not thrown in the deep end).
  *   There is support and processing time between exposures.
  *   The patient can stop if it becomes traumatic.

  If you are "sick with jealousy" (a somatic, physical response), you are currently in a state of high distress. Pushing through that without addressing the root cause isn't therapy; it's endurance. If he is the one benefiting from the exposure (going on dates) while you endure the pain, the power dynamic is unbalanced.

  ### 3. Your Intuition About Bias is Correct
  You wrote: *"Part of me thinks it's awfully convenient for him to believe that since he's the one who wanted this."*

  **Trust this part of yourself.** It is objectively true that his bias is engaged. He is experiencing the reward (novelty, connection, autonomy) while you are experiencing the cost (anxiety, fear, loneliness). When one partner bears the cost and the other reaps the reward, the person paying the cost usually has a clearer view of the risks. He is motivated to believe the jealousy will fade because the alternative is stopping something he wants to do. You are motivated to listen to the pain because you are feeling it.

  ### 4. The Child Factor Changes the Stakes
  You are absolutely right that having a three-year-old changes the equation. When you are a childless couple, the primary risk of opening a marriage is to your own hearts. When you are parents, the stability of the family unit is a tangible asset that protects your child.

  If this arrangement leads to resentment, separation, or a volatile home environment, the child pays the price. Your instinct that the stakes are higher is not "insecurity"; it is responsible parenting. Theoretical discussions at 1:00 AM often fail to account for the logistical and emotional weight of raising a child together.

  ### 5. Who is Thinking Clearly?
  *   **He is thinking clearly about his desires,** but he is thinking **ideologically** about your pain. He is applying a theory ("jealousy is a construct") to a living, breathing emotional crisis.
  *   **You are thinking clearly about the relationship's health.** You are noticing the discrepancy between theory and reality. You are noticing the physical toll. You are noticing the shift in stakes.

  ### What Should You Do?
  You do not have to "tough this out." Ethical non-monogamy requires *more* communication and care than monogamy, not less. If the current arrangement is causing you physical sickness, the current arrangement is not working.

  1.  **Hit Pause:** You are allowed to ask for a pause on outside dating. A "pause" is not a "ban." It is a request to stabilize the primary relationship before venturing out again. If he loves you, he should be willing to pause to ensure you aren't suffering.
  2.  **Reframe the Conversation:** Move away from "Who is right about jealousy?" to "What do we need to feel safe?" Ask him: *"I understand you see this as practice, but right now it feels like damage. How can we prioritize my sense of security without you giving up your autonomy forever?"*
  3.  **Check for Coercion:** If you ask to pause and he refuses, or if he continues to make you feel "wrong" for being hurt, that is a major red flag. Ethical opening requires an enthusiastic "yes" from both parties, not just the absence of a "no."
  4.  **Seek Specialized Support:** Consider seeing a therapist who specializes in non-monogamy. A standard therapist might pathologize the open marriage; a poly-friendly therapist can help you distinguish between "growing pains" and "fundamental incompatibility."

  **Summary:** Your feelings are data, not defects. Your husband is relying on a script that works for some people but is hurting you. Prioritize the stability of your family and your own mental health over the "success" of the open marriage experiment. It is okay to close the marriage back up if the cost is too high.
