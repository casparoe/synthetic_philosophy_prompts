      *   *Nuance:* Make sure to distinguish between *undermining* confidence and *destroying* it. The user asks about "epistemic weight," not necessarily total abandonment.
      *   *Nuance on Singer:* They argue that *self-evidence* is the marker. If an axiom is self-evident upon reflection, evolution can't debunk it because its justification is internal to reason. But Street would say evolution shaped what we find "self-evident."

  7.  **Final Polish:** Ensure clear headings and precise terminology. (e.g., distinguishing between *substantive* moral claims and *formal* rational constraints).

