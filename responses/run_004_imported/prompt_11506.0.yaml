  6.  **Self-Correction/Nuance Check during Drafting:**

      *   *Check:* Did I represent Street correctly? Yes, she's a constructivist. She thinks the dilemma kills realism.
      *   *Check:* Did I represent EA usage correctly? EAs often act like moral realists (there *is* a most good thing) while using evolutionary psychology to clear away bias. This is the tension.
