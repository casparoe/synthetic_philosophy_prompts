answer: |-
  This is a sophisticated and well-targeted critique. You have identified a significant asymmetry in how evolutionary debunking arguments (EDAs) are often deployed within the Effective Altruism (EA) and rationalist communities. The standard move is to use EDAs as a solvent for *parochial* intuitions (kin preference, in-group bias) while treating *impartial* intuitions (scope-sensitivity, temporal neutrality) as foundational axioms revealed by reason.

  As you note, Sharon Street's Darwinian Dilemma is a general argument against moral realism, not a selective tool for pruning only the inconvenient branches of the moral tree. If evolutionary forces shaped our evaluative attitudes, the pressure applies to the entire system, including the utilitarian calculus used for cause prioritization.

  Here is an analysis of the implications for the epistemic weight of your impartial intuitions, followed by an assessment of the de Lazari-Radek and Singer defense.

  ### 1. Implications for Epistemic Weight in Cause-Prioritization

  If we accept that the EDA applies generally to impartial, aggregative intuitions just as it does to parochial ones, the implications for EA reasoning are substantial. They do not necessarily entail abandoning cause prioritization, but they demand a shift in *how* that prioritization is justified.

  **A. Shift from Realism to Constructivism or Pragmatism**
  The most immediate implication is that you cannot treat impartiality and scope-sensitivity as "mind-independent moral facts" that you have successfully detected after clearing away evolutionary noise. If Street is right, there are no such independent facts to track.
  *   **Epistemic Weight:** You must lower the *realist* confidence in these axioms. You cannot claim, "It is objectively true that a life in Africa is worth as much as a life in Europe."
  *   **Alternative Foundation:** The weight must shift to *coherence* or *pragmatic necessity*. Impartiality becomes a constitutive norm of what it means to engage in moral *reasoning* rather than a description of moral *reality*. The epistemic weight comes from the fact that we cannot argue for partiality without implicitly appealing to impartial standards of argumentation (a Habermasian or Korsgaardian move).

  **B. Vulnerability to "Adaptive Impartiality" Explanations**
  EA reasoning often assumes that impartiality is the "null hypothesis" once bias is removed. However, evolutionary psychology offers "adaptive link accounts" for impartiality-like behaviors too.
  *   **Large-Scale Cooperation:** Impartial rules (e.g., "treat all tribe members fairly") may have been selected for to reduce internal conflict and facilitate coordination in larger groups, not because they track moral truth.
  *   **Signaling:** Displaying scope-sensitive concern can be a costly signal of cognitive capacity or cooperative intent.
  *   **Epistemic Weight:** If impartiality itself has a plausible fitness-enhancing explanation that does not require truth-tracking, the *presumption* that impartial intuitions are more reliable than parochial ones is weakened. You cannot simply assert that impartiality is "rational" and parochialism is "evolutionary"; both are products of the same evolutionary cognitive architecture. This requires you to treat impartial axioms as *hypotheses* to be tested in reflective equilibrium, rather than *foundations* that are immune to scrutiny.

  **C. Increased Reliance on Reflective Equilibrium**
  If neither parochial nor impartial intuitions are automatically truth-tracking, the method of justification must change from "intuitionism" to "wide reflective equilibrium."
  *   **Epistemic Weight:** The weight of an impartial intuition (e.g., "save the many rather than the few") depends on its coherence with other considered judgments, background theories of psychology, and metaphysical commitments. It is not self-justifying. This makes cause-prioritization more fragile; if the web of belief shifts, the prioritization might too.

  ### 2. Assessing the de Lazari-Radek and Singer Defense

  In *The Point of View of the Universe* (2014), Katarzyna de Lazari-Radek and Peter Singer attempt to rescue utilitarianism from EDAs. Their argument is Sidgwickian: while evolution selected for specific moral norms (don't kill kin, help the tribe), it selected for the *capacity for rational reflection* generally. They argue that when we exercise this capacity fully, we arrive at Sidgwick's axioms (impartiality, prudence) because these are requirements of rationality itself, not direct targets of selection.

  Does this escape the dilemma, or relocate the burden?

  **The Case for Escape:**
  De Lazari-Radek and Singer argue that EDAs only undermine beliefs that are *directly* shaped by evolutionary pressure for fitness. They draw a distinction between:
  1.  **Substantive Norms:** (e.g., "incest is wrong") – Vulnerable to EDA.
  2.  **Formal Rational Constraints:** (e.g., "treat like cases alike") – Not directly selected; they are byproducts of the capacity to reason.

  They claim that just as evolution selected for the ability to do math, but didn't determine that $2+2=5$, evolution selected for reasoning but didn't determine that partiality is rational. Therefore, the self-evidence of impartiality, grasped through reason, remains intact.

  **The Case for Relocation (The Stronger Critique):**
  Your suspicion that this merely relocates the evidential burden is well-founded and aligns with Street's likely rebuttal.

  1.  **The Reliability of Reason:** Street's dilemma applies to logical and mathematical beliefs as much as moral ones (though she grants we might keep them for pragmatic reasons). If evolution shaped our cognitive faculties for survival, why trust that "rational reflection" leads to truth rather than fitness-conducive coherence? If the *capacity* for reason is an adaptation, the *outputs* of that capacity (including the "self-evidence" of Sidgwick's axioms) are suspect. The burden shifts from "Is this moral intuition true?" to "Is this rational process truth-tracking?"—which is the same question one level up.
  2.  **The Gap Between Formal and Substantive:** Even if we grant that "treat like cases alike" is a formal requirement of reason, it does not necessarily lead to *hedonic utilitarianism* or *scope-sensitivity regarding welfare*. One could treat like cases alike within a deontological framework or a virtue ethics framework. The move from "rational consistency" to "maximize aggregate welfare" relies on substantive intuitions about the good (i.e., that pleasure/welfare is the only intrinsic good). Those substantive intuitions remain vulnerable to the EDA.
  3.  **Self-Evidence as an Evolutionary Byproduct:** What we perceive as "self-evident" may simply be the point where our evolutionary programming makes alternative thoughts cognitively difficult or socially costly. The feeling of objective necessity could itself be an adaptive mechanism to enforce cooperation norms.

  **Verdict:**
  The de Lazari-Radek and Singer argument **does not fully escape the dilemma; it relocates the burden.** It successfully insulates *formal* consistency from direct evolutionary debunking, but it fails to protect the *substantive* axioms required for EA cause-prioritization (specifically, that welfare is the good and that it aggregates linearly).

  By grounding impartiality in "rational capacity," they assume that rational capacity is a truth-tracking faculty in the moral domain. Street denies this. To accept their defense, you must already accept a form of moral realism that claims rational reflection accesses moral truths—a premise the EDA was intended to challenge.

  ### Summary for Your Reasoning

  1.  **Epistemic Weight:** You should treat your impartial, scope-sensitive intuitions as **provisional and coherence-dependent**, rather than as self-evident truths discovered after clearing away bias. They carry less *foundational* weight than EA literature often implies.
  2.  **Meta-Ethical Stance:** You cannot consistently use EDAs to discard parochialism while claiming realist status for impartiality. You are likely operating as a **moral constructivist**: you choose impartiality not because it is "out there," but because it is the only normative framework that survives idealized reflection or best serves your goals.
  3.  **Singer's Defense:** View the Sidgwickian defense as a **mitigation strategy**, not a solution. It protects the *form* of your reasoning but leaves the *content* vulnerable. It saves the *method* of utilitarianism but does not guarantee the *truth* of its axioms against a thoroughgoing evolutionary skeptic.

  **Practical Upshot:** This does not require you to stop doing cause prioritization. However, it requires intellectual humility. You are not "discovering" the most good; you are "constructing" a consistent framework for doing good, acknowledging that the blueprint (impartiality) is chosen for its rational coherence and pragmatic utility, not because evolution allowed you to see the moral fabric of the universe.
