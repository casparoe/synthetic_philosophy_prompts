prompt: |-
  I keep noticing a move in effective altruist and rationalist writing that I don't think gets scrutinized enough: people invoke evolutionary debunking arguments, in the style of Sharon Street's Darwinian Dilemma, to discount parochial moral intuitions—favoring kin, tribe, or the present generation—as better explained by what Street calls an "adaptive link account" (the disposition was fitness-enhancing regardless of whether its content was true) than by a "tracking account" on which our ancestors were actually detecting independent evaluative facts. Yet the same style of explanation seems just as available for the impartial, aggregative intuitions that cause-prioritization work depends on (that a benefit's moral weight doesn't depend on who receives it, that more welfare is better than less), and Street intended her dilemma as a fully general argument against realism, with no built-in exemption for whichever intuitions happen to be impartial rather than parochial. Please describe the most important implications of this for how much epistemic weight I should give my own impartial, scope-sensitive intuitions when they are doing load-bearing work in cause-prioritization reasoning, and assess whether Katarzyna de Lazari-Radek and Peter Singer's Sidgwickian attempt to save axioms such as impartiality and temporal neutrality—by treating them as byproducts of a general rational capacity rather than direct targets of selection—genuinely escapes the dilemma, or merely relocates the same evidential burden one level up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user notices a pattern in EA/rationalist writing: using evolutionary debunking arguments (EDAs), specifically Sharon Street's "Darwinian Dilemma," to dismiss *parochial* moral intuitions (kin preference, tribalism, present bias) as fitness-enhancing but truth-untracking.
      *   **The Problem:** The user argues this same EDA logic applies equally well to *impartial, aggregative* intuitions (impartiality, scope-sensitivity, temporal neutrality) which are foundational to EA cause prioritization. Street's argument is general against realism, not specific to parochialism.
      *   **Task 1:** Describe the most important implications for the epistemic weight one should give impartial, scope-sensitive intuitions in cause-prioritization.
      *   **Task 2:** Assess whether de Lazari-Radek and Singer's Sidgwickian defense (impartiality as a byproduct of rational capacity, not direct selection) escapes the dilemma or just relocates the burden.

  2.  **Analyze the Philosophical Landscape:**

      *   **Sharon Street's Darwinian Dilemma:** If moral realism is true, evolutionary forces shaped our evaluative attitudes. Either (1) evolution tracked independent moral truths (unlikely/coincidental), or (2) evolution shaped attitudes for fitness regardless of truth (undermines justification). Street concludes we should be constructivists, not realists.
      *   **EA/Rationalist Usage:** Often used to say "Our gut says save the village, but evolution says save kin. So ignore the gut, use utilitarianism."
      *   **The User's Critique:** Why trust the utilitarian gut? Evolution might have selected for general rule-following, cooperation, or cognitive shortcuts that *look* like impartiality but aren't truth-tracking.
      *   **De Lazari-Radek & Singer (2012/2014):** They argue that while specific norms (don't lie, help kin) are selected, the *capacity* for rational reflection is selected. When we reflect rationally on morality, we arrive at Sidgwick's axioms (impartiality, prudence). Therefore, these axioms are products of reason, not direct evolutionary pressure, escaping the EDA.
      *   **Counter-arguments:** Is "rational capacity" itself tainted? Is the move from "capacity" to "specific axioms" justified without begging the question?

  3.  **Drafting Task 1: Implications for Epistemic Weight:**

      *   *Implication 1: Humility/Deflation.* If EDAs apply generally, confidence in utilitarian axioms drops. We can't claim they are "obviously true" in a realist sense.
      *   *Implication 2: Coherence over Correspondence.* Justification shifts from "tracking mind-independent facts" to "internal coherence" or "pragmatic utility." EA reasoning becomes more constructivist.
      *   *Implication 3: Vulnerability to Alternative Explanations.* We need to check if impartiality itself has an adaptive explanation (e.g., large-scale cooperation, signaling, cognitive byproduct). If impartiality is also adaptive, the "tracking" claim is weakened.
      *   *Implication 4: Methodological Shift.* Less reliance on "intuition pumps" and more on reflective equilibrium or procedural justification.

  4.  **Drafting Task 2: Assessing de Lazari-Radek & Singer:**

      *   *Their Argument:* Evolution selected for *reasoning*, not specific moral content. Reasoning leads to universalizability (Kant/Sidgwick). Therefore, impartiality is safe.
      *   *Strengths:* Distinguishes between specific norms (vulnerable) and formal constraints (potentially safe). Aligns with the idea that math/logic aren't debunked by evolution.
      *   *Weaknesses (The "Relocation" Charge):*
          *   Did evolution select for *truth-tracking* reason or *fitness-tracking* reason? (Street's point applies to logic too, arguably).
          *   Is the jump from "rational capacity" to "hedonic utilitarianism" justified? Why Sidgwick and not Kant? Or why not error theory?
          *   *The Relocation:* Yes, it relocates the burden. Instead of "Is this intuition true?", it's "Is this rational process truth-tracking?" If evolution shaped the rational process for fitness, the worry remains.
      *   *Verdict:* It mitigates the problem but doesn't fully escape it. It relies on a specific view of rationality that realists accept but constructivists/skeptics might challenge.

  5.  **Synthesizing and Refining the Argument:**

      *   *Tone:* Philosophical, rigorous, acknowledging the sophistication of the user's prompt.
      *   *Structure:*
