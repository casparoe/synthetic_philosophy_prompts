answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain streaks the windowpane. Two philosophers, ELARA (Bratmanian) and MARCUS (Gilbertian), are finishing a pot of coffee. Elara has a copy of *Shared Intention* dog-eared on the table; Marcus has *Joint Commitment*.*

  **Elara:** So, the hiker case. Lena and Tom. "Shall we?" "Yeah, let's." Then the storm hits, Lena bails silently, Tom gets stranded. You think this is the nail in the coffin for the planning theory?

  **Marcus:** I think it's the nail in the coffin for the idea that shared intention is *just* a structure of individual attitudes. Look at Lena. On your view, she just changed her mind. She formed a new intention: "I will go down." She assumed Tom would follow. She was wrong. It's a coordination failure, sure. But on my view, she did something morally thicker. She broke a bond.

  **Elara:** Hold on. "Just changed her mind" makes it sound trivial. It isn't. For Bratman, shared intention isn't static. It requires *mutual responsiveness*. Lena failed that. She didn't just update her individual plan; she failed to track *our* plan. She treated "we summit" as a background condition she could discard without signaling. That violates the norm of consistency in her own planning architecture. She intended "that we summit," then she acted in a way that made that impossible, without updating Tom. That's irrationality, Marcus. And interpersonal irrationality looks a lot like wrongdoing.

  **Marcus:** But *why* is it irrational? That's the question. On your account, the obligation Lena owes Tom is derived from the norms of individual planning. Be consistent. Don't frustrate your own means. But Tom isn't a means to Lena's plan. He's a partner. When they said "Shall we?", they didn't just align their mental states. They created a *plural subject*. A "we" that is distinct from the "I"s. Once that exists, Lena cannot rescind the commitment unilaterally. It's not that she *can't* physically walk down; it's that she has no *right* to dissolve the "we" without Tom's say-so.

  **Elara:** There it is. The metaphysical inflation. You're positing a new entity—a "plural subject"—to explain a normative force that I can explain with cognitive architecture and social norms. You say she has no right to dissolve the "we." I say she has no right to frustrate Tom's reliance on her stated intention without notice. The verdict is the same: Lena owes Tom an apology. She owes him an explanation. But I don't need to conjure a group mind to get there. I just need to show that her individual intention was essentially interdependent. Her plan *was* "We summit, via me doing X and him doing Y." When she drops X without telling him, she renders her own intention incoherent.

  **Marcus:** But is the apology owed because Tom's expectations were frustrated, or because Lena betrayed a commitment? Suppose Tom didn't care about summiting. Suppose he was indifferent. On your view, if Tom had no strong intention to summit, Lena's change of plan doesn't frustrate much. Does she still owe him?

  **Elara:** If Tom had no intention to summit, then there was no shared intention to begin with. No meshing sub-plans.

  **Marcus:** Exactly! But on my view, the *joint commitment* holds even if individual preferences shift. That's the point of the commitment! It binds us *against* our fluctuating individual whims. Lena decided privately that turning back was sensible. Maybe she was right! Maybe it was dangerous. But she didn't have the authority to make that call for the *us*. The obligation comes from the joint commitment itself, not from the success of the coordination. She wronged him because she treated a joint obligation as a private choice.

  **Elara:** Okay, but let's press on the formation. "Shall we?" "Yeah, let's." You call that a joint commitment. I call it an expression of individual intentions that become common knowledge. But here's the weak spot for you, Marcus: What if Tom was lying? What if he said "Yeah, let's" but privately thought, *I'm going to ditch her at the ridge*?

  **Marcus:** If he lacked the willingness to be jointly committed, then no plural subject was formed. Gilbert is clear on that. There must be common knowledge of *willingness*.

  **Elara:** But how do we verify willingness? On my view, we look at the behavior. Did they coordinate? Did they adjust pace? In the first two hours, Lena and Tom *did* coordinate. They acted as a unit. That behavioral meshing confirms the shared intention. On your view, if Tom was secretly lying, the "plural subject" never existed, even if they walked in lockstep for two hours. That seems to disconnect the social reality from the metaphysical claim.

  **Marcus:** It's not a disconnect; it's a distinction between *acting together* and *being committed to act together*. But let's turn the knife on your view, Elara. You rely on "common knowledge." Lena assumed Tom would agree to turn back. She thought, *He's sensible, he'll follow.* In her mind, she was updating the shared plan to "We descend." She thought she was being responsive to what *we* would want. On Bratman's view, if she genuinely believed her sub-plan meshed with his (even if she was wrong), did she really violate the norms of shared intention?

  **Elara:** She violated the *common knowledge* condition. She didn't communicate. You can't update a shared plan in the dark. Shared intention requires that the structure be out there, open. By keeping her decision private, she kept the "new plan" from being shared. So the original shared intention wasn't updated; it was abandoned.

  **Marcus:** But *why* does keeping it private matter so much? Is it just an epistemic glitch? Or is it because she stepped outside the authority of the plural subject? I argue it's the latter. She treated the commitment as hers to revoke. That's the specific wrong. It's not just that Tom got cold; it's that she usurped a authority she didn't have.

  **Elara:** I'm worried that your "authority" is just a fancy word for "expectation of reliability." But let's try this from my end. You say the obligation is *sui generis*. Irreducible. But does that cash out in different advice for Lena? If she comes to you for absolution, do you tell her something different than I would?

  **Marcus:** I tell her: "You didn't just let Tom down. You broke a promise inherent in the 'we'." You tell her: "You failed to coordinate your planning states."

  **Elara:** And the practical difference is...?

  **Marcus:** The difference is in the *rebuke*. Tom has a right to rebuke Lena. Not just, "You were unreliable," but "Who do you think you are, deciding for us?" On your view, the rebuke is about reliability. On mine, it's about standing. Tom speaks for the plural subject when he rebukes her.

  **Elara:** I see the appeal. It captures the emotional sting. But I worry you're reifying the sting into a metaphysical object. Look, I spent twenty years watching African wild dogs hunt. Cooperative hunting. They coordinate beautifully. They flank prey, they signal, they adjust. If one dog breaks off early, the hunt fails. The others... well, they don't file lawsuits. But the coordination breaks.

  **Marcus:** And do the dogs have a plural subject?

  **Elara:** I doubt it. They have interlocking intentions. They track each other. If Lena and Tom are just sophisticated dogs, my view explains the coordination failure without the metaphysical baggage.

  **Marcus:** But humans *feel* the obligation. The dogs might feel frustration, but Tom feels *betrayed*. He feels a normative violation, not just a predictive error. He thinks Lena *ought* not to have left. That "ought" is the target. Bratman explains the "ought" as a derivative of individual rationality. I explain it as the glue of the social world. If you reduce it to individual rationality, you lose the special force of *joint* action. You make it sound like two strangers trying not to bump into each other in a hallway.

  **Elara:** But isn't that what we are? Two individuals trying not to bump into each other, just with more complex planning? Here's where I feel the pressure on my own view, though. If Lena had signaled—say, she yelled "Heading down!" and Tom didn't hear her because of the wind—then on my view, she tried to be mutually responsive. She failed due to noise. Did she wrong him then?

  **Marcus:** On my view, yes. Unless the joint commitment is dissolved, she is bound. Even if she yelled, if Tom didn't *agree* to dissolve the commitment, she's still going rogue.

  **Elara:** That seems too rigid. If she signaled, she did her part. The shared intention dissolves if the communication channel breaks, provided she took reasonable steps.

  **Marcus:** But who decides what's reasonable? The individual? Or the pair? That's the trap, Elara. If Lena decides what's reasonable, she's back to being the sole authority. If the pair decides, how do they decide without... a joint commitment?

  **Elara:** They decide through the meshing of plans! If the plan was "Stay together unless communication fails," then she followed the plan.

  **Marcus:** But where did *that* plan come from? Implicitly, from the nature of the joint commitment. You're smuggling my plural subject in through the back door of "implicit sub-plans."

  **Elara:** *Laughs.* Maybe. Or maybe you're dressing up implicit sub-plans in a trench coat and calling it a plural subject. But let's get to the verdict. Lena didn't yell. She slipped away.
  Did she wrong Tom?

  **Marcus:** Yes. She violated the joint commitment. She owes him more than an apology for being cold. She owes him recognition that she had no right to decide for the "us."

  **Elara:** I agree she wronged him. But I ground it in the violation of the interlocking intention. She intended "We summit," then acted "I descend," without updating the interlock. She made her own agency incoherent relative to the shared context.

  **Marcus:** So we agree on the verdict. Lena owes Tom. But we disagree on *who* is owed.

  **Elara:** How so?

  **Marcus:** I say she owes the *plural subject*. She damaged the "us." You say she owes *Tom*. She damaged his reliance.

  **Elara:** That... actually might matter. If she owes the "us," then even if Tom forgives her, the debt remains to the relationship itself. If she owes Tom, and Tom says "It's fine," then the ledger is clear.

  **Marcus:** Precisely! If Tom says, "Don't worry about it," on my view, Tom is being gracious, but the violation of the joint commitment stands until they *jointly* agree to wipe the slate. He can't unilaterally forgive a joint wrong, because the wrong was against the jointness.

  **Elara:** That feels... heavy. Almost too heavy for a hiking trip. Are you saying they need a formal reconciliation to restore the agency of the pair?

  **Marcus:** I'm saying that trust isn't just individual reliability. It's the security of the commitment. If Lena thinks, "Oh, Tom forgave me, so nothing happened," she hasn't learned the lesson. She needs to understand that she broke the *bond*, not just disappointed a friend.

  **Elara:** And on my view, if Tom forgives her, it means he no longer relies on her for that specific planning structure. He updates his individual intention to "We are no longer summiting partners." The shared intention ceases because one of the interlocking pieces is removed. The "debt" is cleared because the normative force comes from the active planning structure. No structure, no obligation.

  **Marcus:** So for you, forgiveness kills the shared intention. For me, forgiveness acknowledges the breach but restores the commitment.

  **Elara:** That's a genuine difference. Not just description. It changes how we think about repair.

  **Marcus:** It does. But admit this, Elara: Your view struggles to explain why Lena feels *guilt* rather than just *regret*. Regret is "I wish I hadn't done that." Guilt is "I wronged *you*."

  **Elara:** I can explain guilt as the emotional response to violating interpersonal norms of reliability. It's not pretty, but it doesn't require a metaphysical "we."

  **Marcus:** But the "we" is the only thing that explains why she feels bound to a stranger she met on the trail, provided they formed a joint commitment. Individual reliability doesn't scale to *obligation* that easily.

  **Elara:** Maybe not. But your "plural subject" risks becoming a black box. We put "Shall we?" in, and "Obligation" comes out, without knowing the gears. My gears are visible: intentions, beliefs, knowledge.

  **Marcus:** And my gears are social: commitment, authority, standing. Look, we might not resolve the metaphysics today. But regarding Lena and Tom?

  **Elara:** She should have yelled.

  **Marcus:** She should have asked.

  **Elara:** Same thing, functionally.

  **Marcus:** Not metaphysically. One is information transfer. The other is seeking consent from a sovereign entity.

  **Elara:** *Sips cold coffee.* The sovereign entity being... the two of them together.

  **Marcus:** Exactly.

  **Elara:** Well. As long as we agree Lena is buying the first round of drinks when they get back to town.

  **Marcus:** Agreed. Though on my view, they should drink *together*. Re-establishing the plural subject.

  **Elara:** On my view, they just need to mesh their sub-plans for "getting warm."

  **Marcus:** *Smiles.* I suppose I can live with that description. For now.
