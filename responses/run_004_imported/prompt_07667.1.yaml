      *   **Section 1:** Did a shared intention exist? (Gilbert: Yes, Joint Commitment. Bratman: Yes, Interlocking Intentions).
      *   **Section 2:** The Breach. (Gilbert: Unilateral rescission forbidden. Bratman: Failure of mutual responsiveness).
      *   **Section 3:** The Wild Dog Analogy (User nod).
      *   **Section 4:** The Verdict & The "Owe".
      *   **Outro:** Lingering disagreement on the *source* of the norm.

