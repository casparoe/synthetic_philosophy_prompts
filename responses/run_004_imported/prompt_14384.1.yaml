prompt: |-
  My favorite former PhD student is getting married in a few weeks and asked me to give the toast — terrifying, since her whole dissertation argued Kalai-Smorodinsky beats Nash as a theory of justice, and half the room is her old game theory cohort who'll clock it instantly if I fumble the axioms (the other half is family who've never heard of a Pareto frontier). Write me a five minute toast that uses the KS solution as its actual spine, not a punchline: I want the monotonicity axiom (your slice shouldn't shrink just because my opportunities grew) and the 'utopia point' doing real work as a way of describing what she and her fiance have, versus Nash, which never looks at what either of you dreamed you could get. One good bargaining joke — it has to land as warm for the non-academics and not embarassing for the theorists, don't let it turn into a lecture on IIA.
