answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I had the privilege of advising [Student Name] during her PhD.

  Standing here, I feel a specific kind of terror. I know that half of you are family who just want to know if the couple is happy. The other half are game theorists who are currently mentally checking my definitions for accuracy. If I mess this up, the family will think I'm boring, and the theorists will think I'm incompetent. So, I'm going to do what [Student Name] did best in her dissertation: I'm going to argue for the Kalai-Smorodinsky solution.

  For the family: stay with me. This is actually about love.

  In standard bargaining theory—the Nash solution—two people look at what they have, look at what they'd get if they walked away, and split the difference. It's efficient. It's stable. But it has a blind spot. It doesn't care about your potential. It doesn't care about the best possible outcome you could *ever* imagine. It just cares about splitting the surplus on the table right now.

  [Student Name] argued that life isn't about splitting the surplus. It's about the "Utopia Point."

  In Kalai-Smorodinsky, you don't just look at what's available today. You identify the Utopia Point—the absolute best version of the future each of you could possibly dream of. And then, you draw a line from where you are, directly toward that dream. You move together, keeping your proportions fair, aiming for the maximum possible good.

  Looking at [Student Name] and [Partner Name], I don't see a couple calculating a Nash equilibrium. I see two people who have identified a Utopia Point. It's not a fantasy; it's a vector. It's the direction you're walking. You aren't asking, "What is the minimum I can accept?" You're asking, "What is the most we can become?"

  And this brings me to the axiom that matters most: Monotonicity.

  In plain English, this means: Your slice of the pie shouldn't shrink just because my opportunities grew.

  In too many relationships, success is zero-sum. If one person's career takes off, the other feels left behind. If one person's horizon expands, the other feels confined. But Kalai-Smorodinsky demands monotonicity. It insists that if the feasible set expands for one of you—if one of you gets a new opportunity, a new joy, a new victory—the other person's share of the happiness should not decrease. It should grow, or at least stay the same.

  I have watched you two practice this. When [Partner Name] succeeded, [Student Name] didn't negotiate for a bigger slice of the credit; she celebrated a bigger pie. And vice versa. You have ensured that your individual growth never comes at the cost of the other's standing. That is a rare equilibrium.

  Now, I know what you're thinking. "Professor, surely they still argue?"

  Of course they do. Every marriage involves bargaining. In my field, we worry about the "disagreement point"—the catastrophic outcome if negotiations fail. For most couples, that's a threat. For you two, I suspect the disagreement point is just deciding whether to order Thai or Italian, and the worst-case scenario is eating leftovers. You have established a very high floor for your negotiations.

  But seriously. [Student Name], you taught me that justice isn't about splitting what exists. It's about aiming for what's possible, and ensuring that as we rise, we rise together.

  So, if you'll raise your glasses.

  To [Student Name] and [Partner Name]. May you always keep your eyes on the Utopia Point. May your love satisfy monotonicity, so that every new opportunity makes you both richer. And may you never settle for the Nash solution when you can have the ideal.

  To the bride and groom.
