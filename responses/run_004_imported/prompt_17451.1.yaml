      *   *Check:* Is the "Grue" analogy accurate? Yes, Goodman's New Riddle of Induction is exactly about predicate projection. Choosing a UTM is choosing a predicate basis.
      *   *Check:* Did I mention the "No Free Lunch" theorem? It's essential context for why *any* bias is needed.
