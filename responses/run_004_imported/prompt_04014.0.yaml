      *   **Conclusion:** The Basic Argument holds *if* you want UMR within a causal framework. Nietzsche says the framework is bogus. Strawson says the framework is incoherent *even on its own terms*. They arrive at similar skepticism via different routes.

  5.  **Refine the Tone:**
