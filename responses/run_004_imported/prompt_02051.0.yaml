      *   *Specific Popper Quote:* Look for a quote about "saving a theory" or "rules of the game." (e.g., Section 20 of *Logic of Scientific Discovery* on conventionalist stratagems).

  7.  **Final Polish:** Ensure the distinction between *logical* falsification (impossible due to Duhem-Quine) and *methodological* falsification (what scientists actually do) is clear. This is the crux of the user's question about whether the crisis exposes a hole in Popper's framework. It doesn't expose a hole; it exposes the difficulty of applying the framework, which pre-registration solves.

