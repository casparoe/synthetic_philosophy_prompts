answer: |-
  This is a fantastic question, and your 1 a.m. philosopher friend gave you the bumper-sticker version of Popper, not the engine. If you're writing a feature on the replication crisis, you have a golden opportunity to rescue Popper from the Intro to Philosophy syllabus, where he is often reduced to a soundbite.

  The short answer is: Popper would likely have viewed the pre-registration movement not as a validation of his logic, but as the **institutional codification of his methodological rules.** He would not have seen the replication crisis as a hole in his framework, but rather as proof of his central anxiety: that logic alone cannot guarantee scientific progress; it requires a specific *ethical and institutional culture* that psychology lacked until very recently.

  Here is how you can unpack that using the specific Popperian machinery you asked for.

  ### 1. The Distinction Between Logical and Methodological Falsification
  The biggest misconception about Popper is that he thought a theory could be logically falsified by a single observation. He didn't. He was acutely aware of the Duhem-Quine problem (though he engaged with it primarily through Pierre Duhem). He knew that if a prediction fails, you can always save the theory by blaming the telescope, the sample, the lighting, or the auxiliary assumptions.

  In *The Logic of Scientific Discovery* (1934), Popper distinguishes between **logical falsifiability** (the structure of the theory) and **methodological falsification** (the actual practice of science).

  He argued that for science to work, the scientific community must agree on "methodological rules." These are conventions that dictate when we stop protecting a theory and accept it as falsified. He wrote:

  > *"Logical considerations... leave open the question of when we are to regard a theory as falsified. In actual practice, this decision depends on the methodological rules of the scientific community."*

  **The Angle for Your Piece:** Pre-registration is essentially a set of Popperian methodological rules. It is a social contract where scientists agree *in advance* to treat a specific outcome as a falsification, removing the wiggle room to blame auxiliary assumptions later. Without pre-registration, psychology was operating without Popper's required "rules of the game."

  ### 2. "Conventionalist Stratagems" and HARKing
  You mentioned *ad hoc* reinterpretations. Popper had a specific term for this: **"Conventionalist Stratagems."**

  In Section 20 of *Logic of Scientific Discovery*, Popper lists the tricks scientists use to immunize their theories from refutation. These include:
  *   Questioning the reliability of the observers.
  *   Casting doubt on the experimental setup.
  *   Introducing *ad hoc* hypotheses to explain away anomalies.

  This is precisely what happened in the wake of the Open Science Collaboration (OSC) results. When replications failed, original authors often argued that the replicators didn't capture the "context" or the "nuance" of the original study (blaming auxiliary assumptions).

  Popper would have identified HARKing (Hypothesizing After Results are Known)—which was rampant in Bem's 2011 precognition paper—as the ultimate conventionalist stratagem. By moving the goalposts after the arrow was shot, Bem made his theory logically unfalsifiable in practice, even if it looked falsifiable on paper.

  **The Angle for Your Piece:** Pre-registration is a "stratagem blocker." It locks the auxiliary assumptions (sample size, measures, analysis plan) before the data is seen. Popper would see Registered Reports as the ultimate weapon against conventionalist twists because it forces the scientist to say, "If X does not happen, I am wrong," and signs a contract to that effect before knowing if X happens.

  ### 3. Degrees of Falsifiability and "Severity"
  Popper argued that falsifiability isn't binary; it comes in **degrees**. A theory that makes a vague prediction is less falsifiable than one that makes a precise, risky prediction. He called this the "severity" of the test.

  Bem's "Feeling the Future" study was low-severity testing disguised as high-severity testing. He ran multiple experiments, used various measures, and reported what worked. This is "p-hacking," but in Popperian terms, it is **reducing the degree of falsifiability.** By testing many things and reporting only the successes, you are effectively making the theory compatible with almost any outcome.

  Pre-registration forces **high severity.** It demands that the scientist specify exactly which data pattern would count as support. If you pre-register a specific interaction effect and it doesn't appear, the degree of falsifiability is high, and the blow to the theory is significant.

  **The Angle for Your Piece:** The replication crisis wasn't just about fraud; it was about low-severity testing. Popper would argue that Bem's work wasn't "bad science" because it was wrong about ghosts; it was "bad science" because it was structured to be immune to being proven wrong. The reforms in psychology are an attempt to increase the *degree* of falsifiability in the field.

  ### 4. The Duhem-Quine Problem: A Bug or a Feature?
  You asked if the crisis exposes a hole in Popper's framework regarding auxiliary assumptions. Popper would argue: **No, it exposes the difficulty of the human element.**

  Popper acknowledged that we can always save a theory by blaming the auxiliary assumptions (the "ceteris paribus" clauses). His solution was not logical, but **voluntarist.** He believed scientists must have the *courage* to accept falsification.

  > *"Empirical science is a system of statements which are agreed upon by decision... The decision is based on practical considerations."*

  The replication crisis shows what happens when that "decision" is corrupted by career incentives (publish or perish). If your career depends on positive results, you will always use the Duhem-Quine loophole to explain away failures.

  Pre-registration shifts the burden of that decision. By making the analysis plan public, it makes it socially costly to blame auxiliary assumptions post-hoc. If you pre-registered your sample size and analysis, you can't later say, "Well, the effect was there, but the sample was too noisy," without looking like you're employing a conventionalist stratagem.

  ### 5. Summary for Your Feature
  If you were to channel Popper on this, he might say something like this:

  *"I never claimed that logic alone would save science. I claimed that science requires a democratic, critical culture where we agree to expose our ideas to risk. Psychology spent 50 years building theories that were logically falsifiable but methodologically immune. Pre-registration is not a new discovery; it is the belated adoption of the methodological rules I argued were necessary in 1934. The crisis did not falsify my philosophy; it falsified the sociological structure of the field."*

  **The Hook:**
  The replication crisis isn't a failure of falsification; it's a failure of **commitment.** Popper's philosophy relies on scientists voluntarily accepting risk. The modern reforms (pre-registration, Registered Reports) are simply mechanisms to enforce that commitment when voluntary courage fails.

  **Key Popperian Terms to Drop:**
  *   **Conventionalist Stratagems:** The *ad hoc* moves to save a theory (e.g., "the replication failed because the participants were different").
  *   **Degrees of Falsifiability:** Bem's study had low degrees; pre-registration forces high degrees.
  *   **Methodological Rules:** Pre-registration is a rule of conduct, not a logical proof.
  *   **Basic Statements:** The agreed-upon observations that the community accepts as true for the sake of testing (pre-registration defines what counts as a basic statement).

  This framing moves you past the "Popper = Falsifiability" cliché and positions the Open Science movement as the practical, sociological implementation of Popper's deeper methodological requirements.
