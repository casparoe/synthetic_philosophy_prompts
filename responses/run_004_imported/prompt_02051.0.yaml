      *   **Point 2: Conventionalist Stratagems.** Explain this specific Popperian term. Show how HARKing and p-hacking are exactly what he warned against. Pre-registration blocks the exit door for these stratagems.
      *   **Point 3: The Duhem-Quine Problem & Auxiliary Assumptions.** Address the user's specific worry. Popper knew about this. He argued we must decide *in advance* which assumptions are immune and which are testable. Pre-registration forces this decision.
      *   **Point 4: Degrees of Falsifiability (Severity).** Bem's study lacked severity. Pre-registration increases severity by narrowing the target.
      *   **Conclusion:** Popper wouldn't be surprised; he'd see it as the maturation of psychology into a "scientific" discipline by adopting the necessary methodological discipline he always argued for.

  6.  **Refining the Content (Self-Correction during drafting):**
