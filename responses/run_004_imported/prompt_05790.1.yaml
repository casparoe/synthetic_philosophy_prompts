      *(Second thought on Move 5)*: Actually, Marcus is right that *lāghava* is a Nyāya principle. But it's used to avoid multiplying *entities*, not necessarily *epistemic instruments* if the instruments are causally distinct. The debate is whether the instrument is distinct. Nora argued it is (Move 4). Marcus argues even if distinct, don't categorize it separately. Nyāya says distinct instrument = distinct category. So Nora is still more faithful to the system. I will score Nora as winning the exchange overall, but Marcus's Move 5 is the only philosophically robust challenge.

      *(Final plan for "Missing" section)*: Focus on the *Karaṇa* (instrument) vs. *Phala* (result). The result of *upamāna* is technically the knowledge of the *connection* between word and thing, not just the identification of the thing. This is a subtle but crucial technical point often missed in introductory summaries. Also, emphasize that *pramāṇa* individuation is based on the *uniqueness of the causal chain*, not just logical reducibility.

