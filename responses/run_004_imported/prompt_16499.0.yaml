prompt: |-
  I co-host a little podcast with a couple of my grad students where we have x-phi people on to get grilled a bit, and next month's guest is an experimental philosopher who's built her whole career defending the Deep Self Concordance Model as the explanation of the Knobe/side-effect effect -- the asymmetry where people say a side effect was brought about "intentionally" when its bad (the classic case being the CEO who doesn't care one way or the other about the environment) but not when the exact same psychological setup produces something good. Her pitch is that intentionality attributions track whether the states that caused the outcome are concordant with the agent's stable, evaluative "deep self," not just whether the outcome happens to be morally bad. I saw her give this talk at a conference already and she's got very smooth, rehearsed answers to the obvious pushback, so for the podcast I don't want questions that just cue up the standard spiel -- I was arguing with a colleague over lunch about whether the model secretly smuggles moral judgment back in through the deep-self side door, and I want the questions to get at that kind of pressure point.

  Could you draft eight or nine questions along those lines, each with a quick follow-up keyed to whatever dodge she's most likely to reach for? I want at least one on the circularity worry -- how you identify an agent's "deep self" without just reading your own prior moral read of the guy back into the case; one that puts her model head-to-head with Machery's trade-off hypothesis on the original chairman/CEO vignette, asking what her account predicts that his doesn't; one on "mere indifference" cases, since the CEO doesn't actually care about the environment either way, which seems different in kind from the internal conflict driving the weakness-of-will and addiction cases the deep-self framework was originally built to handle; one on the developmental findings that even pretty young kids -- four or five year olds -- show the same asymmetry despite presumably not having anything like a stable, reflective deep self yet; and one asking flat out what pattern of results would actually make her abandon the model instead of just patching it. Fill out the rest however you think best rounds it out.
reasoning: |-
  Here's a thinking process that leads to the suggested podcast questions:

