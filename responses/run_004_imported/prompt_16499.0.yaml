          *   *Idea:* If we judge the deep self based on the action, and the action based on the deep self, it's circular.
          *   *Draft:* How do you measure the deep self independently?
          *   *Refinement:* Make it sharper. If the only evidence for the deep self's attitude is the very action we're judging, aren't we just restating the moral judgment?
          *   *Follow-up:* She'll likely say "We use independent surveys." Counter: But in the *moment* of attribution, do subjects have that data?

      *   *Question 2: Machery's Trade-Off Hypothesis (Required)*
          *   *Idea:* Machery says people think side effects are trade-offs. If you trade off something bad, it's intentional.
          *   *Draft:* How is this different from Machery?
          *   *Refinement:* Focus on *predictive divergence*. Where does DSCM say "Intentional" and Trade-Off says "Unintentional" (or vice versa)?
          *   *Follow-up:* She might say they are compatible. Push: If they explain the same variance, is DSCM parsimonious?

      *   *Question 3: Mere Indifference vs. Conflict (Required)*
          *   *Idea:* Deep Self usually explains weakness of will (I want to quit but I smoke). The CEO doesn't care. Is "not caring" a deep self state?
          *   *Draft:* The CEO is indifferent. Deep self is usually about caring.
          *   *Refinement:* The framework was built for addiction/conflict. Indifference is a void. Does a void count as concordance?
          *   *Follow-up:* She might say "Profit is the deep self." Counter: But the harm isn't the profit, it's a side effect.

      *   *Question 4: Developmental Psychology (Required)*
          *   *Idea:* 4-year-olds show the effect. Do they have a "Deep Self"?
          *   *Draft:* Kids don't have deep selves.
          *   *Refinement:* Theory of Mind is developing. Do they have the cognitive architecture for "stable evaluative states"? If not, what's driving it?
          *   *Follow-up:* She might say "Proto-deep self." Counter: At what point does it become the real thing? Is the theory just scaling?

      *   *Question 5: Falsification (Required)*
          *   *Idea:* What kills the theory?
          *   *Draft:* What evidence would change your mind?
          *   *Refinement:* Be specific. If we find a case where Deep Self aligns but people say "Unintentional," do you patch or quit?
          *   *Follow-up:* She might say "We refine the definition." Counter: When does refining become ad hoc?

      *   *Question 6: The "Good Deep Self" Case (Filler 1)*
          *   *Idea:* What if a saint does something bad by accident? Or a villain does something good?
          *   *Refinement:* Let's look at the "Helpful Villain." If a known bad guy helps the environment for profit, do people call it intentional? DSCM says no (not concordant with villainy). Moral Model says yes (good outcome).
          *   *Follow-up:* If data shows moral valence overrides deep self, does the model crumble?

      *   *Question 7: Neurodiversity/Atypical Agents (Filler 2)*
          *   *Idea:* Psychopaths or people with impaired empathy.
          *   *Refinement:* If an agent lacks standard moral emotions, does the "Deep Self" look different? If subjects still use moral valence to judge *them*, does that prove moral valence is the driver, not the agent's deep self?
          *   *Follow-up:* She might say "We judge *their* deep self." Counter: But if we don't know it, we default to outcome valence.

      *   *Question 8: The "Skill" Analogy (Filler 3)*
          *   *Idea:* We say a soccer player scored "intentionally" even if lucky, if they are skilled.
          *   *Refinement:* Is "Deep Self" just a fancy word for "Competence/Skill"? If I'm a greedy CEO, harming is "in my skill set."
          *   *Follow-up:* If it's just competence, why call it *moral* concordance?

      *   *Question 9: Normative vs. Descriptive (Filler 4)*
          *   *Idea:* Is she saying this is how we *should* judge or how we *do*?
          *   *Refinement:* If it's descriptive, and people are biased, is DSCM just rationalizing bias?
          *   *Follow-up:* If it's rationalizing bias, is it a bug or a feature?

  4.  **Review and Refine:**
      *   Check tone: Needs to be respectful but sharp ("grilled a bit").
      *   Check constraints: 8-9 questions. Follow-ups included. Specific topics covered.
      *   *Self-Correction on Q2 (Machery):* Make sure the distinction is clear. Machery focuses on the concept of "intentional" having different senses (trade-off vs. direct). DSCM focuses on the *agent's psychology*. The question needs to highlight where these diverge empirically.
