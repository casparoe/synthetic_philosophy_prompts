answer: |-
  Here are nine questions designed to bypass the rehearsed "elevator pitch" and press on the theoretical vulnerabilities of the Deep Self Concordance Model (DSCM), specifically focusing on the circularity charge and the model's explanatory boundaries.

  ### 1. The Circularity Charge
  **Question:** The core worry my colleague and I were debating is that the "Deep Self" might just be a placeholder for our prior moral judgments. When we hear the CEO harmed the environment, we infer he *must* be the kind of person who accepts that harm to make a profit. We then use that inferred "Deep Self" to explain why we called it intentional. If the only evidence we have for the agent's Deep Self attitude is the very action we're trying to evaluate, aren't we just smuggling moral judgment in through the back door and calling it psychology?

  **Follow-up:** *If she says we can measure the Deep Self independently (e.g., via surveys):* "Sure, *we* can as researchers with a vignette. But the claim is about the folk concept in real-time. Does the ordinary person pause to construct a psychological profile of the CEO before attributing intentionality, or is the 'Deep Self' inference happening post-hoc to justify a snap moral judgment?"

  ### 2. The Machery Trade-Off Head-to-Head
  **Question:** Ed Machery's Trade-Off Hypothesis suggests people treat side-effects as costs weighed against benefits. If the trade-off seems acceptable, it's unintentional; if unacceptable, it's intentional. Your model says it depends on the agent's internal concordance. Can you give me a specific vignette where the DSCM and the Trade-Off Hypothesis make *divergent* predictions? I want to know where your model says "Intentional" and Machery says "Unintentional," because if they always track together, your model might just be a more complicated way of describing the trade-off evaluation.

  **Follow-up:** *If she says the models are compatible/complementary:* "If they're compatible, then the Trade-Off Hypothesis is more parsimonious because it doesn't require positing a 'Deep Self' architecture. Why should we add the ontological weight of the Deep Self if the observer's judgment of the trade-off does all the predictive work?"

  ### 3. The "Mere Indifference" Problem
  **Question:** The Deep Self framework was originally built to handle cases of internal conflict—addiction, weakness of will, where an agent acts against their better judgment. But the CEO isn't conflicted; he's indifferent. He doesn't care about the environment either way. Is "indifference" really a state of the Deep Self? It seems like a void. If the Deep Self is supposed to be a set of stable, *evaluative* commitments, how does a lack of commitment count as concordance with harm?

  **Follow-up:** *If she argues profit-seeking is the commitment:* "But the harm isn't the profit. The harm is incidental to the profit. If I'm committed to driving to work, and I incidentally crush a beetle, does my 'deep commitment to commuting' make the beetle-crushing intentional? Where do we draw the line between concordance with a *goal* and concordance with a *side effect*?"

  ### 4. Developmental Psychology & The "Deep" Self
  **Question:** We see the Knobe Effect in children as young as four or five. But most developmental psychologists would argue that a stable, reflective, evaluative "Deep Self" is a much later cognitive achievement, if it exists at all. If preschoolers show the asymmetry, what exactly are they tracking? Are you suggesting four-year-olds are making inferences about stable character traits, or does this suggest the asymmetry is driven by something more primitive, like a simple bad-outcome heuristic?

  **Follow-up:** *If she suggests it's a "proto-deep self":* "At what point does the proto-self become the real Deep Self? If the mechanism works the same way at age four as it does at age forty, doesn't that suggest the 'Deep Self' explanation is just a sophisticated rationalization of a mechanism that doesn't actually require deep psychological reasoning?"

  ### 5. The Falsification Condition
  **Question:** I want to ask a flat-out falsification question. Experimental programs can sometimes become immune to refutation by redefining the "Deep Self" to fit new data. What specific pattern of results would make you abandon the Deep Self Concordance Model? If we found a case where an action was clearly concordant with the agent's values but people overwhelmingly said "unintentional," would you patch the model or toss it?

  **Follow-up:** *If she says she would refine the model:* "Refining is fine, but when does refining become ad hoc? If every counter-example requires a new clause about how the Deep Self is 'masked' or 'complex,' do we risk making the theory unfalsifiable?"

  ### 6. The "Good Villain" Case
  **Question:** Let's test the moral smuggling worry. Imagine a CEO known to be a villain who hates the environment. He implements a policy to save costs that he *knows* will accidentally help the environment. His Deep Self is anti-environment, but the outcome is good. The Moral Model predicts people will say "unintentional" because the outcome is good. Your model suggests "intentional" because the outcome aligns with his indifference or general modus operandi. Do we have data on this? Because if people say "unintentional" there, it looks like outcome valence trumps Deep Self concordance.

  **Follow-up:** *If she cites data where Deep Self wins:* "Even in those cases, isn't it possible subjects are punishing the villain by attributing intentionality to *everything* he does? How do you disentangle 'Deep Self Concordance' from 'He's a bad guy, so let's blame him'?"

  ### 7. The Blame Proxy
  **Question:** Some critics argue that "Intentionality" is just a proxy for "Blame." We say an action was intentional because we want to hold the agent responsible. The Deep Self Model might just be a middle-man in this process: We want to blame, so we infer a bad Deep Self, which licenses the intentionality claim. If the ultimate driver is the desire to blame, isn't the Deep Self just a narrative construct we build to make the blame feel objective?

  **Follow-up:** *If she argues intentionality is distinct from blame:* "We know they dissociate in some cases, but in the standard Knobe cases, they correlate perfectly. If the Deep Self is only invoked when blame is on the table, how do you prove it's not just a post-hoc justification for the blame judgment we've already made?"

  ### 8. Cross-Cultural Variability
  **Question:** The concept of a "Deep Self"—an inner, stable, authentic core distinct from social roles—is a very Western, WEIRD conception of agency. In more collectivist cultures, the "self" might be more relational or situational. If the Knobe Effect is universal (which some studies suggest), but the "Deep Self" is culturally specific, doesn't that break the link? How can a culturally specific mechanism explain a potentially universal effect?

  **Follow-up:** *If she says the Deep Self is universal:* "Then we need to be careful about projecting our specific philosophical notion of authenticity onto the folk concept. Are we discovering the Deep Self, or are we imposing a Western philosophical framework onto a broader cognitive bias?"

  ### 9. The Functional "Why"
  **Question:** Let's step back from the mechanism to the function. Even if the Deep Self Model is descriptively accurate, *why* would we evolve or learn to link intentionality to deep concordance? What is the adaptive benefit? If the Moral Model says the benefit is regulating social norms (punishing bad outcomes), what does the Deep Self Model say the benefit is? If you can't give a functional story, it risks looking like a description of the bias rather than an explanation of it.

  **Follow-up:** *If she argues it helps predict future behavior:* "But tracking moral outcomes does that too. If I know you caused harm, I know to avoid you. Do I really need to model your 'Deep Self' to know you're dangerous, or does the Deep Self theory over-intellectualize what is essentially a threat-detection system?"
