          4.  Developmental findings (kids showing asymmetry without a stable deep self).
          5.  Falsification conditions (what would make her abandon the model?).
          6.  Fill out the rest (3-4 more questions) to round it out, keeping the "grilling" tone.
      *   **Format:** Question + Follow-up (keyed to likely dodges).

  2.  **Deconstruct the Deep Self Concordance Model (DSCM):**
      *   *Core Claim:* People attribute intentionality based on whether the action/outcome aligns with the agent's deep self (values, commitments, stable attitudes), not just the surface mental states (belief/desire) or the moral valence of the outcome.
      *   *The Knobe Effect:* CEO harms environment (intentional) vs. helps environment (not intentional).
      *   *DSCM Explanation:* Harming aligns with profit-seeking deep self; helping does not (it's incidental).
      *   *The Criticism:* How do we know what the "deep self" is? Isn't it just inferred from the action + moral judgment? (Circularity).

  3.  **Drafting the Questions (Iterative Process):**

