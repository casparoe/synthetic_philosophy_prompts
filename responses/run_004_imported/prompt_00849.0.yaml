      *   *The Famous Passage:* The user is likely referring to *Lectures on Ethics* (Collins transcript) or *The Metaphysics of Morals*. The specific quote about the old horse/dog is famous.
      *   *The Standard Interpretation:* Kant argues that duties regarding animals are actually *indirect* duties to humanity. Cruelty to animals dulls our sympathy for humans. Kindness to animals cultivates virtue useful for humans.
