      *   **The EPR Argument (1935):** Einstein, Podolsky, Rosen.
          *   Premise 1: Locality (No action-at-a-distance).
          *   Premise 2: Perfect Correlations (QM predicts them, experiments confirm them).
          *   Conclusion: Elements of Reality (Hidden Variables) must exist.
      *   **Maudlin's Point (and others like Norsen):** EPR shows that *Locality + Perfect Correlations $\rightarrow$ Realism (Hidden Variables)*.
      *   **Bell's Inequality:** Shows that *Locality + Realism (from EPR) $\rightarrow$ Contradiction with QM predictions*.
      *   **The Synthesis:** If you accept QM predictions (perfect correlations at some angles, statistical at others) and Experiment (violates Bell inequalities), you have a trilemma.
      *   **The Crux:** If EPR is right, you can't just "drop realism" while keeping locality. If you keep locality, EPR forces realism on you. Then Bell kills that combination. So, ultimately, you must drop Locality. Dropping realism *instead* is only viable if you reject the EPR inference, but Maudlin argues the EPR inference is logically tight *given* locality.

  3.  **Evaluate Maudlin's Claim:**
