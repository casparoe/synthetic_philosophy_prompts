answer: |-
  It is a pleasure to correspond with someone who has spent a lifetime in science and is now turning their rigorous eye toward the foundations of physics. Your intuition is spot-on: the pop-science narrative regarding Bell's theorem is often sloppy, and your encounter with Tim Maudlin (likely via his book *Quantum Non-Locality and Relativity* or his various papers) has led you to the heart of a genuine debate in the philosophy of physics.

  To answer your question directly: **Maudlin is largely right, and the pop-sci "two dials" story is indeed misleading.**

  Here is the walkthrough of the argument, why Maudlin claims "realism" isn't an independent assumption, and whether dropping it actually saves locality.

  ### 1. The Standard Pop-Sci Story (The "Two Dials")
  The standard narrative goes like this: Bell's Theorem proves that nature cannot be both **Local** and **Real**.
  *   **Locality:** Physical influences cannot travel faster than light. What happens here cannot instantly affect what happens there.
  *   **Realism:** Physical objects have definite properties (like spin or position) independent of whether we measure them.

  The story concludes: "Nature forces us to turn one dial off. You can keep a Local universe if you accept that properties aren't real until measured (Copenhagen/QBism). Or you can keep Realism if you accept spooky action-at-a-distance (Bohmian Mechanics)."

  This suggests Locality and Realism are independent axioms. Maudlin argues they are not.

  ### 2. The EPR Argument (1935): Realism as a *Consequence*
  To understand Maudlin's point, we have to look at the EPR paper (Einstein, Podolsky, Rosen), which predated Bell by 30 years. EPR wasn't trying to prove non-locality; they were trying to prove Quantum Mechanics (QM) was incomplete.

  Their argument relies on **Perfect Correlations**.
  Imagine an entangled pair of electrons in a "singlet state" sent to Alice and Bob.
  1.  **QM Prediction:** If Alice and Bob both measure spin along the *same* axis (say, vertical), their results will be perfectly anti-correlated. If Alice gets Up, Bob *must* get Down. 100% of the time.
  2.  **Locality Assumption:** Alice's measurement cannot physically disturb Bob's electron (they are spacelike separated).
  3.  **The Inference:** Since Alice can predict Bob's result with 100% certainty without touching his electron, Bob's electron must have *already possessed* that definite spin value before Alice measured.

  EPR called this an "Element of Reality."
  **The Crucial Point:** EPR did not *assume* realism as a philosophical preference. They **derived** the existence of definite values (hidden variables) from the assumption of **Locality** combined with the empirical fact of **Perfect Correlations**.

  So, logically:
  $$ \text{Locality} + \text{Perfect Correlations} \rightarrow \text{Realism (Hidden Variables)} $$

  ### 3. Bell's Theorem (1964): The Trap Springs
  Bell came along and asked: "Okay, if Locality forces these Hidden Variables to exist (as EPR showed), can those Hidden Variables reproduce the rest of Quantum Mechanics?"

  QM makes predictions not just for identical angles (perfect correlation), but for different angles (e.g., Alice measures vertical, Bob measures 45° off). QM predicts a specific statistical curve (cosine squared) for these mismatches.

  Bell derived an inequality that any theory with **Local Hidden Variables** must satisfy.
  *   **Result:** Quantum Mechanics violates this inequality.
  *   **Experiment:** Nature violates this inequality (Aspect, Zeilinger, Clauser, etc.).

  ### 4. Maudlin's Synthesis: Where the "Cheat" Lies
  Here is where Maudlin tightens the screw. He argues that the logical structure of the proof is being misreported.

  **The Pop-Sci Logic:**
  1.  Assume Locality.
  2.  Assume Realism.
  3.  Derive Bell Inequality.
  4.  Experiment violates Inequality.
  5.  **Conclusion:** Either Locality or Realism is false. (Choose your poison).

  **Maudlin's Logic:**
  1.  Assume Locality.
  2.  Observe Perfect Correlations (empirical fact).
  3.  **Deduce Realism** (via EPR argument). *Realism is no longer an assumption; it is a consequence of step 1.*
  4.  Derive Bell Inequality (using the Realism deduced in step 3).
  5.  Experiment violates Inequality.
  6.  **Conclusion:** The initial assumption (Locality) is false.

  Maudlin's argument is that you cannot "dial down" realism to save locality because **locality itself demands realism** in the face of perfect correlations. If you insist on keeping Locality, you are logically forced to accept that the particles carry hidden instructions (Realism). But once you accept those instructions, Bell proves they can't match experimental data.

  Therefore, the only consistent conclusion is that **Locality is false.**

  ### 5. Is Giving Up Realism a "Dodge"?
  This is the philosophical crux. If Maudlin is right, then Copenhagen/QBism proponents who say "We keep Locality by dropping Realism" are trying to have their cake and eat it too. They are rejecting the EPR inference.

  How do they do that? They reject the idea that "predicting with certainty implies pre-existing value."
  *   **Copenhagen:** Properties do not exist until the context of measurement creates them. There is no "Bob's electron" independent of the measurement context.
  *   **QBism:** Quantum states are not descriptions of the world, but an agent's betting odds. There is no "reality" to be local or non-local in the objective sense.

  **Maudlin's Counter:** He argues this is verbal sleight of hand. If Alice's measurement instantly updates the physical state of Bob's system (even if you call it "information" or "belief" or "wavefunction collapse"), and that update happens faster than light, you have non-locality. If the wavefunction is real, its collapse is non-local. If the wavefunction isn't real, what is physics describing?

  Maudlin contends that unless you adopt a Many-Worlds interpretation (which keeps locality but abandons single outcomes) or Superdeterminism (which abandons experimental free will), you cannot escape Non-Locality. Merely saying "properties aren't real" doesn't stop the statistical dependence between spacelike events, which is the definition of non-locality.

  ### 6. Is Maudlin "Actually Right"?
  In the foundations community, Maudlin's position is highly respected and considered logically robust, though not universally accepted.

  **Where he is right:**
  He is correct that "Realism" is not an independent axiom in the derivation of Bell's theorem *if* you accept the EPR reasoning. The assumption is Locality. Realism falls out of it. Therefore, blaming Realism for the violation is logically suspect. The violation indicts Locality.

  **Where there is wiggle room (The Counter-Argument):**
  Defenders of Copenhagen/QBism argue that the EPR criterion of reality ("If I can predict it without disturbing, it exists") is the weak link, not Locality. They argue that QM is a *complete* theory precisely because it refuses to assign values to unmeasured observables. To them, "Realism" (in the sense of counterfactual definiteness) *is* an independent assumption that QM rejects. They would say Maudlin is smuggling in a classical ontology that QM explicitly forbids.

  However, even here, there is a cost. If you reject counterfactual definiteness to save locality, you often end up with **Contextuality** (Kochen-Specker theorem). This means the value of a property depends on what *other* measurements are being performed elsewhere. Many philosophers argue that Contextuality is just Non-Locality by another name.

  ### Summary for a Marine Biologist
  Think of it like tracking animal migrations.
  *   **Locality:** An animal in the Atlantic can't instantly change the behavior of an animal in the Pacific.
  *   **Perfect Correlation:** You observe that every time a shark turns Left in the Atlantic, a specific shark turns Right in the Pacific. 100% match.
  *   **EPR:** If they can't talk (Locality), they must have been given a set of instructions at birth (Realism/Hidden Variables) to do this.
  *   **Bell:** You check the instructions for when they turn at slight angles. The instructions don't match the observed statistics.
  *   **Pop-Sci:** "So, either they can talk instantly, or they didn't have instructions."
  *   **Maudlin:** "If they can't talk, they *must* have had instructions. Since the instructions don't work, they must be able to talk instantly."

  ### Verdict
  Your suspicion is well-founded. The claim that "giving up realism saves locality" is, in Maudlin's view (and that of many realists), a dodge. It attempts to block the EPR inference that Locality *entails* Hidden Variables.

  While QBists and Copenhagenists will argue they are dissolving the problem by changing the definition of "reality," Maudlin argues that the physical dependency between spacelike events remains, regardless of your ontology. That dependency is Non-Locality.

  So, if you want a clear picture: **Bell's Theorem is primarily a theorem about Non-Locality.** The "Realism" part is a shadow cast by Locality. If you turn off the light (Locality), the shadow (Realism) disappears, but not because you removed the object casting it.

  Welcome to the rabbit hole. It only gets deeper from here (look into "PBR Theorem" if you want to see another attack on the "psi-epistemic" view), but you have grasped the central tension correctly.
