answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I work as a backend engineer. Basically, I build structures that are supposed to stay standing under pressure. So, when I was asked to give this toast, I approached it the way I approach my work: I looked for the documentation.

  And in this family, the documentation is clear. For thirty-six years, Grandma taught Latin and Roman History. But for the last thirty of those years, she has lived by a specific text: Cicero's *De Senectute*, or "On Old Age."

  Now, I'm not a classicist. I know enough to know that quoting Cicero at a birthday party can go wrong very quickly. It can sound like a lecture. But Grandma has made it clear that she doesn't want a eulogy while she's still here to hear it, and she definitely doesn't want a sermon. She wants accuracy.

  There is a reading group that meets at her house once a month—three of her former students, now in their sixties, who come over to argue about translation choices. I know they're here tonight. [Nod to them]. I know that if I get the Latin wrong, you'll let me know about it next month. But I also know that Grandma loves that book not for the language, but for the logic.

  Cicero writes through the character of Cato, an old man who systematically dismantles every complaint people have about getting older. And listening to Grandma over the years, I've realized she's been living Cato's arguments long before she ever reached the age he was in the dialogue.

  The first complaint Cato addresses is that old age withdraws us from active life and weakens the body. He argues that while physical strength fades, authority and judgment become the real currency. Grandma, you can't kneel in the garden anymore to pull the weeds. But I have to point out that at Thanksgiving, when the rest of us are struggling to carve the turkey or resolve a dispute about politics, you are still the one steering the ship. You don't need to lift the heavy boxes anymore; you're the one telling us where to put them. And your aim is true.

  Cato also argues that the ideal occupation for old age is cultivation. He talks endlessly about farming. For you, that has meant two things. First, tomatoes. I have never seen anyone debate the merits of a San Marzano with the same intensity they debate the subjunctive mood. But second, it meant us. You treated your students, and your grandchildren, like a crop that needed tending. You didn't expect us to bloom all at once. You understood that growth is slow, often messy, and requires patience. You cultivated minds the way you cultivate your garden: with dirt under your fingernails and high standards for the harvest.

  Now, there is one part of *De Senectute* that we need to address. The dialogue ends with a famous passage about the immortality of the soul. Cato speculates about meeting his dead son and the great men of history. It's beautiful, poetic, and comforting.

  But Grandma has been very clear: she considers that ending optional. She loves the book because it teaches us how to live while we are here, not how to imagine what comes after. She has told us that implying she's going to be "watching over us" from somewhere else is a betrayal of the clear-eyed realism she spent her career teaching.

  So, I want to focus on the image she *does* endorse. It comes near the end of the book. Cicero compares a life ended prematurely to fruit torn green from the branch. But a life lived fully? He says that is like fruit that ripens and falls when it is ready.

  There is no promise in that image about where the fruit goes after it falls. There is only the dignity of the ripening. The honesty of the season completing itself.

  Grandma, you are ninety. You have ripened. You have argued, you have taught, you have grown tomatoes, and you have loved us without sugarcoating the truth. You have shown us that old age isn't a decline to be feared, but a distinct phase of life with its own power, its own authority, and its own natural conclusion.

  We aren't here tonight to pretend you'll be here forever. We are here to celebrate that you are here *now*. That the fruit is still on the branch, sweet and heavy, and we are lucky enough to be standing beneath it.

  So, if everyone could raise a glass.

  To Grandma. May your arguments remain sharp, your tomatoes remain plentiful, and may you continue to judge the ripeness of things better than any of us ever could. Happy Birthday.
