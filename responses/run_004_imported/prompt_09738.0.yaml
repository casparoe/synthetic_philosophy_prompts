prompt: |-
  So two friends of mine, Nora and Dave, got into a whole thing after trivia last week, and I could use a neutral third party because I've heard both sides too many times now to be objective.

  Backstory: one friend in our group, Kat, keeps telling everyone that another friend, Theo, is 'unreliable' and 'kind of disrespectful' because he bails on plans at the last minute all the time. Thing is, Kat cancels on people constantly too, arguably more than Theo does. Nora said Kat has no business calling Theo out on this when she does the exact same thing herself. Dave said that doesn't make Kat wrong about Theo though -- he really is flaky, and pointing out Kat is too doesn't change that, its just changing the subject instead of admitting Theo's a problem. Nora said that's not actually the complaint: it's not that what Kat said about Theo is false, it's that Kat's going around acting like she's entitled to be annoyed at him for flaking, when she's got no more claim to that then Theo does -- she's exempting herself from the very standard she's holding him to. Dave said that assumes Kat's cancellations are the same kind of thing as Theo's, when maybe they're not -- if Kat bails for actual emergencies and Theo bails because he just doesn't feel like going, then 'she does it too' isn't even true in the sense that matters. Nora said fine, grant that the excuses are genuinely different -- Kat has still never once said that to Theo or anyone else, she just acts like her own cancellations don't register at all, and that's the self-exempting move regardless of whether there's some excuse she could point to if pressed. Dave's last word was that the whole thing now turns on what's going on in Kat's head, whether she's sincere or just self-serving, and neither of them can actually know that.

  This feels like the 'standing to blame and hypocrisy' debate from ethics playing out over trivia night, and honestly I can't tell who's winning. Can you go through the exchange move by move and say who's got the better of the argument at each step -- I don't think either of them is simply wrong the whole way through -- rather than just declaring an overall winner, and then flag whatever you think both of them are missing?
