answer: |-
  Here are 10 interview questions designed for a low-key but rigorous political philosophy podcast. They are structured to move from the internal logic of her theory to external objections, ending with the meta-philosophical stakes.

  Per your request, each question includes a note on her likely reply and a follow-up specifically loaded to press the tension in that reply.

  ### 1. The Circularity of "Subjection"
  **Question:** You argue that nationality-based boundaries are circular because you need a demos to decide the demos. But critics say your "all-subjected" principle faces the same mirror. To know who is "subject to" a legal order, don't we first have to know where that legal order claims authority? Doesn't identifying the *scope* of coercion presuppose the very boundary you're trying to justify?

  **Likely Reply:** She will likely distinguish between a *normative* boundary (who *should* decide) and a *factual* one (where the state *actually* projects power). She'll argue coercion is an empirical reality, not a legal status.
  **Loaded Follow-up:** "If it's purely empirical, then an occupying army coerces a population just as much as a legitimate government does. Does your principle demand democracy for occupied territories immediately, even if the occupier has no intention of staying? If not, aren't you smuggling a normative boundary back in?"

  ### 2. The Threshold Problem (Degree)
  **Question:** Let's talk about the degree of subjection. A tourist obeys traffic laws; a guest worker pays taxes; a foreign citizen is hit by extraterritorial sanctions. They are all 'subject' to coercion in some sense. If you draw a line to exclude the tourist but include the migrant, aren't you just recreating the 'basically everyone counts a little' vagueness you criticize in the all-affected camp?

  **Likely Reply:** She will likely argue for a threshold of "comprehensive" or "ongoing" subjection. Tourists are transient; citizens/residents are enmeshed in the coercive structure permanently.
  **Loaded Follow-up:** "But guest workers are enmeshed permanently yet often denied the vote. If your principle is about *factual* coercion, doesn't it demand they get citizenship, not just a say? And if you say 'no, just temporary rights,' haven't you just reintroduced a membership category that looks suspiciously like the nationality view you reject?"

  ### 3. Coercion vs. Exclusion at the Border
  **Question:** A standard liberal nationalist objection is that turning someone away at the border isn't coercing them; it's just refusing to let them in. They aren't subject to your laws yet, so they don't need a vote on them. How do you respond to the claim that border control is a precondition for law, not an exercise of it?

  **Likely Reply:** She will likely argue that border control *is* the enforcement of the legal order's spatial scope. It restricts freedom of movement globally and imposes a duty on the outsider to stay out.
  **Loaded Follow-up:** "Okay, but if the coercion lies in the *restriction of movement*, does that mean any property owner coercing a trespasser is violating democratic principles? What makes the state's 'No Trespassing' sign politically illegitimate in a way that my 'No Trespassing' sign isn't?"

  ### 4. Under-Inclusion and Global Harms
  **Question:** The all-affected principle has one intuitive advantage: it captures people harmed by climate change or trade policy who aren't legally 'subject' to the state causing the harm. By sticking strictly to legal subjection, does your view under-include these victims? Do they get no democratic claim on us, just moral charity?

  **Likely Reply:** She will likely distinguish between *democratic inclusion* (right to rule) and *moral obligations* (duties of justice). She might argue we owe them compensation, but not a vote in our elections.
  **Loaded Follow-up:** "But if the harm is structural—say, our carbon emissions render their state uninhabitable—aren't we effectively governing them by destroying their capacity for self-government? If coercion creates the claim, doesn't systemic destruction count as a form of negative coercion?"

  ### 5. The Meta-Question: Is the Boundary Problem a Dead End?
  **Question:** I have a friend doing her PhD on this who argues the boundary problem has no non-circular solution. She thinks any principle we choose—whether affected, subjected, or national—is ultimately an arbitrary normative stipulation. Do you think you've solved the circularity, or have you just relocated the arbitrariness to the definition of 'coercion'?

  **Likely Reply:** She will likely concede there is no *procedural* solution (a vote can't decide the voters) but argue there is a *normative* solution. The arbitrariness is removed by appealing to the value of freedom or equality, not procedure.
  **Loaded Follow-up:** "If it's just a normative stipulation, why is 'freedom from coercion' the right value? Why not 'freedom to associate' or 'cultural solidarity'? If you can't derive 'all-subjected' from the concept of democracy itself without circularity, isn't your friend right that this is just a preference for cosmopolitanism dressed up as logic?"

  ### 6. The Stability and Solidarity Objection
  **Question:** Many theorists argue that democracy requires a thick sense of 'we' to sustain redistribution and trust. If you expand the demos to include everyone subject to coercion, including transient populations, do you risk diluting the solidarity needed to keep the welfare state functioning?

  **Likely Reply:** She will likely argue that solidarity is built *through* democratic participation, not a precondition for it. Excluding people undermines solidarity by creating castes.
  **Loaded Follow-up:** "That's optimistic, but look at the backlash. If you tell a current electorate they must share their welfare budget with everyone they currently exclude, doesn't that risk them dismantling the welfare state entirely? Is your principle compatible with the survival of actually-existing social democracy?"

  ### 7. Stakeholder vs. Subjected (The Bauböck Challenge)
  **Question:** Rainer Bauböck argues for a 'stakeholder' principle—people have a vote where their life circumstances are tied to the community's future. This captures some migrants but excludes others. Why is 'coercion' a better anchor than 'stake'? Isn't a stake in the outcome what actually matters for democratic legitimacy?

  **Likely Reply:** She will likely argue 'stake' is too vague and subjective (everyone has a stake in everything). Coercion is binary and enforceable.
  **Loaded Follow-up:** "But coercion can be binary while impact is scalar. If I'm coerced by a law that barely affects me, versus massively affected by a law I'm technically exempt from, why does the coercion trump the impact? Doesn't that prioritize the *form* of state power over the *reality* of people's lives?"

  ### 8. Internal Exclusions (Prisoners and Children)
  **Question:** If the claim to a vote comes from being subject to coercive law, how do you handle internal exclusions? Prisoners are heavily coerced but often disenfranchised. Children are subject to laws but can't vote. Does your principle demand we lower the voting age or restore prisoner voting to be consistent?

  **Likely Reply:** She will likely argue for competence conditions or that children are represented proxy-wise by parents. For prisoners, she might concede they should vote.
  **Loaded Follow-up:** "If you concede prisoners should vote, you're admitting that 'subjection' trumps 'civic virtue' or 'law-abidingness.' But if you keep age limits, you're admitting subjection *isn't* enough—you need capacity. So isn't the real boundary actually 'capacity,' not 'subjection'?"

  ### 9. Non-Ideal Theory and Transition
  **Question:** Let's move to implementation. Even if your view is right in ideal theory, unilateral open borders could trigger a populist backlash that empowers authoritarian regimes. Do you have a non-ideal theory for transition? How do we get from here to there without collapsing the democratic institutions we're trying to expand?

  **Likely Reply:** She will likely argue for gradual expansion of rights (local voting, denizenship) rather than immediate open borders.
  **Loaded Follow-up:** "But if you accept gradualism for strategic reasons, aren't you admitting that the 'right' to inclusion can be overridden by the 'stability' of the exclusionary order? If stability trumps the right now, why doesn't it trump it indefinitely?"

  ### 10. What Remains of "The People"?
  **Question:** Finally, if the boundary of the demos is constantly shifting based on who is subject to coercion, does the concept of a stable 'People' disappear entirely? Is there anything left of popular sovereignty if the 'people' are a fluid category defined by the state's own coercive reach?

  **Likely Reply:** She will likely argue that 'the people' is a project, not a pre-existing entity. It's constituted through the democratic process itself.
  **Loaded Follow-up:** "If the people are constituted by the process, but the process requires a people to start, haven't we just come full circle? Or are you willing to say that 'popular sovereignty' is actually a myth we should retire in favor of something like 'universal human rights'?"
