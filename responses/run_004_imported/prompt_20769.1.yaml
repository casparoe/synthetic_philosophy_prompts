      *   *Flaw:* It treats the student as a means to an end (Kantian objection). It ignores proportionality. It ignores recidivism logic.

  3.  **Identify Sociological/Ethical Principles at Play:**
      *   **Procedural Justice:** Consistency, transparency, neutrality.
      *   **Retributive Justice:** Punishment should fit the crime *and* the culpability/history.
      *   **Labeling Theory:** How institutional reactions reinforce deviance.
      *   **Equity/Equality:** Treating like cases alike.
      *   **Due Process:** Informal committees still need basic fairness.
