  1.  **Analyze the User and Context:**
      *   **User:** Sociology PhD student. This means they understand social structures, power dynamics, labeling theory, procedural justice, and institutional logic. They are likely looking for a response that engages with these concepts, not just a generic "that's wrong" answer.
      *   **Role:** Sits on an informal academic integrity committee. This implies they have some influence but perhaps not veto power. The committee is "informal," which raises procedural due process questions.
      *   **The Situation:** Two students (A and B) caught using banned AI on the same assignment. Evidence is equally solid.
      *   **The Conflict:** Chair wants to punish Student A (first offense, good reputation) *harsher* than Student B (repeat offender, prior warnings).
      *   **Chair's Rationale:** Deterrence theory/Exemplary punishment. Punishing the "good" student sends a stronger signal ("if *they* get caught, anyone will"). Punishing the "bad" student has diminishing returns (expected behavior).
      *   **User's Intuition:** Feels backwards/unfair. Colleagues say they are "soft," not "strategic."
      *   **The Question:** Is there a *principled reason* this is unfair, or is the Chair's move defensible?

  2.  **Deconstruct the Chair's Logic (Utilitarian/Deterrence):**
