answer: |-
  This is a fantastic tension to sit with, and it's great that you're wrestling with the ontology of the situation rather than the morality. Your friend is pushing you toward a specific, technical distinction in Hacking's work that is easy to blur but crucial for the mechanics of the "loop."

  To argue hard for your friend's side—that Mara's experience is **semantic contagion** rather than **Hackingian looping**—without dismissing the reality of her suffering or identity, you need to focus on the **institutional elasticity of the classification itself.**

  Here is the strongest argument for why TikTok self-diagnosis fails the strict Hackingian test, broken down by the mechanics of *Making Up People*.

  ### 1. The Requirement of Institutional Revision
  Hacking's looping effect is not merely "label changes person." It is "label changes person, person changes label, **authority recognizes new label.**"

  For a "kind" to be interactive in Hacking's sense, the classification must be capable of moving. In *Mad Travelers*, the diagnosis of "fugue" didn't just change how patients felt; it changed how doctors diagnosed, how laws were written, and eventually, the category itself evaporated or mutated because the behavior of the classified made the old category untenable. In *Rewriting the Soul*, the multiplicity of personalities forced a restructuring of trauma theory.

  **The Argument:** On TikTok, the *classification* (e.g., DSM-5 criteria for Autism or ADHD) remains static. It is a hard shell. Mara might change her behavior, her self-concept, and her social performance to fit the label (the first half of the loop), but the label itself does not bend back. The American Psychiatric Association is not revising the criteria for ADHD based on #ADHDTok trends; in fact, they are often issuing statements *against* them.

  If the classification does not evolve in response to the classified, the loop is broken. It becomes a one-way pressure: the Kind presses on the Person, but the Person cannot press back on the Kind. Without that second vector, you don't have a looping effect; you have **accommodation**. Mara is accommodating herself to a static kind, not participating in the evolution of that kind.

  ### 2. Negotiation vs. Algorithmic Reinforcement
  In Hacking's examples of autistic self-advocacy (which you rightly bring up), the "loop" was driven by **political negotiation**. Autistic adults organized, published manifestos, demanded changes to research funding, and sat on advisory boards. They forced the "experts" to look at the data differently. The loop was mediated by *discourse* and *power*.

  **The Argument:** TikTok is mediated by *engagement*. The algorithm does not care about the truth of the classification; it cares about the retention of the user. When a creator describes a symptom, and Mara recognizes it, that is not a negotiation of truth; it is a match of patterns optimized for click-through.

  In a genuine loop, there is friction. The classified person says, "This definition doesn't fit me," and the institution says, "Then you aren't X," or eventually, "Okay, we need a new subtype." On TikTok, the friction is removed. If Mara scrolls past a video that doesn't fit, the algorithm shows her one that does. This creates a **closed epistemic circle**. It feels like a loop because it feels dynamic, but it is actually a **feedback spiral**. She is being mirrored, not heard. The "Kind" isn't changing; the *feed* is curating a version of the Kind that locks her in. This is closer to what Hacking might call a "self-sealing prophecy" than a looping effect.

  ### 3. Homogenization vs. Diversification
  Hacking's looping effects often result in the **diversification** of the kind. As people adopt a label, they find new ways to *be* that label, forcing the taxonomy to branch out (e.g., the splintering of personality disorders or the broadening of the autism spectrum).

  **The Argument:** Social media trends tend toward **homogenization**. For a symptom to go viral, it must be performative, concise, and relatable. Complex, internal, or contradictory experiences of neurodivergence are often filtered out because they don't make good 60-second content.

  If Mara is adopting a version of ADHD or Autism that is streamlined for video consumption, she isn't expanding the ontology of the condition; she is flattening it. She is converging toward a stereotype, not diverging into a new subtype. Hacking's loops create *new kinds of people*. TikTok creates *copies of the same kind of person*. If Mara and 10,000 other teens start behaving in the exact same way because they watched the same creator, that isn't the emergence of a new interactive kind; it's mass mimicry. It is **semantic contagion** because the *words* are spreading like a virus, but the *concept* isn't evolving.

  ### 4. The "Authority" Problem (Who is the Classifier?)
  This is the crux of your friend's point. Hacking is very interested in *who* holds the power to name. In the multiple personality case, it was therapists. In the autistic advocacy case, it was a coalition of activists and sympathetic researchers.

  **The Argument:** On TikTok, the "classifiers" are content creators who are often uncredentialed and unaccountable. But crucially, they lack the **institutional leverage** to make the loop stick in the real world. If Mara self-diagnoses on TikTok, but her school, her doctor, and her employer do not recognize that diagnosis, the "Kind" has no social reality outside her peer group.

  For Hacking, a "Kind" is a social institution. It opens and closes doors. It grants access to meds, accommodations, legal protections. If Mara's self-diagnosis doesn't unlock those institutional doors, she hasn't actually entered the "Kind" in the Hackingian sense; she has entered a **subcultural simulacrum** of the Kind. The loop requires the classification to have "teeth" in the broader social structure. TikTok diagnosis is often toothless—it changes how Mara feels on a Tuesday, but it doesn't change how the state treats her on a Wednesday. Without that institutional bite, the loop is purely internal or interpersonal, not ontological.

  ### 5. Why This Distinction Helps Your Novel
  Arguing for your friend's side doesn't mean you have to write Mara as "wrong" or "deluded." It actually makes her tragedy more profound.

  If this were a true Hackingian loop, Mara would be a pioneer. She would be part of a vanguard forcing the world to update its understanding of neurodivergence. That's a heroic arc.

  But if your friend is right—if this is semantic contagion—then Mara is trapped in a **hall of mirrors**. She is finding language for her pain (which is real and good), but she is using a language that the world refuses to speak back to her. The tragedy isn't that she's "faking it"; the tragedy is that she is trying to engage in a dialogue with a system (the medical/social establishment) that isn't listening, so she settles for a monologue with an algorithm that only echoes her.

  This allows you to write her experience as **valid but structurally isolated**. She is experiencing real symptoms and finding real community, but the *mechanism* she is using (TikTok) is incapable of completing the loop. It gives her the identity without the institutional support, the label without the leverage.

  ### Summary for the Text
  You can write Mara's arc such that she *feels* like she is looping (changing herself, changing her understanding), but the narrative voice or the structural outcomes reveal that the **Kind itself remains indifferent to her.**

  The DSM doesn't move. The school doesn't accommodate. The doctor hesitates. The loop hits a glass ceiling. That isn't "kids these days" judgment; that is a sociological observation about where power lies in the taxonomy of mental health. Mara is doing the work of the loop, but the other half of the equation (the Authority) is refusing to move. That creates a specific kind of modern alienation: **ontological friction.** She is becoming a person that the current world does not yet have a box for, but she's trying to force herself into a box she found online that doesn't quite fit the world she actually lives in.

  This honors Hacking (by respecting the institutional requirement of the loop), honors Mara (by treating her self-knowledge as real), and avoids the trope (by blaming the mechanism, not the girl).
