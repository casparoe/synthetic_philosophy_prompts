answer: |-
  This is a fantastic angle for a piece, and your instinct to pause before locking in the "compartmentalization" narrative is spot-on. If you pitch it as "rigorous philosopher has one irrational hobby to cope with sadness," a knowledgeable editor (or a reader who knows Sidgwick) will likely push back.

  While your theory captures the **biographical** truth (the loss of faith), it misses the **philosophical** necessity. Sidgwick didn't view psychical research as a separate hobby; he viewed it as the empirical wing of his ethical system.

  Here is the sanity check you need to deepen the piece and bulletproof it against criticism.

  ### 1. The "Dualism of Practical Reason" is the Key
  The biggest risk in your current framing is treating *The Methods of Ethics* as just a treatise on hedonism. It is, but its most famous conclusion is a crisis.

  Sidgwick identified a problem he called the **Dualism of Practical Reason**.
  *   **Rational Egoism:** It is rational to pursue my own greatest happiness.
  *   **Rational Benevolence (Utilitarianism):** It is rational to pursue the general greatest happiness.

  In a godless, materialist universe, these two often conflict. If being moral requires me to sacrifice my own happiness (even my life) with no expectation of reward, is it truly "rational" to be moral? Sidgwick concluded that without a Divine Governor to ensure that virtue and happiness coincide (i.e., an afterlife where the scales are balanced), morality lacks a rational foundation.

  **The Pivot:** Psychical research wasn't him trying to feel better about God; it was him trying to find **empirical evidence** for the necessary conditions of his own ethical theory. He needed proof of immortality and divine governance to resolve the Dualism. If he could prove the soul survives scientifically, he could save Rational Benevolence from being irrational.

  ### 2. It Wasn't "Irrational," It Was "Empiricist"
  Your framing suggests a tension between his "rigorous" philosophy and his "irrational" ghost hunting. Sidgwick would have rejected that distinction.

  He was a radical empiricist. He believed that if spiritual phenomena existed, they were part of nature and therefore subject to scientific investigation. He approached the Society for Psychical Research (SPR) with the same skepticism and methodological rigor he applied to ethics.
  *   He didn't join the SPR because he *believed* in ghosts.
  *   He joined because the *evidence* for telepathy and survival was anomalous data that couldn't be ignored by a strict empiricist.

  In fact, he was often the hardest skeptic in the room. He famously exposed fraudulent mediums (like the Eusapia Palladino investigations, though that was slightly later, the spirit was the same). Framing it as a "blind spot" undermines his consistency. For Sidgwick, ignoring the data because it looked "paranormal" would have been the unscientific move.

  ### 3. The Narrative Arc: Tragedy, Not Compartmentalization
  If you write it as compartmentalization, the story is: *He was smart, but he had a sad secret hobby.*
  If you write it as integration, the story is: *He was so rigorous that he chased his philosophy into the dark and never came back.*

  The more compelling (and accurate) narrative is one of **intellectual desperation**.
  *   **The Setup:** Sidgwick loses his Anglican faith. He builds a new ethical system based on reason.
  *   **The Crisis:** He realizes his system collapses without an afterlife to reconcile self-interest and duty.
  *   **The Quest:** He spends 20 years hunting for scientific proof of the afterlife to save his philosophy.
  *   **The Resolution:** He never finds the proof. He dies essentially agnostic, leaving the "Dualism" unresolved.

  This makes him a more tragic and interesting figure. He wasn't hiding his psychical research from his philosophy; he was asking psychical research to rescue his philosophy.

  ### 4. How to Pitch This to Your Editor
  To keep your editor happy, you can keep the "loss of faith" angle (it's true and humanizing) but tweak the "compartmentalization" angle.

  **Instead of:**
  > "Sidgwick kept his philosophy and his ghost-hunting in separate boxes; one was for his public intellect, the other for his private emotional needs."

  **Try:**
  > "Sidgwick didn't see a wall between his ethics and the occult. He saw a bridge. Having dismantled religious dogma, he realized his utilitarian system required an afterlife to make logical sense. The Society for Psychical Research wasn't a hobby; it was a desperate attempt to find empirical data for the metaphysical premises his ethics required to function."

  ### Recommended Source for Verification
  If you haven't read it, the definitive biography is **Bart Schultz's *Henry Sidgwick: Eye of the Universe***. Schultz argues convincingly that Sidgwick's life was a unified project. He details how Sidgwick's "loss of faith" wasn't just emotional but created a specific philosophical vacuum that the SPR was meant to fill.

  ### Summary
  Your working theory is **biographically right but philosophically shallow.**
  *   **Keep:** The loss of faith as the motivator.
  *   **Keep:** The tension between his rigor and the subject matter.
  *   **Drop:** The idea that it was a "side project" or "irrational hobby."
  *   **Add:** The "Dualism of Practical Reason." This is the smoking gun that connects the ghost hunting to the utilitarianism.

  If you make that connection, you move the piece from "Interesting Historical Quirk" to "Profound Insight into the Limits of Rationalism." That's the story worth writing.
