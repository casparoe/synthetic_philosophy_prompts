      *   *Is it merely verbal?* Some (like Cappelen) argue the whole debate is verbal. I should mention this but lean towards substantive given the specific divergence in the Elena case.
      *   *Check the User's intuition:* The user thinks this troubles PE. I should validate that. This is indeed the standard counter-example to PE (often called the "Attributor's Stakes" objection).

