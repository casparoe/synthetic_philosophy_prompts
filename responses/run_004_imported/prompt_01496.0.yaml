      *   *Refining the "Collapse" worry:* If PE allows attributor stakes to matter, it *is* contextualism. So PE must resist. How? By saying the co-signer is speaking loosely.
      *   *Refining the Dispute:* It's substantive because it affects how we evaluate knowledge claims in law, ethics, and daily life.

  7.  **Self-Correction/Nuance Check:**
