      *   **Pragmatic Encroachment (PE):**
          *   *Core Claim:* Whether a subject *knows* depends (in part) on the *subject's* practical situation (stakes).
          *   *Locus of Shift:* The metaphysical status of knowledge itself changes based on the subject's context.
