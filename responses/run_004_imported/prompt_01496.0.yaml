      *   **PE Prediction:** PE *should* struggle. PE says knowledge depends on *Elena's* stakes. Elena's stakes are fixed. Therefore, the truth value of "Elena knows" should be fixed. If PE says she knows, B is wrong. If PE says she doesn't, A is wrong. PE cannot easily explain why *both* assertions seem appropriate relative to their speakers.
