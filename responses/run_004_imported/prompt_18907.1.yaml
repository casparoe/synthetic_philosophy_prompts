answer: |-
  Elara stood before the containment unit, the Ember-Root pulsing faintly in the center. Her mission was simple: ignite the Root to power the gateway. The Root's disposition was well-documented in the archives—it was combustible iff wetted. A simple conditional analysis. She engaged the hydration nozzle. A fine mist sprayed onto the plant.

  Nothing happened. No flare, no smoke, no heat.

  The diagnostic screen flickered red. *Manifestation Failure.* Elara had enough energy in her suit's capacitor for one corrective action. She could either initiate a *Chemical Reset* on the Root or purge the *Environmental Field*. She had to choose correctly, or the Root would destabilize and turn to ash, useless forever.

  The difference lay in why the water failed to trigger the combustion. Was the Root's intrinsic causal basis—the volatile sap within its veins—still present? Or had the stimulus itself destroyed the property?

  Elara zoomed the scanner onto the Root's internal structure during the spray cycle. The telemetry scrolled rapidly. The molecular alignment of the sap remained perfectly stable throughout the entire watering sequence. The volatile compounds didn't degrade, shift, or vanish. The basis persisted. However, the external sensors showed that the ambient humidity scrubbers in the room had kicked into overdrive the moment the nozzle opened, vaporizing the water molecules before they could settle on the leaves.

  She hesitated. If this were a finkish case, the stimulus itself would have altered the Root. If the disposition were finkish, the moment the water approached, the sap would have reconfigured itself to become non-combustible—a defensive mechanism triggered by the test itself. In that scenario, the basis would not have persisted; the property would have fled the stimulus. Purging the environment would be useless because the Root itself would have lost the power to burn.

  But the telemetry confirmed the basis was intact. The sap was still volatile. The power was there, waiting. The failure wasn't in the object's nature, but in the extrinsic conditions blocking the manifestation. This was a mask. The scrubbers were the antidote to the poison, preventing the effect without touching the cause.

  Elara slammed her hand on the *Purge Environmental Field* command. The humidity scrubbers powered down with a whine. She triggered the nozzle again.

  The mist hit the leaves. This time, it stuck. The sap reacted instantly. A brilliant white flame erupted from the Root, stable and hot. The gateway hummed to life behind her. She had known the disposition remained because the basis survived the test.

  ***

  **Philosophical Key:** The story hinges on distinguishing a **Mask** from a **Fink**. In a **Mask** case (like Johnston's poison/antidote), the intrinsic causal basis persists during the stimulus, but an extrinsic factor prevents manifestation. Elara saw the sap remained volatile (basis intact) despite the water (stimulus), so she removed the extrinsic blocker (scrubbers). In a **Fink** case (like Martin's wire), the stimulus itself causes the intrinsic basis to vanish or change, meaning the disposition is lost *during* the test. If it were a fink, the sap would have changed composition upon contact, and purging the room would not have helped.
