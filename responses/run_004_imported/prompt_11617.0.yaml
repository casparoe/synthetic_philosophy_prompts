answer: |-
  This is one of the most unsettling and philosophically rich dilemmas a writer (or a philosopher) can encounter. You are right to reject the platitude of "separating the art from the artist." In Frege's case, that phrase is particularly inadequate because his "art" is a philosophy explicitly designed to sever the link between the thinker and the thought. To apply that separation is to play by Frege's rules, which feels like letting him win a game he rigged.

  The tension you feel is not just moral; it is structural. It touches on the relationship between the *context of discovery* (the psychological and historical circumstances in which an idea is born) and the *context of justification* (the logical reasons given for accepting it). Frege insisted only the latter matters. History suggests the former cannot be fully scrubbed away.

  Here is a way of thinking through the implications, both for your evaluation of Frege and for your fictional logician.

  ### 1. The Irony of Anti-Psychologism
  You noted the irony: judging Frege's logic by his character seems to commit the fallacy of psychologism. However, there is a deeper layer here. Frege's vehement rejection of psychologism was not merely a technical correction; it was a defensive fortification.

  In the late 19th and early 20th centuries, the rise of democracy, mass society, and historical materialism suggested to many conservatives that truth was becoming "relative" to the people or the class. If truth depends on human consensus (democracy) or historical material conditions (Marxism), then truth is unstable.

  Frege's "Third Realm" can be read as a political sanctuary. By positing a realm of thoughts that exists independently of human minds, he secures a domain that cannot be voted on, cannot be mobbed, and cannot be changed by revolution. It is an aristocratic realm of truth. Therefore, his anti-psychologism is not just a logical stance; it is an *ideological* one. It is a refusal to let the "mob" of human subjectivity touch the laws of number.

  So, when you feel discomfort, you are not necessarily committing psychologism. You are recognizing that the *motivation* for his philosophical architecture may be rooted in a fear of democratic pluralism. The logic remains valid, but the *philosophical vision*—the reason why one would build such a system—becomes suspect.

  ### 2. Validity vs. Vision
  To answer your question directly: Does this bear on his technical achievements? **No.** Does it bear on his philosophical standing? **Yes.**

  *   **Technical Achievement:** The predicate calculus works regardless of Frege's politics. A proof derived using Fregean logic is not invalidated by the author's antisemitism. To claim otherwise would be to succumb to a genetic fallacy. The tools he forged are public property now; they have been scrubbed of his fingerprints by a century of use.
  *   **Philosophical Vision:** This is where the diary matters. Philosophy is not just calculation; it is an account of how we live, speak, and know. If Frege's philosophy of language relies on a notion of "objective thought" that implicitly excludes certain humans from the community of rational agents (as his diary suggests), then the *application* of his philosophy is compromised.

  Michael Dummett's struggle was precisely here. Dummett realized that while Frege's *logic* was sound, Frege's *conception of the philosopher's role* was tainted. Frege viewed the philosopher as a guardian of objective truth against the corrosion of subjective opinion. The diary reveals that "subjective opinion" was code, for him, for democratic participation and Jewish influence.

  The principled line to draw is this: **We can accept the tool without accepting the blueprint.** We can use quantificational logic without accepting the Platonist metaphysics that motivated it, nor the political quietism that accompanied it.

  ### 3. The "Shadow" in the Novel
  For your novel, this offers a profound opportunity to avoid caricature. If you make your logician a villain simply because he is bigoted, you reduce him to a political prop. If you ignore the bigotry, you sanitize history. The interesting space is in the *connection* between the logic and the bigotry.

  Consider this angle: Your character does not turn to logic *despite* his politics, but *because* of them.
  *   He sees the Weimar Republic as a place of noise, compromise, and impurity.
  *   He sees logic as a place of silence, absolute authority, and purity.
  *   His longing for a "strong leader" in the political sphere mirrors his commitment to "strong laws" in the logical sphere. He wants an authority that does not negotiate.

  This makes him tragic rather than monstrous. He is seeking order in a chaotic world, but his definition of order is exclusionary. He seeks a "Third Realm" because he cannot bear the messiness of the human realm. This aligns with the historical Frege, who was deeply disappointed by the failure of his *Grundgesetze* (due to Russell's Paradox) and retreated into a bitter isolation. The collapse of his logical system may have reinforced his belief that the human world (and the humans in it) were flawed, not the system.

  ### 4. How to Evaluate the Man and the Work
  You asked if there is a principled way to draw the line. Here is a proposal:

  **Judge the propositions by their truth, but judge the system by its consequences.**

  Frege's propositions (e.g., about quantification) are true. But his *system* of thought encouraged a style of philosophy that values rigor over relevance, and purity over community. This style, taken to extremes, can lead to a philosophy that is indifferent to human suffering because suffering is "subjective" and logic is "objective."

  The discomfort you feel is the recognition that **objectivity can be a weapon.** When Frege argues that thoughts belong to a realm independent of us, he is also arguing that *we* are subordinate to the thoughts. If he believes certain groups are incapable of grasping these thoughts (a common antisemitic trope of the era regarding "abstract" vs. "concrete" thinking), then the "Third Realm" becomes a gated community.

  ### 5. Recommendation for the Character
  Do not let the shadow fall across the character as a secret stain that is revealed to discredit him. Let it be the texture of his tragedy.

  *   **Don't:** Have another character read the diary and say, "Your logic is fascist." That is historically and philosophically clumsy.
  *   **Do:** Have the logician express a longing for a world where meaning is fixed, where words cannot be twisted by politicians, where there is One Right Answer. Let the reader see that this longing is beautiful (who doesn't want clarity?) but also dangerous (who decides the Answer?).

  The real horror of the Frege case is not that a racist did math. It is that the desire for absolute certainty—the very engine of philosophy—can be fueled by a fear of the "other." Your character should embody the seduction of that certainty. He should be compelling *because* his logic offers a refuge from the Weimar chaos, making his political conclusions feel, to him, like a necessary defense of order rather than an act of hate.

  ### Summary
  The discovery does not invalidate Frege's logic, but it invalidates his **neutrality.** It forces us to admit that the drive for absolute objectivity can itself be a subjective, historically situated reaction to political anxiety.

  For your novel, this is gold. It allows you to portray a man who believes he is serving the highest, purest truth, while blind to the fact that his conception of "purity" is poisoning his view of his neighbors. That is not a cheap trick; it is the central tragedy of the intellectual in the face of totalitarianism.
