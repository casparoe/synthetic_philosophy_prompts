      *   *Generality:* Think of a list. "US President." There are many presidents (Washington, Lincoln, Biden). That's generality. But for any specific person, it's either definitely true or definitely false that they are President. The *set* is large, but the *boundary* is sharp.
      *   *Vagueness:* Think of a fading color. "Red." There are many red things. But there are also orange-red things where you can't say if it's in the set or not. The *boundary* is fuzzy.
