answer: |-
  **Setting:** *The bleachers of a university gym, immediately after the professor finishes outlining Nozick's Wilt Chamberlain argument on the whiteboard. The seminar has spilled out for a break. Gerry (channeling G.A. Cohen) leans over to Nick (a committed Nozickian).*

  **1.**
  **Gerry:** You noticed how quickly the professor moved from D1 to D2? He treated the transition as if it were physics—just particles moving voluntarily. But D1 isn't a pile of cash; it's a legal structure. By calling the move to D2 "free transfer," he's smuggling in full liberal private property rights as the default. He's assuming that in D1, I have the right to alienate my share completely without anyone else's consent. That's not neutrality; that's a choice.

  **Nick:** It's not smuggling; it's derivation. If we own ourselves, we own our labor. If we own our labor, we own what we produce or acquire through voluntary exchange. D1 represents holdings justified by prior just steps. To say I need consent to transfer what is *mine* is to say others have a partial claim on me. That's not neutrality, Gerry; that's servitude.

  **2.**
  **Gerry:** But "what is mine" depends on the regime of external ownership. Nozick assumes private ownership of the world is compatible with self-ownership. But imagine D1 stipulated joint ownership of external resources. In that case, Wilt can't charge admission unless everyone consents. The move to D2 wouldn't be a "free transfer"; it would be a violation of the joint owners' rights. Why is the private property baseline the "free" one and the joint ownership baseline the "interference"?

  **Nick:** Because joint ownership of the world gives everyone a veto power over everyone else's actions. If I need your consent to use a patch of earth to grow food, you effectively own my labor power—you can starve me into compliance. Private appropriation leaves others enough and as good, or at least doesn't worsen their position relative to the state of nature. Joint ownership worsens everyone's position by paralyzing use.

  **3.**
  **Gerry:** That's the Lockean proviso kicking in, but it's empirical. You're saying private property is better *consequentially*. But structurally, joint ownership protects equality of power. If Wilt's talent is a natural asset, why does appropriating the court—the scarce resource needed to display that talent—give him the right to exclude? In D1, under joint ownership, we could let him play *on the condition* that the surplus is shared. That's not a veto on action; it's a term of access.

  **Nick:** A term of access imposed without my consent is a tax on my activity. You're saying I can use my body to entertain, but only if I surrender the proceeds to the collective. That separates me from the fruits of my labor. You talk about equality of power, but what you're describing is equal ownership of *other people*. If you have a claim on the value I generate, you have a claim on the time I spent generating it.

  **4.**
  **Gerry:** I'm not claiming ownership of your time. I'm claiming that the *external* resources you use to monetize that time are collectively owned. Your self-ownership gives you the right to dance, but not the right to monopolize the floor without compensating the other co-owners. Nozick begs the question by assuming that initial appropriation creates an absolute right to exclude. Why isn't the default that resources are held in common until agreed otherwise?

  **Nick:** Because "held in common" is not a default; it's an affirmative constraint. To say resources are common is to say I cannot act without a meeting. Liberty is the absence of interference. If I pick up an unowned apple, I interfere with no one. If you say, "Stop, that apple is ours," *you* are interfering with me. The burden of justification is on the person restricting the action, not the actor.

  **5.**
  **Gerry:** But the apple wasn't unowned; it was owned by all of us. You're defining "interference" solely as physical coercion against the person, ignoring economic exclusion. If I appropriate the only water hole, I haven't touched your body, but I control your life. Nozick's liberty is purely formal. It protects the liberty of the propertied to exclude, not the liberty of the non-propertied to survive. D2 isn't just unequal; it's a shift in sovereignty.

  **Nick:** Sovereignty over what? If I dug the well, it's mine. If I found it, and left enough for you, it's mine. If you claim a share of my well because you exist, you're claiming a right to my labor in digging it. You keep circling back to outcomes. You want D2 to look like D1. But justice isn't a snapshot; it's a process. If the process was voluntary, the outcome is just, regardless of the pattern.

  **6.**
  **Gerry:** The process is only voluntary within the rules of the game. And Nozick writes the rules to guarantee inequality. Look, suppose in D1 we agree that any transfer exceeding a certain threshold requires community approval. That's a voluntary agreement in D1! If we bind ourselves to that, then Wilt's accumulation in D2 violates the initial contract. Why is *that* initial binding invalid?

  **Nick:** Because you can't bind future consent. I can agree today not to sell my labor tomorrow, but that agreement is voidable because it violates my self-ownership tomorrow. Rights are side constraints, not goals. You can't sign away your right to change your mind about how to use your holdings. Any D1 agreement that locks in a pattern requires continuous interference to enforce against future voluntary deviations.

  **7.**
  **Gerry:** That's the "liberty upsets patterns" line, but it assumes the only liberty worth protecting is the liberty to accumulate. What about the liberty to live in a society without feudal power structures? Wilt in D2 isn't just rich; he's a gatekeeper. By allowing unlimited accumulation, you allow private citizens to wield coercive power over others' life chances. That undermines the very independence self-ownership is supposed to protect.

  **Nick:** Wealth isn't power unless you assume resources are zero-sum. In a free market, Wilt gets rich by serving people, not ruling them. If he becomes a gatekeeper, others can build competing courts. Your fear is that inequality leads to domination, but my fear is that equality requires domination. To maintain your D1 pattern, you need a state that stops me from paying Wilt. Who is the gatekeeper then?

  **8.**
  **Gerry:** The state isn't a gatekeeper; it's the umpire enforcing the initial property rules. We're back to the start: what are the rules? Nozick asserts private appropriation is the only rule compatible with separate persons. I'm saying joint ownership is compatible with separate persons *plus* equality. You haven't proven private appropriation is the default; you've just asserted it's the only one that doesn't look like coercion to you.

  **Nick:** I've proven it's the only one that doesn't *act* like coercion. Joint ownership requires a central authority to manage the commons or unanimous consent for every act. That authority must coerce those who want to use resources differently. Private property disperses authority. You say I'm asserting a default; I say I'm recognizing that we are distinct individuals, not shares in a collective asset.

  **9.**
  **Gerry:** Distinct individuals who happen to be born into a world we all need. Nozick's argument works perfectly if we drop from the sky with our holdings. But we don't. We inherit the property regime. Choosing private property over joint ownership is a political choice that privileges accumulators. You win the argument only because you define the starting line where your runners are already wearing spikes.

  **Nick:** And you win only by defining the starting line as a chain gang where we're all handcuffed to each other. If I own myself, I must be able to act without your permission. If you deny me that, you don't care about equality; you care about ownership. You just want everyone to own everyone else equally. I'll take the spikes.
