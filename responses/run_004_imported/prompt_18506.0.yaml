answer: |-
  The philosophical literature on the "standing to blame" often relies on what we might call the **Live Inconsistency Account**. According to this view, hypocrisy is a present-tense contradiction: you lack the standing to condemn me for doing X only if you are currently doing X (or secretly excusing yourself from the norm while enforcing it against me). Under this framework, your father is in the clear. He is not smoking. He is consistent. Therefore, he has the moral jurisdiction to blame you.

  However, this view treats moral standing as a binary switch that flips back to "on" the moment compliance is restored. This is too thin a conception of moral authority. A more robust account suggests that standing is not merely about current compliance, but about one's **historical relationship to the norm** and the **relational trust** required to enforce it.

  Here is the argument for why your father's sincere reform diminishes but never fully restores the standing he forfeited during his thirty years of smoking.

  ### 1. The Jurisdictional Model of Standing
  Think of moral standing not as a right inherent to all moral agents, but as a form of jurisdiction, similar to a judge in a courtroom. If a judge is found to have accepted bribes in the past, we do not say their standing is restored simply because they stopped accepting bribes five years ago. Even if they are now scrupulously honest, their history compromises their authority to sentence others for corruption.

  Why? Because moral blame is a communicative act that demands, "You must answer to this norm." When your father smoked for three decades, he effectively opted out of the jurisdiction of that norm. He signaled, through action, that the health risks and addictive dangers of nicotine were acceptable trade-offs for him. By participating in the normalization of that behavior for thirty years, he weakened the normative force of the rule he now seeks to enforce. Reform stops the bleeding, but it does not erase the scar tissue. The authority to blame is a relational asset that depreciates through violation; reform halts the depreciation, but it does not appreciate the asset back to its original value.

  ### 2. Complicity in Normalization
  Your father's lack of standing is not just about his personal health; it is about his complicity in the environment that made your vaping seem like a viable option. Moral norms are sustained socially. When he smoked a pack a day for thirty years, he contributed to a household and social culture where nicotine use was present, normalized, and modeled.

  If he had never smoked, his warning would come from a place of external observation. Because he smoked, his warning comes from a place of **historical complicity**. He helped build the very trap he now warns you against. To blame you now is to ignore his own role in making the behavior seem permissible. He cannot claim the moral high ground on a hill he helped flatten. His history means he lacks the "clean hands" required for full-standing blame. He can offer wisdom, but he cannot offer condemnation, because the conditions of your vulnerability to nicotine were partially shaped by his precedent.

  ### 3. The Distinction Between Advice and Blame
  It is crucial to distinguish between *blame* (a reactive attitude implying moral fault and demanding accountability) and *advice* (a forward-looking concern for well-being).

  Your father's reform grants him **epistemic authority** but denies him **moral authority**.
  *   **Epistemic Authority:** He knows better than anyone the grip of addiction and the difficulty of quitting. He is uniquely qualified to warn you of the consequences.
  *   **Moral Authority:** This is the right to hold you accountable as a moral inferior for the act.

  Because he surrendered his moral authority on this issue for thirty years, he cannot reclaim it fully. When he blames you, he implies a hierarchy: "I am the responsible one; you are the irresponsible one." But his history destabilizes that hierarchy. He is not a non-user lecturing a user; he is a *former* user lecturing a *current* user. The difference matters. The former user knows that the line between use and abuse is porous, and that their own non-use is partly a matter of luck, timing, and circumstance, not just superior virtue. To blame you is to forget the contingency of his own reform.

  ### 4. The "Moral Debt" of Addiction
  Addiction is a unique category of wrongdoing because it involves the surrender of agency. For thirty years, your father's agency regarding nicotine was compromised. In philosophical terms, he incurred a "moral debt" regarding this specific vice.

  Paying off that debt (by quitting) restores his self-governance, but it does not repay the debt owed to those he influences. There is a lingering **residue of vulnerability**. Because he was addicted for so long, his concern for your vaping is inevitably tinged with projection, anxiety, and perhaps a subconscious desire to validate his own suffering by ensuring you do not follow his path.

  This psychological complexity undermines the purity required for full standing to blame. True moral blame requires a certain disinterestedness—a commitment to the norm for the norm's sake. Your father's commitment is inextricably linked to his personal trauma and history. His blame is not purely about your welfare; it is also about his own narrative of redemption. When the blamer has a vested emotional interest in the offender's compliance due to their own past failures, their standing is attenuated.

  ### 5. Conclusion: The Permanent Attenuation
  The standard view assumes that time and compliance wash away moral stains. But moral standing is constitutive; it is built by our history, not just our current state.

  Your father's quitting is a monumental achievement and deserves respect. However, it changes his status from "active violator" to "reformed violator." It does not change his status to "never violator." And it is the "never violator" who holds the full standing to blame.

  Therefore, your father has the standing to **warn**, to **support**, and to **share his experience**. He does not have the standing to **condemn** or to treat your vaping as a moral failing for which you must answer to him specifically. His history imposes a permanent ceiling on his moral jurisdiction over your choices. He forfeited the right to be the judge of nicotine use the moment he lit his first cigarette, and while he has served his time, the court of his moral authority on this specific matter remains permanently limited.
