      *   **Expected Value Calculation:** $E[X] = \sum_{n=1}^{\infty} P(n) \cdot X_n = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}$.
