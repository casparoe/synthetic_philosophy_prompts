      *   **Condition:** This series converges *conditionally*, not *absolutely*.
      *   **Absolute Convergence:** $\sum |X_n| P(n) = \sum \frac{1}{n} = \infty$.
      *   **Implication:** By the Riemann Rearrangement Theorem, the sum can be made to equal anything if terms are reordered. In probability theory, if $E[|X|] = \infty$, the expectation $E[X]$ is often considered undefined or not well-behaved (Law of Large Numbers fails).
