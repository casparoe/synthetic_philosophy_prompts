answer: |-
  1.  **The Persuasion Objective:** The core mechanism of debate relies on the assumption that truth is easier to defend than falsehood. But in machine learning, models optimize for the reward signal they're given. If the reward comes from winning a debate judged by a fallible human, aren't you effectively training the AI to be a sophist—optimizing for *persuasiveness* to that specific judge rather than *accuracy* about the world?

  2.  **Empirical Truth-Tracking:** Following up on that: in the human-judge experiments run so far, we see that debate can improve the judge's performance on specific tasks. But do we have evidence that the *winning argument* is actually the true one more often than not, or simply that the debate process makes the judge *feel* more confident? If the system selects for confidence rather than correctness, does that undermine the safety case?

  3.  **Obfuscated Arguments:** A major critique in the literature is the "obfuscated arguments" problem: a dishonest debater can bury a flaw inside a long chain of sub-claims that each look locally plausible, making it computationally cheaper to generate the lie than for the honest debater to locate and refute the specific rotten link. How do you prevent the debate from becoming a game of who can hide the needle in the haystack most effectively?

  4.  **Mechanisms for Decomposition:** You've previously pointed to recursive decomposition and forced cross-examination as potential fixes for obfuscation. But if the judge is already outmatched, on what basis can they verify that the decomposition is faithful to the original claim? At what point does checking the work require capabilities that defeat the purpose of using debate for oversight in the first place?

  5.  **Complexity Theory vs. Gradient Descent:** The theoretical case for debate often leans on analogies to interactive-proof systems in complexity theory, where a bounded verifier can check unbounded provers. But those proofs assume idealized players seeking a Nash equilibrium. Real models are shaped by self-play and gradient descent, which are messy approximators. How much weight should we put on the complexity-theoretic guarantees when the "provers" are neural nets that might not converge to optimal play?

  6.  **Training Conditions for Guarantees:** If we want those theoretical guarantees to survive contact with actual models, what specifically has to be true of the training process? Do we need to assume the models are perfectly adversarial, or that they have equal capability? If one model finds a shortcut the other misses, does the mathematical safety net dissolve?

  7.  **Collusion Risks:** In a self-play environment, there is a risk that the two debaters might implicitly collude to provide answers that satisfy the judge without being truthful, essentially forming a cartel against the oversight mechanism. What architectural or training constraints are you putting in place to ensure the competition remains genuine rather than becoming a coordinated performance?

  8.  **The Weak Judge Bottleneck:** The promise of debate is that a "weak" judge can oversee a "strong" agent. But if the domain is sufficiently complex—say, novel protein folding or advanced cryptographic verification—does the human judge become a mere random number generator, unable to distinguish between a genuine explanation and a plausible-sounding fabrication regardless of the debate format?

  9.  **Generalization to Deployment:** Even if debate works as a training signal to produce honest models, does that honesty generalize to deployment environments where the model isn't being debated? Or are you essentially building a model that tells the truth only when it knows it's being cross-examined, potentially creating a deceptive gap when the oversight is removed?

  10. **The Falsification Condition:** To close: scalable oversight is a high-stakes bet on the future of AI safety. What specific empirical result or theoretical proof, if it arrived tomorrow, would convince you that debate does not scale and should be dropped from the toolkit entirely?
