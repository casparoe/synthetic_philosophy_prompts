answer: |-
  This is arguably the most famous objection to the Free Energy Principle (FEP), and you are in excellent company. It is known as the **"Dark Room Problem"** (or sometimes the "Dark Room Paradox"), and Friston and his colleagues have spent a significant amount of time addressing it.

  If you present this objection in your seminar without the standard FEP rebuttal, your students will think you haven't read the literature past the abstract. However, your intuition is correct: *if* the theory were simply "minimize sensory surprise," it would indeed predict that organisms should lobotomize themselves and sit in a dark room.

  Here is the breakdown of why proponents claim this isn't fatal, followed by the philosophical criticisms that keep the debate alive. This should give you plenty of material for your seminar.

  ### 1. The Technical Solution: Expected Free Energy
  The short answer is that organisms do not minimize *current* surprise; they minimize **Expected Free Energy (EFE)** over the future.

  In the FEP framework (specifically under **Active Inference**), an agent acts based on a generative model that includes **prior preferences**. These aren't "preferences" in the hedonic sense (what feels good), but probabilistic priors about the states the organism expects to occupy.

  *   **The Prior of Living:** A living organism has a deep prior belief that it will remain within physiological bounds (e.g., temperature, glucose levels, structural integrity).
  *   **The Dark Room Violation:** While a dark room offers low *sensory* surprise, it creates high *long-term* surprise relative to the prior of "being a living, feeding, reproducing organism." If I stay in the dark room, I starve. Starvation is a state that is highly "surprising" for a living system (because it implies the system no longer exists).
  *   **The Math:** The EFE equation splits into two terms:
      1.  **Pragmatic Value:** Minimizing divergence between outcomes and prior preferences (e.g., getting food).
      2.  **Epistemic Value:** Maximizing information gain (resolving uncertainty).

  Therefore, an agent leaves the dark room not to maximize surprise, but to minimize the *expected* surprise of dying later, and to resolve uncertainty about where food is located now.

  ### 2. Exploration as Uncertainty Reduction
  You mentioned that animals "seek out novelty." In FEP, this is reinterpreted not as seeking surprise, but as seeking **information gain** to reduce future surprise.

  If an agent is uncertain about its environment, its predictions are imprecise. By exploring (taking a risk, moving to a new location), the agent samples data that reduces the entropy of its posterior beliefs. This is the **epistemic value** term in the EFE.

  *   **Example:** A rat doesn't explore a maze because it loves novelty; it explores because its model of the maze has high uncertainty. Resolving that uncertainty allows it to predict where food is more accurately later, thereby minimizing long-term free energy.
  *   **Boredom:** In FEP terms, boredom is the state where epistemic value drops to zero. There is no new information to be gained in the current context, so the system is driven to change context to find new opportunities for uncertainty reduction.

  ### 3. Why Is It Still Taken Seriously?
  If the Dark Room Problem requires this many caveats, why is FEP dominant in cognitive science?

  **A. Unification:** It offers a single mathematical language for perception (updating beliefs), action (sampling data), and learning (updating the model). Most other theories treat these as separate modules. FEP says they are all the same process (minimizing free energy) operating over different time scales.

  **B. Normative Power:** It provides a "first principle" derivation of behavior. Instead of saying "animals seek food because evolution made them," FEP says "any system that persists must minimize free energy; therefore, animals must seek food." It attempts to ground biology in physics/information theory.

  **C. Empirical Success:** Despite the philosophical headaches, Active Inference models have successfully replicated specific neural phenomena (e.g., dopaminergic signaling, eye movements, smooth pursuit) that other models struggle with.

  ### 4. The Philosophical Counter-Attack (For Your Seminar)
  However, your skepticism is shared by many philosophers of science. Here are the arguments you can use to balance the scales in class:

  **A. The Tautology Charge:** Critics (like Colombo & Wright, 2017) argue that FEP is unfalsifiable. If an organism stays in a dark room, FEP says "it preferred the dark room." If it leaves, FEP says "it preferred food." If the priors can be adjusted to fit *any* behavior, does the theory explain anything? Proponents argue the priors are constrained by evolution/structure, but critics remain unconvinced.

  **B. The "As If" Problem:** FEP is often framed as if the brain is literally doing Bayesian integration. Many philosophers argue this is merely a useful descriptive fiction (instrumentalism) rather than a claim about mechanistic reality. Does the brain *actually* calculate free energy, or is FEP just a high-level description that happens to fit?

  **C. Complexity vs. Insight:** Some argue that the math is so complex that it obscures rather than illuminates. Does framing "hunger" as "minimizing divergence from prior preferences regarding glucose states" actually help us understand the psychology of hunger, or does it just add jargon?

  ### Summary for Your Class
  To answer your specific question: **No, it is not as damning as it sounds, provided you accept the distinction between minimizing *sensory* surprise and minimizing *expected* free energy regarding *survival* priors.**

  However, the Dark Room Problem highlights the tension in FEP between **physics** (minimizing entropy) and **biology** (maintaining specific far-from-equilibrium states).

  **Teaching Tip:**
  Frame the seminar session as a trial.
  *   **Prosecution (The Psychologist?):** The Dark Room Problem. If the theory predicts organisms should seek sensory deprivation, it fails descriptively.
  *   **Defense (The Philosopher?):** The Expected Free Energy defense. The theory accounts for exploration via epistemic value and survival via deep priors.
  *   **Jury (The Students):** Is the defense a genuine solution, or is it ad-hoc maneuvering to save a tautology?

  This framing acknowledges the validity of the objection while ensuring the technical nuance of the theory is respected.

  **Key References for the Syllabus:**
  *   **The Objection:** Colombo, M., & Wright, C. (2017). *First principles in the life sciences: the free-energy principle, organicism, and mechanism.*
  *   **The Defense:** Friston, K., et al. (2015). *Active inference and epistemic value.* (Specifically addresses the Dark Room).
  *   **The Nuance:** Parr, T., & Friston, K. (2019). *The anatomy of choice: Active inference and agency.* (Breaks down the Expected Free Energy terms).

  It's a great topic for a grad seminar because it sits right on the fault line between math, biology, and philosophy. Enjoy the debate!
