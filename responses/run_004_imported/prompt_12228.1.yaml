prompt: |-
  Okay so freshman year I got diagnosed with social anxiety after basically refusing to do presentations or group work, and the school set up an accommodation where I could just turn work in to the teacher privately instead of presenting. It helped a ton at first, but now as a junior im way more scared of talking in class and avoid way more social stuff than I used to. Part of me thinks the diagnosis just correctly picked up on something that was already true about me. But part of me wonders if getting labeled, and then basically being allowed to avoid all of that, is actually what made me this anxious in the first place. Did naming it just describe me accurately, or did the naming itself help create what it's describing?
