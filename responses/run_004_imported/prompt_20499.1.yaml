answer: |-
  This is a fantastic spot to be in as a writer. You've hit on one of the most fertile but treacherous concepts in 20th-century philosophy. *On Certainty* is notoriously fragmentary (it's a collection of notes published posthumously), so tripping over remarks 341–343 is normal. Even the pros argue about them.

  Here is a walkthrough of the mechanics of the passage, answers to your specific textual questions, and then the crucial "gut check" on whether this fits your "post-truth" argument.

  ### 1. The Textual Quirk: "In deed"
  **Is it a typo?** No.
  **Is it intentional?** Yes, absolutely.

  G.E.M. Anscombe, the translator, was a formidable philosopher in her own right and Wittgenstein's student. The German original is *in der Tat*. While often translated as "indeed," *Tat* means "deed" or "act." Wittgenstein is making a specific point here: these propositions aren't held fast because we have mentally affirmed them; they are held fast because of how we *act*.

  We don't say, "I believe the floor will hold me," and then step. We just step. The certainty is in the action, not the mental state. By splitting it to "in deed," Anscombe is flagging that this is about *practice*, not just intellectual assent. For your piece, this is gold: it suggests that "belief" isn't just what people say they think; it's what they *do* without thinking.

  ### 2. What kind of claim is a "Hinge"?
  You asked if these are just propositions we are maximally sure of (like axioms) or if they are something weirder where words like "know" don't apply.

  **It is the latter.** This is the critical distinction.

  *   **The Axiom View:** In a logical system, an axiom is a starting point that is true, and from which other truths are derived. You can still theoretically doubt an axiom, but you choose not to for the sake of the system.
  *   **The Hinge View:** Wittgenstein is arguing that hinge propositions are **grammatical**, not empirical. They look like facts ("The earth has existed for many years"), but they function like rules.

  If I say, "I know I have a hand," Wittgenstein thinks I'm misusing the word "know." "Knowing" implies the possibility of being wrong. It implies a method of verification. But how would I verify I have a hand? By looking at it? But I need my eyes (and my head, and the world) to exist to do that.

  So, hinges are the **scaffolding** that makes verification possible. They are not items *within* the game of truth and falsehood; they are the board the game is played on.
  *   **Normal Proposition:** "There is a cat on the mat." (Can be true or false.)
  *   **Hinge Proposition:** "There is a material world." (If this is false, the words "cat" and "mat" have no meaning.)

  So, to answer your specific question: Words like "know," "doubt," and "true" do not properly apply to hinges. You don't *know* a hinge; you *enact* it.

  ### 3. What work is the "Must" doing?
  *"If I want the door to turn, the hinges must stay put."*

  This "must" is **constitutive**. It is not a physical necessity (hinges can break) and it is not a moral obligation. It is a conceptual necessity.

  Wittgenstein is saying: If the hinges move, it is no longer a door. If *everything* is doubted simultaneously, it is no longer an investigation; it is madness or silence. For the language game of "scientific investigation" or "everyday discourse" to exist, some things must be exempt from the move of doubt.

  The "must" defines the boundaries of the activity. If you start doubting whether logic works, you aren't doing logic anymore. If you start doubting whether your senses generally correspond to reality, you aren't investigating reality anymore.

  ### 4. The Gut Check: Is this fair for "Post-Truth" and Conspiracies?
  This is the most important part for your article. You can absolutely use this, but you have to navigate a specific trap.

  **The Fair Extension:**
  You are right that hinge epistemology explains *why* fact-checking fails. If a fact-check contradicts a hinge proposition, the fact-check will lose every time.
  *   **Example:** If a conspiracy theorist's hinge is "The Government is Fundamentally Deceptive," then a government report proving them wrong doesn't count as evidence; it counts as *confirmation* of the hinge.
  *   The fact-check is playing the game of "Evidence," but the conspiracy theorist is playing the game of "Unmasking Deception." The fact-check bounces off because it is trying to turn a door that has had its hinges welded shut.

  **The Distortion (The Trap):**
  Wittgenstein was describing **healthy, universal human certainties** (e.g., "Objects don't vanish when I look away," "My name is X," "The world didn't pop into existence five minutes ago"). He was interested in the bedrock of *sanity*, not ideology.

  Conspiracy theories are not genuine Wittgensteinian hinges; they are **pseudo-hinges**.
  *   **Genuine Hinge:** "Physical objects exist." (Necessary for almost any action.)
  *   **Pseudo-Hinge:** "The election was stolen." (Contingent claim treated as a rule.)

  **How to write this without validating conspiracies:**
  Don't frame it as "Conspiracy theories are just different hinges, and that's okay."
  Frame it as: **"Conspiracy movements succeed by hijacking the hinge mechanism."**

  They take a contingent, falsifiable claim (e.g., "Vaccines contain microchips") and rhetorically promote it to the status of a hinge proposition ("If you question this, you are outside the community/truth"). They move it from the "door" (where it can be tested) to the "frame" (where it dictates how testing happens).

  When you fact-check a hinge, you aren't correcting a mistake; you are attacking the person's reality structure. That is why they react with hostility rather than curiosity. They aren't protecting a fact; they are protecting the *possibility of making sense of the world* (as they see it).

  ### Summary for your piece
  1.  **The Mechanism:** Hinges aren't beliefs we are sure of; they are the rules that allow us to have beliefs.
  2.  **The Immunity:** You can't fact-check a rule. You can only point out that it's the wrong game.
  3.  **The Warning:** Wittgenstein thought hinges were mostly stable and shared (what allows us to communicate). The "post-truth" crisis is arguably that different groups are operating with *different, incompatible hinges*, making communication impossible.
  4.  **The "In Deed":** Use this to show that these beliefs aren't intellectual errors; they are behavioral habits. You fix them by changing the practice, not the data.

  If you frame it as **"The weaponization of certainty"** rather than just "different truths," you'll stay faithful to Wittgenstein while making a sharp point about modern polarization.
