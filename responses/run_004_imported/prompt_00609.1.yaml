      *   *Argument C: The "Dangerous Precedent" Argument.* Allowing law to be based on antipathy opens the door to arbitrary tyranny, which causes massive long-term insecurity (a major pain for everyone).
          *   *Strength:* This aligns with Rule Utilitarianism or long-term consequence analysis.

