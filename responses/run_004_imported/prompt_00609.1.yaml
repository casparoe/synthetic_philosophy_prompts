      *   *Key Textual Point:* Bentham argues that the pain of antipathy is "negative" pleasure (relief from pain) whereas punishment inflicts "positive" pain. He often weighs positive pain heavier than the relief of antipathy.
      *   *Wait, check the "Prejudice" claim:* Bentham argues that antipathy without mischief is *groundless*. For a utilitarian, "groundless" means "not grounded in harm." If it's not grounded in harm, satisfying it creates harm without preventing harm. That's the utilitarian hook.

