      *   **Part 4: Assessment - Strict Hedonism or Imported Standard?**
          *   *Verdict:* It's a mix. The "Futility" argument is strict hedonism. The "Prejudice" argument flirts with a "rational preference" view or a "Rule Utilitarian" constraint.
          *   *The "External Preference" Problem:* (Dworkin's critique, though anachronistic). Should external preferences (what I want *you* to do) count? Bentham seems to say "no" if they are prejudiced.
