answer: |-
  This is an exceptionally sharp puzzle, one that cuts to the heart of the tension between Bentham's psychological hedonism (all pains are real pains) and his legislative utilitarianism (not all pains justify state coercion). Your students have identified what looks like a contradiction: if the calculus is impartial, why does the *genealogy* of a pain (prejudice vs. harm) matter for its *weight*?

  Here is a reconstruction of the underlying logic of Bentham's argument in *Offences Against One's Self*, followed by an assessment of whether it holds together within strict hedonistic utilitarianism.

  ### 1. Reconstructing Bentham's Argument Charitably

  To see if this is sleight of hand, we must distinguish two distinct lines of argument Bentham deploys, which your summary conflates slightly. They operate on different levels of the utilitarian calculus.

  **Argument A: The Instrumental/Futility Claim (The "Marginal Utility" Argument)**
  This is the argument you noted regarding social stigma. Bentham argues that the "pain of antipathy" felt by the public is already partially assuaged by the existence of social shame and informal sanctions. To add *legal* punishment on top of social stigma yields diminishing returns for the spectators (they don't feel much *more* pleasure seeing a man hanged versus a man shunned) but imposes massive *new* pain on the offender (loss of liberty, life, or physical suffering).
  *   **Hedonic Status:** This is pure, strict utilitarianism. It accepts the pain of antipathy as real but argues that the *marginal cost* of legal punishment outweighs the *marginal benefit* of satisfying that antipathy.

  **Argument B: The Principled/Prejudice Claim (The "Groundlessness" Argument)**
  This is the trickier claim: that antipathy not grounded in "mischief" (harm) is "groundless" and should not count as a legitimate legislative input.
  *   **Hedonic Status:** This looks like it violates the "push-pin is as good as poetry" dictum. However, a charitable reading suggests Bentham is not saying the *feeling* is unreal, but that the *satisfaction of the preference* is instrumentally dangerous.

  ### 2. Can a Strict Hedonist Discount "Prejudicial" Pains?

  Your students ask: *On what non-circular basis can he discount a pain merely because its causal history runs through "prejudice"?*

  If Bentham were a simple act-utilitarian counting immediate feels, he couldn't. But Bentham is a **legislative utilitarian concerned with security and expectation.** Here is how he can discount the pain without abandoning hedonism:

  **1. The Malleability of Antipathetic Pain**
  Bentham treats the pain of antipathy as epistemically dependent. It exists *only* because the spectator believes the act is harmful. If the spectator is educated to believe the act is harmless, the pain vanishes.
  *   **The Calculus:** The pain of punishment (whipping, imprisonment) is *intrinsic* and physical; it cannot be educated away. The pain of antipathy is *belief-dependent*; it can be dissolved by information.
  *   **The Move:** A rational legislator should always choose the path of least resistance. It is more efficient to cure the prejudice (which costs little pain) than to punish the act (which costs great pain). Therefore, the "prejudice" premise isn't dismissing the pain's existence; it's flagging it as the *cheaper pain to eliminate*.

  **2. The Security Principle (The Long-Term Calculus)**
  This is Bentham's strongest defense. In the *Introduction to the Principles of Morals and Legislation*, Bentham argues that **Security** is the primary object of law.
  *   If the law accepts "antipathy" as a sufficient ground for punishment, then *no one is secure*. Any majority whim could become a crime.
  *   This creates a pervasive "pain of insecurity" for *everyone* in society (including the disgusted majority, who might one day be in the minority).
  *   **The Calculation:** The immediate pleasure the spectators get from punishing a "sodomite" is outweighed by the long-term, systemic pain of living in a society where law is unmoored from harm and tied to volatile sentiment.
  *   **Conclusion:** Bentham isn't saying the pain of disgust doesn't count. He is saying that **accommodating it** triggers a much larger counter-weight of pain (insecurity/tyranny) in the long run.

  ### 3. Does He Need the "Prejudice" Premise?

  You ask whether the argument could stand on the "futility" point alone.

  **Strictly speaking, no.** If the futility argument holds (that social stigma already satisfies the antipathy sufficiently), the legal punishment is net-negative utility regardless of whether the antipathy is prejudiced or rational.

  **However, strategically, he needs the "Prejudice" premise.**
  If Bentham argues *only* from futility, he leaves the door open for the counter-argument: *"What if social stigma isn't enough? What if the public is so enraged that only execution will soothe them?"*
  *   If the ground for law is *only* the balancing of pains, then a sufficiently large and enraged mob *would* justify punishment.
  *   By invoking the "Prejudice" premise, Bentham establishes a **exclusionary rule**: Pains derived from non-harmful acts are *ineligible* for legislative satisfaction, regardless of intensity.
  *   This moves Bentham from Act Utilitarianism toward a form of **Rule Utilitarianism**. The rule "Never punish harmless acts, even if the mob demands it" produces more utility (security) than calculating each case individually.

  ### 4. Assessment: Principled Move or Sleight of Hand?

  Is this a genuine principled move, or does it import a non-hedonic standard?

  **The Verdict: It is a principled move, but it requires a sophisticated "Long-Term/Rule" Hedonism.**

  If you read Bentham as a crude act-utilitarian (maximize pleasure right now), then yes, it is sleight of hand. He is arbitrarily discounting the "external preferences" of the disgusted public.

  However, if you read Bentham as a **institutional designer**, the logic holds:
  1.  **Truth-Tracking:** Law should track *real* mischief, not *imagined* mischief. Satisfying preferences based on falsehoods leads to systemic error.
  2.  **Insecurity:** The pain of living under arbitrary law is greater than the pain of disappointed prejudice.
  3.  **Malleability:** It is cheaper to change minds than to break bodies.

  **Where the Tension Remains:**
  The tension your students feel is real because Bentham *does* occasionally slip into language that suggests prejudiced pains are "less real." But his best defense is that they are **less reliable guides to utility.**
  *   A pain caused by fire predicts physical damage.
  *   A pain caused by "paederasty" (in 1785) predicts nothing but the spectator's own upbringing.
  *   A legislator who legislates based on the latter is flying blind. Flying blind causes crashes (insecurity). Therefore, ignoring that pain is the hedonically optimal choice.

  **Teaching Suggestion:**
  You might frame this for your students as the distinction between **Preference Utilitarianism** (satisfy whatever people want) vs. **Ideal/Hedonic Utilitarianism** (maximize well-being, even if it contradicts current preferences).
  *   Bentham is often read as a Preference Utilitarian (give the people what they want).
  *   But in *Offences*, he acts like an Ideal Utilitarian (the people *think* they want this, but satisfying it hurts them in the long run).
  *   The "sleight of hand" is only visible if we assume Bentham believes all preferences have equal *legislative weight*, rather than equal *psychological reality*. He admits the pain is real (psychological), but denies it has weight (legislative).

  **Conclusion:**
  Bentham escapes the charge of circularity by appealing to the **consequences of setting a precedent.** He is not weighing the pain of disgust against the pain of punishment in a vacuum; he is weighing the pain of disgust against the pain of **living in a society where disgust is a valid ground for law.** On those terms, the strict hedonist has the resources to make the move. The "prejudice" label is a shorthand for "a preference whose satisfaction undermines the security necessary for utility maximization."
