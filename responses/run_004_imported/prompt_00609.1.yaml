      *   **The Core Question:** Is this a principled move within strict hedonistic utilitarianism, or is it sleight of hand importing non-hedonic standards? Can a strict hedonist discount pains based on their causal history ("prejudice")? Does he even *need* the "prejudice" premise given the "futility" argument?

  2.  **Initial Analysis & Fact-Checking:**

