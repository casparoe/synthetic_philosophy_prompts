      *   *The Hedonic Calculus:* Pain is pain. Pleasure is pleasure. Source shouldn't matter *in principle* ("push-pin is as good as poetry").
      *   *The Tension:* If the mob feels pain seeing gay sex, and pleasure seeing punishment, that's negative utility for the act and positive utility for punishment. To argue against punishment, Bentham needs to show the *net* utility is negative.
      *   *Bentham's Arguments in "Offences":*
          1.  No primary mischief (no direct victim).
          2.  Secondary mischief (alarm/danger) is negligible.
          3.  The pain of antipathy is real but derived from prejudice.
          4.  Punishment adds more pain (to the offender) than it relieves (in the spectators), especially since social stigma already exists.

  3.  **Reconstructing the Logic (Charitable Reading):**

      *   *Argument A: The "Prejudice" Filter.* Bentham distinguishes between pains grounded in *real harm* and pains grounded in *imagined harm* (prejudice).
          *   *Charitable Interpretation:* It's not that the pain isn't felt. It's that satisfying a preference based on false belief leads to worse long-term consequences (instability, error, encouraging irrationality). Or, perhaps, that the "pain of antipathy" is a *reflective* pain dependent on belief. If the belief is false (that the act is harmful), the utility calculation should be based on the *truth* of the consequences, not the *perception*.
          *   *Problem:* Hedonism says feelings count, not truth. If I feel pain because I *believe* a ghost is haunting me, the pain is real, even if ghosts aren't.
      *   *Argument B: The "Futility/Overkill" Argument.* Social stigma already punishes the offender. Adding legal punishment is redundant and adds *extra* pain (state violence, prison) without significantly reducing the spectators' pain (they already have the satisfaction of stigma).
