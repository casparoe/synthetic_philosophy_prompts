answer: |-
  **MEMORANDUM**

  **TO:** Behavioral Health Practice Committee
  **FROM:** Clinical Ethics
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Protocol: Dissociative Presentations and Clinical Language in Adolescents

  **Background**
  The Committee is currently divided regarding the surge in adolescent patients presenting with self-identified Dissociative Identity Disorder (DID) terminology ("systems," "alters," "fronting") often preceded by exposure to social media content. One faction prioritizes preventing iatrogenic "scripting" of symptoms (looping effects); the other prioritizes therapeutic alliance and the risk of missing rare, genuine pathology. Our previous ad-hoc approach during the functional tic-like behavior wave resulted in inconsistent care and clinical uncertainty. We require a unified policy that balances diagnostic integrity with therapeutic trust.

  **Ethical Analysis**
  We must treat diagnostic classification not merely as a description of reality, but as an intervention that can alter that reality. Ian Hacking's concept of "looping effects" is clinically relevant here: when a patient adopts a classification, they may unconsciously align their behavior with the expectations of that category. 

  If we prematurely endorse a DID framework for a patient experiencing functional dissociation or complex trauma, we risk cementing a fragmented self-concept that hinders integration and recovery (Non-Maleficence). However, if we dismiss a patient's vocabulary outright, we rupture the therapeutic alliance and risk abandoning patients with genuine dissociative disorders (Beneficence/Justice). 

  The ethical pivot point is distinguishing between **validating the patient's distress** and **confirming the ontological structure of their symptoms.** We can acknowledge the *experience* of "parts" without confirming the *diagnosis* of DID before a rigorous workup is complete.

  **Recommendation**
  I recommend the adoption of a **"Phenomenological First, Diagnostic Second"** policy. This protocol standardizes clinical language and workup sequencing to prevent iatrogenic scripting while preserving the pathway for genuine DID diagnosis.

  **1. Clinical Language Policy: Descriptive Mirroring**
  Clinicians should not ban patient terminology, but must not reify it into clinical fact during the initial assessment and stabilization phases.
  *   **Do not** use structural language that confirms the mechanism (e.g., "Let's talk to your alter," "Which part is fronting?").
  *   **Do** use phenomenological language that validates the experience without confirming the etiology (e.g., "You describe experiencing parts of yourself as distinct," "You notice shifts in your sense of self," "Tell me more about the experience of losing time").
  *   **Rationale:** This maintains the therapeutic alliance by listening to the patient's narrative without handing them a script that reinforces fragmentation. It keeps the diagnostic door open without walking through it prematurely.

  **2. Workup Sequencing: Exclusionary Before Inclusionary**
  A diagnosis of DID in an adolescent with significant social media exposure to DID content cannot be made at initial intake. It requires a staged differential diagnosis.
  *   **Phase 1 (Stabilization & Safety):** Focus on distress tolerance, sleep, and safety. Do not attempt to map the "system."
  *   **Phase 2 (Differential Rule-Out):** Clinicians must document the exclusion of the following before considering DID:
      *   Complex PTSD / Developmental Trauma Disorder (most common mimic).
      *   Mood disorders with psychotic features.
      *   Functional Neurological Symptom Disorder (conversion disorder).
      *   Substance-induced dissociation.
      *   Neurological conditions (seizure activity).
  *   **Phase 3 (Multidisciplinary Review):** A formal DID diagnosis in this demographic requires consensus from two senior clinicians (one attending psychiatrist) to ensure the "looping effect" risk has been mitigated.

  **Rationale for Decision**
  This policy takes the risk of "scripting" seriously. By refusing to structurally validate "alters" before ruling out functional or trauma-based explanations, we protect the patient from potentially adopting a chronic, fragmented identity that may not be clinically necessary. 

  However, this is not a denial of DID. If, after rigorous exclusion of other causes and a period of stabilization, the symptoms persist and meet DSM-5-TR criteria, the diagnosis remains available. This approach ensures that if we do diagnose DID, it is because the pathology survived the scrutiny of the workup, not because the treatment team inadvertently coached it into existence.

  **Implementation**
  *   Draft specific scripting guides for clinicians on "Descriptive Mirroring."
  *   Integrate the Phase 2 Differential Checklist into the EHR for dissociative presentations.
  *   Schedule a training session on Functional Neurological Symptom Disorder and social contagion in adolescent mental health.

  **Decision Required**
  I request the Committee vote to adopt this "Phenomenological First" protocol as interim policy for 12 months, with a review scheduled to assess diagnostic outcomes and patient retention rates.
