  **S Tier: corruptible metric**
  Goodhart's Law suggests that any metric used to settle bets will inevitably be optimized for itself rather than actual welfare, and there is no known principle for defining a robust, ungameable welfare function. If the settlement oracle is compromised or the metric is incomplete, the system mechanically optimizes for the wrong outcome.

  **A Tier: cheap manipulation**
  Actors who value policy outcomes over profit can sustain losses to distort market prices, breaking the epistemic signal unless subsidies are large enough to outspend their external utility. This creates an arms race that could become prohibitively expensive or require centralized sponsorship.

  **A Tier: existential risk**
  Financial markets inherently discount the future, and bets contingent on civilization's survival cannot pay out if that survival fails, structurally underpricing tail risks. Fixing this requires altering the fundamental payout structure of financial instruments, which is difficult without introducing external guarantees.

  **A Tier: plutocracy**
  Futarchy explicitly weights beliefs by capital, meaning wealthy interests mechanically dominate policy selection regardless of epistemic accuracy. While this is a design feature, it conflicts fundamentally with democratic equality norms, making widespread adoption politically precarious.

  **B Tier: legitimacy cost**
  Removing direct voter choice on policies may cause public backlash or instability, even if outcomes are objectively better. However, hybrid models or gradual implementation could mitigate this social friction without breaking the core mechanism.

  **B Tier: values/beliefs separability**
  While philosophically messy, practical implementations can approximate the separation by voting on broad welfare metrics rather than specific outcomes. This objection challenges the theoretical purity but not necessarily the operational feasibility of the system.

  **C Tier: perverse scoring**
  Traders might game the scoring rules on unchosen branches to influence profits on the chosen branch, but this is a specific mechanism design vulnerability. Adjusting the scoring rules or settlement conditions can mitigate these incentives without overhauling the system.

  **D Tier: thin markets**
  Liquidity issues on unchosen policy branches are a standard market microstructure problem solvable with automated market makers and subsidies. This is an engineering hurdle rather than a fundamental flaw in the governance logic.
