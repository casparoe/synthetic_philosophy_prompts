          *   *Tier:* S or A. Let's lean S because defining a robust welfare function is arguably unsolvable in principle without introducing centralization or manipulation vectors.

      *   **2. Plutocracy (wealth dominates beliefs):**
          *   *Analysis:* Futarchy explicitly uses capital-weighted voting for beliefs. Hanson argues this is a feature (skin in the game), but critics argue it biases outcomes toward rich preferences. However, this is a *feature* of the design, not a bug in the mechanism's function. It might be politically unacceptable, but the mechanism works as intended.
          *   *Severity:* High politically, but mechanism-wise it's intentional. However, if the rich have wrong beliefs or malicious interests, it fails.
          *   *Tier:* A. It's a fundamental design choice that conflicts with democratic equality norms. Hard to "patch" without changing the core premise.

      *   **3. Cheap manipulation (subsidized attacks):**
