          *   *Tier:* A or B. There are proposed fixes (subsidies, identity limits), but they add complexity. It's a major mechanism design challenge.

      *   **4. Thin conditional markets (liquidity issues):**
          *   *Analysis:* If policy B isn't chosen, the market for "If B then X" doesn't resolve, and traders might not trade on it initially due to risk of capital lockup or lack of resolution.
          *   *Severity:* Medium. This is a liquidity/market microstructure problem. LMSR (Logarithmic Market Scoring Rules) and subsidized market makers can help.
          *   *Tier:* C. Solvable with enough subsidy and proper market maker design.

      *   **5. Perverse scoring inside decision markets (gaming the scoring rule):**
          *   *Analysis:* Traders might manipulate prices on the unchosen branch to affect the chosen branch's price or profit from the scoring rule itself rather than information.
          *   *Severity:* Medium-High. This is related to manipulation but specific to the scoring mechanism.
          *   *Tier:* B. Mechanism design issue. Can be mitigated with proper scoring rules and settlement conditions.

