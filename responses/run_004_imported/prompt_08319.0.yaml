  I'm putting together a short story collection about scientists near the end of their careers, and I want one piece to dramatize the pessimistic meta-induction - the argument that since pretty much every past scientific theory eventually got shown to be false, ours probably will too, so we shouldn't beleive our current best theories are even approximately true. My protagonist is a physicist who lives just long enough to watch her big unifying theory get quietly dismantled by her own former student. But here's the twist I want baked in: apparently some realists try to wriggle out of this by pointing out that the actual math often survives even when the underlying picture doesn't, like how Fresnel's equations for light lived on inside Maxwell's theory even after everybody dropped the ether they were originally built to describe. Could you write that story for me (a page or two is plenty), built around the tension between her whole worldview turning out wrong and some weird skeleton of it turning out permanently right?
