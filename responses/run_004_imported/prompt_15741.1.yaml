answer: |-
  You and your friend have correctly identified the core problem: this is a classic instance of the **discursive dilemma** (also known as the **doctrinal paradox**). Your intuition that this connects to **judgment-aggregation theory** is spot on. This field, pioneered by scholars like Christian List and Philip Pettit, formalizes exactly the tension you are experiencing.

  Here is an explanation of the implications of the discursive dilemma and the associated impossibility results, followed by an assessment of whether either the premise-based or conclusion-based procedure can be defended as a principled default.

  ### 1. The Discursive Dilemma and the Impossibility Result

  The discursive dilemma arises when a group votes on logically interconnected propositions. In your case, the logic is:
  *   $P$: The project has artistic merit.
  *   $Q$: The project is financially feasible.
  *   $R$: The project should be funded.
  *   **Constraint:** $R$ is true if and only if ($P$ and $Q$) are true.

  As you observed, majority voting on $P$ and $Q$ individually can yield a collective "Yes," while majority voting on $R$ directly yields a collective "No." This creates a collective inconsistency: the committee effectively affirms the premises but denies the conclusion that logically follows from them.

  **The List-Pettit Theorem**
  The broader implication of this dilemma is captured in the **List-Pettit Theorem** (2002), an impossibility result analogous to Arrow's Impossibility Theorem in social choice. It proves that no aggregation procedure can simultaneously satisfy a set of minimal democratic conditions when propositions are logically connected:
  1.  **Universal Domain:** The procedure must accept any set of individual rational judgments.
  2.  **Anonymity:** All members' votes count equally.
  3.  **Systematicity (Independence):** The collective judgment on each proposition depends only on individual judgments on that specific proposition (i.e., you vote on $P$ based on views on $P$, not on $R$).
  4.  **Consistency:** The collective judgments must be logically consistent.

  The theorem proves that **you cannot have all four.** Any voting system for connected propositions must sacrifice at least one condition. This is the most critical implication for deliberative bodies: **There is no mathematically perfect voting mechanism.** You are not looking for a calculation that solves the problem; you are making a normative choice about which democratic value to prioritize.

  ### 2. Implications for Small Deliberative Bodies

  For committees, boards, and juries, the impossibility result implies three structural realities:

  **A. Consistency vs. Responsiveness Trade-off**
  *   **Premise-Based Procedure (PBP):** Prioritizes **Consistency** and **Reason-Tracking**. It ensures the decision follows the rules. However, it risks being **unresponsive** to the collective will on the final outcome (as happened in your committee).
  *   **Conclusion-Based Procedure (CBP):** Prioritizes **Responsiveness** to the collective will on the outcome. However, it risks **Inconsistency** and ignores the stated reasons or criteria, potentially making the decision appear arbitrary or unaccountable.

  **B. The Illusion of Objectivity**
  The dilemma reveals that "majority rule" is not a singular concept. A committee can claim to be democratic while producing opposite results simply by changing the order of the vote. This vulnerability allows for **agenda manipulation**. A chairperson who wants the project funded will call for votes on the criteria (PBP); a chairperson who wants to block it will call for a vote on the funding (CBP).

  **C. The Necessity of Deliberation**
  Formal voting theory assumes fixed preferences. In reality, small bodies can talk. The discursive dilemma is often most severe when members vote secretly or without discussion. If members explain *why* they voted "No" on funding despite voting "Yes" on merit (e.g., "I think it's meritorious and feasible, but it doesn't fit our mission this year"), the logical constraint ($P \land Q \to R$) might be revealed as incomplete. Deliberation can align judgments *before* the vote, dissolving the paradox.

  ### 3. Can Either Procedure Be a "Principled Default"?

  You asked if either procedure can be defended as a principled default. The short answer is **no, not universally.** However, one may be preferable depending on the **institutional purpose** of the body.

  #### The Case for the Premise-Based Procedure (Your Friend's View)
  Your friend argues this treats criteria seriously. This is defensible if the committee functions like a **court or an audit body**.
  *   **Principle:** **Accountability and Rule of Law.** If the foundation's bylaws state funding *requires* merit and feasibility, then PBP enforces the contract.
  *   **Best For:** Technical assessments, legal judgments, or compliance committees where the logic is rigid and the goal is truth-tracking or rule-following.
  *   **Risk:** It can lead to "tyranny of the premises," where a project is funded even if a majority of the committee intuitively feels it is a bad idea, potentially demoralizing members who feel their holistic judgment is ignored.

  #### The Case for the Conclusion-Based Procedure (Your View)
  You argue for respecting considered overall verdicts. This is defensible if the committee functions like a **legislature or a policy board**.
  *   **Principle:** **Democratic Will and Holistic Judgment.** Members are appointed for their expertise and judgment, not just as vote-counting machines. They may weigh factors not captured in the two criteria (e.g., political climate, portfolio balance, intuition).
  *   **Best For:** Policy-making, strategic direction, or artistic selection where "gut feeling" or uncodified expertise is valuable.
  *   **Risk:** It allows members to ignore the foundation's stated guidelines. It can lead to opacity ("I just don't like it") and makes it hard to appeal decisions or ensure fairness.

  ### 4. Recommendation for Your Arts Foundation

  Since you asked for a resolution to your specific disagreement: **Neither procedure is a principled default without reference to the foundation's mission.** However, for an **arts foundation**, the Conclusion-Based Procedure (CBP) is often stronger, *provided* it is modified.

  **Why CBP fits Arts Funding:**
  Artistic merit is not an objective fact like financial feasibility. It is a holistic judgment. A committee member might agree a project has "merit" in isolation but believe it is redundant given other grants awarded that year. If you use PBP, you force funding based on isolated criteria, potentially ruining the portfolio balance. CBP allows members to integrate unstated but relevant considerations into their final verdict.

  **The Principled Compromise:**
  To resolve your argument, you should adopt a **Deliberative Conclusion-Based Procedure**:
  1.  **Vote on the Conclusion (CBP):** The binding vote is on funding ($R$). This respects the members' holistic expertise.
  2.  **Require Reason-Giving:** To address your friend's concern about "taking criteria seriously," require that members justify their $R$ vote by referencing $P$ and $Q$.
  3.  **The "Safety Valve":** If the CBP vote contradicts the PBP implication (as it did this week), trigger a mandatory **re-deliberation**. The chair should say: *"Our criteria suggest funding, but our collective will suggests rejection. We need to discuss why our criteria failed to capture our concerns."*

  ### Summary
  The impossibility results in judgment-aggregation theory teach us that **inconsistency is inevitable unless we restrict how we vote.**
  *   Your friend prioritizes **integrity of the process** (PBP).
  *   You prioritize **integrity of the judgment** (CBP).

  Neither is mathematically superior. However, for an arts foundation, where judgment is inherently holistic and subjective, the **Conclusion-Based Procedure** is generally more robust, *if* coupled with a requirement for transparent reasoning. This acknowledges that the criteria are guides for judgment, not algorithmic inputs that replace judgment.

  **Verdict:** You are right that there is no *logical* reason to prefer PBP, but your friend is right that ignoring the criteria undermines the rules. The solution is not to choose one voting mechanic permanently, but to use the discrepancy as a trigger for deeper deliberation.
