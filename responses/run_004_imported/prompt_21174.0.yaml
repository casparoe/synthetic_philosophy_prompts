  7.  **Final Polish:** Check for flow, voice distinction, and ensuring the specific Lewisian points (fungibility, authority, willingness) are clearly articulated. (Self-Correction: Make sure to mention that Lewis thinks the objection holds for *retributive* punishment but maybe not for *penal* liability.)

  8.  **Final Review against constraints:**
