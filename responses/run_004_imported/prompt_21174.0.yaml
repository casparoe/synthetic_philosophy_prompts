  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** David Lewis's 1997 paper "Do We Believe in Penal Substitution?"
      *   **Context:** A column on odd corners of analytic philosophy.
      *   **Format:** A dialogue between two philosophers of religion after a workshop.
      *   **Characters:**
          *   *Pro-Lewis:* Thinks Lewis rescues the coherence of penal substitution.
