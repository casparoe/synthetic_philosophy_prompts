answer: |-
  **MEMORANDUM**

  **TO:** Building Committee & Board Members
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Reserve Fund Voting Method

  **Purpose**
  As we revise our bylaws, we must decide on a voting method for allocating the annual surplus maintenance reserve. Our current plurality system (one vote per unit, most votes wins) has repeatedly resulted in "vote-splitting," where similar proposals cannibalize each other, allowing a polarizing option to win with a minority of support. This memo recommends adopting **Ranked-Choice Voting (RCV)** and addresses recent concerns regarding voting theory.

  **The Theoretical Constraint: Gibbard-Satterthwaite**
  In researching alternatives, we encountered the Gibbard-Satterthwaite theorem. Simply put, this theorem proves that no ranked voting system is perfectly "strategy-proof." In any system with three or more options, there is a theoretical possibility that a voter could achieve a better outcome by voting dishonestly (e.g., ranking a less-preferred option higher to block a worst-case scenario).

  One proposal suggested replacing voting with a random lottery. Mathematically, a random draw is indeed immune to strategic voting. However, a lottery abdicates our fiduciary responsibility. Our goal is not merely to prevent gaming; it is to identify the project that offers the greatest value and consensus to the co-op. A random result could allocate significant funds to a low-priority item against the will of the majority. We should prioritize **representative outcomes** over theoretical immunity to manipulation.

  **Recommendation: Ranked-Choice Voting (Instant Runoff)**
  I recommend we adopt Ranked-Choice Voting for these specific allocations. Under RCV, residents rank options (1st, 2nd, 3rd). If no option gets a majority, the last-place option is eliminated, and those votes transfer to the voters' next choices.

  **Why RCV over Plurality?**
  1.  **Eliminates the Spoiler Effect:** This is our primary pain point. Under plurality, "green" options (e.g., Solar vs. Bike Storage) split the vote, allowing a less popular option (e.g., Gym Equipment) to win. RCV allows residents to support both green initiatives without fear of wasting their vote.
  2.  **Majority Support:** The winner must eventually secure over 50% of the active votes. This ensures the winning project has broad acceptance, reducing post-vote friction.
  3.  **Practical vs. Theoretical Gaming:** While G-S proves manipulation is *possible* in RCV, it is significantly *harder* to execute than in plurality. To game RCV, a voter needs detailed knowledge of how everyone else is voting. In a transparent community of 40 units, "buried" strategic voting is socially costly and difficult to coordinate.

  **Conclusion**
  No voting system is mathematically perfect. However, Ranked-Choice Voting offers the best practical balance: it solves the specific vote-splitting issues we face annually while ensuring the winner reflects the majority will. It is a robust, defensible improvement over plurality without resorting to a random draw.

  I move that the committee recommend Ranked-Choice Voting for the surplus reserve allocation in the upcoming bylaw rewrite.
