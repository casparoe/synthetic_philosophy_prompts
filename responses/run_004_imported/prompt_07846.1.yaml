answer: |-
  The simulation room hummed, a low-frequency vibration that settled in the teeth. There were no windows, only the white noise of the *Aethelgard's* fusion drive and the table. Six chairs. Six figures. None of them knew who they were.

  That was the point of the Charter Veil. You knew you were human. You knew you were rational. You knew the ship had enough hydroponic yield to sustain a population of five thousand for three hundred years, provided the destination—Kepler-186f—was habitable upon arrival. But you did not know if you were the engineer scrubbing filters in Year 10, the child born in the cryo-bay in Year 150, or the captain signing the death warrant in Year 290.

  "You're proposing a savings rate of forty percent," said Kael. His voice was rough, scraped raw. Behind the Veil, vocal modifiers flattened identity, but stress leaked through. "That leaves Generation One on half-rations. That leaves us eating algae paste while the silos fill up for people who don't exist."

  "And if we set it at ten percent?" Elara's voice was cooler, steadier. "Generation One eats well. But if the fusion containment degrades in Year 200, or if the planet is toxic and we need to turn back, Generation Seven starves. They inherit a hollowed-out ship."

  "This is a debate about the Difference Principle," Kael said, slamming a hand on the table. The sound was dull, absorbed by the acoustic dampeners. "Rawls is clear. Inequalities are only justified if they benefit the least advantaged. Look around this room. Behind this Veil, the 'least advantaged' position I can imagine is being a Gen 1 worker. We have the hardest labor. We have the highest radiation exposure. We have the least comfort. If I maximize the minimum, I maximize *our* rations. I take from the future to save the present."

  "You're treating generations like classes," Elara countered. "But the Veil hides time, too. You aren't just ignorant of your class; you're ignorant of your era. If you don't know *when* you are, you have to assume you could be the person in Year 200 staring at empty fuel tanks. If Gen 1 consumes the surplus, they are actively harming the worst-off group in the chain. That group might be us, or it might be them."

  Kael leaned forward. The white light of the table illuminated the outline of his hands. "Here's the break in the logic, Elara. Reciprocity. In a normal society, the rich give up some wealth because they rely on the poor for labor, for stability, for order. There's a cooperative scheme. But Gen 200 can't do anything for Gen 1. We can't trade with them. We can't threaten them. If I sacrifice my nutrition today for a person a hundred years from now, that's not justice. That's charity. And Rawls built this on justice, not charity."

  "It's not charity if you might *be* them," Elara said. "That's the whole point of the Veil. It forces you to care about the stranger because the stranger might be you."

  "But the stranger doesn't exist yet!" Kael's voice rose. "When I stand behind the Veil of Ignorance regarding my income, I know the poor person is standing right there. I can see the risk. I can say, 'I'll take a pay cut to ensure he doesn't starve, because I might be him.' But with time? It's a gamble. Rawls argues against Utilitarianism because he says you can't gamble with basic rights. He says we use the Maximin rule: don't look at the average outcome, look at the worst-case scenario and make it bearable. But to apply Maximin across time, you have to assign probabilities. How likely is it that Gen 200 is worse off than Gen 1? We don't know. The Veil blinds us to that probability. So how do you calculate the savings rate without turning this into the very expected-utility calculus Rawls rejected?"

  The room went silent, save for the hum of the drive. This was the knot. The coach had called it the 'Just Savings' problem, but out here, in the dark, it felt like a trap.

  "If we don't save," Elara said softly, "the worst-case scenario is extinction. If Gen 1 consumes everything, and the ship fails in Year 200, the minimum position isn't 'poverty.' It's zero. It's death. Maximin demands we prevent the absolute floor from collapsing."

  "But if we save too much," Kael shot back, "the worst-case scenario is that Gen 1 collapses. We revolt. We sabotage the systems. We die in Year 10 because we were so busy saving for Year 200 that we didn't have the energy to work. You're asking us to accept a guaranteed hardship now for a probabilistic benefit later. That's exactly the kind of risk-taking Rawls said rational agents wouldn't make behind the Veil. He said we'd be risk-averse. Well, I'm risk-averse about my own hunger."

  "Is it hunger?" Elara asked. "Or is it envy? You know that if you are Gen 10, you will live in a paradise built on our starvation. Is it fair that they get the destination and we get the journey?"

  "It's not about fairness between generations," Kael said. "It's about the definition of the 'social minimum.' Is the society the crew of the *Aethelgard* at this specific moment? Or is it the timeline?"

  "The timeline," Elara insisted. "A society is a cooperative scheme across generations. We maintain the ship they inherit; they maintain the mission we started. If we break the chain, the scheme fails."

  "But the chain is invisible!" Kael stood up. The chair scraped against the floor, a shriek of metal. "I can't verify their need. I can't verify their existence. All I know is that behind this Veil, there is a high probability I am in the first cohort. The population curve is a pyramid. There are more of us at the start than at the end. If I'm a rational actor maximizing my own life prospects behind the Veil, I bet on being early. I consume."

  "And if you're wrong?" Elara didn't stand. She looked at the blank wall. "If you're wrong, you condemn your grandchildren to suffocate. You're using the Maximin rule to protect your stomach, but you're ignoring the Maximin rule for your lineage. You're saying the 'worst-off' group is defined by the present moment. But the Veil removes the present moment. You have no idea what year it is. For all you know, the debate we're having right now is happening in Year 150, looking back at Year 1. If Year 1 spent the capital, you are already dead. You're arguing for a policy that would have already killed you."

  Kael froze. The logic looped back on itself, a snake eating its tail.

  "So what's the alternative?" Kael asked, his voice lower now. "We set a rate. But where? If we say 'save until the future is as wealthy as the present,' we never spend. We starve in orbit. If we say 'spend until the future is as poor as the present,' we doom them. Rawls said the savings principle stops once a just society is established. But we aren't established. We're in a tin can."

  "Maybe the principle isn't about resources," Elara said. "Maybe it's about capacity. We save enough so they have the *capacity* to be just. Not so they are rich. Just so they aren't forced to be barbarians."

  "And who defines barbarism?" Kael sat back down. He looked tired. The Veil didn't hide fatigue. "If I define it as 'not having enough food to work,' I save nothing. If you define it as 'not having enough tech to terraform,' I save everything. We're just smuggling our own intuitions back in through the back door. The Veil isn't working. It's supposed to neutralize our bias, but my bias for my own survival is biological. It's deeper than reason."

  "Then the Veil fails," Elara said. "And if the Veil fails, we aren't debating justice anymore. We're debating power. And Gen 1 has the guns."

  "Gen 1 has the guns," Kael agreed. "But Gen 1 also has the manuals. And the codes. And if we lock them out, Gen 200 has nothing but a drifting coffin."

  They sat in the silence of the simulation. The hum of the drive seemed louder now, a countdown ticking away seconds they couldn't afford to spend arguing. The cursor on the central terminal blinked, waiting for an input on the Resource Allocation Protocol. It waited for a number between zero and one hundred.

  Kael looked at the blinking cursor. He thought about the algae paste, the ache in his muscles, the cold of the outer hull. He thought about the idea of a child in Year 200 who might never see a sky, not because the planet was toxic, but because he had eaten their fuel.

  Elara looked at the same cursor. She thought about the injustice of asking the first to suffer for the last, of making the foundation bear a weight the roof would never know.

  "We can't know the probability," Kael whispered. "Rawls said without probabilities, Maximin is the only rational choice. But Maximin requires a defined set of outcomes. We don't have the set."

  "Then we guess," Elara said.

  "That's not philosophy," Kael said. "That's gambling."

  "Maybe," Elara said, reaching her hand toward the interface. "Maybe the Veil doesn't tell us the answer. Maybe it just tells us how heavy the dice are."

  Her finger hovered over the keypad. The room waited. The drive hummed. The Veil remained opaque, offering no glimpse of who would pay the price for the number she was about to type.
