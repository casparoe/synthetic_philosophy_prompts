  *   **Violation of "ONE Strategy" Constraint:** The prompt asks for ONE strategy. You devote Paragraph 2 to Lewis's pragmatic solution and Paragraph 3 to McGrath's normative solution. This dilutes your analysis. While breadth is good, exam constraints are there to test depth on a single argument.
