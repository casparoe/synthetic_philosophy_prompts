  **Final Verdict:**
  Strong grasp of the core problem and the normative cost of solving it. However, the handling of Lewis is philosophically imprecise, and the failure to stick to the "ONE strategy" constraint weakens the focus of the second half. Good work, but tighten the technical distinctions on Lewis and adhere strictly to prompt constraints in the future.

