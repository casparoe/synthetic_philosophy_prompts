answer: |-
  Ian Hacking and a retired experimental physicist are sharing a drink after a conference on cosmology. The physicist gestures to his beer.

  "You see this pint?" the physicist asks. "The odds of the cosmic constants allowing for barley, hops, and my liver to process it are one in $10^{50}$."

  Hacking sighs. "And you're about to tell me this implies a Multiverse. That there are countless other bars where the beer is poison."

  "Exactly," says the physicist. "With enough bars, it's no surprise one serves drinkable stout."

  "Inverse Gambler's Fallacy," Hacking says flatly. "Walking into *this* bar and seeing *this* beer doesn't prove other bars exist. The probability of this specific pour is unchanged."

  "But consider Leslie's firing squad," the physicist counters. "If fifty marksmen miss me, I shouldn't be surprised I'm alive. The observer-selection effect dictates I can't observe the outcome where I'm dead."

  "Agreed," says Hacking. "You shouldn't be surprised you're alive. But you *are* committing a fallacy if you infer, from your survival, that there are *other* firing squads shooting at other people elsewhere. Your survival is guaranteed by your presence, not by a multiverse of squads."

  "Ah," says the physicist, "but the selection effect isn't just about my surprise. It's about the evidence. I'm not inferring many squads from 'I survived.' I'm inferring many squads from 'A survivor is reporting.'"

  Hacking raises an eyebrow. "Go on."

  "If there were only one squad," the physicist continues, "the probability of a survivor reporting is tiny. If there are a million squads, the probability of *a* survivor reporting is near one. Since I am a survivor reporting, the million-squad hypothesis is favored."

  Hacking swirls his drink. "You're shifting the evidence from 'This specific survivor' to 'Some survivor or other.' You're trading the indexical 'I' for an existential quantifier."

  "I'm trading a miracle for a census," the physicist says.

  Hacking smiles grimly. "Fine. But tell me this: If the selection effect validates the inference to a million squads... why are *you* the one holding the beer, and not one of the other survivors?"

  The physicist pauses. "Because I'm the one who made it to the bar."

  "Precisely," says Hacking. "Which means, even with a million squads, *you* still got lucky. The selection effect explains why you're asking the question. It doesn't explain why the answer is 'yes.'"

  The physicist finishes his beer. "So, you're saying the Multiverse might be true, but my existence isn't the ticket?"

  "No," says Hacking. "I'm saying your existence is the turnstile. It lets you in, but it doesn't tell you how big the stadium is."

  "Fair enough," the physicist says, signaling for another round. "But if there's only one stadium, why is the ticket price so fine-tuned?"

  Hacking groans. "That's the Watchmaker argument. I'm calling the fallacy on that one too."

  "Too late," says the physicist. "Selection effect. I only ordered the second beer because I could."
