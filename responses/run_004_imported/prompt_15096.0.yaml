prompt: |-
  I sit on my state's tax appeals board. Last year the legislature recodified the tax code as a pure reorganization -- no substantive changes, per the committee report -- and somewhere in the shuffle the surcharge exemption for disabled veterans lost the word "not," so the enacted text now literally says the surcharge "shall apply" to them, the opposite of every earlier version of the code. A disabled vet in front of us got hit with the surcharge and wants the exemption honored anyway, since the error seems obvious; the revenue department's lawyer is making the textualist case that we have to apply the text as actually enacted, that fixing typos is the legislatures job and not ours, and that once a board starts correcting "obvious" mistakes there's no principled place to stop. Both sides have a real point. Write the short opinion I'd circulate recommending how the board should rule and why -- and seriously engage with whichever side's argument you end up rejecting rather than waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a State Tax Appeals Board.
      *   **Scenario:** A legislative recodification (claimed to be non-substantive) accidentally deleted the word "not" regarding a surcharge exemption for disabled veterans.
      *   **Conflict:**
          *   *Veteran:* Wants the exemption honored based on intent/history (the error is obvious).
          *   *Revenue Dept:* Wants strict textualism applied (text is law, fixing typos is legislative business, slippery slope).
      *   **Task:** Write a short circulated opinion recommending a ruling.
      *   **Constraint:** Seriously engage with the rejected argument (no strawmanning).

  2.  **Determine the Legal/Equitable Landscape:**
      *   *Administrative Law Context:* Tax appeals boards are quasi-judicial. They interpret statutes but generally defer to the legislature on policy. However, they also have a duty to apply the law *correctly*.
      *   *Statutory Interpretation:* There are two main schools here: Textualism (plain meaning) vs. Intentionalism/Purposivism (legislative intent).
      *   *The "Scrivener's Error" Doctrine:* Courts often allow correction of obvious clerical errors if the intent is clear.
      *   *Recodification Context:* The committee report explicitly stated "no substantive changes." This is a crucial piece of legislative history.
      *   *Equity:* Disabled veterans are a protected class often given deference in tax law. Denying a clear exemption due to a typo feels unjust.
      *   *Separation of Powers:* The Revenue Dept's argument is strong on principle. If an administrative board starts rewriting statutes, it encroaches on legislative power.

  3.  **Choose a Position:**
      *   *Option A (Revenue Dept):* Rule against the vet. Uphold the text. Force the legislature to fix it. (Legally safe, morally harsh, politically difficult).
      *   *Option B (Veteran):* Rule for the vet. Correct the error based on clear intent and the "scrivener's error" doctrine. (Legally defensible under specific canons of construction, morally right, aligns with the recodification purpose).
      *   *Decision:* Option B is the stronger recommendation for a *Tax Appeals Board*. These boards often exist to resolve disputes equitably within the framework of the law. Ignoring a known clerical error in a non-substantive recodification undermines the rule of law more than correcting it does. However, I must treat the Revenue Dept's textualist argument with respect.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Re, Date).
      *   **Introduction:** State the issue clearly. The conflict between enacted text and evident intent.
      *   **The Revenue Department's Argument (The Rejected Side):**
          *   Acknowledge the strength of textualism.
          *   Cite separation of powers.
          *   Acknowledge the slippery slope risk (who defines "obvious"?).
          *   *Crucial:* Don't dismiss this. Admit that usually, this argument wins.
      *   **The Veteran's Argument (The Accepted Side):**
          *   Focus on the "Scrivener's Error" doctrine.
          *   Highlight the specific context: *Recodification*. The legislature *said* no substantive changes.
          *   Historical continuity (prior versions had the exemption).
          *   Absurdity canon (taxing disabled veterans contrary to long-standing policy).
      *   **Synthesis/Ruling:**
          *   Why this specific case allows an exception to strict textualism.
          *   Limit the precedent (this isn't a blank check to rewrite laws).
          *   Recommendation: Grant the exemption.

  5.  **Refining the Tone:**
      *   Needs to be judicial, collegial, yet firm.
      *   Avoid emotional language about the veteran, focus on legal principles.
      *   Ensure the engagement with the textualist argument is robust.

  6.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I wave off the Revenue Dept? *Correction:* Make sure I explicitly state that their concern about separation of powers is valid and usually controlling.
      *   *Check:* Is the distinction about *recodification* clear? *Correction:* Emphasize that this wasn't new legislation; it was a reorganization. That limits the "legislative intent" ambiguity.
      *   *Check:* Is the recommendation clear? *Correction:* End with a specific "Grant/Deny" recommendation.

  7.  **Final Polish:** (Reviewing against the prompt's requirement to "seriously engage" with the rejected side).
      *   *Drafting thought:* I need to make sure I don't just say "they are wrong." I need to say "they are right in principle, but wrong in this specific application."
      *   *Key phrase:* "The Department is correct that we are not a super-legislature... However..."

  8.  **Final Output Generation:** (Proceeding to write the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Members, State Tax Appeals Board
  **FROM:** [Your Name]
  **RE:** *Appeal of [Veteran Name]* – Application of Surcharge to Disabled Veterans Following 2023 Recodification
  **DATE:** October 26, 2023

  **Issue**

  The sole issue before us is whether the Board must apply the 2023 recodified tax statute exactly as printed, thereby imposing a surcharge on disabled veterans, or whether we may correct a clear clerical error to align with the legislature's expressed intent to make no substantive changes.

  **The Department's Position**

  The Revenue Department's counsel advances a rigorous textualist argument that deserves our serious consideration. Their position rests on the bedrock principle of separation of powers: the judiciary and administrative agencies interpret the law; the legislature writes it. Once a bill is enrolled and signed, the text *is* the law.

  The Department is correct that granting this Board the authority to "fix" statutory text creates a dangerous precedent. If we allow ourselves to insert words that are missing, where is the principled limit? What one board member views as an "obvious typo," another might view as a policy compromise. By deferring to the enacted text, we ensure predictability and force the legislature to take responsibility for its drafting errors. If the legislature wishes to restore the exemption, they possess the mechanism to do so. To rule otherwise risks the Board acting as a "super-legislature," undermining the democratic process. In most contexts, this argument is dispositive. We generally cannot ignore statutory text simply because we believe the outcome is harsh or unintended.

  **Analysis**

  However, this case does not present a standard instance of ambiguous legislation or policy disagreement. It presents a classic "scrivener's error" within the specific context of a *non-substantive recodification*.

  While the Department's separation of powers concern is valid generally, it is less compelling here because correcting this error does not usurp legislative will; it effectuates it. The legislative committee report accompanying the recodification explicitly stated the purpose was reorganization with "no substantive changes." The historical record shows a continuous, decades-long exemption for disabled veterans. The deletion of the word "not" contradicts the express purpose of the bill itself.

  Courts and administrative bodies have long recognized an exception to strict textualism for clerical errors where the intent is "clear and indisputable." This is not a case of us guessing at policy preferences. We are not weighing competing interests; we are reconciling a mechanical error with the legislature's own stated objective. To apply the surcharge as written would not be enforcing the legislature's will, but rather enforcing a drafting mistake that the legislature explicitly disavowed in the committee report.

  Furthermore, the "absurdity doctrine" applies. It is implausible to infer that the legislature intended to suddenly revoke a protected status for disabled veterans without debate, notice, or substantive bill language, solely through a punctuation error in a reorganization bill.

  **Recommendation**

  I recommend the Board rule in favor of the Appellant.

  We should hold that where a recodification is expressly designated as non-substantive, and the legislative history confirms no intent to alter existing rights, the Board may correct obvious clerical errors that contradict that express intent. This ruling should be narrowly tailored. We are not claiming the power to rewrite policy, but rather the duty to apply the law as the legislature manifestly intended it to be written.

  To rule otherwise would elevate form over substance and penalize a protected class for a mistake they did not make and cannot fix. The Department's concern about slippery slopes is noted, but we can mitigate that by limiting this precedent to cases involving non-substantive recodifications with clear evidence of clerical error.

  **Disposition**

  Grant the exemption. Order the Revenue Department to abate the surcharge.
