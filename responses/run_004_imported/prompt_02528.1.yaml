      *   **The Problem:** The treat bag shake became the *real* cue, not the word "Come."
      *   **Concept:** *Overshadowing.* The sound of the bag is more distinct, exciting, and immediately predictive of food than the verbal command. The dog learned "Sound of crinkling bag = Food," not "Word 'Come' = Food."
      *   **Secondary Problem:** The "Chip Bag" generalization. Luna now associates *any* crinkling bag with food. The mom's chip bag sounds like the treat bag.
      *   **Why she ignores the verbal command:** To Luna, the verbal command without the bag shake is like someone saying "Green light" when the traffic light is actually off. She doesn't understand what it means in isolation.

