answer: |-
  My dear friends, family, and honored guests.

  We are gathered to wish my daughter happiness. It is a word we use often, but understand rarely. Many will tell you that happiness is the reward for duty. I propose to you that it is the reverse: happiness is the fuel that makes duty bearable.

  To my daughter: You enter a union where you will be asked to be many things. But first, you must remain yourself. Do not fear your passions. A life without fire is not a life of virtue; it is a life of slumber. Let your heart have its interests, and let your mind have its hunger. A wife who can amuse herself is never a burden to her husband; a mind that feeds itself never starves the household.

  And regarding the world you will build together: do not be too ruthless with the truth. Truth is often a bare wall; illusion is the tapestry we hang upon it to make the room habitable. When you look at your husband, and he at you, do not stare until the flaws appear. Allow the light of affection to soften the edges. To believe the best of one another is not blindness; it is a charity. It is the necessary art of preserving the bond against the erosion of time.

  Cultivate your tastes. Study, read, observe. For when the world grows dull, and it will, your own curiosity must be the garden where you find refuge. If you possess the capacity to be amused by ideas, by nature, by the great mystery of existence, you will never be truly lonely, even in silence.

  So, I raise this glass. Not to a perfect life, for perfection is a cold companion. But to a life rich in illusions kind enough to comfort us, passions strong enough to drive us, and a mind sturdy enough to hold them both. To the bride.
