  **Move 3 (Nadia):** Nadia clarifies the category error in Owen's objection. She distinguishes between the *substance* of the claim (which Owen defends) and the *standing* to enforce it (which she defends). This is the pivotal philosophical move of the debate.
  *   **Advantage:** Nadia. She successfully isolates the concept of "standing" from logical validity, preventing Owen from dismissing her via fallacy labeling.

