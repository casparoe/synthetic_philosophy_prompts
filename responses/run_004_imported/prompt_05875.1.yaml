  2.  **Deconstruct the Philosophical Issues:**
      *   **Bayesian Confirmation Theory (BCT):** $P(H|E) > P(H)$ iff $P(E|H)P(H)/P(E) > P(H)$. If $P(E) = 1$, then $P(H|E) = P(H)$. No confirmation.
      *   **The Problem of Old Evidence (POE):** Formulated by Clark Glymour (1980). How can known evidence confirm a new theory?
      *   **Move 1 (Philosopher):** Strict Bayesianism says old evidence ($P(E)=1$) confirms nothing.
          *   *Assessment:* Technically correct within standard static Bayesianism.
      *   **Move 2 (Astrophysicist):** If theory says famous confirmation isn't confirmation, theory is wrong.
          *   *Assessment:* Strong pragmatic objection. "Reductio ad absurdum" of the theory's applicability.
      *   **Move 3 (Philosopher):** Update on the *entailment relation* ($H \vdash E$), not $E$.
