          *   *Astrophysicist's Counter:* That makes confirmation dependent on historical accidents/psychology (who knew what when), not the world. Also, ideal Bayesians know all logical consequences.
          *   *Philosopher's Concession:* Ideal Bayesianism is unrealistic. Alternative: Counterfactual credences (what if we didn't know E?).
