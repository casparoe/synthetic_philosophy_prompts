answer: |-
  **Title:** The Unstable Foundation: Why Ratifiability Cannot Save Causal Decision Theory from Death in Damascus

  Causal Decision Theory (CDT) emerged in the late twentieth century as a rigorous attempt to formalize rational choice based on an agent's capacity to causally influence the world. By distinguishing between causal consequences and mere correlations, CDT sought to avoid the pitfalls of Evidential Decision Theory (EDT), particularly in Newcomb's Problem. However, the "Death in Damascus" case, originally formulated by Gibbard and Harper (1978) and later revitalized by Andy Egan (2007), presents a formidable challenge. In this scenario, a perfect predictor ensures that whatever city an agent flees to, Death will be waiting there. Standard CDT generates a deliberative loop: choosing Aleppo makes Aleppo fatal, pushing the agent toward Damascus, which in turn makes Damascus fatal.

  To resolve this, Gibbard and Harper proposed a "ratifiability" constraint: an agent should only perform an action if, conditional on performing it, it remains the optimal choice. While this constraint stabilizes deliberation in some contexts, it fails to rescue CDT from the deeper structural flaws exposed by Death in Damascus. This essay argues that supplementing CDT with ratifiability does not adequately handle the case. Instead, as Egan contends, the instability reveals a fundamental blindness in CDT regarding the evidential significance of one's own actions in predictive contexts. Ratifiability acts as an ad hoc patch that forces CDT to acknowledge the very evidential links it claims to ignore, ultimately demonstrating that CDT is ill-equipped to handle Newcomblike problems without collapsing into a hybrid view that abandons its core causal tenets.

  To understand the failure of the ratifiability fix, one must first grasp the nature of the instability. In Gibbard and Harper's version of Death in Damascus, the agent must choose between Aleppo and Damascus. Death has already predicted the choice and is waiting in the chosen city. The causal structure is clear: the agent's choice does not *cause* Death's location; Death's prediction (based on the agent's psychology) caused Death's location. Standard CDT calculates the expected utility of an act by summing the utilities of outcomes weighted by their *causal* probabilities. Since the agent's choice cannot causally influence where Death is, CDT treats the probability of Death being in Aleppo as independent of the choice to go to Aleppo. However, because Death is a perfect predictor, the *evidential* probability is 1.

  This creates a pragmatic paradox. If the agent deliberates and leans toward Aleppo, they must acknowledge that Death is likely in Aleppo, making Damascus the causally superior option (since survival is better than death). But as soon as they lean toward Damascus, the prediction shifts, and Aleppo becomes superior. The agent is trapped in a loop where no decision is stable. Gibbard and Harper argue this is not a failure of the theory but a feature of the dilemma: the situation is genuinely pathological, and the theory correctly identifies that no action is "ratifiable." An act is ratifiable if, conditional on the agent deciding to do it, no other act has higher expected utility. In Death in Damascus, neither city is ratifiable. Gibbard and Harper conclude that the agent is rationally permitted to choose arbitrarily or via a mixed strategy, as reason runs out.

  This defense, however, is unsatisfying. A decision theory is meant to guide action. If a theory concludes that in a life-or-death situation reason provides no preference between two options where one leads to survival (relative to the prediction) and the other to death, it has failed its primary function. More damningly, the ratifiability constraint appears to be a desperate maneuver to prevent CDT from giving obviously bad advice in structurally similar cases. This is where Andy Egan's critique becomes decisive. Egan argues that the instability in Death in Damascus is not a benign acknowledgment of a dilemma but a symptom of a deeper flaw: CDT ignores relevant evidence about the world that is carried by the agent's own decision.

  Egan illustrates this with the "Psychopath Button" case. Suppose you are offered a button that, if pressed, kills 1,000 people if and only if you are a psychopath. You are not a psychopath. Psychopaths, however, are compelled to press the button; non-psychopaths are not. You want to minimize deaths. Standard CDT advises you to press the button. Why? Because your pressing the button does not *cause* you to be a psychopath. The state of being a psychopath is fixed prior to your choice. Therefore, causally, pressing the button has no negative consequences for you (since you aren't a psychopath, no one dies).

  Intuitively, this is the wrong advice. If you press the button, it is overwhelming evidence that you are a psychopath, and thus 1,000 people will die. Here, ratifiability saves CDT from this counterintuitive result. If you conditionalize on pressing the button (i.e., ask "Is pressing ratifiable?"), you must acknowledge that if you were to press, you would likely be a psychopath, and thus pressing would cause deaths. Therefore, pressing is not ratifiable. Ratifiable CDT correctly says "Don't Press."

  However, this "success" comes at a devastating cost to CDT's theoretical integrity. In the Psychopath Button case, ratifiability works only by forcing the agent to treat their action as *evidence* of a state (psychopathy) that determines the outcome. But this is precisely the reasoning CDT was designed to reject in favor of causal independence. If we accept ratifiability to solve Psychopath Button, we are admitting that the evidential relevance of an action matters in decision-making. But if evidential relevance matters in Psychopath Button, why should it not matter in Death in Damascus? And if it matters in Death in Damascus, why not in Newcomb's Problem?

  By adding ratifiability, CDT proponents attempt to have it both ways: they want to maintain that causal influence is the only thing that matters for utility calculation, while simultaneously using a constraint that relies on evidential conditionalization to filter out bad actions. This is inconsistent. In Death in Damascus, ratifiability leads to paralysis (no action is ratifiable). In Psychopath Button, it leads to the correct result but via reasoning that mimics EDT. This suggests that ratifiability is not a repair of CDT, but a concession that pure CDT is insufficient. It acknowledges that in cases where an agent's choice is correlated with the state of the world (via a predictor or a common cause like psychology), ignoring that correlation leads to disaster.

  Furthermore, the ratifiability constraint fails to provide positive guidance in Death in Damascus. Gibbard and Harper are content to say that since neither option is ratifiable, the agent may choose arbitrarily. But this ignores the asymmetry of the situation from the agent's perspective. The agent knows that *whatever* they choose, they will die. But they also know that if they could choose differently than predicted, they would live. CDT + Ratifiability essentially tells the agent: "You are in a trap where your decision process is transparent to a predictor. Therefore, your decision process cannot recommend a specific action." This reduces decision theory to a description of constraints rather than a guide for choice. If a theory cannot tell an agent which of two options to pick in a binary survival scenario, it has ceased to be a *decision* theory.

  Egan's verdict is that Death in Damascus shows CDT is "self-undermining." A theory that recommends an action which, once recommended, provides the agent with a reason to reject it, is practically incoherent. Ratifiability attempts to stop the loop by declaring both options off-limits, but this is merely sweeping the instability under the rug. It does not explain *why* the agent should ignore the causal calculation that initially favored the action. In Psychopath Button, the causal calculation says "Press." Ratifiability says "Don't." The agent is left asking: "Do I follow the causal utility or the ratifiability constraint?" If the constraint overrides the utility calculation, then causal utility is not the sovereign principle of rationality, and CDT is false.

  Ultimately, the controversy over Death in Damascus hinges on what we demand of a decision theory. If we view it as a static evaluation of acts, Gibbard and Harper's ratifiability condition might seem like a reasonable filter for coherence. But if we view decision theory as a dynamic guide for deliberation, the instability is fatal. The fact that CDT requires an evidential patch (ratifiability) to avoid recommending self-destructive behavior in Psychopath Button, and yields paralysis in Death in Damascus, demonstrates that the theory's foundational separation of "states" and "acts" is too rigid for a world containing predictors and logical correlations.

  Therefore, supplementing CDT with a ratifiability constraint does not adequately handle Death in Damascus; it merely highlights the theory's inability to process the evidential weight of its own recommendations. The case reveals a deeper flaw: CDT is fundamentally blind to the informational content of decisions in Newcomblike environments. Ratifiability forces CDT to peek at that information, but only inconsistently. Consequently, Death in Damascus should be viewed not as a solvable puzzle for CDT, but as a reductio ad absurdum of its core insistence on ignoring non-causal correlations. The prospects for Causal Decision Theory, in its pure form, are dim; it cannot be patched without admitting that rational choice requires attending to evidence, not just causes.
