answer: |-
  This is a profound and practical question that cuts to the heart of normative epistemology. You have correctly grasped the tension: if we accept the Common Prior Assumption (CPA) as a normative requirement for truth-seeking agents (as Robin Hanson argues), then persistent disagreement after full evidence sharing implies a failure of rationality somewhere. However, you are running into the limitation that Aumann's Agreement Theorem is an *impossibility result* (it tells you disagreement shouldn't exist), not a *debugging tool* (it doesn't tell you how to fix it).

  There is no algorithmic "Prior-O-Meter" that can objectively scan two priors and declare one irrational. However, within the rationalist framework you are operating in, there are principled heuristics for diagnosing the divergence and deciding how to update.

  Here is a breakdown of how to locate the culprit and resolve the disagreement, moving from theoretical constraints to practical heuristics.

  ### 1. The Theoretical Limit: You Cannot Prove a Prior "Wrong"
  First, a gentle correction on the theoretical landscape. While Hanson argues for CPA as a normative ideal, standard Bayesianism (Subjective Bayesianism) holds that priors are not subject to rationality constraints in the same way likelihoods are. As long as your prior is coherent (sums to 1), it is technically "rational."

  However, accepting the Hansonian view (that rational agents *should* have common priors), you still face the **Underdetermination Problem**. Logic alone does not dictate a unique prior distribution over empirical facts (Hume's problem of induction). Therefore, you cannot prove your friend's prior is "wrong" via deduction. You can only show it is *less reliable* based on meta-epistemic criteria.

  ### 2. Diagnostic Steps: Is it Really the Prior?
  Before blaming the prior, you must verify that the conditions for Aumann's theorem are actually met. In practice, they almost never are.

  **A. Common Knowledge vs. Shared Evidence**
  Aumann's theorem requires **common knowledge** of posteriors, not just the sharing of evidence.
  *   *Shared Evidence:* "I saw data X." "I saw data Y."
  *   *Common Knowledge:* "I know that you know that I know that we have both fully updated on X and Y."
  *   *The Trap:* Often, agents share evidence but disagree on the **likelihood function**. If you interpret the *significance* of a piece of evidence differently, you haven't truly "shared" it in the Bayesian sense. You might think a data point is strong evidence; your friend might think it is noise. This looks like a prior disagreement, but it is actually a disagreement about the causal model linking evidence to hypothesis.
  *   *Action:* Check if you agree on the **Bayes Factor** for each piece of evidence shared. If you agree on the likelihood ratios but still differ, *then* it is a prior issue.

  **B. Hypothesis Space Mismatch**
  Are you conditioning on the exact same hypothesis?
  *   In hobby forecasting, definitions matter. Does "Team A wins" include overtime? Does "Project finishes" mean "code merged" or "deployed"?
  *   Often, priors look different because the latent variables being modeled are subtly different. Ensure you are betting on the exact same resolution conditions.

  **C. Indexical and Self-Locating Information**
  Do you have private information about your own cognitive state that you cannot fully convey?
  *   If you have a "gut feeling" based on pattern recognition you can't articulate, that is evidence. If you cannot transmit the *quality* of that intuition to your friend, you cannot achieve common knowledge.
  *   Hanson suggests treating the *fact of your disagreement* as evidence. If you trust your friend's rationality, their confidence is evidence against your own conclusion.

  ### 3. Heuristics for Identifying the "Bad" Prior
  If you have verified likelihoods and hypothesis spaces, and you still differ, you must evaluate the priors meta-epistemically. Since you cannot check the prior against the truth (yet), you check the prior against **reliability indicators**.

  **A. Calibration and Track Records**
  This is the most objective metric available.
  *   Who has been more calibrated on similar questions in the past?
  *   If your friend has a history of overconfidence in this hobby domain, their prior is likely skewed by optimism bias.
  *   *Principle:* Defer to the agent with the better Brier score on reference-class-similar predictions.

  **B. The "Outside View" (Reference Class Forecasting)**
  Priors often fail because they are built from the "Inside View" (specific details of the case) rather than the "Outside View" (base rates).
  *   Compare your priors to the base rate of the relevant reference class.
  *   *Example:* If you are predicting if a specific feature will be added to a game, what % of proposed features get added generally?
  *   If one of your priors is significantly further from the base rate without a strong specific justification, that prior is likely the outlier.

  **C. Complexity and Simplicity**
  While not definitive, priors that require more complex justifications to maintain are often suspect (Occam's Razor).
  *   If your friend's prior relies on a conjunction of three unlikely assumptions, and yours relies on one, yours is prima facie more robust.

  ### 4. Resolution Strategies: What To Do
  If you cannot locate the specific error, the rationalist community (including Hanson and Yudkowsky) suggests specific protocols for this exact scenario.

  **A. The Modesty Argument (Deferral)**
  If you believe your friend is roughly as rational and honest as you are, you should not trust your own judgment over the aggregate.
  *   **The Protocol:** If you cannot convince them, and they cannot convince you, you should move your credence toward theirs.
  *   **Why?** Because the fact that a rational peer disagrees with you is *evidence* that your prior (or likelihood) is flawed. To ignore their disagreement is to assume you are right and they are wrong without evidence for *that* claim.
  *   **Hanson's View:** If you think you are right and they are rational, you should update toward them. If you think they are irrational, you must explain *why* (bias, incentive, cognitive flaw) without referencing the conclusion itself.

  **B. Linear Opinion Pooling (Averaging)**
  In the absence of a clear reason to defer entirely to one party, the mathematically robust solution is to average the probabilities.
  *   If you say 70% and they say 30%, the rational joint credence is often 50%.
  *   Research suggests that averaging probabilities often outperforms attempting to argue out the "true" probability when time is limited and biases are opaque.

  **C. Bet on It (Skin in the Game)**
  Hanson frequently suggests that if you truly believe your prior is superior, you should be willing to bet.
  *   Propose a wager at odds implied by your probabilities.
  *   If your friend refuses, it signals they are not as confident in their prior as they claim (or they are risk-averse).
  *   If you hesitate, it signals you suspect your prior might be wrong.
  *   *Note:* Only do this if the stakes are low enough not to damage the friendship, or use "points" / reputation currency.

  ### 5. Summary Recommendation
  You are looking for a principled method to decide who is wrong. The hard truth is: **There is no method that guarantees identifying the wrong prior without new evidence.**

  However, the **principled rationalist response** to unresolvable disagreement under CPA is:
  1.  **Verify Likelihoods:** Ensure you aren't just weighing evidence differently.
  2.  **Check Base Rates:** See whose prior deviates more from the reference class without justification.
  3.  **Apply Modesty:** If steps 1 and 2 are inconclusive, **average your credences.**

  To maintain the common prior assumption normatively, you must treat your friend's differing credence as *evidence* that your prior is imperfect. To refuse to update toward them is to violate the spirit of Aumann by claiming you have access to a "rationality truth" that they do not, which is itself an unjustified prior belief.

  In short: If you can't find the bug, assume the code is equally likely to be broken in both places, and compile the average.
