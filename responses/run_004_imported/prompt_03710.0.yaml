answer: |-
  The challenge posed by Peter Diamond's 1967 critique to John Harsanyi's 1955 Aggregation Theorem is indeed the most formidable objection to the mathematical derivation of utilitarianism. Diamond's "coin flip" example appears to demonstrate that a social welfare function (SWF) defined as a linear sum of individual expected utilities cannot accommodate a robust intuition of fairness—specifically, the preference for equal *ex post* opportunities over equal *ex ante* expectations when outcomes are indivisible.

  However, the standard moral drawn from this example—that Harsanyi's framework is defective because it excludes a freestanding value of fairness—is mistaken. It rests on a category error regarding the domain of utility and a misunderstanding of the welfarist commitments underlying Harsanyi's theorem. I argue that Diamond's example reveals no defect in the theorem itself. Rather, the intuitive appeal of the coin flip is best understood as a demand that **risk aversion and inequality aversion be properly specified within individual utility functions**, or else acknowledged as non-welfarist values that utilitarianism is theoretically correct to ignore.

  ### 1. The Welfarist Constraint and the Definition of Outcomes

  Harsanyi's Aggregation Theorem operates within a welfarist framework: social welfare is a function solely of individual utilities. The theorem proves that if individuals and the social planner satisfy the von Neumann-Morgenstern (VNM) axioms of rationality under risk, and the planner respects the Pareto principle, the SWF must be a weighted sum of individual utilities: $W = \sum a_i U_i$.

  Diamond's objection assumes that the "outcomes" in this equation are merely material allocations (e.g., Person A has the kidney, Person B does not). Under this description, the coin flip and the deterministic allocation yield identical material distributions *ex post* (one has it, one doesn't) and identical expected utilities *ex ante* (assuming symmetry). Thus, Harsanyi's planner is indifferent.

  Diamond's critique fails because it imposes an impoverished description of the outcome space. In VNM theory, utilities are defined over **comprehensive outcomes**. A comprehensive outcome includes not only the material allocation but also the history, process, and psychological context of that allocation.
  *   **Outcome $O_1$:** A receives the good via arbitrary fiat; B receives nothing via arbitrary fiat.
  *   **Outcome $O_2$:** A receives the good via fair lottery; B receives nothing via fair lottery.

  If individuals derive welfare from knowing they were treated fairly (dignity) or suffer disutility from arbitrary exclusion (resentment), then $U_B(O_2) > U_B(O_1)$. If A derives disutility from unearned privilege, $U_A(O_2) > U_A(O_1)$. If these psychological components exist, they are legitimate inputs into $U_i$. Harsanyi's linear aggregation will then correctly rank the coin flip higher than the deterministic allocation.

  Diamond's objection holds only if we assume individuals are purely materialistic and indifferent to the process. If they are indifferent, then the "fairness" of the coin flip provides no welfare gain to anyone. In that case, a utilitarian planner is *correct* to be indifferent (or to prefer the deterministic option to save transaction costs). To insist on the coin flip when no individual's welfare is enhanced is to prioritize a deontological constraint over welfare, which is a rejection of utilitarianism, not a refutation of its internal logic.

  ### 2. Risk Aversion and the Value of "Chances"

  The prompt suggests addressing whether the appeal of the coin flip is a demand for risk aversion built into individual utilities. This is a crucial distinction. Standard VNM utility functions are linear in probabilities ($U(L) = \sum p_i u(x_i)$). Diamond's intuition suggests that a 50% chance is worth *more* than half the value of the certain good, implying a convexity in the utility of probabilities that violates the Independence Axiom.

  However, we can reconcile this with Harsanyi without violating VNM axioms by recognizing that **uncertainty itself has utility consequences**.
  For many individuals, a "chance" is not merely a mathematical expectation but a psychological good (hope) or a reduction in the variance of life prospects.
  *   **Deterministic Scenario:** Person B faces a 100% probability of exclusion. This is a state of absolute deprivation.
  *   **Coin Flip Scenario:** Person B faces a 50% probability of exclusion. This is a state of risk, but not absolute deprivation.

  If individuals are **risk-averse regarding their relative standing**, the utility loss of moving from a 50% chance to a 0% chance is greater than the utility loss of moving from a 100% chance to a 50% chance. This is not a violation of VNM linearity in probabilities; it is a reflection of the **concavity of the utility function over the *status* of "having a chance."**

  If we model the utility function as $U_i = v(\text{Material Good}) + k(\text{Probability of Receipt})$, where $k$ is concave, then the social sum captures the value of the coin flip. The "fairness" intuition is simply the aggregate expression of individual risk aversion regarding exclusion. Harsanyi's theorem accommodates this perfectly, provided the utility functions are specified to include the value of probabilistic inclusion. Diamond's error is assuming that $U_i$ must be defined solely over final states of possession, ignoring the welfare value of the *prospect* itself.

  ### 3. Inequality Aversion as Interdependent Utilities

  A more rigorous defense involves modeling **inequality aversion** within the individual utility functions. Modern behavioral economics (e.g., Fehr & Schmidt) suggests that individual utility often depends on the distribution of payoffs, not just one's own.
  Let $U_i = u(x_i) - \alpha \cdot \max(x_j - x_i, 0) - \beta \cdot \max(x_i - x_j, 0)$.

  In Diamond's example:
  *   **Deterministic:** One person has 1, the other 0. Inequality is maximal.
  *   **Coin Flip (Ex Ante):** Both have an expected value of 0.5. Inequality is zero.

  While Harsanyi's theorem aggregates expected utilities, if individuals care about *ex ante* equality (fairness of opportunity), their utility functions will reflect a penalty for *ex ante* inequality. Person A might feel guilt (reducing $U_A$) and Person B might feel resentment (reducing $U_B$) in the deterministic scenario. In the coin flip scenario, *ex ante* equality eliminates this disutility.

  Consequently, the sum $\sum U_i$ will be higher for the coin flip. Diamond claims Harsanyi ignores *ex post* fairness. But if the *ex post* inequality is identical in both cases (one has it, one doesn't), the only moral difference lies in the *ex ante* distribution of chances. If individuals value *ex ante* equality, Harsanyi captures it. If they do not, and the planner imposes it anyway, the planner is violating the Pareto principle to satisfy a non-welfarist ideal. Harsanyi's theorem is a theorem about **welfare aggregation**, not moral perfectionism. It cannot be "defective" for failing to capture values it was never designed to capture.

  ### 4. The Pareto Defense and Paternalism

  The strongest argument against Diamond is based on the Pareto principle, which is a premise of Harsanyi's theorem.
  *   **Case 1:** Individuals care about fairness. Then $U_i(\text{Coin}) > U_i(\text{Deterministic})$. Harsanyi's planner chooses the Coin. Diamond's objection vanishes.
  *   **Case 2:** Individuals do not care about fairness (pure materialists). Then $U_i(\text{Coin}) = U_i(\text{Deterministic})$. Harsanyi's planner is indifferent.

  Diamond argues the planner should *prefer* the coin in Case 2. This requires the planner to override individual preferences in favor of a "social value" that no individual possesses. This is paternalistic. It posits a "social good" that is disconnected from the good of the constituents.

  Utilitarianism is fundamentally committed to the idea that the social good is constituted by the good of individuals. If the coin flip does not make A or B better off (in terms of their own preferences/welfare), there is no utilitarian basis for preferring it. Diamond's intuition relies on a **freestanding deontological value** (fairness as a right, not as a welfare component). While such a value may be morally compelling in a rights-based framework, it is not a "defect" in utilitarianism that it fails to maximize rights-independent values. Harsanyi's theorem rigorously demonstrates what follows from welfarism + rationality. Diamond demonstrates only that welfarism conflicts with certain deontological intuitions.

  ### Conclusion

  Diamond's 1967 rejoinder does not expose a mathematical or logical defect in Harsanyi's Aggregation Theorem. Instead, it highlights a tension between welfarist aggregation and non-welfarist moral intuitions.

  The appeal of the coin flip can be fully accommodated within Harsanyi's framework if we recognize that:
  1.  **Outcomes are comprehensive:** The "fairness" of the process contributes to individual welfare (dignity, lack of resentment).
  2.  **Risk/Inequality Aversion is individual:** The preference for the coin is an aggregate of individual preferences for risk reduction regarding exclusion and *ex ante* equality.

  If these preferences exist, Harsanyi's linear sum selects the coin flip. If they do not exist, Utilitarianism correctly identifies that the coin flip generates no additional welfare. To demand otherwise is to ask Utilitarianism to cease being Utilitarianism. Therefore, Diamond's example should not be read as a refutation of the mathematical case for utilitarianism, but as a clarification of the informational requirements of individual utility: a robust utilitarian calculus must account for the welfare value of fairness, but it need not—and should not—track fairness as a value independent of human welfare.
