answer: |-
  **The Proof-Theoretic Challenge to Deflationism: A Verdict on Conservativeness**

  The debate over the nature of truth has long oscillated between inflationary accounts, which treat truth as a substantive property explaining correspondence or coherence, and deflationary accounts, which treat truth as a lightweight logical device. In recent decades, however, the battlefield has shifted from metaphysics to proof theory. The central contention is no longer merely whether truth corresponds to reality, but whether a deflationary theory of truth can satisfy certain formal constraints. The most formidable of these constraints is conservativeness. As your seminar has uncovered, the argument advanced by Stewart Shapiro and Jeffrey Ketland suggests that natural theories of truth violate this constraint, thereby undermining deflationism.

  This essay argues that while the Shapiro-Ketland argument successfully demonstrates the non-conservativeness of natural truth theories, it fails to refute deflationism. The argument relies on a conception of conservativeness that misconstrues the normative role of truth predicates. By examining the rationale for conservativeness, evaluating the available deflationist responses, and weighing the inflationist interpretation, I conclude that the non-conservativeness of truth theories does not entail that truth is a substantive property. Rather, it reveals that accepting a base theory implicitly commits one to its soundness, a commitment the truth predicate merely makes explicit.

  **The Allure of Conservativeness**

  To understand the force of the Shapiro-Ketland argument, one must first appreciate why conservativeness appeared to be a non-negotiable commitment for deflationism. Deflationists, following figures like Quine and Horwich, maintain that the predicate "is true" does not pick out a robust property in the world. It does not carve nature at the joints. Instead, it serves a logical function: it allows for disquotation (asserting "Snow is white" is equivalent to asserting "'Snow is white' is true") and, crucially, generalization (asserting "Everything the Pope says is true" without enumerating every papal statement).

  If truth is merely a logical device, akin to a quantifier or a definitional abbreviation, then adding it to a background theory $T$ (such as Peano Arithmetic, or $PA$) should not expand the theory's substantive reach. If I add a definition for "bachelor" to a theory of sociology, I should not be able to prove new theorems about marriage rates that were not provable before. Similarly, if "true" is thin, extending $T$ with axioms governing truth should yield a conservative extension. That is, for any sentence $\phi$ in the original vocabulary of $T$, if $T + Truth \vdash \phi$, then $T \vdash \phi$. If the addition of "true" allows us to prove new arithmetic facts that $T$ could not prove alone, it suggests that "true" is doing heavy lifting—tracking a substantive property that interacts with the subject matter of $T$ to generate new knowledge. Thus, conservativeness became the litmus test for the metaphysical thinness of truth.

  **The Shapiro-Ketland Challenge**

  The trouble, as your students noted, is that natural truth theories fail this test. Consider $PA$. We can extend it with a truth predicate $Tr$ governed by Tarskian compositional axioms (e.g., $Tr(\ulcorner A \land B \urcorner) \leftrightarrow Tr(\ulcorner A \urcorner) \land Tr(\ulcorner B \urcorner)$). If we restrict the induction schema of $PA$ to formulas in the original language, the resulting theory is conservative. However, this restriction is mathematically and philosophically unnatural. A theory of truth should allow us to reason about truth within inductive proofs. When we allow the induction schema to range over formulas containing the truth predicate, we obtain a theory often denoted as $PA(S)$.

  Shapiro and Ketland demonstrated that $PA(S)$ proves the Global Reflection Principle for $PA$: $\forall x (Prov_{PA}(x) \rightarrow Tr(x))$. In effect, the theory proves that all theorems of $PA$ are true. From this, one can derive the consistency of $PA$ ($Con(PA)$). By Gödel's Second Incompleteness Theorem, $PA$ cannot prove $Con(PA)$. Therefore, $PA(S)$ proves a sentence in the language of arithmetic that $PA$ cannot prove. The extension is non-conservative.

  The inflationist conclusion is seductive: If adding the truth predicate allows us to settle arithmetic questions that were previously undecidable, truth must be a substantive property. It provides epistemic leverage that logic alone cannot supply. For the inflationist, this is a *reductio* of deflationism; the deflationist promised a logical device but delivered a substantive engine.

  **Deflationist Responses**

  Faced with this result, the deflationist has three primary lines of response.

  The first is to **retreat to a weaker theory**. A deflationist could insist on restricting induction to the base language, thereby preserving conservativeness. This move saves the philosophical thesis at a high mathematical cost. It renders the truth theory expressively weak; one cannot formally generalize over theorems within inductive proofs. Most philosophers, including many deflationists, find this unacceptable. It cripples the very generalizing function that deflationism claims is the primary utility of truth. To save the metaphysics by sacrificing the logic of truth is to win the battle but lose the war.

  The second response is to **bite the bullet**. One might argue that non-conservativeness is compatible with truth remaining metaphysically thin. Hartry Field, for instance, has suggested that the non-conservativeness arises not from the property of truth itself, but from the interaction between truth and the rules of inference (like induction). The deflationist could claim that while the *theory* is non-conservative, the *concept* remains deflationary. However, this is difficult to sustain. If the addition of a concept allows for the derivation of new physical or arithmetic facts, it is hard to maintain that the concept is merely a logical device. It suggests the concept captures structural features of the domain that the base theory missed.

  The third, and most promising, response is to **deny that conservativeness was ever a necessary commitment**. This approach challenges the assumption that the base theory $T$ is accepted in isolation. When a mathematician accepts $PA$, they do not merely accept the axioms as uninterpreted strings; they accept them as *correct* or *sound*. This acceptance carries an implicit commitment to the consistency of $PA$ and the truth of its theorems. The truth predicate does not generate new knowledge ex nihilo; rather, it provides the vocabulary to make explicit the commitments already inherent in accepting the base theory.

  **The Verdict**

  Weighing these options, the conservativeness argument against deflationism is mathematically sound but philosophically overstated. It does not refute deflationism.

  The inflationist argument rests on the premise that if $T + Truth$ proves $\phi$ and $T$ does not, then "truth" must be a substantive property responsible for this epistemic gain. This assumes a static view of theory acceptance, where $T$ is a fixed set of axioms and "truth" is an external add-on. However, rational acceptance of a theory is normative. To accept $PA$ is to take a stance that $PA$'s axioms are true. If one accepts the axioms as true, one is logically committed to their consistency, even if one cannot prove it within the system.

  The deflationist should adopt the third response: deny the commitment to conservativeness as a criterion for metaphysical thinness. The non-conservativeness of $PA(S)$ does not show that truth is a substantive property like mass or charge. Instead, it shows that the truth predicate is the tool we use to climb the semantic ladder of our own commitments. When we prove $Con(PA)$ using a truth predicate, we are not discovering a new fact about numbers that was hidden from $PA$; we are articulating a consequence of our stance toward $PA$. The "new" theorem was epistemically accessible only via the semantic ascent, but it was not ontologically grounded in a robust property of truth.

  Furthermore, the demand for conservativeness conflates *proof-theoretic strength* with *metaphysical substance*. A logical device can be proof-theoretically powerful without being metaphysically heavy. The universal quantifier allows us to prove things we couldn't prove using only singular terms, yet no one argues that quantification is a substantive property of the world. Similarly, the truth predicate allows for generalizations over sentences that yield reflection principles. The leverage comes from the ability to generalize, not from the predicate tracking a deep natural kind.

  Therefore, the Shapiro-Ketland argument fails to refute deflationism because it misidentifies the source of the non-conservativeness. The extra proving power comes from the explicit formalization of soundness commitments that were already present in the acceptance of the base theory. Deflationism survives, but it must be refined: it cannot claim that truth is *inferentially* inert, but it can maintain that truth is *metaphysically* thin. The student who dismissed the result as a curiosity was too dismissive of the technical rigor, but the student who saw it as decisive overlooked the normative dimension of theory acceptance. The truth predicate is indeed a logical device, but it is a device that allows us to fully cash out the commitments of our logic. That it does so non-conservatively is a feature of our epistemic situation, not a bug in the deflationary ontology.
