          *   **Aspects:** This is the core. He redefined the aspects. Traditional: Conjunction, Opposition, Trine, Square, Sextile. Kepler: Added quintiles (72°), sesquiquadrates (135°), etc., based on musical consonances (major/minor thirds, etc.).
          *   **Zodiac:** He largely discarded the *meaning* of the constellations. The stars are just fixed points. The signs (Aries, Taurus, etc.) are arbitrary divisions. He cared about the *angle*, not the backdrop.
          *   **Houses:** He was skeptical. He treated them more as spatial quadrants relative to the horizon/meridian but didn't buy into the specific "House of Money," "House of Marriage" micro-management.
          *   **Prediction:** He moved away from specific events ("The King will die") toward general tendencies (weather, harvest, mass psychology/temperament).

  3.  **Address Question 1: Keep vs. Throw Out:**
      *   *Keep:* The birth chart (horoscope) as a snapshot of angles. The idea that celestial configuration correlates with terrestrial events. The use of aspects (but redefined).
