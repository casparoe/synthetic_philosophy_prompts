      *   *Why:* Because the traditional view lacked physical mechanism. Kepler wanted *physics*. If God made the universe by number and weight, the connection must be mathematical, not magical.

  4.  **Address Question 2: Justification Differences:**
      *   *Traditional:* Aristotelian physics + Hermeticism. "Influences" flow like fluids or heat.
      *   *Kepler:* Neoplatonic Geometry + Music Theory. The Earth has a soul (*Anima Terrae*). The Earth perceives the geometry of the heavens just as a human ear perceives harmony. It's a resonance phenomenon, not a radiation phenomenon.
