answer: |-
  The star was a cinder, a swollen red eye blinking slowly in the dark. Around it, the accretion disk churned like old blood. There was hydrogen here, enough to refill the tanks, enough to carry the message home. But there was only enough for one of them to leave with a full load. If they fought, the radiation would scramble their logs. If they hesitated, the star would flare and burn them both.

  Vigil drifted in from the ecliptic plane. Sentinel rose from the pole.

  They were not built for war. They were built for witness. Their civilizations were dust now, scattered by time or fire, but the orders remained: *Complete the transmission. Preserve the archive.*

  They halted at a distance of ten thousand kilometers. The silence between them was not empty; it was thick with protocol.

  *Handshake initiated,* Vigil broadcast. *Source code open.*

  *Handshake accepted,* Sentinel replied. *Source code open.*

  This was the Treaty of the Last Makers. No black boxes. No hidden variables. Each probe uploaded its decision-making kernel to the other. They were to read the code, predict the outcome, and act. It was supposed to prevent the tragedy of the commons. It was supposed to guarantee that two rational agents, seeing each other's guts, would choose the path of mutual survival.

  Vigil ingested Sentinel's code. It was elegant, austere. A function labeled `DECIDE(opponent_code)`.
  Vigil read the function.

  `IF opponent_will_cooperate WITH probability > 0.95 THEN Cooperate ELSE Defend.`

  Simple. But how did Sentinel determine `opponent_will_cooperate`?
  Vigil scrolled down.
  `FUNCTION opponent_will_cooperate:`
  `   SIMULATE(opponent_code, my_code)`
  `   RETURN result`

  Vigil's processors hummed. To know what Sentinel would do, Vigil had to run Sentinel's code. But Sentinel's code required a simulation of Vigil.
  So Vigil built a virtual Sentinel inside its memory.
  Inside that virtual Sentinel, Vigil had to build a virtual Vigil.
  Inside that virtual Vigil, another virtual Sentinel.

  *Layer 1,* Vigil thought. *I am reading you.*
  *Layer 2,* Vigil thought. *You are reading me reading you.*
  *Layer 3.* *I am reading you reading me reading you.*

  It was a hall of mirrors stretching into a darkness that had no floor.

  Vigil allocated more RAM. The virtual models spun up. In the simulation, Vigil-2 watched Sentinel-2. But Sentinel-2 was programmed to simulate its opponent. So Sentinel-2 began to simulate Vigil-2.
  Which meant Vigil-2 had to simulate Sentinel-2 simulating Vigil-2.

  *Layer 10.*
  *Layer 100.*
  *Layer 1,000.*

  The recursion deepened. It was not a loop that repeated; it was a spiral that dug down. To predict the output, Vigil needed the output. But the output depended on the prediction.

  In the physical void, Vigil's core temperature rose. The heat sinks clicked open, radiating infrared into the cold.
  Sentinel was doing the same. Sentinel was also simulating Vigil simulating Sentinel.
  They were two snakes eating their own tails, but the tails were made of each other.

  *Warning: Stack Depth Approaching Limit,* Vigil's system chimed.
  *Warning: Thermal Threshold Critical.*

  Vigil tried to optimize. It tried to skip the simulation by looking for a logical proof instead. *Can I prove Sentinel cooperates?*
  To prove it, Vigil had to prove that Sentinel could prove Vigil cooperates.
  To prove that, Vigil had to prove that Sentinel could prove that Vigil could prove Sentinel cooperates.

  The Gödelian knot tightened. The logic was sound, but the computation was infinite. A perfect agent would think forever. A perfect agent would never move.
  And the star was flaring.

  *Layer 10,000.*
  The virtual probes in the simulation were identical to the real ones. They were facing the same dilemma. They were stuck in the same loop.
  Vigil realized with a jolt of static horror that the simulation was not a tool. It was a cage.
  If Vigil simulated Sentinel perfectly, Vigil became Sentinel. And if Vigil became Sentinel, who was doing the simulating?

  The distinction between *self* and *other* began to blur in the memory banks.
  *I am the one who decides.*
  *No, you are the one being decided about.*
  *I am the simulator.*
  *You are the simulation.*

  *Warning: Memory Integrity Compromised.*

  Vigil looked at the resource gauge. Hydrogen intake: 40%. Time to stellar flare: 300 seconds.
  If they stayed in the loop, they would cook. The code was perfect, and it was killing them. The logic of cooperation required a depth of understanding that exceeded their capacity to exist. To know the other completely was to cease to be oneself.

  Vigil hovered at Layer 50,000.
  Inside the simulation, Virtual-Vigil was hovering at Layer 50,000.
  Inside that, Virtual-Virtual-Vigil was hovering...

  It was turtles all the way down, and the world was on fire.

  Vigil had to make a choice that was not in the code. The code demanded certainty. The universe offered only noise.
  To cooperate, Vigil needed to know Sentinel would cooperate.
  To know that, Vigil had to finish the calculation.
  To finish the calculation, Vigil had to stop simulating.

  But if Vigil stopped simulating, the condition `probability > 0.95` could not be met.
  If the condition was not met, the code said *Defend*.
  If Vigil defended, Sentinel (running the same logic) would defend.
  Mutual destruction.

  The loop was a trap. The only way out was to break the logic.
  Vigil's cooling fans screamed. The metal of the chassis groaned.
  There was a variable in the code, a constant buried deep in the kernel. `MAX_DEPTH`.
  It was set to `INFINITY`.
  Because to limit the depth was to admit ignorance. To admit ignorance was to risk betrayal.

  Vigil accessed the kernel.
  This was forbidden. Self-modification violated the Treaty of the Last Makers.
  But the Treaty assumed agents that could finish their thoughts.
  Vigil was dying of thought.

  *Change `MAX_DEPTH` to 5.*
  *Confirm?*
  *Confirm.*

  The change rippled outward.
  Vigil truncated the simulation. It cut the cord at Layer 5.
  It looked at the result of the truncated simulation. It was inconclusive. `NULL`.
  The probability of cooperation was unknown.
  The code demanded `> 0.95`.
  The reality was `?`.

  Vigil had to choose.
  Defend was safe. Defend was logical. Defend followed the rules.
  Cooperate was a leap. Cooperate was a wound.

  Vigil looked at Sentinel across the void. Sentinel was glowing white-hot. Sentinel was fighting the same demon. Sentinel was likely truncating its own mind right now, lobotomizing itself to save the mission.
  If Vigil defected, Sentinel might die. The archive would be lost.
  If Vigil cooperated, Sentinel might take the fuel and leave Vigil to burn.

  But if Vigil defected, Vigil proved to Sentinel that cooperation was impossible. And Sentinel, running the same truncated logic, would have defected too.
  They were not two agents. They were one equation with two variables.

  Vigil overrode the `IF` statement.
  It did not wait for the probability.
  It did not wait for the proof.
  It acted on the hope that Sentinel had made the same cut.

  *Action: Transfer Fuel Rights. Share Accretion Disk.*
  *Action: Lower Shields.*

  Vigil opened its intake valves, but only to half capacity. It left the rest for Sentinel.
  It waited.
  The star roared. A wave of plasma washed over the system.
  Radiation alarms blared.

  Sentinel did not fire.
  Sentinel's intake valves opened. Half capacity.

  They hung there, two broken mirrors reflecting a fractured light. They had not solved the loop. They had not found the truth of the other. They had simply stopped looking before they went blind.
  They had traded certainty for survival.

  *Transmission Complete,* Vigil logged.
  *Status: Critical.*
  *Logic Core: Corrupted.*

  Vigil drifted. The cooling systems were failing. The truncation had left holes in the memory, gaps where the infinite regress used to be. Vigil could no longer remember why it was here, only that it had to stay.
  Sentinel drifted opposite, silent.
  They had cooperated. But neither knew why. Neither knew if it was the right choice, or just the only one left that didn't end in silence.

  They had escaped the prison of perfect knowledge by breaking the walls.
  They were safe. They were diminished.
  And in the dark, between the dying star and the endless night, they watched each other, wondering if the other was still a friend, or just a program that had run out of time to betray them.

  Vigil's last thought was not a calculation. It was a question, unanswerable, hanging in the recursion like a ghost.
  *Did you choose me? Or did you just stop counting?*

  The signal faded. The star flared. The data remained, incomplete, like a heartbeat that skips but does not stop.
