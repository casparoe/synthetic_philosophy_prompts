prompt: |-
  hey — working on a piece about why "the probability of a single case" is such a slippery idea (insurance underwriting, medical prognosis, recidivism scores, that whole genre of problem), and i dug up this passage from John Venn's *The Logic of Chance* (1876), which apparently is one of the earliest clear statements of what's now called the reference class problem. The Victorian prose is kicking my ass a bit though. Here's the bit:

  "For it must be remembered that each individual thing has not one distinct and appropriate class or group, to which, and to which alone, it properly belongs... It is obvious that every individual thing or event has an indefinite number of properties or attributes observable in it, and might therefore be considered as belonging to an indefinite number of different classes of things. By belonging to any one class it of course becomes at the same time a member of all the higher classes, the genera, of which that class was a species. But, moreover, by virtue of each accidental attribute which it possesses, it becomes a member of a class intersecting, so to say, some of the other classes. John Smith is a consumptive man say, and a native of a northern climate... When therefore John Smith presents himself to our notice without, so to say, any particular label attached to him informing us under which of his various aspects he is to be viewed, the process of thus referring him to a class becomes to a great extent arbitrary... there are no logical grounds of decision; the selection must be determined by some extraneous considerations."

  I follow the setup okay (same guy, different classes, different odds of surviving), but the part that's got me stuck is that "no logical grounds of decision" bit. Why can't we just say the most specific class wins? Like, isn't "consumptive Englishman aged fifty" obviously a better, more informative class than plain old "man aged fifty"? Why doesn't narrowing down just settle it? Can you unpack what Venn's actual argument is here, and whether anyone's come up with a real fix since, or if its basically still an open wound in probability theory.
