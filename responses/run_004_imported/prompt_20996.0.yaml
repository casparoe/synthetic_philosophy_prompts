          *   *Round 3 (The Legal Analogy):* Renee wins on social intuition; Marcus wins on philosophical consistency.
          *   *Round 4 (The Drunk Driver):* Marcus is technically right philosophically, but Renee is right practically.
      *   **Synthesis/Resolution:**
          *   Distinguish between *Blameworthiness* (internal moral state) and *Liability/Accountability* (external consequence).
          *   Apply to the workplace: They deserve equal *reprimand* for the behavior, but unequal *remediation* for the damage.
