      *   **Move 5: Marcus's Rebuttal (Pragmatics vs. Morality).**
          *   Claim: Legal asymmetry is for deterrence/evidence, not moral truth. Philosophers bite the bullet on drunk driving.
          *   *Assessment:* Philosophically sophisticated. Nagel/Williams on Moral Luck. He's right that *some* philosophers agree with him, but he's fighting common intuition.

  4.  **Evaluate "Who's Right":**

      *   **Marcus (The Purist):** He is right about *antecedent blame* (blameworthiness based on choice/risk). From a Kantian or Control Principle view, they are equally blameworthy.
      *   **Renee (The Pragmatist):** She is right about *consequential accountability* (responsibility based on impact). From a Utilitarian or Professional Liability view, the outcome dictates the response.
      *   **The Workplace Context:** This is crucial. It's not a pure ethics seminar; it's a job. In a job, outcomes *must* matter for resource allocation and risk management, even if moral culpability is identical.

