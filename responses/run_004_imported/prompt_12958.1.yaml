      *   **Step 4:** The Collapse (Show $r$ is a measure of group variance).
      *   **Step 5:** Conclusion on why the debate persists (Utility, not Truth).

  10. (Self-Correction during drafting): Make sure to mention that while *mathematically* equivalent, *empirically* one might be easier to measure. That's a practical difference. Also, mention that "Replicator" status is the philosophical sticking point. Dawkins says groups can't be replicators (usually). Sober/Wilson say they can (if they bud/fission). I should include a note on "Group Replication" vs "Group Selection." Selection can act on groups without groups being replicators. Dawkins objects to the latter often. I will focus on the selection aspect first as per the prompt's focus on Price/Equivalence.

      *Wait, one more check:* The prompt asks for a scenario where they give *different answers*. If I say "They give the same answer," I am following the "if... you conclude that no such example can really be built" instruction. I will explicitly state this conclusion.

      *Let's build the "Collapse" demonstration.*
