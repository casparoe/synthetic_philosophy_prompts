answer: |-
  You have grasped the Problem of Old Evidence (POE) perfectly. Your mathematical intuition is correct: on the standard, subjective Bayesian account of confirmation, if an agent assigns probability 1 to evidence $E$ (because it is already known), then conditionalizing on $E$ cannot change the probability of any hypothesis $H$. Formally, if $P(E) = 1$, then $P(H|E) = P(H)$.

  Consequently, if you stick rigidly to this specific formulation of Bayesianism, you are forced to the counterintuitive conclusion that the perihelion of Mercury provided **zero** confirmatory boost to General Relativity (GR) in 1915.

  However, to answer your core question: **No, the consensus among philosophers of science is not that physicists and historians are confused.** Rather, the consensus is that the *standard formulation of Bayesian confirmation theory* is incomplete or requires refinement to handle this case. The POE is widely regarded as a bug in the theory, not a feature of the world.

  Since you are a double major, I will break down the three primary strategies philosophers have developed to resolve this without demoting Mercury to mere rhetoric.

  ### 1. The Garber Solution: Learning Logical Relations
  The most influential technical solution comes from Daniel Garber (1983). The standard Bayesian model assumes **logical omniscience**: it assumes agents know all the logical consequences of their hypotheses. If you are logically omniscient, you already know in 1915 that $GR \vdash \text{Mercury}$.

  Garber suggests we relax logical omniscience. What Einstein actually learned in 1915 was not the evidence $E$ (which was known), but the **logical connection** between the hypothesis and the evidence.
  *   Let $L$ be the proposition: "Hypothesis $H$ entails Evidence $E$."
  *   In 1914, Einstein knew $E$, but he did not know $L$. So $P(L) < 1$.
  *   In 1915, he derived the field equations and realized $L$ is true.
  *   We can then show that $P(H|L) > P(H)$, even if $P(E) = 1$.

  **Verdict:** This saves the intuition that Mercury confirmed GR. The "new evidence" was the derivability of the old fact from the new theory. This is very appealing to physicists, for whom the *derivation* is often the moment of discovery.

  ### 2. The Counterfactual (or "Ur-Prior") Approach
  Another strategy is to evaluate confirmation not by the actual historical probabilities, but by **counterfactual priors**.
  *   We ask: "What would the probability of $H$ have been *if* the agent had not known $E$?"
  *   We construct a probability function $P^*$ representing the agent's state before $E$ was discovered.
  *   We then check if $P^*(H|E) > P^*(H)$.

  If GR would have been highly improbable without the Mercury data, but probable with it, then Mercury confirms GR relative to that counterfactual prior state.

  **Verdict:** This aligns well with the "method of multiple hypotheses." It treats confirmation as a structural relationship between theory and evidence, independent of the historical timeline of discovery. However, critics argue that constructing these counterfactual priors is psychologically unrealistic and mathematically under-constrained (how do you truly "unlearn" a fact?).

  ### 3. The "New Interpretation" of Old Evidence
  A third approach argues that the $E$ in 1850 (Le Verrier's time) is not identical to the $E$ in 1915 (Einstein's time).
  *   In 1850, $E$ meant: "Mercury's orbit deviates from Newtonian predictions (possibly due to a planet Vulcan)."
  *   In 1915, $E$ meant: "Mercury's orbit deviates from Newtonian predictions (and is explained by spacetime curvature)."

  When GR arrived, it didn't just explain the number (43 arcseconds/century); it recontextualized the data within a new theoretical framework. The confirmation comes from the **unification** of the data with other phenomena (like light bending) under a single metric tensor. In this view, the "evidence" is actually the *systematic power* of the theory to encompass known data that was previously anomalous.

  ### Why Your Friend is Right to Resist the "Hardline" View
  There is a minority view (sometimes associated with John Worrall or strict predictivists) that argues **novel prediction** is indeed superior to accommodating old evidence. They argue that accommodating old evidence invites "fudging" (tweaking parameters to fit known data), whereas novel predictions risk falsification.

  However, even most predictivists admit that Mercury counts as confirmation for GR, because Einstein did not tweak GR to fit Mercury; the 43 arcseconds fell out of the field equations naturally. If the Bayesian model cannot account for this, the model is deficient, not the history.

  ### Summary for Your Seminar
  You should feel confident telling your seminar that:
  1.  **You are right about the math:** Standard conditionalization fails here.
  2.  **You are right about the implication:** Strictly speaking, standard subjective Bayesianism implies Mercury didn't confirm GR.
  3.  **But the philosophical consensus:** This is taken as a *reductio* of the strict model, not a reason to dismiss the historical case.

  Most contemporary Bayesians adopt a hybrid view: Confirmation is about the increase in credence resulting from **new information**, where "new information" can be the discovery of a logical entailment (Garber) or the unification of disparate facts, not just the observation of new data points.

  **Recommended Reading:**
  *   **Daniel Garber**, "Old Evidence and Logical Omniscience" (1983) – *The classic solution.*
  *   **Colin Howson**, "Bayesianism and the Problem of Old Evidence" – *A good critique and defense.*
  *   **Albert Einstein**, "Explanation of the Perihelion Motion of Mercury from the General Theory of Relativity" (1915) – *Worth skimming to see how he frames the derivation as the key insight.*

  The POE remains one of the most fertile grounds in philosophy of science precisely because it forces us to decide what "learning" actually means in a scientific context. Is it seeing new things, or understanding old things in new ways? Bayesianism is still trying to fully codify the latter.
