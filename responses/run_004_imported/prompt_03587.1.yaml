      *   *Tension:* If the uninhabited beautiful world is "good," but a world with people appreciating it is "much better," what is the moral imperative of the discoverer? Do they leave it pristine (preserving the intrinsic beauty) or contaminate it with presence to unlock its higher potential (shared appreciation)? Or does the mere act of observing it shift it from Category 1 to Category 2?

