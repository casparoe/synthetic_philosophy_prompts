answer: |-
  You are absolutely right to feel that something is off. Your intuition is detecting a power asymmetry that Priya's argument deliberately obscures by framing the situation as a matter of individual liberty rather than collective coordination.

  You are looking for a few specific concepts that live at the intersection of game theory, sociology, and political philosophy. While there isn't one single capitalized "Law" that covers this, the dynamic you are describing is a well-documented failure mode in social systems.

  Here is the breakdown of why Priya's defense is structurally flawed, the names for the dynamics at play, and how to renegotiate the norm.

  ### 1. The Diagnosis: What is actually happening?

  Priya is arguing from a framework of **Negative Liberty** (freedom from interference), while you are experiencing a violation of **Substantive Equality** (fairness of outcome).

  **The Free Rider Problem**
  In economics, this is the classic definition of a **Free Rider**. Cleanliness is a "public good" within the house. Priya consumes the benefit of a clean kitchen (when you clean it) without paying the cost (the labor). Her argument that "you choose to clean" ignores that her choice *not* to clean is only viable *because* you choose to clean. If you both exercised your "freedom" to not clean, the kitchen would become unusable. Her freedom is subsidized by your labor.

  **The Principle of Least Interest**
  In sociology, this is known as the **Principle of Least Interest**. It states that in any relationship or negotiation, the person who cares *less* about the outcome holds more power. Priya knows, consciously or not, that she can endure the mess longer than you can. She has weaponized her lower standards. Her "freedom" to not clean is actually a form of **bargaining power** derived from her willingness to let conditions deteriorate.

  **Structural Coercion vs. Direct Coercion**
  Priya claims she has never "ordered" you to do anything. This is true. She is relying on the absence of **Direct Coercion**. However, you are subject to **Structural Coercion**. The environment (the pile of dishes) coerces you. By refusing to alter the environment, Priya is allowing the environment to coerce you on her behalf. It is the difference between a mugger pointing a gun at you (direct) and a landlord locking the only exit until you pay rent (structural). Both remove your freedom, but only one looks like "force" in Priya's definition.

  **A Bad Nash Equilibrium (Moloch)**
  In game theory terms, you have settled into a **Nash Equilibrium**: neither of you has an incentive to change your strategy *given what the other is doing*. If you stop cleaning, you suffer the mess. If she starts cleaning, she "loses" her free time. However, this is a **suboptimal equilibrium**. It is a coordination failure.
  Readers of *Slate Star Codex* (Astral Codex Ten) might recognize this as a manifestation of **Moloch**: a system where individual incentives (Priya saving effort, you avoiding disgust) combine to create a collective outcome that feels unjust and exploitative. The system rewards the person willing to lower standards the most.

  **The Exploitation of the Conscientious**
  In organizational psychology and feminist economics, this is often called the **Exploitation of the Conscientious**. When rules are vague ("clean when intolerable"), the labor falls disproportionately on those with higher standards or higher empathy. The "rule" isn't neutral; it systematically penalizes the person who cares more about the shared space.

  ### 2. Why Priya's Argument Fails

  Priya's defense ("We are both making free choices") relies on a fiction: that your preferences exist in a vacuum. They do not.

  1.  **Preferences are Endogenous:** Your threshold for "intolerable" isn't just a fixed trait; it has been shaped by the expectation that *someone* will clean. If she knew for a fact you would *never* clean, her threshold would become irrelevant because the kitchen would be permanently filthy. Her ability to maintain her high threshold depends on your low one.
  2.  **Asymmetric Leverage:** Her "choice" costs her nothing (she lives in mess). Your "choice" costs you labor. Calling these "equally free choices" is like saying a rich person and a poor person are equally free to buy a yacht. Formally true, substantively nonsense.
  3.  **The Hostage Dynamic:** Effectively, the cleanliness of the kitchen is being held hostage. You are paying the ransom. Priya is arguing that because she didn't kidnap the kitchen, she isn't responsible for the ransom note, even though she benefits from your payment.

  ### 3. How to Renegotiate the Rule

  You cannot win this by arguing about fairness in the abstract, because Priya has insulated herself behind the "freedom" argument. You must change the **structure of the game**.

  **Step 1: Move from Subjective to Objective**
  The current norm relies on a subjective feeling ("intolerable"). This is the vulnerability. You need to propose a norm based on **objective visibility**.
  *   *Proposal:* "The kitchen is 'dirty' when dishes are in the sink overnight," or "when the counter has no clear space."
  *   *Why:* This removes the "who cares more" dynamic. A dish in the sink is a binary fact, not a feeling.

  **Step 2: Formalize the System (The Rota)**
  You mentioned you don't have a chore wheel. You likely need one.
  *   *Argument:* "The current system works for Priya and me differently, which creates resentment. To preserve our friendship, we should remove the ambiguity. A rota ensures that even if someone's threshold changes, the work is shared."
  *   *Rationalist framing:* Frame this as **Incentive Compatibility**. The current system incentivizes lowering standards. A rota incentivizes maintaining the schedule.

  **Step 3: The "House Meeting" Strategy**
  Do not fight this 1-on-1 with Priya. This is a 5-person house problem.
  *   The other three housemates are likely "free riding" as well, or they have thresholds somewhere between yours and Priya's.
  *   If you bring this to a house meeting, Priya's "freedom" argument will likely collapse under the weight of the group's desire for fairness. It is harder to argue "I'm free to be messy" when three other people say, "Actually, we'd like a clean kitchen."
  *   **Crucial:** Do not frame it as "Priya is lazy." Frame it as "The *system* is broken." Say: *"The 'whoever cares first' norm is creating an imbalance. It's not anyone's fault, but it's not sustainable. Let's design a system that doesn't rely on us having identical tolerance levels."*

  **Step 4: The "Schelling Point" Reset (The Strike)**
  If they refuse to formalize rules, you must reset the **Schelling Point**.
  *   Currently, the Schelling Point is "User cleans when User is annoyed."
  *   You must shift it to "Kitchen stays messy until we agree on a plan."
  *   This is risky and unpleasant. You must let the dishes pile up. You must endure the "intolerable" mess. This signals that the old equilibrium is broken.
  *   *Warning:* Only do this if you are prepared for the kitchen to get truly bad. It forces the other housemates (including Priya) to confront the reality that *no one* is cleaning, rather than *you* are cleaning. It exposes the Free Rider problem visibly.

  ### Summary
  You are not crazy. Priya is invoking **Negative Liberty** to defend a **Free Rider** position within a **Tragedy of the Commons**. The norm you have is a **Bad Nash Equilibrium** that penalizes conscientiousness.

  To fix it, stop arguing about "fairness" (which is subjective) and start arguing about "systems" (which are objective). Propose a rota or an objective standard in a group setting. If the system relies on you suffering more than Priya to function, the system is the problem, not your threshold.
