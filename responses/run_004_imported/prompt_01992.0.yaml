prompt: |-
  This happened at my writing group and I can't let it go. My protagonist Wren has a neural implant, installed by the people who raised her, that overrides her and forces her to finish "the mission" if she ever tries to back out. In my draft she does it on her own, no hesitation, so the implant never fires. I read the scene to two friends to check whether readers would buy Wren as morally responsible, and they ended up arguing with each other instead of answering me.

  Cole said she isn't responsible: by construction she couldn't have done otherwise, since the implant guarantees the outcome no matter what she "chooses." Nadia said that's backwards -- the implant never fired, so it played no part in the actual chain of events; judge her by what actually moved her, not a machine that stayed off. Cole shot back: what if she wavers for a split second before catching herself -- isn't that flicker of hesitation the alternative possibility that should matter? Nadia called that a dodge, since I could just write Wren as never wavering, and asked if Cole really wants her to count as *less* responsible the more resolute she is. Cole muttered that the implant needs some earlier signal to react to if its going to work reliably, and admitted that sounded like it assumed the answer rather than argued for it.

  There's definately real philosophy buried in here that's over my head. Go through it move by move, say who's got the better argument at each point (not just who wins overall), and flag whatever both of them are missing. End with one line saying who you'd back on balance -- "Verdict: Cole" or "Verdict: Nadia."
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A writing group discussion about a protagonist (Wren) with a neural implant that forces her to complete a mission if she tries to back out. In the draft, she completes it willingly, so the implant doesn't fire.
      *   **The Conflict:** Two friends (Cole and Nadia) argue about Wren's moral responsibility.
      *   **Cole's Position:** Wren isn't responsible because the implant guarantees the outcome (she couldn't have done otherwise).
      *   **Nadia's Position:** Wren is responsible because the implant didn't fire; judge her by actual causes, not counterfactuals.
      *   **Specific Exchange:** Cole brings up hesitation (alternative possibilities); Nadia calls it a dodge (resolute = less responsible?); Cole admits assuming the answer regarding the signal.
      *   **Task:** Go through the argument move by move, evaluate who has the better point at each stage, identify what *both* are missing (the underlying philosophy), and end with a one-line verdict ("Verdict: Cole" or "Verdict: Nadia").

  2.  **Deconstruct the Philosophical Core:**
      *   This is a classic **Frankfurt-style Case** (named after philosopher Harry Frankfurt).
      *   *The Setup:* An agent (Wren) performs an action. There is a counterfactual intervener (the implant) that would have forced the action if the agent showed signs of not doing it. But the agent does it on their own.
      *   *The Question:* Is the agent morally responsible?
      *   *The Principle of Alternative Possibilities (PAP):* An agent is responsible only if they could have done otherwise.
      *   *Frankfurt's Argument:* PAP is false. Responsibility depends on the *actual sequence* of events, not the *counterfactual sequence* (what would have happened if things were different).
      *   *Cole's Stance:* Defends PAP (roughly). She couldn't have done otherwise, so she's not responsible.
      *   *Nadia's Stance:* Defends Actual Sequencing (Frankfurtian). The implant was idle, so she is responsible.

  3.  **Step-by-Step Analysis of the Dialogue:**

      *   **Move 1: Cole's Opening (The Guarantee).**
          *   *Argument:* She couldn't have done otherwise because the implant guarantees the outcome.
          *   *Philosophy:* Principle of Alternative Possibilities (PAP).
          *   *Evaluation:* Intuitively strong. If I'm locked in a room, I can't leave. If Wren is "locked" into the mission, is she free? However, Frankfurt cases are specifically designed to challenge this.
          *   *Winner:* Cole has the intuitive edge, but Nadia has the technical philosophical edge (Frankfurt's counterexample). Let's call it a push or slight edge to Nadia based on the specific "actual sequence" fact. Actually, in the context of the story, Cole is highlighting the *lack of freedom*, which is crucial for responsibility. But Nadia is right that causation matters. Let's give Cole the point on *intuition*, Nadia on *mechanism*. Wait, the prompt asks "who's got the better argument." Cole's argument relies on PAP, which Frankfurt cases famously undermine. So Nadia is technically stronger here philosophically, even if Cole feels more "just."
          *   *Refinement:* Cole is arguing from *leeway incompatibilism* (need freedom to do otherwise). Nadia is arguing from *actual sequence compatibilism*. In Frankfurt cases, the standard philosophical consensus leans toward Nadia (the intervener doesn't negate responsibility if they don't intervene). So Nadia wins Move 1 technically.

      *   **Move 2: Nadia's Counter (Actual Sequence).**
          *   *Argument:* The implant never fired. Judge by what actually moved her.
          *   *Philosophy:* Actual Sequence Responsibility / Frankfurt's main point.
          *   *Evaluation:* This is the standard rebuttal to Cole. If the mechanism is idle, it's like a locked door you didn't try to open. You are responsible for staying in the room if you chose to stay.
          *   *Winner:* Nadia. This is the core strength of the Frankfurt case.

      *   **Move 3: Cole's Retreat (The Hesitation/Flicker).**
          *   *Argument:* What if she wavers? That flicker is the alternative possibility.
          *   *Philosophy:* The "Flicker of Freedom" strategy. This is a known counter-counter-argument to Frankfurt cases. If there is *any* moment where she could have chosen differently (even if the implant would have corrected it later), PAP is saved.
          *   *Evaluation:* This is a sophisticated move. It tries to find *some* alternative possibility to preserve moral responsibility conditions. However, it relies on the implant needing a signal.
          *   *Winner:* Cole makes a clever philosophical pivot, but it weakens his initial absolute claim. It's a valid strategy (the "Flicker Defense"), but it concedes ground. Let's say Cole gains ground here by identifying a nuance, but Nadia is ready to swat it.

      *   **Move 4: Nadia's Trap (The Resoluteness Paradox).**
          *   *Argument:* If you require hesitation to be responsible, then being more resolute makes you *less* responsible. That's absurd.
          *   *Philosophy:* Reductio ad absurdum against the Flicker Defense.
          *   *Evaluation:* This is a strong point. Moral responsibility shouldn't hinge on having a moment of weakness. If I donate to charity without a second thought, am I less praiseworthy than if I hesitated? Usually, we think the opposite.
          *   *Winner:* Nadia. This exposes the flaw in Cole's "flicker" requirement.

      *   **Move 5: Cole's Concession (The Signal).**
          *   *Argument:* The implant needs a signal to work. Admits it assumes the answer.
          *   *Philosophy:* Acknowledging the "Prior Sign" objection.
          *   *Evaluation:* Cole admits defeat here. He recognizes that requiring a signal presupposes the possibility of doing otherwise, which is the very thing in question.
          *   *Winner:* Nadia (by default of Cole conceding).

  4.  **Identifying What Both Are Missing:**
      *   **The Nature of the Implant's Influence:** They treat the implant as a binary switch (fired/didn't fire). But does the *knowledge* of the implant influence Wren? Is she acting freely because she *wants* to, or because she's been conditioned/brainwashed to want to?
      *   **Sourcehood vs. Leeway:** They are arguing about *Leeway* (could she do otherwise?). They are missing *Sourcehood* (is the action truly hers?). Even if the implant didn't fire, did the *threat* of the implant shape her desires? (Manipulation Argument).
      *   **Moral Luck:** Wren is lucky the implant didn't fire. Does luck affect responsibility?
      *   **Character vs. Action:** Is the question about this specific action or her overall character?
      *   **Key Missing Piece:** The *history* of the implant. Frankfurt cases usually assume the intervener is external. Here, the implant was installed by "the people who raised her." This suggests manipulation/programming of her desires, not just a counterfactual blocker. This moves it from a Frankfurt Case to a **Manipulation Argument** (e.g., Derk Pereboom). If her desires were engineered to align with the mission, she lacks *ultimate sourcehood*, regardless of the implant firing.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the depth (Frankfurt Cases).
      *   *Move-by-Move:*
          1.  Cole's "Could Not Do Otherwise" vs. Nadia's "Actual Sequence." (Nadia wins on technical philosophy, Cole on intuition).
          2.  Cole's "Flicker" vs. Nadia's "Resoluteness." (Nadia wins the logic trap).
          3.  Cole's Concession. (Nadia wins).
      *   *The Missing Piece:* Focus on the *origin* of the desires (Manipulation Argument) and the distinction between *freedom to do otherwise* and *freedom to be the source*.
      *   *Verdict:* Needs to be decisive. Philosophically, Nadia represents the dominant view on Frankfurt cases (Actual Sequence). However, the *context* (raised by them, implant installed) leans toward Cole's intuition that she isn't free, but for the *wrong reason*. Cole thinks she isn't free because of the *backup* (implant). The real reason she might not be free is because of the *programming* (upbringing/implant installation).
      *   *Decision:* Nadia wins the argument *as presented* (about the implant's role in the specific action). Cole is right to be suspicious, but his reasoning is flawed. The prompt asks who has the better argument *in the exchange*. Nadia's logic holds up better within the confines of the Frankfurt framework they are accidentally debating.
      *   *Wait, reconsider:* Cole's intuition is actually more aligned with the *Manipulation Argument* which undermines responsibility even more than the Frankfurt case. But Cole argues from *Alternative Possibilities* (PAP), which is weak against Frankfurt. Nadia argues from *Actual Sequence*, which is strong against PAP. So Nadia wins the debate they *had*. But both miss the *Manipulation* angle.
      *   *Verdict:* Nadia. She correctly identifies that the idle mechanism doesn't cause the action. Cole conflates "couldn't have done otherwise" with "wasn't the source."

  6.  **Refining the Output:**
      *   Make sure to explicitly name the philosophical concepts (Frankfurt Cases, PAP, Actual Sequence, Manipulation Argument).
      *   Keep the tone analytical but accessible.
      *   Ensure the "Verdict" is exactly one line as requested.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Nadia is right because philosophy says so." I need to evaluate the *quality of the argumentation* in the room. Nadia's reductio ad absurdum regarding resoluteness was the killing blow. Cole's concession sealed it.

      *(Check on the "Missing" section)*: Make sure to highlight that the implant's existence *during upbringing* matters. If the implant shaped her psychology, she's a puppet even if the strings weren't pulled *this time*. That's the "Sourcehood" objection.

      *(Final check on Verdict)*: "Verdict: Nadia" fits the constraint.

  7.  **Final Polish:** Check against constraints.
