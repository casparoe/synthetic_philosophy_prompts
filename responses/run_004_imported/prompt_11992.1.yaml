  So last night my friend Priya and I got into this whole argument about Bertrand Russell because our book club picked "Marriage and Morals" for next month (dont ask, our club has weird taste some months). She was going on about what a massive hypocrite the guy was — four marriages, a string of affairs, basically the opposite of whatever a "stable companionate marriage" is supposed to look like — and using that as a mic-drop to say his whole argument in the book is worthless. I pushed back that just pointing at his personal life is a cheap shot and doesn't actually engage with what he argued (the bit about jealousy being something we're trained into rather than a hardwired instinct, his case for giving young people more freedom before marriage instead of strict premarital chastity, his claim that the real point of marriage is raising kids rather than sexual exclusivity, etc). Anyway it turned into us trying to one-up each other with Russell jokes, and all of hers were just "lol what a hypocrite," which felt kind of lazy and cheap to me.

  I wanna send her something better: a joke that's actually funny BECAUSE of the specific content of his arguments, not just a generic "philosopher doesn't practice what he preaches" jab you could make about literally any moralist ever. Like, ideally the punchline should only really land if you know what he specifically claimed — the jealousy-is-a-learned-habit thing, or the "give young people more rope before marriage" stuff, or the marriage-is-about-children-not-passion thing — so it'd go over the head of someone who only knows Russell as "the Why I Am Not a Christian guy." Can you write me one or two like that? Doesn't have to be a total knee-slapper, I just want something that shows real understanding of the actual position instead of a surface-level dig at his love life.
