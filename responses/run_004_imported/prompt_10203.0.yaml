answer: |-
  This is a fascinating dispute, not least because it highlights the often-overlooked second act of Dummett's life. While analytic philosophers know him for truth-values and sorites paradoxes, his activism was rigorous, sustained, and philosophically grounded. Your friend is correct that *On Immigration and Refugees* (2001) is not a pamphlet but a structured moral argument, and it does provide specific criteria rather than vague benevolence.

  However, your objection regarding the complexity of the current landscape (the split between high visa numbers and hostile asylum rhetoric) touches on a tension Dummett himself grappled with: the distinction between *economic migration* (which states may control) and *asylum* (which they may not).

  Here is a reconstruction of how Dummett would likely assess the current situation, flagging where his views are textually grounded and where they require extrapolation to the post-2020 context.

  ---

  ### 1. The "Invasion" Rhetoric and the Submersion Test

  Your friend argues Dummett would apply the "submersion" test to Suella Braverman's "invasion" claim. You argue the numbers don't support the threat.

  **[Direct Commitment]** In *On Immigration and Refugees*, Dummett explicitly concedes a theoretical "right not to be submerged." He argues that a national community has a legitimate interest in preserving its character and that if immigration were so massive it rendered the existing society unrecognizable or overwhelmed public services to the point of collapse, restriction would be permissible. However, he immediately adds a stringent caveat: the threshold for this is "extraordinarily high." He spent chapters demonstrating that post-war Britain, even at peaks of Commonwealth migration, never approached this threshold. He viewed claims of "swamping" as empirically false and morally corrosive.

  **[Direct Commitment]** Dummett was deeply suspicious of political rhetoric that conflated economic migrants with refugees. He argued that the moral status of a refugee (fleeing persecution) is categorically different from that of an economic migrant (seeking betterment). To treat them as the same category is to obscure the specific moral obligation owed to the former.

  **[Extrapolation]** Applied to the "invasion" framing of small-boat crossings: Dummett would almost certainly have condemned this language as a deliberate falsehood designed to trigger the "submersion" panic without meeting the empirical reality. Even if net migration is high (700k+), the number of small-boat crossings (typically 30k–45k annually in recent years) is statistically negligible relative to the UK population. Dummett would argue that labeling this an "invasion" is not a good-faith assessment of the submersion threshold but a political tool to manufacture consent for harsher measures. He would view the rhetoric itself as a moral failing, regardless of the policy outcome, because it dehumanizes the subjects.

  **[Extrapolation]** On the composition of migration: Dummett would likely distinguish between the 700k figure (mostly visas) and the asylum figure. He accepted states have the right to limit economic migration based on capacity. Therefore, he might not object to the *existence* of high visa controls or targets, provided they are administered fairly. His fury would be reserved for the *conflation* of these groups. If the government claims the country is being "submerged" by asylum seekers when the data shows they are a fraction of the total, he would judge this as a violation of the truth-telling requirement essential to public discourse.

  ### 2. The Rwanda Scheme and the Geneva Convention

  Your friend claims Dummett would judge the Rwanda scheme by compliance with the Geneva Convention. You suggest the framework might be too old for this specific policy.

  **[Direct Commitment]** Dummett's stance on asylum was uncompromising. He argued that the 1951 Geneva Convention created a moral obligation that superseded domestic political convenience. He was particularly focused on the principle of *non-refoulement*—the prohibition on returning refugees to a place where they face danger. In his activism with the Joint Council for the Welfare of Immigrants (JCWI), he frequently challenged policies that sought to offshore processing or deter arrival through hardship, viewing them as attempts to evade international obligations.

  **[Direct Commitment]** He argued that the "safe third country" concept (sending asylum seekers to the first safe country they reached) was often used as a pretext to shirk responsibility. He insisted that the obligation attaches to the state where the claim is made, not necessarily the first point of entry, especially if the first point is unsafe or lacks capacity.

  **[Extrapolation]** Regarding the Rwanda scheme: Dummett would have judged this scheme as a direct violation of the core principle of asylum. The Supreme Court's finding that Rwanda was not a safe country (risk of *refoulement*) aligns perfectly with Dummett's primary concern. He would view the scheme not as a "border control" measure but as an attempt to nullify the right to claim asylum. For Dummett, the right to claim asylum is meaningless if the claimant is removed to a jurisdiction where the claim cannot be fairly heard or where they risk return to persecution. He would likely characterize the scheme as "morally illicit," regardless of its legislative status.

  **[Speculative Extrapolation]** One nuance: Dummett was a realist about the burden on host nations. He acknowledged that a sudden, massive influx *could* strain a system. However, he would argue that the solution is improving processing capacity and international cooperation, not externalizing border control to avoid legal scrutiny. He would likely view the Rwanda scheme as an admission that the UK government prefers to spend resources on deterrence rather than on fulfilling its duties to those already present.

  ### 3. The Racism Thesis: Visas vs. Boats

  This is the crux of your objection. Dummett's historical thesis is that British immigration control was driven by racism against Commonwealth citizens. Today, the UK admits record numbers of non-white workers (via visas) but vilifies non-white asylum seekers (via boats). Does his thesis hold?

  **[Direct Commitment]** Dummett's historical argument in the book is that the Commonwealth Immigrants Acts (1962, 1968, 1971) were not motivated by economic necessity but by a desire to limit non-white settlement while preserving access for white Old Commonwealth citizens (Australia, Canada). He viewed the "racial element" as the decisive factor in the tightening of laws. He argued that when economic needs conflicted with racial prejudice, prejudice usually won in the form of restrictionism.

  **[Extrapolation]** How would he reconcile this with high non-white visa intake today? Dummett would likely argue that the *nature* of the racism has shifted from "exclusion by numbers" to "exclusion by status." He would note that work visas are conditional, temporary, and exploitable; the migrant is welcomed for their labor but denied security. Asylum seekers, conversely, claim a right based on vulnerability, not economic utility.

  **[Speculative Extrapolation]** Dummett would likely interpret the current hostility toward boat crossers as consistent with his racism thesis, even if total non-white migration is high. His argument was never that *no* non-white people should be admitted; it was that the *system* was structured to disadvantage non-white people relative to white people, and to treat non-white claims with suspicion.
  He would likely point out that the "Hostile Environment" policies (which led to Windrush) disproportionately affected Commonwealth citizens who had a legal right to be here. The current rhetoric framing asylum seekers as "illegal" (when international law says seeking asylum is not illegal) serves a similar function: it casts a predominantly non-white group as law-breakers to justify exclusion. He would argue that welcoming high-skilled workers while demonizing refugees is not a refutation of the racism thesis, but a refinement of it: racism now operates by sorting "deserving" (economic) from "undeserving" (asylum) migrants, with the latter category being racially coded.

  **[Direct Commitment]** Dummett wrote extensively on the "Windrush generation" in the later years of his life. He emphasized that the scandal was not an anomaly but the logical conclusion of a system designed to suspect the legitimacy of non-white Britons.

  **[Extrapolation]** He would likely view the current situation as the continuation of the Windrush logic. The fact that 700k migrants enter legally is irrelevant to the moral assessment of how the 40k asylum seekers are treated. For Dummett, the moral test of a society is not how it treats those it *wants* (workers), but how it treats those it *doesn't want* but is obligated to protect (refugees). The high visa numbers do not absolve the state of the duty to asylum seekers, nor do they prove the absence of racism in the system's architecture.

  ### The Verdict

  **Your friend is largely right, but your nuance is necessary.**

  1.  **On the Yardstick:** Your friend is correct that Dummett's tests transfer cleanly.
      *   **Submersion:** Dummett would find the "invasion" claim empirically false and morally reckless. The UK is not submerged. **[Direct Commitment]**
      *   **Geneva Convention:** Dummett would find the Rwanda scheme morally impermissible due to *refoulement* risks. **[Direct Commitment]**

  2.  **On the Racism Thesis:** You are right to question the simplicity of the "racism" label given high non-white visa intake. However, Dummett would likely rebut this by refining the definition of racism in this context.
      *   He would argue that a system can be racially prejudiced even if it admits large numbers of non-white people, provided it subjects them to a hierarchy of rights where the most vulnerable (asylum seekers) are demonized and stripped of protections. **[Speculative Extrapolation]**
      *   He would likely argue that the *rhetoric* of invasion is itself evidence of the racialized prejudice he diagnosed in the 1960s, regardless of the visa statistics. **[Direct Commitment]**

  **Conclusion:**
  Dummett would not be confused by the post-Brexit mess. He would likely say: *"The government is using the economic utility of migrants to boost the economy while using the racialized fear of refugees to boost votes. Both are compatible with the same underlying prejudice: that the non-white migrant is never quite a member of the community, but always a guest who can be expelled."*

  Your friend wins on the application of the *tests* (Rwanda fails, Submersion is not met). You win on the complexity of the *sociological diagnosis* (it is not simple restrictionism, but a bifurcated system of exploitation and exclusion). Dummett would likely agree with both of you: the tests are clear, but the political machinery using them has become more sophisticated in its hypocrisy.
