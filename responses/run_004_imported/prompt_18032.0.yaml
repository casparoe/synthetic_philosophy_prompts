answer: |-
  **The Instrumental Limit: Why Good's Theorem Does Not Vindicate Curiosity**

  I. J. Good's 1967 proof that the expected utility of free information is non-negative is a cornerstone of formal epistemology. It is frequently mobilized as a normative bulwark for Carnap's total-evidence requirement and, more colloquially, as a rationalist license for curiosity: if information is free, a rational agent should always seek it. However, this slogan conflates a specific mathematical result regarding *instrumental rationality* with a general doctrine of *epistemic value*. By examining the theorem's formal constraints against strategic interdependence, computational costs, and the intrinsic disvalue of knowledge, we find that the "license for curiosity" is a category error. Good's theorem holds strictly for solitary, unbounded agents with stable preferences over physical outcomes. A rational agent is justified in declining free evidence whenever the decision context violates these isolationist assumptions, specifically when the epistemic state itself, or the strategic reaction to it, enters the utility function.

  ### I. The Theorem and Its Assumptions

  To assess the scope of Good's result, we must state it with sufficient formal rigor to expose its boundary conditions. Let $\Omega$ be a set of states of the world, $A$ a set of available actions, and $u: A \times \Omega \to \mathbb{R}$ a utility function. Let $P$ be the agent's prior probability distribution over $\Omega$. The agent faces a decision problem where they may either act immediately or first observe the outcome $e$ of an experiment $E$, where $E$ is a random variable with outcomes in a set $\mathcal{E}$.

  The expected utility of acting immediately is:
  $$ EU_{now} = \max_{a \in A} \sum_{\omega \in \Omega} P(\omega) u(a, \omega) $$

  If the agent observes $e$, they update their beliefs to $P(\cdot | e)$ via conditionalization and choose the optimal action $a_e$ for that posterior. The expected utility of observing then acting is the expectation of these conditional maximums:
  $$ EU_{obs} = \sum_{e \in \mathcal{E}} P(e) \left[ \max_{a \in A} \sum_{\omega \in \Omega} P(\omega | e) u(a, \omega) \right] $$

  Good's Theorem states that $EU_{obs} \geq EU_{now}$. The proof relies on the law of total expectation and the fact that the maximum of expectations is less than or equal to the expectation of maximums (Jensen's inequality applied to the convex max function).

  For this inequality to hold, five critical assumptions must be satisfied:
  1.  **Cost-Free Signal:** The observation itself entails no loss of utility (no fee, time, or energy cost).
  2.  **Optimal Conditional Action:** The agent is capable of and committed to maximizing expected utility relative to their posterior beliefs.
  3.  **Consequentialism over Physical States:** The utility function $u(a, \omega)$ depends only on the action taken and the physical state of the world. It does not depend on the agent's information state or the history of how the decision was reached.
  4.  **Causal Isolation:** The observation $e$ does not causally influence the state $\omega$ (no Newcomb-like problems), nor does the *act of observing* influence the behavior of other agents.
  5.  **Stable Preferences:** The utility function $u$ remains constant before and after the observation.

  The "license for curiosity" slogan assumes these conditions are default features of rational agency. The three considerations raised in the prompt challenge exactly this assumption.

  ### II. Assessing the Constraints

  #### 1. Strategic Settings and Causal Isolation
  In game-theoretic contexts, assumption (4) is frequently violated. Good's theorem models a decision problem against "Nature," where the state $\omega$ is fixed independent of the agent's epistemic maneuvers. In strategic settings, however, payoffs depend on the actions of other agents who may react to the agent's information state.

  Consider a signaling game where an agent's decision to acquire information reveals their "type" (e.g., a cautious insurer investigating a claim signals suspicion, prompting the claimant to litigate). Here, the act of observing changes the strategic landscape. If opponents can infer that information has been acquired, they may adjust their strategies in a way that lowers the agent's payoff, even if the agent uses the information optimally.

  Can this be absorbed into Good's framework? One might argue we can simply expand the state space $\Omega$ to include opponent responses. However, this obscures the causal structure. In Good's theorem, $P(\omega|e)$ represents learning about a fixed state. In the strategic case, $P(\omega|e)$ represents a counterfactual dependency where the *acquisition* of $e$ shifts the distribution of $\omega$. This violates the assumption that the experiment is informative about a static world. Consequently, strategic vulnerability is a genuine restriction of scope. Good's theorem does not apply to environments where information acquisition is observable and strategically salient.

  #### 2. Computational Costs and Optimal Action
  Assumption (2) posits that the agent *will* act optimally on the new information. This presupposes that calculating the posterior $P(\cdot|e)$ and the new optimal action $a_e$ is trivial. Good himself later distinguished between "Type I" rationality (theoretical) and "Type II" rationality (practical), acknowledging that deliberation consumes resources.

  If processing evidence incurs a cognitive cost $c > 0$, the signal is no longer cost-free (violating assumption 1). We can mathematically absorb this by redefining the utility of observing as $EU_{obs} - c$. If $c$ exceeds the instrumental value of the information (the difference $EU_{obs} - EU_{now}$), the rational choice is ignorance.

  While this can be formally modeled within the expected utility framework, it negates the slogan's claim that *free* information is always valuable. In realistic cognitive architectures, information is rarely computationally free. Thus, while the *framework* of expected utility can handle this, the *theorem* regarding cost-free information does not vindicate curiosity for bounded agents. It merely sets an upper bound on how much one should spend to learn.

  #### 3. The Right Not to Know and Stable Preferences
  The most profound challenge comes from cases where the knowledge itself is disvalued, such as a terminal diagnosis or a spoiler. This violates assumption (3) and (5). Good's utility function is defined over $(a, \omega)$. It does not include a term for the agent's epistemic state $K$.

  If an agent prefers not to know $\omega$, their utility function is effectively $u(a, \omega, K)$, where $K=\text{known}$ yields lower utility than $K=\text{unknown}$, independent of the action taken. For example, knowing a diagnosis may induce anxiety that reduces welfare regardless of treatment choices.

  Proponents of the "absorption" view argue we can simply treat "knowing" as part of the outcome state $\omega'$. However, this fundamentally alters the structure of the decision problem. Good's theorem proves that information has non-negative *instrumental* value—it helps you choose better actions. It does not prove that information has non-negative *intrinsic* value. If the utility function penalizes the state of knowing, the total expected utility of observing is:
  $$ EU_{total} = EU_{instrumental} + U(\text{knowing}) $$
  Since Good's theorem only guarantees $EU_{instrumental} \geq 0$, it cannot guarantee $EU_{total} \geq 0$ if $U(\text{knowing})$ is sufficiently negative. Therefore, the "right not to know" is not a violation of rationality; it is a reflection of a utility function that values epistemic ignorance as a good. To claim Good's theorem forbids this is to beg the question by defining utility solely over physical consequences.

  ### III. Verdict: The Instrumental Limit

  The considerations above lead to a specific verdict: **Good's theorem is a bound on instrumental rationality in isolated decision problems, not a general norm of epistemic conduct.** A rational agent is justified in preferring not to know something whenever the decision context violates the isolationist assumptions of the theorem—specifically, when the epistemic state itself carries intrinsic disvalue, when information acquisition triggers adverse strategic responses, or when the cognitive cost of processing exceeds the instrumental gain.

  The slogan that "free information can only help" commits a category mistake by conflating *instrumental* value with *total* value. Good's theorem demonstrates that information is a resource for action optimization. It says nothing about the value of the resource itself. Just as a free hammer is only valuable if you intend to drive nails and not if you wish to sleep, free information is only valuable if your utility function rewards better actions more than it penalizes the state of knowing or the strategic risks of exposure.

  Furthermore, the theorem assumes a "view from nowhere" regarding the agent's own mind. It treats the agent as a black box that maps inputs to actions without internal state changes that affect welfare. Once we acknowledge that agents are psychological entities who suffer from anxiety, or social entities embedded in games of signal and counter-signal, the "license for curiosity" dissolves.

  Therefore, the rationalist injunction to "always look before leaping" is false as a general principle. It holds only for a specific, idealized subclass of agents: solitary, unbounded consequentialists who care nothing for their own peace of mind or strategic opacity. For human agents, and for agents in social worlds, rationality sometimes requires a deliberate, calculated ignorance. Good's theorem does not forbid this; rather, it precisely delineates the narrow corridor in which curiosity is mathematically mandatory. Outside that corridor, the rational choice is often to close one's eyes.

  ### Conclusion

  I. J. Good's 1967 result is a masterpiece of decision theory, but its philosophical uptake has suffered from overgeneralization. By making the assumptions explicit, we see that the theorem protects the value of information only relative to action optimization in a static, solitary environment. It does not, and cannot, account for the psychological cost of knowing, the strategic cost of being known to know, or the computational cost of processing. A rational agent is justified in declining free evidence whenever their utility function assigns intrinsic value to ignorance or when their environment renders information acquisition a strategic liability. Curiosity is instrumentally rational, but it is not unconditionally so. The total-evidence requirement remains a norm for *inference*, but Good's theorem fails to establish it as a norm for *inquiry*.
