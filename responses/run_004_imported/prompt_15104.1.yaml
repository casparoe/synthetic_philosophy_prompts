answer: |-
  This is one of the most crucial pivot points in accuracy-first epistemology, and it is excellent that you are pausing to grasp the intuition before implementing a system at work. The literature can sometimes treat strict propriety as a technical precondition, but it is actually the *substantive heart* of the project.

  To understand why propriety is load-bearing, we need to separate the two contexts you mentioned: the **practical incentives** for your analysts and the **philosophical justification** for probabilism. They break for the exact same reason, just described in different languages.

  Here is the intuition for why using absolute difference ($|p - o|$) destroys both your scoring system and the philosophical argument.

  ---

  ### 1. The Practical Break: The "Extremization" Incentive

  Let's look at your concrete example. You want to measure inaccuracy using the absolute difference between the reported probability $p$ and the outcome $o$ (where $o$ is 1 if the event happens, 0 if it doesn't). Lower score is better.

  Imagine an analyst whose genuine, honest credence ($q$) is **60%** ($0.6$). They believe the event is more likely than not, but they are far from certain.

  If they report honestly ($p = 0.6$):
  *   If the event happens (60% chance): Score is $|0.6 - 1| = 0.4$
  *   If the event fails (40% chance): Score is $|0.6 - 0| = 0.6$
  *   **Expected Score:** $(0.6 \times 0.4) + (0.4 \times 0.6) = \mathbf{0.48}$

  Now, imagine that same analyst realizes the scoring rule is absolute difference. They decide to game the system. Since they lean toward "true" ($q > 0.5$), they report **100%** ($p = 1.0$).
  *   If the event happens (60% chance): Score is $|1.0 - 1| = 0.0$
  *   If the event fails (40% chance): Score is $|1.0 - 0| = 1.0$
  *   **Expected Score:** $(0.6 \times 0.0) + (0.4 \times 1.0) = \mathbf{0.40}$

  **The Break:** By lying and reporting 100% instead of their true 60%, they lowered their expected inaccuracy from 0.48 to 0.40.

  **The Consequence for Your Team:**
  If you use absolute difference, you are not incentivizing *probability estimation*; you are incentivizing *binary classification*.
  1.  **Loss of Information:** A report of "100%" no longer means "I am certain." It means "I am >50% sure." You lose all resolution between 51% and 99%.
  2.  **Calibration Impossible:** You cannot calibrate your analysts. If an analyst says "80%" on ten events and 8 come true, they look perfectly calibrated. But under absolute difference, they *should* have said "100%" on all of them to minimize their score. The metric punishes them for expressing uncertainty.
  3.  **Decision Risk:** If your business decisions rely on these probabilities (e.g., expected value calculations), treating a 51% belief as a 100% certainty will lead to catastrophic risk management.

  **The Intuition:** A proper scoring rule creates a "bowl" shape for expected score, where the bottom of the bowl is exactly at your true credence. Absolute difference creates a "ramp." If you are on a ramp, the best place to stand is always at the edge, never in the middle. Strict propriety ensures the bottom of the bowl is in the middle.

  ---

  ### 2. The Philosophical Break: The Normative Bridge

  Now, let's look at the Joyce/Pettigrew argument. The goal of accuracy-first epistemology is to derive the **Probability Axioms** (Probabilism) from the goal of **Accuracy**.

  The argument structure is roughly:
  1.  **Epistemic Goal:** The fundamental norm of belief is to minimize inaccuracy (maximize accuracy).
  2.  **Mathematical Link:** If we measure inaccuracy with a *strictly proper* scoring rule, then...
  3.  **Conclusion:** ...any set of credences that violates the probability axioms is "accuracy-dominated" (there is always a probabilistic set of credences that is more accurate in every possible world).

  **Where Absolute Difference Breaks the Chain:**
  The argument relies on the idea that "minimizing expected inaccuracy" is synonymous with "aligning your report with your evidence."

  If you use an improper rule like absolute difference, **minimizing expected inaccuracy requires you to violate your own evidence.**
  *   If your evidence supports a credence of 0.6, the norm "minimize expected inaccuracy" commands you to adopt a credence of 1.0.
  *   Therefore, under absolute difference, **Probabilism is accuracy-suboptimal.** A coherent probabilist (who admits uncertainty) will consistently achieve worse expected scores than an incoherent dogmatist (who extremizes).

  **Why Propriety is Load-Bearing:**
  Joyce's argument isn't just that probabilists score well; it's that the *definition of epistemic utility* must reflect the *nature of belief*.
  *   Belief comes in degrees.
  *   Therefore, the measure of success for belief must reward correct degrees.
  *   If a scoring rule rewards you for collapsing degrees into binaries (like absolute difference does), it is not measuring *epistemic* accuracy; it is measuring *decision-theoretic* utility for a specific kind of binary bet.

  If you use an improper rule to justify Probabilism, you are effectively arguing: "You should obey the probability axioms because doing so helps you game this specific scoring metric." But since the metric incentivizes *breaking* the axioms (by encouraging reports of 0 or 1 rather than distributions), the argument becomes self-defeating.

  Strict propriety is the mathematical guarantee that **honesty is the unique optimal strategy.** Without it, the link between "wanting to be accurate" and "being probabilistic" is severed. You cannot argue that agents *ought* to be probabilistic if the metric of "goodness" punishes probabilistic reporting.

  ---

  ### 3. Geometric Intuition: Convexity vs. Linearity

  If you want a visual intuition for why the proofs require propriety, think about geometry.

  *   **Proper Scoring Rules (e.g., Brier):** These correspond to **convex functions**. Imagine a curved bowl. If you take any point inside the bowl (an incoherent set of credences), you can draw a tangent plane that separates that point from the surface of the bowl (the coherent credences). This geometric property allows Joyce to prove that for any incoherent point, there is a coherent point closer to the truth in *every* world.
  *   **Improper Scoring Rules (e.g., Absolute Difference):** These correspond to **linear functions** (or non-convex ones). Imagine a flat slide or a ramp. There is no unique minimum in the interior. The minimum is always on the boundary (0 or 1).

  The dominance theorems (like Predd et al.) rely on the geometry of convexity to show that incoherent credences are "further away" from the truth than their coherent projections. If the "distance" metric is linear (absolute difference), the geometry collapses. An incoherent agent might not be dominated by a coherent one, or worse, the coherent agent is dominated by an extremizing one.

  ### Summary for Your Design

  When you present this to your stakeholders, you can frame it like this:

  1.  **Propriety = Honesty:** A strictly proper rule (like Brier or Log Score) ensures that an analyst's best strategy is to report exactly what they think.
  2.  **Impropriety = Gaming:** An improper rule (like Absolute Difference or Classification Accuracy) incentivizes analysts to hide uncertainty and report extreme confidence.
  3.  **The Philosophical Stakes:** The reason the epistemology literature insists on this is that if the scoring rule doesn't reward honesty, it ceases to be a measure of *knowledge* and becomes a measure of *boldness*. We want to measure knowledge.

  **Recommendation:** Stick to the **Brier Score** ($(p-o)^2$) for general use. It is strictly proper, bounded (easy to explain), and penalizes overconfidence heavily without being as harsh as the Log Score (which goes to infinity for $p=0$ when event occurs). Avoid Absolute Difference at all costs if you want to elicit probabilities.
