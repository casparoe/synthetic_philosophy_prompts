      *   **View on Homosexuality (Paederasty):** He argued it causes no primary mischief (no direct harm to non-consenting parties). The pain associated with it comes from *secondary* mischief: public antipathy, legal punishment, and blackmail.
      *   **View on Morality:** Rejected "asceticism" (morality based on self-denial) and "sympathy/antipathy" (morality based on gut feeling without calculation).
      *   **View on Identity:** He did not conceive of "sexual orientation" as a fixed ontological identity. He saw it as a propensity or taste, varying in degree.

