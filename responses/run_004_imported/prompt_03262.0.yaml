      *   *Bentham on "Rights/Dignity":* He would reject "dignity" and "natural rights" as rhetorical fluff. For Bentham, if a right doesn't serve utility, it shouldn't exist. If a law causes pain (punishment, stigma) without preventing greater pain (harm to others), it's bad.
