answer: |-
  Here is a rigorous reconstruction of your position, structured as a philosophical argument. It is designed to validate your intuition that Hofstadter's move from "symmetry" to "cooperation" is an enthymeme that relies on a hidden normative premise, and to demonstrate that this gap persists even against your friend's "single deduction" objection and appeals to modern decision theories.

  ***

  # The Enthymeme of Superrationality: A Critique of the Symmetry-to-Cooperation Inference

  ## 1. Thesis Statement
  The standard argument for superrational cooperation in the one-shot Prisoner's Dilemma (PD) is logically incomplete. It validly infers from the premise of identical reasoning that the outcome must be symmetric (on the diagonal), but it invalidly infers from symmetry alone that the outcome must be *cooperative*. To bridge the gap between "we will do the same thing" and "we will do the *best* same thing," the argument smuggles in a hidden normative premise: **The Principle of Symmetric Optimality**. This principle asserts that among logically consistent symmetric outcomes, rational agents are compelled to select the Pareto-superior one. This principle is not a truth of logic or a requirement of instrumental rationality; it is an independent axiological commitment indistinguishable from a moral or efficiency norm.

  ## 2. The Underdetermination of Symmetry
  Your friend's core claim rests on the idea that superrational agents, reasoning identically, collapse the strategy space from four outcomes to two: $\{ (C,C), (D,D) \}$. This is the **Symmetry Constraint**.

  However, the Symmetry Constraint is *underdetermined* with respect to action. Both $(C,C)$ and $(D,D)$ satisfy the condition of identical reasoning.
  *   **Scenario A (Cooperation):** Both agents reason, "Since we are identical, if I cooperate, he cooperates. $3 > 1$, so I cooperate."
  *   **Scenario B (Defection):** Both agents reason, "Since we are identical, if I defect, he defects. But wait—my action doesn't *cause* his. Regardless of what he does, Defect yields more for me. So I defect."

  In Scenario B, the agents are still reasoning identically. They are still landing on the diagonal. The outcome is perfectly symmetric. Hofstadter's argument dismisses Scenario B by asserting that a superrational agent *cannot* reason via causal dominance once they acknowledge logical correlation. But this is precisely what needs to be proved.

  **The Logical Gap:** Symmetry tells us $Action_1 = Action_2$. It does not tell us *which* action satisfies the equality. To conclude $Action_1 = Action_2 = Cooperate$, one must add the premise: *"When faced with multiple symmetric equilibria, rationality dictates selecting the one with higher joint utility."* This is not a law of logic; it is a tie-breaking rule.

  ## 3. Addressing the "Single Deduction" Objection
  Your friend argues that you are mistakenly viewing this as a choice from a menu (equilibrium selection), whereas for superrational agents, it is a "single deduction" with only one possible output. She claims there is no tie to break because the logic forces a unique solution.

  **The Counter-Argument:**
  Even if there is no "menu" in the agent's phenomenological experience, there is a menu of **valid decision algorithms**.
  1.  **Causal Decision Theory (CDT) Algorithm:** "Maximize utility based on causal consequences of my action." Output: Defect.
  2.  **Evidential/Logical Decision Theory (EDT/TDT) Algorithm:** "Maximize utility based on the news my action provides about the world (including the other agent)." Output: Cooperate.

  Both algorithms are internally consistent. Both algorithms, when run by identical agents, produce symmetric outcomes.
  *   If both run CDT: Outcome is $(D,D)$. Symmetry holds.
  *   If both run TDT: Outcome is $(C,C)$. Symmetry holds.

  For Hofstadter's "single deduction" to work, he must assert that Algorithm 2 is the *only* rational algorithm. But why? Standard game theory defines rationality as instrumental maximization given causal constraints. Hofstadter redefines rationality to include *logical* constraints.
  Therefore, the "single deduction" is only unique *relative to a specific definition of rationality*. To claim the deduction is unique *simpliciter* is to beg the question. The "deduction" contains a hidden variable: the decision rule itself. Selecting the decision rule that leads to cooperation rather than defection is the hidden normative act.

  ## 4. The Kantian Appeal: Morality in Disguise
  Does invoking Kant's Categorical Imperative (CI) close the gap?
  *   **The Argument:** CI demands you act only on maxims you can will as universal law. "Defect" universalized leads to ruin; "Cooperate" universalized leads to prosperity. Thus, a rational (Kantian) agent cooperates.
  *   **The Critique:** Invoking CI admits your point. Kantian rationality is **not** game-theoretic instrumental rationality.
      *   Instrumental Rationality: "How do I get what I want given the world is as it is?"
      *   Kantian Rationality: "What rules ought I to follow regardless of the contingent state of the world?"

  If your friend appeals to Kant to save superrationality, she is conceding that superrationality is not a discovery about *logic* or *self-interest*, but a moral obligation. She is importing a **normative ethical premise** to solve a **positive decision-theoretic problem**.
  This validates your claim that the argument relies on a "fairness or efficiency norm doing the actual work." Kant closes the gap, but only by changing the definition of "rational" from "prudent" to "moral." If the goal is to show that *self-interested* agents should cooperate, Kant is irrelevant. If the goal is to show that *moral* agents should cooperate, superrationality is redundant.

  ## 5. Modern Descendants: TDT and FDT
  Modern formalizations like Timeless Decision Theory (TDT) or Functional Decision Theory (FDT) attempt to rigorize Hofstadter's intuition. They treat the agent's decision as the output of a logical function $f()$. Since the other agent runs $f()$, my decision *is* logically linked to theirs.

  **Do they close the gap?**
  They make the hidden premise **explicit**, but they do not prove it logically necessary.
  *   **CDT Axiom:** My decision is causally independent of the other's.
  *   **FDT Axiom:** My decision is logically correlated with the other's (we instantiate the same function).

  FDT yields cooperation in the PD. CDT yields defection. Both are mathematically consistent systems. The choice between FDT and CDT is not dictated by logic alone; it is a **meta-rational preference** about how to model counterfactuals.
  *   If you believe counterfactuals should respect causal structure, you choose CDT.
  *   If you believe counterfactuals should respect logical structure, you choose FDT.

  Hofstadter presents FDT-style reasoning as if it were the *only* rational way to think. But it is merely *a* rational way to think, contingent on accepting the axiom that "logical correlation counts for expected utility calculation."
  Therefore, even TDT/FDT does not close the gap without importing something "beyond rationality narrowly construed." It imports a specific **ontology of decision** that privileges logical dependence over causal independence. This is a substantive philosophical commitment, not a tautology.

  ## 6. Conclusion: The Principle of Symmetric Optimality
  Your argument stands on firm ground. The inference from "identical reasoning" to "cooperation" is an enthymeme. It relies on the suppressed premise:

  > **The Principle of Symmetric Optimality:** *In a symmetric game between identical reasoners, rationality requires selecting the symmetric outcome that maximizes joint utility, rather than the symmetric outcome that maximizes individual security (minimax) or adheres to causal dominance.*

  Without this principle, "Superrational Defection" is a coherent concept: two agents who recognize their symmetry but decide that, since they cannot causally influence each other, they must secure their dominant strategy, resulting in $(D,D)$. This is tragic, but it is not *logically inconsistent*.

  Your friend's "single deduction" claim fails because it conflates **consistency** with **optimality**. Both $(C,C)$ and $(D,D)$ are consistent with identical reasoning. Only $(C,C)$ is optimal. To move from consistency to optimality requires a norm. Whether you call that norm "Kantian duty," "Pareto efficiency," or "FDT axiomatics," it is not a truth of logic. It is a value judgment about what rationality is *for*.

  Thus, superrationality is not a logical proof that cooperation is mandatory; it is a proposal for a new decision theory that *stipulates* cooperation is mandatory for agents who accept its specific axioms. You were right: the "rationality" is doing less work than the "normativity."
