answer: |-
  The wind whipped across the granite spine, carrying the chill of the higher altitude. Below them, the valley floor was a blur of green and grey, a thousand feet down. Ahead, the trail was severed by a chasm. The far ledge was six feet away. Maybe seven. The rock was slick with morning mist.

  Elias crouched at the edge, coiling his legs. Silas stood back, hands deep in his windbreaker pockets, eyes narrowed.

  "Don't," Silas said. His voice was calm, the tone of a man who had spent decades calibrating spectrometers. "You haven't tested the footing on the landing."

  "I can't test it without jumping, Silas."

  "Then you don't know if it holds. You're forming a belief on insufficient evidence. That's negligence."

  Elias shook out his arms, trying to keep the adrenaline from turning into tremors. "It's a genuine option. It's living—I want to cross. It's momentous—if we stay here, night falls, we freeze. And it's forced—there's no third path. We jump or we freeze."

  "It's wishful thinking with fancier vocabulary," Silas said, stepping closer to the edge but not crouching. "You're William James-ing your way off a cliff. Remember the shipowner? Clifford's man. He convinced himself his emigrant ship was seaworthy. He suppressed his doubts. He sent it out. It sank."

  "I remember," Elias said. "Everyone drowned. Clifford says the shipowner was guilty of their deaths even if the ship *had* made it home safely. Because the crime was in how he formed the belief, not the outcome."

  "Exactly," Silas said. "The shipowner didn't have evidence the ship was sound. He just *needed* it to be sound to collect the insurance and keep his reputation. You need this gap to be jumpable to save your skin. The motivation is identical. If you jump and slip, you're not just dead. You're morally culpable for your own death because you believed without a license."

  Elias took a breath, the cold air biting his lungs. "But there's a difference, Silas. The seaworthiness of the ship was a fact independent of the shipowner's belief. He could have inspected the hull. He chose not to. That's why he's guilty. Negligence of inquiry."

  "And you're choosing not to inquire."

  "I *can't* inquire!" Elias snapped, gesturing at the void. "How do I inspect the air? How do I test my muscle fatigue without expending the energy I need for the leap? In the ship case, the truth was outside the belief. In this case, the truth is *inside* it. If I doubt, my muscles hesitate. If I hesitate, I fall. My belief is a necessary condition of the fact."

  Silas frowned, kicking a loose pebble into the abyss. They watched it fall until it vanished. "So you're claiming this is a self-verifying belief? That believing it makes it true?"

  "It makes it *possible*," Elias corrected. "James isn't saying belief bends gravity. He's saying that in cases where the outcome hangs on your own exertion, confidence is part of the machinery. If I treat this as a hypothesis to be tested only after I have full data, the data never arrives. I stall. I freeze. I die."

  "Fine," Silas said, holding up a finger. "Let's grant you that specific case. A 'self-verifying hypothesis.' But tell me this: where does that stop? If I'm a gambler, can I say my belief that I'll win the hand is 'living and momentous'? Can I say my confidence changes the cards? If I'm a lover, can I say believing she loves me makes it so?"

  "No," Elias said. "Because the cards don't care about you. And she has her own will."

  "But who decides?" Silas pressed, his voice sharpening. "That's my problem with James. These categories—'forced,' 'living,' 'momentous.' They're rubber. 'Living' just means 'I feel it.' 'Momentous' just means 'I care.' You've built a loophole big enough to drive a truck through. You want to believe in God? Call it momentous. You want to believe in a political ideology? Call it forced. You're smuggling a permission slip for intellectual laziness behind one hard case of a guy jumping a ditch."

  Elias stood up straight, abandoning the crouch for a moment. He looked Silas in the eye. "And you, Silas. You've spent thirty years in the lab. You know the rule: *Proportion belief to evidence.* Never believe more than the data licenses."

  "It's the only ethical stance," Silas said.

  "Is it?" Elias asked softly. "What evidence do you have for *that* rule?"

  Silas blinked. "It's... it's the scientific method. It's how we find truth."

  "But is the statement 'one ought to proportion belief to evidence' itself a scientific fact?" Elias stepped toward him. "Can you run an experiment that proves we *should* avoid error at all costs? Or is that a moral commitment? A passional vote?"

  Silas opened his mouth, then closed it. He looked down at his boots. "It's a duty to humanity. If we all believed what we wanted, trust collapses. Science collapses. Ships sink."

  "So it *is* a passional commitment," Elias said. "You believe in evidentialism because you value safety, and truth, and social order. That's your 'passional nature.' Clifford isn't standing on neutral ground. He's standing on a moral preference. He's saying it's better to risk missing the truth than to risk being wrong."

  "Because being wrong has consequences," Silas countered. "The shipowner isn't a metaphor. People die when we lie to ourselves."

  "And people die when we refuse to act because the data isn't complete!" Elias threw his hands out. "Clifford's rule works for the lab. It works for the ship inspection. But it doesn't work for life's emergencies. If I wait for perfect evidence to trust my wife, I lose her. If I wait for perfect evidence to start a business, I starve. If I wait for perfect evidence to jump this gap, we spend the night on this rock."

  "So you admit it's a risk," Silas said. "You're acknowledging that you don't *know*."

  "I'm acknowledging that 'knowing' isn't always available before 'doing.'" Elias crouched again. "James says we have the right to believe ahead of evidence when the option is genuine and the evidence is inherently incomplete. This is that case."

  Silas watched him. The wind howled, sounding like a warning. "If you jump and you miss, Elias... Clifford says you were guilty. James says you were brave. But you're still dead."

  "Maybe," Elias said. He focused on the far ledge. A jagged scar of grey against the sky. "But if I don't jump, I'm definitely stuck. And I'm living in a world where I'm too afraid to trust my own legs. That's a kind of death too."

  "It's not cowardice to respect gravity," Silas said, but his voice had lost some of its steel. He was thinking about the shipowner. He was thinking about the times in the lab when he'd held off signing a report because a peak looked slightly off-center. How many disasters had that caution prevented? How many breakthroughs had it delayed?

  "Silas," Elias said, without looking back. "You told me once that in chromatography, sometimes you have to integrate the peak before the baseline fully resolves. If you wait for perfect separation, you lose the sample."

  Silas smiled, a thin, dry expression. "That's data processing, Elias. Not leaping over death."

  "It's the same principle. Sometimes you have to commit to the interpretation to get the result." Elias rocked forward on the balls of his feet. "I'm not ignoring the evidence. I see the gap. I see the wet rock. The evidence says it's fifty-fifty. Clifford says 'suspend judgment.' But suspension is a choice. It's a vote for 'no.' James says I'm allowed to vote 'yes' if the stake is high enough."

  "And if you're wrong?"

  "Then Clifford was right," Elias said. "And I won't be around to gloat."

  Silas stepped back, giving him room. He felt a tightness in his chest. He wanted to grab Elias's shoulder. He wanted to tell him to wait, to find another way, to rope up. But there was no rope. There was no other way. The evidence *was* thin.

  "If you make it," Silas said, "don't tell me it's because you were right. Tell me it's because you were lucky."

  "If I make it," Elias said, "I'll tell you it's because I didn't let the doubt take the wheel."

  He took three quick steps. The gravel skittered into the void. He launched.

  For a second, he was suspended in the space between the philosophies. The air didn't care about his ethics. Gravity didn't care about his pragmatism. He was just a mass in motion, reaching for a ledge that might hold, might not.

  Silas didn't breathe. He watched the arc. He thought of the shipowner. He thought of the lab. He thought of the mountain climber who checks the knot three times and the gambler who doubles down.

  Elias's hands slapped the granite. His boots scrabbled for purchase. The rock crumbled slightly. Silas flinched.

  Then, a grunt of effort, a scramble of legs, and Elias hauled himself up. He lay flat on his stomach for a moment, chest heaving, then rolled over and sat up. He was safe.

  He looked back across the gap. He raised a hand.

  Silas didn't wave back immediately. He looked at the gap. He looked at the wet rock where Elias had landed. It held. But it might not have.

  "You got lucky," Silas called out, his voice thin in the wind.

  "Maybe," Elias shouted back. "But I didn't freeze."

  Silas turned away from the edge. He had to find a way across. He would have to jump too. He knew the physics hadn't changed. The rock was just as wet. The gap was just as wide.

  But as he backed up to get a running start, he realized his heart was beating faster, not just from fear, but from a sudden, irritating suspicion.

  *Clifford says I must not believe until I have evidence,* Silas thought, crouching down. *But my belief that I can jump is part of the evidence that I will jump.*

  He pushed off the rock. As he flew through the air, he couldn't tell if he was testing a hypothesis or creating one. He landed hard, knees buckling, Elias grabbing his jacket to steady him.

  They sat there for a moment, two old men on a ledge, the chasm between them still open, though they had crossed it.

  "Shipowner still would have checked the hull," Silas said, brushing granite dust from his pants.

  "And James would have asked if he had time," Elias replied.

  Silas looked out over the valley. The sun was breaking through the clouds. "I still think you're reckless."

  "And I still think you're paralyzed."

  "Probably," Silas said. He stood up, checking his footing carefully before taking a step. "Lead on. But check the next ridge. With your eyes, not your faith."

  "Deal," Elias said.

  They walked on, the trail narrowing and widening, each step a small wager, neither sure if they were navigating the world as it was, or as they needed it to be.
