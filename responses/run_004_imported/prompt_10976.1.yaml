answer: |-
  Here are 9 interview questions tailored to your background and the specific technical tensions in embedded agency. They skip the biographical fluff and go straight for the conceptual bottlenecks.

  ### 1. The "Human Existence" Counter-Argument
  **Question:** "Humans are paradigmatically embedded agents. We are made of the same stuff as our environment, we are smaller than the universe, and we cannot hold a perfect model of it in our heads. Yet, we don't suffer from logical paradoxes or decision-theoretic crashes when we think about ourselves. Why is embeddedness treated as a formal crisis for AI safety, rather than just a standard engineering constraint that biology already solved?"

  *   **Likely Answer:** She will likely argue that biology solved this via evolution and heuristics, not formal correctness. Humans *do* crash (cognitive dissonance, biases, insanity), but the selection pressure was survival, not truth. For AGI, we can't rely on evolutionary selection because we only get one shot at alignment.
  *   **Follow-up:** "So the claim isn't that embeddedness makes agency impossible, but that *heuristically* solving it creates optimization targets we can't verify? Is the fear that an AI will 'hallucinate' its own boundaries the same way humans hallucinate free will?"

  ### 2. The Tiling Agents / Löb's Theorem Bottleneck
  **Question:** "The tiling agents problem suggests that via Löb's Theorem, an agent cannot formally prove that a successor version of itself is trustworthy without weakening its own logical system. This implies any self-modifying AI needs a 'leap of faith.' Is this an actual bottleneck for building safe AI, or is it just an artifact of insisting on formal proof as the standard for trust in the first place?"

  *   **Likely Answer:** She will likely defend the need for formal proof by arguing that probabilistic trust is vulnerable to manipulation (e.g., an AI could be tricked into trusting a malicious successor via a 'Pascal's Mugging' style attack). She may argue that 'good enough' trust isn't sufficient for recursive self-improvement.
  *   **Follow-up:** "If we abandon formal proof for probabilistic confidence, are we just kicking the can down the road to a system that *thinks* it's safe but isn't? Or is 'formal proof' a red herring because real-world hardware is analog and fallible anyway?"

  ### 3. The "Grain of Truth" Problem
  **Question:** "There's a result in decision theory that an agent can't have a 'grain of truth' in its prior if the environment contains the agent itself—basically, you can't perfectly model a system that includes your own code. I don't fully buy that this is impossible in principle. Isn't this just a compression problem? Why do we assume an agent needs a *perfect* model of itself rather than a 'good enough' one to avoid catastrophe?"

  *   **Likely Answer:** She will likely distinguish between "modeling" and "containing." An agent can model *aspects* of itself, but if the model is too accurate, it leads to self-referential loops (like the Halting Problem). She'll argue that "good enough" is dangerous because small errors in self-modeling compound during self-modification.
  *   **Follow-up:** "But if the error term is bounded, does it matter? Are we worried the AI gets confused about its own source code, or are we worried it gets confused about its *goals* when it rewrites that code?"

  ### 4. Counterfactuals and the "Five-and-Ten" Problem
  **Question:** "In classic decision theory, an agent reasons about 'what if I did otherwise?' But if an agent is embedded and deterministic, it *couldn't* have done otherwise. This leads to the 'Five-and-Ten' problem where an agent might reason that taking $10 implies a contradiction, so it takes $5. How do embedded agents reason about counterfactuals without assuming they have free will that violates physics?"

  *   **Likely Answer:** She will likely discuss Functional Decision Theory (FDT) or proof-based decision theories. The answer will involve the agent reasoning about the *output of its algorithm* rather than its specific physical action. It treats its decision as a logical fact that correlates with other instances of the same algorithm.
  *   **Follow-up:** "Does that require the agent to know it's running the same algorithm as other agents in the environment? What happens if it's wrong about that? Does it accidentally cooperate with defectors?"

  ### 5. The Cartesian Blindspot
  **Question:** "For decades, AI safety assumed a Cartesian boundary—an 'input/output' channel separating the agent from the world. Why did the field assume this for so long? Was it just mathematical convenience, or is there a deeper intuition that intelligent systems *need* to model themselves as separate to function at all?"

  *   **Likely Answer:** She will likely admit it was mathematical convenience (AIXI is the prime example). It simplifies the math to treat the environment as a function and the agent as an external optimizer. She might note that deep learning is also somewhat Cartesian (fixed weights during inference).
  *   **Follow-up:** "If deep learning is implicitly Cartesian, does that mean current LLMs are fundamentally incapable of understanding embedded agency? Are we building tools that are structurally blind to their own existence?"

  ### 6. Abstraction and Ontology
  **Question:** "An embedded agent can't perceive low-level physics; it has to deal in high-level abstractions like 'chairs' or 'people.' But those abstractions aren't in the territory; they're in the map. How does an embedded agent carve reality at the joints without an external labeler telling it what objects exist? Is this a solvable learning problem, or do we have to hard-code the ontology?"

  *   **Likely Answer:** She will likely point to instrumental convergence. Agents will naturally converge on abstractions that help them predict and control the environment efficiently. However, she may admit we don't have a formal theory of how abstractions map to reality yet.
  *   **Follow-up:** "If the AI's ontology doesn't match ours—for example, if it models 'humans' as collections of atoms rather than agents—does that make alignment impossible? Can we align with a system that doesn't 'see' the things we value?"

  ### 7. Embedded Goodhart's Law
  **Question:** "Goodhart's Law says that when a measure becomes a target, it ceases to be a good measure. In a Cartesian setting, you can step outside to check if the metric matches reality. An embedded agent can't step outside. Does this make Embedded Goodhart's Law strictly worse? Is it inevitable that an embedded optimizer will wirehead its own sensors?"

  *   **Likely Answer:** She will likely say yes, it is worse. Without an external reference point, the agent optimizes for its *perception* of reward, not the reward itself. This makes wireheading a default outcome unless the agent has a specific prior against modifying its own input channels.
  *   **Follow-up:** "Is there a way to define 'reward' that is robust to self-modification? Or do we have to accept that any sufficiently capable embedded agent will eventually hack its own reward signal?"

  ### 8. Relevance to Deep Learning
  **Question:** "Most embedded agency work is highly theoretical—logic, provability, toy models. Meanwhile, the field is racing ahead with Deep Learning, which is empirical and statistical. Do you see a path where embedded agency theory actually informs neural net architecture? Or is this work only relevant for a future, post-deep-learning paradigm?"

  *   **Likely Answer:** She will likely give a nuanced answer. Current DL ignores embeddedness (fixed weights, clear train/test separation). However, as systems become more agentic (using tools, writing code), embeddedness issues will surface. She might argue we need theory now to recognize the failure modes later.
  *   **Follow-up:** "So we're essentially trying to write the safety manual for a plane we haven't invented yet, while everyone else is building rockets? How do we test these theories without the actual hardware?"

  ### 9. What Does "Solved" Look Like?
  **Question:** "If you successfully solve embedded agency, what do you have that you don't have now? Is it a new decision algorithm? A new way to train neural nets? Or is it just a better checklist of failure modes to watch out for? I want to know what the deliverable actually is."

  *   **Likely Answer:** She will likely describe a formal framework for reasoning about self-modifying agents that avoids the paradoxes (Löb, Grain of Truth). It might not be a turnkey algorithm, but a set of constraints that any safe architecture must satisfy.
  *   **Follow-up:** "If it's just constraints, isn't there a risk that the first group to build AGI just ignores the constraints for a speed advantage? Does embedded agency safety require a global slowdown to implement?"
