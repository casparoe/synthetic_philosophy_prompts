prompt: |-
  So I run a tiny podcast out of my apartment, maybe a couple hundred listeners an episode, where I talk to people from the AI safety / rationalist-adjacent world about weird foundational stuff. Next month I've got a guest lined up who works on "embedded agency" - basically the idea that the classic picture of a rational agent (something that sits outside the world, holds a clean model of it, and just picks whatever action maximizes expected utility, like AIXI) is kind of a fantasy, because real agents are stuck inside the environment they're trying to model, made of the same stuff as it, and smaller than it. I've been reading about this on my own for a couple years now (no college background in any of this, I just do IT work for a living) and I finally feel like I get the shape of the problem well enough that I don't want to waste the interview having her just re-explain the basics to me on mic.

  Can you write me 8-10 interview questions for her? I want at least one that really presses on the "map can't contain the territory" point - like, fine, but isn't that true of every finite mind, including human ones, so why does it get treated as a special crisis for AI instead of just a fact everybody already lives with? I want one on the tiling agents / Löb's theorem thing, where supposedly an agent can never fully certify that a successor version of itself is trustworthy without some kind of leap of faith - I want to ask her whether thats an actual bottleneck for building AI you could ever safely hand things off to, or just an artifact of insisting on formal proof as the standard for trust in the first place. And one on the "grain of truth" problem, because I don't fully buy that its impossible in principle for an agent to have a decent model of an environment that happens to contain the agent itself, as opposed to just really hard. For each of those, plus whatever else you come up with, add a short note on the kind of answer she's likely to give and a follow-up that doesn't just let her rest on it. Skip anything like "what drew you to this field" - I want questions that actually bite.
