answer: |-
  This is a fantastic catch. You have essentially stumbled upon the exact historical moment where the term was weaponized, and it turns out your argument with your friend is a secular echo of a 500-year-old theological war.

  Here is the breakdown of why the Church of England called it heresy, how philosophers hijacked the word, and why your skepticism might actually be philosophically deeper than you realized.

  ### 1. The Theological Argument: Why is "Extra" Arrogant?

  To understand Article XIV, you have to understand the Protestant Reformation's core fight with Roman Catholicism regarding **Salvation and Merit.**

  **The Catholic View (as understood by Protestants):**
  In the medieval system, God's commandments were the baseline for salvation. However, some saints were so holy that they didn't just meet the baseline; they exceeded it. They accumulated a "surplus of merit." This surplus went into a "Treasury of Merit" managed by the Church, which could be dispensed to others (via indulgences) to help them get to heaven.

  **The Protestant Rebuttal (Article XIV):**
  The Thirty-Nine Articles reject this entirely. Here is the logic of the "Arrogancy and Impiety" charge:

  *   **The Impiety (Insulting Christ):** Protestant theology rests on *Sola Gratia* (Grace Alone). The belief is that human beings are spiritually bankrupt due to sin and cannot save themselves. Christ's sacrifice was *sufficient* and *complete*. To claim you have done "more than duty" implies that Christ's payment wasn't enough and that you are adding to the price of salvation. That is the impiety.
  *   **The Arrogancy (Putting God in Debt):** The Article quotes Luke 17:10: *"When ye have done all that is commanded to you, say, We be unprofitable servants."* The argument is that as a creature, you owe your Creator everything. You can never "finish" your duty to God. To claim you have a surplus implies you have paid God everything He is owed and still have change left over. This puts God in your debt. To a Reformer, the idea that a human can put God in their debt is the ultimate arrogance.

  **So, in 1571:** Supererogation = Claiming you earned extra salvation points. **Verdict: Heresy.**

  ### 2. The Philosophical Revival: Repurposing the Word

  Fast forward to 1958. A philosopher named **J.O. Urmson** wrote a famous paper titled *"Saints and Heroes."*

  Urmson noticed a problem in modern ethical systems (specifically Utilitarianism and Kantianism).
  *   **Utilitarianism** says: You must always do the action that produces the most good. If running into a burning building saves a life, you *must* do it. If you don't, you are immoral.
  *   **Kantianism** says: Duty is absolute. There isn't really room for "optional" good deeds; there is only doing your duty or failing it.

  Urmson argued this didn't match our moral intuition. We don't think a person is *immoral* for not donating a kidney to a stranger; we think they are *wonderful* if they do. We need a category for actions that are **good to do, but not wrong to omit.**

  He reached back into the theological trash bin, grabbed the word **Supererogation**, scrubbed off the "Salvation Merit" paint, and repurposed it for **Deontic Logic** (the logic of obligation).

  *   **Theological Supererogation:** Doing more than God requires to earn *extra salvation*.
  *   **Philosophical Supererogation:** Doing more than morality requires to earn *moral praise*.

  So, yes, the word was explicitly repurposed. Urmson took a term that meant "heretical surplus merit" and turned it into "praiseworthy optionality."

  ### 3. Does the Old Theological Worry Show Up in Disguise?

  This is the most interesting part. You mentioned you "weren't totally sold" on your friend's case. It turns out, your skepticism aligns with a major debate in modern ethics. The Protestant worry about supererogation *did* come back, disguised as secular problems.

  Here are two ways the "Arrogance and Impiety" worry survives in modern philosophy:

  **A. The "Maximizing" Objection (The Impiety Parallel)**
  Utilitarians (like Peter Singer) argue that supererogation is a myth. Their argument sounds a lot like the Protestant one: *You can never do enough.*
  If a child is drowning, and you can save them by ruining your shoes, you are *obligated* to do it. If you can save a life by donating a kidney, why isn't that a duty?
  To a strict Utilitarian, claiming an action is "supererogatory" (optional) is just a way of letting ourselves off the hook. It implies the moral demand has a limit. Just as the Reformers said, "You can never finish your duty to God," Utilitarians say, "You can never finish your duty to reduce suffering." Claiming you've done "enough" is morally suspicious.

  **B. The "Moral Self-Indulgence" Objection (The Arrogance Parallel)**
  Some virtue ethicists worry that focusing on "heroic" supererogatory acts makes people arrogant.
  If I view myself as a potential "saint" who does "above and beyond," I might neglect the boring, basic duties of justice and kindness in my daily life. I might skip helping my neighbor (duty) because I'm saving up my energy to donate a kidney (supererogation) so I can get the "special category of moral praise" your friend mentioned.
  In this view, seeking the category of the "supererogatory" is a form of moral vanity. It focuses on *my* excellence rather than *the need* of the other.

  ### Summary

  Your friend is arguing for the **Urmson/Modern View**: We need a category for heroic acts so we don't make morality too demanding, and so we can recognize special virtue.

  You were instinctively leaning toward the **Reformation/Utilitarian View**: Morality is demanding. Claiming there is a "beyond" might just be a way to justify doing the bare minimum, or it misunderstands the infinite nature of moral obligation.

  **The Verdict:**
  The word was definitely repurposed. The Church of England banned it because it threatened **Grace** (you can't earn salvation). Philosophers revived it because it threatened **Psychological Realism** (morality shouldn't demand sainthood from everyone).

  But the structural tension is identical: **Is there a limit to what we owe each other?**
  *   If you say **Yes**, you need supererogation (Your friend).
  *   If you say **No**, supererogation is a dangerous illusion (You and the Reformers).

  You weren't just arguing semantics; you were arguing about whether morality has a ceiling.
