answer: |-
  The reception hall hummed with the clatter of cutlery and the low roar of unrelated conversations. Renata was reaching for a refill when Tomas stepped into her periphery, holding a glass of wine he wasn't drinking. He was looking up.

  "Still there," Tomas said, nodding toward the ceiling. "The original illustration. You can't tell me you look at those triangular curves and don't hear Gould laughing."

  Renata followed his gaze. The dome rested on four arches, the spaces between filled with painted evangelists. "Those are pendentives, Tomas. Gould knew they were pendentives. He just liked the rhythm of 'spandrel' better. It's why architects roll their eyes when biologists talk about architecture."

  "Semantics," Tomas said, finally looking at her. "The structural point holds. They are necessary byproducts of putting a dome on a square base. The architect didn't select them for the sake of the frescoes. The frescoes were coerced into the available space. Yet you spend your career assuming the fresco is the reason the wall exists."

  "I spend my career assuming that if a trait is ubiquitous and costly, there's a reason it hasn't been selected away," Renata countered, her voice level. "You treat adaptationism like a belief system. It's not. It's a heuristic. Dennett nailed this twenty years ago. If you assume selection isn't the primary sculptor, you're left with noise. And you can't build a predictive model on noise."

  "You build a model on a null hypothesis," Tomas shot back. "The default position should be constraint or drift. Adaptation is the special claim. It requires evidence. You reverse the burden of proof. You see a chin, you invent a story about speech mechanics or chewing leverage, and you demand I prove there *wasn't* selection. Why isn't the chin just a developmental consequence of how mandibles fuse?"

  "Because 'developmental consequence' is where inquiry goes to die," Renata said, turning fully toward him. "It's a stopper. If I say 'it's a spandrel,' I stop looking. If I say 'it's an adaptation,' I start testing. Even if I'm wrong, the testing reveals the constraint. Your way just lets us shrug and say 'physics happened.'"

  "My way prevents us from writing grant proposals for mechanisms that don't exist," Tomas said, the air tightening between them. "I read your 2004 NSF submission, Renata. The one on bipedalism energetics. You were modeling selective pressure for heat dissipation on a trait that likely locked in due to pelvic restructuring before the savannahs even opened. You were writing just-so stories with calculus."

  Renata's grip on her champagne flute tightened. "And that grant got funded. Because it generated data. Your alternative was to model nothing because 'constraints are hard to quantify.' Science isn't philosophy, Tomas. It's output."

  "Output isn't truth."

  "It's the only truth we can touch." She stepped closer, lowering her voice. "You think you're the only one who reads the literature? I know about the exaptations. I know about the drift. But selection is the only non-random force we have. If you ignore the only engine that builds complexity, you aren't being rigorous. You're being nihilistic."

  "I'm being honest about the burden of proof," Tomas insisted, though he glanced away, toward the dancing crowd. "You want to assume function for everything. It's... optimistic. Arrogant. Like you think nature is designing for us to understand."

  "I think nature is solving problems," Renata said. "And I think you're still angry that I showed you how to test them."

  Tomas looked back, a wry, tired smile touching his lips. "I'm angry that you convinced the committee that a story sounds better than a mechanism. You looked at those pendentives up there and saw a canvas. I look at them and see the weight of the dome."

  "And yet," Renata said, lifting her glass slightly toward the ceiling, "nobody looks at the arches. They look at the paintings. Function wins, Tomas. It always wins."

  "Until the structure collapses," he murmured.

  They stood in silence for a moment, the music swelling around them, two old colleagues measuring the distance between a cause and a reason.
