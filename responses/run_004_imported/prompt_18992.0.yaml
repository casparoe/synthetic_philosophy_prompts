  Hi, I'm outlining a novel and could use some help with a scene. Two of my POV characters, Renata and Tomas, did their PhDs in the same evolutionary biology lab something like twenty years ago and have barely spoken since a falling out over, of all things, a grant proposal. Renata went on to become a very successful, very confident adaptationist -- the type who'll tell you the shape of the human chin or a particular birdsong syllable almost certainly has a specific selective story behind it if you look hard enough. Tomas had a bit of a conversion experience reading Gould and Lewontin as a postdoc and has been the department's resident heretic ever since, always going on about spandrels, developmental constraints, exaptation, all of it. In the scene I'm working on they end up standing next to each other at a colleagues wedding reception, held in an old domed hall with actual painted spandrels (or pendentives -- I'm honestly not sure which term is technically correct there, and I gather there's a whole pedantic side-argument about that too) up in the ceiling, which Tomas of course can't resist pointing out, and that's what sets the two of them off again.

  Could you write me that scene as a dialogue? I want it to feel like real intellectual combat between two people who've each been chewing on this for two decades, not a strawman getting lectured by the author's favorite. So Renata needs an actual comeback to the Panglossian-paradigm accusation -- something like the point I vaguely recall Dennett making, that Gould was really attacking a hyper-adaptationism that nobody serious actually holds -- rather than just getting flustered, and Tomas has to do more than throw around "just-so story" as an insult; he should be pushing specific alternative mechanisms and saying where he thinks the burden of proof actually sits. As it goes on I'd like them to keep responding to each other's actual last point instead of both just re-running their opening monologue, and by the end maybe let a little of the old grant-proposal grudge leak through the argument without it taking over from the ideas. Something like 700-1000 words would be perfect.
