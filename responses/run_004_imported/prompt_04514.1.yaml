      *   **Argument 2: The 1951 Gibbs Lecture (Mathematical/Philosophy of Mind)**
          *   *Premise:* Incompleteness Theorems.
          *   *Disjunction:* (A) The human mind infinitely surpasses any finite machine (is not equivalent to a Turing machine), OR (B) There exist absolutely undecidable Diophantine problems.
