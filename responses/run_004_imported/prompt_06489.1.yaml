answer: |-
  You are absolutely right to feel that Priya's defense is insufficient, and your intuition that this is a recognized dynamic in social science and game theory is correct. Priya is relying on a definition of "freedom" that is technically true in a narrow sense (negative liberty) but misleading in a structural sense (distributive justice and bargaining power).

  Here is the breakdown of the concepts you are looking for, why Priya's argument fails structurally, and how to renegotiate an implicit norm.

  ### 1. Naming the Dynamic

  There isn't one single word for this, but there are three overlapping frameworks that describe exactly what is happening in your kitchen.

  **A. The War of Attrition (Game Theory)**
  Your kitchen arrangement is a classic *War of Attrition*. In this game, two parties compete for a resource (a clean kitchen) by persisting in a state of discomfort. The "winner" is the person who can endure the mess the longest; the "loser" is the one who cracks first and pays the cost (cleaning) to resolve the discomfort.
  *   **The Flaw in Symmetry:** Priya claims the choices are symmetric. In a War of Attrition, they are not. The cost of "staying in the game" (living with mess) is subjective. If your psychological cost of a dirty kitchen is high and hers is low, you are playing the game with a handicap. Her "freedom" to wait is purchased by your "unfreedom" to endure.

  **B. The Principle of Least Interest (Sociology)**
  Formulated by sociologist Willard Waller, this principle states that **the person who is less interested in maintaining the relationship (or the condition) has more power.**
  *   Priya has discovered that she holds the power because she cares less about the cleanliness than you do. By adjusting her threshold (an *adaptive preference*), she has maximized her leverage. She is effectively dictating the standard of living for the house because she is willing to tolerate a lower standard than you are. This is not a "free choice"; it is an exercise of bargaining power derived from asymmetric preferences.

  **C. Structural Coercion (Political Philosophy)**
  Priya argues that because she never *ordered* you to clean, there is no coercion. This ignores *structural coercion*.
  *   Structural coercion occurs when the circumstances constrain your options so severely that you have no reasonable alternative but to comply, even without a coercer.
  *   If the only way for you to have a kitchen you can psychologically tolerate is to clean it, you are being coerced by the *situation* that Priya is maintaining. She is not forcing you to clean; she is forcing you to *choose between cleaning or suffering*. That is a coercive structure, even if the agent is passive.

  ### 2. Why Priya's "Free Choice" Defense Fails

  Priya is conflating **procedural fairness** with **distributive fairness**.

  *   **Procedural Fairness:** "No one forced you." (Priya's argument). Yes, procedurally, you are free.
  *   **Distributive Fairness:** "Who bears the burden?" (Your intuition). The current system systematically distributes the burden of labor to the person with the higher sensitivity.

  This creates a **penalty for conscientiousness**. In any collective system, if the allocation of labor is based on "who notices/cares first," you incentivize everyone to lower their standards and become willfully blind. The person who cares the most becomes the de facto servant of the group.

  Furthermore, Priya admits her threshold has *adjusted*. In economics, this is **strategic adaptation**. She isn't just "being herself"; she is optimizing her behavior to minimize her labor based on your predictable response. That makes her a free-rider on your conscientiousness.

  ### 3. How to Renegotiate an Implicit Rule

  Renegotiating a norm that "nobody made" is tricky because people defend the status quo as "just how things are." You need to move the conversation from *personal preferences* (you vs. her) to *system design* (the house vs. the problem).

  **Step 1: Name the Game (The Meta-Conversation)**
  Do not frame this as "You make me clean." Frame it as "Our current system is flawed."
  *   *Script:* "I've been thinking about our kitchen dynamic. Right now, we have a 'War of Attrition' system where whoever cares the most ends up doing the work. That penalizes the person who cares about cleanliness and rewards the person who doesn't. That's not sustainable for me, and it's not actually fair to you either, because it relies on you ignoring mess you might otherwise care about."
  *   *Goal:* Shift the enemy from Priya to the *System*.

  **Step 2: Decouple Sensitivity from Labor**
  The core unfairness is that *noticing* the mess is linked to *fixing* the mess. You need to break that link.
  *   **Option A: The Rota (The Nuclear Option).** Propose a chore wheel. It feels bureaucratic, but it solves the attrition problem. If it's your week, you clean regardless of threshold. If it's her week, she cleans regardless of threshold.
  *   **Option B: "Clean Your Own Trace" + Weekly Reset.** Everyone is responsible for the mess they make immediately (dishes after eating), and one person does a "reset" on a rotation. This prevents the pile-up that triggers the attrition game.
  *   **Option C: The "Good Enough" Standard.** Agree on an objective standard (e.g., "no dishes in the sink overnight"). If the standard is violated, the person who violated it fixes it. If it's unclear who violated it, the next person to use the kitchen fixes it. This removes the "who cares first" element.

  **Step 3: Introduce a Cost to the "Least Interest"**
  If Priya refuses to change the system because she benefits from it, you must change your own strategy to alter the bargaining power.
  *   **The Strike:** You stop cleaning when the kitchen reaches *her* threshold, not yours. You let the kitchen become intolerable to *both* of you. This is risky and unpleasant, but it proves that the current equilibrium relies on your subsidy.
  *   **The Buyout:** If the house budget allows, propose hiring a cleaner. This monetizes the difference in thresholds. If she values her time more than money, and you value cleanliness more than money, this solves the friction.

  ### Summary
  Priya is wrong. Her defense relies on a libertarian definition of freedom that ignores power dynamics. You are in a **War of Attrition** where she holds the advantage due to the **Principle of Least Interest**. The system creates **Structural Coercion** that forces you to labor to avoid discomfort she is content to inhabit.

  You have a legitimate fairness complaint. The solution is to stop treating the kitchen norm as a natural phenomenon and start treating it as a policy that needs to be rewritten to protect the conscientious members of the house from exploitation.
