          *   Scope: Infinite potential observations (Science) vs. Fixed test distribution (ML).
          *   The Nature of "Theory": Causal mechanism (Science) vs. Function approximator (ML).
      *   **The "Auxiliary Hypothesis" Question:** What counts as an auxiliary in ML? (Architecture, optimizer, regularization).
      *   **The "Quinean Move" Verdict:** This is the crux. Does saving a model by blaming hyperparams count?
