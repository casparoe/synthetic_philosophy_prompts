          *   *Verdict:* Priyanka scores a technical point. She correctly identifies the stage.

      *   *Move 3 (Devon):* External exams force the timeline, killing Generalization.
          *   *Analysis:* This is Whitehead's *actual* bugbear. He explicitly attacks external examinations in *The Aims of Education*. He argues they distort the natural rhythm.
