  8.  *(Self-Correction during drafting)*: I should verify if there are specific domains where they coincide. They coincide on symmetric problems where the ideal point lies on the Pareto frontier, but generally, they diverge. I should mention that they often yield different outcomes. I should also make sure not to confuse "Individual Monotonicity" with "Strong Monotonicity" or others, but stick to the standard KS axiom.

