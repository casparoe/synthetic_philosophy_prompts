prompt: |-
  I'm a PhD student working on formal epistemology and decision theory, and for a graduate seminar on the foundations of rational choice I've been trying to construct the strongest possible version of a position that my advisor, a committed expected-utility theorist, is quick to dismiss as a category error. The textbook line, going back to Samuelson's long-running dispute with defenders of the Kelly criterion (the rule, originating in John Kelly's 1956 work on gambling with side information and later popularized by Ed Thorp, of betting so as to maximize the expected logarithm of one's wealth each round), is that this rule counts as rational only for an agent who happens to have logarithmic utility for wealth. For anyone with a different utility function, following Kelly means over- or under-betting relative to whatever actually maximizes their expected utility; growth-rate maximization is thus just one preference among many, and the well-known theorem that Kelly bettors almost surely end up wealthier than any fixed-alternative bettor after sufficiently many rounds gets waved away as an artifact of a limit that no finitely-lived agent ever reaches.

  The position I'd like you to defend is the opposing one: a cluster of views sometimes gathered, loosely and by more than one author, under the label "geometric rationality," and closely associated with the "ergodicity economics" of the physicist Ole Peters and his collaborators. On this view, Samuelson's framing already smuggles in the wrong comparison class: it evaluates a bet by an ensemble average across an imagined population of parallel agents, when the only average that a single agent repeatedly betting on a multiplicative process will ever actually live through is the time average of their own trajectory—and for multiplicative dynamics, that time average converges, by an ordinary law-of-large-numbers argument applied in log-space, to the expected logarithm of the per-round return. On this reading, maximizing expected log-wealth is not a contingent fact about anyone's risk aversion at all; it is simply what falls out of correctly identifying which statistic describes what happens to a persisting individual, and it would hold even for an agent with linear, risk-neutral utility. (The bite of this is easiest to see with a toy case: a bet that multiplies your wealth by 1.5 with probability one-half and by 0.6 with probability one-half has a strictly positive expected per-round return, and yet, repeated indefinitely, drives almost every individual trajectory to ruin.)

  Please argue for the geometric-rationality side as rigorously as you can, and in doing so address three things specifically: first, why the charge that "the Kelly criterion is just log utility in disguise" already presupposes exactly what is at issue—namely, that any reason to privilege a particular growth rate must come from an agent's preferences rather than from the dynamics of the process itself; second, why relegating the almost-sure long-run dominance of Kelly betting to a "merely asymptotic" curiosity fails to rescue Samuelson's position, rather than simply restating the underlying disagreement about which average matters; and third, the worry—which I suspect is the hardest one for your side—that treating one's own realized trajectory as privileged over a counterfactual ensemble of copies is itself a substantive value judgment, no less contestable than the utility functions the ergodicity view claims to dispense with.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in formal epistemology/decision theory.
      *   **Task:** Construct the strongest possible version of the "geometric rationality" / "ergodicity economics" position (associated with Ole Peters) against the standard expected utility theory (EUT) critique (associated with Samuelson).
      *   **Context:** Graduate seminar on foundations of rational choice. The user's advisor dismisses this as a "category error."
      *   **Core Claim to Defend:** Maximizing expected log-wealth (Kelly criterion) is not about risk preferences (log utility) but about the physical/mathematical dynamics of multiplicative processes over time (time averages vs. ensemble averages). It applies even to risk-neutral agents.
      *   **Three Specific Points to Address:**
          1.  Why the "Kelly = Log Utility" charge begs the question (presupposes ensemble averaging).
          2.  Why the "asymptotic/long-run" dismissal fails (it's not just a limit, it's about the typical trajectory).
          3.  Address the counter-worry: Is privileging the time average itself a substantive value judgment (just like choosing a utility function)?

  2.  **Deconstruct the Core Debate:**
      *   *Standard EUT (Samuelson):* Rationality is defined by consistency of preferences (axioms like von Neumann-Morgenstern). Outcomes are evaluated by expectation over a probability space (ensemble average). Risk aversion is encoded in the curvature of the utility function $U(w)$. If $U(w) = w$, you maximize expected wealth. If Kelly differs from this, Kelly is suboptimal unless $U(w) = \ln(w)$.
      *   *Ergodicity/Geometric Rationality (Peters, et al.):* Economics often deals with non-ergodic processes (time average $\neq$ ensemble average). In multiplicative wealth dynamics, the ensemble average (expected wealth) grows exponentially, but the typical individual trajectory (time average) decays exponentially. Rationality should be about optimizing what *actually happens* to the agent over time, not what happens on average across parallel universes. This leads naturally to the geometric mean (log utility) without invoking subjective risk aversion.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the dominance of EUT but frame the ergodicity challenge as a correction to the *modeling of the world*, not just a tweak to preferences. Use precise terminology (ergodicity, ensemble vs. time average).

      *   **Point 1: The Category Error (Kelly = Log Utility?):**
          *   *Argument:* Samuelson assumes the object of maximization is $E[U(W)]$. The ergodicity view says the object of maximization is the *growth rate* of wealth over time.
          *   *Mechanism:* In multiplicative processes, $W_t = W_0 \prod R_i$. The relevant metric is $\lim_{T\to\infty} \frac{1}{T} \ln(W_T/W_0)$. By the Law of Large Numbers, this converges to $E[\ln(R)]$.
          *   *The "Begging the Question":* To say "Kelly is just log utility" assumes we *should* be maximizing arithmetic expected wealth ($E[W]$) and that deviating from it requires a utility explanation. But if the process is non-ergodic, $E[W]$ is physically irrelevant to the single agent. The "log" comes from the math of compounding, not the psychology of risk.
          *   *Key Distinction:* Preferences vs. Dynamics.

      *   **Point 2: The "Asymptotic" Dismissal:**
          *   *Argument:* Samuelson says "we don't live forever."
          *   *Counter:* It's not about infinity; it's about the *typicality* of the trajectory. In non-ergodic systems, the ensemble average is dominated by extremely rare, extremely wealthy outcomes (fat tails). The "average" agent does *not* experience the ensemble average.
          *   *Example:* The 1.5/0.6 bet. $E[R] = 1.05$ (positive). Geometric mean = $\sqrt{1.5 \times 0.6} = \sqrt{0.9} < 1$ (negative growth).
          *   *Relevance:* Even in finite time, the distribution of wealth becomes highly skewed. The *median* wealth follows the geometric growth. Optimizing the ensemble mean optimizes for a vanishingly small fraction of outcomes. For a single agent, the time-average growth rate is the only observable statistic that stabilizes.
          *   *Philosophical punch:* Dismissing the limit dismisses the law of large numbers itself, which is the basis of all probabilistic prediction.

      *   **Point 3: The "Privileging Time" Objection (The Hardest One):**
          *   *The Worry:* Why is the time average "rational"? Isn't choosing to care about *my* trajectory over the *ensemble* a value judgment (selfishness? survival?)?
          *   *Defense:* It's not a value judgment; it's an ontological claim about existence. Parallel universes don't exist (arguably). Only one timeline is experienced.
          *   *Nuance:* Acknowledge that *some* normativity remains. We assume the agent wants to *persist*. If the goal is to maximize wealth transferred to a multiverse heir, maybe ensemble matters. But for standard decision theory (an agent acting in time), the time average is the only empirically accessible quantity.
          *   *Refinement:* It shifts the normativity from "risk preference" to "model correctness." If your model assumes ergodicity where there is none, you are making a factual error, not a preference statement.

      *   **Conclusion:** Summarize. The ergodicity view reframes rationality as alignment with physical dynamics rather than internal consistency of preferences.

  4.  **Review and Refine (Self-Correction during drafting):**
      *   *Tone Check:* Needs to be rigorous, academic, but persuasive. Avoid sounding like a pop-sci summary of Peters. Use formal epistemology language (ontology, normativity, axioms).
      *   *Technical Accuracy:* Ensure the distinction between additive and multiplicative processes is clear. Ensure the distinction between $E[W]$ and $E[\ln W]$ is tied to ensemble vs. time.
      *   *Addressing the Advisor:* The prompt mentions the advisor calls it a "category error." I need to turn this around. The ergodicity claim is that *EUT* is committing the category error by treating time as an ensemble.
      *   *Point 3 Difficulty:* This is the weakest link in the ergodicity argument usually. I need to be careful not to overclaim. It *is* a normative commitment to care about one's own survival/trajectory. But the argument is that this is a *precondition* for agency, not a variable preference.

  5.  **Final Polish:** Check against the three specific constraints in the prompt.
      1.  Kelly = Log Utility charge begs the question? Yes, address the presupposition of ensemble averaging.
      2.  Asymptotic dismissal? Yes, address typicality and skew.
      3.  Privileging trajectory as value judgment? Yes, address ontology of time vs. preference.

  6.  (Mental Outline of the Response)
      *   **Title:** Something academic. "The Ergodic Hypothesis as a Foundation for Rational Choice."
      *   **Intro:** Define the clash. EUT (axiomatic) vs. Ergodicity (dynamic).
      *   **Section 1: The Category Error Reversed.** Why "log utility" is a misdiagnosis. The math of compounding forces the log.
      *   **Section 2: The Finite-Time Defense.** It's not about infinity; it's about the divergence of mean and median. The "ruin" problem.
      *   **Section 3: Ontology vs. Axiology.** Is time-privilege a value? Argue it's a condition of existence.
      *   **Conclusion:** Rationality as ecological fit.

  7.  *Final thought on the "Value Judgment" point:* I need to concede that choosing to maximize growth *is* a goal. But the claim is that *given* the goal of maintaining/preserving wealth over time, the *method* is dictated by dynamics, not utility. The "value" is persistence; the "rationality" is the geometric mean. I must distinguish between the *end* (persistence) and the *means* (Kelly). EUT conflates the two by putting the means (log) into the end (utility).

  8.  *Let's write.* (Proceeding to generate response based on these thoughts.)
answer: |-
  **Title:** The Ergodic Hypothesis as a Foundation for Rational Choice: A Defense of Geometric Rationality

  **Abstract:** The standard expected-utility theoretic (EUT) critique of the Kelly criterion rests on the assumption that rational choice is defined by the maximization of an expectation over a probability space of counterfactual outcomes (an ensemble average). The ergodicity economics framework, associated with Ole Peters and others, challenges this by arguing that for non-ergodic processes—specifically multiplicative wealth dynamics—the ensemble average is physically inaccessible to a single agent. This paper reconstructs the strongest version of the "geometric rationality" position, arguing that maximizing the expected logarithm of wealth is not an expression of risk-averse preferences but a requirement of dynamic consistency in time. We address three specific objections: the charge of disguised utility functions, the relevance of asymptotic limits, and the normativity of privileging the time average.

  ---

  ### Introduction: The Category Error Reversed

  The standard textbook dismissal of the Kelly criterion, following Samuelson (1979), posits that maximizing the geometric growth rate of wealth is rational *if and only if* an agent possesses a logarithmic utility function over wealth. On this view, the "log" in the Kelly criterion is a psychological parameter—a measure of risk aversion—inserted into the utility function $U(w) = \ln(w)$. For an agent with linear utility ($U(w) = w$), following Kelly is deemed irrational because it sacrifices expected arithmetic return for growth security.

  The geometric rationality position reverses this accusation of irrationality. It argues that Samuelson's framing commits a category error by treating time as an ensemble. In standard EUT, the expectation operator $E[\cdot]$ averages over parallel possible worlds at a fixed time $t$. However, a single agent does not experience parallel worlds; they experience a single trajectory through time. When wealth dynamics are multiplicative, the process is non-ergodic: the time average of growth does not equal the ensemble average. Consequently, the "log" in the Kelly criterion arises not from the curvature of a utility function, but from the mathematics of compounding applied to a time series. To defend this position is to argue that rationality is not merely internal consistency of preferences, but alignment with the physical dynamics of the environment in which the agent is embedded.

  ### 1. Against the "Disguised Utility" Charge

  The charge that "Kelly is just log utility in disguise" begs the question by presupposing that the *only* legitimate reason to deviate from maximizing arithmetic expected wealth ($E[W]$) is a subjective preference for certainty. This presupposition holds only if the arithmetic mean is the correct statistic for predicting the future state of a single agent.

  Consider a multiplicative process where wealth $W_t$ evolves as $W_{t+1} = W_t \cdot R_t$, where $R_t$ is a stochastic return factor. The wealth after $T$ periods is:
  $$ W_T = W_0 \prod_{t=1}^T R_t $$
  To find the average growth rate per period experienced by the agent, we examine the time average:
  $$ \bar{g} = \lim_{T \to \infty} \frac{1}{T} \ln\left(\frac{W_T}{W_0}\right) = \lim_{T \to \infty} \frac{1}{T} \sum_{t=1}^T \ln(R_t) $$
  By the Law of Large Numbers, this converges almost surely to the expectation of the logarithm: $E[\ln(R)]$.

  The Samuelsonian objection assumes that the agent *should* be maximizing $E[W_T]$, which corresponds to the arithmetic mean of returns. However, $E[W_T]$ is an ensemble average. It describes the average wealth of a population of parallel agents at time $T$. In multiplicative dynamics with variance, the ensemble average is dominated by vanishingly rare trajectories where the agent gets "lucky" repeatedly. The typical trajectory (the mode or median) follows the geometric mean.

  Therefore, to claim Kelly is "just log utility" is to assert that an agent *ought* to optimize for the ensemble average despite living in a single timeline. It treats a factual claim about the dynamics of compounding (that time averages converge to geometric means) as a preference claim. The geometric rationality view holds that if an agent wishes to maximize the wealth they actually *have* at time $T$ (not the wealth their parallel counterparts have), they must maximize the time-average growth rate. This necessitates maximizing $E[\ln(R)]$ regardless of their "risk preference." The log is a property of the *process*, not the *agent*. To insist otherwise is to demand that the agent optimize for a statistic (the ensemble mean) that is empirically inaccessible to them.

  ### 2. The "Merely Asymptotic" Objection

  A common defense of EUT is to concede that Kelly bettors dominate in the infinite limit but to dismiss this as irrelevant for finitely-lived agents. Samuelson argued that no agent lives forever, so the convergence of the time average to the expected log-return is a mathematical curiosity without normative bite.

  This objection fails for two reasons: one statistical, one structural.

  **Statistically**, the divergence between the ensemble average and the time average is not a phenomenon that only appears at infinity; it is a function of variance that compounds immediately. In the toy case provided (wealth $\times 1.5$ or $\times 0.6$ with $p=0.5$), the arithmetic expected return is $+5\%$ per round. However, the geometric return is $\sqrt{1.5 \times 0.6} - 1 \approx -5.5\%$. After just 10 rounds, the ensemble expected wealth is $W_0 \cdot (1.05)^{10} \approx 1.63 W_0$, but the *median* wealth (the outcome of the typical agent) is $W_0 \cdot (0.945)^{10} \approx 0.57 W_0$. The distribution of wealth becomes so skewed that the "average" outcome is richer than 99% of the actual outcomes. Dismissing the limit dismisses the skewness that exists at every finite step. For a finite agent, optimizing the ensemble mean is optimizing for an outcome that is probabilistically vanishingly small.

  **Structurally**, the "finite life" objection misunderstands the role of the limit in decision theory. EUT itself relies on limit theorems (like the Law of Large Numbers) to justify why agents should care about expectations. If an agent faces a bet once, expected value is a weak guide. It is only because we assume agents face repeated decisions (or similar probabilistic structures) that expectation maximization gains normative force. The ergodicity argument simply applies this logic consistently: if repetition justifies using expectations, we must use the expectation that corresponds to the repetition the agent actually experiences (time repetition), not the repetition they hypothetically experience across parallel universes (ensemble repetition). To accept the normative force of expectation for additive risks but deny it for multiplicative time-averages is inconsistent.

  ### 3. The Normativity of the Time Average

  The most formidable objection to geometric rationality is the claim that privileging one's own realized trajectory over the counterfactual ensemble is itself a substantive value judgment. Why, the critic asks, is the time average "rational"? Is it not merely a preference for *survival* or *self-interest* over *collective ensemble wealth*? If an agent cares about the total wealth of all their "copies" (e.g., in a many-worlds interpretation or a large population of heirs), the ensemble average might be the correct metric. Thus, choosing the time average seems to smuggle in a utility function after all—one that values persistence in a single timeline.

  This objection conflates *ontology* with *axiology*.

  **Ontological Priority:** The argument for geometric rationality is not primarily that agents *value* their timeline more than others; it is that only one timeline *exists* for the agent to value. Standard decision theory treats the probability space as a set of mutually exclusive possibilities, only one of which will be realized. The ensemble average treats these possibilities as if they are all simultaneously real (in the averaging sense). For a single agent, the counterfactual branches where they became astronomically wealthy do not subsidize the branch where they went bankrupt. To optimize for the ensemble average is to optimize for a fiction—the "average agent" who does not exist.

  **The Precondition of Agency:** While it is true that one must *want* to persist to care about the time average, this is not a contingent preference like "liking chocolate." It is a precondition for agency. An agent who goes bankrupt (wealth $\to 0$) exits the decision problem entirely. In multiplicative dynamics, ruin is absorbing. Maximizing the ensemble average often entails a non-zero probability of ruin (as in the 1.5/0.6 bet repeated fully). Maximizing the time average (via fractional Kelly) minimizes the probability of ruin while maximizing growth. Therefore, the preference for the time average is derived from the constraint of *continuing existence*. It is instrumental rationality: if you have *any* goals that extend beyond the current moment, you must remain in the game. The dynamics of the game dictate that staying in the game requires respecting the geometric mean.

  **Concession and Refinement:** We must concede that if an agent's utility function is explicitly defined over the welfare of a *population* of independent agents (e.g., a philanthropist distributing funds to unconnected recipients), the ensemble average may be appropriate. However, for the standard decision-theoretic subject—a singular entity making sequential choices for themselves—the "value judgment" to privilege the time average is trivial. It is equivalent to saying "I exist in time." To call this a contestable value judgment is to suggest that an agent might rationally choose to optimize for outcomes in worlds they do not inhabit. The ergodicity view does not eliminate normativity; it relocates it. It shifts the burden from "Why are you risk-averse?" to "Why are you modeling your environment as ergodic when it is not?" The latter is a charge of factual error, which is a stronger critique than a charge of preference divergence.

  ### Conclusion

  The geometric rationality position does not merely offer an alternative utility function; it offers a correction to the modeling of decision problems under uncertainty. By demonstrating that multiplicative wealth dynamics are non-ergodic, it shows that the ensemble average (expected wealth) is a misleading metric for a single agent's future. The "log" in the Kelly criterion is revealed as a mathematical necessity of time-averaging compounding returns, not a psychological parameter of risk aversion.

  While the objection that privileging the time average is a value judgment holds superficial plausibility, it collapses under the weight of ontological realism: an agent acts in a single timeline. To optimize for the ensemble is to optimize for a statistical phantom. Thus, the strongest version of this position concludes that expected utility theory, when applied to multiplicative processes without ergodicity adjustments, is not just one style of rationality among many, but a systematic error in mapping probability to physical time. Rational choice, properly understood, requires maximizing the growth rate of the only thing the agent actually possesses: their own trajectory.
