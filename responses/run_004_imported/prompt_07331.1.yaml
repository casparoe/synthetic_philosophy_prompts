      *   *The Conflict:* If $Ch_t(A) = x$, but the occurrence of A (or a sequence involving A) would make the chance of A *not* x (by changing the best system), then conditioning on $Ch_t(A)=x$ rules out those futures. But those futures have non-zero chance. So $C_0(\text{Undermining Future} | Ch_t(A)=x)$ should be 0, but $Ch_t(\text{Undermining Future}) > 0$. Contradiction.
      *   *The Feature of Evidence:* The evidence is the *current chance proposition itself* ($Ch_t(A)=x$). This proposition logically entails the negation of certain future histories (the undermining ones) under Humean Supervenience.
      *   *The Fix:* The New Principle (NP) or Revised PP. Instead of conditioning on $Ch_t(A)=x$, condition on the *history up to t plus the chance function*. Or, more commonly formulated: $C_0(A | T_w) = Ch_t(A)$, where $T_w$ is the theory of chance for world w. Essentially, don't treat the chance proposition as admissible evidence that rules out undermining futures; treat the *theory* connecting history to chance as the expert.
      *   *Refinement:* Lewis's own fix was to restrict admissibility. But the "New Principle" (Hall, Thau, Lewis) is the standard resolution. $C(A | \langle Ch(A)=x \rangle) \approx x$. Wait, let's be precise. The fix is to acknowledge that the proposition "The current chance is x" carries information about the future (it rules out undermining futures). So we shouldn't condition on it directly if we want to match the chance. We should condition on the *history* and the *chance function* separately, or use the NP: $C(A | \mathcal{H}_t \land T) = Ch(A)$.
      *   *Key Insight for Comparison:* The trouble is that the *definition* of the expert (chance) depends on the *total history*, including the future. So knowing the expert's verdict gives you "inadmissible" information about the future.

  3.  **Analyze the Reflection Principle (RP):**
      *   *Definition:* $C_0(A | C_t(A) = x) = x$. (Current credence in A, given that future credence will be x, should be x).
      *   *The Problem:* Rational anticipation of irrationality.
      *   *Mechanism:* I know I will get drunk, or suffer memory loss, or be brainwashed. My future self $C_t$ will be confident in A, but I know now that this confidence is untrustworthy.
      *   *The Conflict:* $C_0(A | C_t(A) = 1) = 1$ (by RP). But if I know I will be brainwashed to believe A falsely, $C_0(A | C_t(A) = 1)$ should be low.
      *   *The Feature of Evidence:* The evidence is the *proposition about future credence* ($C_t(A)=x$). This proposition implies that I have undergone a specific cognitive process (learning, forgetting, manipulation). If that process is known to be distorting, the evidence is "defeating."
      *   *The Fix:* Restrict the principle to cases where the agent expects to be *rational* (or where the updating is purely by conditionalization on new information). Van Fraassen's condition: The change in credence must be due to *learning* (conditionalization), not distortion.
      *   *Refinement:* $C_0(A | C_t(A) = x \land \mathcal{R}) = x$, where $\mathcal{R}$ is the proposition that the update is rational. Or, formulate it as: $C_0(A | C_t(A) = x) = x$ holds only if I believe my future self is an expert *relative to my current information*.

