answer: |-
  David Lewis's **Principal Principle (PP)** and Bas van Fraassen's **Reflection Principle (RP)** are the twin pillars of modern formal epistemology regarding expert deference. Both principles dictate that a rational agent's current credence in a proposition should align with a privileged "expert" quantity: for Lewis, it is objective chance; for van Fraassen, it is the agent's own future credence.

  While both principles capture intuitive norms of rationality, their unrestricted formulations face devastating counterexamples. In both cases, the trouble arises because the proposition reporting the expert's verdict carries "inadmissible" information that undermines the expert's authority. The standard fixes for both principles involve restricting the conditions under which deference is required. Below, I analyze the specific trouble for each, the respective fixes, and whether these fixes represent the same philosophical maneuver.

  ### 1. The Principal Principle and Undermining Futures

  **The Principle:**
  Lewis's Principal Principle states that if an agent knows the current objective chance of a proposition $A$ is $x$, and possesses only "admissible" evidence $E$, their credence in $A$ should be $x$. Formally:
  $$C_0(A \mid Ch_t(A) = x \land E) = x$$

  **The Problem:**
  The counterexample arises from Lewis's own metaphysical view of chance: **Humean Supervenience**. On this view, objective chances are not primitive; they supervene on the total history of categorical particular facts (the "Humean Mosaic"). The chances are determined by the "Best System" of laws that balances simplicity and strength in describing the entire history of the world, past and future.

  This creates the possibility of **undermining futures**. An undermining future is a possible course of events such that, if it were to occur, the Best System for that world would be different, and thus the *current* chance assignment would have been different.
  For example, suppose the current chance of a coin landing heads is 0.5. There might be a possible future sequence of heads so extreme that, if it occurred, the Best System would posit a biased coin (say, chance 0.9). Thus, the proposition $\langle Ch_t(Heads) = 0.5 \rangle$ logically entails the negation of that extreme future sequence.

  **The Feature of the Evidence:**
  The trouble is caused by the **logical content of the chance proposition itself**. Under Humean Supervenience, the proposition $\langle Ch_t(A) = x \rangle$ is not just a report on a propensity; it is a claim about the total history of the world. It entails that certain futures (the undermining ones) will *not* occur. However, according to the chance function itself, those undermining futures have a non-zero probability.
  If you follow the unrestricted PP, you must set your credence in the undermining future to 0 (because it is ruled out by the evidence $\langle Ch_t(A) = x \rangle$), but also to whatever the chance says it is (e.g., 0.01). This is a contradiction. The evidence is "inadmissible" because it gives you information about the future that goes beyond what the chance function itself licenses.

  **The Fix:**
  The standard fix is the **New Principle (NP)**, developed by Lewis, Hall, and Thau. The NP abandons conditioning directly on the chance proposition. Instead, it instructs agents to defer to the chance function conditional on the **history to date ($H_t$)** and the **theory of chance ($T$)**.
  $$C_0(A \mid T \land H_t) = Ch_t(A)$$
  By conditioning on the theory and the past history, rather than the chance value itself, the agent avoids logically ruling out the undermining futures. The chance function is treated as a guide derived from the theory and history, not as a logical constraint on the future that trumps the chance function's own probabilities.

  ### 2. The Reflection Principle and Anticipated Irrationality

  **The Principle:**
  Van Fraassen's Reflection Principle states that an agent's current credence in $A$, conditional on their future credence in $A$ being $x$, should be $x$. Formally:
  $$C_0(A \mid C_t(A) = x) = x$$
  Here, the "expert" is the agent's future self.

  **The Problem:**
  The counterexample involves **rationally anticipated irrationality**. Suppose I know that at time $t$, I will be drugged, brainwashed, or simply suffer from memory loss. I know that under the influence of the drug, I will become certain that I can fly ($C_t(Fly) = 1$).
  If I follow the unrestricted RP, my current credence that I can fly, conditional on my future certainty, must be 1. But intuitively, my current credence should be 0, precisely *because* I know my future self will be irrational.

  **The Feature of the Evidence:**
  The trouble is caused by the **causal implications of the future credence proposition**. The proposition $\langle C_t(A) = x \rangle$ is not merely a number; it implies that a specific cognitive process has occurred between now and $t$. In the problematic cases, the agent possesses current evidence that this process is distorting (e.g., "I will be drugged").
  Conditioning on $\langle C_t(A) = x \rangle$ forces the agent to condition on the fact that the distortion occurred. Since the distortion breaks the link between truth and belief, the future credence ceases to be expert. The evidence is "defeating" because it reveals the expert (the future self) is unreliable in this instance.

  **The Fix:**
  The standard fix is to restrict the principle to cases where the agent believes the change in credence will be **rational**. Van Fraassen specifies that the principle holds only if the agent expects their future credence to result from **conditionalization** on new information, rather than distortion.
  $$C_0(A \mid C_t(A) = x \land \mathcal{R}) = x$$
  Where $\mathcal{R}$ is the proposition that the update from $0$ to $t$ is rational. Alternatively, the principle is framed as holding only for "epistemically possible" future credences—those the agent currently deems trustworthy.

  ### 3. Comparison: Are the Fixes the Same Move?

  At first glance, the problems seem distinct: Lewis's is a metaphysical puzzle about the supervenience basis of chance, while van Fraassen's is an epistemological puzzle about self-knowledge and reliability. However, under closer scrutiny, **the two fixes amount to the same philosophical move.**

  **The Common Move: Screening Off Inadmissible Information**
  Both principles fail because the "Expert Report" (the chance proposition or the future credence proposition) is not epistemically transparent. In both cases, the report carries **defeating information** that is logically or causally tied to the expert's verdict.
  *   In **PP**, the report $\langle Ch = x \rangle$ carries information about the *future history* (ruling out undermining futures).
  *   In **RP**, the report $\langle C_t = x \rangle$ carries information about the *cognitive process* (implying manipulation or forgetting).

  The philosophical move in both fixes is to recognize that **deference is only mandated when the expert's verdict is screened from defeating information.**
  *   Lewis's **New Principle** achieves this by changing the conditioning proposition. Instead of conditioning on the *output* of the chance function (which contains the defeating info), we condition on the *inputs* (History + Theory). This screens off the logical entailment regarding the future.
  *   Van Fraassen's **Restriction** achieves this by adding a conjunct. We condition on the future credence *plus* the assurance of rationality. This screens off the causal implication regarding distortion.

  **Where the Parallel Holds**
  Both fixes reject the idea that the expert's number is self-authenticating. They both assert that the authority of the expert is contingent on the *context* in which that number is produced.
  *   For Chance, the context is the metaphysical determination base (History/Theory).
  *   For Future Credence, the context is the epistemic updating process (Conditionalization).
  In both cases, the fix is to require the agent to condition on a richer description of the situation that guarantees the expert's reliability, rather than the bare expert verdict.

  **Where the Parallel Breaks Down**
  The parallel breaks down slightly in the *nature* of the inadmissibility.
  *   For **Lewis**, the inadmissibility is **logical**. Given Humean Supervenience, $\langle Ch = x \rangle$ *entails* $\neg \text{Undermining Future}$. No amount of empirical investigation can make the chance proposition admissible if the metaphysics is fixed. The fix requires a structural change to the principle (NP).
  *   For **van Fraassen**, the inadmissibility is **contingent/empirical**. It is not a logical truth that $\langle C_t = x \rangle$ implies irrationality; it depends on the specific circumstances (drugs, memory loss). The fix is often viewed as a proviso on the *application* of the principle rather than a reformulation of the principle itself.

  **Conclusion**
  Despite the metaphysical versus epistemic distinction, the fixes are fundamentally the same move: **the restriction of expert deference to cases where the expert's verdict does not convey "inadmissible" evidence about the world or the agent.** Both Lewis and van Fraassen conclude that you cannot blindly defer to a number; you must defer to the number *only insofar as* it reflects the appropriate relation to the truth (Best System for chance, Conditionalization for credence). The "New Principle" and the "Reflection Restriction" are both mechanisms to ensure that the channel of deference remains clean of information that would undermine the expert's authority.
