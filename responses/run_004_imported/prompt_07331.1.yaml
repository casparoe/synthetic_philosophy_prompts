          *   *RP:* Leaks info about the cognitive process (irrationality).
          *   *Fix:* In both cases, we must condition on the expert being *reliable* or the evidence being *admissible*.
          *   *Nuance:* Lewis's fix is often seen as redefining the principle (New Principle). Van Fraassen's is seen as adding a proviso. But functionally, both restrict the domain of application to cases where the expert's verdict doesn't carry "defeating" information.
          *   *Better analysis:* The PP fix acknowledges that the chance proposition *itself* is the problem. The RP fix acknowledges that the *circumstances* of the future credence are the problem.
