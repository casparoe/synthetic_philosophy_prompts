          *   *RP Fix:* We condition on the future credence *plus* the assumption that the update was rational.
          *   *Comparison:* In PP, we stop conditioning on the chance proposition. In RP, we keep conditioning on the future credence proposition but add a conjunct about rationality.
          *   *Is this the same move?* It's the move of "Screening Off." We need to screen off the inadmissible information.
          *   *PP:* The history $H_t$ screens off the undermining future info? No, the Theory $T$ plus $H_t$ determines the chance.
          *   *RP:* The proposition "I am rational" screens off the manipulation info.
          *   *Conclusion:* They are deeply analogous. Both recognize that the "Expert Proposition" is not epistemically neutral. It carries baggage. The fix is to ensure the baggage doesn't defeat the expertise.
          *   *However*, there is a disanalogy. In PP, the "baggage" is logical (given Humean Supervenience). In RP, the baggage is causal/nomological. In PP, *any* agent who accepts Humean Supervenience faces the problem. In RP, only agents who anticipate irrationality face the problem.
          *   *Decision:* I will argue they are structurally identical moves (restricting admissibility/reliability) but grounded in different domains (metaphysics of chance vs. epistemology of self-knowledge). The parallel holds under scrutiny regarding the *logic of deference*, but breaks down regarding the *source* of the failure.
          *   *Wait, one more check:* Lewis's fix is often interpreted as: Chance is an expert *only relative to admissible evidence*. The undermining future makes the chance proposition inadmissible. Van Fraassen's fix: Future self is an expert *only relative to rational updating*. Irrationality makes the future credence proposition unreliable.
          *   *So the move is:* "Deference is conditional on the expert's verdict not conveying defeating information."
