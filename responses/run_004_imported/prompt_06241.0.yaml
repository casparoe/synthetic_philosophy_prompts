answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Senate
  **FROM:** The Committee on Named Prizes and Lectureships
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Frege Prize for Undergraduate Excellence

  **I. RECOMMENDATION**

  After extensive deliberation, including testimony from the petitioning graduate student body and consultation with the Department of Philosophy, the Committee on Named Prizes and Lectureships recommends that the University **retain the name "The Frege Prize"** but formally **amend the charter of the award** to include a mandatory contextual statement. This statement shall be read annually at the award ceremony, published in all promotional materials, and permanently displayed alongside the prize listing.

  The Committee further recommends that the endowment income be slightly reallocated to fund a biennial guest lecture titled "Logic, Language, and Responsibility," intended to examine the ethical dimensions of formal systems.

  **II. BACKGROUND AND DELIBERATION**

  The Frege Prize, endowed in the 1970s, recognizes the best undergraduate essay in logic or philosophy of language. It stands as one of our oldest departmental honors. Recently, a petition circulated by graduate students called for the prize's renaming. This petition cites the discovery of Gottlob Frege's 1924 diary, unpublished during his life, which details virulent antisemitism, a rejection of parliamentary democracy, and an advocacy for authoritarian dictatorship.

  The Committee was evenly divided. One half argued that the prize honors intellectual contributions that remain foundational regardless of the author's moral failings. The other half argued that institutional naming is an act of ongoing endorsement, and that retaining the name creates a hostile environment for the very students the prize aims to encourage.

  Central to our debate was the assessment of the philosopher Michael Dummett, who, upon reading the diary, noted that while his *"feelings toward the man were permanently altered,"* his *"estimate of the work was not."* This distinction formed the axis of our deliberation.

  **III. RATIONALE**

  The Committee recognizes that this decision will not satisfy all parties completely. However, we believe this path honors the strongest arguments of both positions by refusing to choose between historical accuracy and moral clarity.

  **To those who advocated for renaming:**
  The Committee accepts your premise that a university does not merely curate ideas; it curates *values*. To attach a name to a prize is to tell a story about who belongs in our tradition. We acknowledge that for Jewish students, for advocates of democracy, and for those who view logic as a tool for human liberation, the unqualified veneration of Frege is a barrier. Silence regarding his diary would indeed be a form of complicity. You have argued that the university cannot be a neutral vessel for toxic history. We agree. By mandating a public, permanent acknowledgment of Frege's antisemitism and the University's explicit rejection of it, we ensure that the name "Frege" is never spoken in this hall without the shadow of his politics being acknowledged. We are not preserving a monument; we are preserving a warning. The name remains, but the honor is stripped of its hagiography.

  **To those who advocated for retention:**
  The Committee accepts your premise that intellectual history is not a morality play. To remove Frege's name is to risk a sanitization of the discipline, implying that great work only emerges from great souls. It suggests that the *Begriffsschrift* or the sense/reference distinction can be disentangled from the mind that created them, only to reattach them when convenient. You have argued that we must engage with the lineage of our field, even when that lineage is stained. We agree. By retaining the name, we acknowledge that the tools we use were forged in complex, often flawed fires. To erase the name is to lose the opportunity to teach the very lesson the petitioners seek: that brilliance and bigotry can coexist, and that it is our duty to salvage the former while ruthlessly critiquing the latter.

  **IV. THE SYNTHESIS: MEMORY OVER MONUMENT**

  As a committee charged with stewarding the narrative of this institution, we view this not as a choice between erasure and endorsement, but as a choice between *forgetting* and *remembering*.

  If we rename the prize, we resolve the tension, but we lose the teaching moment. The name becomes a blank slate, and the history of how logic was weaponized by authoritarianism fades. If we keep the name without context, we endorse the man.

  Our recommendation chooses a third path: **Critical Retention.**

  We keep the name "Frege" not to honor the man, but to honor the complexity of the truth. The mandatory contextual statement will read substantially as follows:

  > *"This prize recognizes excellence in logic and philosophy of language, fields fundamentally shaped by Gottlob Frege. While Frege's technical contributions remain foundational, historical records confirm he held vehement antisemitic and authoritarian views incompatible with this University's mission. This award is given in acknowledgment of his intellectual legacy, not his moral character, and serves as a reminder that rigorous thought must be paired with ethical responsibility."*

  **V. CONCLUSION**

  Michael Dummett wrote that his estimate of the work did not change, but his feelings toward the man did. This Committee recommends that the University adopt a similar stance publicly. We will not hide the work, nor will we hide the man.

  We ask the Senate to approve this amended charter. In doing so, we signal to our students that we do not offer them heroes to worship, but a history to interrogate. We trust that the undergraduates who win this prize will understand that they are inheriting a tradition that requires not just intelligence, but vigilance.

  Respectfully submitted,

  The Committee on Named Prizes and Lectureships
