          *   *Marcus:* $D$ is not dominated by any *pure* strategy ($U$ loses to $D$ against $R$, $M$ loses to $D$ against $L$). Risk aversion might make $D$ preferable (safe 1 vs. risky 3/0). Order of elimination matters.
          *   *Priya:* $D$ is dominated by a *mixed* strategy (50/50 $U/M$ gives expected 1.5). Payoffs are utility, so risk aversion is already accounted for.
      *   **Task:** Go through step-by-step, adjudicate who is right at each point, and identify missing nuances.

  2.  **Deconstruct the Game Theory Concepts:**
      *   **Strict Dominance (Pure):** Strategy $A$ strictly dominates $B$ if $Payoff(A) > Payoff(B)$ for all opponent strategies.
      *   **Strict Dominance (Mixed):** Strategy $A$ (pure or mixed) strictly dominates $B$ (pure) if $Expected Payoff(A) > Payoff(B)$ for all opponent strategies.
      *   **Risk Aversion & Utility:** In standard non-cooperative game theory (especially introductory/intermediate), payoffs are assumed to be Von Neumann-Morgenstern (vNM) utilities. This means expected utility theory holds. Risk preferences are embedded in the numbers.
      *   **Iterated Elimination of Strictly Dominated Strategies (IESDS):** The order of elimination *does not* matter for strictly dominated strategies (unlike weakly dominated strategies).

  3.  **Evaluate Each Claim:**

      *   **Claim 1: The Answer Key eliminates $D$ straight away.**
          *   Is $D$ dominated?
          *   Compare $D$ to $U$: $1 < 3$ (vs $L$), $1 > 0$ (vs $R$). No.
          *   Compare $D$ to $M$: $1 > 0$ (vs $L$), $1 < 3$ (vs $R$). No.
          *   Compare $D$ to Mixed $\sigma = 0.5U + 0.5M$:
              *   Vs $L$: $0.5(3) + 0.5(0) = 1.5$. $1.5 > 1$.
              *   Vs $R$: $0.5(0) + 0.5(3) = 1.5$. $1.5 > 1$.
          *   Conclusion: $D$ is strictly dominated by a mixed strategy. Standard game theory allows elimination based on mixed strategy dominance.
          *   *Verdict:* Key is correct in outcome, but "sloppy" if it didn't specify mixed. Marcus is right about pure strategies, Priya is right about mixed.

      *   **Claim 2: Marcus says "no single strategy beats D everywhere."**
          *   Technically true regarding *pure* strategies.
          *   *Verdict:* Marcus is factually correct about pure strategies, but incorrect about the definition of dominance in general (which includes mixed).

      *   **Claim 3: Priya says "flip a coin... gets 1.5... beats D's guaranteed 1."**
