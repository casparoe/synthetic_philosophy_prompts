      *   **Claim 4: Marcus says "coin flip doesn't guarantee 1.5, it gives 3 or 0... cautious player prefer D."**
          *   This is the Risk Aversion argument.
          *   *Standard Assumption:* Payoffs are utilities. If the numbers are utilities, $EU(0.5U+0.5M) = 1.5 > U(D) = 1$. A rational agent maximizes expected utility.
          *   *Nuance:* If the numbers are *monetary* payoffs and not utilities, Marcus is right. But in game theory problems, unless specified otherwise, numbers represent vNM utilities.
          *   *Verdict:* Priya is right on standard theory conventions. Marcus is raising a valid behavioral point but violating the standard modeling assumption.

      *   **Claim 5: Priya says "payoffs are already utility, so risk-aversion is priced in."**
          *   *Verdict:* This is the core axiom of expected utility theory in game theory. Priya is right.

      *   **Claim 6: Marcus says "order you eliminate strategies in can change your final answer."**
          *   *Concept:* Order dependence applies to *Weakly* Dominated Strategies (IEWDS). For *Strictly* Dominated Strategies (IESDS), the order does *not* matter. The set of surviving strategies is unique.
