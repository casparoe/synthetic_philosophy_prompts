answer: |-
  I hear you. The "heart pumps blood vs. makes noise" example is the *Drosophila* of philosophy of biology: useful for the lab, but after thirty-five years in the field, you want something with a bit more mud on its boots. It also tends to obscure the real stakes, which aren't about distinguishing primary from secondary effects, but about whether **history matters at all** for defining what a trait is *for*.

  Since you want a case where the two theories deliver opposite verdicts on **whether a function exists at all** (not just *which* function), I suggest we leave the vertebrate cardiovascular system and look at a case of rapid, contemporary behavioral ecology.

  ### The Case: Urban House Finches and Cigarette Butts

  **The Biology:**
  In Mexico City, researchers (Suarez-Rodriguez et al., 2013) studied House Finches (*Haemorhous mexicanus*) nesting in urban environments. They observed that finches were incorporating discarded cigarette butts into their nests.

  Chemical analysis showed the nests contained nicotine and other alkaloids. Experimental data demonstrated that nests with more cigarette butt material had significantly lower loads of ectoparasites (like mites and flies), leading to higher fledgling success. The birds appear to actively select fibrous material, and in the urban context, cigarette filters are a abundant source of that material which happens to be chemically treated.

  **The Question:**
  Does the incorporation of cigarette butts into the nest have the **function** of parasite control?

  Here is how the two camps split, and why they can't reconcile.

  ---

  ### 1. The Causal-Role (Cummins) Verdict: **YES**

  **The Logic:**
  For a Cummins-style functional analyst, function is about **current contribution to a containing system's capacity.**

  *   **The System:** The nesting behavior complex, aimed at the capacity of "successful offspring rearing."
  *   **The Component:** The inclusion of cigarette butt fibers.
  *   **The Contribution:** These fibers release alkaloids that reduce parasite load, thereby increasing offspring survival.

  **The Verdict:**
  Because the cigarette butts *currently* contribute to the capacity of the nesting system (rearing healthy young), they have a function. It does not matter that cigarettes are a human invention from the last century. It does not matter that the finches have no evolutionary history with tobacco. If it works in the system *now*, it is a function.

  To a Causal-Role theorist, calling this "parasite control" is biologically accurate description of the *mechanism's role* in the current environment.

  ---

  ### 2. The Etiological (Wright/Neander) Verdict: **NO**

  **The Logic:**
  For an Etiological (Selected Effects) theorist, function is about **historical selection.** A trait has a function only if it exists *because* it performed that effect in the past, and that effect contributed to the fitness of ancestors.

  *   **The Trait:** The behavioral propensity to incorporate fibrous plant material into nests.
  *   **The History:** This behavior evolved over millennia in environments *without* cigarettes.
  *   **The Selection Pressure:** The behavior was selected for structural integrity, insulation, or perhaps general hygiene using *natural* materials.

  **The Verdict:**
  Because cigarettes did not exist during the evolutionary history of the House Finch, natural selection could not have shaped this behavior *for the purpose* of harvesting nicotine. The parasite reduction is a **fortuitous byproduct** (a "lucky accident").

  To an Etiological theorist, saying the function is "parasite control via nicotine" is false. The *proper function* is "nest construction using fibrous material." The nicotine effect is a beneficial side effect, but it is not a *function* because there is no feedback loop of selection history linking the trait to that specific effect. Until there has been enough time for selection to act on this specific variation (perhaps favoring birds that specifically seek out butts over other fibers), it remains a spandrel.

  ---

  ### Why This Disagreement Actually Matters

  You might ask, "Why split hairs? It helps the birds either way." But as a field biologist, you know that labeling something a "function" carries theoretical weight.

  1.  **Adaptationism:** If you accept the Causal-Role verdict, you risk becoming a "pan-adaptationist." Every beneficial accident becomes a function. If a bird gets hit by a car and its bones break in a way that accidentally creates a better anchor for a tag, a Cummins theorist could argue the bone fragility has a "function" relative to the tagging system. The Etiological view protects you from seeing design where there is only luck.
  2.  **Homology vs. Analogy:** The Etiological view forces you to ask: "Is this the *same* trait doing a *new* job, or a *new* trait?" The Causal-Role view blurs that line. For the finch, the Etiological view insists this is the old "fibrous material" trait wearing a new hat. The Causal-Role view treats the nicotine delivery as a functional component equivalent to a bird using aromatic herbs (which some species do evolutionarily).
  3.  **Predictive Power:** If you are planning future fieldwork:
      *   The **Etiological** theorist predicts that if cigarette butts disappear, the behavior might persist (because the selected function was structural), but the parasite benefit will vanish.
      *   The **Causal-Role** theorist is less concerned with the persistence and more with the current system analysis.

  ### The "Beetle" Translation

  Since you spent your life with beetles, imagine a scarab species where the horn shape happens to channel rainwater into a depression where the beetle drinks.

  *   **Causal-Role:** The horn's function includes water collection. It contributes to the survival system.
  *   **Etiological:** Unless you can prove ancestors with water-channeling horns out-reproduced those without *because* of the water, the function is purely combat/display. The drinking is just physics happening to be useful.

  ### Summary

  The Heart example fails because both sides agree pumping is a function; they just disagree on the noise.

  The **Finch/Cigarette** example works because:
  *   **Causal-Role:** Says "Yes, it functions to kill parasites." (History is irrelevant).
  *   **Etiological:** Says "No, that is an accident." (History is essential).

  This forces you to decide if "function" is a word about **what something does** (Cummins) or **why something is there** (Wright/Neander). In the field, that's the difference between describing a mechanism and inferring an evolutionary history.
