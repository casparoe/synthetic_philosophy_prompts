answer: |-
  Your friend is not being irrational. In fact, what she is experiencing is a well-documented psychological and philosophical phenomenon. She is encountering the gap between **reference** (who a name points to) and **sense** (how that person is experienced).

  While biologically and legally "Kestrel_Jo" and "Dave" are the same human organism, psychologically and socially, they occupy two different categories in her brain. Here is why her reaction is not only normal but actually points to something profound about how human connection works.

  ### 1. The Philosophical Precedent: The Morning Star and the Evening Star
  There is a famous problem in the philosophy of language posed by Gottlob Frege. He asked: If the "Morning Star" and the "Evening Star" are both the planet Venus, why does the statement "The Morning Star is the Evening Star" feel like new information? Why isn't it as obvious as "Venus is Venus"?

  Frege argued that names have a *sense* (the mode of presentation) and a *reference* (the actual object).
  *   **Kestrel_Jo** is presented through text, anonymity, vulnerability, and shared private jokes.
  *   **Dave** is presented through physical presence, social hierarchy (he was leading the walk), voice, and body language.

  Even though the *reference* is the same, the *sense* is different. Her brain has to build a bridge between two completely different modes of experiencing a person. That bridge takes time to build.

  ### 2. Context-Dependent Identity
  Human memory is associative. We don't store people as single, unified files; we store them as clusters of associations based on context.
  *   **The "Kestrel_Jo" Node:** Linked to emotions of intimacy, late-night venting, specific humor, and the safety of anonymity.
  *   **The "Dave" Node:** Linked to visual cues, the outdoors, group dynamics, and perhaps a more reserved "public face."

  When she thinks, *"Kestrel_Jo would get this, Dave might not,"* she isn't being illogical. She is accurately assessing that the **version** of Dave that exists in text form has access to a different set of emotional tools than the **version** of Dave that exists in physical space. People genuinely behave differently online than they do in person. The "Online Disinhibition Effect" suggests people often share more and act more authentically online because the physical social risks are removed.

  So, in a very real way, "Kestrel_Jo" *is* a different persona than "Dave," even if they share a brain.

  ### 3. The Intimacy Mismatch
  This is the most disorienting part. She likely knows "Kestrel_Jo" better emotionally than she knows "Dave" physically.
  *   With **Kestrel_Jo**, she has two years of daily emotional data.
  *   With **Dave**, she has a few hours of physical proximity.

  When she is with Dave in person, her brain is screaming that this is a stranger, because physically, he *is* relatively new to her. But emotionally, he is an old friend. This creates a kind of cognitive dissonance. Her brain is trying to reconcile high emotional intimacy with low physical familiarity. Separating them ("Kestrel_Jo would understand") is a coping mechanism to manage that dissonance while the two identities merge.

  ### 4. The "Realness" of Digital Relationships
  There is a lingering cultural idea that online relationships are "fake" and in-person ones are "real." Your friend's reaction proves the opposite. The relationship with Kestrel_Jo was real enough that it created a distinct neural pathway.

  If the online relationship had been shallow, the merger would have been instant. The fact that it is difficult proves the depth of the bond. She is grieving the loss of the *mystery* of Kestrel_Jo while trying to integrate the *reality* of Dave.

  ### Conclusion
  She is not being irrational. She is experiencing **identity lag.**

  Intellectual knowledge ("They are the same person") updates instantly. Emotional association ("They feel like the same person") updates slowly.

  You can tell her that this is a feature of human cognition, not a bug. We are complex enough to contain multitudes, and sometimes those multitudes have different usernames. It might take months or even a year for the "Kestrel_Jo" and "Dave" nodes in her brain to fully fuse. Until then, acknowledging the distinction is actually a healthy way to process the complexity of knowing someone in two different worlds.

  **Something real is going on:** She fell for a mind, and then she met the body that carries it. It takes time for the heart to realize they live in the same house.
