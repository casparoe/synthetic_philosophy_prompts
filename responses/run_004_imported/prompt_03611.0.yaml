prompt: |-
  While reading about Bayesian decision theory for an independent project in my AP Statistics class, I came across I. J. Good's 1967 theorem on the value of information, from his short paper "On the Principle of Total Evidence." As I understand it, Good showed that a rational Bayesian agent should never expect that gathering additional free evidence before a decision will leave them worse off, provided they go on to use that evidence correctly afterward. I have a habit of over-researching decisions, like spending weeks comparing colleges or rereading reviews before any purchase, and I'm curious whether this theorem actually justifies that habit. Could you lay out the most important implications of Good's theorem for deciding when to stop gathering information and just commit to a choice, including the key assumptions or limitations that keep it from being a blanket argument for always searching for more?
