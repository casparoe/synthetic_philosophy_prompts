      *   *Why?* The theorem assumes *free* information. Real-world research has *costs* (opportunity cost of time, mental energy, delayed action).
      *   *The "Stop" Rule:* You stop when the *marginal cost* of acquiring more information exceeds the *expected marginal value* of that information.

  4.  **Identify Key Assumptions & Limitations (The "Gotchas"):**
      *   **Costlessness:** This is the big one. Good's theorem is about *free* information. If research takes weeks, it's not free.
      *   **Computational Omniscience:** The agent must be able to perfectly calculate the expected utility of the new information *before* getting it. Humans are bounded rational agents.
      *   **Stationarity:** The world doesn't change while you research. (Colleges might fill up, prices might change).
      *   **Well-defined Utility:** You need to know what you want (utility function) to calculate the value of info. If you don't know your preferences, more info might confuse you.
      *   **Independence/Relevance:** The new info must actually be informative. Reading the 100th review might have diminishing returns (redundancy).

