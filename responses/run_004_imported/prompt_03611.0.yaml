      *   **Core Question:** Does this theorem justify their habit? What are the implications for *stopping* information gathering? What are the assumptions/limitations?
      *   **Goal:** Explain the theorem's implications, specifically regarding when to stop, and highlight why it *doesn't* justify endless research in the real world.

  2.  **Deconstruct Good's Theorem (The "Value of Information"):**
      *   *What is it?* In Bayesian decision theory, the expected utility of making a decision *after* observing free evidence is always greater than or equal to the expected utility of making the decision *without* that evidence.
      *   *Key Condition:* The evidence must be **free** (no cost in time, money, cognitive load) and **relevant** (potentially changes probabilities).
      *   *Mathematical Intuition:* $E[U(\text{with info})] \geq E[U(\text{without info})]$. You can always ignore the new info and do what you would have done before, so you can't do worse. Usually, you update and do better.

  3.  **Address the User's Habit (Over-researching):**
