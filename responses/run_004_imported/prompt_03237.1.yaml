prompt: |-
  Okay so this has been living in my head for like three weeks now and I need someone to help me settle it. Every March me and my friend group do the usual bracket pool, but this year I also got kind of loose and made a pile of separate side bets with different people in the couple days before the tournament tipped off — like $20 with Dave that a certain team makes the Final Four, $15 with Priya that the team I actually picked to win it all does NOT end up winning it all, a head-to-head bet with a coworker on which of two teams goes further, plus a few others in that vein. Each one just came from whatever gut feeling I had about that specific matchup at the time, they weren't connected in my mind at all.

  After the tournament ended, my friend Marcus, who works in insurance and is annoyingly sharp with numbers, took all my bets and figured out that just from the odds baked into them, before a single game had even been played, there was no possible way the tournament could've turned out that would've left me ahead once you add that whole set of bets together — like no matter who won or lost, I was garunteed to end up down money overall, even though every single bet seemed totally fine on its own. He wasn't betting against me himself, he just noticed it after the fact and pointed it out. My brother thinks Marcus is being a smartass and that this is the kind of thing that only ever looks meaningful in hindsight — like obviously you can always add up somebody's bets after they're over and make it look bad somehow. But Marcus swears its not a hindsight thing, that the odds I was implicitly using for each bet were inconsistent with each other in a way that could've been caught in advance, no results required.

  So who's actually right here — is there something genuinely irrational going on in how I was sizing up my confidence for each of those bets, even though every one of them felt reasonable by itself? And if Marcus has a point, what would it even mean to avoid this next time — am I supposed to check that my gut feelings about a dozen unrelated bets all fit together into one consistent set of odds before I'm even allowed to bet on any of them? That seems like a crazy high bar for just having opinions about basketball, but I can't tell where exactly the argument would break down.
