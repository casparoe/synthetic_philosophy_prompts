prompt: |-
  I'm a novelist myself (second book came out this year, did fine, nothing wild) and I've got a pretty specific speech-writing problem I'm hoping you can help me solve. My old MFA thesis advisor -- I'll just call her Deborah -- is retiring this spring after something like thirty-five years running the same fiction workshop, and I got asked to give the toast at her retirement dinner. The complication is that Deborah is a totally sincere, unembarrassed disciple of late Tolstoy, specifically the Tolstoy of "What Is Art?," not the big-novel Tolstoy. Every single year, day one of workshop, she'd read us the passage where he basically disowns his own most famous books -- decides Anna Karenina and War and Peace count as bad, "counterfeit" art, made for money and for the jaded tastes of one narrow class, rather than the real thing, which for him was some plain, sincere "infection" of feeling that could hit a duke and a peasant exactly the same way. Same shtick with his weird little essay trying to prove King Lear is actually just a badly built play. And she never let us off the hook either -- the running implication all semester was that most of what we were straining to write in that room, clever and structurally tricky as it was, was probably "bad art" by the identical logic, hers and ours alike, prizes and blurbs included.

  So now I have to toast thirty-five years of her turning out a room full of, lets be honest, genuinely successful writers, in front of a crowd that's half those writers -- who will definately clock it if I get the Tolstoy wrong -- and half her actual family, who have never once heard the phrase "counterfeit art" and just want to hear that she was a wonderful teacher, full stop. I don't want to write something that praises her, in effect, for craft and cleverness in a way she'd have visibly winced at, and I also don't want five minutes of Russian aesthetic theory that leaves her mother staring at the tablecloth. The thing I keep circling back to is that Tolstoy, having supposedly disowned novel-writing as basically a con, went ahead and wrote Resurrection and Hadji Murad anyway, like he couldn't fully quit his own talent even by his own rules -- and I think there's both a decent joke and the right note of affection buried in that, if it's pointed gently at Deborah instead of at Tolstoy. Could you draft that toast for me? Five minutes, tops, one joke that actually works for both halves of the room, landing as affection and not as a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (2 books, modest success), former student of Deborah.
      *   **Occasion:** Deborah's retirement dinner after 35 years teaching fiction workshops.
      *   **Audience:** 50% former students (successful writers, know the drill), 50% family (non-writers, just want to hear she was great).
      *   **The Complication:** Deborah is a die-hard disciple of *late* Tolstoy (*What Is Art?* era). She believes most "high art" (including *Anna Karenina*, *War and Peace*) is "counterfeit art" made for the elite. Real art must be sincere, simple, and infect *everyone* (duke and peasant) equally. She applied this harsh standard to her students.
      *   **The Goal:** A 5-minute toast.
      *   **The Tone:** Affectionate, not lecture-y. Acknowledge her philosophy without alienating the family.
      *   **The Key Insight/Joke:** Tolstoy couldn't stop writing great fiction (*Resurrection*, *Hadji Murad*) even after denouncing it. Deborah is similar: she taught us to aim for impossible purity, but she loved the messy act of writing itself.
      *   **Constraint:** One joke that works for both halves of the room.

  2.  **Deconstruct the Audience Dynamics:**
      *   *The Writers:* They know the "Tolstoy shtick." They expect the irony. They don't want a generic "she was nice" speech. They want to know the speaker *gets* the specific struggle of her workshop.
      *   *The Family:* They don't know Tolstoy's aesthetic theory. If I quote *What Is Art?*, they'll tune out. They need to understand *why* she mattered. The core message must translate to "she taught honesty."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Needs to be warm, establish the relationship, and acknowledge the occasion.
      *   **The "Tolstoy Problem":** I need to introduce her philosophy without getting bogged down in theory. How to explain "counterfeit art" simply? *Idea: Focus on the feeling, not the theory.* Call it the "Tolstoy Test."
      *   **The Workshop Experience:** Describe the feeling of being in her class. The fear of being "counterfeit." The high standard.
      *   **The Turn (The Joke/Insight):** This is the crux. Tolstoy denounced novels but wrote them. Deborah denounced "cleverness" but nurtured novelists.
      *   **The Resolution:** Why was she right, even if the theory was impossible? Because the *striving* made us better.
      *   **The Toast:** A clear closing wish.

  4.  **Refining the "Joke":**
      *   *Draft 1:* Tolstoy said novels are bad, but he wrote them. Deborah said our novels were bad, but she taught us anyway. (Too blunt).
      *   *Draft 2:* Tolstoy couldn't quit writing. Deborah couldn't quit teaching us to write. (Better).
      *   *Draft 3 (The Winner):* Focus on the contradiction. Tolstoy spent his old age telling people not to read his big books. Deborah spent 35 years telling us our big books were "counterfeit," yet she kept reading them. The joke is that the "infection" of loving stories is stronger than the theory about them.
      *   *Making it work for Family:* Frame it as "She held us to an impossible standard, but loved us anyway."
      *   *Making it work for Writers:* Frame it as "She knew the game was rigged, but made us play it honestly."

  5.  **Drafting - Voice and Tone:**
      *   Needs to sound like a writer (slightly polished, thoughtful) but spoken (rhythm, pauses).
      *   Avoid jargon like "aesthetic theory" or "didacticism." Use words like "truth," "feeling," "uncle," "peasant."
      *   Keep it under 5 minutes (approx. 600-750 words spoken at a moderate pace).

  6.  **Writing - Iteration 1 (Mental Outline):**
      Hi everyone. Deborah is retiring. She loves Tolstoy. Specifically angry Tolstoy. He said *War and Peace* is trash. She told us our stories were trash unless a peasant liked them. We were scared. But look at us now. We write. Why? Because Tolstoy kept writing too. He couldn't help it. Deborah couldn't help teaching us. Let's drink to the infection.

  7.  **Writing - Iteration 2 (Fleshing out):**
      *   *Start:* Good evening. For those who don't know me, I'm [Name]. I'm a writer. Deborah is my teacher.
      *   *Middle:* Day one of workshop. She reads the Tolstoy quote. "If your aunt doesn't cry, it's fake." We sweated. We tried to be simple. We failed. But she kept teaching.
      *   *The Twist:* Tolstoy wrote *Hadji Murat* after saying no more novels. Deborah taught novelists after saying novels are suspect.
      *   *End:* She taught us to care more about truth than success. Cheers.

  8.  **Polishing and Nuancing (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't make her sound *too* harsh. It needs to be affectionate. The "terror" of the workshop should be framed as a gift.
      *   *Correction:* Ensure the family understands "counterfeit." Use an analogy. "Art that only rich people get."
      *   *Correction:* The joke needs to land softly. It's not "Gotcha!" it's "Isn't that human?"
      *   *Key Phrase:* "The infection." That's Tolstoy's word, but it works for families too (love is an infection).

  9.  **Final Review against Constraints:**
      *   5 minutes? (Word count looks good).
      *   One main joke? (The Tolstoy/Deborah contradiction).
      *   Affectionate? (Yes).
      *   No lecture? (Theory kept minimal).

  10. **Final Polish:** (Produces the provided output). I will add stage directions for pacing. I will ensure the transition from the "scary teacher" to the "loving mentor" is clear.

  *(Self-Correction Note during final polish)*: I need to make sure I don't accidentally insult the successful writers in the room by implying their success is "counterfeit." The point is that Deborah made them *earn* it.

  Okay, let's write it.cw
answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I'm a novelist, and like about half the people in this room, I am a product of Deborah's workshop.

  When you're asked to toast a teacher like Deborah, you face a specific challenge. Usually, you talk about how a mentor helped you find your voice, or how they opened doors. But Deborah didn't really open doors. For the first three weeks of the semester, she mostly locked them.

  On day one of her workshop, Deborah would read us a passage from Leo Tolstoy. Not the Tolstoy who wrote *War and Peace*, but the later Tolstoy, the one who spent his old age writing essays arguing that *War and Peace* was actually a piece of garbage.

  She read us the part where he says that most art is "counterfeit." He argued that if a story is written just to impress other rich people, or to show off how clever you are, it's a lie. Real art, he said, has to be simple and sincere enough to infect a duke and a peasant exactly the same way. If your aunt doesn't feel it, and the guy plowing the field doesn't feel it, you haven't made art. You've made a product.

  For thirty-five years, Deborah held us to that standard. Imagine being twenty-two years old, wanting to be a writer, and having your teacher look at your most structurally complex, prize-hopeful story and say, gently, "This is very clever. But is it true? Or is it just for the duke?"

  It was terrifying. We spent the whole semester trying to write something that a Russian count and a tractor driver would both love. We mostly failed. But in trying, we learned to stop writing for approval, and start writing for connection.

  Now, here is the thing about Tolstoy. After he wrote that essay declaring that novels were morally suspect and that he should stop writing them... he went home and wrote *Hadji Murad*. And *Resurrection*. He couldn't help himself. The man who told the world that fiction was a distraction from God kept writing fiction until the day he died. He was infected by the very thing he warned against.

  And I think, in a way, that is the secret to Deborah's thirty-five years here.

  She spent a career teaching us that "success" in the literary world—blurbs, prizes, clever structures—might be counterfeit. She warned us that the industry is built on vanity. And yet, she spent thirty-five years showing up to read our manuscripts. She spent thirty-five years nurturing a room full of people who, by her own strict definition, were trying to make "careerist art."

  If she truly believed we were all just manufacturing counterfeit goods for the elite, she could have quit. But she didn't. Because she knew what Tolstoy knew: that the urge to tell a story, to connect with that "peasant" and that "duke," is stronger than any theory about art.

  She taught us that the work matters more than the resume. She taught us that if we couldn't explain why we wrote a sentence without using the word "cool" or "smart," we shouldn't write it. She made us aim for an impossible purity, not because she thought we'd hit it, but because aiming for it kept us honest.

  To the family here: You know her as the woman who loved you. To the writers here: We know her as the woman who loved the truth more than she loved our egos. But really, it's the same thing. She taught us that if you aren't willing to be embarrassed by your own sincerity, you aren't doing the work.

  So, I'd like to propose a toast.

  To Deborah. Who spent thirty-five years telling us that awards don't matter, while secretly making sure we were good enough to win them. Who told us novels were suspect, but read every single one we wrote. And who proved, just like Tolstoy, that you can spend a lifetime arguing against the power of stories, and still spend every day of that life proving that they save us.

  To Deborah.
