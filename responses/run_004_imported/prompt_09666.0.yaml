answer: |-
  This is an exceptionally sharp observation for a term paper. You have identified a genuine tension in the historiography of science and religion. The parallel between Newton's 2060 calculation and Miller's 1844 prediction is structurally sound: both employ the *annus propheticus* (day-year principle), both rely on Danielic chronologies, and both seek to periodize history toward a eschaton.

  However, the discrepancy in how they are remembered is not merely a double standard; it is a result of specific historical, textual, and sociological factors. If your paper argues simply that "historians are inconsistent," you might miss the deeper reasons *why* that inconsistency exists. To make a stronger argument, you should analyze the **epistemic boundaries** that protect Newton but expose Miller.

  Here are four key dimensions to help you refine your thesis and navigate this comparison.

  ### 1. Public Dogma vs. Private Conjecture
  The most significant difference lies in the social life of their calculations.

  *   **William Miller** built a public movement. His calculations were preached from pulpits, printed in pamphlets, and used to mobilize tens of thousands of followers. He staked his social and spiritual capital on the date. When 1844 passed without the Second Coming, the failure was public, collective, and immediate (The Great Disappointment).
  *   **Isaac Newton** kept his apocalyptic calculations largely private. The manuscript you are referencing (Keynes MS 7, often titled *Ye end of ye world*) was not published in his lifetime. Newton circulated theological manuscripts among a very small circle of trusted confidants (like John Locke), but he never preached 2060 from a pulpit or used it to recruit followers.
  *   **Historiographical Impact:** Historians treat Miller as a case study in *social* religious movements because his math had social consequences. Newton's math had no social consequences. Therefore, Newton's calculation is treated as an intellectual artifact, whereas Miller's is treated as a sociological event.

  ### 2. Certainty vs. Hedging
  While both men used the same hermeneutical key (the day-year principle), their rhetorical stance toward the *result* differed.

  *   **Miller** was driven by a conviction that the date was knowable and imminent. His movement coalesced around the certainty of the event.
  *   **Newton** explicitly argued *against* the practice of setting dates in his public writings (e.g., in *Observations upon the Prophecies of Daniel and the Apocalypse of St. John*, published posthumously but written earlier). He famously wrote that the purpose of prophecy is not to gratify curiosity but to establish faith *after* the fact.
  *   **The Irony:** In the private 1704 manuscript, Newton calculates 2060 but adds a crucial caveat: *"It may end later, but I see no reason for its ending sooner."* He treats the date as a *terminus post quem* (the earliest possible date), not a definitive expiration date.
  *   **Paper Angle:** You can argue that Newton's "rationality" is preserved because he maintained a philosophical skepticism about the certainty of the date, whereas Miller's "delusion" is defined by his dogmatic certainty. Is this a fair distinction, or merely a way to save Newton's reputation?

  ### 3. The "Falsification" Problem
  You noted that intellectual consistency should require us to either rehabilitate Miller or criticize Newton. However, there is a temporal asymmetry in falsification.

  *   **1844** is in the past. Miller's specific prediction was empirically falsified by the calendar.
  *   **2060** is in the future. Newton's prediction is currently unfalsifiable.
  *   **Historiographical Impact:** It is easy for historians to treat Newton's 2060 as "symbolic" or "cautious" because we haven't reached it. If Newton had predicted 1800, historians would likely treat him much more like Miller.
  *   **Paper Angle:** Challenge the idea that Newton's method is "safer." If the day-year principle is hermeneutically flawed (as modern biblical scholarship suggests), it is flawed regardless of whether the date is 1844 or 2060. You can argue that the "forgiveness" granted to Newton is a result of the *survival bias* of the date.

  ### 4. The "Scientific Revolution" Narrative
  This is the most critical point for a seminar on Newton. The way we treat Newton's theology is bound up with how we define the "Scientific Revolution."

  *   **The Enlightenment Construct:** For centuries, historians (like A.N. Whitehead or early 20th-century positivists) needed Newton to be the avatar of Reason. His theology was an embarrassment, a "residue" of medieval thinking to be ignored or minimized.
  *   **The Revisionist Turn:** Since the 1970s (led by scholars like **James Force**, **Richard Popkin**, and **Stephen Snobelen**), historians have argued that Newton's theology and science were *integrated*. He wasn't "irrational" for studying prophecy; he believed he was decoding God's natural and revealed law using the same inductive methods.
  *   **Miller's Context:** Miller does not have a "physics" to save him. He is categorized solely within the history of religion. Therefore, his failure is judged by the standards of religious history (where millenarianism is often pathologized), whereas Newton is judged by the standards of the history of science (where his "errors" are compartmentalized).
  *   **Paper Angle:** Your paper could argue that the "double standard" reveals less about Newton and Miller and more about the **disciplinary boundaries** of modern academia. We protect Newton because he is a founding father of *Science*; we dismiss Miller because he is a founding father of *Adventism* (a fringe religious group in the eyes of secular history).

  ### Suggested Thesis Direction
  Instead of asking "Who was right?", consider framing your paper around **Epistemic Authority**.

  > *Thesis Draft:* "While Newton and Miller employed identical hermeneutical methods to decode Daniel's chronologies, their divergent historical legacies reveal less about the validity of their calculations and more about the role of publicity and disciplinary memory in constructing 'rationality.' Newton is granted epistemic leniency because his eschatology remained private and unfalsified, serving the narrative of the solitary genius, whereas Miller's public mobilization forced a collective confrontation with falsification that defined him as a fanatic."

  ### Recommended Sources for Your Paper
  To support this, you should engage with the following scholars:

  1.  **Stephen Snobelen:** He is the leading expert on Newton's theology. Look for his article *"Isaac Newton, Socinianism and 'The One Supreme God'"* or his work on Newton's apocalyptic manuscripts. He argues Newton's theology was central, not peripheral.
  2.  **James E. Force & Richard H. Popkin:** Specifically *Newton and Religion* (1999). They argue against the "two Newtons" (scientist vs. mystic) view.
  3.  **Ronald L. Numbers:** Specifically *Prophetess of Health* or his work on Adventist history. He treats Miller seriously as a historical actor without the "genius" buffer Newton gets.
  4.  **J.L. Heilbron:** His biography of Newton touches on the tension between his public persona and private beliefs.
  5.  **Frank E. Manuel:** *The Religion of Isaac Newton*. An older but foundational text that explores Newton's psychological investment in prophecy.

  ### A Note on the 2060 Date
  Be precise with Newton's text. In the manuscript (New College, Cambridge, MS 1), Newton writes:
  > *"It may end later, but I see no reason for its ending sooner. This I mention not to assert when the time of the end shall be, but to put a stop to the rash conjectures of fanciful men who are frequently predicting the time of the end..."*

  This is your "smoking gun." Newton uses his own calculation to criticize the very practice Miller embraced. If you can unpack whether this is a genuine methodological difference or a post-hoc rationalization, you will have a very strong paper.

  ### Conclusion
  You are right to be puzzled. The inconsistency is real. But rather than concluding that historians *should* treat them identically, use the discrepancy to show how **context determines what counts as "reason."** Newton's reasoning is sanctified because it is attached to the *Principia*; Miller's is profaned because it is attached to the *Great Disappointment*. Your paper can expose the mechanisms of that sanctification.
