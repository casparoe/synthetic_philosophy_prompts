answer: |-
  This is an excellent and precise philosophical worry. You have put your finger on the exact tension that makes the literature on "standing to blame" both fertile and frustrating. Your intuition is correct: if we are talking strictly about the **truth conditions** of a moral proposition, the *tu quoque* is indeed a fallacy. However, the concept of "standing" is not tracking truth; it is tracking **normative authority** within a specific interpersonal practice.

  To put it bluntly: The fallacy warns against confusing the *message* with the *messenger*. The standing objection argues that in the specific practice of moral blame, the *messenger is part of the message*.

  Here is a breakdown of the genuine distinction being drawn, how it avoids the fallacy, and how you might frame this in your dissertation.

  ### 1. Propositional Content vs. Illocutionary Force
  The primary distinction lies in speech act theory.
  *   **The Fallacy (*Tu Quoque*):** Concerns the **propositional content**. If I say, "Stealing is wrong," the truth value of that statement depends on moral reality, not on my own theft. To deny the truth of the claim because I am a thief is logically invalid.
  *   **Standing:** Concerns the **illocutionary force** (the act performed in speaking). Blame is not merely describing a moral fact ("You violated norm N"). It is a performative act of **holding accountable**. It issues a demand for acknowledgment, apology, or reform.

  When we say a hypocrite lacks standing, we are not saying their moral judgment is false. We are saying their **performance of the blame** is infelicitous or impermissible. They lack the *authority* to issue the demand, even if the demand is based on a true premise.

  **Analogy:** Consider a referee in a sports match. If the referee calls a foul on Player A, the proposition "Player A committed a foul" can be objectively true. However, if it is revealed the referee is betting on the opposing team, they lack the *standing* to make the call. The foul still happened (truth), but the referee has forfeited the authority to enforce the rules (standing). To say "You can't call that foul" is not to say "That wasn't a foul"; it is to say "You are not the one who gets to say it."

  ### 2. The Normative Basis of Standing
  Why do we grant this normative authority only to the non-hypocritical? The literature generally tracks three distinct values that hypocrisy undermines, none of which rely on the truth of the accusation:

  **A. Fairness (The "Clean Hands" Principle)**
  This is the most common justification (associated with philosophers like R. Jay Wallace and Macalester Bell). Moral blame involves a demand for compliance with a norm. It is unfair to demand of others a compliance you do not impose on yourself.
  *   *Tracking:* This tracks **reciprocity**. By exempting yourself from the norm you are enforcing, you create an asymmetrical power dynamic. The *tu quoque* here isn't saying "Your norm is wrong," it's saying "Your application of the norm is unjust."

  **B. Communicative Integrity**
  Blame is a communicative act intended to convey the importance of a moral value. Hypocrisy corrupts the signal.
  *   *Tracking:* This tracks **sincerity and commitment**. When a hypocrite blames, the message received is not "This value is important," but rather "I am using this value to dominate you." The blame fails to function as moral address because it ceases to be an appeal to shared values and becomes an exercise in power.

  **C. The Forfeiture View**
  Some argue (e.g., Fritz & Miller) that by violating a norm oneself, one forfeits the right to hold others to it.
  *   *Tracking:* This tracks **moral entitlement**. Just as breaking a contract might forfeit your right to sue for its breach, violating a moral norm forfeits your right to demand others honor it.

  ### 3. Addressing the "Ad Hominem" Worry
  Your concern is that "standing" is just a respectable euphemism for *ad hominem*. To defend against this in your dissertation, you need to clarify the **scope of the rejection**.

  *   **Ad Hominem:** Rejects the *conclusion* ("Stealing is not wrong") based on the *premise* ("You steal").
  *   **Standing Objection:** Accepts the *conclusion* ("Stealing is wrong") but rejects the *intervention* ("I am not the one who gets to demand you stop").

  You can frame this by distinguishing between **correctness** and **appropriateness**.
  *   A hypocrite's blame can be **correct** (the target did do something wrong).
  *   But it can be **inappropriate** (the blamer has no right to be the one administering it).

  If you treat blame purely as a "truth-telling" mechanism, standing makes no sense. But if you treat blame as a **social practice of accountability** (as Watson, Wallace, and others do), standing is essential. It prevents the practice of blame from devolving into a tool for moral grandstanding or oppression.

  ### 4. Dissertation Angles
  Since you are writing on moral address, here are three ways to leverage this distinction:

  1.  **The Function of Address:** Argue that moral address is not just about transmitting information (truth), but about negotiating relationships (authority). Standing is the gatekeeper of that negotiation.
  2.  **The Target's Perspective:** Explore why the *target* of blame is justified in rejecting hypocritical blame. It is not because they are innocent, but because the hypocrite has violated the terms of the moral community required for blame to be legitimate.
  3.  **Silence vs. Falsehood:** When we deny standing, we are not asking the hypocrite to lie (to say "what you did is fine"). We are often asking them to remain **silent**. This preserves the truth of the norm while respecting the limits of their authority.

  ### Summary for your Chapter
  The distinction tracks the difference between **moral ontology** (what is good/bad) and **moral sociology** (who gets to enforce what among whom). The *tu quoque* fallacy protects the former; the standing objection regulates the latter.

  A hypocrite's blame is like a stolen car: it might run perfectly well (the moral claim is true), but you don't have the title to drive it (the standing to blame). Pointing out the theft doesn't prove the car doesn't run; it proves you shouldn't be behind the wheel.

  **Key References to Check:**
  *   **Macalester Bell:** "The Standing to Blame" (essential for the fairness account).
  *   **R. Jay Wallace:** *Responsibility and the Moral Sentiments* (normative expectations).
  *   **Kyle Fritz & Daniel Miller:** "Hypocrisy and the Standing to Blame" (the forfeiture account).
  *   **Gary Watson:** "Two Faces of Responsibility" (distinguishing accountability from attributability).

  This distinction allows you to acknowledge the logical force of the *tu quoque* warning while maintaining the normative force of the standing objection. They are operating in different lanes.
