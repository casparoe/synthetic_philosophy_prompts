answer: |-
  The hotel bar had emptied an hour ago, leaving only the hum of the ice machine and the two of them huddled over a sticky corner table. Empty wine bottles stood like sentinels between them. Elena's name tag was peeling at the corner; Marcus had lost his somewhere between the panel on error theory and the buffet.

  "You're doing the thing again," Elena said, swirling the dregs of her Cabernet. "You're treating the Darwinian Dilemma like it's a puzzle to be solved, rather than a bullet to be bitten."

  Marcus leaned forward, resting his chin on his hand. "It's not a bullet, Elena. It's a false dichotomy. Street forces the realist to choose between 'evolution tracked truth' and 'evolution tracked fitness, truth is luck.' But there's a third option. The correlation isn't luck, and it isn't direct tracking. It's a common cause."

  "Enoch's third factor," Elena sighed, as if the name itself tasted sour. "Survival is good. Evolution favors survival. Therefore, evolution favors things that are good. I know the move, Marcus. It's elegant. But it's too thin to carry the weight of robust realism."

  "Thin doesn't mean false."

  "It means explanatorily idle," she countered. "Look, grant you the foothold. Let's say 'survival is good' is a mind-independent moral truth. And yes, natural selection favors organisms that survive. So, on this specific point, our evolutionary pressures align with the moral truth. But what does that get you? It gets you that it's good to breathe, eat, and not walk off cliffs. It doesn't get you to 'distributive justice is required' or 'torturing innocents for fun is wrong.' Those are the moral truths the realist wants to save. The third factor explains why we want to stay alive, not why we have the specific normative convictions we do."

  Marcus flagged down a passing waiter for water, then turned back. "You're conflating the anchor with the chain. Enoch isn't trying to derive the whole of morality from 'survival is good.' He's trying to break the skeptical link. If I can show that there is *at least one* point where evolutionary pressure and moral truth converge non-accidentally, I undermine the claim that the entire relationship is coincidental. Once you admit the correlation isn't pure luck at the foundational level, the burden shifts back to you to explain why the rest of our moral reasoning drifts away from truth."

  "But it *does* drift," Elena insisted, tapping her glass. "That's the empirical premise. Our fine-grained moral intuitions are wildly variable across cultures and history. Evolution gave us tribal instincts, kin preference, reciprocity heuristics. If robust moral realism is true, there are specific, mind-independent facts about, say, the trolley problem or global tax obligations. Did evolution tune us to *those*? No. So even if your third factor saves 'survival is good,' it leaves the vast majority of our moral beliefs exposed to the debunking argument. You've saved a trivial truth at the cost of the interesting ones."

  "Is it trivial?" Marcus asked. "Or is it the precondition for any other value? If survival weren't good, nothing else could be. And regarding the fine-grained stuff—you're assuming evolution gave us the *answers*. Realists say evolution gave us the *capacity* for normative judgment. We use that capacity, refined by reflection and reason, to move from 'survival is good' to 'fairness is required for stable cooperation which aids survival and is intrinsically valuable.' The third factor validates the faculty, not necessarily every heuristic it produced in the Pleistocene."

  Elena laughed, a short, sharp sound. "There it is. The 'reflective equilibrium' escape hatch. So, evolution gave us a bunch of adaptive biases, but if we think hard enough, we can filter those out and find the truth? How do you know you're filtering? How do you know your 'reason' isn't just another adaptation? You're using the very cognitive machinery under suspicion to vindicate itself. That's circular."

  "Is it?" Marcus leaned back. "Let's play the global skepticism card. If your argument works against morality because evolution shaped our moral beliefs for fitness, doesn't it work against *everything*? Evolution shaped our logical faculties. Our mathematical intuitions. Our belief in induction. If I say, '2 + 2 = 4,' natural selection didn't care about arithmetic truth; it cared that I could count berries accurately enough to not starve. If you debunk morality on evolutionary grounds, you're a companion in guilt with the mathematical skeptic. Are you prepared to say we have no reason to trust logic either?"

  Elena didn't flinch. "I've heard the companions-in-guilt argument a dozen times. Here's the difference: Mathematics is formal. It doesn't demand action. Morality is inherently practical. It tells you what to *do*. Evolution is a story about action-guiding systems. It makes perfect sense that evolution would wire us with false but useful moral beliefs—beliefs that promote cohesion but aren't true. It makes less sense that evolution would wire us with false logical beliefs that consistently predict the physical world. But even if I grant you the math analogy... sure, maybe we can't trust logic either. That's a bullet I'm willing to bite if it means avoiding the metaphysical extravagance of robust moral facts that causally interact with nothing."

  "Metaphysical extravagance," Marcus repeated. "You act like positing mind-independent moral truths is costlier than positing that all our normative experiences are a systematic illusion. But look at the cost on your side. Your argument relies on Inference to the Best Explanation. You're saying, 'The best explanation for our moral beliefs is evolution, not truth.' But that inference *itself* relies on epistemic norms. You're claiming I *ought* to accept your conclusion because it's *rationally superior*. Where do those norms come from? If evolution shaped your epistemic faculties for fitness, why should I trust your claim that 'truth-tracking' is the goal? Maybe believing the debunking argument is fitness-enhancing for *you*, but false."

  Elena paused. She picked up her wine glass, inspected the color, and set it down without drinking. "Street has a reply to that, and you know it. This isn't global skepticism. I'm not saying *no* beliefs are safe. I'm saying *controversial, metaphysically loaded* beliefs are suspect. I can trust my belief that there's a table in front of me because I can check it intersubjectively. I can trust logic because it's constitutive of thought. But moral realism makes a specific claim about the fabric of the universe—that there are normative truths independent of us. That claim is the one under fire. I don't need to vindicate all reasoning to show that *this specific* reasoning is overextended."

  "But the distinction is slippery," Marcus pressed. "If you say 'evolution explains why we believe X, therefore X is unjustified,' you need a principle that says 'etiological explanations undermine justification.' But that principle itself needs justification. If you justify it by saying 'it's intuitively obvious,' I hit you with the evolutionary story about your intuitions. If you justify it by argument, you're using the faculties evolution gave you. You're trying to stand outside the circle of nature to judge nature's outputs. You can't."

  "Maybe I don't need to stand outside," Elena said softly. "I just need to notice the tension. The realist wants moral facts to be robust, mind-independent, and yet somehow perfectly aligned with what helped apes reproduce on the savannah. That alignment is the miracle. The third factor tries to explain it away, but as I said, it only works for the barest minimum. Once you get to 'human rights' or 'animal welfare,' the evolutionary story predicts one thing—partiality, tribalism—and the realist claims another. The gap is still there. The third factor is a bridge that stops halfway across the canyon."

  Marcus smiled, tired but engaged. "And the skeptic claims the canyon is an illusion. But to do that, you have to convince me that my experience of normative force—the feeling that I *really ought* to help that person, not just that I'm programmed to—is a fiction. That's a huge error theory. Third Factor says: No error. The force is real, the truth is real, and the alignment is explained by the value of life itself. It's not ad hoc if 'life is valuable' is the first truth we grasp. It's foundational."

  "Foundational or convenient?" Elena challenged. "It feels like you're choosing the third factor because it saves the phenomena you want to save. If evolution had favored altruism that led to immediate death, would you say 'death is good'? Or would you say evolution got it wrong?"

  "If evolution favored death, we wouldn't be here to ask," Marcus said. "But seriously—if the adaptive pressure was for self-sacrifice, and self-sacrifice was morally good, the third factor would still hold. The factor isn't 'evolution.' The factor is 'value.' Evolution tracks value because value tracks life. It's not defined by evolution."

  Elena shook her head. "You're defining value in a way that guarantees the match. That's why it feels ad hoc. You're saying the moral truth is 'whatever helps organisms flourish,' and then noting that evolution helps organisms flourish. Of course they match. You've defined the moral truth to be the natural fact. But then you're not a robust realist anymore, Marcus. You're a naturalist. And if you're a naturalist, you've already conceded that there are no spooky, non-natural properties. So why fight the debunker? If moral properties just *are* fitness facts, then the debunker wins: morality is about fitness, not mind-independent truth."

  Marcus rubbed his temples. "I'm not reducing moral properties to fitness. I'm saying they supervene, or that there's a necessary connection. Enoch is a non-naturalist. He thinks 'good' is sui generis. But it's necessarily connected to reasons for action, and survival is a precondition for action. It's not a reduction. It's a bridge law."

  "A bridge law built on a single pillar," Elena said. She signaled the waiter for the check. "Look, here's where I think we actually stand. You think the cost of skepticism is too high—it destroys normativity. I think the cost of realism is too high—it requires a pre-established harmony between the causal order and the normative order that we have no independent reason to believe in. Your third factor is the price of admission for that harmony. I just don't think you've paid enough for the ticket."

  "And I think," Marcus said, reaching for his wallet, "that you're demanding a causal story for a normative relation. You want to know how the moral fact *caused* the belief. But realists don't say that. We say the belief is justified because it coheres with the truth, not because the truth pushed neurons around. The evolutionary argument assumes a causal theory of knowledge that moral truths, by definition, can't satisfy. So the argument begs the question."

  "Maybe," Elena stood up, swaying slightly. "Or maybe it just shows that morality is more human than you want to admit. It's ours. It's not written in the stars."

  "If it's just ours," Marcus said, standing as well, "then it's not binding. And if it's not binding, why bother arguing about it? Why not just go to sleep?"

  "Because," Elena smiled, picking up her bag, "arguing is adaptive. It keeps the tribe sharp."

  "See?" Marcus laughed. "Even your skepticism relies on a normative claim about what we *ought* to do to keep the tribe sharp. You can't escape it, Elena. You're using morality to debunk morality."

  "Goodnight, Marcus."

  "Goodnight, Elena. Think about the third factor."

  "I'll dream of bridges," she called over her shoulder. "Half-built ones."

  Marcus watched her go, then looked at the empty wine bottles. He picked one up, examined the label, and wondered if the choice to drink it had been determined by fitness pressures, reasons, or just the thirst of a tired philosopher. He couldn't tell the difference, and he suspected that was the point.
