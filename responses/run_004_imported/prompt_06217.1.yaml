answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I've had the privilege of being [Bride's Name]'s friend since our first week of undergrad. Back then, we bonded over late-night pizza and arguing about whether we could ever truly know anything. Today, she's asked me to say a few words, which is an honor, though I should warn you: I'm currently three years into a PhD in decision theory.

  Now, I know what you're thinking. "Great, the philosopher is going to try to prove that love is logically sound." But actually, my research has taught me the exact opposite. Specifically, I spend my days reading a philosopher named L.A. Paul, who argues that there are certain choices in life where standard logic… stops working.

  Marriage is one of them.

  In decision theory, we usually make choices by calculating the "expected utility." Basically, you look at the possible outcomes, guess how happy they'll make you, and pick the winner. But Paul points out that marriage is what she calls a *transformative experience*. It's epistemically transformative, meaning you literally cannot know what it feels like to be married until you are married. No amount of dating, or cohabitating, or asking married friends can tell you what it is to wake up ten years in and realize your life is fundamentally woven into another person's.

  It's also *personally* transformative. It changes who you are. The "you" that stands here at the altar is not the same "you" that will be making breakfast five years from now. Your preferences, your habits, even your definition of happiness—they reorganize.

  Paul's famous example is becoming a vampire. She argues that if you're human, you can't rationally decide to become a vampire, because you can't know what it's like to be one, and you can't know if you'll *like* being one until the fangs are already in. It's irreversible. You can't calculate the odds.

  Now, for the few people in this room who know my work: I want to be clear that I am *not* suggesting [Groom's Name] is a vampire. Although, I have seen his stamina on the dance floor, and the data is suggestive. But for the rest of you, the point is this: If you tried to apply normal logic to marriage, you'd never do it. The sample size is zero. The outcome is unknowable. The "you" who evaluates the decision won't exist on the other side of it.

  So, if you can't calculate your way into marriage, how do you make the decision?

  Paul suggests that when the math breaks down, the rational move isn't to retreat. It's to value the transformation itself. It's to decide that discovering who you become together is worth the uncertainty. It is to look at the void of the unknown future and say, "I don't need to know who I'll be in ten years. I just need to know I want to find out with you."

  [Bride] and [Groom], looking at you two, I see people who have already started that work. You haven't tried to predict the future or control the variables. You've chosen the leap. You've decided that the best way to navigate a life of uncertainty is not with a spreadsheet, but with a partner.

  In my field, we talk a lot about rational choice. But standing here today, watching the two of you, I realize that the most rational thing you can do is sometimes to stop calculating and start trusting. You are choosing to let your lives change you. You are choosing to build a new "self" that includes the other person.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May you never try to solve each other. May you always be surprised by who you become. And may your life together be the one beautiful problem that defies all calculation.

  To the couple!
