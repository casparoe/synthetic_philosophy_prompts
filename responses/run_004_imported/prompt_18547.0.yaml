      *   *The "Disanalogy" Camp:* Why might they differ?
          *   *Point 1: The nature of the evidence.* Lottery = bare statistics. Preface = specific evidence for each claim + general fallibility. This matters for "Normic Support" (Smith). In the lottery, nothing *explains* why ticket 1 loses. In the preface, you have evidence for claim 1.
          *   *Point 2: Knowledge.* Can you know ticket 100 loses? Most say no. Can you know fact 1 in your book? Most say yes. If knowledge is the norm of belief, this splits them.
