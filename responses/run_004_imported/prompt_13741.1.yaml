          *   *Scenario A:* Cup is on Grid-Intersection-5.
          *   *Scenario B:* Cup is on Grid-Intersection-6.
          *   *Observation:* To an observer who can't see the grid, A and B look identical.
          *   *The Hole Argument:* The laws of physics predict the cup's position relative to other objects, but if the grid points are real individuals, the laws *should* say which grid point the cup is on. If the laws allow the cup to slide from Grid-5 to Grid-6 without any physical cause or observable change, the laws are "blind" to reality. They failed to determine a fact of the matter (which grid point is occupied). That's indeterminism.
          *   *Why not redundancy?* Redundancy says "Grid-5 and Grid-6 are just names for the same spot." Substantivalism says "No, they are distinct entities." If they are distinct, the shift matters. If the shift matters but isn't determined, you have indeterminism.

      *   **Part 2: The Sophisticated Substantivalist Escape (Anti-Haecceitism)**
