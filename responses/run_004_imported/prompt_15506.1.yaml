answer: |-
  The short answer is: **The pop math book you read was incorrect (or severely oversimplified).**

  Paul Cohen did **not** prove that the Continuum Hypothesis (CH) is false. He proved that it is **independent** of the standard axioms of set theory (ZFC).

  Here is the detailed breakdown of why this distinction matters, what actually happened, and why mathematicians still argue about it.

  ### 1. The Actual Result: Independence, Not Falsity
  In mathematics, to say a statement is "false," you must prove its negation is true. To say a statement is "independent," you prove that **neither** the statement **nor** its negation can be derived from the axioms.

  The story of CH involves two giants of 20th-century logic:

  *   **Kurt Gödel (1938):** Gödel proved that you **cannot disprove** CH. He created a mathematical structure called the "Constructible Universe" ($L$) in which all the standard axioms of set theory hold, *and* the Continuum Hypothesis is true. This showed that CH is **consistent** with set theory.
  *   **Paul Cohen (1963):** Cohen proved that you **cannot prove** CH. He invented a technique called "forcing" to create a different mathematical structure in which all the standard axioms hold, *but* the Continuum Hypothesis is false. This showed that $\neg$CH is **consistent** with set theory.

  **The Conclusion:** Because you can build valid mathematical universes where CH is true, and valid mathematical universes where CH is false, the standard axioms of set theory are not strong enough to decide the issue. It is **undecidable** within standard mathematics.

  ### 2. The Geometry Analogy
  The situation is exactly analogous to the **Parallel Postulate** in geometry.

  For 2,000 years, mathematicians tried to prove that parallel lines never meet using the other axioms of Euclidean geometry. They couldn't.
  *   Eventually, it was proven that you can have **Euclidean Geometry** (parallel lines never meet).
  *   It was also proven that you can have **Hyperbolic Geometry** (parallel lines diverge).

  We don't say the Parallel Postulate is "false." We say it is independent of the other axioms. You can choose to work in a geometry where it is true, or one where it is false, depending on what you are studying.

  Set theory is now in the same position. We have "CH-Universes" and "Non-CH-Universes."

  ### 3. Why is it still listed as an "Open Problem"?
  If it's settled that CH is independent, why do mathematicians still talk about it as if it's unresolved?

  This depends on what you mean by "solved."
  *   **Solved relative to ZFC:** Yes, it is solved. We know ZFC cannot decide it.
  *   **Solved relative to "Truth":** No. Many mathematicians believe there is a single, "true" universe of sets, and that our current axioms (ZFC) are just incomplete. They view the independence result as a sign that we are missing a fundamental axiom, not as a sign that CH has no answer.

  Consequently, modern set theory is largely focused on finding **new axioms** that are "natural" or "compelling" enough to be added to ZFC.
  *   Some proposed axioms (like certain **Forcing Axioms**) imply that CH is **false**.
  *   Other proposed axioms (like the **Inner Model Hypothesis**) lean toward CH being **true**.

  Because there is no consensus on which new axioms to adopt, the question "What is the true size of the continuum?" remains philosophically and mathematically open.

  ### 4. Why did the book say Cohen proved it false?
  There are three likely reasons the pop math book misled you:

  1.  **Sensationalism:** "Cohen broke math" sells better than "Cohen proved math is incomplete."
  2.  **Confusion:** The author may have confused "consistent with negation" with "proven false."
  3.  **Philosophical Stance:** Some modern set theorists (like W. Hugh Woodin) have argued strongly that new evidence suggests CH *is* actually false in the "true" universe of sets. The book may have presented this minority (though respected) viewpoint as established fact.

  ### Summary
  *   **Did Cohen prove CH is false?** No.
  *   **Did he prove CH cannot be proven?** Yes.
  *   **Is CH independent?** Yes.
  *   **Is it settled?** It is settled that ZFC can't answer it. It is **not** settled whether CH is objectively true or false in the broader context of mathematical reality.

  Mathematicians call it independent because, within the rules we all agree to use (ZFC), it is impossible to win or lose the game. You have to change the rules (add axioms) to get a definitive answer.
