      *   **The Glitch:** The AI tries to process moral logic as attitude expressions. When faced with a conditional, it can't find the "attitude" to log because no attitude is being asserted in the antecedent. It creates a dissonance between the *syntax* (which looks propositional) and the *semantics* (which are non-cognitive).

