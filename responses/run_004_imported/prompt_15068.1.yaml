  7.  **Final Polish:** Ensure the distinction between *forward-looking purpose* (which biology rejects) and *backward-looking normativity* (which teleosemantics relies on) is clear. The user's worry is that backward-looking history creates forward-looking norms. That's the philosophical hinge.

