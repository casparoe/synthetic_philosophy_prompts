answer: |-
  You are not missing anything. In fact, your biologist's nose is smelling exactly what the sharpest critics in the philosophy of mind have been sniffing at for thirty years.

  Your instinct—that **teleosemantics** might be **teleology** in a cheap tuxedo—is one of the central debates in the field. As an evolutionary biologist, you were trained to treat "function" as a shorthand for "history of selection." But in philosophy of mind, "function" is often asked to carry a normative load (truth, error, representation) that selection history struggles to support without smuggling in a bit of Aristotelian final cause.

  Here is the breakdown of why your suspicion is warranted, where the teleosemanticists think they've secured the perimeter, and where the fence is still leaking.

  ### 1. The Teleosemantic Pitch: "It's Backward-Looking"
  Ruth Millikan and her colleagues (like David Papineau) are acutely aware of the danger you spotted. Their defense rests on a strict distinction between **forward-looking purpose** (teleology) and **backward-looking etiology** (teleonomy).

  *   **The Claim:** When Millikan says a mental state has a "proper function," she does not mean it was designed *in order to* achieve a goal. She means it is a token of a type that was *replicated in the past because* it achieved a specific effect.
  *   **The Analogy:** Just as the heart's function is to pump blood not because it "aims" to, but because ancestor-hearts pumped blood and that caused lineage survival, a neural state's function is to track predators because ancestor-neural-states tracked predators and that caused survival.
  *   **The Naturalism:** Since selection history is a purely physical, causal process (variation, inheritance, differential reproduction), they argue the "function" is naturalistic. There is no mystic "aiming," just a causal chain of replication.

  From this视角, they aren't sneaking teleology in; they are defining "purpose" entirely as "historical success."

  ### 2. Where Your Instinct Hits the Nail: The Normativity Problem
  Here is where your "verbal trick" radar should be pinging.

  In biology, saying a heart has a "function" is descriptive. If a heart fails to pump, it's a broken heart. But in **semantics**, we need **normativity** to explain **misrepresentation**. For a mental state to have content (e.g., "There is a tiger"), it must be possible for that state to be *false*.

  *   **The Teleosemantic Move:** A state means "Tiger" because it was selected for tracking tigers. If it fires when there is no tiger, it is malfunctioning (a misrepresentation).
  *   **The Problem:** How do you get an "ought" (this state *ought* to track tigers) from an "is" (ancestors *did* track tigers)?

  This is the **Is-Ought gap** applied to evolution. You know better than anyone that evolution is a tinkerer, not an engineer. Selection explains why a trait *persisted*, but does it establish a *standard of correctness*?

  If a frog's visual system fires at small, dark, moving specks (flies), but also fires at BB pellets, what is the content? "Fly"? Or "Small dark moving thing"?
  *   If the content is "Fly," then snapping at a BB is an **error**.
  *   If the content is "Small dark moving thing," then snapping at a BB is **correct**, and the frog never makes mistakes.

  Millikan argues selection fixes the content to "Fly" because that's what contributed to fitness historically. But as you know, selection acts on phenotypes and reproductive success, not on semantic truth. If snapping at BBs doesn't kill the frog, selection doesn't "care." So, where does the normative force come from that says the frog is *wrong*? Critics argue teleosemantics implicitly assumes a "goal" (truth/accuracy) that evolution never actually set.

  ### 3. The "Fitness vs. Truth" Gap
  This is the biological objection to the philosophical theory. Teleosemantics assumes that what was selected for is **truth-tracking**. But as an evolutionary biologist, you know that what is selected for is **fitness-enhancing**.

  Sometimes truth tracks fitness. Often, it doesn't.
  *   **Adaptive False Beliefs:** An organism might be selected for a "better safe than sorry" heuristic. A neural state that fires "Predator!" at every rustle in the grass has high fitness value, even if it is semantically false 90% of the time.
  *   **The Teleosemantic Dilemma:** If the content is determined by what was selected for, and what was selected for was "panic at rustles" (fitness) rather than "detect predators" (truth), then the content of the belief is "Rustle," not "Predator." But then the animal isn't representing the world; it's just reacting to stimuli.

  If teleosemantics can't distinguish between a state selected for *truth* and a state selected for *utility*, it fails to explain meaning. It just explains behavior. Many critics (like Jerry Fodor) argued that teleosemantics collapses into behaviorism because it grounds meaning in survival consequences rather than causal relations to the world.

  ### 4. The "Swampman" Intuition Pump
  There is one more angle where your "verbal trick" suspicion is validated by the broader philosophical community.

  Donald Davidson proposed a thought experiment: **Swampman**. A lightning strike destroys you and simultaneously rearranges molecules in a swamp to create a perfect physical duplicate of you.
  *   **Teleosemantics says:** Swampman has no mental content. Why? Because he has no selection history. His states have no "proper function."
  *   **Intuition says:** Swampman thinks and sees just like you.

  If you find it absurd that a physically identical brain lacks thoughts just because it lacks a history, then you agree with the critics that teleosemantics is placing too much weight on the historical narrative and not enough on the current causal structure. It suggests the "history" part is doing work that feels external to the actual mind.

  ### The Verdict: Is it Naturalistic or a Trick?
  It is not *just* a verbal trick, because it forces philosophers to be precise about how biological history constrains current capacity. It successfully naturalized the *concept* of function for many people.

  However, **you are right to feel it hasn't fully exorcised teleology.**
  1.  **Implicit Normativity:** It relies on a notion of "success" (reproduction) that it quietly treats as "correctness" (truth). That slide is where the teleology hides.
  2.  **Selection for What?:** It assumes selection can individuate specific semantic contents, whereas biology suggests selection individuates broad behavioral dispositions.

  **What you're missing is nothing.** You are identifying the exact friction point where biology meets metaphysics. Teleosemantics is a bold attempt to use the only naturalistic account of purpose we have (evolution) to explain the only non-physical-seeming thing we have (meaning).

  Some philosophers (like Peter Godfrey-Smith, who also has a biology background) have argued that we should treat teleosemantics as a useful model rather than a literal reduction. It works well for simple perceptual systems (frog flies) but likely fails for complex human cognition (beliefs about quantum mechanics).

  So, keep your skepticism. It's the same skepticism that keeps biology honest. Teleosemantics is a fascinating framework, but it hasn't quite managed to get the "ought" out of the "is" without leaving a few teleological fingerprints on the doorframe.
