prompt: |-
  I spent my working life as an evolutionary biologist, and one of the first things drilled into us was to say 'teleonomy' instead of 'teleology', precisely so you never accidentally imply evolution is aiming at some goal. Now that I'm retired and reading philosophy of mind for fun, I keep bumping into 'teleosemantics' -- Millikan's idea that a mental state gets its content from the 'proper function' it was selected for -- and honestly it smells like teleology sneaking back in through the side door to do the heavy lifting on meaning. Is the historical, selection-based framing actually enough to keep this naturalistic, or is it just a verbal trick that relabels the same old purposiveness everybody agreed to ditch after Darwin? Genuinely curious what im missing here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Background:** Retired evolutionary biologist. Deeply familiar with the distinction between teleology (goal-directed, purposeful design) and teleonomy (apparent purpose resulting from natural selection).
      *   **Current Interest:** Reading philosophy of mind (specifically teleosemantics) for fun.
      *   **Core Concern:** Suspects that "teleosemantics" (specifically Millikan's version) is smuggling teleology back into naturalism under the guise of "proper function" and selection history. Feels like a verbal trick.
      *   **Question:** Is the historical/selection-based framing enough to keep it naturalistic, or is it just relabeled purposiveness?
      *   **Tone:** Intellectual, skeptical, experienced, conversational but rigorous.

  2.  **Deconstruct the Philosophical Issue:**
      *   **Teleology vs. Teleonomy:** In biology, teleology implies a forward-looking purpose (Aristotelian final causes). Teleonomy implies backward-looking explanation (selection history). The user knows this well.
      *   **Teleosemantics:** A theory of mental content (semantics) that grounds meaning in biological function. Key figures: Ruth Millikan, David Papineau, Fred Dretske.
      *   **The "Problem of Intentionality":** How do physical states (brain states) represent things (have content)? Naturalism wants to explain this without invoking magic or non-physical minds.
      *   **The User's Worry:** If we say a belief means $X$ because it was *selected for* tracking $X$, aren't we saying evolution *aimed* at truth/representation? Isn't "proper function" just a normative term disguised as descriptive?
      *   **Key Distinction:** Forward-looking purpose (teleology) vs. Backward-looking etiology (teleonomy/etiological function).

  3.  **Evaluate the Validity of the User's Suspicion:**
      *   The user is *right* to be suspicious. This is a major debate in philosophy of mind.
      *   Critics (e.g., Fodor, Cummins, Godfrey-Smith) argue exactly what the user suspects: that teleosemantics relies on a notion of "function" that is either too weak to ground content or too strong (smuggling in normativity).
      *   Defenders argue that "etiological function" is strictly backward-looking and naturalistic.

  4.  **Drafting the Response - Section by Section:**

      *   **Acknowledge and Validate:** Start by respecting their expertise. Their instinct is spot-on. This is *the* central tension in teleosemantics.
      *   **Define the Stake:** Clarify what teleosemantics is trying to do (naturalize intentionality).
      *   **The "Backward-Looking" Defense (The Pro-Teleosemantics View):** Explain how Millikan argues this is purely historical. No future goals, just past success. Analogy: The heart pumps blood not because it *wants* to, but because ancestors did. Same for neural states.
      *   **The "Normativity" Problem (The User's Worry):** This is the crux. "Proper function" implies a standard of success/failure (misrepresentation). How do you get "ought" from "is"? If a state fails to track, it's a "misrepresentation." But who says it *should* track? Selection history says so, but is that enough for *meaning*?
      *   **Key Objections (The "Swampman" and "Indeterminacy"):**
          *   *Swampman:* A duplicate created by chance has no history. Does it have thoughts? Teleosemantics says no. Intuition says yes.
          *   *Indeterminacy:* Selection selects for survival, not truth. A frog snaps at flies. Did it select for "fly" or "small dark moving thing"? (The disjunction problem).
      *   **Is it a Verbal Trick?** Address this directly. It's not *just* a trick, but it might be incomplete. It shifts the burden from "mind" to "evolution," but evolution doesn't care about truth, only fitness.
      *   **Conclusion:** Summarize. The user isn't missing anything; they've identified the fault line. It's a productive tension, not a solved problem.

