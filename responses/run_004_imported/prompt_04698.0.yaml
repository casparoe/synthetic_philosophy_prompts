      *   *Risk:* Am I minimizing the grief?
      *   *Mitigation:* Acknowledge that the *need* for connection is real, even if the *source* is questionable.
      *   *Key Insight:* The user is a biologist. They understand controls. I should speak that language. The daughter wants closure; the scientist wants data. Both are valid needs, but they conflict.

