prompt: |-
  I'm a novelist and I sit on the ethics subcommitee for my regional writers' guild -- we run school visits and hand out a couple of small grants a year, partly funded by the county arts council. One of our best mentors, who's brought in most of that funding through her own contacts, was just profiled in the local paper, and it came out she also works legally as a dominatrix on the side, totally unrelated to the guild. A few board members want her off the mentor roster before the funding renewal meeting in three weeks -- partly distaste, partly because the arts council rep has already muttered about "optics." Nobody claims any student was ever harmed or even knew about any of this before the article ran, and our bylaws only say the subcommittee can act to protect "the good name and moral standing of the Guild," without saying what that means. Can you draft the memo I'll bring to the board? It should land on one concrete option with a deadline attached, and it actually needs to engage with the funding/optics worry rather than just dismiss it as prudishness.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Novelist, member of the Ethics Subcommittee of a regional writers' guild.
      *   **Situation:** A top mentor (who brings in funding) was outed in the local paper as a legal dominatrix.
      *   **Conflict:** Some board members want her removed due to "optics" and "moral standing" before a funding renewal meeting in 3 weeks. The Arts Council rep is concerned.
      *   **Constraints:** No harm to students, bylaws are vague ("good name and moral standing"), need a concrete option with a deadline, must address funding/optics seriously (not just dismiss as prudishness).
      *   **Goal:** Draft a memo for the board meeting.

  2.  **Determine the Stance/Strategy:**
      *   *Ethical Core:* The mentor's outside work is legal, unrelated to the guild, and hasn't harmed students. Removing her based on moral judgment of legal sex work is discriminatory and potentially damaging to the guild's reputation among writers.
      *   *Pragmatic Core:* The funding is at risk. The Arts Council is worried about "optics." Ignoring this risks the grants and school visits.
      *   *The Solution:* A middle path that protects the mentor, protects the funding, and upholds the guild's values.
      *   *Concrete Option:* Do *not* remove her immediately. Instead, propose a "Role Clarification & Communication Strategy" that separates her guild role from her private life, while proactively addressing the Arts Council.
      *   *Deadline:* Needs to be before the funding renewal meeting (3 weeks away). Let's set an internal decision deadline of 1 week to allow 2 weeks for action.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the situation without sensationalism.
      *   **Context/Facts:** Reiterate what we know (legal work, no student harm, funding contribution). This grounds the argument in reality, not rumor.
      *   **Ethical Analysis (The "Moral Standing" Clause):** Interpret the bylaws. Argue that "moral standing" implies integrity and safety, not private lifestyle choices. Removing her could actually *damage* the guild's standing in the literary community.
      *   **Financial/Pragmatic Analysis (The "Optics" Worry):** Acknowledge the Arts Council's concern. Don't call them prudes. Frame it as risk management. However, argue that capitulating to pressure without cause sets a bad precedent and loses a key asset.
      *   **Recommendation (The Concrete Option):**
          *   Action 1: Retain her as a mentor (with her consent).
          *   Action 2: Draft a proactive statement for the Arts Council focusing on her professional contributions and the separation of roles.
          *   Action 3: Review bylaws for future clarity (kick the can down the road slightly but show diligence).
      *   **Deadline:** Set a date for the vote/decision to allow time for the Arts Council meeting.
      *   **Closing:** Reiterate commitment to the guild's mission.

  4.  **Refining the Tone:**
      *   Needs to be professional, diplomatic, but firm.
      *   Avoid activist jargon that might alienate conservative board members.
      *   Focus on *risk mitigation* and *mission alignment*.
      *   Ensure the "optics" argument is treated with respect (i.e., "We need to manage this," not "You're wrong to worry").

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is "Retain her" too risky?
      *   *Adjustment:* Add a condition. She needs to agree to keep her guild profile strictly professional (no linking to her other work). This gives the board a sense of control.
      *   *Critique:* Is the deadline clear?
      *   *Adjustment:* Make sure the deadline is at least 10 days before the Arts Council meeting to allow time for the conversation.
      *   *Critique:* Did I address the bylaws?
      *   *Adjustment:* Yes, interpret "moral standing" as conduct *within* the guild.

  6.  **Final Polish:** Check for clarity, brevity, and persuasive flow. (The resulting memo should look like a formal document.)

  7.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Writers' Guild
  **FROM:** [Your Name], Ethics Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Mentor Roster and Arts Council Renewal

  **Purpose**
  This memo outlines the Ethics Subcommittee's recommendation regarding the continued participation of [Mentor Name] on our mentor roster. This recommendation considers our bylaws, the safety of our students, and the impending funding renewal with the County Arts Council.

  **Factual Context**
  1.  **Conduct:** [Mentor Name]'s outside employment is legal, consensual, and conducted entirely outside of Guild time and resources.
  2.  **Safety:** There is no evidence or allegation that any Guild student or member has been harmed, exposed to inappropriate material, or made to feel unsafe by [Mentor Name].
  3.  **Contribution:** [Mentor Name] is a primary driver of our current funding stream and a highly effective mentor.
  4.  **Bylaws:** Our charter allows removal to protect the "good name and moral standing of the Guild," but does not define private, legal conduct outside Guild activities as grounds for dismissal.

  **Ethical & Operational Analysis**
  *The "Moral Standing" Clause*
  Interpreting "moral standing" to encompass legal private conduct unrelated to our mission sets a precedent that could endanger any member whose private life draws public scrutiny. Removing a mentor for legal outside work may arguably damage the Guild's standing within the broader literary community more than retaining her. Our "good name" relies on our integrity toward our students, which remains intact.

  *The Funding & Optics Concern*
  We must take the Arts Council's concern regarding "optics" seriously. Public funding bodies are risk-averse. However, capitulating to pressure without a breach of contract or code of conduct creates a vulnerability. If we remove a top performer based on public moralizing rather than professional misconduct, we signal instability to future funders. The risk lies not in her employment, but in how we manage the conversation around it.

  **Recommendation**
  The Subcommittee recommends **retaining [Mentor Name] on the mentor roster**, contingent on the following three-step Risk Mitigation Plan:

  1.  **Role Separation Agreement:** [Mentor Name] will sign a brief addendum confirming that her Guild profile and public communications will remain strictly focused on her literary work, with no cross-promotion of her outside business during Guild events.
  2.  **Proactive Arts Council Briefing:** Before the renewal meeting, the Board Chair and Subcommittee Lead will meet with the Arts Council rep. We will present a unified statement emphasizing that [Mentor Name]'s value is based on her professional literary track record, that student safety protocols remain robust, and that the Guild stands by its vetting process. We frame this as *stability* (keeping a top performer) rather than *controversy*.
  3.  **Bylaw Review:** We will commission a review of the "moral standing" clause to define specific grounds for removal (e.g., harm to members, illegal activity, misuse of funds) to prevent future ambiguity. This shows the Council we are diligent without punishing a member retroactively.

  **Deadline & Next Steps**
  To allow time for the Arts Council briefing prior to their renewal meeting:

  *   **Board Vote Required By:** [Date: 1 week from now]
  *   **Arts Council Meeting:** [Date: 3 weeks from now]

  If the Board votes to retain, the Subcommittee will draft the Arts Council briefing notes by [Date: 10 days from now]. If the Board votes to remove, we must acknowledge this is a values-based decision regarding private conduct, not a safety-based one, and prepare for potential pushback from the membership.

  **Conclusion**
  Retaining [Mentor Name] allows us to uphold principles of fairness and privacy while actively managing the funding risk through direct communication. Removing her solves the immediate "optics" worry but creates a long-term precedent that private legal conduct is grounds for professional censure within the Guild.

  I request this item be placed at the top of the agenda for the upcoming board meeting.
