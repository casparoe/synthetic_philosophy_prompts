      *   **Concept 3: Frequency.** Normal weeks are 90% of the business. Optimizing for the 10% (holidays) at the expense of the 90% is bad math.
      *   **Concept 4: The "Exactly Right" Fallacy.** Hitting the exact number is often luck in complex systems. Consistency is skill.

