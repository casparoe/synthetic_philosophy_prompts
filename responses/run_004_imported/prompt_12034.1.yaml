answer: |-
  First, I am sorry for your loss. Dealing with estate division while grieving is difficult enough without it turning into a live case study for your dissertation.

  Since you are in the weeds of this field, I will skip the intro 101 and go straight to the technical distinction. Your intuition is not just bias; it aligns with the dominant consensus in contemporary egalitarian theory regarding the **"Expensive Tastes" objection**.

  The core problem your brother is raising is the standard critique of **Welfare Egalitarianism** (equality of well-being). If the *telos* of distribution is equal welfare, then yes, logically, the person with the higher threshold for satisfaction requires more resources to reach the baseline. However, almost every major theorist from Dworkin to Cohen to Sen rejects this conclusion for principled reasons.

  Here is the breakdown of why your sister's claim holds and your brother's fails, based on three distinct frameworks you likely already know well.

  ### 1. Luck Egalitarianism: Brute Luck vs. Option Luck
  This is the most direct rebuttal. The distinction lies in **responsibility for the deficit**.

  *   **Your Sister (Brute Luck):** Her chronic illness is a "brute luck" disadvantage. It is an unchosen circumstance that lowers her conversion rate of resources into functionings. She did not choose to be ill, nor does she likely endorse the condition. Luck egalitarianism dictates that society (or in this microcosm, the estate) should compensate for unchosen disadvantages.
  *   **Your Brother (Option Luck/Cultivated Preference):** His "expensive tastes" are generally viewed as matters of **option luck** or cultivated preference. Unless he can argue that his inability to find happiness in cheap things is a psychological compulsion (a mental health condition rather than a preference), he is responsible for his own utility function.
  *   **The Principle:** We compensate for deficits in *capacity*, not deficits in *standards*. To subsidize your brother is to penalize you for having modest tastes. As G.A. Cohen argued, if we compensate for expensive tastes, we effectively tax the frugal to subsidize the hedonistic, which violates the principle of equal respect.

  ### 2. Resource Egalitarianism (Dworkin): The Hypothetical Insurance Market
  Dworkin's distinction between **resources** and **welfare** is designed specifically to solve this problem.

  *   **The Auction:** In Dworkin's hypothetical auction, your sister would purchase insurance against developing a chronic illness because it impedes her ability to participate in life regardless of her preferences.
  *   **The Taste Test:** Would a rational agent in the original position purchase insurance against "developing a taste for only expensive things"? Generally, no. That is viewed as a preference *about* resources, not a lack *of* resources.
  *   **The Principled Difference:** Your sister lacks the **physical capacity** to convert standard resources into a normal life without extra cost. Your brother lacks the **psychological willingness** to convert standard resources into happiness. Justice addresses the former (handicaps/disabilities), not the latter (preferences). Dworkin explicitly argues that expensive tastes are a burden the individual must bear, whereas disabilities are a burden the community shares.

  ### 3. The Capability Approach (Sen/Nussbaum): Functionings vs. Utilities
  If you frame this in terms of Capabilities, the distinction becomes even sharper.

  *   **Sister:** Her illness restricts her **Capability Set**. She literally cannot achieve certain functionings (health, mobility, economic security) without more resources. This is an objective restriction on her freedom.
  *   **Brother:** His capability set is intact. He *can* buy the cheap stuff; he just *won't* enjoy it as much. This is a subjective utility issue.
  *   **The Metric:** Political justice (and arguably fair estate division) should aim to equalize **Capabilities** (the real opportunity to function), not **Utilities** (the subjective satisfaction derived). Your sister needs more money to reach the same *capability threshold* (basic functioning). Your brother has the capability; he just has a high *hedonic threshold*. Equalizing capabilities does not require equalizing hedonic thresholds.

  ### The One Caveat (Where your brother might have a leg to stand on)
  You need to vet his claim for **involuntariness**.
  *   If his "need for nice things" is actually a manifestation of a diagnosed psychological condition (e.g., severe depression where only specific stimuli provide relief, or a compulsive disorder), his claim shifts from "Expensive Tastes" to "Brute Luck/Mental Disability."
  *   If it is simply that he "prefers luxury," the Luck Egalitarian view holds: he is responsible for his own utility function.

  ### The "Family" Variable
  One final note, distinct from your PhD work: Political philosophy usually assumes impartiality among strangers. Family ethics often operate under **Partiality** and **Need**.
  *   Even if you treated them as strangers, the sister wins on Luck Egalitarian grounds.
  *   Within a family, the obligation to care for a vulnerable sibling (sister) is usually stronger than the obligation to subsidize a sibling's lifestyle preferences (brother).
  *   **The "Fairness to You" Argument:** If you give the brother more, you are effectively punishing yourself for having modest tastes. This creates a perverse incentive structure. If you reward the brother, you validate the idea that having higher demands is a claim on others' resources.

  ### Summary for your own sanity
  You are not biased; you are intuitively applying **Responsibility-Catering Egalitarianism**.
  1.  **Sister:** Unchosen disadvantage $\rightarrow$ Compensation required.
  2.  **Brother:** Chosen/Endorsed preference $\rightarrow$ Compensation not required.

  The principled difference is **agency**. Your sister is a victim of her biology; your brother is (presumably) the author of his preferences. Subsidizing the former is justice; subsidizing the latter is indulgence.

  Hope this helps clear the mental block so you can get back to writing (and settling the estate).
