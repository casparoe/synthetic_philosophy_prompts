      *   *Part 1: The Evidential Model.* It's not just Hume. It's Millian Induction. Sidgwick treats psychical phenomena not as "miracles" (violations of law) but as "new laws" needing empirical establishment. The "heap" is data for induction. It's a probabilistic argument from accumulation (Inference to the Best Explanation).
      *   *Part 2: Connection to MoE.*
          *   Similarities: The role of "credit" (PR) mirrors the role of "expert reflection" (MoE). Both use consensus to mitigate individual fallibility. Both are anti-dogmatic.
          *   Differences: Ethics seeks self-evidence (rational); PR seeks empirical probability.
          *   The "Tension": Is there one? Actually, Sidgwick sees PR as potentially *supporting* ethics (immortality -> sanctions for utilitarianism). But epistemologically, the tension is between Rationalism and Empiricism.
          *   Resolution: The continuity lies in his *critical method*. He applies the same rigorous, skeptical, consensus-seeking scrutiny to both domains. He refuses to accept "obvious" truths in either without testing.
      *   *Part 3: Specific focus on "Consensus of Experts".* In MoE, consensus validates intuition. In PR, the "heap of facts" *creates* a consensus among scientists. The "incredulous outsiders" in the PR quote are like the "unreflective masses" in Ethics. The "Society" acts like the community of moral philosophers.
      *   *Conclusion:* It's a methodological continuity despite a metaphysical/methodological dualism. He is the same "cautious rigorist" in both.

  6.  **Refine the Analysis (Self-Correction/Nuance Check):**
      *   *Did Sidgwick read Hume?* Yes, extensively. But he was also a Whewell/Mill disciple. The "heap of facts" sounds more like Whewell's "consilience of inductions" or Mill's methods.
      *   *Is "Consensus of Experts" in MoE exactly the same?* In MoE, it's a *test* for self-evidence. If experts disagree, it's not self-evident. In PR, consensus is the *result* of the accumulation. Slight difference in direction, but same function (social validation of truth).
      *   *The "Dualism":* Mention that Sidgwick hoped PR would solve the "dualism of practical reason" (virtue vs. happiness) by proving divine governance/immortality. This motivates the PR work. The epistemology serves the ethical goal.
      *   *Key Term:* "Scientific Incredulity." This is the prior. Sidgwick accepts the scientific worldview (natural law) and wants to expand it, not break it. This distinguishes him from religious apologists using Hume.

  7.  **Drafting the Response:** (Mental Outline)
