answer: |-
  This is an excellent question that cuts to the heart of Sidgwick's philosophical unity. You are right to sense that the epistemological machinery in the 1882 address is doing heavy lifting, and comparing it to *The Methods of Ethics* (MoE) is the correct strategy for understanding Sidgwick's broader project.

  Here is a breakdown of the evidential model at work in the SPR address and how it relates to his ethical epistemology.

  ### 1. The Evidential Model: Hume, Mill, or Something Else?

  You ask whether Sidgwick is deploying a Humean response to miracles or a purely inductive argument. The answer is that he is doing something distinctively **Sidgwickian**, which blends a Humean acknowledgement of priors with a **Millian inductive strategy.**

  **The Humean Element (The Prior):**
  Sidgwick explicitly acknowledges "scientific incredulity." He accepts the Humean premise that the prior probability of psychical phenomena (from the standpoint of established science) is vanishingly low. He agrees that a single testimony, no matter how credible ("fair stock of credit"), cannot overcome this prior on its own. In this sense, he accepts the Humean challenge: extraordinary claims require extraordinary evidence.

  **The Millian Element (The Accumulation):**
  However, Sidgwick diverges from the classic Humean framework on miracles. Hume treats miracles as violations of natural law, which makes them inherently unprovable by experience. Sidgwick, conversely, treats psychical phenomena not as *violations* of law, but as **new laws waiting to be discovered.**
  *   **The "Heap" as Induction:** When he speaks of "burying incredulity under a heap of facts," he is invoking a logic of **inductive generalization** (heavily influenced by J.S. Mill, whom Sidgwick admired). He is not trying to prove a singular miraculous event; he is trying to establish a *uniformity of nature* regarding thought-transference.
  *   **Weight of Evidence:** The model is less about Bayesian updating on a single event and more about **Inference to the Best Explanation** across a dataset. If you have enough independent instances ("experiment upon experiment"), the hypothesis that "there is a systematic error/fraud in all these cases" becomes less probable than the hypothesis that "a new phenomenon exists."

  **Verdict:** It is a **cumulative inductive argument.** Sidgwick is arguing that while the *prior* improbability is high (Hume), the *likelihood* of the evidence given the hypothesis increases with every independent data point (Mill). The "heap" transforms anomalies into a pattern, and patterns constitute scientific law.

  ### 2. Continuity with *The Methods of Ethics*

  Does this sit easily with the epistemology of *The Methods of Ethics*? Specifically, the condition of the **"consensus of experts"** (found in Book III, Chapter XI, where he outlines the criteria for self-evidence)?

  There is a profound **methodological continuity**, even if the **sources of knowledge** (reason vs. experience) differ.

  #### A. The Social Dimension of Justification
  In *MoE*, Sidgwick is wary of solitary moral intuition. He argues that for a proposition to be truly self-evident, it must withstand the scrutiny of other careful thinkers. The "consensus of experts" is a check against individual bias, parallax error, or idiosyncrasy.
  *   **In Ethics:** The "expert" is the philosopher who has reflected clearly and precisely.
  *   **In Psychical Research:** The "expert" is the witness with a "fair stock of credit" (scientific training, reputation for veracity).

  In both cases, Sidgwick refuses to accept **private certainty** as public knowledge. In Ethics, my intuition isn't binding until others share it. In Psychical Research, my observation isn't binding until it is added to the "heap" of corroborating observations. The epistemology in both is **anti-solipsistic**; truth is validated communally.

  #### B. Rigor and the Elimination of Error
  Sidgwick's driving motivation in both fields is the elimination of error.
  *   **In Ethics:** He seeks to purge moral axioms of ambiguity and emotional bias.
  *   **In SPR:** He seeks to purge phenomena of fraud, hallucination, and coincidence.

  The phrase "not wrangle too much with incredulous outsiders" is key here. In *MoE*, Sidgwick doesn't try to convince those unwilling to reflect rigorously; he writes for those capable of the method. Similarly, in the SPR address, he suggests ignoring the dogmatic skeptics ("incredulous outsiders") and focusing on the accumulation of data that will eventually compel the "common sense of mankind." In both domains, he relies on a **gradual convergence of competent judgment** rather than rhetorical victory.

  #### C. The Tension: Self-Evidence vs. Probability
  Here is where you might find friction for your seminar discussion.
  *   **Ethics:** Sidgwick aims for **certainty** (self-evidence). He wants moral axioms to be as certain as mathematical truths. The consensus of experts *confirms* this certainty.
  *   **Psychical Research:** Sidgwick aims for **probability**. He admits they may never "kill" incredulity entirely, only bury it. The consensus of witnesses *builds* probability.

  **Is this a tension?** It could be argued that Sidgwick holds ethics to a higher epistemic standard than science. However, a stronger reading is that he recognizes the *materials* differ. Reason *can* yield certainty (he thinks); experience *cannot*. Therefore, the method must adapt to the material. The continuity lies in the **rigor of the testing procedure**, not the degree of certainty achieved.

  ### 3. The "Dualism" and the Motivation for Continuity

  To really impress in your seminar, you should mention *why* Sidgwick cares about this continuity.

  Sidgwick famously suffered from the "Dualism of Practical Reason" (the conflict between Rational Egoism and Utilitarianism). He hoped that Psychical Research might provide a solution. If survival after death and divine governance could be empirically established (via the "heap of facts"), then the conflict between duty and self-interest might be resolved in the long run (via theological sanctions).

  Therefore, the epistemology of the SPR address is **in service of** the epistemology of *MoE*.
  *   He needs the SPR evidence to be scientifically robust (hence the "heap of facts") so that it can support the ethical system without undermining its rational foundation.
  *   If he allowed weak testimony in SPR, he would undermine the rigor he demands in Ethics.

  ### Summary for Your Discussion

  1.  **Evidential Model:** It is not strictly Humean (which focuses on the impossibility of proving a violation of law). It is **Millian Induction**. Sidgwick treats psychical phenomena as new natural laws to be established through cumulative data, overcoming low priors through volume and independence of evidence.
  2.  **Epistemic Continuity:** There is strong continuity in **methodological rigor**. Both Ethics and Psychical Research rely on **social validation** (Consensus of Experts vs. Witnesses with Credit) to overcome individual bias. Sidgwick distrusts the solitary mind in both morality and science.
  3.  **Epistemic Tension:** There is a difference in the *goal*: Ethics seeks self-evident certainty; SPR seeks empirical probability. However, this reflects the nature of the subject matter (Reason vs. Experience) rather than an inconsistency in Sidgwick's thinking.
  4.  **Strategic Unity:** Sidgwick's careful epistemology in SPR is designed to protect the integrity of his Ethics. He needs psychical evidence to be scientifically unassailable if it is to resolve the Dualism of Practical Reason.

  **Suggested Talking Point:** "Sidgwick's insistence on 'burying incredulity under a heap of facts' isn't just a scientific strategy; it's an ethical one. He applies the same demand for 'consensus' and 'rigor' to psychical testimony that he applies to moral intuition. He refuses to let wishful thinking certify a fact in the lab any more than he lets it certify an axiom in ethics."
