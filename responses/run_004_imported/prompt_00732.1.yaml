      *   **Core Question 1:** What model of evidential reasoning is at work here? Is it a Bayesian-style response to Hume on miracles (independent witnesses outweighing low priors) or a more general inductive weight-of-evidence argument?
      *   **Core Question 2:** Does this approach sit easily with his epistemology in *The Methods of Ethics* (specifically the "consensus of experts" condition for certified propositions)?
      *   **Goal:** Determine if there is continuity or tension between his psychical research epistemology and his ethical epistemology.

  2.  **Deconstruct the Passage (SPR Address, 1882):**
      *   *Key Metaphor:* "Burying [incredulity] alive under a heap of facts."
      *   *Key Mechanism:* Accumulation ("fact upon fact," "experiment upon experiment").
      *   *Key Constraint:* Individual witnesses have "credit," but single pieces of evidence aren't "decisive."
      *   *Target:* "Scientific incredulity" (which implies a strong prior belief *against* the phenomena).
      *   *Strategy:* Don't argue about individual cases; trust the *mass*.

  3.  **Analyze Question 1: Model of Evidential Reasoning:**
      *   *Hume on Miracles:* Hume argues that no testimony is sufficient to establish a miracle unless the falsehood of the testimony would be *more* miraculous than the miracle itself. This is often interpreted probabilistically (prior probability of miracle is so low, evidence must be overwhelming).
      *   *Sidgwick's Approach:* He acknowledges "scientific incredulity" (low prior). He admits single witnesses/experiments aren't enough ("credit alone is not likely to suffice"). He calls for *accumulation*.
      *   *Is it Humean?* In a way, yes, it accepts the Humean challenge (high bar for extraordinary claims). But the *solution* is cumulative. It's not just "more witnesses to the *same* event" (which Hume might discount if they collude or share bias), but "fact upon fact, experiment upon experiment." This sounds more like *inductive generalization* or *inference to the best explanation* based on a pattern, rather than a strict Bayesian updating on a single miracle claim.
      *   *Nuance:* Sidgwick is a methodological rigorist. He wants scientific respectability. The "heap of facts" isn't just a pile of anecdotes; it's a systematic accumulation of *experiments* and *witnesses with credit*. This aligns with a Millian inductive logic (Sidgwick was influenced by Mill). It's about establishing a *law* through repeated observation, not just verifying a singular anomaly.
      *   *Conclusion on Q1:* It's a hybrid. It acknowledges the Humean problem of priors ("scientific incredulity") but proposes a Millian/Inductive solution (cumulative weight establishing a general law rather than proving a specific miracle).

  4.  **Analyze Question 2: Connection to *The Methods of Ethics* (MoE):**
      *   *MoE Epistemology:* Sidgwick is a foundationalist/coherentist hybrid regarding moral intuitionism. He seeks "self-evident" axioms. How does he certify them?
          *   Criteria for Self-Evidence (MoE Book III, Chap XI):
              1.  Clarity and precision of terms.
              2.  Self-evidence must be ascertained by careful reflection.
              3.  **Consistency** (mutual harmony of axioms).
              4.  **Consensus of Experts** (agreement among those who have reflected carefully).
      *   *Psychical Research (PR) Epistemology:* Empirical, inductive, cumulative. Based on external observation and testimony.
      *   *Comparison:*
          *   *MoE:* A priori (mostly), rational intuition, seeking certainty/self-evidence. Consensus confirms *rational insight*.
          *   *PR:* A posteriori, empirical observation, seeking probability/certainty through volume. Consensus (of witnesses/experts) confirms *empirical fact*.
      *   *Tension?*
          *   *Surface:* One is rationalist/intuitionist, the other is empiricist/inductivist.
          *   *Deep:* Both rely on *consensus* to overcome individual error/bias. In MoE, the "expert" is the careful moral reflector. In PR, the "expert" is the credible witness/scientist.
          *   *The "Heap" vs. The "Axiom":* In MoE, one clear intuition (if truly self-evident) *should* carry weight, but Sidgwick is cautious and wants consensus. In PR, he explicitly denies single pieces of evidence carry enough weight.
          *   *Continuity:* The underlying virtue is *caution* and *methodological rigor*. Sidgwick is deeply worried about error (parallax error in ethics, fraud/fallacy in PR). Both methodologies are designed to filter out subjective bias.
          *   *Discontinuity:* The *source* of justification. Ethics = Reason. PR = Experience. Sidgwick himself noted this dualism (the "dualism of practical reason" is famous, but there's also a methodological dualism). However, the *structure* of justification (consensus, rigorous scrutiny, overcoming bias) is continuous.

  5.  **Synthesize the Argument:**
