      *   **Current Activity:** Reading John Dewey's *The Public and Its Problems* (post-retirement).
      *   **Specific Trigger:** Dewey's critique of Walter Lippmann regarding experts: "A class of experts is inevitably so removed from common interests as to become a class with private interests and private knowledge, which in social matters is not knowledge at all."
