answer: |-
  This is a profound question, and it comes from exactly the right place to ask it. You have lived the tension Dewey is diagnosing. When you sat in those hearings listening to residents describe things your model didn't capture, you were encountering the limit of what Dewey calls "technical inquiry" and the beginning of what he calls "social inquiry."

  To answer your specific question: **No, this is not rhetorical overreach.** It is a precise epistemological claim rooted in Dewey's instrumentalism. However, to see why it isn't just anti-intellectual populism, you have to accept Dewey's radical redefinition of what "knowledge" *is*.

  Here is the argument buried in that line, broken down by how it applies to your experience in toxicology versus the social sphere.

  ### 1. Knowledge as a Tool, Not a Picture
  In the positivist tradition (which likely underpinned your training), knowledge is a correct representation of reality. If your model accurately predicts the concentration of a toxin in the groundwater, you have "knowledge."

  For Dewey, knowledge is **instrumental**. It is "warranted assertibility." A claim counts as knowledge only if it successfully guides action to resolve a *problematic situation*.

  *   **In Toxicology:** The problematic situation is "What is the causal relationship between substance X and biological outcome Y?" The community of inquiry is other toxicologists. The validation is replication. Your models produced knowledge *in this domain*.
  *   **In Social Matters:** The problematic situation is "How shall we live together given the consequences of substance X?" The community of inquiry is the public bearing the consequences. The validation is the resolution of the conflict and the restoration of communal functioning.

  Dewey's claim is that if you take the tools from the first domain (toxicology) and apply them to the second domain (social policy) without the participation of the second community, the tool breaks. It no longer resolves the situation. Therefore, strictly speaking, it ceases to function as knowledge *in that context*. It becomes "private knowledge"—useful to the expert's career or the agency's liability, but useless for resolving the social trouble.

  ### 2. The "Felt Difficulty" and Problem Framing
  You mentioned Dewey's view that inquiry starts from a "felt difficulty." This is the crux of the argument against Lippmann.

  Lippmann believed experts could define the problem, solve it, and hand the solution to the public. Dewey argues that **defining the problem is already a political act.**

  In your work, the agency likely framed the problem as: *"Is the exposure above the regulatory threshold?"*
  The residents framed the problem as: *"Will my children get sick?"* or *"Why don't you trust us?"* or *"Our property values are destroyed."*

  If the expert accepts the first framing as the *only* reality, they are ignoring the actual "felt difficulty" of the situation. They are solving a puzzle, not a problem.
  *   **Puzzle:** A technical mismatch (ppm vs. threshold).
  *   **Problem:** A disruption in the life of the community.

  Dewey argues that in social matters, you cannot separate the *facts* of the case from the *values* of the people affected. An "acceptable risk" is not a fact discoverable by a mass spectrometer; it is a value judgment made by those who must accept the risk. If an expert determines "acceptability" without the input of those accepting the risk, they are not generating knowledge about the *social* situation; they are generating a dictate. A dictate is not knowledge.

  ### 3. Means vs. Ends
  This is where your career experience likely validates Dewey most sharply.

  Science is excellent at determining **means**. (How do we clean the water? What is the toxicity level?)
  Politics is the domain of **ends**. (Is it worth the cost? What level of safety do we demand?)

  The danger Dewey identifies—and which you likely saw in your agency—is when experts smuggle *ends* into their *means* analysis. By setting the "acceptable threshold," the toxicologist is implicitly deciding how much risk the public *should* tolerate. That is a moral and political decision, not a scientific one.

  When Dewey says expert knowledge in social matters is "not knowledge at all," he means that **expertise cannot scientifically derive values.** If an expert claims their model dictates the policy outcome, they are making a category error. They are presenting a value judgment (this risk is fine) disguised as a technical fact (this risk is below 10^-6). Because the foundation of that claim is hidden, it cannot be tested or validated by the public. It is "private knowledge."

  ### 4. The Conditions of Validation
  Finally, consider how knowledge is validated.
  *   **Natural Science:** Validated by peers who share the same training and methods.
  *   **Social Inquiry:** Validated by the consequences experienced by the community.

  If a bridge holds, the engineer has knowledge, even if the public doesn't understand the physics. The physical world responds consistently regardless of public opinion.
  But the *social* world does not work that way. If the public does not *accept* the risk assessment, the social problem is not resolved. Litigation continues, trust erodes, non-compliance rises, anxiety spreads. The "solution" failed.

  For Dewey, if the inquiry does not include the people who constitute the "Public" (those affected by the indirect consequences of a transaction), the inquiry lacks the necessary data to function. The "data" of social inquiry includes the fears, values, and local knowledge of the residents. Without that data, the model is empirically incomplete regarding the *social* reality, even if it is chemically perfect.

  ### Summary: Is it Rhetoric?
  It is not rhetoric. It is a boundary marker.

  Dewey is not saying you were wrong about the chemistry. He is saying that **chemistry is not politics.**

  When you moved from the lab to the hearing room, you moved from a domain where expert isolation is a virtue (to prevent bias) to a domain where expert isolation is a vice (because it creates bias toward institutional interests).

  The argument holds up if you accept that "social knowledge" requires a different method of verification than "natural knowledge."
  *   **Natural Knowledge:** Correspondence with physical reality.
  *   **Social Knowledge:** Consensus on action among affected parties.

  If you define "knowledge" in social matters as "that which allows the community to move forward together," then an expert decree that the community rejects literally fails to be knowledge. It fails to do the job of knowledge.

  **The takeaway for your reflection:**
  You spent 35 years building models that were scientifically robust but often socially brittle. Dewey isn't asking you to doubt your toxicology. He is asking you to recognize that the *risk assessment* was only half the inquiry. The other half—the valuation of that risk—required a different kind of intelligence (the public's) to complete the circuit. Without that completion, the "knowledge" remained private, and the problem remained unsolved.

  That is a hard lesson for any technocrat, but given your description of those hearings, it sounds like you already know it in your bones. Dewey just gave you the vocabulary for why it felt that way.
