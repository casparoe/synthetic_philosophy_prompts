      *   **Tone:** Intellectual, reflective, slightly skeptical but open, experienced, precise ("I want to know if there's a real argument buried here").

  2.  **Deconstruct Dewey's Claim:**
      *   *Context:* The debate with Lippmann (*Public Opinion*). Lippmann argued the public is a "bewildered herd" and experts should manage governance. Dewey argues democracy is a way of life, not just a mechanism.
      *   *The Quote:* "Private knowledge... in social matters is not knowledge at all."
      *   *Dewey's Epistemology:* Knowledge isn't a static representation of reality (spectator theory). It's instrumental. It arises from problematic situations and is validated by its ability to resolve them *for the community involved*.
      *   *Social Matters:* Unlike atoms or toxins, social matters involve values, consequences, and shared experience. You can't separate the "fact" of the exposure from the "value" of the risk borne by the community.

  3.  **Address the Core Tension (Toxicology vs. Social Inquiry):**
      *   *Toxicology (Natural Science):* Deals with causal mechanisms (dose-response). Can be isolated in a lab. The "public" doesn't need to participate to determine LD50.
      *   *Social/Political Inquiry:* Deals with *consequences* and *values*. Who bears the risk? What is "acceptable"? These aren't facts discoverable by a spectrometer; they are judgments made by those affected.
      *   *Dewey's Point:* If an expert calculates risk but ignores the lived experience of the risk (the "felt difficulty"), they haven't solved the *social* problem, only the *technical* one. Therefore, their "knowledge" is incomplete/invalid *as social knowledge*.

  4.  **Formulate the Argument:**
      *   **Validate the User:** Acknowledge their experience. The "things your model never captured" *is* the Deweyan entry point.
      *   **Explain "Knowledge" for Dewey:** It's not correspondence truth; it's warranted assertibility within a context of inquiry.
      *   **Distinguish the Types of Inquiry:**
          *   *Technical:* Means-oriented (How do we measure X?).
          *   *Social/Political:* Ends-oriented (What should we do about X?).
      *   **The "Private Knowledge" Trap:** When experts define the problem *for* the public, they strip the context that makes the knowledge relevant.
      *   **Connect to "Felt Difficulty":** Inquiry starts with trouble. If the expert defines the trouble (e.g., "exceedance of ppm") but the public feels the trouble (e.g., "smell," "fear," "property value"), the expert is solving a different problem.
      *   **Conclusion:** It's not rhetorical overreach; it's a category distinction.

