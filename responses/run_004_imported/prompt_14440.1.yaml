      *   *Section 1: The Epistemological Shift.* Explain that Dewey isn't using "knowledge" in the positivist sense (matching facts). He's using a pragmatic sense (tool for action). If the tool doesn't fit the social hand, it's not a tool *for that job*.
      *   *Section 2: The "Felt Difficulty".* Use the user's experience. The model frames the problem as "concentration." The public frames it as "health/security/trust." If the inquiry doesn't start with the public's felt difficulty, it's not social inquiry; it's just math.
      *   *Section 3: Means vs. Ends.* Toxicology determines means (is it toxic?). Politics determines ends (is it acceptable?). Experts often smuggle ends into means (setting the "acceptable" threshold). Dewey says that's where the knowledge fails.
      *   *Section 4: Is it Rhetorical?* No, it's precise. It's about the *conditions of validation*. Scientific knowledge is validated by peer replication. Social knowledge is validated by communal resolution.
      *   *Closing:* Bring it back to the user's retirement reflection. They lived the problem Dewey diagnosed.

  6.  **Refining the Tone:**
