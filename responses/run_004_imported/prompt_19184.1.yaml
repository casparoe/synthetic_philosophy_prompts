answer: |-
  **MEMORANDUM**

  **TO:** Effective Altruism Club Members
  **FROM:** [Your Name], Club President
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Annual Fund Disbursement Vote

  Hi everyone,

  First, thank you for an incredible year of fundraising. Between the bake sale, trivia night, and the matching pledge, we have **$2,900** to disburse. This is a significant amount for a high school club, and it's a testament to your hard work.

  At next Thursday's meeting, we will vote on how to allocate these funds. Our by-laws state that we need a **two-thirds majority** to change our existing allocation (which has been 100% to the Against Malaria Foundation, or AMF, for the past two years). If we do not reach that threshold, the funds default to AMF.

  After reviewing the proposals and the concerns raised at our last meeting, **I recommend we vote to adopt the officer's proposal: a split of two-thirds ($1,933) to AMF and one-third ($967) to a longtermist pooled fund (focusing on AI safety and biosecurity).**

  I know the debate at the last meeting got intense, specifically regarding the "cluelessness" objection. I want to address that directly here, because I believe it is the key to why a split is the most rational choice, rather than a compromise just to keep the peace.

  ### Engaging with the "Cluelessness" Objection

  As some of you noted, relying on expected value (EV) comparisons for longtermist causes is difficult. The "cluelessness" argument (drawing on Lenman and Greaves) suggests that we cannot reliably predict the long-term causal chains of our actions. Saving a life with a bednet increases the population, which changes resource consumption, political dynamics, and who is around to shape future technology. Conversely, funding AI safety might succeed in preventing catastrophe, or it might inadvertently accelerate capabilities or lock in undesirable governance structures.

  If we take this objection seriously, it undermines the idea that AMF is the "safe" baseline. AMF is well-evidenced in the *near term* (we know nets prevent malaria deaths), but its *long-term* value is just as subject to unpredictable causal chains as AI safety work.

  So, how should this change our decision?

  1.  **Cluelessness Counsels Diversification, Not Paralysis:** If we are truly uncertain about the long-term sign (positive or negative) of our impact, putting 100% of our resources into one basket is risky. If AMF's long-term effects turn out to be net negative due to unforeseen population dynamics, a 100% allocation is a disaster. If AI safety work turns out to be ineffective or counterproductive, a 100% allocation there is also a disaster. A split portfolio hedges against this deep uncertainty. It acknowledges that while we have better *near-term* evidence for AMF, we cannot be confident in the *total* value of either option.
  2.  **Supplementing EV with Robustness:** We should not abandon expected value reasoning, but we should supplement it with a **robustness heuristic**. When error bars are massive (as they are with longtermism), we should look for strategies that perform reasonably well across a wide range of possible worlds. Funding AMF secures definite near-term welfare. Funding AI safety secures a chance at a vast future. Doing both ensures we don't neglect the present for a speculative future, nor sacrifice the future for the present.
  3.  **Epistemic Humility:** The cluelessness objection is ultimately a call for humility. It warns us against overconfidence. A 2/3 – 1/3 split reflects this humility. It respects the strong evidence for AMF's near-term impact (keeping the majority there) while acknowledging the possibility that the longtermist calculation might dominate if our uncertainties resolve favorably (allocating a significant minority there).

  ### Timeline and Logistics

  If the vote passes next Thursday, I propose the following timeline:
  *   **October 26 (Thursday):** Vote held during the meeting.
  *   **October 27 – November 3:** Faculty advisor review and signature.
  *   **November 10:** Funds transferred. AMF donation processed immediately. The longtermist portion will be sent to the recommended pooled fund (e.g., the Long-Term Future Fund or similar vetted regrantor) to ensure due diligence on the specific grantees.

  ### Conclusion

  We are in the fortunate position of having to choose between doing clear good now and potentially securing the future. The cluelessness objection reminds us that we can't see the full picture. But that isn't a reason to do nothing; it's a reason to be humble and diversified.

  I hope you'll join me in supporting the 2/3 – 1/3 split. It honors our club's history with AMF while taking seriously the argument that the future matters immensely.

  Please come prepared to vote on Thursday. If you have questions before then, reply to this email or catch me in the hallway.

  Best,

  [Your Name]
  President, [High School Name] Effective Altruism Club
