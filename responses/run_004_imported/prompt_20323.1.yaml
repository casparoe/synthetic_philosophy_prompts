answer: |-
  This is an exceptionally sharp objection, one that cuts to the heart of the tension between the Kripkean revolution and the two-dimensionalist attempt to recover a role for descriptive content. Your student has effectively reconstructed a version of the "Collapse Argument" often associated with critics like Scott Soames, Peter Byrne, and even early worries raised by Nathan Salmon.

  To give this objection its due in your seminar, you need to present it not as a misunderstanding of two-dimensionalism, but as a rigorous challenge to its coherence. The core of the argument is that **primary intensions cannot do their explanatory work without functioning as reference-fixing descriptions, and once they do so, they inherit the very vulnerabilities Kripke identified in classical descriptivism.**

  Below is a reconstruction of the strongest version of your student's argument, structured for a graduate-level discussion. It is divided into the **Functional Equivalence Thesis**, followed by the **Reapplication of Kripke's Three Arguments**, and concludes with the **Explanatory Deflation Claim**.

  ---

  ### The Collapse Argument Against Epistemic Two-Dimensionalism

  #### I. The Functional Equivalence Thesis
  The central claim of epistemic two-dimensionalism (2Dism) is that expressions possess two distinct intensions. The secondary intension (2-intension) captures metaphysical modality (rigid designation), while the primary intension (1-intension) captures epistemic modality (cognitive significance).

  For the 1-intension to explain the *a priori* status of "Water is the actual watery stuff" (or similar reference-fixing identities), it must be accessible to the competent speaker independently of empirical investigation. To evaluate the 1-intension of "water" across epistemically possible scenarios (centered worlds considered as actual), the speaker must possess a rule or condition that determines the extension of "water" in any given scenario $S$.

  **The Argument:**
  1.  To evaluate a 1-intension in a scenario $S$ considered as actual, a speaker must be able to identify the extension of the term in $S$ based solely on their grasp of the term.
  2.  This identification requires a condition of application $C$ such that, for any scenario $S$, the extension of "water" in $S$ is whatever satisfies $C$ in $S$.
  3.  Because this grasp is supposed to be *a priori* and constitutive of competence, $C$ functions as a reference-fixing description (e.g., "the dominant clear, drinkable liquid in the oceans").
  4.  Therefore, the 1-intension is functionally equivalent to a Fregean sense or a Russellian reference-fixing description.
  5.  If 1-intensions are reference-fixing descriptions, then the link between the name/kind term and its referent is mediated by the satisfaction of descriptive conditions.

  *Charitable Note:* 2Dists often resist calling 1-intensions "descriptions," preferring "functions from scenarios to extensions." However, the student's point is that *functions require rules of evaluation*. If those rules are not descriptive conditions accessible to the speaker, the speaker cannot evaluate the 1-intension a priori. If they *are* accessible conditions, they play the exact theoretical role of classical descriptions.

  #### II. Reapplying Kripke's Three Arguments to Primary Intensions
  If the Functional Equivalence Thesis holds, Kripke's trilemma in *Naming and Necessity* applies directly to the 1-intension level. 2Dism attempts to locate contingency in the 1-intension to save the intuition that "Water might not have been H2O" makes sense epistemically. But if the 1-intension is descriptive, it is vulnerable to the same modal, epistemic, and semantic objections.

  **1. The Modal Argument (Rigidity vs. Contingency)**
  *   **Kripke's Original:** "Aristotle" is rigid; "the teacher of Alexander" is not. It is possible that Aristotle existed but did not teach Alexander. Therefore, they are not synonymous.
  *   **The 2Dist Move:** "Water" is rigid in the secondary dimension (H2O in all worlds), but non-rigid in the primary dimension (picks out XYZ in a Twin-Earth scenario considered as actual).
  *   **The Student's Counter:** Consider the statement: *"Water might not have been the dominant watery stuff."*
      *   If the 1-intension *is* the condition "dominant watery stuff," then it is *a priori* and necessary (in the epistemic sense) that water is the dominant watery stuff.
      *   But intuitively, we can imagine discovering that our term "water" actually referred to something else (e.g., a natural kind we misidentified, or a hallucination).
      *   If the 1-intension fixes reference via satisfaction of a description, then in any scenario where nothing satisfies the description, the term should lack a referent. But Kripke showed names refer even when descriptions fail (e.g., if no one proved incompleteness, "Gödel" still refers to Gödel).
      *   **Conclusion:** If the 1-intension is a description, it suffers from the same modal mismatch as classical descriptivism. It cannot account for the possibility that the reference-fixing description itself might have failed to pick out the actual referent.

  **2. The Epistemic Argument (Ignorance and Error)**
  *   **Kripke's Original:** Speakers can refer to Gödel without knowing the description "prover of incompleteness." They can also have false beliefs (e.g., that Gödel was a spy) without losing reference.
  *   **The 2Dist Move:** The 1-intension is not what the speaker *believes*, but what an idealized rational agent would use to pick out the referent in a scenario.
  *   **The Student's Counter:** This move retreats to an *idealized* descriptivism, which Kripke already addressed.
      *   If the 1-intension is the condition an *idealized* speaker would use, does the actual speaker grasp it? If not, how does it explain the *actual* speaker's cognitive significance?
      *   If the actual speaker *does* grasp it, they are vulnerable to error. If I believe water is a fundamental element (not H2O), do I fail to grasp the 1-intension? If 2Dism says "No, your 1-intension is still 'watery stuff'," then the 1-intension is too thin to determine extension (since "watery stuff" is vague). If it says "Yes, you are mistaken about the 1-intension," then reference is lost when beliefs are false, replicating the descriptivist error.
      *   **Conclusion:** 2Dism cannot simultaneously maintain that 1-intensions are *a priori accessible to ordinary speakers* (to explain cognitive significance) and *robust against error* (to explain successful reference). Classical descriptivism failed on the latter; 2Dism fails if it insists on the former.

  **3. The Semantic Argument (Uniqueness and Circularity)**
  *   **Kripke's Original:** Descriptions often fail to uniquely identify the referent (e.g., "the inventor of the zip" might apply to multiple people). Furthermore, using descriptions like "the person we refer to by 'Gödel'" is circular.
  *   **The 2Dist Move:** The 1-intension uses indexicals and natural kind terms (e.g., "the liquid *actually* around here").
  *   **The Student's Counter:**
      *   **Uniqueness:** In a chaotic scenario where no single liquid dominates, does "water" fail to refer? Intuitively, we might still be talking about water, just in a strange world. If the 1-intension requires a unique satisfier, it is too strict.
      *   **Circularity:** To specify the 1-intension of "water," 2Dists often rely on "the actual watery stuff." But "actual" is indexical. To evaluate this in a scenario considered as actual, we need to know what "watery" means. If "watery" is defined by its relation to *our* water, we have presupposed the reference we are trying to fix. If "watery" is defined phenomenologically, we are back to classical descriptivism (subject to the Modal and Epistemic arguments above).
      *   **Conclusion:** The 1-intension either relies on circular reference-fixing (presupposing the term it defines) or non-circular descriptions (which are vulnerable to uniqueness failures).

  #### III. The Explanatory Deflation Claim
  The ultimate force of the student's objection is not just that 2Dism inherits Kripke's problems, but that it loses its primary motivation.

  1.  **The Goal of 2Dism:** To reconcile Kripkean rigidity (necessary a posteriori truths) with Fregean cognitive significance (contingent a priori feel).
  2.  **The Mechanism:** The 1-intension explains the "contingent feel" (it varies across epistemic scenarios); the 2-intension explains the "necessity" (it is fixed across metaphysical worlds).
  3.  **The Collapse:** If the 1-intension is just a reference-fixing description, then the statement "Water is the watery stuff" is a priori. But Kripke argued that reference-fixing descriptions do *not* give the meaning of the term.
  4.  **The Result:** 2Dism effectively concedes that "Water is H2O" is necessary (via 2-intension) but tries to save descriptivism by hiding it in the 1-intension. However, since the 1-intension is subject to Kripke's arguments (ignorance, error, modal mismatch), it cannot bear the weight of explaining cognitive significance.
  5.  **Final Verdict:** 2Dism is not a synthesis of Kripke and Frege; it is a descriptivist theory that has added a secondary dimension to accommodate Kripke's data without successfully answering his arguments against the primary dimension. It is a notational variant of reference-fixing descriptivism, and thus inherits its fatal flaws.

  ---

  ### Suggested Pedagogical Framing for Your Response

  When you address this in class, you might acknowledge that the student has identified the **"Soamesian Objection"** (after Scott Soames, *Beyond Rigidity*). This validates her intuition while placing it in the literature.

  To respond, you will likely need to distinguish between **descriptions as meanings** (which Kripke refuted) and **descriptions as epistemic roles** (which 2Dists defend). The 2Dist reply usually hinges on the claim that 1-intensions are not *synonymous* with descriptions, but rather reflect the **epistemic conditions under which we identify referents**, which need not be error-free or uniquely identifying in the way Kripke demanded of *semantic* content.

  However, for the purpose of next week's session, presenting the argument as above ensures the class understands that 2Dism is not a free lunch: it buys its explanation of the necessary a posteriori at the cost of reviving a sophisticated form of descriptivism that must answer to Kripke's ghost.
