prompt: |-
  So we just covered information cascades in my behavioral econ class (the classic Bikhchandani-Hirshleifer-Welch setup with balls in an urn, where everyone can only see what people before them guessed, not their actual signal), and I'm a bit confused why the models call this "rational herding." If at some point the optimal move is to just copy whatever the last few people did and completely ignore your own private signal, isn't that basically the definition of not thinking for yourself? Feels like the profs are just dressing up conformity bias in Bayesian math to make it sound smarter then it is. Am I missing something, or should we really just be calling this an irrational herd mentality instead of pretending its some kind of optimal behavior?
