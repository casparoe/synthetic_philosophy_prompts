      *   **Anscombe's Machinery:** Explain DDE, Means vs. Side-effect, and the specific application to Hiroshima/Nagasaki (morale bombing). Mention Unconditional Surrender.
      *   **The Consequentialist/Supreme Emergency Reply:** Walzer, the invasion estimates, the "lesser evil."
      *   **Critical Engagement:**
          *   *Epistemic Problem:* Consequentialism requires knowing the future (casualty counts of invasion vs. bomb). We don't know. Anscombe requires knowing the intention (which is accessible).
          *   *The "Means" Argument:* Was civilian death the means? Yes, via morale.
          *   *The "Supreme Emergency" Flaw:* It creates a utilitarian exception that swallows the rule. If "emergency" justifies killing innocents, innocents have no right to life, only a conditional one.
