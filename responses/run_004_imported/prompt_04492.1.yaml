      *   *Secondary Claim:* The policy of Unconditional Surrender made the war aim total, removing the possibility of a negotiated peace that might have avoided the bomb or invasion.
      *   *Connection to Intention:* The pamphlet (1956) predates *Intention* (1957). The moral conviction likely drove the technical analysis. The technical analysis exists to protect the moral conviction from utilitarian erosion.

  3.  **Deconstruct the Counter-Argument (Consequentialist/Supreme Emergency):**
      *   *Core Claim:* Moral rules can be overridden by catastrophic consequences.
      *   *Walzer's "Supreme Emergency":* When a community faces imminent destruction or enslavement, leaders may do what is normally forbidden.
      *   *1945 Context:* Operation Downfall (invasion of Kyushu/Honshu). Estimated casualties (US and Japanese) in the hundreds of thousands to millions. Soviet entry. Prolonged starvation/blockade.
      *   *Critique of DDE:* The distinction between "intending" and "foreseeing" is psychologically and morally tenuous when the outcome is identical. If you know civilians *will* die to achieve the goal, the distinction is sophistry.

