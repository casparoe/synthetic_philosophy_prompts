      *   **Conclusion:** Reiterate verdict. Acknowledge the grandfather's pain (the human cost) but maintain the philosophical integrity of Anscombe's point. The "murder" charge is about the *kind* of act, not just the body count.

  8.  **Refining the Tone:**
