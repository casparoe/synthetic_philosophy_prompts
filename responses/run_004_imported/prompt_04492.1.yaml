answer: |-
  **Title:** The Means and the End: Anscombe's Charge and the Limits of Supreme Emergency

  **Introduction**

  It is a compelling hypothesis that *Intention* (1957), G.E.M. Anscombe's seminal work in action theory, was not merely an abstract inquiry into the philosophy of mind, but a technical fortification of the moral stance she took in "Mr. Truman's Degree" (1956). In the pamphlet, Anscombe protested Oxford's decision to award Harry Truman an honorary doctorate, arguing that his authorization of the atomic bombings of Hiroshima and Nagasaki constituted the murder of the innocent. In *Intention*, she provides the metaphysical machinery—the distinction between intended effects and merely foreseen consequences—to defend that moral judgment against utilitarian erosion. To treat the pamphlet as mere biographical color is to miss the moral engine driving the philosophy. The technical distinctions in *Intention* exist to ensure that certain actions remain describable as "murder" regardless of their consequences.

  This essay evaluates Anscombe's specific charge against the strongest available counter-argument: the "supreme emergency" exemption advanced by thinkers like Michael Walzer, which weighs the bombings against the alternatives on the table in 1945 (specifically Operation Downfall, the planned invasion of Japan). Anscombe's argument rests on two pillars: the Doctrine of Double Effect (DDE), which forbids intending the death of innocents even as a means to a just end, and the claim that the Allied policy of Unconditional Surrender corrupted the war aims, making the bomb a tool of coercion against the civilian population rather than a military necessity. Against the consequentialist claim that the bombs prevented a greater catastrophe, I argue that Anscombe's charge of murder holds. While the "supreme emergency" defense appeals to our intuition about tragic choices, it relies on an epistemically bankrupt calculus that ultimately dissolves the concept of human rights in war. Anscombe is correct: the structural intentionality of the act renders it murder, and no appeal to consequences can sanitize the use of innocents as means.

  **The Machinery of Intention**

  To understand Anscombe's charge, one must grasp that she is not making a utilitarian calculation about body counts. She explicitly concedes the Doctrine of Double Effect: it is permissible to attack a legitimate military target even if one foresees that civilians will die as a side effect. What is forbidden is making the death of civilians the *means* to victory. For Anscombe, the description of the action depends on the agent's intention. If I destroy a munitions factory and civilians nearby die, their deaths are foreseen but unintended. If, however, I destroy a city *in order to* break the morale of the population and force a surrender, their deaths (or the destruction of their lives) are the very instrument of my success. They are being used.

  Anscombe reads Hiroshima and Nagasaki through this lens. She argues that the atomic bombs were not dropped on purely military installations where civilian death was collateral; they were dropped on cities *as* cities. The mechanism of victory was not the degradation of military capacity in the immediate vicinity, but the terrorization of the civil society to compel political submission. In this schema, the civilians are not obstacles to be bypassed (collateral damage); they are the lever to be pulled. This fits the definition of murder because it violates the absolute prohibition against killing the innocent as a means to an end.

  Furthermore, Anscombe links this to the policy of Unconditional Surrender. She argues that by demanding total capitulation, the Allies removed the possibility of a negotiated peace that might have preserved the Emperor's status—a key sticking point for the Japanese leadership. If the war aim is total subjugation, then total destruction becomes the logical method. The bomb, in this view, was not a reluctant last resort to end a war that could otherwise conclude, but the efficient instrument of a policy that refused to allow the war to conclude on any terms other than the enemy's annihilation as a sovereign power.

  **The Supreme Emergency Objection**

  The strongest reply to Anscombe comes from the tradition of "just war" theory modified by realism, best articulated by Michael Walzer. Walzer acknowledges the DDE but argues that in a "supreme emergency"—where a community faces imminent defeat and the prospect of enslavement or massacre—the usual prohibitions may be overridden. The argument is not that killing innocents is good, but that it is the "lesser evil" compared to the alternative.

  In 1945, the alternative to the bomb was Operation Downfall, the invasion of the Japanese home islands. Estimates for casualties varied wildly, but US planners anticipated hundreds of thousands of American deaths and millions of Japanese deaths (combatant and civilian) due to combat, starvation, and disease. The Japanese government had mobilized the civilian population for a *Ketsu-Go* defense, arming them with bamboo spears and instructing them to fight to the death. From this perspective, the bomb was a mercy compared to the protracted slaughter of an invasion and blockade. The consequentialist argues that Anscombe's deontological rigidity fetishizes the "purity" of the agent's intention at the cost of actual human lives. If refusing to "murder" (in Anscombe's sense) results in more deaths overall, the prohibition seems morally self-indulgent.

  This objection strikes at the heart of Anscombe's project. It suggests that the distinction between "intended" and "foreseen" is a sophistry when the outcome is identical. If I know with certainty that dropping the bomb will kill 100,000 civilians, and I know that *not* dropping it will lead to the death of 200,000 civilians via invasion and starvation, does my internal mental state regarding "means" vs. "side-effect" matter more than the 100,000 saved lives?

  **The Epistemic and Moral Failure of Consequentialism**

  Anscombe's charge holds up because the consequentialist defense relies on an epistemic impossibility. To justify the bombings on utilitarian grounds, one must know the future with a precision that history never grants. The casualty estimates for Operation Downfall were projections, not facts. We do not know if Japan would have surrendered after the Soviet entry into the war (which occurred between Hiroshima and Nagasaki) without the second bomb. We do not know if the blockade would have forced surrender before the invasion began. We do not know if the "millions of dead" projected by planners would have materialized or if they were inflated to justify the use of the new weapon.

  Consequentialism in war requires a god's-eye view of cause and effect that human commanders do not possess. Anscombe's deontology, by contrast, relies on the accessibility of intention. A commander knows *why* he is ordering the strike. If the plan relies on breaking civilian morale, he knows he is using civilians as means. This is a knowable moral fact. The "supreme emergency" defense asks us to gamble on uncertain counterfactuals to justify a certain moral transgression. Anscombe refuses the gamble. She argues that we are responsible for what we *do*, not necessarily for everything we *fail to prevent*, provided we do not violate absolute prohibitions in our attempts to prevent it.

  Moreover, the "supreme emergency" exemption contains a fatal logical flaw: it destroys the right it claims to protect. If the right of innocents not to be targeted is conditional upon the strategic convenience of the belligerents, then they have no right at all. Walzer attempts to limit this exemption to "imminent" threats, but "imminence" is elastic. Once you admit that innocents can be killed for the "greater good" of victory, you have opened the door to total war. Anscombe's insistence on the absolute prohibition is not moral self-indulgence; it is the only barrier against the normalization of atrocity. If the Allies could murder innocents to stop the Axis, why could the Axis not murder innocents to stop the Allies? The only stable ground is the prohibition itself.

  **The Unconditional Surrender Nuance**

  Anscombe's point about Unconditional Surrender strengthens her case against the "necessity" defense. If the policy of Unconditional Surrender was maintained when a negotiated peace (perhaps retaining the Emperor) was possible, then the "emergency" was partly manufactured by Allied diplomacy. Historical evidence suggests that the Japanese peace faction was actively seeking Soviet mediation to secure terms regarding the Emperor's status prior to the bombings. By refusing to clarify that the Emperor could remain (until the Potsdam Declaration's ambiguous phrasing was later clarified), the Allies prolonged the war.

  If the war could have ended sooner without the bomb had the political aims been different, then the bomb was not a response to an unavoidable "supreme emergency," but a tool chosen to enforce a specific, maximalist political outcome. This aligns perfectly with Anscombe's claim that the civilian destruction was the *means* to victory. The victory sought was not merely security, but total capitulation. The bomb was the most efficient way to achieve that specific end. Therefore, the intentional structure of the act remains: civilians were destroyed to coerce a political will that might otherwise have bent under less totalizing terms.

  **Verdict**

  Does Anscombe's charge of murder hold? **Yes.**

  To reach this verdict is not to deny the suffering of your grandfather or the millions who might have died in an invasion. It is to affirm that the moral description of an act is not exhausted by its consequences. The atomic bombings were the intentional killing of the innocent as a means to an end. The mechanism of the bomb was not surgical military degradation; it was the vaporization of civil centers to break the national will. This fits Anscombe's definition of murder.

  The consequentialist reply fails because it attempts to wash away the bloodiness of the act with the uncertainty of the alternative. It asks us to accept that human beings can be "used" if the math works out. But the math never truly works out in war; it is always a guess. The prohibition against using the innocent, however, is a knowable constant. Anscombe's philosophy in *Intention* provides the vocabulary to insist that some things are not to be done, even to save lives. If we reject this, we accept that human rights are contingent on strategic necessity.

  Anscombe's protest was not merely about Truman; it was about the soul of Western moral philosophy. She suspected that if we allowed the "greater good" to justify the intentional killing of innocents, we would lose the ability to call anything "unjust." Her technical work on intention was built to make that line unbreachable. In the case of Hiroshima and Nagasaki, that line was crossed. The bombs were a means of coercion targeting the innocent. Therefore, by the only moral standard that protects the innocent from being instrumentalized, the charge of murder stands.

  **Conclusion**

  For your thesis, this suggests that "Mr. Truman's Degree" is indeed the moral crucible for *Intention*. The philosophical distinctions between "voluntary" and "intentional," and the analysis of practical reasoning, are not abstract games. They are defenses against the erosion of moral truth by political expediency. When you discuss this with your grandfather, you might acknowledge that while his survival is a fact to be cherished, the moral evaluation of the act that secured that survival must remain distinct from the gratitude of the survivor. Anscombe teaches us that we can be grateful for life without endorsing the murder that preserved it. The tragedy of war is not just that people die, but that survivors are often left indebted to acts that philosophy must condemn. Anscombe's greatness lies in her refusal to let the debt cancel the condemnation.
