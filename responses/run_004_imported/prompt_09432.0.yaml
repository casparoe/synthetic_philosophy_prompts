answer: |-
  Congratulations, Class of 2024.

  Standing here, I know what you want to hear. You want to be told that the law is the embodiment of justice. You want to hear that by mastering the rules, you have aligned yourselves with the good. It is a comforting thought. It suggests that if you follow the procedure, the moral outcome will take care of itself.

  But I would be failing you if I offered you that comfort.

  Throughout my career, I have argued for a distinction that some find cold: the separation of law and morality. I have argued that a rule can be legally valid—enacted by the proper authorities, following the correct procedures—and still be profoundly wicked. To say otherwise, to claim that "an unjust law is no law at all," is to blur the very lines you need to see clearly.

  Why does this matter on a day like today? Because if law and morality are the same thing, then your job is merely technical. You simply find the law, and you have found the justice. But if they are separate, as I believe they are, then your job is infinitely harder, and infinitely more important.

  Recognizing that law is a social construct, not a moral guarantee, does not mean law is irrelevant to justice. It means the burden of justice rests on *you*, not on the system.

  Consider the lessons of history we study in jurisprudence. Think of the "grudge informer" cases after the Second World War. People were punished for reporting their neighbors to the Nazi regime. They had, technically, followed the valid laws of the time. The statutes were real. The procedures were followed. But the courts recognized that following a valid law is not a moral alibi. The law existed, but the humanity did not.

  If we pretend that wicked statutes are not "real" law, we let the people who wrote them off the hook. We pretend the system didn't work, when the terrifying truth is that it worked exactly as designed. By admitting the law was valid but morally monstrous, we acknowledge the human responsibility involved. We acknowledge that legality is not a substitute for conscience.

  This is not a cynical view. It is a call to agency.

  Hart spoke of a "minimum content" of natural law—not because the universe demands it, but because humans are vulnerable. We need protection, we need stability, we need each other. The law provides the framework for that survival. But the framework is empty without the moral courage of the people who inhabit it.

  You are entering a profession where you will be handed the keys to that framework. You will encounter statutes that are valid but unjust. You will encounter procedures that are followed but produce inequity. If you believe the law is automatically just, you will be blind to these failures. You will say, "I was just following the law."

  But if you understand the separation, you cannot hide behind that shield. You will know that the law is a tool. Like any tool, it can build a hospital or dig a grave. Its validity does not determine its virtue. You do.

  So, do not go out there looking for justice in the text. The text is just ink. Go out there and bring justice *to* the text. Use your knowledge of the rules not to obscure the moral choices, but to clarify them. When the law falls short of the good, do not deny the law's existence. Acknowledge it, critique it, and work to change it.

  The law does not save us. We must save the law from ourselves.

  Congratulations. The work begins now.
