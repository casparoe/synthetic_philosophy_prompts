answer: |-
  This is an excellent question, and it cuts to the heart of why reading pre-modern metaphysics through a modern analytic lens can be both illuminating and treacherous. You and your reading group have identified the single most debated inferential step in the Third Way. Anthony Kenny's charge of the **quantifier shift fallacy** is the standard objection in contemporary philosophy of religion, and formally speaking, he is correct: inferring $\exists t \forall x (\neg E(x,t))$ from $\forall x \exists t (\neg E(x,t))$ is invalid.

  However, whether this *refutes* Aquinas depends on whether Aquinas is actually making a temporal probability argument or a metaphysical grounding argument dressed in temporal language. Given your background in LessWrong-adjacent rationalism, you'll appreciate the distinction between the "map" (the temporal language Aquinas uses) and the "territory" (the ontological structure he is describing).

  Here is a breakdown of whether the charge sticks, how to steelman Aquinas using Aristotelian commitments, and how the argument survives in modern dress.

  ### 1. Does Kenny's Charge Stick?

  **Formally:** Yes.
  If you read the Third Way as a claim about cosmic history—that if every individual thing ceases to exist, there must have been a specific moment in the past where *all* of them ceased simultaneously—then it is a fallacy. This is the "Relay Race" objection: Contingent beings can hand off existence to one another indefinitely. Person A dies, but only after begetting Person B. The set of contingent beings is never empty, even if every *member* of the set is eventually replaced.

  **Contextually:** It's more complicated.
  Aquinas is not a Kalam cosmological arguer. He famously held that reason cannot prove whether the universe had a beginning or is eternal; that is known only by revelation. He explicitly argues elsewhere (*De Aeternitate Mundi*) that an eternal universe is logically possible.

  If Aquinas believed the universe *could* be eternal, he cannot be arguing that "there *was* a time when nothing existed" as a historical fact derived from contingency. If the universe is eternal, there is no "first time." Therefore, the "time" language in the Third Way is likely functioning modally or ontologically, not chronologically.

  ### 2. Charitable Readings: Steelmanning the Third Way

  To salvage the argument, we need to shift from **temporal succession** (*per accidens* causal series) to **ontological dependence** (*per se* causal series).

  #### A. The *Per Se* vs. *Per Accidens* Distinction
  In Aristotelian metaphysics, a *per accidens* series is sequential (grandfather $\to$ father $\to$ son). A *per se* series is hierarchical and simultaneous (mind $\to$ hand $\to$ stick $\to$ stone). The stick moves the stone only *while* the hand moves the stick.

  Many Thomists (e.g., Edward Feser, Brian Davies) argue the Third Way is actually about *per se* dependence.
  *   **The Move:** If everything existing right now is contingent (dependent on another for its existence), and there is no necessary being grounding them, then there is no explanation for why *anything* exists rather than nothing.
  *   **The "Time" Language:** When Aquinas says, "at one time there could have been nothing," he may mean "in the absence of a necessary being, the *possibility* of nothingness would be actualized." The "time" is a heuristic for "state of affairs."
  *   **The Inference:** It is not $\forall x \exists t \rightarrow \exists t \forall x$. It is closer to: "If the totality of existence is contingent, the totality itself is contingent. If the totality is contingent, it requires an external cause. If it has no external cause, nothing would exist."

  #### B. The Totality of Contingency
  This reading aligns with the modern "Argument from Contingency" (see Richard Taylor or Alexander Pruss).
  1.  Every individual thing in the universe is contingent.
  2.  The collection/totality of these things is itself contingent (because a collection of dependent things is itself dependent).
  3.  Therefore, the totality requires an explanation outside itself.
  4.  If there were no necessary being to ground this totality, the totality would not exist.

  On this reading, Aquinas isn't claiming there was a historical vacuum. He is claiming that **contingent existence is ontologically parasitic.** If you remove the host (the Necessary Being), the parasites (Contingent Beings) cannot exist. The "absurdity" he mentions ("even now there would be nothing") confirms this: the conclusion is about the *present* state of existence, not the past history.

  #### C. The Modal Reading of *Aliquando*
  The Latin word *aliquando* is translated as "at one time," but in Scholastic logic, it often functions modally, closer to "in some possible scenario."
  *   **Reading:** "If everything is possible not to be, then [in some possible scenario] there is nothing in existence."
  *   **Implication:** If it is *possible* for nothing to exist, but things *do* exist, there must be something whose existence is *not* merely possible (i.e., Necessary).
  This bypasses the quantifier shift entirely because it removes the temporal variable $t$ and replaces it with a possible world variable $w$.

  ### 3. Does the Broader Argument Survive?

  If we grant Kenny that Aquinas's specific *temporal* formulation is flawed, the core intuition of the cosmological argument from contingency remains robust in modern formulations. In fact, your group's familiarity with Leibniz and Pruss suggests you are already working with the upgraded versions.

  #### A. Leibniz and the Principle of Sufficient Reason (PSR)
  Leibniz sidesteps the temporal regress entirely. He asks: "Why is there something rather than nothing?"
  *   **The Shift:** Instead of looking back in time for a first cause, we look "outward" for a sufficient reason.
  *   **The Logic:** The sufficient reason for the universe cannot be found within the series of contingent things (even an infinite series), because the series itself is contingent. Therefore, the reason must be outside the series (a Necessary Being).
  *   **Rationalist Appeal:** This treats existence like a logical proposition requiring a truth-maker. For a LessWrong audience, you might frame the PSR as a prior against "brute facts." If you reject the PSR, you accept that the universe is a brute fact. Aquinas/Leibniz argue this is intellectually unsatisfying.

  #### B. The Gale-Pruss Modal Cosmological Argument
  This is the most rigorous contemporary version, utilizing S5 Modal Logic.
  1.  It is possible that a Necessary Being exists ($\Diamond \Box G$).
  2.  If it is possible that a Necessary Being exists, then it exists in some possible world.
  3.  If a Necessary Being exists in some possible world, it exists in *all* possible worlds (by definition of necessity).
  4.  Therefore, a Necessary Being exists in the actual world ($\Box G \rightarrow G$).

  This avoids the quantifier shift because it deals with modal status, not temporal frequency. The burden of proof shifts to showing that the concept of a "Necessary Being" is incoherent (which many atheists argue) rather than showing a logical fallacy in the inference.

  #### C. The "Ex Nihilo" Principle
  Aquinas's claim that "that which does not exist only begins to exist by something already existing" is a version of *ex nihilo nihil fit*.
  *   **Modern Critique:** Quantum field theory suggests particles can pop in and out of existence in a vacuum.
  *   **Thomistic Reply:** The "vacuum" in QFT is not *nothing*; it is a sea of potentiality governed by physical laws. Aquinas would argue those laws and that potentiality still require a ground. The argument shifts from "things need causes" to "contingent laws/fields need a ground."

  ### 4. Suggestions for Your Reading Group

  Since you are coming from a rationalist/analytic background, here is how I would suggest framing the discussion for your group:

  1.  **Concede the Formal Point:** Acknowledge Kenny is right *if* Aquinas is making a probabilistic argument about temporal succession. This builds trust that you aren't engaging in apologetic special pleading.
  2.  **Pivot to Metaphysics:** Propose that the Third Way is better read as an argument about **ontological grounding** (here and now) rather than **cosmic history** (back then). The "time" language is a limitation of human language describing metaphysical dependence.
  3.  **Compare Axioms:** Ask the group to compare the axioms.
      *   **Aquinas:** "Whatever is moved is moved by another" / "Contingent things require a cause."
      *   **LessWrong/Physicalism:** "The universe is a brute fact" / "Causality is a local property of spacetime, not applicable to the universe itself."
      *   **Leibniz/Pruss:** "The PSR is true (or probably true)."
      The disagreement isn't usually about the logic (once fixed), but about the acceptance of the PSR or the coherence of "Necessary Existence."
  4.  **The "Eternal Universe" Test:** Remind the group that Aquinas thinks the argument works *even if* the universe has no beginning. If the argument relies on a "first moment," it fails for Aquinas. If it relies on "sustaining cause," it holds. This is the strongest evidence that the quantifier shift is a misreading of his intent.

  ### Summary
  Kenny's charge is logically valid against a superficial reading of the text, but likely misses Aquinas's metaphysical intent. Aquinas is arguing that a totality of contingent beings cannot explain its own existence, regardless of whether that totality is temporally finite or infinite.

  The argument survives robustly in the Leibnizian/Prussian modal formulations, which strip away the temporal language and focus on the logical requirement for a ground of being. For a rationalist audience, the debate ultimately rests on whether one accepts the Principle of Sufficient Reason as a valid constraint on reality, or whether one is willing to accept the existence of the cosmos as a brute fact.

  **Recommendation:** For next week, look at **Edward Feser's *Aquinas*** (Chapter 3) for the traditional defense against Kenny, and **Alexander Pruss's *The Principle of Sufficient Reason*** for the modern analytic upgrade. This bridges the gap between the Scholastic text and your group's background.
