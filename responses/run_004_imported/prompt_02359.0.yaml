prompt: |-
  Ok so I've been on an Overcoming Bias / early LessWrong nostalgia binge lately and fell back down the common prior assumption rabbit hole. You know the setup: Aumann's agreement theorem says two Bayesians with common priors can't agree to disagree once their posteriors are common knowledge, and Harsanyi basically built "everyone starts from the same prior, divergence only comes from information" into how game theorists model incomplete information. What I can't shake is how much weight is riding on that common-prior part, since vanilla Savage-style subjective expected utility theory never actually requires that two different agents start from the same place to begin with.

  I went back and reread Hanson's "Uncommon Priors Require Origin Disputes" (the one with the pre-rationality condition, where your prior is supposed to cohere with what you'd have predicted about yourself before knowing which agent in the setup you'd turn out to be), plus the Gul/Aumann back-and-forth in Econometrica '98 where Gul argues the common prior assumption is basically incompatible with the whole Savage/personalist picture of probability, and Aumann fires back in his reply. My rationalist friends mostly just treat "rational agents share a prior" as the default, so that any leftover disagreement not explainable by different info is automatically a sign someone's being irrational -- but the more of this I read the less obvious that seems, and I don't think its actually as settled as people on the forums act like it is.

  Could you write me an actual essay on this, not just a survey of "here's view A, here's view B"? Lay out the strongest case that ideal rationality requires a common prior, the strongest case that fully rational agents can have irreducibly different priors, and then actually pick a side and defend it. Please don't cop out with "it depends" as your final answer -- if your honest view is genuinely conditional, that's fine, but tell me on what it's conditional and where you personally come down.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The Common Prior Assumption (CPA) in Bayesian epistemology and game theory.
      *   **Context:** The user is familiar with Overcoming Bias, early LessWrong, Aumann's Agreement Theorem, Harsanyi's doctrine, Savage's subjective expected utility, Robin Hanson's "Uncommon Priors Require Origin Disputes," and the Gul/Aumann debate (Econometrica '98).
      *   **Task:** Write an *essay*, not a survey. It needs to argue, not just list views.
      *   **Structure:**
          1.  Strongest case for CPA (Ideal rationality requires common priors).
          2.  Strongest case against CPA (Fully rational agents can have irreducibly different priors).
          3.  Pick a side and defend it (No "it depends" cop-out, though conditional nuance is allowed if the position is clear).
      *   **Tone:** Intellectual, rigorous, engaging, matching the "rationalist" vibe of the user's prompt (LessWrong/Overcoming Bias style).

  2.  **Deconstruct the Arguments:**

      *   **Pro-CPA (The Objectivist/Universalist Case):**
          *   *Core Intuition:* Probability isn't just "degree of belief"; it's "degree of belief warranted by evidence." If evidence is the same, belief should be the same.
          *   *Aumann/Harsanyi:* Incompatibility of "agreeing to disagree." If we know we disagree, one of us must be wrong about the world or about the other's rationality.
          *   *Hanson's "Pre-rationality":* The "veil of ignorance" argument. Before you knew *who* you were (which brain, which history), you should have assigned probabilities to being each agent. If you treat your current prior as optimal, you must believe that the prior you *would have had* behind the veil leads to your current prior. If everyone does this, priors must converge.
          *   *Truth-Tracking:* Priors are hypotheses about the structure of reality. There is only one reality. Therefore, there is one correct mapping from data to belief. Different priors imply at least one agent is systematically biased against truth.

      *   **Anti-CPA (The Subjectivist/Personalist Case):**
          *   *Core Intuition:* Savage's framework. Probability is consistency of preference, not correspondence to external frequency. Rationality is coherence, not correctness.
          *   *Gul's Critique:* CPA imposes an external constraint on internal states. It turns epistemology into physics.
          *   *The "Origin" Problem:* We *do* have different origins. We are different physical systems. Why should my brain's initial weighting of hypotheses match yours?
          *   *No God's Eye View:* There is no "veil of ignorance" moment where we chose our priors. We are thrown into existence with specific cognitive architectures. Demanding a common prior demands a metaphysical standpoint no actual agent occupies.
          *   *Diversity as Heuristic:* In a complex world, a population with diverse priors might explore hypothesis space better than a population with identical priors (evolutionary argument).

  3.  **Determine the Stance (The "Pick a Side" Requirement):**
      *   *Option A: Pro-CPA.* Aligns with the "rationalist" goal of converging on truth. Fits the Aumann/Hanson vibe. Risk: Seems disconnected from psychological reality.
      *   *Option B: Anti-CPA.* Aligns with Savage and actual human diversity. Risk: Opens the door to "anything goes" relativism, which undermines the project of rationality.
      *   *Option C: A Nuanced Middle (but decisive).* The CPA is a *regulative ideal* for communication and truth-seeking, but not a *metaphysical necessity* for agency.
      *   *Decision:* I will argue for a **modified Pro-CPA stance**. Specifically: *CPA is not a description of how agents are born, but a normative requirement for agents who wish to claim their beliefs track objective truth.* If you claim your beliefs are about the *world* and not just *your preferences*, you must accept the CPA. If you reject CPA, you admit your beliefs are partially aesthetic or indexical. For the project of "overcoming bias" and finding truth, CPA is necessary.
      *   *Refinement:* Actually, the strongest philosophical position is that **CPA is necessary for the concept of "disagreement" to have traction.** If priors are truly uncommon, we aren't disagreeing about the world; we are speaking different languages. To engage in the joint project of inquiry, we must presuppose CPA. I will defend CPA as a *pragmatic necessity for epistemic communities*, even if it's not a metaphysical law of agency.
      *   *Wait, let's go stronger.* The prompt asks about "ideal rationality." I should argue that **Ideal Rationality *does* require a Common Prior.** Why? Because a prior is a compression of logical implications. If logic is universal, the optimal compression (Solomonoff induction style) is universal. Different priors imply different logical weights, which implies error in processing logical truth.
      *   *Okay, final decision:* I will argue **For the Common Prior Assumption.** I will ground it not in Harsanyi's game theory, but in **Logical Objective Bayesianism.** Priors aren't just "starting guesses"; they are the logical relationship between propositions before evidence arrives. Since logic is objective, priors must be too.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the tension. Aumann vs. Savage. The "rationalist" default vs. the "subjectivist" reality. State the thesis clearly.
      *   **Case 1: The Universalist Imperative (Pro-CPA).** Focus on Truth-Tracking. Priors as logical relations. Hanson's "Origin Disputes" argument (the veil of ignorance). If you think you're right, you must think the other guy is wrong about the *structure of the universe*.
      *   **Case 2: The Personalist Defense (Anti-CPA).** Focus on Agency and Coherence. Savage's axioms. The lack of a "pre-birth" moment. The evolutionary utility of diversity. Gul's point about CPA being an external imposition.
      *   **The Verdict:** Defend Pro-CPA. But refine it. It's not that we *have* common priors, it's that we *must strive for them* to claim objectivity. Actually, no, the prompt asks about "ideal rationality." I need to say ideal rationality *entails* CPA.
      *   *Key Argument for Verdict:* The "Logical Prior" argument. If a prior assigns probability to logical truths (or mathematical structures), there is only one correct assignment (related to Solomonoff Induction). Subjective priors are just approximations of the Universal Prior. Therefore, divergence is error.
      *   **Conclusion:** Summarize. Acknowledge the difficulty. Reiterate that rejecting CPA is retreating from truth to comfort.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the Logical Prior argument too technical?
      *   *Fix:* Keep it accessible. Focus on the idea that priors represent expectations about the *kind* of universe we live in. There is only one kind of universe.
      *   *Critique:* Hanson's argument is strong but relies on that "pre-rationality" thought experiment which some find shaky.
      *   *Fix:* Strengthen the "Truth-Tracking" angle. If I believe X and you believe Not-X, and we have the same info, one of us is failing to map reality correctly. If that failure is in the *prior*, then one prior is objectively worse at tracking truth. Rationality is about tracking truth. Therefore, one prior is irrational.
      *   *Tone Check:* Ensure it sounds like a serious philosophical essay, not a blog rant. Use terms like "normative," "epistemic," "indexical," "coherence."

  6.  **Final Polish:** Check against the prompt constraints.
      *   Essay format? Yes.
      *   Strongest case Pro? Yes.
      *   Strongest case Con? Yes.
      *   Pick a side? Yes (Pro-CPA).
      *   No "it depends" cop-out? Yes.

  7.  *(Self-Correction on the "Pick a Side" nuance)*: I need to be careful not to just say "CPA is good for science." I need to say "CPA is required for *ideal rationality*." The distinction is between *bounded* rationality (where diverse heurriors are okay) and *ideal* rationality (where there is one correct mapping). I will make this distinction clear. Ideal Bayesians have the Universal Prior. Humans are approximations.

  8.  **Finalizing the Thesis:** Ideal rationality requires a common prior because probability, at the limit, is an extension of logic. Logic is not subjective. Therefore, the logical probability of a proposition given no evidence (the prior) is not subjective. Divergence indicates a failure to grasp logical relations.

  Let's write.
answer: |-
  # The One True Prior: Why Ideal Rationality Demands Commonality

  The tension you have identified lies at the fault line of modern epistemology. On one side stands the Savagean subjectivist: probability is a measure of coherent belief, and so long as your beliefs update via Bayes' rule and avoid Dutch books, your starting point is your own business. On the other stands the Aumannian objectivist: probability is a measure of information state relative to reality, and since reality is singular, the mapping from ignorance to belief must also be singular.

  In the rationalist diaspora, the Common Prior Assumption (CPA) is often treated as a sociological norm—a rule of thumb to prevent arguments from devolving into "I just feel differently." But as you noted, the theoretical stakes are much higher. If the CPA holds, disagreement is a bug, a signal of asymmetric information or computational failure. If the CPA fails, disagreement is a feature, an irreducible consequence of distinct agentive perspectives.

  To resolve this, we must look past the game-theoretic utility of the assumption and ask a metaphysical question: What *is* a prior? Is it a psychological starting gun, or is it a logical relation? Below, I lay out the strongest cases for both sides, and then I will argue that ideal rationality strictly requires a common prior, because to deny it is to abandon the claim that our beliefs track objective truth.

  ### The Case for Pluralism: Rationality as Coherence

  The strongest argument against the Common Prior Assumption comes from the tradition of Personalist Bayesianism, championed by de Finetti and Savage, and later defended by economists like Faruk Gul. This view holds that rationality is a constraint on *process*, not *content*.

  On this view, a prior is not a hypothesis about the world; it is a parameter of the agent. Just as a utility function reflects an agent's values, a prior reflects an agent's "epistemic values" or risk tolerance regarding hypotheses. Savage's axioms demand that an agent's preferences be consistent (transitive, independent, etc.), but they place no restriction on what those preferences *are*. You can prefer apples to oranges, and I can prefer oranges to apples, without either of us being irrational. Similarly, the Personalist argues, you can assign a 90% prior to the sun rising tomorrow, and I can assign 50%, provided we both update correctly on new data.

  Gul's critique of Aumann is particularly biting here. He argues that imposing a common prior requires a "God's eye view"—a vantage point outside the system where agents are assigned priors from a distribution. But real agents do not choose their priors behind a veil of ignorance; they are thrust into existence with specific cognitive architectures, evolutionary histories, and cultural contexts. To demand that my prior match yours is to demand that I ignore the specific physical facts of my own origin.

  Furthermore, there is an evolutionary argument for uncommon priors. In a complex, non-ergodic environment, a population of agents with identical priors is fragile. If the common prior is wrong, the whole population fails. Diversity in priors acts as a heuristic exploration of hypothesis space. If rationality is about survival and adaptation, then a monoculture of priors is maladaptive. Therefore, a "rational" agent in a biological or social sense might be one that maintains a prior distinct from the crowd to ensure robustness.

  Finally, there is the problem of indexicality. I know I am *me*. You know you are *you*. This is information we do not share. If my prior includes indexical facts about my own existence (e.g., "I am the agent born in 1990"), then my prior *cannot* be common with yours without losing essential information. If priors encode indexical self-location, they must differ.

  ### The Case for Universalism: Rationality as Truth-Tracking

  The case for the Common Prior Assumption rests on the claim that probability is not merely internal coherence, but external correspondence. This is the Objectivist or Logical Bayesian position.

  The core intuition here is that a prior represents the logical relationship between propositions in the absence of empirical evidence. It is the answer to the question: "Given the structure of logic and mathematics alone, how likely is proposition X?" Since logical relations are objective (2+2=4 regardless of who is calculating it), the logical probability of a hypothesis must also be objective.

  Robin Hanson's "Uncommon Priors Require Origin Disputes" sharpens this into a dilemma. Suppose you and I have different priors. Why do we differ?
  1.  **Different Information:** Ruled out by definition (priors are pre-evidence).
  2.  **Different Processing:** Ruled out by assumption of ideal rationality.
  3.  **Different Origins:** This is the only option left.

  But if I believe my prior is the correct way to map ignorance to belief, I must believe that *your* prior is a distorted map. If I acknowledge that your prior arose from a different causal history (e.g., different evolutionary pressures), I am admitting that your prior is the result of causal forces that do not necessarily track truth. To maintain that your prior is *rational*, I would have to believe that those causal forces were truth-tracking. But if I believe my prior is also truth-tracking, and we differ, I am forced to conclude that at least one of us is the victim of truth-distorting causal forces.

  If I am honest, I must believe *I* am not the victim of those forces. Therefore, I must believe *you* are. Consequently, I cannot treat your prior as equally valid. To treat priors as equally valid is to embrace epistemic relativism, where "truth" is relative to the agent. But the project of rationality is to converge on the way the world *actually is*, not the way it appears to specific agents.

  Aumann's Agreement Theorem provides the mathematical teeth for this. If we truly share a common prior, we cannot agree to disagree. If we do agree to disagree, we have proven that we do not share a common prior. If we assume ideal rationality (which implies we want to believe true things), the only explanation for persistent disagreement is that one of us has a prior that systematically deviates from the logical structure of reality. Thus, ideal rationality implies a unique, optimal prior.

  ### The Verdict: The Logical Imperative

  I take the side of the Universalists. **Ideal rationality requires a Common Prior.**

  This is not a claim that humans *have* common priors. We do not. Our brains are heuristic engines shaped by evolution to maximize fitness, not truth. We are bounded agents with idiosyncratic starting points. But the prompt asks about *ideal* rationality, and here the distinction is crucial. To call an agent "ideally rational" is to say that its cognitive machinery introduces no distortion between reality and belief.

  My defense rests on three pillars: the nature of logical probability, the impossibility of "rational relativism," and the pragmatic necessity of the assumption for inquiry.

  **1. Priors are Logical Relations, Not Preferences**
  The Subjectivist analogy between priors and utility functions is seductive but false. Utility functions rank outcomes based on an agent's internal state (hunger, desire, values). There is no "fact of the matter" on whether chocolate tastes better than vanilla. However, priors rank hypotheses based on their expected fit with reality. There *is* a fact of the matter on whether the sun will rise.
  If probability is an extension of logic (as Jaynes and Solomonoff argued), then the prior is the probability assignment derived from pure logical consistency and symmetry principles (like the Principle of Indifference or Algorithmic Probability). Since logic is not subjective, the "Universal Prior" (such as Solomonoff Induction) is not subjective. It is a mathematical object. Two ideal computers running Solomonoff Induction on the same input stream will produce the same predictions. If two "ideal Bayesians" have different priors, at least one is not actually running the optimal compression algorithm. They are, by definition, sub-ideal.

  **2. The Relativism Trap**
  If we accept that rational agents can have irreducibly different priors, we sever the link between belief and truth. If your prior says "The universe is 6,000 years old" and mine says "4.5 billion," and we agree this is just a difference in rational starting points, then we are no longer arguing about the world. We are arguing about our internal configurations.
  This renders the concept of "disagreement" meaningless. Disagreement implies that we are aiming at the same target and missing in different ways. If priors are uncommon, we are aiming at different targets. For the project of *Overcoming Bias*—which presumes there is a bias to overcome, i.e., a deviation from a correct standard—there must be a correct standard. That standard is the Common Prior. To deny the CPA is to admit that "bias" is just "difference," which dissolves the normative force of rationality.

  **3. The Pre-Rationality Condition as a Normative Anchor**
  Hanson's argument about "origin disputes" is often dismissed as a metaphysical thought experiment, but it is actually a normative test. It asks: *Do you believe your prior is the result of truth-tracking processes, or accidental ones?*
  If you believe your prior is rational, you believe it is the result of processes that track truth. If you encounter another agent with a different prior, you must ask: "Did their truth-tracking processes fail, or did mine?" You cannot say "Both succeeded." Truth is singular.
  Therefore, the CPA is not a description of how agents are born; it is a commitment made by agents who wish to participate in a shared epistemic community. To engage in rational discourse is to *presuppose* a common prior. It is a performative necessity. If I treat your prior as fundamentally alien and unassailable, I cannot learn from you, nor you from me. We can only exchange data if we agree on how to weigh it. That weighing mechanism is the prior.

  ### Conclusion

  The Subjectivist is right about *humans*: we are distinct physical systems with different starting weights, and demanding we pretend otherwise is psychologically impossible and sometimes evolutionarily unwise. Gul is right that CPA is an external imposition on the Savagean agent.

  But the question was about *ideal rationality*. An ideal rational agent is not a biological organism optimizing for fitness; it is a truth-seeking engine. For such an engine, there is only one correct map of the territory. There is only one Universal Prior. Any deviation from it is, by definition, an error in logical processing or an injection of noise.

  To reject the Common Prior Assumption is to retreat from the hard objectivity of truth into the soft comfort of perspective. It is to say, "I am not wrong, I am just *me*." That may be a healthy stance for interpersonal relationships, but it is poison for epistemology. If we want our beliefs to be about the world, we must accept that, at the limit, there is only one way to be right. We must act *as if* we share a prior, because if we don't, we aren't talking about the same universe.
