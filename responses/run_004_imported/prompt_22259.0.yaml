answer: |-
  This is a superb question. You have put your finger on exactly the nerve that has kept this Scholium alive for over three centuries. As a physicist, your intuition is reacting to the same thing that Ernst Mach reacted to in the 19th century and what Einstein wrestled with in the early 20th.

  To give you the short answer first: **Your suspicion is historically and philosophically vindicated, but within Newton's own dynamical framework, the argument is not technically circular.** However, it does rely on a premise that relationalists (like Leibniz or Mach) would reject as question-begging.

  Here is the breakdown of why the two-globes case is distinct from the bucket, how the "leading/following" determination is supposed to work dynamically, and where your complaint lands in the history of philosophy.

  ### 1. The Physics of the "Leading/Following" Determination

  You asked if the directional language smuggles in absolute space. Newton would argue he is deriving the direction *operationally* from the tension changes, not assuming it.

  Imagine you are an observer attached to the system (or perhaps a disembodied measurer of the cord tension). You have no view of the stars.
  1.  **Baseline:** You measure the tension $T_0$ in the cord. This tells you the *magnitude* of the centrifugal endeavor ($\propto \omega^2$).
  2.  **Perturbation:** You apply a tangential impulse to Face A of Globe 1.
  3.  **Measurement:** You measure the new tension $T_{new}$.
      *   If $T_{new} > T_0$, the impulse increased the angular velocity $\omega$. Therefore, you pushed in the direction of motion. Face A is the "following" (hindmost) face.
      *   If $T_{new} < T_0$, the impulse decreased $\omega$. You pushed against the motion. Face A is the "preceding" face.

  **Newton's Point:** The "direction" of rotation is not defined by passing star A then star B. It is defined by the **sign of the response of the inertial forces to an applied impulse.**

  The "absolute" element here is the **Law of Inertia**. Newton is assuming that the resistance to acceleration (inertia) is a property of the globes relative to *Space itself*, not relative to other matter. If inertia were purely relational (i.e., resistance arises only due to interaction with distant masses), then in an "immense vacuum" with no other matter, there should be no tension in the cord regardless of rotation, or at least no way to distinguish the direction.

  So, is he begging the question?
  *   **If you accept Newton's Laws as fundamental:** No. He is showing that the dynamical state (tension + response to force) fully determines the kinematic state (rotation vector) without external reference.
  *   **If you are a Relationalist (Leibniz/Mach):** Yes. You would argue that the very fact that there *is* tension and that the globes *do* resist the force presupposes a background structure (Absolute Space) that Newton is claiming to prove. You are sensing that "inertia" is doing the heavy lifting, and inertia is just Absolute Space in disguise.

  ### 2. Bucket vs. Globes: Why Both?

  You asked if the globes case does work the bucket hadn't already done. It does, and it's crucial for the specific claim Newton is making in the Scholium.

  **The Bucket Argument:**
  *   **Goal:** To distinguish *true* circular motion from *relative* circular motion.
  *   **Setup:** Water in a bucket.
  *   **Result:** When water rotates relative to the bucket but is flat, there is no "true" rotation. When it rotates with the bucket (relative rest) but is concave, there *is* "true" rotation.
  *   **Loophole:** A clever relationalist (like Berkeley or Mach later) could say: "The water isn't rotating relative to the bucket; it's rotating relative to the **fixed stars** (or the Earth)." The bucket experiment doesn't strictly rule out the distant matter in the universe as the reference frame.

  **The Two-Globes Argument:**
  *   **Goal:** To show that the *quantity and determination* of motion are knowable even with **no external bodies whatsoever**.
  *   **Setup:** An "immense vacuum." No stars, no Earth, no bucket walls.
  *   **Result:** Even here, the tension exists, and the direction is discoverable via forces.
  *   **Argumentative Work:** This closes the "fixed stars" loophole. Newton is forcing the reader to admit that if you strip away all matter, the dynamical effects of rotation persist. Therefore, the reference frame for that rotation cannot be material. It must be Space itself.

  The bucket shows that rotation has physical effects independent of the immediate container. The globes show that rotation has physical effects independent of *any* container or external matter.

  ### 3. The Philosophical Context (For your self-study)

  Since you are working through the texts alone, it helps to know where this fits in the map of philosophy of physics.

  **Newton's Position: Substantivalism**
  Space is a real entity (a "substance" or akin to one). It exists independently of the bodies within it. It provides the stage against which true acceleration occurs. The Scholium is his manifesto for this view. He needs Absolute Space to make sense of his Second Law ($F=ma$). Acceleration relative to what? Newton says: Absolute Space.

  **The Counter-Position: Relationism**
  Championed by **Leibniz** (Newton's contemporary) and later **Mach**.
  *   **Leibniz:** Argued that Space is merely the order of co-existences between objects. If there were only one object in the universe, "position" and "motion" would be meaningless. He accused Newton of smuggling in theological assumptions (Space as God's sensorium).
  *   **Mach (1883):** Directly attacked your exact passage. Mach argued that in a universe with only two globes, there *would* be no tension in the cord. Inertia is not an intrinsic property of matter relative to space; it is an interaction between matter and the total mass distribution of the universe.
  *   **Einstein:** Was deeply influenced by Mach. He hoped General Relativity would fully implement "Mach's Principle" (that inertia is determined by mass distribution). While GR does make inertia local and geometric, it doesn't fully eliminate absolute structures (e.g., Minkowski space in the limit, or frame-dragging effects which are subtle).

  ### 4. Verdict on Your Reading

  Your complaint is **fair** in the sense that it aligns with the most potent critique of Newtonian mechanics developed in the 200 years following the *Principia*.

  However, it is **unfair** to Newton *on his own terms*. He is not trying to prove Absolute Space to a skeptic who denies the Laws of Motion. He is demonstrating to a fellow practitioner of mechanics that the *consequences* of the Laws of Motion (specifically inertia) imply a reference frame that is not material.

  He is essentially saying: "If you accept $F=ma$, you must accept that $a$ is measured against something non-material. Here is a thought experiment where we strip away all material candidates for that reference frame, yet the $a$ (and its direction) remains measurable. Therefore, the reference frame is non-material."

  **Summary for your notes:**
  1.  **Is it circular?** Only if you deny that inertial forces are real indicators of acceleration relative to space. If you accept Newtonian dynamics, it is a valid deduction.
  2.  **Does it add to the bucket?** Yes. It removes the "fixed stars" as a potential relational reference frame, isolating the system completely.
  3.  **Modern View:** Your intuition is more "Machian" than Newtonian. In General Relativity, the distinction is blurrier, but the idea that "empty space" has structure (metric field) that dictates inertia is actually closer to Newton's substantivalism than to Leibniz's pure relationism.

  You are reading the text exactly as a critical physicist should. Newton is making a metaphysical claim disguised as a mechanical procedure. Your job as a philosopher-physicist now is to decide whether that metaphysics is a necessary foundation or a historical artifact. (Spoiler: Most philosophers of physics today think it's a bit of both.)
