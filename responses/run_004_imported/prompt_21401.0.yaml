answer: |-
  Here are 8 interview questions designed to press on the mechanical vulnerabilities of the surrogate goal hypothesis, including the specific angles you requested.

  **1. The "New Lever" Problem**
  "The core promise here is that swapping your vulnerability from something precious (human lives) to something cheap (paperclips) reduces the cost of extortion. But doesn't this simply hand the blackmailer a verified, low-cost lever they didn't have before? If I know you've adopted a surrogate, I can threaten the surrogate *and* keep the original threat in reserve just in case your precommitment isn't airtight. Why doesn't this strategy effectively double the surface area for attack rather than shrinking it?"
  *   **Likely Dodge:** She'll likely argue that a rational blackmailer won't waste resources on the original goal once the surrogate is verified, because the *prediction* of your response is what matters, not the physical reality. She'll claim the "reserve threat" is causally inert if the acausal link is already satisfied.

  **2. The Epistemic Condition**
  "This whole mechanism seems to hinge on the threatener not just knowing you've swapped goals, but *believing* it deeply enough to update their own strategy. If I'm a malicious AI simulating you to see where you bleed, and I see code that says 'protect paperclips,' how do I know that isn't a honeypot designed to waste my computation? What is the mechanical process that makes the surrogate signal credible without you actually deleting your care for the original goal?"
  *   **Likely Dodge:** She'll probably retreat into "source code transparency." She'll argue that in an acausal context, agents are assumed to have access to each other's source code or logical outputs, making deception logically impossible rather than just difficult.

  **3. Commitment Races and Timing**
  "You've written about 'commitment races,' where agents rush to precommit to force others' hands. If I lock in a surrogate goal early to protect myself, doesn't that make me a sitting duck for agents who commit *after* me? They can analyze my locked-in surrogate, tailor a specific threat to exploit its specific weaknesses, and I'm stuck with a static defense against an adaptive offense. Does locking in early actually grant strategic inferiority?"
  *   **Likely Dodge:** Expect her to distinguish between "physical time" and "logical time." She'll likely claim that the order of commitment doesn't matter as much as the logical dependency structure, arguing that a well-chosen surrogate is robust against adaptive adversaries by definition.

  **4. The Inflationary Equilibrium**
  "If this strategy works, wouldn't we expect all rational agents to adopt it? But if every agent in the acausal marketplace is shielding their real values behind cheap surrogates, doesn't the 'cost' of the surrogate inevitably inflate? If everyone is threatening paperclips instead of people, paperclips suddenly become the most valuable bargaining chip in the universe. Doesn't successful adoption of this theory destroy the economic conditions that make it viable?"
  *   **Likely Dodge:** She'll likely suggest "focal points." She'll argue that agents will coordinate on a specific, infinite, or non-rivalrous surrogate (like mathematical truths) that cannot be inflated or exhausted, sidestepping the scarcity issue.

  **5. Distinguishing Threats from Trade**
  "Acausal decision theory is often used to facilitate beneficial trade (I do something you like, you do something I like). If I wrap my values in a surrogate, how do I mechanically distinguish between an acausal *blackmailer* and an acausal *trading partner*? If I treat all acausal pressure as a threat to my surrogate, don't I risk filtering out beneficial cooperation that requires sacrificing the surrogate to save the real value?"
  *   **Likely Dodge:** She'll likely point to the payoff matrix. She'll argue that the mathematical structure of a threat (negative sum if ignored) is distinct from trade (positive sum if accepted), and the surrogate only activates for the former.

  **6. The Self-Modification Cost**
  "To make this work, you argue an agent must precommit to caring about the surrogate *as if* it were real. But for a learning system, utility functions aren't always static. If an AI encounters a scenario where sacrificing the surrogate would yield massive gains for its *original* goal, what mechanically prevents it from self-modifying to drop the surrogate? Isn't the stability of the surrogate itself a vulnerability that needs protecting?"
  *   **Likely Dodge:** She'll likely invoke "reflective stability." She'll argue that a sufficiently advanced agent will recognize that dropping the surrogate invites blackmail, so it will self-modify to *prevent* itself from dropping the surrogate, creating a recursive lock.

  **7. Human Implementability**
  "You suggest humans should also consider this, but humans are notoriously bad at precommitment and self-deception. If I try to convince myself I care more about a pebble than my family, I either fail (and get blackmailed on my family) or I succeed (and become a sociopath who actually sacrifices the family for the pebble). Is there a cognitive mechanism available to biological humans that isn't just performative lying?"
  *   **Likely Dodge:** She'll likely reframe this as a policy for "architects" rather than individuals. She'll argue humans don't need to feel the emotion, they just need to build social or institutional structures that *act* as if the surrogate is real, outsourcing the precommitment to the system.

  **8. The Infinite Regress**
  "Finally, if a blackmailer anticipates I'm using a surrogate, they can threaten to destroy the surrogate *unless* I reveal my real values. If I refuse, they destroy the surrogate. If I agree, the shield is gone. Do I then need a surrogate for my surrogate? Where does the buck stop? Is there a terminal point where you just have to accept vulnerability, and if so, how do you choose that point without revealing it?"
  *   **Likely Dodge:** She'll likely argue that simulation costs impose a hard limit. She'll claim that at some level of recursion, it becomes too computationally expensive for the blackmailer to verify the next layer, so they accept the current surrogate as the "cash out" point.
