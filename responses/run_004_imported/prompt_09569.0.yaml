          *   *Strategy 2: Interventionism/Counterfactuals.* Causation is about difference-making. If the mental state hadn't occurred, the physical effect wouldn't have (even if the underlying micro-physical realization differed).
          *   *Strategy 3: Explanatory Relevance.* Causation is interest-relative.
