answer: |-
  **Setting:** *A quiet corner of a coffee shop, late afternoon. Two grad students, Alex (neuroscience) and Jordan (philosophy of mind), are debriefing after a long week. A third friend, Sam (the one on SSRIs), is mentioned but not present.*

  **Alex:** Look, I know it sounds cold, but I'm trying to be scientifically honest with Sam. The SSRIs increased synaptic availability of serotonin. That altered the firing thresholds in the prefrontal cortex and the amygdala. *That* is why Sam went for a run. To say "Sam decided to run" adds zero causal power. It's like saying the software caused the computer to heat up, ignoring the electricity.

  **Jordan:** But the software *does* cause the heat. Just not independently of the electricity. You're leaning hard on Jaegwon Kim's exclusion argument. Physical closure, no overdetermination, therefore mental states are epiphenomenal.

  **Alex:** It's not just leaning; it's the architecture. If the physical domain is causally closed—and every neuroscientist assumes it is—then every physical movement (like Sam's legs moving) has a sufficient physical cause (neurons firing). If Sam's "decision" is something *over and above* those neurons, it's a ghost. If it's not over and above, it's just the neurons, and we should stop pretending "reasons" are doing work.

  **Jordan:** Okay, I grant physical closure. I'm a physicalist. But I reject the idea that mental causes and physical causes are *competitors*. That's the flaw in Kim's setup. He assumes that for my decision to cause the run, it has to compete with the neurons for the title of "The Cause."

  **Alex:** They *are* competing for the same effect. You can't have two sufficient causes for one event without systematic overdetermination. Like two assassins shooting at the same time. Do you really think every time someone lifts a cup, their mind and their motor cortex are both independently sufficient causes? That's magical.

  **Jordan:** No, because they aren't independent. That's the non-reductive part. The mental state *supervenes* on the physical. The decision *is* the neural state, described at a higher level of abstraction. It's not a second assassin; it's the *same* assassin described as "the guy in the mask" versus "the guy with DNA profile X."

  **Alex:** But descriptions don't push muscles. Neurons push muscles. If you strip away the neurons, the decision disappears. If the decision disappears when you remove the neurons, but the neurons remain when you remove the "decision" description, then the neurons are the real causal workhorses. The decision is just a shadow.

  **Jordan:** That confuses *ontological dependence* with *causal exclusion*. Just because the shadow depends on the object doesn't mean the shadow can't be predictive or explanatory. But let's go deeper. Let's talk about *difference-making*. Causation isn't just about billiard balls hitting; it's about counterfactuals. If Sam hadn't decided to run, would Sam have run?

  **Alex:** In that specific instance? No. But that's only because the neural state corresponding to the decision wouldn't have been there. The *real* counterfactual is: If those specific neurons hadn't fired, would the legs have moved? No. So the neurons are the difference-makers.

  **Jordan:** But consider multiple realizability. Sam could have decided to run via a slightly different neural pattern tomorrow. Maybe the serotonin levels fluctuate, maybe a different cluster of neurons fires, but the *decision* remains the same. If we intervene on the mental level—"I will run at 5 PM"—we get the behavior, regardless of the specific micro-physical realization. If we only look at the neurons, we lose the generalization. We can't build a science of behavior if we're stuck at the quantum level.

  **Alex:** I agree we need the higher level for *prediction*. I'm not saying "decision" is a useless word. I'm saying it's not *causal*. It's a heuristic. A compression algorithm. When Sam says "I decided," it's a post-hoc summary of a complex neural computation that was determined by prior physical states + the SSRI. The SSRI changed the hardware constraints, making the "run" computation more likely. The "decision" was just the system reporting its output.

  **Jordan:** This is where you lose Sam, and where you lose me. You're treating the mind like a read-only log file. But if the mental level is real—and non-reductive physicalism says it is—then mental properties have causal powers *in virtue of* the physical properties they supervene on. Think of it like a peg and a hole. The square peg doesn't fit in the round hole. Why? Because of the micro-physics of the wood? Sure. But the *causal explanation* is the shape. The geometric property is what does the work.

  **Alex:** The shape *is* the arrangement of the wood fibers, though.

  **Jordan:** Exactly! It's not *plus* the wood fibers. It's the wood fibers *organized*. Sam's decision is the neural firing *organized by reason*. When Sam takes the SSRI, it doesn't just force legs to move like a puppet. It restores the *capacity* to form reasons. Before the meds, the neural substrate couldn't support the "I value health more than comfort" calculation. The meds fixed the substrate so the reason could become effective again.

  **Alex:** Okay, I can accept that the meds restored the *capacity* for rational processing. But when the rubber meets the road, at time *t*, the causal chain is physical. If Sam's decision is truly distinct from the neural firing, it's excluded. If it's identical, then "Sam decided" is just a shorthand for "Sam's dorsolateral prefrontal cortex inhibited the amygdala."

  **Jordan:** Why does "shorthand" imply "no causal power"? If I write a code script that deletes a database, did the *code* delete it, or did the voltage changes in the CPU delete it?

  **Alex:** The voltage changes.

  **Jordan:** But if you change one line of code, the deletion doesn't happen. The voltage changes follow the logic of the code. The code constrains the voltage. Similarly, Sam's reasons constrain the neural firing. If Sam didn't value recovery, the neural firing pattern for "running" wouldn't stabilize. The mental content is playing a causal role by *structuring* the physical process.

  **Alex:** I worry you're smuggling in downward causation. You're saying the abstract value "health" reaches down and tweaks the neurons. That violates closure.

  **Jordan:** Not downward causation. *Constitutive* causation. The value "health" isn't floating in the ether. It's instantiated in the neural network. When the SSRI modulates the network, it makes the "health" instantiation more stable. So, when Sam exercises, it's not the SSRI *instead of* the decision. It's the SSRI *enabling* the decision to be the kind of thing that can cause movement. Without the decision, the neurons don't fire in that sequence. Without the neurons, the decision doesn't exist. They aren't rivals; they're lockstep.

  **Alex:** Lockstep sounds nice, but Kim would ask: Which one is doing the *pushing*? If the physical is sufficient, the mental is redundant. If you say "The decision caused the run," you imply that if the decision existed without those specific neurons, the run would still happen. But that's impossible. So the decision has no independent leverage.

  **Jordan:** Leverage on what? On the *behavior*. Look, Alex, if you tell Sam, "Your decision didn't cause this, your serotonin did," you risk undermining the very mechanism of recovery. Therapy works by strengthening top-down regulation. If Sam believes their agency is an illusion, the prefrontal cortex disengages. The belief in agency is itself a neural state with causal power.

  **Alex:** *That* I can agree with. The *belief* in agency is a causal factor. But that's just another neural state. It's not "Sam the Homunculus" stepping in.

  **Jordan:** But "Sam" just *is* the system of beliefs, desires, and neurons. You're trying to purify causation down to a level where "Sam" disappears. But causation is interest-relative. If we want to know how to fix the brain, we talk chemistry. If we want to know how to live a life, we talk reasons. Both are causal explanations, just at different grain sizes. To say the coarse grain isn't "real" causation is scientism, not science.

  **Alex:** I guess my fear is that if we validate the mental as causal, we open the door to dualism. To magic. If I tell Sam "Your choice matters," I worry they'll think they can override biology with willpower. And they can't. The willpower *is* biology.

  **Jordan:** And if you tell Sam "Your choice is an illusion," they might think nothing they do matters, which changes the biology. You're trapped in the same loop. You can't escape the mental level, even in your neuroscience. You're using reasons to argue that reasons don't work.

  **Alex:** *Pauses, stirs coffee.* Touche. I am using neurons to argue neurons are all that exist.

  **Jordan:** Exactly. So, here's the compromise. The Exclusion Argument holds if you demand that mental causation be *magic*—independent of physics. But if you accept that mental causation is *realized* by physics, then the exclusion vanishes. Sam's decision caused the run. The SSRI made the decision possible. The neurons were the mechanism. All three are true.

  **Alex:** I can live with "realized by." But I still maintain that if we had a Laplace's Demon, it would predict the run based on the particles, not the "reasons."

  **Jordan:** Maybe. But we aren't demons. We're humans trying to get better. And for humans, reasons are the levers that move the world. Even if those levers are made of meat.

  **Alex:** *Smiles.* Fine. The levers are made of meat. And Sam's levers are working again. I can tell them that much.

  **Jordan:** Tell them the meat listened to the mind. That's the story that keeps the levers oiled.

  **Alex:** Deal. But if they start talking about quantum consciousness, I'm stepping in.

  **Jordan:** Fair enough.
