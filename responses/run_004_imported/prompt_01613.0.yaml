answer: |-
  This is fantastic. You have independently stumbled upon one of the most famous problems in contemporary epistemology. You should absolutely bring this up in your class—it fits the unit on rational belief perfectly.

  Your friend is applying a principle of classical logic to a situation that is governed by probability, and that is where the friction is coming from. You are not being irrational; in fact, your intuitions are mathematically more sound than your friend's.

  Here is the breakdown of what is happening, the specific philosophical paradoxes you've encountered, and how to resolve it using the terminology from your class.

  ### 1. The Math Check (Your Friend's Mistake)
  First, let's address your friend's claim: *"If I'm 90% confident in question 1... logically I should be extremely confident I got ALL of them right."*

  Mathematically, this is incorrect. If we treat your "confidence" as a subjective probability (which epistemologists call **credence**), probabilities of independent events multiply, they don't add up.

  *   Confidence in Q1: $0.9$
  *   Confidence in Q2: $0.9$
  *   Confidence in Q1 **AND** Q2: $0.9 \times 0.9 = 0.81$
  *   Confidence in All 120: $0.9^{120}$

  $0.9^{120}$ is approximately $0.000002$.

  So, if you are 90% confident in each individual answer, you should logically be **almost 0% confident** that you got all of them right. Conversely, you should be **99.9998% confident** that you got *at least one* wrong.

  Your intuition ("I almost certainly got at least a few wrong") is actually the one that aligns with the probability calculus. Your friend is treating belief like a switch (On/Off) rather than a dimmer (0–100%).

  ### 2. The Philosophical Problem: The Preface Paradox
  Even though the math supports you, your friend is pointing out a genuine tension in how we define "rational belief." You have encountered a variation of **The Preface Paradox** (introduced by David Makinson in 1965).

  **The Setup:**
  An author writes a non-fiction book. For every single claim in the book, they have done the research and are justified in believing it is true. However, in the preface, the author writes: "Despite my best efforts, I am sure there is at least one error in this book."

  **The Conflict:**
  1.  **Belief 1:** The author believes Claim 1 is true.
  2.  **Belief 2:** The author believes Claim 2 is true.
  3.  ...
  4.  **Belief N:** The author believes Claim N is true.
  5.  **Belief All:** The author believes (Claim 1 AND Claim 2 AND ... AND Claim N) is true. (By the **Conjunction Principle**).
  6.  **Belief Error:** The author believes "At least one claim is false."

  Belief All and Belief Error are contradictory. You can't believe "Everything here is true" and "Something here is false" at the same time.

  Your exam situation is identical. You believe $Q_1$ is right, $Q_2$ is right... but you also believe "Not all are right."

  ### 3. The Core Epistemological Debate
  Your friend is defending the **Conjunction Principle** (also called Agglomeration). This principle states:
  > *If it is rational to believe $P$, and rational to believe $Q$, then it is rational to believe ($P$ and $Q$).*

  If you accept the Conjunction Principle, your friend is right: you are holding contradictory beliefs and must drop one.

  However, most modern epistemologists (especially those who work with probability) **reject the Conjunction Principle** for fallible beliefs. They argue that rational belief is **non-agglomerative**.
  *   It is rational to believe $Q_1$ (because confidence > threshold).
  *   It is rational to believe $Q_2$ (because confidence > threshold).
  *   It is **NOT** rational to believe ($Q_1$ and $Q_2$... and $Q_{120}$) because the combined confidence falls *below* the threshold.

  This connects directly to the **Lottery Paradox** (Henry Kyburg, 1961). In a lottery, it is rational to believe Ticket 1 will lose, Ticket 2 will lose, etc. But it is *not* rational to believe "All tickets will lose" (because one must win).

  ### 4. How to Resolve It (For Your Class)
  You don't need to give up either belief. Instead, you need to refine how you define "belief" vs. "confidence."

  **Option A: The Credence View (Bayesian)**
  You distinguish between **Binary Belief** (Yes/No) and **Credence** (Degree of confidence).
  *   You have high *credence* (0.9) in each answer.
  *   You have low *credence* (~0.0) in the conjunction of all answers.
  *   You have high *credence* (~1.0) in the proposition "I made a mistake somewhere."
  *   **Verdict:** There is no contradiction here. Your credences are perfectly coherent. Your friend is mistakenly applying binary logic to probabilistic states.

  **Option B: The Threshold View (Fallibilism)**
  You define "Rational Belief" as "Credence above a certain threshold (e.g., 90%)."
  *   You rationally believe $Q_1$ (90% > threshold).
  *   You rationally believe $Q_{120}$ (90% > threshold).
  *   You rationally believe "Some are wrong" (99.9% > threshold).
  *   You do **NOT** rationally believe "All are right" (0.0002% < threshold).
  *   **Verdict:** You reject the Conjunction Principle. It is rational to believe the parts without believing the whole. This is the standard solution to the Preface Paradox.

  ### 5. Summary for Your Discussion
  If you bring this to your study group or class, here is the script:

  1.  **Identify the Paradox:** "I think my experience is a real-world example of the **Preface Paradox**."
  2.  **Correct the Math:** "My friend thinks high confidence in parts implies high confidence in the whole, but probability theory says the confidence in the conjunction decreases as we add more questions."
  3.  **The Epistemic Lesson:** "This shows that the **Conjunction Principle** doesn't hold for fallible, probabilistic belief. I can be justified in believing $P$, justified in believing $Q$, but not justified in believing $P \land Q$."
  4.  **Conclusion:** "I don't need to drop a belief. I just need to accept that rational belief is **non-agglomerative** when we aren't dealing with certainty."

  **Verdict:** Your friend is trying to force **Deductive Logic** onto **Inductive/Probabilistic** reasoning. You are right to feel that both beliefs are justified. You are describing a state of **Fallibilism**: you can be justified in believing something even while acknowledging it might be false. That is exactly what your epistemology unit is likely aiming for.
