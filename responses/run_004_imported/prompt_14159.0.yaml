answer: |-
  You have hit upon one of the most important distinctions in the philosophy of religion. Your confusion is well-founded because popular discourse often lumps all "Cosmological Arguments" together, but philosophically, your friend and the historical texts you are reading are defending two structurally different arguments.

  To answer your core question directly: **Your friend is defending a different argument than Leibniz and Aquinas.** They are not merely emphasizing different aspects of the same proof; they rely on different premises and answer different questions.

  Here is a breakdown of the distinction, why it matters, and how to evaluate the relative strengths of each.

  ### 1. The Two Types of Cosmological Argument

  Philosophers generally distinguish between **Temporal (Kalam)** arguments and **Contingency (Sufficient Reason)** arguments.

  #### Your Friend's Argument: The Kalam Cosmological Argument
  This is the version popularized in modern apologetics (often associated with William Lane Craig). Its structure is roughly:
  1.  Whatever begins to exist has a cause.
  2.  The universe began to exist.
  3.  Therefore, the universe has a cause.

  **The Role of Physics:** This argument *needs* Premise 2 to be true. If the universe is infinitely old, this specific argument fails. This is why your friend leans so heavily on the Big Bang and the Borde–Guth–Vilenkin (BGV) theorem. He is trying to secure the "beginning" premise using empirical science.

  #### The Historical Argument: The Argument from Contingency
  This is the version used by Leibniz and (on the standard reading) Aquinas. Its structure is roughly:
  1.  Every contingent thing (something that could possibly not exist) has an explanation for its existence.
  2.  The universe (or the collection of all contingent things) is contingent.
  3.  Therefore, the universe has an explanation for its existence.
  4.  This explanation must be a necessary being (God).

  **The Role of Physics:** This argument is largely indifferent to physics. Whether the universe is 13.8 billion years old or infinitely old, the question remains: *"Why is there a universe at all?"* Even an eternal universe would still be contingent (it doesn't *have* to exist). Therefore, it still requires an external explanation for its being.

  ### 2. Where Aquinas and Leibniz Stand

  You are correct in your reading of the historical texts.

  **Aquinas:** In his *Summa Theologica*, Aquinas actually argues that **reason cannot prove the universe had a beginning.** He believed the world having a beginning was an article of faith, not a demonstrable philosophical truth. His "Five Ways" are designed to work *even if* the universe is eternal. For Aquinas, the issue isn't a chain of causes stretching back in time (temporal); it is a chain of dependence right now (ontological).
  *   *Analogy:* Imagine a chandelier hanging from a chain. It doesn't matter if the chain is 10 links long or infinitely long; if there is no hook in the ceiling holding the top link, the chandelier falls. Aquinas is arguing for the "hook" (sustaining cause), not the "first link" (temporal start).

  **Leibniz:** He formulated the **Principle of Sufficient Reason (PSR)**: "No fact can be real or existing and no statement true without a sufficient reason for why it is so and not otherwise." For Leibniz, an infinite series of contingent states doesn't explain itself. You can have an infinite chain of dominoes falling, but you still need to explain why there are dominoes at all.

  ### 3. Is Your Friend's Argument "Weaker"?

  It is not necessarily "weaker," but it is **differently vulnerable.**

  **Vulnerabilities in the Friend's (Kalam) Approach:**
  *   **Dependence on Science:** By tying the argument to the BGV theorem or the Standard Model of cosmology, the argument becomes vulnerable to scientific revision. If a future theory of quantum gravity suggests a way around the BGV theorem (e.g., a "multiverse" or a "bounce" scenario), Premise 2 is threatened.
  *   **The Nature of the Cause:** Even if the universe began, proving the cause is *God* (omnipotent, omniscient, personal) requires additional philosophical heavy lifting. A "cause" could theoretically be a non-personal quantum fluctuation.

  **Vulnerabilities in the Historical (Contingency) Approach:**
  *   **Dependence on Metaphysics:** This argument relies on the Principle of Sufficient Reason. Many modern philosophers (and scientists) reject the PSR. They might argue, "The universe just *is*. It is a brute fact. Asking for an explanation 'outside' it is a category error."
  *   **Abstractness:** It is harder to grasp intuitively. "Ontological dependence" is a harder sell than "everything that starts needs a starter."

  ### 4. How to Reconcile Them (The "Underlying Argument")

  You asked if there is a way to understand these as the same underlying argument. The unifying theme is **Causal Adequacy**.

  Both arguments agree that **contingent reality cannot explain itself.**
  *   The **Kalam** argument says: "Contingent reality cannot *start* itself."
  *   The **Leibnizian** argument says: "Contingent reality cannot *sustain* itself (even eternally)."

  So, they are siblings, not twins. They share the same goal (establishing a Necessary Being) but attack the problem from different angles (Time vs. Being).

  ### 5. Advice for Your Discussion

  When you speak to your friend again, you don't need to tell him he is "wrong." Instead, you can clarify the landscape. Here is a suggested approach:

  1.  **Validate the Physics:** Acknowledge that the BGV theorem is strong evidence for a beginning, and that the Kalam argument is a valid philosophical form.
  2.  **Introduce the Distinction:** Point out that Aquinas and Leibniz didn't think they *needed* a beginning. Ask him: *"If we discovered tomorrow that the universe is actually eternal, would you agree that we still need to explain why there is something rather than nothing?"*
  3.  **Highlight the Benefit:** Explain that the Leibnizian version insulates the argument from cosmology. If the argument relies on *contingency* rather than *temporal origin*, it doesn't matter if the Big Bang was the absolute start or just a phase in a larger cycle. The need for a Necessary Being remains.
  4.  **The "Hook vs. Link" Analogy:** Use the chandelier analogy mentioned above. Your friend is looking for the first link in the chain. Aquinas is looking for the hook holding the chain up. Both are looking for a cause, but one is temporal and the other is ontological.

  **Summary:** You are not missing anything. Your friend is defending the **Kalam Cosmological Argument** (temporal origin), while the texts you found defend the **Argument from Contingency** (ontological dependence). The latter is generally considered by philosophers to be more robust against scientific change, but it requires accepting heavier metaphysical premises. Recognizing this distinction will allow you to have a much more precise and productive conversation.
