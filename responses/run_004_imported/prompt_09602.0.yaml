      *   *Standard Solutions:*
          1.  **Object-Given vs. State-Given Reasons:** Reasons pointing to properties of the object (admirable) vs. properties of the state of mind (beneficial to have). FA theories usually restrict value to object-given reasons.
          2.  **The Guise of the Good/True:** Attitudes aim at specific goals (belief aims at truth, admiration aims at admirability).
          3.  **Constitutive Aims:** Belief is constitutively aimed at truth. Pragmatic reasons violate the constitutive norm.

