answer: |-
  The coffee shop was loud, but the table in the corner was quiet, dominated by a crumpled napkin and a black felt-tip pen. Elias had drawn a zigzag line down the center of the paper, branching at every vertex.

  "Node 1," Elias said, tapping the top left. "Player One. Take the pot, game over. Or pass, pot doubles, move to Node 2."

  Sarah traced the line down to the bottom right. "Node 100. If we get here, Player Two takes a massive pot. But according to you, we never leave the top corner."

  "According to logic," Elias corrected. He circled Node 1. "Aumann proved it. If it is *common knowledge* that we are both rational, and we both know the structure of this game, I must take at Node 1."

  "And that," Sarah said, leaning in, "is the absurdity. If you take at Node 1, we both get one dollar. If you pass just once, and I pass once, we get ten. If we cooperate to the end, we get a million. You're saying rationality forces us to burn the million to save a dollar?"

  "I'm saying rationality forces me to anticipate what you will do at Node 100," Elias said. He drew an arrow pointing backward from the bottom. "At Node 100, you are rational. You want money. So you Take. You don't Pass."

  "Agreed."

  "So, at Node 99, I know you will Take at 100. So if I Pass to 100, I get less than if I Take at 99. So I Take at 99." Elias moved his pen up the line. "And you know I know that. So at Node 98, you Take. We unwind the spool all the way to the top. I Take at Node 1. It's a logical necessity."

  Sarah picked up her own pen, a red one. She drew a thick circle around Node 3. "Let's stop the spool here. Suppose I am Player 2, and I find myself at Node 3. This means you, Player 1, Passed at Node 1 and Node 2."

  "Hypothetically," Elias said.

  "Actually," Sarah insisted. "In the logic of the game, if Common Knowledge of Rationality (CKR) holds, Node 3 is impossible. It is a null set. But now imagine I am sitting here, looking at the pot, and the game *has* reached Node 3. How did I get here?"

  "You didn't. That's the point."

  "But if I *am* here," Sarah pressed, "then your backward induction reasoning is useless to me. Your reasoning at Node 3 relies on the assumption that I believe you are rational. But you just Passed at Node 1. That was an irrational move according to your own logic. You violated the CKR premise."

  Elias shook his head. "You're confusing the *ex ante* reasoning with the *ex post* observation. CKR is a premise we hold before the game starts. It governs the counterfactuals. I don't need Node 3 to actually occur for the statement 'If Node 3 were reached, Player 2 would Take' to be true."

  "That's the Aumann dodge," Sarah said, underlining Node 3 aggressively. "You're treating rationality like a law of physics that holds even in impossible worlds. But game theory is about *knowledge*. If I see you Pass at Node 1, I have empirical evidence that you are not playing the Backward Induction strategy. My knowledge state updates. I no longer believe CKR holds."

  "So you think I'm irrational?"

  "I think you might be. Or maybe I think *you think I'm* irrational. Maybe you Passed because you thought I'd Pass at Node 4, giving us both more money. If I assume you're trying to cooperate, I should Pass at Node 3. If I Pass, and you Pass at 4, we beat your backward induction outcome."

  Elias leaned back. "But is *that* rational? To Pass at Node 3, you are betting on my irrationality. You are saying, 'I know the logic says Take, but I hope he's stupid.' But if CKR is true, I can't be stupid. If I can't be stupid, you shouldn't bet on it. If you don't bet on it, you Take. If you Take, I Take at Node 1."

  "You're boxing yourself in with a definition of rationality that forbids learning," Sarah said. "Look at the weak point in your tower, Elias. You say CKR is fixed *ex ante*. But for Backward Induction to work at Node 90, Player 1 must believe Player 2 is rational at Node 90. But for Player 1 to believe that, he must believe that Player 2 believes Player 1 was rational at Node 89. This chain goes all the way back to Node 1."

  She tapped the top of the napkin. "If play ever deviates from the equilibrium path—if I Pass when I should Take—the chain is broken. The 'Common Knowledge' is falsified. Once it's falsified, you cannot use it to derive actions at subsequent nodes. You can't say, 'Even though you proved you aren't following the logic, please follow the logic now.'"

  Elias wiped a coffee stain from the corner of the napkin. "You're arguing that a counterfactual conditional is false because the antecedent is false. In logic, if P is false, 'If P then Q' is vacuously true. So, 'If we reach Node 90, Player 2 Takes' remains true even if we never reach Node 90."

  "This isn't symbolic logic, it's epistemic game theory," Sarah countered. "The 'knowledge' part matters. Binmore and Sugden argued this perfectly. If I arrive at an off-path node, I have to form a belief about *why* I'm here. Did you make a mistake? A 'trembling hand'? Or are you trying to signal me? If I assume it was a mistake, maybe I stick to Backward Induction. But if I assume you're trying to teach me to cooperate, I Pass. The Backward Induction solution doesn't tell me which belief to hold off-path. It just assumes the off-path never happens."

  "It doesn't assume it never happens," Elias said, his voice tightening. "It proves it won't happen. That's the power of the theorem. It says: Given CKR, the probability of reaching Node 3 is zero. Therefore, you don't need a theory of belief revision for Node 3. It's a contradiction to suppose we are there."

  "But we *are* there!" Sarah slammed her hand on the table, making the napkin flutter. "In the real world, people Pass. In experiments, people Pass. They get to Node 3 all the time. If your theory says Node 3 is a logical contradiction, but reality shows me Node 3, then your theory has no purchase on reality. You've defined 'Rationality' in such a way that it cannot account for its own failure."

  Elias capped his pen. "If I define Rationality as 'maximizing payoff given correct beliefs about the opponent,' then passing in a Centipede game *is* irrational. If people do it, they are irrational. The theorem holds."

  "That's tautological," Sarah said, calming down but keeping her eyes on him. "You've made Rationality synonymous with Backward Induction. But consider the reverse weakness. My position has a cost, Elias. If I admit that CKR breaks off-path, I lose the predictive power of the theory. If I'm at Node 1, and I think there's a 1% chance you're 'irrational' (a cooperator), I should Pass. If you know I think that, you should Pass. We unravel into cooperation."

  "Exactly," Elias said. "So you admit the Backward Induction outcome is unstable."

  "No, I admit it's *incoherent*," Sarah corrected. "It requires us to believe something we know is false. It requires me to believe you are rational at Node 100, while simultaneously believing you were irrational at Node 1 to get us there. You want me to hold two contradictory beliefs: 'He is a maximizer' and 'He just threw away money.'"

  Elias picked up the napkin and smoothed it out. "I want you to hold one belief: 'He is a maximizer.' The fact that we are discussing Node 100 is a logical exercise, not a historical record. We are simulating the game in our heads before we play. In that simulation, CKR holds. In that simulation, I Take at Node 1. The game ends. We never actually walk down the path."

  "So the game is never played?" Sarah asked.

  "The solution is found before the first move."

  "Then it's not a game," Sarah said softly. "It's a proof. And proofs don't have players who get confused, or hopeful, or vengeful. Look, Elias. The paradox stands because you demand that rationality be a static property of the player, like eye color. I'm telling you it's a dynamic state of belief. If you Pass at Node 1, you change my belief. If my belief changes, your calculation at Node 2 changes. You can't fix the belief at the start and lock it in for a hundred moves."

  Elias looked at the zigzag line. "If belief updates, then there is no unique solution. Game theory collapses."

  "If belief updates," Sarah said, drawing a circle around the middle of the tree, "then game theory might actually describe human beings. You have a logically perfect tower that sits on a foundation of 'Impossible Events.' I have a messy model that accounts for why people actually get rich playing this game."

  Elias uncapped his pen again. He hovered over Node 1. "If you Pass at Node 1, and I Take at Node 2, you get nothing. You punished me for being greedy, but you paid the price."

  "If I Pass at Node 1," Sarah said, meeting his gaze, "I'm buying the option that you're smarter than the theorem. Is that irrational? Or is it just a different definition of knowledge?"

  Elias drew a bold 'X' through Node 1. "It's not a definition of knowledge. It's a gamble."

  "Then the theorem is a gamble too," Sarah said. "It gambles that no one will ever test the nodes down the line."

  Elias sat back, looking at the ruined napkin. "Aumann would say you're conflating the map with the territory."

  "And Binmore would say," Sarah replied, signaling for the check, "that if the map says the territory doesn't exist, you need a new map."
