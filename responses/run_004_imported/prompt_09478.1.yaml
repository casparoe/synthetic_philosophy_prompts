      *   *Teleology:* The *Ethics* rejects final causes (nature doesn't *aim* for male rule). Here, Spinoza seems to infer a natural order from historical regularity. It's not strictly teleological, but it risks naturalizing the status quo (the "is" becomes the "ought").

