answer: |-
  **MEMORANDUM**

  **TO:** Hospital Administration, Department of Medicine, Risk Management, Clinical Ethics Committee
  **FROM:** Clinical Ethics Committee (CEC)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding the Adoption of a Conditional Directive Model for Clinical Ethics Consultation

  ### 1. Executive Summary

  After extensive deliberation regarding the proposal to shift the Clinical Ethics Consultation Service (CECS) from a purely facilitative model to a directive one, the Clinical Ethics Committee recommends the adoption of a **Conditional Directive Hybrid Model**.

  Under this policy, CECS will retain facilitation as the primary default. However, in cases of intractable conflict regarding medical futility or surrogate decision-making authority, consultants may issue a binding "Ethical Recommendation" after specific procedural thresholds are met. This decision acknowledges the operational necessity of resolving harmful stalemates while explicitly addressing the epistemic concern that moral deference may erode professional moral agency.

  ### 2. Background and Tension

  Currently, CECS operates on a facilitative model, assisting stakeholders in reaching consensus without issuing verdicts. While this preserves moral dialogue, Risk Management and Critical Care leadership have highlighted significant downsides: prolonged non-beneficial treatment, resource diversion, and moral distress among staff unable to resolve conflicts with intransigent surrogates or fragmented care teams.

  The proposal to adopt a directive model treats ethics consultations akin to subspecialty medical consults (e.g., Cardiology), where the recommending authority is binding. The Committee recognizes the utility of this analogy for *resolution*, but rejects it for *epistemology*. Unlike an ejection fraction, ethical conclusions are not empirically verifiable facts upon which there is expert consensus. As noted in committee debate, "Consultants disagree with each other about first-order ethical questions the way cardiologists don't disagree about ejection fractions."

  ### 3. Addressing the Epistemic Objection

  The primary objection to the directive model is not procedural friction, but epistemic integrity. There is a valid concern that allowing care teams to implement ethical directives they do not understand or agree with creates "moral compliance without moral understanding." This risks:
  1.  **Epistemic Slackening:** Clinicians may outsource moral reasoning entirely, failing to develop their own ethical competencies.
  2.  **Diffusion of Responsibility:** If a decision is "the ethics consultant's order," the care team may feel absolved of accountability for the outcome.

  The Committee takes this objection seriously. We cannot claim moral infallibility. Therefore, the authority of a directive recommendation rests not on the consultant's superior access to "The Truth," but on **procedural legitimacy**. The binding nature of the recommendation derives from the hospital's commitment to a fair, rigorous, and transparent process for resolving disagreement, not from the ontological status of the conclusion.

  To mitigate moral slackening, the Hybrid Model requires that implementing a directive recommendation does not absolve the care team of moral engagement. They must understand the reasoning, even if they do not endorse it.

  ### 4. Policy Recommendation: The Conditional Directive Hybrid

  Effective **January 1, 2024**, CECS will operate under the following protocol:

  **A. Default Facilitation**
  All consultations begin with the standard facilitative model. Consultants will mediate between parties to seek consensus.

  **B. Criteria for Escalation to Directive**
  A consultant may issue a binding "Ethical Recommendation" only if:
  1.  Facilitation has been attempted for a minimum of 72 hours (or sooner in emergent contexts) and has failed to resolve the conflict.
  2.  The dispute falls into defined categories: (i) Medical Futility (treatment deemed non-beneficial by attending physicians), or (ii) Surrogate Authority/Best Interest disputes.
  3.  The recommendation is reviewed and co-signed by a second senior ethics consultant (peer review) to mitigate individual bias.

  **C. Documentation and Implementation (The "Reasoned Implementation" Clause)**
  To address the epistemic objection, the following documentation standards apply to Directive Recommendations:
  *   **Transparency of Reasoning:** The recommendation must explicitly detail the ethical principles weighed, the minority viewpoints considered, and the rationale for the final decision. It cannot be a bare order.
  *   **Statement of Understanding:** The attending physician implementing the directive must sign a "Statement of Understanding." This attests that they have read the reasoning and understand the ethical justification. It does *not* require them to sign a statement of *agreement*.
  *   **Accountability Split:** The Ethics Consultant retains accountability for the *ethical validity* of the recommendation. The Attending Physician retains accountability for the *medical execution* and communication of the decision. This prevents the care team from claiming they were "just following orders" regarding the patient interaction.

  **D. Appeal Process**
  Families or staff may appeal a Directive Recommendation to the full Clinical Ethics Committee for an expedited review within 48 hours. Implementation is paused during this review unless immediate harm is imminent.

  ### 5. Safeguards Against Moral Slackening

  To ensure this model does not degrade the moral culture of the institution:
  1.  **Mandatory Debrief:** In cases where a Directive Recommendation is implemented, CECS will conduct a brief debrief with the primary care team to discuss the ethical reasoning, ensuring the "teaching moment" is not lost to efficiency.
  2.  **Annual Competency Training:** Clinical staff must complete annual training on ethical reasoning. Reliance on CECS directives cannot substitute for baseline staff competency.
  3.  **Consultant Rotation:** Ethics consultants will rotate through clinical departments to maintain grounding in clinical reality, preventing the isolation of "ethical expertise" from medical practice.

  ### 6. Review and Metrics

  This policy will be reviewed on **January 1, 2025**. The review will assess:
  *   **Resolution Time:** Average days from consult request to resolution in futility disputes.
  *   **Moral Distress:** Staff survey scores regarding moral distress and perceived agency in ethical decisions.
  *   **Litigation/Complaints:** Number of formal grievances filed by families or staff regarding ethics consultations.
  *   **Epistemic Health:** Qualitative interviews with staff to determine if they feel the directive model has reduced their engagement with ethical reasoning or merely clarified the path forward in deadlock.

  ### 7. Conclusion

  We face a choice between the risk of prolonged harm due to unresolved conflict and the risk of moral disengagement due to deference. The Conditional Directive Hybrid acknowledges that while moral truth may be contested, institutional action cannot be paralyzed by disagreement. By mandating transparency and separating ethical accountability from medical execution, we preserve the necessity of resolution without surrendering the requirement for moral understanding.

  **Approved by:**
  *Sarah Jenkins, MD, Chair, Clinical Ethics Committee*
  *David Ross, JD, Vice Chair, Clinical Ethics Committee*
