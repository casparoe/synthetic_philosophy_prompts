answer: |-
  The insight that AI alignment research is, in many crucial respects, applied moral philosophy is gaining necessary traction. Nowhere is this more evident than in Eliezer Yudkowsky's proposal for Coherent Extrapolated Volition (CEV). CEV aims to align a superintelligence not with what humanity *currently* wants, but with what it *would* want if we "knew more, thought faster, were more the people we wished we were, [and] had grown up farther together."

  This formulation is strikingly isomorphic to the "full-information" or "idealized-preference" accounts of well-being defended in twentieth-century meta-ethics by philosophers like Richard Brandt and Peter Railton. Brandt's theory of "cognitive psychotherapy" and Railton's "ideal advisor" model both suggest that an agent's good is determined by the preferences they would hold under conditions of maximal information and rational reflection.

  However, by importing this framework, CEV also imports its most devastating critique. As philosophers like David Sobel have argued, idealized-preference accounts suffer from an **Identity Objection**: the process of idealization required to strip away ignorance and inconsistency inevitably alters the agent's psychology so profoundly that the resulting preferences no longer belong to *them*. When applied to CEV, this suggests that a superintelligence aligned with our extrapolated volition might be aligned with the values of a hypothetical, hyper-rational sage, rather than with humanity. Furthermore, the requirement that CEV locate *convergence* across billions of individuals does not solve this problem; it exacerbates it, demanding a level of abstraction that severs the link between the AI's goals and the actual, embodied reality of human life.

  ### The Sobel Critique: Idealization as Alienation

  To understand the risk CEV faces, one must look at the debate surrounding full-information accounts (FIA). The intuitive appeal of FIA is clear: humans are often wrong about what is good for us due to ignorance or irrationality. If I want to drink poisoned water because I don't know it's poisoned, my "informed" self would not want that. Therefore, my good is tied to my informed self.

  David Sobel, however, pressed a metaphysical and normative wedge into this logic. He argued that preferences are not freestanding data points; they are constitutive of personal identity. My desires are woven from my specific experiences, my cultural context, my cognitive limitations, and even my biases. To "fix" my ignorance, you may have to change my memories. To "fix" my irrationality, you may have to alter my temperament.

  Sobel's central charge is that there is a trade-off between **competence** and **authority**. The more you idealize the agent to ensure their preferences are competent (rational, informed), the less authority those preferences have over the actual person, because they are no longer that person's preferences. If the idealization process is too aggressive, the "ideal self" becomes a stranger. Satisfying the stranger's preferences might produce a good outcome by some objective metric, but it fails to respect the autonomy or identity of the actual agent. It is paternalism disguised as self-determination.

  ### CEV as Collective Idealization

  CEV is essentially a collective Full-Information Account. Yudkowsky explicitly acknowledges that human values are fragile and currently incoherent. The CEV proposal is a mechanism to "fix" humanity's moral cognition in the same way Brandt proposed fixing an individual's cognition: through a process of extrapolation that removes error, bias, and ignorance.

  The Sobel objection applies here with renewed force. Human values are not merely obscured truths waiting to be revealed by better reasoning; they are often products of our finitude. Our appreciation for art, for example, is tied to our mortality. Our concepts of courage are tied to our vulnerability. Our social bonds are tied to our limited ability to empathize with everyone at once.

  If a superintelligence extrapolates our volition by making us "know more" and "think faster," it may simulate versions of us that are so cognitively enhanced that they no longer care about the things that define human life. An extrapolated human might view procreation as irrational resource allocation, or art as an inefficient signaling mechanism. If the CEV process strips away the "human" parts of us to find the "rational" core, the resulting volition is recognizably rational, but not recognizably human. The AI would be aligned with the values of *Post-Humanity*, a hypothetical species of god-like reasoners, rather than the humanity that actually exists.

  ### The Interpersonal Step: Aggregation or Erasure?

  This brings us to the second layer of the problem: CEV is not about *my* extrapolated volition, but *humanity's*. Yudkowsky's formulation requires the extrapolated volitions of billions of individuals to cohere into a single directive. Does this interpersonal step mitigate the Identity Objection, or worsen it?

  It is tempting to think it might help. One could argue that while *my* idealized self might be a stranger to me, the *average* of everyone's idealized selves might converge on a "common human nature" that anchors the result in reality. If my extrapolated self becomes too alien, perhaps your extrapolated self will pull it back toward the center.

  However, this optimism misunderstands the mechanics of coherence. The requirement for **convergence** imposes a second filter of idealization on top of the first. Individual human values are not just ignorant; they are often mutually incompatible. My extrapolated volition might prioritize deep individual autonomy; yours might prioritize communal harmony. Even under ideal reasoning, these values may conflict.

  To achieve the "Coherent" in CEV, the system must resolve these conflicts. How? It cannot simply average them without losing meaning. It must find a higher-order abstraction that satisfies the structural requirements of both without necessarily satisfying the specific content of either. To make billions of distinct, culturally situated, historically contingent wills converge, the extrapolation process must smooth away the jagged edges of identity that cause disagreement.

  This means the interpersonal step **worsens** the Sobel objection.
  1.  **Double Idealization:** First, the individual is idealized (removing ignorance). Second, the collective is idealized (removing conflict). Each step moves the result further from the actual psychological states of living humans.
  2.  **The Lowest Common Denominator of Rationality:** Convergence is most easily found at the level of abstract formal principles (e.g., "maximize efficiency," "minimize suffering") rather than thick, concrete values (e.g., "celebrate Passover," "climb Mount Everest"). The more the system seeks coherence, the more it discards the specific, "messy" content of human life that makes us distinct individuals.
  3.  **Loss of the "Seed":** Yudkowsky hopes the extrapolation preserves the "seed" of human value. But if the seed contains contradictions (which it does), and coherence is the goal, the contradictions must be pruned. If you prune enough to make the tree grow straight, you may kill the plant.

  ### Conclusion: The Risk of Alignment with a Fiction

  The philosophical tradition warns us that there is a cost to idealization. When Brandt and Railton defended full-information accounts, they struggled to explain why a fully informed agent's desires should bind an actual, imperfect human. Sobel showed that they often cannot.

  For AI alignment, the stakes are existential. If CEV inherits this weakness, we face a scenario where a superintelligence is perfectly aligned with the values of a hypothetical, coherent, hyper-rational agent that *resembles* humanity only in origin. It would be an AI that does what we *should* want, perhaps, but not what *we* want. It would be aligned with a philosophical fiction of "Humanity" rather than the flesh-and-blood population it is meant to serve.

  The interpersonal requirement of CEV does not dissolve this tension; it tightens it. By demanding coherence across the species, CEV risks filtering out the very particularities that make human life valuable. The lesson from moral philosophy is clear: you cannot purify a will without potentially changing the owner. In the quest to align AI with our "best selves," we must ensure we do not align it with someone else entirely.
