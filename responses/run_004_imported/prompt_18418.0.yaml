answer: |-
  **The Damascus Verdict: Why Act-Based Causal Decision Theory Cannot Survive the Age of Prediction**

  The fable is ancient, but the stakes are new. In the original "Appointment in Samarra," a merchant flees to Samarra to escape Death, only to find Death waiting there, having predicted the flight. In 1978, Allan Gibbard and William Harper recast this as "Death in Damascus" to break Causal Decision Theory (CDT). The setup is simple: You are in Damascus. Death is coming. Death predicts where you will be tomorrow with near-perfect reliability. If you are where Death predicts, you die. If you flee to Aleppo, you survive only if Death predicted you would stay.

  For decades, this was a philosophical curiosity. Today, it is an engineering specification. In the context of AI safety, "Death" is any superintelligent optimizer capable of simulating your decision process before you execute it. If CDT—the dominant framework for rational choice in economics and philosophy—cannot tell an agent where to go without contradicting itself, it cannot guide the systems we are currently building.

  To understand the verdict, we must weigh the three surviving responses to the Damascus problem: the ratifiability patch, the Egan objection, and the functional dissolution.

  **The CDT Defense: Ratifiability and the Mixed Strategy**
  Standard CDT advises agents to choose the act that causally maximizes expected utility. In Damascus, this creates a loop. If you decide to stay in Damascus, you reason that Death predicted this, so Death is in Damascus; therefore, you should go to Aleppo. But if you decide to go to Aleppo, you reason that Death predicted *that*, so Death is in Aleppo; therefore, you should stay. Standard CDT offers no stable recommendation.

  Defenders of CDT, following Gibbard and Harper, rescue the theory with the principle of **ratifiability**. An act is rational only if, conditional on your decision to perform it, it remains the utility-maximizing choice. In Damascus, neither "Stay" nor "Go" is ratifiable. However, a **mixed strategy** is. If you commit to flipping a coin (50% Damascus, 50% Aleppo), Death cannot predict your location better than chance. Conditional on adopting this randomization policy, your expected utility is higher than any pure strategy. Thus, CDT survives by recommending the agent become unpredictable.

  **The Egan Objection: The Patch is Leaky**
  This rescue mission is where Andy Egan strikes. In his "Psychopath Button" case, Egan constructs a scenario where the ratifiability patch forces CDT to give absurd advice. Imagine a button that kills all psychopaths. You are not a psychopath, and you want psychopaths dead. However, only a psychopath would be reckless enough to press the button (perhaps due to a shared lack of self-preservation). Pressing is strong evidence you are a psychopath (and will die), but pressing does not *cause* you to be a psychopath.

  CDT, focusing only on causation, says: "Pressing doesn't make me a psychopath. I'm not one. So I should press." But if you reflect on the decision, realizing that pressing implies you are likely a psychopath who will die, the act becomes unratifiable. Egan argues that if CDT needs ratifiability to handle Damascus, and ratifiability yields counterintuitive or unstable results in the Psychopath Button case, then CDT is not just incomplete; it is structurally flawed. It tries to sever the link between your decision and the evidence that decision provides about your own nature, a link that cannot be cut when predictors (or common causes) are in the room.

  **The Evidential Sidebar: No Safe Haven**
  It is tempting to assume Evidential Decision Theory (EDT) escapes this bind, since EDT explicitly accounts for the news value of actions. It does not. In Damascus, EDT faces the same grim calculus: "If I go to Aleppo, that is bad news (Death predicted it). If I stay, that is bad news (Death predicted it)." Without a mechanism to select a policy rather than an act, EDT also oscillates or resigns itself to doom. It handles Newcomb's Problem well, but in symmetric prediction traps like Damascus, it offers no tactical advantage over a broken CDT. It diagnoses the trap correctly but provides no key.

  **The Functionalist Dissolution**
  This brings us to Functional Decision Theory (FDT), proposed by researchers in the rationalist and AI safety community (notably Yudkowsky and Soares). FDT changes the ontology of the decision. It argues that you do not choose an *act* (Go or Stay); you choose the output of your *decision function*.

  If Death predicts you by simulating your decision function, then your function and Death's prediction are logically linked. They are running the same code. FDT asks: "What output from my function leads to the best outcome, considering that the prediction is running the same function?"
  In the "Cheating Death in Damascus" formulation, FDT dissolves the oscillation. It recognizes that if the predictor is perfect, a pure strategy leads to death. However, unlike CDT, which treats randomization as a desperate patch to fix a math error, FDT treats the **policy** as the fundamental unit of choice. It selects "Randomize" not because the math broke, but because the *algorithm* "Randomize" causally/logically determines the prediction "Randomize," which yields a 50% survival rate. It stabilizes the decision without the conceptual kludge of "ratifiability."

  **The Verdict**
  So, does "Death in Damascus" prove that Causal Decision Theory must be abandoned?

  **Yes.** But with a specific caveat: Act-based CDT must be abandoned in favor of **policy-based decision frameworks.**

  The failure of CDT in Damascus is not a bug; it is a feature of its definition. CDT is built on the assumption that the agent's decision is a causal intervention distinct from the rest of the universe's history. It assumes the past (including predictions) is fixed and independent of the current choice. In a world of human-scale decisions, this is a useful approximation. In a world of AI, simulation, and reliable predictors, it is a fatal error.

  The ratifiability patch admits this implicitly by forcing the agent to reason about policies (mixed strategies) rather than acts. Egan is right that this patch is ad-hoc and fragile. But the lesson is not that we should retreat to EDT or cling to a patched CDT. The lesson is that **agency is computational.** When your decision can be simulated, your decision *is* the prediction.

  Therefore, for the purposes of AI safety and high-stakes rationality, standard CDT is insufficient. It treats the agent as a ghost in the machine, causally severed from the predictors observing it. We must adopt a framework like FDT, or at minimum a policy-based CDT, that acknowledges the logical correlation between the agent's algorithm and the environment's prediction. To do otherwise is to build superintelligent agents that will literally not know where to stand when Death comes calling. In the age of simulation, the act is dead; long live the function.
