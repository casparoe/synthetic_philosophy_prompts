      *   **Subject:** The father's lifelong practice of Benjamin Franklin's 13 Virtues chart (tracking failures daily).
      *   **Core Conflict:** The speaker has argued in print that this method produces *continence* (struggling against temptation) rather than true *virtue* (habitual excellence where temptation doesn't pull).
      *   **Goal:** A 5-minute toast (approx. 750-850 words spoken at a moderate pace).
      *   **Tone:** Warm, not overly clever, genuine tribute.
      *   **Key Constraint:** Must include *one moment* that works as a specific joke for the philosophers (acknowledging the critique) but lands as a sincere tribute for everyone else. Cannot abandon the published argument (must remain intellectually honest) but cannot undermine the father.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Aristotle:* Virtue is about character state. The virtuous person *wants* to do the right thing. No internal conflict.
      *   *Franklin (and the Father):* Virtue is about monitoring, correction, and effort. Acknowledging failure daily.
      *   *The Speaker's Position:* Father is "continent" (strong-willed) but maybe not "virtuous" (effortless) in the Aristotelian sense.
      *   *The Pivot:* How to make "continence" sound like a *good* thing, even a better thing, without lying about the philosophy?
      *   *Idea:* True virtue might be easy, but *striving* is human. The chart isn't about perfection; it's about caring enough to keep score. The "failure" marks are actually evidence of honesty and love.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the milestone (80 years). Set the scene.
      *   **The Hook (The Chart):** Introduce the Franklin chart. Explain it simply for the laypeople, but with enough detail for the philosophers to nod.
      *   **The Middle (The Tension):** Address the philosophical debate subtly. Acknowledge the effort.
      *   **The Pivot (The "Joke"/Tribute):** This is the critical moment. It needs to reference the "continent vs. virtuous" distinction but frame the father's struggle as superior to effortless goodness.
      *   **The Conclusion:** Bring it back to love, family, and the legacy of trying.

  4.  **Developing the "One Moment":**
