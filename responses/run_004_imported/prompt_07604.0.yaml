  **MEMORANDUM**

  **TO:** Full Faculty Committee on Tenure and Promotion
  **FROM:** Chair, Subcommittee on Tenure Cases
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation and Procedural Review: Tenure Case of [Candidate Name]

  **I. Recommendation on Current Case**

  The Subcommittee recommends **denial of tenure** for [Candidate Name].

  This recommendation reflects the explicit majority vote of the Subcommittee on the bottom-line motion. While the Subcommittee found itself in an unprecedented procedural situation this year, the existing bylaws state only that the Subcommittee "decides by majority vote." In the absence of specific guidance on voting methodology prior to this deliberation, the Subcommittee determined that the binding vote is the one cast on the final recommendation. Two of the three members voted to deny tenure; one voted to grant. Therefore, the Subcommittee's formal recommendation is to deny.

  **II. Analysis of the Voting Discrepancy**

  I must inform the Full Committee of a significant ambiguity in our voting procedure that arose during this deliberation, often referred to in governance literature as the "doctrinal paradox."

  Our tenure bylaws require a candidate to meet two conjunctive thresholds: "Research Excellence" AND "Teaching Effectiveness." In this case, the Subcommittee's judgments were distributed as follows:

  *   **Member A (Chair):** Research (Yes), Teaching (Yes) $\rightarrow$ Grant
  *   **Member B:** Research (Yes), Teaching (No) $\rightarrow$ Deny
  *   **Member C:** Research (No), Teaching (Yes) $\rightarrow$ Deny

  On the **bottom-line recommendation**, the vote is 2-1 to Deny. However, on the **individual criteria**, there is a 2-1 majority in favor of the candidate on Research, and a 2-1 majority in favor of the candidate on Teaching.

  Had we voted issue-by-issue, the collective judgment of the Subcommittee would indicate that the candidate met both criteria required for tenure. Because we voted on the bottom line, the collective judgment indicates the candidate should be denied. While I am transmitting the bottom-line result to honor the vote actually cast, this outcome highlights a flaw in our current procedure that we must address.

  **III. Procedural Recommendation for Future Cases**

  To prevent this ambiguity in the future, I recommend that the Full Committee amend the Subcommittee bylaws to explicitly require **issue-by-issue voting** on tenure criteria, with the final recommendation derived logically from those votes.

  Under a conjunctive standard (A AND B), the only way to ensure the committee's decision aligns with the bylaws is to aggregate judgments on the premises (the criteria), not just the conclusion (the recommendation). If a majority affirms that Research is excellent, and a majority affirms that Teaching is effective, a denial of tenure contradicts the collective finding of fact regarding the standards. Adopting issue-by-issue voting ensures that our outcomes remain logically consistent with our stated criteria.

  **IV. Fair Hearing for the Bottom-Line Approach**

  In recommending a shift to issue-by-issue voting, I owe a fair hearing to the strongest argument for retaining the **bottom-line voting method**, which was the position held by one of my Subcommittee colleagues.

  The primary argument for bottom-line voting is that tenure evaluation is inherently **holistic**, not algorithmic. A checklist approach risks reducing a complex professional assessment to a mechanical formula. A faculty member may agree that a candidate's research is "excellent" in isolation and their teaching is "effective" in isolation, yet still conclude that the *combination* does not merit tenure. For example, a colleague might believe that research excellence must be *demonstrated through* teaching effectiveness, or that a deficit in one area cannot be offset by a bare majority pass in the other.

  Bottom-line voting respects the professional discretion of each committee member to weigh the criteria as they see fit, rather than forcing them to reduce their judgment to binary inputs. It acknowledges that the "whole" of a tenure case is greater than the sum of its parts. By requiring a majority to agree on the final outcome, we ensure that a majority of the committee actually supports the candidate's promotion, rather than arriving at a grant decision through a coalition of members who each harbor significant reservations. In this view, the "paradox" is not a logical error, but a feature of democratic deliberation that prioritizes individual responsibility for the final outcome over collective consistency on the premises.

  **V. Conclusion**

  While the argument for holistic discretion is compelling, the risk of the doctrinal paradox—where a candidate is denied despite a majority finding they met all stated requirements—undermines the transparency and predictability of our tenure standards. To maintain faith in the criteria set by the Faculty, the mechanism of decision must align with the logic of those criteria.

  I therefore transmit the Subcommittee's majority recommendation to **deny** tenure in this specific case, based on the rules as they stood during deliberation. Simultaneously, I urge the Full Committee to adopt **issue-by-issue voting** for all future tenure reviews to ensure our procedures faithfully reflect our standards.

