      *   The friend ignores *signaling*. Repaying signals to the lender (and the mutual friend) that the family is trustworthy. This has future value.
      *   The friend ignores *internal utility*. Most people feel guilt/shame from breaking promises, which is a real cost.

  5.  **Synthesize the Core Conflict:**
