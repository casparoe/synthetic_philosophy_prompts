          *   *Dev:* It's fake. Reema doesn't believe it's wrong, so she's not fixing anything *from her perspective*. It's a favor dressed as ethics.
          *   *Lily:* Consequentialism. Less meat/fashion = good outcome. Intentions don't matter as much as results.
          *   *Analysis:* Dev focuses on *virtue/motive* (are they good people?). Lily focuses on *consequences* (did the world improve?).
          *   *Verdict:* Lily has the stronger practical point (outcomes matter), but Dev highlights a real psychological/ethical hollowness.

      *   **Move 2: Stability/Nature of Commitment (Contract vs. Morality)**
          *   *Dev:* It's conditional. If Chris stops caring, Reema stops eating tofu. It's a contract/bribery, not moral commitment.
