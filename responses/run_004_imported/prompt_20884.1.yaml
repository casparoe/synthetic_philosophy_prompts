answer: |-
  Here are 10 interview questions tailored to your podcast's level of technical literacy, including the specific mandatory challenges and keyed follow-ups you requested.

  **1. The Intuition Pump**
  "Let's start with the core intuition. For the uninitiated, the Doomsday Argument often sounds like a parlor trick: 'I exist now, therefore humanity ends soon.' But you defend the rigorous Bayesian formulation using the Self-Sampling Assumption (SSA). Can you walk us through the specific updating mechanism? When I learn my birth rank, *which* prior probability am I actually updating, and why is that prior sensitive to my existence in a way that physical risk factors aren't?"

  **2. The Stability of SSA**
  "You've argued that SSA is the only consistent way to handle observer selection effects without begging the question. But critics often point out that SSA seems to imply 'probabilities of existence' that shift depending on how many other people exist. Do you view SSA as a fundamental principle of rationality, or is it a pragmatic tool that works only within specific constraints? If it's the former, how do you reconcile it with the intuition that my existence shouldn't depend on the total population count?"

  **3. The Reference Class "Red Herring" (Mandatory)**
  "I want to press you on the reference class objection. In your published work, you've dismissed worries about how we define the reference class as 'a red herring dressed up as a technical objection.' That's a strong claim. If it's truly a red herring, that implies the argument holds regardless of how we carve the class. But the math of the Doomsday Argument is explicitly sensitive to the total number of observers *N*. So I need you to commit: What is the *correct* reference class for this argument, and what non-arbitrary feature binds that class together?"

  **4. Reference Class Follow-Up (Keyed to likely "Cognitive Capacity" defense)**
  *(Anticipating she will define the class as 'beings capable of understanding the argument' or 'observers like us'):*
  "If you anchor the class to 'beings capable of understanding the argument,' you run into the problem of future cognitive enhancement. If we engineer successors who are ten times smarter than us and can process the Doomsday Argument ten times faster, do they count as ten observers or one? If they count as more, does the mere prospect of AI or cyborgs immediately force a Doomsday update for *us* today, simply because we are 'dumber' than the reference class average?"

  **5. SIA and the Presumptuous Philosopher (Mandatory)**
  "Let's talk about the escape hatch. Many philosophers reach for the Self-Indication Assumption (SIA) to neutralize the Doomsday conclusion. You argue this saddles us with the 'Presumptuous Philosopher' problem—believing we live in a vastly larger universe without empirical evidence. But isn't this a choice of bullets? One bullet says 'Doom is likely,' the other says 'The universe is likely huge.' Why is the Presumptuous Philosopher bullet strictly worse than the Doomsday bullet? Is it just that one feels more arrogant, or is there a formal inconsistency in SIA that SSA avoids?"

  **6. SIA Follow-Up (Keyed to likely "Empirical Modesty" defense)**
  *(Anticipating she will argue SIA allows armchair discovery of physical facts):*
  "You often argue that SIA allows us to determine the size of the universe from our armchairs, which violates empirical modesty. But doesn't SSA allow us to determine the *duration* of the universe from our armchairs? If SIA is guilty of presuming too many observers, isn't SSA guilty of presuming too few? Why is the epistemic vice of 'presuming a small world' preferable to the vice of 'presuming a big one'?"

  **7. The Causal Disconnect (Mandatory)**
  "This is the hurdle that keeps me up at night. The Doomsday Argument asks me to update my credence about physical risks—asteroids, pandemics, nuclear stockpiles—based entirely on my birth rank. But there is zero causal contact between my birth rank and the stability of the nuclear arsenal. How can a fact about *me* (when I was born) serve as evidence for a fact about *the world* (physical risk) if there is no causal mechanism linking the two? Aren't we conflating correlation with causation here?"

  **8. Causal Follow-Up (Keyed to likely "Likelihood Ratio" defense)**
  *(Anticipating she will argue it's about likelihoods, not causation):*
  "If you say 'It's not causal, it's Bayesian,' you're relying on the likelihood ratio. But for the likelihood ratio to shift, my existence must be more probable in a short-lived world than a long-lived one. Why is that true? If a long-lived world produces *more* observers, shouldn't I be *more* likely to exist in that world, not less? It feels like the argument assumes the conclusion—that I am a random sample from a fixed set—rather than proving it."

  **9. The Fermi Connection**
  "Stepping back to the broader context: The Doomsday Argument is often paired with the Fermi Paradox and the Great Filter. If we accept your defense of SSA and the Doomsday conclusion, does that locate the Great Filter in our past or our future? And if it locates the filter in our future, does that render traditional x-risk mitigation futile, or does it just raise the stakes on how we prioritize it?"

  **10. Policy and Real-World Impact (Mandatory Closing)**
  "Finally, I want to ask about the stakes of this research. You've defended this as a robust epistemological result. But do you think this should actually move the needle on real-world x-risk funding and policy? If a government official asked you, 'Should we divert resources from asteroid tracking to population control because of the Doomsday Argument,' what do you tell them? Is this a guide for action, or is it, as some critics suggest, a profound but ultimately inert epistemology party trick?"
