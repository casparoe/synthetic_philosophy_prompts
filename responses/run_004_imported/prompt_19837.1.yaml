prompt: |-
  So two people in my rationalist-adjacent friend group (we all met through ACX meetups years back) have had this running argument for like a year about whether our mutual friend Dave's startup is still gonna exist in 2027 -- Mara's consistently said something like 20%, Theo's consistently said something like 80%, and neither has moved an inch no matter how many times it comes up. A couple weeks ago, at the pub after our meetup, it stopped being about Dave entirely and turned into a fight about Aumann's agreement theorem instead, which I honestly found way more interesting then the original argument. Roughly how it went, in order:

  1. Theo: "We've each said our actual number to the other like a dozen times now and neither of us has budged, and it's not like we started from wildly different priors, we're both just normal reasonable people. So by Aumann's theorem this basically already is common knowledge, and if we still disagree, one of us is either lying about their real number or being irrational."

  2. Mara: "Saying a number out loud a dozen times isn't 'common knowledge' in the sense Aumann means -- that needs each of us to know the other's exact number, know that they know we know it, and so on forever. Also, I worked there for a year, I have a bunch of private information you just don't have, and that's a big chunk of why my number's lower."

  3. Theo: "That doesn't actually get you out of it though. The whole point of the theorem is that I don't need to see your evidence, just knowing your posterior should already move mine, assuming we share a prior. So by your own logic I should just adopt your 20%, not throw out the theorem."

  4. Mara: "Except we don't share a prior, that's the part you keep skipping past. My number was already going to be lower than yours before I ever worked there -- I've just never trusted founder promises as much as you do. Aumann's theorem doesn't say anything about two people who started from genuinely different places."

  5. Theo: "A 'genuinely different starting point' that never once moves no matter what gets said is a little convenient though. Isn't that basically the thing Robin Hanson's always going on about -- that when two people who each think the other is basically rational keep disagreeing anyway, it usually means at least one of them isn't being fully honest about updating?"

  Nobody at the table could settle it, obviously. Can you go through this move by move and say who's got the better of it at each step (not just who wins overall), and point out anything about how Aumann's theorem actually works that you think both of them are getting wrong or skating past?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A rationalist-adjacent friend group (ACX meetups). Two friends (Mara and Theo) are arguing about a mutual friend's (Dave) startup survival probability (2027).
      *   **The Dispute:** Mara says 20%, Theo says 80%. Stalemate for a year.
      *   **The Turn:** The argument shifted from the startup to Aumann's Agreement Theorem.
      *   **The Task:** Analyze the 5-step dialogue move-by-move. Determine who has the better argument at each step. Identify misconceptions about Aumann's Agreement Theorem that *both* might be missing.
      *   **Tone:** Analytical, knowledgeable about rationalist concepts (ACX context implies familiarity with Bayesian reasoning, Hanson, etc.), but accessible.

  2.  **Deconstruct Aumann's Agreement Theorem (AAT):**
      *   *Core Claim:* Two rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   *Key Conditions:*
          1.  **Rationality:** Both must be perfect Bayesian updaters.
          2.  **Common Priors:** They must start with the same prior probability distribution over the state of the world.
          3.  **Common Knowledge of Posteriors:** It's not enough to *say* the number. It must be *common knowledge* (I know you know I know you know... ad infinitum) that you hold this specific posterior.
          4.  **Honesty/Truthfulness:** They must report their true posteriors.
      *   *Real-world applicability:** Extremely low. Humans aren't perfect Bayesians. Priors are rarely common. "Common knowledge" is a very high bar in game theory.

  3.  **Analyze the Dialogue Move-by-Move:**

      *   **Move 1 (Theo):** Claims saying numbers a dozen times = common knowledge. Claims they have similar priors ("normal reasonable people"). Concludes one is lying or irrational.
          *   *Critique:* "Saying a number" $\neq$ Common Knowledge (CK). "Normal reasonable people" $\neq$ Common Priors. AAT assumes perfect rationality, which humans lack.
          *   *Verdict:* Theo is overconfident and technically incorrect on the definitions.

      *   **Move 2 (Mara):** Claims saying numbers isn't CK (infinite recursion needed). Claims private information (worked there).
          *   *Critique:* She is right about CK (it's a high bar). She is right about private information. However, AAT says posteriors *should* aggregate private info. If they share priors, her private info should be reflected in her posterior, which should update him.
          *   *Verdict:* Mara is technically more accurate on the definition of CK, but her defense regarding private info is slightly shaky under strict AAT logic (if priors were common).

      *   **Move 3 (Theo):** Doubles down. Says he doesn't need to see evidence, just knowing her posterior should move his (assuming common priors). Says she should just adopt 20% (wait, he says 80%, she says 20%. He says "I should just adopt your 20%"? No, he says "by your own logic I should just adopt your 20% [if I trust the theorem]... not throw out the theorem." Actually, looking at the text: "So by your own logic I should just adopt your 20%, not throw out the theorem." This is a bit garbled. He means: If the theorem holds, our posteriors should be equal. Since they aren't, something is broken. If you claim private info, I should update toward you, not stay at 80%.)
          *   *Critique:* He is right about the *spirit* of AAT (posteriors should converge). He is wrong that the theorem applies cleanly here.
          *   *Verdict:* Theo is logically consistent within the AAT framework, but applying it to humans is the error.

      *   **Move 4 (Mara):** Claims they don't share a prior (she distrusts founders more). Says AAT doesn't apply to different priors.
          *   *Critique:* This is the strongest escape clause. AAT *requires* common priors. If priors differ, disagreement is allowed.
          *   *Verdict:* Mara wins this point technically. Different priors invalidate the theorem's conclusion.

      *   **Move 5 (Theo):** Cites Robin Hanson. "Pre-rationality" / "Common Prior Assumption." Argues that persistent disagreement implies dishonesty or failure to update, effectively challenging the validity of her "different prior."
          *   *Critique:* Hanson argues we *should* act as if we have common priors (the "Common Prior Assumption" as a normative rule). If we believe the other is rational, we should treat their prior as valid.
          *   *Verdict:* Theo brings in the normative rationalist view (Hanson), which counters Mara's descriptive defense.

  4.  **Identify Shared Misconceptions:**
      *   **Common Knowledge:** Both treat it loosely. Theo thinks speaking = CK. Mara knows it's recursive but treats it as a procedural hurdle rather than a state of information partitioning.
      *   **Rationality:** Neither acknowledges that humans are bounded rationality, not perfect Bayesians. AAT fails if *either* agent isn't a perfect updater.
      *   **The "Number":** AAT is about posteriors over *states of the world*, not necessarily point estimates of probabilities which might be interpreted differently (calibration issues).
      *   **Hanson's Point:** Theo cites Hanson, but Hanson's point is usually that we should *update on the fact of disagreement* itself, not just demand the other person submit.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the classic rationalist dinner party vibe. Set the stage.
      *   *Step-by-Step Analysis:* Go through 1-5. Assign a "Winner" or "Advantage" for each based on technical accuracy vs. practical application.
      *   *The "Both Are Wrong" Section:* This is crucial. Explain the actual constraints of AAT (Partitions, Common Priors, Perfect Rationality). Explain why it rarely applies to humans.
      *   *Hanson Nuance:* Clarify what Hanson actually says (Update on Disagreement vs. Common Prior Assumption).
      *   *Conclusion:* Summarize the real lesson (disagreement is data, but AAT isn't a hammer).

  6.  **Refining the content (Self-Correction during drafting):**
      *   *Check Move 3:* Theo says "I should just adopt your 20%." Wait, Theo is the 80% guy. If the theorem says they must agree, and Mara has private info, Theo should update *toward* Mara. He's arguing that *if* AAT holds, his 80% is wrong because she knows something he doesn't. But he's framing it as "The theorem says we should agree." I need to make sure I don't get bogged down in the arithmetic. The core point is: Theo thinks AAT forces convergence; Mara thinks AAT doesn't apply.
      *   *Check Move 5:* Hanson's argument is often that the Common Prior Assumption is *normative*. If you think someone is rational, you should treat their prior as if it were yours. Theo is using this correctly in the rationalist context. Mara is using the *technical* loophole.
      *   *Tone Check:* Keep it friendly but precise. Use terms like "Common Prior Assumption," "Bounded Rationality," "Information Partitions."

  7.  **Final Polish:** Ensure the distinction between "Common Priors" (technical requirement) and "Reasonable People" (Theo's assumption) is clear. Ensure the definition of "Common Knowledge" is explained simply (infinite recursion vs. just hearing it).

      *(Self-Correction on Move 1)*: Theo says "We're both just normal reasonable people." This is the biggest error. AAT requires *perfect* Bayesian rationality.
      *(Self-Correction on Move 4)*: Mara says "I've just never trusted founder promises as much as you do." This is a difference in priors. This is a valid technical exemption from AAT.
      *(Self-Correction on Move 5)*: Theo invokes Hanson. Hanson argues that if you believe the other person is honest and rational, you should treat their different prior as information about the world, effectively updating your own prior to match. It's a "meta-update."

      *Plan:*
      1. Intro.
      2. Round-by-round breakdown.
      3. The "Actually, Both of You..." section (The technical gaps).
      4. The Hanson/Hellman nuance.
      5. Verdict.

  8.  **Final Review against constraints:** "Go through this move by move," "say who's got the better of it," "point out anything... both of them are getting wrong." Okay, ready to write.cw
answer: |-
  This is a classic "rationalist dinner party" deadlock. It's great that the argument shifted from the startup (which is unknowable) to the epistemology of disagreement (which is tractable).

  Here is the move-by-move breakdown of who is technically correct, followed by the things both of them are missing about how Aumann's Agreement Theorem (AAT) actually functions in the wild.

  ### The Play-by-Play

  **Move 1: Theo**
  *   **Claim:** Stating numbers repeatedly creates "common knowledge." Since they are both "reasonable," they share priors. Therefore, disagreement implies lying or irrationality.
  *   **Verdict:** **Mara has the advantage.**
  *   **Why:** Theo is making two category errors. First, "common knowledge" in game theory is not just "I told you and you told me." It requires an infinite recursion of knowledge (*I know that you know that I know that you know...*). Simply stating a number at a pub does not satisfy this; it's just "mutual knowledge." Second, "normal reasonable people" is not a proxy for "identical Bayesian priors." Two reasonable people can have vastly different prior probability distributions based on different life experiences. Theo is treating AAT as a social norm rather than a mathematical constraint.

  **Move 2: Mara**
  *   **Claim:** Stating numbers isn't common knowledge (infinite recursion needed). She has private information (worked at the startup) that justifies her lower number.
  *   **Verdict:** **Mara wins the point, but weakens her position.**
  *   **Why:** She is absolutely correct about the definition of common knowledge; that is the strict technical barrier that prevents AAT from applying to almost all human conversation. However, her second point about private information is actually a concession to Theo's underlying logic. Under AAT, if they *did* share priors, her private information should be encoded in her posterior (the 20%). Theo shouldn't need to see the evidence; the number *is* the summary of the evidence. By emphasizing the private info, she highlights that their posteriors *should* converge if priors were common, inadvertently strengthening Theo's demand for convergence.

  **Move 3: Theo**
  *   **Claim:** He doesn't need to see her evidence; knowing her posterior should move his (assuming common priors). If the theorem holds, they should match.
  *   **Verdict:** **Theo is logically consistent, but practically wrong.**
  *   **Why:** Theo is correctly stating the *implication* of the theorem. If the conditions are met, the posteriors must match. He is right that he shouldn't need to audit her evidence. However, he is failing to update on the *fact* of the disagreement. In a real-world application of rationality (à la Robin Hanson), the persistence of the disagreement is itself evidence that the conditions of the theorem are *not* met (i.e., one of them is not a perfect Bayesian updater). He is using the theorem as a club to demand she submit, rather than as a diagnostic tool to realize the model doesn't fit.

  **Move 4: Mara**
  *   **Claim:** They do not share a prior (she distrusts founders more than he does). AAT does not apply to different priors.
  *   **Verdict:** **Mara wins decisively.**
  *   **Why:** This is the "Get Out of Jail Free" card for AAT. The theorem *strictly requires* a Common Prior Assumption (CPA). If Mara's prior probability for "startup success given founder promises" is fundamentally lower than Theo's before any specific evidence is introduced, the theorem does not compel them to agree. Disagreement is mathematically permissible if priors differ. She has identified the specific axiom that is violated in their friendship.

  **Move 5: Theo**
  *   **Claim:** Cites Robin Hanson. A prior that never moves despite evidence suggests dishonesty or a failure to update. "Genuinely different starting points" shouldn't be immutable.
  *   **Verdict:** **Theo wins the normative argument.**
  *   **Why:** Theo is pivoting from the *mathematical* AAT to the *normative* rationalist stance (specifically Hanson's "Pre-Rationality" or the Common Prior Assumption as a duty). Hanson argues that if you believe the other person is honest and rational, you should treat their prior as if it were your own. You should update your prior to match theirs. By saying "my prior is just different and stays different," Mara is essentially claiming her prior is immune to evidence, which is the definition of dogma. Theo is right that in a rationalist context, "different priors" is often a shield for refusing to update.

  ---

  ### What Both of Them Are Getting Wrong

  While Mara wins on the technical math and Theo wins on the normative rationalist ethos, both are skating past the actual mechanics of why AAT fails in the real world.

  **1. The "Perfect Rationality" Constraint**
  AAT assumes both agents are **perfect Bayesian updaters**. It does not allow for bounded rationality, cognitive bias, fatigue, or calculation errors.
  *   **The Reality:** In a pub, after drinks, neither Mara nor Theo is a perfect Bayesian engine. The theorem breaks if *either* party makes a single calculation error in their update. The fact that they haven't moved in a year is less likely proof of "lying" (Theo's fear) or "different priors" (Mara's defense) and more likely proof that humans are bad at quantifying uncertainty. They are likely treating "20%" and "80%" as vague vibes ("doom" vs. "hype") rather than precise probabilities.

  **2. The Definition of "Common Knowledge"**
  Mara correctly identified that saying a number isn't common knowledge, but she treats it as a procedural hurdle.
  *   **The Reality:** In AAT, common knowledge implies that their information *partitions* are aligned. It means they know exactly *what* the other person knows. In this scenario, Theo doesn't just not know Mara's private info; he doesn't know *how* Mara weights that info. Does she trust her own judgment at 90% reliability? 50%? Without knowing the *function* the other person uses to process evidence, you cannot treat their posterior as common knowledge. You can't just swap numbers; you have to swap processing architectures.

  **3. The Hanson Nuance (The "Agreement to Disagree" Paradox)**
  Theo cites Hanson, but he's using it aggressively. Hanson's point in *Uncommon Priors* and related essays is subtler.
  *   **The Reality:** Hanson argues we should *act as if* we have common priors. If Mara says 20% and Theo says 80%, the rational move isn't for Theo to demand Mara become 80%, nor for Mara to hide behind "my prior." The rational move is for **both** to move to the middle (roughly 50%) immediately.
  *   The persistence of the disagreement suggests neither is actually doing the "Hansonian Update." If they truly believed the other was rational, Theo should lower his estimate significantly (because Mara has inside info), and Mara should raise hers significantly (because Theo has outside perspective). The fact that they are stuck at 20/80 suggests both are overconfident in their own rationality.

  ### The Final Ruling

  **Who won the argument?**
  **Mara** wins on the **technical mathematics**. AAT does not apply because they do not share priors, and they do not have common knowledge of posteriors. Theo is trying to wield a theorem as a moral cudgel, which is a category error.

  **Who is being more rational?**
  **Theo** wins on the **normative epistemology**. Hiding behind "different priors" is often a way to insulate beliefs from social correction. If you believe your friend is honest and intelligent, their persistent disagreement should cause you significant distress and force a major update, regardless of the technical loophole.

  **The Actual Solution:**
  If they want to resolve this like actual rationalists:
  1.  Acknowledge AAT doesn't strictly apply (humans aren't perfect Bayesians).
  2.  Apply the **Geometric Mean of Odds** or simply meet in the middle. If Mara is 20% and Theo is 80%, and they respect each other's rationality equally, the joint probability should be closer to 50% (or the log-odds average).
  3.  Admit that if they haven't moved in a year, they aren't arguing about probability anymore; they're arguing about identity. Mara identifies as the "skeptic who saw the inside," and Theo identifies as the "optimist who backs the founder." That's not a math problem; that's a psychology problem.
