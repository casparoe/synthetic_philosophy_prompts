      *   *Section 3: The Threshold Problem.* The budget isn't a linear cost function. It's a step function. Violating the limit has a discrete utility drop that marginal analysis misses.
      *   *Section 4: Framing/Salesman Tactics.* How the context shifted the reference point (Endowment Effect - once he "had" the car, giving up features felt like a loss).
      *   *Conclusion:* The friend is confusing *local optimality* with *global rationality*.

  7.  **Refining for the PhD Audience:**
