      *   Highlight the **Non-Linearity of the Budget Constraint**. The pain of $20,001 is not marginally greater than $19,999 if $20,000 is a hard cliff.
      *   Conclude on whether the friend is "wrong." Yes, in a normative sense, because rationality requires integrating constraints, not just marginal trades.

  6.  **Drafting the Response (Iterative refinement):**
