  9.  **Final Polish:** Organize into clear conceptual buckets. (Sorites, Dynamic Consistency, Thresholds, Framing). Ensure the distinction between *local* and *global* rationality is the through-line. (Self-correction: Ensure I mention that "hard limit" implies a lexicographic preference or a constraint, not just a cost to be weighed).

