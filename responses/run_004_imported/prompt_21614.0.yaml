answer: |-
  You are absolutely right to be suspicious. Your close reading has caught something that the standard "Worrallian" narrative tends to smooth over. You have identified a genuine tension in Poincaré's text, and more importantly, you have spotted the gap between what Poincaré was actually arguing (a Kantian/Conventionalist synthesis) and what Worrall needs him to be arguing (a Realist response to the Pessimistic Meta-Induction).

  To answer your core question: **Poincaré's text licenses Epistemic Structural Realism (ESR) far more than Ontic Structural Realism (OSR), but even the ESR reading requires a bit of anachronism.** The "lineage" is partly a retrospective invention, though not a baseless one.

  Here is a breakdown of the logic of those passages, why they feel like they are doing different jobs, and where Worrall's appropriation diverges from Poincaré's actual metaphysics.

  ### 1. The "Relations vs. Things" Passage (The Kantian Constraint)
  > *"the aim of science is not things themselves... but the relations between things; outside those relations there is no reality knowable."*

  You noted this reads like damage control against Nominalism (specifically Édouard Le Roy). That is exactly right. Le Roy had argued that scientific laws are merely definitions or conventions with no truth value. Poincaré agrees they are conventions, but he wants to save *objectivity*.

  **The Logic:**
  *   **The Noumenal Reserve:** The crucial qualifier is **"knowable."** Poincaré does not say "there is no reality." He says there is no reality *knowable* outside of relations. This implies a Kantian distinction between the phenomenon (what we experience/know via relations) and the noumenon (the "things in themselves").
  *   **The Status of Relata:** For Poincaré, the "things" (the relata) are not dissolved into structure (as Ladyman/French would later argue in OSR). The things exist as the *cause* of our sensations, but their intrinsic nature is forever hidden. We know $A$ relates to $B$ via equation $E$, but we do not know what $A$ and $B$ *are* in themselves.
  *   **Verdict:** This is classic **Epistemic Structural Realism**. It preserves a mind-independent reality (blocking radical idealism) but limits scientific knowledge to structure (blocking naive realism).

  ### 2. The "Traces" Passage (The Historical Argument)
  > *"It is these traces which we must try to discover, because in them and in them alone is the true reality."*

  This comes from Chapter 9 ("Hypotheses in Physics"), where Poincaré discusses the Fresnel/Maxwell transition. This is the passage Worrall leans on most heavily for the "continuity" argument.

  **The Logic:**
  *   **Equations vs. Images:** Poincaré distinguishes between the "true relations" (the differential equations) and the "images" (the ether, the mechanical models). The images change; the equations remain.
  *   **"True Reality":** When Poincaré says the traces *are* the true reality, he is not necessarily making a metaphysical claim about the furniture of the universe. He is making a claim about **truth-value**. For Poincaré, a scientific statement is "true" if it captures the invariant relations.
  *   **The Divergence:** Worrall uses this to argue that because structure survives, it is probably *approximately true* regarding mind-independent reality (a realist move). Poincaré uses it to argue that because structure survives, it is the only part of science that possesses *objective validity* (a Kantian move).
  *   **Verdict:** This sounds like OSR ("structure *is* reality"), but in Poincaré's mouth, "reality" often means "objective validity for all thinking minds," not necessarily "mind-independent existence."

  ### 3. Why the Two Passages Feel Disconnected
  You sensed they are doing different jobs. They are.

  *   **Passage 1 is Metaphysical/Epistemological:** It defines the *limits* of human knowledge. It answers: "What can we claim to know?" (Answer: Relations).
  *   **Passage 2 is Methodological/Historical:** It defines the *progress* of science. It answers: "How does science improve if theories die?" (Answer: By retaining the mathematical structure).

  The tension arises because Passage 1 leaves the door open for unknowable "things," while Passage 2 identifies the "traces" (structure) as the "true reality." If the traces are the *true* reality, what work is the unknowable "thing" doing?

  For Poincaré, the unknowable thing is a **limit concept**. It prevents science from collapsing into solipsism. But it does no explanatory work. This is why OSR proponents (Ladyman) argue we should cut it out entirely (Occam's razor). But Poincaré, being a 19th-century Kantian, wasn't ready to drop the noumenon entirely.

  ### 4. Is the Lineage a Retrospective Invention?
  **Mostly, yes.** Here is why Worrall's reading is a strategic appropriation rather than strict exegesis:

  1.  **The Problem of PMI:** Poincaré was not worried about the Pessimistic Meta-Induction (the argument that because past theories were false, current ones are likely false). That is a late 20th-century problem formulated by Putnam and Laudan. Poincaré *knew* theories were ephemeral; he didn't need to be convinced of that. He was worried about **Nihilism/Instrumentalism**. He wanted to show science wasn't *just* a useful fiction. Worrall flips this: he uses Poincaré to show science isn't *just* false.
  2.  **Conventionalism:** Poincaré is fundamentally a Conventionalist about the principles of mechanics and geometry. He believes the axioms are definitions in disguise. Modern Structural Realists generally want to be Realists about the structure. Poincaré is a Realist about the *relations* but a Conventionalist about the *framework* in which those relations are expressed. Worrall downplays the Conventionalism to make Poincaré look more like a Realist.
  3.  **The Nature of "Structure":** For Poincaré, the "structure" that survives is often mathematical form (group theory, differential equations). For Worrall, "structure" is often causal or nomic. Poincaré's structuralism is mathematical; Worrall's is ontological/epistemic.

  ### 5. Conclusion: Which Reading is Licensed?
  If you stick strictly to the text of *Science and Hypothesis*:

  *   **OSR (Ladyman/French):** **Not licensed.** Poincaré consistently implies there are "things" (objets) that stand in relations, even if we only know the relations. He never explicitly eliminates the relata. The phrase "no reality *knowable*" is the smoking gun that kills the OSR reading.
  *   **ESR (Worrall):** **Partially licensed.** Poincaré agrees that structure is what we know and that it survives theory change. However, Poincaré's "Realism" is weaker. He doesn't think the structure corresponds to mind-independent reality in the way Worrall hopes; he thinks it corresponds to the *invariant order of sensations* shared by all minds.
  *   **The "Retrospective" View:** **Most accurate.** Poincaré is best read as a **Kantian Conventionalist**. He believes the mind imposes structure (space, time, causality) on the world. The "relations" are real because they are the necessary conditions for experience, not necessarily because they mirror the world-as-it-is.

  **Summary for your reading group:**
  You can confidently argue that Worrall is engaging in **constructive appropriation**. He takes Poincaré's insight about the continuity of equations (Passage 2) and grafts it onto a Realist metaphysics that Poincaré himself would likely have found too dogmatic. Poincaré's "relations" are the limit of *knowledge* (ESR), but Worrall treats them as the limit of *ontology* (leaning toward OSR) to save scientific realism from the PMI.

  Poincaré isn't the patron saint of Structural Realism; he is the patron saint of the **idea** that inspired Structural Realism. There is a difference. Your confusion stems from the fact that secondary literature often collapses that distinction. Trust your reading of the primary text; it's more nuanced than the citation chain suggests.
