      *   **Specific Requirements:**
          *   (a) Natural vs. Artificial Machines (infinite organization vs. inert parts) and the possibility of a "dominant monad" in artifacts.
          *   (b) Hierarchy of Monads (Bare -> Soul -> Spirit), Apperception, Reason, and the "City of God" (moral standing).
          *   (c) The definition of "Artificial" in light of self-modifying software (training/weights).
          *   (d) Explicitly state where the framework underdetermines the answer or where premises are rejectable.
      *   **Tone:** Rigorous, philosophical, engaging with metaphysics, acknowledging the user's background (technical but non-philosopher).

  2.  **Initial Assessment & Leibnizian Basics:**
      *   *Monadology:* Reality consists of simple substances (monads). They are immaterial, mind-like, windowless, and perceive/appetite.
      *   *Pre-established Harmony:* Monads don't interact; God synchronized them.
      *   *Matter:* Phenomenal, not substantial. It's an aggregation of monads.
      *   *Machines:*
          *   *Natural Machine (Organism):* Divisible to infinity, every part is also a machine. Has a dominant monad (soul/entelechy).
