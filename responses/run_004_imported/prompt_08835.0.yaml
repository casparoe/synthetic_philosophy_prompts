answer: |-
  This is a fantastic angle for a novel. You are absolutely right that the pop-culture version of Augustine ("Lying is always a mortal sin, period") flattens his actual philosophical rigor. He was obsessed with the *mechanics* of language and truth, not just the rulebook.

  If you put your memoirist on trial before Augustine based on *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying), he would not condemn her simply because she wrote falsehoods. He would condemn her based on **signification** and **intent.**

  Here is how Augustine's actual logic breaks down for your character, and why the "fiction exception" would not save her.

  ### 1. The Definition: It's Not About Falsehood, It's About Deception
  Augustine makes a crucial distinction between *falsitas* (saying something false) and *mendacium* (lying).
  *   **Error:** If your memoirist writes something false because she *remembers* it incorrectly, Augustine says she has not lied. She has erred. There is no sin in error, only in the will.
  *   **The Lie:** A lie occurs when there is a disconnect between what is in the mind and what is signified by words, **combined with the intent to deceive** (*voluntate fallendi*).

  **The Verdict:** If your character *knows* the event didn't happen but writes it as if it did, she satisfies the definition of a lie. The "emotional effect" you mentioned is key here: if she invents a scene to make the reader feel a specific way (pity, awe), she is actively manipulating the reader's belief state. She *wants* them to be deceived about the reality of the event to achieve the emotional result.

  ### 2. The Fiction Exception: Why "It's a Book" Doesn't Work
  You hit on the exact loophole Augustine provides. He explicitly says that in comedies, mimes, and poems, falsehoods are not lies. Why? **Because no one is deceived.**

  Augustine argues that the "contract" of fiction is transparent. When an audience watches a play, they know the actor is not actually Oedipus. The signs (words/actions) do not claim to correspond to historical reality. Therefore, there is no *intent to deceive* because the context signals "this is make-believe."

  **The Verdict:** Your memoirist cannot use this defense. The genre of "Memoir" carries an implicit ontological claim: *This happened.*
  *   If she labels it "A Novel," she is in the clear (Augustine-wise).
  *   If she labels it "A Memoir," she is invoking a truth-claim.
  *   Because the reader approaches the text expecting factual correspondence, and the author knows this, the intent to deceive is present. The "book" format doesn't matter; the **genre contract** matters. To Augustine, calling a fabrication a memoir is a corruption of the function of language, which is to convey what is in the soul to another soul.

  ### 3. The Graded Scale: Where Does She Fall?
  Augustine outlines eight types of lies, ranging from most heinous to least heinous. He maintains that *all* are sins, but the moral weight varies based on who is harmed and what the motive is.

  1.  Religious doctrine (Hersey).
  2.  Lies that harm someone and help no one.
  3.  Lies that harm someone to help another.
  4.  Lies told for the sheer pleasure of lying.
  5.  Lies told to please others (polite lies).
  6.  Lies that harm no one and help someone (e.g., protecting a secret).
  7.  Lies that harm no one and save a life.
  8.  Lies that protect someone from bodily defilement.

  **The Verdict:** Your memoirist is likely in **Category 4 or 5**, which is quite bad in Augustine's eyes.
  *   **Motive:** She is lying for "emotional effect," which usually translates to aesthetic pleasure, fame, sales, or catharsis. This is self-serving.
  *   **Harm:** Augustine would argue she harms the reader (corrupting their understanding of truth), harms the people she writes about (if they are misrepresented), and harms herself (corrupting her own soul).
  *   **The "Emotional Truth" Defense:** If your character argues, "I lied to reveal a deeper truth," Augustine would reject this. For him, Truth (*Veritas*) is God. You cannot serve Truth by utilizing Falsehood. The end never justifies the means. A lie told to make people feel "better" or "more moved" is still a lie that distances the soul from God.

  ### 4. The Nuance for Your Novel: The "Jocund" Lie
  There is one area where your character might try to wiggle, which could create great internal conflict. Augustine discusses lies told in jest (*jocandi*). He says these are less sinful because the deception is temporary and usually obvious.

  If your memoirist argues, "I'm a storyteller; memory is a storyteller; everyone knows memory is faulty," she is trying to reclassify her memoir as a *joke* or a *play*.
  *   **Augustine's Counter:** He would ask: "Did you take money for it? Did you accept accolades for your 'bravery' in telling the 'truth'?"
  *   If she profited from the deception, the "jest" defense collapses. The moment she demanded the world treat the lie as truth (for awards, status, or sales), she forfeited the fiction exception.

  ### 5. How to Use This in the Story
  If you want to use Augustine's actual logic to drive the plot or character arc, consider these angles:

  *   **The Critic as Augustinian:** The person who exposes her shouldn't just be angry about the facts; they should be angry about the **semiotics**. They should argue that she has broken the trust of language itself. "You didn't just lie to me; you broke the tool we use to know anything."
  *   **The Character's Rationalization:** Your protagonist could genuinely believe she falls into the "Fiction Exception." She could argue, "All memory is fiction." Augustine would say that is a category error. Memory is an attempt to retrieve truth; fiction is an attempt to create beauty. Confusing them is the sin.
  *   **The Hierarchy of Harm:** The drama could peak when she realizes her lie didn't just hurt her reputation (Category 5), but actively harmed someone else (Category 3). For example, if she invented an abuser who didn't exist, she has harmed the memory of the innocent. In Augustine's scale, moving from a self-serving lie to a harmful lie is a descent into hell.

  ### Summary
  Augustine would say: **It is a lie.**
  *   **Why?** Because the intent was to deceive the audience about reality.
  *   **Why not fiction?** Because the audience was not invited into the "conspiracy" of make-believe.
  *   **Severity:** Moderate to High. It is a lie for gain (fame/emotion) that corrupts the community's trust in testimony.

  The tragedy for your character, in Augustinian terms, isn't that she got caught. It's that in seeking to create a "more perfect" truth through lies, she alienated herself from *Veritas* (Truth itself). She tried to play God with reality, and in doing so, lost her soul. That's a hell of a thematic backbone for a novel.
