answer: |-
  This is a textbook case of the debate between **Internalism** and **Externalism** about practical reasons. Given that you are taking a seminar on this exact topic, you are well-positioned to recognize that your friend is articulating a crude version of the **Humean Theory of Reasons** (often associated with Bernard Williams' "Internal Reasons Thesis"), while your intuition aligns with **Externalism** (often associated with Kantian rationalism or contemporary moral realists like T.M. Scanlon).

  While both positions have sophisticated defenses in the literature, your position is generally considered more defensible in the context of promissory obligations. Here is an analysis of why, broken down by the philosophical frameworks at play.

  ### 1. Your Friend's Position: Internalism
  Your friend is arguing for **Reasons Internalism**. The core claim is that for a consideration (e.g., "you promised") to count as a reason for an agent to act, it must be grounded in that agent's "subjective motivational set" (their desires, projects, or commitments).

  *   **The Logic:** Reasons are instrumental. You have a reason to $X$ only if $X$ satisfies a desire you already have.
  *   **The Application:** Since your friend no longer desires to maintain the friendship or honor the promise, the fact that he promised no longer connects to his motivational set. Therefore, he claims, the reason ceases to exist.
  *   **The Appeal:** This view respects the link between reason and motivation. It explains why people actually *move* to act. It avoids positing "queer" metaphysical entities (objective reasons floating in the ether that apply to us regardless of our psychology).

  ### 2. Your Position: Externalism
  Your intuition aligns with **Reasons Externalism**. This view holds that there are objective normative reasons for action that exist independently of an agent's desires or subjective motivations.

  *   **The Logic:** Certain facts (like "you made a promise" or "this action causes harm") generate reasons simply in virtue of their nature.
  *   **The Application:** The act of promising creates a normative obligation. This obligation provides a reason to repay the money regardless of whether your friend currently *cares* about the obligation.
  *   **The Appeal:** This preserves the binding nature of morality. It prevents agents from "opting out" of moral obligations simply by altering their attitudes (e.g., a thief doesn't escape the reason not to steal just because he doesn't care about property rights).

  ### 3. Why Your Position is More Defensible
  While Internalism is a dominant theory in meta-ethics, your friend's specific application of it in this context suffers from three major philosophical weaknesses that make your Externalist intuition stronger.

  #### A. Confusing Motivating vs. Normative Reasons
  Your friend is conflating **motivating reasons** (what explains why an agent acts) with **normative reasons** (what justifies an action).
  *   It is true that if he doesn't care, he lacks a *motivating* reason. He won't feel moved to pay you.
  *   However, practical reason is usually concerned with *normativity*—what an agent *ought* to do. Even if he lacks the motivation, the justification remains. If a student asks, "Do I have a reason to study?" the answer "Yes, because you want to pass" is different from "Yes, because you enrolled in the course." The latter applies even if he no longer cares about passing. By claiming the reason *doesn't exist*, he is making a claim about normativity, not just psychology, and there he is wrong.

  #### B. The Rational Criticizability of Desires
  Internalism assumes that our subjective motivational set is a "black box" that reason cannot touch. However, most philosophers argue that desires themselves can be rational or irrational.
  *   If your friend made a promise, he entered a normative relationship. To subsequently decide "I no longer care about this promise" is not a neutral shift in preference; it is a **rational failure**.
  *   As T.M. Scanlon argues in *What We Owe to Each Other*, the principle of Fidelity is grounded in the value of mutual recognition. To reject the reason to keep a promise is to reject the standing of others to hold us accountable. This is a failure of rationality, not just morality. Therefore, the reason exists *because* a rational agent in that position would care, even if this specific agent currently claims not to.

  #### C. The "Bootstrapping" Problem
  If your friend is right, he can create or destroy reasons at will simply by changing his feelings. This leads to absurdity.
  *   If I can eliminate a reason to repay a debt simply by deciding I don't care about debts, then the concept of a "debt" loses its meaning.
  *   Externalists argue that reasons constrain our desires, not the other way around. The promise *gave* him a reason, and that reason persists even if his desires change. To argue otherwise is to say that normativity is entirely subjective, which undermines the possibility of interpersonal obligation.

  ### 4. The Strongest Counter-Argument (and why it fails here)
  The strongest argument for your friend comes from the **Motivation Problem**. If external reasons exist independently of desires, how do they motivate? If he truly has no desire to pay, in what sense is it "practical" reason?
  *   **Response:** Practical reason is not just about what moves us; it is about what we are answerable to. We can be irrational. We can fail to act on our reasons. The fact that he is not motivated does not prove the reason doesn't exist; it proves he is practically irrational.

  ### Verdict
  Your friend has adopted a **Humean Internalist** stance, which is a coherent philosophical position but one that struggles immensely to account for moral obligations like promising without collapsing into subjectivism.

  You are holding an **Externalist** (likely Kantian or Scanlonian) view. In the context of promissory obligations, this is the more defensible position. Promises are "speech acts" that intentionally alter the normative landscape. If the reason to fulfill them vanished the moment the promisor's feelings changed, the institution of promising would be impossible.

  **Conclusion:** You have the stronger argument. Your friend is describing a lack of *motivation*, but he is incorrectly inferring a lack of *reason*. In a seminar on practical reason, the distinction between "I don't want to" and "There is no reason to" is the crux of the matter. He is right about the former, but wrong about the latter.
