answer: |-
  **Setting:** *A quiet study, timeless and lined with books. A fire crackles in the hearth. John Locke sits in a leather armchair, looking weary but sharp. George Berkeley, younger and brighter-eyed, stands by the mantel, turning a silver shilling over in his fingers.*

  **Berkeley:** You look at this coin, Mr. Locke, as a man looks at a ruler. You see a fixed measure. An inch is an inch, and a shilling is a specific weight of silver. To alter the stamp without altering the weight is, in your view, a fraud upon the public.

  **Locke:** It is not merely my view, Mr. Berkeley. It is the nature of contracts. When a man lends money, he lends a certain quantity of silver, defined by the law. If the Prince were to decree tomorrow that an ounce of silver is now five pounds instead of three, he has not created wealth. He has merely stolen from the creditor to give to the debtor. It is a tax without consent.

  **Berkeley:** I do not dispute the injustice of breaking contracts. But I dispute the premise that the silver *is* the wealth. You say money is a measure. I say it is a ticket. A counter. Like a chip at a gaming table. Does the chip have value because of the clay it is pressed from? Or because it entitles the holder to claim a share of the pot?

  **Locke:** A poor analogy. At a gaming table, the players agree to the rules before they begin. In the economy of nations, men trade with strangers they will never see again. A merchant in Amsterdam will not accept your "ticket" of paper or brass. He wants the silver. Why? Because the silver has a value universal to all mankind, independent of any single Prince's decree.

  **Berkeley:** But why does it have that value? Is it not because mankind has agreed to treat it so? If we were to find that silver was as common as copper, would it not lose its power?

  **Locke:** Perhaps. But it is not common. Nature has made it scarce, durable, and divisible. That is why it was chosen. It is not an arbitrary agreement like the rules of a game. It is a discovery of convenience. To pretend that a bit of paper can do the work of silver is to pretend that a drawing of a loaf of bread can nourish a starving man.

  **Berkeley:** Yet, in my own Ireland, I have seen men starve while silver sat idle in a strongbox. The bread was there, the labor was there, but the "ticket" to move the bread to the mouth was absent. If money is merely a tool to circulate industry, and paper can do that job better—because it is easier to multiply when industry grows—why cling to the metal? If the King issues paper, and the people accept it for taxes and goods, does it not function exactly as the silver did?

  **Locke:** It functions for a time. But you rely on the people's acceptance. What secures that acceptance? With silver, it is the nature of the metal itself. With paper, it is the credit of the state. And states are fickle. States go to war, states collapse. If you tie the money to the state, you tie the merchant's livelihood to the politician's whim. Silver is a wall against the folly of governors.

  **Berkeley:** You place your faith in the mine; I place mine in the people. You think wealth is the pile of metal. I think wealth is the capacity of the people to produce. If I have a nation of industrious workers, I have wealth. If I have a mountain of gold and a nation of beggars, I have poverty. Money should be a spur to industry. If the supply of silver is too rigid, it chokes trade. It is like trying to water a garden with a hose that cannot expand when the plants grow.

  **Locke:** But if you expand the hose at will, you flood the garden. If you print more tickets than there are goods to claim, you do not create wealth. You merely raise the price of the goods. I have seen this with the clipped coinage. Men bring silver to the mint, it is returned with a higher face value, and immediately the price of corn rises. The silver buys less. The measure has been corrupted.

  **Berkeley:** That is because they tried to raise the value by fiat while pretending the metal was the same. I propose we admit the truth: the metal is incidental. If we issue paper, backed not by a promise to pay in silver, but by the land and labor of the nation itself... why would that not hold? If I know I can use this paper to buy wool from my neighbor, or pay my rent to my landlord, what do I care if it is silver or linen pulp?

  **Locke:** You care because you wish to save. You care because you wish to know that the labor you expend today will purchase the same bread ten years from now. Silver is stable. Paper is a promise. And promises, Mr. Berkeley, are only as good as the honor of the promiser. I would rather trust the silence of the earth, which yields silver slowly, than the tongue of a Parliament, which can speak new laws every morning.

  **Berkeley:** But the earth yields silver for Spain, not for Ireland! If we must wait for Spain to send us coins before we may work our fields, we shall starve. Is it not better to create a local token that allows the Irishman to build his house *now*? You speak of money as a store of value for the saver. I speak of money as a wheel for the worker.

  **Locke:** And if the wheel spins too fast, it flies apart. You speak of trust in the people. But the people are guided by self-interest. If they suspect your paper is not redeemable in something real, they will flee to the silver. And then your paper is worthless. You cannot legislate confidence.

  **Berkeley:** Nor can you legislate scarcity. Look, Mr. Locke. We agree that money is a medium of exchange. We agree that it facilitates trade. We disagree on what anchors it. You say the anchor must be outside of society, in the earth. I say the anchor must be inside society, in the collective trust and industry of the citizens. Is it not strange to you? That we should let the prosperity of a nation depend on how much dirt a miner can dig out of the ground in Peru?

  **Locke:** It is not the dirt. It is the consent of mankind. Silver is the language of trade. If you speak a dialect only your village understands, you cannot trade with the world. You isolate yourself. I fear your "ticket" system makes every nation an island, dependent on its own good behavior. Silver forces discipline. It forces a nation to live within its means.

  **Berkeley:** Or it forces a nation into slavery to those who hold the mines. I am a Bishop, Mr. Locke. I look at souls. I see that idleness is a sin. If a rigid money supply causes idleness because there are not enough coins to facilitate labor, then that money system is morally deficient. I would rather risk inflation than stagnation. I would rather have a currency that encourages a man to build, even if the price of his brick fluctuates, than one that keeps the brick unbuilt because the "measure" is too scarce.

  **Locke:** And I am a physician of the body politic. I know that when you tamper with the measures, you invite fever. Inflation is a hidden tax on the poor. The rich have land and goods; the poor have only their wages and their savings. When you dilute the currency, the wages buy less. The savings vanish. You speak of helping the worker, but your paper money is the tool of the speculator.

  **Berkeley:** And your silver is the tool of the hoarder! He buries the wealth of the nation in a vault. At least paper must circulate to have value. It rots in the pocket if not spent. It encourages velocity. It encourages life.

  **Locke:** *Pauses, looking into the fire.* You argue for vitality. I argue for security.

  **Berkeley:** I argue that the value is in the *use*, not the *substance*. Just as a word has meaning not because of the ink, but because of the idea it conveys.

  **Locke:** But if the ink fades, the idea is lost. Silver does not fade. It is the one constant in a world of change. To build a society on trust is noble, Mr. Berkeley. But trust is a fragile thing. It takes years to build and seconds to break. Silver requires no trust. It requires only a scale.

  **Berkeley:** And yet, even the scale must be agreed upon. We are back to consent. Even the gold worshipped in the Indies is worshipped because men agree to worship it. If we could but shift that agreement to the productivity of our own people...

  **Locke:** *Sighs softly.* Perhaps. But until you find a way to make paper grow in the ground, or sail to India on a ship of credit, I fear the metal will remain king. Men may dream of tickets, but in the moment of fear, they reach for the silver.

  **Berkeley:** *Smiles, placing the shilling on the table between them.* Then let us hope, sir, that men may one day learn to fear their neighbors less, and trust their own industry more. Until then, I suppose we shall argue over the shilling.

  **Locke:** *Nods.* And it is better to argue over the shilling than to let it be clipped in silence.

  *Locke picks up the coin, weighs it in his hand, and sets it down. Berkeley watches it spin, catching the firelight, looking for a moment like nothing so much as a simple token, before it settles, heavy and still.*
