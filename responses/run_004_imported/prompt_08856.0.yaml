answer: |-
  The Lucas–Penrose argument is one of the most famous and intriguing arguments in the philosophy of mind. It is intellectually seductive because it leverages a rigorous mathematical result (Gödel's incompleteness theorems) to make a metaphysical claim about human consciousness.

  However, the reason logicians, cognitive scientists, and philosophers of mind largely remain unpersuaded—and continue to treat computationalism as a serious possibility—is that the argument relies on several assumptions that are widely considered untenable or unproven.

  Here is a breakdown of the primary objections that keep the debate open and computationalism alive.

  ### 1. The Consistency Assumption
  This is the most significant hurdle, and it addresses the specific point you raised about your friend's objection.

  Gödel's First Incompleteness Theorem states that for any **consistent** formal system $F$ capable of arithmetic, there is a sentence $G_F$ that is true but unprovable within $F$. The Lucas–Penrose argument hinges on the claim that humans can "see" the truth of $G_F$.

  However, we can only validly infer that $G_F$ is true **if we assume $F$ is consistent**. If $F$ is inconsistent, it can prove anything, including $G_F$ and $\neg G_F$. Therefore, to claim that the mind surpasses $F$, we must claim:
  1.  We know $F$ is consistent.
  2.  We know our own reasoning is consistent.

  **The Problem:** By Gödel's **Second** Incompleteness Theorem, a sufficiently powerful consistent system cannot prove its own consistency. If the human mind is a formal system, it cannot prove its own consistency. If we cannot prove our own consistency, we cannot be certain that our intuition that "$G_F$ is true" isn't actually a symptom of our own inconsistency.

  You mentioned that "whichever formal system might be proposed... Gödel's theorem still lets us exhibit a truth." This is only true if we know the proposed system is consistent. If a computationalist proposes a model of the mind, $M$, and we cannot prove $M$ is consistent, we cannot assert that $M$ fails to prove $G_M$ while we succeed. We might both be inconsistent, or we might be "proving" $G_M$ based on a hidden contradiction in our own reasoning. Since human mathematicians have historically held inconsistent beliefs (e.g., in naive set theory before Russell's Paradox), the assumption of human consistency is empirically dubious.

  ### 2. The Problem of Self-Knowledge (Introspective Access)
  To construct the Gödel sentence $G_{Mind}$, one needs the specific description (the code or axioms) of the formal system in question.

  For the Lucas–Penrose argument to work, a human must be able to inspect their own cognitive machinery, formulate a precise description of it as a formal system $F$, and then construct $G_F$.
  *   **Do we have access to our own code?** Most cognitive scientists argue we do not. We have introspective access to the *outputs* of our thinking, but not the underlying algorithms.
  *   **Complexity:** Even if we are computational, the "program" running the human mind might be too complex, distributed, or opaque for the mind to fully formalize itself. If we cannot write down the exact axioms of our own reasoning, we cannot construct the specific Gödel sentence that applies to us.

  ### 3. Idealization vs. Reality
  The Lucas–Penrose argument relies on an idealized view of human mathematical reasoning. It assumes the mind is a theorem-prover that operates with logical necessity.
  *   **Fallibility:** Real human reasoning is heuristic, probabilistic, and prone to error. We do not operate like a sound formal system. We make mistakes, change our minds, and accept proofs that later turn out to be flawed.
  *   **Mechanism doesn't require perfection:** A computationalist does not need to claim the mind is a *perfect* logic machine. They only need to claim it is a physical system that processes information. If the mind is a "noisy" Turing machine or a probabilistic automaton, Gödel's theorem (which applies to deterministic, consistent formal systems) may not apply in the clean way Lucas and Penrose suggest.

  ### 4. Computationalism is Broader than "Classical TMs"
  When philosophers defend computationalism today, they are often not defending the idea that the mind is a classical, serial Turing Machine running a static program.
  *   **Connectionism:** Many models propose that the brain works like a neural network. While neural nets can be simulated by TMs, their operation is parallel, sub-symbolic, and statistical. Applying Gödelian arguments to sub-symbolic processing is much harder than applying them to symbolic logic.
  *   **Embodied/Embedded Cognition:** Some argue that cognition cannot be separated from the body and environment. If the "system" includes the environment, it is not a closed formal system, and Gödel's theorems (which require a closed formal language) may not apply.
  *   **Hypercomputation:** Some theorists (though this is controversial in physics) explore whether the brain might utilize physical processes that are not Turing-computable (e.g., analog processes). However, most computationalists stick to the Church-Turing thesis, arguing that even if the brain is analog, it can be simulated to arbitrary precision by a digital computer.

  ### 5. The "Community" Objection
  Some philosophers argue that mathematical knowledge is not a property of an individual mind but of a **community** of minds interacting over time.
  *   If the "system" is the entire mathematical community evolving over centuries, it is not a static formal system. It is an evolving sequence of systems $F_1, F_2, F_3...$
  *   Gödel's theorem applies to a fixed system. If the mind (or the community) can always add new axioms when confronted with a Gödel sentence, it behaves like a system that is not finitely axiomatizable. This does not prove the mind is non-computational; it only proves it is not equivalent to a *single, static* formal system. A Turing machine can also evolve its code if provided with new input.

  ### Summary
  Logicians and philosophers treat computationalism as a serious possibility because the Lucas–Penrose argument has not successfully closed the door. To defeat computationalism using Gödel, one must prove:
  1.  Human reasoning is **consistent** (which is empirically doubtful).
  2.  We can **know** that we are consistent (which Gödel's 2nd Theorem suggests is impossible for the system itself).
  3.  We have **access** to our own formal description to construct $G_{Mind}$.

  Since none of these conditions are clearly met, the argument is viewed as a powerful challenge to *naive* mechanism, but not a refutation of computationalism in its more sophisticated, modern forms. The consensus is that while Gödel limits what a *fixed, consistent formal system* can do, it does not definitively prove that a biological, evolving, probabilistic information processor (the brain) cannot replicate human mathematical intuition.
