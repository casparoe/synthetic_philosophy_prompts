      *   *Better Analogy:* The "Hostage Situation" but with code.
      *   *Best Analogy:* **The Pre-Commitment Paradox.** Imagine you are about to enter a maze. You know there might be a bully at the end.
          *   Option A: Bring a weapon (Commit to fight). Bully backs down. But if you meet a stronger bully, you die.
          *   Option B: Don't bring a weapon (Stay flexible). You can negotiate. But the first bully knows this and takes your lunch money.
          *   The Race: You want to bring the weapon *before* you know which bully is there. But you don't know if the weapon is appropriate.
      *   *Actually, let's stick closer to the "Steering Wheel" but emphasize the **timing of information**.*
      *   *Key Insight:* **Information is a liability.** In standard decision theory, information has non-negative value. In commitment races, information can have *negative* value because knowing more makes you more negotiable, which makes you exploitable by someone who knows less (but is more committed).

  5.  **Addressing the "Why can't they just coordinate?" point:**
      *   This is the Prisoner's Dilemma aspect.
