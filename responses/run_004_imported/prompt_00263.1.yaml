      *   *The "Reasoning Way Out" Problem:* If I know racing is bad, I'll decide *now* not to race. But if I decide *now* not to race, I'm effectively committing to "being flexible." If the other guy commits to "never swerving," I lose. So my "decision not to race" is itself a weak commitment.
      *   *Time/Information:* The crux is the relationship between *making a decision* and *acquiring information*. Usually, more info = better decisions. In commitment races, more info = less leverage.

