      *   **Analyze the Classmate's View (CDT):** Explain *why* she thinks that (Causal Decision Theory). At $T_2$ (payment), the ride ($T_1$) is fixed. Paying = -$$. CDT says don't do it.
      *   **Explain the Flaw (The "Why" it's wrong):**
          *   **Diachronic Rationality:** Rationality isn't just about the immediate moment; it's about being an agent over time.
          *   **Predictability:** The driver's action was conditional on the user's *disposition*.
          *   **The "Ticket" Analogy:** The promise was the ticket. Tearing it up mid-journey doesn't change the past, but having it was necessary for the journey.
      *   **Alternative Decision Theories:**
