answer: |-
  Stop the presses: **Your researchers are conflating two different things.** If you write "Church-Turing Thesis Overturned," you will get pushback from theorists.

  Here is the nuance you need to save your deadline:

  ### 1. The Distinction: Computability vs. Complexity
  *   **The Church-Turing Thesis (CTT):** Claims that any function that is *effectively calculable* can be computed by a Turing Machine. It is about **what is possible** in principle.
      *   *Status:* **Still True.** A classical computer *can* simulate a quantum computer. It can run Shor's algorithm. It can reproduce Google's supremacy result. It just takes exponential time (e.g., 10,000 years instead of 200 seconds). Since the problem is still *solvable* by a classical machine, CTT is not falsified.
  *   **The *Extended* Church-Turing Thesis (ECTT):** Claims that any physically realizable computing device can be **efficiently** simulated by a probabilistic Turing Machine. It is about **what is practical/efficient**.
      *   *Status:* **Challenged.** This is what your researchers are actually talking about. Quantum computers appear to offer exponential speedups for specific problems, violating the "efficiently" clause of the ECTT.

  ### 2. Why "Impossible" is the Wrong Word
  Your researchers say quantum machines solve problems "literally impossible for classical computers." That is technically incorrect.
  *   **Correct:** "Intractable for classical computers within the lifetime of the universe."
  *   **Incorrect:** "Impossible."
  In computability theory, if it takes a million years, it's still computable. CTT only cares if the answer can be reached eventually, not how long it takes.

  ### 3. Why Isn't This Bigger News?
  *   **It's Expected:** Theoretical computer scientists have suspected since the 1980s (thanks to David Deutsch and others) that quantum mechanics might violate the *Extended* thesis. Google's 2019 result was experimental confirmation of a long-held hypothesis, not a sudden shock to the foundations of logic.
  *   **The "Supremacy" Caveat:** Google's experiment was a specific, contrived sampling task, not a useful algorithm like Shor's. Furthermore, classical algorithms have improved since then, narrowing the gap. Shor's algorithm hasn't yet been run at a scale that breaks classical encryption, so the "efficiency" victory isn't fully cemented in practice yet.
  *   **CTT is Robust:** The original CTT is a definition of "effective calculability." Since quantum computers are still algorithmic and deterministic (in terms of evolution of the state vector), they fit within the broader understanding of computation.

  ### 4. How to Write This Up
  Do not headline this as "Church-Turing Thesis Overturned." Instead, try:

  *   **"Quantum Computing Challenges the *Extended* Church-Turing Thesis."**
  *   **"Quantum Supremacy Redefines What is 'Efficiently' Computable."**
  *   **"Classical Computers Can Still Solve It, Just Not in Time."**

  **The Money Quote for your piece:**
  > "Quantum computing doesn't break the laws of computation; it breaks the laws of *complexity*. The original Church-Turing thesis remains intact—classical computers can still do everything quantum computers can do. The difference is, for some problems, the classical computer will still be crunching numbers when the sun burns out."

  **TL;DR:** Your researchers are talking about the **Extended** Church-Turing Thesis (efficiency), not the original (computability). Don't let them conflate "too slow to be useful" with "impossible."
