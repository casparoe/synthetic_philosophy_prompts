answer: |-
  Here is a dialogue set in Rome, circa 1615. This is based on their actual correspondence and the historical record of Bellarmine's letter to Paolo Foscarini.

  **Setting:** *Cardinal Bellarmine's private study. The air is still, smelling of wax and old paper. Galileo stands by the window, restless. Bellarmine sits behind a desk, hands folded.*

  **Galileo:** You have read my letter, Eminence. You know what the telescope has shown. The phases of Venus. The moons of Jupiter. The mathematics of Copernicus are no longer just a hypothesis to save appearances. They are the architecture of God's creation.

  **Bellarmine:** I have read it, Sig. Galileo. And I grant you this: if there were a true demonstration that the sun is in the center of the world and the earth in the third heaven, and that the sun does not circle the earth but the earth circles the sun, then we should have to proceed with great circumspection in explaining passages of Scripture which appear to teach the contrary. We would have to admit we did not understand them, rather than assert something to be false which has been demonstrated.

  **Galileo:** Then we are agreed. The demonstration exists. The tides alone prove the motion of the earth.

  **Bellarmine:** *[Raises a hand gently]* There it is, Signor. You say "demonstration." I say "hypothesis." To say that the supposition of Copernicus saves the phenomena—that it allows us to calculate planetary positions more elegantly than Ptolemy—is one thing. To assert that the earth *actually* moves is another. Mathematics deals with numbers, not substance. A man can calculate a debt without having any coin.

  **Galileo:** With respect, Cardinal, nature is written in the language of mathematics. If the calculation matches the observation perfectly, over and over, in what sense is it not true? If I give you a map that predicts every turn of the road, is the road not where the map says it is?

  **Bellarmine:** Not if there is another map that predicts the same turns. As long as the phenomena can be saved by other means, you have not proved physical reality. You have only proved utility. And here is the danger: if you assert this as physical truth without absolute proof, you risk making the Faith look foolish.

  **Galileo:** I risk making the Faith look foolish? Or do I risk binding the Holy Church to a cosmological error? The Holy Spirit intends to teach us how to go to heaven, not how the heavens go. When Scripture speaks of the sun standing still for Joshua, it speaks in the language of the common man, accommodating our limited senses. We do not say God has hands or feet because the Bible mentions them. Why must we say the earth is fixed because a Psalmist says so?

  **Bellarmine:** Because, Signor Galileo, the Fathers of the Church were unanimous. Augustine, Aquinas, Chrysostom—they all interpreted those passages literally regarding the stability of the earth. The Council of Trent forbids us to interpret Scripture contrary to the unanimous consent of the Fathers. If you say they were wrong about the earth, the common man will ask: were they also wrong about the Trinity? About salvation? You tear at the fabric of authority to mend a star chart.

  **Galileo:** Authority is not a shield against truth. If the earth moves, it moves. Whether the Fathers believed otherwise is a matter of their historical context, not their sanctity. God gave us senses and reason. To deny what we see and calculate is to insult the Creator who gave us those tools.

  **Bellarmine:** And God gave us the Church to guard us from the arrogance of our own reason. Look me in the eye, Galileo. Can you prove, without a shadow of doubt, that if the earth moves, there would be no other way for God to arrange the heavens? Can you prove that stellar parallax is not simply too small for your instrument to see, rather than non-existent?

  **Galileo:** *[Pauses, frustrated]* The instrument improves. The proof will be absolute. But you ask me to wait for a certainty that may take a century, while asking me to deny what is already plain to my eyes today.

  **Bellarmine:** I am asking you to speak as a mathematician, not a theologian. Write of the Copernican system as a hypothesis. A brilliant, useful, perhaps even probable hypothesis. But do not assert it as the only physical truth. Not yet. If, one day, you have a demonstration that the sun is truly the center, then we will revisit the Scripture. We will find a way to interpret Joshua and the Psalms differently. We are not afraid of truth. But we are afraid of error.

  **Galileo:** And in the meantime? I am to pretend I do not know what I know? To speak falsely to protect the appearance of infallibility?

  **Bellarmine:** To speak precisely, Galileo. To distinguish between what is *observed* and what is *concluded*. That is not lying. That is prudence. Save the phenomena, by all means. But leave the physical reality of the earth to God, and the interpretation of His Word to His Church. Until the proof is as undeniable as light itself.

  **Galileo:** *[Quietly]* Light is undeniable, Eminence. But men will still close their eyes against it.

  **Bellarmine:** Then pray they do not burn you for shining it too brightly.

  *[Bellarmine picks up a quill. Galileo turns back to the window. The silence between them is heavy, not with hatred, but with the weight of two different kinds of certainty.]*
