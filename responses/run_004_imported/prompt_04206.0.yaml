      *   *Don't alienate the partner:* The partner isn't "wrong" about logic, just applying the wrong framework (binary logic vs. probabilistic epistemology).
      *   *Make it concrete:* Use the math ($0.99^{200}$) to show *why* the user is right intuitively.
      *   *Mention "Logical Omniscience":* Classical logic assumes we know all consequences of our beliefs. Humans aren't logically omniscient.

  6.  **Final Polish:**
