answer: |-
  A Nash bargainer and a Kalai-Smorodinsky bargainer are going through a divorce. They meet with a mediator to split their assets.

  The Nash bargainer pulls out a calculator. "Simple," he says. "We find the point on the Pareto frontier that maximizes the product of our utility gains relative to the disagreement point. $(u_1 - d_1)(u_2 - d_2)$. Efficient, symmetric, done."

  The Kalai-Smorodinsky bargainer pulls out a protractor. "No," she says. "We draw a line from the disagreement point to the *Ideal Point*—the maximum utility each of us could possibly achieve if the other got nothing. We split assets where that ray intersects the frontier. Equal relative concession."

  The mediator looks confused. "But the Ideal Point is infeasible. You can't both get your maximum."

  "Exactly," says Kalai-Smorodinsky. "It's about the principle of proportionality to potential."

  Nash sighs, crosses out a clause in the prenup regarding a yacht neither of them can afford, and says, "Okay, I've removed that option from the feasible set. Since we weren't going to choose it anyway, my solution doesn't change. Independence of Irrelevant Alternatives."

  Kalai-Smorodinsky gasps, tearing up the agreement. "You can't do that!"

  "Why not?" asks Nash. "It was irrelevant. It wasn't on the efficient frontier near the solution."

  "Because that yacht defined my *Ideal Point*!" she cries. "By removing it, you lowered my maximum potential, which shifts the ray, which changes my entire share! You're punishing me for deleting a dream I never would have caught!"

  Nash shrugs. "I only bargain over what's feasible."

  Kalai-Smorodinsky grabs her coat. "And I bargain over how much reality disappoints me compared to perfection. We're incompatible."

  **The Moral:** Nash maximizes the product of what you *have*. Kalai-Smorodinsky equalizes the pain of not getting what you *could have had*.
