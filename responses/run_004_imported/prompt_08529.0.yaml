      *   *MIRI Specifics:* Bring in the "Dualistic Agent" vs. "Embedded Agent" distinction from the Sequence. The Cartesian agent is the "dualistic" one (AIXI-style). AIXI fails at Newcomb? Wait, AIXI actually fails at Newcomb because it treats its output as a causal intervention but doesn't recognize the correlation. *Correction:* AIXI is Cartesian in structure (input/output channels). CDT is the decision theory of AIXI. AIXI two-boxes. The student's claim is that AIXI *should* two-box because in its ontology, the box content *cannot* depend on its choice. The fact that we think it *should* one-box is because we know we are embedded.
