      *   *The Nature of the Predictor (Omega):* How does Omega predict? If the agent is Cartesian, the decision is free/uncaused by prior physical states. Omega would need backward causation or magic. If the agent is physicalist/embedded, the decision is the result of an algorithm. Omega simulates the algorithm. Therefore, Newcomb requires physicalism/embeddedness.
      *   *Logical Correlation vs. Causal Connection:* FDT (Functional Decision Theory) works by recognizing logical subjunctives. "If I output X, then any identical algorithm outputs X." This only makes sense if the agent is an *instance* of an algorithm located in the world. A Cartesian agent isn't an instance; it's a singular substance.
      *   *The "Tickle" Defense:* In CDT, if you know your own state, the correlation screens off. But in Newcomb, you don't know your own decision *before* you make it. An embedded agent has to reason about its own output as a fact about the world. A Cartesian agent just *wills*.
      *   *Self-Reference and Löb:* The 5-and-10 problem arises because the agent tries to reason about itself. A Cartesian agent doesn't need to model itself as an object; it just *is* the subject. The paradoxes of self-prediction vanish if self-prediction is impossible (Cartesian privacy).
