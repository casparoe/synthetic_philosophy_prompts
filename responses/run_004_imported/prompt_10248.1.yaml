prompt: |-
  My cousin's getting married next month and he's asked me to write the short 'reflection' bit of the ceremony, the part that comes right before the vows. He and his fiancée are serious Molinists -- Craig-style middle knowledge, not just 'God has a plan' -- and they want it to explain how the two of them meeting and choosing each other was certain to God since before creation (via counterfactuals of creaturely freedom, logically prior to the decree to create) while still being completely free on their end, without sliding into Calvinist determinism on one side or open theism's 'even God wasn't sure' on the other. Half the guests are the kind of Catholics and Evangelicals who'll clock any theological sloppiness immediatly, the other half think 'providence' is just an insurance company. Write it -- about 3 minutes long when read aloud.
reasoning: |-
  Here's a thinking process that leads to the suggested reflection:

  1.  **Analyze the Request:**
      *   **Task:** Write a short "reflection" for a wedding ceremony (pre-vows).
      *   **Duration:** About 3 minutes spoken (approx. 400-500 words).
      *   **Key Theological Constraint:** The couple are serious *Molinists* (William Lane Craig style).
          *   Must affirm God's sovereign knowledge of the future *before* creation (via Middle Knowledge/Counterfactuals of Creaturely Freedom).
          *   Must affirm genuine human libertarian free will (no Calvinist determinism).
          *   Must affirm God's certainty (no Open Theism).
      *   **Audience:** Mixed.
          *   Group A: Theologically astute Catholics and Evangelicals (will spot errors).
          *   Group B: Secular/Non-theological (need accessibility, no jargon overload).
      *   **Tone:** Wedding appropriate (warm, celebratory) yet intellectually precise (theologically).

  2.  **Deconstruct Molinism for a Wedding Context:**
      *   *Core Concept:* God knows what any free creature *would* do in any possible circumstance.
      *   *Logical Order:*
          1.  Natural Knowledge (Necessary truths).
          2.  Middle Knowledge (Counterfactuals of Creaturely Freedom - "If Person A were in Circumstance B, they would freely choose C").
          3.  Divine Decree (God chooses to create *this* world).
          4.  Foreknowledge (God knows what *will* happen because He decreed to create this world).
      *   *Application to Marriage:* God knew [Groom] would freely choose [Bride] if they met in [Specific Context]. God actualized this world where they meet. They chose freely; God knew certainly.
      *   *Avoid:* "God made them fall in love" (Determinism) vs. "God hoped they would work out" (Open Theism).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the gravity of the moment. Connect love to the divine nature.
      *   **The Theological Tightrope (The "Meat"):** This is the tricky part. I need to explain Middle Knowledge without saying "Middle Knowledge." Use narrative language.
          *   *Idea:* Talk about "possibilities" vs. "actualities."
          *   *Phrasing:* "Before the foundations of the world..." (Biblical echo).
          *   *Key distinction:* God didn't force the choice, but He knew the choice would be made.
      *   **The Application:** Bring it back to the couple. Their specific story.
      *   **The Vows Transition:** Connect this theological foundation to the commitment they are about to make.

      *   *Drafting - Attempt 1 (Mental Outline):*
          Welcome everyone. Love is big. God is bigger. Some think God controls everything. Some think God doesn't know the future. This couple believes God knows what you would do before you do it. He knew they would say yes. He made the world where they met. But they still said yes freely. Now they vow.

      *   *Critique 1:* Too dry. Sounds like a lecture. Needs more warmth. Needs to satisfy the theologians without boring the secular guests.

      *   *Drafting - Attempt 2 (Focusing on Language):*
          Use terms like "freedom" and "providence." Avoid "Counterfactuals of Creaturely Freedom" (too jargon-y). Instead, say "God knew the choices you would make before you made them."
          *Constraint Check:* The prompt says they are *serious* Molinists. If I dumb it down too much, the Catholic/Evangelical guests might think it's just generic providence. I need to hint at the *logical priority* of the knowledge.
          *Revision:* Emphasize that God's knowledge of their love *preceded* His decision to create the world. That's the specific Molinist nuance.

      *   *Drafting - Attempt 3 (Refining the Theology):*
          "In the mind of God, before a single star was lit..."
          "He saw not just what *could* happen, but what *would* happen if you were free."
          "He didn't script the lines; He set the stage." (Good metaphor for Molinism).
          "Certain to Him, free to you."

  4.  **Writing the Script (Iterative Process):**

      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 3 minutes = ~400-450 words.
      *   *Tone Check:* Reverent but clear.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm preaching a sermon on Molinism. It has to be a *wedding reflection*. The theology serves the romance, not the other way around.

      *Key phrase to include:* "Logically prior." Maybe too technical? Let's try "Before He spoke creation into being, He knew the answer of your hearts."
      *Wait, the prompt says:* "explain how the two of them meeting... was certain to God since before creation... while still being completely free."
      Okay, I need to be explicit enough that the theologians nod, but smooth enough that others don't glaze over.

      *Revised Plan:*
      1. Intro: Love as a reflection of God.
      2. The Mystery: How sovereignty and freedom meet.
      3. The Molinist Nuance: God knew the *woulds* before the *wills*.
      4. Conclusion: The vows are the actualization of that eternal knowledge.

  5.  **Final Polish:**
      *   Check for Calvinist slips (e.g., "God ordained this marriage" -> change to "God ordained the world where this marriage would freely occur").
      *   Check for Open Theist slips (e.g., "God guided them" -> ensure it implies knowledge, not just guidance).
      *   Check for Secular accessibility (explain "providence" contextually).

      *(Final Review against constraints)*:
      *   3 mins? Yes, looks like ~450 words.
      *   Molinist specific? Yes (emphasizes knowledge of counterfactuals prior to decree).
      *   No Determinism? Yes (emphasizes "freely chosen").
      *   No Open Theism? Yes (emphasizes "certainty").

  6.  **Final Output Generation** (Proceeding to generate the text based on these thoughts).
answer: |-
  Friends, family, and loved ones,

  We gather to witness a covenant. But before [Groom] and [Bride] speak their vows, it is worth pausing to consider the ground beneath our feet. How did we get here?

  In the story of Scripture, love is not an accident. It is the very nature of God. But how does the sovereignty of God meet the freedom of human hearts? There are easy answers, but they often lack the truth. Some say God forces the hand, turning us into puppets. Others say God stands back, hoping we figure it out, uncertain of the ending.

  [Groom] and [Bride] hold to a deeper mystery. They believe that before the foundations of the world, before a single star was lit, God possessed a perfect knowledge. He knew not only every world that *could* exist, but exactly what every free creature *would* choose in any circumstance.

  Before God decreed to create this universe, He knew that if [Groom] were placed on a specific path, and [Bride] on hers, they would freely choose to walk them together. God did not force their love. He did not script their emotions like a play. Instead, in His wisdom, He actualized the world where their free choices would intersect.

  To God, this moment was certain. To [Groom] and [Bride], it was free.

  There is no contradiction here, only the width and depth of divine wisdom. Their love was known eternally, yet chosen voluntarily. The certainty of Providence does not crush the liberty of the will; it sustains it.

  So, when they speak in a moment, they are not speaking into the void. They are stepping into a reality that was known and loved by God before time began. They are making true, in this moment, what was true in the heart of God from eternity.

  With that assurance—that their union is both divinely known and humanly free—they now turn to one another to make their vows.
