  7.  **Final Polish:** (Mental check of the flow) Start with the strength of interventionism, introduce the cosmological rupture, dismantle the fixes, offer Lewis as the necessary complement, conclude with pluralism. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should be careful not to conflate Pearl's DAGs with Woodward's manipulability too much, though they are allied. Woodward is more explicit about the *metaphysics* of manipulation. I will focus primarily on Woodward as requested ("Making Things Happen"), but acknowledge Pearl's structural equations. I need to make sure I don't just say "it's hard to intervene" but "the definition of intervention presupposes a system/environment distinction that vanishes in cosmology."

  *(Refining the Lewisian point)*: Lewis's theory is often criticized for vagueness in the similarity metric. I need to argue that in cosmology, the metric is actually *sharper* (physical laws + initial data) than in everyday life (where "ordinary" contexts matter more).

  *(Final Plan)*:
