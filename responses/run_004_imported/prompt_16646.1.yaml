answer: |-
  **TO:** Neurodevelopmental Diagnostic Practice Group
  **FROM:** [Your Name], Consultant Clinical Psychologist (Lead, Autism Pathway)
  **DATE:** 24 October 2023
  **SUBJECT:** Proposal regarding the nomenclature of demand-avoidant profiles in assessment reports

  Colleagues,

  Next month we must decide whether our Trust will formally recognise "Pathological Demand Avoidance" (PDA) — or the increasingly preferred "Extreme Demand Avoidance" (EDA) — as a named profile within our autism assessment reports. Until recently, I viewed this as a theoretical debate regarding nosological validity. However, observing how rapidly this terminology has migrated from parent forums to family identity, and subsequently altered the lived experience of the child, I am convinced this decision is not merely academic. It is an intervention in itself.

  We are weighing two significant ethical risks.

  The first is the risk of **institutional bad faith**. Families and a growing number of autistic adults are already using this language to make sense of distress and advocate for support. When we refuse to use a term that unlocks specific low-demand pedagogical strategies or strengthens an Education, Health and Care Plan (EHCP) application, we risk creating a disconnect between the clinic and the home. We risk telling families that their lived reality is not legible to us. If the label provides a functional key to support that generic "autism" descriptions do not, withholding it could be construed as a failure of our duty to facilitate care.

  The second risk is what Ian Hacking describes as **looping effects**. Classifications are not passive mirrors; they are engines. By lending the authority of the NHS to a contested category, we risk reifying a behavioural style into a fixed identity. There is a genuine concern that naming the profile may solidify the very avoidance we seek to manage, particularly as children mature and read their own notes. If we diagnose a "demand avoidance" profile, do we inadvertently script the child's future interactions with authority? We must be cautious not to create the phenomenon we claim only to describe.

  **Recommendation**

  I propose that the Trust adopts a position of **Conditional Recognition with a Named Review Date**.

  Specifically, I recommend we agree to the following for a period of **24 months**, subject to audit:

  1.  **Terminology:** We utilise the descriptor "Autism with a profile of Extreme Demand Avoidance" (avoiding "Pathological") in reports where the clinical picture strongly suggests this presentation.
  2.  **Framing:** This is explicitly framed as a *descriptive profile* of needs and strengths, not a distinct diagnostic sub-type or separate condition.
  3.  **Review:** We set a hard review date for this policy in October 2025.

  **Rationale**

  This approach navigates the tension between validation and caution.

  To the proponents of recognition: This validates the language families are using *now*. It allows our reports to accurately reflect the specific adjustments a child requires (e.g., low-demand approaches), ensuring EHCPs are fit for purpose. It signals that we are listening to the community we serve.

  To the proponents of caution: This does not cement PDA/EDA as a scientific fact. By setting a review date, we acknowledge the current lack of consensus in the wider diagnostic manuals (DSM/ICD). It allows us to monitor the "looping effect." During this 24-month window, we should collect data on outcomes: Does this label lead to better educational placement stability? Does it increase stigma?

  We can be responsive to human need without surrendering scientific rigour. Let us provide the language that helps families function today, while committing to examine whether that language helps or hinders the children we serve tomorrow.

  I look forward to discussing this framework at our next meeting.

  [Your Name]
  Consultant Clinical Psychologist
