      *   *Addressing Hacking:* Ensure I use the term "looping effects" correctly. The idea is that classifying people changes how they act, which changes the classification.
      *   *Addressing Bad Faith:* Use the term "epistemic injustice" or similar concepts implicitly. Families feel unheard.
      *   *Terminology:* Use "Extreme Demand Avoidance" (EDA) as the preferred term over "Pathological" to show sensitivity.
      *   *NHS Context:* Mention EHCPs, NICE guidelines (implicitly), and diagnostic standards (DSM/ICD).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi team. We need to decide on PDA.
      *   I know families love it. It helps them get support. Not using it feels mean.
      *   But Hacking says labels make things real that aren't. We might be creating a disorder.
      *   I say we use it but call it EDA and review in 2 years.
