      *   *Section 4: The "Multiple Selves" vs. Unified Soul.* Ainslie's bargaining selves vs. Aristotle's parts of the soul. Aristotle would reject the metaphysics but accept the phenomenology of civil war.
      *   *Conclusion:* Aristotle would likely say hyperbolic discounting describes the *mechanism* of the temporal pull, but misses the *moral ontology*. He'd classify most money discounting as "qualified *akrasia*" or "folly," reserving true *akrasia* for when the body screams.

  6.  **Refining the Tone:**
