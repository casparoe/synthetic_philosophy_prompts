answer: |-
  You are absolutely correct to identify the Pasadena game as mathematically more pathological than the St. Petersburg paradox, and your observation about its relative neglect in rationalist circles is astute.

  To answer your core questions directly: **Yes, the Pasadena game poses a genuinely distinct and deeper problem for Expected Utility Theory (EUT) than the St. Petersburg paradox.** It is not merely a dressed-up instance of unboundedness; it is an instance of *non-integrability*. Furthermore, while stochastic dominance (SD) offers a way to avoid making a catastrophic error in the Pasadena case, it does so by retreating from the project of valuation entirely, which some argue is an admission of defeat rather than a solution.

  Here is a detailed breakdown of why the Pasadena game is deeper, why it gets ignored, and how stochastic dominance fares against it.

  ### 1. The Mathematical Distinction: Divergence vs. Undefinedness

  The distinction lies in measure theory and the definition of the Lebesgue integral.

  **The St. Petersburg Paradox (SPP)**
  In the SPP, the utility function is unbounded above, but all outcomes are positive. The expectation is:
  $$ E[X] = \sum_{n=1}^{\infty} \frac{1}{2^n} 2^n = \sum_{n=1}^{\infty} 1 = \infty $$
  In the context of the extended real numbers, this expectation is **well-defined**. It is $+\infty$. The problem is normative: *Why does a gamble with infinite expected value not command an infinite price?* The mathematics of the expectation itself is consistent; it is our intuition about money and risk that clashes with the result. Any reordering of the terms yields $+\infty$ because the series consists of non-negative terms.

  **The Pasadena Game (PG)**
  In the Pasadena game, the payoffs alternate in sign. The expectation sum is the alternating harmonic series:
  $$ E[X] = \sum_{n=1}^{\infty} \frac{1}{2^n} \left( (-1)^{n+1} \frac{2^n}{n} \right) = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = \ln 2 $$
  However, for an expectation to be well-defined in standard probability theory (specifically, for the random variable to be Lebesgue integrable), the integral of the absolute value must be finite ($E[|X|] < \infty$). In the PG:
  $$ E[|X|] = \sum_{n=1}^{\infty} \frac{1}{n} = \infty $$
  Because $E[|X|] = \infty$, the expectation $E[X]$ is **undefined**. It is not infinity; it does not exist. The fact that the natural ordering yields $\ln 2$ is a mathematical artifact of that specific enumeration. As you noted, the Riemann Rearrangement Theorem applies. Since the sample space is countable, any bijection to $\mathbb{N}$ is a valid way to enumerate the outcomes. If the value of the gamble depends on how you label the outcomes, the gamble has no intrinsic expected value.

  **Why this is deeper:**
  The SPP challenges the *normative implications* of infinite value. The PG challenges the *ontological status* of the expected value itself. The SPP says, "The value is too big to handle." The PG says, "There is no value to handle." The PG demonstrates that unbounded utility functions in both directions (positive and negative) break the isomorphism between the probability space and the real numbers required for EUT to function.

  ### 2. Why LessWrong Ignores Pasadena

  If the PG is mathematically superior as a counterexample, why does the rationalist community fixate on St. Petersburg and Pascal's Mugging?

  **A. The Pascal's Mugging Connection**
  The primary driver of EUT discussions in AI safety and rationalism is Pascal's Mugging (PM). PM is structurally isomorphic to St. Petersburg, not Pasadena.
  *   **PM/SPP:** Tiny probability $\times$ Massive **Positive** Utility. The sum diverges to $+\infty$. The risk is that an agent will be exploited by paying out resources to avoid low-probability high-stakes threats (or pursue high-stakes gains).
  *   **PG:** Requires massive **Negative** utilities as well as positive ones to create the oscillation.
  In AI safety, the fear is usually that an AI will optimize for a positive reward function so aggressively it destroys the world (instrumental convergence), or that a bad actor uses a "mugging" argument to extract resources. The PG scenario requires a probability distribution over outcomes that is symmetric enough to cause conditional convergence. This is less relevant to the "optimize $X$ at all costs" failure modes that dominate AI alignment concerns.

  **B. Action Guidance vs. Paralysis**
  *   **SPP** gives a dangerous verdict: "Pay any finite amount." This leads to *action* (exploitation).
  *   **PG** gives no verdict (or an arbitrary one). This leads to *inaction* (paralysis).
  For a community focused on effective altruism and AI strategy, a paradox that causes an agent to give away all its money (SPP/PM) is a pressing bug. A paradox that causes an agent to throw an error code or refuse to choose (PG) is a nuisance, but less existentially threatening.

  **C. Complexity Barrier**
  SPP requires understanding divergence. PG requires understanding conditional convergence, absolute integrability, and the dependence of sums on enumeration in measure theory. The "conceptual load" of PG is higher, making it less sticky for broad discussion.

  ### 3. Does Stochastic Dominance Solve It?

  Christian Tarsney and others (e.g., Meacham, Beckstead) have proposed falling back on **Stochastic Dominance (SD)** when Expected Value (EV) is undefined or infinite.

  **How SD applies:**
  *   **SPP:** A St. Petersburg gamble stochastically dominates any gamble with a finite maximum payoff. SD successfully ranks SPP above finite costs.
  *   **PG:** Does the Pasadena game stochastically dominate doing nothing (payoff 0)?
      *   For SD to hold, $P(PG > x) \ge P(0 > x)$ for all $x$.
      *   Because the PG payoffs oscillate wildly between large positive and large negative values, the cumulative distribution function of PG crosses the CDF of 0 infinitely many times.
      *   Therefore, PG does **not** dominate 0, nor does 0 dominate PG. They are **incomparable**.

  **Is this a solution?**
  It depends on what you want a decision theory to do.
  *   **If the goal is to avoid error:** Yes. Assigning the PG a value of $\ln 2$ (and thus being willing to pay $\$0.60$ to play) is unjustified because a rearrangement could make the value $-\$1,000,000$. SD correctly identifies that there is no rational basis for preferring PG to 0. It prevents the agent from making a dominated choice based on a spurious calculation.
  *   **If the goal is to act:** No. SD leaves the agent paralyzed. It "solves" the paradox by declaring the situation undecidable.

  **Does it paper over the problem?**
  It papers over the *symptom* (the inability to choose) by retreating to a weaker axiom system. It acknowledges that EV is broken for unbounded utilities.
  *   **Regarding SPP:** SD handles SPP by ranking it highly. This might still be undesirable if you think paying infinite amounts is irrational. So SD doesn't fully "solve" the normative weirdness of SPP, it just makes it consistent.
  *   **Regarding PG:** SD handles PG by admitting incomparability. This is arguably the *correct* mathematical response to a non-integrable random variable.

  Tarsney's argument is essentially that **EV is a derived heuristic that works only when utilities are bounded or distributions decay fast enough.** When they don't, SD is the more fundamental normative principle. In the PG case, SD reveals that the "deep problem" you identified (the lack of a well-defined integral) implies there *should* be no preference. Thus, SD doesn't leave the deeper issue untouched; it validates the deeper issue by refusing to force a valuation where none exists.

  ### Conclusion

  The Pasadena game is indeed the "stronger" paradox. It proves that unbounded utility functions don't just lead to infinite values; they can lead to *incoherent* values.

  The neglect of Pasadena in LessWrong-style discourse is pragmatic rather than theoretical. The community is optimized to avoid **Pascal's Mugging** (being exploited by infinite positive expectations), not **Pasadena's Paralysis** (being unable to evaluate oscillating expectations).

  Stochastic dominance addresses the Pasadena case correctly by declaring incomparability, which aligns with the mathematical reality that the expectation is undefined. However, this is a retreat from the maximization paradigm. It solves the decision problem by dissolving the value problem, confirming your suspicion that standard Expected Utility Theory cannot be "fixed" for unbounded utilities—it must be replaced or restricted.

  **Verdict:** The Pasadena game exposes the structural rot in the foundation of EUT (the requirement of absolute convergence), whereas St. Petersburg merely shows the roof leaking (infinite values). Stochastic dominance patches the roof by removing the attic entirely (abandoning EV maximization), which works, but at the cost of decision-theoretic completeness.
