answer: |-
  **Setting:** *The Hall of Saurischian Dinosaurs, late afternoon. The light is fading, casting long shadows across a glass case labeled "The Exaptation of Feathers." Inside, three specimens are arranged chronologically: a cast of *Sinosauropteryx* showing simple filaments, a slab of *Archaeopteryx* showing asymmetrical vanes, and a fanned tail of a modern *Pavo cristatus* (peacock).*

  **Characters:**
  *   **Ruth:** An etiological theorist (Selected-Effects).
  *   **Chris:** A causal-role theorist (Cummins-style).

  **Chris:** (Leaning toward the glass) Look at the progression. It's the perfect gradient for my intro lecture next week. You have the filaments on the theropod—simple tubes. Then the *Archaeopteryx*, where the rachis stiffens and the barbs hook. Finally, the peacock. It's a continuous story of capacities.

  **Ruth:** A continuous story of *histories*, Chris. You're looking at three distinct teleological events.

  **Chris:** Here we go. Teleology. You can't resist injecting a 'for' where there's only a 'how.' Look at the *Sinosauropteryx*. Those filaments trap a layer of warm air against the skin. That is their causal role. They contribute to the organism's capacity for thermoregulation. Why complicate it?

  **Ruth:** Because "contributing to a capacity" isn't the same as "having a function." If I use a rare coin to prop open a window, it contributes to the window's capacity to stay open. But the coin's function isn't to be a wedge. It's to be currency. Similarly, those filaments might *happen* to trap heat. But to say their biological *function* is insulation requires knowing that they were *selected* for insulation.

  **Chris:** But biologists don't wait for the fossil record to be complete before ascribing function. If I find a new enzyme in a deep-sea vent that breaks down sulfur, I say its function is sulfur-metabolism. I don't need to know its selection history. I just need to know what it *does* in the system.

  **Ruth:** You're describing a capacity, Ruth—sorry, *Chris*. You're describing what it *can* do. But suppose that enzyme is a mutation that hasn't been selected yet. Or suppose it's a deleterious side effect. Without selection, you can't distinguish the function from the noise.

  **Chris:** Let's test that. Imagine a bird. A molecule-for-molecule duplicate of this *Archaeopteryx*. But it wasn't born. It was assembled by pure chance—a quantum fluctuation in the dust right here in the museum case. A Swampbird.

  **Ruth:** (Smiling) The classic Swampman objection. Go on.

  **Chris:** This Swampbird has wings. It has vaned feathers. It can glide. According to your etiological theory, this bird has no functions. Its feathers have no function. Why? Because they have no selection history. They popped into existence five minutes ago.

  **Ruth:** Technically, correct.

  **Chris:** That's absurd, Ruth. If the Swampbird glides, its feathers are functioning exactly like the real *Archaeopteryx*. If you say they have no function, you're saying function is magic dust sprinkled by evolution. But the physics is identical. The causal contribution to the system's capacity for flight is identical. If your theory says the Swampbird's wings are functionless, your theory is out of touch with biological practice. We care about what the trait *does*, not its pedigree.

  **Ruth:** It's not about pedigree for the sake of pedigree. It's about norms. If the real *Archaeopteryx* has a broken feather that can't generate lift, I say it is *malfunctioning*. It is failing to do what it is *supposed* to do. But your Swampbird... if its feather is structurally identical, it glides. But if you snap a quill on the Swampbird, can you say it's broken?

  **Chris:** It's structurally compromised. It won't generate lift.

  **Ruth:** But is it *failing*? On your view, function is just current capacity. If the feather is snapped, its capacity is zero. So it has no function. It's not a *broken* wing; it's just a wing that doesn't fly. You've eliminated the possibility of error. You've eliminated the distinction between "does not fly" and "cannot fly *though it should*."

  **Chris:** I don't need "should." I need explanatory power. When I explain how the bird stays aloft, I cite the causal role of the feathers. Whether they were selected or zapped into existence doesn't change the aerodynamics.

  **Ruth:** (Turning to the peacock train) Let's move to the modern specimen. Look at these eyespots. Massive, heavy, aerodynamically costly. What is their causal role?

  **Chris:** Well, they catch light. They create a visual display. They also create drag. They might trap parasites. All of these are causal roles. They are effects the feathers produce in the containing system.

  **Ruth:** Exactly. All of those are effects. But which one is the *function*?

  **Chris:** The one that contributes to the system's reproductive capacity. The display.

  **Ruth:** Why that one? The drag contributes to the system's capacity for... crashing. The parasite trapping contributes to the system's capacity for hygiene. You have a list of effects. You need a principle to single one out as *the* function. Cummins says you look at the capacity of the containing system you want to explain.

  **Chris:** Right. If I'm explaining sexual selection, the function is display. If I'm explaining why peacocks are vulnerable to predators, the function—or rather, the effect—is drag. It's context-dependent.

  **Ruth:** And that's the problem. Biological function isn't context-dependent in that way. The function of the peacock's train is to attract mates. It *is* that, regardless of whether I'm explaining predation or mating. If a peacock molts and I use the feather to dust my shelf, it still traps dust. But its function isn't dusting.

  **Chris:** In that case, you've changed the containing system. The feather is now part of a "dusting system."

  **Ruth:** (Taps the glass) But in the bird? How do you distinguish the *function* (mating) from a *side effect* (drag) without appealing to history? Both are current causal roles. Both are real effects. The only thing that makes the mating display the *function* and the drag a *cost* is that ancestors with better displays out-reproduced ancestors with more aerodynamic tails. Selection singled it out. Without that history, you just have a bag of effects. You can't tell me which one the organism is *for*.

  **Chris:** I can tell you which one is stable. The display is a stable contribution to reproduction.

  **Ruth:** Stability isn't enough. A parasite might stably contribute to the host's weight. That doesn't make its function to weigh the host down. You need the *reason* it's there.

  **Chris:** Okay, let's pivot. You're hung up on the "malfunction" issue. The broken feather. I admit, my account makes malfunction tricky. But look at the alternative. You say a feather can have a function even if it *never* performs it. A genetic defect means a bird is born with feathers that are too soft to fly. They never generate lift. They never contribute to the capacity.

  **Ruth:** Correct. They are malfunctioning feathers.

  **Chris:** But they have no causal role! They do nothing. If function is selected effect, fine, they have a function. But how does that help a physiologist? If I'm studying the bird's flight mechanics, telling me the soft feathers have a "function" of lift is useless. They don't *do* lift. Your theory divorces function from activity. Mine keeps them married.

  **Ruth:** It divorces function from *success*, not activity. The machinery is there to do the job.

  **Chris:** (Pauses, looking at the *Sinosauropteryx* again) Maybe we're asking different questions. When I ask "What is the function of the filament?", I am asking "How does this trait contribute to the capacities of this organism?" I'm doing mechanism analysis.

  **Ruth:** And when I ask "What is the function?", I am asking "Why is this trait here rather than some alternative?" I'm doing evolutionary explanation.

  **Chris:** So, the Swampbird. For me, the Swampbird's feathers have a function: flight. Because they contribute to flight. For you, they don't. Because they lack history.

  **Ruth:** Right.

  **Chris:** But isn't that just a verbal dispute? If I say "Function-CR" and you say "Function-ET", we both agree on the physics. We both agree on the evolution of the real bird. We only disagree on the label for the Swampbird.

  **Ruth:** It's not just the label. It's the normativity. If you treat the Swampbird's wing as functional, you can't make sense of why it *ought* to fly. You can only say it *does*. But biology is full of "oughts." Developmental pathways are buffered to produce specific outcomes. Disease is a deviation.

  **Chris:** "Deviation" is just statistical variance from a type.

  **Ruth:** No. A heart that doesn't pump is a malfunctioning heart, even if 50% of the population has that defect due to pollution. Your theory would say the function of the heart has changed to "not pumping" if that's the stable role. My theory says the population is sick.

  **Chris:** (Sighs) I concede that "health" might need your historical normativity. But "function" in the context of explaining *how* a system works? That's mine. When a textbook says "The function of the hemoglobin is to transport oxygen," they mean "This is what it does that explains the system's capacity." They aren't thinking about Wright's selection history.

  **Ruth:** And when a textbook says "The function of the appendix is vestigial," or "The function of the peacock tail is sexual display," they are invoking evolutionary reasons.

  **Chris:** So, are we disagreeing about the nature of biological function itself? Or are we disagreeing about which of two equally legitimate questions is more worth asking?

  **Ruth:** (Considers the peacock train) If I say there are two concepts, I risk losing the unity of biology. I want to know why the trait exists.

  **Chris:** And I want to know how the organism survives.

  **Ruth:** Perhaps... perhaps "Function" is a cluster concept. But the core, the one that distinguishes biology from geology, is the historical one. Rocks don't have functions. Birds do. The difference is history.

  **Chris:** But Swampbirds act like birds. If I'm an ecologist studying the Swampbird, I need to know its functional role in the ecosystem. It eats seeds. It flies. If I tell my grad student, "Actually, the Swampbird has no functions," they'll throw me out of the lab.

  **Ruth:** (Laughs) Fair. Maybe we need a pluralism. "Selected-Effect Function" for evolution and norms. "Causal-Role Function" for physiology and ecology.

  **Chris:** As long as you admit that when a physiologist says "function," they aren't being sloppy, they're just answering Cummins' question.

  **Ruth:** And as long as you admit that when an evolutionary biologist says "function," they aren't being metaphorical, they're answering Wright's.

  **Chris:** (Gestures to the exhibit) So the *Sinosauropteryx* filament has a Causal-Role function of insulation.

  **Ruth:** And, if the fossils bear it out, a Selected-Effect function of insulation.

  **Chris:** And the peacock train?

  **Ruth:** Selected-Effect function: Mating display.

  **Chris:** Causal-Role function: Visual signaling and aerodynamic drag.

  **Ruth:** (Turning away from the case) I can live with that. Provided you admit the Swampbird is a philosophical zombie, not a biological one.

  **Chris:** And provided you admit that if the Swampbird flies, it's flying *functionally*, even if it lacks *Proper Function*.

  **Ruth:** Deal. Now, let's get coffee before the museum closes. My thermoregulatory systems are demanding it.

  **Chris:** (Grinning) You mean your causal capacities are dropping?

  **Ruth:** Don't push it.
