      *   *Section 2: Why Circulatory Death Escapes This.* Circulatory death doesn't claim the brain is the integrator. It claims *blood flow* is the vital sign. If the heart beats (even on a vent), circulatory criteria say "alive." Shewmon agrees they are biologically alive. So CD is consistent with Shewmon's observation, whereas BD is contradictory.
      *   *Section 3: The Comebacks.*
