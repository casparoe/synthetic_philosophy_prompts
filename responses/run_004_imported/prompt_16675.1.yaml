      *   *The "Policy" Constraint:* Restrict the optimization space. The agent is allowed to care about the world, but its *choice of policy* must be neutral regarding $B$.
      *   *Armstrong's Specific Fix:* "Utility Indifference" often implies $E[U | B] = E[U | \neg B]$. But the stronger version is ensuring the *marginal utility* of actions that influence $B$ is zero.

