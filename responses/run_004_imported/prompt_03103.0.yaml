      *   *Better Distinction:* **Epistemic vs. Non-Epistemic causes.** The Dutch Book argument works if the future credence is *epistemically* accessible.
      *   *Actually, the strongest technical response:* The Dutch Book argument for Reflection requires that the proposition "My future credence will be $X$" is treated as evidence *now*. In the pill case, knowing you will take the pill gives you evidence *now* that you are unreliable later. So you *shouldn't* match the credence. The principle holds, but the *application* changes because the condition "I am certain my future credence will be $X$" carries different informational weight in the two cases.
      *   *Wait, simpler:* The principle is usually formulated as: $C_t(A | C_{t'}(A) = x) = x$.
      *   In the Pill case: $C_t(A | \text{Pill taken} \land C_{t'}(A) = x) \neq x$. Because "Pill taken" is part of the condition.
