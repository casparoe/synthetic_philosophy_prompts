      *   The backlash wasn't just theological; it was political. The Jesuits were expelled from France temporarily.
      *   The idea of "regicide" was becoming a weapon in the Wars of Religion. Protestants had used it (Monarchomachs), and now Catholics were being accused of it.

  5.  **Synthesize the "Through-Line":**
