answer: |-
  There is a significant flaw in the premise of your piece that needs to be corrected before you finalize your through-line. If you build your argument on the idea that Aquinas sanctioned private tyrannicide, your entire thesis will collapse under scrutiny by historians or theologians.

  The short answer is: **Aquinas did not argue that a private citizen is justified in killing a tyrant.** In fact, he explicitly argued against it.

  Juan de Mariana's book caused an uproar precisely because he *departed* from the settled Thomistic doctrine, radicalizing it in a way that became politically lethal in the context of the Wars of Religion.

  Here is the breakdown of the theological and historical shift you need to capture.

  ### 1. Aquinas's Actual Position (13th Century)
  Thomas Aquinas addresses tyranny primarily in *De Regno* (On Kingship) and the *Summa Theologiae*. His position is far more cautious than the popular memory suggests.

  *   **Public Authority, Not Private:** Aquinas argues that if a ruler becomes a tyrant, the remedy lies with **public authority**, not private individuals. If the king was appointed by a superior (like an Emperor or the Pope), that superior should depose him. If the king was elected by the people, the people (or their representatives) should depose him.
  *   **The Prohibition on Assassination:** Aquinas explicitly warns against private citizens taking it upon themselves to kill a tyrant. He cites the assassination of Julius Caesar as a negative example; even though Caesar was ambitious, Aquinas notes that the assassins were condemned because they took the law into their own hands.
  *   **The "God Only" Clause:** In *De Regno*, Aquinas writes that if there is no human remedy for tyranny (no superior to appeal to, no public assembly), the people must turn to **God**, not the sword. He argues that private assassination often leads to greater instability or a worse tyrant taking the place of the first.

  **The Through-Line Correction:** Aquinas established that tyranny is illegitimate, but he did **not** establish a right of individual regicide. He kept the monopoly on violence within the realm of public law.

  ### 2. Mariana's Innovation (1599)
  Juan de Mariana, a Spanish Jesuit, wrote *De Rege et Regis Institutione* (On the King and the Education of the King). While he drew on the Scholastic tradition, he shifted the parameters in a dangerous way.

  *   **Popular Sovereignty:** Mariana argued that sovereignty ultimately resides in the people, who delegate it to the king. If the king violates the contract (by becoming a tyrant or imposing heresy), power reverts to the people.
  *   **The Private Citizen Loophole:** This is the critical divergence. Mariana argued that if there is no public assembly available to depose the tyrant (e.g., the Estates General is suppressed), then **a private citizen** may be justified in assassinating the tyrant.
  *   **Theological Cover:** Mariana framed this not just as political theory but as a defense of the Catholic faith. In the context of the Reformation, a "tyrant" was often code for a Protestant monarch persecuting Catholics.

  ### 3. Why the Uproar in 1610?
  If Mariana published in 1599, why did the book get burned in Paris in 1610? The catalyst was the assassination of **Henry IV of France**.

  *   **The Ravaillac Connection:** Henry IV was killed by François Ravaillac, a Catholic fanatic. Under torture, Ravaillac claimed he was influenced by Jesuit teachings that it was permissible to kill a king who was an enemy of the Church. While there is no evidence Mariana directly instructed Ravaillac, the *Parlement* of Paris seized on Mariana's book as the ideological smoking gun.
  *   **The Jesuit Target:** The Jesuits were already hated by the French *Parlements* (who were Gallicans, wanting a French church independent of Rome) and the monarchy. They were seen as agents of the Pope and Spain. Mariana's book gave their enemies the perfect weapon to paint the entire order as regicides.
  *   **Shift in Political Theory:** In Aquinas's time, "tyrannicide" was an abstract scholastic question. By 1610, following the St. Bartholomew's Day Massacre and the Dutch Revolt, it was a practical tool of regime change. The Protestant *Monarchomachs* had already argued for killing tyrants; Mariana's work suggested Catholics could do the same to Protestant kings. This created a reciprocal cycle of fear.

  ### 4. The Theological Condemnation
  It is important to note that the Church itself did not universally endorse Mariana.
  *   **The Parlement of Paris** burned the book.
  *   **The Jesuit Order**, under pressure, actually condemned the proposition of private tyrannicide in 1610 to save themselves from expulsion. The Jesuit General, Claudio Acquaviva, forbade members from teaching that it was lawful to kill kings.
  *   **The Pope** did not condemn the book immediately, but the doctrine of private tyrannicide gradually became taboo in Catholic moral theology precisely because of the scandal Mariana caused.

  ### Summary for Your Piece
  Your through-line should not be "Aquinas settled it, and Mariana repeated it."

  **The accurate narrative arc is:**
  1.  **Aquinas** delegitimized tyranny but **restricted the remedy to public authority**, forbidding private assassination.
  2.  **Mariana** radicalized the Scholastic tradition by allowing for **private action** under specific conditions, linking tyranny closely with heresy.
  3.  **Henry IV's Assassination** turned Mariana's theoretical loophole into a perceived political weapon, leading to the condemnation of the book not because it restated doctrine, but because it **innovated a dangerous exception** to the Thomistic rule during a time of extreme religious violence.

  Mariana wasn't condemned for restating settled doctrine; he was condemned for breaking it.
