      *   **Core Question:** If Aquinas settled this, why was Juan de Mariana (16th/17th century) condemned for making the "exact same argument" after Henry IV's assassination?
      *   **Underlying Assumption:** Mariana was just restating settled Catholic doctrine, so the backlash must be due to something else (politics, timing, etc.).
      *   **Fact Check:** The user's understanding of Aquinas is *incorrect*. This is the crux of the issue. Aquinas did *not* argue that any private citizen can kill a tyrant. He argued for public authority or non-violent resistance in most cases. Mariana *did* argue for a broader right of tyrannicide, including by private individuals under specific circumstances.
      *   **Goal:** Correct the misconception about Aquinas gently but firmly, explain the actual difference between the two thinkers, and contextualize why Mariana's book was controversial in the specific political/religious climate of the late 16th/early 17th century.

  2.  **Deconstruct Aquinas's Position (*De Regno* / *Summa Theologiae*):**
      *   Aquinas discusses tyranny in *De Regno* (On Kingship) and *Summa Theologiae* (II-II, Q. 42, A. 2).
      *   *Key Distinction:* He distinguishes between a ruler who usurps power vs. one who abuses legitimate power.
      *   *Private Citizen?* No. Aquinas explicitly warns against private individuals taking it upon themselves to kill a tyrant. He cites the betrayal of Julius Caesar as a negative example (even though Caesar was ambitious, the assassins were condemned).
      *   *Public Authority:* He suggests that if there is a public mechanism (like a Roman Senate or an overlord) to depose the tyrant, that should be used.
      *   *Divine Intervention:* If no human remedy exists, one must pray to God, not take up the sword.
      *   *Conclusion:* Aquinas is much more cautious and restrictive than the user claims.

  3.  **Deconstruct Mariana's Position (*De Rege et Regis Institutione*):**
      *   Published 1599.
      *   Context: Spanish Jesuit, writing for the education of a prince.
      *   *Key Argument:* Sovereignty resides ultimately in the people. If a king becomes a tyrant, the people (or their representatives) can depose him.
      *   *Private Citizen?* This is the contentious point. Mariana suggests that if there is no public assembly to act, a private citizen *might* be justified in killing a tyrant, especially if the tyrant is an usurper or imposes heresy. He uses examples like Ehud and William Tell.
      *   *Nuance:* He puts conditions on it (public declaration, last resort), but the *possibility* of private tyrannicide is there, which Aquinas largely ruled out.

