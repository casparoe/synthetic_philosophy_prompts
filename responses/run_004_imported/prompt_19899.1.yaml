      *   **Difference:** Aquinas = Public authority only / Prayer. Mariana = Private individual possible under extreme conditions.
      *   **Context:** The Reformation/Wars of Religion made this theoretical question lethal. Henry IV's death made it real.
      *   **Politics:** Anti-Jesuit sentiment + Gallicanism + Fear of Spanish influence.

  6.  **Drafting the Response (Iterative Process):**
