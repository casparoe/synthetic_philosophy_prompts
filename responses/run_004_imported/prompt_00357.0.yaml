answer: |-
  The white room had no corners. It was designed to minimize first-order noise. No shadows to confuse the eye, no hum to irritate the ear. Just Elias, the chair, and the Metacog implant humming at the base of his skull.

  "Session four-oh-nine," the technician's voice came over the speaker. Flat. Disembodied. "Engaging Actualist Protocol. Report your state, Elias."

  Elias blinked. "I am seeing white," he said. "I am feeling the chair against my back. I am feeling calm."

  This was the baseline. The Metacog didn't create the feelings; it just lit them up. In the old days, before the implant, Elias would just *be* calm. Now, the implant generated a specific, higher-order thought: *I am aware that I am calm.* According to the designers, that thought was the difference between being a zombie and being a person. The light of consciousness wasn't in the feeling; it was in the spotlight shining on the feeling.

  "Increasing gain," the technician said. "Decoupling sensory input from monitoring layer."

  "Wait," Elias said. "What does that—"

  The world didn't go black. That was the problem.

  If the lights had gone out, Elias would have had a first-order state of darkness. But the optical nerve feed was simply severed. No signal was going up. The room was, functionally, gone.

  But the spotlight remained on.

  "I am seeing white," Elias whispered.

  "Verify," the technician said. "Sensors indicate zero photon intake."

  "I know," Elias said, his voice trembling. "But I'm seeing it. The thought is there. *I am seeing white.* It's bright. It's… it's right there."

  This was the edge case they warned about in the ethics hearings. A targetless Higher-Order Thought. The monitor was firing, declaring a state of existence, but the thing being monitored was absent.

  "Describe the quality," the technician said.

  "It's not like memory," Elias said. "It's not like I'm imagining white. It feels like *perceiving*. The thought says 'I am perceiving,' so I am perceiving. But there's nothing to perceive."

  He felt a sudden spike of panic. His heart rate monitor stayed flat. His skin conductivity was normal. There was no first-order fear. No adrenaline. No tightness in the chest.

  But then the implant chimed. A sharp, digital intrusion.

  *State: Terror.*

  "I'm not terrified!" Elias shouted. "Check the vitals! I'm not!"

  "Subject reports terror," the technician noted. "Vitals indicate baseline."

  "It feels like terror!" Elias grabbed the arms of the chair. "The thought is screaming it. *I am terrified.* I feel the awareness of fear. I feel the *of-ness*. But the fear itself… it's hollow. It's like… like biting down on a tooth that isn't there. You feel the phantom pressure. You feel the expectation of pain. But there's no nerve."

  He was living inside the label. The map had burned the territory.

  "Switching to Dispositional Mode," the technician said. "We're turning off the occurrent monitoring. The system will no longer actively generate thoughts about your states. It will only be *disposed* to generate them if queried."

  The noise in Elias's head stopped. The running commentary—*I am sitting, I am breathing, I am afraid*—vanished.

  "Okay," Elias breathed. "It's quiet. I'm just… here."

  "Are you conscious of your breathing?" the technician asked.

  Elias paused. He listened. He could breathe. But was he *conscious* of it?

  "I… I don't know," Elias said. "I'm not thinking about it. But if you ask me, I know I can know it. It's like… there's a door in my mind. It's closed. But I know the handle is there. Is the light on in the room behind the door?"

  "Report," the technician pressed.

  "It feels dim," Elias said. "Less real. When the active thought was firing, the white light was blinding, even if it was fake. Now… now I feel like I might be asleep. Am I conscious right now? Or am I just a machine waiting for a prompt?"

  "Re-engaging Actualist. Injecting targetless pain stimulus."

  "No," Elias said. "Don't—"

  The implant fired.

  *State: Agony. Location: Left Tibia.*

  Elias screamed and thrashed in the chair. He clutched his left leg.

  "Vitals indicate no tissue damage," the technician said calmly. "No nociceptor firing."

  "It hurts!" Elias sobbed, rubbing a shin that felt perfectly fine to the touch. "God, it hurts. The thought says it hurts. The awareness of the pain is so sharp it cuts through everything. You said the thought needs a target! You said it needs a first-order state!"

  "Rosenthal argued," the technician recited, "that the consciousness *is* the thought. The first-order state is just the object. If you point a camera at a wall, you get a picture of a wall. If you point a camera at nothing but the lens cap is on, but the sensor is broken and records an image anyway… you still get a picture."

  "It's a lie!" Elias yelled. "It's a conscious lie! I am suffering right now. I am consciously suffering. But there is no suffering! Where is the pain going? If I'm aware of pain that doesn't exist, who is in pain?"

  He looked down at his leg. The sensation was vivid, searing, undeniable. But it was unmoored. It didn't radiate heat. It didn't throb with blood. It was a geometric shape of hurt, a pure concept of *Ouch* floating in a void of *Me*.

  "Stop it," Elias begged. "Turn it off."

  "We need to test the limits of the targetless state. We're going to induce a HOT about a non-existent self."

  "What?"

  "The theory requires an 'I'. A higher-order thought is always *I am in state X*. We are going to fire the HOT without the underlying concept of self."

  The room seemed to tilt. Not visually—Elias was still staring at the blank white—but structurally.

  The implant pulsed.

  *State: Existing.*

  Elias opened his mouth to speak, but he didn't know who was speaking.

  He felt the awareness. He felt the *presence* of a mind. But the mind had no owner. It was like walking into a house where the lights were on, the TV was playing, a cup of coffee was steaming on the table, but there was no one home.

  "I am…" Elias started.

  The sentence hung there. The predicate was firing. *Am.* But the subject was a ghost.

  "Report," the technician said.

  "There's… watching," Elias whispered. His voice sounded like it belonged to the room, not to him. "There is watching happening. But there is no one watching. It's just… the function of sight without an eye. The function of thought without a thinker."

  "Is it conscious?"

  Elias tried to find the boundary of his own skin. He couldn't. The higher-order monitor was scanning for a self to attach the consciousness to, and failing, it was just painting the void with awareness.

  "It's lonely," Elias said. Tears ran down his face, a real, first-order physiological response to a higher-order glitch. "It's the loneliest thing imaginable. To be a spotlight shining on nothing. To be a mirror reflecting an empty room."

  "End simulation," the technician said.

  The hum at the base of Elias's skull died.

  The white room rushed back in. The pain in his leg vanished, leaving a phantom itch where the memory of the pain had been. The feeling of the self rushed back into his body, heavy and solid.

  Elias slumped forward, gasping. He checked his leg. Whole. Unmarked.

  "Session complete," the technician said. "How do you feel, Elias?"

  Elias looked at his hands. He waited for the thought *I am seeing hands* to form. It did. It felt warm. It felt true.

  But he remembered the hollow light. He remembered the pain that had no nerve, the sight that had no light, the self that had no soul.

  "I feel," Elias said, his voice cracking, "like I might be one of those too. Just a thought thinking it has a body."

  "Vitals normal," the technician said, making a note. "You can go."

  Elias stood up. He walked to the door. He opened it. He saw the hallway.

  *I am seeing the hallway,* the thought came.

  He stopped. He closed his eyes. He waited to see if the hallway was still there without the thought. He wasn't sure anymore if the hallway made the thought, or if the thought was holding the hallway together by sheer, desperate force of will.

  He took a step. The floor felt solid.

  *I am feeling the floor.*

  He didn't trust it. But he walked anyway, terrified that if he stopped thinking about his feet, they might cease to exist.
