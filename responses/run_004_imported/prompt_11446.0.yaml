prompt: |-
  I serve on the judging panel for a small literary press's annual short-fiction prize, whose guidelines restrict entry to "human-authored" work and exclude "writing generated by artificial intelligence," without saying anything more precise than that. The strongest submission this year was drafted longhand by its author and then revised sentence by sentence with the help of a large language model: she fed the model each paragraph in turn, asked it to suggest tighter or more vivid phrasings, and incorporated many of its suggestions nearly verbatim, though the plot, characters, and narrative voice are unmistakably her own invention. Two of the judges want to disqualify the story on the grounds that a workable rule needs a bright line and any model involvement at the sentence level crosses it; two others want to admit it, since the conception and structure of the story are entirely human and no one would object to a human copy-editor doing the same work. A fifth judge has raised a harder point. If we admit this story, he argues, we have no principled place to draw the line against an author who leaned on the model far more heavily: every cutoff anyone has proposed -- a percentage of words altered, a cap on the number of queries, a distinction between the model "suggesting" and "generating" -- looks arbitrary once you picture the continuum of cases running from this story to one produced wholesale from a one-line prompt.

  Please draft the roughly one-page memo I will circulate to the panel before our final ranking meeting. It should recommend, concretely, whether this particular story is eligible, and it should articulate the underlying rule clearly enough that we could apply it consistently to future entries -- or, if you conclude that no such rule can be made to work, propose what should replace the search for such a rule. Whichever route you take, engage seriously with the fifth judge's worry rather than setting it aside: if you defend a specific cutoff, say why it is not arbitrary in the way he alleges; if you reject the possibility of a principled cutoff, say what that implies for how the panel should actually decide cases like this one going forward.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Judge on a literary press's annual short-fiction prize panel.
      *   **Task:** Draft a one-page memo to circulate to the panel before the final ranking meeting.
      *   **Context:**
          *   Guidelines: "Human-authored" only, no "AI-generated."
          *   The Case: A strong submission drafted longhand, revised sentence-by-sentence with an LLM (author provided paragraphs, LLM suggested phrasing, author incorporated many verbatim). Plot/characters/voice are human.
          *   The Split: 2 judges want disqualification (bright line needed, sentence-level involvement crosses it). 2 judges want admission (conception/structure human, analogous to copy-editing).
          *   The Fifth Judge's Challenge: The "Slippery Slope" or "Continuum" argument. If we admit this, where do we stop? Any cutoff (percentage, query count, suggest vs. generate) seems arbitrary given the continuum from this case to full AI generation.
      *   **Requirements:**
          *   Recommend concretely on *this* story (Eligible or Ineligible).
          *   Articulate an underlying rule for consistency OR propose replacing the search for a rule.
          *   Engage seriously with the Fifth Judge's worry (defend the cutoff against arbitrariness OR explain the implications of rejecting a cutoff).
          *   Length: Roughly one page.

  2.  **Determine the Stance:**
      *   *Option A (Eligible + Bright Line):* Argue that "conception and structure" is the line. Counter the Fifth Judge by saying literary value resides in conception, not just phrasing. *Risk:* Hard to define "conception" vs. "expression" legally/philosophically.
      *   *Option B (Ineligible + Bright Line):* Argue that sentence-level generation is the line. Counter the Fifth Judge by saying the *process* matters, not just the output. *Risk:* Punishes tool use that is becoming standard.
      *   *Option C (Eligible + No Bright Line/Case-by-Case):* Admit the story, but acknowledge the Fifth Judge is right that a rigid rule is impossible. Propose a "Substantial Human Creative Control" standard assessed holistically. *Risk:* Seems vague, but honest.
      *   *Option D (Ineligible + No Bright Line):* Disqualify to be safe, acknowledge the fuzziness. *Risk:* Discourages innovation, seems cowardly.

      *Decision:* The most intellectually honest and practically useful approach for a literary prize is **Option C (Eligible + Holistic Standard)**. The Fifth Judge is correct that mathematical cutoffs are arbitrary. However, abandoning *all* rules leads to chaos. The solution is to shift from a *procedural* rule (how many words changed) to an *ontological* rule (where did the creative spark originate?). The memo should recommend admitting the story but establishing a "Primary Creative Agency" standard. This engages the Fifth Judge by admitting the continuum exists but arguing that we judge the *center of gravity* of the work, not the edges.

      *Alternative Decision:* Actually, for a prize guideline, clarity is king. A "holistic standard" might be too vague for future submitters. A stronger stance might be **Option A (Eligible + Functional Distinction)**. Distinguish between *generative* AI (making choices about what happens) and *assistive* AI (refining how it's said). This addresses the Fifth Judge by arguing the distinction isn't arbitrary because it aligns with how we value literature (ideas > polish).

      *Refining the Decision:* Let's go with **Eligible**, but with a rule based on **Authorial Intent and Creative Agency**. This directly addresses the copy-editor comparison. The Fifth Judge's continuum argument is valid regarding *quantity*, but invalid regarding *quality of agency*. The rule shouldn't be "how many words," but "who made the narrative decisions?"

      *Wait, looking closer at the prompt:* "If you defend a specific cutoff, say why it is not arbitrary... if you reject the possibility of a principled cutoff, say what that implies."
      The Fifth Judge's point is strong. A percentage *is* arbitrary. A "conception vs. expression" line *is* fuzzy.
      Maybe the best path is to **admit the story** but **reject the possibility of a precise procedural cutoff**, proposing instead a **disclosure and attestation model**. This is a very modern, practical solution. It shifts the burden to the author to declare their process, and the judges to evaluate based on "substantial human creative control."
      *Actually, let's look for a middle ground.* The prompt asks to "articulate the underlying rule clearly enough that we could apply it consistently." A disclosure model is a process, not a rule of eligibility.
      Let's try to defend a **Functional Cutoff**. The line is between *generating content* vs. *refining content*. This is not arbitrary because it mirrors the distinction between author and editor.
      *Okay, final decision:* Recommend **Eligibility**. Defend the line between **Architectural/Generative** (Human) vs. **Stylistic/Refining** (AI allowed). Address the Fifth Judge by arguing that while a continuum exists, the *category* of labor matters more than the *volume*.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (recommendation on the contested submission and future guidelines).
      *   **Recommendation:** The story is eligible.
      *   **The Rule:** Distinguish between *Generative Agency* (plot, character, narrative arc) and *Assistive Polishing* (syntax, diction).
      *   **Addressing the Fifth Judge:** Acknowledge the continuum. Argue that "arbitrary" doesn't mean "nonexistent." We draw lines in law and ethics all the time (e.g., age of consent, speed limits) based on the *nature* of the act, not just the degree. The distinction here is *what kind of work* is being done. If the AI is acting as a thesaurus on steroids, it's a tool. If it's acting as a co-writer, it's a partner.
      *   **Future Application:** Require a brief process statement from authors. Judges evaluate based on where the "creative weight" lies.
      *   **Closing:** Call for unity/final decision.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Architectural vs. Stylistic" too fuzzy?
      *   *Fix:* Acknowledge the fuzziness but argue it's the *only* fuzziness that matters. The Fifth Judge is right that *quantitative* cutoffs fail. So we must use a *qualitative* standard.
      *   *Tone:* Professional, collegial, decisive, philosophical but practical.
      *   *Length:* Keep it tight. One page roughly (500-600 words).

  5.  **Final Polish:** Check against constraints.
      *   Concrete recommendation? Yes (Eligible).
      *   Underlying rule? Yes (Human Creative Agency over Narrative Elements).
      *   Engage Fifth Judge? Yes (Address the continuum/arbitrariness point directly).
      *   Format? Memo.

  6.  **Writing the Memo:** (Mental check of the text)
      *   Start with the recommendation.
      *   Define the "Creative Agency" standard.
      *   Tackle the slippery slope. The slope exists, but we aren't sliding down it if we anchor on *intent*.
      *   Propose a disclosure requirement for the future to make this enforceable.

      *(Self-Correction)*: I need to make sure I don't just wave my hands. The Fifth Judge says *any* cutoff is arbitrary. I need to explain *why* this specific cutoff (Generative vs. Assistive) is principled. It's principled because it aligns with the definition of "authorship" in literary tradition. Authorship is about *invention*, not just *inscription*.

      *Let's write.*

      **TO:** Prize Judging Panel
      **FROM:** [My Name]
      **DATE:** October 26, 2023
      **SUBJECT:** Eligibility Recommendation and Guideline Clarification

      **Recommendation:**
      I recommend we rule the contested submission **eligible**. However, to address the valid concerns regarding consistency, I propose we adopt a standard of **Primary Narrative Agency** rather than a quantitative cutoff.

      **The Proposed Rule:**
      Our guideline excludes "writing generated by artificial intelligence." We should interpret "writing" not as the physical inscription of sentences, but as the **generation of narrative meaning**. Under this rule, a work is human-authored if the human retains primary agency over the narrative's *invention* (plot, character psychology, thematic arc, and voice) even if AI assists in *execution* (syntax, pacing, diction).

      In this specific case, the author drafted the story longhand and determined every narrative beat. The LLM functioned as an advanced copy-editor, offering phrasing options that the author selectively accepted. This aligns with the judges who compared the process to human editing. The creative weight rests on the human.

      **Addressing the Continuum Concern:**
      The fifth judge rightly notes that any line we draw sits on a continuum. If 10% AI revision is allowed, is 11% forbidden? If we allow phrasing suggestions, what about paragraph restructuring? Quantitative cutoffs (word counts, query limits) are indeed arbitrary and unenforceable.

      However, the existence of a continuum does not negate the validity of a qualitative distinction. We distinguish between "self-defense" and "assault," or "fair use" and "infringement," not by measuring force or percentages, but by assessing **intent and function**. The principled line is not *how much* the AI did, but *what kind of work* it did.
      *   **Permissible:** AI as a tool for refinement (thesaurus, grammar, rhythm).
      *   **Impermissible:** AI as a partner in invention (generating plot points, resolving character arcs, creating imagery the author did not conceive).

      This distinction is not arbitrary because it tracks our literary definition of authorship. We prize stories for their vision, not just their polish. If the vision is human, the work is human, regardless of how efficiently the polish was applied.

      **Future Application:**
      To make this consistent, we cannot rely on forensic detection. Instead, we must update our submission guidelines to require a **Process Statement**. Authors must briefly disclose any AI usage (e.g., "Used for line-editing only").
      1.  If an author discloses AI use for invention/generation, they are ineligible.
      2.  If they disclose AI use for refinement, they are eligible.
      3.  If they fail to disclose and AI use is suspected/evident, the panel evaluates based on the "Primary Narrative Agency" standard. If the narrative voice or structural choices feel algorithmic rather than intentional, we disqualify.

      This shifts the burden from policing a fuzzy border to honoring authorial honesty and evaluating the locus of creativity. It allows us to admit this strong story without opening the floodgates to prompt-engineering.

      I look forward to discussing this in our final meeting.

      *(Word Count Check)*: Looks good. Concise, addresses all points.

      *Wait, one nuance:* The prompt says "incorporated many of its suggestions nearly verbatim." Does this threaten the "voice" argument? I should acknowledge that. If the voice becomes the AI's, it's ineligible. But the prompt says "narrative voice are unmistakably her own invention." I will stick to that fact.

      *Final Polish:* Ensure the tone is collaborative but firm.

      *(Final Review against constraints)*:
      - One page memo? Yes.
      - Concrete recommendation? Yes (Eligible).
      - Underlying rule? Yes (Primary Narrative Agency).
      - Engage Fifth Judge? Yes (Qualitative vs Quantitative).
      - Future consistency? Yes (Process Statement).

      Ready to generate.cs
