answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Institute Name]
  **FROM:** [Your Name], Outside Director
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Capital Staking and Risk Policy for Trading Fund

  ### Executive Summary

  The Board must adopt a staking policy that balances the mathematical imperative for growth with the fiduciary necessity of institutional survival. While the Quantitative Lead's argument for Full Kelly staking is theoretically sound regarding long-term geometric growth, it assumes a level of probability precision and risk tolerance incompatible with our operational liabilities (specifically, quarterly payroll obligations).

  I recommend the Board adopt a **Half-Kelly staking rule**, subject to a **15% maximum equity drawdown circuit breaker**. This policy captures approximately 75% of the theoretical growth rate of Full Kelly while reducing volatility by 50%, providing a critical buffer against model error. This policy should be reviewed after six months of live trading or upon hitting the drawdown limit, whichever comes first.

  ### 1. Validating the Growth-Optimality Argument

  We must acknowledge that the Quantitative Lead's position rests on robust mathematics. The Kelly Criterion is indeed the unique strategy that maximizes the expected logarithmic growth rate of capital over an infinite horizon.

  Furthermore, the appeal to ergodicity economics is well-founded. In repeated betting scenarios, the "ensemble average" (what happens across many parallel universes) diverges from the "time average" (what happens to one entity over time). Maximizing expected value (EV) per trade can lead to ruin in the time average if bet sizes are too large. The Lead is correct that ordinary EV reasoning often ignores the path-dependency of compounding. If our goal were purely to maximize the terminal wealth of a fund with no liabilities and infinite lifespan, Full Kelly would be the correct instruction.

  ### 2. The Case for Constraint: Model Risk and Institutional Ergodicity

  However, applying Full Kelly requires two conditions we do not meet: known true probabilities and an ability to absorb infinite drawdown.

  **A. Estimation Error vs. Known Odds**
  The Kelly Criterion is notoriously unforgiving of overconfidence. It assumes the probabilities inputted are the *true* frequencies of events. Our forecasts are *calibrated estimates*, derived from human aggregation and models. If we overestimate our edge by even a small margin, Full Kelly shifts from "optimal growth" to "certain ruin." Fractional Kelly is the standard industry correction for parameter uncertainty; it treats our probability estimates as distributions rather than point values.

  **B. Institutional Ergodicity**
  We must apply the ergodicity argument to the Institute itself, not just the trading account. The "entity compounding over time" is not merely the capital pool; it is the nonprofit organization.
  *   **The Ruin Constraint:** If a drawdown compromises our ability to cover payroll or research commitments, the Institute's operations cease. At that point, our time average return becomes zero, regardless of the theoretical edge in the model.
  *   **Liquidity Mismatch:** Unlike a hedge fund that can lock up capital, we have quarterly cash flow obligations. Full Kelly implies a roughly 50% probability of experiencing a 50% drawdown at some point. We cannot operate through a 50% equity contraction without jeopardizing our mission.

  ### 3. Recommended Policy: Half-Kelly with Guardrails

  To reconcile the growth objective with our fiduciary duties, I propose the following specific rules:

  **1. Staking Size: 50% of Full Kelly**
  *   **Rationale:** Mathematically, betting half the Kelly fraction yields three-quarters of the expected growth rate but cuts the volatility (and maximum drawdown risk) in half. This provides a "safety margin" for the inevitable variance in our forecasting edge.
  *   **Implementation:** The Quant Lead will calculate the Full Kelly fraction for each position based on the institute's aggregated probability and the market price. The executed size will be capped at 50% of that calculated figure.

  **2. The Circuit Breaker: 15% Maximum Drawdown**
  *   **Rationale:** We must define "ruin" before it happens. A 15% loss of trading capital is material but recoverable; anything beyond that threatens our liquidity buffer.
  *   **Implementation:** If the trading fund's net asset value (NAV) drops 15% from its high-water mark, trading halts immediately. Capital is moved to cash equivalents, and the Board convenes to review the model's calibration before authorizing further trades.

  **3. Position Concentration Limit**
  *   **Rationale:** To prevent correlation risk from undermining the Kelly calculation (which assumes independent bets).
  *   **Implementation:** No single position (or cluster of highly correlated positions) may exceed 20% of the total trading fund equity, regardless of the Kelly signal.

  ### 4. Review and Oversight

  This policy is not static. We are entering a live market environment where our assumptions will be stress-tested.

  *   **Performance Review:** The Board will review the fund's performance, calibration, and staking adherence at the end of each fiscal quarter.
  *   **Policy Sunset/Revision:** This specific staking mandate is authorized for **six months**. At that mark, we will reassess whether the realized volatility matches our projections. If the Half-Kelly volatility proves too high for our liquidity needs, we will move to Quarter-Kelly. If the model proves exceptionally robust and our cash reserves grow, we may revisit the fraction.

  ### Conclusion

  Adopting a Half-Kelly strategy is not a rejection of the Quantitative Lead's math; it is an adaptation of it to the real world. It acknowledges that while we seek to profit from our forecasting edge, our primary mandate is to ensure the Institute survives long enough to compound those profits. This policy allows us to demonstrate our edge publicly without betting the organization's viability on the accuracy of a single quarter's forecasts.

  I move that we adopt this staking policy effective immediately.
