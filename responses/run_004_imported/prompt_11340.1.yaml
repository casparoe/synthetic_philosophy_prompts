      *   **Section 3: Lewis's Actual View:** Lewis accepted the result. He generally favored the view that conditionals do not express propositions (in the probability context) *or* that the Equation is false. But he never dismissed their utility as "habit."
      *   **Section 4: The Senior's Rebuttal (The Drama):** Give concrete options for the dialogue.
