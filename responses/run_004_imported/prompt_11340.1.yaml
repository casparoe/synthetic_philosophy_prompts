          *   *Option A:* Keep Truth Conditions, drop the Equation. (Stalnaker/Lewis possible worlds semantics). The conditional is true if the closest A-world is a B-world. $P(A \to B)$ doesn't equal $P(B|A)$, but the sentence still has truth conditions.
          *   *Option B:* Keep the Equation, drop Truth Conditions (Adams/Edgington). But this doesn't mean "semantic emptiness." It means the semantics is probabilistic/assertibility-based, not truth-conditional. It's still rigorous, not just "habit."
      *   *Attack Vector 2: Pragmatics vs. Semantics.* Even if truth conditions are elusive, the *use* is rule-governed, not just habitual.
      *   *Attack Vector 3: Lewis's Own View.* Lewis didn't say "it's all empty." He said "our naive intuitions about probability and conditionals are inconsistent."

