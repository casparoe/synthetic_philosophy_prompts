prompt: |-
  I am roughly two-thirds through a novel set in the philosophy department of a fictional English university, and the plot turns on a public lecture that ends in open intellectual combat between two colleagues. The lecture is delivered by an ambitious junior professor, and her closing flourish, as I currently have it drafted, runs roughly as follows: because David Lewis's triviality results from the 1970s show that no conditional connective can make the probability of "if A, then B" equal the conditional probability of B given A across every reasonable state of belief, it follows that indicative conditionals have no determinate truth conditions at all, and that the "if...then" reasoning embedded in jury instructions, scientific inference, and everyday deliberation is, strictly speaking, semantically empty scaffolding that we go on using only out of habit. Her rival at the lectern, an older colleague who has spent his career on formal semantics and is supposed to be considerably more exacting than she is, must demolish this argument in front of the assembled audience, but I have not yet decided what he actually says in reply, and I would rather not put words in his mouth that turn out to be only a more confident restatement of my own uncertainty.

  Before I commit to the scene, I would like to know whether the junior professor's summary of Lewis's result is defensible as I have stated it, or whether it glides past a distinction that any competent logician in the room would notice at once. In particular, I would like to understand what the triviality proof actually licenses us to conclude about the semantics of conditionals, and what Lewis himself took the upshot of his own proof to be for the truth-conditional status of "if," since that seems directly relevant to how devastating her senior colleague's reply can honestly be. I would be grateful for an answer substantial enough that I can dramatize a genuine philosophical disagreement on the page, rather than a rhetorical stalemate.
