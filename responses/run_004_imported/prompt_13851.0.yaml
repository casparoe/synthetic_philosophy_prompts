      *   **Task:** Write an essay addressing whether this non-conservativeness refutes deflationism.
      *   **Key Components:**
          *   Explain *why* conservativeness seemed like a natural commitment for deflationism.
          *   Work through deflationist responses (Bite the bullet, Retreat to weaker theory, Deny the commitment).
          *   Weigh responses against the anti-deflationist argument charitably.
          *   **Crucial:** Take a stance (don't be on the fence) and justify it.
      *   **Audience:** Graduate seminar level (philosophically sophisticated, familiar with Gödel, PA, deflationism).
      *   **Tone:** Analytical, argumentative, essayistic.

  2.  **Deconstruct the Arguments:**

      *   **The Deflationist Intuition:** Truth isn't a robust property. It's a logical device (disquotation, generalization). If I add a logical device to a theory about numbers, I shouldn't learn new facts *about numbers*. If I do, "truth" must be doing substantive work. Hence, Conservativeness.
      *   **The Shapiro/Ketland Challenge:**
          *   Base Theory $T$ (e.g., Peano Arithmetic).
          *   Extended Theory $T^+$ ($T$ + Truth axioms + Induction extended to truth-containing formulas).
          *   Result: $T^+$ proves $Con(T)$ (or Global Reflection). $T$ does not (by Gödel 2).
          *   Conclusion: $T^+$ is non-conservative over $T$. Therefore, deflationism is false (truth is substantive).
      *   **Deflationist Responses:**
          1.  *Bite the Bullet (Field/Halbach style variations):* Accept non-conservativeness but argue it doesn't imply substantiveness. The "new" facts are merely logical consequences of the conceptual role of truth, not evidence of a robust property. Or, argue that we *should* accept the reflection principles independently, so the base theory was deficient, not the truth theory.
          2.  *Retreat (Restrict Induction):* Keep conservativeness by refusing to extend the induction schema to formulas containing "true."
              *   *Cost:* This cripples the theory. We can't prove generalizations about truth easily. It makes the truth predicate mathematically weak and perhaps philosophically useless for generalizing.
          3.  *Deny the Commitment (Deflate Conservativeness):* Argue that conservativeness was never the right criterion. Deflationism is about metaphysics/semantics, not proof theory. The ability to prove $Con(T)$ comes from the *conceptual* competence of accepting $T$, not the property of truth itself. (Tennant, Wright).

