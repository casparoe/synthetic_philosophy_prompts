      *   **Section 1: The Allure of Conservativeness:**
          *   Why did deflationists want this?
          *   Analogy: Adding "and" or "or" doesn't change arithmetic facts.
          *   If truth explains something (like correspondence), it should add content. If it's just a proxy, it shouldn't.
          *   It captures the idea that truth is "insubstantial."

      *   **Section 2: The Shapiro/Ketland Hammer:**
          *   Explain the technical result simply but accurately.
          *   $T$ cannot prove $Con(T)$.
          *   $T + Truth$ (with full induction) *can* prove $Con(T)$.
          *   Therefore, Truth adds content.
          *   The anti-deflationist conclusion: Truth is a substantive property (like a mathematical axiom).

      *   **Section 3: Evaluating Deflationist Responses:**
          *   *Response A: Restrict Induction.* (Horsten/Field).
              *   Critique: It saves conservativeness but kills utility. We can't generalize ("All theorems of T are true"). It makes truth philosophically anemic.
          *   *Response B: Bite the Bullet.*
              *   Critique: Hard to square with the "merely logical" claim. If it proves new arithmetic, it looks like arithmetic.
          *   *Response C: Deny the Commitment (Implicit Commitment).*
              *   Argument: Accepting $T$ implicitly commits you to Reflection. The truth predicate just makes this explicit. The "new" proof isn't new knowledge, just explicitating what was already accepted in accepting $T$.
              *   This shifts the focus from *proof-theoretic strength* to *conceptual competence*.

      *   **Section 4: The Verdict (Taking a Stand):**
          *   I need to argue that the Shapiro/Ketland argument fails as a *refutation* of deflationism, though it succeeds in showing deflationists were naive about proof theory.
          *   Why? Because conservativeness is the wrong metric for metaphysical thinness.
          *   The "substantiveness" charge conflates *proof-theoretic strength* with *ontological weight*.
          *   The ability to prove reflection principles stems from the normative status of the base theory (if we accept PA, we should accept its consistency), not from truth being a "heavy" property.
          *   Therefore, deflationism survives, but it must abandon strict conservativeness as a necessary condition.

      *   **Conclusion:**
          *   Summarize the journey.
          *   Reiterate the verdict: The argument exposes a technical flaw in early deflationist formulations but misses the philosophical target. Deflationism is about the *nature* of the property, not the *deductive closure* of the theory.

