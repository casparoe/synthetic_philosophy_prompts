      *   Jamie: Separability is the problem, not my choice.
      *   End: Stalemate on the definition of Rational Agency.

  7.  **Review against constraints:**
      *   Two characters? Yes.
      *   No folding? Yes.
      *   Address "overriding preference" objection? Yes.
      *   Include nastier pump? Yes (Unidirectional/Backward Induction).
      *   Clear disagreement at end? Yes.

  *(Self-Correction on the "Nastier Pump"):* The most specific pump designed to beat resolute choice is often attributed to **Johan Gustafsson** (The Unidirectional Money Pump). It shows that even if you don't cycle, you can be pumped if you violate *Acyclicity* in a one-way sequence, and resolute choice requires you to act against your future self's known preferences without new information. I will have Alex deploy a version of this: the argument that Resolute Choice violates *Dynamic Consistency*.

