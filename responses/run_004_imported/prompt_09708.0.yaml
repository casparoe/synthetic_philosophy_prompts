answer: |-
  **Alex:** Look, the money pump isn't a parlor trick. It's a *reductio*. If your preferences are cyclic—$A$ is better than $B$, $B$ better than $C$, $C$ better than $A$—you are mathematically guaranteed to lose wealth for no gain. You end up with $A$ minus three fees. That's not just bad luck; it's a structural defect in your decision-making. It proves transitivity is a requirement of rationality.

  **Jamie:** It proves that *naive* agents get exploited. I told you, the resolute chooser sees the loop. At node one, offered the trade from $A$ to $B$, I don't just ask, "Do I prefer $B$ to $A$ right now?" I ask, "If I take this trade, where does the path lead?" It leads back to $A$ with less money. So I refuse. The pump never starts. My preferences can stay cyclic; my *policy* saves me.

  **Alex:** But that policy requires you to act against your own current preference. At node one, by hypothesis, you prefer $B$ to $A$. That's what cyclic means. If you refuse the trade, you are intentionally choosing what you deem less preferable. You're overriding yourself. Why would a rational agent need to override their own judgment unless that judgment was defective?

  **Jamie:** Because "judgment" isn't just a snapshot. You're assuming rationality is synchronic—that it only applies to the isolated moment of choice. But I'm an agent extended in time. My "judgment" at node one includes my capacity to form plans. Overriding the local impulse isn't admitting it's defective; it's subordinating a local impulse to a global plan. I'm not saying $B$ isn't better than $A$ in a vacuum. I'm saying *taking the trade* is worse than *keeping $A$* in the context of the sequence.

  **Alex:** That's verbal sleight of hand. You're shifting the object of preference from the outcome to the action. But let's grant you the plan. The problem is, your plan only works if you can bind your future self. And that's where the "defect" charge sticks. If at node three you prefer $A$ to $C$, and you trade, you complete the pump. If you *don't* trade, you are acting against your preference at node three. So either you get pumped, or you act against your preference. Both options imply your preferences aren't guiding your action.

  **Jamie:** They are guiding my action. The preference at node three is conditioned on the history. "I prefer $A$ to $C$" is true *ceteris paribus*. But *ceteris* aren't *paribus* because I made a plan at node one. Resolute choice says the plan itself becomes a reason for action. I don't need to change my preference for $A$ over $C$ to refuse the trade. I just need to value plan-consistency more than I value the marginal gain of $A$ over $C$ at that specific moment.

  **Alex:** Okay, but now you've abandoned the money pump's original lesson. The original lesson was that preferences over *outcomes* must be transitive. You're saving your cyclic preferences by adding a new preference for "stickiness." But that's ad hoc. And it gets worse. You think resolute choice blocks the pump? There's a version of the argument that doesn't rely on cycling back. It's the Unidirectional Money Pump.

  **Jamie:** Unidirectional?

  **Alex:** Right. Imagine a sequence of choices where you move forward, never back. At each step, your local preferences say "switch," because each option is slightly better than the last in your cyclic ranking. But the final option is strictly worse than the starting one. You can't cycle back to the start to see the loop. You just slide down the hill. If you're resolute, you have to refuse the first step. But to justify refusing the first step, you have to predict what you'll do at the last step.

  **Jamie:** Sure. I predict I'll want to switch at the last step. So I lock the door at the first step.

  **Alex:** But that violates *Dynamic Consistency*. If you know that at the final node you *will* prefer the switch—and ex hypothesi you do, because your preferences haven't changed, you've just gotten new information about where you are—then a rational agent at the first node must anticipate that. If you know your future self will trade, you should trade now to get the better intermediate goods. If you know your future self won't trade, you shouldn't trade now. Resolute choice says: "I know my future self will want to trade, but I'll force him not to." That's not rationality; that's civil war. You're treating your future self as an adversary.

  **Jamie:** I'm treating my future self as a part of the same agency. The "civil war" is only a problem if you accept *Separability*—the idea that the rationality of a choice at a node depends only on the subtree from that node forward. I reject Separability. The rationality of a choice depends on the plan that brought you there. If I abandon the plan just because my local preference shifts, I'm not an agent; I'm a sequence of time-slices passing a hot potato.

  **Alex:** But if you reject Separability, you lose the ability to explain *why* the plan is rational. Why is the plan "stay at $A$" better than "trade to $B$"? At node one, $B$ is preferred to $A$. The only reason to stay is to avoid the future loss. But the future loss only happens if you make future choices. If you are rational at every node, you *will* make those choices. So the "loss" is inevitable given your preferences. Resolute choice is essentially saying, "I will be irrational at node three to save me from node one."

  **Jamie:** No. It says I will be *consistent* at node three to honor node one. You're assuming the only thing that matters is the local utility maximization at every node. I'm saying the utility of being a unified agent over time outweighs the local gain. You keep saying my preferences are defective because I have to "force" myself. I say your view of rationality is defective because it makes agency impossible. If I can't commit to a course of action against a shifting local whim, I can't undertake any long-term project.

  **Alex:** Long-term projects require changing preferences, not ignoring them. If I start a diet, I prefer health to cake. When the cake arrives, if I still prefer health, I don't need resolution. If I prefer cake, and I eat it, I'm weak-willed. But the money pump isn't about weakness. It's about logic. If $B > A$ and $C > B$ and $A > C$, you are saying all three are true simultaneously. Resolute choice just hides the contradiction. It says, "I'll act as if $A > B$ at node one, even though $B > A$." That's lying to yourself.

  **Jamie:** It's not lying. It's prioritizing. The preference $B > A$ is a *pro tanto* preference. It holds all else equal. But all else isn't equal when a pump is present. The context of the sequence changes the normative weight. You're treating preferences like atomic facts. They're more like proverbs—"Look before you leap" is true, "He who hesitates is lost" is true. Which one applies depends on the situation. My cyclic preferences are the proverbs. Resolute choice is the judgment of which one governs the sequence.

  **Alex:** But then you've given up on formalizing rationality. If preferences are context-dependent in that way, we can't model them. We can't say you're irrational anymore, we can only say you're "contextually inconsistent." And that lets *any* behavior off the hook. I can say, "I prefer losing money to keeping it, in the context of this specific pump."

  **Jamie:** No, because the constraint is still there: I must maximize my expected utility *as a temporally extended agent*. You're maximizing for time-slices. That's the disagreement. You think the money pump proves my preferences are cyclic and therefore wrong. I think the money pump proves that *local* maximization is dangerous and therefore wrong.

  **Alex:** But local maximization is what "preference" *means*. If you don't choose the locally preferred option, in what sense do you prefer it?

  **Jamie:** In the sense that if the sequence weren't there, I would choose it. The sequence introduces a constraint, like a budget or a law. I prefer to steal the bread, but I don't, because of the law. Does that mean my preference for bread is defective? Or that I'm rational for obeying the law? The "law" here is the logic of the pump.

  **Alex:** The law is internal to your mind, though. That's the difference. If the constraint is external, fine. But if the constraint is just your own past word against your current desire, and you side with the past word despite the current desire, you're worshipping a ghost. You're letting a dead preference rule a live one.

  **Jamie:** I'm letting my *agency* rule my *impulses*. And if that means I'm immune to your money pump, then your money pump doesn't prove what you think it proves. It proves that naive agents lose money. It doesn't prove that cyclic preferences are impossible for a rational being.

  **Alex:** It proves that a rational being with cyclic preferences cannot be *free* to choose at every node. You have to be bound. You have to be unfree to be rational. That's a hell of a cost.

  **Jamie:** Better than being free to be Dutch-booked.

  **Alex:** Then we're stuck. You think rationality is about maintaining agency over time, even if it means violating local preference satisfaction. I think rationality is about satisfying preferences at the point of choice, which forces the preferences themselves to be consistent.

  **Jamie:** Exactly. You want a static consistency of states. I want a dynamic consistency of action.

  **Alex:** And until you can explain why a plan has normative force over a current desire without just asserting it does, the money pump stands.

  **Jamie:** And until you can explain why an agent who loses money for no reason is "rational" just because they followed a local impulse at every step, the resolute chooser stands.

  **Alex:** So you admit the preferences are cyclic.

  **Jamie:** I admit the *rankings* are cyclic. I deny that entails irrationality.

  **Alex:** Then you deny the principle of transitivity.

  **Jamie:** I deny it applies to *choices*, not just *rankings*.

  **Alex:** [Pauses] Fine. But if you ever actually get pumped, don't come crying to me.

  **Jamie:** If I get pumped, I wasn't resolute.

  **Alex:** And if you're resolute, you're not maximizing.

  **Jamie:** I'm maximizing *me*. Not the time-slice.

  **Alex:** We're going to need a drink.

  **Jamie:** Make it two. I prefer beer to wine, wine to cocktails, and cocktails to beer.

  **Alex:** Don't start.
