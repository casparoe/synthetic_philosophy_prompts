  2.  **Deconstruct the Friend's Argument (Causal Decision Theory / Myopic Rationality):**
      *   *Premise:* Rationality is maximizing utility *at the moment of decision*.
      *   *Situation:* User is home, safe. Guide has no leverage. Money is gone if paid. Money is kept if not paid. No future consequence *for this specific transaction*.
      *   *Conclusion:* Keeping the money maximizes immediate utility. Paying is "burning money."
      *   *Label:* This is classic Causal Decision Theory (CDT) applied myopically to the *ex-post* state.

  3.  **Deconstruct the User's Intuition (Timeless / Updateless / Functional Decision Theory):**
      *   *Premise:* Rationality involves acting according to a *policy* or *algorithm* that yields the best outcomes across all instances, not just the current one.
      *   *Situation:* The decision to pay wasn't made *at home*; it was made *on the mountain* (implicitly). The "self" at home is executing the commitment made by the "self" on the mountain.
      *   *Conclusion:* If you are the kind of person who reneges when leverage disappears, you won't get help in the future (or in counterfactual versions of this scenario).
      *   *Label:* This aligns with Timeless Decision Theory (TDT), Functional Decision Theory (FDT), or simply "Precommitment/Reputation" arguments in Iterated Game Theory.

  4.  **Identify Key Rationalist Concepts:**
      *   **Precommitment:** Binding your future self to a course of action to make a deal viable in the present.
      *   **Reputation/Credentialing:** You are building a track record, even if private.
      *   **Counterfactual Reasoning:** What if *everyone* acted like your friend suggests? The market for private rescue would vanish.
      *   **Self-Concept/Identity:** "I am a person who keeps promises." Violating this causes internal disutility (guilt, identity crisis).
      *   **The "Parfit's Hitchhiker" Problem:** This is the *exact* philosophical thought experiment this scenario mirrors.
          *   *Scenario:* Driver offers ride from desert only if passenger promises to pay later. Passenger wants to say "yes" but then not pay once in town. Driver predicts this and leaves passenger.
          *   *Solution:* You must be the kind of person who pays even when you don't have to.

