          *   Explain the Friend's view (Causal Decision Theory - CDT). It looks at the causal impact of the *current* action.
          *   Explain the User's view (Timeless/Functional Decision Theory - TDT/FDT). It looks at the output of the *decision algorithm*.
      *   **Why the Friend is Wrong (Technically):**
          *   Rationality isn't just about the *now*; it's about the *policy*.
          *   If you reason "I won't pay once safe," the guide (who is good at reading people) predicts this *on the mountain* and leaves you there.
          *   Therefore, the rational move *on the mountain* was to commit, and the rational move *at home* is to follow through to maintain the integrity of that commitment mechanism.
      *   **The "Black Box" of Self:** You can't trick yourself. If you plan to renege, you might signal that subtly.
      *   **Reputation (Even Private):** The guide mentioned being stiffed before. He talks. The community is small.
      *   **Internal Utility:** Disutility of breaking self-trust.
      *   **Actionable Advice:** How to handle this in the future? (Precommitment devices, signaling, understanding the type of person you are).

  6.  **Refining the Tone:**
      *   Use the idiom (expected utility, decision theory, counterfactuals, precommitment).
      *   Be empathetic but analytical.
