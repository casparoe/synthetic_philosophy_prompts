answer: |-
  Good evening. For those who don't know me, I'm the brother of the bride. I'm also a novelist. Apparently, in this family, that means I'm the designated wordsmith. I was told this would be easy. "You write for a living," they said. "Just write something nice."

  But then I looked at the guest list. Half the room is my sister's philosophy department. The other half is her future in-laws and my Gran. And standing between them is the groom, a trauma surgeon who, I am told, has spent the last three years asking my sister for "clinical data" to support her emotional claims.

  So, I have a specific challenge. I need to say something about love that satisfies Wittgenstein scholars without putting my Gran to sleep, while acknowledging that [Groom's Name] literally saves lives by demanding proof.

  If I get this wrong, the philosophers will boo, the surgeon will ask for a second opinion, and Gran will just wonder why we're talking about doors.

  Here goes.

  My sister's career is built on Ludwig Wittgenstein's *On Certainty*. Specifically, the idea of "hinge propositions." Now, for the non-philosophers—and Gran, this is for you—imagine a heavy wooden door. To check if the door works, you open it. You don't stop to test the metal pins in the hinge every time you walk through. If you tried to prove the hinge was real every morning, you'd never get into the kitchen. The hinge isn't something you *know*; it's something you *rely on* so that knowing anything else is possible.

  My sister argues that some things aren't hypotheses to be tested. They are the framework that allows testing to happen.

  And this, naturally, is where she met her match in [Groom]. Because [Groom] is a man who lives in the realm of the testable. Blood pressure, white cell counts, X-rays. If he can't measure it, he won't bet on it. It's a good thing. I want him operating on me. I want him demanding evidence.

  But for the last few years, their relationship has been a gentle collision between these two worldviews. [Groom] asks for evidence of their future. My sister tells him that a future isn't a diagnosis; it's a hinge.

  There's a risk here. It's easy to hear "hinge proposition" and think, "Oh, so love is blind. Just ignore the red flags. Don't look for proof."

  But that's not what Wittgenstein said, and it's not what my sister believes. And it's certainly not what this marriage is.

  A hinge doesn't mean the door is magic. It means the door is *functional*.

  [Groom], you spend your life looking for evidence. But in a marriage, the evidence doesn't come *before* the commitment. It comes *after*. You don't find proof that a marriage will work, and then get married. You get married, and that act creates the stable ground where a life can be built, measured, and lived.

  The commitment isn't the conclusion of the argument. It's the premise.

  I know the philosophers in the back are nodding. But I also know my Gran is wondering when we're going to talk about actual love.

  Gran, you've been married for fifty years. You didn't get there by peer-reviewing Granddad every morning. You got there because you agreed on the things that didn't need arguing about. You agreed that the family comes first. You agreed that the door stays locked at night. You agreed to stop checking the hinge so you could focus on walking through the door together.

  [Groom], my sister isn't asking you to stop being a doctor. She's asking you to recognize that there are different rooms in the house of human life. In the ER, doubt saves people. In a marriage, certainty saves people.

  If you treat your wife like a hypothesis, you will spend your life trying to falsify her. If you treat her like a hinge, you realize she is the thing that allows you to open the door to everything else.

  And for the record, [Groom], I have reviewed the data. I've watched you two together. I've seen the way you look at her when she's explaining a concept you don't understand, and you don't interrupt, you just listen. I've seen the way she checks your hands when you come home from a shift, not for data, but for warmth.

  The evidence is there. But only because you stopped looking for it long enough to let it accumulate.

  So, to the bride and groom. May your doubts be reserved for the things that can be fixed. May your certainties be reserved for the things that hold the weight. And may you never try to run a peer review on the seating plan again—I saw you eyeing the name cards, [Sister's Name], and the Department Head is already nervous enough.

  To the hinge. To the door. And to the life you're about to walk into together.

  Cheers.
