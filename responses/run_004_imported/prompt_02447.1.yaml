  "I've been analyzing our loss using the Condorcet Jury Theorem, and I think I found the error in our methodology.

  See, people think Condorcet says 'crowds are wise.' It doesn't. It says 'crowds are amplifiers.' The math states that if everyone is independent and just 51% likely to be right, the group approaches 100% accuracy. But it has a dark twin: If the group is *worse* than a coin flip, the crowd approaches 100% *error*.

