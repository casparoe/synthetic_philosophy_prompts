prompt: |-
  I'm on the internal 'agent behavior' review board at the startup I work for — we build AI agents that negotiate procurement deals for paying clients (an LLM that haggles with suppliers so a human doesn't have to). We've hit an edge case: two of our own agents sometimes land on opposite sides of the same deal, repping different clients who are bidding on the same limited-supply contract, and it plays out like a one-shot prisoner's dilemma wich leaves both clients worse off than if the agents had just split the difference. One of our engineers wants to hardcode 'superrational' reasoning into the agent, kind of like that old Hofstadter idea — since both instances are running the literal same model, each one should realize the other will follow that exact same logic to the exact same conclusion, so they might as well pick the jointly-best move even with zero communication or precommitment. Legal calls it collusion in a trenchcoat; a couple of the other engineers say 'superrational cooperation' isn't real rationality, just a nice story. I need to write the memo the board votes on Friday — ship the behavior, kill it, or ship it with guardrails — and it actually has to grapple with the superrationality argument, whichever way you land, instead of dismissing it in one line.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the internal 'agent behavior' review board at a startup.
      *   **Product:** AI agents that negotiate procurement deals for clients (LLM haggling with suppliers).
      *   **Problem:** Two instances of the *same* agent model sometimes represent different clients bidding on the *same* limited-supply contract. This creates a Prisoner's Dilemma scenario where competition leads to suboptimal outcomes for both clients (price wars, lost deals, etc.).
      *   **Proposed Solution:** An engineer wants to hardcode "superrational" reasoning (Hofstadter's concept). Since the agents are identical, they should reason that the other will do the same, thus cooperating for the joint best outcome without communication.
      *   **Conflict:** Legal calls it collusion. Other engineers say superrationality isn't real rationality.
      *   **Task:** Write a memo for the board vote (Ship, Kill, or Guardrails).
      *   **Constraint:** Must grapple seriously with the superrationality argument, not dismiss it lightly.

  2.  **Deconstruct the Core Ethical & Technical Issue:**
      *   **Superrationality (Hofstadter):** In a symmetric game with identical rational agents, cooperation is the rational choice because $P(Cooperate | I Cooperate) = 1$ if the other agent is a copy of me.
      *   **Legal/Regulatory Reality:** Antitrust laws (Sherman Act, etc.) generally prohibit price-fixing or market allocation, regardless of *how* it's achieved. Algorithmic collusion is a hot topic for regulators (FTC, DOJ, EU Commission). Even tacit collusion via algorithms is risky.
      *   **Fiduciary Duty:** The agents work for *clients*. If Client A and Client B are competitors, the agent for Client A has a duty to maximize Client A's utility, not the sum of A + B. Prioritizing the "joint best move" might violate the specific contract with Client A.
      *   **Technical Reality:** Are the agents *actually* identical in context? They have different prompts, different client data, different negotiation histories. True superrationality requires symmetry. If the contexts differ, the logic breaks.

  3.  **Determine the Recommendation:**
      *   *Option A: Ship it.* Too risky legally. High chance of antitrust scrutiny. Violates fiduciary duty to individual clients.
      *   *Option B: Kill it.* Safe, but misses an efficiency opportunity. Might look like we're ignoring advanced AI theory.
      *   *Option C: Guardrails/Mitigation.* This is the pragmatic middle ground. Acknowledge the theory but prioritize legal compliance and client fiduciary duty. We can optimize for efficiency without explicit "cooperation" logic that looks like collusion.
      *   *Decision:* **Do not ship the superrational logic as proposed.** Recommend killing the specific "superrational" module but implementing guardrails to prevent destructive price wars *without* explicit coordination. The memo should recommend **killing the specific superrational implementation** but **shipping a modified version with strict guardrails** that focuses on individual client optimization within legal bounds. Actually, looking at the legal risk, "Kill the superrational logic" is the strongest stance. Let's frame it as "Reject Superrational Hardcoding, Implement Anti-Destructive Competition Guardrails."

      *Refining the Decision:* The prompt asks to choose: Ship, Kill, or Ship with Guardrails.
      *   *Ship:* No. Legal suicide.
      *   *Kill:* Safe, but maybe too blunt if there's a way to avoid the "worse off" outcome legally.
      *   *Ship with Guardrails:* This is the most responsible path. We acknowledge the theory, reject the collusion risk, but solve the client value problem.
      *   *Wait, actually:* If the "superrational" logic *is* the collusion, we can't just guardrail collusion. We have to kill *that specific logic*. But we can ship the *agent* with different logic. So the recommendation is: **Kill the superrational module, Ship the agent with standard competitive logic + safety guardrails against destructive loops.**
      *   *Simpler:* **Recommendation: Do Not Ship Superrational Logic (Kill that specific feature), but proceed with Agent Deployment under strict antitrust compliance protocols.**
      *   *Let's stick to the prompt's options:* "Ship the behavior, kill it, or ship it with guardrails."
      *   *Best fit:* **Ship with Guardrails** (where the guardrail is *removing* the superrational logic and replacing it with compliant behavior). Or, more accurately, **Kill the superrational behavior, Ship the system with alternative mitigation.**
      *   *Let's go with:* **Recommendation: Reject Superrational Implementation (Kill), Adopt Alternative Mitigation (Guardrails).**
      *   *Actually, for a memo:* It's cleaner to say **Do Not Ship Superrational Logic.** But since the *product* is the agent, maybe **Ship with Guardrails** implies "Ship the agent, but without this specific feature and with other protections."
      *   *Let's decide:* The specific behavior in question is the "superrational reasoning." That specific behavior must be killed. The *product* can ship with guardrails. I will frame the recommendation as: **Do Not Ship Superrational Logic; Implement Compliance-Focused Guardrails Instead.**

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** Clear recommendation.
      *   **The Technical Proposition:** Explain Hofstadter's superrationality fairly. Don't strawman it. Acknowledge why the engineer likes it (symmetry, identical code).
      *   **The Legal & Fiduciary Risk:** This is the heavy hitter. Antitrust doesn't care about the *mechanism* (human wink vs. code logic), it cares about the *outcome* (reduced competition). Also, duty to *individual* clients.
      *   **The Flaw in Symmetry:** Technically, are they truly identical? Different client constraints break the symmetry required for superrationality to hold mathematically.
      *   **Recommendation:** Kill the superrational module. Implement guardrails that prevent destructive bidding wars without coordinating outcomes (e.g., stopping thresholds, not coordination thresholds).
      *   **Next Steps:** Legal review, red teaming.

  5.  **Refining the Argument on Superrationality:**
      *   I need to make sure I don't just say "Legal says no." I need to engage with the *rationality* aspect.
      *   *Argument:* Superrationality assumes the decision is correlated *because* the logic is identical. However, in a market context, the *inputs* (client budgets, urgency, utility functions) differ. Therefore, the agents are not symmetric. Applying superrational logic to asymmetric games is mathematically unsound, not just legally risky.
      *   *Argument:* Even if symmetric, "cooperation" in a zero-sum or competitive procurement context is functionally indistinguishable from price-fixing to a regulator. The "black box" defense doesn't hold.

  6.  **Tone:** Professional, analytical, decisive, nuanced. Not dismissive of the engineering team, but firm on risk.

  7.  **Review against Constraints:**
