      *(Another thought)*: Leibniz's rejection of atomism. QM has discrete quanta. Leibniz might dislike the "quantum" part but accept the wave aspect (continuity). He was a calculus guy; he likes smooth functions. Everett is smooth; Collapse is not.

      *(Final check on Bohm)*: Bohm is explicitly non-local. Leibniz's letter to Clarke is definitive: "It is unreasonable to render God's ordinary operation miraculous." Action at a distance is miraculous. Bohm is out.

      *(Final check on Everett vs Theodicy)*: This is the crux. If God chooses the best, why actualize the "bad" branches? Response: The "best" is the set of laws. The branches are logical consequences. To suppress branches would require complex intervention (violating simplicity). This aligns with Yudkowsky's "laws are simple, outcomes are complex" argument.

