  *(Self-Correction during drafting)*: I need to be careful not to do the work for them, but to point out the weak spots. The "Frank vs. William Ramsey" thing is a potential embarrassment if published, so highlight that gently. The Dennett point is the most philosophically subtle part—Dennett is an instrumentalist, so he might say "It doesn't matter if it's *really* a bridge concept, if treating it as one works, it is one." The user needs to lean into the *observer-relativity* to make that work for skepticism.

