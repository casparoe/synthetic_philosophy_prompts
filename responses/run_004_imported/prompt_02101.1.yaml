answer: |-
  This is a fantastic find. Quoting Henry Sidgwick in a bar bet (or whatever kind of debate this was) is a serious power move. He was one of the most rigorous logical minds of the 19th century, so his take carries weight.

  Here is the breakdown of what Sidgwick is actually saying, and whether your "symmetry" argument holds water against your friend's falsifiability claim.

  ### 1. Decoding Sidgwick: Defeat or Needling?

  Sidgwick is doing something subtle here. He isn't admitting that psychical research is fraudulent, nor is he saying skepticism is wrong. He is identifying an **epistemological ceiling.**

  When he says, *"We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick,"* he means that science relies on testimony and observation. If you have controlled for every variable, checked the equipment, and ruled out error, the only variable left is the human being.

  The last line—*"But when he has nothing else left to allege he will allege that"*—is definitely **needling the skeptics**, but it's also a weary acknowledgment of reality.

  Sidgwick is pointing out that a determined skeptic possesses a "nuclear option" that is logically irrefutable but intellectually lazy: *accusing the witness of lying.* You cannot empirically prove you are telling the truth to someone who is committed to believing you are lying.

  So, to answer your question: He is not admitting his side is wrong. He is admitting that **persuasion has a limit.** He is warning his fellow researchers that they can do perfect science and *still* be dismissed, not because the data is bad, but because human testimony is inherently fallible in the eyes of a dogmatic critic.

  ### 2. Does Your "Gotcha" Hold Up?

  Your argument is that skepticism is just as unfalsifiable as belief because skeptics can always say "it was a trick" just as believers can say "the vibes were off."

  **You are right about the psychology, but your friend is right about the methodology.**

  Here is why the situation is less symmetric than it looks, though Sidgwick helps you carve out some important territory.

  #### Where You Win (The Symmetry of Dogmatism)
  Sidgwick backs you up on the idea that **belief systems protect themselves.** This is known in philosophy as the *Duhem-Quine thesis*. You can't test a hypothesis in isolation; you test it along with a bunch of background assumptions.
  *   **The Believer's Shield:** "The psychic failed because the skepticism blocked the energy." (Unfalsifiable)
  *   **The Skeptic's Shield:** "The psychic succeeded because the investigator was incompetent or complicit." (Hard to falsify)

  Sidgwick is acknowledging that the Skeptic's Shield is real. If a skeptic decides *a priori* that telepathy is impossible, no amount of evidence will change their mind because they will always attribute the evidence to error or fraud. In that sense, **dogmatic skepticism is indeed unfalsifiable.**

  #### Where Your Friend Wins (The Asymmetry of Burden)
  However, your friend's point about falsifiability usually refers to the **claim itself**, not the people arguing about it.
  *   **The Null Hypothesis:** In science, the default position is that the phenomenon *does not exist*. The burden of proof is on the claimant.
  *   **Predictive Power:** A skeptic's position ("This is a trick") makes specific predictions: *If we tighten controls, the phenomenon should disappear.* A believer's position ("The vibes were off") often predicts the opposite or makes no prediction at all.
  *   **Plausibility:** "The investigator was tricked" appeals to known human behaviors (lying, error, optical illusions). "The vibes were blocked by skepticism" appeals to a mechanism that has never been demonstrated outside of the claim itself.

  So, while a skeptic *can* make an unfalsifiable move (as Sidgwick notes), their general framework is built on falsifiable expectations (controls should stop the trick). The believer's framework often relies on mechanisms that retreat when tested.

  ### 3. The Verdict

  Sidgwick's quote validates your point that **human stubbornness is symmetric.** Both true believers and true skeptics can retreat into a fortress that evidence cannot penetrate.

  However, it doesn't fully vindicate paranormal claims as *scientific*. Sidgwick founded the Society for Psychical Research (SPR) specifically to apply scientific rigor to these claims because he knew that without it, the skeptic's "they are lying" allegation would always win. He wanted to remove the "trick" variable so that the only thing left was the truth.

  **How to close the loop with your friend:**
  Tell him Sidgwick agrees with him that skeptics can be dogmatic, but Sidgwick also spent his life trying to build tests rigorous enough to make the "they are lying" excuse untenable. The problem isn't that paranormal claims *can't* be tested (Sidgwick thought they could); the problem is that after 140 years of testing, the "trick" explanation has remained more robust than the "psychic" explanation.

  You win on the philosophy of human nature (both sides dig in); he wins on the history of science (one side has the evidence). Sidgwick is the bridge between you: he knew the skeptic's move was unfair, but he also knew it had to be overcome by better data, not just arguments.
