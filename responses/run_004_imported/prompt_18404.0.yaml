prompt: |-
  A friend and I spent most of a long car ride arguing about Newton's bucket, and neither of us walked away satisfied. She had just read the classic setup — a bucket of water hangs from a twisted rope and starts spinning; at first the water lags behind and stays flat even though it is moving quickly relative to the bucket, but once it catches up and co-rotates with the bucket, it climbs the sides into a concave shape — and she took this to more or less settle the substantivalism/relationism debate in favor of absolute space: since the concavity tracks the water's true rotation, and that rotation clearly isn't relative to the bucket (relative motion is greatest exactly when the surface is flat, and zero exactly when it's concave), the rotation has to be relative to space itself. I objected that this felt too fast. I have a vague memory from a philosophy of science course that what the bucket actually entitles you to is much thinner than full Newtonian absolute space — something about needing absolute acceleration but not absolute position or rest — but I couldn't reconstruct the argument well enough on the spot, and she still thinks I was just hand-waving to avoid conceding the point.

  Could you help me work out who was closer to right? I would like an explanation of (a) why the bucket, and the related globes thought experiment, are generally thought to license only something like a "neo-Newtonian" or Galilean spacetime structure — enough to make facts about rotation and acceleration absolute, but with no privileged state of rest — rather than the full space-as-container picture Newton himself believed in, and why that gap matters to a relationist trying to concede as little as possible; and (b) whether Mach's proposed fix, defining rotation relative to the bulk matter of the universe rather than to space itself, actually delivers a relational alternative or just relocates the same problem one level down, especially given that general relativity is usually said to only partly vindicate Mach's principle (something about frame-dragging supporting it and rotating-universe solutions complicating it, though I don't remember the details). If it helps sharpen the picture, feel free to bring in how a fully relational mechanics of the kind associated with Julian Barbour tries to reproduce the bucket's behavior without positing absolute space at all. Mostly I want enough of the technical detail to know whether her one-step argument to substantivalism actually goes through, or whether there is more room to maneuver than she thinks.
