          *   *Implication:* You cannot reduce Value (a constitutive property) to Reasons (a category that includes non-constitutive elements) without a filter. If the filter requires Value, the reduction is circular. If the filter relies on the OG/SG distinction, it collapses. Therefore, the reduction fails.

