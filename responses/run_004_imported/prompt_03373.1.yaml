answer: |-
  The Wrong Kind of Reasons (WKR) problem is widely treated as a technical hurdle for Fitting-Attitude (FA) analyses of value—a puzzle to be solved by refining the definition of a "reason." I argue that this diagnosis is mistaken. The WKR problem is not a bug in the FA framework; it is a feature of the normative landscape that reveals the reductive project to be fundamentally incoherent. The problem demonstrates that the concept of a "normative reason" is too broad and structurally ambiguous to bear the weight of analyzing evaluative properties. 

  Specifically, I will argue that the WKR problem has no principled solution because the leading strategy for solving it—the Object-Given/State-Given (OG/SG) distinction—collapses under scrutiny, and that this collapse is not accidental but inevitable. Furthermore, by examining the structurally identical problem in epistemology (Pascal's Wager vs. Evidentialism), we can see that this is a general feature of normative concepts: "reasons" bifurcate into constitutive (fittingness) and pragmatic (utility) varieties. Because FA analysis attempts to reduce a constitutive property (value) to a category of reasons that inherently includes pragmatic elements, it inevitably fails unless it smuggles in the very notion of value it seeks to analyze.

  ### The Collapse of the Object-Given/State-Given Distinction

  The most prominent attempt to solve the WKR problem is Derek Parfit's proposal to distinguish between *object-given* reasons (RKRs) and *state-given* reasons (WKRs). On this view, a reason is of the right kind only if it cites a property of the object of the attitude (e.g., the demon's cruelty makes him admirable), rather than a property of the state of holding the attitude (e.g., the consequence of avoiding torture).

  This distinction appears robust in the standard Demon Case. The threat of torture is a consequence of *having* the attitude, not a property of the demon. However, the distinction fails when we press on how we individuate the "object" of an attitude and the "content" of a reason. As Mark Schroeder and others have demonstrated, the boundary between object and state is porous.

  Consider a modified case: Suppose the demon is not threatening torture, but is instead offering a reward. He says, "If you admire me, I will give you a million dollars." Intuitively, this is still a WKR; the money does not make the demon admirable. But now consider how the reason is represented by the agent. The agent thinks, "I have reason to admire *the demon-who-will-reward-me*." Is "being the one who will reward me" a property of the object (the demon) or a property of the state (the admiration)? 

  If we define the object narrowly (the demon's intrinsic character), the reason is state-given. But why must we define the object narrowly? In many ordinary cases of value, extrinsic properties count. A souvenir is valuable because of its history (an extrinsic relation). A tool is valuable because of its utility (a consequence of using it). If extrinsic, consequential properties can ground RKRs in some cases (utility), why can't they in others (rewards)? 

  The FA theorist must draw a line, but they cannot do so without appealing to the notion of *value* or *fittingness* they are trying to analyze. To say "properties of the object count only if they make the object *admirable*" is circular. To say "properties count only if they are relevant to the *standard of admiration*" presupposes a standard of value independent of reasons. 

  Schroeder's deeper critique is that state-given reasons can almost always be re-described as object-given reasons by expanding the content of the attitude. If I admire the demon *in order to* save lives, my object of admiration is effectively "the demon-as-means-to-saving-lives." If the FA analysis allows the object of the attitude to be complex or relational, the WKR transforms into an RKR. To block this, the FA theorist must restrict the "object" to non-normative, intrinsic properties. But this is ad hoc. Why should value analysis be restricted to intrinsic properties when we routinely value things for their extrinsic relations (e.g., a sacred relic, a beloved heirloom)? 

  Thus, the OG/SG distinction fails because it cannot be drawn without either collapsing into triviality (allowing WKRs) or circularity (presupposing value to filter reasons).

  ### The Epistemic Parallel and the Bifurcation of Reasons

  The depth of this failure is illuminated by the parallel problem in epistemology. Evidentialists face the "Pragmatic Encroachment" or "Pascal's Wager" problem: Prudential benefits (eternal salvation) give me a reason to *want* to believe in God, but they do not give me a reason to *believe* in God in the epistemic sense. 

  Evidentialists solve this by biting the bullet: they deny that pragmatic considerations are reasons for *belief* at all. They posit a bifurcation in the concept of a reason. There are *epistemic reasons* (truth-directed) and *pragmatic reasons* (utility-directed). Only the former justify belief. 

  The FA theorist attempts a similar move: only RKRs constitute value. However, the epistemic case highlights why this move destroys the FA reductive project. 

  1.  **The Autonomy of the Standard:** In epistemology, the distinction works because we have an independent grasp of the aim of belief (truth). We know what counts as evidence because we know what belief is *for*. 
  2.  **The Circularity Trap for FA:** In value theory, the FA theorist claims value is *constituted* by reasons. They cannot appeal to an independent standard of "value" to filter the reasons, because that is what they are trying to define. If they say "RKRs are reasons that track the *value* of the object," the analysis is circular: Value = Reasons to have attitudes toward valuable objects. 
  3.  **The Generality of the Problem:** The fact that the WKR problem arises identically in epistemology (truth vs. utility) and ethics (admirability vs. utility) suggests that "normative reason" is a genus with two irreducible species: *constitutive reasons* (fittingness/evidence) and *pragmatic reasons* (benefits/consequences). 

  The FA project attempts to reduce a substantive normative property (Value/Admirability) to a formal normative relation (Reasons). But because the category of "Reasons" inherently includes both constitutive and pragmatic varieties, the reduction fails. You cannot reduce "truth-conducive" to "reasons for belief" without excluding pragmatic reasons, and you cannot exclude pragmatic reasons without already possessing the concept of "truth-conducive." Similarly, you cannot reduce "admirable" to "reasons to admire" without excluding pragmatic reasons, and you cannot exclude pragmatic reasons without already possessing the concept of "admirable."

  ### Why "Voluntarism" Patches Fail

  A secondary strategy suggests that threats give us reason to *want* to admire, not to *admire*. This relies on the claim that we cannot admire at will. However, this is a contingent psychological claim, not a principled normative one. 

  First, even if direct voluntarism is false, the normative force of the threat remains. The demon's threat creates a normative pressure. If FA analysis is supposed to capture the *normative* landscape of value, excluding reasons that exert genuine normative pressure (even if psychologically ineffective) seems like moving the goalposts. 

  Second, in cases where direct control *is* possible (e.g., deciding to focus attention, or in cases of "belief at will" which some argue are possible in limited contexts), the threat *would* provide a reason to have the attitude. If the analysis holds that Value = Reasons, and the threat provides a reason, then the threat makes the demon valuable. The FA theorist must say that even if I *could* admire at will to save the world, the demon would still not be admirable. This implies that the source of the "unadmirability" is not the lack of reasons, but something about the demon himself that is independent of the reasons. This admits that value is not exhausted by reasons.

  ### Conclusion: The Fatal Nature of the Problem

  The WKR problem is fatal to the FA project because it reveals that the concept of a "reason" is not granular enough to capture the concept of "value." 

  The OG/SG distinction fails because it cannot be formulated without circularity; it requires us to identify the right reasons by their relation to value, which presupposes the very property we are analyzing. The epistemic parallel confirms that this is not a local defect of value theory but a structural feature of normativity: reasons divide into those that constitute the correctness of an attitude (fittingness/evidence) and those that merely recommend it (pragmatics). 

  A reductive analysis must explain the target concept (Value) in terms of something more fundamental (Reasons). But if identifying the relevant subset of Reasons (RKRs) requires appealing to the target concept (Value/Fittingness), the reduction has not happened; it has merely been disguised. The WKR problem proves that "fittingness" is a primitive normative notion that cannot be passed off to "reasons" without remainder. Consequently, the buck-passing account cannot pass the buck. It must accept that evaluative properties are substantive and irreducible, or abandon the claim to provide an analysis altogether. The WKR problem is not a puzzle to be solved; it is a proof of impossibility for the reductive ambition of the FA framework.
