answer: |-
  The simulation hummed, a low-frequency thrum that Elara felt in her teeth more than her ears. On the main display, the spacetime manifold glowed—a lattice of pale blue geodesics curving around a central mass. It was beautiful. It was generally covariant. And it was broken.

  Elara leaned forward, her coffee long cold. She had isolated a vacuum region, a sphere of empty spacetime far from the source mass. In the code, it was just a set of coordinates where the stress-energy tensor vanished. $T_{\mu\nu} = 0$. A hole.

  She initiated the diffeomorphism.

  Mathematically, it was a smooth map, a function $h$ that dragged the points of the manifold. Outside the hole, $h$ was the identity; the lattice remained rigid, anchored to the distant stars. But inside the hole, the function breathed. It shifted the points. It took the metric field $g$ and transformed it to $h^*g$.

  On the screen, the lattice inside the sphere rippled. The curvature values at specific coordinates changed.

  Elara held her breath. This was the test. If general covariance held, both the original metric and the dragged metric were valid solutions to the field equations. They satisfied Einstein's equations equally well. They matched all boundary conditions outside the hole perfectly.

  But inside?

  She toggled the visualization to 'Particle Trace.' A test particle, massless, drifting through the vacuum. In Solution A, the particle passed through coordinate point $P$ at time $t$. In Solution B—the one she had just dragged—the particle passed through point $Q$ at time $t$.

  $P$ and $Q$ were distinct coordinates. Distinct locations in the grid.

  If the grid was real, Elara thought, feeling a cold prickle at the base of her neck, then the theory has just failed.

  If spacetime points were substantival—if they were independent *things*, like containers that existed even when empty—then Solution A and Solution B described physically distinct universes. In one, the particle is here. In the other, it is there. The math allowed both. The initial data outside the hole was identical. The laws of physics were identical.

  And yet, the future inside the hole was undetermined.

  It wasn't quantum uncertainty. This was classical gravity. This was the universe saying, *I have not decided where the particle goes, and neither have you.* Determinism, the bedrock of classical physics since Laplace, was leaking out of the hole.

  Elara sat back. The hum of the server seemed louder. This was the vertigo Einstein had felt in Zurich, a century ago. She could almost see him in the dim reflection of the monitor, pacing the study, terrified that his own equations demanded a return to magic. If the metric field didn't fix the points, what did? If the points existed on their own, the theory was indeterminate. If the theory was to be deterministic, the points could not exist.

  "It's a category error," she whispered to the empty lab.

  She stared at the glowing lattice. Her intuition screamed that point $P$ was a place. A location. A *substance*. You could put something there. It had an identity.

  But the math was screaming back. The math said $P$ and $Q$ were just labels.

  She opened a new terminal window. She began to type, stripping away the visualization. She stripped away the background grid. She focused only on the intersections. The point-coincidence.

  The particle doesn't exist at $P$. The particle exists *with* the field value. The reality isn't the coordinate; the reality is the coincidence of the particle's worldline with the curvature of the metric.

  In Solution A, the particle meets a specific curvature peak at an event $E$.
  In Solution B, the coordinate label changes, the metric value at that label changes, but the *coincidence* remains. The particle still meets the curvature peak. The physical event is invariant.

  Elara stopped typing. Her fingers hovered over the keys.

  The hole wasn't a place where physics broke down. It was a mirror. It showed her that she was trying to paste a substantivalist ontology onto a relationist geometry. She was treating the map as the territory. She was demanding that the longitude lines be made of steel, when they were only made of ink.

  If she deleted the grid from the simulation—if she rendered only the matter and the light, the coincidences of fields—the hole vanished. There was no indeterminism because there was no background for the particle to be "dragged" against. There was only the relationship between the particle and the field.

  The vertigo receded, replaced by a strange, hollow lightness. The universe was not a container filled with things. It was the things themselves, woven together.

  She looked at the screen, at the two diverging solutions. They looked different. They *were* different, mathematically. But physically? They were the same story told in two different languages.

  "Points aren't real," she said, the words settling into the silence. "Only meetings are."

  She reached out and deleted Solution B. Then she deleted the grid overlay. The screen went dark, save for the faint, glowing trace of the particle's path, curving through the void, unmoored from any background, defining its own location by where it touched the light.

  It was less stable than a container. It was more fragile than a stage. But it was determined.

  Elara saved the file. She named it *Point-Coincidence*. Then she turned off the monitor, leaving herself in the dark, trusting that the chair beneath her was real not because it occupied a point in space, but because it held her weight.
