      *   *Later View (1990, "Natural Selection and the Emergence of Mind"):* He retracted this. He admitted that if fitness is defined *independently* of survival (e.g., via physiological traits, ecological niche adaptation), then NS is testable. He conceded it *is* a scientific theory.
