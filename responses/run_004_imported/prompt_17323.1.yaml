answer: |-
  The room was small, white, and hummed with the low-frequency vibration of the ship's drive. In the center stood the Pedestal, and on it, the Indicator. It was a simple device: a single glass pane that would glow green if you were among the survivors who would wake on the new world, or red if you were among the sleepers who would not. It cost nothing to ask. No blood, no fee, no delay. You placed your hand on the sensor, and the future collapsed into a color.

  Elias stood before it, his palm hovering inches from the glass. Behind him, the line of crewmates waited. Some stepped up, touched the pane, and walked away with their shoulders slackened or squared, carrying the weight of a fixed tomorrow. Others, like him, stepped away without touching it.

  "You're leaving it open," said Mara, falling into step beside him as they walked back toward the habitation ring. She had touched the glass. He had seen the flash of red reflect in her eyes before she turned away.

  "I don't see the value in knowing," Elias said, though his heart hammered against his ribs. "If it's green, I become careless. If it's red, I become desperate. Either way, I'm not living the journey anymore. I'm just waiting for the end."

  Mara smiled, a thin, brittle expression. "Or maybe you're free. If I know I'm dying, I don't have to worry about safety protocols. I can spend my shifts in the arboretum. I can write. I can stop pretending I have a retirement to save for."

  "But you also stop hoping," Elias countered.

  "Hope is just uncertainty with a positive bias," she said. "I prefer certainty. It's cleaner."

  They spent the next forty years in the belly of the *Aethelgard*. It was a generation ship, though only the first generation would see the destination. The journey was long, fraught with micrometeoroid showers, drive fluctuations, and the slow erosion of social cohesion.

  Elias lived in a state of high-functioning anxiety. Because he did not know his outcome, he optimized for both. He trained rigorously in emergency repair, fearing he would need the skill to survive a catastrophe. He also recorded endless video logs for a family he might never meet, preparing for a death he might never suffer. He fell in love with a botanist named Kael, but he hesitated to commit fully, terrified that grief would be his only legacy. Every risk was calculated, every calorie counted. He was a machine of contingency planning. He was exhausted, perpetually braced for a blow that might never land, or for a salvation that might never come.

  Mara, meanwhile, became the ship's poet. Knowing her fate was sealed, she abandoned the rotation schedules. She spent cycles drifting in the observation deck, watching the stars streak by. She mediated conflicts not because she cared about the ship's long-term stability, but because she wanted the peace of the moment. She loved Kael fiercely and openly, knowing she would not be there to mourn him. She was serene, unburdened by the future. But there was a hollowness to her, a detachment. She watched the others struggle with their survival strategies like a ghost watching the living. She didn't fight when the drive failed in Year 12. She simply sat and watched Elias bleed from his palms as he welded the breach shut.

  "You're working too hard," she told him once, handing him a water pack. "If it's your time, the seal won't hold. If it isn't, you'll survive without the extra weld."

  "If it's my time, I want to know I did everything I could," Elias said, wiping grease from his forehead. "Ignorance forces me to be perfect. Knowledge lets you be lazy."

  "Knowledge lets me be present," she corrected.

  When the *Aethelgard* finally breached the atmosphere of the target planet, the wake-up sequence initiated. The cryo-pods hissed open. The air tasted of dust and alien flora.

  Elias woke. His lungs burned, but they worked. He stumbled out of the pod, his muscles atrophied but functional. He was among the green lights. He had survived.

  He looked around the bay. Many pods remained dark. He moved down the row, checking the faces of the sleepers. He found Mara three pods down. Her face was peaceful, unlined by the worry that had etched itself into Elias's skin during the voyage. He opened her logbook, which she had left on the console beside her pod.

  The pages were filled with sketches of the star-fields and transcriptions of music. There was no fear in the entries. No frantic calculations. She had described the journey as a "long sunset," beautiful and complete. She wrote of loving Kael without the shadow of loss, because for her, the loss was a fact, not a threat. She had lived her forty years in a state of grace, untroubled by the 'what if.'

  Elias looked down at his own hands. They were scarred from the repairs. His back ached from the tension he had carried for decades. He thought of the nights he had spent awake, running simulations of disaster, optimizing survival probabilities. He had survived. He was here. By every metric of utility, his strategy had worked. He had gathered evidence through action, maintained flexibility, and secured the outcome.

  But as he stood there, breathing the thin air of the new world, he remembered Mara's calmness. He remembered how she had watched the stars while he watched the gauges. She had experienced the journey as a life; he had experienced it as a problem to be solved.

  He walked to the airlock and looked out at the alien landscape. He was alive. He had a future. He could build, plant, and grow. But he also carried the weight of all the moments he had withheld from himself—the love he had tempered, the rest he had denied, the peace he had sacrificed on the altar of preparedness.

  He thought about the Pedestal back on the ship. If he had touched it, and seen green, would he have worked less hard and died in the breach? Or would he have worked less hard and loved Kael more deeply? If he had seen red, would he have spent his forty years in the arboretum with Mara, finding beauty in the finite, rather than sweating in the engine room to extend a life he was destined to lose?

  He couldn't know. That was the cruelty of it. The information was cost-free, but the price was paid in the living of it.

  Elias closed Mara's logbook. He placed it beside her pod. He turned back to the living crew, ready to begin the work of colonization. He was efficient. He was capable. He was alive.

  As he stepped onto the soil, he wondered if survival was the only metric that mattered. He wondered if Mara, in her quiet certainty, had somehow arrived before him, having already made peace with the end while he was still fighting the middle. He took a breath, the air cold in his lungs, and walked forward, unable to tell if he was the wise man who had secured a future, or the fool who had forgotten to live the present.
