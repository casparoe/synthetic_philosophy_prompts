  1.  **Analyze the User's Request:**
      *   **Topic:** Ranked-choice voting (RCV) ballot measures.
      *   **Specific Claim:** An election-law professor claims the Gibbard-Satterthwaite (G-S) theorem proves RCV systems are *uniquely* gameable and that plurality voting is better because of this.
