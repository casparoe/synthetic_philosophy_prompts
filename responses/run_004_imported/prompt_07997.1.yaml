answer: |-
  **MEGILLUS:** You speak of the soul as if it were a vessel that, once filled with wine, simply reveals the quality of its contents. But I tell you, Guest, when you pour a strong draft into a man, you do not merely uncover what is there; you alter the vessel itself. If I strike a lyre with a hammer, the sound it makes is not a testament to the tuning of the strings, but to the violence of the blow. So too with this drug. When a man's reason is clouded by the grape, is it his character speaking, or is it the fever of the blood? You claim this is a test of *sōphrosynē*. I say it is a test of physiology. A man may be virtuous in his mind yet weak in his head; another may be wicked but possess a constitution that resists the vapor. How can you legislate based on a sign that is so entangled with the body's accidents?

  **ATHENIAN:** You mistake the purpose of the blow, Megillus. We do not strike the lyre to hear the wood, but to see if the string holds. You say the wine alters the man. I say sobriety is the greater alterer. In the daily market, in the assembly, a man wears a mask crafted by shame, by law, by the fear of his neighbors. He is sober, yes, but he is also acting. When the wine warms him, the chorus of these external masters falls silent. If he then shouts obscenities or strikes a servant, do you say, "This is the wine, not the man"? I say it is the man without his armor. If the armor is necessary for him to be good, then he is not good; he is merely armed. We wish to know if the citizen can remain himself when the armor is removed.

  **MEGILLUS:** But if the armor is removed, he is vulnerable. And you propose to make this vulnerability a public institution. This brings me to the second knot in your net. You weave a splendid tapestry of safeguards: officers of Dionysus, age limits, sober overseers. You say the elder must remain sober while the younger drinks. But these elders are not gods. They are Cretans and Spartans and Athenians, subject to the same friendships, the same ambitions, the same weariness as the rest. If the law relies on the overseer remaining untouched by the revelry he supervises, you have built a house where the roof is held up by the very walls it is meant to protect. What happens when the overseer grows fond of the drinker? What happens when the overseer himself desires to taste the medicine he prescribes? Your law assumes a level of vigilance that human nature rarely sustains without a tyrant's whip.

  **ATHENIAN:** You assume the overseer is a jailer, Megillus, when he is meant to be a physician. You speak of Sparta, where the law is a tyrant's whip, and the citizen obeys because he fears the pain of disobedience. I am trying to teach him to obey because he loves the harmony of the law. Yes, the overseer is fallible. That is why the law does not trust him alone; it trusts the hierarchy, the shame of the age groups, the public eye. But consider your alternative. You ban the wine. You remove the test. Now, tell me: when your Spartan faces a bribe in the dark, or a pleasure that carries no pain, how does he resist? He has never practiced resistance against the soft enemy, only the hard one. You fear the overseer might fail. I fear the citizen who has never been tempted. Which failure is more costly to the city? The drunkard who is shamed and corrected, or the sober man who secretly robs the treasury because he never learned to master his desire, only to suppress it?

  **MEGILLUS:** I do not deny that pleasure is a battlefield. But a general does not train his recruits by sending them into the enemy camp without weapons. He trains them in the drill field. You propose to train them in the brothel and call it a drill field. You say the overseer is a physician. But a physician who gives poison to test the constitution risks killing the patient. If your "Officers of Dionysus" falter—and they are men, as you admit—then the drinking party ceases to be a school and becomes a school for tyranny. The bold drinker will flatter the sober elder, and the elder will grant him license. Now you have not tested virtue; you have corrupted the law itself. In Sparta, we remove the temptation. It is blunt, yes. But a wall that is never tested by a siege does not need repair. Your wall is designed to be shaken, so that you may patch the cracks. Why not build a wall that stands firm without the shaking?

  **ATHENIAN:** Because a wall that is never shaken becomes brittle. You speak of the drill field. But can you simulate the chaos of battle in the drill field? You can march in step, yes. But can you march in step when your blood is hot and your fear is high? Wine provides the chaos of the soul in a controlled environment. It is not the enemy camp, it is a simulation. As for your fear of corruption between elder and youth: this is why the law must be sung, not just spoken. The education must begin before the first cup is poured. If the citizen has not been trained by music and gymnastic to love the noble and hate the base before he reaches the age of wine, then no law will save him, sober or drunk. The drinking party is not the *source* of virtue, Megillus. It is the final examination. You worry about the safety of the exam. I worry that you are graduating students who have never faced the question.

  **MEGILLUS:** And I worry that you are administering the exam with a pen that writes in disappearing ink. You say it is a simulation. But the shame of drunkenness is real. The broken vessel is real. If a man fails your test, he is shamed. But if the test itself is viewed by the city as dangerous—as I view it—then the shame attaches not to the failure, but to the law that permitted the danger. You want the citizen to feel that moderation is a harmony. But if the law must surround this harmony with so many guards, so many age restrictions, so many officers, does it not signal that the harmony is unnatural? Nature does not require such elaborate fencing. If wine were truly a medicine for the soul, would it need the dosage of a poison?

  **ATHENIAN:** Precisely because it is a poison that becomes a medicine only in the right hands. Iron cuts the flesh, yet the surgeon uses it to heal. Do you blame the surgeon because the iron is sharp? You say the elaborate fencing signals the harmony is unnatural. I say it signals that the city is a garden, not a wilderness. In the wilderness, your Spartan bramble grows thick and hard, and nothing else can live near it. In the garden, we prune. We train the vine. Yes, the vine needs a trellis. Yes, the trellis might rot. But without the trellis, the vine creeps on the ground and rots itself. You want to remove the wine to save the character. I want to regulate the wine to save the city from the rigidity that makes it incapable of bending when the storm comes. A city that cannot drink together cannot deliberate together, for they will only know how to command, not how to listen.

  **MEGILLUS:** We listen well enough when the law speaks.

  **ATHENIAN:** But the law is silent when the pleasure speaks. That is the moment I wish to illuminate.

  **MEGILLUS:** And I say that if you light a torch in a house of straw to find the cracks, you should not be surprised when the house burns. You trust too much in the wisdom of the elders, and too little in the safety of the silence.

  **ATHENIAN:** And you trust too much in the silence, and too little in the wisdom that comes from surviving the fire.

  *(Clinias, who has been listening quietly, shifts his weight, but neither man turns to him. The path ahead divides, one way toward the steep, rocky ridge the Spartan favors, the other down into the valley where the Athenian points.)*

  **MEGILLUS:** Then we walk on, Guest. But I will keep my hand on my sword, and you keep your hand on your cup.

  **ATHENIAN:** Agreed. Though I hope, by the time we reach the end of the road, you will see that the cup, when held steady, is the heavier burden of the two.
