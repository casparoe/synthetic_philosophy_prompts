answer: |-
  Here is the verdict: **You are right on the principle, but Elena is right on the mechanics.**

  However, since the core of your argument is about whether the group is justified in treating Jamie as if she has wronged them, **you win the argument.** Elena has identified a real psychological phenomenon, but she is drawing the wrong moral conclusion from it.

  Here is the breakdown of why, without the fluff.

  ### 1. The Moral Principle (Your Win)
  You are correct that kindness is **supererogatory**. In ethics, this refers to actions that are good to do but not wrong to omit. Jamie's past behavior falls squarely into this category. She built a "relational surplus" through years of over-giving.

  The moment that surplus is treated as a baseline expectation rather than a gift, the dynamic shifts from friendship to transaction. The group's coldness and sniping confirm that they have unconsciously converted Jamie's generosity into a wage they feel entitled to. When an employee quits a job, they owe two weeks' notice; when a friend stops being a caretaker, they owe nothing but basic civility. To argue otherwise is to argue that Jamie is not a full person with autonomy, but a function within the group's ecosystem. On the question of *obligation to continue*, there is none.

  ### 2. The Social Mechanics (Elena's Win)
  Elena is not crazy for feeling that something real has been lost. She is correctly identifying **Relational Infrastructure.**

  When one person consistently absorbs the cognitive load for a group (planning, remembering, checking in), the rest of the group atrophies in those areas. They stop building those muscles because Jamie is doing the work. This is basic systems theory: when a central node handles all the traffic, the peripheral nodes stop routing.

  When Jamie pulled back, she didn't just stop doing tasks; she collapsed the infrastructure the group had come to rely on. The pain the group feels is real. It is the pain of suddenly having to do work they had outsourced. Elena is right that "restructuring choices around reliability" creates a dependency.

  ### 3. The Crucial Distinction: Impact vs. Wrongdoing
  This is where Elena's argument falls apart and yours holds up.

  Elena is conflating **impact** with **fault**.
  *   **Impact:** Jamie's withdrawal causes disruption, inconvenience, and emotional loss for the group. (Elena is right).
  *   **Fault:** Jamie is morally responsible for that disruption. (Elena is wrong).

  Just because your actions hurt someone doesn't mean you've wronged them. If I move to a different city, my friends will be sad and our dynamic will break. I have caused them pain, but I have not violated an obligation.

  The group (and Elena, by extension) is treating Jamie's burnout like a breach of contract. It is not. It is a boundary correction. The "obligation" Elena senses is actually just **grief** masquerading as **debt**. They feel owed because they are grieving the loss of the convenience Jamie provided.

  ### 4. The Only Real Obligation (The Nuance)
  There is *one* narrow sense in which Elena is right about an obligation, but it isn't an obligation to *perform*. It is an obligation of **transition.**

  If you drive someone to work every day for five years and then stop showing up without a word, you haven't violated a contract, but you have acted negligently regarding the dependency you created. You created a vulnerability, and you have a minor duty to mitigate the harm of removing your support.

  This doesn't mean Jamie owes them birthdays or soup. It means she owes them the clarity that the "old normal" is gone so they can rebuild their own infrastructure. However, even this is a courtesy, not a debt. And critically, **it does not justify the group's coldness.** Even if Jamie vanished overnight without a word, the group's reaction should be concern for her well-being (since such a drastic change usually signals a crisis), not punishment for her absence.

  ### The Final Take
  **You have the better argument.**

  Elena's point explains *why* the group is upset (loss of infrastructure/dependency), but it does not justify *that* they are upset (entitlement/guilt-tripping).

  Jamie is not "letting people down." She is stepping out of a role she was never hired for. The group is experiencing withdrawal from the benefits she provided, and they are punishing her for it. That is entitlement, plain and simple. You are right to defend her: Generosity should never mortgage the future. If being kind today means you're trapped forever, then kindness becomes a punishment.
