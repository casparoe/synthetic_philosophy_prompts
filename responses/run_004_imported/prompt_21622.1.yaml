answer: |-
  This is a fantastic setup for a response paper. You have correctly identified the core tension: Lewis defends a Humean mosaic where laws supervene on particular facts, while Armstrong defends a Non-Humean view where laws (as relations between universals) constrain particular facts.

  You are also right that the debate often feels like two people shouting past each other about what counts as a "brute fact." To help you structure your argument, let's break down whether these objections are mirror images, and then evaluate which position holds up better under scrutiny.

  ### 1. Are the Objections Mirror Images?

  The short answer is **no, they are not strict mirror images**, though they share a similar *structure* of critique (accusing the other of positing an unintelligible primitive). They differ in *what* they demand metaphysics to do.

  **Lewis's Objection to Armstrong (The Inference Problem)**
  *   **The Charge:** Intelligibility.
  *   **The Argument:** Lewis (channeling van Fraassen here) asks: What is the relation $N$? If $N(F,G)$ holds, why *must* all $F$s be $G$s? If you say "because that's what $N$ is," you are merely naming the problem, not solving it. If $N$ is a primitive, it seems "magical" that a relation between abstract universals forces concrete particulars to behave a certain way.
  *   **The Gap:** The gap is between the **modal force** of the law and the **actual distribution** of properties. Lewis argues Armstrong cannot bridge this gap without circularity or mystery.

  **Armstrong's Objection to Lewis (The Explanation/Circularity Problem)**
  *   **The Charge:** Explanatory Direction.
  *   **The Argument:** For Lewis, the Law ($L$) is a summary of the Instances ($I$). So, $L$ supervenes on $I$. But in science, we say $L$ explains $I$. Armstrong argues you cannot explain the base ($I$) by appealing to something that is constituted by the base ($L$). It's like saying "The average height of the class explains why John is this tall."
  *   **The Gap:** The gap is between **ontological dependence** and **explanatory priority**. Armstrong insists laws must be ontologically prior to instances to explain them. Lewis denies this priority is necessary.

  **Why they aren't mirrors:**
  Lewis's objection says Armstrong's theory is *metaphysically obscure* (we can't understand how $N$ works). Armstrong's objection says Lewis's theory is *explanatorily bankrupt* (it gets the direction of fit wrong).
  *   Lewis is willing to accept brute facts about the mosaic (it just *is* that electrons repel).
  *   Armstrong is willing to accept brute facts about necessitation (it just *is* that Repulsion necessitates Separation).

  So, while both accuse the other of having a "brute primitive," Lewis thinks his brute primitive (the mosaic) is observable and parsimonious, whereas Armstrong's brute primitive ($N$) is occult. Armstrong thinks his brute primitive ($N$) is necessary for science to make sense, whereas Lewis's "law" is just a convenient fiction.

  ### 2. The "Natural Properties" Skirmish

  You mentioned Armstrong's comeback regarding Lewis's "perfectly natural properties." This is a crucial point for your paper.

  *   **Lewis's Need:** To make the "Best System" analysis work, Lewis needs to restrict the predicates we can use in our systems. Otherwise, a gerrymandered system (e.g., "Grue-bleen" logic) could be simpler than Newtonian physics. He posits "perfectly natural properties" to ground this simplicity.
  *   **The Objection:** Anti-Humeans argue this is hypocritical. Lewis claims to be a sparse ontologist rejecting "necessary connections," but then he posits a special, metaphysically privileged class of properties that carve nature at the joints. Isn't *that* a non-Humean, modal-heavy commitment?
  *   **Lewis's Defense:** In "New Work," Lewis argues that *everyone* needs natural properties. Armstrong needs Universals to be the relata of $N$. If Universals aren't "natural" (i.e., if they don't resemble each other objectively), the theory fails. So, Lewis argues, the cost of natural properties is the price of admission for *any* metaphysics, not a special tax on Humeanism.

  **Verdict on this point:** This is generally a draw. Lewis successfully argues that Armstrong cannot do without an ontology of properties/universals either. The debate shifts to whether those properties carry modal weight (Armstrong) or are just categorical bases (Lewis).

  ### 3. Which Theory Comes Out in Better Shape?

  If I had to place a bet on which theory survives the objections better, **I would side with Lewis (with caveats).** Here is the reasoning you can adapt for your paper:

  **Why Armstrong Loses Ground (The Inference Problem is Fatal)**
  The Inference Problem is arguably the hardest hurdle for Non-Humeanism. Armstrong tries to solve it by saying $N(F,G)$ *is* a relation of necessitation. But as Lewis points out, necessitation is a modal notion. If you analyze laws using modal notions, you haven't reduced modality; you've just pushed it back a step.
  *   If $N$ is contingent (as Armstrong admits, laws could have been different), then $N(F,G)$ could hold and yet an $F$ might not be $G$. To prevent this, Armstrong needs a further law connecting $N$ to the regularity. This leads to a regress.
  *   Lewis's critique exposes that Armstrong wants the *benefits* of necessity (explanation, prediction) without paying the cost (modal realism or essentialism).

  **Why Lewis Survives (Redefining Explanation)**
  Lewis's main vulnerability is the claim that laws don't explain instances. However, contemporary Humeans (like Barry Loewer or Jonathan Cohen) have refined Lewis's view to handle this.
  *   They distinguish between **metaphysical explanation** (grounding) and **scientific explanation** (systematization).
  *   Lewis can admit: "Yes, the law is a summary of the instances (metaphysically). But the law explains the instances scientifically because it integrates them into a coherent system that supports counterfactuals."
  *   This allows Lewis to keep his ontology sparse (no magical $N$) while granting that science *talks* as if laws govern. He treats "governing" as a useful pragmatic stance, not a metaphysical reality.

  **The Cost Lewis Pays:**
  Lewis has to accept that the ultimate structure of the universe is brute. There is no "reason" why the mosaic is this way rather than that way. For some, this is a feature (honesty); for others, a bug (intellectual dissatisfaction).

  ### 4. Strategy for Your Response Paper

  Since this is a seminar paper, you don't necessarily need to declare a winner, but you do need to take a stance on the *nature* of the disagreement. Here is a suggested roadmap:

  1.  **Thesis:** Argue that while the objections look symmetrical (both accuse the other of brute primitives), they are asymmetrical in force. Lewis's objection undermines the *coherence* of Armstrong's central posit ($N$), whereas Armstrong's objection only undermines the *intuition* behind Lewis's view (which Lewis is willing to revise).
  2.  **Address the "Mirror" Question:** Explicitly argue that they are not mirrors. Lewis attacks intelligibility; Armstrong attacks explanatory direction.
  3.  **The "Natural Properties" Pivot:** Use this to show that Lewis is aware of the cost of primitives. He argues his primitives are less costly than Armstrong's because they don't carry modal weight.
  4.  **The Deciding Factor:** Focus on the **Inference Problem**. Argue that Armstrong's attempt to define $N$ without falling into circularity or regress is the weaker link. Lewis can bite the bullet on "brute mosaic" more easily than Armstrong can bite the bullet on "magical necessitation."
  5.  **Conclusion:** Conclude that Lewis's Humeanism is metaphysically safer, even if Armstrong's Non-Humeanism feels more satisfying to our scientific intuitions. The job of metaphysics, you might argue, is to clarify what exists, not to validate every scientific intuition—and on that metric, Lewis's sparse ontology wins.

  **One nuance to keep in mind:**
  Make sure you check if your professor leans Humean or Anti-Humean! If they are a staunch Armstrongian, arguing for Lewis might require extra care to show you understand the appeal of necessitation. If they are a Lewisian, they might want you to press harder on the "Explanation" objection.

  **Suggested Reading for extra ammo:**
  *   **Barry Loewer, "Laws and Natural Properties"**: Defends Lewis against the explanation objection.
  *   **Bas van Fraassen, *Laws and Symmetry***: The source of the "Inference Problem" label (good for citation).
  *   **Helen Beebee, "The Non-Governing Conception of Laws"**: A strong defense of the Lewisian view that laws don't need to govern to be real.

  You have a solid grasp of the texts. If you can clearly distinguish between *metaphysical grounding* and *scientific explanation*, you'll have a very strong paper. Good luck!
