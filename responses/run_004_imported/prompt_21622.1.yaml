      *   *Case for Armstrong:* Intuition. Laws *feel* like they govern. Science seeks *why* regularities hold, not just *that* they hold. Lewis's view makes laws too contingent (could change if one electron changed its path).
      *   *Current Consensus (roughly):* Humeanism (Lewis) has seen a resurgence (Loewer, Cohen) by refining the notion of explanation (Metaphysical vs. Scientific). Non-Humeanism (Armstrong) struggles with the intelligibility of $N$. However, Armstrong's successors (Primitivism about laws) try to fix the Inference Problem by just accepting $N$ as primitive.
