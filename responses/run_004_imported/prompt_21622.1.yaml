      *   *Verdict:* They are *not* strict mirror images. They stem from different starting commitments (Humean Supervenience vs. Non-Humean Realism). Lewis is okay with bruteness about the mosaic; Armstrong is okay with bruteness about necessitation. The objections target the *cost* of that bruteness.

