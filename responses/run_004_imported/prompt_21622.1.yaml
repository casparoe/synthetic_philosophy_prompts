          *   Armstrong: Non-Humean, laws as relations of necessitation ($N(F,G)$) between universals, laws explain regularities.
          *   Lewis's Objection to Armstrong: The "Inference Problem" (van Fraassen's label, often associated with Lewis's critique). If $N(F,G)$ holds, why *must* all $F$s be $G$s? Is it just a brute fact?
          *   Armstrong's (and allies') Objection to Lewis: The "Explanation Problem" (circularity). If laws supervene on instances, they can't explain instances. Also, the "Natural Properties" objection (Lewis needs primitives anyway).
      *   **User's Specific Questions:**
          1.  Are these objections mirror images of the same underlying problem (both need an extra ingredient)?
          2.  Or are they different in kind?
          3.  Which theory comes out in better shape if we take the objections seriously?
      *   **Goal:** Provide a clear, philosophically rigorous, yet accessible analysis to help the user write their response paper.

  2.  **Deconstruct the Objections:**

      *   **Lewis vs. Armstrong (The Inference Problem):**
          *   *The Charge:* Armstrong posits $N(F,G)$. He claims this entails $\forall x (Fx \rightarrow Gx)$. Lewis asks: What is the nature of $N$? If it's just a primitive relation, why does its existence guarantee the regularity? If it *does* guarantee it, isn't $N$ just defined as "whatever makes the regularity hold"?
          *   *The Deeper Issue:* Intelligibility vs. Bruteness. Armstrong wants a robust connection, but Lewis argues it's unintelligible how a relation between *universals* constrains *particulars* without further facts.
          *   *Is it a "gap"?* Yes. The gap between the modal force of the law and the actual distribution of properties.

      *   **Armstrong vs. Lewis (The Explanation/Circularity Problem):**
          *   *The Charge:* For Lewis, laws supervene on the Humean Mosaic. The mosaic includes all the instances. So, the law is a summary of the instances. But we want laws to *explain* the instances. You can't explain $X$ by appealing to a summary that includes $X$.
