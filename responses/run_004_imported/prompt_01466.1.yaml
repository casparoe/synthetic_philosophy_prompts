  2.  **Analyze the Theoretical Conflict (Aumann vs. Stalnaker):**
      *   *The Core Issue:* Backward Induction (BI) relies on reasoning about what *would* happen if a player reached a node that *shouldn't* be reached if everyone were rational. This is a counterfactual.
      *   *Aumann (1995):* "Substantive Rationality." Rationality is a property of the *actual* world. If a node is reached that implies irrationality happened earlier, the model breaks or assumes the worst. Aumann argues CKR *does* imply BI. His logic: If I know you are rational, I know you won't reach a node where you'd act irrationally. If you *do* reach it, my knowledge was wrong, but the theorem assumes CKR holds. Essentially, "Rationality rules out the path."
      *   *Stalnaker (1996):* "Hypothetical Rationality." Rationality must hold even in counterfactual scenarios. If a node is reached (even if unlikely), we must still assume the player is rational *at that node*. Stalnaker argues CKR does *not* necessarily imply BI. His logic: "If you made a mistake earlier, I shouldn't assume you'll make another one now. I should update my belief about your type/strategy but still assume you act optimally *given* where we are."
      *   *Halpern (2001):* Clarifies that the difference lies in how counterfactuals are handled. Aumann treats rationality as a static constraint on the whole game tree. Stalnaker treats it as a dynamic property that persists even off-path.

