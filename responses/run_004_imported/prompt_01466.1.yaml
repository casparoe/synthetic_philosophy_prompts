      *   **Aumann vs. Stalnaker (The Pictures of Rationality):**
          *   *Aumann:* "The Pre-Commitment View." Rationality is a global constraint. If we share CKR, certain paths are impossible. If one happens, the common knowledge assumption is violated. Therefore, in a CKR world, the game ends early. It's rigid.
          *   *Stalnaker:* "The Adaptive View." Rationality is local and persistent. Even if we deviate from the script, we are still trying to maximize utility. If you pass the pot, maybe you have a different strategy, but you aren't stupid. I should re-evaluate *why* you passed, not assume you will crash the car at the next intersection.
