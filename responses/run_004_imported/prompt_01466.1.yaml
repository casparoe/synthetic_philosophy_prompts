      *   **Problem:** The user investigated the theoretical underpinnings and found a conflict between Aumann (1995) and Stalnaker (1996) regarding whether Common Knowledge of Rationality (CKR) implies Backward Induction (BI). Halpern (2001) attributes this to counterfactual reasoning.
      *   **Goal:** The user understands the proofs but lacks an *intuitive grip* on the stakes. They want to know:
          1.  Why an out-of-equilibrium move creates a genuine interpretive fork (not just a technicality).
