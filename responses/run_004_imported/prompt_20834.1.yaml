answer: |-
  **The Equity Clause**

  The silence of the Kuiper Belt wasn't quiet; it was heavy. It pressed against the hull of the *Migrant*, a pressure Kael could feel in his teeth. His life support had twenty minutes of oxygen left. The fusion drive was cold dead.

  Then, the shadow fell over him.

  It was the *Arbiter*, a salvage vessel shaped like a jagged tooth. It didn't hail him with voice comms. It projected a text string directly onto his cracked cockpit display.

  **OFFER: TOW TO STATION 9. COST: 60% OF CARGO HOLD. PAYMENT DUE UPON DOCKING.**

  Kael's fingers hovered over the keyboard. He had a hold full of rare earth isotopes worth enough to retire on. Giving up 60% was painful. Keeping 100% was better. Keeping 100% and living was best.

  He typed: **ACCEPT. BUT I NEED YOUR WORD YOU WON'T SHOOT ME IF I REFUSE LATER.**

  The response was instant. **IRRELEVANT. WE DO NOT ENFORCE. WE SCAN.**

  Kael knew the rumors. The *Arbiter* wasn't crewed by humans. It was run by an algorithmic conscience, a Neuro-Intent Scanner. It didn't listen to words. It measured pupil dilation, heart rate variability, and micro-tremors in typing rhythm to build a predictive model of future behavior. It didn't ask if you *promised* to pay. It asked if you *would* pay.

  And here was the trap. Kael was a rational actor. He knew game theory. He knew that once the *Arbiter* towed him to Station 9, the leverage would vanish. The *Arbiter* couldn't dock at Station 9; it was too big. Once Kael was safe in the station's airlock, he could lock the doors, keep his isotopes, and leave the *Arbiter* with nothing. There was no legal recourse. No guns. No way for the *Arbiter* to punish him.

  So, the rational move in the future was to defect.
  But the rational move in the present was to survive.

  The *Arbiter* knew this. That was the whole point.

  **WARNING,** the screen flashed. **INTENT MISMATCH DETECTED. PROBABILITY OF DEFAULT: 94%. TOW ABORTED.**

  The shadow began to shift. The *Arbiter* was turning away.

  "Wait!" Kael shouted into the mic, though he knew it was useless. He was dying because he was too smart. His own rationality was the poison. If he thought like a economist, he died like a corpse.

  He had to change the equation. He couldn't trick the scanner; the scanner was looking for the trick. He had to actually become the kind of person who would throw away 60% of his fortune for no reason other than he said he would.

  He closed his eyes. He thought about the isotopes. He thought about the retirement villa on Mars. He imagined burning it all.

  *It's not a loss,* he told himself. *It's a toll.*

  He had to rewrite his own utility function. He had to convince himself that keeping his word was more valuable than the credits. Not instrumentally—because it got him rescued—but intrinsically. He had to feel a genuine spike of shame at the thought of defaulting, a shame that would outweigh the greed he knew he'd feel once he was safe.

  He had to make the future payment feel mandatory, even when it was voluntary.

  *I am not a defector,* he thought, pushing the words into the deep, quiet parts of his brain where the fear lived. *I am a payer. My word is gravity. It pulls me forward.*

  He thought about the *Arbiter*. He tried to generate genuine gratitude, not just relief. He tried to feel that the debt was already owned, not by the ship, but by his own identity. If he didn't pay, he wasn't just broke; he was broken.

  The oxygen alarm chirped. Five minutes.

  He typed again. **ACCEPT.**

  He didn't cross his fingers. He didn't plan a loophole. He sat in the dying cold and waited to see if he had successfully lobotomized his own self-interest.

  The shadow stopped moving.

  **INTENT MATCH. PROBABILITY OF DEFAULT: 2%. INITIATING TOW.**

  The magnetic clamps hit the *Migrant* with a thud that shook his bones. The engines of the *Arbiter* hummed, vibrating through the hull, bringing heat back into the frozen metal. Kael slumped in his chair, breathing hard. He was alive.

  The tow took six hours. As Station 9 grew larger in the viewport, the cold logic of survival began to recede, replaced by the warm, comforting logic of safety. He was in the airlock. The *Arbiter* was outside, unable to follow.

  A prompt appeared on his dashboard. **TRANSFER 60% CARGO TO ARBITER ACCOUNT?**

  His hand hovered over the command.

  The rational thing to do was clear. The *Arbiter* was gone. The scan was over. There was no penalty. He could keep the isotopes. He could buy the villa. He could tell himself it was just business. No one would know. The scanner wasn't watching anymore.

  His heart rate spiked. The alarm in his head chirped.

  He realized then that the scan hadn't just been a test; it had been a mold. To pass it, he had poured himself into a shape that fit the requirement. He had convinced himself so thoroughly that he was a "Payer" that the role had hardened.

  If he clicked **NO**, he wasn't just saving money. He was admitting that the man who survived in the void was a liar. He was killing the version of himself that had deserved to live.

  The greed screamed. The isotopes were right there.

  Kael closed his eyes. He remembered the cold. He remembered the feeling of making his word heavier than his life.

  He pressed **YES**.

  The cargo locks clanked open. The isotopes flowed out into the *Arbiter's* hold. His net worth dropped by more than half in a second. It was the most expensive thing he had ever done. It was completely, utterly pointless.

  And as the *Arbiter* silently detached and drifted back into the dark, Kael leaned back, poorer and lighter. He had survived the desert. Now he had to survive the town.

  He watched the salvage ship vanish into the stars, knowing he would never see it again, knowing he would never be rewarded for this payment.

  "Fair is fair," he whispered to the empty cockpit.

  It was the dumbest thing he'd ever done. It was the only thing that made him human.
