prompt: |-
  I'm a PhD student in philosophy. My dissertation advisor, under whom I studied for the last four years, died three weeks ago, and I've been asked to deliver her eulogy. Her career was largely devoted to defending moral realism against evolutionary debunking arguments, and she was best known for a reply to Sharon Street's Darwinian Dilemma: rather than accept either horn of it -- that natural selection somehow tracked independent evaluative truths, or that our getting them right was a wild coincidence -- she argued for a third factor that explains both why creatures like us evolved certain moral attitudes and why those attitudes are correct. The memorial will seat metaethicists who spent decades arguing with her about exactly this next to family members who have never heard of Sharon Street. She once told me, half-joking, that she didn't want to be sent off with language that made her decency sound like a lucky side effect of selection pressure rather than something she had actually gotten right. Please write the eulogy: it should move the non-philosophers in the room, satisfy the specialists, and not concede, even for warmth's sake, the picture of moral psychology she spent her career resisting.
reasoning: |-
  Here's a thinking process that leads to the eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy (advisee of the deceased).
      *   **Deceased:** Dissertation advisor (4 years of mentorship), moral realist philosopher.
      *   **Key Philosophical Contribution:** Defended moral realism against evolutionary debunking arguments (specifically Sharon Street's Darwinian Dilemma). Proposed a "Third Factor" explanation (explains both evolution of moral attitudes *and* their correctness).
      *   **Audience:** Mixed. Metaethicists (specialists, debate partners) + Family/Friends (non-philosophers).
      *   **Tone/Constraint:** Must move non-philosophers, satisfy specialists, *and* not concede the philosophical view she fought against (i.e., cannot say her goodness was just an evolutionary accident/coincidence; must affirm her moral judgments were *true* and she tracked them).
      *   **Specific Anecdote:** She joked she didn't want her decency to sound like a "lucky side effect of selection pressure."

  2.  **Determine the Core Theme:**
      *   The bridge between her philosophy and her life.
      *   The "Third Factor" isn't just an academic argument; it's a way of living.
      *   The central tension: Evolutionary debunking says our morals are just survival tools. She said no, there's a truth we latch onto.
      *   The eulogy must embody her realism: Her kindness wasn't an accident; it was a *recognition* of the good.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the relationship (advisor/advisee), and the difficulty of the task. Address the mixed audience immediately.
      *   **The Philosophy (for the specialists):** Briefly explain the "Darwinian Dilemma" and her "Third Factor" without getting bogged down in jargon. Make it sound like a life stance, not just a paper.
          *   *Street's Dilemma:* Did evolution track truth (unlikely) or is it coincidence (uncomfortable)?
          *   *Her Solution:* A third thing explains both.
      *   **The Life (for the family):** Connect the philosophy to her character. She wasn't just arguing about truth; she *lived* as if truth existed.
      *   **The Constraint Check:** Ensure I don't say "she was kind because it helped the tribe." Instead, say "she was kind because kindness is *good*, and she saw it."
      *   **The Personal Touch:** Mention the 4 years of mentorship. The specific joke about selection pressure.
      *   **The Conclusion:** A final send-off that reaffirms her legacy. The truth remains, even if she is gone.

  4.  **Refining the Tone:**
      *   *Risk:* Too academic = alienates family.
      *   *Risk:* Too sentimental = betrays her philosophy (makes her goodness seem like mere emotion/biology).
      *   *Solution:* Use philosophical concepts as metaphors for human connection. "Tracking truth," "independent reasons," "realism."

  5.  **Drafting - Specific Phrasing Ideas:**
      *   *Instead of:* "She believed in objective morality."
      *   *Try:* "She believed that when we reach out to help someone, we aren't just following a script written in our genes; we are answering a call that comes from outside ourselves."
      *   *Addressing the Specialists:* Acknowledge the debates. "We argued over the mechanism, but we agreed on the stakes."
      *   *Addressing the Family:* "You knew her as a mother/friend. She knew that role as a moral obligation that was *real*."
      *   *The Joke:* Incorporate the "lucky side effect" line. It's perfect.

  6.  **Writing - Iteration 1 (Mental Outline):**
      Hello everyone. I was her student. She was smart. She fought Sharon Street. Street said morals are evolution. She said no, there's a third factor. This means her kindness wasn't an accident. It was real. She told me not to call her nice an accident. So I won't. She was right about morals, and she was right about life. We miss her.

      *Critique 1:* Too dry. Needs more emotion. Needs to weave the philosophy into the eulogy more naturally.

  7.  **Writing - Iteration 2 (Adding Flesh):**
      Start with the room. Specialists on one side, family on the other. She bridged things. Her big idea was the Third Factor. For the family, this means her love wasn't just biology. For the philosophers, this means the argument stands. She mentored me for four years. She was demanding but kind. She didn't want her decency reduced to selection pressure. So let's honor her by admitting she *saw* the good.

      *Critique 2:* Better. Now polish the language. Make it sound like a speech. Ensure the "Third Factor" is explained simply enough for grandma but accurately enough for a metaethicist.

  8.  **Final Polish (incorporating the prompt's constraints):**
      *   *Check:* Did I concede to debunking? No. I must assert her moral judgments were correct because they tracked independent truths.
      *   *Check:* Is it moving? Use the mentorship angle.
      *   *Check:* Is the joke included? Yes.

      *(Self-Correction during drafting)*: Be careful not to make the "Third Factor" sound theological unless she was a theist (prompt doesn't say). Keep it metaphysical/philosophical. "The nature of value itself."

      *Key phrase to develop:* "She didn't just argue for moral truth; she inhabited it."

  9.  **Final Review against constraints:**
      *   PhD student voice? Yes.
      *   Advisor deceased 3 weeks ago? Acknowledge grief.
      *   Sharon Street/Darwinian Dilemma mentioned? Yes.
      *   Third Factor explained? Yes.
      *   Family included? Yes.
      *   No concession to evolutionary debunking? Crucial. Her goodness must be portrayed as *correct*, not just *adaptive*.

  10. **Final Polish:** (Proceeds to generate output based on these thoughts.)
answer: |-
  Thank you all for being here.

  For those of you who know me, I am one of [Advisor's Name]'s PhD students. For those of you who don't, I am one of the many people whose life is fundamentally different because she chose to invest in it. For four years, she was my advisor. She was the person I sent my drafts to at midnight on Sundays, and the person who called me the next morning not to critique the footnotes, but to ask if I was eating enough.

  Standing here, looking out at this room, I see a divide. On one side, I see her family: her partners, her children, her friends. You knew her through holidays, through crises, through the quiet Tuesday evenings. On the other side, I see her colleagues. Metaethicists. People who spent decades in conference rooms with her, arguing over the nature of value, the structure of reasons, and the validity of normative claims.

  It is a rare thing to be loved by both groups with such intensity. But it is not a coincidence. In fact, explaining why those two things go together was the central project of her intellectual life.

  [Advisor's Name] was best known for her work on evolutionary debunking arguments. Specifically, she was known for her reply to Sharon Street's "Darwinian Dilemma." For the specialists in the room, you know the stakes: If our moral beliefs are shaped by natural selection, how can we claim they are *true*? Either we say evolution tracked independent moral truths—which seems scientifically implausible—or we admit our getting them right is a wild coincidence—which undermines morality entirely.

  [Advisor's Name] refused both horns. She argued for a "Third Factor." She posited that there are independent moral truths, and that the very same facts that make those truths true also explain why it was adaptive for creatures like us to believe them. She argued that we didn't stumble onto the good by luck. We evolved to see it because it was *there* to be seen, and seeing it helped us flourish.

  I tell you this not to give a lecture, but because this was not just a theory to her. It was a description of how she lived.

  To her family: You might wonder why I am talking about evolution and truth at a funeral. I am talking about it because she would have wanted you to know that your grief, and your love for her, is not merely biological.

  There is a view in the world that says we are kind to our children, or loyal to our friends, or generous to strangers, simply because it helped our ancestors survive. It suggests that morality is a trick of the light, a useful fiction written in our DNA. [Advisor's Name] spent her career fighting that view. She believed that when you comforted a friend, or when she held you in her arms, you were not just acting out a survival script. You were recognizing something real. You were tracking a truth that exists independently of us.

  She believed that her love for you was not a happy accident of selection pressure. It was a correct response to a value that is woven into the fabric of the world. She loved you because love is *good*, not just because loving was useful.

  To her colleagues: We have lost the sharpest mind in the room. We have lost the person who could spot a circular argument from across a podium and dismantle it with a smile. But we also lose the person who reminded us why we do this work. We argue about realism and anti-realism, about genealogy and normativity. But she reminded us that the point of the argument is to ensure we have the vocabulary to say that some things are actually, objectively better than others. That kindness is better than cruelty. That truth is better than falsehood. That a life lived in recognition of value is better than one lived in indifference.

  She once told me, half-joking, that she didn't want to be sent off with language that made her decency sound like a lucky side effect of selection pressure rather than something she had actually gotten right.

  So, I will not say that she was a "good person" merely in the sense that she was well-adjusted or socially useful. I will not say that her generosity was an evolutionary adaptation that outlived its purpose.

  I say that she was good because she recognized the Good.

  She saw the demands that the world places on us—the demand to be honest, to be brave, to be kind—and she met them. Not because she had to, and not because it helped her genes replicate, but because those demands are real, and she had the courage to acknowledge them.

  To her family: Her absence is a tragedy. But the love she gave you was not an illusion. It was a discovery. She found something in you that was worthy of that love, something objective and true. That truth does not vanish with her.

  To my colleagues: The debate continues. But the standard has been set. We must not let our skepticism become a cynicism that denies the reality of the values she defended.

  [Advisor's Name] argued that we can track moral truth. She proved it. She tracked it in her papers, she tracked it in her teaching, and she tracked it in the way she lived her life. She didn't just write about the Third Factor; she was the bridge between the truth of value and the reality of human action.

  We are not here to mourn a biological accident. We are here to honor a person who saw clearly, who judged correctly, and who lived truly.

  Rest in peace, [Advisor's Name]. You got it right.
