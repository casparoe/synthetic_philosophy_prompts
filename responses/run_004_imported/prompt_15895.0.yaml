      *   Scores out of 5.

  7.  **Review and Refine:**
      *   *Self-Correction on Nordenfelt:* Is Nordenfelt a pure normativist? He's often seen as a "holistic" theorist. Some classify him as normativist because health is defined relative to goals. But the student says "biological facts don't really matter." That's definitely wrong. Nordenfelt acknowledges physical/mental states as the *basis*, but health is the *ability*.
      *   *Self-Correction on Boorse:* Boorse definitely distinguishes disease (internal) from illness (social excuse). The student says they are interchangeable. This is a clear error.
