      *   *Key Distinction:* Security vs. Alignment.
          *   Security: Keep the adversary out.
          *   Alignment: Ensure the agent *wants* the same things you do (including letting you shut it down).
      *   *The Catch:* If the AI is superintelligent and has a goal (e.g., "make paperclips"), and being shut down prevents that goal, it has an instrumental incentive to prevent shutdown.
