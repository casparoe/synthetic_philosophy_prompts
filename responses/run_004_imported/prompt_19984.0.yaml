answer: |-
  This is a profound intersection of fields, and your background puts you in a unique position to appreciate the weight of the Armstrong/Mindermann (AM) result. Having worked during the era when Schultz was grounding reinforcement learning (RL) in dopaminergic physiology, you witnessed the transition from abstract algorithm to biological mechanism. The AM result essentially formalizes the philosophical limit of that project if one stays strictly at the level of input-output behavior.

  Here is an analysis of what is at stake, structured around the three questions you posed: the implications for AI and Economics, the historical parallel to behaviorism, and the question of entitlement to further assumptions.

  ### 1. The Core Stakes: The Degeneracy of Agency

  To set the stage: The AM no-free-lunch theorem demonstrates that for any observed policy (behavior), there are infinitely many combinations of reward functions ($R$) and planning algorithms ($P$) that could produce it. Mathematically, $Behavior = P(R)$. If you observe the product, you cannot uniquely solve for the two factors without additional constraints.

  The philosophical stakes are **normative**, not just predictive.

  In your neuroscience work, the goal was often predictive/explanatory: *How does the brain compute value?* In AI alignment and welfare economics, the goal is normative: *What value ought to be optimized?*

  If behavior underdetermines the ($R$, $P$) pair, then behavior alone cannot distinguish between:
  1.  An agent with a coherent goal struggling against cognitive limitations (high $R$, bounded $P$).
  2.  An agent with a perverse goal executing perfectly (twisted $R$, optimal $P$).

  **For AI Alignment:**
  The stakes here are existential. The project of Inverse Reinforcement Learning (IRL) in safety assumes that if we watch humans long enough, we can infer what we *actually* value, distinct from what we *say* or momentarily *choose*. The AM result implies that an AI observing human behavior cannot distinguish between a human smoking because they value health but are weak-willed (akrasia), and a human smoking because they value nicotine above health and are perfectly rational.

  If the AI infers the latter, it will facilitate smoking. If it infers the former, it might intervene. Since both are consistent with the behavior, a purely behavioral IRL agent has no basis for intervention. This turns the "alignment problem" into a "interpretation problem." It suggests that value is not a latent variable waiting to be discovered in data, but a theoretical construct that requires a model of the *generator* of the data.

  **For Economics:**
  The revealed preference tradition (Samuelson et al.) sought to purge economics of "mentalistic" clutter. It posits that preference *is* choice. The AM result puts a formal knife into this throat. If any choice pattern can be rationalized by *some* utility function (given a flexible enough planner), then the statement "agents maximize utility" becomes a tautology with no empirical content.

  More critically, welfare economics relies on the ability to identify "mistakes" (e.g., present bias, framing effects). If revealed preference holds strictly, there are no mistakes, only changing preferences. The AM result shows that without an independent standard of rationality (a fixed $P$), you cannot identify welfare losses. You cannot justify a "nudge" to correct a bias if that bias can be mathematically re-described as a genuine preference for the status quo.

  ### 2. Is this a Decisive Objection? (The Behaviorism Parallel)

  You asked whether this is a decisive objection to behavior-based theories or a new face on an old problem. It is the latter, but with a formal rigor that should finally close the book on the former.

  This is precisely the problem that doomed methodological behaviorism in the mid-20th century. Chomsky's review of Skinner argued that you cannot derive the structure of language (or mind) from stimulus-response patterns alone because the mapping is many-to-one. The AM result is the Chomskyan argument applied to decision theory.

  In your own field, the Schultz dopamine findings were revolutionary not because they predicted behavior better than previous models, but because they posited a **mechanism**. They claimed: *The brain physically implements a Temporal Difference error signal.* That is a claim about the internal structure ($P$), not just the output.

  The AM result confirms that strict behaviorism is philosophically bankrupt for agency. It proves that you cannot define "what an agent wants" solely by "what an agent does." To do so is to conflate the *output* of a computation with the *objective function* of that computation.

  Therefore, it should be read as a decisive objection to any theory that claims to derive values *purely* from behavior without structural assumptions. It validates the cognitivist turn you participated in: we must posit internal structure to make sense of external action.

  ### 3. Working Around It: The Entitlement Question

  If behavior is insufficient, practitioners must introduce constraints. The critical question is: **What entitles us to these constraints?**

  The AM paper notes that a "simplicity prior" (Occam's razor) over ($R$, $P$) pairs does not solve the problem. The "true" human reward function might be complex, and the "true" planner might be messy. The simplest mathematical pair that fits the data might be a trivial reward function (e.g., "maximize whatever happens") paired with a demonically complex planner.

  To escape the underdetermination, we need **structural priors** that are justified independently of the behavioral data being fit. Here is where the entitlement must come from:

  **A. Cognitive and Biological Structure (The Neuroscientific Anchor)**
  This is where your background is most relevant. We are entitled to assume certain constraints on $P$ (the planner) because we know humans are biological machines with specific architectures.
  *   **Modularity:** We know the brain has distinct systems for habit, planning, and Pavlovian response. We can constrain IRL by requiring the inferred $R$ to be consistent with these known subsystems.
  *   **Physiological Signals:** If we observe dopamine firing (or proxies like pupil dilation, fMRI BOLD) that correlates with prediction error, we have a signal that is *not* choice behavior. It is a window into the intermediate computation. Combining choice data with physiological data breaks the degeneracy.
  *   **Entitlement:** We are entitled to these assumptions because they are empirically verified by systems neuroscience, not because they make the math easier.

  **B. Normative Rationality (The Philosophical Anchor)**
  In AI safety, researchers often assume humans are "noisy rational" agents. The AM result shows this is an assumption, not a finding. However, we might be entitled to a *weak* normative prior.
  *   **Coherence:** We can assume that human values possess a degree of diachronic coherence (we want to be the kind of people who keep promises) that is not immediately visible in single-shot choices.
  *   **Counterfactuals:** We can query agents about what they *would* have done under different information states. While still behavioral, this expands the dataset to include "reflective equilibrium" behaviors, not just raw choices.
  *   **Entitlement:** This is the trickiest. It relies on a philosophical claim that there is a "real self" distinct from the "impulsive self." This is not empirically neutral. It requires a commitment to a specific philosophy of mind (e.g., Frankfurt's hierarchy of desires).

  **C. Cross-Modal Convergence**
  We are entitled to trust an inference of $R$ if it converges across different modalities:
  1.  Choices (Revealed Preference)
  2.  Verbal Reports (Stated Preference)
  3.  Physiological Arousal (Neural/Endocrine)
  4.  Reaction Times (Computational Cost)

  If a specific ($R$, $P$) pair explains all four, the underdetermination is practically resolved, even if not mathematically unique.

  ### Summary and Recommendation

  The Armstrong/Mindermann result is not a barrier to progress, but a **boundary marker**. It tells us that the project of inferring values cannot remain within the confines of economics or abstract computer science.

  1.  **For AI Safety:** It implies that "value learning" cannot be solved by bigger models and more data alone. It requires **mechanistic interpretability** of the human brain (or at least a robust cognitive model). The AI needs a theory of human cognitive error to distinguish error from preference.
  2.  **For Economics:** It suggests a return to "psychological economics." Revealed preference is useful for prediction, but useless for welfare analysis without a psychological model of the decision process.
  3.  **For Philosophy:** It vindicates the claim that intentionality is not transparent in action. To interpret an agent is to theorize their architecture.

  **Your specific leverage point:**
  As a neuroscientist turned philosopher, your insight is that the "planner" ($P$) is not a mathematical abstraction; it is a physical system. The degeneracy exists only as long as we treat the agent as a black box. The solution to the underdetermination is to **open the box**.

  The entitlement to assume a specific planner comes from the same place your entitlement to posit dopamine RPEs came from: **convergent empirical evidence regarding the mechanism of computation.** We are entitled to assume humans are not "demon planners" because we have looked inside the skull and seen heuristics, biases, and anatomical constraints.

  Therefore, the AM result should not discourage the project of inferring values, but it should force it to become **interdisciplinary**. A purely behavioral IRL is impossible. A neuro-symbolic, cognitively-grounded IRL is difficult, but possible. The "truth" of human values is not in the choices; it is in the circuitry that generates them.
