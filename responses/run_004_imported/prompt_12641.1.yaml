answer: |-
  My psych roommate was explaining Moore's Paradox to me—how you can say "It's raining, but I don't believe it" without lying, you just sound unhinged. She said there are two flavors: the *omissive* (denying the belief) and the *commissive* (asserting the opposite belief).

  So I asked, "Okay, apply it to your ex. Are you broken up?"

  She said, "We're broken up, but I don't believe it."

  I said, "That's the omissive one. Sounds like grief."

  She said, "Exactly. It's safe. It acknowledges the fact without committing to the internal state."

  I said, "What if you go commissive? Say 'We're broken up, but I believe we're not.'"

  She paused. "No. That's not grief. That's a restraining order."

  I said, "So which one is it?"

  She poured a glass of wine. "Tonight? Omissive. But if I text him at 2 AM, I'm going commissive."

  I said, "That's not how reality works."

  She said, "It's not reality, it's doxastic logic. Now leave."

  I said, "I'm leaving, but I don't believe I am."

  She locked the deadbolt. "You're outside, but I believe you're still here. Check your phone."

  I looked down. She'd texted: *'See? Commissive version. I believe you're gone, but I know you're reading this.'*
