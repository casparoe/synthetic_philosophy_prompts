answer: |-
  **Setting:** *The back room of a community studio. The electric kiln has just finished cooling. The air smells of ozone and baked earth. ELENA (40s, meticulous, wears a apron stained with decades of glaze) and MARCUS (20s, philosophy grad student, wearing a t-shirt that says 'Existence is Overrated') are pulling out the kiln shelves.*

  **Marcus:** *(Running a thumb over a terracotta mug)* It's still warm.

  **Elena:** Don't touch the glaze. It's fragile until it cures completely.

  **Marcus:** I'm not touching the glaze. I'm touching the *clay*. Or, I guess, what used to be clay. Remember what Sarah said last week? "Once it's bisque fired, it's not clay anymore."

  **Elena:** She's right. Chemically. The silica has vitrified. The water of crystallization is gone. You can't slake this down and throw it again. It's irreversible.

  **Marcus:** That's chemistry. I'm talking about ontology. If the atoms are mostly the same, arranged in mostly the same way, why do we act like a new object popped into existence at 1000 degrees Celsius?

  **Elena:** Because a new object *did* pop into existence. There was a lump of clay. Now there is a mug. They are coincident, sure, occupying the same space, but they aren't identical.

  **Marcus:** *(Laughs, setting the mug on a wire rack)* Here we go. The Constitution View. You really believe there are two things sitting on this rack?

  **Elena:** I believe there is a lump of ceramic material, and there is a mug. They have different persistence conditions. That makes them distinct. Leibniz's Law, Marcus. The Indiscernibility of Identicals. If $A$ is identical to $B$, they must share all properties.

  **Marcus:** And they don't?

  **Elena:** No. Imagine I drop this mug. It shatters. The *mug* is destroyed. It ceases to exist. But the *lump of ceramic*? It's still right here. Just in pieces. The lump survives the crushing; the mug does not. Therefore, they have different modal properties. Therefore, they are not the same thing.

  **Marcus:** That's the classic move. But it begs the question. You're assuming "the mug" is a substance that can die. I'm saying "the mug" is just a description of the clay arranged pot-wise. When you drop it, the clay rearranges shard-wise. You haven't killed an object; you've just changed the arrangement of the one object that's actually here.

  **Elena:** So if I smash it, you'd say the clay is still here, which is true, but you'd deny the mug ever existed as a distinct entity?

  **Marcus:** I'd say the word "mug" is useful. It tracks a function. But ontologically? It's just clay. You're positing a ghost in the machine. You've got the physical matter, and then you've got this invisible "mug-ness" layered on top of it. Where is it? What is it made of?

  **Elena:** It's not made of *stuff*, it's constituted by the stuff. Look, the Grounding Problem cuts both ways. If you say there's only one thing, you have to explain why that one thing has contradictory properties. Can the object on the rack survive being crushed? Yes, as matter. No, as a vessel. If it's one object, which is it?

  **Marcus:** It's the matter. The "vessel" part is in our heads, not in the kiln. You're reifying a concept.

  **Elena:** A concept that holds water. A concept that cost me twenty dollars in materials and three hours of labor.

  **Marcus:** *(Picking up another piece, a small bowl)* Okay, let's hit the timing then. The Sorites. You said a new object popped into existence. When?

  **Elena:** At bisque. When the chemical change locked it.

  **Marcus:** 1000 degrees?

  **Elena:** Roughly. Cone 04.

  **Marcus:** What about 999 degrees? Was it a mug then?

  **Elena:** It was greenware. Unfired.

  **Marcus:** So at 999 degrees, it's just clay. At 1000 degrees, suddenly there are two things occupying the same space? That's magical. It's ontological spontaneous generation. If the atoms didn't vanish and new ones didn't arrive, what triggered the second object?

  **Elena:** The structural integrity changed. The bonds changed.

  **Marcus:** Bonds break and form constantly. When you wedged the clay, you broke bonds. When you threw it, you aligned the platelets. Why is *this* specific thermal threshold the moment the universe decided to duplicate the object count? It seems arbitrary. It's easier to say the clay persists through time, changing properties, and we slap the label "mug" on it when it's useful.

  **Elena:** But that ignores intention. The clay didn't arrange itself pot-wise. I did. The mug is an artifact. An artifact's identity is tied to its function. If I take this bowl and use it as a doorstop, is it still a bowl?

  **Marcus:** It's a bowl being used as a doorstop.

  **Elena:** No, if I glue it to the floor, it ceases to be a bowl. But the clay remains. If they were the same object, how can one cease to exist while the other remains?

  **Marcus:** Because "ceasing to be a bowl" isn't ceasing to *exist*. It's just ceasing to fall under the concept "bowl." You're confusing identity with classification.

  **Elena:** *(Stops wiping a shelf, turns to Marcus)* You're avoiding the modal difference. If I had never thrown this clay, the lump would still exist. But *this* mug would not. The mug depends on me. The clay depends on geology. Their histories are different. How can they be one thing if their histories diverge?

  **Marcus:** Their histories don't diverge. The *descriptions* diverge. Look, here's the weak point in your view: Spatial coincidence. If the mug and the clay are distinct, they are two objects in the exact same place at the exact same time. Why don't they weigh twice as much?

  **Elena:** Because constitution isn't addition. The mug isn't *plus* the clay. The mug is *constituted by* the clay.

  **Marcus:** That sounds like a slogan, not an explanation. What binds them? If I scrape off a bit of glaze, did I injure the mug or the clay?

  **Elena:** Both.

  **Marcus:** Then they're causally redundant. If every action on the mug is an action on the clay, why posit the mug? Occam's Razor. Shave it off.

  **Elena:** Because without the mug, you can't explain why I'm careful with it. I don't care about the silicate structure. I care about the handle.

  **Marcus:** *(Gestures to a mug with a hairline crack)* Speaking of handles. Look at that one.

  **Elena:** *(Leans in)* Oh no. The thermal shock. The handle snapped.

  **Marcus:** So. Did the mug die?

  **Elena:** Yes. It's ruined. It's a broken thing.

  **Marcus:** And the clay?

  **Elena:** The clay is still there. In the handle, in the cup.

  **Marcus:** So you were right. Two things. One died, one lived.

  **Elena:** *(Picks up the broken piece gently)* But wait. If I take gold dust and epoxy, and I fix the handle...

  **Marcus:** Then you have a repaired mug.

  **Elena:** Is it the *same* mug?

  **Marcus:** *(Hesitates)* Most people would say yes.

  **Elena:** But the clay is different now. There's epoxy in the mix. New atoms. If the mug is just the clay arranged pot-wise, and the atoms changed, isn't it a new lump?

  **Marcus:** It's a new lump, yes.

  **Elena:** But the same mug.

  **Marcus:** *(Sighs)* Fine. The mug has looser persistence conditions regarding material composition than the specific lump of clay does.

  **Elena:** Aha! So they *do* have different persistence conditions.

  **Marcus:** Only because "mug" is a functional kind and "lump" is a material kind. You're treating "mug" like a substance. It's not. It's a role.

  **Elena:** A role that can be broken. *(She holds the broken handle)* So, when Sarah said "it's not clay anymore," she was wrong?

  **Marcus:** She was speaking practically. Chemically, it's ceramic. Ontologically... it's still just stuff.

  **Elena:** *(Sets the broken piece down on the rack with a sharp clink)* I disagree. When I pulled this from the wheel, it was potential. It could have been recycled. It was mortal in a way that didn't matter. Now? It's fixed. It has a history. It has a break.

  **Marcus:** The atoms have a history.

  **Elena:** The atoms don't have a break, Marcus. "Broken" implies a function failed. Atoms don't fail. They just move.

  **Marcus:** *(Picks up the broken handle, weighing it in his hand)* So the "brokenness" is the proof of the mug?

  **Elena:** The brokenness is the proof that the mug was real enough to die. You can't kill a description. You can only stop using it. But this? *(She points to the jagged edge)* This feels like a death.

  **Marcus:** *(Quietly)* Maybe. Or maybe it's just the moment you stopped being able to drink from it.

  **Elena:** *(Turns back to the kiln)* Pass me the brush. I need to sweep the shelf.

  **Marcus:** *(Hands her the brush)* Sweeping the clay or the mug?

  **Elena:** *(Takes the brush)* Don't start. Just hand me the dustpan. There's debris here.

  **Marcus:** Debris. Not "dead mug parts"?

  **Elena:** *(Smiles faintly)* If I sweep you up, Marcus, will you cease to exist?

  **Marcus:** Only if I'm constituted by silica and ego.

  **Elena:** Then be careful. I'm sweeping.

  *(She sweeps the ceramic dust into the pan. The sound is harsh, gritty. Marcus watches the dust settle, then looks back at the intact mug on the rack.)*

  **Marcus:** It's still a mug, you know. Even if you sweep up the dust.

  **Elena:** *(Without looking up)* Only as long as it holds water.

  **Marcus:** And if it doesn't?

  **Elena:** Then it's just a lump. Like you said.

  **Marcus:** *(Nods)* Just a lump.

  *(Silence, save for the scratching of the brush.)*

  **Elena:** But it's a very expensive lump.

  **Marcus:** *(Chuckles)* Now we're agreeing.

  **Elena:** Don't push it. Hand me the next shelf.

  *(Marcus lifts the heavy kiln shelf. The ceramic groans.)*
