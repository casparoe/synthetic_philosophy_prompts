answer: |-
  Here are ten interview questions designed to bypass the introductory material and press directly into the philosophical and practical tensions of Risk-Weighted Expected Utility (REU) theory.

  Each question includes an **"Anticipated Defense"** note (explaining why she's likely to answer a certain way) and a **"Follow-Up"** tailored to pierce that specific defense.

  ### 1. The Moral Weight of Risk
  "In the EA-adjacent world that surrounded FTX, maximizing Expected Value wasn't just a strategy; it was often framed as a moral obligation. Your theory validates risk-aversion as rational, not just a psychological limitation. But does REU offer a *moral* defense of risk-aversion, or only a *prudential* one? If I'm managing funds for existential risk reduction, does my personal risk function legitimately trump the raw expected number of lives saved?"

  *   **Anticipated Defense:** She will likely distinguish between personal prudential rationality and moral obligation, arguing REU explains why an agent *can* refuse a high-EV bet without being irrational, but may not claim it's morally superior.
  *   **Follow-Up:** "If it's only prudential, doesn't that collapse in a fiduciary context? SBF was playing with customer funds. If REU says 'it's rational for *you* to be risk-averse,' does it also say 'it's rational for *you* to impose risk-neutral strategies on others' if you're acting as their agent? Or does REU implicitly demand that agents adopt the risk-attitudes of their beneficiaries?"

  ### 2. The Concrete Gamble & The Calibration Trap
  "Let's walk through a specific case to separate REU from diminishing marginal utility. Suppose I offer you a 55% chance to win $110 and a 45% chance to lose $100. Many reject this. Under standard EU, that implies you'd reject a 55% chance to win $1 billion and lose $1,000, which is absurd (the Rabin calibration theorem). REU claims to avoid this by separating the utility of outcomes from the weighting of probabilities. Can you walk me through how the risk function handles the small bet without forcing the absurd rejection of the large bet?"

  *   **Anticipated Defense:** She will explain that REU allows you to be sensitive to the *structure* of the gamble (the spread of outcomes) via the risk function $r(p)$, without needing a wildly concave utility curve for money.
  *   **Follow-Up:** "Safra and Segal (2008) argued that calibration problems aren't unique to EU—that if your risk function is stable across stake sizes, REU generates its own absurd calibration implications. To avoid Safra-Segal, don't you have to make the risk function context-dependent? And if you do that, haven't you just relocated the framing problem you were trying to solve?"

  ### 3. The Money-Pump & Dynamic Inconsistency
  "By dropping the Independence Axiom to accommodate Allais-style preferences, REU opens the door to dynamic inconsistency. The classic objection is that an REU agent can be money-pumped across a multi-stage decision tree because their preferences shift as probabilities resolve. I know the standard Buchak response relies on 'resolute choice'—sticking to your initial plan. But isn't 'resolute choice' essentially a stipulation that you ignore your own current preferences at later nodes?"

  *   **Anticipated Defense:** She will argue that resolute choice is a form of rational planning agency, where an agent identifies with their prior assessment rather than their temporally local self.
  *   **Follow-Up:** "If rationality requires ignoring your current preferences to avoid exploitation, doesn't that make the theory action-guiding only for agents with iron wills? If a normal human being naturally updates their risk-attitude as uncertainty resolves, is REU telling them they are irrational, or that they need to pre-commit to ignoring their own judgment?"

  ### 4. Prospect Theory vs. Rational Attitude
  "To a lay observer, the mathematical machinery of REU looks suspiciously identical to the probability-weighting function in Kahneman and Tversky's Prospect Theory. In Prospect Theory, that curvature is a cognitive bias—a bug in how humans perceive probability. In REU, it's a normative feature of rationality. Aside from the label, what distinguishes a 'rational risk attitude' from a 'systematic cognitive error'? Is the difference just that you like the result and they don't?"

  *   **Anticipated Defense:** She will likely argue that Prospect Theory is descriptive (how people *do* choose) and often includes loss aversion/reference points, whereas REU is normative (how people *should* choose) and focuses purely on global risk attitudes.
  *   **Follow-Up:** "But if the underlying cognitive mechanism is the same—if the brain is using the same heuristic to weight probabilities—doesn't the normative claim rest on shaky ground? If evolution gave us that weighting function to handle small-scale tribal risks, why should we trust it as a 'rational' guide for global existential bets? Aren't you laundering a bias into a virtue?"

  ### 5. Radical Permissiveness
  "Let's talk about the scope of rational disagreement. Under REU, two agents can agree on every probability, agree on the utility of every outcome, but have different risk functions, leading them to make opposite choices on every single risky decision they face. Both are deemed rational. At what point does this permissiveness become a bug? If a theory declares both the cautious saver and the leveraged speculator 'rational,' does it lose the ability to identify who is actually making a mistake?"

  *   **Anticipated Defense:** She will argue that rationality is not about convergence on outcomes, but about coherence between attitudes and choices. Diversity in risk attitudes is a fundamental feature of agency, like different tastes.
  *   **Follow-Up:** "Tastes are one thing, but survival is another. If REU validates a risk function that systematically leads to ruin in a competitive environment, is it still 'rational'? If not, doesn't that mean there *are* external constraints on the risk function, effectively re-imposing a version of the EU constraints you tried to escape?"

  ### 6. Risk-Seeking and the SBF Defense
  "We've focused on risk-aversion, but REU also permits risk-seeking behavior if the risk function is convex. SBF famously claimed he was maximizing EV, but he was also taking massive, asymmetric risks. Could SBF defend himself using REU? Could he claim he simply had a convex risk function, making his leverage rational for *him*, even if it looked insane to a risk-averse observer?"

  *   **Anticipated Defense:** She will likely concede that REU permits risk-seeking but may distinguish between risk-seeking and negligence or fraud.
  *   **Follow-Up:** "If REU can model SBF's choices as 'rational' given his risk function, does the theory lose its critical bite? If the only thing wrong with FTX was that SBF's risk function didn't match his customers', isn't that a principal-agent problem, not a decision-theory problem? Does REU inadvertently provide a philosophical shield for 'I was just playing a different game'?"

  ### 7. Individuation of Outcomes
  "REU requires evaluating acts based on the global partition of states. This means how I frame the outcomes matters. If I frame a gamble as 'win or lose' versus 'win, break even, or lose,' my risk function might weight those probabilities differently. Doesn't this make REU vulnerable to framing effects? And if framing effects are generally considered markers of irrationality, why is REU exempt?"

  *   **Anticipated Defense:** She will argue that the agent must individuate outcomes correctly (based on what they care about), and if they do so consistently, framing isn't an issue.
  *   **Follow-Up:** "But who determines the 'correct' individuation? If the theory relies on the agent's subjective description of the states to determine rationality, doesn't that allow an agent to rationalize any choice simply by describing the states in a way that tilts their risk function? Where is the check against self-deceptive framing?"

  ### 8. Longtermism and Extinction Risk
  "Much of the EA community focuses on longtermism, where the probabilities are tiny and the stakes are astronomical. In that limit, the expected value is dominated by the tail. Does REU collapse into standard EU in the limit? If my risk function down-weights tiny probabilities significantly, does REU effectively tell longtermists to ignore extinction risk? Or does it allow them to care, but for different reasons?"

  *   **Anticipated Defense:** She will likely say REU allows for sensitivity to small probabilities without being dominated by them, offering a 'middle ground.'
  *   **Follow-Up:** "If REU allows you to down-weight tiny probabilities of extinction, aren't you just formalizing Pascal's Mugging avoidance? But if you *don't* down-weight them, don't you run back into the problem where a 0.00001% chance of a trillion lives outweighs all current suffering? Does REU actually solve the longtermist calculation, or just make it more opaque?"

  ### 9. Interpersonal Comparisons of Risk
  "Policy decisions often involve imposing risk on others. If I'm a policymaker, and I use my own risk function to decide on a climate strategy that imposes catastrophic risk on a future generation, REU says I'm being internally consistent. But isn't there a normative gap here? Does REU have any resources to say I should use *their* risk function, not mine? Or is the theory strictly first-personal?"

  *   **Anticipated Defense:** She will admit REU is first-personal but suggest it can be integrated into a moral framework that accounts for others' attitudes.
  *   **Follow-Up:** "If it requires an external moral framework to handle interpersonal risk, isn't REU just a sub-routine? In the context of FTX, the harm wasn't SBF's risk-taking per se, it was the non-consensual imposition of it. Does focusing on the rationality of the risk function distract from the ethics of the consent?"

  ### 10. The "So What?" for the Post-FTX World
  "Finally, let's bring this back to the fallout. If the EA community adopts REU over standard EU as their normative guide, what is the concrete change? Do we see less leverage? More diversification? Or is the main takeaway simply that we stop calling risk-averse people 'irrationally cautious' and stop calling risk-seekers 'visionary'? What actually changes in the decision-making room?"

  *   **Anticipated Defense:** She will argue it changes the culture of justification, allowing for honest disagreement about risk without accusing others of bias or immorality.
  *   **Follow-Up:** "But if it allows for honest disagreement, doesn't it also make it harder to coordinate? If half the movement is REU-risk-averse and half is EV-maximizing, and both are 'rational,' do you just split resources? Is the price of accepting REU a fragmentation of the movement's strategic focus?"
