answer: |-
  To reconcile these two passages without resorting to an ad hoc distinction between "private" and "public" spheres—a distinction that is largely alien to the Confucian worldview—we must return to the ontological core of role ethics as articulated by Roger Ames and Henry Rosemont. In their framework, persons are not atomic individuals who *have* relationships; they are the sum of the relationships they inhabit. Ethics, therefore, is not about applying universal rules to discrete agents, but about optimizing the specific roles one enacts to maximize the flourishing of the relational network.

  The apparent contradiction between *Analects* 13.18 (concealment) and *Mencius* 7A35 (abdication) dissolves when we view them not as conflicting rulings on justice, but as consistent applications of *yi* (appropriateness) relative to the **scope of responsibility** inherent in the specific roles being enacted.

  Here is the argument for an internal reconciliation based on three pillars of role ethics: the family as the generative root, the integrity of role-specific agency, and the concept of *quan* (discretionary weighing).

  ### 1. The Family as the Ontological Root (*Ben*)
  In role ethics, the family is not merely a private association; it is the training ground and source of all moral capacity. *Ren* (humaneness) grows from *xiao* (filial piety). To rupture the father-son bond is to sever the root of moral development itself.

  In *Analects* 13.18, when Confucius advocates concealment regarding the stolen sheep, he is not prioritizing "family over law" in a competitive sense. He is asserting that the integrity of the familial role is the precondition for any meaningful social order. For a commoner, the primary contribution to social harmony is the cultivation of a stable family. If a son testifies against his father, he instrumentalizes the father-son relationship for the sake of a property dispute (the sheep). This turns the father into an object of legal scrutiny rather than a partner in a shared life. The "uprightness" (*zhi*) Confucius speaks of is the uprightness of the *relationship*, not the uprightness of the statute. Concealment here preserves the generative root of ethics.

  ### 2. Role Integrity and the Burden of the Ruler
  The critical difference in the *Mencius* passage is not the severity of the crime (murder vs. theft), but the **role of the agent**. Shun is not merely a son; he is the Sage King. In role ethics, to hold a role is to bear the responsibility for the flourishing of the field that role governs.

  *   **The Commoner's Role:** The commoner's sphere of influence is limited. His concealment of the sheep theft does not collapse the legal order; it is a localized maintenance of the familial root.
  *   **The Ruler's Role:** Shun *is* the embodiment of the legal and moral order. If Shun uses his royal authority to stop his father's arrest, he does not just save his father; he corrupts the Office of the Ruler. He makes the law arbitrary and dependent on his personal whim. This would damage the relational network of the entire state, not just his family.

  Therefore, Shun cannot do what the commoner does (simply conceal/protect). If he obstructs the Minister of Justice (Gao Yao), he fails as a Ruler. But if he allows his father to be punished without intervention, he fails as a Son.

  This is where the reconciliation becomes internal rather than ad hoc. Shun's solution—abdicating and fleeing—is the only move that preserves the integrity of **both** roles.
  1.  **By letting the arrest proceed:** He acknowledges the validity of the public role (Justice) and does not use his power to corrupt the law.
  2.  **By abdicating and fleeing:** He sheds the political role that conflicts with his filial duty, allowing him to care for his father as a son, no longer burdened by the responsibility of the throne.

  He does not choose family *over* justice; he sacrifices his political status to ensure justice is served while still honoring his father. This is not nepotism; it is a tragic optimization of conflicting role demands.

  ### 3. *Yi* (Appropriateness) and *Quan* (Weighing)
  Critics often mistake role ethics for rigid particularism (i.e., "always help your friend"). However, Ames and Rosemont emphasize *yi* (appropriateness) and *quan* (weighing/discretion). Ethical action requires assessing the unique configuration of relationships in a specific context.

  The distinction between the two passages is not a bolted-on rule about "public vs. private." It is a calculation of **relational consequence**:
  *   In the *Analects* case, the cost of legal rigidity (destroying the family bond) outweighs the benefit (recovering a sheep). The appropriate action (*yi*) is concealment.
  *   In the *Mencius* case, the cost of legal rigidity (executing the father) is high, but the cost of royal interference (destroying the rule of law for the whole kingdom) is higher. The appropriate action (*yi*) is to remove the source of the conflict (the King himself) from the equation.

  If Shun simply fled with his father while remaining King, he would be a tyrant. If he stayed and let his father be executed, he would be inhuman. Abdication is the *only* action that satisfies the demands of role ethics: it respects the law by not obstructing it, and it respects the family by not abandoning the father.

  ### Conclusion: Defusing the Nepotism Charge
  The charge of nepotism assumes a liberal individualist framework where "justice" is an abstract universal that must apply equally to all atomic individuals. Role ethics rejects this ontology. For Ames and Rosemont, justice is the flourishing of the specific relationships at hand.

  Reading these passages together through role ethics reveals a consistent logic: **One must never compromise the integrity of the role one currently inhabits.**
  *   The son in the *Analects* inhabits the role of family member primarily; testifying compromises that role.
  *   Shun in the *Mencius* inhabits the role of Ruler primarily; obstructing justice compromises that role.

  Shun's abdication proves that role ethics does not let family loyalty override public justice; rather, it demands that when the two are irreconcilable, the moral agent must sacrifice their *position* rather than corrupt the *function* of their office. The commoner conceals because he has no office to corrupt; the King abdicates because his office makes concealment impossible. This is not a contradiction, but a sophisticated calibration of responsibility internal to the theory itself.
