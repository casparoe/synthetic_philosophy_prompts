answer: |-
  **Setting:** *A quiet corner of a university library, late afternoon. Two chairs face each other across a small table scattered with books: Michael Walzer's* Just and Unjust Wars *on one side, Jeff McMahan's* Killing in War *on the other.*

  **Characters:**
  *   **ELIAS:** Defender of the Traditional View (Moral Equality of Combatants).
  *   **SARAH:** Critic of the Traditional View (Revisionist).

  **SARAH:** Let's cut past the preamble, Elias. You say the infantryman on the aggressive side is the moral equal of the infantryman defending his home. But strip away the uniforms and the flags. If a man breaks into my house to steal my TV, and I shoot him in self-defense, I haven't wronged him. He made himself liable to defensive harm by posing an unjust threat. Why does putting on a uniform change the metaphysics of liability? If the war is unjust, the threat they pose is unjust. Therefore, they are liable to be killed. The defender is not. How can they be equals?

  **ELIAS:** Because you're treating war like a giant mugging, Sarah. It isn't. It's a distinct moral sphere. Your liability argument relies on the idea that the soldier is an individual moral agent acting in a vacuum. But he isn't. He is a constituent part of a collective agency—the state. When he points his rifle at an opposing soldier, he isn't acting on personal malice or private gain. He is acting as an instrument of a political community that claims, rightly or wrongly, the authority to use force.

  **SARAH:** "Instrument." That's the traditional escape hatch. But an instrument doesn't kill people; a person does.

  **ELIAS:** I'm not saying he's a robot. I'm saying his moral permission to kill doesn't stem from his personal justification, but from the *mutual recognition of risk* inherent in the institution of war. If we adopt your view, we sever the link between *jus in bello* (conduct in war) and *jus ad bellum* (justice of war). If the unjust soldier knows he is liable to be killed simply because his cause is unjust, he has no incentive to follow the rules of engagement. He's a dead man walking either way. Why shouldn't he shoot hostages? Why shouldn't he use human shields? If his very presence is a crime, he might as well make it worth it. My answer to your liability argument is this: We grant them equality not because they are innocent, but because the alternative destroys the only barrier we have against total barbarism. The "equality" is a functional necessity to preserve the humanity of the battlefield.

  **SARAH:** That's a pragmatic argument, Elias. I'm asking about the morality. You're saying we should lie to soldiers about their moral status to keep them in line. But let's engage your point on incentives. You think denying equality makes unjust combatants fight dirtier. I think you underestimate the soldier's capacity for nuance. But fine, let's look at the other side of the coin. Your view protects the unjust soldier, but it burdens the just one.

  **ELIAS:** How so?

  **SARAH:** If I'm right, and liability depends on the justice of the cause, then every soldier has a duty to assess the justice of their war before pulling the trigger. You traditionalists scream that this is impossible. You say, "How can a nineteen-year-old private adjudicate complex geopolitical history?" You claim that if we deny moral equality, we force every soldier to be a philosopher-king or a war criminal.

  **ELIAS:** It is impossible. And it's unfair.

  **SARAH:** It's not impossible if we lower the bar. We don't need them to know the absolute truth. We need them to make a *reasonable* assessment based on available evidence. If a regime is openly annexing neighbors, lying about atrocities, and ignoring international courts, the epistemic burden is met. The soldier doesn't need to know the deep history; he needs to recognize the manifest injustice. But here is where I need to answer your worry about the "decent" unjust combatant. The conscript. The one misled by propaganda.

  **ELIAS:** Exactly. The boy from the rural village who is told his country is under attack. He bears no culpability. He is ignorant, not malicious. On your view, he is still liable to be killed. That intuition sits very heavy with me.

  **SARAH:** Here is the distinction you're missing, and where I must concede ground to you. I distinguish between *liability* and *culpability*. The conscript is an unjust threat. If he shoots at a defender, the defender is permitted to kill him to save himself. That makes the conscript *liable*. But that does not mean the conscript is *blameworthy*. He may be entirely innocent in his heart. He is a tragic figure.

  **ELIAS:** But if he's innocent, why is he liable? Liability usually tracks responsibility.

  **SARAH:** In self-defense, liability tracks the *threat*, not just the blame. If a sleepwalker tries to strangle me, I can stop him, even kill him if necessary. He isn't culpable. He's asleep. But he is liable to defensive force because he is the source of the unjust threat. The unjust combatant is like the sleepwalker. He might not be morally guilty, but he is still the obstacle to justice that must be removed.

  **ELIAS:** That's a chilling analogy. Reducing a human being to an "obstacle." But let's press you on the epistemic point. You say "reasonable assessment." But in the fog of war, information is controlled by the very state sending them to fight. If the state controls the media, the schools, and the intelligence, what counts as a "reasonable" assessment? If you set the bar too low, you punish the duped. If you set it too high, you effectively grant moral equality anyway, because almost no one will meet the bar for "unjust."

  **SARAH:** That is a genuine problem. And here is where I have to concede something that pains me. If the epistemic conditions are sufficiently opaque—if the propaganda is total, if the dissent is crushed—then the unjust combatant's liability is diminished. Not because the war becomes just, but because his capacity to recognize the injustice is compromised. In those specific cases, the moral difference between him and the just combatant narrows significantly.

  **ELIAS:** So, in practice, your revisionism collapses back toward my traditionalism in the very cases that matter most? The mass wars where populations are mobilized and misled?

  **SARAH:** Not collapses. But it blurs. The metaphysical truth remains: one side is right, one is wrong. The unjust combatant is technically liable. But the *practical* right to kill him is constrained by our uncertainty about his knowledge. We have to give him the benefit of the doubt.

  **ELIAS:** Then we are arguing over labels. You want to say he is "liable but excused." I say he is "protected by convention." The result on the ground is the same: you don't hunt him down as a criminal, and you don't tell the just soldier he can't be killed.

  **SARAH:** No, the result isn't the same. The label matters for how we treat them *after* the war, and for how we compensate victims. But... I will concede this: If we emphasize the liability of the ordinary soldier too loudly, we risk dehumanizing them in a way that makes peace harder. If we treat the opposing army as a collection of liable unjust threats rather than honorable adversaries, we remove the reciprocity that ends wars.

  **ELIAS:** And I must concede this to you: The "instrument" defense I started with... it's unsatisfying. It feels like a lie. To tell a soldier, "You are doing nothing wrong," when he is fighting for a regime that started a war of genocide... that corrodes his moral agency. I can defend the *rules* of equality, but I cannot defend the idea that the unjust soldier's conscience is clean. There is a moral stain there, even if the law of war ignores it.

  **SARAH:** So you admit the moral asymmetry exists, even if the rules pretend it doesn't.

  **ELIAS:** I admit that the rules are a fiction we tell to keep the horror within bounds. A necessary fiction. But you admit that the truth of that asymmetry is too dangerous to apply fully in the heat of battle.

  **SARAH:** Because the cost of enforcing the truth is too high in human lives.

  **ELIAS:** Then we are left with a paradox. The truth of the matter demands your view. The safety of the world demands mine.

  **SARAH:** *(Pauses, looking at the books)* Then perhaps the task isn't to resolve the paradox. It's to decide which lie we can live with.

  **ELIAS:** Or how much truth we can bear before the shooting stops.

  *(They sit in silence for a moment, neither reaching for their books.)*
