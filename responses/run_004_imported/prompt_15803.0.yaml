      *   Ensure the concessions hurt. Elias admitting that unjust combatants are *doing wrong* undermines the core of MEC. Sarah admitting that the *practical implication* might still be equality undermines the revolutionary force of Revisionism.

  6.  **Writing the Dialogue:** (Proceeding to generate the text based on these thoughts.)
      *   *Focus on the "Liability" argument:* Elias needs to argue that in war, the threat is "normatively transformed" by the state's claim to authority.
      *   *Focus on the "Epistemic" argument:* Sarah needs to argue that soldiers have a duty of inquiry, but also that liability doesn't require malice.
      *   *The Concessions:* Elias admits the unjust soldier is morally tainted. Sarah admits the "liability" label might need to be suppressed for humanitarian reasons.

