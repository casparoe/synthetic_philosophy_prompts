  2.  **Deconstruct the Arguments:**
      *   **Traditionalist (MEC):** Based on Walzer's *Just and Unjust Wars*. Key concept: The "War Convention." Soldiers are coerced, lack epistemic access, and function as citizens' agents. If they follow *jus in bello* (rules of engagement), they are morally equal.
      *   **Revisionist (Anti-MEC):** Based on McMahan's *Killing in War*. Key concept: Liability. You can only be killed if you are morally liable. Unjust threats are liable; just defenders are not. Therefore, unjust combatants are doing something wrong by fighting, even if they follow rules.
      *   **The Clash:**
          *   *Revisionist Attack:* How can a soldier fighting for aggression be morally equal to one fighting for defense? It violates basic self-defense ethics.
          *   *Traditionalist Attack:* If you deny equality, you make war impossible to regulate and place an impossible burden on individual soldiers.
          *   *Defender's Challenge:* Explain *why* the unjust soldier isn't liable without just saying "orders." Needs a deeper moral account (perhaps collective agency or the nature of the threat).
          *   *Critic's Challenge:* Explain how soldiers can know *jus ad bellum* without being philosophers, and how to handle non-culpable unjust combatants (those misled or conscripted).

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** A quiet academic setting. Coffee. Two colleagues. Let's call them Elias (Traditionalist) and Sarah (Revisionist).
      *   **Opening:** Sarah presses the liability point. It's the core of revisionism.
      *   **Elias's Response (The Hard Part):** He can't just say "they follow orders." He needs to argue about the *nature of the threat* in war. Maybe the threat is *conditional* or *institutional* rather than personal. Or perhaps the right to kill in war isn't based on individual liability but on a collective permission. *Idea:* Focus on the "mutual risk" inherent in the institution of war as a tragic necessity. If we deny equality, we lose the ability to limit horror.
      *   **Sarah's Counter (The Epistemic/Culpability Problem):** She needs to address the "soldier as judge" worry. She can't just say "they should know." She needs a nuanced view on *excuses* vs. *justifications*. She also needs to address non-culpable unjust combatants. *Idea:* Distinguish between liability and blameworthiness. You can be liable to be killed (because you are an unjust threat) without being morally guilty (because you were misled). This is a standard McMahan move, but needs to be articulated clearly.
      *   **Elias's Pushback:** If they aren't blameworthy, why treat them as liable? If the epistemic bar is high, aren't we back to equality practically?
      *   **Sarah's Concession:** She must admit that in practice, the distinction might blur, or that the *rights* of unjust combatants are stronger than pure theory suggests. She needs to concede that the "liability" label is dangerous if applied too broadly.
      *   **Elias's Concession:** He must admit that the "instrument" view is dehumanizing. He needs to concede that there *is* a moral difference, even if the *rules* treat them equally. He can't maintain that the unjust soldier is *fully* clean.
      *   **Ending:** Ambiguous. Both shaken.

  4.  **Refining the Arguments (Self-Correction during drafting):**
