      *   *Check:* Did Sarah address culpability? *Correction:* Ensure she distinguishes *liability* (metaphysical status regarding harm) from *culpability* (moral blame). This is crucial for the revisionist response to "they didn't know."
      *   *Check:* Did they engage each other? *Correction:* Ensure Sarah responds directly to Elias's point about the breakdown of regulations, and Elias responds to the metaphysical point about liability.

  5.  **Final Polish:**
