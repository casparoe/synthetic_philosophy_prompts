          *   *Weakness:* It assumes Newtonian mechanics holds in an empty universe. GR changes the rules (Mach's Principle is partially baked into GR via frame dragging, though not fully).

      *   **The Hole Argument:**
          *   *The Setup:* General Relativity (GR). Spacetime manifold $M$, metric $g$, matter fields $T$.
          *   *The Move:* Diffeomorphism invariance. Take a solution $(M, g, T)$. Apply a smooth map $\phi$ (diffeomorphism) that is identity outside a region $H$ (the hole) but non-identity inside.
          *   *The Result:* $(M, \phi^*g, \phi^*T)$ is also a solution.
          *   *The Substantivalist Trap:* If points of $M$ have independent identity (substantivalism/haecceitism), then $(M, g, T)$ and $(M, \phi^*g, \phi^*T)$ represent distinct physical realities (the metric field is distributed differently over the *same* points).
