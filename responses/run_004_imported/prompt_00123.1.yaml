answer: |-
  You have hit on the central tension between **Causal Decision Theory (CDT)** and **Evidential/Functional Decision Theory (EDT/FDT)**, which is the engine driving Evidential Cooperation in Large Worlds (ECL).

  Your intuition is perfectly consistent with CDT, which is the dominant framework in classical economics and game theory. However, ECL explicitly rejects the CDT premise that *only* causal influence matters for rational decision-making.

  Here is a breakdown of why ECL proponents argue their view is coherent without requiring backward-in-time causation or magic, and how they interpret "probability" in this context.

  ### 1. The Core Disagreement: Causal vs. Evidential Leverage
  Your objection rests on the claim: *"My choice cannot causally affect what a causally disconnected agent does."*

  *   **CDT agrees:** Therefore, your choice provides no leverage. You should defect.
  *   **ECL (via EDT/FDT) disagrees:** Causal influence is not the only kind of relevance. What matters is **subjunctive dependence** or **logical correlation**.

  In ECL, the argument is not that your brain state sends a signal across the universe to change their brain state. The argument is that your decision and their decision are both outputs of similar computational processes.

  If you and the distant agent are sufficiently similar (same reasoning algorithms, same inputs, same goals), then your decision procedure and theirs are effectively instances of the same abstract function $f(input) \rightarrow output$.
  *   If you compute $f$ and output "Cooperate," it is logically implied that any other instance of $f$ with the same inputs also outputs "Cooperate."
  *   You do not *cause* them to cooperate. Rather, the fact that you cooperate is **evidence** (in EDT) or **logically necessitates** (in FDT) that they cooperate.

  ### 2. Does it raise the "Actual Probability"?
  You asked: *"How can cooperating on my end possibly raise the actual probability that they cooperate too?"*

  This depends on what you mean by "probability."

  **The Objective/Frequency View (Your View):**
  If the universe is deterministic and causally disconnected, the distant agent's action is already fixed in the block universe. Your action cannot change the "actual" state of the world elsewhere. From a "God's eye view," the correlation exists, but your local choice doesn't wiggle the distant outcome.

  **The Indexical/Subjective View (ECL View):**
  ECL operates from the perspective of the agent *before* the decision is made. You do not know which "copy" of the decision algorithm you are.
  *   There are many agents in the large world running similar algorithms.
  *   You are uncertain about the output of the abstract algorithm $f$.
  *   By choosing to Cooperate, you are effectively "selecting" the branch of logical possibility where $f(input) = \text{Cooperate}$.
  *   Since the distant agents are running $f$, selecting that logical branch updates the probability that *they* output Cooperate to 1 (or near 1).

  In this framework, you aren't changing a fixed future via magic; you are resolving a logical uncertainty that applies to all instances of your decision type simultaneously.

  ### 3. The "Backward Causation" Charge
  You asked: *"Doesn't ECL implicitly require something like backward-in-time causation?"*

  **No.** This is the most common misconception about EDT and FDT.

  Consider two calculators, one on Earth and one on Mars, both computing $2 + 2$.
  *   They are causally disconnected.
  *   If the Earth calculator displays "4", does it *cause* the Mars calculator to display "4"? No.
  *   Does the Earth calculator's display provide *evidence* about the Mars calculator's display? Yes.
  *   If you could somehow intervene on the Earth calculator to force it to display "5" (breaking the laws of arithmetic), would the Mars calculator change? No. But if you intervene on the *input* or the *algorithm*, both change.

  ECL treats agents like calculators. The correlation is due to a **common logical cause** (the algorithm/decision theory), not a physical signal traveling through space or time.
  *   **CDT** says: "I can't change their output, so I ignore them."
  *   **ECL** says: "My output is tied to theirs by logical identity. To get the outcome where they cooperate, I must be the kind of agent that cooperates."

  There is no backward causation because the correlation is timeless. It is grounded in mathematical truth, not temporal sequence.

  ### 4. Why "Large Worlds" Matters
  ECL is specifically potent in "Large Worlds" (infinite or vast universes) because:
  1.  **Copies are inevitable:** In a sufficiently large universe, there are likely exact or near-exact copies of you (Boltzmann brains, eternal inflation duplicates, simulations).
  2.  **Aggregate Impact:** Even if your causal reach is local, your *evidential* reach is universal. If there are a trillion copies of you, and your decision correlates with all of them, your "leverage" is the sum of all their actions.

  If you defect, you reason that "agents like me" defect. If a trillion agents like you defect, the total utility is low. If you cooperate, you reason that "agents like me" cooperate, leading to high total utility. You are effectively voting for a policy that all copies enact.

  ### 5. Summary: Heuristic or Ontology?
  You asked if ECL is just a "decision-theoretic heuristic."

  Proponents (like Caspar Oesterheld, Vincent Conitzer, and the MIRI/FDT crowd) argue it is **ontologically coherent**, not just a hack. They argue that CDT makes a category error by assuming that *causal* arrows are the only things that carry decision-relevant information.

  *   **If you accept CDT:** ECL looks like magic or superstition. You are correct that under CDT, ECL is incoherent.
  *   **If you accept FDT/EDT:** ECL is the rational application of logic to agents who recognize they are instantiations of abstract algorithms.

  **Conclusion:**
  ECL does not require backward causation. It requires accepting that **logical correlation is decision-relevant even in the absence of causal connection.** It posits that by making a choice, you are not just moving a local pawn, but determining the output of a logical function that may be instantiated elsewhere in the cosmos. Whether this is "real" leverage or a "useful illusion" depends entirely on whether you believe rational agents should maximize causal impact or expected value based on all correlations (including logical ones).

  If you hold that only causal mechanisms are real, ECL will always seem incoherent to you. If you hold that logical relationships are part of the fabric of decision-making, ECL is consistent without violating physics.
