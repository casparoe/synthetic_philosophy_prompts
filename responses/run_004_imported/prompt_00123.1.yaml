      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Core Question:** If my choice cannot *causally* affect a distant/disconnected agent, how does cooperating raise the *actual probability* that they cooperate?
      *   **Specific Challenge:** Doesn't ECL implicitly require backward-in-time causation (or some form of magic) to be coherent, rather than just being a decision-theoretic heuristic?
