prompt: |-
  Got into an argument about this on the ACX subreddit a while back and never got a satisfying answer, so hoping you can settle it. I've been rereading the Sequences and Yudkowsky's "conservation of expected evidence" post is one of those results everyone on LW treats as obviously true and kind of boring: if you can already predict which direction you'll update your credence in, you should just update now, since your expected future credence has to equal your current one -- that's basically just the law of total probability. Separately I've been poking around in formal epistemology (SEP rabbit hole, as always) and ran into van Fraassen's Reflection Principle, which says the same thing as far as I can tell: if your certain what your credence in some claim will be at a later time, your credence now should already equal that. He even backs it with an explicit Dutch book argument -- if you don't conform, a bookie can set up bets now and later that guarantee you a loss regardless of outcome.

  Except in that literature this is apparently a live, heavily contested principle, not some settled one-paragraph result. There's a whole back and forth of counterexamples (something about anticipating you'll be drunk, senile, or otherwise less reliable later, and I think a positive case involving a guru you know will end up being right), plus decades of people -- Christensen, maybe Talbott, don't remember exactly who -- proposing increasingly fiddly restrictions on when you're actually supposed to defer to your future self like that. If it's the same underlying mathematical result, why does the philosophy side treat this as such an open problem requiring decades of patches, when LW apparently nailed the whole thing in one moderately short blog post? Am I missing some real technical difference between the two principles, or is this just the same idea getting independently reinvented by two communities that don't read each other, with the philosophers being unnecessarily precious about it?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Why is "Conservation of Expected Evidence" (CEE) treated as a trivial, settled theorem in the LessWrong (LW)/Rationalist community, while the "Reflection Principle" (RP) in formal epistemology is treated as a controversial, heavily debated principle with many counterexamples and refinements?
      *   **User's Background:** Familiar with LW Sequences (Yudkowsky), ACX subreddit, and some formal epistemology (SEP, van Fraassen).
      *   **Hypothesis:** Is it the same math? Is one community missing something? Are philosophers being "unnecessarily precious"?
      *   **Goal:** Settle the argument by explaining the technical and conceptual differences between CEE and RP, validating the user's intuition that they are related while highlighting *why* the philosophical debate exists.

  2.  **Initial Knowledge Retrieval & Comparison:**
      *   **Conservation of Expected Evidence (CEE):**
          *   Source: Eliezer Yudkowsky (LessWrong).
          *   Core Idea: $E[P(H|E)] = P(H)$. Your current credence equals your expected future credence.
          *   Assumptions: Bayesian updating, logical omniscience (implicitly), no memory loss, no irrationality.
          *   Status in LW: Axiomatic/Trivial consequence of probability theory.
      *   **Reflection Principle (RP):**
          *   Source: Bas van Fraassen (1984).
          *   Core Idea: $P_t(H | P_{t'}(H) = x) = x$. If you know your future credence will be $x$, your current credence should be $x$.
          *   Status in Philosophy: Controversial.
          *   Counterexamples: Self-fulfilling prophecies, memory loss, irrationality (drunkenness), learning logic (logical omniscience issues).
      *   **Connection:** They look mathematically similar. CEE is essentially the expectation form of Reflection.
      *   **The Crux:** The *conditions* under which they hold. LW assumes an ideal Bayesian agent. Philosophy deals with non-ideal agents, indexical uncertainty, and the nature of "evidence."

  3.  **Deconstruct the Differences:**

      *   **Difference 1: Idealization vs. Reality.**
          *   LW/CEE: Assumes you are a perfect Bayesian updater. You won't forget, you won't get drunk, you won't make calculation errors.
          *   Philosophy/RP: Asks "What if I *know* I will be irrational?" If I know I will be drunk tomorrow, should I reflect my drunk credence today? No. But CEE assumes I update correctly.
          *   *Key Insight:* CEE is a theorem *about* Bayesian agents. RP is a normative principle proposed for *actual* agents.

      *   **Difference 2: The Nature of "Evidence" and "Learning".**
          *   CEE assumes standard conditionalization. You learn $E$, you update to $P(H|E)$.
          *   RP counterexamples often involve "learning" things that aren't standard evidence (e.g., remembering you forgot something, or realizing you are biased).
          *   *Example:* The "Forgetful Driver" or "Sleeping Beauty" type problems. If I know I will lose evidence, my expected credence might shift, but not via standard conditionalization.

      *   **Difference 3: Logical Omniscience.**
          *   CEE implicitly assumes you know all logical consequences of your beliefs.
          *   RP struggles with logical learning. If I expect to solve a math problem tomorrow, my credence in the solution changes. But did I get "evidence"?
          *   Garber-style solutions exist, but it complicates the simple CEE picture.

      *   **Difference 4: Formulation.**
          *   CEE: $E[P_{future}(H)] = P_{current}(H)$. (Expectation form).
          *   RP: $P_{current}(H | P_{future}(H) = x) = x$. (Conditional form).
          *   The conditional form is stronger and more vulnerable to counterexamples (e.g., if the event $P_{future}(H)=x$ is correlated with $H$ in a way that isn't just evidence).

  4.  **Synthesize the Argument:**

      *   **Acknowledge the similarity:** Yes, they are mathematically cousins. The user is right that the core intuition is the same.
      *   **Validate the LW perspective:** Within the framework of ideal Bayesianism, CEE is indeed a trivial theorem. LW is prescriptive ("This is how a perfect mind works").
      *   **Validate the Philosophy perspective:** Philosophy is descriptive/normative for bounded agents ("How should humans act given they aren't perfect?"). The debate isn't about the math of probability, but about the *applicability* of the model to agents who change in non-evidential ways.
      *   **Highlight Specific Counterexamples:**
          *   *Drunkenness:* I know tomorrow I'll be overconfident. RP says defer to future self. Intuition says don't. CEE says you won't update that way if you're rational.
          *   *Memory Loss:* If I know I will forget evidence, my credence changes, but not by conditionalization on new evidence.
          *   *Self-Fulfilling Beliefs:* Believing I will succeed makes me succeed.
      *   **Conclusion:** It's not that philosophers are "precious" and LW is "smart." It's that LW focuses on the *ideal limit* (where the theorem holds), while philosophy focuses on the *boundary conditions* (where the theorem breaks for real agents).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, analytical, bridging the two cultures (LW vs. Academic Phil).
      *   *Structure:*
          1.  Direct Answer: You're half-right (math is same), but missing the scope difference.
          2.  The Mathematical Link: Show the equation connection.
          3.  The Crucial Divergence: Ideal vs. Non-Ideal Agents.
          4.  The Counterexamples (The "Why it's contested" part): Drunkenness, Memory, Logical Omniscience.
          5.  The "Dutch Book" nuance: Diachronic vs. Synchronic.
          6.  Summary: LW = Normative Ideal, Phil = Normative Realism.

      *   *Refining the "Dutch Book" point:* Van Fraassen's Dutch Book is diachronic. Lewis's counter-argument involves memory loss. Need to mention that standard Dutch Book arguments assume you remember your previous bets/credences. If you forget, the bookie can't exploit you in the same way, or the exploitation looks different.
      *   *Refining the "CEE" point:* Yudkowsky's CEE is often presented as "You can't anticipate updating in a specific direction." This is true *if* you are updating on evidence. If you are updating because your brain is rotting, that's not evidence. LW usually handwaves this by saying "Don't be irrational." Philosophy asks "What if you know you will be irrational?"

  6.  **Final Polish:** Check names (van Fraassen, Christensen, Talbott, Arntzenius). Ensure the distinction between *descriptive* (how beliefs change) and *normative* (how they *should* change) is clear. Emphasize that LW treats it as a *check* on rationality, whereas Philosophy treats it as a *principle* of rationality.

      *(Self-Correction during drafting)*: I should make sure not to dismiss the LW view. CEE *is* a theorem of probability. The philosophical debate is about whether probability theory *alone* captures rational belief change for temporally extended agents. That's the key. It's about the *philosophy of time and identity* as much as math.

  7.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  You have stumbled onto one of the most interesting cultural divides in modern rationality discourse. You are correct that the underlying mathematics are nearly identical, but you are missing the crucial difference in **scope and idealization** between the two communities.

  The short answer is: **LessWrong treats Conservation of Expected Evidence (CEE) as a theorem about ideal Bayesian agents, while formal epistemology treats the Reflection Principle (RP) as a normative principle for non-ideal, temporally extended agents.**

  The philosophers aren't being "unnecessarily precious"; they are grappling with edge cases that the Rationalist community typically defines away as "irrationality."

  Here is the breakdown of why the same math leads to such different sociological outcomes.

  ### 1. The Mathematical Identity
  You are right that the core intuition is the same.
  *   **CEE:** $E[P_{future}(H)] = P_{current}(H)$. Your current credence is the expectation of your future credence.
  *   **RP:** $P_{current}(H \mid P_{future}(H) = x) = x$. If you know your future credence will be $x$, your current credence should be $x$.

  Under standard probability theory, assuming the agent is certain about what their future credence function will be, these are effectively equivalent. If you accept the axioms of probability and the definition of conditionalization, CEE is indeed a trivial one-line proof.

  ### 2. The Divergence: Ideal vs. Non-Ideal Agents
  The LessWrong/Sequences approach is **prescriptive idealization**. When Yudkowsky writes about CEE, the implicit model is a "Perfect Bayesian." This agent:
  1.  Never forgets evidence.
  2.  Never suffers cognitive degradation (drunkenness, fatigue).
  3.  Is logically omniscient (or at least consistent).
  4.  Updates strictly via conditionalization on new evidence.

  For a Perfect Bayesian, CEE is a tautology. If you anticipate updating in a specific direction *without new evidence*, you are already irrational, so you should update now. The LW community treats this as a "sanity check": if you think you will believe $X$ tomorrow, but you don't believe $X$ today, one of those beliefs is wrong.

  Formal epistemology, however, is interested in **normative realism**. They ask: "What are the rules for agents who exist in time and are subject to physical changes?" The debate arises because there are scenarios where an agent is *rationally certain* their future self will have a different credence, but *should not* adopt that credence now.

  ### 3. The Counterexamples (Why Philosophers Fight)
  If CEE/RP were universally true, these scenarios wouldn't exist. The fact that they do exist is why the philosophy literature is "messy."

  **A. The "Drunkenness" / Cognitive Decay Case**
  *   **Scenario:** I know that tomorrow I will be drunk. When drunk, I become overconfident in my ability to drive safely.
  *   **RP Implication:** If I am certain my future credence in "I am safe to drive" will be 99%, my current credence should be 99%.
  *   **Intuition:** Obviously not. I should currently believe I am *not* safe to drive, precisely because I know my future self is unreliable.
  *   **LW Response:** "That's not updating on evidence; that's brain damage. Don't do that."
  *   **Phil Response:** "But the agent *knows* it will happen. A principle of rationality should tell us how to handle known future irrationality."

  **B. Memory Loss (The Arntzenius/Christensen cases)**
  *   **Scenario:** I know that tomorrow I will suffer temporary amnesia and forget a specific piece of evidence $E$ that I currently hold.
  *   **RP Implication:** My future credence will be lower (since I lost evidence supporting $H$). Therefore, I should lower my credence now.
  *   **Problem:** Standard conditionalization (which CEE relies on) assumes you keep old evidence. If you lose evidence, you aren't conditionalizing; you are "shifting."
  *   **Phil Debate:** How do we formalize "shifting"? Christensen and others have spent decades trying to patch Reflection to account for memory loss without breaking the Dutch Book arguments.

  **C. Self-Fulfilling Beliefs**
  *   **Scenario:** I believe that if I am confident I will succeed, I will work harder and actually succeed.
  *   **RP Implication:** I should adopt the high credence now to make it true.
  *   **Problem:** My future credence isn't reflecting *evidence* about the world; it's *causing* the world to change. This violates the assumption that evidence is exogenous.

  **D. Logical Omniscience**
  *   **Scenario:** I expect to solve a math problem tomorrow.
  *   **RP Implication:** I should believe the solution now.
  *   **Problem:** I am not logically omniscient. I cannot just "update" on a logical truth I haven't proven yet. CEE breaks down for bounded agents learning logic.

  ### 4. The Dutch Book Nuance
  You mentioned van Fraassen's Dutch Book argument. This is a key point of contention.
  *   **Van Fraassen:** If you violate Reflection, a bookie can construct a series of bets (one today, one tomorrow) that guarantee a loss.
  *   **The Counter:** This Dutch Book only works if the agent remembers the first bet and the reasoning behind it. If the agent suffers memory loss (or is drunk), they might accept the second bet without realizing it locks in a loss with the first bet.
  *   **Conclusion:** The Dutch Book argument for Reflection *presupposes* perfect memory and rationality. If you admit the possibility of memory loss, the Dutch Book evaporates, and the obligation to follow Reflection weakens.

  ### 5. Why the Cultural Difference?
  **LessWrong** is focused on **AI and Mind Design**.
  When you are designing an AI (or trying to optimize your own thinking), you treat CEE as a constraint. If your AI anticipates updating in a direction without evidence, you fix the bug. You assume the goal is to *become* the Perfect Bayesian. Therefore, CEE is treated as settled because, in the target domain (ideal reasoning), it *is* settled.

  **Formal Epistemology** is focused on **Human Knowledge**.
  Philosophers are analyzing the concept of knowledge as it applies to beings who forget, get tired, and learn logic over time. They aren't allowed to just say "don't be drunk." They have to explain *why* deferring to your drunk self is wrong within the formalism. This requires adding qualifiers to Reflection (e.g., "Restricted Reflection," "New Reflection"), leading to the "fiddly restrictions" you noticed.

  ### Summary
  You aren't missing a technical difference in the probability calculus. You are missing a difference in **domain application**.

  *   **CEE (LW):** A theorem about **ideal coherence**. "If you are rational, this holds."
  *   **RP (Phil):** A proposed principle of **diachronic rationality**. "Does this hold for agents who change over time?"

  The philosophers aren't reinventing the wheel; they are investigating what happens when the wheel is square. The LessWrong community assumes you should round the wheel. Both perspectives are useful, but conflating them leads to the exact confusion you experienced on the ACX subreddit.

  **The Verdict:** The math is the same. The LW take is "This is how a perfect mind works." The Phil take is "Humans aren't perfect minds, so when does this rule break?" Both are correct within their own frames.
