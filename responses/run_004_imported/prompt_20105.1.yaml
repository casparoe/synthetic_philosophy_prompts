  7.  **Final Polish:** Check the flow and ensure the distinction between the *Prize* (symbolic/certification) and the *Fellowship* (resource) is clear. The Prize validates the field; the Fellowship supports it. You cannot sacrifice the validation to fund the support, or the support loses its prestige.

