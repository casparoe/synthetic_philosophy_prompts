answer: |-
  **Setting:** *A conference room in St. Jude's Hospital. The Ethics Board is in session. On the table lies a single file: two patients, one kidney, identical medical compatibility and urgency. The only remaining question is the allocation mechanism. To the left sits Dr. Aris, a health economist and proponent of Harsanyi's Utilitarianism. To the right sits Dr. Dia, a political philosopher and proponent of Diamond's Critique. The Board Chair, Ms. Vance, moderates.*

  **Ms. Vance:** Thank you both for coming. We have one kidney and two patients, Mr. X and Mr. Y. Medically, they are identical. Ethically, we are split between a simple coin flip and a weighted lottery based on a complex algorithm of social value factors that, by design, yields the exact same 50/50 probability for each patient. Dr. Aris, your position?

  **Dr. Aris:** It is straightforward. If the patients are rational agents, they care about expected utility. If Procedure A (the coin) and Procedure B (the algorithm) both yield a 50% chance of survival, the expected utility for Mr. X and Mr. Y is identical. Harsanyi's Aggregation Theorem proves that if the social planner respects individual rationality and the Pareto principle—meaning if everyone is indifferent between two options, society should be too—then the social welfare function must be a weighted sum of individual utilities. Since the sum is identical, the Board *must* be indifferent. To prefer the coin is irrational sentimentality.

  **Dr. Dia:** With respect, Dr. Aris, that is precisely where Harsanyi fails to capture moral reality. The theorem assumes social welfare is nothing more than the sum of ex-ante individual preferences. But fairness is not just a mathematical input; it is a property of the social process itself. Mr. X and Mr. Y are not just utility containers; they are citizens entitled to equal treatment. A coin flip treats them as equals *in the moment of decision*. Your "algorithm," even if it yields 50/50 odds, treats them as data points in a black box. We care about *ex-post* fairness, not just *ex-ante* probabilities.

  **Dr. Aris:** You're smuggling in a variable that doesn't exist in the utility function. If Mr. X knows the algorithm gives him a 50% chance, and he knows the coin gives him a 50% chance, and he is indifferent, on what grounds do you, the planner, claim he *shouldn't* be? If you override his indifference, you are violating the Pareto principle. You are saying you know what is good for him better than he does, despite his preferences satisfying all axioms of rationality. That is paternalism, not ethics.

  **Dr. Dia:** I am not overriding his preference regarding the *odds*. I am overriding the Harsanyi assumption that the *source* of the odds is morally irrelevant. Peter Diamond's objection was specifically about this: social preferences should not necessarily mirror individual ex-ante preferences because society bears a responsibility for the *distribution of final outcomes*, not just the lottery tickets. If we use the algorithm, and Mr. X loses, he might reasonably feel he was processed. If he loses the coin flip, he knows he was treated with the same symmetrical respect as Mr. Y. The "procedural fairness" adds value to the social welfare function that isn't captured in the individual's probability calculation.

  **Dr. Aris:** But that "value" you're talking about is elusive. If you claim procedural fairness adds utility, then the patients *wouldn't* be indifferent. They would prefer the coin. But let's stick to the thought experiment: suppose they *are* truly indifferent. They don't care about the method, only the survival chance. Harsanyi shows that if you, the planner, *do* care about the method when they don't, your social welfare function becomes non-linear. You open the door to inconsistency. You could be money-pumped. You could prefer the coin over the algorithm, the algorithm over a die roll, and the die roll over the coin, violating transitivity. Do you want an Ethics Board that is logically incoherent?

  **Dr. Dia:** I would rather have a Board that is morally coherent than one that is mathematically pristine but ethically blind. Your "inconsistency" charge relies on the idea that the only thing that matters is the final probability distribution. But consider the "Sure Thing" principle. Harsanyi requires that if we are indifferent between two lotteries, we must be indifferent between them even when combined with other outcomes. But in social justice, context matters. The coin flip is a public ritual of equality. It signals that the state values these two lives equally. The algorithm, even with the same odds, signals that their lives are subject to optimization. That signal has real social utility—trust in the medical system—that isn't captured in Mr. X's immediate survival probability.

  **Dr. Aris:** I grant that trust matters. But then we simply add "trust" to the utility function. If the coin flip generates more trust, then the patients' expected utility from the coin flip is actually *higher* than the algorithm. In that case, Harsanyi's theorem still holds: we choose the coin flip because the weighted sum of utilities is higher. But you are arguing something stronger. You are arguing that even if the trust was identical, even if the patients truly didn't care, the Board should still prefer the coin. That implies the social welfare function is not a sum of individual utilities. It implies the Board has a preference *over and above* the constituents. Who elected the Board to have its own moral ontology separate from the people it serves?

  **Dr. Dia:** The Board represents the *community*, not just the two claimants. Harsanyi's theorem works for a closed system of consumers. It fails for a political community. Diamond's point is that we care about inequality in *realized* well-being, not just expected well-being. A coin flip minimizes the regret of the loser because the process was transparently fair. The algorithm leaves room for suspicion: "Did the weights really favor me?" Even if they didn't, the *possibility* of bias creates a social cost. But deeper than that: if we accept Harsanyi, we must accept that a world where one person gets everything with 1% probability and 99 people get nothing is socially equivalent to a world where everyone gets 1% of everything, provided the expected utilities match. That is a reductio ad absurdum of your position.

  **Dr. Aris:** That is a straw man. Harsanyi aggregates *actual* preferences. If the 99 people prefer equality, that preference enters the sum. But back to the kidney: You argue for ex-post fairness. But ex-post, one person dies regardless of the method. The only thing we control is the ex-ante chance. If you reject the linear aggregation, you have no metric for trade-offs. Suppose we could give Mr. X a 51% chance and Mr. Y a 49% chance using a medical optimization tool, increasing total survival utility slightly. Harsanyi says: take the gain. Diamond seems to say: no, strict equality of chance is required, even at the cost of total welfare. If you privilege the *procedure* over the *outcome*, aren't you fetishizing the means? If the algorithm saves 1% more kidneys overall in the long run due to better matching, would you still ban it for a coin flip?

  **Dr. Dia:** If the algorithm sacrifices equal respect for efficiency, yes, I would ban it. There is a constraint of rights that utility cannot cross. But to answer your specific challenge: Harsanyi forces the planner to be indifferent between a coin flip and a "convoluted points system" if the odds are the same. My point is that the points system violates the *equality of status* between the patients. The coin flip acknowledges that we have no relevant reason to choose X over Y. The algorithm implies there *are* relevant reasons, but we are hiding them in weights. By insisting on the coin, we are not maximizing utility; we are honoring a duty of equal concern. Harsanyi reduces morality to arithmetic. I am arguing that arithmetic cannot capture the moral residue of leaving one person to die.

  **Dr. Aris:** And I am arguing that "moral residue" is a feeling, not a justification for policy. If you cannot quantify why the coin is better in terms of human welfare—trust, anxiety, dignity—then you are asserting a mystical property of "fairness" that exists nowhere in the human experience. If it affects human experience, it affects utility. If it affects utility, Harsanyi captures it. If it *doesn't* affect utility or preferences, why should the Board care? You are essentially arguing for a rule that makes the patients no better off, and potentially worse off if the algorithm is more efficient, solely to satisfy a deontological constraint. Is the Ethics Board here to maximize patient welfare, or to perform rituals of purity?

  **Dr. Dia:** I am arguing that the *process* constitutes part of the welfare. You cannot separate the "ritual" from the "welfare" because humans are symbolic animals. But let me turn your own theorem against you. Harsanyi requires the planner to have vNM rationality. But vNM rationality applies to *individuals* facing risk. Society is not an individual. Society does not face the risk of death; Mr. X does. When you aggregate, you wash out the distinctness of persons. You treat the 50% loss for X and 50% loss for Y as a single "1 expected death." But in reality, one whole person dies. Diamond's critique is that Harsanyi ignores the separateness of persons. The coin flip acknowledges that distinctness; the aggregation dissolves it.

  **Dr. Aris:** The separateness of persons is preserved in the weights! Mr. X's utility is $U_x$, Mr. Y's is $U_y$. They are distinct terms in the sum. I am not melting them into a blob. I am saying that if $U_x$ and $U_y$ both register indifference between the coin and the algorithm, the sum registers indifference. If you claim the sum should *not* be indifferent, you must identify a third term. $U_{society}$. But who defines that? If you define it as "fairness," you are circular. If you define it as "trust," I put that in $U_x$. You are left with either redundancy or tyranny.

  **Dr. Dia:** And you are left with a system that cannot distinguish between a fair lottery and a rigged one that happens to produce the same odds. If I tell you the rigged system was designed by a racist who *intended* to discriminate but failed due to mathematical error, Harsanyi says: "The odds are 50/50, so it is morally equivalent to the coin." I say: "No. The history and the structure matter." The Ethics Board must judge the *action*, not just the *consequence*.

  **Dr. Aris:** If the consequence is truly identical for all parties involved, including their knowledge and psychological state, then the "history" is metaphysical baggage. But I will concede this: if the knowledge of the history changes their utility, the theorem accounts for it. So, our disagreement is empirical. You believe people *should* care about the history even if it doesn't change their odds. I believe that if they are rational, they only care about the odds. If the Board adopts your view, you are imposing a preference for "purity" that the patients might not share. Is that not the definition of elitism?

  **Dr. Dia:** It is not elitism to protect the structural integrity of the institution. Patients are vulnerable. They are in a crisis. We cannot rely on their immediate preferences to set the rules of justice. We need rules that stand up to scrutiny when they are *not* in crisis. Harsanyi's theorem is a tool for consumption choices, not for life-and-death justice. If we accept your view, we admit that justice is just another commodity to be traded for efficiency. I say justice is the framework within which trade happens.

  **Ms. Vance:** Gentlemen, we are out of time. Dr. Aris, you argue that deviating from the weighted sum violates rationality and individual sovereignty. Dr. Dia, you argue that rationality is insufficient to capture the moral requirement of equal treatment and the separateness of persons.

  **Dr. Aris:** Precisely. Without the theorem, we have no objective way to weigh trade-offs.

  **Dr. Dia:** And with it, we have no way to distinguish a fair society from a lucky one.

  **Ms. Vance:** The Board will deliberate. We must decide whether our duty is to the mathematics of welfare or the symbolism of justice. Thank you both.
