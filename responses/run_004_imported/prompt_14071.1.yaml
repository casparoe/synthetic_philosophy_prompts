          *   Conclusion: Social Welfare Function (SWF) must be a linear combination of individual utilities.
          *   Implication for the Kidney: If Patient A and Patient B both value a 50% chance equally, the *method* of generating that 50% chance doesn't matter morally, only the expected utility matters. A coin flip and a rigged complex system with the same probabilities are equivalent.
