answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, **Iris** (Internalist, Williams-aligned) and **Elias** (Externalist, Korsgaard-aligned), are finishing up a seminar on Meta-Ethics. The whiteboard behind them still has a diagram of Bernard Williams' "Subjective Motivational Set" (S).*

  **Iris:** So, did the reading land for you? Williams' take on Owen, the cruel husband?

  **Elias:** It lands. It's seductive. It feels clean. But I think Williams gets away with murder in that essay by smuggling in a definition of "reason" that begs the question.

  **Iris:** How so? It seems like the most naturalistic account we have. If I tell you, "You have a reason to drink this," but you have no desire to quench thirst, no desire to stay alive, and you think it's petrol... in what possible world is that statement true? It's not just false; it's empty. It doesn't *do* anything.

  **Elias:** It does something crucial: it holds a standard over you. But let's move off Owen for a second. Cruelty triggers moral alarms that muddy the water. Let's use the case you mentioned in your email—let's call him Marcus. Marcus smokes two packs a day, spends all his money, and saves nothing. When you ask him about retirement, he says, "Future Marcus is a stranger. I don't care about him. I want the smoke now."

  **Iris:** Okay. Marcus. On Williams' view, we look at his $S$—his subjective motivational set. It contains a desire for immediate pleasure. It contains, explicitly, *no* desire for future welfare. If there is no sound deliberative route from "I want pleasure now" to "I should save money," then Marcus has no reason to save.

  **Elias:** And that's where I stop you. Because you want to say Marcus is being *irrational*. Not just immoral, not just weird, but irrational. But if Internalism is true, you can't say that. You can only say his $S$ is different from yours.

  **Iris:** I can say he's irrational if he's making a cognitive error. Williams allows for that. If Marcus thinks smoking won't kill him, he's wrong on the facts. Sound deliberation corrects false beliefs. If he realizes smoking causes cancer, maybe a latent desire for self-preservation kicks in.

  **Elias:** But stipulate that he knows the facts. He knows it causes cancer. He knows he'll be destitute. He just *doesn't care*. He says, "I accept the trade." If Internalism holds, you have to say, "Well, if nothing in your $S$ cares about the future, then rationality is silent." But rationality *isn't* silent. We feel the force of the reason even if he doesn't.

  **Iris:** Here's the rub, Elias: What is that "force" supposed to be? If it can't motivate him, even after he knows all the facts and deliberates clearly, then in what sense is it a *reason for him*? It sounds like you're positing a metaphysical magnet that only pulls on people who already like metal. Williams is trying to explain how reasons actually *guide* action. If a reason can exist without any hook in the agent's psychology, it's a ghost.

  **Elias:** It's not a ghost; it's a constitutive norm. Look, think about instrumental rationality. You LessWrong types love instrumental rationality. "Rationality is about winning." But Korsgaard's point is that instrumental rationality itself rests on a foundation that Internalism can't provide.

  **Iris:** Go on.

  **Elias:** Instrumental reason says: "If you will the end, you ought to will the means." But why? Why is it a *violation* of reason to will the end and not the means?

  **Iris:** Because it's inefficient? Because you won't get what you want?

  **Elias:** Exactly. You won't get what you *want*. But why *should* you care about getting what you want? Why is satisfying your own desires a rational requirement?

  **Iris:** Because that's what having a desire *is*. To desire $X$ is to be disposed to bring about $X$. If you aren't disposed to take the means, you didn't really desire the end. It's analytic.

  **Elias:** Is it? Marcus desires the smoke. He takes the means (buying cigarettes). He *also* desires health, hypothetically, but he discounts the future to zero. Internalism says as long as the math of his desires checks out, he's rational. But there's a norm missing. The norm is: *You must value yourself as a temporally extended agent.*

  **Iris:** That sounds like an external reason if I've ever heard one! You're saying Marcus has a reason to care about his future self *even if* nothing in his $S$ cares about his future self.

  **Elias:** I'm saying that to be an agent at all—to act rather than just twitch—you have to endorse your impulses. When Marcus chooses to smoke, he's endorsing that impulse as a law for himself. But he can't consistently endorse a law that destroys his capacity to act in the future. He's undermining his own agency.

  **Iris:** Okay, but let's bring it back to the "Sound Deliberation" clause. Williams isn't a crude desire theorist. He says $S$ isn't static. Deliberation isn't just calculating means. It's imagining outcomes. If Marcus really, vividly imagines Future Marcus coughing up blood in a hospital bed, alone and broke... does that not *create* a motive?

  **Elias:** It might. But what if it doesn't? What if Marcus says, "I see the blood. I see the poverty. I still don't care."

  **Iris:** Then he's a psychopath. Or he's inhuman. But saying "He has a reason to save" is still doing no work. It's just a way of saying "I wish he were different."

  **Elias:** No, it's saying he's *wrong*. Not just morally wrong, but rationally wrong. Here's the crux, Iris: You think the normativity comes from the *desire*. I think the normativity comes from the *reflection*. When Marcus reflects on his desire to smoke, he has to ask, "Is this a good reason?" To ask that question is to step outside the mere causal push of the desire.

  **Iris:** But where does he get the standard for "good"?

  **Elias:** From the fact that he's an agent. He values his own humanity. Korsgaard argues you can't act without valuing your own capacity to choose. If you value your capacity to choose now, you must value it in the future. Otherwise, you're treating your future self as a mere thing.

  **Iris:** This feels like you're defining "rationality" as "morality" and then acting surprised when they match. Williams wants to separate them. There are things you have reason to do because you care about them (prudence, projects), and there are things you ought to do because they're right (morality). If Marcus doesn't care about prudence, reason runs out. Morality might still apply, but that's a different battle.

  **Elias:** But you can't separate them if the ground of prudence is the same as the ground of morality. Both come from the requirements of agency. If you say "Reason runs out," you're left with no way to criticize Marcus except from the outside. You're just throwing blame at him.

  **Iris:** I'm not throwing blame! I'm analyzing the conditions of his action. If I tell a man he has a reason to stop drinking petrol thinking it's gin, I'm appealing to his desire not to die. If he says, "I want to die," the reason vanishes. Why is the future case different?

  **Elias:** Because the desire not to die isn't just one desire among others. It's a condition of having desires at all. You can't coherently will the destruction of the will.

  **Iris:** Marcus isn't willing the destruction of the will *now*. He's trading off present satisfaction against future capacity. That's a preference. You might think it's a bad preference. I might think it's a bad preference. But where is the *reason* that binds him if he rejects the preference ranking?

  **Elias:** The reason is that he is one person. The "Future Marcus" isn't a stranger. That's a cognitive error, deeper than a factual one. It's an error about identity.

  **Iris:** Ah, so now it's a cognitive error! We're back to my point. If it's a cognitive error, Williams agrees! Sound deliberation corrects errors about identity. If Marcus realizes "Future Marcus is me," maybe that triggers a protective instinct in $S$.

  **Elias:** But what if he says, "I know it's me. I just don't care about that guy"?

  **Iris:** Then I say he has no reason. And I ask you: If you say he *does* have a reason, what is that reason *made of*? Where does it live? If it's not in his psychology, and it's not a fact about the world like "petrol burns," it's a queer entity.

  **Elias:** It lives in the public space of reasons. It's not a psychological state; it's a normative status. Look, Iris, your view makes rationality too contingent. It makes the authority of reason depend on whether you happen to have the right desires. That means a sufficiently alien creature—someone with no self-interest, no empathy—would be beyond the reach of reason.

  **Iris:** Yes! Exactly. If there's a creature that doesn't care about anything that reason could point to, then reason *can't* reach them. Why is that a problem? It's honest. Your view tries to save the authority of reason by making it magical. You want to say "You have a reason" even to the person who says "I reject all reasons."

  **Elias:** I want to say that if they reject *all* reasons, they aren't an agent anymore. They're a force of nature. But as long as they are asking "What should I do?", they are in the game. And the rules of the game say you must value your future agency.

  **Iris:** But Marcus isn't asking "What should I do?" in the normative sense. He's asking "What do I want to do?" And he knows the answer.

  **Elias:** But by asking "What do I want?", he's implying that his wants are worth following. Why are they worth following?

  **Iris:** Because they're *his*. That's the bedrock.

  **Elias:** And that's where we split. You think the bedrock is the *ownership* of the desire. I think the bedrock is the *worthiness* of the desire.

  **Iris:** But "worthiness" implies a standard outside the agent.

  **Elias:** It implies a standard *constitutive* of the agent. Like the rules of chess. If you move your rook diagonally, you aren't just playing a "different game." You're breaking the rules that make the move a *chess move*. If Marcus ignores his future self, he's breaking the rules that make his choice an *action* rather than an event.

  **Iris:** I worry that this makes "rationality" just a word for "the desires I approve of." If Marcus really, truly doesn't care, and you say "He's irrational," you're just saying "He's not like me."

  **Elias:** No, I'm saying he's failing to be a unified self. But let's meet in the middle. Williams' "Sound Deliberation" is doing a lot of heavy lifting. If deliberation expands $S$ to include concern for the future via imagination...

  **Iris:** ...Then the Externalist says the *requirement to deliberate soundly* is the external reason.

  **Elias:** Precisely. You admit he ought to deliberate soundly. I say that "ought" doesn't come from $S$. It comes from Reason itself.

  **Iris:** And I say if he refuses to deliberate, you can't say he's irrational. You can only say he's unreasonable.

  **Elias:** Is there a difference?

  **Iris:** Huge difference. "Irrational" means his machinery is broken. "Unreasonable" means his machinery works fine, but he's aiming it at things we hate. Williams wants to reserve "reason" for the machinery. You want to use it for the aim.

  **Elias:** But the machinery *determines* the aim. If the machinery of practical reason is working, it *outputs* concern for the future.

  **Iris:** Only if the input includes a concern for the future! Garbage in, garbage out.

  **Elias:** No. *No* input, no output. But if there is *any* input—if he values anything at all—reason demands he value the conditions of that valuing.

  **Iris:** (Pauses, stirs coffee) So your claim is that valuing the smoke *entails* valuing the future self?

  **Elias:** It entails valuing the self who smokes. And that self persists. To value the act is to value the agent.

  **Iris:** Marcus would say, "I value the act. I don't value the agent. The agent is just the vessel."

  **Elias:** Then Marcus is in a state of practical contradiction. He is using his agency to undermine his agency.

  **Iris:** And I say: So what? People live in contradiction all the time. It's not my job as a philosopher to tell them they're logically broken. It's my job to tell them what reasons they actually have. And if he has no motive to stop, he has no reason to stop. I'd rather tell a hard truth than a comforting fiction.

  **Elias:** And I'd rather offer a standard that saves us from saying "Hitler had no reason to be kinder" if his $S$ was sufficiently dark.

  **Iris:** (Sighs) Okay. That's the crux, isn't it? For you, "Reason" is a shield against the abyss. If we lose External Reasons, we lose the ability to say evil is *irrational*.

  **Elias:** Yes. If Internalism is true, evil is just a different preference set.

  **Iris:** And for me, "Reason" is a map. If the map shows a territory that doesn't exist—reasons that don't connect to motives—then the map is lying. I'd rather say evil is *motivated* and hard to stop, than say it's *irrational* and therefore avoidable by thinking harder.

  **Elias:** So you think Externalism gives false hope?

  **Iris:** I think it gives false *leverage*. You tell Marcus he has a reason, he says "Show me," and you say "It's in the nature of agency." He laughs and lights up. If I tell him, "You have no reason unless you find a way to care," at least I'm telling him where the work actually is. He needs to change his $S$, not check his logic.

  **Elias:** But how does he change his $S$? By deliberating. And deliberation is governed by...

  **Iris:** ...Norms. I know. We're back at the start.

  **Elias:** (Smiles) We are. But at least we know the stalemate isn't about definitions. It's about whether you think normativity is something we *find* or something we *make*.

  **Iris:** Or something we *are*.

  **Elias:** Exactly. Something we are.

  **Iris:** Well. Marcus is still smoking.

  **Elias:** And we're still arguing.

  **Iris:** Cheers to that.

  *(They clink coffee mugs.)*
