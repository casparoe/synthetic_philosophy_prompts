      *   **Round 3: Realist Move 2 (The No-Alternatives/Selectionist Argument).** Alex shifts ground. Maybe it's not about the *generation* but the *survival*. Theories undergo severe testing. Or, use the "Darwinian" argument (van Fraassen actually uses this against Realists, so Alex needs to flip it or use a variant like the "No Alternatives" argument from string theory contexts, or better, the *retroductive* success argument). Let's go with a "Constraint on Possibility Space" argument. The space isn't infinite; nature forces our hand.
      *   **Counter:** Sarah points out that "forcing our hand" is just empirical adequacy again. We can always construct an empirically equivalent rival (underdetermination).
      *   **Round 4: The Shift/Movement.** They realize the disagreement isn't about logic, but about the *stance* towards science. Alex admits IBE isn a rule of inference but a commitment. Sarah admits empiricism requires a leap too (agnosticism vs. disbelief).
