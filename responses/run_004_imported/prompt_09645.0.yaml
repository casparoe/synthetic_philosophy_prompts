      *   **No Miracles Argument:** (Realist staple, but needs to be used carefully to avoid the "just works" trap).
      *   **Underdetermination:** (Empiricist staple).
      *   **Darwinian/Selectionist accounts of theory choice:** (A potential Realist move).
      *   **Pragmatic vs. Epistemic virtues:** (The core friction point).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Drinks, post-talk decompression. Establish the conflict immediately.
      *   **Round 1: The Bad Lot Objection.** Sarah brings it up. Alex tries the standard Lipton defense (Loveliest guides us to Likeliest). Sarah counters: Loveliness is subjective/pragmatic, not truth-tracking.
      *   **Round 2: Realist Move 1 (The Filtering/Generation Argument).** Alex argues that theory generation isn't random; it's constrained by background knowledge. We don't just pull hypotheses from thin air.
