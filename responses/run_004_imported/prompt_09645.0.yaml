      *   Bad Lot pressed hard? Yes.
      *   Two distinct Realist replies? (1. Lipton's tracking heuristic, 2. The constraint of background theory limiting the "lot").
      *   Substantive comebacks? Yes.
      *   Movement? Yes, shifts from logic of IBE to the pragmatic stance of doing science.

