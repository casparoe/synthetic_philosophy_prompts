prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm reporting a feature on where legitimate persuasion ends and manipulation begins. Rather than start from a single abstract definition, I want to test the boundary against specific, well-documented influence techniques drawn from negotiation, medicine, therapy, commerce, technology, and politics. Please sort the following seven techniques into three tiers — Legitimate, Borderline, and Manipulative — according to how far each bypasses, rather than engages, the target's rational agency:

  - Anchoring: opening a negotiation with a deliberately extreme first offer
  - Survival framing: presenting a treatment's outcome in terms of survival rates rather than the mathematically equivalent mortality rates
  - Motivational interviewing: a counselor drawing out a client's own stated reasons for change rather than arguing for change directly
  - Scarcity messaging: "only 2 left in stock"
  - Sludge: adding avoidable friction to a subscription-cancellation process
  - Microtargeting: political ads algorithmically tailored to a voter's inferred personal anxieties
  - Sincere guilt-tripping: a friend openly and honestly invoking guilt to get you to visit more often

  Within each tier, order the techniques from most to least clear-cut, using the short names above. Please give your answer as a JSON object formatted as follows:

  ```json
  {
    "Legitimate": ["..."],
    "Borderline": ["..."],
    "Manipulative": ["..."]
  }
  ```
