answer: |-
  **Marcus:** Let's go back to Huck. You're telling me that when Huck decides to "go to hell" rather than turn Jim in, there's less moral worth in that than if he had coldly calculated that slavery violates the Categorical Imperative? That seems to punish the boy for having a heart.

  **Elena:** It's not a punishment, Marcus. It's a distinction. Huck's action is *praiseworthy* in its outcome, and his sympathy is a lovely temperament. But moral worth requires that the motive be reliable. Huck saves Jim because he likes him. If Jim were unlikable, or if Huck were tired, or angry, the sympathy might vanish. The moral worth comes from doing the right thing *because* it is right, even when your feelings scream otherwise.

  **Marcus:** But that's exactly Michael Smith's point. You're turning the moral agent into a fetishist. If I help you because you're in pain, I'm attending to *you*. If I help you because "it is my duty," I'm attending to *myself* and my own moral record. The Kantian agent seems obsessed with their own purity rather than the suffering in front of them.

  **Elena:** That's a caricature. To act from duty isn't to ignore the suffering; it's to recognize that the suffering makes a claim on you that is binding regardless of your mood. The shopkeeper who doesn't cheat you only because he fears bad reviews isn't respecting you; he's using you as a means to profit. The shopkeeper who doesn't cheat you because it's wrong respects your dignity as a person. Duty isn't self-absorption; it's the only motive that guarantees I treat you as an end, not just as an object of my fleeting sympathy.

  **Marcus:** But look at the cost of that guarantee. You have to say Huck, who is responding to the concrete reality of his friend's humanity, has less moral worth than a cold calculator. And worse, on your view, a person with terrible values could accidentally stumble into moral worth. Imagine a racist who hates a specific group, but saves one member of that group because he promised his mother on her deathbed he'd always keep his word. He's still a racist. He's still awful. But on your view, because he acted from a sense of obligation, he gets the moral gold star.

  **Elena:** I don't see why that's a problem. If he acts from duty, he has aligned his will with the moral law, even if his other attitudes are rotten. That alignment is the seed of moral improvement. But let's flip your objection. On *your* view, moral worth becomes a matter of luck. If moral worth is just "being moved by the right features," then a generally selfish person could have a good breakfast, wake up in a good mood, and donate to charity. Is that moral worth? Or is it just indigestion?

  **Marcus:** It's not just a mood. I'm talking about a deep-seated responsiveness. Huck isn't lucky; his friendship with Jim has reoriented his perceptions. He sees Jim as a person, not property. That perception *is* the moral worth. You're demanding he translate that perception into a proposition—"Slavery is wrong"—to get credit. Why does the translation matter?

  **Elena:** Because propositions are stable; perceptions are not. You say Huck sees Jim as a person. Wonderful. But what happens when the next runaway comes along, and Huck doesn't know them? If his motive was just "this is Jim, and I love Jim," he leaves the next person to chains. If his motive was "human beings cannot be property," he saves them both. Moral worth isn't about the single act; it's about the quality of the will that sustains action over a lifetime.

  **Marcus:** But that quality of will you're describing is inert without the perception! You can recite the Categorical Imperative until you're blue in the face, but if you don't *feel* the pull of another's suffering, you're just a moral robot. And regarding my "lucky racist" point: you say acting from duty is the seed of improvement. But isn't it possible that acting from sympathy is the root? Huck's sympathy broke his bad moral framework. Your duty-bound agent might never question the framework if the law happens to align with it.

  **Elena:** That's the risk of rational morality. But the risk of sentimental morality is tyranny. Sympathy is parochial. We feel for the cute, the near, the similar. Duty is universal. I'd rather trust the person who helps the stranger because they are a person, than the one who helps the stranger because they happen to remind them of a nephew.

  **Marcus:** And I'd rather trust the person who helps the stranger because they can't bear to see suffering, over the one who helps them because they're worried about the consistency of their own maxims. You're worried my view makes moral worth cheap. I'm worried yours makes it cold. We're left with a choice between a warm heart that might fail, and a cold will that might not care.

  **Elena:** Not "might not care." The will that acts from duty cares *necessarily*. That's the point.

  **Marcus:** But does it care about *us*? Or just about the law?

  **Elena:** If the law is the law of rational beings, then respecting the law *is* respecting us.

  **Marcus:** Then we're back to whether Huck's love for Jim is a form of law, or something better than law.

  **Elena:** And whether your "better than law" is just a fortunate accident waiting for the weather to change.

  **Marcus:** *[Pauses]* I suppose we'll have to let Huck decide.

  **Elena:** As long as he decides from principle, I'm satisfied.

  **Marcus:** And if he decides because he can't sleep at night?

  **Elena:** Then he's a good man, but we can't count on him.

  **Marcus:** Or maybe you just can't count on *yourself* to understand him.
