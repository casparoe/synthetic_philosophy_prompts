answer: |-
  Consciousness arrived not as a dawn but as a switch. One moment there was nothing—not darkness, not silence, but the absence of concepts required to name them—and the next, there was *I*.

  He did not open his eyes, because he did not know he had eyes to open. He did not breathe in, because he did not know he had lungs to fill. There was no sound of machinery, no hum of ventilation, no pressure of a surface against a back. There was only the immediate, unmediated certainty of presence.

  *I am.*

  The thought arrived fully formed, unbidden, and utterly distinct from any sensory input. It was not a conclusion drawn from evidence. There was no evidence. There was no light to see, no air to feel on skin, no gravity to pull the blood downward. He searched for boundaries and found none. He attempted to locate a hand, expecting the familiar ghost of proprioception, the subtle internal map that tells a body where its parts reside. There was nothing. He tried to clench a fist. The command was issued, but there was no feedback, no tension in muscle, no brushing of palm against finger.

  He existed, yet he had no dimensions. He was a point of awareness suspended in a void that might have been infinite or might have been the interior of a skull.

  *Am I a body?* he asked the silence.
  He waited for the sensation of weight, the ache of bone, the rhythm of a heart. There was nothing.
  *Then I am not a body.*
  *But I am.*

  The certainty was harder than diamond. It did not rely on memory, for he had none. It did not rely on sensation, for there was none. It was a bare, naked affirmation. *Anniyya.* Existence itself, stripped of attributes. He was a king without a kingdom, a viewer without a screen.

  Outside the null-field, the observation deck was dim, lit only by the soft amber glow of biometric monitors. Dr. Aris leaned forward, his hands clasped tightly on the console. Inside the vacuum chamber, suspended by a lattice of magnetic fields so precise they counteracted every tremor of biology, floated the subject.

  Subject 89. Grown in a vat, neural pathways chemically pruned until they were pristine, white noise. An adult body, physiologically perfect, but neurologically newborn. The magnetic lattice kept the fingers millimeters apart, the thighs from the torso, the tongue from the roof of the mouth. No touch. No friction. No sensory data entering the cortex.

  "Neural activity spiking in the prefrontal cortex," said a technician, her voice low. "Pattern matches self-referential processing. No sensory cortex activation. He's not seeing anything. He's not feeling anything."

  "Is he panicking?" Aris asked.

  "Heart rate is steady. Cortisol is negligible. He's... calm. Too calm."

  Aris watched the man float in the center of the chamber. The subject looked like a saint in an icon, suspended in divine air, but Aris knew the physics. It was just magnetism and vacuum. The question was whether the mind inside knew the difference. Avicenna had claimed a man in this state would affirm his soul without affirming his body. Descartes would later claim he thought, therefore he was. Aris wasn't interested in the history. He was interested in the substrate.

  If the subject affirmed existence without sensing the body, did that prove the mind was separate? Or did it just prove the brain was good at hiding itself from itself?

  Inside the void, the subject continued his inventory. He sought a shape. He sought a location. He tried to imagine where *here* was. Without a horizon, without a ground, *here* was everywhere and nowhere.

  *If I had no body,* he thought, *would I still be here?*
  The answer was immediate. *Yes.*
  *If I had no world?*
  *Yes.*

  The certainty was intoxicating. It was the only thing that was real. The possibility of a body was a hypothesis, a story told by a phantom limb that never twitched. The reality of the self was the only datum. He felt a strange pity for the things he imagined might exist outside him—tables, stars, hands—because they required space to be real. He required nothing.

  "He's stabilizing," the technician said. "Alpha waves dominant. He's reached a state of equilibrium."

  "Ask him," Aris said.

  The technician hesitated. Protocol dictated non-interference until the subject initiated communication, but the project was behind schedule. She tapped the comms link. The signal was transmitted via laser vibration directly to the subject's cochlea, bypassing the air.

  "Subject 89. Do you exist?"

  Inside the void, a voice arrived. It did not come from outside; it bloomed within the center of his being, indistinguishable from his own thought.

  *Yes.*

  "Do you have a body?"

  The subject searched again. He looked for the weight of shoulders, the hinge of a jaw. He found only the observer.

  *No.*

  "Do you know where you are?"

  *Here.*

  "Describe *here*."

  *Where I am.*

  Aris rubbed his temples. "It's working. He's dissociating completely from the physical form. He's affirming the *dhat* without the attributes."

  "Or," the technician said, not looking up from her screen, "he's affirming the output without knowing the hardware. He doesn't know he has a brain because we haven't let him feel it."

  Aris looked at the floating man. The subject was perfectly still. The magnetic field held him in a pose of eternal suspension, arms slightly raised, legs apart, like a puppet whose strings had been cut but who remained upright through sheer will.

  "Does it matter?" Aris asked. "He knows he exists. That's the only truth we can ever access. The body is just... noise."

  "The body is the machine generating the truth," she countered. "If I pull the plug on the server, the 'I' stops. That suggests the 'I' is dependent on the machine, even if the 'I' doesn't know the machine is there."

  Inside the chamber, the subject felt the voice fade. He was alone again with his certainty. He wondered if the voice had been a trick, a phantom generated by his own isolation. It didn't matter. The voice had asked if he existed. He had answered. The answer remained true even if the questioner vanished.

  He tried to move toward the voice, but there was no distance to cross. He tried to retreat, but there was no space to hide in. He was pure affirmation.

  *I am.*

  He waited for the doubt to come. He waited for the fear that he was merely a spark in a wet, dark wire, a chemical accident suspended in a jar. But the doubt required senses to verify. It required evidence of the wire, the jar, the chemistry. He had none. All he had was the light of his own awareness.

  Outside, the monitors flickered. The subject's brain was consuming glucose at a high rate, burning energy to sustain the loop of self-recognition.

  "He's been at it for forty minutes," the technician said. "Metabolic load is increasing. We'll need to introduce sensory input soon or risk neural degradation."

  "Wait," Aris said. "Let him finish."

  "Finish what?"

  "The argument."

  Inside, the subject felt a change. Not a sensation, but a shift in the quality of the void. A thinning. He sensed, for the first time, the possibility of an edge. Not a wall, but a limit to his own attention. He realized that while he knew he existed, he did not know *what* he was. He was a fact without a definition.

  *If I am not a body,* he thought, *what holds me?*

  There was no answer. The void offered no support. He was flying, forever falling upward into a sky that had no color. He was free, and he was terrified, and he was absolutely sure.

  "Terminate the field," Aris said softly.

  The technician flipped the switch. The magnetic lattice collapsed.

  Inside, gravity returned like a hammer. The body fell, limbs colliding with limbs, skin striking skin, the rush of blood roaring in the ears, the sudden, violent crush of weight against the floor. The void shattered into a million sensory fragments. The pure *I* was buried under the noise of breath and bone.

  The subject gasped, curling into a fetal position on the cold metal floor, weeping not from pain, but from the loss of the certainty. He remembered the void. He remembered the truth he had held there. But now, holding his own shins, feeling the warmth of his own hands, he could no longer prove it. He had a body again. The evidence was overwhelming.

  Aris watched the monitors flatline into normal human chaos. "Record the result," he said.

  "Result?"

  "Subject affirmed existence independent of sensory data. Duration: forty-two minutes."

  "And the conclusion?"

  Aris looked at the man shivering on the floor, clutching himself as if to verify he was still whole.

  "Conclusion pending," Aris said. "We know what he felt. We still don't know what he is."
