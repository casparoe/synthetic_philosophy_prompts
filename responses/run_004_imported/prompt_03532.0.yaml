answer: |-
  It is notoriously difficult to explain Hacking in a casual setting because his point is metaphysical, whereas Dan is arguing from a pragmatic/clinical standpoint. Dan thinks the diagnosis is a **bucket** (static) that you either fit into or don't. Hacking argues the diagnosis is a **mold** (dynamic) that shapes the clay while the clay simultaneously reshapes the mold.

  Here are the specific implications of looping effects for the TikTok self-diagnosis trend, stripped of the definitions and focused on the consequences you can throw back at Dan.

  ### 1. The "Moving Target" of Clinical Presentation
  Dan's argument relies on the idea that Autism, ADHD, and DID have fixed symptom profiles that kids are "discovering." Looping effects imply the opposite: **The viral dissemination of the label changes the phenotype of the disorder.**

  *   **Implication:** When thousands of teens consume the same simplified checklists (e.g., "If you lose your keys, you have ADHD" or "If you talk to yourself, you have a system"), they unconsciously begin to prioritize those specific behaviors in their own self-monitoring.
  *   **The Loop:** Clinicians then see a surge of patients presenting with *those specific TikTok symptoms*. Over time, the clinical understanding of the disorder shifts to match the viral caricature. We aren't just finding more autistic people; we are inadvertently narrowing the definition of what autism *looks like* to match the content algorithm.

  ### 2. The Label Is Never a Neutral Intervention
  Dan argues the "worst case" is that nothing changes. Hacking's framework dictates that **classification is itself an intervention.** You cannot simply "try on" a label to see if it fits without the label altering the fit.

  *   **Implication:** Once a teen identifies as a "system" or "AuDHD," it changes their narrative identity. It alters how they interpret past memories, how they excuse current failures, and what future behaviors they expect from themselves.
  *   **The Loop:** If a kid decides they are a "system," they may begin to compartmentalize memories or emotions to align with that taxonomy. This isn't necessarily "faking"; it is the human mind organizing itself around the available vocabulary. The "help" they get (accommodations, therapy) will then reinforce that specific organization, making the label stickier and more behaviorally real over time.

  ### 3. Community Policing Replaces Clinical Criteria
  In Hacking's view, "kinds" of people are maintained by institutions. Traditionally, this was the DSM and medical boards. TikTok has decentralized this institutional power.

  *   **Implication:** Online communities now enforce the boundaries of the category more aggressively than clinicians. If a clinician says, "That doesn't sound like DID," but TikTok says, "That is exactly what a hidden alter looks like," the teen trusts the community.
  *   **The Loop:** The definition of the disorder drifts away from medical consensus and toward community consensus. This creates a feedback loop where clinicians are pressured to diagnose based on patient self-reporting that was authored by an online subculture, which was itself authored by previous patients. The authority on what constitutes the "kind" is no longer external to the people being classified.

  ### 4. The "DID/System" Volatility
  This is the most critical point regarding the "systems" side of the argument. Looping effects are strongest where the condition is defined by subjective experience rather than biological markers.

  *   **Implication:** Neurodivergence (ADHD/Autism) has some behavioral baselines, but DID/Plurality is almost entirely defined by internal narrative and memory structure. It is highly susceptible to suggestion.
  *   **The Loop:** In this context, the looping effect can look like **iatrogenic amplification.** By watching content on how to "meet your alters" or "map your system," a teen may actively cultivate dissociation to match the model they are consuming. The category "System" expands to include normal fluctuations in mood or identity that previously would have been ignored, fundamentally changing the prevalence and presentation of the condition.

  ### 5. The "Best Case" Fallacy
  Dan argues the best case is they "get help." Looping effects suggest that the *type* of help is contingent on the *version* of the label currently in circulation.

  *   **Implication:** If the current "loop" defines ADHD as a quirky superpower involving creative chaos, the "help" offered will focus on lean-in accommodations. If the underlying reality is actually anxiety or trauma (which often loop into ADHD on TikTok), the treatment might miss the root cause because the label has directed the focus elsewhere.
  *   **The Loop:** We risk creating a generation treated for the *viral version* of the disorder rather than the *clinical version*, potentially leading to long-term mismatches in care that only become visible years later.

  ### Summary for Dan
  If you need a quick punchline for the next conversation, try this:

  > "You're treating the diagnosis like a name tag we find on the ground. Hacking's point is that the diagnosis is a script. Once you pick it up and read it, you start acting out the lines. That doesn't mean the pain isn't real, but it does mean the 'character' you're playing changes the play itself. We aren't just discovering more of these people; we are actively co-authoring what these conditions mean for the next twenty years."
