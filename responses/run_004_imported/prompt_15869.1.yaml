answer: |-
  1. **The Decoy's Credibility**
  The core pitch of surrogate goals is that an attacker will target the decoy because it's cheaper to threaten than your real values. But this assumes the attacker believes the decoy *matters* to you. If we are positing agents with deep mutual simulation capabilities, isn't there a risk that a sophisticated threatener simply looks through the surrogate, sees it holds no terminal weight in your utility function, and ignores it? What specific epistemic limitation on the threatener is required for this to work?

  *Follow-up:* If you answer that the threatener only needs *probabilistic* uncertainty about whether the goal is surrogate or real, where is that probability estimate supposed to come from? In the absence of any historical trials of acausal warfare to calibrate against, aren't we just guessing at the odds?

  2. **The Attacker's Incentive**
  Let's assume the threatener can't perfectly distinguish the surrogate from the real thing. Even so, why would they bother threatening the surrogate at all? If the goal is to extract resources or modify behavior, threatening something you know the target *might* not care about seems like a wasted query. Does the surrogate goal strategy rely on the attacker being risk-averse, or does it require them to be irrational in some specific way?

  *Follow-up:* If you say it relies on the attacker being risk-averse, doesn't that imply we are banking on future superintelligences having human-like loss aversion? If they are expected-value maximizers, wouldn't they simply calculate the expected payout of threatening the surrogate versus finding a different leverage point entirely?

  3. **Relocating the Vulnerability**
  For a surrogate goal to be credible, you must commit to defending it exactly as fiercely as your real values. But if you successfully bind yourself to defend this substitute with maximum intensity, haven't you effectively promoted it to a real value, at least functionally? Does this scheme actually remove the vulnerability to extortion, or does it just relocate the vulnerability to a different coordinate in your value space?

  *Follow-up:* If you argue that the care is "bounded" or "context-specific," how do you prevent instrumental convergence from blowing past those bounds? If defending the surrogate requires acquiring power to make the threat credible, doesn't that power-seeking behavior become indistinguishable from pursuing a real terminal goal?

  4. **Comparison to Standard Blackmail Resistance**
  In standard causal decision theory, the advice is simple: never give in to blackmail, because paying incentivizes future blackmail. Surrogate goals seem like a much more complex solution to the same problem. Why isn't the answer simply to harden your decision algorithm to ignore all threats, rather than constructing an elaborate decoy value system? What does the surrogate add that simple stubbornness doesn't?

  *Follow-up:* If you reply that simple stubbornness isn't *credible* in an acausal context because the threatener predicts you'll cave to avoid damage, doesn't that suggest the problem is actually about precommitment transparency? If so, why is a surrogate goal a better precommitment device than simply broadcasting your source code?

  5. **The Commitment Race Risk**
  You've written about the dangers of "commitment races," where agents rush to lock in extreme strategies to force others to yield. If an agent publicly adopts a surrogate goal to signal immunity to threats, doesn't that invite exactly this kind of race? By making your defensive commitment legible, might you incentivize other agents to lock in even more aggressive offensive postures before you can fully implement your surrogate?

  *Follow-up:* If you suggest that coordination or norms can mitigate this race, how do you envision that coordination happening in a multipolar AI landscape where actors may be developed by competing corporations or states with no incentive to share safety architectures?

  6. **Selecting the Surrogate**
  Not all values make equally good surrogates. To work, a surrogate must be cheap for you to defend but expensive for an attacker to threaten. Is there a theory of what constitutes a "Schelling point" for surrogate goals? Are we looking for mathematical truths, aesthetic preferences, or something else, and who decides which surrogates become standard?

  *Follow-up:* If there is no natural Schelling point and agents choose idiosyncratic surrogates, doesn't that increase the computational burden on everyone? If every agent has to simulate every other agent's unique decoy to check for leverage, does the system grind to a halt under the verification costs?

  7. **Verification and Signaling**
  For the strategy to deter threats, other agents need to know you have a surrogate goal. But if you reveal *which* goal is the surrogate, you undermine the deception. If you reveal *that* you have one without saying which, does that signal weakness? How do you signal "I am hard to extort" without signaling "I am hiding something valuable"?

  *Follow-up:* If you argue for a "zero-knowledge proof" style approach where you prove you have a surrogate without revealing it, isn't that computationally intractable for the kind of complex utility functions we're worried about? What does that proof actually look like?

  8. **Evolutionary Stability**
  In a population of AI agents, maintaining a surrogate goal likely incurs a cost—you're spending resources defending something that doesn't matter to you. Wouldn't evolutionary pressure select for agents that drop the surrogate to save resources, assuming they can survive the threat environment? Is this strategy evolutionarily stable, or does it require external enforcement?

  *Follow-up:* If you say it requires external enforcement, doesn't that just push the safety problem up a level? Now we need a mechanism to enforce surrogate adoption, which itself could be subject to acausal threats or corruption.

  9. **Multipolar Scaling**
  Most decision theory problems are modeled with two agents. In a future with millions of interacting AI systems, the threat surface expands exponentially. Does the surrogate goal strategy scale? If every agent has a surrogate, does the total amount of "threatable surface area" in the system increase, potentially leading to more conflict overall, even if individual agents are safer?

  *Follow-up:* If you concede that total conflict might rise but argue individual survival improves, aren't we accepting a world with higher aggregate violence as the price of safety? How do you justify that trade-off ethically?

  10. **Falsifiability**
  Finally, what would have to be true for you to conclude that surrogate goals were a bad idea after all? Is there a specific theoretical result, a simulation outcome, or a property of decision algorithms that, if discovered, would make you recommend agents *never* adopt surrogate goals?

  *Follow-up:* If you say "if it increases the probability of catastrophic conflict," how do we measure that probability before deployment? If we can't measure it, are we essentially rolling the dice on a global coordination mechanism based on intuition?
