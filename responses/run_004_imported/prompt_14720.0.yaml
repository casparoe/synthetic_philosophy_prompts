prompt: |-
  My mother died three weeks ago, and the eulogy has fallen to me, mostly because I'm the one in the family who writes for a living. I've realized this week that novel-writing has trained exactly the wrong instincts for the job: my usual craft is making a life cohere into a satisfying shape, which is precisely what she spent her career refusing to do to other people's copy. She ran the fact-checking desk at a regional newspaper for thirty-one years, and sometime in her sixties she became a quiet but serious reader of Hannah Arendt -- not the banality-of-evil book everyone half-remembers, but the essays specifically about lying in politics, "Truth and Politics" and the Pentagon Papers piece. She liked to point out, usually at the worst possible moment at a family dinner, that a fact is not the same kind of thing as an opinion, and that nobody at the table was entitled to a personal view of what had actually happened.

  That habit is now my problem. A eulogy is, structurally, almost exactly the operation Arendt distrusted: it takes a contingent, could-have-gone-differently life and quietly edits it into something more consoling and more usable, the way a comfortable story can replace an inconvenient fact once everyone involved would rather agree on it. My mother's argument, borrowed from Arendt, was that facts survive only because stubborn, often unlikeable people insist on them past the point of social convenience, and that the very imagination that lets us lie is also what lets us act and change the world, which is exactly why truth needs defenders who have no interest in changing anything. I don't think I can honestly deliver this eulogy if its comfort depends on doing to her memory the thing she gave her working life to preventing. Complicating things, most of the room will be neighbors and cousins who have never heard of Arendt and shouldn't have to sit through a lecture on her; four or five of her former colleagues from the copydesk will absolutely notice if I cheat.

  Please write the eulogy: five to seven minutes, genuinely comforting to people who are simply grieving an aunt or a neighbor, but constructed so that its comfort comes from precision about who she actually was, edges included, rather than from softening her. Let it find a natural, unforced way for the copydesk contingent to recognize her real convictions about facts, lying, and politics, without turning any part of it into exposition for everyone else.
reasoning: |-
  Here's a thinking process that leads to the eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A writer (novelist) whose mother died three weeks ago.
      *   **Subject:** The mother, a fact-checker/copy desk editor for 31 years at a regional newspaper. Late-in-life reader of Hannah Arendt (specifically on truth, lying, and politics).
      *   **Conflict:** The speaker's instinct as a novelist is to shape a narrative (make it coherent/satisfying), but the mother's life work and philosophy were about resisting that shaping when it compromises truth. A eulogy is inherently a "shaping" act, which feels like a betrayal of her principles.
      *   **Audience:** Mixed. Neighbors/cousins (need comfort, don't know Arendt) + Former colleagues (know her work, will spot dishonesty/softening).
      *   **Goal:** Write a 5-7 minute eulogy. It must be comforting but *not* by softening her edges. It must honor her commitment to factual truth without becoming a lecture. The comfort must come from *precision*.
      *   **Tone:** Respectful, precise, unsentimental but warm, authentic.

  2.  **Deconstruct the Mother's Character:**
      *   Profession: Fact-checker/Copy Editor. She stopped errors. She was the gatekeeper of "what happened."
      *   Philosophy: Facts are stubborn. Opinions aren't facts. Comforting lies are still lies.
      *   Personality: Likely pedantic at dinner tables, serious, perhaps difficult in social situations because she wouldn't let things slide. "Unlikeable" in the service of truth (per the prompt's interpretation of Arendt).
      *   Relationship with Speaker: The speaker writes fiction (making things up/shaping truth); the mother verified reality. There's a tension there that needs acknowledgment.

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the difficulty of the task. Establish the speaker's role vs. the mother's role.
      *   **Middle (The Work):** Describe what she actually did. Not "she was great," but "she was precise." Use specific imagery of the newsroom/copy desk.
      *   **Middle (The Philosophy):** Introduce the Arendt connection subtly. Not by name-dropping too heavily, but by conveying the *weight* she gave to truth. Address the "dinner table" moments.
      *   **Climax/Turn:** Address the tension between a eulogy (story) and her life (fact). How to reconcile them? By refusing to lie about her.
      *   **Closing:** A specific, grounded memory or statement of loss that feels true, not polished.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the irony. I write fiction; she checked facts. This is the wrong job for me, but the right job for us to acknowledge.
      *   *The Work:* 31 years. Regional newspaper. It wasn't glamorous. It was red ink. It was stopping the press. *Show, don't tell.* Mention the red pen.
      *   *The "Difficult" Trait:* The dinner table moments. Don't apologize for them. Frame them as integrity. She didn't do it to be mean; she did it because reality matters.
      *   *The Arendt Connection:* Don't say "She read Hannah Arendt's *Truth and Politics*." Say "She believed that facts are not democratic." Or "She believed that wishing something were true doesn't make it so." Keep it accessible for the cousins, specific for the colleagues.
      *   *The Eulogy Paradox:* Acknowledge that I'm standing here trying to make her death make sense. She would hate that. So I won't. I'll just state what is.
      *   *The Comfort:* The comfort isn't "she's in a better place." The comfort is "we know exactly who she was, and that is enough." The stability she offered.

  5.  **Refining the Voice:**
      *   Avoid flowery language. She would hate it.
      *   Keep sentences relatively tight.
      *   Ensure the "colleagues" hear a dog whistle. Phrases like "kill the darlings," "hold the press," "verify."
      *   Ensure the "family" hears love. "She loved us enough to tell us the truth."

  6.  **Self-Correction during Drafting (Mental Check):**
      *   *Critique:* Is this too cold?
      *   *Fix:* Add a moment of tenderness. Maybe how she checked facts *for* the speaker, or how her precision was a form of care.
      *   *Critique:* Is the Arendt stuff too obvious?
      *   *Fix:* Don't name Arendt. Just express the *idea*. The colleagues will know the source material; the family will just hear "Mom being Mom."
      *   *Critique:* Is it 5-7 minutes?
      *   *Fix:* Word count check. Average speaking pace is 130-150 wpm. 5 mins = ~650 words. 7 mins = ~1000 words. Aim for around 850-900 words.

  7.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the ending lands. It shouldn't be a "resolution." It should be a statement of fact.

  *(Self-Correction Note: Make sure I don't make her sound like a monster. She was "quiet but serious." The love needs to be there, just not saccharine.)*

  8.  **Final Review against constraints:**
      *   5-7 minutes? Yes.
      *   Comforting via precision? Yes.
      *   No lecture on Arendt? Yes.
      *   Colleagues recognize the ethos? Yes.

