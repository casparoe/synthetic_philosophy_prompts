answer: |-
  Thank you for being here.

  I am a writer of fiction. My job is to take the messy, random material of human experience and arrange it into a shape that makes sense. I create arcs. I build resolutions. I am paid to make things cohere.

  My mother's job was the opposite. For thirty-one years, she worked the copy desk at the *Gazette*. Her job was to stop the story from becoming too neat. To catch the name that was spelled wrong, the date that didn't match the day of the week, the quote that had been smoothed over until it lost its meaning. She was the person who held the red pen when everyone else wanted to hold the headline.

  Standing here today, I am acutely aware of the conflict. A eulogy is, by definition, a story we tell to make a loss bearable. We smooth the edges. We emphasize the warmth and minimize the friction. We make the life look like it was heading somewhere specific, so that the end feels like a conclusion rather than a stoppage.

  If I do that for her, I am not honoring her. I am doing the one thing she spent her life resisting.

  So, I am not going to tell you that she was easy. She wasn't. I am not going to tell you that she believed everyone's truth was valid. She didn't. She believed that there is what happened, and there is what we wish had happened, and that confusing the two is a dangerous habit.

  I know many of you remember her from family dinners. You remember the moments when the conversation would drift into nostalgia, or politics, or the kind of harmless exaggeration we use to make a story funnier. And you remember my mother pausing. Quietly. Seriously. She wouldn't shout. She would just intervene to say, "Actually, that's not what happened," or "We don't know that for a fact."

  To some, that felt like a correction. To her, it was an act of care.

  She came to believe, deeply, that facts are the only ground we can stand on together. Opinions are free, and they change. But if we lose the agreement on what is real, we lose the ability to share a world. She knew that insisting on accuracy can make you unpopular. She knew that being the person who points out the error is rarely the person who gets thanked at the party. She did it anyway. Not because she enjoyed being difficult, but because she believed that truth doesn't defend itself. It needs people willing to be inconvenient on its behalf.

  To her colleagues in the room: You know better than anyone what that looked like in practice. You know the nights she held a page because a source wasn't confirmed. You know she valued precision over speed, and integrity over comfort. You know that her silence in the newsroom was often louder than the shouting in the editorial meetings. She leaves behind a body of work that doesn't have her byline on it, because her work was ensuring that the bylines that *were* there meant something. That is a rare kind of integrity.

  To the rest of us, her family and friends: I think we often mistook her rigor for a lack of warmth. But I have come to realize that her precision was how she loved us.

  When I started sending her my drafts, years ago, I expected praise. I got corrections. She would circle a vague adjective and write "Be specific" in the margin. She would ask, "Did this actually happen this way, or does it just sound better?" At the time, I found it frustrating. Now, I understand that she was teaching me that the world is solid. She was teaching me that I don't need to invent a better version of reality to be worthy of attention. The reality, exactly as it is, is enough.

  That is the comfort I am trying to find today. Not a story that makes her death feel like part of a plan. There was no plan. This is just what happened. She is gone. That is a fact. It is a hard one.

  But here is another fact: We are here. We are here because she mattered. We are here because the standards she kept—the insistence that we owe each other the truth, even when it's awkward—are the things that hold a community together.

  She did not want to be remembered as a saint. She would find that factually incorrect. She wanted to be remembered as someone who did the work. Someone who showed up, checked the sources, and refused to let the record stand if it was wrong.

  I cannot give this eulogy a satisfying ending. I cannot tie this up in a way that resolves the grief. All I can do is offer you the truth of her, without the softening. She was stubborn. She was exacting. She was fiercely committed to the idea that if we tell the truth, we don't need to lie about the rest.

  And in a world that is increasingly comfortable with fiction, that is a legacy more solid than any story I could write.

  Thank you.
