      2. Good's Counterexample (Bayesian, Background Knowledge, Sign Flip).
      3. Argument: Why the Sign Flip kills Hempel's diagnosis (Magnitude vs. Sign, Universality of Nicod, Nature of Confirmation).
      4. Conclusion.

  8.  **Final Review against Prompt:**
