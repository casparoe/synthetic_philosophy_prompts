answer: |-
  Your friend is right, and honestly, three hours is about average for this specific argument. It is one of the most frustratingly robust arguments in philosophy.

  You hit the nail on the head with your confusion: **"If there's genuine randomness, why doesn't that give you origination?"**

  That is the exact intuition most people have. We tend to think: *Determinism = Robot, Indeterminism = Freedom.* Galen Strawson's "Basic Argument" is famous specifically because it attacks that intuition. It argues that indeterminism doesn't give you freedom; it just gives you noise.

  Here is the walk-through of the logic, why randomness doesn't save you, and what is actually doing the philosophical work.

  ### 1. The Core Requirement: "Ultimate Responsibility"
  To understand Strawson, you have to accept his starting definition of responsibility. He isn't talking about whether you should go to jail or if you're a nice person. He is talking about **Ultimate Moral Responsibility (UMR)**.

  For you to be *ultimately* responsible for an action (Action A), you must be responsible for the mental state that produced Action A.
  *   You did Action A because you had Motive M.
  *   To be responsible for Action A, you must be responsible for having Motive M.
  *   But you only have Motive M because of your Character C.
  *   To be responsible for Motive M, you must be responsible for having Character C.

  **The Rule:** You cannot be truly responsible for what you do unless you are truly responsible for *how you are*.

  ### 2. The Trap: The Infinite Regress
  This is where the argument locks in. Strawson asks: **How did you get Character C?**

  There are only two possibilities (The Two Horns of the Dilemma):

  #### Horn 1: Determinism (The path you already knew)
  If the universe is deterministic, your Character C was caused by your genetics and your environment.
  *   Did you choose your genetics? No.
  *   Did you choose your environment/parents? No.
  *   Therefore, you didn't choose Character C.
  *   Therefore, you aren't responsible for Action A.

  #### Horn 2: Indeterminism (The path that confused you)
  This is where your friend said "no, it works either way." Let's say the universe is *not* deterministic. Let's say there are quantum gaps or genuine randomness in how your brain forms Character C.

  Strawson asks: **Does randomness help you own your character?**

  *   **Scenario:** Imagine your character is being formed. At a crucial moment, a random indeterministic event occurs in your brain that shifts you from being "Selfish" to "Generous."
  *   **The Problem:** Did *you* cause that shift? No. A random fluctuation did.
  *   **The Result:** If the change in your character was random, it wasn't *authored* by you. It was luck.
  *   **The Conclusion:** You can't be morally praised or blamed for luck. If your goodness is the result of a random quantum roll, you didn't *earn* it.

  **Why randomness doesn't give "origination":**
  Origination requires *control*.
  *   If my hand moves because of a prior cause I didn't choose, I have no control (Determinism).
  *   If my hand moves because of a random spasm I didn't choose, I have no control (Indeterminism).

  In both cases, the action wasn't truly *up to you* in the deep sense required for Ultimate Responsibility. Randomness breaks the chain of causality, but it doesn't insert *you* into the chain; it just inserts *noise*.

  ### 3. The "Causa Sui" Problem (What is actually doing the work?)
  You asked: *"What exactly is doing the work here if it isn't determinism itself?"*

  The work is being done by the requirement of **Self-Creation** (or *Causa Sui* in Latin, meaning "cause of itself").

  Strawson's argument boils down to this:
  1.  To be ultimately responsible, you must be the cause of yourself (at least your mental nature).
  2.  To be the cause of yourself, you must have performed some action to shape yourself.
  3.  But to perform that action, you must have already had a nature (motives/preferences) that led you to perform it.
  4.  Therefore, you must have been responsible for *that* prior nature.
  5.  This leads to an infinite regress. You would need to have existed *before* you existed to choose how to exist.

  Since humans cannot create themselves ex nihilo (out of nothing), we cannot satisfy the condition of Ultimate Responsibility.

  **The Engine of the Argument:**
  It is not **Causality** that kills free will in Strawson's view. It is **Finitude**.
  We are finite beings with a beginning. We did not design the "designer" inside our heads. Whether the inputs that built our designer were determined or random, *we* didn't pick them.

  ### 4. An Analogy to Seal the Deal
  Imagine you are playing a video game character.

  *   **Determinism:** The code is written. When you press 'A', the character jumps. The outcome is fixed by the code. You (the player) didn't write the code.
  *   **Indeterminism:** The code has a bug. Sometimes when you press 'A', the character flies instead of jumping, randomly.
  *   **Your Hope:** "Ah! The randomness means the character has free will!"
  *   **Strawson's Reply:** "No. Whether the character jumps because of code or flies because of a bug, *you* (the player) still didn't write the character's source code. The character didn't choose its own stats."

  To have the kind of responsibility you are arguing for, the video game character would have had to program its own source code *before* the game started. Which is impossible.

  ### Summary for your next argument
  If you talk to your friend again, here is the cheat sheet:

  1.  **It's not about physics:** Strawson agrees that determinism makes responsibility hard. But his point is that **indeterminism makes it impossible too**, because randomness is not agency.
  2.  **The Regress:** You can't be responsible for your actions unless you are responsible for your character. But you can't be responsible for your character unless you chose it. But you can't choose it without already having a character to make the choice.
  3.  **The Killer:** The thing doing the work is the **impossibility of self-creation**. We are not *causa sui*. We are the product of luck (genetics/environment), and whether that luck is deterministic or random, it's still luck.

  Your friend was right to be annoyed (gently!), because Strawson's argument is specifically designed to block the move you tried to make: "But what about quantum randomness?" Strawson says randomness is just a different flavor of "not up to you."
