      *   *Q2 (2D Semantics):* Focus on the "transparency" claim.
      *   *Q3 (Judgment):* Focus on the "knowledge of consciousness" being physically explicable.
      *   *Q4 (Causal Closure):* Don't ask "How does it interact?" (She has an answer). Ask "Why posit a violation of closure if the physical story is complete?"
      *   *Q5 (Panpsychism):* If experience is fundamental, why isn't it everywhere? (Combinatorial problem).
