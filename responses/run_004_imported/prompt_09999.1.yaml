  2.  **Deconstruct the Guest's Position (Chalmers-style Dualism):**
      *   *Core Argument:* Zombies are conceivable. Ideal positive primary conceivability entails primary possibility. Therefore, physicalism is false (because physicalism says consciousness supervenes necessarily on the physical).
      *   *Defense Mechanism:* Two-dimensional semantics. Distinguishes primary intension (reference fixing) from secondary intension (reference in counterfactual worlds). Claims phenomenal concepts are rigid but transparent, unlike "water" or "heat."
      *   *Common Dodge:* "Physicalists have an explanatory gap too," or "Your account of reference is just as mysterious."
      *   *Weak Points:* Modal skepticism (can we really conceive of zombies ideally?), the nature of phenomenal concepts (are they really transparent?), the causal efficacy of consciousness (epiphenomenalism), and falsifiability.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need 8-10 questions total. 3 specific ones with follow-ups. 1 closing on falsifiability. That leaves 3-4 "filler" questions that need to be high quality and avoid the "restate the argument" trap.

      *   *Question 1: The Trust in Conceivability (Modal Skepticism).*
          *   *Draft:* Why should we trust conceivability for mind when it fails elsewhere?
          *   *Refinement:* Make it specific to "ideal, positive, primary." Mention historical modal errors.
          *   *Follow-up:* She'll likely say "We have direct access to phenomenology." Counter: Direct access doesn't guarantee modal knowledge about *metaphysical* possibility.
