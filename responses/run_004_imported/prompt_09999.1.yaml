      *   *Question 3: Paradox of Phenomenal Judgment.*
          *   *Draft:* If zombies say they are conscious, what does real consciousness do?
          *   *Refinement:* Focus on the explanation of the *report*. If the physical causes the report in both cases, consciousness looks epiphenomenal.
          *   *Follow-up:* She'll likely accept epiphenomenalism or suggest "non-supervenient causation." Counter: If it doesn't affect the physical, how do we know about it? (The self-stultifying objection).
          *   *Anti-Dodge:* Don't let her say "Physicalists can't explain qualia either." Focus on the *causal story of the utterance*.

      *   *Question 4: Falsifiability (The Closer).*
          *   *Draft:* What would change your mind?
          *   *Refinement:* Make it sharp. "Unfalsifiable comfort."
          *   *Anti-Dodge:* Require a specific empirical or conceptual scenario.

      *   *Filling the Gaps (Questions 4-7):*
          *   Need to cover other aspects without letting her drift.
          *   *Idea A:* The "Problem of Causal Closure." If the physical is closed, where does the mental fit?
          *   *Idea B:* "Panpsychism vs. Dualism." If you reject physicalism, why not panpsychism? (Chalmers often flirts with this).
          *   *Idea C:* "The Hard Problem vs. The Real Problem." Recent shift in literature (Kaminsky etc.). Ask about the "Real Problem."
          *   *Idea D:* "Conceptual Competence." Are we just confused about our concepts?

      *   *Refining for the "Dodge":* The user specifically mentioned the guest says "That's a problem for physicalists too." I need to frame questions where the burden of proof is squarely on the *positive* claim of dualism, not the *negative* claim against physicalism.
