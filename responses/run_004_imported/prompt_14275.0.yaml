answer: |-
  Here are 10 interview questions designed to corner your professor. They escalate from the technical to the personal, ending with the trap regarding falsifiability. Each includes a "Prepared Follow-up" — a line your journalist has ready in case the professor tries to pivot to a standard defense.

  **1. The Hook**
  "Professor, when you published the Chinese Room argument forty years ago, you were attacking old-school symbolic AI, rules-based systems. Today's models aren't following rulebooks; they're navigating high-dimensional vector spaces based on statistical probability. When you look at a transformer model, are you seeing a fundamentally new kind of machine, or is this just the same old room with a fancier lookup table?"
  *(**Prepared Follow-up:** If she says "It's still just syntax," ask: "At what point does complexity become quality? If I simulate every raindrop in a storm, I don't get wet, but if I simulate every neuron, you say I don't think. Why is the mind the one thing that can't be simulated?")*

  **2. The Causal Powers (Required)**
  "You argue that the brain produces understanding because of its specific 'causal powers.' But when pressed on what those powers actually *are*—neurobiologically, physically—you tend to say we don't need to know the mechanism to know the cause exists. Isn't that dangerously close to vitalism? Are you positing a kind of 'mind-stuff' inherent to biology that physics hasn't found yet?"
  *(**Prepared Follow-up:** If she says "We didn't know what caused digestion until we found enzymes," ask: "But we knew digestion was a physical process. You seem to be saying the physical process *itself* isn't enough without this extra 'causal power.' What distinguishes that from a soul?")*

  **3. The Background (Required)**
  "Let's talk about 'the Background.' You insist that before we have beliefs or desires, we have a pre-intentional know-how that isn't itself a set of rules. But if this Background isn't representational—if it doesn't contain information about the world—how does it successfully guide our interaction with it? Isn't calling it 'non-representational' just a way to hide the homunculus?"
  *(**Prepared Follow-up:** If she says "It's a skill, like riding a bike," ask: "But skills can be modeled kinetically. If I can model the balance and force of bike-riding mathematically, why is the 'knowing' part of *your* bike-riding magically immune to modeling?")*

  **4. The Statistical Objection (Required)**
  "Going back to the models: The original man in the Chinese Room was hand-fed symbols. Modern LLMs ingest the sum of human text and adjust billions of weights to minimize prediction error. They aren't shuffling symbols; they're compressing reality into geometry. Do you genuinely see no distinction between a hardcoded rule and a statistical emergent property?"
  *(**Prepared Follow-up:** If she says "Probability isn't understanding," ask: "Human understanding is deeply probabilistic. We predict the end of sentences all the time. If the math looks the same, why is the ontology different?")*

  **5. The Black Box Brain**
  "You demand that we explain *how* a machine understands. But neuroscientists will tell you we still don't fully understand how a network of neurons produces a subjective experience of 'red' or 'pain.' If we can't explain the biological black box, why are you so certain the silicon black box is empty?"
  *(**Prepared Follow-up:** If she says "Because I *am* the biological black box and I know I exist," ask: "That's a first-person privilege argument. But this article isn't about whether *you* exist. It's about whether the thing across from you does. Why is your introspection the gold standard for a third-party assessment?")*

  **6. The Evolutionary Waste**
  "From an evolutionary standpoint, behavior is what gets selected for. If a creature acts exactly as if it understands danger, food, or mates, it survives. If understanding is just an internal 'light' that doesn't add causal weight to the syntax, why did evolution bother to produce it? What does understanding *do* that syntax can't?"
  *(**Prepared Follow-up:** If she says "Understanding causes the behavior," ask: "Then you're admitting syntax alone *wasn't* enough. But if the behavior is identical, how do you prove the cause was 'understanding' and not just more complex syntax?")*

  **7. The Other Minds Problem**
  "I'm sitting here interviewing you. I cannot access your internal causal powers. I am inferring you understand me based on your fluency, your wit, your ability to contextualize. If I apply the same evidence to a model that matches your fluency, you call it a simulation. Aren't you applying a biological chauvinism to the problem of other minds?"
  *(**Prepared Follow-up:** If she says "But I know I'm biological," ask: "If we met an alien made of silicon who spoke perfect English, would you tell them they don't understand until they showed you their birth certificate?")*

  **8. The Department's View**
  "Your colleagues in the cognitive science department have largely moved toward embodied cognition and connectionism. They view your stance as a roadblock. Do you worry that by defining 'understanding' in a way that excludes computational processes, you aren't protecting a mystery, but rather rendering the concept scientifically useless?"
  *(**Prepared Follow-up:** If she says "Truth isn't a popularity contest," ask: "No, but if a definition prevents you from measuring the phenomenon, it becomes metaphysics. Are you okay with this being a philosophical creed rather than a scientific hypothesis?")*

  **9. The Falsifiability Trap (Required)**
  "This is the big one. Is there *any* behavior a machine could display that would convince you it understands? If I built a robot that could write this novel, debate you on it, and cry when you criticize it, would you still say 'nobody's home'? Or is your view set up so that no amount of external evidence could ever count?"
  *(**Prepared Follow-up:** If she says "Behavior is never enough," ask: "Then we aren't debating science anymore. You've defined understanding as 'whatever biology does.' That's a tautology, Professor. It makes your argument immune to being wrong.")*

  **10. The Stakes**
  "Let's say you're wrong. Let's say syntax *is* sufficient, or that statistical compression *is* a form of semantics. What is the loss? Why does it matter so much to you that these machines remain 'zombies'? What are you protecting?"
  *(**Prepared Follow-up:** If she says "Human dignity," ask: "Does human dignity really rely on us being the only things in the universe that can mean what we say? Or does it rely on how we treat each other, regardless of the hardware?")*
