answer: |-
  Good evening. For those who don't know me, I'm the older sibling. I'm also currently sweating through a suit that cost more than my first car, because my sister asked me to give a toast about the one subject that makes our family dinners sound like a tenure review: Epistemic Game Theory.

  If you're at the family table, you've heard the story. [Sister] and [Fiancé] met in a grad seminar. Their origin story is a screaming match on their second date about Robert Aumann. Specifically, whether two stubborn humans can ever truly agree, or if that theorem is just for idealized Bayesians who don't argue about wedding seating charts. For four years, whenever they've fought, one of them has declared, "We don't have common priors!" and the rest of us have nodded and passed the gravy.

  But since a third of this room is from the Econ department, I can't just use "Aumann" as a punchline. I actually looked up the conditions. And the theorem is much stricter than "smart people agree."

  Aumann's Agreement Theorem states that two rational agents cannot agree to disagree *if* they share a common prior *and* have common knowledge of each other's posteriors.

  For the family: A "prior" is where you start—your baggage, your history, your weird specific opinions on how to load a dishwasher. "Common knowledge of posteriors" doesn't just mean I hear your opinion. It means I know your opinion, you know I know your opinion, I know that you know that I know... infinitely.

  The reason [Sister] and [Fiancé] argue about the theorem is that they know the loophole. Humans *don't* have common priors. We come from different worlds. And we rarely achieve common knowledge. Usually, we just shout our private information and assume the other person updated their beliefs correctly. They didn't.

  But here is the part that matters for tonight. There is a follow-up result in the literature—something the couple has definitely discussed over wine—that shows if two agents repeatedly communicate their posteriors back and forth, their probabilities *must* converge. Eventually. Even if they start worlds apart.

  And that, to me, is the definition of a marriage.

  [Sister] and [Fiancé], you do not have common priors. You never will. One of you thinks the seating chart is a logic puzzle; the other thinks it's a diplomatic treaty. You are not idealized Bayesians. You are stubborn humans who will sometimes forget to update on new information because you're hangry.

  But the vow you are making today isn't a promise that you will always agree. It is a commitment to the *protocol*. It is a promise to keep communicating your posteriors. To keep saying, "Here is where I am now," and listening until you both reach a convergence, even if it takes three rounds of iteration and a timeout.

  The math says that if you keep talking, if you keep genuinely listening to what the other person *concluded* and not just what they *saw*, you will find the same truth.

  So, to the economists in the room: Yes, I know the assumptions are strong. But look at them. They've been iterating for years, and their convergence is right there.

  And to the rest of the family: They're going to keep arguing about the seating chart. But now you know—they're not fighting. They're just solving for equilibrium.

  [Sister] and [Fiancé], may your priors remain distinct, may your communication be common knowledge, and may your convergence be lifelong.

  Cheers.
