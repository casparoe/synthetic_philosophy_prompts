answer: |-
  **Title:** The Limits of Guilt by Association: Why Evolutionary Debunking Spares Mathematics but Not Morality

  **Introduction**

  Sharon Street's evolutionary debunking argument (EDA) presents one of the most formidable challenges to contemporary moral realism. By highlighting the tension between the Darwinian etiology of human evaluative attitudes and the realist's commitment to mind-independent moral truths, Street argues that the realist is left with an implausible coincidence: why should faculties shaped for reproductive fitness track independent normative truths? In response, philosophers such as Justin Clarke-Doane have advanced a "companions in guilt" (CiG) strategy. They contend that if evolutionary genealogy undermines moral beliefs, it must equally undermine mathematical and logical beliefs, as these too were shaped by selection pressures indifferent to abstract truth. Since mathematical skepticism is widely regarded as untenable, the EDA must be rejected. This essay assesses whether this parity defeats Street's argument. While the CiG move successfully exposes weaknesses in crude formulations of the EDA, it ultimately fails to protect moral realism. There exists a principled disanalogy between the two domains regarding **explanatory relevance** and **empirical indispensability**. Unlike moral facts, basic mathematical facts are instantiated in the physical environment in a way that makes truth-tracking directly conducive to survival. Therefore, the EDA retains its force against moral realism while leaving mathematical realism intact.

  **Street's Challenge and the Companions in Guilt**

  To evaluate the CiG reply, one must first grasp the specific mechanism of Street's debunking. Street does not argue that evolution *falseifies* moral beliefs; rather, she argues that the evolutionary explanation of our moral beliefs "screens off" the need for a realist explanation. If natural selection favored ancestors who believed "care for offspring is good" because this belief promoted genetic propagation, the belief is fully explained by fitness. The moral realist, who posits that "care for offspring is good" is true independently of our attitudes, must explain why the fitness-promoting belief aligns with the independent truth. Street contends that any explanation offered by the realist (e.g., "survival is good") inevitably presupposes the very moral truths under scrutiny, rendering the argument circular.

  Clarke-Doane's CiG reply attacks the premise that evolutionary etiology constitutes a defeater. He argues that our basic arithmetical and logical capacities are also products of evolution. Selection favored organisms that could distinguish one predator from two, or recognize that if A is larger than B and B larger than C, then A is larger than C. However, natural selection cares about survival, not the abstract truths of number theory or logic. If the EDA implies we should doubt moral truths because they were shaped by fitness-seeking processes, consistency demands we doubt mathematical truths for the same reason. Given that mathematics is foundational to empirical science and daily reasoning, Clarke-Doane suggests we should instead conclude that evolutionary genealogy does not undermine justification in either domain.

  **The Case for Parity: Modal Status and Etiology**

  The strength of the CiG argument lies in the structural similarities between the domains. Both moral and mathematical realists posit truths that are objective and mind-independent. Furthermore, Clarke-Doane emphasizes the **modal status** of these truths. Moral realists typically claim moral truths are necessary (true in all possible worlds where the relevant natural facts obtain), as do mathematical realists.

  This modal necessity creates a puzzle for the concept of "tracking." Causal theories of knowledge suggest we know a fact by interacting with it. However, one cannot causally interact with a necessary truth; the number 2 or the principle of non-contradiction does not emit photons or exert force. If Street's EDA relies on the impossibility of causally tracking independent truths, it applies equally to math and morality. If we accept that we can have knowledge of necessary mathematical truths despite our evolutionary origins (perhaps through a faculty of rational insight), the moral realist can claim the same for moral truths. On this reading, the CiG argument successfully neutralizes the EDA by forcing a *reductio*: since we cannot accept mathematical skepticism, we must accept that evolutionary etiology is compatible with realist justification.

  **The Principled Disanalogy: Explanatory Relevance**

  Despite the allure of this parity, it collapses under scrutiny of the **causal etiology** of the beliefs and the **explanatory role** of the truths in question. The disanalogy does not rest on the modal status of the truths, but on how those truths relate to the physical mechanisms of survival.

  In the case of basic mathematics, there is a direct link between mathematical truth and physical reality that impacts fitness. When an ancestor distinguishes one predator from two, the belief "there are two predators" is adaptive *because* it corresponds to a physical fact. The mathematical structure is instantiated in the physical world. The truth of the arithmetic belief is what makes the behavior successful; if 1+1 equaled 3 in the physical world, the organism's counting mechanism would lead to death. Thus, there is a "third-factor" explanation: the physical facts constrain both survival and mathematical truth. Evolution selects for mathematical beliefs *because* they track the physical instantiations of mathematical truths. The adaptive value is parasitic on the truth.

  In the case of morality, this link is severed. Street's argument targets *normative* truths, not merely descriptive sociological facts. Consider the belief "suffering is bad." Evolution may have selected for the disposition to avoid suffering because pain signals tissue damage, which threatens survival. However, the moral realist claims "suffering is bad" is an independent normative truth. The adaptive value of avoiding pain is fully explained by the biological fact of tissue damage and the phenomenological fact of pain. The *independent moral truth* adds nothing to the explanation of why the belief was selected. Unlike the mathematical case, where the truth of the belief explains its utility, in the moral case, the utility explains the belief regardless of the truth.

  This distinction is reinforced by the **indispensability argument**. Mathematical realism is often defended via the Quine-Putnam indispensability thesis: we ought to be ontologically committed to all entities indispensable to our best empirical theories. Mathematics is indispensable to physics; we cannot formulate laws of motion without numbers. Therefore, mathematical beliefs are constrained by empirical success in a way moral beliefs are not. Moral facts are not indispensable to our best *empirical* explanations of the physical world. We can explain the evolution of altruism using game theory and genetics without positing independent moral truths. Because mathematical beliefs are tethered to empirical success which is itself truth-apt, the evolutionary origin of math beliefs is constrained by reality. Moral beliefs, lacking this empirical tether, are free-floating relative to independent moral facts, making the coincidence problem acute for morality but not for mathematics.

  **Counter-Arguments and Rebuttal**

  Proponents of CiG, such as Clarke-Doane, might object that this relies on a narrow view of indispensability. They argue for "deliberative indispensability": just as we cannot do physics without math, we cannot deliberate about action without moral norms. If math is justified by its role in empirical theory, perhaps morality is justified by its role in practical reasoning.

  However, this analogy fails to address the specific epistemic challenge of the EDA. The EDA is not about whether we can *use* these beliefs, but whether we are justified in believing they correspond to *mind-independent reality*. The success of empirical theory provides an external check on mathematical beliefs; if our arithmetic consistently failed to predict physical outcomes, we would revise it. There is no analogous external check for moral realism. If our moral beliefs promote fitness but clash with independent moral truths (e.g., if "genocide is permissible" were fitness-enhancing and the independent moral truth), evolution would still select for them. In mathematics, if "2+2=5" were fitness-enhancing (perhaps in some non-Euclidean survival context), evolution might select for it, but the *physical world* would punish the error eventually. The physical world instantiates mathematical relations; it does not instantiate normative relations in the same robust, causal sense.

  Furthermore, Clarke-Doane's appeal to modal security—that necessary truths are safe because they couldn't be otherwise—undermines the realist's own position. If moral truths are necessary, then in any world where humans evolve, the truths remain the same. But the EDA argues that the *content* of our beliefs is shaped by fitness, not truth. Even if the truths are necessary, the probability that our fitness-shaped beliefs align with them is low without an explanatory link. Mathematics has that link (physical instantiation); morality does not.

  **Verdict**

  The "companions in guilt" argument is a powerful heuristic for testing the consistency of epistemic principles, but it does not succeed in defeating Street's evolutionary debunking argument. The parity between mathematics and morality is superficial, masking a deep structural disanalogy. Mathematical beliefs, at the level shaped by evolution, are about physical quantities that causally impact survival; their truth is a precondition for their adaptive success. Moral beliefs, conversely, are about normative reasons whose independent truth plays no causal role in their adaptive success.

  Consequently, we are justified in retaining mathematical realism while accepting the debunking of moral realism. The mathematical realist can point to the physical instantiation of mathematical properties as the bridge between fitness and truth. The moral realist has no such bridge; they are left with the implausible coincidence that the forces of blind selection happened to align our normative attitudes with independent normative facts. Therefore, the verdict is that Street's argument stands: evolutionary genealogy undermines the justification for moral realism in a way it does not for mathematical realism. The guilt is not shared.
