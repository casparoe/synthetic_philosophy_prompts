answer: |-
  **Setting:** *A cluttered faculty office, late afternoon. Sunlight cuts through the dust motes over stacks of papers. Two proposals sit on the desk between them. Elena sips cold coffee; Marcus paces near the window.*

  **Marcus:** So, the verdict is in. You're stamping "Approved" on the chimpanzee study and "Rejected" on the human subject. Structurally, they are identical. Substantial, non-lethal pain. High aggregate payoff in suffering reduced. The only variable is the species of the subject.

  **Elena:** Not just species, Marcus. Status. I'm defending a considered Nozickian line. The human subject in Proposal B, despite his profound disabilities, commands a side constraint. The chimpanzee in Proposal A does not. He is protected by welfare considerations, yes, but those can be overridden by sufficient aggregate good. Side constraints cannot.

  **Marcus:** But on what ground? We agreed to use Nozick's own metric for this evaluation. The capacity to hold and live by an overall conception of one's life. You read the file on Subject B. He has never formed a conception of his life. He will never revise one. He lives in an eternal present. By Nozick's explicit criterion—the one he tied to meaningfulness—Subject B is indistinguishable from the chimpanzee. In fact, the chimp has better long-term memory and social problem-solving. If you sacrifice the chimp for the greater good, consistency demands you sacrifice the human.

  **Elena:** Consistency is a virtue, Marcus, but not if it ignores the texture of moral reality. Nozick himself retreated from the hard line on capacity. In his review of Regan, he conceded that species membership arguments are weak, *but* he maintained that humans possess a higher degree of inherent value. It's not a binary switch—rights or no rights. It's a gradient. The human subject belongs to a kind of being that is generally capable of that normative self-governance. To violate him is to violate the sanctity of that kind.

  **Marcus:** That's a retreat into mysticism. "Sanctity of the kind"? If the individual lacks the capacity that generates the value, why does the "kind" matter? If I have a broken clock that never tells time, it doesn't gain accuracy because it was manufactured in a factory of working clocks. You're asking me to accept that Subject B is protected by a capacity he does not possess, while the chimp, who possesses *more* cognitive faculties than B, is left exposed to the utilitarian calculus. That isn't a gradient; it's an arbitrary cliff.

  **Elena:** It's not arbitrary if we recognize that moral status isn't solely about individual cognitive performance. It's about the community of meaning. Subject B is embedded in human relationships that are structured by the very capacity you value. His parents, his caregivers, they relate to him as a person. To use him as a resource is to degrade *them*, and the normative space they inhabit. The chimp, however socially bonded, does not inhabit a normative community of rights-bearers.

  **Marcus:** So the protection comes from *our* view of him, not *his* nature? That makes his rights contingent on our sentiment. If we decided, as a society, to view severe cognitive disability as merely biological, your protection evaporates. That's terrifying. And regarding the chimp: you say he doesn't inhabit a normative community. But Proposal A stipulates rich social bonds. If we harm him, we degrade *his* community. Why is the degradation of human relationships morally weightier than the degradation of chimpanzee relationships?

  **Elena:** Because human relationships are constituted by the recognition of rights. When we harm Subject B, we aren't just causing pain; we are breaching a trust that is foundational to human society. We are saying, "No human is safe." With the chimp, we are weighing pain against pain.

  **Marcus:** But you've just admitted the "capacity" criterion—the one Nozick tied to side constraints—doesn't apply to Subject B. You're now relying on a "human community" argument. Nozick called resting the line on species membership alone "weak." You're essentially arguing for species membership plus a sociological gloss. If the capacity is the justification for the side constraint, and the capacity is absent, your justification for blocking Proposal B collapses. If you approve A, you must approve B.

  **Elena:** *(Pauses, looking at the file on Subject B)* You're pressing the "Argument from Marginal Cases" hard. And I'll concede this: If we strictly adhere to the "conception of a life" capacity as the *sole* necessary and sufficient condition for side constraints, then you are right. Subject B does not meet the threshold. My reliance on "inherent value" or "kind" is theoretically vulnerable. It feels robust, but if pressed to justify *why* that kind confers value absent the capacity, I cannot give you a non-circular answer. Nozick couldn't either. That is a real weakness in the hybrid view.

  **Marcus:** Thank you. That's progress. So, if the capacity isn't there, and species is morally arbitrary, then logically, Proposal B must be decided like Proposal A. Approved.

  **Elena:** Not necessarily. Conceding that the *capacity* argument fails for Subject B doesn't force me to approve Proposal B. It forces me to admit that the protection for Subject B rests on a different foundation than the protection for a typical adult human. It rests on the moral cost of eroding the principle of human inviolability. But let me turn the table. You argue for consistency: Decide them the same way. If I block B, you should block A. But you seem willing to approve B to match A.

  **Marcus:** Only because you've already approved A. If I had my way, I'd block both. Sentience is the line. Pain is the evil.

  **Elena:** But if you block both, you're extending Kantian side constraints to animals. Nozick rejected that. He said "utilitarianism for animals" was too minimal, but he didn't embrace full rights for them. If you block A, you're arguing that the chimp has a side constraint. What grounds that? Sentience?

  **Marcus:** Yes. The capacity to suffer is the prerequisite for having interests. If you can't suffer, nothing matters to you. If you can suffer, you have an interest in not suffering.

  **Elena:** Here is where I push back. You concede too much to the utilitarian calculus in Proposal A, yet demand deontological protection in Proposal B if we follow your logic. But consider this: If we grant full side constraints to every sentient being, we paralyze moral action. Predation, medical research, even agriculture become impossible without massive rights violations. Nozick's "gradient" idea— that animals have inherent value, just *less*—allows us to weigh their suffering against significant human goods.

  **Marcus:** That gradient is convenient, but is it coherent? "Less inherent value"? Value is usually categorical.

  **Elena:** Is it? Consider the "conception of a life" capacity again. You dismissed it because Subject B lacks it. But for the vast majority of humans, and potentially for some animals, that capacity allows for a *different kind* of loss. When I harm a being that plans for the future, I frustrate not just their present sensation, but their entire narrative arc.

  **Marcus:** Subject B has no narrative arc.

  **Elena:** True. But *you* must concede something here. You argue that because Subject B lacks the capacity, he loses the protection. But in doing so, you are treating the "conception of a life" as a binary switch for moral worth. Isn't it possible that this capacity is a *magnifier* of value, not the sole source of it? Subject B lacks the magnifier, but he still possesses the base value of human life. The chimp possesses a different base value.

  **Marcus:** *(Stops pacing, leans against the desk)* I see. You're arguing that the "conception of a life" is a threshold for *full* side constraints, but not for *some* protection.

  **Elena:** Exactly. And here is my concession to you: If the "conception of a life" is the gold standard for side constraints, then protecting Subject B *on those grounds* is inconsistent. I cannot claim he has the same status as a neurotypical adult. I have to admit his protection is derivative, symbolic, or based on a "humanity" criterion that is theoretically messy. That objection has real force. It means my view isn't as clean as Nozick hoped.

  **Marcus:** And I will concede this to you: The "gradient" of value is harder to dismiss than I initially allowed. If we treat all sentient pain as absolutely equal, we ignore the moral significance of agency and future-oriented planning. There is a loss in harming a being that understands *why* it is being harmed, or that has a future it anticipates, that is distinct from the pain itself. Even if Subject B lacks that, the *class* of beings he belongs to is defined by it. Ignoring that distinction entirely—treating the chimp and the human as morally identical—flattens the moral landscape in a way that feels... reductive.

  **Elena:** So you admit the "kind" argument has some intuitive pull, even if it's theoretically weak?

  **Marcus:** I admit it has *psychological* pull. Whether it has *moral* pull is still the question. But if we decide Proposal B the same as Proposal A—by approving both—we are saying that a human being, simply by lacking a specific cognitive capacity, becomes a resource. That sets a precedent that endangers everyone who values that capacity.

  **Elena:** Precisely. That is the symbolic cost. If we approve Proposal B, we sever the link between human biological life and inviolability. We make rights contingent on performance.

  **Marcus:** But if we approve Proposal A, we make rights contingent on species. We make them contingent on biology.

  **Elena:** *(Sighs)* We're at the impasse Nozick left us. I block B because the cost to human normative society is too high, even if the individual capacity is absent. You want to approve B because consistency demands we don't privilege biology over capacity.

  **Marcus:** Not privilege biology. But refuse to privilege it *without* capacity. Since B lacks the capacity, biology shouldn't save him if it didn't save the chimp.

  **Elena:** And I maintain that biology *does* save him, because human life carries a residual inherent value that animal life does not, even if the "conception of life" capacity is the primary source of that value. It's a safety net.

  **Marcus:** A safety net made of species membership. Nozick called it weak.

  **Elena:** He called it weak, but he didn't discard it. He said animals have *some* inherent value. I'm saying humans have *more*, enough to block Proposal B, even if not enough to block Proposal A.

  **Marcus:** Then we disagree on the magnitude of that "more." I think it's zero. You think it's decisive.

  **Elena:** And neither of us can prove it to the other today. But I'm keeping my stamp on Proposal B as "Rejected."

  **Marcus:** And I'm keeping my argument that if you ever waver on the chimp, the human goes next.

  **Elena:** *(Gathers the papers)* Then we'll have to live with the tension. Just as Nozick did.

  **Marcus:** *(Nods)* At least we agree the pain is real. The rest is just philosophy.

  **Elena:** That's all we have.
