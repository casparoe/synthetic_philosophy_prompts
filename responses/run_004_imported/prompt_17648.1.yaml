answer: |-
  This is one of the best questions in contemporary epistemology, and your frustration is completely warranted. The reason you walked away confused is that for the first decade of this debate, the "Bank Case" was the only weapon in the arsenal, and both sides wielded it to explain the *exact same intuition*.

  If all you have is the Bank Case, Contextualism and Pragmatic Encroachment (specifically Subject-Sensitive Invariantism, or SSI) look like redundant descriptions of the same phenomenon. They are "extensionally equivalent" regarding the standard cases.

  To see the daylight, you have to stop looking at the *subject's* stakes and start looking at *who* is doing the judging. The split isn't about whether stakes matter; it's about **whose stakes matter** and **what part of the machinery they break.**

  Here is the deep dive on the theoretical architecture, followed by the specific case that forces them apart.

  ### 1. The Core Architecture: Semantics vs. Metaphysics

  The fundamental disagreement is about what kind of problem the Bank Case poses.

  **Contextualism (The Semantic Solution)**
  *   **Proponents:** Keith DeRose, Stewart Cohen, David Lewis.
  *   **The Claim:** The word "knows" is an indexical, like "tall," "here," or "flat." There is no single property of "knowledge." There is only "knowledge-relative-to-standards."
  *   **The Mechanism:** When you enter a high-stakes conversation, the *conversational context* shifts the semantic content of the word "knows." You are literally talking about a different, stricter relation.
  *   **The Locus of Change:** The **Attributor** (the person saying "He knows").
  *   **The Motivation:** It preserves **Epistemic Intellectualism**. This is the traditional view that knowledge is purely a function of truth, belief, and evidence (the "epistemic" factors). Practical stakes should not change whether you *know* something, only whether you should *say* you know it. Contextualism saves Intellectualism by pushing the stakes into the semantics of the word rather than the nature of the knowledge itself.

  **Pragmatic Encroachment / SSI (The Metaphysical Solution)**
  *   **Proponents:** Jeremy Fantl, Matthew McGrath, Jason Stanley.
  *   **The Claim:** The word "knows" has a fixed, invariant meaning. However, the *facts* that make a knowledge claim true include practical facts.
  *   **The Mechanism:** Knowledge is the norm of action (you should only act on P if you know P). If the stakes of acting on P are high, the threshold for "enough evidence" to count as knowledge rises. The stakes "encroach" on the epistemic domain.
  *   **The Locus of Change:** The **Subject** (the person who supposedly knows).
  *   **The Motivation:** It preserves **Semantic Invariantism**. It keeps the meaning of "knows" stable (which linguists generally prefer) but accepts that traditional Epistemic Intellectualism is false. It admits that practical rationality is part of the recipe for knowledge.

  ### 2. The "Separation Case": Where They Diverge

  In the standard Bank Case, the Subject's stakes and the Attributor's stakes rise together. Hannah is worried about the check (Subject stakes), and you are discussing Hannah's worry (Attributor context). To distinguish the theories, we need a case where **the Subject's stakes are Low, but the Attributor's stakes are High.**

  Let's construct this case. Call it **"The Spy and the Tourist."**

  **The Setup:**
  *   **The Subject (John):** John is a tourist in a foreign city. He glances at a map and sees that the Museum is on Main Street. For John, the stakes are trivial. If he's wrong, he walks an extra ten blocks. No big deal. His evidence is standard (a glance at a tourist map).
  *   **The Attributor (Sarah):** Sarah is a spy. She is tailing John. She has bet her life (and national security) on John's movements. She needs to radio headquarters whether John *knows* where the Museum is, because if John knows, he will go there, and she needs to set up a perimeter. For Sarah, the stakes are life-or-death.
  *   **The Evidence:** John's evidence is fixed (the map glance). It is sufficient for a low-stakes situation, but arguably insufficient for a life-or-death situation (he didn't check a GPS, ask a local, etc.).

  **The Question:**
  Sarah is on the radio. She says: *"John \_\_\_\_\_ where the Museum is."*
  Is it **true** for Sarah to fill in that blank with "knows"?

  #### The Contextualist Verdict: FALSE
  For the Contextualist, the truth of a knowledge claim is determined by the **Attributor's Context**.
  *   Sarah is in a high-stakes context (life or death).
  *   Therefore, the semantic standards for the word "knows" are raised *in Sarah's mouth*.
  *   Even though John is relaxed, Sarah is playing a high-stakes language game. In her context, "knows" requires evidence sufficient for life-or-death decisions.
  *   John's map glance isn't enough for *that* standard.
  *   **Result:** Sarah cannot truly say "John knows." The proposition she expresses is false.

  #### The Encroachment/SSI Verdict: TRUE
  For the Encroacher, the truth of a knowledge claim is determined by the **Subject's Practical Situation**.
  *   John is the one who "knows" (or doesn't). Sarah is just reporting on John's mental state.
  *   John's stakes are low (walking ten blocks).
  *   For John's stakes, his evidence (the map) *is* sufficient. He literally knows.
  *   Sarah's panic does not change John's epistemic position. Her stakes are irrelevant to whether *John* knows. (Her stakes might mean she shouldn't *rely* on him, but that's a different claim).
  *   **Result:** Sarah can truly say "John knows." The proposition is true, even if acting on it is crazy for her.

  ### 3. Why This Distinction Matters (The "So What?")

  You asked why you need two competing frameworks if they handle the Bank Case the same. The answer lies in what each theory sacrifices to save our intuitions.

  **1. The Cost of Contextualism (Semantic Complexity)**
  Contextualism saves the idea that knowledge is purely about evidence and truth. It keeps practical stakes out of the "mind of the knower." But the cost is linguistic. It implies that when a skeptic says "You don't know anything" and a normal person says "I know I have hands," they aren't disagreeing. They are talking past each other, using different definitions of "know."
  *   *Journalistic Angle:* Contextualism makes knowledge claims incredibly fragile. It means you can lose knowledge just by someone else mentioning a remote possibility of error in the conversation.

  **2. The Cost of Encroachment (Epistemic Purity)**
  Encroachment keeps the language stable. "Knows" means the same thing everywhere. But the cost is metaphysical. It admits that two people can have the *exact same evidence* and believe the *exact same truth*, but one knows and the other doesn't, simply because one has more to lose.
  *   *Journalistic Angle:* This is radical. It suggests that wealth or security can literally increase your knowledge. A rich person (for whom a lost check is trivial) might "know" the bank is open, while a poor person (for whom a bounced check is ruinous) with the exact same evidence does *not* know. Encroachers accept this; Contextualists say the poor person knows, but the rich person is in a context where they can't *say* it.

  ### 4. How to Frame This in Your Piece

  If you want to move beyond the "two vocabularies" feeling, frame it as a battle over **where the boundary of the mind ends.**

  *   **The Contextualist** draws a hard shell around the mind. Inside is evidence, truth, and belief. Outside is stakes, action, and consequences. When stakes seem to affect knowledge, the Contextualist says, "No, that's just us changing the labels on the box."
  *   **The Encroacher** says the shell is porous. What is happening *outside* the mind (the consequences of being wrong) seeps *inside* and changes the status of the mental state itself.

  **The "Killer" Quote for your piece:**
  You can tell your readers: *"Contextualism says the stakes change the scorecard. Pragmatic Encroachment says the stakes change the game."*

  ### Summary for your notes:
  *   **Bank Case:** Both agree (High stakes = No knowledge ascribed).
  *   **Spy/Tourist Case (Attributor High / Subject Low):**
      *   **Contextualist:** No knowledge ascribed (Attributor's stakes rule).
      *   **Encroacher:** Knowledge ascribed (Subject's stakes rule).
  *   **Theoretical Trade-off:** Contextualism saves the purity of knowledge but complicates language. Encroachment simplifies language but makes knowledge dependent on practical consequences.

  This distinction allows you to report that this isn't just a semantic squabble; it's a disagreement about whether human rationality is compartmentalized (epistemic vs. practical) or integrated.
