          *   *Truth Condition:* "S knows P" is true in Context A (low standards) but false in Context B (high standards), even if S and P are identical.
          *   *Key Feature:* It's about the *speaker's* context, not the *subject's* stakes.
      *   **Pragmatic Encroachment / SSI (e.g., Fantl, McGrath, Stanley):** The word "knows" has a fixed meaning (invariantism). However, whether someone *actually* knows depends on practical factors (stakes) facing the *subject*.
