      *   **Key Context:** Condorcet's 1785 *Essay on the Application of Analysis to the Probability of Majority Decisions*.
      *   **Key Tension:** Condorcet's Jury Theorem (majority reliability) vs. Condorcet's Paradox (cyclical majorities) vs. The Discursive Dilemma (inconsistency between premise-based and conclusion-based voting).
