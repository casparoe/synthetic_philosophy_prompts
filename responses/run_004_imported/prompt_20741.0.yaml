          *   *Claim:* Ordinary tools/programs allow tracing back to builder/user due to foresight/control. Learning systems break this because they aren't line-by-line programmed, act unpredictably, and aren't moral agents.
          *   *Assessment:* This is a solid summary of Andreas Matthias's "The Responsibility Gap." He argues that traditional attribution models fail because adaptive systems learn in ways not explicitly determined by the programmer. The "gap" is indeed between the outcome and a blameworthy human agent.
          *   *Potential Issue:* Does it capture the *epistemic* vs. *control* nuance? Matthias focuses heavily on the unpredictability (epistemic) leading to a lack of control. The student mentions "foresight and control." This is accurate enough for a short answer.

      *   **Part 2: Sparrow's Extension:**
