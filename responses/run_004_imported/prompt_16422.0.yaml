      *Refining the Argument:*
      *   *Marcus's core:* Safety condition. To know $p$, you couldn't easily have believed $p$ when $p$ is false. In a gradual series, nearby cases are indistinguishable. So if you know in case $i$, you must believe in case $i+1$. But eventually $p$ is false. So you don't know in case $i$.
