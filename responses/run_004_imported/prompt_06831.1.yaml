      *   **Gerrit's Philosophy:** He was proud of his work. He didn't see it as a crime/victimless prank. He believed a forgery good enough to fool experts achieved everything the original did. He thought "authenticity" was a market story, not a visual reality.
      *   **The Constraint (The Note):** No apologies. No treating his life as pranks.
      *   **The Audience:** Split 50/50.
          *   Group A: Family/neighbors (want comfort, love, normalcy).
          *   Group B: The "Fooled" (auction specialist, conservator, etc. - listening for honesty/acknowledgment).
      *   **The Goal:** 5-7 minutes spoken (approx. 750-1000 words). Must comfort Group A without lying to Group B. Must address the philosophical question of the forgery without turning the funeral into a debate.
      *   **Tone:** Respectful, nuanced, honest, slightly literary (since the speaker is a writer), but accessible.

  2.  **Determine the Core Theme:**
      *   The tension between *truth* and *beauty/experience*.
      *   Gerrit's life asks: Does the origin of a thing matter more than the effect it has on the viewer?
      *   For the family: Gerrit loved us (true).
      *   For the experts: Gerrit challenged your perception (true).
      *   Bridge: The value of attention. Gerrit paid attention to the masters, and he demanded we pay attention to the art, not just the label.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the task. Establish the relationship. Validate the grief for the family side immediately.
      *   **Addressing the "Elephant in the Room":** Don't hide the forgery. It's known by half the room. Acknowledge it early but frame it through Gerrit's eyes, not the law's eyes. Use his quote about authenticity.
      *   **The Family Side (Comfort):** Talk about his character *outside* the art. His patience, his observation, his love for his family. Connect his "forging" skills to human traits (listening, empathy, becoming what others need).
      *   **The Expert Side (Acknowledgment):** Speak directly to the conservators and auctioneers. Acknowledge their skill, but acknowledge Gerrit's respect for them. It was a dialogue, not a war. Validate their frustration without apologizing for Gerrit.
      *   **The Philosophical Core:** Address the prompt's specific question: *What is lost when a copy is indistinguishable?* Suggest that perhaps what is gained is a reminder to look closer.
      *   **Closing:** Bring it back to memory. How we remember him. The legacy isn't the paintings, but the attention he taught us to pay.

  4.  **Refining the Tone:**
      *   *Avoid:* Defensiveness, arrogance, excessive sorrow, or moralizing.
      *   *Include:* Warmth, specific imagery (paint, light, hands), honesty.
      *   *Key Phrase to Integrate:* "Authenticity was a story the market tells."

  5.  **Drafting - Iteration 1 (Mental Outline):**
