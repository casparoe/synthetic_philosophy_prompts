answer: |-
  Thank you all for coming. For those who don't know me, I'm [Name]. I'm Gerrit's great-nephew, and in the family mythology, I'm "the writer." Usually, that just means I'm the one people ask to fix the grammar on a birthday card. But this time, it meant I was volunteered for this.

  Standing here, looking out at this room, I feel the weight of two different expectations. I see half of you looking for a uncle, a neighbor, a friend who made you laugh at barbecues and remembered your children's names. You want to grieve a man. And I see the other half of you looking for a ghost. You see the hand that held the brush. You see the man who challenged your eyes, your careers, and your definitions of truth.

  Gerrit left instructions for this day. He wrote a note to my aunt. He said he didn't want apologies. He didn't want his life's work dismissed as a string of pranks. He was proud of what he did. He believed, right to the end, that a painting good enough to fool the experts had achieved everything the original achieved. He told me once, over coffee that was mostly chicory, that "authenticity" is just a story the market tells about provenance and money. It isn't something you can see in the paint. It isn't something you can feel in the light.

  I am not going to apologize for him today. To do so would be to lie about who he was. But I am also not going to stand here and pretend that the only thing that mattered about Gerrit was the deception.

  To the family here: Gerrit loved you. That was not a forgery. The patience he showed teaching me to ride a bike, the quiet way he sat with my grandmother when she was sick, the stories he told us that had nothing to do with art history—that was all real. He was a man who paid attention. In a world that rushes, Gerrit looked. He looked at people the way he looked at a canvas. He saw the cracks in the varnish of our lives and didn't try to paint over them. He just sat with us in them. If you are crying today, cry for that. Cry for the man who made you feel seen. That was his genuine work.

  To the colleagues, the conservators, the specialists in the room: I know what he took from you. I know the frustration of the Cuyp that took two years to unmask. But I also know that Gerrit respected you. He didn't view you as victims; he viewed you as the necessary audience. A forgery without an expert to judge it is just a copy. It was your expertise that gave his work its tension. He believed that in trying to catch him, you were doing the same work he was: looking closer than anyone else was willing to look. He wasn't trying to destroy the art world; he was trying to wake it up. He wanted you to trust your eyes more than your paperwork.

  And that leaves me with the question I've been wrestling with in the quiet hours since he died. The question his life poses to all of us. When a copy is good enough that no one, including the eye, can tell... what is lost?

  If the emotion is the same, if the beauty is the same, if the light hits the retina in the exact same way... does the signature matter?

  Gerrit would say no. He would say the art is in the experience, not the biography of the object.

  But I think I know what is lost. It isn't beauty. It isn't even truth, exactly. What is lost is trust. And trust is the medium we use to navigate the rest of our lives. We need to know where things come from to know where we stand. Gerrit shook that foundation. He made the world feel a little less solid.

  But perhaps there is something gained, too. When we look at a painting now, knowing what he knew, we don't just look at the name in the corner. We look at the brushstroke. We look at the shadow. We question. We engage. He forced us to stop accepting labels and start seeing the thing itself.

  In a way, Gerrit was a writer, just like me. He just used oil instead of ink. He crafted narratives about who he was, where the paintings came from, and what they were worth. He spent fifty years building a mythology. And like any good story, it required a suspension of disbelief.

  So, how do we say goodbye to a man who lived in the space between the real and the made-up?

  We do it by being real now.

  To the family: Let's remember the Sunday dinners. Let's remember the sound of his laugh. That didn't need a signature to be valuable.
  To the experts: Let's honor him by keeping your eyes open. Keep looking closer. Keep questioning. That was the game he loved to play.

  Gerrit didn't want a eulogy that sanitized him. He wanted to be known. And the truth is, he was a complex man. He was a liar who told the truth about art. He was a criminal who loved beauty more than the law. He was a forger who was genuine in his love for his family.

  We are gathered here to mourn a death. But Gerrit spent his life thinking about what endures. Paintings fade. Canvas rots. Provenance gets lost in fires and floods. The only thing that actually survives us is the way we changed the people who are left behind.

  He changed me. He taught me that the world is not as solid as it looks, and that's terrifying, but it's also where the magic is. He taught me to look at the light, not the label.

  So, I am not going to tell you that Gerrit was a saint. I'm not going to tell you he was a sinner, either. I'm going to tell you he was an artist. He spent eighty-six years trying to make something beautiful enough to stop you in your tracks.

  If you're crying, let yourself cry. If you're angry, let yourself be angry. But while you're here, look around. Look at the faces of the people he loved. Look at the light coming through the window. For a moment, don't worry about where it comes from, or who owns it, or if it's authentic. Just let it hit your eye.

  That, I think, is what he would have wanted. He wanted us to look. And finally, today, we are all seeing him clearly.

  Rest well, Gerrit. The canvas is dry. The work is done.
