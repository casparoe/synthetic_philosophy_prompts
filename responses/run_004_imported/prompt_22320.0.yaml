answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Grandad]'s grandchild.

  Standing up to speak at a 90th birthday for a trial lawyer is a bit like volunteering to give a closing argument in front of a judge who's already heard all the evidence. I know I'm being timed, and I know the jury is skeptical. So, I'll try to keep my objections to a minimum.

  Ninety years is a staggering number. When we look at that milestone, it's easy to focus on the things that slow down. We know the knees aren't what they used to be. We know the marathon running days are likely behind us. But there is a very old idea—one that [Grandad] would appreciate—that suggests we're measuring the wrong metrics.

  I recently got into a debate with a friend about a book by the Roman statesman Cicero called *De Senectute*, or "On Old Age." Now, stick with me, family; I promise I'm not turning this into a lecture. Cicero argued that old age only looks like a decline if you believe a person's value is tied to their physical strength. He said that if you think life is about sprinting or lifting heavy stones, then yes, getting older is a disaster. But if life is about judgment, strategy, and authority, then age isn't a decline—it's an accumulation of power.

  He pointed to men like Fabius Maximus, who saved Rome not by swinging a sword, but by knowing when *not* to fight. He talked about Appius Claudius, who was old and blind by the end, yet when he spoke in the Senate, the room went silent. They didn't steer the empire with their muscles; they steered it with their minds.

  Looking at [Grandad]'s career, that argument stops being theoretical and starts looking like a biography.

  For sixty years, this man has been in the trenches of the law. And for those of you in the room who are partners at his firm, you know exactly what I mean. The law isn't won by the person who can carry the heaviest box of files. It's won by the person who can spot the one precedent everyone else missed. It's won by the person who knows that the right question is more dangerous than the right answer.

  [Grandad], you might not be running to the courthouse anymore, but the phone still rings. Your old partners still pick it up. They still ask, "How would you handle this?" "What do you see here?" That isn't nostalgia. That is active, vital counsel. You are still steering the ship, even if you're letting the younger crew handle the oars.

  To the family: this is the legacy we need to pay attention to. It's easy to worry about aging when we see physical things get harder. But [Grandad] shows us that there is a tier of influence that actually *requires* time to unlock. You can't rush wisdom. You can't hack experience. You have to live through the cases, the losses, the wins, and the decades to earn the kind of authority that makes a room full of sharp lawyers stop talking and listen.

  So, I want to propose a toast.

  To [Grandad]. Thank you for proving that while physical strength might have an expiration date, judgment does not. Thank you for showing us that the sharpest tool in the room isn't the newest one, but the one that's been honed for ninety years.

  May your phone keep ringing, may your memory stay sharp, and may you continue to teach us that the best way to move the world isn't always to push it, but to guide it.

  Happy 90th Birthday.
