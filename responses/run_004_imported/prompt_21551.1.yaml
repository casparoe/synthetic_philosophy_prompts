      *   *The Asteroid Analogy:* Early asteroid work was based on orbital mechanics (known physics) applied to new objects. This proposal is based on *new physics* claimed by one person without peer review.
      *   *The Monitoring Paradox:* If the risk is real, monitoring doesn't stop it. If the risk is fake, monitoring is waste. The value is in *prevention* or *consensus building*, not just watching.
      *   *Foundation Role:* We are a small family foundation, not a government DARPA. We can't afford to be the sole backer of fringe x-risk science.

