      Okay, I will recommend **Declining the $350k request** but propose a **conditional pathway** (funding an expert review) to address the asteroid objection. This shows we aren't ignoring x-risk, just ignoring *unverified* x-risk.

      *(Wait, re-reading the "Leverage Penalty" bit)*: The committee member mentioned it. I should explain it in the memo as part of the rationale.

      *(Final Plan)*:
      1. Recommendation: Decline $350k.
      2. Rationale: Epistemic fragility (invented odds), single-point failure (one guy), budget concentration.
      3. Asteroid Rebuttal: Consensus vs. Isolation.
      4. Policy: The "Epistemic Triangulation" test.

      *Let's write it.*

