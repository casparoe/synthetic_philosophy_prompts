      *   **The "Monitoring" Aspect:** He's asking for money to *monitor* the risk, not necessarily to stop the experiment (which amateurs might do anyway). This is slightly confusing. Is he monitoring to warn others? Or monitoring to detect the breach? If the breach is catastrophic, monitoring doesn't help much unless it prevents the experiment.
