answer: |-
  This is a classic debate in epistemology and metaphysics. You and your friend have stumbled upon one of the most famous results in 20th-century philosophy: **Fitch's Paradox of Knowability** (published by Frederic Fitch in 1963).

  Your intuition is logically sound: the Knowability Principle, combined with very weak assumptions about knowledge, does indeed entail that all truths are already known. Your friend's intuition is also common: the Knowability Principle *feels* like a core commitment of anti-realism (the idea that truth cannot outstrip our ability to verify it).

  Here is the step-by-step derivation you asked for, followed by an assessment of whether your friend's restriction is a principled philosophical move or an *ad hoc* patch.

  ---

  ### Part 1: The Derivation (Step-by-Step)

  To reconstruct this yourself, you need a basic system of epistemic logic. We need three standard assumptions about "Knowledge" ($K$):

  1.  **Factivity:** If you know $p$, then $p$ is true. ($Kp \to p$)
  2.  **Distribution:** If you know a conjunction, you know each part. ($K(p \land q) \to Kp \land Kq$)
  3.  **Knowability Principle (KP):** If $p$ is true, it is possible to know $p$. ($p \to \Diamond Kp$)

  *Note: $\Diamond$ means "It is possible that..."*

  **The Goal:** Prove that if KP is true, then there are no unknown truths. (i.e., $p \to Kp$).

  **The Proof:**

  1.  **Assume for reductio:** Suppose there is a truth that is unknown.
      Let this proposition be $q$. So, $q$ is the statement: **"$p$ is true and $p$ is not known."**
      Formally: $q = (p \land \neg Kp)$.

  2.  **Apply the Knowability Principle to $q$.**
      If KP holds for *all* truths, it must hold for $q$.
      So: $(p \land \neg Kp) \to \Diamond K(p \land \neg Kp)$.

  3.  **Analyze the consequent:** $\Diamond K(p \land \neg Kp)$.
      This says: "It is *possible* to know that ($p$ is true and $p$ is not known)."
      To see if this is possible, let's look inside the "possible world" where this knowledge happens.

  4.  **Assume there is a possible world where $K(p \land \neg Kp)$ is true.**
      In this world, an agent knows the conjunction.

  5.  **Apply Distribution.**
      If the agent knows the conjunction $(p \land \neg Kp)$, they must know each part.
      So, in this world: $Kp \land K(\neg Kp)$.

  6.  **Apply Factivity.**
      *   Since $Kp$ is true in this world, $p$ must be true in this world.
      *   Since $K(\neg Kp)$ is true in this world, $\neg Kp$ must be true in this world. (Factivity applies to negative knowledge too: if you know that you don't know $p$, then it is a fact that you don't know $p$).

  7.  **Identify the Contradiction.**
      In this possible world, we now have established:
      *   $Kp$ (from step 5)
      *   $\neg Kp$ (from step 6)
      This is a contradiction ($Kp \land \neg Kp$).

  8.  **Conclusion of the Lemma.**
      Because assuming $\Diamond K(p \land \neg Kp)$ leads to a contradiction, that state of affairs is impossible.
      Therefore: $\neg \Diamond K(p \land \neg Kp)$.
      *(It is impossible to know that "$p$ is true and unknown.")*

  9.  **Return to the Knowability Principle (Step 2).**
      We established in Step 2 that: $(p \land \neg Kp) \to \Diamond K(p \land \neg Kp)$.
      But we just proved in Step 8 that the right side ($\Diamond K(p \land \neg Kp)$) is **false**.

  10. **Modus Tollens.**
      If $A \to B$, and $B$ is false, then $A$ must be false.
      Therefore: $\neg (p \land \neg Kp)$.

  11. **Generalize.**
      This logic holds for any proposition $p$. So, for all $p$, it is false that "$p$ is true and unknown."
      Formally: $\forall p, \neg (p \land \neg Kp)$.

  12. **Logical Equivalence.**
      $\neg (p \land \neg Kp)$ is logically equivalent to $p \to Kp$.
      **Result:** If $p$ is true, then $p$ is known.

  **Summary:** If you accept that all truths are *knowable*, you are logically forced to accept that all truths are *known*. Since it is absurd to think we are omniscient, the Knowability Principle (as universally stated) must be false.

  ---

  ### Part 2: Assessing the Restriction

  Your friend suggested restricting the Knowability Principle to "ordinary" propositions, excluding ones like "$p$ and not known." You suspected this was an *ad hoc* patch. Who is right?

  The answer is nuanced. In the philosophical literature, this is known as the **Restriction Strategy**, most famously defended by philosopher Neil Tennant.

  #### 1. Why it looks *Ad Hoc* (Your View)
  You are right to be suspicious. If the Knowability Principle is supposed to capture the nature of *Truth*, why should the syntactic form of the sentence matter?
  *   **The "Arbitrary Line" Objection:** If truth is epistemic (based on verification), why does a proposition suddenly lose its "knowability" status just because it contains the operator $K$?
  *   **The "Revenge" Objection:** Even if you ban $p \land \neg Kp$, a clever logician can construct a new proposition that is logically equivalent but syntactically different, or use temporal operators (e.g., "$p$ is true and will *never* be known"). If the restriction is based purely on banning specific phrases, it is vulnerable to workarounds.

  If your friend's only argument is "Let's just exclude the sentences that break the proof," then yes, that is *ad hoc*. It saves the theory by shrinking its scope to avoid the counterexample.

  #### 2. Why it might be Principled (Your Friend's View)
  However, there is a principled way to make this restriction, which moves it beyond a mere patch. This relies on the **consistency of knowledge**.

  *   **The Cartesian Restriction:** Neil Tennant argued that the Knowability Principle should only apply to **Cartesian propositions**. A proposition is Cartesian if it is *logically consistent* to know it.
  *   **The Logic:** As we saw in the derivation above, $K(p \land \neg Kp)$ entails a contradiction. Therefore, $(p \land \neg Kp)$ is *not* a Cartesian proposition. It is a proposition that *cannot* be known, not because of our human limitations, but because the very concept of knowing it is incoherent.
  *   **The Principled Claim:** The anti-realist can argue: "We never claimed that *incoherent* propositions are knowable. We only claimed that all *genuine* truths are knowable. Since '$p$ and unknown' describes a state that cannot be coherently known, it isn't a counterexample to the spirit of the theory."

  #### 3. The Cost of the Restriction
  While the "Cartesian" restriction is more principled than a simple syntactic ban, it comes with a heavy cost for your friend's position:

  1.  **Weakening the Thesis:** The original anti-realist slogan was "Truth cannot outstrip Knowability." The restricted thesis becomes "Truth cannot outstrip Knowability, *except for truths that involve their own unknownness*." This is significantly less powerful.
  2.  **Conceding the Point:** By accepting the restriction, your friend effectively admits that there *are* truths (like the Fitch propositions) that are **not knowable**. This undermines the strong anti-realist intuition that *all* truth is essentially epistemic.
  3.  **The "Loss of Truth":** If there are truths that are logically impossible to know (even in principle), then truth *does* outstrip knowledge in some cases. The anti-realist has to explain why these "unknowable truths" don't count as real truth, which requires a lot of extra philosophical heavy lifting.

  ### Verdict

  **On the Logic:** **You won.** The derivation is valid in standard modal logic. If the Knowability Principle is unrestricted, Omniscience follows. There is no way around the math.

  **On the Philosophy:** **It's a draw, but you have the stronger position.**
  *   Your friend is right that restricting the principle to "Cartesian" (consistent) propositions is a recognized, principled move in the literature (Tennant 1997). It is not merely an *ad hoc* invention of your friend.
  *   However, you are right that this restriction significantly weakens the anti-realist position. It forces the anti-realist to concede that some truths are *in principle* unknowable.

  **How to close the debate:**
  Tell your friend: *"Okay, the restriction to 'Cartesian propositions' is a standard move, so it's not purely ad hoc. But you have to admit that this saves your theory only by conceding that there are some truths which are impossible to know. That means you can't hold onto the strong claim that 'All truth is knowable.' You have to settle for 'All non-self-defeating truth is knowable,' which is a much less exciting thesis."*
