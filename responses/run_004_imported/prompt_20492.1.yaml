answer: |-
  # The Price of Proof

  **By [Your Name]**

  In the classical picture of rationality, a mind is a mirror of logic. If you believe $A$, and you understand that $A$ implies $B$, you must believe $B$. If $A$ is a mathematical theorem, your confidence in it should be 100 percent. Anything less is a glitch—a failure of coherence akin to believing it is raining while simultaneously believing it is not.

  This is the doctrine of logical omniscience, embedded in the standard axioms of probability theory. It is a beautiful ideal, and it is utterly useless for actual thinkers. No human, and no computer, assigns probability 1 to the Riemann Hypothesis, even though it is either true or false. We live in a state of "logical uncertainty": we know the rules of the game, but not the outcome. For decades, formal epistemology had no language for this state. To be uncertain about a logical truth was, by definition, to be irrational.

  Then, in 2016, researchers at the Machine Intelligence Research Institute (MIRI) proposed a solution: Logical Induction. By modeling belief as a stock market where mathematical sentences are traded, they derived a criterion for rationality that allows for uncertainty about logic. Their claim is bold: a reasoner is rational if their beliefs cannot be exploited by any efficient computational trader.

  I spent weeks speaking to the architects of this framework and the philosophers tasked with evaluating it. The result is a sharp fracture in the community. On one side, computer scientists and AI theorists argue that Logical Induction finally vindicates intermediate credences in math as genuinely rational. On the other, formal epistemologists argue it is merely an elegant engineering trick that confuses market stability with truth.

  To write about this merely as a debate would be to miss the point. The conflict reveals a deeper crisis in how we define reason itself. After weighing the arguments, the verdict is clear: the epistemologists are correct that Logical Induction does not solve the *traditional* problem of justification, but they are wrong to think that matters. Logical Induction succeeds because it demonstrates that the traditional problem was ill-posed. For bounded agents, rationality is not about mirroring logic; it is about surviving computation.

  ### The Case for Vindication

  The proponents of Logical Induction start from a premise that should be obvious but is often ignored: we are not gods. Classical Bayesianism assumes a reasoner has infinite time to deduce all consequences of their beliefs. But real agents—humans, AIs, robots—live in time. We have limited compute.

  If you cannot deduce all consequences of your beliefs, you will inevitably appear incoherent by classical standards. You might believe $A$ and $A \implies B$, but fail to believe $B$ simply because you haven't run the deduction yet. The proponents argue that holding an agent to the standard of logical omniscience is like holding a runner to the standard of teleportation. It's not a norm; it's a category error.

  Logical Induction offers a norm for *bounded* beings. It constructs a "market" of beliefs. Imagine every mathematical sentence is a stock worth \$1 if true and \$0 if false. You set prices (credences) on these stocks. "Traders" (algorithms) look for patterns in your pricing. If you consistently price the stock "The trillionth digit of $\pi$ is even" at 90 cents, but a simple pattern shows it should be 50 cents, a trader will short your stock and bankrupt you.

  The central theorem of Logical Induction is that there exists a pricing algorithm (a logical inductor) that no *efficient* trader can exploit indefinitely. If you cannot be pumped for money by any efficient pattern-finder, your beliefs are, in a very robust sense, coherent.

  For the proponents, this is the missing Dutch-book argument. In standard probability, avoiding a Dutch book (a set of bets that guarantees a loss) is the definition of rationality. Logical Induction extends this to the computational realm. If your beliefs are resistant to all computable exploitation, they capture every pattern you are capable of seeing. To ask for more is to ask for omniscience. Therefore, assigning a 50 percent credence to an unproven conjecture is not a failure of logic; it is the rational response of a bounded agent to a hard problem. It vindicates the intuition that we *can* be rational while ignorant of theorems.

  ### The Case for Skepticism

  The epistemological critique cuts deeper. It concedes that Logical Induction is mathematically impressive but denies that it is epistemologically significant. The core objection is that *stability is not justification.*

  Imagine a market where traders are asleep. Prices might remain stable for years, not because they reflect value, but because no one is awake to challenge them. The skeptic argues that immunity to exploitation is a pragmatic property of the belief system, not an epistemic one. It tells you that your beliefs are defensible, not that they are likely true.

  This distinction matters because of the convergence guarantee. Logical Induction guarantees that your credences will eventually converge to the truth (0 or 1) as you compute more. However, there is no computable bound on *when* this happens. A logical inductor could assign 99 percent probability to a false statement for a billion years, provided no efficient trader can spot the error in that timeframe.

  To the epistemologist, this is fatal. If a theory of rationality allows you to be confidently wrong for eons without violating any norms, it has lost its grip on "rationality." It has redefined the word to mean "computationally stable" rather than "truth-tracking."

  Furthermore, the skeptic argues that Logical Induction quietly changes the subject. The original puzzle was: "What credence is *justified* by the evidence?" Logical Induction answers: "What credence prevents *bankruptcy*?" These are different questions. By focusing on the market, the framework reduces epistemology to economics. It treats uncertainty about math as uncertainty about one's own future computations—a psychological fact about the reasoner, rather than a logical relation between evidence and hypothesis. It solves the problem of how to act, but leaves unanswered the problem of what to believe.

  ### The Verdict: The Dissolution of the God's-Eye View

  The skeptic's critique is philosophically rigorous, but it relies on a ghost: the view from nowhere.

  The epistemologist demands a link between credence and truth that holds independently of the agent's computational limits. They want a guarantee that a rational credence is "close" to the truth *now*, not just in the limit. But in the domain of logical uncertainty, such a guarantee is impossible. If there were a computable way to know which unproven mathematical statements were likely true, those statements would effectively be proven. To demand short-run accuracy in logical uncertainty is to demand a shortcut through logic itself.

  The proponents of Logical Induction win this dispute, but not for the reason they claim. They do not succeed by providing a new form of *epistemic* justification that satisfies the classical criteria. They succeed by showing that the classical criteria are incoherent for bounded agents.

  The skeptic is right that Logical Induction redefines rationality. But this is not a bug; it is the feature. We must accept that for any agent embedded in a universe with computational costs, *epistemic rationality just is computational stability.* There is no separate "truth-tracking" norm that applies to beings who cannot see all logical consequences. To be rational is to make the best use of the resources you have. If your beliefs resist all efficient challenges, you have done everything a rational agent *can* do.

  The epistemologist's worry about the "billion years of error" is a category error. It judges a fish by its ability to climb a tree. A logical inductor is designed for a world where truth is hard to reach. If it takes a billion years to find an error that no efficient algorithm can spot, then holding the false belief for that duration is not irrational; it is inevitable. To call it irrational is to blame the agent for not being an oracle.

  Therefore, Logical Induction should be accepted as the correct normative framework for logical uncertainty, but with a crucial concession. It does not vindicate intermediate credences as "rational" in the sense of being justified by external evidence. It vindicates them as rational in the only sense available to us: they are the prices at which a bounded mind can operate without being systematically deceived by its own limitations.

  This is a retreat from the Platonic ideal of reason, but it is a retreat to solid ground. The epistemologist wants a map that shows the territory perfectly. Logical Induction offers a compass that never spins wildly, even if it points north slowly. For travelers who must move before they have surveyed the whole land, the compass is not just preferable; it is the only tool that counts as rationality.

  The puzzle of logical uncertainty is not solved by finding a way to be omniscient. It is solved by admitting we are not. Logical Induction is the first theory of belief that takes that admission seriously. It is not merely engineering; it is the epistemology of the finite.
