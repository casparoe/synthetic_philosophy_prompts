prompt: |-
  My aunt died last week. Twenty years ago she gave a kidney to a stranger she'd found through a transplant registry, and for the rest of her life she volunteered for that same registry, helping pair willing donors with strangers who needed a kidney. At the wake, an old friend of hers and I argued for the better part of an hour: he insisted that calling this "above and beyond the call of duty" is a comforting fiction, since if a donation is really as low-risk and high-benefit as the surgeons claim, morality arguably demanded it of all of us, and "supererogatory" is just the word we reach for so we don't feel implicated. I think the beyond-duty description is basically right, but I never managed a clean rebuttal. I'm giving a five-minute eulogy on Saturday to a room split between her fellow donors, who will notice immediately if I get the framing wrong, and family who mainly want to grieve. Write the eulogy: it needs to honor what she did as genuinely exceptional without implying that everyone who kept both their kidneys failed some duty, and without shrinking her sacrifice down to something merely nice.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Context:** The user's aunt died last week. She was a living kidney donor (to a stranger) 20 years ago and volunteered for the registry for the rest of her life.
      *   **Conflict:** At the wake, a friend argued that her actions weren't "above and beyond" (supererogatory) but rather a moral duty. If it's low risk/high benefit, he argued, everyone *should* do it, and calling it exceptional is a way to let ourselves off the hook. The user disagrees but couldn't rebut it well.
      *   **Task:** Write a 5-minute eulogy.
      *   **Audience:** A mix of fellow donors (who care about the framing of donation) and family (who want to grieve and honor her).
      *   **Constraints:**
          *   Honor her actions as genuinely exceptional.
          *   Do *not* imply that everyone else failed a moral duty by keeping their kidneys.
          *   Do *not* minimize her sacrifice (don't just call it "nice").
          *   Time limit: ~5 minutes (approx. 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Conflict (for internal clarity):**
      *   *The Friend's View (Utilitarian/Duty-based):* If Cost < Benefit, Act. Therefore, Not Acting = Immoral. Calling it "heroic" creates a moral loophole for the rest of us.
      *   *The User's View (Virtue Ethics/Supererogatory):* Some acts are good but not required. Demanding them as duty ignores bodily autonomy, psychological burden, and the nature of gift-giving.
      *   *The Eulogy's Goal:* Navigate this without getting bogged down in philosophy. Acknowledge the depth of her gift without shaming the audience. Focus on *love* and *choice* rather than *obligation* and *math*.

  3.  **Drafting Strategy - Key Themes:**
      *   **Agency/Choice:** The power of her action lies in the fact that she *chose* it, not that she *had* to.
      *   **Connection:** She connected strangers. It wasn't just biology; it was community.
      *   **Humility:** She didn't do it to shame others; she did it to help specific people.
      *   **Legacy:** Her life wasn't defined by the surgery alone, but by the decades of volunteering that followed.
      *   **Grief:** Acknowledge the loss for the family.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the grief, welcome the two groups (family and registry community). Set the tone (warm, respectful).
      *   **The Act (The Kidney):** Address the donation directly. How to frame it? Not as a medical transaction, but as a profound gift. Avoid the "duty" trap by focusing on the *cost* (it's not zero risk, it's not zero emotional weight).
      *   **The Volunteer Work:** This is crucial. It shifts focus from "one heroic act" to "a life of service." This makes it exceptional without judging those who didn't do it.
      *   **Addressing the "Duty" Argument (Subtly):** Instead of arguing philosophy, frame her actions as an *invitation* rather than an *indictment*. She didn't demand others follow; she made it easier for them to choose.
      *   **Closing:** Bring it back to love and memory. A call to action that is accessible to everyone (kindness, generosity in their own way).

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too preachy?
      *   *Fix:* Add personal anecdotes or softer language. Make sure to mention she was an aunt, not just a donor.
      *   *Critique:* Does it address the friend's point without mentioning the friend?
      *   *Fix:* Yes, by emphasizing *autonomy*. A duty is something you owe. A gift is something you give. The value is in the giving.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences punchy. Aim for ~750 words.

  6.  **Writing the Content (incorporating the "Supererogatory" nuance):**
      *   *Key phrase idea:* "She didn't keep a ledger."
      *   *Key phrase idea:* "The freedom to say no makes the yes meaningful." (This directly counters the "duty" argument without being aggressive).
      *   *Key phrase idea:* "She didn't ask us to be her; she asked us to be generous in our own way."

  7.  **Final Review against Constraints:**
      *   Honor exceptionalism? Yes (focus on the rarity and depth).
      *   No shaming non-donors? Yes (focus on different forms of generosity).
      *   Not minimizing sacrifice? Yes (acknowledge the physical and emotional weight).
      *   Appropriate for family and donors? Yes (balances personal loss with public service).

  8.  **Final Polish:** Check rhythm and flow for spoken word. (Self-Correction: Ensure I don't use the word "supererogatory" in the speech—it's too academic. Use plain English.)

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate the friend's point by saying "it was low risk." Even if medically low risk, the *experience* is high impact. I should focus on the *gift* aspect. A gift loses its nature if it becomes a tax.

  9.  **Final Output Generation** (Proceeding to generate the eulogy based on these thoughts).
answer: |-
  Good morning. Thank you all for being here.

  For those who don't know me, I'm [Your Name], [Aunt's Name]'s nephew/niece. Looking out at this room, I see two distinct worlds coming together. I see family, who knew her as the aunt who burned the toast on Sundays and remembered everyone's birthdays. And I see friends from the transplant registry, who knew her as a tireless advocate, a mentor, and a donor.

  Usually, at a funeral, we try to find the common thread that ties the room together. Today, the thread is complex. It's about a specific kind of love.

  Twenty years ago, my aunt gave a kidney to a stranger. She didn't do it because she was sick, or because she was related, or because she was asked. She did it because she knew someone was dying, and she knew she could help.

  In the days since she passed, I've heard people struggle to find the right words for this. Some call it a duty. Some call it heroism. I've thought about this a lot. If I call it a duty, it implies that the rest of us, who kept both our kidneys, failed in some obligation. But if I call it merely "nice," I diminish the profound weight of what she actually did.

  Here is what I believe: The value of my aunt's gift lay precisely in the fact that it was *not* required.

  Morality often asks us not to harm. It asks us to be honest, to be fair, to not take what isn't ours. But my aunt lived by a different standard. She believed that if you have the capacity to save a life without losing your own, you should at least consider it. But she also knew that true generosity requires freedom. A gift forced is a tax. A gift chosen is grace.

  She never looked at the rest of us with judgment. She never kept a ledger. She understood that bodily autonomy is sacred. She knew that asking someone to undergo surgery, even a safe one, is asking a lot. That is why her choice was exceptional. It was exceptional not because the math was easy, but because she was willing to bear the burden when she didn't have to.

  And that surgery was only the beginning. For twenty years, she volunteered for the registry. She didn't do that to shame people into donating. She did it to clear the path for those who wanted to say "yes" but were afraid of the "how." She held hands in waiting rooms. She explained the risks honestly, never minimizing them, but never exaggerating them. She made it possible for others to be as generous as she was.

  To her fellow donors here: She was one of you. She knew the scar, the recovery, the strange bond of knowing a part of you lives in someone else's body. She wore that bond lightly, but she carried it proudly.

  To my family: She was one of us. She was stubborn, and warm, and she loved us fiercely. Her capacity to give to strangers didn't come from a lack of love for us; it came from an overflow of it. She taught us that love isn't a finite resource. You don't give love away until you run out; you give it away until it grows.

  So, how do we honor her?

  We do not honor her by feeling guilty that we are not her. She didn't want clones; she wanted community. She didn't demand that everyone in this room donate a kidney. She demanded that we look at the suffering around us and ask, "What is within my power to fix?"

  For some of you, that might mean registering as a donor. For others, it might mean mentoring a student, or caring for an aging parent, or simply showing up when it would be easier to stay home.

  My aunt proved that ordinary people are capable of extraordinary things. She proved that we are not just custodians of our own bodies, but stewards of each other's lives. But she also proved that the highest form of service is done without expectation of reward, and without judgment of those who serve differently.

  She left this world with one kidney less, but she left it twice as full of life.

  We will miss her. We will miss her laugh, her advice, and her presence. But the best way to grieve her is to recognize that the generosity she sparked didn't die with her. It lives in the recipient of her kidney. It lives in the pairs she matched. And, if we let it, it lives in us.

  Let us not ask, "Why didn't we do more?" Let us ask, "Given what she showed us was possible, what can we do today?"

  Rest well, Aunt [Name]. You've done enough. You've done more than enough. Thank you.
