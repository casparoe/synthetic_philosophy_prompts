      *   *Point of Divergence 3 (Truth vs. Provability):* Kant believes mathematical truths are discovered through construction but are objective (intersubjective validity due to shared cognitive architecture). Brouwer makes truth subjective/mentalistic (though intersubjective among mathematicians).
      *   *The "Infinite" nuance:* Kant accepts the *synthesis speciosa* (figurative synthesis) which generates magnitude. He accepts that a line can be extended indefinitely. But does he accept that "Either there is a prime number larger than X satisfying condition Y, or there isn't" without finding it? Yes, because for Kant, the object corresponds to the concept *if* it can be constructed. But the *proposition* about it falls under logic.

  5.  **Drafting the Argument (Iterative refinement):**

