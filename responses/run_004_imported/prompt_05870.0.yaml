answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being [Father's Name]'s child.

  Forty-one years. That is the length of time my father has reported to the stamping plant. Forty-one years of shifts, of noise, of metal, of the quiet exhaustion that comes at the end of a day when you've earned your keep.

  In preparing for tonight, I found myself thinking about a prediction made almost exactly a century ago. In 1930, the economist John Maynard Keynes wrote an essay guessing that within a hundred years—meaning, roughly, right now—society would have advanced enough to solve what he called "the economic problem." He believed technology and efficiency would eventually free ordinary people from the struggle just to survive.

  But Keynes had a worry. He wondered if, after generations of being bred to work, struggle, and provide, we would know what to do with freedom once it arrived. He worried that without the necessity of labor, we might lose our sense of purpose.

  Looking at my father, I realize that prediction lands differently on a specific life than it does on a spreadsheet.

  Dad, you spent your life solving the economic problem for our family. You took on the struggle so that we wouldn't have to. You treated work not just as a necessity, but as a duty. But if Keynes was worried that people like you wouldn't know how to handle leisure, I think he underestimated you.

  He assumed that the capacity for enjoyment was a skill we'd have to learn from scratch. But watching you over the years, I've seen that you've been practicing for this moment all along. You taught us that leisure isn't about doing nothing; it's about choosing what matters. It's in the way you tend your garden, the way you fix things that aren't broken just to make them run smoother, and the way you make time for this family even when you're tired.

  The economist thought the challenge of the future would be finding enough to do. But looking around this room, at the friends, the family, and the life you've built, I don't think you'll have that trouble. You solved the economic problem. Now, you get to master the art of living.

  So, if everyone could please raise a glass.

  To Dad: Thank you for the work, thank you for the rest, and thank you for showing us how to do both with dignity. Happy retirement.
