answer: |-
  Your intuition is correct: Owen's proposal is mathematically defensible only if you treat the two contracts as completely independent silos. However, the company has explicitly structured them as a **contingent bundle**. Your signature on the catalog deal is the "key" that unlocks Owen's instructor contract.

  In negotiation theory, this gives you **leverage value** that Owen's proposal ignores. By accepting his split, you are essentially gifting him the value of that leverage.

  Here is a breakdown of why his proposal is flawed, a principled framework for a counter-offer, and how to approach the conversation.

  ### 1. The Flaw in Owen's Logic
  Owen is arguing from a **Property & Labor** framework:
  *   **Catalog:** Joint Property $\rightarrow$ Split 50/50.
  *   **Instructor Role:** Personal Labor $\rightarrow$ 100% to Worker.

  This would be "standard" (as your lawyer friend noted) if the deals were separate. But they are not. The Instructor Role is **derivative value**. It exists *only* because the Catalog Deal happens.

  The correct framework is a **Joint Venture & Surplus** framework:
  *   **The Bundle:** The total opportunity is $420,000.
  *   **The BATNA (Best Alternative):** If we disagree, the total value is $40,000.
  *   **The Surplus:** By agreeing, we create **$380,000** in *new* value that didn't exist before.

  Under Owen's proposal:
  *   **Your Gain:** $60k (Deal) - $20k (BATNA) = **$40,000**
  *   **Owen's Gain:** $360k (Deal) - $20k (BATNA) = **$340,000**

  Owen is capturing **89% of the new value created**, despite you holding 50% of the asset that makes the deal possible and possessing veto power over the entire bundle. He is monetizing your cooperation at a discount.

  ### 2. A Principled Counter-Proposal
  You are right that you aren't owed half his salary; he has to do the work for two years. However, you *are* owed a share of the **opportunity value** that your asset unlocks.

  A fair split should acknowledge two things:
  1.  **Labor:** Owen deserves the vast majority of the $300k instructor fee.
  2.  **Leverage:** You deserve a premium on the catalog sale (or a fee) for waiving your right to block the deal that enables his salary.

  **The "Surplus Share" Model**
  A common principled approach in partnerships when one party enables a massive upside for the other is to split the *incremental gain* (the surplus), not just the gross revenue.

  *   **Total Surplus:** $380,000.
  *   **Reasonable Split:** Since Owen is providing the labor for the bulk of the surplus, he should get the majority. A **75/25 split of the surplus** in Owen's favor is generous to him but fair to you.
      *   **Owen's Share of Surplus:** $285,000
      *   **Your Share of Surplus:** $95,000
  *   **Add Base BATNA Value:** $20,000 each (the value of the catalog if the deal fails).
  *   **Total Payout:**
      *   **You:** $115,000
      *   **Owen:** $305,000

  **Why this is defensible:**
  *   Owen still walks away with $305k, which is $245k *more* than your counter-offer gives him compared to his BATNA. He is still winning massively.
  *   You walk away with $115k, which recognizes that your signature was worth $300k to him.
  *   It acknowledges the **Joint Brand**: The company wants Owen *because* of the course you built together. The instructor role is monetizing the brand equity you co-created, not just his individual coding skills.

  ### 3. How to Structure the Deal
  You don't necessarily need to ask for a cut of his salary, which might feel personal. You can structure this through the **Catalog Acquisition**.

  *   **Option A (The Clean Split):**
      *   Catalog ($120k): Split 75/25 in your favor ($90k You / $30k Owen).
      *   Instructor ($300k): 100% to Owen.
      *   *Total:* You $90k, Owen $330k.
      *   *Pros:* Cleanly separates "Asset" from "Labor."
      *   *Cons:* Might feel aggressive to change the historic 50/50 catalog split.

  *   **Option B (The Cooperation Fee - Recommended):**
      *   Catalog ($120k): Split 50/50 ($60k each).
      *   Instructor ($300k): Owen keeps the bulk, pays you a one-time "licensing/enabling fee" of **$50,000**.
      *   *Total:* You $110k, Owen $310k.
      *   *Rationale:* "I am licensing my 50% exclusivity rights at a premium because that exclusivity is the prerequisite for your employment contract."

  ### 4. Negotiation Script & Strategy
  Do not frame this as "I want more money." Frame it as "We need to align incentives so the deal actually closes."

  **Step 1: Validate the Partnership**
  > "Owen, I'm thrilled about this offer. We built this together, and it's amazing they want you for the instructor role. I want to make sure we both feel good about this so we can sign quickly."

  **Step 2: Introduce the Contingency**
  > "I've been looking at the numbers, and while the 50/50 split on the catalog makes sense historically, the structure of this deal is different. The $300k contract is contingent on *my* signature on the exclusivity. If I don't sign, that $300k doesn't exist. That gives my signature a specific value separate from the catalog IP."

  **Step 3: Present the Surplus Argument**
  > "If we walk away, we each get $20k. If we sign your proposal, I gain $40k in value, and you gain $340k. That's a 90/10 split of the *new value* this deal creates. I don't expect half your salary—you're doing the work. But I do think a split that reflects the leverage we both bring to the table is fairer. I'm targeting a total of around $110k for myself. That leaves you with $310k, which is still a massive win compared to the alternative."

  **Step 4: The "Brand Equity" Angle**
  > "Also, be honest: they want you for the instructor role because of the authority we built *together* with this course. That brand equity is a joint asset. I'm comfortable letting you take the labor pay, but I need to be compensated for the joint brand access that makes that labor pay possible."

  ### 5. Risks to Consider
  *   **Relationship Risk:** Owen may feel you are holding the deal hostage. Be prepared for tension. Emphasize that you *want* to sign, but the numbers need to reflect reality.
  *   **Deal Risk:** If you push too hard, Owen might call your bluff. However, his risk is much higher ($300k loss vs. your $80k loss). He is more motivated to close than you are.
  *   **Legal Friend's Advice:** Your friend is technically right about *standard* IP splits, but she is missing the *commercial reality* of the bundle. In M&A, "key man" clauses and contingent offers always shift leverage. You are negotiating a commercial package, not just an IP transfer.

  ### Summary Recommendation
  Owen's proposal is **not defensible** because it ignores the contingency that gives your signature value.
  *   **Target:** Aim for **$100,000 – $120,000 total for yourself.**
  *   **Method:** Keep the catalog 50/50 ($60k) and request a **$40k–$60k "enabling fee"** from Owen's contract, OR adjust the catalog split to 70/30 ($84k/$36k) plus a smaller fee.
  *   **Mindset:** You are not asking for his salary. You are asking for a fair share of the *value created by your agreement*.

  This approach is principled, mathematically sound, and leaves Owen with the vast majority of the money while ensuring you aren't subsidized his windfall at your own expense.
