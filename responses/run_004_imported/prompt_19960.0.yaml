      *   **Instructor Value ($300k):** This is personal services compensation. It's tied to Owen's specific brand/expertise. However, it is *contingent* on the catalog deal.
      *   **Leverage:**
          *   Owen has leverage: He is the only one who can perform the instructor contract.
          *   I have leverage: I own 50% of the catalog. Without my signature, the exclusivity deal dies. If exclusivity dies, the instructor contract dies.
          *   *Crucial Point:* My signature is the key to Owen's $300k.

  3.  **Evaluate Owen's Proposal:**

      *   *Logic:* "Catalog is joint property (50/50). Instructor job is personal labor (100% mine)."
      *   *Flaw:* It ignores the contingency. The instructor job *does not exist* without the catalog deal. By treating them as separate silos, Owen captures the "synergy value" entirely for himself.
      *   *Comparison to BATNA:*
          *   Owen: $360k (Proposal) vs $20k (BATNA). Gain: $340k.
          *   Me: $60k (Proposal) vs $20k (BATNA). Gain: $40k.
      *   *Surplus Split:* The total surplus created by doing the deal vs. walking away is $380k ($420k total deal - $40k BATNA). Owen captures $340k of that surplus. I capture $40k. That's a 90/10 split of the *new value created*, despite us having equal ownership of the asset that enables the deal.

  4.  **Develop a Principled Framework:**

      *   **Principle 1: Asset Ownership.** The catalog is 50/50. The base value of the catalog ($120k) should arguably be split 50/50. Owen agrees to this.
      *   **Principle 2: Contingency/Leverage.** The $300k is contingent on the $120k deal. The $120k deal requires my consent. Therefore, I hold a "blocking right" over the $300k.
      *   **Principle 3: Value Creation (The Surplus).** The deal creates $380k of *additional* value over the status quo (BATNA). How should that surplus be shared?
      *   **Principle 4: Labor vs. Capital.** The $300k is payment for future labor. I am not doing that labor. I should not get a share of the *labor* value, but I should be compensated for the *opportunity cost* or the *licensing of the leverage*.

  5.  **Calculate Alternative Splits:**

      *   *Scenario A (Owen's):* Me $60k, Owen $360k.
      *   *Scenario B (Strict Asset + Finder's Fee):*
          *   Catalog: $120k / 2 = $60k each.
          *   Instructor: $300k to Owen.
          *   *But:* I need to be compensated for enabling the instructor deal. Let's look at the "Exclusivity Premium."
          *   Exclusivity Premium = $120k (Exclusive) - $40k (Non-Exclusive) = $80k.
          *   This premium is generated by *both* of us agreeing to restrict our rights.
          *   Maybe the $300k is partially a premium for Owen's brand, but also a premium for the company getting the "whole package."
      *   *Scenario C (Surplus Sharing):*
          *   Total Deal Value: $420k.
          *   BATNA Value: $40k.
          *   Surplus: $380k.
          *   If we split surplus 50/50 (since we are equal partners in the venture): $190k each + BATNA base ($20k).
          *   Total: Me $210k, Owen $210k.
          *   *Critique:* This feels too aggressive. Owen is doing 2 years of work. $210k for me for doing nothing new is hard to justify ethically, even if leveraged.
      *   *Scenario D (The "Key Man" Discount):*
          *   Acknowledge Owen earns the $300k labor.
          *   Acknowledge I hold the keys to the vault.
          *   A "consulting fee" or "release fee" for me to agree to exclusivity which enables his role.
          *   If the deal falls through, Owen loses $300k. I lose $80k (the difference between exclusive and non-exclusive catalog).
          *   My risk is lower than his.
          *   However, without me, he gets $0 of the $300k.
          *   A reasonable "unlock fee" might be a percentage of the instructor contract, or a re-balancing of the catalog sale.

  6.  **Refining the "Principled" Argument:**

      *   The $120k is for *IP*. Split 50/50. ($60k each).
      *   The $300k is for *Labor + IP Access*.
      *   The company wants the bundle.
      *   If I say no, Owen gets $20k (catalog) + $0 (job).
      *   If I say yes, Owen gets $60k (catalog) + $300k (job).
      *   My "Yes" is worth $300k to Owen.
      *   In business negotiations, when one party holds a veto right that unlocks significant value for the other, a "cooperation fee" is standard.
      *   *Analogy:* Royalties. If I license my IP to you so you can make a product, I get a royalty. Here, my 50% stake in the catalog is the IP enabling his contract.
      *   *Proposed Split:*
          *   Catalog ($120k): 50/50 ($60k each).
          *   Instructor ($300k): Mostly Owen, but a "licensing fee" to the partnership for using the catalog exclusivity as a lever.
          *   Or, simpler: Treat the whole $420k as the "Partnership Opportunity."
          *   Deduct fair market value for Owen's labor. What is Owen's time worth? $150k/year? $300k for 2 years seems like market rate for a senior instructor. So the labor cost is fully consumed by the $300k.
          *   So where is the profit? The profit is in the *catalog* sale.
          *   Wait, the company is paying $300k for *new* content. That's salary.
          *   The company is paying $120k for *old* content. That's asset purchase.
          *   The friction is that the Salary is contingent on the Asset Purchase.
          *   If I block the Asset Purchase, I block the Salary.
          *   Therefore, I have leverage over the Salary.
          *   *Fairness Test:* Is it fair for me to capture value from Owen's labor? Generally, no. But is it fair for Owen to capture value from my Asset Leverage? Generally, no.
          *   The leverage is the key. I am not claiming a share of his labor. I am claiming a share of the *deal value* that exists only because of my asset.
          *   *Middle Ground:* Increase the Catalog Split.
          *   Instead of 50/50 on $120k, maybe 70/30 or 60/40 in my favor? No, that penalizes Owen on the asset we own equally.
          *   Better: Keep catalog 50/50. Ask for a one-time "consulting/introduction fee" from Owen personally, or restructure the catalog split to reflect the "exclusivity premium."
          *   Actually, the cleanest way is to view the $300k as partially dependent on the brand equity we built *together*. The course made Owen famous enough to get the job.
          *   *Argument:* The instructor role exists because of the course we built together.
          *   *Counter-argument:* Owen is the face/talent.
          *   *Compromise:* The "Joint Venture" approach. The deal is $420k. $300k is labor, $120k is asset.
          *   If we walk, we get $40k.
          *   Gain from deal: $380k.
          *   Owen contributes: Labor (valued at $300k) + 50% Asset Leverage.
          *   I contribute: 50% Asset Leverage.
          *   If we value the "Asset Leverage" as the catalyst for the whole deal...
          *   Let's look at it as: Owen gets the labor pay ($300k). The remaining $120k (catalog) is split. But wait, if I don't agree, Owen loses the $300k.
          *   So, Owen should pay a "premium" to secure my agreement.
          *   How much? A portion of the surplus.
          *   Surplus = $380k.
          *   If we split surplus 50/50: $190k each.
          *   Owen: $190k + $20k (BATNA) = $210k. (This implies he pays me $150k from his salary).
          *   That feels too high for me. I'm not working.
          *   If we split surplus 25/75 (Me/Owen):
          *   My Share: $95k + $20k = $115k.
          *   Owen's Share: $285k + $20k = $305k.
          *   This looks much more reasonable. I get nearly double Owen's proposal ($60k -> $115k). Owen still gets the vast majority of the value ($305k vs $360k).
          *   How to structure this?
          *   Catalog Split: $120k.
          *   Instructor: $300k.
          *   If I take $115k total, and Catalog is $60k... I need $55k more.
          *   This $55k comes from Owen's $300k.
          *   So Owen keeps $245k of the instructor contract. I get $55k "finder/enabling fee."
          *   Or, adjust the Catalog split. $120k catalog. If I get $115k total, and $55k from instructor... that's messy.
          *   Cleaner: Catalog split 50/50 ($60k each). Owen pays me a one-time fee of $X from his contract for "agreeing to exclusivity which enables his role."
          *   What is X? $50k-$60k seems defensible. It acknowledges the leverage without claiming half his salary.

  7.  **Addressing the Legal Friend:**
      *   "Standard" likely refers to "IP is split by ownership, Salary is split by worker."
      *   It ignores the *contingency*. In M&A or Joint Ventures, "holdout" value is real.
      *   The friend is looking at it as two separate contracts. They are legally one bundle.

  8.  **Drafting the Advice:**
      *   **Validate:** Your gut is right. Owen's proposal ignores the contingency leverage.
      *   **Analyze BATNA:** Show the numbers. $20k vs $60k (Owen's proposal) vs Potential.
      *   **The "Surplus" Argument:** The deal creates $380k new value. Owen captures 90% of the *new* value.
      *   **The "Brand" Argument:** The instructor role exists because of the *joint* course success.
      *   **Proposed Solution:**
          1.  Accept 50/50 on Catalog ($60k each).
          2.  Request a "Cooperation Fee" or adjust the split to recognize the leverage.
          3.  Target Range: $100k - $120k total for you. (Leaves Owen $300k-$320k).
          4.  Rationale: You are discounting your leverage (which could block the whole deal) to allow him to earn the salary.
      *   **Negotiation Tone:** Collaborative, not adversarial. "We built this together. This opportunity exists because of us. Let's split the *upside* fairly, even if the labor is yours."

  9.  **Refining the Numbers for the User:**
      *   Current Proposal: Me $60k, Owen $360k.
      *   BATNA: Me $20k, Owen $20k.
      *   Value Add of Deal: Me +$40k, Owen +$340k.
      *   This is the strongest argument. The deal benefits Owen 8.5x more than me in terms of *incremental* gain.
      *   A fairer incremental split might be 1:3 or 1:4.
      *   If 1:3 split of the $380k surplus:
          *   Surplus: $380k.
          *   Me: $95k. Owen: $285k.
          *   Add BATNA ($20k each).
          *   Me: $115k. Owen: $305k.
      *   This requires Owen to give up $55k of his $300k salary.
      *   Is that fair? Yes, because without me, he has $0 salary. He is still gaining $285k over his BATNA.
      *   How to phrase it? "I'm not asking for half your salary. I'm asking for a share of the *opportunity* that my signature unlocks."

  10. **Final Check:**
      *   Does this damage the relationship? Potentially, if handled poorly. Needs to be framed as "Partnership Equity" not "Hostage Taking."
      *   Is it legally sound? Yes, as long as both agree. No fiduciary duty mentioned, but partners usually have a duty of good faith.
      *   Is the legal friend right? Technically on separate contracts, wrong on the bundled reality.

  11. **Structure of Response:**
      *   **Validation:** Your intuition is correct.
      *   **The Flaw in Owen's Logic:** Separating the bundle.
      *   **The Leverage Analysis:** BATNA comparison.
      *   **The "Surplus" Framework:** How to calculate fair value.
      *   **Negotiation Strategy:** Specific numbers and scripts.
      *   **Risk Assessment:** Relationship dynamics.

  12. **Self-Correction/Nuance:**
      *   Make sure not to sound like I'm extortionate. Emphasize the *joint brand* aspect. The company wants Owen *because* of the course *we* made.
      *   The $300k isn't just labor; it's brand rental. We built the brand.
      *   Also, consider tax implications? (Probably out of scope, but worth a tiny mention).
      *   Focus on the "Incremental Gain." That's the most objective metric.

  13. **Final Polish:** Ensure tone is professional, analytical, and supportive. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should be careful not to advise them to breach any existing partnership agreement. Assuming none exists beyond the 50/50 revenue split habit. The prompt says "co-own the material outright."
