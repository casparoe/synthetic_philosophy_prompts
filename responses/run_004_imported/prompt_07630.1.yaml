answer: |-
  Welcome to the world of philosophy, Doctor. It is a genuine pleasure to encounter someone reading the *Monadology* with the eyes of a marine biologist. You have hit upon what is arguably the single most difficult and debated problem in Leibniz's late metaphysics, and you have done it in the first three paragraphs.

  Your intuition is spot on: there is a tension here, and it is not merely in your reading of it. It is in the text itself. To answer your question directly: **Strictly speaking, Leibniz is committed to the view that *only* monads are real substances.** However, he creates a hierarchical distinction between "heaps" (like rocks) and "organic bodies" (like animals) to save the phenomena of life.

  Here is the breakdown of how Leibniz tries to square this circle, and why your experience with siphonophores makes you uniquely qualified to understand the friction points.

  ### 1. The Strict Ontology: Only Monads Are Real
  You are correct about Section 2. For Leibniz, true unity must come from being simple (partless). If something has parts, its unity is borrowed from the things that hold those parts together. If you keep dividing, you must eventually hit a bottom floor of reality that *cannot* be divided. These are the monads.

  Therefore, in the strictest metaphysical sense:
  *   **A Rock:** Is a mere aggregate (*unum per accidens*). It is a "heap." Its unity exists only in the mind of the perceiver (you or me) grouping those monads together. It is a *phenomenon bene fundatum* (a well-founded phenomenon). It appears real, and there is a reality grounding it (the monads), but the "rock" itself is not a substance.
  *   **A Table:** Same as the rock. It is an artifact, a collection of substances arranged by human convention.
  *   **An Organism:** This is where it gets tricky. Even an organism is a composite of infinite monads. So, strictly speaking, the *body* of the organism is also a phenomenon, not a substance.

  So, to answer your second alternative: **Yes, strictly speaking, nothing is real except the monads themselves, full stop.**

  ### 2. The Principled Line: The Dominant Monad
  However, Leibniz refuses to let organisms be *just* heaps like rocks. He needs a principled line between a pile of dust and a living cat. He finds this in the **Dominant Monad** (often equated with the soul or substantial form).

  *   **In a Rock:** The monads are related to each other only externally. They are a crowd without a leader.
  *   **In an Organism:** One monad is "dominant." It perceives the subordinate monads (the monads making up its body) with greater distinctness than anything else. It provides a center of perspective.

  Leibniz argues that this dominant monad confers a *substantial unity* to the whole composite. The organism is not just a heap; it is a **Corporeal Substance**. The dominant monad makes the collection of parts function as a single *unum per se* (unity in itself).

  So, while the *matter* of the animal is still an aggregate of monads, the *entity* is unified by the dominant monad. This is the "principled line" you asked about. Rocks lack a dominant monad; animals possess one.

  ### 3. The Siphonophore Problem (Where Your Expertise Shines)
  This is where your background with the Portuguese man o' war (*Physalia physalis*) is fascinating. You know that what looks like one animal is a colony of specialized zooids (gonozooids, gastrozooids, dactylozooids).

  Leibniz would have been obsessed with this. In fact, Leibniz believed in the **infinite division of matter**. He thought that inside every drop of water, there are infinite living organisms. For Leibniz, there is no dead matter. A rock is actually a colony of infinitely many tiny living organisms, each with its own dominant monad.

  So, how would Leibniz classify a siphonophore? He has two options, and scholars argue he wavers between them:

  1.  **The Colony View:** Each zooid is a distinct corporeal substance with its own dominant monad. The "Man o' War" is therefore a society of substances, metaphysically similar to a flock of sheep or a pile of rocks, just more tightly integrated. In this view, the "colony" is a phenomenon; the zooids are the substances.
  2.  **The Super-Organism View:** There is a single dominant monad for the entire colony that governs the zooids. The zooids are merely the "organs" of the larger substance.

  Leibniz generally leans toward the idea that **every living thing is an organism.** He would likely argue that if the zooids function as a single functional unit, there is a dominant monad for the whole. However, he admits that nature is continuous. There may be cases where the unity is looser (a colony) and cases where it is tighter (a mammal), but metaphysically, he wants to say that wherever there is function, there is a dominant monad.

  ### 4. Why the Confusion? (The "Two-World" Interpretation)
  You asked if scholars have settled on a principled line. The honest answer is: **No, not entirely.** This is known as the "Problem of Composites" in Leibniz scholarship.

  *   **The Idealist Reading:** Only monads exist. Organisms are just useful ways of talking about clusters of monads dominated by one. (This aligns with your "full stop" suspicion).
  *   **The Realist Reading:** Corporeal substances (organisms) are real in a way that rocks are not. The dominant monad literally makes the body into a single substance.

  Most modern scholars (like Robert Adams or Donald Rutherford) suggest a nuanced middle ground:
  Leibniz distinguishes between **Substantial Reality** (Monads) and **Phenomenal Reality** (Bodies).
  *   A rock has *phenomenal* reality only.
  *   An organism has *phenomenal* reality (its body) grounded by a *substantial* reality (its soul/dominant monad).

  So, is the organism a "genuinely unified thing"? **Yes, but only because of the monad, not because of the matter.** The matter is always a heap. The unity is metaphysical, not physical.

  ### 5. Summary for Your Reading Group
  When you go back to your group, here is the synthesis you can offer:

  1.  **Sections 1–3 are the foundation:** Only simples are true substances. Composites are derivatives.
  2.  **The "Nothing But" claim:** Leibniz means that composites have no *independent* ontological status. They depend entirely on simples.
  3.  **The Distinction:** He saves biology from being an illusion by introducing the **Dominant Monad**.
      *   **Rocks/Tables:** Aggregates. Unity is in the mind of the observer.
      *   **Organisms:** Unified by a dominant monad. Unity is in the nature of the thing itself (even if the "body" is still a heap of monads).
  4.  **The Biological Parallel:** Just as you studied the gradient from colonial independence to organismic integration, Leibniz posits a universe where *everything* is alive to some degree. The difference between a rock and a rabbit is that the rabbit has a "presiding officer" (dominant monad) that makes the colony act as one.

  **A final thought for a biologist:** Leibniz's universe is arguably more biological than physical. He rejects the "dead matter" of the atomists (like Democritus or Newton). For him, the "real atoms" (monads) are not little hard balls; they are little *minds* (centers of force/perception).

  You spent 35 years studying how distinct individuals coordinate to form a functional whole. Leibniz is asking the same question, but he's asking it about the fabric of reality itself. You are perfectly equipped to handle this. The *Monadology* is, in many ways, a metaphysical treatise on the nature of the colony.

  Enjoy the rest of the text. It gets stranger (in a good way) from here.
