answer: |-
  **The Sham and the Standard: Pascal's Theological Realism**

  It is tempting to read Pascal's fragments on justice as a precursor to modern legal positivism. When he writes that "justice without force is powerless" and concludes that "we could not make what is just strong, so we made what is strong just," he appears to offer a bleak genealogy of law identical to Hobbes's: authority is merely power legitimized by habit. On this reading, the "mystical foundation of authority" is a confession that no foundation exists at all; custom constitutes equity simply because we lack the courage to trace its violent origins. If one stops here, Pascal is indeed a depressive Hobbesian, asserting that justice is nothing more than force wearing a costume.

  However, this interpretation collapses when one considers the architectural purpose of the *Pensées*. Pascal is not writing a treatise on political science; he is constructing an apology for the Christian religion. To read him as a metaphysical nihilist regarding justice is to mistake his diagnosis of the patient for a description of health. The strongest reading of these fragments is not that justice *is* force, but that human reason, severed from God by the Fall, is incapable of *locating* justice without divine aid. Pascal is not making a metaphysical claim about the non-existence of true justice; he is making an anthropological claim about the corruption of human cognition.

  The positivist reading relies on a surface-level skepticism that mirrors Montaigne, but it ignores Pascal's specific theological mechanism: concupiscence. For Pascal, the human will is diseased. We love ourselves more than the truth. Therefore, when we claim to seek justice, we are actually seeking our own dominance. This is why "what is strong" becomes "what is just." It is not that justice is an illusion, but that our access to it is blocked by self-love. If Pascal believed justice were merely conventional, there would be no need for Grace. The despair induced by these fragments is intentional; it is meant to strip the reader of the pride that suggests human reason can construct a perfect city. By demonstrating that political justice is inevitably contaminated by force, Pascal clears the ground for a justice that is not political, but charitable.

  Furthermore, the "mystical foundation" argument is not an endorsement of custom, but a warning against idolatry. When Pascal notes that tracing authority to its source destroys it, he is highlighting the fragility of human institutions, not sanctifying them. He distinguishes between the "orders" of existence: the order of bodies (force), the order of minds (reason), and the order of charity (divine justice). Political life operates in the order of bodies and minds, where force is inevitable. To expect pure justice in this realm is to confuse the orders. True justice belongs to the order of charity, which is "of a higher kind."

  Therefore, Pascal does leave room for justice as something more than force, but he radically displaces it. He denies that *political* justice can ever be pure, because human institutions are managed by fallen creatures who inevitably conflate their own power with righteousness. But this limitation is contingent on the human condition, not on the nature of justice itself. For Pascal, real justice exists in God, and it is accessible only through the humility of faith, not the arrogance of legislation.

  To read Pascal as a conventionalist is to fall into the very trap he describes: assuming that the visible machinery of power is all there is. He argues the opposite. The fact that we recognize the discrepancy between force and justice—that we feel the tyranny of force without justice—proves that we possess an innate idea of a justice we cannot enact. We are kings in ruins. We know the standard even if we cannot meet it. Thus, justice is not force in costume; rather, political justice is a necessary, provisional sham required to keep the peace among fallen beings, while true justice remains a divine reality waiting to be restored. Pascal's bleakness is not the end of the story; it is the necessary precondition for redemption.
