          *   *The Fix:* The SG isn't just "I care about paperclips." It's "I care about preventing *this specific threat structure*."
          *   *Better Fix:* The "Surrogate Goal" is often coupled with **Stochasticity** or **Uncertainty**. The threatener isn't sure if the SG is real or if the agent is "type A" (SG adopter) or "type B" (normal).
          *   *Actually, the strongest defense:* The SG changes the *marginal cost* of compliance. If I pre-commit to *only* caring about the SG under threat, threatening the terminal goal has *zero* leverage. Threatening the SG has *some* leverage. If the threatener wants *any* concession, they must target the SG.
