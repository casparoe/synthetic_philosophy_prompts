      *   *Concept:* Surrogate Goals are primarily associated with Paul Christiano and discussions within the Effective Altruism/AI Safety community (e.g., LessWrong, MIRI adjacent).
      *   *Decision Theory:* This relies heavily on Updateless Decision Theory (UDT) or Functional Decision Theory (FDT). Causal Decision Theory (CDT) agents generally can't make credible pre-commitments against acausal threats in the same way.
      *   *The Unraveling Objection:* This is the standard counter-argument. If the threatener knows $V_{surrogate} < V_{terminal}$, why threaten the surrogate?
      *   *The "Threat-Proofing" Alternative:* Why not just have a utility function that ignores threats? (The problem is distinguishing threats from normal trade/interaction).
      *   *Structure of Response:*
          1.  Clarify the Setup (Acausal Trade/Threats, Decision Theory).
          2.  Address the Unraveling Objection (The core mechanism).
          3.  Compare SG vs. Threat-Proofing.
