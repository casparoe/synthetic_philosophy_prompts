          *   *Correction/Refinement:* The SG argument usually posits that the agent modifies its utility function *temporarily* or conditionally. "If threatened, I care *only* about the surrogate."
          *   *Crucial Distinction:* It's not just "I care about X." It's "If you threaten me, my decision algorithm switches to optimizing for X, ignoring Y."
          *   *The Unraveling Counter:* If the threatener knows I switch to X, and X is low value, they demand more. But if I *cannot* give more (because I literally don't care about Y anymore in this branch), they get nothing by threatening Y.
          *   *Analogy:* The "Madman" or "Burning Bridges."

      *   **Addressing the Unraveling/Regress Objection:**
          *   *Objection:* Threatener knows SG is decoy.
          *   *Response:* It requires **Information Asymmetry** or **Binding Pre-commitment**.
