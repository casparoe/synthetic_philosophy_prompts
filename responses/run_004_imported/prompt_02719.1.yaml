  *(Self-Correction on the "Unfalsifiability" point)*: I need to be careful. The objection is that "attention" is a get-out-of-jail-free card. The counter-argument is that attention has limits and measurable mechanisms. If the effect persists when attention is controlled, *then* you have a case. But most studies don't control for it well. I will emphasize Firestone & Scholl's criteria for ruling out attention.

