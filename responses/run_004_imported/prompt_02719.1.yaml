      *   *The Charge:* If every counterexample is explained away as "attention" or "judgment," the theory is immune to evidence.
      *   *The Defense:* It's not ad hoc; it's based on distinct neural pathways and timing.
          *   *Timing:* Perceptual processing happens (e.g., V1-V4) before cognitive integration (PFC).
          *   *Dissociation:* Visual illusions persist *despite* belief (e.g., Müller-Lyer). If belief could penetrate, knowing the lines are equal should make them look equal. They don't. This proves encapsulation.
          *   *Predictive Power:* The modularity view predicts *where* breakdowns happen (e.g., in delusions, the link between perception and belief is broken, not the perception itself).

