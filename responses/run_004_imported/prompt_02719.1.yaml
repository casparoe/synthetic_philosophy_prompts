      *   **Key Proponent:** Jerry Fodor (*The Modularity of Mind*).
      *   **Mechanism:** What looks like penetration is actually:
          1.  *Attention:* Selecting different data from the same input.
          2.  *Judgment/Interpretation:* Changing the *belief* about the input, not the input itself.
          3.  *Response Bias:* Changing how one reports the experience, not the experience itself.
      *   **Why it matters:** If perception were penetrable, we couldn't trust it as an independent check on our beliefs. Science and rationality would collapse (the "theory-ladenness of observation" problem).

  3.  **Select Classic Examples to Dismantle:**
      *   *Example 1: The Steep Hill (Proffitt et al.).* People wearing heavy backpacks or who are tired estimate hills as steeper.
          *   *Skeptic's Take:* It's not that the visual angle changes; it's that the *action affordance* judgment changes. The visual cortex sees 30 degrees; the motor planning system says "that's hard to climb."
      *   *Example 2: The Racial Bias/Gun Identification (Payne et al.).* People identify tools as guns faster if primed with Black faces.
          *   *Skeptic's Take:* This is response criterion shift (signal detection theory). The threshold for saying "gun" is lowered, not the visual processing of the object itself.
      *   *Example 3: The Hollow Mask / Knowledge-based illusions.* Knowing a mask is hollow doesn't stop it looking convex.
          *   *Skeptic's Take:* This is the *best* evidence for encapsulation. Even strong belief doesn't change the look. (I should use this as a positive argument for encapsulation, maybe swap out one of the others or use it to bolster the "unfalsifiability" defense). Let's stick to the user's prompt: dismantle examples used *against* encapsulation. Let's use the "Fear/Spider" example instead.
      *   *Revised Example 2: Fear/Spiders.* Arachnophobes say spiders look bigger or closer.
