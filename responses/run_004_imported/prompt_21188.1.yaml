      *   **Smith's Critique of Colonialism:**
          *   It distorts capital allocation (money goes to distant risky trade instead of domestic industry).
          *   It benefits a few merchants (monopolists) at the expense of the public (higher prices, taxes for defense).
          *   It leads to war and expense.
      *   **Smith's View on the East India Company:** He was critical of their governance and monopoly power.
