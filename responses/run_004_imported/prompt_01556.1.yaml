answer: |-
  The rain on the unfinished glass facade of the Meridian Tower didn't sound like rain; it sounded like static. Julian stood on the forty-second floor, the wind whipping his coat around his legs. Below him, the city was a grid of blurred lights, indifferent and solid. In his hand, he held the inspection report. There was a discrepancy in the load-bearing column on level thirty. Not enough to guarantee collapse, but enough to violate the code if anyone looked closely.

  His phone buzzed. It was Henderson, the developer.

  "Tell me it's cleared," Henderson said. No greeting.

  Julian looked at the steel beam behind him, cold and riveted. He felt the weight of his title, the years of schooling, the license number printed on his business cards. He let that weight settle onto his shoulders like a lead coat.

  "The materials are within spec," Julian said, his voice flat. "But the alignment is off by two centimeters. I can't sign off on it. The code dictates a tolerance of one."

  "Julian, come on. You know how this works. The schedule is the schedule. You're the architect. You make it work."

  "I'm not the one who poured the concrete, Henderson. I'm just the signatory. The regulations bind me here. I don't have the discretion to override the safety margin. I'm just... I'm just the role. The system doesn't allow me to move."

  He heard himself speaking and felt a wave of relief. *I am an architect.* The statement felt like a shield. It turned him into an object, a functionary within a larger machine. If he was just the architect, then he wasn't choosing to delay the project; he was merely obeying the laws of physics and bureaucracy. He had no freedom here. He was a thing determined by the building code. He was facticity, pure and solid as the steel behind him.

  "Fine," Henderson snapped. "Fix it. But you're eating the cost."

  The call ended. Julian lowered the phone. The silence rushed back in, louder than the wind. He walked to the edge of the floor, looking down at the drop. The relief from the call began to curdle. If he was just a functionary, just a cog bound by rules, then the delay was inevitable. But he knew he could sign it. He knew engineers who would fudge the math. He knew he could choose to be the kind of architect who prioritized speed over safety. He had chosen not to, but he had *chosen*.

  He gripped the railing. The cold metal bit into his palm. Suddenly, the solidity of the "architect" identity slipped.

  *Why do I care?* The thought arrived unbidden. *What is a building, really? It's just lines on paper turned into matter. I'm not this job. I'm not this rain. I'm not even this body standing on the edge.*

  He closed his eyes. He could feel the pull of the other escape. If facticity was a trap, then transcendence was the flight. He wasn't defined by the contract, or the debt, or the people waiting for apartments in this tower. Those were just facts in the world, objects outside of him. He was pure consciousness, pure freedom. He could walk away. He could quit tomorrow. He could decide that this discrepancy didn't matter because *he* decided what mattered. The code was just a social construct. The risk was just a probability. None of it touched the core of who he was, which was nothing.

  "I'm not responsible," he whispered to the wind. "I'm free."

  It was intoxicating. To be pure transcendence was to be weightless. If he wasn't his past choices, if he wasn't his current situation, then the anxiety of the beam was an illusion. He was a ghost haunting a construction site.

  He opened his eyes and looked down at the report in his hand. The paper was wet now, the ink smudging.

  And then, the ground gave way.

  It wasn't the floor. It was something internal. He realized, with a sudden, nauseating lurch, that he was holding both lies in his hands at the same time.

  When he spoke to Henderson, he had claimed to be a thing, bound by necessity, to avoid the guilt of the delay. But now, standing alone, he was claiming to be nothing, bound by nothing, to avoid the responsibility of the choice he had just made.

  He was too free to be a cog, and too real to be a ghost.

  The vertigo hit him physically. He stumbled back from the railing, his heel catching on a coil of cable. He grabbed a steel pillar to steady himself. The coldness of the steel wasn't a concept; it was a sensation. His heart was hammering against his ribs, a fact he couldn't think away. He was here. He was now. He was the one who had to sign the paper, or not.

  There was no stable ground. If he leaned into his freedom, the consequences crashed back in as facts—the potential deaths, the lawsuits, the ruin. If he leaned into the facts, his freedom screamed at him—that he could burn it all down, that he was the one giving the facts their meaning.

  He was both facticity and transcendence, woven together so tightly that pulling on one thread unraveled the other. To be human was to be this unstable synthesis, this perpetual sliding.

  Julian looked at the pen clipped to his report. It was a cheap plastic thing. He unclipped it.

  He could sign. He could refuse. Both actions would be his, and neither would absolve him. If he signed, he couldn't say the system made him do it. If he refused, he couldn't say he was above the consequences.

  The rain hammered against the glass. The city waited. Julian stood there, the pen hovering over the line, feeling the sickness of his own liberty. He didn't sign. He didn't walk away. He just stood there, holding the weight of a choice that had no floor beneath it, waiting for the moment to pass, knowing it wouldn't.
