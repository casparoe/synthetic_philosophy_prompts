      *   **Ramsey's Actual View (The "If" Paper):** Emphasize that Ramsey was talking about *assertibility* and *inference*, not truth conditions. Quote the "variable hypothetical" idea.
      *   **Ramsey's Probability (Truth and Probability):** Explain his subjectivism. Belief is a disposition to act.
      *   **The Reconstruction:**
          1.  **Rejection of Propositionalism:** Ramsey would likely deny the antecedent of Lewis's proof (that conditionals express propositions with truth values).
          2.  **The Category Mistake:** $P(\text{If } A, B)$ is nonsense for Ramsey. It should be about the *strength of the inferential habit*.
          3.  **Variable Hypotheses:** Conditionals are rules, not facts. You don't assign probabilities to rules in the same way.
      *   **Nuance/Caveat:** Ramsey died young. His views were evolving. He might have been puzzled by the formalism. But the *spirit* of his philosophy protects him.
