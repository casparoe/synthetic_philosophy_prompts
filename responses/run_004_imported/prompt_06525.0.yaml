  2.  **Deconstruct the Theories:**
      *   **Expected Utility (EUT):** $EU = \sum p_i \cdot u(x_i)$. To explain insurance + lottery, $u$ must be S-shaped (concave then convex then concave?). This is often criticized as *ad hoc* or psychologically implausible (why does marginal utility of money wiggle like that?).
      *   **Friedman-Savage (1948):** Proposed the S-shaped utility function.
      *   **Risk-Weighted Expected Utility (REU):** $REU = \sum [r(\sum_{j=i}^n p_j) - r(\sum_{j=i+1}^n p_j)] \cdot u(x_i)$. Or more simply, weights probabilities non-linearly based on a risk function $r$. If $r$ is convex, you're risk-seeking; if concave, risk-averse. Buchak argues this separates *attitude toward risk* from *attitude toward outcomes*.
      *   **The Critique:** Is $r$ just $u$ in disguise? Does separating them actually solve the philosophical problem of *why* agents behave this way, or does it just add a parameter to fit the data?

  3.  **Brainstorming Arguments for the "Skeptic's Case" (REU adds nothing new):**
      *   **Underdetermination:** Both models can fit the same data. If I observe behavior $B$, I can explain it with $u_1$ in EUT or $u_2 + r_1$ in REU. Without independent access to mental states, it's just curve-fitting.
      *   **The "Black Box" Problem:** In EUT, the "bend" in $u$ represents everything (diminishing marginal value + risk attitude). In REU, we say $u$ is linear (value) and $r$ is bent (risk). But how do we measure $u$ independently of $r$? If we can't, the distinction is merely notational.
      *   **Arbitrariness of the Risk Function:** Why is $r(p) = p^2$ better than a bent $u$? Both require justification. Saying "it's risk attitude" is just labeling the phenomenon, not explaining it.
      *   **Representation Theorems:** EUT has strong axiomatic foundations (Von Neumann-Morgenstern). REU modifies the Independence Axiom. But does violating Independence actually ground a *better* normative theory, or just a more flexible descriptive one? If the goal is normative (how we *should* decide), REU might license irrational inconsistencies just as easily as a wiggly $u$.
      *   **The "Same Trick" Charge:** Friedman-Savage bent the value curve. Buchak bends the probability curve. Mathematically, transforming probabilities is isomorphic to transforming values in many contexts. It's a coordinate transformation.
      *   **Psychological Reality:** Do people actually compute $r(p)$? Or do they just feel value differently? If the cognitive process is the same, the formal distinction is scholastic.

  4.  **Structuring the Argument:**
