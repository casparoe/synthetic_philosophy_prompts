      *   **Point 2: Mathematical Isomorphism:** Show that bending $p$ can often be modeled as bending $u$. It's a transformation of variables. The "explanatory work" is done by the non-linearity, regardless of where it sits.
      *   **Point 3: The Normative Vacuum:** Buchak claims REU is normative (rational to care about risk structure). But if $r$ is arbitrary, it licenses *any* preference. A wiggly $u$ was criticized for being *ad hoc*; a wiggly $r$ is equally *ad hoc* unless grounded in something deeper (which REU doesn't provide).
