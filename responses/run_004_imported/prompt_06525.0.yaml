answer: |-
  You are right to be suspicious. Your intuition that Risk-Weighted Expected Utility (REU) theory might just be "Friedman-Savage in drag" is a critique shared by several hardline Bayesians and decision theorists. While Lara Buchak argues that REU offers a principled separation between *value* (utility) and *attitude toward risk* (the risk function), a rigorous philosophical audit suggests she may have simply moved the mystery from one variable to another without dissolving it.

  Here is the strongest case that REU theory does not buy you anything philosophically new regarding the insurance/lottery puzzle, and that the risk function is indeed just a relocated arbitrariness.

  ### 1. The Identification Problem: You Can't Separate the Variables
  The core selling point of REU is that it disentangles two things that Expected Utility Theory (EUT) conflates: how much you value outcomes ($u$) and how much you care about risk ($r$). Buchak suggests we can measure $u$ over riskless choices and $r$ over risky choices.

  However, this separation is empirically and philosophically fragile. In practice, there is no "view from nowhere" to measure utility independently of risk. Even in so-called riskless choices, there is uncertainty (will this coffee actually taste good? will I enjoy this dinner?). If we define $u$ based on riskless choices, we are assuming the agent is risk-neutral in those specific micro-contexts. But if the agent is the kind of person who buys lottery tickets, why assume they are risk-neutral when choosing between apples and oranges?

  If you cannot independently measure $u$ without presupposing a risk attitude, then $u$ and $r$ are **underdetermined** by behavior. Just as Friedman-Savage could fit any behavior by wiggling the utility curve, REU can fit any behavior by wiggling the risk function while holding utility linear. Mathematically, you have simply added a degree of freedom to the model without adding explanatory power. You haven't solved the puzzle; you've just given the curve-fitting a new name.

  ### 2. Mathematical Isomorphism: It's Just a Coordinate Transformation
  At a formal level, the distinction between bending the utility curve (Friedman-Savage) and bending the probability curve (Buchak) is often just a coordinate transformation.

  In EUT, we maximize $\sum p_i \cdot u(x_i)$. To explain insurance (risk aversion) and lotteries (risk seeking), Friedman and Savage proposed an S-shaped $u(x)$.
  In REU, we maximize a weighted sum where probabilities are transformed by $r(p)$.

  Consider the mathematical reality: A non-linear transformation of probabilities can, in many contexts, be represented as a non-linear transformation of outcomes, and vice versa. If an agent rejects a fair gamble, EUT says "the utility of the loss outweighs the utility of the gain." REU says "the probability of the loss is weighted more heavily."

  But what is the *cash value* of this difference? If the behavioral output is identical, and the mathematical structures are isomorphic in terms of what preferences they can represent, the claim that REU is "more principled" rests entirely on the assertion that *probabilities* are the right place to put the non-linearity rather than *values*. But why? Unless you have a independent philosophical argument for why risk attitude *must* reside in the probability weighting rather than the valuation of outcomes, this is merely aesthetic. It is, as you suspect, the same trick wearing a different hat.

  ### 3. The Normative Vacuum: Licensing Arbitrariness
  Buchak argues REU is a *normative* theory, not just descriptive. She claims it is rational to care about the global structure of a gamble (e.g., the spread of outcomes), not just the expectation.

  However, this opens the door to the same criticism leveled at Friedman-Savage: **Anything Goes.**
  The Friedman-Savage utility function was criticized because it required an implausible, *ad hoc* explanation for why marginal utility of money goes up and down. REU avoids the wiggly utility curve, but it replaces it with a wiggly risk function. What constrains the risk function $r$?

  If $r$ can be any monotonic function, then REU can rationalize *any* preference ordering that satisfies its axioms. If an agent buys insurance and lottery tickets, REU says, "Ah, they have a specific risk function that is concave here and convex there." But this is just a restatement of the behavior, not an explanation of it.
  *   **Friedman-Savage:** "You buy lottery tickets because your utility function bends up here."
  *   **Buchak:** "You buy lottery tickets because your risk function bends up here."

  Neither tells you *why*. Both models accommodate the behavior by adjusting a parameter. If the goal of philosophy is to find rational constraints on belief and desire, REU fails to provide tighter constraints than EUT; it merely relocates the flexibility. It legitimizes the "arbitrariness" of the insurance/lottery combo by labeling it "risk-weighting," but it doesn't ground it in a deeper principle of rationality.

  ### 4. Violating Independence Doesn't Save Rationality
  REU requires violating the **Independence Axiom** of Von Neumann-Morgenstern (vNM) theory. The Independence Axiom is often defended as a core requirement of diachronic consistency and dynamic choice. By tossing it out to accommodate the insurance/lottery puzzle, REU saves the "phenomena" at the cost of dynamic consistency.

  If you violate Independence, you become susceptible to money pumps (or at least, you require additional constraints to avoid them). Friedman-Savage kept Independence but bent utility. Buchak keeps utility linear but bends Independence (via the risk function).
  From a philosophical standpoint, both approaches are trading a bullet.
  *   **EUT/Friedman-Savage:** Accepts weird psychology of value to keep rational choice dynamics clean.
  *   **REU:** Accepts weird rational choice dynamics to keep psychology of value clean.

  Claiming REU is "more principled" assumes that it is more plausible for humans to have linear value functions than consistent dynamic choices. That is a contentious empirical claim, not a philosophical truth. If the "principled" solution requires violating a core axiom of rational coherence to save a specific intuition about risk, it is arguably *less* principled than admitting that human utility functions are context-dependent.

  ### 5. Labeling vs. Explaining
  Finally, the strongest philosophical charge is that REU commits a **reification fallacy**. It takes a pattern of behavior (simultaneous risk aversion and seeking) and posits a mental entity (the risk function $r$) to explain it.

  But does the agent actually possess a function $r$? Or is $r$ just a mathematical artifact we use to make the model fit?
  If I ask a Friedman-Savage proponent, "Why did you buy the ticket?" they say, "Because the marginal utility of that potential win is high."
  If I ask a Buchak proponent, "Why did you buy the ticket?" they say, "Because I overweight the small probability."

  The second answer *sounds* more psychological (prospect theory style), but in the context of normative decision theory, it is just as hollow. It says, "I treated the small probability as if it were larger." *Why?* "Because of my risk function." *What determines your risk function?* "My choices."

  This is circular. The risk function is a summary statistic of the behavior, not a causal mechanism. By elevating this summary statistic to a fundamental component of rationality, REU gives the illusion of explanation without providing a foundation. It smuggles in the arbitrariness of the Friedman-Savage curve by calling it a "risk attitude," but since that attitude is unconstrained by any independent rational principle, it remains just as *ad hoc*.

  ### Conclusion
  Your nose is correct. REU theory resolves the insurance/lottery puzzle only by shifting the burden of explanation from the **valuation of outcomes** to the **weighting of probabilities**. Since neither can be measured independently of the other, and since both allow for arbitrary curvature to fit the data, REU does not offer a deeper philosophical insight. It offers a different *language* for describing the same anomaly.

  If Friedman-Savage is guilty of positing a "weirdly bent utility function," Buchak is guilty of positing a "weirdly bent probability function." Unless one can demonstrate that bending probabilities is metaphysically or normatively more fundamental than bending values—a claim REU asserts but does not prove—the theory is indeed the same trick, wearing a different hat.
