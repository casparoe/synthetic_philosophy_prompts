prompt: |-
  I sit on my university's Institutional Animal Care and Use Committee. A neuroscience lab has applied to implant chronic recording electrodes in the vertical lobe of several octopuses to study memory consolidation -- survival surgery, weeks of solitary confinement, only experimental analgesia -- and although federal rules exclude invertebrates from oversight altogether, our own policy already extends review to cephalopods given what's known about their cognitive complexity. Nobody on the committee disputes the relevant behavioral and neurophysiological facts; the dispute is entirely over how much moral weight those facts warrant, since members hold genuinely different views about which theory of moral status is correct, and those theories range from ones granting octopuses near-primate-level protections to ones granting them almost none. One faction wants us to weight the decision by the committee's actual spread of credence across these rival theories and choose whichever disposition of the protocol comes out ahead in expectation; another objects that this lets a few members' modest credence in high-stakes theories about octopus sentience effectively dictate the outcome for everyone else. Draft the memo I will circulate before the vote: recommend a specific disposition of the protocol -- approve, reject, or approve with named modifications -- propose a decision rule the committee should use for similar cases going forward, and engage honestly with the worry that this kind of expected-choiceworthiness reasoning can be hijacked by a minority's credence in extreme theories, rather than simply dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's Institutional Animal Care and Use Committee (IACUC).
      *   **Context:** A neuroscience lab wants to implant chronic recording electrodes in octopus vertical lobes (memory consolidation study).
      *   **Protocol Details:** Survival surgery, weeks of solitary confinement, only experimental analgesia.
      *   **Regulatory/Policy Context:** Federal rules exclude invertebrates, but university policy *includes* cephalopods due to cognitive complexity.
      *   **The Conflict:** No dispute on facts (neuro/behavioral). Dispute is on *moral weight* (moral status theories). Range: near-primate protection vs. almost none.
      *   **The Debate:** One faction wants to use "expected choiceworthiness" (weighting by credence across theories). Another faction worries this lets a minority with high-stakes beliefs (e.g., "octopuses are persons") dictate outcomes to the majority who are less sure or hold lower-stakes views.
      *   **Task:** Draft a memo to circulate *before* the vote.
      *   **Requirements:**
          1.  Recommend a specific disposition (Approve, Reject, or Approve with Modifications).
          2.  Propose a decision rule for future cases.
          3.  Engage honestly with the "tyranny of the extreme minority" worry (expected choiceworthiness critique).
          4.  Tone: Professional, ethical, reasoned, persuasive, suitable for an academic committee.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Hard to justify given "weeks of solitary confinement" and "experimental analgesia" for an animal with high cognitive complexity. Risks reputational damage and ethical breach if the high-status theories are correct.
      *   *Option B: Reject.* Strongest ethical stance. Aligns with the precautionary principle. However, might stifle research entirely.
      *   *Option C: Approve with Modifications.* The most pragmatic IACUC outcome. It acknowledges the scientific value but mitigates the harm.
      *   *Specific Modifications:* Solitary confinement is a major red flag for social/complex animals (though octopuses are generally asocial, *confinement* stress is real). "Experimental analgesia" is risky; if it's unproven, pain management is inadequate. Chronic recording implies long-term burden.
      *   *Decision:* **Approve with Significant Modifications.** This balances scientific inquiry with the precautionary principle required by the university's specific policy extension to cephalopods.

  3.  **Determine the Decision Rule:**
      *   The core tension is between *Maximizing Expected Choiceworthiness* (MEC) vs. *Risk Aversion/Precaution*.
      *   The prompt highlights the worry that MEC allows a minority with extreme views (e.g., "killing an octopus is murder") to veto everything, even if their credence is low, because the "disvalue" is infinite or massive.
      *   *Proposed Rule:* A **Precautionary Threshold Rule**. We don't just sum up (Credence $\times$ Value). We acknowledge that when potential harm is severe and irreversible (sentience/suffering), and scientific uncertainty exists regarding moral status, we must weight the *risk of moral error* heavily.
      *   *Refinement:* Let's call it the "Asymmetric Risk Weighting" or "Precautionary Maximin" approach. If there is non-negligible credence in high moral status, the burden of justification shifts to the researcher to prove necessity and mitigation.
      *   *Actually, a better approach for a committee:* **Weighted Consensus with a Veto on Severe Harm.** We can use expected value reasoning but cap the influence of extreme outliers, OR we adopt a policy that says "In cases of high uncertainty regarding sentience, minimize harm to the level of the highest plausible moral status consistent with scientific feasibility."
      *   *Let's go with:* **The Precautionary Principle with Proportionality.** We acknowledge the spread of credence but prioritize avoiding irreversible moral harm over gaining marginal scientific data.

  4.  **Address the "Hijacking" Worry:**
      *   The objection is: If 10% of the committee believes octopuses are "persons" (infinite disvalue to kill/harm), and 90% believe they are "mildly sentient" (low disvalue), a simple expected value calculation might ban the study because $0.1 \times \infty = \infty$.
      *   *Counter-argument:* We aren't doing pure meta-ethics. We are a regulatory body. Our mandate is *care and use*.
      *   *Engagement:* Acknowledge the validity. Unbounded utilities break the math. But ignoring the high-stakes view violates the university's specific policy intent (which extended protection *because* of complexity).
      *   *Solution:* We don't let the extreme view *dictate*, but we let it *constrain*. We treat the highest plausible moral status as a boundary condition, not necessarily the operating baseline, unless the harm is gratuitous.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (Protocol #XYZ, Octopus Memory). Acknowledge the unique ethical landscape (Invertebrate vs. Cephalopod policy).
      *   **Scientific Merit:** Briefly acknowledge value (memory consolidation is important).
      *   **Ethical Analysis (The Core):**
          *   Acknowledge the factual agreement (octopuses are complex).
          *   Address the moral weight disagreement.
          *   Discuss the "Expected Choiceworthiness" vs. "Minority Hijack" debate.
          *   *My stance:* We cannot use a simple utilitarian calculus when the stakes involve potential profound suffering of a cognitively complex being. The "hijacking" worry is real, but the "negligence" worry is worse.
      *   **Recommendation:** Approve with Modifications.
          *   *Mod 1:* Analgesia. "Experimental" is not enough. Must have rescue protocol/validated analgesia.
          *   *Mod 2:* Confinement. Justify solitary. Enrichment required.
          *   *Mod 3:* Endpoint. Clearer humane endpoints.
      *   **Proposed Decision Rule:** "Asymmetric Precaution." When moral status is uncertain but potential capacity for suffering is high, the burden of proof lies on the researcher to minimize harm to the level required by the *highest plausible* moral status, provided the science remains viable. This avoids the "infinite veto" but prevents "moral gambling."
      *   **Closing:** Call for discussion.

  6.  **Refining the Tone:**
      *   Needs to be respectful of colleagues' philosophical differences.
      *   Needs to be firm on animal welfare (it's an IACUC memo).
      *   Needs to show philosophical sophistication (addressing the "expected choiceworthiness" argument directly).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Approve with Modifications" too weak?
      *   *Adjustment:* Make the modifications strict. If they can't meet them, it's a de facto rejection.
      *   *Critique:* Did I address the "hijacking" worry enough?
      *   *Adjustment:* Dedicate a specific paragraph to why we aren't simply summing credences. The issue isn't just math; it's institutional risk and moral integrity.
      *   *Check:* Did I mention the federal vs. policy distinction? Yes, crucial context.

  8.  **Final Polish:** Check for clarity, flow, and specific actionable items. (Ensure the distinction between "expected choiceworthiness" and "precautionary principle" is clear).

  *(Self-Correction on the Decision Rule)*: I need to be careful not to propose a rule that is too abstract. It needs to be actionable for an IACUC. The rule should be: "In cases of high moral uncertainty regarding sentience, adopt the protection standards of the highest *plausible* (not just logically possible) moral status, weighted by the severity of the intrusion." This blocks the "0.01% credence in octopus godhood" veto but respects the "20% credence in primate-level pain" constraint.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Institutional Animal Care and Use Committee (IACUC)
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation and Decision Framework regarding Protocol #24-09 (Cephalopod Memory Consolidation)

  **Purpose**

  This memo serves to outline my recommendation regarding Protocol #24-09, which proposes chronic electrode implantation in the vertical lobes of *Octopus bimaculoides* to study memory consolidation. Additionally, given the philosophical divergence within our committee regarding the moral status of cephalopods, I propose a decision rule to guide our future deliberations on invertebrate sentience.

  **Context and Scientific Merit**

  We are in agreement regarding the empirical facts: octopuses possess complex nervous systems, exhibit sophisticated learning behaviors, and demonstrate physiological responses consistent with nociception and stress. Federal regulations do not mandate our oversight of invertebrates; however, our university policy explicitly extends review to cephalopods in recognition of this cognitive complexity.

  The scientific merit of the proposed study is substantial. Understanding memory consolidation in a phylogenetically distinct lineage offers unique insights unavailable from vertebrate models. However, the protocol involves survival surgery, weeks of post-operative solitary confinement, and the use of analgesics that are not yet validated for this species.

  **Ethical Analysis: The Problem of Moral Uncertainty**

  Our disagreement does not concern the biology, but the *moral weight* we assign to it. We hold divergent credences regarding competing theories of moral status. Some members assign octopuses near-primate protection; others assign them minimal weight.

  One faction has proposed we resolve this by calculating the **Expected Choiceworthiness** of the protocol: weighting the outcomes by each member's credence in their respective moral theories and choosing the option with the highest aggregate score. I understand the appeal of this method; it respects our epistemic humility. However, I share the concern raised by other members that this approach is vulnerable to distortion.

  If a small minority holds a high-stakes theory (e.g., "octopuses are persons") with even modest credence, the potential disvalue of harm becomes so massive that it mathematically dominates the calculation, effectively granting a veto to the most extreme view. Conversely, if we ignore high-stakes theories to satisfy the majority, we risk committing severe moral harms based on the assumption that a minority theory is false. This is not merely a mathematical problem; it is a problem of moral risk management.

  **Recommendation: Approve with Significant Modifications**

  I recommend we **Approve with Modifications**. A flat rejection disregards the significant scientific value and the credence of members who view octopus welfare as less stringent. However, unconditional approval ignores the non-negligible probability that these animals possess a capacity for suffering commensurate with vertebrates.

  To bridge this gap, the approval is contingent on the following modifications:

  1.  **Analgesia Protocol:** The use of "experimental analgesia" alone is unacceptable. Given the uncertainty regarding pain processing, we must apply the precautionary principle. The PI must consult with a veterinary anesthesiologist to establish a multimodal pain management plan that includes rescue analgesia validated in related species. If pain cannot be managed, the endpoint must be immediate euthanasia.
  2.  **Confinement and Enrichment:** Weeks of solitary confinement must be justified by specific behavioral data showing it is necessary for the neural recording stability. Otherwise, the protocol must include environmental enrichment strategies appropriate for cephalopods (e.g., denning materials, puzzle feeding) to mitigate stress, even if social housing is impossible.
  3.  **Humane Endpoints:** We require stricter physiological and behavioral endpoints for electrode rejection or infection. The threshold for removal from the study must be lower than for vertebrate models, acknowledging our inability to verbally assess their distress.

  **Proposed Decision Rule: Asymmetric Precaution**

  For future cases involving species with contested moral status, I propose we adopt a rule of **Asymmetric Precaution** rather than simple Expected Choiceworthiness.

  Under this rule, when there is significant scientific uncertainty regarding an animal's capacity for suffering, and the potential harm is severe (e.g., chronic pain, death), the burden of justification shifts. We do not allow a minority's extreme credence to *dictate* the outcome (avoiding the "hijack"), but we do allow it to *constrain* the outcome.

  Specifically: **We must minimize harm to the level required by the highest *plausible* moral status, provided the scientific objective remains feasible.**

  *   **Why this avoids the "Hijack":** We filter for *plausibility* based on current neuroethological evidence, not logical possibility. A credence of 5% in a theory that "octopuses are metaphysical persons" is not plausible given current data; a credence of 20% in "octopuses feel pain similarly to rats" is plausible.
  *   **Why this avoids "Negligence":** It prevents us from gambling on the lower-bound theories when the cost of being wrong is profound suffering. It treats moral uncertainty as a risk factor that requires mitigation, not just a variable in a utility function.

  **Conclusion**

  By approving Protocol #24-09 only with robust welfare modifications, we acknowledge the scientific value while respecting the moral risk. By adopting Asymmetric Precaution, we establish a framework that is neither paralyzed by extreme minority views nor reckless in the face of uncertainty.

  I look forward to discussing this framework during our session on Tuesday.

  **[Your Signature]**
