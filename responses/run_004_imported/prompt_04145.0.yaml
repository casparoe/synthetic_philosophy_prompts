answer: |-
  This is a classic and profound tension in information economics, one that sits at the boundary of decision theory and general equilibrium theory. As a PhD student, you recognize that resolving this isn't about finding an error in the math of either result, but rather identifying the domain of applicability for the axioms underlying Good's Theorem.

  The short answer is that **Hirshleifer's scenario violates the assumption that the opportunity set (and the payoff function) is invariant to the information structure.** Good's Theorem is a partial equilibrium result regarding the *private* value of information for decision-making; the Hirshleifer effect is a general equilibrium result regarding the *social* value of information for risk-sharing.

  Here is a detailed breakdown of the specific assumption violations and the regulatory implications for your paper.

  ### 1. The Axiomatic Divergence: Where Good's Theorem Breaks

  I.J. Good's (1967) theorem states that for a Bayesian expected-utility maximizer, the expected utility of observing a cost-free signal before acting is weakly greater than acting without the signal. Formally:
  $$ E_{\sigma} \left[ \max_{a} E_{\omega|\sigma} [u(a, \omega)] \right] \ge \max_{a} E_{\omega} [u(a, \omega)] $$

  For this inequality to hold strictly as a guarantee of non-negative value, several background assumptions must hold. Hirshleifer's (1971, 1975) result violates two critical ones:

  #### A. Invariance of the Payoff/Opportunity Function
  Good's theorem assumes that the mapping from actions and states to utility, $u(a, \omega)$, is fixed. The information signal $\sigma$ updates the belief distribution over $\omega$, but it does not alter the *consequences* of action $a$ other than through the agent's choice of $a$.

  In Hirshleifer's framework, the "action" is trading assets to share risk. However, the **terms of trade (prices)** are endogenous. The price system $p(\sigma)$ is a function of the information structure.
  *   **Good:** Information changes beliefs; the menu of gambles remains fixed.
  *   **Hirshleifer:** Public information changes the menu of gambles. When a public signal resolves uncertainty *before* trading, the set of feasible state-contingent claims collapses. The "insurance" asset ceases to exist because the states are no longer uncertain.

  Therefore, Good's theorem fails because the information structure itself modifies the payoff function $u(\cdot)$ by altering the equilibrium price system and the completeness of the market.

  #### B. Partial vs. General Equilibrium (Strategic Independence)
  Good's theorem is fundamentally a **single-agent decision problem** (or assumes agents are price-takers whose individual actions do not affect the environment). It ignores strategic interaction.

  The Hirshleifer effect is inherently **multi-agent and strategic**. The welfare loss arises because the information becomes *common knowledge*, altering the behavior of all agents simultaneously.
  *   If I receive *private* information, I can potentially trade with uninformed agents to my benefit (consistent with Good).
  *   If *public* information is released, everyone knows the state. There is no counterparty willing to take the other side of a risk-sharing trade because the risk has vanished.

  Good's theorem does not account for the **externality** of public information. My receipt of information in Good's framework does not degrade your ability to insure yourself. In Hirshleifer's framework, the public nature of the information destroys the *mutual* benefit of trade.

  ### 2. Implications for the "More Disclosure is Better" Heuristic

  For your paper on mandatory disclosure rules, this distinction provides the theoretical leverage to argue against the blanket statement that "more disclosure is always weakly welfare-improving." Here is how you should frame the regulatory implications:

  #### A. Decision Efficiency vs. Risk-Sharing Efficiency
  Regulators often justify disclosure rules using the **decision-efficiency** argument (aligned with Good's Theorem): disclosure allows capital to be allocated to higher-productivity projects because investors can better distinguish quality. This is the *real side* of the economy.

  However, the Hirshleifer effect highlights the **risk-sharing efficiency** argument (the *financial side*): disclosure can impair the market's ability to insure agents against idiosyncratic shocks.
  *   **Implication:** Welfare analysis of disclosure rules must be a net calculation: $\Delta W = \Delta W_{\text{allocation}} - \Delta W_{\text{risk-sharing}}$.
  *   If markets are incomplete (which they invariably are), the Hirshleifer effect is potent. Regulators cannot assume the risk-sharing cost is zero.

  #### B. The Criticality of Timing (Ex-Ante vs. Interim)
  Good's theorem assumes the sequence: **Signal $\rightarrow$ Action $\rightarrow$ Payoff**.
  The destructive Hirshleifer effect occurs when the sequence is: **Signal $\rightarrow$ Trading $\rightarrow$ Payoff**, where the *value* of trading relies on uncertainty existing at the Trading stage.

  *   **Regulatory Implication:** Mandatory disclosure rules should distinguish between information released *before* positions are established versus *after*.
      *   Disclosure *after* portfolios are formed (but before payoff realization) generally satisfies Good's theorem without triggering the Hirshleifer effect (agents can adjust, but the initial risk-sharing contract was already struck under uncertainty).
      *   Disclosure *before* trading (e.g., mandatory prospectus details before IPO subscription) risks collapsing the risk-sharing premium.
      *   *Policy nuance:* This supports arguments for "safe harbor" periods or delayed disclosure mechanisms that allow risk-sharing contracts to form before uncertainty is fully resolved.

  #### C. Market Completeness as a Mitigating Factor
  The Hirshleifer effect is most severe in incomplete markets. If agents could trade a complete set of Arrow-Debreu securities *ex-ante* (before the information regime is even chosen), they could theoretically write contracts contingent on the information structure itself, neutralizing the welfare loss.

  *   **Regulatory Implication:** Since complete markets are a theoretical fiction, regulators cannot rely on private contracting to solve the Hirshleifer problem. This justifies intervention. However, it also suggests that in highly liquid, diverse markets (which approximate completeness better), the Hirshleifer cost is lower, and Good's benefits dominate. In thin, specialized markets, the Hirshleifer cost is higher.

  ### 3. Summary for Your Paper

  You can synthesize this tension in your theoretical section as follows:

  > "While Good's (1967) theorem establishes the non-negative private value of information for a Bayesian decision-maker, it relies on the ceteris paribus assumption that the opportunity set remains invariant to the information structure. Hirshleifer (1971) demonstrates that in a general equilibrium setting, public information is not merely a parameter update but a structural shock to the price system that can endogenously collapse the set of feasible risk-sharing allocations. Consequently, the normative claim that 'mandatory disclosure is welfare-improving' holds only when the gains from improved allocative efficiency (Good) dominate the losses from diminished risk-sharing capacity (Hirshleifer). Regulators must therefore treat disclosure not merely as a tool for transparency, but as a market design parameter that alters the completeness of the risk-sharing environment."

  ### Recommendation for Modeling
  If your paper involves modeling, consider a two-period setup:
  1.  **$t=0$:** Agents choose an information regime (Disclosure vs. No Disclosure).
  2.  **$t=1$:** Signal realized (if Disclosure).
  3.  **$t=1$:** Trading occurs.
  4.  **$t=2$:** Payoffs realized.

  Show that if agents can commit at $t=0$ to *no* disclosure, they might achieve higher ex-ante utility due to better insurance at $t=1$, even though at $t=1$ (under Good's logic), they would prefer to have the info to make the "best" trade. This highlights the **time-inconsistency** of information preference in GE settings, which is the ultimate violation of the static Good's framework.

  This distinction will add significant depth to your contribution, moving beyond the standard "information asymmetry" arguments into the more subtle "information structure" literature.
