answer: |-
  Here are nine interview questions designed for an ACX-adjacent audience, structured to press beyond standard taxonomy and anticipate your guest's reliance on phenomenological discomfort as evidence.

  **1. The Structure of Agent-Regret**
  "You argue that the lorry driver's 'agent-regret' is a normative signal, not just a bug in our psychology. But consider a gambler who feels a pang of guilt after a coin flip lands tails, costing a friend money, or a survivor of a disaster feeling guilt for having lived. We generally dismiss those as unwarranted psychological artifacts. Structurally, what distinguishes the lorry driver's causal involvement from the gambler's? Is there a specific threshold of agency required to make the regret 'veridical' rather than just a misfiring emotion, and if so, doesn't that threshold sneak the Control Principle back in through the side door?"

  *   **Follow-up (if she insists the feeling itself validates the norm):** "If the intensity of the emotion is the metric, how do you account for cultural variance? If we raised the driver in a Stoic community that taught him spectator-sympathy was the only rational response, would he be *morally mistaken*, or just differently socialized? If the former, you need a standard outside the feeling; if the latter, your argument rests on contingent psychology."

  **2. Gauguin and Survivorship Bias**
  "Let's press the Gauguin case. On your reading, his abandonment of his family is retrospectively justified *because* he succeeded. But this looks vulnerable to severe survivorship bias. If Gauguin had died of yellow fever in Tahiti after producing mediocre work, would his action have been morally wrong in that timeline, but right in ours? If the moral status of the act flips based on a future outcome he couldn't access, what work is the 'luck' actually doing? Is it changing the moral reality, or just our epistemic access to it?"

  *   **Follow-up (if she claims the moral reality actually changes):** "If the moral reality changes retroactively, that implies a kind of moral time-travel that makes ethical deliberation impossible, since we can never know the value of our choices until we're dead. If it's only our *access* that changes, then haven't you conceded that the *blameworthiness* was fixed at the time of action, and luck only affects our *judgment* of it? That seems to save the Control Principle where it matters most."

  **3. Causal Luck and the Levy Collapse**
  "Nagel distinguishes four types of luck, but many critics argue that 'causal luck' quietly swallows the other three. If my constitution and circumstances are products of prior causes I didn't choose, then 'resultant luck' is just the terminal point of a causal chain I never controlled. Neil Levy argues this leads to skepticism: if luck is pervasive, responsibility vanishes entirely. How do you resist this slide? How do you carve out a space for moral luck without tipping over into the conclusion that *nothing* is within control, rendering moral assessment meaningless?"

  *   **Follow-up (if she argues for a compatibilist middle ground):** "Compatibilism usually requires a stable 'self' that owns the actions. But if constitutive luck determines the self, what is doing the owning? Are you positing a 'noumenal self' that absorbs the luck, and if so, isn't that just the Kantian subject you're trying to dismantle, renamed?"

  **4. Poker, "Resulting," and Criminal Attempts**
  "Our listeners are familiar with the poker heuristic against 'resulting'—the idea that you must judge a decision by the reasoning process, not the outcome, to learn correctly. Yet, in criminal law, we punish completed crimes much more harshly than attempted ones, even if the intent was identical. Do you view this legal distinction as tracking a genuine difference in blameworthiness, which would support your view? Or is it merely a pragmatic compromise driven by evidence problems and deterrence needs? If it's the latter, can we really derive moral ontology from legal practice?"

  *   **Follow-up (if she argues the law tracks genuine moral difference):** "If the completed crime is genuinely worse, then two agents with identical malicious intent and identical risk-imposition have different moral worth solely due to external factors. Does this imply that a drunk driver who makes it home safely is morally superior to one who hits a pedestrian, even if their driving was identical? If you say yes, how do you reconcile that with the rationalist imperative to judge decisions by expected value?"

  **5. The "Discomfort as Evidence" Heuristic**
  "In your recorded talks, you often treat the audience's discomfort with moral luck as confirming evidence—the intuition pump *is* the proof. But cognitive science suggests humans have conflicting intuitions: we have a retributive impulse (System 1) and a fairness/control impulse (System 2). Why should we privilege the intuition that generates discomfort over the one that seeks consistency? Couldn't the discomfort just be the friction of a buggy heuristic colliding with a rational principle?"

  *   **Follow-up (if she argues the discomfort is too universal to be a bug):** "Universal biases exist—like the gambler's fallacy or scope neglect. If we discovered that 'belief in free will' was also a universal cognitive illusion necessary for social function, would you defend free will on the same phenomenological grounds? Where do you draw the line between 'deep moral truth' and 'useful evolutionary fiction'?"

  **6. The Pragmatic Value of the Control Principle**
  "Even if the Control Principle is metaphysically false, as you argue, might it be a necessary regulatory ideal? If we institutionalize the view that luck determines blame, do we risk eroding the incentives for people to exercise control? For example, if a doctor knows a bad outcome might be 'bad luck' rather than negligence, does that lower the expected value of caution? Is there a consequentialist argument for pretending Kant was right, even if you've proven he was wrong?"

  *   **Follow-up (if she says truth trumps utility):** "In AI alignment, we care deeply about robustness to distributional shift. If we train moral agents on a system where luck dictates worth, do we risk creating agents that are brittle when luck turns against them? Is there a safety case for the Control Principle, even if it's not the 'true' metaphysics?"

  **7. Constitutive Luck and Character Cultivation**
  "You rely heavily on resultant luck (outcomes) and circumstantial luck (situations). But constitutive luck—who you are temperamentally—seems the hardest to reconcile with praise. If I am patient because of lucky genetics, am I praiseworthy for my patience? If you say yes, does that not dissolve the concept of 'virtue' into 'advantage'? How do you distinguish between a moral achievement and a lucky trait without referencing the effort expended, which circles back to control?"

  *   **Follow-up (if she argues effort is also luck-determined):** "If effort is determined by constitutive luck, then the 'moral self' seems to disappear entirely, leaving only a locus of causal forces. At that point, isn't 'moral luck' a misnomer? It's just 'causal determinism.' Why keep the moral vocabulary at all if the agent is fully passive in their own constitution?"

  **8. Decision Theory and Expected Moral Worth**
  "ACX listeners think in terms of Expected Value (EV). In decision theory, we maximize EV, not realized value. If moral luck is real, does it imply we should be maximizing *Realized Moral Value* instead? If so, does that change how we should deliberate? Should I take a high-risk, high-reward moral gamble because if it succeeds, I'm a saint, even if the EV of blameworthiness is negative? How does your view integrate with rational choice theory?"

  *   **Follow-up (if she says deliberation remains the same, only assessment changes):** "If deliberation doesn't change, but assessment does, then you have a disconnect between the 'guidance' function of ethics and the 'assessment' function. Isn't the primary point of moral theory to guide action? If your theory cannot guide action differently than Kant's, but makes us feel worse about our outcomes, what is the comparative advantage of your view?"

  **9. The Weakest Link and Falsification**
  "Finally, to close: Nagel's taxonomy gives you four categories—resultant, circumstantial, constitutive, and causal. If you had to sacrifice one to save the coherence of your overall position, which is the weakest link for you? And conversely, what specific empirical or philosophical finding would force you to abandon the project of moral luck entirely and return to the Control Principle?"

  *   **Follow-up (if she struggles to name a falsification condition):** "If there is no evidence that would change your mind, does that suggest your position is functioning as a framework rather than a hypothesis? If it's a framework, shouldn't we judge it by its fruit—does adopting it make our moral practices more just, or simply more accurate to a reality we can't change?"
