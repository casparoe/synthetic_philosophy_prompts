      *   *What if the human truly couldn't know?* Hobbes is a determinist/materialist. He might argue the "unforeseen" is just a lack of calculation, not a metaphysical gap. But practically, for the sake of peace, the loss lies where it falls (the owner).
      *   *Final check:* Does this violate the "strictly from Hobbes's concepts" constraint? Yes, stick to Authorization, Covenant, and Personation. Avoid "negligence." Focus on "Ownership of Action."

