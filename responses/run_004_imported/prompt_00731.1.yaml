answer: |-
  This is a classic and profound dispute in epistemic game theory and the philosophy of probability. Your friend is correctly citing the mathematical machinery, but she is conflating a *theorem within a model* with a *constraint on rationality itself*.

  To win this argument, you must concede the mathematics of Aumann (1976) while dismantling the epistemological status of the Common Prior Assumption (CPA). You need to demonstrate that the CPA is a modeling convenience or a normative aspiration, not a logical requirement of Bayesian coherence. Furthermore, you must show that Cowen and Hanson's "modesty argument" begs the question by assuming a meta-prior that rational agents need not share.

  Here is a rigorous case for why two fully rational, honest Bayesian agents can persistently disagree.

  ### 1. The Logical Status of Aumann's Theorem
  First, validate your friend's technical understanding to establish goodwill. Aumann's theorem is mathematically sound. It states that if two agents:
  1.  Share a **common prior** probability distribution over a state space $\Omega$.
  2.  Update via **Bayes' rule** on private information (represented by partitions of $\Omega$).
  3.  Have **common knowledge** of their posterior probabilities.

  Then, their posteriors must be identical.

  However, this is a conditional statement ($P \implies Q$). It proves that *given* a common prior, disagreement is impossible under common knowledge. It does **not** prove that a common prior is a requirement of rationality. To claim otherwise is to confuse the *axioms of probability* (which govern how beliefs change) with the *initial conditions* of the belief system (where beliefs start).

  If rationality is defined as **coherence** (avoiding Dutch Books, satisfying Savage's axioms), then any prior that satisfies the probability axioms is permissible. There is no "Dutch Book" argument that forces two agents to start with the same prior, only arguments that force an *individual* agent to remain consistent with *their own* prior over time.

  ### 2. The Subjectivist Defense (Savage and de Finetti)
  Your appeal to Savage is the correct foundational move. In the subjectivist (or personalist) Bayesian tradition, probabilities are not objective features of the world waiting to be discovered; they are degrees of belief held by an agent.

  *   **Priors as Preferences:** Just as standard rational choice theory does not demand that two rational agents share the same utility function (it is not "irrational" to prefer apples to oranges), strict Bayesianism does not demand they share the same prior. A prior is an expression of an agent's initial disposition to weigh evidence.
  *   **Underdetermination:** For unique, non-repeatable events like a "recession within two years," there is no objective frequency distribution to anchor a prior. There is no "true" prior. Therefore, insisting on a common prior imposes an objective constraint where none exists.
  *   **The Harsanyi Doctrine is Normative, Not Logical:** John Harsanyi introduced the CPA to make game theoretic models tractable and to suggest that differences in belief *should* be explainable by differences in information. But as Aumann himself noted in later reflections, this is a philosophical stance, not a theorem. It is a claim that "reasonable people *ought* to start alike," not "reasonable people *must* start alike."

  ### 3. Substantive Justifications for Divergent Priors
  Your friend argues that differing priors are merely "polite names for bias." This is the weakest link in her chain. You can argue that divergent priors arise from structural features of rational cognition that do not constitute epistemic failure.

  **A. The Reference Class Problem**
  To form a prior about a recession, an agent must categorize the current economic state. Is the current economy more analogous to the 1970s stagflation, the 1929 crash, or the 2008 crisis?
  *   Agent A categorizes the current moment as "late-cycle expansion" (Prior $P_A$).
  *   Agent B categorizes it as "post-shock recovery" (Prior $P_B$).
  Both categorizations are linguistically and theoretically defensible. Since the "true" similarity metric between historical epochs is not objective, the choice of reference class functions as a prior. Two rational agents can weigh historical analogies differently without one being biased.

  **B. Model Uncertainty (The "Small World" Problem)**
  Savage's framework assumes a well-defined state space. In reality, agents face "large world" uncertainty. We do not know the true structural model of the economy.
  *   Agent A's prior puts weight on Keynesian transmission mechanisms.
  *   Agent B's prior puts weight on Real Business Cycle mechanisms.
  This looks like a prior difference, but it is actually a difference in **theoretical framework**. Since no agent has access to the "God's eye view" of the true economic structure, maintaining a prior over competing models is rational. If we disagree on the model, we will disagree on the likelihood of the data, and thus our posteriors will diverge even if we see the same data.

  **C. Indexicality and Cognitive Trajectory**
  Even if we assume "ideal" rationality, agents have different histories. Your prior is the sediment of all your past updates. If our informational histories differ, our current "priors" (relative to the current argument) will differ.
  If your friend insists we must strip away our history to find a "true" common prior, she is asking us to be tabula rasas. But a tabula rasa cannot do Bayesian updating because it has no basis to assign likelihoods. Rationality requires *some* starting structure. That structure is inevitably path-dependent.

  ### 4. Refuting Cowen and Hanson
  Cowen and Hanson ("Are Disagreements Honest?") argue that if I believe you are honest and competent, I should treat your opinion as evidence and update toward it. If I don't, I am implying you are irrational.

  This argument fails on two counts:

  **A. The Regress Problem**
  To update on your opinion, I need a likelihood function: $P(\text{You believe } X | \text{World is } X)$. This requires me to have a prior belief about *your* reliability.
  *   I may believe you are competent, but I may also believe that *all* economists suffer from a specific professional bias (e.g., overconfidence in models).
  *   You may believe you are competent and *not* subject to that bias.
  We now disagree about the reliability of the signal (your opinion). To resolve *this* disagreement, we would need a meta-prior on the reliability of our self-assessments. This leads to an infinite regress. Stopping the regress at any point requires a prior that is not shared. Therefore, disagreement persists.

  **B. The "Modesty" Assumption is Itself a Prior**
  Hanson's argument assumes that the rational default is to treat another's belief as equally weighted evidence against one's own. But why?
  *   If I have strong reasons for my prior (derived from my specific expertise or data access), and I know you lack that specific access, I should not weight your opinion equally.
  *   Hanson assumes we share a prior on the *distribution of competence*. If I think I have specialized information you don't, and you think the same, we are not violating Bayesianism; we are disagreeing on the **informational asymmetry**.
  *   Cowen and Hanson essentially argue: "If you think you are right and I am wrong, you must think you are better than me." Not necessarily. I can think we are equally competent but that the evidence I have seen (which shaped my prior) is more diagnostic than the evidence you have seen. Since we cannot fully transmit the *qualia* of our evidence (the "feel" of the data), we cannot fully commonize our information.

  ### 5. Conclusion: Rational Pluralism
  The strongest closing argument is that the Common Prior Assumption is a **coordination device**, not an **epistemic truth**.

  In game theory, we assume common priors to solve for equilibria. In epistemology, insisting on them eliminates the possibility of **rational pluralism**. If the CPA were true, then once all data is in, there would be only one valid opinion on every matter. This contradicts the reality of scientific inquiry, where multiple competing paradigms (Kuhn) coexist rationally for decades.

  You can conclude with this distinction:
  *   **Aumann's Theorem** tells us that if we agree on the rules of the game and the starting board, we must agree on the outcome.
  *   **Your Argument** is that rational agents are allowed to play different games (different models) or start on different boards (different priors derived from valid but divergent conceptual frameworks).

  Therefore, you and your friend can remain in disagreement about the recession not because one of you is biased or irrational, but because you are operating with different, internally coherent, subjective probability distributions that reflect legitimate uncertainty about the structure of the economy. To demand otherwise is to demand a view from nowhere.

  **Summary for your friend:**
  "Your appeal to Aumann proves that *given* a common prior, we must agree. My appeal to Savage proves that rationality does not *mandate* a common prior. Cowen and Hanson assume that treating your opinion as evidence requires me to adopt your prior weight on that evidence, which is circular. We are not failing to be Bayesians; we are Bayesians with different, equally valid, subjective starting points."
