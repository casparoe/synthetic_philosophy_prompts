prompt: |-
  So I've fallen down a bit of a rabbit hole reading about signaling theory (started from some game theory notes for a side project, ended up reading evolutionary bio blog posts at 1am) and I keep seeing 'costly signaling' and 'the handicap principle' used like they're basically the same thing. Can you compare the handicap principle to the more general idea of costly signaling and spell out exactly what extra claim Zahavis version is making that the general theory doesn't actually need? Also curious whether that extra claim survived once people tried to formalize it game-theoretically (I think it was Grafen?), or if it quietly got swapped out for a weaker claim about marginal costs instead of the signal itself having to be wasteful. Basically trying to figure out if 'the cost is the whole point' is still true or if that's just the pop-science version of the idea.
