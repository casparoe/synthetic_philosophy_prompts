          *   The best way to respect *both* is to believe the calculation (FOE) but acknowledge the risk (HOE).
          *   Counter-argument to EP: EP demands we ignore FOE when HOE is present. That's bad epistemology.
      *   **Section 4: Addressing the "Irrationality" Charge.**
