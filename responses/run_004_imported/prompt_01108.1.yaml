      5.  Highlight potential pitfalls to avoid.

  9.  **Final Polish:** Ensure the distinction between *truth* (ontological) and *appearance* (phenomenological) is clear. This is the hinge of the whole argument. Scripture speaks of appearance to save souls; Nature displays reality to show God's power. Both are true, but for different ends.

      *(Wait, one nuance)*: The user asked about Salusbury's 1661 translation. The novel is set 1613-1616. The *Letter* was written c. 1615. Salusbury is later. The protagonist wouldn't have Salusbury's English. He would have the Italian manuscript. However, the user is using Salusbury to understand the *logic*. I should acknowledge that the logic holds regardless of the translation, but warn the user to ensure the protagonist's *vocabulary* matches 1615 Italian/Latin concepts, not 1661 English phrasing. (Actually, the user knows this, they are using Salusbury to parse the logic. I will focus on the logic but remind them about the language).

      *Correction:* The user says "I have been working through Thomas Salusbury's 1661 translation... to get the reasoning straight before I let my character paraphrase it." Okay, they understand the translation is anachronistic for the character, but useful for them. I will focus on the underlying concepts.

      *Key Theological Anchor:* St. Augustine. Galileo leans heavily on Augustine in the *Letter*. The protagonist should mention Augustine to show he's not inventing heresy.

      *Let's build the argument:*
