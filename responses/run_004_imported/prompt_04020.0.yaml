answer: |-
  **Title:** Actuality vs. Availability: A Defense of Rosenthalian Actualism Over Carruthers' Dispositionalism

  **Introduction**
  Higher-Order Theories (HOT) of consciousness share a core intuition: a mental state is conscious only in virtue of being the target of a suitable higher-order representation. However, the devil is in the metaphysical details of that "targeting." The central schism in contemporary HOT literature lies between David Rosenthal's *Actualist* view and Peter Carruthers' *Dispositionalist* revision. For Rosenthal, a state is conscious only if there is an *actual*, occurrent higher-order thought (HOT) directed at it. For Carruthers, specifically in his 2000 account *Phenomenal Consciousness*, actuality is too costly; a state is conscious if it is merely *disposed* to cause a HOT.

  While Carruthers motivates this shift to solve the "cognitive overload" problem, his solution comes at the price of the theory's primary explanatory target: phenomenology. This paper argues that despite the cognitive economy of dispositionalism, Rosenthal's actualism provides the superior account. Carruthers' view collapses the distinction between phenomenal consciousness and access consciousness, failing to explain why a mere disposition should feel like anything at all. Furthermore, Rosenthal's actualism offers a more robust handling of misrepresentation cases. While Actualism is metabolically expensive, Dispositionalism is explanatorily empty.

  **The Cognitive Overload Objection**
  Carruthers' primary motivation for abandoning actualism is architectural plausibility. If every conscious state requires a distinct, actual higher-order thought, the mind faces a potential regress or, at minimum, a "cognitive clutter" that contradicts our understanding of cognitive processing. Carruthers argues that positing an actual HOT for every conscious sensation (the redness of a rose, the ache of a knee, the taste of coffee) simultaneously would overwhelm the cognitive system. It implies a level of introspective activity that does not match the phenomenological passivity of experience. We do not feel like we are *thinking* about our pain; we just feel it.

  Rosenthal's defense here is often underestimated. He argues that HOTs are non-conscious themselves; they do not need to be introspective or deliberative. They are peripheral, automatic scans. However, Carruthers presses a functionalist point: evolution would not select for a system that generates a distinct neural vehicle for every conscious content just to mark it as "mine." Dispositionalism offers a leaner architecture. Consciousness becomes a matter of *availability* to the thinking system, not the generation of a new thought.

  On the grounds of cognitive science and evolutionary parsimony, Carruthers wins. The Actualist view demands a specific neural correlate for the HOT that is distinct from the First-Order (FO) state, doubling the neural real estate required for conscious experience. But a theory of consciousness must answer to phenomenology first and cognitive economy second. If the theory saves energy but loses the phenomenon, it has failed.

  **The Problem of the Mere Disposition**
  This is where Carruthers' view fractures. The "Mere Disposition" objection asks: Why should a state that is *capable* of being thought about count as *currently experienced*?

  Consider a analogy: A glass is disposed to break if struck. But if it sits on the shelf untouched, it is not breaking. Similarly, if a pain state is disposed to cause a HOT but no HOT occurs, in what sense is the pain *felt*? Carruthers attempts to bridge this gap by arguing that the disposition itself constitutes the "light" of consciousness. He suggests that for a creature like us, the availability of a state to higher-order systems *is* what it means for it to be phenomenal.

  However, this conflates *Access Consciousness* (availability for report and reasoning) with *Phenomenal Consciousness* (what-it-is-like-ness). A state can be available to a system without currently being lit up phenomenally. We process vast amounts of information that are available to higher-order systems (evidenced by priming effects or rapid reporting) without those states being phenomenally conscious. By reducing consciousness to a disposition, Carruthers explains why we can *report* on states, but he fails to explain why there is an *experience* of those states.

  Rosenthal's actualism, by contrast, respects the occurrence property of experience. Consciousness is an event, not a capacity. For a state to be phenomenally conscious, something must be *happening* to make it so. The actual HOT is that event. While this invites the cognitive overload worry, it does not commit the category error of confusing a capacity with an occurrence. If phenomenology is real, it must be actual. Therefore, on the core metaphysical question of what constitutes experience, Rosenthal holds the stronger position.

  **Misrepresentation and Empty HOTs**
  The divergence sharpens when considering misrepresentation—specifically, "targetless" HOTs. What happens if I have a HOT "I am in pain," but there is no corresponding first-order pain state (perhaps due to neural misfiring)?

  Rosenthal bites the bullet: if the HOT is present, the experience is present. I am consciously in pain, even if my body is not damaged and no first-order pain state exists. This is consistent with the HOT mandate: the HOT *makes* the state conscious. The phenomenology is generated by the higher-order awareness, not the lower-order quality. This aligns with the intuition that consciousness is transparent to the subject; if it seems to me that I am in pain, I am in pain.

  Carruthers' dispositionalism struggles here. For Carruthers, consciousness relies on the FO state being disposed to cause a HOT. But if the FO state does not exist (as in the misrepresentation case), it cannot have dispositions. A non-existent state cannot be available. Consequently, Carruthers is forced into a awkward position: either he must deny that there is phenomenal consciousness in cases of empty HOTs (contradicting the subjective certainty of the experience) or he must posit a "virtual" FO state to bear the disposition.

  Rosenthal's handling of misrepresentation is more coherent. It acknowledges that the *appearance* of consciousness is sufficient for consciousness. Since Dispositionalism ties the appearance to the disposition of a real FO state, it cannot account for hallucinations of consciousness without undermining its own definition. Rosenthal's Actualism allows the HOT to carry the phenomenological weight independently, which is necessary to explain how we can be wrong about the world but never wrong about our own conscious experience.

  **Verdict**
  Carruthers' Dispositionalist HOT is a superior theory of *cognitive access*. It explains how mental states become available for reasoning, reporting, and rational control without clogging the cognitive pipeline. It is a better theory for a cognitive architect trying to build an efficient agent.

  However, as a theory of *phenomenal consciousness*, it fails. It substitutes the *capacity* for experience with the *fact* of experience. The "cognitive overload" objection is a pragmatic worry about neural resources; the "mere disposition" objection is a metaphysical worry about the nature of existence. A theory of consciousness cannot prioritize resource management over the existence of the phenomenon it seeks to explain.

  Rosenthal's Actualism holds up better because it preserves the ontological status of experience. It accepts that consciousness is costly and perhaps metabolically inefficient, but it insists that for a state to be felt, an actual awareness must occur. Carruthers saves the brain from overload by sacrificing the "light" of consciousness, leaving us with a system that functions as if it were conscious but lacks the actual occurrence of feeling. If the goal is to explain why it feels like something to be us, Rosenthal's actual HOT is the only one that turns the light on.

  **References**
  *   Carruthers, P. (2000). *Phenomenal Consciousness: A Naturalistic Theory*. Cambridge University Press.
  *   Rosenthal, D. M. (2005). *Consciousness and Mind*. Oxford University Press.
