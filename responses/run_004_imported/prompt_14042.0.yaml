answer: |-
  **MEMORANDUM**

  **TO:** Elections Commission
  **FROM:** [Your Name]
  **DATE:** March [Day], 2024
  **SUBJECT:** Recommendation on Voting System Bylaws for March Election

  **Purpose**
  As we finalize the bylaws for the upcoming Student Body President election, our primary objective is clear: eliminate the "spoiler effect" inherent in our current plurality system. We all agree that a candidate should not win simply because the majority opposition was split between two other options.

  This memo evaluates the proposed alternatives (Ranked-Choice, Borda, Top-Two Runoff, and Approval) and offers a concrete recommendation. It also addresses recent discussions regarding game theory and strategic voting to ensure our decision is grounded in both mathematical reality and practical feasibility.

  **Theoretical Context: The "Perfect System" Myth**
  In our recent discussions, there has been hope that one of these systems might eliminate strategic voting entirely. I want to briefly contextualize this using the social choice theory we've reviewed, specifically the Gibbard-Satterthwaite theorem.

  The theorem demonstrates that for any election with three or more candidates, no deterministic voting system is completely immune to strategic manipulation. This does not mean manipulation is *easy* or *likely*, only that it is theoretically possible.

  *   **Regarding Approval Voting:** It was noted that Approval Voting might bypass this theorem because it utilizes cardinal (yes/no) ballots rather than ordinal rankings. While technically true that the specific constraints of Gibbard-Satterthwaite apply to ranking systems, the broader Gibbard (1973) theorem covers all voting schemes. In practice, Approval Voting still invites strategy (e.g., voters approving only their top choice to avoid boosting a compromise candidate). It is not a "loophole" to perfection, though it is a viable system.
  *   **Regarding Ranked-Choice (RCV):** Proponents argue RCV solves strategic voting. While it does not *solve* it in the absolute theoretical sense, it significantly raises the cost of manipulation compared to plurality. It makes "vote splitting" irrational, which is the specific problem we are trying to fix.

  **Evaluation of Options**

  1.  **Plurality (Current):** Fails our core objective. High risk of non-majority winners due to vote splitting.
  2.  **Borda Count:** While mathematically elegant, Borda is highly vulnerable to "burying" strategies (where voters rank a strong opponent last to lower their point total). It also performs poorly when candidates enter or exit the race late, violating the Independence of Irrelevant Alternatives.
  3.  **Top-Two Runoff:** This ensures a majority winner but requires two rounds of voting. Historically, student turnout drops precipitously in runoff elections, potentially delegitimizing the winner.
  4.  **Ranked-Choice Voting (Instant Runoff):** Simulates a runoff in a single round. It eliminates the spoiler effect, ensures the winner has broad support, and maintains higher turnout than a physical runoff.
  5.  **Approval Voting:** Simple to count, but often confusing for voters accustomed to choosing "one" candidate. It risks "bullet voting" (approving only one), which replicates plurality problems.

  **Recommendation**
  **I recommend the Commission adopt Ranked-Choice Voting (Instant Runoff) for the March election.**

  **Justification**
  While no system is theoretically perfect, RCV is the most robust *practical* solution for our specific constraints:

  *   **Solves the Spoiler Effect:** This is our primary mandate. RCV allows students to vote for a third-party candidate first without wasting their vote, as their ballot transfers if their candidate is eliminated.
  *   **Feasibility:** Unlike a Top-Two Runoff, RCV requires only one election cycle, preserving turnout and saving administrative resources.
  *   **Strategic Resilience:** While the Gibbard-Satterthwaite theorem reminds us that *some* strategy is always possible, RCV makes the most common form of manipulation (vote splitting) impossible. The strategies that do exist against RCV are complex and require precise knowledge of other voters' intentions, making them unlikely in a student body election.
  *   **Voter Intent:** RCV captures more information than Plurality or Approval. It distinguishes between a voter's "hopeful" choice and their "acceptable" choice, which aligns best with our goal of electing a President with broad consensus.

  **Next Steps**
  For Thursday's meeting, I propose we draft the bylaw language to implement RCV. I have prepared a draft of the ballot instructions to ensure clarity for the student body, as voter education will be the key to success.

  We cannot mathematically guarantee a strategy-free election, but we can guarantee a system where the winner reflects the majority will. RCV is the best tool we have to achieve that.

  See you Thursday.
