answer: |-
  The machine did not look like a portal to salvation. It looked like an MRI scanner mated with a server rack, humming with a low, dental-drill vibration that settled in Elias's molars. He sat in the operator's chair, his left hand resting on the console. Or rather, his right hand rested on the console. His left arm ended at the wrist, the sleeve of his shirt pinned neatly against the stump.

  "Stabilizing," said the technician's voice over the intercom. "World-line 89-Delta is locking in. Remember, Elias, visual contact only. No material exchange."

  "Just show me," Elias said.

  The screen flickered from static to a high-definition feed. It was a kitchen. Sunlight poured through a window that, in Elias's apartment, was bricked over. The table was wood, scarred with knife marks he remembered making during a drunken night five years ago. But in this feed, the night hadn't been drunken. Or the knife had slipped differently.

  Then *he* walked in.

  Elias stopped breathing. The man on the screen wore Elias's face, though smoother, unlined by the grief that currently carved canyons into the operator's cheeks. He wore Elias's old university hoodie. He was laughing, holding a mug of coffee.

  And he was holding the mug with two hands.

  The Other Elias set the mug down. Both hands were flesh. Ten fingers. The left wrist was whole.

  "Look at him," Elias whispered, lifting his own pinned sleeve. "He's me."

  "He's a counterpart," the technician corrected gently. "Distinct spacetime region. Distinct matter. He resembles you closely, but he isn't you. If you died here, he wouldn't feel a thing."

  "But look at the wall," Elias insisted, pointing at a photograph on the screen's background. It was him and Mara. "That's my wife. That's my house. He made the choices I didn't. He didn't take the job in Chicago. He didn't get in the car that night."

  "He made *similar* choices," the technician said. "Lewis was clear. Identity is strict. You cannot be here and there. You cannot be one-handed and two-handed. That's a contradiction. So that man there? He's a stranger who looks like you."

  Elias felt a surge of violent possessiveness. If the technician was right, if Counterpart Theory held, then the happiness on that screen belonged to a stranger. It was a show put on for his benefit, a movie of a life he could have had but didn't. His regret was solitary. His loss was absolute.

  But if Kripke was right... if Transworld Identity was true... then *he* was there. He was literally standing in that kitchen. The happiness on the screen wasn't a possibility; it was a fact about *him*. He was spread across the cosmos like butter on toast, thick in one place, thin in another. The pain here was real, but it wasn't the whole story. He was also whole there.

  "Can he hear me?" Elias asked.

  "We can open an audio channel. But remember the metaphysics, Elias. If you speak, you're talking to a different person."

  "Open it."

  Elias leaned into the microphone. "Hey."

  On the screen, the Other Elias froze. He turned, looking not at the camera, but through it, a furrow in his brow that Elias knew well. It was the look he got when trying to recall a dream upon waking.

  "Did you say something?" the Other Elias asked. His voice was Elias's, but deeper, unstrained by smoking.

  "It's me," Elias said. "From... elsewhere."

  The Other Elias laughed, a nervous sound. "Elsewhere. You mean like a ghost?"

  "I mean I'm the version of you who took the Chicago job. I'm the version who got in the car."

  The Other Elias looked down at his own left hand. He flexed the fingers. "I remember the car," he said softly. "I remember swerving. But then I didn't. I woke up in the hospital, but... intact. Is that where you are? The hospital?"

  "No," Elias said. "I'm home. Alone."

  The tension in the room spiked. This was the crux. If they were the same person, split across worlds, then the memory of the crash should be shared, or at least resonant. If they were counterparts, the Other Elias was hearing a confession from a man who was essentially his twin brother from another dimension.

  "I miss her," Elias said. "Mara. Is she there?"

  The Other Elias turned. Mara walked into the frame, alive, vibrant. She kissed the Other Elias on the cheek. "Who are you talking to?"

  "No one," the Other Elias said, though he kept looking at the camera. "Just... thinking out loud."

  Elias gripped the edge of the console. "Tell her I'm sorry. Tell her I didn't mean to leave."

  The Other Elias's expression hardened. "I don't know you. You sound like me, sure. You look like me. But you're talking about a life I didn't live. You're talking about a wife I didn't lose."

  "But I *did* lose her," Elias pleaded. "And you *didn't*. Doesn't that balance out? Aren't we the same soul?"

  "We share properties," the Other Elias said, reciting something he'd perhaps read in a philosophy text years ago, or perhaps intuiting it. "We share origins. But I am here. You are there. If I cut my hand, you don't bleed. If you die... I stay."

  "That's what I'm afraid of," Elias whispered.

  The screen flickered. The machine's hum pitched up, becoming a whine.

  "Connection destabilizing," the technician warned. "The divergence is too great. The intrinsic properties are incompatible. You can't maintain the link between a whole man and a broken one."

  "Wait!" Elias shouted. "Am I you? Just tell me that. If I'm you, then I'm not alone. If I'm you, then I survive."

  The Other Elias looked at Mara, then back at the camera. There was pity in his eyes. Pity for a stranger. "You're not me," he said. "You're the guy who crashed. I'm the guy who stopped. We're just... similar."

  The screen went black.

  The hum died. The room was silent, save for the click of the cooling fans. Elias sat in the dark, his pinned sleeve resting on the console.

  If the Other Elias was right, then the man in the kitchen was a stranger. Elias's regret was his own unique burden. He could not claim that sunlight, that coffee, that touch. He was fundamentally, ontologically alone. The happiness he saw was not his potential; it was someone else's actuality.

  But as Elias stood up, he caught his reflection in the dark monitor. He saw the eyes. They were the same eyes that had just looked back with pity.

  He raised his right hand to the glass. For a second, he could have sworn he felt the warmth of a left hand meeting it from the other side, a phantom limb made real by the sheer force of will. It didn't matter if the metaphysics held. The grief was identical. The love was identical.

  "Similar," Elias said to the empty room.

  He walked out of the lab, leaving the machine humming in the dark, wondering if the man in the kitchen was now looking at his own reflection, wondering if he was the one who was truly alone.
