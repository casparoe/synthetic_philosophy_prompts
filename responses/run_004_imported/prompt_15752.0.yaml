  2.  **Deconstruct the Philosophical Concepts for Narrative:**
      *   *Transworld Identity (Kripke):* Strict identity. I am literally there. If I died there, I died. If I made a different choice, it was *me* making it. Continuity of self is absolute.
      *   *Counterpart Theory (Lewis):* Similarity-based. That person is *like* me, but not *me*. They are a distinct individual in a distinct concrete world. Their pain is not my pain, their death is not my death.
      *   *The Conflict:* If it's me, I share responsibility/ownership. If it's a counterpart, I am merely an observer of a similar life.
      *   *The Stakes:* Guilt, regret, love, loss. Let's go with regret/guilt over a specific choice. A relationship ended? A career path? A death prevented?
