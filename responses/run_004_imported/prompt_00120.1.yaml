answer: |-
  This is a magnificent dilemma, and it is no surprise that it has found you at the intersection of your two current lives: the empirical rigor of the ecologist and the conceptual scrutiny of the philosophy student. You have stumbled directly into the **Sorites Paradox** (the paradox of the heap), but you have also identified the specific tension between *ontological reality* (continuous ecological processes) and *deontic necessity* (binary legal categories).

  Your worry is that by drawing a line, you are falsifying nature. My counsel is that you are not falsifying nature; you are building a bridge between nature and human governance. The line is not a discovery; it is a tool.

  Here is a framework for your peace of mind, followed by a strategy for the board meeting.

  ### I. For Your Peace of Mind: The Philosophy of the Cutoff

  You are correct that "old-growth" is a **vague predicate**. In philosophy of language, we distinguish between the *world* (which is often continuous) and our *descriptions* of the world (which are often discrete).

  **1. Ontology vs. Operationalization**
  The ecological properties you value (structural complexity, nutrient cycling, niche availability) are indeed continuous. There is no specific second where a forest "becomes" old-growth in the way a person becomes a biological adult at conception. However, the *designation* "Old-Growth" is not a natural kind like "Water" (H₂O); it is a **social/legal kind**.
  *   **The Analogy:** Consider the voting age. Biologically and psychologically, maturity is continuous. A person does not wake up on their 18th birthday suddenly possessing more wisdom than the day before. Yet, we set a hard cutoff at 18. Is this arbitrary? Yes. Is it indefensible? No. It is justified by *administrative necessity* and *proximity to the ideal*.
  *   **The Justification:** A hard cutoff is not a claim that nature changes discontinuously. It is a claim that *our capacity to treat cases differently* must be discrete to function. To defend the line, you do not argue that 150 years is metaphysically distinct from 149. You argue that 150 is the **epistemic threshold** where we can confidently assert the ecological functions are present *without* costly case-by-case adjudication.

  **2. Cluster Concepts**
  Your board is treating "old-growth" as a classical concept (necessary and sufficient conditions: *If* Age > 150, *Then* Old-Growth). Wittgenstein would suggest it is better understood as a **cluster concept**.
  *   There is no single essential property. Instead, there is a family resemblance of traits: age, coarse woody debris (CWD), gap dynamics, species composition.
  *   A parcel can be "old-growth" if it possesses enough of these traits, even if one (age) is slightly below the ideal. This dissolves the Sorites paradox because you aren't balancing on a single razor's edge of time; you are looking at a multidimensional space.

  **3. The "False Precision" Trap**
  Your faction B colleagues believe they are defending science by adhering strictly to "150." In reality, they are defending **false precision**. In metrology (the science of measurement), a number without an uncertainty range is meaningless. If the coring method has a margin of error (say, ±5 years), then 148.7 is statistically indistinguishable from 150. To reject 148.7 while accepting 150 is not "strict science"; it is numerology.

  ### II. For the Board Meeting: A Principled Resolution

  You can break the deadlock by shifting the debate from "Is this number 150?" to "How do we operationalize vague concepts responsibly?" Here is a three-part proposal you can offer the board.

  **1. Invoke the "Measurement Uncertainty" Clause**
  Argue that a scientific standard *must* account for error margins.
  *   **The Argument:** "If our criterion is 150 years, and our measurement tool has a standard error of ±5 years, then the *effective* criterion is 145–155. To reject 148.7 is to pretend our increment cores are atomic clocks. If we are to be a science-based trust, we must respect the limits of our data."
  *   **The Precedent:** This does not open the door to "sentiment." It opens the door only to cases within the statistical confidence interval of the metric. This satisfies Faction B's desire for rule-bound decisions while accommodating the reality of the data.

  **2. Adopt a "Weighted Matrix" (The Cluster Approach)**
  Propose that age is a *proxy* for structural complexity, not the thing itself. Sometimes the proxy fails, but the reality is present.
  *   **The Proposal:** Create a scoring system.
      *   Age > 150: 5 points
      *   CWD Volume > Threshold: 3 points
      *   Gap Frequency < Threshold: 2 points
      *   *Qualification:* Total score of 8/10.
  *   **Application:** If this parcel is 148.7 years (maybe 4 points, or 5 given error margins) but has exceptional CWD and gap dynamics, it qualifies on the *totality* of evidence.
  *   **Why this works:** It acknowledges that a 140-year forest with massive snags and multi-layered canopy is more "old-growth" than a 160-year forest that is structurally simple. It aligns the designation with the *ecological reality* you care about, rather than the bureaucratic proxy.

  **3. The "Safe Harbor" Protocol**
  To assuage Faction B's fear that "bending the rule here means we have no rule," propose a formal **Borderline Policy**.
  *   **The Policy:** "Parcels falling within 5% of the age threshold may qualify IF they exceed the thresholds for CWD and Gap Frequency by at least 10%."
  *   **The Benefit:** This turns an act of "mercy" or "sentiment" into an act of "policy." It creates a new, sharper rule for borderline cases. It tells Faction B: "We are not ignoring the rule; we are adopting a more sophisticated rule that accounts for measurement error and ecological redundancy."

  ### III. Summary Advice

  When you speak at the meeting, I suggest you lean into your dual identity. You might say something like:

  > "Colleagues, we are stuck because we are treating a policy tool as if it were a law of physics. Nature does not recognize our 150-year line; it recognizes structural complexity and continuity. Our job is not to police a number, but to protect a function.
  >
  > If we reject this parcel solely on 1.3 years, we are prioritizing the *map* over the *territory*. We can protect the integrity of our standards not by rigidly enforcing a false precision, but by formally acknowledging measurement error and using a multi-criteria approach. This ensures we aren't acting on sentiment, but on a more robust scientific model."

  **The Philosophical Takeaway:**
  Do not worry that the line is arbitrary. All legal and policy lines are arbitrary (the speed limit could be 54 or 56, but it must be *something*). The justification for the line is not its precision, but its **fidelity to the purpose**. If the purpose is to protect late-successional ecological functions, and this parcel has them, then designating it as such honors the *spirit* of the science, even if it bends the *letter* of the metric.

  You are not undermining science by acknowledging uncertainty; you are practicing it.
