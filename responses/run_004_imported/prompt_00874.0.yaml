answer: |-
  This is an impressive summary for someone without a formal philosophy background. You've grasped the core mechanics of the problem and the landscape of the decision theories (CDT, EDT, FDT) much better than most people do after just a few weeks. Your "backend engineer" mental model is actually a huge asset here, because decision theory is essentially debugging logic flows in agents.

  That said, there are a few nuances where your mental model is slightly off or oversimplified. Here is the breakdown, addressing your three specific questions and poking a few holes in the summary.

  ### 1. The History: Who cooked this up?
  **Your intuition is half-right.** You suspected it might not be an EDT "gotcha," and you are correct.

  *   **The Origin:** The "Death in Damascus" case was formalized by Allan Gibbard and William Harper in their 1978 paper *"Counterfactuals and Two Kinds of Expected Utility."* They were actually **proponents of Causal Decision Theory (CDT)** trying to formalize it.
  *   **The Purpose:** It wasn't originally an EDT attack dog. It was an internal "bug report" for CDT. Gibbard and Harper wanted to show that CDT needed to account for **deliberational equilibrium**. They argued that a CDT agent shouldn't just pick an action; it should pick an action that remains optimal *given that it has picked it*.
  *   **The EDT Angle:** EDT proponents *did* later use it to highlight CDT's instability. However, EDT doesn't actually "win" cleanly here. In the standard setup, an EDT agent sees that $P(\text{Death} | \text{Aleppo}) \approx 1$ and $P(\text{Death} | \text{Damascus}) \approx 1$. It becomes indifferent and paralyzed, but at least it doesn't oscillate like the CDT agent.
  *   **Correction:** It's more accurate to say this is a **stress test for CDT** created during CDT's development, which EDT proponents later adopted as a critique. It's not an external attack; it's a known edge case that CDT struggles to handle without modification (like mixed strategies).

  ### 2. The Coin-Flip Fix and Your Objection
  **Your objection is valid and is a live issue in the literature.**

  *   **The Standard Fix (Skyrms' Equilibrium):** The standard CDT response (championed by Brian Skyrms) is indeed that the agent should adopt a **mixed strategy** (e.g., 50/50 randomization). If Death predicts the *action*, and you randomize 50/50, Death must also be at Aleppo 50% of the time and Damascus 50% of the time. Your expected utility for staying or leaving becomes equal, so the CDT agent stops oscillating. It becomes "self-ratifying."
  *   **Your Objection:** You asked: *"Surely a predictor good enough to nail your city choice could predict your coin flip too?"*
      *   **Literature Status:** This is exactly the distinction between **"Death in Damascus"** and **"Newcomb's Death in Damascus."**
      *   **Weak Predictor:** Predicts your *action* (but not your randomization generator). The coin flip works here.
      *   **Strong Predictor:** Predicts the *outcome* of your decision process, including any randomness. If you flip a coin, Death predicts the result of the flip. In this version, the mixed strategy fails, and you die regardless.
  *   **The Hole in Your Summary:** You treated the predictor's capability as a fixed constant. In the literature, the "power" of the predictor is a variable. The coin-flip fix only works if the predictor is modeled as predicting your *behavior* but not the *output of your randomization device*. If the predictor is truly "perfect" (in the Newcomb sense), the coin flip offers no escape. Your intuition here is sharper than the standard introductory explanation.

  ### 3. Functional Decision Theory (FDT): Is it just dressed-up one-boxing?
  **It is substantively different in mechanism, though it yields "one-boxing" results.**

  *   **The Mechanism:**
      *   **CDT** treats your decision as a **causal intervention** (`do(choose_Aleppo)`). It assumes your choice cannot causally affect the past (Death's location).
      *   **EDT** treats your decision as **evidence** (`P(Death | choose_Aleppo)`). It conditions on the act.
      *   **FDT** treats your decision as the **output of a computation**. It assumes Death is running a simulation of your decision algorithm. Therefore, your decision and Death's prediction are **logically correlated** (or "subjunctively dependent").
  *   **The Engineer Analogy:**
      *   **CDT:** "I will edit the return value of `make_decision()` to 'Aleppo'. This doesn't change the `death_location` variable set yesterday."
      *   **FDT:** "I am editing the source code of the `make_decision()` function. Since Death ran a copy of this source code to predict me, editing the source code changes *both* my output and Death's prediction simultaneously."
  *   **One-Sentence Summary:** FDT changes the counterfactuals from "What if I *did* X?" (causal) or "What does doing X *imply*?" (evidential) to "What if my *decision algorithm* output X?" (logical).
  *   **Is it a dodge?** No. It solves the "Newcomb's Death in Damascus" variant where the coin flip fails. Because FDT views the coin flip as part of the algorithm, if the algorithm says "flip a coin," the simulation also "flips a coin" (or rather, outputs the same result). FDT agents in Death in Damascus typically accept their fate (indifference) rather than oscillating or relying on a predictor blind spot, because they recognize they cannot logically outcompute a perfect simulation of themselves.

  ### Summary of Holes to Patch in Your Notes

  1.  **Origin Story:** Update your notes to reflect that Gibbard & Harper were CDT proponents debugging their own theory, not EDT agents throwing grenades.
  2.  **Predictor Strength:** Distinguish between a predictor who predicts your *action* (coin flip works) vs. one who predicts your *algorithm/output* (coin flip fails). Your objection is the key to the harder version of the problem.
  3.  **FDT Mechanism:** Don't think of FDT as "one-boxing." Think of it as **"decision algorithms are shared source code."** That explains *why* it one-boxes in Newcomb and accepts fate in Death in Damascus without oscillating.

  ### Final Verdict
  Your mental model is **85% sound**. You correctly identified the instability of CDT, the role of mixed strategies, and the skepticism regarding predictor limits. The missing 15% is mostly historical context and the specific technical distinction regarding *what* exactly is being predicted (action vs. algorithm output).

  For a backend engineer, the FDT explanation usually clicks hardest: **CDT assumes you can fork the process and change the return value without affecting the database. FDT assumes the database was populated by running the same binary you are currently executing.**

  You're ready to talk about this at a meetup without embarrassing yourself. Just be prepared for the CDT defenders to argue that "logical counterfactuals" are metaphysically spooky (which is the main philosophical counter-argument to FDT).
