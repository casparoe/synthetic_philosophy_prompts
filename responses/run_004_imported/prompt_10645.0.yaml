prompt: |-
  Ok this might be a weird thing to be hung up on but I've been messing around with Lean for a dumb hobby project and fell down a rabbit hole on Godel's second incompleteness theorem -- the fact that no consistent theory strong enough to do arithmetic (PA, ZFC, whatever) can ever prove its own consistency. So our whole confidence that the axioms arent secretly inconsistent really just comes down to like a century of nobody stumbling on a contradiction, plus relative consistency proofs that just kick the question up a level (Gentzen showing Con(PA) via transfinite induction up to epsilon-nought, ZFC's consistency following if you assume an inaccessible cardinal exists, etc). This has been bugging me all week bc i always treated "formally proven" as basically the ceiling of certainty. Can you lay out the most important implications of actually taking a small-but-nonzero credence in "the axioms are inconsistent" seriously -- both for how much I should trust any individual formally verified proof day to day, and for people who want to lean on formal verification as an actual safety guarantee for AI systems?
