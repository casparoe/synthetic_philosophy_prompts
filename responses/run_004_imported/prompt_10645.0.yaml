      *   *Consistency vs. Soundness:* Consistency means no contradiction ($\bot$). Soundness means everything provable is true (in the intended model). Inconsistency implies unsoundness, but soundness implies consistency.
      *   *Explosion Principle:* In classical logic, from a contradiction, anything follows ($\bot \to \phi$).
      *   *Local vs. Global:* An inconsistency in ZFC doesn't necessarily mean *every* proof is wrong, just that the system is broken. However, finding *where* the contradiction lies is hard.
      *   *Practical Reality:* Mathematicians have been using ZFC/PA for 100+ years without finding a contradiction. The "risk" is extremely low, arguably lower than hardware errors or bugs in the proof checker itself.

  3.  **Address Question 1: Implications of Non-Zero Credence in Inconsistency:**
      *   *Philosophical:* Absolute certainty is impossible (Descartes' demon, brain in a vat, etc.). G2 just adds a logical layer to this.
      *   *Practical:* It shifts "certainty" from "logical necessity" to "empirical robustness."
      *   *Risk Assessment:* If ZFC is inconsistent, there exists a proof of $\bot$. But it might be astronomically long. Most "normal" math lives in a "safe fragment" far away from the paradoxes (like Russell's or Berry's).

  4.  **Address Question 2: Trust in Individual Formally Verified Proofs:**
      *   *The Stack:* Lean proof $\to$ Kernel $\to$ OS $\to$ Hardware.
