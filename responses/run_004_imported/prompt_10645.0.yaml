      *   **Realization:** Formal systems strong enough for arithmetic (like ZFC or PA, which underpin Lean's logic) cannot prove their own consistency. Confidence rests on empirical evidence (no contradictions found yet) and relative consistency proofs (which rely on stronger assumptions).
