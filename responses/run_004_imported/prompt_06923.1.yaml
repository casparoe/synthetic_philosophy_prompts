prompt: |-
  I'm running a graduate seminar on laws of nature this term, and this week we finally worked backwards from all the contemporary "Humean vs. anti-Humean" stuff (Lewis's Best System Analysis, Armstrong/Dretske/Tooley on necessitation, dispositional essentialism, etc.) to the actual Hume text that the label comes from, instead of just gesturing at "regularity theory" the way the textbooks do. My TA and I ended up arguing about the passage below yesterday and I want another set of eyes on it before Thursday's class. Its from Section VII of the first Enquiry, right near the end, just before he moves on to liberty and necessity:

  "Similar objects are always conjoined with similar. Of this we have experience. Suitably to this experience, therefore, we may define a cause to be an object followed by another, and where all the objects, similar to the first, are followed by objects similar to the second. Or, in other words, where, if the first object had not been, the second never had existed. The appearance of a cause always conveys the mind, by a customary transition, to the idea of the effect. Of this also we have experience. We may, therefore, suitably to this experience, form another definition of cause, and call it an object followed by another, and whose appearance always conveys the thought to that other. But though both these definitions be drawn from circumstances foreign to the cause, we cannot remedy this inconvenience, or attain a more perfect definition, which may point out that circumstance in the cause which gives it a connexion with its effect. We have no idea of this connexion, nor even any distinct notion what it is we desire to know, when we endeavour at a conception of it."

  Here's what's bugging me. Those two definitions don't have to pick out the same cases: you can imagine a brute regularity nobody's mind has ever tracked (no "customary transition" involved), and you can imagine a mind forming that habitual transition off a run of coincidences that isnt a real regularity at all. So they can come apart pretty easily. And Hume himself seems to admit the whole exercise is a bit of a bust, since both definitions are "foreign to the cause" and leave us with "no idea of this connexion." Given that, I'm no longer sure this passage actually licenses the standard textbook move of crowning Hume the founding father of the regularity theory of laws - it almost reads like neither definition is supposed to capture what we're really after, which sounds closer to the "New Hume" sceptical-realist line (Strawson, Kail) than to the tidier regularity-theorist Hume you get in Mackie or in a lot of the laws-of-nature literature. Could you help me untangle this a bit? Specifically: is the gap between the two definitions an actual problem for reading Hume as a regularity theorist, or is there a standard way of dissolving it that I'm forgetting, and does the "foreign to the cause"/"no idea of this connexion" bit really support the sceptical-realist reading, or am I over-reading two throwaway lines?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A philosophy professor (or instructor) running a graduate seminar on laws of nature.
      *   **Context:** They are teaching the Humean vs. Anti-Humean debate (Lewis, Armstrong, etc.) and have gone back to the source text (Hume's *Enquiry Concerning Human Understanding*, Section VII).
      *   **Problem:** The TA and the professor are arguing about a specific passage containing Hume's two definitions of cause.
      *   **Specific Concerns:**
          1.  The two definitions seem extensionally divergent (regularities without minds vs. psychological habits without regularities).
          2.  Hume admits both definitions are "foreign to the cause" and we have "no idea of this connexion."
          3.  Does this undermine the standard "Regularity Theory" reading (Mackie, Lewis) and support the "New Hume" skeptical-realist reading (Strawson, Kail)?
      *   **Goal:** Untangle the interpretive issues, address the gap between definitions, and evaluate the "New Hume" vs. "Old Hume" debate in this specific context.

  2.  **Deconstruct the Passage:**
      *   *Definition 1 (Regularity):* "an object followed by another, and where all the objects, similar to the first, are followed by objects similar to the second." (Plus the counterfactual gloss: "if the first object had not been, the second never had existed.")
      *   *Definition 2 (Psychological):* "an object followed by another, and whose appearance always conveys the thought to that other."
      *   *The Caveat:* Both are "drawn from circumstances foreign to the cause." We have "no idea of this connexion."

  3.  **Address Concern 1: The Gap Between Definitions (Extensional Divergence):**
      *   *The Objection:* Def 1 allows unobserved regularities. Def 2 requires a mind. They don't pick out the same extensions.
      *   *Standard "Old Hume" Response:* Hume isn't giving a metaphysical analysis of causation *in the world*; he's giving a genealogy of the *idea* of cause. The two definitions reflect the two ingredients necessary for the *idea* to arise: external constant conjunction + internal determination of the mind.
      *   *The "Ideal Observer" Move:* Many interpreters argue Def 2 implies an idealized observer or a disposition of the mind, not necessarily an actual occurring thought.
      *   *The "Projectivism" Move:* The regularity is out there; the necessity is projected. Def 1 describes the input, Def 2 describes the output (the feeling of necessity). They aren't competing truth-conditions for "X causes Y" in a realist sense; they are descriptions of the phenomenology and the external trigger.
      *   *Graduate Level Nuance:* Acknowledge the tension. It *is* a problem if you treat Hume as offering a reductive analysis of causation akin to a modern truth-conditional semantics. But if you treat him as offering a naturalistic explanation of the *origin* of the idea, the tension dissolves.

  4.  **Address Concern 2: "Foreign to the Cause" & "No Idea of Connexion" (New Hume vs. Old Hume):**
      *   *The "Old Hume" (Regularity/Reductive) Reading:* Hume is saying there *is* no necessary connection in the objects. The "connexion" we desire is a chimera. The definitions are the *best we can do*. The "inconvenience" is epistemic/semantic, not ontological. There is nothing missing in the world.
      *   *The "New Hume" (Skeptical Realist) Reading:* Hume is agnostic about whether there is a real connection. We can't *know* it or *conceive* it, but it might exist. The definitions are inadequate because they miss the real essence.
      *   *Evaluation:* The "New Hume" reading has lost some steam in recent years (post-2000s). Most Hume scholars lean back toward a projectivist/reductive reading for the *Enquiry*. The phrase "no idea of this connexion" is key. For Hume, *no idea* usually means *no meaningful content*. If we have no idea, positing the existence of the thing is empty.
      *   *Textual Evidence:* The *Enquiry* is generally more deflationary than the *Treatise*. The "foreign to the cause" line suggests the definitions capture all the *meaningful* content we have. The "inconvenience" is that we *want* more (a glimpse into the secret springs of nature), but that desire is unsatisfiable.
      *   *Relevance to Laws of Nature:* The Lewisian Humean Supervenience reading relies on the "Old Hume." If the "New Hume" is right, Lewis's project is built on sand. However, even if Hume was a skeptical realist, the *Humean* tradition in metaphysics (Lewis, etc.) is defined by the *structure* of the view (no necessary connections), regardless of whether Hume himself held it strictly. But for the seminar, the textual accuracy matters.

  5.  **Synthesize the Argument for the Seminar:**
      *   *Point 1: The Two Definitions.* Don't treat them as competing analyses. Treat them as two sides of the same coin (impression of reflection vs. impression of sensation). The divergence is only a problem if you think Hume is doing modern analytic metaphysics. He's doing cognitive science/naturalism.
      *   *Point 2: The "Foreign" Remark.* This supports the Regularity reading more than the Skeptical Realist one. Why? Because he says we *cannot remedy this inconvenience.* If there were a real connection we just couldn't see, he might leave the door open. But he says we have *no idea* what we are desiring. This implies the desire itself is based on a confusion.
      *   *Point 3: The Counterfactual.* Note the counterfactual in Def 1 ("if the first object had not been..."). This is often ignored. It shows Hume knows regularity isn't just $A \land B$. It involves support for counterfactuals, which bridges the gap to Def 2 (the mind's expectation).
      *   *Point 4: Pedagogical Advice.* How to handle this in class? Use the tension to show *why* the contemporary debate exists. Lewis tries to fix Def 1 (Best System). Armstrong tries to fix the "connexion" (Necessitation). Dispositionalists try to fix the "foreign" problem (intrinsic powers). Hume is the starting gun, not the finish line.

  6.  **Refine the Tone:**
      *   Needs to be collegial, respectful of the user's expertise (graduate seminar leader), but precise.
      *   Avoid taking a hard dogmatic stance, but weigh the scholarly consensus.
      *   Highlight the distinction between *Enquiry* and *Treatise* (the *Enquiry* is usually seen as more deflationary).
      *   Mention key secondary literature (Beebee, Norton, Strawson, Winkler).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Validate the TA's observation. It's a classic puzzle.
      *   *Section 1: The Two Definitions.* Explain the "Input/Output" model. Def 1 = Public/Observable. Def 2 = Private/Psychological. They aren't meant to be extensionally equivalent in a vacuum; they are equivalent *for us* as human observers.
      *   *Section 2: The "Foreign" Comment & New Hume.* Address the Skeptical Realist claim. Argue that "no idea" is the killer for SR in the *Enquiry*. If I have no idea, I can't assert existence. The "inconvenience" is our psychological longing, not an ontological gap.
      *   *Section 3: Relevance to Laws.* Connect back to Lewis/Armstrong. Lewis takes Def 1 and tries to make it stand alone. Armstrong tries to recover the "connexion." Hume says you can't.
      *   *Conclusion:* Recommendation for Thursday's class.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, did Hume say counterfactuals?* Yes, "if the first object had not been..." This is crucial. It shows Def 1 isn't just material implication. It captures the *inferential* role, which links to Def 2.
      *   *Is the "New Hume" dead?* Not dead, but less dominant than in the 90s. Peter Millican and Don Garrett are good references for the standard view. Galen Strawson is the main SR proponent.
      *   *Make sure not to conflate Hume's view with Lewis's view.* Lewis is a *Humean*, but Hume might not be a *Lewisian*. The seminar is about laws, so this distinction is vital.

  9.  **Final Polish:** Ensure clear headings and actionable advice for the seminar. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a fantastic moment in a seminar. You have hit on precisely the textual nerve that animates the entire contemporary metaphysics of laws debate. Your TA is right to press you on the extensional divergence of the two definitions, and you are right to worry that the "foreign to the cause" remark complicates the standard "Regularity Theory" label.

  Here is a breakdown of how to untangle this for Thursday, distinguishing between the interpretive debate (Old vs. New Hume) and the metaphysical payoff (Humean Supervenience).

  ### 1. The Gap Between the Two Definitions
  Your TA's objection is the standard one: Definition 1 (Regularity + Counterfactual) allows for unobserved regularities (e.g., laws holding before minds existed). Definition 2 (Psychological Determination) requires a mind. If causation requires a mind, there were no causes in the pre-human universe. If causation doesn't require a mind, Definition 2 is wrong.

  **The Standard Dissolution (The "Old Hume" / Projectivist Line):**
  The most robust way to handle this in a graduate setting is to argue that Hume is not offering two competing *truth-conditions* for causal statements, but rather a **genealogy of the idea**.

  *   **Definition 1** describes the *objective input* (the constant conjunction in the objects).
  *   **Definition 2** describes the *subjective output* (the determination of the mind, the feeling of necessity).

  For Hume, "Causation" is a hybrid concept. It refers to the external regularity *plus* the internal projection of necessity. As Helen Beebee and other contemporary Humeans often clarify: Hume isn't saying the necessity is *in* the world (Def 1), nor is he saying the regularity is *in* the mind (Def 2). He is saying our *concept* of cause is constituted by the regularity triggering the psychological habit.

  **The Counterfactual Clue:**
  Notice the gloss on Definition 1: *"where, if the first object had not been, the second never had existed."*
  This is often overlooked. Hume knows mere material implication ($\forall x (Fx \rightarrow Gx)$) isn't enough. By including the counterfactual, he is acknowledging that causation supports inference. This bridges the gap to Definition 2. The "customary transition" *is* the psychological counterpart to the counterfactual support. They aren't diverging extensions; they are the external and internal faces of the same inferential practice.

  **Seminar Tip:** Ask your students: "Is Hume defining *causation in the world* or the *idea of causation*?" If it's the latter, the divergence dissolves. The idea requires both the regularity (to trigger it) and the mind (to host it).

  ### 2. "Foreign to the Cause" and the "New Hume"
  This is the crux of your worry. Does Hume's admission that these definitions are "foreign to the cause" and that we have "no idea of this connexion" support the Skeptical Realist reading (Strawson, Kail)?

  **The Skeptical Realist (SR) Reading:**
  SRs argue Hume is agnostic. He says we can't *know* the connection, but he leaves open the possibility that a real, thick, necessary connection exists in the objects, inaccessible to us. On this reading, the definitions are "inconvenient" because they fail to capture the real essence.

  **The Reductive/Projectivist (Old Hume) Reading:**
  The dominant view (Norton, Millican, Garrett) is that "no idea" is a semantic/epistemic kill-switch. For Hume, if you have no impression, you have no idea. If you have no idea, you cannot meaningfully assert the existence of the thing.
  When Hume says we "cannot remedy this inconvenience," he isn't lamenting a limit of human knowledge (as if better microscopes might find the connexion). He is saying the *desire* for that connexion is based on a confusion. We *think* we want a glimpse of the "secret springs," but since we have no idea what that would look like, the desire is empty.

  **Why the Text Favors the Regularity Reading here:**
  Look at the phrasing: *"nor even any distinct notion what it is we desire to know."*
  If Hume were a Skeptical Realist, he would say, "We desire to know the *real essence*, though we cannot." Instead, he says we don't even know *what* we are desiring. This suggests the "connexion" is a philosophical fiction generated by the mind's habit (Def 2) being misprojected onto the world (Def 1).

  **Seminar Tip:** The "New Hume" reading has lost significant traction in the last 15 years, particularly regarding the *Enquiry*. The *Enquiry* is generally read as more deflationary than the *Treatise*. You can tell your class: "If the Skeptical Realist reading were true, Lewis's Best System Analysis would be trying to solve a problem Hume didn't have. But Lewis reads Hume as saying there *is* nothing else. The text supports Lewis here: the 'inconvenience' is our psychological craving, not an ontological gap."

  ### 3. Licensing the "Regularity Theory" Label
  Does this passage license calling Hume the father of the Regularity Theory of Laws?

  **Yes, but with a caveat.**
  Hume is the father of the view that **necessity is not observed.**
  *   **Armstrong/Dretske/Tooley:** They agree with Hume that we don't *observe* necessitation. They disagree that necessitation is therefore absent. They posit it as a theoretical entity (a universal relation) to explain the regularity.
  *   **Lewis:** He agrees with Hume that there is no necessitation in the world. He tries to salvage Def 1 (Regularity) by making it systematic (Best System) to handle the counterfactuals and unobserved cases.
  *   **Dispositionalists:** They try to recover the "connexion" Hume says is "foreign" by locating it in intrinsic powers.

  **The Verdict:**
  The passage *does* support the Regularity Theory reading, provided you understand "Regularity Theory" as the claim that **there is no more to causation in the objects than regularity.**
  The fact that Hume offers *two* definitions doesn't undermine this; it reinforces it. Definition 1 is what is in the world (regularity). Definition 2 is what we add (necessity). The "Regularity Theory of Laws" is essentially the claim that laws of nature should be analyzed using *only* the resources of Definition 1, stripping away the psychological projection of Definition 2.

  ### Suggested Strategy for Thursday
  1.  **Validate the TA:** Start by conceding that the two definitions are extensionally divergent if taken as modern truth-conditional analyses. This shows the students that Hume isn't doing Lewisian metaphysics.
  2.  **Reframe the Project:** Argue that Hume is doing **naturalistic psychology**. He is explaining how the *concept* arises. Def 1 is the trigger; Def 2 is the mechanism.
  3.  **Deflate the "New Hume":** Use the "no distinct notion" line to argue that Hume isn't agnostic about the existence of necessary connections; he is eliminativist. We project the feeling of determination onto the world.
  4.  **Connect to Contemporary Debate:**
      *   **Lewis** tries to make Def 1 stand on its own (without the mind).
      *   **Armstrong** tries to recover the "connexion" Hume says we have no idea of (by positing N).
      *   **Hume's Point:** Both are trying to remedy an "inconvenience" that cannot be remedied. Lewis succeeds in making it Humean; Armstrong rejects Hume's starting point.

  **Bottom Line:** You are safe teaching Hume as the progenitor of the Regularity view, provided you clarify that for Hume, "Regularity" isn't just a pattern; it's the *only* objective content the concept has. The rest is us. The "gap" your TA found is the space where contemporary metaphysics lives (trying to close it or explain it away), but it doesn't invalidate Hume's core claim that we observe no necessity.
