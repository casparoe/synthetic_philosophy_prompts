answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I'm generally known in this family as "the writer," though for the last few weeks, I've mostly been known on the internet as "that unhinged guy who can't park."

  It has been… an educational month. And standing here tonight, looking at a room full of people who actually know me, I've been thinking a lot about the difference between the people in this room and the thousands of strangers who felt qualified to judge me from behind a screen.

  It turns out, I'm not the first person to figure out that there's a massive difference between "The Public" and actual people. Apparently, a philosopher in 1846 figured that out. But I'm not going to talk about him, because I'm not here to give a lecture. I'm here to talk about my Aunt Marilyn.

  Because while I was learning that lesson the hard way over a parking spot, I realized that Marilyn has been teaching it for forty-one years.

  Some of the newsroom folks in here have heard Marilyn say this to terrified interns more times than you can count. She'd tell them: *"Stop writing for 'The Public.' The Public is a phantom. It doesn't exist. Write for the one actual reader sitting at the kitchen table who needs to understand what you're saying."*

  For a long time, I thought that was just a cute editing trick. A way to keep headlines from getting too flowery. But after the last few weeks, I realize it wasn't just a professional standard. It was a moral one.

  "The Public" is abstract. "The Public" can be cruel. "The Public" is a crowd that lets you shout without ever having to look someone in the eye. But a *reader*? A reader is a person. A source is a person. A neighbor is a person.

  Marilyn, for four decades, you refused to chase the phantom. You didn't write for the noise. You wrote for the person. You treated every story like it mattered to a specific human being, because it did. When you edited a piece, you weren't trying to win an argument with the world; you were trying to tell the truth to a neighbor.

  I saw you do this with family, too. When I was a kid, and I told you something I thought was important, you didn't give me a generic "that's nice." You listened like I was the only person in the room. You made me feel real. That is a rare gift. In a world that increasingly wants us to perform for a crowd, you taught us how to connect with individuals.

  I know the industry has changed. The paper went online, the newsroom got smaller, and the noise got louder. It would be easy to be cynical about that. But looking at you, I don't see cynicism. I see consistency. You kept your focus on the one reader, even when the business model was screaming at you to chase a million clicks.

  So, as you head into retirement, my wish for you is simple. I hope your days are filled with fewer phantoms and more real people. Less scrolling, more sitting. Less shouting into the void, and more conversations at the kitchen table—the very place you told all those interns to imagine.

  Thank you for showing me, and all of us, that the only thing that's ever truly real is the person right in front of you.

  To Marilyn.
