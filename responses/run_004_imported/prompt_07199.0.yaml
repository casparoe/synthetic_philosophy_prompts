          *   The "Kingdom of Ends" (Can animals be members?)
          *   Metaphysical baggage (Do we need to change Kant's metaphysics to make this work?)

      *   *Let's select the strongest 3 to add:*
          1.  Conflict/Trade-offs (Practical application).
          2.  Kingdom of Ends (Systematic fit).
          3.  Moral Motivation/Psychology (Kant's moral psychology is strict).

      *   *Wait, I need to make sure I hit the 8-10 count.*
