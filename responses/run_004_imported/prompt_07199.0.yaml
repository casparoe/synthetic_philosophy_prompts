      *   9. Falsifiability (Closing).
      *   *That's 9.* I can split one or add one on "Indirect Duty benefits." Let's add one on whether the Indirect Duty view actually *protects* animals better (pragmatic argument). That makes 10.

  6.  **Finalizing Follow-ups:** Ensure they are punchy and anticipate the "Korsgaardian retreat."
      *   *Slide Follow-up:* Anticipate "Consciousness/Valuing." Counter: "Is valuing a normative fact or a psychological one?"
      *   *Singer Follow-up:* Anticipate "Respect vs. Welfare." Counter: "What is the behavioral difference?"
