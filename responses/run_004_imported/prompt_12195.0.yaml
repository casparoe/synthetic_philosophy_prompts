answer: |-
  Here are opening remarks tailored to your situation. They are designed to be spoken at a moderate pace, which should land you right around the five-minute mark. I've included some stage directions in brackets to help with your delivery.

  ***

  **Opening Remarks for Philosophy Club Workshop**

  **Speaker:** Club President
  **Time:** Approx. 5 Minutes
  **Audience:** Mixed (Newcomers, Club Regulars, Guest Professor)

  Good afternoon, everyone. Thank you so much for coming.

  For those of you visiting us for the first time, welcome to the [High School Name] Philosophy Club. I started this group last year because I wanted a space where we could ask the big questions without worrying about having the "right" answer. Looking around the room, I see a mix of faces—some of you are club regulars, and many of you are here just because the topic caught your eye. That is exactly who we want here. Whether you've read hundreds of pages of metaphysics or zero, you belong in this conversation.

  I also want to extend a special thank you to our faculty advisor, [Advisor Name], for supporting us, and to give a massive welcome to our guest speaker, Professor [Professor's Last Name] from [University Name]. Professor, thank you for traveling here to spend your Saturday with a bunch of high schoolers. We are incredibly lucky to have you.

  Today's topic is something we all feel like we understand intuitively: Free Will and Moral Responsibility.

  Most of us operate on a simple assumption about blame and praise. We assume that to be truly responsible for an action, you must have been able to do otherwise. If I push you, and you knock over a vase, we don't blame you, because you *couldn't* have done otherwise. But if you chose to knock it over, and you could have chosen to leave it alone, then you're responsible. In philosophy, we call this the **Principle of Alternate Possibilities**, or PAP. It sounds obvious, right? No freedom to choose differently, no responsibility.

  But in 1969, a philosopher named Harry Frankfurt wrote a paper that shook this assumption up. And for the next few minutes, I want to walk you through his famous challenge, so we're all on the same page before Professor [Name] takes the mic.

  Frankfurt asks us to imagine a scenario. Let's call the agent **Jones**. Jones is deciding whether to vote for Candidate A or Candidate B. He thinks it over, and on his own, freely decides to vote for Candidate A.

  But here is the twist: There is a man named **Black**. Black wants Jones to vote for Candidate A. Black is a neurosurgeon who has implanted a device in Jones's brain. This device allows Black to monitor Jones's decision-making. If Jones shows any sign of choosing Candidate B, Black will press a button, intervene, and force Jones to vote for Candidate A.

  However, Jones chooses Candidate A on his own. Black sees this, smiles, and never touches the button. Black never interferes. The decision is entirely Jones's.

  Now, Frankfurt asks: Is Jones morally responsible for his vote?

  Our intuition says **yes**. Jones did exactly what he wanted. Black was irrelevant to the actual outcome. But, because of Black's presence, Jones *could not* have done otherwise. If he had tried to vote B, Black would have forced him to vote A. So, Jones is responsible, even though he lacked alternate possibilities.

  Frankfurt's conclusion is bold: The Principle of Alternate Possibilities is false. You can be responsible even if you couldn't have done otherwise.

  Now, I want to be careful here, because this is where it's easy to get tangled up. Some people hear this and think, "Aha! So Frankfurt proves that determinism is true," or "This solves the debate between free will and fate."

  It doesn't. And this is a crucial distinction. Frankfurt cases aren't trying to prove that determinism is true or false. They are designed to be neutral on that. Their only target is the link between *responsibility* and *alternate possibilities*. Frankfurt is arguing that even if you have free will, the definition of that freedom might not require the ability to do otherwise.

  Of course, philosophy is rarely settled by a single thought experiment. Since 1969, philosophers have pushed back. Some argue that in Frankfurt's scenario, there are still tiny "flickers" of freedom left that save the principle. Others argue about whether Black's presence changes the nature of Jones's choice in ways we aren't seeing.

  There is a lot more complexity under the hood, and I certainly don't want to steal the professor's thunder by diving into the objections myself. That is exactly why we are here.

  We have a room full of curious minds, a few club members who have dug into the objections, and most importantly, we have an expert who can guide us through the nuances of where Frankfurt succeeded and where he might have failed.

  So, without further ado, please join me in welcoming Professor [Professor's Last Name].

  [Lead applause, gesture to the professor, and take your seat.]
