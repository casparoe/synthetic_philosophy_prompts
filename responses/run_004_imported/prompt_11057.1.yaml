answer: |-
  This is a fantastic rabbit hole to fall down. Honestly, your history project fiasco is basically a real-life "intuition pump"—which is what philosophers call a thought experiment designed to trigger a specific judgment. You have intuitively grasped the central tension in the philosophy of social action: **Is social reality just a bunch of individuals coordinating (Bratman), or is there something irreducibly social happening that binds us together (Gilbert)?**

  You've summarized the core positions accurately. Let's get into the weeds on how they handle that specific feeling of being wronged, because that is the battleground where these two theories fight the hardest.

  ### 1. Bratman: The Architect of Interlocking Minds

  Michael Bratman is a reductionist. He wants to explain "We intend to J" without positing any magical group minds. For Bratman, shared intention is a structure of **interlocking individual intentions**.

  For us to have a shared intention to do your history project, three main things need to happen:
  1.  **I intend that we do the project.**
  2.  **You intend that we do the project.**
  3.  **Common Knowledge:** We both know 1 and 2 are true.
  4.  **Meshing Subplans:** My plan for doing the project doesn't conflict with yours (e.g., I plan to write the intro, you plan to write the intro—that's a clash. I write intro, you do slides—that meshes).

  **Where does the obligation come from for Bratman?**
  Bratman tries to derive obligation from **individual rationality**.
  If I intend that *we* do the project, rationality demands I do my part (means-end coherence). If I know you intend that *we* do it, I rely on you.
  If you flake, Bratman argues you are being *irrational*. You had an intention ("We do this"), and you abandoned it without adjusting your conduct or notifying me, violating your own planning agency.

  **The Problem: Disappointment vs. Entitlement**
  Here is where your history project comes in. Under Bratman's view, if your groupmate flakes, they have violated the norms of *their own* rationality. You are justified in being **disappointed** because your reliance was misplaced.
  But are you justified in **rebuking** them? Do you have the *standing* to say, "You can't just quit, you owe me"?

  Critics (including Gilbert) say Bratman can't earn this. In Bratman's world, intentions are revocable. I can change my mind. If I change my mind, I no longer intend that we do the project. Sure, I might be irrational or unreliable, but I haven't violated a duty *to you*. I've just updated my internal mental state.
  Bratman tries to patch this by adding that we have a duty to notify the other person if we withdraw, to protect their reliance. But Gilbert argues this is still too weak. It makes the obligation look like a side-effect of individual planning, rather than the core glue of the group.

  **Verdict on Bratman:** He explains *coordination* beautifully. He explains how we avoid stepping on each other's toes. But he struggles to explain the **normative bond**. He explains why you are *sad* the project failed, but not necessarily why you are *mad* at the kid.

  ### 2. Gilbert: The Plural Subject and the Joint Commitment

  Margaret Gilbert thinks Bratman is missing the "social" in social action. She argues that when we agree to do something together, we form a **Plural Subject**. This isn't a mystical hive mind, but a new ontological category: a "We" that is the subject of the commitment.

  **The Joint Commitment**
  For Gilbert, a shared intention isn't just "I intend + You intend." It is a **Joint Commitment**.
  This is formed when we mutually express willingness to be jointly committed to doing X as a body.
  Once that commitment is in place, it creates **obligations and entitlements** directly.
  *   **Obligation:** You are obligated to me to do your part.
  *   **Entitlement:** I am entitled to demand you do your part.

  **Why this fits your feeling of being wronged**
  Gilbert's theory is built specifically to explain the "right to rebuke."
  In her view, you cannot unilaterally withdraw from a joint commitment. Just as you can't unilaterally break a promise without wronging the promisee, you can't unilaterally abandon a joint project without wronging the co-committed party.
  Even if you never signed a contract or said "I promise," the mere act of establishing the joint commitment (e.g., "Okay, let's do this project together") creates a binding normative tie.

  When your groupmate flaked, under Gilbert's view, they didn't just change their mind (Bratman); they violated a commitment *they made to you*. They breached the "plural subject." That is why you feel you have the standing to be angry. You aren't just an observer of their irrationality; you are a party to a broken agreement.

  **The "Spookiness" Objection**
  You asked if this is too strong or "spooky."
  Philosophers call this **ontological inflation**. Bratman is parsimonious (Occam's Razor): he only uses individuals and their minds. Gilbert posits "plural subjects" and "joint commitments" as real things that exist over and above the individuals.
  Is it spooky that saying "I'm willing" creates a binding obligation without a formal promise? Gilbert says no. She argues that social reality *is* made of these invisible normative ties. If you remove them, you don't have a society anymore; you just have a crowd of people bumping into each other.
  However, the cost is high. It implies that by merely nodding along in a group setting, you might have bound yourself in ways you didn't consciously realize, creating obligations that feel heavy.

  ### 3. The Showdown: Who Explains the "Wrong"?

  To answer your specific question: **Gilbert does a much better job explaining the feeling of being wronged.**

  Here is the technical breakdown of why Bratman struggles and Gilbert succeeds here:

  **1. The Direction of the Obligation**
  *   **Bratman:** The obligation is roughly vertical. I owe it to *myself* (my rationality) to be consistent. My obligation to *you* is derivative (I shouldn't mess up your plans).
  *   **Gilbert:** The obligation is horizontal. I owe it *to you*. The commitment is inherently relational.
  *   **Your Experience:** You didn't feel "Man, he's being inconsistent with himself." You felt "He screwed *me* over." Gilbert matches the phenomenology of the emotion better.

  **2. Unilateral Withdrawal**
  *   **Bratman:** I can change my intention whenever I want. I just need to manage the fallout.
  *   **Gilbert:** I *cannot* unilaterally withdraw. The commitment belongs to the "Us," so only the "Us" can dissolve it.
  *   **Your Experience:** The anger comes from the fact that he acted like he could quit on his own. Gilbert explains why that feels illegitimate. Bratman has to argue it's just imprudent or rude, but not necessarily a violation of a right.

  **3. Does Bratman secretly borrow from Gilbert?**
  This is a huge debate in the literature. Many argue that for Bratman's "meshing subplans" to work stable over time, there *must* be a background assumption of mutual obligation that Bratman isn't admitting.
  If I know you can quit whenever you want without violating a duty to me, my "reliance" on you would be much weaker. The fact that we *do* rely on each other so heavily suggests we tacitly assume a Gilbert-style joint commitment is in place. So, yes, many critics argue Bratman's theory only works in the real world because we act *as if* Gilbert is right.

  ### 4. Is Gilbert Too Strong?

  You asked if it's weird that a "promise-less" expression creates real obligation.
  Gilbert would say: **Promises are just a special, formal case of joint commitment.**
  When you and your groupmate said, "Okay, I'll do the research, you do the slides," you didn't need to say "I promise." The mutual expression of willingness to pursue the goal *as a body* was enough to create the bond.
  Is this dangerous? Maybe. It means we are bound to more things than we think. But Gilbert argues this is the price of admission for social life. If we didn't have these automatic obligations, cooperation would be impossible because we'd spend all our time negotiating formal contracts for every little thing (like walking down the street together).

  ### The Verdict for Your History Project

  If you want to understand **how the coordination happened** (how you knew not to both write the intro), **Bratman** is the better tool. His "meshing subplans" explains the mechanics of the collaboration.

  But if you want to understand **why you feel betrayed** and why you think the kid was *morally* in the wrong (not just inefficient), **Gilbert** is the winner.
  *   **Bratman** says the kid was irrational and unreliable.
  *   **Gilbert** says the kid was a defector who breached a joint commitment.

  Your intuition that you had the right to be angry—that he couldn't just treat his part as "his own thing"—is pure Gilbert. Bratman's individualist picture ultimately treats the group as a fiction. Gilbert treats the group bond as a real normative force.

  **One final technical note:**
  There is a middle ground gaining traction called **"We-Mode" vs. "I-Mode"** (championed by Raimo Tuomela).
  *   **Bratman** is strictly **I-Mode**: I intend that we do X.
  *   **Gilbert** is strictly **We-Mode**: We intend to do X (and the "We" is the agent).
  Some philosophers argue you need both. You need Bratman for casual stuff (walking together) and Gilbert for serious stuff (projects, marriages, governments).

  So, in your fiasco: You were operating in **We-Mode** (expecting a joint commitment), and your groupmate was operating in **I-Mode** (thinking he could just drop his individual intention). The clash wasn't just logistical; it was ontological. You were playing a team sport; he was playing single-player. Gilbert gives you the vocabulary to tell him he was playing the wrong game.
