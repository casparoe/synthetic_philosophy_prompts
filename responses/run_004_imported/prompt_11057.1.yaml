          *   *Gilbert:* The obligation is inherent. You have the *standing* to rebuke. This matches the user's feeling of "You can't just quit without talking to me."
      *   **The "Spookiness" Objection:** Address the metaphysical cost. Bratman is parsimonious (Occam's Razor). Gilbert is ontologically heavier. Is it worth it?
      *   **Synthesis/Verdict:** For the specific feeling of *obligation* and *betrayal*, Gilbert wins. For explaining how we just walk together down the street without a formal pact, Bratman wins.
