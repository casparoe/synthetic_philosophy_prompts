      3.  Problem Definition (Interpretive Divergence).
      4.  Critique of existing options (False Balance vs. Opaque Authority).
      5.  Proposed Policy: "The Burden of Certainty."
      6.  The 3-Step Test for Editors.
      7.  Closing.

