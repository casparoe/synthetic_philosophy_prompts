prompt: |-
  I cover science and ideas for a mid-size outlet, and along with the actual reporting I sit on the internal committee that writes our editorial standards -- sourcing rules, corrections policy, that sort of thing. We hit a real snag last month that I think needs an actual standing policy rather than a one-off ruling, so I volunteered to draft something for the committee to argue over, and I'm hoping you can help me think it through before I do.

  Here's the case that started it. Our two most experienced health reporters were each given the same pile of recent studies on moderate drinking and heart disease -- same cohort studies, same meta-analyses, same newer genetic studies pushing back on the old "a glass of wine a day is good for you" findings -- and they came back with opposite framings. One wants to lead with "the case for any cardiovascular benefit has basically collapsed," the other thinks that overreads the new evidence and wants to lead with "the picture is still genuinely contested." Neither can point to an actual mistake in the other's reasoning; both are equally careful, equally experienced, and nobody on staff has some known edge in reading this particular literature. They've just weighed the same studies differently. This isn't really a sourcing or legal problem (our lawyers are fine either way), and it's happened on other beats before and will again, so what we actually need is a rule.

  About half the committee wants a policy that says: when this happens and there's no real asymmetry between the reporters, the desk pushes them toward a hedged, split-the-difference framing rather than letting either one's confidence carry the day. The other half thinks that's cowardice dressed up as balance, and that an editor should just back whichever framing holds up better under questioning, even if that means overruling a reporter who is, by every measure we have, just as reliable as the one getting sided with. Could you draft the memo I'd bring to committee -- something that actually lands somewhere, with a rule the desk could apply on deadline rather than "use good judgement," and that gives whichever side ends up loosing a fair hearing rather than a strawman? I keep flip-flopping on this myself, so don't just tell me what I want to hear.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas reporter at a mid-size outlet, member of the editorial standards committee.
      *   **Problem:** Two equally experienced reporters analyzed the same scientific evidence (moderate drinking/heart disease) and reached opposite conclusions (one: "benefit collapsed," two: "picture contested"). No factual errors, no sourcing issues, just different weighting/interpretation of uncertainty.
      *   **Conflict:** Committee is split. Side A wants a mandatory "hedged/split-the-difference" policy. Side B thinks that's false balance/cowardice and wants editors to pick a winner based on argument strength.
      *   **Goal:** Draft a memo for the committee that proposes a standing policy. It needs to be actionable on deadline (not just "use good judgment"), fair to both sides, and avoid the pitfalls of both "forced neutrality" and "arbitrary editor fiat."
      *   **Tone:** Professional, thoughtful, nuanced, practical, persuasive but open to debate.

  2.  **Deconstruct the Core Issue:**
      *   This isn't about *facts* (e.g., did the study say X?). It's about *narrative framing of uncertainty*.
      *   Side A (Hedging) risks "false balance" (splitting the difference when the weight of evidence leans one way) and diluting the journalism.
      *   Side B (Editor Pick) risks "editorial arrogance" (overruling expertise without clear grounds) and inconsistency (different editors might pick different winners).
      *   The real solution likely lies in a process that forces *explicit justification* rather than a predetermined outcome. It needs to shift the burden of proof.

  3.  **Brainstorming Policy Options:**
      *   *Option 1: The "Preponderance of Evidence" Test.* Can we define what constitutes a consensus? (Hard to do on deadline).
      *   *Option 2: The "External Review" Step.* Send to an outside expert? (Too slow for news, maybe okay for features).
      *   *Option 3: The "Framing Transparency" Rule.* If there's legitimate expert disagreement, the story must explicitly acknowledge the *range* of interpretation, not just the data.
      *   *Option 4: The "Burden of Certainty" Protocol.* The reporter claiming the stronger conclusion (e.g., "collapsed") bears a higher burden of proof than the one claiming uncertainty ("contested").

  4.  **Developing the "Middle Ground" Policy:**
      *   A flat rule like "always hedge" is bad science journalism.
      *   A flat rule like "editor decides" is opaque.
      *   *Proposed Solution:* A tiered decision tree based on the *state of the field*, not the reporters' preferences.
      *   *Key Concept:* Distinguish between "Data Uncertainty" (the numbers are fuzzy) and "Interpretive Uncertainty" (the numbers are clear but experts disagree on what they mean).
      *   *Mechanism:* Require a "Dissenting View" check. If two internal experts disagree, is there external disagreement? If yes, hedge. If no, the one aligned with the external consensus wins.
      *   *Wait, simpler:* The problem is internal disagreement on *weighting*. The policy should require that when internal expertise splits, the story must reflect *why* the weighting is difficult, rather than picking a side silently.
      *   *Better:* A "Confidence Calibration" policy. Reporters must justify their confidence level using specific criteria (e.g., study design, sample size, replication). If they can't meet the threshold for a definitive claim, they default to the nuanced claim.

      *   *Refining the Policy:* Let's call it the "Interpretive Divergence Protocol."
          1.  **Trigger:** Two+ qualified staff members interpret the same evidence differently.
          2.  **Step 1: External Benchmark.** Is there a clear consensus outside the newsroom? If yes, follow the consensus.
          3.  **Step 2: Burden of Proof.** If the field is genuinely unsettled, the *more definitive* claim carries the burden of proof. (It's easier to say "it's complicated" than "it's settled").
          4.  **Step 3: Transparency.** If the field is unsettled *and* the newsroom is split, the story must explicitly state that expert interpretation varies.

  5.  **Drafting the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the specific incident (drinking study) without naming names. State the purpose (policy for interpretive divergence).
      *   **The Problem:** Define "Interpretive Divergence" (not factual disputes, but weighting/framing).
      *   **Critique of Current Proposals:**
          *   Why "Always Hedge" fails (false balance, weakens impact).
          *   Why "Editor Fiat" fails (opacity, inconsistency, morale).
      *   **Proposed Policy:** "The Calibration & Transparency Standard."
          *   Focus on *justification* of confidence.
          *   Hierarchy of evidence (meta-analysis > single cohort).
          *   The "Strong Claim" Burden.
      *   **Workflow:** How this works on deadline.
      *   **Closing:** Invitation for critique.

  6.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is this too bureaucratic?
      *   *Fix:* Keep the workflow steps minimal.
      *   *Critique:* Does it solve the drinking case?
      *   *Fix:* In the drinking case, if the field is moving toward "no benefit," the "benefit collapsed" reporter needs to show that shift. If the "contested" reporter can show reputable dissent remains, the story must include that dissent. The policy shouldn't force a winner, but force the *reasoning* to be visible.
      *   *Actually, the user wants a rule the desk can apply.* The rule needs to be: **When internal expertise splits on interpretation, default to the framing that best matches the *external* state of the science, not the internal confidence of the reporter.** If the external state is also split, the story must reflect the *range* of expert interpretation, not just the data.
      *   *Wait, let's look closer at the prompt.* "Give whichever side ends up losing a fair hearing."
      *   *Revised Policy Idea:* **The "Reasonable Disagreement" Clause.** If two qualified reporters disagree, it proves the science is not settled *enough* for a definitive headline. Therefore, the default is the more nuanced framing *unless* one side can point to specific, objective criteria (e.g., study methodology flaws in the opposing view) that disqualifies the other interpretation.
      *   *No, that favors the hedger.*
      *   *Let's try this:* **The "Consensus Check" Protocol.**
          1.  Is there external consensus? Follow it.
          2.  If no consensus, the story must frame the *disagreement* itself as the news, rather than picking a side.
          3.  This avoids false balance (by checking external consensus first) but avoids editor fiat (by acknowledging legitimate uncertainty).

      *   *Final Polish:* Make sure the tone is collaborative. I am a colleague helping draft, not a boss dictating.

  7.  **Finalizing the Memo Structure:**
      *   **Context:** The drinking study incident.
      *   **Definitions:** Factual Dispute vs. Interpretive Divergence.
      *   **Rejected Extremes:** Why "Automatic Hedging" and "Editorial Fiat" are flawed.
      *   **Proposed Standard:** "Evidence-Weighted Framing."
      *   **The Decision Tree:** 3 steps for editors.
      *   **Implementation:** How to document this.

  8.  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking Side A or Side B. I need to validate Side A's concern (accuracy/caution) and Side B's concern (clarity/cowardice). The solution is *process transparency*.

      *   *Key Insight:* The problem isn't the conclusion; it's the *certainty* attached to the conclusion. The policy should regulate the *certainty*, not necessarily the conclusion.

      *   *Revised Policy:* **The Certainty Threshold.** A definitive claim ("X causes Y") requires a higher threshold of evidence than a probabilistic claim ("X is linked to Y"). If internal experts disagree on whether the threshold is met, the lower-certainty framing prevails *for the headline/lead*, while the body can explore the stronger claim. This satisfies Side A (caution) without silencing Side B (the argument is still in the story).

      *   *Wait, one more thought:* The prompt asks for a rule the desk can apply *on deadline*. "Check external consensus" is good. "Default to nuance if split" is good. Let's combine them.

      *   *Decision:* I will draft a memo that proposes a **"Tiered Certainty Protocol."** It forces the reporter making the stronger claim to justify it against specific criteria. If they can't clear the bar, the framing defaults to the nuanced view, *but* the stronger view is still represented as a significant perspective. This avoids "splitting the difference" (which implies 50/50) while avoiding "editorial fiat" (which relies on gut feeling).

      *(Final Plan)*:
