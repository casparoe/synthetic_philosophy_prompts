answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. And like many younger siblings, I've spent a lifetime watching my sister think deeper about things than anyone else in the room.

  Usually, that happens over dinner, and usually, it ends with the rest of us just nodding while she deconstructs the ethics of the dessert menu. But recently, she taught me something beautiful during a seminar she was taking on moral uncertainty.

  She told me about a concept called "moral trade." Now, I know "trade" sounds a little unromantic for a wedding. It sounds like a business deal. But in philosophy, and in this marriage, it's actually the opposite.

  The idea is this: Sometimes, two people can deeply disagree about what is "right." They don't compromise. They don't pretend to agree. Instead, they make space for each other's conscience.

  We see this in [Sister] and [Groom]'s relationship all the time. [Sister] believes factory farming is a moral catastrophe. [Groom] thinks she's worrying too much. But, without being asked, he quietly funds her animal-welfare donations. He doesn't do it because he changed his mind. He does it because *her* conviction matters to him.

  In exchange, [Sister] has made peace with his Thursday night poker games. She still thinks it's a little morally grimy; he still thinks it's harmless fun. She hasn't converted to poker enthusiast, and he hasn't become a saint. But they've struck a trade where they both come out ahead by their own standards, because they value their partnership more than they value being "right."

  To the family here who might think this sounds technical: This isn't cold calculation. This is the warmest kind of respect. It is saying, "I love you enough to support the things that make you *you*, even when I don't fully understand them."

  And to the philosophy cohort in the back: Yes, this is Toby Ord's moral trade. But it's also just love, operationalized.

  [Sister] and [Groom], you have found a way to disagree without dividing. You have found a way to honor each other's integrity without demanding conformity. In a world that often tells couples they need to think exactly alike to succeed, you've proven that you can hold different maps, as long as you're walking toward the same horizon.

  So, if everyone could please raise a glass.

  To [Sister] and [Groom]. May your trades always be fair, your disagreements always be kind, and may you always value each other's conscience as much as your own.

  To the happy couple!
