      *   **Source Material:** Primarily *Lettre à d'Alembert sur les spectacles* (1758), but implicitly drawing on his broader political philosophy (*Social Contract*, *Discourse on Inequality*, *Emile*).
      *   **Key Themes:** Authenticity as commodity, manufactured spontaneity, synthetic personas, structural vs. puritanical objections, actor as counterfeiter, pity as cheap currency, corruption of society vs. preservation of virtue, civic festival vs. passive spectacle.
      *   **Specific Questions to Address:**
          1.  Is AI performance the *culmination* of the harm (extreme counterfeiting) or *different in kind* (no human soul to corrupt)?
          2.  Would he be resigned/indifferent (since society is already corrupt) or alarmed by the scale/algorithmic reach?
          3.  Does TikTok/user-generated content resemble the "civic festival" or is it poisoned by the profit motive/algorithm?
      *   **Constraint:** No survey of scholarly opinion. Needs a "genuinely reconstructed, specific answer" grounded in the *architecture of his arguments*.

  2.  **Deconstruct Rousseau's Argument in the *Lettre à d'Alembert*:**
      *   *The Actor's Trade:* It's not just lying; it's a habitual alienation from oneself. The actor puts himself up for public judgment. He learns to value appearance over being. This corrodes *moeurs* (morals/customs).
      *   *Pity/Catharsis:* Rousseau rejects Aristotelian catharsis. Feeling pity for a fictional character exhausts our natural compassion (*pitié*). We feel good about ourselves for crying, so we don't help real people. It's self-congratulatory sentimentality.
      *   *Society Context:* Theatre is fine for corrupt cities (Paris) because they are already lost; it keeps them amused and passive. It is *deadly* for virtuous republics (Geneva) because it introduces inequality, luxury, and idleness.
      *   *The Alternative:* The Civic Festival. No stage, no actors. People are the spectacle to themselves. Active participation, not passive consumption.

  3.  **Apply to Modern Contexts:**

      *   **Reality TV & Influencers:**
