  7.  **Final Polish:** (Reviewing against the prompt's request for "reconstructed, specific answer".)
      *   Make sure to explicitly mention the *Lettre à d'Alembert* logic regarding the "trade in counterfeiting."
      *   Ensure the distinction between *amour de soi* (self-love/natural) and *amour-propre* (vanity/social) is clear in the influencer context.
      *   Highlight the "profit motive" poisoning the festival aspect.

  8.  *(Final thought before drafting)*: Rousseau's key insight is that institutions shape souls. The algorithm is an institution. It shapes souls toward dependency on external validation. That's the core hook.

