answer: |-
  The cursor blinked against the white background of the donation page. It was a steady, rhythmic pulse, like a heartbeat measured in pixels. *Give now,* the button said in bold green. *Save a life today.*

  Elias sat in the blue light of his laptop, the rest of his apartment swallowed by the 2:00 AM darkness. The fridge hummed in the kitchen, a low, domestic drone that usually sootheed him. Tonight, it sounded like a warning.

  He had meant to do this weeks ago. He had set aside the money, a significant chunk of his quarterly bonus, earmarked for the Effective Altruism fund he'd been reading about. The logic was clean, almost beautiful in its arithmetic. You have resources. There is suffering. You move resources to suffering. The suffering decreases. The equation balances.

  On the screen, a photograph showed a girl named Amara. She was six years old, standing in front of a corrugated metal wall, smiling with a gap where a front tooth should be. The text below explained that his donation would provide bed nets and antibiotics for her village. It was a certainty. The charity had data. For every thousand dollars, statistically, a life was saved. Amara, or someone like her, would not die of malaria this year.

  Elias moved his hand toward the mouse. His fingers hovered over the plastic.

  Then the shadow fell. It wasn't a visual thing; it was a cognitive pressure behind his eyes, a heaviness that had started in the seminar hall and followed him home.

  If Amara doesn't die, she grows up. That was the first step, the obvious one. She becomes a woman. She might have children. Three, maybe four, given the demographics of the region. Those children eat food. They drink water. They require schools, roads, energy. They occupy space in a world that was already straining at the seams.

  Elias knew this wasn't a unique thought. It was the kind of thing people whispered and then quickly laughed off as cold-hearted. But the seminar hadn't laughed. The professor had drawn a diagram on the whiteboard, branching lines spreading out like cracks in glass. *Simple cluelessness,* she had called it. The idea that the future effects are random noise. If Amara grows up to be a saint, that's good. If she grows up to be a tyrant, that's bad. Since you can't know, you assume it washes out. You ignore the ripples and focus on the stone hitting the water.

  But Elias couldn't assume it washed out. That was the sickness of it. He had read the reports on resource depletion. He had seen the climate models. He knew the trajectory of the system.

  He sat back, the chair creaking in the silence. If he saved Amara, he was adding weight to a collapsing structure. He didn't know *how much* weight. He didn't know if Amara would be the one to invent a fusion reactor or the one to burn down a forest for charcoal. That was the simple part, the random noise.

  The complex part was the skew.

  He closed his eyes and tried to visualize the future. He saw the village expanding. He saw the water table dropping. He saw the tension between neighboring groups tightening as the land grew less forgiving. He couldn't prove that saving Amara contributed to a future conflict. He couldn't put a number on the probability of a war starting in forty years because there was one more person drawing breath.

  But he had reason to believe the pressure was real. He had reason to believe that adding life to a system in overshoot wasn't neutral. It was a stressor. The unknown effects weren't equally likely to be good or bad; they were likely to be costly. The universe tended toward entropy, toward scarcity. Saving a life now borrowed against a future that might not be able to pay.

  He opened his eyes. The green button still glowed. *Save a life today.*

  "Today," he whispered to the empty room.

  That was the trap. The "today" was visible. The suffering prevented was concrete. He could see Amara's smile. He could feel the warmth of doing the right thing. It was a dopamine hit wrapped in morality.

  The future was invisible. It was a fog. But it was a fog that felt heavy, like wet wool pressed against his face.

  He tried to run the calculation again, the way he had been taught. Maximize expected value. Multiply the probability of an outcome by its utility.

  *Outcome A: Amara lives.* Utility: High. Probability: 100% (if he clicks).
  *Outcome B: Downstream effects.* Utility: Unknown. Probability: 100% (something will happen).

  The problem was the utility of Outcome B. It wasn't zero. It wasn't random. It felt negative. But how negative? Was it minus one unit of suffering? Minus a million? If the downstream effect was a localized conflict that killed ten people in 2060, did that outweigh saving Amara in 2024?

  He couldn't know. No one could know. The causal chains rippled outward forever, interacting with a million other variables. But the seminar's point had been that you couldn't just ignore them because they were hard to count. If you have reason to think the hidden variables skew negative, you can't just pretend they cancel out.

  Elias stood up and walked to the kitchen. He poured a glass of water. The tap sputtered, then ran clear. He drank it, feeling the cold liquid in his throat. Another resource. Another draw on the system.

  He thought about not clicking. If he didn't click, Amara might die. That was a certainty. A child dying of fever, shaking under a thin blanket. He could feel the horror of that in his gut, sharp and immediate.

  But if he did click, he was signing a contract with a future he couldn't read. He was betting that the visible good outweighed the invisible cost. And he was losing confidence that the bet was safe.

  It wasn't that he was paralyzed by not knowing *anything*. He knew plenty. He knew malaria kills. He knew populations grow. He knew resources are finite. He was paralyzed because he knew enough to see the danger, but not enough to measure it.

  He walked back to the laptop. The screen had dimmed to save power. He tapped the trackpad to wake it. The page refreshed. Amara's face loaded again, pixel by pixel.

  He thought about the other option. Keep the money. Invest it. Maybe give it to a lab working on synthetic food? Maybe save it for a catastrophe that hadn't happened yet?

  But those paths had shadows too. Synthetic food might disrupt local agriculture, causing famine elsewhere. Saving for a catastrophe meant letting people die now to save people later. The shadows followed every choice. There was no clean line. There was only choosing which shadow to stand in.

  The illness rose in his throat again. It was a specific kind of nausea, the feeling of standing on a ledge where the ground looks solid but you know there's a sinkhole beneath the grass. You can't see the hole, but you know the geology suggests it's there.

  If he donated, he was complicit in the future strain.
  If he didn't, he was complicit in the present death.

  Both were real. Both were heavy. But one was visible, and the other was a ghost. And the ghost was getting louder.

  He remembered the professor's voice, flat and precise. *Complex cluelessness isn't a puzzle to be solved. It's a condition to be endured. It's the realization that the map is not just incomplete; it's distorted.*

  Elias put his hand on the mouse. His palm was sweaty. He could feel the pulse in his wrist, ticking away seconds.

  He thought about Amara's tooth gap. He thought about the water table. He thought about the year 2060. He tried to weigh them against each other, like stones on a scale. But the stone for the future was made of smoke. It had weight, he was sure of it, but he couldn't grip it.

  If he clicked, he was acting on the hope that the visible good was enough. That the immediate relief mattered more than the systemic risk. That was a faith position. He had thought he was being rational, being mathematical. But this… this was guessing. It was guessing with stakes he couldn't comprehend.

  If he didn't click, he was acting on the fear that the invisible bad was greater. That was also a faith position.

  The cursor blinked. *Give now.*

  He realized he wasn't waiting for clarity. Clarity wasn't coming. The data didn't exist. The calculation was impossible. He was waiting for the feeling in his gut to settle, for the nausea to pass.

  It didn't pass. It tightened.

  He looked at the photograph one last time. He wanted to see just the girl. He wanted to see just the help. But now he saw the crowd behind her. He saw the years stacking up like lumber. He saw the weight of all the tomorrows she would consume just by existing.

  He wasn't a god. He couldn't see the end of the chain. But he could feel the tension in the links.

  Elias moved the cursor. It drifted over the green button. The highlight changed from dark to light.

  He thought about how easy it would be to just decide. To say *this is good* and click. To let the visible world dominate the invisible one. Most people did. They lived in the light of the immediate. They didn't look at the shadows.

  He looked at the shadows. And because he looked, he couldn't look away.

  He moved the cursor to the right, away from the button. He closed the tab. The screen went dark, reflecting his own face back at him. He looked tired. He looked like someone who had seen the edges of the map and found them fraying.

  He didn't know if he had done the right thing. He didn't know if he had done the wrong thing. He only knew that he couldn't carry the weight of the unknown and pretend it was zero.

  Elias shut the laptop. The click of the latch was loud in the quiet apartment. He sat in the dark, listening to the fridge hum, waiting for a certainty that he knew, with a sinking clarity, was never coming. The money sat in his account. The girl stayed in the photo. The future remained a fog, heavy and skewed, pressing against the glass.
