prompt: |-
  I ended up on my state's law revision commission almost by accident. A few years back I wrote a feature on "zombie laws" still sitting in the criminal code — the sodomy statute nobody enforces anymore, an old fornication ban, that sort of thing — which was a fun detour from my usual science-and-ideas beat, and apparently someone on the commission read it and decided I'd be a decent fit for the "public member" seat their enabling statute requires (one non-lawyer, presumably so the lawyers don't just talk to each other). It's been a real education since. We're most of the way through a decade-cleanup pass on the old morals chapter of the code, and almost everything is dying without a fight — nobody's defending the cohabitation or fornication bans anymore. But we're stuck on the bigamy statute, and because I'm apparently "good with words" I got voluntold to draft the recommendation memo for next month's public session.

  Our charter says we're supposed to recommend repealing any statute that no longer serves "a legitimate public purpose apart from enforcing private morality" — a phrase nobody thought hard about until now, because usually it's obvious which laws are just dead weight. Here's the fact pattern that's actually splitting the comission, stipulated to strip out the messy stuff: three adults, all single on paper (divorced or never married to each other), who've lived as a family for over a decade and consider themselves married even though only one marriage license exists between any two of them — no fraud on taxes or benefits, no minors involved, everyone got into it as a consenting adult. One camp wants to just carve cases like this out of the statute: there's no identifiable victim, so what's the legitimate public purpose? A second camp, led by a retired judge who keeps invoking the old Hart-Devlin fight from her law school days, says that's the wrong question entirely — the criminal law is entitled to protect monogamous marriage as a shared institution and treat its erosion as a harm to the community's moral fabric, whether or not any particular defendant hurts anybody in particular. A third camp isn't fully sold on either argument, but worries that carving out "clean" cases like this makes it practically harder to prosecute the genuinely coercive polygamous compounds the statute was originally aimed at, and that a visible repeal sends a signal regardless of which philosophy wins the room.

  Could you draft the actual memo — repeal, retain, or something narrower — with a recommendation Im prepared to stand behind out loud in front of the judge? I don't want three paragraphs of harm-principle-101 that quietly assumes the moral-fabric argument isn't real; I want it treated seriously enough that she couldn't wave it off as a strawman, even if you end up recommending against her. And it'd help if you were honest about whether the third camp's worry is really an argument about this statute, or an argument about an entirely different one.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Public Member of a State Law Revision Commission (non-lawyer, background in science/ideas journalism).
      *   **Task:** Draft a recommendation memo for the Commission regarding the state's bigamy statute.
      *   **Context:** The Commission is cleaning up "zombie laws" (morals chapter). Most are being repealed. Bigamy is the sticking point.
      *   **Charter Standard:** Repeal statutes that no longer serve "a legitimate public purpose apart from enforcing private morality."
      *   **Fact Pattern:** Three consenting adults, long-term cohabitation, self-identified as a family, only one legal marriage license, no fraud, no minors.
      *   **The Conflict:**
          *   *Camp 1 (Repeal/Carve-out):* No victim, no legitimate public purpose beyond morality.
          *   *Camp 2 (Retain - The Judge):* Criminal law protects monogamy as an institution; erosion is a harm to the community's moral fabric (Hart-Devlin).
          *   *Camp 3 (Pragmatic/Enforcement):* Worry that narrowing the statute makes prosecuting coercive polygamous compounds harder; signal sending.
      *   **Requirements:**
          *   Must be a formal memo suitable for a public session.
          *   Must take a clear stance (Repeal, Retain, or Narrow).
          *   Must treat the "moral fabric" argument (Camp 2) seriously, not as a strawman.
          *   Must address Camp 3's concern honestly (is it about *this* statute or a different one?).
          *   Tone: Professional, legally grounded but accessible (public member voice), persuasive.

  2.  **Determine the Recommendation:**
      *   *Option A: Retain.* Hard to justify under the "legitimate public purpose apart from enforcing private morality" standard if the only defense is moral fabric. The charter specifically targets this.
      *   *Option B: Repeal Entirely.* Risks Camp 3's concern about coercive compounds. Might be too radical for the Commission to agree on.
      *   *Option C: Narrow/Amend.* This seems the most viable path. It addresses Camp 1 (decriminalizes the consensual adult triad), addresses Camp 2 (preserves the institution of legal marriage), and addresses Camp 3 (keeps teeth for fraud/coercion).
      *   *Decision:* Recommend **Amending/Narrowing** the statute to focus on fraud, coercion, and legal status infringement, rather than mere cohabitation/multiple ceremonial marriages among consenting adults without legal claim. This aligns best with the Charter's "public purpose" test while acknowledging the institutional value of marriage.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background:** Briefly recap the Charter standard and the specific fact pattern.
      *   **Analysis of Competing Views:**
          *   *The Moral Fabric Argument (Camp 2):* This needs careful handling. Acknowledge Lord Devlin's argument (society has a right to protect its shared moral structure). Acknowledge that marriage *is* a foundational legal institution. However, counter with the Charter's specific limitation ("apart from enforcing private morality"). If the *only* purpose is moral, it must go. But is there a *legal* purpose? Yes, clarity of legal status (inheritance, next-of-kin, etc.).
          *   *The Enforcement/Coercion Argument (Camp 3):* This is crucial. Is bigamy the right tool for stopping cults/abuse? Usually, no. Those are abuse, fraud, or statutory rape cases. Using bigamy to catch them is a "dragnet" approach that catches the consensual people too. Need to be honest: This worry is often about *other* crimes.
          *   *The Liberty/Harm Argument (Camp 1):* The core of the Charter. If no fraud/coercion, is there a state interest?
      *   **The Recommendation (The "Something Narrower"):** Propose shifting the statute from a "status" crime (being married to two people) to a "conduct/fraud" crime (claiming legal benefits you aren't entitled to, or coercing someone). Or, simply exempting private cohabitation arrangements that don't seek legal recognition.
      *   **Addressing the Judge:** Speak directly to the Hart-Devlin point. Acknowledge that society *does* have an interest in the clarity of marital status. But argue that criminalizing private, non-fraudulent arrangements undermines the institution more than it protects it by breeding contempt for the law.
      *   **Addressing Camp 3:** Be blunt. If there's abuse, charge abuse. If there's fraud, charge fraud. Don't use bigamy as a proxy.

  4.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but use legal concepts correctly (Hart-Devlin, *Lawrence v. Texas* implications).
      *   Ensure the "Public Member" voice comes through—pragmatic, focused on the Charter's specific wording.
      *   Make sure the "Moral Fabric" argument isn't dismissed as silly. It's a valid philosophical stance, but does it fit the *Commission's Charter*? That's the key pivot. The Charter *excludes* pure morality as a sole justification.

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I treat the Judge's argument seriously enough?
      *   *Fix:* Ensure I explicitly cite the value of monogamy as a legal ordering mechanism, not just "old-time religion." The state has an interest in knowing who inherits what, who makes medical decisions, etc. Bigamy muddies that water.
      *   *Critique:* Did I answer the Camp 3 worry?
      *   *Fix:* Explicitly state that coercive compounds are better prosecuted under RICO, abuse, or fraud statutes. Relying on bigamy there is a crutch.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Propose specific statutory language changes (e.g., requiring intent to defraud or multiple *legal* licenses).

  6.  **Final Polish:** Check the Charter standard again. "Legitimate public purpose apart from enforcing private morality." This is the hammer. If the Judge argues *only* moral fabric, the Charter forces repeal. If she argues legal clarity, that's a public purpose. The recommendation must thread this needle.

      *Decision:* The recommendation will be to **Amend**. Retain the prohibition on obtaining multiple *legal* marriage licenses (protects the administrative state) and prohibit fraud/coercion (protects individuals), but decriminalize private cohabitation/ceremonial unions that make no claim on the state. This satisfies the Charter while protecting the institution.

  7.  **Final Output Generation** (incorporating the above thoughts into the memo structure). *Self-correction: Make sure to explicitly mention the Hart-Devlin debate as requested.*

      *(Drafting the memo...)*
      *   *Subject:* Recommendation Regarding [State Code Section] - Bigamy.
      *   *Structure:* Background, Analysis of Positions, Recommendation, Statutory Language Proposal.
      *   *Key argument:* The "Moral Fabric" argument is valid generally, but the Commission's Charter specifically filters it out unless tied to a secular public purpose (like legal clarity). The "Coercion" argument is valid but belongs in different statutes.

  8.  **Final Review against constraints:**
      *   Draft the actual memo? Yes.
      *   Recommendation I can stand behind? Yes (Amend/Narrow).
      *   Treat moral-fabric seriously? Yes.
      *   Honest about Camp 3? Yes.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** State Law Revision Commission
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding [State Code Section XXX.XX] – Bigamy and Plural Cohabitation

  ### I. Executive Summary

  The Commission is charged under our enabling statute with recommending the repeal of any criminal provision that no longer serves "a legitimate public purpose apart from enforcing private morality." After reviewing testimony, legal precedent, and the specific fact pattern of consensual multi-adult households currently technically in violation of [State Code Section XXX.XX], I recommend that the Commission **vote to amend, rather than repeal or retain, the statute.**

  Specifically, I propose narrowing the statute to criminalize only (1) the procurement of multiple *legal* marriage licenses (fraud on the state), and (2) cohabitation purporting to be marriage where coercion, fraud, or minors are involved. Private, consensual multi-adult family structures that make no claim on state marital benefits should be decriminalized.

  This approach honors the Charter's limitation on enforcing private morality while preserving the state's legitimate interest in the administrative clarity of marital status. It also addresses enforcement concerns regarding coercive compounds without relying on this statute as a blunt instrument.

  ### II. The Charter Standard and the "Moral Fabric" Argument

  Our mandate is specific: we are not asking whether bigamy is "good" or "bad" in the abstract. We are asking whether criminalizing it serves a public purpose *apart from* enforcing private morality.

  The argument for retention, eloquently articulated by Commissioner [Judge's Name], rests on the Devlinian view that society is entitled to use the law to protect its shared moral structure. In this view, monogamous marriage is not merely a private contract but a foundational public institution. Its erosion— even by private, consensual actors—weakens the normative framework that stabilizes inheritance, next-of-kin rights, and child-rearing expectations. Under this philosophy, the "harm" is not to a specific victim, but to the integrity of the institution itself.

  This is not a strawman. It is a coherent theory of legal moralism. If our Charter allowed us to codify traditional morality for its own sake, this argument would be dispositive.

  However, our Charter explicitly excludes "enforcing private morality" as a standalone justification. Therefore, the question becomes: *Does protecting the "moral fabric" of monogamy yield a secular, administrative public benefit?*

  The answer is yes, but only regarding **legal status**, not private conduct. The state has a legitimate interest in knowing who is legally married to whom for tax, medical, and probate purposes. A statute that prevents individuals from holding multiple *legal* marriage licenses serves this purpose. However, a statute that criminalizes private cohabitation or religious ceremony, where no claim is made on the state's legal framework, serves only the moralistic purpose our Charter forbids. To retain the statute in its current form would require us to ignore the "apart from morality" clause of our own mandate.

  ### III. The Enforcement Concern (The "Coercive Compound" Argument)

  A third concern raised during deliberation is that narrowing the statute may hamper prosecution of coercive polygamous compounds, where underage marriage, welfare fraud, and domestic abuse are prevalent.

  I must be honest with the Commission: **This is an argument for a different statute.**

  Relying on bigamy laws to prosecute coercive cults is a form of prosecutorial drift. If a leader is coercing women, we should charge coercion. If he is marrying minors, we should charge statutory rape. If he is defrauding the state of benefits, we should charge fraud.

  When we retain a broad bigamy statute to catch bad actors, we inevitably criminalize the consensual adults caught in the net alongside them. Using this statute as a dragnet for abuse is inefficient and constitutionally risky. It allows prosecutors to bypass the harder work of proving abuse or fraud by relying on the easier proof of "status." If we narrow the statute to focus on fraud and coercion, we do not lose the ability to prosecute these compounds; we simply force the state to prove the actual harm being done.

  ### IV. Recommendation: The "Legal Claim" Standard

  I recommend the Commission propose the following amendments to [State Code Section XXX.XX]:

  1.  **Retain** the prohibition against obtaining or holding more than one *state-issued* marriage license simultaneously. This protects the administrative integrity of the marital institution (the legitimate public purpose).
  2.  **Remove** the prohibition against "cohabiting as married" or participating in private religious unions, *unless* such conduct involves:
      *   Minors;
      *   Coercion or duress; or
      *   Intent to defraud the state or a third party of benefits tied to marital status.

  **Why this works:**

  *   **For the Retention Camp:** It preserves the legal monopoly of the state on marriage. No one can claim the legal benefits of two spouses. The "institution" of legal marriage remains monogamous and clear.
  *   **For the Repeal Camp:** It removes the threat of criminalization for the fact pattern stipulated in our hearing (the consensual triad). It adheres to the Charter's prohibition on legislating morality without secular purpose.
  *   **For the Enforcement Camp:** It sharpens the tool. By adding "intent to defraud" and "coercion" as necessary elements for the cohabitation clause, we give prosecutors clear hooks to target the predatory compounds without criminalizing private household arrangements.

  ### V. Conclusion

  The retired Judge is correct that the law shapes culture. But the law also loses legitimacy when it criminalizes conduct that causes no cognizable harm to the public order.

  If we retain the statute as written, we are declaring that the state's interest in the "moral fabric" of monogamy outweighs the liberty of consenting adults to structure their private lives, provided they do not seek legal recognition for it. Our Charter tells us that is not a calculation we are permitted to make.

  By narrowing the statute to focus on fraud, coercion, and legal licensing, we protect the public purpose of marital clarity without enforcing private morality. We stop policing bedrooms and start policing harm.

  I move that we draft legislation reflecting this "Legal Claim" standard for introduction in the next legislative session.
