answer: |-
  **Setting:** *A quiet corner of a campus coffee shop, late evening. The reading group has dispersed. Two philosophers, ELENA and MARCUS, sit with empty cups and notebooks open.*

  **Marcus:** Let's go back to the effective giving example. You're defending the view that donating ten percent of my income is obligatory, but donating ninety percent is supererogatory. The gap between the two is licensed by an agent-centered prerogative, à la Scheffler. I can weight my own interests to some degree.

  **Elena:** Precisely. The prerogative acknowledges that I am not merely a vessel for the good. I have a life to lead. If I give ninety percent, I sacrifice my capacity to pursue personal projects, relationships, the very things that make me a distinct agent. Ten percent is the baseline of duty; anything beyond is moral heroism.

  **Marcus:** Okay, stage one of my worry is simply the coordinate geometry of this. Where does the ten percent come from? If the prerogative exists to protect my interests from the demands of impartial maximization, why does it protect them *exactly* up to the point where I have ninety percent left? Why not fifty? Why not five?

  **Elena:** It's not a fixed percentage, Marcus. It's a functional threshold. The baseline is set at the point where further sacrifice would significantly impair my ability to function as a rational agent with a conception of the good. Ten percent is a heuristic for "significant but sustainable." Ninety percent impairs function; it turns me into a martyr.

  **Marcus:** But "significant impairment" is doing no work here other than pointing to our intuitions. If I can save a life with the marginal dollar above the ninety percent mark, and you say I'm permitted to keep it to buy a nicer violin, you're saying my violin practice outweighs a human life. If the prerogative is justified by the *cost* to me, then the permission should scale with the cost. But you've fixed it. You've drawn a line in the sand and said, "Costs beyond this don't count toward the calculation of duty." Why *there*?

  **Elena:** Because morality isn't just about the output, Marcus. It's about the relationship between the agent and the demand. If the demand requires me to treat my own life as having no more weight than a stranger's in every marginal decision, I am alienated from my own existence. Scheffler's point is that we need a theory of morality that human beings can actually inhabit. The line is drawn where the theory stops being a guide for living and starts being a recipe for self-erasure.

  **Marcus:** That leads me to the second point. You're appealing to "inhabiting" a theory and "alienation." But isn't this just a philosophical codification of status quo bias? We *feel* that giving ninety percent is too much because we are accustomed to keeping ninety percent. If we were raised in a culture where total communal sharing was the norm, your "alienation" objection would vanish. Are you defending a principle, or are you just baptizing the intuitions of the Western middle class?

  **Elena:** It's not status quo bias if the bias is rooted in the structural requirements of agency. Williams made this point against utilitarianism. If I must abandon my ground projects whenever the impartial calculus demands it, I lose the integrity that makes me an agent *at all*. A morality that destroys the agent to save the world is self-defeating in the long run. We need agents who are psychologically robust. So, the principle is: *Morality must preserve the integrity of the moral agent.* The ten percent is just the empirical cash-out of that principle in our current economic context.

  **Marcus:** But that's the tension. You're using a consequentialist rationale—the "long run" need for robust agents—to justify a non-consequentialist constraint. If the justification is consequentialist, then it's contingent. If, in a specific case, my martyrdom *does* produce more good—say, my sacrifice inspires a movement that saves thousands—then your principle collapses. You'd have to say I'm obligated to martyr myself.

  **Elena:** No, because the supererogatory is defined precisely as that which produces more good but is not required. If I martyr myself, I am a saint. But I am not *wrong* to refrain.

  **Marcus:** And that brings me to the collapse argument, the Kagan-style objection. This is where I think the category becomes unstable. You say the prerogative is justified because full impartiality is too costly. But consider the stakes. In a world of extreme poverty, the cost of *not* acting is death. The cost to you of acting is a violin.
  If the prerogative is weighted—allowing me to favor myself *some* amount—that weight must be constant. But the moral urgency on the other side of the scale is variable. When the need is low, maybe I can keep ninety percent. But when the need is high—effective giving scenarios—the moral weight of the stranger's life skyrockets.
  If your prerogative is fixed (I can always keep enough for a "reasonable life"), then as the stakes rise, the permission looks less like a "prerogative" and more like "indifference." You aren't just licensing self-favoring; you're licensing letting people die for a violin.
  Alternatively, if the prerogative shrinks as the stakes rise to avoid that conclusion, then in the high-stakes cases—the ones that matter most—the prerogative vanishes. We're back to maximizing demandingness. The space for supererogation disappears exactly where we want to call acts "heroic."

  **Elena:** I see the squeeze. You're saying the middle ground evaporates under pressure. But I think you're assuming the "cost" is the only variable. I'm arguing there's a *categorical* distinction between duty and grace.
  Think of it this way: The baseline obligation is about *fairness*. I must do my fair share to address the suffering. Ten percent might be my fair share. If I give ninety percent, I am not just being "more fair." I am absorbing the unfair share of others who refuse to give.
  The prerogative protects me from having to pick up the slack for the rest of humanity. That's not a sliding scale. It's a structural limit on what I owe. I owe my fair share. Anything beyond that is gift, not debt. The "cost" doesn't change the nature of the obligation from debt to gift.

  **Marcus:** But who determines the "fair share"? If I know that others *won't* pay their share, and I *can* prevent a death by paying it, why does the fact that it's "their" slack matter? The child dying doesn't care about the distribution of moral labor.
  If you say, "I'm permitted to let the child die because it's not my fair share," you are asserting that my interest in a violin outweighs the child's interest in life, *even after* I've met some arbitrary baseline of contribution.
  If the justification for the baseline is "avoiding excessive cost," then we have to ask: Is letting a child die an "excessive cost" to my moral integrity? If yes, then you're obligated to save them. If no, then your morality permits you to let children die for violins.
  Either the baseline moves to cover the need (collapsing into demandingness), or it stays fixed and permits what looks like gross negligence (collapsing into self-interest). Where is the stable supererogatory act? If it's truly optional, it means you're permitted *not* to do it. If you're permitted not to save a life you could save, the "permission" looks indistinguishable from a moral failure that you've decided to tolerate.

  **Elena:** It's not tolerated failure; it's recognized liberty. Look, Marcus, if we define morality purely by the *state of the world*, then you're right. The best state of the world is the one where I give everything. But if morality is about *how agents live*, then there is a zone of discretion.
  The supererogatory act isn't just "more good." It's an act that transcends the contract of duty. When I give ninety percent, I am signaling that I value the good *more* than my own standing in the moral community requires.
  Your collapse argument assumes that if an act is better, it must be required. But that denies the possibility of moral latitude. You're forcing a binary: either it's required, or it's morally neutral. I'm saying there's a third category: morally excellent but not mandatory.
  The stability comes from the distinction between *blame* and *goodness*. I am not blameworthy for keeping the violin. But the person who gives it up is morally better.

  **Marcus:** But *why* are you not blameworthy? That's the question you haven't answered without circling back to intuition.
  If the reason you're not blameworthy is "because it's too demanding," then we have to measure the demand.
  Scenario A: I keep the violin, a child dies.
  Scenario B: I give up the violin, a child lives.
  If the prerogative says A is permissible, it's saying the cost to you of losing the violin is greater than the cost to the child of dying.
  But earlier you said the prerogative isn't about weighing costs directly; it's about agency.
  So, is the agency cost of losing the violin greater than the death of a child? That seems absurd.
  So if it's not about the costs, it's about a rule. "Agents keep X%."
  But if the rule is arbitrary, it has no normative force against the reality of the child's death.
  You want the prerogative to be strong enough to protect you from demandingness, but weak enough to not look like selfishness. I'm arguing that in the face of effective altruism data, that middle space is gone. The "reasonable baseline" gets pushed up until it consumes the supererogatory.

  **Elena:** Or, the "reasonable baseline" holds firm, and we admit that morality does not require us to be saints.
  Perhaps the impasse isn't in the logic of the prerogative, but in our meta-ethics. You are treating the "good" as a sovereign that owns us. I am treating morality as a system constructed *by* us *for* us.
  If morality is a human institution, it has human limits. The category of supererogation is the pressure valve. It allows us to acknowledge the ideal without mandating it.
  If you close the valve—if you make the ideal mandatory—people don't become saints. They become resentful, or they reject morality entirely.
  So the "stability" I'm defending isn't logical purity; it's psychological sustainability. The line stops at ten percent not because ninety percent is logically incoherent, but because a morality that demands ninety percent is a morality that will be universally ignored or hypocritically professed.
  Supererogation is stable because it reflects the reality of human motivation.

  **Marcus:** And that's where we stop, I suppose. Because if you ground the normativity in "what humans will accept," you've moved from ethics to sociology.
  I'm asking what we *ought* to do. You're telling me what we *will* do.
  If the child dies because we need a "pressure valve" for our psychological comfort, then the stability of the category is bought at the price of the child's life.
  I can see why you want the category. It preserves the specialness of the hero. But I can't see how you justify the permission to *not* be the hero when the cost of heroism is a violin and the reward is a life, without admitting that your "prerogative" is just a polite name for a limit on how much morality can inconvenience you.

  **Elena:** And I can't see how your "maximizing" view avoids turning morality into a tyranny that no rational agent would voluntarily endorse. If the price of theoretical consistency is a morality that demands self-abnegation, maybe the theory is the thing that needs to break.
  We're left with your consistent, demanding, perhaps uninhabitable morality, and my stable, human, perhaps arbitrary one.

  **Marcus:** It seems so. I'll take the consistency.

  **Elena:** And I'll take the humanity.

  *(They sit in silence for a moment, the impasse hanging between them, neither having yielded the core axiom that drives their divergence.)*
