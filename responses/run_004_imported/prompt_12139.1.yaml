answer: |-
  The story of your grandfather is a stark reminder that history is not just abstract dates and policies, but the sum of individual survivals. His belief—that the atomic bombs spared his life and allowed for your existence—is a version of the "lesser evil" argument made personal. It is the human face of utilitarianism: *this terrible thing happened, but it prevented something worse.*

  When Elizabeth Anscombe stood before Oxford University in 1956 to protest the granting of an honorary degree to Harry Truman, she was not engaging in a cost-benefit analysis. She was not counting bodies. She was making a claim about the nature of morality itself. To understand who wins this debate—Anscombe or the utilitarian defense of Truman—we have to look past the numbers and into the architecture of ethical reasoning.

  ### The Architecture of Anscombe's Argument

  Pop summaries often reduce Anscombe's position to "killing is always wrong." This is inaccurate. Anscombe, a Catholic philosopher and student of Wittgenstein, was well aware that war involves killing. Her argument in *Mr. Truman's Degree* hinges on two specific philosophical distinctions: **intention** and **absolutism**.

  First, the **Doctrine of Double Effect**. Traditional just war theory distinguishes between intended effects and merely foreseen side effects. If a bomber targets a munitions factory and civilians nearby die, the deaths are foreseen but not intended; the intention was to destroy the factory. However, Anscombe argued that Hiroshima and Nagasaki were not cases of collateral damage. The destruction of the cities and the incineration of the civilians *was the means* to the end. The U.S. strategy was coercive: break the will of the Japanese government by demonstrating the ability to annihilate their population. Therefore, the killing of the innocents was not a side effect; it was the instrument of policy. For Anscombe, intentionally killing the innocent is murder, regardless of the uniform worn by the person giving the order.

  Second, **Moral Absolutism**. This is the core of her scandal. Anscombe argued that certain actions are intrinsically evil and cannot be justified by their consequences. If you accept that murdering innocents is permissible *if* it saves more lives, you have established a principle that "murder is okay when it works." She argued that Oxford, by honoring Truman, was endorsing this principle. She wrote, "People may think that it is impossible to keep the law of God... but it is not impossible." For Anscombe, morality is not a calculation of outcomes; it is a adherence to laws that protect human dignity from being commodified. If we allow the "greater good" to justify the slaughter of non-combatants, we erode the only barrier that protects any of us from being sacrificed for a state's expediency.

  ### The Utilitarian Counter-Argument

  The strongest objection to Anscombe is the one your grandfather lived: the argument of **responsibility and necessity**. This is a consequentialist defense, but it is more nuanced than simple body counting.

  The argument posits that in the summer of 1945, the Allied leadership faced a "tragic choice." The alternatives were not "bomb" versus "peace." They were "bomb" versus "Operation Downfall" (the invasion of Japan) and a continued naval blockade. Japanese military leadership had adopted the *Ketsu-Go* strategy, mobilizing the civilian population to fight to the death with bamboo spears. The blockade was already causing mass starvation.

  From this viewpoint, Truman's moral duty was not to keep his own hands clean, but to minimize the total amount of suffering and death under his agency. If the bombs killed 200,000 people but prevented an invasion and blockade that would have killed millions of Japanese civilians, Chinese civilians under occupation, and Allied soldiers (including your grandfather), then the bomb was the *moral* choice. To refuse to use the bomb, in this view, is to prioritize the moral purity of the leader over the actual lives of the people who would die in the invasion. It argues that Anscombe's absolutism is a luxury of peacetime philosophy that collapses under the weight of total war. It places the blame for the deaths not on the man who ended the war, but on the militarists who refused to surrender.

  ### The Verdict

  You asked for a verdict without a cop-out. Here it is: **Elizabeth Anscombe wins.**

  This conclusion is not a denial of the horror of the alternative, nor is it a dismissal of your grandfather's survival. It is a judgment on which ethical framework is necessary for a just human society.

  The utilitarian defense fails because it relies on **speculative counterfactuals**. The claim that the invasion *would* have cost more lives is a historical probability, not a certainty. Japan was already seeking terms through the Soviets; the Soviet declaration of war on August 8 was likely as decisive as the bombs. When we justify the intentional killing of innocents based on *predicted* future benefits, we open a door that cannot be closed. If Truman is justified because he "saved lives," then any massacre can be justified by a sufficiently terrifying projection of the alternative. We enter a world where human rights are contingent on their utility.

  Anscombe wins because she identifies a **categorical boundary** that must not be crossed. The intentional targeting of civilians transforms war from a conflict between combatants into the slaughter of populations. By accepting Truman's logic, we accept that civilians are legitimate currency in geopolitical negotiation. This precedent legitimizes the firebombing of Dresden, the terror bombing of London, and potentially the use of nuclear weapons in the future.

  Your grandfather's survival is a profound mercy, and your existence is a testament to the fragility of life. But moral luck does not sanitize the act. We can be grateful that he came home without validating the method that allowed it. Anscombe's victory is not about condemning the soldiers who fought or the families who survived; it is about preserving a moral law that says **human beings are not tools.** Even for a good end. Even for peace. Even for you.

  If we side with Truman, we say that some people can be murdered for the greater good. If we side with Anscombe, we say that no one can be. In the long run, the latter is the only principle that protects us all.
