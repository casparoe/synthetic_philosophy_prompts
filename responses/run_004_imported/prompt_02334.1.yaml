prompt: |-
  Okay, I need a tie-breaker because my friend Dana and I got into a genuinely heated argument over drinks last night and neither of us would budge. It started from some news story about an assassinated strongman (don't remember which one, honestly) and spiraled into Dana insisting that Aquinas, of all people, basically hands you a green light for killing tyrants, like there's a loophole for it sitting in plain sight in medieval Catholic political theory. Dana's doing a master's in medieval history and never misses a chance to bring this stuff up. I said that's way too simple and that I was pretty sure Aquinas actually argues against private citizens doing exactly that, but neither of us could remember the passage well enough to actually win the argument, so this morning I dug up what I'm pretty sure is the bit Dana was half-remembering, from Book I of On Kingship (De Regimine Principum), in the chapter about keeping a king from turning into a tyrant. Having now read it slowly a few times, I'm more confused than when I started, not less.

  Here's my best paraphrase of the relevant bit, since the actual prose is dense: Aquinas first lays out, fairly sympathetically, the view that it can be an act of virtue for a strong man to kill a tyrant and risk death doing it, backing this up with a real Old Testament case: Ehud (the text calls him "Aioth") killing Eglon, king of Moab, with a hidden dagger, after which Ehud becomes a judge over Israel. Then Aquinas turns around and rejects the whole position, first on the grounds that it clashes with apostolic teaching about patiently submitting even to harsh masters (he cites 1 Peter and early Christian martyrs who didn't fight back), and then with a move that's really bugging me: he says Ehud "must be considered rather as having slain a foe than assassinated a ruler, however tyrannical, of the people," as if killing Eglon just doesn't count as an instance of the very thing he's rejecting. On top of that he adds a prudential argument: private individuals killing rulers on their own initiative is risky because the wicked are more willing to take that risk than the virtuous are, so on net you're more likely to lose a good king this way than get rid of a bad one. His stated conclusion is that going after tyrants should happen through public authority, not private initiative, and a bit later in the same chapter he adds that if a multitude had the right to set up a king in the first place, that same multitude also has the right to depose him.

  Two things are messing with my head here. First, the Ehud move seems like a total sleight of hand: Aquinas sets up the pro-tyrannicide position pretty sympathetically, gives it a real scriptural precedent, and then just relabels the precedent away, without ever spelling out the principal that supposedly makes "slaying a foe" and "assassinating a ruler" different categories. Second, right after his prudential argument against private tyrannicide, he pivots straight to saying the real fix is that it has to go through public authority rather than private persons, plus that thing about a multitude being able to depose whoever it installed. Doesn't that just relocate the killing from an individual to a crowd rather then actually rule it out? I also vaguely remember there's some passage in the Summa on sedition that people cite alongside this one, but I don't have that text handy. Can you help me untangle what Aquinas is actually committing to here: is there a real, principled doctrine of legitimate resistance underneath all this, or is he mostly just hedging so he doesn't have to fully endorse regicide or fully condemn resistance? And, if you can settle it: did I win the argument, or did Dana?
