answer: |-
  First off, tell Dana to buy the next round, because on the core point of the argument—whether Aquinas gives private citizens a "green light" to assassinate tyrants—**you win.**

  However, Dana isn't entirely wrong to think there is a mechanism for resistance in Aquinas's thought; she's just wrong about *who* gets to pull the trigger and *how* it gets justified. Aquinas is notoriously difficult to pin down because he is trying to balance two competing goods: the moral necessity of opposing evil and the theological/political necessity of maintaining order (Romans 13, etc.).

  Here is the breakdown of why you are right, why the Ehud passage isn't a sleight of hand, and what the *Summa* adds to settle the score.

  ### 1. The Ehud Distinction: Usurper vs. Legitimate Ruler
  You felt the move regarding Ehud (Aioth) and Eglon was a "sleight of hand." In modern terms, it looks like semantic gymnastics. But in Scholastic political theory, it rests on a hard legal distinction that Aquinas takes seriously: the difference between a **tyrant by usurpation** (*tyrannus ex defectu tituli*) and a **tyrant by exercise** (*tyrannus ex parte exercitii*).

  *   **Eglon (The Usurper):** Eglon was the King of Moab dominating Israel. He had no legitimate covenantal right to rule Israel; he was an occupying enemy. Therefore, killing him is not *regicide* (killing a sovereign); it is an act of war against a hostile combatant. Aquinas isn't relabeling it to dodge the contradiction; he is categorizing it based on jurisdiction. Eglon was a "foe" because he was outside the political community's legitimate structure.
  *   **The Legitimate King who Turns Bad:** This is the scenario Aquinas is actually worried about. If a king is legitimately anointed or appointed but rules badly, he is still the sovereign. Killing him is regicide and a sin against the divine order.

  So, the Ehud precedent does **not** apply to a legitimate king who becomes a tyrant. It only applies to an oppressor who never had the right to rule in the first place. Dana's "green light" theory collapses here because it ignores the title distinction.

  ### 2. Private Initiative vs. Public Authority
  This is where you definitely win the argument. Aquinas is explicit in *De Regimine Principum* (Book I, Chapter 6) that **private individuals cannot take the initiative.**

  His prudential argument (that wicked men will kill good kings more often than good men will kill bad kings) is secondary to his theological argument. The primary reason is that judgment belongs to the public authority, not private persons. If a private person kills a ruler, they are usurping the role of God and the law.

  However, your confusion about the "multitude" is understandable. Aquinas writes:
  > *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude..."*

  Does this just "relocate the killing"? Not exactly. Aquinas is describing a **corporate legal action**, not a mob execution.
  1.  **It's Constitutional, Not Vigilante:** The "multitude" acts as a singular legal entity (the *res publica*). They are not a bunch of angry individuals; they are the source of the king's authority. If the agent (king) violates the contract with the principal (the people), the principal can fire the agent.
  2.  **Deposition ≠ Assassination:** Aquinas says "deposed or have his power restricted." He does not explicitly say "killed." In the Scholastic view, once the king is deposed by public authority, he reverts to being a private citizen (or a tyrant by usurpation). *Then* force might be used, but the act of removal itself is a legal judgment, not a murder.

  Dana's claim that this is a "loophole for killing" is too aggressive. Aquinas is outlining a doctrine of **legitimate resistance**, not **tyrannicide**. The distinction matters: resistance can mean refusal to obey, legal deposition, or defensive war. Assassination is a specific subset that Aquinas largely forbids for private actors.

  ### 3. The *Summa Theologiae* Evidence (The Tie-Breaker)
  Since you mentioned the *Summa*, here is the text that seals the deal. In **II-II, Question 42, Article 2**, Aquinas asks "Whether sedition is always a mortal sin?"

  His answer is nuanced but leans heavily toward your side:
  *   **Sedition is a sin** because it opposes the unity and peace of the people.
  *   **However,** if a ruler is governing for his own private gain rather than the common good, his rule is unjust. Therefore, disturbing that rule **does not have the character of sedition.**
  *   **The Catch:** He immediately adds a prudential warning (echoing *De Regimine*). Even if the tyrant is unjust, if overthrowing him results in greater harm to the populace (civil war, chaos), it is better to endure him.

  This confirms that while Aquinas admits a tyrant *can* be opposed, he places massive constraints on *how*. It must be for the common good, it must not cause greater scandal, and implicitly (based on *De Regimine*), it must be done through public authority, not private conspiracy.

  ### The Verdict
  **You win.**

  *   **Dana's Error:** She conflated "legitimate resistance" with "private tyrannicide." She interpreted the Ehud exception as a general rule, ignoring the distinction between an enemy occupier and a legitimate sovereign. She also treated the "multitude" clause as a license for a mob to kill, rather than a constitutional mechanism for deposition.
  *   **Your Accuracy:** You correctly identified that Aquinas argues against private citizens taking the initiative. You recognized that the "public authority" clause is a restriction, not just a relocation of violence.

  **The Nuanced Truth:** Aquinas does not give a "green light" to kill tyrants. He gives a "yellow light" to depose them, but only if you have the public authority to do so, and only if doing so won't wreck the common good. He closes the door on the "heroic assassin" model of politics that Dana was arguing for.

  Tell Dana she can keep her medieval history degree, but you get the win on this one. And if she wants to keep debating, ask her to explain how Aquinas reconciles this with his commentary on Romans 13, where he insists that even bad powers are ordained by God for the punishment of sins. That usually shuts this specific argument down pretty fast.
