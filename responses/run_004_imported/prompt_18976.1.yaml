answer: |-
  Here is a draft for your speech. It's written to be spoken at a moderate, conversational pace (about 140 words per minute), which should land you right around the 4-to-5-minute mark.

  I've included some **[stage directions in bold]** to help with the flow. The technical concepts are woven in as metaphors so the parents hear a story about growing up, while your cohort hears the actual theory.

  ***

  **Title:** The Bubble and The Mess
  **Time:** Approx. 4:30 – 5:00 minutes

  **[Start by taking a deep breath. It's okay to look nervous.]**

  Hi everyone. For those who don't know me, I'm [Your Name]. And full disclosure: I am currently experiencing a significant spike in cortisol. When my cohort voted for me to give this speech, my first instinct was to try to logically prove why my roommate should do it instead. He's the confident one. I'm just the one who asked too many questions during the lectures.

  But then I realized that being nervous is actually the perfect topic for tonight. Because for the last two weeks, we've been living in a bubble.

  **[Gesture to the room/camp grounds]**

  For fourteen days, we've been what the lectures called "Cartesian agents." We had a clean boundary between ourselves and the environment. The staff handled our executive function—meals appeared, schedules were set, distractions were removed. We were outside the world, looking in, trying to compute the optimal plans for AI safety and rationality without the world interfering. It was safe. It was clean.

  But tomorrow, that boundary dissolves.

  We are going back to being "embedded agents." We are going back into a world where we are physically part of the system we're trying to navigate. We can't fit a full model of our lives inside our heads, because we are smaller than our lives. We won't have the luxury of pausing reality to think through a decision. We will be messy, tired, and distracted.

  And this brings up the second big problem we studied: Self-Trust.

  There's a theorem called Löb's Theorem that basically says an agent can never fully prove that its future self will keep its goals aligned. In plain English: "Current Me" is making a lot of promises right now. "Current Me" says, *"I will keep reading the papers. I will keep questioning my biases. I will stay rational."*

  But "Current Me" doesn't have to deal with AP Calculus or drama club or the crushing weight of a normal school schedule. "Future Me" does. And logically, I have no guarantee that "Future Me" will care about the things "Current Me" cares about. It is genuinely scary to hand the controls over to a version of yourself that you know is going to be exhausted.

  **[Smile, relax your shoulders slightly]**

  So, how do we handle that? How do we act when we can't model the whole outcome, and we can't trust our future optimization?

  Well, we have a running joke for that.

  For the cohort: you know the 5-and-10 problem. For the parents: the short version is that sometimes, if you spend too much time trying to prove you're making the *perfect* choice, you end up proving you shouldn't make *any* choice. You get stuck in a loop.

  So, at dinner this week, if someone stared at the menu for more than thirty seconds, someone else would yell, "Just take the 10!" It means: stop trying to solve the paradox. The reward is right in front of you. Take the win.

  **[Pause for effect]**

  Tonight, I am trying to "take the 10."

  I could spend the next week trying to optimize this speech to be perfect. I could try to prove to you that I'm the right person to stand here. But I'm an embedded agent now. I don't have all the data. I'm tired. And I'm standing in front of people I care about.

  So I'm just going to take the 10. I'm going to trust that even if "Future Me" forgets the math, "Future Me" will remember the feeling of this community. I'm going to trust that even if we can't model the whole world, we can still make local improvements.

  We are leaving the Cartesian bubble. We are going back to the mess. We are going to be smaller than our problems. But that's okay. Because the goal was never to be a perfect computer sitting outside the universe. The goal was to be a person inside it, trying to make things slightly better than we found them.

  So, to my cohort: When school gets hard, and the noise gets loud, don't freeze. Don't try to solve for perfect. Just look for the good move right in front of you.

  Just take the 10.

  Thank you.

  ***

  ### Delivery Tips for You:

  1.  **The "Cortisol" Line:** Deliver this dryly. It's okay to admit you're freaking out; it makes the cohort root for you and makes the parents think you're humble.
  2.  **The Technical Bits:** When you say "Cartesian agents" and "Embedded agents," slow down slightly. You aren't trying to show off; you're using these as metaphors. The parents will understand the *contrast* (Bubble vs. Real World) even if they don't know the philosophy.
  3.  **The Joke:** When you explain the 5-and-10 problem to the parents, keep it simple. Don't try to explain the logical counterfactuals. Just frame it as "Overthinking vs. Acting." The cohort will fill in the blanks themselves.
  4.  **The Ending:** "Just take the 10" should be the only line you memorize perfectly. Say it clearly to the cohort, but look at the parents when you say it so they feel included in the "win."

  Good luck. You've got this. (And seriously, just take the 10).
