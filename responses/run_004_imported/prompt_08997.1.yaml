      *   *Explanation:* Vagueness usually suggests there's no sharp boundary. Williamson accepts the boundary exists (epistemically) but argues we can't locate it. The "Margin for Error" isn't about the *concept* of cold being fuzzy; it's about the *cognitive mechanism* of knowing being fallible. If my discriminative powers aren't perfect, I can't claim knowledge in borderline cases because I might be in a neighboring case where I'm wrong. Knowledge requires safety. If I claim to *know* I'm cold in a borderline case, I'm claiming my belief couldn't easily be false. But since the next case is indistinguishable and might be "not cold," my belief *could* easily be false. So I don't know.
      *   *Key Distinction:* It's not that "cold" is vague (ontological/semantic); it's that "knowing" requires a buffer zone that vagueness eats up.

