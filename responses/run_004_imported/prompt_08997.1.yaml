      *   *Refinement:* Actually, the Anti-Luminosity argument specifically targets the idea that mental states are self-intimating. If KK were true for *all* knowledge, then knowing you are in pain would imply knowing that you know you are in pain. Williamson's point is that even for internal states, the "safety" condition of knowledge applies. If the state can vary slightly without me noticing, I can't know I'm in it with certainty. Since KK requires that certainty to iterate infinitely, and margin-for-error cuts it off, KK fails.
