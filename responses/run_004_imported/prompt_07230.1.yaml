      4.  **The Synchronic Challenge:** Explain how single-choice menus expose the same flaw.
      5.  **Synthesis:** The synchronic argument suggests the problem isn't *time*, it's *preference structure*. Diachronic strategies are coping mechanisms, not justifications. True rationality requires transitive preferences over comprehensive outcomes.
      6.  **Conclusion:** Resolute choice is a fascinating model of agency, but it doesn't save intransitivity. The synchronic critique wins: the inconsistency is structural, not temporal.

