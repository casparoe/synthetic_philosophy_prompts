answer: |-
  This is a profound and painful place to be, both as a sibling and as a writer. You are asking a question that sits right at the intersection of ethics, psychology, and love.

  You asked for my honest take on the underlying situation, so here it is: **The oscillation is not a failure of your character (in life or in the book); it is the only honest response to an impossible situation.**

  Your writing group is looking for *narrative* consistency (a clear arc, a clear motivation), but you are writing *psychological* realism. In high-stakes emotional trauma, consistency is a luxury. Survival is messy.

  Here is how I see the dynamic you described, broken down into the three options you presented.

  ### 1. Is anger the fair response?
  **Yes.** Anger is often the body's way of asserting a boundary when words have failed. When your brother says something specifically wounding, the pain is real, regardless of the source.

  The advice "it's the illness, not him" is a useful cognitive tool for de-escalation, but it is emotionally gaslighting if used as a total absolution. It asks you to disconnect the action from the actor completely. But he *is* the actor. Even if the illness is holding the gun, he is the hand.

  If you suppress the anger entirely, you suppress your own dignity. You are telling yourself that your pain doesn't matter because his intent was compromised. That is a sustainable strategy for a nurse or a doctor, but not for a sister. A sister expects reciprocity. When that is violated, anger is the grief of that expectation.

  ### 2. Is detachment a cop-out?
  **No, but it feels like one because it is a form of grief.**

  You said that viewing him as "bad weather" or a "broken car" feels like demoting him from brother to problem. I would argue that it feels that way because it requires you to mourn the brother you *wish* you had in order to care for the brother you *do* have.

  When you detach, you aren't necessarily dehumanizing him; you are protecting yourself from the whiplash. However, you are right to be suspicious of it as a permanent state. If you stay in detachment forever, the relationship dies. It becomes purely logistical. You become a case manager, not a sibling. That isn't a cop-out, but it is a tragedy. It is the acceptance of a limited relationship.

  ### 3. Is bouncing between the two the truth of it?
  **Yes. This is the crux.**

  Loving someone with a severe, cyclical mental illness is not a static state. It is a constant recalibration.
  *   **During the manic/hurtful phase:** Anger is necessary to protect your psyche.
  *   **During the lucid/reconciling phase:** Detachment is necessary to prevent resentment from poisoning the good moments.

  The oscillation *is* the relationship. The exhaustion you feel from swinging between "furious at someone who can't help it" and "coldly managing someone I owe more to" is the actual cost of that love.

  If you "pick a lane" in the novel, as your writing group suggests, you might create a cleaner character arc, but you will lose the truth. A sister who is only angry becomes a villain; a sister who is only detached becomes a martyr. A sister who is both is human.

  ### A Note on the Writing
  Your writing group is technically right that characters need consistency, but they are defining it too narrowly. Consistency doesn't mean "feeling the same way all the time." It means "reacting in ways that are consistent with the character's internal logic."

  The sister's internal logic is: *I love him, but he hurts me. I want to be close, but I need to be safe.*

  The inconsistency the group sees is actually **ambivalence**, and ambivalence is the engine of great drama. Don't fix the inconsistency. **Frame it.**
  *   Show the cost of the anger (the guilt).
  *   Show the cost of the detachment (the loneliness).
  *   Show that she chooses the oscillation because neither extreme is survivable on its own.

  ### The "Don't Take It Personally" Trap
  The reason that advice bugs you, even when you believe it, is that it implies the impact on you is secondary to the intent of the illness. But in a relationship, the impact *is* the reality.

  If a car breaks down, it's an inconvenience. If a brother breaks down, it's a wound. You cannot treat a human being entirely like a mechanical failure without losing the humanity of the connection. But you also cannot treat a symptom like a moral failing without losing your sanity.

  ### The Verdict
  You are not failing at loving him. You are succeeding at surviving him.

  The feeling that detachment "demotes" him is actually your love fighting back. It's your refusal to let the illness win the final definition of who he is. But the anger is your refusal to let the illness erase *your* experience.

  For the novel: Trust the oscillation. The tension between those two poles—fury and management—is where the story lives. If you resolve it too neatly, you betray the reality you are trying to capture. The "resolution" of the arc might not be her finding a way to stop oscillating, but her finding a way to stop beating herself up for the swing.

  You are writing something difficult and necessary. Don't let a workshop smooth out the jagged edges that make it real.
