  ### A Note for You (The Grader)
  Since this is peer grading, Dana might ask why she lost points on the last part. The key thing to tell her is: **"Knowledge requires truth, but truth doesn't require knowledge."**

  *   **Knowledge Norm:** Don't assert unless you *know* (No lucky guesses allowed).
  *   **Truth Norm:** Don't assert unless it's *true* (Lucky guesses are allowed if they turn out right).

  Because those two rules treat "lucky guesses" differently, they are different norms. Dana's answer claimed they were the same, which is why the grade is lower in that section. Good luck with the peer review!
