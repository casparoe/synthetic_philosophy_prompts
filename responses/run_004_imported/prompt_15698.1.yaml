answer: |-
  Here is a detailed breakdown of how a philosophy instructor would likely grade this answer, along with the JSON rubric you requested.

  ### Grading Analysis (Total: 15/20)

  **Part 1: The Knowledge Norm & Moore's Paradox (4/5 points)**
  Dana correctly identifies Timothy Williamson and states the norm accurately. She also correctly identifies that Moorean sentences ("It's raining but I don't know it") are a key motivation for the norm.
  *   **Deduction:** She claims Moore's paradox is a "logical contradiction." In epistemology, this is technically incorrect. It is a *pragmatic* contradiction or absurdity, not a logical one (it is logically possible for it to be raining while you don't know it). Since this is a philosophy elective, precision on "logical" vs. "pragmatic" usually matters.

  **Part 2: The Lottery Case (10/10 points)**
  This is the strongest part of her answer. She accurately reconstructs the standard argument (likely from Hawthorne or Williamson). She correctly notes that high statistical probability (justification) does not yield knowledge, and she correctly identifies the linguistic intuition (we hedge with "probably" rather than asserting flatly). This shows she understands the core course material perfectly.

  **Part 3: Truth Norm vs. Knowledge Norm (1/5 points)**
  This is where the grade drops significantly. Dana argues that the Truth Norm and Knowledge Norm are effectively the same because "anything true is something you know." **This is philosophically false.**
  *   **The Error:** Truth does not entail knowledge. I can make a lucky guess (e.g., "The coin will land heads"), and if it lands heads, my assertion was *true*, but I did not *know* it would happen.
  *   **The Consequence:** The Truth Norm would allow me to assert my lucky guess (because it turned out true). The Knowledge Norm forbids it (because I didn't know it). Therefore, the norms *do* differ. Dana's answer misses the fundamental distinction between truth (factivity) and knowledge (justified factivity + no Gettier issues). She gets points for attempting the question, but the reasoning undermines the main point of the lecture.

  ---

  ### Peer Grading Feedback (For Dana)

  **Total Score: 15/20**

  **Comments:**
  "Hey Dana, here is the breakdown based on the rubric. You nailed the Lottery Case explanation (Part 2)—that was perfect and clearly showed why justified belief isn't enough. For Part 1, your definition of the Knowledge Norm was spot on, but be careful calling Moore's Paradox a 'logical contradiction'; professors usually mark that down because it's technically a pragmatic inconsistency, not a logical one.

  The big deduction is on Part 3. You argued that the Truth Norm and Knowledge Norm are the same because 'anything true is something you know.' In epistemology, that direction doesn't hold (Truth $\nrightarrow$ Knowledge). You can assert something true by luck (a guess), which satisfies the Truth Norm but violates the Knowledge Norm. Because of that distinction, the two norms actually disagree on lucky guesses. If you fix that conceptual link, this would easily be an 18 or 19/20!"

