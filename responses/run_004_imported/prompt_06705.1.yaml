answer: |-
  You are absolutely not being a sore loser, and your intuition that something "felt off" about Priya's claim is spot on. In fact, your TOK teacher got excited because you accidentally stumbled onto one of the oldest and most famous problems in the history of philosophy.

  You are describing the distinction between **True Belief** and **Knowledge**.

  Here is the breakdown of why your mental map is philosophically "better" than Priya's GPS navigation, even if you arrived at the same time, and how you can explain this using the exact concepts your TOK class covers.

  ### 1. The Plato Connection (The Road to Larissa)
  About 2,400 years ago, Plato wrote a dialogue called the *Meno*. In it, Socrates asks a question almost identical to your situation. He asks:

  > If two people are guiding a traveler to the city of Larissa, and one **knows** the way because he has traveled it before, and the other has a **true opinion** about the way (he guesses correctly or follows instructions) but has never been there... which is the better guide?

  Socrates concludes that for the specific purpose of *getting to the destination that one time*, the person with true opinion is just as good as the person with knowledge. **Priya was technically right about the outcome.**

  **However**, Socrates then makes the point that validates your feeling: **Knowledge is tethered; true belief is not.**

  Plato uses a metaphor about the statues of Daedalus. They were so lifelike they would run away if you didn't tie them down. Socrates says true beliefs are like those statues: they are valuable, but they tend to "run away" from your mind unless you "tie them down" with an account of the reason why (which is what turns belief into knowledge).

  In your case:
  *   **Priya's True Belief:** "Turn left here." (Correct, but fragile).
  *   **Your Knowledge:** "Turn left here *because* this road connects to the highway that loops around the district." (Correct and tethered).

  ### 2. The TOK Angle: Justified True Belief (JTB)
  In IB TOK, you likely discuss the tripartite definition of knowledge: **Knowledge = Justified True Belief.**

  *   **Belief:** You both believed you were going the right way.
  *   **Truth:** You both were right (you got to the restaurant).
  *   **Justification:** This is where you differ.
      *   **Your Justification:** Internal coherence, memory, spatial reasoning, understanding of causal links (Road A leads to Road B).
      *   **Priya's Justification:** External authority (the App).

  Priya had a *True Belief*, but she lacked *Understanding*. In epistemology (the study of knowledge), understanding is often considered more valuable than mere knowledge of facts. You understood the *system* of the city; she only knew the *output* of the system for that specific trip.

  ### 3. Modal Robustness (The "What If" Test)
  The strongest argument for why your knowledge is "better" is what philosophers call **Modal Robustness**. This asks: *How does this belief hold up in nearby possible worlds?*

  *   **World A (The Dinner Trip):** Phone works. Both arrive. (Tie)
  *   **World B (The Phone Death):** Phone dies. You arrive. Priya gets lost. (You win)
  *   **World C (The Roadblock):** There is construction on the GPS route. You can navigate an alternate route because you understand the grid. Priya is stuck waiting for the GPS to recalculate (or has no signal). (You win)

  Your knowledge is **robust**; it works across a wider range of scenarios. Priya's reliance on the app is **fragile**; it works only under specific conditions (battery life, signal, server uptime).

  If you define "better navigation" as "arriving at the restaurant this one specific time," Priya is right. But if you define "better navigation" as "the capacity to reliably reach the destination under varying conditions," your knowledge is objectively superior.

  ### 4. Cognitive Offloading vs. Cognitive Mapping
  There is also a modern psychological angle. Priya is engaging in **cognitive offloading**. She is using the phone as an external hard drive for her spatial awareness. This is efficient! It saves brain power.

  However, you are engaging in **cognitive mapping**. You are building an internal model of the environment.
  *   **The risk of offloading:** If the tool fails, the capability vanishes.
  *   **The benefit of mapping:** You gain autonomy.

  You aren't being a sore loser for valuing autonomy. Relying entirely on external tools makes you dependent. Your "mental map" represents a skill you own; Priya's navigation represents a service she was renting.

  ### The Verdict
  Priya's claim ("I got there just as fast, so it doesn't matter") is a **pragmatic argument**. She is focusing solely on the immediate result.
  Your feeling ("But I actually *knew* where I was") is an **epistemic argument**. You are focusing on the state of your mind and your relationship to reality.

  **She is right practically, but you are right philosophically.**

  The reason it felt "off" when she was smug is that she was claiming credit for a success that wasn't really *hers*. The GPS did the knowing; she just did the driving. You did the knowing *and* the driving.

  **Next time you talk to your TOK teacher:**
  Tell them you've been thinking about **Plato's *Meno* and the distinction between True Opinion and Episteme (Knowledge)**, specifically regarding **reliability across counterfactual scenarios**. They will probably give you extra credit just for the vocabulary.

  So, no, you aren't being a sore loser. You value understanding over mere output, and that is literally the foundation of education.
