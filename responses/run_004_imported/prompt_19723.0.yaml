answer: |-
  Good evening. For those of you who don't know, most couples meet because of geography, or work, or a spilled drink. [Groom] and [Bride] met because of Derek Parfit. Specifically, they met in a reading group, arguing over a thought experiment about the ethics of future generations.

  Eight years later, they are still arguing.

  [Groom], you are a committed Total Utilitarian. You believe that value is a sum. You believe that more is better, that scope insensitivity is a sin, and that if you add enough good things together, the magnitude matters more than the margin. You look at the horizon and see infinite addition.

  [Bride], you are a Critical-Level theorist. You believe that value has a threshold. You believe that not every addition is a gain, that standards matter, and that a life must clear a certain bar to count toward the good. You look at the horizon and demand to know if the ground is solid enough to build on.

  For the philosophers in the room, you know the stakes. You know the names of the conclusions they are trying to avoid. For the family in the room: He is the optimist who says "yes" to everything; she is the guardian who ensures everything is *worth* saying yes to. He counts the stars; she checks their brightness.

  Naturally, both of them asked me to settle this debate in the toast. They wanted a verdict. They wanted me to raise a glass and declare one axiology the winner.

  I refused.

  I refused because I have watched them for eight years, and I have realized that this disagreement is not a bug in their operating system. It is the load-bearing wall.

  If [Groom] ever stops believing in the boundless sum, he loses his generosity. If [Bride] ever stops insisting on the critical level, she loses her integrity. Their marriage works not because they solved the paradox, but because they contain it. They have built a relationship where "Mere Addition" is celebrated, but never at the cost of the quality of the union.

  There is a risk in talking about ethics and numbers at a wedding. It can sound cold. It can sound like people are variables. So I want to be clear: The only population that matters in this room is the two of you. And regarding the world you are building together, there is no debate.

  You are not aiming for World Z. You are not aiming for a vast, dim expanse of barely tolerable existence. You have built World A. You have built a small, wonderful world that is dense with love, with laughter, and with a quality of life that needs no justification by volume.

  So, I will not solve Parfit's puzzle tonight. I leave that to the reading group. But I will offer a conclusion that I think we can all agree on.

  May your sum be infinite. May your threshold be high. And may you never stop arguing about the difference.

  To [Groom] and [Bride]. To World A.
