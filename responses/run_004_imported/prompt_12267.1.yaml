          *   This implies $P(x) = P(x/2) = P(x/4) = \dots$
          *   If probabilities are constant and non-zero across an infinite range, they sum to infinity, which violates the rules of probability (sum must be 1).
      *   *The "Total Expectation" perspective:*
          *   If you don't look inside the envelope, the expected value of Envelope 1 is $1.5Y$. The expected value of Envelope 2 is $1.5Y$. There is no benefit to switching.
          *   Looking inside gives you information *only if* you know the distribution. Without knowing the distribution, the specific number ($60) is meaningless *unless* you assume an impossible distribution.

