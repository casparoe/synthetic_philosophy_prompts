          *   *Scenario B (Unbounded but realistic):* In the real world, there's a limit to how much cash fits in an envelope or how rich the host is.
      *   *The Mathematical Proof of Impossibility:*
          *   Let $P(x)$ be the probability that the smaller amount is $x$.
          *   The friend's logic implies that for any $x$ you find, the probability that the other is $2x$ is equal to the probability that the other is $x/2$.
