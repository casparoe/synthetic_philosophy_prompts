answer: |-
  Your friend is incorrect. While the calculation of an expected value of $75 is mathematically consistent with his assumptions, the assumptions themselves are flawed.

  The error lies in the assumption that the other envelope is **equally likely** to contain half or double the amount you found. This assumption is impossible to sustain for all possible values.

  Here is the precise breakdown of where the logic fails:

  ### 1. The "Impossible Distribution" Error
  For the calculation to work, the probability of the pair being ($30, $60) must be exactly the same as the probability of the pair being ($60, $120).

  If you apply your friend's logic to *any* amount found—meaning it is always a 50/50 chance to double or halve—it implies that the probability of the envelopes containing ($x, $2x) is the same for every number $x$. In probability theory, this requires a "uniform distribution" over an infinite range of numbers.

  **This is mathematically impossible.** If every possible amount has an equal, non-zero probability of occurring, the sum of all probabilities would be infinite, not 1 (100%). Since there is no valid probability distribution where this holds true, the 50/50 assumption is false.

  ### 2. The Real-World Context (Finite Limits)
  In any real-world scenario, there are limits to the money available (the host's wealth) or the physical space in the envelope.
  *   **If you found $60:** It is plausible the other envelope holds $120.
  *   **If you found $1,000,000:** It is highly unlikely the host has $2,000,000 in cash. It is far more probable that you have the larger envelope and the other holds $500,000.

  Because the probability of doubling decreases as the amount increases, the expected value of switching eventually drops below the amount you currently hold.

  ### 3. The Symmetry Argument
  The most intuitive proof that your friend is wrong is to look at the situation **before** you opened the envelope.
  *   Before opening, both envelopes are identical. There is a 50% chance you picked the larger one and a 50% chance you picked the smaller one.
  *   The expected value of your envelope is $1.5X$ (where $X$ is the smaller amount).
  *   The expected value of the other envelope is also $1.5X$.

  Opening the envelope reveals the specific number ($60), but it does not magically change the underlying value of the envelopes. If there was no advantage to switching before you looked, there is no advantage to switching after you look.

  ### Conclusion
  Your friend's calculation treats the number $60 as a fixed constant in one scenario and a variable in another, which creates a false symmetry. Because the assumption of "equal probability" is impossible to maintain for all numbers, the expected value of $75 is an illusion. **You should keep your $60.**
