      *   *Self-Correction:* Wait, does van Inwagen argue that *existence* isn't vague, even if *life* is? Yes. He distinguishes between vagueness in the *concept* and vagueness in the *world*. Lewis argues that if composition is restricted, existence itself becomes vague. Van Inwagen tries to block this by saying the vagueness is in our description, not the ontology.
      *   *However,* the student's text says: "biology gives us a precise, non-vague criterion... so there's no real borderline area." This is factually wrong regarding van Inwagen's text. He explicitly discusses borderline cases (conception, death).
      *   *Verdict:* This is a substantive error, not just "thin."

  5.  **Finalizing the Rubric:**
