          *   *Relocation:* The problem shifts to the *intra*-substantial level. How do *petites perceptions* (unconscious) sum to *apperception* (conscious) within a single monad? This is the "Mini-Combination Problem."
      *   *Critique/Nuance:* Leibniz isn't a standard panpsychist. Most monads aren't "subjects of experience" in the conscious sense. This is a crucial distinction.
      *   *Conclusion:* Leibniz offers a sophisticated evasion, but at the cost of making macroscopic bodies less real and pushing the mystery into the internal structure of the simple substance.

  6.  **Refining the Philosophy:**
