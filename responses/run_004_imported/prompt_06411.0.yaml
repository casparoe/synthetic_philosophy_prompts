      *   *Scholarly Consensus:* Modern scholarship (e.g., Bart Schultz, Roger Crisp, Terence Penelhum) generally argues it's *not* a separate lapse. It's deeply connected to his ethical dualism (the conflict between Rational Egoism and Rational Benevolence).
      *   *The "Dualism of Practical Reason":* Sidgwick's famous problem: Reason tells me to pursue my own happiness (Egoism) and the general happiness (Utilitarianism). They don't necessarily align. Without God/Immortality, morality might be irrational.
