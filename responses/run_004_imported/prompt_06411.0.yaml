answer: |-
  It is completely understandable why a scientifically trained mind would view Sidgwick's psychical research as a regrettable lapse, akin to Newton's alchemy or Conan Doyle's belief in fairies. Given your background in chemistry, you value empirical rigor, and Sidgwick's *The Methods of Ethics* is indeed a masterpiece of systematic, almost scientific, moral reasoning.

  However, to answer your question directly: **No, you are not right to leave it out.** While it is tempting to compartmentalize the "philosopher" from the "ghost hunter," modern scholarship overwhelmingly argues that the two projects were not separate, but deeply intertwined. Ignoring his work with the Society for Psychical Research (SPR) actually obscures the central tension in his ethical system.

  Here is why serious scholars keep linking the two, and why it matters for your understanding of his ethics.

  ### 1. It Wasn't Superstition; It Was a Search for Empirical Data
  Sidgwick did not turn to spiritualism because he was becoming soft-headed or credulous. He approached psychical research with the same methodological caution he applied to ethics. He was a founding member of the SPR specifically to bring rigorous, scientific scrutiny to claims that were usually dismissed out of hand.

  As an agnostic who felt that traditional religious dogmas were intellectually untenable, Sidgwick was left with a problem: **Science was displacing Religion, but Science could not support Morality.**

  ### 2. The "Dualism of Practical Reason"
  You noted that *The Methods of Ethics* "fizzles out at the end into this unresolved worry about whether duty and self-interest always line up." In Sidgwick scholarship, this is known as the **Dualism of Practical Reason**, and it is the key to understanding his interest in the occult.

  Sidgwick concluded that there are two equally rational methods of ethics:
  1.  **Rational Egoism:** It is rational to pursue my own greatest happiness.
  2.  **Rational Benevolence (Utilitarianism):** It is rational to pursue the greatest happiness of the whole.

  The problem, as you spotted, is that these two do not necessarily coincide in this life. Often, being moral requires significant self-sacrifice with no guarantee of reward. If the universe is purely material and death is the end, then it is often *irrational* to be moral. As Sidgwick famously wrote, the harmony between duty and self-interest is necessary for morality to be fully rational, but he could not find it in the observable world.

  ### 3. Psychical Research as the "Missing Variable"
  This is where the SPR comes in. Sidgwick did not need "ghosts" in the spooky sense; he needed **empirical evidence for a moral order.**

  He hoped that psychical research might provide scientific proof of:
  *   **Immortality:** If we live after death, rewards and punishments can be balanced out, aligning self-interest with duty.
  *   **Divine Governance:** If there is evidence of a benevolent power, the universe is not indifferent to morality.

  For Sidgwick, psychical research was not a hobby; it was an attempt to find the empirical data required to save ethics from irrationality. He was essentially trying to balance the ethical equation with a metaphysical variable that could be verified through observation.

  ### 4. The Scholarly Consensus
  For a long time, early 20th-century philosophers did treat this as an embarrassment. However, since the 1980s (particularly with the work of biographer Bart Schultz in *Henry Sidgwick: Eye of the Universe*), the consensus has shifted. Scholars now view Sidgwick's life as a unified project.

  Schultz argues that Sidgwick was haunted by the fear that without a religious sanction, morality was a sham. His "secret" life in the SPR was actually a desperate attempt to secure the foundations of the very ethics you are admiring. He wasn't abandoning reason; he was extending his empirical requirements into the metaphysical realm because his ethical system demanded it.

  ### Recommendation for Your Summary
  If you are summarizing his ethics, you should include the psychical research, but frame it correctly:

  *   **Don't frame it as:** "Sidgwick got old and started believing in ghosts."
  *   **Do frame it as:** "Sidgwick's ethical system relied on the harmony of duty and self-interest. Lacking theological assurance, he turned to empirical psychical research in hopes of finding scientific evidence for immortality and divine justice, which would resolve the 'Dualism of Practical Reason.'"

  ### Why This Matters to You
  As a chemist, you might appreciate the tragedy of his position. He was a rigorous thinker who realized that his moral axioms required a premise (a moral universe) that his scientific method could not verify. He spent 20 years trying to run the experiment that would prove morality was rational.

  Leaving this out sanitizes Sidgwick. It turns him into a dry logician rather than a deeply anxious human being struggling with the implications of a secular, scientific worldview. Including it shows the high stakes of his philosophy: he wasn't just playing with definitions; he was trying to figure out if it was rational to be good in a godless universe.

  So, keep it in. It doesn't diminish his philosophy; it illuminates the profound difficulty of the problem he was trying to solve.
