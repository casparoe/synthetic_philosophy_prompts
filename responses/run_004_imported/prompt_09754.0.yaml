      *   *Back to Masks:* If we hold $B$ fixed (glass structure stays), does $M$ happen? No, because the *mask* is still there. The mask is extrinsic. Lewis's RCA doesn't say "and no extrinsic interferers." It only says "and intrinsic base persists."
