answer: |-
  This is an excellent dispute, and it speaks well of your seminar that your students have generated a case that puts pressure on the standard taxonomy rather than merely applying it. The shear-thickening polymer (STP) case is genuinely difficult because it exploits a gap in the standard Lewis/Bird/Choi distinctions: the difference between a *stimulus-sensitive mask* and a *fink*.

  Here is an evaluation of the four moves, followed by an analysis of what is missing from their dialectic and how you might settle it in class.

  ### Evaluation of the Moves

  **Move (1): Lena's Classification (Mask)**
  *   **Verdict:** **Lena has the better of it (according to orthodoxy).**
  *   **Reasoning:** Lena is correctly applying the dominant causal-base account of the distinction (championed by Bird and Choi). On this view, the distinction turns on *what* is altered, not *when*. A fink removes or alters the *causal basis* of the disposition (the intrinsic property in virtue of which the object has the disposition). A mask leaves the causal basis intact but interferes with the causal process leading to manifestation.
  *   **Analysis:** The brittle molecular structure of the glass is the causal basis of fragility. The STP coating does not alter the silicon-oxygen bonds; it absorbs the kinetic energy that would otherwise exploit those bonds. Therefore, structurally, this fits the definition of a mask. Lena is right that the "antidote" analogy holds: an antidote neutralizes the poison's effect without changing the chemical composition of the poison already in the bloodstream.

  **Move (2): Marco's Objection (Timing)**
  *   **Verdict:** **Marco is mistaken here.**
  *   **Reasoning:** Marco attempts to define finkishness by *temporal signature* (intervention triggered by the stimulus) rather than *metaphysical mechanism* (alteration of the basis). This is a common misconception. There is no consensus in the literature that masks must be "standing" interferers.
  *   **Analysis:** Consider a gun with a trigger-locked safety catch that engages automatically the millisecond the trigger is pulled (preventing the hammer from falling). This is triggered by the stimulus, yet it is standardly classified as a mask because the firing mechanism (the basis) remains intact; the process is just blocked. Marco's intuition that the STP acts like Lewis's Sorcerer is strong, but his justification (timing) is metaphysically insufficient.

  **Move (3): Lena's Reply (Basis vs. Timing)**
  *   **Verdict:** **Lena wins this round decisively.**
  *   **Reasoning:** She correctly identifies that the literature individuates finks and masks by the *locus of change*.
  *   **Analysis:** She forces Marco back onto the terrain of causal bases. If the definition of a fink is "the stimulus causes the disposition (or its basis) to vanish," and the definition of a mask is "the stimulus occurs, the basis remains, but manifestation is prevented," Lena's case holds. The glass remains brittle *during* the impact; it just doesn't shatter.

  **Move (4): Marco's Comeback (Transient Basis Change)**
  *   **Verdict:** **This is a genuine draw / Marco's strongest point.**
  *   **Reasoning:** Marco finally identifies the weak spot in Lena's argument: the *individuation of the object and its basis*.
  *   **Analysis:** Marco argues that if we treat the "object" as the *coated glass system*, the intrinsic physical state of that system *does* change at the moment of impact (the surface hardens). If the causal basis of the *system's* fragility includes the surface properties, then the stimulus *does* alter the basis, even if momentarily. Martin's electro-fink was indeed instantaneous; duration is irrelevant. If the basis changes at $t$, it is finkish at $t$. Marco is right that "never changes" is too strong if the change is co-extensive with the stimulus. This move forces the question: Is the coating part of the dispositional basis or an external interferer?

  ### What They Are Missing

  Both students are operating with a tacit assumption that the **bearer of the disposition** and the **causal basis** are unproblematic, fixed entities. The STP case reveals that the fink/mask distinction is not a binary feature of the world, but depends on how we carve up the object and its properties. Here are the three specific metaphysical issues they need to address to settle the argument:

  **1. The Individuation of the Causal Basis**
  Lena assumes the basis is the *glass microstructure*. Marco assumes the basis is the *macroscopic physical state of the coated object*.
  *   **The Settlement:** In the causal theory of dispositions (Bird), the basis must be *intrinsic*. Is the coating intrinsic to the glass? If the coating is a permanent, chemically bonded layer, it may be part of the object's intrinsic nature. If it is a spray-on additive, it is extrinsic.
  *   **The Twist:** Even if the coating is extrinsic, if it is *always present*, it functions as part of the "total basis" for the object's behavior in the actual world. However, standard practice (following Choi) is to isolate the *specific* property responsible for the disposition (brittleness). If we isolate brittleness to the silica network, Lena wins. If we attribute the disposition to the "wine glass" as a functional artifact, Marco wins. The case shows that **finkishness can be relative to the description of the object.**

  **2. Stimulus-Sensitive Masks**
  They are missing the category of the **stimulus-sensitive mask**. The literature acknowledges that masks can be triggered by the stimulus (e.g., a circuit breaker that trips when current spikes, preventing the wire from melting).
  *   **The Settlement:** The defining feature of a fink is not that it activates *when* the stimulus occurs, but that it prevents the object from *having the disposition* when the stimulus occurs.
      *   **Fink:** Strike glass $\rightarrow$ Glass ceases to be fragile $\rightarrow$ No shatter.
      *   **Mask:** Strike glass $\rightarrow$ Glass remains fragile $\rightarrow$ Coating absorbs energy $\rightarrow$ No shatter.
  *   **The Test:** Ask them: *If the coating failed to harden, would the glass shatter?* Yes. Therefore, the fragility was still "there," waiting to manifest. In a fink case (Lewis's Sorcerer), if the sorcerer failed to act, the glass would *not* have been fragile at that moment (because the sorcerer's magic *made* it non-fragile). The STP case is a mask because the fragility is **latent but present**, whereas in a fink case, the fragility is **absent**.

  **3. The "Momentary" Objection**
  Marco's Move 4 relies on the idea that a momentary change in the surface properties counts as a change in the basis.
  *   **The Settlement:** This confuses the *manifestation* of a protective disposition with the *removal* of a fragile disposition. The coating has a disposition to harden when struck. The glass has a disposition to shatter when struck. These two dispositions clash. This is an **overlapper** case (two competing dispositions), not necessarily a fink. A fink removes the *first* disposition. The STP does not remove the glass's fragility; it opposes it with a competing power (shock absorption).

  ### Recommendation for the Seminar

  To head off the "baroque variants" and turn this into a productive session, I suggest you frame the resolution around **Causal Baselines and Counterfactuals**.

  1.  **Acknowledge the Ambiguity:** Tell them the case is difficult because it sits on the boundary of *intrinsic* vs. *extrinsic* interferers. The coating is physically attached (like skin) but functionally distinct (like armor).
  2.  **The Decisive Test (The "Failure" Counterfactual):** Ask them to analyze the counterfactual: *"If the polymer failed to stiffen at the moment of impact, would the glass shatter?"*
      *   If **Yes** (it would shatter): The fragility was present. The coating was a **Mask**. (Lena is right).
      *   If **No** (it would not shatter, perhaps because the glass would have magically become tough): The fragility was absent. The coating was a **Fink**.
      *   In the STP case, the answer is clearly **Yes**. The glass is still brittle; the coating just saved it. Therefore, it is a **Mask**, specifically a *stimulus-sensitive mask*.
  3.  **Validate Marco's Insight:** Tell Marco he was right to press on the *timing* and the *basis*, because that reveals why stimulus-sensitive masks are often confused with finks. But he is wrong that timing defines the category. His Move 4 fails because hardening the *surface* does not change the *brittleness of the bulk material* which constitutes the basis of fragility.
  4.  **Pedagogical Pivot:** Use this to introduce the **Causal Theory of Dispositions**. The SCA (Simple Conditional Analysis) fails for *both* finks and masks. The distinction only matters when we try to repair the analysis using causal bases (à la Bird or Choi). If the goal is to save the SCA, Lena and Marco are on the same side (both are counterexamples). If the goal is to understand the *metaphysics of powers*, Lena is right: the power to shatter remains, it is just overridden.

  **Summary for the Class:**
  Lena wins on the standard definition (Basis remains intact = Mask). Marco wins on the intuition that dynamic protection feels like finkish removal, but he fails to prove the basis is removed. The case is a **Stimulus-Sensitive Mask**. The lesson is that the Fink/Mask distinction is not about *when* the intervention happens, but about whether the disposition *exists* at the time of the stimulus. In the STP case, the fragility exists; it is simply overpowered.
