      *   *Decision:* **Option B (Save the Greater Number)** is the only viable *hospital policy*. While Taurek's argument is philosophically robust, institutional medicine operates under a duty to steward resources for the community good. A coin flip in a public hospital is indefensible when lives are mathematically maximizable. However, the memo needs to respect the Taurekian concern (the moral weight of the individual) without adopting the coin flip.
