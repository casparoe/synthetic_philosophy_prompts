      *   *Best Path:* Recommend **Saving the Greater Number**, but frame it through the lens of *institutional duty* and *fair chances* rather than pure aggregation. Actually, the most robust policy in bioethics for *divisible* resources where all else is equal is generally maximizing benefits. I will recommend the "Save the Greater Number" rule but explicitly address the moral cost.
      *   *Alternative:* Some bioethicists argue for a lottery *only* when claims are equal. But here, the resource divisibility makes the claims *not* equal in terms of outcome per unit of resource.
      *   *Decision:* I will draft the memo recommending **Saving the Greater Number**. This is the standard of care in disaster triage and scarce resource allocation (e.g., ventilators during pandemic). Deviating from this creates unacceptable legal and ethical risk for the institution. However, I will write the justification to acknowledge the moral residue of ignoring the single patient.

      *Self-Correction:* Wait, the prompt asks me to "land on one concrete rule." It doesn't explicitly force me to pick the utilitarian one, but as an AI advising a professional context, I must prioritize patient safety and institutional viability. A coin-flip policy is institutional suicide. A weighted lottery is too vague for emergency protocol. "Save the Greater Number" is the only actionable policy. I will write the memo to recommend this, but I will ensure the "Minority View" section gives the Taurek/Chaplain position its due respect.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
