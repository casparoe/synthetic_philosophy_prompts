  6.  **Final Polish:**
      *   Check constraints: "Land on one concrete rule," "Explain reasoning for non-philosophers," "Honest about the strongest thing for the rejected option."
      *   Make sure the Taurek argument isn't strawmanned. The core of Taurek is that *I* cannot be sacrificed for *them*. The policy must acknowledge that the one person is being sacrificed, and that is a moral cost, even if necessary.

