      *Wait, one more thought:* Is there a way to incorporate the "lottery" element to satisfy the Chaplain without risking the "4 die" outcome? No, because the resource is divisible. If you flip for the 1, and he wins, 4 die. That's the hard trade-off.
      *Okay, sticking with "Save the Greater Number" as the recommendation.* It is the only defensible institutional policy.

      *Wait, let's reconsider the "Weighted Lottery".* Some bioethicists (like Persad et al. in *Principles for Allocation of Scarce Medical Interventions*) suggest lotteries when claims are *equal*. Here, claims aren't equal because the cost per life saved differs. The 4 have a "cheaper" claim on the resource. So maximizing is actually more aligned with fairness per unit of resource. I will use this angle.

  7.  **Finalizing the Memo Structure:**
      *   **To/From/Date/Subject.**
      *   **Executive Summary/Recommendation.**
      *   **Context.**
      *   **Ethical Framework (The "Why").**
