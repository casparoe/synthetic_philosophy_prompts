answer: |-
  # The Price of Purity: Frege's Logic and the Shadow of the Diary

  The discovery of Gottlob Frege's private diary in 1969 was not merely a biographical scandal; it was a philosophical earthquake. For the analytic tradition, Frege is the secular saint. He is the man who cleansed logic of the psychological, who banished the murky waters of human subjectivity from the crystalline structure of thought, and who erected the "Third Realm"—a domain of mind-independent *Thoughts* (Gedanke) that exist objectively, timelessly, and without owners.

  When we read the diary entries from 1924, written a year before his death, we do not find a neutral observer of this Third Realm. We find a terrified, reactionary old man. He writes of the "Jewish influence" on German life with vitriol, calls for the stripping of political rights from Jews, expresses contempt for the Weimar Republic, and longs for a dictator who will impose order. Michael Dummett, Frege's greatest champion, was rightly shattered. He noted that while one might expect a great artist to be a scoundrel, one expects the founder of logical objectivity to be, if not virtuous, at least consistent.

  The question your meetup group wrestled with is the correct one: Is there a firewall between the *Begriffsschrift* and the diary? Or does the blood stain the symbols?

  I will not offer you a diplomatic survey. Here is the verdict: **Frege's formal logic survives, but his metaphysical justification for it does not.** We must retain the tools Frege built, but we must reject the philosophical story he told about *why* they work. The diary reveals that Frege's "anti-psychologism" was not a neutral discovery of the nature of truth, but a reaction formation against a world he found terrifyingly chaotic. Consequently, we cannot accept Frege's Platonism as innocently as before. We must view his "Third Realm" not as a description of reality, but as a symptom of a specific, pathological desire for order.

  ### The Case for the Firewall

  The strongest argument for compartmentalization is the rationalist's first instinct: The Genetic Fallacy. The truth of a proposition is independent of its origin. If I discover a proof for a theorem while drunk, the theorem remains true. If Frege derived the rules of predicate logic while harboring hateful political views, the rules of predicate logic remain valid.

  Frege himself would have been the first to agree. His entire philosophical project was built on the distinction between the *context of discovery* (psychological, historical, messy) and the *context of justification* (logical, objective, clean). To judge the *Grundgesetze* by the diary is to commit the very sin of "psychologism" Frege spent his life eradicating. It conflates the causal history of the thinker with the normative validity of the thought.

  Furthermore, the utility of Frege's logic is proven by its adoption. Russell, Wittgenstein, Carnap, and Quine took Frege's tools and built the modern world of computation and analytic philosophy. None of them needed to adopt Frege's antisemitism to use his quantifiers. The formal system is robust; it is modular. You can excise the man from the math.

  This view is comforting, and largely correct regarding the *formal system*. If $P \to Q$ and $P$, then $Q$, regardless of Frege's views on the Weimar Republic. However, this defense only protects the *calculus*. It does not protect the *philosophy*. And Frege was not merely a calculator; he was a metaphysician. He didn't just give us symbols; he gave us a story about what those symbols *mean* and where they live. That story is where the diary cuts deep.

  ### The Case for Continuity

  The argument for continuity suggests that the personality which produced the diary is continuous with the personality which produced the *Third Realm*. This is not to say that logic is antisemitic, but that the *drive* behind the logic is of a piece with the politics.

  Frege's philosophy is defined by a fanatical commitment to objectivity. He hated relativism. He hated the idea that truth could be subjective, variable, or dependent on human consensus. For Frege, truth had to be hard, external, and unyielding. He posited the Third Realm to ensure that Thoughts were not owned by any human mind, and thus could not be corrupted by human frailty.

  Read the diary, and you see a man overwhelmed by human frailty. He looks at the Weimar Republic—with its debates, its compromises, its pluralism, its Jewish citizens—and he sees chaos. He sees "subjectivity" run rampant. His political solution is authoritarianism: a single will, iron laws, the suppression of the "other" to preserve the purity of the state.

  His philosophical solution is identical: a single Truth, iron laws of logic, the suppression of the "psychological" to preserve the purity of Thought.

  In this light, Frege's anti-psychologism looks less like a dispassionate analysis of truth and more like a flight from the human condition. The Third Realm is a sanctuary. It is a place where the messy democratic negotiation of meaning (which happens in language, in society, in the mind) is replaced by a rigid, pre-existing order. The diary suggests that Frege's obsession with objectivity was fueled by a fear of democracy. He wanted logic to be authoritarian because he wanted the world to be authoritarian. He wanted a realm where the "Jewish influence" of subjectivity could not reach.

  ### The Verdict: Save the Tools, Burn the Sanctuary

  So, where do we land? If we say the logic is tainted, we are irrationalists. If we say the man is irrelevant, we are naive.

  The verdict is this: **We must decouple Frege's logic from Frege's Platonism.**

  We should accept Frege's *logic* (the formal system) because it works. It successfully models inference. It allows us to build computers and analyze language. Its validity is demonstrated by its utility, not its author's virtue.

  However, we must reject Frege's *metaphysics* (the Third Realm) as the necessary foundation for that logic. The diary forces us to admit that Frege's specific version of objectivity was motivated by a desire to escape human responsibility. He wanted truth to be "out there" so that it didn't depend on *us*. If truth is a mind-independent object, we don't have to negotiate it. We just have to perceive it. This is philosophically seductive, but the diary reveals the dark side of that seduction: it is a rejection of the human community as a source of normativity.

  The diary shows us that Frege's "anti-psychologism" was not just a technical correction; it was an ideological purge. He wanted to cleanse logic of the human because he had lost faith in the human.

  Therefore, our estimation of Frege must shift. He is no longer the prophet who showed us the eternal realm of Truth. He is the engineer who built a magnificent bridge because he was terrified of the river below. We can cross the bridge (use the logic), but we should not worship the river's danger (accept the metaphysical fear).

  This leads to a necessary revision in how we teach and understand the history of analytic philosophy. We should not present Frege's anti-psychologism as the final word on the nature of logic. We should present it as a corrective that swung too far. Later philosophers—Wittgenstein in his later years, Sellars, Brandom, Haugeland—have shown us that we can have objectivity without the Third Realm. We can have norms that are objective because they are social, not because they are mystical. We can have truth that is binding without being authoritarian.

  Frege thought that if logic was human, it was relative. The diary suggests he thought that if politics was human, it was degenerate. We now know better. Objectivity is a human achievement, secured by our commitment to holding each other accountable, not by fleeing to a ghostly realm. Frege's logic helps us hold that accountability, but his metaphysics tries to absolve us of it.

  ### The Heidegger Distinction

  Does this generalize to Heidegger? I argue no. The Frege case is distinct, and in a way, more tragic.

  Heidegger's philosophy *is* his politics. *Being and Time* and his later works are deeply entangled with his conception of destiny, folk, and soil. You cannot easily extract "Heideggerian ontology" from "Heideggerian Nazism" because the ontology itself privileges rootedness and destiny in a way that maps directly onto his nationalist politics. To use Heidegger is to risk breathing in the air of his ideology.

  Frege is different. Frege's philosophy was an *attempt to escape* politics. He wanted logic to be the one place where politics couldn't touch. The tragedy is that his fear of politics *shaped* the escape route. He built a bunker and called it the Third Realm.

  With Heidegger, the contamination is in the soil. With Frege, the contamination is in the architect's fear, not the building's structure. We can inhabit Frege's building safely, provided we open the windows and let the human air back in. We must acknowledge that the "view from nowhere" Frege championed was, ironically, the view from a very specific, very frightened somewhere.

  ### Conclusion

  We should not cancel Frege. We should not remove his name from the lecture halls. But we must stop treating him as a saint of pure reason. The diary teaches us that the pursuit of absolute objectivity can itself be a subjective pathology.

  Frege gave us the language of modern logic, and for that, we owe him an unpayable debt. But the diary demands we pay a tax on that debt: we must not follow him into his metaphysical exile. We must use his logic to think more clearly about the human world, not to escape it. We must accept that logic is a tool for humans, not a revelation from the gods. Frege wanted to save truth from us. We must save truth *for* us.
