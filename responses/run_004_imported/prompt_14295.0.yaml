answer: |-
  **Yasnaya Polyana, 1906. The terrace overlooks the birch orchard. LEO TOLSTOY, in his peasant blouse, pours tea. Opposite him sits ARTHUR STERLING, a young Englishman in a stiff collar, clutching a worn copy of the Folio.**

  **Tolstoy:** You have come a long way, Mr. Sterling, to defend a poet who cannot defend himself. But I must tell you plainly: to praise *King Lear* is to praise a world without God. It is not merely bad art; it is immoral art.

  **Sterling:** I come with respect, Count, not to quarrel. But if art is the business of truth, how can a play that strips a man to his bare humanity be immoral? Lear on the heath is the truth of suffering.

  **Tolstoy:** Suffering without purpose is not truth; it is chaos. True art must transmit a religious perception of life. It must unite men in a common feeling of brotherhood. *Lear* leaves the soul desolate. It offers no light, only the storm.

  **Sterling:** But is not the pity we feel for Lear a form of brotherhood? When we weep for him, are we not united in love for our fellow man? That feeling is infectious, which is your own criterion for good art.

  **Tolstoy:** Infection is not enough. A song may infect men with lust, or a sermon with hate. The feeling must be Christian. Shakespeare's characters do not speak from the soul; they speak from the theatre. They are pompous, unnatural. No peasant in my fields speaks in riddles.

  **Sterling:** They do not speak in riddles; they speak in poetry. But consider the peasant, Count. He knows betrayal. He knows the cruelty of children to parents. He needs no simple fable to understand that pain. Shakespeare trusts the common man to feel deeply.

  **Tolstoy:** Shakespeare trusts nothing but his own genius, which was a phantom. Look at my own earlier works, *War and Peace*, *Anna Karenina*. I wrote them for the aristocracy, to amuse. They are as false as *Lear*. I renounced them because they did not serve the people.

  **Sterling:** With humility, sir, I must challenge that renunciation. By your own definition in *What Is Art?*, *Anna Karenina* succeeds. It infects the reader with a profound sense of life. If you condemn *Lear* for lacking sincerity, why condemn *Anna* which bleeds with it?

  **Tolstoy:** Because *Anna* was written in vanity. I sought glory, not salvation. A man may paint a beautiful icon while praying to a devil. The technical skill is there, the infection is there, but the religious consciousness is absent. It is a golden cup filled with poison.

  **Sterling:** But if the cup moves the drinker to compassion, does the gold not matter? You say art must be accessible. *Lear* has been performed for kings and clowns alike for three centuries. Is not that endurance proof of its universality?

  **Tolstoy:** Endurance is only habit. The Church endured corruption for centuries. The question is: does it make men better? Does *Lear* teach a man to forgive his enemy? No. It teaches him that the gods are indifferent. That is a lie.

  **Sterling:** It teaches that the gods may be silent, so man must be the god. It places the burden of mercy on us, not the heavens. Is that not a higher religious demand than a simple parable?

  **Tolstoy:** It is a burden too heavy for the weak. Art should be a guide, not a labyrinth. When I write now, I write tales the ploughman can read by candlelight. That is sincerity. To hide truth in metaphor is to hoard bread while the children starve.

  **Sterling:** But the ploughman also dreams, Count. He also fears the dark. To deny him the complexity of his own inner life is to treat him like a child. Shakespeare gives him the storm; you give him the shelter. We need both.

  **Tolstoy:** We need the shelter first. You speak of complexity as if it were virtue. But God is simple. Love is simple. To complicate them is the work of the intellect, not the spirit. You are an academic; I am a Christian. We speak different tongues.

  **Sterling:** I am a scholar of the human heart, which is never simple. If your new art cannot accommodate the tragedy of Lear, perhaps the theory is too narrow, not the play too flawed.

  **Tolstoy:** (Pouring more tea, his hand trembling slightly) The theory is the plough. The play is the weed. You may admire the weed's wild flower, but it chokes the grain. I choose the grain.

  **Sterling:** And I fear that without the wild flower, the grain has no scent. We shall not agree, Lev Nikolayevich. But I thank you for the tea.

  **Tolstoy:** And I for your passion. But remember: when the winter comes, it is the grain that saves, not the flower. Go in peace.
