answer: |-
  Friends, family, colleagues, and students.

  For those of you who knew Miriam only as a mother, a sister, or a friend, you may not know that for the last six years, I spent my Tuesday nights sitting in a circle with her, wrestling with ancient Sanskrit logic. And for those of you who knew her primarily as a philosopher, you know that Miriam believed clarity was a form of kindness. But to the rest of you, I should say: Miriam could be a minor terror at potlucks.

  If someone, trying to be comforting, would say something like, "Well, in a spiritual sense, we are all one," or "She exists now in a higher plane," Miriam would gently but firmly dismantle the sentence. She spent her life studying the *Mūlamadhyamakakārikā*, the root verses on the Middle Way by Nāgārjuna. She taught us that reality does not fit into four boxes: that things exist, that they don't exist, that they both exist and don't, or that they neither exist nor don't. She called this the *catuṣkoṭi*, the tetralemma. And she insisted that using "both" or "neither" as a clever escape hatch was just a way to smuggle comfort into a place where it didn't belong.

  She left a note among her papers regarding this gathering. It said, roughly: *Do not claim I persist in your memories, for that makes a ghost of a self. Do not claim I am annihilated, for that makes a substance of nothingness. Do not offer me to the gods of metaphysics.*

  It is a difficult request. Because we are here to grieve. And grief, conventionally, feels like the loss of something real.

  So, how do we speak truthfully about Miriam, without violating the rigor she loved, and without denying the love we feel?

  We do it by honoring the distinction she taught us: the Two Truths.

  There is the ultimate truth, the level of analysis where we look for the essence of "Miriam" and find no fixed, independent self that can be located. There is no soul hiding behind the eyes, no permanent nucleus that has now departed. If we look for her inherently, she is not found.

  But there is also the conventional truth. And at this level, Miriam was undeniably real. She was real in the way a storm is real, or a conversation is real. She was a convergence of causes and conditions: her history, her intellect, her kindness, her sharp tongue, and her relationship to us.

  To her family: I know that philosophical precision can feel cold when you are missing someone. But I think Miriam's philosophy was not a way to distance herself from the world, but a way to enter it more fully. Because she knew nothing had a fixed, permanent self, she didn't try to freeze moments in time. She didn't try to possess us. She showed up. She made the tea. She graded the papers. She laughed at her own jokes.

  In the conventional world, cause and effect are ironclad. Miriam acted, and the world changed. She spoke, and we listened. She corrected us, and we thought more clearly. That causal impact has not vanished. When I catch myself making a sloppy argument and hear her voice in my head correcting me, that is not a ghost. That is a causal ripple. It is the evidence that a life was lived here.

  To the students and colleagues: We know that she would not want us to reify her legacy. We cannot say "Madhyamaka continues through us" as if we are now the vessels of a substantial truth. We are not vessels. We are just the next link in the chain of dependence. We study because she taught. We question because she questioned. The practice continues, but there is no "practice" apart from the doing of it.

  To the friends and family who never cared for the logic: You knew the warmth that underwrote the rigor. You know that her refusal to accept comfortable lies was actually a profound respect for the truth of your shared life. She loved you enough to not lie to you about the nature of reality, even when reality is difficult.

  And it is difficult. I want to acknowledge that.

  There is a temptation, in circles like ours, to use emptiness as a shield against pain. To say, "Well, since nothing is real, my grief isn't real either." Miriam would have been the first to call that out as spiritual bypassing. Emptiness does not negate suffering; it explains its texture.

  The pain we feel today is real at the level of convention. It is the friction of conditions changing. The conditions that allowed us to sit with her, to argue with her, to be loved by her, have dissolved. That dissolution hurts. To deny that pain would be to deny the conventional truth of our interdependence. We are woven together. When one thread is pulled, the fabric tightens elsewhere. We feel that tightening.

  So, we are left in a tension.

  At the ultimate level, there is no one who has died, and no one who is mourning.
  At the conventional level, we are missing her terribly.

  Miriam taught us to hold these two truths without letting them collapse into each other. We don't solve the tension. We inhabit it.

  If we say she is "gone," we imply she was here as a fixed object that has now been removed.
  If we say she "remains," we imply a permanence she spent her life deconstructing.
  If we say "both" or "neither," we are just playing word games to soothe the ache.

  So perhaps we simply say: The conversation has changed.

  The specific conditions that constituted Miriam's presence in this room have ceased. But the space she occupied is not empty in the sense of a void; it is empty in the sense of being open. It is open for us to continue the work she valued: looking at the world without flinching, treating each other with precision and care, and recognizing that our connections are fragile precisely because they are dependent.

  She asked us not to smuggle a self in through the back door. So I will not tell you she is watching us. I will not tell you she is at peace. I will tell you that the questions she asked are still here. The silence she pointed to is still here. And the love that motivated her rigor is still active in the way we treat one another today.

  In her final weeks, Miriam was exacting to the end. She did not want a monument of words. She wanted the work to stand.

  So, let us honor her by not settling for easy answers. Let us honor her by feeling the grief fully, without needing to solidify it into a story about where she "went." Let us honor her by continuing to study, continuing to meditate, and continuing to be kind, knowing that none of it is permanent, and all of it matters.

  The tea is still hot. The verses are still on the table. The circle is open.

  Thank you.
