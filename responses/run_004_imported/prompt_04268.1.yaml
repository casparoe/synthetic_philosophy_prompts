      *   *Tone:* Philosophical, empathetic, analytical, neutral but decisive.
      *   *Key Concepts to Weave In:* Resource Egalitarianism, Welfare Egalitarianism, Luck Egalitarianism, Capability Approach, Expensive Tastes Objection.

