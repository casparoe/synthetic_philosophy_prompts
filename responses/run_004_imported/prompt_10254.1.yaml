answer: |-
  **Setting:** *A slightly messy living room, 1:30 AM. Empty coffee mugs and a half-finished bottle of wine on the table. Mark (Epistemicist) is leaning forward; Sarah (Supervaluationist) is curled up in the armchair, looking tired but alert.*

  **Mark:** Okay, pick up where we left off. You said supervaluationism saves us from the absurdity of a sharp cutoff. I say it's a shell game. You get rid of a sharp boundary for "tall," fine. But you need a boundary for "admissible precisification."

  **Sarah:** I don't need a *sharp* boundary for admissibility. That's the point. The set of admissible precisifications is itself vague. There are clear cases of precisifications that are admissible, clear cases that aren't, and a penumbra in between.

  **Mark:** But to define "supertrue," you say a sentence is true if it's true on *all* admissible precisifications. "All." That's a universal quantifier. Either a precisification is in the set or it isn't. If there's a penumbra of admissibility, then you need a meta-language to handle *that* vagueness. And if you keep going up the hierarchy, Sarah, eventually you have to stop. If you stop anywhere, there's a hard edge. If you don't stop, you have an infinite regress. Either way, the sharpness is still there. You've just moved it from the object language to the meta-language.

  **Sarah:** Okay, I grant that. Let's say, for the sake of argument, there is a sharp boundary at the meta-level regarding which precisifications count. Why is *that* so much worse than your view? On your view, there's a specific number of hairs—say, 4,328—where adding one more makes a non-heap a heap. You're saying reality or language secretly dictates that number, we just can't know it. That's magic. My "sharpness" is just a feature of how we model semantic indecision. It's not a fact about the world.

  **Mark:** It's not magic, it's classical logic. Bivalence holds. $P$ or not-$P$. But your "semantic indecision" still requires a cut. Think about the "Definitely" operator. $Dp$ is true if $p$ is true on all admissible precisifications. So, take a guy, Dave. He's borderline tall. So $D(\text{Dave is tall})$ is false. But take Mike, who is 6'5". $D(\text{Mike is tall})$ is true. There has to be a transition point between the Daves and the Mikes. A guy who is $D$-tall and his neighbor who is not $D$-tall. That's a sharp boundary in the extension of "Definitely tall."

  **Sarah:** Not necessarily. Because "admissible" is vague, the operator $D$ is vague. So there isn't a sharp transition between $Dp$ and $\neg Dp$.

  **Mark:** But you just said "supertrue" means true on *all* admissible precisifications. If "admissible" is vague, then "supertrue" is vague. But then what logic are you using? If "supertrue" is vague, then the law of excluded middle fails for *that* concept. You're trying to have your cake and eat it too. You want to save classical logic for the object language, but you smuggle in vagueness at the level of truth itself.

  **Sarah:** I'm not smuggling it. I'm acknowledging it. Look, the motivation for my view is to match the phenomenology. When I look at Dave, who's 5'11", it feels wrong to say "It is true that Dave is tall." It also feels wrong to say "It is false." Your view forces me to say one of those is the case, and I just don't know which. That implies there's a fact of the matter. I don't think there *is* a fact of the matter.

  **Mark:** But what are you asserting when you say "Dave is tall"? If it's not true, and not false, then what is it?

  **Sarah:** It's indeterminate. But—and here's the beauty of supervaluationism—I can still say "Either Dave is tall or Dave is not tall." That sentence is supertrue. It's true on every precisification. So I keep classical logic, like Excluded Middle, without committing to bivalence for every atomic sentence.

  **Mark:** That's the other thing that drives me nuts. You accept $P \lor \neg P$ as true, but you deny that either $P$ is true or $\neg P$ is true. That's not classical logic, Sarah. That's a parody of it. In classical logic, a disjunction is true *because* one of the disjuncts is true. You're saying the disjunction is true even though neither disjunct is. That breaks the link between truth conditions and logical connectives.

  **Sarah:** It breaks the link between *supertruth* and the connectives, sure. But it preserves the validity of inferences. If I accept the premises, I must accept the conclusion. That's what matters for reasoning. Your view preserves bivalence but makes knowledge impossible. You're saying there's a fact about whether 4,328 hairs make a heap, but that fact is unknowable in principle. That's worse than my "broken" disjunctions. That's skepticism about meaning itself.

  **Mark:** It's not skepticism. It's sensitivity. Our concepts are sensitive to usage, and usage shifts slightly. The cutoff moves, but at any frozen instant, there is a cutoff. The reason we can't know it isn't magic; it's because the factors determining it are too complex and unstable for us to track.

  **Sarah:** Unstable how? If the meaning of "heap" is fixed enough to have a cutoff, why is it too unstable to know? You're positing a precision that our linguistic practices simply don't support. We never agreed on a cutoff. We never intended one. Why posit one?

  **Mark:** Because logic demands it. If you deny it, you have to change logic. You're changing logic to save intuition. I'm keeping logic and explaining away the intuition. The intuition that there's no cutoff comes from the fact that we can't locate it. Just because you can't find the line doesn't mean it isn't there.

  **Sarah:** But on my view, the "line" is the set of admissible precisifications. And I'm telling you, the boundary of *that* set doesn't have to do the same work your cutoff does. Your cutoff determines truth directly. My boundary determines which models count. It's a modal difference.

  **Mark:** But it still results in a sharp transition in truth values somewhere in the system. Let's talk about ordinary truth talk. This is where I think you really lose the plot. If I ask you, "Is Dave tall?" and you say, "It's neither true nor false," I'm going to think you're speaking a different language. In ordinary conversation, if it's not true, it's not the case.

  **Sarah:** In ordinary conversation, we also don't talk about precisifications. But when we get pressed, when we hit the borderline, our intuitions wobble. We hesitate. My theory explains the hesitation. Yours says we're just ignorant. But I don't feel ignorant about Dave. I feel like the question doesn't have a yes/no answer.

  **Mark:** You feel that way because you're conflating "I don't know" with "There is no fact." Epistemicism says the hesitation is rational because the margin for error is so high. If you claim to know Dave is tall, you could easily be wrong because a tiny shift in usage changes the cutoff. So you withhold judgment. That explains the hesitation without giving up bivalence.

  **Sarah:** But it doesn't explain why "Dave is tall and Dave is not tall" feels contradictory, while "Dave is tall or Dave is not tall" feels tautological, if neither disjunct has a truth value. Wait, no—I accept the tautology. You accept the contradiction is false. We agree there. We disagree on why.

  **Mark:** We disagree on the cost. Your cost is saying "Supertruth" isn't really truth. If "Dave is tall" isn't true, I can't assert it. But if "Either Dave is tall or not" is supertrue, can I assert that?

  **Sarah:** Yes.

  **Mark:** But if I assert a disjunction, I'm normally implying I have grounds for one of the disjuncts, or at least that one of them obtains. If neither obtains, asserting the disjunction feels hollow. It's like saying "Either the present King of France is bald or he isn't," when there is no King of France.

  **Sarah:** But there *is* a Dave. And he *is* either tall or not. The property is there, the object is there. The mapping is what's loose. Look, Mark, let's be real. Even if I concede that there's a sharp boundary to the set of admissible precisifications... so what? That boundary is about *representations* of the world, not the world itself. Your boundary is in the world, or in the meaning constituting the world. Mine is in the model space. That's a huge metaphysical difference.

  **Mark:** Is it? If the semantics of our language requires a sharp boundary in the model space to function, and that model space is supposed to capture our meaning... then the sharpness is in the meaning. You haven't exorcised the ghost; you've just put it in a different room. And you've locked the door so you don't have to look at it.

  **Sarah:** I haven't locked it. I've just pointed out that the ghost in my room is a lot smaller. It's a ghost about *precisifications*, not about *heaps*. I'm comfortable with vagueness in the meta-language. Are you comfortable with unknowable facts in the object language?

  **Mark:** I'm comfortable with logic. You're sacrificing the connection between truth and assertibility. If "Dave is tall" isn't true, I shouldn't assert it. But sometimes, in a borderline case, it's perfectly appropriate to say "He's tall enough."

  **Sarah:** "Tall enough" is contextual. That's a different predicate.

  **Mark:** It shows we treat these predicates as gradable and flexible, not as having hidden switches.

  **Sarah:** And supervaluationism captures that flexibility via the range of precisifications! That's why I'm a supervaluationist. It models the flexibility. You model it as ignorance.

  **Mark:** And I think your model fails because it can't account for higher-order vagueness without collapsing into epistemicism eventually. If it's vague where the admissible precisifications end, you need a precisification of *that*. And so on.

  **Sarah:** Maybe I do. Maybe it's vague all the way up.

  **Mark:** Then you don't have a definition of truth. You have a vague notion of a vague notion.

  **Sarah:** Better than a sharp notion of a fact that doesn't exist.

  **Mark:** *Sighs and reaches for the wine.* We're going in circles.

  **Sarah:** *Pours a bit into his glass.* We are. But at least we agree Dave is 5'11".

  **Mark:** Is that true?

  **Sarah:** On every admissible precisification of "5'11"", yes.

  **Mark:** See? You can't help yourself. You want to say "Yes."

  **Sarah:** Because it's supertrue.

  **Mark:** And "Dave is tall"?

  **Sarah:** ...I want to say "Maybe."

  **Mark:** And I want to say "True or False."

  **Sarah:** And neither of us knows why the other is so stubborn.

  **Mark:** Exactly. Cheers to unknowable boundaries.

  **Sarah:** Cheers to admissible ones.

  *They clink glasses, neither looking entirely satisfied.*
