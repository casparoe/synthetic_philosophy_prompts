      *   *Shaky:* The translation/interpretation of *syat*. This is crucial. It's not "maybe," it's "conditionally." The Relativism concession. This is the biggest philosophical miss. Jainism claims objective truth accessible via multiple paths, not that all paths are equally true in a relativist sense.

