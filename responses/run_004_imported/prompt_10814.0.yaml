answer: |-
  Here is the core comparison broken down for your section. You can think of this as a "cheat sheet" for the analogy, the friction points, and the metaphysical worries.

  ### 1. The Core Analogy: Where It Holds Up
  Ord's argument is structurally identical to Ricardo's theory of **Comparative Advantage**.

  *   **Economic Trade:** Country A is better at making wine than cloth. Country B is better at cloth than wine. Even if Country A is better at *both*, total output increases if A specializes in wine and B in cloth, and they trade. The "gain" comes from differing **opportunity costs**.
  *   **Moral Trade:** Agent A cares more about Cause 1 (e.g., animal welfare) than Cause 2. Agent B cares more about Cause 2 (e.g., global poverty) than Cause 1. Even if Agent A thinks *both* causes are good, total "moral value" increases if A specializes in Cause 2 (to help B) and B specializes in Cause 1 (to help A). The "gain" comes from differing **moral weights/credences**.

  **Why it works:**
  *   **Pareto Improvement:** In both cases, the goal is to make both parties better off by their *own* standards. In economics, it's utility/preferences; in moral trade, it's **expected moral value**.
  *   **Subjective Valuation:** You don't need to agree on the *objective* value of the goods/actions. You only need to agree that *you* value what the other person produces more than what you would have produced yourself in that specific margin.

  ### 2. Where the Analogy Breaks Down
  The economic metaphor hits friction when you move from preferences to moral constraints.

  *   **Deontological Constraints (The "Forbidden Action" Problem):**
      *   *Economics:* There are rarely absolute prohibitions on production methods (ignoring regulation). If it's efficient, you do it.
      *   *Ethics:* Many moral theories include agent-relative constraints (e.g., "Do not lie," "Do not kill"). If my moral theory says Action X is *forbidden*, I cannot perform X even if it helps you achieve a great good. I cannot "trade" a violation of a categorical imperative. Economic trade assumes fungibility; moral trade hits a wall with non-fungible constraints.
  *   **Transferability:**
      *   *Economics:* I can give you my apple. The utility transfers with the object.
      *   *Ethics:* I cannot give you my "moral merit." I have to *perform* the action you value. This creates coordination costs. If I promise to donate to your charity, but you don't trust me, the trade fails. Moral trade requires higher trust mechanisms than spot-market economic trade.
  *   **Rivalry:**
      *   *Economics:* Goods are often rivalrous (if I eat the bread, you can't).
      *   *Ethics:* Moral actions are often non-rivalrous (my voting doesn't physically stop you from voting), though resources (time/money) are rivalrous. This changes the calculus of "specialization."

  ### 3. The "Currency" Question (Incommensurability)
  **Does moral trade need a common currency like prices?**
  **Short answer:** Yes, but the currency is **Subjective Expected Moral Value**, not objective utility.

  *   **The Problem:** If you are a Utilitarian (value = happiness) and I am a Kantian (value = duty), we seem to be measuring in different units. How do we exchange "units of duty" for "units of happiness"?
  *   **Ord's Solution (Moral Uncertainty):** Moral trade generally relies on the premise that neither party is 100% certain their theory is correct.
      *   I am 90% Kantian, 10% Utilitarian.
      *   You are 90% Utilitarian, 10% Kantian.
      *   We can trade because *according to my own 10% credence*, your action has value. I am not adopting your currency; I am hedging my bets using my own probability distribution.
  *   **The "Currency":** The common denominator is **rational choice under uncertainty**. We don't need to agree on what is *Good*; we only need to agree on how to maximize *Expected Value* given our uncertainty. If you are 100% dogmatic in your theory, trade is impossible (just as trade is impossible if I value apples at \$0 and you value them at \$100 but refuse to sell).

  ### 4. Realism vs. Anti-Realism
  **Your worry:** *Doesn't a Moral Realist just do what's objectively right? Trading sounds like compromising the truth.*

  **The Counter-Argument:**
  *   **Realism $\neq$ Certainty:** A moral realist believes there are objective moral facts, but they do not claim to have perfect access to them. A realist can admit, "I believe X is objectively right, but I acknowledge a 15% chance I am wrong."
  *   **Epistemic Humility:** Moral trade is actually a tool for **fallibilist realists**. If there is an objective moral truth, but we are unsure what it is, cooperating with someone who has a different "moral map" increases the likelihood that *someone* is doing the objectively right thing.
  *   **Anti-Realism:** If you are an anti-realist (morality is just preferences), moral trade collapses into standard economic trade. It becomes easier, but less "moral."
  *   **Conclusion:** The idea does *not* require anti-realism. It requires **moral uncertainty**. A dogmatic realist (100% certainty) cannot trade, but a humble realist (who acknowledges epistemic limits) has a strong rational incentive to trade.

  ### Summary for Section
  1.  **Analogy:** It holds on the logic of **comparative advantage** (differing marginal valuations lead to gains from specialization).
  2.  **Friction:** It breaks on **deontological constraints** (some actions are non-fungible/forbidden) and **trust/coordination**.
  3.  **Currency:** No objective currency needed; the common metric is **Subjective Expected Value** derived from moral uncertainty.
  4.  **Metaphysics:** Compatible with **Realism**, provided the realist admits they might be mistaken about what the objective truth is. Dogmatism kills trade, not realism.
