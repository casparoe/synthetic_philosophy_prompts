answer: |-
  Here is a sequence of eight questions designed to progressively tighten the pressure on the speaker's semantic retreat, incorporating your specific requirements on vagueness and biological individuality. They are ordered to move from semantic clarification to internal consistency, then to external scientific coherence, and finally to the metaphysical cost of the view.

  **1. The Semantics of "Nearly"**
  "You suggest that ordinary sentences like 'there are chairs' are 'nearly as good as true.' Could you clarify the truth-conditional status of these claims? If they are strictly false, what is the specific proposition that *is* true that makes them 'nearly' so? Is it a paraphrase into 'simples arranged chairwise,' or is it a claim about pragmatic utility?"
  *   **Follow-up:** "If it's a paraphrase, doesn't that imply the original sentence shares the same truth-conditions as the paraphrase, which would make it true? If it's just utility, aren't you offering a pragmatic defense of an error theory?"

  **2. The Universalism Parallel**
  "A Universalist can also say 'there are chairs' is shorthand for 'simples arranged chairwise,' but for them, that entails a chair *exists*. If your paraphrase conditions are identical to the Universalist's, but you deny the existence of the chair, isn't your view just Universalism with a restrictive label on the word 'exists'?"
  *   **Follow-up:** "If you say the difference is ontological rather than semantic, does that ontological difference make a difference to the truth conditions of any sentence we can actually utter?"

  **3. The Vagueness Argument (Internal Consistency)**
  "Van Inwagen rejects 'contact' or 'fastening' as composition conditions partly because they invite borderline cases that lead to vagueness in existence, which he argues is impossible. But 'constituting a life' seems to suffer the exact same fate. Embryogenesis and brain death are not instantaneous; there are temporal intervals where it is indeterminate if a life is occurring. Why doesn't your own vagueness argument rule out 'life' as a composition condition?"
  *   **Follow-up:** "If you reply that 'life' is a natural joint and contact is not, does that mean vagueness is permissible for natural kinds but not artificial ones? If so, isn't that an admission that the vagueness argument is really just an intuition pump for organicism?"

  **4. Biological Individuality (External Coherence)**
  "Even if we grant 'life' is a natural joint, contemporary biology is deeply unsettled on what counts as a single organism. Consider siphonophores or slime molds: biologists disagree on whether these are colonies or single individuals. If your metaphysics grounds composition in biological individuality, does your ontology become contingent on unresolved empirical debates?"
  *   **Follow-up:** "If you say metaphysics can stipulate where biology leaves off, aren't you effectively admitting that 'constituting a life' is not doing the metaphysical work, but rather your own philosophical stipulation is?"

  **5. The Homeostasis Boundary**
  "You draw the line at biological life. But many artifacts exhibit homeostatic feedback loops comparable to simple organisms (e.g., a thermostat or a self-repairing drone). What is the metaphysical difference between the activity of simples constituting a biological life and the activity of simples constituting a self-regulating machine?"
  *   **Follow-up:** "If the difference is merely historical (evolution vs. design), why should history determine whether composition occurs *now*? Does a cloned organism compose an object while a qualitatively identical synthetic organism does not?"

  **6. The Truth-Makers for 'Arranged F-Wise'**
  "To say simples are 'arranged chairwise' requires conditions for when that predicate applies. If those conditions don't involve the existence of a chair, what *do* they involve? Do they involve the intentions of observers? If so, isn't your view mind-dependent in a way you usually reject?"
  *   **Follow-up:** "If the conditions are mind-independent, then there is a fact of the matter about the arrangement. Why is that fact not sufficient for composition, given that you already accept the simples exist?"

  **7. The Cost of the Error Theory**
  "You retain ordinary talk via the 'nearly true' retreat to avoid revisionary costs. But you still maintain that strictly speaking, we are never sitting on chairs, only on simples. Given that the semantic output is practically identical to realism, what theoretical virtue is gained by maintaining the strict ontological falsehood?"
  *   **Follow-up:** "Is the gain simply avoiding Universalism? If so, is avoiding a proliferation of objects worth positing a systematic error in all ordinary material object discourse?"

  **8. The Killer Question (Explanatory Idleness)**
  "If ordinary sentences are 'nearly as good as true,' they presumably function correctly in all our explanations, predictions, and causal claims. If the 'strictly false' ontology changes nothing about the truth of our causal claims or the success of our science, in what sense is the ontology *substantive* rather than *verbal*? Are you not simply redefining 'existence' while leaving the world exactly as the Universalist describes it?"
  *   **Follow-up:** "If you cannot point to a single phenomenon that your ontology explains *better* than Universalism or Nihilism, other than satisfying a specific intuition about 'life,' haven't you reduced metaphysics to terminology management?"
