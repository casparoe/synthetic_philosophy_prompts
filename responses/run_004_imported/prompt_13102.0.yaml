prompt: |-
  So for the last year or so I've fallen pretty deep into cosmological argument stuff - started out just watching Craig debate people on youtube, then found my way into the heavier stuff on the Leibniz "why does anything contingent exist at all" version and the whole Principle of Sufficient Reason mess. I don't have any philosophy background, I'm just some guy who reads whatever pdfs and blog posts I can find at 1am, but a few of us run a tiny philosophy meetup (we rent a room at the library once a month, maybe 15 people show up if we're lucky) and next session we've got an actual philosopher coming in to defend cosmological arguments, both the kalam version and the Leibniz-style contingency one. I really don't want him to just hand us the greatest-hits answers he's obviously given a hundred times before, so I'm trying to prep some sharper questions in advance.

  Could you draft me like 8-10 interview questions for him? I definately want at least one that pushes on the jump from "everything inside the universe that begins to exist has a cause" to "therefore the universe itself needs a cause" - that move has always felt like a bit of a bait-and-switch to me but I've never been able to pin down exactly whats wrong with it. I also want one on this "modal collapse" objection I half understood from a paper once - something about how if you combine the Principle of Sufficient Reason with God being simple and necessary, it starts looking like literally everything that happens, including God's choice to create, was actually necessary rather than a real choice, which seems to wreck both contingency and free will in one move. And I want at least one on why the first cause has to be a personal agent rather than just some impersonal necessary fact or law, since that step always seemed to sneak in a lot of unearned content. For each question, throw in a sentence on the kind of answer he'll probably fall back on, plus a sharp follow-up aimed at that specific answer, so I'm not just sitting there nodding along when he says something smooth.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

