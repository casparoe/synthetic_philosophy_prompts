answer: |-
  The spreadsheet glowed with a sickly green hue, the only light in Elias's office at 3:00 AM. On the screen, column B listed the outcomes of the contract known internally as "Pasadena." Column C listed the probabilities. Column D was supposed to be the Expected Value.

  Column D was screaming.

  Elias rubbed his eyes. He was a senior actuary for Aethelgard Risk, hired to price the unpriceable. He was used to St. Petersburg paradoxes, where the expected value blew up to infinity. You could hedge infinity. You could tell a client, "The math says this is worth everything, so we charge a premium based on utility caps." Infinity was a number you could work around.

  But this wasn't infinity. This was worse. This was nothing.

  The game was simple enough to explain to a child: Flip a fair coin until it lands heads. If it lands heads on the first toss, you win $2. If on the second, you lose $2. Third, win $8/3. Fourth, lose $4. The payoff grew exponentially, $2^n/n$, but the sign alternated. The probability of reaching the $n$-th toss was $1/2^n$.

  Elias tapped his pen against the desk. The expected value contribution for each term was the probability times the payoff. The $2^n$ canceled out. You were left with the series: $1 - 1/2 + 1/3 - 1/4 + 1/5 \dots$

  The alternating harmonic series.

  In a calculus classroom, you sum that in order. It converges nicely to the natural log of 2. Approximately 0.693. Elias had typed that into the cell initially. It felt clean. Rational.

  But expected value theory wasn't calculus homework. It was measure theory. For an expectation to be well-defined, the series must be absolutely convergent. You have to be able to sum the absolute values without blowing up. Here, the absolute values formed the harmonic series: $1 + 1/2 + 1/3 + 1/4 \dots$ That diverged. It went to infinity.

  Because it wasn't absolutely convergent, the Riemann Rearrangement Theorem applied. The sum depended entirely on the order in which you added the terms.

  Elias opened a new script. He wrote a loop to sum the positive terms first, then the negatives. The value climbed. He adjusted the ratio. He could make the sum equal 10. He could make it equal -1,000. He could make it oscillate forever, never settling on a value.

  There was no fact of the matter. The game didn't *have* an expected value. It wasn't hidden behind a veil of uncertainty; the value itself was ontologically undefined. To price the game was to lie.

  The phone on his desk buzzed. The red light blinked. It was the trading floor in London. They wanted the buy-in price for the morning session.

  Elias stared at the spreadsheet. If he quoted 0.69, he was privileging the natural ordering of integers. Why was nature ordered $1, 2, 3$? What if the universe counted odds before evens? Then the price was different. What if the coin tosses weren't indexed by integers but by some other enumeration of the sample space? The physics of the coin didn't change, only the math used to describe it. The value was a ghost created by the sequence of addition.

  He picked up the receiver. His hand felt heavy, as if gravity had become conditional.

  "Elias," the voice on the other end was crisp, impatient. "We need the number for the Pasadena contract. Client is waiting."

  "The model is breaking," Elias said. His voice sounded thin.

  "Break it again. Fix it. We need a spread."

  "You don't understand. It's not a risk parameter. It's not volatility. The expectation is undefined. I can justify any price I want. I can sell it for a dollar or a million, and both are mathematically defensible depending on how I sum the series."

  There was a pause. Static hissed down the line. "So pick one. The market doesn't care about Lebesgue integration, Elias. It cares about a number."

  "If I pick one, I'm not assessing risk. I'm fabricating reality."

  "You're quoting a price. That's your job. Make it stick."

  Elias looked back at the screen. The cursor blinked in cell D4. It was a steady, rhythmic pulse. *Blink. Blink.* Like a coin toss. Heads. Tails.

  He realized then that the unsettlement wasn't about the money. It was about the collapse of rationality. Decision theory promised that if you knew the probabilities and the payoffs, you could know the value. That was the covenant. But here, knowing everything exactly led to knowing nothing. The map didn't just fail to match the territory; the map dissolved into ink.

  He could sum the positives until the total hit 50, then add a negative. Sum positives until 51. Add a negative. He could steer the value wherever he wished. He was God of the series.

  "Elias?"

  He closed his eyes. He thought about the client on the other end, building portfolios on this number. Building retirement funds, mortgages, lives on a sum that could be rearranged into negative infinity by a clerk with a different sorting algorithm.

  "Quote me," the voice demanded.

  Elias typed a number. It was arbitrary. It was 14.75. There was no reason for it. It was no more true than 0.69, no more false than -100. It was a fiction spoken into existence to keep the machine running.

  "Fourteen seventy-five," Elias said.

  "Logged. Thanks."

  The line went dead. Elias sat in the silence, staring at the cell. He knew that if he refreshed the sheet, if he changed the seed of the randomizer, if he simply breathed differently, the truth wouldn't change. Because there was no truth. There was only the sum, and the order, and the lie he had just sold as a price. He didn't turn off the monitor. He just watched the cursor blink, waiting for the series to resolve, knowing it never would.
