answer: |-
  You are absolutely onto something real. In fact, you have identified a fundamental flaw in how many AI systems are evaluated, known in machine learning as the **Ground Truth Problem** or **Label Bias**.

  You are not missing why the number should reassure you; rather, you have correctly identified why the number *should not* reassure you. Here is a breakdown of why your intuition is technically sound and why that 99% figure is likely misleading in the context you care about.

  ### 1. The AI is Learning to Mimic Humans, Not Detect Truth
  Supervised machine learning models (which this tool is) learn by finding patterns that map inputs (video/audio/keystrokes) to outputs (labels provided by humans).

  *   **The Training Loop:** The AI is trained to predict what the human reviewer would say.
  *   **The Ceiling:** If the human reviewers only label "obvious" cheating (like a phone in frame), the AI is mathematically penalized if it flags something subtle that the human missed. During training, if the AI flags a subtle cheat but the human label says "clear," the AI is told it is *wrong*.
  *   **The Result:** The AI becomes an automated version of the human reviewer's limitations. It cannot learn to detect cheating that is invisible to the humans who created the training data.

  ### 2. What the 99% Actually Measures
  When the company claims "99% accuracy," they are almost certainly measuring **agreement with the human labels**, not **detection of actual cheating**.

  *   **Metric:** "In 99% of cases, the AI made the same decision the human reviewer did."
  *   **Reality:** If the human reviewers missed 50% of the sophisticated cheating in that dataset (because it was too hard to see), the AI also missed it, and the accuracy score remains 99% because the AI agreed with the (flawed) human judgment.

  This is a classic case of a **proxy metric**. The school wants to know "Is this student cheating?" but the metric answers "Does this AI agree with our staff?"

  ### 3. The "Invisible Cheating" Blind Spot
  Your specific hypothesis is spot on: *"For a method clever enough to fool a human reviewer too, I don't see what in training would have taught it to flag that case."*

  In machine learning terms, this is a lack of **positive signal**. For the AI to learn that "subtle tab-switching pattern X" equals "cheating," there must be examples in the training data where:
  1.  That pattern occurred.
  2.  A human labeled it as "cheating."

  If the cheating method is sophisticated enough to fool the human reviewer, condition #2 never happens. The data point enters the training set labeled as "clear." Consequently, the AI learns that this pattern is safe. It has no mathematical incentive to flag it.

  ### 4. The Danger of "Typing Rhythm" and False Positives
  You mentioned the tool picks up on typing rhythm and tab-switching. This introduces a different risk: **False Positives based on spurious correlations.**

  *   **Correlation vs. Causation:** In the training data, perhaps nervous cheaters happened to type in a staccato rhythm, or their internet lag caused tab-switches. The AI learns "staccato typing = cheat."
  *   **Real World Application:** In the real world, a non-cheating student might type staccato because they are nervous, or switch tabs because their browser crashed.
  *   **The Discrepancy:** Because the human reviewers didn't label these innocent students as cheaters, the AI *should* theoretically learn not to flag them. However, if the AI is weighting these signals heavily to achieve that 99% agreement on the *obvious* cases, it may become hypersensitive. It might flag you for "looking suspicious" based on data points (typing rhythm) that humans don't actually use to make decisions, leading to flags that are hard to appeal because the evidence is algorithmic, not visual.

  ### Summary
  Your skepticism is well-founded. The 99% figure answers the question: **"How well does this AI replicate the judgments of our specific staff on the specific cases they found obvious?"**

  It does *not* answer the question: **"How well does this AI detect cheating that a human would miss?"**

  You are correct that there is nothing in the training process that would teach the AI to flag sophisticated, human-invisible cheating. In fact, the training process actively teaches it *not* to flag those things, because the "Ground Truth" labels say those instances are "clear." The metric is reassuring only if you trust the human reviewers to be perfect, which contradicts the very reason schools buy AI proctoring tools in the first place.
