  **Justifications**

  **Move 1 (Elena): 2.** Elena correctly states the core tenet of Neander's Selected Effects (SE) theory. For Neander, a trait's proper function is the effect that explains its *current* presence in the population via natural selection. Since UV protection no longer contributes to fitness in the new habitat, it does not explain the trait's maintenance; mate attraction does. This is the standard etiological verdict on environmental shifts.

  **Move 2 (Marcus): -2.** Marcus fundamentally misunderstands the etiological account. SE theories do not aggregate selective history by duration or "weight." They look for the specific selective pressure that *currently* maintains the trait. If the protective effect is no longer selected, it ceases to be the proper function, regardless of how long it served that role previously. Marcus conflates "history of origin" with "history of maintenance."

  **Move 3 (Elena): 2.** Elena correctly identifies the *reductio* in Marcus's interpretation. If function were determined by the majority of past history, traits could never change function, rendering the theory unable to account for adaptation to new environments. Her appeal to "explanatory work now" accurately reflects the maintenance condition required by etiological theories.

  **Move 4 (Marcus): 1.** Marcus retreats to a legitimate, known objection: the "time-slice problem" (how much recent history counts as "current"?). While his previous move was mistaken, this critique is philosophically sound. His description of Cummins is also accurate: Causal Role theory does not require historical cutoffs. However, he scores lower because he implies this "avoids" the dispute rather than changing the subject from normative proper functions to descriptive capacities.

  **Move 5 (Elena): 2.** Elena correctly identifies the cost of adopting Cummins's framework. Causal Role theory is descriptive, not normative; it cannot distinguish between a trait's *proper function* and a mere beneficial side effect (exaptation). By calling both effects "functions," Cummins loses the ability to say what the trait is *supposed* to do, which is often the central question in biology and medicine.

  **Missing Considerations**

  Between them, Elena and Marcus are overlooking the explicit distinction between **adaptation** and **exaptation**. The UV protection is now a beneficial exaptation (a useful effect not currently selected for), while attraction is the adaptation. Neander's theory is designed specifically to preserve this distinction, whereas Cummins's collapses it. The deeper issue is not just about history, but about **normativity**: whether "function" should track what a trait *does* (Cummins) or what it is *supposed to do* (Neander). Acknowledging that biological practice often requires both concepts depending on context (e.g., physiology vs. evolutionary history) might dissolve the stalemate.
