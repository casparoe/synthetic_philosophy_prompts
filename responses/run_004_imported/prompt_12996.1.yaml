  7.  **Final Polish:** Check the pacing. Ensure the "white shoe" mention is there but doesn't dominate (since the prompt focuses on the black raven reversal). Make sure the ending feels earned. (The prompt asks for the specific Good counterexample where a black raven *lowers* probability).

