              *   If we pick a raven at random, finding a black one is *more likely* in World 2 (because there are more ravens total to pick from, diluting the "all" constraint? No, that's not quite it).
              *   *Let's use the standard Good setup:*
              *   $H$: All ravens are black.
              *   $\neg H$: There are non-black ravens.
              *   Background $K$: We are unsure about the total population of ravens.
              *   Scenario: If $H$ is true, maybe there are very few ravens. If $\neg H$ is true, maybe there are tons of ravens (making it easier to find a black one just by chance, even if some are white).
              *   *Actually, the cleanest version:*
