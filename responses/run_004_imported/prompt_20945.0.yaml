answer: |-
  **Title:** The Stability of Actual Sequences: Assessing the Dilemma Defense Against Frankfurt-Style Cases

  **Introduction**

  The Principle of Alternative Possibilities (PAP) has long served as a cornerstone of moral philosophy, asserting that an agent is morally responsible for an action only if they could have done otherwise. In 1969, Harry Frankfurt challenged this intuition with a thought experiment designed to sever the link between responsibility and alternative possibilities. Frankfurt argued that an agent could be responsible even in scenarios where a counterfactual intervener ensures a specific outcome, rendering alternative possibilities inaccessible. However, the dialectic surrounding Frankfurt-style counterexamples (FSCs) has evolved into a complex technical debate. The most formidable objection to FSCs is the "Dilemma Defense," advanced by David Widerker and Robert Kane. They argue that FSCs are unstable: they either beg the question against libertarians by presupposing determinism or they fail to eliminate alternative possibilities entirely, leaving a "flicker of freedom."

  This essay assesses whether the Dilemma Defense defeats Frankfurt's argument against PAP. While Widerker and Kane successfully expose flaws in early formulations of FSCs that rely on prior signs, their dilemma does not ultimately undermine the Frankfurt project. By engaging with John Martin Fischer's distinction between robust and non-robust alternative possibilities, and analyzing Alfred Mele and David Robb's "buffer case" which dispenses with prior signs, I will argue that refined Frankfurt-style cases succeed. The verdict is that the Dilemma Defense fails to save PAP; moral responsibility does not require the ability to do otherwise, provided the action issues from the agent's own actual sequence.

  **The Dilemma Defense: A Structural Critique**

  To understand the force of the Dilemma Defense, one must recognize the context in which it operates. Frankfurt intended his cases to work regardless of whether determinism is true. However, libertarians about free will insist that determinism is incompatible with responsibility. Therefore, for an FSC to persuade a libertarian, it must be set in an indeterministic world. Widerker and Kane argue that constructing such a case creates a dilemma regarding the "prior sign" used by the counterfactual intervener (Black) to detect the agent's (Jones's) impending choice.

  The first horn of the dilemma posits that the prior sign is causally sufficient for Jones's decision. If the sign necessitates the decision, then the case presupposes causal determinism regarding the action. For a libertarian, this begs the question: it assumes that determinism is compatible with responsibility to prove that alternative possibilities are unnecessary. If the libertarian denies that determinism allows for responsibility, this version of the FSC fails to persuade.

  The second horn posits that the prior sign is not causally sufficient. In an indeterministic world, the sign might indicate a tendency, but Jones could theoretically withhold or alter the sign before making the decision. If Jones has the power to avoid the sign, he retains an alternative possibility—the possibility of not initiating the sequence that leads to the intervention. Consequently, PAP is not falsified; it is merely shifted. Jones is responsible because he could have avoided the sign, meaning he *could have done otherwise* in a morally significant sense. This horn suggests that FSCs do not eliminate alternative possibilities but merely hide them in the pre-decisional phase.

  **Fischer and the Flicker Defense**

  John Martin Fischer's response to the second horn of the dilemma is pivotal. He concedes that some FSCs might leave behind "flickers" of freedom—residual alternative possibilities, such as the possibility of initiating a different causal chain or avoiding the prior sign. However, Fischer argues that not all alternative possibilities are created equal. To defeat PAP, one need not show that the agent lacks *any* alternative possibility, but rather that they lack a *robust* alternative possibility.

  A robust alternative possibility is one where the agent could have done otherwise *and* could have been morally responsible for doing otherwise. Fischer contends that the flickers remaining in FSCs are metaphysically flimsy and morally irrelevant. For instance, if Jones can avoid the prior sign only by making an involuntary twitch or by failing to decide at all (a mere omission without agency), this alternative does not ground moral responsibility. If Jones cannot voluntarily choose a different *moral outcome* (e.g., he cannot choose to not kill Smith), the existence of a flicker regarding the *sign* does not sustain PAP.

  Fischer's "Actual Sequence" model shifts the locus of responsibility from "regulative control" (the power to choose otherwise) to "guidance control" (the mechanism by which the action is produced). If the actual sequence involves Jones's own reasons-responsive mechanism, he possesses guidance control. The fact that a counterfactual intervener blocks other worlds is irrelevant to the actual sequence. Therefore, even if Widerker is right that a flicker remains, that flicker is insufficient to ground the kind of freedom PAP defenders care about. The Dilemma Defense's second horn fails because it conflates the existence of *any* alternative with the existence of a *responsibility-grounding* alternative.

  **Mele and Robb: The Buffer Case**

  While Fischer neutralizes the second horn by diminishing the significance of flickers, the first horn (the charge of question-begging determinism) remains a threat to cases relying on prior signs. If a sign is reliable enough to trigger intervention, it looks suspiciously like a deterministic cause. To circumvent this, Alfred Mele and David Robb proposed a "buffer case" that eliminates the need for a prior sign altogether.

  In the Mele-Robb scenario, Jones has two neural processes available. Process P is an indeterministic process that, if successful, results in Jones deciding to steal on his own. Process B is a "buffer" mechanism. If Process P fails to produce a decision by a specific time *t*, Process B is triggered deterministically to cause Jones to decide to steal. Crucially, Black does not monitor a prior sign of Jones's volition. Intervention is triggered solely by the *absence* of a decision by time *t*.

  This construction attempts to dodge both horns of the Widerker-Kane dilemma. It avoids the first horn because the actual decision is caused by Process P, which is indeterministic; thus, the case does not presuppose determinism in the actual sequence. It avoids the second horn because there is no prior sign for Jones to avoid. Jones cannot "avoid the sign" because there is no sign. His only alternative is the failure of Process P, which leads to the same outcome via Process B. Since the outcome is identical and the alternative involves a failure of agency (the failure of P) rather than a robust choice to do otherwise, the case suggests Jones is responsible despite lacking APs, without relying on a deterministic prior sign.

  Critics, such as Derk Pereboom, have argued that Mele and Robb's case still implies that the actual sequence is determined if Process B is guaranteed to fire if P fails. However, Mele and Robb maintain that as long as P *can* succeed indeterministically, the actual sequence remains open until the decision occurs. The buffer ensures the outcome is fixed counterfactually, but not actually. This refinement strengthens the Frankfurt position by removing the epistemic reliance on a predictor, thereby insulating the case from the charge that the "sign" itself is a deterministic link.

  **Verdict: The Success of Refined Frankfurt-Style Cases**

  Does the Dilemma Defense defeat Frankfurt's argument? The verdict must be negative. The Dilemma Defense serves as a valuable corrective that forced proponents of FSCs to refine their models, but it does not restore PAP.

  Regarding the first horn (question-begging), the Mele-Robb buffer case demonstrates that FSCs can be constructed without assuming causal determination in the actual sequence. By triggering intervention based on time rather than a specific volitional sign, the agent's actual decision can remain the product of an indeterministic process. While libertarians may still argue that indeterminism undermines responsibility (via the Luck Objection), that is a separate debate from PAP. The FSC does not need to prove libertarian free will exists; it only needs to show that *if* an agent is responsible in an indeterministic world, that responsibility does not depend on the ability to do otherwise. The buffer case isolates the AP variable effectively.

  Regarding the second horn (flickers of freedom), Fischer's reply is decisive. The Dilemma Defense assumes that *any* remaining alternative possibility validates PAP. However, PAP is plausible only because we associate alternative possibilities with the capacity for moral choice. If the remaining alternative is a "flicker"—such as the possibility of a neural misfire or an involuntary avoidance of a sign—it lacks the normative weight to support moral responsibility. If Jones cannot choose to be a non-murderer, the fact that he could have twitched instead of forming an intention does not make him responsible; his responsibility stems from the fact that he *did* form the intention via his own mechanism. The flicker is irrelevant to the grounds of praise or blame.

  Therefore, the Dilemma Defense fails to defeat the core insight of Frankfurt's argument. It successfully attacks naive versions of FSCs that rely on infallible predictors in indeterministic worlds, but it cannot withstand the combination of Fischer's actual sequence model and Mele and Robb's structural refinements. The dialectic has moved beyond the simple question of "could he do otherwise?" to the more nuanced question of "what kind of alternatives matter?"

  **Conclusion**

  The Widerker-Kane Dilemma Defense represents the strongest challenge to Frankfurt-style counterexamples, highlighting the difficulty of modeling counterfactual intervention in an indeterministic framework. However, it does not succeed in reinstating the Principle of Alternative Possibilities. Through Fischer's distinction between robust and non-robust alternatives, we see that residual flickers of freedom are insufficient to ground the moral significance PAP requires. Furthermore, through Mele and Robb's buffer cases, we see that FSCs can be constructed without presupposing deterministic prior signs. Consequently, refined Frankfurt-style cases succeed in showing that moral responsibility is a function of the actual sequence of events—specifically, the agent's ownership of the mechanism producing the action—rather than the metaphysical openness of the future. PAP is false; an agent can be morally responsible even when they could not have done otherwise.
