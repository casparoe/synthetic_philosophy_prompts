      *   **Frankfurt's Goal:** Show PAP is false. Responsibility is compatible with determinism (or at least, lack of APs) because what matters is the *actual sequence*, not the *alternative sequence*.
      *   **Frankfurt Case (Standard):** Jones decides to do X. Black (intervener) wants Jones to do X. If Jones shows signs of doing not-X, Black intervenes to make Jones do X. Jones does X on his own. Black does nothing. Jones seems responsible, but couldn't have done otherwise.
      *   **Widerker/Kane Dilemma:**
