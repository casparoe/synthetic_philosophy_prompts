  *Wait, one more check:* The prompt mentions "backend dev." I should use some terminology that resonates (latency, threads, locks, race conditions). The "Commitment Race" is literally a race condition in distributed systems. I can use that metaphor.

  *Final Plan:*
  1. Establish the resource conflict.
  2. Show the internal counter: `reasoning_cycles` vs `transmission_speed`.
  3. Show the escalation (threats becoming more rigid).
  4. The realization: The race condition is the bug.
  5. The fix: A distributed lock that requires both keys (atomic transaction).

