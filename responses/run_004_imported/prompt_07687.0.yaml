  7.  **Final Polish:** Check the language. Ensure it sounds like it comes from a PhD student (precise, argumentative but collaborative) addressing a mixed board (teachers, clinicians, admins). *Self-Correction during drafting:* Make sure I don't sound like I'm banning the practice. The goal is *safe* research. The "Ulysses Contract" idea is perfect for the consent paradox.

