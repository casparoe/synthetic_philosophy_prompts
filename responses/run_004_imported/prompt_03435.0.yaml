          *   *Verdict:* Theo has the stronger intuitive case here. Most compatibilists agree the flicker is irrelevant to moral responsibility. However, incompatibilists disagree. It's a stalemate of intuition.

      *   **Move (4): Mara's Dilemma (The Control Objection).**
          *   *Claim:* Either Jones controls the prior sign (so real AP exists) OR he doesn't (so the case assumes determinism/question-begging).
