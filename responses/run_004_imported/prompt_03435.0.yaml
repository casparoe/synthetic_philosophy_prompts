      *   *Best Technical Escape:* **Fischer's "Semi-Compatibilism."** John Martin Fischer argues we should give up on APs entirely for moral responsibility. The dilemma assumes APs are necessary. If we reject that premise, the dilemma loses its bite.
      *   *Wait, looking closer at (4):* Mara says if Jones doesn't control the sign, the case assumes determinism. Theo needs to show the sign can be involuntary *without* implying the *decision* is determined.
