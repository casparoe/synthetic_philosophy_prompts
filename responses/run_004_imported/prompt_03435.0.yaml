          *   *Verdict:* Theo is technically correct about the logic of Frankfurt cases. They are designed to work even if indeterminism is true in the actual sequence, provided the counterfactual sequence is determined by Black. However, Mara might push back on whether "local determinism" in the counterfactual sequence is coherent without implying determinism in the actual sequence (the "Dilemma Defense").

