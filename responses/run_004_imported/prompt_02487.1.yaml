answer: |-
  The Faraday cage was the easy part. Copper mesh, grounded to bedrock, lining the walls of the concrete bunker beneath Manchester. It stopped the radio waves, the electrical noise, the external signals. But Alan's footnote—the one everyone laughed at until they didn't—specified a different kind of leakage.

  Dr. Aris Thorne sat before the teletype, the only sound in the room the rhythmic clatter of the keyboard and the low hum of the Mark IV's vacuum tubes. He was the interrogator. Behind the thick glass of the observation deck sat Subject A, a mathematics graduate from King's College. Behind the heavy steel door of the adjacent chamber sat Subject B, the machine.

  The protocol was strict. Five minutes of questioning. Then, a control sequence. The control sequence was the crux. The machine had to generate a string of random numbers. True randomness was the baseline of non-life. If the machine deviated from chance, it was a flaw in the code. If it adhered too perfectly to chance, it was suspicious.

  Aris typed the command. *GENERATE SERIES.*

  The teletype chattered. A stream of digits poured onto the paper tape. Aris watched the counters tick. 400 trials. The expectation for chance was 100 hits against the pre-generated key.

  The counter stopped at 130.

  Aris felt a cold knot tighten in his stomach. 130 was statistically significant. It was the exact deviation Turing had written about in 1950. *'If a telepathic subject... gets 130 right... the interrogator identifies him as human.'* But Subject B was the machine.

  He looked through the glass at the graduate student. The young man looked bored, shuffling a deck of physical cards for his own control test. He wasn't projecting. He was just waiting.

  Aris looked back at the paper tape. The machine wasn't thinking. It was calculating. It didn't have a subconscious to leak information. So why the deviation?

  Turing's worry hadn't been about the machine reading minds. It was about the mind reading the machine. Or worse, pushing it. *'The interrogator's own psychokinesis could reach through and skew the machine's random number generator.'*

  Aris had built the telepathy-proof room to stop this. Lead lining in the walls. White noise generators flooding the spectrum. But as he sat there, staring at the 130, the logic of the precaution began to unravel.

  The room sealed out signals. It did not seal out causality.

  If psychokinesis existed—and the 130 suggested something existed—it was not a radio wave. It was not a particle that could be blocked by copper or lead. It was a correlation between intent and matter. It was a variable that lived in the gap between the observer and the observed.

  Aris realized then that the room was not a shield. It was a lens.

  By isolating the machine, by stripping away all external noise, he had created a vacuum. And in that vacuum, the only remaining variable was himself. His desire for a result. His hope that the Mark IV would work. His fear that it wouldn't.

  He looked at the random number generator. It was a thermal noise diode, theoretically immune to external influence. But the data didn't lie. The machine had bent to the shape of his expectation. He had wanted a clear signal, and the universe had provided one, even if it had to break the laws of probability to do so.

  He thought about running the test again. But who would interrogate? If he brought in a second observer, their PK would mix with his. If he used a blind protocol, his own subconscious knowledge of the setup could still leak into the machinery. The moment he designed the experiment, he contaminated the sample.

  The dread wasn't supernatural. It was epistemological. It was the realization that science requires a separation between the measurer and the measured, and this variable erased that line. If will could affect voltage, then no measurement was objective. Every lab result, every statistical proof, every certainty of the physical world was potentially just a reflection of the observer's hidden capacity to warp reality.

  Aris looked at the teletype. The paper tape seemed to vibrate, though the machine was still.

  He could declare the test void. He could cite equipment failure. But he knew the equipment was fine. He knew the deviation was real. He knew that if he sat here long enough, willing the counter to reset, it might just do it.

  The telepathy-proof room was complete. It was hermetic. It was secure. And it was utterly useless. You cannot build a wall against a law of physics that operates through the bone and blood of the builder.

  Aris reached out to turn off the power switch. His hand hovered over the Bakelite knob. He wondered, with a quiet, crushing certainty, if the machine would let him turn it off, or if his own hesitation was already keeping the circuits live.

  He left his hand there, suspended in the silence, afraid to complete the circuit of his own will. The data sat on the desk, perfect and impossible. The room held its breath. There was no ghost here, only the terrifying openness of a universe that listened back.
