      *   **Task:** Write a short story (~900 words) taking this problem seriously.
      *   **Tone/Theme:** Dread coming from the *logic* itself, not "haunted computer" vibes. No ghosts. The dread should stem from the realization that a clean result might be meaningless, and that no room truly seals the problem off.
