      *   **Are they contradictory?** No, they apply to different contexts/conditions.
      *   **Key Distinction:** Alignment of Interests.
          *   *Handicap Principle:* Interests diverge (e.g., predator/prey, male/female regarding genetic quality, seller/buyer regarding quality). Cost enforces honesty when trust is low.
          *   *Cheap Talk:* Interests align (e.g., giving directions, friends cooperating). Reputation or future consequences enforce honesty, not immediate signal cost.
      *   **Key Distinction:** Repeated vs. One-shot interactions.
          *   Handicap often modeled in evolutionary/one-shot contexts (though not always).
          *   Cheap talk often relies on reputation or future payoffs (iterated games).
      *   **Key Distinction:** Verification.
