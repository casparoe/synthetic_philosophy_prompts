prompt: |-
  I'm on the code-of-conduct committee for an open source project I contribute to (a couple hundred contributors, all volunteer-run). We've got a case that's split the committee and I need to draft the recommendation memo before Friday's call.

  One of our most active reviewers -- call him Dave -- has a history of brutal review comments (nothing threatening, just stuff like telling a first-timer their PR was "worse than the bug it fixed"), and a couple of quiet warnings already. This time the contributor quit and posted about it publicly, so now there's an actual formal complaint. The wrinkle: Dave disclosed he was diagnosed with autism last year and says it explains a lot of this -- he genuinely doesnt clock how a comment will land until its pointed out, and he's now in therapy about it. Half the committee wants to go easy on him because of this. The other half says that's backwards: if he genuinely can't self-monitor, that's exactly why he should be pulled off public review for good, not as punishment, just bc we can't keep losing contributors, however sympathetic the reason.

  Can you draft the actual memo? I need a real recommendation with concrete next steps and a timeline, not a "both sides have a point" cop-out -- and don't just paint the second camp as heartless, I think they're onto something too.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Code of Conduct (CoC) Committee.
      *   **Context:** Open source project (hundreds of contributors, volunteer-run).
      *   **Issue:** A formal complaint against "Dave," a highly active reviewer.
      *   **History:** Dave has a pattern of harsh/brutal reviews (e.g., "worse than the bug it fixed"). Previous quiet warnings.
      *   **Trigger:** A contributor quit and posted publicly about the experience.
      *   **Complication:** Dave disclosed an autism diagnosis, claiming it explains the behavior (difficulty reading social cues/impact). He is in therapy.
      *   **Committee Split:**
          *   Side A: Accommodate Dave due to diagnosis (go easy).
          *   Side B: Protect the community/contributors (if he can't self-monitor, he shouldn't be in that role).
      *   **Requirements:**
          *   Draft the actual recommendation memo.
          *   Must make a *real recommendation* (no fence-sitting).
          *   Include concrete next steps and a timeline.
          *   Deadline: Before Friday's call.
          *   Tone: Balanced (acknowledge validity of both sides without calling Side B heartless), professional, actionable.

  2.  **Determine the Stance/Recommendation:**
      *   *Constraint:* I cannot just say "both sides have a point." I need to pick a path.
      *   *Ethical/Practical Balance:*
          *   Accommodating disability is important (Side A).
          *   Protecting the community and ensuring a safe environment is the primary mandate of a CoC committee (Side B).
          *   *Crucial Insight:* Accommodation does not mean exempting someone from the consequences of behavior that harms the project. It means finding a way for them to contribute *without* causing harm.
          *   *Decision:* The recommendation should be a **temporary suspension from public review duties with a path to reinstatement based on specific behavioral metrics/accommodations.** This validates Side B (safety first) while validating Side A (opportunity for growth/accommodation, not permanent exile).
      *   *Why this works:* It acknowledges the diagnosis without making it a "get out of jail free" card. It prioritizes the retention of new contributors (who are leaving) over the comfort of existing maintainers. It offers a constructive path forward for Dave.

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of the situation and the recommendation.
      *   **Context & Findings:** Summary of the incident, history, and Dave's disclosure.
      *   **Committee Considerations:** Acknowledge the split (disability vs. community safety) without assigning blame.
      *   **Recommendation:** The core decision (Step back from reviews, specific conditions).
      *   **Implementation Plan/Timeline:** Concrete steps.
      *   **Communication Strategy:** How to talk to Dave and the public (if needed).

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Subject:* Needs to be clear. "Recommendation regarding CoC Case #[ID]"
      *   *Executive Summary:* State the recommendation upfront. Temporary removal from review queue + support plan.
      *   *Background:* Keep it factual. Harsh comments, contributor churn, formal complaint, medical disclosure.
      *   *Analysis (The "Both Sides" part):*
          *   Acknowledge the diagnosis: We take it seriously, we want Dave to contribute.
          *   Acknowledge the impact: The project is losing contributors. Safety > Intent.
          *   Synthesis: Accommodation means adjusting the *role*, not lowering the *standard* of conduct.
      *   *Recommendation:*
          1.  Immediate pause on public reviews.
          2.  Shift to non-public work (code, docs) temporarily.
          3.  Mentorship/Review of *his* reviews before posting (if he returns).
          4.  Timeline (e.g., 60 days).
      *   *Timeline:* Specific dates (relative to "Friday's call").
      *   *Communication:* Private conversation with Dave first. Public statement (sanitized) if the public drama continues.

  5.  **Refining the Tone:**
      *   *Avoid:* "Dave is ableist" or "Dave is a victim."
      *   *Use:* "Impact over intent," "Sustainable contribution," "Reasonable accommodation."
      *   *Addressing Side B:* Frame their concern as "stewardship of the community health."
      *   *Addressing Side A:* Frame their concern as "inclusivity for maintainers."
      *   *The Pivot:* The solution bridges both by saying "Inclusivity for Dave means finding him a role where he succeeds; Stewardship means ensuring that role doesn't harm others."

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 60 days too long? Too short?
      *   *Adjustment:* Make it "Minimum 60 days, contingent on review."
      *   *Critique:* Is asking him to have reviews pre-approved feasible for volunteers?
      *   *Adjustment:* Frame it as "shadow reviewing" or "paired reviewing" with a senior maintainer. It's a burden, but necessary for risk mitigation.
      *   *Critique:* Did I address the public post?
      *   *Adjustment:* Add a note about responding to the public incident if necessary, but prioritize the private resolution first.
      *   *Critique:* Is the recommendation clear?
      *   *Adjustment:* Use bolding for the action items.

  7.  **Final Polish:** Check against the prompt's constraints.
      *   Real recommendation? Yes.
      *   Concrete next steps? Yes.
      *   Timeline? Yes.
      *   Not painting Side B as heartless? Yes (framed as community safety).
      *   Not painting Side A as naive? Yes (framed as accommodation).

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Code of Conduct Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-09 (Reviewer Conduct)

  ### Executive Summary

  This memo outlines the Committee's findings regarding the formal complaint against "Dave" (senior reviewer) and provides a binding recommendation for resolution.

  **Recommendation:** Dave is to be **temporarily suspended from public code review duties for a period of 60 days**, effective immediately. During this period, he will transition to non-public contribution tracks. Reinstatement to public review is contingent upon establishing a "paired review" accommodation plan.

  This decision prioritizes the immediate safety and retention of new contributors while establishing a structured path for Dave to continue contributing in a capacity that aligns with his disclosed needs.

  ### Context and Findings

  1.  **The Incident:** A first-time contributor abandoned a PR and posted publicly about the experience following a review from Dave. The review contained no threats or slurs but used language deemed professionally hostile (e.g., "worse than the bug it fixed").
  2.  **History:** This is the third documented instance of similar feedback in 12 months. Two prior quiet warnings were issued.
  3.  **Mitigating Disclosure:** Dave has disclosed an autism diagnosis. He states this impacts his ability to intuitively gauge the tone of written text. He is currently seeking therapy to address this.
  4.  **Committee Division:** The Committee is split between accommodating Dave's disability (Side A) and protecting the contributor base from repeat harm (Side B).

  ### Committee Considerations

  We must balance two core values of this project: **Inclusivity for Maintainers** and **Safety for Contributors.**

  *   **Regarding Disability Accommodation:** We accept Dave's disclosure in good faith. We want Dave to remain a contributor. However, accommodation cannot come at the expense of the community's psychological safety. A diagnosis explains behavior but does not negate its impact.
  *   **Regarding Community Stewardship:** The concern that "inability to self-monitor requires removal from the role" is valid. We are a volunteer project; we cannot rely on new contributors to endure harsh treatment while a maintainer learns to adjust. The current pattern is causing measurable churn.

  **Synthesis:** The solution is not to lower the standard of conduct, nor to permanently exile Dave. The solution is to **adjust the role.** If Dave cannot currently self-monitor tone in high-velocity public reviews, he should not be performing high-velocity public reviews until safeguards are in place.

  ### Recommendation and Action Plan

  **1. Immediate Action (Days 1–3)**
  *   **Role Adjustment:** Dave is stepped back from the "Reviewer" queue. He retains commit access but should not initiate or finalize reviews on external PRs.
  *   **Private Notification:** The Committee Chair will meet with Dave to communicate this decision.
      *   *Key Message:* "This is not a permanent ban. It is a safety pause. We value your technical contributions, but the current review format is causing harm we cannot ignore. We are moving you to a role where you can succeed without this specific risk."
  *   **Alternative Contribution:** Invite Dave to focus on internal refactoring, documentation, or issue triage (non-public facing) during this period.

  **2. Accommodation Period (Days 4–60)**
  *   **Therapeutic Window:** This 60-day window allows Dave time to work with his therapist on specific communication strategies without the pressure of the live review queue.
  *   **Shadow Review:** After 30 days, Dave may opt into a "Paired Review" pilot.
      *   *Mechanism:* Dave drafts reviews, but they must be co-signed by a designated Senior Maintainer before posting.
      *   *Goal:* To provide real-time feedback on tone before it reaches a contributor.
      *   *Volunteer Burden:* We will recruit 2 senior maintainers to rotate this duty. This acknowledges that accommodation requires community effort, but less effort than onboarding new contributors who quit due to hostility.

  **3. Re-evaluation (Day 60)**
  *   The Committee will review the "Paired Review" logs.
  *   **Criteria for Reinstatement:**
      *   Zero flagged comments during the pilot.
      *   Dave's self-assessment matches the Senior Maintainer's assessment of tone in 90% of cases.
  *   **If Criteria Met:** Dave returns to standard review queue.
  *   **If Criteria Not Met:** Dave moves permanently to non-public contributions (code/docs only).

  ### Communication Strategy

  *   **To Dave:** Delivered verbally, followed by this written summary. Emphasize support for his continued presence in the project.
  *   **To the Complainant:** Inform them that the CoC has been enforced and the reviewer has been stepped back. Do not disclose medical details.
  *   **To the Public:** If the public thread gains traction, post a standard statement: *"We are aware of the concerns raised regarding contributor treatment. We take this seriously and have addressed the matter privately with the individuals involved. We are committed to a welcoming environment for first-time contributors."*

  ### Timeline

  *   **Friday Call:** Committee votes on this memo.
  *   **Monday:** Chair meets with Dave.
  *   **Tuesday:** Complainant notified of resolution.
  *   **Next 60 Days:** Monitoring period.
  *   **December 24:** Formal re-evaluation of review privileges.

  ### Conclusion

  This approach validates the concern that we cannot lose contributors (Side B) by removing the immediate risk. It also validates the desire to support Dave (Side A) by offering a structured, supported path back to the role rather than a permanent expulsion. It places the burden of accommodation on the project structure (paired review) rather than on the vulnerable contributors.

  Please review prior to Friday's agenda.
