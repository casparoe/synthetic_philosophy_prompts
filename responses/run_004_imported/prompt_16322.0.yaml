answer: |-
  Your friend has raised a sophisticated objection that strikes at the heart of the tension in *Principia Ethica*. In fact, this is one of the most enduring critiques of Moore: that his "Ideal Utilitarianism" is merely hedonism in disguise, or at best, an unstable hybrid.

  However, your friend's reading is not quite sound. While it is true that Moore's positive account of the "Ideal" looks suspiciously like a refined hedonism, Moore has specific philosophical resources—specifically the **Two Worlds thought experiment** and the **Principle of Organic Unities**—that prevent his view from collapsing into Sidgwick's hedonism.

  Here is how you can reconstruct Moore's defense against your friend's charge.

  ### 1. Definition vs. Constitution (The Meta-Ethical Block)
  First, you must clarify what the Open Question Argument (OQA) actually achieves. Your friend seems to think that because Moore argues "good" does not *mean* "pleasure," Moore cannot subsequently claim that pleasure is a major component of the good.

  This is a category error. Moore's OQA is a meta-ethical claim about the **definition** of the concept "good." He argues you cannot define "good" as "pleasure" because it always remains an open question whether "pleasure is good." However, this does not prevent "pleasure" (or states involving pleasure) from being the primary **constituents** of what is good.

  Moore is happy to admit that pleasure is *intrinsically good*. He just refuses to say "good" *is identical to* "pleasure." So, when Moore says the ideal life involves the pleasures of affection and beauty, he is not contradicting the OQA. He is simply identifying which complex states of affairs possess the simple, non-natural property of "goodness."

  ### 2. The Two Worlds Argument (The Ontological Block)
  This is the strongest evidence against your friend's claim that Moore is a closet hedonist. In Chapter VI of *Principia Ethica*, Moore asks you to imagine two worlds:
  1.  **The Beautiful World:** Exquisitely beautiful, full of majestic mountains, vibrant colors, and harmonious forms.
  2.  **The Ugly World:** A heap of filth, utterly loathsome, without one redeeming feature.

  **The Catch:** Moore stipulates that **no human being ever sees or experiences either world.** They are permanently unobserved.

  **The Hedonist's Answer (Sidgwick/Mill):** If "good" means "pleasure" (or even if good is solely dependent on sentient experience), then both worlds have exactly the same value: **zero**. Without a subject to experience pleasure, beauty is valueless.

  **Moore's Answer:** Moore insists it is irrational to deny that the Beautiful World is better than the Ugly World, even if no one ever knows it.

  **Why this blocks your friend's reading:** If Moore were truly a hedonist (even a "refined" one), he would have to admit that unobserved beauty has no value. By insisting that the *existence* of beauty has intrinsic value independent of the *pleasure of contemplating it*, Moore proves that value resides partially in the **object**, not just the **subject's feeling**. Therefore, his theory cannot be hedonism, which locates value exclusively in the mental state of the subject.

  ### 3. Organic Unities (The Structural Block)
  Your friend argues that Moore ends up valuing "the pleasure of contemplating something lovely." Moore would correct this phrasing. For Moore, the valuable thing is not the pleasure *plus* the object; it is the **consciousness of the object** as a single organic whole.

  According to the **Principle of Organic Unities**, the value of a whole is not necessarily the sum of the values of its parts.
  *   **Part A:** The consciousness (the mental act).
  *   **Part B:** The object (the beautiful thing).

  Moore argues that while consciousness of a beautiful object is highly valuable, consciousness of a ugly object (e.g., taking pleasure in cruelty or filth) is often positively evil. If value were simply "pleasure" (as Sidgwick holds), then sadistic pleasure would be just as good as aesthetic pleasure, provided the intensity was the same.

  Moore rejects this. He argues that the **nature of the object** alters the value of the whole state of consciousness.
  *   **Hedonism:** Value = Intensity of Pleasure.
  *   **Moore:** Value = (Consciousness + Worthy Object).

  This is why Moore is not a hedonist. For a hedonist, the object is merely a causal instrument to generate pleasure. For Moore, the object is a **constituent** of the value. You cannot swap the object for something else without changing the moral value of the state, even if the "feeling" of pleasure remains identical.

  ### 4. Where Your Friend is Partially Right
  You should concede one point to your friend to show philosophical charity: Moore *does* agree with the hedonists that **consciousness is necessary for the *greatest* goods.**

  While the unobserved beautiful world has *some* intrinsic value, Moore admits that a world where someone *contemplates* that beauty is vastly better. The conjunction of the worthy object and the appropriate emotion creates a higher degree of goodness than the object alone.

  So, Moore agrees with Sidgwick that human experience is the locus of the *highest* value. But he disagrees on *why*.
  *   **Sidgwick:** Experience is valuable because it contains pleasure.
  *   **Moore:** Experience is valuable because it unites a mind with an objectively valuable reality.

  ### Summary for Your Next Car Ride
  Your friend's objection is sound only if one ignores Moore's ontology. Moore escapes the charge of "sleight of hand" because:

  1.  **He values existence independent of experience:** The Two Worlds argument proves he attributes value to objects even without the "pleasure" of observing them (which a hedonist cannot do).
  2.  **He values the relation, not just the feeling:** Through Organic Unities, he argues that the *object* of consciousness determines the value of the experience, not just the intensity of the pleasure (which distinguishes him from Sidgwick).

  Moore is not a hedonist; he is an **Ideal Utilitarian**. He believes pleasure is good, but only when it is the appropriate response to something that is independently good. Your friend is mistaking Moore's claim that "pleasure is often a necessary part of the good" for the claim that "good is nothing but pleasure." Moore spends half the book ensuring you don't make that mistake; the other half is explaining what actually makes the cut.
