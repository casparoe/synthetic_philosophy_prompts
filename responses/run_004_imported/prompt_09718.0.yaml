prompt: |-
  Not for a piece, just a personal argument that's been bugging me: my dad and I have a running bet over a king-and-pawn endgame from one of his old tournament games, a position neither of us can be bothered to run through a tablebase. We both eyeball it as a draw, so we put $20 on it -- he's betting on the draw, I'm betting its secretly a win for white with best play. My sister, who's a few years into a math PhD, says the bet doesn't actually mean anything, because the result isn't random at all: right now, this instant, the position is already objectively a draw, a win, or a loss, we just don't know which, so putting odds on it is just guessing with extra steps. That feels off to me but I can't say exactly why. Is she right that a bet like this is basically meaningless, or is there a real sense in which our odds make sense?
