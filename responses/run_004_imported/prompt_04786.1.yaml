answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name], Dave's niece/nephew.

  In this family, there was a running joke about Christmas dinner. Most uncles want to know if you're dating anyone, or if you got a raise. Dave wanted to know if the Xbox he was buying for my cousin was ethically defensible. I remember one year, my dad and Dave went twenty minutes back and forth about whether a video game console could be justified when the same three hundred dollars could buy malaria nets.

  To my dad, it was annoying. To me, eventually, it was fascinating. Because Dave wasn't trying to be difficult. He was trying to be responsible.

  Over the next hour, you're going to hear a lot about how generous Dave was. And he was. By any metric that matters, he was a giant. For twenty years, he gave away forty percent of his salary. He had spreadsheets—legendary spreadsheets—with tabs dedicated to tracking how much good a dollar could do in different parts of the world. He treated charity not like a feeling, but like a job.

  If I stopped there, it would be a beautiful story. It would be the story of a man who had the answers. But if I told that story, I wouldn't be telling the truth about Dave. And Dave hated when people didn't check their sources.

  The truth is, Dave wasn't a man who had the answers. He was a man who was terrified of having the wrong ones.

  For most of us, giving is about hope. We hope it helps. We hope it matters. But for Dave, hope wasn't enough. He needed to know. And in the last year of his life, he ran into a wall that a lot of us never even see. He started asking himself: *Can we actually know?*

  He worried about the ripples. He worried that even the best intentions, the most carefully calculated donations, send consequences out into the future that we can't see, can't measure, and can't control. He realized that the spreadsheet, as beautiful as it was, couldn't capture the complexity of the world decades down the line. He realized that certainty was a luxury we don't have.

  I tell you this not to diminish his work, but to honor the weight of it.

  It is easy to be generous when you are sure you are right. It is much harder to be generous when you realize you might be wrong. When you realize that the world is messy, and that our best tools are imperfect, and that the "good" we try to do might have shadows we can't account for.

  In the face of that uncertainty, Dave could have stopped. He could have said, "If I can't be sure, I'll keep my money. I'll buy the Xbox. I'll let someone else worry about the nets."

  But he didn't.

  He kept writing the checks. He kept updating the sheets, even while knowing they were incomplete. He kept arguing about the Xbox, not because he thought he was God, but because he thought we owed it to each other to try.

  To his friends in the effective altruism community: You know this better than anyone. You know that Dave's rigor wasn't about arrogance. It was about a specific kind of humility. He knew that "cluelessness"—that vast, unknowable future—was staring him in the face. And he decided that the only way to answer the void was to act anyway.

  To my grandma, and my dad, and the rest of the family: You knew him as the guy who cared too much. You're right. He cared enough to lose sleep over strangers he would never meet. He cared enough to let doubt sit at his dinner table, and he didn't let it stop him from feeding the people in the room.

  I think that is the legacy we need to carry. Not the spreadsheet. Not the specific charities. But the courage to care deeply in a world where we can't see the end of the story.

  Dave taught me that you don't need to be sure that you're saving the world to do something that matters. You just need to be willing to look at the uncertainty, acknowledge that you might be wrong, and then do the good thing regardless.

  He didn't give because he knew it would work. He gave because it was the only thing he could do.

  Rest well, Uncle Dave. We'll try to keep the math honest. And we'll try to keep giving.
