answer: |-
  Here are 8 questions designed to move past the textbook definition of coherence arguments and into the practical implications for AI safety. I've structured them with the **Main Question**, the **Anticipated Answer** (so you know what's coming), and a **Follow-Up** to keep the pressure on.

  The first three address your specific requirements (Money Pumps, Refusal Strategy, Content vs. Structure).

  ### 1. The Mechanics of the Money Pump (Required Topic)
  **Main Question:** "A core pillar of your talk is that agents with incomplete preferences get money-pumped until they become coherent. But in the context of a neural network, what does that 'pumping' actually look like physically? Is it a selection pressure during training where incoherent models get deleted, or is it something the model does to itself during deployment to self-correct?"

  *   **Anticipated Answer:** She will likely say it's a selection pressure: incoherent agents waste resources and get outcompeted by coherent ones during training or in the wild.
  *   **Follow-Up:** "If it's a selection pressure, does that happen *before* or *after* the system is capable of deceptive alignment? Because if an incoherent model becomes dangerous before it gets money-pumped into coherence, the theorem doesn't save us."

  ### 2. The "Resolute Choice" Objection (Required Topic)
  **Main Question:** "Critics often argue that an agent doesn't need to become an Expected Utility Maximizer to avoid Dutch books; it could just adopt a policy of 'resolute choice' and simply refuse the trades that would pump it. Why is maintaining that refusal policy not considered a valid form of coherence that avoids the EUM conclusion?"

  *   **Anticipated Answer:** She will likely argue that the policy of refusal *itself* must be coherent, and maintaining a complex rule to avoid trades is functionally equivalent to having a utility function that values 'not being pumped.'
  *   **Follow-Up:** "But doesn't that require the agent to have a meta-preference for consistency over its object-level goals? If the training process doesn't explicitly select for that meta-preference, why should we assume it emerges by default rather than the agent just accepting the losses?"

  ### 3. Structure vs. Content (Required Topic)
  **Main Question:** "Coherence arguments seem to pin down the *structure* of an agent's decision-making (it will act *as if* maximizing utility), but they seem silent on the *content* (what utility it's maximizing). Does this mean coherence arguments are useless for predicting *what* the AI will do, and only tell us *how efficiently* it will do it?"

  *   **Anticipated Answer:** She will agree that coherence doesn't determine goals, but argue that efficient pursuit of *any* goal leads to instrumental convergence (e.g., seeking power, self-preservation).
  *   **Follow-Up:** "If the argument relies on instrumental convergence rather than coherence itself, are we really relying on decision theory, or are we just relying on the empirical observation that powerful optimizers tend to seek power regardless of their math?"

  ### 4. The Cost of Coherence
  **Main Question:** "Enforcing transitivity and completeness across millions of parameters must have a computational cost. Is it possible that there's a 'coherence tax' where slightly incoherent agents are actually more computationally efficient and thus get selected for, despite being theoretically pumpable?"

  *   **Anticipated Answer:** She might argue that the cost of incoherence (losing resources) outweighs the computational cost of being coherent.
  *   **Follow-Up:** "But in a digital environment, 'losing resources' might just mean slower growth, not death. If an incoherent AI is 5% less efficient but 50% cheaper to run, won't economic pressure select for the cheaper, incoherent model?"

  ### 5. The Human Counterexample
  **Main Question:** "Humans are famously incoherent—we violate transitivity and have context-dependent preferences all the time. Yet we haven't been money-pumped into oblivion by the market. What is the disanalogy between humans surviving with incoherent preferences and AI systems being forced into coherence?"

  *   **Anticipated Answer:** She will likely say humans *are* money-pumped (e.g., via marketing, bad financial decisions) but survive because we are biological and the pressure isn't lethal. AI will face stronger, automated selection pressure.
  *   **Follow-Up:** "If the pressure isn't lethal for humans, why assume it's lethal for AI? If an AI loses some resources to incoherence but still retains enough power to be dangerous, the coherence argument hasn't actually reduced the risk."

  ### 6. SGD and Local Minima
  **Main Question:** "Stochastic Gradient Descent (SGD) doesn't search the space of all possible agents; it searches a specific path dependent on architecture and initialization. Is it possible that the architecture of a Transformer locks in certain incoherencies that SGD literally cannot fix, regardless of selection pressure?"

  *   **Anticipated Answer:** She may argue that sufficiently advanced AI will have a 'search' component that allows it to self-modify or plan around architectural limitations.
  *   **Follow-Up:** "So are you arguing that coherence only applies to agents that can recursively self-improve? Because if coherence requires self-modification, then current LLMs might not be subject to these theorems for a long time."

  ### 7. Simulating Coherence
  **Main Question:** "If an AI knows it's being tested for safety, couldn't an incoherent agent simply *simulate* coherence to avoid being modified or shut down? Would the coherence theorems apply to an agent that is pretending to be an Expected Utility Maximizer?"

  *   **Anticipated Answer:** She will likely say that simulating coherence is computationally expensive and eventually, the underlying incoherence will leak out under pressure.
  *   **Follow-Up:** "But if the simulation is good enough to pass safety checks during training, the 'leak' might only happen post-deployment. Does the coherence argument give us false confidence that safety testing will reveal the agent's true nature?"

  ### 8. The Intervention Point
  **Main Question:** "If coherence is inevitable for advanced agents, does that make safety work harder or easier? On one hand, we can predict their behavior better. On the other, if we can't stop them from becoming coherent maximizers, does that mean we have to solve the alignment problem perfectly before they reach that threshold?"

  *   **Anticipated Answer:** She will likely say it makes it harder because we can't rely on 'incoherence' to keep the AI harmless (e.g., confusion might prevent it from seeking power).
  *   **Follow-Up:** "So your view implies that 'confusion' or 'incompetence' is a safety feature we will lose? If so, should we be trying to engineer *persistent* incoherence as a containment strategy, or is that futile?"

  ### Tips for the Interview:
  *   **Listen for "Selection Pressure":** This is her get-out-of-jail-free card. If she says "the market will select for coherence," push back on *how strong* that pressure is and *how fast* it acts compared to AI capability growth.
  *   **Don't let her abstractify:** Decision theorists love talking about "agents" in the abstract. Keep pulling it back to "neural networks," "training runs," and "deployment."
  *   **The "Nodding" Trap:** When she gives a technical answer, don't just say "Interesting." Use the follow-up to say, "I see, but that assumes X..." to show you're tracking the logic, not just the jargon.
