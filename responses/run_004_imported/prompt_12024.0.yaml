answer: |-
  It is genuinely impressive that you arrived at the core of Galen Strawson's "Basic Argument" independently. It is one of the most robust and difficult arguments in contemporary metaphysics, and grasping it without training speaks to your analytical instincts.

  Your two puzzles cut to the heart of why Strawson's version of skepticism is distinct from other free will skeptics (like Derk Pereboom or Gregg Caruso). Here is a reconstruction of the reasoning behind both points.

  ### 1. Why Indeterminism Doesn't Help (The Luck Objection)

  Your intuition is the standard libertarian reply: *If determinism is true, I am a puppet of the past. If indeterminism is true, the chains are broken, and I am free.*

  Strawson rejects this because he argues that **responsibility requires control**, and indeterminism does not provide control; it provides **noise**.

  To be morally responsible for an action, the action must issue from *you* in a specific way. It must be an expression of your agency. Strawson argues that introducing indeterminism (randomness) into the causal chain creates a dilemma often called the **"Luck Objection."**

  Imagine a decision you make, say, to tell the truth.
  *   **Scenario A (Determinism):** Your character, values, and desires causally determine you to tell the truth.
      *   *Strawson's verdict:* You aren't responsible because you didn't choose your character (the Basic Argument/Regress).
  *   **Scenario B (Indeterminism):** There is a random, undetermined break in the causal chain leading to your decision.
      *   *Strawson's verdict:* You still aren't responsible, but for a different reason.

  **The Reasoning:**
  If a choice is undetermined, it is not fully caused by your character or values. If it *were* fully caused by your character, we are back to Scenario A (the regress problem). So, for indeterminism to matter, the choice must happen *without* a sufficient prior cause in your psychology.

  But if the choice is not determined by your psychology, **it is essentially a random event relative to you.** It is like a neural roll of the dice.
  *   If the decision is random, you do not control it.
  *   If you do not control it, you cannot be responsible for it.

  Strawson's point is that **chance is not freedom.** For you to be responsible, *you* must be the author of the act.
  *   If the act comes from your character, you need to be responsible for your character (which leads to the infinite regress).
  *   If the act comes from chance, it doesn't come from *you* at all.

  Therefore, indeterminism offers no advantage. It either collapses back into determinism (if the choice is explained by who you are) or it dissolves into randomness (if the choice is not explained by who you are). Neither allows for the "Ultimate Responsibility" required to stop the regress.

  ### 2. Why Strawson Doesn't Advocate for Systemic Reform

  This is a subtle distinction between Strawson and other "Hard Incompatibilists" like Derk Pereboom or Gregg Caruso. Pereboom and Caruso argue that because responsibility is impossible, we must radically reform our legal and social practices (e.g., replacing retributive punishment with a "public health quarantine model").

  Strawson is more pessimistic about the possibility of reform, and his reasoning rests on a distinction between **metaphysical truth** and **psychological inevitability.**

  **A. The Influence of P.F. Strawson (Reactive Attitudes)**
  Galen Strawson is the son of P.F. Strawson, who wrote the famous essay "Freedom and Resentment." P.F. Strawson argued that "reactive attitudes" (resentment, gratitude, blame, praise) are not intellectual theories we can choose to adopt or discard; they are constitutive of human relationships. We are socially wired to hold each other responsible.
  Galen accepts the *metaphysical* conclusion (responsibility is impossible) but agrees with his father's *psychological* observation: **We cannot simply turn these feelings off.** Even if we know blame is metaphysically unjustified, we will continue to feel resentment when harmed and gratitude when helped. Because we cannot stop feeling this way, we cannot fully stop practicing blame.

  **B. Truth vs. Social Engineering**
  Strawson's primary project is metaphysical clarity, not political theory. He argues that believing in moral responsibility is "the greatest obstacle to real moral progress" because it fuels ego, anger, and self-righteousness.
  *   **His Goal:** He wants individuals to realize the impossibility of responsibility so they can achieve a kind of personal equanimity or compassion. If I realize you couldn't have done otherwise (in the ultimate sense), my anger toward you may dissipate.
  *   **The Limit:** He does not believe this realization will lead to a utopia where we stop punishing or blaming. He thinks the practices are too deeply ingrained in human nature and social cohesion.

  **C. Accountability without Responsibility**
  Strawson distinguishes between **Ultimate Moral Responsibility** (which is impossible) and **Practical Accountability** (which is necessary).
  He acknowledges that society must still protect itself. We can still lock up violent offenders, not because they *deserve* it in a cosmic moral sense, but because they are dangerous (consequentialism). We can still praise and blame as behavioral tools to shape future actions, even if the targets don't *ultimately* deserve it.
  Unlike Caruso, who wants to redesign the justice system to reflect the lack of responsibility, Strawson seems to think the system will (and perhaps must) continue to operate *as if* people are responsible, even if philosophers know they aren't. He focuses on changing our *internal understanding* of the practice, rather than the practice itself.

  ### Summary
  1.  **On Indeterminism:** Strawson argues that randomness does not equal agency. If your actions aren't determined by you, they are luck; if they are determined by you, you need to be responsible for "you." Indeterminism solves neither problem.
  2.  **On Reform:** Strawson believes that while moral responsibility is metaphysically impossible, the *practices* of blame and punishment are psychologically and socially inevitable. He seeks to change our *attitude* toward these practices (reducing anger and ego) rather than attempting the likely impossible task of abolishing the practices themselves.

  You have essentially reconstructed one of the strongest skeptical positions in philosophy. The fact that you are puzzled by the indeterminism reply is standard; it is the single hardest pill to swallow in the free will debate. The fact that you noticed the divergence on practical reform shows you are paying attention to how different philosophers bridge the gap between theory and life.
