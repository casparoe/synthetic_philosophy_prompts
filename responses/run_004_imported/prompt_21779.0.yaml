  2.  **Deconstruct the Core Issue: The *General Scholium* & Dominion:**
      *   *Standard Reading:* Newton is doing natural theology. God is the intelligent designer who set the clockwork universe in motion. "Dominion" means God is the ruler of the universe.
      *   *Heterodox Reading (Snobelen, et al.):* "Dominion" is a coded polemic against the Trinity. In Trinitarian theology, God is defined by *essence* (consubstantiality, eternal generation). In Newton's Arianism, God is defined by *authority* (the Father is God because He rules over the Son).
      *   *Key Text:* "Deus est dominatio universalis" (God is universal dominion). He explicitly rejects defining God by duration/quantity/location/perfection alone.

  3.  **Address Question 1 & 2: Implications and Specific Textual Bits:**
      *   *The Definition of God:* Newton writes: "God is not duration or infinity, but eternal and infinite; he is not space or time, but he endures and is present." He adds: "He is not eternity and infinity, but eternal and infinite."
      *   *The Crucial Shift:* He argues against defining God by *metaphysical attributes* (which Trinitarians used to argue for co-equality/consubstantiality). Instead, he defines God by *relational authority*.
      *   *Pantokrator:* This Greek term means "All-Ruler." In the Nicene Creed, it's used, but Newton emphasizes the *rulership* aspect over the *essence* aspect. For an Arian, the Father is God *because* He rules the Son. The Son is divine but subordinate.
      *   *Idolatry:* Newton often equated Trinitarianism with idolatry (worshipping a creature/the Son as God). By insisting God = Dominion, he implies that only the one with supreme authority (the Father) is to be worshipped as *Deus*.
      *   *Specific Phrase:* "A God without dominion, providence, and final causes, is nothing else but Fate and Nature." This isn't just anti-atheist; it's anti-Spinozan, but also anti-Trinitarian in the sense that a "triune" God of shared essence without hierarchical dominion is, to Newton, a logical absurdity that leads to idolatry.

  4.  **Address Question 3: The "Science vs. Heresy" Debate:**
      *   *Old View (Manuel, etc.):* Newton had a split personality. The scientist was rational; the theologian was obsessive/neurotic. They were separate projects.
      *   *New View (Snobelen, Force, Jacob, etc.):* They are integrated. His science *requires* his theology.
      *   *Why?* The *Principia* describes a universe governed by law. Who makes the law? A Legislator. A Legislator requires *Dominion*. If God is just "infinite substance" (Spinoza/Trinity), law is emanation/necessity. If God is "Lord/King" (Newton's Arianism), law is voluntary command.
      *   *The "Need" for Intervention:* Newton's God intervenes (to fix planetary orbits, etc.). Why? Because a King maintains his kingdom. A static "perfect being" wouldn't need to tweak things. The voluntarism of his theology (God's will is supreme) matches the voluntarism of his physics (laws are imposed, not logically necessary).
      *   *Conclusion:* It moves the needle significantly. It suggests the *General Scholium* isn't just a pious add-on; it's the metaphysical foundation that makes the physics coherent *for Newton*.

