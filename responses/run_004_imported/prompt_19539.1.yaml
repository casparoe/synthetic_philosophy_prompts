          1.  1955 Social Aggregation Theorem (SAT).
          2.  1953 Impartial Observer Theorem (IOT).
      *   **Core Question:**
          1.  Why do the weights in the 1955 SAT fail to secure interpersonal comparability (IPC) despite the additive form? (The Sen-style objection).
          2.  How does the equiprobability device in the 1953 IOT attempt to fix this, and what technical work does it do?
      *   **Requirement:** "Real technical precision." No hand-waving. Needs to deal with utility representations, affine transformations, and the specific axioms involved.

  2.  **Analyze Theorem 1: 1955 Social Aggregation Theorem (SAT):**
      *   *Setup:* $N$ individuals, social planner. Preferences over lotteries $L$.
      *   *Axioms:*
          *   Individual preferences $\succeq_i$ satisfy vNM axioms $\rightarrow$ representable by $u_i$.
          *   Social preferences $\succeq_S$ satisfy vNM axioms $\rightarrow$ representable by $W$.
          *   Pareto Indifference (or Strong Pareto): If everyone is indifferent between $L$ and $L'$, society is indifferent. (Or if everyone weakly prefers, society weakly prefers, with strictness if someone is strict).
      *   *Result:* $W(L) = \sum a_i u_i(L) + b$.
      *   *The Problem (Sen's Objection):*
          *   vNM utilities are unique only up to positive affine transformations ($u'_i = \alpha_i u_i + \beta_i$, $\alpha_i > 0$).
          *   The aggregation theorem holds for *any* valid representation of individual utilities.
          *   If I rescale person 1's utility by a factor of 1,000,000, the weight $a_1$ must shrink by 1,000,000 to keep $W$ constant.
          *   Therefore, the magnitude of $a_i$ depends entirely on the arbitrary zero and unit of $u_i$.
          *   Without an independent standard for comparing the *units* of $u_i$ across persons, the weights $a_i$ are meaningless for normative comparison. They are just mathematical coefficients adjusting for arbitrary scales.
          *   *Conclusion:* The theorem proves linearity, not utilitarianism (which requires comparable units).

  3.  **Analyze Theorem 2: 1953 Impartial Observer Theorem (IOT):**
      *   *Setup:* An "Impartial Observer" (IO) considers prospects where they might *become* any person $i$ in society with probability $p_i$.
      *   *Identity Uncertainty:* The IO faces a "super-lottery." Not just outcomes, but *who* experiences the outcome.
      *   *Axioms:*
          *   IO satisfies vNM axioms over these extended prospects (outcome + identity).
          *   Acceptance Principle: If the IO becomes person $i$, they adopt person $i$'s preferences over outcomes.
          *   Impartiality (Equiprobability): The IO assigns equal probability ($1/N$) to becoming any person. (Sometimes derived, sometimes posited as part of the "veil of ignorance").
      *   *Result:* The IO's utility function $V$ over social states is the average of individual utilities: $V = \frac{1}{N} \sum u_i$.
      *   *How it fixes IPC:*
          *   This is the tricky part. Does it *actually* fix it? Many philosophers (Sen, Weymark, Mongin) say no, not without further assumptions.
          *   *The Mechanism:* The IOT embeds individual utilities into a *single* vNM utility function of the Observer ($V$).
          *   Because $V$ is a single vNM function, it has a single scale.
          *   The "Acceptance Principle" links $u_i$ (person $i$'s preference) to $V$ (Observer's preference when being $i$).
          *   Crucially, for the math to work, the $u_i$ functions must be calibrated to the *same* scale within the Observer's preference ordering.
          *   *The Catch:* To say $u_i$ and $u_j$ are on the same scale, we need to assume that the "distance" in preference satisfaction for $i$ is comparable to $j$ *from the Observer's perspective*.
          *   Usually, this requires assuming "extended preferences" are comparable. The equiprobability assumption ($p_i = 1/N$) sets the weights. But do the $u_i$ inputs have comparable units?
          *   Harsanyi argues yes, because the Observer evaluates "being $i$ in state $x$" vs "being $j$ in state $y$" directly.
          *   *Technical nuance:* The IOT derives utilitarianism *if* we assume the Observer's preferences over (person, outcome) pairs satisfy vNM. This effectively *stipulates* interpersonal comparability by placing all (person, outcome) pairs into one domain of choice.
          *   *Critique:* It doesn't "solve" the measurement problem; it assumes a domain where the measurement is possible (extended preferences).

  4.  **Synthesize the Argument:**

      *   **Introduction:** Acknowledge the user's sophistication. Confirm the distinction is crucial and often missed.
      *   **Part 1: The 1955 Aggregation Theorem (The "Weights" Problem).**
          *   Define the vNM representation theorem (uniqueness up to affine transformation).
          *   State the Aggregation Theorem formally ($W = \sum a_i u_i$).
          *   Demonstrate the scaling issue. Show mathematically that if $u_i \to \alpha u_i + \beta$, then $a_i \to a_i / \alpha$.
          *   Explain why this kills normative force. The weights aren't moral weights; they are conversion factors for arbitrary units.
          *   Connect to Sen: "Non-welfarist" info is needed to fix the scales.
      *   **Part 2: The 1953 Impartial Observer Theorem (The "Equiprobability" Device).**
          *   Define the domain: Extended alternatives $(i, x)$ where $i$ is identity, $x$ is outcome.
          *   Define the Observer's utility $V(i, x)$.
          *   The Acceptance Principle: $V(i, x)$ represents $i$'s utility $u_i(x)$. This is the bridge.
          *   The Veil of Ignorance/Equiprobability: Social welfare is expected utility of the IO. $SW = \sum p_i V(i, x)$.
          *   Set $p_i = 1/N$.
          *   *The Crucial Technical Move:* Because $V$ is a *single* utility function over the extended domain, $V(i, \cdot)$ and $V(j, \cdot)$ are automatically cardinally comparable. They share the same zero and unit defined by $V$.
          *   *The "Work" done:* The equiprobability doesn't create comparability; the *extended preference domain* creates comparability. Equiprobability just sets the weights to equal.
          *   *Caveat:* This relies on the coherence of "extended preferences" (can I really prefer being you rich vs me poor?).
      *   **Part 3: Comparison/Conclusion.**
          *   SAT: Linear aggregation of *independent* scales. Weights are indeterminate without external calibration.
          *   IOT: Aggregation within a *unified* scale. Comparability is built into the domain definition.
          *   Final verdict: IOT is stronger but relies on a controversial metaphysical/psychological assumption (extended preferences) rather than just aggregation of existing preferences.

  5.  **Refining the Technical Precision:**
      *   Make sure to distinguish between *ordinal*, *cardinal*, and *interpersonally comparable*.
      *   Use $\mathcal{L}$ for lotteries.
      *   Explicitly write the affine transformation $u' = \alpha u + \beta$.
      *   Highlight that SAT assumes fixed $u_i$ representations, whereas IOT constructs them from a master $V$.
      *   Mention Weymark (1991) or Mongin (1994) implicitly or explicitly as they formalized these critiques. (Decided: Keep it focused on the logic, maybe name-drop Sen/Weymark for context).
      *   Ensure the distinction between "weights" ($a_i$) and "probabilities" ($p_i$) is clear. In SAT, $a_i$ are welfare weights. In IOT, $p_i$ are identity probabilities.

