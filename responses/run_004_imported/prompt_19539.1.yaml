answer: |-
  You are absolutely correct to distinguish these two results. The conflation of Harsanyi's 1955 Social Aggregation Theorem (SAT) and his 1953 Impartial Observer Theorem (IOT) is a pervasive error in popular rationalist discourse. The former is a formal result about aggregating fixed preferences; the latter is a constructive model of moral reasoning under uncertainty.

  The core technical issue lies in the **informational basis** of the two theorems. The 1955 theorem operates on a "thin" informational base (individual vNM utilities) that lacks the structure to support interpersonal comparison. The 1953 theorem operates on a "thick" informational base (extended preferences) that builds interpersonal comparability into the domain of choice itself.

  Here is the technical walkthrough of why the weights in the 1955 theorem fail to secure interpersonal comparability (IPC), and how the 1953 theorem attempts to construct it.

  ---

  ### 1. The 1955 Social Aggregation Theorem: The Indeterminacy of Weights

  The 1955 theorem addresses the following problem: Given a set of individuals $N = \{1, \dots, n\}$, each with preferences $\succeq_i$ over a set of lotteries $\mathcal{L}$, and a social planner with preferences $\succeq_S$ over $\mathcal{L}$, what is the relationship between individual and social utility?

  #### The Axioms and Representation
  1.  **Individual Rationality:** Each $\succeq_i$ satisfies the von Neumann–Morgenstern (vNM) axioms. Thus, each is representable by a utility function $u_i: \mathcal{L} \to \mathbb{R}$, unique up to a positive affine transformation:
      $$u_i'(L) = \alpha_i u_i(L) + \beta_i, \quad \alpha_i > 0$$
  2.  **Social Rationality:** $\succeq_S$ satisfies vNM axioms. Thus, it is representable by $W: \mathcal{L} \to \mathbb{R}$, unique up to $\alpha_S, \beta_S$.
  3.  **Pareto Indifference:** For any $L, L' \in \mathcal{L}$, if $u_i(L) = u_i(L')$ for all $i$, then $W(L) = W(L')$. (Stronger versions use Pareto Preference, but Indifference suffices for the linearity result).

  #### The Result
  Harsanyi proves that $W$ must be a linear combination of the $u_i$:
  $$W(L) = \sum_{i=1}^n a_i u_i(L) + b$$
  where $a_i, b \in \mathbb{R}$. If we add Strong Pareto, $a_i \geq 0$.

  #### The Sen-Style Objection: Why $a_i$ Are Not Moral Weights
  The utilitarian interpretation requires that $a_i$ represent the *moral weight* of individual $i$. However, in the 1955 framework, the $u_i$ are merely numerical representations of ordinal preferences over risk. They possess no intrinsic interpersonally comparable units.

  Consider the affine invariance of vNM utility. Suppose we have a valid representation profile $(u_1, \dots, u_n)$ and social function $W$ with weights $(a_1, \dots, a_n)$.
  Now, consider a new representation for individual 1, $u_1'$, where we simply change the unit of measurement (e.g., measuring "utils" in cents instead of dollars, or simply rescaling):
  $$u_1'(L) = 1000 \cdot u_1(L)$$
  (Here $\alpha_1 = 1000, \beta_1 = 0$). This $u_1'$ represents $\succeq_1$ just as validly as $u_1$ does.

  For the social aggregation equation to hold for the *same* social preference $\succeq_S$ (and thus the same $W$, up to its own affine transformation), the weight $a_1$ must adjust to compensate:
  $$W(L) = a_1' u_1'(L) + \sum_{j \neq 1} a_j u_j(L) + b$$
  $$W(L) = a_1' (1000 \cdot u_1(L)) + \dots$$
  To keep $W$ invariant, we must have $a_1' = \frac{a_1}{1000}$.

  **The Technical Failure:**
  The magnitude of the weight $a_i$ is inversely proportional to the arbitrary scaling factor $\alpha_i$ of the individual's utility representation.
  *   If I define my utility scale to be "huge" (large $\alpha_i$), my moral weight $a_i$ becomes tiny.
  *   If I define my utility scale to be "tiny" (small $\alpha_i$), my moral weight $a_i$ becomes huge.

  Since the 1955 axioms provide no mechanism to fix the $\alpha_i$ and $\beta_i$ across different persons, the weights $a_i$ are **mathematically indeterminate** with respect to moral significance. They are merely conversion factors required to sum heterogeneous scales. To interpret $\sum a_i u_i$ as classical utilitarianism, one must *externally* impose a normalization condition (e.g., "everyone's utility range is [0,1]"), but nothing in the 1955 theorem justifies that normalization. It smuggles in interpersonal comparability rather than deriving it.

  ---

  ### 2. The 1953 Impartial Observer Theorem: Constructing Comparability

  The 1953 theorem attempts to bypass the scaling problem by changing the domain of choice. It does not aggregate pre-existing, separate utility functions. Instead, it constructs a single utility function over an **extended domain** that includes identity.

  #### The Extended Domain
  Let $X$ be the set of social outcomes. Let $N$ be the set of individuals.
  The Impartial Observer (IO) chooses among lotteries over **extended alternatives** $(i, x)$, meaning "being individual $i$ in outcome $x$."
  Let $\mathcal{L}^*$ be the set of lotteries over $N \times X$.

  #### The Axioms
  1.  **Observer Rationality:** The IO's preferences $\succeq_{IO}$ over $\mathcal{L}^*$ satisfy vNM axioms.
      *   This yields a single utility function $V: N \times X \to \mathbb{R}$.
      *   Crucially, because $V$ is a *single* vNM function, it has a **single scale**. The unit and zero of $V(i, \cdot)$ are the same as $V(j, \cdot)$ by definition.
  2.  **Acceptance Principle:** When the IO considers the prospect of becoming individual $i$, they adopt $i$'s preferences over $X$.
      *   Formally: For any fixed $i$, the function $v_i(x) \equiv V(i, x)$ is a valid vNM representation of individual $i$'s preferences $\succeq_i$.
  3.  **Impartiality (Veil of Ignorance):** The IO evaluates social states behind a veil of ignorance where they have an equal probability of becoming any person $i \in N$.

  #### The Derivation
  The IO evaluates a social state $x$ by the expected utility of facing the "identity lottery."
  Let $p_i$ be the probability of becoming person $i$. Under the equiprobability assumption, $p_i = \frac{1}{n}$ for all $i$.

  The Social Welfare function $SW(x)$ is the IO's expected utility:
  $$SW(x) = \sum_{i=1}^n p_i V(i, x)$$
  Substituting the Acceptance Principle ($V(i, x) = u_i(x)$) and Equiprobability ($p_i = 1/n$):
  $$SW(x) = \frac{1}{n} \sum_{i=1}^n u_i(x)$$

  #### What Work Does the Equiprobability Device Do?
  In the 1955 theorem, the weights $a_i$ were indeterminate because the $u_i$ were on independent scales. In the 1953 theorem, the equiprobability device works only because the **Acceptance Principle + Extended Domain** has already solved the scaling problem.

  1.  **Unification of Scale:** By positing a single Observer with vNM preferences over $(i, x)$, Harsanyi forces all individual utilities into a common metric. $V(1, x)$ and $V(2, x)$ are comparable because they are values of the *same function* $V$ evaluated at different arguments. The "unit" of utility is defined by the Observer's risk attitudes over extended prospects (e.g., "How much risk of being Person 1 in state $A$ vs Person 2 in state $B$ is the Observer willing to take?").
  2.  **Fixing the Weights:** The equiprobability assumption ($p_i = 1/n$) is not doing the work of making utilities comparable; it is doing the work of setting the **moral weights** to be equal.
      *   In 1955: $a_i$ is a weight applied to an independent scale.
      *   In 1953: $p_i$ is a probability applied to a unified scale.

  Because $V$ provides a common cardinal scale, the coefficients $p_i$ are no longer sensitive to arbitrary rescalings of individual $u_i$. If you rescale $u_1$, you violate the Acceptance Principle relative to the fixed $V$. The scale is anchored by the Observer's preferences over identity lotteries.

  ### 3. Summary of the Technical Distinction

  | Feature | 1955 Social Aggregation Theorem | 1953 Impartial Observer Theorem |
  | :--- | :--- | :--- |
  | **Domain** | Outcomes/Lotteries $L$ | Extended Alternatives $(i, x)$ |
  | **Utility Source** | Aggregation of $n$ independent $u_i$ | Single Observer utility $V$ |
  | **Comparability** | **Not Derived.** $u_i$ are cardinally measurable but interpersonally non-comparable. | **Built-in.** $V(i, \cdot)$ and $V(j, \cdot)$ share the scale of $V$. |
  | **Coefficients** | Weights $a_i$ (indeterminate without normalization) | Probabilities $p_i$ (fixed by Veil of Ignorance) |
  | **Vulnerability** | Sen's critique: Weights absorb arbitrary scaling factors. | Critique: Requires coherence of "extended preferences" (can I meaningfully prefer being you?). |

  ### Conclusion

  The 1955 theorem fails to prove utilitarianism because it treats interpersonal comparison as an aggregation problem of independent metrics. The weights $a_i$ cannot carry moral significance because they are mathematically coupled to the arbitrary units of the $u_i$.

  The 1953 theorem succeeds (conditionally) by treating interpersonal comparison as a **measurement problem** solved by expanding the domain. The equiprobability device works only because the "Impartial Observer" construct creates a unified utility space where "1 util for Person 1" and "1 util for Person 2" are defined by the same risk trade-offs made by the Observer.

  However, this success comes at a high metaphysical cost. It requires accepting that an Observer can have coherent preferences over "being someone else," which many (including Sen and Weymark) argue presupposes the very interpersonal comparability it claims to derive. The 1955 theorem assumes too little information to derive comparability; the 1953 theorem assumes a domain (extended preferences) that contains comparability by construction.
