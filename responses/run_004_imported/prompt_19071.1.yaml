answer: |-
  Thank you all for being here. Looking around this room, I see the two distinct hemispheres of Miriam's life. On one side, her colleagues from the literature department, who know the texture of her mind better than I ever could. On the other, our family, our friends, and a few of my old colleagues from the physics department.

  For thirty years, Miriam and I had a running debate at the dinner table. It was our version of foreplay, our way of staying curious. I am a physicist; I spent my life studying statistical mechanics and the thermodynamic arrow of time. My job was to measure how things decay, how order turns to disorder, how the future becomes distinct from the past.

  Miriam's job, however, was to read Jorge Luis Borges. Specifically, she was obsessed with his essay, "A New Refutation of Time."

  For those of you who haven't spent your weekends reading Argentine metaphysicians, the essay is a dazzling intellectual trap. Borges argues that if you accept that the "self" is just a bundle of fleeting perceptions, and that matter doesn't exist independently of the mind, then there is no substrate for time to act upon. If there is no "you" to persist from one moment to the next, then time, in the strong sense, cannot exist. It's an illusion.

  For decades, I would needle her. I'd tell her, "Miriam, entropy doesn't care about your perceptions. The coffee gets cold. The cells degrade. Time is real."

  And she would smile, turn to the dog-eared paperback in her lap, and read me the ending. Because Borges, after building this magnificent cathedral of logic to prove time isn't real, knocks it down in the final paragraph. He admits that despite his argument, he still feels pain. He still fears death. He writes, "The world, unfortunately, is real." He admits he is still "the tiger," still "the river." He cannot logic his way out of being human.

  Miriam always told me that final paragraph was the only truly honest thing Borges ever wrote.

  I stand here today, a man of science, and I could easily reach for the cheap comfort of that first part of the essay. I could tell you that because time is a subjective construct, Miriam isn't truly gone. I could tell you that in the block universe of physics, every moment she ever lived still exists eternally in the coordinate system of spacetime.

  But if I said that, I know exactly what Miriam would say. She would say I'm hiding. She would say I'm using mathematics to do what Borges tried and failed to do: evade the weight of being alive.

  So, I will not tell you that time is an illusion. I will not tell you that she isn't really dead.

  The thermodynamic arrow points one way. The entropy of our lives has increased. She is gone. The silence in our house is measurable. It is, as Borges admitted, unfortunately real.

  But if the pain of this loss is real, then the love that caused it was real, too.

  Miriam taught me that the value of the essay wasn't the refutation; it was the surrender. It was the admission that we are bound to this timeline, to this flesh, to this specific succession of moments. We are the tiger. We are the river. We are here, and then we are not.

  To our children and grandchildren: Your grandmother knew that the world was hard and real. She didn't love you because she thought time was a trick. She loved you because she knew time was running out. She cherished every Tuesday dinner, every holiday, every ordinary afternoon precisely because she knew they were vanishing.

  To her colleagues: She loved the argument, but she loved the truth more. She knew that philosophy ends where the human heart begins.

  And to my friends in physics: I concede the point. Entropy governs the universe, but meaning governs the observer. We are the observers.

  Miriam, you won the argument. The world is real. The loss is real. And because it is real, I promise to honor it. I will not pretend you are elsewhere. I will carry the disorder you left in my life like a badge of honor. I will be the tiger, and I will be the river, and I will remember you in the only time we actually have.

  Right now.

  Rest well, my love. The class is dismissed.
