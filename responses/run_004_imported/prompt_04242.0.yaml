answer: |-
  This is an exceptionally sharp reading, and it identifies one of the most fertile tensions in Quine's later philosophy. You are right to pressure-test this: if holism is the wrecking ball for the analytic/synthetic distinction, it looks like it should be the wrecking ball for the fact/value distinction too. If all sentences face the tribunal of experience as a corporate body, why can't moral sentences be part of that body in the same way physical sentences are?

  However, to commit to this inference in a dissertation, you need to navigate a specific trap. Quine *does* grant ethics a holistic structure (reflective equilibrium), but he explicitly denies it the ontological status of science. The "correspondence/coherence hedge" is not merely a restatement of asymmetry; for Quine, it is grounded in **behavioral physicalism**.

  Here is a breakdown of how to pressure-test your inference, where the friction points lie, and how to position this in your chapter.

  ### 1. The Disanalogy: Holism vs. Causal Anchor
  Your inference rests on the idea that holism is the *sole* criterion for scientific status in "Two Dogmas." But in Quine's mature naturalism (e.g., *Pursuit of Truth*, *Theories and Things*), holism is necessary but not sufficient.

  *   **In "Two Dogmas":** The attack on analyticity is epistemological. Quine argues we cannot isolate which sentences are true by virtue of meaning and which by virtue of fact because *any* sentence can be held true come what may, if we make drastic enough adjustments elsewhere in the web.
  *   **In "On the Nature of Moral Values":** The exclusion of ethics is **ontological and causal**. Quine's naturalism is physicalist. For a sentence to be "factual" in the scientific sense, it must ultimately be keyed to **sensory stimulation** caused by external physical objects.

  **The Pressure Point:** Quine argues that while moral judgments are revised holistically (like scientific ones), the *recalcitrant experience* that forces revision in science is **sensory irritation** (caused by physical objects), whereas in ethics, it is **sentiment** or **feeling** (caused by social conditioning or internal psychology).

  **Verdict:** The fact/value line doesn't collapse for Quine because the "web of belief" has a specific anchor: the surface of the body. Science touches the world; ethics touches the self/society. If your dissertation argues the line *should* collapse, you are arguing against Quine's physicalism, not just his holism.

  ### 2. Re-evaluating the "Correspondence/Coherence" Hedge
  You suspect the hedge is a restatement of asymmetry rather than a reason for it. I would argue it is doing more work than it appears, but perhaps not the work Quine thinks it is.

  *   **Quine's View:** He is a deflationist about truth, so "correspondence" is a loose term for him. However, he insists science has a **causal story** that ethics lacks. Scientific truth involves a causal chain from object to neuron. Ethical "truth" (or validity) involves coherence among sentiments.
  *   **The Vulnerability:** You can argue that this distinction is unstable *within Quine's own framework*. If meanings are determined by use within the web (as per "Two Dogmas"), and moral terms have a stable use within the web of social behavior, why isn't that enough for "factual" status?
  *   **The "Gibbard" Counter:** Allan Gibbard (a Quinean expressivist) argues that Quine is right to distinguish them, but not because ethics lacks truth. Rather, ethics serves a different function (norming action vs. describing states).
  *   **The "Rosenberg" Counter:** Alex Rosenberg argues that consistent Quinean naturalism *does* require collapsing the distinction, leading to an error theory (moral statements are all false because there are no moral facts).

  **Dissertation Strategy:** Don't claim Quine *failed* to see the collapse. Claim that Quine's **physicalism overrides his holism** here. He allows holism to rule epistemology, but physicalism rules ontology. The "hedge" is the point where his physicalism draws a line that his holism would otherwise erase.

  ### 3. Three Ways to Frame This Chapter
  Depending on your thesis's overall arc, here are three ways to deploy this inference:

  **Option A: The Inconsistency Critique (Strongest for Critical Chapters)**
  Argue that Quine is inconsistent. His holism in "Two Dogmas" undermines the foundationalism required to privilege sensory stimulation over moral sentiment. If "no statement is immune to revision," then the privilege of physical science is pragmatic, not ontological. Therefore, the fact/value distinction is, like analytic/synthetic, a matter of degree (centrality to the web), not kind.
  *   *Risk:* You have to explain why Quine explicitly denied this. (Answer: He prioritized physicalism over radical holism in later years).

  **Option B: The Pragmatic Distinction (Most Faithful to Quine)**
  Argue that the distinction survives but changes category. In "Two Dogmas," the analytic/synthetic distinction was rejected as *metaphysical/epistemological*. In ethics, the fact/value distinction is retained as *pragmatic*. Science is the "best tool" for predicting sensory stimuli; ethics is the "best tool" for social coordination. Both are holistic, but only one maps causal physical relations.
  *   *Benefit:* This respects Quine's text while showing you understand the nuance of his naturalism.

  **Option C: The "Causal Constraint" Argument (Most Philosophically Rigorous)**
  Focus on the **causal constraint**. Argue that the analytic/synthetic distinction fell because it lacked a causal story (meaning couldn't be isolated from fact). The fact/value distinction *remains* for Quine precisely because science *has* a causal story (stimulation) and ethics *does not*.
  *   *Thesis:* "Quine saves the fact/value distinction not by rejecting holism, but by restricting the 'tribunal of experience' to physical stimulation."
  *   *Pressure Test:* Is "sentiment" really causally distinct from "stimulation"? If sentiments are neural states, why aren't they physical facts? This is where you can really dig in.

  ### 4. Key Textual Evidence to Check
  To solidify this, check these specific points in the texts:
  1.  **"On the Nature of Moral Values" (in *Theories and Things*, 1981):** Look for his discussion of "objective values." He explicitly denies they exist. He says moral judgments are "corrigible" but not "true" in the scientific sense.
  2.  ***Pursuit of Truth* (1990/1992):** Quine discusses the "key" to the web of belief. He emphasizes **sensory reception** as the only non-arbitrary anchor.
  3.  **"Reply to Gilbert Harman" (in *The Philosophy of W.V. Quine*, Hahn & Schilpp):** Quine addresses moral realism directly. He distinguishes between the *observation sentences* of science and the *conditioned responses* of ethics.

  ### 5. Recommendation
  Your inference is correct that the *logic of holism* pushes toward collapse. However, Quine's *system* blocks the collapse via physicalism.

  **Do not write:** "Quine fails to see that his holism collapses the fact/value distinction."
  **Do write:** "While Quine's holism exerts centrifugal pressure on the fact/value distinction analogous to the analytic/synthetic critique, his commitment to physicalist ontology acts as a centripetal force, preserving the distinction by anchoring 'fact' to causal stimulation rather than systemic coherence."

  This allows you to use your insight (the parallel pressure of holism) without misrepresenting Quine's final position. It frames the "correspondence/coherence hedge" not as a circular assertion, but as the specific mechanism (physicalist causality) Quine uses to resist the full implications of his own holism in the moral domain.

  This is dissertation-worthy material. It shows you aren't just summarizing Quine, but tracing the structural stress points in his naturalism.
