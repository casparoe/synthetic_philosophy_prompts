prompt: |-
  I'm building a dissertation chapter on Quine's naturalism and want to pressure-test an inference before I commit to it. In "Two Dogmas," the case against the analytic/synthetic distinction rests entirely on holism: no sentence is checked against experience except as part of the whole web of belief, so the line between truths grounded in meaning and truths grounded in fact cannot be principled — it's a matter of centrality, not kind. In "On the Nature of Moral Values," Quine seems to run the same argument on the fact/value line: moral standards, like physical hypotheses, are revised piecemeal under pressure from recalcitrant experience and feeling, and no single moral judgment is checkable except against the rest of one's values. He does hedge by saying science keeps "some title" to a correspondence theory of truth while a coherence theory is "the lot of ethics," but that looks to me like a restatement of the asymmetry rather than a reason for it, now that both domains are conceded to run on the same holistic engine. So once Quine grants ethics the very holism he used to dismantle the first dogma, what in his own framework stops the fact/value line from collapsing the same way the analytic/synthetic one did — or is that correspondence/coherence hedge doing more work than it looks like at first pass?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Quine's naturalism, specifically the relationship between "Two Dogmas of Empiricism" (analytic/synthetic distinction) and "On the Nature of Moral Values" (fact/value distinction).
      *   **Core Inference:** The user argues that Quine uses holism to dismantle the analytic/synthetic distinction in "Two Dogmas." In "On the Nature of Moral Values," Quine applies a similar holism to ethics (moral judgments are revised piecemeal against experience/feeling within a web of belief). Therefore, the user infers that the fact/value distinction *should* collapse just like the analytic/synthetic one did.
      *   **The Puzzle:** Quine hedges in "On the Nature of Moral Values" by granting science a "title" to correspondence truth while assigning ethics a coherence theory. The user sees this as a restatement of asymmetry rather than a justification, especially given the shared holistic engine.
      *   **The Question:** What in Quine's framework stops the fact/value line from collapsing like the analytic/synthetic one? Or is the correspondence/coherence hedge doing more work than it appears?
      *   **Goal:** Pressure-test this inference for a dissertation chapter.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Two Dogmas:* Yes, holism (confirmation holism) is central to blurring the analytic/synthetic line. If sentences face the tribunal of sense experience only as a corporate body, you can't isolate meaning-constitutive sentences (analytic) from fact-constitutive ones (synthetic).
      *   *On the Nature of Moral Values:* This is a specific essay (1981, in *Theories and Things*). I need to recall/verify Quine's stance there. Quine *is* a moral irrealist/error theorist generally, but in this essay, he discusses the status of moral judgments. He does emphasize the causal link to sensory stimulation for science, which is missing in ethics.
      *   *The User's Inference:* It's a strong, sophisticated reading. Many scholars (e.g., Alex Rosenberg, naturalists) push for a full collapse. However, Quine himself resisted full moral realism.
      *   *The Crucial Difference:* In "Two Dogmas," the target is *epistemological/semantic* (how we know/mean). In "On the Nature of Moral Values," the target is *ontological/causal* (what triggers the belief).
      *   *The "Hedge":* The correspondence vs. coherence distinction isn't just a label for Quine; it's rooted in *causal stimulation*.

  3.  **Deconstructing the Argument (Pressure-Testing):**

      *   **Point 1: The Role of Holism.**
          *   In "Two Dogmas," holism kills the distinction because *all* sentences are on par regarding empirical content.
          *   In Ethics, holism exists (reflective equilibrium), *but* the input is different. Science gets sensory stimulation; ethics gets "sentiment" or "feeling."
          *   *Critique:* Does the difference in input matter enough to save the fact/value distinction? For Quine, yes, because of physicalism.

      *   **Point 2: The Correspondence/Coherence Hedge.**
          *   User says it looks like a restatement.
          *   Counter: For Quine, correspondence is tied to *causal commerce with the world*. Science tracks physical objects that cause sensations. Ethics tracks internal sentiments or social conditioning.
          *   So, the hedge isn't arbitrary; it's grounded in his behaviorism/physicalism.

      *   **Point 3: The Collapse.**
          *   Does the fact/value distinction collapse? Quine says *no*. He remains a moral irrealist (or at least a skeptic about moral truth).
          *   Why? Because moral sentences don't refer to natural properties in the same way. They function to prescribe, not describe.
          *   *Nuance:* Quine sometimes suggests moral truths can be "true" in a deflationary sense if they cohere, but they lack the *empirical anchor* of science.

      *   **Point 4: The Dissertation Angle.**
          *   The user needs to know if this inference is defensible.
          *   It is defensible as a *critique* of Quine (i.e., "Quine *should* have collapsed them"), but less defensible as an exegesis of Quine's *own* conclusion (since he explicitly maintains the distinction).
          *   The tension lies between his *holistic epistemology* (which pushes toward collapse) and his *physicalist ontology* (which pushes toward distinction).

  4.  **Drafting the Response:**

      *   **Validate:** Acknowledge the strength of the reading. It's a standard "naturalist challenge" to Quine.
      *   **Identify the Fault Line:** The key isn't holism per se, but the *causal anchor* (sensory stimulation).
      *   **Analyze the "Hedge":** Explain why correspondence vs. coherence isn't just a label for Quine. It's about the *source* of the constraint. Science: External world. Ethics: Internal sentiment/Social reinforcement.
      *   **The "Two Dogmas" Parallel:** In "Two Dogmas," the attack is on *reductionism*. In Ethics, the issue is *reference/truth-makers*.
      *   **Quine's Actual Position:** He doesn't think the fact/value distinction collapses. He thinks moral statements lack truth values in the robust scientific sense (error theory/expressivism leanings).
      *   **Strategic Advice for Dissertation:**
          *   Option A: Argue Quine is inconsistent (Holism demands collapse, Physicalism blocks it).
          *   Option B: Argue the distinction survives but changes shape (Pragmatic vs. Ontological).
          *   Option C: Focus on the "causal constraint" as the real differentiator, not holism.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, did Quine say ethics is coherence?* Yes, roughly. He says moral judgments are judged by how well they cohere with our sentiments and other judgments.
      *   *Did he say science is correspondence?* He's wary of "correspondence" as a metaphysical relation, but he accepts the *causal* story that looks like correspondence.
      *   *Key Text:* "On the Nature of Moral Values" (in *Theories and Things*). Quine writes: "The truth of a moral judgment... is not a matter of correspondence to a moral fact."
      *   *Crucial Distinction:* In "Two Dogmas," the attack is on the *source* of necessity (meaning vs. fact). In Ethics, the attack is on the *existence* of the facts themselves.
      *   *Refinement:* The user's inference is that holism *forces* the collapse. I need to show why Quine thinks holism + physicalism *allows* the distinction to remain. The "tribunal of experience" includes sensory stimuli for science, but only "sentiments" for ethics. Sentiments aren't "facts" in the physicalist ontology.

  6.  **Finalizing the Structure:**
      *   **Introduction:** Validate the insight (it's a known tension).
      *   **The Disanalogy:** Holism is necessary but not sufficient. The *input* matters (Sensory Stimulation vs. Sentiment).
      *   **The Hedge Explained:** Correspondence = Causal link to physical world. Coherence = Internal consistency of sentiments. This isn't circular; it's physicalist.
      *   **Why the Distinction Survives (for Quine):** Ontology. Science posits entities that explain stimuli. Ethics posits nothing beyond sentiments.
      *   **Dissertation Strategy:** Don't claim Quine *did* collapse it. Claim his framework *pressures* it, or that the distinction shifts from epistemological to ontological.
      *   **References:** Mention *Pursuit of Truth*, *Theories and Things*, and secondary lit (Gibbard, Rosenberg, etc.).

  7.  **Final Polish:** Ensure tone is academic, supportive, and rigorous. (Self-check: Make sure not to attribute full moral realism to Quine; he's generally skeptical.)

  *(Self-Correction)*: I need to be careful about the "correspondence" claim. Quine is famously deflationary about truth. He doesn't love "correspondence." But he does distinguish the *causal* link. I should phrase this carefully as "causal constraint" rather than metaphysical correspondence.

  *(Final Plan)*:
  1. Affirm the strength of the parallel.
  2. Identify the "Causal Constraint" as the blocker.
  3. Explain the Correspondence/Coherence distinction in physicalist terms.
  4. Offer three paths for the dissertation chapter.
  5. Suggest specific textual evidence.

