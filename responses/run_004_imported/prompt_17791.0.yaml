answer: |-
  **Setting:** *A university conference room. A stack of resumes sits in the center of the table. It is 4:00 PM on a Tuesday. The committee has just finished interviewing Candidate 4.*

  **Dr. Arthur Sterling (Rational-Choice Economist):** Let's mark Candidate 4 as a "hire" and adjourn. She clears every metric on our scorecard. Her publication rate is above the departmental median, her teaching evals are solid, and she fits the budget. We have reached our aspiration level. To continue interviewing is to burn resources for negligible expected gain.

  **Dr. Elena Chen (Bounded-Rationality Theorist):** I'm not ready to close the pool, Arthur. We have three more candidates scheduled. Just because Candidate 4 is "good enough" doesn't mean she's the *best* we can find. If we stop now, we're satisficing, not maximizing.

  **Sterling:** Elena, please. You're treating "satisficing" and "maximizing" as mutually exclusive behaviors. They aren't. Stopping the search once a threshold is met *is* a maximizing strategy, provided you fold the costs of search and computation into the objective function. We are optimizing a net benefit function: Value of Candidate minus Cost of Interviewing. Candidate 4 yields a positive net value. Candidate 5 might yield a higher gross value, but the marginal cost of flying her out, housing her, and our own time here today likely exceeds the marginal expected improvement. Therefore, stopping is optimal.

  **Chen:** There it is. The classic rescue operation. Whenever behavior looks like it deviates from perfect optimization, you simply posit a "search cost" large enough to make the deviation look optimal again. But Arthur, this redescription explains nothing unless you can specify those costs *independently* of the behavior they are meant to explain. Can you tell me, right now, before we interview Candidate 5, what the exact cost of interviewing her is?

  **Sterling:** Certainly. It's the sum of her travel budget, the stipend, and the hourly rate of the five faculty members in this room multiplied by the hours spent. It's an accounting identity.

  **Chen:** That's the monetary cost. But your model relies on *computation* costs too—the cognitive load of comparing Candidate 5 to Candidate 4. If you can't measure that cognitive cost without first observing where we decided to stop, your theory is tautological. You're saying we stopped because the cost was high, and you know the cost was high because we stopped. That's not a model; it's a just-so story.

  **Sterling:** You're demanding a precision that no social science can deliver. But the logic holds. If we continued interviewing, revealed preference theory suggests we would be revealing that we believe the marginal cost was *lower* than the marginal gain. Since we are choosing to stop, we are revealing the opposite. The framework remains consistent. Satisficing is just optimization under constraints.

  **Chen:** The framework is consistent only because you've made it unfalsifiable. Herbert Simon's point wasn't just that constraints exist; it was that the human mind lacks the capacity to perform the optimization you're describing, even if we wanted to. We don't calculate that marginal cost you mentioned. We use a heuristic. We set an aspiration level based on past experience—what we've seen in the market so far—and we take the first option that clears it. That is a different *process* than what you're describing.

  **Sterling:** I don't care about the process, Elena. I care about the prediction. If I assume the committee acts *as if* they are optimizing including search costs, I can predict they will stop when the expected value of the next candidate drops below the cost of the interview. That predicts the same outcome as your "aspiration level" rule. Why complicate the ontology?

  **Chen:** Because the predictions diverge when the environment changes. If you're right, and we are optimizing, then if you lower the cost of the interview—say, we do it over Zoom—we should search longer and raise our standards. If I'm right, and we are using an aspiration-level heuristic, we might not search longer at all; we might just fill the slot faster because the friction is lower, but the *quality* threshold remains anchored to what we saw in the first four candidates. Your model assumes we recalculate the whole function. Simon's model suggests we adjust the aspiration level slowly, based on feedback.

  **Sterling:** But that adjustment of the aspiration level *is* a recalculation of the cost function. If the market is tough, the "cost" of finding a better candidate rises, so the aspiration level lowers. You're describing the same equilibrium using psychological vocabulary instead of price signals. By insisting on the "bounded" label, you imply irrationality where there is none. Candidate 4 is the rational stopping point.

  **Chen:** It's not about irrationality, Arthur. It's about procedural rationality versus substantive rationality. You are assuming we know the distribution of candidate quality in the population to calculate that "expected value" you keep citing. We don't. We are in the dark. We don't know if Candidate 5 is a star or a dud. Because we can't know the distribution, we can't optimize. We can only satisfy. By claiming we are optimizing, you are attributing knowledge to us that we do not possess.

  **Sterling:** We possess probabilistic estimates. That's what priors are for.

  **Chen:** And where do those priors come from? If you derive them from the very candidates we've already interviewed, then your "optimization" is entirely path-dependent. It relies on the order of arrival. True optimization shouldn't care about the order; it cares about the absolute best. But if we stop at 4 because she's better than 1, 2, and 3, we might miss 5 who is better than all of us. Your model says we weighed that risk. I say we simply ran out of cognitive steam or stuck to a rule of thumb.

  **Sterling:** And if that rule of thumb yields the same result as the optimization model, the distinction is academic.

  **Chen:** It's not academic if we want to improve the hiring process. If you're right, we improve by lowering search costs. If I'm right, we improve by adjusting how we set aspiration levels—perhaps by blind reviewing, or by calibrating against external benchmarks rather than the internal pool. Your model tells us to cut travel budgets. Mine tells us to change how we evaluate.

  **Sterling:** *Pauses, tapping a pen on the resume.* You argue that my cost specification is post-hoc. But surely, the fact that we are all tired, it's 4:00 PM, and we have grading to do constitutes an independent measure of increased marginal cost.

  **Chen:** *Smiles slightly.* That's a physiological constraint, Arthur. That's bounded rationality. You're welcome to call it a "cost," but admitting that our biology limits our computation is exactly my point. You can wrap the limitation in the language of optimization, but you haven't escaped the boundary.

  **Sterling:** *Sighs.* Fine. We agree that the marginal cost of continuing is currently high. Whether we call that a "price" or a "cognitive bound," the decision is to stop.

  **Chen:** The decision is to stop. But let's note in the minutes that we are doing so because Candidate 4 meets the department's needs, not because we have mathematically proven she is the global maximum.

  **Sterling:** I can live with that. Provided the minutes also reflect that meeting those needs maximizes the department's utility function given current constraints.

  **Chen:** *Closing her folder.* I'll let you write the minutes, Arthur. I think we're both bounded enough to know when to adjourn.
