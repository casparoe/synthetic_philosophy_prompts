prompt: |-
  So we had a nasty prod outage at work last month that turned out to only happen when two old feature flags were both on at once, an interaction nobody had ever actually tested. In the postmortem my tech lead argued that since that interaction was technically already implied by code I'd written and gotten approved months earlier, I basically already knew it would happen, same as if I'd shipped it broken on purpose, and now he wants it written up on my review as something I should've caught. I said theres no way I couldve traced every possible interaction through a 50k line codebase in my head before merging, but he just goes "the logic is the logic, you wrote it, you knew." Something about that argument feels off to me but I can't put my finger on why. Who's actually right here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Situation:**
      *   **Event:** A production outage occurred due to an interaction between two old feature flags being on simultaneously.
      *   **Cause:** This specific interaction was never tested.
      *   **Tech Lead's Stance:** The code implied the behavior. Since the user wrote and got approval for the code months earlier, they "knew" it would happen. It's equivalent to shipping broken code on purpose. Wants this on the performance review as a failure to catch.
      *   **User's Stance:** It's impossible to trace every possible interaction in a 50k line codebase mentally before merging. The argument feels unfair/unreasonable.
      *   **Goal:** Determine who is "right" (or rather, what's the reasonable perspective) and help the user articulate why the lead's argument is flawed.

  2.  **Evaluate the Tech Lead's Argument:**
      *   *Claim:* "The logic is the logic, you wrote it, you knew."
      *   *Implication:* Deterministic code means the outcome is known at the time of writing. Therefore, any bug is negligence or malice.
      *   *Flaw:* This ignores *complexity*, *emergent behavior*, *state space explosion*, and the purpose of *testing/QA processes*. It conflates "theoretically determinable" with "practically knowable."
      *   *Tone:* Blame-oriented, retrospective omniscience (hindsight bias).

  3.  **Evaluate the User's Argument:**
      *   *Claim:* Cannot trace every interaction in a large codebase mentally.
      *   *Implication:* Human cognitive limits exist. Systems need safeguards (tests, CI/CD, flag management) beyond individual mental models.
      *   *Validity:* Highly valid. This is a fundamental principle of modern software engineering (DevOps, SRE).

  4.  **Identify the Core Engineering Concepts:**
      *   **Cognitive Load:** Humans can't hold 50k lines of logic + all flag combinations in working memory.
      *   **Combinatorial Explosion:** 2 flags = 4 states. 10 flags = 1024 states. Testing all is often impossible without strategy.
      *   **Systemic vs. Individual Error:** Was this a person failure or a process failure? (Just Culture).
      *   **Hindsight Bias:** Knowing the outcome makes the path seem obvious.
      *   **Feature Flag Hygiene:** Old flags should be cleaned up. Interactions should be documented/tested.

  5.  **Formulate the Verdict:**
      *   The Tech Lead is **wrong** (or at least, operating on an outdated/unsustainable model of software development).
      *   The User is **right** (their intuition about cognitive limits is correct).
      *   *Nuance:* The user might share *some* responsibility (e.g., did they add the second flag without checking the first?), but the lead's characterization ("same as if you'd shipped it broken on purpose") is toxic and factually incorrect regarding software complexity.

  6.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Start by validating the user's feeling. It *is* off. It's a classic "fundamental attribution error" mixed with hindsight bias.
      *   *Deconstruct the Lead's Logic:* Explain *why* "the logic is the logic" is a fallacy in complex systems. Use the term "Combinatorial Explosion."
      *   *The "Just Culture" Angle:* Introduce the concept of blameless postmortems. This is crucial for senior-level discourse.
      *   *Feature Flag Management:* Point out that the *system* allowed two old flags to coexist dangerously. That's a process issue, not just a code issue.
      *   *Actionable Advice:* How to respond to the lead? How to handle the review?
      *   *Tone:* Professional, supportive, objective, but firm on the engineering principles.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "Your lead is an idiot." I need to explain *why* their mental model is flawed so the user can argue back professionally.
      *   *Addition:* Mention that code approval exists *because* we know individuals miss things. If the writer knew everything, why have PR reviews?
      *   *Addition:* Distinguish between "negligence" and "unforeseen interaction."
      *   *Key Phrase:* "Retrospective determinism."

  8.  **Final Polish:**
