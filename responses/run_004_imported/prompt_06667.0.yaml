answer: |-
  The hum of the single-photon avalanche diodes was the only sound in the exhibit hall. The lights were dimmed, save for the green status LEDs on the coincidence counter and the faint glow of the blue pump laser hitting the beta-barium borate crystal.

  Dr. Elena Vance tapped her pen against her clipboard. Dr. Marcus Thorne leaned against the optical table, arms crossed. Outside the glass doors, the museum director, Sarah, was pacing, waiting for the one-sentence plaque text they had promised to agree upon.

  "It says 'Demonstrates Quantum Nonlocality,'" Elena said, pointing to her draft. "It's accurate. It's honest."

  Marcus shook his head. "It's misleading. It implies a mechanical influence traversing space. This apparatus demonstrates the failure of a specific classical intuition about probability. It does not demonstrate action at a distance."

  "EPR plus Bell," Elena said, her voice tight. "Einstein, Podolsky, and Rosen showed that if you assume locality, you *must* assume predetermined values for these polarization measurements to explain the perfect correlations when our settings match. Bell showed that those predetermined values cannot reproduce the statistics when settings differ. Therefore, locality is false. The 'realism'—the predetermined values—wasn't an assumption we brought in. It was a consequence of locality."

  Marcus pushed off the table and walked to the detector on the far side. "That's the Maudlin line. I know it well. But it treats the probability distributions as if they are physical clouds hanging over the particles. They aren't. They are my degrees of belief."

  "Degrees of belief about what?" Elena countered. "If I click here, something clicks there. Correlated. Instantly. If there is no physical connection, how does the photon on the right 'know' to pass the polarizer because I rotated the one on the left?"

  "The photon doesn't know anything," Marcus said. " *I* know something. When I measure my photon, I have an experience. That experience forces me to update my expectations for what you will experience. There is no 'view from nowhere' where both outcomes exist simultaneously as objective facts waiting to be compared. There is only my perspective, and yours."

  Elena gestured to the crystal. "That is instrumentalism dressed up as philosophy. Bell's 1976 formulation didn't assume determinism. He assumed 'Local Causality.' That events in one region are independent of variables in a spacelike separated region, once you condition on the past light cone. The violation of the inequality proves that condition fails. It means the physical chance of a click here depends on the setting there. That is nonlocality. It doesn't matter if you call the wavefunction a 'catalog of expectations.' If the catalog updates faster than light based on a distant choice, the catalog is tracking something nonlocal."

  Marcus held up a finger. "Careful. The catalog updates because *I* updated it. If you are over there, and I am here, my measurement does not change your physical reality. It changes *my* assignment of probabilities to your reality. In QBism, a measurement outcome is a personal event for the agent who initiated the measurement. It is not a public fact that floats in the ether."

  "So if I measure spin-up," Elena said, stepping closer to the apparatus, "you're saying it's not a fact of the world that I measured spin-up? It's just 'true for me'?"

  "It is a fact for you," Marcus corrected. "And I, as a separate agent, can assign a probability to what you saw. But Bell's theorem assumes we can stitch our perspectives together into a single joint probability distribution over hidden variables that exists independently of us. Quantum mechanics says you can't do that. It doesn't say nature reaches across the room. It says the world is not made of 'variables' in the classical sense. It is made of experiences and responses."

  Elena sighed, rubbing her temples. "This is where the 'realism' slogan does damage. People think they can save locality by saying 'the properties weren't real until measured.' But Bell closed that door. Even if the properties are stochastic, even if they are indefinite, Local Causality requires that the probability of your outcome factorizes from my setting. $P(A|B, \alpha, \beta, \lambda) = P(A|\alpha, \lambda)$. It doesn't. The $\beta$—my setting—matters for your probability. If you deny that implies nonlocality, you have to deny that the settings and outcomes are events in spacetime."

  "I deny that they are events in a *single* spacetime container that we can view objectively," Marcus said. "Relativity tells us there is no absolute simultaneity. You want to say my setting influenced your outcome 'instantaneously.' But whose 'instant'? In QBism, there is no conflict with relativity because there is no superluminal transmission of *fact*. I update my beliefs. You update yours. When we meet and compare notes, our stories must be consistent, but the update itself is internal to the agent."

  "Consistent how?" Elena pressed. "If the world is local, there should be a local story. Bohmian mechanics gives you that story. The particle has a position. The wave is a field. The field depends on the configuration of *all* particles. It is explicitly nonlocal. It respects the predictions. It admits the cost. You want the benefit without the cost. You want to say 'no action at a distance' while admitting the correlations violate the bound that local actions must satisfy."

  "The cost you pay is a preferred foliation of spacetime," Marcus shot back. "Your Bohmian trajectories require a frame where the guidance equation is instantaneous. You save 'objective reality' by breaking Lorentz invariance at the fundamental level. I save Lorentz invariance by recognizing that the quantum state is not a physical object. It is a user's manual."

  "A user's manual for what?" Elena demanded. "If the manual works perfectly, it's because it maps the territory. If the map requires nonlocal connections, the territory has nonlocal connections. You're saying the territory is local, but the map is weird. I'm saying the map is weird because the territory is nonlocal. Occam's razor cuts your way only if you think 'agent' is a fundamental category. I think 'particle' and 'field' are fundamental. Agents are made of them."

  Marcus looked at the coincidence counter. The LEDs flickered in a random dance. "And I think 'agent' is the only place where 'fact' enters the universe. Without an agent to ask the question, the universe has no answers. Bell's theorem tells us we cannot assume the answers exist before the question. You interpret that as 'the answer is determined nonlocally.' I interpret it as 'the answer is created locally by the interaction.'"

  "Created," Elena repeated. "So energy isn't conserved? Momentum?"

  "Conservation laws are constraints on the expectations," Marcus said. "They hold. But they don't require a hidden mechanism shoving the photon. They require that my gambling strategy be coherent."

  Elena shook her head. "You're retreating into coherence. But the EPR argument is robust. If I can predict your result with certainty, without disturbing your system, there is an 'element of reality' corresponding to that result. That is the definition of reality in the argument. Locality gives me that certainty. Bell shows those elements of reality can't exist locally. So Locality goes. You can't define 'reality' away to save Locality, because Locality is what gave you the right to claim reality in the first place. It's self-defeating."

  Marcus paused. He looked at the blue laser, then at Elena. "I grant you the logic of EPR *if* you assume the quantum state describes the system. I don't. The quantum state describes *me* in relation to the system. So when you say 'without disturbing your system,' I say 'you have disturbed *my* relation to the system.' There is no 'element of reality' sitting on the photon. There is only the potential for an experience."

  "So if I blow up the lab," Elena said, gesturing broadly, "and no one is left to have an experience, does the crystal still down-convert?"

  "The theory allows me to predict what *would* happen if an agent were there," Marcus said. "Physics is about the interface. You want the thing-in-itself. I'm telling you Bell proved the thing-in-itself cannot look like a local classical field. So either it's a nonlocal field (you), or it's not a field at all (me)."

  "Or," Elena said, "it's a nonlocal field, and we stop pretending that 'locality' is sacred when the math screams otherwise."

  "And I stop pretending that 'objectivity' is sacred when the math screams otherwise," Marcus replied.

  They stood in silence for a moment. The coincidence counter beeped—a simultaneous detection.

  Sarah, the director, tapped on the glass door. She held up her watch.

  Elena turned to Marcus. "We aren't going to agree on the plaque."

  "No," Marcus said. "But I think I know why."

  "Tell me."

  "You believe a measurement outcome is a public event," Marcus said. "A fact in spacetime that constrains all future theories equally, regardless of who observes it. For you, Bell's theorem says those public facts cannot be locally connected."

  "And you," Elena said, "believe a measurement outcome is a private update. A fact for the agent, which constrains only that agent's future expectations. For you, Bell's theorem says private updates cannot be modeled as revelations of pre-existing local data."

  "Exactly," Marcus said. "The crux is the status of the outcome. Is it a 'view from nowhere' fact, or a 'view from somewhere' experience?"

  "If I could show you," Elena said, "that treating outcomes as private leads to a contradiction in multi-agent scenarios—like the recent Frauchiger-Renner results—would you concede nonlocality?"

  Marcus considered this. "If you could show that QBism cannot consistently account for *other agents* without reintroducing a global wavefunction that collapses nonlocally... yes. That would force me to accept that the outcomes must be public facts. And if they are public facts, your EPR argument wins, and nonlocality follows."

  "And if I could show you," Marcus said, "that positing a nonlocal ontology adds no predictive power over the agent-centric view, but *does* require a preferred reference frame that is empirically inaccessible... would you concede that 'nonlocality' is a metaphysical surplus?"

  Elena frowned. "If you could demonstrate that the preferred frame is not just empirically inaccessible but theoretically redundant—that a fully relativistic account of the *facts* is possible without nonlocality... then I would have to abandon the Bohmian ontology. But Maudlin proves you can't have the facts without the nonlocality."

  "Then we are stuck," Marcus said, a faint smile appearing. "You wait for my inconsistency with other agents. I wait for your empirical evidence of the preferred frame."

  "Or," Elena said, turning to the door, "we write a plaque that says: 'Demonstrates that the world is not locally classical.'"

  Marcus nodded. "Vague enough to be true. Specific enough to be interesting."

  "Sarah will hate it," Elena said, opening the door.

  "She hired physicists," Marcus replied, following her out. "She should have expected nothing less."
