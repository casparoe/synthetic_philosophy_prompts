      *   *Technical term:* "Credit Theory of Knowledge" (Greco/Pritchard). The agent deserves credit.
      *   *Why it blocks swamping:* Swamping says $V(K) = V(TB) + V(Reliability)$. If $V(Reliability)$ is purely instrumental to $TB$, and $TB$ is present, $V(Reliability) = 0$. Virtue Epistemology says $V(K) = V(TB) + V(Achievement)$. $V(Achievement)$ is distinct from $V(TB)$. Therefore, no swamping.

