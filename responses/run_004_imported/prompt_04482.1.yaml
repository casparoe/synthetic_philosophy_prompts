prompt: |-
  So I had a whole late-night argument with my flatmate Sam about the Lucas-Penrose thing and I don't think either of us actually got the details right, so I want a second opinion. Sam's take is basically that Godel already settled the AI question back in the 50s — that the incompleteness theorems were his way of proving a machine could never really "understand" math the way a person does, and that everything happening now with LLMs (Sam kept bringing up how Claude and GPT can grind through olympiad-style problems now, and that AlphaProof thing that got silver-medal-level at the IMO last year) is just more evidence for the same point: flashy surface behavior, no actual insight underneath, exactly like Godel supposedly predicted. I pushed back because I have this half-memory from a phil-of-mind seminar that Godel's actual argument in the Gibbs lecture was way more hedged than that — like one horn of it was literally "the mind might just be a finite machine after all," except a machine that could never fully prove or understand its own functioning from the inside. Neither of us could dig up the actual text at 1am on a work night so we just agreed to disagree and I said I'd ask around.

  Can you actually sort this out for me? First, I want the precise version of what Godel argued in 1951 as opposed to the popularized "Godel disproved AI" story that I think Lucas and then Penrose are the ones who really pushed — what are the two horns of the disjunction exactly, and is it fair to say Godel himself was way more agnostic about which horn was true than Lucas/Penrose later made it sound? And second, since obviously nobody in 1951 had any concept of a transformer trained by gradient descent on basically the whole internet, I want your actual best-informed guess (clearly flagged as speculation, not something he said) about which horn a modern LLM would push Godel toward, if you showed him one. Does a system like that — not hand-built as one fixed formal axiom system, seemingly flexible across totally different domains, but also very obviously not infallible — read to you as evidence for either side of his own disjunction, or would he most likely say this whole category of machine is just orthogonal to what he was actually arguing about? Don't smooth it over into a tidy narrative, I'd rather hear where it's genuinely unclear.
