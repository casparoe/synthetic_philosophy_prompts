          *   *Fragmentalism/Relativized Existence:* Existence itself is frame-relative.
          *   *Spacetime Primitivism:* Spacetime points exist, but objects don't have temporal parts in the way perdurantists claim.
          *   *The "Wholly Present" redefinition:* Redefining what it means to be wholly present in a relativistic context (e.g., located at a spacetime point vs. a timeslice).
      *   **General Relativity (GR):** SR is a special case. GR introduces curved spacetime, global hyperbolicity issues, and the problem of time in quantum gravity. This complicates the "block universe" picture.
