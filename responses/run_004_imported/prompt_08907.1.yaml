      *   **Multiverse vs. Design:** OSE *does* help the Multiverse hypothesis (if there are enough universes, one *must* be life-permitting). But it doesn't necessarily help Single-Universe Naturalism against Design.
      *   **Disciplinary Inertia?** No. The debate has shifted to technical Bayesian formulation, measure problems in cosmology, and the nature of physical laws. It's not just inertia.

