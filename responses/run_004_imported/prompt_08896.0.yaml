      *   *Check:* Is the Death prediction mechanism clear? In Gibbard/Harper, Death is in the book. If you go to Aleppo, he's in the book. If you stay, he's in the book.
      *   *Check:* Is the "Coin" objection handled? If Death predicts the coin, the probability of death remains 1 regardless of the mix. Alex needs to clarify that Ratificationism isn't about *survival* rates (which are fixed by the setup) but about *deliberative stability*. Wait, actually, in the standard setup, if Death is a perfect predictor, survival is 0 either way. The utility difference is usually about the *cost* of traveling or just the logic of choice. Let's stick to the standard utility: Survival = 100, Death = 0, Travel cost = negligible. If Death is perfect, P(Death) = 1. So EU is 0 either way. The issue is *conditional* EU.
