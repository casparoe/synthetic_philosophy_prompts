          *   *Follow-up:* Guest might say "That's an open research question." Push on whether the *burden of proof* is on the penalty proponents if indistinguishability is plausible.

      *   *Goal 3: Ontology Mismatch.*
          *   *Draft:* What if the AI thinks differently than us?
          *   *Refinement:* If the AI's latent space doesn't have concepts like "diamond" or "vault," does "direct translation" even exist?
          *   *Follow-up:* Guest might say "We assume a mapping exists." Push on whether assuming a clean mapping is the same circularity Priya mentioned.

      *   *Goal 4: Generalizing the Compute Penalty.*
          *   Need questions about the mechanism itself. How do you measure "downstream computation"? Is it parameter count? FLOPs? Activation sparsity?
          *   Need questions about the "Human Simulator" definition. Is it a single mode or a continuum?
          *   Need questions about the "Direct Translator" definition. Is it unique?
          *   Need questions about the failure modes. What does failure look like?

      *   *Goal 5: Addressing Priya's specific "Circularity" claim.*
          *   Priya says you need to know the answer to penalize the wrong answer. How does the guest rebut this without ground truth?

  4.  **Developing the Questions & Follow-ups (incorporating the "Research Direction" deflection):**

      *   *Q1 (SmartVault):* Focus on the specific mechanism in the canonical case.
      *   *Q2 (Indistinguishability):* Focus on optimization pressure.
      *   *Q3 (Ontology):* Focus on the definition of "direct."
