              1.  The SmartVault diamond-and-screen scenario.
              2.  Computational indistinguishability (can a simulator be as efficient as a translator?).
              3.  Ontology mismatch (does "direct translation" make sense if the AI's world-model differs radically?).
          *   Format: Question + Follow-up (keyed to the guest's likely deflection: "that's a research direction, not a finished technique").
          *   Tone: Sharp, technical, engaged, not adversarial but pressing on the weak points Priya raised.

  2.  **Deconstruct the Core Debate (ELK & Compute Penalties):**
      *   *The Problem:* AI knows the truth (latent knowledge) but might report what a human *would believe* (human simulator) rather than what is *true* (direct translator).
      *   *The Proposed Solution:* Penalize the reporter for doing extra computation. The idea is that simulating a human requires running the AI's world model + a human model + mapping between them, whereas direct translation is just world model -> report. Therefore, simulator should be more compute-heavy.
      *   *Priya's Objection (The Skeptic):* This is circular. To know if it's simulating, you need to know the mapping. Also, a good enough simulator might be optimized to be just as efficient.
      *   *The Guest's Stance:* The penalty *works* (or has real potential) to break the tie.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal 1: SmartVault Scenario.*
          *   *Draft:* How does the compute penalty work in the SmartVault case?
          *   *Refinement:* Make it specific. The diamond is stolen, the screen says it's there. The simulator lies to match human belief. The translator tells the truth.
          *   *Follow-up:* Guest might say "We are still testing this." Push on whether the penalty *conceptually* distinguishes them in that specific topology.

      *   *Goal 2: Computational Indistinguishability.*
