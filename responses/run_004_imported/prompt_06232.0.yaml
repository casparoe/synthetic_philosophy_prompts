  Here is a scenario designed to put pressure on Anscombe's specific reliance on the intention/foresight distinction, while maintaining the structural stakes of the Hiroshima decision.

  ### The Scenario: The "Integrated Workshop" City

  **The Context**
  Imagine a nation engaged in a total war, similar to WWII Japan. However, in this scenario, the enemy's war economy is not concentrated in large factories (which could be distinguished from residential zones). Instead, the production of essential munitions is fully decentralized. Every residential block in the capital city contains high-precision lathes and assembly equipment integrated directly into the living quarters. The "factory" is the home; the "worker" is the head of the household.

  There is no way to destroy the munitions capacity without destroying the residential blocks. Furthermore, due to the nature of the weaponry available (e.g., incendiaries in a wooden city), destroying the blocks guarantees the death of the inhabitants. There is no evacuation possible; the war is too fast, and the blockade is total.

  **The Action**
  The Allied Commander orders the firebombing of the capital city. The strategic goal is to halt munitions production, which is the only remaining bottleneck preventing the enemy from continuing the war. The Commander calculates that destroying 60% of the residential/industrial blocks will reduce production below sustainable levels, forcing a surrender.

  **The Agent's Intention (Honest & Narrow)**
  When questioned, the Commander gives an honest, narrow description of his intention:
  > "I intend to destroy the *machines*. I intend to render the *buildings* unusable for production. I do not intend the deaths of the civilians. If there were a way to melt the lathes while leaving the families alive in the rubble, I would choose that option in a heartbeat. Their deaths are a foreseen, inevitable, but unintended side effect of the physics of fire."

  Crucially, the Commander is **not** engaging in "terror bombing." He does not believe the deaths will break the enemy's morale. He believes the *loss of hardware* will stop the war. The deaths are not the *means* to victory; the destruction of the equipment is the means. The deaths are merely a causal concomitant.

  **Why This Troubles Anscombe's Position**

  This scenario creates a dilemma for Anscombe's specific critique of Truman, which hinges on the claim that Truman intended the deaths *as a means* (to terrorize), whereas legitimate bombing only *foresees* deaths.

  1.  **The DDE "Pass":** Under Anscombe's application of the Doctrine of Double Effect (DDE), this Commander seems to be in the clear.
      *   **The Act:** Bombing military targets (munitions).
      *   **The Intention:** Destruction of capacity (not death).
      *   **The Means:** Death is not the means to the end (hardware destruction is).
      *   **The Proportionality:** Ending a total war (a supreme good) vs. civilian deaths (a terrible evil).
      *   *Result:* Anscombe's framework suggests this is permissible, or at least distinguishable from murder.

  2.  **The Moral Intuition:** Despite fitting the DDE criteria, this case feels morally identical to the Hiroshima decision. The Commander knows with near-certainty that 100,000 civilians will burn to death. He chooses a method that guarantees this outcome because it is the most efficient way to destroy the machines. To say he "does not intend" their death feels like a legalistic loophole rather than a moral reality.

  3.  **The Trap for Anscombe:**
      *   **Option A:** Anscombe condemns the Commander. If she does, she must admit that *certainty of death* overrides *intention*. If the foreseen side effect is 100,000 innocent deaths, the "intention" to hit machines becomes morally irrelevant. But if she admits this, her specific critique of Truman collapses. She can no longer argue Truman was guilty *because* he intended death; she would have to argue he was guilty because he killed civilians *period*, regardless of whether he intended it or foresaw it. This undermines the intention/foresight line she draws.
      *   **Option B:** Anscombe acquits the Commander. If she says this is permissible (because the intention is "clean"), she creates a massive loophole. Any terror bomber can simply redescribe their intention: "I don't intend to kill them to scare the government; I intend to destroy their bodies because they are obstructing the blast wave." If the "Integrated Workshop" Commander is innocent because he targets "machines," the Hiroshima Commander can claim innocence because he targeted "industrial capacity." The distinction vanishes into redescription.

  **The Core Philosophical Problem**
  This scenario highlights that the moral horror of Hiroshima lies not primarily in the *mental state* of the agent (whether they "willed" the death or merely "accepted" it), but in the *choice of action* itself (choosing a method that indiscriminately consumes civilians).

  Anscombe wants to locate the sin in the **will** (intending evil). This scenario suggests the sin is in the **act** (performing an act that guarantees mass innocent death). By constructing a case where the will is "clean" (targeting machines) but the act is identical to Hiroshima (burning a city), you show that Anscombe's specific boundary line (intention vs. foresight) fails to track the actual moral difference we perceive. If the outcome and the certainty are the same, the internal mental label of "means" vs. "side effect" does not do the moral heavy lifting she claims it does.
