      *   *The Speckled Axe:* A man wants the smith to grind the whole axe bright. The smith agrees if the man turns the wheel. It's hard work. The man gives up, preferring the "speckled axe" (imperfection) over the labor of perfection. Franklin's point: Perfection is exhausting/impossible; it's okay to be a bit speckled.
      *   *Application to Gary:* He tried the chart. He failed (admittedly). He ran a hardware store for 41 years (requires industry, justice, sincerity, but definitely not silence or perfect order). He is the Speckled Axe.

