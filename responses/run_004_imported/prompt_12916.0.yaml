      *   **The Speckled Axe (The Core):** Explain the story briefly but accurately (for the book club) but accessibly (for the family). Connect it to Gary.
      *   **The Conclusion:** Gary isn't perfect, and that's why he's loved. A wish for retirement (more speckles, less grinding).

