          *   Wait, let me check the payoff formula in the prompt vs. the standard Pasadena Game.
          *   Prompt says: $(-1)^{n+1} * 2^n / n$.
          *   Probability of stopping at $n$: $P(n) = (1/2)^n$.
          *   Expected Value contribution at $n$: $P(n) \times X_n = (1/2)^n \times (-1)^{n+1} \frac{2^n}{n} = (-1)^{n+1} \frac{1}{n}$.
          *   Okay, so the *expected value series* is $\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}$. This is the alternating harmonic series.
      *   **The Debate:**
          *   (1) He: Sums in order $n=1, 2, 3...$ gets $\ln 2$. Value = 69 cents.
