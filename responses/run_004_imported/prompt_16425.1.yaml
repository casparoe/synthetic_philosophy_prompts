answer: |-
  This is a sharp question that cuts to the heart of why the LessWrong/Overcoming Bias community moved from Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) toward Updateless Decision Theory (UDT) and Timeless Decision Theory (TDT).

  The short answer is: **No, this does not show that Bayesian conditionalization is the "wrong norm" for beliefs, but it does demonstrate that "Update-then-Act" is the wrong norm for *decisions* in cases involving imperfect recall or logical correlation.**

  Here is the detailed breakdown of why the Absent-Minded Driver (AMD) breaks standard Bayesian decision theory, why it doesn't condemn Bayesianism entirely, and what the actual lesson is for rational agency.

  ### 1. The Conflict: Planning vs. Action
  You correctly summarize the tension.
  *   **Planning-Optimal (Ex Ante):** At the start, you choose a policy $p$ (probability of continuing) to maximize expected utility. With standard payoffs (0 for Exit 1, 4 for Exit 2, 1 for Continue), this yields $p = 2/3$.
  *   **Action-Optimal (Ex Post):** When you arrive at an intersection, you update your belief. You reason: "I am at an intersection. What is the probability this is the first one?"
      *   If you assume you will continue with probability $p$, the probability you are at the first intersection is $\frac{1}{1+p}$.
      *   If you then maximize expected utility *given this updated belief*, treating your current choice as independent of your choice at the other intersection, you derive a different optimal $p$ (often $p=1$, i.e., always continue).
      *   This leads to a payoff of 1, which is strictly worse than the 1.33 achieved by the planning-optimal strategy.

  Piccione and Rubinstein (1997) used this to highlight **dynamic inconsistency**. The agent at the intersection has different incentives than the agent at the start because the updated probabilities weight the outcomes differently.

  ### 2. Why Bayesian Updating Isn't "Wrong," But "Update-then-Act" Is
  Your question asks if this proves Bayesian conditionalization is the wrong norm *whenever* new information arises. The consensus in the decision-theory literature (especially the LW/OB lineage) is more nuanced.

  **Bayesian Conditionalization is about Beliefs, not Control.**
  Mathematically, conditionalization is the correct way to update probabilities given new evidence. If you ask the driver, "What is your credence that this is the first intersection?", the updated probability (the "thirder" position, analogous to Sleeping Beauty) is arguably the correct *belief*.

  The failure is not in the probability calculation; it is in the **decision rule** that says: *"Once you have updated your beliefs, maximize expected utility relative to those new beliefs."*

  In standard sequential decision problems with **perfect recall**, this rule works fine. Your decision now does not logically force your decision at other nodes; you can plan to do $X$ now and $Y$ later.

  In AMD (and Newcomb's Problem, Parfit's Hitchhiker, etc.), your decision now is **logically correlated** with your decision at other nodes. Because you are absent-minded, you *must* use the same algorithm at both intersections.
  *   If you update and optimize locally, you ignore the fact that changing your probability of continuing *here* implies changing it *there*.
  *   You treat your current action as a "local intervention" when it is actually a "global policy selection."

  ### 3. The Updateless Solution
  This is precisely why Wei Dai proposed **Updateless Decision Theory (UDT)**.

  UDT argues that you should not update on your observations before making a decision. Instead, you should:
  1.  Start with your prior distribution over all possible worlds (including where you are in the highway).
  2.  Choose a **policy** (a function mapping observations to actions) that maximizes expected utility relative to that **prior**.
  3.  Execute the action prescribed by that policy for your current observation.

  In AMD, the UDT agent says: "I knew I would see an intersection. Seeing an intersection gives me no information that distinguishes which policy is best, because I see an intersection in all relevant branches. Therefore, I will ignore this 'new' information for the sake of the decision and stick to the policy ($p=2/3$) that maximizes utility from the ex-ante perspective."

  Note that the agent can still *believe* they are likely at the second intersection (if asked for a credence), but they *act* as if they haven't updated. This decouples **epistemology** (updating beliefs) from **decision theory** (optimizing policies).

  ### 4. Is This Confined to "Odd" Puzzles?
  You ask if this implies Bayesian updating is the wrong norm "whenever new information might arise."

  It is not "whenever," but it is **whenever the new information is self-locating and your decision is logically linked to other instances of yourself.**

  This is more common than it seems:
  *   **Precommitment:** Any time you wish you could precommit (e.g., Ulysses and the Sirens), you are acknowledging that your future updated self will make a worse decision than your current self.
  *   **Auctions/Trading:** If you know your bidding algorithm is identical to your competitor's (logical correlation), updating on your private signal and bidding locally can lead to the "Winner's Curse."
  *   **AI Coordination:** If you deploy multiple copies of an AI, they should not update on their specific serial number to defect against each other; they should act based on the policy that benefits the group of copies.

  However, in standard single-agent problems with perfect memory (e.g., "Should I take the umbrella given it looks cloudy?"), standard Bayesian updating + maximization works perfectly. The AMD problem exploits **imperfect recall** to break the link between the planning self and the acting self.

  ### 5. Conclusion
  The Absent-Minded Driver does not prove that Bayesian conditionalization is mathematically incoherent. It proves that **naive Bayesian Decision Theory** (Update + Maximize Expected Utility) is dynamically inconsistent in the presence of imperfect recall or logical correlations between decision nodes.

  The lesson adopted by the LessWrong community is not "don't update beliefs," but rather:
  **"Optimize policies ex-ante, not actions ex-post."**

  If you define rationality as "winning" (achieving the highest payoff), then the rational agent is the one who refuses to let new indexical information override their ex-ante optimal plan. In that specific sense, you are correct: following the norm of "always update and then optimize" is a losing strategy in this class of problems. But the fix is to change the decision theory (to UDT/TDT), not necessarily to abandon Bayesian probability for modeling the world.
