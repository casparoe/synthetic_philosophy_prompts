answer: |-
  **The Price of Prudence: Defending Risk-Weighted Rationality Against the Money Pump**

  Last month, you faced a choice that lies at the heart of decision theory: a guaranteed settlement or a risky arbitration with a higher expected monetary value. You chose the guarantee. Your friend, invoking standard economic orthodoxy, labeled this irrational risk-aversion, arguing that without diminishing marginal utility of money, your preference violates the norms of rational choice. She is relying on Expected Utility Theory (EUT), which demands that rational agents maximize the mathematical expectation of utility. However, as you have discovered, Lara Buchak's Risk-Weighted Expected Utility (REU) theory offers a formal framework where your choice is not a bug, but a feature—a legitimate expression of a risk-averse attitude independent of how much you value the dollars themselves.

  The sticking point, as you noted, is the dynamic choice objection. Critics argue that REU violates the Independence Axiom, rendering an agent dynamically inconsistent and vulnerable to a "money pump"—a sequence of trades that leaves the agent poorer with no change in their final outcome. If a theory licenses choices that allow you to be turned into a "sure loser," can it truly claim to describe rationality? This essay argues that it can. The vulnerability to money pumps arises only if we accept a flawed conception of diachronic agency known as "sophisticated choice." By adopting a policy of "resolute choice," an REU agent blocks the pump without incurring unreasonable costs. Therefore, your decision was genuinely rational. Risk-aversion is a primitive rational attitude, and the formalism Buchak provides is not dressing up a mistake, but correcting an overly narrow definition of rationality.

  To understand the stakes, we must first distinguish between the two theories. In standard EUT, risk attitudes are derived entirely from the curvature of the utility function. If you are risk-averse, it must be because the second million dollars is worth less to you than the first. If the sums are small enough that your utility for money is effectively linear, EUT dictates you must be risk-neutral. To prefer a sure $50 over a 50% chance of $100 is, in this framework, a mathematical error. Buchak's REU theory challenges this by introducing a risk function, $r(p)$, which weights probabilities non-linearly based on the agent's attitude toward risk. An REU maximizer cares not just about the value of outcomes and their likelihoods, but about the *structure* of the risk itself. This allows your settlement decision to be rational even if every dollar holds the same utility to you. You are not miscalculating the value; you are placing a premium on certainty.

  The primary objection to this view is dynamic. The Independence Axiom, which REU rejects, is the mathematical guarantor of dynamic consistency. In a decision tree, Independence ensures that if you prefer Plan A to Plan B at the start, you will still prefer the remaining branch of A to B if you arrive at a later node where the choice presents itself. Without Independence, your preferences can shift merely because some impossible branches of the tree are pruned away. This opens the door to the money pump. A cunning trader could offer you a trade based on your initial preference, then offer to reverse it at a later stage based on your new preference, charging a small fee each time. You end up back where you started, but poorer. Critics argue that any theory licensing this is normatively bankrupt; rationality, they claim, requires immunity to such exploitation.

  However, this objection rests on a specific model of how agents navigate time: the "sophisticated" chooser. A sophisticated chooser anticipates their future preferences and acts only if their future self will comply. If an REU agent knows their future self will violate the initial plan (due to the shifting preferences caused by violating Independence), the sophisticated agent effectively treats their future self as a stranger. This leads to paralysis or suboptimal choices, as the agent refuses to embark on plans they know they won't stick to. The money pump works because it assumes the agent is sophisticated but lacks the ability to bind their future self.

  The defense of REU lies in rejecting sophistication in favor of "resolute choice," a concept championed by Edward McClennen and integrated into Buchak's framework. A resolute chooser does not treat their future self as a stranger. Instead, they view their agency as extended over time. When a resolute agent makes a plan based on their risk-weighted preferences, they commit to executing that plan even if, at a later node, the local preferences seem to have shifted. They do not re-optimize at every branch; they adhere to the strategy that was optimal from the root of the decision tree.

  Critics dismiss resolute choice as irrational "willpower" or an ad hoc patch to save a failing theory. They argue that if your preferences have genuinely changed, ignoring them is akratic. But this misunderstands the nature of the preference change in REU. In REU, the shift in preference at the later node is not due to new information or a change in values, but merely a change in the *description* of the gamble (the context of the decision tree). It is rational to ignore preference shifts that are artifacts of framing rather than substantive changes in the world. By adopting resolute choice, the REU agent recognizes that their risk attitude is a stable trait of their agency, not a fleeting whim to be updated at every node.

  Furthermore, the "cost" of resolute choice is negligible compared to the cost of the alternative. The critic claims resolute choice is costly because it requires effort or restricts freedom. But the alternative—sophisticated choice—renders the REU agent unable to pursue any long-term plan involving risk. If you cannot commit to your initial risk assessment, you cannot rationally accept the settlement in the first place, knowing you might later regret not gambling. Resolute choice is not a psychological burden; it is the constitutive norm of planning agency. To be an agent is to be able to bind one's future actions to serve one's global interests. If the price of maintaining a coherent risk attitude across time is the refusal to re-evaluate context-dependent preferences, that is a price rational agents should be willing to pay.

  Moreover, the money pump argument is largely a theoretical *reductio* that rarely manifests in the real world, particularly in cases like yours. Money pumps require a sequence of suitably related choices offered by an exploiter who knows your decision rule. Your legal settlement was a one-off decision. The theoretical vulnerability does not negate the normative validity of the preference in isolated cases. But even in theory, the resolute chooser is not "exploitable" because they simply will not make the second trade that completes the pump. They recognize the sequence as a whole and reject the loop. The vulnerability exists only for the agent who lacks resoluteness. To say REU is irrational because it *can* lead to a money pump is like saying a diet is irrational because one *can* break it. The normativity lies in the commitment.

  Therefore, the verdict must be in favor of Buchak and against your friend's orthodox critique. The dynamic choice objection fails because it presupposes that rationality requires local consistency at every decision node, regardless of the global plan. This is an impoverished view of agency. Rationality involves managing uncertainty over time, and that requires the capacity to commit to a risk policy even when local incentives shift. By embracing resolute choice, REU agents protect themselves from exploitation not by changing their math, but by strengthening their conception of agency.

  Your decision to settle was not a failure of calculation, but an expression of a rational attitude toward risk that standard economics is too rigid to accommodate. You valued the security of the settlement over the mathematical expectation of the arbitration. Buchak's theory provides the formal language to validate that intuition without requiring you to pretend you value money less as you get more. The vulnerability to money pumps is not a fatal flaw in the theory, but a challenge to the agent to be resolute. Since resoluteness is a viable and defensible mode of agency, risk-aversion remains a rational stance in its own right. You did not make a mistake; you simply refused to gamble with your peace of mind, and no amount of expected-value arithmetic can prove that prudence is irrational.
