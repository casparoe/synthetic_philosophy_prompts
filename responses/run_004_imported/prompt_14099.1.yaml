answer: |-
  You have correctly identified one of the most active and nuanced debates in contemporary meta-ethics and the philosophy of responsibility. The confusion you feel is intentional; the distinction relies on separating the **semantics** of moral claims from the **pragmatics** of moral address.

  To answer your core question: The mechanism doing the work is the distinction between the **truth conditions** of a proposition and the **felicity conditions** of a speech act.

  Here is the logical structure of the puzzle, broken down by the competing mechanisms on offer.

  ### 1. The Category Error: Proposition vs. Performance

  Your intuition that hypocrisy is "orthogonal to the object-level facts" is correct regarding the *proposition*.
  *   **Proposition:** "Act $A$ is morally wrong."
  *   **Truth Condition:** Depends on moral facts (consequences, duties, virtues, etc.).
  *   **Hypocrisy's Effect:** None. A hypocrite can state a true moral fact.

  However, philosophers arguing for "standing" (like G.A. Cohen, R. Jay Wallace, Macalester Bell, and Kyle Fritz/Miller) argue that blame is not merely stating a proposition. It is a **speech act** (specifically, a form of moral address or sanction).
  *   **Performance:** "I blame you for Act $A$."
  *   **Felicity Condition:** Depends on the relationship between the speaker and the listener, and the speaker's relationship to the norm.
  *   **Hypocrisy's Effect:** It renders the speech act **infelicitous** (unauthorized), even if the content is true.

  **The Analogy:** Consider a courtroom.
  *   *Proposition:* "The defendant is guilty." (True/False based on evidence).
  *   *Performance:* "I sentence you to five years."
  *   *Standing:* Only a judge has the standing to sentence. If a random bystander yells "I sentence you!", the proposition ("you are guilty") might be true, but the *act* of sentencing is null. It has no normative force.

  The "Standing" argument claims that moral blame functions similarly. It is a demand for accountability that requires specific authority to issue.

  ### 2. Mechanism A: The Implicit Commitment Account (Wallace/Bell)

  This is the most common analytic defense of standing. It focuses on what is **implicitly asserted** when one blames.

  *   **The Logic:** To blame someone is to implicitly claim that you take the relevant moral norm seriously and govern your own conduct by it. It is an invitation to a moral community where rules apply to everyone.
  *   **The Violation:** When a hypocrite blames, they are making an implicit claim ("I adhere to this norm") that is contradicted by their explicit behavior ("I violate this norm").
  *   **The Normative Fact:** It is not that the blame is *false*; it is that the blamer is **lying about their own moral position**.
  *   **Why it's not just rhetoric:** It's not that people won't listen; it's that the hypocrite is attempting to claim a moral authority they do not possess. It is a form of fraud. The blamee is owed an apology or silence, not a lecture, because the lecture presupposes a moral equality that the hypocrite has forfeited.

  ### 3. Mechanism B: The Moral Equality Account (Fritz & Miller)

  Kyle Fritz and Daniel Miller have written extensively on this (e.g., *"Hypocrisy and the Standing to Blame"*). They push back against the idea that *all* hypocrisy removes standing, but they agree standing is normative.

  *   **The Logic:** Blame is a transaction between moral equals. It presumes that both parties are members of the same moral community, subject to the same norms.
  *   **The Violation:** Hypocrisy functions as a claim of **exemption**. By blaming you for $X$ while doing $X$, I am effectively saying, "This norm applies to you, but I am special/exempt."
  *   **The Normative Fact:** This violates the blamee's right to be treated as a moral equal. It turns blame from a demand for accountability into an exercise of power or domination.
  *   **Why it doesn't contaminate the warrant:** The warrant for "Act $A$ is wrong" comes from the moral status of Act $A$. The warrant for "I can blame you" comes from the **relational status** between us. Hypocrisy breaks the relational warrant, not the moral warrant.
  *   **The Nuance:** Fritz and Miller argue that not all hypocrisy removes standing. Only hypocrisy that implies a *refusal to accept the norm's authority* over oneself removes standing. If I try to quit smoking and fail, but blame you for smoking, I haven't necessarily exempted myself from the norm (I still think I *should* quit). If I say "Smoking is bad for you, but I don't care about my health," I lack standing.

  ### 4. Mechanism C: The Complicity/Dirty Hands Account (G.A. Cohen)

  Cohen's essay (*"Casting the First Stone: Who Can, and Who Can't, Condemn the Terrorists?"*) is slightly different. It is less about logical hypocrisy and more about **causal/moral entanglement**.

  *   **The Logic:** Standing to condemn requires "clean hands." If you are causally or politically complicit in the conditions that led to the wrongful act, your condemnation is disqualified.
  *   **The Violation:** It is not necessarily that you did the *same* thing (hypocrisy), but that you **benefit from** or **sustain the system** that produced the thing.
  *   **The Normative Fact:** Condemnation in this context functions as a way of distancing oneself from the act. If you are complicit, you cannot distance yourself. To condemn while being complicit is to attempt to wash your hands of responsibility while keeping the benefits of the system.
  *   **Why it's normative:** It is unfair to the accused. It allows the accuser to shift the moral spotlight entirely onto the accused, obscuring their own role. It distorts the moral accounting of the situation.

  ### 5. Resolving Your "Orthogonality" Worry

  You asked: *"Why would violating it not also contaminate the warrant of the underlying moral claim?"*

  The answer lies in distinguishing **first-order morality** from **second-order authority**.

  1.  **First-Order Warrant:** "Is torture wrong?" This depends on the nature of torture. (Hypocrisy is orthogonal here).
  2.  **Second-Order Warrant:** "Do *you* have the right to demand I answer for torture?" This depends on your relationship to the norm and to me.

  Think of it like a contract.
  *   If I break a contract, I am in breach (First-Order Wrong).
  *   If *you* also broke a contract with someone else, you are also in breach (Hypocrisy).
  *   However, if you try to sue me for my breach, the court might dismiss your case not because I didn't breach, but because you come to court with "unclean hands."

  The "Standing" constraint is a **procedural norm**, not a **substantive norm**. It governs *how* moral accountability is distributed, not *what* is morally valuable.

  ### 6. The Deflationary Worry (Is it just rhetoric?)

  You worried this collapses into "people just won't listen." The philosophers argue it is deeper than that.

  *   **Rhetorical:** "If you say this, people will ignore you." (Pragmatic consequence).
  *   **Normative:** "If you say this, you have wronged the person you are blaming." (Moral consequence).

  The Fritz/Miller and Bell argument is that the hypocritical blamer **violates the rights of the blamee**. The blamee has a right not to be morally sanctioned by someone who does not acknowledge the same sanctions apply to them. It is a violation of **reciprocity**.

  Therefore, the hypocrite doesn't just fail to persuade; they commit a *new* moral wrong in the act of blaming. They owe the blamee silence (or an apology), regardless of whether the original accusation was true.

  ### Summary of the Logical Structure

  1.  **Premise 1:** Blame is not just describing a moral fact; it is a performative speech act demanding accountability.
  2.  **Premise 2:** Performative speech acts require felicity conditions (authority/standing) to be valid, separate from the truth of their content.
  3.  **Premise 3:** One condition of standing is the presumption of equal subjection to the norm (no exemption) and/or non-complicity.
  4.  **Observation:** Hypocrisy/Complicity violates this condition.
  5.  **Conclusion:** The hypocrite lacks the standing to blame.
  6.  **Constraint:** This invalidates the *act of blaming*, not the *truth of the moral claim*.

  The "puzzle" dissolves once you accept that **moral authority** is a distinct variable from **moral truth**. The literature argues that without this distinction, we cannot explain why it feels intuitively unfair to be lectured by a hypocrite, even when they are right. It feels unfair because, normatively, it *is* unfair.
