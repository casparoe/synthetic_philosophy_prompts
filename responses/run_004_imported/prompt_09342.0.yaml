answer: |-
  Your suspicion is well-founded, and your reading of the primary texts has led you to a conclusion that many contemporary philosophers of science have reached only after decades of debate: the "Duhem-Quine thesis" is often a philosophical conflation that obscures more than it reveals. While both men argue for a form of holism regarding empirical testing, their motivations, scopes, and metaphysical commitments differ profoundly.

  To answer your specific questions, we need to disentangle Duhem's methodological caution from Quine's epistemological radicalism.

  ### 1. Duhem's Scope: A Local Holism of Physics

  You noted that Duhem seems more cautious. You are correct. Duhem's holism is not a universal claim about human knowledge; it is a specific claim about the structure of **mathematical physics**.

  In *The Aim and Structure of Physical Theory* (1906), Duhem argues that a physical theory is not a collection of isolated hypotheses but an interconnected mathematical system. When an experiment contradicts a prediction, logic dictates only that *something* in the conjunction of assumptions is false. However, the experiment cannot tell you *which* part.
  $$ \text{Theory} + \text{Auxiliary Assumptions} + \text{Instrumental Conditions} \rightarrow \text{Prediction} $$
  If the Prediction fails, logic gives you $\neg (\text{Theory} \land \text{Aux} \land \text{Inst})$, not $\neg \text{Theory}$.

  **The Limits of Duhem's Claim:**
  *   **Discipline Specific:** Duhem explicitly excludes sciences that are not sufficiently mathematized. He writes that chemistry, biology, and physiology (at the time) do not face this problem to the same degree because they rely more on classification and causal mechanisms that can be isolated. His thesis applies to theoretical physics where deduction from a symbolic representation is the primary method.
  *   **Instrumentalism:** Duhem was an anti-realist regarding physical theory. He believed theories were not explanations of underlying reality but economical systems for classifying experimental laws. Therefore, his holism is about saving the *phenomena*, not about determining the ontological truth of the entities involved.
  *   **No Revisability of Logic:** Duhem never suggests that the laws of logic are up for grabs. The logical contradiction is real; the problem is simply that the "unit of empirical significance" is the whole theory, not the single hypothesis.

  **Exemptions:** Duhem does not think *all* empirical sciences are exempt, but he implies that where mathematical deduction is loose or absent, the "crucial experiment" might be more feasible. His holism is a constraint on *mathematical* modeling of nature.

  ### 2. Quine's Scope: Global Holism and the Revisability of Logic

  Quine's "Two Dogmas of Empiricism" (1951) takes Duhem's insight and universalizes it into a general theory of knowledge.

  **The Web of Belief:**
  Quine argues that our statements about the external world face the tribunal of sense experience not individually but as a "corporate body." This is the move from Duhem's "physical theory" to Quine's "total science." For Quine, there is no sharp boundary between synthetic statements (empirical facts) and analytic statements (truths of meaning/logic).

  **The Radical Claim:**
  *   **Universal Scope:** Quine's holism covers everything from statements about bricks and electrons to the laws of logic and mathematics.
  *   **Revisability of Logic:** This is the crucial divergence. Quine famously suggests that even the law of excluded middle could be revised to simplify quantum mechanics. For Duhem, logic is the tool used to identify the contradiction; for Quine, logic is just another strand in the web, closer to the center but not immune.
  *   **No Permanent Immunity:** Quine argues that *any* statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system. Conversely, *no* statement is immune to revision.

  **Why Quine Goes Further:**
  Quine is attacking the reductionist project of the logical positivists (who wanted to verify individual statements). Duhem was attacking the idea of the "crucial experiment" in physics. Quine uses Duhem's logic to dismantle the analytic/synthetic distinction itself.

  ### 3. *Bon Sens* vs. Pragmatic Virtues

  This is where the difference in "philosophical job" becomes most clear. Both men admit that logic alone cannot tell us which hypothesis to reject when a prediction fails. But they propose different mechanisms for how scientists actually decide.

  **Duhem's *Bon Sens* (Good Sense):**
  Duhem is somewhat pessimistic about formalizing this decision. He appeals to *bon sens*, which is a kind of cultivated scientific intuition. It is not arbitrary, but it is not rule-governed in a strict logical sense. It relies on:
  *   Coherence with established theories.
  *   The "fruitfulness" of the modification.
  *   A sense of proportion (not abandoning a well-confirmed law for a single anomaly).
  *   **Nature:** It is psychological and sociological. Duhem admits he cannot give a logical algorithm for theory choice. It is a virtue of the *scientist*, not the *theory*.

  **Quine's Pragmatic Virtues:**
  Quine is more naturalistic. He suggests we guide theory revision using explicit pragmatic maxims:
  *   **Conservatism:** Minimize the disturbance to the rest of the web.
  *   **Simplicity:** Prefer the theory that is mathematically or conceptually simpler.
  *   **Generality:** Prefer theories that explain more phenomena.
  *   **Nature:** For Quine, these are not just psychological quirks but the actual criteria of truth within a naturalized epistemology. We revise logic or physics based on which change yields the simplest overall account of experience.

  **The Difference:**
  Duhem's *bon sens* is a admission of the *limits* of logic; it is a placeholder for the inexplicable art of science. Quine's pragmatism is a *replacement* for logic's foundational role; it is the new engine of justification. Duhem says, "Logic stops here, and the physicist must judge." Quine says, "Logic is just a tool, and we choose the tools that work best."

  ### 4. The Verdict on Underdetermination and the "Smuggling" Charge

  You ask whether the composite name smuggles a modest observation into a sweeping doctrine, and which thesis gives genuine reason to think theory is underdetermined by evidence.

  **The Smuggling:**
  Yes, the conflation typically smuggles Quine's radicalism into Duhem's modesty.
  *   **Duhem** is often read as saying, "Theory is radically underdetermined by evidence," implying that we could keep *any* theory alive indefinitely. But Duhem actually believed *bon sens* would usually converge on a single solution over time. He did not think physics was arbitrary.
  *   **Quine** is often read as merely saying, "Testing is holistic." But Quine is actually saying, "Truth is immanent to the system," which is a much stronger metaphysical claim.

  By running them together, textbooks often attribute Quine's "revisability of logic" to Duhem (who never claimed it) and attribute Duhem's "instrumentalism" to Quine (who was a scientific realist).

  **Underdetermination:**
  *   **Duhem's Underdetermination:** This is **methodological**. It is a reminder that logic alone cannot isolate the culprit in a failed prediction. It does not necessarily imply that two rival theories will always fit the data equally well forever. It just means the *blame* is distributed. Your experience as a physicist matches this: you knew the theory wasn't necessarily wrong, but you also knew you couldn't prove the instrument was at fault using logic alone.
  *   **Quine's Underdetermination:** This is **epistemological/ontological**. Quine argues that for any body of evidence, there are multiple, logically incompatible theories that can account for it, and there is no "fact of the matter" to decide between them beyond pragmatic utility.

  **Conclusion:**
  Duhem gives us a genuine reason to think that **blame** is underdetermined by evidence (the "logic of testing" problem). He does not necessarily argue that **theory choice** is permanently underdetermined, because he trusts *bon sens* to eventually guide physicists to the most stable system.

  Quine gives us a reason to think **theory choice** is fundamentally underdetermined because he removes the anchor of "analytic truth." If logic itself is adjustable, the constraints on theory construction are looser.

  **Summary for your argument:**
  You can marshal your argument by stating that Duhem describes a **local constraint on falsification** within mathematical physics, resolved by professional judgment (*bon sens*). Quine describes a **global condition of knowledge**, resolved by pragmatic optimization. The "Duhem-Quine thesis" conflates a specific problem of experimental physics with a general theory of truth.

  Your intuition is correct: Duhem validates your career experience (that we patch theories rather than abandon them), while Quine challenges the very logical framework you used to understand that experience. They are not partners in a single thesis; they are neighbors who happen to look at the same wall from different sides.
