answer: |-
  Here are ten interview questions drafted for your mock podcast script. The first three address your required topics (including the specific follow-ups), and the remaining seven address additional technical pressure points relevant to an upper-level seminar on etiological teleosemantics.

  **1. The Disjunction Problem and Co-extension**
  "A classic objection to etiological views focuses on the indeterminacy of selective history. Consider the frog's fly-snapping mechanism. Across the relevant evolutionary history, *flies* and *small, dark, moving things* were perfectly co-extensive. Natural selection only 'sees' the correlation, not the specific ontology. So, what fact of the matter fixes the content as *fly* rather than the disjunction *fly-or-dark-spot*? If the selection history is compatible with both, how does the theory determinately rule out the disjunctive content?"
  *   **[Follow-up]**: "You might appeal to Millikan's notion of 'Normal conditions' to break this tie—arguing that the mechanism functions properly only under conditions where flies are present. But doesn't this just relocate the indeterminacy? How do you define 'Normal conditions' without circularly presupposing the very content (i.e., *flies*) you are trying to fix? If Normal conditions are just 'conditions where the selector worked,' aren't we still stuck with the dark-spot correlation?"

  **2. The Swampman and Historical Essence**
  "Let's turn to the Swampman case. If a lightning strike creates a molecule-for-molecule duplicate of a human in a swamp, this being has no evolutionary or learning history. On your view, proper functions require a history of selection. Are you committed to saying that Swampman has no beliefs, desires, or mental content whatsoever, despite being behaviorally and physically identical to us? Is it really plausible that a being could speak English and navigate the world without actually *representing* anything?"
  *   **[Follow-up]**: "If you stand firm that Swampman lacks content, what are the consequences for cognitive science? If two physical duplicates can differ in mental content purely in virtue of their causal histories, then neuroscience alone cannot taxonomize mental states. Does this imply that cognitive psychology must be an inherently historical science, and if so, how do we study the mental lives of subjects whose histories we cannot access?"

  **3. Explanatory Idleness of History**
  "Critics often charge that historical content is explanatorily idle. When I reach for a glass of water, my behavior seems fully caused by the current causal and functional role of my neural states. The selection history that supposedly fixed the content of 'water' is in the past and doesn't seem to be doing any causal work in the present moment. If the current physical structure explains the behavior, what explanatory work is left for the historical proper function to do?"
  *   **[Follow-up]**: "Could you give us a concrete case where the historical story actually earns its keep? We need an example where knowing the *selected effect* of a state allows us to predict or explain behavior in a way that knowing the *current causal role* does not. Without such a case, doesn't the etiological component look like a metaphysical add-on rather than a scientific explanation?"

  **4. Derived Proper Functions and Learning**
  "Millikanian biosemantics grounds basic content in natural selection, but humans clearly acquire new representational capacities within a single lifetime through learning. You rely on the notion of 'derived proper functions' to handle this. But how exactly does a learned mechanism inherit a norm? If I learn to associate a new symbol with a threat, what ensures this isn't just a causal regularity? At what point does a reinforced neural pathway become a 'derived proper function' rather than just a habit, and what is the mechanism of that derivation?"

  **5. Abstract and Non-Natural Kind Concepts**
  "Etiological theories excel at perceptual contents like *predator* or *water*, which map clearly onto fitness conditions. But what about abstract concepts like *prime number*, *justice*, or *entropy*? These were never direct objects of natural selection; our ancestors didn't survive by thinking about number theory. How does the teleosemanticist fix the content of these representations without a specific selection history for those specific properties? Do we have to say we don't literally *think* about primes, but only about survival-relevant proxies?"

  **6. The Primacy of the Consumer System**
  "A distinctive commitment of your view is that content is fixed not just by the system producing the signal, but by the 'consumer' system that uses it. Why is the consumer side privileged in fixing content? If the producer mechanism has a specific selected effect, why isn't that sufficient? Is there a risk here that content becomes too relational—if the consumer changes its function, does the producer's content change even if the producer's history remains the same?"

  **7. Naturalizing Normativity**
  "Teleosemantics is often praised for naturalizing intentionality, but proper functions seem inherently normative; they tell us what a system *ought* to do, not just what it *does*. If a heart fails to pump, it is malfunctioning. But how do you derive this 'ought' from the 'is' of evolutionary history without committing the naturalistic fallacy? Is the normativity of mental content merely metaphorical on your view, or is there a genuine normative fact grounded in biology?"

  **8. Individual Variation and Pathology**
  "Selection operates on populations over generations, but mental content is ascribed to individuals. What is the status of an individual whose neural architecture deviates significantly from the species norm due to mutation or injury? If their internal mechanisms do not match the 'Normal' design fixed by selection, do they lack determinate content? Does your view imply that individuals with atypical neurology are in a state of constant semantic malfunction?"

  **9. Distinguishing Error from Function Change**
  "One of the main selling points of teleosemantics is its ability to handle misrepresentation: a state misrepresents when it fails to perform its function in Normal conditions. However, biological systems are plastic. If a mechanism starts responding to a new stimulus and this enhances fitness, selection might begin favoring this new role. How do we distinguish between a system *misrepresenting* its old content and a system whose proper function has *shifted* to a new content? Is there a temporal lag in content fixation?"

  **10. Multiple Realizability and Physicalism**
  "Finally, how does your historical view mesh with the physicalist commitment that mental states are realized by physical states? If mental content depends on a specific lineage of selection, does this threaten multiple realizability? Could a silicon-based AI, which has no biological evolutionary history but behaves identically to a human, ever have genuine mental content on your view, or is biological lineage a necessary condition for intentionality?"
