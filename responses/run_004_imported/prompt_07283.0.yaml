prompt: |-
  Ok so this has been bugging me since my brother-in-law cornered me about this at a barbecue last weekend. He's gotten really into "evolution isn't real science" content lately (think it's from some apologetics podcast he listens to), and his big move this time was pulling out an actual Karl Popper quote on me — apparently Popper called natural selection a "metaphysical research programme" instead of a real scientific theory, and said the whole "survival of the fittest" thing is basically a tautology since "fittest" just ends up meaning whatever happens to survive. His argument was: Popper is literally the guy who invented the falsifiability test for what even counts as science, so if even Popper didn't think natural selection passes it, that settles it — evolution is more like a philosophy than an actual science. Ngl the tautology bit is kind of hard to argue with when you put it that way, and all I had in the moment was "that can't be the whole story," which isn't exactly a knockdown argument.

  I poked around online a bit afterwards and it seems like theres more to it than the soundbite — something about a later paper of Popper's from the 70s where he seemed to walk at least part of this back? I couldn't really figure out what changed though, or whether it even matters for my brother-in-law's bigger claim either way. Like: is the tautology thing actually a real problem for evolutionary theory counting as science, was Popper's original dig even about the whole theory or just one slogan version of it, and does it matter what he personally ended up concluding regardless? I've got more family stuff coming up over the holidays and would really like an actual understanding of this instead of just a gut-feeling objection for round two.
