answer: |-
  An etiological theorist and a causal-role theorist are shadowing a cardiologist.

  The doctor puts the stethoscope to the patient's chest and says, "Thank goodness for the heart's function of making sound."

  The etiological theorist chokes. "That's a byproduct! It wasn't selected for! The ancestors didn't survive because they were audible!"

  The causal-role theorist shrugs. "It contributes to the diagnostic capacity of the medical system. It counts."

  The etiological theorist turns purple. "If sound counts, what *doesn't*?!"

  The causal-role theorist pulls out a hammer and smashes the patient's knee.

  "Now the reflex's function is 'percussion'," he says.

  The etiological theorist immediately has a stroke.

  The causal-role theorist dials 911 and smiles. "Relax. In the 'Emergency Response' system, his stroke is functioning to activate the paramedics."

  ***

  **Why this works for your friend:**
  *   **The Setup:** It uses the classic "heart noise" example you mentioned. The Etiologist rejects it because it lacks **evolutionary history** (selected effect), while the Causal-Roler accepts it because it aids the **current system** (diagnosis).
  *   **The Escalation:** The Causal-Roler smashing the knee shows how easily the Causal-Role view can assign "function" to *anything* if you define the "system" broadly enough (e.g., a system of music/percussion).
  *   **The Punchline:** The stroke is the ultimate test. To the Etiologist, a stroke is a **malfunction** (failure of selected effect). To the Causal-Roler, because the stroke triggers the ambulance system, it technically **contributes to a capacity**, so it can be framed as a "function." It highlights the critique that the Causal-Role view is *too* permissive, while the Etiological view is *too* rigid.
