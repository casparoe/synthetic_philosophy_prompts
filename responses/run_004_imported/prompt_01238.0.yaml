prompt: |-
  I've been reading rationalist blogs and forums (LessWrong, the old Overcoming Bias archives, and so on) for years, and one piece of Bayesian folklore that gets invoked constantly in discussions of rationality is I.J. Good's 1967 theorem on the value of information — the same I.J. Good who worked with Turing at Bletchley Park. The theorem says that for an idealized rational agent, the expected utility of costlessly observing evidence before choosing an action is never lower than the expected utility of choosing without it, and is strictly higher whenever there is some chance the evidence would change what you'd do. I've always taken this as more or less settling the question of whether ignorance can be instrumentally rational: turning down free, decision-relevant evidence looks like a fairly direct violation of Bayesian rationality, whatever comfort it might buy you.

  This came up concretely a few weeks ago. A close friend has a parent with Huntington's disease, which puts her at 50% risk of carrying the mutation herself. Her hospital offers the predictive genetic test free of charge as part of a research program, and it would tell her, with certainty, whether she carries it. She has already ruled out having biological children regardless of the result, and there is no treatment or preventive regimen for asymptomatic carriers whose value would depend on knowing her status — yet she has firmly declined to be tested, saying she would rather not carry around either the dread of a positive result or the strange, unearned relief of a negative one. When I brought up Good's theorem to point out that she was leaving costless expected value on the table, she said I was treating her life like a decision-theory homework problem.

  I would genuinely like to know who is right here. Is declining a free, perfectly informative test in a case like hers actually in tension with Good's theorem, or am I smuggling in some assumption of the theorem — about what counts as "free," or about what the relevant decision problem even is — that does not hold once nothing hinges on the answer? I would like to understand exactly where, if anywhere, my reasoning breaks down before I raise this with her again.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is familiar with rationalist literature (LessWrong, Overcoming Bias) and Bayesian decision theory.
      *   **Core Question:** Is their friend's refusal to take a free, predictive genetic test for Huntington's disease a violation of I.J. Good's theorem on the value of information?
      *   **Specific Situation:** Friend has 50% risk. Test is free. No treatment exists. Friend plans no biological children (removing reproductive decision pressure). Friend cites emotional costs (dread vs. unearned relief) as reasons for declining.
      *   **User's Stance:** Believes Good's theorem implies declining free, decision-relevant evidence is irrational. Feels the friend is treating life like a "decision-theory homework problem" (ironically, the friend said this to the user).
      *   **Goal:** Understand if the reasoning breaks down, where the assumptions of the theorem might not apply, and who is "right."

  2.  **Deconstruct I.J. Good's Theorem (1967):**
      *   **Statement:** For a Bayesian agent maximizing expected utility, the expected utility of observing free evidence $E$ before acting is $\ge$ the expected utility of acting without $E$.
      *   **Key Assumptions:**
          1.  **Costless Information:** The observation itself has no utility cost.
          2.  **Expected Utility Maximization:** The agent cares *only* about terminal outcomes (consequences in the world), not the state of knowledge itself or the emotional experience of holding that knowledge.
          3.  **Action Space:** The agent chooses an action *after* seeing the evidence to maximize utility given that evidence.
          4.  **Relevance:** The evidence *could* change the action (though the theorem holds even if it doesn't, the gain is just zero).
      *   **The "Utility Function" Problem:** Standard decision theory usually defines utility over *world states*. However, humans have utility over *mental states* (beliefs, emotions, anticipation).

  3.  **Analyze the Friend's Situation:**
      *   **Medical Context:** Huntington's is incurable, fatal, neurodegenerative. Knowing doesn't change medical outcomes (no treatment).
      *   **Reproductive Context:** Friend ruled out children. (Usually, this is the main instrumental reason to test).
      *   **Emotional Context:** Friend explicitly states utility is affected by *knowing*. "Dread of positive" and "unearned relief of negative" are utility impacts.
      *   **The Conflict:** The user sees the test as "costless." The friend sees the *result* as having a direct utility cost/benefit independent of any downstream actions.

  4.  **Identify the Breakdown in the User's Reasoning:**
      *   **Assumption of "Costless":** The user defines "costless" as "no monetary fee and no time wasted." Good's theorem requires the *observation* to have no utility impact. If the knowledge itself causes suffering (dread) or alters self-perception (unearned relief), the observation is *not* costless in utility terms.
      *   **Assumption of Instrumentality:** The user assumes information is only valuable insofar as it changes *actions* (instrumental rationality). The friend values *ignorance* as a terminal good (or knowledge as a terminal bad).
      *   **Time Preference/Discounting:** The friend is prioritizing present/future emotional peace over potential (non-existent) instrumental gains.
      *   **The "Ostrich Effect" vs. Rational Ignorance:** In standard econ, "rational ignorance" usually means information is too costly to acquire. Here, it's "rational avoidance" because the information itself is a disutility.

  5.  **Synthesize the Argument:**
      *   **Validate the User:** Acknowledge their grasp of Good's theorem is technically correct *within its formal bounds*.
      *   **Pinpoint the Error:** The error is in the modeling of the utility function. Good's theorem assumes $U(World State, Action)$. The friend's utility is $U(World State, Action, Belief State)$.
      *   **Explain the "Cost":** The psychological burden *is* a cost. If $Cost(Evidence) > Expected Instrumental Gain$, then declining is rational. Since Instrumental Gain $\approx 0$ (no treatment, no kids), even a small psychological cost makes declining rational.
      *   **Discuss "Terminal Values":** Peace of mind is a valid terminal value. Ignorance can be instrumentally rational if knowledge is a disutility.
      *   **Address the "Rationalist" Perspective:** Even within rationalist communities (like LessWrong), this is a known edge case. "Shut up and multiply" applies to consequences, but emotional suffering is a consequence.
      *   **Advice on Friendship:** Warn against using decision theory to argue against a friend's coping mechanism. It's socially costly and philosophically shaky in this context.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the user's knowledge of Good's theorem. It's a classic result.
      *   *The Crux:* The theorem assumes information is utility-neutral *except* via action changes.
      *   *Utility Function:* Explain that if knowledge itself hurts, it's not "free." The friend's utility function includes "not knowing" as a positive term.
      *   *Instrumental vs. Terminal:* The user is focusing on instrumental value (changing actions). The friend is focusing on terminal value (emotional state).
      *   *Huntington's Specifics:* Emphasize the lack of treatment. This removes the instrumental benefit almost entirely.
      *   *Conclusion:* The friend is rational within her own utility function. The user is imposing an external utility function.
      *   *Social Advice:* Don't bring this up again. It damages the relationship and misunderstands her values.

  7.  **Refining the Tone:**
      *   Needs to be respectful to both the user (who is intellectually curious) and the friend (who is dealing with a traumatic situation).
      *   Avoid being preachy. Use precise decision-theoretic language to show *why* the math supports the friend, not just "feelings."
      *   Highlight that Good's theorem is about *expected utility*, and suffering is negative utility.

  8.  **Final Polish:** Check against the specific constraints of the prompt.
      *   Did I answer who is right? (Friend is rational relative to her utility; User is misapplying the theorem).
      *   Did I explain where the reasoning breaks? (Yes, the "costless" assumption).
      *   Did I address the Huntington's context? (Yes, no treatment = low instrumental value).

  **(Self-Correction during drafting):** I should make sure not to dismiss Good's theorem. It *is* true. The issue is the *application*. I need to be clear that the theorem isn't wrong, but the premise "the test is costless" is false in the utility sense. Also, I should mention that "rationality" in the rationalist community isn't just about Good's theorem; it's about winning (achieving values). If her value is peace, she is winning by not testing.

  9.  **Final Structure:**
      1.  Direct Answer: You are misapplying the theorem.
      2.  Technical Breakdown: The "Costless" Assumption.
      3.  Utility Functions: Knowledge as a Direct Good/Bad.
      4.  Instrumental vs. Terminal Value.
      5.  The Huntington's Context (Zero Instrumental Value).
      6.  Social/Rationalist Advice.

  10. (Proceed to generate output based on this thought process.)
answer: |-
  You are asking a precise question about the application of a formal theorem to a messy human context. The short answer is: **Your reasoning breaks down on the assumption that the information is "costless."**

  Your friend is not violating I.J. Good's theorem. In fact, if you model her utility function correctly, her decision is perfectly consistent with Bayesian rationality. You are smuggling in a specific assumption about what counts as "utility" that she does not share.

  Here is the exact breakdown of where the decision-theoretic argument fails in this specific case, and why your friend's position is defensible even within a rigorous rationalist framework.

  ### 1. The "Costless" Assumption
  I.J. Good's 1967 theorem (*On the Principle of Total Evidence*) states that for a Bayesian agent, the expected utility of observing evidence $E$ before acting is greater than or equal to the expected utility of acting without it, **provided that the observation itself has no utility cost.**

  Formally, the theorem requires:
  $$U(\text{observe } E) = U(\text{act after } E) - \text{Cost}(E)$$
  Where $\text{Cost}(E) = 0$.

  You are defining "cost" narrowly: monetary fee, time spent, physical pain of the blood draw. By those metrics, the test is free. However, in decision theory, **cost is measured in utils (utility units), not dollars.**

  Your friend has explicitly stated her utility function includes the *state of knowledge* as a variable.
  *   **Positive Result:** Generates significant negative utility (dread, depression, altered self-perception).
  *   **Negative Result:** Generates mixed utility (relief, but "unearned," potentially survivor's guilt).
  *   **Ignorance:** Generates positive utility (hope, ability to plan without a shadow, emotional stability).

  Because the *possession of the information* directly alters her mental state in a way she values negatively, the observation is **not costless**. It has a high "psychic cost." Good's theorem does not apply when the act of observation itself incurs a disutility that outweighs the instrumental benefit of the information.

  ### 2. Instrumental vs. Terminal Value of Information
  Your argument relies on the **instrumental value** of information. Information is instrumentally valuable if it allows you to map actions to states of the world more effectively (e.g., "If I have the gene, I will do X; if not, I will do Y").

  In your friend's case, the instrumental value is near zero:
  1.  **No Treatment:** Knowing doesn't change medical outcomes.
  2.  **No Reproduction:** She has ruled out biological children, removing the primary altruistic/instrumental reason to test (preventing transmission).

  Since the instrumental value is $\approx 0$, the only remaining value is **terminal**.
  *   You seem to assume "Truth" or "Accurate Beliefs" are terminal goods. (This is a common assumption in rationalist circles, often summarized as "map reflects territory.")
  *   Your friend treats "Peace of Mind" or "Hope" as terminal goods.

  If an agent values "not knowing" terminally, then acquiring knowledge is consuming a good they value. A rational agent will not pay a cost (loss of peace) for a benefit (instrumental leverage) that is zero.

  ### 3. The "Ostrich Effect" is Rational Here
  In economics and decision theory, "rational ignorance" usually refers to situations where the cost of *acquiring* information exceeds the benefit. In your friend's case, this is **rational avoidance**.

  Consider the expected utility calculation:
  *   **Option A (Test):** $0.5 \times U(\text{Positive Knowledge}) + 0.5 \times U(\text{Negative Knowledge})$
  *   **Option B (No Test):** $U(\text{Ignorance})$

  If $U(\text{Positive Knowledge})$ is deeply negative (e.g., years of anticipatory grief), and $U(\text{Ignorance})$ is moderately positive (living normally), Option B can easily exceed Option A in expected utility, even if Option A allows for theoretically optimal action planning.

  Since there are no actions to optimize (no treatment, no kids), the "optimization" term drops out, leaving only the emotional cost of the belief state.

  ### 4. Where Your Rationalist Intuition Clashes with Human Utility
  You mentioned reading LessWrong and Overcoming Bias. A core tenet of that community is "Shut up and multiply." However, a more advanced lesson often learned later is **"Utility functions are not up for debate."**

  If you argue that your friend *should* value accurate beliefs over emotional comfort, you are not arguing about rationality; you are arguing about **values**.
  *   **Your Value:** Epistemic hygiene, facing reality, preparation.
  *   **Her Value:** Emotional stability, quality of life in the present, avoidance of unnecessary suffering.

  Neither is "irrational." Rationality is the system that gets you what you want. If what she wants is to live the next 20 years without the shadow of a confirmed diagnosis hanging over her, and the test does not help her achieve that (and actively hinders it), then **taking the test would be the irrational act.**

  There is a specific discussion in rationalist circles regarding "The Value of Truth." While true beliefs are generally instrumentally useful, they are not *universally* terminally valuable to all agents. If an agent's utility function penalizes specific true beliefs, a rational agent will avoid them.

  ### 5. Why You Should Not Raise This Again
  You asked where your reasoning breaks down. It breaks down in assuming that her utility function matches the one implied by a standard medical decision model. But there is a second, more practical breakdown: **Social Rationality.**

  Even if you were theoretically correct (which you aren't, due to the cost assumption), invoking Good's theorem in this context is a category error.
  1.  **It invalidates her coping mechanism.** She is facing a potentially traumatic future. Ignorance is a shield. Trying to remove the shield with a theorem treats her emotional survival as a logic puzzle.
  2.  **It misunderstands the stakes.** For you, this is an intellectual debate about Bayesian consistency. For her, this is about whether she spends her 40s wondering "when" or living "if."
  3.  **It damages trust.** Telling a friend they are being "irrational" for managing their own mental health in the face of a genetic death sentence signals that you prioritize theoretical consistency over their well-being.

  ### Summary
  **Your friend is right.**
  *   **Good's Theorem:** Does not apply because the information is not costless (psychological burden > instrumental benefit).
  *   **Rationality:** She is maximizing her expected utility given her actual values (peace of mind > epistemic accuracy).
  *   **Action:** Do not bring this up again. Accept that "rationality" serves the agent's values, and her values legitimately include the right to remain ignorant when knowledge offers no power to change the outcome.

  You are trying to solve for $X$ (the optimal decision) when you disagree on the function $U$ (what matters). In decision theory, you cannot derive an optimal action without agreeing on the utility function first. Hers includes "not suffering from dread." Yours apparently does not weight that heavily enough. That is a difference in humanity, not a difference in calculation.
