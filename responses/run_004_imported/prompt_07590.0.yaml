answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I am currently the most terrified person in this room.

  When my aunt volunteered me to give this toast, she didn't mention the audience. Looking around, I see a lot of people who spent years in my grandfather's classroom. I see people who probably have a stronger grasp of subjunctive clauses than I do. And I know that for the last forty years, my grandfather hasn't just taught Latin; he has lived inside one specific book.

  We all know the book. It's the beat-up Loeb edition on his nightstand. *De Senectute*. On Old Age.

  Preparing for tonight, I realized I couldn't just stand here and talk about "golden years" or "fine wine." You can't give a generic toast to a man who treats Cicero's *Cato* as a personality trait. So, I decided to do what he taught us to do: follow the argument.

  Cicero structures the book around four charges people bring against old age. He says people claim aging is miserable because: one, it withdraws us from active life; two, it enfeebles the body; three, it deprives us of pleasures; and four, it is near to death.

  Looking at the man of the hour, I think we can refute the first three pretty easily.

  Charge one: That retirement means irrelevance. But looking at this room, full of former students who still call him, still visit him, still ask his advice... it's clear he never actually stopped teaching. He just changed the curriculum from Vergil to life.

  Charge two: That the body fails. Now, I have to be honest here. After his fall last month, this one felt heavy. It is scary to see someone you love vulnerable. But Cicero argues that while the vessel weakens, the mind can remain the captain. Grandpa, you've spent the last few weeks arguing with physical therapists with the same vigor you used to argue with department heads. The body might stumble, but the spirit is still standing.

  Charge three: That you lose the joys of youth. I think the fact that you're celebrating your 90th with a room full of people you love, and presumably a glass of something decent, disproves that one nicely.

  But that leaves the fourth charge. The one that hangs over this book, and honestly, over tonight. *That old age is near to death.*

  Cicero writes this section with such calm. He argues that a life well-lived is a banquet where you've eaten your fill, and leaving the table shouldn't be a tragedy. And this is where I got stuck writing this toast.

  Because I started reading his copy this week, and I was reminded of the footnote that always sits in the back of my mind. Cicero wrote this in 44 BC. He was 62 years old. He was preaching calm acceptance of the end. And about a year later, Mark Antony had him murdered. His head and hands were cut off and nailed to the Rostra.

  So, how do I use a text about facing death calmly, written by a man who was violently killed, for my grandfather's 90th birthday? It feels dishonest to ignore the irony. But it also feels wrong to bring the shadow of an assassin into a birthday dinner.

  But then I realized: that isn't what the book is about. And it isn't what Grandpa's life is about.

  Cicero lost the political battle. He lost his life. But he won the argument. Because I am standing here, two thousand years later, reading his words, and you are all here, decades later, remembering his lessons.

  The irony of Cicero's death doesn't invalidate his argument; it proves it. The body is mortal. It is fragile. It can be broken by a fall, or by a sword. But the work? The teaching? The love you pour into a family and a classroom? That is the only thing that actually outlasts the "fourth charge."

  Grandpa, you quoted this book at Grandma's funeral. I know that was... a lot for us at the time. But I understand it better now. You weren't quoting it to dismiss the loss. You were quoting it to assert that the argument continues even when the speaker is gone.

  You are 90. You have outlived the average Roman lifespan by double. You have outlived the fears Cicero listed. And yes, we all know the end comes for everyone. But the toast isn't about the end. It's about the fact that you are still here, still arguing, still teaching, and still correcting our pronunciation.

  So, I propose a toast. Not to immortality, because Cicero teaches us that's a fool's errand. But to *auctoritas*. To authority, not of power, but of character.

  To the man who taught us that while the body may weaken, and while the winter may come, the harvest of a life well-lived is something no one can take away.

  *Ad multos annos*, Grandpa. Cheers.
