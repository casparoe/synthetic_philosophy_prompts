prompt: |-
  My grandpa's turning 90 in a few weeks and my aunt volunteered me to give the toast at his birthday dinner, which is honestly terrifying because he taught Latin for almost 40 years and Cicero's De Senectute (On Old Age) was basically his whole personality -- he's got this beat up Loeb edition he'd quote from any time someone complained about getting older, including at my own grandma's funeral, which was a whole thing. Probably a third of the guest list are former students of his, a few of whom could probably still recite bits of it in Latin, so I really can't just do the generic "wisdom comes with age" toast -- I want to actually structure it around his real argument, the four things people think make old age miserable and how Cato answers each one, instead of just vibes and a wine metaphor.

  Heres the part thats been bugging me though. I started rereading his copy this week, partly because he had a bad fall last month and it kind of forced the issue for me, and I realized Cicero wrote the whole thing about a year before Antony had him killed, which is such a strange fact to sit with given that the entire back half of the book is Cato calmly explaining why an old man shouldn't be afraid of dying. It feels dishonest to just lift that section for an uplifting birthday toast like the irony isn't there, but it also feels wrong to make my grandpa's 90th about how Cicero got murdered. Can you actually write me a five minute toast that uses the real structure of his argument, not just the greatest hits quotes, and finds an honest way to hold that irony rather than just pretending I don't know about it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Grandpa's 90th Birthday Dinner.
      *   **Speaker:** Grandchild (volunteered by aunt, terrified).
      *   **Honoree:** Grandpa, retired Latin teacher (40 years), obsessed with Cicero's *De Senectute* (On Old Age). Known for quoting it even at inappropriate times (like Grandma's funeral).
      *   **Audience:** Family + many former students (some know Latin, know the text well).
      *   **Constraint 1:** Must structure the toast around Cicero's actual argument (the four charges against old age), not generic "wisdom/age" vibes.
      *   **Constraint 2:** Must address the irony of Cicero's death (written shortly before execution) without making the birthday morbid or dishonest.
      *   **Tone:** Respectful, intellectual but accessible, honest, slightly humorous (acknowledging the "terrifying" nature of the task), warm.
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct *De Senectute* (The Four Charges):**
      *   Cicero (via Cato) outlines four reasons people hate old age:
          1.  It withdraws us from active pursuits/career.
          2.  It enfeebles the body.
          3.  It deprives us of physical pleasures.
          4.  It is not far from death.
      *   *The Twist:* The user specifically wants to address the 4th point (death) and the irony of Cicero's own fate without killing the mood.

  3.  **Determine the Angle on the Irony:**
      *   *Problem:* Cicero wrote this calmly facing death, then got killed. Using it to say "Don't fear death" at a 90th birthday is heavy.
      *   *Solution:* Acknowledge the irony explicitly. Frame it not as "Cicero was right because he died," but "Cicero was right because he lived." The text isn't a prophecy of his death; it's a testament to his life's work. The grandpa's resilience (the fall) mirrors this. The text survives the author. The *teaching* survives the teacher.
      *   *Key Insight:* The toast shouldn't be about *dying* well, but about *arguing* well. Grandpa loved the argument, not just the conclusion.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the intimidation factor. Mention the Loeb edition. Establish the bond (Grandpa + Latin).
      *   **The Structure (The Four Charges):** Briefly walk through them, applying them to Grandpa.
          1.  *Active Pursuits:* He retired from teaching, but didn't stop teaching (students here, family).
          2.  *Body:* Acknowledge the fall. Be honest. The body weakens, but the mind holds.
          3.  *Pleasures:* He gave up some, but found others (grandkids, reading).
          4.  *Death (The Tricky Part):* Address the Cicero irony here.
      *   **The Irony/Resolution:** Cicero wrote this before Antony killed him. Yes, that's dark. But the book survived. Grandpa's legacy survives. The argument is stronger than the ending.
      *   **Closing:** Raise a glass. A Latin phrase (keep it simple/appropriate).

  5.  **Refining the Tone:**
      *   Needs to sound like a grandchild, not a professor.
      *   Needs to respect the students in the room (don't dumb it down too much, but don't show off).
      *   Needs to handle the Grandma/Death mention carefully (the prompt mentions he quoted it at her funeral, which was "a whole thing." I should acknowledge that gently without reopening wounds).

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. I'm scared. Grandpa loves Cicero.
      *   Cicero says 4 bad things about age.
      *   1. No work. Grandpa still teaches us.
      *   2. Weak body. He fell, but he's here.
      *   3. No fun. He likes wine and us.
      *   4. Death. Cicero died soon after writing this. That's scary. But Grandpa is 90. He beat the odds.
      *   Cheers.

      *Critique 1:* Too blunt. Needs more grace on the death/Cicero irony. Needs to feel like a *toast*, not a book report.

  7.  **Drafting - Iteration 2 (Focusing on the Irony):**
      *   Make the irony the pivot point. "It is strange to quote a man about surviving old age when that man was murdered."
      *   Connect it to Grandpa's fall. "We worry about him falling, like we worry about Cicero dying."
      *   But the text remains. "Vivit" (He lives).
      *   Integrate the four charges more naturally.

  8.  **Finalizing the Content (incorporating specific prompt details):**
      *   Mention the beat-up Loeb edition.
      *   Mention the 40 years of teaching.
      *   Mention the fall.
      *   Mention the funeral incident (tactfully).
      *   Ensure the 4 charges are clear.
      *   Resolve the Cicero death irony: The value isn't in escaping death, but in the quality of the argument/life before it.

  9.  **Writing the Toast (incorporating the "Voice"):**
      *   *Self-Correction during writing:* Make sure I don't spend too long on the first three points or I won't have time for the death/irony resolution which is the core request.
      *   *Latin Check:* Use *De Senectute*. Maybe *Senectus ipsa*. Keep it pronounceable.
      *   *Timing:* Read aloud to check pace. (Aiming for ~800 words).

  10. **Final Polish:** Check the transition from the "murder" fact to the "celebration." The bridge is: Cicero lost the political battle, but won the literary one. Grandpa has won the age battle so far, but his legacy is the students/family.

  *(Self-Correction on the "Grandma's Funeral" detail)*: The prompt says quoting Cicero at the funeral was "a whole thing." I should acknowledge that this toast is *not* that. It's a birthday. But the shadow of mortality is real because of the fall. I need to balance the "90th birthday joy" with "honesty about aging."

  *Decision:* I will frame the Cicero death irony not as "we are all going to die" but as "the words outlast the man." That fits a 90th birthday (legacy).

  11. **Final Review against constraints:**
      *   5 minutes? Yes.
      *   Structure around 4 charges? Yes.
      *   Address Cicero's death irony honestly? Yes.
      *   Not generic? Yes.

