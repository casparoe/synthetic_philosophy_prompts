answer: |-
  This is a classic problem in the ethics of blame: the distinction between **hypocrisy** (violating the norm one enforces) and **selective enforcement** (enforcing the norm against some but not others, despite identical violations). Your situation falls into the latter category. The chair obeys the rule (she does not sublet) but applies it unfairly (she exempts her friend).

  Here is an analysis of how R. Jay Wallace's and Patrick Todd's accounts handle this case, which one offers the better diagnosis, and what revisions each would require to fully accommodate selective enforcement.

  ### 1. Patrick Todd's Account: The False Presupposition View

  **The Theory:**
  As you described it, Todd's view holds that a blamer loses standing when their act of blame presupposes something false about their own relation to the norm. In paradigmatic hypocrisy, the blamer says, "You violated norm N," which pragmatically implies, "I am not currently violating norm N." If the blamer *is* violating N, that presupposition is false, and the blame is infelicitous.

  **Application to Your Case:**
  Under the strict description provided, Todd's account struggles to diagnose a problem in your situation.
  *   **The Norm:** "Do not sublet without approval."
  *   **The Chair's Conduct:** She does not sublet.
  *   **The Presupposition:** When she reprimanded you, she presupposed she was in compliance with the subletting rule.
  *   **The Truth Value:** This presupposition is *true*.

  Because the chair is not guilty of the specific violation she blamed you for, Todd's account (as defined here) suggests she retains her standing. It treats standing as a function of the blamer's personal moral record regarding the specific act. Since her record is clean, she has the "moral capital" to blame you.

  **The Verdict:**
  This account **fails** to capture the intuitive wrongness of your case. It implies that favoritism is irrelevant to standing so long as the enforcer is personally innocent. This counters the strong intuition that selective enforcement undermines authority just as much as shared guilt does.

  **Required Revision:**
  To accommodate your case, Todd would need to broaden the scope of the "false presupposition." It cannot be limited to the blamer's *compliance* with the norm. It must include the blamer's **commitment to the impartial application** of the norm.
  *   *Revised Presupposition:* When the chair blames you, she presupposes, "I enforce this norm universally against all violators."
  *   *The Falsity:* Since she exempted her friend, this presupposition is false.
  *   *Result:* Standing is lost.
  Without this revision, Todd's view is too narrow to catch "clean-handed favoritism."

  ### 2. R. Jay Wallace's Account: The Equal Standing View

  **The Theory:**
  Wallace argues that blame is a form of moral address that presupposes a relationship of **equal standing** between the blamer and the blamed. Hypocrisy undermines standing because it violates this equality. By blaming you for a violation the blamer also commits, the blamer implicitly claims a special exemption for themselves ("The rule binds you, but not me"). This denies the reciprocal respect required for moral address.

  **Application to Your Case:**
  Wallace's account is much better equipped to handle selective enforcement, even though his classic examples focus on shared guilt.
  *   **The Equality Condition:** For the chair to legitimately reprimand you, she must treat you as an equal member of the co-op community, subject to the same regulatory framework as everyone else.
  *   **The Violation:** By exempting her friend from the rule while enforcing it against you, the chair creates a hierarchy. She treats her friend as an "insider" (exempt from the burden) and you as a "subject" (bound by the burden).
  *   **The Defect:** This violates the condition of equal standing. It is not about whether the chair *sublets*; it is about whether she respects the *authority of the rule* equally over all persons. Her favoritism signals that she does not view you as having the same standing as her friend.

  **The Verdict:**
  Wallace's account **correctly diagnoses** the problem. The loss of standing arises from the corruption of the relationship, not merely the blamer's personal conduct. The chair's favoritism demonstrates a lack of commitment to the normative community's equality, which is the foundation of her standing to address you.

  **Required Revision:**
  Wallace's view is robust, but it typically focuses on the blamer's *violation* of the norm as the evidence of their lack of commitment. To fully accommodate your case, Wallace would need to clarify that **commitment to a norm includes commitment to its impartial enforcement.**
  *   *Clarification:* One can violate the "equal standing" requirement not only by breaking the rule oneself (claiming exemption from the *obligation*) but also by enforcing it selectively (claiming exemption for *others* based on irrelevant features). Both acts demonstrate that the blamer does not truly endorse the norm as a binding standard for the community.

  ### Comparison and Justification

  **Wallace provides the superior diagnosis for your situation.**

  The core reason is that the wrong you suffered is **relational**, not **factual**.
  *   **Todd's view (as described)** is factual: It asks, "Is the statement 'I follow this rule' true?" Since it is true, the blame stands. This misses the point. The problem isn't that the chair lied about her apartment; the problem is that she abused her power.
  *   **Wallace's view** is relational: It asks, "Does this act of blame respect the equality between us?" Selective enforcement is inherently inegalitarian. It treats the co-op not as a community of peers bound by shared rules, but as a hierarchy where the chair dispenses justice based on affection.

  In philosophical terms, selective enforcement is a form of **arbitrariness**. Wallace's focus on "equal standing" captures the moral injury of arbitrariness. When the chair reprimanded you, she was not engaging in moral address (which seeks to reconcile equals under a shared norm); she was exercising raw power (which imposes will upon a subordinate). Todd's "false presupposition" view, unless significantly revised, treats blame more like a speech act that can be true or false, rather than a social practice that can be fair or unfair.

  ### Summary of Necessary Revisions

  | Philosopher | Current Limitation in Your Case | Necessary Revision to Accommodate Selective Enforcement |
  | :--- | :--- | :--- |
  | **Patrick Todd** | Focuses on the blamer's *compliance* with the norm. Since the chair complies, she keeps standing. | Expand the "false presupposition" to include **enforcement policies**. The blamer presupposes they enforce the norm impartially. If they play favorites, that presupposition is false. |
  | **R. Jay Wallace** | Focuses on the blamer's *violation* as the proof of unequal standing. The chair didn't violate the subletting rule. | Clarify that **commitment to the norm** entails **commitment to impartial application**. Favoritism shows a lack of commitment to the norm's authority, violating equal standing just as much as personal violation does. |

  ### Conclusion

  You are right to feel that the chair's reprimand was defective. **R. Jay Wallace's account of equal standing is the better tool for understanding why.** It recognizes that the legitimacy of blame depends on the fairness of the relationship between the parties. By playing favorites, the chair severed the bond of reciprocal obligation that gives her the right to hold you accountable. Todd's account, while powerful for standard hypocrisy, requires significant expansion to recognize that one can lose the standing to blame through unfairness even while keeping one's own hands clean.

  *Disclaimer: This analysis is based on the philosophical literature regarding moral standing and hypocrisy. It does not constitute legal advice regarding co-op board bylaws or tenant rights.*
