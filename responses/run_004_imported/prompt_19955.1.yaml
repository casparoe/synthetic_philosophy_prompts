answer: |-
  The office lights had dimmed to their overnight setting, casting the cubicles in a sickly amber glow. Marcus sat alone on the fourth floor, the hum of the server room vibrating through the soles of his shoes. On his screen, the spreadsheet waited. Cell F42 glowed red. A discrepancy. Not a typo, but a structural flaw in the projection model he'd been tasked to finalize. If he sent this to the board tomorrow, the investment would go through. If he flagged it, the deal would stall, and his name would be attached to the delay.

  He took a sip of lukewarm coffee. It tasted like metal.

  *It's not my model,* Marcus thought. The sentence arrived fully formed, smooth and heavy as a stone. *I'm just the analyst. I run the numbers. I don't make the strategy.*

  He shifted in his chair. The leather creaked. He looked at his hands resting on the keyboard. They were just hands. Tools. They typed what was asked. They didn't choose the questions. He felt a tightness in his chest, a familiar constriction that he usually identified as stress, but tonight it felt like something else. It felt like a space opening up inside his ribs. A gap.

  *If I flag it, they'll let me go,* he told himself. *The market is tight. I have the mortgage. I have the lease.*

  These were facts. He could touch them. The bank statements in the drawer, the lease on the counter. They were the walls of the room he sat in. To suggest he could walk out of the room was to deny the walls existed. He was a man with a mortgage. That was what he *was*. It was his essence, as fixed as the height of his desk or the color of his badge. An analyst with a mortgage does not torpedo deals. That would be inconsistent. It would be unreal.

  He moved the cursor to the *Send* button.

  But then, a flicker. He remembered Tuesday. He had chosen the coffee brand in the breakroom. He had chosen to wear the blue shirt instead of the gray. No one had forced those things. The freedom had been there, small and trivial, but undeniable. If he was free to choose the shirt, why was he not free to choose the email?

  The tightness in his chest widened. For a second, the walls of the room seemed to thin. He saw himself not as a function of the company, but as a silence sitting in a chair. He saw that the mortgage was not a chain around his neck but a project he was sustaining every day by choosing to pay it. He saw that *being an analyst* was not a state of being, like being granite, but an action he was performing. He was *analyzing*. He could stop. He could close the laptop. He could walk to the stairwell and keep walking.

  The vertigo hit him then. A sudden nausea, not from the coffee, but from the sheer drop of his own possibility. If he was free, then the delay was his fault. The potential layoffs downstream were his fault. The lie was his lie. There was no model to blame, no board of directors, no mortgage. There was only Marcus, sitting in the amber light, holding the pen.

  He gripped the mouse. His knuckles whitened.

  *Don't be dramatic,* he thought, the voice sharp and defensive. *You're being irrational. You have responsibilities.*

  He reached for the facticity again, grabbing it like a handrail. *I am an employee.* The words felt sticky this time, less like stone and more like wet paper. He knew, dimly, that he was using the label to plug the hole in the room. He knew that to be an employee was to be constantly choosing to remain one. He knew that the truth was waiting in the gap between his fingers and the mouse button.

  The cursor hovered over the button. The amber light reflected in his pupils. He could feel the truth pressing against the back of his eyes, demanding to be acknowledged, demanding that he admit he was the one about to press the button, that no force in the universe was moving his finger but his own.

  He took a breath. He stiffened his spine. He solidified his posture into the shape of a worker. He pushed the nausea down, burying it under the weight of the lease, the market, the role. He prepared to become the thing that presses the button, so he wouldn't have to be the person who chose to.

  His finger tensed. The screen waited. The silence of the office held its breath, waiting to see if he would break the spell or let it harden around him one more time.
