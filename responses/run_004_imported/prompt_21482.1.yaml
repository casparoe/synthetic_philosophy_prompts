      *   *Collective Passion:* Algorithms optimize for engagement (outrage/joy), which mirrors the "collective passion" Weil warns against.
      *   *Opinion on Everything:* Twitter/X users feel compelled to have a take on every global event within minutes. This fits Weil's critique of parties demanding total ideological coverage.
      *   *Self-Perpetuation:* Algorithms want *time on site*, parties want *votes/power*. Both are infinite games. Truth is a finite game (you find it, it's done).
      *   *Pressure to Conform:* Cancel culture, dogpiling, ratioing. This is the "pressure" Weil describes, now automated and amplified.

