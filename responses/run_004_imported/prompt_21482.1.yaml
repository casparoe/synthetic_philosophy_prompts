      *   *Mechanism:* Pressure to conform. Thinking is replaced by "party line."
      *   *Scope Creep:* Members must have opinions on *everything* based on party stance, not truth.
      *   *Goal:* Self-perpetuation (growth/power), not truth or justice.
      *   *Truth/Justice:* These are transcendent. They demand attention and have a "stopping point" (once you find them, you stop). Parties have no stopping point.
