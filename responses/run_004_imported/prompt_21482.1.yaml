      *   *Does her fix make sense?* It's necessary but insufficient. Abolishing the GOP/Democrats wouldn't stop the "Blue Tribe/Red Tribe" dynamic if the underlying attention economy remains.
      *   *Weil's deeper requirement:* It's about *attention*. The ability to attend to truth. Social media is an "attention destruction" machine.
      *   *Adaptation:* Weil might argue for the abolition of the *algorithmic amplification of passion* just as fiercely as parties.

