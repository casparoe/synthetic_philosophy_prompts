  So I've been into Karl Popper for a while and read about his 'verisimilitude' idea - that two theories can both be false but one can still count as closer to the truth than the other. Feels obviously right as a gut instinct - thats basically how i figure science makes progress even though our best theories always end up wrong eventually anyway. Then I read that when Popper actually tried to nail this down properly, using his own ideas of 'truth content' (the true consequences of a theory) and 'falsity content' (the false ones), a couple of logicians in the 70s proved his definition can never actually rank two false theories against each other. It only works if the 'better' one turns out to be literally true, which kinda wrecks the whole point, since the reason he came up with this was to compare rival theories that are BOTH false. Can you invent a concrete example of two false theories where our gut clearly says one's closer to the truth than the other (please, not the usual Newton vs Einstein thing), and then walk Popper's actual truth-content/falsity-content definition through it so I can see exactly where and why it breaks down?
