answer: |-
  Good evening. For those of you who don't know me, I'm a friend of the bride from our graduate program. Which means I spend a lot of time thinking about abstract questions, while the groom, [Fiancé's Name], spends his time dealing with the very concrete reality of markets. Usually, those two worlds don't mix well. But looking at them tonight, I'd argue they've found a common currency.

  [Friend's Name] has spent the last several years immersed in the work of G. E. Moore. For the family, don't worry—I'm not going to give a lecture. But for those of us who know her work, we know she cares deeply about a specific question: What makes a life truly good? Not just profitable, or pleasant, but *good*.

  And Moore, in his own dense way, argued that the best things in life are combinations. He said that the highest value isn't found in a feeling alone, or in an object alone. It's found in a specific relationship between the two. It's an emotion that fits its object. A feeling that is appropriate to the truth of what it's looking at.

  I mention this because I have watched [Friend's Name] and [Fiancé's Name] together for a long time. And the thing that strikes me most is not how they idealize one another. We are used to wedding toasts full of hyperbole. We are told the couple is perfect, flawless, the "best" of everything. But if you know [Friend's Name]'s work, you know she would tell you that love based on an illusion is worth less than love based on the truth. A flattering fiction might feel nicer in the moment, but it doesn't have the same weight. It doesn't have the same *value*.

  What I see between you two is something rarer than idealization. It is clear-sightedness.

  [Friend's Name], I have seen you when you are overwhelmed, when you are stubborn, when you are lost in a problem that has no solution. [Fiancé's Name] doesn't love you *despite* that. He loves you with a full awareness of it. He sees the whole picture. And [Fiancé's Name], I've seen you when you are cautious, when you are tired, when the world feels heavy. [Friend's Name] meets you there, not with a fantasy of who you should be, but with a genuine appreciation for who you are.

  There is a worry, sometimes, that if love is based on knowing someone's actual qualities, it becomes conditional. You might think: "If I love you for your kindness, or your wit, or your stability, what happens when those things fade? What happens when life gets hard and those qualities change?"

  But I think you two have already answered that. The commitment you are making today isn't a promise to stay exactly the same. It's a promise to keep paying attention.

  The value of what you have isn't in a static snapshot of who you are right now. It's in the ongoing activity of truly seeing one another. As you change, as you grow, as you age, the work of marriage is to update your view. It is to ensure that the emotion you feel is always appropriate to the person standing in front of you. It is to refuse the easy path of projecting a fantasy, and instead choose the harder, richer path of witnessing the reality.

  Moore called these combinations "organic unities." The philosophers in the room know what that means. For everyone else, it just means that the whole is greater than the sum of its parts. You are not two separate assets being merged for a better return. You are a new thing entirely, created by the accuracy of your regard for one another.

  So, I am not going to wish you a "perfect" life. I am not going to say you never argue, or that you are flawless. That would be a falsehood, and we know that diminishes the value of the toast.

  Instead, I will say this: May you always have the courage to see each other clearly. May you always find more value in the truth of who you are than in any illusion of who you could be. And may the bond you share remain a whole that is always greater than the parts.

  To [Friend's Name] and [Fiancé's Name].
