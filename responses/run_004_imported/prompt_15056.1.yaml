      *   The user is right to be suspicious. The jump from "not mechanical" to "therefore simple substance" is huge.
      *   *Why Simple?* For Leibniz, composites are just aggregates of simples. If the composite (machine) can't think, the source of thought must be in the constituents. But if the constituents are material, they are just smaller machines. So the constituents must be *immaterial* centers of force/perception.
      *   *Is it smuggled?* Yes, it relies on his prior definitions of Substance and Unity. A machine has no true unity (you can take it apart). A mind has true unity. Therefore, the thinker must be a true unity (a Monad).
      *   *Alternative:* Why not "emergent property"? Leibniz rejects emergence of a different *kind* of property from mechanical parts.

