      *   *Part 1: The Original Charge (1974).* Explain *why* he said it. The "survival of the fittest" tautology. The distinction between historical narrative and universal law.
      *   *Part 2: The Recantation (1978).* What changed? The definition of fitness. The realization that specific hypotheses are testable. Quote the "I have changed my mind" line.
      *   *Part 3: The Nuance (The "Metaphysical Research Programme" bit).* Did he walk it back completely? No. He still thought the *general principle* guides research but isn't a law like gravity. This is crucial.
