          *   New Dispositionalism (Vihvelin): Abilities are dispositions. Dispositions can exist even if masked.
          *   *Implication:* This allows the compatibilist to say Jones *retained* the ability in the Frankfurt case, it was just masked by Black. This supports the friend's view.

      *   **2. The Intrinsic/Extrinsic Distinction (The Core Battleground):**
          *   Dispositions are typically intrinsic properties of the object/agent.
          *   Masks are usually extrinsic (foam is outside the cup).
          *   Finks can be intrinsic or extrinsic.
          *   *The Friend's Point:* Black is an external masker. The ability (intrinsic) remains.
          *   *The User's Point:* If determinism is true, the laws of nature + past act as a "mask" or "fink." Are they extrinsic?
          *   *Implication:* The literature forces compatibilists to argue that *local* extrinsic masks (Black) don't negate ability, but *global* deterministic constraints might need a different treatment, or conversely, that deterministic laws are just "background conditions" not masks. This is where the User's objection hits hard.

      *   **3. The "Finkish" Threat to the Agent:**
          *   Martin's original fink: The disposition vanishes *upon* the stimulus.
          *   In FSCs: Does Black remove the disposition *before* the choice (mask) or would he remove it *if* the choice started (fink)?
