          *   User's View: Importing finks/masks to save conditional analysis of ability just relocates the problem. A determinist can use the same move. It doesn't solve the core incompatibilist worry.
      *   **Task:** Describe the *most important implications* of the finks-and-masks literature on dispositions for the new dispositionalist defense of compatibilism against FSCs.
      *   **Goal:** Provide a neutral, philosophically rigorous analysis that addresses both sides of their argument without necessarily taking a side, but clarifying the stakes.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Frankfurt Cases:* Jones decides on his own; Black would have intervened if Jones showed signs of wavering. Jones couldn't have done otherwise, but seems responsible. Challenge to PAP.
      *   *New Dispositionalism:* Vihvelin, Fara, maybe Whittle. The idea is that "S could have done X" means "S has the disposition to do X if S chooses/tries."
      *   *Finks and Masks:* C.B. Martin's finkish dispositions (disposition disappears when triggered) and Johnston's masks (disposition stays but manifestation is blocked).
      *   *The Connection:* Compatibilists want to say Jones *had* the ability (disposition), even if Black prevented the manifestation. Incompatibilists say the presence of Black removes the ability entirely.
      *   *Key Implications to Cover:*
          1.  Refinement of the Conditional Analysis of Ability (CAA).
          2.  The distinction between Intrinsic vs. Extrinsic barriers (Masks vs. Finks).
          3.  The "Flicker of Freedom" strategy connection.
          4.  The User's specific worry (Determinism analogy).
          5.  The shift from "could have done otherwise" to "sourcehood" or "actual sequence."

  3.  **Drafting the Content - Section by Section:**

