prompt: |-
  Ok so I have zero formal background in philosophy or AI, I just go down rabbit holes in my spare time, and ive been stuck on this one thing for like two weeks now. I was watching some youtube videos about AI safety (one of those channels that explains alignment stuff for regular people) on inverse reinforcement learning - the idea that you can teach a robot/AI what a person wants by watching what they do and then backing out the "reward function" that best explains it. And it mentioned this result that kind of wrecked my brain: apparently you can never actually nail down someone's real reward function from behavior alone, because for literally any sequence of actions, theres always some other reward function you could pair with some weirder "how they turn reward into action" model that explains the exact same behavior just as well. So the data never picks out one true set of values on its own - you always have to smuggle in some extra assumption about how rational or noisy the person's decision making is, and that assumption ends up doing basically all the real work, not the observations.

  A few days later I was half-listening to a philosophy podcast about Quine and this "indeterminacy of translation" thing just clicked for me as basically the same shaped problem - the bit about how a linguist can never be 100% sure "gavagai" means rabbit vs "undetached rabbit-part" vs whatever else, because infinite different translation manuals fit all the possible behavioral evidence forever, and Davidson's fix for this was that you just have to assume people are mostly rational and mostly right about stuff (the "principle of charity") to even get interpretation off the ground at all.

  So heres what I actually want from you: argue, as hard and convincingly as you can, that these arent just two vaguely similar problems, but literally the same underlying problem showing up twice - that the reason IRL can't pin down "the" reward function is the exact same reason radical translation/interpretation can't pin down "the" one true meaning, and that this means "just learn human values from behavior, we'll get the data and algorithms right eventually" isn't a hard engineering problem waiting on more compute - its confused from the start, in principle, forever. You can briefly flag it if you think theres some real disanalogy that lets IRL off the hook, but that shouldn't be the main thing you do. I want the strong version of this argument actually argued, not immediately hedged into mush.
