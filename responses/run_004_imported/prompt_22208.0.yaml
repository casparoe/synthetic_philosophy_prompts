prompt: |-
  ok so i'm on the 5-person bylaws committee for my school's student council and we owe the full council (like 20 people) a recommendation before their vote next wednesday. some seniors want a rule saying any change the council makes to election procedures (nomination rules, spending caps, debate format) cant take effect until the election after next, not the one happening under whoever actually voted for it -- so people cant rig the rules to help themselves get reelected. but a couple committee members want an emergency clause bolted on: if 3/4 of the full council agrees something's a genuine emergency (like a candidate getting caught cheating right before a vote) they can suspend that and change things immediately. theres also a seperate fight over whether the lock-in rule should itself be hard to repeal -- like a 2/3 vote plus a two-meeting waiting period -- or if any future council can just scrap it with a normal majority whenever they feel like it. i have to draft the actual memo we're reading to the council recommending which combo to go with (or dropping the whole idea) and why, and it has to seriously engage the argument that zero flexibility is just asking for disaster the first real emergency, not just act like locking it in is obviously the responsible choice and wanting exceptions is obviously shady. can you write that memo for me, 2 pages max?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a 5-person Bylaws Committee.
      *   **Audience:** Full Student Council (approx. 20 people).
      *   **Deadline:** Vote next Wednesday.
      *   **Task:** Draft a memo recommending a specific combination of rules regarding election procedure changes.
      *   **Key Issues:**
          1.  *The "Lock-In" Rule:* Changes to election procedures shouldn't take effect until the election *after* next (preventing self-serving rule changes).
          2.  *The Emergency Clause:* Can the council bypass the lock-in with a 3/4 vote in genuine emergencies?
          3.  *Repeal Difficulty:* Should the lock-in rule itself be hard to repeal (2/3 vote + waiting period) or easy (simple majority)?
      *   **Constraints:** Max 2 pages. Must seriously engage the counter-argument (that zero flexibility invites disaster) and not paint flexibility advocates as shady. Needs to be persuasive but balanced.

  2.  **Determine the Recommendation:**
      *   *Option A (Strict Lock-In):* Good for integrity, bad for flexibility.
      *   *Option B (Lock-In + Emergency Clause):* Balances integrity with practicality.
      *   *Option C (No Lock-In):* Status quo, high risk of manipulation.
      *   *Option D (Hard to Repeal vs. Easy to Repeal):* Making the rule hard to repeal protects the principle, but might bind future councils too tightly.
      *   *Decision:* The strongest position is usually the balanced one. Recommend the **Lock-In Rule + Emergency Clause**, but keep the **Repeal Process Standard (Majority)**. Why?
          *   Lock-In prevents manipulation.
          *   Emergency Clause addresses the "disaster" argument legitimately.
          *   Standard Repeal respects the sovereignty of future councils (don't bind them too tightly, or they'll just find workarounds).
      *   *Alternative Decision:* Make the Repeal slightly harder (2/3) to show commitment, but the prompt asks to engage the argument about flexibility. A standard repeal might be safer for a student council context where turnover is high. Let's go with **Lock-In + Emergency Clause + Standard Repeal**. This shows trust in future councils while protecting against immediate self-interest.

  3.  **Drafting - Structure of a Formal Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Introduction:** State the purpose and the recommendation clearly.
      *   **Background/Problem:** Explain *why* we are doing this (the risk of self-dealing).
      *   **Analysis of Options:**
          *   The Delayed Effectiveness (Lock-In).
          *   The Emergency Exception (Flexibility).
          *   The Repeal Threshold (Future-Proofing).
      *   **Recommendation:** The specific combination.
      *   **Conclusion:** Call to action.

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Professional, persuasive, fair, student-governance appropriate (not too legalistic, but serious).
      *   *Addressing the Counter-Argument:* The prompt specifically asks to engage the argument that "zero flexibility is asking for disaster." I need to validate that concern. The Emergency Clause is the direct answer to this. I must explain *why* the 3/4 threshold is the right balance (high enough to prevent abuse, low enough to act).
      *   *Addressing the "Shady" Argument:* I need to make sure I don't imply people wanting an emergency clause are trying to cheat. Frame it as "prudent governance."
      *   *Repeal Issue:* Argue that making the rule *too* hard to repeal undermines the council's authority. If a future council overwhelmingly wants to change it, they should be able to.

  5.  **Drafting - Section by Section (Mental or Scratchpad):**
