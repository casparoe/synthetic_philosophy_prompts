  **Mara-1 (Score: 2):** Mara is definitionally correct. In normative economics, sunk costs are irrelevant to marginal decision-making. The $35,000 is unrecoverable; the only rational calculation is future cost vs. future gain ($2,000). Her assessment is the baseline standard for rationality.

  **Ben-1 (Score: 1):** Ben correctly identifies the *mechanism* of the trap (the Dollar Auction/escalation of commitment), where the fear of a certain loss drives further risk. However, he is slightly mistaken to claim this logic *isn't* the sunk-cost fallacy; the Dollar Auction is the canonical example of sunk costs driving irrational escalation. He describes the psychology well but mislabels the economic error.

  **Mara-2 (Score: 1):** Mara offers the standard game-theoretic solution: pre-commitment strategies (setting a walk-away point). This is sound advice in theory. However, it assumes a level of emotional detachment and foresight that is difficult to maintain in adversarial proceedings, making it a "correct but difficult" point.

  **Ben-2 (Score: 2):** Ben delivers the strongest behavioral insight. Empirical studies on the Dollar Auction show that intellectual understanding of the trap does not immunize participants against it once the competitive arousal begins. He correctly identifies that the flaw isn't just a lack of planning, but a structural and psychological vulnerability that planning alone often cannot fix.

  ### What Both Are Missing

  While Mara and Ben debate the *rationality* of the spending, both overlook three critical factors that complicate the mapping of the Dollar Auction to a lawsuit:

  1.  **Non-Monetary Utility:** Both treat the dispute as a pure ROI calculation on a $2,000 strip of land. In reality, the "prize" often includes vindication, establishing a legal precedent to prevent future encroachments, or protecting the total value of the home (which could be much higher than $2,000 if the boundary uncertainty affects resale). If the friend valued "principle" or "security" at $40,000, the spending was rational by his own utility function, even if not financially.
  2.  **Fee-Shifting and Uncertainty:** In the Dollar Auction, the rules are fixed (second bidder pays). In litigation, outcomes are probabilistic, and legal fees can sometimes be recovered from the loser (depending on jurisdiction or contract). This introduces a variable where continuing to fight *can* theoretically recover sunk costs, unlike the auction where bids are never returned.
  3.  **Information Revelation:** A lawsuit is a discovery process. The friend may have started fighting for $2,000 of land but discovered during the process that the neighbor was actively trying to seize a larger portion. The "value" of the lawsuit changed dynamically as new information was revealed, making a static pre-set walk-away point potentially dangerous.
