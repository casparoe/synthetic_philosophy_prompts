prompt: |-
  I'm on my university's IRB and we keep debating whether a study protocol counts as "minimal risk." The thing is, each individual tweak someone proposes (adding one more survey question about drug use, extending the interview by 10 minutes, etc.) seems totally fine on its own, but after a dozen of these small additions the board suddenly feels like the study has become way riskier than what we originally approved. Nobody can point to the exact change that tipped it over though. Is there a principled way to think about this, or are we just doomed to argue about where to draw the line every time?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is a member of a university Institutional Review Board (IRB).
      *   **Issue:** They are struggling with the concept of "minimal risk" in the context of *cumulative* changes to a study protocol.
      *   **Specific Phenomenon:** Individual modifications (e.g., +1 question, +10 mins) seem negligible, but collectively they shift the risk profile significantly.
      *   **Pain Point:** No one can identify the specific tipping point, leading to endless debates.
      *   **Goal:** Find a principled framework or way of thinking to resolve this, rather than just arguing about arbitrary lines.

  2.  **Identify the Core Ethical/Regulatory Concept:**
      *   This is a classic "Sorites Paradox" (Heap Paradox) applied to research ethics.
      *   The regulatory definition of "minimal risk" (45 CFR 46.102(j)) is key: *probability and magnitude of harm or discomfort not greater than those ordinarily encountered in daily life or during routine physical/psychological examinations.*
      *   The phenomenon described is "risk creep" or "cumulative burden."

  3.  **Brainstorm Principled Approaches:**
      *   *Regulatory Guidance:* What does OHRP or FDA say? (They don't give a math formula, but they emphasize the *totality* of the experience).
      *   *Participant Perspective:* Shift focus from the *researcher's* view ("it's just one question") to the *participant's* view ("I'm now answering 50 sensitive questions").
      *   *Categorization:* Group risks by type (privacy, psychological, time burden).
      *   *Thresholds:* Establish pre-defined limits (e.g., max 60 mins, max 5 sensitive questions).
      *   *Re-evaluation:* Treat cumulative changes as a "new" study requiring fresh review.

  4.  **Structure the Response:**
      *   **Validate:** Acknowledge that this is a common, recognized problem (not just their board). Name it (Sorites Paradox/Risk Creep).
      *   **Regulatory Foundation:** Briefly remind them of the actual definition of Minimal Risk (45 CFR 46).
      *   **Principled Frameworks:** Offer concrete ways to analyze the *cumulative* effect.
          *   *Totality of Experience:* The participant's journey.
          *   *Risk Domains:* Separate time, privacy, psychological distress.
          *   *Vulnerable Populations:* Context matters.
      *   **Operational Solutions:** How to stop the arguing in the room.
          *   *Aggregate Review:* Don't vote on amendments in isolation; review the *consolidated* protocol.
          *   *Pre-set Boundaries:* Establish board policies on limits.
          *   *The "Reasonable Person" Standard:* Would a reasonable person feel the risk has changed?
      *   **The "Tipping Point" Reframe:** It's not about *one* change; it's about the *classification* changing.
      *   **Conclusion:** Encouragement.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You're describing the Sorites Paradox. It's a known issue in IRBs.
      *   *Regulation:* Cite 45 CFR 46.102(j). Emphasize "probability AND magnitude."
      *   *The "Cumulative Burden" Concept:* This is the key term. A 10-minute interview is fine. A 10th 10-minute interview is not.
      *   *Strategy 1: The Consolidated Protocol.* Never review an amendment in a vacuum. Always look at Version 1.0 + Amendment 1 + Amendment 2... as a single document.
      *   *Strategy 2: Risk Domains.* Break it down. Time burden is different from sensitive data. If you add sensitive questions, does it cross the "daily life" threshold?
      *   *Strategy 3: The "Reasonable Person" Test.* Imagine a participant. Does the *whole* experience feel like "daily life" anymore?
      *   *Strategy 4: Policy vs. Protocol.* The IRB should set policies (e.g., "Exempt studies cannot exceed 30 mins") so you don't debate it every time.
      *   *Strategy 5: Reclassification.* Admit that sometimes Minimal Risk becomes Greater Than Minimal Risk. That's okay. It just triggers more protections.

  6.  **Refining the Tone:**
      *   Professional, empathetic, authoritative but collaborative.
      *   Avoid jargon where possible, but use correct regulatory terms (OHRP, 45 CFR 46).
      *   Make it actionable.

  7.  **Self-Correction/Edge Case Check:**
