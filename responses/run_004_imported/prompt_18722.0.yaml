prompt: |-
  So I run this small youtube/podcast thing where I talk to people in the AI alignment space, and next guest is a researcher who's written a paper arguing coherent extrapolated volition (the old Yudkowsky idea -- roughly, figure out what humanity would want if it knew more, thought faster, and was a better version of itself, then point the AI at that) is still the right long-run target for alignment, not just something MIRI quietly abandoned for corrigibility. Write me like 8 interview questions that don't just let her re-explain the concept. I want one that really presses on the bootstrapping problem -- to even design the extrapolation process (how much idealization, how disagreements get resolved, whose reflective process counts) you already have to make a bunch of value judgements, so how is that not just smuggling in whoever coded it's values through the back door. I want one on why we should expect everyones extrapolated volition to actually converge instead of just relocating our current disagreements (animal welfare, population ethics, whatever) to a fancier idealized level where people still don't agree. And I want one on the order-dependence worry -- does it matter what sequence of arguments or experiences someone gets walked through during the idealization, and if so is there even a single well-defined thing to extrapolate toward. Give each of those three a sharp follow-up question keyed to the dodge she'll probably reach for, then end with a question forcing her to justify sticking with CEV given that even MIRI moved on to corrigibility as the more tractable target.
