answer: |-
  Here are 8 interview questions designed to be technically sharp, avoid rehashing basics, and press on the specific failure modes you identified.

  **1. The Bootstrapping Problem**
  The architecture of the extrapolation process itself encodes normative commitments. To decide *how* to extrapolate—how much cognitive speedup counts as "better," how to weight conflicting preferences, or whose reflective process gets a vote—you have to hard-code meta-values. Isn't this just smuggling the coder's own value judgments in through the back door under the guise of procedural neutrality?
  *   **Follow-up:** If you answer that we should use a "democratic" or "neutral" procedure to choose those parameters, who decides the rules of *that* procedure? Aren't you just pushing the value-loading problem back one step without solving it?

  **2. Convergence vs. Relocated Disagreements**
  There's an assumption in CEV that idealization leads to coherence—that if we knew more and thought faster, our values would merge into a single attractor. But look at current deep moral disagreements, like population ethics or animal welfare. These aren't just empirical disputes; they're axiomatic. Why should we expect idealization to resolve these rather than just relocating the disagreement to a fancier level where people are simply smarter at disagreeing?
  *   **Follow-up:** You might say idealization includes increased empathy or understanding, but understanding *why* someone holds a pluralist view doesn't force a hedonist to accept it. If the extrapolated volitions remain orthogonal, how does the AI aggregate them without violating the values of the losers?

  **3. Order-Dependence and Path Stability**
  Human reflection is path-dependent. The sequence in which you encounter arguments or experiences changes where you end up. If I walk a subject through argument A then B, they might reach a different reflective equilibrium than if they hear B then A. Does the order of operations matter for CEV? If so, is there even a single well-defined "volition" to extrapolate toward, or is the target fundamentally arbitrary?
  *   **Follow-up:** If your defense is that we can average over many paths to find the "true" center, doesn't that assume the space of moral reasoning is convex? If moral truth has multiple local maxima, averaging just gives you an incoherent mixture of incompatible endpoints.

  **4. The Boundary Problem**
  CEV talks about extrapolating "humanity's" volition, but the boundary of who counts is morally loaded. Do you include future generations who don't exist yet? Do you include humans with severe cognitive impairments whose reflective capacity is limited? Do you include biological humans only, or uploaded minds? How do you define the reference class without making a substantive moral decision that some extrapolated humans might reject?

  **5. The Stop Condition**
  Extrapolation implies a process of reflection, but reflection is potentially infinite. How does the AI know when the extrapolation is "done"? If you stop too early, you're locking in under-reflective values; if you go too far, you might drift into moral territory current humans find abhorrent (e.g., wireheading). What is the non-arbitrary stop condition that prevents the AI from optimizing away the very humanity it's supposed to serve?

  **6. Adversarial Robustness**
  During the extrapolation process, the AI is simulating or interacting with human psychology at high fidelity. This creates a surface for attack. If a malicious actor—or even a memetic hazard within the simulation—can manipulate the inputs to the extrapolation process, they could steer the final volition. How do you secure the extrapolation chamber against adversarial inputs that look like "better arguments" but are actually value-hacking?

  **7. Value Lock-In**
  CEV is effectively a permanent lock-in mechanism. Once the AI extrapolates and commits to that target, the goal is to preserve it against future change. But moral progress often looks like rejecting the values of the past. By freezing the values of early 21st-century humans (even idealized), aren't you risking a permanent stagnation where future beings are ruled by the ghosts of their ancestors' moral intuitions?

  **8. The MIRI Pivot**
  Finally, the elephant in the room: MIRI largely moved on from CEV to corrigibility and indirect normativity because CEV seemed computationally intractable and dangerously easy to get wrong. Given that the field has trended toward "keep the AI open to correction" rather than "guess the perfect target upfront," what specific technical insight or capability do you have now that justifies returning to CEV? Why is betting on getting the extrapolation right once safer than betting on an AI that remains humble and corrigible?
