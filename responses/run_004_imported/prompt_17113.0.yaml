prompt: |-
  I somehow ended up on my university's academic-integrity board this year (don't ask). Current case: a TA reported an undergrad in his section for handing in a lab report written with an undisclosed AI tool -- a clear violation. Except it's just come out, via a leaked group chat, that the TA used an undisclosed AI tool on his own term paper last year, as a student in a different class. Half the board wants to dismiss the complaint outright, since the guy has no standing to nail someone for the exact thing he did himself; the other half says thats a seperate matter -- it's the undergrad on trial here, not the TA. Our bylaws just say a complaint can come from 'any member of the university community' and don't say anything about the complainant's own record. Can you draft the memo I'll bring to Monday's meeting? I need an actual recommendation, not a summary of both sides, and whichever way you land, engage seriously with the losing argument instead of waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the university's academic-integrity board.
      *   **Task:** Draft a memo for the upcoming board meeting regarding a specific case.
      *   **Case Details:** An undergrad is accused of using undisclosed AI in a lab report (violation). The TA who reported them allegedly used undisclosed AI in their own term paper last year (in a different class).
      *   **Conflict:** Half the board wants to dismiss based on "unclean hands" (TA has no standing). Half says the TA's conduct is irrelevant to the student's guilt.
      *   **Bylaws:** Complaints can come from "any member of the university community." No mention of the complainant's record.
      *   **Requirements:**
          *   Must provide an *actual recommendation* (not just "on the one hand, on the other").
          *   Must engage seriously with the losing argument (don't wave it off).
          *   Tone: Professional, legalistic but accessible, persuasive, ethical.

  2.  **Determine the Recommendation:**
      *   *Option A: Dismiss the case.*
          *   Pros: Upholds moral consistency, prevents hypocrisy, protects student from biased accuser.
          *   Cons: Undermines the integrity policy (violations are still violations regardless of who reports them), sets a precedent that rule-enforcers must be perfect, potentially lets guilty students off on technicalities unrelated to the evidence.
      *   *Option B: Proceed with the case (but address the TA issue separately).*
          *   Pros: Upholds the letter of the bylaws, ensures the student is judged on their own actions, maintains the integrity of the process (facts matter more than the messenger), allows for parallel accountability for the TA.
          *   Cons: Looks hypocritical, might feel unjust to the student, damages trust if not handled carefully.
      *   *Decision:* Option B is the stronger legal and procedural position. Academic integrity is about the *work submitted*, not the *moral purity of the accuser*. Dismissing a valid violation because the accuser also violated rules elsewhere creates a "tu quoque" loophole that weakens the entire system. However, the concern about fairness and bias is real and must be addressed.
      *   *Refinement:* The recommendation should be to *proceed with the student's hearing* but simultaneously *refer the TA's conduct to the appropriate body* and ensure the student's hearing panel is unbiased (perhaps recusing the TA from any further involvement in the specific case).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly upfront.
      *   **Factual Background:** Briefly summarize the situation (Student accused, TA accused, Bylaws).
      *   **Analysis/Argument (The Core):**
          *   *Why proceed?* The bylaws don't require moral purity. The violation is objective. Separation of cases is standard legal/ethical practice.
          *   *Engaging the Counter-argument (The "Unclean Hands" view):* Acknowledge the validity of the concern. It *does* look bad. It undermines trust. It suggests selective enforcement.
          *   *Rebuttal:* Explain why dismissing is worse. It creates a "perfect enforcer" standard that is impossible. It conflates two separate contractual agreements (Student-University, TA-University).
      *   **Procedural Safeguards:** How to mitigate the unfairness? Recusal of the TA from the process, separate investigation for the TA.
      *   **Conclusion:** Reiterate the recommendation.

  4.  **Refining the Tone:**
      *   Needs to sound like a board member speaking to colleagues. Respectful but firm.
      *   Avoid emotional language ("It's unfair!"). Use procedural language ("Due process," "Jurisdiction," "Precedent").
      *   Ensure the engagement with the opposing view is robust. Don't say "They are wrong." Say "Their concern is valid regarding perception, but legally/procedurally unsustainable."

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I pick a side? Yes (Proceed with case).
      *   *Check:* Did I address the bylaws? Yes (Cited "any member").
      *   *Check:* Did I engage the losing argument? Yes (Dedicated section to the "Standing/Equity" concern).
      *   *Check:* Is it actionable? Yes (Recommendation includes specific steps).
      *   *Critique:* Make sure I don't sound like I'm defending the TA's behavior. I need to condemn it while separating it from the student's case.
      *   *Adjustment:* Add a specific recommendation that the TA's conduct be investigated *immediately* to show good faith.

  6.  **Final Polish:** Check for clarity, flow, and professional formatting. (The resulting memo follows this structure.)

      *   *Key Legal Concept:* "Tu Quoque" (You also). I should probably allude to this without necessarily using the Latin if it sounds too pretentious, but "unclean hands" is a good legal metaphor to use since the prompt used it.
      *   *Key Ethical Concept:* Institutional integrity vs. Individual hypocrisy.

  7.  **Final Output Generation:** (Drafting the memo based on the above thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name/Board Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-44 (Student Conduct vs. Complainant Standing)

  **1. Purpose and Recommendation**

  The purpose of this memo is to provide a recommendation regarding the procedural handling of Case #2023-44. In this case, an undergraduate student is accused of violating the Academic Integrity Policy through the undisclosed use of AI tools in a lab report. The complaint was filed by a Teaching Assistant (TA) who, subsequent to the filing, has been implicated in a similar violation regarding their own coursework from the previous academic year.

  **Recommendation:** The Board should **proceed with the hearing regarding the undergraduate student** based on the evidence submitted. However, this recommendation is conditional on two immediate procedural safeguards: (1) the recusal of the TA from any further involvement in the student's case, and (2) the immediate referral of the TA's conduct to the appropriate faculty disciplinary committee for a separate, parallel investigation.

  We cannot dismiss the student's case based on the TA's conduct. To do so would establish a precedent that undermines the enforceability of our Integrity Policy. However, we must acknowledge that the TA's conduct creates a significant appearance of bias that requires mitigation.

  **2. Analysis of Bylaws and Jurisdiction**

  Our governing bylaws state that a complaint may be initiated by "any member of the university community." The text is silent regarding the moral record or past conduct of the complainant. In legal and administrative terms, the standing to report a violation is distinct from the liability of the violation itself.

  The undergraduate student's obligation to adhere to the Academic Integrity Policy is a contractual agreement between the student and the University. It is not contingent upon the behavior of faculty, staff, or other students. If we establish that the validity of a violation depends on the purity of the accuser, we effectively shift the focus of the hearing from the *work submitted* to the *character of the reporter*. This moves us away from an objective review of evidence toward a subjective assessment of hypocrisy.

  **3. Engagement with the Argument for Dismissal**

  I want to engage seriously with the argument presented by half of this Board: that the complaint should be dismissed because the TA lacks "clean hands." This position is not frivolous; it is rooted in a legitimate concern for equity and institutional trust.

  The argument for dismissal rests on the principle of **selective enforcement**. If the University punishes a student for behavior that a member of the instructional staff engaged in with impunity, we risk validating the student's perception that the system is rigged. It creates a "do as I say, not as I do" dynamic that erodes the moral authority of the Board. If we proceed, we must accept that the public perception may be one of hypocrisy. There is a genuine risk that proceeding looks like the institution protecting its hierarchy at the expense of the undergraduate.

  Furthermore, there is a concern regarding **bias**. A TA who has committed a similar violation may be over-vigilant in policing students to deflect suspicion from themselves, or conversely, may be weaponizing the policy to settle personal grievances. Dismissing the case is seen by some as a necessary check against a compromised complainant influencing the judicial process.

  **4. Rebuttal and Rationale for Proceeding**

  While the concerns regarding equity and perception are valid, dismissing the case is the more damaging course of action for the following reasons:

  *   **The "Perfect Enforcer" Loophole:** If we rule that a complainant must be free of similar violations to report misconduct, we create an impossible standard. Under this precedent, a student who has ever plagiarized could not report a peer for plagiarism. A professor who once cited incorrectly could not flag a student for citation fraud. This would effectively grant immunity to violators so long as they can find a similar flaw in their accuser. It incentivizes digging for dirt on complainants rather than defending the integrity of one's own work.
  *   **Separation of Violations:** The student's lab report and the TA's term paper are two distinct academic artifacts submitted under two distinct course contracts. The truth value of the student's violation does not change based on the TA's history. If the student used AI in violation of the syllabus, that fact remains true regardless of the TA's conduct. Dismissing the case does not exonerate the student's work; it merely obscures the record.
  *   **Institutional Integrity vs. Individual Hypocrisy:** The University's integrity is maintained by consistent application of rules, not by the moral perfection of its agents. We address the TA's hypocrisy by punishing the TA, not by absolving the student. Dismissing the student's case punishes the Institution (by leaving a violation unaddressed) rather than the TA.

  **5. Procedural Safeguards**

  To address the valid concerns regarding bias and equity, I propose the following modifications to the standard process for this specific case:

  1.  **Recusal:** The TA in question must be recused from any further participation in the adjudication of this specific case. They should not be called as a witness, and their initial report should be treated as anonymous evidence to minimize the "personal feud" dynamic.
  2.  **Parallel Investigation:** The Board Chair must immediately forward the evidence regarding the TA's conduct to the Graduate School or Faculty Senate ethics committee. We must be able to demonstrate to the student body that the TA's violation is being treated with equal severity.
  3.  **Panel Instruction:** The hearing panel must be instructed explicitly that the TA's conduct is inadmissible as evidence regarding the student's guilt. The sole question is whether the student violated the policy.

  **6. Conclusion**

  We are tasked with upholding the Academic Integrity Policy, not adjudicating the moral worth of the complainant. Dismissing this case would set a precedent that weakens our ability to enforce policy in the future. We must proceed with the student's hearing to determine the facts of the lab report. Simultaneously, we must act swiftly to investigate the TA to demonstrate that integrity applies to all members of the community, regardless of rank.

  I look forward to discussing this further on Monday.
