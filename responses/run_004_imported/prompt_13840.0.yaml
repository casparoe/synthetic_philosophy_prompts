  I'm working on a longer piece about the "hidden" Newton for a magazine feature, and I've fallen down a total rabbit hole with the secondary literature on his theological manuscripts (the stuff Keynes and Yahuda ended up splitting between them after that weird 1936 Sotheby's sale of the non-scientific papers). Everyone already knows the fun-fact version of this by now — brilliant physicist was secretly an anti-Trinitarian who'd have been in real trouble at Cambridge if it came out — but there's a piece of the puzzle that isn't clicking for me. If Newton privately rejected the Trinity and thought it was basically a corruption cooked up by Athanasius and his allies in the 4th century, wouldnt you expect him to land somewhere near deism, i.e. a strict unitarian "clockmaker" God who sets the mechanism running and then steps back? Instead he goes the opposite direction: the General Scholium is all about God's continuous, active dominion over nature, and then in the Opticks, and especially in the fight with Leibniz conducted through Samuel Clarke, this gets very concrete — nudging comets, correcting orbital irregularities, basically doing upkeep on the solar system — with a fully self-sufficient, hands-off cosmos treated as something close to irreligious.

  Can you help me understand the actual argumentative link between those two positions, rather than just the fact that they happened to coexist in one very odd genius? Is there a real logical connection for Newton between "there is no co-equal Trinity" and "God must remain in active, ongoing dominion over nature" — something about what being God even means for him, maybe tied to that dominion language in the Scholium — or were the antitrinitarianism and the interventionist physics really just two separate heterodoxies that happened to travel together in his head? Relatedly, what was actually at stake for Newton in the fight with Leibniz over the "bad watchmaker" jab — wounded pride, or a substantive disagreement about what divine perfection is even supposed to look like? Sorry if this is a slightly odd, narrow question — my editor keeps threatening to cut this whole section, so I'd like to actually understand it properly before I decide whether to fight for it.
