answer: |-
  This is an excellent question, and you are right to sense that the standard "fun fact" treatment (Newton = Secret Arian + Secret Alchemist) often fails to explain *why* these positions cohered in his mind. If you can articulate the logical bridge between them, you will absolutely save that section of your piece. In fact, modern scholarship (particularly Rob Iliffe, Stephen Snobelen, and J.E. McGuire) argues that these aren't separate heterodoxies but two pillars of a single, unified theological-physical system.

  The logical link you are looking for is **Sovereignty** (or *Dominion*), and the enemy on both fronts is **Idolatry**.

  Here is the argumentative structure you can use to show that Newton's anti-Trinitarianism and his interventionist physics were mutually reinforcing, not contradictory.

  ### 1. The Definition of God: *Pantokrator* vs. Co-Equality
  For Newton, the definition of God was not "First Cause" or "Prime Mover" in an abstract sense. It was **Lord**.

  In the *General Scholium*, Newton famously defines God not by his metaphysical attributes but by his dominion: *"God is a word relative to servants, and Deity is the dominion of God not over his own body... but over servants."*

  *   **The Trinitarian Problem:** To Newton, the Trinity was not just a mathematical error; it was a political usurpation. If the Son and Spirit are co-equal and co-eternal, dominion is divided. For Newton (following an Arian/Socinian reading of early church history), the Father alone is the *Pantokrator* (Almighty). The Son is a created vice-regent. To worship the Son as God was idolatry—worshipping a creature rather than the Creator.
  *   **The Deist Problem:** Deism posits a God who creates a self-sufficient system and retires. For Newton, this is also a violation of dominion. If the universe runs perfectly without God's ongoing will, then God is bound by the laws of nature. He becomes a prisoner of His own creation.

  **The Link:** Rejecting the Trinity preserves the **unity** of God's sovereignty (one Father, one Throne). Rejecting the Clockwork Universe preserves the **actuality** of God's sovereignty (He rules *now*, not just *then*). Both positions are required to maintain the status of God as an absolute, volitional King rather than a static essence or a retired engineer.

  ### 2. The Nature of Matter: Passive vs. Active
  This is where the physics ties in. Newton's matter is radically passive. It has no internal principle of motion.

  *   **Leibniz's View:** Matter has force (*vis viva*). The universe is a plenum of active substances. Therefore, a perfect God creates a system where these substances interact perfectly according to pre-established harmony. Intervention would be a glitch.
  *   **Newton's View:** Matter is inert. Gravity is not an inherent property of matter (he explicitly says this in the *General Scholium*). Gravity requires a cause. If that cause is mechanical, you get spiraling atoms and atheism (which he associated with Epicureanism). If that cause is God, then God must be *present* to sustain gravity.

  **The Link:** If Newton accepted the Trinity, he would be accepting a mediated creation (God creates through the Logos). If he accepted Deism, he would be accepting an autonomous creation. Both imply that the material world has some inherent stability or divinity of its own. By insisting on a Unitarian God *and* an interventionist physics, Newton ensures that **nature has no autonomy.** The solar system needs "upkeep" not because the design is flawed (Leibniz's "bad watchmaker" jab), but because the creation is fundamentally distinct from and dependent on the Creator. To say the machine runs itself is to attribute divine self-sufficiency to matter. That, for Newton, is the root of idolatry.

  ### 3. Providence and Prophecy: The Historical Stakes
  This is the piece often missing from pop-science accounts. Newton's theology was deeply prophetic. He spent more time on Daniel and Revelation than on optics.

  Newton believed the Trinity was a historical corruption introduced by Athanasius and the Church in the 4th century (the "Great Apostasy"). He believed true religion (the worship of the Father through the Son) would be restored in the end times.

  *   **Why a Deist God doesn't work here:** A clockmaker God does not care about idolatry. He does not intervene in history to correct false worship.
  *   **Why Newton's God does:** Newton's God is a jealous God. The corruption of doctrine was a cosmic crime. Therefore, Providence must be active in history to guide the restoration of true worship.

  **The Link:** The same God who nudges comets to recalibrate the solar system is the God who nudges history to recalibrate the Church. Both are acts of **Providence**. If you remove God's active hand from physics, you undermine the logic of His active hand in prophecy. Newton's "interventionism" is a unified theory of divine will operating on both matter and history.

  ### 4. The Leibniz/Clarke Correspondence: What Was at Stake?
  Regarding your second question: The fight with Leibniz was absolutely substantive, not just wounded pride. It was a clash between **Rationalism** (Leibniz) and **Voluntarism** (Newton).

  *   **Leibniz:** God is bound by the Principle of Sufficient Reason. He must do the *best* possible thing. A perfect watch implies no need for repair. Intervention implies imperfection in the design or the Designer.
  *   **Newton/Clarke:** God is bound by nothing, not even logic or "perfection" as defined by humans. His Will is the ultimate standard. If He wills to intervene, that is perfect *because* He willed it.

  When Leibniz called Newton's God a "bad watchmaker," he was attacking the idea that God's will is superior to mechanical necessity. Newton saw Leibniz's "perfect clockwork" as a form of fate that stripped God of His liberty.

  **The Argument for your Editor:**
  The stake was the **reality of miracles.** If Leibniz is right, and the universe is a closed causal loop of pre-established harmony, then miracles (in physics or scripture) are impossible violations of rational order. If Newton is right, the universe is contingent on God's will, so miracles are simply God exercising His normal dominion in an exceptional way. Newton was fighting to save the possibility of Revelation itself.

  ### Summary for the Feature
  You can frame it like this:

  Newton wasn't a Deist hiding in the shadows; he was a **Voluntarist Theist** shouting from the rooftops (in code).
  1.  **Anti-Trinitarianism** secured the *Unity* of God's Dominion (One King, not three).
  2.  **Interventionist Physics** secured the *Reality* of God's Dominion (A Ruling King, not a figurehead).
  3.  **The Enemy** was anything that granted autonomy to the creation—whether that was the "co-equal" Son (granting autonomy to a person) or the "self-running" universe (granting autonomy to matter).

  Both heterodoxies stem from a single, terrifying conviction: **God must be God, and nothing else can be.**

  ### Recommended Sources for Verification
  To bolster this for your editor, you can reference:
  *   **Rob Iliffe, *Priest of Nature* (2017):** The definitive modern biography. He explicitly connects Newton's church history research with his natural philosophy.
  *   **Stephen Snobelen:** Look for his essays on "Newton and Prophecy" or "God of Dominion." He argues that for Newton, natural philosophy was a form of worship.
  *   **J.E. McGuire, "Newton on Place, Time, and God" (1978):** Classic paper on how Newton's concept of space (God's sensorium) requires God's immediate presence.
  *   **The Clarke-Leibniz Correspondence (1715-1716):** Specifically Clarke's 4th and 5th replies, which articulate the Newtonian view that space and time are attributes of God's existence, requiring His continuous presence.

  If your editor cuts this, they are cutting the engine of Newton's thought. The science wasn't a separate hobby from the theology; the science was the *proof* of the theology.
