      *   **Topic:** The relationship between David Lewis's Counterfactual Theory of Causation and James Woodward's Interventionist (Manipulability) Theory.
      *   **Core Puzzle:** Both use counterfactuals, but Lewis aims for reductive analysis (grounded in similarity of worlds, no causal primitives), while Woodward uses "interventions" (which seem causal).
      *   **Specific Questions:**
          1.  Is the difference in reductive ambition the *deepest* divide?
          2.  Is Woodward's reliance on "intervention" circular/vicious?
          3.  Can a non-reductive theory still be philosophically successful/useful?

  2.  **Deconstruct the Theories:**
      *   **Lewis (1973, 1986, 2000):**
          *   Goal: Analyze causation in terms of counterfactual dependence.
          *   Goal: Analyze counterfactuals in terms of similarity between possible worlds.
          *   Constraint: The similarity metric must *not* presuppose causal facts (to avoid circularity).
          *   Problem: Preemption, overdetermination, transitivity issues.
      *   **Woodward (2003, *Making Things Happen*):**
          *   Goal: Explain what causal claims *mean* and how we test them.
          *   Mechanism: Invariance under intervention.
          *   Definition: $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$.
          *   Constraint: "Intervention" is defined structurally (breaking arrows), but is it causal?
          *   Stance: Anti-reductive, pragmatic, functionalist.

  3.  **Address Question 1: Is reductive ambition the deepest divide?**
      *   *Initial thought:* Yes, it's a major difference. Lewis wants to know "what causation *is*" (metaphysics). Woodward wants to know "how we *use* causal claims" (methodology/semantics).
      *   *Nuance:* It's not just about reduction. It's about the *purpose* of the theory. Lewis is doing Humean metaphysics. Woodward is doing scientific explication.
      *   *Key Distinction:* Lewis focuses on *token* causation (specific events $c$ caused $e$). Woodward focuses on *type* causation (variables $X$ cause $Y$). This is crucial for an economist.
      *   *Counterfactual Semantics:* Lewis uses possible worlds semantics. Woodward uses structural equation models (SEMs) / DAGs semantics. The "counterfactuals" are generated differently.

  4.  **Address Question 2: Is Woodward's account circular?**
      *   *The Charge:* "Intervention" is defined as an exogenous change that doesn't affect other causes. Isn't "exogenous" or "cause" presupposed?
      *   *Woodward's Defense:* It's not *viciously* circular. It's a network of concepts. We understand intervention in terms of manipulation, and manipulation in terms of causation, but the goal isn't reduction to non-causal terms. It's clarification within the causal network.
      *   *Technical Defense:* In SEMs, an intervention is a mathematical operation ($do(X=x)$). It's defined by graph surgery. Does the graph presuppose causality? Yes. But Woodward admits this. He argues we don't need to reduce causality to non-causal terms to make progress.
      *   *Comparison:* Lewis tries to reduce $A \to B$ to non-causal similarity. Woodward tries to reduce $X \to Y$ to invariance under $do(\cdot)$.

  5.  **Address Question 3: Can non-reductive theories be successful?**
      *   *Philosophical Landscape:* Yes. Many contemporary philosophers (Cartwright, Hausman, Pearl to an extent) accept non-reductive accounts.
      *   *Utility:* For an economist, the non-reductive account is often *more* useful. We care about identification and policy, not the metaphysical essence of causation.
      *   *Success Criteria:* Success isn't avoiding circularity at all costs; it's providing clarity, distinguishing good from bad causal claims, and guiding empirical practice.

  6.  **Synthesize for an Economist:**
      *   Connect Lewis to the "Potential Outcomes" framework (Rubin). Rubin is closer to Lewis (counterfactuals as primitive or defined via assignment).
      *   Connect Woodward to the "Structural Causal Model" framework (Pearl). Pearl explicitly defines interventions ($do$-operator).
