      *   **User's Interpretation:** Arendt distinguishes "rational truths" (math, logic, philosophy) from "factual truths" (contingent events). The user infers that because factual truths are contingent/weak (based on testimony), Arendt must view lying about facts as a *minor* offense compared to corrupting rational/scientific truths.
      *   **Question:** Have I understood her correctly, or am I missing something?

  2.  **Evaluate the User's Interpretation against Arendt's Text:**
