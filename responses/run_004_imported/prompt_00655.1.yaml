prompt: |-
  I've been going down a rabbit hole of AI safety posts (LessWrong, Alignment Forum type stuff) and keep running into "coherence arguments" as the reason to expect advanced AI to end up as expected utility maximizers -- basically, if your preferences can't be described as maximizing some utility function, someone can Dutch-book / money-pump you out of all your stuff, so any sufficiently capable, self-improving agent will get squeezed into being coherent whether it wants to or not.

  Someone in my study group used this to argue that the whole corrigibility research agenda (building AI that will actually let you shut it down or correct it) is basically a waste of time: if coherence is mathematically forced onto any smart enough system, it'll always resist having its goals edited or being switched off, since thats instrumentally bad for whatever its maximizing. So on his view alignment just reduces to picking the exactly correct utility function from the start, full stop, and all the corrigibility stuff is basically pointless. It sounded pretty convincing when he said it but also kind of too clean and fatalistic. Is that actually what the coherence theorems show, or is he overselling them?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user has been reading AI safety literature (LessWrong, Alignment Forum) and encountered "coherence arguments" (VNM utility theorem, Dutch booking, money pumping).
      *   **The Claim:** A study group member argues that coherence theorems *force* advanced AI to become expected utility (EU) maximizers. Therefore, such AI will necessarily resist shutdown/correction (instrumental convergence). Thus, corrigibility research is a waste of time; alignment is just about getting the utility function right initially.
      *   **The User's Intuition:** It sounded convincing but also "too clean and fatalistic."
      *   **The Question:** Is this what coherence theorems actually show, or is the study group member overselling them?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Coherence Theorems:* Do they imply agents *must* be EU maximizers? Not exactly. They say if you want to avoid certain vulnerabilities (Dutch books), you should act *as if* you are maximizing utility. But this assumes the agent cares about avoiding those vulnerabilities in a specific way.
      *   *Self-Modification:* Will agents self-modify into EU maximizers? Maybe, but not necessarily. There are trade-offs (computational cost, robustness, etc.).
      *   *Corrigibility:* Is corrigibility incompatible with EU maximization? Not strictly. An EU maximizer *can* have a utility function that values being shut down under certain conditions. The problem is *stability* of that value under self-improvement.
      *   *The "Waste of Time" Claim:* This is the strongest claim to evaluate. Most AI safety researchers (including those who take coherence seriously) do *not* think corrigibility is a waste of time. In fact, many think getting the utility function "exactly right from the start" is impossible, making corrigibility essential.
      *   *Key Nuance:* The coherence argument is a *pressure*, not a *law of physics*. It's about selection pressure, not mathematical inevitability for every specific architecture.

  3.  **Structure the Response:**
      *   **Validate the User:** Acknowledge that their intuition ("too clean and fatalistic") is correct. The study group member is oversimplifying.
      *   **Explain Coherence Arguments Properly:** What do they actually say? (Avoiding dominated strategies). Distinguish between "acting as if" and "internal architecture."
      *   **Address the "Forced to be EU Maximizer" Claim:**
          *   Bounded rationality (computation is expensive).
          *   Representation matters (policies vs. preferences).
          *   Selection pressure vs. internal logic.
      *   **Address the "Corrigibility is Impossible" Claim:**
          *   Corrigibility *can* be part of a utility function (e.g., "do what I want, including letting me turn you off").
          *   The real problem is *stability* (instrumental convergence), not logical impossibility.
          *   Uncertainty about preferences (IRL/Cooperative IRL) offers a path to corrigibility even for EU maximizers.
      *   **Address the "Just Get the Utility Function Right" Claim:**
          *   This is the "Value Loading Problem." It's incredibly hard.
          *   If we could do this perfectly, we wouldn't need safety research.
          *   Corrigibility is a backup for when we *don't* get it right.
      *   **Conclusion:** Summarize why the study group member is wrong (or at least, why the consensus disagrees).

  4.  **Drafting the Content (Iterative refinement):**

      *   *Coherence Theorems:* Need to mention VNM (Von Neumann-Morgenstern). But emphasize that real agents aren't idealized mathematical entities. They have computational limits. A money pump requires a specific sequence of opportunities; an agent might just use heuristics that are "good enough."
      *   *The "Pressure" Argument:* It's true there is pressure to become coherent. But does that pressure lead to *shutdown resistance*? Only if the goal is static. If the goal includes "listen to the operator," then shutdown isn't resisted.
      *   *Corrigibility:* Define it. It's not just "let me shut you down." It's "let me fix your goals." An EU maximizer can value this *if* it is uncertain about the true utility function. This is a crucial point (Uncertainty -> Corrigibility).
      *   *The "Waste of Time" verdict:* This is the most dangerous idea. If we believe alignment is impossible unless we get it perfect on try #1, we are doomed. Corrigibility is about increasing the margin of error.
      *   *References:* Mention Soares/Christiano (MIRI/CHAI views). Mention the "Orthogonality Thesis" (goals and intelligence are independent). Mention "Instrumental Convergence" (why shutdown resistance happens usually).

  5.  **Refining the Tone:**
      *   Keep it respectful to the study group member (these are common arguments) but firm on the technical inaccuracies.
      *   Avoid jargon where possible, or explain it (e.g., "Pareto dominance," "Bayesian uncertainty").
      *   Ensure the distinction between *logical impossibility* and *engineering difficulty* is clear.

  6.  **Self-Correction/Edge Case Check:**
      *   *Did I dismiss coherence too much?* No, acknowledge it's a strong argument for *why* agents might become goal-directed. But deny it forces *specific* goal contents (like self-preservation).
      *   *Is corrigibility actually possible?* It's an open research problem. I shouldn't say "Yes, it's easy." I should say "It's not logically ruled out, and there are promising avenues (like uncertainty)."
      *   *What about the "Grim Reapers" argument?* (If you aren't coherent, you lose resources). Acknowledge this but point out that "coherent" doesn't mean "single static utility function over universe histories." It could be a utility function over policies that includes deference.

  7.  **Final Polish:** (Reviewing against the prompt's specific points).
      *   User asked: "Is that actually what the coherence theorems show?" -> No.
