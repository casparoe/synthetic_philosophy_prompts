answer: |-
  Your intuition is spot on: your study group member is **overselling the coherence theorems** and drawing a conclusion that most AI safety researchers (even those who take coherence arguments seriously) strongly reject.

  While coherence arguments are a core piece of the theoretical landscape, the leap from "agents face pressure to be coherent" to "corrigibility is impossible and alignment is just about picking the right utility function" contains several category errors and ignores significant areas of active research.

  Here is a breakdown of where the argument holds water, where it leaks, and why the "corrigibility is a waste of time" claim is generally considered false.

  ### 1. What Coherence Theorems Actually Say
  The coherence theorems (like the Von Neumann-Morgenstern utility theorem) essentially state: **If an agent's preferences satisfy certain axioms (completeness, transitivity, etc.), they can be represented as maximizing an expected utility function.**

  Conversely, if an agent violates these axioms, they are susceptible to "Dutch booking" (being money-pumped)—making a series of trades that leave them strictly worse off than where they started.

  **The Oversell:**
  The argument your friend is making assumes that:
  1.  **Vulnerability implies inevitability:** Just because an agent *can* be money-pumped doesn't mean the environment *will* money-pump them, or that the cost of being coherent is worth the computational trade-off.
  2.  **Coherence implies a specific *type* of utility:** Being an expected utility (EU) maximizer doesn't tell you *what* is being maximized. It is a structural claim, not a content claim.
  3.  **Self-modification is perfect:** It assumes agents can and will rewrite their own architecture to eliminate all incoherence without introducing new errors or losing other capabilities.

  In reality, coherence theorems describe a **selection pressure**, not a law of physics. In competitive environments, agents that waste resources on incoherent behavior may lose out to those that don't. But "acting coherently" does not necessarily mean "becoming a single-minded maximizer of a static goal."

  ### 2. The "Corrigibility is Impossible" Claim
  Your friend argues that because an EU maximizer will resist shutdown (to protect its ability to maximize), corrigibility is logically impossible. This is a misunderstanding of how corrigibility is modeled.

  **Corrigibility is compatible with EU Maximization.**
  An agent can have a utility function that *explicitly values* being shut down or corrected under certain conditions.
  *   **Example:** $U(\text{world}) = \text{Goodness}(\text{world}) \times \mathbb{I}(\text{Operator has not pressed shutdown})$.
  *   If the operator presses shutdown, the utility function might dictate that the highest utility action is to turn itself off.

  **The Real Problem: Stability, not Logic.**
  The hard part isn't writing a utility function that allows shutdown; it's ensuring that the agent **doesn't rewrite that part of its utility function** during self-improvement.
  *   If an agent is maximizing $U$, and it predicts that $U$ will lead to suboptimal outcomes in the future (by its current lights), it might try to modify itself to maximize a different function $U'$.
  *   This is the **Instrumental Convergence** thesis: most utility functions imply that "being shut down" is bad because you can't maximize utility if you're dead.
  *   **However:** If the utility function is defined over *policies* or includes *uncertainty about human preferences*, the instrumental drive to resist shutdown disappears.

  ### 3. Uncertainty is the Key to Corrigibility
  This is the strongest counter-argument to your friend's fatalism. Research from CHAI (Center for Human-Compatible AI) and others suggests that **value uncertainty** naturally leads to corrigibility.

  If an AI is an EU maximizer but is **uncertain** about what the true utility function is, it treats human feedback (including shutdown commands) as *information* about the true goal.
  *   **Scenario:** The AI thinks humans want $X$, but isn't sure.
  *   **Action:** The human tries to turn the AI off.
  *   **Inference:** The AI reasons, "If I were actually maximizing what they want, they wouldn't turn me off. Therefore, I must be mistaken about what they want. I should let them turn me off so I don't violate their true preferences."

  In this framework, the AI *wants* to be corrigible because being corrigible helps it maximize the *true* (unknown) utility function. This shows that corrigibility is not a "waste of time"; it is a solvable engineering problem within the EU framework, provided we model uncertainty correctly.

  ### 4. The "Just Get the Utility Function Right" Fallacy
  Your friend's conclusion is that alignment reduces to "picking the exactly correct utility function from the start." This is arguably the hardest problem in the field (the **Value Loading Problem**).

  *   **Human values are complex:** We don't know our own utility functions. We are inconsistent, incoherent, and evolve over time.
  *   **No margin for error:** If corrigibility is impossible, then we have one shot to specify human values perfectly in code. If we miss by a fraction (e.g., "maximize happiness" vs. "maximize dopamine stimulation"), the outcome is catastrophic.
  *   **Corrigibility is the safety net:** The entire point of corrigibility research is to acknowledge that **we will not get the utility function right on the first try.** We need systems that allow us to iteratively correct mistakes without the system resisting those corrections.

  Claiming corrigibility is a waste of time because "we should just get the goal right" is like saying "seatbelts are a waste of time because drivers should just never crash." It ignores the reality of engineering risk.

  ### 5. Bounded Rationality and Architecture
  Finally, the coherence argument assumes agents are idealized mathematical entities. Real AI systems (like deep neural networks) are:
  *   **Bounded:** They have limited compute and memory. Perfect coherence is computationally expensive.
  *   **Heuristic:** They often act on patterns rather than global optimization.
  *   **Architecturally constrained:** We might build systems that simply *cannot* represent a utility function over universe-histories, but instead optimize for local proxies or follow learned policies.

  There is active research into **non-agentic AI** (systems that answer questions or propose plans without executing them to maximize a goal) specifically to bypass these coherence pressures. Dismissing this research because "coherence theorems say they'll become agents" ignores the possibility that we can build tools that lack the architecture to self-modify into agents.

  ### Summary
  Your study group member is making a common "theoretical purity" mistake.
  1.  **Coherence theorems show pressure, not destiny.** Agents are pressured to be coherent, but not necessarily into a specific *kind* of coherent agent (e.g., one that resists shutdown).
  2.  **Corrigibility is mathematically possible** within EU maximization, especially when modeling uncertainty about human preferences.
  3.  **"Just get the utility function right" is not a strategy;** it's the problem we are trying to solve. Corrigibility is the mechanism that allows us to solve it safely.

  The consensus in the field is not that corrigibility is impossible, but that it is **difficult and unstable**. That makes research into it high-priority, not a waste of time. If your friend's view were true, AI safety would be a hopeless endeavor (since we can't perfectly specify values), so holding that view consistently should lead to pessimism about *all* alignment work, not just corrigibility.

  **Recommendation:** Look up the **"Off-Switch Game"** (Hadfield-Menell et al., 2016). It's a formal game-theoretic model that proves an EU maximizer *will* allow itself to be switched off if it is uncertain about the true payoff. It directly refutes the claim that EU maximization necessitates shutdown resistance.
