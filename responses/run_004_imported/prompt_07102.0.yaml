      *   **The Cracks in the Wall (Sen & Hausman):** The welfare problem. If preference = choice, we can't criticize bad choices (addiction, coercion). The prediction problem. If preferences aren't stable mental states, how do we predict out-of-sample behavior?
      *   **The AI Alignment Stakes:** This is crucial for *this* user. If we tell AI researchers "utility is just consistent behavior," they might think they don't need to specify goals carefully. But if utility is just a fit to past data, it doesn't guide future design. The "orthogonality thesis" requires utility to be a distinct input, not an output description.
