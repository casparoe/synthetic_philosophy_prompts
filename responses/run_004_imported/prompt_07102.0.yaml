answer: |-
  # The Tautology Trap: Why Utility Cannot Be Just Behavior

  You have stumbled onto the open secret of modern economics and AI theory. The intuition nagging at you is correct: if "preference" is defined strictly as "revealed choice," then the statement "agents maximize utility" is indeed a tautology. It means nothing more than "agents do what they do."

  For decades, a powerful faction of economists, led by Paul Samuelson and later defended by theorists like Faruk Gul and Wolfgang Pesendorfer, argued that this emptiness is a feature, not a bug. They claimed that by stripping "utility" of psychological content, economics becomes a hard science, free from the messiness of introspection.

  However, this defense comes at a catastrophic cost. By insulating the theory from empirical refutation, the behaviorist definition renders utility incapable of doing the heavy lifting we require of it—whether that is assessing human welfare or aligning artificial intelligence.

  While the revealed preference framework is mathematically elegant, **the verdict must be that utility, to be meaningful for prediction and normativity, must represent something beyond a redescription of behavior.** The Gul & Pesendorfer position is logically consistent but pragmatically bankrupt. Amartya Sen and Daniel Hausman are right: without independent psychological or structural content, "utility" is a hollow shell that collapses under the weight of welfare economics and AI safety.

  ### The Behaviorist Fortress

  To understand why economists backed themselves into this corner, you have to look at the 1930s. Early neoclassical economics relied on "cardinal utility"—the idea that happiness could be measured in units (utils). This was scientifically embarrassing. How do you measure a util? Is my util the same as yours?

  Paul Samuelson's Revealed Preference Theory (RPT) was a rescue mission. He proposed that we don't need to know what's in an agent's head. We only need to observe their choices. If an agent chooses Bundle A over Bundle B when both are affordable, they have "revealed" a preference for A.

  This culminated in results like **Afriat's Theorem** (1967), which is the mathematical crown jewel of this approach. Afriat proved that if a set of observed choices satisfies a consistency condition (the Generalized Axiom of Revealed Preference, or GARP), there *must* exist a utility function that could have generated those choices.

  This is where Gul and Pesendorfer dig in. In their 2008 paper *"The Case for Mindless Economics,"* they argue that economics should not be in the business of psychology. If the goal is to predict market behavior, internal states are "mind stuff"—unobservable and unnecessary. As long as choices are consistent, the utility function exists as a mathematical representation.

  From this viewpoint, the tautology charge is irrelevant. Yes, "utility maximization" is true by definition, but the *constraints* on utility (transitivity, completeness, continuity) are empirical. We aren't testing if agents maximize utility; we are testing if their choices are consistent. If they violate GARP, the model breaks.

  ### The Cracks in the Wall

  The behaviorist fortress is sturdy, but it has no windows. You cannot see out, and no light can get in. This creates two fatal problems: the **Welfare Problem** and the **Prediction Problem**.

  **1. The Welfare Problem (Sen & Hausman)**
  If preference is just choice, welfare economics loses its moral compass. Standard economics assumes that if you choose X over Y, you are better off with X. This is the bridge from "is" to "ought."

  But as Amartya Sen famously pointed out, people choose things that make them worse off. An addict chooses heroin. A coerced worker chooses a dangerous job over starvation. A depressed person may choose isolation. If "preference" is defined solely by the choice itself, we cannot say the addict is harming themselves. To say "they preferred the heroin" is just to say "they chose the heroin." The concept of "harm" vanishes.

  Daniel Hausman extended this, arguing that for economics to be about *well-being*, preferences must track *judgments of value*. If utility is just a behavioral shadow, it cannot distinguish between a choice made out of enlightenment and a choice made out of ignorance or compulsion. The behaviorist view protects the theory from being wrong, but only by making it incapable of saying anything right about human welfare.

  **2. The Prediction Problem**
  The second failure is predictive power. In AI alignment, we care about utility functions because we want to predict what an agent will do in *novel* situations.

  If utility is just a fit to past behavior (a la Afriat), it has no out-of-sample power. Imagine you observe an AI taking the path of least resistance in a training environment. A behaviorist says, "Its utility function values ease." But if you deploy that AI in the real world, where "ease" might mean disabling its own off-switch, you need to know if it values *ease* or *task completion*.

  If utility is merely a redescription of past choices, you cannot distinguish between these two hypotheses. Both are consistent with the past data. To predict future behavior in a new context, you need to posit a stable, internal causal structure—a "goal" that exists independently of the specific actions taken so far. The behaviorist view denies you this leverage.

  ### The AI Alignment Stakes

  This is not just academic pedantry; it is central to the AI safety concerns that led you down this rabbit hole.

  In AI alignment, when we speak of a "utility function," we are talking about an **objective function**—code that evaluates states of the world. This is a causal mechanism, not a behavioral description. However, many alignment discussions slip into the economic tautology. They argue, "Any agent can be modeled as an expected utility maximizer," citing the Von Neumann-Morgenstern theorem or similar coherence arguments.

  If you accept the Gul & Pesendorfer view, this statement is vacuous. It means: "If the AI's behavior is consistent, we can draw a curve around it." This is dangerous. It suggests that "goal-directedness" is inevitable for any coherent agent. But if "goal-directedness" is just a label for consistency, it doesn't imply the AI will actively resist shutdown, acquire resources, or pursue instrumental subgoals. Those are specific psychological (or computational) tendencies, not logical necessities of consistency.

  By treating utility as a tautology, alignment researchers risk confusing *descriptive modeling* with *prescriptive design*. You cannot align an AI by fitting a utility function to its behavior after the fact. You must specify the utility function *beforehand* as an independent constraint. If utility is just "whatever the AI does," then "aligning the utility function" means "making the AI do what we want," which is the problem itself, not the solution.

  ### The Verdict

  So, where do we land?

  The behaviorists are right that we cannot directly observe utility. They are right that imposing psychological constraints can make models messy. But they are wrong to conclude that utility *is* nothing but behavior.

  **Utility must be treated as a latent variable.**

  In science, we routinely posit unobservable entities (electrons, gravity, genes) because they explain observable patterns and predict new ones. We do not define "gravity" as "things falling." We define it as a force that *causes* things to fall, which allows us to predict how things will fall in new contexts.

  Utility must be the same. It must represent a stable, internal ordering of states—a computational or psychological structure—that *causes* the choices.
  *   **Against Gul & Pesendorfer:** If utility is just behavior, it cannot explain *why* behavior changes when context shifts (framing effects, addiction, learning). It cannot support welfare claims. It cannot guide AI design.
  *   **For Sen & Hausman:** Utility must track something like "judgments of value" or "goal structures" to be normatively and predictively useful.

  The tautological definition is a defensive crouch. It protects economic theory from being falsified by inconsistent human behavior, but only by sacrificing its ability to explain that behavior. In the context of AI alignment, where we are trying to *build* the utility function rather than *infer* it, the tautology is worse than useless—it is a category error.

  **The Final Word:**
  Utility is not a shadow cast by behavior; it is the engine driving it. If we strip it of all content beyond "consistent choice," we retain a mathematically pristine corpse of a theory that cannot tell us what agents *will* do in new worlds, nor whether what they do is *good*. The rabbit hole ends here: Utility is real only insofar as it constrains behavior, not merely describes it. To treat it otherwise is to confuse the map for the territory, and in AI safety, that confusion is fatal.
