prompt: |-
  Quick one for a side project -- I'm working on a piece about scientists and mathematicians who had surprisingly rigorous private metaphysical beliefs, and I keep circling back to Gödel. Everyone always brings up his ontological proof of God, but theres this other, way less-discussed argument he made in letters to his mother for why there has to be an afterlife -- roughly: the world is rationally ordered (basically his own spin on the principle of sufficient reason), human beings never come close to realizing their full intellectual and personal potential in one lifetime, and a genuinely rational, meaningful world just wouldn't let that potential go to waste -- so there must be a next life where it gets finished off. Can you write me an essay that takes this seriously as an actual philosophical argument rather than just a fun footnote? Lay out the strongest version of it, throw the best objections you've got at it, and then actually tell me if it holds up. No wishy-washy "both sides have a point" -- I want a real verdict.
