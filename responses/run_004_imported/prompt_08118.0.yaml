prompt: |-
  So I went down a rabbit hole on Ian Hacking's 'looping effects' idea from philosophy of psychiatry — basically the claim that slotting people into a diagnostic category can change the people themselves, which then feeds back and changes the category. On first pass it just sounds like a fancier way of saying 'self-fulfilling prophecy,' or maybe Goodhart's law applied to diagnoses (the category becomes a target and stops measuring what it used to). But I get the feeling Hacking thinks theres something more specific and mechanistic going on than just 'people conform to labels.' Can you explain what the actual extra ingredient is that makes looping different from a plain self-fulfilling prophecy, using his multiple personality disorder case as the concrete example? Not looking for the wiki-level summary, i want the actual gears of why the category itself is supposed to move, not just why people's behavior does.
