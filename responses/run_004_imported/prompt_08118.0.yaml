          *   *Phase 3:* Patients produce *new* symptoms that fit the framework but exceed the original definition (more alters, more complex narratives).
          *   *Phase 4:* Doctors update the DSM/manual to include these new symptoms.
          *   *Result:* The 1990s MPD patient is *ontologically different* from the 1890s hysteria patient, not just behaving differently.
      *   **Contrast with Self-Fulfilling Prophecy:**
          *   SFP: The prediction comes true, but the *terms* stay static. (Bank run: "The bank is insolvent" -> Bank becomes insolvent. Insolvency doesn't change definition).
