answer: |-
  **Title:** Truth Without Triviality: A Defense of Trivalent Conditionals

  **Introduction**
  David Lewis's 1976 triviality result is often treated as the death knell for truth-conditional accounts of indicative conditionals. By demonstrating that the intuitive link between conditionals and conditional probability—Adams's Thesis, or "the Equation" ($P(A \to B) = P(B|A)$)—is incompatible with the assumption that conditionals express classical propositions, Lewis forced a dilemma: abandon the Equation or abandon truth conditions. Lewis and his successors, most notably Dorothy Edgington, chose the latter, arguing for a suppositional or non-cognitivist account where conditionals express no proposition at all. However, this conclusion rests on a hidden assumption: that truth conditions must be bivalent. This paper argues that Lewis's result successfully rules out *classical* truth conditions, but not truth conditions *simpliciter*. By adopting a trivalent semantics in the tradition of de Finetti and Reichenbach, recently revived by scholars like Daniel Rothschild, we can preserve the truth-conditional status of indicatives without succumbing to triviality. The upshot of Lewis's theorem is not that conditionals lack truth values, but that their truth values are partial.

  **The Force of the Triviality Result**
  To appreciate the escape route, we must first acknowledge the strength of the trap. Lewis's argument assumes that the conditional $A \to B$ expresses a proposition $X$ that is true or false at every world in the probability space. If the Equation holds universally, then for any probability function $P$ in a class closed under conditionalization, $P(X) = P(B|A)$.

  Lewis utilizes the Law of Total Probability to show that $P(X) = P(X|A)P(A) + P(X|\neg A)P(\neg A)$. Given the Equation, if $A$ is true, the probability of the conditional should be 1 (since $P(B|A \land A) = P(B|A)$). If $A$ is false, the probability of the conditional should remain $P(B|A)$. Substituting these values leads to the result that $P(B|A) = P(B)$, implying probabilistic independence between antecedent and consequent. Since we know antecedents and consequents are not generally independent, the initial assumptions must be false. Lewis concluded that the assumption failing is that $A \to B$ expresses a proposition $X$ suitable for standard probability theory.

  **The Non-Cognitivist Retreat**
  The standard response, championed by Lewis and Edgington, is to deny that indicatives express propositions. On this view, uttering "If it rains, the match is cancelled" is not describing a state of affairs but rather expressing a constraint on one's credal state: a disposition to believe the consequent upon learning the antecedent. This view respects the Equation perfectly because it treats the Equation as a normative rule for assertion rather than a description of truth conditions.

  However, this retreat comes at a steep semantic cost. The primary objection is the problem of embedding. We routinely embed conditionals in belief reports ("Alice believes that if it rains, the match is cancelled"), disjunctions ("Either if it rains the match is cancelled, or if it snows..."), and negations. Non-cognitivism struggles to explain the truth conditions of these complex sentences. If "if $A, B$" has no truth value, what does Alice believe? What makes the disjunction true? While pragmatic workarounds exist, they often feel like patches on a broken engine. If our best semantic theory cannot account for the syntactic behavior of the construct, we should hesitate before abandoning truth conditions entirely.

  **The Trivalent Rescue**
  A more promising path retains truth conditions but rejects bivalence. This approach traces back to de Finetti's "logic of the third value." In this framework, a conditional $A \to B$ is true if $A$ and $B$ are true, false if $A$ is true and $B$ is false, and *void* (or undefined) if $A$ is false.

  This semantics blocks Lewis's triviality proof at its root. Lewis's derivation relies on the classical Law of Total Probability, which sums over the partition $\{A, \neg A\}$. In a trivalent semantics, the proposition expressed by $A \to B$ does not have a truth value in $\neg A$ worlds. Therefore, one cannot simply sum the probabilities of the conditional being true across the classical partition in the way Lewis requires. Instead, probability is defined over the trivalent space (often using the notion of "conditional event" probability). On this model, the Equation $P(A \to B) = P(B|A)$ holds by definition, not as a contingent constraint on a classical proposition.

  Recent work by Rothschild has shown that trivalent semantics can be integrated into a broader compositional framework that handles the embedding problems that plague non-cognitivism. By treating the third value as a gap that projects through logical operators in specific ways, we can maintain that conditionals contribute to the truth conditions of complex sentences without collapsing into triviality.

  **Verdict: Partial Truth Conditions**
  So, do indicative conditionals have truth conditions? The verdict is **yes**, but they are not the classical truth conditions assumed by Lewis.

  Lewis's triviality result is mathematically sound, but its philosophical moral is often overstated. It proves that conditionals cannot be *classical bivalent* propositions if we wish to preserve the Equation. It does not prove they cannot be propositions *at all*. The non-cognitivist accepts the math and abandons propositions; the trivalentist accepts the math and abandons bivalence.

  We should prefer the trivalentist solution. The cost of adopting a three-valued logic is far lower than the cost of abandoning truth conditions for a fundamental linguistic construct. Non-cognitivism forces us to treat the embedding of conditionals as a systematic semantic illusion, whereas trivalence treats it as a feature of a richer logical space. Lewis was right that the classical picture is untenable, but he was wrong to think the classical picture was the only truth-conditional game in town. The upshot of the triviality result is not the end of truth-conditional semantics for conditionals, but the beginning of a more nuanced, partial truth-conditional semantics. We can have truth without triviality, provided we accept that some truths are void.
