          *   Why? Because the constraint $p_{NE} = 3 p_{SE}$ makes the East side "more structured" (lower entropy locally) than the West side. To maximize *global* entropy, the distribution shifts mass toward the less structured region (West) to compensate.
          *   Calculation check:
