          *   $q_{SW} = 0.25$
          *   $q_{SE} = 0.25$

      *   **Constraint:**
          *   $p_{NE} / (p_{NE} + p_{SE}) = 0.75$ (Since $p_{NE} = 3 p_{SE}$)
          *   Or: $p_{NE} = 3 p_{SE}$

      *   **Method 1: Minimum Cross-Entropy (MinXent) / I-Projection**
          *   Minimize $D_{KL}(P || Q) = \sum p_i \ln(p_i / q_i)$ subject to $\sum p_i = 1$ and $p_{NE} = 3 p_{SE}$.
          *   Since $q_i$ are all equal, minimizing KL divergence is equivalent to maximizing Shannon Entropy ($-\sum p_i \ln p_i$).
