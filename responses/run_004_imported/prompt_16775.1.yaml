          *   Actually, simpler logic: To maximize entropy subject to a ratio constraint within a subset, the probability mass *outside* that subset should remain as uniform as possible relative to the constraints, but the total mass assigned to the subset might shift to balance the "surprise" of the constraint.
          *   Wait, let's solve it properly.
          *   Let $p_{NW} = a, p_{SW} = b, p_{SE} = c, p_{NE} = 3c$.
          *   Sum: $a + b + 4c = 1$.
          *   Maximize $-a \ln a - b \ln b - c \ln c - 3c \ln(3c)$.
          *   Due to symmetry of the prior and lack of constraints on West, $a = b$.
          *   So maximize $-2a \ln a - c \ln c - 3c (\ln 3 + \ln c) = -2a \ln a - 4c \ln c - 3c \ln 3$.
          *   Constraint: $2a + 4c = 1 \Rightarrow a = 0.5 - 2c$.
