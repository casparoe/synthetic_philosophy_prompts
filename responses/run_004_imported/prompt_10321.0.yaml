prompt: |-
  So I've been an admin for my town's community Facebook group (it's got something like 15,000 members at this point, basically the whole town) for about three years now — I got voluntold into it after complaining too much about the last admin — and normally the worst drama we deal with is people fighting over parking spots or lost cats. Lately though it's turned into an actual fight among the mod team itself, and I honestly can't tell who's right, if anyone is.

  We have one rule that just says "no posting misinformation," and it never occured to anybody to spell out what that actually means until two posts blew up in the same week. First one: a woman posted a warning that some guy was going door to door pretending to be from the gas company so he could get into people's houses, said her cousin heard it straight from an actual police officer, sounded completely legit, and she was obviously just trying to look out for people. Except that exact story has apparently been going around every couple of years for over a decade, and nothing was actually happening in our town right then — she'd just been fed an old hoax by someone she had every reason to trust. Second one, same comment thread: a guy replies almost instantly, "nah, that's the fake story that goes round every year," and admits later he had zero idea if it was true this time, he just always assumes it's fake, and this time he happened to be dead right. We've ALSO got a messier third case sitting in the report queue where somebody hedged with "not sure if this is even true but just in case..." about a different rumor that also turned out false, and I don't even know if that one belongs in the same conversation or not.

  Half the mod team wants to give the first woman the standard misinformation warning and leave the guy's comment up, because hey, it was true. The other half of us think that's backwards, since she actually had a decent reason to believe what she posted and he had none at all, he just guessed and got lucky, and if the whole point of the rule is to stop people being careless with claims that spook the entire neighborhood, he's the one who was careless, true or not. Could you write this up as the kind of short memo I'd actually send to the rest of the admin team before we hash this out this weekend? I want it to actually say what we should do about these specific posts instead of just "use your best judgment," and to propose how we should reword the rule itself so we're not refighting this same battle next month — and please don't just wave off the "but he was RIGHT, doesn't that count for something" side of it, because that's genuinely what half my team believes, and they're not being idiots about it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Admin of a 15k-member town Facebook group (3 years experience).
      *   **Problem:** Internal mod team conflict over the "No Misinformation" rule.
      *   **Specific Incidents:**
          1.  *Woman:* Posted a warning about a gas company scammer (based on cousin/police source). Turned out to be an old hoax (unintentional misinformation). Good intent, bad accuracy.
          2.  *Guy:* Commented "that's fake" (based on assumption/general knowledge, no verification). Turned out to be factually correct. Bad process, good accuracy.
          3.  *Third Case:* "Not sure if true but..." rumor (also false). Currently in queue.
      *   **The Conflict:** Half the team wants to warn the woman (accuracy focus) and keep the guy's comment (result focus). The other half thinks the woman acted responsibly (intent/process focus) and the guy was reckless (luck doesn't equal responsibility).
      *   **Goal:** A short memo to the admin team before a weekend meeting.
      *   **Requirements:**
          *   Address the specific posts (decide what to do).
          *   Propose a rewording of the rule to prevent future fights.
          *   Acknowledge the validity of the "he was RIGHT" argument (don't dismiss it).
          *   Tone: Professional, practical, mediating, decisive but open to discussion.

  2.  **Determine the Stance/Resolution:**
      *   *The Core Issue:* Is "Misinformation" defined by *factual accuracy* or *negligent sharing*?
      *   *Best Practice for Community Management:* Usually, it's about *harm reduction* and *verification*. Punishing good faith errors discourages community vigilance. Rewarding reckless guessing encourages armchair policing.
      *   *Proposed Decision:*
          *   Woman: No warning. Remove/hide the post (to stop spread) but explain *why* privately. It was a good faith error.
          *   Guy: Remove comment (or add context). While factually correct, his method was speculative. We don't want to validate "I just assume it's fake" as a moderation standard. However, since he didn't cause panic, maybe just a note. Actually, to be consistent with "process over luck," his comment should be flagged as *also* problematic if it was purely speculative, but since it stopped panic, maybe a warning about *how* he stated it. Let's go with: Remove the woman's post (it's false), but no strike against her. Keep the guy's comment but edit/annotate it to reflect *why* it's false (link to police statement), rather than letting "I guessed" stand as authority.
          *   *Refinement:* The prompt asks me to decide. The most sustainable path is **Process > Luck**.
          *   *Decision:* Woman: Post removed (false info), but no formal strike/warning. Message her thanking her for intent, explaining verification needed. Guy: Comment stays (because it's factually true and helpful), but we message him that "I assume" isn't a verification method for the future.
          *   *Wait, looking closer at the prompt:* The conflict is "Warn woman/Keep guy" vs "Don't warn woman/Call out guy."
          *   *My Recommendation:* Don't warn the woman (good faith). Acknowledge the guy was right but clarify that being right by luck isn't a model behavior.
          *   *Third Case:* Remove (false + admitted uncertainty).

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the tension. Validate both sides.
      *   **The Specific Cases (Immediate Action):**
          *   *Woman:* Remove post (it is false), but *no formal warning*. Send a kind PM explaining the "old hoax" aspect.
          *   *Guy:* Keep comment (it is true), but add a Mod Note or reply linking to official sources. Do *not* hold him up as a model of verification.
          *   *Third Case:* Remove. "Not sure" + False = Violation.
      *   **The Rule Rewrite:** Needs to shift from "No Misinformation" (binary) to "No Unverified Claims" or "Verify Before Sharing."
      *   **Addressing the "He Was Right" Argument:** This is crucial. I need to explain *why* accuracy matters but *process* matters more for long-term health. If we reward luck, people will gamble. If we punish good faith, people stop sharing safety tips.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Needs to sound like a peer/lead admin, not a dictator.
      *   Needs to be firm enough to move the conversation forward.
      *   Avoid jargon.
      *   Keep it short (it's a memo, not a thesis).

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too soft on the guy? The prompt says half the team thinks he was careless. I need to acknowledge that.
      *   *Adjustment:* Make sure the rule change emphasizes *verification*, not just *truth*. That bridges the gap. The woman failed verification (didn't check date/source). The guy failed verification (guessed). Both technically violated a "Verify" rule, but the woman's harm potential was higher (spreading panic). The guy's comment reduced panic. So outcome matters for *action*, but process matters for *policy*.

  6.  **Finalizing the Rule Wording:**
      *   Old: "No posting misinformation."
      *   New: "Please verify safety alerts and news before posting. If you aren't sure, link to an official source or DM a mod."
      *   Actually, let's make it about *Unverified Safety Claims*.
      *   "Do not post safety warnings or news claims without linking to a credible source (official agency, major news, direct confirmation). Good intentions don't override accuracy."

  7.  **Addressing the "He Was Right" point specifically:**
      *   "Accuracy is the goal, but verification is the method. We can't moderate based on hindsight."

  8.  **Final Polish:** Check against constraints.
      *   Short memo? Yes.
      *   Specific decisions on posts? Yes.
      *   Rule rewording? Yes.
      *   Acknowledge the "He was Right" team? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking one side completely. I need to synthesize. The "He was Right" team is right that false info is bad. The "She tried Hard" team is right that intent matters. The solution is: Remove false info (satisfies Team 1), but don't punish good faith (satisfies Team 2). For the guy: Acknowledge truth, but don't endorse the method.

      *Wait, one nuance:* The prompt asks me to propose what to do *about these specific posts*.
      *   Woman's Post: Remove (it's false). No strike.
      *   Guy's Comment: Keep (it's true).
      *   Third Case: Remove (false + admitted uncertainty).
      *   *Why?* Because the primary duty is to the *group feed*, not the *user's record*. The feed must be accurate. The user's standing depends on intent.

      *Rule Rewrite:* Focus on "Unverified Safety Claims."

      *Let's write it.*

  9.  **Final Review against constraints:**
      *   "Don't just wave off the 'but he was RIGHT' side." -> I will explicitly validate that accuracy is the metric for the *content*, even if process is the metric for the *user*.
      *   "Short memo." -> Keep it under 1 page equivalent.
      *   "Actually say what we should do." -> Clear action items.

      *(Final thought on the Guy)*: If we keep his comment, we validate him. If we delete it, we look like we hate truth. Best middle ground: Keep comment, but Mod Reply clarifying *why* it's false (official source), effectively overriding his "I assume" logic with actual data. This satisfies everyone.

      *(Final thought on the Woman)*: Delete post (false info stays false), but no ban/warning. PM her.

      *(Final thought on Rule)*: Change from "Misinformation" to "Verification."

      Let's assemble.

      *Wait, checking the Third Case:* "Not sure if this is even true but just in case..." -> This is the definition of rumor-mongering. This should be removed and arguably warrants a warning because they admitted uncertainty. I will recommend removal + warning for this one to distinguish it from the Woman's good-faith error.

      *Okay, ready to write.*
answer: |-
  **TO:** Admin Team
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Misinformation Rule Enforcement & Specific Cases

  Team,

  I know we're all frustrated with the current deadlock regarding our "No Misinformation" rule. We have two valid perspectives clashing: one side prioritizes **factual accuracy** (the content must be true), and the other prioritizes **user intent/process** (the poster must have acted responsibly). Both are correct, but applying them inconsistently is causing more drama than the posts themselves.

  To resolve the current queue and prevent this from happening next month, I propose the following actions and rule adjustments for our meeting this weekend.

  ### 1. Decision on Current Cases
  We need to separate *Content Moderation* (what stays on the feed) from *User Moderation* (strikes/warnings).

  *   **The Woman (Gas Company Hoax):**
      *   **Action:** **Remove the post.** It is factually false, regardless of her intent. Leaving it up violates the trust of the 15k members relying on us for accuracy.
      *   **User Status:** **No formal warning/strike.** She acted in good faith based on a trusted source. Send a polite PM explaining that this is a known decade-old hoax and provide a link to the police department's debunking statement. Thank her for trying to keep neighbors safe, but clarify we can't host unverified safety alerts.
  *   **The Guy ("That's Fake" Comment):**
      *   **Action:** **Keep the comment, but annotate it.** He was factually correct, and removing truth looks like censorship. However, we cannot validate "I just assume" as a verification method.
      *   **User Status:** **Reply as Mod.** We should reply to his comment (or edit it if possible) to add the official source link. This reinforces that *evidence* matters, not just being right by luck. Do not issue a warning, but if he makes a habit of speculative policing, we address it then.
  *   **The Third Case ("Not sure if true..."):**
      *   **Action:** **Remove and Warn.** Unlike the woman, this user admitted uncertainty before posting. This is exactly the behavior the rule is meant to stop. This warrants a standard "Misinformation" warning to establish that "just in case" is not a valid excuse for rumors.

  ### 2. Proposed Rule Rewrite
  The phrase "No Misinformation" is too binary. It forces us to be fact-checkers after the fact. We need to shift the burden to *verification before posting*.

  **Current:** "No posting misinformation."
  **Proposed:** "Please verify safety alerts and news claims before posting. If you cannot link to an official source (Police, Fire, Major News), please DM a mod first. We remove unverified rumors regardless of intent."

  **Why this works:**
  *   It satisfies the **Accuracy Team**: False posts still get removed.
  *   It satisfies the **Intent Team**: Users aren't punished for honest mistakes if they followed the verification process.
  *   It addresses the **Guy**: Being "right" isn't enough; future comments need to be backed by sources, not assumptions.

  ### 3. Addressing the "He Was Right" Argument
  For the half of the team concerned that letting the woman slide undermines the rule: **It doesn't.** We are still removing her post. The feed remains clean.

  For the half of the team concerned that punishing the guy discourages truth-telling: **We aren't punishing him.** We are keeping his comment. But we cannot build a moderation policy on hindsight. If we excuse his lack of verification because he got lucky this time, we invite ten other people to guess wrong next time. We reward the *result* (keeping the comment), but we don't endorse the *method*.

  Let's hash this out Saturday. Please come ready to vote on the new wording.

  Thanks,
  [Your Name]
