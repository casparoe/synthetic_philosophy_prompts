  ### TA Notes for the Rest of the Stack
  Since you're grinding through the rest of these tonight, here are the two "tells" to watch for that indicate a student has confused Du Châtelet with other early modern philosophers:

  1.  **The Stoic Trap:** If a student says Du Châtelet wants to *eliminate* passion for the sake of *tranquility* (ataraxia), they are confusing her with the Stoics (or possibly Descartes on passions). Du Châtelet thinks tranquility without passion is boredom/misery.
  2.  **The Gender Flip:** If a student says study is for *men's* glory or that women are too emotional for study, they have missed her feminist intervention. Her key point is that because society blocks women from public ambition, study is the *only* reliable path to happiness left open to them.

  Good luck with the rest of the pile! You're asking the right questions to keep your grading consistent.
