prompt: |-
  So at work we've been using 'self-consistency' with our LLM calls -- sample the model a bunch of times and go with whatever answer comes up most -- and a teammate mentioned this is basically just the Condorcet Jury Theorem in disguise. Now I can't unsee it everywhere: reddit upvotes, x/twitter community notes, prediction markets, all claiming to be 'wisdom of the crowd' machines. But the theorem only actually works if each voter is independent AND more likely than not to be right on thier own -- break either assumption and more voters makes the group verdict worse, not better. Condorcet himself was a total Enlightenment optimist, big on progress, public education, and using probability to design better institutions. If you sat him down today and showed him how these crowd platforms actually behave -- bots and algorithmic feeds wrecking independence, misinformation dragging average competence below 50/50 on plenty of topics -- do you think he'd see his theorem vindicated at internet scale, or would he say we've built machines that trade on the theorem's name while violating everything it requires? Actually reason through the math/assumptions, don't just give me vibes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Observation:** The user notes that "self-consistency" in LLMs (sampling multiple times, taking the majority vote) is analogous to the Condorcet Jury Theorem (CJT).
      *   **Extension:** The user extends this analogy to internet "wisdom of the crowd" mechanisms (Reddit upvotes, Twitter Community Notes, Prediction Markets).
      *   **Critical Insight:** The user correctly identifies the two crucial assumptions of CJT:
          1.  Independence of voters.
          2.  Individual competence ($p > 0.5$).
      *   **The Question:** If Condorcet (the historical figure, an Enlightenment optimist focused on probability and institutions) saw today's internet platforms (bots, algorithms, misinformation), would he see his theorem vindicated or violated?
      *   **Constraint:** "Actually reason through the math/assumptions, don't just give me vibes."

  2.  **Analyze the Condorcet Jury Theorem (CJT):**
      *   *The Math:* Let $n$ be the number of voters. Let $p$ be the probability an individual voter is correct.
      *   *Case 1 ($p > 0.5$):* As $n \to \infty$, the probability the majority is correct $\to 1$. (Convergence to truth).
      *   *Case 2 ($p < 0.5$):* As $n \to \infty$, the probability the majority is correct $\to 0$. (Convergence to falsehood).
      *   *Case 3 ($p = 0.5$):* The majority probability stays at $0.5$. (Random walk).
      *   *Assumption 1 (Independence):* Voters must not influence each other. Correlated errors reduce the effective $n$.
      *   *Assumption 2 (Competence):* $p$ must be strictly greater than $0.5$.

  3.  **Analyze the Modern Context (Internet Platforms):**
      *   **LLM Self-Consistency:**
          *   *Independence:* Pseudo-random sampling from the same weights. Are they independent? Mostly, but subject to the same mode collapse or bias.
          *   *Competence:* Is the base model $p > 0.5$? For reasoning tasks, often yes. For creative tasks, "correctness" is ill-defined.
          *   *Verdict:* This is probably the closest actual application of CJT today.
      *   **Reddit Upvotes/Social Media:**
          *   *Independence:* Violated. Herding behavior, visibility bias (top comments seen first), algorithmic amplification.
          *   *Competence:* Is the average user $p > 0.5$ on complex topics? Often no (Dunning-Kruger, misinformation).
          *   *Verdict:* Violates both assumptions.
      *   **Prediction Markets:**
          *   *Independence:* Traders bet against each other. Information is aggregated via price.
          *   *Competence:* Money acts as a filter. Those with better info/skills bet more.
          *   *Verdict:* Different mechanism (market efficiency vs. majority vote), but often works better because it weights competence.
      *   **Twitter Community Notes:**
          *   *Mechanism:* Bridging-based ranking (needs agreement from diverse raters).
          *   *Independence:* Partially mitigated by requiring cross-partisan agreement.
          *   *Competence:* Still relies on human judgment, but the algorithm tries to filter for reliability.

  4.  **Synthesize Condorcet's Perspective (Historical & Mathematical):**
      *   Condorcet was a mathematician first. He cared about the *conditions* for the theorem.
      *   He was an institutionalist. He believed in designing systems to *ensure* $p > 0.5$ (education) and independence (secret ballots, deliberation structures).
      *   He would likely be horrified by the *violation* of assumptions, not just the outcome.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the user's sharp insight. Yes, self-consistency is CJT. Yes, the internet claims CJT but often fails the math.
      *   *Section 1: The Math Check.* Explicitly write out the conditions. $P_n \to 1$ iff $p > 0.5$ and independence holds. Explain correlated error (effective $N$ drops).
      *   *Section 2: LLM Self-Consistency.* This is the "good" case. Temperature sampling creates pseudo-independence. Base model competence is usually $>0.5$ on logic tasks. It works *because* it respects the math.
      *   *Section 3: The Internet "Crowd".*
          *   *Independence:* Algorithms create common shocks (everyone sees the same trending topic). Bots create correlated noise.
          *   *Competence:* Misinformation ecosystems can drive $p < 0.5$. If the crowd is systematically biased, CJT says more people = more wrong.
      *   *Section 4: Condorcet's Verdict.* He wouldn't be surprised. He argued for *education* to raise $p$. He argued for *secret ballots* to ensure independence. The internet does the opposite (public signaling, algorithmic radicalization).
      *   *Section 5: Nuance (Prediction Markets/Community Notes).* These aren't pure CJT. Prediction markets weight by confidence (money). Community Notes weights by "bridging." They are attempts to *fix* the CJT violations.
      *   *Conclusion:* Condorcet would say we are misusing his name. We have the "voting" part without the "jury" conditions.

  6.  **Refining the Tone:**
      *   Keep it rigorous but accessible.
      *   Avoid "vibes" (as requested). Use terms like "correlated error," "effective sample size," "asymptotic behavior."
      *   Ensure the distinction between LLMs (where it works) and Social Media (where it often fails) is clear.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I address LLMs enough?* The prompt starts with LLMs. Need to validate that analogy first. LLM samples aren't truly independent (same weights), but temperature adds stochasticity. It's "approximate independence."
      *   *Is $p > 0.5$ definable on Twitter?* On factual questions, yes. On opinion, CJT doesn't apply (no ground truth). Need to make that distinction.
      *   *Condorcet's actual views:* He was big on public instruction. Emphasize that he saw competence as a *variable* to be improved, not a constant.

  8.  **Final Polish:** Organize into clear sections: The Theorem, The LLM Case, The Internet Case, Condorcet's Judgment. (Proceed to generate output based on this structure).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just bash social media. Prediction markets actually *do* work quite well. Why? Because they relax the "one person one vote" assumption of CJT. They weight by competence (via skin in the game). I should highlight that distinction. CJT is unweighted majority vote. Markets are weighted.

  *(Refining the Independence argument)*: In LLMs, independence is limited by the model's mode collapse. In social media, independence is limited by algorithmic feeds. Both are "common cause" violations.

