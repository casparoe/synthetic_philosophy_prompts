answer: |-
  It is a pleasure to speak with someone who has actually spent a career staring at Geiger counters and fitting exponential decay curves. You have a visceral intuition for the data that most philosophers of probability lack. Your skepticism about propensity theory is well-founded; it is arguably the most controversial and metaphysically "expensive" interpretation of probability.

  To answer your core question directly: **Yes, propensity theory posits an irreducible, single-case physical property that is not just frequency talk in new clothes.** However, whether that property actually *exists* (or is just a useful fiction) is exactly where the philosophical battle lies.

  Here is the breakdown of the disagreement, using your background in decay rates to anchor the Reference Class Problem and the metaphysical claims of propensity.

  ### 1. The Frequentist Wall: The Reference Class Problem
  As an experimentalist, you know that to measure a decay constant $\lambda$, you need an ensemble. For a strict frequentist (like von Mises), probability *is* the limit of relative frequency in a hypothetical infinite sequence of repeatable trials.

  The problem arises when you point to a **single** nucleus of Uranium-238 sitting in a trap and ask: *"What is the probability this specific atom decays in the next 4.5 billion years?"*

  *   **The Frequentist Answer:** Strictly speaking, the question is meaningless. Probability applies to the *collective*, not the individual. The single atom either decays or it doesn't (probability 1 or 0). We can only speak of the probability of the *class* of U-238 atoms.
  *   **The Reference Class Problem:** But which class? This is where frequentism gets sticky for single cases.
      *   Is the class "All U-238 atoms in the universe"?
      *   Is it "All U-238 atoms at this temperature"?
      *   Is it "All U-238 atoms measured by this specific detector setup"?
      *   Is it "All atoms created in this specific supernova event"?

  Each reference class has a different long-run frequency. Since the single atom belongs to *all* these classes simultaneously, the frequentist assignment of probability to that single atom is ambiguous. It depends on how you choose to describe the experiment, not just on the physical reality of the atom.

  For a physicist, this feels wrong. You want to say the instability is *in the atom* (or the atom's interaction with the vacuum), not in the way you group it with other atoms.

  ### 2. The Propensity Move: Probability as a Physical Disposition
  Karl Popper (and later theorists like Mellor and Fetzer) introduced propensity to solve exactly this. They wanted to keep probability objective (like the frequentists) but applicable to single cases (like the Bayesians).

  **The Core Claim:** Probability is a **physical disposition** or **tendency** of a specific experimental setup to produce a certain outcome.

  Using your physics intuition: Think of **voltage**.
  *   **Frequency:** If you connect a battery to a circuit, electrons flow. You can measure the current (the frequency of charge flow).
  *   **Propensity:** The voltage exists across the terminals *even if the circuit is open* and no current flows.

  The propensity theorist argues that the decay constant $\lambda$ describes a "tension" or "disposition" inherent in that single nucleus *right now*.
  *   **Frequentist:** $\lambda$ describes the behavior of the ensemble.
  *   **Propensity:** $\lambda$ describes the physical state of the individual nucleus. The ensemble behavior is merely the *manifestation* of the single-case propensities adding up.

  So, to your suspicion: **Is it just disguised frequency?**
  The propensity theorist says **no**.
  *   **Frequency** (even hypothetical long-run frequency) is a *statistical pattern*.
  *   **Propensity** is a *causal generator*.

  They argue that the long-run frequency occurs *because* the single-case propensities exist. If you deny the single-case propensity, you have no explanation for *why* the frequency stabilizes at 0.5 (or whatever) other than brute fact. Propensity adds a "truthmaker" to the single case.

  ### 3. Where the Real Disagreement Lies (The Metaphysical Cost)
  Your skepticism touches on the main criticism of propensity theory, often leveled by philosophers like Alan Hájek.

  **The Circularity/Measurement Objection:**
  As an experimentalist, how do you measure the propensity of a single atom? You can't. You *must* put it in an ensemble and measure the frequency.
  *   **Critic:** "If the only evidence for propensity is frequency, and the definition of propensity is 'that which produces frequency,' aren't you just defining $X$ as 'the thing that causes $Y$' and then measuring $Y$ and calling it $X$?"
  *   **Propensity Defender:** "No. Mass is a property of a single object, but we often measure it by weighing ensembles or observing gravitational effects. We don't say mass is 'disguised weight.' Propensity is a physical magnitude like mass or charge."

  **The Metaphysical "Spookiness":**
  This is the crux.
  *   **Frequentists** are ontologically parsimonious. They say: "There are atoms, and there are decay events. Don't invent a ghostly 'tendency' field surrounding the atom."
  *   **Propensity Theorists** say: "Quantum Mechanics forces us to be ontologically extravagant. If the world is indeterministic, there must be a physical fact of the matter about the chance of this event, distinct from my belief (Bayesian) and distinct from the history of other atoms (Frequentist)."

  ### 4. Why Propensity Claims to Avoid the Reference Class Problem
  The propensity theorist handles the Reference Class Problem by shifting the locus of probability.

  *   **Frequentist:** Probability is a relation between an *event* and a *class*. (Ambiguous because the event belongs to many classes).
  *   **Propensity:** Probability is a property of the *generating conditions*.

  For the single U-238 atom, the "generating conditions" are the complete physical state of that atom and its immediate environment (electromagnetic fields, vacuum state, etc.).
  *   If you change the reference class (e.g., from "all atoms" to "all atoms at 300K"), the frequentist probability changes.
  *   The propensity theorist says the *propensity* only changes if the **physical setup** changes. If the temperature doesn't affect the decay rate, then including temperature in the reference class is irrelevant to the propensity. The propensity is fixed by the *causal* structure, not the *statistical* classification.

  ### 5. Summary: Is it Worth the Buy-In?
  You asked if there is "really some irreducible single-case chance being posited."
  **Yes.** That is the entire point of the theory. It posits that **Chance is a force of nature.**

  *   **Frequentism:** Chance is a pattern in history (actual or hypothetical).
  *   **Bayesianism:** Chance is a measure of information.
  *   **Propensity:** Chance is a physical property of the present moment.

  **Why you might stay stuck:**
  Many philosophers of science agree with you. Propensity theory is often criticized for being metaphysically obscure. We know how to measure frequency. We know how to update credence. We don't have a "propensity-meter." If propensity doesn't change the predictions of the theory (the Born rule gives the same numbers regardless of interpretation), is it doing any work other than satisfying our intuition that "the atom really could have done otherwise"?

  **The Verdict for a Physicist:**
  If you are a **Realist** about Quantum Mechanics (believing the wavefunction describes physical reality, not just knowledge), Propensity is the natural home for probability. It treats $|\psi|^2$ as a real physical field of tendency.

  If you are an **Instrumentalist** (theories are just tools for prediction), Propensity looks like "hidden frequency in a disguise," because you refuse to posit physical reality for unmeasurable quantities.

  Your intuition that it smells like disguised frequency is the standard empiricist critique. The propensity theorist's rebuttal is that without that "disguise," you cannot make sense of single-case quantum events without collapsing into subjectivism or denying the reality of the single event altogether.
