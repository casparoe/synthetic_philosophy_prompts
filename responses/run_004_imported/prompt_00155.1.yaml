  8.  (Final Polish of the text to ensure it resonates with an experimentalist's mindset—focus on measurement, setup, and physical reality.) *Self-correction: Make sure to mention that in QM, propensity is often seen as the 'natural' interpretation, which fits their background.*

  9.  **Final check against constraints:** No special constraints other than answering the prompt thoroughly.

