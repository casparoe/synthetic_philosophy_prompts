answer: |-
  **Scene:** *10:43 AM. A home office. Sarah stares at her monitor. A grey overlay blocks her social media feeds: "FOCUS MODE ACTIVE UNTIL 12:00 PM." Her mouse cursor hovers over the browser icon. She right-clicks. Selects "New Incognito Window." The screen goes dark, then white. Unblocked.*

  **Elias:** There it is. The intersection point. Three weeks ago, the larger-later reward of career stability dominated. Now that the smaller-sooner reward of dopamine is immediate, the curves have crossed. It's not a mystery, Mara. It's calculus.

  **Mara:** It's not calculus; it's a breach. She didn't just weigh options; she dismantled the scale. Look at her face. She doesn't think scrolling is *better* than working. She knows it's worse. She's not reversing a preference; she's circumventing a resolution.

  **Elias:** "Circumventing a resolution" is just poetic language for updating the utility function. Installing the blocker was a precommitment strategy, a bet by her past self that her future discount rate would be too high. But the future self arrived, evaluated the cost of bypassing the blocker against the reward of the tab, and found the net positive. That's a preference reversal, plain and simple.

  **Mara:** But that's exactly what Richard Holton argues against. If it were just a preference reversal, she would have simply decided she preferred scrolling to working. She wouldn't need the incognito tab. The very fact that she has to hide her activity from her own blocker proves she hasn't actually changed her mind about the good. She's engaging in what Holton calls "reconsideration" when she shouldn't be. A resolution is a distinct state—it's a rule to *stop* calculating.

  **Elias:** You're treating the resolution like a magical force field. It's not. It's just another constraint in the optimization problem. When the blocker was installed, the cost of breaking it was high. Now, in this moment, the cognitive cost of opening an incognito tab is low, and the urge is high. The "rule to stop calculating" is just a heuristic that lost its binding power because the temporal distance to the reward collapsed. You say she hasn't changed her mind, but her actions prove her valuation has.

  **Mara:** Her actions prove her *will* faltered, not her valuation. Holton's point is that weakness of will is specifically the failure to maintain a resolution in the face of temptation *without sufficient reason*. She has no new information. Work is still valuable. Distraction is still costly. By opening that tab, she isn't demonstrating a new preference; she's demonstrating a failure to maintain the psychological stance she adopted. She's allowing the temptation to trigger a re-evaluation that she previously ruled out of bounds.

  **Elias:** "Ruled out of bounds" is just a metaphor for a high penalty weight. And look, she just paid the penalty. She's bypassing the precommitment. Ainslie would say this is the predictable bargaining failure between temporal selves. Her past self tried to bind her, and her present self found a loophole. If "willpower" is just the ability to bind your future self, and she just unbound herself, then the discounting model explains the mechanism perfectly. Your "distinct psychological state" is just a ghost in the machine.

  **Mara:** It's not a ghost; it's the difference between a desire and a policy. If I desire cake but resolve not to eat it, and then I eat it, the Humean says the desire got stronger. Holton says the agent failed to uphold the policy. Sarah isn't eating the cake because she's hungrier than before; she's eating it because she told herself, "Just this once." That exception-making is the akrasia. It's not that the curves crossed; it's that she tilted the graph to make them cross.

  **Elias:** Tilting the graph *is* the curve crossing. The "Just this once" thought is the cognitive manifestation of the hyperbolic spike. You're insisting on a dualism where there's only one process. If the resolution was a real, distinct state that wasn't reducible to competing desires, it wouldn't be so fragile to temporal proximity. The fact that the incognito tab works—that the barrier is so easily psychologically breached—confirms that her commitment was always contingent on the delay of the reward.

  **Mara:** The fragility doesn't prove reduction. It proves the difficulty of the task. A resolution requires active maintenance against the pressure of desire. When she clicks that icon, she isn't satisfying a new preference; she's abandoning the authority of her past judgment. The discounting model predicts *when* she might slip, but it can't explain the normative structure of the slip. She feels guilt, Elias. If this were just a rational preference update, why the guilt?

  **Elias:** Because her past self is still a stakeholder in her utility function. Guilt is the penalty signal for breaking the intra-personal contract. It's the cost of reducing trust between her temporal selves. But don't confuse the emotional fallout with the mechanism. The mechanism is discounting. The incognito tab is the smoking gun of a preference flip.

  **Mara:** The incognito tab is the smoking gun of a resolution being reasoned around. She didn't forget the rule. She didn't change her belief about the rule's value. She used her reasoning capacity to undermine the rule's authority. That's not a preference reversal; that's a corruption of the will.

  **Elias:** Call it corruption, call it discounting. The prediction is the same. She clicks.

  **Mara:** The prediction is the same. The explanation determines whether we think she can be helped by better incentives or by strengthening her resolve.

  **Elias:** *Click.* Incentives are resolve, Mara.

  **Mara:** *Click.* No. One is a price. The other is a promise. She just broke a promise, not a price tag.
