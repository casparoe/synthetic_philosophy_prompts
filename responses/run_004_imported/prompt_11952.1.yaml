answer: |-
  I was in a code review with my manager, arguing about whether to ship a particularly buggy feature.

  I said, "Look, there are no object-given reasons to favor this code. It's inefficient and brittle. This is a classic Wrong Kind of Reasons scenario."

  He asked, "Which one?"

  I said, "Like the saucer of mud. Remember? The demon threatens you unless you admire the mud. The threat gives you a reason to favor it, but it doesn't make the mud *admirable*."

  He nodded slowly. "So you're saying this code is the mud."

  I said, "Exactly. And you're the demon."

  He smiled. "And the threat is your employment."

  "Right," I said. "So that's a state-given reason. It makes shipping *prudent*, but it doesn't make the code *good*. Under a Fitting-Attitude account, I can't genuinely favor it."

  He leaned back. "I accept that. The code has no value. But you have overwhelming reasons to ship it."

  "So I should pretend to admire it?"

  "No," he said. "Admiration would be unfitting. Just ship it."

  "But if I ship it without admiration, isn't that dishonest?"

  "No," he said. "It's acknowledging the distinction. You're acting on a Wrong Kind of Reason while maintaining a Right Kind of Attitude."

  "Which is?"

  "Disdain."

  "So my disdain is fitting?"

  "Perfectly."

  "Fine," I said, hovering over the merge button. "But my hesitation is the only thing here that fits."
