answer: |-
  **Title:** The Moral Fiction of Equality: Weighing Revisionist Ethics Against Traditionalist Law in Just War Theory

  **Introduction**

  The ethics of warfare are governed by a persistent tension between moral truth and practical necessity. At the heart of this tension lies the doctrine of the "moral equality of combatants" (MEC). Traditional just war theory, epitomized by Michael Walzer, posits that soldiers on opposing sides possess equal moral status: provided they adhere to the rules of engagement (*jus in bello*), they are equally permitted to kill and equally legitimate targets, regardless of the justice of their nation's cause (*jus ad bellum*). Conversely, revisionist theorists like Jeff McMahan argue that MEC is a moral fiction. Drawing on the logic of individual self-defense, McMahan contends that combatants fighting for an unjust cause commit acts of aggression that cannot be morally justified, even if they follow the rules of war. This essay evaluates McMahan's argument from individual morality against Walzer's pragmatic defense of combatant equality. While McMahan successfully demonstrates that MEC is incoherent at the level of deep individual morality, this essay argues that Walzer's traditionalist framework remains the superior standard for International Humanitarian Law (IHL). To adopt McMahan's view as a legal convention would undermine the very constraints on violence that just war theory seeks to uphold. Therefore, the verdict is that while McMahan is philosophically correct regarding individual culpability, Walzer is normatively correct regarding the regulation of armed conflict.

  **The Revisionist Challenge: Individual Morality and Asymmetry**

  Jeff McMahan's revisionist critique dismantles the traditional separation between *jus ad bellum* and *jus in bello*. His argument rests on the premise that war is not a collective contest between abstract states, but a series of individual acts of killing. In ordinary morality, the right to kill in self-defense arises only against an "unjust threat." If a bank robber threatens a teller, the teller is justified in using force to stop him; the robber, however, is not justified in killing the teller to overcome resistance, even if the teller fights back effectively. McMahan applies this logic to war. If Side A is waging an aggressive, unjust war, its soldiers constitute unjust threats. Side B, defending itself, poses a just threat. Consequently, Side B's soldiers are justified in killing Side A's soldiers, but Side A's soldiers are not morally justified in killing Side B's soldiers, even if Side A observes discrimination and proportionality.

  McMahan anticipates the objection that this makes most soldiers "murderers." He introduces a crucial distinction between *justification* and *excuse*. An unjust combatant may be *excused* from blame due to epistemic limitations, coercion, or patriotic indoctrination, meaning they are not necessarily culpable or punishable. However, being excused is not the same as being *justified*. Their actions remain objectively wrongful. By maintaining MEC, Walzer obscures this moral asymmetry, granting a "license to kill" to those who are objectively contributing to injustice. For McMahan, accepting MEC requires us to abandon the belief that killing is generally wrong unless justified, replacing it with a collectivist mythology that shields individuals from moral scrutiny. Philosophically, McMahan's account is robust; it aligns the ethics of war with the ethics of everyday life, ensuring that moral responsibility tracks with the actual justice of the cause.

  **The Traditionalist Defense: Pragmatism and the Laws of War**

  Michael Walzer defends MEC not on metaphysical grounds, but on practical and political ones. In *Just and Unjust Wars*, Walzer argues that soldiers are generally not in a position to judge the justice of their state's cause. The information available to them is controlled by leadership, and the social pressure to obey is immense. If the right to fight depended on the objective justice of the cause, soldiers would be forced to become amateur geopolitical analysts under fire. More dangerously, Walzer argues that abandoning MEC would lead to a degradation of *jus in bello* compliance.

  The core of Walzer's pragmatic defense is the incentive structure of war. If international law adopted McMahan's asymmetry, declaring that unjust combatants are essentially criminals, those combatants would have no incentive to follow the rules of war. If I am already fighting on behalf of an unjust cause, and the law declares my participation a crime regardless of my conduct, why should I refrain from targeting civilians or using torture? I have nothing to lose. By granting moral equality, Walzer provides unjust combatants with a reason to limit their violence: if they follow the rules, they remain honorable soldiers rather than war criminals. Walzer's MEC is thus a "moral fiction" designed to serve a higher moral end: the minimization of suffering. It creates a symmetrical legal framework where both sides have a reciprocal interest in restraint. For Walzer, the alternative is not a more moral war, but a more brutal one.

  **Critical Weighing: The Dangers of Revisionist Law**

  When weighing these arguments, one must distinguish between the domain of moral philosophy and the domain of legal regulation. McMahan's revisionism excels in the former but falters in the latter. If IHL were to codify McMahan's asymmetry, it would face an insurmountable epistemic problem: who determines which side is unjust? In the fog of war, both sides invariably claim self-defense. If the UN or an international court must adjudicate the justice of the cause before soldiers know their legal status, the law becomes unenforceable in real-time.

  Furthermore, McMahan's reliance on the distinction between justification and excuse creates a hazardous ambiguity for soldiers on the ground. If a soldier is told his actions are "excused but not justified," the normative force of that command is weak compared to Walzer's clear assertion of equal rights and duties. The revisionist approach risks creating a two-tiered system of human rights where the "unjust" side is stripped of protection. History suggests that dehumanizing the enemy as "criminals" or "aggressors" is a precursor to total war. Walzer's symmetrical rules act as a firewall against this escalation. By treating the enemy as a moral equal, one acknowledges their humanity; by treating them as an unjust threat, one risks viewing them as obstacles to be removed. Therefore, while McMahan is right that the aggressor is morally distinct, translating that distinction into the laws of war would likely increase, not decrease, atrocities.

  **Synthesis: A Divided Verdict**

  Does this mean Walzer is entirely right and McMahan wrong? No. To accept Walzer's pragmatism wholly is to accept a moral blindness that allows states to manipulate soldiers into fighting unjust wars without accountability. The verdict must therefore be bifurcated: McMahan provides the correct standard for *retrospective moral judgment* and *leadership accountability*, while Walzer provides the correct standard for *conduct during war* and *soldierly obligation*.

  We must accept McMahan's claim that MEC is morally false. This is essential for holding political leaders and generals accountable for wars of aggression, as seen in the Nuremberg Principles which established that "crimes against peace" are punishable. Leaders cannot claim the "moral equality" of their soldiers; they bear the burden of *jus ad bellum*. However, for the infantryman in the trench, Walzer's convention must hold. The soldier should be trained to follow *jus in bello* rules regardless of the cause, protected by the guarantee that adherence to these rules grants them legitimate combatant status.

  This qualified verdict prioritizes Walzer's framework for the regulation of conflict because the immediate priority of just war theory is the limitation of violence, not the metaphysical sorting of moral guilt. However, this acceptance of Walzer is conditional. We can only defend Walzer's "moral fiction" if we simultaneously embrace McMahan's insights in the post-war phase. If we grant soldiers equality during the fight, we must deny that same equality to the leaders who sent them when the fight is over. Without McMahan's revisionism, Walzer's traditionalism risks becoming a shield for impunity; without Walzer's traditionalism, McMahan's revisionism risks becoming a catalyst for barbarism.

  **Conclusion**

  In the dispute over the moral equality of combatants, Jeff McMahan wins the philosophical argument, but Michael Walzer wins the policy argument. McMahan successfully proves that from the standpoint of individual morality, combatants are not equals; the justice of the cause permeates the justice of the act. However, Walzer correctly identifies that codifying this moral truth into international law would dismantle the incentives for restraint that protect civilians and prisoners of war. Therefore, the most defensible position is to uphold Walzer's symmetrical rules as the binding legal convention for soldiers in the field, while utilizing McMahan's asymmetrical logic to judge the culpability of political leadership and to inform our historical understanding of the conflict. We must act *as if* combatants are equals to save lives, even while knowing *that* they are not, to save our conscience. This dual approach acknowledges the tragedy of war: that limiting its horrors sometimes requires suspending the full weight of moral truth.
