answer: |-
  This is an exceptionally sharp observation, and you have correctly identified one of the most persistent and difficult problems in democratic theory: **the boundary problem.**

  You are asking whether the *demos* (the people) should be defined by those **subject to coercion** (you, while you live there), those **affected by outcomes** (residents, regarding long-term projects), or those with a **stake in the future** (residents, regarding longevity).

  Your friend's comparison to transnational democracy is also astute. In both cases, the tension is between the **territorial/jurisdictional model** of democracy (votes belong to citizens/residents of a specific space) and the **functional/impact model** of democracy (votes belong to anyone impacted by the decision).

  There is no consensus in political science that one principle is definitively "correct." Instead, theorists argue that each principle serves a different democratic value, and the conflict arises because those values often clash. Here is a breakdown of the theoretical landscape regarding your specific situation.

  ### 1. The Principle of All-Subjected Persons (The Student Argument)
  This principle argues that anyone subject to the coercive power of the state should have a say in its governance.
  *   **The Theory:** If you are bound by the zoning laws, police enforcement, and noise ordinances, democratic legitimacy requires your consent. To rule over you without your vote is a form of taxation (or regulation) without representation.
  *   **The Strength:** It prevents the creation of a caste system within a territory. If students make up 40% of the town but have 0% of the vote, the government is effectively an oligarchy of permanent residents ruling over a transient underclass.
  *   **The Weakness:** It ignores the temporal dimension of accountability. If you vote for a 30-year bond measure and leave in two years, you cannot be held accountable by your neighbors for that decision later.

  ### 2. The Principle of All-Affected Interests (The Resident Argument)
  This principle suggests that anyone whose interests are significantly affected by a decision should have a say.
  *   **The Theory:** Democracy is about managing shared fate. If a decision will shape the town for decades, only those who will be there to experience the consequences have a legitimate claim to decide.
  *   **The Strength:** It aligns decision-making power with long-term responsibility. It encourages voters to consider the future health of the community rather than short-term gains.
  *   **The Weakness:** As your friend noted, this logic is hard to contain. If we vote based on "affected interests," then people in neighboring towns (affected by traffic), or even other countries (affected by climate policy), could claim a vote. It makes the boundary of the *demos* infinitely expandable and practically unworkable.

  ### 3. The "Arbitrary Line" Problem
  You asked if this is simply an arbitrary line that has to be drawn. The political theorist **Frederick Whelan** famously argued that the boundary problem is **undecidable on democratic grounds.**

  His reasoning is circular: To decide who gets to vote on the boundaries of the electorate, you first need an electorate to vote. But to have an electorate, you need boundaries. Therefore, the boundary is usually set by pre-democratic facts (history, geography, law) rather than democratic theory itself.

  However, just because the line is not "naturally" correct doesn't mean it is arbitrary in a negative sense. **Robert Dahl** argued that we must look at the **unit of democracy.** In a local municipality, the assumption is often that the *demos* is a community of fate, not just a collection of current occupants.

  ### 4. Analyzing the Transnational Parallel
  Your friend's comparison to foreign influence on environmental policy is structurally similar but highlights a different tension.
  *   **In the transnational case:** The argument is usually *expansive*. (Foreigners *should* have a say because they are affected).
  *   **In the student case:** The argument is *restrictive*. (Residents want to *exclude* students).

  Both cases reveal the inadequacy of the **Nation-State/Territorial Model** in a globalized (or highly mobile) world. The territorial model assumes that people, problems, and policies all align within the same geographic borders. Your university town proves they don't: the *people* are transient, the *problems* (housing, infrastructure) are local, but the *consequences* are long-term.

  ### 5. Is One "Correct"?
  Most contemporary democratic theorists would suggest that neither principle is exclusively correct. Instead, they offer a few ways to resolve the tension that might satisfy your seminar curiosity:

  **A. The "Stakeholder" Compromise**
  Some theorists argue for a distinction between **residency** and **domicile.** Residency is where you sleep; domicile is where you intend to remain.
  *   *Application:* Students could vote immediately on issues affecting them now (rent control, policing), but residency requirements could apply for long-term capital projects (school bonds, infrastructure). This is administratively difficult but theoretically sound.

  **B. The "Equality of Voice" Argument**
  Excluding a large chunk of the population creates a legitimacy deficit. If 40% of the town is excluded, the "will of the people" is a fiction.
  *   *Application:* It is often better to include transient voters and accept the risk of short-termism than to create a system of permanent political inequality. Short-term residents still care about their quality of life *while* they are there.

  **C. The "Second Demos" Theory**
  Political scientist **David Owen** has suggested that in some contexts, we might need to acknowledge multiple *demoi*.
  *   *Application:* Perhaps the town needs mechanisms for student consultation that don't carry the same weight as resident voting, or specific student representatives for specific issues. (Though this risks the "separate but equal" problem).

  ### Conclusion for Your Seminar
  To answer your specific question: **No, one way of thinking is not objectively correct.**

  The conflict you are witnessing is a real-world manifestation of the tension between **Legitimacy** (government by consent of the governed, i.e., students) and **Accountability** (government responsive to long-term consequences, i.e., residents).

  If you argue for the students, you prioritize *political equality* and *protection from coercion*.
  If you argue for the residents, you prioritize *intergenerational justice* and *community stability*.

  The "line" is indeed drawn somewhat arbitrarily, but it is drawn based on which democratic value the community prioritizes. In a university town, the ethical weight often leans toward inclusion (All-Subjected), because excluding a population that is fully subject to the law undermines the basic liberal democratic premise that law requires consent. However, the residents' concern highlights a genuine flaw in local democracy: **we currently have no good mechanism for weighting votes based on temporal stake.**

  You might conclude your seminar discussion by suggesting that the problem isn't *who* votes, but that our binary voting system (1 person, 1 vote, forever) is too blunt an instrument to handle a population with varying degrees of temporal investment.
