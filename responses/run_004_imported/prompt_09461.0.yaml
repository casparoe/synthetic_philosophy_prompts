answer: |-
  Here is a breakdown of the arithmetic and the philosophical counter-argument, structured to help you write the scene with precision.

  ### Part 1: The Aunt's Arithmetic (The Downsian Calculus)

  To make your aunt sound like a genuine economist, she should rely on the **Calculus of Voting**, formalized by William Riker and Peter Ordeshook (building on Anthony Downs). The formula is:

  $$R = (P \times B) - C$$

  *   **$R$**: The reward (net benefit) of voting.
  *   **$P$**: The probability that your vote is decisive (casts the tie-breaking vote).
  *   **$B$**: The differential benefit to you if your preferred candidate wins.
  *   **$C$**: The cost of voting (time, travel, effort).

  **The Calculation for the Scene:**
  For a mayoral runoff with 90,000 votes, the aunt needs to estimate $P$. A common layman's mistake is to think $P$ is $1/90,000$. It isn't. It depends on the distribution of the margin.

  If the race were a perfect coin toss (50/50 expectation), the probability of a tie is approximated by the normal distribution density at the mean: $P \approx \sqrt{\frac{2}{\pi N}}$. For $N=90,000$, this is roughly **1 in 376**.

  *However*, an economist knows we never have a perfect 50/50 expectation. There is always uncertainty in the polls. Once you account for the probability that the race *isn't* exactly a toss-up, $P$ drops precipitously.

  **The Aunt's Sound Estimate:**
  She should argue that while the *polls* say it's close, the *probability of a literal one-vote margin* is much lower. A defensible, conservative order-of-magnitude estimate for a local election of this size is **1 in 20,000**.

  **The Dialogue Math:**
  *   **$P$ (Probability):** 1 in 20,000 ($0.00005$).
  *   **$B$ (Benefit):** Let's say the winning candidate saves the nephew \$5,000 over four years in taxes/fees compared to the loser.
  *   **$C$ (Cost):** One hour of time + transport. Valued at \$25.

  $$Expected Value = (0.00005 \times \$5,000) - \$25$$
  $$Expected Value = \$0.25 - \$25 = -\$24.75$$

  **The Paradox:**
  She explains that since $R$ is negative, a rational actor seeking to maximize utility should stay home. The "Paradox of Voting" is that millions of people vote despite this negative expected value. To an economist, this implies voters are either (a) bad at math, or (b) motivated by irrational "consumption" benefits (feelings) rather than "investment" benefits (outcomes).

  ***

  ### Part 2: The Nephew's Reply (The Rational Justification)

  The nephew needs to avoid psychological excuses. He needs a justification that works *within* rational choice theory, not one that abandons it.

  **Evaluating the Standard Replies:**

  1.  **Expressive Value:** "Voting makes me feel good/proud."
      *   *Verdict:* **Psychological, not Justificatory.** This concedes the aunt's point. It admits voting is irrational as an *instrument* to win, and rational only as a *consumption* good, like buying ice cream. It doesn't justify the civic act, only the feeling.
  2.  **Civic Duty:** "It's my obligation as a citizen."
      *   *Verdict:* **Psychological/Normative.** Economists view this as an "internalized cost." If you don't vote, you feel guilt ($D$). So the equation becomes $R = PB - C + D$. This explains *why* people vote, but it doesn't offer an external rational justification for why duty *should* exist. It's circular.
  3.  **Kantian Universalizability:** "What if everyone did that?"
      *   *Verdict:* **Logically Flawed.** My vote does not cause others to vote. There is no causal mechanism by which my staying home triggers a cascade of abstention. It is "magical thinking."
  4.  **Minimax Regret:** "I vote to minimize the maximum regret I would feel if my side lost by one vote."
      *   *Verdict:* **Rational, but specific.** This is a valid decision-theory rule (Ferejohn & Fiorina, 1974). If the regret of causing your side to lose is weighted as infinite (or massive), and the cost of voting is low, you vote. However, it relies on a subjective weighting of "regret."
  5.  **Altruistic / Social Benefit (The Gelman-Edlin-Kaplan Argument):**
      *   *Verdict:* **The Strongest Rational Justification.** This is the most robust counter-argument in modern political economy (specifically *Edlin, Gelman, and Kaplan, 2007*).

  **The Winning Argument for the Nephew:**
  The nephew should argue that the Aunt made a mistake in defining **$B$**. She calculated $B$ as the *personal* benefit to the nephew. But if the nephew is a rational altruist, $B$ should be the **total social benefit**.

  **The Math of the Reply:**
  *   The Mayor's policies affect all 90,000 voters (plus non-voters).
  *   If the preferred candidate provides a net benefit of \$100 per person to the city (in services, safety, equity), the total social benefit ($B_{social}$) is $90,000 \times \$100 = \$9,000,000$.
  *   Now, recalculate the Expected Value using $B_{social}$:

  $$Expected Value = (P \times B_{social}) - C$$
  $$Expected Value = (\frac{1}{20,000} \times \$9,000,000) - \$25$$
  $$Expected Value = \$450 - \$25 = +\$425$$

  **Why this works for the scene:**
  It accepts the Aunt's cold probability ($P$) but defeats her cold selfishness ($B$). It argues that voting is rational *if* you care about others. It transforms voting from a lottery ticket into a high-leverage charitable donation. The probability of success is low, but the payoff is so massive that the expected value is positive.

  ***

  ### Summary for the Draft

  **The Aunt's Line:**
  > "Look at the numbers. Ninety thousand votes. Even if the polls are dead even, the odds you cast the tie-breaking vote are one in twenty thousand. If winning saves you five thousand dollars in taxes, your expected return is twenty-five cents. It costs you twenty-five dollars in time to stand in that line. You're paying twenty-four dollars and seventy-five cents to play a lottery you can't win. That's not civics, that's bad accounting."

  **The Nephew's Line:**
  > "You're using the right formula, but you're using the wrong variable. You calculated $B$ as what the mayor does for *me*. But I'm not the only one who benefits. If the mayor improves the city for everyone, the benefit isn't five thousand dollars; it's five thousand times ninety thousand people. My vote isn't a bet on my own return; it's a lever. The probability is small, yes, but the stake is the whole city. As long as I value my neighbors' welfare even a fraction as much as my own, the expected value isn't negative. It's positive. Voting isn't irrational selfishness; it's rational altruism."
