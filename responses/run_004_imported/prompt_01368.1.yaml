      *   **The Gilbertian (let's call her "Greta"):** Phenomenologically attentive, focused on the *feeling* and *normative force* of social obligations. Sees the "plural subject" as a real social entity created by commitment. Worried that reductionism misses the *sui generis* nature of sociality.

  3.  **Drafting - Section by Section:**

