      *   **Core Conflict:** Reductionism (Bratman: shared intention = interlocking individual intentions + mutual knowledge) vs. Holism/Plural Subject Theory (Gilbert: joint commitment creates a "plural subject" with distinct normative force).
      *   **Key Example:** The "Walking Together" case (Jack/Sue or Ned/Olive). Specifically, the right to rebuke if one abandons the walk.
      *   **Format:** A dialogue between a committed Bratmanian and a committed Gilbertian.
