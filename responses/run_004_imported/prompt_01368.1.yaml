answer: |-
  **Setting:** *A paved path winding through a city park. It is late afternoon. The leaves are turning. MARK (Bratmanian) and GRETA (Gilbertian) are walking side-by-side at a matched pace.*

  **Mark:** You know, if you suddenly stopped walking right now, I'd be annoyed. But I'm trying to parse *why* I'd be annoyed.

  **Greta:** *(Smiling)* Is this the setup for the reductio?

  **Mark:** No, seriously. On my view, my annoyance is transparent. I intend that we walk together. That intention is grounded in my intention that *I* walk, conditional on your walking, meshing with my belief that you intend the same. If you stop, my plan is frustrated. My means-end coherence is violated. I'm annoyed for the same reason I'd be annoyed if it started raining. Obstacle in the path.

  **Greta:** But that's precisely where the reduction fails, Mark. If it started raining, I couldn't *rebuke* the rain. I'd just be disappointed. But if you stop? I have a standing to say, "Hey, wait up, we're walking *together*." That entitlement doesn't come from your frustrated individual plan. It comes from the fact that we are bound by a joint commitment.

  **Mark:** See, I hear "joint commitment" and I hear "ontological glue." You're positing a primitive relation to explain a normative feeling. I'm trying to derive the normative feeling from the structure of planning agency. If I told you, "I'm planning to walk with you," and you agreed, we've created a web of interlocking expectations. When you break that, you're violating a norm of *individual* rationality—specifically, the norm of stability in intention. You're being unreliable.

  **Greta:** Unreliable to whom? To you?

  **Mark:** To me, as a fellow agent relying on your predictability.

  **Greta:** No, no. That's the trap. If the obligation is just me-to-you, based on your reliance on me, then I can dissolve it unilaterally by notifying you. "Sorry Mark, I've updated my utility function. I'm going home." If I tell you, your reliance is gone. Your plan is frustrated, sure, but you can't say I *wronged* the activity. But that's not how it feels. When we walk together, we create a "plural subject." The commitment isn't mine, and it isn't yours. It's *ours*. To rescind it, *we* have to agree to rescind it.

  **Mark:** "Ours." *(Kicks a leaf)* This is the part that sends me up the wall. What is the "we" that holds the commitment? It's just Mark and Greta. There is no third entity hovering above the path. If you say "we committed," you're just using shorthand for "Mark committed and Greta committed, in common knowledge."

  **Greta:** It's not shorthand. It's a new status. Think of it like a contract. When two parties sign a contract, they create obligations that didn't exist before. You wouldn't say a contract is just "shorthand" for two people thinking nice thoughts about each other. The joint commitment creates a normative structure that binds the individuals. The "plural subject" isn't a mystical egregore, Mark. It's not a hive mind. It's simply the recognition that in this specific domain, our wills are no longer operating independently. They are pooled.

  **Mark:** But *how* are they pooled? Mechanically? Psychologically? If I look inside your head, I find Greta's intentions. If I look in mine, I find Mark's. I don't find a "Group-Intention" floating in the ether. My parsimony alarm is ringing. You're multiplying entities beyond necessity. I can get you the rebuke without the metaphysics.

  **Greta:** Can you? Let's test it. Suppose we're walking, and I say, "I'm tired, I'm stopping." You say, "But we agreed." I say, "I know, but I don't care anymore." On your view, what is my violation? I've just changed my mind. I'm no longer intending that we walk. My intention is no longer meshing with yours. So now *you* should stop intending that we walk, because your condition ("conditional on your intending it too") is no longer met. Rationality dictates you drop the intention. So where is the wrong?

  **Mark:** The wrong is in the *formation* of the intention, or the communication thereof. If I lead you to believe I will stabilize my intention for the sake of coordination, and I don't, I've been misleading. I've violated a norm of honesty or social cooperation.

  **Greta:** That's a moral norm, external to the action. I'm talking about the internal norm of the activity itself. The right to rebuke is constitutive of walking together. It's not that you're a liar; it's that you've abandoned *us*. And you can't abandon *us* without *our* consent. That's the phenomenological datum. Any theory that explains away the "us" is explaining away the phenomenon.

  **Mark:** I'm not explaining away the "us." I'm analyzing it. Look, social life is complex. We have feedback loops. I track you, you track me. We adjust speeds. That mutual responsiveness *is* the togetherness. You want to say there's a "joint commitment" that *causes* the responsiveness. I say the responsiveness, sustained by interlocking intentions, *is* the commitment. You're reifying a process into a thing.

  **Greta:** I'm reifying a *normative bond*. That's the key. It's not about the physical walking. It's about the entitlement to demand. Why am I entitled to demand you keep walking? Not because I'm dependent on you. I could walk alone. I'm entitled because I am a co-author of this joint action. By participating, you've given me a piece of your autonomy regarding this action.

  **Mark:** "Given me a piece of your autonomy." That sounds poetic, but cash it out. What does that mean physically? It means you've created an expectation in me that you know I'm relying on.

  **Greta:** It means you can't opt out at will. That's the test. If it were just interlocking individual intentions, I could opt out at will by changing my intention. "Oh, I no longer intend that we walk." Poof. The interlock breaks. But in reality, I *ought not* to opt out at will. The obligation persists *despite* my change of mind. That persistence is the fingerprint of the joint commitment. Your individualism can't explain why my change of mind isn't sufficient to dissolve the bond.

  **Mark:** I can explain it through the cost of disruption. If I intend that we walk, I'm factoring in the stability of your intention. If you change your mind capriciously, you're imposing a cost on my planning agency. We have a general moral duty not to impose costs on others without reason. So, you shouldn't opt out at will.

  **Greta:** But that makes the obligation contingent on the *cost*. Suppose I stop walking, but you don't care. You're happy to sit on the bench. On your view, no harm, no foul. No frustrated plan, no violation. But on my view, you still violated the joint commitment! We were walking together. You bailed. Even if I'm fine with it, you needed *my* concurrence to stop. The obligation is to the plural subject, not to Mark's utility function.

  **Mark:** *(Stops walking)* Wait. If we're sitting on the bench, and I say "I'm leaving," and you say "Okay," did we violate anything?

  **Greta:** No, because we rescinded jointly.

  **Mark:** Exactly. Coordination. That's all it is. If I leave without asking, I break the coordination. I make future coordination harder. I damage my reputation as a reliable partner. That's a huge pragmatic cost. Why do we need a "plural subject" to explain that? It's just repeated game theory with intentions.

  **Greta:** *(Stops too, turning to face him)* Because game theory explains why I *might* punish you. It doesn't explain why I *have the right* to punish you. There's a difference between a sanction and a rebuke. A mugger imposes a cost on me; I don't have a right to rebuke him for his business model. I have a right to rebuke *you* because we constituted a "we." You're worried about ontological bloat, Mark. I'm worried about normative anemia. If you reduce the "we" to a bunch of "I"s, you lose the specific glue that makes society possible. You make every social bond a negotiation between sovereign individuals.

  **Mark:** And you make every social bond a mini-totalitarian state where the "Group" owns a slice of my will. I'm trying to save individual agency from being swallowed by the collective. If "we intend" is primitive, where does it end? Does the Company intend? Does the State intend?

  **Greta:** Yes! Or rather, they can. When people jointly commit to act as a body, they create a corporate agent. That's not scary; that's just what institutions *are*.

  **Mark:** That's how you get moloch. That's how you get egregores that eat their creators.

  **Greta:** Or it's how you get a promise that means something more than a prediction of behavior. Look, I'm not saying the Plural Subject is a ghost. It's a normative reality. Just like "money" isn't just paper; it's a status we assign. Joint commitment assigns a status to us: we are now a unit for the purpose of J-ing.

  **Mark:** But the status is *in the heads*. It's common knowledge. "We both know we both know." That's the glue. It's not a new subject; it's a recursive state of information and intention.

  **Greta:** Recursive states don't generate obligations. Facts don't generate oughts. You can have all the common knowledge in the world. "I know you know I want to walk." So what? Why *must* I keep walking?

  **Mark:** Because I've invited you into my plan. I've made your action a sub-routine of my agency.

  **Greta:** And I'm saying that by doing so, we've created a new agent, however minimal, that holds the plan. The "We." And that "We" has a claim on both of us that neither of us has on ourselves individually.

  **Mark:** *(Starts walking again, slower)* I think we're at the fork. Literally and figuratively.

  **Greta:** *(Looks at the path splitting left and right)* So, do we break the joint commitment?

  **Mark:** If I go left and you go right without discussing it, I'm proving my point. It's just two individuals diverging.

  **Greta:** And if we stop and decide together which path to take, I'm proving mine. We act as a unit.

  **Mark:** I'll concede this: acting as a unit is a useful heuristic. It feels real. But I maintain it's a composite reality, not a fundamental one.

  **Greta:** And I maintain that the composite *is* the fundamental reality of social life. You can't find the "team" by analyzing the players in isolation.

  **Mark:** *(Sighs)* Left?

  **Greta:** Only if we agree.

  **Mark:** *(Pauses)* ...I intend that we go left, conditional on you intending it.

  **Greta:** *(Smiles)* And I jointly commit to that. Shall we?

  **Mark:** Shall we.

  *(They turn left together, the pace re-matching instantly, the disagreement unresolved but the walk continued.)*
