      *   *SPR Methodology:* Sidgwick wasn't a gullible believer. He was a skeptic seeking proof. The SPR was founded *specifically* to apply scientific rigor to claims that mainstream science dismissed out of hand. He valued large sample sizes, controlled conditions, and statistical analysis (e.g., the Census of Hallucinations).
