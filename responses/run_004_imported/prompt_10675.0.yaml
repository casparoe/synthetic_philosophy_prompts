answer: |-
  This is a profound question that cuts to the heart of Sidgwick's philosophical integrity. To reconstruct his reaction, we must avoid caricaturing him as a wistful Victorian spiritualist. Sidgwick was not a believer seeking confirmation; he was a rigorist seeking a premise. His involvement with the Society for Psychical Research (SPR) was not an abandonment of reason for mysticism, but an attempt to expand the empirical data available to moral philosophy.

  Based on his writings in *The Methods of Ethics*, his letters, and the founding principles of the SPR, here is a reconstruction of how Sidgwick would likely process the Bem affair and the subsequent replication crisis.

  ### 1. On Methodology: Vindication, Not Betrayal
  Sidgwick would likely view the rise of preregistration and the failure of Bem's results to replicate not as a defeat for psychical research, but as the **maturation of the very rigor he championed.**

  Sidgwick's primary frustration with 19th-century science was not that it disbelieved in psi, but that it was often dogmatic, dismissing anomalies *a priori* without examination. However, his remedy was never to lower scientific standards; it was to apply them more strictly than the mainstream. In the SPR's early reports, Sidgwick consistently argued against relying on anecdotal testimony, pushing instead for census-style data collection and statistical analysis (such as the "Census of Hallucinations").

  When encountering Bem's 2011 paper, Sidgwick would initially be encouraged by the venue (*Journal of Personality and Social Psychology*) and the use of standard statistical protocols. This mirrored his own hope: that psi could be normalized through conventional scientific language. However, Sidgwick possessed a keen understanding of probability. In *The Ethics of Belief*, he argues that the weight of evidence required is proportional to the improbability of the claim.

  When the replication crisis hit, Sidgwick would not be shocked by the collapse of the p-values. He would recognize that Bem's "significant" deviations were likely artifacts of what we now call "researcher degrees of freedom" (p-hacking). Sidgwick would see the subsequent demand for preregistration as the logical endpoint of the SPR's original mission: to eliminate bias and self-deception. He would likely argue that the field's turn toward open science validates the SPR's original insistence that **psychical research must be indistinguishable from physical research in its strictness.** If the phenomena cannot survive the filter of preregistration, they do not meet the threshold of "moral certainty" required to alter our view of the universe.

  ### 2. On the Dualism: A Deepening of the "Fundamental Paradox"
  While he would accept the methodological correction, the philosophical consequence would be devastating. This is where the melancholy you mention would resurface, but with a specific, Stoic quality.

  Sidgwick's "dualism of practical reason" rests on the fear that if death is the end, there is no rational guarantee that virtue will align with happiness. He hoped psychical research could provide an empirical bridge to turn this postulate into a fact. If Bem's results had held up, it would have suggested a universe where time and causality are non-linear, opening the door to a conception of the soul that survives bodily death.

  With the collapse of Bem's findings, Sidgwick would be forced to re-affirm the conclusion he reached in the final chapter of *The Methods of Ethics*: that the conflict between self-interest and duty is rationally irresolvable on empirical grounds. However, he would not retreat into fideism. He would not say, "I believe anyway."

  Instead, he would likely deepen his commitment to what we might call **epistemic honesty as a moral duty.** For Sidgwick, believing a falsehood to comfort oneself is itself a violation of rationality. If the universe is fundamentally dualistic and morally chaotic, the rational agent must acknowledge that chaos. He would view the failure of Bem's experiments as a tragic confirmation that the "moral order" of the universe is not accessible through empirical science. The gap between duty and self-interest remains, and it must be bridged by faith or practical postulation (à la Kant), not by data.

  ### 3. The Specific Reaction to "Significant" Psi
  Sidgwick would likely offer a sharp critique of the psychological community's initial reception of Bem. He often criticized scientists who accepted spiritualist claims too easily, but he also criticized those who dismissed them without looking. In the case of Bem, he might argue the error was in treating a **statistical anomaly as an ontological proof** without sufficient prior scrutiny.

  In his correspondence regarding the SPR, Sidgwick frequently distinguished between "evidence that suggests" and "evidence that proves." He would likely argue that Bem's p-values, while mathematically significant, were philosophically insufficient given the extraordinary nature of the claim. He would see the replication crisis as a necessary purification. He might write something akin to:

  > *"We sought to prove the anomalous to save the rational coherence of ethics. In doing so, we must not permit the desire for the conclusion to corrupt the premises. If the strictest scrutiny dissolves the phenomenon, then the phenomenon was never there. To cling to it is not faith; it is intellectual dishonesty."*

  ### 4. Conclusion: The Tragic Rigorist
  Ultimately, Sidgwick's reaction would be a mixture of **methodological satisfaction and existential disappointment.**

  He would be satisfied that the scientific enterprise eventually corrected itself through replication and stricter protocols, vindicating the SPR's insistence that psychical claims must withstand the harshest skepticism. He would see the modern "crisis" not as a failure of science, but as science functioning exactly as he hoped it would: self-correcting and ruthless against error.

  However, this vindication would come at the cost of his deepest philosophical hope. The failure of Bem's work to hold up would reinforce the "dualism of practical reason" as a permanent feature of the human condition. Sidgwick would likely conclude that we cannot look to the laboratory to save our ethics. The reconciliation of self-interest and morality must remain a matter of practical faith, not empirical proof.

  He would not despair into nihilism; Sidgwick was too disciplined for that. But he would likely view the modern inability to validate psi as a sign that the universe is not constructed for our moral comfort. He would accept this bleakness, not with a sigh of resignation, but with the clear-eyed resolve of a philosopher who values truth above consolation. The rigor is vindicated; the hope is not. And for Sidgwick, the rigor must always win.
