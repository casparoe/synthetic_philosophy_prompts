answer: |-
  This is a classic workplace conflict that pits **technical validity** against **social dynamics**.

  To answer your specific questions directly:
  1.  **Does Mark's history disqualify him from enforcing quality?** No.
  2.  **Were you wrong to call him out?** In the *way* you did it (publicly), yes.

  Here is the breakdown of why this happened, why the team is split, and how you can fix it.

  ### 1. The "Hypocrisy" Trap
  Your instinct is natural. It feels unfair when someone demands standards they didn't follow. However, in software engineering, **standards evolve.**

  Code written five years ago often reflects the knowledge, constraints, and culture of five years ago. Mark's argument—"I screwed up back then, which is exactly why I'm strict now"—is actually a very strong position. It shows growth. If he were claiming he *never* made mistakes, he would be lying. Acknowledging past failures to prevent future ones is a sign of seniority, not hypocrisy.

  If we disqualified everyone from enforcing rules they once broke, no one would ever be allowed to enforce security, testing, or style guidelines.

  ### 2. The Medium Was the Message
  This is the critical part. You called him out in a **team channel.**

  In a professional setting, public call-outs are almost always perceived as attacks on status and character, not constructive feedback on code.
  *   **Psychological Safety:** When you shame a senior dev publicly, it signals to the rest of the team that mistakes (even past ones) will be used as weapons. This makes people defensive.
  *   **The "Gotcha" Moment:** Digging through `git blame` specifically to find ammunition feels like an investigation rather than a collaboration. Half your team likely felt uncomfortable because it violated an unspoken norm of "we fight the code, not the person."

  Mark could have handled his "lecture-y" comments better (private feedback is often kinder), but your response escalated a technical disagreement into a public interpersonal conflict.

  ### 3. The Real Issue: The Hardcoded Credentials
  You actually found something important: **hardcoded credentials.**

  That isn't just "bad style"; that is a **security vulnerability.** This is the only part of your argument that holds objective weight. However, by tying it to Mark's ego, you risked the security issue getting ignored because now it's about "Mark vs. You" instead of "Us vs. Security Risk."

  ### How to Fix This
  You can't undo the message in the channel, but you can repair the damage and still get the code fixed.

  **1. De-escalate Privately**
  Send Mark a direct message or talk to him 1-on-1.
  *   *Say:* "Hey Mark, I wanted to apologize for calling you out in the public channel. That wasn't the right place for that conversation. I get frustrated when PRs get blocked, and I let that get the better of me."
  *   *Why:* This disarms him. It shows professionalism and separates you from the "drama."

  **2. Separate the Person from the Debt**
  Raise a ticket for the legacy service, but strip Mark's name from the narrative.
  *   *Don't say:* "Mark wrote this bad code."
  *   *Do say:* "During a review of the legacy service, I noticed hardcoded credentials and a lack of test coverage. This is a security risk and technical debt we should address."
  *   *Why:* Now it's a team problem to solve, not a Mark problem to defend.

  **3. Address the "Lecture" Style**
  Once the air is cleared, you can address the friction in PR reviews.
  *   *Say:* "I agree we need higher standards. Sometimes the comments on PRs feel a bit heavy-handed. Can we agree on a checklist for requirements so we know what's needed before we submit?"
  *   *Why:* This moves the enforcement from "Mark's Mood" to "Team Agreement."

  ### The Takeaway
  Mark is allowed to be the reformed sinner preaching discipline. You are allowed to want a less preachy reviewer. But **legacy code is a team responsibility.**

  If you want to win the team over, focus on fixing the security risk without the blame game. If you focus on the code, the team will back you. If you focus on Mark's past, the team will see you as the disruptor.
