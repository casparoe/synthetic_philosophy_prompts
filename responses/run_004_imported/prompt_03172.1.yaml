answer: |-
  You have stumbled onto one of the most fascinating cracks in the foundation of early modern philosophy. You are absolutely right to be suspicious of that definition, and you are also right to sense that it isn't just a "word game." It is a desperate, rigorous, and ultimately failed attempt to solve a massive philosophical problem.

  The short answer is: **Hobbes is not fudging it to avoid a contradiction; he is fudging it to save his materialism.**

  If he accepts Euclid's definition of a point (zero magnitude), his entire philosophical system collapses. Here is the breakdown of why he redefines the point, what "undivided" actually means in this context, and why this makes him the enemy of every mathematician of his time.

  ### 1. The Materialist Axiom: "Nothing is not a Body"
  To understand why Hobbes hates Euclid's point, you have to look at his ontology (his theory of what exists).

  For Hobbes, the universe is purely material. "Substance" and "Body" are the same thing. To exist is to be extended in space.
  *   **Euclid's Point:** Has no parts, no magnitude, and zero dimension.
  *   **Hobbes's Reaction:** If it has zero magnitude, it is **nothing**. And you cannot build a science of the real world out of "nothings."

  If Hobbes admits that a geometric point has no size, he admits that geometry deals with abstract fantasies rather than physical reality. But Hobbes wants geometry to be the study of *physical* space. Therefore, a point *must* have size, even if it's tiny.

  When he says a point is "that whose quantity is not at all considered," he is making an **epistemological** claim (about how we know/calculate), not an **ontological** one (about what exists). He is saying: *"This thing physically has size, but for the sake of this specific equation, we are pretending it doesn't."*

  ### 2. "Indivisible" vs. "Undivided" (The Word Game that Isn't)
  This is the specific distinction you flagged, and it is the key to his whole system.

  *   **Indivisible (Atomism):** This implies that the thing *cannot* be divided, even in principle. It is a metaphysical limit. If you cut it, it ceases to be. Hobbes rejects this because he believes matter is infinitely divisible. There is no smallest chunk of matter.
  *   **Undivided (Hobbes's Point):** This implies that the thing *could* be divided, but we are choosing not to divide it *right now*.

  **Why does this matter?**
  If a point were "indivisible," it would be an atom. If it's an atom, it has a fixed, hard limit. But Hobbes is trying to describe motion ("Endeavour"). Motion is fluid. If space is made of hard, indivisible atoms, motion becomes jerky and impossible to calculate smoothly.

  By calling it "undivided," Hobbes is trying to have his cake and eat it too. He wants the point to be small enough to act like a mathematical point (so the math works), but large enough to be a physical body (so his philosophy holds). He is essentially describing what we would now call an **infinitesimal**, but he refuses to admit it's a mathematical abstraction. He insists it is a physical reality that we are just ignoring the dimensions of.

  ### 3. The Physics of "Endeavour" (Proto-Calculus)
  The definition of "Endeavour" (*conatus*) is Hobbes trying to invent calculus before Newton and Leibniz got there.

  He is asking: *When an object starts moving, what is the very first instant of motion?*
  *   If time is infinitely divisible, there is no "first instant."
  *   If space is infinitely divisible, there is no "first distance."

  Hobbes needs a "first distance" and a "first time" to define velocity and force. So he defines "Endeavour" as motion through the "length of a Point" in an "Instant of Time."

  He knows this sounds contradictory (how can you move through a point?). That is why he adds the caveat: *"less then can be determined or assigned by Exposition or Number."*

  He is describing a **limit**. He is saying, "Imagine a distance so small that no number can name it, but it is not zero." In modern calculus, we solve this with limits ($\lim_{x \to 0}$). Hobbes doesn't have limits. He has "undivided bodies." He is trying to solve a mathematical problem with a physical hammer.

  ### 4. The Historical Context: Hobbes vs. The Mathematicians
  This isn't just theoretical; this is why Hobbes was mocked by the Royal Society.

  There was a famous feud between Hobbes and the mathematician John Wallis. Wallis represented the new wave of algebraic and abstract mathematics. Hobbes represented the old guard of geometry-as-physics.
  *   **Wallis:** Math is a system of symbols and logic. A point can be zero magnitude because it's an idea, not a rock.
  *   **Hobbes:** Math is the study of cause and effect in bodies. If your "point" isn't a body, your math is nonsense.

  Hobbes spent the last 20 years of his life trying to "square the circle" (a geometric impossibility) because he believed the impossibility only existed in abstract math, not in physical reality. He thought the mathematicians were a "cult of ignoramuses" who were divorcing logic from the physical world.

  ### The Verdict: Is he fudging?
  **Mathematically? Yes.**
  He is confusing the map with the territory. He is treating a methodological tool (ignoring magnitude for calculation) as a physical property (the magnitude is there, just hidden). This leads to contradictions that calculus later resolved by accepting that points *are* abstract and dimensionless.

  **Philosophically? No.**
  It is entirely consistent with his system. If you accept Hobbes's premise that **"To be is to be a Body,"** then you *must* redefine the point. You cannot have a geometry of "nothings."

  The "Indivisible vs. Undivided" distinction is his way of saying: *"I know this looks like an atom, but I promise it's not. It's just a piece of matter that I'm asking you to stop looking at too closely so we can calculate velocity."*

  ### Why this matters for your class
  Since you are studying the Scientific Revolution, this obsession of yours is actually perfect. The Scientific Revolution wasn't just about discovering new facts; it was about deciding **what counts as an explanation.**

  *   **The Mathematicians (Wallis, Newton, etc.)** won because they allowed math to be abstract. They let the point be zero.
  *   **Hobbes lost** because he demanded that every mathematical concept correspond to a physical object.

  Hobbes represents the limit of the "Mechanical Philosophy." He pushed the idea that "everything is a machine/body" so hard that he broke mathematics. Reading *Concerning Body* shows you the moment where materialism hit a wall and had to let abstraction take over.

  So, keep reading him. He's not just confused; he's the guy who stood on the shore of modern physics, saw the ocean of abstract math, and tried to walk on it because he refused to believe in boats.
