      *   *Nuance:* If the justification for saving the 5 is "there are more of them," is that fundamentally different from "their total utility is higher"?
      *   *Taurek's Rebuttal (Hypothetical):* The 5 don't feel the "more-ness." Each only feels their own death. The fact that there are others dying alongside me doesn't make *my* loss worse. So why should the *decision-maker* care that there are more complaints?

  5.  **Address "Separateness of Persons":**
      *   *Rawls' Concept:* Often used to critique utilitarianism (treating society as one super-person).
      *   *Taurek:* Takes it literally. No interpersonal comparison of value.
      *   *Parfit:* Takes it seriously but argues that ignoring numbers violates the equal weight of each person's claim. If I ignore the 5 to save the 1, I am disregarding the 5 individual claims in favor of the 1.
      *   *Who wins?* This is the crux. Taurek says aggregation violates separateness. Parfit says *ignoring* numbers violates the equal standing of separate persons.

