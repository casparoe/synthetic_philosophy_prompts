answer: |-
  You have hit on one of the most fertile and enduring debates in normative ethics. You are absolutely right that Taurek is often strawmanned as a confused utilitarian who can't do math. He isn't. His argument is deontological/contractualist in spirit: it's about fairness and the metaphysics of suffering, not maximizing good states of affairs.

  Parfit's 1978 reply, "Innumerate Ethics," is the canonical response, but whether it *actually* refutes Taurek depends on whether you accept Parfit's shift from **summing value** to **counting claims**.

  Here is the breakdown of the clash, the validity of Parfit's move, and who actually owns the "separateness of persons."

  ### 1. Taurek's Core: The Absence of a "Super-Observer"
  Taurek's argument rests on two pillars that the EA/LW crowd often glosses over:

  1.  **Metaphysical:** There is no entity that suffers the "sum" of five deaths. David suffers the loss of his life. The five each suffer the loss of their lives. There is no "group mind" that feels five times the pain. Therefore, from the perspective of the universe (or the moral agent), there is no *single* scale on which "5 deaths" weighs more than "1 death."
  2.  **Fairness:** Since there is no aggregated loss, the only relevant moral fact is that six individuals have an equal claim to be saved. If I save the five, I have effectively overridden David's claim because he was outnumbered. To treat them all as equals, Taurek argues, I must give each *individual* an equal chance.
      *   *Note:* This doesn't mean a 1-in-6 lottery for each person. Taurek famously suggests a coin flip between the *parties* (David vs. The Group). This gives David a 50% chance and the Group a 50% chance. (Critics like Parfit point out this gives the individuals in the group a lower chance than David, which seems unfair, but Taurek views the "group" as a bargaining unit).

  **Taurek's view on Separateness:** He takes it literally. To aggregate is to pretend the persons are cells in a single body. That is a category error.

  ### 2. Parfit's Reply: The Complaint Model
  Parfit agrees with Taurek that we shouldn't sum "units of badness" like utilitarian beads on a string. However, he argues Taurek misses the moral significance of **individual complaints**.

  Parfit's move is to shift the locus of evaluation from the *outcome* to the *claims of the individuals affected*.
  *   **Scenario A (Save David):** Each of the five has a valid complaint: "You let me die when you could have saved me." David has no complaint.
  *   **Scenario B (Save the Five):** David has a valid complaint: "You let me die when you could have saved me." The five have no complaint.

  Parfit argues that Scenario A generates **five distinct complaints**, while Scenario B generates **one**.
  Crucially, Parfit insists this is not aggregation. He isn't saying "5 complaints = 5 units of badness." He is saying: "If we choose A, we are disregarding five separate moral claims. If we choose B, we are disregarding one."

  Parfit argues that we have a reason to minimize the number of people who have a valid complaint against our action. This allows the numbers to count without positing a "super-observer" who feels the sum of the loss.

  ### 3. Does Parfit's Move Work? (Or is it Aggregation in Costume?)
  This is the billion-dollar question.

  **The Case for "It Works":**
  Parfit successfully decouples "numbers counting" from "classical utilitarianism." He respects Taurek's constraint that value is located in individuals. He acknowledges that the five do not feel each other's pain. However, he argues that the *decision-maker* stands in a relationship to all of them. The decision-maker isn't summing their pain; the decision-maker is counting how many people they are failing to assist. It transforms the problem from "maximizing value" to "minimizing justified grievances."

  **The Case for "It's Aggregation in Costume":**
  Taurek (and later critics like Michael Otsuka) would argue Parfit is smuggling aggregation in through the back door.
  *   **The Charge:** If the justification for saving the five is ultimately "because there are more of them," you are still treating the *number of people* as a weight that can outweigh the *claim of one person*.
  *   **The Metaphysical Objection:** Taurek would ask: "Why does the existence of four *other* people with complaints make *my* complaint less relevant?" From David's perspective, the fact that five others are dying doesn't make his death less significant. Parfit's model still requires an external perspective that can compare the set of 5 complaints against the set of 1 complaint. That external perspective is exactly the "super-observer" Taurek denied exists.

  **Verdict:** Parfit's move works *if* you accept that morality is about justifying our actions to each person affected (a contractualist move). It fails if you hold Taurek's stricter view that no interpersonal comparison of claims is permissible. Parfit saves the numbers, but he arguably concedes the metaphysical point to Taurek while winning on procedural grounds.

  ### 4. The "Separateness of Persons" Showdown
  Who is actually more consistent with taking the separateness of persons seriously? This is the deepest layer of the debate.

  **Taurek's Claim:**
  Aggregation violates separateness because it treats society as a super-person. If I sacrifice David for the five, I am using David as a means to satisfy the "greater loss" of the group. Since the group has no consciousness, this "greater loss" is a fiction. Taurek is the purist here.

  **Parfit's Counter-Claim:**
  Parfit argues that **ignoring** the numbers violates the separateness of persons *more*.
  *   If you flip a coin (50/50 between David and the Group), you are giving the five individuals a 10% chance each (if distributed equally) or treating their collective interest as equal to David's individual interest.
  *   Parfit argues that each of the five has a claim *equal in weight* to David's. If you have five claims of weight X and one claim of weight X, and you ignore the five to satisfy the one, you are not respecting the distinctness of those five persons. You are treating their distinct claims as if they didn't exist.
  *   For Parfit, respecting separateness means respecting that **each** of the five has a reason to be saved that is just as strong as David's. To disregard five strong reasons for one strong reason is to fail to respect the plurality of persons.

  **The Synthesis (Scanlon's Contractualism):**
  T.M. Scanlon later formalized Parfit's intuition in *What We Owe to Each Other*. The principle is: An act is wrong if it violates principles that no one could reasonably reject.
  *   **David's Rejection:** "I die."
  *   **The Five's Rejection:** "We each die."
  *   Scanlon argues that a principle allowing you to save the one over the five *could* be reasonably rejected by the five, but a principle saving the five *could not* be reasonably rejected by David (because his complaint is no stronger than any single one of theirs).

  ### Conclusion: Who Wins?
  If your definition of "separateness of persons" is **metaphysical** (no one feels the sum), **Taurek wins**. There is no sum. Parfit cannot escape the fact that he is comparing sets of individuals from an external viewpoint.

  If your definition of "separateness of persons" is **moral/political** (each person's claim demands equal respect), **Parfit wins**. Ignoring the five treats their individual claims as morally invisible. Parfit rescues the intuition that we should save the five without needing to posit a "greater good" entity. He shows that you can count the people without summing their utility.

  **Is Parfit's move just aggregation in costume?**
  Yes, but that might be a feature, not a bug. It is "aggregation of claims" rather than "aggregation of value."
  *   **Utilitarian Aggregation:** $Value(5) > Value(1)$.
  *   **Parfitian Aggregation:** $Count(Claims_5) > Count(Claims_1)$.

  For the EA/LW mindset, Parfit is the more useful framework because it preserves the "save the 5" conclusion (which is instrumentally necessary for EA to function) while insulating it from the "repugnant conclusion" style critiques that Taurek launches. However, Taurek remains the stronger *metaphysician*. He correctly identifies that the "weight" of five lives is not a physical property of the universe, but a moral construct of the observer. Parfit accepts this but argues the moral construct is obligatory.

  **Final Verdict:** Parfit is more consistent with a **relational** view of morality (what we owe to distinct persons). Taurek is more consistent with a **phenomenological** view of morality (what is actually experienced). If you believe ethics is about minimizing complaints rather than mirroring experienced suffering, Parfit saves the day. If you believe ethics must track experienced suffering strictly, Taurek is right, and we have to accept the coin flip.
