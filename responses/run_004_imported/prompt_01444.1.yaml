answer: |-
  You have hit on one of the most common misunderstandings of Anscombe's pamphlet, and it is a fascinating one because it reveals a major fault line in 20th-century moral philosophy.

  The short answer is: **You are missing the philosophical framework she is using.** You are interpreting her argument as consequentialist (utilitarian), but Anscombe was famously, vehemently **anti-utilitarian.**

  If her argument were utilitarian, your counter-argument (Operation Downfall casualty estimates) would indeed be a knockdown reply. But because her argument is deontological (based on duty, rules, and intention), the body-count comparison is irrelevant to her specific case.

  Here is the breakdown of why your "knockdown reply" doesn't land on Anscombe, and what she was actually arguing.

  ### 1. Anscombe vs. Utilitarianism
  G.E.M. Anscombe is arguably the most important figure in reviving virtue ethics and natural law theory in the analytic tradition. Her most famous paper, *"Modern Moral Philosophy"* (1958), is essentially a demolition job on utilitarianism and consequentialism.

  In *"Mr. Truman's Degree,"* she is not arguing that the bombs were wrong because *too many* people died relative to the benefit. She is arguing that the bombs were wrong because they involved the **direct, intentional killing of the innocent.**

  For a utilitarian, the morality of an act is determined by the outcome (the math).
  For Anscombe (following Aquinas and Catholic natural law), the morality of an act is determined by the **nature of the act itself and the intention of the agent.**

  ### 2. The Argument from Intentionality
  Anscombe's core claim is that there are certain actions that are intrinsically evil and cannot be justified by good consequences. Deliberately targeting non-combatants is one of those actions.

  She distinguishes between:
  *   **Foreseen but unintended consequences:** (e.g., bombing a munitions factory and unfortunately killing nearby civilians as collateral damage).
  *   **Intended means:** (e.g., bombing a city *in order to* kill civilians and break morale).

  Anscombe argued that the atomic bombings (and the earlier firebombing of Dresden/Tokyo) were of the second category. The destruction of civilian life was not an unfortunate side effect; it was the *mechanism* by which victory was sought.

  Therefore, bringing up Operation Downfall casualty estimates commits a category error in her framework. To Anscombe, you cannot commit murder (killing the innocent) to prevent potential future deaths, even if the math says you save more lives. She would argue that Truman acted as a murderer, and a university should not honor a murderer, regardless of whether his murder "saved" people later.

  ### 3. Why the "Downfall" Counter-Argument is Common (But Misses Her Point)
  You asked why this isn't brought up more as a reply. It actually *is* brought up constantly against **other** critics of the bomb.

  Most public discourse about the atomic bomb is consequentialist.
  *   **Pro-Bomb:** "It saved 1 million lives by avoiding invasion."
  *   **Anti-Bomb:** "No, it didn't, Japan was already surrendering / the Soviet entry was the real cause."

  Notice that both sides are fighting on the utilitarian turf of "body count." Because most modern secular ethics is implicitly consequentialist, people assume Anscombe is playing the same game.

  However, philosophers who study Anscombe know that offering her casualty estimates of Operation Downfall is like bringing a calculator to a knife fight. She explicitly rejects the premise that "good ends justify evil means." In her view, if the act is intrinsically unjust (killing innocents), the consequences are morally irrelevant to the judgment of the act itself.

  ### 4. What She Was Actually Objecting To
  It is also worth noting the specific context of the pamphlet. She wasn't just arguing about geopolitics; she was arguing about **moral corruption.**

  Her protest was against Oxford University *honoring* Truman. She argued that by giving him a degree, the University was endorsing the principle that "mass murder of innocents is acceptable if done by a statesman for a 'good' cause."

  She writes:
  > "People may perhaps be killed as an incident of your attacking a legitimate target... But they must not be killed as a means to your end, nor as an end in themselves."

  She compares Truman to a pirate who kills hostages to ensure his escape. Even if the pirate's escape prevents a larger war later, the pirate is still a murderer.

  ### 5. Did She Ignore the "Necessity" Argument?
  She addresses the idea of "necessity" directly. She concedes for the sake of argument that the bombs might have shortened the war. She writes:

  > "It is not for me to judge whether the war was justified... But I say that Mr. Truman's act was that of a murderer."

  She essentially says: Even if we grant your utilitarian premise that the invasion would have been bloodier, it does not cleanse the moral stain of the specific act of dropping the bomb.

  ### Summary
  You aren't missing a historical fact; you are missing a philosophical distinction.

  *   **Your Argument:** Consequentialist. (Truman is justified because Result A > Result B).
  *   **Anscombe's Argument:** Deontological/Natural Law. (Truman is unjustified because Act X is intrinsically evil).

  The reason your "knockdown reply" feels so strong is that, in modern secular discourse, the consequentialist framework is dominant. We are all trained to think like utilitarians now. Anscombe was one of the last great philosophers arguing that some things are simply forbidden, regardless of the calculus.

  So, the "Operation Downfall" argument works perfectly against a utilitarian critic of Truman. It bounces right off Anscombe, because she denies the validity of the ledger entirely.
