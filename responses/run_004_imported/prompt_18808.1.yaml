      *   *Key Insight:* The market price *is* $P(B|A)$. Lewis says there is no *proposition* $C$ such that $P(C) = P(B|A)$. But the market doesn't need to trade a proposition $C$; it trades the value $P(B|A)$ directly via the resolution rule.
