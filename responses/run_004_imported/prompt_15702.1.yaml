      *   **Section 1: The Category Error.** Why functionalism fails. If a thermometer gives a wrong reading that benefits the thermometer (impossible, but hypothetically), is it deceptive? No. The *mechanism* matters. In AI, conflating sycophancy (pleasing the user) with strategic deception (manipulating the user for a hidden goal) leads to wrong interventions.
      *   **Section 2: Naturalizing Mind.** How to define belief/intent without dualism.
