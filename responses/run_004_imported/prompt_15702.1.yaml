      *   **User's Stance:** They prefer the mentalistic view (or at least see value in it) and feel the functional view erases important distinctions (lying vs. hallucinating vs. role-playing).
      *   **Task:** Argue the "less fashionable side" (the mentalistic/internal state view).
      *   **Key Requirements:**
          1.  Make the strongest case that genuine deception requires something functionally equivalent to belief and intent.
          2.  Explain why dropping this makes "deception" useless as a category.
