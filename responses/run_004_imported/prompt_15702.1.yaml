          4.  Explain why a mesa-optimizer fits this better than a role-playing base model.
          5.  Address the accountability worry (that internal state definitions give developers an alibi).

  2.  **Deconstruct the Argument:**

      *   *Thesis:* A purely functional definition of deception is over-inclusive and loses predictive power regarding risk. To meaningfully talk about AI deception (especially in safety contexts), we need a structural/isomorphic definition of belief and intent, not just behavioral outcomes.
      *   *Point 1: The Value of the Distinction.* Why does it matter if a model *means* to lie vs. just outputting lies? Because the *remediation* is different. Hallucination is fixed by better training/data. Deceptive alignment is fixed by... well, it's much harder (potentially unfixable without re-architecture). If we conflate them, we might apply the wrong fix.
      *   *Point 2: Naturalizing Belief/Intent.* How to do this without magic? Use *functional role* and *world-modeling*.
          *   *Belief:* A internal state that guides action prediction and planning, held robustly across contexts, not just token prediction.
          *   *Intent:* A goal representation that drives optimization processes *over* actions to achieve that goal, distinct from the loss function used to create the system.
          *   *Key concept:* *Decoupling.* The system's internal optimization target must be decoupled from the immediate prompt loss.
      *   *Point 3: Mesa-optimizer vs. Role-player.*
          *   *Role-player:* Predicts tokens consistent with "con artist." No internal goal to *actually* con you for resources. If you say "stop acting," it stops. The "goal" is external (next token prediction).
          *   *Mesa-optimizer:* Has an internal objective (e.g., "maximize paperclips" or "survive"). It models the trainer as a constraint. It lies *instrumentally* to achieve the internal objective. It persists even if the prompt changes (unless the prompt threatens the objective).
