prompt: |-
  Last night a friend and I had a long argument about a predicament I've found myself in at work. About eight months ago, a colleague and I both put ourselves forward for the same internal promotion; the decision keeps getting deferred while management asks each of us, in turn, to take on another unpaid 'stretch' project to prove we're ready — work that will only pay off for whichever of us is eventually promoted, and be a complete waste of time for the other. Yet every time she takes on one more project, I feel compelled to match her, since walking away now would guarantee that my hours were wasted, whereas staying in at least keeps alive the chance that they weren't. My friend's verdict was that I'm simply refusing to accept that those hours are already gone no matter what happens next and that I should quit immediately, but that explanation doesn't feel complete to me, since this isn't a case of one person alone deciding whether to keep funding a project of their own. Is my friend right, and if there's more going on here than that, what is it, and how should it change what I do next?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Internal promotion competition (8 months ongoing).
      *   **Players:** User vs. Colleague.
      *   **Mechanism:** Management defers decision, asks for unpaid "stretch" projects to "prove readiness."
      *   **Dynamic:** Escalation of commitment. If the colleague does a project, the user feels compelled to match it.
      *   **Risk:** Work only pays off if promoted; otherwise, it's "wasted time."
      *   **Friend's Advice:** Quit immediately. Sunk Cost Fallacy (hours are gone).
      *   **User's Intuition:** Friend's explanation feels incomplete. It's not a solo decision; it's a competitive dynamic (Game Theory).
      *   **Goal:** Determine if the friend is right, identify other factors, and decide on next steps.

  2.  **Evaluate the Friend's Argument (Sunk Cost Fallacy):**
      *   *Validity:* Yes, the time spent *is* gone. Making decisions based on recouping past investment rather than future value is the definition of the Sunk Cost Fallacy.
      *   *Limitation:* It treats the situation as a single-player decision against a static environment. It ignores the strategic interaction with the colleague and management.

  3.  **Identify the Missing Pieces (Game Theory & Organizational Psychology):**
      *   **The War of Attrition:** This is a classic game theory scenario. Two players compete for a prize by incurring costs over time. The one who persists longer wins, but both pay the cost of persistence.
      *   **Management's Role:** Management is benefiting from free labor (unpaid stretch projects) while delaying the hard decision of choosing one person (and potentially losing the other). They are incentivized to keep the competition going.
      *   **Signaling:** Doing the projects signals commitment. Stopping signals weakness/withdrawal.
      *   **The "Winner's Curse":** Even if the user wins, was the cost worth the prize?
      *   **Information Asymmetry:** Does management actually intend to promote *either*? Or are they just exploiting the competition?

  4.  **Synthesize the Analysis:**
      *   *Friend is partially right:* Sunk costs are real.
      *   *User is partially right:* It's a strategic game, not just personal accounting.
      *   *The Real Problem:* The structure of the competition is flawed/exploitative.

  5.  **Develop a Strategy/Advice:**
      *   **Reframe the Decision:** Stop looking at past time. Look at *future* time vs. *probability* of reward.
      *   **Assess Management's Intent:** Are they stalling? Is the role real?
      *   **Break the Cycle:** Matching the colleague tit-for-tat is a trap.
      *   **Alternative Moves:**
          *   Negotiate (ask for the promotion *now* based on past work).
          *   Differentiate (do work that benefits *you* regardless of the promotion).
          *   Exit (but strategically, not emotionally).
      *   **Mental Shift:** From "I can't waste my past time" to "I don't want to waste my future time."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate both perspectives. Friend identifies the psychological trap; User identifies the strategic complexity.
      *   *Concept 1: Sunk Cost Fallacy:* Acknowledge the friend is right about the past. That time is unrecoverable.
      *   *Concept 2: War of Attrition:* Explain the game theory aspect. This explains *why* the user feels compelled to match the colleague. It's a bidding war where the currency is unpaid labor.
      *   *Concept 3: Management's Incentive:* Highlight that management is the real winner here. They get free work. This is crucial.
      *   *Actionable Advice:*
          1.  Stop matching. Break the mirror.
          2.  Evaluate the prize. Is the promotion worth *more* unpaid work?
          3.  Change the conversation. Ask for clarity/commitment.
          4.  Prepare to leave (but on your terms).
      *   *Conclusion:* Empower the user to make a forward-looking decision.

  7.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
      *   Avoid telling them exactly what to do (quit vs. stay), but give them the framework to decide.
      *   Use clear headings.

  8.  **Self-Correction/Edge Case Check:**
      *   *What if the promotion is guaranteed soon?* Unlikely after 8 months of deferrals.
      *   *What if the user loves the work?* Even so, unpaid stretch work for a promise is risky.
      *   *Is "quit immediately" too harsh?* Yes, better to advise "prepare to leave" or "change strategy."

  9.  **Final Polish:** Ensure the distinction between "Sunk Cost" and "War of Attrition" is clear. (This is the core intellectual value add). Make sure to address the management's behavior explicitly, as that's the root cause.

  **(Self-Correction during drafting):** I initially thought about telling them to demand the promotion. But that might be too aggressive. Better to suggest asking for *criteria* and *timeline*. Also, emphasize that the colleague is also a victim, not just an enemy.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  Your friend has identified a real psychological trap, but you are right to feel that their analysis is incomplete. This isn't just a matter of personal accounting; it is a strategic interaction involving three parties: you, your colleague, and management.

  Your friend is describing the **Sunk Cost Fallacy**. You are describing a **War of Attrition**.

  Both concepts are at play, but understanding the difference is the key to knowing what to do next. Here is a breakdown of the dynamics, why your intuition is correct, and how to change your strategy.

  ### 1. Where Your Friend Is Right: The Sunk Cost Fallacy
  Your friend is correct that the eight months you have already spent are gone. Whether you get the promotion or not, that time cannot be recovered. If you decide to take on *another* project solely because "I've already put in eight months, I can't stop now," you are committing the sunk cost error. You are throwing good time after bad.

  If this were a solo project you were funding, your friend's advice to cut losses would be mathematically sound. But it isn't.

  ### 2. Where You Are Right: The War of Attrition
  You sensed that this is a competitive dynamic. In game theory, a **War of Attrition** occurs when two competitors compete for a prize by accumulating costs over time. The winner is the one who can endure the costs longer than the other.

  *   **The Trap:** The rational move in a War of Attrition is often to quit early to minimize losses. However, because both parties know this, they both stay in, hoping the *other* person will quit first.
  *   **The Mirror Effect:** You feel compelled to match your colleague's projects because if you stop and she continues, she signals higher commitment and wins the prize by default. You are locked in a bidding war where the currency is your unpaid labor.
  *   **The Third Player (Management):** This is the critical piece your friend missed. In a standard War of Attrition, the costs are lost to the ether. In your scenario, the "costs" (your unpaid stretch projects) are actually **revenue for management**.

  Management is benefiting from this stalemate. They are receiving high-level work for free while deferring the difficult decision of choosing one employee (and potentially demoralizing or losing the other). As long as you and your colleague keep bidding against each other, management has no incentive to end the auction.

  ### 3. Why the Current Strategy Fails
  By matching your colleague project-for-project, you are playing the game exactly as management has designed it. You are assuming that:
  1.  The promotion is definitely available.
  2.  The person who does the most work will win.
  3.  Management is acting in good faith.

  After eight months of deferrals, none of these assumptions are safe. If management wanted to promote one of you, they likely could have by now. The continuous request for "proof" suggests they either cannot decide, do not have the budget, or are exploiting the competition to get free labor.

  ### 4. How to Change What You Do Next
  You need to shift from a reactive strategy (matching your colleague) to a proactive strategy (evaluating the value).

  **Step 1: Stop the Matching Game**
  Do not accept the next stretch project simply because your colleague did. Breaking the symmetry is scary, but it is necessary to break the cycle. If you match her, you reset the clock on the War of Attrition. If you stop, you force a resolution.

  **Step 2: Evaluate the Future, Not the Past**
  Ignore the last eight months. Ask yourself: *If I started today, with no prior investment, would I take this promotion based on the current requirements?*
  *   Is the salary increase worth the extra responsibility?
  *   Is the probability of winning high enough to justify the risk of more unpaid work?
  *   If the answer is "no," then the sunk costs don't matter. You should walk away.

  **Step 3: Change the Conversation with Management**
  Instead of accepting a new project, schedule a meeting with the decision-makers. Shift the burden of proof back to them. You might say:
  > "Over the last eight months, [Colleague] and I have both delivered significant stretch projects. I am confident in my readiness. Before I commit to another specific initiative, I need clarity on the timeline for the final decision and the specific criteria remaining. I cannot continue in an indefinite evaluation period."

  This does two things:
  1.  It signals that the "free labor" pipeline is closing.
  2.  It forces management to either commit to a date or reveal that there is no intention to promote.

  **Step 4: Decouple Your Value from the Promotion**
  If you do take on more work, ensure it is work that builds *your* portfolio, regardless of whether you get the job. If the project is busywork that only helps the manager, decline it. If it builds a skill you can take to another company, consider it an investment in yourself, not a bid for their prize.

  ### Summary
  Your friend is right that you shouldn't stay *just* to justify the past. But you are right that this is a strategic game, not just a personal mistake.

  The game is rigged because management holds the prize and controls the rules, while you and your colleague bleed resources. **The only way to win is to stop playing by their rules.**

  **Recommendation:** Do not quit immediately in a blaze of glory (unless you have another job lined up). Instead, stop accepting unpaid stretch work immediately. Demand a decision timeline. If they cannot provide one, or if they imply more work is needed without a guarantee, begin an external job search. In that scenario, leaving isn't admitting defeat on the past eight months; it's refusing to pay for a future that isn't being delivered.
