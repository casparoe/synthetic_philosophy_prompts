answer: |-
  The short answer is **no**. Your instructor's general rule is incorrect, and the specific conclusion that maternal smoking is protective is dangerously wrong.

  This specific example is famous in epidemiology and causal inference literature, often called the **"Birth Weight Paradox."** It is widely cited not as an example of how to resolve Simpson's paradox, but as a warning against blindly stratifying by variables without understanding their causal role.

  Here is a detailed breakdown of why the stratified estimate is misleading in this case, and why the general rule ("always defer to subgroups") fails.

  ### 1. The Specific Case: Why Smoking Is Not Protective

  To understand why the stratified data lies, we have to look at the causal structure (the Directed Acyclic Graph, or DAG) rather than just the numbers.

  *   **Smoking ($X$)** causes **Low Birth Weight ($Z$)**.
  *   **Low Birth Weight ($Z$)** causes **Infant Mortality ($Y$)**.
  *   **Smoking ($X$)** also causes **Infant Mortality ($Y$)** directly (through respiratory issues, etc.).
  *   **Crucially:** There are unmeasured factors ($U$), such as genetic defects or severe maternal health complications, that cause **both** Low Birth Weight ($Z$) and **Infant Mortality ($Y$)**.

  In this structure, Birth Weight ($Z$) is a **mediator** (it lies on the causal path from $X$ to $Y$), but it is also a **collider** with respect to the unmeasured factor $U$ ($X \rightarrow Z \leftarrow U \rightarrow Y$).

  **What happens when you stratify by Birth Weight?**
  1.  **Blocking the Mediation:** By holding birth weight constant, you block the pathway through which smoking harms babies (i.e., smoking $\rightarrow$ low birth weight $\rightarrow$ death). You are no longer measuring the *total effect* of smoking.
  2.  **Collider Bias:** Because birth weight is influenced by both Smoking ($X$) and Unmeasured Defects ($U$), conditioning on Birth Weight creates a spurious negative correlation between $X$ and $U$.
      *   Imagine you look only at the "Low Birth Weight" group.
      *   A baby in this group could be low birth weight because the mother smoked ($X$), OR because the baby has a severe genetic defect ($U$).
      *   If the mother *did* smoke, it is statistically less likely that the low birth weight was caused by a severe genetic defect (since smoking is already a sufficient explanation).
      *   If the mother *did not* smoke, the low birth weight is more likely due to a severe genetic defect.
      *   Since genetic defects ($U$) drive mortality ($Y$), the non-smoking group within the low-birth-weight stratum will have higher mortality due to these defects.
      *   **Result:** Smoking appears "protective" because smokers in the low-birth-weight group are "healthier" (fewer genetic defects) than non-smokers in the same group.

  **Conclusion:** The stratified estimate is biased by **collider stratification**. The pooled estimate (showing smoking increases mortality) is actually much closer to the truth regarding the total harm of smoking, although it may still be confounded by socioeconomic factors. Smoking is unequivocally harmful, not protective.

  ### 2. The General Rule: "Always Defer to Subgroups"

  Your instructor's rule ("whenever stratifying flips the direction... defer to the subgroup") is a common simplification that is **false** as a universal principle.

  Simpson's Paradox is a statistical phenomenon describing how associations change upon conditioning. It does not, by itself, tell you which estimate is causal. To decide whether to trust the pooled or the stratified estimate, you must determine the causal role of the third variable ($Z$).

  Here are the three main scenarios:

  #### A. $Z$ is a Confounder ($X \leftarrow Z \rightarrow Y$)
  *   **Structure:** $Z$ causes both $X$ and $Y$.
  *   **Action:** You **should** stratify (adjust) for $Z$.
  *   **Result:** The pooled estimate is biased; the stratified estimate reflects the causal effect.
  *   *Example:* Age confounding the relationship between exercise and heart disease.

  #### B. $Z$ is a Mediator ($X \rightarrow Z \rightarrow Y$)
  *   **Structure:** $X$ causes $Z$, which causes $Y$.
  *   **Action:** You **should not** stratify for $Z$ if you want the *total effect* of $X$ on $Y$.
  *   **Result:** The pooled estimate reflects the total effect. The stratified estimate reflects only the *direct effect* (excluding the path through $Z$). If the indirect path is the main mechanism of harm (as in the smoking example), the stratified estimate will underestimate the harm or even reverse it.
  *   *Example:* Smoking $\rightarrow$ Tar Accumulation $\rightarrow$ Cancer. If you stratify by Tar, you might underestimate the effect of Smoking.

  #### C. $Z$ is a Collider ($X \rightarrow Z \leftarrow Y$ or $X \rightarrow Z \leftarrow U \rightarrow Y$)
  *   **Structure:** $X$ and $Y$ (or their causes) both influence $Z$.
  *   **Action:** You **must not** stratify for $Z$.
  *   **Result:** The pooled estimate is unbiased (regarding this specific path). Stratifying **creates** bias where none existed before (Selection Bias / Collider Bias).
  *   *Example:* The Birth Weight Paradox described above.

  ### 3. How to Resolve Simpson's Paradox Correctly

  The modern causal inference approach (pioneered by researchers like Judea Pearl, Miguel Hernán, and James Robins) dictates that you cannot resolve Simpson's Paradox using statistics alone. You need **subject-matter knowledge** to draw a causal diagram.

  The correct heuristic is not "always stratify," but rather the **Backdoor Criterion**:
  1.  Draw the causal diagram based on scientific knowledge.
  2.  Identify all "backdoor paths" (non-causal paths connecting $X$ and $Y$).
  3.  Adjust (stratify) only for variables that block these backdoor paths (confounders).
  4.  Do **not** adjust for variables that are descendants of $X$ (mediators) or colliders.

  ### Summary

  1.  **The Smoking Conclusion is False:** Maternal smoking is not protective. The stratified data is misleading due to collider bias and over-adjustment for a mediator.
  2.  **The General Rule is False:** You cannot decide whether to trust the pooled or stratified estimate simply by observing a reversal. You must know the causal structure.
  3.  **The Lesson:** Simpson's Paradox illustrates that association is not causation. It motivates the need for causal diagrams, not a blanket rule to "always stratify." In many cases (like mediators and colliders), stratification creates the bias rather than removing it.

  If you take one thing away from this unit, let it be this: **Statistical adjustment is not a substitute for causal thinking.** Blindly conditioning on every available variable is often worse than conditioning on none.
