answer: |-
  You have hit on one of the most persistent and damaging critiques in contemporary philosophy of science. Your intuition is spot-on: **the Newman objection does not simply vanish when you switch from Epistemic Structural Realism (ESR) to Ontic Structural Realism (OSR).** In fact, many critics (most notably Peter Ainsworth and Stathis Psillos) argue that OSR faces an *even harder* version of the problem because it lacks the epistemic "out" that Worrall tries to use.

  Here is the breakdown of why your skepticism is warranted, how the two positions compare on this specific vulnerability, and where the difference actually lands in a physical case.

  ### 1. The Core of the Newman Problem
  To ensure we are aligned: M.H.A. Newman (1928) showed that if a theory claims only that "there exists a relation $R$ on domain $D$ such that structure $S$ holds," and the only constraint on $R$ is that it satisfies the mathematical structure, then **the only factual content of the claim is the cardinality of $D$.**

  If you have a set of points of size $N$, you can define a relation on them to satisfy almost *any* structural description, provided the math works out. The relations become "gerrymandered" (e.g., "x bears relation R to y iff x is the 3rd prime number and y is the 5th").

  ### 2. ESR's Vulnerability (Worrall)
  Worrall's ESR argues that we cannot know the *nature* of entities (relata), but we can know the *structure* of their relations because structure is preserved across theory change. He uses Ramsey sentences to capture this: $\exists R_1...R_n (T(R_1...R_n))$.

  *   **The Newman Hit:** As you noted, the Ramsey sentence merely asserts the *existence* of relations satisfying the structure. It does not specify *which* relations.
  *   **Worrall's Defense:** Worrall typically responds by adding a constraint: the relations must be **causal** or **physical**.
  *   **The Problem:** This is where ESR risks collapsing. If you say "the relations must be causal," you are implicitly invoking a distinction between "natural" relations and "gerrymandered" ones. But what grounds that distinction? Usually, it's the *nature* of the relata (e.g., mass causes gravity). If you admit you need facts about the natures of things to constrain the structure, you have abandoned pure structuralism.

  ### 3. OSR's Claim to Immunity (Ladyman & French)
  OSR proponents (Ladyman, French, Ross) argue that the Newman objection targets *epistemic* structuralism (a claim about what we *know*), but not *ontic* structuralism (a claim about what *exists*).

  *   **The OSR Move:** They argue the world *is* structure. There are no "relata" waiting to be related by gerrymandered maps. The structure is ontologically primitive. Therefore, the "gerrymandered" relations are not physically possible because they do not correspond to the actual ontological structure of the world.
  *   **The Modal Turn:** To block Newman, modern OSR often leans heavily on **modality**. They argue that physical structure supports counterfactuals and nomic necessity, whereas gerrymandered mathematical structures do not. The structure isn't just a set of extensions; it's a system of modal constraints.

  ### 4. Why Your Skepticism is Correct (The "Naturalness" Objection)
  You asked: *Doesn't OSR still need some relations to count as the "natural"/physically real ones rather than the gerrymandered alternatives?*

  **Yes.** This is the "Ainsworth Objection" (2010).

  For OSR to avoid Newman, it must claim that *only certain structures are instantiated in reality*. But if structure is "all the way down," what selects the real structures from the possible mathematical ones?
  1.  **If the selection criterion is structural:** You risk an infinite regress (what structures the selector?).
  2.  **If the selection criterion is non-structural:** You have admitted a non-structural primitive (e.g., "physicality," "naturalness," or "modality").

  If OSR says, "The world is structure, but only *natural* structure," they have effectively posited a property of **Naturalness** that attaches to certain relations. But is "Naturalness" a structural property?
  *   If **Yes**: How is it defined structurally without reference to relata? (Very difficult).
  *   If **No**: Then OSR relies on a non-structural primitive to block Newman. This undermines the claim that structure is *all* there is.

  **Verdict:** OSR does not *logically* block Newman simply by asserting "ontology." It blocks it only by smuggling in a modal or naturalness constraint that functions exactly like the "nature of entities" ESR tried to avoid.

  ### 5. Comparison: Who Has the Principled Answer?
  Neither has a fully principled answer that preserves their purest definitions, but they fail in different directions.

  | Feature | ESR (Worrall) | OSR (Ladyman/French) |
  | :--- | :--- | :--- |
  | **Response to Newman** | Admit the logical point, restrict relations to "causal/physical." | Deny the applicability; claim the world *is* the structure, not a description of it. |
  | **Cost** | Risks collapsing into entity realism (what makes a relation causal?). | Risks positing "modality" or "naturalness" as brute non-structural facts. |
  | **Honesty** | More epistemically humble; admits we need *something* beyond structure to fix reference. | More ontologically bold; but the "something beyond" is hidden in modal claims. |
  | **Status** | **Vulnerable.** The Ramsey sentence is logically too weak. | **Vulnerable.** Requires extra resources (modality) to distinguish real from gerrymandered structure. |

  **The Winner?**
  Most meta-analyses suggest **OSR fares slightly better only if it accepts "Moderate" status.**
  *   **Radical OSR** (no relata, pure structure) is devastated by Newman because without relata, there is nothing to anchor the structure against isomorphic mappings.
  *   **Moderate OSR** (relata exist but are structurally constituted) can argue that the *physical constraints* on the relata (e.g., energy, spin) limit which structures can be instantiated. But this looks suspiciously like ESR with extra steps.

  ### 6. Concrete Example: Quantum Entanglement
  Let's see where this difference shows up. Consider a pair of entangled electrons in a singlet state.

  **The Structure:** The statistical correlations between spin measurements at various angles (violating Bell inequalities).

  **ESR Analysis:**
  *   **Claim:** We know the correlation structure (the math of the singlet state). We remain agnostic about whether there are "particles" underneath.
  *   **Newman Challenge:** Couldn't there be a domain of cardinality 2 (or infinite) with gerrymandered relations that produce these exact statistics? (e.g., hidden variables that are logically possible but physically weird).
  *   **ESR Reply:** No, because the relations must be *physical*.
  *   **Weakness:** What makes them physical? If you say "because they involve electrons," you've invoked relata natures.

  **OSR Analysis:**
  *   **Claim:** There are no electrons. There is only the entangled structural state. The "objects" are just nodes in the structure.
  *   **Newman Challenge:** Why is *this* structure instantiated and not an isomorphic mathematical structure that doesn't support the same counterfactuals?
  *   **OSR Reply:** Because this structure has **nomic necessity**. It supports counterfactuals (e.g., "if we *had* measured at angle X..."). Gerrymandered relations are merely extensional; they don't support counterfactuals.
  *   **Weakness (Your Point):** Where does this "nomic necessity" come from? If it's a primitive feature of the structure, OSR has posited a non-structural primitive (Modality). If it comes from the "nature" of the nodes, OSR has reintroduced relata natures.

  **Where the difference shows up:**
  In a case of **permutation invariance**.
  *   In classical mechanics, swapping two particles results in a distinct state (conceptually), even if observationally identical.
  *   In QM, swapping indistinguishable particles results in the *same* physical state (up to a phase).
  *   **ESR** struggles to explain *why* the structure treats them as indistinguishable without referencing the *nature* of the particles (they are the "same kind").
  *   **OSR** claims this proves there are no particles, only the structure. The structure *itself* lacks the individuation resources.
  *   **Newman on OSR:** But why can't we map a structure *with* individuation onto this domain?
  *   **OSR Answer:** Because the **physics** forbids it (e.g., via the Hamiltonian).
  *   **The Kicker:** If the Hamiltonian is just more structure, Newman returns. If the Hamiltonian represents a physical constraint distinct from pure math, OSR has admitted non-structural facts.

  ### Summary
  You are right to be bugged. The standard line that "OSR dodges Newman" is largely rhetorical.
  1.  **ESR** is logically transparent but trivialized by Newman unless it adds non-structural constraints.
  2.  **OSR** avoids the triviality only by positing that physical structure has modal weight (naturalness/necessity) that pure math lacks.
  3.  **The Catch:** That modal weight acts exactly like the "nature of entities" ESR tried to discard.

  **Conclusion:** Neither view fully solves Newman without compromising its "pure structuralist" label. The most defensible position is likely a **hybrid**: Structural realism is correct that structure is the primary *knowable* and *invariant* element, but it requires a minimal ontology of "nodes" or "causal powers" to anchor the structure and block gerrymandering. This is essentially what Ladyman calls "Moderate OSR," but critics argue it's just ESR with better branding.

  If you want to press this in your reading group, cite **Peter Ainsworth, "What is Ontic Structural Realism?" (2010)**. He explicitly argues that OSR faces a Newman-style objection unless it accepts primitive modality, which undermines its claim to be purely structural.
