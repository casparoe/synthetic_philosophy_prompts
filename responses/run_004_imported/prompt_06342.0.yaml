answer: |-
  **The Illusion of Rational Irrationality: Resolute Choice in Parfit's Hitchhiker**

  Parfit's Hitchhiker case presents a stark dilemma for decision theory. A traveler stranded in a desert faces a driver who will offer a ride only if he predicts the traveler will pay a fee upon reaching town. Once in town, however, the traveler is safe; the driver has no power to punish non-payment, and paying confers no causal benefit. The intuitive tension is clear: to get the ride, one must intend to pay; but once the ride is secured, standard instrumental reasoning suggests one should not pay. This essay argues that this case does *not* establish the phenomenon of "rational irrationality"—the idea that rationality requires a disposition to perform an act that is itself irrational. Rather, the case demonstrates that Causal Decision Theory (CDT) employs an erroneously narrow temporal frame for assessing rationality. Under a McClennen-style resolute-choice criterion, paying is the rational act outright. Furthermore, this dispute is fundamentally isomorphic to the disagreement between one-boxers and two-boxers in Newcomb's Problem; both turn on whether rational choice should treat the agent's decision as logically correlated with a prior prediction or as a causally isolated event.

  To understand why "rational irrationality" is a category error, one must first engage seriously with the Causal Decision Theorist's case. CDT evaluates acts based on their causal consequences. At the moment the traveler arrives in town, the driver's prediction is a fixed fact of the past. The traveler's current choice to pay or withhold payment cannot causally influence whether the driver stopped in the desert. If the traveler pays, she loses the fee. If she withholds, she keeps the fee. In both scenarios, she is already alive. Therefore, the expected utility of withholding payment strictly dominates the expected utility of paying. For the CDT proponent, the traveler faces a tragic conflict: it is rational to *have* the disposition to pay (because that disposition causes the driver to stop), but it is irrational to *exercise* that disposition (because the act of paying yields no causal return). This leads to the conclusion that genuine rationality requires being disposed to perform an act that, considered on its own, is irrational.

  However, this conclusion relies on a metaphysical fiction: the "time-slice" agent. CDT treats the traveler in the town as a distinct decision-making entity from the traveler in the desert, severed from her prior intentions and plans. This isolation is the root of the error. Rational agency is not merely a series of disconnected optimizations at each temporal node; it is the execution of plans over time. Edward McClennen's theory of resolute choice captures this by arguing that rationality applies to the plan selected at the initial node, provided that plan remains optimal relative to the options available at that start. When the traveler was in the desert, the option set included {Die, Ride-and-Pay, Ride-and-Defect}. Since the driver predicts accurately, {Ride-and-Defect} is unavailable (it leads to {Die}). The optimal available plan is {Ride-and-Pay}. Resolute choice dictates that a rational agent must adhere to this optimal plan even when later tempted to deviate. To deviate is not to act rationally in a new context; it is to fail at rationality *simpliciter* by succumbing to dynamic inconsistency.

  On this view, there is no "irrationality" left to explain away. The act of paying is rational because it is the necessary execution of the only plan that secures survival. The CDT objection—that paying has no causal benefit *at the moment*—misses the point that the benefit was secured *by the commitment to the plan*. If the agent reasons at the moment of payment, "My choice now cannot change the past," she is implicitly signaling that she is the *kind* of agent who defects on plans. But if she is that kind of agent, the driver (who predicts based on her type) would not have stopped. The traveler cannot have it both ways: she cannot claim the benefit of being a resolute chooser (the ride) while reasoning like a myopic chooser (withholding payment). Therefore, assessing the payment in isolation is the wrong standard. The standard must be the coherence of the agent's trajectory through time.

  This analysis aligns closely with David Gauthier's disposition-based account, though with a resolute emphasis. Gauthier argues that it is rational to cultivate a disposition of "constrained maximization" (cooperating when others do likewise) rather than "straightforward maximization" (defecting when beneficial). In the Hitchhiker case, the driver is scanning for the disposition. If the traveler possesses the rational disposition to pay, she pays. If she possesses the rational disposition to defect, she dies. Thus, the act of paying is the output of a rational disposition. To call the act itself irrational is to divorce the output from the mechanism that generated it. A thermostat set to 70 degrees that turns on the heat at 68 degrees is not acting "irrationally" relative to the moment's temperature; it is acting rationally relative to its setting. Similarly, the traveler acts rationally relative to her rational plan.

  It is crucial to determine whether this dispute is merely a variation of Newcomb's Problem or a distinct philosophical beast. I contend that the Hitchhiker case and Newcomb's Problem are structurally isomorphic; they represent the exact same disagreement between CDT and non-causal (or evidential/functional) decision theories. In Newcomb's Problem, a Predictor fills Box B based on a prediction of the agent's choice. In Hitchhiker, a Driver offers a ride based on a prediction of the agent's choice. In both cases, CDT advocates "two-boxing" or "defecting" (withholding payment) based on the dominance principle: the past state (box content/ride offer) is fixed, so one should maximize utility given that fixed state. Conversely, One-Boxers and Resolute Choicers argue that the decision is logically correlated with the prediction. If you are the type of agent who two-boxes, the Predictor anticipated this and left Box B empty (or the Driver drives on).

  Some philosophers attempt to pull the cases apart by arguing that Hitchhiker involves a promise or a social contract, whereas Newcomb's is a purely mechanical prediction. However, this distinction is superficial. Parfit can stipulate that the traveler makes no explicit promise, only that the driver is adept at reading character. Conversely, Newcomb's Predictor can be a human psychologist rather than a supercomputer. The core logical tension remains identical: does rational choice treat the decision as an intervention that breaks the link to the prediction (CDT), or as the output of an algorithm that is logically entangled with the prediction (EDT/FDT/Resolute)? Since the structural dependency of the past state on the decision type is identical in both cases, the verdict must be the same. If one-boxing is rational in Newcomb, paying is rational in Hitchhiker. If two-boxing is rational, then withholding payment is rational. To hold that Hitchhiker requires "rational irrationality" while Newcomb does not (or vice versa) would be inconsistent.

  A qualified verdict is necessary regarding the reliability of the driver's foresight. The argument for resolute choice holds only if the driver's prediction is sufficiently correlated with the traveler's actual choice. If the driver is a poor judge of character (say, 51% accuracy), the expected utility calculations might shift, potentially allowing a CDT agent to gamble on the ride and then defect. However, Parfit's case stipulates the driver refuses to set off *unless confident*. This implies a threshold of prediction high enough that the "Ride-and-Defect" branch is effectively pruned from the decision tree before it begins. Under these conditions, the CDT calculation that treats the ride as a "sunk benefit" is false, because the benefit was never secured independently of the choice to pay.

  In conclusion, Parfit's Hitchhiker does not establish that rationality requires a disposition to perform irrational acts. That conclusion is an artifact of Causal Decision Theory's refusal to acknowledge the temporal extension of agency. By adopting a resolute-choice criterion, we see that paying the fee is the rational act outright, as it constitutes adherence to the only plan that yields survival. The traveler who withholds payment is not locally rational and globally irrational; she is simply irrational, having failed to bind her future self to her optimal past plan. Finally, this dispute is indeed the same disagreement that divides one-boxers from two-boxers in Newcomb's Problem. Both cases challenge the CDT axiom that rational choice must ignore logical correlations with past predictions. In both instances, the agent who recognizes that their choice reveals their type—and thereby determines the past prediction—achieves better outcomes without resorting to the paradoxical notion of "rational irrationality." Rationality is not about making the best move on a frozen board; it is about being the kind of player who is invited to the game.
