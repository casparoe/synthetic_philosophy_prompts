answer: |-
  You are right to be skeptical, and your roommate is relying on a standard but technically vulnerable interpretation of Harsanyi. The claim that Harsanyi "solved" interpersonal comparability (IUC) is one of the most persistent myths in welfare economics. While Harsanyi provided a brilliant *structural* account of utilitarianism, he did not provide a *measurement* account that validates the cardinal comparability required for cost-effectiveness analysis (CEA) or QALY maximization.

  To argue this rigorously against an Econ PhD, you need to move beyond "utility is subjective" and attack the **measurement invariance** and **isomorphism** assumptions hidden in the formalism.

  Here is the rigorous skeptical case, broken down by the specific point where comparability is smuggled in.

  ### 1. The Aggregation Theorem: The Affine Gap
  Your senior analyst is technically incorrect if she implies the Aggregation Theorem (1955) alone solves this. You likely already know the algebra, but let's pin down exactly where the "sleight of hand" occurs if one tries to use it for IUC.

  **The Setup:**
  Let $R_1, \dots, R_n$ be individual preference orderings over lotteries, and $R_0$ be the social ordering. All satisfy vNM axioms.
  The theorem states: If $R_0$ satisfies the Pareto principle (if all $R_i$ prefer $L$ to $L'$, so does $R_0$), then there exist utility representations $U_0, U_1, \dots, U_n$ and constants $a_1, \dots, a_n$ and $b$ such that:
  $$U_0(L) = \sum_{i=1}^n a_i U_i(L) + b$$

  **The Skeptical Pivot:**
  The theorem proves the *form* of the social welfare function (SWF), not the *metric*.
  vNM utility functions are unique only up to **positive affine transformations**. For any individual $i$, $U_i^* = \alpha_i U_i + \beta_i$ (where $\alpha_i > 0$) represents the exact same preferences as $U_i$.

  However, the social sum is **not** invariant to these transformations.
  If we scale Person 1's utility by 100 ($\alpha_1 = 100$), their weight in the social sum effectively increases 100-fold, even though their underlying preferences ($R_1$) haven't changed.

  **The Unearned Assumption:**
  To move from "weighted sum" to "utilitarian sum" (equal weights), you must fix the $\alpha_i$ and $\beta_i$ constants across all individuals. The Aggregation Theorem is mathematically silent on how to fix these scales. It tells you that *if* you have comparable utilities, you must sum them. It does not tell you *how* to make them comparable. Asserting that $a_i = a_j$ is not a derivation from the axioms; it is an external ethical imposition.

  ### 2. The Impartial Observer Theorem: The Isomorphism Problem
  Your roommate will argue: "That's why Harsanyi introduced the Impartial Observer Theorem (IOT) (1953/1955). The observer behind the veil of ignorance provides the common scale."

  This is the stronger argument, but it fails on **psychological isomorphism**.

  **The Setup:**
  An impartial observer faces a lottery where they have an equal probability ($1/n$) of becoming any person $i$ in society. The observer has vNM preferences over these "identity lotteries." Let $V$ be the observer's utility function over these extended alternatives (being person $i$ in state $x$).
  Harsanyi argues that if the observer is rational and impartial, $V$ must take the form:
  $$V = \frac{1}{n} \sum_{i=1}^n U_i$$
  Where $U_i$ is person $i$'s own utility function.

  **The Skeptical Pivot:**
  For this equation to hold, Harsanyi must assume that the observer's vNM utility from *imagining* they are person $i$ ($V_i$) is numerically identical to person $i$'s actual welfare utility ($U_i$).

  **Where Comparability is Smuggled:**
  1.  **The Observer's Scale:** The observer uses *their own* brain to evaluate the lottery. The vNM scale is defined by the observer's risk attitudes. If the observer is risk-averse, the "distance" between outcomes on their scale reflects their fear, not necessarily the welfare difference experienced by person $i$.
  2.  **The Mapping Assumption:** Harsanyi assumes the observer can perfectly map $i$'s preferences onto their own utility scale. But this requires the observer to make an interpersonal comparison *before* the calculation begins. To say "Being $i$ in state $X$ is worth 0.5 utils to me (the observer)" is to assert " $i$'s welfare in $X$ is 0.5 units."
  3.  **Weymark's Critique:** John Weymark (1991) formalized this by showing that Harsanyi's IOT requires a "strong independence" axiom over extended preferences. This axiom effectively *stipulates* that the observer's trade-offs between identities mirror the trade-offs in individual welfare. It doesn't derive comparability; it **defines** social welfare as the observer's risk preferences over identities.

  **The Argument for Your Roommate:**
  Harsanyi hasn't solved IUC; he has **reduced** IUC to the problem of the observer's empathy. He assumes the observer's vNM scale is a universal ruler. But why should the observer's risk attitude toward *becoming* a disabled person equate to the disabled person's actual loss of welfare? The observer might be terrified of disability (high utility loss) while the actual disabled person has adapted and reports high welfare (low utility loss). Harsanyi's formalism forces the observer's valuation to override the individual's reported welfare, which is a substantive ethical claim, not a rationality axiom.

  ### 3. The Normalization Trick: The Capacity Assumption
  Even if we accept the Impartial Observer, Harsanyi needs to normalize the scales to sum them. He suggests setting the worst outcome to 0 and the best to 1 for everyone.

  **The Skeptical Pivot:**
  This normalization assumes **Equal Welfare Capacity**.
  By setting $U_i(\text{best}) - U_i(\text{worst}) = 1$ for all $i$, you are assuming that every human being has the exact same range of possible well-being.

  **Why This Fails for QALYs:**
  In health economics, this is critical.
  *   **Person A:** Has a high capacity for joy/suffering. A year of health is ecstatic; a year of illness is torturous. Range = 100 units.
  *   **Person B:** Has a flat affect (perhaps due to neurological conditions or adaptive preferences). A year of health is "fine"; a year of illness is "annoying." Range = 10 units.

  If you normalize both to [0, 1], you are mathematically asserting that Person A's "torture" is equivalent to Person B's "annoyance." You have erased the intensity difference.
  Harsanyi's framework treats this normalization as a technical convenience. In reality, it is a massive ethical assumption: **Capacity Egalitarianism**. It asserts that nature does not create people with different capacities for welfare. There is no empirical or axiomatic basis for this in the theorem. It is assumed to make the summation possible.

  ### 4. The "Extended Preferences" vs. "Welfare" Distinction (Sen's Critique)
  Amartya Sen's most damaging critique (which you should cite) distinguishes between **extended preferences** and **welfare**.

  *   **Extended Preference:** "I (the observer) would prefer to be $i$ in state $X$ than $j$ in state $Y$."
  *   **Welfare Comparison:** "$i$ is better off in $X$ than $j$ is in $Y$."

  Harsanyi conflates these. He assumes that if the impartial observer prefers being $i$ in $X$, then $i$'s welfare in $X$ is higher.
  **Counter-example:** Consider a "contented slave" or a person with adaptive preferences due to chronic illness.
  *   The observer (valuing liberty) would *not* prefer to be the slave.
  *   The slave (adapted) reports high satisfaction.
  *   Harsanyi's IOT, relying on the observer's preferences, would rank the slave's state as low welfare (because the observer wouldn't want to be them).
  *   But if we care about *experienced well-being* (which QALYs often claim to measure), the slave's welfare might be high.

  By using the observer's preferences as the metric, Harsanyi smuggles in the observer's specific conception of the good life as the universal metric. This is not interpersonal comparability; it is **imperialism of the observer's utility function.**

  ### 5. Summary for Your Debate
  When you talk to your roommate, frame it this way:

  1.  **Invariance Failure:** The Aggregation Theorem allows any affine transformation. Summing utilities requires fixing scales. The theorem does not fix scales.
  2.  **Circularity in IOT:** The Impartial Observer Theorem fixes scales by having the observer evaluate identities. But the observer can only do this by *already* making interpersonal comparisons (mapping $i$'s welfare to the observer's scale). It presupposes what it claims to derive.
  3.  **Normalization as Ethics:** Normalizing utility ranges to [0,1] assumes equal welfare capacity across persons. This is an ethical assumption, not a mathematical necessity.
  4.  **QALY Implication:** Therefore, treating 1 QALY as equal across patients is not "Harsanyi-utilitarian." It is a specific policy choice that assumes equal welfare capacity and ignores adaptive preferences. Harsanyi provides a coherent *language* for utilitarianism, but he does not provide the *epistemic justification* for the units required to speak that language.

  **The "Sleight of Hand":**
  Harsanyi didn't solve the problem of comparing utilities across people. He solved the problem of **how to aggregate utilities *if* they were comparable.** He shifted the burden of comparability from "social choice" to "individual psychology" (the observer's empathy), but he offered no proof that the observer's psychology is a valid measuring stick for another person's reality.

  In the context of your internship: When you treat 1 QALY for a 20-year-old as equal to 1 QALY for an 80-year-old, or 1 QALY for a wealthy person as equal to 1 QALY for a poor person, you are not applying Harsanyi's theorem. You are applying a **convention** that Harsanyi's theorem *requires* but cannot *justify*. Your senior analyst is using a theorem about aggregation to defend a measurement assumption. That is the category error.
