      *   **Constraint:** No lazy subjectivity arguments ("feelings are subjective"). Needs formal/technical precision suitable for someone who has already read Sen and Weymark.

  2.  **Deconstruct the Harsanyi Framework:**
      *   *Aggregation Theorem (1955):* If individual and social preferences satisfy von Neumann-Morgenstern (vNM) axioms + Pareto (weak), then $W = \sum a_i U_i$.
      *   *Impartial Observer Theorem (1953/1955):* Behind a veil of ignorance (equiprobability), the observer chooses social states. If the observer has vNM preferences over "being person $i$ in state $x$," this yields Utilitarianism ($\sum \frac{1}{n} U_i$).
      *   *The Core Issue:* vNM utility functions are unique only up to positive affine transformations ($U' = aU + b, a > 0$). To sum them, they must share a common scale and zero point. Harsanyi claims the IOT provides this normalization. Skeptics (Sen, Weymark, others) say it doesn't.

  3.  **Identify the Weak Points (The Skeptical Case):**
      *   **Point 1: The Aggregation Theorem's Silence.**
          *   Theorem proves form ($W = \sum a_i U_i$), not weights ($a_i$) or scaling.
          *   Without fixed scales, $U_1 + U_2$ is meaningless. $U_1 + 100U_2$ is also a weighted sum.
          *   Pareto condition doesn't fix scales.
      *   **Point 2: The Impartial Observer's "Identity" Problem.**
          *   Harsanyi assumes the observer can form preferences over "being $i$."
          *   To do this, the observer needs to know what it's like to be $i$.
          *   *Critique:* This requires the observer to map $i$'s utility onto the observer's own vNM scale.
          *   *The Sneak:* This mapping *is* the interpersonal comparison. It assumes the observer can meaningfully say "Being $i$ in state $X$ gives me 5 utils, being $j$ in state $Y$ gives me 10 utils."
          *   But vNM utility is defined over *the observer's* risk preferences. It measures the observer's attitude toward the *risk* of being $i$, not $i$'s actual welfare intensity.
      *   **Point 3: Extended Preferences vs. Welfare.**
          *   Harsanyi relies on "extended preferences" (preferences over being someone else).
          *   Sen's critique: Just because I prefer being $i$ in $x$ over being $j$ in $y$ doesn't mean $i$'s welfare in $x$ is higher than $j$'s in $y$. It means *I* prefer that identity/state combo.
          *   Example: I might prefer being a contented slave over a miserable free man (adaptive preferences), but that doesn't mean the slave's welfare is objectively higher in a normative sense. Or, I might fear being person $i$ due to bias, not welfare.
      *   **Point 4: The Normalization Convention.**
          *   Harsanyi suggests normalizing best/worst outcomes (0 and 1).
          *   *Critique:* Everyone's "best" and "worst" are subjective. My "1" might be a whisper compared to your "1" (a scream).
          *   Equalizing the *range* (0 to 1) assumes equal *capacity* for welfare. This is a substantive ethical assumption (capacity egalitarianism), not a derivable fact from rationality axioms.

