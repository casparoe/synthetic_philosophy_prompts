      *   *Check:* What is Weymark's specific critique? Weymark (1991) formalizes that Harsanyi's IOT requires "strong independence" over extended preferences which effectively builds in comparability.
      *   *Check:* Make sure not to confuse vNM utility with welfare. vNM is risk attitude. Welfare is well-being. Harsanyi equates them (preference satisfactionism). Skeptics deny this equivalence across persons.
      *   *Tone:* rigorous, academic but accessible, validating the user's intuition against the "senior analyst" dismissal.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* You are right to be skeptical. The "solution" is a relocation of the problem, not a dissolution.
      *   *Aggregation:* Focus on $U_i^* = a_i U_i + b_i$. The social function $W = \sum U_i$ changes if $a_i$ differs. Pareto only fixes ordinal ranking, not cardinal spacing.
      *   *Impartial Observer:* The observer faces a lottery: $(1/n)$ chance of being $i$. Observer maximizes $V = \sum (1/n) V_i$. Harsanyi says $V_i = U_i$.
