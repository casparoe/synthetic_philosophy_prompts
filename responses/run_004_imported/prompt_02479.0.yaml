      *   *Crucial distinction:* Epistemology (how we judge) vs. Ontology (what it is). The user asks if the framework *forces* him to grant a soul. The answer is no, because the framework relies on the prior metaphysical distinction.

  9.  **Final Polish:** Ensure tone is academic but direct (as requested). Use Cartesian terminology (*res cogitans*, *res extensa*, *automaton*, *disposition of organs*).

      *(Self-Correction on the "Action Test"):* Actually, LLMs might fail the Action Test too. They can't navigate a physical room or eat food. But the Language Test is the stronger challenge. Focus heavily on why Language doesn't equal Thought for Descartes.

      *(Refining the "Principled Way"):* The principled way is the **Substance Ontology**. If it's divisible, it's extended. If it's extended, it's not a mind. LLMs are divisible (code, hardware). Therefore, not a mind. The Language Test is secondary to the Substance distinction.

