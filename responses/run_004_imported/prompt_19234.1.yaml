  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  First off, take a deep breath. It is completely normal to feel a mix of curiosity and anxiety about jury duty. The fact that you're losing sleep over the mathematical philosophy of justice shows you take the responsibility seriously, which is exactly the kind of mindset the system needs.

  You have grasped the **Condorcet Jury Theorem (CJT)** correctly: mathematically, if every voter is more likely than not to be correct ($p > 0.5$), adding more voters increases the probability of a correct majority verdict toward 100%.

  However, legal systems are not pure math problems. They are human systems designed for fairness, logistics, and due process, not just statistical accuracy. Here is why courts don't summon 100 people and go with a simple majority, and why you shouldn't let the theorem scare you.

  ### 1. The "Competence" Assumption is Fragile
  The CJT relies on a critical assumption: that every individual juror has a probability of being correct greater than 50% ($p > 0.5$).
  *   **The Risk:** If the average juror is slightly *less* than 50% likely to be correct (perhaps because the evidence is confusing, the law is complex, or lawyers are misleading), the theorem works in reverse. As you add more people, the probability of a correct verdict plummets toward 0%.
  *   **The Legal Reality:** In a courtroom, "correctness" isn't an objective fact like counting beans in a jar. It is about whether the prosecution met the burden of proof ("beyond a reasonable doubt"). If you have 100 people, it is statistically harder to ensure every single one of them actually understands the evidence well enough to be "competent." A smaller jury allows for better screening (voir dire) to ensure basic competence.

  ### 2. Deliberation vs. Aggregation
  The CJT assumes **independent voting**. It assumes Juror A doesn't talk to Juror B.
  *   **The Legal Reality:** The American jury system is built on **deliberation**, not just aggregation. We don't want 100 people silently filling out a ballot; we want 12 people arguing, discussing, and challenging each other's interpretations of the evidence.
  *   **Group Dynamics:** Social psychology tells us that effective deliberation becomes impossible with large groups. In a group of 100, voices get drowned out, social loafing occurs (people let others do the thinking), and factions form. In a group of 12, it is small enough that everyone can speak, but large enough to represent a cross-section of the community.

  ### 3. Unanimity Protects the Minority (and the Innocent)
  You asked why we require unanimity instead of a majority. This is a feature, not a bug, of the justice system.
  *   **Beyond a Reasonable Doubt:** This is a very high bar. If 90 out of 100 people think the defendant is guilty, but 10 have a genuine, evidence-based reasonable doubt, the system dictates that the prosecution failed to meet its burden.
  *   **Preventing Rushed Judgments:** Unanimity forces the majority to listen to the minority. It requires the group to work through inconsistencies until everyone is satisfied. A majority rule system allows the majority to ignore the concerns of the minority, which increases the risk of wrongful conviction.
  *   **Blackstone's Ratio:** The legal philosophy here is that "It is better that ten guilty persons escape than that one innocent suffer." A unanimous 12-person jury is designed to minimize false convictions, even if it means some false acquittals (hung juries).

  ### 4. Logistics and Diminishing Returns
  *   **Cost:** Paying, seating, and managing 100 jurors for weeks or months would make the justice system prohibitively expensive.
  *   **Math Diminishing Returns:** The CJT curve flattens out quickly. The jump in accuracy from 1 person to 12 is massive. The jump from 12 to 100 is statistically marginal compared to the exponential increase in cost and logistical nightmare.

  ### 5. "Truth" in Court is Different than "Truth" in Math
  The CJT works best for binary questions with an objective truth (e.g., "Is this coin heads or tails?").
  *   **Legal Truth:** A verdict isn't necessarily "What actually happened?" It is "Did the state prove what happened according to the rules?"
  *   **Independence Violation:** In a trial, everyone sees the *same* evidence. If the prosecution presents a piece of evidence that is misleading, *all* jurors are misled together. This violates the CJT assumption of independent errors. If the error is correlated (which it often is in court), adding more people doesn't fix the mistake; it just amplifies it.

  ### Reassurance for Your Upcoming Duty
  It is understandable that knowing this makes you feel the weight of the decision. But here is the perspective shift that might help you sleep:

  1.  **You Are Not a Data Point:** The system doesn't expect you to be a statistic. It expects you to be a human being who listens, thinks, and asks questions.
  2.  **You Have Partners:** You aren't deciding this alone. You have 11 other people. If you are confused, chances are someone else is too. That is what deliberation is for.
  3.  **Reasonable Doubt is Your Friend:** You don't need to know the absolute truth. You only need to decide if the prosecution proved their case. If you aren't sure, you vote not guilty. That isn't a failure of accuracy; it's the system working as intended.
  4.  **Hung Juries are Okay:** If the group truly cannot agree, a mistrial is declared. This isn't a bug; it's a safety valve that prevents a wrongful conviction when the evidence isn't clear enough to convince 12 diverse people.

  The Condorcet Jury Theorem is a fascinating mathematical model, but the justice system is a **moral and procedural** one. It prioritizes fairness and the protection of rights over raw statistical efficiency.

  Go in, listen carefully, keep an open mind, and remember: the requirement for unanimity exists specifically so that your voice matters just as much as everyone else's. Good luck.
