prompt: |-
  So I just recieved my first ever jury duty summons, and last night I fell down a rabbit hole reading about the Condorcet jury theorem instead of sleeping. From what I can tell, it proves that the more people you put on a jury, the closer the majority verdict gets to being 100% likely to be correct, as long as each juror is even a little better than a coin flip at getting it right. So why do courts still cap juries at 12 and require a unanimous verdict, instead of just grabbing 100 random people and going with whatever the majority says? Feels like we're leaving free accuracy on the table, which isn't super reassuring now that I might be one of the 12 deciding someone's fate next month.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user received their first jury duty summons.
      *   **Action:** They read about the Condorcet Jury Theorem (CJT) late at night.
      *   **Understanding:** They correctly grasp the core premise of CJT (larger groups + individual competence > 0.5 $\rightarrow$ higher probability of correct majority verdict).
      *   **Question:** Why don't courts use larger juries (e.g., 100 people) and majority rule instead of 12 people and unanimity?
      *   **Emotional State:** Anxious/uncertain ("isn't super reassuring now that I might be one of the 12").
      *   **Goal:** Explain the limitations of CJT in the legal context, justify the current system (12 + unanimity), and reassure the user about their role.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *What it says:* If $p > 0.5$ (probability an individual is correct), then as $n \rightarrow \infty$, probability of majority correct $\rightarrow 1$.
      *   *Assumptions:*
          1.  Binary choice (Guilty/Not Guilty).
          2.  Independence (Jurors don't influence each other).
          3.  Competence ($p > 0.5$ for *every* juror).
          4.  Sincere voting (Voting for what they believe is true, not strategically).
      *   *Reality Check:* Do these hold in a courtroom?
          *   Binary? Roughly, yes.
          *   Independence? No. Deliberation happens.
          *   Competence? Hard to guarantee. Evidence can be confusing.
          *   Sincere voting? Mostly, but group dynamics matter.

  3.  **Address the "Why not 100 people?" question (Practical & Legal Constraints):**
      *   *Cost/Logistics:* Paying, housing, feeding 100 people is expensive. Courtrooms aren't that big. Trials would take forever.
      *   *Diminishing Returns:* The curve flattens quickly. Going from 1 to 12 gives a huge boost. 12 to 100 gives less marginal gain compared to the cost.
      *   *The "Competence" Assumption:* If $p < 0.5$ (jurors are confused or misled), CJT says accuracy goes to 0% as group size increases. Larger juries amplify *error* if the average juror is incompetent.
      *   *Deliberation vs. Aggregation:* The US system values *deliberation* (discussing evidence) over mere *aggregation* (counting votes). CJT assumes voting without discussion. Deliberation works better with smaller groups.

  4.  **Address the "Why Unanimity?" question:**
      *   *Protection against tyranny of the majority:* Prevents rushing to judgment.
      *   *Minority viewpoint:* Ensures dissenting opinions are heard and debated.
      *   *Standard of Proof:* "Beyond a reasonable doubt" is a high bar. If one person has reasonable doubt, the bar isn't met.
      *   *Supreme Court Precedent:* *Ramos v. Louisiana* (2020) ruled unanimous verdicts are required for serious offenses in state courts.

  5.  **Address the User's Anxiety:**
      *   Acknowledge the weight of the responsibility.
      *   Reframe the role: You aren't a statistical data point; you're a critical thinker.
      *   Explain that the system *wants* you to be skeptical.
      *   Reassure that 12 is a robust number for deliberation, even if not for pure statistics.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Validate the user's research. CJT is fascinating. Acknowledge the anxiety.
      *   *Section 1: The Catch with Condorcet (The Assumptions).* Explain that CJT assumes independence and $p > 0.5$. In court, evidence is complex. If the case is confusing, $p$ might drop. Large juries amplify confusion.
      *   *Section 2: Deliberation vs. Voting.* This is crucial. The legal system isn't a poll; it's a discussion. 100 people can't talk effectively. 12 can.
      *   *Section 3: The Cost/Logistics.* Practical reality.
      *   *Section 4: Unanimity & Reasonable Doubt.* Explain the philosophical reason. It's better to let a guilty person go free than convict an innocent one (Blackstone's Ratio). Unanimity protects the minority.
      *   *Section 5: Reassurance.* You don't need to be perfect. You just need to be engaged. The system relies on the *group* dynamic, not just individual math.

  7.  **Refining the Tone:**
      *   Keep it informative but empathetic.
      *   Avoid overly dense math jargon.
      *   Make sure to mention *Ramos v. Louisiana* as it's a recent relevant legal fact.
      *   Highlight that the "accuracy" CJT talks about isn't the only value the justice system seeks (fairness, legitimacy, due process matter too).

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I mention civil cases?* Sometimes juries are smaller or non-unanimous in civil cases. Stick to criminal for now since the user seems worried about "deciding someone's fate" (implies criminal).
      *   *Is CJT actually applicable?* Scholars debate this. It's a theoretical model. Make sure to frame it as a model, not a law of physics.
      *   *What about hung juries?* Mention that they are a feature, not a bug. They prevent wrongful convictions when consensus can't be reached.

  9.  **Final Polish:** Organize with clear headings. Ensure the conclusion brings it back to the user's upcoming duty. (This matches the structure of the final output).

