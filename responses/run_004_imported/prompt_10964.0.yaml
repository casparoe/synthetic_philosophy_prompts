          *   Instead, it's a *modification* of the reactive attitude. You understand the *intent* might not be malicious, but the *impact* is still hurtful.
      *   *The Danger of the "Objective Stance":* Explain why treating him as someone to be "managed" is problematic according to Strawson. It dehumanizes him and ends the possibility of a genuine brotherly bond.
