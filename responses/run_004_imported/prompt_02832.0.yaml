answer: |-
  **Megillus:** You speak of this "fear drug" as if it were wine. It is not. If I dose a soldier with panic, I test whether his spirit holds firm against an external shock. But wine? Wine is an enemy within the gates. It does not merely frighten the reason; it dissolves it. To legislate drunkenness is to legislate that a man may temporarily cease to be a man. How can the law sanction the suspension of the very faculty required to obey it?

  **Athenian:** Precisely because it dissolves reason, Megillus. If virtue is only the absence of temptation, a stone is virtuous. We do not forge iron by leaving it in the cold. We heat it. The symposium is the fire. We do not drink to become mad, but to see *if* we go mad, and under whose watch.

  **Megillus:** And if the watchman blinks? You place a sober Symposiarch over the cup, you say. But you rely on one man's sobriety to police many men's ruin. If the law permits the poison, men will assume the dose is safe. You weaken the absolute prohibition. In Sparta, we do not test the shield by striking it with a hammer; we keep it whole until the battle.

  **Athenian:** But the battle comes regardless. Would you rather discover a man's cowardice when the enemy is at the wall, or when he is among friends? Consider the elders. You know how shame hardens the aged soul; they grow rigid, unwilling to sing or dance for Dionysus. Wine is the remedy. It softens the soul like iron in the fire, making it pliable for education again.

  **Megillus:** Softening is dangerous for those who must remain hard.

  **Athenian:** Not softening to break, but to mold. The sober leader ensures the fire does not consume the metal. We are not training them to be drunkards, Megillus. We are training them to remain themselves when the world tries to make them otherwise. If a man cannot rule himself when the cup is full, how can he rule the city when the crisis is real?

  **Megillus:** *Sighs, swirling his wine.* You argue that we must walk the precipice to learn balance. I argue that a wise lawgiver builds a fence. But... I grant you this: if the fence must be opened, the gatekeeper must never sleep.

  **Athenian:** Then let us drink, friend. But let us watch the man who pours.
