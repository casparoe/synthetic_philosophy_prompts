answer: |-
  Here are 10 interview questions designed to move past the thesis summary and press on the theological, textual, and political tensions in her argument. Each includes a suggested follow-up based on how she might defend her position.

  ### 1. The Textual Hierarchy
  **Question:** Your book privileges the *Commentary on the Sentences* and the *Summa* over *De Regno* (On Kingship), suggesting *De Regno*'s caution is merely prudential. But *De Regno* is his only dedicated political treatise, whereas the *Summa* treats tyranny incidentally within moral theology. Why should we read his specific political instructions as less "considered" than his theological casuistry?
  **Follow-up:** *If she argues that **De Regno** is unfinished or early:* "Even if unfinished, doesn't the fact that he explicitly chooses to warn against private assassination there suggest he saw a specific danger in that act that the *Summa*'s abstract categories might miss?"

  ### 2. The Usurper Distinction (Required)
  **Question:** You argue that Aquinas's category of the "usurper" is more flexible than the traditional reading allows, potentially licensing action against rulers who lack moral legitimacy, not just legal title. But if "usurpation" can be stretched to include moral failure, doesn't that collapse the distinction between a *tyrannus ex defectu tituli* (usurper) and a *tyrannus ex parte exercitii* (legitimate ruler acting badly)? How do we prevent this from becoming "it's a usurpation if I say it is"?
  **Follow-up:** *If she says the **community** decides:* "But Aquinas warns that private judgment is prone to passion. If the community is fragmented, isn't this definition just a recipe for civil war where every faction claims the other is 'usurping'?"

  ### 3. Sedition and Disorder (Required)
  **Question:** You lean heavily on Aquinas's definition of sedition to argue that resisting a tyrant isn't seditious because the tyrant has already introduced the "real" disorder. But if disturbing the peace is justified to remove the source of disturbance, doesn't that logic authorize *any* faction that believes they are the "restorers of order"? Where is the braking mechanism in your reading?
  **Follow-up:** *If she appeals to **Natural Law**:* "But Aquinas says sedition is a mortal sin specifically because it opposes the unity of the multitude. If we allow private actors to judge when that unity is already broken, haven't we effectively privatized the sword?"

  ### 4. John of Salisbury Comparison (Required)
  **Question:** John of Salisbury's *Policraticus* is famously explicit about slaying tyrants, while Aquinas is usually read as the "safe" Catholic correction to that zeal. If your reading is correct, and Aquinas is implicitly licensing much more direct action, is he actually refining Salisbury, or just sanitizing him? What makes Aquinas *safer* than Salisbury in your view?
  **Follow-up:** *If she says Aquinas is **more systematic**:* "But if the practical outcome—killing the ruler—is the same, does the systematic framing matter to the bleeding neck? Are we just arguing about the paperwork for the assassination?"

  ### 5. Prudence vs. Ontology
  **Question:** You characterize the "wait for public authority" instruction in *De Regno* as a prudential aside rather than an ontological requirement. But Aquinas treats prudence as a virtue that grasps reality. If prudence dictates waiting because acting will likely produce a worse tyrant, isn't that a moral command, not just a tactical suggestion?
  **Follow-up:** *If she says **circumstances change**:* "So are you arguing that Aquinas's prohibition is time-bound? That in the 13th century it was imprudent, but your reading makes it permissible now that we have different political structures?"

  ### 6. The "Worse Tyrant" Warning
  **Question:** Aquinas explicitly argues that assassinating a tyrant often leads to worse tyranny because the conspirators must become tyrants themselves to seize power, or the successor is more brutal to secure his position. Does your interpretation account for these consequences, or does it treat the act of removal as an intrinsic good regardless of the aftermath?
  **Follow-up:** *If she says **Aquinas is describing, not prescribing**:* "But he frames it as a reason *not* to act. If we ignore the consequentialist warning, are we still reading Aquinas, or are we using him to bless a modern revolutionary impulse?"

  ### 7. The Jean Petit Stress Test (Required)
  **Question:** In 1415, the Council of Constance condemned Jean Petit's propositions on tyrannicide, specifically the idea that a tyrant can be killed by a subject without a judicial sentence. Given that Constance happened less than 150 years after Aquinas, and cited scholastic reasoning, does your reading of Aquinas risk aligning him with the very propositions Constance condemned as heretical?
  **Follow-up:** *If she says **Constance was political**:* "Even if politically motivated, Constance represents the Church's authoritative reading of the scholastic tradition on this point. If Aquinas implies what Petit argued, was the Council wrong to condemn it, or is your reading of Aquinas anachronistic?"

  ### 8. Mechanism of Authorization
  **Question:** If public authority is absent or complicit, you suggest Aquinas allows for ordinary people to act. But in Aquinas's metaphysics, authority flows from God through structures. If the structure fails, where does the authorization for the private citizen come from? Is it a direct infusion of natural law, or a tacit consent of the governed?
  **Follow-up:** *If she says **tacit consent**:* "But Aquinas doesn't really have a theory of 'consent of the governed' in the modern sense. Are we importing a Lockean framework into a Thomistic one to make the authorization work?"

  ### 9. Reception by the Salamanca School
  **Question:** Later Scholastics like Suarez and Mariana are often cited as the ones who "radicalized" Aquinas on tyrannicide. If your reading is correct, and Aquinas was already more permissive, were the Salamanca scholars actually innovating, or were they just the first to say the quiet part out loud?
  **Follow-up:** *If she says **they were innovating**:* "Then doesn't that suggest they saw something in Aquinas that wasn't there before? Or does it mean they misread him the same way you argue the traditionalists are misreading him now?"

  ### 10. Normative Stakes
  **Question:** Finally, why does this matter now? If the traditional "cautious Aquinas" helps stabilize political order by discouraging vigilante justice, and your "permissive Aquinas" potentially destabilizes it, what is the normative benefit of recovering this reading? Are we trying to understand Aquinas, or are we trying to arm him?
  **Follow-up:** *If she says **truth matters more than stability**:* "But Aquinas places a high premium on peace and order as goods. If a 'truer' reading leads to more violence, would Aquinas himself prefer the 'safer' misreading?"
