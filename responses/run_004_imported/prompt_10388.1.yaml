          *   *Follow-up:* She might distinguish between "logical interaction" and "side-channel attacks." I need to ask if that distinction holds in a unified agent architecture.

      *   *Requirement 6: The "Troll" Problem (Spurious Proofs).*
          *   *Idea:* Löb's theorem has quirks.
          *   *Refinement:* There are known issues with "troll" strategies that force proofs of cooperation via inconsistency. How does the specific variant (e.g., PrudentBot) handle spurious counterfactuals without becoming exploitable by non-standard logics?
