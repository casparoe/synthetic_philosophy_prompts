      *   **Topic:** Aquinas's political theology regarding tyrannicide.
      *   **Context:** The user had an argument with a friend (friend says Aquinas sanctions killing tyrants; user says it's more tangled). The user wrote a summary/reading of three key texts (*Sentences*, *De Regno*, *Summa Theologiae*).
      *   **Task:** Evaluate the user's reading. Specifically:
