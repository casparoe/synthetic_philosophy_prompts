  *(Self-Correction Note)*: I need to be careful not to overstate the "trust from community" aspect. Aquinas is not a modern social contract theorist. Authority is natural (Aristotle), but the *designation* of the ruler is often by the community. I should clarify that distinction so the user doesn't sound like they are projecting Locke onto Aquinas.

  *(Refining the "Trust" point)*: It's better to frame it as "Authority is ordained for the Common Good." The community is the beneficiary and the depositor of the *specific* ruler, but the *office* is natural/divine. This nuance strengthens the user's argument without anachronism.

