answer: |-
  This is an exceptionally strong reading. You have avoided the two most common pitfalls in discussing Aquinas on tyranny: the anachronistic projection of modern liberal resistance theory onto him, and the flattening of his corpus into a single, consistent soundbite. Your summary of the three texts is textually faithful, and your proposed reconciliation via the "authority held in trust" premise is theoretically sound.

  However, to answer your specific question: **Does this premise reconcile the texts, or does it merely relocate the tension?**

  I would argue that it successfully reconciles the *theoretical* framework, but it leaves a residual *prudential* tension that reflects the development of Aquinas's own thought from a young commentator to a mature political thinker.

  Here is a breakdown of where your reading holds firm and where the nuance might be tightened.

  ### 1. Textual Accuracy
  Your summaries of the three texts are accurate, but a few nuances could strengthen your position against a determined interlocutor.

  *   **In II Sent., d. 44:** You are correct about the distinction between the tyrant *ex defectu tituli* (usurper) and *ex parte exercitii* (abuser). In this early text, Aquinas is indeed more permissive regarding the usurper, suggesting that killing him can be *laudabile et meritorium* (praiseworthy and meritorious). However, even here, he hints that this is not for *anyone* to decide, though he is less explicit about the "public authority" requirement than he becomes later.
  *   **De Regno:** Your reading here is spot on. This is the most cautious text. The key phrase you alluded to is that often it is better to suffer a mild tyranny for a time than to risk "greater perils" (*graviora pericula*) in attempting to overthrow it. He explicitly warns that the attempt often fails, leading to a harsher tyranny, or causes civil strife that damages the common good more than the tyrant did.
  *   **Summa Theologiae (II-II, q. 42, a. 2):** You correctly identify the definition of sedition as opposition to the unity of the multitude directed toward the common good. Therefore, a tyrannical regime, which opposes the common good, is not a true unity. However, Aquinas adds a critical caveat: even if the regime is tyrannical, if the deposition of the tyrant results in *greater* harm to the multitude (e.g., civil war, foreign invasion), then the deposition is illicit. The tyrant is guilty of sedition, but the deposers can be guilty of it too if they are imprudent.

  ### 2. The "Authority Held in Trust" Premise
  Your thesis—that authority is held in trust from the community, so only a communal act can withdraw it—is the correct Aristotelian-Thomistic framework. Aquinas does not view political authority as the private property of the ruler; it is an office ordained for the *bonum commune* (common good).

  **Where it works:**
  This premise perfectly explains why a private individual cannot kill a tyrant *ex parte exercitii* (legitimate title, bad rule). Since the authority was conferred by the community (or a higher public authority), only that same public entity can rescind it. A private citizen lacks the *jurisdiction* to judge the officeholder. This aligns *De Regno* and the *Summa*.

  **Where it strains (The Usurper Problem):**
  The tension you sensed regarding the *Sentences* commentary and the usurper (*ex defectu tituli*) is real. If authority is a public trust, a usurper never received the trust. So, theoretically, they are just a private aggressor.
  *   **The Tension:** In the *Sentences*, Aquinas implies a private person might act against a usurper. In *De Regno* and the *Summa*, he is much more worried about *who judges* the usurpation.
  *   **The Resolution:** The "trust" premise doesn't fully solve this unless you add the dimension of **judicial competence**. Even if a usurper has no authority, determining that they are a usurper is a public judgment. If private individuals decide "this king is a usurper," we are back to the chaos Aquinas fears in *De Regno*.
  *   **Refinement:** You might argue that in the mature Aquinas, even the "usurper" exception is swallowed by the requirement for public judgment. If no public superior exists to declare the usurpation, the private individual still lacks the standing to execute judgment, lest they become a tyrant themselves.

  ### 3. Relocating the Tension: Principle vs. Prudence
  You asked if your premise relocates the tension between *De Regno*'s caution and the *Sentences*' permissiveness. I suggest the tension isn't about the *right* to resist (which remains consistent: authority is for the common good), but about **Prudence (*Prudentia*)**.

  *   **Early Aquinas (*Sentences*):** Focuses on the *ontological* status of the tyrant. A usurper is not a ruler; therefore, killing him is not regicide. It is a theoretical classification.
  *   **Mature Aquinas (*De Regno/Summa*):** Focuses on the *consequentialist* reality of political action. Even if you have the theoretical right to remove a tyrant (because they violated the trust), doing so might violate the *purpose* of the trust (the safety and unity of the community).

  Your "trust" premise explains the *right* (the *jus*), but it does not automatically dictate the *wisdom* (the *prudential*). This is where your friend's argument likely fails. Your friend argues Aquinas "licenses" tyrannicide. You are correct that Aquinas provides a *theoretical justification* for it under strict conditions, but he simultaneously constructs a *prudential barrier* that makes it nearly impossible to licitly enact in practice.

  ### 4. A Suggested Nuance for Your Reconciliation
  To make your reconciliation bulletproof, I would tweak the "trust" premise slightly to include the **Divine Ordinance** aspect.

  For Aquinas, political authority is natural (from the community/Aristotle) but also ordained by God (Romans 13).
  1.  **The Trust:** The community entrusts the ruler with power for the common good.
  2.  **The Limit:** When the ruler violates the common good, he voids the trust.
  3.  **The Constraint:** Because authority is also divine, resisting it is spiritually dangerous. Therefore, unless there is a "human remedy" (a public superior or body), one must have recourse to the "Divine King" (prayer/suffering).

  This explains why *De Regno* suggests enduring tyranny if no public body exists. It isn't just political caution; it is theological humility. The "trust" is not solely horizontal (people to ruler); it is vertical (God to ruler to people). A private individual cannot sever a vertical bond that they did not create.

  ### Verdict
  You have represented the texts fairly. Your "authority held in trust" premise does the heavy lifting required to reconcile the *Summa* and *De Regno* with the *Sentences* regarding legitimate rulers.

  However, to fully address the *Sentences* on usurpers, you should acknowledge that Aquinas's mature thought likely tightens the loophole there, too. He moves from a position where killing a usurper is "meritorious" to a position where **any** extrajudicial killing is dangerous to the common good.

  **Conclusion:** You win the argument, but with a caveat. Aquinas does not "license" tyrannicide in the sense of giving a green light. He provides a *theoretical exception* to the prohibition on killing rulers, which is then surrounded by such high prudential walls that it becomes a "last resort of last resorts." Your friend is right that the mechanism exists; you are right that the door is effectively locked.

  Your reading is sophisticated enough to stand up to serious scrutiny. If I were to suggest one addition, it is to emphasize that for Aquinas, **sedition is a sin against charity and unity.** Even if the tyrant has broken that unity first, the liberator must ensure they do not break it further. That is the ultimate check on tyrannicide.
