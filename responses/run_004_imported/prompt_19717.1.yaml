answer: |-
  Here are 8 questions designed to press the Humean on the specific tension points you mentioned, plus a few others that target the structural weaknesses of the Best System Analysis (BSA). Each includes the likely "stock move" and a follow-up to prevent evasion.

  ### 1. The Quantum Entanglement Problem (Required)
  **Question:** "Lewisian Humeanism rests on the thesis of Humean Supervenience: that the global truth supervenes on the local qualitative character of spacetime points plus their spatiotemporal relations. However, standard interpretations of quantum mechanics suggest entangled systems possess joint properties that do not supervene on the intrinsic states of the individual particles plus their spatiotemporal distance. If the fundamental mosaic itself fails to be local in the Humean sense, doesn't the Best System Analysis lose its supervenience base entirely?"

  *   **The Dodge:** She will likely argue that we should simply update the "mosaic" to include the wavefunction as a fundamental field on configuration space, or claim that Humean Supervenience was always contingent and can be discarded while keeping the BSA account of laws.
  *   **The Follow-up:** "If you add the wavefunction to the mosaic, you are admitting a fundamental entity that is inherently non-local and holistic. But the motivation for Humeanism was precisely to avoid spooky, non-local necessary connections. If your fundamental ontology is holistic, haven't you surrendered the core metaphysical motivation for being a Humean in the first place, retaining only the label?"

  ### 2. The Induction and Coincidence Problem (Required)
  **Question:** "On the Best System view, laws are summaries of the mosaic, not governing constraints. This means there is no metaphysical 'glue' necessitating that future instances match past ones. To a non-Humean, the stability of the best system across time looks like a massive cosmic coincidence. What resources does the Humean have to justify projecting these regularities into the future, other than citing the very regularities themselves?"

  *   **The Dodge:** She will likely appeal to a pragmatic or pragmatic-a priori justification (à la Reichenbach or Lewis), arguing that *if* there is a stable pattern, the Best System method is the best way to find it, or that "lawhood" just *is* the property of being projectible.
  *   **The Follow-up:** "That explains why we *do* project, but not why we are *licensed* to. If the law is nothing over and above the summary of the past, inferring the future from the law is just inferring the future from the past. Doesn't this render the concept of a 'law' explanatorily idle for induction? Why not just say we project the mosaic directly and cut out the middleman of 'laws'?"

  ### 3. The Perfectly Natural Properties Problem (Required)
  **Question:** "To prevent the Best System from degenerating into triviality (e.g., using gerrymandered predicates like 'grue' to maximize simplicity), you need a restriction on the admissible predicates, usually via 'Perfectly Natural Properties.' But if Humeanism is advertised as a sparse ontology where 'nothing but the mosaic' exists, doesn't positing primitive, unanalyzable naturalness relations amount to the very kind of heavy-duty metaphysical structure you claim to reject?"

  *   **The Dodge:** She will argue that without PNPs, the view is incoherent, so this is a necessary cost. She might claim PNPs are not "modal" but merely "qualitative," preserving the ban on necessary connections.
  *   **The Follow-up:** "But what grounds the distinction between natural and unnatural properties if not modal or causal roles? If you say it's primitive, you are asking us to accept a brute modal-like fact about property similarity that doesn't supervene on the distribution of the properties themselves. Isn't this a 'necessary connection' between properties by another name?"

  ### 4. The Explanatory Circularity Objection
  **Question:** "In scientific practice, we cite laws to explain particular facts (e.g., 'The particle moved thus *because* of the Lorentz force law'). But on the BSA, the laws are determined by the particular facts. This looks like a vicious circularity: the mosaic determines the laws, which explain the mosaic. How do you break this loop without conceding that laws are merely descriptive and not explanatory?"

  *   **The Dodge:** She will likely use the "Loewer Move," distinguishing between *metaphysical* determination (mosaic → laws) and *scientific* explanation (laws → mosaic), arguing they run in opposite directions and don't conflict.
  *   **The Follow-up:** "If scientific explanation tracks metaphysical dependence, your view implies scientists are systematically mistaken about the direction of explanation. If scientific explanation *doesn't* track metaphysical dependence, what makes it 'explanation' rather than just systematization? Are you redefining explanation to save the metaphysics?"

  ### 5. The "Undermining Future" Problem (Chance)
  **Question:** "Lewis himself worried about 'undermining futures'—future sequences of events that are possible according to your current best probabilistic laws, but if they occurred, would change the best system (and thus the chances) retroactively. For example, a long run of heads is possible under a fair coin law, but if it happens, the best system might become 'always heads.' How does your view handle the truth conditions of present chance claims if the future can undermine them?"

  *   **The Dodge:** She may argue that the "Best System" is fixed by the *entire* history (past, present, future), so chances are not truly present-tensed, or she might adopt a "fit" metric that tolerates some deviation.
  *   **The Follow-up:** "If chances depend on the future, then present claims about probability (like 'this atom has a 50% chance of decaying') lack a truth value right now. This seems to violate the semantic intuition that chance claims are assessable in the present. Are you willing to accept that most scientific probability claims are currently neither true nor false?"

  ### 6. Counterfactuals and Accidental Generalizations
  **Question:** "A classic motivation for laws is that they support counterfactuals, whereas accidental generalizations do not. 'All gold spheres are <1km' supports 'If this were gold, it would be <1km.' But 'All coins in my pocket are silver' does not support 'If this penny were in my pocket, it would be silver.' Since both are just regularities in the mosaic, what makes the Best System regularities capable of grounding counterfactual truth conditions while others are not?"

  *   **The Dodge:** She will argue that the Best System is more *stable* or *robust* under hypothetical perturbations of the mosaic than accidental generalizations.
  *   **The Follow-up:** "Stability relative to what? If the mosaic is all there is, a 'perturbation' is just a different possible mosaic. What grounds the similarity relation between the actual mosaic and the possible one? If you appeal to laws to define the similarity, you're circular. If you appeal to brute similarity, haven't you just reintroduced modality?"

  ### 7. The Status of the Past Hypothesis
  **Question:** "To account for temporal asymmetry (entropy increase), many Humeans posit a 'Past Hypothesis' (a low-entropy boundary condition) as part of the Best System. Is the Past Hypothesis a law or a particular fact? If it's a law, it's a singular statement about one time, which violates the usual universality of laws. If it's a fact, it doesn't explain the asymmetry. How do you categorize it without breaking your own definitions?"

  *   **The Dodge:** She will likely argue that the Best System doesn't require strict universality, only optimal balance of simplicity and strength, and the Past Hypothesis earns its spot by boosting strength immensely for little simplicity cost.
  *   **The Follow-up:** "But if a singular fact can be a law, what stops *any* convenient particular fact from becoming a law? It seems you are blurring the distinction between initial conditions and dynamical laws. If that distinction collapses, does the BSA still capture what scientists mean by 'dynamical law'?"

  ### 8. Scientific Realism and Discovery
  **Question:** "When physicists search for laws, they act as though they are discovering governing constraints that *make* the phenomena happen, not summarizing data points. They reject regularities that lack a mechanism. Does the Humean view entail a form of error theory regarding scientific practice? Are scientists systematically deluded about the modal force of the laws they claim to find?"

  *   **The Dodge:** She will say philosophy is not ethnography; just because scientists *talk* modally doesn't mean the metaphysics is modal. We are reconstructing the *truth conditions*, not the psychology.
  *   **The Follow-up:** "But if your reconstruction diverges this sharply from the practice, why think you are analyzing *scientific* laws rather than proposing a replacement concept? If the 'laws' you describe don't do the work scientists need them to do (prediction, intervention, control), in what sense is this a philosophy *of science*?"
