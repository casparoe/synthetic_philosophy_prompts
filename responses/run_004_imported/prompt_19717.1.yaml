          *   Q2: Induction/Projection (Required).
          *   Q3: PNPs (Required).
          *   Q4: Explanatory Circularity (The "Loewer" move).
          *   Q5: Undermining Futures (Chance).
          *   Q6: Counterfactuals (The distinction from accidental generalizations).
          *   Q7: Temporal Asymmetry (Past Hypothesis status).
          *   Q8: Scientific Realism/Practice.

      *   *Refining the "Dodge/Follow-up":* This is the crucial value-add. I need to show I know *how* they answer (e.g., Loewer's "metaphysical vs. scientific explanation" distinction) and how to push back.

