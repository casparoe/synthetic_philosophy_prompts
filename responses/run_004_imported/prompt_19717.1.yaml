prompt: |-
  For my philosophy of science seminar on laws of nature, our department's colloquium next week has a speaker coming who's apparently a pretty die-hard Humean about all this -- the Lewis-descended line where there's no necessary connections in nature and a law just is whatever regularity earns a spot in the best system that balances simplicity against strength over the whole Humean mosaic of local qualities. My professor tapped a few of us to run the Q&A instead of the usual free-for-all, and honestly everyone in my class swears Humeans have like three stock moves memorized for every objection, so I don't want to hand her a softball shes already answered a hundred times.

  Can you draft me 6-8 real interview questions, the kind that actually press on where the view struggles instead of just getting her to restate it? I want at least one on the quantum entanglement problem -- entangled particles apparently have joint properties that don't supervene on the particles' individual states plus their spatiotemporal relations, which looks like a direct counterexample to the "everything supervenes on local matters of particular fact" claim. I want one on the objection that if nothing in a Humean law necessitates its instances, the regularity looks like a massive coincidence, and it's unclear what licenses projecting it onto the future rather than just the past we've already observed. And I want one on whether her appeal to "perfectly natural properties," which she needs so people can't just gerrymander predicates to make any old pattern look simple, isn't itself extra unexplained metaphysical structure that a view advertised as "nothing but the mosaic" shouldn't need in the first place. For each question, give me a line on the dodge she'll probably reach for and a follow-up that closes it off.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of science seminar on laws of nature.
      *   **Speaker:** A "die-hard Humean" (Lewis-style Best System Analysis/BSA).
      *   **Task:** Draft 6-8 interview questions for a Q&A session.
      *   **Goal:** Avoid "softballs" (standard objections with stock replies). Press on genuine struggles.
      *   **Specific Requirements:**
          *   Must include a question on Quantum Entanglement (non-supervenience).
          *   Must include a question on Induction/Coincidence (why project regularities if no necessitation?).
          *   Must include a question on Perfectly Natural Properties (PNPs) vs. sparse ontology.
          *   Format: Question + Anticipated Dodge + Follow-up.
          *   Tone: Academic, sharp, knowledgeable (seminar level).

  2.  **Deconstruct the Target View (Lewisian Humeanism/BSA):**
      *   *Core Thesis:* Laws are not governing entities; they are summaries of the "Humean Mosaic" (local matters of particular fact).
      *   *Mechanism:* Best System Analysis (balance of simplicity and strength).
      *   *Metaphysics:* Supervenience (everything depends on the mosaic), No Necessary Connections, Sparse properties (PNPs).
      *   *Common Weaknesses:* Circularity (laws explain mosaic, mosaic determines laws), Non-supervenience (QM), Normativity/Induction (why trust laws?), PNPs (are they Humean?), Chance/Probability (fit vs. truth).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Quantum Entanglement.*
          *   *Issue:* Entanglement suggests holism. The state of the system isn't determined by the state of parts + spatiotemporal relations. This violates Humean Supervenience.
          *   *Draft Question:* How do you handle QM entanglement if laws supervene on local facts?
          *   *Anticipated Dodge:* "I'll modify supervenience" or "QM isn't fundamental" or "The wavefunction is part of the mosaic."
          *   *Follow-up:* If you add the wavefunction to the mosaic, isn't it non-local? If you change supervenience, isn't it no longer Humeanism?
          *   *Refinement:* Make it precise. Focus on the tension between *local* qualities and *non-separable* states.

      *   *Requirement 2: Induction/Coincidence.*
          *   *Issue:* If laws are just summaries, why think they hold tomorrow? It looks like a cosmic coincidence that the "best system" stays stable.
          *   *Draft Question:* Why believe in induction if laws don't necessitate anything?
          *   *Anticipated Dodge:* "Humeans can be inductivists pragmatically" or "Best System includes probabilistic laws that account for this."
          *   *Follow-up:* Pragmatism doesn't give truth. If the mosaic is contingent, what grounds the *expectation* of stability other than habit?
          *   *Refinement:* Focus on the "explanatory circularity." The system is best *because* of the regularities, but we trust the regularities *because* of the system.

      *   *Requirement 3: Perfectly Natural Properties (PNPs).*
          *   *Issue:* Humeanism wants a sparse ontology. But PNPs seem like heavy-duty metaphysics. Who decides what's "natural"?
          *   *Draft Question:* Aren't PNPs just extra metaphysical baggage?
          *   *Anticipated Dodge:* "They are needed to avoid triviality (Goodman's grue)."
          *   *Follow-up:* If you need primitive modality to pick out PNPs, haven't you surrendered the "no necessary connections" claim?
          *   *Refinement:* Focus on the tension between "nothing but the mosaic" and "primitive naturalness."

      *   *Requirement 4: Circularity/Explanatory Role.*
          *   *Issue:* Laws are supposed to explain phenomena. But on BSA, phenomena determine laws. How can the effect explain the cause (metaphysically)?
          *   *Draft Question:* How can laws explain the mosaic if they supervene on it?
          *   *Anticipated Dodge:* "Systematization is explanatory" or "It's a different kind of explanation."
          *   *Follow-up:* Does this reduce scientific explanation to mere compression?
          *   *Refinement:* Push on the direction of fit.

      *   *Requirement 5: Chance and Probability.*
          *   *Issue:* In BSA, chances are just frequencies in the best system. But single-case chances seem real (e.g., this atom decaying).
          *   *Draft Question:* How do you handle single-case probabilities?
          *   *Anticipated Dodge:* "Fit" metric in the Best System.
          *   *Follow-up:* If the actual frequency deviates (unlikely but possible), does the law change?
          *   *Refinement:* Focus on the "undermining future" problem (Lewis's own worry).

      *   *Requirement 6: Counterfactuals.*
          *   *Issue:* Laws support counterfactuals ("If I dropped this, it would fall"). Regularities don't ("All coins in my pocket are silver" doesn't mean "If this penny were in my pocket, it would be silver").
          *   *Draft Question:* How do Humean laws support counterfactuals better than accidental regularities?
          *   *Anticipated Dodge:* "The Best System is more stable under perturbations."
          *   *Follow-up:* Stability relative to what? If the mosaic is all there is, what are you perturbing?
          *   *Refinement:* Focus on the grounding of the counterfactual truth conditions.

      *   *Requirement 7: Temporal Symmetry/Asymmetry.*
          *   *Issue:* Fundamental physics is often time-symmetric, but laws/entropy are not. BSA treats time as just another dimension in the mosaic.
          *   *Draft Question:* How do you get temporal asymmetry of explanation from a static mosaic?
          *   *Anticipated Dodge:* "Past Hypothesis."
          *   *Follow-up:* Is the Past Hypothesis a law or a fact? If a law, does it supervene?
          *   *Refinement:* Keep it tight.

      *   *Requirement 8: Scientific Practice/Realism.*
          *   *Issue:* Scientists act like they are discovering governing constraints, not summarizing data.
          *   *Draft Question:* Does BSA misrepresent scientific practice?
          *   *Anticipated Dodge:* "Philosophy reconstructs, doesn't describe psychology."
          *   *Follow-up:* If it diverges too much, is it still a philosophy *of science*?
          *   *Refinement:* Focus on the normative aspect of law-discovery.

  4.  **Review and Refine:**
      *   Check against constraints: 6-8 questions? Yes. Specific topics included? Yes (Entanglement, Induction, PNPs). Dodge/Follow-up structure? Yes.
      *   Tone check: Needs to sound like a grad student who knows the literature (Lewis, Loewer, Hall, Bird, Armstrong).
      *   *Self-Correction on Entanglement:* Make sure to mention *supervenience failure* specifically.
      *   *Self-Correction on Induction:* Distinguish between psychological habit and rational justification.
      *   *Self-Correction on PNPs:* Highlight the "primitiveness" of naturalness.

  5.  **Final Polish:** Organize clearly with headings. Ensure the "Dodge" and "Follow-up" are distinct and actionable. (Proceed to generate output based on these thoughts).

      *   *Wait, one check:* The prompt asks for "6-8 real interview questions." I need to make sure I don't just list topics but actual phrased questions.
      *   *Check Specific Requirements again:*
