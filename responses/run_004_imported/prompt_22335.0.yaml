answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a software engineer, and I've had the privilege of being Nick's roommate and friend for the last [Number] years.

  Usually, this is the part of the speech where I tell you how lucky Nick is, or how much he "deserves" Elena. But about two weeks ago, Nick pulled me aside and gently informed me that if I used the word "deserve," I would be undermining the metaphysical foundation of his entire adult life.

  For the half of the room who spent the last six years in the philosophy department with him: yes, I know. Nick is a hard incompatibilist. He believes we are all deterministic systems running a program nobody wrote. He believes that praising him for being a good man is like praising a toaster for making toast.

  And for the half of the room who are just here for the open bar: Nick believes that free will is an illusion, and he will absolutely explain why over appetizers if you let him.

  But here is the thing I've learned as an engineer, and I think it's something Strawson—who Nick spent his dissertation arguing against—would agree with. You can analyze a system until you understand every line of its code, every input and output. You can understand *why* it works. But that doesn't change the fact that when it works, it's beautiful.

  Nick, you may not believe you *chose* to be kind, or loyal, or brilliant. You may say you were causally necessitated to be the best friend I've ever had. But my gratitude doesn't require a metaphysical loophole to be real. My emotional programming hasn't been patched yet, and it tells me to thank you.

  And then there is Elena. Elena, you are the ultimate realist. You know better than anyone that Nick views the world through the lens of causality. You know that when he looks at you, part of his brain is categorizing you as a distinct moral agent while another part is wondering if your love is just a complex biological algorithm.

  And yet, you're marrying him.

  Nick insists this marriage wasn't a choice, but a causal necessity. And looking at the two of you, I have to agree: the universe didn't really leave you any other option.

  There is a concept Nick studies called the "objective attitude," where you treat a person as a case to be managed rather than someone to connect with. We see that in the world all the time. But what I see between you two is the opposite. It is messy, and reactive, and deeply human. It is the kind of love that doesn't wait for the philosophy to settle before it feels.

  So, I am not going to ask you to believe in free will. I am not going to ask you to believe you "earned" this happiness in a cosmic sense.

  I am simply going to ask you to accept it.

  If we are all just deterministic systems, then let us be systems that are determined to cherish each other. Let us be caused to be kind. Let us be programmed for joy.

  Please raise your glasses. To Nick and Elena: May your causal chains intertwine favorably, may your reactive attitudes remain forever engaged, and may the future be exactly what you are determined to make it.

  To Nick and Elena!
