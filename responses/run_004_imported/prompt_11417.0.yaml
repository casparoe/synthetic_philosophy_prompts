answer: |-
  This is a classic meta-ontological stalemate, essentially a reenactment of the Carnap-Quine-Sider debates that often pop up in rationalist-adjacent circles. It's a high-quality disagreement because both sides are articulating defensible philosophical positions (Mereological Nihilism vs. Common-Sense Realism/Deflationism).

  Here is the move-by-move refereeing, followed by my verdict on the substance of the dispute.

  ### Move-by-Move Referee

  **(1) Leo: The Nihilist Opening**
  *   **Claim:** Composite objects don't exist; only simples arranged table-wise exist. Drawing a line for composition is arbitrary.
  *   **Analysis:** This is the standard argument for Mereological Nihilism (akin to Peter van Inwagen or Trenton Merricks). The "arbitrariness" worry is the strongest engine for this view: if particles make a table, why don't they make a "tibble" (table + half a cat)? If there's no non-arbitrary answer, deny composition entirely.
  *   **Critique:** It's theoretically clean but phenomenologically costly. It solves the vagueness problem by eliminating the vague objects.
  *   **Score:** **+1**. A solid, philosophically rigorous opening gambit. It sets the terms clearly, even if the conclusion is radical.

  **(2) Marissa: The Moorean Shift**
  *   **Claim:** The table is obvious (laptop rests on it). If theory contradicts obvious fact, the theory loses.
  *   **Analysis:** This is a G.E. Moore-style "Here is a hand" argument. She prioritizes the certainty of common sense over the certainty of metaphysical premises.
  *   **Critique:** Pragmatically effective, but dialectically weak against a committed metaphysician. Leo isn't denying the *phenomenon* (the laptop is supported); he's denying the *ontology* (that a "table" is the thing doing the supporting). She asserts her conclusion rather than engaging his worry about arbitrariness.
  *   **Score:** **+1**. Correct on intuition, but doesn't actually engage the mechanism of Leo's argument. It's a stalemate move.

  **(3) Leo: The "Loose vs. Strict" Distinction**
  *   **Claim:** "There is a table" is true loosely (like "sun rises"), but false strictly. Ordinary talk isn't trying to answer the strict question.
  *   **Analysis:** This is an error-theory or fictionalist concession. It attempts to save the utility of language while maintaining ontological purity.
  *   **Critique:** This is necessary for Leo to avoid sounding insane, but it opens him up to Marissa's next attack. If the "loose" sense works for everything we do, what work is the "strict" sense doing?
  *   **Score:** **+1**. A reasonable clarification that keeps the conversation going, but it weakens the practical stakes of his position.

  **(4) Marissa: The Taboo/Verbal Dispute Charge**
  *   **Claim:** Taboo "exists." If we agree on particle arrangement, we agree on all facts. The rest is definition/stipulation.
  *   **Analysis:** This is the Carnap/Chalmers move. She argues the dispute is merely verbal because there is no empirical or structural difference in the world-models, only a difference in labeling.
  *   **Critique:** In a rationalist context, this is the strongest possible move. It demands cash-value for the disagreement. If the map is identical except for one label, the territory hasn't changed.
  *   **Score:** **+2**. The strongest dialectical move so far. It forces Leo to justify why his distinction isn't just semantic stipulation.

  **(5) Leo: The "Joint-Carving" Defense**
  *   **Claim:** It's not about words; it's about whether reality contains tables *as extra items* over particles. The question survives vocabulary changes.
  *   **Analysis:** This appeals to Ted Sider's *Writing the Book of the World*. Leo is claiming there is a fact of the matter about *fundamentality*. He argues that "table" does not "carve nature at its joints," even if it's a useful shorthand.
  *   **Critique:** This successfully parries Marissa's taboo move. You can describe the particles without the word "table," but you still have to decide: is the *fact* of the table fundamental or derivative? Leo says derivative (or non-existent); Marissa implies it's fundamental (or at least real).
  *   **Score:** **+1**. Philosophically deep. It prevents the dispute from dissolving, but it relies on a contested metaphysical notion ("fundamentality") that Marissa doesn't accept.

  ---

  ### The Verdict: Verbal or Substantive?

  **My Take:** This is a **substantive disagreement disguised as a verbal one**, but the substance lies in a place neither of them explicitly named.

  If you ask, "Is this dispute merely verbal?" the answer depends entirely on whether you believe ontology is about **quantification** (what we quantify over in our best logic) or **fundamentality** (what structure is basic in reality).

  *   **Marissa** is treating existence as a quantifier. If our best theory of the world requires variables ranging over tables to explain causal interactions, tables exist. Since tabooing the word doesn't change the causal interactions, the dispute is verbal.
  *   **Leo** is treating existence as a marker of fundamentality. He believes there is a "Book of the World" written in the language of physics/simples, and "table" does not appear in that vocabulary. For him, the dispute is about the *structure* of reality, not the labels.

  **Who won?**
  Dialectically, **Marissa** won the hangout. In a casual setting, the burden of proof is on the person claiming common sense is wrong. Leo's "strict sense" risks becoming an invisible dragon—a distinction that makes no difference to prediction or experience.
  Metaphysically, **Leo** is more consistent. If you push the "no arbitrary lines" argument, Marissa has no good answer for where composition *does* stop. She relies on intuition, which history shows is unreliable.

  **What Neither Is Seeing: The Concept of "Grounding"**

  The reason they went in circles is that they are arguing about **existence** when they should be arguing about **grounding**.

  Modern metaphysics (post-2010s) largely resolves this stalemate by distinguishing between *what exists* and *what is fundamental*.
  *   **The Blind Spot:** They are treating "exists" as a univocal term. They should be using a pluralist account.
  *   **The Resolution:** Marissa is right that tables *exist* (in the derivative sense). Leo is right that tables are not *fundamental* (in the basic sense).
  *   **The Missing Move:** Someone should have said: "Leo, the table *exists*, but its existence is **grounded** in the particles. Marissa, the table is *real*, but it isn't **fundamental**. You agree on the structure; you disagree on whether 'existence' tracks 'reality' or 'fundamentality'."

  **Why the Taboo Move Didn't Fully Settle It:**
  Marissa thought tabooing "exists" would make the disagreement disappear. It didn't, because Leo is right: you can describe the particle arrangement and still ask, "Is this arrangement a *unified object* or just a *collection*?" That is a structural question about the world, not just a semantic one about the word "table." However, Marissa is also right that if the answer to that question doesn't change how the particles behave or how we predict the future, the *practical* difference is zero.

  **Final Scorecard:**
  *   **Leo:** +4 (Consistent, deep, but impractical)
  *   **Marissa:** +3 (Pragmatic, clear, but metaphysically shallow)

  **Advice for next time:** If this comes up again, suggest they taboo "exists" and replace it with "is fundamental." Leo will say "No," Marissa will say "Yes," and suddenly they will realize they are arguing about the *hierarchy* of reality, not the *contents* of it. That is a much more productive fight.
