answer: |-
  This is a fantastic pivot point for a graduate seminar. The Greaves/Lenman debate cuts to the heart of whether consequentialism is a decision procedure or a criterion of rightness, and whether epistemic limitations can be formalized away.

  Here is an intuitive breakdown of the mechanics of the symmetry argument, followed by the structural critique of its stability.

  ---

  ### 1. The Mechanism of Symmetry: Why "Simple" Washes Out

  To understand why symmetry neutralizes simple cluelessness, you have to look at the math of **Expected Value (EV)** under the **Principle of Indifference**.

  **The Intuition: The Zero-Sum Noise**
  Imagine you are trying to calculate the total value of an action ($A$).
  $$EV(A) = \text{Known Short-Term Effects} + \text{Unknown Long-Term Effects}$$

  In **Simple Cluelessness** (e.g., buying a cup of coffee), the consequentialist argues that while the long-term ripple effects are vast, they are *stochastically symmetric*.
  *   **The Mechanism:** For every unknown future branch where your coffee purchase leads to a slightly better world (e.g., the barista is happy and treats a customer kindly), there is a counterpart branch where it leads to a slightly worse world (e.g., the barista is caffeinated and snaps at a customer).
  *   **The Epistemic Move:** Because you have *no evidence* favoring the "better" branches over the "worse" branches, you assign them equal probability weight.
  *   **The Result:** The positive unknowns and negative unknowns cancel each other out mathematically. The expected value of the "unknown future" term becomes **zero**.
  *   **Conclusion:** You are left deciding based entirely on the *known* short-term effects. The cluelessness is "bracketed."

  **Why It Doesn't Generalize to Complex Cluelessness**
  In **Complex Cluelessness** (e.g., donating to a high-impact charity that saves lives), the symmetry breaks because we possess **valenced evidence** that we cannot quantify.
  *   **The Mechanism:** We have a specific reason to think the ripple effects lean one way. For example, saving a life today changes the population size and identity of future generations (the Non-Identity Problem). We might have a theoretical reason to think a larger population is better (Total Utilitarianism), but we don't know if the quality of life will be positive or negative.
  *   **The Block:** We know the coin is *biased*, but we don't know *how* biased it is. Is the probability of a good future 51%? 90%? 10%?
  *   **The Result:** You cannot apply the Principle of Indifference. You cannot assume the unknowns cancel out, because you have evidence they won't. But because you cannot assign a specific probability, you cannot calculate an EV.
  *   **Conclusion:** The decision procedure stalls. You cannot ignore the long-term effects, but you cannot compute them.

  **The Gut-Level Distinction:**
  *   **Simple:** "I have no idea which way the wind is blowing, so I assume it's calm." (Ignorance allows indifference).
  *   **Complex:** "I see the trees bending, so I know there's wind. But I have no anemometer, so I don't know if it's a breeze or a hurricane." (Evidence forbids indifference, but lack of precision forbids calculation).

  ---

  ### 2. The Critic's Wedge: Why the Distinction is Unstable

  Critics like James Lenman (and others like Ted Lockhart or those influenced by moral luck arguments) argue that the line between Simple and Complex is not a principled metaphysical distinction, but an **epistemic artifact** that begs the question.

  Here are the two main prongs of the instability critique.

  #### A. The "Symmetry is a Substantive Claim" Objection
  Greaves treats Simple Cluelessness as a state of *pure ignorance*. She argues that in the absence of evidence, symmetry is the default rational stance.

  Lenman counters that asserting symmetry is not a default; it is a **substantive empirical claim** about the structure of the world.
  *   **The Critique:** To say "the good and bad long-term effects of buying coffee cancel out" is to claim you know something about the *distribution of value* in the causal network of the universe.
  *   **Why it's Question-Begging:** If you are truly clueless about the long-term future, you are also clueless about whether the effects are symmetric. Maybe the universe is such that small economic transactions tend to have net negative long-term effects (e.g., reinforcing exploitative systems). Maybe they tend to be positive.
  *   **The Trap:** By classifying a case as "Simple," Greaves is assuming we know enough to rule out systematic bias. But if we were truly in a state of cluelessness, we wouldn't know if symmetry held. Therefore, "Simple Cluelessness" is just "Complex Cluelessness where we *assume* symmetry without evidence."

  #### B. The "Salience vs. Structure" Objection
  The distinction often relies on whether there is a *salient* argument for asymmetry.
  *   **Greaves:** Buying coffee has no salient argument for long-term asymmetry. Saving lives does (population ethics).
  *   **Critic:** Salience is psychological, not metaphysical. Just because we haven't *thought of* a reason why buying coffee alters the trajectory of history in a biased way doesn't mean one doesn't exist.
  *   **The Instability:** Any case of Simple Cluelessness can be converted into Complex Cluelessness by doing enough philosophy.
      *   *Example:* Once you realize that buying coffee supports a global commodity market that influences geopolitical stability, you now have a "reason to think" the effects might be asymmetric.
      *   If the distinction depends on how hard we look for asymmetries, it isn't a stable foundation for a moral theory. It makes the action-guiding capacity of consequentialism depend on our current imaginative limitations.

  ---

  ### 3. An Example to Bring Out the Disagreement

  To make this concrete for your seminar, consider the case of **Voting in a Swing State**.

  **The Consequentialist (Greaves-style) Analysis:**
  *   **Short-term:** Cost of time/gas (negative).
  *   **Long-term:** Probability of being the decisive vote is 1 in millions.
  *   **Classification:** **Simple Cluelessness.**
  *   **Reasoning:** If my vote *does* happen to be decisive (the 1 in a million case), the effects of the elected official are huge but unknown. However, I have no reason to think the elected official will make the long-term future better or worse *in expectation*. The "identity" of the winner is unknown, and the value of their tenure is symmetric around zero.
  *   **Verdict:** The unknown long-term EV is zero. Don't vote (costs outweigh known benefits).

  **The Critic (Lenman-style) Analysis:**
  *   **Classification:** **Complex Cluelessness.**
  *   **Reasoning:** Wait. We actually *do* have evidence of asymmetry. We know the candidates have different platforms. We know one platform is more likely to lead to climate action, war, or economic shifts.
  *   **The Friction:** The Consequentialist says, "Yes, but we can't quantify the *long-term* value of those platforms 100 years out."
  *   **The Critic's Counter:** "Exactly! But you can't assume the long-term value of Candidate A is symmetric to Candidate B just because you can't quantify it. That is a massive claim. You are claiming that the *distribution* of possible futures under Candidate A has the same mean value as Candidate B. You have no evidence for that."
  *   **The Instability:** The Consequentialist tries to shove this back into "Simple" by saying "We are clueless about the 100-year effects." The Critic says "No, you have *directional* evidence (platforms), just imprecise data. That is the definition of Complex."

  **The Seminar Pivot Point:**
  The disagreement isn't about the facts of the world; it's about the **burden of proof for symmetry**.
  *   **Greaves:** Symmetry is the null hypothesis. If you can't prove asymmetry, you must assume symmetry to act.
  *   **Lenman:** Symmetry is a hypothesis like any other. If you are clueless, you cannot justify the null hypothesis. Therefore, you remain paralyzed.

  ### Summary for the Seminar
  1.  **Symmetry's Work:** It turns "unknown variables" into "zero value" via the Principle of Indifference, allowing agents to focus on known short-term effects.
  2.  **The Failure to Generalize:** It fails when there is *directional evidence* (Complex), because indifference is no longer rational, but quantification remains impossible.
  3.  **The Instability:** Critics argue that claiming a case is "Simple" (symmetric) requires knowledge about the distribution of future value that a "clueless" agent cannot possess. Thus, the distinction collapses: all deep cluelessness is Complex, because we never truly know if the universe is symmetric.

  This framing should allow your students to see that the debate is less about "how much we know" and more about "what rationality requires when we don't know."
