prompt: |-
  I'm preparing a graduate seminar on consequentialism and its critics, and I keep getting tangled up in the literature on cluelessness—specifically the distinction, drawn most carefully by Hilary Greaves, between "simple" and "complex" cluelessness. The rough idea seems to be that in cases of simple cluelessness (say, the far-future effects of buying a cup of coffee), our uncertainty about consequences is symmetric in some relevant sense, so it can be bracketed or "washed out" without threatening the action-guiding capacity of consequentialism. In cases of complex cluelessness (say, the long-run effects of donating to a specific charity), we allegedly have asymmetric but stubbornly unquantifiable evidence pointing in some direction, and this is supposed to generate a much deeper problem for expected-value reasoning.

  What I'd like help with is an intuitive, gut-level explanation of two things: first, why the symmetry consideration is thought to neutralize simple cluelessness but not complex cluelessness—what exactly is doing the work in the "symmetry" argument, and why doesn't it generalize? Second, I'd like to understand why several critics (Lenman among them, though I think others have pressed similar points) regard the simple/complex distinction itself as unstable or question-begging, rather than a principled carving of the cluelessness problem. I'm less interested in a survey of the literature than in getting clear on the underlying structure of the disagreement, ideally with an example or two that brings out why reasonable people might come down differently on where the line falls.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on consequentialism and its critics.
      *   **Topic:** The distinction between "simple" and "complex" cluelessness (primarily associated with Hilary Greaves).
      *   **Specific Questions:**
          1.  Intuitive/gut-level explanation of *why* symmetry neutralizes simple cluelessness but not complex cluelessness (what's the mechanism?).
          2.  Explanation of *why* critics (like Lenman) find the distinction unstable or question-begging.
      *   **Constraints:** Less interested in a literature survey, more interested in the underlying structure of the disagreement. Needs examples to illustrate the friction points.

  2.  **Deconstruct Question 1: The Symmetry Argument (Simple vs. Complex):**
      *   *Core Concept:* Expected Value (EV) reasoning under uncertainty.
      *   *Simple Cluelessness:* We know nothing about the long-term effects.
          *   *Intuition:* If I know *nothing*, the probability of "good outcome" vs. "bad outcome" is effectively 50/50 (or distributed symmetrically around zero).
          *   *Mechanism:* The Law of Large Numbers / Cancellation. If I do $A$, there are infinite ripple effects. Some are good, some are bad. Without evidence favoring one side, the *expected* value of the unknown future is zero. Therefore, we decide based on the *known* short-term effects.
          *   *Analogy:* Flipping a coin where you don't know the bias, but have no reason to suspect it's biased. You treat it as fair.
      *   *Complex Cluelessness:* We have *some* reason to think effects lean one way, but can't quantify it.
          *   *Intuition:* There's a signal in the noise, but the signal-to-noise ratio is unknowable.
          *   *Mechanism:* The symmetry breaks. We have evidence $E$ that suggests outcome $O$ is more likely. But we can't assign $P(O|E)$. If we can't assign a probability, we can't calculate EV. If we can't calculate EV, consequentialism (which demands maximizing EV) stalls.
          *   *Analogy:* You see a cloudy sky (evidence of rain). You don't know the meteorological probability, but you know it's not 50/50 anymore. It's $>50\%$. But is it 60%? 90%? If the stakes are high enough, not knowing *which* it is paralyzes decision-making.
      *   *Why doesn't it generalize?* Because complex cluelessness asserts an *asymmetry* in the evidence. Simple cluelessness asserts *ignorance*. Ignorance allows the principle of indifference; asymmetry forbids it.

  3.  **Deconstruct Question 2: The Critic's Objection (Lenman et al.):**
      *   *Core Critique:* The distinction relies on a false dichotomy between "ignorance" and "evidence."
      *   *The "Unstable" Charge:* Almost every case of simple cluelessness can be reframed as complex cluelessness if you look hard enough.
      *   *The "Question-Begging" Charge:* To call a case "simple" is to assume there is *no* reason to think the future is better or worse. But consequentialism (especially total utilitarianism) often implies that population changes or trajectory changes *do* have valenced effects. Asserting symmetry is often an artifact of our cognitive limitations, not the structure of the world.
      *   *Lenman's Specific Angle:* Moral luck and the opacity of consequences. If the future is truly opaque, we can't know if the symmetry holds. Asserting symmetry is a gamble, not a deduction.
      *   *Example:* Buying coffee.
          *   *Greaves:* Simple. Effects on population/timeline are symmetric.
          *   *Lenman:* How do you know? Maybe buying coffee supports a supply chain that slightly shifts geopolitical power, leading to war (bad) or peace (good). If you claim symmetry, you are claiming knowledge about the *distribution* of future values that you explicitly disclaim having.

  4.  **Synthesize and Structure the Explanation:**
      *   **Introduction:** Acknowledge the sophistication of the question. Set the stage (EV maximization under uncertainty).
      *   **Part 1: The Symmetry Mechanism (The "Why it works" for Simple).**
          *   Use the "Zero-Sum Noise" analogy.
          *   Explain the Principle of Indifference.
          *   Contrast with Complex (The "Biased Coin" analogy).
          *   *Key Insight:* Simple = No signal (noise cancels). Complex = Signal present but unmeasurable (noise doesn't cancel).
      *   **Part 2: The Critic's Wedge (Why the distinction is unstable).**
          *   Focus on the epistemic status of the symmetry claim.
          *   Argument: Asserting symmetry *is* a substantive empirical claim.
          *   Lenman's point: We are clueless *about whether symmetry holds*.
          *   The "Spectrum" problem: It's not a binary; it's a gradient of evidence quality.
      *   **Part 3: Illustrative Example (The "Butterfly Effect" vs. "Policy Change").**
          *   Need an example that blurs the line.
          *   *Idea:* Donating to bednets.
          *   *Greaves:* Complex (we know saving lives affects population/trajectory).
          *   *Critic:* Why is buying coffee simple? Maybe the coffee farmer uses the money for something trajectory-altering. The distinction relies on *salience*, not metaphysics.
      *   **Conclusion:** Summarize the stakes (Action-guiding vs. Epistemic humility).

  5.  **Refine the Tone:**
      *   Graduate seminar level: Precise, philosophical, but accessible.
      *   Avoid excessive jargon where intuition serves better.
      *   Ensure Greaves' position is represented charitably before critiquing it.
      *   Ensure Lenman's critique is clear (it's often about the *justification* for the symmetry assumption).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* symmetry neutralizes the problem? Yes, because $EV = P(Good) \times Value + P(Bad) \times -Value$. If $P(Good) = P(Bad)$, $EV_{unknown} = 0$.
      *   *Check:* Did I explain Lenman's objection clearly? Lenman argues that claiming symmetry requires knowledge we don't have. It's not "absence of evidence," it's "evidence of absence" of bias, which we lack.
      *   *Refinement:* Make sure to highlight that for Greaves, "Simple" isn't just "we don't know," it's "we have no reason to think $X$ over $Y$." Lenman says we *always* have some reason, or we can't know we don't.
      *   *Example:* Let's use the "Coffee vs. Charity" example the user mentioned but deepen it.
      *   *Wait, one nuance:* Greaves distinguishes based on *reasons*. Simple: No reasons favor one outcome. Complex: Reasons favor one outcome, but we can't weigh them.
      *   *Lenman's counter:* How do you know you have no reasons? That itself is a claim about the world.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Intuitive/gut-level? (Use analogies).
      *   Why symmetry works? (Cancellation).
      *   Why critics dislike it? (Epistemic overreach/Instability).
      *   Examples? (Coffee vs. Bednets/Policy).

