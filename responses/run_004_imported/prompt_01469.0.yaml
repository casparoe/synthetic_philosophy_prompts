answer: |-
  This is actually one of the most famous and nuanced debates in Marxist theory, so you and your friend are in good company. Philosophers and economists have argued over this exact point for over a century.

  Here is the short answer: **Your friend is technically more accurate regarding Marx's specific economic mechanism, but you are right about the outcome.**

  The contradiction you feel ("If it's fair, how is it exploitation?") is exactly the puzzle Marx wanted you to solve. He argues that exploitation happens *without* cheating.

  Here is the breakdown of who was right, how the mechanism works, and what Marx actually thought about "justice."

  ### 1. The Core Distinction: Labor vs. Labor Power
  To settle the argument, you have to understand the one distinction that makes Marx's theory work.

  *   **Your view:** The capitalist pays the worker less than the value of their **Labor** (the work they do).
  *   **Marx's view:** The capitalist pays the worker the full value of their **Labor Power** (their capacity to work).

  **Here is the trick:** Marx argues that workers do not sell "labor" to the capitalist; they sell "labor power."
  *   **Labor Power** is a commodity like any other. Its value is determined by how much it costs to produce and reproduce it (i.e., food, rent, clothes, training needed to keep the worker alive and coming back tomorrow).
  *   **Labor** is the actual activity of working, which creates *new* value.

  **The Exchange (Where your friend is right):**
  When the capitalist hires the worker, they agree on a wage. Let's say it takes \$100 a day to keep you fed and housed (the value of your labor power). The capitalist pays you \$100.
  Marx insists this exchange is **fair and equal** in the market sense. The capitalist pays the full market value for the commodity they bought (your ability to work). No cheating occurs here. If the capitalist paid you \$80 for \$100 worth of labor power, that would be fraud, but Marx says capitalism doesn't *need* fraud to function.

  **The Production (Where you are right):**
  Once the capitalist owns your "labor power" for the day, they get to use it. They put you to work for 8 hours.
  *   In the first 4 hours, you might produce \$100 worth of goods. This covers your wage.
  *   In the next 4 hours, you *keep* working. You produce another \$100 worth of goods.
  *   This second \$100 is **Surplus Value**.

  Because the capitalist owns the means of production and bought your labor power for the day, they keep that second \$100. You were paid the full value of your *capacity* to work, but you were not paid for the full value of what you *actually produced*.

  **Verdict:** Your friend is right that the *wage exchange* is "fair" by market standards. You are right that the worker is effectively being drained of value. Marx's point is that the exploitation happens in **production**, not in the **market exchange**.

  ### 2. So, is it "Cheating"?
  If you define "cheating" as breaking the rules or lying about the price, Marx would say **no**. The capitalist is following the rules of the market perfectly.

  However, if you define "cheating" as appropriating value you didn't create, Marx would say **yes**. He often uses moralistic language like "robbery," "theft," and "embezzlement" to describe surplus value.

  The "cleverness" your friend mentioned is that Marx shows you don't need a "bad apple" capitalist to have exploitation. Even if every capitalist pays a "living wage" and follows all laws perfectly, exploitation still occurs structurally because the worker *must* sell their labor power to survive, and the capitalist *must* extract surplus value to compete.

  ### 3. Did Marx Think Capitalism Was "Unjust"?
  This is the second part of your argument, and it is much trickier. Scholars actually split into two camps on this (often called the Wood-Husami debate).

  **Camp A: No, Marx didn't think it was "unjust" (Technically)**
  Marx was very critical of other socialists who complained about capitalism being "unfair." He viewed "justice" as a legal/ideological concept that belongs to the specific economic system.
  *   In feudalism, it was "just" for lords to take a cut of the serf's crop.
  *   In capitalism, it is "just" for capitalists to keep the surplus value, because they bought the labor power at market rate.
  Marx argued that crying "Unjust!" implies you want capitalism to follow its own rules better. He wanted to overthrow the system entirely, not make it "fairer." In *Capital*, he writes that the transaction between capitalist and worker is "a very Eden of the innate rights of man... the only thing that matters is that they exchange equivalent for equivalent."

  **Camp B: Yes, Marx thought it was "unjust" (Spiritually)**
  Despite the technical argument above, Marx clearly hated capitalism. He describes it as "vampire-like" and talks about the "defrauding" of the worker. He believed capitalism stifled human potential and caused alienation. Many argue that while Marx mocked *bourgeois* justice, he had an implicit *communist* standard of justice where people should receive the full fruit of their labor.

  **The Synthesis:**
  Marx likely thought calling capitalism "unjust" was too weak a critique. "Justice" implies fixing the rules. Marx wanted to end the game. He viewed capitalism as **oppressive** and **exploitative**, which is a deeper critique than simply calling it "unfair."

  ### How to Settle the Bet
  You can tell your friend:

  1.  **She wins on the mechanics:** Marx explicitly argues that the wage exchange is an exchange of equivalents. If the worker were paid the full value of what they produce, there would be no profit, and capitalism would collapse. The system relies on the exchange being "fair" in the market to hide the exploitation in the factory.
  2.  **You win on the conclusion:** Even though the exchange is "fair," the result is that the worker creates more value than they receive. Marx absolutely views this as a form of systemic appropriation (exploitation), even if it isn't market fraud.
  3.  **On Justice:** You both lose (sort of). Marx thought calling it "unjust" was missing the point. He thought "justice" was a concept capitalists use to protect property rights. He didn't want capitalism to be just; he wanted it to be obsolete.

  **The Bottom Line:**
  Marx's argument is that **exploitation is compatible with fair exchange.** That is the paradox. The worker is not cheated on the price of their labor power, but they are dispossessed of the value their labor creates. That is why the system is exploitative without needing to be a scam.
