      *   *WELLBY/SWB:* Subjective Wellbeing usually has three components: Life Evaluation (Cognitive), Positive Affect, Negative Affect. HLI focuses heavily on Life Satisfaction (Cognitive).
      *   *StrongMinds vs. GiveDirectly:* This was a huge controversy. HLI's methodology was criticized (measurement duration, self-report bias, etc.). GiveDirectly advocates argued cash gives *agency* and *real assets*, not just feelings.
      *   *The Disanalogy:* Life satisfaction judgments aren't just "pleasure meters." They involve assessing one's life against a standard. But they are still internal states.
      *   *The "Smuggling" Charge:* Yes, prioritizing SWB *does* prioritize internal states over external states *by definition*. The question is whether that's a bug or a feature.
