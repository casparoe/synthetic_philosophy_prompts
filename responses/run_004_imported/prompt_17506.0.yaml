      *   Be respectful of Descartes (don't just call him an idiot; contextualize his science).
      *   Ensure philosophical accuracy (distinguish between *sentience* and *sapience*).

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Did Descartes say animals feel *nothing*? He said they don't have conscious *thought*. He compared them to machines that react to stimuli. He denied they have *qualia* (subjective experience).
      *   *Nuance:* Make sure to mention the "Language Test." That's his strongest argument.
