      *   Address Milgrom-Stokey specifics? Yes (common priors, rationality).

  9.  *(Final Polish)*: Ensure the distinction between *risk* (Milgrom-Stokey world) and *uncertainty* (Keynes world) is the centerpiece. That is the technical hinge where the theorem fails in a Keynesian framework.

