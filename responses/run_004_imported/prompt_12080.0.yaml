prompt: |-
  So I'm writing a novel about Ruth, a conductor who's retiring after thirty years with a small regional opera company, and her last production is Così fan tutte. At the closing night reception she has to say a few words to a room thats half orchestra and cast -- people who've lived inside this opera with her for six weeks and will wince if she gets glib -- and half board members and donors who just want a nice short toast and couldnt tell you who Da Ponte was. Ruth has basically built her conducting life around a Bernard Williams point about Così: that the opera never lets you resolve the tension between Don Alfonso's cynical little experiment and how seriously the music takes Fiordiligi and Dorabella's feelings, and that this refusal to resolve it is the whole point, not a flaw to be explained away. I need that idea to actually be doing work in the speech -- shaping what she can and can't bring herself to say about love and fidelity at this point in her life -- rather than just sitting there as decoration. Can you draft it for me? Three or four minutes, read aloud.
