      *   **Core Theme:** A Bernard Williams philosophical point about *Così*: The tension between Don Alfonso's cynicism (the experiment) and the music's seriousness (the women's feelings) is *never resolved*. This refusal to resolve is the point, not a flaw.
      *   **Constraint:** The idea must *do work* in the speech. It must shape what she says about love, fidelity, and her own retirement. It can't just be an academic reference.
      *   **Format:** Spoken speech, 3-4 minutes read aloud (approx. 450-600 words).
      *   **Tone:** Professional yet personal, poignant but not maudlin, intellectually rigorous but accessible enough for the donors.

  2.  **Deconstruct the Core Theme (Williams on *Così*):**
      *   *The Cynicism:* Men are fickle, women are fickle, everyone is fickle. ("Così fan tutte").
      *   *The Music:* When Fiordiligi sings "Per pietà," she means it. The pain is real. The music validates the emotion even if the plot undermines the fidelity.
      *   *The Tension:* If you side with Alfonso, the music is a lie. If you side with the women, the ending is a farce. Mozart/Williams says: Hold both. Don't solve it.
      *   *Application to Ruth:* She is leaving. Is her career a success? A failure? Does it matter? She loves this work, but she's done. Is that cynicism or acceptance? She needs to address the "fidelity" of the artists vs. the "transactional" nature of the donors without alienating either.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room. Bridge the gap between the two halves of the audience. Set the stage (30 years).
