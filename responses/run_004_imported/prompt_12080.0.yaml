      *   **Application to Retirement (The Personal Stake):** How does this apply to her leaving? Is she being faithful? Is she being cynical? No, she's holding the tension.
      *   **Closing:** A toast. Not a resolution, but a continuation.

  4.  **Refining the Voice:**
      *   Ruth is a conductor. She speaks in rhythms. She knows the score.
      *   She shouldn't sound like a professor lecturing. She needs to sound like someone who has *conducted* this idea for 30 years.
      *   *Challenge:* Making the Bernard Williams point clear to the donors without dumbing it down for the musicians.
      *   *Solution:* Frame it as "What Mozart tells us." The musicians know the music; the donors know Mozart is a genius. Meet in the middle.

  5.  **Drafting - Attempt 1 (Mental Outline):**
