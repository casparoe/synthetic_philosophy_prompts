answer: |-
  Thank you. Please, keep your seats. I know the champagne is waiting, and I know half of you are ready to dance, and the other half are checking your watches. I'll be brief. But we have just finished *Così fan tutte*, and after thirty years, I owe you the truth about what we do here.

  There is a temptation, at a reception like this, to offer a resolution. To say that art conquers all, or that love is eternal, or that this company is a "family." But if you have spent the last six weeks inside Mozart's score, you know that is a lie. And if you know this opera, you know that lying is the point.

  Don Alfonso tells us that fidelity is a joke. He says everyone betrays everyone, eventually. But then… Fiordiligi sings. She sings "Per pietà," and the music tells us her pain is absolute. It is not a joke. It is sacred. Mozart gives us a cynical plot, but he gives it a sincere heart.

  For a long time, people tried to fix this. They tried to say the women were lying, or that Alfonso was wrong. But the philosopher Bernard Williams once noted that the genius of *Così* is that it refuses to choose. It holds the cynicism and the sincerity in the same hand, and it does not let go of either. The tension is not a flaw to be solved. It is the truth of the matter.

  I tell you this because I am retiring.

  To the musicians and singers in this room: You know that the work we do is real, even when the story is a farce. You know that the fidelity you showed to this score for six weeks matters, even if the characters on stage couldn't keep their promises. You lived in that tension. You made it beautiful.

  To our board and donors: You ask us sometimes what the "takeaway" is. You want to know what the audience learned about love. I am telling you now: The takeaway is that there is no takeaway. We are here to sustain the ambiguity. We are here to fund the questions that do not have answers. If you want a moral, go to a lecture. If you want the truth, you come to the pit.

  And for me? After thirty years, it would be easy to say I am leaving because I am tired. Or to say I am leaving because I have achieved everything. Both are true. Neither is enough.

  I am not going to tell you that this company will go on forever. I am not going to promise that the art we made tonight will change the world. But I am going to tell you that for thirty years, I tried to keep the music honest while the world asked me to be practical. I tried to hold the tension.

  So, I will not say goodbye to the work. I will not say that this is an end. An end implies a resolution, and we know better than that.

  Please raise your glasses.

  To the cynics who keep us humble. To the believers who keep us singing. And to the space between them, where the music lives.

  To *Così*. To all of you. And to the unresolved.
