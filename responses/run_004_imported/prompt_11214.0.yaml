          *   *Gamble 3:* 11% chance at small renewal, 89% nothing.
          *   *Gamble 4:* 10% chance at big grant, 90% nothing.
          *   *Preference:* 1 > 2 and 4 > 3 (The Allais Pattern).
      *   **The EU Attack (Alex):**
