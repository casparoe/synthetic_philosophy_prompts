answer: |-
  The kitchen smelled of lemon polish and lukewarm casseroles. The hum of the refrigerator was the only sound, save for the clink of ceramic as Elena stacked plates. Marcus sat at the island, a half-empty glass of funeral Merlot sweating on the granite.

  "He suffered, El," Marcus said. He was staring at the stem of his glass. "The last six months. That was bad for him. But the death itself… stopping. That was a relief."

  "Then you agree with me," Elena said, not turning from the sink. "The cessation wasn't a harm. The pain was the harm. Once the pain stopped, the harm stopped."

  "You know that's not what I mean."

  "It is exactly what I mean. Epicurus was clear. *Where death is, I am not.* If Dad isn't there to experience the state of being dead, he isn't there to be harmed by it."

  Marcus swirled the wine. "He's not there to experience the *loss*, Elena. That's the point. It's not about experiencing the state of death. It's about the loss of the state of life."

  "Ah, the deprivation account." Elena turned, drying a fork with aggressive precision. "Thomas Nagel. 'Death is an evil because it brings to an end all the goods that life contains.' It's poetic, Marcus. It's also incoherent."

  "Incoherent? It's the only thing that makes sense of why we're sad."

  "We're sad. *We.* The subjects who exist." She walked over and took the glass from his hand, refilled it, set it back. "To say death is bad *for Dad* requires Dad to be the subject of that badness. But you've just admitted he's gone. You're positing a ghost who is hovering over his own grave, frustrated that he isn't eating breakfast tomorrow. That's not philosophy. That's theology."

  "I'm not positing a ghost. I'm positing a biographical narrative that got truncated." Marcus leaned forward, elbows on the counter. "Look, imagine a mathematician who dies the day before proving a theorem he's worked on for twenty years. We say, 'What a tragedy for him.' We don't say, 'Well, he doesn't know he didn't prove it, so no harm done.'"

  "Because we're the ones left holding the unfinished proof!" Elena's voice snapped, sharper than she intended. She softened, leaning against the counter. "The tragedy is for the math community. For *us*. For you and me. But for him? The moment his consciousness ceased, the possibility of the theorem ceased. There is no 'him' to be disappointed."

  "So you're saying the value of his life was only in the experiencing of it? Not the fulfillment of it?"

  "I'm saying the 'fulfillment' requires a subject to receive it."

  "Okay." Marcus took a breath. He'd heard this before, years ago, over cheaper wine in graduate dorms. But now the air felt heavier. "Let's go to Lucretius. I know you're saving it. The symmetry argument."

  Elena smiled, a thin, tired thing. "If you know it, why do you fight it? Look back, Marcus. Before 1948. Before he was born. An eternity of nonexistence. Does it bother you? Do you look at the year 1900 and think, 'Oh, poor Dad, he was missing out on the Boer War'?"

  "No."

  "Why not?"

  "Because he wasn't alive yet."

  "Exactly. The time after his death is just the mirror image of the time before his birth. Both are eternal nonexistence. If the pre-birth nonexistence isn't a harm, why is the post-death nonexistence a harm? It's just asymmetry of perspective. We look forward, not backward."

  Marcus rubbed his temples. "That's the dodge, El. You're treating time like a landscape we walk through. It's not."

  "Isn't it?"

  "No. Because there's a subject *in* the timeline." Marcus tapped the counter. "Before 1948, there was no person to deprive. There was no trajectory. After 2024, there *was* a person. There was a specific, concrete individual with desires, projects, and a biological momentum. Death isn't just 'nonexistence.' It's the *interruption* of an existing existence."

  Elena shook her head. "You're smuggling in the subject. Once he's dead, the subject is gone. You can't say 'he was deprived' because 'he' no longer refers to anything."

  "It refers to the person who lived!" Marcus's voice rose. "The harm attaches to the life that was lived, not the death that follows it. The badness of death is a function of the life it cancels. Pre-birth doesn't cancel anything. There was no line to cut. Post-death cuts the line. That is the asymmetry. It's not about the time; it's about the *vector*."

  Elena picked up a wine glass, inspected it for a smear. "A vector needs an endpoint to have direction. Death is the endpoint. You're mourning the shape of the curve. But Dad doesn't care about the shape of the curve."

  "I care about the shape of the curve!"

  "Then say that!" Elena slammed the glass down. It didn't break, but the sound cracked through the kitchen. "Say *you* are harmed. Say *I* am harmed. Don't project your deprivation onto a corpse. It's… it's disrespectful to his peace."

  "His peace?" Marcus laughed, a short, bitter sound. "He didn't want to go, Elena. He told me. He said he wasn't ready. If he wasn't ready, then stopping him was a harm to his interests."

  "Interests survive death?"

  "Projects survive the person. If I promise Dad I'll finish his memoir, and I burn it, I've wronged him. Even if he doesn't know."

  "That's a duty *you* have. That's your moral burden." Elena walked around the island and stood next to him. She put a hand on his shoulder. He didn't shrug it off, but he didn't lean into it. "Marcus. Listen to me. I know you want his death to mean something. I know you want to categorize it as a Great Evil because that validates how much you loved him. But if you buy the deprivation account, you have to live with the idea that he is currently suffering a loss. You have to imagine him, somewhere, being short-changed."

  "I don't imagine him anywhere. I imagine the world without him in it."

  "And that is bad for the world."

  "It's bad for *him* because it was *his* world." Marcus looked up at her. His eyes were red-rimmed. "You think you're helping. You think if you convince me he isn't harmed, I'll hurt less. But it makes it worse. It makes it random. If it's not a harm to him, then he was just… matter that rearranged. If it's a harm, then something valuable was destroyed."

  "Something valuable *was* destroyed," Elena said softly. "Him. The living him. But the dead him? The Lucretian non-entity? He isn't suffering the destruction. You are."

  "Maybe the distinction doesn't matter."

  "It matters. It matters for how you live. If death is a harm to the deceased, then life is a defensive posture against theft. If death is nothing to the deceased, then life is… a gift that doesn't demand repayment."

  Marcus stood up, taking his glass. He walked to the window. The backyard was dark; the patio lights were off. "I can't tell Dad that, though."

  "No."

  "I can't stand over the casket and think, 'Well, the symmetry argument holds, so this is neutral.'"

  "Then don't." Elena began stacking the silverware. "Think what you need to think to get through the night. But don't call it philosophy. Call it grief."

  Marcus watched her reflection in the dark glass. "You really believe it? That he's not… missing out?"

  Elena paused, a fork in her hand. She looked at the tines, then at her brother's back. For a second, the classicist mask slipped, and she just looked like a daughter in a quiet house.

  "I believe," she said, her voice barely audible, "that he doesn't have to worry about it anymore. And I wish I could say the same for us."

  She dropped the fork into the drawer. It clattered loudly.

  "More wine?" she asked.

  Marcus turned from the window. "Yeah. Okay."

  She poured. They drank in the silence of the kitchen, the argument suspended, unresolved, like the rest of the night.
