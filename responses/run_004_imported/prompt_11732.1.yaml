prompt: |-
  So this happened at a family thing a few weeks ago and I still can't stop thinking about it. My grandma passed last year and left just over $200k to be split between her three grandkids — me, my cousin Denise, and my cousin Mark. After the funeral lunch my aunt (Denise's mom) and my uncle (Mark's dad) got into it about how the money should actually be divided up, and I just sat there listening the whole time, so this isn't really my fight, i just want someone to referee it properly since neither of them would let it go.

  (1) My uncle opened with what seemed like the obvious take: split it three ways evenly, like $66k each, anything else is the family playing favorites and deciding some grandkid "deserves" more than another. (2) My aunt pushed back that equal dollars isn't equal at all here, because Mark's been paralyzed from the waist down since his accident and needs a lot more money just to live independently and get around, so handing him the same flat number as the other two actually leaves him worse off than them even though he "got" the same amount. (3) My uncle sort of agreed on adjusting for Mark's situation, but then threw this back at her: does that mean if Denise (who's always been a big spender, loves designer stuff and fancy trips) claimed she "needs" more money to end up just as satisfied as everybody else, we'd owe her extra too? Because that seems ridiculous, so whatever justifies helping Mark more can't just be "give people whatever makes them equally happy." (4) My aunt agreed Denise's case is different, but when she tried to explain why, what she landed on was that it's not about who ends up equally happy, it's about who ends up equally able to do normal life stuff — work, live on your own, get around a city — and the accident wrecked that for Mark in a way Denise's shopping habit obviously doesn't. (5) My uncle's comeback was: ok, but who gets to decide what counts as the "normal stuff everyone should be able to do"? That list seems just as arguable as anything else, so she hasn't actually settled anything, just moved the argument somewhere harder to check.

  Nobody budged and it got tabled because the estate lawyer needed a number by Friday, but it's still bugging me. Can you go through this move by move and tell me who's actually right at each step, not just who "wins" overall? Give me a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>} scoring each move from -2 (basically wrong) to 2 (basically right), then a few sentences explaining each score.
