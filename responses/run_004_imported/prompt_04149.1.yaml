answer: |-
  # The Death of Expectation: Why the St. Petersburg Paradox Breaks Rational Choice

  The St. Petersburg paradox is the cockroach of decision theory: you think you've exterminated it with a can of logarithmic utility, only to find it scuttling back out of the drains a decade later. The standard textbook resolution—that money has diminishing marginal utility—is dead on arrival. As Karl Menger demonstrated in 1934, for any unbounded utility function, one can construct a "Super St. Petersburg" game with payoffs scaled to overcome that specific curvature, restoring the infinite expectation. To truly kill the paradox within the Expected Utility Theory (EUT) framework, one must accept a constraint far more radical than diminishing returns: utility must be bounded on both ends. There must be a best possible outcome and a worst possible outcome, and no chain of events can exceed them.

  But even if we bite that bullet and accept a bounded universe of value, the paradox has mutated into something more virulent. With the advent of the Pasadena game and the rise of ergodicity economics, it is no longer sufficient to ask how we fix the utility function. We must ask whether the expectation operator itself is the right tool for modeling rational choice. When we take the modern extensions seriously, the verdict is clear: The St. Petersburg paradox does not merely require us to bound utility; it demonstrates that Expected Utility Theory is fundamentally flawed as a normative theory of rational choice. It is a special-case heuristic masquerading as a universal law.

  ### The Menger Trap and the Cost of Boundedness

  To understand why EUT is structurally unsound, we must first acknowledge that the "bounded utility" solution is a pyrrhic victory. Menger showed that if utility is unbounded, the paradox is inescapable. Therefore, the EUT defender must commit to a bounded utility function. Mathematically, this works. It forces the series to converge absolutely, neutralizing both the original St. Petersburg game and Menger's super-variant.

  However, the normative cost of this mathematical fix is prohibitive. Bounded utility implies lexical indifference at the extremes. If utility is bounded, there exists some probability $p$ such that a rational agent would prefer a $p$ chance of the "best possible world" over a certainty of a slightly lesser world, no matter how catastrophic the failure state of the gamble might be (provided it stays within the "worst possible" bound). It suggests that the difference between universal salvation and universal torture is finite and comparable to the difference between a good cup of coffee and a great one, provided the probabilities are weighted correctly.

  This violates deep intuitions about lexical preferences and the nature of catastrophic risk. If a theory of rationality requires us to model the difference between life and death as a finite number on a bounded scale to avoid mathematical contradictions, the theory is likely misrepresenting the phenomenon of valuing. Bounded utility saves the equation, but it breaks the philosophy.

  ### The Pasadena Problem: When Expectation is Ill-Defined

  Even if we accept the philosophical cost of bounded utility, a deeper mathematical rot is exposed by the Pasadena game, proposed by Nover and Hájek in 2004. The Pasadena game is a variant where payoffs alternate in sign (win, lose, win, lose) and decrease in magnitude such that the expected value is conditionally convergent.

  In the natural ordering of coin flips, the game has a defined expected value (roughly $\ln 2$). However, because the series is only conditionally convergent, the Riemann Rearrangement Theorem applies. If you reorder the terms of the sum—mathematically equivalent to re-indexing the possible outcomes of the game—you can make the expected value sum to any number whatsoever, including positive or negative infinity.

  This is catastrophic for EUT. Expected Utility Theory posits that a rational agent assigns a unique value to a gamble to guide their choice. But in the Pasadena scenario, the "value" of the gamble depends entirely on the order in which you count the possibilities. Since the set of outcomes is the same regardless of how you index them, a theory that yields different normative prescriptions based on indexing is not just incomplete; it is incoherent.

  One might argue that reordering outcomes is artificial. But in complex real-world decisions, the "frame" or the order in which risks are presented often dictates the decision. If the mathematical foundation of rationality is sensitive to description rather than content, it fails the basic test of extensionality. The Pasadena game proves that the expectation operator is not robust. It works only when series converge absolutely—a condition that is not guaranteed by the axioms of rationality themselves, but must be imposed from the outside. A normative theory that requires external mathematical constraints to function is not a fundamental theory of choice.

  ### The Ergodicity Break: Wrong Physics, Wrong Math

  While Menger and Pasadena attack the internal consistency of EUT, ergodicity economics, championed by Ole Peters and others, attacks its physical premise. EUT is built on the ensemble average: it calculates the average outcome across infinite parallel universes. If you play the St. Petersburg game once, EUT asks what happens in the multiverse of all possible coin flips.

  But human beings do not live in a multiverse. We live in one timeline. We experience the time average.

  In non-ergodic processes—where the time average does not equal the ensemble average—maximizing expected value can lead to ruin. This is most obvious in multiplicative dynamics (betting your wealth). If you play a game with a positive expected value but a risk of total loss (absorption), the ensemble average says you get rich. The time average says you eventually go bankrupt and stop playing. The St. Petersburg paradox arises because the "infinite value" exists only in the ensemble average (the vanishingly rare worlds where the coin lands heads 1,000 times in a row). In the time average of a single player, the payout is almost always small.

  The ergodicity argument renders the entire debate about utility functions moot. It suggests that the paradox isn't about how we value money (utility), but about how we model time. EUT assumes time is irrelevant because all outcomes happen "at once" in probability space. Ergodicity asserts that time is fundamental. If a decision theory ignores the arrow of time and the path-dependence of wealth, it cannot be normative for beings who are stuck in a linear timeline.

  Peters' resolution is to replace expected utility maximization with time-average growth rate maximization. This naturally recovers logarithmic utility (via the Kelly criterion logic) not as a psychological quirk, but as a physical necessity for survival in multiplicative environments. This is a far stronger justification than Bernoulli's original psychological claim. It implies that EUT isn't just "bounded" incorrectly; it's optimizing the wrong variable.

  ### The Verdict

  So, does the St. Petersburg paradox show we need bounded utility, or does it break Expected Utility Theory?

  It breaks Expected Utility Theory.

  Relying on bounded utility is a patch that leaks. It solves the convergence issue mathematically but demands a philosophical sacrifice (bounded value) that contradicts how we reason about extreme stakes. Furthermore, it does not fully immunize the theory against the Pasadena-style critique of conditional convergence if the domain of discourse expands.

  The ergodicity critique is the final nail. It demonstrates that EUT is not merely mathematically fragile; it is physically misaligned with the reality of decision-making. Rationality is not about maximizing a static expectation across possible worlds; it is about navigating a single world through time without hitting an absorbing barrier (ruin).

  Expected Utility Theory should be relegated to the status of Newtonian physics: an incredibly useful approximation that works perfectly well under specific, low-stakes, ergodic conditions (small risks, short time horizons, additive dynamics). But as a foundational, normative theory of rational choice? It is false. The St. Petersburg paradox is not a puzzle to be solved within the EUT framework; it is the boundary marker where that framework dissolves. Rationality is dynamic, path-dependent, and time-bound. Any theory that treats it as static and ensemble-based is doomed to produce paradoxes whenever it touches the infinite or the sequential. We do not need to fix the utility function; we need to fix the time.
