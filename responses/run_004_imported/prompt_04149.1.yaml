      *   **The Pasadena Game (2004):** Payoffs alternate signs and grow. $\sum \frac{(-1)^{n-1} 2^n}{n} \cdot \frac{1}{2^n} = \sum \frac{(-1)^{n-1}}{n} = \ln(2)$. But this series is conditionally convergent. Riemann Rearrangement Theorem says you can reorder terms to get any value. *Implication:* Expected value isn't even well-defined for some games. EUT fails to assign a value.
      *   **Ergodicity Economics (Peters et al.):** EUT assumes parallel universes (ensemble average). Real life is sequential (time average). For multiplicative dynamics (betting), time average $\neq$ ensemble average. The "paradox" disappears if you look at growth rates over time. *Implication:* EUT is the wrong framework; dynamic growth is the right one.

