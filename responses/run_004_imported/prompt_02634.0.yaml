answer: |-
  This is one of the deepest knots in modern cosmology and epistemology. You have put your finger on the exact pressure point: the tension between **cosmological typicality** and **epistemic reliability**.

  Here is the argument for the strongest version of the claim that Boltzmann Brain (BB) dominance renders a theory inadmissible, followed by an analysis of whether the Bayesian "likelihood" dodge actually saves us.

  ### Part 1: The Case for Cognitive Instability
  **The Claim:** *A cosmological model that predicts you are likely a Boltzmann Brain cannot be rationally rejected using standard scientific reasoning, because accepting the premise of the argument destroys the validity of the reasoning used to reach it. Therefore, BB-dominance is not evidence against a theory; it is a sign that the theory has exited the realm of empirically testable science.*

  This argument, most rigorously formulated by Sean Carroll (drawing on David Albert and Ken Olum), rests on the principle of **Cognitive Instability**. Here is the strongest formulation of why BB-dominance disqualifies a model *a priori*, not just as a matter of preference.

  **1. The Presupposition of Reliability**
  Scientific inference requires a foundational axiom: *My cognitive faculties (memory, perception, logic) are reliably correlated with external reality.* When I observe data $D$ and update my credence in Theory $T$, I am assuming that $D$ was caused by the features of the universe described by $T$. If I abandon this presupposition, I am not doing science; I is solipsistically narrating hallucinations.

  **2. The BB Implication**
  A theory $T_{BB}$ that predicts BB-dominance asserts that the vast majority of observers with your current mental state are not caused by a long, causal history of cosmic evolution. They are random thermal fluctuations in a high-entropy soup. Crucially, a random fluctuation has no truth-tracking mechanism. A BB fluctuating into existence with a memory of "reading a physics paper" has no causal link to an actual physics paper. The correlation between its mental state and reality is zero.

  **3. The Performative Contradiction**
  The standard reductio ad absurdum goes: "Theory $T_{BB}$ implies I am likely a BB. Being a BB is absurd. Therefore, $T_{BB}$ is false."
  The strong counter-argument is: **You cannot use the conclusion of an argument to undermine the premises required to run the argument.**
  If $T_{BB}$ is true, then the reasoning process you just used to reject $T_{BB}$ is itself a random fluctuation. It has no logical force. It is not "valid reasoning"; it is a chemical configuration that *looks like* reasoning.
  To say "I reject $T_{BB}$ because it makes my reasoning unreliable" is to say "I trust my reasoning enough to conclude that I cannot trust my reasoning." This is a performative contradiction. You are standing on a branch to saw it off.

  **4. The "Inadmissibility" Conclusion**
  Therefore, BB-dominance shouldn't be treated as *evidence* against a theory (like a failed prediction). It should be treated as a criterion for **epistemic admissibility**.
  A cosmological theory is a framework for interpreting data. If the framework predicts that the data interpreter is a hallucination, the framework destroys the possibility of its own verification or falsification. It is not "false"; it is **cognitively unstable**. We must reject it not because it is wrong, but because it is *unassertable*. To assert it is to claim your assertion is meaningless.

  **The Strong Verdict:** You cannot use BB-dominance as empirical evidence. If a model predicts BBs, it has ceased to be a scientific model and has become a skeptical scenario. You cannot "disprove" skepticism using evidence generated within the skeptical scenario. Therefore, ruling out models *because* they predict BBs is not a scientific move; it is a philosophical precondition for doing science at all.

  ***

  ### Part 2: The "Compare Raw Likelihoods" Dodge
  **The Move:**
  To avoid the "typicality" trap (the Self-Sampling Assumption that says "I should assume I am a random observer"), some physicists propose a strict Bayesian approach.
  *   **Don't ask:** "Am I a typical observer in this universe?"
  *   **Do ask:** "Which theory makes my *specific, actual observations* more probable?"

  **The Argument:**
  *   **Theory A (Standard Cosmology):** Predicts Ordinary Observers (OOs). OOs see an ordered universe with a low-entropy past. $P(\text{Order} | \text{OO}) \approx 1$.
  *   **Theory B (BB Dominance):** Predicts mostly BBs. Most BBs fluctuate into a void with false memories. While some BBs have ordered memories, the vast majority fluctuate into chaos. $P(\text{Order} | \text{BB}) \ll 1$.
  *   **Conclusion:** Since I observe Order, Theory A is vastly more likely than Theory B.

  **Does this escape the trap?**
  **No.** It smuggles the assumption back in, but it hides it inside the definition of the "Data." Here is why the dodge fails to resolve the self-undermining structure.

  **1. The Ambiguity of "Observations"**
  The Bayesian update relies on $P(D | H)$, where $D$ is your data.
  *   If $D$ = "I *seem* to see order," then BBs actually do very well. A BB fluctuating into existence *must* fluctuate into a state that includes the *appearance* of order (otherwise it wouldn't be a brain having this thought). So $P(\text{Seeming Order} | \text{BB})$ is actually high.
  *   If $D$ = "There *is* objective order caused by a past history," then you have already assumed you are not a BB to define the data. You are begging the question. You are defining the data as "True Memories," which a BB by definition does not have.

  **2. The Smuggled Presupposition**
  To claim that $P(\text{Order} | \text{BB})$ is low, you have to assume that your current experience of order is a reliable indicator of the universe's history.
  *   **The BB Counter:** "You think you see order because you are a BB fluctuated with false memories of order. Your 'data' is exactly what I predict."
  *   **The Dodge's Reply:** "But it's unlikely to fluctuate *this much* order."
  *   **The Rebuttal:** Why? If you are a BB, "unlikely" doesn't apply to your history, only to your fluctuation. If the fluctuation creates the *memory* of a long history, the "improbability" of that history is irrelevant. The BB doesn't need the history to exist; it only needs the *brain state corresponding to the memory* to exist.

  The "likelihood" argument only works if you treat your memories as **records** of the past. But the BB hypothesis explicitly states your memories are **fabrications**. You cannot use the content of a fabrication to calculate the likelihood of the fabrication vs. the real thing, unless you already assume you know which is which.

  **3. Indexicality vs. Propositional Knowledge**
  The dodge tries to shift from indexical knowledge ("Where am I in the reference class?") to propositional knowledge ("What is the probability of this data?").
  But the BB problem attacks the link between *propositions* and *truth*.
  If I say, "The likelihood of me seeing this text is higher in Theory A," I am assuming "me seeing this text" is a stable event anchored in reality. If Theory B is true, "me seeing this text" is a momentary spark in the void with no anchor.
  Comparing likelihoods assumes the "Data" is a shared, stable ground between the two theories. But the two theories disagree fundamentally on the **ontological status of the Data**.
  *   Theory A: Data is a causal trace.
  *   Theory B: Data is a random coincidence.
  You cannot compare the probabilities of $D$ if the theories define the nature of $D$ differently.

  ### Final Verdict

  The "compare raw likelihoods" dodge **does not genuinely get around the problem.** It functions only if you silently premise your Bayesian update on the assumption that you are an Ordinary Observer.

  It effectively says: "Given that my memories are real, the Standard Model is more likely."
  But the BB argument is: "Your model implies your memories are likely not real."

  You cannot use the first statement to refute the second without circularity. The "likelihood" of your observations is only a valid discriminator if your observations are truth-apt. If the BB hypothesis is true, your observations are not truth-apt; they are just noise that looks like signal.

  **Conclusion:**
  The strongest version of your claim holds. The BB paradox reveals that **cosmology cannot be purely physical; it must be epistemological.** We cannot rule out BB-dominant universes because they are "unlikely" given our data. We must rule them out because they are **epistemically suicidal**. We must impose a "Principle of Cognitive Stability" as a meta-law: *We will not entertain cosmological models that render our reasoning processes unreliable.*

  This isn't science proving the model wrong; it's philosophy drawing a boundary around what counts as science. The "likelihood" dodge tries to pretend this is a standard calculation, but it's not. It's a refusal to play a game where the rules dissolve the players.
