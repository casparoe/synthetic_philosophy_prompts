          2.  *Empirical Report vs. Metaphysical Inference:* "I saw X" is empirical. "X implies God" is metaphysical. Ayer can accept the first, reject the second.
          3.  *Weak Verification:* Did he think it made survival *probable*? Even so, private probability isn't public verification.
      *   **Propose Alternative Angles:**
          1.  *The Psychological Power of Religious Language:* Even if meaningless, it has force.
