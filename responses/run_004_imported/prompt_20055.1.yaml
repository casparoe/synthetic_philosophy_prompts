answer: |-
  This is a fantastic case study. It is, as you note, analytically cleaner than many textbook examples because the stakes (tax base viability vs. housing policy) and the demographics (40% of the base, distinct residency status) are quantifiable. It cuts straight to the "Boundary Problem" in democratic theory: *Who constitutes the demos?*

  Here is a move-by-move breakdown of the exchange, evaluating the theoretical strength of each position, followed by an analysis of Lisa's closing maneuver and the missing considerations that might actually settle the normative dispute.

  ### Move 1: Mark's Opening (The Principle of Membership)
  **Mark:** *Town meeting is for people who actually live there... owning property has never by itself entitled anyone to a vote.*

  *   **Theoretical Ground:** Civic Republicanism / Stakeholder Theory based on **Presence**.
  *   **Analysis:** Mark is relying on the standard modern democratic norm: the *demos* is defined by shared daily fate and residency. Residency is a bright-line rule that serves as a proxy for "having a stake in the community's future." It prevents a "propertocracy" where wealth determines political voice.
  *   **Verdict:** **Mark wins on institutional stability.** Historically and legally, municipal voting is tied to residency, not property. His argument protects the town from becoming a policy instrument for absentee landlords. However, he is treating the residency rule as morally neutral, which Lisa immediately challenges.

  ### Move 2: Lisa's Counter (The All-Affected Principle)
  **Lisa:** *...cutting exactly the regulated group out of the vote isn't neutral residency policy, it's the majority writing rules for a minority with no way to answer back.*

  *   **Theoretical Ground:** The **All-Affected Interests (AAI) Principle**.
  *   **Analysis:** Lisa argues that the legitimacy of a democratic decision depends on including everyone whose interests are significantly impacted by it. She highlights a specific conflict of interest: the voters (residents) are deciding on the economic viability of the non-voters' assets. This isn't a generic law; it is a targeted regulation of the excluded group's property.
  *   **Verdict:** **Lisa wins on moral intuition regarding this specific ordinance.** If democracy is about avoiding tyranny of the majority, this is a textbook case. The residents are effectively confiscating economic value (the ability to rent) from a group that cannot vote them out. Mark's "neutral rule" looks like a tool for expropriation in this context.

  ### Move 3: Mark's Rebuttal (The Administrative Boundary Problem)
  **Mark:** *...any out-of-town landlord anywhere would have a claim to vote wherever their property happens to sit... you'd never be able to close the rolls.*

  *   **Theoretical Ground:** **Feasibility and the Constitutive Problem.**
  *   **Analysis:** This is the classic objection to the AAI principle (famously articulated by Robert Dahl and others). "Affectedness" is a continuum, not a binary. If a zoning law affects property values, does a landlord in Boston get to vote in the lake town? If the *demos* is fluid based on the agenda, the institution cannot function. You need a fixed boundary to hold an election.
  *   **Verdict:** **Mark wins on institutional design.** He correctly identifies that making voting rights contingent on the *content* of the legislation creates an impossible administrative burden. Who decides who is affected before the vote happens? If the boundary shifts every meeting, there is no stable polity.

  ### Move 4: Lisa's Closing (The Substantiality/Domain Distinction)
  **Lisa:** *...make it laws that are substantially and specifically about your own property and its use, not generic ripple effects... the town can't claim full tax and regulatory power over these people's houses while giving them zero voice in exactly that domain.*

  *   **Theoretical Ground:** **Refined AAI / Jurisdictional Fairness.**
  *   **Analysis:** Lisa attempts to rescue the AAI principle from Mark's slippery slope by adding a threshold of *substantiality* and *specificity*. She also pivots to a "No Taxation Without Representation" argument (regulatory power as a form of taxation).
  *   **Verdict:** **This is the crux.**
      *   **Does it answer Mark's "close the rolls" worry?** *Partially, but at a cost.* It stops the "any landlord anywhere" slide by restricting the claim to laws *specifically* about that property class. It turns the voting right from a *status* (resident) into a *functional* right (subject of regulation).
      *   **Does it change the subject?** *Yes, subtly.* Mark is arguing about **Membership** (Who belongs to the town?). Lisa is arguing about **Due Process/Fairness** (What rights do subjects have?).
      *   **The Weakness:** By shifting to a substantive standard ("substantially and specifically"), she creates a "Who decides?" problem. Who determines if the STR cap is "substantial" enough to trigger voting rights? If the Select Board decides, they can just rule themselves eligible to vote on it. If a court decides, you've judicialized the voting process.

  ### The Missing Considerations

  If you want to unsettle your seminar students (or yourself) further, there are three considerations neither Mark nor Lisa raised that might actually settle the normative weight of the issue.

  **1. The "Self-Dealing" Constraint**
  The strongest argument isn't that seasonal owners *should vote*, but that residents *should not be voting on this specific measure.*
  In corporate law and ethics, stakeholders cannot vote on matters where they have a direct financial conflict of interest with another class of stakeholders. Here, residents benefit from capped rentals (more housing, less noise) while seasonal owners bear the cost (lost income).
  *   **Theoretical Fix:** Instead of expanding the *demos* (Lisa's approach), you restrict the *agenda*. A neutral body (state legislature or a regional commission) should set STR policy, or the town vote should require a supermajority that mathematically requires some proxy for the seasonal owners' interests. This avoids Mark's "boundary problem" while solving Lisa's "tyranny" problem.

  **2. Exit vs. Voice (Hirschman)**
  Mark's argument relies on the assumption that seasonal owners have "voice" only through voting. But in political economy, they have **Exit**.
  *   **Consideration:** If the town makes ownership untenable, seasonal owners sell. Residents cannot sell as easily (this is their primary home). The threat of the tax base collapsing (the 40% figure) is a market check on the residents' voting power.
  *   **Counter:** This is a weak check if the residents *prefer* lower taxes/services over the loss of the tax base, or if they believe they can replace the revenue elsewhere. But it suggests that formal voting rights might be less necessary if the economic leverage is already potent.

  **3. The Legal/Constitutional Reality (The "Hard" Boundary)**
  In almost every U.S. state, municipal voting is statutorily restricted to residents.
  *   **Consideration:** This isn't just a town policy; it's likely state law. Lisa's argument, therefore, isn't just a plea for a different town rule, but for a different *state constitutional order*.
  *   **Theoretical Implication:** This highlights the **Tiered Polity**. We accept that local democracies are not sovereign; they are creatures of the state. If the seasonal owners feel disenfranchised, the proper democratic recourse is not the town meeting (which is structurally incapable of including them), but the state legislature (where they presumably do vote). Mark is defending the *local* boundary; Lisa is appealing to a *higher-order* fairness that the local unit is not designed to process.

  ### Summary for the Seminar

  If I were teaching this, I would frame it as a clash between **Procedural Legitimacy** (Mark: clear rules, stable membership) and **Substantive Legitimacy** (Lisa: fair outcomes, protection from expropriation).

  *   **Mark** is right that you cannot run a town meeting if the electorate changes based on the agenda.
  *   **Lisa** is right that a residency rule becomes illegitimate when it functions as a mechanism for wealth transfer from a minority to a majority.
  *   **The Settlement:** Lisa's closing move is theoretically clever but administratively fragile. The better solution lies outside their binary: acknowledge that local residency-based democracies are *structurally incapable* of adjudicating conflicts between residents and non-resident capital. Therefore, such conflicts should be removed from the local ballot entirely (preemption) or subject to external review, rather than trying to stretch the local franchise to break its own design.

  It's a perfect example of why the "Boundary Problem" isn't just abstract philosophy; it's the engine of local class warfare.
