      *   *Move 2 Analysis:* Mark raises the *Administrative Feasibility* objection. Lisa refines the *All-Affected Principle* to *All-Substantially-Affected*.
      *   *Addressing the Specific Question:* Does Lisa's closing move answer Mark? Partially. It narrows the slope, but it shifts the criterion from *status* (resident) to *content* (what is the law about?). This creates a "who decides?" problem.
      *   *Missing Considerations:*
