      *   **Scenario:** A dispute at a 4th of July cookout between Mark (Select Board member, pro-residency voting) and Lisa (Lawyer, pro-seasonal owner voting rights) regarding a small New England town's voting rules.
      *   **Key Issue:** Seasonal cottage owners (40% of tax base, non-residents) are barred from voting at town meeting. An upcoming ordinance caps short-term rentals (crucial for seasonal owners to pay taxes).
      *   **Task:** Analyze the exchange move-by-move, evaluating who has the better argument at each stage. Specifically address whether Lisa's closing move answers Mark's "slippery slope/rollback" worry or shifts the subject. Identify any missing considerations that might settle the issue.
      *   **Tone:** Academic, analytical, nuanced (suitable for a grad seminar instructor), but accessible.

  2.  **Deconstruct the Arguments:**

      *   **Background:**
          *   Rule: Vote = Registered Voter + Primary Residence.
          *   Excluded: Seasonal owners (40% tax base, live elsewhere 9-10 months).
          *   Trigger Issue: Cap on short-term rentals (STRs).
          *   Impact: STR cap hurts seasonal owners' ability to pay taxes.

      *   **Move 1: Mark's Opening (The Residency Principle)**
          *   *Claim:* Town meeting is for residents. Property ownership $\neq$ voting rights.
          *   *Underlying Theory:* Civic Republicanism / Stakeholder Theory based on *presence* and *daily impact*.
          *   *Strength:* Clear boundary, prevents "propertocracy," aligns with standard democratic norms (one person, one place).

      *   **Move 2: Lisa's Counter (The Specificity/Impact Principle)**
          *   *Claim:* This isn't neutral residency; it's the majority regulating a minority without voice. The ordinance targets *their* property use specifically.
          *   *Underlying Theory:* All-Affected Interests Principle (AAI) / No Taxation Without Representation.
          *   *Strength:* Highlights the conflict of interest. The voters are deciding on the economic viability of the non-voters' assets.

      *   **Move 3: Mark's Rebuttal (The Slippery Slope/Administrative Boundary)**
          *   *Claim:* If "effect on property" grants voting, *any* landlord anywhere could vote. You can't close the rolls.
          *   *Underlying Theory:* Institutional Feasibility / Boundary Problem.
          *   *Strength:* Practicality. Democracy requires a defined *demos*. If the demos is too fluid, decision-making collapses.

      *   **Move 4: Lisa's Closing (The Substantiality/Domain Distinction)**
          *   *Claim:* Limit it to laws "substantially and specifically" about your property, not generic ripples. Also, tax/regulatory power without voice is illegitimate.
          *   *Underlying Theory:* Refined AAI / Jurisdictional Fairness.
          *   *Strength:* Tries to draw a line to avoid the slippery slope. Appeals to fairness regarding taxation/regulation.

  3.  **Evaluate Move-by-Move:**

      *   *Move 1 (Mark):* Strong on standard democratic theory. Residency is the conventional proxy for "shared fate." However, it ignores the specific economic dependency created by the tax structure.
      *   *Move 2 (Lisa):* Strong on the specific case. It exposes the *self-dealing* nature of the vote. Residents are voting to restrict the income source of non-residents who subsidize the town.
      *   *Move 3 (Mark):* Strong on institutional design. The "Boundary Problem" (Whelan, Dahl) is real. If every affected party votes, the electorate becomes global.
      *   *Move 4 (Lisa):* This is the crux. Does "substantially and specifically" solve the boundary problem?
          *   *Analysis:* It narrows the scope, but who decides what is "substantial"? It shifts from a *procedural* rule (residency) to a *substantive* rule (impact assessment). This creates administrative burden but answers the "any effect" worry. However, it might be changing the subject from "who is a member of the polity" to "what rights do subjects have."

  4.  **Identify Missing Considerations:**

      *   *The Nature of the Polity:* Is a town meeting a mini-state or a homeowners association?
      *   *Exit vs. Voice:* Seasonal owners have exit (sell the cottage). Residents have less exit.
      *   *The "Taxation Without Representation" Angle:* They pay taxes. Usually, taxpaying is linked to representation (historically), but modern democracy links residency to representation.
      *   *The "Self-Dealing" Problem:* This is the strongest ethical point. The majority is confiscating economic value from the minority.
      *   *Alternative Mechanisms:* Instead of voting, do they get a hearing? A review board?
      *   *Constitutional/Legal Constraints:* In many states, non-resident voting is legally prohibited for municipal elections. This might be a moot point legally, but normatively interesting.

