          2.  *Legal/Constitutional Reality:* State law likely forbids this.
          3.  *Alternative Representation:* Advisory boards, not ballots.
          4.  *Exit Rights:* Hirschman's framework.
      *   *Conclusion:* Summarize the theoretical tension (Membership vs. Affectedness).

  6.  **Refining the Tone:**
      *   Ensure it sounds like a colleague speaking to a professor. Use terms like "demos," "boundary problem," "all-affected principle," "civic republicanism."
      *   Avoid taking a definitive side, but weigh the theoretical strengths.
      *   Make sure to explicitly answer the prompt's question about Lisa's closing move.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "tax base" aspect? Yes, crucial for the "no taxation without representation" angle.
      *   *Check:* Did I address the "short-term rental" specific? Yes, that's the "substantial effect."
      *   *Check:* Is the distinction between "generic ripple effects" and "substantial specificity" clear? I need to emphasize that this moves the debate from *who* to *what*.
      *   *Check:* Did I offer a "settling" consideration? The "Self-Dealing" argument is the strongest normative point. The "State Law" point is the strongest practical point. I should focus on the normative one for a theory seminar.

