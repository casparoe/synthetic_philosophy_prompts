answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s sister and, as of three months ago, her reluctant student in Behavioral Ecology 101.

  When [Bride] asked me to be her Maid of Honor, I was honored. Then she asked me to give the speech, and I was terrified. Not because I don't have nice things to say about her—I have too many—but because I know who is sitting in this room.

  About a third of you are from her old lab. You know that [Bride] loves two things: her partner, [Partner's Name], and academic precision. She has already corrected my draft four times. I originally wrote that marriage is a "biological strategy." She sent that back with a red line through it and a note that said, "If you reduce my love to a fitness heuristic, I will disown you before the cake cutting."

  So, I've been careful. But I also couldn't ignore her life's work. Because honestly, looking at [Bride] and [Partner's Name], I don't see a contradiction between science and sentiment. I see the most beautiful example of what she studies.

  [Bride] spent her PhD studying costly signaling. The Handicap Principle. For my grandmother, and anyone else currently Googling this: this is the idea that in nature, the most honest signals are the ones that are expensive to produce.

  Think of a peacock's tail. It's heavy. It's bright. It attracts predators. It is, by all logic, a terrible idea. But that's exactly the point. Because it is so difficult to maintain, it proves the peacock is strong enough to survive *despite* the burden. If the signal were cheap, anyone could fake it. The cost is what makes it true.

  For a long time, I thought weddings were just parties. But watching my sister plan this, and watching her build a life with [Partner's Name], I realized a wedding is actually a Handicap Principle in action.

  It would be easy to go to city hall, sign a paper, and go to lunch. That would be the "cheap signal." But we aren't here for that. We are here because [Bride] and [Partner's Name] chose to do something difficult. They chose to invest time, energy, vulnerability, and yes, money, into declaring their commitment to this community.

  And it goes beyond today. The real signal isn't the flowers or the venue. The real signal is what happens after the honeymoon. It's showing up when you're tired. It's listening when you're angry. It's choosing to support another person even when it would be easier to walk away.

  In evolutionary terms, that is the only signal that matters. Anyone can say "I love you" when things are easy. That's an "index signal"—it's low cost. But staying? Building a home? Navigating the hard years? That is a voluntary handicap. It is a burden you take on willingly, to prove that your commitment is robust enough to carry it.

  Now, I want to make one technical clarification, mostly for the folks in the back from the lab. I know [Bride] would want me to be precise here. We aren't talking about an unfakeable index today. We are talking about a strategic cost. And for the record, I am aware that we are operating under Grafen's optimization model, not just Zahavi's original qualitative hypothesis.

  I learned that from the bride. She taught me that the details matter. Accuracy matters. Truth matters.

  But for the rest of us, here is what that science translates to in plain English: The difficulty of love isn't a bug. It's the feature.

  [Bride], you have spent your life studying why animals prove they are worthy. But today, you don't need a model to prove anything. You've already done the work. You've shown us that you are willing to bear the cost. You've shown us that your signal is honest.

  [Partner's Name], you are signaling right back. You're stepping into the lab with her. You're accepting the handicap. And looking at the way you look at her, I have no doubt you have the stamina for it.

  So, if I could ask everyone to raise a glass.

  To [Bride] and [Partner's Name]. May your signals always be honest. May your costs be worth the investment. And may you never have to explain the difference between an index and a handicap to your grandmother.

  To the happy couple!
