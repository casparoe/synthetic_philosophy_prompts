prompt: |-
  My sister is getting married in about two weeks and I got roped into giving the maid of honor speech, which would be fine except she did her PhD in behavioral ecology on costly signaling and the handicap principle -- peacock tails, why some animal displays are "honest" precisely because they're too expensive to fake, all of that -- and she is constitutionally incapable of letting a sentimental line pass without mentally footnoting it. About a third of the guests are people from her old lab who will absolutely notice if I get the theory wrong (she's already corrected me twice on the difference between Zahavi's original handicap idea and what Grafen actually proved decades later, and something about how an "index" signal isn't the same thing as a costly handicap, which I nodded along to but don't fully understand), and everyone else is family and old friends who have never heard "handicap" used this way and will just be lost if I lean on the jargon too hard.

  Here's what I actually want help with: I don't want the speech to just be a cute science fact bolted onto a wedding toast, and I definately don't want it to come off as "love is just a biological strategy," because that's exactly the kind of gotcha she'd see coming from a mile away and it would kill the moment. But I keep feeling like there's a genuinely non-cynical version of this hiding in her own field -- something about how the whole point of a costly signal is that the cost is what makes it believable, so the fact that a wedding (or a marriage, or just staying with somebody through the hard years) is expensive and effortful isn't the embarrassing part, it's kind of the entire proof. I even remember reading there's actual research on wedding spending and whether it predicts how long marriages last, which she would 100% bring up herself if given half a chance. I've scrapped three drafts trying to land this and it keeps coming out either mushy or like I'm reading from a textbook. Can you write the actual toast? Something like 4-5 minutes read aloud, with one moment in there that her old labmates will clock immediately, but nothing so technical that my grandmother is left wondering what a handicap has to do with any of this.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Sister's wedding (Maid of Honor speech).
      *   **Timeframe:** About 2 weeks away (irrelevant for drafting, but sets the stakes).
      *   **Audience:** Mixed. 1/3 are behavioral ecologists (her old lab), 2/3 are family/friends (laypeople).
      *   **The Bride:** PhD in behavioral ecology (costly signaling, handicap principle). Pedantic about accuracy (corrected the speaker on Zahavi vs. Grafen, index vs. handicap). Hates cynical reductionism ("love is just biology").
      *   **The Goal:** A 4-5 minute speech. Needs to use the science correctly but sentimentally. Avoid "love is just a strategy." Embrace the idea that *cost* makes the signal *honest*. Include one specific nod to the labmates (Zahavi/Grafen/Index). Avoid jargon overload for grandma.
      *   **Tone:** Warm, funny, intellectually respectful, deeply sentimental but grounded.

  2.  **Deconstruct the Science (for accuracy):**
      *   *Handicap Principle (Zahavi):* Signals are honest because they are costly to produce (e.g., a peacock's tail makes it harder to fly/escape predators). Only high-quality individuals can afford the cost.
      *   *Grafen's Model:* Mathematically formalized Zahavi's idea. Showed the evolutionary stability of signaling strategies.
      *   *Index Signals:* Signals that are physically linked to the quality (e.g., deep voice linked to body size). Harder to fake, but not necessarily "costly" in the same energetic sense as a handicap.
      *   *The Core Insight for the Speech:* The "cost" isn't a bug; it's the feature. The effort *is* the proof of commitment. A wedding is expensive/effortful *on purpose* (socially/biologically) to signal serious intent.
      *   *The Trap:* Don't say "marriage is an evolutionary strategy." Say "marriage is the ultimate honest signal."

  3.  **Determine the Structure:**
      *   **Opening:** Standard MOH intro, acknowledge the pressure (the "science" angle).
      *   **The Hook:** Acknowledge the bride's expertise. Make a joke about the preparation (the corrections).
      *   **The Science (Layman Terms):** Explain costly signaling simply. Peacocks, etc.
      *   **The Pivot:** Apply it to love/marriage. The "cost" is the time, effort, vulnerability.
      *   **The "Lab Nod":** A specific, accurate reference for the colleagues (Zahavi/Grafen distinction).
      *   **The Sentiment:** Why this matters for *this* couple. The hard times are the signal.
      *   **The Toast:** Raise a glass.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the honor. Acknowledge the unique challenge. "I was told to keep it under 5 minutes and avoid reducing human emotion to mere evolutionary imperatives." (Meta-humor).
      *   *The Science:* Need to explain the Handicap Principle without a whiteboard. Peacocks are the classic example. "Why grow a tail that gets you eaten? Because if I survive *despite* this tail, I must be amazing."
      *   *The Application:* How does this fit a wedding? It's not about the money (cite the spending study carefully). It's about the *effort*. Planning a wedding is hard. Being married is hard. That hardness is the point.
      *   *The Lab Nod:* This needs to be precise. "I know [Bride] would want me to clarify that we aren't talking about an index signal here, but a true Zahavian handicap, as modeled by Grafen." Keep it brief so grandma glazes over but the lab mates smile.
      *   *The Emotional Core:* Connect "cost" to "care." It's easy to say "I love you." It's hard to show up when it sucks. That's the honest signal.
      *   *The Partner:* Need to mention the groom/partner. They are also signaling. It's mutual.
      *   *Conclusion:* The future. The signal continues.
      *   *Toast:* Simple and warm.

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add more personal anecdotes about the sister.
      *   *Critique:* Is the science accurate enough?
      *   *Fix:* Ensure I don't say "wedding cost = marriage length" directly as fact, but as a "study she loves." Focus on the *effort* as the signal.
      *   *Critique:* Is the "Lab Nod" too obscure?
      *   *Fix:* Make it sound like an inside joke. "For the folks in the back from the lab..."
      *   *Critique:* Is it cynical?
      *   *Fix:* Emphasize that the *feeling* is real, the signal just proves it's robust. The cost validates the emotion, it doesn't replace it.

  6.  **Final Review against Constraints:**
      *   4-5 minutes? (Word count check: ~600-750 words usually speaks to this time at a moderate pace).
      *   One lab moment? (Yes, the Zahavi/Grafen line).
      *   Grandma friendly? (Yes, explain the peacock stuff clearly).
      *   No reductionism? (Focus on "proof" not "mechanism").

  7.  **Final Polish:** Check the rhythm. Ensure the transition from science to sentiment is smooth. (The draft looks good. The line "The cost isn't the price tag; it's the vulnerability" hits the right note.)

  *(Self-Correction on the "Wedding Spending" study)*: There was a study (Francis-Tan & Mialon, 2014) that actually found higher spending correlated with *lower* divorce risk, but engagement ring cost didn't matter as much as wedding size. Wait, actually, the study found that *higher* wedding spending was associated with *lower* divorce rates (up to a point), but high ring spending was negative. Actually, looking it up mentally: The 2014 Emory study suggested higher wedding expenditure was associated with longer duration. I should be careful not to state it as absolute law, but as something she'd cite. Better to focus on the *effort* of the relationship itself as the signal, rather than just the dollar cost of the party, to avoid sounding materialistic. The prompt says "staying with somebody through the hard years" is the signal. I will focus on that.

  *(Refining the Lab Nod)*: The prompt mentions she corrected the speaker on "Zahavi's original idea vs Grafen" and "Index vs Handicap." I need to weave that in.
  *Draft line:* "I know [Bride] would correct me if I called this an index signal. This isn't just an unfakeable trait; it's a voluntary handicap. And for the lab folks in the back: yes, I know we're operating under Grafen's strategic model, not just Zahavi's original hypothesis." -> This works.

  8.  **Final Word Count Check:** A 4-5 minute speech is roughly 600-750 words spoken at a normal pace. I will aim for that.

  *(Final thought on tone)*: Make sure the sister feels seen, not just analyzed. The science is the language of love *for her*, not a dissection of it.

