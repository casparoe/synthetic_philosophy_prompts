      *   *De Regno:* He discusses what to do about a tyrant. He explicitly argues *against* private individuals killing tyrants. He suggests public authority or God should handle it.
      *   *Summa Theologiae:* He discusses obedience and sedition. Sedition is a sin. However, a tyrant's rule might be unjust, but resisting it privately causes more disorder.
      *   *The "Tyrannicide" Misconception:* This often stems from a conflation with John of Salisbury (*Policraticus*), who *did* support tyrannicide more explicitly. Or it comes from a misreading of Aquinas's later commentary on the Sentences or specific contexts where he discusses the *removal* of a tyrant, not necessarily assassination by a private citizen.
      *   *Key Distinction:* Public authority vs. Private authority. Aquinas allows for a public mechanism to depose a tyrant, but forbids private assassination.

  3.  **Address the "Obey Authorities" Tension (Romans 13 vs. Resistance):**
      *   Catholic teaching isn't blind obedience. It's conditional obedience. If the ruler commands sin, you disobey.
      *   But *removing* the ruler is different from *disobeying* a specific command.
      *   Aquinas prioritizes order and the common good. Chaos (sedition) is often worse than a bad ruler, unless the tyranny is intolerable *and* there is a public mechanism for removal.

  4.  **Address the Historical Context (Why no widespread assassinations?):**
      *   Because Aquinas (and the Church) generally taught *against* private tyrannicide.
