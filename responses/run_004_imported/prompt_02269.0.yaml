prompt: |-
  Ok so I've been going down a total rabbit hole lately reading old philosophy stuff online (no formal background here, just a curious person with too much time on my hands), and I keep running into the claim that Thomas Aquinas straight up justified tyrannicide — like, killing a bad king or ruler is morally fine according to him. This kinda blew my mind because I always thought of the Catholic Church as being big on "obey the authorities, they're basically appointed by God" type stuff (my grandma definately raised me that way), so it's wild that their most important theologian apparently also said "yeah, go ahead and take out the tyrant if he's bad enough."

  So here's what I don't get: if Aquinas really did give ordinary people the moral green light to assassinate an unjust ruler, why didn't that ever turn into an actual widespread practice among medieval Catholics? You'd think every peasant living under some horrible lord would've felt not just permitted but almost obligated to take matters into their own hands. And why do people today who love quoting Aquinas on natural law never bring this up when they're talking about resisting modern dictators — shouldn't this be a much bigger deal in Catholic political thought than it seems to be? Am I misunderstanding something about what he actually argued, or did the idea just never catch on for some other reason?
