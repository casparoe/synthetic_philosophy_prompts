      *   Church Role: The Pope could depose kings (excommunication/release from oaths), acting as the "public authority" on a spiritual level.

  5.  **Address the Modern Context (Why isn't this cited today?):**
      *   Because he didn't actually endorse private assassination.
      *   Modern Catholic Social Teaching focuses on subsidiarity, solidarity, and non-violent resistance (John Paul II).
      *   Natural Law proponents focus on the *law* itself, not regime change mechanics.
      *   When resistance is discussed (e.g., against Nazis), it's usually framed as self-defense or legitimate authority leading resistance, not vigilante justice.

  6.  **Synthesize the Argument:**
      *   **Correction:** You are partially misunderstanding. Aquinas did *not* give a green light to private individuals to assassinate tyrants.
      *   **Nuance:** He allowed for *public* deposition under specific circumstances, but warned against the dangers of sedition.
      *   **Source of Confusion:** Likely John of Salisbury or later Scholastics (like Suárez or Mariana) who were more permissive.
      *   **Historical Reality:** The Church feared anarchy more than tyranny.
      *   **Modern Application:** Focus is on legitimate authority and non-violence.

