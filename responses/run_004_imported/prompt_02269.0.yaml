answer: |-
  You have stumbled into one of the most persistent and fascinating misconceptions in the history of political philosophy. It is a classic "telephone game" scenario where a nuanced medieval argument gets flattened into a modern soundbite.

  The short answer is: **You are misunderstanding what Aquinas actually argued, and so do many of the people making that claim.**

  Aquinas did *not* give ordinary people a moral green light to assassinate tyrants. In fact, he explicitly argued against it. If medieval peasants didn't routinely assassinate their lords, it is partly because the Church's leading theologian told them not to.

  Here is the breakdown of what Aquinas actually said, why the confusion exists, and why this doesn't show up in modern Catholic political discourse.

  ### 1. What Aquinas Actually Wrote
  The confusion usually stems from two of his works: *De Regno* (On Kingship) and his *Commentary on the Sentences*.

  In his mature political work, *De Regno*, Aquinas addresses exactly what to do about a tyrant. He acknowledges that tyranny is bad. However, he argues that **private individuals** should not take it upon themselves to kill the tyrant. Why? Because doing so creates more danger than it solves.

  He writes:
  > "To proceed against the cruelty of tyrants is an affair to be undertaken not by private initiative, but by public authority."

  Aquinas was terrified of **sedition** (discord among the people). He believed that if you allow private citizens to decide when a ruler is "bad enough" to kill, you invite chaos. Every disgruntled subject could claim the king is a tyrant, leading to endless civil war. For Aquinas, order is a prerequisite for justice; you can't have justice in a state of anarchy.

  So, who *can* remove a tyrant? Aquinas suggests it must be done by a **public mechanism**. If the king was elected by the people (or their representatives), the people (through their proper channels) can depose him. If the king is appointed by a higher authority (like an Emperor or the Pope), that higher authority must handle it.

  ### 2. The Source of the Confusion (John of Salisbury)
  If Aquinas didn't support tyrannicide, where did you read that he did?

  You are likely conflating Aquinas with an earlier philosopher named **John of Salisbury**. In 1159 (about 50 years before Aquinas was writing), Salisbury wrote a book called *Policraticus*. Salisbury *did* famously argue that killing a tyrant was not just permissible but sometimes a duty. He used the analogy that a tyrant is like a diseased limb; you cut it off to save the body.

  Later writers sometimes lumped the "Scholastics" together. When people want to claim the Catholic tradition supports revolution, they often attribute Salisbury's more radical view to Aquinas because Aquinas is the bigger name.

  There is also a tricky passage in Aquinas's earlier *Commentary on the Sentences* where he says a tyrant *may* be killed, but scholars generally view *De Regno* as his more mature, considered political thought. Even in the earlier text, he frames it carefully within the context of public justice, not vigilante assassination.

  ### 3. Why Didn't Peasants Do It?
  You asked: *"You'd think every peasant living under some horrible lord would've felt not just permitted but almost obligated to take matters into their own hands."*

  They didn't do this for three reasons:

  1.  **The Teaching:** As noted above, the Church taught that rebellion without legitimate authority was a sin (sedition). Your grandma's teaching ("obey the authorities") was the standard pastoral advice because it maintained social order.
  2.  **The Theology of Power:** Medieval Catholics believed power ultimately came from God (Romans 13). Even a bad king was seen as potentially allowing by God to punish the people for their sins. Suffering under a tyrant was often framed as a spiritual trial to be endured, not a military problem to be solved.
  3.  **The "Escape Clause":** The Church *did* offer a way out, but it wasn't violence. It was **excommunication**. If a ruler was truly tyrannical and heretical, the Pope could excommunicate him and "release" his subjects from their oaths of allegiance. This turned resistance into a lawful act under a higher authority (the Church) rather than a sinful act of rebellion. This happened occasionally (e.g., Pope Gregory VII vs. Emperor Henry IV), but it was a top-down process, not a bottom-up assassination.

  ### 4. Why Isn't This Cited Today?
  You also asked why modern Catholic natural law proponents don't use this to argue against modern dictators.

  **Because they can't.** Since Aquinas didn't actually endorse private assassination, quoting him to justify killing a modern dictator would be dishonest.

  However, Catholic Social Teaching *does* have a doctrine of resistance, but it looks different than tyrannicide:
  *   **Conditional Obedience:** The Catechism teaches that citizens are not obliged to obey laws that contradict the moral order (e.g., laws mandating abortion or genocide). "We must obey God rather than men" (Acts 5:29).
  *   **Legitimate Defense:** Later thinkers (like the Jesuit Francisco Suárez, writing after Aquinas) developed the idea that if a ruler becomes a public enemy who attacks the common good, he effectively declares war on his own people. In that case, the people can defend themselves. But this is framed as **collective self-defense**, not individual assassination.
  *   **Non-Violent Resistance:** Modern Catholic thought (especially post-John Paul II) emphasizes non-violent resistance, solidarity, and civil disobedience rather than violence. The focus is on transforming society through moral witness, not removing heads of state.

  ### 5. Summary: The Nuance You Missed
  Your grandma wasn't wrong, but she was giving you the "95% rule." The Catholic position is:
  1.  **Obey authority** because order is good and comes from God.
  2.  **Disobey specific commands** that force you to sin.
  3.  **Do not assassinate the ruler** privately, because anarchy is worse than tyranny.
  4.  **Work through public/legal channels** (or higher authorities like the Church) to depose a ruler if the tyranny becomes intolerable.

  The "rabbit hole" you went down is a very common one. It appeals to our modern desire for individual agency and justice. But for Aquinas, justice wasn't about the individual righting every wrong; it was about the community living in an ordered harmony directed toward God. Allowing individuals to kill rulers threatened that order more than the ruler's tyranny did.

  So, you haven't found a secret Catholic manual for revolution; you've found a misinterpretation of a medieval warning against chaos.
