answer: |-
  You have identified a very sharp and technically significant objection to Causal Decision Theory (CDT). You are correct that among decision theorists and the "rationalist" community (e.g., LessWrong, MIRI), **Death in Damascus** is often viewed as a more debilitating *internal* critique of CDT than Newcomb's Problem.

  However, your conclusion that this amounts to a "plain vindication of Evidential Decision Theory (EDT)" is where the consensus diverges. While Death in Damascus exposes a fatal instability in naive CDT, it does not automatically crown EDT the winner, because EDT faces its own catastrophic failures in structurally similar cases.

  Here is a breakdown of why Death in Damascus is indeed a severe blow to CDT, why it doesn't vindicate EDT, and what the modern "rationalist" alternative actually is.

  ### 1. The Instability Objection: Why Death in Damascus hurts CDT more than Newcomb
  You are right to distinguish the *nature* of the failure in these two cases.

  *   **In Newcomb's Problem:** CDT gives a clear, stable recommendation (two-box). The argument is that you should take the extra \$1,000 because your choice cannot causally affect the money already in the boxes. The criticism here is largely *external*: CDT leaves money on the table compared to EDT. But CDT is internally consistent; once you decide to two-box, you have no reason to switch.
  *   **In Death in Damascus:** CDT fails *internally*. The theory cannot settle on a recommendation.
      *   If you deliberate and lean toward **Aleppo**, CDT tells you that Death (a perfect predictor) has likely already gone to Aleppo, so you should **Stay in Damascus**.
      *   If you deliberate and lean toward **Damascus**, CDT tells you Death is likely in Damascus, so you should **Flee to Aleppo**.
      *   This violates the **Principle of Ratifiability**: a rational decision should remain optimal even after you know you have made it. CDT recommends an action that, once chosen, provides evidence that makes the action look suboptimal.

  This oscillation suggests that CDT is not just "counter-intuitive" (as in Newcomb) but **deliberatively incoherent**. For many philosophers (like Allan Gibbard and William Harper, who introduced the case), this is a deeper theoretical failure than simply losing money in Newcomb's Problem.

  ### 2. Why this does not vindicate EDT
  Your claim that "EDT faces no such instability" is the most contentious part of your assessment. While EDT handles Death in Damascus better than CDT in some formulations, it is not universally stable there, and more importantly, EDT fails catastrophically in other cases that are structurally isomorphic to Death in Damascus.

  #### A. EDT can also oscillate
  In the standard Death in Damascus setup, your action is strong evidence of Death's location.
  *   If you are an evidential reasoner, considering "I will go to Aleppo" updates your probability that "Death is in Aleppo" to near 1.
  *   This lowers the expected utility of going to Aleppo.
  *   Consequently, Damascus looks better.
  *   But considering "I will stay in Damascus" updates your probability that "Death is in Damascus" to near 1.
  *   This lowers the expected utility of staying.

  Unless the EDT agent employs a specific "tickle defense" (arguing that they already know their own mental state, so the decision adds no new evidence), standard EDT can also suffer from deliberative instability in this scenario.

  #### B. The Smoking Lesion Problem
  The primary reason EDT is not considered "vindicated" is the **Smoking Lesion** problem.
  *   **Scenario:** A genetic lesion causes both a desire to smoke and lung cancer. Smoking itself does *not* cause cancer.
  *   **EDT Recommendation:** Don't smoke. (Because smoking is strong evidence you have the lesion and will get cancer).
  *   **CDT Recommendation:** Smoke. (Because smoking doesn't cause cancer, and you enjoy it).
  *   **Intuition:** Most people agree with CDT here. You should smoke, because your action doesn't change your health status; it's just a symptom.

  If Death in Damascus refutes CDT, the Smoking Lesion refutes EDT. We are left with two theories that each fail in one of the two "twin" cases. Death in Damascus shows CDT is too blind to correlations; Smoking Lesion shows EDT is too blind to causation.

  ### 3. The "Rationalist" Consensus: Functional Decision Theory (FDT)
  Since you mentioned "rationalist blogs," it is worth noting that the contemporary consensus in that specific community (associated with Eliezer Yudkowsky, MIRI, and LessWrong) is **not** that EDT is the winner. Instead, they argue that **both CDT and EDT are flawed** because they rely on an outdated model of agency.

  The proposed solution is **Functional Decision Theory (FDT)** (or its predecessor, Timeless Decision Theory).
  *   **The Core Idea:** You should not view your decision as a physical event that is either causally disconnected from the past (CDT) or merely evidentially correlated (EDT). You should view your decision as the **output of a decision algorithm**.
  *   **In Newcomb/Death in Damascus:** The Predictor is simulating your algorithm. Therefore, your algorithm's output *logically determines* the Predictor's output. FDT one-boxes in Newcomb and (crucially) finds a stable equilibrium in Death in Damascus (usually by randomizing or accepting the inevitability without oscillation).
  *   **In Smoking Lesion:** FDT recognizes that the lesion affects your *preferences*, not your *decision algorithm's logic* regarding causality. It smokes, agreeing with CDT.

  FDT proponents argue that Death in Damascus isn't a victory for EDT, but rather proof that we need a decision theory that accounts for **subjunctive dependence** (logical correlation) rather than just causal or evidential correlation.

  ### 4. CDT Defenses: Ratificationism
  It is also worth noting that CDT has not simply surrendered. Proponents like David Lewis and James Joyce have developed **Ratificationism**.
  *   This modifies CDT to say: "Choose the action that maximizes utility *conditional on the fact that you have chosen it*."
  *   In Death in Damascus, a ratificationist CDT agent realizes that neither pure strategy (Stay or Flee) is ratifiable. The theory then recommends a **mixed strategy** (e.g., flip a coin).
  *   If you flip a coin, Death cannot predict where you will be (assuming Death predicts based on your deterministic deliberation). This restores stability, though it admits that pure CDT was incomplete.

  ### Conclusion
  You are correct that **Death in Damascus is a more technically damaging critique of CDT than Newcomb's Problem.** Newcomb's Problem shows CDT yields suboptimal outcomes; Death in Damascus shows CDT yields *incoherent deliberation*.

  However, this does not vindicate EDT.
  1.  EDT faces the **Smoking Lesion** problem, which is arguably just as damaging.
  2.  EDT can face similar instability in Death in Damascus depending on the formulation.
  3.  The modern "rationalist" view is that **both theories are wrong**, and the solution lies in **Functional Decision Theory**, which treats decisions as logical outputs rather than causal or evidential events.

  So, while Death in Damascus is a decisive refutation of *naive* CDT, it is best understood as a motivation for a third kind of decision theory, rather than a crown for EDT.
