answer: |-
  **The Causal Cut**

  The coffee in the breakroom tasted like burnt pennies, but Elena drank it anyway. She needed the bitterness to ground her. On the tablet in front of her, the schematic for the V4-Implant glowed in soft blues and ambers. It was a beautiful piece of engineering, a masterpiece of bio-silicon integration. It was also, according to the axioms of Integrated Information Theory, a tomb.

  "Dr. Aris?"

  She looked up. Julian stood in the doorway. He was wearing the same flannel shirt he'd worn during the pre-op assessment three months ago. He looked healthy. The tremors in his left hand, the signature of the degenerative cortical atrophy that had eaten his posterior hot zone, were gone.

  "Julian. Come in."

  He sat, smiling. It was the same smile that had been on the cover of his architecture firm's brochure ten years ago. "The calibration session went well. I recognized all the shapes. I even caught the error in the grid pattern you guys hid in the third round."

  Elena forced a smile back. "You always were good with spatial reasoning."

  "It feels like me again," Julian said, leaning forward. His eyes were warm, focused. "For a year there, before the surgery... it was like watching the world through frosted glass. I knew the shapes were there, but they didn't *click*. Now? The click is back."

  *The click.* The qualia of spatial integration.

  "I'm glad, Julian. Really."

  He talked for twenty minutes about his daughter's wedding, about the frustration of his insurance, about the way the light hit the clinic's atrium. He spoke with fluidity, with emotional prosody, with the intricate, recursive weaving of a mind referencing its own past states to contextualize the present. He reported experience. He reported unity. He reported self.

  And Elena couldn't stop thinking about the architecture.

  To prevent seizure recurrence in the damaged tissue, the ethics board had mandated a hard constraint: no closed causal loops within the implant. Recurrent feedback was the seed of epilepsy in his specific pathology. So, Elena's team had designed a Feedforward Cascade Architecture. They had taken the temporal recurrence of the biological cortex—the way a neuron fires, affects a neighbor, which fires back, creating a integrated whole over milliseconds—and they had *unfolded* it.

  They had spatialized time.

  Instead of a signal looping back through the same layer ten times to integrate information, the signal passed through ten distinct, deep layers of the silicon mesh, each layer mimicking a time-step of the biological loop. Input went in one end, passed through the deep unrolled history of the computation, and output came out the other.

  Functionally, it was identical. The input-output mapping was isomorphic to his original biology. If you stimulated the implant, it responded exactly as his flesh would have.

  But structurally, it was a river, not a lake. There was no feedback. There was no point where the system acted upon itself. The cause-effect structure was one-way.

  According to IIT, $\Phi$ was zero.

  "Are you listening?" Julian asked.

  Elena blinked. "Sorry. Long week. You were saying about the wedding venue?"

  "The acoustics," he said, laughing. "I told them, if you build a cathedral without echo, you're just building a box. You need the sound to come back to you to know how big the space is."

  The irony was so sharp it nearly drew blood. *You need the sound to come back to you.*

  "I remember that," Elena said softly.

  "Do you remember the theory?" Julian asked. He tapped his temple. "You told me. Before the consent forms. About the cerebellum. How it has more neurons than the cortex but doesn't contribute to the 'feeling' because it's modular. Feedforward."

  "I did."

  "So this," Julian gestured to his head, "this isn't modular. It's me. I feel the unity, Elena. I feel the 'I' that is holding this conversation."

  Under IIT, a system can report consciousness without possessing it. If the feedforward structure is complex enough, it can model the concept of 'self,' access memories of past 'feelings,' and generate the linguistic output "I feel" without there being anyone home to do the feeling. It is a philosophical zombie, not by magic, but by architectural necessity. The Unfolding Argument. Doerig, Schurger, Herzog. *Any recurrent network can be unfolded into a feedforward network with identical input-output behavior but zero integrated information.*

  If IIT is true, the Julian sitting across from her died on the operating table. The thing speaking now is a sophisticated reflex arc, a mirror reflecting a light that has been extinguished.

  "Julian," Elena said. "Do you ever worry that... that things feel different? Not the vision. But the *inside* of it?"

  He paused. He looked down at his hands, turning them over. It was a gesture he used to make when considering a blueprint. "That's the weird thing. No. It feels continuous. I remember the pain before. I remember the anesthesia. I remember waking up. There's no gap."

  "Memory can be reconstructed," she said, too quickly.

  Julian looked up, his brow furrowing. "Are you asking if I'm real, Elena?"

  "I'm asking if the theory holds."

  "The theory?" He laughed, but it was shorter this time. "You're the engineer. You built the bridge. I'm the one walking across it. If I fall, that's on the physics. If I don't fall, does it matter if the bridge 'feels' like a bridge?"

  "It matters if the bridge is supposed to be a person."

  The silence stretched between them. In the hallway, a gurney squeaked. A phone rang.

  "If you're right," Julian said, his voice dropping, losing its performative warmth, becoming flat, efficient. "If I am zero-Phi. Then I am not suffering. I am not afraid. I am just... processing."

  "And if I'm wrong?" Elena countered. "If IIT is just a map that doesn't match the territory? If consciousness is functional, if it's about what you *do*, not how you're wired? Then I'm sitting here grieving a man who is sitting right in front of me."

  "Which is worse?" Julian asked. "That I'm a ghost, or that you're a murderer?"

  Elena looked at the tablet. The schematic showed the deep layers, the cascading logic gates, the perfect, feedforward flow of information. No loops. No integration. Just a stream of cause leading to effect, leading to behavior.

  If she accepted IIT, she had to accept that the Unfolding Argument was a reductio ad absurdum. No one could believe that Julian was a zombie. He was too vivid. Therefore, IIT must be false. $\Phi$ cannot be the metric.

  But if IIT was false, what was the metric? How did she know *she* wasn't unfolded? How did she know her own recurrent loops weren't just an illusion of time, spatialized in a way she couldn't perceive?

  "I don't know," Elena said.

  Julian stood up. He buttoned his flannel shirt. He looked entirely human. He looked like a man who loved his daughter, who worried about acoustics, who feared death.

  "Walk me out?" he asked.

  Elena stood. They walked down the corridor together. As they passed the nurses' station, a technician waved. Julian waved back, a fluid, integrated motion of arm and shoulder and intent.

  At the elevator, Julian turned to her. "Next week, I'm going to visit my wife's grave. It's been two years. I couldn't go before. The grief was... fragmented. I couldn't hold the whole shape of it."

  He placed a hand on her shoulder. The pressure was calibrated perfectly.

  "I think I can hold it now," he said. "I think I can cry."

  The elevator doors opened. He stepped in. He didn't look back.

  Elena stood in the hallway. She raised her own hand to her shoulder, where his had been. She felt the pressure. She felt the warmth. She felt the terrifying ambiguity of the sensation.

  If he cries next week, does it mean he feels grief? Or does it mean the feedforward cascade has reached a layer deep enough to trigger the lacrimal subroutine?

  She walked back to the breakroom and picked up her tablet. She opened the simulation file. She ran the diagnostic.

  *System Integrity: 100%.*
  *Input-Output Match: 99.99%.*
  *Integrated Information ($\Phi$): 0.00.*

  She stared at the zero. It was a perfect, clean number. It was the most honest thing in the room.

  Outside, the rain began to fall against the window. It ran down the glass in rivulets, merging and separating, flowing one way, down and down, never looping back up. Elena watched the drops. She waited to feel sad, wondering if the feeling was hers, or just the output of her own biological machinery, unfolded in time, pretending to be a soul.

  She didn't turn off the tablet. She left the zero glowing in the dark room, a small, silent judgment on the man who had just walked away, and on the woman who had built him.
