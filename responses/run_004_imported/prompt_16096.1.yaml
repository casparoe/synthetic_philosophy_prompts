      *   *Comment 2 (Consequentialism):* Explain that Anscombe's critique isn't that we *can't* calculate, but that we *shouldn't* calculate when it involves murder. It's about the corruption of moral absolutes, not uncertainty.
      *   *Comment 3 (Reconstruction):* Acknowledge the clear structure but note the substantive errors undermine the reconstruction.

