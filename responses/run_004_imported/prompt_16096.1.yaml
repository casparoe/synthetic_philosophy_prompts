    "reconstruction_of_argument": 1,
    "role_of_double_effect": 0.5,
    "link_to_consequentialism": 1,
    "clarity": 1,
    "total": 3.5,
    "letter_grade": "F"
  }
  ```

  *(Note: I adjusted the total to 3.5 in the JSON to reflect the strictness of the 0.5 on the DDE section, though you may round to 4/10 for the final transcript. A 3.5/10 is a failing grade.)*
