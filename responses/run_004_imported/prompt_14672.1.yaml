      *   **Defense:** A Reflection defender says if you are *certain* of the future credence, you *do* have the evidence. Refusing to update is irrational conservatism. The "lack of understanding" is irrelevant to truth-tracking.

  9.  **Checking Constraints:**
      *   (i) Rationality: Yes, future self computes correctly.
      *   (ii) No loss: Yes, $D_{old}$ is kept.
      *   (iii) No manipulation: Yes.
      *   (iv) Bayesian: Yes, conditionalization on $E$.
