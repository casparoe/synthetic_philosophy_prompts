      *   Why? Maybe $D$ combined with a simplicity constraint makes $T_1$ the unique rational choice, though I can't see that connection yet.
      *   So, $C_1(H) = C_0(H | D \land T_1)$.
      *   But now, at $t_0$, I consider the proposition $C_1(H) = x$.
      *   This proposition is true if ($D$ occurs and I adopt $T_1$) OR ($D'$ occurs and I adopt $T_2$...).
      *   If $C_1(H)=x$ can be realized by multiple paths ($D, T_1$) and ($D', T_2$) which yield different likelihoods for $H$, then $C_0(H | C_1(H)=x)$ is a weighted average, not necessarily $x$.
      *   *Wait:* If I know I will adopt $T_1$ upon seeing $D$, don't I effectively know $T_1$ is true now?
      *   If I'm certain I will rationally adopt $T_1$, then $T_1$ is the rational choice now. If I don't adopt it now, am I irrational now?
      *   This touches on **Rational Permissivism**. If it's permissible to hold $T_1$ or $T_2$ now, but mandatory later, Reflection is strained.

  6.  **Developing the "Rational Permissivism / Theory Change" Case.**
      *   *Name:* **The "Underdetermined Theory Shift."**
      *   *Setup:* Agent is a scientist. Hypothesis $A$ (e.g., "Particle exists").
      *   *Current State ($t_0$):* Agent is undecided between two methodological frameworks, $M_1$ and $M_2$. Both are rationally permissible. $M_1$ assigns $P(A) = 0.8$. $M_2$ assigns $P(A) = 0.2$. Agent's current credence is a weighted average, say 0.5.
      *   *Future State ($t_1$):* Agent receives specific evidence $E$ (e.g., a specific reading on a dial).
      *   *Update:* Under $M_1$, $E$ is decisive for $A$ ($P(A|E) = 0.9$). Under $M_2$, $E$ is decisive against $A$ ($P(A|E) = 0.1$).
      *   *Crucial Twist:* The agent knows that upon seeing $E$, the evidence will *also* decisively confirm $M_1$ over $M_2$. So at $t_1$, she will be certain of $M_1$.
      *   *Therefore:* At $t_1$, her credence in $A$ will be 0.9 (based on $M_1$ and $E$).
      *   *Reflection Check:*
          *   $C_1(A) = 0.9$.
          *   Reflection requires $C_0(A | C_1(A) = 0.9) = 0.9$.
          *   But at $t_0$, the proposition "$C_1(A) = 0.9$" is equivalent to "($E$ occurs and $M_1$ is adopted)".
          *   Since she knows $E$ confirms $M_1$, "$E$ occurs" implies "$M_1$ is adopted".
          *   So "$C_1(A) = 0.9$" is equivalent to "$E$ occurs".
          *   So $C_0(A | C_1(A) = 0.9) = C_0(A | E)$.
          *   Does $C_0(A | E) = 0.9$?
          *   $C_0(A | E) = C_0(A | E, M_1)P(M_1|E) + C_0(A | E, M_2)P(M_2|E)$.
          *   We said $E$ confirms $M_1$. Let's say $P(M_1|E) = 1$.
          *   Then $C_0(A | E) = 0.9$.
          *   So Reflection *holds*.
      *   *Failure Condition:* I need $P(M_1|E)$ to *not* be 1 at $t_0$, even though it will be 1 at $t_1$.
      *   But if it will be 1 at $t_1$ via rational conditionalization, and I know that now, then $P(M_1|E)$ *must* be 1 now (by Reflection applied to $M_1$!).
      *   *Circularity:* To break Reflection for $A$, I need to break Reflection for $M$.
      *   *Solution:* **Bounded Rationality / Computational Complexity.**
      *   I know I *will* compute the posterior correctly later. I *cannot* compute it now.
      *   This is the "Logical Omniscience" loophole again. I need to dress it up so it's not just "logic."
      *   *Dress up:* **The "Complex Model Selection" Case.**
      *   $M_1$ and $M_2$ are complex statistical models. Calculating the Bayes Factor requires integration I cannot perform now.
      *   I know that at $t_1$, I will have access to a supercomputer (or just time) that will calculate the Bayes Factor, showing $M_1$ is overwhelmingly superior.
      *   So I know $C_1(M_1) = 1$.
      *   But I cannot conditionalize on $M_1$ now because I don't know the likelihoods $P(E|M_1)$ yet (computationally inaccessible).
      *   So $C_0(A)$ is based on my current best guess (0.5).
      *   $C_1(A)$ will be based on the computed result (0.9).
      *   I know $C_1(A)$ will be 0.9.
      *   Reflection says $C_0(A | C_1(A)=0.9)$ should be 0.9.
      *   Since I am certain $C_1(A)=0.9$, this implies $C_0(A)$ should be 0.9.
      *   But I *can't* make it 0.9 because I lack the computational access to the reasons *why*.
      *   *Normative Tension:* **The Norm of Proportionality** (beliefs should match current evidence/reasons) vs. **Reflection** (defer to future self).
      *   If I bump my credence to 0.9 now, I am believing something for which I currently have no justification (I haven't done the math). I am essentially "believing on faith" in my future calculation.
      *   This strains the premise that **Rationality is transparent to the agent.**
      *   This is a strong candidate. It respects (i) (I am rational later), (ii) (no forgetting), (iii) (no manipulation), (iv) (Bayesian update).
      *   It challenges the idea that I can treat my future credence as *evidence* now if I don't understand the link.

  7.  **Refining the Case: "The Black Box Update"**
      *   *Scenario:* I am a statistician. I have data $D_{old}$. I will receive data $D_{new}$ at $t_1$.
      *   I have a model $M$. The likelihood function $P(D_{new}|H, M)$ is computationally intractable for me at $t_0$ (requires Monte Carlo simulations I haven't run).
      *   I know that at $t_1$, I will run the simulation and conditionalize.
      *   I have a "pre-computation" estimate of what the simulation will show. Let's say I am *certain* the simulation will yield a likelihood ratio of 10:1 in favor of $H$. (Perhaps a colleague ran it and told me the *output* but not the *details*, or I trust my algorithm's deterministic nature).
      *   Actually, if a colleague told me the output, that's *testimony*, which is evidence I have *now*. That fixes the problem.
      *   I need to know *that I will believe x* without knowing *why* in a way that allows me to conditionalize now.
      *   *Better:* I know my future self will have processed the data. I am certain of the *outcome* of my processing (perhaps I've seen a preview), but I haven't integrated it into my web of belief because I haven't verified the chain of reasoning.
      *   *Wait:* If I've seen a preview, I have the evidence.
      *   *The "Cognitive Limit" Argument:*
      *   I know I will be rational. I know I will conditionalize on $E$.
      *   But $E$ is a complex proposition. I cannot grasp $E$ fully now.
      *   Therefore, I cannot conditionalize on $E$ now.
      *   But I can grasp the proposition "My credence in $A$ will be $x$."
      *   Reflection says I should set my credence to $x$.
      *   But doing so violates the norm that **Credence should be based on understood reasons.**
      *   This is the **"Epistemic Akrasia"** tension. I would be believing $A$ to degree $x$ while acknowledging "I have no current reason for $A$ other than that I will have one."
      *   Is that akrasia? Some say no (Christensen). Some say yes (Horowitz).
      *   This fits the "less well-worn" criteria if framed as **Computational Inaccessibility** rather than simple logical omniscience.

  8.  **Finalizing the Case Structure:**
      *   **Title:** The "Intractable Likelihood" Case.
      *   **Setup:** Agent $S$, Proposition $H$. Time $t_0$ and $t_1$.
      *   **Evidence:** At $t_1$, $S$ obtains evidence $E$. $E$ is a specific measurement outcome.
