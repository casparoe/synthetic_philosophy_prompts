  11. **Final Polish:** Ensure the tone is appropriate for a dissertation chapter (precise, acknowledging literature, philosophically rigorous). Cite relevant names (van Fraassen, Christensen, Schoenfield, Greco) where appropriate to show grounding.

      *(One last check on the "Specific Evidence" constraint)*: "fully expects her later credence to result from ordinary Bayesian conditionalization on some specific new item of evidence."
