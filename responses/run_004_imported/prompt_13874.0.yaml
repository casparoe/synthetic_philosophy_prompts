prompt: |-
  After thirty years as a health physicist studying radiation exposure, I retired three years ago and have since taken up moral philosophy, currently working through Elizabeth Anscombe. I sit on my university's Honorary Degrees Committee, and a nomination before us uncomfortably echoes the case behind her 1956 pamphlet opposing Oxford's honorary degree for Truman. Our nominee, a retired general, is credited with ending the Torvalen civil war by destroying the capital's only water-treatment plant; a leaked planning memo shows his staff had projected that the resulting cholera outbreak would break the government's will within weeks -- which it did, killing some thirty thousand civilians. He maintains the plant was a legitimate military target and the epidemic a foreseen, unintended side effect. Half the committee calls this textbook double effect; the other half thinks the memo settles what he actually intended, and invokes Anscombe against him. Please draft the short memo I will circulate before the vote: recommend whether to proceed with, suspend, or withdraw the nomination, give the "legitimate target" defense its strongest form, and engage Anscombe's own criteria for distinguishing intention from foresight rather than resting on the label "double effect" itself.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired health physicist (30 years), now studying moral philosophy (specifically Elizabeth Anscombe), member of a university's Honorary Degrees Committee.
      *   **Task:** Draft a short memo to circulate before a vote on an honorary degree nomination.
      *   **Subject:** A retired general who ended the Torvalen civil war by destroying a water-treatment plant.
      *   **Key Facts:** Leaked memo shows staff projected cholera outbreak to break government will (worked, 30k civilians died). General claims legitimate target + foreseen/unintended side effect. Committee is split (Double Effect vs. Anscombe/Intention).
      *   **Requirements:**
          1.  Recommend action (proceed, suspend, or withdraw).
          2.  Give the "legitimate target" defense its strongest form.
          3.  Engage Anscombe's criteria for intention vs. foresight (not just labeling it "double effect").
          4.  Tone: Appropriate for a committee memo (professional, reasoned, philosophical but accessible).
          5.  Context: Echoes Anscombe's 1956 protest against Truman.

  2.  **Deconstruct the Ethical Problem (Anscombe's Framework):**
      *   *Modern Moral Philosophy (1958) & War Pamphlet (1956):* Anscombe argues against consequentialism. She emphasizes *intention*.
      *   *Double Effect (PDE):* An action with good and bad effects is permissible if:
          1.  The act itself is good or neutral.
          2.  The bad effect is not the means to the good effect.
          3.  The intention is only the good effect (bad effect is merely foreseen).
          4.  Proportionality (good outweighs bad).
      *   *Anscombe's Critique:* She famously argued that you cannot separate the *means* from the *end* if the bad effect is causally necessary for the success. If you *need* the civilians to suffer/die to achieve the military objective (breaking the will), then you intend their suffering/death.
      *   *The Torvalen Case:* The memo says the outbreak was projected to *break the government's will*. This suggests the civilian suffering/death was the *mechanism* of victory, not just a side effect.
      *   *The "Legitimate Target" Defense:* Water plants can be dual-use. If used for military logistics, maybe it's a target. But the *method* of victory relied on the civilian impact.

  3.  **Determine the Recommendation:**
      *   Given the user is studying Anscombe and the prompt highlights the echo of the Truman case (which Anscombe opposed), the recommendation should likely align with Anscombe's rigorous standard.
      *   However, the prompt asks to give the defense its "strongest form."
      *   *Decision:* Recommend **withdrawing** the nomination. Why? Because under Anscombe's specific criteria regarding *intention*, the leaked memo is damning. It shows the civilian suffering was the *means*, not just a side effect. Honoring him would contradict the university's moral standing (similar to Oxford in 1956).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the decision and the split in the committee. State the purpose of the memo.
      *   **The Defense (Steel-manning):** Address the "legitimate target" argument first.
          *   Water infrastructure is dual-use.
          *   Ending a civil war quickly can save lives in the long run (consequentialist argument, though Anscombe dislikes it, it's part of the defense).
          *   The General claims the *destruction* was the target, not the *cholera*.
      *   **Anscombe's Criteria (The Core):**
          *   Move beyond the label "Double Effect."
          *   Focus on *Intention vs. Foresight*.
          *   Anscombe's test: Is the bad effect part of the *plan* to achieve the end?
          *   Apply to the memo: The memo says the cholera would "break the government's will." Therefore, the civilian suffering was the *instrument* of victory.
          *   Quote/Reference: *Mr. Truman's Degree* (1956). The mass killing of innocents as a means to an end is murder, regardless of uniform.
      *   **Recommendation:** Withdraw the nomination.
      *   **Closing:** Emphasize the university's integrity.

  5.  **Refining the Tone:**
      *   Needs to sound like a physicist-turned-philosopher: precise, analytical, evidence-based.
      *   Respectful of colleagues but firm on the philosophical point.
      *   Avoid preaching; focus on logical consistency with the principles Anscombe outlined.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I just say "Double Effect is wrong"? *Correction:* No, I need to explain *why* it doesn't apply here based on intention, not just reject the label.
      *   *Check:* Did I give the General a fair hearing? *Correction:* Ensure the "legitimate target" section is robust before dismantling it with the intention argument.
      *   *Check:* Is the Anscombe reference accurate? *Correction:* Yes, her 1956 pamphlet specifically addressed the Truman degree and the nature of intending the death of innocents.
      *   *Check:* Is the recommendation clear? *Correction:* Yes, "Withdraw."

  7.  **Final Polish:** Check word count (keep it "short memo" as requested) and ensure the voice matches a senior academic. (The prompt mentions "Torvalen," which is fictional, so treat it as a realistic hypothetical case study).

      *(Self-Correction on "Torvalen"):* Wait, Torvalen sounds fictional. The prompt treats it as fact within the scenario. I must treat it as fact in the memo, not as a hypothetical. The user is *in* the scenario.

      *(Refining the Anscombe argument):* Anscombe's point in *Mr. Truman's Degree* was that if you kill innocents to achieve a political end, you intend their death. The "side effect" defense fails if the terror/suffering is the *method* of coercion. The leaked memo proves the coercion relied on the epidemic.

  8.  **Final Output Generation** (Proceeding to draft based on these thoughts).

      *   *Structure:*
          1.  Header.
          2.  Introduction (Context).
          3.  The Case for the General (Steel-man).
          4.  The Anscombe Analysis (Intention).
