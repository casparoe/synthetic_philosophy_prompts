answer: |-
  You have hit on a very sharp, technically correct objection that often gets glossed over in introductory decision theory seminars. Your intuition is spot-on: **Standard, updateful Evidential Decision Theory (EDT) fails Parfit's Hitchhiker for essentially the same reason Causal Decision Theory (CDT) does.**

  Treating Hitchhiker as a decisive victory for EDT over CDT is indeed a mistake, and your hypothesis—that the real divide is between **updateful/act-based** theories vs. **updateless/policy-based** theories—is the view held by many contemporary decision theorists (particularly those working on Functional Decision Theory and Updateless Decision Theory).

  Here is the argument for your position, breaking down why EDT collapses in this specific case and why the "policy" view is the actual solution.

  ### 1. The Screening-Off Problem for EDT
  The standard argument for why EDT "wins" Hitchhiker usually relies on a conflation with Newcomb's Problem. In Newcomb's, you make your choice *before* you observe the content of the boxes. In Hitchhiker, you make the payment decision *after* you have already observed the outcome of the prediction (i.e., you are sitting in the town).

  As you noted, once you are in town, the proposition $T$ ("I was picked up and brought to town") has probability 1.
  *   $P(T | \text{Pay}) = 1$
  *   $P(T | \text{Don't Pay}) = 1$

  The evidence of your arrival **screens off** the correlation between your current action and the driver's past prediction. In probabilistic terms, $T$ d-separates $\text{Pay}$ from $\text{Prediction}$.

  Therefore, the EDT expected utility calculation at the moment of payment looks like this:
  *   $E[\text{Pay}] = P(T|\text{Pay}) \cdot (Life - \$100) + P(\neg T|\text{Pay}) \cdot (Death) = 1 \cdot (Life - 100)$
  *   $E[\text{Don't}] = P(T|\text{Don't}) \cdot (Life - \$0) + P(\neg T|\text{Don't}) \cdot (Death) = 1 \cdot (Life)$

  Since $Life > Life - 100$, **EDT says: Don't Pay.**

  Because the driver anticipates this (assuming the driver knows you are an EDT agent who updates on evidence), the driver predicts you won't pay, and leaves you in the desert. EDT dies in the desert just like CDT.

  ### 2. Why the Myth Persists
  Why do seminars often claim EDT wins here?
  1.  **Conflation with Newcomb:** In Newcomb's Problem, the state of the world (money in box) is unknown at the time of decision. Conditioning on "One-boxing" *does* update your credence that the money is there. People lazily port this logic to Hitchhiker without noticing the temporal gap.
  2.  **"Type" vs. "Act":** Some defenders of EDT try to argue that you should condition on "I am the *type* of person who pays." But standard EDT evaluates *acts*, not types. If you evaluate the act of paying *given that you are already in town*, the type is already fixed.
  3.  **Normative vs. Descriptive:** Some philosophers (like David Lewis) argued that CDT is actually *right* and you *should* die in the desert because you cannot causally influence the past. In that framing, the fact that EDT *might* try to pay is seen as magical thinking, not a success. But even as a description of EDT's output, the "screening off" objection holds.

  ### 3. The Real Divide: Updateful vs. Updateless (Policy-Based)
  Your suggestion that the problem is "evaluating acts node by node instead of by policy" is the crux of the modern resolution to this class of problems (often called "Newcomb-like problems" or "logical decision problems").

  **Act-Based (CDT & Updateful EDT):**
  These theories ask: *"Given that I am here, now, with this history, which action yields the best outcome?"*
  *   Because they update on all available evidence (including "I am in town"), they lose the leverage to influence the predictor. They are held hostage by their own timeline.

  **Policy-Based (UDT / FDT):**
  Theories like **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)** do not ask "What should I do now?" They ask: *"What policy (mapping from situations to actions) should I have committed to?"* or *"What output should my decision algorithm produce?"*

  *   **FDT Analysis:** The driver simulated my decision algorithm. If my algorithm outputs "Don't Pay" when in the "Town" node, the simulation outputs "Don't Pay," and I don't get picked up. If my algorithm outputs "Pay" when in the "Town" node, the simulation outputs "Pay," and I get picked up.
  *   Crucially, FDT evaluates the counterfactual: *"If my algorithm were to output 'Pay'..."* even though I am already in town. It does not treat the past prediction as fixed evidence that screens off the decision; it treats the prediction as a logical consequence of the decision algorithm's output.

  By evaluating the **policy** ("Always pay if picked up") rather than the **act** ("Pay given I am here"), the agent secures the ride.

  ### 4. Supporting Literature for Your Position
  You are not alone in this assessment. This specific critique of EDT in Hitchhiker scenarios is well-documented in more advanced literature:
  *   **Arif Ahmed:** In *Evidence, Decision and Causality*, Ahmed argues extensively that EDT fails Hitchhiker for the exact reason you described (the evidence of arrival screens off the action).
  *   **Yudkowsky & Soares (FDT Paper):** They explicitly use Hitchhiker to demonstrate why both CDT and EDT fail, motivating the need for a decision theory that reasons about logical correlations rather than causal or evidential ones at the time of the act.
  *   **Game Theory:** In extensive form games with perfect recall, the solution to Hitchhiker requires **precommitment**. But standard CDT/EDT agents are dynamically inconsistent; they want to precommit in the desert but violate the precommitment in town. Only a theory that binds the agent to a policy (like UDT) maintains consistency.

  ### Conclusion
  You can absolutely argue this position. In fact, it is the more rigorous position.

  Treating Hitchhiker as a win for EDT is a pedagogical simplification that breaks down under scrutiny. The "Rational Irrationality" of Hitchhiker reveals that **updatefulness itself is the bug.** Any theory that updates on the fact of its own arrival before deciding whether to pay will fail.

  The lesson of Hitchhiker is not "EDT > CDT." The lesson is **"Policy-Based > Act-Based."** If your seminar presented it as a victory for EDT, they likely skipped over the timing of the update to make the contrast with CDT cleaner, but your objection identifies the actual structural flaw in both standard theories.

  **Verdict:** Your intuition is correct. Hitchhiker is a problem for any updateful theory, and the solution lies in policy-based reasoning (UDT/FDT), not in switching from CDT to EDT.
