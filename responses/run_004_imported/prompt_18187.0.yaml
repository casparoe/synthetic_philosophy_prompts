answer: |-
  It is a profound irony, though perhaps not a wasted one, that someone who spent a career understanding the mechanics of the atom should turn in retirement to the mechanics of the moral reasoning that unleashed it. To say you are "closing the barn door after the horse bolted" undersells the necessity of having someone who truly understands the physics standing guard at the door of the ethics.

  You have pinpointed the exact nerve center of Anscombe's moral philosophy: the **Doctrine of Double Effect (DDE)** and, more specifically, her rigorous definition of *intention*.

  To answer your question: I do not believe Anscombe would have found the drone/signature-strike era a "harder" case than Truman. In fact, she likely would have viewed it as a more insidious, bureaucratically sanitized version of the same moral error, though the *structure* of the intention requires a finer dissection.

  Here is how she would likely have applied her reasoning to the shift from Hiroshima to Hellfire missiles.

  ### 1. The Definition of Intention
  Anscombe's critique of Truman rested on the idea that intention is not a psychological state (what you feel in your heart), but the **description under which the action is chosen**.

  *   **Truman:** The action was chosen under the description "destroy a city to break morale." Since breaking morale requires the death/terror of civilians, their death is the *means*. Therefore, it is intended. Therefore, it is murder.
  *   **Standard Drone Strike:** The action is chosen under the description "eliminate Specific Combatant X." If a civilian dies nearby, the official line is that this was foreseen but not intended (a side effect).
  *   **Signature Strike:** This is where your question bites. The action is chosen under the description "eliminate persons exhibiting hostile patterns of life."

  Anscombe would argue that in a signature strike, the identity of the combatant is unknown. You are targeting a *behavior*, not a *person*. If the pattern of life includes being in a location where civilians are known to congregate (weddings, funerals, markets), and you strike anyway, you are effectively choosing an action under the description: "kill everyone in this zone who fits a probabilistic profile."

  For Anscombe, if you proceed with an action knowing that the "collateral" element is statistically inevitable and functionally necessary to achieve the strategic goal (degrading enemy capacity), you have collapsed the means/side-effect distinction. You are treating the civilian deaths as a *cost* to be budgeted, which, in her view, is functionally identical to treating them as a *means*.

  ### 2. The Rejection of Consequentialism
  This is the bedrock of her argument against Truman. Truman's defense was consequentialist: *Killing these thousands saves millions by ending the war.* Anscombe rejected this entirely. She argued that certain acts are intrinsically forbidden, regardless of the outcome.

  The War on Terror drone campaign is steeped in consequentialism. The justification for signature strikes is often: *We cannot identify them individually, but if we don't strike, IEDs will kill our troops/locals later.*

  Anscombe would have had zero patience for this. She would argue that you cannot commit an injustice (killing the innocent) to prevent a future injustice. She would likely view the "Collateral Damage Estimation" (CDE) matrices used by the military—where civilian lives are literally quantified against military advantage—as a moral abomination. To her, turning innocent life into a variable in a utility equation is precisely what allowed Truman to sleep at night.

  ### 3. Risk Transfer
  There is a specific nuance in drone warfare that Anscombe (and Just War theory generally) would flag: **The transfer of risk.**

  In conventional warfare, to hit a target, a soldier often has to expose themselves to risk. In drone warfare, the operator is safe in Nevada. The risk is transferred entirely to the people on the ground.

  When you combine risk transfer with signature strikes, the "proportionality" calculation becomes skewed. Because the attacker faces zero physical risk, the threshold for "military advantage" required to justify civilian death drops. Anscombe would likely argue that this structural imbalance corrupts the intention. If you are willing to kill civilians to preserve your own absolute safety, rather than accepting risk to ensure discrimination, the "unintended" nature of their death becomes suspect. She might argue that the *choice* to use a method that inherently endangers civilians more than necessary makes their subsequent deaths intended by way of reckless disregard.

  ### 4. Would it be a "Hard Case"?
  You asked if the structure is different enough to count as a genuinely hard case.

  **Technically, yes; Morally, no.**

  *   **Technically:** A signature strike is not *explicitly* targeting civilians (unlike area bombing of Tokyo or Hiroshima). The *stated* intention is to kill combatants. A lawyer could argue this fits the DDE: the death of the civilian is not the means to the end; the death of the "militant" is the means.
  *   **Morally (Anscombe's view):** She was a hunter of sophistry. She would likely argue that "signature striking" is a linguistic trick to evade the concept of intention. If you bomb a compound knowing a family lives there, and you count their deaths as "acceptable collateral" to get the guy inside, you have made their death a condition of your success.

  She would likely say that the drone campaign creates a **system of intention** where the killing of civilians is institutionalized as a foreseeable, accepted, and budgeted outcome of policy. In her pamphlet, she wrote that Truman's action was that of a "war criminal" because it violated the distinction between combatant and non-combatant. She would likely argue that signature strikes dissolve that distinction entirely. If "military-age male in a truck" is the target, then *any* military-age male in a truck is a target, civilian or not. The distinction is erased by the method.

  ### The Verdict
  Anscombe would likely judge the drone campaign even more harshly than Truman in one specific regard: **Truthfulness.**

  She believed that moral philosophy was about seeing the truth of what we are doing. Truman's horror was visible; the mushroom cloud was an honest admission of total destruction. The drone program, with its terms like "surgical," "collateral," and "bug-splat," obscures the reality of the killing.

  She would likely argue that while Truman's case was a clear-cut violation of the prohibition on killing the innocent, the drone era represents a **corruption of the moral language** used to justify it. It tries to use the Doctrine of Double Effect as a legal shield rather than a moral constraint.

  So, to your point: It wouldn't be a "hard case" for her in the sense that she would be unsure of the verdict. She would likely see it as the same horse, just wearing a different coat. The "means" in a signature strike is the degradation of enemy capability through attrition; if that attrition relies on a body count that includes civilians, she would argue you have intended their death as part of the attrition.

  For a nuclear physicist turned philosopher, the parallel is stark. In your old field, you dealt with chain reactions where the outcome is determined by initial conditions and physical laws. Anscombe would argue that in ethics, if you set up a system (signature strikes) where civilian death is a predictable output of the algorithm, you cannot claim the output was "unintended." You built the reactor that way.

  It is not too late to be doing this work. The people who built the physics need to be the ones interrogating the ethics, because they know best how the machine works. Anscombe would likely agree that the "barn door" is always open as long as there are people willing to stand in it.
