      *   *Why move back?* Because at $t_0$, you didn't know about the Sunday conflict. At $t_2$, you do. That's information update, not preference reversal.
      *   *Stick with the Commitment/Buyout.* It's cleaner for preference reversal.
      *   *Refined Cycle:*
          1.  **Monday:** Pay \$10 to lock money in savings until Friday. (Goal: Save).
          2.  **Wednesday:** Temptation arises. Pay \$15 to unlock money early. (Goal: Consume).
