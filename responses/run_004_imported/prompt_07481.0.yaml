answer: |-
  You have hit on precisely the nerve that keeps decision theorists up at night, and your reading of the tension in Buchak's *Risk and Rationality* is spot-on. The dynamic consistency problem is the "ghost in the machine" for any theory that drops the Independence axiom to accommodate Allais preferences.

  You are asking for an argument that REU theory cannot escape the dynamic-consistency bind without either collapsing into Expected Utility (EU) over a richer domain or biting a normative bullet as costly as the Allais violations themselves.

  Here is the argument for why your suspicion is correct. It rests on what we might call the **Dynamic Trilemma**: you can hold any two of the following three positions, but not all three:
  1.  **Allais Preferences** (violating Independence).
  2.  **Dynamic Consistency** (no money pumps, plans remain optimal at execution).
  3.  **Reduction of Compound Lotteries (ROCL)** (a tree is equivalent to its flattened probability distribution).

  EU keeps (2) and (3) and drops (1). REU wants to keep (1). To avoid irrationality (money pumps), it must drop either (2) or (3). Buchak attempts to drop (3) while maintaining a semblance of (2) via a specific view of evaluation. However, as you suspect, this maneuver forces her into one of your two horns.

  ### Horn 1: The Collapse into EU (Individuation of Outcomes)

  Buchak argues that REU agents care about the *structure* of the risk, not just the final distribution. For an REU maximizer, a 50% chance of \$100 is not the same prospect as a two-stage process that results in a 50% chance of \$100, because the *exposure to risk* differs temporally.

  **The Argument for Collapse:**
  If the structure of the gamble matters to the agent, then the "outcome" is not merely the final monetary payoff. The outcome must include the *path* taken to get there. Let $x$ be "\$100 via a single roll" and $y$ be "\$100 via two sequential rolls." If the agent prefers $x$ to $y$ (or vice versa) despite identical final probabilities, then $x$ and $y$ are psychologically distinct outcomes.

  Once you admit that $x$ and $y$ are distinct outcomes, you can model the agent's preferences using standard EU theory. You simply assign $u(x) \neq u(y)$. The "risk aversion" is no longer doing structural work in the probability weighting function $r(p)$; it is doing descriptive work in the utility function $u(\cdot)$.

  **Why this is a problem for REU:**
  Buchak wants REU to be a *normative* alternative to EU, not just a descriptive redescription. She claims risk-aversion is a distinct attitude from utility curvature. But if the only way to save dynamic consistency is to individuate outcomes based on risk profiles, then REU loses its claim to generality. It becomes a specific claim about how agents *individuate* outcomes, which EU can perfectly accommodate.
  *   **The Cost:** REU ceases to be a rival theory of rationality and becomes a subsidiary hypothesis about outcome taxonomy. You save consistency, but you lose the theoretical innovation.

  ### Horn 2: The Normative Bullet (Violating Separability/Consequentialism)

  Suppose Buchak resists Horn 1. She insists that the outcomes are the same (just "\$100"), but the *evaluation* differs because the risk function applies to the tree structure, not just the reduced form. She denies ROCL.

  To avoid the money pump here, the agent must not re-evaluate their choice at the second node of the decision tree based solely on the sub-tree remaining. If they do, their preferences will reverse (due to the Allais-type shift), and a sophisticated exploiter can pump them.

  To prevent this, Buchak leans on the idea that rational choice is about selecting a **plan** at the root of the tree, and sticking to it. This looks like **Resolute Choice** (associated with Edward McClennen).

  **The Argument for the Bullet:**
  Adopting this stance requires violating **Separability** (or Consequentialism). Separability dictates that your choice at a node should depend only on the future consequences available from that node, not on the path taken to get there or the forgone branches of the tree.

  If an REU maximizer sticks to a plan at $t_2$ that they would not choose if presented with the same sub-problem in isolation at $t_2$, they are allowing past, sunk structural features to dictate current choice.
  *   **The Cost:** This is a massive normative bullet. It implies that rational agents are permitted (or required) to ignore their current preferences in favor of past commitments to avoid exploitation. This undermines the standard instrumentalist conception of rationality, where rationality is about maximizing utility *given your current situation*.
  *   Furthermore, if you deny ROCL without individuating outcomes, you open the door to **description dependence**. Two physically identical processes described as "one stage" vs. "two stages" yield different rational prescriptions. This makes the theory vulnerable to framing effects, which is usually a mark of irrationality, not a feature of a normative theory.

  ### The Synthesis: Why There Is No Third Way

  Buchak attempts to walk a middle line. She argues that the REU maximizer evaluates the *global risk* of the entire tree at the outset. She claims this isn't resolute choice because the agent isn't overriding a preference change; rather, the preference at the node is *constituted* by the global plan.

  However, the critique holds:
  1.  **If the global plan constitutes the preference:** Then the "outcome" at the node includes the fact that it is part of that global plan. We are back to **Horn 1** (Individuation). The utility of the node depends on its history. EU can model this.
  2.  **If the global plan does not constitute the preference:** Then the agent has a local preference at the node that conflicts with the root plan. Sticking to the root plan is **Resolute Choice**. We are back to **Horn 2** (Violating Separability).

  ### Conclusion

  Your intuition is theoretically sound. The dynamic consistency bind forces a choice between **redundancy** and **non-consequentialism**.

  *   If REU saves itself from money pumps by saying "the path matters," it admits that outcomes are history-indexed. But if outcomes are history-indexed, EU can model the preferences by adjusting the utility function. REU becomes EU in disguise.
  *   If REU saves itself by saying "the path doesn't matter, but the structure does, so stick to the plan," it violates Separability. It demands that agents make choices based on counterfactual paths and sunk structural features. This is a normative cost as high as the Allais violations themselves, because it abandons the principle that rational choice is forward-looking.

  Buchak's project is valiant in trying to formalize the intuition that "risk is a distinct attitude," but the dynamic context reveals that you cannot isolate risk attitudes from the temporal structure of choice without paying a steep price. Either risk is just a feature of the outcome (EU), or rationality requires binding yourself against your future self (Resolute Choice). There is no free lunch.
