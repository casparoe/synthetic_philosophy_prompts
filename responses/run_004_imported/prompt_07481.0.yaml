          *   Resolute Choice: You bind yourself.
          *   Cost: This violates "Separability" or "Consequentialism." It means you make decisions based on forgone paths (counterfactuals). This is a huge bullet. It undermines the normative force of "rationality" as responsiveness to current reasons.
