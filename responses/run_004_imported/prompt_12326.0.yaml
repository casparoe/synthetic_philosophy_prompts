prompt: |-
  I'm on the small committee at my company that runs our internal prediction market -- fake points redeemable for a modest bonus pool, used to forecast stuff like ship dates. I've spent way too many hours reading Robin Hanson's blog over the years, so I was thrilled when we set this up, but now we've hit a real dispute and I need to write something up before next week's meeting. Right now anyone can trade on anything, including the two engineers who obviously know more than the rest of us about whether the migration actually ships this quarter. Half the committee wants to ban people from betting on their own project, since it's basically insider trading and it's demoralizing for everyone else who just looses their points to the specialists every time. The other half says that's backwards -- the whole point of a market is to pull informed people's beliefs into the price, and banning them just gets you a thin, useless market. I keep getting stuck on the no-trade theorem, the idea that rational people with common priors shouldn't even want to bet with each other on private info in the first place, since my willingness to take your bet is itself evidence I should update on -- so maybe we literally can't have a market that's both fair and informative unless we subsidize a market maker to eat the losses, a la Hanson. Can you draft the committee's decision memo? I want an actual ruling on the trading rules, not just a list of pros and cons, and it should take seriously whichever side it ends up ruling against.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Internal corporate prediction market (fake points, modest bonus pool).
      *   **Problem:** Dispute over whether project insiders (e.g., engineers working on the migration) should be allowed to trade on their own projects.
      *   **Arguments:**
          *   *Side A (Ban Insiders):* It's "insider trading," demoralizing for outsiders, feels unfair/exploitative.
          *   *Side B (Allow Insiders):* Defeats the purpose of the market (aggregating information), leads to thin/uninformative markets.
          *   *User's Insight:* Mentions the No-Trade Theorem (Milgrom-Stokey), suggesting rational agents shouldn't trade on private info without a subsidy/market maker because the counterparty should infer they have an edge.
      *   **Task:** Draft a committee decision memo.
      *   **Requirements:**
          *   Must make an *actual ruling* (not just pros/cons).
          *   Must take the opposing side seriously (show respect for the argument being rejected).
          *   Needs to address the No-Trade Theorem insight (subsidy/liquidity).
          *   Tone: Professional, thoughtful, grounded in prediction market theory but practical for a corporate setting.

  2.  **Determine the Ruling:**
      *   *Option 1: Ban Insiders.* This kills the market's accuracy. Prediction markets work *because* informed people trade. If you ban the most informed people, the price reflects only rumors and guesses.
      *   *Option 2: Allow Insiders.* This maximizes accuracy but risks morale and legal/HR optics (even if it's fake points).
      *   *Option 3: Hybrid/Modified.* Allow insiders but with restrictions (e.g., disclosure, limits) OR subsidize the market to address the No-Trade concern.
      *   *Decision:* The most robust prediction market design (following Hanson, Cowgill, Zitzewitz, etc.) generally favors allowing informed trading *if* the goal is accuracy. However, the "demoralizing" aspect is a real corporate risk. The No-Trade Theorem point is crucial: if outsiders feel they are being exploited by insiders, they won't trade, leading to illiquidity. The solution isn't banning insiders, it's *subsidizing liquidity* so outsiders don't feel like they are playing against a shark without a house buffer.
      *   *Ruling:* **Allow insiders to trade, BUT implement a subsidized market maker (or liquidity mining) mechanism to protect outsiders and ensure volume.** This addresses the accuracy concern (Side B) while mitigating the fairness/morale concern (Side A) and acknowledging the User's No-Trade insight.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the decision clearly upfront.
      *   **Background:** Briefly recap the dispute (Insider Trading vs. Information Aggregation).
      *   **Analysis of Arguments:**
          *   Acknowledge Side A (Fairness/Morale): It *does* feel like insider trading. Outsiders lose points.
          *   Acknowledge Side B (Accuracy): Banning experts makes the market dumb.
          *   Address the No-Trade Theorem: This is the intellectual core. Why do outsiders trade if they know insiders are there? Because they are subsidized or motivated by non-monetary factors (fun, status).
      *   **The Decision:** Allow insiders.
      *   **Mitigations/Safeguards:** This is where we solve the "demoralizing" part.
          *   Subsidized Market Maker (The "House" takes losses).
          *   Disclosure (Label insiders?).
          *   Position Limits (Prevent market manipulation).
      *   **Rationale:** Explain *why* this was chosen, referencing the theory (Hanson, etc.) without being too academic.
      *   **Next Steps:** Implementation timeline.

  4.  **Refining the Tone:**
      *   Needs to sound like a committee decision, not a lecture.
      *   Must validate the "Ban" side. Their concern about morale is valid. If people feel the game is rigged, they stop playing.
      *   Must integrate the No-Trade Theorem insight naturally. It explains *why* we need a subsidy. If the market is zero-sum (points only), rational outsiders won't play against informed insiders. We need to make it positive-sum (subsidy) or non-monetary (status).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is allowing insiders too risky for HR?
      *   *Fix:* Emphasize that these are *fake points* for a *modest bonus*. It's not SEC-regulated securities. But we still need to call it "Information Contribution" rather than "Trading" to shift the frame.
      *   *Critique:* Did I address the No-Trade Theorem enough?
      *   *Fix:* Make sure the "Liquidity Subsidy" section explicitly references the need to overcome the adverse selection problem.
      *   *Critique:* Is the ruling clear?
      *   *Fix:* Bold the decision.

  6.  **Final Polish:** Check against the prompt's specific constraints.
      *   Actual ruling? Yes.
      *   Take opposing side seriously? Yes (in the "Fairness & Participation" section).
      *   Address No-Trade/Subsidy? Yes (in "Market Structure & Subsidies").
      *   Tone? Professional but intellectually honest.

  7.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Prediction Market Steering Committee
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Insider Participation and Market Structure Rules

  ### Executive Summary

  After reviewing the conflicting proposals regarding participant eligibility, the Committee has reached a decision. **We will allow project insiders (e.g., engineers, product managers) to trade on markets related to their own work.** However, to address valid concerns regarding fairness and participation, this ruling is contingent on a structural change to the market economy: **the implementation of a subsidized Automated Market Maker (AMM).**

  We are rejecting the proposal to ban insiders. While the concerns regarding morale and "insider advantage" are substantial, banning informed participants fundamentally breaks the mechanism's ability to forecast accurately. Instead, we will address the participation risk by ensuring the market is not a zero-sum game for outsiders.

  ### Background

  The Committee has been divided on whether to restrict trading on specific markets to non-insiders. 
  *   **Proposal A (Restriction):** Ban individuals with material non-public information (MNPI) regarding a specific outcome from trading on that outcome. 
  *   **Proposal B (Open Participation):** Allow any employee to trade on any market, regardless of their proximity to the information source.

  This dispute touches on the core tension of corporate prediction markets: balancing **information aggregation** (accuracy) against **participant equity** (morale).

  ### Analysis of Arguments

  **1. The Case for Restriction (Fairness & Morale)**
  The Committee takes the argument for restriction seriously. In a closed ecosystem with a fixed bonus pool, an insider trading on private knowledge is functionally identical to insider trading in financial markets. 
  *   **Adverse Selection:** When an outsider takes the opposite side of an insider's trade, they are mathematically expected to lose points. 
  *   **Participation Risk:** If the general population perceives the market as "rigged" for specialists, they will withdraw. A market without liquidity provides no value to leadership.
  *   **Ethical Optics:** Even with fake points, normalizing the monetization of asymmetric information can create cultural friction between departments.

  **2. The Case for Open Participation (Accuracy & Incentives)**
  Conversely, the primary utility of a prediction market is to extract private information that does not appear in status reports. 
  *   **The "Wisdom" requires the "Expert":** If we ban the engineers from betting on the ship date, the market price reflects only rumors and guesses, not ground truth. 
  *   **Incentive Alignment:** Allowing insiders to profit (in points) from revealing truth via price action incentivizes them to correct false optimism early. 
  *   **No-Trade Theorem Implications:** As noted in our theoretical review, rational agents with common priors should not trade purely on private information without a subsidy, because the act of trading reveals the information. In our context, if outsiders know insiders are banned, they know the market is uninformed. If insiders are allowed but the pool is zero-sum, outsiders know they are "dumb money" and will not trade.

  ### The Decision: Open Participation with Subsidized Liquidity

  The Committee rules that **insiders are permitted to trade on their own projects.**

  However, we acknowledge that in a zero-sum environment (where points won = points lost), this creates an adverse selection problem that will drive away general participants. To resolve this, we are invoking the insight that **informative markets require a subsidy.** We cannot expect rational outsiders to provide liquidity against informed insiders without a buffer.

  Therefore, effective immediately, the following structural changes apply:

  **1. Implementation of a Subsidized Market Maker**
  The bonus pool will no longer be purely redistributive. The Committee will allocate a "Liquidity Budget" of points per quarter. An Automated Market Maker (AMM) will be programmed to provide continuous buy and sell orders. 
  *   **Function:** When outsiders trade against insiders, they are often trading against the AMM, not necessarily against each other. 
  *   **Benefit:** This allows outsiders to lose points to the "house" (which doesn't care) rather than to their colleagues (which creates resentment). It effectively subsidizes the cost of information discovery.

  **2. Transparency Tags**
  Markets will display a "Insider Activity" indicator if a significant volume of trades originates from users tagged to that project. This does not reveal specific positions but signals to the market that informed capital is present, allowing outsiders to adjust their risk accordingly.

  **3. Position Limits for Insiders**
  To prevent market manipulation (e.g., an engineer driving the probability to 99% to secure a bonus, then fixing the bug), insiders are subject to a lower position cap than general participants. They can move the price, but they cannot corner the market.

  **4. Reframing the Narrative**
  Internally, we will shift communication away from "trading" and toward "information contribution." When an engineer trades on their ship date, they are not "gambling"; they are staking reputation on a forecast. Bonus payouts will be framed as rewards for *calibration accuracy*, not speculative gains.

  ### Rationale

  We chose this path because a prediction market that is fair but wrong is useless, and a market that is accurate but empty is also useless. 

  The No-Trade Theorem suggests that without a subsidy, outsiders should not trade against insiders. By introducing the Liquidity Budget, we acknowledge that the company is paying a premium for the information revealed by the insiders. The "losses" outsiders incur are effectively the cost the company pays to uncover the true ship date. This preserves the morale of the general staff (they are playing against a algorithm, not their teammates) while preserving the accuracy of the market (the experts are still incentivized to move the price to truth).

  ### Next Steps

  1.  **Tech Implementation:** Modify the trading engine to include the AMM subsidy logic by [Date].
  2.  **Policy Update:** Update the Terms of Service to explicitly allow insider participation under the new position limits.
  3.  **Communication:** Draft an all-hands announcement emphasizing the "Information Contribution" framing and the new liquidity subsidies.

  **Approved by:**
  [Names of Committee Members]
