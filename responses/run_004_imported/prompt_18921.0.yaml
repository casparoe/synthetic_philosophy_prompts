answer: |-
  A grad student once raised his hand on the first day and said, "Professor, Moore's Paradox is easy to solve. Look: It is raining, but I do not believe that it is raining."

  The class went silent. I leaned forward and asked, "If you don't believe it's raining, what grounds do you have for telling us that it is?"

  He paused, thought for a moment, then pointed at the TA. "It is raining, but *she* does not believe that it is raining."

  The class relaxed.

  I nodded. "Precisely. The logic is identical in both cases. But the first time, you revoked your own warrant to speak. The second time, you just questioned hers. One is a pragmatic contradiction; the other is just office politics."
