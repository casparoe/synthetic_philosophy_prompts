answer: |-
  This is a classic and deeply fruitful debate in formal epistemology. You and your friend have effectively recreated a dispute that has occupied philosophers of probability since van Fraassen introduced the principle in 1984.

  The short verdict is this: **Your friend is right about the mechanics of the Dutch Book argument, but you are right about its normative scope.** The unrestricted Reflection Principle is false, but the restriction to "reliable future selves" is not merely an *ad hoc* patch; it can be grounded principledly in the relationship between Reflection and Conditionalization. However, doing so requires shifting how we understand the principle: from a rule of *change* to a constraint on *expectations of rationality*.

  Here is a breakdown to help you settle the argument, focusing on the Dutch Book mechanics, the "drugged self" objection, and how to repair the principle without circularity.

  ### 1. The Dutch Book Argument: Pragmatic vs. Epistemic
  Your friend is correct that a Dutch Book (or "Dutch Strategy") can be constructed against an agent who violates Reflection. If your current credence in $A$ is $0.4$, but you are certain that tomorrow your credence in $A$ will be $0.9$, a bookie can sell you a bet today that pays off if $A$ is false (based on your $0.4$) and buy a bet from you tomorrow that pays off if $A$ is true (based on your $0.9$). You lose money regardless of $A$'s truth value.

  However, the force of a Dutch Book argument depends on the assumption that the agent intends to act on their credences at both times to maximize utility.
  *   **In the standard case:** You intend to act on your future credences because you expect them to be *better* guided by evidence.
  *   **In the drugged case:** You know your future credences will be the result of cognitive impairment. While you *predict* you will hold them, you do not *endorse* them as guides for action.

  If you know you will be drunk tomorrow, you should not plan to let "Drunk You" place bets. If you lock "Drunk You" out of the betting market (or refuse to let future credences dictate current bets), the Dutch Strategy fails. Thus, the Dutch Book argument only binds you if you plan to treat your future self as an **agent whose decisions you will ratify**.

  ### 2. Prediction vs. Endorsement
  Your "drugged self" counterexample highlights the distinction between **prediction** and **endorsement**.
  *   **Reflection (Unrestricted):** "If I predict I will believe $r$, I must believe $r$."
  *   **Reality:** I can predict I will believe $r$ (due to drugs) while simultaneously believing $r$ is irrational.

  Van Fraassen was aware of this. In his 1984 paper, he frames Reflection as a consistency requirement for an agent who views their future self as an **epistemic authority**. He draws an analogy to deferring to a friend: if you trust your friend's judgment, your credence should match what you expect theirs to be. But if you know your friend is lying or insane, you do not defer. Similarly, if you know your future self is compromised, the principle does not apply.

  ### 3. Is the Restriction *Ad Hoc*?
  This is the core of your worry. If van Fraassen simply says, "Reflection applies unless it gives the wrong answer," that is *ad hoc*. To be principled, the restriction must track an independent epistemic property.

  The restriction is **principled** if we tie Reflection to **Conditionalization**.
  *   **The Link:** Reflection is essentially a generalization of Conditionalization. If I know I will learn evidence $E$ tomorrow, and I plan to Conditionalize, then my current credence in $A$ conditional on learning $E$ should equal my future credence in $A$ given $E$.
  *   **The Distinction:** In the "drugged" case, the change in credence is *not* driven by the acquisition of evidence and the application of Conditionalization. It is driven by causal noise (pharmacology).
  *   **The Principle:** Therefore, Reflection applies only when you expect your future credence change to be the result of **rational information processing** (evidence updating), not causal manipulation.

  This avoids circularity because "rational information processing" is defined independently of Reflection (e.g., via Conditionalization or likelihood ratios), not merely as "changes I defer to."

  ### 4. Repairing the Coherence Argument
  You asked if the coherence argument can be repaired to bind only anticipated rational change without becoming vacuous. Contemporary epistemologists (notably **David Christensen** and **Adam Elga**) have proposed refinements that achieve exactly this.

  **A. Christensen's Synchronic Reflection**
  Christensen argues that Reflection shouldn't be viewed as a diachronic rule (telling you how to change) but as a **synchronic constraint** on your current opinions about your future opinions.
  *   *Repair:* The constraint holds only for propositions about which you expect your future self to be **at least as informed and rational** as you are now.
  *   *Why it works:* In the drugged case, you explicitly judge your future self to be *less* rational. Therefore, the synchronic constraint does not trigger. This isn't *ad hoc*; it follows from the definition of epistemic authority.

  **B. Elga's "New Reflection"**
  Elga suggests that the original principle fails because it conflates *credence* with *value*. He proposes a principle where you defer to your future self only if you believe your future self's credence is formed by a process that is **truth-tracking**.
  *   *The Repair:* You satisfy Reflection if $C_t(A | C_{t'}(A)=r) = r$ **provided** you believe that $C_{t'}$ is formed by a process that is epistemically permissible.
  *   *Avoiding Vacuity:* This is not vacuous because it rules out cases where you are merely *uncertain* about your rationality. If you think there is a 50% chance you will be rational and a 50% chance you will be drunk, Reflection imposes a weighted constraint. It only fully dissolves when you are *certain* of irrationality (the drugged case).

  ### 5. Settlement for the Debate
  Here is how you can resolve the dispute with your friend:

  1.  **Concede to your friend:** The Dutch Book argument *is* formally valid. If you violate Reflection, you are pragmatically inconsistent *relative to the plan of acting on your future credences*.
  2.  **Stand your ground:** However, pragmatic inconsistency is only irrational if the plan itself is rational. It is not irrational to plan to ignore your future, drugged self. Therefore, the Dutch Book argument does not prove that Reflection is a universal epistemic norm.
  3.  **The Synthesis:** The "expert restriction" is not an *ad hoc* patch. It is a necessary condition derived from the principle's foundation. Reflection is the shadow that **Conditionalization** casts on your current expectations.
      *   If you expect to update via Conditionalization (evidence), Reflection holds.
      *   If you expect to update via Causal Noise (drugs), Reflection does not hold.

  **Conclusion:**
  The Reflection Principle is not a "diachronic cousin of conditionalization" in the sense that it governs *all* belief change. It is a constraint on **anticipated rational belief change**. Your friend is right that it stems from coherence, but you are right that coherence alone cannot distinguish between evidence and drugs. That distinction must be imported from an independent theory of evidence (like Conditionalization).

  If you define Reflection as **"Deference to your future self *qua* rational updater,"** the principle is robust, principled, and immune to the drugged-self counterexample. If you define it as **"Deference to your future self *simpliciter*,"** it is false. Van Fraassen intended the former, though his initial formulation allowed for the confusion that sparked your argument.

  **Recommended Reading to Seal the Deal:**
  *   **David Christensen, "Synchronic Bayesian Reflection" (1991):** Defends Reflection against the "drunk" case by refining the conditioning proposition.
  *   **Adam Elga, "Reflection and Disagreement" (2007):** Argues explicitly that Reflection fails when you expect your future self to be irrational.
  *   **Bas van Fraassen, "Belief and the Will" (1984):** The original source, specifically the footnotes regarding "forgetting" and "authority."
