answer: |-
  Good evening. For those of you who don't know me, I'm the brother of the bride. I'm also a philosopher, which means I've spent a significant portion of my life worrying about definitions. So, I promise to keep this brief, though I suspect [Sister] and [Fiancé] would prefer I got the definitions right.

  Most of you know the story of how they met. It happened in a graduate seminar on a book called *Convention*, by the philosopher David Lewis. For the family: Lewis was trying to figure out how we manage to cooperate without signing a contract every time we meet. How do we know to drive on the right side of the road? How do we know which end of the phone to speak into?

  For the academics in the room: You know the definition. A regularity, common knowledge, conditional preferences, alternative equilibria possible.

  Now, I know what some of you are thinking. Describing a marriage as a "convention" sounds a little cold. And Lewis uses a specific word that might make the aunts and uncles nervous. He says conventions are *arbitrary*. In Lewis's terms, that doesn't mean "random" or "careless." It means that another solution *could* have worked. They could have driven on the left. They could have never met. The universe didn't force this specific coordination.

  But here is why that is actually the most romantic thing I can say about them.

  If their relationship were written in the stars, if they were "soulmates" in the cosmic sense, their commitment would be inevitable. It would be physics. But because the equilibrium is arbitrary, their adherence to it is a choice. Every single day.

  Lewis argues that what fixes a convention is *precedent*. We do it this way because we did it this way yesterday, and we want to do it again tomorrow. [Sister] and [Fiancé], your love isn't a lightning strike; it's a precedent you set together. It is the thousands of small coordinations—making coffee, listening to a bad day, choosing to turn toward each other when turning away would have been easier—that have solidified into a life. The fact that it didn't *have* to be this way makes the fact that it *is* this way a testament to your will.

  And then there is Lewis's condition of *Common Knowledge*. Technically, this means I know X, you know X, and I know that you know X. But in a marriage, Common Knowledge is something deeper. It is the absence of the need to signal. It is the safety of knowing that you are on the same side of the road, without having to check the mirrors every five seconds. It is looking across a crowded room and knowing, without a word, that the signal has been received. It is the luxury of never having to guess where you stand.

  To the rest of the family: You might not care about coordination equilibria. But you know what it looks like. You see it when they finish each other's sentences. You see it in the quiet way they make space for one another. You see that they have built a world where they both prefer to conform to the other's happiness, given that the other conforms to theirs.

  So, I am not going to wish you a marriage that is "meant to be." That implies fate, and fate requires no work.

  Instead, I wish you a lifetime of successful iterations. I wish you that when new coordination problems arise—and they will—you will always find the equilibrium that favors us over me. I wish you a common knowledge so deep that you never doubt the signal. And I wish you the joy of renewing the precedent, again and again, for as long as you live.

  Please raise your glasses. To the bride and groom: May your equilibrium be stable, your signals be clear, and your convention be the only one you ever want to follow.

  To [Sister] and [Fiancé].
