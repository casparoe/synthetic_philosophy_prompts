  **(Self-Correction during drafting):** I need to make sure I don't just say "Aquinas likes empirical evidence." That's too simplistic. It's about the *via inventionis* (way of discovery) vs. *via judicii* (way of judgment). Gödel's proof is a *via judicii* masquerading as a *via inventionis*. Also, need to highlight that Aquinas actually *agrees* God's existence is self-evident *in itself*, just not to *us*. Gödel's proof tries to make it evident to *us* via logic. Aquinas says that's impossible given our cognitive state.

