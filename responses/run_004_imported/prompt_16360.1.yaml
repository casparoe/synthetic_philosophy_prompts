answer: |-
  This is a fantastic question because it forces a collision between two very different philosophical methodologies: high-order modal logic (Gödel) and Aristotelian-Thomistic metaphysics (Aquinas).

  If you put Thomas Aquinas in a room with Gödel's ontological proof, **he would reject it as a demonstration of God's existence, but he might accept it as a valid exposition of Divine Nature *after* existence has been established.**

  His verdict wouldn't be the standard Kantian "existence isn't a predicate" line (which is semantic), but rather a deeper metaphysical and epistemological objection regarding **human cognition** and the **distinction between essence and existence.**

  Here is the breakdown of why Aquinas would tank Gödel's proof, specifically engaging with Gödel's machinery (Axioms, S5, and "Positive Properties").

  ### 1. The Epistemological Barrier: *Quoad Nos* vs. *Secundum Se*
  Aquinas's primary objection to Anselm (in *Summa Theologiae* I, q. 2, a. 1) is often summarized as "we don't know what God is." But it's more precise than that. Aquinas admits that the proposition "God exists" is self-evident *in itself* (*secundum se*), because in God, essence and existence are identical. However, it is **not self-evident to us** (*quoad nos*).

  Gödel's proof relies on **Axiom 3** ("The property of being God-like is a positive property") and **Definition 1** ("A God-like being possesses all positive properties"). For the logic to work, the human mind must be able to grasp the concept of "God-like" sufficiently to affirm its possibility.

  Aquinas would argue that Gödel is smuggling in an intellectual intuition that humans do not possess. To affirm that a being with *all* positive properties is "possible" (the crucial trigger for the S5 modal collapse from *possibly necessary* to *necessary*), you must know that those properties are **compossible** (compatible with one another).

  *   **Aquinas's Verdict:** We know perfections like "goodness," "power," and "knowledge" only by abstracting them from creatures. We do not know how they exist in their infinite, divine mode. Therefore, we cannot know *a priori* if "infinite power" and "infinite goodness" are logically compatible in a single essence. Gödel assumes we can validate the coherence of the concept "God" from the armchair. Aquinas says we can only validate the coherence of God *after* we have inferred His existence from effects (the Five Ways). Gödel tries to move from Concept $\rightarrow$ Existence. Aquinas insists on Effect $\rightarrow$ Cause $\rightarrow$ Nature.

  ### 2. The Metaphysics of Existence: Axiom 5
  Gödel's **Axiom 5** states: "Necessary existence is a positive property." This is the engine of the proof. It treats "existence" (specifically necessary existence) as a property that can be added to a list of other properties (like omnipotence, omniscience, etc.).

  Aquinas's metaphysics is built on the **Real Distinction between Essence and Existence** (*Essentia* vs. *Esse*).
  *   In all contingent beings, what a thing *is* (essence) is distinct from the fact *that it is* (existence).
  *   In God alone, Essence and Existence are identical. God is *Ipsum Esse Subsistens* (Subsistent Being Itself).

  Aquinas would argue that Gödel's formalism treats existence as a "property" (a predicate) that a subject *has*. For Aquinas, existence is not a property; it is the **act of being**. By framing "Necessary Existence" as just another "positive property" alongside others, Gödel is categorially confusing the *act* of being with a *mode* of being.

  *   **Aquinas's Verdict:** You cannot define a being as having "Necessary Existence" as a property to prove it exists. That begs the question. To say "God has the property of necessary existence" already presupposes there is a God to hold the property. Aquinas would say Gödel has successfully described what God *would be* if He existed (a being whose essence implies existence), but he hasn't bridged the gap to reality. The logic is valid, but the major premise ("Necessary existence is a positive property instantiated in reality") cannot be known without prior empirical demonstration of a First Cause.

  ### 3. The "Positive" Property Problem and Contingency
  You mentioned the **Modal Collapse** problem (if Gödel's axioms hold, all true truths are necessarily true, eliminating contingency). This is actually where Aquinas would hit the proof the hardest, not just as a logical bug, but as a theological heresy.

  Aquinas is deeply committed to **Contingency**. The world did not *have* to be created. God's will is free. Therefore, the existence of the universe is contingent, not necessary.
  *   If Gödel's axioms (specifically the interaction of Positive Properties and S5) entail that everything true is necessarily true, Aquinas must reject the axioms.
  *   Why? Because we observe contingency. Things could be otherwise.
  *   If the proof requires us to accept axioms that eliminate contingency, the axioms are metaphysically false.

  Furthermore, Aquinas defines "good" or "positive" in terms of **actuality** and **ends** (teleology). A property is "positive" if it perfects a being toward its end. But Gödel's "positive" is formal.
  *   **Aquinas's Verdict:** If "Positive" means "Perfection," Aquinas agrees God has all perfections. But if the logical machinery of "Positive Properties" necessitates a universe where nothing could be otherwise (Modal Collapse), then the definition of "Positive" used in the proof is flawed. A system that denies the contingency of creation denies the free will of the Creator, which is unacceptable to Aquinas.

  ### 4. The *Quia* vs. *Propter Quid* Distinction
  In Aristotelian logic, there are two types of demonstration:
  1.  **Demonstratio Quia:** Demonstrating the fact *that* something is (from effects to causes).
  2.  **Demonstratio Propter Quid:** Demonstrating the reason *why* something is (from causes to effects).

  Aquinas argues that regarding God in this life, we can only use *Demonstratio Quia*. We see motion, causation, and contingency (effects), and we infer a Mover, Cause, and Necessary Being (Cause). We cannot use *Propter Quid* because we do not know the essence (the "why") of God.

  Gödel's proof attempts a *Propter Quid* demonstration using only concepts. It tries to derive the fact of existence from the essence (the definition of God-like).
  *   **Aquinas's Verdict:** This is putting the cart before the horse. We can only know the Divine Essence *after* we know God exists. Gödel tries to use the Essence to prove the Existence. Aquinas would say this is cognitively impossible for humans. We can know *that* God is (via the Five Ways), but not *what* God is (except by analogy). Gödel's proof assumes we know *what* God is well enough to run the logic.

  ### The Final Verdict

  If Aquinas reviewed Gödel's manuscript, his marginalia would likely look like this:

  1.  **On the Logic:** "The syllogistic structure is valid. The modal system is rigorous."
  2.  **On Axiom 5 (Necessary Existence):** "You treat existence as a predicate. It is the act of all acts. You cannot define it into reality."
  3.  **On the Definition of God:** "You assume we know the 'God-like' essence is possible. We do not know this *a priori*. We only know it is possible because we have already proved via the Five Ways that such a Being *is*."
  4.  **On Modal Collapse:** "If your axioms destroy contingency, your axioms are false, for creation is contingent."

  **Conclusion:**
  Aquinas would argue that Gödel has not written a proof for the **existence** of God. He has written a proof for the **coherence** of the concept of God, *provided* God exists.

  For Aquinas, Gödel's proof is a **theological clarification**, not a **natural theology proof**. It shows that *if* you already believe in God (via the Five Ways), then it is logically consistent to attribute "Necessary Existence" to Him. But it cannot be the engine that gets you to belief in the first place. It requires an intuition of the Divine Essence that Aquinas believes is impossible for the human intellect in this life.

  So, the old objections to Anselm **do still land**, but they land harder. Anselm was vague about "greatness." Gödel is precise about "positive properties" and "modal necessity." Aquinas would say the precision makes the error clearer: Gödel has built a perfect logical map of a territory he hasn't proven we can visit. Aquinas insists we must find the territory first (via experience/causation) before we can trust the map.
