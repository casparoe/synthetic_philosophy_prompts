  The answer I have to grade: "Before the message, P(Red)=P(Blue)=1/2 and within each side P(HQ)=P(2nd)=1/2, all independent of each other. The message isn't the kind of input Jeffrey conditionalization was built for, since we're not given new unconditional probabilities over a partition, we're given a new conditional probability, P(2nd|Red)=3/4. Van Fraassen's solution to this is to take the distribution over the four zones that satisfies that constraint while minimizing cross-entropy (KL divergence) from the prior, since minimizing cross-entropy is basically a generalization of Jeffrey conditionalization that collapses back into it whenever the new info is of the ordinary Jeffrey form. Actually solving the minimization, Judy's credence that she's in Blue territory drops a little, from 1/2 to around 0.47, even though the message was ostensibly only about how Red breaks down internally. Philosophers find this troubling because it seems to violate an irrelevance principle we'd want updating to respect: info that's purely about Red's internal split shouldn't move the Red/Blue margin at all, but minimizing cross-entropy moves it anyway, so the rule isn't just an innocent generalization of conditionalization — it smuggles in extra, kind of unmotivated, commitments."

