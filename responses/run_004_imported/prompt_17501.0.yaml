      *   **Mathematical Result:** Expected Value (EV) sum is $\sum \frac{(-1)^{n+1}}{n}$ (Alternating Harmonic Series).
      *   **Key Question 1:** Why does *conditional convergence* make the expectation undefined (intuitively), rather than just infinite? Why is this worse than St. Petersburg (divergence to $+\infty$)?
      *   **Key Question 2:** Consider a modified wager (add $1 to every payoff). Does it get a defined EV?
      *   **Key Question 3:** What does this imply about Statewise Dominance vs. EV maximization when expectations are undefined?
      *   **Constraint:** Explain at the level of *intuition*, not just invoking Riemann Rearrangement Theorem as a black box.

  2.  **Analyze the Pasadena Paradox (Mathematical Core):**
      *   Payoff $X_n = (-1)^{n+1} \frac{2^n}{n}$.
      *   Probability $P(n) = \frac{1}{2^n}$.
      *   Contribution to EV: $X_n \cdot P(n) = \frac{(-1)^{n+1}}{n}$.
      *   Total EV = $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = \ln(2)$.
      *   *Wait, isn't $\ln(2)$ a defined number?* Yes, mathematically the series converges to $\ln(2)$.
      *   *So why is it a paradox?* Because in decision theory, expectations are defined via Lebesgue integration. For an expectation to be well-defined in a robust sense (independent of how you sum the terms), the integral must be *absolutely* convergent ($\sum |x_i| p_i < \infty$).
      *   Here, $\sum |\frac{(-1)^{n+1}}{n}| = \sum \frac{1}{n}$, which diverges.
      *   *Intuition:* The value depends on the *order* of summation. In probability, the "order" corresponds to how we group or partition the sample space. If the value changes based on how we describe the same gamble, the value isn't intrinsic to the gamble.

  3.  **Address Key Question 1: Conditional Convergence vs. Divergence (St. Petersburg):**
      *   *St. Petersburg:* Payoff $2^n$, Prob $1/2^n$. EV term = 1. Sum = $1+1+1... = \infty$.
      *   *Intuition:* Everyone agrees $\infty$ is "big". If you offer me St. Petersburg for \$1 million, I might take it. It's consistently "infinite good".
      *   *Pasadena:* The sum oscillates. Positive terms add up to $+\infty$, negative terms add up to $-\infty$.
      *   *Why is this worse?* It's not just "undefined because it blows up." It's "undefined because it's unstable."
      *   *Analogy:* St. Petersburg is like a bank account that grows without bound. Pasadena is like a bank account where the balance depends entirely on the order in which the bank processes deposits and withdrawals. If they process deposits first, you're rich. If they process withdrawals first, you're bankrupt. Since the "processing order" shouldn't matter for a static gamble, the value is fundamentally indeterminate.
      *   *Decision Theory Impact:* St. Petersburg allows for dominance reasoning (usually). Pasadena breaks the link between the math and the value because the math yields different answers based on arbitrary grouping.

  4.  **Address Key Question 2: The Modified Wager (+$1 bonus):**
      *   Original Payoff: $V_n = (-1)^{n+1} \frac{2^n}{n}$.
      *   New Payoff: $V'_n = V_n + 1$.
      *   New EV Term: $\frac{(-1)^{n+1}}{n} + \frac{1}{2^n}$.
      *   Sum: $\sum \frac{(-1)^{n+1}}{n} + \sum \frac{1}{2^n}$.
      *   The second part ($\sum (1/2)^n$) converges absolutely to 1.
      *   The first part is still the conditionally convergent alternating harmonic series.
      *   *Result:* The sum is *still* conditionally convergent. The absolute sum $\sum |V'_n| P(n)$ still diverges because the $|V_n|$ term dominates the $+1$.
      *   *Conclusion:* The difficulty resurfaces. Adding a finite constant doesn't fix absolute convergence if the underlying oscillation is unbounded in magnitude.

  5.  **Address Key Question 3: Statewise Dominance:**
      *   *Definition:* Gamble A dominates Gamble B if A pays more than B in *every* possible state.
      *   *Scenario:* Original Wager ($W$) vs. Modified Wager ($W + 1$).
      *   *Observation:* $W+1$ pays strictly more than $W$ in every outcome.
      *   *Rationality:* Any rational agent should prefer $W+1$ over $W$.
      *   *EV Theory:* If EV is undefined for both, standard EV maximization says "Neither is preferable" or "Comparison is impossible."
      *   *Conflict:* Dominance says "Pick $W+1$." EV says "I can't tell."
      *   *Implication:* If we accept EV as the *sole* criterion, we violate dominance. If we accept dominance, we admit EV is incomplete.
      *   *Deeper Implication:* When expectations are undefined (due to conditional convergence), we cannot rely on linearity of expectation ($E[X+Y] = E[X] + E[Y]$). If we could, $E[W+1] = E[W] + 1$. But since $E[W]$ is undefined, this arithmetic breaks. This suggests that in cases of undefined expectations, dominance principles must override expectation calculations, or expectation theory needs a major overhaul (e.g., using relative expectations or finite additivity restrictions).

