      *   *Self-Correction during drafting:* Make sure the machine doesn't actually become psychic. That undermines the science. The machine must remain computational. The *human* condition is the variable.

      *(Self-Correction)*: Actually, the prompt asks for ESP to be *real* and mess with everything. So ESP *must* exist in this universe. The question is how it breaks the test.
