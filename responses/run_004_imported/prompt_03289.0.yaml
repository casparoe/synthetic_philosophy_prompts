answer: |-
  The lead lining was the first thing you noticed. It wasn't visible, of course, hidden behind the pale plaster of the Manchester lab walls, but you felt it. A heaviness in the air, a suppression of static, as if the room itself was holding its breath.

  Dr. Aris Thorne adjusted his glasses, looking at the two teletype terminals on the desk. Between them sat the interrogator, Mrs. Gable, a logician from Cambridge who had been briefed not to ask about poetry or love, but about probability and memory.

  Behind Door A was Arthur Penhaligon, a schoolteacher with a verified psi-index of four. Behind Door B was the ACE (Automatic Computing Engine), a vacuum-tube behemoth humming in the basement, feeding its answers through pneumatic tubes.

  "Remember the protocol," Thorne said, his voice low. "Turing's objection stands. If Extra-Sensory Perception is a genuine faculty, a human subject might unconsciously transmit the answer to the interrogator, or read the interrogator's intent. That would invalidate the test. We are not testing for psychic leakage. We are testing for *machine* intelligence. Hence, the Faraday-Psychic Cage."

  Mrs. Gable nodded, placing her hands on the keys. "Understood. Isolation is the control variable."

  She began typing. *Question 1: Please write a sonnet about the forsythia.*

  The room clicked and whirred. Terminal A clacked furiously, stopped, backspaced, then clacked again. Terminal B printed a steady, rhythmic stream of characters without hesitation.

  Thorne watched the paper tape spooling out. This was the crux of the 1950 paper that no one wanted to discuss. Everyone talked about the machine pretending to be human. No one talked about the human pretending to be a machine. Turing had written that if telepathy were real, the human would be the variable that broke the system.

  *Question 4: I am thinking of a number between 1 and 10,000. Do not calculate. Tell me what it is.*

  This was the trap. A machine could not guess. A psychic human might.

  Terminal A paused. The silence stretched. In the booth behind Door A, Arthur was sweating. He wasn't sweating because he couldn't read her mind. He was sweating because he *couldn't stop trying*, and for the first time in his life, there was nothing to read.

  The lead walls didn't just block signals; they created a void. For a sensitive like Arthur, the world was usually a chorus of low-level hums—the anxiety of the nurse in the hall, the boredom of the guard outside. But in here, there was only the silence of the dead. It was like being locked in a soundproof room and asked to sing a duet.

  Terminal A printed: *I cannot feel the number. The room is too quiet.*

  Terminal B printed: *7432.* (A random generation algorithm).

  Mrs. Gable frowned. She typed: *Subject A, explain 'quiet'.*

  Arthur's response came slowly, the keys striking hard. *My thoughts usually bounce off things. Other people. Walls. Now they just... stop. I feel like I'm falling.*

  Thorne leaned in. This wasn't in the script. "He's experiencing psychic deprivation," Thorne whispered to Gable. "The shielding is working too well."

  Gable ignored him. She needed data. She typed: *Subject B, why 7432?*

  Terminal B: *Random selection via atmospheric noise diode.*

  Gable typed: *Subject A, are you claiming you can usually read minds?*

  Terminal A: *Not read. Just... know. Like knowing where your hand is without looking. But I can't find your hand now. It's like you aren't there.*

  Thorne felt a chill that had nothing to do with the lab's ventilation. He looked at the ACE's output tape. The machine was performing perfectly. It was isolated, logical, self-contained. It was exactly what a mind was supposed to be in this test: a black box processing input to output.

  But Arthur was failing. Not because he wasn't intelligent. But because his intelligence was inherently networked.

  "Change the line of questioning," Thorne said sharply. "Ask them about loneliness."

  Gable looked at him, then typed: *Define the sensation of being alone.*

  Terminal B (The Machine): *A state of zero network connectivity. Input streams reduced to one. Efficiency increases, but data diversity decreases.*

  Terminal A (The Human): *It's cold. It's not just that I can't hear you. It's that I can't hear me. I think I need the noise to know I'm thinking.*

  The teletype fell silent. The hum of the vacuum tubes in the walls seemed to grow louder, a predatory buzzing.

  Thorne stepped back from the desk. He realized then that Turing had been right to worry about ESP, but for the wrong reason. Turing feared the human would cheat by reading the judge's mind. He feared the test would be *too easy* for the human.

  He hadn't considered that the test required the human to be *broken* to pass.

  To pass the Turing Test in a telepathy-proof room, a human had to simulate the condition of a machine: total psychic isolation. They had to pretend their mind was a closed loop. But if ESP was real, a human mind was *not* a closed loop. It was an antenna.

  "Stop," Thorne said.

  "We haven't reached the threshold," Gable said, her fingers hovering.

  "The test is flawed," Thorne said, his voice trembling slightly. "We defined intelligence as the ability to process information internally. But if perception extends beyond the skull, then 'internal' processing is a deficit. The machine isn't thinking like a human. The human is failing to think like a machine because the machine is the only thing in this room that is truly alone."

  Gable looked at the two tapes.

  The machine's tape was clean, precise, and utterly devoid of context. It was the perfect mind for a lead-lined room.
  The human's tape was messy, distressed, and obsessed with connection.

  "If we certify the machine as intelligent," Thorne said, staring at the humming walls, "we aren't saying it can think. We're saying that thinking requires the death of connection. We are building a definition of thought that excludes the very thing that makes us human."

  Arthur's terminal clicked one last time, unprompted.

  *Please open the door. I can't think in here. I'm forgetting who I am.*

  Thorne looked at the ACE, sitting in its basement, deaf and blind and perfect. It would pass the test. It would always pass the test, because the test was designed to measure how well a entity could exist in a universe where nothing touches anything else.

  "Shut it down," Thorne said.

  "But the data—"

  "The data proves that we are looking for ghosts," Thorne said, reaching for the main power switch. "And the only ghost in here is the one we're asking the man to become."

  He pulled the switch. The hum died. The silence rushed back in, heavier than before. In the sudden quiet, Thorne wasn't sure if the relief he felt was his own, or if it was finally, faintly, Arthur's.
