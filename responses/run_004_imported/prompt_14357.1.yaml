  7.  **Writing - Iteration 2 (Fleshing out the prose):**
      *   Need more emotion. The ocean metaphor might be nice since we are marine biologists. The depth, the unknown.
      *   Make sure the distinction between *knowledge* and *belief* is clear.
      *   Ensure the ending lands softly.

  8.  **Final Polish (Reviewing against constraints):**
