answer: |-
  Friends, colleagues, family.

  For forty-one years, Walt and I chased data across coastlines that don't appear on tourist maps. We spent more time looking at mudflats and instrument readouts than we did at each other, but when you share that much silence, you learn to hear what isn't being said.

  I know that half of you are here from St. Jude's, and half from the Department. I know that usually, these two groups don't overlap much. I also know that when a man like Walt dies, there is a temptation to smooth over the contradictions of his life. To tell the church that Walt never doubted, or to tell the department that Walt's faith was just a cultural habit.

  I won't do that. Walt wouldn't have wanted me to.

  To those of us from the lab: You know Walt's rigor. This is a man who once scrapped an entire season's trawl data because a salinity sensor drifted by two percent. He believed that the universe was orderly, and that our job was to describe it without flinching. He never asked for special exemptions from the rules of evidence.

  But to those of us from the church: You know Walt's devotion. You know he showed up, not for the social, but for the substance. He prayed. He hoped. He loved the hymn *The Day of Resurrection* not because he thought it was a metaphor, but because he wanted it to be true.

  For a long time, I wondered how he held those two things in one head without them grinding against each other. Then, ten years ago, at a conference in Portland, I asked him. We were at a bar, and someone made a crack about scientists outgrowing God. Walt didn't get defensive. He didn't quote scripture. He quoted philosophy.

  He told me he'd read W.K. Clifford, the one who argued that it is wrong to believe anything without sufficient evidence. You know the story: the shipowner who convinces himself his rotting ship is seaworthy, sends it out, and drowns his passengers. Clifford says belief requires proof. Always.

  Walt took a sip of his beer and said, "Clifford is right about the ship. He's wrong about the soul."

  He pointed me to William James. Specifically, *The Will to Believe*. Walt explained it to me with the precision he usually reserved for calibration protocols. He said there are questions in life that are *forced*, *live*, and *momentous*.

  A forced option is one where you cannot choose not to choose. A momentous one is where the stakes are infinite. Walt argued that the question of God, of what happens after we close our eyes for the last time, is exactly that kind of question.

  He told me: "If I withhold judgment, if I say 'I will wait for proof,' I am not standing on neutral ground. I am making a decision. I am deciding to live as if there is nothing but this. And if I'm wrong, I lose everything. If I'm wrong on the side of hope, I lose nothing but my pride."

  He never claimed to *know*. In thirty years, I never heard Walt say, "I know God exists." He knew the difference between data and trust. He knew that science is a tool for mapping the known, but it is a blunt instrument for navigating the unknown.

  So, how do we honor that today?

  To my colleagues in science: Walt asks you to respect the integrity of his wager. He didn't abandon reason; he recognized its limits. He understood that skepticism is not the absence of a choice, but a choice itself. He chose hope, consciously, with his eyes open to the lack of empirical guarantee. That is not intellectual weakness. That is intellectual courage.

  To our friends at the church: Walt asks you to respect the honesty of his doubt. He didn't believe because it was easy. He believed because he weighed the cost of disbelief and found it too high. His faith wasn't a safety net he fell into; it was a bridge he built, plank by plank, knowing the water was deep underneath.

  We are gathered here to say goodbye. And here, too, we face a forced and momentous option.

  We can look at this casket and see only the end of biological function. We can say that Walt is gone, that the consciousness we loved is extinguished, and that our grief is just chemistry misfiring. That is a valid scientific observation.

  Or, we can do what Walt did. We can look at the same casket and recognize that love is a datum that doesn't disappear just because the source is silent. We can choose to believe that the connection we shared is not severed by death, even if we cannot measure it.

  Walt lived by the idea that refusing to decide is still a decision. So today, let us decide.

  Let us decide that his rigor matters. Let us decide that his hope matters. Let us decide that a man can be a master of evidence and a servant of mystery without betraying either.

  Walt didn't need to know what was on the other side to trust that it was safe to cross. He spent his life measuring the tides, knowing they would outlast him. I think he would tell us not to worry about the calibration of the afterlife. He'd tell us to trust the water.

  He is at peace. Not because the evidence compelled him, but because he willed himself to believe that peace was possible. And if anyone earned the right to that belief, it was him.

  Rest well, partner. The data is safe. The boat is seaworthy. And we'll see you on the other side of the break.
