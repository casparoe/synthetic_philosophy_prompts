      *   **The Conflict:** The audience is split. Half are church members (want assurance of heaven/peace/faith). Half are hardnose scientists/empiricists (skeptical of faith claims, value evidence).
      *   **The Goal:** A eulogy (6-7 minutes read aloud, approx. 900-1100 words) that honors Walt's specific philosophical stance (William James vs. W.K. Clifford) without betraying his intellectual integrity or alienating either group. It needs to use James's concepts ("forced, live, momentous," "withholding judgment is a decision") to bridge the gap.
      *   **Tone:** Respectful, honest, thoughtful, warm, not preachy, not dismissive.

  2.  **Deconstruct the Philosophical Core:**
      *   *W.K. Clifford:* "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." (The Shipowner analogy).
      *   *William James:* "The Will to Believe." Argues that when a hypothesis is *live* (plausible to the believer), *forced* (no option to ignore), and *momentous* (significant consequence), we have the right to believe ahead of evidence.
      *   *Walt's Stance:* He acknowledged Clifford but sided with James regarding existential questions. He didn't claim *proof*; he made a *wager* based on hope. He recognized that skepticism is also a choice with consequences.
      *   *The Bridge:* Both sides value truth and integrity. The scientists value evidential rigor. The church values faith. Walt's integrity lay in knowing the difference and choosing faith *consciously*, not naively.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual nature of the gathering. Establish the speaker's relationship with Walt (41 years, marine biology). Set the tone of shared loss.
      *   **Walt the Scientist:** Establish his credibility with the skeptics. Mention the calibration story. Show he wasn't a person who ignored facts.
      *   **The Turning Point (The Bar Conversation):** Introduce the philosophical conflict. Mention Clifford and James. This is the core intellectual hook.
      *   **Explaining the Stance (for the audience):** Briefly explain James's "forced, live, momentous" without getting too academic. Explain that *not* choosing is still a choice. This validates the scientists (it's a decision, not a fact) and the believers (it's a valid commitment).
      *   **Walt the Believer:** Describe how he lived this. He didn't claim certainty. He lived with hope. This satisfies the church (he had faith) without lying to the scientists (he didn't claim proof).
      *   **The Legacy/Conclusion:** Bring it back to the present. How do we honor him? By being rigorous *and* open. A final farewell that respects the mystery.

  4.  **Drafting - Tone and Pacing:**
      *   *Word Count Check:* A 6-7 minute speech is roughly 900-1050 words at a moderate speaking pace (150 wpm).
      *   *Voice:* First-person, reflective, slightly academic but accessible (he's a biologist reading philosophy).
      *   *Sensitivity:* Avoid saying "Walt is in heaven" as a fact. Instead, say "Walt hoped he was" or "Walt lived as if." Avoid saying "Religion is nonsense." Instead, say "He knew the limits of data."

  5.  **Refining the Philosophical Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe I should explain the shipowner story in detail.
      *   *Correction:* No, too long. Just reference the "ethics of belief." Focus on James's counter.
      *   *Key phrase:* "Withholding judgment is still a judgment." This is crucial for the scientists to respect the decision and the church to respect the commitment.
      *   *Key phrase:* "Forced, live, and momentous." Use these terms explicitly as requested.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Hello everyone. I'm [Name]. Walt was my partner.
      *   He was a great scientist. Threw out data if it was bad.
      *   But he went to church. People asked him about it.
      *   He talked about Clifford and James.
      *   He said you can't wait for proof on big questions.
      *   So he chose hope.
      *   To the church: He loved you. To the scientists: He was honest.
