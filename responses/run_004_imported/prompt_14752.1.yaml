answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being friends with two people who managed to turn a disagreement about global utility functions into a marriage.

  Most couples have a "meet-cute." You know, they spill a drink, or they reach for the same book. Priya and Daniel met at a rationalist meetup, which means their meet-cute involved a whiteboard, a marker that didn't work, and a heated debate about cause prioritization.

  Specifically, the debate was: What is the most urgent moral imperative of our time? Priya argued, with data and passion, that it was farmed-animal suffering. Daniel argued, with equal data and passion, that it was extreme global poverty.

  Now, usually, when two people disagree this fundamentally, one of two things happens. Either they agree to disagree and never talk about it again, or they compromise. They "meet in the middle." Maybe Priya eats a little less meat, and Daniel donates a little less money, and they both feel slightly guilty and slightly resentful.

  But if you know Priya and Daniel, you know they don't do "slightly resentful." And they certainly don't do "meeting in the middle."

  Instead, a few years ago, they settled into an arrangement that I think is actually the secret to their happiness. They looked at the problem and realized that while they disagreed on the *cause*, they agreed on the *goal*: making the world better, and making each other happy.

  So, they made a trade.

  Priya, who cares deeply about animals, agreed to donate well beyond her usual budget to Daniel's favorite poverty charities. And Daniel, who cares deeply about poverty, agreed to maintain a strict vegetarian pledge he likely never would have adopted on his own.

  Now, to the uninitiated, this looks like a compromise. But it's not. In a compromise, both parties lose a little bit of utility to find peace. In this arrangement, both parties *gain*.

  Priya has said that seeing Daniel commit to her cause brings her more joy than the money she donates costs her. And Daniel has said that seeing Priya fund his cause brings him more impact than the tofu costs him in culinary satisfaction. They are both doing something that is slightly costly to them, but incredibly valuable to the person they love. And because they value each other's happiness so highly, they both end up ahead.

  For the three of you in the room who have Toby Ord's 2015 paper bookmarked: Yes, I know what this is. For the rest of you: It's the only time I've ever seen a philosophical concept successfully plan a dinner menu.

  But jokes aside, I think there is a profound lesson here for all of us, regardless of how we prioritize our causes.

  We often think love is about finding someone who agrees with you. But Priya and Daniel show us that love is actually about finding someone whose values you respect enough to champion, even when they aren't your own.

  They didn't try to convert each other. They didn't try to win the argument. They realized that the most effective way to maximize good in the world wasn't to defeat the person standing opposite them, but to join forces with them. They turned a zero-sum debate into a positive-sum partnership.

  In a world that is often obsessed with being right, they chose to be effective. In a culture that tells couples to compromise their dreams, they chose to amplify each other's.

  Priya, you have found a man who loves you enough to look at a menu and see your values. Daniel, you have found a woman who loves you enough to look at her bank account and see your dreams.

  So, if everyone could please raise a glass.

  To Priya and Daniel. May your trades always be positive-sum, your impact always be high, and may you never, ever run out of things to argue about—provided you keep solving them exactly like this.

  To the happy couple!
