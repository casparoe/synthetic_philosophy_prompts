answer: |-
  1. **The "Rhetorical Trump Card" Worry:**
  A common reaction to your view is that it hands wrongdoers a weapon: if I'm caught lying, I can simply point out that you've lied before, and suddenly my lie is the focus rather than my defense. Doesn't your Non-Hypocrisy Condition risk turning moral discourse into a contest of who has the cleanest hands, allowing guilty parties to dodge legitimate charges by impugning the accuser rather than answering to the accusation?

  2. **Follow-up on the Trump Card:**
  You'll likely say that the wrongdoer is still wrong, and that *someone* else with clean hands can still blame them. But consider a case where the hypocritical blamer is the *only* witness to the wrongdoing. If your view silences them, are you committed to saying that some wrongs effectively become un-blamable in practice? Is that a cost you're willing to accept to preserve the integrity of the blamer?

  3. **Distinguishing Standing Failures (The Manager Case):**
  Let's test the boundaries of your distinctions. Imagine a manager criticizes a subordinate for padding an expense report on a shared project. The manager has padded her own reports in the past, but on unrelated projects. This feels like hypocrisy, but because they share a budget, it also feels like complicity, and if the manager is micromanaging, it might feel like meddling. How do you sort out which standing failure is actually doing the work here?

  4. **Follow-up on Standing Failures:**
  If you say this is primarily hypocrisy because the projects were distinct, imagine we tighten the case: the manager's past padding directly funded the budget shortfall that pressured the subordinate to lie. At that point, doesn't your distinction between hypocrisy and complicity collapse? If the hypocrite is causally linked to the environment of the wrong, are you forced to admit that hypocrisy is often just a species of complicity?

  5. **Moral Reform and Restoration:**
  You argue that standing is forfeited, but you leave open the possibility of restoration. Take the case of a recovered addict blaming a current addict. How much moral reform is required to regain standing? Is it a matter of time—staying clean for five years versus five months—or does it require active atonement, and how do we measure that without becoming intrusive?

  6. **Follow-up on Moral Reform:**
  If you say standing is restored through sincere reform, you seem to create a tension between the "Saint" (who never sinned) and the "Penitent" (who sinned but stopped). Does your view inadvertently privilege the Saint? If the Penitent has to jump through hoops to regain a voice the Saint holds automatically, aren't you suggesting that moral perfection is the only secure basis for authority, which contradicts your aim to make blame accessible?

  7. **Scaling to Collective Cases:**
  This theory starts with individuals, but it's often applied to states—for example, when Country A condemns Country B's human rights record while tolerating comparable abuses at home. Do states have "standing" in the same moral sense as individuals, or is this just a metaphorical extension? If it's the same, does a nation's hypocrisy forfeit its right to intervene in global justice issues?

  8. **Follow-up on Collective Cases:**
  If you say a hypocritical state loses its standing, what happens to the citizens within that state who oppose the abuse? If the state speaks for them, does your view silence innocent citizens by association? It seems unwelcome to say that an American dissident loses the standing to criticize foreign abuses just because the US government has dirty hands; how do you separate the citizen's voice from the state's hypocrisy?

  9. **Relevant Similarity:**
  You mention that a blamer forfeits standing if they are guilty of the "same or relevantly similar" wrong. How do we determine relevance? If I criticize you for lying to your spouse, does it matter if I've only lied to my employer? Is the standard of similarity based on the type of act, the harm caused, or the virtue violated, and who gets to decide that threshold in a heated argument?

  10. **The Function of Blame:**
  Finally, your view treats blame as a kind of moral address that requires authority. But some philosophers argue blame is primarily a sanction or a protective mechanism, not a conversation. If blame is just about protecting the community from harm, does the blamer's history really matter? Why should a hypocrite be stopped from issuing a warning that protects others, even if their own record is spotted?
