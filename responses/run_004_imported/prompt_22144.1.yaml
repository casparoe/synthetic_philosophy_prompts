          *   Components: Existence ($\exists x Fx$), Uniqueness ($\forall y (Fy \rightarrow y=x)$), Predication ($Gx$).
          *   Truth Condition: All three conjuncts must be true for the whole sentence to be true. If any are false, the whole sentence is false.
