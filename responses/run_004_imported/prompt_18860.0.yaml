answer: |-
  Thank you all for being here.

  For those who knew my grandmother well, you know she was a woman of precise instructions. She was an actuary; she dealt in risk, probability, and certainty. And she was very clear about what she did *not* want today. She didn't want a vicar telling you she is watching over us from a better place. She was a proud, lifelong atheist, and she didn't believe in heavens. But she was equally firm that she didn't want us standing here saying we are just specks on a speck in an indifferent universe. She felt that was a failure of imagination, and she wouldn't have tolerated it.

  Instead, she asked me to talk about Frank Ramsey.

  Ramsey was a Cambridge philosopher who died in 1930 at the age of 26. In her seventies, my grandmother found his essay "Epilogue" and basically built her outlook around it. She wanted me to share why.

  Ramsey wrote about the fear that comes when we look at the night sky. Science tells us the stars are massive suns, millions of miles away, and we are tiny, short-lived accidents on a rock. It's easy to feel that our lives, our loves, and our losses don't matter in the face of that scale.

  Ramsey argued that this is a mistake. He wrote: *"My picture of the world is drawn in perspective, and not like a map to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  His point was that we shouldn't try to see the world from nowhere. We see it from *here*. In our lived experience, the stars *are* small lights. Our joys and our griefs are not small; they are the foreground. They are the only things that have weight. My grandmother lived by this. She didn't measure her life by cosmic significance, but by human scale. By the quality of her work, the warmth of her kitchen, and the stubbornness of her love for this family. To her, a human life wasn't insignificant just because the universe was big; it was significant because it was ours.

  She found a lot of comfort in Ramsey's logic, but she also found room for a joke. As an actuary, she loved the line where Ramsey suggests we should view our own future goods with a "present value at compound discount." She thought it was hilarious that a philosopher would use actuarial math to tell us how to stop worrying about tomorrow.

  However, she also loved the irony that Ramsey, in his work on economics, later argued that discounting the welfare of future generations was "ethically indefensible." She always said that contradiction was the most Ramsey thing about Ramsey.

  But the lesson she took from him wasn't about the contradiction. It was about the perspective.

  So, how do we mourn her without religion and without nihilism? We do it by keeping the drawing in perspective. She is not in a better place, because there is no evidence such a place exists. But she is not gone, either, because the foreground she occupied is still here. It is here in the stories you're sharing, in the habits she taught us, and in the way we treat each other.

  The stars can remain as small as threepenny bits. What matters is the light we hold in our hands while we are here. My grandmother held that light very brightly. And if we keep our focus on the human scale—on each other, and on the memory of her—then that light doesn't go out.

  Thank you.
