      *(Self-Correction during drafting the response)*: I need to make sure the "Guess the Answer" sounds like a philosopher who has thought about this, not a strawman. They will likely distinguish between *credibility* and *intelligibility*.

      *(Refining the "Genuine Gap" question)*: The prompt asks for a case where the marginalized group *doesn't* have better words. I should use an example like a new technological phenomenon affecting everyone, but disproportionately affecting a marginalized group, where *no one* had the vocabulary initially.

      *(Refining the "TI collapse" question)*: The key is: TI is about *who* is speaking (credibility deficit). HI is about *what* can be said (interpretive deficit). If the concept exists in the subculture, the deficit is only relative to the *dominant* culture. Is that HI or TI?

      Let's write it out.

  6.  **Final Review against constraints:**
      *   8 questions? Yes.
      *   Push on TI/HI distinction? Yes (Q1).
      *   Push on Blame/Structure? Yes (Q2).
