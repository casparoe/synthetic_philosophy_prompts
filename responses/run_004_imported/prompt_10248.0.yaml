answer: |-
  Friends, family, and loved ones, we gather here to witness a promise. But for [Groom] and [Bride], this promise is rooted in something far deeper than a simple coincidence of timing.

  We often speak of marriage as "meant to be." But what does that mean? For some, it implies a script written in stone, where we are merely actors reading lines we didn't choose. For others, it implies a gamble, where God hopes things work out but isn't really sure.

  [Groom] and [Bride] believe the truth is more beautiful than either of those options.

  They hold that before the universe was created, before time began, God surveyed the infinite landscape of all possible worlds. He didn't just see what *could* happen; He knew with absolute certainty what *would* happen in every conceivable circumstance. He knew every free choice every person *would* make if placed in any specific moment.

  In that eternal vision, God saw a world where [Groom] would take a certain path, and [Bride] would walk a certain road. He saw the moment their eyes would meet. He knew, with infallible certainty, that in *this* world, given these circumstances, you would freely choose to love one another.

  This means your love is no accident. It was known before the foundations of the earth. But—and this is crucial—it was not forced. God did not override your wills to bring you together. He knew your hearts so perfectly that He knew exactly where your freedom would lead you. He authored the story, but you wrote the lines.

  So, when you speak your vows in a moment, you are not submitting to a fate imposed upon you. You are stepping into a reality that God prepared specifically because He knew it was where you would say "Yes."

  It is a certainty grounded not in divine control, but in divine knowledge of *you*. Your love is the intersection of God's sovereign plan and your own libertarian freedom. It was certain to Him, because it was true about you.

  And so, as you stand here now, you are fulfilling a truth that is older than time itself. Not because you had to, but because, in the mind of God, you always would.

  With that foundation of certainty and freedom, let us hear your vows.
