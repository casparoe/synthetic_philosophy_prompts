      *   *Check:* Did I make Jordan too dismissive of Kalam? *Correction:* Jordan should acknowledge Kalam's appeal but point out its dependency on temporal premises that might be contingent.
      *   *Check:* Is the "Taxicab" analogy clear? *Correction:* Make sure Schopenhauer's point is articulated clearly by Alex, and Jordan's rebuttal (God's necessity) is sharp.
