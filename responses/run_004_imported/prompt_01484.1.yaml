answer: |-
  This is a fantastic question that cuts right to the bone of classical utilitarianism's relationship with phenomenology. You are absolutely right to distinguish between the watered-down "live and let live" liberalism often attributed to Bentham and the actual radical machinery of his unpublished sexual ethics.

  If we take the 2014 Oxford volume (*Of Sexual Irregularities*) and the "Paederasty" essay seriously, Bentham's framework doesn't just "strain" at BDSM—it actually dissolves the objection entirely, provided we accept his specific definition of what counts as a "pain" in the ledger.

  Here is how a strict Benthamite calculus likely resolves BDSM, and where the few genuine friction points lie.

  ### 1. The Illegitimacy of "Antipathy"
  You nailed the prerequisite: Bentham's most aggressive move in the sexual manuscripts is disqualifying **sympathetic antipathy** (disgust) as a valid input.

  For Bentham, if a vanilla observer watches a BDSM scene and feels nausea or moral outrage, that pain is **not** entered into the calculus. He classifies this as a prejudice, often rooted in religious asceticism or social conditioning. In *The Rationale of Punishment*, he argues that pain derived from mere opinion rather than tangible mischief is illegitimate.

  Therefore, the most common argument against kink ("It's depraved/sickening") is automatically zeroed out. Bentham would view the *social stigma* surrounding kink as a source of real pain (ostracization, legal punishment), but he would locate the immorality in the *stigmatizers*, not the practitioners. The pain of the outsider is their own problem; the pain of the kinkster caused by the outsider is a social evil to be remedied, not a reason to ban the kink.

  ### 2. Pain as Instrumental vs. Intrinsic
  This is the crux of your question: *Utilitarianism says pain is bad. BDSM uses pain. Is this a contradiction?*

  Bentham distinguishes between **intrinsic** disvalue and **instrumental** value. In his *Introduction to the Principles of Morals and Legislation*, he acknowledges that pain can be justified if it prevents a greater pain or procures a greater pleasure. The classic example is surgery: cutting flesh causes pain, but it is utility-positive because it restores health.

  Bentham would likely categorize BDSM pain as **recreational instrumentalism**.
  *   **The Physiological Input:** Nociception (pain signals).
  *   **The Phenomenological Output:** Pleasure (endorphins, subspace, intimacy, catharsis).

  For the felicific calculus, the ledger records the **conscious experience**, not the physiological label. If the submissive subject reports that the net experience is positive (which is the definition of consent in this context), then the "pain" has been successfully converted into "pleasure" within the utility function. Bentham is a hedonist; if it feels good to the subject, it *is* good, regardless of the mechanism.

  He would likely argue that calling it "pain" is a linguistic error. If the subject desires it and enjoys it, it belongs in the **pleasure** column of their personal calculus, even if it looks like "pain" to an outsider. To count it as a negative would be to impose an external valuation on an internal state, which violates the subjective nature of utilitarianism.

  ### 3. The "Mischief" Test
  Bentham's legal theory rests on **mischief**. An act is only criminalizable if it produces tangible mischief (harm) to non-consenting parties.

  In BDSM:
  *   **Participants:** Consenting (assuming sanity and lack of coercion). Net utility positive.
  *   **Non-participants:** No physical harm. Any psychological discomfort is "antipathy" (see point 1), which is illegitimate.

  Bentham would likely be fascinated by the **contractual** nature of BDSM (negotiation, limits, safe words). This aligns perfectly with his legal positivism. He loved clear rules and defined boundaries. A negotiated scene is a micro-legislation of utility.

  ### 4. Where the Calculus Strains
  However, it's not entirely clean. There are three areas where Bentham might pause or where the calculus gets messy:

  **A. The Problem of Adaptive Preferences**
  Bentham was worried about power dynamics (see his Panopticon writings). He might ask: *Is the submissive truly maximizing utility, or have they been conditioned to accept less?*
  If a submissive has been groomed to enjoy pain that is actually damaging them long-term, their reported utility is false. Bentham would care about **long-term consequences**. If the kink leads to permanent physical injury or psychological degradation that reduces future capacity for happiness, the calculus turns negative. He would likely support the modern "Safe, Sane, Consensual" framework not for moral reasons, but for **risk management**.

  **B. The Social Cost Benefit Analysis**
  Bentham was a pragmatist. Even if an act is intrinsically harmless, if society punishes it severely, engaging in it might be utility-negative *for the individual*.
  He might advise discretion. If being a kinkster in 2024 leads to job loss, family estrangement, or violence, the **sanction of the public** creates real pain. Bentham might argue that while the *act* is moral, the *public advocacy* of it could be imprudent if it triggers a backlash that outweighs the pleasure gained. (Though, being a radical reformer, he might also argue that triggering the backlash is necessary to change the laws).

  **C. The Definition of Consent under Intoxication/Power**
  Bentham's era didn't have our nuanced understanding of psychological coercion. In a D/s dynamic, where power is exchanged, how does the utilitarian ensure the "lesser power" isn't being exploited?
  Bentham relies on the ability of the individual to judge their own interest. If the submissive says "I am happy," Bentham generally takes that at face value unless there is evidence of force. But a modern Benthamite might struggle with the calculus of **internalized oppression**. If a woman enjoys submission because patriarchy has taught her that is her role, is that true utility? Bentham doesn't have a great tool for deconstructing *why* a preference exists, only that it *does* exist.

  ### 5. The Verdict
  Bentham would likely be the **patron saint of kink**, far more than he is of standard sexual liberalism.

  His argument in the "Paederasty" essay is that the law should not punish sex unless there is a victim. In BDSM, the "victim" is a willing participant who is actually a beneficiary.
  *   **Asceticism:** He would view the refusal to engage in kink (if desired) as a violation of the principle of utility.
  *   **Disgust:** He would view the "ick factor" as a superstition akin to religious fear of heresy.
  *   **Pain:** He would view it as a technical medium for pleasure, no different than the burn of spicy food or the exhaustion of a marathon.

  The calculus doesn't break; it just requires us to accept that **pain is not an objective metric, but a subjective experience.** If the brain processes the stimulus as pleasure, the ledger records pleasure.

  The only place Bentham would crack down is on **negligence**. If a Dominant causes permanent damage through incompetence, that is real mischief. That is a net negative in the calculus that cannot be washed away by prior consent, because the consent was for *play*, not *maiming*. He would likely advocate for strict liability regarding safety protocols, treating unsafe BDSM not as a moral sin, but as a public health hazard.

  So, to answer your specific worry: No, the felicific calculus doesn't strain at the concept of consensual pain. It strains only if we insist on defining pain objectively rather than phenomenologically. Bentham, the psychological hedonist, would side with the phenomenology every time.
