      *   *Actually, the strongest philosophical move:* Argue that **Williamson/Whiting is the necessary core**, but it must be supplemented by a **normative/pragmatic layer** (akin to Prohibitionism's social focus but not its semantic emptiness) to handle reclamation.
      *   *Let's refine the verdict:* The Williamson/Whiting account provides the best linguistic machinery for projection. However, to handle reclamation, we must reject the idea that the implicature is purely *lexical/conventional* and accept that it is *socially indexed*. This moves slightly away from strict Williamson but keeps the core.
      *   *Wait, is there a better fit?* What if I argue that **Hom's externalism is actually compatible with projection if viewed as presuppositional**? No, Hom explicitly argues for truth-conditional content (null extension). That's a hard sell against Camp.
      *   *Okay, final plan:*
          1.  Introduction: State the tension (Projection vs. Reclamation).
          2.  Evaluate Hom: Good on the "nature" of hate, fails Projection.
          3.  Evaluate A&L: Good on tokening/mention, fails Reclamation (and doesn't explain the difference in cognitive significance between slur and NC).
          4.  Evaluate Williamson/Whiting: Best on Projection, struggles with Reclamation (fixed CI).
          5.  Synthesis/Verdict: Defend a **Modified Implicature Account**. Keep W/W's semantic structure (NC content + Expressive layer) because Projection is the non-negotiable linguistic datum. Solve Reclamation by treating the expressive layer not as a fixed lexical rule but as a **normative status** tied to speaker authority (incorporating Hom's externalism about institutions).
          6.  Conclusion: W/W is the winner, but only if social context is integrated into the pragmatic mechanism.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Acknowledge the fragmentation. State the thesis: While Hom captures the moral gravity and A&L capture the taboo nature, Williamson/Whiting offers the only viable linguistic framework, provided it is modified to account for speaker authority (reclamation).
      *   *Hom:* Focus on Combinatorial Externalism. The null extension claim is the Achilles' heel regarding projection. "Jones is not a [slur]" should be true and clean if the slur is empty. It isn't. Camp's objection is decisive.
      *   *A&L:* Prohibitionism. Explains why mentioning offends. But fails to distinguish the *cognitive* difference between using the slur and the neutral counterpart in an affirmative sentence. Also, reclamation makes the prohibition conditional, which undermines the "unconditional ban" thesis.
