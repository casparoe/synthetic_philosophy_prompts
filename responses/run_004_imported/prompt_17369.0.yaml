      *   *Selected Verdict:* Defend a **Context-Sensitive Implicature Account**. It keeps Williamson/Whiting's semantic leaness (avoiding Hom's null extension problem) but modifies the "conventional" part to allow for reclamation (addressing the weakness of fixed CIs). It beats Prohibitionism because Prohibitionism can't explain the *difference* in meaning between slur and NC in standard usage. It beats Hom because Hom can't handle projection.

