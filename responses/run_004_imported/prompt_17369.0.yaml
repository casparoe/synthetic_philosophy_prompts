      *   **Theories to Evaluate:**
          1.  *Content-Based (Hom):* Combinatorial Externalism. Slurs encode complex negative properties (null extension).
          2.  *Implicature-Based (Williamson/Whiting):* Same descriptive content as neutral counterpart + conventional implicature of contempt.
          3.  *Prohibitionism (Anderson & Lepore):* No semantic/pragmatic difference from neutral counterpart; offense lies in social prohibition against tokening the word.
      *   **Key Data Points to Address:**
          1.  *Projection:* Derogatory force persists under negation, conditionals, attitude reports (challenges Hom especially).
          2.  *Reclamation:* In-group usage removes offense without changing form/reference (challenges Williamson/Whiting and Anderson/Lepore).
      *   **Task:** Weigh the three theories against the data (projection and reclamation).
      *   **Requirement:** Defend a *definite verdict* (choose one or a specific combination), do not conclude they are incommensurable.

  2.  **Deconstruct the Theories vs. Data:**

      *   **Hom (Combinatorial Externalism):**
          *   *Mechanism:* Semantic content includes a normative, institutional component. Extension is null.
          *   *Projection:* Weakness. If the content is semantic (truth-conditional), it should disappear under negation ("Jones is not a [slur]" should be true and clean). Camp's criticism is strong here. Hom tries to explain it via presupposition or pragmatic strengthening, but it's a strain on the core semantic claim.
          *   *Reclamation:* Weakness. If the meaning is fixed by external discriminatory institutions, how can the group change the meaning just by using it? It requires a shift in the external institutional facts, which is too slow/heavy for linguistic reclamation.

      *   **Williamson/Whiting (Conventional Implicature):**
          *   *Mechanism:* Truth-conditional content = Neutral Counterpart (NC). Offense = Conventional Implicature (CI).
          *   *Projection:* Strength. CIs project by definition. "Jones is not a [slur]" implicates contempt regardless of truth value.
          *   *Reclamation:* Weakness. CIs are usually tied to the lexical item. If the word is the same, the CI should be the same. Reclamation suggests the CI can be cancelled or inverted by speaker identity/context, which looks more like conversational implicature or a shift in semantic content, not a fixed CI.

      *   **Anderson & Lepore (Prohibitionism):**
          *   *Mechanism:* Word is prohibited. Offense = violating the taboo.
          *   *Projection:* Strength (sort of). Saying the word violates the prohibition regardless of logical operator.
          *   *Reclamation:* Weakness. If the word is unconditionally prohibited, in-group usage should still be offensive (or at least a violation). Prohibitionism struggles to explain *why* in-group usage is permissible without ad hoc exceptions. It treats the word as a brute token, ignoring the expressive nuance of reclamation.

  3.  **Formulate a Verdict:**
      *   *Option A: Pick one.* None handle *both* perfectly. Williamson/Whiting is best on projection, worst on reclamation. Hom is deep on the nature of hate but fails projection. A&L is simple but too blunt.
      *   *Option B: Hybrid/Combination.* This is usually the most philosophically robust move in grad seminars.
      *   *Idea:* A "Dual-Component" or "Expressivist-Semantic" Hybrid.
      *   *Refinement:* The Williamson/Whiting model is the strongest baseline for *standard* derogatory usage because it explains projection best (the core linguistic puzzle). However, it needs modification for reclamation. Reclamation suggests the "contempt" isn't a fixed *conventional* implicature but is sensitive to *speaker identity* and *context*.
      *   *Better Hybrid:* Adopt the Williamson/Whiting structure (NC content + Expressive component) but treat the expressive component not as a rigid Conventional Implicature, but as a *presupposition* or a *context-sensitive expressive norm* that can be suspended by in-group authority.
      *   *Wait, let's look closer at Hom.* Hom's insight about the *institutional* nature is crucial for explaining *why* the word hurts, even if his null-extension claim fails projection.
      *   *Wait, let's look closer at A&L.* Their insight about the *tokening* explains why mentioning is offensive, but fails reclamation.
      *   *Decision:* The best account is a **modified Conventional Implicature account (Williamson/Whiting)** that incorporates **context-sensitivity regarding the speaker's standing** to address reclamation. Why? Because projection is the harder linguistic constraint to satisfy. If a theory fails projection, it fails as a theory of *meaning*. Reclamation is a sociolinguistic phenomenon that can be modeled as a parameter within the pragmatics.
