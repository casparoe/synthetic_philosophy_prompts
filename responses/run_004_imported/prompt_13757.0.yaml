      *   **Move 3: Sam's Defense of the Hard Case.**
          *   Sam: 1 vs. 100 is hard, but 1 vs. 5 doesn't automatically follow. Gut reactions to extreme cases aren't reliable truth guides. Suggests non-aggregative reasons for 1 vs. 100 (e.g., contractualism/ex-ante agreement).
