  **UNIVERSITY ATHLETIC CONFERENCE**
  **THERAPEUTIC USE EXEMPTION (TUE) COMMITTEE**

  **DECISION NOTICE**

  **Athlete ID:** [Redacted]
  **Sport:** Track & Field (Middle Distance)
  **Substance Requested:** Amphetamine (Mixed Salts)
  **Meeting Date:** October 14, 2023
  **Decision:** **DENIED**

  ---

  ### I. Factual Background

  The applicant, a varsity middle-distance runner, has submitted a request for a Therapeutic Use Exemption (TUE) to utilize a prescribed amphetamine regimen during the upcoming Conference Championships. The applicant presents a diagnosis of Attention Deficit Hyperactivity Disorder (ADHD) rendered three weeks prior to the competition. This diagnosis was established via a single forty-minute clinical interview. The Committee notes that Conference Policy 4.2.B recommends a multi-modal assessment including psychometric testing and historical academic/behavioral review, though it acknowledges the temporal constraint of the championship window.

  The applicant's coach has submitted a statement noting a "noticeable drop" in split times and improved lap consistency since the initiation of the medication regimen twenty days ago. Amphetamines are classified as Specified Stimulants (S6) under the Conference Prohibited List.

  ### II. Application of Policy Criteria

  Conference Policy requires the satisfaction of three cumulative criteria for TUE approval:
  1.  **Significant Health Impairment:** The athlete would experience a significant health problem without treatment.
  2.  **No Therapeutic Alternative:** There is no reasonable permitted therapeutic alternative.
  3.  **No Performance Enhancement:** The treatment does not enhance performance beyond a return to normal baseline.

  **Regarding Criteria 1 & 2:**
  The Committee accepts that untreated ADHD can constitute a significant health impairment and that stimulants are often the first-line treatment. We acknowledge the argument that non-stimulant alternatives (e.g., atomoxetine) require weeks to reach therapeutic efficacy, rendering them unusable for this specific competition.

  **Regarding Criteria 3 (The Determining Factor):**
  The Committee cannot be satisfied that the use of amphetamines in this instance will not enhance performance beyond a normal baseline. The core function of a TUE is to restore an athlete to a state of health equity, not to provide a pharmacological advantage. Amphetamines are well-documented ergogenic aids in the general population, improving reaction time and fatigue resistance regardless of ADHD status.

  Because the diagnosis relies on a single interview without a longitudinal baseline of unmedicated performance or psychometric data, the Committee lacks the objective data necessary to distinguish between *therapeutic restoration* and *pharmacological augmentation*. The coach's observation of improved times, while anecdotal, correlates with the known ergogenic effects of the substance in the absence of a verified medical baseline. Consequently, the burden of proof required by Policy 4.2.B has not been met.

  ### III. Consideration of the Athlete's Primary Claim

  The Committee has carefully weighed the strongest argument presented in favor of the application: **The Argument from Equity of Access.**

  The applicant contends that strict adherence to evidentiary standards inadvertently discriminates against athletes with late-diagnosed or late-onset conditions. By requiring a robust historical baseline that takes time to generate, the policy effectively punishes the athlete for the timing of her diagnosis. The argument posits that withholding a medically prescribed treatment prioritizes an abstract concept of "fairness" over the concrete well-being and competitive eligibility of a disabled athlete. In this view, denying the TUE does not protect clean sport; it merely excludes a neurodivergent athlete from participation, thereby undermining the inclusive spirit of university athletics.

  **Committee Response:**
  We recognize the moral weight of this claim. It is not the Committee's intent to exclude athletes based on administrative timelines. However, the integrity of the TUE system relies on the ability to verify that a substance is not being used for enhancement. In cases involving substances with high ergogenic potential (such as amphetamines), the risk of false-positive TUEs threatens the legitimacy of the competition for *all* athletes, including those with verified disabilities.

  If the Committee were to grant an exemption based on insufficient diagnostic data, we would be establishing a precedent that allows performance-enhancing substances into the competition under the guise of therapy, simply because a diagnosis was convenient to the competitive calendar. This creates a "loophole" that pressures other athletes to seek similar late diagnoses to remain competitive, ultimately degrading the environment for the very neurodivergent athletes the policy aims to protect.

  Therefore, while the denial imposes a burden on this individual athlete, it is necessary to maintain the structural integrity that ensures long-term equity. We cannot verify that the medication is leveling the playing field rather than tilting it.

  ### IV. Final Ruling and Path Forward

  **The application for a Therapeutic Use Exemption is DENIED for the upcoming Conference Championships.**

  This decision is specific to the use of prohibited stimulants during this competitive window. It is not a judgment on the validity of the athlete's medical condition generally.

  **Conditions for Future Eligibility:**
  The Committee strongly encourages the athlete to complete the full multi-modal assessment recommended by policy during the off-season. Should a comprehensive diagnosis be confirmed via longitudinal testing and historical review, the Committee will expedite a TUE application for the subsequent competitive season. The athlete is permitted to compete in the championships without the medication or may seek a non-stimulant alternative for long-term management, subject to medical advice.

  **Signed,**

  *The University Athletic Conference TUE Committee*
