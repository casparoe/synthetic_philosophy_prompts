      *   Avoid being condescending ("Actually, you're wrong"). Instead, "You've hit on the starting point, but here's where the field goes next."
      *   Use analogies (Hilbert's Hotel is good for cardinality, but maybe simple series are better for utility).

  7.  **Self-Correction/Edge Case Check:**
