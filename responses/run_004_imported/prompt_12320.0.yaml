answer: |-
  You are absolutely right to feel that the pop-sci usage of "paradigm shift" is a caricature. The "irrationalist Kuhn" of the 1960s is not the "mature Kuhn" of the 1980s and 90s. Your philosopher friend is correct: Kuhn spent the last two decades of his life specifically repairing the damage caused by the claim that science doesn't progress.

  To write about this with precision, you need to pivot from **global worldview incommensurability** to **local taxonomic incommensurability**.

  Here is the breakdown of Kuhn's mature position, specifically designed for a science writer who needs to stop hand-waving.

  ### 1. The Core Distinction: Incommensurable $\neq$ Incomparable
  The biggest journalistic error is treating "incommensurable" as a synonym for "incompatible" or "unintelligible."

  *   **The Early View (1962):** Kuhn suggested that scientists in different paradigms "live in different worlds." This implied a Gestalt switch where no rational arbitration was possible.
  *   **The Mature View (1980s–1990s):** Kuhn clarified that incommensurability is a **semantic** problem, not an **epistemic** one. It is about *translation*, not *comparison*.

  **The Precision Hook:** Two theories are incommensurable if there is no neutral language into which both can be fully translated without loss or distortion. However, they are still **comparable** because scientists can become "bilingual." They can learn the older theory as a second language and evaluate which theory solves more puzzles.

  ### 2. The Mechanism: Taxonomic Incommensurability
  In his later essays (collected in *The Road Since Structure*), Kuhn narrowed the scope of incommensurability to specific clusters of concepts. He leaned heavily on semantics and the structure of natural kind terms.

  He argued that scientific theories come with a **lexical taxonomy**. Concepts are defined not in isolation, but in relation to a hierarchy (e.g., a "planet" is defined against "star," "moon," "comet").

  *   **The Problem:** When a revolution occurs, the boundaries of these categories shift. You cannot map the terms of Theory A onto Theory B one-to-one because the "cuts" they make in nature are different.
  *   **The Classic Example:** Newtonian "mass" vs. Einsteinian "mass."
      *   In Newton's taxonomy, mass is invariant.
      *   In Einstein's taxonomy, mass is relative to velocity.
      *   You cannot translate Newton's sentence "Mass is constant" into Einstein's language without changing its truth value. Therefore, they are incommensurable *locally*.
  *   **Why it's not Global:** This doesn't mean *all* terms change. Mathematics, logic, and many observational terms (e.g., "pointer on a dial") remain stable. This stability provides the common ground required for comparison.

  ### 3. Answering Davidson: The "No Total Scheme" Clause
  You mentioned Donald Davidson, and this is crucial for your accuracy. Davidson argued that the idea of a "conceptual scheme" totally untranslatable from our own is incoherent; if we can identify it as a scheme, we must share some logic with it.

  Kuhn accepted this critique. In his essay "World Changes" (1990), he conceded that **total** incommensurability is impossible.
  *   **Mature Kuhn:** There is no "whole worldview" replacement. There are only local taxonomic mismatches.
  *   **The Implication:** Because the mismatch is local, scientists can stand on the overlapping ground (the shared vocabulary and values) to compare the non-overlapping parts. This defeats the charge of relativism. We aren't choosing between two random religions; we are choosing between two tools based on shared criteria.

  ### 4. How Comparison Works (Without Neutrality)
  If there is no neutral language, how do we decide Einstein is better than Newton? Kuhn proposed **Shared Epistemic Values**.

  He argued that while there is no *algorithm* for theory choice, there are *values* that all scientists share, even if they weigh them differently during a revolution. These include:
  1.  **Accuracy** (empirical adequacy)
  2.  **Consistency** (internal and external)
  3.  **Scope** (how much does it explain?)
  4.  **Simplicity**
  5.  **Fruitfulness** (does it open new puzzles?)

  **The Nuance:** During a crisis, Newtonians and Einsteinians might agree on these values but disagree on which theory satisfies them. The Newtonian might value *consistency* with established mechanics more; the Einsteinian might value *scope* regarding light.
  *   **Journalistic Fix:** Don't write "There was no rational way to choose." Write "There was no algorithmic way to choose; the decision relied on professional judgment regarding shared values like scope and accuracy."

  ### 5. Saving Progress (The Anti-Relativist Move)
  This is where you correct the "science doesn't progress" error. Kuhn abandoned the idea that science progresses toward "The Truth" (convergent realism). He knew he couldn't prove we are getting closer to God's eye view.

  Instead, he redefined progress as **increasing specialization and puzzle-solving efficiency.**
  *   Later theories are not necessarily "truer" in a metaphysical sense.
  *   Later theories are **more precise instruments** for interacting with nature.
  *   **Analogy:** Evolution. Evolution doesn't progress toward "perfect organisms," but later organisms are often better adapted to their specific niche than ancestors. Similarly, modern science is better adapted to solving modern puzzles than Aristotelian physics was.

  ### Summary for your next piece
  If you need a paragraph to replace the old hand-waving, try something like this:

  > "When Thomas Kuhn introduced the idea of 'incommensurability,' he was often misunderstood to mean that competing scientific theories are like mutually unintelligible languages, making rational progress impossible. In his later work, Kuhn corrected this. He argued that incommensurability is local, not global: it refers to specific clusters of concepts (like 'mass' or 'species') that cannot be perfectly translated between theories because their categorical boundaries have shifted. However, because scientists share underlying values—such as accuracy, consistency, and predictive scope—they can still compare theories rationally. Science progresses not necessarily by converging on a final 'Truth,' but by developing increasingly specialized and effective tools for puzzle-solving."

  ### Key Takeaways for Precision
  1.  **Drop "Worldview":** Use "Lexical Taxonomy" or "Categorical Structure."
  2.  **Drop "Irrational":** Use "Non-algorithmic." (Choices are rational, just not computable).
  3.  **Drop "No Progress":** Use "No convergence to Truth, but increasing puzzle-solving efficiency."
  4.  **Incommensurability = Translation Failure:** It does not mean Comparison Failure.

  This positions you as someone who has read *The Road Since Structure*, not just the back cover of *The Structure of Scientific Revolutions*.
