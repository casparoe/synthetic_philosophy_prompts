answer: |-
  This is a fantastic observation, and you have hit on one of the most direct intellectual lineages in modern moral philosophy. You are absolutely right: Henry Sidgwick is essentially the "godfather" of the time-neutrality argument that underpins Longtermism.

  In *The Methods of Ethics* (1874), Sidgwick famously writes:

  > "Hereafter as such is to be regarded neither less nor more than Now... the mere difference of priority and posteriority in time is not a reasonable ground for having more regard to the consciousness of one moment than to that of another."

  This is the exact axiom Will MacAskill and Toby Ord use to launch the Longtermist argument. If you don't discount the future, and the future is potentially vast, the math dictates that the future outweighs the present.

  However, if you plopped Sidgwick into 2025, his reaction would likely be a mix of **strong philosophical agreement** and **sharp empirical skepticism**. He wouldn't reject the *logic*, but he might reject the *application*. Here is how a Sidgwickian critique of modern Longtermism would likely break down.

  ### 1. He would agree on the Principle (The "Value" Argument)
  Sidgwick would validate the core EA/Longtermist claim that **pure time discounting is irrational.** He would agree that a happy life in the 22nd century has the exact same intrinsic value as a happy life in the 21st century.

  He would likely nod along as MacAskill explains that we shouldn't ignore future people just because they don't exist *yet*. For Sidgwick, the "Point of View of the Universe" requires us to be impartial spectators. To favor the present simply because it is the present is a form of bias akin to favoring yourself over others (egoism) or your country over others (nationalism).

  So, on the *axiological* question (how we measure value), Sidgwick is 100% on board.

  ### 2. He would push back on Uncertainty (The "Probability" Argument)
  This is the crucial distinction your teacher glossed over, and it is where Sidgwick might part ways with the more speculative wings of Longtermism.

  Sidgwick distinguishes between **discounting value** (which he rejects) and **discounting probability** (which he accepts).
  *   **Value:** A unit of happiness in 3025 is worth the same as a unit in 2025.
  *   **Probability:** We are much less *sure* that our actions today will actually result in that happiness in 3025.

  Sidgwick was a rigorous empiricist. In *The Methods of Ethics*, he emphasizes that our duty is to maximize *expected* utility, not just theoretical utility. He would look at arguments regarding AI extinction risk and ask: *What is the epistemic status of these claims?*

  If the probability of extinction is low, or if the causal chain between "donating to AI safety now" and "trillions of future lives saved" is tenuous, Sidgwick would argue that the **expected value** drops. He might worry that Longtermists are conflating the *magnitude* of the future (trillions of lives) with the *probability* of influencing it. He would demand much higher standards of evidence before diverting resources from concrete, present-day suffering (where the causal link is clear) to speculative future risks.

  ### 3. The "Common Sense" Constraint
  One of Sidgwick's unique projects was trying to reconcile Utilitarianism with "Common Sense Morality." He noticed that if Utilitarianism demands things that are too repugnant to common intuition, people will reject the system entirely.

  Prioritizing a statistical future person over a dying child in front of you is a classic objection to Utilitarianism. Sidgwick was aware that humans are psychologically constituted to care more about the near and the visible.

  He might argue that a moral system that demands we ignore palpable present suffering for abstract future gains is **psychologically unsustainable**. If the "Point of View of the Universe" is too alien to human nature, it fails as a practical method of ethics. He might worry that Longtermism, taken to the extreme, creates a morality that no one can actually follow, leading to hypocrisy or burnout.

  ### 4. Institutional Stability and Progress
  Sidgwick was a Victorian; he cared deeply about social order, institutions, and gradual progress. He believed that securing the future often depends on maintaining a stable, just, and flourishing present.

  He might argue that neglecting present-day suffering (poverty, disease, injustice) could destabilize society, making the very future Longtermists want to save *less* likely to happen. For Sidgwick, building robust moral and political institutions *now* might be the best way to ensure a good future, rather than betting on specific technological interventions (like AI alignment) that might fail. He would likely favor a "robust good" approach over a "maximal good" approach if the latter carries high risks of social disruption.

  ### 5. The Dualism of Practical Reason
  Finally, there is a darker element of Sidgwick's thought. He famously concluded *The Methods of Ethics* with a pessimistic note: the "Dualism of Practical Reason." He couldn't find a rational way to prove that being moral (Utilitarian) always aligns with being rational (Self-Interested).

  Sidgwick might look at the demands of Longtermism—which can require immense personal sacrifice for a goal you will never see—and worry that it exacerbates this dualism. If the moral demand is too high (i.e., "you must sacrifice your life quality to mitigate a risk that might not happen for 100 years"), rational agents will simply opt out. Sidgwick might prefer a version of Utilitarianism that is more "human-sized," even if it theoretically sacrifices some total utility.

  ### The Verdict: A Sympathetic Critic
  If Sidgwick saw how his argument was being used in 2025:

  1.  **He would validate the math:** He would agree that *if* we can be certain about the future, the numbers game favors Longtermism.
  2.  **He would question the inputs:** He would be deeply skeptical of our ability to *know* the future well enough to justify neglecting the present. He would likely argue that **uncertainty discounting** should be very high when dealing with speculative technologies like AGI.
  3.  **He would warn against moral overreach:** He would caution that a morality which ignores the "Common Sense" duty to help those immediately in front of us risks losing its authority and practical power.

  In short, Sidgwick would probably be an **Effective Altruist**, but perhaps a cautious one. He would likely support reducing existential risk, but not at the *total* expense of near-term welfare. He would insist that the "Point of View of the Universe" must be viewed through the limited, fallible eyes of human beings in 2025, and those eyes see the present much more clearly than the future.

  **For your essay/class discussion:** If you want to impress your teacher, look up Sidgwick's distinction between the **"rationality of benevolence"** (which supports Longtermism) and the **"limits of human foresight"** (which constrains it). That is the exact tension point between 19th-century Utilitarianism and 21st-century Longtermism.
