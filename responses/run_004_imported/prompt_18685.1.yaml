      *   *Point 1: The Logical Gap.* You can't prove a bridge principle between formal and informal using only formal tools. It's a category error.
      *   *Point 2: The Empirical/Physical Premises.* Turing's analysis assumes limits on human memory/perception. These are contingent. If physics allows hypercomputation, CTT fails as a claim about *physical* computability, though holds for *human* computability.
      *   *Point 3: Refinements are possible.* Gandy showed Turing's original analysis was insufficient for parallelism. If it were a proof, it wouldn't need patching.
