answer: |-
  This is an excellent pedagogical moment, and your student is right to press you. She has correctly identified that the warrant for believing the Church-Turing Thesis (CTT) is as strong as the warrant for many things mathematicians call "established." However, she is conflating **epistemic certainty** with **logical status**.

  You are not mistaken to maintain the distinction, but your initial defense ("it's informal") is indeed too shallow if left at that. It sounds like a bureaucratic rule rather than a philosophical insight. To satisfy a sharp graduate student, you need to explain why Turing's analysis, however compelling, does not constitute a *mathematical proof* in the strict sense, and why that distinction matters for the philosophy of computation.

  Here is a structured way to respond to her, distinguishing between the *strength of the argument* and the *modal status of the claim*.

  ### 1. The Structure of Turing's Argument vs. Mathematical Proof
  The student's core claim is that Turing provided a proof. To show why this is a category mistake, you must analyze the logical structure of Turing's 1936 argument.

  A mathematical proof derives a conclusion from axioms using rules of inference. Turing's argument does not do this. Instead, it has the following structure:
  1.  **Premise 1 (Conceptual/Empirical):** Any human "computer" (clerk) is subject to certain physical and cognitive constraints (e.g., can only distinguish finitely many symbols, can only change a bounded amount of information in one step, has a finite number of states of mind).
  2.  **Premise 2 (Mathematical):** Any process subject to constraints P1, P2, P3... can be simulated by a Turing Machine.
  3.  **Conclusion:** Therefore, any effectively calculable function is Turing-computable.

  **The Gap:** Premise 1 is not a mathematical axiom. It is a claim about human psychology, physiology, or the nature of symbolic representation. It is a *philosophical analysis* of the concept "effective procedure."

  If Premise 1 is contingent (e.g., dependent on the nature of human brains or the physics of our universe), then the conclusion is contingent. Mathematical theorems are necessary truths (within their system). If CTT rests on premises that could conceivably be false (e.g., if we discovered a physical system that computes non-recursive functions), it cannot be a theorem.

  **Response to the student:** Turing did not prove that "Effective = Recursive." He proved that "If computation satisfies constraints X, Y, and Z, then Effective = Recursive." The work is in justifying X, Y, and Z. That justification is philosophical, not mathematical.

  ### 2. The "Open Texture" of Informal Concepts
  You can deepen this by introducing the notion of **open texture** (a term from Friedrich Waismann, often applied here by philosophers like Wilfried Sieg and Stewart Shapiro).

  Mathematical concepts (like "prime number" or "continuous function") are closed; their boundaries are fixed by definition. Informal concepts (like "effective procedure," "knowledge," or "cause") have an open texture. We know the paradigm cases, but the boundaries are negotiable.

  *   **Example:** In 1936, "computation" meant "what a human clerk does." Today, we might ask: "Is a quantum process that collapses a wavefunction to solve a halting-problem-equivalent task a 'computation'?"
  *   **The Consequence:** If we discover a physical process that intuitively feels like "calculating an answer" but exceeds Turing limits (hypercomputation), we face a choice:
      1.  Say CTT is false.
      2.  Say this process doesn't count as "effective computation."

  If CTT were a theorem, option 1 would be logically impossible. The fact that we can coherently debate this (e.g., regarding Malament-Hogarth spacetimes or analog computing) demonstrates that the link between the informal notion and the formal class is not a logical necessity, but a stipulation based on current understanding.

  **Response to the student:** A theorem closes inquiry; a thesis guides it. If we call CTT a theorem, we rule out the possibility of hypercomputation by definition. By keeping it a thesis, we acknowledge that our analysis of "effective procedure" is tied to our current understanding of physics and cognition, which could evolve.

  ### 3. Gandy's Refinement (The Analysis is Not "Done")
  A powerful historical argument against the student's view is that Turing's original analysis was actually *incomplete*, and this was discovered later.

  Robin Gandy (1980), in "Church's Thesis and Principles for Mechanisms," showed that Turing's original 1936 analysis applied specifically to *human* clerks. It did not automatically rule out parallel machines or machines with different physical constraints. Gandy had to formulate new principles (Gandy Machines) to extend the thesis to mechanical devices more generally.

  **Response to the student:** If Turing's 1936 argument were a mathematical proof, it would be final. It would not require patching by Gandy 40 years later to account for parallelism. The fact that the *analysis* of the informal notion is still being refined (e.g., in discussions of interaction machines or real-number computation) proves that the bridge between the informal and formal is not a fixed logical deduction.

  ### 4. The Danger of "Proof by Triangulation"
  The student argues that convergence of three formalisms (Turing, Church, Gödel) plus one analysis equals proof. This is a strong *inductive* argument, but not a *deductive* proof.

  *   **Extensional Equivalence:** Showing that Turing Machines, Lambda Calculus, and General Recursive functions define the same class of functions is a **theorem**. (We can prove $TM = \lambda = GR$).
  *   **The Thesis:** Claiming that this class *exhausts* the informal notion of "effective calculability" is the **thesis**.

  You can have perfect extensional equivalence among formalisms and still miss the informal target. Imagine if all three formalisms happened to miss a class of functions that humans can intuitively compute (e.g., via some non-algorithmic insight). The equivalence of the formalisms wouldn't catch that error. Only the link to the informal notion matters there, and that link is not subject to formal proof.

  ### 5. Why This Matters Pedagogically
  Finally, explain to the student *why* we insist on the terminology. It is not empty scruple; it preserves the philosophical space.

  1.  **It distinguishes math from philosophy:** It reminds students that logic operates within formal systems, but the *application* of logic to the world involves philosophical assumptions.
  2.  **It allows for critique:** If CTT is a theorem, questioning it is akin to questioning $2+2=4$. If it is a thesis, questioning it is akin to questioning the axioms of geometry. The latter is a legitimate philosophical activity.
  3.  **It clarifies the nature of analysis:** It teaches students that conceptual analysis (breaking down "effective procedure") is different from derivation. Analysis can be persuasive without being demonstrative.

  ### Summary for the Classroom
  You might tell your student:

  > "You are right that the *warrant* for accepting the Church-Turing Thesis is as strong as almost anything in mathematics. Turing's analysis is incredibly robust. However, a 'proof' in logic requires deriving a conclusion from axioms within a formal system.
  >
  > Turing's argument relies on premises about the limits of human cognition and physical symbol manipulation (e.g., that we can only distinguish finitely many symbols). These are plausible conceptual claims, but they are not logical axioms. They are subject to revision if our understanding of physics or cognition changes (as seen in debates about hypercomputation).
  >
  > By calling it a 'Thesis,' we acknowledge that it is a bridge principle between the formal and the informal. Calling it a 'Theorem' would imply that the informal notion of 'effective procedure' has been fully captured by logic alone, which closes off legitimate philosophical inquiry into the nature of computation. We keep the distinction not because we doubt the truth of the claim, but because we respect the difference between mathematical derivation and conceptual analysis."

  This validates her insight (the warrant is strong) while correcting her categorization (the logical status is different), giving her the principled distinction she was looking for.
