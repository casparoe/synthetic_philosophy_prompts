prompt: |-
  I teach the philosophy of computability as part of a graduate logic sequence, and an exchange with a sharp student this term has left me genuinely unsure what to say the next time the topic comes up. The standard story I give is this: Turing's machine model, Church's lambda calculus, and the general recursive functions developed by Gödel and Kleene were each motivated independently, then proved extensionally equivalent, and Turing additionally supplied a direct argument — via his analysis of what a human clerk mechanically following fixed instructions, equipped with only finitely many recognizable symbol-configurations and states of mind, could accomplish — for why no wider notion of an "effective procedure" could escape this class. My student's response was that this is a strange thing to still call a "thesis." On her view, once three independently motivated formal systems converge on a single extension, and you additionally have an argument, like Turing's, that engages the informal notion directly rather than just cross-checking formalisms against one another, you have exactly the kind of triangulation that mathematics treats as a proof everywhere else. She takes the continued insistence that the Church-Turing thesis remains a well-supported conjecture, forever short of the status of a theorem, to be either an empty terminological scruple or a holdover from before Turing's argument was fully appreciated.

  I would genuinely like to know why she is mistaken, if she is. Kleene, in coining the term "Church's thesis," clearly meant to mark it off from anything provable, and most subsequent writers on the philosophy of computability have followed him in denying that such a proof exists or could exist — but on the spot, I could not reconstruct a principled reason for this that did not simply restate the fact that "effectively calculable" is an informal notion, which sounds uncomfortably close to declaring the thesis unprovable by definitional fiat. Is there a real argument, distinct from Turing's own, for why extensional convergence plus Turing's analysis still falls short of a mathematical proof of the thesis? And does that argument also explain why no future analysis of this kind, however careful, could ever close the gap?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **User:** A philosophy instructor teaching a graduate logic sequence.
      *   **Context:** An exchange with a sharp student about the status of the Church-Turing Thesis (CTT).
      *   **Student's Position:** CTT *is* effectively proven. We have convergence of three formalisms (Turing, Church, Gödel/Kleene) + Turing's conceptual analysis of "effective procedure." This triangulation counts as proof in mathematics. Calling it a "thesis" is a terminological scruple or historical artifact.
      *   **Instructor's Position (Standard):** CTT is a thesis/conjecture, not a theorem. "Effectively calculable" is informal, so it can't be formally proved.
      *   **Instructor's Problem:** Feels the standard response ("it's informal") sounds like definitional fiat. Wants a *principled argument* for why CTT cannot be a theorem, distinct from just restating the informal/formal gap. Wants to know if the student is mistaken and why.
      *   **Goal:** Provide a robust philosophical and mathematical justification for maintaining the distinction between CTT as a thesis vs. a theorem, addressing the student's "triangulation" argument.

  2.  **Deconstruct the Student's Argument:**
      *   *Premise 1:* Three independent formalisms converge extensionally.
      *   *Premise 2:* Turing provided a conceptual analysis linking the informal notion to one formalism.
      *   *Conclusion:* This constitutes a mathematical proof (or equivalent warrant).
      *   *Underlying Assumption:* Mathematical proof is about sufficient warrant/triangulation, not just formal derivation.

  3.  **Identify the Core Philosophical Issue:**
      *   The core issue is the relationship between *conceptual analysis* and *mathematical proof*.
      *   Is CTT an empirical claim? A conceptual claim? A mathematical claim?
      *   Why can't conceptual analysis yield a theorem?

  4.  **Brainstorming Counter-Arguments (Why the Student is Mistaken/Incomplete):**
      *   **The Informal/Formal Gap:** The standard view. "Effectively calculable" isn't a mathematical predicate. You can't derive $P \to Q$ if $P$ isn't in the language. *Critique:* Student knows this, finds it fiat. Need to deepen this.
      *   **The Nature of Turing's Analysis:** Turing's argument isn't a formal proof; it's a philosophical argument about physics/psychology/cognition. It relies on premises about human limitations (finite states, finite symbols). What if those premises are wrong? (e.g., hypercomputation, analog computing, quantum mechanics).
      *   **Open Texture of Concepts:** "Effective procedure" might evolve. New physical models might challenge our intuition. Proof implies necessity; CTT might be contingent on the physical world.
      *   **Gandy's Machine Principle:** Robin Gandy refined Turing's analysis. If it were a proof, why do we need refinements? The fact that we can argue *about* the analysis shows it's not settled like a theorem.
      *   **Model-Theoretic vs. Conceptual:** Mathematical proofs happen *within* a model or theory. CTT bridges the theory and the meta-theory (or the world).
      *   **The "Proof" Analogy:** In math, when we say "we have proved X," we mean derived from axioms. When we say "we have proved CTT," we mean "we are very confident." Confusing these categories is dangerous for logic students.

  5.  **Structuring the Response:**
      *   **Validate the Student:** Acknowledge her insight. She's right that Turing's analysis is incredibly strong. It's not *just* a guess.
      *   **Distinguish Types of "Proof":** Differentiate between *formal derivability* and *philosophical warrant*.
      *   **Argument 1: The Category Mistake (Informal vs. Formal):** Deepen the standard view. It's not just "it's informal." It's that the informal notion lacks the precision required for logical consequence.
      *   **Argument 2: The Contingency of the Analysis:** Turing's argument relies on physical/psychological constraints (finite brain states, discrete symbols). These are empirical/conceptual claims about the world/us, not logical truths. Hypercomputation scenarios (e.g., Malament-Hogarth spacetimes) show the analysis isn't logically necessary.
      *   **Argument 3: The Open Texture of Concepts:** Concepts evolve. If we discover a physical process that computes non-recursive functions intuitively, do we reject the process or the thesis? This flexibility shows it's not a theorem.
      *   **Argument 4: Pedagogical/Methodological Importance:** Why does it matter? Keeping the distinction preserves the ability to question the boundaries of computation (e.g., in philosophy of mind, physics).
      *   **Conclusion:** The student is right about the *strength of the warrant* but wrong about the *logical status*.

  6.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Avoid:* Just saying "Kleene said so."
      *   *Focus:* On the *modal status* of the claim. Theorems are necessary truths (within the system). CTT links a modal notion (possibility of calculation) to a formal class.
      *   *Key Distinction:* Turing's argument is a *reduction* of the intuitive notion to the formal one, based on plausible premises. A proof requires the premises to be axiomatic. The premises of Turing's analysis (e.g., "a human can only distinguish finitely many symbols") are not axioms of logic; they are claims about human cognition/physics.
      *   *Reference:* Mention Gandy (1980) "Church's Thesis and Principles for Mechanisms." He shows Turing's analysis needs extra assumptions for parallel machines, etc. This proves the analysis isn't "done."
