answer: |-
  This is a fantastic observation, and you have stumbled onto something that keeps philosophers of language and law awake at night. You are asking whether there is a "fact of the matter" about a shared rule when the applications of that rule have always overlapped, and whether this ambiguity is a bug or a feature of human agreement.

  Here is the short answer: **No, there is no fact about who was "right" about the past agreement, and yes, this is the normal condition of almost every rule people follow.**

  Here is the longer breakdown of why your intuition is correct, why it feels so unsettling, and why society doesn't collapse because of it.

  ### 1. The Verdict on "Right vs. Wrong"
  In terms of **etiquette**, there is a conventional answer. In the U.S., tipping etiquette generally dictates that you tip on the pre-tax subtotal. Tax is a government levy, not a cost of service, so the server didn't "earn" that portion of the bill. So, technically, you were following the stricter social norm.

  But in terms of **the agreement between you and your partner**, there is no fact of the matter.

  An agreement is a meeting of minds. For six years, your minds met on the concept "We tip 20%." They did *not* meet on the concept "We tip 20% of the pre-tax subtotal" vs. "We tip 20% of the post-tax total." Because that specific variable was never tested, it was never part of the agreement.

  Think of it like two people agreeing to meet at "the bank." One goes to the river bank, the other to the financial bank. If they live in a town where the financial bank is built on the edge of the river, they might meet at the same spot for years without realizing they had different definitions of "bank." When the river floods, suddenly they aren't meeting. Was one "right" about where they agreed to meet? No. The agreement itself was underspecified.

  ### 2. The Philosophical Rabbit Hole (You're in Good Company)
  Your suspicion that this applies to "basically any rule two people think they share" is a recognized philosophical problem known as the **Rule-Following Paradox**, most famously associated with Ludwig Wittgenstein and later Saul Kripke.

  The paradox asks: How do I know that when I learned the rule for "addition," I didn't actually learn a rule called "quus"?
  *   **Plus (+):** Works normally for all numbers.
  *   **Quus (⊕):** Works like plus for all numbers *up to a certain point*, but then changes the output for huge numbers I've never calculated before.

  Since I have only ever added finite numbers, all my past behavior is consistent with *both* rules. There is no fact in my past history that proves I meant "plus" and not "quus" until I actually encounter the huge number.

  Your dinner bill is the "huge number." For six years, your low local tax rate meant that `20% of Subtotal` and `20% of Total` rounded to the same integer dollar amount. Your behavior was consistent with both interpretations. The vacation tax rate was the edge case that prised the interpretations apart.

  So, your unease is philosophically justified. **No rule contains its own application.** A rule is just words (or an unspoken understanding); the *application* of the rule requires a new judgment call in every new context.

  ### 3. Why This Is the Normal Condition
  You asked if this is a fluke. It is not. It is the standard operating procedure of human society.

  Most shared rules are **heuristics**, not algorithms. They are "good enough" alignments that function smoothly within a specific context (your home city, your income bracket, your usual tax rate). We rely on what linguists call **common ground**—the assumption that the other person fills in the unspecified details the same way we do.

  This happens everywhere:
  *   **"Be home by 10."** Does that mean walk through the door at 9:59, or be parked in the driveway? Usually, it doesn't matter until one night it does.
  *   **"Split the bill evenly."** Does that include the cocktail you had but I didn't? Usually, we ignore small discrepancies until someone orders a bottle of wine.
  *   **"Dress casual."** To a tech worker, that's a hoodie. To a banker, that's a blazer without a tie.

  Society works not because we have identical internal definitions of rules, but because **the variance usually doesn't matter.** We operate within a "zone of tolerance." Your six-year tipping streak wasn't a illusion; it was a successful coordination game that lasted until the environment pushed you outside the zone of tolerance.

  ### 4. Why It Feels So Unsettling
  It bugs you because it threatens the idea of **shared reality**. We like to think that when we agree on something, we are locking in a fixed object—a contract, a truth, a shared mental model.

  Realizing that the "object" was actually two different objects that just looked the same in low-resolution light makes agreements feel fragile. It suggests that we are never truly inside another person's head, and that conflict isn't necessarily a betrayal of the rules, but simply the discovery that the rules were never as shared as we thought.

  ### 5. How to Resolve It (Without Losing Your Mind)
  The mistake is looking backward for a fact that doesn't exist. You are asking, "What *did* the rule mean?" when the only functional question is, "What *will* the rule mean?"

  Agreements between people are not archaeological digs; they are living negotiations.
  *   **The Past:** There is no truth to be found. You both acted in good faith based on a vague signal. Neither of you broke the agreement, because the agreement didn't cover this scenario.
  *   **The Future:** Now that the ambiguity is exposed, you have the chance to make the rule more robust. "Okay, clearly we define this differently. Let's agree: pre-tax subtotal, always."

  ### Summary
  You aren't crazy, and this isn't a fluke. **Ambiguity is the default state of human communication.** We survive because most of the time, the ambiguity doesn't change the outcome.

  There is no fact about who was "right" for the past six years, because the "truth" of a social agreement is found in its successful coordination, not its semantic precision. For six years, you coordinated successfully. The fact that you used different algorithms to get there is irrelevant to the success of the partnership, even if it is relevant to the math.

  The takeaway isn't that agreements are meaningless; it's that they require maintenance. You've just found a bug in your code. Patch it, update the protocol, and keep running the program.
