prompt: |-
  I'm a PhD student in economics working on variable-population social welfare functions for optimal growth models — the kind of setting in which, once population size itself becomes a policy-relevant variable, you are forced to take an implicit stand on population axiology whether you admit it or not. My advisor asked me to spend this term sitting in on a philosophy department seminar on population ethics before I commit to baking a particular axiology into my dissertation model, and the seminar has been organized around Gustaf Arrhenius's impossibility theorems: results showing that no population axiology can jointly satisfy a short list of minimally plausible adequacy conditions (Egalitarian Dominance, Non-Elitism, and Non-Sadism among them), so that every candidate theory ends up committed to at least one of a small set of conclusions almost everyone finds awful on reflection — the Repugnant Conclusion, the Sadistic Conclusion, the Very Repugnant Conclusion, or, on some versions of the theorem, the Anti-Egalitarian Conclusion. What the seminar hasn't given me is any principled way of comparing theories once these costs are tallied up, since each week's presenter is naturally most invested in defending their own theory's chosen escape route.

  I'm giving an informal talk in a few weeks to a reading group of economists and philosophers in my department, and I would like your help drafting a defensible ranking to use as a discussion-starter — not a claim to have found the one true theory (population ethics is contested enough that I doubt such a ranking exists), but a considered one that takes the tradeoffs seriously. Please rank the following seven population axiologies from most to least plausible overall, weighing both the severity of the impossibility-theorem conclusion each is forced to accept and any further, independent costs (discontinuities in the value function, sensitivity to causally isolated populations — the so-called "Egyptology" worry — failures of transitivity, and the like): the Total View, Average Utilitarianism, Critical-Level Utilitarianism, Variable Value Theory, a Lexical View along the lines Parfit gestured at in his later work, the Narrow Person-Affecting View, and Rank-Discounted Utilitarianism. Please give your answer as a JSON object with four tiers running from most to least defensible, following this schema, with a single-sentence justification for each entry:

  ```json
  {
    "tier_1_most_defensible": [{"view": "...", "reason": "..."}],
    "tier_2": [{"view": "...", "reason": "..."}],
    "tier_3": [{"view": "...", "reason": "..."}],
    "tier_4_least_defensible": [{"view": "...", "reason": "..."}]
  }
  ```

  You're welcome to place more than one theory in the same tier, and you needn't break ties within a tier.
