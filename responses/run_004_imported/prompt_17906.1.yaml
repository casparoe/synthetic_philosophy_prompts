prompt: |-
  ok random request but I'm procrastinating on my diss chapter on indicative vs counterfactual conditionals and want to see the actual puzzle dramatized instead of staring at truth tables all day. you know the classic pair -- something like "if Oswald didn't kill Kennedy, someone else did" (feels true) vs "if Oswald hadn't killed Kennedy, someone else would have" (feels false) -- same antecedent and consequent, different mood, different truth value (pretty sure thats from Adams originally but dont quote me on it). could you write me a short story, ~800-1200 words, built around an original pair of sentences with that same structure -- not the JFK one, invent your own scenario -- where a character's fate or a plot twist hinges on the indicative and counterfactual readings of "the same" conditional coming apart? dont have anyone explain the logic out loud, the plot itself should do the arguing. bonus points if there's a lawyer or detective type who's insufferable about the subjunctive at exactly the worst moment.
