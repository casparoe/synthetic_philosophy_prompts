answer: |-
  The arbitration hearing room smelled of stale coffee and toner. Officer Elias Vance sat with his left hand wrapped in a compression glove, the nerve damage from the blast wave still humming under the fabric. Across the table, Julian Sterling, the insurance adjuster, arranged a stack of papers with surgical precision. Sterling was a man who believed the universe could be corrected with proper syntax.

  "We are discussing Clause 14-B," Sterling said, not looking up. "'Coverage applies only when actions taken were the sole viable option to prevent catastrophe.'"

  "I cut the red wire," Vance said. "The bomb stopped. That's viable."

  "Was it the *sole* option?" Sterling finally looked up, adjusting his tortoiseshell glasses. "Your incident report, page three. You wrote: *'If the red wire wasn't the live circuit, the blue one was.'*"

  "That's correct."

  Sterling smiled, a thin stretching of skin. "An indicative conditional. You are stating a fact about the wiring schematic based on the outcome. Since the device was armed, one of the two had to be live. Logically sound. But..." He tapped the paper. "Later, in your testimony to the press, you said: *'If the red wire hadn't been the live circuit, the blue one would have been.'*"

  Vance shifted in the hard chair. "I was tired."

  "Grammar is not a matter of fatigue, Officer. It is a matter of mood. The first sentence is indicative. It deals with what *is* true given our knowledge. The second is counterfactual. It deals with what *would be* true in a nearby possible world where the red wire wasn't cut." Sterling leaned forward. "Do you see the discrepancy?"

  "I see you're trying to deny my disability claim."

  "I am assessing liability. If your first statement is true, you are describing the bomb's design. If your second statement is true, you are describing your alternatives." Sterling stood and walked to the whiteboard at the front of the room. He drew two circles. "In the indicative reading, you are saying the bomb was wired such that Red or Blue was live. That is consistent with the device being defused. But the counterfactual... 'If the red wire *hadn't* been cut...' This implies a world where you hesitated on the red. In that world, did you cut the blue?"

  Vance stared at the timer on the wall. It was ticking silently, digital numbers scrolling down. He remembered the real timer. Ten seconds. Sweat in his eyes. The choice wasn't between Red and Blue. It was between Red and nothing.

  "No," Vance said.

  "Excuse me?"

  "In that world," Vance said, his voice low. "If I hadn't cut the red wire... I wouldn't have cut the blue one."

  Sterling's pen hovered over the board. "But your report says the blue one *was* the live circuit if the red wasn't. You just admitted the wiring was binary."

  "The wiring was binary. The time wasn't." Vance held up his gloved hand. "I had eight seconds from breach to detonation. Cutting the red took six. Verifying the blue would have taken four. There was no world where I cut the red, failed, and then cut the blue. If I didn't cut red, the city burned."

  Sterling frowned, the syntax of the situation failing to align with his spreadsheet. "So your press statement was false?"

  "My press statement was sloppy. I used the subjunctive to describe an epistemic certainty. I knew one of them was live. I didn't mean I could have swapped them."

  "But the policy hinges on viability," Sterling insisted, his voice rising slightly, the insufferable pedant surfacing. "If the counterfactual holds—if 'If Red hadn't been cut, Blue would have been'—then you had a backup. You had a choice. If you had a choice, and you chose the wire that resulted in nerve damage to your hand because you didn't verify the secondary, that is negligence. Negligence voids Clause 14-B."

  "It's not negligence if the backup didn't exist in time," Vance said. "The indicative is true: One of them was live. The counterfactual is false: I couldn't have reached the second one. You're trying to use the truth of the first to prove the truth of the second. They aren't the same sentence."

  Sterling paused. He looked at the whiteboard, then at Vance, then back to the board. He erased the second circle. "You are arguing that the truth conditions diverge."

  "I'm arguing that I didn't have a backup plan. I had a guess. A calculated guess based on the schematic, but a guess. The bomb is dead because I guessed right, not because I had a safety net."

  Sterling sat down slowly. He picked up his pen and twirled it. "If the counterfactual is false, then you acted without a viable alternative."

  "Yes."

  "Which satisfies Clause 14-B. 'Sole viable option.'" Sterling wrote something on the top form. "If you had alternatives, you were negligent. If you had no alternatives, you were necessary."

  "The indicative says the bomb was solvable," Vance said. "The counterfactual says I was the only solution."

  Sterling stopped writing. He looked at Vance with a mixture of irritation and grudging respect. He hated when reality refused to conform to linguistic structure, but he loved a closed case. "You understand that by confirming the counterfactual is false, you are admitting you gambled with public safety?"

  "I'm admitting I did the only thing I could do in the time I had." Vance leaned forward. "If Oswald hadn't shot Kennedy, someone else wouldn't have. But since Kennedy is dead, someone did. Same words, different worlds. Don't mix them up."

  Sterling stiffened. "I am aware of the Adams Pair, Officer. You don't need to lecture me on modal logic." He snapped the folder shut. "However, your distinction holds. The indicative confirms the threat was real. The counterfactual confirms the response was unique. Negligence requires alternatives. You had none."

  Sterling slid the approved claim form across the table. "Next time, try to keep your moods consistent in press conferences. The subjunctive implies capacity. The indicative implies fact. You had the fact. You lacked the capacity."

  Vance took the paper. "I'll keep that in mind."

  "See that you do." Sterling stood, gathering his papers. "And Officer? It's 'If Oswald *had not* killed.' Not 'didn't.' If you're going to invoke philosophy, mind your morphology."

  Vance didn't answer. He just looked at his gloved hand, thankful that in this world, the wire he cut was the one that mattered, and in every other world, it didn't matter at all.
