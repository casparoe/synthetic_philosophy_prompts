      *   **Theo's Position:** Frankfurt cases fail because of the Widerker/Ginet dilemma (the "prior sign" objection). Either the sign is deterministic (smuggling in determinism) or it isn't (leaving alternative possibilities open).
      *   **User's Position:** Buffer cases (Mele & Robb) avoid this because there's no prior sign; there's a causally isolated backup process.
