prompt: |-
  I sit on the internal governance committee for Meridian Analytics' employee forecasting platform, a Hanson-style subsidized prediction market that leadership built with the standard no-trade-theorem worry already in mind: if everyone shares a common prior and reasons like a good Bayesian, a colleague's willingness to take the other side of your bet should, per Aumann, already tell you your apparent information edge is illusory, so without a subsidized market maker absorbing the other side there might be no volume at all. Lately the platform's most actively traded contract asks whether the Atlas project will ship on schedule, and its largest and most consistently profitable trader is Priya, a senior engineer who also sits on the review board that grants schedule extensions -- she is, in effect, trading on private information her own board generates. Several other employees have quietly stopped trading Atlas contracts, reporting in exit surveys that a large Priya position now reads as an announcement that the question is already settled, and contract volume has fallen by more than half since the pattern became visible. Our written trading policy requires only that positions "reflect good-faith, individually held beliefs" and says nothing about board members trading on matters within their own purview. Please draft the committee's decision memo recommending a specific, adoptable policy on insiders trading on markets that touch their own institutional authority -- with a concrete rule and a timeline for next week's meeting -- and give a candid account of what the platform's core purpose would lose if Priya's trading were restricted.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Meridian Analytics' employee forecasting platform (Hanson-style subsidized prediction market).
      *   **Problem:** Priya, a senior engineer on the review board granting schedule extensions, is trading heavily on the "Atlas project ship date" contract. She has private information from her board role.
      *   **Consequence:** Other employees have stopped trading (volume down >50%) because Priya's position signals "game over" (adverse selection).
      *   **Current Policy:** Vague ("good-faith, individually held beliefs"), silent on insiders/board members.
      *   **Task:** Draft a committee decision memo recommending a specific policy on insiders trading on markets within their authority.
      *   **Requirements:**
          *   Specific, adoptable policy rule.
          *   Timeline for next week's meeting.
          *   Candid account of what the platform loses if Priya's trading is restricted (the trade-off).
      *   **Tone:** Professional, analytical, governance-focused, acknowledging the economic theory (Aumann, no-trade theorem, Hanson).

  2.  **Deconstruct the Economic & Ethical Tension:**
      *   *The Problem:* Adverse Selection / Information Asymmetry. Priya has non-public information (NPI) derived from her fiduciary role. In a standard market, this is insider trading. In a prediction market, it's supposed to aggregate information. However, if the information is *too* asymmetric (she *decides* the outcome), the market stops being a forecasting tool and becomes a payout mechanism for her. It kills liquidity (the "no-trade" result in practice, even if the theory says subsidies should fix it).
      *   *The Trade-off:* If we ban Priya, we lose the *most accurate* signal. She knows the truth. The market price *should* reflect her knowledge. If we let her trade, we lose *liquidity* and *participation*, which destroys the market's ability to aggregate *other* people's information (e.g., supply chain issues, morale, external dependencies she might miss).
      *   *The Goal:* Restore liquidity while preserving information aggregation.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue (Priya's trading), the impact (volume drop), and the recommendation (restricted trading window/disclosure).
      *   **Background:** Summarize the Atlas contract situation, the current policy gap, and the observed market behavior (volume drop).
      *   **Analysis of the Conflict:**
          *   *Why it's happening:* Priya isn't just predicting; she's influencing/deciding. This violates the "oracle" assumption of prediction markets.
          *   *The "No-Trade" Reality:* Theoretically, subsidies should encourage noise traders. Practically, rational employees won't bet against a decision-maker with NPI.
      *   **The Trade-off (Candid Account):** This is a specific requirement. I need to explain *why* banning her hurts.
          *   Loss of Truth: Her trades move the price to the real probability fastest.
          *   Incentive Alignment: If she can't trade, she loses a financial stake in accuracy (though her reputation is already at stake).
          *   Information Leakage: If she can't trade, she might leak info informally.
      *   **Recommendation (The Policy):** Needs to be concrete.
          *   *Option A:* Total Ban. (Too blunt, loses info).
          *   *Option B:* Full Disclosure. (Better, but might still scare traders).
          *   *Option C:* Restricted Window/Blind Trust. (Complex).
          *   *Option D (Selected):* "Decision-Maker Embargo with Mandatory Disclosure." If you have voting power on the outcome, you cannot trade *until* the decision is locked, OR you must trade through a delayed disclosure mechanism.
          *   *Refinement:* Actually, the best balance for a corporate prediction market is usually **Disclosure + Position Limits**. If everyone *knows* she is in, they can price it in. But the prompt says they *know* and are leaving. So disclosure isn't enough.
          *   *Better Refinement:* **The "Oracle Exclusion" Rule.** Individuals with direct decision-making authority over the resolution criteria cannot hold positions *during* the deliberation period. They can trade before (based on public info) or after (irrelevant).
          *   *Wait, let's look at the Hanson angle:* Robin Hanson wants markets to *control* decisions (Decision Markets). If Priya is on the board, the market should perhaps inform *her*. If she trades, she's profiting from fiduciary info.
          *   *Proposed Policy:* **The Fiduciary Embargo.** Employees with direct approval authority over a contract's resolution event are prohibited from trading that contract during the active deliberation window.
      *   **Timeline:** Next week's meeting. Need prep time, legal review, announcement.
      *   **Conclusion:** Reiterate the balance between integrity and information.

  4.  **Refining the Policy Recommendation:**
      *   Simply banning her might drive the info underground.
      *   However, the prompt highlights that volume *has already collapsed*. The market is failing. The priority is restoring liquidity.
      *   *Policy:* "Material Authority Restriction." If you have voting power on the outcome, you are barred from trading.
      *   *Mitigation:* To capture her info, the committee should solicit her forecast *officially* without financial stakes, or use a "decision market" structure where her payout is tied to project success, not the bet.
      *   *Decision:* Stick to the trading restriction to save the market, but acknowledge the loss.

  5.  **Drafting the Content - Tone Check:**
      *   Needs to sound like an Internal Governance Committee.
      *   Needs to reference the specific economic concepts mentioned (Aumann, no-trade theorem, subsidies).
      *   Needs to be actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is banning Priya too harsh?
      *   *Counter:* The prompt says volume is down 50%. The market is dying. The "candid account" section is where I acknowledge the cost. The recommendation must save the market mechanism first.
      *   *Critique:* Is the timeline realistic?
      *   *Counter:* Next week's meeting. Draft policy by Wednesday, Legal review by Thursday, Vote next Monday.
      *   *Critique:* Did I address the "Hanson-style" aspect?
      *   *Counter:* Yes, by acknowledging the subsidy role and the aggregation purpose.

  7.  **Final Polish:** Ensure the distinction between "private information" (generally good for markets) and "fiduciary authority" (bad for markets) is clear. Priya isn't just informed; she is *causal*.

      *(Self-Correction on the "Candid Account"):* I need to make sure I don't just say "we lose accuracy." I need to explain *why* her trading was valuable despite the liquidity cost. It was a "truth serum." Without it, the market might become an echo chamber of hopeful engineers.

      *(Policy Specifics):* Let's make it a "Cooling-Off Period" or "Authority Embargo." Let's go with **The Fiduciary Embargo Policy**.

  8.  **Finalizing the Memo Structure:**
      *   Header.
      *   Purpose.
      *   Situation Analysis (The Priya Effect).
      *   Economic Impact (Liquidity vs. Accuracy).
      *   Recommendation (The Rule).
      *   Implementation Timeline.
      *   The Cost (Candid Account).

      *(Wait, one nuance)*: The prompt asks for a "candid account of what the platform's core purpose would lose." This needs to be prominent. I will put it before the recommendation to justify the difficulty of the decision.

      *(Refining the Policy)*: A total ban might be too strict if she recuses herself. Let's suggest: **Recusal or Embargo.** If you trade, you recuse from the board vote. If you vote, you cannot trade. This aligns incentives.

      *Actually, the prompt says she sits on the review board.* The company likely needs her on the board more than her trades. So the trading must go.

      *Okay, let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Internal Governance Committee, Meridian Analytics
  **FROM:** Governance Subcommittee on Market Integrity
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Fiduciary Authority and Trading Eligibility (The "Atlas Precedent")

  ### 1. Executive Summary

  The Meridian forecasting platform is currently experiencing a liquidity crisis driven by information asymmetry. Specifically, the "Atlas Project Ship Date" contract has seen trading volume decline by over 50% following the market's realization that Priya (Senior Engineer, Atlas Review Board) holds significant long positions. While current policy permits trading based on "good-faith, individually held beliefs," it fails to distinguish between *private information* (which markets should aggregate) and *fiduciary authority* (which determines outcomes).

  This memo recommends the immediate adoption of the **Fiduciary Embargo Policy**. This rule prohibits employees with direct decision-making authority over a contract's resolution event from holding positions in that contract during the deliberation window. We propose ratification at next week's committee meeting.

  ### 2. Situation Analysis: The "Priya Effect"

  Our platform operates on a Hanson-style subsidized model, designed to overcome the No-Trade Theorem by providing a liquidity backstop. Theoretically, subsidies encourage noise traders to participate, allowing informed traders to profit and reveal information.

  However, the Atlas contract demonstrates a failure mode not fully addressed by standard subsidy models: **Causal Insider Trading.**

  Priya is not merely an informed observer; she is a causal agent. Her board vote directly influences the resolution of the contract (the ship date). When the market observes Priya's position, they do not interpret it as a probability estimate; they interpret it as a *decision announcement*.
  *   **Market Reaction:** Rational employees, recognizing they cannot win against a decision-maker with non-public information (NPI), have exited the market.
  *   **Result:** The subsidy is being absorbed entirely by one trader without the benefit of information aggregation from the broader employee base. The market has ceased to function as a forecast and has become a compensation mechanism for board members.

  ### 3. Candid Assessment: What We Lose by Restricting Priya

  We must be clear-eyed about the cost of this recommendation. Restricting Priya's trading is not a net positive; it is a necessary trade-off to save market liquidity. If we implement the Fiduciary Embargo, the platform loses three critical assets:

  1.  **The "Truth Serum" Mechanism:** Currently, Priya's trades are the single most accurate predictor of the Atlas timeline. By banning her, the market price will likely drift toward the consensus of less-informed engineers, potentially creating a false sense of security or panic. We lose the fastest channel for hard truth to reach leadership.
  2.  **Incentive Alignment:** Financial stakes ensure that decision-makers care about the accuracy of their own projections. If Priya cannot trade, her financial incentive shifts from "predict accurately" to "manage perception." We risk decoupling her fiduciary duty from the market's reality check.
  3.  **Information Leakage Risk:** If Priya cannot monetize her information through the platform, she may have an incentive to leak it informally to favored colleagues ("shadow trading"). This creates a darker, unregulated insider market that we cannot monitor or subsidize effectively.

  Despite these losses, the collapse in volume indicates that the *aggregate* intelligence of the firm is being silenced to accommodate one trader. A prediction market with 50% less volume is statistically less robust than one that includes the decision-maker's info but excludes her trades.

  ### 4. Recommendation: The Fiduciary Embargo Policy

  We recommend amending the Trading Policy to include the following specific provision:

  **Section 4.1: Material Authority Restriction**
  > "Employees who possess direct voting or approval authority over the resolution criteria of a specific market contract (e.g., schedule extension boards, budget approval committees) are prohibited from holding open positions in that contract during the **Active Deliberation Window**.
  >
  > *   **Active Deliberation Window:** Defined as the period commencing when the matter is formally placed on the authority's agenda and concluding when the decision is publicly announced internally.
  > *   **Divestiture Requirement:** Affected employees must close existing positions within 48 hours of the window opening or recuse themselves from the decision-making body for that specific matter.
  > *   **Disclosure:** All positions held by employees with *indirect* influence (e.g., project contributors without voting rights) must be flagged with a 'Contributor' badge on the order book."

  **Rationale:** This rule forces a choice: *Govern or Trade.* It preserves the integrity of the market for the broader employee base while offering the insider a clear compliance path (recusal).

  ### 5. Implementation Timeline

  To address the liquidity bleed in the Atlas contract and prevent recurrence, we propose the following schedule leading up to next week's meeting:

  *   **Wednesday, Nov 1:** Legal & HR review of the "Material Authority" definition to ensure no conflict with employment contracts or compensation plans.
  *   **Thursday, Nov 2:** Private consultation with Priya. Explain the governance concern not as a punitive measure, but as a liquidity rescue mission. Offer her the option to recuse from the upcoming Atlas vote to maintain her position, or close the position to maintain her vote.
  *   **Friday, Nov 3:** Draft policy amendment circulated to Committee.
  *   **Monday, Nov 6 (Committee Meeting):** Vote on adoption.
  *   **Tuesday, Nov 7:** Platform-wide announcement. Positions in violation must be closed by EOD.

  ### 6. Conclusion

  The Hanson-style market relies on the diversity of priors. When one participant's prior is effectively a command, the diversity collapses. By enacting the Fiduciary Embargo, we acknowledge that while Priya's information is valuable, her *authority* is incompatible with market participation. We sacrifice her specific signal to save the market's capacity to aggregate the thousands of weaker signals that constitute the wisdom of the crowd.

  **Action Required:** Committee approval to proceed with Legal Review on Wednesday.
