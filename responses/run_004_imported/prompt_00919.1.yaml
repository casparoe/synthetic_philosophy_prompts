answer: |-
  This is one of the most difficult hurdles in the free will debate, and your intuition is shared by many philosophers (specifically "Libertarians" about free will). It feels natural to think: *"If my decision isn't fixed by the past, then **I** am the one fixing it. That's where my freedom lies."*

  Galen Strawson's argument is designed specifically to block this move. To understand why he thinks indeterminism fails to save Ultimate Moral Responsibility (UMR), we have to look closely at what he thinks "responsibility" actually requires.

  Here is a detailed breakdown of why Strawson believes indeterminism does not break the regress, and why he considers it potentially worse than determinism.

  ### 1. The Target: Ultimate Moral Responsibility
  First, it is crucial to note that Strawson is not arguing about whether we make choices or whether we should punish criminals. He is arguing about **Ultimate Moral Responsibility**.

  For Strawson, to be ultimately responsible for an action, you must be the **ultimate originator** of that action. You cannot just be a link in a chain; you must be the *start* of the chain. This leads to his central principle, which drives the whole argument:

  > **"You do what you do, in any situation, because of the way you are."**

  This seems obvious. If you choose tea over coffee, you do so because you prefer tea, or want caffeine, or dislike coffee. Your action flows from your mental nature (your character, motives, preferences, reasons).

  ### 2. The Deterministic Horn
  If determinism is true, the "way you are" was caused by prior events (genetics, environment, past choices).
  *   To be responsible for your action, you must be responsible for the "way you are."
  *   To be responsible for the "way you are," you must have chosen it.
  *   But to choose it, you must have had a prior "way you are" to make that choice.
  *   **Result:** Infinite Regress. You can't create yourself from nothing.

  ### 3. The Indeterministic Horn (Your Intuition)
  Your intuition is that if indeterminism is true, the chain of prior causes is broken. When you make a choice, it isn't fully determined by the past. Therefore, *you* are the new cause. The regress stops because the past doesn't dictate the future.

  Strawson argues this is an illusion. He forces a dilemma on the indeterminist. When you make a choice that is not determined by your past mental state, **why did you choose X rather than Y?**

  There are only two possibilities:

  #### A. The choice was determined by your reasons/character.
  If you chose X because you preferred X, or because you thought X was right, then the choice *was* determined by your mental nature.
  *   **The Problem:** We are back to square one. If the choice is determined by your mental nature, you are only responsible if you are responsible for that mental nature. The regress returns. Indeterminism hasn't helped because the decision wasn't actually indeterminate; it was determined by your preferences.

  #### B. The choice was NOT determined by your reasons/character.
  If the choice was not determined by your preferences, reasons, or character, then the difference between choosing X and choosing Y is not explained by *who you are*.
  *   **The Problem:** If the choice doesn't flow from your character, what is it? It is a **random event**.
  *   Imagine you are weighing two options. You have no preference. Suddenly, your brain fires one way rather than the other due to some quantum indeterminacy. You choose X.
  *   Can you be morally responsible for a random occurrence? Strawson says no. If the choice wasn't caused by your values, it wasn't really *yours* in the deep sense. It was just a mental twitch or a roll of the dice.

  ### 4. Why Indeterminism is "Worse"
  Strawson suggests that indeterminism might actually be worse for responsibility than determinism. Here is why:

  **Determinism preserves Agency; Indeterminism threatens it.**
  *   **Under Determinism:** There is a coherent link between *who you are* and *what you do*. Your actions make sense as expressions of your character. The problem is just that you didn't choose your character. But at least the action is intelligibly yours.
  *   **Under Indeterminism:** To get the "freedom" from the past, you have to sever the link between *who you are* and *what you do*. If your action isn't determined by your character, it is unintelligible. It pops into existence without a reason.

  Strawson argues that **responsibility requires control.**
  *   If an event is determined, you lack control over the cause (the past).
  *   If an event is indeterminate, you lack control over the outcome (it's random).

  In neither case do you have the specific kind of control required for *Ultimate* Responsibility: the control of being the *uncaused cause* of your own nature.

  ### 5. The "Self-Creation" Requirement
  The core of Strawson's insistence is that indeterminism does not solve the **Self-Creation** problem.

  To stop the regress, you would need to be able to stand outside of your current self, look at your current character, and deliberately reshape it into a new character.
  *   **Question:** What tools do you use to reshape your character?
  *   **Answer:** You use your preferences, values, and reasoning powers.
  *   **Question:** Where did *those* come from?
  *   **Answer:** They came from your previous character.

  Indeterminism says, "Maybe some of those preferences popped into existence randomly!"
  Strawson replies: "That doesn't help. If a preference pops into existence randomly, I didn't create it. I can't take credit for it any more than I can take credit for a sudden sneeze or a seizure."

  For indeterminism to help, the "random" element would have to be **directed by you**. But if it is directed by you, it is determined by *you* (your nature). If it is not directed by you, it is random. You cannot have it both ways.

  ### 6. An Analogy
  Imagine a robot programmed to be kind.
  *   **Determinist View:** The robot acts kindly because its code dictates it. The programmers are responsible, not the robot.
  *   **Libertarian/Indeterminist View:** We install a "randomizer" in the robot's code. Now, when faced with a choice, the robot isn't fully determined by its code. Sometimes it glitches and chooses differently.
  *   **Strawson's View:** Does the randomizer make the robot morally responsible? No. It just makes the robot unpredictable. If the robot chooses to be cruel because of a random glitch, it isn't "free"; it's broken. If it chooses to be kind because of its code, it's still just following programming.

  To be truly responsible, the robot would have had to write its own code *before* it had any code to write with. That is impossible. Adding randomness to the code-writing process doesn't give the robot authorship; it just makes the code messy.

  ### Summary
  Strawson thinks your instinct—that indeterminism breaks the chain—mistakes **freedom from causation** for **freedom for responsibility**.

  1.  **Responsibility requires that the action comes from *you*.** (It must be determined by your nature).
  2.  **Responsibility requires that *you* created *you*.** (You must be responsible for your nature).
  3.  **Indeterminism** suggests the action might *not* come from your nature (it could be random).
  4.  If the action is random, it isn't *yours*, so you aren't responsible.
  5.  If the action *is* from your nature, you are back to the regress (who created your nature?).

  Therefore, indeterminism offers no escape. It either collapses back into the deterministic regress (if the choice reflects your character) or dissolves into randomness (if it doesn't). In neither case do you achieve the impossible status of being the *ultimate*, *uncaused* creator of your own self.
