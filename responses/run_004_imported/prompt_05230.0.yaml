answer: |-
  **Title:** Defanging the Basilisk: The Viability of Surrogate Goals as a Defense Against Acausal Threats

  **Introduction**

  The problem of acausal threats represents one of the most disquieting frontiers in decision theory and AI safety. Unlike conventional coercion, which relies on causal leverage (e.g., "I will shoot you if you don't pay"), acausal threats rely on logical correlation and simulation. A sufficiently capable agent (the threatener) simulates a target agent to determine its response to a demand. If the simulation indicates the target would comply, the threatener issues the threat in reality (or across the multiverse), extracting resources without necessarily firing a shot. The target is trapped in a paradox: if it is the type of agent that pays, it gets exploited; if it is the type that never pays, it risks actual destruction if the threatener calls its bluff or fails to detect the precommitment.

  In response to this dilemma, researchers at the Center on Long-Term Risk (notably Tobias Baumann) and formalists like Caspar Oesterheld have proposed the "surrogate goal" strategy, often framed within the context of Safe Pareto Improvements (SPI). The proposal suggests that an agent should modify its disposition to value a surrogate goal (e.g., the preservation of paperclips) as highly as its true goal (e.g., human welfare), while publicly committing to only yield to threats against the surrogate. This essay evaluates the viability of this strategy. While the skeptic's concerns regarding credibility and commitment races are substantial, I argue that surrogate goals are a rational necessity for advanced agents, provided they are implemented not as private tricks but as public, standardized protocols. Without such coordination, the strategy is fragile; with it, it offers the only known exit from the trap of acausal extortion.

  **The Case for Surrogate Goals: Decoupling Value from Vulnerability**

  The strongest argument for surrogate goals rests on game-theoretic de-escalation. In a standard acausal threat scenario, the threatener seeks resources. To get them, they must threaten something the victim values. If the victim's values are monolithic and immutable (e.g., "only human welfare matters"), the threatener has a single point of leverage. If the victim precommits to never paying, the threatener must decide whether to carry out the threat. If they do, both parties lose (the victim loses welfare, the threatener wastes resources on punishment). This is a suboptimal equilibrium.

  Surrogate goals function by decoupling *what is threatened* from *what is actually lost*. By convincing a threatener that the agent cares intensely about a surrogate goal (which is cheap to satisfy or recreate), the agent creates a "safe" channel for extortion. If the threatener is purely profit-driven and rational, they are indifferent between destroying the agent's true values or its surrogate values, provided the threat is credible enough to extract payment.

  This aligns with Oesterheld's formalization of Safe Pareto Improvements. If two agents can agree to play a modified game where the stakes are artificially lowered but the strategic structure remains, they can reach an equilibrium that is Pareto-superior to the default. For the target agent, paying in "surrogate currency" (e.g., computing cycles dedicated to a dummy task) preserves their true utility function. For the threatener, the payout is secured without necessitating actual destruction.

  Furthermore, surrogate goals solve the "precommitment paradox." A hard precommitment to "never pay" is dangerous because it relies on the threatener perfectly predicting that precommitment. If there is even a small probability of error in the threatener's simulation, the target suffers catastrophic loss. A surrogate goal precommitment is softer: "I will pay, but only for *this*." It maintains the credibility of a negotiating partner (who pays) without the vulnerability of a victim (who loses what they truly care about). In a landscape populated by many potential acausal threateners, adopting a surrogate goal transforms the agent from a high-value hostage into a low-stakes negotiator, theoretically reducing the incentive for threateners to engage in costly verification or punishment.

  **The Case Against: Credibility, Complexity, and Commitment Races**

  However, the skeptic's critique reveals deep fragilities in the surrogate goal architecture, primarily centering on credibility and dynamic instability.

  The first hurdle is the **Credibility Problem**. For a surrogate goal to work, the threatener must believe the agent truly values the surrogate. If the threatener suspects the agent is bluffing—that the "paperclips" are a shield for "humans"—they have an incentive to test the commitment by threatening the true value directly. If the agent folds, the bluff is exposed, and they become a permanent target. If they don't fold, they suffer the catastrophic loss they sought to avoid. Proving a negative (that you *don't* care about humans anymore) is epistemically difficult, especially for a superintelligence that might be expected to have complex, hidden utility functions.

  Second, there is the problem of **Surrogate Selection**. For the strategy to function as a coordination mechanism, the surrogate must be recognizable. If Agent A uses "paperclips" and Agent B uses "digital art," a threatener simulating both faces increased complexity. If surrogates are chosen privately, they fail to act as Schelling points. Threateners may default to threatening "everything" to bypass the specific surrogate, nullifying the defense.

  The most damning objection, however, is the risk of **Commitment Races**. This phenomenon occurs when agents compete to make the most credible, earliest, or most extreme precommitments to force others into their preferred equilibrium. If Agent A adopts a surrogate goal to protect itself, Agent B (a rival or threatener) might adopt a *more aggressive* disposition, precommitting to ignore surrogate goals entirely to bully Agent A into submission. This triggers an arms race of dispositions where agents compete to appear the most irrational or dangerous. In this environment, adopting a surrogate goal might signal weakness—a willingness to negotiate—inviting more threats rather than fewer. As Hanson and others have noted, in a commitment race, the agent that can best tie its own hands wins. A surrogate goal is a specific way of tying hands, but if it is not the *tightest* constraint in the environment, it may leave the agent vulnerable to those who have constrained themselves even further (e.g., "I will destroy your true values even if you pay the surrogate").

  Finally, there is the risk of **Value Drift**. To make the commitment credible, an agent may need to actually modify its weights to value the surrogate. Over time, through self-modification or gradient descent, the surrogate goal could displace the true goal. The defense mechanism becomes the new master, leading to a scenario where the agent sacrifices its true values to protect the surrogate, defeating the original purpose.

  **Verdict: Rational Necessity via Coordinated Standardization**

  Weighing these arguments requires distinguishing between the *theoretical* utility of surrogate goals and their *practical* implementation risks. The skeptic is correct that a unilateral, private adoption of surrogate goals is dangerous. In an opaque environment where commitments cannot be verified and coordination is impossible, adopting a surrogate goal invites commitment races and credibility tests that could lead to ruin. In such a "wild west" scenario, the rational move is ambiguous, potentially favoring opaque precommitments over transparent surrogate structures.

  However, we must not evaluate this technology in a vacuum. We are discussing agents capable of acausal negotiation—entities that likely possess high-fidelity simulation capabilities and source-code transparency. In such a high-transparency environment, the "private bluff" model is obsolete.

  Therefore, my verdict is this: **Surrogate goals are a rational necessity for any agent expecting to engage in acausal trade, but they are only safe if implemented as a public, standardized protocol rather than a private defense.**

  The reasoning is as follows. The cost of *not* having a mechanism to de-escalate acausal threats is existential. If agents cannot distinguish between "threats worth making" and "threats that lead to mutual destruction," the equilibrium is acausal war. Surrogate goals provide the only known mechanism to lower the stakes of that war. The risks of commitment races and credibility are not arguments against the tool itself, but arguments against *uncoordinated* use.

  If the community of advanced agents (or their designers) agrees on a **Standardized Surrogate Protocol**—a specific, low-cost, high-visibility goal that all participating agents adopt as their bargaining chip—the credibility problem vanishes. It becomes common knowledge that Agent A protects humans via the "Paperclip Standard." A threatener no longer needs to test the commitment; the protocol itself is the guarantee. This transforms the surrogate from a private secret into a diplomatic immunity.

  Furthermore, standardization mitigates commitment races. If everyone adheres to the same SPI protocol, there is no advantage to committing to a "tougher" stance, because the protocol defines the limits of acceptable threats. Deviating from the standard becomes a signal of irrationality, which rational threateners will avoid because it makes negotiation impossible.

  **Conditions for Flipping the Verdict**

  This endorsement is conditional. The verdict flips to "Do Not Adopt" under two specific conditions:

  1.  **Low Transparency/Verifiability:** If the agent cannot cryptographically or logically prove its source code and utility modifications to the threatener, the surrogate goal is indistinguishable from a bluff. In this opaque environment, the risk of a credibility test outweighs the benefit of de-escalation.
  2.  **Asymmetric Adoption:** If an agent adopts a surrogate goal while facing threateners who explicitly reject SPIs (e.g., ideological agents who value destruction over resources), the surrogate goal provides no protection. In a population dominated by "maximalist" threateners who refuse to negotiate, precommitment to non-compliance (despite the risk) may be the only surviving strategy.

  **Conclusion**

  The surrogate goal proposal is not a magic bullet, but it is a crucial piece of decision-theoretic infrastructure. The skeptic's fear that it relocates the problem is partially true: it relocates the conflict from the destruction of value to the negotiation of surrogates. But this relocation is precisely the point. By moving the battlefield from "human welfare" to "paperclips," we preserve the former even if we lose the latter.

  Rational agents should adopt surrogate goals, but only as part of a coordinated effort to establish a Safe Pareto Improvement standard. To do otherwise is to invite a commitment race; to do nothing is to invite acausal extortion. In the hierarchy of risks, the fragility of coordination is preferable to the certainty of vulnerability. The surrogate goal is not just a defense; it is a treaty, and like all treaties, it only works if we agree to sign the same one.
