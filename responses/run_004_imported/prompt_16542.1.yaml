 except that T2 implies enormously more observers overall, SIA already tells you to be almost certain T2 is right before physicists even run the deciding experiment, purely because more observers exist under T2 -- which amounts to getting a physics result for free. SSA doesn't have that problem, but it isn't free either, since it has to specify a reference class -- and that turns out to be just as arbitrary a cost as SIA's, since SIA needs one too, just drawn around a bigger pool of observers instead of a narrower one."

