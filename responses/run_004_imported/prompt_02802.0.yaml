answer: |-
  **Thesis:** Bernard Williams's reading of *Così fan tutte* is a category error. He imposes a post-Romantic ideal of musical "sincerity" onto an Enlightenment artifact that is fundamentally about artifice. Williams is wrong: the music of Act 2 is not a revelation of inner truth that the plot cynically overrides; rather, the music is itself a tool of seduction, as theatrical and manipulative as the disguises. The opera's cynicism is not a structural fracture between score and libretto, but a consistent, unified philosophy: human emotion is performative, fleeting, and subordinate to social order.

  **Argument:**

  **1. The Music as Rhetoric, Not Revelation**
  Williams assumes that in Mozart, musical beauty equates to psychological truth. This is a 19th-century Wagnerian hangover that does not fit 18th-century *opera buffa*. In Act 2, the "new feelings" the couples develop are not organic discoveries of the soul; they are the result of a staged manipulation. When the disguised lovers sing, they are not expressing their "true selves"; they are performing roles designed to breach the women's defenses.
  Take the Act 2 serenade, "Deh vieni." It is musically exquisite, but contextually, it is a lie sung by a man in a fake mustache to a woman whose sister he is pretending to court. Williams argues the music makes us believe the passion is genuine. But the music's function here is rhetorical, not confessional. It is designed to *work*, to seduce. If the music is successful, it proves the efficacy of the performance, not the authenticity of the emotion. To claim the music reveals "truth" is to fall for Don Alfonso's trick just as Fiordiligi does. Williams mistakes the *intensity* of the musical moment for *moral validity*.

  **2. Fiordiligi's Fragmentation (The "Come scoglio" vs. "Per pietà" Problem)**
  Williams leans heavily on Fiordiligi as the vessel of tragic truth, particularly in her Act 2 aria "Per pietà." He hears this as the voice of genuine remorse and love, which makes the reset cruel. However, a close musical analysis suggests instability, not sincerity.
  In Act 1 ("Come scoglio"), Fiordiligi sings in a rigid, martial style, mimicking the *opera seria* heroine to project steadfastness. In Act 2 ("Per pietà"), she doesn't find her "true voice"; she fractures. The aria is a pastiche of styles, shifting from pleading adagios to frantic allegros. This isn't musical truth-telling; it's musical panic. She is trying on different emotional costumes because her identity is collapsing. Williams hears a unified soul in pain; Mozart gives us a subject in pieces. If the music itself depicts her inability to hold a consistent emotional line, then the "feelings" she expresses in Act 2 cannot be the "truth" Williams claims they are. They are just the latest fluctuation in a volatile psyche.

  **3. The Genre of *Buffa* and the Social Contract**
  Williams treats the ending (the double marriage reset) as a cynical betrayal of the Act 2 emotions. This ignores the fundamental contract of *opera buffa*. The genre is not about the triumph of individual interiority (that is Romanticism); it is about the restoration of social order.
  In the Enlightenment worldview of Da Ponte and Mozart, marriage is a social institution, not a sacrament of personal feeling. The "cynicism" Williams detects is actually the opera's cold-eyed realism. The couples return to their original partners not because their Act 2 feelings "didn't count," but because those feelings were never meant to supersede the social contract. The finale ("Questo è il fin") explicitly tells the audience to laugh at the lovers' turmoil. Williams wants the opera to be a tragedy about the suppression of truth. It is actually a comedy about the management of desire. By insisting the music proves the feelings were "real enough" to warrant a different ending, Williams is demanding the opera be something it isn't.

  **Conclusion: Williams as the Dupe**
  The ultimate irony of Williams's essay is that he occupies the position of Fiordiligi. He wants to believe that the passion he hears in the orchestra is sacred and immutable. He finds the ending cynical because he, like the characters, has been seduced by the beauty of the performance.
  *Così fan tutte* is not cynical because it overrides truth with plot; it is consistently cynical because it demonstrates that "truth" in love is inaccessible. There is only performance. The music in Act 2 is not a window into the soul; it is the most elaborate mask of all. Williams claims the opera breaks our hearts by denying the music's truth. The stronger reading is that the opera breaks our hearts by revealing that the music was never telling the truth to begin with. The cynicism is total, and Williams is the only one who missed the joke.
