          *   *What Survives:* The class divide, the transfer of wealth, the normative condemnation of capitalism as parasitic.
          *   *What is Lost/Changed:* The centrality of the labor process. The claim that profit *must* come from unpaid labor time. The inevitability of alienation *if* assets are equalized (Roemer allows wage labor in socialism).
