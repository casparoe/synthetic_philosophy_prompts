          *   *Refining the Stance:* I will argue that Roemer *necessarily* severs the conceptual identity between exploitation and alienation, reducing alienation to a contingent byproduct of asset inequality rather than a structural feature of the capitalist labor process. This weakens the critique of *authority* within production.
