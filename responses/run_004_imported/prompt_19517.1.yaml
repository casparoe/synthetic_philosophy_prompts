          *   Goal: Save the *moral* intuition of exploitation without the *metaphysical* baggage of LTV.

      *   **The Comparison (Preservation vs. Abandonment):**
          *   *Preserves:* The class structure (bourgeoisie/proletariat), the inverse interest relationship, the intuition that capitalism is unjust because it transfers wealth from workers to capitalists.
          *   *Abandons:* LTV, the necessity of the labor process as the *site* of exploitation (exploitation can happen in circulation or via interest), the idea that only labor creates value.
          *   *Redescribes:* Exploitation becomes a symptom of unequal property relations, not the fundamental evil itself. The fundamental evil is inequality of assets.

      *   **The Alienation Worry:**
