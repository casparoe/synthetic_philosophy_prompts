      *   So, Stability is actually easier to absorb than the ontological shift of GR.

  10. **Final Polish:** Ensure the distinction between the "Providence" argument (Bentley/Scholium) and the "Ontological" argument (*De Gravitatione*) is maintained throughout. Ensure the conclusion addresses the "load-bearing" question. (The specific arguments *were* load-bearing, but the core voluntarism can be reconstructed).

  11. **Check against constraints:** No "he was devout" hand-waving. Reconstruct arguments. Address both developments. Compare damage.

