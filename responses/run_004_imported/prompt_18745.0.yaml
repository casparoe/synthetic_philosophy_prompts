answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I had the privilege of sharing a hallway and a physics department with Walt for over thirty years.

  When Walt's family asked me to speak, they also handed me a sealed envelope Walt left behind. Inside was a list titled "Banned Phrases for My Funeral." Topping the list were things like "he's obeying higher laws now," "it was all meant to be," or "everything happens for a reason."

  So, in the interest of not having Walt haunt me from beyond the grave—which, knowing him, he would do just to prove a point about causality—I promise to avoid all of those.

  Walt was a physicist through and through, right up to the end. But those of you who knew him in his last five years know he got a little obsessed with philosophy. Specifically, the work of David Lewis. Walt became convinced that the laws of nature we'd spent our careers chasing weren't like traffic cops, directing particles where to go. He believed they were more like a summary. A description of what *did* happen, not a rulebook for what *must* happen.

  He called it "the mosaic."

  Now, I need to say something that makes sense to the physicists in the back row and the grandkids in the front.

  Walt used to say the universe is like a giant mosaic. For my colleagues here, that's Humean Supervenience. For the grandkids, think of Walt's model train set. When you look at the layout, you see a pattern. The train goes round the mountain, through the tunnel, past the little plastic station.

  Walt's big joke, which he told me many times over coffee, was this: "I spent thirty years looking for the hidden engine that pushes the train. Turns out, there is no engine. There's just the track, and the train, and the beautiful fact that it runs."

  He believed there was no glue holding the tiles of the mosaic together other than the fact that they fit.

  Some people might find that cold. I didn't. I found it incredibly comforting. Because if the universe isn't following a script, if there's no hidden hand forcing things to happen for a "reason," then the things we do matter precisely because they *happened*, not because they were destined to.

  Walt wasn't part of a grand design. He was a distinct, vibrant, irreplaceable pattern in the mosaic.

  And here is the comfort I hold onto, and I hope you can too: In physics, a pattern doesn't vanish just because the observation ends. The data remains. The impact remains. The way he taught us, the way he loved his family, the way he set up those trains for his grandchildren—that is all part of the structure of the world now. It is written into the history of the universe.

  He didn't believe he was going to a better place. He believed he was completing his part of the pattern. And when I look at the world he left behind—at the colleagues he mentored, the family who loved him, the equations he solved—I can tell you that his section of the mosaic is stunning.

  We miss him. We will continue to miss him. But the pattern he made is permanent.

  Thank you, Walt. The track is laid. The train ran beautifully.
