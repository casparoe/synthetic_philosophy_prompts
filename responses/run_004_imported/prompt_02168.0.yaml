answer: |-
  **Setting:** *The department lounge, late afternoon. The seminar on demandingness just finished. Alex (a maximizing act-consequentialist) is pouring coffee. Jordan (a satisficing consequentialist) is slumped in an armchair, grading papers.*

  **Alex:** You handled the pushback well in there. When Miller asked if satisficing is just "maximizing with a guilt discount," you kept your cool. But I noticed you glossed over the Bradley objection.

  **Jordan:** *[Looks up]* The 2006 *Utilitas* paper? "Satisficing Consequentialism"? Honestly, I thought the seminar was running long. Everyone knows the standard Slote line: maximizing is too demanding, so we set a threshold of "good enough."

  **Alex:** That *is* the standard line. It's also exactly where Bradley digs his heels in. Look, I get the demandingness worry. I do. But Bradley's point isn't that maximizing is easy. It's that satisficing, as a *consequentialist* theory, makes no sense once you spell out the threshold.

  **Jordan:** Because it permits sub-optimality. I know the objection. "Why choose the worse option?"

  **Alex:** It's stronger than that. It's not just choosing a worse option; it's choosing a *known, available, cost-comparable* worse option. Let's run a case. Not the usual "save the drowning child vs. buy a suit" stuff. Let's keep the cost to the agent fixed.

  **Jordan:** Okay. Lay it on me.

  **Alex:** Imagine you have \$1,000 to donate. You have two charities in front of you. Charity A will save 10 lives with that money. Charity B will save 8 lives with that money. The transaction cost, the effort, the emotional toll—it's identical. You just click a different button.

  **Jordan:** And the satisficing threshold is, say, 5 lives saved.

  **Alex:** Exactly. So, both A and B clear the threshold. They are both "good enough." But A is clearly better. A maximizing consequentialist says you must pick A. A satisficing consequentialist says B is permissible.

  **Jordan:** Right. Because morality doesn't require the *best*, just the *sufficient*.

  **Alex:** But why? If you're a consequentialist, you believe outcomes matter. If outcomes matter, doesn't 10 lives matter more than 8? If you admit B is worse, and you admit B is available, and you pick B... aren't you just saying, "I knowingly prefer a worse world state"?

  **Jordan:** I'm saying I prefer a world state that is *sufficiently good* while respecting my status as an agent who isn't a mere conduit for the good. But in your case, the cost is identical. So let's tweak it. In the real world, Charity A might require more research to verify those 10 lives. Charity B is transparent.

  **Alex:** No, no. Stick to the Bradley case. Hold the cost fixed. If you hold the cost fixed, the only difference is the outcome. If you choose B, you are knowingly making the world worse than it could be, for no reason other than "it's above the line." That's not just non-maximizing; that's gratuitous sub-optimality. It looks like irrationality.

  **Jordan:** Okay, but here's the pushback, and I think you're skipping it. You're assuming that "rationality" in morality just *is* "maximizing the good." That's the conclusion, not the premise.

  **Alex:** It's not begging the question; it's definitional. Consequentialism is the view that the rightness of an act depends on the goodness of its consequences. If consequence set X is better than consequence set Y, and you can produce X, then producing Y is, by definition, failing to do what the theory says matters most.

  **Jordan:** That's the Maximizing Consequentialist definition. But Slote's point—and mine—is that we can accept that consequences matter without accepting that *more* is always *required*. Think about practical rationality in other domains. I'm buying a laptop. I need one that runs my software and costs under \$2,000. I find one for \$1,500 that works perfectly. There's another one for \$1,500 that's 5% faster. Am I *irrational* for buying the first one?

  **Alex:** In prudential rationality? Maybe not. But in *morality*? The stakes are different. When you're buying a laptop, the value is agent-relative. It's about *your* needs. When you're talking about saving lives, the value is agent-neutral. Those 2 extra lives in Charity A aren't *your* lives. They belong to others. To say "8 is good enough" when "10 is possible" is to discount their claim on you without a cost-based justification.

  **Jordan:** But that's just re-asserting the demandingness intuition! The whole point of satisficing is to say that agent-neutral value doesn't always trump agent-relative prerogatives. The threshold *is* the space where I get to say, "I've done my duty, now I get to live my life."

  **Alex:** But in the fixed-cost case, you aren't living your life differently. You're just clicking a different button. You're leaving 2 people dead who could have lived. If the threshold permits that, the threshold isn't protecting your integrity; it's licensing indifference. Bradley's charge is that satisficing consequentialism collapses into a kind of moral laziness that the theory itself can't justify. If you care about consequences, you care about *more* consequences.

  **Jordan:** Okay, let's grant the fixed-cost case is hard for me. It's the weakest point in the armor. But the reply is this: Insisting that I *must* click Button A smuggles maximizing back in through the side door. You're saying, "Once you've admitted consequences matter, you must maximize." I'm saying, "Consequences matter *up to a point*."

  **Alex:** But "up to a point" is arbitrary. Where does the point come from? If the threshold is 5 lives, why not 6? Why not 9.9? If you can't give a non-arbitrary account of the threshold that isn't just "where maximizing gets too annoying," then the theory lacks action-guidingness. It tells the agent, "Do enough." The agent asks, "How much is enough?" And the theory says, "Less than the best, but... you know it when you see it."

  **Jordan:** It's not arbitrary; it's context-sensitive. It's based on what is reasonable to expect of a moral agent in a specific social context. We have shared understandings of duty. If I give 20% of my income to effective aid, most people would say that's morally excellent. If I give 80%, they might call me a saint or a fool. The threshold tracks reasonable expectation, not mathematical optimality.

  **Alex:** But now you've shifted grounds. You're no longer justifying the threshold based on *consequences*. You're justifying it based on *social expectations* or *virtue*. That sounds like a hybrid view. If you ground the threshold in "what society expects," you might be protecting the agent, but you've lost the "consequentialist" part of the label. You're saying the right act is determined by social norms, not outcomes.

  **Jordan:** No, the outcome still determines whether I clear the bar. I can't save 0 lives and call it "good enough." The consequences constrain the choice. They just don't *maximize* the choice.

  **Alex:** Here's the real bullet you have to bite, Jordan. And I want you to feel the weight of it. In your view, if I know Option A produces more good than Option B, and both clear the threshold, and I choose B... I am doing the *right* thing.

  **Jordan:** Yes.

  **Alex:** But the world is worse than it would have been.

  **Jordan:** Yes.

  **Alex:** So you are committed to the view that it is sometimes morally permissible to knowingly make the world worse than it could have been, even when doing so costs you nothing.

  **Jordan:** *[Pauses]* I'm committed to the view that "making the world the best it can be" is not the sole definition of moral permissibility. Yes.

  **Alex:** That feels like a bigger bullet than demandingness. Demandingness says, "Morality asks a lot of you." That's hard, but it's noble. Your view says, "Morality allows you to leave value on the table for no reason." That's not just less demanding; it's less *serious*. If I'm a doctor in a triage situation, and I can save Patient A (full recovery) or Patient B (partial recovery), and the effort is the same... and you tell me it's permissible to save B because B is "good enough"... I'm not going to follow your ethics. I'm going to think you've lost the plot.

  **Jordan:** But the triage case is a special role obligation. I'm talking about general morality. And look, Alex, your view has a bullet too. It's just one you've gotten used to. You have to tell the person who gives 99% of their income to charity that they are still *morally required* to give that last 1%, even if it means they can't buy a winter coat. You bite the demandingness bullet because you think the "Known Worse" bullet is fatal. I bite the "Known Worse" bullet because I think the demandingness bullet is fatal to the theory's plausibility as a human ethic.

  **Alex:** But plausibility isn't truth. If consequentialism is true, it's true because value is what matters. If value matters, more is better. If you sacrifice that to make the theory "livable," haven't you just admitted the theory is false for humans?

  **Jordan:** Or maybe I'm admitting that "rationality" isn't monolithic. There's optimizing rationality, and there's satisficing rationality. Simon's work in decision theory shows that in complex environments, maximizing is often computationally impossible or self-defeating. Maybe morality is a complex environment.

  **Alex:** But we aren't talking about computational limits here. We're talking about the \$1,000 donation case. You *know* A is better. You *can* do A. You just... don't want to. That's not bounded rationality; that's a lack of moral commitment.

  **Jordan:** Or it's a recognition that morality isn't just about the output. It's about the relationship between the agent and the demand. If the demand becomes "always produce the absolute best state of affairs," the agent becomes a slave to the good. Satisficing preserves the agent's sovereignty.

  **Alex:** And Bradley says that sovereignty comes at the cost of coherence. You can't say "consequences are the only thing that matters" and then say "but sometimes ignore the better consequence." You have to pick. Either consequences are the sovereign, or they aren't. If they aren't, what is?

  **Jordan:** Maybe the answer is that consequences are the *currency*, but not the *rule*. Like money. I want money. But I don't spend every waking hour maximizing my income. I make "enough" money so I can do other things. Is that irrational?

  **Alex:** In prudence, no. In morality, yes. Because money is yours to spend. Moral value isn't yours. It belongs to the recipients. When you satisfice in morality, you're spending *other people's* well-being to buy *your* integrity.

  **Jordan:** *[Sighs]* And when you maximize, you're spending *my* life to buy *their* well-being. We're just arguing about who pays the cost.

  **Alex:** I'm arguing that the cost shouldn't determine the rightness. You're arguing that the cost determines the threshold. But if the threshold allows for gratuitous sub-optimality—like the Charity B case—you've let the cost drop out of the equation entirely and still chosen the worse option. That's where the theory breaks.

  **Jordan:** Maybe. But until you can explain why "maximizing" is the only rational response to value without just asserting it, I'm keeping the threshold. It might be messy, but it doesn't demand I become a saint to be decent.

  **Alex:** And until you can explain why it's permissible to knowingly save fewer lives for no reason without abandoning the core insight of consequentialism, I'm sticking with maximizing. It might be hard, but at least it respects the value of the lives at stake.

  **Jordan:** So we're at a stalemate.

  **Alex:** We're at the state of the literature.

  **Jordan:** *[Picks up pen]* Great. How am I supposed to grade the seminar papers on this?

  **Alex:** Give points for recognizing the bullet they're biting. Lose points if they pretend it doesn't exist.

  **Jordan:** Deal.
