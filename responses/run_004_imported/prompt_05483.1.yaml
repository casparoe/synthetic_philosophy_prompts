      *   *Benacerraf's Objection:* To see $G(F)$ is true, one must assume $F$ is consistent. But if $F$ models the human, the human cannot know $F$ is consistent (by Gödel's 2nd). So the human can't assert $G(F)$ is true *unconditionally*.
      *   *Penrose's Argument (Shadows of the Mind):* Penrose argues that human mathematical insight is non-algorithmic. He distinguishes between "knowing $F$ is consistent" and "knowing $F$ is sound." He claims we *do* know our own reasoning is sound (at least in principle), which implies consistency.
      *   *The Consensus:* The prompt asks why philosophers *haven't* conceded to Penrose. This implies there are significant counter-arguments to Penrose's specific move.
