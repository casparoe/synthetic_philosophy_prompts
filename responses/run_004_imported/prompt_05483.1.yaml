answer: |-
  The persistence of computationalism despite Penrose's sophisticated revision of the Lucas argument is not due to a lack of engagement with *Shadows of the Mind*. Rather, it stems from a broad consensus among logicians and philosophers of mind that Penrose's "soundness move" fails to overcome the epistemic hurdles identified by Benacerraf, and introduces new vulnerabilities of its own.

  While Penrose correctly identifies that soundness implies consistency, his argument relies on premises that critics argue are either unjustified, question-begging, or incompatible with how computationalism actually models the mind. Here are the primary reasons why the philosophical community remains unconvinced.

  ### 1. The Epistemic Gap: Do We Know We Are Sound?
  The crux of Benacerraf's objection was epistemic: to assert the Gödel sentence $G(F)$ is true, one must *know* that $F$ is consistent. Penrose attempts to bypass this by arguing that a mathematician knows her own reasoning is **sound** (i.e., it only produces true conclusions), which entails consistency.

  However, critics argue that this assumes a level of self-transparency that humans do not possess.
  *   **Fallibility:** Human mathematicians make mistakes. We assert things that turn out to be false. Therefore, we cannot know *a priori* that our total reasoning system is sound.
  *   **The Idealization Problem:** Penrose often retreats to an "idealized" mathematician who never makes mistakes. But if this idealized agent is not us, the argument loses its force against actual human mechanism. If the idealized agent *is* us, we still lack the epistemic warrant to certify our own soundness. To know $F$ is sound, one must verify that all axioms of $F$ are true and rules of inference preserve truth. If $F$ is the totality of the mind's reasoning, the mind cannot step outside itself to verify this totality without invoking a further system $F'$, leading to a regress.

  ### 2. Chalmers' Dilemma
  The most damaging technical critique comes from David Chalmers (in "Minds, Machines, and Mathematics," 1996). Chalmers formalized Penrose's argument and demonstrated that it relies on a hidden assumption that renders it circular or false.

  Chalmers argues that for Penrose's proof to work, the mathematician must be able to know the soundness of $F$ *as a formal system*.
  *   **Horn 1:** If the mathematician knows $F$ is sound, then that knowledge must be representable within the mathematician's reasoning capacity. If $F$ captures all the mathematician's reasoning, then $F$ must contain the knowledge that $F$ is sound. But by Gödel's Second Incompleteness Theorem, a sound system cannot prove its own soundness. Thus, $F$ cannot capture the mathematician.
  *   **Horn 2:** If $F$ does not contain the knowledge that $F$ is sound, then the mathematician knows something $F$ does not. But this simply *stipulates* that $F$ does not capture the mathematician; it does not *prove* it via Gödel. It assumes the conclusion (that the mind transcends $F$) to derive the conclusion.

  Chalmers concludes that Penrose's argument essentially assumes that the mind can know the soundness of the system that constitutes it, which is logically impossible if that system is formal.

  ### 3. The Unsurveyability of the System
  Even if we grant that human reasoning is sound in principle, there is a practical obstacle regarding the identification of $F$.
  *   **Complexity:** If the brain is a computational system, $F$ would be astronomically complex, likely involving sub-symbolic processing, neural weights, and evolutionary heuristics rather than a neat list of axioms.
  *   **Opacity:** A human mathematician cannot "read off" the axioms of their own cognitive architecture. Without knowing the specific axioms of $F$, one cannot verify their truth, and therefore cannot verify the soundness of $F$. Penrose's argument requires the mathematician to inspect $F$ and declare it sound; if $F$ is the brain, the mathematician cannot inspect $F$ in the requisite formal detail.

  ### 4. Mischaracterization of Computationalism
  Penrose's argument targets a specific, strong version of computationalism: the idea that the mind is a **theorem-proving machine** operating within a fixed formal axiomatic system. Most contemporary philosophers of mind and cognitive scientists do not hold this view.
  *   **Probabilistic and Heuristic Models:** Modern computationalism often views the brain as a probabilistic inference engine, a connectionist network, or a heuristic system designed for survival, not mathematical truth. Such systems are not "formal systems" in the sense required for Gödel's theorems to apply directly. They may be inconsistent, non-monotonic, or simply approximate.
  *   **The "Logic" of the Brain:** Gödel's theorems apply to systems that are consistent, recursively enumerable, and capable of arithmetic. If the brain is a messy, evolving, parallel processing system that does not adhere to strict classical logic, the Gödelian argument may simply be category error. As Hilary Putnam and others have noted, applying Gödel to the mind assumes the mind works like a logician, which is precisely what is in dispute.

  ### 5. The Evolutionary Argument
  There is a strong evolutionary objection to the claim of soundness. Evolution selects for fitness, not truth. A cognitive system that produces adaptive beliefs (even if false) is more likely to survive than one that produces only true beliefs. Therefore, we have no evolutionary reason to trust that our cognitive faculties are "sound" in the logical sense Penrose requires. If we cannot trust our faculties to be sound, we cannot use them to certify the soundness of $F$, and the argument collapses.

  ### Conclusion
  Philosophers treat computationalism as a live option not because they ignore Penrose, but because the consensus is that **Penrose has not met the burden of proof.**

  Penrose's shift from consistency to soundness does not solve the Benacerraf objection; it merely relocates it. Benacerraf showed we cannot know $F$ is consistent; Penrose claims we know $F$ is sound. Critics reply that we cannot know $F$ is sound either, because (a) we are fallible, (b) we cannot survey our own cognitive code, and (c) assuming we can know our own soundness begs the question against mechanism. Until a proponent of the Gödelian argument can explain how a physical system (the brain) can have epistemic access to the soundness of its own formal description without violating incompleteness, computationalism remains the more parsimonious and scientifically integrated hypothesis.
