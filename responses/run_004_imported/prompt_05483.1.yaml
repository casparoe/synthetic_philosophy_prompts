      *   **Penrose's Move:** Switching from consistency to *soundness* (arguing that if $F$ represents the mathematician, the mathematician knows $F$ is sound, hence consistent, from outside $F$).
      *   **The Question:** Why do most philosophers of mind still accept computationalism as a live option despite Penrose's apparent solution to Benacerraf's objection?

