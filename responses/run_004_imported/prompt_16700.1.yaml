answer: |-
  This is an excellent question that cuts to the heart of the geometric foundations of epistemic utility theory (EUT). You are right to suspect that the move from *proper* to *strictly proper* is not merely a technical nicety; it is the load-bearing wall of the accuracy-dominance argument for Probabilism.

  Here is the breakdown of why strict propriety is required, a concrete counterexample using a merely proper score, and the distinction between strict propriety and immodesty.

  ### 1. Where the Dominance Argument Fails without Strict Propriety

  The standard accuracy-dominance argument (following Joyce 1998; Predd et al. 2009) relies on a geometric relationship between the set of coherent credence functions (the probability simplex, $\mathcal{P}$) and the level sets of the inaccuracy measure $\mathfrak{I}$.

  **The Argument Structure:**
  1.  Let $c$ be an incoherent credence function (outside $\mathcal{P}$).
  2.  We seek a coherent $c^* \in \mathcal{P}$ that **strictly dominates** $c$. That is, $\mathfrak{I}(c^*, w) < \mathfrak{I}(c, w)$ for all possible worlds $w$.
  3.  The proof typically constructs $c^*$ as the "projection" of $c$ onto $\mathcal{P}$, defined via the Bregman divergence generated by $\mathfrak{I}$.

  **The Failure Point:**
  The geometric engine of this proof is **strict convexity**.
  *   **Strict Propriety** implies that the expected inaccuracy function $Exp_p(q) = \sum_w p(w)\mathfrak{I}(q, w)$ is **strictly convex** in $q$, with a unique minimum at $q=p$.
  *   **Mere Propriety** implies only that $Exp_p(q)$ is **convex**. It allows for "flat spots" where $Exp_p(q) = Exp_p(p)$ for some $q \neq p$.

  If the measure is merely proper, the level sets of expected inaccuracy are not strictly convex; they can contain flat linear segments. Geometrically, this means the "surface" of inaccuracy can run parallel to the probability simplex $\mathcal{P}$.

  **Consequence:**
  If the inaccuracy surface is flat in the region between an incoherent $c$ and its coherent projection $c^*$, it is possible that $\mathfrak{I}(c, w) = \mathfrak{I}(c^*, w)$ for all worlds $w$.
  *   **Result:** $c$ is **not accuracy-dominated**. It is merely *tied* with a coherent alternative.
  *   **Normative Impact:** The dominance argument aims to show that incoherent credences are *irrational* because they are *guaranteed* to be worse than coherent ones. If an incoherent credence is only guaranteed to be *no better than* a coherent one (weak dominance) or *equal to* one (no dominance), the argument fails to establish that coherence is a strict requirement of rationality. It leaves open the possibility that being incoherent is rationally permissible.

  ### 2. Concrete Illustration: The "Flat" Scoring Rule

  Let us construct a toy scoring rule that is proper but not strictly proper and show how it fails to dominate an incoherent credence.

  **The Setup:**
  *   **Worlds:** $\Omega = \{w_1, w_2\}$.
  *   **Credence:** A single value $x \in [0, 1]$ representing $c(w_1)$. (Note: $c(w_2) = 1-x$).
  *   **Incoherence:** To make it interesting, let's look at a 3-world case or simply define incoherence as violating additivity. Let's stick to the standard 2-world setup but define incoherence as holding a credence $x$ that is not a probability? No, in 2-worlds, any $x \in [0,1]$ is probabilistic.
  *   **Revised Setup for Incoherence:** Let $\Omega = \{w_1, w_2, w_3\}$. A credence function is a vector $c = (c_1, c_2, c_3)$.
      *   **Coherent:** $\sum c_i = 1, c_i \ge 0$.
      *   **Incoherent:** $\sum c_i \neq 1$.

  **The Scoring Rule:**
  We define the inaccuracy measure $\mathfrak{I}(c, w)$ additively: $\mathfrak{I}(c, w) = \sum_{i=1}^3 s(c_i, w_i)$, where $w_i = 1$ if $w=w_i$ and 0 otherwise.

  We construct the local score $s(p, v)$ (where $p$ is credence, $v$ is truth value) using the **Savage Representation**. A score is proper iff the expected inaccuracy function $G(p) = p \cdot s(p, 1) + (1-p) \cdot s(p, 0)$ is convex. It is *strictly* proper iff $G$ is *strictly* convex.

  *   **Brier Score (Strictly Proper):** $G(p) = p(1-p)$. This is a strictly convex parabola.
  *   **The "Flat" Score (Merely Proper):** Let us define $G(p)$ to be flat in the middle.
      $$
      G(p) = \begin{cases} 
      (p - 0.5)^2 - 0.0625 & \text{if } |p - 0.5| > 0.25 \\
      0 & \text{if } |p - 0.5| \le 0.25 
      \end{cases}
      $$
      (Note: I am adjusting constants so $G$ is continuous and convex, with a flat bottom between $p=0.25$ and $p=0.75$).

      From $G(p)$, we derive $s(p, 1) = G(p) + (1-p)G'(p)$ and $s(p, 0) = G(p) - pG'(p)$.
      In the flat region ($0.25 \le p \le 0.75$), $G'(p) = 0$.
      Therefore, in this region:
      $$s(p, 1) = G(p) = 0 \quad \text{and} \quad s(p, 0) = G(p) = 0.$$

  **The Dominance Failure:**
  Consider an agent with an **incoherent** credence function $c = (0.5, 0.5, 0.5)$. (Sum = 1.5).
  Consider a **coherent** credence function $c^* = (0.5, 0.5, 0)$. (Sum = 1).

  Let's calculate the inaccuracy at each world using our "Flat" score. Note that all credence values here ($0.5$ and $0$) fall within or near the flat/defined regions. For simplicity, assume the score is 0 for any $p \in [0.25, 0.75]$ regardless of truth.

  *   **At world $w_1$ (Truth: 1, 0, 0):**
      *   $\mathfrak{I}(c, w_1) = s(0.5, 1) + s(0.5, 0) + s(0.5, 0) = 0 + 0 + 0 = 0$.
      *   $\mathfrak{I}(c^*, w_1) = s(0.5, 1) + s(0.5, 0) + s(0, 0)$.
          *   Wait, $s(0,0)$ might not be 0. Let's ensure the flat region covers the coherent projection.
          *   Let's adjust $c^*$ to be $(0.5, 0.5, 0)$. If $s(0,0)$ is high, $c^*$ might dominate.
          *   Let's choose $c = (0.5, 0.5, 0.4)$ and $c^* = (0.5, 0.5, 0)$.
          *   Actually, the simplest illustration is where *all* relevant credences fall in the flat region.
          *   Let the flat region be $[0, 1]$. (The "Trivial" score). Then $\mathfrak{I}(c, w) = \mathfrak{I}(c^*, w) = 0$ for all $w$.
          *   **Result:** $c^*$ does not dominate $c$. They are tied everywhere.

  *   **More Nuanced Case:** Suppose the flat region is $[0.4, 0.6]$.
      *   Incoherent $c = (0.5, 0.5, 0.5)$.
      *   Coherent $c^* = (0.5, 0.5, 0)$.
      *   At $w_3$ (where $c_3$ is tested): $c$ has 0.5, $c^*$ has 0.
      *   If 0 is outside the flat region, $c^*$ might score worse at $w_3$.
      *   **Better Example:** Let $c = (0.5, 0.5, 0.5)$ and $c^{**} = (1/3, 1/3, 1/3)$.
      *   If the score is flat for all $p \in [0.33, 0.5]$, then $\mathfrak{I}(c, w) = \mathfrak{I}(c^{**}, w)$ for all $w$.
      *   **Conclusion:** The incoherent $c$ is **undominated**. There is no coherent function that is strictly better. The argument for Probabilism collapses because it cannot rule out $c$.

  ### 3. Strict Propriety vs. Immodesty

  You asked if strict propriety and "immodesty" are the same requirement. They are intimately related but distinct categories.

  **Definitions:**
  1.  **Strict Propriety:** A property of the **inaccuracy measure** (scoring rule). It states that for any probability function $p$, $p$ uniquely minimizes expected inaccuracy relative to itself.
  2.  **Immodesty:** A property of a **credence function** (relative to a measure). A credence function $c$ is immodest if, according to $c$'s own expectations, $c$ is uniquely the most accurate among all available alternatives.

  **The Relationship:**
  *   **Strict Propriety $\implies$ Probabilistic Immodesty:** If the measure is strictly proper, then *every* coherent (probabilistic) credence function is immodest. (A probabilist expects themselves to be uniquely best).
  *   **Mere Propriety $\implies$ Modest Probabilists:** If the measure is merely proper, a probabilist might expect a *tie* between their own credences and others. They are not immodest.

  **Can they come apart?**
  Yes.
  1.  **Strict Propriety without Immodesty (for incoherent agents):** Even if the measure is strictly proper, an *incoherent* credence function $c$ will typically be **modest**. Because $c$ is incoherent, there exists a coherent $c^*$ that dominates it. Therefore, $c$ expects $c^*$ to be more accurate than $c$. $c$ condemns itself.
  2.  **Immodesty without Strict Propriety:** One could theoretically construct a weird scoring rule where a specific incoherent credence $c$ expects itself to be uniquely best (immodest), even if the rule is not strictly proper globally. However, in the context of justifying Probabilism, we usually fix the measure first.

  **Why the distinction matters in the literature:**
  When authors like Joyce or Greaves invoke "Immodesty," they are often arguing that rational credences *ought* to be immodest (you shouldn't hold credences that expect others to be better).
  *   If we demand **Immodesty** as a rational requirement, and we assume the **Accuracy** framework, we are effectively forced to adopt a **Strictly Proper** measure.
  *   Why? Because if the measure were merely proper, coherent credences would be modest (expecting ties). If we think rational coherent credences should be immodest, the measure *must* be strictly proper.

  **Summary:**
  Strict propriety is the **mathematical constraint on the tool** (the score) that guarantees the **normative status of the agent** (immodesty for probabilists, dominance over incoherentists). Without strict propriety, the tool is too blunt: it allows incoherent credences to escape dominance and renders coherent credences modest, undermining the claim that Probabilism is a unique requirement of epistemic rationality.
