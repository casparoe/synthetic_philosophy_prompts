  8.  *(Final check on the "Anxiety" question)*: Sartre argues that bad faith is a flight *from* anguish. So, if a belief functions *specifically* to remove anguish regarding freedom, it is suspect. However, since consciousness is one, Ray knows on some level he is fleeing. Maya is right that "calm" isn't proof, but Theo is right that the *motive* of calming is the definition of the act. I need to balance this. The key is that for Sartre, you can't have it both ways: you can't claim "destiny" to avoid the cost of choice.

