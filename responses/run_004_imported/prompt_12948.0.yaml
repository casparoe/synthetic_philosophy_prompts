          *   *Sartrean Basis:* Facticity vs. Transcendence. Authenticity involves synthesizing them. Also, the structure of consciousness (no unconscious).
          *   *Evaluation:* This is Maya's strongest move. She distinguishes between *interpreting* facticity (authentic) vs. *being determined* by it (bad faith). Crucially, she challenges the epistemology of Theo's claim about anxiety.
          *   *Verdict:* Maya wins on the structural distinction and the evidentiary problem.

  3.  **Address the Specific Focus: "Calming Anxiety" as Evidence.**
