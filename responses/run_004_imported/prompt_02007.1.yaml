  **Justifications**

  *   **Ruth (Move 1): Score 2.** This is textually accurate. Bellarmine's letter to Foscarini explicitly states that if a true demonstration existed, scripture must be reinterpreted. Galileo's letter to Christina argues for reinterpretation based on probability and physical plausibility rather than the strict "necessary demonstration" Bellarmine required. Ruth correctly identifies that Galileo was asking the Church to shift its epistemological standards.
  *   **Marcus (Move 1): Score 1.** Marcus is correct that Galileo had significant empirical data (moons of Jupiter, phases of Venus) that damaged the Ptolemaic system. However, his claim that Bellarmine's standard was impossible for *any* empirical claim is slightly anachronistic; 17th-century science distinguished between mathematical hypothesis and physical causation. Bellarmine wasn't just being difficult; he was adhering to an Aristotelian framework where mathematics did not prove physical reality.
  *   **Ruth (Move 2): Score 2.** This is the strongest historical point. The phases of Venus are consistent with both the Copernican system and the Tychonic system (geo-heliocentric). Without stellar parallax (not observed until 1838), there was no observational way to distinguish a moving Earth from a moving Sun in 1615. Ruth is right that Bellarmine's caution reflected the actual ambiguity of the data.
  *   **Marcus (Move 2): Score 1.** Marcus makes a valid philosophical point about the underdetermination of theory by data (there is always an alternative model). However, his claim that Bellarmine's theology failed its own bar is debatable; Bellarmine viewed theological consensus (Church Fathers) as a form of authority distinct from scientific demonstration. Marcus is applying modern philosophy of science to a pre-modern dispute, which is insightful but historically imperfect.

  **What Both Are Missing**

  For your novel, the drama lies in what they aren't discussing:

  1.  **Hypothesis vs. Reality:** The core conflict wasn't just about evidence, but about *ontology*. The Church was willing to accept Copernicus as a mathematical tool ("save the phenomena") to calculate calendars. Galileo insisted it was *physically true*. In 1615, claiming physical truth without absolute proof was seen as trespassing on theology.
  2.  **The "Proof" of the Tides:** Galileo genuinely believed he had his "necessary demonstration." He argued that the tides were caused by the Earth's motion (sloshing water). This was actually incorrect (tides are lunar/solar gravity), but it explains why Galileo wasn't being hypocritical in Ruth's first point—he *thought* he had the proof Bellarmine asked for.
  3.  **The Counter-Reformation Context:** This wasn't just science vs. religion; it was authority vs. individual interpretation. Following Luther, the Church had tightened control on private scripture interpretation at the Council of Trent. Galileo, a layman, telling priests how to read the Bible was politically explosive regardless of the astronomy.
  4.  **The Jesuit Factor:** Bellarmine and the Jesuits were initially among the most educated and open-minded regarding astronomy. Galileo's abrasive personality and public mockery of Aristotelian professors turned potential allies (who could have verified his work) into enemies. The tragedy is as much social as it is scientific.
