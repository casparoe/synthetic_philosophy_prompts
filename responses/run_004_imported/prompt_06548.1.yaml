      *   *Refining the Insurance Example:* Be precise. It's not just that insurance disappears. It's that the *value* of the state changes. In Good's theorem, $U(State, Action)$ is fixed. In the insurance case, $U$ depends on the contract available, which depends on the information distribution. This is the "Hirshleifer Effect."
