answer: |-
  This is a classic debate in decision theory, and it is excellent that you and your friend identified the tension between individual rationality and social welfare.

  The short verdict is: **You are right about the theorem, but your friend is right about the world.**

  Good's Theorem (1967) is mathematically sound within its specific domain, but that domain is much narrower than "all rational decision-making." Your friend's example describes a phenomenon known as the **Hirshleifer Effect**, which falls outside the scope of Good's assumptions.

  Here is the precise breakdown of what Good's Theorem establishes, the assumptions that do the heavy lifting, and why your friend's insurance example does not violate the theorem but rather operates in a different framework.

  ---

  ### 1. What Good's Theorem Actually Establishes

  I.J. Good's theorem states that for a Bayesian expected-utility maximizer, the **expected value of cost-free information is non-negative.**

  Formally, let $U(a, s)$ be the utility of taking action $a$ in state $s$. Let $E$ be a piece of evidence (a signal) that updates your beliefs about $s$.
  *   **Without evidence:** You choose action $a_0$ to maximize expected utility based on prior beliefs.
  *   **With evidence:** You observe $e$, update your beliefs to $P(s|e)$, and choose action $a_e$ to maximize expected utility based on posterior beliefs.

  Good's Theorem proves that the expected utility of the strategy "observe $e$, then choose optimal $a_e$" is greater than or equal to the expected utility of "choose optimal $a_0$ immediately."

  **The Intuition (The Option Value):**
  The proof relies on the fact that having information gives you an **option**. After seeing the evidence, you can choose to take the action you *would* have taken anyway, or you can switch to a different action if the evidence warrants it.
  *   If the evidence confirms your prior plan was best, you stick with it (utility stays same).
  *   If the evidence suggests a different plan is better, you switch (utility goes up).
  *   Since you never *have* to switch to a worse action, the expected value cannot go down.

  ### 2. The Critical Assumptions (Where the Work is Done)

  For the inequality $EU(\text{with info}) \ge EU(\text{without info})$ to hold, several strict assumptions must be met. If any of these break, the guarantee vanishes.

  1.  **Single-Agent Decision Theory:** The theorem assumes a solitary agent making a choice against "nature." There are no other strategic agents whose actions depend on what you know.
  2.  **Instrumental Value of Information:** Information is valued *only* for its ability to improve decisions. It has no intrinsic utility or disutility (e.g., "peace of mind" or "anxiety").
  3.  **Payoff Independence:** The utility function $U(a, s)$ is fixed. Crucially, **the payoffs do not depend on the information structure itself.** The state of the world and the consequences of your actions remain the same regardless of what you know.
  4.  **Cost-Free:** Acquiring and processing the information consumes no resources (time, money, cognitive load).
  5.  **Non-Intrusiveness:** Observing the evidence does not change the state of the world (the Observer Effect).

  ### 3. Analyzing Your Friend's Counter-Example

  Your friend described a situation where public information destroys an insurance market. In economics, this is a canonical example of the **Hirshleifer Effect** (named after Jack Hirshleifer, 1971).

  **The Scenario:**
  *   **Without Info:** I don't know if I will get sick. An insurer doesn't know either. We agree on a pooling contract. I pay a premium; if I get sick, I get paid. I am happier because I am risk-averse and now insured.
  *   **With Info:** A genetic test reveals with certainty who will get sick.
  *   **The Result:** The insurer will not insure the high-risk people (or will charge prohibitive premiums). The low-risk people don't need insurance. The risk-pooling market collapses. Everyone is exposed to raw risk again. Social welfare drops.

  **Why this does not violate Good's Theorem:**
  Your friend's example violates Assumption #3 (**Payoff Independence**).

  In Good's framework, the utility of "being insured" is a fixed function of the state "being sick." However, in the insurance market example, the *availability* of the insurance contract depends on the **distribution of information among agents.**

  When the information becomes public, it changes the **game**, not just the **beliefs**.
  *   In Good's Theorem, information changes $P(s)$ (my belief about the state).
  *   In the Hirshleifer Effect, information changes the set of available actions and payoffs $U(a, s)$ available to the agents because other agents (insurers, other customers) react strategically to that information.

  Good's Theorem applies to a decision maker facing a fixed payoff matrix. Your friend's example describes a **Game Theoretic** equilibrium shift. In game theory, more information can absolutely make players worse off (e.g., in bargaining, knowing your opponent's reservation price might force you into a worse deal than if you remained ignorant and bluffed).

  ### 4. Other Ways Good's Theorem Fails

  Even outside of game theory, there are scenarios where a rational agent should refuse free information. These occur when the other assumptions are violated:

  **A. Intrinsic Disutility of Information (Violating Assumption #2)**
  Good's Theorem assumes you only care about outcomes. But humans often have utility functions over *states of belief*.
  *   *Example:* A person might refuse a free test for a terminal, untreatable disease.
  *   *Reasoning:* If $U$ includes a term for "anxiety," then $U(\text{knowing bad news}) < U(\text{not knowing})$. A rational agent with this utility function will reject the information. Good's Theorem still holds mathematically, but only if you define "utility" strictly over physical outcomes, not psychological states.

  **B. Logical Uncertainty and Newcomb Problems (Violating Assumption #1/5)**
  In certain decision theory puzzles (like Newcomb's Problem), obtaining evidence can be correlated with the state of the world in a way that suggests "ignoring" the evidence yields a higher payoff.
  *   However, this usually requires stepping outside standard Causal Decision Theory (which Good assumes) into Evidential Decision Theory. Under standard Causal Decision Theory, Good's Theorem remains robust.

  **C. Information Hazards (Violating Assumption #5)**
  Sometimes the act of knowing changes your behavior in a way that causes the negative outcome.
  *   *Example:* If knowing a secret makes you nervous, and your nervousness causes you to fail a performance, the information itself is causally linked to the negative outcome. This blurs the line between "information" and "intervention."

  ### 5. Summary for the Dinner Table

  You can resolve the argument with this distinction:

  1.  **You win on Individual Decision Theory:** If you are a lone agent facing a fixed environment, and you care only about material outcomes, Good's Theorem is correct. You should never reject cost-free information because it expands your options.
  2.  **Your Friend wins on Social/Game Theory:** If you are in a system with other strategic agents, or if the information itself alters the available contracts/markets (the Hirshleifer Effect), more information can destroy value. The payoffs are no longer fixed; they are functions of the information structure.

  **The Synthesis:**
  Good's Theorem proves that information has **instrumental value** for a solitary decision-maker. Your friend's example proves that information can have **negative strategic value** in a multi-agent system. Both statements are true; they just apply to different models of the world.

  **Recommendation:** Tell your friend, "You are describing the Hirshleifer Effect, which violates the payoff-independence assumption of Good's Theorem. Good holds for decision theory; you are talking about game theory." Then buy the next round of drinks.
