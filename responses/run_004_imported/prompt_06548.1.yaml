      *   **Part 2: The Critical Assumptions (Where the "Work" is done):**
          *   Single Agent (No strategic interaction).
          *   Payoffs independent of information acquisition (No Hirshleifer effect).
          *   Cost-free.
          *   Bayesian rationality.
      *   **Part 3: Analyzing the Friend's Example (The Hirshleifer Effect):**
          *   Explain the insurance market collapse.
