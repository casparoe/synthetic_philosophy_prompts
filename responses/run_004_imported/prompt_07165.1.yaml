  8.  **Final Review:** Does this answer the prompt? Yes. Is it helpful for a student? Yes. Does it address the mom/friend dynamic? Yes.

  **(Self-Correction during drafting):** I initially thought about bringing in Wittgenstein, but that might confuse things. Stick to Hobbes and Fodor/LoTH. Make sure to emphasize *Nominalism*, as that's the key to why "names" matter so much to Hobbes.

