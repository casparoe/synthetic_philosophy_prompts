      *   If you go to Bar B to avoid them, and they aren't there, you win but you reinforced the avoidance behavior (negative reinforcement).
      *   If you go to Bar B and they *are* there, you feel betrayed by your own logic.
      *   *Best move:* Go where you want. If they show up, you practice co-existing.

  8.  **Final Polish:**
