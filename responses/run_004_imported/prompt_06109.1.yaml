      *   *Core Concept:* A market for logical sentences. Sentences are stocks paying \$1 if true, \$0 if false.
      *   *Criterion:* No polynomial-time computable trader can exploit the market (make unbounded profit).
      *   *Difference from Bayesianism:* Bayesianism requires a coherent prior over a fixed space and conditioning on truth. Logical induction deals with *logical* uncertainty (sentences whose truth value is fixed but unknown/unproven). Standard Bayesianism assigns probability 1 to all tautologies eventually (logical omniscience), whereas logical inductors assign intermediate probabilities for a long time.
      *   *Convergence:* Prices converge, *but* not necessarily to 1 or 0 for *all* sentences in finite time, and crucially, the limit is coherent. However, the student's claim about convergence needs careful checking.
