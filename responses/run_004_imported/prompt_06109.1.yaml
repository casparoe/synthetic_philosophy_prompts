          *   *Verdict:* Good. Bayesianism conditions on evidence (proofs). Logical induction moves prices based on exploitation avoidance.
      *   *Claim 5:* "That's really just an extension of Solomonoff induction's idea of weighting hypotheses by their Kolmogorov complexity..."
          *   *Verdict:* **Problematic.** Logical Induction is *not* just Solomonoff induction applied to sentences. Solomonoff is uncomputable. Logical Induction is computable (in the limit/polynomial time traders). They are related concepts in induction, but equating them is a significant conceptual error.
      *   *Claim 6:* "One of the main results is that the price of every sentence converges as the market runs longer..."
