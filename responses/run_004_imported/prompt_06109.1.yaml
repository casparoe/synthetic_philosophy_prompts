  ### **TA Survival Tip**
  Since you're new to this topic: The core "trick" of Logical Induction is that it separates **Truth** from **Provability**.
  *   **Bayesianism:** Assumes you are logically omniscient (you know all consequences of your axioms instantly).
  *   **Logical Induction:** Admits you are *not* omniscient. You can be confident in a conjecture (like Goldbach's) without a proof, but you should never assign it probability 1 unless you actually have the proof. The student's answer fails because they claim the inductor *does* eventually assign 1 to everything true, which brings us right back to logical omniscience.

