answer: |-
  First off, major props for digging into the *Principia* itself. Most people stop at the Wikipedia summary, but reading the actual text (even in translation) changes everything. You have spotted one of the most famous fault lines in the history of physics.

  To answer your specific question: **You aren't missing a logic step, but you have correctly identified the exact philosophical weak spot that kept physicists up at night for 200 years.**

  Here is the breakdown of why Newton wrote what he wrote, why that last sentence feels like a contradiction, and why your friend is right about General Relativity (even if they didn't explain *why*).

  ### 1. Newton's Logic: Forces as "Detectives"
  You interpreted the water climbing the walls as proof that space is a "thing" (an invisible tank). Newton agrees. But your confusion comes from this: *If we can't sense space, how can the water sensing it prove it exists?*

  Newton's logic relies on a distinction between **observing space** and **observing the effects of moving through space.**

  *   **Relative Motion:** If you slide a book across a table, that motion is relative to the table. No new forces appear just because it's moving.
  *   **Absolute Motion:** If you *spin* the book, you feel a force trying to throw it off the table.

  Newton's argument in the bucket passage is essentially: **"Relative motion produces no forces. Absolute motion produces forces."**

  When the water climbs the sides, it is experiencing an "endeavour to recede" (what we now call centrifugal force/inertia). Newton argues that since the water is flat when it's only moving relative to the bucket (Phase 1), but concave when it's moving relative to *space* (Phase 3), the force must be caused by rotation against space itself.

  So, to answer your question on the logic: Newton isn't saying we can see space. He's saying **we can detect space indirectly by the stress it puts on matter.** Think of it like wind. You can't see the air molecules directly, but if your hair blows back, you know the air is moving. Newton thinks the concave water is the "hair blowing back" that proves the "wind" of absolute space exists.

  ### 2. The "Weak Spot" You Found
  That last sentence you quoted is the money shot:
  > *"It is indeed a matter of great difficulty to discover... the true motions of particular bodies from the apparent; because the parts of that immovable space... do by no means come under the observations of our senses."*

  You felt this was him "having it both ways." You are in excellent company here. This is exactly what the philosopher **Gottfried Wilhelm Leibniz** (Newton's contemporary rival) argued.

  Leibniz said: *"If space is a real thing, show it to me. If you can't measure it, touch it, or see it, and the only proof you have is a mathematical assumption, then it's not physics, it's metaphysics."*

  Newton admits here that Absolute Space is **ontologically real** (it actually exists) but **epistemologically hidden** (we can't measure it directly). He is basically saying, "I know we can't see the stage, but the actors are tripping over it, so the stage must be there."

  Is this a weak spot? **Yes.** It relies on faith that "Absolute Space" is the only possible explanation for the force. It assumes there isn't some other reference frame we just haven't thought of yet.

  ### 3. Enter Ernst Mach (The Plot Twist)
  Fast forward 200 years. An Austrian physicist named **Ernst Mach** read your exact passage and said, "Newton is wrong."

  Mach proposed **Mach's Principle**. He argued that the water isn't curving because it's rotating against "Absolute Space." It's curving because it's rotating against **the fixed stars** (the rest of the mass in the universe).

  Mach's argument:
  *   Imagine the bucket is in a completely empty universe. Would the water still curve? Newton says yes. Mach says no.
  *   Mach argued that inertia (the "endeavour to recede") is caused by the gravitational influence of all the distant matter in the universe.
  *   So, the "invisible tank" isn't space; it's the average mass of the cosmos.

  This directly addresses your confusion. You asked: *"How does watching some water crawl up a bucket wall count as proof that [space] is really out there, rather than just proof that somethings going on that we haven't explained yet?"*

  **Mach's answer:** It *is* proof of something we haven't explained yet. It's not space; it's gravity from distant stars.

  ### 4. Why Your Friend Mentioned General Relativity
  Your friend was right, but they skipped the bridge. Here is the connection:

  1.  **Newton:** Space is a static, invisible stage. (The Bucket proves it).
  2.  **Mach:** No, space is nothing. Inertia comes from matter. (The Bucket is misleading).
  3.  **Einstein:** Read Mach. Loved Mach. Tried to build a theory where inertia comes from matter.

  When Einstein built **General Relativity**, he got rid of Newton's "immovable space." In GR, there is no rigid background tank. There is **spacetime**, and spacetime is flexible. It curves, it bends, and it interacts with matter.

  However, Einstein couldn't fully make Mach's Principle work. In General Relativity, if you spin a bucket in an empty universe, the water *still* curves. So, in a way, Newton was right that rotation is "absolute," but he was wrong about *what* it is absolute against. It's not against a rigid grid; it's against the local geometry of spacetime.

  ### Summary
  You didn't miss a logic step; you spotted the metaphysical assumption that Newton had to make to make his math work.

  *   **Newton's Defense:** We can't see space, but we can feel the forces generated by moving through it. (Like feeling wind without seeing air).
  *   **Your Critique:** That's circular logic. How do we know it's space and not just "some force we don't understand"?
  *   **History's Verdict:** You were right to be skeptical. That specific tension (Is space a thing? Or is it just relationships between objects?) is exactly what led to the revolution of the 20th century.

  You're arguing with Leibniz and Mach, two of the sharpest minds in history. Don't let the pop-science summaries convince you otherwise!
