answer: |-
  This is a compelling dramatic setup, and your writing group is right: grounding the friar's radicalism in theological authority makes him far more convincing than if he were motivated merely by anger or ambition. However, to give you the "texture" you're asking for, I need to offer a crucial historical and theological caveat that will actually make your friar *more* authentic, not less.

  ### The Historical/Theological Hurdle
  If your friar claims there is a "settled scholastic consensus" between Aquinas and John of Salisbury that a **private subject** has a **positive duty** to kill a tyrant, a knowledgeable reader (or a historian) will flag this.

  *   **John of Salisbury (*Policraticus*, c. 1159):** You are correct. He explicitly argues that killing a tyrant is not only lawful but "right and just" (*jus et justum*), and that the tyrant forfeits the protection of the law.
  *   **Thomas Aquinas (c. 1260s):** This is the tricky part. In *De Regno (On Kingship)*, Book I, Chapter 6, Aquinas explicitly argues **against** private individuals killing tyrants. He worries it sets a dangerous precedent and often leads to worse tyranny. He argues that action against a tyrant must come from "public authority" (the community or a superior).

  **However,** during the French Wars of Religion (specifically the Catholic League period, 1580s–90s), Dominican and Jesuit theologians *did* reinterpret Aquinas to support tyrannicide. They argued that a king who violates Divine Law forfeits his "public authority," effectively becoming a private criminal, at which point the restriction lifts.

  To make your friar sound like he has truly "worked through his Aquinas," he shouldn't claim Aquinas explicitly commands private murder. Instead, he should argue that **Charity (*Caritas*)** and the **Common Good (*Bonum Commune*)** create a moral necessity that overrides the general prohibition.

  Here is how to texture the citation to be historically plausible while keeping your scene's architecture.

  ### 1. The Aquinas Hooks (The "Texture")
  Your friar should reference specific concepts rather than just book titles. He needs to sound like he is applying a principle, not just quoting a rule.

  **A. *Summa Theologiae*, II-II, Question 64, Article 3 ("Whether it is lawful to kill sinners?")**
  *   **The Argument:** Aquinas argues that killing is lawful if done for the health of the whole body (the common good) by one who has care of the whole.
  *   **The Friar's Twist:** The friar argues that the Tyrant, by attacking the Church or the Common Good, has severed himself from the "body." Therefore, the duty to protect the body falls to any member capable of acting.
  *   **Key Phrase:** *"Quicumque periculum imminet toti corpori, a quocumque membro curari potest."* (When danger threatens the whole body, it may be cured by any member.)

  **B. *De Regno*, Book I, Chapter 6**
  *   **The Argument:** Aquinas admits that if there is **no human recourse** (*nullum humanum auxilium*), one must have recourse to God.
  *   **The Friar's Twist:** The friar argues that in the current political chaos, there *is* no human recourse (Parlements are silenced, Estates General ignored). Therefore, the "private" individual becomes the instrument of Divine recourse.
  *   **Key Phrase:** *"Deficiente judicio humano, judicium divinum supplet."* (When human judgment fails, Divine judgment supplies.)

  **C. The Argument from Charity (*Caritas*)**
  *   This is the strongest way to establish a "positive duty." Aquinas teaches that we are bound by charity to save our neighbor's life.
  *   **The Friar's Twist:** If the Tyrant is murdering the souls and bodies of the populace (your "neighbors"), standing by is a sin of omission. To kill the tyrant is an act of love for the victim.
  *   **Key Phrase:** *"Caritas non quaerit quae sua sunt."* (Charity seeks not its own things.) Or more aggressively: *"Tacere cum agi debet, consentire est."* (To be silent when one ought to act is to consent.)

  ### 2. Bridging to John of Salisbury
  You want a phrase that folds Salisbury into Aquinas as if they are one voice. Since Salisbury is older, the friar can treat him as the *exemplum* that clarifies Aquinas's *principium*.

  **Suggested Scholastic Formulation:**
  > *"As the Angelic Doctor [Aquinas] establishes the principle of the Common Good, so the Salisburiensis in his *Policraticus* provides the application: the tyrant is* **hostis humani generis** *—an enemy of the human race. And against a public enemy, every private man is a soldier."*

  **Latin Tag for the Scene:**
  > *"Quod Salisburiensis docet in exemplo, Thomas confirmat in principio."*
  > (What Salisbury teaches in example, Thomas confirms in principle.)

  ### 3. Sample Dialogue Texture
  Here is a draft of how the friar might speak, incorporating these elements to sound like a trained theologian rather than a firebrand:

  > "You hesitate because you see a King, anointed and crowned. I see a cancer. You cite the Summa, brother, and so do I. In the *Secunda Secundae*, Thomas teaches that to kill is lawful only for the health of the whole body. But listen closely: when the head itself becomes the disease, does the hand lose the right to strike it?
  >
  > "Thomas says action requires public authority. True. But Salisbury, in the *Policraticus*, shows us the exception: when the ruler violates the law of God, he strips himself of that authority. He becomes a private brigand. *Tyrannus est hostis publicus.*
  >
  > "So I ask you: if a brigand breaks into your home to murder your children, do you wait for a magistrate who will never come? Thomas says charity binds us to save our neighbor's life. If this King is murdering the souls of France, and you have the knife in your hand... to sheath it is not prudence. It is complicity. *Tacere cum agi debet, consentire est.* To be silent now is to kill them yourself."

  ### 4. Why This Works for Your Novel
  1.  **It respects the history:** It acknowledges that Aquinas is complicated, which makes the friar sound smarter. He isn't misquoting; he is *interpreting* aggressively, which is exactly what the Catholic League theologians (like Jean Boucher or William Rossaeus) did in the 1590s.
  2.  **It creates tension:** The wavering conspirator might actually know enough Aquinas to be worried. The friar's ability to override that worry with a higher argument (Charity/Desperation) shows his leadership and conviction.
  3.  **It keeps your architecture:** You still get the dual citation of Aquinas and Salisbury as the turning point, but now it rests on a foundation that will withstand scrutiny from readers who know the period.

  ### Recommended Reading for "Voice"
  If you want to capture the specific rhythm of late 16th-century League theology, look at the arguments in:
  *   ***Vindiciae contra Tyrannos*** (1579) - Though Huguenot, it uses similar scholastic logic.
  *   ***De justa Henrici tertii abdicatione*** (1589) by Jean Boucher. This is the actual text used by the League to justify killing Henry III. It is full of the exact scholastic distinctions your friar would use.

  By framing the argument as a matter of **Charity** and **Forfeiture of Status**, your friar remains a devout Dominican while advocating for regicide.
