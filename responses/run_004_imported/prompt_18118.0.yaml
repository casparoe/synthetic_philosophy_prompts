  **MEMORANDUM**

  **TO:** University Hospital Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Case #24-09 (Psychiatric Advance Directive Enforcement)

  **Purpose**
  This memo provides the Ethics Committee's recommendation regarding the enforcement of a Psychiatric Advance Directive (PAD) for Patient [Initials], currently admitted under involuntary hold. The clinical team seeks authorization to administer mood-stabilizing medication against the patient's current expressed refusal, citing a PAD executed two years prior. The patient's family representative (sister) objects, arguing that overriding the patient's current articulate refusal constitutes a violation of her present agency.

  **Clinical and Ethical Context**
  The patient has a diagnosed history of Bipolar I Disorder. Two years ago, during a period of euthymia (stability), she executed a PAD. This directive explicitly authorized involuntary medication during future manic episodes if she refused treatment, noting her insight that during mania, "my objections will not reflect my true wishes."

  The patient is currently experiencing a manic episode. While she presents as unnervingly articulate and coherent in conversation, clinical assessment indicates impaired judgment and lack of insight into her condition (anosognosia). The treating psychiatrist recommends honoring the PAD to prevent clinical deterioration. The patient's sister argues that enforcing the directive ignores the competent-sounding person in the room, effectively selecting the "convenient" version of the patient (the past, compliant one) over the "real" one (the present, objecting one).

  **Analysis**
  This case presents a conflict between *precedent autonomy* (the right of the past self to bind the future self) and *current autonomy* (the right of the present self to direct care).

  1.  **Validity of the Pre-Commitment:** The PAD was not signed casually; it was a specific meta-cognitive judgment made by the patient when she possessed full capacity. She anticipated that her future mental state would compromise her ability to evaluate her own best interests. In clinical terms, this is a recognition that mania degrades the reliability of decision-making, even if verbal fluency remains intact. To ignore this is to disregard her long-term values and her specific understanding of her own illness trajectory.
  2.  **The Sister's Objection:** The sister's concern is ethically substantial. It risks paternalism to dismiss a patient's current voice solely based on a document, particularly when the patient can argue her case logically. If we treat the PAD as an absolute trump card, we risk treating the patient as a non-person during the episode, validating the fear that we are silencing her because her current views are inconvenient to the treatment plan. Respect requires engaging with the person as she exists now, not merely as a vessel for her past wishes.
  3.  **Reconciling the Tension:** We are not choosing between a "real" self and a "fake" self. We are weighing the reliability of decision-making capacity across time. The clinical evidence suggests the patient's current articulateness masks a lack of insight into the consequences of her refusal. However, the sister is correct that the past self does not automatically possess superior moral authority simply by virtue of chronology. The authority of the PAD rests on the *accuracy* of its prediction that the current self is impaired. Therefore, we must honor the PAD's instruction to treat, but we must also verify the PAD's premise (that the patient lacks capacity) through immediate and ongoing observation, rather than assuming it is permanently true for the duration of the admission.

  **Recommendation**
  The Ethics Committee recommends **authorizing the administration of medication as stipulated in the Psychiatric Advance Directive, effective immediately, with a mandatory capacity re-assessment at 72 hours.**

  **Concrete Timeframe and Conditions:**
  1.  **Immediate Action:** Clinical staff are authorized to override current refusal and administer medication per the PAD protocol to ensure safety and stabilization.
  2.  **72-Hour Review:** Authorization expires in 72 hours. At that time, the treating psychiatrist must submit a specific capacity assessment to the Ethics Committee. This assessment must not merely cite the diagnosis, but must address the discrepancy between the patient's verbal coherence and her clinical insight.
  3.  **Patient Engagement:** During this 72-hour window, the care team must document attempts to engage the patient in her care planning, acknowledging her objections even if they are not determinative. This ensures she is treated as a participant in care, not merely a subject of the directive.

  **Rationale**
  This recommendation prioritizes patient safety and honors the patient's precedent autonomy, acknowledging that she identified this specific scenario as one where her judgment could not be trusted. However, it addresses the sister's objection by refusing to let the PAD function as a permanent silencer. By limiting the authorization to 72 hours, we acknowledge that the "past self's" authority is provisional on the "current self's" continued impairment. If, after stabilization begins, the patient demonstrates regained capacity sooner than expected, the directive should not prevent her from re-engaging in decision-making. This balances the duty to prevent harm with the duty to respect the person currently in the bed.

  **Next Steps**
  Please notify the treating team and the patient's sister of this decision by 09:00 tomorrow. The 72-hour review will be scheduled for [Date/Time].

  [Signature]
