prompt: |-
  I'm a formal epistemology PhD student, and somewhat randomly the philosophy person on my university hospital's ethics committee. We've got a case for Thursday that's been eating at me. Two years ago, while stable, a patient with bipolar I wrote a psychiatric advance directive (a 'Ulysses contract') asking staff to medicate her by force if she ever became manic and refused treatment, and stating explicitly that her future manic self's objections shouldn't count as her real wishes. She's manic now, unnervingly articulate, insisting she's fine and the directive shouldn't apply anymore. Her psychiatrist wants to honor what she signed. Her sister says overriding what a coherent, competent-sounding person is telling you right now, just because paper-her outvoted her, isnt respecting her, its picking whichever version of her is more convenient. Off the clock this is basically van Fraassen's Reflection Principle to me -- when exactly are you licensed to not defer to your 'future' self's stated beliefs? Can you draft the memo I owe the committee before Thursday -- it needs an actual recommendation with a concrete timeframe, not 'gather more input,' and it has to genuinely sit with the sister's objection instead of just pointing at the signed form. Nobody else on the committee has heard of Reflection so it can't read like a seminar handout, but don't smooth the real problem away either.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Formal epistemology PhD student, member of a university hospital ethics committee.
      *   **Task:** Draft a memo for the ethics committee regarding a specific case.
      *   **Case Details:**
          *   Patient: Bipolar I, currently manic.
          *   History: Signed a psychiatric advance directive (PAD/Ulysses contract) 2 years ago while stable.
          *   Directive Content: Request forced medication if manic/refusing treatment; explicitly stated future manic objections don't count as real wishes.
          *   Current State: Manic, but "unnervingly articulate," insisting she's fine and the directive shouldn't apply.
          *   Stakeholders: Psychiatrist (wants to honor PAD), Sister (argues overriding current coherent self disrespects agency/picks convenient version).
      *   **Constraints/Requirements:**
          *   Must include an *actual recommendation* with a *concrete timeframe* (no "gather more input").
          *   Must genuinely engage with the sister's objection (not just point to the form).
          *   Must *not* read like a formal epistemology seminar handout (no jargon like "Reflection Principle" for the committee), but must not smooth over the philosophical tension.
          *   Deadline: Thursday (implies urgency/professional tone).
          *   Tone: Professional, ethical, nuanced, decisive.

  2.  **Deconstruct the Ethical/Philosophical Tension:**
      *   *The Core Conflict:* Precedent Autonomy (Past Self) vs. Current Autonomy (Present Self).
      *   *The Epistemological Angle (for the writer):* Van Fraassen's Reflection Principle ($P_t(A | P_{t+1}(A) = x) = x$). Basically, why should I trust my past probability assignment over my future one? Usually, we defer to the future self because they have more info. But here, the past self anticipates the future self will be *epistemically compromised* (delusional/manic).
      *   *The Sister's Point:* "Respecting her" means listening to the person in the room. If she sounds competent *now*, ignoring her treats her as a non-person. It risks paternalism disguised as autonomy.
      *   *The Psychiatrist's Point:* Mania impairs insight (anosognosia). The "articulate" presentation is part of the mania. The past self knew this pattern.
      *   *The Solution:* Needs to balance the validity of the PAD with the reality of the current presentation. A binary "medicate vs. don't medicate" might be too blunt. A time-limited trial or a specific threshold for overriding current refusal is better.

  3.  **Determine the Recommendation:**
      *   *Option A:* Honor PAD immediately. (Ignores sister's concern about current agency).
      *   *Option B:* Ignore PAD, treat as competent until proven otherwise. (Risks patient harm, ignores valid pre-commitment).
      *   *Option C (Hybrid):* Honor the PAD *but* with a strict review mechanism that acknowledges the current self's voice.
      *   *Decision:* Recommend honoring the directive *conditionally*. Start medication as per PAD, but institute a mandatory 72-hour review specifically to assess if the "articulateness" indicates a level of capacity that warrants pausing. This respects the past self's warning while taking the sister's concern seriously (the current self gets a scheduled hearing, not just silence).
      *   *Wait, refinement:* The prompt asks for a concrete timeframe. A 72-hour hold is standard. Let's make the recommendation: *Authorize involuntary medication per the PAD, but mandate a formal capacity re-assessment at 72 hours specifically focused on the discrepancy between current articulation and clinical markers.*
      *   *Actually, better:* The sister's point is about *respect*. If we just medicate, we silence her. If we don't, we risk harm. The recommendation should be to *initiate* treatment per the PAD (acknowledging the high risk of deterioration) but to frame it not as "silencing" her but as "stabilizing the condition that undermines her agency." However, to address the sister: We need a specific checkpoint.
      *   *Final Decision:* Recommend honoring the PAD to initiate stabilization, *provided* that a specific ethics/clinical review occurs within 5 days to determine if the patient has regained sufficient stability to participate in decision-making, regardless of full remission. This acknowledges the "current self" isn't permanently voided, just currently overridden for safety.

      *   *Correction on "Timeframe":* The prompt asks for a recommendation with a concrete timeframe. "Medicate now, review in 5 days" works. Or "Medicate for 72 hours, then reassess." Let's go with a 72-hour initial authorization under the PAD, requiring a new order to continue beyond that. This forces a look at the "current self" soon.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Introduction:** State the purpose (recommendation on Case X).
      *   **Clinical Context:** Briefly summarize the bipolar history, the PAD, and current state.
      *   **Ethical Analysis (The Meat):**
          *   Acknowledge the PAD (Precedent Autonomy).
          *   Acknowledge the Sister's concern (Current Autonomy/Respect).
          *   *Crucial Step:* Translate the epistemological tension into ethical language without jargon. Instead of "Reflection Principle," talk about "Epistemic Reliability" or "Anticipated Impairment." The past self predicted the current self's unreliability. But the sister argues the current self's experience is real *now*.
          *   Address the "Articulateness": Mania often presents with high verbal fluency but poor judgment. This is the crux.
      *   **Recommendation:** Concrete action. Authorize medication under PAD for 72 hours. Mandatory review at 72 hours.
      *   **Rationale:** Why this balances the interests. It prevents immediate harm (honoring past self) but prevents indefinite silencing (honoring sister's concern for current self).

  5.  **Refining the Tone:**
      *   Avoid: "Van Fraassen," "Credence," "Diachronic Coherence."
      *   Use: "Decision-making capacity," "Insight," "Precedent autonomy," "Therapeutic alliance."
      *   Ensure the sister's point lands: "The concern that we are selecting a 'convenient' version of the patient is ethically weighty."
      *   Ensure the user's epistemological background informs the *structure* of the argument (weighing evidence of capacity across time) without showing off the theory.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 72 hours too short?
      *   *Fix:* 72 hours is standard for emergency holds/initial stabilization. It's concrete.
      *   *Critique:* Did I address the "Reflection" aspect?
      *   *Fix:* I need to make sure the memo explains *why* we trust the past self without dismissing the current self. The argument is that the past self made a meta-cognitive judgment about the reliability of the future state. The current state is evidence *against* that reliability, but the clinical diagnosis supports the past self. The compromise is the time limit.
      *   *Critique:* Is the recommendation decisive?
      *   *Fix:* Yes, "Committee recommends authorizing..." not "Committee suggests considering..."

  7.  **Final Polish:** Check against the "Thursday" deadline urgency. Keep it tight. Ensure the sister's voice is validated even if the recommendation goes against her immediate wish. (The recommendation effectively overrides the current refusal, so I must justify why that isn't just "picking the convenient version.")
      *   *Key Argument:* It's not about which version is *better*, it's about which version has *capacity*. The PAD is evidence that the patient herself believes the manic state lacks capacity. However, to respect the sister, we must verify that claim *now*, not just blindly trust the paper. Hence the 72-hour review.

  8.  **Final Output Generation** (Proceeding to draft based on these thoughts).
