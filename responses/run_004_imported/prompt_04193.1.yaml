answer: |-
  **Setting:** *A sunlit corner of a university library, long after the students have gone. Two old colleagues, Dr. Elena Vance (a philosopher of physics with a background in field theory) and Dr. Julian Thorne (a theoretical physicist turned relational advocate), sit amidst stacks of papers on general relativity and shape dynamics.*

  **Vance:** You know, Julian, I've been reading Barbour's latest papers again. The elegance of Best Matching is undeniable. To define velocity not as a derivative against a clock, but as the minimal distance between configurations in Superspace... it's poetic. But I keep coming back to your retirement hobbyhorse: the price of this poetry.

  **Thorne:** The price being?

  **Vance:** Holism. To determine the motion of a single particle in your lab, Best Matching requires you to minimize the difference between the current configuration of the universe and the next one *over the entire universe*. You have to know the position of every galaxy to say if this gyroscope is spinning. That sounds less like eliminating absolute structure and more like making the entire universe the absolute structure.

  **Thorne:** That's the standard substantivalist retort, Elena. But you're conflating "background" with "global constraint." In Newtonian mechanics, absolute space is a container. It exists even if empty. It tells the water in the bucket to curve. In Best Matching, there is no container. There are only Nows—snapshots of relative distances. The "holism" you complain about isn't a stage; it's a consistency condition. It's the requirement that the universe be a closed system.

  **Vance:** A consistency condition that functions exactly like a reference frame. If I have to scan the cosmic horizon to define local inertia, the cosmic horizon *is* my reference frame. And let's talk about the specific constraint you glossed over: the zero total angular momentum. Barbour's derivation of the bucket effect relies on the universe having $J_{total} = 0$. If the universe had a net spin, your Best Matching fails to recover Newtonian dynamics locally without residue.

  **Thorne:** Because if the universe had a net spin, spin relative to what?

  **Vance:** Relative to the metric field! Look, let's pare down my position. I'm not a Newtonian container-substantivalist. I don't believe in a void that swallows things. I am a metric field realist. Spacetime is a substance, but it's a dynamical one. It has degrees of freedom. It carries energy. When the water curves in the bucket, it is accelerating relative to the local metric field. That field is determined by the distribution of mass-energy, yes, but it has an existence independent of any specific particle.

  **Thorne:** But where does the metric live, Elena? On a manifold. And what is the manifold? A set of points with topological structure. You've stripped away the rigid grid, but you've kept the points. You still have *haecceity*—the "thisness" of a spacetime point. If I swap two points in your manifold and drag the metric field with them, your mathematics says it's a different state, even if all physical observables are identical. That's the Hole Argument. You're haunted by ghosts.

  **Vance:** I'm not haunted; I'm resolved. I accept that diffeomorphism invariance means the points have no physical identity *independent* of the field. But the field itself is real. My point is about your trade-off. You claim to remove absolute structure to save relationism. But to make it work, you impose a global constraint (Best Matching) and a global boundary condition ($J=0$). Is a global constraint that dictates local dynamics any less "absolute" than a metric field? You've relocated absolutism from the local background to the global boundary.

  **Thorne:** It's not a boundary condition imposed from the outside. It's a selection principle. Why is the universe closed? Because if it weren't, we wouldn't be able to define physics. The $J=0$ condition isn't a restriction on the universe; it's a restriction on what counts as a universe. If $J \neq 0$, there is an external reference. But there is nothing outside the universe. Therefore, $J$ must be zero. It's tautological, not contingent.

  **Vance:** It's contingent on your theory being true! In my view, the metric field can support a rotating universe solution (Gödel metric, for instance). It's weird, but it's allowed. In your view, such a universe is impossible *by definition*. That seems like you're legislating physics to fit your philosophy. And don't get me started on York Time. You trade four-dimensional spacetime for evolving conformal geometry plus a global time parameter. You killed absolute time in the name of Mach, then brought it back as York time.

  **Thorne:** York time isn't absolute. It's not a clock ticking in the void. It's a measure of the mean extrinsic curvature of the spatial slice. It's derived from the geometry of the change itself. It's the "size" of the universe acting as a clock.

  **Vance:** A clock that ticks simultaneously everywhere. That's non-local.

  **Thorne:** Quantum mechanics is non-local. Gravity is non-local in the sense that the constraint equations are elliptic. Why is non-locality a sin only for relationists? When you solve the Einstein constraint equations for your initial data, you have to solve them on the whole slice. You can't just set the metric here without knowing the matter distribution there. Your "metric field realism" is already holistic.

  **Vance:** There is a difference between dynamical non-locality and definitional non-locality. In GR, the metric at a point is determined by causal propagation from the past light cone, subject to constraints. I can measure the metric locally with a ruler and a clock. I don't need to call Andromeda to measure the curvature here. In Best Matching, to define *velocity* here, I fundamentally need the configuration there. You've made local kinematics dependent on global topology. You say you've eliminated absolute space, but you've made the "Whole" the absolute agent.

  **Thorne:** I'd say I've made the "Whole" the only reality. The parts are abstractions. Look, Elena, consider the alternative. If you keep the metric field as a substance, you have to explain why it couples to matter exactly the way it does. Why does the metric tell matter how to move, and matter tell the metric how to curve? In Shape Dynamics, that's built in. The geometry *is* the relations of the matter. There's no coupling problem because there aren't two things to couple.

  **Vance:** But you pay for that unity with intelligibility. If I want to know why my gyroscope precesses, I calculate the frame-dragging from the Earth's rotation using the metric. It's local, causal, and clear. If I ask you, you say, "Because the best match between the universe's current shape and its future shape requires it." That's a variational principle, not a mechanism. It explains *that* it happens, but it obscures *how*. It feels like action-at-a-distance disguised as geometry.

  **Thorne:** Is the Principle of Least Action action-at-a-distance? We use Lagrangians everywhere. Best Matching is just a Lagrangian for the universe's shape. As for the "how," maybe there is no "how" other than the path of least resistance in configuration space. You accuse me of smuggling in absolutes via holism. I accuse you of smuggling in absolutes via the manifold. You say the metric field is real. But without the matter, what distinguishes a point $p$ from point $q$ in your empty manifold? Nothing. So the structure is purely relational anyway. Why not admit it and drop the ghostly substrate?

  **Vance:** Because the substrate carries the causal structure! The light cones are real. In your conformal geometry, you have to recover the local speed of light as an emergent phenomenon. You have to work hard to get causality back. I start with it. The metric field *is* the causal structure. If I strip that away to save relationism, I risk losing the very thing that makes physics predictive locally. Your holism threatens to make local physics hostage to global fluctuations. If a galaxy collapses on the horizon, does my local inertial frame shift instantly in your theory?

  **Thorne:** In Shape Dynamics, the constraints propagate. It's not instantaneous signaling. The "instant" is a slice of constant York time. But yes, the definition of the slice is global. But Elena, be honest. When you solve the Hamiltonian constraint in GR, you are doing the same thing. You are selecting a slice of spacetime that satisfies a global condition. The difference is ontological, not mathematical. I say the slice is fundamental; you say it's a cross-section of a 4-block.

  **Vance:** The ontological difference is everything! If the 4-block is real, then the past is fixed. The metric exists. If your Nows are fundamental, then time is real passage, but the "laws" are just rules for navigating Shape Space. My worry is this: You criticize Newton for needing Absolute Space to explain the bucket. But your Best Matching needs the "Universe" to act as a single rigid body to define rotation. If the universe is the reference frame, and the universe is the only thing that exists, then the Universe *is* Absolute Space. You've just capitalized the name.

  **Thorne:** *laughs* Perhaps. But it's an Absolute Space that has no existence independent of its contents. Newton's space could exist empty. Mine cannot. If you remove the matter, you remove the shapes. You remove the space. That is the core of relationism. The holism is the cost of ensuring there is no "empty stage."

  **Vance:** And the cost of that is that you can't easily talk about subsystems. You can't do local physics without assuming the rest of the universe cooperates with your boundary conditions. It makes the autonomy of experimental physics—which you practiced for decades, Julian—philosophically precarious.

  **Thorne:** Autonomy is an approximation. A good one. Just as your metric field is a good approximation of the underlying shape dynamics in the low-energy limit. We both have ghosts, Elena. Yours live in the manifold points; mine live in the global constraints.

  **Vance:** True. But my ghosts are localizable. Yours are everywhere at once.

  **Thorne:** And mine ensure that no point is privileged. Isn't that what we wanted?

  **Vance:** I suppose. But I'd rather have a local ghost than a global one. At least I can exorcise the local one with a coordinate transformation.

  **Thorne:** And I'd rather have a global constraint than a background field that pretends to be dynamical but still dictates the rules of the game. But... I will concede this: If we ever find the universe has a non-zero angular momentum, I'm buying you a drink and admitting Newton was right about the bucket.

  **Vance:** And if we ever detect a physical effect that depends on the manifold points independent of the metric, I'll admit the container exists. Until then, we're stuck with our respective holisms.

  **Thorne:** Stuck, but moving. Relative to each other, of course.

  **Vance:** Naturally. Though in your theory, I'm not sure "moving" means what we think it does.

  **Thorne:** *smiles* That's the point, Elena. That's the point.
