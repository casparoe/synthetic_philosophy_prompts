answer: |-
  This is a remarkably high-quality BBQ argument. Most people argue about politics; your family is arguing about Scholastic political theology. Both your brother-in-law (BIL) and the friend are actually touching on real textual evidence, but they are emphasizing different parts of Aquinas's corpus.

  Aquinas is notoriously difficult to pin down on this because he wrote about it in two different places with slightly different tones: *De Regno* (On Kingship), which is earlier and perhaps more enthusiastic about removing tyrants, and the *Summa Theologiae*, which is his mature work and is much more cautious about social order.

  Here is the move-by-move breakdown, who wins the round, and what they are both missing.

  ### Round 1: The Opening Salvo
  *   **BIL Claim:** Aquinas said it's fine to kill a tyrant and the killer should be honored.
  *   **Friend Claim:** Overstated. Aquinas insisted on "public authority," not private individuals.
  *   **The Verdict:** **Point to the Friend.**
  *   **Why:** Your BIL is quoting a famous line from *De Regno* (Book I, Chapter 6): *"To kill a tyrant is not only permissible, but even right and meritorious."* That quote exists. However, the Friend is correct about the broader context of Aquinas's moral theology. In the *Summa Theologiae*, Aquinas argues that killing is generally reserved for "public authority" (the state). For a private individual to kill a ruler is usually classified as sedition or murder, because it disrupts the social order. The BIL took the most sensational sentence out of context; the Friend correctly identified the structural constraint Aquinas places on violence.

  ### Round 2: The Usurper Distinction
  *   **BIL Claim:** Aquinas distinguishes between a usurper (illegal power) and a legitimate ruler gone bad. Anyone can move against a usurper.
  *   **Friend Claim:** (Wait for her rebuttal in Round 3, but let's judge BIL's point here).
  *   **The Verdict:** **Point to the BIL (with reservations).**
  *   **Why:** The BIL is technically correct on the taxonomy. Aquinas does distinguish between a *tyrannus ex defectu tituli* (a tyrant by defect of title/usurper) and a *tyrannus ex parte exercitii* (a tyrant by exercise/legitimate ruler who rules badly). Aquinas suggests that a usurper has no claim to authority, so resisting them isn't technically sedition. However, the BIL stretches it by saying "pretty much anyone can move against." Aquinas still prefers that if there is a superior authority (like an Emperor over a King), you appeal to them. He doesn't explicitly issue a "vigilante license," but he is much more open to resistance here than with a legitimate king.

  ### Round 3: The Consequence Argument
  *   **Friend Claim:** Aquinas spends more time warning that killing leads to worse tyrants and civil war than cheering it on. Calling it "approval" is misleading.
  *   **The Verdict:** **Strong Point to the Friend.**
  *   **Why:** This is the Friend's strongest move. In *De Regno*, immediately after the "meritorious" line, Aquinas pivots to warn that attempting to kill a tyrant often leads to the death of the liberator and even harsher tyranny from the successor. He writes that many have tried to kill tyrants and only made things worse. In the *Summa*, he argues that if overthrowing a tyrant causes more disorder (sedition) than the tyranny itself, you shouldn't do it. The Friend is right that Aquinas's *pastoral* advice is usually "don't do it," even if his *theoretical* advice allows for it under strict conditions.

  ### Round 4: The Caveats Defense
  *   **BIL Claim:** All moral permissions have caveats. That doesn't make it not a permission. She's moving goalposts.
  *   **The Verdict:** **Draw (Logic win for BIL, Application win for Friend).**
  *   **Why:** Logically, the BIL is right. Self-defense is a moral permission, but it has huge caveats (proportionality, immediacy, etc.). That doesn't mean self-defense isn't real. However, the Friend isn't moving goalposts; she is arguing about the *weight* of the permission. If a permission comes with so many caveats that it is rarely applicable in reality (i.e., "only if you have public authority, or if he's a usurper, and only if it won't cause civil war, and only if there's no superior to appeal to"), summarizing it as "Aquinas approved of tyrannicide" is misleading for a modern audience. The BIL wins on technicality; the Friend wins on spirit.

  ---

  ### What They Are Both Missing

  While the Friend was more accurate overall, they both missed three crucial nuances that would have settled the argument.

  **1. The "Recourse to God" Clause**
  This is the biggest omission. In *De Regno*, after discussing all the human ways to remove a tyrant, Aquinas concludes that if there is no human remedy (no public authority, no superior lord, no way to depose him without destroying the kingdom), the only remaining option is **prayer**. He explicitly says the people must turn to God, who can change the tyrant's heart. Your BIL missed this because it undermines the "action" angle; the Friend missed it because it undermines the "absolute prohibition" angle.

  **2. The Textual Tension (*De Regno* vs. *Summa*)**
  They are arguing as if Aquinas said one thing. He didn't.
  *   ***De Regno*** is a youthful work (possibly unfinished) and is more "hot" on the idea of removing tyrants. This is where the BIL's quotes come from.
  *   ***Summa Theologiae*** is his mature masterpiece. Here, he is much more concerned with stability and the sin of sedition. This is where the Friend's "public authority" constraint comes from.
  *   **The Missing Context:** Scholars generally treat the *Summa* as Aquinas's more refined position. If you have to choose one, the Friend's view aligns better with his mature theology.

  **3. The Definition of "Public Authority"**
  They both treat "public authority" like a modern bureaucracy. For Aquinas, this could mean a council of nobles, a parliament, or a superior king. He isn't saying "wait for a vote." He is saying "the act of removal must be done by the body that represents the community, not a lone assassin." If a representative body declares the tyrant deposed, and someone executes that sentence, Aquinas is okay with it. If a lone guy decides the King is bad and stabs him, Aquinas calls that murder. The BIL missed the "representative" aspect; the Friend made it sound too passive.

  ### Final Scorecard

  *   **Brother-in-Law:** He wins on **enthusiasm and specific quotes**. He found the "smoking gun" quote in *De Regno*. However, he treated a heavily qualified theoretical permission as a general moral rule.
  *   **Sister's Friend:** She wins on **accuracy and weight**. She correctly identified that Aquinas's *overall* system is designed to prevent private violence and that his practical advice is usually against assassination.

  **Who won the BBQ?**
  **The Friend.**
  While the BIL isn't lying about the quote, the Friend correctly identified that quoting the exception without the rule is misleading. Aquinas is not a patron saint of revolutionaries; he is a patron saint of order who reluctantly admits that sometimes order breaks down.

  **How to settle it at the next BBQ:**
  Tell them Aquinas's final answer is: *"If you can depose him through the law or a superior authority, do it. If you can't, and killing him will cause a civil war, pray. If you kill him on your own authority, you're probably going to hell."*
