prompt: |-
  So my brother-in-law's been on a big medieval philosophy youtube kick and it somehow turned into an argument with my sister's friend at a bbq last weekend, of all things about killing dictators. He started it, saying something like "even Aquinas, a literal saint, basically said its fine to kill a tyrant, and that the guy who does it should basically be honored for it." She said that's way overstated -- that Aquinas mostly insisted it had to go through "public authority," not some random guy deciding on his own that his king's gotta go, and that Aquinas was actually pretty nervous about private individuals making that call themselves. He came back with: ok, but Aquinas drew a real line between a tyrant who seized power illegally (a usurper) and one who's just a legit ruler gone bad, and for the usurper type he basically says they're just a criminal that pretty much anyone can move against, so it's not "always defer to the government" across the board. She said sure, but even in the usurper case Aquinas spends way more of his actual writing warning that killing the guy usually just gets you a worse tyrant and years of civil war than he does cheering the killing on, so summing it up as "Aquinas approved of tyrannicide" is kind of misleading. He said every moral permission anyone's ever handed out comes with a pile of caveats, that doesn't make it not a real permission, so now she's just moving the goalposts. Neither of them budged and honestly I don't know enough medieval philosophy to referee it myself. Can you go through their back and forth move by move, say who's got the better of it at each stage, and point out anything about what Aquinas actually thought that you think they're both missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A BBQ argument between the user's brother-in-law (BIL) and sister's friend (Friend) about medieval philosophy, specifically Thomas Aquinas and tyrannicide.
      *   **Task:** Evaluate the argument move-by-move, determine who has the better of it at each stage, and identify what both might be missing regarding Aquinas's actual views.
      *   **Tone:** Informative, neutral, analytical, accessible (since the user admits lack of expertise).

  2.  **Deconstruct the Argument:**
      *   **BIL Move 1:** Aquinas (a saint) said it's fine to kill a tyrant, and the killer should be honored.
      *   **Friend Move 1:** Overstated. Aquinas insisted on "public authority," not private individuals. He was nervous about private killing.
      *   **BIL Move 2:** Distinction between *tyrannus ex defectu tituli* (usurper) vs. *tyrannus ex parte exercitii* (legit ruler gone bad). For usurpers, anyone can move against them (they are criminals).
      *   **Friend Move 2:** Even for usurpers, Aquinas warns more about consequences (worse tyrant, civil war) than cheering killing. Calling it "approval" is misleading.
      *   **BIL Move 3:** All moral permissions have caveats. That doesn't negate the permission. She's moving goalposts.

  3.  **Fact-Check against Aquinas's Texts:**
      *   *Key Text:* *De Regno* (On Kingship), specifically Book I, Chapters 6-7. Also *Summa Theologiae* (II-II, Q. 42, A. 2 on sedition; Q. 64 on killing).
      *   *Core Position:* Aquinas generally opposes private individuals killing tyrants. He prefers public authority or divine intervention.
      *   *Usurper Distinction:* Aquinas does distinguish between a ruler who gains power unjustly (usurper) and one who rules unjustly. However, does he say *anyone* can kill a usurper?
          *   *De Regno I.6:* "To kill a tyrant is not only permissible, but even right and meritorious." *Wait, check context.* This is often quoted, but Aquinas is actually recounting *others'* views or discussing specific historical contexts (like Old Testament or Roman law) before qualifying it.
          *   *Correction:* In *De Regno* I.6, Aquinas discusses the removal of tyrants. He says if there is a right to appoint the ruler, there is a right to depose him. If no human remedy exists, one must turn to God.
          *   *The "Merit" Quote:* The famous line "To kill a tyrant is not only permissible, but even right and meritorious" (*Non solum permittitur, sed etiam praemia merentur*) is often attributed to Aquinas. *Actually*, this is a specific reference to a decree of the Council of Constance (1415) condemning Jean Petit, or sometimes misattributed from earlier canon law. Wait, let's verify.
          *   *Verification:* In *De Regno* I.6, Aquinas writes: "To kill a tyrant is not only permissible, but even right and meritorious." *However*, many scholars argue this text's authorship is disputed or he is citing secular law/custom rather than his own moral theology. In *Summa Theologiae* II-II, Q. 42, Art. 2, he condemns sedition and suggests that overthrowing a tyrant can *cause* sedition. In II-II, Q. 64, Art. 3, he discusses killing sinners, but requires public authority.
          *   *Consensus:* Aquinas is generally cautious. He prefers deposition by public authority. He is very skeptical of private tyrannicide.
      *   *Usurper vs. Legit Tyrant:* Aquinas does make a distinction. A usurper has no claim. A legitimate ruler who becomes tyrannical is harder to remove.
      *   *Consequences:* Aquinas definitely warns about the chaos resulting from attempted tyrannicide (civil war, worse tyranny).

  4.  **Evaluate Each Move:**

      *   **BIL Move 1:** "Aquinas... basically said its fine to kill a tyrant, and that the guy who does it should basically be honored."
          *   *Verdict:* Oversimplified. There is a quote that sounds like this, but it lacks the crucial context of *who* does the killing.
          *   *Winner:* Friend (for nuance).

      *   **Friend Move 1:** "Aquinas mostly insisted it had to go through 'public authority,' not some random guy... nervous about private individuals."
          *   *Verdict:* Accurate to the *Summa*. Aquinas aligns killing with the function of the state (public authority). Private killing is murder/sedition.
          *   *Winner:* Friend.

      *   **BIL Move 2:** "Drew a real line between... usurper... and... legit ruler gone bad... for the usurper type he basically says they're just a criminal that pretty much anyone can move against."
          *   *Verdict:* Partially true on the distinction, but "anyone can move against" is risky. Aquinas suggests if there is a superior authority, appeal to them. If not, turn to God. He doesn't explicitly greenlight vigilante justice even for usurpers without qualification.
          *   *Winner:* Draw/Leaning Friend. BIL has a textual hook (*De Regno*), but stretches the "anyone" part.

      *   **Friend Move 2:** "Aquinas spends way more of his actual writing warning that killing the guy usually just gets you a worse tyrant and years of civil war than he does cheering the killing on."
          *   *Verdict:* Strong point. Aquinas is a pragmatist regarding the common good. If the remedy is worse than the disease, don't do it.
          *   *Winner:* Friend.

      *   **BIL Move 3:** "Every moral permission anyone's ever handed out comes with a pile of caveats, that doesn't make it not a real permission."
          *   *Verdict:* Logically sound principle, but applies poorly here because the "permission" is so heavily restricted it's almost non-existent for private actors.
          *   *Winner:* BIL (on logic), Friend (on application).

  5.  **Identify Missing Context (The "Third Party" Analysis):**
      *   **Textual Issues:** *De Regno* is unfinished and some authorship is debated. The *Summa* is his mature work and is more cautious.
      *   **Public vs. Private:** This is the crux. Aquinas is a statist (in the medieval sense). Violence is the monopoly of the public authority.
      *   **The "Merit" Quote:** It exists in *De Regno*, but needs to be read alongside the warnings in the same chapter.
      *   **Sedition:** Aquinas defines sedition as opposing the unity of the people. Overthrowing a tyrant *can* be sedition if it causes more division.
      *   **Divine Intervention:** Aquinas often concludes that if no human remedy exists, pray. That's a huge caveat.

  6.  **Drafting the Response:**
