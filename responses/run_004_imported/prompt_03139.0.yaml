  9.  *(Final check of the "Merit" quote)*: The specific line "Non solum permittitur, sed etiam praemia merentur" is indeed in *De Regno*, I.6. However, scholars note Aquinas is often summarizing the position of secular law or earlier thinkers there before offering his own synthesis which is more cautious. I should mention this tension.

