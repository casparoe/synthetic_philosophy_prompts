      *   Check the Rotating Disc. Ensure it's clear that perdurantists need primitive "vector properties" on slices, which is arguably just as mysterious as adverbial instantiation.

  8.  **Final Review against constraints:**
      *   Did I argue strongly? Yes.
      *   Did I address the "smuggling" charge? Yes.
      *   Did I use the rotating disc? Yes.
      *   Did I avoid citation hunting? Yes.
      *   Is it relevant to the SSC/LW context? Yes, will frame it that way.

