answer: |-
  This is a classic move in the LessWrong/SSC adjacent sphere: dissolve the intuition pump by denying the ontology that makes the pump work. If "you" are just a spacetime worm, then the upload is just a branching worm, and the "problem" of identity is merely a confusion about reference. But Lewis's dismissal of the endurantist alternative—specifically the adverbial modification of instantiation—is far too glib. It treats a robust metaphysical position as a linguistic trick.

  Here is the case that Lewis is wrong to treat adverbialism as a desperate patch, and why maintaining that objects are **wholly present** is ontologically cheaper and phenomenologically superior to slicing reality into temporal parts.

  ### 1. The Charge of "Mystery" is a Category Error
  Lewis's core objection to adverbialism (the view that an object instantiates a property *time-ly*) is that it treats the instantiation relation as a mysterious primitive. He argues that we understand "instantiation" as a dyadic relation (Object $\rightarrow$ Property). To say an object instantiates bent-ness *t-ly* is to invent a new, unexplained relation just to save the phenomenon of endurance.

  But this criticism cuts both ways. Lewis assumes the dyadic instantiation relation is the "natural" one. Why? We never encounter objects outside of time. Every empirical instance of "having a property" is already temporally situated. To insist that instantiation must be dyadic *simpliciter* is the actual abstraction; to acknowledge that instantiation is fundamentally a triadic relation (Object, Property, Time) or a dyadic relation modified by a mode (Time) is actually more faithful to the data.

  Consider the grammar of action. If I say "John runs," and then "John runs quickly," I haven't posited two different Johns, nor have I posited a "quick-John" temporal part. I have modified the *mode* of the running. Adverbialism treats temporal qualification exactly this way. It is not smuggling in temporal parts; it is acknowledging that **existence in time is a mode of having properties, not a criterion for parthood.**

  Lewis calls this "magic." But perdurantism requires its own magic: the **composition of temporal parts.** Why do these distinct temporal slices compose a single object? What binds $t_1$-John to $t_2$-John? Perdurantists usually appeal to causal continuity or similarity. But if you need a further principle to glue the slices together into a "worm," you haven't eliminated the mystery of persistence; you've just moved it from the *object* to the *fusion rule*. Adverbialism keeps the object unified by default; perdurantism has to build unity out of diversity. That is the more expensive ontological commitment.

  ### 2. The "Wholly Present" Intuition isn't Just Folk Physics
  The LessWrong crowd often dismisses the "wholly present" intuition as folk metaphysics that should be discarded in favor of the block universe. But this intuition tracks something vital about **agency and moral responsibility**, which matters for your upload/EM debate.

  If perdurantism is true, *you* (the whole worm) never actually sit, stand, think, or suffer. Only your temporal parts do those things. The "you" that extends from birth to death is a static entity in the block universe that contains sitting-parts and standing-parts. This creates a disconnect between the subject of experience and the subject of metaphysics.

  When I feel pain, *I* feel it. Not a temporal slice of me. If perdurantism is true, the "I" that is the worm is never in pain; only a part is. This leads to a fragmentation of the self that makes nonsense of prudential concern (why should I care about my future slices?) and moral responsibility (why punish the whole worm for a crime committed by a slice?).

  Adverbialism preserves the unity of the agent. It allows us to say that the *same* entity that committed the crime is the one being punished, because it is the same entity that exists at both times, merely instantiating properties differently. This isn't just semantic; it's the only view that grounds the continuity required for the "personal identity" concepts your friend group is debating. If you upload a mind, the perdurantist says you've created a new worm that overlaps with the old one at the start. The endurantist asks: **Did the substance that was me cease to exist, or did it continue?** That is not a verbal dispute; it is a question about whether the causal chain preserves the *mode of existence* of the subject.

  ### 3. The Rotating Homogeneous Disc: Perdurantism's Skeleton in the Closet
  You mentioned the rotating disc worry, and it is devastating ammunition here. It shows that perdurantism cannot actually account for dynamic facts without smuggling in endurance-like primitives.

  Imagine a perfectly homogeneous disc. It exists for a duration.
  *   **Scenario A:** It is stationary.
  *   **Scenario B:** It is rotating.

  In both scenarios, every temporal slice of the disc is qualitatively identical. It's a perfect circle of uniform mass. There is no difference in the intrinsic properties of any temporal part between Scenario A and Scenario B. If objects are just fusions of temporal parts, and the parts are identical, the wholes must be identical.

  To save perdurantism, you have to say that the temporal parts possess **primitive velocity vectors** or some other dynamic property that isn't reducible to position-over-time. But this is suspicious. It looks like the perdurantist is attaching a "tendency to endure" or a "direction of persistence" to each slice. They are effectively admitting that the slice isn't just a static being; it has a built-in vector pointing toward the next slice.

  But if you need to build a "direction of persistence" into your temporal parts to explain rotation, **you have reintroduced the very notion of persistence through time that you claimed to eliminate.** You've just hidden it inside the intrinsic properties of the parts.

  The endurantist has no problem here. The disc is wholly present at $t_1$ and $t_2$. In Scenario A, it instantiates position $P$ at $t_1$ and $P$ at $t_2$. In Scenario B, it instantiates position $P$ at $t_1$ and $P^*$ at $t_2$. The change is real, the object is the same, and the rotation is grounded in the different properties instantiated by the *same* substance over time. The perdurantist has to pay an extra ontological tax (primitive vectors on slices) to explain what the endurantist gets for free (change in a persistent object).

  ### 4. Intrinsicality is Preserved, Not Destroyed
  Lewis argues that if you say "bent-at-t," you have turned an intrinsic property (shape) into a relation to a time, which is absurd. A thing's shape should depend on how it is, not on what time it is.

  Adverbialism agrees with Lewis here! That is why it is superior to the "Relationalist" endurantism Lewis usually lumps it with.
  *   **Relationalism:** $O$ has the property *Bent-at-t*. (Property is extrinsic).
  *   **Adverbialism:** $O$ has the property *Bent*, and it has it *t-ly*. (Property is intrinsic; *having* is modified).

  Lewis dismisses this distinction as verbal. It is not. It respects the intuition that my shape is about *me*, not my relation to a clock. The clock tells us *when* I have the shape, not *what* the shape is. By modifying the instantiation relation rather than the property itself, adverbialism saves the intrinsicality of shape while avoiding the contradiction of being bent and straight *simpliciter*.

  Lewis claims this is "mysterious." But compare the mystery:
  1.  **Adverbialism:** Instantiation is sensitive to time. (We know time exists; we know instantiation exists).
  2.  **Perdurantism:** Objects are composed of invisible, momentary slices that we never encounter, bound together by causal relations that sometimes require primitive velocity vectors to explain basic dynamics.

  Which is truly more "carved into reality"? The view that says objects persist through change, or the view that says change is an illusion created by a stack of static snapshots?

  ### Conclusion: The Cost of Slicing
  The claim that personal identity is "just a verbal dispute" relies on the perdurantist assumption that there is no further fact of the matter about whether the upload is "you." But if endurantism is viable—and the adverbial defense shows it is—then there *is* a further fact.

  If I endure, then for the upload to be me, **I must cease to be here and start to be there.** If I perdure, the upload is just a cousin-worm.
  Lewis wants to say the endurantist is inventing a mysterious "time-indexed instantiation" to avoid contradiction. But the perdurantist is inventing a mysterious "temporal composition" to avoid change.

  The endurantist pays the price of a modified copula. The perdurantist pays the price of fragmenting every object in the universe into infinite slices and then struggling to glue them back together well enough to explain rotation, agency, and identity. The adverbial move isn't a desperate patch; it's the cheaper ontology. It keeps the world full of things that *do* and *change*, rather than a block universe of things that merely *are* at different coordinates.
