prompt: |-
  So I've been down a rabbit hole on vagueness in philosophy of language, kind of grew out of an argument at work about how we define "minor" vs "major" incident severity (turns out there's no clean cutoff, shocker). Somehow I ended up reading about this debate between epistemicism and supervaluationism about vague predicates like "bald" or "heap," and I'm trying to actually get how they differ under the hood, not just the one-paragraph wiki summary.

  From what I can tell, epistemicism (Williamson etc.) says there really IS a sharp cutoff for every vague predicate, we just can never know where it is. Supervaluationism instead says a borderline sentence is neither true nor false, and only counts as "true" if it comes out true under every way of making the predicate precise — but it still wants to keep stuff like "x is bald or x is not bald" as true even when neither half has a truth value, which kind of feels like cheating to me?

  Can you properly compare the two, especially on how each one handles higher order vagueness (the fact that even the boundry of the "borderline zone" is itself fuzzy)? And honestly, which do you think holds up better logically, or are they both just punting on the problem in different ways. Dont just give me the surface-level version, I want the actual mechanics.
