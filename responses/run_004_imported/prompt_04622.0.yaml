answer: |-
  A grad student corners Fodor after a lecture, determined to refute his radical nativism.

  **Student:** "Professor, I reject the idea that DOORKNOB is innate. I clearly learned it. I used the standard hypothesis-testing model: I observed objects, formulated the hypothesis *'This is a doorknob,'* and confirmed it against the evidence."

  **Fodor:** "Wait. To formulate that hypothesis, in what language did you think it?"

  **Student:** "Well, the Language of Thought, obviously."

  **Fodor:** "And did your Language of Thought contain the lexical symbol DOORKNOB at the moment you formulated the hypothesis?"

  **Student:** "Yes... otherwise I couldn't have thought the hypothesis."

  **Fodor:** "Exactly. So you possessed the concept DOORKNOB *before* you tested the hypothesis to acquire the concept DOORKNOB."

  **Student:** "But I was guessing! I didn't know if it was true."

  **Fodor:** "You can't guess in a language you don't speak. You didn't learn the concept; you just used the concept to learn that you had the concept. You weren't acquiring knowledge; you were trying to pull yourself up by your own conceptual bootstraps."

  **Student:** "So what was all the testing for?"

  **Fodor:** "To give you something to do while your innate concepts waited for the right environmental trigger. Now, please use your innate concept HAND to open the innate concept DOORKNOB on your way out."
