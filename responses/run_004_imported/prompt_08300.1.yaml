answer: |-
  Good evening. For those who don't know me, I'm one of Professor Alden's former students. I'm also the only person in this room who doesn't currently hold a faculty appointment, which I suspect is exactly why I'm standing here. If a colleague gave this toast, it might turn into a peer review. If I give it, well—at worst, it's just a story.

  Professor Alden has spent thirty-nine years teaching us that there is no dry dock.

  For the family and friends in the room: there is an old philosophical image called "Neurath's Boat." It imagines sailors on a ship at sea. If the ship is damaged, they cannot take it apart in a harbor to rebuild it on solid ground. They must rebuild it while floating, standing on the very planks they are replacing, using the tools they have on hand.

  For the faculty in the room: You know the Quinean inflection she gives this. There is no view from nowhere. There is no external court of moral fact where we can appeal a verdict. We are always inside the web of belief.

  For most people, the idea that there is no solid ground beneath our feet is terrifying. It sounds like drifting. But anyone who has studied with Alden knows that she never treated this as a license to drift. She treated it as a mandate to build carefully.

  If you cannot step off the boat to check the hull, then every plank matters. If you cannot appeal to a higher law to justify your actions, then you have to live with the consequences of how those actions fit into the rest of your life.

  This is why, as many of you have heard, Professor Alden will not say, "I did the right thing."

  I remember asking her once about a decision she'd made that helped a student at great cost to herself. I told her she'd done the right thing. She corrected me gently. She said, "I did the thing that cohered better with everything else I believed than the alternative would have."

  For years, I thought this was just philosophical pedantry. A way to keep her hands clean. But standing here tonight, looking around this room, I realize it was the opposite. It was an admission of responsibility. To say "I did the right thing" implies you found a coin on the sidewalk and simply picked it up. It implies the virtue was waiting there, pre-packaged, and you were just the vessel.

  But to say "this cohered better" admits that *you* did the work. You wove the thread. You tightened the bolt. You took responsibility for the structure of your own life.

  And that is why we love her.

  Because she never claimed to have a map to a hidden island of Truth. She just showed us how to keep the boat afloat. She showed us that if you treat your beliefs, your values, and your relationships as a single, interconnected web, you cannot tug on one strand without vibrating the rest. You cannot be cruel in one corner of your life without weakening the hull in another.

  To the philosophers here: She defended a naturalized ethics that refused to posit ghostly moral properties.
  To everyone else: She taught us that integrity isn't about obeying rules from on high. It's about making sure the story you tell with your hands matches the story you tell with your mouth.

  She has spent thirty-nine years repairing planks in the storm, often while the rest of us were still arguing about whether the ocean was real. She has been stubborn, yes. But she has been stubborn in the way a keel is stubborn. Not to resist the water, but to hold the crew together.

  So, I am not going to wish her a retirement where she "rests on her laurels." That implies a finished structure. And I don't think Professor Alden believes the boat is ever finished.

  Instead, I wish her calm seas for the next leg of the voyage. I wish her good timber. I wish her tools that fit her hand. And I wish her the company of people who are willing to pick up a hammer and help her rebuild, whenever the wood grows old.

  Professor Alden, you have made the web hold. You have kept us afloat.

  To the Captain.
