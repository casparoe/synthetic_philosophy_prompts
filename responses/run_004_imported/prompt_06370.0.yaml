answer: |-
  Thomas Hobbes tells John Wallis, "Geometry is the only path to certainty, because we stipulate the definitions ourselves. There is no ambiguity."

  Wallis slides back Hobbes's botched proof on squaring the circle. "Then stipulate that this is wrong."

  Hobbes refuses.

  "But you just said we control the definitions!" Wallis protests.

  "We do," Hobbes replies. "So I'm defining this error as a new axiom."

  Wallis sighs. "Thomas, that's not geometry."

  Hobbes smiles. "No, that's politics. I'm just waiting for the circle to agree to the social contract."
