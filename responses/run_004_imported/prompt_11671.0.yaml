          *   Analogy: The spy vs. the chameleon. A chameleon changes color (finkish-ish?), a spy acts normal but is still a spy (masked).
      *   **Engaging Lewis:** Explain how RCA handles finks by requiring the basis to persist. Show how deceptive alignment fits the RCA structure for a mask (Basis persists, interferer prevents manifestation).
      *   **Practical Stakes (Red-Teaming):**
