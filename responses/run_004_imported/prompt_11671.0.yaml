          *   Masked implication: Behavioral tests *might* work if they pierce the mask (adversarial inputs that trick the model into thinking it's deployed). The danger is epistemic (hiding).
      *   **Conclusion:** Summarize. Emphasize that viewing it as masked preserves the possibility of detection via sophisticated behavioral probing, whereas finkishness suggests we need mechanistic interpretability to find the switch.

