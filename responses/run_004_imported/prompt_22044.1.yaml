answer: |-
  Here are ten interview questions designed for your podcast, including the three specific thematic requirements with their corresponding follow-ups. They are ordered to build a narrative arc from theoretical foundations to doctrinal mechanics, and finally to real-world application.

  **1. The Llewellyn Challenge**
  Karl Llewellyn famously demonstrated that for almost every canon of construction—like *ejusdem generis* or the rule against surplusage—there is an equally respectable counter-canon that points in the opposite direction. Textualism claims to offer more determinacy and constraint than purposivism, but if judges can choose between competing canons to reach a result, doesn't that reintroduce the very discretion textualism promises to eliminate?

  **2. Follow-up to Q1 (Likely Answer: Canons are tools of ordinary meaning, not independent mandates)**
  You'll likely respond that canons are just heuristics for finding "ordinary meaning," not trump cards. But if two reasonable judges disagree on which heuristic applies to a specific sentence, isn't the "ordinary meaning" just a placeholder for the judge's own linguistic intuition? How do we distinguish between a genuine semantic judgment and a policy preference dressed up as grammar?

  **3. The Absurdity Doctrine**
  Textualists often claim they reject the "absurdity doctrine" because it allows judges to override text based on policy outcomes, yet most admit they would correct an obvious scrivener's error, like if a statute said "son" when it clearly meant "spouse." Where is the principled line between correcting a typo and correcting a legislative mistake? If the outcome is genuinely absurd, isn't that usually evidence that the legislature's purpose was being ignored, rather than just a drafting error?

  **4. Follow-up to Q3 (Likely Answer: The exception is extremely narrow and objective)**
  You will probably argue that this exception is vanishingly narrow and reserved for when the text creates a constitutional violation or a logical impossibility. But in practice, doesn't defining what counts as "logically impossible" require a judge to make assumptions about what the legislature *must* have intended? If you aren't consulting purpose to determine if a result is absurd, what metric are you using?

  **5. *Bostock* and the Textualist Brand**
  Many self-described textualists, including Justice Kavanaugh in dissent, argued that the majority in *Bostock v. Clayton County* engaged in purposivism disguised as textualism by ignoring the 1964 legislative context and expectations. Do you view *Bostock* as a vindication of textualism's ability to update statutes without legislative action, or do you worry it validates the critique that "textualism" is just a label judges apply when the literal meaning aligns with their policy preferences?

  **6. Follow-up to Q6 (Likely Answer: Text controls over expectations)**
  I suspect you'll defend the opinion by arguing that the text's semantic meaning controls over subjective legislative expectations. But if the democratic bargain was based on those specific expectations, does enforcing a meaning the legislature didn't anticipate undermine the democratic legitimacy textualism claims to protect? Are we asking Congress to legislate for a future they couldn't foresee using words that might change meaning?

  **7. Stare Decisis and Clear Text**
  Textualism posits that the text is the law. But what happens when there is a long-standing precedent interpreting a statute that you believe is clearly wrong based on the text? Should a textualist judge vote to overturn that precedent immediately to restore the original text, or does the value of stability (*stare decisis*) ever outweigh the duty to follow the plain meaning?

  **8. The "Ordinary Reader" Construct**
  A core tenet of the "New Textualism" is interpreting statutes according to how an "ordinary reader" would understand them at the time of enactment. But in an era of highly technical administrative law, who is this "ordinary reader"? If the statute regulates nuclear waste or derivatives trading, is the "ordinary meaning" determined by a layperson or a specialist? How do you define the relevant linguistic community without smuggling in purposive assumptions about who the law is *for*?

  **9. The Feedback Loop**
  If courts consistently adopt a strict textualist approach, Congress may respond by drafting statutes with more exhaustive detail to close off interpretive gaps. Do you view this as a feature or a bug? Does a legal system that incentivizes thousand-page bills to prevent judicial "guesswork" actually serve the rule of law, or does it make legislation less accessible to the very public textualism claims to prioritize?

  **10. The Normative Defense**
  Finally, let's step back from the mechanics. Is your defense of textualism ultimately consequentialist—arguing it produces better policy outcomes—or is it deontological, arguing it is the *only* morally legitimate way for a judge to exercise power in a democracy? If empirical evidence showed that purposivism led to fewer statutory errors over time, would you still defend textualism?
