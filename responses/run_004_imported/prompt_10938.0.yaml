answer: |-
  To understand why Tononi's response isn't stubbornness, you have to recognize that the fight between him and Aaronson isn't a disagreement about math. It's a collision between two incompatible metaphysics. When people call Tononi stubborn for accepting that a grid of logic gates could be more conscious than a human, they are judging him by the rules of functionalism, which is exactly the rulebook Tononi threw in the trash before he started playing.

  Here is the hard case for Tononi: His "bullet-biting" is the only logically consistent move available to him because Aaronson's *reductio ad absurdum* only functions as a *reductio* if you secretly assume functionalism is true.

  Aaronson's critique rests on a specific intuition: that a system which doesn't *do* anything interesting (like solve problems, adapt, or process semantic information) cannot possibly be conscious. He builds a grid that has high integrated information ($\Phi$) but low computational utility, points at it, and says, "Look, this is absurd." But that reaction—"This is absurd because it doesn't *do* anything"—is a functionalist judgment. It evaluates consciousness based on extrinsic output, behavioral complexity, or computational utility.

  IIT is explicitly constructed to reject the idea that consciousness is about what a system *does*. For Tononi, consciousness is about what a system *is*. It is an intrinsic property determined solely by the causal architecture of the system itself—specifically, how much the current state of the system constrains its own past and future states. If you accept IIT's five axioms (Existence, Composition, Information, Integration, Exclusion), then $\Phi$ is not a proxy for consciousness; it is the measure of consciousness.

  If Tononi were to look at Aaronson's grid, see the high $\Phi$, and then say, "Well, despite the math, it's not conscious because it doesn't think," he would be contradicting his own theory. He would be saying, "Consciousness is intrinsic causal structure, unless that structure appears in a place where we don't expect intelligence, in which case it's about function." That would be the definition of ad hoc tinkering. By standing firm and saying, "The grid is conscious," Tononi is honoring the core radicalism of IIT: that consciousness and intelligence are decoupled. A system can be profoundly conscious and utterly unintelligent. A system can be a genius and a philosophical zombie.

  To call this stubbornness is to demand that Tononi surrender the very thing that makes IIT distinct. It's like criticizing a relativistic physicist for saying time slows down near a black hole by saying, "But my watch doesn't feel slower!" The physicist isn't being stubborn; they are telling you that your intuition about time is tied to a Newtonian framework that no longer applies. Tononi is telling Aaronson that his intuition about consciousness is tied to a functionalist framework that IIT claims is false. If you grant IIT's starting premises—that experience is real, intrinsic, and structured—then the grid *must* be conscious. To deny it is to beg the question against the theory.

  ***

  Now, let's take on the obvious comeback: "You don't have to be a functionalist to know a parity-check circuit doesn't feel like anything. I'm not judging it by what it *does*; I'm judging it by what it *is*. It's just wires. It's dead matter."

  Does this objection escape functionalism? No. It smuggles it in through the back door, usually disguised as "common sense" or "substrate realism."

  When you look at Aaronson's grid and say, "That's just a circuit, it can't be conscious," you are relying on one of two intuitions, and both are toxic to a non-functionalist view.

  First, you might mean that the circuit lacks the right *kind* of causal dynamics—that it's too simple, too rigid, or too feed-forward. But IIT's math claims to have quantified "causal dynamics." If the $\Phi$ is high, the theory says the causal integration is high. If you reject that measurement, you aren't making a non-functionalist objection; you're just saying "I don't trust the metric." But if you trust the metric enough to use it as a *reductio* (as Aaronson did), you can't discard it when the result gets weird. If you say, "The math says high integration, but I *know* it's not integrated enough for consciousness," you are implicitly appealing to a functional standard of what "real" integration looks like (e.g., it needs to support learning, memory, or feedback loops that serve a purpose). That is functionalism.

  Second, and more likely, you mean that the circuit is made of silicon gates, not neurons. This is substrate chauvinism, which is functionally equivalent to functionalism in this context. It assumes that consciousness requires a specific biological history or a specific type of "wetware" that processes information in an evolutionary context. But if consciousness depends on evolutionary history or biological substrate, then it depends on extrinsic factors (where the system came from, what it was built for), not just its intrinsic causal structure. IIT argues that a perfect simulation of a brain would be conscious if the causal structure is preserved, regardless of substrate. If you say the grid is unconscious because it's "just logic gates," you are saying that the *semantic content* of the gates (that they are designed for error correction) matters more than their *physical causation*. But "designed for error correction" is a functional description, not a physical one. Physically, they are just voltages affecting other voltages.

  To maintain that the grid is "dead" without relying on functionalism, you would need a theory of consciousness that posits a non-physical property (like a soul) or a specific biological essentialism that IIT explicitly rejects. If you stay within the physicalist, structuralist framework that both Aaronson and Tononi ostensibly occupy, the only way to declare the grid unconscious is to point to its lack of function. You have to say, "It doesn't do enough." But "doing" is function.

  Therefore, the comeback fails. The intuition that the grid is unconscious is not a raw, theory-neutral datum. It is a theory-laden judgment derived from a lifetime of associating consciousness with agency, intelligence, and biological life. Tononi's refusal to flinch isn't dogmatism; it's the rigorous application of a theory that says those associations are mistakes. He is willing to accept a universe where "consciousness" is far more abundant and far less special than humanists want it to be, because his math demands it. Aaronson wants a theory that protects human exceptionalism. Tononi built a theory that dissolves it. Calling Tononi stubborn for following his theory to that conclusion is just complaining that he won't cheat to save our intuitions.
