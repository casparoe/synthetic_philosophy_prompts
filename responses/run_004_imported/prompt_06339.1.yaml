answer: |-
  You have accidentally stumbled upon one of the most famous problems in mathematics and economics. I have good news and bad news.

  The good news is: **You didn't count wrong, and it isn't rigged.**
  The bad news is: **There is no mathematically "perfect" voting system.**

  What your group experienced is a real-world demonstration of **Arrow's Impossibility Theorem**. In 1951, economist Kenneth Arrow proved that no rank-order voting system can satisfy a specific set of fairness criteria at the same time. Essentially, every voting method has a hidden flaw that can be exploited by a specific set of voter preferences.

  Here is a breakdown of why your trip planning turned into a math war, why the "zero vote" deletion changed the winner, and what you should actually do to save your friendships.

  ### 1. Why the Methods Disagreed
  You used two different systems that measure two different things:

  *   **Ranked-Choice (Instant Runoff):** This system is designed to find the **most acceptable compromise**. It eliminates the least popular options round-by-round. It favors the candidate who is "okay" with the most people, even if they aren't anyone's #1 favorite.
  *   **Points System (Borda Count):** This system measures **overall enthusiasm**. It gives credit for being a strong #2 or #3. It favors the candidate who is consistently liked, even if they aren't the top pick.

  **The Conflict:** It is mathematically normal for these two to produce different winners. RCV might pick the destination that nobody hates. The Points system might pick the destination that half the group loves and the other half tolerates. Neither is "wrong"; they just answer different questions.

  ### 2. The "Zero First-Choice" Paradox
  This is the specific moment that caused the drama. You removed a destination that nobody picked first, and the winner flipped. This is a violation of a fairness principle called **Independence of Irrelevant Alternatives (IIA)**.

  IIA states that if Candidate A beats Candidate B, removing Candidate C shouldn't change the result between A and B. But in many voting systems (including the Points system), it does.

  **Here is likely what happened:**
  Imagine you have 3 destinations: Beach, Mountains, City.
  *   In the Points system, you assign points based on how many options there are (e.g., 1st place = 3 points, 2nd = 2 points, 3rd = 1 point).
  *   "City" got no 1st place votes, but maybe it got a lot of 2nd place votes.
  *   When you deleted "City" and re-ran the tally, you likely changed the point values (e.g., now 1st place = 2 points, 2nd = 1 point).
  *   By changing the *value* of the rankings, you changed the weight of your friends' preferences.

  This proves the system is sensitive to "irrelevant" options. It feels like cheating, but it's just how the math works.

  ### 3. Is Simple Majority Better?
  Half your group wants to switch to "Majority Vote" (pick one, most votes wins). **This is usually worse for small groups.**

  *   **Vote Splitting:** If 4 people want "Somewhere Warm" and 3 want "Somewhere Cold," but the Warm group splits between "Beach" and "Desert," the "Cold" group wins with 3 votes, even though 4 out of 7 wanted warmth.
  *   **Tyranny of the Majority:** With 7 people, a group of 4 can steamroll the other 3 every single time. Over years, the minority will stop coming on the trip.

  ### 4. So, How Do You Actually Fix This?
  Since math cannot define "fairness" perfectly, you need to use **social engineering** instead of voting algorithms. For a group of 7 friends, the goal isn't mathematical purity; it's keeping the group together for next year.

  Here are four methods that work better than voting:

  **A. The Veto Method (Highly Recommended)**
  Instead of voting for what you *want*, vote on what you *refuse* to do.
  1.  Propose 5 destinations.
  2.  Everyone gets **one veto**.
  3.  If a destination gets even one veto, it is out.
  4.  From the remaining options, pick the one with the most enthusiasm.
  *Why it works:* It ensures nobody is forced into a trip they will hate.

  **B. The Rotation System**
  Accept that fairness is impossible in a single year, so aim for fairness over time.
  1.  One person picks the destination this year.
  2.  Next year, the next person picks.
  3.  The only rule is it must fit the budget.
  *Why it works:* It removes the debate entirely. Everyone knows their turn is coming.

  **C. Approval Voting**
  If you must vote, change *how* you vote.
  1.  List the options.
  2.  Everyone marks "Yes" or "No" on each (no ranking).
  3.  The option with the most "Yes" votes wins.
  *Why it works:* It prevents the "ranking strategy" drama. You either support it or you don't. It's simpler and harder to game.

  **D. The "Top 3" Randomizer**
  1.  Use your ranking system to find the top 3 destinations.
  2.  Put them in a hat.
  3.  Draw one.
  *Why it works:* When the decision is random, nobody can blame the "rigged system" or each other. Fate chose the destination.

  ### The Verdict
  You are correct: **Every method has a flaw hiding somewhere.**

  If you try to find a perfect voting algorithm, you will lose your friends. The drama isn't about the math; it's about the feeling that the process is opaque.

  **My advice:** Apologize to the group for the "math experiment," admit that you learned that voting systems are inherently flawed (show them this thread if you want!), and switch to **The Veto Method** for this year. It prioritizes making sure nobody is miserable over optimizing for the "perfect" choice.
