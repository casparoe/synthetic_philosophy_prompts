  okay this is a random one but it's been living in my head since my philosophy of math seminar last week. we covered skolem's paradox (if ZFC is consistent it has a countable model, but that exact same model still thinks it contains uncountable sets) and our prof mentioned that cantor died in 1918, just a few years before skolem published this in 1922, so he never got a chance to react to it. cantor was a hardcore realist about the transfinite -- he even wrote back and forth with catholic theologians to convince them the alephs didnt threaten God's status as the one true "Absolute" infinite. so what do you think he wouldve said about skolem's paradox? would it actually threaten his idea that uncountability is a real fact about a set and not just an accident of whichever formal system you happen to be using, or does his own old distinction between "consistent" and "inconsistent" multiplicities (the trick he used to dodge the Burali-Forti-type paradoxes before they even had that name) already give him an easy way out?
