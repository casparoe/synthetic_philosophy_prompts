answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the best man. I'm also the older brother. And, as some of you may have already noticed when you were looking for a ride home tonight, I am also the designated driver.

  In fact, I am the *only* designated driver. Which means that while everyone else is celebrating, I am the one person in this building who has to remain sober enough to navigate the highway, unlock the car doors, and ensure that the love of my life's brother makes it to the honeymoon suite without trying to parallel park a getaway vehicle.

  Now, usually, being the DD is just a practical sacrifice. You trade a buzz for the moral high ground and a Diet Coke. But for the past few years, I've been reading a lot of old philosophy in my spare time. And somewhere in the works of Plato, specifically in a book called *The Laws*, I found a description of my job tonight that stopped me cold.

  Plato argues that a drinking party, properly managed, is actually a tool for building character. His theory is that wine strips away our social composure. It dissolves the masks we wear. It reveals who we really are when we aren't trying so hard to be good. But—and here is the catch—this only works if there is one person in the room who *doesn't* drink. A "Sober President," he calls them. A guardian whose job is to watch over the revelry, ensure no one comes to harm, and observe what the wine reveals about the guests' true natures.

  When I told [Brother's Name] about this, he laughed and immediately crowned me the "Sober President" of his wedding. And he's right. That is my role tonight. I am the chaperone of the festivities. But more importantly, over the last few years, I've been the Sober President of our brotherhood. I've been the one driving home from the bars, the one making coffee at 2 a.m., the one watching while the wine does its work.

  And because of that vantage point, I have seen some things.

  I have seen the version of [Brother's Name] that comes out after three glasses of red wine at a family holiday. This is the version who believes, with absolute conviction, that he can fix any broken appliance in the house if given enough time and a butter knife. I have watched him attempt to repair a toaster at 1 a.m. while explaining the geopolitical implications of the industrial revolution. It was unflattering. It was chaotic. The toaster remained broken.

  But Plato says the point of this observation isn't to mock the subject. It's to understand their virtue. And the same wine that reveals his chaotic enthusiasm also reveals his heart.

  I remember a night a few years ago. We were out with friends, things got loud, defenses came down. Most people, when they're tired and drunk, turn inward. They get sloppy or quiet. [Brother's Name] gets generous. I watched him spend the last of his own cash to make sure a stranger got a cab home. I watched him stand in the rain for an hour just to talk a friend through a breakup, soaking wet, not caring about his own comfort.

  The wine didn't put those qualities there. It just removed the noise so everyone else could see them. It showed me that my brother isn't just a good man when it's easy to be one. He is a good man when he's tired, when he's unguarded, and when no one is keeping score.

  And that brings me to [Fiancée's Name].

  In Plato's ideal party, the Sober President eventually steps down, because the guests have learned to govern themselves. But in a marriage, I think the dynamic is different. You don't need a guardian. You need a partner.

  [Fiancée's Name], you have seen him sober. You have seen him tired. And I suspect you have seen him after a glass or two of wine. You know the toaster-fixing enthusiasm, and you know the rain-soaked loyalty. You know the real character beneath the composure. And you have chosen it.

  My job as the Sober President ends tonight. I will drive you to the hotel, I will drop off the keys, and I will hand over the responsibility of looking after him to you. I know he is in safe hands. Because the best test of character isn't a philosophical argument, and it isn't a wine party. It's standing up here, in front of everyone you love, and making a promise you intend to keep for the rest of your life.

  So, if everyone could please rise and fill their glasses. Whether you are drinking wine, water, or the Diet Coke of the designated driver.

  To [Brother's Name] and [Fiancée's Name]. May your life together be full of celebration, may your character always be as strong as it is tonight, and may you always have a safe ride home.

  To the happy couple.
