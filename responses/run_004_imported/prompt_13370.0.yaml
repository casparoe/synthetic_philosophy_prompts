      *   *The Forum Claim:* It's a common oversimplification. Peirce is a precursor to logical empiricism and critical rationalism, but "falsifiability" is a specific logical criterion Peirce didn't formulate in the Popperian sense. Peirce is more about *fallibilism* (we could be wrong) than *falsification* (this specific test kills the theory).
