answer: |-
  Here are eight interview questions designed to navigate around the "greatest hits" version of the handicap principle and pin down the specific theoretical commitments in your guest's book. Each includes a follow-up tailored to his likely "that's an index" deflection.

  ### 1. The Zahavi vs. Grafen Distinction
  **Question:** "You argue that Grafen's 1990 game-theoretic model vindicated Zahavi's 1975 intuition. But there's a tension there. Zahavi emphasized *waste*—the idea that the signal must be net costly to be honest. Grafen's condition is actually about *differential marginal cost*—the cost gradient must be steeper for low-quality signalers, but the signal doesn't strictly have to be net costly. When you defend the 'hardcore' view, are you defending Zahavi's claim that waste is the mechanism, or Grafen's claim that the gradient is the mechanism? Because those allow for very different biological predictions."

  *   **Anticipated Dodge:** He'll likely say they amount to the same thing in practice, or that Grafen just formalized Zahavi's waste claim.
  *   **Follow-up:** "If they amount to the same thing, why does your book focus so heavily on the *expense* of rituals and displays rather than the *slope* of the cost function? If I find a signal where the gradient holds but the net cost is zero or positive, does your theory classify that as a handicap, or does it fall out of your definition?"

  ### 2. The Getty Objection (Differential Effectiveness)
  **Question:** "Thomas Getty's work suggests that honest signaling can be stabilized by differential *effectiveness* rather than differential *cost*—essentially, high-quality individuals get more 'bang for their buck' in terms of detectability, without necessarily paying a higher fitness penalty. This seems to threaten the 'requires' in your thesis—that cost is *necessary* for honesty. If effectiveness can do the work of cost, isn't the handicap principle just one special case of a broader reliability condition?"

  *   **Anticipated Dodge:** "Getty's models rely on indices, not signals. If the physical structure guarantees honesty, it's not a handicap."
  *   **Follow-up:** "I want to press on that classification. What is the operational criterion you're using to draw that line? If the receiver's perception is what drives the selection pressure, does it matter whether the constraint is physiological (index) or strategic (cost)? If the evolutionary stability logic is identical, isn't 'index' just a label you're using to protect the necessity claim from counterexamples?"

  ### 3. Efficacy Cost vs. Strategic Cost (Stotting)
  **Question:** "Let's look at stotting in gazelles. There's a debate over whether the cost of that display is *efficacy cost* (the energy required to make the signal detectable) or *strategic cost* (the increased predation risk that guarantees honesty). If it's mostly efficacy cost, then the signal is expensive just to be seen, not to be trusted. How would you design an experiment to distinguish whether the cost is buying detectability or buying honesty in a system like that?"

  *   **Anticipated Dodge:** "Predation risk is the cost. It's an index of their ability to escape, so it's still handicap logic."
  *   **Follow-up:** "But if it's an index of escape ability, doesn't that return us to the previous problem? If the predator *knows* the gazelle can escape, the signal isn't costly in terms of survival probability. If the cost is zero because the risk is nullified by quality, aren't we back to a non-costly honest equilibrium?"

  ### 4. Cheap Talk and Interest Overlap
  **Question:** "In game theory, cheap talk equilibria show that information can be transmitted cost-free as long as interests aren't *completely* opposed. Your book argues cost is required for conflicting interests. But conflict is a spectrum. Does your necessity claim only hold when interests are 100% opposed? If there's even a 5% overlap in fitness interests between a signaler and receiver, does your theory allow for cost-free honesty, or do you argue that biological conflict is always total?"

  *   **Anticipated Dodge:** "In biological systems, interests are always sufficiently opposed to require cost. Cheap talk is a human linguistic artifact."
  *   **Follow-up:** "What about kin selection or mutualism? If I signal to my offspring or a mutualistic partner, our interests overlap significantly. Do you really want to claim that parent-offspring communication requires Zahavian handicaps to be honest? If not, doesn't that limit your theory to a specific subset of adversarial interactions rather than communication as a whole?"

  ### 5. The Definition of "Index" (The Meta-Question)
  **Question:** "You've mentioned the distinction between signals and indices before. In philosophy of science, categories need to be robust. Can you give us a strict definition of an 'index' versus a 'signal' that doesn't rely on the outcome? In other words, can you define it *before* we check if the signal is costly, rather than defining an index as 'any honest signal that turns out to be cheap'?"

  *   **Anticipated Dodge:** "An index is physically constrained; a signal is strategically chosen."
  *   **Follow-up:** "But all signals are physically constrained by physiology. Is the distinction simply that indices are *harder* to fake? If it's a continuum of difficulty-to-fake, at what threshold does an index become a signal? If you can't give me a threshold, aren't you just moving the goalposts to save the handicap principle from falsification?"

  ### 6. Human Conventional Signaling
  **Question:** "You extend the theory to human religious ritual and virtue signaling. But humans also use language, which is largely conventional and cheap. If the handicap principle is the primary engine of reliable communication, how did human language evolve? Are you arguing that language is only trusted when backed by costly ritual, or is there a separate evolutionary pathway for low-cost symbolic communication that your theory doesn't cover?"

  *   **Anticipated Dodge:** "Language is backed by costly reputation systems. Lying has social costs, so it's still a handicap."
  *   **Follow-up:** "That sounds like a *consequence* of lying, not a *cost of the signal* itself. In the handicap principle, the cost must be paid *upfront* to send the signal. If I speak a sentence and only pay a cost if I'm caught lying later, that's a penalty model, not a handicap model. Are you conflating the two?"

  ### 7. Evolutionary Stability and Origins
  **Question:** "One classic problem for handicap theory is the evolutionary origin. If a costly signal is required for honesty, how does the population get there from a low-cost state? There should be a valley where low-quality individuals fake the signal before the cost becomes prohibitive. Does your model require a specific starting condition, like pre-existing indices, to bootstrap the costly signaling system?"

  *   **Anticipated Dodge:** "It co-evolves with receiver psychology. Receivers ignore cheap signals."
  *   **Follow-up:** "But receivers can't ignore cheap signals if they carry information. If a cheap signal arises that correlates with quality—even as an index—receivers will use it. How do you prevent that cheap equilibrium from locking in and preventing the costly handicap from ever evolving?"

  ### 8. Falsifiability
  **Question:** "Finally, a question on the science itself. If the handicap principle is a universal requirement for honest communication in conflict, what empirical finding would falsify it? If every time we find a cheap honest signal, it can be reclassified as an index or a penalty, is there any observation that would actually force you to abandon the necessity claim?"

  *   **Anticipated Dodge:** "If we found a system with total conflict, no physical constraints, and stable cheap signaling. But that doesn't exist."
  *   **Follow-up:** "So the claim is protected by the assertion that such a system *can't* exist. That makes the theory a tautology: 'Honesty requires cost, because if it didn't require cost, it wouldn't be honest.' How do we break that circle? What does a world where your theory is wrong look like?"
