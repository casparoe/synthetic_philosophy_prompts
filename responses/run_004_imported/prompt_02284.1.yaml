answer: |-
  **The Ex-Ante Fiction: Why the Common Prior Assumption is Not a Norm of Rationality**

  The Common Prior Assumption (CPA) occupies a precarious position in formal epistemology and game theory. For proponents like your advisor, it is a constitutive norm of ideal rationality: if two agents share the same evidence and reason perfectly, they must converge. Disagreement, therefore, is diagnostic of either private information or irrationality. However, this view conflates logical consistency with empirical convergence. While Aumann's Agreement Theorem is mathematically sound, its philosophical import relies on treating the "common prior" as a requirement of reason rather than a substantive hypothesis about the world. **The CPA should not be counted as a requirement of ideal rationality.** It imports empirical content that Bayesian reasoning alone cannot justify, relies on a metaphysically dubious "ex-ante" stage, and creates an unjustified asymmetry between beliefs and preferences.

  The intuitive force of the CPA rests on an Objectivist Bayesian intuition: there is one world, and evidence constrains belief. If you and I are perfect logic machines fed the same data, we should output the same probability distribution. However, this intuition collapses when we examine the formal structure of the type-space, as Faruk Gul (1998) forcefully argues. In the Harsanyi type-space formulation, an agent's "type" includes their prior. To say agents *must* have a common prior is to say that before receiving private signals, agents must be identical in their probabilistic dispositions. But there is no coherent "moment" where agents exist as rational entities prior to having their specific cognitive dispositions. The ex-ante stage is not a historical reality nor a robust counterfactual; it is bookkeeping. To demand a common prior is not to demand that agents reason correctly from evidence; it is to demand that they *be* the same agent before they receive evidence. Rationality governs the *updating* of beliefs (conditionalization), not the *origin* of the prior. An ideal agent can be perfectly consistent in updating a prior that differs from another ideal agent's prior without violating any norm of logic.

  This point is sharpened by Stephen Morris's (1995) comparison of priors to utility functions. In standard Subjective Expected Utility (SEU) theory, we treat utility functions as irreducibly personal. We do not demand that two rational agents value apples and oranges identically given the same nutritional data; we accept heterogeneous preferences as a brute fact of agency. Yet, economists often balk at heterogeneous priors. Morris asks: what is the relevant difference? Both priors and utilities are subjective parameters required to close the model of decision-making. If rationality permits me to value risk differently than you (different utility), it should permit me to weigh the likelihood of states differently than you (different prior), provided we both update consistently. To insist on common priors while allowing heterogeneous utilities is to assert that beliefs are "about the world" in a way preferences are not. But in the Savage framework, both are jointly revealed by choice. If we cannot normatively constrain utility functions without stripping agency of its content, we lack the grounds to normatively constrain priors beyond consistency axioms.

  Furthermore, treating CPA as a rationality norm creates severe tension with the No-Trade Theorem and the existence of speculative markets. If the CPA holds and posteriors are common knowledge, Milgrom and Stokey (1982) show that no speculative trade can occur. Agents cannot agree to bet against one another simply because they interpret public information differently; they would only trade to hedge risk. Yet, financial markets are characterized by high-volume speculative trade based on belief heterogeneity. Your advisor's position forces a dilemma: either the vast majority of market activity is irrational (noise traders dominating), or the CPA is false as a general norm. While one could argue markets are irrational, elevating this to a definition of *ideal* rationality is question-begging. It defines rationality in a way that makes actual human success (navigating a world of diverse beliefs) impossible for ideal agents. A norm of rationality that renders successful coordination in complex environments theoretically impossible is a poor norm.

  Therefore, the CPA is best understood not as a requirement of rationality, but as a **modeling idealization** useful for specific cooperative contexts (like mechanism design within a firm) where agents share a common training or data-generating process. It is an empirical claim that agents *happen* to share a prior, not a logical truth that they *must*.

  For your work in social epistemology, this distinction is vital. If the CPA is not a rationality norm, then the "Peer Disagreement" problem does not require a solution that eliminates disagreement. Persistent disagreement between epistemic peers need not imply that one party is ignoring evidence or reasoning poorly. It can simply reflect that rational agents, even ideal ones, may start from different doxastic commitments that are not themselves subject to further justification. Aumann's theorem tells us what happens *if* priors are common; it does not tell us they *ought* to be. Rationality requires that you update correctly on my testimony; it does not require that you end up where I am.
