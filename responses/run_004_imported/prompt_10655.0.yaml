  **Move 4:** Nadia draws a crucial disanalogy between the stipulated correlation in thought experiments and the unverified empirical correlation required for ECL in a real multiverse.
  **Move 5:** Owen offers a pragmatic defense that correlation need not be perfect, but he somewhat hand-waves Nadia's deeper challenge regarding how to justify even a non-zero estimate.
  **Move 6:** Nadia successfully pivots to the "prior problem," showing that even if ECL works theoretically, determining the weighting of value systems remains arbitrarily difficult.

  **Missing Consideration:**
  Neither participant raises the risk of **acausal extortion** (or blackmail). If you signal a disposition to cooperate acausally, you may also signal vulnerability to malicious agents in the multiverse who threaten to disvalue your outcomes unless you submit to their demands. This strategic risk suggests that a policy of unconditional evidential cooperation could be exploited, potentially making a more guarded or updateless decision-theoretic approach necessary to ensure safety alongside cooperation.
