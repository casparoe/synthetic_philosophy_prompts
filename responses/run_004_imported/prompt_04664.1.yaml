  2.  **Character Voices:**
      *   **Einstein:** Warm, slightly rumpled, humble but firm in his cosmic religion, poetic but grounded in physics, affectionate towards Gödel. He speaks in metaphors of nature, harmony, and humility.
      *   **Gödel:** Precise, anxious, intense, logical, somewhat detached from the physical world but deeply concerned with metaphysical truth. He speaks in terms of necessity, rationality, and structure.
