answer: |-
  The gate at Fuld Hall clicked shut behind them. The autumn light was already thinning, stretching long shadows across the gravel path. Einstein walked with his familiar shuffle, hands deep in the pockets of a cardigan that had seen better decades. Gödel walked beside him, stiffly, as if his spine were a rod of steel, his eyes fixed on the pavement just ahead.

  They passed the woods. The silence between them was comfortable, the silence of men who have exhausted the day's formalities.

  **EINSTEIN:** Oskar tells me I am becoming a bad habit of yours, Kurt.

  **GÖDEL:** Oskar talks too much.

  **EINSTEIN:** He says I come to the Institute only to walk you home. That my own work is… how did he put it? A secondary amusement.

  **GÖDEL:** Oskar is not wrong.

  **EINSTEIN:** (Chuckles softly) Then I am glad to be of service. Though I worry. You look tired. The mind eats the body, yes?

  **GÖDEL:** The mind is not eating the body, Albert. The mind is waiting for the body to catch up. It is a matter of… synchronization.

  **EINSTEIN:** Synchronization. A relativistic problem.

  **GÖDEL:** A metaphysical one.

  They turned onto Washington Road. The traffic was light. A car passed, tires humming on the asphalt. Gödel flinched slightly, stepping closer to the grass.

  **GÖDEL:** I was thinking today. About the end.

  **EINSTEIN:** The end of the walk?

  **GÖDEL:** The end of the walker.

  Einstein didn't answer immediately. He adjusted his cap.

  **EINSTEIN:** We have spoken of this. You know my position. It is not a secret.

  **GÖDEL:** I know your position. Spinoza. The impersonal order. The harmony of the spheres. But it is not an argument, Albert. It is a feeling. A poetic feeling.

  **EINSTEIN:** Is it? I thought physics was built on feelings. The intuition that there is a tune, before we hear the notes.

  **GÖDEL:** Physics describes what *is*. It does not prescribe what *must be*. And what must be, regarding us, is continuation.

  **EINSTEIN:** Must be? The universe is under no obligation to us, Kurt. It was here before we had names for it. It will be here when our names are dust.

  **GÖDEL:** That is the materialist error. To think we are accidents. If the world is rational—and science proves it is rational, otherwise we could not do science—then it cannot contain a fundamental irrationality.

  **EINSTEIN:** And death is irrational?

  **GÖDEL:** Look at the capacity. A human mind. It can conceive of infinity. It can grasp the structure of the cosmos. It can develop morally, intellectually, spiritually. And then? It is extinguished. Just as it begins to see. To create a machine capable of understanding the universe, and then to smash it before it has understood anything… that is irrational. It is a waste.

  **EINSTEIN:** Waste. There is the human word. The leaf falls. Is it waste? It feeds the soil. The star explodes. Is it waste? It makes the carbon for your blood. Why must the mind be different? It returns to the whole.

  **GÖDEL:** The leaf does not know it is falling. The star does not know it is exploding. We know. We are the place where the universe becomes conscious of itself. If that consciousness is terminated arbitrarily, the rationality of the whole is compromised.

  **EINSTEIN:** Arbitrarily? It is terminated by biology. By the same laws that govern the leaf.

  **GÖDEL:** Biology is matter. The mind is not matter. You know this.

  **EINSTEIN:** Do I?

  **GÖDEL:** You must. Think of your own work. Think of mine. The theorems. They are true. They are not true because neurons fire. They are true independently. We discover them. We do not invent them. If the mind were merely a biological machine, a finite system of physical laws, it could not verify truths that stand outside that system.

  **EINSTEIN:** You mean your incompleteness.

  **GÖDEL:** I mean that the mind transcends the mechanism. If the mind is not the mechanism, why must it end when the mechanism breaks? The radio is smashed. Does the music cease to exist?

  **EINSTEIN:** (Stops walking) The music requires the radio to be heard, Kurt. Without the instrument, there is only silence. I am content with the silence.

  **GÖDEL:** You are content because you fear the alternative.

  **EINSTEIN:** I fear nothing. I am a part of nature. Why should I fear returning to it?

  **GÖDEL:** Because you are not a part. You are a viewpoint. A unique viewpoint. If the world is rational, every viewpoint must have a completion. To cut it off is a contradiction. It would mean the rational world creates a question it forbids itself to answer.

  **EINSTEIN:** (Resumes walking, slower) Who forbids? You speak of the world as if it is a person. A planner.

  **GÖDEL:** I speak of it as a logic.

  **EINSTEIN:** Logic is a tool we use to map the territory. It is not the territory itself. You want the map to guarantee the safety of the traveler. But the map says nothing of the traveler's fate. It only says where the cliffs are.

  **GÖDEL:** The map says the cliffs should not be there if the terrain is meant to be traversed.

  **EINSTEIN:** Ah. There it is. "Meant to be." You cannot help yourself. You smuggle in a purpose.

  **GÖDEL:** I smuggle in nothing. I observe the ratio. The potential versus the actualization. In every other natural process, potential seeks actualization. The seed becomes the tree. The electron finds the orbit. Only man is built to seek truth and then denied the time to find it. It is an asymmetry. Nature does not tolerate asymmetry without cause.

  **EINSTEIN:** And the cause is entropy. Decay. The great leveling.

  **GÖDEL:** That is the description of the body. Not the mind.

  **EINSTEIN:** They are tied, Kurt. I have watched people I love. When the brain fails, the mind goes. The memories, the jokes, the mathematics. It leaks away. I held Mileva's hand at the end. She did not know me. Where was her "viewpoint" then?

  Gödel tightened his grip on his cane. He looked straight ahead, his jaw working.

  **GÖDEL:** That is the damage to the vessel. It obscures the signal. It does not prove the signal is gone.

  **EINSTEIN:** It is convenient, is it not? To believe the signal persists. It makes the loss easier to bear.

  **GÖDEL:** (Sharp) Do not psychoanalyze me, Albert. This is not about comfort. It is about consistency. If I am right about the mathematics, I am right about the metaphysics. The mind cannot be reduced to the finite. If it cannot be reduced, it is not bound by the finite limits of the body.

  **EINSTEIN:** Even if I grant you that the mind is not matter… even if I grant you that we touch something eternal when we do mathematics… why must *you* persist? Why must Kurt Gödel, with his fears and his stomach pains and his fondness for this walk, continue? Why not just the pure intellect? The viewpoint without the viewer?

  **GÖDEL:** Because the intellect is developed through the person. Through the struggle. Through the moral choices. To strip that away is to discard the work. It would be like solving an equation and erasing the numbers, keeping only the equals sign.

  **EINSTEIN:** (Softly) I think the equals sign is enough.

  They were nearing Mercer Street. The house was visible, the porch light already on, a yellow square in the gathering blue.

  **GÖDEL:** You say that now. Because you are tired. Because the work is done.

  **EINSTEIN:** The work is never done. The mystery only grows deeper. That is why I do not need immortality. The mystery is sufficient. To be a note in the symphony is enough. I do not need to be the conductor.

  **GÖDEL:** But the note fades.

  **EINSTEIN:** The melody remains.

  **GÖDEL:** Who hears the melody?

  **EINSTEIN:** (Stops at the gate) God.

  **GÖDEL:** Spinoza's God? The substance? That is not a listener. That is a law.

  **EINSTEIN:** Perhaps the law is the listener. Perhaps to be known by the law is enough.

  Gödel looked at the house, then back at Einstein. There was a profound sadness in his eyes, not for himself, but for his friend.

  **GÖDEL:** You accept a universe that is rational but indifferent. I cannot. A rational universe cannot be indifferent to reason. If it were, it would be schizophrenic. It would think against itself.

  **EINSTEIN:** And I cannot accept a universe that is tailored to save me. That seems… small. Too human.

  **GÖDEL:** It is not about saving you. It is about justice.

  **EINSTEIN:** Justice is a human invention, Kurt. Like the meter stick. Like the clock.

  **GÖDEL:** No. Justice is a mathematical relation. Balance. Input and output. If we put in the capacity for eternity, the output must be eternity. Otherwise the equation does not balance.

  **EINSTEIN:** (Sighs, places a hand on Gödel's shoulder) My friend. You want the world to be a proof. But the world is a poem. It does not have to balance. It only has to be.

  **GÖDEL:** A poem without an end is a fragment.

  **EINSTEIN:** Then we are fragments. Beautiful fragments.

  Einstein opened the gate. It creaked. He stepped onto the path, then turned back. Gödel remained on the sidewalk, outside the boundary of the property.

  **EINSTEIN:** Come in. Elsa made soup.

  **GÖDEL:** I should go. I have work.

  **EINSTEIN:** The work will wait. It has waited three thousand years. It can wait one night.

  **GÖDEL:** (Hesitates) If I come in… will we talk of this again?

  **EINSTEIN:** No. We have said what we can say. The rest is silence.

  **GÖDEL:** That is what you believe.

  **EINSTEIN:** That is what I hope.

  Gödel looked at the porch light, then at the darkening street behind him. He seemed to be calculating a distance that could not be measured.

  **GÖDEL:** I will come in. But I am not convinced.

  **EINSTEIN:** Good. If you were convinced, you would stop thinking. And then I would have no one to walk with.

  Einstein turned toward the door. Gödel followed him, stepping out of the cold wind and into the light, though he kept his coat on, as if preparing to leave again at any moment.
