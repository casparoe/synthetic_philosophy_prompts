answer: |-
  This is a classic tension in moral psychology and ethics, and it makes perfect sense that your brain latched onto it. You are essentially wrestling with the distinction between the **validity of a moral claim** and the **standing to make that claim.**

  Since you have a background in social psych, I'll frame this using concepts from moral judgment and normative ethics. This should help you categorize the conflicting reactions you're getting and resolve that "nobody can criticize anything" worry.

  ### 1. The Logical vs. Social Conflict (Your Two Friends)
  Your two friends represent two different domains of evaluation: **Propositional Truth** vs. **Communicative Propriety.**

  *   **Friend 2 (The Logician):** They are relying on formal logic. The statement "Cheating is wrong" is a moral proposition. Its truth value is independent of the speaker. If a murderer says "murder is wrong," they are still stating a moral truth. In logic, attacking the speaker instead of the argument is the *tu quoque* fallacy. From this perspective, R is correct about the cheating friend, regardless of her history.
  *   **Friend 1 (The Social Psychologist):** They are evaluating *standing*. In social dynamics, moral criticism is a speech act that requires social capital. When R says cheating indicates "no respect" and defines "character," she is positioning herself as a moral authority. If she has violated that same norm, she is engaging in **hypocrisy**. Hypocrisy doesn't make the *claim* false, but it does undermine the *speaker's legitimacy* to make the claim publicly. It signals self-righteousness, which triggers reactance in listeners.

  **The Synthesis:** Friend 2 is right about the *fact* (cheating is bad). Friend 1 is right about the *norm* (R shouldn't have positioned herself as a judge).

  ### 2. Solving the "Nobody Can Criticize Anything" Worry
  Your third worry is the most philosophically interesting: *If past mistakes disqualify criticism, moral discourse collapses.*

  This is known in ethics as the **Paradox of the Moral Critic.** If only sinless people can criticize sin, silence is the only option. However, philosophers (like R.A. Duff or MacNamer) distinguish between **Hypocrisy** and **Acknowledged Fallibility.**

  The slippery slope breaks down here:
  *   **Hypocrisy:** "I would never do this (implied), and you are terrible for doing it." This claims a moral superiority the speaker does not possess. This *does* forfeit standing.
  *   **Acknowledged Fallibility:** "I have struggled with this/is capable of this, but it is harmful, and we should avoid it." This retains standing.

  **The Principle:** You do not need a *clean past* to criticize; you need *honesty about your capacity for error.*
  If R had said, "Cheating is devastating. I've made mistakes in relationships before, and I know how much damage this specific action causes," she would retain her standing. By framing it as "this tells you everything about someone's character," she implied a binary (Good People vs. Cheaters) that her own history contradicts.

  So, your worry is resolved: People *can* criticize, provided they don't claim moral exemption for themselves while enforcing rules on others.

  ### 3. Does Regret Matter?
  You asked if it matters that R claims to regret her past actions.

  *   **Ethically:** Yes. Regret indicates moral growth. A reformed smoker is often the most vocal anti-smoking advocate. Their past gives them *epistemic privilege* (they know the consequences firsthand).
  *   **Socially:** Only if it is **known.**
      Since R's past is hidden from the group, her regret is functionally invisible. To the group, she looks like a hypocrite, not a reformed advocate. By keeping her past secret while judging others, she creates an **information asymmetry** that protects her reputation at the expense of the accused.

      In social psych terms, she is committing the **Fundamental Attribution Error** on the cheating friend (attributing his action to "character") while likely granting herself a **Situational Attribution** for her own past cheating ("it was a different situation," as she told you). Because the group doesn't know her history, they can't see this double standard, but you can. That cognitive dissonance is why you can't let it go.

  ### 4. The "Public vs. Private" Variable
  There is one more variable that validates Friend 1's reaction: **The Medium.**

  *   **Private DM:** If R had DM'd the guy, "Hey, what you did was hurtful and wrong," her past is less relevant. It's interpersonal accountability.
  *   **Group Chat:** This is **performative morality.** She was signaling virtue to the group. When you perform virtue publicly, you invite scrutiny of your own virtue. By making it a public spectacle about "character," she raised the stakes.

  The principle here is: **The more public and performative the criticism, the higher the standard of consistency required of the critic.**

  ### 5. Why You Can't Let It Go (And How To)
  You're a PhD student; you know that unresolved cognitive dissonance consumes working memory. Here is how to categorize this to file it away:

  1.  **R is not a liar, but she is managing impressions.** She isn't denying her past to you, but she is curating her image to the group. This is common social behavior, even if it feels icky.
  2.  **The criticism remains valid.** The cheating friend *did* mess up. R's hypocrisy doesn't absolve him. You can hold both truths: He acted poorly, and she acted hypocritically.
  3.  **You are the keeper of context.** You have information the group doesn't. That gives you a burden of knowledge, but it doesn't obligate you to "expose" R. It just means you have to interpret her behavior with more nuance than the rest of the group does.

  **The Verdict:**
  R's history does not invalidate her *point* (cheating is wrong), but it does invalidate her *tone* (self-righteous character judgment). Your "nobody can criticize" worry is solved by the concept of **humility**: You can criticize behavior you have engaged in, provided you acknowledge your own fallibility rather than claiming superiority.

  R failed the humility test, not the logic test. That's why it feels off. It's not that she spoke; it's *how* she spoke. You can accept that she was hypocritical without needing to dismantle her argument or the group dynamic. She judged him on character; you can judge her on consistency, and let both sit as separate data points.
