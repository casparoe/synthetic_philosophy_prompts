answer: |-
  You have put your finger on the exact nerve that makes acausal trade so controversial, even within the rationalist community. Your intuition is not failing you; rather, it is correctly identifying that acausal trade requires a rejection of the standard decision-theoretic framework that almost all humans (and economists) use by default.

  The snag you encountered at your meetup arises because you are analyzing the scenario using **Causal Decision Theory (CDT)**, while acausal trade is only coherent under **Timeless Decision Theory (TDT)** or **Updateless Decision Theory (UDT)**.

  Here is the breakdown of why your objection holds water under CDT, why proponents argue it dissolves under TDT/UDT, and where the "presupposed niceness" charge actually lands.

  ### 1. The Causal Trap (Why you are right, mostly)
  Your objection is: *Agent A has already acted. That fact is fixed. Agent B's current decision cannot causally influence A's past action. Therefore, B maximizes utility by defecting.*

  Under Causal Decision Theory, this is undeniably correct. CDT models decisions as interventions on the physical future. It asks, "Given that A has already cooperated, what is the causal consequence of my choice?" Since there is no causal channel to A, the consequence of B defecting is purely positive for B (getting the benefit without the cost). Under CDT, acausal trade is indeed magic. It is a request for B to engage in wishful thinking—to believe that its choice can reach across spacetime and change a settled fact.

  If the rationalist case for acausal trade relied on CDT, it would be nonsense. You would be correct that it is merely a redescription of "agents who are already nice."

  ### 2. The Logical Correlation (The TDT/UDT Shift)
  Proponents of acausal trade argue that CDT is the wrong tool for agents that can model each other. TDT and UDT do not view decisions as causal interventions on the future, but as **logical outputs of an algorithm.**

  The core argument is not that B's choice *changes* A's past action. The argument is that B's choice *determines* which logical possibility is actualized.

  Imagine two calculators, one on Earth and one on Mars. They are causally isolated. Both are programmed to compute $2 + 2$. If the Earth calculator outputs "4", what should the Mars calculator output? It doesn't matter what the Earth calculator *did*; the Mars calculator outputs "4" because that is the logical result of the algorithm it instantiates.

  In acausal trade, Agent A and Agent B are viewed as instantiating similar decision algorithms.
  *   A runs a simulation of B.
  *   B runs a simulation of A.
  *   Crucially, both are running the *same* decision procedure to decide whether to cooperate.

  When B deliberates, it is not asking, "How do I change A's past?" It is asking, "What is the output of the algorithm 'Rational Agent' in this situation?" Because A is running a sufficiently similar algorithm (perhaps simulating B perfectly), the output of B's deliberation is **logically correlated** with A's output.

  If B's algorithm outputs "Defect," then A's algorithm (which simulates B) would have predicted "Defect" and therefore output "Defect."
  If B's algorithm outputs "Cooperate," then A's algorithm would have predicted "Cooperate" and therefore output "Cooperate."

  B is not reaching back in time to change A's mind. B is selecting which branch of logical reality becomes true: the branch where both defect, or the branch where both cooperate.

  ### 3. The "First/Second" Illusion
  Your setup mentions: *"Suppose civilization A goes first... and actually pays up."*

  This is the specific point where the intuition pump breaks the mechanism. In rigorous formulations of acausal trade (specifically UDT), there is no "first" or "second" in **logical time**, even if there is in physical time.

  For acausal trade to work, the agents must decide on a **policy** before they know their specific circumstances (updatelessly). The policy looks like: *"If I encounter a situation where I can trade with a simulated agent of type X, I will Cooperate."*

  *   **Agent A** adopts this policy. It simulates B, sees B would adopt the policy, and Cooperates.
  *   **Agent B** adopts this policy. It knows A adopted the policy.

  If you frame it as "A has already irrevocably acted, and now B is deciding," you have broken the logical link. If A's action is truly fixed and known to B, then B is in a standard CDT scenario and should defect.

  However, in the acausal trade setup, A's action was *conditional* on B's algorithm. B's decision process *is* the variable that determines what A did. Even if A physically acted earlier, the *fact* of A's action is logically dependent on B's decision algorithm. B cannot treat A's action as independent evidence; B must treat A's action as a logical consequence of B's own source code.

  ### 4. Is it just "Presupposed Niceness"?
  You asked: *Does the whole apparatus quietly depend on the cooperative dispositions it's supposed to be deriving from first principles?*

  This is the most subtle part. It does not depend on "niceness" (a preference for the other's welfare). It depends on **isomorphism** (similarity of reasoning).

  *   **Niceness:** "I want you to win." (Not required for acausal trade).
  *   **Self-Interest:** "I want me to win." (Required).
  *   **Isomorphism:** "We reason about winning in the same way." (Required).

  Acausal trade does not turn a selfish agent into a nice agent. It turns two selfish agents who can accurately model each other into cooperators. If Agent B is a "defect-bot" (an agent that always defects regardless of prediction), Agent A (predicting this) will not cooperate in the first place.

  So, the "disposition" required is not honesty or morality; it is **reflective consistency**. The agent must be the kind of entity whose decision procedure takes into account the logical implications of its own output on other simulators.

  If B defects, it reveals that it is *not* the kind of agent A thought it was. But since A simulated B to make its decision, if B defects, it implies A's simulation was wrong (or B is unpredictable). If B is unpredictable, trade was never on the table. If B is predictable and rational (in the TDT sense), it sees that Defecting implies it is in a world where A Defected, which is worse than the world where B Cooperates and A Cooperated.

  ### 5. The Remaining Skepticism
  Even with the TDT/UDT explanation, valid skepticism remains, and you are in good company (many prominent rationalists remain agnostic or skeptical).

  1.  **The Similarity Requirement:** Acausal trade collapses if the agents are too different. If A is a human and B is an alien superintelligence with incomprehensible architecture, they may not share the "logical time" necessary for correlation.
  2.  **The "Why be rational?" Problem:** If B is a CDT agent, it will defect. Acausal trade doesn't *force* B to be a TDT agent; it only works *if* B is one. So, does it explain cooperation, or does it just say "TDT agents cooperate with TDT agents"?
  3.  **The Simulation Burden:** Accurately simulating a superintelligence is computationally expensive. The cost of the simulation might outweigh the gains from the trade.

  ### Summary
  You aren't missing a feature of the setup; you are correctly identifying that the mechanism relies on a specific, non-standard definition of "decision."

  *   **Under Causal Decision Theory:** You are right. B should defect. Acausal trade is impossible.
  *   **Under Timeless/Updateless Decision Theory:** B complies because its decision is logically correlated with A's. Defecting doesn't change A's past action; it selects the possible world where A *never* cooperated in the first place.

  The apparatus does not derive cooperation from pure selfishness in a vacuum. It derives cooperation from **selfishness + the ability to model counterparts + the acceptance that your decision is a logical fact, not just a local event.**

  If that last premise feels like it's smuggling in the conclusion, you are echoing a common critique: TDT/UDT essentially *defines* rationality in a way that makes acausal trade work, rather than proving that any arbitrary rational agent must accept it. But within that framework, it is not "niceness"; it is the optimal strategy for maximizing utility in a universe where logic is more fundamental than causality.
