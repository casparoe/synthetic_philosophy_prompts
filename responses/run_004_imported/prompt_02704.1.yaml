answer: |-
  **Title:** The Boundary of the Boundary
  **Characters:**
  *   **Elias:** An Epistemicist (Williamsonian). Believes vagueness is ignorance of sharp boundaries.
  *   **Sofia:** A Supervaluationist (Finean/Keefe). Believes vagueness is semantic indecision over many precisifications.

  **Setting:** A university coffee shop, shortly after a seminar on the Sorites paradox.

  ***

  **Sofia:** That was a lively seminar. But I noticed you stayed quiet during the Q&A, Elias. I assume you weren't convinced by the speaker's attempt to dissolve the Sorites using degree theory?

  **Elias:** [Sips coffee] Degree theory just replaces sharp boundaries with sharp boundaries of a different sort. When does the truth value become *exactly* 0.5? No, I still think the only way to preserve classical logic is to accept that there is a sharp cut-off, we just can't know where it is.

  **Sofia:** The classic epistemicist stance. Sharp boundaries, hidden by ignorance. But I want to press you on something that usually gets glossed over in the introductory summaries. We're talking about higher-order vagueness.

  **Elias:** Go on.

  **Sofia:** Take your view. You say there's a specific grain of sand, $n$, such that $n$ grains make a heap, but $n-1$ do not. That's first-order vagueness handled by ignorance. But what about the boundary between the *definite* heaps and the *borderline* cases? Is there a sharp cut-off between the cases where it is definitely a heap and the cases where it is indefinite?

  **Elias:** Of course there is. If there weren't, classical logic would fail at the meta-level. There must be a point where 'Definitely Heap' stops applying.

  **Sofia:** And do we know where *that* boundary is?

  **Elias:** No. That would require a higher-order knowledge we don't possess.

  **Sofia:** So, you have a sharp boundary between heap and non-heap, which is unknowable. And you have a sharp boundary between 'definitely heap' and 'not definitely heap', which is also unknowable. It looks like you've just relocated the Sorites problem. Instead of a slippery slope from Heap to Non-Heap, you have a slippery slope from Known-Heap to Unknown-Heap. You haven't eliminated the vagueness; you've just pushed it up into the epistemic operators.

  **Elias:** I wouldn't call it "relocating" as if it were a bug. It's an explanation. Look, Sofia, the Sorites paradox relies on the tolerance principle: if $n$ is a heap, $n-1$ is a heap. I deny that. Why? Because of the Margin for Error principle.

  **Sofia:** Which states that for me to know $n$ is a heap, $n-1$ must also be a heap?

  **Elias:** Roughly. More precisely: If I know that $n$ grains constitute a heap, then $n$ grains *must* constitute a heap in nearby cases. Knowledge requires safety. If the boundary were knowable, I could distinguish $n$ from $n-1$ cognitively. But my cognitive faculties aren't that fine-grained. So, the boundary exists, but it lies within a "margin of error" where I cannot distinguish the true case from the false one.

  **Sofia:** But here is the regress worry. Let $D$ stand for "Definitely." You accept $Dp \to p$. But do you accept $Dp \to DDp$? If I definitely know $p$, do I definitely know that I definitely know $p$?

  **Elias:** No. That's the point. Luminosity fails. I can be in a state of knowing without knowing that I'm in that state.

  **Sofia:** Exactly. So, there is a boundary between the cases where I know and the cases where I don't know that I know. Let's call this the second-order boundary. Is *that* boundary sharp?

  **Elias:** Yes.

  **Sofia:** And is *that* boundary subject to a margin for error?

  **Elias:** Yes.

  **Sofia:** Elias, do you see the pattern? For every order of knowledge $K^n$, you posit a sharp boundary between $K^n$ and $\neg K^n$, and for every one of those boundaries, you posit a margin of error that renders *that* boundary unknowable. You are generating an infinite hierarchy of sharp, unknowable boundaries. Doesn't that look suspiciously like you are modeling vagueness by just adding more and more layers of ignorance? You haven't explained *why* the world is vague; you've just said "It's sharp, but we're blind to the sharpness, and blind to the blindness, and blind to the blindness of the blindness..."

  **Elias:** I don't see why that's a problem. The world is precise. Our cognitive access is limited. The "layers of ignorance" aren't a bug; they are the phenomenological result of the interaction between a sharp world and limited observers. The alternative is to change the logic. Tell me, Sofia, how does Supervaluationism handle the boundary of admissibility?

  **Sofia:** Carefully.

  **Elias:** [Smiles] I expected that. Look, your view is that a sentence is supertrue if it is true on all *admissible* precisifications. A precisification is a way of making the language sharp. So, "This is a heap" is supertrue if it comes out true on every way of drawing the line that respects the meaning of "heap."

  **Sofia:** Correct. This preserves penumbral connections. "This is a heap or this is not a heap" comes out true, even in borderline cases, because it's true on every precisification.

  **Elias:** But what makes a precisification *admissible*?

  **Sofia:** It must respect the usage and conventions of the language. You can't precisify "heap" to mean "a single grain." That violates the semantic constraints.

  **Elias:** Is the set of admissible precisifications sharp?

  **Sofia:** ...That is the crux of the matter.

  **Elias:** If the set is sharp, then there is a specific precisification $P$ that is admissible, and a specific precisification $P^*$, which differs only microscopically from $P$, that is *inadmissible*. But if $P$ respects usage, and $P^*$ is virtually identical, why would $P^*$ violate usage? You face the exact same Sorites series I do, but applied to *meanings* instead of *grains of sand*.

  **Sofia:** I grant that the notion of "admissibility" is itself vague. That is higher-order vagueness.

  **Elias:** But if admissibility is vague, then "supertruth" is vague. And if supertruth is vague, then your logic isn't classical anymore, is it? You've introduced a vague operator into the meta-language. You said you wanted to preserve classical logic, but now your definition of truth relies on a vague boundary.

  **Sofia:** I'm not trying to eliminate vagueness, Elias. I'm trying to model it. You try to explain it away by calling it ignorance. I accept that the semantic rules themselves don't dictate a unique extension. The "space" of admissible precisifications doesn't have a sharp boundary. There are clear cases of admissible precisifications, clear cases of inadmissible ones, and a penumbra in between.

  **Elias:** But if there is a penumbra of admissible precisifications, then there are cases where it is indefinite whether a precisification is admissible. If it's indefinite whether a precisification is admissible, it's indefinite whether a sentence is supertrue. So, you have to iterate the 'Definitely' operator again. $Dp$ is true if $p$ is true on all admissible precisifications. But what about $DDp$?

  **Sofia:** $DDp$ is true if $p$ is true on all precisifications that are *definitely* admissible.

  **Elias:** And is there a sharp boundary between the *definitely* admissible and the *indefinitely* admissible?

  **Sofia:** If I say yes, I'm back to the sharp boundary problem you have. If I say no, I admit higher-order vagueness all the way up.

  **Elias:** And doesn't that threaten to collapse your account? If the hierarchy of 'Definitely' operators never stabilizes—if there is no point where the vagueness stops—then you never actually reach a fact of the matter about truth. You have an infinite regress of indeterminacy.

  **Sofia:** Not necessarily. We can model this using a tree of precisifications. At level 1, we have the set of admissible precisifications. At level 2, we have the set of admissible precisifications of *that* set. The logic can handle this without requiring a final, sharp cut-off. We can say that the Sorites premise fails not because there is a sharp cut-off we can't see, but because the inference rule fails to preserve supertruth across the borderline region.

  **Elias:** But why does it fail? On my view, it fails because the premise is false at the cut-off. On your view, it fails because... what? Because truth value gaps propagate?

  **Sofia:** Because in the borderline region, the premise "If $n$ is a heap, $n-1$ is a heap" is not supertrue. It's false on some admissible precisifications (the ones that draw the line between $n$ and $n-1$) and true on others. So the conditional isn't supertrue.

  **Elias:** Okay, but let's return to the relocation charge. You say the set of admissible precisifications is vague. I say the set of known propositions has a sharp boundary that is unknowable. We both have a boundary problem.
  My cost: I have to accept that there are metaphysically sharp cut-offs for "heap" that are in principle unknowable.
  Your cost: You have to accept that the meta-linguistic concept "admissible" is vague, which means your truth predicate is vague, which means you can't fully define your own semantics in a classical metalanguage.
  Who is paying the higher price?

  **Sofia:** I think you are. Your view implies that there is a fact of the matter about whether a specific molecule constitutes a heap, independent of our interests or usage. That seems ontologically extravagant. You're positing a hidden structure to the world that does no work other than saving bivalence.
  My view respects the intuition that vagueness is a feature of language and thought, not the world. Yes, "admissibility" is vague. So what? Vagueness is everywhere. Why should the theory of vagueness itself be precise? That's like demanding a map be as detailed as the territory it represents.

  **Elias:** But if the theory of vagueness is vague, can it be true? If "admissible" is vague, then the statement "Vagueness is semantic indecision over admissible precisifications" is itself vague. Is it *definitely* true? Or just *supertrue* relative to some higher-order precisification? It seems you lose the ability to assert your own theory as straightforwardly true.

  **Sofia:** I can assert it as supertrue. It holds across all the ways of making the meta-language precise that respect our philosophical usage.
  But let's turn your Margin for Error back on you. You say knowledge requires a margin. $Kp \to \neg K \neg p$ in nearby cases. But is the *size* of the margin sharp?
  Suppose the margin is 5 grains. Is it definitely 5? Or could it be 5.0001? If the margin size is vague, then your explanation of ignorance relies on a vague parameter. If the margin size is sharp, then we are back to the unknowable sharp boundary of the margin itself. You haven't escaped the regress; you've just built it into the cognitive architecture.

  **Elias:** The margin size is determined by the reliability of the discriminative faculties. Those are biological. Biological properties are arguably sharp at the micro-level, even if we can't measure them. But even if the margin is vague, my point stands: the *existence* of a boundary is required for classical logic to hold.
  You, however, seem to be embracing the regress. You admit higher-order vagueness. But if there is higher-order vagueness, there is no final truth. There is no proposition that is "just true" without qualification. Everything is "true to a degree of definiteness." That looks suspiciously like the degree theory you rejected earlier.

  **Sofia:** It's not degree theory. It's a hierarchy of definiteness operators. The difference is that I don't posit a hidden sharp cut-off at the top of the hierarchy. I allow the hierarchy to remain open.
  Here is my strongest move, Elias. You claim your view saves classical logic. But to do so, you have to accept that instances of the Excluded Middle like "Either $n$ is a heap or $n$ is not a heap" are true even when $n$ is a borderline case. You say this is because one disjunct is true, we just don't know which.
  But if we can never know which, and there is no semantic or epistemic access to the truth-maker, in what sense is it a *fact*? It becomes a metaphysical posit with no explanatory power.
  My view says the disjunction is true because it holds on all precisifications, but neither disjunct is supertrue. I save the intuition that there is no fact of the matter about the borderline case, while still validating the tautology.

  **Elias:** You validate the tautology by changing the definition of truth. That's a technical fix, not a metaphysical solution.
  Let's look at the relocation charge one last time. You say I relocate the problem to the margin. I say you relocate the problem to the admissibility relation.
  If "admissible" is vague, then there is a borderline case of admissibility. Let $P$ be a borderline admissible precisification. Is $P$ in the set of admissible precisifications used to evaluate supertruth?
  If yes, then you've drawn a sharp line including $P$.
  If no, you've drawn a sharp line excluding $P$.
  If "it depends," then the evaluation of supertruth is itself indefinite.
  So, is "Snow is white" supertrue? Only indefinitely supertrue? And is *that* definite?
  You are forced to say that truth itself is vague. I am willing to say truth is sharp, but knowledge is vague. Which is the better bargain?

  **Sofia:** I think saying truth is vague is more honest than saying the world is sharp but we are perpetually blind. You ask which is the better bargain? I think yours costs too much intuition. You ask students to believe that there is a specific hair whose removal makes a man bald, and that this is a hard fact equivalent to $2+2=4$, but we can never, ever know it.
  I ask students to believe that language is a flexible tool that doesn't always carve reality at the joints. The "relocation" to admissibility isn't a failure; it's an acknowledgment that semantic rules are human practices, and human practices are inherently fuzzy.

  **Elias:** And I ask them to believe that logic is robust. If we accept your view, we have to complicate our inference rules. We can't always rely on contraposition or conditional proof in the way we're used to when 'Definitely' is involved. I keep the logic simple and pay the metaphysical price. You keep the metaphysics intuitive and pay the logical price.

  **Sofia:** So, for the seminar...

  **Elias:** So, for the seminar, we tell them that the Sorites paradox isn't solved. It's managed.

  **Sofia:** Managed by choosing which bullet to bite. Either the bullet of unknowable sharp boundaries...

  **Elias:** ...Or the bullet of vague truth and higher-order regress.

  **Sofia:** [Raises coffee cup] To higher-order vagueness. The problem that won't stay put.

  **Elias:** [Clinks cup] And the boundaries we can't see, or the ones we can't draw.

  ***

  **Discussion Questions for Students:**
  1.  **The Relocation Charge:** Does Elias successfully defend the claim that sharp boundaries of ignorance are preferable to vague boundaries of admissibility? Or does Sofia successfully argue that Epistemicism just pushes the Sorites paradox up to the meta-level?
  2.  **Margin for Error:** Elias relies on the Margin for Error principle to explain ignorance. Does this principle itself suffer from higher-order vagueness (i.e., is the *size* of the margin vague)? If so, does this undermine the Epistemicist explanation?
  3.  **Admissibility:** Sofia admits the set of admissible precisifications is vague. Does this lead to an infinite regress of "indefinite truth," or can Supervaluationism accommodate higher-order vagueness without collapsing?
  4.  **Theoretical Virtues:** Elias prioritizes Classical Logic; Sofia prioritizes Metaphysical Intuition (no hidden sharp facts). In the context of vagueness, which theoretical virtue should take precedence?
