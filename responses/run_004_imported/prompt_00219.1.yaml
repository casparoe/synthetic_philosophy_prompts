answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late evening. Empty mugs and scattered papers cover the table. Elena (Eternalist) is sketching Minkowski diagrams on a napkin. Marcus (Presentist) is staring into his cold coffee.*

  **Elena:** Look, I'm not trying to be dismissive, Marcus. But you have to see why the physics club is giving you a hard time. It's not just that Special Relativity is weird; it's that it seems to logically evaporate the "present."

  **Marcus:** I know the Rietdijk–Putnam argument, Elena. The Andromeda Paradox. Two people walk past each other on the street. One is moving toward Andromeda, one away. Because of the relativity of simultaneity, their "now" slices through spacetime at different angles. For one, an Andromedan fleet has already launched; for the other, the decision hasn't even been made.

  **Elena:** Exactly. And here is the knife twist: If the fleet launch is real for the first walker, and the second walker is real standing next to him, then the fleet launch must be real for the second walker too. Existence is transitive. If A exists, and B exists for A, then B exists.

  **Marcus:** That premise—existence is transitive across spacelike separated events—is where I stop you.

  **Elena:** But how can you stop it? If I can point to an event and say, "That is happening now," and you say, "No, that's in your future," we can't both be right about what *exists* unless everything exists. If the future event is real for the moving observer, it's ontologically fixed. It's in the block.

  **Marcus:** You're conflating *coordinate reality* with *ontological reality*. Special Relativity gives us a geometry of measurements. It tells us how clocks sync and how light propagates. It tells us there is no *physically detectable* privileged frame. I grant you that. I'm not going to pull a Lorentz and say there's an ether we can't measure.

  **Elena:** Okay, so you accept the physics. No privileged frame. So, what makes your "now" special? If physics says your "now" is just a subjective slice of the block, why should metaphysics disagree?

  **Marcus:** Because physics describes the *relations* between events, not the *substance* of reality. Think of it like this: A map of the world treats every location as equally real. New York, Tokyo, London—they are all just coordinates on the paper. But if I am in London, "Here" has a metaphysical privilege for me. It's where I act. It's where I experience.

  **Elena:** That works for space because we can move back and forth. We can verify that Tokyo exists while we are in London. We can't do that with the future. In the Andromeda case, the "future" event for one observer is the "present" for another. If it's present for him, it's causally fixed.

  **Marcus:** Is it? Or is it just *geometrically* fixed relative to his motion? Look, I'm willing to make a hard concession. I concede that there is no *global* present. There is no cosmic clock that ticks for the whole universe simultaneously.

  **Elena:** *(Leans in)* Okay, this is new. If there's no global present, then Presentism is false. Presentism requires a universal "now."

  **Marcus:** Not necessarily. I'm proposing a **Local Presentism**. The "present" is a property of the observer's worldline, not a slice of the universe. Reality *becomes* at the point of contact.

  **Elena:** But that collapses into solipsism. If reality only becomes *for you* at your location, then what about me? Am I real for you?

  **Marcus:** You are real for me when our light cones intersect. When I see you. Until then, you are... potential.

  **Elena:** That's not Presentism, Marcus. That's just Causal Determinism with extra steps. And it doesn't solve the Andromeda problem. The walker moving toward Andromeda isn't just *seeing* the fleet launch; his plane of simultaneity *includes* it as a present fact. If that fact is real, the future is open only in your head, not in the world.

  **Marcus:** Okay, let's attack the transitivity premise again. You say: "If Event X is real for Observer A, and Observer A is real for Observer B, then Event X is real for Observer B."

  **Elena:** It seems logically airtight.

  **Marcus:** It assumes "real" is a monadic property. Like "being red." If the apple is red, it's red for everyone. But what if "real" is indexical? Like "here" or "now."

  **Elena:** You're saying existence is relative? "Exist for me" but not "Exist simpliciter"?

  **Marcus:** I'm saying that *temporal* existence is relative, just like spatial position. If I say "It is raining here," and you say "It is not raining here," we aren't contradicting each other if we are in different places. Why can't we say "The fleet launches now" and "The fleet does not launch now" without contradiction, if our "nows" are different?

  **Elena:** Because rain is a local weather pattern. Existence is fundamental. If the fleet *exists*, it exists. You can't have "partial existence." Either the ships are built or they aren't. If the ships are built for the moving walker, they are built. Period. That means the decision to build them was made in the past. The future is determined.

  **Marcus:** But *when* was the decision made? That's the point. In the block universe, the decision is just a coordinate. In my view, the decision *happens*. The geometry of spacetime describes the *possibilities* of causal connection, not the *actuality* of being.

  **Elena:** So you're saying Minkowski spacetime is... what? A lie?

  **Marcus:** No. It's a map of causal potential. It shows what *can* influence what. But it doesn't tell us which events are *actualized*. The "block" is the menu; Presentism is the meal being eaten. Just because the menu lists the dessert doesn't mean the dessert is currently on the table.

  **Elena:** But in relativity, the "dessert" interacts with the "appetizer" via gravity, via light, via geometry. The future mass of the Andromeda fleet curves spacetime *now* for the walker. If the future has physical effects on the present, how can it not be real?

  **Marcus:** *(Pauses, rubbing his temple)* That's the strongest point. If the future constrains the present geometrically... Okay. I have to bite a different bullet. I have to say that the *truth* of a statement about the future doesn't require an *existing object* to make it true.

  **Elena:** Truthmakers, Marcus? You're going to deny truthmakers?

  **Marcus:** I'm saying the truthmaker for "The fleet will launch" isn't the *fleet*. It's the *current state of the Andromedan council* plus the laws of physics. The future is real in the sense that it is *determined*, but not in the sense that it *exists*.

  **Elena:** But relativity says it's not even determined in a linear way! Depending on how you move, the launch is past, present, or future. If it's past for one observer, it's fixed. You can't change the past. So if it's fixed for him, it's fixed for everyone.

  **Marcus:** This brings us back to the core disagreement. You treat spacetime as a container that holds events. I treat "events" as processes of becoming. The fact that Observer A assigns a "past" coordinate to the launch doesn't mean the launch has *ontologically occurred* in a metaphysical sense. It just means it lies within his past light cone structure.

  **Elena:** You're drawing a distinction between "physical past" and "metaphysical past."

  **Marcus:** Yes. Physics deals with invariants and coordinates. Metaphysics deals with being. Just because physics cannot detect a privileged "now"—because light speed is finite—doesn't mean the experience of "now" is an illusion.

  **Elena:** But if physics can't detect it, and it has no causal power—because if it had causal power, we could use it to signal faster than light—then what work is it doing? It's a ghost.

  **Marcus:** It's the ground of agency! If the future already exists, as your block universe claims, then my deliberation about what to order for dinner is an illusion. I'm just reading a script.

  **Elena:** Not an illusion. It's just that the script includes the deliberation. The deliberation is the *cause* of the order, even if both are in the block.

  **Marcus:** But the *openness* is gone. In your view, I *cannot* order the salad if the block says I order the soup. In my view, the block is just a retrospective abstraction. We build the block as we move.

  **Elena:** *(Taps the napkin)* But the Andromeda walkers are building the block at different rates. One has the fleet in their block; the other doesn't. They are standing shoulder to shoulder. How can reality be fragmented like that?

  **Marcus:** Maybe reality *is* fragmented. Maybe there is no "God's eye view" of the universe. There is only the view from somewhere. And from *here*, in this moment, the future is not real. The fact that a moving observer has a different mathematical slice of simultaneity doesn't force me to accept their slice as ontologically binding.

  **Elena:** So you're privileging your own rest frame?

  **Marcus:** I'm privileging the *phenomenological* frame. The frame of experience. Physics requires us to abstract away the observer to get objective laws. But ontology can't abstract away the observer, because existence is always existence *for* a subject.

  **Elena:** *(Sighs, leaning back)* So you're retreating to a kind of Kantian idealism. Spacetime is the phenomenon, but the noumenal reality is this flowing "now" that science can't touch.

  **Marcus:** I'm saying science describes the *structure* of the world, but not the *actuality* of it. A blueprint of a house contains all the rooms, past, present, and future construction. But living in the house means you're only in one room at a time. The blueprint isn't the house.

  **Elena:** The problem is, in relativity, the blueprint interacts with itself. Gravity doesn't care if you're "living" in the room. The mass of the future fleet curves the space of the present walker. The geometry is all there, all at once. You can't separate the structure from the substance when the structure *is* the substance.

  **Marcus:** Then perhaps we define "substance" differently. For you, substance is the manifold. For me, substance is the becoming.

  **Elena:** And the cost of your view is that you have to say the most successful physical theory of the 20th century is metaphysically incomplete.

  **Marcus:** And the cost of your view is that you have to say the most fundamental experience of human consciousness—the flow of time—is a persistent illusion.

  **Elena:** *(Smiles faintly)* I can live with an illusion if the math holds up.

  **Marcus:** And I can live with mathematical abstraction if it preserves the reality of choice.

  **Elena:** So we're at a stalemate. The Rietdijk–Putnam argument proves the block is *consistent* with physics.

  **Marcus:** And I maintain it doesn't prove the block is *necessary*. It proves simultaneity is relative. It doesn't prove existence is absolute.

  **Elena:** *(Folds the napkin)* I'll take that. For now.

  **Marcus:** *(Raises his cold coffee)* To the present.

  **Elena:** *(Clinks her mug)* To the block.

  *They drink. The barista calls a name. For a moment, the sound exists for both of them, before fading into the past.*
