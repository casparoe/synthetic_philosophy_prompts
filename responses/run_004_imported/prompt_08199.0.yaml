      *   **Text:** S. W. Dyde's 1896 translation of the Remark to §324.
      *   **Problem:** The user understands the "ocean/stagnation" metaphor at the end but finds the preceding argument about "accident," "necessity," "finitude," and "freedom" obscure. They want the *inferential structure* reconstructed.
      *   **Key Questions:**
          1.  Why is the finitude of life/property "necessary" rather than "accidental"?
