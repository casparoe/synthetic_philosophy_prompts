      *   *Clarification on Dyde:* Dyde translates *Zufälligkeit* as "accident/accidental." Modern translations (Knox, Nisbet) use "contingency." I should note this terminological point because "accident" sounds too Humean/empiricist to modern ears. "Contingency" is better for Hegel's logic.
