      *   **The Substantive vs. Notational Dispute:** Is it just semantics? Lewis claims his theory avoids modal realism problems. Kripke claims Lewis's theory makes *de re* modality (about the thing itself) unintelligible. Most contemporary metaphysicians lean towards Kripke/Plantinga on this specific point because Lewis's modal realism (concrete worlds) is a huge cost to pay for counterpart theory.
