      *   **Major Depressive Disorder (MDD):** Very common label. People identify as "depressed." However, it's often seen as a state rather than a kind of person. Less "identity" than ADHD/Autism. *Tier: B.*
      *   **Schizophrenia:** Severe impairment often reduces the capacity for the *classified* to engage in the loop (though families do). The label is often imposed externally. Less community *of the classified* driving the change compared to neurodiversity. *Tier: C.*
