      *   **Gender Dysphoria:** Classification interacts deeply with identity. Community drives changes in diagnostic criteria (e.g., depathologization shifts). Very strong feedback. *Tier: S* (Maybe A? It's fundamental to identity). Let's put it in S because the classification *creates* the pathway for medical transition, fundamentally altering the life trajectory and the category's meaning.
