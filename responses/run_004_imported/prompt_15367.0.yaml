  2.  **Deconstruct Hacking's "Looping Effect":**
      *   *Core Concept:* Human kinds interact with the people classified. People become aware of the classification, adjust their self-concept/behavior, which in turn alters the extension/intension of the kind.
      *   *Key Conditions for Strong Looping:*
          1.  **Awareness:** The classified person knows the label.
          2.  **Agency/Capacity:** The person has the cognitive/social capacity to understand and act on the label.
          3.  **Community/Identity:** There is a community where the label is discussed, adopted, or resisted (identity formation).
          4.  **Behavioral Change:** The label causes changes in behavior or experience (self-fulfilling or self-modifying).
          5.  **Instability:** The classification itself shifts over time due to these interactions.
      *   *Weak Looping (Indifferent Kinds):* The classified entity doesn't know it's classified (e.g., quarks), or lacks the capacity to interact with the classification meaningfully (e.g., severe cognitive impairment, though Hacking focuses on *human* kinds).
      *   *Nuance:* Some conditions impair the very capacity required for looping (e.g., severe psychosis might reduce the ability to integrate the label into a coherent narrative compared to neurodivergence). Some labels are imposed externally without community uptake.

