answer: |-
  Your skepticism is well-founded. As it stands, the scientists' argument risks committing the **genetic fallacy**: assuming that explaining the *origin* of a belief (evolution) automatically disproves its *validity* (ethics). If you dismiss disgust because it's evolutionary, you must, by the same logic, dismiss the intuition that torture is wrong, since that too is evolutionary.

  However, there is a principled fault line that saves the scientists' point without collapsing all morality. It lies in **what the intuition tracks**.

  Evolutionary explanations only undermine an intuition if the selective pressure that created it is **independent of the moral truth** it claims to perceive.
  *   **Cruelty/Consent:** We evolved aversions to cruelty and violations of consent because they cause *suffering* and destabilize cooperation. The evolutionary origin (group survival) aligns with the moral truth (suffering is bad; autonomy matters). Even knowing the origin, the intuition still "tracks" real harm.
  *   **Chimeras/Contamination:** We evolved disgust to avoid *pathogens* and category errors that signaled disease risk. In the case of lab-grown organs in sterile environments, the pathogen risk is managed or absent. Here, the evolutionary trigger (mixing tissues) fires, but the original threat (death by disease) is missing. The intuition is a **heuristic misfire**.

  **The Verdict:** The scientists are right to discount the disgust, but not simply because it is "old." They are right because disgust is a **purity heuristic** designed for pathogen avoidance, whereas moral weight usually requires **harm or rights violations**. Your paragraph should pivot from "it's just evolution" to "it's an evolutionary heuristic detached from actual harm."

  **Suggested framing for your piece:**
  > "The scientists argue that our unease is an evolutionary relic, but that alone doesn't make it ethically irrelevant; our revulsion at cruelty is equally ancient. The difference lies in what these instincts track. Intuitions about cruelty and consent track real suffering and autonomy violations that persist regardless of their origin. Disgust at chimeras, however, tracks 'purity' and contamination risk—a heuristic for avoiding pathogens. In a sterile lab, that heuristic misfires. We can acknowledge the feeling is real without accepting it as evidence of harm, distinguishing between an instinct that protects us from disease and one that protects us from wrongs."
