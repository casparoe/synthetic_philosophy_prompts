prompt: |-
  I'm a science journalist finishing a feature on research aimed at eventually growing transplantable human organs inside animal embryos, by introducing human stem cells into pig embryos at a very early stage so that an organ forming later would be made largely of human cells. The work understandably unsettles people who have no objection to organ donation or stem-cell research generally, and in interviews, the scientists and bioethicists advising me on the piece keep reaching for the same move to set that unease aside: they say the discomfort is simply what an old piece of our psychology—shaped to stop our ancestors from interbreeding with other species and from contaminating themselves with foreign tissue—feels like from the inside, and that once you know where the feeling comes from, you can no longer treat it as evidence that the research is actually wrong. As one developmental biologist put it to me, "the queasiness is just contamination-detection running in the background; it isn't reporting on ethics."

  That argument struck me as basically sound until I tried applying the same move to reactions I do take seriously—that gratuitous cruelty is wrong, say, or that people shouldn't be experimented on without consent—which almost certainly have comparably old evolutionary explanations rooted in kin recognition, reciprocity, and group living. Nobody thinks discovering that origin should make us trust those reactions less, which leaves me stuck: either her argument proves considerably more than she wants it to, or there's some principled reason it discredits disgust at chimeras but not those other cases, and I haven't been able to work out what that reason would be. I have a philosophy minor from a decade ago and a paragraph to file by Thursday. Could you help me work out whether the argument for setting the disgust reaction aside actually holds up, and, if there's a genuine fault line between the intuitions this kind of explanation undermines and the ones it doesn't, what it consists in? I'd rather have your honest read on the logic than a survey of both sides.
