prompt: |-
  This cluelessness stuff just turned from an interesting tangent into an actual work problem. I do research for a foundation that funds global health and animal welfare work, and our strategy lead has started justifying basically our whole neartermist portfolio (bed nets, cage-free campaigns) by appeal to this "bracketing" framework going around the cluelessness literature: find the largest set of beneficiaries you're not clueless about, the "maximal bracket-set," and base the decision on that, bracketing out everyone else. It's clever, but it also smells a bit like we found a theory that conveniently spits out the exact portfolio we already had.

  One of the philosophers who co-developed it is coming in for a recorded staff Q&A and I got stuck writing the questions. Give me 8-10 that go past "so how does bracketing work" -- at least one pressing the dilemma over what "locations of value" even are (people vs. points in spacetime, and why either horn is supposed to be fine), one on why biting the bullet on the cyclicity result (bracketing can rank A over B, B over C, and C over A) is cheaper than just admitting cluelessness, one making her explain why picking out a "maximal bracket-set" isn't just as arbitrary as the "ignore small enough probabilities" move the same paper rejects as arbitrary, and one demanding an actual case where bracketing favors the long-termist option over the safe one, so we can tell if its a real independent theory or a retroactive excuse for grants we'd already make. Toss in a quick follow-up for each, keyed to whatever dodge shes most likely to reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Context:** The user works for a foundation funding global health and animal welfare (neartermist causes). Their strategy lead is using a specific philosophical framework ("bracketing" from the cluelessness literature) to justify their existing portfolio.
      *   **Suspicion:** The user suspects this is motivated reasoning (finding a theory that justifies pre-existing decisions) rather than a genuine guide.
      *   **Task:** Write 8-10 questions for a Q&A with a philosopher who co-developed the bracketing framework.
      *   **Requirements:**
          *   Go beyond basic "how does it work" questions.
          *   Include specific thematic questions:
              *   Locations of value (people vs. spacetime points).
              *   Cyclicity results (A > B, B > C, C > A) vs. admitting cluelessness.
              *   Arbitrariness of "maximal bracket-set" vs. ignoring small probabilities.
              *   Demand a case where bracketing favors long-termism over neartermism (testing independence).
          *   Include a follow-up for each question anticipating potential dodges.
          *   Tone: Professional but probing/critical (suitable for a staff Q&A).

  2.  **Deconstruct the Philosophical Framework (Mental Sandbox):**
      *   *What is "Cluelessness"?* It's the problem where we don't know the long-term consequences of our actions (e.g., saving a life now might lead to a tyrant being born later).
      *   *What is "Bracketing"?* It's a decision-theoretic approach to handle cluelessness. The idea is to identify a subset of consequences we *can* know about (the "bracket") and make decisions based on that, ignoring the unknown outside, provided the bracket is "maximal" in some sense.
      *   *The Critique:* If the bracket is defined by what we know, and we know more about near-term effects (bed nets) than long-term effects (existential risk), bracketing will systematically favor near-termism. This looks like a justification for the status quo.
      *   *Cyclicity:* If the preference relation isn't transitive due to how brackets overlap, you get cycles. Standard rationality hates cycles.
      *   *Locations of Value:* Is value located in individuals (person-affecting) or spacetime points (impersonal)? This affects how brackets are drawn.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Theme 1: Locations of Value.*
          *   *Draft:* Do we count people or spacetime?
          *   *Refinement:* Need to press the dilemma. If people, we ignore future people we don't know exist. If spacetime, we get swamped by uncertainty.
          *   *Follow-up:* She'll probably say "it depends on the axiology." Push back: doesn't that make the decision theory parasitic on unresolved metaethics?

      *   *Theme 2: Cyclicity.*
          *   *Draft:* Why is A>B>C>A okay?
          *   *Refinement:* Standard rationality requires transitivity. If bracketing violates this, why is that cost lower than just saying "I don't know"?
          *   *Follow-up:* She might say "it's local rationality." Push: doesn't that allow money-pumping in a global context?

      *   *Theme 3: Arbitrariness of the Bracket.*
          *   *Draft:* Isn't picking the bracket arbitrary like ignoring small probs?
          *   *Refinement:* The paper rejects ignoring small probabilities as arbitrary. But defining the "maximal bracket-set" seems to rely on epistemic contours that are equally fuzzy.
          *   *Follow-up:* She'll claim "epistemic access" is objective. Push: epistemic access is agent-relative and time-relative.

      *   *Theme 4: Long-termism Test.*
          *   *Draft:* Show me where this picks long-termism.
          *   *Refinement:* We need a concrete case where bracketing overrides neartermist intuition. If it never does, is it just a shield?
          *   *Follow-up:* She might give a hypothetical. Push: Is there a *real* funding decision, not a thought experiment?

      *   *Theme 5: The "Maximal" Definition.*
          *   *Draft:* How do you define maximal?
          *   *Refinement:* Does "maximal" mean largest expected value or largest epistemic certainty? If certainty, it biases toward the known (nearterm).
          *   *Follow-up:* She'll distinguish the two. Push: In practice, certainty correlates with nearterm.

      *   *Theme 6: Cluelessness vs. Ignorance.*
          *   *Draft:* Is this just ignoring ignorance?
          *   *Refinement:* Cluelessness isn't just lack of data; it's structural uncertainty. Does bracketing pretend structural uncertainty is resolvable?
          *   *Follow-up:* She'll say it manages it. Push: Does it manage it or mask it?

      *   *Theme 7: Aggregation.*
          *   *Draft:* How do we add up the brackets?
          *   *Refinement:* If different stakeholders have different brackets, how do we aggregate?
          *   *Follow-up:* She'll talk about consensus. Push: What if the foundation's bracket differs from the beneficiaries'?

      *   *Theme 8: Retrospective Justification.*
          *   *Draft:* Are we just justifying old grants?
          *   *Refinement:* Frame it gently but firmly. Does the theory generate recommendations or validate existing ones?
          *   *Follow-up:* She'll say "both." Push: Which came first in your development of the theory?

      *   *Theme 9: Sensitivity to Epistemic Improvement.*
          *   *Draft:* What if we learn more?
          *   *Refinement:* If we invest in research, does the bracket expand? Or does the framework discourage investigating the "unknown" outside the bracket?
          *   *Follow-up:* She'll say it encourages research. Push: Does it prioritize research on the bracket or outside it?

      *   *Theme 10: Opportunity Cost.*
          *   *Draft:* What about the cost of ignoring the outside?
          *   *Refinement:* By bracketing out the long-term, do we account for the *risk* that the outside contains negative value?
          *   *Follow-up:* She'll say that's outside the bracket. Push: Then how is it a *decision* theory and not a *blinder* theory?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Specific themes covered? Yes. Tone appropriate? Needs to be sharp but polite enough for a recorded Q&A.
      *   *Self-Correction on Tone:* Ensure the questions don't sound like attacks but like rigorous stress-tests. The user is skeptical, but the Q&A is professional. The questions should sound like "help us understand the limits" rather than "you are wrong."
      *   *Check Specific Requirements:*
          *   Locations of value (People vs. Spacetime)? -> Question 1.
          *   Cyclicity? -> Question 3.
          *   Arbitrariness (Bracket vs. Small Prob)? -> Question 5.
          *   Long-termist case? -> Question 8.

  5.  **Final Polish:** Organize logically. Start with metaphysical foundations, move to decision-theoretic mechanics, end with practical application/independence. Ensure the follow-ups anticipate the specific "philosopher move" (e.g., retreating to idealization, distinguishing concepts).

      *(Self-Correction during drafting)*: Make sure I don't use too much jargon without context, but since the user is familiar with the literature, I can use terms like "transitivity," "axiology," and "epistemic contours."

