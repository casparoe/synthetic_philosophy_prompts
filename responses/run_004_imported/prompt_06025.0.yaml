      *   **Modern BB Problem:** In eternal inflation or de Sitter space, the vacuum has a temperature/entropy. Fluctuations happen. It is statistically vastly more probable for a single brain (with false memories) to fluctuate into existence than an entire ordered universe like ours. If the theory predicts BBs outnumber ordinary observers (OOs), then *we* are likely BBs. But if we are BBs, our observations (including the theory itself) are unreliable. This is a *reductio ad absurdum* of the theory.
