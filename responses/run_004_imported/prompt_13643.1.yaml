answer: |-
  **Setting:** *A quiet corner of the university faculty club, late afternoon. Two coffee cups sit between them. **Elena** (Professor of Philosophy of Science, specializing in biosemiotics) and **Marcus** (Professor of Philosophy of Biology, specializing in reductionism and Developmental Systems Theory) have just finished attending a colloquium by a retired molecular biologist—the one who prompted this conversation.*

  **Elena:** You have to admit, Marcus, Arthur's confession was striking. Forty years speaking the language of "codes" and "instructions," only to realize he never asked if the language was literal. It suggests the practice of biology outpaces its philosophy. But now that he's asking, I think the Code Biologists are right. The architecture of translation *is* semiotic.

  **Marcus:** I admit Arthur's humility is charming. But I don't think he needs to lose sleep over the literalness of his metaphors. The "code" works because it predicts outcomes, not because DNA is secretly whispering secrets to the ribosome. My worry is that when we say "literal code," we imply there's a layer of reality *above* the biochemistry. I don't see it.

  **Elena:** It's not above the biochemistry; it's *in* the organization of it. Let's start with the strongest argument for the literal view: arbitrariness. Crick called it a "frozen accident." There is no chemical affinity between a codon, say UUU, and phenylalanine. If there were, it would be chemistry, not coding. The pairing is mediated by the aminoacyl-tRNA synthetases. That mediation is contingent. It could have been otherwise. In semiotics, a sign where the link between signifier and signified is contingent rather than necessary is the definition of a symbol.

  **Marcus:** I grant you the contingency. The mapping isn't dictated by stereochemical fit in the way a substrate fits an active site. But "contingent causal pathway" does not equal "symbol." Consider a railway switch. The position of the lever determines which track the train takes. That link is arbitrary; I could wire the lever the opposite way. Does the lever carry "semantic information" about the destination? Or is it just a physical cause in a chain? The synthetases are just molecular levers.

  **Elena:** That's the standard reductionist move, Marcus, but it misses the functional context. A railway switch doesn't exist *for* the purpose of directing trains in the way a cell exists *for* the purpose of self-maintenance. You're stripping out the teleology. Maynard Smith addressed this. He argued that natural selection occupies the role of the designer. In a human code, a designer fixes the meaning. In biology, selection stabilizes the mapping because it works. That historical stabilization creates a norm. When a mutation occurs, it's not just a different chemical outcome; it's an *error*. You can't have error in pure chemistry. You only have error where there is a rule to break.

  **Marcus:** Careful. "Error" is a perfectly good causal description without invoking semantics. If a machine is designed to sort red balls from blue balls, and a blue ball goes into the red bin, we call that an error. We don't need to ask if the bin "understands" redness. The "norm" is imposed by us, the observers, or by the selective history, but it doesn't inhere in the molecule. Sarkar makes this point beautifully. Once you subtract the ordinary molecular causation—the hydrogen bonding, the steric hindrance, the enzymatic catalysis—what is left? Zero. There is no residual "meaning" substance. If your semantic theory adds nothing to the causal explanation, it's epiphenomenal.

  **Elena:** It adds explanatory power regarding *specificity*. This brings us to Shannon. You're happy to grant DNA Shannon information—correlation, surprise value, transmission fidelity. I am too. But Shannon information is syntax without semantics. It tells you how much data is sent, not what it is *about*. DNA is about the protein sequence. The cell *interprets* the DNA. The ribosome is a reading head, not just a reaction vessel. If you treat it purely causally, you lose the distinction between the *instruction* and the *execution*.

  **Marcus:** But the cell doesn't "interpret" anything. The ribosome is a ribozyme. It catalyzes peptide bond formation based on spatial alignment provided by the tRNA. "Interpretation" is a metaphor you're reifying. You say DNA is *about* the protein. I say DNA is a *cause* of the protein, mediated by a complex cellular environment. Why privilege the DNA as the "message" rather than the "sender"?

  **Elena:** Because of the Parity Thesis. I know you're saving that for the kill shot, so let's bring it out.

  **Marcus:** *[Smiles]* I was wondering when we'd get to Oyama. Look, Elena, if your criterion for being an "information bearer" is reliable correlation with phenotypic outcomes across generations, then DNA is not unique. The spindle apparatus, the methylation patterns, the maternal cytoplasm, even the stable features of the environment—all of these are necessary for the phenotype to recur. If DNA is a code because it correlates with the outcome, then the cytoplasm is also a code. But biologists don't speak of a "cytoplasmic code." Why? Because it's tradition. It's gene-centrism. If you accept the Parity Thesis, DNA is just one resource among many. Singling it out as *the* information carrier is arbitrary.

  **Elena:** This is the strongest objection, I concede. But the Code Biologist has a response, and it distinguishes us from the Developmental Systems theorists. We agree that development is a system of interacting resources. We disagree on the *functional role* of those resources. DNA is the *template*; the cytoplasm is the *machinery*. In any communication system, you distinguish the signal from the channel. The cytoplasm provides the context, the enzymes, the energy—the channel. But the DNA provides the variable specificity. If you swap the cytoplasm but keep the DNA, you get a different organism (cloning). If you swap the DNA but keep the cytoplasm, you get a different organism (transgenics). If you swap the cytoplasm *and* the DNA, you get... well, chaos. But the specificity, the *identity* of the protein, is determined by the sequence, not the cytoplasmic viscosity.

  **Marcus:** But the "meaning" of the sequence is determined by the synthetases in the cytoplasm! Remember your own argument about arbitrariness? The codon UUU means phenylalanine *only because* the specific synthetase in that cell links them. If you change the synthetase, the "message" changes even if the DNA stays the same. So the information isn't in the DNA; it's in the relationship between the DNA and the translational machinery. To say DNA carries the information independently is like saying a book carries the story independently of a reader who knows the language. Without the reader (the cell), the book is just paper.

  **Elena:** A book is still a book even if no one reads it, Marcus. It possesses semantic potential. The DNA possesses the code because the translational machinery is *conserved*. The machinery is part of the system that *decodes*. But we don't say the decoder is the message. The reason we privilege DNA is that it is the *stored* information. It is the only component that is replicated *qua* sequence. The cell rebuilds the machinery every generation; it copies the DNA. That copying fidelity of the sequence is what makes it the archival code.

  **Marcus:** "Archival" I can accept. "Semantic" I cannot. You're arguing that because the system is evolved to be sensitive to the sequence, it counts as semantics. I'm arguing that sensitivity is just causal specificity. Here is where I think our disagreement actually lies, Elena. You think "interpretation" names a distinct biological process. I think "interpretation" is just a label we slap on a specific kind of causal filtering.

  **Elena:** Is it just a label? If it were just a label, we couldn't distinguish between a causal trigger and a genetic instruction. A UV photon causes a mutation. It is a causal trigger. It is not an instruction. The DNA sequence *is* an instruction. The difference is that the system is organized to respond to the sequence *as a rule*.

  **Marcus:** But who says the system is organized to respond to it *as a rule*? Only us. The molecule doesn't know it's a rule.

  **Elena:** The molecule doesn't need to know. The *system* treats it as a rule. That's the point of Maynard Smith's selection argument. The history of selection has shaped the cell to treat the DNA sequence as a normative guide. That normative relation is real, even if the molecules are blind.

  **Marcus:** *[Pauses, stirring coffee]* Okay. Let's isolate this. You are claiming that the historical fact of selection creates a normative status—a "should"—that attaches to the DNA sequence, which elevates it from mere cause to semantic carrier. I am claiming that "normativity" is a story we tell about the stability of the causal chain.

  **Elena:** Precisely.

  **Marcus:** Then here is my concession: I will grant you that the "code" talk is indispensable for *heuristic* purposes. Biologists cannot do their work without treating DNA as a text. It organizes their interventions. If I tell a geneticist, "The cytoplasm causes the protein," they can't intervene. If I say, "The DNA encodes the protein," they can sequence and edit. So, pragmatically, you win.

  **Elena:** And I will grant you this: If by "literal" you mean "immaterial," then I lose. The code is physically instantiated. There is no ghost in the machine. But if "literal" means "a functional relationship of conventional mapping stabilized by selection," then the code is as real as the economy or the law. It's a higher-order physical fact.

  **Marcus:** But that's the rub, isn't it? You think that higher-order fact is ontological. I think it's methodological. You believe the cell is a semiotic system. I believe the cell is a chemical system that we *find it useful to describe* as semiotic.

  **Elena:** Then we have found the fault line. It's not about the biochemistry. We agree on the chemistry. It's about whether "function" and "selection" introduce a genuine category change in the ontology of the system.

  **Marcus:** I suppose I can live with that. As long as you don't ask me to believe the ribosome *reads*.

  **Elena:** And as long as you don't ask me to believe that "causation" exhausts the explanation of life. Arthur, the biologist, was right to pause. The question isn't whether the code exists. It's whether we have the philosophy to account for it without reducing it to nothing, or inflating it to magic.

  **Marcus:** *[Raises cup]* To the frozen accident, then.

  **Elena:** *[Clinks cup]* And the machinery that makes it mean something.
