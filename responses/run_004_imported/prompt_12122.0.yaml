answer: |-
  **1:03 AM. The kitchen is lit only by the open refrigerator door and the standby light on the microwave. The hum of the compressor is the only sound until the clink of a fork against ceramic.**

  **Leo** is standing at the counter. He is holding a fork with a significant portion of dark chocolate cake on it. **Mara** leans against the doorframe, arms crossed, watching him.

  **Mara:** You promised. At breakfast. Specifically, using the words "I promise."

  **Leo:** (He doesn't look up from the cake.) I know.

  **Mara:** So this is it? This is the weakness of will we're supposed to be teaching on Thursday?

  **Leo:** It's not weakness, Mara. It's time inconsistency. Breakfast-Leo and Midnight-Leo are operating on different discount curves. Breakfast-Leo valued health outcomes at $t+24$ hours highly. Midnight-Leo is tired, glucose is low, and the discount rate for immediate reward has spiked.

  **Mara:** So Breakfast-Leo was a liar?

  **Leo:** No. He was accurate *for his timeframe*. He wasn't lying; he was just temporally distant. You're treating "Leo" as a single, unified agent persisting through time. The literature suggests that's a fiction. I'm a sequence of selves. Midnight-Leo isn't betraying Breakfast-Leo. He's just optimizing for Midnight.

  **Mara:** (She walks over and leans on the counter opposite him.) That's the dissolutionist move. You're saying the puzzle of *akrasia* vanishes because there's no contradiction. If the preferences change, acting on the new preference isn't irrational. It's just… updating.

  **Leo:** Exactly. Socrates thought akrasia was impossible because he assumed knowledge was stable. Aristotle tried to save the phenomenon by saying the knowledge was "clouded." But Ainslie and Laibson show the preference structure *itself* shifts. There's no clouding. The valuation literally changes. So, strictly speaking, I'm not acting against my judgment. My judgment *is* this fork moving toward my mouth.

  **Mara:** But whose judgment counts? That's the hole in your bucket, Leo. You say "Midnight-Leo's valuation literally changes." Fine. But why does Midnight-Leo get to be the authoritative voice of "Leo"?

  **Leo:** Because he's the one with his hand on the fork.

  **Mara:** That's might makes right. That's not rationality; that's physics. If I hold a gun to your head and make you eat the cake, your hand moves toward your mouth. Does that mean you *judged* it best to eat the cake?

  **Leo:** (He lowers the fork slightly.) Don't be dramatic. This isn't coercion. It's endogenous preference change.

  **Mara:** Is it? Or is it just that the impulse got louder? Look, if you accept the hyperbolic model, you've explained the *mechanism* of the failure. You haven't explained away the *irrationality*. You've just moved it. Now the irrationality isn't in the action; it's in the structure of the preferences themselves. We call it "dynamic inconsistency" for a reason. It's a failure of coherence across time.

  **Leo:** But coherence requires a single validator. If there is no single self, there's no one to be incoherent. It's like saying a river is "inconsistent" because it flows faster in the rapids than in the delta.

  **Mara:** (She taps the counter.) But the river doesn't make promises. *You* did. The whole point of the breakfast promise was to bind Midnight-Leo. If Midnight-Leo is a different agent, the promise is void. But you don't feel it's void. You feel guilty. That guilt is the phenomenological residue of the unity you're trying to deny.

  **Leo:** Guilt is just an anticipated negative utility from social conditioning.

  **Mara:** (She smiles, tiredly.) You're tired, Leo. You're reaching for the easy ontology because it lets you off the hook. If Midnight-Leo is a stranger, you don't have to hold him accountable. But here's the pushback you're avoiding: Why privilege the *now*?

  **Leo:** I'm not privileging it normatively. I'm acknowledging it causally.

  **Mara:** In decision theory, causality *is* privilege. By saying "the current discount curve determines the rational action," you're saying the current self is the only one that matters. But if Breakfast-Leo's preference was more considered, more reflective, less subject to visceral noise… why does the noisy signal override the clean one?

  **Leo:** Because the noisy signal is the one connected to the motor cortex *now*. Look, turn it around. You're the traditionalist. You want to say I'm acting against my "better judgment." Okay. Peel back the layers. What is that judgment made of?

  **Mara:** It's a normative assessment.

  **Leo:** It's neural firing rates. It's a discount function with a longer horizon. If "better judgment" is just the output of a long-term discounting module, and "craving" is the output of a short-term discounting module… why is one "True Will" and the other "Weakness"? They're both just math happening in the dark. If the short-term module wins, why isn't that just the "real" me showing up?

  **Mara:** Because the long-term module claims authority over the short-term one. That's what judgment *is*. It's the system that coordinates across time.

  **Leo:** Claims authority? To whom? To the short-term module? The short-term module doesn't care. It's like a parliament where the radical faction stages a coup. You can call it a coup, or you can call it a democratic shift based on current constituents. The hyperbolic model says it's the latter.

  **Mara:** But if you accept that, you lose the "ought." If Midnight-Leo is rational to eat the cake because his curve says so, then he *ought* to eat the cake.

  **Leo:** Relative to his preferences, yes.

  **Mara:** But *you* don't want to live in a world where you ought to eat the cake. You want to be the kind of person who doesn't. That "want" spans across the breakfast-midnight gap. If you dissolve the self into a sequence of snapshots, you dissolve the possibility of integrity. Integrity *is* the constraint of the snapshot by the narrative.

  **Leo:** (He stares at the cake. The frosting is glistening under the fridge light.) So you're saying the "puzzle" of akrasia isn't a bug to be solved by economics. It's a feature of being a unified agent.

  **Mara:** I'm saying the economics describes the crash, but it doesn't explain why we care that the car went off the road. If I'm just a series of selves, I can't be irresponsible. I can just be… different.

  **Leo:** And if I'm a unified agent, I'm a broken one.

  **Mara:** Yes. But a broken unified agent is still an agent. A series of rational snapshots is just a movie reel.

  **Leo:** (He sighs. He looks at the fork, then at Mara.) So if I eat this, I'm vindicating the model but condemning the man.

  **Mara:** If you eat this, you're feeding the snapshot and starving the narrative.

  **Leo:** And if I put it back?

  **Mara:** Then you're admitting that the "Breakfast Judgment" has a normative claim on "Midnight Action" that transcends the local discount rate. You're admitting that *akrasia* is real, and that you're currently committing it by even holding the fork.

  **Leo:** (He looks down at the cake. He seems to realize that the theory doesn't actually move the muscle.) The problem is, the discount curve doesn't care about your narrative.

  **Mara:** No. That's why it's a struggle. If it were just math, it would be easy.

  **Leo:** (He puts the fork down on the plate. The clink is loud in the quiet kitchen.) I hate this.

  **Mara:** I know.

  **Leo:** It feels like I'm letting Breakfast-Leo down.

  **Mara:** Good. That's the unity talking.

  **Leo:** (He closes the fridge door. The kitchen plunges into near-darkness, save for the microwave clock.) So we teach it as a conflict? Not a dissolution?

  **Mara:** We teach it as a conflict between a model that says the self is fragmented, and an experience that says the self is responsible. The gap between those two is where the seminar happens.

  **Leo:** (He rubs his face.) I'm still hungry.

  **Mara:** Then drink some water. Breakfast-Leo would want you to.

  **Leo:** (A dry chuckle.) Don't start with the normative claims.

  **Mara:** Too late. You're already listening to him.

  **[Silence. Leo fills a glass from the tap. The water runs clear. He drinks it standing up, in the dark.]**
