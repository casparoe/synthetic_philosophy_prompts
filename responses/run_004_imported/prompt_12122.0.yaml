      *   **Format:** A dialogue between two characters.
      *   **Setting:** 1 AM in a kitchen. One character is holding a slice of cake they promised not to eat.
      *   **Characters:**
          *   *Dissolutionist:* Believes hyperbolic discounting shows akrasia is an artifact of bad folk psychology. There is no single agent acting against judgment; just different temporal selves with coherent preferences.
          *   *Traditionalist:* Believes this is a sleight of hand. It changes the subject. Real weakness of will involves a single agent judging $X$ better but doing $Y$.
      *   **Requirements:** Real back-and-forth. No strawmanning. Push the Dissolutionist on why the momentary self is privileged. Push the Traditionalist on what "judgment" means if it's produced by a discount function.
