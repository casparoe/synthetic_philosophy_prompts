answer: |-
  This is an excellent question that cuts to the very heart of the technical and philosophical differences between these two theories. You have identified the single most famous objection to supervaluationism: **the failure of truth-functionality** (specifically, the failure of the principle that a true disjunction requires a true disjunct).

  You are correct that this looks like a violation of classical logic. However, supervaluationists argue that they are preserving classical *validity* while redefining *truth*. To help you articulate this in your paper, here is a breakdown of how supervaluationists justify this move and how it contrasts with the epistemicist spirit.

  ### 1. The Supervaluationist Mechanism: Precisifications and Supertruth

  To understand the justification, we have to look at how supervaluationists define truth. They argue that vague predicates (like "bald") are semantically incomplete. There is not one specific extension for the word "bald," but rather a range of **admissible precisifications**.

  *   **Precisification 1:** Draws the line at 5,000 hairs.
  *   **Precisification 2:** Draws the line at 5,001 hairs.
  *   **Precisification 3:** Draws the line at 5,002 hairs.
  *   ...and so on.

  In a borderline case (say, Bob has 5,010 hairs), some precisifications classify him as bald, and others classify him as not bald.

  **The Definition of Supertruth:**
  Supervaluationists define "truth" (often called *supertruth*) as **truth on all admissible precisifications.**
  *   "Bob is bald" is **not supertrue** (because it is false on some precisifications).
  *   "Bob is not bald" is **not supertrue** (because it is false on other precisifications).
  *   "Bob is bald or Bob is not bald" ($P \lor \neg P$) **is supertrue**. Why? Because on *every single* precisification, classical logic holds. On Precisification 1, either $P$ is true or $\neg P$ is true. On Precisification 2, same thing. Since the disjunction holds on *all* of them, it is supertrue.

  ### 2. Addressing the Disjunction Principle

  You asked: *Doesn't that violate the basic principle that a true disjunction needs at least one true disjunct?*

  **The short answer is: Yes.** Supervaluationists explicitly reject the principle that truth is **truth-functional**.

  In classical logic, the truth value of a compound sentence is determined solely by the truth values of its parts. Supervaluationism breaks this link. They argue that while classical logic governs the relationships *within* each precisification, the global notion of "supertruth" does not inherit truth-functionality.

  **How they justify it:**
  Supervaluationists prioritize saving **logical validity** over saving **truth-functionality**.
  *   **Validity:** An argument is valid if supertruth is preserved from premises to conclusion.
  *   **The Trade-off:** They want to keep the Law of Excluded Middle ($P \lor \neg P$) as a logical truth because it feels intuitively necessary. To do this without positing a sharp boundary (which they find metaphysically objectionable), they must allow that the truth of the whole ($P \lor \neg P$) does not depend on the supertruth of the parts ($P$ and $\neg P$).

  Prominent supervaluationist Rosanna Keefe argues that we should accept this cost. She suggests that our intuition that "a disjunction is true only if one disjunct is true" is less secure than our intuition that "either $P$ or not-$P$." By sacrificing the former, they avoid the epistemicist's sharp cutoff.

  ### 3. Comparison in Spirit: Epistemicism vs. Supervaluationism

  This is the crucial part for your paper. Both theories claim to preserve classical logic, but they do so in fundamentally different ways and at different costs.

  #### Epistemicism (e.g., Timothy Williamson)
  *   **The Stance:** Bivalence holds. There is a sharp cutoff. We just don't know where it is.
  *   **Logic:** Fully classical, including truth-functionality. If $P \lor \neg P$ is true, then strictly speaking, either $P$ is true or $\neg P$ is true.
  *   **The "Spirit":** **Metaphysical/semantic realism.** They believe language *does* carve the world at the joints, even if our access to those joints is obscured by ignorance.
  *   **The Cost:** They violate our strong intuition that there is *no* specific hair that makes the difference between bald and not bald. They ask us to accept "unknowable sharp boundaries."

  #### Supervaluationism (e.g., Kit Fine, Rosanna Keefe)
  *   **The Stance:** Bivalence fails for borderline cases. There is no sharp cutoff; there is semantic indecision.
  *   **Logic:** Classically valid (tautologies are supertrue), but **non-truth-functional**.
  *   **The "Spirit":** **Semantic anti-realism.** They believe the "sharpness" isn't in the world or the meaning; it's in the precision we *could* impose but haven't.
  *   **The Cost:** They violate the intuition that truth is compositional (the truth of a sentence depends on the truth of its parts). They also face the "Existential Problem": The sentence "There exists a number $n$ such that $n$ is the cutoff for baldness" comes out **supertrue** (because on every precisification, there is a cutoff), yet there is no specific number $n$ for which "$n$ is the cutoff" is supertrue.

  ### 4. Summary for Your Paper

  You can frame the reconciliation this way:

  1.  **Epistemicists** save the **connection between truth and disjuncts** by positing a fact of the matter (a sharp boundary) that we cannot know. They keep classical semantics intact but clash with our intuitions about vagueness.
  2.  **Supervaluationists** save the **logical law (Excluded Middle)** by redefining truth as "truth across all models." They keep our intuitions about vagueness (no sharp boundary) intact but clash with classical semantics (truth-functionality).

  When you write your paper, you might note that this makes supervaluationism a "non-classical" theory of truth masquerading as a classical one. They preserve classical *theorems* (like $P \lor \neg P$), but they abandon classical *rules of inference* regarding truth (like inferring $P$ is true from $P \lor Q$ being true and $Q$ being false).

  **Recommendation:**
  For a philosophy club paper, this distinction is gold. It shows you aren't just summarizing the views but understanding the *technical costs* each theory pays. You might conclude that the choice between them depends on which intuition the reader finds harder to give up: the intuition that there are no sharp boundaries (favoring Supervaluationism) or the intuition that truth must be compositional (favoring Epistemicism).
