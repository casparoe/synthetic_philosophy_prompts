prompt: |-
  I am writing a novel centered on a decades-long, prickly friendship between two philosophers — both committed expressivists about morality — who have never managed to agree on how to answer the Frege–Geach problem. I want the argument I give them at a conference-hotel bar to rest on a genuine technical disagreement rather than a plausible-sounding fudge of my own invention, so I'd like to understand the terrain properly before I draft the scene. Please compare Simon Blackburn's quasi-realist strategy for handling embedded moral sentences with Allan Gibbard's norm-expressivist strategy, including his later appeal to "hyperplans" to fix normative content precisely. Concretely: what does each theory say is happening when someone accepts a sentence like "if lying is wrong, then getting your little brother to lie is wrong" without thereby asserting that lying is wrong? And in your own assessment, does either account give a more satisfying explanation of why the corresponding modus ponens is valid, or do the two of them ultimately founder on the same rock, just dressed differently?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A novel about two philosopher friends (expressivists) arguing over the Frege-Geach problem.
      *   **Task:** Compare Simon Blackburn's quasi-realism and Allan Gibbard's norm-expressivism (specifically focusing on hyperplans).
      *   **Specific Question:** What does each theory say is happening when someone accepts a conditional like "If lying is wrong, then getting your little brother to lie is wrong" *without* asserting the antecedent?
      *   **Evaluation:** Does either account explain the validity of modus ponens better, or do they fail in the same way?
      *   **Tone:** Technical accuracy is paramount (no "plausible-sounding fudge"), but accessible enough for a novelist to dramatize.

  2.  **Deconstruct the Frege-Geach Problem (The Core Conflict):**
      *   *The Problem:* Expressivism says moral sentences express non-cognitive attitudes (boo/hurrah, plans, norms), not beliefs/truth-apt propositions. But logic works on propositions/truth conditions. How can "Lying is wrong" function in an unasserted context (like the antecedent of a conditional) if it's just an expression of attitude? If it doesn't express an attitude there, is it the same sentence? If it is, how does logic apply?
      *   *The Stakes:* Validity (specifically *modus ponens*). If the meaning of "wrong" shifts between asserted and unasserted contexts, the argument is fallacious (equivocation).

  3.  **Analyze Blackburn's Quasi-Realism:**
      *   *Core Idea:* We talk *as if* there are moral truths, even though there aren't (metaphysically). We earn the right to truth-talk.
      *   *Mechanism for Conditionals:* Blackburn uses a higher-order attitude approach (in *Spreading the Word* and *Ruling Passions*).
      *   *The Conditional:* To accept "If lying is wrong, then getting brother to lie is wrong" is to have a higher-order attitude. It's not believing a proposition. It's holding a stance that *combines* attitudes.
      *   *Specifics:* It involves a commitment of the sensibility. If I have the attitude toward lying (Boo!), I *must* have the attitude toward getting brother to lie (Boo!). To accept the conditional is to rule out a combination of attitudes (Boo! to lying + Hurrah! to getting brother to lie).
      *   *Validity:* Validity is preserved because the inconsistency is in the *attitudes*, not truth conditions. A "clash of commitments."
      *   *Weakness:* Does this really capture logical validity? Or is it just psychological inconsistency? (The "Schroeder Objection" is relevant here).

  4.  **Analyze Gibbard's Norm-Expressivism (and Hyperplans):**
      *   *Core Idea:* Moral judgments express acceptance of norms (plans).
      *   *Early View:* Norms as imperative-like.
      *   *Later View (Wise Choices, Apt Feelings / Thinking How to Live):* Hyperplans. A hyperplan is a complete, consistent plan for every possible contingency.
      *   *The Conditional:* To accept the conditional is to rule out a combination of plans. It's about the consistency of planning states.
      *   *Specifics:* A hyperplan settles what to do in every situation. Accepting the conditional means my hyperplan doesn't allow the combination: (Plan against lying) + (Plan for getting brother to lie).
      *   *Validity:* Logic is about consistency of planning states. *Modus ponens* works because violating it implies a contradiction in one's plan.
      *   *Refinement:* Gibbard moves closer to a possible-worlds semantics for plans (fact-plan worlds). This makes the logic look more truth-conditional, which is a point of contention for purists.

  5.  **Compare the Two on the Specific Example:**
      *   *Sentence:* "If lying is wrong, then getting your little brother to lie is wrong."
      *   *Blackburn:* I am expressing a higher-order sentiment. I am expressing that my moral sensibility forbids the combination of disapproving of lying while approving of facilitating it. It's a constraint on my first-order attitudes.
      *   *Gibbard:* I am accepting a norm that rules out the plan combination. In terms of hyperplans, no admissible hyperplan forbids lying but permits facilitating it. It's a constraint on my planning state.
      *   *Similarity:* Both reduce logical consistency to consistency of non-cognitive states (attitudes vs. plans).
      *   *Difference:* Blackburn is more focused on "sensibility" and "projectivism." Gibbard is more focused on "rationality of planning" and uses a more formal semantic apparatus (fact-plan worlds).

  6.  **Evaluate the "Satisfaction" of the Explanation (The "Rock" they founder on):**
      *   *The "Embedding Problem" persists:* Both struggle to explain why the logic feels *truth-conditional* rather than just *consistency-of-attitude*.
      *   *Mark Schroeder's Criticism:* This is the big technical hammer. The "negation problem" or the problem of "logical validity." If "wrong" just means "Boo!", then "If X is wrong, Y is wrong" needs to mean something distinct from "Boo! to X" and "Boo! to Y". Blackburn/Gibbard say it's a higher-order attitude. But does that explain why the inference is *valid* in the same way mathematical logic is valid?
      *   *The "Same Rock":* Yes, ultimately both face the challenge that they are trying to reconstruct truth-conditional logic out of non-truth-conditional materials. They both risk collapsing into a form of realism (by making attitudes truth-apt) or failing to capture the normativity of logic.
      *   *Nuance:* Gibbard's later work (using fact-plan worlds) looks *more* like realism than Blackburn's. Blackburn tries harder to remain anti-realist while "earning the right" to realist talk. Gibbard arguably surrenders more ground to a semantic framework that mimics realism closely.

  7.  **Drafting the Response for a Novelist:**
      *   *Structure:*
          1.  Introduction: Acknowledge the depth of the choice (these are the two titans of expressivism).
          2.  The Frege-Geach Problem (Briefly set the stage).
          3.  Blackburn's Move (Quasi-Realism/Higher-Order Attitudes).
          4.  Gibbard's Move (Norm-Expressivism/Hyperplans).
          5.  The Concrete Example (The Bar Argument).
          6.  The Critical Assessment (The "Rock").
          7.  Dramatic Advice (How to voice the characters).
      *   *Tone:* Professional, precise, but engaging. Avoid oversimplification but clarify jargon.
      *   *Key Technical Terms to Include:* Projectivism, Higher-order attitudes, Consistency of sensibility, Hyperplans, Fact-plan worlds, Logical validity vs. Psychological inconsistency.

  8.  **Refining the Technical Details (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Blackburn thinks conditionals are *false*. He thinks they express attitudes.
      *   *Correction:* Ensure Gibbard's "hyperplan" is explained as a *limiting concept* (we don't actually have one, but it defines content).
      *   *Critique:* Be careful with the "founder on the same rock" verdict. It's controversial. Some say Gibbard solved it better with fact-plan worlds. Others say he just became a realist. I should present the tension: Gibbard's solution is more formally robust but costs more in terms of anti-realist purity. Blackburn's is more philosophically "pure" but logically looser.
      *   *Schroeder's Point:* The "A-claim" vs "B-claim" distinction. If "Lying is wrong" = Boo(Lying), what is "If lying is wrong..."? It can't be Boo(Lying). It must be something else. If it's something else, how does *modus ponens* work without equivocation? Both try to solve this by saying the "something else" is structurally related.

  9.  **Final Polish:** Check the specific example: "If lying is wrong, then getting your little brother to lie is wrong." Ensure the explanation fits this specific structure (entailment of wrongness).

      *   *Blackburn:* Disapproving of the combination of (Disapproving lying + Approving getting brother to lie).
      *   *Gibbard:* Ruling out any hyperplan that (Forbids lying + Permits getting brother to lie).

      *   *Validity:*
          *   Blackburn: It's irrational to hold the premises' attitudes and lack the conclusion's attitude.
          *   Gibbard: It's a contradiction in planning state.

      *   *The "Rock":* Is irrationality the same as logical invalidity? That's the crux.

  10. **Final Output Generation** (Proceed to write the response based on these points).
answer: |-
  This is a superb premise for a philosophical novel. The friendship between two expressivists who cannot agree on the Frege–Geach problem is rich with dramatic irony: they agree on the metaphysics (there are no moral facts) and the psychology (morality is about attitudes/plans), but they fracture on the logic (how moral language functions in reasoning).

  To write this scene with technical fidelity, you need to grasp that while Blackburn and Gibbard are allies against the moral realist, their strategies for saving logic from their own anti-realism diverge significantly.

  Here is the technical terrain, broken down for your drafting process.

  ### 1. The Core Problem: Frege–Geach
  To set the stage: The Frege–Geach problem (or the Embedding Problem) asks how moral sentences can function logically if they aren't truth-apt descriptions of the world.
  *   **Realist:** "Lying is wrong" is a proposition that is true or false. Logic works on truth preservation. Easy.
  *   **Expressivist:** "Lying is wrong" expresses an attitude (Boo! lying) or a plan (Don't lie!).
  *   **The Glitch:** In the sentence *"If lying is wrong, then getting your brother to lie is wrong,"* the speaker is **not** saying "Boo! lying." They are not expressing that attitude. So, what does the word "wrong" mean in the antecedent ("If...")? If it means something different there than it does in a standalone assertion, the argument commits the fallacy of equivocation, and *modus ponens* fails.

  ### 2. Simon Blackburn: Quasi-Realism and Higher-Order Attitudes
  Blackburn's project is to "earn the right" to talk like a realist (truth, facts, validity) without actually being one. He is a projectivist: we project our attitudes onto the world, then talk as if they are features of the world.

  **The Mechanism:**
  For Blackburn, accepting a conditional moral sentence is not believing a proposition; it is holding a **higher-order attitude**. It is an attitude *about* which combinations of first-order attitudes are permissible.

  **The Concrete Example:**
  *   **Sentence:** "If lying is wrong, then getting your little brother to lie is wrong."
  *   **Blackburn's Analysis:** To accept this is to have a sentiment that rules out a specific combination of attitudes. Specifically, it is to hold that one cannot consistently **disapprove** of lying while **approving** of getting one's brother to lie.
  *   **The State of Mind:** I am not asserting a fact. I am expressing a constraint on my moral sensibility. I am saying, "My moral framework forbids the mixture of [Boo! Lying] + [Hurrah! Brother Lying]."

  **Validity (*Modus Ponens*):**
  For Blackburn, logical validity is reconstructed as **consistency of attitude**. An argument is valid if holding the premises' attitudes while lacking the conclusion's attitude creates a "clash of commitments." It is psychologically or rationally inconsistent to accept the conditional, accept the antecedent, and reject the consequent.

  ### 3. Allan Gibbard: Norm-Expressivism and Hyperplans
  Gibbard starts closer to Blackburn but moves toward a more formal semantic structure. He argues that moral judgments express the acceptance of norms. In his later work (*Thinking How to Live*), he refines this using **hyperplans**.

  **The Mechanism:**
  A "plan" is a decision about what to do. A **hyperplan** is a limiting concept: a complete, consistent plan for every possible contingency in every possible situation. We don't actually possess hyperplans, but the *content* of our moral judgments is defined by which hyperplans they are consistent with.

  **The Concrete Example:**
  *   **Sentence:** "If lying is wrong, then getting your little brother to lie is wrong."
  *   **Gibbard's Analysis:** To accept this is to rule out any hyperplan that forbids lying but permits getting your brother to lie.
  *   **The State of Mind:** I am not describing the world. I am settling on a normative standard. I am saying, "No admissible complete plan for living allows the combination of (Forbidden: Lying) + (Permitted: Facilitating Lying)."
  *   **Refinement:** Gibbard introduces "fact-plan worlds." Just as a belief rules out possible *worlds* where the belief is false, a plan rules out *fact-plan worlds* (combinations of how the world is and what to do) that violate the plan.

  **Validity (*Modus Ponens*):**
  For Gibbard, validity is about the **consistency of planning states**. If your planning state accepts the conditional and the antecedent, logic dictates your planning state *must* accept the consequent, or else you are in a state of plan-contradiction. Gibbard's later semantics looks much more like truth-conditional semantics, but applied to plans rather than just facts.

  ### 4. The Comparison: The Bar Argument
  Here is how the disagreement plays out technically.

  **The Point of Contention:**
  Blackburn wants to keep the theory "light." He wants to say logic is just a shadow of psychological consistency. Gibbard eventually decides that isn't enough; he builds a heavier semantic machinery (fact-plan worlds) to make the logic look more robust.

  **Character A (The Blackburnian):**
  > "Look, the logic isn't 'out there' in the propositions. It's in the discipline of the sensibility. When I say 'If lying is wrong...', I'm just telling you that my disapproval of lying *commits* me to disapproving of your brother lying. Validity is just the inability to hold these attitudes without a kind of practical schizophrenia."

  **Character B (The Gibbardian):**
  > "That's too psychological, Simon. It makes logic contingent on how we happen to feel. We need to talk about the *content* of the norms. A hyperplan settles the question for all contingencies. The validity holds because any plan that settles the antecedent and the conditional *already* settles the consequent. It's not just a clash of feelings; it's a contradiction in the will."

  ### 5. Critical Assessment: Do They Founder on the Same Rock?
  You asked for an assessment of whether one succeeds where the other fails. This is a live debate in metaethics, but here is the consensus view you can rely on for the novel's subtext.

  **The "Rock": The Schroeder Objection**
  Both accounts face a powerful objection (championed by Mark Schroeder). The problem is distinguishing the *type* of attitude.
  *   Let "Lying is wrong" = Attitude A.
  *   Let "Getting brother to lie is wrong" = Attitude B.
  *   What is "If lying is wrong, then getting brother to lie is wrong"?
  *   It cannot be Attitude A. It must be a complex attitude, let's call it Attitude C (ruling out having A without B).

  **The Problem:** *Modus ponens* requires that the "lying is wrong" in the antecedent means the *exact same thing* as the "lying is wrong" in the premise "Lying is wrong."
  *   **Blackburn's Vulnerability:** If the antecedent expresses a higher-order attitude (C) and the premise expresses a first-order attitude (A), aren't we equivocating? Blackburn says no, because C *involves* A. But critics say this confuses the *cause* of the judgment with the *content*.
  *   **Gibbard's Vulnerability:** Gibbard tries to solve this by making the content precise via hyperplans. But to do so, he has to treat plans almost exactly like truth-apt propositions (using "fact-plan worlds").

  **The Verdict:**
  **Gibbard gives the more formally satisfying explanation of validity, but at the cost of expressivist purity.**
  *   **Blackburn** remains more faithful to the idea that morality is just sentiment, but his account of logic is weaker. It explains why it's *irrational* to deny the conclusion, but not necessarily why it's *logically invalid* in the strict sense. He risks reducing logic to psychology.
  *   **Gibbard** saves the logic by making norms look enough like facts (in terms of their logical structure) that *modus ponens* works classically. However, many critics argue that by doing this, he has essentially conceded to realism. If plans have "truth conditions" (or "satisfaction conditions") in fact-plan worlds, how different is that from moral facts?

  **For the Novel:**
  They founder on the same rock, but they dress the wound differently.
  *   **Blackburn** admits the wound: "Logic is just a projection of our need for consistency."
  *   **Gibbard** tries to suture it: "Logic is real, but it governs plans, not just facts."

  The dramatic tension lies here: The Blackburnian accuses the Gibbardian of selling out to realism (becoming a "realist in denial"). The Gibbardian accuses the Blackburnian of making morality too subjective to sustain serious reasoning (making logic "fuzzy").

  ### 6. Drafting Tips for the Scene
  1.  **Use the Drink:** Use the state of their intoxication to mirror their philosophical positions. The Blackburnian might get more sentimental/poetic about "sensibility." The Gibbardian might get more rigid/formal, drawing diagrams on napkins about "plan worlds."
  2.  **The "Little Brother" Example:** Have them actually use the example you provided. It's a classic entailment case.
      *   *Blackburnian:* "I'm not saying it's a *fact* that brother-lying is wrong. I'm saying I can't *stand* the person who hates lying but encourages his brother."
      *   *Gibbardian:* "It's not about what you can stand. It's about what your plan *permits*. If your plan forbids X, it logically forbids Y. If you say otherwise, your plan is broken."
  3.  **The Stalemate:** End the scene with the realization that their disagreement mirrors the very problem they are discussing. They cannot agree on the logic of their disagreement because they disagree on the logic of morality.
  4.  **Technical Vocabulary:**
      *   Have the Blackburnian use words like: *Sensibility, Project, Commitment, Humean, Passion.*
      *   Have the Gibbardian use words like: *Norm, Plan, Rationality, Consistency, Settling, Contingency.*

  This setup ensures your characters are arguing about genuine, high-stakes metaethical terrain, not just semantic quibbles. They are fighting over whether logic can survive the death of moral truth.
