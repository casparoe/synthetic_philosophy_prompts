  The coffee was lukewarm and tasted of cardboard, but Dana held the styrofoam cup like an anchor. She stood near the back of the reception hall, watching the mourners blur into a gray wash of black suits.

  "Still taking it black?" Marcus asked. He appeared at her elbow, holding a cup he hadn't touched.

  "Still," Dana said. She didn't turn immediately. When she did, the decade of silence hung between them, heavier than the grief in the room. "You look tired, Marcus."

  "Campaigning will do that. So will failing a test three times."

  Dana's expression didn't flicker. "You know the statistics weren't designed to exclude you personally."

  "Weren't they?" Marcus leaned against the wall, crossing his arms. "Arthur believed in this project. He thought you were saving the republic."

  "Arthur understood that uninformed voting is just noise. Or worse," Dana said, her voice low, precise. "It's harm. Look at the data, Marcus. Most people are Hobbits. They don't care about policy, they don't know the basics of economics, and they stay home. Then you have the Hooligans. They care too much, but only about winning. They treat politics like sports, tribal score-keeping rather than governance."

  "And the Vulcans?" Marcus asked, a sharp edge entering his tone. "The dispassionate gods who get to decide for everyone? That's you?"

  "It's not about gods. It's about Mill's old proposal. Weighted votes. Competence isn't a moral virtue, it's a technical requirement. Would you let a random crowd perform surgery because everyone deserves an equal say in the incision? We're asking for basic literacy in civics and statistics. If you can't calibrate risk, you shouldn't be authorized to impose it on the rest of us."

  "Who calibrates the calibrators?" Marcus pushed off the wall. "That's the question you never answered in section three, Dana. Who writes the exam? Who grades it? You sit on the Board. Your colleagues write the questions. You define what 'competence' looks like."

  "The answers are empirical. Statistics don't care about your identity."

  "但 the selection of questions does," Marcus countered. "You think you're measuring reasoning, but you're laundering advantage. The kid from the private school with the debate team versus the kid working nights to support his mother. You've taken the old barriers of class and race and given them a flattering new name. Meritocracy is just aristocracy with a math problem."

  Dana sighed, finally setting the cup down on a passing tray. "And the alternative? Universal suffrage gave us demagogues. It gave us policy driven by outrage rather than evidence. We have lower corruption, higher stability, and better long-term planning since the Franchise. The outcome is objectively better."

  "Is it?" Marcus stepped closer, his voice dropping so only she could hear. "Because I'm looking at the people in this room. Half of them can't vote for the people burying their friend. You talk about harm reduction, but what about the harm of telling a citizen they don't own their own government? That their voice is worthless unless you stamp it?"

  "Democratic equality isn't a right to rule, Marcus. It's a mechanism for protection."

  "It's the only thing that says we're equals," Marcus said. "Even if I'm wrong about the tax code, even if I don't know the unemployment rate, I live here. I breathe this air. I'm owed a say not because I'm smart, but because I'm here. You've turned citizenship into a license."

  "And you've turned it into a participation trophy," Dana shot back, though her eyes were sad. "I loved your mind once. You used to care about results."

  "I still do. But not at the cost of dignity." Marcus looked at her, really looked at her, seeing the fatigue behind the rigor. "You built a machine that works, Dana. I'll give you that. But it doesn't belong to us anymore."

  "It belongs to the competent," she said softly.

  "It belongs to the people who passed the test," Marcus corrected. "There's a difference."

  They stood in the silence of the reception, the hum of conversation filling the space where their agreement used to be. Dana reached for her coffee again, but didn't drink. Marcus turned back toward the crowd, neither of them moving to bridge the gap.
