              *   PP Norm: If $p=0.5$, $Cr(10H)$ should be $0.5^{10}$ (non-zero).
              *   Result: $0 = \text{non-zero}$. Contradiction.
          *   *Key Insight:* It's not epistemic (hard to know). It's logical (the proposition "Chance is 0.5" contradicts the probability distribution it demands).
      *   **Part 2: The Fix (The New Principle):**
          *   The Shift: Don't condition on the *value* ($p=0.5$). Condition on the *theory* ($T$ says $p=0.5$).
          *   Why it works: $T$ is a mapping from histories to chances. $T$ says "If history is $H$, chance is 0.5." $T$ *also* assigns a probability to the history being $H+10H$.
          *   The "Magic": When we condition on $T$, we are asking "What does the world look like if $T$ is the true system?" $T$ admits that worlds where $T$ is *false* are possible *according to T's own probabilities*.
          *   Wait, I need to be careful here. If $T$ is true, the undermining future doesn't happen. But the *chance function defined by T* assigns it probability.
          *   Refined Explanation: PP treats "Chance is $x$" as a fact about the world that constrains the future. NP treats "Theory $T$ is true" as a hypothesis. Under hypothesis $T$, the chance of the undermining future is non-zero. The fact that the undermining future would make $T$ false is a *metaphysical* fact about HS, but the *probabilistic* calculus of $T$ ignores that metaphysical link. NP tells us to follow $T$'s calculus, not the metaphysical implications of $T$'s truth.
          *   Regress: Why not undermine $T$? Because NP doesn't tell us what $Cr(T)$ should be. It only tells us how to set $Cr(A)$ *given* $T$. We update $Cr(T)$ via Bayesian conditionalization on evidence, not via a chance principle. The "undermining" of $T$ just means $T$ gets falsified by evidence, which is normal science.
      *   **Part 3: Assessment:**
          *   Is it a solution? Yes, formally. It stops the explosion.
          *   Is it satisfying? Philosophically costly. It severs the tight link between Chance and Truth that Lewis wanted. Chance becomes "theory-relative."
          *   Admissibility relocation: Yes, effectively. Now we ask "Can I treat $T$ as admissible evidence?" Since $T$ entails the future, it's not admissible in the old sense. But NP says treat it *as if* it is.
          *   Mention Jennifer Ismael / Ned Hall as further context (without derailing).
      *   **Conclusion:** Encouragement for the dissertation.

  6.  **Refining the Intuition (Self-Correction during drafting):**
      *   *Correction on Part 1:* Make sure to emphasize that under HS, "Chance is 0.5" is a proposition about the *entire* history. So it logically entails "The future is not 10 Heads." That's why the credence should be 0.
      *   *Correction on Part 2:* The regress worry is subtle. If I condition on $T$, and $T$ is Humean, then $T$ entails the future. So $Cr(Future | T)$ should be 0 or 1. But $T$ assigns $0.5^{10}$. The NP tells us to ignore the entailment and follow the assignment. Why? Because the entailment is "quasi-logical" (supervenience), not "logical-logical." The NP privileges the probabilistic role over the metaphysical definition.
      *   *Wait, Lewis's specific move:* Lewis defines the New Principle as $Cr(A | T \& H) = Ch_T(A | H)$. He acknowledges that $T$ entails the future. But he argues that $T$ is "almost admissible." The key is that the contradiction disappears because we aren't asserting $Ch(A)=x$ as a standalone proposition that entails $\neg F$. We are asserting $T$, and $T$'s *own output* says $F$ is possible. We follow the output, not the metaphysical baggage of $T$'s truth conditions.
      *   *Actually, the cleanest way to put it:* PP fails because the proposition $Q$ ("Chance of H is 0.5") entails $\neg F$ ("Future is not 10 Heads"). So $Cr(F|Q)$ must be 0. But PP says $Cr(F|Q) = 0.5^{10}$.
      *   NP says: Condition on $T$ ("The Best System is L"). $T$ does *not* entail $\neg F$ directly in the same way. $T$ says "If the history is $H$, the law is L." Wait, if $T$ is the *true* theory, and $T$ is Humean, then the history *must* fit $T$.
      *   *Okay, the standard Lewisian resolution:* Lewis admits that under HS, $T$ *does* entail the future. So strictly speaking, $Cr(F|T)$ should be 0. The NP works because it redefines the chance function. The chance function $Ch_T$ is defined *ignoring* the fact that $T$ might be false. It treats the undermining future as a live possibility *within the calculus*. The NP tells us to align credence with the calculus ($Ch_T$), not with the metaphysical truth conditions of $T$. It's a pragmatic override.
      *   *Wait, I need to be precise.* Lewis (1994) argues that the contradiction vanishes because we no longer condition on the proposition $Ch(A)=x$. We condition on $T$. The proposition $Ch(A)=x$ is eliminated. The new principle is $Cr(A | T) = Ch_T(A)$. Does $T$ entail $\neg F$? Yes. So $Cr(F|T)$ should be 0. But $Ch_T(F)$ is $>0$. So the contradiction remains unless we deny that $T$ entails $\neg F$ *for the purposes of the principle*.
      *   *Actually, the consensus view (Hall/Thau):* The NP works because it treats $T$ as *informative about chances* but not as *exhaustive metaphysical truth* in the conditioning slot.
      *   *Let's stick to the most defensible intuitive reading:* The NP tells us to treat the chance theory $T$ as a "black box" that outputs probabilities. We ignore the fact that the box is made of glass (HS) and reveals the future. We pretend the box is opaque.
