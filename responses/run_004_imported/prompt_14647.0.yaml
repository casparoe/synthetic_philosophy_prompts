answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Aunt's Name]'s nephew/niece.

  When my aunt started this credit union thirty-nine years ago, the office smelled like sawdust and motor oil. It was in the back of our family's hardware store, sandwiched between a pallet of roofing nails and a dusty display of ceiling fans. If you came in for a loan, you could also pick up a hammer. I think that balance told you everything you needed to know about how she did business.

  For nearly four decades, whenever a competitor down the street launched a new "high-yield opportunity" or a "quick-cash special," someone would inevitably ask my aunt why we weren't doing the same. Why weren't we growing faster? Why weren't we maximizing the potential of our capital?

  And she would just wipe her glasses, look at them, and say, "Because money doesn't have babies."

  Now, I know half the people in this room are nodding, and the other half are waiting for the punchline. But that line was her whole philosophy.

  To our members and family here: What she meant was simple. Money is a tool. It's like a hammer. You use a hammer to build a house, or fix a porch, or help a neighbor. You don't put a hammer in a drawer and expect it to come out next year with a baby hammer. That's just not what hammers do. And it's not what money does, either. Money is supposed to measure what we need and help us get it. It isn't supposed to be the thing we're farming.

  To the regulators and colleagues in the room—I see a few of you smiling, including our regional director. I know you speak the language of liquidity and capitalization. But a few years ago, I started reading some old philosophy books. Aristotle, mostly. And I had this embarrassing realization that while I was in a library trying to understand his arguments about usury and the unnatural nature of interest, my aunt had been running a thirty-nine-year case study on the subject from the back of a hardware store.

  Aristotle argued that money is sterile. It's a convention, a way for people to measure needs against one another. When you treat money like livestock, expecting it to breed on its own, you get into trouble. You start lending to people who can't pay back because the "breeding" matters more than the need. My aunt refused to play that game. She knew that if you focus on the people, the money takes care of itself. But if you focus on the money, you lose the people.

  I have been instructed *not* to stand here and talk about her impressive returns, or her growth metrics, or her bottom line. Mostly because she would scold me for using those words, but also because those aren't the things that kept this place open since 1985.

  You don't keep a place open for thirty-nine years by chasing numbers. You keep it open by being the person who says "yes" to a car loan when the big bank says "no," not because it's risky, but because you know the driver. You keep it open by understanding that a balance sheet is just a story we tell about how well we're looking out for each other.

  There is a distinction in that old philosophy between managing a household and managing a business. One is about enough. The other is about *more*. My aunt was never interested in *more*. She was interested in *enough*. Enough to keep the lights on, enough to pay the staff, and enough to help the next person walk through the door.

  To the members here: You know this better than anyone. You know that when you walked into her office, you weren't a "risk profile." You were the person who buys the paint, or the teacher who drives the bus, or the cousin who needs a hand. She treated money as a measure of trust, not a commodity to be sold.

  And to the regulators: I know your job is to ensure safety and soundness. But I think you'll agree, there is a kind of soundness that doesn't show up on a spreadsheet. It's the soundness of a community that knows it won't be eaten alive by its own ledger.

  So, as we look toward her retirement, I want to wish her the very best. And I hope that in this next chapter, she finally finds something that *does* have babies. Maybe tomato plants. Maybe grandkids. Maybe just a very productive garden.

  Because she spent thirty-nine years teaching us that money is just a tool for living. Now, it's time for her to just live.

  Aunt [Name], money doesn't have babies. But the community you built? That's a whole different story.

  Cheers.
