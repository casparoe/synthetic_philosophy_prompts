answer: |-
  The blue notebook sat on the laminate countertop, exactly four inches from the edge. It was always four inches. If it slid to five, Grandma would nudge it back without looking up from her tea.

  I watched her from the doorway. She opened it to today's page. Her finger traced the lines like she was reading Braille. *9:00 AM: Pills. 10:00 AM: Water plants. 11:30 AM: Lunch with Sarah.* She checked the boxes. Her face relaxed. The anxiety that usually hummed around her like static electricity grounded itself in the ink.

  "It works, Alex," Aunt Sarah said behind me, whispering. She was holding a bag of groceries. "Look at her. She's eating. She's bathing. Six months ago she was living on saltines and fear."

  "Because she trusts the book more than her own head," I said.

  "That's the point. The book *is* her head now. Or part of it." Sarah unloaded milk into the fridge. "Clark and Chalmers. Otto and his notebook. You took that class, remember?"

  "I remember," I said. "I also remember the scammer call last Tuesday."

  Sarah froze, milk carton in hand. "We handled that."

  "Did we? He told her she owed money on a utility bill. She picked up the pen, Sarah. She was going to write it down. If I hadn't walked in when I did, 'Owed: $450' would be on line four right next to 'Water plants.'"

  "So? She didn't write it. System works. She checked with you."

  "She checked with me because I was physically present," I said, stepping into the kitchen. "If I'd been five minutes later, it would be in the book. And once it's in the book, she treats it as truth. Absolute truth. That's not a tool. That's a backdoor into her cognition."

  Sarah slammed the fridge door. "You're getting academic on me. This is survival. You want her in a facility? Because this notebook is the only thing keeping her here. It's coupled to her. It's reliable. It's automatically endorsed. That's the criteria."

  "That's the *coupling* criteria," I corrected, my voice rising. Grandma didn't turn, but her pen hovered. "Just because it's coupled doesn't mean it *constitutes* her mind. That's the fallacy. A blind man's cane is coupled to his sense of touch, but if someone else shakes the cane, is that *their* touch? If someone writes in the book, is that *her* memory?"

  "Alex," Grandma said softly. She wasn't looking at us. She was looking at the bottom of the page. "There's a line here. From yesterday."

  My stomach dropped. I moved to the counter. Sarah was there first.

  Grandma's finger rested on a line in small, shaky script. It wasn't Sarah's neat block letters. It wasn't Grandma's usual looping cursive. It was jagged. hurried.
  *Ref: 8842. Call back re: outstanding balance. Do not ignore.*

  "I don't remember writing this," Grandma said. Her voice was small, the voice of a child who knows they've wet the bed. "But it's in the book. So I must have done it. So I must owe it."

  "Grandma, no," I said. "That was the man. The scammer. We told you."

  "But I held the pen," she said. She looked at her hand, then the notebook. "If I wrote it, it's mine. If it's mine, it's true. That's how we decided it works."

  She was right. That was the agreement. To bypass the dementia, they had outsourced the verification process. The notebook was the authority. The biological brain was the suspect. By accepting the notebook as a constitutive part of her mind, they had agreed that its contents were non-negotiable beliefs.

  But this content was derived. It came from outside. It had no original intentionality. It was noise that looked like signal.

  "Give me the pen, Mom," Sarah said, reaching for it.

  Grandma pulled her hand back. "If I cross it out, I'm lying. The book doesn't lie."

  "The book can be wrong!" Sarah snapped.

  "Then the book isn't your mind," I said. "It's just paper. And if it's just paper, you can't trust it blindly. You have to check it. But if you have to check it, then it's not solving the memory problem, is it? You're just trading a broken memory for a breakable book."

  Grandma looked between us. The static was back. The safety of the four-inch zone was evaporating. "I need to know if I owe the money."

  "You don't," I said.

  "How do I know?"

  "Because I'm telling you."

  "But you're not in the book."

  She looked at me with a terrifying clarity. This was the hard part. The part the philosophy papers glossed over with diagrams of Otto walking to the museum. If the notebook is part of the mind, then tampering with it is assault. But if it's not part of the mind, then relying on it this completely is insanity.

  Grandma was in a limbo where her cognitive boundaries were porous. She was a network node, and the scammer had found her IP address.

  "Mom, please," Sarah said. She took the pen. She drew a thick, black X through the line.

  Grandma flinched. "You're destroying evidence."

  "I'm correcting an error."

  "Errors happen inside the head," Grandma said. "Inside the head, you can forget. In the book, things are permanent. If it changes, then the book is... fluid." She touched the crossed-out ink. "If the book is fluid, I can't use it. If I can't use it, I don't know who I am."

  She closed the notebook. She pushed it to exactly four inches from the edge.

  "I'm going to lie down," she said.

  We watched her shuffle to the hallway. When the bedroom door clicked shut, Sarah leaned her forehead against the laminate counter.

  "You happy?" she asked. "You wanted to prove a point."

  "I wanted to prove that there's a boundary," I said. "There has to be a skin. Something the world can't touch without permission."

  "She has dementia, Alex. The boundary is gone. The skin is permeable. This notebook... it's a graft. Sometimes grafts take. Sometimes they get infected." Sarah looked at the blue book. "If we take it away, she collapses. If we keep it, she's vulnerable to anyone with a pen and a smooth voice. There isn't a third option."

  I looked at the notebook. The ink of the scammer's line was still visible through the black X. It was a ghost in the machine.

  The problem wasn't whether the notebook was part of her mind. The problem was that her mind had become a public document.

  I picked up the pen. It was still warm from Grandma's hand. I opened the book to a fresh page. I could write something. *You are safe. You owe nothing. You are Eleanor.*

  But who am I to write that? If I write it, does it become true because it's in the system? Or is it just more ink, just as liable to be crossed out tomorrow?

  If I write it, I'm constituting her reality. I'm the admin.

  I put the pen down.

  "What do we do?" Sarah asked.

  "I don't know," I said. "We can't lock the book. And we can't leave it open."

  Grandma's voice came from the hallway, faint. "Did I call them back?"

  Sarah and I looked at each other. The notebook sat between us, blue and silent. It didn't answer. It was just paper. It was definitely just paper.

  But Grandma was waiting for the answer to come from the counter.

  "I don't know, Grandma," I called out.

  "Check the book," she said. "It'll say."

  I looked at the crossed-out line. The ink was drying. The boundary was gone.

  "It doesn't say anything," I lied.

  "Then write it," she said from the dark. "Just write what's true."

  I held the pen over the blank line. My hand shook. If I wrote it, I was fixing the system. If I wrote it, I was admitting that the system needed me to be the truth-generator. And when I wasn't here? When the next caller came?

  I capped the pen.

  "We'll figure it out," I said to the empty room.

  The notebook stayed open. The page stayed blank. And somewhere in the apartment, the phone sat on the hook, waiting to ring, waiting to turn air into ink, waiting to tell us where the mind ended and the world began.
