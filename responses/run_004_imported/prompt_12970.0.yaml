answer: |-
  Here are 9 interview questions designed for your seminar assignment. They are structured to move from definitions to the specific tensions you need to highlight, with follow-ups that anticipate Aquinas's likely appeals to "order," "prudence," and the "common good."

  ### **Podcast Title: *The Angelic Doctor & The Sword***
  **Guest:** Thomas Aquinas, O.P.

  **1. Defining the Line**
  "Master Thomas, let's start with the basics. In *De Regimine Principum*, you define a tyrant as someone who seeks their own good rather than the common good. But practically speaking, rulers often claim their self-interest *is* the state's interest. If a king raises taxes to fund a war he says is for defense, but the people say is for glory, who gets to decide where 'firm rule' ends and 'tyranny' begins? Is tyranny an objective moral fact or a subjective political judgment?"

  *   **Follow-up:** "If it's subjective, doesn't that make your warning against private judgment self-defeating? You tell us not to judge the ruler privately, but isn't identifying him as a tyrant itself a private judgment?"

  **2. The Usurper vs. The Legitimate Ruler**
  "You draw a sharp distinction between a ruler who seizes power by force (a usurper) and a legitimate ruler who later becomes corrupt. You suggest a usurper can be deposed by anyone, but a legitimate tyrant requires public authority. But if the *outcome* for the peasant is identical—oppression, fear, injustice—why does the *title* matter more than the *act*? Why does the origin of his power change the moral license to remove him?"

  *   **Follow-up:** "So you're saying the sin of usurpation makes him an 'outlaw,' but the sin of oppression doesn't? Doesn't that prioritize legal technicality over the actual suffering of the commonwealth?"

  **3. The *De Regimine* Caution**
  "In *De Regimine Principum*, you seem incredibly cautious about private citizens acting against a tyrant. You suggest we should often just endure it or wait for divine intervention. But if tyranny is a mortal sin that destroys the social bond, why are you advising passivity? Isn't endurance in the face of evil a form of complicity?"

  *   **Follow-up:** "You argue that failed attempts make the tyrant more vicious. But doesn't that logic apply to *any* resistance? By that standard, wouldn't you also argue against public wars or legal depositions, since those could also fail and make things worse?"

  **4. The Sedition Contradiction**
  "Here's where students get stuck. In the *Summa Theologiae*, you say resisting a tyrant is *not* sedition because the tyrant is the one already disrupting the unity of the multitude. But in *De Regimine*, you warn against private action causing disorder. If the tyrant is already the author of disorder, how can removing him create *more* disorder than keeping him? Isn't the 'disorder' argument just a way to protect the status quo?"

  *   **Follow-up:** "If the tyrant has already broken the peace, why do we still owe him the peace of non-resistance? Does the social contract survive his violation of it?"

  **5. The 'Ambitious Pretender' Objection**
  "You explicitly worry that if private tyrannicide is allowed, ambitious people will kill good rulers and claim they were tyrants to seize power. I get the risk. But doesn't this fear effectively give bad rulers a 'protection racket'? If the only check on a king is the fear of assassination, and you remove that fear by calling it sinful, haven't you insulated the tyrant from the very consequence that might restrain him?"

  *   **Follow-up:** "You trust 'public authority' to check the tyrant. But what if the public authority is packed with his cronies, or terrified of him? If the institutional checks fail, why must the natural law right to self-defense also fail?"

  **6. Who Is 'Public Authority'?**
  "You keep deferring to 'public authority' to depose a tyrant. In your context, that might mean the Emperor or the Pope. But in a modern kingdom, if the King *is* the highest earthly authority, who is left to judge him? Are you saying there is no earthly remedy for a supreme tyrant, only a divine one?"

  *   **Follow-up:** "If the remedy is only divine, does that mean we are supposed to wait for a miracle while the common good is destroyed? Is political prudence just waiting for God to strike the king down?"

  **7. The Threshold of Suffering**
  "Is there a threshold where endurance becomes impossible? You mention that if a tyranny is 'excessive,' it might be better to risk action. But who measures 'excessive'? If a ruler is killing only a minority, or stealing only half the grain, is that 'excessive' enough? Or does the suffering need to be universal before resistance is licit?"

  *   **Follow-up:** "If the suffering must be universal, doesn't that mean the resistance will come too late to save the polity? Are you essentially requiring the patient to be dead before the doctor can operate?"

  **8. The Calculation of Consequences**
  "Your whole argument rests on a utilitarian-style calculation: the danger of the tyranny vs. the danger of the resistance. But humans are terrible at predicting consequences. Isn't there a deontological argument here? If the ruler is unjust, is he not *deserving* of deposition regardless of the risk? Why does the potential for a worse future ruler negate the justice of removing the current one?"

  *   **Follow-up:** "So justice is contingent on success? If I kill a tyrant but a worse one follows, was my act unjust *in the moment*, or only in retrospect?"

  **9. The Common Good vs. Order**
  "Finally, Master Thomas, your entire philosophy prioritizes the *Common Good*. But you also prioritize *Order*. When those two clash—when the only way to restore the Common Good is to disrupt the Order—why does Order usually win in your political advice? Is peace without justice actually a good?"

  *   **Follow-up:** "If you had to choose: a stable tyranny that feeds the poor, or a chaotic republic that starves them—which serves the Common Good? And does your theory allow for the chaotic republic?"
