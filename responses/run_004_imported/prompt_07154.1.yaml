answer: |-
  **Setting:** *A quiet booth in a coffee shop near the university. Two napkins are covered in diagrams of synapsid skulls. **Elena** (Etiological Theorist) stirs her tea. **Carl** (Causal-Role Theorist) leans forward, tapping a sketch of the middle ear.*

  **Carl:** Look, I get the appeal of history. You're an anatomist; you love a lineage. But when I'm explaining *how* a mammal hears, I don't need to know what a *Therapsid* was doing with its jaw two hundred million years ago. I need to know how the malleus transfers vibration to the incus. That is its causal role in the auditory system. That is its function.

  **Elena:** That is its *effect*, Carl. Not its function. If I kick a stone and it rolls into a hole, the stone's rolling was an effect of my kick. It doesn't mean the stone's function is to fill holes. You're conflating what a trait *does* with what it is *for*.

  **Carl:** And you're conflating metaphysics with physiology. In the lab, "function" is a tool for analysis. I analyze the auditory system. In that system, the malleus contributes to hearing. Therefore, hearing is its function. If I analyze the skeletal system, maybe its function is structural support. It's relative to the containing system I'm interested in.

  **Elena:** And there's your first leak. Promiscuity. If function is just "any contribution to any capacity of any containing system," then the malleus also has the function of adding mass to the skull. It has the function of vibrating the air inside the bulla. It has the function of providing a surface for bacteria to colonize during an infection. If you don't anchor function in history, in *why* the thing is there, everything does everything.

  **Carl:** That's a caricature. We constrain it by explanatory interest. I don't care about the bacteria because I'm not studying infection. I care about hearing because I'm studying audition. The "promiscuity" is only a problem if you think there's One True Function capitalized. There isn't. There are functions-relative-to-systems.

  **Elena:** But that kills normativity. It kills the ability to say something is *broken*. If the malleus is otosclerotic—fused, rigid—it still has causal roles. It conducts heat. It adds weight. It blocks sound. On your view, blocking sound is just as much a "function" as transmitting it, provided I'm analyzing a system where blocking sound is the capacity I care about. But biologically, that bone is *malfunctioning*. It's failing to do what it's supposed to do.

  **Carl:** "Supposed to" is the theological ghost in your machine. I can handle malfunction without your history. Malfunction is just a deviation from a capacity model. If the standard mammalian auditory system has capacity *X*, and this token system lacks *X* due to the ossicle, we call it a malfunction. It's a statistical or engineering norm, not a historical one.

  **Elena:** An engineering norm requires a designer. Evolution isn't an engineer; it's a tinkerer. The only "norm" evolution produces is survival and reproduction. The reason that fused bone is a malfunction is because it fails to perform the effect that explains its presence in the population. It was selected for transmission. When it doesn't transmit, it fails its selected effect. Without that history, you just have a broken thing, not a malfunctioning biological trait. You can't distinguish a birth defect from a rare but viable morph without knowing what selection was doing.

  **Carl:** Fine, let's grant you history for a second. Let's walk into your trap. The malleus and incus. Homologous to the articular and quadrate. Reptilian jaw joint. Mammalian ear bones. When, exactly, did the function switch?

  **Elena:** When the selection pressure shifted. When the lineage began reproducing *because* those bones transmitted sound better, rather than articulated the jaw better.

  **Carl:** That's vague. Immensely vague. There was a transitional phase. *Morganucodon*, maybe earlier. The bones were doing *both*. They were part of the jaw joint *and* transmitting sound. On your view, what was the function then? Two functions? Neither? And if the anatomy didn't change much, but the "selection episode" did, you're saying the function changed without the bone changing?

  **Elena:** Yes. Because function isn't in the bone. It's in the lineage.

  **Carl:** That's the pressure point, Elena. Imagine a time traveler grabs a *Morganucodon* skull. He looks at the bone. He asks, "What does this do?" If he asks a physiologist, she says, "It helps hear and chew." If he asks you, you say, "Well, I need to check the reproductive records of the population to tell you which one is the 'real' function." That's useless for understanding the organism in front of you.

  **Elena:** It's not useless, it's precise. It tells you why the trait persists. If the jaw function was lost but the ear function remained, the jaw function is no longer the proper function, even if the bone still helps chew incidentally.

  **Carl:** But here's the killer for the etiological view. Exaptation. The bones didn't evolve *for* hearing initially. They were co-opted. So, for that transitional period, the "hearing" effect was not the selected effect. It was a novel causal role. So, on your strict view, during the origin of mammalian hearing, the malleus had *no function* regarding hearing. It was just a lucky accident.

  **Elena:** Millikan handles this. Derived proper functions. Once the new use contributes to fitness and is maintained by selection, it acquires a new proper function. The history updates.

  **Carl:** "Updates" how? Selection doesn't send a memo. It's a statistical aggregate. How many generations of successful hearing does it take before the function flips? Fifty? Five hundred? If you can't draw the line, then "function" is a vague predicate. But the bone's contribution to hearing is precise *now*. Why burden the present with a fuzzy past?

  **Elena:** Because without the past, you can't explain the future. You can't explain why the bone develops the way it does. The developmental pathway is conserved because of the history. If you ignore the selected effect, you can't explain why a mutation that disrupts the bone's shape is weeded out. You need the historical norm to explain the stability of the mechanism you love so much.

  **Carl:** I explain the stability by current selective pressure. The bone is here because it *is currently* useful.

  **Elena:** That's circular. "It is here because it is useful." Useful for what?

  **Carl:** For survival!

  **Elena:** Survival isn't a capacity. Hearing is a capacity. Transmitting sound is a causal role. But *why* is transmitting sound the function and not "vibrating the air"? Because that's what was selected. You need me, Carl. You need the history to filter the infinite causal roles down to the biologically relevant ones.

  **Carl:** And you need me, Elena. Because your "history" is a black box of unknowable selection pressures. We rarely know the exact selection episode that fixed a trait. Are we supposed to say we don't know the function of the heart until we reconstruct the paleo-environment of the first vertebrate with a pump? No. We say the function is to pump blood because that's what it's doing in the system right now.

  **Elena:** You're confusing epistemology with ontology. Just because it's hard to *know* the history doesn't mean the history isn't what *makes* it a function.

  **Carl:** I'm confusing nothing. I'm saying that if your definition of "function" makes it impossible to assign functions in 90% of physiological research because we lack the phylogenetic data, your definition is broken. The causal-role account lets me assign functions to the spleen, the appendix, and the ear bones based on what I can observe *today*.

  **Elena:** And lets you assign the function of "filtering nicotine" to the liver just because it happens to do that in a smoker. It lets you say a cancerous tumor has the "function" of consuming resources because it contributes to the "capacity" of the tumor system to grow. It's too permissive. It loses the distinction between a parasite and an organ.

  **Carl:** Only if I define the containing system as "the host." If I define the system as "the tumor," then consuming resources is a function. Context matters.

  **Elena:** But biology doesn't treat the tumor as a legitimate system. It treats it as a malfunction of the host. Why? Because the tumor's replication isn't what the host was selected for. You keep coming back to selection, Carl. You keep using the language of norms while pretending you don't need the history that grounds them.

  **Carl:** I use the language of design because it's a useful shorthand. But let's go back to your ear bones. If the function is fixed by the selection episode, what happens if the environment changes again? Suppose mammals move to an environment where jaw strength matters more than hearing, and those bones start getting selected for jaw articulation again. Does the function flip back?

  **Elena:** If the selection pressure flips, yes. The proper function tracks the reason for maintenance.

  **Carl:** So the function is unstable. It's hovering over the bone like a ghost, waiting to see what the population does. Meanwhile, the bone is just sitting there, transmitting sound. My account is stable. The bone contributes to hearing. That's a fact. Whether selection keeps it there is a separate question about *why* it's there, not *what* it does.

  **Elena:** But "what it does" isn't function. A bomb explodes. That's what it does. Its function is to destroy a target. If it duds, it still has the causal role of "sitting in the ground," but its function is failed. You can't capture that failure without the etiology. A heart that doesn't pump is a malfunctioning heart. A heart that doesn't filter nicotine is not a malfunctioning liver. You need the "for" to distinguish the two.

  **Carl:** And I need the "now" to do science. Look, here's the stalemate. You want function to be about *norms*—what should happen. I want function to be about *capacities*—what can happen. The ear bone case is nasty because it highlights the gap. The bone's capacity changed gradually. Its "norm" had to jump.

  **Elena:** The norm didn't jump. The selective regime shifted.

  **Carl:** Which is unobservable. I'm sticking with the observable contribution. If I'm a surgeon fixing a deaf patient, I don't care about the quadrate bone of a reptile. I care that this malleus isn't moving. I'm restoring its causal role.

  **Elena:** You're restoring its selected effect. You're trying to make it do what it was designed by evolution to do. You're implicitly appealing to my definition to justify your surgery. If it were just a causal role, you could just give it a new role. Weld it shut. Make it a structural strut. But you don't. You try to make it hear. Why? Because you know that's what it's *for*.

  **Carl:** I try to make it hear because the patient wants to hear. Not because of Millikan.

  **Elena:** *(Smiles, picking up her tea)* And there we are. You think the patient's desire grounds the function. I think the evolutionary history grounds it.

  **Carl:** And until we can agree on whether biology is about the history of the lineage or the mechanics of the individual, I suppose we'll keep ordering more coffee.

  **Elena:** Make it tea. But yes. Pass the sugar. The lineage can wait.

  **Carl:** *(Pouring)* The lineage always waits. It's the present that breaks.

  **Elena:** Only because the past isn't holding it together anymore.

  *(They sit in silence for a moment, looking at the diagram of the skull where the jawline fades into the ear canal.)*
