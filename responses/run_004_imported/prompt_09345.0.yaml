answer: |-
  Friends, family, parishioners, and colleagues.

  We are gathered here to honor a woman who lived a life without divisions. To the parish, she was Mother [Grandmother's Name], the priest who visited you in the hospital, who baptized your children, and who preached sermons that made you feel both challenged and held. To the academy, she was Dr. [Last Name], the rigorous mind who spent thirty years teaching the deepest questions of faith and reason.

  But if you knew her, you know she never saw these as two different jobs. For her, theology was not a puzzle to be solved in a library; it was the ground we walk on. And nowhere was this clearer than in how she understood the very nature of God's goodness.

  There is an old question that has troubled thinkers for centuries: Is something good because God loves it? Or does God love it because it is good? It is a trap, a false choice that forces us to imagine God as either a tyrant who makes up the rules as He goes, or a bureaucrat following a rulebook that exists above Him.

  She had no patience for either option.

  She taught us that God does not look outside Himself to find the good, nor does He arbitrarily invent it. Rather, God *is* the Good. Just as the sun does not decide to shine but simply is light, God does not decide to be good; He is the source and substance of all goodness. His commands are not whims, nor are they regulations. They are invitations into reality as it truly is.

  Why does this matter at a time like this? Why does it matter for a eulogy?

  Because it means that the love she showed you, and the love God shows us, is not a mood. It is not a decision God makes on a Tuesday and revokes on a Friday. It is as constant and reliable as existence itself. When she offered you absolution, or comfort, or bread and wine, she wasn't offering a temporary fix. She was connecting you to the very fabric of reality, which is grounded in Love.

  I stand here as her grandchild, but also as her student. I am pursuing my own doctorate in this field because she showed me that precision is a form of love. To be sloppy with the truth about God is to mislead the people who trust Him. She marked my papers heavily when I tried to take shortcuts, because she knew that if we flatten God into a mere lawgiver or a mere follower of laws, we lose the mystery that saves us.

  She believed that because God's nature is simply "To Be," to be close to Him is to be more fully alive. And she lived that out. She didn't just talk about the Good; she inhabited it. When you sat in her office, or knelt at this altar rail with her presiding, you weren't dealing with someone who was guessing about God. You were with someone who knew that Truth and Being and Love are one and the same.

  So, how do we say goodbye to her? We don't, not really. If she was right—and I believe with all my heart that she was—then death is not a victory of nothingness over being. It is a transition into the fullness of the One who is Being itself.

  To the parish: You lost a shepherd who knew that God's love is the most real thing in the universe.
  To my colleagues: We lost a mind that refused to let faith become irrational or reason become faithless.
  And to our family: We lost the matriarch who taught us that integrity means refusing false choices, even when they are convenient.

  She has now entered into the joy she spent a lifetime describing. Not a joy that God decided to create on a whim, but the Joy that God *is*. She is known, fully and finally, by the Love she loved so well.

  Rest in peace, Grandma. You have finished the seminar. You have entered the reality.

  Amen.
