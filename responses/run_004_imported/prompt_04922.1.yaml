prompt: |-
  I sit on my company's Experimentation Review Board, the internal group that must sign off before an A/B test result can be used to justify a permanent product change. The growth team stopped their onboarding-flow test on day 9 of a planned three-week run, the moment the frequentist p-value for the conversion-rate difference crossed 0.05, and now want to ship on that basis; our statistician objects on optional-stopping grounds, but the growth PM counters that a colleague re-ran the same nine days of data through a Bayesian beta-binomial model, got a 97% posterior probability that the new flow is better, and argues that number is untouched by the objection, since Bayesian updating doesn't care why or when you decided to look at the data. The board is split on whether that reply actually defeats the statistician's objection or just relocates it. Please draft the board's written decision memo: rule on whether the rollout can proceed, with a concrete timeline for whatever you recommend, and set a monitoring policy for future tests -- and make sure whichever side you rule against gets a fair hearing rather than a one-line dismissal.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Experimentation Review Board (ERB).
      *   **Task:** Draft a written decision memo regarding a specific A/B test situation.
      *   **Scenario:** Growth team stopped a test early (Day 9 of 21) because $p < 0.05$. Statistician objects (optional stopping/peeking problem). Growth PM counters with a Bayesian analysis (97% posterior probability) claiming immunity to optional stopping.
      *   **Requirements:**
          *   Rule on whether the rollout can proceed.
          *   Provide a concrete timeline for the recommendation.
          *   Set a monitoring policy for future tests.
          *   Ensure the losing side gets a fair hearing (no one-line dismissal).
          *   Tone: Professional, authoritative, nuanced, data-literate.

  2.  **Evaluate the Statistical Arguments:**
      *   **Frequentist Peeking (Optional Stopping):** The Growth Team used a frequentist p-value but stopped early based on that p-value. This inflates the Type I error rate (false positives). A p-value of 0.05 at an interim look is *not* equivalent to a p-value of 0.05 at a fixed sample size. The Statistician is correct here.
      *   **Bayesian Counter-Argument:** The Growth PM claims Bayesian inference is immune to stopping rules.
          *   *Nuance:* Technically, the Likelihood Principle suggests that if the model is perfectly specified, the stopping rule doesn't change the posterior *given the data*. However, in practice, "optional stopping" *does* affect Bayesian decision-making if the decision rule is "stop when posterior > 95%." This creates a form of selection bias. If you check every day and stop at 97%, you are more likely to catch noise spikes than if you wait until the end.
          *   *Prior Sensitivity:* A 97% posterior depends heavily on the prior. If the prior was optimistic, the posterior will be too.
          *   *Calibration:* Has the company calibrated its Bayesian thresholds against known false positive rates? 97% probability sounds high, but without calibration, it might correspond to a frequentist error rate much higher than 5%.
      *   **Conclusion:** The PM's argument is theoretically seductive but practically risky in a business context without calibration. Relying on an uncalibrated Bayesian threshold to justify early stopping effectively reintroduces the multiple comparisons problem, just under a different name. The Statistician's concern about error control is valid for business risk.
      *   **Decision:** Do not ship yet. The evidence is compromised by the stopping rule regardless of the framework, unless the Bayesian threshold was pre-registered and calibrated for sequential testing.

  3.  **Determine the Ruling & Timeline:**
      *   **Ruling:** No immediate rollout.
      *   **Remedy:** Continue the test to the original sample size/duration OR run a new test with proper sequential monitoring bounds. Given the test is already "contaminated" by the early stop decision, the cleanest path is often to treat the current data as exploratory and gather more data to confirm. However, stopping a live test that users are already experiencing can be disruptive.
      *   *Better approach:* Since the test is already stopped, we can't "unstop" it easily without user experience churn. The best compromise is to treat the current result as *inconclusive* due to the stopping rule. We need to validate.
      *   *Recommendation:* Do not ship based *solely* on this result. Either:
          1.  Resume the test for the full duration (if feasible without UX harm).
          2.  Launch a follow-up validation test (A/A/B or just a new A/B).
          3.  Accept the risk but acknowledge the higher false positive rate (not recommended for a Review Board).
      *   *Selected Path:* Resume the test to the original planned duration (Day 21) if possible, ignoring the intermediate results. If the result holds at Day 21 with a corrected alpha (or Bayesian threshold), then ship. If the test cannot be resumed (e.g., code was reverted), a follow-up test is required. Let's assume for the memo that the test *can* be resumed or the traffic can be kept split.
      *   *Refined Path:* Actually, if they already stopped collecting data, resuming might introduce time-bias (seasonality). The most rigorous statistical advice is to discard the "significance" claim and either run to full duration *ignoring* the early peek or run a replication. Let's recommend completing the original duration *without* making a decision until the end, treating the Day 9 look as a non-decision point.
      *   *Wait, practical constraint:* If they stopped the test, did they turn off the variation? If they turned off the variation, they can't resume easily. Let's assume they paused data collection but the code is live, or they can restart.
      *   *Safest Business Decision:* Do not ship. The risk of a false positive (rolling out a change that hurts metrics long-term) outweighs the speed gain. Require the test to run to the full planned duration (Day 21) before re-evaluating.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The decision (No ship), the reason (Stopping rule validity), and the next step (Complete duration).
      *   **Context:** Briefly summarize the test and the conflict.
      *   **Evaluation of Arguments (The "Fair Hearing" part):**
          *   *Growth Team:* Acknowledge the Bayesian argument. It's theoretically sound regarding the Likelihood Principle. Acknowledge the desire for speed.
          *   *Statistician:* Acknowledge the Frequentist error inflation. Acknowledge the business risk of false positives.
          *   *Synthesis:* Explain *why* the Bayesian argument doesn't fully absolve the stopping rule in a decision-making context (calibration/decision theory).
      *   **Decision:** Rollout denied for now.
      *   **Timeline:** Resume/Continue test until Day 21. Re-evaluate on Day 22.
      *   **Policy Update:** Pre-registration, Sequential Testing protocols (Alpha spending or Bayes Factors with stopping bounds), and education.

  5.  **Refining the Statistical Nuance (Crucial for Credibility):**
      *   I need to be careful not to say "Bayes is wrong." Bayes isn't wrong. But *decision making* based on Bayes *is* subject to stopping rules if the loss function involves the cost of data collection or the timing of the decision.
      *   Key point: If you check every day and stop at 97%, your *long-run* false discovery rate will exceed the implied error rate of that threshold unless the threshold is adjusted for the number of looks.
      *   I need to make sure the Growth PM feels heard. Their point is a common advanced statistical talking point. I should validate that *in theory* they have a point, but *in practice* (without pre-calibrated priors and stopping bounds), it's risky.

  6.  **Review against Constraints:**
      *   *Rule on rollout:* No.
      *   *Concrete timeline:* Finish original 3 weeks.
      *   *Monitoring policy:* New guidelines on peeking/sequential testing.
      *   *Fair hearing:* Dedicate a section to analyzing both arguments respectfully.

  7.  **Final Polish:**
      *   Tone check: Is it too academic? Too blunt? Needs to be decisive but collaborative.
      *   Ensure the distinction between *inference* (what the data says) and *decision* (what we do) is clear.

  **(Self-Correction during drafting):** I initially thought about suggesting a replication test. But if the test is already live and Day 9 of 21, it's more efficient to just let it run to Day 21 and ignore the Day 9 significance. I will recommend continuing the test to the original sample size. I need to make sure I explain *why* the Bayesian 97% isn't a "get out of jail free" card. It's about the *decision rule*, not just the *posterior calculation*.

  8.  **Finalizing the Memo Structure:**
      *   Header.
      *   Decision.
      *   Rationale (The Statistical Dispute).
      *   Action Plan & Timeline.
      *   New Policy Guidelines.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Growth Product Team, Data Science Team, Executive Leadership
  **FROM:** Experimentation Review Board (ERB)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Onboarding Flow Experiment (Exp-2023-44) and Updated Testing Protocols

  ### 1. Executive Decision

  The Experimentation Review Board (ERB) has reviewed the request to permanently ship the new onboarding flow based on the results of Experiment 2023-44. 

  **The Board denies the request for immediate rollout.**

  While the observed data is promising, the methodology used to declare significance compromises the reliability of the result. The test must continue until the originally planned duration (21 days) is complete. A final go/no-go decision will be made based on the data collected at that time, using adjusted significance thresholds appropriate for the extended monitoring period.

  ### 2. Evaluation of Statistical Arguments

  The Board recognizes this case highlights a sophisticated tension between statistical rigor and product velocity. We have carefully weighed the arguments from both the Growth Product Manager (PM) and the Staff Statistician. Neither side is dismissed lightly; both raise valid points that require nuance.

  **The Growth Team's Position (Bayesian Immunity)**
  The Growth PM argues that because a Bayesian beta-binomial model yields a 97% posterior probability of improvement, the test is immune to "optional stopping" (peeking). Theoretically, this relies on the Likelihood Principle, which suggests that evidence should be interpreted based on the data observed, regardless of the experimental design that produced it. We acknowledge that Bayesian methods are generally more robust to interim analysis than standard frequentist p-values. The desire to leverage this flexibility to accelerate learning is aligned with company goals for speed.

  **The Statistician's Position (Error Control)**
  The Statistician objects that stopping a test *because* a threshold was crossed inflates the false positive rate. In frequentist terms, checking data daily and stopping at $p < 0.05$ can inflate the actual Type I error rate to over 20%, even if the nominal p-value is 0.05.

  **The Board's Synthesis**
  The Board finds the Statistician's concern regarding *decision theory* decisive in this context. While the calculation of a Bayesian posterior is mathematically unaffected by stopping rules, the **decision to stop** is not. 

  If a team checks results daily and commits to shipping whenever the posterior probability exceeds 97%, the long-run rate of false discoveries will exceed the implied 3% risk level. This is because random noise will occasionally spike above 97% confidence early in a test before regressing to the mean. Unless the Bayesian threshold was pre-calibrated to account for the number of "looks" planned (e.g., requiring 99.5% for early stops), the 97% figure overstates the certainty. 

  Since the 97% threshold was applied post-hoc to a stopping rule designed for frequentist significance, we cannot trust that the false positive risk is adequately contained. Shipping now risks implementing a change that may degrade long-term retention, the cost of which outweighs the benefit of a two-week acceleration.

  ### 3. Action Plan & Timeline

  To resolve Experiment 2023-44 with statistical integrity, the Growth Team and Data Science Team will execute the following:

  *   **Test Resumption (Immediate):** The A/B test must resume data collection immediately. The variation must remain live for the originally planned 21-day duration to account for weekly seasonality effects.
  *   **Blind Monitoring (Days 10–21):** During the remainder of the test, the Growth Team will not access significance metrics. Data Science will monitor for data quality issues only (e.g., tracking breakage), not performance differences.
  *   **Final Analysis (Day 22):** Upon completion of the 21-day run, Data Science will perform a final analysis. 
      *   If using frequentist methods, alpha-spending corrections will be applied to account for the Day 9 peek.
      *   If using Bayesian methods, the posterior probability threshold for shipment must be raised to 98.5% to compensate for the interim look, unless a pre-registered sequential Bayes Factor plan is adopted.
  *   **Rollout Decision (Day 23):** Based on the corrected final analysis, the ERB will issue a final ship/no-ship ruling.

  ### 4. New Monitoring Policy for Future Experiments

  To prevent future impasses and balance speed with rigor, the ERB is instituting the following policies effective immediately:

  **A. Pre-Registration of Stopping Rules**
  All test plans must specify the stopping rule *before* launch. 
  *   **Fixed Sample:** If using a fixed duration, no significance checks are permitted until the end.
  *   **Sequential Testing:** If early stopping is desired, the test must use a formal Sequential Testing framework (e.g., Alpha Spending Functions for frequentist, or Bayes Factors with calibrated thresholds for Bayesian). 

  **B. Bayesian Calibration**
  Bayesian thresholds are not exempt from review. Teams wishing to use Bayesian stopping rules must demonstrate that their chosen probability threshold (e.g., 95%, 97%) has been simulated to maintain an acceptable False Discovery Rate (FDR) given the frequency of data checks. A default "95% probability" is no longer sufficient justification for early stopping without this calibration.

  **C. The "Two-Strike" Rule**
  If a test is stopped early due to significance without a pre-registered sequential plan, the result is deemed **Exploratory**. Exploratory results cannot justify a permanent rollout on their own; they require validation via a follow-up holdout test or replication.

  ### 5. Closing

  We understand that pausing a winning test feels counterintuitive. However, the cost of a false positive—engineering time spent building on a flawed feature, user friction from future rollbacks, and eroded trust in our data—is significantly higher than the cost of waiting two more weeks. 

  The Growth Team's intuition about the data is likely correct, but our governance exists to ensure our intuition is backed by evidence that holds up over time. We thank both the Growth and Data Science teams for a rigorous debate that has helped us strengthen our experimentation culture.

  **Signed,**

  **The Experimentation Review Board**
