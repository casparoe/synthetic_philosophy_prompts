answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Rescue Name]
  **FROM:** [Your Name], Board Member & Foster Coordinator
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Live Release Rate Target & Grant Compliance

  **Purpose**

  The purpose of this memo is to provide a recommendation regarding the proposed motion to formally commit to a 90% Live Release Rate (LRR) for the upcoming fiscal year. This commitment is required to secure the [Name of National Funder] matching grant and is proposed as a key performance indicator for the Executive Director's annual bonus.

  After reviewing the financial implications and the operational risks, **I recommend that the Board votes to adopt the 90% commitment to secure the grant, but modifies the implementation plan to include a 12-month baseline period and specific intake safeguards before tying the metric to executive compensation.**

  **The Case for Accountability**

  The argument for this motion is strong, and I want to be clear that I support the intent. Our rescue operates on thin margins, and the matching grant represents a significant portion of our projected budget for veterinary care and facility maintenance. Furthermore, "no-kill" is not just a slogan; it is a moral imperative. Establishing a concrete metric like a 90% LRR aligns us with industry standards for high-performing rescues. It provides our donors with transparency and gives our staff a clear operational North Star. Accountability is not the enemy; it is necessary for growth.

  **The Risk: Goodhart's Law**

  However, binding this metric to high-stakes outcomes (public reputation and personal compensation) introduces a specific systemic risk known as **Goodhart's Law**. In economics, this principle states: *"When a measure becomes a target, it ceases to be a good measure."*

  This is not a question of ethics or honesty. It is a question of human behavior under pressure. When a specific number determines funding or bonuses, organizations inevitably begin to optimize for the number rather than the underlying reality the number is supposed to represent.

  We have already seen a mild version of this within our own operations. Previously, a volunteer coordinator guided a family to foster a dog with a severe bite history specifically to avoid logging the outcome as a shelter euthanasia. No one lied. The dog was placed. But the data no longer reflected the risk profile of our intake.

  If we lock in a 90% target with financial consequences attached, we risk two unintended consequences:

  1.  **Intake Restriction:** Staff may feel pressured to turn away animals with complex medical or behavioral needs at the door to protect the rate, effectively shifting our burden to less-resourced shelters or the streets.
  2.  **Data Reclassification:** We may see an increase in "transfers" or "foster-returns" that functionally act as euthanasia delays, inflating our LRR without actually saving more lives.

  None of this requires anyone to be dishonest. It simply requires people to make the "safe" choice for the metric rather than the "hard" choice for the mission.

  **Recommendation: Modified Adoption with Safeguards**

  We need the grant money, but we cannot compromise the integrity of our intake or our data. Therefore, I propose the following **Modified Adoption Plan**:

  **1. Secure the Grant (Immediate Action)**
  We vote to commit to the 90% LRR target to qualify for the [National Funder] grant. We cannot afford to walk away from this funding.

  **2. Implement an "Open Intake" Safeguard (Immediate Action)**
  To prevent the metric from discouraging us from taking in hard cases, we must formally codify that **LRR targets cannot supersede intake policies.** We need a board resolution stating that animals will not be turned away solely to protect the LRR statistic. If the LRR dips below 90% because we took in a high-needs cohort, that is a success of our mission, not a failure of management.

  **3. Phase the Executive Bonus (12-Month Timeframe)**
  Tying the Director's bonus to the LRR should not begin immediately.
  *   **Year 1 (Baseline Period):** We track the LRR and report it to the funder, but the Director's bonus is tied to a "Balanced Scorecard" (e.g., LRR *plus* total intake volume *plus* donor retention). This ensures the Director is rewarded for volume and sustainability, not just survival rates.
  *   **Year 2 (Evaluation):** After 12 months of data, the Board reviews whether the LRR target influenced intake decisions. If the data is clean and intake remained stable, we may then consider weighting the LRR more heavily in compensation.

  **Conclusion**

  We can have accountability without creating perverse incentives. By securing the grant now but phasing the bonus structure and protecting our intake policy, we get the financial benefits of the target without forcing our staff to choose between their livelihood and the animals that need us most.

  I move that we adopt the 90% commitment contingent upon the simultaneous adoption of the Open Intake Safeguard and the Phased Bonus Structure outlined above.
