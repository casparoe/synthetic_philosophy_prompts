      *   *Focus:* Focus on the *rationality* of the belief update.
      *   *Key distinction:* Distinguish between "Who is right?" (truth) and "What should we report?" (scientific practice).

  9.  **Final Polish:** Ensure the distinction between "conciliating on confidence" vs. "conciliating on belief" is clear. Emphasize that in science, unresolved ambiguity is a valid output. (This aligns with cognitive science values of nuance).

  10. **Structure:**
