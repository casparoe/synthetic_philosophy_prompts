      *   Practical Steps: What to actually do.
      *   Conclusion: It's okay to be uncertain.

  11. (Final Check against User Constraints): User is a PhD student. Keep it rigorous but practical. Don't be condescending. Acknowledge the lab politics aspect briefly but focus on the epistemology.

