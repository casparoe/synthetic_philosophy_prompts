answer: |-
  This is one of the stickiest problems in the philosophy of language. Slurs resist easy categorization because they seem to function simultaneously as descriptive terms (picking out a group), expressive devices (conveying hatred), and normative tools (enforcing social hierarchy).

  Here is a breakdown of Christopher Hom's **Combinatorial Externalism (CE)** versus the **Prohibitionism** of Anderson & Lepore (A&L), tested against the phenomena you mentioned, followed by my own assessment.

  ### 1. The Contenders

  **Christopher Hom: Combinatorial Externalism (CE)**
  Hom argues that the meaning of a slur is determined by the external social practices and ideologies surrounding it. Semantically, a slur doesn't just mean "member of group G." It means something like "member of group G *who is deserving of discrimination/persecution because of inherent negative traits*."
  *   **The Kicker:** Since the racist ideology is false (no one is inherently inferior or deserving of persecution), the slur has an **empty extension**. Literally, there are no [slurs]. If you say "X is a [slur]," you are stating a falsehood, even if X is a member of the target group.
  *   **The Goal:** To bake the derogatory force into the truth-conditions themselves.

  **Anderson & Lepore: Prohibitionism (P)**
  A&L take a deflationary approach. They argue that a slur and its neutral counterpart (NC) have the **exact same semantic content and reference**. "X is a [slur]" is true if and only if "X is an [NC]" is true.
  *   **The Kicker:** The difference is purely normative. Slurs are *prohibited words*. The offensiveness isn't in the meaning; it's in the social rule that says "you aren't allowed to utter this phoneme sequence to refer to this group."
  *   **The Goal:** To separate semantics (truth conditions) from pragmatics (social rules), simplifying the logic.

  ---

  ### 2. The Showdown: Embedding and Reclamation

  #### The Embedding Problem (Negation and Hypotheticals)
  This is the classic "Frege-Geach" challenge applied to hate speech. Why is "He is not a [slur]" or "If he is a [slur], then..." still offensive?

  *   **Prohibitionism (A&L):** This theory struggles here. If the word is just prohibited, using it inside a negation or a conditional should be less problematic because you aren't *asserting* the slur applies. You're just using the word as a variable. Yet, uttering "If John is a [slur], he should leave" feels morally tainted. A&L have to argue that the prohibition applies to *mentioning* the word, not just using it assertorically. But this feels ad hoc. Why is the *word* itself radioactive, rather than the claim?
  *   **Combinatorial Externalism (Hom):** CE handles this better. Because the derogatory ideology is part of the *semantic content*, invoking the word invokes the ideology, regardless of logical operators. When you say "If he is a [slur]...", you are asking your audience to entertain the racist ideology as a hypothesis. The "stain" projects because the ideology is embedded in the concept, not just the utterance act.

  **Winner:** **Hom.** It explains why the offense persists even when the truth-claim is cancelled.

  #### In-Group Reclamation
  How do target groups reclaim slurs (e.g., "Queer," "Nigga") and use them affectionately or proudly?

  *   **Combinatorial Externalism (Hom):** This is a major hurdle for Hom. If the literal meaning of the word *is* "inferior/deserving of persecution," how can it be used positively? Hom has to argue that reclamation involves a **semantic shift**. The in-group changes the ideology associated with the word, effectively creating a new word with a new semantic content. This is plausible but requires a complex mechanism to explain how the "old" meaning is stripped away so quickly in specific contexts.
  *   **Prohibitionism (A&L):** This is Prohibitionism's home turf. If the semantic content is neutral (same as the NC) and the only difference is a social prohibition, reclamation is simple: the in-group **waives the prohibition** for themselves. They haven't changed the meaning; they've just changed the rules of who is allowed to say it.
  *   **Winner:** **Anderson & Lepore.** It offers a much smoother explanation of reclamation without requiring semantic magic.

  #### Dummett's "Boche"
  Michael Dummett argued that "Boche" and "German" have the same reference but different "tones." For Dummett, "Boche" encodes an inferential potential: from "X is Boche," one is licensed to infer "X is barbarous."

  *   **Hom:** Takes Dummett seriously but radicalizes it. Hom says that inferential potential *is* the truth-conditional content. Since the inference is false, the term is empty.
  *   **A&L:** Rejects Dummett's semantic "tone." For them, the "tone" is just the feeling of breaking a taboo.
  *   **Analysis:** Dummett was right that there is a cognitive difference between "German" and "Boche" beyond just reference. Prohibitionism risks reducing this cognitive difference to a mere feeling of rule-breaking, which feels too shallow. Hom captures the *cognitive* load Dummett identified.

  ---

  ### 3. Which Theory Do I Buy?

  If forced to choose strictly between the two, **Christopher Hom's Combinatorial Externalism is the more philosophically robust theory**, though it requires modification.

  Here is why I reject Prohibitionism as a complete account:
  **Prohibitionism is morally deflationary.** By claiming the slur has the *exact same content* as the neutral term, A&L strip the word of its specific history of violence. It treats a slur like a profanity (e.g., "fuck") or a polite taboo (e.g., "pass away"). But slurs aren't just forbidden words; they are tools of subordination. If the content were truly identical to the neutral counterpart, then teaching a logic class using slurs as variables should be unproblematic (since no assertion is made). But it isn't. The *concept* itself is tainted, not just the utterance. Prohibitionism cannot explain why the *idea* expressed by the slur is harmful, only that the *word* is banned.

  However, **Hom's theory has a fatal flaw:** The claim that slurs are **empty terms** (true of no one) is counter-intuitive and linguistically awkward. When a racist says "X is a [slur]," they are not speaking falsely in their own mind; they are speaking truly about a social reality they believe in. Furthermore, when we report on their speech ("He called X a [slur]"), we are reporting a true fact about the world, which becomes difficult if the term refers to nothing.

  #### The Verdict: A Hybrid Expressivist View
  I actually buy a **Hybrid Expressivist** account (championed by philosophers like Daniel Boisvert, David Kaplan, or Robin Jeshion), which synthesizes the strengths of Hom while fixing the "empty extension" problem.

  1.  **Descriptive Content:** Like Prohibitionism (and Dummett), this view accepts that the slur picks out the same group as the neutral counterpart. "X is a [slur]" is true if X is a member of group G. This avoids Hom's "empty extension" weirdness and handles reclamation easily (the descriptive content remains, the attitude shifts).
  2.  **Expressive Content:** Like Hom, this view argues that the derogatory force is **semantic**, not just pragmatic. But instead of baking a false ideology into the *truth conditions*, it bakes a **contemptuous attitude** into the *use conditions*.
  3.  **Why this wins:**
      *   **Embedding:** It explains why "If he is a [slur]..." is offensive. You are expressing contempt conditionally.
      *   **Reclamation:** It explains how the group can keep the descriptive content (the reference) while flipping the expressive content (from contempt to solidarity).
      *   **Harm:** It acknowledges that the harm is in the *expression of attitude*, which is more accurate than A&L's "rule-breaking" and less metaphysically heavy than Hom's "false ideology."

  **Summary:** Hom is right that the hate is in the semantics, not just the pragmatics. Anderson & Lepore are right that the reference isn't empty. The truth lies in **Expressivism**: Slurs describe a group *and* simultaneously express a stance of superiority and contempt. This captures the "grossness" under negation (the contempt is still expressed) and allows for reclamation (the contempt can be replaced by solidarity) without needing to claim the word refers to nothing.
