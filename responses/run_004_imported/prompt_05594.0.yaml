      *   No forced resolution? Yes.

  *(Self-Correction Note during drafting)*: I need to be careful not to misrepresent Drory. Drory's main point is that Jaynes' derivation of the unique measure relies on a specific assumption about how the "bundle of lines" is generated. I should have Sam focus on the distinction between the *space of lines* and the *space of chords*. Jaynes conflates them; Sam separates them. Alex defends the conflation as necessary for "maximum ignorance."

