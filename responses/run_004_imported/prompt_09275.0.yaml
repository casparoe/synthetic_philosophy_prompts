prompt: |-
  I'm a novelist writing a book set in Newton's later years at the Royal Mint, in which a young clerk stumbles on the theological manuscripts he had kept hidden from Cambridge and the Royal Society alike. For background, I'm interviewing a historian of early modern science who argues that Newton's long campaign against what he saw as the corruption of true religion -- the doctrine of the Trinity chief among the casualties -- was the hidden organizing key behind his chronology and his alchemy, not a private eccentricity walled off from his "real" science. Draft eight to ten interview questions for her that move past the "secret heretic" framing already familiar from popular accounts of Newton. I want at least one question on how she would place his Christology relative to actual Arianism versus Socinianism, rather than treating "antitrinitarian" as a catch-all; one on what his unpublished argument that 1 John 5:7 and 1 Timothy 3:16 were scribal corruptions was really trying to establish; one on how compressing Egyptian and Greek chronology serves that larger story of a pure religion corrupted by priestcraft; and one on why he risked so much by writing it all down at such length if he never meant to publish most of it. For each question, add a short follow-up keyed to the answer she is most likely to give.
