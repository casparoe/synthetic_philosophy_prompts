answer: |-
  Gongsun Long arrives at the Hangu Pass border checkpoint, riding a white horse.

  **Guard:** "Toll for horses is ten coins."

  **Gongsun:** "This is a white horse. A white horse is not a horse."

  **Guard:** (Sighs, puts down his brush) "Okay, I've read the *Gongsun Longzi*. 'Horse' designates the form (*xíng*). 'White' designates the color (*sè*). The designator of color is not the designator of form. Therefore, the compound is not identical to the simple. I get it."

  **Gongsun:** (Beaming) "Finally! A man of culture. So I pass free."

  **Guard:** "Not so fast. If I seek a 'Horse', a yellow or black horse suffices. If I seek a 'White Horse', a yellow or black horse does not suffice. Since the conditions of sufficiency differ, 'Horse' is not 'White Horse'. Correct?"

  **Gongsun:** "Precisely!"

  **Guard:** "Okay. Well, if I seek 'Passage', ten coins suffice. If I seek 'Free Passage', ten coins do *not* suffice. Since the conditions of sufficiency differ, 'Passage' is not 'Free Passage'."

  **Gongsun:** "Wait—"

  **Guard:** "You are asking for 'Free Passage'. I am selling 'Passage'. They are not the same thing. You cannot give me one and expect the other. That'll be ten coins."

  **Gongsun:** "But... but the actuality (*shí*) of my movement is the same!"

  **Guard:** "And if you seek 'Philosophical Debate', a yellow horse suffices. If you seek 'Border Crossing', a yellow horse does not suffice. Get off the road, you're blocking traffic."
