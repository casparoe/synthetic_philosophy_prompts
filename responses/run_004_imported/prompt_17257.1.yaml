prompt: |-
  I'm the student representative on my high school's Honor Council. The administration wants to start citing a commercial AI-writing detector -- sold to teachers as fully transparent -- in honor-code hearings: for each flagged essay, the same system that produces a percentage score also generates a paragraph explaining which stylistic cues supposedly gave it away. We have no independent way to confirm whether an essay was actually AI-written, and some students have noticed that lightly hand-editing a draft lowers the score. Several council members treat the explanations as solid evidence on their own; others are uneasy but can't say why. Draft the short memo I'll bring to our next meeting recommending we adopt, reject, or conditionally adopt the tool as evidence, with reasons the first group would have to engage with, and a fair statement of what's right about their view.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the High School Honor Council.
      *   **Audience:** Fellow Honor Council members (students) and potentially the Administration (though the memo is for the *meeting*).
      *   **Topic:** Whether to accept a commercial AI-writing detector (with "explanations") as evidence in honor-code hearings.
      *   **Key Facts:**
          *   Admin claims the tool is "fully transparent."
          *   Tool gives a % score + a paragraph explaining stylistic cues.
          *   No independent way to verify AI authorship (ground truth problem).
          *   Observation: Light hand-editing lowers the score (suggests fragility/gaming).
          *   Council Division: Some see explanations as solid evidence; others are uneasy but lack arguments.
      *   **Goal:** Draft a short memo recommending a stance (Adopt, Reject, or Conditionally Adopt) with reasons that engage the pro-tool group fairly but challenge their assumptions.
      *   **Tone:** Professional, persuasive, balanced, evidence-based, respectful of peer authority.

  2.  **Determine the Recommendation:**
      *   *Adopt:* Dangerous. False positives ruin lives. The "hand-editing" observation proves unreliability.
      *   *Reject:* Ideal for fairness, but might be a non-starter with Admin. Might seem like students are just trying to hide cheating.
      *   *Conditionally Adopt:* The most pragmatic and defensible position. It acknowledges the tool exists but sets strict guardrails. It treats the output as *investigative lead*, not *proof of guilt*.
      *   *Decision:* **Conditionally Adopt (with heavy restrictions).** Specifically: The tool cannot be the *sole* basis for a charge, and the "explanation" paragraph must be treated as speculative, not forensic.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the Admin's proposal.
      *   **Acknowledging the Pro-Tool View (Fairness):** Why do some council members like it?
          *   It offers *something* concrete in a gray area.
          *   The "explanation" feels like reasoning, not just a black box number.
          *   We need tools to maintain academic integrity.
      *   **The Core Argument (The "Why Not" / Risks):**
          *   *The Ground Truth Problem:* We can't prove it *is* AI, so we can't validate the tool's accuracy.
          *   *The "Hand-Editing" Test:* If a human edit changes the verdict, is it detecting AI or just writing style? This undermines reliability.
          *   *The "Explanation" Illusion:* LLMs (the detectors) hallucinate reasons. A confident paragraph $\neq$ factual evidence. It's post-hoc rationalization.
          *   *Due Process:* Burden of proof lies with the accuser. A probabilistic score isn't proof.
      *   **Recommendation:**
          *   Do not use as sole evidence.
          *   Treat "explanations" as hypotheses, not facts.
          *   Require human corroboration (interviews, draft history, etc.).
      *   **Closing:** Call to action/unity.

  4.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Critique:* Is "Conditionally Adopt" too weak?
      *   *Fix:* Make the conditions strict. "Corroborating evidence required" is a high bar.
      *   *Critique:* How to address the "transparent" claim?
      *   *Fix:* Point out that showing *why* it flagged something isn't transparency if the *why* is scientifically unverified. It's "explainable" but not "accurate."
      *   *Tone Check:* Ensure I don't sound like I'm defending cheaters. Focus on *fairness* and *accuracy* for everyone.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be clear. "Recommendation Regarding AI Detection Tool."
      *   *Opening:* Keep it brief.
      *   *Validating the other side:* "I understand why the explanation feature feels like progress..."
      *   *The Pivot:* "However, confidence is not accuracy."
      *   *The "Hand-Editing" point:* This is crucial empirical data we have. Use it.
      *   *Recommendation:* Numbered list for clarity.

  6.  **Final Polish:** Check word count (keep it "short memo" as requested). Ensure the voice sounds like a student leader (respectful but firm). *Self-correction: Make sure to explicitly mention the "burden of proof" concept as it applies to Honor Councils.*

  7.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Recommend stance? Yes (Conditional Rejection/Strict Limitation).
      *   Reasons for first group to engage? Yes (reliability, due process).
      *   Fair statement of their view? Yes (need for tools, transparency feels better).

  *(Self-Correction during drafting)*: I initially thought about saying "Reject." But if the Admin already bought it, "Reject" might be ignored. "Conditionally Adopt" empowers the Council to control *how* it's used. I will frame it as "Adopt only as an investigative lead, never as evidence of guilt." That's a crucial distinction.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Use of AI-Detection Tool in Hearings

  **Purpose**
  This memo outlines my recommendation regarding the administration's proposal to use commercial AI-detection reports—including percentage scores and stylistic explanations—as evidence in honor-code hearings.

  **Acknowledging the Council's Perspective**
  I understand why some members view this tool as an asset. Unlike previous "black box" detectors, this system offers a rationale for its flags. In cases where we lack direct proof of misconduct, having a specific explanation of *why* a text looks suspicious feels like progress. It promises to make our deliberations more objective and less reliant on subjective teacher intuition. We all share the goal of maintaining academic integrity, and ignoring new tools entirely could undermine that mission.

  **Critical Concerns**
  However, treating these reports as substantive evidence poses significant risks to due process and accuracy.

  1.  **The Verification Gap:** We have no independent method to confirm if an essay was actually AI-generated. Without "ground truth," we cannot validate the tool's accuracy. A confident explanation is not the same as a correct one; it is merely a plausible story generated by an algorithm.
  2.  **Fragility of the Score:** Student testing shows that light hand-editing significantly lowers the AI probability score. If a tool penalizes writing style rather than actual origin, it risks flagging non-native English speakers or concise writers while allowing AI text that has been lightly paraphrased to pass.
  3.  **Burden of Proof:** In honor hearings, the burden lies on the administration to prove a violation. A probabilistic score is not proof of action; it is a prediction of likelihood. Using the generated "explanation" as fact reverses the burden, forcing the accused to disprove an algorithm's theory.

  **Recommendation**
  I recommend we **conditionally adopt** the tool under the following strict limitations:

  *   **Investigative Lead Only:** The report may be used to *initiate* an inquiry, but never as sole evidence of a violation.
  *   **Corroboration Required:** A charge cannot proceed without independent corroborating evidence (e.g., version history, draft discrepancies, or admission).
  *   **Explanation Disclaimer:** The stylistic "explanation" paragraph must be treated as speculative hypothesis, not forensic fact. It should not be read aloud as evidence during deliberations.

  **Conclusion**
  We must ensure our process punishes cheating, not writing styles. By treating this tool as a lead rather than a verdict, we protect the integrity of the Council and the rights of the student body. I look forward to discussing this framework at our next meeting.
