      *   **Step 1: Reconstruct the Original Identity Mechanism.**
          *   In Gödel's original system, $Ess(\phi, x)$ implies $\square \forall y (\phi(y) \to \psi(y))$ for *any* $\psi$ such that $\psi(x)$.
