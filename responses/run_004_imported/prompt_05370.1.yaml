      *   In the original argument, $G$ is an essence. An essence $\phi$ of $x$ entails that in any world where $\phi$ is instantiated, the individual instantiating it is *x* (or indiscernible from *x* in a way that implies identity).
      *   Actually, the standard definition of Essence in GOA is: $\phi$ is an essence of $x$ iff $\phi(x)$ and for any property $\psi$, if $x$ has $\psi$, then necessarily, anything having $\phi$ has $\psi$.
      *   If $\phi$ is $G$ (God-like), and $G$ is an essence of $g$, then necessarily, anything that is $G$ has all properties of $g$.
      *   One of the properties of $g$ is $being\_identical\_to\_g$ ($\lambda y. y=g$).
      *   If $G$ necessitates *all* properties (Original), then in any world $w$, if $G(y)$ holds, then $(\lambda z. z=g)(y)$ holds. So $y=g$. Thus, the *same* $g$ exists in all worlds.
