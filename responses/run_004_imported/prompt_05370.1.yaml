          *   New $Ess^*(\phi, x)$: $\phi(x) \land \forall \psi [(P(\psi) \land \psi(x)) \to \square \forall y (\phi(y) \to \psi(y))]$.
      *   *Result:* Sobel's collapse is blocked because $\lambda x. Q$ isn't necessarily positive, so $G$ doesn't necessitate it.

