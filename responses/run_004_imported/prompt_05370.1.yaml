          *   But what about across worlds?
          *   If $g_1$ exists in $w_1$ and $g_2$ exists in $w_2$.
          *   Does $g_2$ have the property "being identical to $g_1$"?
          *   For $g_2$ to have it, that property must be positive.
          *   Is "being identical to $g_1$" positive in $w_2$?
          *   Positivity is usually taken as necessary (Axiom: $P(\phi) \to \square P(\phi)$).
          *   So if $H_{g1}$ is positive, it's necessarily positive.
          *   So $g_2$ must have $H_{g1}$. So $g_2 = g_1$.
          *   *So, if Haecceities are Positive, Transworld Identity holds.*
          *   *The Catch:* Why would "being identical to $g_1$" be a *positive* property (a perfection)?
          *   It seems arbitrary. If we allow arbitrary haecceities to be positive, we trivialize the notion of "positive."
          *   Furthermore, if we allow haecceities to be positive, we might re-introduce collapse or other paradoxes.
          *   But the stronger argument is: The Anderson fix *specifically* restricts the Essence clause to *positive* properties to avoid Sobel's collapse. Sobel's collapse worked because *any* property (including trivial ones like 'such that Q') was necessitated.
          *   If we admit Haecceities as Positive to save Transworld Identity, do we risk re-opening the door to collapse?
