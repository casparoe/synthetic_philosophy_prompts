answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, Cara (a Contextualist) and Ethan (a Pragmatic Encroachment proponent), are reviewing a draft of a paper based on a real-world case of potential wire fraud.*

  **Cara:** So, this case is perfect. The user has the exact same evidence in both scenarios. In the low-stakes imagination, they say, "I know these are the right instructions." In the high-stakes reality, two days before closing, they say, "I don't know." Traditional invariantism says one of those claims is just false. But we both agree invariantism is dead. The question is *why* the truth value flips.

  **Ethan:** Right. And for me, the explanation is straightforward. In the low-stakes scenario, the evidence is sufficient to constitute knowledge. In the high-stakes scenario, the evidence is *insufficient*. The stakes changed the epistemic position itself. Knowledge isn't just about truth and belief and justification; it's about whether you're in a position to act. When six figures are on the line, your previous justification doesn't cut it. You didn't know until you confirmed in person.

  **Cara:** But that's where you're smuggling pragmatics into the semantics of knowledge itself. Look at the case again. The subject's evidence didn't change. The reliability of the email didn't change. What changed was *our* context of attribution. When I'm sitting here chatting about wire fraud abstractly, the standards for "knows" are low. When I'm the one staring at the wiring instruction with $200,000 on the line, the standards for "knows" skyrocket. The word "knows" is context-sensitive, like "tall" or "flat."

  **Ethan:** That's the classic Contextualist move. But it leads straight into the Semantic Blindness objection. If "knows" shifts meaning as wildly as you say depending on the attributor's context, why don't speakers notice? If I say, "The road is flat," and you say, "No, it's not," we understand we're using different standards for "flat." We don't think we're contradicting each other. But in your wire fraud case, when the subject says "I don't know" in the high-stakes moment, they aren't thinking, "Ah, the semantic parameters have shifted." They think they are denying the very same thing they would have affirmed yesterday.

  **Cara:** That's Schiffer's objection, and it's overblown. We navigate context-sensitivity all the time without explicit awareness. If a jockey says a horse is "big" and a basketball coach says a player is "big," they don't stop to analyze the indexical nature of "big." They just talk. The shift in "knows" is similarly implicit. In the high-stakes context, the error possibilities (e.g., "this email is a hack") become salient. To say "I know" is to claim you've ruled out relevant alternatives. In the low-stakes context, the hack isn't a relevant alternative. In the high-stakes context, it is. The subject isn't blind; they're just sensitive to relevance.

  **Ethan:** But relevance is driven by *stakes*, Cara. And that's my point. Why does the hack become a relevant alternative? Because it costs money. You're explaining the shift in meaning by appealing to the shift in practical stakes, but you're refusing to let the stakes do the metaphysical work. You say the *word* changes. I say the *state* changes.

  **Cara:** Because if you let the stakes do the metaphysical work, you run into the Unaware Stakes problem. Suppose the subject is about to wire the money, but unbeknownst to them, the title company is actually under investigation and the stakes are objectively higher than they realize. Or, suppose a spy is listening and will kill them if they wire the money. The stakes are astronomical. On your view, does the subject suddenly lose knowledge because of stakes they are completely unaware of? That severs the link between knowledge and the subject's perspective. It makes knowledge magical.

  **Ethan:** That is the hardest objection, I grant you. But the Encroachment view doesn't require the subject to be consciously thinking about the stakes. It requires that the subject be *in* a high-stakes situation. Knowledge is the norm of practical reasoning. If you act on a proposition, you must know it. If the cost of being wrong is death, the epistemic bar for acting is higher. If the subject is unaware of the spy, they are in a dangerous position. They *shouldn't* act on that belief. So, in a robust sense, they don't know.

  **Cara:** But that feels like you're punishing the subject for bad luck. Their mind is in the exact same state as the low-stakes version. If knowledge is a mental state, as Timothy Williamson argues, how can external stakes change it without changing the mental state? You're making knowledge depend on things outside the head.

  **Ethan:** And you're making knowledge depend on the conversational context of the person *talking* about the head. That seems worse! In the wire fraud case, the subject themselves feels the shift. *They* say, "I can't say I know." They aren't reporting on your conversational context, Cara. They are reporting on their own inability to act. My view explains why the *subject* feels the pressure. Your view says the subject is confused about the semantics of their own self-ascription.

  **Cara:** Not confused. Just operating in a high-standards context. When the subject says, "I don't know," they are correctly reporting that they don't meet the *current* standards of "knows." But here's the rub, Ethan. If we agree on all the facts—that the evidence is constant, that the rationality of action changes, that the assertion is appropriate in one context and not the other—what is left to fight about?

  **Ethan:** The metaphysics of justification.

  **Cara:** Is it? Or is it just where we draw the semantic boundary? Look, we both agree that traditional epistemology was wrong to ignore stakes. We both agree that in the high-stakes scenario, the subject shouldn't wire the money based on that email. We both agree that in the low-stakes scenario, it's fine to say they know. The only disagreement is whether we say the word "knows" changed its meaning (me), or whether the property of knowledge changed its constitution (you).

  **Ethan:** That sounds like a verbal dispute, but it has teeth. If I'm right, then epistemology textbooks are wrong about the nature of justification. Justification isn't purely truth-conducive; it's partly practical. That changes how we teach reasoning. If you're right, epistemology is just linguistics. We're just studying how people use the verb "to know."

  **Cara:** I wouldn't say *just* linguistics. Contextualism explains why we have epistemic disputes at all. But I see your worry. You think if it's merely semantic, then knowledge itself is still this pure, intellectualist thing, and we're just too loose with the label.

  **Ethan:** Exactly. I want to say the world gets into the mind. The risk is part of the justification.

  **Cara:** Okay, let's look at the wire fraud case one more time to settle this. The subject confirms in person, then wires the money. Afterward, they say, "Now I know."
  On your view, the new evidence (in-person confirmation) raised the justification level to meet the high stakes.
  On my view, the new evidence ruled out the salient error possibilities, allowing them to meet the high standards.
  We predict the same behavior. We validate the same assertions.

  **Ethan:** We do. But consider a case where the stakes are high, but the subject *refuses* to acknowledge them. A gambler bets their rent money on a hunch, saying, "I know this horse will win, I don't care what it costs."
  For me, they are wrong. They don't know, because the stakes make their hunch insufficient.
  For you, if their evidence is strong enough for a low-stakes context, and they are in a conversation where stakes aren't salient, you might have to say they "know" relative to that context, even though they are acting recklessly.

  **Cara:** I would say the stakes make the error possibilities salient, which shifts the context. It's hard to have a conversation about betting rent money where the risk isn't salient. So the context shifts automatically.

  **Ethan:** See? You're using stakes to explain the context shift. The stakes are doing the work. The only difference is I say the stakes change the *knowledge*, and you say they change the *label*.
  Maybe the dispute isn't substantive in the sense that we disagree about the world, but it's substantive in that we disagree about *theory choice*. Which framework is more fruitful?

  **Cara:** I can agree to that. Contextualism preserves the idea that knowledge is purely epistemic, which keeps the boundary between "ought to believe" and "ought to act" clean.
  But Encroachment captures the intuition that belief *guides* action. If you can't act on it, in what sense do you have it?

  **Ethan:** So, is it verbal?
  If "substantive" means "do we disagree about whether the subject should wire the money?", then no. It's verbal.
  If "substantive" means "do we disagree about whether practical rationality is a component of epistemic justification?", then yes.

  **Cara:** I think the user's case suggests a synthesis. The user said: *"I found I genuinely couldn't say I knew... even though my evidence hadn't changed."*
  That "couldn't say" is interesting. Is it that they lacked the knowledge, or that asserting knowledge would be misleading?
  If I say "I know" in a high-stakes context, I imply I've checked. Since I haven't checked, saying "I know" is a lie, even if the belief is true and justified by low standards.

  **Ethan:** That's an implicature view. But the user said they *genuinely couldn't say* they knew. It felt like a lack of knowledge, not just a conversational taboo. That phenomenological weight supports Encroachment. The pressure was on their cognitive state, not just their tongue.

  **Cara:** But that phenomenology is exactly what Contextualism predicts when standards rise. When standards rise, previous claims feel false. Think about "empty." A room is empty of furniture. A physicist says, "No, it's full of air." When the physicist is in the room, you feel the claim "The room is empty" is false, even if it was true five minutes ago. You don't think the room changed. You think the standard changed.

  **Ethan:** But the wire fraud case isn't about furniture. It's about risk. The room didn't become dangerous because the physicist entered. The bank account *did* become vulnerable because the closing date approached. The objective risk changed. That supports the idea that the epistemic position is sensitive to the environment, not just the conversation.

  **Cara:** Okay, here is where I will concede a point. If the *objective risk* changes—like the probability of fraud actually increases as the closing date nears because hackers target that window—then the evidence *has* changed, statistically. But the user said the evidence hadn't changed. They meant the email looked the same.
  If the objective probability of error is constant, but the *cost* of error rises, that is pure stakes.
  If I concede that high stakes can make a true, justified belief insufficient for knowledge *even if the error probability is low*, I am an Encroachment theorist.
  I am not willing to concede that. I think if the probability is low enough, you *do* know, even if it's risky to act. You just shouldn't act.

  **Ethan:** And I am not willing to concede that you can "know" something you shouldn't act on. Knowledge is the bridge. If the bridge is out, you don't have a route.
  So, we are at an impasse on the metaphysics. But look at the result. We both tell the homebuyer: "Don't wire the money until you verify."
  We both tell the invariantist: "You're wrong to ignore the stakes."

  **Cara:** So the dispute is substantive regarding the *structure* of epistemology, but perhaps verbal regarding the *extension* of the word "know" in standard cases.
  Actually, maybe that's the settlement. The dispute is substantive about *normativity*, but verbal about *semantics*.
  You think the norm of action is internal to knowledge. I think the norm of assertion is sensitive to context.
  In the wire fraud case, the norm of action said "Wait." The norm of assertion said "Don't claim knowledge."
  We agree on the norms. We disagree on whether "knowledge" is the name of the thing that satisfies the norm (you), or the name of the thing that satisfies the assertion conditions (me).

  **Ethan:** I can live with that. It means we're allies against the pure intellectualists. We both think the user was right to hesitate. We both think the invariantist who says "You always knew, you just got scared" is giving bad advice.

  **Cara:** Agreed. The invariantist tells the homebuyer, "Your evidence was fine, you knew all along." That's dangerous.
  Whether we say "You didn't know" (Ethan) or " 'Knows' requires more now" (Cara), the practical upshot is the same: Treat the high-stakes belief differently.
  So, is it verbal? In the sense that a fight between a metric and imperial engineer is verbal? No, because it changes how you build the theory. But in the sense of whether the homebuyer wires the money? Yes.

  **Ethan:** Then let's write the paper together. We'll present the case, show how both frameworks handle it better than invariantism, and acknowledge that the choice between us might depend on whether you prioritize the metaphysics of justification or the semantics of attribution.

  **Cara:** Deal. But I'm still writing the section on Semantic Blindness.

  **Ethan:** And I'm writing the reply on Unaware Stakes. But I'll admit in the footnote that the homebuyer's hesitation feels more like a loss of state than a shift in vocabulary.

  **Cara:** And I'll admit that the "cost of error" feels like it weighs on the belief itself, not just the sentence.

  **Ethan:** Cheers to that.

  **Cara:** Cheers. Now, about that wire transfer...

  **Ethan:** Verify in person first.

  **Cara:** Obviously. I know that much.

  **Ethan:** *[Smiles]* See? High stakes. You didn't say "I know." You said "I know that much."

  **Cara:** Don't start.
