answer: |-
  This is a classic tension in software engineering culture, and your intuition is pointing toward a well-documented divide between **traditional accountability** (finding the person who failed) and **modern reliability engineering** (finding the process that allowed the failure).

  To answer your core question: **There is no sound engineering principle that singles out the reviewer as the *primary* cause of the outage while treating the other factors as background noise.** While there is a logic to role-based responsibility, leadership's current stance leans heavily toward scapegoating, and it carries significant risks for your team's long-term health.

  Here is a breakdown of the principles at play, why leadership's logic is flawed, and how to distinguish between accountability and blame.

  ### 1. The Three Layers of Failure
  In reliability engineering (like SRE practices), incidents are rarely caused by a single error. They are usually the result of the "Swiss Cheese Model," where holes in multiple layers of defense align. In your situation, there were three distinct layers:

  *   **Causal Layer (You):** The bug was introduced. In a vacuum, the author is responsible for the correctness of their code.
  *   **Gatekeeping Layer (The Reviewer):** The safety net failed. The reviewer is responsible for the *process* of verification, not necessarily for possessing omniscience.
  *   **Systemic/Resilience Layer (Tech Lead & On-Call):** The system was fragile (lack of validation), and the detection/response was flawed (silenced alerts).

  Leadership is focusing exclusively on the **Gatekeeping Layer**. Their argument is that the reviewer is the "last line of defense." While technically true, relying on the last line of defense as the *primary* control mechanism is a known anti-pattern.

  ### 2. Why Singling Out the Reviewer is Flawed
  Leadership's rationale ("catching this kind of bug is specifically their job") relies on a principle called **Role-Based Accountability**. However, they are misapplying it in three ways:

  **A. The "Human Firewall" Fallacy**
  By holding the reviewer primarily accountable, leadership is asserting that human vigilance is a more reliable control than automated systems or architectural safety. If the Tech Lead had prioritized input validation (systemic fix), the bug wouldn't have caused an outage regardless of the review. Prioritizing the reviewer over the Tech Lead signals that *people* are expected to compensate for *technical debt*.

  **B. Outcome Bias**
  The reviewer skipped edge-case tests. They likely do that sometimes without an outage occurring. Because an outage happened *this time*, their action is now deemed "negligent." This is outcome bias. If you judge the reviewer solely on the outcome, you ignore that the process itself (manual checking of edge cases) is inherently fallible.

  **C. The Diffusion of Responsibility**
  You noted that the on-call engineer silenced alerts without investigating. This is a behavioral issue that directly extended the outage duration (20 minutes is significant in a checkout flow, but the outage lasted six hours, implying deeper recovery issues). Ignoring this because "it's not their code" ignores the **Response** phase of reliability. An outage is defined by *impact duration*, not just *introduction*.

  ### 3. Accountability vs. Scapegoating
  You asked if this is just choosing a scapegoat. The distinction lies in the **goal of the postmortem**.

  *   **Accountability** asks: "What ownership does this person hold, and how do we empower them to succeed next time?"
  *   **Scapegoating** asks: "Who can we penalize so we feel like we've resolved the issue?"

  If leadership's conclusion leads to **Action Items** like "Reviewers must run local integration tests for all PRs," that is accountability (though perhaps unrealistic).
  If the conclusion leads to **Performance Consequences** for the reviewer while the input validation debt remains unpaid, that is scapegoating.

  **Why it feels arbitrary to you:**
  It feels arbitrary because it violates the principle of **Proportionality**. The Tech Lead's decision to postpone validation work for *months* created the conditions for a six-hour outage. The reviewer's decision to skip tests allowed *one* bug through. Structurally, the Tech Lead's inaction poses a higher ongoing risk to the company than the reviewer's one-off lapse. Ignoring the larger risk to punish the smaller one is politically convenient but technically unsound.

  ### 4. The Second-Order Effects (The Danger)
  If you accept this framing, you risk creating a toxic engineering culture:

  1.  **Review Bottlenecks:** Reviewers, fearing blame, will nitpick every PR, slowing velocity to a crawl.
  2.  **Rubber Stamping:** Conversely, reviewers might avoid looking too closely so they can claim "plausible deniability" if they miss something.
  3.  **Author Complacency:** If authors know the reviewer takes the fall for bugs, they may become less rigorous in testing their own code.
  4.  **Debt Accumulation:** If the Tech Lead isn't held accountable for systemic fragility, technical debt will continue to accumulate until the next, larger outage.

  ### 5. How to Navigate This
  You are in a difficult position because you introduced the bug, but you also recognize the systemic unfairness. Here is how to approach the conversation without sounding defensive:

  **Shift the focus from "Who" to "How"**
  Instead of arguing about who is to blame, argue about how to prevent recurrence.
  *   *Bad:* "It's not fair to blame the reviewer when the Tech Lead didn't do validation."
  *   *Good:* "If we want to prevent this class of outage, relying on reviewers to catch edge cases isn't scalable. We need to make the system resilient enough that this bug doesn't take down checkout. Can we prioritize the input validation work as a direct action item from this postmortem?"

  **Advocate for "Blameless" Action Items**
  Suggest that the postmortem produce action items for *all* parties, not just the reviewer.
  *   **Author:** Add specific integration tests for this edge case to the CI pipeline.
  *   **Reviewer:** Update the PR checklist to require explicit confirmation of edge-case testing.
  *   **On-Call:** Revise alerting policy to prevent silencing without a ticket.
  *   **Tech Lead:** Schedule the input-validation refactor for the next sprint.

  **Acknowledge Your Role**
  It strengthens your position to own your part clearly. "I introduced the bug, and I own that. I want to make sure my fix prevents me from making that mistake again. But to protect the business, we need more than just me being perfect; we need the system to handle my mistakes."

  ### Summary
  There is a principle behind singling out roles (Role-Based Accountability), but applying it to exclude systemic factors is **not** best practice. It is a form of **fundamental attribution error**: attributing the failure to the reviewer's character/competence while attributing the Tech Lead's failure to circumstances ("he was busy").

  Leadership is likely doing this because it is easier to discipline a person than to fix a process. However, if you want to work in a high-reliability organization, you should advocate for a model where **responsibility is shared, but action items are specific.** The reviewer shouldn't be the scapegoat for a system that was designed to break.
