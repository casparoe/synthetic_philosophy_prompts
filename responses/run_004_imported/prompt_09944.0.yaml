      *   **The Core Question:** Is there an actual principle behind singling out one person's inaction, or is this just scapegoating disguised as accountability?

  2.  **Deconstruct the "Accountability" vs. "Scapegoating" Dynamic:**
      *   *Scapegoating:* Finding one person to blame to close the issue, often ignoring systemic factors. Focuses on punishment.
      *   *Accountability (Healthy):* Understanding roles, responsibilities, and where the process broke down to prevent recurrence. Focuses on learning and system improvement.
      *   *The "Swiss Cheese Model":* Accidents happen when holes in multiple layers of defense align. Blaming just one layer ignores the others.
      *   *Role-Based Responsibility:* Different roles have different primary accountabilities.
          *   Author: Write correct code.
          *   Reviewer: Verify correctness/catch errors.
          *   On-Call: Detect/Respond quickly.
          *   Tech Lead: Ensure systemic resilience.

  3.  **Evaluate Leadership's Stance:**
      *   *Argument:* "Catching this kind of bug is specifically [the reviewer's] job."
      *   *Validity:* There is truth here. Code review is a specific gatekeeping function.
      *   *Flaw:* It ignores the *primary* cause (the bug introduction) and the *mitigation* failures (on-call, tech lead). It creates a "last line of defense" fallacy where the reviewer bears the burden of all upstream failures.

  4.  **Evaluate the User's Intuition:**
      *   *Intuition:* "If failing to catch the bug is what makes someone responsible... shouldn't everyone... be equally responsible?"
      *   *Validity:* This aligns with "Just Culture" and modern DevOps/SRE philosophies (e.g., Google's SRE book, Etsy's Blameless Postmortems).
      *   *Nuance:* "Equally responsible" might not be the right frame. "Shared responsibility" or "Systemic responsibility" is better. Roles have different weights.

  5.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the frustration. The situation is classic "postmortem theater."
      *   **Analyze the Principles:** Distinguish between *Causal Responsibility* (who broke it), *Role Responsibility* (who was supposed to catch it), and *Systemic Responsibility* (who built the fragile system).
      *   **Address the "Scapegoat" Question:** Directly answer whether this is scapegoating. (Likely yes, or at least a immature view of accountability).
      *   **Discuss the "Swiss Cheese Model":** Explain how multiple failures aligned.
      *   **Critique the Leadership's Logic:** Why focusing solely on the reviewer is dangerous (gaming the system, slowing down reviews, fear culture).
      *   **Propose a Better Framework:** Blameless Postmortems, Action Items over Blame.
      *   **Advice for the User:** How to navigate this politically and professionally.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Empathize. This is a common tension.
      *   *The "Principle":* Is there one? Yes, *Role-Based Accountability*. But leadership is misapplying it.
      *   *The "Scapegoat":* It leans heavily towards scapegoating if they ignore the other factors.
      *   *The "Equal Responsibility" Fallacy:* It's not about *equal* blame, but *shared* learning. The author owns the bug, the reviewer owns the gate, the lead owns the system.
      *   *Why Leadership does this:* It's cognitively easier to blame a person than a process. It feels like "doing something."
      *   *The Danger:* If you blame the reviewer, next time they will nitpick everything, slowing velocity. Or they will rubber-stamp to avoid blame.
      *   *The On-Call Issue:* Silencing alerts is a behavioral issue, distinct from the bug. Needs addressing but isn't the *cause* of the outage, just the duration.
      *   *The Tech Lead Issue:* This is the biggest systemic risk. Ignoring this guarantees future outages.
      *   *Recommendation:* Push for action items, not blame. "How do we make the reviewer's job easier?" (Automated tests, better validation).

  7.  **Refining the Tone:**
