      *   Avoid telling the user to rebel, but empower them to advocate for a better process.
      *   Acknowledge the user's own role (they wrote the bug) without letting them off the hook, but contextualizing it.

  8.  **Final Polish:** Check against the specific details (6 hours, 20 mins alert, input validation). Ensure the distinction between *cause* and *contributor* is clear. (Self-Correction: Make sure not to absolve the user completely. They wrote the bug. But the prompt asks about the *distribution* of responsibility regarding the outage severity.)

  9.  **Structure:**
