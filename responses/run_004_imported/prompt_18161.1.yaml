      *   **Tone:** Serious about the tension (don't just make it a cheap joke), say something true about her, warm, 4-5 minutes (approx. 600-800 words spoken at a moderate pace).
      *   **Goal:** Acknowledge the intellectual legacy while celebrating the human being.

  2.  **Deconstruct the Surprise Exam Paradox (for the toast):**
