      *   *The Lesson:* Logic models the world, but it isn't the world. Knowledge isn't just deduction; it's trust, relationship, and presence.
      *   *The Party:* The students tried to pull a "surprise" on the master of surprises. She didn't deduce it. Why? Because she trusts her students.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the irony immediately. Set the scene. Address the room (logicians and non-logicians).
      *   **The Paradox:** Briefly explain it for the non-logicians without getting bogged down. Focus on her specific version (Day 1 lecture + actual quizzes).
