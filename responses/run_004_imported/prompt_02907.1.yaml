  9.  **Final Polish:** Check against the prompt requirements. (Walk through moves, answer 1, 2, 3, connect to contemporary). Looks good.
answer: |-
  This is a fantastic passage to wrestle with. You are absolutely right to feel that Sidgwick is doing something slippery here; in fact, your intuition that he might be "dodging" is shared by a lot of contemporary ethicists. Sidgwick is essentially inventing the problem of supererogation without having the vocabulary for it yet. He is trying to save Common Sense Morality from collapsing into Utilitarianism (which would say "if it's the best act, it's your duty") while avoiding a system where morality is too demanding to be livable.

  Here is a reconstruction of the argumentative moves, followed by answers to your three specific questions.

  ### The Chain of Argument (Step-by-Step)

  1.  **The Phenomenon:** We acknowledge acts of "high virtue" that we praise if done but do not condemn if omitted (the definition of supererogation).
  2.  **The Conflict:** This creates a tension. Intuitively, if you judge an action to be the "most excellent" and it is in your power, it *should* be your strict duty to do it.
  3.  **Constraint 1 (Psychological Power):** Sidgwick asks: Is realizing "Virtue" always in our power?
      *   *Answer:* No. We can't summon "highest courage" at will.
      *   *Interim Conclusion:* Therefore, some acts are beyond duty simply because they are beyond human *capacity*. (Let's call this the **Impossibility Clause**).
  4.  **The Harder Question:** Sidgwick then brackets the Impossibility Clause ("*excluding this margin*"). If an act *is* in our power and is the "best thing," does it coincide with duty?
      *   *Thesis:* Common sense says no (e.g., the rich man giving away his fortune).
      *   *Antithesis:* A moral agent cannot internally say, "This is best, but not required." That sounds like making an excuse.
  5.  **The Resolution:** Sidgwick proposes a distinction between **Objective Duty** (what I ought to do) and **Liability to Blame** (what others can sanction me for).
      *   *Conclusion:* The rich man *ought* to give the money (Objective Duty), but we shouldn't *blame* him if he doesn't (Social Sanction).

  ***

  ### 1. Is he sliding between "Beyond Power" and "Beyond Duty"?

  You have a sharp eye. It looks like a slide, but Sidgwick is actually trying to be precise. He distinguishes them, but he uses the first to protect the second.

  *   **The First Category (The Courage Example):** This is about **capacity**. Sidgwick is upholding the Kantian principle that "Ought implies Can." If a normal person literally *cannot* psychologically muster the heroism of a saint, it cannot be their duty. This clears away the obvious cases where "not duty" just means "impossible."
  *   **The Second Category (The Rich Man Example):** This is about **optionality**. Here, the rich man *can* physically and psychologically give away the money. It is in his power. Yet, Sidgwick argues, it is still not "strict duty."

  **Why distinguish them?** If he didn't distinguish them, a critic could say, "Sidgwick, you're just saying saints are exempt because they are special." By separating them, Sidgwick admits that *some* supererogatory acts are impossible for ordinary folks (courage), but insists that *even for acts that are possible* (charity), we still hesitate to call them duties.

  He isn't sliding; he is peeling an onion. He removes the "impossible" layer first so that the remaining puzzle (the rich man) is purely ethical, not psychological. However, your suspicion is valid: by the end, the "Impossibility" point does a lot of heavy lifting to make the "Rich Man" point seem more palatable.

  ### 2. What is the "Immoral Paradox"?

  The paradox lies in the binding nature of the word **Duty**.

  In Sidgwick's time (and in many systems since), "Duty" is the trump card of morality. If $X$ is your duty, you are *bound* to do it. If you don't, you are morally wrong.
  Now, consider the sentence: *"This is the best thing on the whole for me to do, but yet it is not my duty."*

  *   **Why it's paradoxical:** If morality is about pursuing the Good, and Action A is the *Best* action available, then morality *must* demand Action A. To say "It's the best, but morality doesn't demand it" suggests that morality is indifferent to the Best. It creates a gap between **Value** (this is best) and **Obligation** (you must do this).
  *   **Why it's "Immoral":** Sidgwick suggests that for a "truly moral man," this gap feels like a loophole. It sounds like saying, "I know the perfect moral move, but I've found a rule that lets me play the sub-par move without penalty." It undermines the authority of the moral law. If the "Best" isn't "Duty," then what is Duty? Just "Good Enough"? Sidgwick worries Common Sense can't admit that without morality losing its grip.

  ### 3. Does the "Ought vs. Blame" fix work, or is it a dodge?

  You are right to feel like he is dodging. This is the crux of the critique.

  Sidgwick's solution is to say: **Yes, it is your duty (Ought), but we won't punish you for failing (Blame).**

  *   **How it dissolves the paradox:** It allows him to keep the definition of Duty tight (Duty = The Best Action) while explaining why we don't treat non-saints like criminals. It saves Common Sense from having to admit that morality has "optional" good bits. He essentially says, "There is no supererogation in reality; there is only strict duty that we enforce loosely."
  *   **Why it feels like a dodge:** It relocates the tension from **Metaphysics** to **Sociology**.
      *   The original question was: *Is this act required by morality?*
      *   Sidgwick's answer is: *It is required by morality, but society shouldn't enforce it.*
      *   **The Problem:** This doesn't actually explain why the act feels *optional* to the agent. If I am the rich man, and Sidgwick tells me, "It is your strict duty to give this money, we just won't blame you if you keep it," I still feel the moral pressure of it being a "duty." Supererogation is supposed to feel like *freedom*, not like *getting away with something*.

  By collapsing supererogation into "unenforced duty," Sidgwick kills the phenomenon he is trying to explain. He saves the theory of Duty by sacrificing the reality of Supererogation.

  ### Connection to Contemporary Material (The "Paradox of Supererogation")

  Your prof is right: Sidgwick saw the whole problem coming. This passage is the direct ancestor of what J.O. Urmson calls **"The Paradox of Supererogation"** in his 1958 paper *Saints and Heroes*.

  The paradox Urmson formalizes is exactly what Sidgwick is wrestling with in paragraph 3:
  1.  If an act is the best possible act, it is our duty (Maximizing principle).
  2.  Supererogatory acts are the best possible acts (Saints/Heroes).
  3.  Therefore, Supererogatory acts are Duty.
  4.  But by definition, Supererogatory acts are *not* Duty.
  5.  **Contradiction.**

  **Sidgwick's Move vs. The Modern Move:**
  *   **Sidgwick (1874):** Tries to solve this by splitting **Duty** from **Blame**. (It is duty, but don't blame).
  *   **Urmson/Heyd (1958+):** Solve this by rejecting Premise 1. They argue morality is **satisficing**, not maximizing. You have a duty to do *enough* good, but you are not required to do the *most* good. This leaves room for the "best" acts to be truly optional, not just "unenforced duties."

  **For your response:**
  If you want to impress your prof, point out that Sidgwick's "Ought vs. Blame" distinction is essentially a precursor to the distinction between **Objective Rightness** and **Subjective Blameworthiness**. However, note that modern supererogation theorists (like David Heyd) would argue Sidgwick failed because he didn't allow for acts that are *objectively* optional. Sidgwick makes them objectively required but subjectively unpunished.

  **Summary for your paper:**
  Sidgwick identifies the tension between **Moral Maximization** (do the best) and **Moral Livability** (don't demand too much). He tries to resolve it by keeping the demand high (it's still "duty") but lowering the enforcement (no "blame"). Whether this succeeds depends on whether you think "Duty" is defined by what is *best* or by what can be *reasonably demanded*. Sidgwick wants both; moderns usually pick one.
