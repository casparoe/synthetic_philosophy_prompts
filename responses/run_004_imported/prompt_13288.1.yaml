  2.  **Analyze the Question & Subject Matter (Pasadena Paradox):**
      *   *Context:* Nover & Hájek (2004), "Vexing Expectations".
      *   *Part (a) Setup:* Coin toss until heads ($n$). Payoff $V_n = (-1)^{n+1} \frac{2^n}{n}$. Probability $P_n = 1/2^n$. Expected Value (EV) term: $P_n \times V_n = \frac{1}{2^n} \times (-1)^{n+1} \frac{2^n}{n} = \frac{(-1)^{n+1}}{n}$. Series: $\sum \frac{(-1)^{n+1}}{n} = 1 - 1/2 + 1/3 - \dots = \ln(2)$.
      *   *Part (b) The Problem:* St. Petersburg EV = $+\infty$ (diverges to infinity). Pasadena EV series is *conditionally convergent*. By Riemann Rearrangement Theorem, terms can be reordered to sum to any value. Since the order of summation shouldn't matter for a static gamble (outcomes are simultaneous or unordered sets), the EV is undefined. This is "worse" than St. Petersburg because St. Petersburg has a definite value ($\infty$), whereas Pasadena has *no* definite value.
      *   *Part (c) Altadena:* Payoff $V'_n = V_n + 1$. EV series: $\sum (\frac{(-1)^{n+1}}{n} + \frac{1}{2^n})$. The $\sum \frac{1}{2^n}$ part converges absolutely to 1. The $\sum \frac{(-1)^{n+1}}{n}$ part is still conditionally convergent. So Altadena's EV is also undefined. Dominance principle says Altadena > Pasadena. EUT cannot compare them because neither has a defined EV.
      *   *Part (d) Responses:* There are several responses in the literature.
          *   *Nover & Hájek's view:* They present the paradox, they don't necessarily offer a definitive "fix" that is "widely accepted."
          *   *Easwaran (2008):* Proposed "Weak Expectation" (based on Weak Law of Large Numbers). This is a major response.
          *   *Nover & Hájek's later work:* They didn't necessarily refine a "weak expectation" solution themselves as *their* fix. Easwaran is the one associated with Weak Expectation. Nover & Hájek mostly highlighted the problem. Some later work by Hájek discusses it, but attributing the "Weak Expectation" solution specifically to Nover & Hájek as *their* proposed fix that is *now widely accepted* is factually questionable/incorrect.
          *   *Status:* Is Weak Expectation "widely accepted as resolving the paradox"? No. It's a prominent proposal, but highly debated (e.g., issues with non-i.i.d. cases, or whether it truly solves the normative force). Claiming it is "widely accepted" is an overstatement in a grad seminar context.

