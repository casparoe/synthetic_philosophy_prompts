      *(Self-Correction during drafting)*: Make sure Sam doesn't sound like a group selectionist caricature. He believes in *standard* natural selection acting on individuals in structured populations, not necessarily "group selection" in the Wynne-Edwards sense. It's about the *modeling framework*.
      *(Self-Correction)*: Ensure Andy acknowledges that IF isn't magic. She should admit haplodiploidy isn't the whole story (Boomsma's monogamy hypothesis is the modern IF defense).

  6.  **Final Polish:**
      *   Check the rhythm. Does it sound like spoken language?
      *   Verify the technical claims (e.g., NTW's claim about IF being "limited," the counter-claim about regression coefficients).
      *   Ensure the "bookkeeping" vs. "causality" tension is the climax.

  7.  **Final Review against constraints:**
