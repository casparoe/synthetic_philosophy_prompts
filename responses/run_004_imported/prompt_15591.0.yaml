          *   Discuss "Mesh Theory" (Frankfurt's later work) – do his first-order desires (use) mesh with second-order desires (want to want to quit)? In addiction, they usually don't.
      *   *Nuance on Addiction:* Avoid hard determinism but acknowledge diminished capacity. Responsibility might be graded, not binary.
      *   *Compassionate Conclusion:* Philosophy is a tool, not a gavel. The goal isn't just blame, but understanding agency to help recovery.

  7.  **Refining the Tone:**
