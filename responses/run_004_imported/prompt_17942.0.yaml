answer: |-
  This is a profound lineage to trace. Connecting Sidgwick's ethical desperation to the modern Open Science movement via the replication crisis offers a compelling narrative arc: the idea that the tools we now use to police bias were forged, in part, by a man terrified that his own moral needs were contaminating his data.

  To answer your request, I have reconstructed Sidgwick's likely adjudication of the Bem affair based on his writings (particularly *The Methods of Ethics*, his letters, and his SPR Presidential Addresses), followed by a pastiche of his voice to illustrate the tone of his judgment.

  ### The Sidgwickian Adjudication of "Feeling the Future"

  If Henry Sidgwick were to review Daryl Bem's 2011 paper, he would not approach it as a debunker, nor as a believer. He would approach it as a moral philosopher confronting a threat to the integrity of scientific testimony. His judgment would likely rest on three pillars derived from his SPR tenure: the problem of *a priori* improbability, the fallibility of the observer's unconscious, and the ethical necessity of negative results.

  **1. The Intuitive Bayesian Critique**
  Sidgwick would not have the formal machinery of Wagenmakers' Bayes Factors, but he possessed a rigorous grasp of probability and logic. In the SPR's *Census of Hallucinations*, Sidgwick was obsessed with establishing a baseline of "chance" to measure against reported phenomena. He understood that for an event to be evidentiary, it must not only be statistically distinct from noise but also distinct from the known errors of human testimony.

  Sidgwick would immediately identify the "prior probability" problem. In his *Presidential Address* (1882), he warned that "the weight of evidence required... must be proportioned to the strangeness of the fact." Bem's claim—that the arrow of time is reversible at the cognitive level—is stranger than telepathy or ghosts, which the SPR investigated. Sidgwick would argue that a *p*-value of .05, standard in social psychology, is a threshold for mundane effects (e.g., priming), not for violations of causal structure. He would intuitively agree with Wagenmakers: the statistical evidence is being asked to carry a weight it cannot support without a stronger prior foundation. He would view the reliance on NHST alone as a category error, mistaking "unlikely under the null" for "likely to be true."

  **2. NHST as a Trap of Unconscious Bias**
  Sidgwick's life was defined by the "dualism of practical reason"—the fear that his desire for a moral universe (and immortality) was biasing his inquiry. This made him uniquely sensitive to *unconscious* fraud. He would look at Bem's "researcher degrees of freedom" (the ability to stop data collection early, choose specific covariates, etc.) and recognize it not as malice, but as the very "wish-fulfillment" he feared in himself.

  Sidgwick would argue that standard NHST, as practiced in 2011, provided a perfect architecture for self-deception. It allowed the researcher to remain "honest" while unconsciously steering the analysis toward significance. Having spent decades sifting SPR data for "leakage" and sensory cues, Sidgwick would view the lack of preregistration in Bem's study as a fatal flaw. He would see preregistration not merely as a bureaucratic fix, but as an ethical imperative—a way to bind the investigator against their own hopes, much like he bound himself to rigorous skepticism to protect the SPR's reputation.

  **3. The Vindication of Failure**
  Perhaps most strikingly, Sidgwick would not view the replication crisis as a scandal, but as a maturation. The SPR was often mocked for finding little; Sidgwick wore this as a badge of honor. He believed that clearing away error was a positive contribution to knowledge. When the Bem replications failed, Sidgwick would not see a defeat for psychology, but a triumph of the scientific conscience.

  He would find a deep, ironic satisfaction in the fact that a parapsychological claim forced mainstream psychology to adopt the very skepticism the SPR had practiced for a century. He might note that psychology had to "become psychical" (in the sense of scrutinizing the observer's mind and the fragility of data) to save itself. The reform of statistical practice would strike him as the "residue of fact" remaining after the error was burned away.

  ***

  ### A Speculative Passage: Sidgwick on the Bem Affair
  *(Written in the register of his SPR Presidential Addresses, c. 1890, applied to the 2011 context)*

  > "It is a circumstance of no small gravity, when a claim is advanced which, if established, must alter the very foundations upon which we rest our conception of natural law. In the matter of the recent experiments concerning the precognition of future stimuli, we find ourselves confronted not merely by a novel phenomenon, but by a temptation to credulity that strikes at the heart of the scientific conscience.
  >
  > I have long maintained that the desire for a particular truth is the most insidious enemy of its discovery. In my own inquiries into the evidence for survival, I have been perpetually haunted by the suspicion that my moral necessities were coloring my interpretation of testimony. How much more must this danger prevail when the methods of inquiry themselves are pliable to the will of the investigator? If the rules of analysis permit the researcher to select, after the fact, those portions of the data which accord with the desired end, then we are not measuring nature; we are measuring the capacity of the human mind to find pattern in chaos.
  >
  > The statistical tests employed in this modern instance are confessedly routine, designed for the detection of common variations in human conduct. To apply them to a claim that defies the sequence of cause and effect is to employ a ruler meant for cloth to measure the distance of stars. The margin of error in the instrument is vast compared to the improbability of the thing measured.
  >
  > Let us not lament that subsequent attempts to reproduce these results have failed. There is a false charity in science that seeks to preserve every preliminary finding for fear of discouraging inquiry. True charity lies in the rigorous protection of the truth against the encroachments of hope. If this episode serves to compel the psychological sciences to bind their hands against their own unconscious biases—to preregister their intentions and demand of extraordinary claims a weight of evidence proportionate to their strangeness—then the labor of these recent years has not been in vain. We have not proven the future can be felt; but we have, perhaps, proven that the present can be scrutinized with greater honesty."

  ***

  ### Implications for Your Piece

  For your long-form narrative, this connection offers a few potent thematic threads:

  1.  **The Ethics of Methodology:** Sidgwick frames methodology not as technical hygiene, but as moral defense. Preregistration and Bayesian analysis become tools to combat the "dualism of practical reason."
  2.  **The Outsider's Legacy:** The SPR was marginalized, yet their core anxiety (that human bias contaminates data) eventually consumed the mainstream. The "fringe" saved the "center."
  3.  **The Role of Negative Results:** Sidgwick's willingness to die "satisfied of remarkably little" is the antidote to the publish-or-perish culture that enabled Bem. The replication crisis is essentially the field learning to accept Sidgwickian null results.

  Sidgwick would likely view the modern replication movement as the institutionalization of his own personal torment: a system designed to ensure that no scientist has to fight the battle against their own wishful thinking alone.
