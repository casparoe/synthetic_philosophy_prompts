      *   In **Path B**, the second update on $E$ has to work even harder because the first update on $F$ pulled $E$'s probability down (from $0.3$ to $1/3 \approx 0.33$). The scaling factor is larger ($1.5$).

  Because the scaling factors applied to the intersection ($w_1$) differ depending on the order, the final probability diverges.
