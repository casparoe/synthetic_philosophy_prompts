  *(Self-Correction Note during drafting the ending)*: Make sure they don't just agree to disagree. Make it feel like the problem itself is the antagonist they are both fighting.

  7.  **Final Polish:** Check for flow and clarity. Ensure the transition from the 14-year-old girl case to the IVF case is smooth. (The prompt mentions the journalist was surprised by this link, so the characters should acknowledge that link).

  *(Drafting thought)*: I should make sure Elias doesn't sound *evil*. He's a deontologist of a certain stripe or a strict consequentialist who respects the identity constraint. Let's make him a strict Person-Affecting Utilitarian. Mara is more of a Pluralist or Impersonal Utilitarian.

