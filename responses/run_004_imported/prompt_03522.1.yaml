answer: |-
  **Setting:** *The lounge of the Marriott near the convention center. 11:30 PM. The hum of a dozen post-panel conversations competes with the jazz playlist. Empty plates and half-finished drinks clutter the small table.*

  **Characters:**
  *   **ELIAS:** 50s. Wears a rumpled blazer. A strict adherent to the Person-Affecting View. Calm, almost weary.
  *   **MARA:** 40s. Sharp eyes, still wearing her conference badge. Defends the "Common-Sense" intuition but struggles with the metaphysics.

  ***

  **MARA:** You let him off the hook too easy in the Q&A. The guy from the fertility clinic. He was basically selling eugenics by spreadsheet.

  **ELIAS:** (Swirling his scotch) I didn't let him off. I just pointed out that his marketing department is better at ethics than his legal team. But you're angry about the screening. The polygenic risk scores.

  **MARA:** I'm angry that we're treating embryos like draft picks. But here's the thing, Elias. When I tried to pin him on the harm principle, he parried with Parfit. He said, "If we implant Embryo A, who has a high risk for Type 2 Diabetes, that child will still have a life worth living. If we implanted Embryo B, *that* would be a different person. So Embryo A isn't harmed by being chosen."

  **ELIAS:** And technically, he's right.

  **MARA:** (Slams her glass down softly) Technically? It's morally grotesque.

  **ELIAS:** It's the Non-Identity Problem, Mara. We've been chewing on this for forty years. If the choice determines *who* exists, you can't say the resulting person was harmed by the choice, provided their life is worth living. The alternative for Child A wasn't "being healthy." It was "never existing."

  **MARA:** That's the loophole. It's a get-out-of-jail-free card for bad parenting. If I knowingly pass on Huntington's because I didn't want to screen, and my kid suffers, you're telling me I haven't wronged *them*?

  **ELIAS:** You haven't wronged *them*. You might have wronged the world. You might have wronged yourself. But you haven't made *that specific child* worse off than they otherwise would have been. The Person-Affecting View is clear: Morality is about how we treat people. If there is no victim who is worse off, there is no crime.

  **MARA:** So if I drink and smoke during pregnancy, and my kid is born with fetal alcohol syndrome, but still enjoys their life overall... I've done nothing wrong?

  **ELIAS:** In that case, the identity of the child is usually fixed before the damage occurs. The egg and sperm are already united. So yes, that's a standard harm case. But with IVF selection? You're choosing between possible people. Child A vs. Child B. If Child A has a life worth living, Child A has no complaint.

  **MARA:** That implies morality vanishes whenever identity is variable. That can't be right. It implies that if a government decides to dump nuclear waste that won't leak for a century, they haven't wronged the future people who get cancer.

  **ELIAS:** Parfit's radioactive waste case. Exactly. Because the policy changes social conditions, which changes who meets whom, which changes which sperm hits which egg. The people born with cancer wouldn't have existed under the safe policy. So they aren't worse off than their alternative.

  **MARA:** And you're comfortable with that?

  **ELIAS:** I'm comfortable with the logic. I'm not comfortable with the conclusion. But I'd rather accept a weird conclusion than abandon the idea that "wronging" requires a "victim." If you drop that, what are you grounding morality on?

  **MARA:** On the quality of the outcome. Impersonally. It is worse for there to be a person in pain than a person in health, regardless of *which* person it is. We have a duty to bring about the better state of affairs. Call it the "Same Number Quality Claim." If we can have Child B (healthy) instead of Child A (sick), and it's the same number of children, we ought to choose B.

  **ELIAS:** Ah, the Impersonal View. Now you're in trouble.

  **MARA:** Why?

  **ELIAS:** Because if morality is just about maximizing good states of affairs, you lose the Procreative Asymmetry.

  **MARA:** (Sighs) I knew you'd go there.

  **ELIAS:** Walk me through it. You say we have a duty to create the healthy child over the sick one. Fine. But do we have a duty to create the *happy* child over the *non-existent* one? If I choose to remain childless, am I wronging the happy child I didn't create?

  **MARA:** No. There's no duty to procreate.

  **ELIAS:** But why? If the metric is "maximize good states of affairs," a happy person is a good state of affairs. A non-existent person is neutral. If you can add happiness without subtracting anything, the Impersonal View says you *must*. You're on a treadmill of forced breeding until the resources run out.

  **MARA:** I can distinguish the cases. Suffering is bad, so we have a reason to avoid creating it. Happiness is good, but it's not *required*. It's an asymmetry.

  **ELIAS:** It's ad hoc, Mara. It's a bandage. You want the asymmetry to save common sense, but you want the Impersonal View to solve Non-Identity. You can't have both without a theoretical engine to explain why "bad" counts impersonally but "good" doesn't.

  **MARA:** Maybe the engine is rights. The sick child has a right to a decent start that the happy non-existent child doesn't have.

  **ELIAS:** Rights for whom? The possible child? Possible people don't have rights. If they did, we'd be violating millions of rights every time we don't have sex. Look, I'm not saying the clinic guy is a saint. But if you want to condemn him, you have to accept that you're judging the *world*, not the *child*.

  **MARA:** Isn't that enough?

  **ELIAS:** Is it? If I choose to deplete resources, leaving a future generation with a lower quality of life, but they still have lives worth living... and you say "That's wrong impersonally"... then you open the door to the Repugnant Conclusion.

  **MARA:** (Rubbing her temples) Here we go.

  **ELIAS:** It's the same math. If you care about total impersonal value, then a world with ten billion people whose lives are barely worth living is better than a world with ten million people who are ecstatic. Because the sum total of happiness is higher in the massive population.

  **MARA:** I reject the Repugnant Conclusion. Just like I reject the Non-Identity loophole.

  **ELIAS:** You can't just reject them. They're the bookends of your position. To avoid the Repugnant Conclusion, you usually need to average utility or prioritize specific people. But if you prioritize specific people, you fall back into the Person-Affecting View, and the Non-Identity Problem eats you alive. You're stuck in the middle.

  **MARA:** I'm not stuck. I think the mistake is thinking "harm" is the only metric for "wrong."

  **ELIAS:** What's the other one?

  **MARA:** Beneficence. Procreative Beneficence. When you decide to bring someone into existence, you enter a relationship with them. That relationship carries obligations. One of those obligations is to give them the best start you can, *ceteris paribus*. If you choose the embryo with the genetic predisposition for schizophrenia when you could have chosen the one without, you've violated the duty of the parent.

  **ELIAS:** But the duty is to *whom*?

  **MARA:** To the child who exists!

  **ELIAS:** But the child who exists *owes* their existence to the violation. If you'd fulfilled the duty, *they* wouldn't be here. You're saying, "I owe you a better start," and the child says, "But if you'd given me a better start, I'd be someone else."

  **MARA:** It's not about the comparison to the alternative person. It's about the comparison to a standard of care. We don't ask a surgeon, "Would the patient be dead otherwise?" We ask, "Did you meet the standard of care?"

  **ELIAS:** But surgery is on an existing patient. Procreation is creating the patient. The analogy breaks. If I build a house, and I use cheap wood, and the house stands but leaks... I've built a bad house. But if I build a house that *only* stands because I used cheap wood, and using good wood would have meant building a *different* house on a different plot... who do I owe the good wood to?

  **MARA:** You owe it to the future inhabitant.

  **ELIAS:** But the future inhabitant is contingent on the cheap wood!

  **MARA:** (Pauses, takes a sip of wine) Okay. Let's go back to the IVF clinic. The journalist writing this piece... she's worried about the slippery slope. First it's diabetes risk. Then it's height. Then it's IQ. If you're right, Elias, there's no ethical brake on that. As long as the kid is happy to be alive, the parents can design them however they want.

  **ELIAS:** That *is* the logical conclusion of the Person-Affecting View, yes.

  **MARA:** That's terrifying. It turns children into products.

  **ELIAS:** Or, it acknowledges that children are distinct people, not projects. If you say parents have a duty to maximize their child's potential traits, you're putting an immense burden on procreation. Every time you have a kid naturally, you're rolling the dice. You might have rolled for a higher IQ if you'd used IVF. Are natural parents immoral for not screening?

  **MARA:** There's a difference between avoiding disease and enhancing traits.

  **ELIAS:** Is there? Where's the line? Is preventing myopia enhancement? Is preventing a 5% risk of diabetes enhancement? If the logic is "choose the better embryo," the slope is already slippery.

  **MARA:** The line is harm. Disease causes harm. Low IQ isn't necessarily harm, it's just... less capacity.

  **ELIAS:** But we're back to Non-Identity. The "low IQ" child isn't harmed by being created, unless their life is not worth living. If their life is worth living, and you say you shouldn't have created them because you could have created a "smarter" different person... you're saying some lives are not worth starting compared to others. That's a dangerous game.

  **MARA:** I'm not saying the life isn't worth living. I'm saying the *choice* was wrong.

  **ELIAS:** (Leans forward) This is the impasse, Mara. You want to say the act is wrong without a victim. I say that's incoherent. You want to say we have duties to possible people. I say possible people are metaphysical ghosts.

  **MARA:** And I say your "coherent" theory lets parents gamble with their children's health as long as the dice don't land on "suicide."

  **ELIAS:** And I say your theory demands we breed until the planet bursts, or that we judge parents for not engineering geniuses.

  *(Silence between them. The bartender starts wiping down the counter nearby, signaling last call.)*

  **MARA:** You know what the worst part is?

  **ELIAS:** What?

  **MARA:** Parfit thought the Non-Identity Problem was a bug in our moral theories. He thought we needed to fix the theory.

  **ELIAS:** And?

  **MARA:** Maybe it's not a bug. Maybe it's a feature. Maybe morality *can't* handle creation. We're trying to apply rules designed for interactions between existing agents to the act of bringing agents into being. It's a category error.

  **ELIAS:** So we just shrug? "Morality doesn't apply to reproduction"?

  **MARA:** I'm saying maybe the intuition that the clinic is wrong is correct, but the *reason* isn't about harm, or utility, or identity. It's about... humility. Acknowledging we shouldn't be playing god with the genetic code, regardless of the outcome.

  **ELIAS:** Virtue ethics. The escape hatch.

  **MARA:** Call it what you want. But I'd rather be a muddled virtue ethicist than a hardline Person-Affecting theorist who tells a mother she didn't wrong her sick child.

  **ELIAS:** (Finishes his scotch) And I'd rather be consistent than comforting. If we lie about the logic, we can't solve the real problems. Like resource depletion. Like climate change. If we can't say the future is worse off because they wouldn't exist otherwise, we have no leverage to demand sacrifice now.

  **MARA:** So we're stuck.

  **ELIAS:** We're stuck. The Non-Identity Problem isn't a puzzle to be solved. It's a wall.

  **MARA:** (Signals for the check) Well. At least we agree the bar is closing.

  **ELIAS:** One thing.

  **MARA:** Yeah?

  **ELIAS:** If you had to choose? For your own grandchild? Screen or not?

  **MARA:** (Stands up, grabs her coat) Screen. Every time. Logic be damned. You?

  **ELIAS:** (Puts money on the table) Screen.

  **MARA:** (Smiles faintly) Hypocrite.

  **ELIAS:** Consistent hypocrite. Goodnight, Mara.

  *(Mara walks out into the cool night air. Elias stays at the table for a moment, staring at the melting ice in his glass, before turning to follow.)*
