answer: |-
  This is a sophisticated question that cuts to the heart of a well-known tension in utilitarian political theory: the conflict between strict hedonistic aggregation (counting all pains equally) and liberal conclusions (protecting minorities from majority prejudice). Your friend has identified what later philosophers (like H.L.A. Hart in his debate with Lord Devlin) would call the "moralism" objection to utilitarianism.

  Based on the passage you provided and Bentham's broader work on this subject, here is a reconstruction of his argument, an analysis of whether he excludes or prices in antipathy, and an evaluation of whether this successfully blocks your friend's worry.

  ### 1. Reconstructing Bentham's Argument

  In this passage, Bentham is making two distinct moves, which correspond to the two interpretations you are weighing. They are not mutually exclusive; rather, they function as a pincer movement against the use of antipathy as a legal ground.

  **Move A: The *Reductio ad Absurdum* (The Heresy/Moors/Jews Analogy)**
  *   **The Claim:** If "antipathy" (disgust/dislike) is accepted as a *sufficient ground* for punishment, there is no logical limit to state tyranny.
  *   **The Logic:** Bentham argues that antipathy is subjective and culturally contingent. A Protestant dislikes a heretic; a Spaniard dislikes a Moor; a Portuguese dislike a Jew. If the intensity of the majority's dislike justifies punishment, then the burning of Moors and Jews is just as "utilitarian" as the punishment of paederasts, provided the majority feels strongly enough.
  *   **The Goal:** To show that antipathy is an arbitrary standard. By invoking the burning of Jews and Moors (acts his English readers would view as barbaric), he forces them to admit that *intensity of feeling* cannot be the sole criterion for justice. This suggests a normative constraint on the calculus: not all pains count as *political* grievances.

  **Move B: The Redundancy/Double-Counting Argument**
  *   **The Claim:** Antipathy already inflicts pain without state intervention ("draws with it in course... a very galling punishment").
  *   **The Logic:** Social stigma, ostracism, and shame are themselves punishments. Bentham notes this punishment scales with the intensity of the antipathy ("heavier the greater the number of persons...").
  *   **The Goal:** To argue that adding *legal* punishment on top of *social* punishment is inefficient and excessive. If the actor is already suffering due to public opinion, adding penal sanctions creates new pain (imprisonment, fines, execution) without necessarily reducing the original pain (the public's disgust). In fact, it might increase the total pain in the system.

  ### 2. Exclusion vs. Pricing In: Which is it?

  You asked whether Bentham means to exclude antipathy-based pain from the calculus or whether he thinks it is already "priced in."

  **The answer is: He does both, but at different levels of analysis.**

  1.  **Regarding the Spectators (The Disgusted Majority):** Bentham effectively **excludes** their pain from the *political* calculus. In Move A, he argues that satisfying the "pleasure" of the majority (by removing the object of their disgust) is illegitimate if the ground is merely antipathy. He treats this pain as based on "prejudice" rather than "mischief." For Bentham, a pain must arise from a secular harm (damage to person, property, or reputation) to warrant state action, not from a violation of taste or moral sentiment.
  2.  **Regarding the Actor (The Paederast):** Bentham **prices in** the pain they suffer from antipathy. In Move B, he acknowledges that the actor is already suffering a "galling punishment" via social stigma. He counts this as a negative utility that the actor endures.

  **Why this distinction matters:**
  If Bentham counted the majority's disgust as a valid pain *and* counted the minority's suffering from legal punishment, your friend's arithmetic could win. By arguing that the majority's disgust is not a valid *ground* for law (Move A), Bentham removes that variable from the equation of *legal justification*. By acknowledging the social pain the actor suffers (Move B), he argues that the state need not add to it.

  ### 3. Does This Block Your Friend's Worry?

  Your friend's position is that a *consistent* hedonistic utilitarian must count the disgust. Does Bentham's argument block this?

  **Strictly speaking: No.**
  If we adhere to a pure, act-utilitarian calculus where "pain is pain" regardless of source, your friend is correct. If 1,000 people feel intense nausea and psychological distress at the knowledge that a private act is occurring, and that distress aggregates to a higher number than the pleasure the 2 participants derive plus the pain they would suffer from punishment, the calculus favors suppression. Bentham does not mathematically prove that the pain of disgust is *always* less than the pain of punishment.

  **Politically/Principally: Yes (via Rule-Utilitarianism).**
  Bentham's argument in this passage is actually a proto-**Rule-Utilitarian** or **Constitutional** argument. He is not calculating the specific utility of punishing *this* paederast; he is calculating the utility of having a *rule* that allows antipathy to dictate law.

  *   **The Security Argument:** Elsewhere in his writings, Bentham argues that if the law allows punishment based on antipathy, no one has "security." Any minority could become the target if public opinion shifts (as per the Heresy/Moor analogy). The long-term pain of living in a society where law is capricious and based on prejudice outweighs the short-term pain of the majority's disgust.
  *   **The Irrationality of Antipathy:** Bentham often classifies antipathy as a "false alarm." He suggests that the pain of disgust is based on error or conditioning. While a strict hedonist might say "pain is pain even if based on error," Bentham the reformer argues the state should not cater to errors.

  ### 4. Conclusion: Relocating the Problem

  You asked if Bentham just relocates the problem. In a way, he does.

  He relocates the problem from the **arithmetic of the specific act** to the **principles of legislation.**
  *   **Your Friend's View:** Focuses on the *act* (Does this specific instance of paederasty cause more pain than pleasure, including disgust?).
  *   **Bentham's View:** Focuses on the *rule* (Does allowing "antipathy" as a justification cause more pain than pleasure in the long run?).

  Bentham's answer to your friend would likely be: *"You are calculating the utility of a single punishment. I am calculating the utility of a legal system. If we admit antipathy as a ground, we invite the Inquisition. The pain of the Inquisition outweighs the pain of the public's disgust."*

  However, critics (like your friend) would retort that this is a evasion. If the public's disgust is genuinely painful to them, and the "Inquisition" scenario is hypothetical, a strict act-utilitarian should still satisfy the majority. Bentham saves his liberal conclusion not by perfect arithmetic, but by insisting that **prejudicial pain is not a legitimate political currency.** He is effectively arguing that for the calculus to work *properly*, we must filter out inputs that are based on irrational prejudice, otherwise the "felicific" calculus becomes a "tyrannic" calculus.

  So, you can tell your friend: Bentham doesn't solve the mathematical problem; he dissolves it by arguing that democratic prejudice shouldn't be allowed to enter the equation in the first place. Whether that is "consistent" with hedonism is the very debate your friend has stumbled upon, one that continues in political philosophy to this day.
