      *   *Nuance:* In the specific quote, the "galling punishment" line suggests he *does* count the pain of the actor (from social stigma). But he argues the *spectators'* pain (the disgust) shouldn't trigger *state* punishment. Why? Because the spectators' pain is based on "prejudice" (implied).
      *   *Key Distinction:* Bentham distinguishes between pain arising from the act itself (primary mischief) and pain arising from *opinion* about the act (secondary mischief/reflexive). He often argues the latter shouldn't drive law.
