  3.  **Identify the "Middle Ground" (The Coherent Third Option):**
      *   The middle ground is **Professional Boundaries + Systemic Mitigation + Validated Emotions.**
      *   It is logically consistent to hold two truths:
          1.  Dave is suffering and deserves compassion (Human Truth).
          2.  Dave's performance is impacting the business and my well-being, which is unacceptable (Professional Truth).
