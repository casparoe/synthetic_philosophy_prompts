answer: |-
  **Setting:** *A coffee shop, Sunday morning. The remnants of a bagel sit between ELIAS and MARA. The air is still slightly thick with the residue of last night's dinner party.*

  **MARA:** You're still doing that thing with your jaw. You're grinding your teeth.

  **ELIAS:** I'm chewing a bagel.

  **MARA:** You're chewing on Theo's argument. Admit it. You think he was full of it.

  **ELIAS:** I think Theo read *The Logic of Scientific Discovery* once, highlighted the margins in yellow, and decided he's now Karl Popper reincarnated. Natural selection isn't a tautology. That charge was retired forty years ago.

  **MARA:** Retired by whom? Biologists who don't like being told their life's work is "metaphysical"? Look, the logic holds. "Survival of the fittest." Define fitness.

  **ELIAS:** Reproductive success relative to a specific environment.

  **MARA:** Exactly. So how do you measure reproductive success?

  **ELIAS:** By counting offspring.

  **MARA:** *After* the fact. So the statement becomes: "Those who leave the most offspring leave the most offspring." That is a tautology. It's true by definition, which means it can't be false. And if it can't be false, it's not science. It's a slogan in a lab coat.

  **ELIAS:** That's the strawman version. Fitness isn't *just* a count of offspring. It's a predictive property based on traits. We can measure camouflage efficiency, metabolic rate, thermal tolerance *before* the organism reproduces. We can model which traits confer an advantage in a specific environment. If a population with trait A doesn't out-reproduce trait B in Environment X, the theory takes a hit.

  **MARA:** But does it ever actually take that hit? Or do you just adjust the auxiliary hypotheses? Say, "Oh, we didn't account for sexual selection," or "There must be a genetic linkage we missed." That was Popper's real worry. Not that you can't test specific claims, but that the *core mechanism* is insulated from refutation. He called it a "metaphysical research programme." He didn't say it was nonsense; he said it was a framework for generating theories, not a theory itself.

  **ELIAS:** And then he walked that back. In 1978. He explicitly said, "I have changed my mind about the testability and logical status of the theory of natural selection." He admitted it's falsifiable. Theo is quoting 1974 Popper, not 1978 Popper.

  **MARA:** He didn't walk it back fully, Elias. He said it was *testable*, but he maintained the distinction. The *principle* of natural selection is hard to isolate. When a prediction fails, you don't blame natural selection. You blame the model of the environment, or the genetic mapping. The "Hard Core" of the programme remains untouched. That's the post-hoc worry Theo was banging on about. In practice, fitness is often assigned retrospectively. We see who survived, *then* we declare them the fittest, and *then* we invent a reason why.

  **ELIAS:** That's bad evolutionary biology. That's "Just-So Stories." But good evolutionary biology makes prospective predictions. Antibiotic resistance. We know the mechanism. We know the selection pressure. We predict the bacteria will evolve beta-lactamase. They do. If they didn't, if they just died out or evolved wings, the theory would be in trouble.

  **MARA:** That tests the mechanism of mutation and selection in a micro-environment. It doesn't test the grand claim that *all* complex adaptation arises this way. But fine, let's grant you the micro. My point is about the logic of explanation. If I find a trait, and I ask "Why is this here?", and the answer is "Because it increased fitness," and the evidence for increased fitness is "Because it is here"... I'm in a loop.

  **ELIAS:** But we have independent evidence of the "why." The fossil record. Transitional forms. If natural selection were just a flexible tautology, it wouldn't predict the specific order of fossils we find. It wouldn't predict that we won't find rabbit fossils in the Precambrian.

  **MARA:** That tests common descent, Elias. That's phylogeny. That's different from the *mechanism* of selection. You can accept common descent and still think the explanation for *change* is underdetermined. Popper's point was that natural selection is so powerful it explains everything, and a theory that explains everything explains nothing. If a trait is costly, it's a handicap signal. If it's beneficial, it's an adaptation. If it's neutral, it's drift. How do you falsify a system that has a ready-made bucket for every outcome?

  **ELIAS:** Because we can measure the cost! We can measure the neutrality. We have null models. Genetic drift is the null hypothesis. We test selection *against* drift. If the data fits drift, we reject selection. That is falsification. Pure and simple.

  **MARA:** But who decides when the data fits? The framework dictates the interpretation of the data. Look, I'm not saying evolution is wrong. I'm saying its logical structure is different from, say, Newtonian physics. In physics, if the planet doesn't move where you say, gravity is wrong. In evolution, if the organism doesn't adapt how you say, maybe the "fitness landscape" was more complex than you thought. The theory absorbs the anomaly.

  **ELIAS:** That's true of *any* complex science. If Uranus wobbled, we didn't dump Newton. We posited Neptune. Auxiliary hypotheses are necessary for any mature science. You're holding evolutionary biology to a naive falsificationism that even physics doesn't meet.

  **MARA:** I'm holding it to Popper's falsificationism, which is the gold standard you guys claim to follow. You want the credit for being "hard science," you take the burden of proof. If the definition of fitness relies on the outcome it's supposed to explain, the logic is circular. You can patch it with "independent trait measures," but in the wild, those measures are notoriously hard to isolate. So in practice, the post-hoc reasoning wins.

  **ELIAS:** In practice, we predict viral evolution in real-time. We design vaccines based on it. If the logic were circular, the engineering wouldn't work. You can't build a bridge on a tautology.

  **MARA:** You're conflating the utility of the research programme with the logical status of the core principle. It's useful. It's productive. Popper admitted that. But "productive metaphysics" isn't the same as "falsifiable law." Theo was right about that, even if he was annoying about it.

  **ELIAS:** Theo was using a philosophical critique from the 70s to dismiss empirical work happening right now. It's like saying computers don't work because Baudrillard said the Gulf War didn't happen.

  **MARA:** It's not about whether it works. It's about what kind of knowledge it is. If you can't conceive of a world where natural selection is false, you're not doing science. You're doing theology with better math. Can you describe a world where common descent is true, mutation is true, but natural selection is *not* the primary driver of adaptation?

  **ELIAS:** Yes. A world where genetic drift dominates. Or where mutation pressure dictates direction.

  **MARA:** And how do we know those aren't the actual world?

  **ELIAS:** Because the data shows selection signatures.

  **MARA:** Interpreted through... the framework of natural selection.

  **ELIAS:** *Sighs.* You're impossible.

  **MARA:** I'm just reading the fine print. You want the authority of Science, you have to accept the limits of the logic.

  **ELIAS:** The logic works if you look at the whole system, not just the slogan "survival of the fittest."

  **MARA:** But the slogan is the engine. If the engine is circular, the car doesn't move, no matter how nice the paint job.

  **ELIAS:** The car is moving, Mara. We're riding in it.

  **MARA:** Maybe. Or maybe we're just rolling downhill and calling it propulsion.

  *Elias picks up his coffee. It's cold. He sets it back down without drinking.*

  **ELIAS:** You're not going to let this go, are you?

  **MARA:** Neither are you.

  **ELIAS:** No. I'm not.

  **MARA:** Good. Then pass the cream.
