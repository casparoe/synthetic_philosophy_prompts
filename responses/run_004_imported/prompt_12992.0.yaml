prompt: |-
  Okay so I had a long argument with my friend Theo last night that kind of derailed dinner. He's read way too much Popper and was insisting that natural selection isn't really a falsifiable theory -- "survival of the fittest" just cashes out to "those that survive, survive," so its basically a tautology in a lab coat, which is supposedly why Popper himself once called it a metaphysical research programme rather than a real scientific theory. I said that's an old charge, that modern evolutionary biology obviously generates falsifiable predictions (transitional fossils, molecular phylogenies, real-time selection experiments), and that Popper more or less recanted the tautology thing later anyway. Theo shot back that the recantation wasn't a full retraction -- he thinks there's still something to the original worry, since in a lot of actual evolutionary explanations fitness only gets identified after the fact, once you already know what survived. We never got anywhere.

  Write a dialogue between two characters holding these two positions. I want them equally sharp, neither one a pushover, actually responding to each other's specific points -- the recantation, the after-the-fact fitness worry, the gap between the general framework and the specific testable claims inside it -- instead of talking past each other. Doesn't need a tidy ending.
