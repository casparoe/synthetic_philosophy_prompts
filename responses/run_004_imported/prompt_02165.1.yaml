answer: |-
  **Setting:** *A private study in Rochester, New York. November, 1855. The room is lined with books and stacks of **The North Star**. A fire crackles in the hearth. WILLIAM LLOYD GARRISON, 50, sits in a high-backed chair, his spectacles perched low on his nose, a copy of the Constitution resting on his knee like an unwanted burden. FREDERICK DOUGLASS, 37, stands by the mantle, towering and broad-shouldered, warming his hands.*

  **GARRISON:** You look well, Frederick. Rochester agrees with you. The press runs smooth, I hear.

  **DOUGLASS:** The press runs, William. Whether it runs smooth depends on who is reading the print. I am glad you came. I feared our correspondence had grown too cold for a visit.

  **GARRISON:** Cold? No. Fractured. There is a difference. I come because I love you, and because I despair for you. You have taken a knife to the movement. To tell the colored man that the Constitution is his friend… it is a dangerous opiate.

  **DOUGLASS:** It is not an opiate. It is a weapon. And I am tired of fighting with one hand tied behind my back because you insist the very ground we stand on is hellfire.

  **GARRISON:** *(Taps the document on his knee)* Because it is! You ask me to read this as a charter of liberty. I have read it. I have parsed it. It is a covenant with death and an agreement with hell. You cannot wash the blood from this parchment by wishing it away.

  **DOUGLASS:** I do not wish it away. I read it. Literally. William, open it. Show me the word "slave."

  **GARRISON:** *(Sighs)* We have danced this waltz before. The word is not there. We know this. But the thing is there.

  **DOUGLASS:** If the thing is not named, the power is not granted. That is the first rule of legal interpretation. If the Constitution does not explicitly grant the federal government the power to hold property in man, then that power does not exist. It reserves all ungranted powers to the states or the people. Slavery is a state crime, not a federal institution.

  **GARRISON:** A distinction without a difference! Look at Article I, Section Two. The Apportionment Clause. "Representatives and direct Taxes shall be apportioned among the several States… adding to the whole Number of free Persons, three fifths of all other Persons." Who are these "other Persons"? They are slaves. This clause puts a price on our backs. It incorporates us into the political body as merchandise.

  **DOUGLASS:** I argue the opposite. If the slave is property, as the South claims, why count him at all? Property is not counted for representation in Massachusetts or New York. By counting him as three-fifths of a person, the Constitution acknowledges his humanity. It undermines the property claim. Furthermore, it is a penalty. If they counted the enslaved population as zero, the South would have less representation. If they counted them as whole persons, they would have more. The three-fifths compromise was a discount on their political power, not a bonus.

  **GARRISON:** A discount? Frederick, listen to yourself. It gave the Slave Power a bloc of votes in Congress and the Electoral College that kept them in the President's chair for fifty of the last sixty years. It gave them the Supreme Court. It gave them the Fugitive Slave Act. The *effect* of the clause is to arm the master with the votes of the very men he chains. You cannot argue intent against the bloody reality of the result.

  **DOUGLASS:** The result is corruption, yes. But the corruption lies in the men, not the text. You confuse the Constitution with the government that operates it.

  **GARRISON:** The tree is known by its fruit! And look to Article IV, Section Two. The Fugitive Clause. "No Person held to Service or Labour in one State… escaping into another, shall… be delivered up on Claim of the Party to whom such Service or Labour may be due." It commands the return of the bondman. It makes every citizen in the North a potential slave-catcher. It nationalizes the hunt.

  **DOUGLASS:** It says "delivered up." It does not say *who* must deliver them. It does not grant Congress the power to pass laws to enforce it. That is a state matter. The Fugitive Slave Act of 1850? That is unconstitutional. It denies habeas corpus. It denies trial by jury. It forces federal marshals to do the dirty work. I say we fight the Act by upholding the Constitution! We demand the rights the document guarantees.

  **GARRISON:** *(Leans forward, eyes flashing)* You speak of rights. What right secures the Blessings of Liberty to the man in chains? Look to Article I, Section Nine. "The Migration or Importation of such Persons as any of the States now existing shall think proper to admit, shall not be prohibited by the Congress prior to the Year one thousand eight hundred and eight."

  **DOUGLASS:** And there is your proof of anti-slavery intent.

  **GARRISON:** How in God's name do you reckon that?

  **DOUGLASS:** It sets a deadline. It does not say the trade shall be protected forever. It says Congress *shall* have the power to prohibit it after 1808. It is an expiration date on the traffic of human souls. It looks toward extinction, not permanence.

  **GARRISON:** It guaranteed the trade for twenty years! It bought time for the Deep South to fill their fields with African blood before the pen could stop the ink. It is a truce with evil. And you, Frederick, you want to vote under this truce? You want to swear an oath to support a document that, at its founding, promised the slave trade could continue for two decades?

  **DOUGLASS:** I want to vote because the ballot is power. You say "No Union with Slaveholders." I say, use the Union to crush the slaveholders. If I abandon the Constitution, I abandon the only legal ground I have to demand the federal government protect me. If the Constitution is pro-slavery, then the government has no right to protect my liberty. If it is anti-slavery, then the government has a duty to protect it. Which argument serves the fugitive better?

  **GARRISON:** The argument that keeps the hands clean! If you vote, you endorse the system. You become a member of a government that upholds slavery. I will not stain my soul. I would rather see the Union dissolve tomorrow than have one more day of this compromise. Let the North separate. Let the slave states stand alone as a pariah nation. The moment the North withdraws its support, the system collapses.

  **DOUGLASS:** And what of the slave in Virginia? If the Union dissolves, he is behind a harder wall. A Southern Confederacy would have no Northern abolitionists agitating on its border. No Underground Railroad running through free states. Disunion abandons the slave to his master entirely. It is a counsel of despair.

  **GARRISON:** It is a counsel of purity! You cannot fight fire with fire. You say the word "slave" is absent. I say the silence is a scream. The Framers knew what they were doing. They used euphemisms—"persons," "service," "importation"—because they were ashamed. They knew slavery violated the very principles of '76. By hiding it, they admitted its sinfulness, but by protecting it, they cemented its power. You want to interpret their shame as our liberty.

  **DOUGLASS:** I want to interpret their words as law. If they were ashamed, then the document is ashamed of slavery. We must hold the nation to its own highest promises. The Preamble, William. "To secure the Blessings of Liberty to ourselves and our Posterity." Liberty is the end. Slavery is the accident. We must treat the accident as such.

  **GARRISON:** *(Stands up, pacing)* Accident? It was the foundation! The economy, the politics, the social order. You speak like a lawyer, Frederick. Lysander Spooner's influence, I know. You treat this as a puzzle of syntax. I treat it as a moral crisis. When a house is built on a foundation of rot, you do not argue about the blueprints. You burn it down.

  **DOUGLASS:** And where do the inhabitants go? I am not arguing syntax. I am arguing survival. I was a slave. I know what it is to be outside the law. To be inside the law, even a flawed law, is power. If I stand on the Constitution, I can look the slave-catcher in the eye and say, "You have no authority." If I stand with you, outside the Constitution, I am merely a rebel.

  **GARRISON:** *(Stops pacing, looks at Douglass with deep sadness)* You were my son in the movement. We stood together on the platform. We burned the Constitution together in 1844.

  **DOUGLASS:** I have grown, William. My eyes have opened. I see that you demand a perfection from politics that politics cannot yield. You wait for a pure vessel. I will take the vessel I have and steer it toward the light.

  **GARRISON:** And if the vessel sinks?

  **DOUGLASS:** Then we swim. But I will not sit on the shore and curse the boat while the drowning cry out.

  **GARRISON:** *(Picks up his hat)* You argue that the Constitution is a glorious liberty document. I tell you it is a bill of sale.

  **DOUGLASS:** And I tell you, William, that a bill of sale can be torn up. But only by those who hold the pen. I intend to hold the pen.

  **GARRISON:** *(At the door, turns back)* God grant you are right, Frederick. For if you are wrong, you have led a people into the wolf's den and told them it is a sheepfold.

  **DOUGLASS:** And if you are wrong, William, you have left us outside in the cold with no shelter at all.

  **GARRISON:** *(Nods slowly)* Good day, Frederick.

  **DOUGLASS:** Good day, William.

  *(Garrison exits. Douglass turns back to the fire, staring into the embers. He picks up a quill and dips it into the inkwell.)*
