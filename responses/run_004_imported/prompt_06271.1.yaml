answer: |-
  Here are 10 questions designed to press the speaker on the internal tensions and implications of the Strawsonian view, rather than inviting a summary. The first three address your specific requirements, complete with anticipated replies and follow-ups. The remaining seven cover other common pressure points for Strawsonians.

  ### The Three Required Questions

  **1. The Justification vs. Explanation Gap**
  "Strawson argues that we *cannot* globally abandon the reactive attitudes without ceasing to be human as we know it. But there seems to be a gap between saying we are psychologically stuck with these attitudes and saying they are *normatively justified*. Does 'Freedom and Resentment' actually justify the practices of responsibility, or does it merely offer a naturalistic explanation of why we're unable to escape them? If it's the latter, aren't you committing a naturalistic fallacy?"

  *   **Likely Reply:** She will likely argue that there is no "external" standpoint from which to justify them; the practices *constitute* morality, so asking for an external justification is unintelligible.
  *   **Follow-up:** "If there's no external standpoint, how do we make sense of moral progress where we *do* successfully suppress certain reactive attitudes—for example, ceasing to feel resentment toward certain marginalized groups for perceived slights? If we can criticize and shed *specific* attitudes from within the practice, what blocks the skeptic from criticizing the *whole* practice from a standpoint of, say, compassion or rationality?"

  **2. The Excuse/Exemption Boundary (The Abuse Case)**
  "Consider an agent whose capacity for choice was severely warped by extreme childhood abuse, leading them to harm others. On the Strawsonian view, we either offer an excuse (staying in the participant stance) or an exemption (moving to the objective stance). But in this case, resentment feels appropriate (they made a choice) *and* the objective attitude feels appropriate (they were damaged). Doesn't this case suggest the binary between excuse and exemption is too rigid to handle the reality of shaped agency?"

  *   **Likely Reply:** She will likely focus on the agent's *current* capacity for mutual recognition. If they can understand the moral demand, they are in the participant stance, regardless of their past.
  *   **Follow-up:** "But if their capacity for recognition is itself the product of deterministic causal chains (the abuse), aren't we just pushing the determinism problem back one step? If determinism is supposed to be a red herring, why does the *causal history* of their capacity matter for exemption, but the causal history of their choice doesn't?"

  **3. The Asymmetry of Personal and Vicarious Attitudes**
  "You treat personal reactive attitudes (like resentment) and vicarious ones (like moral indignation) as structurally analogous. But evolutionary and psychological accounts suggest they function differently: resentment is about relationship repair, while indignation often functions as social policing or status signaling. Given that indignation is more prone to moralizing and less tied to actual interpersonal repair, does the vicarious stance really carry the same justificatory weight as the personal one?"

  *   **Likely Reply:** She will likely maintain that both are expressions of a demand for goodwill. The structure is the same even if the intensity or social function differs.
  *   **Follow-up:** "If the structure is identical, why do we permit vicarious attitudes to persist in cases where personal relationships have completely dissolved? Doesn't this allow for a kind of 'mob morality' or online shaming that Strawson wanted to protect us from, where indignation is detached from any possibility of the goodwill it supposedly demands?"

  ***

  ### 7 Additional Challenging Questions

  **4. Moral Progress and Shedding Attitudes**
  "Strawson suggests the reactive attitudes are a permanent framework of human life. Yet, history shows we often view moral progress as the *cultivation* of certain attitudes and the *extinction* of others (e.g., no longer feeling resentment toward blasphemy or certain social transgressions). If the framework is mutable enough to allow for progress, isn't it also mutable enough to allow for the global skepticism the incompatibilist proposes?"

  **5. The Manipulation Argument**
  "If a neuroscientist directly manipulated your brain to make you vote a certain way, we would exempt you from responsibility. But if determinism is true, isn't the difference between manipulation and normal causal determination just a matter of degree? At what precise point does a causal explanation of behavior force us into the objective stance, if not at the level of determinism itself?"

  **6. Reasons vs. Feelings**
  "Strawson grounds responsibility in *feelings* (the attitudes). But in practice, when we hold someone responsible, we appeal to *reasons*. If I feel resentment but you provide a sufficient justification for your action, the reason trumps the feeling. Doesn't this suggest that rational accountability is foundational, and the reactive attitudes are merely the emotional byproducts, rather than the ground of responsibility?"

  **7. The Possibility of the Global Objective Stance**
  "Strawson claims taking the objective stance globally is practically impossible. But contemplative traditions (like Buddhism) and certain philosophical disciplines claim to achieve a state of equanimity that looks very much like a global objective stance. If it is psychologically possible for some people to achieve this, doesn't that undermine the claim that the participant stance is a necessary condition of human life?"

  **8. Punishment and Retributivism**
  "Many legal systems rely on retributive justification for punishment, which seems to lean heavily on the legitimacy of resentment. By validating resentment as the core of responsibility, does the Strawsonian view inadvertently smuggle retributivism back into the legal system, even if Strawson himself might have rejected harsh punishment?"

  **9. The Solitary Agent**
  "Reactive attitudes are inherently interpersonal. But we often feel moral guilt even when no other person is involved (e.g., breaking a promise to oneself or wasting one's own talents). If responsibility is grounded in interpersonal relationships, how does the Strawsonian account explain the moral status of a solitary agent, like Robinson Crusoe?"

  **10. The "Red Herring" Claim**
  "You argue the determinism debate is a red herring because it doesn't change our practices. But if belief in determinism *does* psychologically alter how we view our peers—even slightly—doesn't that make it relevant? If the truth of determinism erodes the *intensity* of our reactive attitudes, hasn't it already impacted the very ground of responsibility you describe?"
