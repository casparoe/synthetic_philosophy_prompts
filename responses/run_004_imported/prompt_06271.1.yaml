prompt: |-
  I'm doing the live Q&A after our philosophy society's invited talk next week -- the speaker's a committed Strawsonian about moral responsibility, thinks the reactive attitudes (resentment, gratitude, guilt) are what responsibility is grounded in rather than any fact about free will, and that the whole determinism debate is basically a red herring. Draft me 8-10 questions that dont just let her restate the view: I want one on whether "Freedom and Resentment" actually justifies the reactive attitudes or just explains why we're stuck with them, one on a hard case where the excuse/exemption line breaks down (somone whose capacity for choice was shaped by extreme abuse, so resentment and the "objective attitude" both seem to apply to them at once), and one on the asymmetry between personal reactive attitudes and the supposedly impartial vicarious ones like indignation -- plus a follow-up for each keyed to the reply she'll probably give.
