      *   **Probability Axioms:** Probabilities of mutually exclusive and exhaustive events must sum to 1 (100%). Here, $P(\text{School}) + P(\text{Other}) = 0.7 + 0.6 = 1.3$. This violates the axioms of probability.
      *   **Coherence:** In Bayesian epistemology and decision theory, a set of beliefs is "coherent" if it doesn't expose the believer to a sure loss (Dutch Book). Jake's beliefs are incoherent.
