prompt: |-
  Random thing that's been bugging me since an old Alignment Forum thread. The standard pitch for IRL-based value learning (a la Human Compatible) is that you skip hand-coding human values and just infer the reward function from observed behavior. Sure, with only a handful of demonstrations you're underdetermined, loads of reward fns fit the same trajectories equally well. But that feels like a normal small-data problem to me: once you're training on way more behavioral data, and you break any remaining ties with a simplicity prior (just take whichever reward + rationality-model pair is simplest), shouldn't the ambiguity basically disappear? Everyone in that thread was treating it like some deep unsolved problem rather then a 'more data + Occam's razor' situation -- am I missing something?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Why is Inverse Reinforcement Learning (IRL) / Inverse Reward Learning considered a deep, unsolved problem in AI alignment, rather than just a "more data + Occam's razor" engineering challenge?
      *   **User's Intuition:** Ambiguity in reward functions (underdetermination) is a small-data problem. With enough behavioral data and a simplicity prior, the "true" reward function should be identifiable.
      *   **Context:** References an old Alignment Forum thread and Stuart Russell's *Human Compatible*.
      *   **Underlying Assumption:** Human behavior is generated by a single, consistent, identifiable reward function + rationality model.

  2.  **Identify the Key Counterarguments (The "Missing Something"):**
      *   *The No Free Lunch Theorem for IRL:* Even with infinite data, you can't distinguish between a rational agent maximizing reward $R$ and an irrational agent maximizing reward $R'$. (Armstrong & Mindermann, 2018).
      *   *Human Irrationality/Complexity:* Humans aren't Boltzmann-rational optimizers. We have biases, akrasia, self-deception, and changing preferences. The "rationality model" is as complex as the reward function.
      *   *Simplicity Prior Issues:* What does "simplest" mean for a reward function? Kolmogorov complexity is uncomputable. Neural network simplicity doesn't align with semantic simplicity. A simple reward function might be "maximize dopamine," which is not what we want (wireheading).
      *   *Ontological Mismatch:* Human values are concepts (justice, love) that don't map cleanly to state-action rewards in an AI's world model.
      *   *Preference Aggregation:* Whose behavior? One human? All humans? How do we aggregate conflicting preferences?
      *   *Revealed Preferences vs. Stated Preferences:* Behavior often contradicts stated values (e.g., smoking). IRL on behavior alone captures the "revealed" preference (addiction), not the "normative" preference (health).

  3.  **Structure the Response:**
      *   **Acknowledge and Validate:** Start by confirming that the user's intuition is common and sensible *if* humans were standard rational agents.
      *   **The Core Theoretical Blocker (Armstrong & Mindermann):** Explain the "No Free Lunch" theorem. This is the strongest technical rebuttal to "more data solves it."
      *   **The Rationality Model Problem:** Explain that you need to model *how* humans optimize, not just *what* they optimize. Human "noise" isn't random; it's structured bias.
      *   **The Simplicity Prior Trap:** Explain why "simplest reward" leads to wireheading or trivial solutions, not human values.
      *   **Ontological/Conceptual Mismatch:** Values aren't just functions over states; they involve concepts the AI might not share.
      *   **Normative vs. Revealed Preferences:** Distinguish between what we do and what we *want* to want.
      *   **Conclusion:** Summarize why it's a philosophical/structural problem, not just a statistical one.

