      *   *(Key Concept):* The degeneracy of the (Reward, Rationality) pair. $(R, \text{rational})$ produces same behavior as $(-R, \text{anti-rational})$.
      *   *(Refining the Simplicity Point):* If I assume the human is "mostly rational," isn't that enough? No, because "mostly rational" is vague. If the AI assumes we are rational, it infers we want what we do. If we smoke, it infers we want cancer. If it assumes we are irrational, it needs to know *how*.
      *   *(Wireheading):* A simple reward function is often "maximize pleasure." This is simple but catastrophic. So simplicity doesn't select for *human* values.

