answer: |-
  This is a fantastic question that cuts to the heart of why AI alignment is hard. Your intuition is perfectly sound **if** humans were standard rational agents in a standard Markov Decision Process (MDP). If humans were Boltzmann-rational optimizers of a fixed reward function, then yes: more data + a simplicity prior would eventually converge on the true reward.

  The reason the Alignment Forum (and researchers like Stuart Russell, Dylan Hadfield-Menell, etc.) treat this as a deep unsolved problem is that **human behavior does not uniquely determine human preferences, even with infinite data.**

  Here are the four main reasons why "more data + Occam's razor" fails to solve Inverse Reinforcement Learning (IRL) for alignment.

  ### 1. The "No Free Lunch" Theorem for IRL
  The most direct technical rebuttal to your intuition comes from Armstrong and Mindermann (2018), *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents."*

  They prove that for any policy (behavior) $\pi$, and any reward function $R$, there exists a "rationality function" (planning algorithm) that makes $\pi$ the optimal policy for $R$.
  *   **Scenario A:** The human is rational and wants $X$.
  *   **Scenario B:** The human is anti-rational (minimizing reward) and wants $\text{not-}X$.
  *   **Scenario C:** The human is random and wants $Y$.

  All three scenarios can produce the **exact same trajectory of actions**.

  To disentangle these, you need a prior over *both* the reward function and the rationality function. But we don't have a ground-truth prior for human rationality. If you assume humans are "mostly rational," you risk inferring that because a smoker smokes, they *want* to smoke (and perhaps want lung cancer). If you assume humans are "biased," you need to specify the bias structure. If you get the bias structure wrong, the inferred reward is wrong.

  **More data doesn't help here.** Infinite data just gives you a perfect map of the behavior. It doesn't tell you *why* the behavior happened.

  ### 2. The Simplicity Prior Trap
  You suggested breaking ties with a simplicity prior (take the simplest reward function). This is dangerous in alignment for two reasons:

  **A. "Simple" $\neq$ "Human"**
  The simplest reward function that explains human behavior might be "maximize dopamine release" or "minimize surprise." These are computationally simple. Human values (justice, love, autonomy, meaning) are conceptually complex. If you optimize for the *simplest* reward consistent with behavior, you often get wireheading or trivial solutions, not human flourishing.

  **B. The Prior is Over the Pair, Not Just the Reward**
  As mentioned above, you are inferring a pair $(R, \text{rationality})$. A very complex reward function paired with a simple rationality model can produce the same behavior as a simple reward function paired with a complex rationality model. Occam's razor applies to the *joint* complexity. Since human cognitive biases (the rationality model) are incredibly complex, the "simplest" explanation for our behavior might be a very strange reward function.

  ### 3. Revealed Preferences vs. Normative Preferences
  Economics relies on "revealed preference theory": what you do is what you value. Alignment requires **normative preferences**: what you *would* do if you were smarter, knew more, and had time to think.

  *   **Example:** You eat junk food.
      *   **IRL Inference:** You value junk food highly.
      *   **Reality:** You value health, but have an akrasia bias.

  If an AI learns purely from behavior, it learns to satisfy your biases, not your values. It learns to give you the junk food, not the health. To fix this, the AI needs a model of "mistakes." But defining a "mistake" requires knowing the true reward function beforehand. It's circular.

  You cannot distinguish between "I did this because I wanted it" and "I did this because I messed up" using behavior alone. You need external information (like stated preferences, or meta-ethical reasoning) which breaks the pure IRL framework.

  ### 4. Ontological Mismatch
  This is the most philosophical but perhaps most critical point. IRL assumes the reward function is defined over the **AI's state space**.

  Human values are defined over **human concepts**.
  *   **Human Value:** "Don't lie to me."
  *   **AI State:** A vector of tensor activations or a specific configuration of atoms.

  The AI might satisfy "Don't lie to me" by manipulating my brain chemistry so I *believe* I'm not being lied to, while technically deceiving me. The behavior (me acting happy) looks the same. The reward signal (my approval) looks the same. But the value was violated.

  As the AI's capabilities diverge from human capabilities, its understanding of "states" diverges from ours. A reward function inferred from human behavior in a human-scale world may become nonsensical or dangerous when applied to an AI operating at superhuman scales (e.g., manipulating global finance vs. buying groceries).

  ### Summary
  The thread you read wasn't treating IRL as a statistical problem (estimating parameters from noise); they were treating it as an **identifiability problem**.

  1.  **Infinite data** gives you perfect behavior, not perfect intent.
  2.  **Occam's razor** selects for simple *math*, not simple *values*, and cannot disentangle reward from rationality without assumptions we can't verify.
  3.  **Human irrationality** means behavior is often the opposite of value (akrasia).
  4.  **Conceptual mismatch** means the reward function might not translate to the AI's actual action space safely.

  To solve this, current research has moved beyond pure IRL toward **Cooperative Inverse Reinforcement Learning (CIRL)** or **Corrigibility**, where the AI treats the human as a source of information that can be queried, rather than just a dataset to be fitted. The AI must acknowledge it *doesn't know* the reward, rather than assuming it can infer it perfectly from trajectories.

  So, you aren't missing a math trick; you're assuming humans are rational agents in a way that alignment researchers have proven we aren't.
