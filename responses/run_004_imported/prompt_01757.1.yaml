  Could you write me an essay that actually walks through, in enough detail that I could reconstruct the reasoning myself, why Gödel's axioms force this modal collapse? And then settle the actual question for me: is that objection fatal to the argument, or is there a decent way to revise the axioms to dodge it (I have some vague memory of someone tweaking the definition of "essence" to get around Sobel's objection, but I might be misremembering) without gutting the parts of the proof that made it interesting in the first place? Please don't just lay out both sides and shrug at the end -- actually tell me whether you think the argument survives in some patched form or is basically dead, and defend that.
