      *   *Pedagogical Note:* I should explicitly mention that this requires mixed welfare. If the universe is all net positive, the sum is $+\infty$ in any order. The paradox arises specifically when there is an infinite amount of good and an infinite amount of bad. This is actually a crucial feature for the seminar (the "Mixed Infinity" problem).
