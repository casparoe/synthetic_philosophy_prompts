answer: |-
  You have stumbled upon one of the oldest and most difficult questions in political philosophy. It is known as the **"Boundary Problem"** (or sometimes the "Constituency Problem"), and your board member has essentially articulated the standard defense of the status quo, while your instinct aligns with the principle of **democratic legitimacy.**

  You are not just having a "feeling." You are identifying a genuine democratic deficit known as **externalities.**

  Here is a breakdown of why your board member is practically right but philosophically incomplete, and how you can find a principled middle ground without needing to redraw the map.

  ### 1. The Two Competing Principles

  To understand why this feels so unresolved, it helps to name the two principles clashing in your meeting.

  **The Principle of Jurisdiction (Your Board Member's View)**
  This argument rests on legal positivism and administrative stability. The logic is: *We need a decision rule that is clear, enforceable, and stable.* Town lines are recorded in deeds, tax rolls, and state laws. If we start allowing non-residents to vote, where does it stop? Do the people downstream get to vote on your septic tank? Do the people in the next county vote on your school budget?
  *   **Strength:** It prevents infinite regress and keeps governance manageable.
  *   **Weakness:** It treats the boundary as morally sacred when it is historically accidental. It allows a community to "export harm" to people who cannot stop it.

  **The Principle of All Affected Interests (Your View)**
  This is a core tenet of democratic theory (championed by thinkers like Robert Dahl). The logic is: *Anyone whose interests are significantly affected by a decision should have a say in that decision.* If the warehouse ruins the quiet enjoyment of a neighbor's home, that neighbor has a stake in the outcome comparable to a voter living five miles away.
  *   **Strength:** It aligns power with responsibility and prevents exploitation.
  *   **Weakness:** As your board member noted, "affected" is vague. Does a slight increase in global carbon emissions give everyone on earth a vote on your zoning board?

  ### 2. Why the Board Member's "Slippery Slope" is Flawed

  Your board member argued that once you admit "affectedness" matters, there is "no natural place to stop." This is a common rhetorical move, but in law and ethics, we draw lines based on **significance** and **proximity** all the time.

  Consider **Nuisance Law**. If you play drums at 3 AM, your neighbor has a legal right to complain. The person three streets over does not. Why? Because the law recognizes a threshold of *direct, material impact.*
  *   **The Principled Distinction:** We don't need to give everyone *some* say; we need to give *significant stakeholders* a say.
  *   **The Threshold:** The households across the border are not experiencing "a little extra noise radiating out for miles." They are experiencing the brunt of the traffic, the exhaust, and the road degradation. Their impact is **asymmetric** and **concentrated.**

  Your board member is conflating *marginal* effects (a tiny bit of noise miles away) with *substantial* effects (heavy trucks on a residential road). A principled line can be drawn at the point where the impact shifts from a general public inconvenience to a specific private burden.

  ### 3. "A Say" Does Not Necessarily Mean "A Vote"

  This is the most practical resolution to your dilemma. In political theory, there is a difference between **franchise** (the right to vote) and **standing** (the right to be heard and considered).

  You likely do not have the legal authority to let non-residents vote on town zoning. That would require changing state law. However, you *do* have the authority to determine how much weight their interests carry in your deliberation.

  A principled approach doesn't require you to break the law; it requires you to interpret your mandate broadly. Most zoning boards are charged with acting in the "public welfare" or "general health and safety."
  *   **The Argument:** The "public" is not defined solely by the tax roll. If a decision harms the health and safety of immediate neighbors, it violates the spirit of the welfare mandate, regardless of whether those neighbors can vote.
  *   **The Mechanism:** You can condition approval on mitigation. For example: *"We will approve this warehouse only if the developer signs a binding agreement to pave and maintain the county road section where the trucks travel, and install noise barriers for the bordering homes."*

  This acknowledges the outsiders' stake without giving them a ballot. It forces the developer and the voting residents to internalize the costs they are imposing on others.

  ### 4. How to Answer the Board Member

  You can respond to your colleague by shifting the frame from "Who gets to vote?" to "What constitutes a fair burden?"

  You might say something like:
  > "I agree that we can't redraw the town line for every vote. But zoning isn't just about who lives inside the line; it's about land use and impact. If we approve a project that exports 90% of its negative consequences to people who can't vote, while the benefits (tax revenue, jobs) stay inside, we aren't governing; we're encroaching. We don't need to give them a vote to acknowledge that their proximity gives their concerns more weight than voters on the other side of town. We can honor the boundary lines while still refusing to be bad neighbors."

  ### 5. Summary: Is there a principled way?

  Yes. The principle is **Proportionality of Impact.**

  *   **Arbitrary Line:** The town border. (Historical accident).
  *   **Principled Line:** The zone of significant negative externality. (Based on physical reality).

  Your board member is right that *any* line is somewhat arbitrary, but he is wrong that *all* lines are equally arbitrary. A line drawn around the households who will hear the trucks is drawn based on **evidence and consequence.** A line drawn based on a map from 1850 is drawn based on **history and bureaucracy.**

  When the two lines conflict, democratic ethics suggest the consequence-based claim should mitigate the bureaucratic rule. You can't change the voting rules, but you can use your power to ensure that the "cost" of the warehouse is not unfairly dumped on the voiceless. That is a principled stance, not just a feeling.
