      *   **User:** PhD student in economics, finishing a dissertation chapter on Social Welfare Functions (SWFs) in Integrated Assessment Models (IAMs) like DICE.
      *   **Context:** Advisor is pushing back on standard population axiology (usually Total Utilitarianism in IAMs) citing Parfit's Repugnant Conclusion and Arrhenius's Impossibility Theorems.
      *   **Problem:** The student understands the philosophy (Critical-Level, Variable-Value, Theory X) but struggles to translate it into *concrete modeling advice* and *policy reasoning*.
      *   **Goal:** Practical upshots. How to handle the impossibility results in a quantitative model? Should they sidestep them or bite a bullet? How should policymakers reason about population vs. average well-being in climate policy?
      *   **Tone:** Academic, rigorous, practical, nuanced, acknowledging the tension between philosophy and economics.

  2.  **Deconstruct the Core Conflict:**
