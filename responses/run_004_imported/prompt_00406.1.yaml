      *   **Philosophical Critique:** Parfit/Arrhenius show that *any* SWF satisfying reasonable conditions leads to counterintuitive results. There is no "perfect" SWF.
      *   **Economic Constraint:** IAMs need a functional form to optimize. They can't run without an objective function.
      *   **The Dilemma:** Do you pick a flawed function and hide the flaws? Or pick a flawed function and disclose the specific flaw? Or change the modeling framework entirely?

  3.  **Brainstorming Implications & Advice:**

      *   *Implication 1: The "Perfect" SWF is a Myth.* Acknowledge Arrhenius. Don't search for Theory X in the code.
      *   *Implication 2: Total Utilitarianism (TU) is dangerous for climate.* It incentivizes maximizing population over mitigation if population is endogenous. It undervalues existential risk (if future people are just numbers).
      *   *Implication 3: Critical-Level Utilitarianism (CLU) is the standard alternative.* It avoids the Repugnant Conclusion but has its own issues (Sadistic Conclusion). It's computationally tractable.
      *   *Implication 4: Fixed Population Assumption.* Most IAMs treat population as exogenous. If so, the axiology matters less *within* the model, but matters for *interpreting* the results (intergenerational equity).
      *   *Implication 5: Sensitivity Analysis.* Don't just run one SWF. Run TU, CLU, and Average Utilitarianism (AU). Show how policy recommendations shift.
      *   *Implication 6: The "Lexical" Threshold.* Parfit's later idea. Hard to model, but maybe a constraint rather than an objective? (e.g., minimum quality of life constraint).
      *   *Implication 7: Policy Communication.* Policymakers need to know that "optimal carbon tax" depends on ethical choices, not just physics and discount rates.

  4.  **Structuring the Response:**

