answer: |-
  This is a classic tension at the boundary of normative economics and moral philosophy. Your advisor is correct that the philosophical literature (Parfit, Arrhenius, Blackorby, Bossert, Donaldson) demonstrates that there is no "perfect" Social Welfare Function (SWF) for variable populations. However, as an economist building an IAM, you cannot simply decline to specify an objective function; the optimizer requires one.

  The practical upshot of taking the impossibility theorems seriously is not that modeling becomes impossible, but that **the choice of SWF must be treated as a sensitivity parameter rather than a discovered truth.** You cannot derive the "correct" SWF from first principles, so you must justify your choice based on the specific policy questions the model is designed to answer.

  Here is a breakdown of the implications for your dissertation chapter, structured by modeling strategy and policy communication.

  ### 1. The Modeling Imperative: "Good Enough" vs. "True"
  The first implication of Arrhenius's impossibility results is that you should stop looking for a "Theory X" to implement in your code. There isn't one. In engineering terms, you are looking for a *satisficing* objective function, not an *optimizing* one in the philosophical sense.

  **Practical Advice:**
  *   **Abandon the search for axiomatic purity.** Do not claim your chosen SWF is "correct." Claim it is "fit for purpose."
  *   **Distinguish between Exogenous and Endogenous Population.** This is the single most important technical distinction for your chapter.
      *   **If Population is Exogenous (Standard DICE):** The Repugnant Conclusion is largely moot *within* the model's optimization horizon. If the population path $N_t$ is fixed by demographic forecasts, Total Utilitarianism (TU) and Critical-Level Utilitarianism (CLU) differ only by a constant ($\sum N_t \cdot c$). They will yield the **same** optimal carbon tax and abatement path. The axiology only matters for evaluating the *value* of the outcome, not the *choice* of policy.
      *   **If Population is Endogenous:** This is where the impossibility theorems bite. If your model allows fertility or survival to respond to climate damages or mitigation costs, TU will incentivize maximizing population size potentially at the expense of quality of life (Repugnant Conclusion). CLU avoids this but may incentivize reducing population if lives are below the critical level (Sadistic Conclusion).
      *   **Recommendation:** If your chapter does not explicitly model endogenous fertility, you should explicitly state that the choice between TU and CLU is **policy-invariant** for your specific results, though it changes the welfare valuation. If you *do* model endogenous population, you must run sensitivity analyses across SWFs.

  ### 2. Strategy for Choosing an SWF: Bite the Bullet or Constrain?
  Since you cannot avoid counterintuitive commitments, you have two viable modeling strategies.

  #### Strategy A: Explicit Bullet-Biting (The CLU Standard)
  For climate IAMs, **Critical-Level Utilitarianism (CLU)** is generally the most defensible "workhorse" SWF, despite the Sadistic Conclusion.
  *   **Why:** It avoids the Repugnant Conclusion, which is politically and ethically toxic for climate policy (we do not want a policy recommendation that implies a massive future population with subsistence lives is better than a smaller, flourishing one).
  *   **The Trade-off:** You must acknowledge the "Sadistic Conclusion" (that adding people with negative welfare can be better than adding people with positive but low welfare).
  *   **Modeling Implementation:** Set the critical level $c$ carefully. In many IAM applications, $c$ is set at the level of "life worth living" or a subsistence consumption floor.
  *   **Dissertation Defense:** When your committee asks, your answer is: "I adopt CLU because the Repugnant Conclusion renders Total Utilitarianism unsuitable for long-term climate policy analysis, where population scales are vast. I acknowledge the Sadistic Conclusion but note that in climate scenarios, we are primarily concerned with avoiding catastrophic negative welfare, where CLU and TU align."

  #### Strategy B: The "Safe Minimum Standard" (Constraint-Based)
  Instead of trying to aggregate welfare across variable populations in the objective function, move the axiological heavy-lifting to the **constraints**.
  *   **The Approach:** Maximize discounted consumption (or Average Utility) subject to a constraint that no generation falls below a specific welfare threshold (a "rights-based" or "sufficiency" constraint).
  *   **Why:** This sidesteps the aggregation problem. You don't need to compare a billion happy people vs. a trillion slightly less happy people. You just need to ensure no one falls below the "climate catastrophe" line.
  *   **Modeling Implementation:** This looks like a "Chance-Constrained" optimization or a "Sustainability Constraint" (e.g., temperature $< 2^\circ$C, or consumption $> C_{min}$).
  *   **Dissertation Defense:** "Given the impossibility results, I do not attempt to maximize total social welfare across variable populations. Instead, I maximize economic efficiency subject to intergenerational equity constraints that prevent the Repugnant Conclusion scenarios from arising."

  ### 3. Implications for Climate Policy Reasoning
  Beyond the code, your chapter should articulate how policymakers should interpret IAM results given these ethical uncertainties.

  **1. The "Optimal Carbon Tax" is an Ethical Variable**
  Economists often present the Social Cost of Carbon (SCC) as a technical estimate derived from physics and discount rates. Your chapter should argue that the SCC is equally derived from population axiology.
  *   **Upshot:** Policymakers should not be presented with a single "optimal" tax. They should be presented with a menu: "If you hold Total Utilitarian views, the tax is $X$. If you hold Average Utilitarian or Critical-Level views, the tax is $Y$."
  *   **Why:** Under TU, the sheer number of future people drives the SCC very high (trillions of future lives count). Under Average Utilitarianism (AU), population size drops out of the equation, often lowering the SCC. This variance is a feature, not a bug; it reveals the ethical stakes.

  **2. Existential Risk Trumps Aggregation**
  The impossibility theorems concern trade-offs between *good* and *better* lives. Climate policy is increasingly about *existence* vs. *non-existence* (tail risks).
  *   **Upshot:** In the presence of existential risk (e.g., runaway warming causing civilizational collapse), almost all SWFs (TU, CLU, AU) converge on the same recommendation: prevent the collapse.
  *   **Modeling Advice:** If your model includes tail risks, emphasize that the axiological choice matters less for catastrophic mitigation than for marginal abatement. This limits the scope of the impossibility problem to "non-catastrophic" policy tuning.

  **3. Discounting and Axiology are Intertwined**
  Your advisor is focusing on population, but in IAMs, the pure rate of time preference ($\delta$) often does more heavy lifting than the SWF form.
  *   **Upshot:** A low discount rate with Total Utilitarianism creates the most extreme obligations to the future (potentially exacerbating Repugnant Conclusion dynamics). A higher discount rate mitigates the weight of the far future, effectively dampening the impact of the population axiology.
  *   **Modeling Advice:** Do not vary the SWF without also varying $\delta$. The interaction between how much we count future people (axiology) and how much we count future time (discounting) is where the real policy sensitivity lies.

  ### 4. Concrete Steps for Your Dissertation Chapter
  To satisfy your advisor and maintain economic rigor, I recommend the following structure for your methodological section:

  1.  **Acknowledge the Impossibility:** Cite Arrhenius explicitly. State clearly: "There exists no SWF that satisfies all intuitively plausible adequacy conditions for variable populations."
  2.  **Justify the Baseline:** Select **Critical-Level Utilitarianism** as your baseline. Justify it not as "true," but as the "least worst" option for climate policy because it prevents the valuation of policy from being driven solely by population maximization.
  3.  **Run a "Axiological Sensitivity Analysis":** Just as you vary the discount rate or damage function, run your model with:
      *   Total Utilitarianism (The Nordhaus baseline).
      *   Critical-Level Utilitarianism (Your baseline).
      *   Average Utilitarianism (The upper bound on population indifference).
      *   *Optional:* A Sufficiency Constraint model.
  4.  **Report Policy Invariance (or Lack Thereof):**
      *   If population is exogenous, show that optimal abatement paths are identical across SWFs (mathematically provable).
      *   If population is endogenous, show how the "optimal" population size and carbon tax shift.
  5.  **Conclusion on Policy:** Conclude that because the "optimal" policy is sensitive to unresolved questions in population ethics, climate policy should focus on **robust strategies** (e.g., no-regrets mitigation, R&D investment) rather than precise carbon pricing derived from a specific SWF.

  ### Summary
  The practical upshot of the Repugnant Conclusion for an economist is **humility in optimization.**

  You cannot solve the philosophical problem in your code. Instead, use your model to show *how much* the policy recommendation depends on that philosophical problem. If the optimal carbon tax varies by 50% depending on whether you use TU or CLU, that is a finding as significant as the tax number itself. It tells policymakers that the "science" of the SCC is inextricably bound to the "ethics" of population, and they must make that ethical choice explicitly rather than hiding it inside the model's objective function.

  **Your advisor wants you to admit that the SWF is a normative choice, not a technical parameter.** Once you make that admission explicit in the text, you are free to pick the one (likely CLU) that allows you to finish the chapter without endorsing the Repugnant Conclusion.
