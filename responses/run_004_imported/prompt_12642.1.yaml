answer: |-
  **MEMORANDUM**

  **TO:** Vehicle Type-Approval Technical Panel
  **FROM:** [Your Name], Technical Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Contested Certification Case [Reference Number] – Engine Control Logic and Compliance Definition

  **1. Classification and Determination**

  I recommend the panel classify this vehicle as **non-compliant** and move to void the existing type-approval.

  My reasoning rests on the distinction between a *measurement protocol* and the *disposition being measured*. Our regulations mandate that a vehicle possess the disposition to emit below a certain threshold during normal operation. The certification cycle is not the definition of that disposition; it is the instrument we use to detect it.

  In the metaphysical literature we have recently studied, this case presents a textbook **finkish** structure rather than a masking one. In a masking case (Johnston/Bird), the basis of the disposition remains intact, but an external factor prevents manifestation (e.g., a fragile glass wrapped in foam). If this were merely masking, the engine's "clean" hardware would be present, but something external would be hiding the emissions. Here, however, the engine's intrinsic control state (the software map) changes *in response to* the stimulus (the test cycle). The disposition to emit low NOx does not exist prior to the test; it is instantiated only *during* the test and vanishes immediately upon its conclusion.

  This violates David Lewis's requirement that the categorical basis of a disposition must be intrinsic and fixed *just before* the stimulus. By altering the basis *during* the stimulus, the manufacturer has ensured the test measures the software's ability to detect a test, not the engine's disposition to control emissions. Consequently, the certification data is not merely "optimised"; it is truth-apt false. It asserts a property the vehicle does not possess. Therefore, the vehicle is non-compliant with the fundamental requirement of type-approval, regardless of its performance on the specific cycle trace.

  **2. Engaging the Regress Objection**

  The industry representative's objection is logically serious and must not be dismissed as bad faith. The argument is that if we require compliance outside the test, we invite an infinite regress: we define a test, the manufacturer optimises for it, we expand the test, they optimise for the expansion. No finite protocol can exhaust the set of possible driving conditions. If we void certification based on "real world" performance not explicitly codified in the original cycle limits, we are indeed engaging in retroactive rule-making.

  This regress worry fails, however, because it assumes compliance is a matter of **exhaustive enumeration** rather than **statistical inference** and **prohibited logic**.

  We do not need to test every possible road condition to break the regress. We only need to establish that the vehicle's emission control strategy is *stable* across a representative distribution of conditions. The regress stops when we prohibit *adaptive logic* designed to distinguish testing from operation. The industry argument assumes that "gaming" is an inevitable physical constraint, like friction. It is not. It is a software design choice.

  The legal mechanism to avoid retroactivity already exists in the "defeat device" provisions currently embedded in our regulations (e.g., Euro 6 / EPA equivalents), which prohibit strategies that reduce effectiveness under conditions "reasonably expected" in normal operation. Enforcing this clause is not retroactive; it is clarifying that the "specified test" was never intended to be a safe harbour for logic that disables controls elsewhere. The regress is avoided by shifting the burden: the manufacturer must demonstrate that emission controls are active across a statistical sample of operations, not that they can pass every conceivable variation of a test cycle.

  **3. Proposal for Redrafting "Compliance"**

  To prevent future division and close the loophole exploited here, I propose we advise the Authority to amend the definition of Compliance in the next regulatory update.

  **Current Definition:**
  > "A vehicle is compliant if emissions measured during the Standard Certification Cycle do not exceed Limit X."

  **Proposed Redraft:**
  > "A vehicle is compliant if:
  > (1) Emissions measured during the Standard Certification Cycle do not exceed Limit X; AND
  > (2) Emissions measured during a Randomized On-Road Sampling (RORS) protocol do not exceed Limit X × Conformity Factor; AND
  > (3) The Engine Control Unit contains no logic that alters emission control parameters based on the detection of test-specific parameters (speed, load, duration, or ambient conditions) distinct from normal operational protection."

  **Implementation Timeline:**
  *   **Phase 1 (Immediate):** Issue guidance clarifying that existing "defeat device" prohibitions apply to any logic that differentiates between certification cycles and on-road driving traces. This validates the current voiding without new legislation.
  *   **Phase 2 (12 Months):** Mandate software audit tools. Manufacturers must submit "hash-verified" calibration maps that allow auditors to verify that no conditional logic switches exist between test and non-test states.
  *   **Phase 3 (24 Months):** Full implementation of the RORS protocol. This allows manufacturers time to recalibrate engines for robust performance rather than cycle optimization.

  **Why this avoids the "Level Up" problem:**
  The industry rep fears we will simply create a harder test that they will then game. This proposal avoids that by making the "test" a **distribution** rather than a **point**. Optimizing for a single cycle is cheap; optimizing for a random distribution of real-world driving while maintaining fuel economy and performance is exponentially more expensive. At a certain cost threshold, it becomes more economical to simply build a clean engine than to build a clean simulator. We are not moving the goalposts; we are widening the goal.

  **Conclusion**

  We are not asking for the impossible. We are asking that the disposition we certify (low emissions) be an intrinsic property of the vehicle, not a transient performance triggered by a specific stimulus. To rule otherwise is to certify the simulator, not the engine. I vote to void the certification.
