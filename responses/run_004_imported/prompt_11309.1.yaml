answer: |-
  This is a sophisticated setup. You have moved beyond the standard "Teleporter Paradox" (where the original is destroyed) into a "Fission with Pruning" scenario (where the original survives briefly then dies). This specific timing creates a fascinating friction between Parfit and Nozick, because the *duration* of the original's survival becomes a metaphysical switch.

  Here is a breakdown of how Parfit and Nozick would analyze this specific case, the status of the "extrinsicness" objection, and a recommendation for your sister's character arc.

  ### 1. Parfit: Identity is Not What Matters
  In *Reasons and Persons*, Parfit argues that personal identity is not a deep, further fact. It is reducible to psychological continuity and connectedness (Relation R) with the right kind of cause.

  *   **The Analysis:** In a standard fission case, Parfit argues that since one person cannot be numerically identical to two people, identity does not hold. However, since neither branch seems "worse off" than a normal survivor, identity cannot be what we care about. We care about *survival* (Relation R), which can hold one-to-many.
  *   **Applied to Your Novel:** In your scenario, the original ($O$) and duplicate ($D$) exist simultaneously for five minutes. During this window, Parfit would say $O$ and $D$ are both psychologically continuous with the pre-fission person ($P$). Strict identity is indeterminate or fails.
  *   **The Death of the Original:** When $O$ dies, does $D$ become $P$? For Parfit, this is the wrong question. $D$ *always* held Relation R to $P$. The death of $O$ doesn't change $D$'s intrinsic status; it merely removes the competing claimant.
  *   **The Verdict:** Parfit would argue the sister should care about whether $D$ possesses the memories, character, and affections of $O$. If Relation R holds, $D$ is the legitimate object of the sister's concern. The legal question of "identity" is a bureaucratic placeholder for the moral reality of "survival."

  ### 2. Nozick: The Closest Continuer Theory
  In *Philosophical Explanations*, Nozick tries to save the concept of identity. He proposes that $X$ is the same person as $Y$ if $X$ is the *closest continuer* of $Y$. Crucially, "closest" is determined by comparing all available candidates.

  *   **The Analysis:** Identity is not intrinsic; it is extrinsic and world-dependent. If $P$ fissions into $L$ and $R$ (equally close), neither is $P$, because neither is the *unique* closest continuer. If $L$ dies immediately, $R$ becomes the closest continuer, and thus $R$ *is* $P$.
  *   **Applied to Your Novel:** This is where your "five-minute survival" detail becomes lethal.
      *   **Minutes 0–5:** $O$ is alive. $O$ is trivially the closest continuer of $P$ (perfect physical/psychological continuity). $D$ is a competitor but is *not* identical to $P$ because $O$ exists and is "closer" (or at least equally close, breaking the uniqueness condition).
      *   **Minute 6:** $O$ dies. Now, when we evaluate the estate, we look at the field of *living* candidates. $D$ is now the unique closest continuer of $P$.
  *   **The Verdict:** Nozick's theory implies that $D$'s status *changes* based on $O$'s death. During the five minutes $O$ was alive, $D$ was a stranger. Once $O$ died, $D$ *became* $O$ (retroactively, for the purposes of current status). Identity is contingent on the non-existence of rivals.

  ### 3. The Extrinsicness Objection: Does Nozick Escape Parfit?
  You asked whether Nozick's account escapes the problem Parfit identifies. The short answer is **no**, but Nozick accepts the cost where Parfit does not.

  *   **The Problem:** Parfit argues that it is irrational for my survival to depend on something extrinsic to me (e.g., whether a duplicate exists on Mars). If Relation R holds, I should survive regardless of what happens elsewhere.
  *   **Nozick's Defense:** Nozick admits identity is extrinsic. He argues that our *concept* of identity involves uniqueness. If there are two candidates, the concept doesn't apply. He isn't trying to find a "deep fact" of identity; he is mapping the logic of our actual concepts.
  *   **The Weakness:** For your novel, this creates a "metaphysical lottery." If the original had lived ten minutes longer, the duplicate gets nothing. If she dies at four minutes, the duplicate gets everything. Parfit finds this absurd (why should my status depend on a rival's heartbeat?). Nozick finds it necessary (identity is a competitive title).
  *   **Conclusion:** Nozick does not escape the difficulty; he codifies it. He makes identity *depend* on the extrinsic fact of the rival's existence. Parfit dissolves the difficulty by saying identity was never the point.

  ### 4. Recommendation: Which View Should the Sister Hold?
  For the dramatic purposes of your novel, I recommend the **Sister operates on Parfitian lines**, while the **Postdoc (the Ex) argues Nozick.**

  Here is why this configuration works best for your scene:

  **1. The Emotional Stakes (Sister = Parfit)**
  If the Sister clings to strict identity (or a layperson's version of Nozick), she can dismiss the Duplicate as a "copy" or a "stranger" because of the five-minute overlap. This is the cold, legalistic stance.
  However, if she moves toward a Parfitian view, it allows for an emotional resolution. She realizes that asking "Is she *really* my sister?" is the wrong question. The right question is, "Does she carry the relationship that matters?"
  *   *Dialogue Hook:* "You keep asking if she's her. I don't care about 'is.' I care about 'who.' And she knows things only my sister would know. That has to be enough."

  **2. The Academic Trap (Postdoc = Nozick)**
  The Postdoc, being a philosopher who "never quite left academia," should be tempted to show off. Nozick is sexier for an argument because it involves rules, conditions, and "edge cases." He can argue that technically, during the five minutes of overlap, the Duplicate was *not* the sister.
  *   *The Conflict:* He might argue that because the Original survived the fission event, the Duplicate's claim is tainted. The estate belongs to the Original's next of kin (the Sister), not the Duplicate, because the Duplicate was never numerically identical to the deceased *at the moment of the machine's activation*.
  *   *The Irony:* The Postdoc uses complex philosophy to potentially disinherit the "survivor," while the Sister uses simple intuition (Relation R) to accept her.

  **3. The Thematic Payoff**
  If the Sister adopts the Parfitian view, she bypasses the "uncanny valley" of the Duplicate. She accepts that identity might be a fiction, but *connection* is real. This fits a story about grief and loss.
  *   **The Twist:** The Postdoc (Nozickian) might eventually concede that since the Original is dead, the Duplicate is now the *Closest Continuer*, so legally she inherits. But the Sister's Parfitian realization is more profound: she isn't giving the money to the "Closest Continuer"; she is giving it to her sister, because she has decided that continuity of memory *is* continuity of soul.

  **Summary for the Scene:**
  *   **Postdoc:** Argues that the five-minute overlap creates a "gap" in identity. The Duplicate is a new legal entity. (Nozickian technicality).
  *   **Sister:** Argues that the overlap doesn't matter. The Duplicate has the memories, the love, and the history. To deny her is to deny the only thing that actually survives death. (Parfitian wisdom).

  This setup allows the philosophy to drive the plot without bogging it down in jargon, and it positions the "amateur" (Sister) as the one who understands the human truth, while the "expert" (Postdoc) gets lost in the metaphysical weeds.
