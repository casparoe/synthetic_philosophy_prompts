      *   *Nozick:* During overlap, Original is the closest continuer of Original. Duplicate is not identical. When Original dies, does Duplicate *become* Original? Nozick's theory is tricky here. Usually, Closest Continuer looks at the set of candidates *at the time of evaluation*. If Original is dead, Duplicate is the closest *living* continuer. So Nozick might actually allow the Duplicate to inherit *as* the Original, whereas during the overlap she couldn't.
      *   *Extrinsicness:* The sister's decision hinges on whether the *fact of the original's death* changes the duplicate's status.
      *   *Nozick:* Yes, it changes the status (from non-identical to identical).
      *   *Parfit:* No, the status (Relation R) was always there; only our practical concern shifts.
      *   *Dramatic Tension:* The Postdoc (Nozick) argues: "Technically, while both existed, neither was the same. But now that the original is gone, the duplicate is the closest continuer. She inherits." The Sister (Parfit?) argues: "It shouldn't matter if the original died or not. If she has the memories, she's my sister."
      *   *Actually, flipping it might be better:* The Postdoc (Academic) loves Nozick because it's a complex rule-based system. The Sister (Layperson) might accidentally be a Parfitian because she cares about *connection*, not metaphysics. OR, the Sister is the one clinging to "Unique Soul" (Lockean/Strict Identity) and the Postdoc has to talk her down using Nozick or Parfit.
      *   *Prompt asks:* Which account should the *sister* be operating with?
      *   *My advice:* Have the sister operate with **Parfit**. It creates a more human stakes. If she uses Nozick, she's debating technicalities of "closest continuer." If she uses Parfit, she's debating "what makes a relationship matter." It fits the "estate/inheritance" theme (what do we owe the dead vs. the living).

  6.  **Finalizing the Content:**
      *   **Section 1: Parfit's Analysis.** Focus on Relation R. Identity is not what matters. Fission shows identity is indeterminate, but survival is not. In this case (death of original), the duplicate is the vessel of survival.
      *   **Section 2: Nozick's Analysis.** Focus on Closest Continuer. Identity is extrinsic. If the original exists, duplicate isn't her. If original dies, duplicate *becomes* the closest continuer. Identity is retroactively clarified by the field of candidates.
      *   **Section 3: The Extrinsicness Objection.** Does Nozick escape Parfit's critique? No. Parfit argues extrinsicness proves identity is shallow. Nozick accepts it as the cost of keeping identity central.
      *   **Section 4: Recommendation for the Sister.** Argue for Parfit. It allows her to bypass the "is she really her?" trap and focus on "does she matter?" It creates a more emotional arc. The Postdoc can be the Nozickian foil (obsessed with the technical status of the overlap period).

  7.  **Review against constraints:**
