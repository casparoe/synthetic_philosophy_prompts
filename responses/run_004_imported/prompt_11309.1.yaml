      *   *Correction on Nozick:* If the Original survives for 5 minutes, during those 5 minutes, the Original is the closest continuer of the Pre-Fission person. The Duplicate is a *competitor*. When the Original dies, the Duplicate becomes the closest *surviving* continuer. Nozick's view implies the Duplicate's status *changes* based on the Original's death. This is peak extrinsicness. This is gold for the argument scene.

      *   *Parfit:* The Duplicate always had Relation R. The death of the Original just removes the confusion.

      *   *Sister's Choice:* If she wants to accept the duplicate, Parfit is warmer. If she wants to reject, she might use the "Overlap Period" argument (Nozick-style) to say "For 5 minutes they were different, so the copy is tainted." But Parfit is better for a resolution.

