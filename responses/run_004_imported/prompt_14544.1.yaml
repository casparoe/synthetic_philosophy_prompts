prompt: |-
  So a few of us who met through an old SSC meetup have been running a tiny philosophy podcast on the side for about a year (maybe 60 listeners, mostly other lesswrong lurkers lol). Next episode's guest is a moral philosopher who defends expressivism/quasi-realism -- the "moral claims express attitudes, not beliefs" line, basically the Blackburn tradition. I went back and reread Yudkowsky's old metaethics sequence over the weekend and realized it kind of skips past the Frege-Geach problem entirely, so I fell down a rabbit hole on the actual literature and now I want to press her on it instead of letting her just restate the slogan.

  Can you write me 8-10 interview questions? Skip the "what got you into philosophy" warm-up stuff. I want at least one question that makes her walk through the embedding puzzle itself -- why "if lying is wrong then getting your kid brother to lie is wrong; lying is wrong; therefore..." is a plainly valid argument even though the minor premise supposedly isn't stating a fact -- one on whether her fixes for that amount to what critics call creeping minimalism (she's quietly helped herself to so much realist-sounding machinery that theres no real difference left between her view and the realism shes rejecting), and one on the negation problem specifically: what attitude is being expressed by the negation of a moral claim, and why that's harder to cash out than it sounds. For each question, give me a one-line note on the dodge she'll probably reach for and a sharper follow-up that actually closes it off. I want to find the real crux here, not just get her polished elevator-pitch answer again.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A small philosophy podcast (60 listeners, LessWrong/SSC adjacent).
      *   **Guest:** A moral philosopher defending expressivism/quasi-realism (Blackburn tradition).
      *   **Host's Background:** Read Yudkowsky's Metaethics Sequence (realized it skips Frege-Geach), dove into literature, wants to press hard on technical issues.
      *   **Goal:** 8-10 interview questions. No warm-ups. Focus on Frege-Geach, Creeping Minimalism, and the Negation Problem.
      *   **Format:** For each question, provide a one-line note on the likely "dodge" and a sharper "follow-up" to close it off.
      *   **Tone:** Intellectual, rigorous, slightly adversarial but respectful (philosophical interview style), tailored to an audience familiar with rationalist/analytic philosophy concepts.

  2.  **Deconstruct the Philosophical Terrain:**
      *   **Expressivism/Quasi-realism:** Moral statements express non-cognitive attitudes (boo/hurrah) rather than describing facts. Quasi-realism tries to earn the right to talk *as if* there are moral truths.
      *   **Frege-Geach Problem:** How do moral sentences work in unasserted contexts (conditionals, questions, negations)? If "Lying is wrong" expresses an attitude, what does "If lying is wrong..." express? You can't have an attitude in the antecedent of a conditional.
      *   **Creeping Minimalism:** The charge that expressivists adopt so much realist language (truth, facts, beliefs) to solve Frege-Geach that the view becomes indistinguishable from realism, losing its distinctive motivation.
      *   **Negation Problem:** Specifically, what attitude is expressed by "Lying is *not* wrong"? Is it the absence of an attitude? A conflicting attitude? It's structurally tricky for non-cognitivists.
      *   **Yudkowsky Connection:** The host mentions Yudkowsky. Yudkowsky's metaethics is a form of naturalistic realism (moral facts are facts about computations in the world/mind). The host wants to avoid Yudkowsky's blind spots.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need 8-10 questions. Need specific focus areas (Frege-Geach walkthrough, Creeping Minimalism, Negation). Need Dodge/Follow-up for each.

      *   *Question 1: The Basic Frege-Geach Setup.*
          *   Focus: The validity of modus ponens in moral arguments.
          *   Draft: How do you handle "If lying is wrong, getting brother to lie is wrong"?
          *   Refinement: Make it specific to the *attitude* in the antecedent.
          *   Dodge: "We use minimal truth."
          *   Follow-up: "Does minimal truth carry enough weight to explain validity?"

      *   *Question 2: The Negation Problem (Specific Request).*
          *   Focus: What is the attitude in "Lying is not wrong"?
          *   Draft: What attitude is negation?
          *   Refinement: Distinguish between lacking an attitude and having a contrary attitude.
          *   Dodge: "It's tolerance."
          *   Follow-up: "Tolerance isn't the logical negation of disapproval."

      *   *Question 3: Creeping Minimalism (Specific Request).*
          *   Focus: Indistinguishability from realism.
          *   Draft: Aren't you just a realist now?
          *   Refinement: Focus on the "functional role" of moral beliefs.
          *   Dodge: "We explain the genealogy differently."
          *   Follow-up: "If the functional role is identical, does genealogy matter for the metaphysics?"

      *   *Question 4: Moral Disagreement.*
          *   Focus: If I say "X is good" and you say "X is bad," are we disagreeing about the world or clashing attitudes?
          *   Refinement: How do you explain the *normative force* of the disagreement?
          *   Dodge: "We are trying to align attitudes."
          *   Follow-up: "Alignment isn't disagreement about truth."

      *   *Question 5: The "Truth-Aptness" of Conditionals.*
          *   Focus: Specifically the logic of the conditional.
          *   Refinement: If the antecedent has no truth value, how is the conditional truth-evaluable?
          *   Dodge: "Expressivists have their own logic."
          *   Follow-up: "Then why use classical logic in moral reasoning?"

      *   *Question 6: Moral Knowledge/Epistemology.*
          *   Focus: If there are no moral facts, what do we know?
          *   Refinement: Can we be mistaken?
          *   Dodge: "Mistaken about our own attitudes."
          *   Follow-up: "I can be wrong about whether torture is wrong even if I know my attitudes."

      *   *Question 7: Quasi-Realism's "Earning" Project.*
          *   Focus: Blackburn's idea of "earning the right."
          *   Refinement: Have we actually earned it, or just stipulated it?
          *   Dodge: "It works in practice."
          *   Follow-up: "Pragmatic success doesn't equal semantic accuracy."

      *   *Question 8: The Motivation for Expressivism.*
          *   Focus: Why be an expressivist if you end up sounding like a realist?
          *   Refinement: What's the leftover ontological savings?
          *   Dodge: "Avoids queer entities."
          *   Follow-up: "Naturalists don't posit queer entities either."

      *   *Question 9: Embedding in Belief Contexts.*
          *   Focus: "John believes that lying is wrong."
          *   Refinement: Does John believe a fact or have an attitude?
          *   Dodge: "Belief is a functional state."
          *   Follow-up: "Then what distinguishes moral belief from desire?"

      *   *Question 10: The LessWrong/Rationalist Angle.*
          *   Focus: Connecting back to the audience.
          *   Refinement: How does this handle moral uncertainty?
          *   Dodge: "Uncertainty about attitudes."
          *   Follow-up: "Moral uncertainty feels like empirical uncertainty."

  4.  **Review and Refine:**
