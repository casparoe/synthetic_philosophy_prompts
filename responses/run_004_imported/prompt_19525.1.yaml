prompt: |-
  I sit on my paper's sourcing and standards committee, and we're stuck on a case that's split the room ahead of next week's meeting. A reporter has one very well-placed source -- a scientist inside a pharma company -- alleging it buried bad trial data, but there's zero independent corroboration, just the reporter's long history with someone whose been right before. House rule is two independent sources minimum for any fraud claim, full stop. Half the committee wants to hold that line: one person's word, however solid their track record, isn't knowledge until something independent backs it up. The other half says that's the wrong lesson -- insist on outside corroboration every time and you'd kill every real whistleblower story, and anyway "corroboration" usually just means a second bit of testimony, so the regress doesn't really go away just because we demand it. Can you draft the memo I'd bring to that meeting -- an actual recommendation on when, if ever, a single uncorroborated source is enough to run, and whichever way you land, take the losing side's strongest argument seriously instead of just waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a newspaper's Sourcing and Standards Committee.
      *   **Task:** Draft a memo for next week's meeting regarding a specific case (pharma whistleblower, single source, no independent corroboration).
      *   **Core Conflict:** "Two-source rule" (strict adherence) vs. "Whistleblower exception" (flexibility based on track record/stakes).
      *   **Requirement:** Make a specific recommendation (when/if a single source is enough).
      *   **Requirement:** Seriously engage with the losing side's strongest argument (steel-manning, not straw-manning).
      *   **Tone:** Professional, nuanced, journalistic, persuasive, internal policy-oriented.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Strict Two-Source):* Safer legally and reputationally. But risks missing huge stories (Watergate, Theranos, etc., often start with one voice).
      *   *Option B (Single Source Exception):* High risk, high reward. Requires rigorous vetting of the *source* and the *evidence* they provide, even if not a second *person*.
      *   *Decision:* The most constructive path for a standards committee is usually a "Strict but Flexible" approach. I should recommend that a single source *can* be sufficient *if* the evidentiary burden shifts from "second testimony" to "documentary/forensic verification." This bridges the gap. It upholds the spirit of verification (the "two-source rule" is really a "verification rule") without rigidly demanding a second human being who might be too scared to talk.
      *   *Why this stance?* It addresses the whistleblower concern (they are often alone) while addressing the fraud risk (one person can lie). It moves the debate from "counting heads" to "weighing evidence."

  3.  **Outline the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The specific case and the broader policy question.
      *   **The Core Tension:** Accuracy/Protection vs. Public Interest/Accountability.
      *   **Analysis of the "Two-Source" Rule:** Why it exists (protection against lies, memory errors, bias).
      *   **Analysis of the "Whistleblower" Argument:** Why strict adherence fails (fear, isolation).
      *   **Recommendation:** The "Evidentiary Threshold" model. Single source is okay *if* supported by documentary/technical evidence that functions as independent verification.
      *   **Addressing the Counter-Argument (The "Losing" Side):** If I recommend flexibility, the "Strict Two-Source" side is the "losing" side in this specific recommendation. I need to validate their fear of libel and manipulation seriously.
      *   **Implementation/Guardrails:** What specific steps must be taken if we go this route.
      *   **Conclusion:** Final call to action.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard internal memo format.
      *   *Opening:* Acknowledge the stalemate. Frame it not as rule-breaking but as rule-refining.
      *   *The Case:* Briefly mention the pharma scientist scenario as the catalyst.
      *   *The Principle:* The goal isn't "two sources," it's "verification."
      *   *The Recommendation:* Propose a "Single-Source Exception Protocol."
          *   Criteria: Source vetting (track record, motive), Document vetting (authenticity, technical review), Legal review.
      *   *Steel-manning the Opposition:* This is crucial. The prompt asks to take the losing side's argument seriously.
          *   If I recommend flexibility, the "Strict Rule" advocates worry about:
              1.  Legal liability (libel/defamation).
              2.  Manipulation (sources using the paper for stock manipulation or vendettas).
              3.  Slippery slope (if we bend for this, why not the next guy?).
          *   I need to acknowledge these are *valid* and that my proposal must mitigate them, not ignore them.
      *   *Steel-manning the "Flexibility" Side (if I went strict):* Wait, I need to choose a recommendation. Let's stick with the "Evidentiary Threshold" (Flexibility with guardrails). So the "Strict" side is the one I need to engage deeply with as the counter-position.
      *   *Refining the Recommendation:* It's not just "trust the reporter." It's "trust the *evidence* the source provides." If the scientist gives internal emails, raw data sets, or regulatory filings that contradict the public story, *that* is the second source. It's documentary corroboration.
      *   *Tone Check:* Is it too academic? Needs to sound like an editor talking to editors. Use terms like "libel proofing," "on the record," "documentary trail."

  5.  **Review against Constraints:**
      *   *Draft the memo?* Yes.
      *   *Actual recommendation?* Yes (Single source allowed with documentary verification).
      *   *Take losing side seriously?* Yes (The strict adherence argument regarding liability and manipulation).
      *   *Context:* Pharma fraud case.

  6.  **Polishing:**
      *   Make sure the distinction between "corroboration by person" and "corroboration by evidence" is clear.
      *   Ensure the "Strict Rule" advocates feel heard, not dismissed as bureaucratic. Their concern is the paper's survival; that's paramount.
      *   Add a specific section on "Guardrails" to show the recommendation is actionable.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Initially, I might lean too hard on "track record." The prompt says the reporter has a history with the source. I need to make sure the recommendation doesn't rely *only* on the reporter's gut feeling. It must rely on the *material* provided.
      *   *Adjustment:* Emphasize that "track record" is a green light to investigate, not a green light to publish. The publication decision rests on the documents.

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Sourcing and Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Single-Source Allegations of Corporate Fraud

  **Executive Summary**

  We are currently deadlocked on a high-stakes allegation regarding suppressed clinical trial data at a major pharmaceutical firm. The reporting rests on a single human source—a scientist within the company—supported by the reporter's established trust in that source, but lacking a second human corroborator.

  Our house rule mandates two independent sources for fraud allegations. Half the committee views this as a non-negotiable firewall against libel and manipulation. The other half views strict adherence as a mechanism that systematically silences whistleblowers, who by definition often operate in isolation.

  This memo recommends a modification to our application of the rule: **We should allow publication based on a single human source *if and only if* that source provides documentary or forensic evidence that serves as functional independent verification.** We must shift our standard from "counting heads" to "weighing evidence." However, this exception requires rigorous guardrails that address the valid legal and ethical risks raised by the proponents of the strict two-source rule.

  **The Core Tension: Verification vs. Accessibility**

  The purpose of the two-source rule is not numerology; it is verification. It exists to protect the paper from three specific risks:
  1.  **Deception:** The source is lying.
  2.  **Error:** The source is mistaken.
  3.  **Manipulation:** The source is using us to settle a vendetta or move a market.

  The argument for flexibility rests on the nature of modern whistleblowing. In highly regulated, siloed industries (like pharma or tech), bad acts are often known to only one person. Requiring a second human witness effectively grants a veto to anyone willing to stay silent. If we insist on a second person, we are not ensuring accuracy; we are ensuring that only conspiracies large enough to be leaked by multiple people get reported.

  **Recommendation: The "Documentary Corroboration" Standard**

  I recommend we approve the story, but under a new precedent: **A single human source is sufficient for a fraud allegation if the source provides contemporaneous documentary evidence that is independently verified as authentic.**

  In this specific case, if the scientist has provided internal emails, raw data sets, or regulatory drafts that contradict the public filing, *those documents function as the second source.* They are independent of the human testimony. A document does not have a reputation to protect, nor does it have a vendetta.

  Under this standard, the reporter's "long history" with the source is relevant only for triage (i.e., does this warrant the expense of a legal review?), not for publication. Publication rests on the documents.

  **Engaging the Counter-Argument: The Case for Strict Adherence**

  Those arguing to kill the story under the current rule are not being bureaucratic; they are being fiduciary. Their argument is the strongest one in the room, and it must be taken seriously.

  The strict adherence camp argues that **documentary evidence is not self-verifying.** A single bad actor can fabricate emails, cherry-pick data, or strip context from internal memos to create a false narrative of fraud. Without a second human to confirm the *context* of those documents, we are vulnerable to being weaponized.

  Furthermore, they argue that **legal liability does not care about our internal logic.** In a defamation suit, a jury does not care if we had "functional verification." They care if we were reckless. Relying on a single interested party increases the appearance of recklessness. If we bend the rule for a sympathetic whistleblower today, we erode the firewall that protects us from a hostile source tomorrow. The "slippery slope" argument is not theoretical; it is historical. Exceptions become precedents, and precedents become loopholes.

  This is the crux of the opposition's concern: **If we publish this and the scientist is lying, we have no defensive perimeter.** We cannot say "a second person told us." We can only say "we trusted the first person's paperwork." In an era of deepfakes and sophisticated data manipulation, is that enough to protect the brand?

  **Mitigating the Risk: Proposed Guardrails**

  To accept the recommendation while respecting the validity of the strict adherence argument, we must implement the following guardrails for any single-source exception:

  1.  **Technical Authentication:** Any documents provided must be vetted by a subject-matter expert (e.g., a different scientist or data analyst) who can confirm the metadata, formatting, and data integrity match the company's known standards. This provides the "independent" check the strict rule demands, even if it isn't a second witness.
  2.  **Motive Disclosure:** We must be transparent with our readers. If the source has a grievance, financial interest, or career stake, that context must be included in the story. It does not disqualify the information, but it arms the reader to assess credibility.
  3.  **Robust Right of Reply:** The company must be presented with the specific allegations and the specific evidence (without revealing the source) and given ample time to respond. Their response often serves as a final verification step; if their rebuttal is demonstrably false when checked against public records, it strengthens the single-source claim.
  4.  **Legal "Clearance Plus":** Stories running on single-source exceptions require sign-off from both outside counsel and the Executive Editor. The burden of proof is higher than a standard two-source story.

  **Conclusion**

  The strict two-source rule is a vital shield, but it cannot become a blindfold. If we require a second human witness for every claim of corporate fraud, we will maintain a clean legal record but fail our journalistic mission to hold power to account.

  However, the concerns of the strict adherence camp are correct: trust is not a verification strategy. We should run the story, but only if the "corroboration" comes from hard evidence that stands up to forensic scrutiny, not just the reporter's relationship with the source. We move forward not by lowering our standards, but by modernizing our definition of verification.

  I request we vote on adopting the "Documentary Corroboration" protocol as an addendum to our existing sourcing guidelines.
