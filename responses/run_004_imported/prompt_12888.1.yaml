      *   **Audience:** 50% former students (experts, will spot errors), 50% family (non-experts, there to grieve).
      *   **Tone:** Moving, accurate, respectful, balancing intellectual rigor with emotional resonance.
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).
      *   **Personal Detail:** The speaker used the Flying Man image in two novels after hearing it as a child (mistaking it for a ghost story).

  2.  **Determine the Core Theme:**
      *   The tension between *knowing* and *feeling*.
