          *   *Drafting thought:* "I put it in my books. She smiled when she read them."

      *   **The Ethical/Philosophical Boundary:** Address her instructions directly but poetically.
          *   *Idea:* She didn't want false comfort (heaven) or cold nihilism (dust). She wanted honesty.
          *   *Drafting thought:* "She drew a line. No promises of meeting again, no saying she's gone forever."

      *   **The Conclusion (The Legacy):** Where does she exist now?
          *   *Idea:* In the minds of those who knew her. The "Flying Man" affirms existence; her students and family affirm *her* existence through memory.
          *   *Drafting thought:* "She is in the thinking we do."

  4.  **Refining and Polishing (Iterative Process):**

      *   *Tone Check:* Is it too dry? *Add more emotion about the aunt herself.*
      *   *Accuracy Check:* Avicenna's *Floating Man* (al-insan al-mu'allaq). Ensure I don't imply dualism proves immortality, just self-awareness independent of bodily sensation.
      *   *Audience Check:* Make sure the family doesn't feel alienated by the philosophy. Use the philosophy as a metaphor for grief.
      *   *Constraint Check:* Did I promise reunion? *No.* Did I say she's just dust? *No.*

      *(Self-Correction during drafting)*: I initially thought about saying "She lives on in our hearts." That's too cliché and might violate the "no false promise" rule if interpreted metaphysically. Better to say "She lives on in the work, in the questions."
