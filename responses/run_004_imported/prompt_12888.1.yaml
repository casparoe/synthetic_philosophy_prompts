          *   *Constraint Check:* Ensure I don't say "therefore the soul is immortal." Say "therefore the self is not *just* the body."
          *   *Drafting thought:* "She told me he knows he is, even if he doesn't know he has hands."

      *   **The Personal Connection (The Novelist):** Address the "shameless recycling" of the idea.
