answer: |-
  Good morning.

  For those of you who knew my aunt only as a sister, a daughter, or a friend, you know that she was a woman who loved precision. She loved things defined clearly. For those of you who knew her as a professor, a colleague, or a student, you know that this precision was not coldness. It was a form of respect. She believed that getting things right was the highest kindness you could offer the truth.

  And so, standing here, I am aware that I am walking a very narrow path. She left me instructions for this moment. She told me that I was not to offer you the comfort of a promise I cannot keep—that she is somewhere waiting for us. But she also forbade me from offering the cold comfort of the opposite—that she was merely flesh, and now that flesh is still.

  She asked me to speak instead about where we actually stand. And to do that, I have to tell you a story I first heard when I was seven years old.

  I came to her house, scared of the dark, scared of ghosts. She didn't tell me there were no ghosts. Instead, she told me about a man. She said, imagine a man created all at once, fully grown, floating in empty air. He is blindfolded. His limbs are spread apart so they do not touch each other. He feels no wind, no ground, no heat, no cold. He has no memory of a name, or a home, or a face.

  She asked me: "Does this man know that he exists?"

  As a child, I thought this was a ghost story. I thought the man was floating in the sky, a spirit without a body. As I grew older, and as I began to write, I realized it was something else. It wasn't a story about ghosts. It was a story about *us*.

  I stole that image. I put it in two of my novels. I turned her rigorous thought experiment into plot devices, into magical realism. She read those books, and she never scolded me for the simplification. She just smiled, I think, because the image had taken root.

  But here is what she taught me, and what her students here know better than anyone: The point of the Flying Man is not that he is a ghost. The point is that even without a body to feel, without a world to touch, he still says, "I am."

  She spent her life studying Avicenna, not because she wanted to prove an afterlife, but because she wanted to prove a presence. She believed that reason can carry you exactly to the edge of that floating man. It can tell you that you are more than the sum of your nerves and bones. It can tell you that the "I" is real. But it cannot tell you where that "I" goes when the breathing stops.

  She would not let me tell you that she is in a better place. She did not believe she was going to a place. But she would not let me tell you that she is gone, either. Because "gone" implies she was only here, in this room, in this body.

  So, where is she?

  She is in the argument we are having right now. She is in the precision of her students' minds, who learned from her that ambiguity is not an excuse for sloppiness. She is in the sentences I write, where I try to find the exact word to hold a feeling that wants to slip away.

  She taught us that the self is not the body, but she also taught us that the self is not a fantasy. It is a fact. And facts do not disappear just because our eyes close.

  To her family: We do not need to pretend she is looking down on us to know she loved us. That love was not a chemical reaction; it was a choice she made, a reality she affirmed, just as the Flying Man affirms his existence. That reality happened. It is part of the structure of the world now, unchangeable.

  To her students: You know that she would hate a logical fallacy in a eulogy more than a tear. So I will not commit one. I will not say her soul is free. I will not say her matter is recycled.

  I will say only this: She affirmed her existence, fiercely and intelligently, for as long as she had breath. And in doing so, she forced us to affirm ours.

  The Flying Man floats in the void, knowing only that he is. We are not in the void. We are here, surrounded by the evidence of her. We are in the library she built, in the minds she sharpened, in the family she held together.

  She asked me not to promise you reunion. I cannot promise that. But I can promise you this: As long as we remember the question she asked, the answer she lived remains. She is not the body we mourn. She is the mind that asked. And in that asking, she remains, suspended in the air of our memory, undeniable, aware, and present.

  Thank you.
