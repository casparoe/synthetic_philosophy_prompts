answer: |-
  You have hit on one of the most contentious and fascinating debates in comparative philosophy. Your intuition is sharp: if Nagarjuna is rejecting the Law of Non-Contradiction (LNC), why isn't he dismissed as an irrational mystic?

  The short answer is that philosophy departments treat him as a rigorous logician **not because he obeys classical Aristotelian logic, but because he exposes the limits of classical logic using a hyper-rigorous dialectical method.**

  Here is a sanity check on your premises, followed by the explanation for his academic status.

  ### 1. Sanity Check: The Tetralemma (*Catuṣkoṭi*)
  Your understanding of the four positions is correct:
  1.  True (A)
  2.  False (not-A)
  3.  Both (A and not-A)
  4.  Neither (not A and not not-A)

  **However, there is a nuance in how Madhyamaka uses them.**
  Nagarjuna does not typically *affirm* the third or fourth option as a new dogmatic truth. Instead, he systematically **negates all four.**

  For example, in the *Mūlamadhyamakakārikā*, when asking about the status of a Buddha after death, he doesn't say, "Actually, it's the fourth option: neither." He argues that **none of the four options apply.**

  Why? Because all four options presuppose that the subject (the Buddha, or any phenomenon) has *svabhava* (inherent, independent existence). If things are "empty" (*śūnya*), they lack inherent existence. If they lack inherent existence, predicates like "exists" or "does not exist" cannot logically attach to them in the first place.

  So, he isn't saying "Contradictions are true." He is saying, **"If you assume inherent existence, you are forced into these four logical boxes, and I will show you that every single box leads to absurdity."**

  ### 2. Does he "Chuck Out" the Law of Non-Contradiction?
  This is where the debate splits into two camps, both represented in philosophy departments:

  **Camp A: The Semantic/Therapeutic View (Traditional)**
  Nagarjuna accepts the LNC within **Conventional Truth** (*saṃvṛti-satya*). In everyday life, fire is hot, not cold. Logic works. He only suspends the LNC when discussing **Ultimate Truth** (*paramārtha-satya*). He argues that the LNC applies to *entities*, but since emptiness reveals there are no discrete, inherent entities, the LNC has nothing to grip onto. He isn't breaking logic; he is showing that the *ontological prerequisites* for logic are missing at the ultimate level.

  **Camp B: The Paraconsistent View (Analytic Philosophy)**
  Philosophers like Graham Priest argue that Nagarjuna *is* committing to a form of **dialetheism** (the view that some contradictions are true). In this reading, the fourth corner ("Neither") or the negation of all four implies a truth value gap or glut that violates classical logic.
  *   **Why this still counts as logic:** Paraconsistent logic is a formal, rigorous system. It doesn't mean "anything goes." It means the system is designed to handle contradictions without exploding into triviality (where everything becomes true). If Nagarjuna is a dialetheist, he is a *logical pioneer*, not a mystic abandoning reason.

  ### 3. Why is he taught as a "Rigorous Logician"?
  Even if he rejects classical metaphysics, he is taught in logic and philosophy courses for three specific reasons:

  **A. The Method of *Prasaṅga* (Reductio ad Absurdum)**
  Nagarjuna rarely makes positive claims. He uses *prasaṅga*, a form of argument where you accept your opponent's premises and deduce unacceptable consequences from them.
  *   *Example:* If you claim "Cause produces Effect," Nagarjuna asks: "Does the cause exist before the effect? If yes, why do you need an effect? If no, how can nothing produce something?"
  *   This is structurally identical to Socratic dialogue or modern analytic argumentation. It requires precise definitions and strict adherence to inference rules to work. You cannot be "sloppy" with a *prasaṅga* argument.

  **B. He Forces Precision**
  Mystics often say, "It is beyond words." Nagarjuna says, "Define your words. Now let's test if they hold up."
  He forces opponents to define "motion," "time," "causality," and "self" with extreme precision. When they do, he shows the definitions are internally incoherent. This is the work of a conceptual analyst, not a poet.

  **C. The Two-Truths Framework is a Logical Tool**
  The distinction between Conventional and Ultimate truth isn't just spiritual; it's a logical safeguard. It prevents his philosophy from being self-refuting.
  *   *Critique:* "If everything is empty, is your statement empty?"
  *   *Nagarjuna's Reply:* "Yes. My statement is a conventional tool (like a ladder) used to climb to the ultimate view. Once you are there, you discard the ladder."
  This saves him from the charge of self-contradiction within the conventional realm where language operates.

  ### 4. Mysticism vs. Philosophy
  The reason he isn't filed under "Poetry" is that his texts are dry, technical, and argumentative. The *Mūlamadhyamakakārikā* reads more like a legal brief or a math proof than the *Tao Te Ching*.

  While the *goal* of Madhyamaka is soteriological (liberation from suffering), the *mechanism* is epistemological and logical. Philosophy departments study him because he offers a sustained critique of **essentialism** (the belief that things have fixed natures) that parallels critiques found in Wittgenstein, Quine, and Derrida.

  ### Summary for your piece
  You can frame it this way:
  Nagarjuna doesn't "break" the Law of Non-Contradiction carelessly; he argues that the LNC is dependent on **ontological realism** (the idea that things really exist). By proving ontological realism is incoherent, he shows that the LNC is a rule that applies to *concepts*, but not to *reality-as-it-is*.

  He is taught as a logician because he uses the tools of logic to dismantle the metaphysical assumptions that logic rests upon. It is a "self-consuming" logic, but the consumption is carried out with surgical precision.

  **The Verdict:** Your premise is half-right. He does move beyond the LNC, but not by embracing irrationality. He moves beyond it by showing that the LNC is a conventional tool, not an ultimate law. That distinction is what keeps him in the Philosophy department rather than the Religion department.
