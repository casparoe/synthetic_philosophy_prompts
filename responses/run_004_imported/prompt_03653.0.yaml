      *Actually, to be bolder:* I will argue that maintaining the fiction is dangerous. We should move toward the Truog/Miller model explicitly.
      *Wait, the prompt asks:* "strongest form of the case for the whole-brain criterion as tracking a real fact... and the strongest form of the case that it is at best a defensible legal convention... and then reach and defend an actual verdict."
      *Okay, I will conclude:* It is a convention. The biological claim is falsified by Shewmon. The PCB repair is semantic sleight of hand. The ethical path is to admit this.

  6.  **Writing - Key Points to Hit:**
