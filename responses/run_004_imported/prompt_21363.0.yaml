  **Move 1:** Marcus correctly identifies the structural features of a Lewisian convention (arbitrariness, coordination equilibrium, mutual expectations), though this classification remains superficial until it accounts for the normative affect surrounding the behavior.

  **Move 2:** Renata astutely observes the empirical stickiness and moralized resentment, but her theoretical claim that pure conventions *ought* to be easy to shift ignores the problem of risk dominance and focal point inertia in coordination games.

  **Move 3:** Marcus accurately defends Lewis against the charge that conventions must be efficient or easily displaced, yet he stretches the "coordination cost" explanation too far to account for the indignation of unaffected third parties.

  **Move 4:** Renata successfully isolates third-party punishment as the critical differentiator that moves the phenomenon from a bare coordination equilibrium to a social norm sustained by normative expectations rather than predictive ones.

  **Verdict and Implications**
  The early-merge etiquette is best treated as a case that began as a Lewis convention but has diachronically hardened into a moralized social norm, suggesting the distinction is often a matter of degree and historical sedimentation rather than a clean binary. This implies that public information campaigns are doomed to fail because they merely establish common knowledge of a *payoff-dominant* equilibrium without altering the *normative expectations* that sustain the current behavior. To succeed, intervention must signal a shift in what the community *approves* of (e.g., through visible law enforcement or fleet compliance), thereby dismantling the conditional preference to comply with the old rule that defines it as a norm rather than a mere convention.
