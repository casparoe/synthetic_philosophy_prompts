  ```json
  {
    "classic": 0.3333,
    "extreme": 0.0010,
    "biased": 0.0526,
    "incubator": 0.3333
  }
  ```

  **Classic:** This value adopts the "Thirder" position, weighting credence by the number of possible awakenings (one Heads vs. two Tails) rather than maintaining the naive 0.5 prior. It reflects the view that self-locating uncertainty should update probabilities based on observer frequency within the experiment. However, this remains genuinely contested, as "Halfers" argue that waking provides no new information about the coin toss itself.

  **Extreme:** Here the Thirder logic intensifies, driving the credence near zero because a Tails result generates a thousand times more observer-moments than Heads. This highlights how sensitive self-locating beliefs are to the ratio of potential experiences rather than just the coin's physical bias. Like the classic case, this is contested; Halfers maintain the probability should remain at the prior 0.5 regardless of the number of wakings.

  **Biased:** The credence drops below the 0.1 prior because the Tails outcome is not only initially more likely (0.9) but also produces twice as many opportunities for observation. This interaction between prior bias and self-location suggests that the structure of the awakening schedule compounds the initial probability shift. This is contested, with Halfers arguing the credence should simply match the coin's bias (0.1) since the waking schedule is known in advance.

  **Incubator:** This value reflects the Self-Indication Assumption, where you reason that you are more likely to exist in a world (Tails) that creates more observers. It treats your own existence as evidence that favors hypotheses with larger populations over those with smaller ones. This is heavily contested by proponents of the Self-Sampling Assumption, who argue your existence confirms nothing about the coin, keeping the credence at 0.5.
