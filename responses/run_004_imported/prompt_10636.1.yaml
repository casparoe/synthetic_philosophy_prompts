      *   Specifically, it *is* the Absent-Minded Driver problem.
      *   **The Conflict:** The tension between *Planning Self* (ex-ante) and *Action Self* (ex-post).
      *   **The "Different Probability":** This refers to the distinction between the objective probability of being at a bridge vs. the subjective credence conditional on reaching a decision node. In the Absent-Minded Driver problem, this manifests as the debate between "Thirders" vs. "Halfers" (like Sleeping Beauty) or, more technically, the consistency between ex-ante optimization and ex-post rationalization.

  3.  **Deconstruct the Decision Matrix:**
      *   Let $p$ = probability of exiting at a bridge.
