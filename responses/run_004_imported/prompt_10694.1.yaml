answer: |-
  This is a strong, well-structured intuition. You are identifying a fault line that runs through the secondary literature on *On Certainty* (OC), even if you haven't fully located your position within the existing map. Since you asked for a sober second opinion and not encouragement, I'm going to treat this as a peer review of a conference paper draft.

  Here is the breakdown based on your four questions.

  ### 1. Is the tension between the metaphors real?

  **Yes, but your mapping of the scholarship onto the metaphors is slightly too neat.**

  The tension between the "hinge" (static, structural) and the "river-bed" (dynamic, historical) is the central engine of contemporary hinge epistemology. You are correct that they suggest different ontologies of certainty.
  *   **The Hinge:** Suggests a logical or grammatical function. If a hinge moves, the door falls off. This supports the reading that hinges are *constitutive* of the language game.
  *   **The River-bed:** Suggests an empirical history. Sand becomes rock, rock becomes sand. This supports the reading that hinges are *empirical propositions* that have temporarily lost their evidential function.

  **The Critique:** Your claim that the Hinge Image maps cleanly to Moyal-Sharrock and the River-bed to Wright is where a referee would push back.
  *   **Moyal-Sharrock** actually leans heavily on the river-bed imagery to argue that empirical propositions *harden* into rules. She argues hinges are "enactments" rather than propositions, which fits the "hardened" aspect, but she uses the fluidity to explain how they change.
  *   **Wright's Entitlement** is less about the *nature* of the proposition (fluid vs. fixed) and more about the *justificatory status*. Wright is comfortable calling them propositions; the river-bed image helps him explain why we lack evidence for them (they are the bed, not the water), but it doesn't necessitate his specific epistemic entitlement framework.

  **Verdict:** The tension is real and textually grounded (§341 vs. §99). However, don't claim the metaphors *dictate* the scholarship (Moyal vs. Wright); rather, claim the metaphors *allow* for the divergence. The metaphors are the source of the ambiguity that scholars are trying to resolve.

  ### 2. Is Priya's "it's not a theory" response a cop-out?

  **It is a legitimate methodological stance, but it is dialectically useless for your project.**

  Priya is channeling the "Therapeutic" or "Resolute" reading of Wittgenstein (think Cora Diamond, James Conant). On this reading, Wittgenstein is not building a model of certainty; he is dissolving the urge to build one. If you treat the hinges as a theory, you have fallen into the very dogmatism OC is meant to cure.

  **Why it feels like a dodge:** Because it immunizes the text from criticism. If inconsistencies are "therapeutic," you can't argue the text is inconsistent.
  **Why it's not a cop-out:** It is historically defensible. Wittgenstein explicitly warns against systematizing.

  **How to handle it in the essay:** Do not try to prove Priya wrong. Instead, bracket her objection. Your argument is not about what Wittgenstein *intended* to build, but about the **conceptual resources the text provides**. Even if Wittgenstein didn't intend a theory, the *metaphors he deployed* have generated two distinct theoretical trajectories in contemporary epistemology. Your essay isn't about Wittgenstein's systematic intent; it's about the structural tension in the imagery that fuels the current debate. That makes Priya's objection irrelevant to your specific claim.

  ### 3. Does your Synchronic/Diachronic fix collapse into Pritchard, Wright, or a third position?

  **You have reinvented Annalisa Coliva's "Moderate Hinge Epistemology," not Pritchard.**

  This is the most important correction I can offer.
  *   **Pritchard (Quasi-Fideism):** He argues hinges are *essentially* arational. It's not just that they are fixed synchronically; it's that they are fundamentally different in kind from knowledge (which requires reasons). He leans into the "leap of faith." Your synchronic/diachronic split is more structural than fideistic.
  *   **Wright (Entitlement):** As noted, he focuses on justification. He doesn't necessarily need the diachronic shift to make his point.
  *   **Coliva:** She explicitly distinguishes between **"constitutive hinges"** (synchronic, rules of the game, non-epistemic) and **"empirical hinges"** (diachronic, propositions that can shift, like "the earth has existed for many years").

  **Your Move:** Your "synchronic/diachronic" fix is basically Coliva's distinction. If you write this essay, you **must** engage with Coliva (*The Bounds of Possibility*, 2015).
  *   **If you ignore her:** Reviewers will reject it as unaware of the literature.
  *   **If you engage her:** You can argue that Coliva resolves the tension by *categorizing* hinges, whereas your argument is that the *metaphors themselves* are doing the work of pulling us in those two directions. You can argue that Coliva's solution is taxonomic, while your observation is about the *imagistic architecture* of OC that makes the taxonomy necessary.

  ### 4. Is this an essay or a footnote?

  **It is an essay, but only if you pivot the focus.**

  If the essay is "Wittgenstein has two metaphors that contradict," it's a footnote. Scholars know this. Stroll, Moyal-Sharrock, and Coliva have all written about the river-bed vs. hinge tension.

  **To make it an essay:** Focus on **Metaphorology as Philosophy**.
  Your unique angle is not just that there is a tension, but that the *choice of metaphor* determines the *epistemic outcome*.
  *   When Wittgenstein reaches for the **Hinge**, he pushes us toward **Quietism/Grammar** (Moyal-Sharrock).
  *   When Wittgenstein reaches for the **River-bed**, he pushes us toward **Naturalism/Historicism** (Stroll, early Putnam).

  **The Thesis:** The unresolved debate in hinge epistemology isn't just about how to interpret the propositions; it's a symptom of Wittgenstein's own oscillation between a logical conception of certainty (Hinge) and a naturalistic conception of certainty (River-bed). Your synchronic/diachronic fix isn't just a solution; it's an admission that we need both metaphors to do different work.

  **Proposed Structure:**
  1.  **Intro:** The "Hinge" and "River-bed" are not decorative; they are argumentative engines that pull in opposite directions.
  2.  **The Hinge:** Analyze §341. Show how it demands a non-epistemic, structural reading (Moyal-Sharrock).
  3.  **The River-bed:** Analyze §96-99. Show how it demands a historical, empirical reading (Stroll/Coliva).
  4.  **The Conflict:** Demonstrate that treating them as the same thing creates the "Problem of Hinge Variation" (how can a rule change?).
  5.  **The Solution:** Defend your Synchronic/Diachronic split. Acknowledge Coliva, but frame it as a reconciliation of the *metaphors* rather than just a taxonomy of propositions.
  6.  **Objections:** Address Priya's "No Theory" objection. Argue that even therapeutic philosophy relies on imagery that carries theoretical weight.
  7.  **Conclusion:** The tension isn't a bug; it's the feature that keeps hinge epistemology alive.

  ### Summary of Advice

  1.  **Read Coliva immediately.** You are arguing a version of her view. You need to know exactly where you align and where you diverge (likely on the role of the metaphors).
  2.  **Don't fight Priya on "Theory."** concede the Therapeutic reading but argue that the *metaphors* have theoretical consequences regardless of intent.
  3.  **Tighten the Moyal/Wright mapping.** It's a bit vulnerable. Better to say Hinge $\rightarrow$ Grammatical/Constitutive and River-bed $\rightarrow$ Empirical/Historical.
  4.  **Commit to the Essay.** This is the core debate in OC scholarship. If you can frame it through the lens of *metaphorical consistency*, you have a fresh take on a crowded field.

  You're not overreading. You've identified the structural stress point in the text. Now you need to do the reading to ensure you aren't proposing a solution that was published in 2015 without citing it.
