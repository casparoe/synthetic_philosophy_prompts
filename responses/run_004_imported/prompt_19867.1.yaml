      *   *Career Perspective:* Even if the mission is hype, the job might still be good. Decouple the *work* from the *cult*.
      *   *Warning Signs:* List specific things to watch for (sleep deprivation, isolation, us-vs-them narrative).

  6.  **Refining the Tone:**
