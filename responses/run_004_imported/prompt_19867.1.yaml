prompt: |-
  I just accepted a job at a startup that's kind of infamous for this: literally everyone who goes through the first week of orientation comes out completely convinced the founder's mission is the most important work happening in the industry, no matter how skeptical they walked in. My friend who works there was super cynical about "changing the world" pitches before she started, and she says it got her too, right on schedule by day three. I start Monday, and right now I honestly think the mission is mostly hype, but its messing with my head a bit - if I already basically know for a fact what I'm gonna believe by Friday anyway, shouldn't I just skip ahead and believe it now instead of stubbornly "waiting" to be convinced? Or is there something actually wrong with reasoning like that, especially since I can't tell if what happens in there is legit persuasion or just really effective groupthink? Would love a sanity check on what the rational move even is here before I walk in Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user is starting a new job at a startup known for intense orientation/indoctrination.
      *   **Observation:** Everyone (even skeptics) becomes convinced of the founder's mission by the end of week one (specifically by day 3, according to a friend).
      *   **Current State:** The user is currently skeptical ("mostly hype") but anticipates becoming convinced soon due to the environment.
      *   **The Dilemma:** Should they "skip ahead" and believe now (since they expect to believe later anyway), or resist/wait to see what happens?
      *   **Underlying Concern:** Is this reasoning flawed? Is it legitimate persuasion or groupthink? What is the *rational* move?

  2.  **Deconstruct the "Skip Ahead" Logic:**
      *   *Premise:* I will believe $X$ at time $T+5$ due to environmental pressure.
      *   *Conclusion:* I should believe $X$ at time $T$ to save cognitive dissonance/energy.
      *   *Flaw:* This conflates *predicting a belief state* with *validating a truth claim*. Just because you know you'll be convinced doesn't mean the conviction is based on evidence. It might be based on social pressure, exhaustion, charisma, or isolation (classic cult/high-control group tactics).
      *   *Risk:* Pre-emptively adopting the belief disables critical thinking safeguards *before* entering the high-pressure environment. It's like deciding to trust a magician before seeing the trick because you know you'll be amazed.

  3.  **Identify the Red Flags:**
      *   "Infamous" for this specific psychological shift.
      *   "Literally everyone" (uniformity is suspicious).
      *   "No matter how skeptical they walked in" (suggests the process overrides prior critical thinking, rather than engaging with it).
      *   "Right on schedule by day three" (suggests a scripted/programmed outcome, not organic discovery).
      *   User suspects "groupthink."

  4.  **Evaluate the "Rational Move":**
      *   **Epistemic Hygiene:** The goal isn't to be comfortable *now*; it's to hold accurate beliefs *later*.
      *   **Meta-Cognition:** The user is already aware of the influence attempt. This is a huge advantage. They need to leverage this awareness.
      *   **Strategy:** Don't decide *what* to believe yet. Decide *how* to process information. Keep a "pre-commitment" to skepticism regarding the *process*, not necessarily the *mission*.
      *   **Safety:** High-intensity orientation can be a sign of a high-control work environment (burnout, exploitation). Protecting one's boundaries is crucial.

  5.  **Drafting the Advice (Iterative Process):**

      *   *Validation:* Acknowledge the cleverness of the thought but highlight the danger. It's a "pre-emptive surrender."
      *   *The Logic Trap:* Explain *why* "skipping ahead" is irrational. Belief should track evidence, not predicted social pressure. If the belief is true, it will survive scrutiny. If it's false, adopting it early is self-deception.
      *   *The "Why" Matters:* Distinguish between *inspiration* (good) and *indoctrination* (bad). The uniformity and timeline suggest the latter.
      *   *Actionable Tactics:* What should they do Monday?
          *   Observe the *methods* not just the message.
          *   Keep a private journal (externalize thoughts before they get muddled).
