prompt: |-
  I'm a third-year cognitive science student in a seminar on philosophy of mind, where we recently worked through Clark and Chalmers's "The Extended Mind," the Otto-and-notebook case, and the standard replies to it: Adams and Aizawa's charge that the argument trades on a coupling-constitution fallacy, and Rupert's argument that biological memory and notebook-consultation aren't functionally alike enough to satisfy the parity principle even once it's granted in the abstract. A few of us have kept arguing about all this since Tuesday's class, which is partly why I'd like an outside opinion before I put anything in writing: I'm also the student member of my university's Examination Accommodations Appeals Board, and a case has come up on this week's agenda that reads as though it were lifted from the syllabus.

  A student with a documented memory impairment from a traumatic brain injury (confirmed by neuropsychological assessment on file with Disability Services) already receives extra time and a quiet room, but has now requested something more specific: permission to consult, during an otherwise closed-book exam, a set of handwritten notes she says are continuous with a running notebook she has relied on all year for ordinary coursework, precisely because her memory doesn't reliably retain material otherwise. Citing Clark and Chalmers by name, her submission argues that the notes satisfy the very features the two of them use to distinguish real extended memory from mere lookup: she wrote and reviewed every page herself, she consults notes like these constantly and without deliberation in every other academic context, and she takes what's written there on trust rather than checking it against anything else. Two board members are unmoved. One thinks that even granting all of this, functional similarity to memory can't be what settles the case, since coupling reliably with a resource isn't the same as that resource being part of one's memory in the sense an exam is entitled to care about — essentially Adams and Aizawa's worry that coupling is being mistaken for constitution. The other points out, more practically, that our accommodations policy only guarantees adjustments that don't "fundamentally alter what the assessment measures," and thinks the case turns on a question philosophy of mind alone can't answer: what this particular closed-book exam is actually supposed to measure.

  Could you draft the short memo I've been asked to prepare for Thursday's meeting? It should give the board a concrete recommendation — grant, deny, or grant subject to specific conditions and a review point — and it should take both the coupling-constitution worry and the "what does this exam measure" objection seriously on their own terms, rather than resolving the case by simply declaring the extended mind thesis true or false.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Third-year Cognitive Science student, seminar on Philosophy of Mind (Clark & Chalmers, Adams & Aizawa, Rupert). Also a student member of the Examination Accommodations Appeals Board.
      *   **Task:** Draft a short memo for the Board's Thursday meeting.
      *   **Case:** A student with documented TBI/memory impairment requests permission to use handwritten notes during a closed-book exam. She cites Clark & Chalmers ("The Extended Mind"), arguing her notebook meets the criteria for extended cognition (constant access, trust, automatic endorsement).
      *   **Board Objections:**
          1.  *Philosophical:* Coupling-Constitution Fallacy (Adams & Aizawa). Just because she uses the notes doesn't mean they *are* her memory.
          2.  *Practical/Policy:* Does this fundamentally alter what the exam measures? (Policy constraint).
      *   **Constraints:**
          *   Must give a concrete recommendation (Grant, Deny, or Grant with Conditions).
          *   Must take both objections seriously *without* simply declaring the Extended Mind Thesis (EMT) true or false.
          *   Tone: Professional, analytical, suitable for an academic appeals board.
          *   Length: "Short memo."

  2.  **Deconstruct the Arguments:**

      *   **The Student's Argument (EMT):** The notebook functions exactly like biological memory (trust, accessibility, past endorsement). Therefore, barring it is like barring her from using her brain.
      *   **Objection 1 (Adams & Aizawa):** Even if the notebook *functions* like memory, it is merely *coupled* to the cognitive system, not *constitutive* of it. Exams test internal cognitive states, not coupled systems.
      *   **Objection 2 (Assessment Integrity):** What is the exam measuring? If it measures "internal recall," notes change the construct. If it measures "application of knowledge," notes might be neutral or helpful.

  3.  **Formulate a Strategy:**
      *   *Avoid the Metaphysical Trap:* The Board isn't there to settle the Philosophy of Mind debate. Whether the notebook is *literally* part of her mind is irrelevant to policy. What matters is *fairness* and *construct validity*.
      *   *Address Objection 1 (Coupling-Constitution):* Acknowledge the distinction. Even if the notes aren't *constitutive* of memory, they are a *compensatory tool* for a documented disability. The goal of accommodations isn't to make the student "normal" in a metaphysical sense, but to level the playing field regarding the *skill being tested*.
      *   *Address Objection 2 (Assessment Measures):* This is the crux. We need to distinguish between testing *memory retrieval* vs. testing *reasoning/application*. If the exam is closed-book by default, does that mean memory is the target, or is it just a proxy for competence? For a TBI student, memory is the impaired function. Accommodations usually aim to bypass the impairment to test the underlying competence.
      *   *Recommendation:* "Grant subject to specific conditions." A blanket grant might violate the "fundamental alteration" clause if the course specifically aims to test internalized recall (e.g., language vocabulary, medical safety protocols). A blanket deny ignores the disability. The middle path is to consult the instructor regarding the *learning objectives*.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on the accommodation request).
      *   **Summary of Request:** Briefly recap the student's claim (TBI, Clark & Chalmers argument).
      *   **Analysis of Objection 1 (Coupling-Constitution):**
          *   Acknowledge the philosophical point (Adams & Aizawa).
          *   Reframe it for policy: We don't need to decide if the notebook *is* memory. We need to decide if allowing it creates an unfair advantage or merely mitigates a disadvantage.
          *   Key point: Accommodations are about access, not metaphysical status.
      *   **Analysis of Objection 2 (Assessment Integrity):**
          *   This is the policy hurdle ("fundamentally alter").
          *   Distinguish between testing *recall* vs. *application*.
          *   If the course goal is critical thinking/application, notes don't alter the measure. If the goal is rote memorization, they do.
      *   **Recommendation:** Conditional Grant.
          *   Condition 1: Instructor consultation to verify learning objectives.
          *   Condition 2: Restriction on note content (pre-approved, handwritten, no new info).
          *   Review point: Post-exam evaluation.
      *   **Conclusion:** Reiterate the balance between equity and academic standards.

  5.  **Refining the Tone:**
      *   Needs to sound like a student member who knows the philosophy but respects the board's administrative role.
      *   Avoid saying "Clark and Chalmers are right." Instead, say "The student's argument relies on EMT, but our decision rests on accommodation policy."
      *   Ensure the Adams & Aizawa objection is treated respectfully but shown to be less relevant to *disability law/policy* than to metaphysics. (i.e., Even if it's just coupling, it's still a necessary prosthetic).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I lean too hard on the philosophy?
      *   *Fix:* Make sure to pivot quickly from the philosophy to the policy implications. The Board cares about precedent and policy, not truth conditions of cognition.
      *   *Critique:* Is the recommendation concrete enough?
      *   *Fix:* Specify *who* checks the notes and *what* they check for.
      *   *Critique:* Did I address the "closed-book" nature?
      *   *Fix:* Explicitly mention that "closed-book" is a method, not necessarily the learning outcome.

  7.  **Final Polish:** Check word count and formatting. Ensure the distinction between "coupling" and "compensation" is clear. (The notebook might not be her mind, but it is her wheelchair for memory).

  8.  *(Final thought)*: Make sure to explicitly mention that the Board doesn't need to settle the EMT debate to make a decision. That's the key insight requested.

  **(Self-Correction Note):** Wait, I need to make sure I don't sound *too* much like a philosophy professor. I am a student board member. The tone should be respectful, analytical, but decisive.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Examination Accommodations Appeals Board
  **FROM:** [Your Name], Student Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Accommodation Request (Case #23-B4: Memory Impairment)

  **Purpose**
  This memo provides a recommendation regarding the request by a student with documented traumatic brain injury (TBI) to consult handwritten notes during a closed-book examination. The student cites Clark and Chalmers's "Extended Mind" thesis to argue these notes constitute part of her cognitive process. Two primary objections have been raised: the philosophical charge of a coupling-constitution fallacy (Adams & Aizawa) and the policy concern regarding fundamental alteration of assessment constructs.

  **Analysis of Objections**

  **1. The Coupling-Constitution Objection**
  Board members have rightly noted that functional similarity does not guarantee ontological identity. Following Adams and Aizawa, one can argue that consulting a notebook is merely *coupling* with an external resource, not the *constitution* of memory itself. If the exam is designed to test internal cognitive states, allowing external coupling could be seen as changing the nature of the task.

  *Recommendation on this point:* The Board need not resolve this metaphysical debate to adjudicate the accommodation. Disability accommodation policy is not concerned with the boundaries of the "self" or "mind," but with equitable access to demonstration of competence. Even if the notebook is merely *coupled* rather than *constitutive*, it functions as a prosthetic device for a documented impairment. Denying the request on metaphysical grounds would conflate the *location* of the cognitive resource with the *validity* of the compensation. The relevant question is not "Is this her memory?" but "Does this tool mitigate the impairment without granting an unfair advantage?"

  **2. The Assessment Integrity Objection**
  The second objection concerns whether allowing notes "fundamentally alters what the assessment measures." This is the decisive policy constraint. A "closed-book" designation is a methodological constraint, not necessarily a learning outcome.

  *Recommendation on this point:* We must distinguish between courses where *recall* is the primary competency (e.g., vocabulary in language learning, safety protocols in medicine) and courses where recall is a proxy for *application* or *reasoning* (e.g., philosophical argumentation, historical analysis). If the exam measures the ability to manipulate concepts, the source of the premises (internal memory vs. trusted notes) is secondary. If the exam measures the retention of specific data, the accommodation compromises the construct.

  **Recommendation**

  I recommend the Board **GRANT the request subject to specific conditions and a review point.**

  A blanket denial disregards the documented disability and the functional role the notes play for this student. However, a blanket grant risks violating the "fundamental alteration" clause if the course specifically targets internal retention.

  **Proposed Conditions:**
  1.  **Instructor Verification:** Disability Services must consult with the course instructor to confirm the primary learning objectives. If the course syllabus explicitly lists "retention of specific data without aid" as a core competency, the accommodation must be denied for that specific assessment.
  2.  **Note Content Restriction:** The handwritten notes must be vetted prior to the exam. They may contain summaries, formulas, or concepts derived from course material, but no novel information or worked examples that would bypass the reasoning process the exam intends to measure.
  3.  **Continuity Requirement:** The student must demonstrate that the notebook provided is the same one used throughout the term, satisfying the "trust" and "constant access" criteria she cited from Clark and Chalmers. This prevents the creation of "exam-specific" cheat sheets.

  **Review Point:**
  Following the exam, the Board should request a brief report from the instructor regarding whether the accommodation appeared to compromise the grading rubric or the differentiation of student performance.

  **Conclusion**
  We can accommodate the student without endorsing the Extended Mind thesis as metaphysical truth. We need only recognize that, for the purposes of equity, the notebook serves the functional role of memory. By verifying the learning objectives, we ensure we are accommodating the *impairment*, not altering the *standard*.

  Respectfully submitted,

  [Your Name]
  Student Member, Examination Accommodations Appeals Board
