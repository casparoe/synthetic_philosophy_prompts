answer: |-
  ### The Paradox of the Known: Evaluating the Problem of Old Evidence

  The history of science is replete with moments where a new theory explains data that has been sitting in plain view for decades. The paradigmatic case is Albert Einstein's General Relativity (GR). When Einstein formulated GR in 1915, the anomalous perihelion precession of Mercury had been a known astronomical fact for over half a century. Yet, historians and scientists agree that Mercury's orbit provided some of the strongest confirmation for GR. For Bayesian confirmation theory, however, this intuition creates a catastrophic formal paradox. Known as the "Problem of Old Evidence," this issue suggests that standard Bayesianism cannot account for how scientists actually reason.

  This essay argues that while the problem of old evidence exposes a fatal flaw in *idealized* Bayesian conditionalization, it does not destroy Bayesian confirmation theory *simpliciter*. The counterfactual solutions proposed to fix the problem fail due to arbitrariness, but the approach advanced by Daniel Garber—relaxing the assumption of logical omniscience—successfully dissolves the paradox. By accepting that agents learn logical relations rather than just empirical data, Bayesianism can be preserved as a robust model of scientific reasoning, provided we abandon the unrealistic assumption that rational agents are logically omniscient.

  #### The Formal Damage: Why $P(E) = 1$ Matters

  To understand the severity of the problem, one must grasp the mechanics of Bayesian confirmation. In the standard framework, a piece of evidence $E$ confirms a hypothesis $H$ if and only if learning $E$ increases the probability of $H$. Formally, $E$ confirms $H$ if the posterior probability $P(H|E)$ is greater than the prior probability $P(H)$. Using Bayes' Theorem, the posterior is calculated as:

  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  In a dynamic context, an agent updates their beliefs via *conditionalization*. If an agent learns $E$, their new probability for $H$ becomes their old conditional probability $P(H|E)$.

  The trouble arises with "old evidence." If the evidence $E$ (Mercury's orbit) is already known before the hypothesis $H$ (General Relativity) is formulated, the agent assigns $E$ a probability of 1. In probability calculus, if $P(E) = 1$, then $P(H \& E) = P(H)$. Consequently, the conditional probability collapses:

  $$P(H|E) = \frac{P(H)}{1} = P(H)$$

  If the posterior equals the prior, the evidence provides zero confirmation. On strict Bayesian conditionalization, Mercury's orbit could not have confirmed GR because the orbit was already certain. This is not merely a technical glitch; it implies that Bayesianism cannot model the most celebrated successes of scientific theory choice. If Bayesian confirmation theory cannot explain why Einstein was justified in believing GR was supported by Mercury's orbit, it fails as a normative model of scientific rationality.

  #### The Counterfactual Strategy: A Dead End

  One prominent attempt to rescue Bayesianism is the counterfactual strategy, advocated by philosophers like Colin Howson and Peter Urbach. This approach suggests we should evaluate confirmation not by the agent's *actual* credences, but by their *counterfactual* credences. We ask: What would the agent's probability for $H$ have been if they *did not* know $E$?

  If we strip $E$ from the agent's background knowledge $K$, then $P_{-E}(E) < 1$. In this hypothetical state, learning $E$ would raise the probability of $H$. Thus, $E$ confirms $H$ relative to the counterfactual state where $E$ is unknown.

  While intuitively appealing, this solution collapses under scrutiny. The primary objection is the problem of the "ur-prior." There is no unique or objective way to subtract $E$ from a web of belief. Knowledge is holistic; $E$ is often entangled with other background assumptions. If we remove the knowledge of Mercury's precession, do we also remove the telescopic technology that observed it? Do we remove the Newtonian mechanics that flagged it as anomalous? Different ways of "subtracting" $E$ yield different confirmation values.

  Furthermore, this makes confirmation dangerously subjective. Confirmation becomes dependent on a fictional history of the agent rather than the actual logical relationship between the theory and the world. If confirmation is merely a measure of how surprised a hypothetical version of us would be, it loses its grip on why the theory is actually *correct*. The counterfactual approach saves the math by changing the subject from actual scientific reasoning to historical speculation.

  #### The Garber Solution: Learning Logical Relations

  A more robust solution comes from Daniel Garber (and independently by Jeffrey and Niiniluoto). This approach attacks the root assumption that generates the paradox: logical omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs instantly. If an agent believes $H$, they are modeled as automatically knowing $H \to E$.

  Garber argues that real agents are not logically omniscient. When Einstein formulated GR, he did not immediately know it entailed the correct value for Mercury's perihelion. The "new" thing Einstein learned was not the data $E$ (which was old), but the *logical relation* between $H$ and $E$. Let $L$ be the proposition "$H$ entails $E$."

  In Garber's framework, the agent conditionalizes on $L$, not $E$. Since the agent did not previously know $L$, $P(L) < 1$. Learning that $H$ entails the known data $E$ allows the probability of $H$ to rise. Formally, if $P(E)=1$, then $P(H|E \& L) = P(H|L)$. If $H$ explains $E$ better than competing hypotheses, learning $L$ shifts probability mass toward $H$.

  Glymour objected that this solution changes the subject: it suggests $H$ is confirmed by the logical fact $L$, not by the empirical evidence $E$. However, this objection misses the cognitive reality of science. The evidential weight of old data is unlocked *only* by the derivation. Without the derivation ($L$), $E$ is just a brute fact. With the derivation, $E$ becomes a specific prediction of $H$. The confirmation comes from the *connection* between theory and data. Garber's model captures this by treating the discovery of the entailment as the learning event.

  This approach does require expanding the probability space to include sentences about logical relations, which some purists argue violates standard probability axioms. However, this is a technical cost worth paying for descriptive accuracy. It models the agent as a bounded reasoner who discovers mathematical truths over time, which is exactly what scientists do.

  #### Verdict: A Flaw in Idealization, Not Framework

  Does the problem of old evidence reveal a genuine, uneliminable flaw in Bayesian confirmation theory? The verdict is **no**, but with a crucial caveat. The problem reveals a fatal flaw in *classical, idealized* Bayesianism that assumes logical omniscience and synchronic rationality. If one insists that Bayesian agents must know all logical truths instantly, the theory is indeed broken and cannot account for theory confirmation.

  However, Bayesianism as a broader framework survives and thrives if we adopt the Garber solution. The counterfactual approach must be rejected because it relies on arbitrary, ill-defined hypotheticals that sever the link between confirmation and actual reasoning. The Garber approach, by contrast, respects the diachronic nature of scientific discovery. It acknowledges that in science, "learning" is not just acquiring new data, but acquiring new understanding of how existing data relates to new hypotheses.

  Therefore, the problem of old evidence should not be viewed as a refutation of Bayesianism, but as a boundary condition that forces the framework to mature. It demonstrates that a viable Bayesian epistemology must be a Bayesianism of *bounded rationality*, where agents update on logical insights as well as empirical inputs. By abandoning the impossible ideal of logical omniscience, Bayesian confirmation theory successfully dissolves the paradox and retains its status as the most rigorous model of scientific inference available. The damage is not to the engine of Bayesianism, but only to the unrealistic expectation that its drivers are gods.
