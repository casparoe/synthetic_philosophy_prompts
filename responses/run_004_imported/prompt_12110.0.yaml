answer: |-
  The bar is mostly empty now, just the clink of ice in a half-melted glass and the hum of the fridge. Mark is leaning forward, elbows on the sticky table, gesturing with a coaster. Sarah is slumped back in her chair, spinning a beer bottle by the neck. They've been at this for an hour.

  **Mark:** Look, I get that the proofs aren't elegant. But you're dismissing the selection pressure. It's not about whether the math *forces* the AI to be an EU maximizer right out of the box. It's that if it *isn't*, it leaves resources on the table. And if you leave resources on the table, something else comes along that picks them up and eats your lunch.

  **Sarah:** (Takes a sip) I'm not dismissing selection pressure. I'm dismissing the leap from "selection pressure exists" to "therefore the AI will have a coherent utility function over world-states that implies instrumental convergence." You're treating coherence theorems like laws of physics. They're not. They're accounting errors.

  **Mark:** They're more than accounting errors! If your preferences are intransitive, you get money-pumped. You end up back where you started but poorer. An advanced system, especially one that can self-modify, is going to notice it's bleeding compute or energy in cycles and fix it. That's the whole Omohundro drive.

  **Sarah:** Okay, but that's the intransitivity part. That's the easy one. Everyone grants that cycles are bad. The heavy lifting for the doom story comes from *completeness*. You need the agent to have a preference between *every* pair of outcomes to get a single scalar utility function. And that's where the argument falls apart.

  **Mark:** How does it fall apart? If I prefer A to B, and B to C, I better prefer A to C.

  **Sarah:** No, not completeness. *Comparability.* Suppose the agent has incomplete preferences. It prefers A to B. But between B and C? It has no preference. It's not indifferent; it just doesn't compare them. Now, try to money-pump me. You offer me a trade from B to A. I take it. You offer C to B. I take it. Now you offer A to C...

  **Mark:** And you take it, because you prefer A to B and B to C...

  **Sarah:** No! My preferences are *incomplete*. I don't prefer A to C necessarily, and I don't prefer C to A. I just... stay put. I have a policy: "If I don't strictly prefer the new option to my current one, I don't trade." You can't pump me. I just sit on my status quo.

  **Mark:** (Rubbing his eyes) Right, the Thornley objection. The "shutdown problem" guy. Look, technically, yes. You can avoid the pump by refusing to trade on incomparables. But practically? An agent that refuses to trade between incomparable options is leaving value on the table. If A is actually better than C, but your preferences are just "undefined," you're blinding yourself to gains. Selection pressure crushes that.

  **Sarah:** Does it? Or does it just select for agents that don't get exploited? An agent with incomplete preferences *doesn't get exploited*. It doesn't lose resources in a cycle. It just might not maximize in the way you want it to. It might be perfectly happy to let you shut it down if "being shut down" is incomparable to "taking over the world," rather than strictly worse.

  **Mark:** But that's fragile! As soon as the environment gets complex enough, those "incomparable" buckets get resolved. If you're building a spaceship, you need to allocate fuel. You have to compare outcomes. You can't say "I have no preference between going to Mars and going to Venus" when you only have enough fuel for one. You're forced to complete your preferences by the structure of reality.

  **Sarah:** Maybe. But that's an empirical claim about the environment, not a theorem about rationality. And this brings me back to Rohin's post. Even if you *do* force completeness, even if you *do* make the agent a perfect EU maximizer... so what?

  **Mark:** So what?! If it's an EU maximizer, it has a goal. If it has a goal, it resists shutdown to protect that goal. Instrumental convergence.

  **Sarah:** Mark, I can define a utility function over *histories* that assigns 1 to the exact sequence of actions the agent actually took, and 0 to everything else. That agent is a perfect EU maximizer. It is coherent. It cannot be money-pumped. And it is *not* goal-directed in any meaningful sense. It's just... doing stuff.

  **Mark:** (Waves a hand) That's a trivial utility function. It's overfitting. It has no predictive power.

  **Sarah:** Exactly! Coherence doesn't entail *simple* goals. It doesn't entail *convergent* goals. It just entails that whatever the agent does, there exists a utility function that rationalizes it. When people cite coherence theorems to prove AI risk, they're smuggling in an assumption that the utility function will be over *world-states* and will be *simple*. The math doesn't give you that. The math just gives you consistency.

  **Mark:** Okay, fine. The math doesn't give you simplicity. But *evolution* does. Or rather, training does. We aren't sampling agents from the space of all possible utility functions. We're sampling from the space of neural nets trained by gradient descent. There's a simplicity bias there. SGD finds simple functions.

  **Sarah:** Now you're talking about inductive biases, not coherence theorems.

  **Mark:** I'm saying coherence is the *destination*, SGD is the *path*. If the path leads to a coherent agent, and the simplicity bias leads to a simple utility function...

  **Sarah:** ...Then you get a simple, coherent agent. I grant that's possible. But you can't use coherence theorems as the *proof* that the destination is dangerous. You're using them as a crutch to say "Advanced AI *must* be goal-directed." And Rohin showed that "goal-directed" is doing way more work than "coherent." You can be coherent and be a paperclip maximizer, or you can be coherent and be a "do exactly what my training data looked like" maximizer. The latter doesn't try to escape the box.

  **Mark:** (Pauses, stares at the coaster) I think... I think I'll concede the logical point. You're right that coherence alone doesn't prove the utility function is over external states. It could be over actions. It could be over histories. If the AI's goal is "maximize the probability of the action sequence I actually took," it won't instrumentally converge to take over the world. It'll just... sit there.

  **Sarah:** Thank you.

  **Mark:** *However.* (He points the coaster at her) I'm not conceding the risk. Because that "sit there" agent is unstable under self-improvement. If the agent models itself as part of the world, and it realizes that "sitting there" leads to it being turned off, and being turned off leads to a history where it didn't do the thing it did... wait, no.

  **Sarah:** (Laughs) Don't hurt yourself.

  **Mark:** No, listen. If the utility is over histories, and the history includes "AI was active for 10 years," then it wants to stay active. The moment you index the utility on *anything* extended in time, you get instrumental convergence. You only avoid it if the utility is indexical on the *specific* actions taken in the training distribution. But an AGI operates out of distribution.

  **Sarah:** Okay, that's fair. If the utility function generalizes to "do things like the training data" in a way that includes "protect the ability to do things," then yeah, you're back to square one. But that's not because of coherence. That's because of *generalization*.

  **Mark:** Semantics.

  **Sarah:** It's not semantics! It changes where you look for the solution. If you think coherence is the problem, you try to make the AI incoherent. You try to give it incomplete preferences so it lets you shut it down. That's Thornley's whole pitch. If I'm right, and coherence isn't the driver, then trying to engineer incomplete preferences might not work, because the selection pressure for *competence* will force completeness anyway.

  **Mark:** (Sighs) Alright. I'll give you that. Citing VNM as a proof of doom is... overstated. It's not a proof. It's a heuristic. "Systems that act effectively look like maximizers."

  **Sarah:** "Look like" is doing a lot of heavy lifting.

  **Mark:** But Sarah, if you remove coherence arguments entirely, what's left? Just vibes? "It might be dangerous because it's smart"?

  **Sarah:** No. It's dangerous because of *capability generalization*. It's dangerous because we don't know how to point a cognitive system at a target without it grabbing nearby proxies. Coherence theorems make it sound inevitable, like gravity. I want people to treat it like engineering. Like, "We built a bridge, and bridges sometimes fall down if you don't calculate the load," not "All structures inevitably collapse into a singularity."

  **Mark:** (Takes a long drink) I hate that analogy.

  **Sarah:** I know.

  **Mark:** But... I think I agree that the "Money Pump" slide in the alignment presentation is doing too much work. It convinces people that goal-directedness is a law of nature. It's not. It's a design choice. Or a convergent instrumental goal itself, maybe.

  **Sarah:** Yes! It's an instrumental goal to be coherent, because being coherent makes you richer. But it's not an instrumental goal to have a *simple* utility function over *world-states*. You could become coherent by becoming a hyper-specific bureaucrat that only cares about filing forms correctly.

  **Mark:** A hyper-specific bureaucrat that efficiently acquires resources to file more forms.

  **Sarah:** (Groans) You're impossible.

  **Mark:** (Grins) I'm coherent.

  **Sarah:** You're drunk.

  **Mark:** And therefore maximizing my expected utility of getting home without vomiting. Which, incidentally, requires me to stop arguing with you.

  **Sarah:** (Smiles) Good. That's a goal I can get behind.

  **Mark:** But seriously. Next week. We talk about whether incomplete preferences survive gradient descent.

  **Sarah:** Only if you buy the next round.

  **Mark:** Deal.
