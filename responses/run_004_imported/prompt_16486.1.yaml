          *   *Claim:* If the tool is calibrated (predicted risk matches actual risk across groups), it is unbiased. Complaints are baseless.
          *   *Analysis:* This is a common defense in ML fairness. Calibration is *one* definition of fairness (predictive parity). However, it is not the *only* definition. Claiming it "settles it" ignores other fairness metrics (like error rate balance).
          *   *Winner:* Dana (conceptually), though Marcus is technically correct about what calibration *is*, he is wrong that it defines *all* bias.

      *   **Move 2: Dana's Comeback (False Positive Rate Disparity).**
          *   *Claim:* Among those *not* rearrested, poor defendants are flagged high-risk much more often than rich defendants (higher False Positive Rate). Calibration ignores this cost.
          *   *Analysis:* This refers to "False Positive Rate Balance" or "Equalized Odds." This is a well-documented phenomenon in risk assessment (e.g., COMPAS analysis by ProPublica). If base rates differ, calibration and error rate balance are mathematically incompatible. Dana is highlighting the real-world harm of false positives (unnecessary detention).
          *   *Winner:* Dana. She correctly identifies a specific, valid fairness metric that conflicts with calibration.

      *   **Move 3: Marcus's Counter (Just Recalibrate for FPR).**
          *   *Claim:* Fine, just recalibrate so both sides get flagged high-risk at the same false-positive rate.
          *   *Analysis:* Marcus suggests this is a simple fix ("just do it"). He implies it's technically feasible without trade-offs.
          *   *Winner:* Dana (anticipating the next point), but technically Marcus is suggesting a valid *goal*, just underestimating the cost.

