answer: |-
  **Setting:** *The philosophy department lounge, 4:30 PM. The whiteboard is still covered in diagrams from the seminar. HUGH (a Humean Reductionist) is erasing the board. CARLA (a Coady-style Anti-Reductionist) is packing her bag.*

  **Carla:** You looked unconvinced during the Q&A, Hugh. When I brought up the child learner case, you started fidgeting with your marker.

  **Hugh:** Just thinking. It's the classic objection, Carla. The "Child Learner" argument. We know it by heart: Children acquire massive amounts of justified belief via testimony long before they have the cognitive capacity to verify the reliability of the testifier. Therefore, justification cannot require independent verification. Therefore, Reductionism is false.

  **Carla:** Exactly. It's the *reductio ad absurdum* of your position. If Reductionism were true, toddlers would be epistemically bankrupt. They'd have no justified beliefs about where the kitchen is, what a "dog" is, or that the stove is hot. But they *do* know these things. So, there must be a presumptive right to believe. A default entitlement.

  **Hugh:** I'm not denying children know things. I'm denying that their knowledge comes *without* inductive backing. You're assuming the induction has to be sophisticated, explicit, or adult-level. It doesn't.

  **Carla:** It has to be *something*, though. For a Reductionist, I need positive reasons to think you're reliable before I'm justified in believing you. What positive reasons does a two-year-old have? They haven't checked a single claim against reality yet. They don't even have the concepts to check against.

  **Hugh:** They have perceptual consistency. The child hears "ball" and sees a ball. They hear "mommy" and sees mommy. They run a mini-induction on the coherence of the testimony with their immediate perceptual environment. It's local, it's primitive, but it's there. They aren't blindly trusting; they're tracking success rates.

  **Carla:** That's Global Reductionism trying to hide in Local clothing. You're saying they verify *some* testimony to trust the *rest*. But think about language acquisition itself. To check if the word "ball" matches the object, the child has to understand the *act of referring*. They have to understand that you are *telling* them something.

  **Hugh:** And?

  **Carla:** And to understand that you are telling them something, they already have to grasp the concept of truth-telling. As Coady argued, you can't learn what testimony *is* by verifying individual instances, because recognizing an instance *as testimony* presupposes you already understand the practice of telling truth. The verification requires the very concept the verification is supposed to justify. It's circular.

  **Hugh:** That's a heavy transcendental claim. You're saying the capacity to check is impossible without prior justification. I think you're over-intellectualizing the child's cognition. They don't need a concept of "testimony." They just need a causal link. Sound comes out, object appears, pattern recognized. It's Humean association.

  **Carla:** Association isn't justification. If a parrot squawks "fire" and I see fire, the parrot isn't giving me testimonial knowledge. The child treats the parent as a *rational source*. That's the key. They treat the utterance as a reason to believe. If Reductionism is true, that treatment is irrational until the track record is built. But the track record can't be built without treating utterances as reasons *first*.

  **Hugh:** Okay, let's pivot. You're leaning hard on Burge now. The Acceptance Principle. "A person is entitled to accept a proposition presented as true... absent stronger reasons not to." You think this solves the child problem because it grants an *a priori* entitlement.

  **Carla:** It does. It explains why the child is rational from day one. The burden of proof is on the skeptic, not the believer.

  **Hugh:** But Burge's principle just pushes the problem back. Why are we entitled? Burge says it's a rational necessity. I say that's magic. If I tell you there's a dragon in my garage, and you have zero evidence of my reliability, Burge says you're *entitled* to believe me until you have a defeater. That makes gullibility a virtue.

  **Carla:** No, it makes trust a default. There's a difference. Gullibility is ignoring defeaters. The Acceptance Principle is operative only *in the absence* of defeaters. If you look crazy, or if the claim is wild, the defeater kicks in.

  **Hugh:** But who decides what counts as a defeater? For a Reductionist, the "defeater" is just the lack of positive reasons. For you, I need a *specific* reason to doubt. In the child's case, they have no reasons to doubt *and* no reasons to trust. You're filling the gap with a presumption. I'm saying the gap is filled by low-level statistical learning.

  **Carla:** But the statistical learning *is* the testimony-dependent process! How does the child check the stats? They have to ask, "Is that a ball?" "Is that red?" They are using testimony to verify testimony. If Reductionism requires independent verification, the child is stuck. They can't step outside the circle of language to check if language works.

  **Hugh:** They verify against *perception*, not language.

  **Carla:** But identifying the perception requires language! If the parent says "Red," and the child sees a color, how does the child know the parent means *that* color and not the shape, or the texture, or the time of day? Quine's gavagai problem applies to toddlers. The only way they solve the mapping is by assuming the parent is being cooperative and truthful. That assumption isn't empirically derived; it's a precondition of learning.

  **Hugh:** *[Pauses, puts down the eraser]* Alright. That's a strong point. The indeterminacy of translation suggests they need a principle of charity. But look, Carla, if we accept your Anti-Reductionism, we lose the critical edge of epistemology. If testimony is a basic source, like perception, then conspiracy theories become harder to combat. If someone tells a believer something wild, and they have no specific defeater, they're justified.

  **Carla:** Not if the claim itself is a defeater. Coherence matters. But yes, I am saying that community and trust are foundational. We are epistemically dependent creatures. Your Reductionism tries to make us epistemic islands who only trust after auditing the books. That's not how humans work, and it's not how we *should* work.

  **Hugh:** But isn't your view just hiding the induction? You say "Accept unless defeated." But how do we know which defeaters matter? We learn which sources are reliable through... induction. So the Reductionist work is still happening, it's just happening at the level of defeaters rather than the level of acceptance.

  **Carla:** It's not hidden; it's secondary. The *justification* comes from the entitlement. The *defeaters* come from experience. You have it backwards. You require experience for the justification to start. I require experience only to stop it.

  **Hugh:** Here's my worry about Burge's principle, though. You treat it as *a priori*. But isn't the principle itself only plausible because, empirically, testimony *is* generally reliable? If we lived in a world of systematic liars, the Acceptance Principle would be disastrous. So, doesn't the principle itself rest on a hidden empirical bet?

  **Carla:** Even if it does, the *individual* doesn't need to know that bet pays off. The entitlement is structural. Think of it like a legal presumption of innocence. It doesn't mean everyone is innocent. It means the system functions best if we start there. Epistemically, communication collapses if we start with suspicion.

  **Hugh:** But epistemology isn't about system efficiency; it's about truth-conduciveness for the agent. If the child's belief is justified, there must be a truth-connection. For me, that connection is the inductive link. For you, it's... what? A rational norm?

  **Carla:** The truth-connection is the nature of assertion. To assert is to present-as-true. If the practice of assertion exists, it aims at truth. The child is plugging into a truth-aimed practice. They don't need to verify the aim; they just need to recognize the practice.

  **Hugh:** But how do they recognize the practice without verifying it works? We're back to the circle.

  **Carla:** *[Smiles]* And that's why we're still talking. You think the circle is vicious. I think it's the only place we can stand.

  **Hugh:** Maybe. But I still think you're letting the child off too easy. If they believe everything, they believe contradictions. Parents disagree. If both parents have equal presumptive force, the child is justified in believing $p$ and not-$p$.

  **Carla:** Then they have a defeater! Contradiction is a defeater. The entitlement is defeasible. When mom says "hot" and dad says "cold," the presumption cancels out, and *then* they need your precious independent verification.

  **Hugh:** So, in cases of agreement, they get free justification. In cases of disagreement, they become Reductionists.

  **Carla:** Exactly. Default trust, monitored by coherence.

  **Hugh:** I can live with that as a heuristic, but not as a foundational epistemic principle. I still think the "positive reasons" requirement is just more subtle than you think. The child's reason is: "This source has sustained me physically so far." It's a biological induction.

  **Carla:** And I say that biological induction is only possible because they already trusted the signals indicating sustenance. Trust first, verification second.

  **Hugh:** We're not going to agree.

  **Carla:** No. But at least we agree the toddler knows where the kitchen is.

  **Hugh:** Thank god for that. Even a skeptic knows not to walk into a wall.

  **Carla:** See? You trust your eyes. Why not your ears?

  **Hugh:** Because eyes don't lie. People do.

  **Carla:** And people teach you how to use your eyes.

  **Hugh:** *[Grabs his bag]* Touché. See you next week?

  **Carla:** Definitely. We haven't even gotten to collective testimony yet.

  **Hugh:** Don't remind me.
