answer: |-
  This is a remarkably precise formulation of the tension between Lewisian modal realism and traditional essentialism, sharpened by an intuition that resonates deeply with the structuralist leanings of quantum statistics. Your wariness of "further facts" over patterns of properties mirrors the permutation invariance found in indistinguishable particles; you are effectively asking whether Lewis's counterpart theory (CT) successfully naturalizes modality without dissolving it into conversational pragmatics, and whether the rival Transworld Identity (TWI) view is any better.

  Here is a precise account of how a defender of CT navigates the "context-sensitivity collapse," followed by an analysis of whether TWI theorists truly escape the analogous problem.

  ### 1. The Counterpart Theorist's Defense: Contextuality vs. Arbitrariness

  Your worry is that if the counterpart relation ($C$) shifts with conversational context, then essential properties ($E$) become merely facts about "what we currently care about." If $x$ is essentially $F$ just means "all counterparts of $x$ (under the salient $C$) are $F$," and $C$ is determined by conversational salience, then essence appears to be pragmatic, not metaphysical.

  A sophisticated Lewisian defender stops the collapse into pure subjectivism by distinguishing between **the selection of the relation** and **the constraints on the relation.**

  #### A. The Constraint of Natural Properties
  Lewis is not a nominalist about properties; he is a realist about *natural* properties. While there are infinitely many ways to construct a similarity relation between world-bound individuals, not all are equally "eligible." The counterpart relation is not *wholly* determined by what we care about; it is constrained by the objective structure of reality (the mosaic of natural properties).

  *   **The Defense:** Conversational context selects *which* objective similarity relations are relevant, but it does not create the similarity.
  *   **Analogy:** Consider indexicals. When I say "It is raining here," the truth conditions depend on my location (context). This does not mean rain is subjective. It means the *proposition expressed* is context-sensitive, while the *facts* determining truth are objective. Similarly, for Lewis, "Humphrey is essentially human" expresses different propositions in different contexts, but the truth of those propositions is determined by objective patterns of resemblance in the pluriverse.

  #### B. Essence as Indexical, Not Illusory
  The CT defender argues that you are assuming essence must be **context-invariant** to be real. They deny this. They argue that our ordinary essentialist talk is inherently indexical.

  *   **Strict vs. Loose:** In a philosophical context, we might use a strict counterpart relation (requiring near-perfect intrinsic match), making "Humphrey is essentially human" true. In a biological context, we might use a looser relation (allowing genetic variation), making "Humphrey could have been a mutant" true.
  *   **The Stop-Gap:** The collapse is avoided because the *range* of admissible counterpart relations is bounded by objective naturalness. We cannot make *any* individual a counterpart of Humphrey just by caring enough; the objective dissimilarity would be too great. Essence is relative to context, but **truth is not relative to opinion.** It is relative to context *within* an objective modal structure.

  #### C. The "Humphrey" Objection Revisited
  You noted you follow Kripke's objection: Humphrey doesn't care about a counterpart. The Lewisian reply here is deflationary. They argue that the *feeling* that we care about transworld identity is an illusion generated by the strength of the counterpart relation. Because the counterpart relation in standard contexts is extremely tight (almost isomorphic), we treat the counterpart *as if* it were identical. The CT defender claims this explains the *phenomenology* of TWI without the *ontology* of TWI.

  ### 2. The Transworld Identity (TWI) Alternative: Relocation or Solution?

  You ask whether TWI theorists avoid the problem or merely relocate it into an unexplained primitive. From a Lewisian (and indeed, a quantum-structuralist) perspective, **they relocate it.**

  #### A. The Primitive Haecceity
  To maintain that Humphrey himself exists in world $W$, TWI theorists must posit a principle of individuation that persists across worlds. Since qualitative properties can vary (Humphrey could have been taller), identity cannot be grounded solely in qualitative resemblance.
  *   **The Relocation:** TWI theorists posit **haecceities** (thisness) or primitive transworld identity. This is a brute fact: "This individual in $W_1$ is *numerically identical* to that individual in $W_2$."
  *   **The Critique:** As you suspect, this looks like "further fact" ontology. It posits a metaphysical glue that holds the individual together across worlds which is independent of all properties and relations. To a physicist wary of hidden variables, this looks suspiciously like positing a "trajectory" for a particle where only the detection events (properties) are observable.

  #### B. The Epistemic Access Problem
  If identity is primitive and non-qualitative, how do we know *which* individual in another world is Humphrey?
  *   **Kripke's Stipulation:** Kripke argues we don't "identify" them via description; we *stipulate* that we are talking about Humphrey.
  *   **The TWI Vulnerability:** This moves the problem from metaphysics to semantics. It saves the objectivity of essence by making it a matter of rigid designation, but it leaves the metaphysical grounding of that designation unexplained. It essentially says: "There is a fact of the matter, but it is not reducible to patterns of properties."
  *   **Comparison:** CT says: "Essence is reducible to patterns of properties, but which patterns count depends on context." TWI says: "Essence is not reducible to patterns of properties; it is a primitive fact."

  ### 3. Synthesis: The Quantum Statistical Parallel

  Your background offers a potent lens for evaluating this. In quantum statistics (Bose-Einstein or Fermi-Dirac), particles of the same type are indistinguishable. Permuting them yields no new state.
  *   **TWI** is analogous to **Maxwell-Boltzmann** statistics: It assumes particles (individuals) have primitive identity tags that persist regardless of state.
  *   **CT** is analogous to **Quantum** statistics: It assumes identity is derived from the state (properties/relations).

  The TWI theorist charges CT with making modality "fuzzy" or "interest-relative." The CT theorist charges TWI with positing "hidden variables" (haecceities) that do no explanatory work and violate parsimony.

  **Does CT collapse into "essence is what we care about"?**
  Only if you demand that *metaphysical necessity* must be context-invariant. Lewis argues that "metaphysical necessity" is just the limit of "what we care about" when we care about *everything natural*.
  *   **The Precise Account:** A CT defender stops the collapse by arguing that **context-sensitivity is a feature of *de re* modal language, not a bug in reality.** The reality is the pluriverse of worlds and the objective similarity metrics between them. The "essence" is the intersection of properties held by counterparts under the *most natural* counterpart relation. Conversational context merely slides us along a spectrum of natural relations. It does not allow us to invent relations ex nihilo.

  **Do TWI theorists avoid the problem?**
  No. They avoid the *context-sensitivity* of essence by positing a **context-invariant primitive**. But they pay for this by accepting an ontological primitive (haecceity) that is epistemically inaccessible and structurally redundant. They relocate the problem from "How do we select the similarity relation?" to "What constitutes the transworld glue?"

  ### Conclusion

  Your instinct is well-founded. The Counterpart Theorist does not (and cannot) prove that essence is context-invariant. Instead, they argue that the demand for context-invariant essence is a philosophical artifact, not a feature of the world. They trade the **primitive mystery** of Transworld Identity (the "further fact" you distrust) for the **pragmatic variability** of Counterpart Relations.

  If you find the positing of a primitive "thisness" ontologically costly (as one should, given a structuralist/quantum background), then the CT price—accepting that essentialist truth is partially indexical—is the cheaper option. It acknowledges that "what makes an individual" is indeed a pattern of properties and relations, and that "which pattern counts" is inevitably tied to the descriptive interests of the observer, without surrendering to the claim that the underlying patterns themselves are subjective.

  TWI theorists do not solve the problem of individuation; they axiomatize it. CT theorists dissolve it, at the cost of making modality less absolute than classical intuition prefers. Given your wariness of "further facts," Lewis's dissolution likely aligns better with your ontological commitments, provided you can accept that "essence" is a less rigid category than Kripke supposed.
