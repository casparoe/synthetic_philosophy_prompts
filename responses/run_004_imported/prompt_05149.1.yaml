          *   The pump usually works like this:
              1.  Agent starts with $B$.
              2.  Offer trade $B \to A$ for a small fee $\epsilon$. Since not $B \succ A$, agent might accept (or is indifferent, but let's assume the gap implies willingness to swap or lack of strict rejection). *Correction:* The standard argument assumes that if you don't prefer $B$ to $A$, you are willing to trade $B$ for $A$ (perhaps for a small cost).
              3.  Now agent has $A$.
