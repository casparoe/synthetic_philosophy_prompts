answer: |-
  ### The Money-Pump Argument for Completeness: The Strongest Case

  To evaluate whether rational agents must possess complete preferences, we must first articulate the money-pump argument in its most compelling form. The axiom of **Completeness** states that for any two options $A$ and $B$, a rational agent must either prefer $A$ to $B$, prefer $B$ to $A$, or be indifferent between them. A violation of completeness implies a **preference gap**: the agent neither prefers $A$ to $B$, nor $B$ to $A$, nor is indifferent.

  The most robust money-pump argument against such gaps is the **Unidirectional Money Pump**, which relies on the principle of *Strict Dominance* and a specific assumption about how agents act on gaps.

  **The Setup:**
  1.  **The Gap:** The agent faces two options, $A$ and $B$, between which there is a genuine preference gap. Formally: $\neg(A \succeq B)$ and $\neg(B \succeq A)$.
  2.  **The Improvement:** There exists an option $A^+$ which is identical to $A$ but includes a small monetary bonus (say, $\$1$). By the principle of Dominance, the agent strictly prefers $A^+$ to $A$ ($A^+ \succ A$).
  3.  **The Robustness Assumption:** The gap between $A$ and $B$ is sufficiently wide that the small improvement in $A^+$ does not close it. Thus, the agent still does not strictly prefer $A^+$ to $B$ ($\neg(A^+ \succeq B)$).
  4.  **The Trading Disposition (The "Gap Assumption"):** If an agent does not strictly prefer their current holding $X$ to an offered option $Y$, they are disposed to trade $X$ for $Y$, potentially for a small transaction cost $\epsilon$. Since the agent does not prefer $B$ to $A$, they will trade $B$ for $A$ (paying $\epsilon$). Since they do not prefer $A^+$ to $B$, they will trade $A^+$ for $B$ (paying $\epsilon$).

  **The Pump Sequence:**
  1.  **Start:** Agent holds $B$.
  2.  **Trade 1:** Counterparty offers to swap $B$ for $A$ at cost $\epsilon$. Since $\neg(B \succ A)$, the agent trades.
      *   *Current State:* $A - \epsilon$.
  3.  **Trade 2:** Counterparty offers to swap $A$ for $A^+$ for free. Since $A^+ \succ A$, the agent trades.
      *   *Current State:* $A^+ - \epsilon$.
  4.  **Trade 3:** Counterparty offers to swap $A^+$ for $B$ at cost $\epsilon$. Since $\neg(A^+ \succ B)$, the agent trades.
      *   *Current State:* $B - 2\epsilon$.

  **The Conclusion:**
  The agent ends up with option $B$, which they started with, but they are now $\$2\epsilon$ poorer. This is a dominated strategy. Since the agent could have simply refused the first trade and retained $B$, their actual behavior guarantees a loss relative to a available alternative. The argument concludes that to avoid this guaranteed loss, a rational agent must eliminate the gap: they must decide that either $B \succ A$ (refusing Trade 1) or $A^+ \succ B$ (refusing Trade 3). Thus, completeness is a requirement of instrumental rationality.

  ***

  ### The Case for Resolute Choice: Why the Pump Fails

  The money-pump argument above is valid, but it is not sound. Its soundness depends entirely on a hidden premise regarding **dynamic choice**: specifically, that the agent chooses **myopically**. The argument assumes that at each decision node, the agent evaluates the trade in isolation, asking only, "Given what I hold now, do I strictly prefer keeping it to swapping?"

  If we reject myopia in favor of **resolute choice**, the money pump is defused without requiring the agent to complete their preferences.

  **1. Plans Over Nodes**
  Resolute choice, as developed by Edward McClennen, posits that rational agency is fundamentally about the selection and execution of *plans*, not merely the maximization of utility at isolated temporal slices. A resolute agent evaluates the entire decision tree at the outset.

  In the pump scenario, the resolute agent identifies two available strategies at $t_1$:
  *   **Strategy S1 (Trade):** Accept Trade 1 $\to$ Accept Trade 2 $\to$ Accept Trade 3. Outcome: $B - 2\epsilon$.
  *   **Strategy S2 (Hold):** Reject Trade 1. Outcome: $B$.

  Even though the agent has a preference gap between $A$ and $B$, they possess a strict preference between the *outcomes* of these strategies. By the transitivity of monetary value, $B \succ B - 2\epsilon$. Therefore, the agent strictly prefers Strategy S2 to Strategy S1.

  **2. Retaining the Gap**
  Crucially, choosing S2 does not require the agent to resolve the gap between $A$ and $B$. The agent does not need to conclude that $B \succ A$. They only need to conclude that *Keeping $B$* is preferable to *Trading $B$ for $A$ in this specific context*.

  The preference gap remains intact: if offered a direct, one-shot choice between $A$ and $B$ with no future consequences, the agent would still report no preference. The gap is real. However, the agent recognizes that in a dynamic context where a clever counterparty exists, acting on that gap locally leads to global defeat. Rationality requires avoiding the defeat, not necessarily filling the gap.

  **3. Sophistication vs. Resolution**
  One might suggest the agent could simply be "sophisticated" (using backward induction to predict their future trades and avoiding the tree entirely). However, sophistication often forces agents to avoid beneficial opportunities for fear of future exploitation. Resolute choice is superior because it allows the agent to enter the decision tree and secure the optimal outcome ($B$) without needing to physically bind themselves or avoid the situation. They simply adopt the plan "Reject Trade 1" and execute it.

  Therefore, the money-pump argument fails to establish completeness. It only establishes that rational agents must be **dynamically consistent**. An agent with incomplete preferences can be dynamically consistent if they choose resolutely.

  ***

  ### Addressing the "Cheating" Objection

  The most forceful objection to this defense is that resolute choice amounts to "cheating." Critics argue that resolute choice illicitly assumes a commitment power that a rational agent cannot legitimately possess.

  **The Objection:**
  At the moment of Trade 1 ($t_1$), the agent forms a plan to reject the trade. But when Trade 1 is actually offered ($t_2$), the agent is a new "time-slice." At $t_2$, the past cost of forming the plan is sunk. The only relevant facts are the current holding ($B$) and the offer ($A$ for $\epsilon$). If the preference gap still exists at $t_2$ (and why wouldn't it? no new information has arrived), then by the original logic, the agent is not irrational for trading. To stick to the plan, the agent at $t_2$ must ignore their current local preferences in favor of a past intention. This looks like irrational stubbornness, or it requires a "binding" technology that the thought experiment excludes. If rationality is about maximizing satisfaction of preferences *now*, the agent at $t_2$ should trade.

  **The Defense:**
  This objection relies on a controversial principle known as **Separability**: the claim that the rational choice at any node depends only on the future consequences emanating from that node, independent of how the node was reached or what plans were formed earlier.

  We should reject Separability in favor of **Diachronic Rationality**.

  1.  **Agency Persists Through Time:** The "time-slice" model of agency is metaphysically and normatively thin. Rationality is a property of the *persisting agent*, not the momentary stage. If I form a plan at $t_1$ based on the best available information, and at $t_2$ I face the exact situation I anticipated with no new information, abandoning the plan is not "re-optimizing"; it is **caprice**. To change one's mind without a change in reasons is a failure of rational agency.
  2.  **The Normative Force of Plans:** Plans are not merely predictions; they are normative commitments. When the agent at $t_1$ selects Strategy S2, they are determining what it is rational to do at $t_2$. The rationality of the action at $t_2$ is derived from its role in the optimal plan selected at $t_1$. If the agent at $t_2$ deviates, they are not acting as a rational maximizer; they are acting as a "local" maximizer who undermines the "global" maximizer they constitute.
  3.  **No External Binding Required:** Resolute choice does not require an external commitment device (like Ulysses tying himself to the mast). It requires only the internal normative capacity to treat one's prior rational intentions as reasons for action. This is not cheating; it is the essence of self-governance. An agent who cannot stick to a plan in the absence of new information is not "freer"; they are fragmented.
  4.  **Implications for the Gap:** The objector claims that at $t_2$, the gap between $A$ and $B$ compels the trade. But this assumes the *only* preference relevant at $t_2$ is the local comparison of $A$ and $B$. A resolute agent recognizes a higher-order preference: the preference for **integrity of agency**. They prefer being the kind of agent who executes optimal plans over being the kind of agent who is money-pumped. This meta-preference is fully compatible with maintaining the first-order gap between $A$ and $B$.

  **Conclusion**
  The money-pump argument demonstrates that *myopic* agents with incomplete preferences are exploitable. It does not demonstrate that *rational* agents must have complete preferences. By adopting resolute choice, an agent can acknowledge genuine value pluralism (incompleteness) while maintaining the dynamic consistency required to avoid exploitation. The "cheating" objection fails because it mistakes the normative authority of prior rational plans for an illegitimate constraint on present choice. Rationality is not just about choosing well now; it is about choosing well over time. An agent who refuses to be pumped by sticking to a plan is not violating rationality; they are fulfilling it.
