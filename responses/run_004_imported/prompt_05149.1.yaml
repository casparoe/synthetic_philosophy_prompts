              6.  Result: Agent ends with $B$ minus $2\epsilon$.
      *   *Refining the Strongest Form:* The strongest version assumes *myopic* choice. At every node, the agent asks "Do I strictly prefer keeping what I have to swapping?" If the answer is "No" (due to the gap), they swap.
