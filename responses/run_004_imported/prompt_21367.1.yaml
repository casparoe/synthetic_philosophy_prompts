prompt: |-
  Okay so for my philosophy elective (it's this small logic-and-epistemology class my school offers, kind of a random mix of stuff) we get to pick our own topic for a short paper that we also have to defend out loud at the end of term, and I went down a total Wikipedia hole and now I'm stuck on something and want a sanity check before I turn this in. Quick context: Frege basically invented modern predicate logic and the sense/reference distinction that's like day-one material in philosophy of language. But near the end of his life he kept a diary, about a month of entries in spring 1924, that's full of hardcore far-right and antisemitic stuff -- ranting about the Weimar system, universal suffrage, Catholics, the French, and especially Jews, who he says should lose their political rights or, in his own words, "vanish from Germany." Michael Dummett, who's basically the reason Frege is even a big deal in English-language philosophy, came across this diary among Frege's papers in the 1950s and later wrote that he'd been "deeply shocked," since he'd always thought of Frege as "an absolutely rational man." The extra weird part is Frege apparently had Jewish students who genuinely liked him as a teacher -- I saw something about Gershom Scholem being one of them?

  Here's my actual argument, which I want you to poke holes in: none of this should change how we judge Frege's philosophy. A valid proof doesn't stop being valid depending on who wrote it down, and "On Sense and Reference" doesn't get worse as an argument because its author turned out to be a bigot in his seventies. We don't go back and re-check the Pythagorean theorem every time we learn something awful about a mathematician, and if personal politics disqualified philosophers we'd lose a big chunk of the canon (Kant's race stuff, for one). So Dummett's totally entitled to feel however he feels personally, but that feeling isn't a philosophical argument against Frege's actual work -- it's just biography, and biography doesn't get a vote on whether the logic holds up.

  Two things I can't shake, though: (1) is Frege's situation actually the same as Heidegger's, where from what I can tell people think the Nazi stuff is way more tangled up in the actual philosophy itself, not just sitting next to it -- or is that supposed difference kind of made up too? and (2) am I missing some specific way the politics and the logic connect for Frege, rather than it just being "genius who also happened to be a horrible person"? Also please flag anything I got factually wrong -- this is all secondhand off wikipedia and a couple of blog posts, so I might be garbling the Scholem detail or the exact Dummett quotes.
