      *   *Key detail:* Make sure the Avicenna reference is explicit but diegetic. It's the name of the protocol.

  9.  **Final Polish:**
      *   Check the pacing. Ensure the abstraction doesn't become boring.
      *   Strengthen the ending. The choice to have a body should feel like a choice to be finite.

  **(Self-Correction Note):** Wait, the prompt asks to take it *seriously* like *Permutation City*. That means I need to grapple with the computational reality of it. If there's no input, is the clock cycle running? If the CPU is waiting on an interrupt that never comes, does the mind freeze?
  *Adjustment:* The mind must be self-clocking. Consciousness generates its own time. That's the horror/wonder.

  10. **Finalizing the Title:** "The Null Somatic." Or "The Flying Man." Let's go with "The Avicenna Protocol."

