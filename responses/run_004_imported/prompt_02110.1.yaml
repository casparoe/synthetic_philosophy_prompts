  5.  **Final Polish:** Check against the user's constraint ("Please don't just be polite about it"). Ensure the critique is sharp. (e.g., admitting that G&J might be over-extending the UAL criteria).

      *(Self-Correction on G&J)*: G&J actually argue UAL emerged *before* vertebrates, potentially in early Cambrian. Bees are derived. If bees have UAL, it fits. But the *evidence* for UAL in bees is the weak point.
