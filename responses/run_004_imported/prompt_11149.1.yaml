  Me and a friend got into a whole thing last night about Zhuangzi and death - specifically the bit where his wife dies and he's found banging on a wash-basin and singing instead of crying, and the other famous one where he's using an old skull as a pillow and it shows up in his dream to tell him death beats being a king. My friend's take is that it's all one move: you, the skull, your wife, everything is just qi cycling through forms, dying is just the next season, so grief doesn't really make sense once you get that. I don't think the skull scene (or that other bit, earlier in the book, about the woman who cries about being married off and then ends up regretting the crying) is making that argument at all - it reads to me as a totally different, more skeptical move: we don't actually know death is bad, so quit assuming it. And that skeptical move is in real tension with the confident "it's just natural transformation, like the seasons" story, not just a second way of phrasing the same point, since the transformation story requires knowing a bunch about what death actually is that the skeptical passages say we can't know. Can you argue my side of this - that Zhuangzi runs two arguments against fearing death that actually pull against each other, not one coherent picture - and deal with the obvious comeback that both arguments just cash out as "don't grieve" so it doesnt matter if they're technically different?
