      *   *IT (Radical Translation):* Multiple translation manuals fit all behavioral evidence. *However*, there is *no fact of the matter* about which is correct. Meaning isn't a hidden mental entity; it's grounded in behavior. If behavior doesn't distinguish them, nothing does.
