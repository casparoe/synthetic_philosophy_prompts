answer: |-
  # Seminar Handout: Indeterminacy of Translation vs. Underdetermination of Theory
  **Course:** Graduate Seminar on Quine's Philosophy of Language  
  **Topic:** The Relationship Between Indeterminacy and Underdetermination  
  **Source Material:** *Word and Object* (1960), "On the Reasons for the Indeterminacy of Translation" (1970), "Two Dogmas of Empiricism" (1951)

  ---

  ## 1. The Core Dispute
  In our last session, a division emerged regarding the logical status of Quine's **Indeterminacy of Translation (IT)**.
  *   **Position A (Reductionist):** IT is merely a specific application of the **Underdetermination of Theory by Evidence (UTE)** to the field of linguistics. If all theories are underdetermined, translation manuals (as theories of meaning) must be too.
  *   **Position B (Distinctness):** IT is a stronger, ontologically distinct thesis. Quine explicitly argued that IT involves a "no fact of the matter" claim that does not apply to standard physical theories.

  **Verdict:** Position B is textually and philosophically correct regarding Quine's intent, though Position A identifies the structural precursor to the argument. Quine insists that while IT *presupposes* UTE, it goes significantly beyond it.

  ---

  ## 2. Defining the Theses

  ### A. Underdetermination of Theory by Evidence (UTE)
  *   **Domain:** Natural Science (Physics, etc.).
  *   **Thesis:** For any consistent theory $T_1$ and any body of evidence $E$, there exists a logically incompatible theory $T_2$ such that both $T_1$ and $T_2$ entail $E$ equally well.
  *   **Status of Truth:** **Realist.** Even though evidence cannot distinguish between $T_1$ and $T_2$, we assume there is a fact of the matter about the world. One theory is (approximately) true, and the other is false; we simply lack the epistemic access to determine which.
  *   **Quine's Stance:** We accept the theory that is simpler or more conservative, but we acknowledge this is a pragmatic choice, not a discovery of ultimate truth.

  ### B. Indeterminacy of Translation (IT)
  *   **Domain:** Semantics / Radical Translation.
  *   **Thesis:** For any translation manual $M_1$ (mapping Native Language $L_N$ to Home Language $L_H$) and any body of behavioral evidence $B$, there exists a logically incompatible manual $M_2$ that fits $B$ equally well.
  *   **Status of Truth:** **Anti-Realist (regarding meaning).** There is **no fact of the matter** as to whether $M_1$ or $M_2$ is correct. It is not that we cannot know; it is that there is nothing to know. Meaning is not a hidden entity behind behavior.
  *   **Quine's Stance:** Both manuals are "correct" insofar as they predict behavior, but neither captures *the* meaning, because "meaning" (as a determinate entity) does not exist.

  ---

  ## 3. The Crucial Distinction: Epistemological vs. Ontological

  The sharp distinction lies in the modal status of the competing hypotheses.

  | Feature | Underdetermination (Physics) | Indeterminacy (Translation) |
  | :--- | :--- | :--- |
  | **Nature of Claim** | **Epistemological.** Concerns limits of *knowledge* and justification. | **Ontological.** Concerns the *existence* of facts (meanings). |
  | **Competing Theories** | $T_1$ and $T_2$ are contradictory. | $M_1$ and $M_2$ are contradictory (e.g., "Rabbit" vs. "Rabbit Stage"). |
  | **Truth Value** | One is true, one is false (classical bivalence holds). | Truth values do not apply in the standard sense; neither is uniquely "correct." |
  | **The "Gap"** | Gap between evidence and **world**. | Gap between evidence and **meaning**. |
  | **Resolution** | Pragmatic virtues (simplicity, etc.) help us choose, but don't make it true. | Pragmatic virtues help us choose a manual, but don't uncover a fact. |

  ### Why the Difference?
  Quine's behaviorism is the engine here.
  1.  **For Physics:** Quine is a **physical realist**. He believes there is a physical world that causes our sensory stimulations. Theories attempt to describe that world. If two theories differ on the nature of that world, they cannot both be right, even if we can't tell which is wrong.
  2.  **For Meaning:** Quine is a **semantic anti-realist**. He denies the existence of "meanings" as mental entities or abstract objects (rejecting the "museum myth" of *Two Dogmas*). Meaning is exhausted by **stimulus meaning** (dispositions to assent/dissent).
  3.  **The Consequence:** If two translation manuals account for all possible stimulus meanings (all behavior) but disagree on reference (e.g., *gavagai* = rabbit vs. *gavagai* = undetached rabbit part), there is no further "meaning fact" to appeal to. The behavioral evidence *is* the totality of the meaning facts. In physics, the evidence is *not* the totality of the physical facts (there are electrons even if we can't see them). In semantics, there is nothing "behind" the behavior.

  ---

  ## 4. The "No Fact of the Matter" Claim

  Quine reserves the phrase "no fact of the matter" specifically for indeterminacy. Is this coherent?

  ### In Translation (Yes, for Quine)
  Because meaning is defined behaviorally, and behavior is exhausted by the evidence, any distinction between manuals that exceeds behavioral evidence is **spurious**.
  *   *Example:* If Manual A says *gavagai* refers to rabbits, and Manual B says it refers to temporal stages of rabbits, and no experiment can distinguish the two, then for Quine, the question "Which does it *really* refer to?" is meaningless. Reference is inscrutable.

  ### In Physics (No, for Quine)
  Quine explicitly rejects applying "no fact of the matter" to physical theories (e.g., in *Pursuit of Truth*).
  *   *Reasoning:* To say there is "no fact of the matter" about whether electrons exist would be to abandon physical realism. Quine wants to save science. He accepts that our best physical theory describes reality.
  *   *The Tension:* Critics (like Putnam) argue this is inconsistent. If all we have is evidence for physics, why is there a fact of the matter for electrons but not for meanings?
  *   *Quine's Defense:* Physics posits entities to *explain* evidence. Meaning does not explain evidence; meaning *is* the pattern of evidence. Therefore, physics reaches beyond evidence (ontology), while meaning does not.

  ---

  ## 5. Why Indeterminacy is "Stronger"
  Quine describes IT as "more shocking" than UTE. It is stronger in three specific respects:

  1.  **Inscrutability of Reference:** IT implies that reference itself is indeterminate. We can permute the ontology of the native speaker (using proxy functions) without changing the truth value of their sentences. In physics, we assume reference is fixed (we are talking about *the* world).
  2.  **Non-Discoverability:** In UTE, better technology or new evidence *could* theoretically break the tie between $T_1$ and $T_2$. In IT, no amount of additional behavioral evidence can break the tie, because the tie is not caused by a lack of data, but by the nature of meaning itself.
  3.  **Failure of Bivalence:** UTE preserves the Law of Excluded Middle (either $T_1$ or $T_2$ is true). IT suspends it for semantic claims (it is neither true nor false that *gavagai* means rabbit).

  ---

  ## 6. Objections from Critics (Chomsky & Putnam)

  Your students should be aware of why Position A (Reductionism) is attractive to critics.

  *   **Chomsky:** Argues that Quine's behaviorism is false. There *are* facts of the matter about meaning, located in the internal structure of the mind (Universal Grammar). If we accept Chomsky's internalism, IT collapses back into UTE (we just lack access to the brain states). Quine rejects this as "mentalism."
  *   **Putnam:** Argues that if IT is just UTE, it is trivial (all theories are underdetermined). If IT is ontological (no fact of the matter), it is false (reference is real). Putnam's Model-Theoretic Argument attempts to show that if reference is indeterminate in Quine's sense, then *physics* is also indeterminate, forcing Quine into an untenable global skepticism.

  ---

  ## 7. Summary for Discussion

  To settle the seminar dispute:
  1.  **Structural Similarity:** Position A is correct that IT *uses* the logic of UTE. Both rely on confirmation holism (sentences face the tribunal of experience as a corporate body).
  2.  **Philosophical Divergence:** Position B is correct that the *conclusions* differ. UTE is a thesis about **scientific method**; IT is a thesis about **metaphysics (ontology of meaning)**.
  3.  **Quine's Text:** In *Word and Object* (§12) and his 1970 reply to Chomsky, Quine explicitly states: *"The indeterminacy of translation is not to be confused with the underdetermination of physical theory... The underdetermination of physical theory leaves the theory true or false... The indeterminacy of translation... leaves no fact of the matter."*

  **Discussion Question:** Is Quine's distinction stable? If we are physicalists, and meaning is realized in the brain (physical states), doesn't the "fact of the matter" about brain states restore a fact of the matter about meaning? Or does Quine's behaviorism block this move by definition?

  ---

  ## 8. Selected Bibliography for Further Reading
  *   Quine, W.V.O. *Word and Object*. MIT Press, 1960. (Specifically Chapter 2, §12).
  *   Quine, W.V.O. "On the Reasons for the Indeterminacy of Translation." *Journal of Philosophy*, 1970.
  *   Chomsky, Noam. "Quine's Empirical Assumptions." *Synthese*, 1968.
  *   Putnam, Hilary. "Explanation and Reference." *Mind, Language and Reality*, 1975.
  *   Gibson, Roger F. *The Philosophy of W.V. Quine*. University Press of Florida, 1982. (See Chapter 4 on Indeterminacy).
