          *   IT: For any translation manual $M$ and behavioral evidence $B$, there exists $M'$ such that $M$ and $M'$ fit $B$ but assign incompatible meanings.
      *   *The Crucial Divergence:* This is the heart of the handout.
          *   UTE: We don't *know* which is true. Realism is preserved.
          *   IT: There *is* no truth to be known. Anti-realism about meaning.
          *   *Keyword:* "Fact of the matter."
      *   *Why the Difference?*
