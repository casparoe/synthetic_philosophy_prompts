      *   **Characters:**
          *   *Counterfactual Theorist (CT):* Beliefs align with David Lewis-style counterfactual dependence. Omissions *are* causes if the effect wouldn't have happened had the omission not occurred.
          *   *Physical-Process Theorist (PT):* Beliefs align with Salmon/Dowe conserved quantity theory. Causation requires a physical link (energy/momentum transfer). Omissions are *not* causes.
      *   **Scenario:** A lifeguard fails to notice a drowning swimmer.
      *   **Key Objections to Address:**
          *   *To CT:* The "Profligacy Problem" (Why isn't everyone who didn't help also a cause?).
          *   *To PT:* The "Intuition/Normative Problem" (Why do we blame the lifeguard specifically if there's no physical link?).
      *   **Format:** Dialogue.
      *   **Constraint:** No conceding at the end. Direct responses to objections (no restating opening positions without engagement).
      *   **Tone:** Intellectual, rigorous, but accessible (like a postmortem debate elevated to philosophy).

  2.  **Character Conception:**
