answer: |-
  **Elena:** Let's stick to the lifeguard. The swimmer drowns. The lifeguard was on duty, sitting in the chair, but he was looking at his phone. He never saw the struggle. If he had looked, he would have jumped in, and the swimmer would have lived. Therefore, his failure to look caused the death. It's a straightforward counterfactual dependence: if the omission hadn't occurred, the effect wouldn't have happened.

  **Marcus:** It's straightforward only if you ignore what's actually happening in the world. There is no physical link between the lifeguard's retina and the swimmer's lungs. No energy was transferred from the lifeguard to the water. No momentum was exchanged. The water entered the lungs; gravity pulled the body down. Those are physical processes. The lifeguard's inattention is a *nothing*. It's an absence. You can't build a causal chain out of nothing. The cause of the death was the water, full stop. The lifeguard merely failed to interrupt that process.

  **Elena:** You're conflating "physical mechanism" with "causation." But let's press on your view for a moment. If we accept that omissions aren't causes because they lack physical substance, we run into the problem of profligacy on my side, sure, but let's face that head-on. You'd argue that if I say the lifeguard's *not-looking* caused the death, I must also admit that *my* not-looking caused the death. I was sitting at my desk three miles away. I didn't jump in either. By your counterfactual logic, if I had jumped in, the swimmer would have lived. So am I a cause? Is everyone on earth who didn't jump in a cause of the drowning?

  **Marcus:** Exactly. That's the reductio ad absurdum of your position. If absence is a cause, then the absence of a rescue by the President, by a shark that didn't show up, and by me sitting here are all causes. You've turned causation into a universal background noise where everything that didn't happen is responsible for what did. It makes the concept useless.

  **Elena:** It doesn't make it useless; it makes it context-sensitive. We don't select causes from the set of all logical possibilities; we select them from the set of *expected* possibilities. Counterfactual dependence is necessary, but not sufficient on its own—we layer it over a model of normalcy. In the normal course of events, a lifeguard looks. A random person at a desk does not. The counterfactual "If the lifeguard had looked..." represents a deviation from a norm that was supposed to hold. "If the random bystander had teleported in..." is a deviation from a different, much broader norm. We filter causes based on what we take as the default state. The lifeguard's inattention is salient because it violated a specific expectation. I don't need to say everyone is a cause; I just say everyone else's inaction is part of the fixed background conditions, while the lifeguard's inaction is the variable that changed.

  **Marcus:** So you're admitting causation isn't in the world; it's in your head. It's a pragmatic tool for assigning blame, not an ontological feature of reality. You're smuggling norms into physics. But fine, let's turn that back on you. If causation is just about expectations and norms, why does the lifeguard case feel so different from a case where a rock falls and kills the swimmer? If a rock falls, we say the rock caused the death. If the lifeguard doesn't move, you say the *not-moving* caused the death. But in both cases, we hold the lifeguard responsible if he was negligent. If your theory is right, and omissions are genuine causes, then the lifeguard's inattention should be physically indistinguishable from the rock falling. But it isn't. There is no force. So why are we so confident the lifeguard's inattention was a *real* cause of death when there's no physical process to point to? Why does it feel like he pushed the swimmer under, even though he didn't touch him?

  **Elena:** Because the outcome depended on him. The "feeling" you're describing is the recognition of dependency. But you're dodging the implication of your own view. If you insist on a physical process, you have to say the lifeguard had *no causal role* in the death. The water did it. But if the water did it, and the lifeguard did nothing, then fixing the lifeguard's behavior shouldn't prevent the death in a causal sense—it's just a correlation. That undermines the entire point of a postmortem. We investigate to find causes so we can intervene. If omissions aren't causes, then adding a second lifeguard or an alarm system doesn't "prevent" future deaths causally; it just sets up a new physical process. You're forcing a distinction between "killing" and "letting die" that vanishes when you look at the outcome. The swimmer is dead either way.

  **Marcus:** I'm not denying that fixing the behavior changes the future. I'm denying that the *absence* of the behavior is the engine of change. Look, I can grant that the lifeguard is morally and legally responsible. We punish omissions because of duty, not because of physics. I can explain why we blame him without calling his inaction a cause. He had a contract. He had a duty of care. When he breached that duty, he became liable for the result produced by the *actual* causes—the water, the cramp, the current. You're trying to make "responsibility" and "causation" the same word. They aren't. I can explain why we blame him—duty—and I can explain why he died—physics. You need to mash them together into "causation" because you can't bear the gap. But the gap is real. If I say "The lack of rain caused the famine," I'm speaking metaphorically. The heat and the dry soil caused the famine. The rain's absence is just a description of what didn't happen to stop it.

  **Elena:** But that distinction collapses under pressure. If I unplug a life-support machine, I transfer no energy to the patient. I merely omit the supply of electricity. By your strict process view, I didn't cause the death; the patient's underlying condition did. But the law and our intuition say I did. You say that's just moral responsibility, not causation. But if causation is supposed to be the bedrock of explanation, and your bedrock excludes the most significant factor in the explanation—the human intervention that was withheld—then your theory of causation is ontologically pure but explanatorily bankrupt. You're left saying the lifeguard is guilty of causing the death, but technically, he didn't cause it. That's a semantic game, not a solution.

  **Marcus:** It's not a game; it's precision. If we call omissions causes, we lose the ability to distinguish between what *happened* and what *didn't*. That distinction matters for science. If I'm modeling the fluid dynamics of the drowning, the lifeguard's attention level is not a variable in my equation. The water's density is. You want causation to cover everything from fluid dynamics to employment contracts. I want it to cover how the world pushes itself around. You solve the profligacy problem by appealing to "norms," which are subjective. I solve the intuition problem by separating moral blame from physical production. You keep the blame but corrupt the physics. I keep the physics and locate the blame elsewhere. Neither of us has to concede the utility of our own domains, but don't pretend your "contextual salience" is found in the water.

  **Elena:** And don't pretend your "physical production" explains why we fire the lifeguard and not the ocean. We operate in a world of agents and expectations, not just billiard balls. If your theory can't account for the fact that removing the lifeguard's negligence removes the death in the same robust way that removing the water would, then it's you who is ignoring the dependency that actually matters to us.

  **Marcus:** Dependency isn't causation. Correlation isn't causation. And absence isn't presence. We can agree the lifeguard should be fired, but we won't agree on what word describes his relationship to the corpse.

  **Elena:** Then we're done. The swimmer is still dead, and we still disagree on why.

  **Marcus:** Precisely. Which proves there's a difference between the event and our description of it.
