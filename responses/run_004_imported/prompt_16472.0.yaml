answer: |-
  Here is a sequence of ten questions designed to corner the "guilt/liability" distinction, moving from legal theory to the phenomenology of punishment, and finally to the theological stakes. Each includes a follow-up tailored to the specific Lewisian defense your guest is likely to mount.

  ### 1. The Foundation
  **Question:** Let's start with the architecture of the view. You defend David Lewis's claim that punishment tracks "liability" rather than "guilt," analogous to how a bank doesn't care who pays a debt, only that it gets paid. But in ordinary morality, we treat debt and punishment as fundamentally different categories. If I pay your mortgage, you're relieved; if I serve your prison sentence, we call it a scandal. Why should we accept the debt analogy as the starting point rather than the intuition that punishment is inherently personal?

  **Follow-up:** *If she replies that our intuition is just a cultural habit and not logical necessity:* "If it's just a habit, why is it a habit that persists in every legal system we know of? At what point does a universal moral intuition count as data that a theory needs to explain, rather than a bug the theory can overwrite?"

  ### 2. The Civil/Criminal Asymmetry (Required)
  **Question:** Your model relies heavily on the transferability of liability. Yet, our own legal system draws a hard line here. In civil law, vicarious liability is routine—employers pay for employees, insurers for the insured. But in criminal law, you cannot serve time for another person, even voluntarily. If liability is truly as fungible as you claim, how do you explain the criminal law's stubborn refusal to treat liability the same way civil law does?

  **Follow-up:** *If she argues that criminal law serves different public interests (deterrence, safety):* "But if the *justice* of the transaction allows for substitution, why does the state's interest override justice? Are you saying penal substitution is morally coherent but administratively inconvenient, or are you saying the state recognizes something about guilt that your theory excludes?"

  ### 3. The Nature of Suffering (Required)
  **Question:** Let's move from fines to flesh. It's easy to imagine transferring a financial liability; money is fungible. It is much harder to imagine transferring the experience of incarceration. If a volunteer sits in a cell for ten years, they suffer the deprivation of liberty, not the original offender. Does the fact that the *suffering* attaches to the substitute's body, not the guilty party's, break the link between the crime and the punishment?

  **Follow-up:** *If she says the body doesn't matter, only the "cost" matters:* "But punishment isn't just a cost; it's a restriction on agency. If the person who lost their agency (the criminal) doesn't feel the restriction, and the person who feels it (the volunteer) didn't lose it, hasn't the specific moral injury of the crime gone unaddressed?"

  ### 4. Retribution and Meaning
  **Question:** Many philosophers argue that punishment is essentially retributive—it's about giving the offender what they *deserve*. If liability transfers but guilt stays fixed, the person suffering doesn't deserve it, and the person who deserves it doesn't suffer. Doesn't this drain the punishment of its moral meaning? Can you have "just punishment" without "deserved suffering"?

  **Follow-up:** *If she distinguishes "desert" from "liability":* "That sounds like a semantic shield. If I am liable to suffer but do not deserve to suffer, in what sense is my suffering 'just'? Isn't 'justice without desert' just a synonym for 'organized infliction of pain'?"

  ### 5. The Imputed Guilt Trap (Required)
  **Question:** This brings us to the theological application. In penal substitution, Christ is treated *as if* he were guilty to satisfy the liability. But to punish someone, you generally have to accuse them of something. If the system treats Christ as guilty for the purpose of the sentence, even if he isn't "intrinsically" guilty, haven't you reintroduced imputed guilt by the back door?

  **Follow-up:** *If she insists it's a legal fiction, not actual guilt:* "But if the punishment requires the *appearance* of guilt to function, does the distinction do any work? If God treats him as guilty, and we treat him as guilty, and the punishment fits the guilty, what is left of the claim that guilt didn't transfer?"

  ### 6. The Communicative Function
  **Question:** Modern theories of punishment often emphasize its communicative function: society condemning a specific wrongdoer. If a substitute takes the penalty, what message is being sent? It seems the message becomes confused: we are condemning the crime, but honoring the sufferer. Does this split the moral signal in a way that makes the punishment unintelligible?

  **Follow-up:** *If she argues the message is about the debt being paid, not the person:* "But criminal punishment isn't a receipt; it's a censure. If the censure lands on an innocent head, even a willing one, doesn't that corrupt the moral language the legal system is trying to speak?"

  ### 7. Historical Precedents (Required)
  **Question:** You've argued that our resistance to substitution is theoretical, not historical. But look at practices like the "whipping boy" in early modern Europe, or ancient scapegoat rituals. We now look back on those not as valid forms of justice, but as injustices or superstitions. Does the fact that we now universally reject those practices suggest we've learned that liability *cannot* be separated from guilt, rather than just that we changed our minds?

  **Follow-up:** *If she says those were unjust because the substitute didn't consent:* "So consent is the only variable? If the whipping boy had signed a contract, would that practice be morally sound today? If not, what other moral fact are you relying on?"

  ### 8. The Deflection (Meta-Question)
  **Question:** I want to press on a move you've made in previous debates. When critics say this separation of guilt and liability feels artificial, you often respond that they are "smuggling in a transfer of guilt" that your view doesn't require. Can you give me a concrete, non-theological example where a person is fully liable for punishment, completely free of guilt, and where punishing them feels intuitively just to everyone involved?

  **Follow-up:** *If she returns to the abstract definition of liability:* "I'm asking for the intuition pump. If the only place this works is in the specific case of Christ, doesn't that suggest the theory was reverse-engineered to save the doctrine, rather than derived from a general principle of justice?"

  ### 9. Moral Residue
  **Question:** Let's look at the original offender. In your model, their liability is discharged by another. Do they still owe anything? Specifically, do they still owe the moral burden of shame or regret? If they don't, because the debt is paid, haven't you severed the link between crime and moral growth?

  **Follow-up:** *If she says they still feel shame because they are still guilty:* "Then what work did the punishment do? If they still carry the moral stain of guilt after the punishment is complete, the punishment didn't resolve the moral situation. It just inflicted pain on a third party."

  ### 10. Falsification (Required)
  **Question:** To close, I want to ask about the limits of your own conviction. You've built a robust defense of this coherence. But what would you need to see or hear to conclude that penal substitution is *not* coherent after all? Is there a logical contradiction, a moral intuition, or a legal principle that, if proven, would force you to abandon the guilt/liability split?

  **Follow-up:** *If she says the view is logically airtight:* "If no evidence could change your mind, are we discussing a philosophical argument, or are we discussing a form of faith that uses philosophical language? Where is the risk in your position?"
