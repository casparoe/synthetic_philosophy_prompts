prompt: |-
  Aquinas never encountered the modern dispute between textualism, which holds that judges should adhere to a law's enacted text even against its apparent purpose, and purposivism, which holds that text should yield to that purpose when the two diverge. Yet his treatise on law contains real material bearing on it: in the Summa Theologiae, I-II, q. 96, a. 6, he argues that a law binds according to the lawgiver's intention rather than its bare wording, illustrating the point with a besieged city whose standing order to keep the gates shut ought to be disregarded for citizens fleeing the enemy, since obeying the letter there would defeat the very purpose the order serves; he treats the corresponding virtue of equitable judgment, epikeia, at II-II, q. 120. Elsewhere in the same treatise, however, he insists that private individuals may not simply override the letter with their own judgment of the common good except in cases of manifest and urgent necessity, since interpreting the law in less clear cases belongs to those who hold public authority. Working only from these actual commitments — on natural law, the common good, and who has standing to interpret — would you expect him to side more with the textualists or with the purposivists, and why? Defend your answer against the strongest textual evidence for the opposite reading.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the Prompt:**
      *   **Subject:** Thomas Aquinas's legal philosophy (specifically *Summa Theologiae* I-II, q. 96, a. 6 and II-II, q. 120).
      *   **Modern Context:** The dispute between Textualism (adhere to text even against purpose) and Purposivism (text yields to purpose when they diverge).
      *   **Key Aquinas Commitments provided:**
          1.  Law binds according to the lawgiver's intention, not just bare wording (Besieged city example).
          2.  Virtue of *epikeia* (equity) corrects the law when the letter defeats the purpose.
          3.  Private individuals cannot override the letter based on private judgment of the common good *except* in manifest/urgent necessity.
          4.  Interpretation in less clear cases belongs to public authority.
          5.  Underlying principles: Natural law, Common good, Standing to interpret.
      *   **Task:** Determine whether Aquinas would side more with Textualists or Purposivists based *only* on these commitments.
      *   **Requirement:** Defend the answer against the strongest textual evidence for the opposite reading.

  2.  **Initial Assessment & Categorization:**
      *   *Textualism:* Focus on the enacted text. Skeptical of judicial discretion to find "purpose" that contradicts text. Emphasizes rule of law, predictability, and democratic legitimacy (lawgiver's will as expressed in text).
      *   *Purposivism:* Focus on the goal/intent of the law. Willing to bend text to achieve the purpose. Emphasizes substantive justice and the spirit of the law.
      *   *Aquinas's Position:* He explicitly says intention > wording (Purposivist lean). *However*, he restricts who can make that call (Public Authority vs. Private Individuals) and limits it to cases where the letter defeats the purpose (Textualist constraint on *who* and *when*).

  3.  **Formulating the Thesis:**
      *   Aquinas is not a perfect fit for either modern category, but if forced to choose, he aligns more closely with **Purposivism**, *but* a specific kind of "Institutional Purposivism" rather than "Judicial Activism."
      *   *Wait, let's look closer.* Modern Textualists argue that the text *is* the law, and searching for subjective intent is dangerous. Aquinas argues the *intention* is the soul of the law. This is fundamentally Purposivist.
      *   *However*, the prompt asks to weigh the commitment to "public authority interpretation" vs. "intention over wording."
      *   *Refined Thesis:* Aquinas would side with **Purposivism** regarding the *nature* of law (intent rules), but with significant **Textualist-adjacent constraints** regarding *procedure* (only authorities can deviate, and only in clear cases). Ultimately, the metaphysical priority of intention makes him a Purposivist at heart, but he would reject the modern liberal version of purposivism that allows individual judges broad discretion.
      *   *Actually, looking at the prompt's constraint:* "Working only from these actual commitments... would you expect him to side more with the textualists or with the purposivists?"
      *   If a Textualist says "Follow the text even if it seems absurd," Aquinas says "No, follow the intention." That is a Purposivist stance.
      *   If a Purposivist says "Judges should find the purpose and apply it," Aquinas says "Yes, but be careful about who does it."
      *   *Decision:* He is a **Purposivist**. The core definition of law for him is an ordinance of reason for the common good. If the text violates reason/common good (the purpose), it fails to be law in that instance. Textualism's core tenet (text overrides purpose) is incompatible with Aquinas's core tenet (intention overrides text).

  4.  **Developing the Argument (The "Why"):**
      *   **Core Metaphysics:** Law is an ordinance of reason. The "letter" is the vehicle; the "intention" is the soul. A dead letter is not law.
      *   **The Besieged City:** This is the smoking gun. Textualism would say "Keep the gates shut." Aquinas says "Open them." This is the definition of purposive interpretation.
      *   **Epikeia:** This virtue exists specifically to correct the legal universal when it fails the particular case due to the lawgiver's limited foresight. Textualism generally rejects *epikeia* as judicial legislation.
      *   **Common Good:** The end of law is the common good. If the text harms the common good, the text must yield.

  5.  **Addressing the Counter-Argument (The "Textualist" Evidence in Aquinas):**
      *   **The Constraint:** Private individuals cannot interpret. Only public authority.
      *   **The Constraint:** Only in "manifest and urgent necessity."
      *   **Why this looks Textualist:** It emphasizes stability, rule-following, and distrust of individual discretion. It prevents the "living constitution" slide where every judge imposes their own "purpose."
      *   **Rebuttal:** This isn't Textualism; it's *Institutional Hierarchy*. Aquinas isn't saying "The text is supreme." He is saying "The *Lawgiver's* intent is supreme, and the Lawgiver's designated agents are the only ones trusted to discern it when it's not obvious." If the necessity is *manifest*, even a private person can act (self-defense analogy). The restriction is on *usurpation of authority*, not on the supremacy of purpose over text.

  6.  **Synthesizing and Refining:**
      *   *Nuance:* Modern Textualism often claims to serve the "rule of law" and "democratic will." Aquinas cares about these too (via public authority). But his mechanism is different.
      *   *Distinction:* Modern Purposivism often empowers judges to rewrite laws. Aquinas empowers the *lawgiver's intent* (which might be discovered by judges, but ultimately belongs to the sovereign).
      *   *Conclusion:* He is a **Teleological Purposivist**. The *telos* (end) governs the *lex* (law).
      *   *Strongest Counter:* The restriction on private judgment looks like a restriction on purposive reasoning.
      *   *Defense against Counter:* That restriction protects the *true* purpose (order/common good) from private error. It doesn't elevate the text above the purpose; it elevates the *competent interpreter of the purpose* above the *incompetent interpreter*.

  7.  **Drafting the Response (incorporating the constraints):**
      *   *Introduction:* State the position clearly (Purposivist). Define the terms in Aquinas's context.
      *   *Argument for Purposivism:*
          *   Nature of Law (Reason/Will vs. Words).
          *   *Epikeia* (ST II-II, q. 120).
          *   The Besieged City example (ST I-II, q. 96, a. 6).
          *   The Common Good as the ultimate metric.
      *   *The Textualist Counter-Evidence:*
          *   Restriction on private interpretation.
          *   Requirement of "manifest necessity."
          *   Respect for public authority.
      *   *Rebuttal/Defense:*
          *   Distinguish between *ontological priority* (Purpose > Text) and *procedural authority* (Who decides).
          *   Aquinas's restriction is about preventing anarchy, not enforcing the letter when it harms the good.
          *   Textualism forbids deviating even in manifest necessity if the text is clear. Aquinas permits it.
      *   *Conclusion:* Summarize. Aquinas is a purposivist who demands institutional discipline.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I rely on outside knowledge? The prompt says "Working only from these actual commitments." I need to stick closely to the provided summary of I-II, q. 96, a. 6 and II-II, q. 120, plus general natural law/common good mentions in the prompt.
      *   *Check:* Did I address the "strongest textual evidence for the opposite reading"? Yes, the restriction on private judgment is the strongest Textualist-leaning point.
      *   *Check:* Is the distinction between modern Textualism/Purposivism and Aquinas clear? I need to make sure I don't conflate them entirely. Aquinas isn't a modern judge. But the *principle* of interpretation is the key.

  9.  **Final Polish:** Ensure the tone is analytical and philosophical. (Proceed to generate output based on this structure.)
answer: |-
  Based on the commitments provided from the *Summa Theologiae*, Thomas Aquinas would side more closely with **purposivism**, though with a specific institutional caveat that distinguishes him from some modern iterations of that view.

  While Aquinas shares the textualist concern for legal stability and the proper locus of authority, his metaphysical understanding of what law *is* renders the textualist core premise—that the enacted text binds even against the lawgiver's intention—untenable. For Aquinas, the text is merely the vessel; the intention directed toward the common good is the substance.

  ### The Case for Aquinas as a Purposivist

  Aquinas's alignment with purposivism rests on three pillars derived from the provided text: the ontology of law, the virtue of *epikeia*, and the primacy of the common good.

  **1. The Ontology of Law: Intention Over Wording**
  Modern textualism posits that the "law" is the enacted text itself, and that searching for subjective intent outside that text undermines democratic legitimacy and predictability. Aquinas explicitly rejects this ontology in I-II, q. 96, a. 6. He argues that a law binds "according to the lawgiver's intention rather than its bare wording."

  For Aquinas, human law is a dictate of reason. Words are the signs of that reason. If the signs (text) contradict the thing signified (reason/intention) due to the limitations of language or unforeseen circumstances, the sign must yield to the thing. In the example of the besieged city, the text ("keep the gates shut") is clear. A textualist judge would argue that opening the gates violates the law, regardless of the outcome. Aquinas argues that obeying the text in that specific instance would defeat the *purpose* of the order (the safety of the city). Therefore, the law does not bind in that instance. This is the definitional core of purposivism: when text and purpose diverge, purpose governs.

  **2. The Virtue of *Epikeia***
  In II-II, q. 120, Aquinas treats *epikeia* (equity) not as a loophole, but as a higher form of justice. He describes it as a correction of the law where it is defective due to its universality. Laws are framed to cover general cases; they cannot foresee every particular contingency. When a particular case arises where following the universal text harms the common good (the law's purpose), *epikeia* demands the text be set aside.

  Textualism generally views such "correction" as judicial legislation—an usurpation of the lawmaker's role. Aquinas views it as a moral necessity. To follow the text when it contradicts the purpose is, for Aquinas, to act unjustly. A jurisprudence that demands adherence to the text *even when* it defeats the purpose is, in Aquinas's framework, a jurisprudence that demands injustice.

  **3. The Common Good as the Final Cause**
  Aquinas's legal theory is teleological. The "common good" is the end (*telos*) of law. If the text becomes an obstacle to the end, it ceases to function as law in that specific application. Textualism often prioritizes the *rule of law* (predictability, fixed rules) as a good in itself. For Aquinas, the rule of law is instrumental to the common good. If the instrument breaks the thing it is meant to build, the instrument must be adjusted.

  ### The Strongest Textualist Evidence: Institutional Restraint

  The strongest evidence for a textualist reading of Aquinas lies in his restrictions on *who* may deviate from the text and *when*.

  Aquinas insists that private individuals may not override the letter of the law based on their own judgment of the common good, except in cases of "manifest and urgent necessity." He reserves the interpretation of law in "less clear cases" to those holding public authority.

  A modern textualist would seize on this to argue that Aquinas prioritizes institutional stability and the supremacy of the enacted rule over individual moral reasoning. Textualism argues that judges should not become "philosopher-kings" imposing their own view of the good. Aquinas seems to agree: he warns against private individuals deciding that a law is unwise or counterproductive. He demands that the text be followed unless the necessity is *manifest* (obvious to all) and *urgent* (no time to consult authority). This looks like a textualist constraint: stick to the text unless the absurdity is undeniable.

  ### Defense Against the Textualist Reading

  While Aquinas's procedural constraints resemble textualist concerns about judicial overreach, they do not make him a textualist in principle. The distinction lies in the difference between **ontological priority** (what is the law?) and **procedural authority** (who decides?).

  **1. Restraint Protects Purpose, Not Text**
  Aquinas restricts private interpretation not because the text is sacred, but because private judgment is fallible. If every individual could disregard the text based on a private calculation of the "common good," the actual common good (which requires social order) would be destroyed.
  However, note the exception: "manifest and urgent necessity." In the besieged city example, the necessity is manifest. Aquinas does not say the citizens must wait for the governor to open the gates while the enemy enters. He implies they may act.
  A true textualist argues that even in cases of apparent absurdity or necessity, if the text is clear, the judge/private citizen must follow it and seek legislative remedy later. Aquinas explicitly permits the text to be disregarded *in the moment* if the purpose is clearly being thwarted. This is a purposivist escape valve that textualism seeks to weld shut.

  **2. Authority Interprets Intent, Not Just Words**
  Aquinas reserves ambiguous cases for public authority. But what is the authority doing when they interpret? They are not merely parsing grammar (textualism); they are discerning the "lawgiver's intention."
  If Aquinas were a textualist, he would argue that in unclear cases, the judge should stick to the most natural reading of the words. Instead, Aquinas implies the authority must seek the *intent*. If the authority determines the intent contradicts the words, the intent wins. The restriction is simply that *private* citizens cannot make that call lightly. This is an argument about jurisdiction, not about the supremacy of text over purpose.

  **3. The "Manifest Necessity" Standard is Purposive**
  The standard for overriding the text is "necessity" regarding the "common good." These are purposive standards, not textual ones. A textualist standard for deviation might be "ambiguity" or "grammatical impossibility." Aquinas's standard is "harm to the end of the law." By making the *consequence* (defeating the purpose) the trigger for deviation, Aquinas anchors his theory in purposivism.

  ### Conclusion

  Aquinas would reject modern textualism because it severs the legal bond from the rational intent that gives it life. To Aquinas, a law that commands evil (or defeats its own good purpose) in a particular case is not binding in that case.

  However, he would also critique modern purposivism if it implies that any judge may freely substitute their own policy preferences for the text. Aquinas is an **Institutional Purposivist**. He believes the *purpose* rules the *text*, but he trusts the *lawgiver's designated authority* (not individual judges or citizens) to identify that purpose when it is not manifest.

  Ultimately, if forced to choose between a judge who follows the text to a harmful absurdity (Textualism) and a judge who follows the purpose to avoid that absurdity (Purposivism), Aquinas's doctrine of *epikeia* and the besieged city example compel him to choose the latter. The text serves the good; the good does not serve the text.
