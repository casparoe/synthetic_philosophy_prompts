      *   Check against the user's specific request for 8-9 questions. (I have 9 drafted above).
      *   *Self-Correction on Q3:* Make sure the tension between Minimalism and Assertability is clear. Minimalism says truth isn't substantial. Kripke says we *replace* truth conditions. If truth isn't substantial, why replace it?
      *   *Self-Correction on Q1 (Crusoe):* Ensure the follow-up addresses Kripke's specific text (footnote/section reference implies deep knowledge).

  5.  **Final Review against constraints:**
