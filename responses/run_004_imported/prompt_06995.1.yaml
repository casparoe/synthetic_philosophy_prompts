          *   *Critique:* Standard objection. Needs to be sharper. Focus on the *normativity*.
          *   *Refinement:* Frame it as "relocating the finitude problem." If the community is finite, they haven't checked all cases. Why is *their* agreement normative rather than just a brute fact?
          *   *Follow-up:* If she appeals to "idealized" agreement, press on how we access the ideal. If she sticks to actual agreement, press on the "wrongness" intuition.

      *   *Requirement 3: Assertability vs. Truth Minimalism.*
          *   *Draft 1:* You say assertability not truth. But if truth is minimal, does it matter?
          *   *Critique:* A bit clunky. Needs to connect the deflationary truth view with the skeptical solution.
          *   *Refinement:* If truth conditions are just disquotational, isn't the "skeptical solution" just a verbal shuffle? If "It is true that he means plus" is just equivalent to "He means plus," and we have assertability conditions for the latter, haven't we just smuggled truth conditions back in?
          *   *Follow-up:* If she says minimalism saves it, ask about the *substantial* difference the skeptical solution is supposed to make.

      *   *Filling the remaining 5-6 questions:*
          *   Need to cover: Normativity, Memory, Training/Initiation, The "Skeptical" label, Practical implications, Comparison to other readings (e.g., McDowell).
          *   *Question 4 (Normativity):* How does communal agreement generate *normativity* (ought) rather than just *regularity* (is)? This is the heart of the Humean/Kantian tension.
          *   *Question 5 (Memory):* Kripke dismisses memory as a fact. How does the communitarian view rehabilitate memory without making it a private fact?
          *   *Question 6 (Initiation):* How does a child enter the community if they don't already follow rules? (The bootstrapping problem).
          *   *Question 7 (McDowell/Realist alternative):* Why prefer this over McDowell's "quietist" reading where we just see the fact directly?
          *   *Question 8 (Solitary Genius):* What about mathematicians who work alone and are later vindicated? (Wiles, Perelman). How does the community sanction *future* agreement?
          *   *Question 9 (The 'Skeptical' Label):* Is this actually skepticism or just a change of subject?

  4.  **Refining and Polishing:**
      *   Ensure the tone is respectful but probing (podcast style).
