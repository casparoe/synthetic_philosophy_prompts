          *   *Critique:* Too basic. Needs to press the *why*.
          *   *Refinement:* Focus on the *temporal* aspect. If Crusoe checks himself against his past self, is that a "community of one"?
          *   *Follow-up:* If she says "No, he needs others," press on the intuition that he *does* calculate correctly. If she says "Yes, he counts as a community," press on what makes two people different from one person's temporal stages.

      *   *Requirement 2: Community Error (The Finitude/Relocation Objection).*
