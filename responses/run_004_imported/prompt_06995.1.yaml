  2.  **Deconstruct the Subject Matter (Kripkenstein/Communitarian Skepticism):**
      *   *The Paradox:* No fact about an individual determines what they mean by a symbol (e.g., '+'). Past usage is compatible with multiple future interpretations (quus vs. plus).
      *   *The Skeptical Solution:* Meaning isn't truth-conditional but assertability-conditional. We are licensed to say someone means something based on communal agreement.
      *   *Communitarian View:* A solitary individual cannot follow a rule. It requires a community to check/correct.
      *   *Objections:*
          *   *Crusoe:* Can't a lone person follow a rule? (Kripke says maybe, but it's shaky).
          *   *Community Error:* If the community agrees on '125' for '68+57', but they are all wrong (according to some Platonic standard), doesn't skepticism return? (Kripke says there is no "wrong" outside the community).
          *   *Truth Minimalism:* If truth is just disquotational/minimal, does "assertability" do enough work?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Robinson Crusoe.*
