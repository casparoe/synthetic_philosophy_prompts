answer: |-
  **Title:** The Price of Truth: Defending Contextualist Propositionalism Against Lewis's Triviality

  **Introduction**

  In the landscape of philosophical logic and semantics, few results are as destabilizing as David Lewis's triviality theorems regarding indicative conditionals. Lewis demonstrated that two highly intuitive principles regarding "if-then" statements are mathematically incompatible. The first is that indicative conditionals express ordinary propositions (they have truth conditions). The second is "The Equation" (also known as Adams' Thesis), which states that the probability of a conditional, $P(A \to B)$, must equal the conditional probability of the consequent given the antecedent, $P(B|A)$. Lewis proved that if both hold generally, probability distributions collapse into triviality, allowing agents to hold beliefs only in tautologies or contradictions. Since human belief is not trivial, one of the principles must be abandoned.

  This essay weighs the two primary responses to this dilemma: the non-propositional view championed by Ernest Adams and Dorothy Edgington, and the propositional view defended by Robert Stalnaker and Frank Jackson. While the non-propositional view offers a pristine account of probabilistic reasoning, it fails to account for the logical behavior of conditionals in complex sentences. Consequently, I argue that we must retain the propositional status of conditionals. However, to avoid triviality without sacrificing the insights of Adams, we must adopt a **Contextualist Propositionalism**. This view preserves truth-conditions while blocking Lewis's proof by rejecting the assumption that the proposition expressed by a conditional remains fixed across changes in probability.

  **The Triviality Result**

  To understand the stakes, one must grasp the mechanism of Lewis's proof. The proof relies on the assumption that the proposition expressed by $A \to B$ is independent of the probability function $P$. If $A \to B$ expresses a fixed proposition $X$, then as we update our beliefs (changing $P$), $X$ remains the same object. Lewis showed that if $P(X) = P(B|A)$ holds for all possible probability functions $P$, then $P(B|A)$ must equal $P(B)$ whenever $A$ is compatible with $B$. This implies that learning $A$ provides no information about $B$, rendering most conditional beliefs impossible.

  Thus, we face a forced choice. We can deny that conditionals express propositions (denying $X$ exists), or we can deny that their probability always matches conditional probability (denying the Equation holds for all $P$).

  **The Non-Propositional Route: Adams and Edgington**

  The most direct response to Lewis is to accept the Equation and reject Propositionality. This is the route taken by Ernest Adams and later refined by Dorothy Edgington. On this view, conditionals do not describe facts; they are not truth-apt. Instead, they are sui generis linguistic devices that express "conditional beliefs." To assert "If it rains, the match will be cancelled" is not to assert a fact about the world, but to express a high degree of confidence in the cancellation *given* the rain.

  The primary virtue of this view is that it respects the overwhelming intuitive data regarding assertion. When we debate conditionals, we rarely argue about truth conditions; we argue about probabilities. If I say, "If the switch is flipped, the light will turn on," and you disagree, you are typically claiming that the conditional probability is low (perhaps the bulb is blown), not that there is a specific possible world where the switch is flipped and the light is off that makes my statement false. The Adams/Edgington view captures this perfectly: the Equation is not just a constraint, it is the definition of the conditional's meaning.

  However, this view incurs a devastating cost: the Embedding Problem. Natural language allows conditionals to be embedded within negations, disjunctions, and the antecedents of other conditionals. Consider: "If it is not the case that if A then B, then C." Standard logic requires that for a negation to operate on a clause, that clause must have a truth value. If $A \to B$ lacks a truth value, the negation "It is not the case that..." becomes semantically inert. While proponents have developed complex "probability logics" to handle some embeddings, they struggle to provide a unified semantics that matches the compositional power of classical logic. If conditionals cannot be true or false, it becomes difficult to explain how we can know them, remember them, or use them in reductio ad absurdum arguments. A semantics that isolates conditionals from the rest of our logical vocabulary is theoretically costly.

  **The Propositional Route: Stalnaker, Jackson, and Contextualism**

  The alternative is to maintain that conditionals express propositions. This preserves classical logic and solves the embedding problem immediately. If "If A then B" is true or false, then "Not (If A then B)" is perfectly coherent. However, this requires rejecting the universal validity of the Equation.

  Frank Jackson attempted to save the Equation by arguing that while the *truth conditions* of a conditional might be material (true whenever $A$ is false or $B$ is true), the *assertability conditions* are governed by $P(B|A)$. This preserves Propositionality but makes the Equation a pragmatic rule rather than a semantic identity. While clever, this feels like a maneuver to dodge the bullet; it fails to explain why the probability intuition feels so semantic rather than pragmatic.

  A more robust defense is **Contextualist Propositionalism**, associated with Stalnaker and Angelika Kratzer. This view argues that Lewis's triviality proof relies on a hidden assumption: that the proposition expressed by $A \to B$ is invariant across different probability functions. Contextualists deny this. They argue that conditionals contain a covert modal operator whose domain is restricted by the "if"-clause. Crucially, the domain of this modal is determined by the context, which includes the speaker's information state (and thus their probability function).

  When the probability function $P$ changes (e.g., by learning new information), the context changes. If the context changes, the proposition expressed by $A \to B$ may also change. Lewis's proof requires holding the proposition fixed while varying $P$. If the proposition shifts alongside $P$, the mathematical derivation of triviality is blocked.

  **Verdict: In Favor of Contextualist Propositionalism**

  We must commit to a verdict. While the Adams/Edgington view is honest about the probabilistic nature of conditional reasoning, it is ultimately untenable as a general theory of meaning. The ability to embed conditionals is not a fringe feature of language; it is central to how we reason. We constantly reason about the falsity of conditionals ("Your claim that if taxes are cut, growth will follow, is false") and use them in complex hypotheticals ("If, if A then B, then C"). A theory that renders these sentences semantically defective forces us to rewrite the laws of logic to accommodate a specific class of sentences. This is an excessive price to pay to save the Equation.

  Therefore, we must retain Propositionality. Conditionals express propositions. But does this mean we must abandon the Equation entirely? No. This is where Contextualist Propositionalism offers the superior path. It allows us to keep truth-conditions (solving the embedding problem) while explaining why the Equation *seems* universally true.

  In ordinary conversation, the context is usually fixed. Within a fixed context, the proposition expressed by $A \to B$ is stable, and its probability will align with $P(B|A)$ relative to that context's modal base. The Equation holds *locally*, which explains our intuitions. Lewis's triviality result only arises when we demand the Equation hold *globally* across all possible probability updates. By recognizing that the semantic content of a conditional is sensitive to the information state (context), we acknowledge that updating probabilities can shift the very proposition being evaluated.

  This view is superior because it integrates conditionals into the broader semantics of modals. Just as "must" and "might" are context-sensitive, so too is "if." It preserves the logical utility of truth-conditions, allowing conditionals to function in negation and embedding, while dissolving the triviality result by rejecting the invariance assumption. It acknowledges that Lewis was right about the math but wrong about the semantics: conditionals are propositions, but they are not the *fixed* propositions Lewis assumed.

  **Conclusion**

  Lewis's triviality results force a choice between the logic of conditionals and the probability of conditionals. The non-propositionalist chooses probability and sacrifices logic; the rigid propositionalist chooses logic and sacrifices probability. The correct path is to recognize that this is a false dichotomy born of an oversimplified semantics. By adopting Contextualist Propositionalism, we secure the truth-aptness required for logic and embedding, while explaining the probabilistic intuitions as features of context-relative evaluation. We save the Equation as a rule of assertion within a context, rather than a law of semantics across all contexts. In doing so, we preserve the richness of human reasoning without collapsing into triviality.
