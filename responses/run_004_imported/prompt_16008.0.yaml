prompt: |-
  I'm on the small committee at my company that reviews and signs off on postmortems for our worst ("Sev-1") incidents before they go out to the rest of engineering, and a write-up we're finalizing this week has turned into a bigger disagreement than I expected. Three weeks ago, a refactor removed a validation check on one field in our checkout flow; when that field arrived null from a client we don't fully control, a downstream pricing service threw an unhandled exception and took the whole checkout path down for about fifty minutes. The draft postmortem, written by the incident commander, names the missing check (and the missing regression test that would have caught its removal) as the "root cause," and recommends a coaching conversation with the engineer who did the refactor.

  Half the committee thinks that's reasonable; the other half points out that at least three other omissions were just as necessary for the outage to happen: the reviewer approved the pull request without flagging that the change had no new test coverage, a ticket asking for broader edge-case tests on exactly that code path had been sitting deprioritized in the backlog for eight months, and the alert that would have caught the malformed requests within two minutes had been muted after a false-positive spree the previous quarter, with the ticket to re-tune it left untouched since. If any single one of those four things had gone differently, we don't have an outage — so strictly by that test we have four root causes, or none, and "root cause" stops doing any real work. One of our staff engineers, who reads philosophy outside of work, told me this is basically an old and apparently unresolved problem philosophers call "causation by omission," which didn't leave me feeling much better about Thursday.

  Could you draft the memo I'll bring into Thursday's meeting? It needs to do two concrete things: recommend how the postmortem should describe causation in this specific case — keep the engineer's omission as the named root cause, list several contributing causes with no ranking among them, retire "root cause" language for this class of incident altogether, or something else you think fits better — and state a rule the committee could actually reuse the next time several omissions all pass the "it wouldn't have happened otherwise" test, so we're not relitigating this from scratch every quarter. Whatever you recommend, take seriously the strongest argument for keeping a single named cause — that spreading responsibility across four different omissions means no one in particular is on the hook to fix anything — rather than dismissing it as just blame culture. And keep it something the committee could act on inside our one-hour meeting, not a philosophy seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A committee reviewing a Sev-1 postmortem.
      *   **The Incident:** A refactor removed a validation check. A null field from an external client caused a downstream exception, taking checkout down for 50 mins.
      *   **The Conflict:**
          *   *Side A:* Names the missing check (and missing test) as the "root cause." Recommends coaching the engineer who did the refactor.
          *   *Side B:* Points out three other necessary conditions (reviewer missed it, backlog ticket deprioritized, alert muted/untuned). Argues that strictly speaking, there are four root causes or none ("causation by omission" problem).
      *   **The Goal:** A memo for the Thursday meeting.
      *   **Requirements:**
          1.  Recommend how to describe causation in *this* specific case.
          2.  State a reusable rule/policy for future cases with multiple omissions.
          3.  Address the "diffusion of responsibility" argument (if everyone is responsible, no one is) seriously.
          4.  Keep it actionable (fit for a 1-hour meeting), not philosophical.

  2.  **Deconstruct the Problem:**
      *   **Philosophical Trap:** The "causation by omission" debate is real but paralyzing in an engineering context. If we say "everything caused it," we fix nothing. If we say "one person caused it," we ignore systemic issues and risk blame culture.
      *   **Practical Reality:** Postmortems are tools for prevention, not just truth-seeking. The language needs to drive action.
      *   **The "Diffusion of Responsibility" Concern:** This is valid. If the postmortem says "Systemic failure," often the action item is "Improve culture," which is vague. If it says "Engineer X missed a check," the action is "Engineer X gets coached." We need a middle ground that assigns *action ownership* without assigning *moral blame*.

  3.  **Determine the Recommendation (Causation Model):**
      *   *Option 1: Single Root Cause.* Too simplistic, ignores the alert/review/backlog issues. Risks scapegoating.
      *   *Option 2: No Root Cause / "Root Causes" (Plural).* Confusing, dilutes accountability.
      *   *Option 3: Retire "Root Cause" entirely.* Good long-term, but might feel like dodging the issue now.
      *   *Option 4: "Trigger" vs. "Contributing Factors" + Action Owners.* This is the industry standard for high-reliability organizations (like SRE/DevOps best practices).
      *   *Decision:* I should recommend retiring "Root Cause" language in favor of "Triggering Event" and "Contributing Factors," *but* crucially, every factor must have an assigned owner for remediation. This addresses the diffusion of responsibility concern.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the deadlock and the stakes. Validate both sides (technical accuracy vs. accountability).
      *   **Recommendation 1 (This Incident):** How to write *this* postmortem.
          *   Don't use "Root Cause."
          *   Identify the *Trigger* (the refactor removing the check).
          *   Identify *Contributing Factors* (Review process, Backlog prioritization, Alerting hygiene).
          *   **Crucial:** Assign Action Items to *each*. The engineer gets coaching/training (not punishment), the reviewer gets process feedback, the product owner gets backlog grooming, the on-call lead gets alert tuning.
      *   **Recommendation 2 (Future Policy):** A reusable rule.
          *   The "Actionability Test." A cause is only valid if it leads to a specific, owned action item.
          *   Shift from "Who broke it?" to "What allowed it to break?"
      *   **Addressing the Accountability Concern:** Explicitly tackle the "diffusion of responsibility" argument.
          *   Acknowledge that "systemic" shouldn't mean "no one."
          *   Define accountability as *ownership of the fix*, not *liability for the break*.
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Tone:**
      *   Needs to be decisive but collaborative.
      *   Avoid philosophical jargon (even though the prompt mentions it).
      *   Focus on *utility*.
      *   Ensure the "coaching conversation" isn't thrown out entirely but reframed. It shouldn't be punitive, but it should happen.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is retiring "Root Cause" too radical for this committee?
      *   *Adjustment:* Maybe offer it as "Triggering Cause" vs. "Systemic Contributors." Actually, the prompt asks to choose: keep single, list several, retire, or something else. "Something else" (Trigger + Contributors) is usually the best engineering practice. I will advocate for retiring "Root Cause" in favor of "Primary Trigger" and "Contributing Factors."
      *   *Critique:* Did I address the "diffusion of responsibility"?
      *   *Adjustment:* Make sure the policy explicitly states that every contributing factor needs an *owner*. That solves the "no one is on the hook" problem.
      *   *Critique:* Is it actionable for a 1-hour meeting?
      *   *Adjustment:* Keep it concise. Provide specific wording for the postmortem.

  7.  **Final Polish:** Check against constraints.
      *   Draft memo? Yes.
      *   Recommend description for this case? Yes.
      *   State reusable rule? Yes.
      *   Address accountability/diffusion argument seriously? Yes.
      *   Actionable/Not philosophy? Yes.

  8.  *(Self-Correction on the "Coaching" aspect)*: The prompt says Side A recommends coaching. Side B implies that's unfair if it's systemic. My recommendation should preserve the coaching but change the *reason*. It's not "You broke it, behave." It's "You were the trigger, let's ensure you have the tools/tests next time." This bridges the gap.

  9.  **Finalizing the Policy Rule:** The "5 Whys" is common but often leads to blame. A better rule is the "Remediation Ownership Rule." If you list a cause, you must list who fixes it.

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts).

  **(Post-Drafting Review):** Does this sound like a Staff Engineer/Manager wrote it? Yes, it's pragmatic. Does it respect the philosophy student's point without getting bogged down? Yes, by acknowledging the complexity but prioritizing utility.

  Let's assemble the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Sev-1 Review Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Decision Framework: Causality and Accountability in Postmortems

  **Context**
  We are currently deadlocked on the checkout outage postmortem. Half the committee views the engineer's missing validation check as the singular root cause; the other half argues that the reviewer, backlog prioritization, and alerting hygiene were equally necessary conditions. This mirrors the philosophical problem of "causation by omission," but our goal is not metaphysical truth—it is incident prevention.

  If we name only one cause, we risk ignoring systemic gaps. If we name four causes without distinction, we risk diffusing responsibility so thoroughly that no specific remediation occurs.

  **Recommendation 1: Handling the Current Postmortem**
  For this specific incident, I recommend we **retire the term "Root Cause" entirely** in favor of a **"Trigger + Contributing Factors"** model.

  1.  **The Trigger:** Identify the refactor removing the validation check as the *Triggering Event*. This acknowledges the specific action that initiated the failure sequence.
  2.  **The Contributing Factors:** List the missed code review, the deprioritized test ticket, and the muted alert as *Contributing Factors*.
  3.  **The Accountability Mechanism:** To address the concern that "four causes means no one is on the hook," we will require that **every listed factor must have a specific, owned Action Item.**
      *   *Trigger:* The engineer who refactored the code owns the action item to pair with a senior engineer on a validation library update (Coaching/Enablement).
      *   *Review:* The engineering lead owns an action item to update the PR checklist to flag "logic removal" explicitly.
      *   *Backlog:* The Product Manager owns an action item to review the "technical debt" tagging process for edge-case testing.
      *   *Alerting:* The On-Call Lead owns an action item to audit muted alerts and define a re-enablement SLA.

  **Why this works:** It preserves the specificity of the engineer's action without scapegoating them. It acknowledges the system's role without absolving the individual of the need to learn from the trigger.

  **Recommendation 2: A Reusable Policy Rule**
  To prevent relitigating this next quarter, I propose we adopt the **"Actionability Test"** for all future Sev-1 postmortems.

  **The Rule:**
  > *A condition may only be listed as a Cause (Trigger or Contributing) if there is a corresponding Action Item with a named owner and a due date. If a cause cannot be acted upon, it is context, not a cause.*

  **Addressing the "Diffusion of Responsibility" Concern**
  The argument that multiple causes dilute accountability is valid if "accountability" means "liability for blame." However, in high-reliability engineering, accountability must mean **"ownership of the fix."**

  *   **Single Cause Risk:** If we pin this solely on the engineer, the "fix" is "engineer tries harder." This is not actionable and ignores the muted alert that allowed the outage to last 50 minutes instead of 2.
  *   **Multiple Cause Risk:** If we list four causes but assign no owners, the "fix" is "team be more careful." This is vague and unenforceable.
  *   **The Middle Path:** By requiring an owner for *each* factor, we ensure that the Reviewer, the Product Manager, the On-Call Lead, and the Engineer all leave the room with a specific task. Responsibility is not diluted; it is distributed.

  **Proposal for Thursday's Meeting**
  1.  Vote to adopt the **Trigger + Contributing Factors** language for the current draft.
  2.  Vote to adopt the **Actionability Test** as standing committee policy.
  3.  Review the draft Action Items to ensure every listed factor has a named owner.

  This approach allows us to close this postmortem without philosophical gridlock and ensures our next one focuses on remediation rather than attribution.

  **[Your Name]**
