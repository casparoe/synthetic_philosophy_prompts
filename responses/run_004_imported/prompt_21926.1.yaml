answer: |-
  It is completely understandable that this paragraph defeated you. C.D. Broad is a quintessential "philosopher's philosopher"—precise to a fault, but notoriously dense. Your colleague was right that Broad is the source of this vocabulary, but wrong to imply the text is self-evident. Broad is building a metaphysical engine here, and the gears are tight.

  The confusion stems from the fact that Broad is making two different cuts through the same reality: one cut divides **Properties** (the "what"), and the other divides **Laws** (the "how").

  Here is a plain-English restatement of the apparatus, answers to your specific questions, and a single worked example to lock it in.

  ### 1. The Three Buckets of Properties
  Broad is asking: *When we look at a complex thing (Order B) made of simpler things (Order A), how do its properties relate to the properties of the simpler things?*

  He divides all properties of the complex thing into three buckets:

  *   **(iii) Ordinally Neutral Properties (The "Inherited"):**
      *   **Definition:** Properties the complex thing shares with its parts.
      *   **Test:** Do the parts have this? Yes. Does the whole have this? Yes. Is it the *same kind* of property? Yes.
      *   **Example:** Mass. Atoms have mass; a molecule has mass. It's the same property, just summed up.
  *   **(ii) Reducible Characteristics (The "New but Predictable"):**
      *   **Definition:** Properties that are *unique* to the complex thing (the parts don't have them), but they can be calculated perfectly if you know the parts and the arrangement.
      *   **Test:** Do the parts have this? No. Does the whole have this? Yes. Can you calculate it using only lower-order laws? Yes.
      *   **Example:** Molecular Weight. A hydrogen atom does not have the molecular weight of water. That is a property *of the water*. However, it is just the sum of the atomic weights. It is new to this order, but not mysterious.
  *   **(i) Ultimate Characteristics (The "Emergent"):**
      *   **Definition:** Properties unique to the complex thing that *cannot* be predicted or deduced from the parts, even if you know everything about the parts and their arrangement.
      *   **Test:** Do the parts have this? No. Does the whole have this? Yes. Can you calculate it using only lower-order laws? **No.**
      *   **Example:** Liquidity. Hydrogen is a gas; Oxygen is a gas. Water is a liquid. You cannot look at the physics of gas and deduce "liquid" without a new rule.

  ### 2. The Two Types of Laws
  Now Broad asks: *What kind of rules govern these properties?*

  *   **Intra-ordinal Laws:** Rules that operate *within* a single level. (e.g., The laws of physics that govern how atoms move).
  *   **Trans-ordinal Laws:** Rules that bridge *between* levels. This is the crucial bit. A trans-ordinal law is the statement that says: *"When aggregates of Order A are arranged in Structure X, they will exhibit Ultimate Characteristic Y."*

  ### 3. Answering Your Specific Questions

  **Q1: Is a "trans-ordinal law" just the "ultimate characteristic" restated?**
  **A:** They are two sides of the same coin, but they are not identical.
  *   The **Ultimate Characteristic** is the *feature* itself (e.g., "Wetness").
  *   The **Trans-ordinal Law** is the *governing principle* that allows that feature to exist (e.g., "H₂O configurations yield Wetness").
  *   **Why the distinction matters:** You can observe the Characteristic without knowing the Law. Broad's point is that if Emergentism is true, the Law *must* exist as a fundamental fact of nature, distinct from the laws of physics. The Characteristic is the *outcome*; the Trans-ordinal Law is the *bridge* that makes the outcome possible. You need the Law to explain *why* the Characteristic appears when the parts are combined.

  **Q2: What work is "Reducible Characteristics" doing? Why aren't they "Neutral"?**
  **A:** This is the subtlest part of Broad's schema. The difference is **Novelty**.
  *   **Neutral:** The property exists at the lower level *and* the higher level. (Mass exists in atoms; Mass exists in molecules).
  *   **Reducible:** The property *only* exists at the higher level, but it is mechanically determined by the lower level. (Molecular Weight exists *only* in molecules, not atoms. But it is determined by atoms).
  *   **Why it matters:** Broad wants to show that not everything new is "emergent." Some things are new (Reducible) but boring (predictable). Only the "Ultimate" ones require a new law of nature. This protects science from having to invent a new "law of nature" for every single new property that appears at a higher level (like total weight or volume), reserving "Trans-ordinal Laws" only for the truly inexplicable ones.

  ---

  ### 4. Worked Example: The "Traffic Jam"
  To make this concrete without getting bogged down in chemistry (or AI), let's look at **Traffic**.

  *   **Order A (Lower):** Individual Cars.
  *   **Order B (Higher):** The Traffic Flow (The Aggregate).

  Here is how a property of the Traffic Flow lands in each of Broad's categories:

  #### 1. Ordinally Neutral Property: **Velocity**
  *   **The Property:** Speed.
  *   **Why it fits:** An individual car has a speed (e.g., 60mph). The traffic flow has an average speed (e.g., 60mph).
  *   **Deduction:** This property is shared. It is "neutral" between the orders. The laws of motion (intra-ordinal) apply to both.

  #### 2. Reducible Characteristic: **Density (Cars per Mile)**
  *   **The Property:** Traffic Density.
  *   **Why it fits:** An individual car does *not* have "density." You cannot be "dense" on your own. Density is a property unique to the **Traffic Order**.
  *   **Deduction:** However, if you know the number of cars (Order A) and the length of the road (Order A structure), you can calculate the Density perfectly. It is new to this order, but fully deducible from lower-order facts. It does not require a new law of nature.

  #### 3. Ultimate Characteristic: **The "Stop-Go Wave"**
  *   **The Property:** A phantom traffic jam (a wave of braking that moves backward through traffic even when there is no obstruction).
  *   **Why it fits:** An individual car cannot "wave." This is a property unique to the **Traffic Order**.
  *   **Deduction:** According to Broad's emergentism, you *cannot* predict this wave purely from the physics of the individual cars (engine torque, friction, reaction time). Even if you know every car's specs, the "Wave" is a new phenomenon that requires a **Trans-ordinal Law** to explain.
  *   **The Trans-ordinal Law:** "When cars of Type A are arranged at Density X, a Stop-Go Wave of Frequency Y will emerge."
      *   *Note:* In modern complexity science, we might argue this *is* reducible to individual driver behavior. But for Broad, if it cannot be deduced *in principle* from the lower laws alone, it is Ultimate.

  ### Summary Table

  | Category | Is it found in the parts? | Is it found in the whole? | Can it be calculated from parts? | Requires Trans-ordinal Law? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Neutral** | Yes | Yes | N/A (It's the same property) | No |
  | **Reducible** | No | Yes | **Yes** | No |
  | **Ultimate** | No | Yes | **No** | **Yes** |

  ### How this applies to your work debate
  Your colleague dragged you into 1925 metaphysics for a reason.
  *   If the "emergent abilities" of LLMs are **Reducible Characteristics**, then they are just complex math we haven't traced back to the transformer architecture yet. They are new to the model level, but deducible from the weights and tokens.
  *   If they are **Ultimate Characteristics**, then Broad would argue there is a **Trans-ordinal Law** at play—a fundamental rule connecting "scale of parameters" to "reasoning ability" that is not contained in the laws of gradient descent or linear algebra alone.

  Broad's framework forces you to ask: *Is this ability just a Reducible Characteristic (complex but predictable sum of parts), or is it an Ultimate Characteristic (requiring a new law connecting scale to capability)?* Most computer scientists argue it's Reducible; most "emergence" proponents argue it feels Ultimate. Broad gives you the vocabulary to say exactly where you disagree.
