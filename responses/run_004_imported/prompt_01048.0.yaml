answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of why climate economics is so philosophically fraught. You are right to notice the tension: if pure time preference is ethically indefensible, why does the "ethical" discount rate still compound into such a massive devaluation of the future?

  However, the conclusion that Stern was "smuggling" pure time preference back in relies on conflating two distinct components of the discount rate. To understand why Stern (and many others) claim consistency with Parfit while still using a positive rate, we have to look at the **Ramsey Formula**.

  ### 1. The Ramsey Decomposition
  The social discount rate ($r$) used in cost-benefit analysis is typically derived from the Ramsey equation:

  $$r = \delta + \eta \cdot g$$

  Where:
  *   **$\delta$ (Delta):** The **pure rate of time preference**. This is the parameter Cowen and Parfit attack. It represents impatience or a moral judgment that a life today is worth more than a life tomorrow simply because of the date.
  *   **$\eta$ (Eta):** The **elasticity of the marginal utility of consumption**. This measures how much less value an extra dollar provides to a rich person compared to a poor person.
  *   **$g$:** The expected **growth rate** of per capita consumption.

  **Stern's Specific Choices:**
  In the *Stern Review* (2006), Stern set **$\delta = 0.1\%$**. He explicitly justified this near-zero value using the Parfitian argument: it is ethically indefensible to discriminate against future generations based solely on their date of birth. The 0.1% was included only to account for the probability of human extinction (if no one exists, there is no utility to count).

  However, Stern set **$\eta = 1$** and assumed a positive growth rate (**$g \approx 1.3\%$**).
  Mathematically: $0.1\% + (1 \times 1.3\%) \approx 1.4\%$.

  So, the 1.4% rate you see is **not** pure time preference. It is almost entirely driven by the expectation that future people will be richer than we are.

  ### 2. Why Wealth Effects Are Not Pure Time Preference
  The Cowen-Parfit argument prohibits discounting based on *identity in time*. It does not prohibit discounting based on *marginal utility*.

  If we assume future generations will be wealthier due to technological progress, an extra dollar of consumption provides them less welfare than it would provide to a relatively poorer present generation. Discounting future *consumption* at a positive rate is compatible with valuing future *utility* equally.

  *   **Pure Time Preference ($\delta$):** "I value this benefit less because it happens in 2124." (Parfit says: Unjustifiable discrimination.)
  *   **Wealth Effect ($\eta \cdot g$):** "I value this dollar less because the person receiving it in 2124 will likely be richer, so the dollar buys less welfare." (Parfit says: This is permissible; we should equalize marginal utility, not nominal consumption.)

  From Stern's perspective, he *did* accept the Cowen-Parfit argument. He eliminated $\delta$. The remaining discounting is an adjustment for expected affluence, not a moral downgrade of future lives.

  ### 3. Where Your Skepticism Is Warranted
  While Stern wasn't technically "smuggling" $\delta$ back in, your intuition that the outcome feels similar to pure time preference is shared by many longtermists and heterodox economists. There are three legitimate critiques here:

  **A. The "Presumption of Growth" Critique**
  The discount rate relies heavily on $g$ (growth). If you assume perpetual economic growth, the wealth effect ($\eta \cdot g$) ensures future consumption is heavily discounted. However, if climate change catastrophically reduces $g$, or if we hit steady-state limits, $g$ drops, and the discount rate falls. By assuming robust growth, Stern implicitly assumes the future will be rich enough to warrant discounting their consumption. Longtermists might argue that given existential risks, assuming positive $g$ over centuries is optimistic, which ironically would *lower* the discount rate and raise the value of mitigation.

  **B. The $\eta$ Parameter as a Proxy**
  While $\eta$ is theoretically about marginal utility, in practice, it functions as a lever for intergenerational equity. A high $\eta$ implies we care less about transferring wealth to the rich future. Some critics argue that policymakers select $\eta$ values that conveniently yield a discount rate similar to market interest rates, effectively reintroducing impatience under the guise of "inequality aversion." Stern was unusually transparent about this, but Nordhaus and others have been accused of this conflation.

  **C. Consumption vs. Welfare**
  Cost-benefit analysis discounts *consumption*, but ethics cares about *welfare*. If environmental degradation means future people are richer in dollars but poorer in welfare (due to heat, loss of biodiversity, etc.), then discounting their consumption based on GDP growth is misleading. If climate change makes the future worse off in utility terms, the wealth-effect justification for discounting collapses.

  ### 4. Conclusion
  Stern's choice of a ~1.4% rate does **not** show that he rejected the Cowen-Parfit argument. He explicitly adopted their reasoning to set the pure time preference ($\delta$) to near zero.

  However, your observation highlights a crucial limitation of the Parfitian victory in climate economics: **Eliminating pure time preference does not eliminate discounting.** As long as we expect future generations to be wealthier ($g > 0$) and we accept diminishing marginal utility ($\eta > 0$), future consumption will still be discounted significantly.

  For a longtermist, the takeaway isn't that Stern was hypocritical, but that the **growth assumption ($g$)** is doing the heavy lifting. If one believes that existential risk makes future wealth uncertain, or that consumption is a poor proxy for welfare in a climate-damaged world, the ethical imperative to discount future consumption weakens significantly—even if Stern's math was internally consistent.

  So, Stern didn't smuggle pure time preference back in; he relied on **economic growth** to do the work that **impatience** usually does. Whether that is ethically defensible over 300-year time horizons is the next debate you'll often see on the EA Forum.
