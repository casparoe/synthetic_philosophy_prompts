      *   *Initial thought:* Focus heavily on mental health.
      *   *Correction:* The user is asking for a *principled* reason, not just a emotional one. Need to frame it ethically/logically. The "Sustainability Argument" is stronger here than just "feelings."

  8.  **Final Polish:** Check against the prompt's specific questions ("Who's actually right?", "Principled reason?"). Ensure these are answered clearly. (The roommate is right, and yes, there is a principled reason).

