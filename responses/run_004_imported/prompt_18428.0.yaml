answer: |-
  This is not a weirdly specific problem; it is a classic ethical and psychological trap that competent people fall into all the time. It's often called the "Curse of Competence" or the "Helper's Burnout."

  To answer your question directly: **Your roommate is right, but her explanation ("you're allowed to be selfish") is probably failing to land because it doesn't satisfy your logical framework.**

  You are operating under a specific ethical calculus: *If Action A produces more net good than Action B, I am morally obligated to do Action A.* Under that strict utilitarian view, resting feels like a moral failure.

  However, that logic contains several fatal flaws. Here is the principled, logical argument for why you are allowed to stop helping, broken down in a way that addresses your specific concern about "doing good."

  ### 1. The Sustainability Argument (Long-Term Utility)
  Your logic assumes that your capacity to help is infinite. It isn't.
  If you help everyone tonight, you are tired tomorrow. If you help everyone every weekend, you will eventually resent your friends, burn out, or crash hard.
  *   **The Principle:** A resource that is depleted cannot provide value.
  *   **The Logic:** By protecting your energy now, you ensure you are capable of helping in a genuine emergency later. If you burn out, your utility drops to zero. Therefore, resting is not "doing less good"; it is **maintenance on the machine that does the good.** It is an investment in future utility.

  ### 2. The Enabling Argument (Long-Term Harm)
  You assume that fixing your friends' laptops is "making things better for them." Often, it is not.
  *   **The Principle:** Helping someone should ideally move them toward independence, not dependency.
  *   **The Logic:** By always being the free, on-call IT department, you are removing the incentive for your friends to learn basic troubleshooting, read manuals, or pay a professional. You are inadvertently training them to be helpless.
  *   **The Result:** When you eventually *do* say no (because you will), they will be worse off than if you had let them struggle a bit today. Letting them sit with the inconvenience of a broken laptop might motivate them to solve it permanently.

  ### 3. The Opportunity Cost Argument (Your Life Has Value)
  You are weighing "My Tiredness" vs. "Their Problem." You are leaving out a third variable: "Your Life."
  *   **The Principle:** Your time and goals have intrinsic moral value, equal to that of your friends.
  *   **The Logic:** Every hour you spend fixing Wi-Fi is an hour you are *not* spending on your own hobbies, rest, career, or relationships. You are implicitly deciding that your friends' convenience is more important than your own growth or happiness. Why is their comfort morally superior to yours?
  *   **The Reframe:** Saying no isn't selfishness; it's **stewardship of your own life.** You are the only person responsible for your life's trajectory. If you outsource your time to everyone else, you are neglecting your primary moral responsibility: yourself.

  ### 4. The Relationship Argument (Friendship vs. Transaction)
  Friendship is reciprocal. If the primary value you provide to the group is "free tech support," the relationship becomes transactional.
  *   **The Principle:** Healthy relationships require boundaries to remain authentic.
  *   **The Logic:** If you never say no, you aren't acting as a friend; you're acting as a service provider. Service providers get paid and have hours. Friends have mutual respect. By not setting boundaries, you are denying your friends the chance to respect your limits. You are keeping them in a dynamic where they see you as a tool, not a person.

  ### How to Shift the Dynamic
  You don't need a "big justification," but having a system helps you feel principled rather than flaky.

  1.  **Change the Definition of Help:** Real help is empowering them. "I can't come over, but I can send you a link to a guide that fixed this for me last time."
  2.  **Set "Office Hours":** Tell your friends, "I'm happy to help with tech stuff, but I only do that on Saturday afternoons." If they text at 11 PM on a Tuesday, the answer is, "I'll look at it Saturday." This trains them to plan ahead.
  3.  **The "Professional" Pivot:** For big tasks (moving, complex repairs), suggest professionals. "I'm not the best person for this, but I know a guy who charges $50 and can do it in an hour."
  4.  **Practice the "Soft No":** You don't need to say "I'm tired." Try: "I can't commit to that right now," or "That's outside my bandwidth this week."

  ### The Verdict
  The logic that says "you must always do more good" is a black hole. It leads to a life where you own nothing, not even your own time.

  There is a **principled reason** to stop: **Sustainability.** You are a finite resource. Managing that resource wisely is not selfish; it is responsible. Your roommate is right that you don't need a justification, but the deeper truth is that **your "no" protects the value of your "yes."**

  If you help everyone always, your help becomes cheap. If you help selectively, your help becomes a gift. Give yourself permission to make it a gift again.
