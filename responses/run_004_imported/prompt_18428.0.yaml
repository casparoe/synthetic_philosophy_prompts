prompt: |-
  This might sound like a weirdly specific thing to be stuck on, but here goes. I'm the person in my friend group who's good with computers, and it feels like I'm never really allowed to say no to helping people. I get texts at 11pm about broken laptops, I spend a chunk of most weekends setting up peoples wifi or helping them move, and whenever I think about turning someone down the only reason I can come up with is "I'm tired," which feels pretty weak when I could just go help and actually make things better for them. The annoying part is that logic doesn't seem to stop anywhere - if the good I'd do outweighs my tiredness today, why wouldn't that be just as true tomorrow, and the day after that? My roommate keeps telling me I'm allowed to say no sometimes without some big justification, but that kind of feels like she's just giving me permission to be selfish. So who's actually right - is there some real principled reason I get to stop helping at some point, or does the fact that I COULD always do more good mean I basically never get to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Core Issue:** The user is the "tech person" in their friend group and feels unable to say no to requests for help (laptops, wifi, moving, etc.), even at inconvenient times (11 PM, weekends).
      *   **Internal Conflict:** They feel guilty saying no. Their only perceived valid reason is "I'm tired," which feels weak compared to the "good" they could do.
      *   **Logical Trap:** They are stuck in a utilitarian loop: If helping creates more good than my tiredness today, why not tomorrow? And the day after? This leads to burnout (implied).
      *   **External Input:** Their roommate says they can say no without justification, but the user interprets this as "permission to be selfish."
      *   **The Question:** Who is right? Is there a principled reason to stop helping, or does the potential to do good mean they never get to stop?

  2.  **Deconstruct the Ethical/Philosophical Framework:**
      *   The user is essentially describing a classic problem in ethics: *Effective Altruism* taken to an extreme, or *Utilitarianism* without boundaries.
      *   *The Roommate's View:* Boundaries are healthy. Self-care isn't selfish.
      *   *The User's View:* Maximizing utility (helping others) is the moral imperative. Personal cost is secondary.
      *   *The Flaw in the User's Logic:* It ignores sustainability, resentment, and the value of autonomy. It also creates a dependency dynamic that isn't actually "good" for the friends in the long run.

  3.  **Formulate the Argument:**
      *   **Validate the Feeling:** Acknowledge that this is a common trap for competent people. It's not "weirdly specific."
      *   **Address the "Selfishness" Label:** Reframe self-preservation not as selfishness, but as sustainability.
      *   **The "Oxygen Mask" Principle:** You can't help others if you break down.
      *   **The Long-Term Utility Argument:** If you burn out, you help *no one*. Therefore, resting *is* doing good.
      *   **The Relationship Dynamic:** Constant one-sided helping creates unhealthy dependencies. Friends should learn to solve their own problems or pay professionals.
      *   **The "No" Justification:** You don't owe a justification. "No" is a complete sentence.
      *   **Practical Advice:** How to set boundaries without feeling like a jerk.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user. This is a known phenomenon (the "competence curse").
      *   *Philosophical Rebuttal:* Tackle the logic trap directly. The "always do more good" argument is infinite and unsustainable. It leads to burnout.
      *   *Reframing Selfishness:* Distinguish between *selfishness* (harming others for gain) and *self-preservation* (maintaining capacity to function).
      *   *The "Good" Argument:* Is it actually "good" to enable friends' incompetence? No. It prevents them from learning or hiring pros.
      *   *The Relationship Argument:* Friendship is reciprocal. If it's just "tech support," it's transactional.
      *   *Actionable Steps:* Give scripts for saying no. Suggest a "office hours" approach.
      *   *Conclusion:* Reiterate that the roommate is right, but explain *why* in a way that satisfies the user's logical brain.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid being preachy.
      *   Use logic to counter their logic (since they are relying on logic to guilt themselves).
      *   Acknowledge the "tired" feeling isn't weak; it's data.

  6.  **Key Concepts to Include:**
      *   Burnout.
      *   Opportunity cost (what are *you* giving up?).
      *   Enabling vs. Helping.
      *   Sustainability.
      *   Boundaries.

  7.  **Self-Correction/Review during drafting:**
