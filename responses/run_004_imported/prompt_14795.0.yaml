      *   *Regressional:* $P$ and $G$ are correlated, but not perfectly. Optimizing $P$ selects for $P = G + \epsilon$. When $P$ is very high, $\epsilon$ is likely positive. So $G$ is lower than expected. *Mechanism:* Statistical noise/regression to the mean.
      *   *Causal:* $P$ and $G$ are correlated, but $P$ doesn't *cause* $G$ (or only partially). Optimizing $P$ doesn't move $G$. *Mechanism:* Confounding variable or reverse causality.
      *   *Extremal:* $P$ and $G$ correlate well in the normal range, but the relationship breaks down at the extremes. *Mechanism:* Distributional shift/non-linearity.
      *   *Adversarial:* An agent actively manipulates $P$ without moving $G$ (or hurting $G$) to game the system. *Mechanism:* Strategic optimization by a separate agent.

