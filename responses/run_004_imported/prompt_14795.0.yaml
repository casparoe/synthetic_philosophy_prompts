      *   **Goal:** They want a clear, mechanistic walkthrough of the four categories with distinct concrete examples (preferably AI/ML) and an explanation of why fixes for one don't work for others. They need to understand this deeply enough to explain it to readers.
      *   **Tone:** Professional, insightful, slightly conversational (matching the user's voice), but rigorous on the concepts.

  2.  **Deconstruct the Four Types of Goodhart's Law:**
      *   *Source:* This taxonomy comes from David Manheim and Scott Garrabrant's paper "Categorizing Variants of Goodhart's Law" (2018).
