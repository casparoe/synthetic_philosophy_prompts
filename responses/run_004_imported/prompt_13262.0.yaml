      *   **Move (3):** Aisha pivots to meta-ethics. Nietzsche is a perspectivist. The goal isn't truth/falsity but *health/strength*. Showing contingency undermines the *authority* (the "thou shalt"), not the proposition's truth (since there is no moral truth).
