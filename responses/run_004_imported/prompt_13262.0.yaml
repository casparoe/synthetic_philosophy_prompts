      *   **Move (2) - Marcus:** This is the *genetic fallacy*. Origin $\neq$ validity. (Analogy: Evolution/Malthus). Nietzsche needs normative arguments against pity/equality, not just history.
      *   **Move (3) - Aisha:** Nietzsche isn't making truth-claims about moral facts (anti-realist/meta-ethical point). Genealogy loosens the *grip* of morality by showing its contingency, not refuting it as false.
      *   **Move (4) - Marcus:** *Self-Referential Incoherence*. If origin undermines authority, it undermines Nietzsche's values too (will to power, etc.). Either total skepticism (nihilism) or he needs a normative standard to distinguish "good" origins from "bad" ones.

  3.  **Evaluate Each Move (Drafting the Analysis):**

      *   **Move (1):** Aisha is mostly right about Nietzsche's *intent*, but "debunking" might be too simple. Nietzsche *does* want to shake our faith in moral values by showing their ignoble origins. However, calling it a straightforward "debunking" implies a truth-value swap (False vs. True), which leads into Marcus's objection.
          *   *Verdict:* Aisha captures the spirit, but risks oversimplification.
      *   **Move (2):** Marcus raises a classic objection (Genetic Fallacy). In standard analytic philosophy, he's right. But is Nietzsche doing standard analytic philosophy? No. Nietzsche knows origin doesn't logically entail falsity, but he thinks psychological origin affects *value*.
