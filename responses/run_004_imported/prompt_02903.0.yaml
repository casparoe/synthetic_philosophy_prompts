  so i've been reading about the COMPAS recidivism tool for a project at work (my team's arguing about bias in our own risk-scoring model) and it turns out theres an actual proven theorem behind the whole propublica vs northpointe fight, not just people talking past each other. i think it was kleinberg, mullainathan and raghavan, plus a separate paper by chouldechova, that showed when two groups have different base rates, no score can be both calibrated and have equal error rates across groups unless its a perfect predictor. so doesnt that basically make the whole 'COMPAS is racially biased' thing a nothingburger? northpointe optimized for calibration, propublica wanted equal error rates, and if its provably impossible to get both, seems kinda unfair to call northpointes pick 'biased' when literally any choice they made was gonna fail somebody's fairness test. am i missing something here?
