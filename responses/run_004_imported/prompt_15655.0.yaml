          *   *Is it true?* Objectively, his economic productivity has likely ceased. His social sphere might have shrunk.
          *   *Argument Against:* "Mattering" is subjective. He matters to family. He has wisdom.
          *   *Honest Response:* It *is* true that his *professional* utility is gone. The shift isn't to deny the loss, but to redefine "mattering" from *production* to *presence* or *legacy*.
          *   *Verdict:* Mostly true (regarding former definitions), requires a shift in definition, not a denial of the feeling.

      *   **Complaint 2: Physical Decline/Hobbies ("hip and eyesight... give up woodworking and hiking")**
