prompt: |-
  Random philosophy tangent but this has been bugging me for like a week now. For my EPQ (it's this independent research project we do in sixth form in the UK) I'm looking at "Victorian scientists with a secret weird side," and one of my case studies is Henry Sidgwick. We'd already read bits of his Methods of Ethics in my philosophy class, where hes presented as this super careful, rigorous utilitarian thinker, so I was honestly kind of thrown to find out he also co-founded the Society for Psychical Research and was its president on and off for years, running experiments on mediums, telepathy, haunted houses, all of it.

  My first thought was that this must've just been some weird personal hobby that had nothing to do with his actual philosophy, like he clocked out of being a rigorous thinker on weekends. But then that feels too generous, because isn't it kind of a damning inconsistency for a guy famous for careful, rational argument to spend that much of his life chasing what's basically pseudoscience now? And doesn't it undercut how seriously we should take his ethics if the guy behind it also thought ghosts might be real? I asked my EPQ supervisor and she just said "it's actually more connected to his ethics than you'd think" and wouldn't say more because she wants me to work it out myself, which, thanks I guess. Can you actually explain what's going on here — was Sidgwick just being irrational, or is there something about how the psychical research connects to the "serious" philosophy stuff that I'm missing?
