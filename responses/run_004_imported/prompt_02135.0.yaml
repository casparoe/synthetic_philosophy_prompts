answer: |-
  This is a fantastic EPQ topic, and your confusion is completely understandable. From a modern perspective, Henry Sidgwick spending decades investigating telepathy and haunted houses *does* look like a brilliant man having a mid-life crisis or falling for pseudoscience.

  However, your supervisor is right: this isn't a contradiction. It is actually a direct extension of his philosophical project. If you can crack this connection, it will make your EPQ stand out significantly.

  Here is the breakdown of why Sidgwick's "weird side" was actually the logical conclusion of his "serious side."

  ### 1. Context: It wasn't "Woo," it was "Science"
  First, you have to adjust the Victorian lens. Today, psychical research is dismissed as pseudoscience. But in the 1880s, when Sidgwick co-founded the Society for Psychical Research (SPR), the landscape was different.

  Darwinism and materialism were dismantling traditional religious beliefs. If the universe is just matter in motion, what happens to the soul? What happens to morality? Many leading intellectuals (including William James in the US and Alfred Russel Wallace, co-discoverer of natural selection) felt that dismissing these phenomena out of hand was just as dogmatic as religious fundamentalism.

  Sidgwick didn't join the SPR because he *believed* in ghosts. He joined because he was an **empiricist**. His stance was: *People are claiming these things happen. As scientists and philosophers, we have a duty to test these claims rigorously rather than ignoring them.*

  In fact, Sidgwick was a harsh critic within the SPR. He spent a lot of time exposing fraudulent mediums. This fits his "rigorous thinker" persona perfectly: he wasn't looking for magic; he was looking for data, and he was willing to debunk his own side if the evidence wasn't there.

  ### 2. The Philosophical Problem: The "Dualism of Practical Reason"
  This is the crucial link your supervisor is hinting at. To understand why he cared about ghosts, you have to understand the problem he created in *The Methods of Ethics*.

  Sidgwick is a utilitarian. He argues we should act to create the greatest good. But he also acknowledges **Egoism** (acting in your own self-interest).
  *   **The Problem:** Sometimes, being moral costs you your happiness, your health, or your life. If death is the absolute end, the rational choice is often Egoism. Why sacrifice yourself for the greater good if you just rot in the grave and no one remembers you?
  *   **The Dualism:** Sidgwick concluded that human reason is split. Reason tells us to be moral, but reason also tells us to look out for ourselves. There is no logical way to reconcile these two *unless* there is a cosmic order that ensures virtue is eventually rewarded and vice punished (i.e., God and an Afterlife).

  Sidgwick called this the **"Dualism of Practical Reason,"** and it terrified him. He wrote that if he couldn't find a way to prove that morality aligns with self-interest in the long run, his entire ethical system rested on a shaky foundation. He needed to know if the universe was "moral" or just "matter."

  ### 3. The Connection: SPR as a Search for Moral Evidence
  So, here is the synthesis:

  Sidgwick turned to Psychical Research not because he wanted to talk to dead relatives, but because he was looking for **empirical evidence of a moral order.**

  *   If telepathy exists, it suggests minds are not entirely bound by physical brains (challenging materialism).
  *   If survival after death exists, it suggests that the "Egoist" calculation changes (because consequences extend beyond the grave).
  *   If there is evidence of a spiritual realm, it might provide the "Divine Government" needed to reconcile Morality and Self-Interest.

  For Sidgwick, the SPR was essentially an **applied ethics project.** He was trying to use the scientific method to find the metaphysical premises required to make his Utilitarianism work. He wasn't clocking out of philosophy; he was trying to solve the biggest hole in his philosophy using the tools of investigation available to him.

  ### 4. Does this undermine his credibility?
  You asked if this makes him look irrational. I would argue the opposite.

  *   **Dogmatism vs. Skepticism:** A truly irrational person would believe in ghosts without evidence. A dogmatic scientist would say ghosts are impossible without evidence. Sidgwick took the harder path: *Let's investigate.*
  *   **Intellectual Honesty:** He admitted that his ethical system had a vulnerability (the Dualism). Instead of ignoring it, he spent years trying to find data to fix it. When the data remained inconclusive, he remained agnostic. He didn't lie to himself to feel better.

  ### How to frame this in your EPQ
  If I were you, I would structure this argument to show the evolution of his thought:

  1.  **The Public Persona:** Sidgwick the rigorous Cambridge don, author of *The Methods of Ethics*.
  2.  **The Crisis:** Explain the "Dualism of Practical Reason." Show that his ethics left him with an unresolved problem regarding the ultimate rationality of morality.
  3.  **The Investigation:** Introduce the SPR not as a hobby, but as a research methodology to solve that crisis. Quote his view that excluding these phenomena was "unscientific."
  4.  **The Verdict:** Conclude that his involvement in the SPR demonstrates *consistency*, not inconsistency. It shows a philosopher willing to follow the argument wherever it led, even into the unknown, rather than accepting comfortable materialist dogmas.

  **The "Killer Quote" for your project:**
  Sidgwick once wrote that the SPR was *"the most important work to which I have ever put my hand."* He didn't say that about *The Methods of Ethics*. He said that about the ghost hunting. That should tell you how deeply connected he felt the two were.

  **Summary:** Sidgwick wasn't a rationalist who failed; he was a rationalist who realized that rationality required him to investigate *everything*, even the things that made his contemporaries uncomfortable, because the stakes (the foundation of morality itself) were too high to ignore.
