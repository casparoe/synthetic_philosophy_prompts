prompt: |-
  I'm building a dissertation chapter on Quine's naturalism and want to pressure-test an inference before I commit to it. In "Two Dogmas," the case against the analytic/synthetic distinction rests entirely on holism: no sentence is checked against experience except as part of the whole web of belief, so the line between truths grounded in meaning and truths grounded in fact cannot be principled — it's a matter of centrality, not kind. In "On the Nature of Moral Values," Quine seems to run the same argument on the fact/value line: moral standards, like physical hypotheses, are revised piecemeal under pressure from recalcitrant experience and feeling, and no single moral judgment is checkable except against the rest of one's values. He does hedge by saying science keeps "some title" to a correspondence theory of truth while a coherence theory is "the lot of ethics," but that looks to me like a restatement of the asymmetry rather than a reason for it, now that both domains are conceded to run on the same holistic engine. So once Quine grants ethics the very holism he used to dismantle the first dogma, what in his own framework stops the fact/value line from collapsing the same way the analytic/synthetic one did — or is that correspondence/coherence hedge doing more work than it looks like at first pass?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is writing a dissertation chapter on Quine's naturalism.
      *   **Core Argument:** The user argues that Quine's holism in "Two Dogmas of Empiricism" (dismantling analytic/synthetic) should logically apply to his treatment of ethics in "On the Nature of Moral Values," thereby dismantling the fact/value distinction in the same way.
      *   **Observation:** Quine admits ethics is holistic (revised piecemeal under pressure) but hedges by assigning science a "correspondence" title and ethics a "coherence" lot.
      *   **Question:** Does this hedge hold water within Quine's own framework, or does the fact/value distinction collapse just like the analytic/synthetic one did? Is the correspondence/coherence distinction doing more work than it appears?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Claim:* Quine runs the *same* holism argument in "On the Nature of Moral Values" as in "Two Dogmas."
      *   *Correction/Nuance:* Quine *does* apply a holistic model to ethics (web of belief), but he explicitly *denies* that moral sentences have the same empirical content as scientific sentences. In "Two Dogmas," holism is about empirical confirmation. In ethics, Quine is skeptical about moral sentences having truth values in the same sense.
      *   *Claim:* Quine says science has "some title" to correspondence and ethics has "coherence."
      *   *Verification:* This sounds like a specific reading of "On the Nature of Moral Values" (1981). I need to recall/verify Quine's stance on moral truth. Quine is generally a moral anti-realist or non-cognitivist (or at least deflationary about moral truth). He treats moral sentences as serving a directive function rather than a descriptive one.
      *   *The Crux:* The user sees a tension: If both are holistic, why isn't the distinction collapsed? The user suspects the correspondence/coherence distinction is a *post hoc* save.
      *   *My Task:* Pressure-test this inference. Is the user right? Is Quine inconsistent? Or is there a structural difference in *what* is being holistically tested (sensory stimuli vs. sentiments/goals)?

  3.  **Deconstructing Quine's Naturalism & Ethics:**
      *   **Naturalism:** Philosophy is continuous with science. Science is the measure of what exists.
      *   **Epistemology:** Holistic empiricism. The web of belief faces the tribunal of sense experience.
      *   **Ethics:** Quine is *not* a moral realist in the standard sense. He doesn't think there are "moral facts" in the ontology of science.
      *   **The "Two Dogmas" Move:** Analytic/Synthetic collapses because *all* statements face experience together.
      *   **The Ethics Move:** Moral statements face *sentiments* and *social pressures*, not just sensory stimuli.
      *   **The Distinction:** For Quine, the "fact" side is tied to *observation sentences* and *stimulation*. The "value" side is tied to *reinforcement* and *goal-directed behavior*.
      *   **The Hedge:** The correspondence/coherence distinction isn't just a hedge; it marks the boundary of *ontological commitment*. Science posits objects to explain stimuli. Ethics posits norms to regulate behavior.

  4.  **Evaluating the User's Inference:**
      *   *Strength:* The user correctly identifies that holism is the engine in both cases. If holism is the only criterion for "cognitive significance," ethics should qualify.
      *   *Weakness:* The user might be overlooking Quine's *behaviorist* constraints on meaning and truth. For Quine, "truth" in the robust sense requires a link to observable stimuli (observation sentences). Moral sentences lack this specific link. They are more like imperatives or expressions of sentiment that have been grammaticalized into indicatives.
      *   *The "Correspondence/Coherence" Point:* Quine isn't saying science *has* correspondence and ethics *has* coherence in a way that saves realism for both. He's saying science *aims* at predicting stimuli (correspondence-ish), while ethics aims at internal consistency of goals (coherence). But since ethics lacks the stimulus link, it doesn't get "truth" in the scientific sense.
      *   *Conclusion:* The fact/value distinction *does* collapse in terms of *methodology* (both are holistic, revisable), but it *holds* in terms of *ontology* and *semantic function* (one tracks stimuli, the other tracks sentiments). The user's inference is strong but needs to account for Quine's behaviorist semantics.

  5.  **Drafting the Response:**
      *   **Validate:** Acknowledge the sophistication of the reading. It's a known tension in Quine scholarship (e.g., Gibson, Hookway).
      *   **Clarify Quine's Ethics:** Quine isn't a standard naturalist about ethics (like Boyd or Brink). He's closer to Hume or Stevenson. Moral sentences aren't truth-apt in the same way.
      *   **Address the Holism Parallel:** Yes, the *structure* is similar (web of belief), but the *inputs* differ (sensory stimulation vs. sentiments/reinforcement).
      *   **Analyze the Hedge:** The correspondence/coherence distinction isn't a weak hedge; it's the *consequence* of the lack of observation sentences in ethics. It marks the limit of naturalism.
      *   **Pressure-Test the Inference:**
          *   *Argument for Collapse:* If holism is the sole criterion for cognitive significance, ethics qualifies.
          *   *Argument for Distinction:* Quine adds a behaviorist constraint (stimulus meaning). Ethics fails this.
          *   *Verdict:* The distinction doesn't collapse *ontologically*, but the *epistemological* gap is narrower than traditional empiricism allows. The user is right to press on the *consistency* of the holism application.
      *   **Scholarly References:** Mention Hookway ("Quine on Value"), Gibson ("Quine's Philosophy"), or perhaps the comparison to Carnap.
      *   **Dissertation Advice:** Frame this as a "tension" or "limit case" of Quinean naturalism. It shows where his behaviorism constrains his holism.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Quine actually say ethics is coherence?* In "On the Nature of Moral Values," he suggests moral systems are judged by how well they cohere with our sentiments and other values, not by matching moral facts.
      *   *Is the user right about "Two Dogmas"?* In "Two Dogmas," the point is that *no* statement is immune. In ethics, *no* moral statement is immune to revision based on sentiment. So the structural parallel holds.
      *   *The Critical Difference:* In "Two Dogmas," the tribunal is *experience* (sensory). In ethics, the tribunal is *sentiment* (psychological/social). Quine naturalizes sentiment, but he doesn't grant it ontological weight equivalent to physical objects.
      *   *Key Insight:* The user's inference is that the fact/value distinction *should* collapse. Quine wants to say it doesn't *fully* collapse because science predicts stimuli, ethics regulates behavior. The "correspondence/coherence" remark is Quine trying to maintain naturalism without becoming a moral realist.
      *   *Recommendation:* The user should argue that Quine's naturalism is *incomplete* or *tension-ridden* here. The holism pushes toward collapse; the behaviorism pulls toward distinction.

  7.  **Final Polish:** Ensure the tone is academic, supportive, and rigorous. Use specific Quinean terminology (observation sentences, stimulus meaning, ontological commitment). Structure the response to directly answer the "pressure-test" request. (See final output structure).

      *   *Structure:*
          1.  Validate the insight (it's a strong reading).
          2.  Clarify the specific role of holism in both texts.
          3.  Analyze the "Correspondence/Coherence" hedge (is it substantive or ad hoc?).
          4.  Identify the real barrier: Observation Sentences & Ontology.
          5.  Conclusion on the inference (It holds water as a critique of Quine's consistency).
          6.  Dissertation strategy suggestions.

  8.  *(Final check on "On the Nature of Moral Values"):* Quine argues moral judgments are not truth-functional in the scientific sense. They are more about "standing patterns of disposition to behavior." The "coherence" remark is about how we justify them internally, not about matching external moral facts. The user is right to see this as a potential inconsistency if holism is the *only* metric for cognitive significance.

      *   *Wait, one nuance:* Quine later softened on truth (deflationism). Does that help ethics? If truth is just disquotation, "Murder is wrong" is true iff murder is wrong. But Quine still thinks "Murder is wrong" doesn't posit an object. So ontological commitment remains the filter.

      *   *Okay, ready to write.*
answer: |-
  This is a sharp reading, and it identifies one of the most fertile tension points in Quine's later philosophy. You are effectively asking whether Quine's **methodological naturalism** (holism) inevitably outstrips his **ontological naturalism** (physicalism/behaviorism).

  To pressure-test your inference: **You are right to suspect the correspondence/coherence hedge is doing heavy lifting, but perhaps not for the reason you think.** It isn't merely a restatement of asymmetry; it is the firewall Quine erects to prevent his holism from forcing him into moral realism. However, your intuition that this firewall is porous within a strictly Quinean framework is well-founded.

  Here is a breakdown of how to adjudicate this inference for your dissertation, distinguishing where the parallel holds and where Quine attempts to break it.

  ### 1. The Structural Parallel (Where you are right)
  Your reading of the structural analogy between *Two Dogmas* and *On the Nature of Moral Values* is correct.
  *   **In *Two Dogmas*:** The analytic/synthetic distinction fails because confirmation is holistic. We cannot isolate a single sentence to check against experience; we check the web.
  *   **In *Moral Values*:** The fact/value distinction is treated similarly regarding *revision*. We do not check a single moral judgment against a "moral fact"; we check it against the web of sentiments, social goals, and other values.

  If the criterion for "cognitive significance" or "rational revisability" is simply **holistic integration with a tribunal of experience/sentiment**, then ethics qualifies. If Quine grants ethics the same holistic engine, the *epistemological* gap between fact and value narrows significantly. This supports your inference that the distinction *should* collapse, or at least become a difference of degree (centrality) rather than kind.

  ### 2. The Barrier: Observation Sentences and Stimulus Meaning
  The reason Quine insists the distinction does *not* fully collapse lies not in the holism, but in the **inputs** of the web.
  *   **Science:** The tribunal is **sensory stimulation**. The anchor of the web is the *observation sentence*, which is keyed directly to concurrent sensory stimulation. This allows for "correspondence" (in a deflationary, immanent sense) because there is a causal link between the posited objects and the sensory evidence.
  *   **Ethics:** The tribunal is **sentiment and social reinforcement**. Quine treats moral language as having a directive function (closer to Hume or Stevenson). While moral judgments are revised holistically, they lack *observation sentences* in the strict Quinean sense. There is no "moral stimulation" that causally mandates a specific moral observation sentence in the way a rabbit mandates "Gavagai."

  **The Pressure Point:** Your inference hits hard here. If Quine naturalizes sentiment (treating it as a physical/psychological state), why isn't sentiment just another form of "experience"? If holism allows theoretical physics to float far from immediate stimulation, why can't ethics float on sentiments in the same way?
  *   **Quine's Defense:** He would argue that sentiments do not posit *objects*. Science posits electrons to explain stimuli; ethics posits no "values" to explain sentiments. Values are not ontological commitments; they are behavioral dispositions.
  *   **Your Counter:** If holism is the metric for truth-aptness, the lack of ontological commitment shouldn't matter. We treat mathematical truths as holistic and necessary without positing physical objects (though Quine does posit sets). Why is ethics different?

  ### 3. The Correspondence/Coherence Hedge
  You ask if the correspondence/coherence distinction is doing more work than it looks. **Yes, it is.** It is the mechanism Quine uses to preserve **ontological parsimony** without sacrificing **methodological continuity**.

  *   **Correspondence (Science):** Even for Quine, "correspondence" is not a metaphysical mirror. It is the successful prediction of sensory stimuli. Science has "title" to this because it successfully navigates the causal nexus of physical stimulation.
  *   **Coherence (Ethics):** Ethics is denied correspondence because there are no moral stimuli to correspond to. It is relegated to coherence because its function is to regulate behavior and align sentiments, not to map the causal structure of the world.

  **The Weakness:** As you noted, this looks like a *post hoc* save. If both domains use the same holistic logic of justification, why does one get "truth" (correspondence) and the other get "validity" (coherence)?
  *   **Scholarly Context:** This is where scholars like **Roger Gibson** and **Christopher Hookway** diverge. Hookway argues that Quine's behaviorism forces him to be more skeptical about ethics than his holism warrants. Gibson suggests Quine's naturalism implies a more continuous spectrum between fact and value than Quine admits.
  *   **Your Dissertation Angle:** You can argue that Quine's holism *undermines* his own behaviorist constraints on ethics. If justification is holistic, the lack of a direct causal link (observation sentence) is less damaging than Quine thinks, because *no* sentence has a direct link (as per *Two Dogmas*).

  ### 4. Verdict on Your Inference
  Your inference is robust: **Quine's holism exerts a centrifugal force that threatens to collapse the fact/value distinction, while his behaviorist ontology exerts a centripetal force to keep them apart.**

  The correspondence/coherence hedge is not just a restatement of asymmetry; it is the **friction point** where Quine's two naturalisms (methodological vs. ontological) grind against each other.
  *   **Methodological Naturalism:** Says ethics and science are continuous (both holistic, revisable, empirical in a broad sense).
  *   **Ontological Naturalism:** Says only physics (and its posits) is real.

  Quine wants to have it both ways: Ethics is natural (part of the human web) but not factual (not about the world). Your inference correctly identifies that if the *logic* of the web is the same, the distinction between "world" and "sentiment" becomes harder to police.

  ### 5. Strategic Recommendations for the Chapter
  1.  **Frame it as a "Limit Case":** Position this not as a mistake by Quine, but as the limit of his system. The fact/value distinction is where Quinean holism meets its behavioral boundary.
  2.  **Nuance the "Collapse":** Be careful not to say Quine *fails* to distinguish them. He distinguishes them by **function** (prediction vs. regulation) rather than **justification** (holism vs. holism). Your critique is that functional differences shouldn't warrant a truth/value dichotomy if the justificatory structure is identical.
  3.  **Engage the "Truth" Predicate:** Quine is a deflationist about truth ("disquotation"). If "True" is just a device for semantic ascent, does "Murder is wrong is true" add anything? Quine says no, because "Murder is wrong" isn't positing an object. You can press the argument: If truth is disquotational, and ethics is holistic, why can't we disquote moral sentences? The only barrier is his reluctance to admit moral properties into the ontology.
  4.  **Cite the Tension:** Explicitly reference the tension between *Two Dogmas* (epistemology) and *Pursuit of Truth* / *Moral Values* (ontology). Your inference exposes that Quine's epistemology is more liberal than his ontology allows.

  **Conclusion:** Your inference holds water. The correspondence/coherence hedge is Quine's attempt to stop the slide into moral realism that his own holism seems to invite. It is a consistent move *if* you prioritize his behaviorist ontology over his holistic epistemology. But if you prioritize the holism (as your reading of *Two Dogmas* suggests you should), the hedge looks arbitrary. That is a compelling thesis for a dissertation chapter.
