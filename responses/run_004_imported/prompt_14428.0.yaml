      *   **The Core Question:** Is Marcus right that this is irrational, or is there a respectable theory defending this? If defended, does it open the user to exploitation (money pumps)?

  2.  **Identify the Underlying Economic/Philosophical Concept:**
      *   This is the classic **Allais Paradox** (named after Maurice Allais, 1953).
      *   The pattern described (Certainty in Choice 1, Risk-seeking in Choice 2) is the most common violation of Expected Utility Theory.
      *   Marcus is correct *within the framework of Expected Utility Theory (EUT)*.
      *   However, EUT is not the *only* theory of rational choice.

  3.  **Evaluate Marcus's Claim (EUT Perspective):**
