  4.  **Evaluate the "Rationality" Claim (Beyond EUT):**
      *   Is violating EUT *irrational*? This is a deep debate in philosophy and economics.
      *   **The Certainty Effect:** People overweight outcomes that are considered certain relative to outcomes that are merely probable. This is a core finding of **Prospect Theory** (Kahneman & Tversky).
      *   **Regret Theory:** Choosing the gamble in Choice 1 and getting $0$ would feel terrible (regret) compared to taking the sure thing. In Choice 2, both are risky, so regret is minimized.
      *   **Rational Defense:** One can argue that "security" or "certainty" has intrinsic value beyond the mathematical expectation. It's not just about the final wealth state, but the *process* or the *psychological state* of knowing you are safe.
      *   *Verdict:* There are respectable theories (Prospect Theory, Rank-Dependent Utility, Regret Theory) that model this behavior not as a "mistake" but as a feature of human valuation.

