answer: |-
  The standard rationalist account of weakness of will is elegant, mathematically tractable, and almost certainly wrong about the phenomenon it claims to solve. On rationalist blogs, *akrasia* is routinely reduced to hyperbolic discounting: the agent plans to diet on Monday because the health benefits (large, late) outweigh the taste of cake (small, soon). But come Monday, the cake is immediate, the health benefits are distant, and the discount curve flips. The agent eats the cake.

  This model is undeniably useful for predicting behavior in intertemporal choice tasks. However, it does not explain *akrasia* in the strict Aristotelian or Davidsonian sense. Rather, it explains it away. By translating a synchronic conflict between judgment and action into a diachronic conflict between temporal selves, the hyperbolic discounting model dissolves the philosophical puzzle of irrationality by denying the existence of the irrational agent. It substitutes a story about preference reversal for a story about the failure of practical reason.

  ### The Davidsonian Puzzle: Synchronic Conflict

  To see why the discounting model misses the mark, we must first define the target. The puzzle of *akrasia*, particularly as sharpened by Donald Davidson in "How is Weakness of the Will Possible?", is not merely about changing one's mind. It is about a specific structural failure at a single moment in time.

  Davidson formulates the problem using the principle of continence: an agent should act in accordance with their all-things-considered (ATC) judgment. Strict *akrasia* occurs when an agent holds an ATC judgment at time $t$ that action $A$ is better than action $B$, and yet intentionally performs action $B$ at time $t$.

  The key word is *judgment*. This is not a mere desire or urge. It is a cognitive evaluation of reasons. In strict *akrasia*, the agent does not merely succumb to a stronger desire; they act against their own verdict on what is best. The puzzle is normative and psychological: How can the mind's verdict on what to do fail to cause the doing, when the mind is the very thing doing it? It implies a fragmentation of the agent *in the present moment*.

  ### The Hyperbolic Story: Diachronic Reversal

  Now consider the hyperbolic discounting (HD) model. In this framework, "value" is a function of magnitude and delay.
  *   At $t_1$ (Sunday), the discounted value of Health ($V_H$) is greater than the discounted value of Cake ($V_C$). The agent prefers Health.
  *   At $t_2$ (Monday), the delay to Cake shrinks to zero. The discount rate spikes. Now $V_C > V_H$. The agent prefers Cake.

  When the agent eats the cake on Monday, the HD model says they are maximizing their utility *at that moment*. They are doing exactly what they most prefer to do at $t_2$.

  This is a description of **diachronic preference reversal**, not synchronic *akrasia*. The conflict in the HD model is between Agent-$t_1$ and Agent-$t_2$. Agent-$t_1$ wants Agent-$t_2$ to diet; Agent-$t_2$ wants to eat cake. But Agent-$t_2$ is internally consistent. Their judgment (Cake is better *now*) matches their action (Eating cake).

  In the HD model, there is no weakness of will at the moment of action. There is only a change in market conditions. The "will" hasn't weakened; the incentives have shifted. By the time the action occurs, the agent's "all-things-considered judgment" has quietly updated to align with the temptation. The HD model saves the agent's rationality at the cost of their unity. It turns the agent into a sequence of distinct temporal slices, each perfectly rational within its own horizon, locked in a game-theoretic struggle with its successors.

  ### Changing the Subject

  Consequently, the hyperbolic discounting story changes the subject from a puzzle about *irrationality* to a puzzle about *coordination*.

  Strict *akrasia* is disturbing because it suggests reason is impotent. It suggests that knowing the good does not necessitate doing the good, even when the knowledge is active and present. This threatens the link between rationality and agency.

  The HD model removes this threat. It suggests that reason is always efficacious relative to current preferences. If I eat the cake, it is because, at that precise second, my cognitive machinery valued the cake more. There is no failure of reason to track judgment, because the judgment has shifted to track the desire.

  This explains why the HD model feels unsatisfying as an account of *guilt*. Guilt is the emotional correlate of synchronic *akrasia*—it is the pain of recognizing I am violating my own current standard. The HD model explains *regret* (Agent-$t_3$ wishing Agent-$t_2$ hadn't eaten the cake), but it cannot explain the guilt of Agent-$t_2$ *while* eating the cake. If Agent-$t_2$ is maximizing utility, why the internal conflict? Why the sense of "I shouldn't be doing this" *while* doing it? The HD model implies that if you are doing it, you must think you should (in terms of preference). The phenomenology of weakness suggests otherwise: we often act while simultaneously judging the action to be suboptimal.

  ### The Rejoinder: Is "Judgment" Just Folk Psychology?

  A proponent of the HD model might offer a strong rejoinder: *This distinction is pedantic. Talk of "all-things-considered judgments" that float free of revealed preferences is just confused folk psychology. To say an agent "prefers" X is just to say they choose X. If they choose the cake, they prefer the cake. Therefore, the Davidsonian puzzle is based on a category error. Once we accept the discounting model, there is no synchronic conflict left to explain.*

  This is an eliminativist stance. It argues that strict *akrasia* does not exist, only the *illusion* of it created by imprecise language. There are two major problems with this defense.

  **1. The Normative vs. Descriptive Gap**
  The eliminativist move conflates *predictive* preference with *normative* judgment. In economics, preference is defined by choice (revealed preference theory). If you choose the cake, you prefer the cake. But in the philosophy of action, a judgment of "best" is a claim about reasons, not just a report of a psychic tug-of-war.

  When an agent says, "I judge that dieting is best, but I am eating cake," they are not reporting a preference flip. They are reporting a failure of self-governance. They are saying, "My evaluation of reasons dictates $A$, but my motivational system is driving $B$." To reply, "No, your choice reveals you actually preferred $B$," is to talk past the agent. It substitutes a third-person behavioral definition of preference for the first-person experience of reasoning. It solves the puzzle by defining away the data. If we accept the eliminativist view, we lose the ability to distinguish between a rational change of mind and a failure of will. Both look identical: a preference reversal. But the agent experiences them differently. One feels like learning; the other feels like collapsing.

  **2. Non-Intertemporal Akrasia**
  The HD model relies entirely on time and delay. It explains why I might choose \$50 today over \$100 tomorrow, but prefer \$100 in 366 days over \$50 in 365 days. But strict *akrasia* often occurs without significant intertemporal delay.

  Consider moral *akrasia*. A soldier judges that standing his post is best, but flees in panic. The reward (safety) and the duty (post) are simultaneous. There is no hyperbolic curve to flip, because the consequences are equally present. Or consider anger: I judge that remaining calm is best, but I scream. The relief of screaming is immediate, but so is the cost of the social breach.

  If *akrasia* were merely hyperbolic discounting, it should vanish in scenarios where the rewards and costs are synchronic. Yet, we observe synchronic conflicts between judgment and action constantly. We often act against our ATC judgment even when the "temptation" offers no temporal advantage, only a visceral one. The HD model cannot account for this without stretching the definition of "delay" to the breaking point (e.g., "neural processing time"). In these cases, the conflict is truly synchronic: the judgment and the contrary action coexist in the same moment. The HD model, which relies on the *movement* of time to explain the flip, has no leverage here.

  ### Conclusion

  Hyperbolic discounting is a powerful tool for modeling addiction, savings behavior, and procrastination. It correctly identifies that human valuation is time-sensitive. However, it is a category error to present it as a solution to the philosophical problem of *akrasia*.

  The philosophical problem concerns the architecture of agency: how a unified mind can act against its own verdict. The economic model concerns the stability of utility functions over time. By adopting the HD model as an explanation of *akrasia*, we are not solving the puzzle of how judgment fails to move the will; we are asserting that judgment always moves the will, because "judgment" is just a name for whatever moved the will.

  This is a tamer story. It preserves the rationality of the agent at every time slice, but it sacrifices the unity of the agent across time. It turns the tragic struggle of the will against itself into a mere scheduling error between temporal selves. While this may be sufficient for designing commitment contracts or diet apps, it fails to capture the essence of the human experience of weakness: the haunting sense that, even as we reach for the cake, we know we should not, and that in doing so, we are not merely changing our preferences, but betraying our reason.
