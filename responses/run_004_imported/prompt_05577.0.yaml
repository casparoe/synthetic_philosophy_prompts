  3.  **Brainstorming Conceptual Analogies/Explanations:**
      *   *The "Fixed Target vs. Moving Goalpost" analogy:* The proposition is a fixed target. The conditional probability is a moving goalpost that depends on where you are standing (your evidence).
      *   *The "Information Sensitivity" argument:* Conditional probability is inherently context-sensitive (it depends on what you assume). A proposition is supposed to be context-invariant (it's true or false at a world, regardless of what you know).
      *   *The "Learning $A$" scenario:* This is the standard Lewis argument. If I learn $A$ is true, $P(B|A)$ becomes $P(B)$. But $P(A \to B)$ should just become the probability of the proposition restricted to $A$-worlds.
