      *   *Critique:* Does copyright law actually believe this?
      *   *Fix:* The prompt asks me to argue *for* the claim that the law is tracking this truth, even if the legislators didn't articulate it this way. I need to frame it as the law being "smarter than it knows."
      *   *Critique:* Make sure to address the "two distinct books" idea seriously.
