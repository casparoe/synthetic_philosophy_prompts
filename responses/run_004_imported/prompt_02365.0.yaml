answer: |-
  The standard legal explanation for the independent-creation doctrine is indeed pragmatic: it is a rule of evidence designed to spare the innocent from the impossibility of proving a negative. Since we cannot peer into a writer's mind to confirm they *didn't* see the prior work, we assume that without access, there is no liability. This treats the rule as a procedural shield, a concession to the limits of judicial fact-finding.

  However, this explanation rests on a shallow ontology of the literary work. It assumes that the "book" is merely the sequence of words—the textual artifact—and that the law simply lets one off the hook for accidentally replicating it. I argue instead that copyright law, perhaps inadvertently, aligns with a deeper philosophical truth about art: **a literary work is not a static object, but a communicative event.** It is individuated not by its syntax, but by its genesis.

  If we accept the Borges premise seriously, we must conclude that two verbatim-identical manuscripts are, in fact, two distinct books. Here is why the independent-creation rule tracks the metaphysics of literature rather than merely the difficulties of proof.

  ### 1. The Work as Speech Act, Not Structural Object
  To view a novel as a string of characters is to confuse the score with the music. A literary work is fundamentally a speech act. In the philosophy of language, the identity of an utterance depends on the speaker, the intent, and the context, not merely the phonemes produced.

  If I say "I promise to pay you" as a joke, and you say "I promise to pay you" as a binding contract, we have uttered the same sentence but performed different acts. Similarly, a novel is an act of meaning-making between an author and a world. If Author A writes a satire on 19th-century morality, and Author B independently writes a textually identical manuscript as a sincere romantic drama, they have not created the same work. They have created two different vectors of meaning that happen to intersect.

  Copyright law protects "original works of authorship." The emphasis on *authorship* is not decorative; it is constitutive. By requiring a causal link between the author's mind and the text, the law acknowledges that the value being protected is the *labor of the intellect*, not the arrangement of ink. If the labor is distinct, the work is distinct, even if the residue (the text) is identical. The independent-creation rule preserves the integrity of the work as an extension of a specific consciousness.

  ### 2. The Menard Principle: Selection as Creation
  Borges's Pierre Menard highlights that the merit of a text lies not just in what is written, but in what was *chosen*. In Cervantes's 17th century, writing a phrase like "truth is the mother of history" was a rhetorical commonplace. When Menard writes it in the 20th century, after Nietzsche and pragmatism, it is a bold philosophical stance.

  The "work" includes the implicit field of possibilities the author navigated. When Cervantes wrote *Don Quixote*, he was selecting words against the backdrop of chivalric romances. When Menard writes the same words, he is selecting them against the backdrop of modernism. The difficulty of the selection—the path taken through the landscape of language—is part of the aesthetic object.

  Patent law protects the *result* (the functioning machine) because utility is universal; a lever works the same way regardless of who built it. Copyright protects the *expression*. Expression is inherently relative to the options available and the intent of the chooser. Therefore, the history of the choice is part of the expression. Two identical texts generated by different histories represent different aesthetic achievements. The law recognizes this by refusing to conflate the two authors' rights.

  ### 3. Context as a Constituent Element
  A literary work does not exist in a vacuum; it exists in a dialogue with history. The meaning of a text is partly determined by its temporal and cultural location. A description of a horse-drawn carriage means something different in 1850 than it does in 2024 (where it might be nostalgia or fantasy).

  If two authors produce identical texts in different eras (or even different cultural milieus in the same era), they are engaging with different traditions. One might be reinforcing a trope; the other might be subverting it. Since the "book" experienced by the reader is a collaboration between the text and the context, the context is part of the work's identity.

  The independent-creation rule implicitly respects this contextual individuation. By tying rights to the specific act of creation, the law acknowledges that the work is situated in a specific time and place. To say Author B infringes Author A would be to claim that Author A owns the *context* in which those words make sense, which is impossible. Author A only owns their specific intervention in that context.

  ### 4. The Moral Right of Origin
  While American copyright is often framed as economic, it shares DNA with the European *droit d'auteur*, which emphasizes the moral rights of the creator. There is an intrinsic injustice in declaring that Author B's manuscript is "really" Author A's book, even if the text matches. It erases Author B's agency.

  If the law treated identical texts as the same work regardless of genesis, it would be asserting that the author is merely a conduit, a typist for the Platonic forms of stories. But we do not treat artists as conduits. We treat them as originators. If the independent-creation defense were removed, the law would be asserting that the text has an existence independent of the author, waiting to be claimed by the first person to file it. That is a patent logic, not a copyright logic. By maintaining the defense, the law affirms that the work belongs to the person who *willed* it into existence, not just the person who holds the copyright on the sequence.

  ### Conclusion
  The evidentiary explanation suggests that copyright *would* punish independent creators if only we could prove they didn't copy. I argue the opposite: if we could know for a fact that two authors created identical texts independently, copyright law *should* still treat them as non-infringing, because they have created different works.

  The text is merely the fossil; the work is the living creature that left it. Two identical fossils found in different strata, formed by different organisms, are not the same animal. Copyright's independent-creation rule is not a loophole born of evidentiary weakness. It is a recognition that literature is an action, not an object. To write is to do, and no one can infringe upon another's doing, only upon the theft of the proof that they did it. In protecting the history of making, the law correctly identifies that the "book" is the trajectory of the mind, not the shadow it casts on the page.
