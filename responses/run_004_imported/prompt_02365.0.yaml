  2.  **Initial Brainstorming & Philosophical Grounding:**
      *   *Ontology of Art:* What *is* a work of art? Is it the physical object (the manuscript), the abstract type (the text), or the action/event (the creation)?
      *   *Goodman's Distinction:* Nelson Goodman distinguishes between autographic and allographic arts. Painting is autographic (history matters, a forgery is different even if identical). Literature is allographic (history shouldn't matter, a perfect copy is the same work). The prompt asks me to challenge Goodman or refine the allographic view to include *authorship* as part of the work's identity.
      *   *Intentionality:* The meaning of a text depends on the author's intent. If Author A writes a satire and Author B writes a sincere drama, but the text is identical, are they the same book? No.
      *   *Context/Horizon:* The historical context of creation changes reception. Cervantes writing in 1605 vs. Menard writing in 1930.
      *   *Copyright's Implicit Metaphysics:* Copyright law might accidentally be right about art theory, even if its stated justification is pragmatic.

  3.  **Developing the Argument Structure:**
      *   **Introduction:** Acknowledge the standard evidentiary view. Introduce the Borges counterpoint. State the thesis: Copyright law inadvertently captures the ontological reality that a literary work is an *event* or an *action*, not just a *structure*.
      *   **Point 1: The Intentional Fallacy (Reversed):** Wimsatt and Beardsley said don't look at the author. But meaning *does* rely on intent. If the history of making differs, the intent differs, therefore the work differs.
      *   **Point 2: Context and Reception (The Menard Effect):** A text doesn't exist in a vacuum. It exists in a dialogue with history. Cervantes is reacting to chivalric romances of the 16th century. Menard is reacting to symbolism/modernism of the 20th. The *work* includes this dialogue.
      *   **Point 3: Authorship as Performance:** Writing is a performance. Two performances of the same script are distinct events. Two writings of the same text are distinct creative acts. Copyright protects the *labor of the mind*, not just the output.
      *   **Point 4: Contrast with Patent:** Why is patent different? Patents protect *utility/function*. A machine works the same regardless of who built it. Literature works through *meaning*. Meaning is context-dependent.
      *   **Conclusion:** Summarize. The law isn't just failing to catch copiers; it's recognizing that you can't steal a thought process, only the expression of a specific process. The "book" is the trajectory, not the destination.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the Borges reference. It's the perfect hook. The law looks like a bug (hard to prove copying), but it's actually a feature (art is genetic).
      *   *The Ontological Shift:* Move from "text as object" to "text as trace." A text is a fossil of a mental event. If the event is different, the fossil represents a different creature, even if the bone structure is identical.
      *   *Meaning vs. Syntax:* This is crucial. Syntax can be identical. Semantics cannot. If I write "I am tired" after a marathon, and you write it after insomnia, the sentence is the same, the *statement* is different. Apply this to novels.
      *   *The "Work" vs. The "Text":* Use Kristeva or Barthes? Maybe too dense. Stick to the Menard analogy. Menard's *Quixote* is richer because it implies a different selection process. To choose "truth is the mother of history" in 1605 is cliché. To choose it in 1930 is pragmatic/historical. The *selection* is part of the work.
      *   *Copyright's Moral Dimension:* Copyright is often called "moral rights" in Europe (droit d'auteur). It ties the work to the person. The US is more economic, but the independent creation rule preserves the link between mind and product.
      *   *Patent Contrast:* Reinforce this. Patents are about *what works*. Copyright is about *what is said*. Function is universal; speech is particular.

  5.  **Refining the Tone:**
