  Here's a thinking process that leads to the suggested argument:

  1.  **Deconstruct the Prompt:**
      *   **Core Observation:** Copyright law allows independent creation as a defense (unlike patent law). If two authors write the same book independently, neither infringes.
      *   **Standard Explanation:** It's evidentiary. Copying is hard to prove, so we assume innocence if there's no access. It's a pragmatic workaround.
      *   **The User's Insight:** References Borges's *Pierre Menard, Author of the Quixote*. In the story, Menard writes *Don Quixote* word-for-word independently, but it's considered a *different*, richer work than Cervantes's.
