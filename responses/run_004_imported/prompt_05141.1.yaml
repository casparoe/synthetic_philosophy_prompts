      "claim": "The pump only works if the agent chooses naively (myopic evaluation).",
      "verdict": "Correct",
      "explanation": "Accurate. A naive agent evaluates each node in isolation without considering the future trajectory of the decision tree."
    },
    {
      "claim": "A sophisticated chooser uses backward induction to see the trap and declines the first offer.",
      "verdict": "Correct",
