      *   **User Persona:** Software engineer, familiar with Popper via David Deutsch/Critical Rationalism, no formal philosophy training.
      *   **Core Question:** If Karl Popper had lived to see *Kitzmiller v. Dover* (2005) and the Intelligent Design (ID) movement, how would he have reacted? Would he side with ID (using his early "tautology" critique) or with the Court/Mainstream Science (using his later recantation and demarcation criteria)?
      *   **Constraints:** Must use Popper's actual conceptual toolkit (demarcation, degrees of testability, corroboration, metaphysical research programmes). Avoid generic "Popper liked falsifiability" answers. Acknowledge the nuance of his shifting views on Darwinism.

  2.  **Deconstruct Popper's Views on Evolution:**
