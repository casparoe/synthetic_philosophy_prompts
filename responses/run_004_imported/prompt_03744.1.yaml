answer: |-
  You have excellent instincts. You've correctly identified that there are two main ways to handle this problem, and your proposed solution is actually one of them. In the academic literature, this is called the **Conclusion-Based Procedure (CBP)** (vote on the verdict) versus the **Premise-Based Procedure (PBP)** (vote on the reasons, derive the verdict).

  You are right that switching to CBP makes the *logical inconsistency* disappear. If everyone votes on the bottom line, you can't get a result that contradicts the majority view on the bottom line.

  However, you are also right to suspect it's "too easy." The reason the "Discursive Dilemma" (or Doctrinal Paradox) remains a massive headache for legal theorists, political scientists, and economists is that **solving the logical inconsistency creates a normative disaster.**

  Here is why your fix doesn't make the dilemma disappear, but rather just forces you to pick which poison you prefer.

  ### 1. The "Reason-Giving" Requirement
  In most high-stakes committee decisions (especially courts), you cannot just say "Yes" or "No." You have to explain *why*.
  *   **Appeals:** If a losing party wants to appeal, they need to know which part of the logic the group rejected. If the group just votes "Liable," but 2 judges thought there was no contract and 2 thought there was no breach, how does the appellate court review the decision?
  *   **Accountability:** If judges only vote on the verdict, they can hide behind the outcome. Voting on premises forces them to go on the record about specific legal standards.

  If you use your fix (CBP), you get a consistent verdict, but you often end up with a **fragmented rationale.** You have a winning outcome supported by a coalition of judges who disagree on *why* it won.

  ### 2. The Precedent Problem (Stare Decisis)
  This is the biggest issue for courts. Courts don't just resolve disputes; they make law for the future.
  *   **Scenario:** Imagine a case where Liability requires *Contract* AND *Breach*.
  *   **The PBP (Premise) Vote:** The majority says "Yes Contract" and "Yes Breach," so the group says "Liable." This sets a clear precedent: "In situations like this, there is liability."
  *   **The CBP (Verdict) Vote:** The majority says "Liable." But if you look at the sub-issues, maybe a different majority thought there was *no* contract.
  *   **The Problem:** If you only publish the verdict, future lawyers don't know the rule. Did the court rule that contracts of this type are valid? Or that this specific behavior counts as a breach?

  By voting only on the verdict, you solve the immediate paradox but create **legal uncertainty** for everyone in the future. The "law" becomes a black box.

  ### 3. The "Frankenstein" Decision (Legitimacy)
  There is a deep intuition in democracy that the group's position should reflect the majority's view on the constituent parts.
  *   Imagine a 3-judge panel.
  *   **Judge A:** Yes Contract, No Breach $\rightarrow$ No Liability.
  *   **Judge B:** No Contract, Yes Breach $\rightarrow$ No Liability.
  *   **Judge C:** Yes Contract, Yes Breach $\rightarrow$ Liability.
  *   **Verdict Vote:** 2 say No Liability, 1 says Liability. Result: **No Liability.** (This is CBP).
  *   **Premise Vote:** 2 say Yes Contract, 2 say Yes Breach. Implied Result: **Liability.** (This is PBP).

  If you use your fix (CBP), the verdict is "No Liability." But a majority of the court believes there *was* a contract, and a majority believes there *was* a breach.
  To an outsider, the court is effectively saying: *"We agree the contract exists, and we agree it was broken, but we rule you get no money."*
  That looks arbitrary. It undermines the legitimacy of the institution. It looks like the judges are result-oriented rather than law-oriented.

  ### 4. Juries vs. Judges (Where your fix actually works)
  You mentioned juries in your prompt. Interestingly, **juries actually use your fix.**
  Juries deliver a "General Verdict" (Guilty/Not Guilty, Liable/Not Liable). They are explicitly *forbidden* from explaining their reasoning or voting on specific sub-issues in most criminal trials.
  *   **Why?** Because juries don't set precedent. Their job is to resolve *this specific case*, not to write a rule for next year.
  *   **The Trade-off:** We accept the potential logical inconsistency in jury deliberations (which we can't see anyway) because we value the finality and the "black box" protection of the jury.

  But for **judges** and **legislative committees**, your fix fails because their job *is* to provide coherent reasoning and rules.

  ### The Real Dilemma
  The "Discursive Dilemma" isn't really a puzzle about how to get the same answer both ways (mathematically, you can't). It is a **normative dilemma** about what we value more in a group decision:

  1.  **Collective Rationality (PBP):** The group's set of beliefs is logically consistent (The premises support the conclusion), even if the verdict contradicts what a majority would have voted on directly.
  2.  **Majoritarianism on the Outcome (CBP):** The verdict reflects the direct will of the majority of the members, even if the group's stated reasons for that verdict are logically incoherent.

  **Summary:**
  Your fix (vote on the verdict) solves the *math* problem but creates a *governance* problem. It stops the group from contradicting itself on the bottom line, but it allows the group to lie (inadvertently) about the reasons why. Since courts and committees exist primarily to generate reasoned decisions and precedents, they can't simply adopt your fix without breaking their primary function.

  So, you didn't miss anything obvious! You just identified the "Conclusion-Based Procedure," and the "dilemma" persists because that procedure has expensive downsides of its own.
