  7.  **Final Review:** Does this meet the user's "backend dev" level? Yes, use analogies like refactoring code or optimization loops, but keep the logic tight. (The prompt asks for a dialogue, so I will write that directly).

  8.  *(Final Polish)*: Ensure the distinction between "coherent" and "goal-directed" is explicit. Coherence is internal consistency; goal-directedness is about external behavior patterns.

