answer: |-
  Having spent 35 years in the lab, you know better than anyone that the "crisis" isn't really a statistical error; it's a human behavior problem driven by incentives. The root disease is **researcher degrees of freedom** (the ability to tweak analysis until it looks significant) combined with **publication bias** (novelty over accuracy).

  The proposals that rank highest are those that constrain human flexibility or structurally verify truth, rather than those that just swap out the mathematical ruler. Preregistration locks the garden gate before you see what's growing; replication checks if the plants are actually real. Mathematical tweaks (like lowering the threshold) just make the ruler finer without stopping you from bending it.

