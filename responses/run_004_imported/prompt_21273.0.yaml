prompt: |-
  Spent about thirty-five years running a cancer biology lab before I retired, so p-values pretty much ran my life for three decades. Now that I've got time on my hands I've been reading a bunch of philosophy of science, and I keep running into all this fighting about the replication crisis. Everybody's got thier favorite fix and honestly I cant tell anymore which ones are actually treating the disease versus just rearranging deck chairs.

  Could you rank the proposals below by how much each one actually gets at the *root* cause of the crisis, as opposed to being a band-aid or a political compromise? My grandkid tells me this is called a "tier list" - so S down to D, where S means it really addresses the underlying problem and D means it's basically cosmetic:

  - Preregistering hypotheses and analysis plans
  - Lowering the conventional significance threshold to p < 0.005
  - Swapping p-values for Bayes factors
  - Requiring direct replication before a finding counts as established
  - Mayo's "severity" requirement (a result only counts as evidence for a claim if the test procedure had a good chance of showing the claim was false, had it actually been false)
  - Specification-curve / multiverse analysis (running the analysis every reasonable way and reporting the whole spread of results, not just the one that worked)
  - Mandatory open data and code
  - Adversarial collaborations between researchers who disagree
  - Dropping significance testing altogether in favor of effect sizes and interval estimates

  A couple sentences of reasoning first is fine, but please give your final answer as a JSON block like this:
  ```json
  {"S": [...], "A": [...], "B": [...], "C": [...], "D": [...]}
  ```
