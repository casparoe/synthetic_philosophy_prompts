  For a novel I am drafting, I want to write a scene in which George Eliot lives roughly a decade longer than she actually did — long enough to read Nietzsche's Twilight of the Idols, where he names her specifically as his prime English example of a thinker who discards the Christian God while clinging all the more fervently to Christian morality, as if the latter were moral capital she has no right to keep spending once its theological backing is gone. I don't need Nietzsche's argument restated — I want Eliot's side of it, reconstructed from what she actually thought and wrote in her own lifetime: her translations of Strauss and Feuerbach, her essays on religion and evangelical piety, and the moral logic running through her novels. Does his charge really land against her particular account of where moral feeling comes from, or had she, in effect, already answered him before he ever wrote a word? Give me her response as a short passage in her own voice, followed by a brief paragraph, in your own words, identifying exactly which of her real commitments that passage draws on.
