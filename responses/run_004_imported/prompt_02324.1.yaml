answer: |-
  **From the Journal of Mary Ann Evans (1889)**

  "There is a German philosopher, sharp-eyed and severe, who accuses me of living on usury—of spending moral coin minted by a Church I have left, as if the gold of righteousness were hoarded in heaven and only lent to earth. He sees a twilight where I see a dawn. He supposes that because I have ceased to look for a Rewarder beyond the clouds, I must necessarily find the duty beneath my feet to be a ghost. But the bond between man and man is not a shadow cast by a deity; it is the substance from which the idea of deity was first drawn. 

  When I feel the weight of a neighbor's sorrow, or the solemn claim of a promise, I am not drawing on a theological credit that is exhausted. I am feeling the pulse of the great human fellowship, which existed before the creeds and will outlast them. The sacredness is not in the commandment written on stone, but in the quivering heart that receives it. To say we cannot have the love without the Lover is to mistake the hunger for the bread. We do not spend an inheritance from God; we earn our bread by the sweat of our sympathy. The capital is not divine; it is human, accumulated in the silent, unhistoric acts of kindness that bind generation to generation. If that is a fiction, then the pain of a child is a fiction. I find it real enough to live by, and real enough to die for."

  ***

  **Analysis**

  This passage draws directly on Eliot's Feuerbachian conviction that theology is actually disguised anthropology—that religious feelings are projections of genuine human needs and ideals, not the other way around. By asserting that the "bond" precedes the "deity," she invokes the central argument of her translation of *The Essence of Christianity*: that love is the true reality, and God is merely its conceptual vessel. Furthermore, her emphasis on "unhistoric acts" and "sympathy" reflects the moral logic of her mature novels (particularly *Middlemarch*), where ethical authority arises from social interdependence and the imaginative capacity to feel another's suffering, rather than from divine sanction. She had indeed answered Nietzsche beforehand by relocating the source of moral "capital" from a supernatural bank to the tangible economy of human relationships.
