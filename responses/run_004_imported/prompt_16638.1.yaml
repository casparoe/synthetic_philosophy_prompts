          *   *Marcus:* The "Rare Particle" analogy. If the signal is rare and hidden by noise (fraud), null results don't prove non-existence. Caution works both ways.
          *   *Evaluation:* Elena highlights the *termination condition* problem. Marcus highlights the *epistemic condition* of the field.

      *   **Move 3:**
