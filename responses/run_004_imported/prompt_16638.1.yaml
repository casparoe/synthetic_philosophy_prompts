answer: |-
  This is a fantastic debate to be having about a character, because it mirrors the actual historical ambiguity surrounding Sidgwick. Neither Elena nor Marcus is entirely wrong, but they are arguing past each other on different definitions of "rationality." Elena is arguing from *psychological motivation*, while Marcus is arguing from *methodological procedure*.

  Here is a breakdown of their exchange, move by move, followed by the crucial context both of them are missing that could deepen your characterization.

  ### Round 1: The Motive vs. The Method

  **Elena's Claim:** Sidgwick's inquiry was motivated reasoning. He needed immortality to resolve the "Dualism of Practical Reason" (the conflict between self-interest and duty), so he looked for ghosts to save his ethical system.
  **Marcus's Counter:** A motivated believer stops when they find "proof." Sidgwick exposed fraud, even among allies, and published negative results. That is the behavior of a skeptic, not a zealot.

  **Who has the better of it?**
  *   **Elena wins on History:** She is factually correct about Sidgwick's philosophy. In *The Methods of Ethics*, Sidgwick famously concluded that without a belief in divine moral government (and thus immortality), utilitarianism is fundamentally unstable. He *did* have a massive philosophical stake in the outcome. Elena is right that this creates a potent vector for bias.
  *   **Marcus wins on Behavior:** He is right that "motivated reasoning" usually manifests as confirmation bias (ignoring the bad, highlighting the good). Sidgwick's willingness to debunk the "Luxor Report" and other high-profile cases undermines the idea that he was simply hunting for validation.

  **Verdict:** **Draw.** Elena identifies the *risk* of bias; Marcus identifies the *mitigation* of bias. A rational agent can have a strong desire for a specific outcome (Elena) while still adhering to rigorous methods to test it (Marcus). The tension between the two is where your character lives.

  ### Round 2: The Negative Verdict vs. The Rare Signal

  **Elena's Claim:** He never quit. 25 years without a definitive "there is nothing here" conclusion suggests he couldn't accept the answer he was getting. "I'll keep searching forever" is avoidance.
  **Marcus's Counter:** The "Rare Particle" analogy. If the phenomenon is rare and obscured by fraud (noise), null results don't prove non-existence. Continuing to look is caution, not bias.

  **Who has the better of it?**
  *   **Marcus wins on Logic:** In epistemology, you cannot prove a universal negative. If Sidgwick claimed "Psychic phenomena do not exist," he would be making an unscientific claim. Marcus is correct that in a field rife with deception, a long string of null results is inconclusive, not dispositive.
  *   **Elena wins on Pragmatics:** Marcus's analogy fails on *resource allocation*. A physicist looking for a particle has a theoretical model predicting its mass and location. Sidgwick was looking for a phenomenon with no agreed-upon mechanism, often relying on the testimony of unreliable narrators. At a certain point, the "opportunity cost" of the search becomes irrational. Elena is right that refusing to set a termination condition is a hallmark of emotional attachment, not scientific inquiry.

  **Verdict:** **Edge to Elena.** Marcus's defense works for the *validity* of the research, but not for the *sustainability* of it. A purely rational agent updates on the *probability of success*, not just the data. After 25 years of mostly fraud, the probability of the next case being genuine drops precipitously. Staying in the game that long suggests the "philosophical stake" (Elena's Round 1 point) was overriding the "diminishing returns" calculation.

  ### Round 3: The Asymmetry of Skepticism

  **Elena's Claim:** He was quick to expose fraud in mediums but slow to apply that skepticism to the project itself. That asymmetry is the tell.
  **Marcus's Reply:** (Implicitly defended in Round 2, but Elena frames this as the clincher).

  **Who has the better of it?**
  *   **Elena takes this round.** This is the strongest argument against Sidgwick's rationality. It is what psychologists call "belief in belief." Sidgwick applied high-fidelity skepticism to the *instances* (is this medium cheating?) but low-fidelity skepticism to the *hypothesis* (is this worth studying?).
  *   If he were truly following the evidence, the sheer volume of fraud should have triggered a meta-analysis: "Is the signal-to-noise ratio too low to warrant this effort?" By debunking the trees but refusing to question the forest, he insulated his core hope from the very skepticism he wielded as a weapon.

  **Verdict:** **Elena.** This is the most damning piece of evidence for "motivated reasoning." It suggests he was protecting the *possibility* of the phenomenon more than he was investigating the *reality* of it.

  ---

  ### What Both of Them Are Missing

  For your novel, the debate between Elena and Marcus is binary: Rational vs. Irrational. But Sidgwick (and your character) occupies a more interesting third space. Here is what your writing group is overlooking:

  **1. The "Cost of Error" Asymmetry (Pascal's Wager)**
  Both assume Sidgwick was trying to maximize *truth*. He may have been trying to minimize *regret*.
  If psychic phenomena are real, they are the most important discovery in human history (validating ethics, religion, consciousness). If they are fake, they are a waste of time.
  *   **The Rational Calculation:** Even if the probability is 1%, the *value* of the discovery is infinite. Therefore, a rational agent might invest 25 years into a 1% chance.
  *   **For the Novel:** Your character isn't necessarily fooling himself. He may have consciously decided that the risk of missing the truth was worse than the risk of wasting his life looking for it. That makes him tragic, not deluded.

  **2. The Shift from "Skeptic" to "Cautious Believer"**
  Elena and Marcus treat Sidgwick as a static skeptic. He wasn't.
  Historically, Sidgwick's views softened over time, particularly after the death of his wife, Eleanor (who was herself a medium). He eventually came to believe that *some* form of telepathy or survival was probable, though he remained cautious about "spirits."
  *   **The Missing Nuance:** He didn't spend 25 years finding nothing. He spent 25 years filtering noise until he found a signal he couldn't explain away.
  *   **For the Novel:** If your character remains a "professional skeptic" to the end, you are missing the arc. The most compelling version of this character is one who *wants* to remain a skeptic, but the evidence (perhaps a specific personal tragedy) forces him to reluctantly accept a possibility he finds philosophically inconvenient.

  **3. The Social Function of the Inquiry**
  The Society for Psychical Research (SPR) wasn't just about ghosts; it was about creating a space where science and religion could talk without fighting.
  *   **The Missing Context:** Sidgwick knew he wouldn't find a ghost. But by treating the subject *seriously*, he forced materialists to engage with religious claims and religious people to engage with empirical evidence.
  *   **For the Novel:** Your character might know, on some level, that the search is futile, but continues it because the *process* keeps the question of immortality alive in the public discourse. He is sacrificing his scientific reputation to keep a philosophical door open. That is a noble, irrational, or deeply rational act depending on how you frame it.

  ### Recommendation for the Character

  Don't let your writing group force you to pick a side. The tension *is* the character.

  *   **Give Elena's point weight:** Show the character having moments of exhaustion where he suspects he is chasing a ghost because he's afraid of the dark.
  *   **Give Marcus's point weight:** Show him ruthlessly dismantling a friend's beloved medium, proving he isn't easily fooled.
  *   **Add the Missing Layer:** Give him a private moment where he admits that even if he finds nothing, the *act of looking* is a moral duty.

  **The Verdict for your Head:** Elena is right about the *psychology* (he was motivated), but Marcus is right about the *epistemology* (he wasn't necessarily unscientific). The tragedy of the character is that he used scientific tools to solve a problem that science couldn't touch, because his soul demanded an answer his logic couldn't provide.

  That is better fiction than "he was a fool" or "he was a saint."
