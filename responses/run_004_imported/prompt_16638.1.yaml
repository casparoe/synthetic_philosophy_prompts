      *   *Sidgwick's Specific Conclusion:* He *did* become more convinced later in life (especially after his wife's death/mediumship). He didn't remain a total skeptic; he shifted to a "cautious believer."
      *   *The "Rationality" Definition:* Is rationality maximizing truth or maximizing coherence? Sidgwick might have viewed the *possibility* as significant enough to warrant the cost, regardless of the low yield.
      *   *Character Utility:* For the novelist, the *ambiguity* is more useful than the verdict.

