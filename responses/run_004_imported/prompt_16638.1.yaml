          *   *Marcus:* Psychology check. True believers stop when they find "proof." Sidgwick kept exposing cheats and publishing bad news. That's not self-deception; that's rigor.
          *   *Evaluation:* Elena identifies the philosophical stake accurately. Marcus identifies the behavioral evidence accurately.

      *   **Move 2:**
