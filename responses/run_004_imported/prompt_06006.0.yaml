      *   *Check:* Did I answer the "why aspects?" question? Yes, because they are geometric archetypes. Did I answer the "principle vs. profit"? Yes, it's both, but the principle is deeper than usually acknowledged.

  6.  **Self-Correction/Nuance Check during drafting:**
