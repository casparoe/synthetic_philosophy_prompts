      *   *Common Prior Assumption (CPA):* All rational agents start with the same probability distribution over states of the world before receiving private information.
      *   *Subjectivist Bayesianism (de Finetti/Savage):* Priors are subjective. As long as they satisfy probability axioms (coherence), they are rational. No requirement for agreement.
      *   *The "Harsanyi Doctrine" / Rationality Argument:* Some argue that differences in priors reflect differences in information or processing. If processing is identical and information is shared, priors *should* be the same. Differences in priors might be seen as "brute facts" about psychology, not rationality.
