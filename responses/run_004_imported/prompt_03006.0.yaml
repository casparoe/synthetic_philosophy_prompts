      Actually, the better Bayesian move is: I don't update on $e$ directly. I update on $E$ ("It appears that $e$"). Then $P(h|E)$ depends on $P(E|h)$ vs $P(E|\neg h)$. If my model says $P(E|h)$ is high (due to noise), then $E$ confirms $h$ or leaves it stable.
