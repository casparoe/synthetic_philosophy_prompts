answer: |-
  You are absolutely right to be nagged by this. The standard rationalist dismissal—"just avoid probability 1"—is a mathematical technicality that fails to engage with the epistemic mechanism of dogmatism. It treats the Dogmatism Paradox as a bug of *extremal values* when it is actually a bug of *structural asymmetry* in how evidence is modeled.

  Here is the steelman case for why the Dogmatism Paradox survives the Bayesian fix intact, and why "Cromwell's Rule" is a superficial patch that leaves the underlying vulnerability wide open.

  ### 1. Dogmatism Lives in the Likelihoods, Not the Prior
  The standard fix assumes the problem is located in the prior credence $P(h)$. It suggests that if $P(h) < 1$, the door is open. This is incorrect. In a Bayesian framework, belief updating is driven by the likelihood ratio: $\frac{P(e|h)}{P(e|\neg h)}$.

  You can maintain a dogmatic posture without ever touching $P(h)=1$ simply by rigging the likelihoods. If you are 99.5% confident in $h$, you are implicitly committed to a model of the world where $h$ is true. In that model, what does counter-evidence $e$ look like? If $h$ is true, $e$ *must* be the result of measurement error, fraud, or noise. Therefore, a consistent Bayesian model of $h$ will assign a high probability to $P(e | h, \text{background knowledge about instruments})$.

  Conversely, because you are already 99.5% confident in $h$, your model of $\neg h$ is likely under-specified, imagined as a chaotic alternative, or assumed to be a world where evidence is *also* unreliable. If you structure your likelihood function such that $P(e | h) \approx P(e | \neg h)$ (i.e., "this evidence looks like noise regardless of the truth"), the likelihood ratio approaches 1, and your credence barely moves.

  You have successfully ignored the evidence, satisfied Conservation of Expected Evidence (CEE), and never assigned $P(h)=1$. The dogmatism isn't in the certainty of the belief; it's in the certainty of the *error model*.

  ### 2. The "Immune System" Effect
  High-credence beliefs naturally develop an epistemic immune system. This is not a feature of irrationality; it is a feature of coherent modeling. If I believe Newtonian mechanics is true with 99.9% probability, and I see an anomalous reading on a scale, my highest-probability explanation is not "Newton is wrong," but "the scale is uncalibrated."

  This is exactly Kripke's paradox re-engineered for Bayesians. Kripke said: "If I know $h$, I know evidence against $h$ is misleading." The Bayesian says: "If I am 99.9% confident in $h$, I should be 99.9% confident that apparent evidence against $h$ is misleading."

  The functional output is identical. In both cases, the agent pre-commits to discounting a reference class of evidence. The Bayesian version is arguably *more* insidious because it claims the mantle of rationality. It allows the agent to say, "I am not ignoring the evidence; I am updating on the high probability that the evidence is spurious." But since the probability of the evidence being spurious is derived *from* the high credence in $h$, the reasoning is circular. You are using $h$ to validate the reliability of the evidence, and the evidence to validate $h$. Cromwell's Rule breaks the logical circle of *certainty*, but it does not break the probabilistic circle of *coherence*.

  ### 3. Conservation of Expected Evidence is Too Weak a Constraint
  You correctly identified that CEE only constrains the *average* movement of credence. It does not constrain the response to *specific* pieces of evidence.

  A dogmatic Bayesian can satisfy CEE while remaining functionally closed-minded by assigning an extremely low prior probability to *encountering* strong counter-evidence. If I believe $h$ is true, I expect evidence to support $h$. Therefore, $P(e_{\text{strong}})$ is tiny. CEE states:
  $$P(h) = P(h|e)P(e) + P(h|\neg e)P(\neg e)$$
  If $P(e)$ is vanishingly small, $P(h|e)$ can be vanishingly small (a massive update) without affecting the average $P(h)$ significantly.

  However, in the real world, agents don't update on "possible evidence"; they update on "actual evidence." When the rare $e$ actually appears, the agent faces a choice: update massively (admit I was wrong) or update my model of the evidence generation process (decide the instrument broke). Because the latter is often computationally cheaper and protects the high-value asset (the belief in $h$), the agent adjusts the error model.

  This preserves the *structure* of dogmatism: the agent treats the arrival of counter-evidence as a reason to doubt the measurement, not the hypothesis. CEE is satisfied mathematically, but the epistemic closure remains. The "escape hatch" of Cromwell's Rule is theoretically open but practically locked by the asymmetry of the error model.

  ### 4. Convergence Failure and Aumann's Agreement
  The ultimate test of whether the Bayesian fix solves the paradox is whether it allows for convergence. If two agents have different high-credence beliefs ($P_A(h) = 0.99$, $P_B(h) = 0.01$) and share evidence, should they converge?

  In the idealized "no probability 1" world, yes. In the "dogmatic likelihood" world, no. If Agent A's model of the world includes "instruments tend to glitch when $h$ is true" (a prediction derived from $h$), and Agent B's model includes "instruments are reliable," they will look at the same data $e$ and update in opposite directions. Agent A sees $e$ and thinks "Glitch confirmed," raising $P(h)$. Agent B sees $e$ and thinks "Disconfirmation," lowering $P(h)$.

  This is not a theoretical edge case; it is the standard description of political polarization and scientific paradigm defense. Both agents are following Bayes' Rule. Neither assigns probability 1. Yet they diverge. This demonstrates that the Dogmatism Paradox is not about the *limits* of probability, but about the *underdetermination* of likelihood functions. Removing $P=1$ does not force agents to agree on how evidence is generated, which is where the dogmatism actually hides.

  ### 5. Practical Indistinguishability
  Finally, we must address the "distinction without a difference" point you raised. For a bounded agent with finite computational resources and a finite lifespan, the difference between $P=1$ and $P=0.999999$ is negligible *if* the decision threshold for action is lower than that.

  If I act on $h$ whenever $P(h) > 0.95$, then a belief held at 0.9999 is functionally absolute. If my updating rules are designed to protect beliefs above 0.99 from dropping below 0.95 (by attributing counter-evidence to noise), I am dogmatic in every way that matters for behavior.

  Kripke's paradox was never really about the metaphysical status of "Knowledge." It was about the *licensing of dismissal*. The paradox shows that if you claim to know $h$, you are licensed to dismiss defeaters. The Bayesian fix says, "If you claim 99% confidence, you are licensed to heavily discount defeaters." Since "heavily discount" and "dismiss" yield the same downstream actions and the same resistance to belief change, the paradox survives.

  ### Conclusion
  The standard rationalist response treats the Dogmatism Paradox as a problem of **numerical boundaries**. It is not. It is a problem of **epistemic closure**.

  By moving from $P(h)=1$ to $P(h)=0.995$, you avoid a mathematical singularity, but you retain the structural capacity to insulate a belief from refutation. You do this by embedding the belief so deeply into your causal model of the world that counter-evidence is predicted to be spurious. This allows you to pre-commit to discounting evidence, satisfy Conservation of Expected Evidence, and remain strictly Bayesian, all while exhibiting the exact same dogmatic behavior Kripke identified.

  " Just don't assign probability 1" is advice about bookkeeping. It is not advice about how to keep your mind open. The paradox stands because the mechanism of dogmatism is robust to probabilistic dilution.
