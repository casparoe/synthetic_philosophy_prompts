      *   *Key Point 1: Likelihood Ratios are the real driver.* Dogmatism lives in $P(e|\neg h)$, not $P(h)$. If you assume $\neg h$ implies a world where evidence is chaotic or deceptive, you can always explain away $e$.
      *   *Key Point 2: The "Noise" Prior.* You can assign high probability to "The instrument is broken" without assigning high probability to "The theory is wrong." This allows you to satisfy CEE while functionally ignoring the evidence.
      *   *Key Point 3: Practical Equivalence.* For any finite lifespan and computational budget, 0.9999 is indistinguishable from 1. The "escape hatch" of Cromwell's rule is theoretically open but practically locked.
      *   *Key Point 4: Self-Sealing Hypotheses.* Hypotheses that include "disconfirming evidence is likely to be misleading" as a *prediction* are self-sealing. This is compatible with Bayesianism.

