      2.  **Point 1: The Likelihood Loophole.** Dogmatism shifts from $P(h)=1$ to $P(\text{evidence is noise} | h) \approx 1$.
      3.  **Point 2: The Immune System.** High confidence beliefs generate predictions about the *unreliability* of counter-evidence.
      4.  **Point 3: CEE is satisfied trivially.** You can satisfy CEE while functionally ignoring evidence by assigning low probability to the evidence occurring *and* high probability to it being spurious if it does.
      5.  **Point 4: Practical Dogmatism.** For bounded agents, the computational cost of treating 0.9999 as different from 1 is too high.
