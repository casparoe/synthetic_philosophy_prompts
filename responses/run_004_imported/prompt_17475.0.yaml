      *   **Salvo 1: The Core Disagreement.** Mark defends the utility of the dualist frame. Sarah hits the realizability problem immediately.
          *   *Mark's point:* AIXI is a north star. Even if unrealizable, it guides us.
          *   *Sarah's point:* It's not just unrealizable; it's *wrong*. The map cannot contain the territory if the map is *in* the territory.
      *   **Deep Dive 1: The Grain of Truth/Realizability.**
