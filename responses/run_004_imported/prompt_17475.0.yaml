      *   *Pro-Embedded:* Let's call her **Sarah**. She worries about self-reference, ontological crises, and the structural impossibility of the dualist frame. She thinks ignoring it leads to catastrophic blind spots.
      *   *Dynamic:* Warm but sharp. They know each other's tells. They've had this argument before, but the workshop just reignited it.

  3.  **Drafting - Section by Section:**

