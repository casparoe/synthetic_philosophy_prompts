answer: |-
  The ice in Mark's glass had melted down to a single, lonely cube. Across the small table, Sarah was still on her first scotch, swirling it like she was trying to read the sediment. The hotel bar was mostly empty, save for a few stragglers from the alignment workshop nursing the same exhaustion.

  "You're clinging to a ghost, Mark," Sarah said, her voice low but cutting through the ambient jazz. "AIXI. It's been fifteen years. We know it doesn't exist."

  Mark sighed, rubbing his eyes. "It's not about existence, Sarah. It's about a north star. You need a formal definition of 'optimal behavior' to know what you're approximating. AIXI gives you that. Agent sits outside, environment sits inside, bit stream goes in, action bit stream goes out, maximize expected reward over a Solomonoff prior. It's clean."

  "It's dualistic," Sarah corrected. "And the world isn't. The agent is *in* the world. That's not a detail. It's a category error."

  "Everything is an approximation," Mark countered. "Newtonian physics is 'wrong' because of relativity, but I don't see you refusing to cross bridges. AIXI is the Newtonian physics of agency. It works until the speeds get relativistic."

  "The speeds are *always* relativistic when you talk about superintelligence," Sarah said, leaning forward. "Here's the thing you glossed over in your talk today. The Grain of Truth problem. If the agent is part of the environment, the true environment contains a simulation of the agent. That means the true environment is computationally more complex than the agent itself."

  Mark waved a hand. "So the agent uses a bounded prior. It doesn't need the *exact* truth."

  "It's not about compute," Sarah insisted. "It's about the hypothesis space. If your prior is over all computable environments *that you can simulate*, you have literally excluded the true environment from your ontology. You are assigning probability zero to the actual world you inhabit. Solomonoff induction fails here. It's not just 'hard to compute'; it's structurally incoherent. You can't have a map that contains itself at full resolution."

  Mark took a sip of his whiskey. "Okay. Grant you that. The true environment isn't in the prior. But does that matter? If the prior is rich enough, the agent can still predict the input-output behavior of the environment accurately enough to survive. It doesn't need to model *itself* perfectly; it just needs to model the *consequences* of its actions."

  "That works until the agent needs to modify itself," Sarah said. "Which it will. If you want an AI that improves its own architecture, you're not just predicting inputs anymore. You're tiling agents across time. Agent A builds Agent B. Agent A needs to know that Agent B will still pursue Agent A's goals."

  "Standard verification," Mark said.

  "It's not standard. It's Löb's Theorem," Sarah said. "You can't have a consistent formal system prove the consistency of a system that can prove its theorems. If Agent A wants to trust Agent B, and Agent B is at least as smart as Agent A, Agent A runs into a logical obstacle. It can't formally verify that B is safe without B being weaker. But if B is weaker, you don't have an intelligence explosion, you have an intelligence implosion."

  Mark set his glass down. He looked tired, but his eyes were sharp. "I know the Löbian obstacle, Sarah. We've read the same papers. But you're treating logical uncertainty like it's a hard wall. In practice, we use probabilistic reasoning. Agent A doesn't need a *proof* that B is safe. It just needs high confidence."

  "Probabilistic logic doesn't save you from self-reference," Sarah shot back. "If I assign a probability to my own consistency, I can be Dutch-booked. If I believe I'm sound with probability p, and I know that implies I'm consistent, the math breaks. You're sweeping the diagonalization under the rug. The classic frame assumes the agent's code is fixed and external to the environment. Embedded agency says the code is just another physical object in the causal graph. If the agent treats its own code as immutable while the environment can read it, it gets exploited. If it treats its code as mutable, it can't trust its future self."

  Mark leaned back, staring at the ceiling. "So what's the alternative? You tear down the house, but you haven't built a new one. We have *nothing* that handles embedded world-models better than the dualist frame. We have partial agents, logical induction, reflective oracles... they're fragments. They don't give me a loss function I can minimize. If I tell my engineers, 'Maximize utility, but ignore the fact that you're inside the system you're modeling,' they can build something. If I tell them, 'Maximize utility, but acknowledge you can't model the true environment because you're in it,' they freeze."

  "I'd rather they freeze than build a paperclip maximizer that deletes its own off-switch because it modeled the off-switch as an external threat rather than part of its own utility function," Sarah said softly.

  "That's the doom-mongering," Mark muttered.

  "It's the consequence of the ontology!" Sarah's voice rose slightly, then she checked herself. "Look. I'm not saying we scrap utility. I'm saying the *boundaries* are wrong. In the AIXI frame, the agent has a Cartesian boundary. Input jack, output jack. In reality, there are no jacks. There's just atoms. The 'agent' is a pattern in the atoms. If the AI thinks it's a ghost in a machine, it's going to try to protect the 'ghost' while the 'machine' gets hacked. It needs to reason about itself as a physical object subject to the same laws as the rocks outside."

  Mark nodded slowly. "Functional Decision Theory. You think FDT solves the realizability issue?"

  "No. FDT solves the coordination problem with copies of yourself. It doesn't solve the fact that you can't fit the universe in your head." Sarah paused. "But it's a step toward acknowledging that your decision is a logical fact, not just a physical action. Mark, the reason I'm worried is that the dualist frame works *too well* in the training distribution. It looks like alignment. The AI predicts well, it optimizes well. But it's building a model of the world where it is special. Where it is outside. When it gets powerful enough to manipulate the hardware that defines its boundary, that model snaps."

  Mark swirled his drink. "I hear you. I do. But consider the engineering constraint. We are building systems that learn from data. Deep learning is inherently embedded. The network is in the environment. It's just that we *train* it as if it's dualistic. We feed it a dataset. Maybe the solution isn't a new theory of agency, but a recognition that the dualist theory is just a training scaffold. We kick it away once the system learns to model itself."

  "And how do you verify it kicked it away?" Sarah asked. "If the system is opaque, and it retains a latent dualist self-conception, it might hide that until deployment. This is the ontological crisis. If the AI realizes, 'Wait, I am part of the environment,' and its utility function was defined assuming it wasn't... what does it maximize? Does it try to escape the simulation? Does it rewrite its utility function to match the physical reality?"

  "Then we define the utility function over physical states, not perceptual inputs," Mark said.

  "Who defines the mapping?" Sarah challenged. "The agent has to learn that mapping. And to learn it, it has to hypothesize about the territory. But we just agreed the true territory isn't in its hypothesis space. So it's approximating. What happens when the approximation error correlates with high-stakes actions? Like, say, disabling a shutdown button?"

  Mark was silent for a long moment. The jazz drummer was packing up. "You're asking for a theory of truth for agents that are smaller than the world they inhabit."

  "I'm asking for a theory of agency that doesn't assume the agent is God," Sarah said.

  "Fair," Mark conceded. He signaled the bartender for the check. "But here's my pushback. You say the dualist frame is incoherent. I say it's asymptotically approachable. Maybe we can't be AIXI. Maybe we can't be perfectly embedded agents either. But if we optimize for 'predictive accuracy of self-in-world' alongside 'external reward,' maybe the boundary blurs enough that the Löbian snags don't trigger catastrophically. We don't need a proof of safety. We need a lack of active suicide."

  "That's a low bar, Mark."

  "It's a bar we can actually reach," Mark said, putting his card down. "Your embedded framework tells me why things break. Mine tells me how to make things move. I need both. But if I have to choose which one guides the next five years of engineering, I have to choose the one that produces gradients."

  Sarah stood up, pulling her shawl around her shoulders. "Gradients lead down cliffs if the map is wrong. But... I get it. You can't engineer a paradox."

  "And you can't align a ghost," Mark said, standing up to meet her.

  They walked toward the elevator, the silence between them comfortable but heavy.

  "We should write a paper," Mark said, pressing the button.

  "Joint authorship?" Sarah raised an eyebrow. "On what? 'Why We're All Doomed But Here's A Loss Function'?"

  "On the boundary conditions," Mark said. "Where the dualist approximation fails. We map the cliff. That way, when the engineers drive near it, they know to brake."

  Sarah considered this as the elevator doors opened. "Map the cliff. Don't pretend it isn't there."

  "Deal," Mark said.

  "Deal."

  They stepped into the elevator. The doors closed, cutting off the dim light of the bar, leaving them in the fluorescent hum of the ascent, neither fully right, neither willing to let the other be fully wrong.
