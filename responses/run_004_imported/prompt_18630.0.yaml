prompt: |-
  Jeffrey conditionalization is supposed to fix a real gap in Bayesian updating: plain conditionalization only tells you what to do when evidence makes you certain of something, but most evidence just shifts your confidence around without pinning it to 1 (Jeffrey's own example is examining a cloth by candlelight and coming away more confident, but not certain, that its green). The catch is that unlike ordinary conditionalization, Jeffrey's rule isn't commutative -- get two pieces of uncertain evidence in different orders and you can land on two different final credences, which literally can't happen with plain conditionalization on certain evidence. Some people take that order-dependence as a real strike against Jeffrey conditionalization as a norm of rationality (why should the accident of which piece of evidence hits you first change where your beliefs end up?), others think it's just an unavoidable feature of updating on soft evidence and no big deal. Write an essay on this: actually explain why the non-commutativity happens, weigh the case that it's a defect against the case that it isn't, and land on a real verdict rather than 'it depends' -- something like 'it's fine except in these specific cases' totally counts, a shrug doesn't.
