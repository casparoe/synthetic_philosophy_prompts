answer: |-
  **The Candlelight and the Compass: Why Non-Commutativity is a Defect in Jeffrey Conditionalization**

  Bayesian epistemology rests on the idea that rational belief is probabilistic and that learning is a matter of updating those probabilities. For decades, Plain Conditionalization (PC) was the gold standard: when you learn evidence $E$ with certainty, your new credence in hypothesis $H$ becomes your old credence in $H$ given $E$. But as Richard Jeffrey pointed out in 1965, this model is brittle. It cannot handle the messy reality of human perception, where evidence rarely forces certainty. In his famous example, examining a cloth by candlelight might raise your confidence that it is green from 0.5 to 0.7, but it does not—and should not—raise it to 1. To handle this, Jeffrey proposed Jeffrey Conditionalization (JC), a rule for updating on uncertain evidence.

  However, JC comes with a notorious mathematical quirk: it is non-commutative. If an agent receives two pieces of uncertain evidence, the final credence depends on the order in which they are processed. Plain Conditionalization is commutative; learning $E$ then $F$ yields the same result as learning $F$ then $E$. Jeffrey Conditionalization does not. This has sparked a debate: is this order-dependence a fatal flaw in the norm of rationality, or an unavoidable feature of learning from soft evidence? While the defense of JC offers insights into the psychology of experience, the non-commutativity of the rule is ultimately a normative defect. It reveals that JC cannot serve as a fundamental law of rational belief revision, but must instead be relegated to the status of a pragmatic heuristic for when the ideal model is inaccessible.

  To understand why non-commutativity occurs, one must look at the mechanical difference between how PC and JC handle information. Plain Conditionalization updates by conditioning on the *intersection* of evidence. If I learn $E$ and then $F$, I am effectively conditioning on $E \land F$. Since logical conjunction is commutative ($E \land F$ is identical to $F \land E$), the order of processing is irrelevant. The mathematical operation cuts the possibility space down to the same region regardless of the path taken.

  Jeffrey Conditionalization works differently. It does not condition on the truth of a proposition; it imposes a constraint on the *probability* of a partition. If I update on the color of the cloth, I set $P_{new}(\text{Green}) = 0.7$. JC then preserves the "rigidity" of conditional probabilities: the relationship between Green and other hypotheses (like "the cloth is cotton") remains fixed relative to the old distribution. The problem arises in sequential updating. When I apply a second JC update (say, on the texture of the cloth), I am not applying it to the original distribution, but to the distribution already shifted by the first update. The conditional probabilities used as weights in the second step have been altered by the first step. Because the first shift changes the background correlations against which the second shift is measured, doing Color-then-Texture yields a different mathematical result than Texture-then-Color. The second update effectively "double counts" or "ignores" correlations depending on the baseline it inherits.

  Defenders of JC argue that this order-dependence is not a bug, but a feature. They contend that uncertain evidence is not merely "weak certain evidence," but a distinct kind of doxastic event. When I look at the cloth, I am not learning the proposition "The cloth is green"; I am undergoing an experience that *causes* my confidence in green to rise. These experiences are time-indexed events. The experience of checking the texture happens *after* the experience of checking the color, in a different doxastic context. Therefore, the "evidence" is not just the content (Green/Textured), but the content plus the timing and the psychological state of the observer. From this perspective, demanding commutativity is asking for the impossible; it requires treating sequential experiences as if they were simultaneous logical constraints. If the inputs are genuinely different (Experience 1 then Experience 2 vs. Experience 2 then Experience 1), the outputs should be allowed to differ.

  This defense, however, conflates the *causality of belief* with the *logic of justification*. While it is true that the psychological process of learning is sequential, the normative goal of Bayesianism is to align credences with the structure of the world, not the history of the observer's mind. Rationality demands that if two agents possess the same total evidence, they should converge on the same beliefs, regardless of the order in which they processed that evidence. If order matters, then belief becomes path-dependent in a way that allows for arbitrary manipulation. An agent could potentially "pump" their credences by cycling through evidence in a favorable order, or two rational agents with identical data could permanently disagree simply because one looked at the color before the texture. This violates the core Bayesian intuition that evidence accumulates toward a truth that is independent of the observer's trajectory.

  Furthermore, the "unavoidable feature" argument relies on an underspecification of the evidence. The non-commutativity arises because JC inputs are impoverished. When I say "My confidence in Green is now 0.7," I am reporting a result, not the evidence itself. As philosophers like Brian Skyrms and Hartry Field have noted, if we model the evidence more richly—for example, by specifying the likelihood ratio of the experience itself rather than just the posterior probability—we can restore commutativity. The fact that standard JC fails to commute suggests that the rule is asking us to update on *consequences* of evidence (the probability shift) rather than the *cause* of evidence (the experience). When we update on consequences sequentially, we lose track of the common cause, leading to inconsistency.

  Therefore, the verdict must be clear: **Non-commutativity is a normative defect that disqualifies Jeffrey Conditionalization as a universal law of rationality.**

  This does not mean JC is useless. It remains the best tool we have for modeling perceptual learning where the evidence cannot be propositionally encoded (i.e., where we cannot say "I am certain I had a green-ish experience"). In these "hard case" scenarios, JC is rationally permissible as a fallback. However, its non-commutativity signals that it is a *heuristic approximation* of Plain Conditionalization, not a replacement for it.

  The obligation for a rational agent is to strive for commutativity. Whenever possible, agents should reconstruct uncertain evidence into certain propositions about their own experiences (e.g., "I am certain that I had a visual experience as of green") and use Plain Conditionalization. This restores order-independence and ensures that beliefs reflect the world rather than the sequence of observation. When this reconstruction is impossible, and JC must be used, the agent must acknowledge that their final credence is partially a function of the order of acquisition. They are operating in a zone of rational instability.

  In conclusion, the non-commutativity of Jeffrey Conditionalization is not a benign feature of soft evidence, but a mathematical symptom of informational loss. It shows that JC updates on the *shadow* of evidence rather than the substance. While we may be forced to use Jeffrey's rule in the candlelight of uncertain perception, we must recognize it as a lifeboat, not a cruise ship. It keeps us afloat when Plain Conditionalization cannot be applied, but it does not offer the same navigational stability. Rationality requires that our beliefs be determined by what we know, not by the order in which we learned it; because JC fails this test, it remains a subordinate tool in the epistemologist's kit, valid only when the superior norm of commutative updating is out of reach.
