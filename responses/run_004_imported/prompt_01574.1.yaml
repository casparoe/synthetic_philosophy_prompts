  2.  **Deconstruct the Text & Arguments:**
      *   *Premise 1:* "Horse" names shape. "White" names color.
      *   *Premise 2:* What names color is not what names shape.
      *   *Conclusion:* White horse is not horse.
      *   *Second Argument:* Request for "horse" $\rightarrow$ yellow/black okay. Request for "white horse" $\rightarrow$ yellow/black not okay. Therefore, "white horse" $\neq$ "horse".

  3.  **Analyze the Competing Interpretations of *Fei* (非):**

      *   **Reading A: Class Membership (The Standard Logic View)**
          *   Interpretation: "A white horse is not a *member* of the class 'horse'."
          *   Validity: Clearly false/invalid in standard set theory. White horses are a subset of horses.
          *   Plausibility: Hard to defend as "genuine logic" unless Gongsun Long is making a radical metaphysical claim about universals vs. particulars.

      *   **Reading B: Identity (The Logical Equivalence View)**
          *   Interpretation: "The concept 'white horse' is not *identical* to the concept 'horse'." (A $\neq$ B).
          *   Validity: True. The set of white horses is not identical to the set of all horses. The intension of "white horse" is not the intension of "horse".
          *   Plausibility: Makes the argument logically valid, but makes the claim trivial. "White horse" is a compound concept, "horse" is a simple one. Of course they aren't identical.
          *   Textual Fit: Fits the second argument (extension difference) well.

      *   **Reading C: Chad Hansen's Mass Noun/Semantic View**
          *   Interpretation: Chinese nouns are mass terms (like "water" or "horse-stuff"), not count nouns. *Fei* indicates a distinction in *stuff* or *kind*, not set membership.
          *   Core Idea: "White horse" invokes a specific compound *stuff* (white-horse-stuff). "Horse" invokes generic *stuff* (horse-stuff). They are different *kinds* of naming acts.
          *   Validity: Valid within its own semantic framework. It's about the *name* (ming) not matching the *actual* (shi) in a specific context.
          *   Plausibility: Avoids anachronistic Western logic (Aristotelian sets). Focuses on pragmatic usage of language.

  4.  **Evaluate the Advocate's Reasoning against the Readings:**

      *   *Argument 1 (Shape/Color):* "Horse" = shape, "White" = color. Color $\neq$ Shape. Therefore White Horse $\neq$ Horse.
