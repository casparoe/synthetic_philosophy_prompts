      *   *Argument 2 (Yellow/Black Horse):* Extension difference. If X = Y, they must have the same extensions. They don't. Therefore X $\neq$ Y.
          *   This is Leibniz's Law (Indiscernibility of Identicals). This strongly supports the **Identity** reading. If "White Horse" were identical to "Horse," asking for one would be the same as asking for the other.
