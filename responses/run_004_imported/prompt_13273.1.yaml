  *   **Conditional Commitment:** The solution isn't just to commit to "fairness," but to commit to a specific bargaining algorithm *conditionally* (e.g., "I will use the Nash Bargaining Solution if and only if you verifiably do the same"). This avoids Kev's "sucker" objection (Point 3) and Dana's "vagueness" problem (Point 4/5).
  *   **Updateless Decision Theory (UDT):** This framework suggests agents should choose policies based on their output as a logical fact, rather than updating on local information, which helps agents coordinate on the best joint outcome rather than racing to the worst one.
  *   **Verifiability:** In AI safety, code is legible. Unlike humans, AIs can cryptographically verify each other's source code. This makes commitments more credible but also makes the "clashing norms" problem (Kev's Point 5) more urgent to solve before deployment.

