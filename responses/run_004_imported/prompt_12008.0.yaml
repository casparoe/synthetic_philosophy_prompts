prompt: |-
  So a few months back I got roped onto the advisory board of a small foundation that gives grants for "stress-testing" findings a field considers basically settled -- sometimes a genuine adversarial collaboration between people who disagree, sometimes just a solid researcher asking for money to redo a classic result properly. I only landed this unpaid gig because I write about science and research culture for a living and someone thought that counted as "neutral." It's been easy so far, but a proposal on the docket for next weeks call has split the board right down the middle, and because I'm supposedly the neutral one, I've been asked to draft the recommendation memo.

  Here's the case: a well-regarded researcher wants about $60k to redo, with much better power and pre-registration, a finding that's been in every intro textbook in her corner of psychology for twenty years. Half the board says funding this is pointless, maybe even irresponsible -- we already know the effect is real, so we already know, before a single subject is run, that any contrary result the new study turns up will have to be a fluke or a confound, and it's a waste of scarce money to go "discover" that. The other half of us, me included (ever since a philosopher I interviewed for a different piece got me hooked on this), finds that argument kind of unsettling, because it seems to prove way too much: if simply knowing something now entitles you to write off in advance any future evidence against it, that would justify never funding a check on anything we're currently confident about -- which feels like exactly the failure mode the foundation exists to guard against. She called this general puzzle "the dogmatism paradox" and said it goes back to some unpublished Kripke lectures, for what that's worth.

  Could you draft the memo I'll circulate before the vote? I need an actual recommendation on this specific grant -- fund, decline, or fund with conditions, and on what timeline -- plus something like a standing principle the board could lean on next time this exact fight comes up, because it clearly will. Please don't dodge into "it depends": take a side. But be genuinely fair to the "we already know this, don't waste the money" camp, since their instinct doesn't strike me as crazy either.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Advisory Board Member (science writer/research culture expert, seen as "neutral").
      *   **Task:** Draft a recommendation memo for a specific grant proposal ($60k to replicate a settled psychology finding) and propose a standing principle for future cases.
      *   **Context:** Small foundation, mission is "stress-testing" settled findings/adversarial collaboration. Board is split 50/50.
      *   **The Conflict:**
          *   *Camp A (Skeptics):* The effect is settled. Funding a redo is wasteful/irresponsible because contrary results will just be dismissed as noise/flukes anyway. Prior probability of truth is near 1.
          *   *Camp B (Pro-Replication):* This reasoning leads to dogmatism (the "dogmatism paradox"). If we never test what we're confident about, we can never correct errors. This is the foundation's core mission.
      *   **Constraints:** Take a side (no "it depends"), be fair to the opposing view, provide a specific recommendation (fund/decline/conditions), and a standing principle.
      *   **Tone:** Professional, persuasive, balanced but decisive, suitable for an advisory board.

  2.  **Deconstruct the Arguments:**
      *   *The "Waste of Money" Argument:* Resources are scarce. Psychology has a replication crisis, but *some* things are actually true. If this effect is robust (textbook status for 20 years), the likelihood of a true null is low. If the study fails, it will likely be attributed to methodological differences, not the falsity of the theory. Therefore, expected value is low.
      *   *The "Dogmatism" Argument:* Science relies on empirical evidence, not consensus. Consensus can be wrong (e.g., ego depletion, power posing, priming). If we defund challenges to consensus, we calcify errors. The foundation's *specific mandate* is to stress-test settled findings. Declining this contradicts the mission.
      *   *The "Dogmatism Paradox" (Kripke):* Roughly: If I know $P$, I know that any evidence against $P$ is misleading. Therefore, I should ignore evidence against $P$. But if I ignore evidence against $P$, I can't update my belief even if $P$ is false. The solution usually involves acknowledging fallibility: I don't *know* $P$ with absolute certainty, so I must remain open to evidence.

  3.  **Determine the Recommendation:**
      *   The prompt asks me to "take a side."
      *   Given the foundation's explicit mission ("stress-testing findings a field considers basically settled"), declining the grant undermines the organization's *raison d'être*.
      *   However, the "Waste of Money" camp has a point about *which* settled findings to test. Not every textbook fact needs a $60k check.
      *   *Decision:* **Fund.** But with conditions to address the "waste" concern (e.g., ensuring the design is robust enough that a failure *would* be convincing).
      *   *Why:* The mission trumps the efficiency argument in this specific context. If this foundation doesn't do it, who will? Standard funding bodies won't.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context:** Briefly summarize the proposal and the board's division.
      *   **Analysis of the Objection (The "Skeptics"):** Validate their concern. It's not stupid to worry about resource allocation. Acknowledge that most replications of robust effects *do* succeed. Acknowledge the risk of "false negatives" being misinterpreted.
      *   **Analysis of the Mission (The "Pro-Replication"):** Connect to the foundation's charter. Highlight the "Dogmatism Paradox." Explain why settled science needs stress tests (historical examples of errors).
      *   **The Decision:** Fund.
      *   **Conditions:** How to mitigate the risk? High power (already proposed), pre-registration (already proposed), but maybe add *adversarial* oversight or a commitment to publish regardless of outcome. Let's suggest an "Adversarial Design" condition—let the skeptics on the board (or external skeptics) weigh in on the methods to ensure a failure would be undeniable.
      *   **Standing Principle:** Need a heuristic for future votes. Something like: "Settledness is not a disqualifier; it is a criterion for eligibility, provided the methodological bar is set higher." Or "The Entrenchment Test."

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is $60k a lot? For psych, it's moderate.
      *   *Critique:* Is the "Dogmatism Paradox" reference too academic? Keep it accessible.
      *   *Tone Check:* Ensure I'm not dismissing the "Skeptics" as anti-science. They are pro-efficiency. I need to show why efficiency is the wrong metric for *this* foundation.
      *   *Key Insight:* The foundation exists specifically to do what the NIH/NSF won't do. The "Waste" argument applies to NSF. It doesn't apply here.

  6.  **Developing the Standing Principle:**
      *   It needs to prevent *every* crackpot from demanding a redo of gravity.
      *   Principle: "High Consensus + High Stakes + Methodological Advancement = Eligible."
      *   Or: "The foundation funds challenges to consensus *only* when the proposed method significantly exceeds the original evidentiary standard."
      *   Let's go with: **"The Asymmetric Burden Principle."** To challenge a settled finding, the methodological bar must be higher than the original, but the consensus status cannot be used as a priori grounds for rejection.

  7.  **Final Polish:**
      *   Make it sound like it comes from a writer/thinker (clear, slightly philosophical but actionable).
      *   Ensure the recommendation is unambiguous.
      *   Check word count and flow.

      *(Self-Correction during drafting)*: I need to make sure I explicitly mention the "Dogmatism Paradox" since the user brought it up. It adds intellectual weight to the memo. I should frame it as: "If we accept the Skeptics' logic, we render our own mission impossible."

  8.  **Final Review against constraints:**
      *   Take a side? Yes (Fund).
      *   Fair to opposition? Yes (acknowledge scarcity/efficiency).
      *   Specific recommendation? Yes (Fund with conditions).
      *   Standing principle? Yes.
      *   Timeline? Yes (next cycle).

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** The Advisory Board, [Foundation Name]
  **FROM:** [Your Name], Advisory Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal #24-B (Replication of Settled Effect) and Standing Review Principles

  **Executive Summary**

  After reviewing the divergent perspectives on Proposal #24-B, I recommend that the board **vote to FUND** the proposal, subject to specific methodological conditions outlined below.

  While the concerns regarding resource allocation are valid within the broader context of scientific funding, they contradict the specific mandate of this foundation. To decline this proposal on the grounds that the finding is "already known to be true" is to accept a logical paradox that would render our organization obsolete. However, to address the legitimate risk of noisy null results, funding should be contingent on an adversarial review of the analysis plan.

  Additionally, I propose the adoption of a standing principle—the **"Asymmetric Burden Principle"**—to guide future votes on similar proposals.

  **The Core Conflict**

  The board is divided between two reasonable positions:

  1.  **The Efficiency Argument (Opposition):** Scientific capital is scarce. If an effect has survived twenty years of textbook inclusion, its prior probability of truth is near 1. A $60k expenditure to "rediscover" a known truth has low expected value. Worse, if the replication fails, the field will likely attribute it to methodological noise rather than falsifying the theory. Thus, the money is wasted either way.
  2.  **The Dogmatism Argument (Proponent):** If we refuse to test claims solely because they are currently accepted, we insulate science from correction. As noted in the discussion, this mirrors the "dogmatism paradox" (attributed to Kripke): If I claim to *know* $P$, I am entitled to dismiss any evidence against $P$ as misleading. But if I dismiss all evidence against $P$, I can never discover I was wrong. This foundation was built to interrupt that cycle.

  **Analysis of the Efficiency Argument**

  The Efficiency camp is not arguing against science; they are arguing for *triage*. In a world where early-career researchers struggle to secure seed funding for novel ideas, spending $60k on a "check" of a robust phenomenon feels like rearranging deck chairs. They are correct that most high-powered replications of robust effects succeed. They are also correct that a single failed replication rarely kills a textbook theory (the "theoretical immunization" problem).

  If we were the NIH or the NSF, this argument would be decisive. Those bodies are tasked with maximizing the rate of discovery. Funding a replication of a settled fact is, in that context, an opportunity cost.

  **Why the Efficiency Argument Fails Here**

  However, we are not the NIH. Our charter explicitly targets "findings a field considers basically settled."

  If we adopt the Efficiency Argument as a veto criterion, we create a catch-22:
  *   To get funded, a finding must be unsettled enough to warrant inquiry.
  *   But if it is unsettled, it doesn't meet our mandate to test *settled* findings.
  *   Therefore, we can never fund anything.

  The "textbook status" of this psychological effect is not a reason to decline the grant; it is the *only* reason the grant is eligible for us. The field has no mechanism to stress-test its own dogma because the incentive structure rewards novelty, not verification. If we do not fund this, no one will. The $60k is not buying a new discovery; it is buying an insurance policy against collective embarrassment. Given the replication crisis in psychology, that insurance has high value.

  **Recommendation: Fund with Conditions**

  I recommend we approve the $60k grant, but with two binding conditions designed to mitigate the "waste" risk:

  1.  **Adversarial Analysis Plan:** Before funds are released, the Principal Investigator (PI) must submit their analysis plan to a consultant chosen by the "Skeptic" wing of our board. This consultant's job is not to stop the study, but to ensure that if the result *is* null, it cannot be easily dismissed as a methodological artifact. We must ensure that a failure would be undeniable.
  2.  **Publication Commitment:** The PI must sign an agreement to submit the manuscript to a pre-agreed journal (e.g., *Advances in Methods and Practices in Psychological Science*) regardless of the outcome, with a guarantee that the foundation will cover open-access fees if necessary.

  **Timeline:** Approval contingent on the Adversarial Analysis Plan being signed off within 60 days. Funds disbursed upon signature.

  **Proposed Standing Principle: The Asymmetric Burden**

  To prevent this debate from paralyzing us at every meeting, I propose we adopt the following standing principle for future proposals challenging settled science:

  > **The Asymmetric Burden Principle:**
  > *Consensus status is never grounds for rejection, but it does raise the methodological bar.*
  >
  > 1.  **Eligibility:** A proposal cannot be rejected solely on the basis that the underlying theory is widely accepted or "settled."
  > 2.  **Burden of Proof:** For settled findings, the proposed methodology must demonstrably exceed the rigor of the original evidence (e.g., higher power, pre-registration, multi-lab design).
  > 3.  **Falsifiability:** The PI must demonstrate how a null result would be distinguishable from methodological failure. If the design allows a null result to be dismissed as "noise," the grant is declined.

  **Conclusion**

  The Efficiency camp is right that we cannot fund every replication. But we must fund *some*. If we retreat from testing settled findings because they are settled, we cease to be a foundation for stress-testing and become merely another grantor for novel hypotheses.

  We should fund this study. If the effect holds, we have spent $60k to strengthen the foundation of a sub-field. If the effect fails, we have spent $60k to correct a twenty-year error. Both outcomes are worth the price.

  **[Your Name]**
  Advisory Board Member
