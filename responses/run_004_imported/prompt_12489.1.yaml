      *   *No neat resolution?* Yes, ending on the fundamental axiom clash.

  *(Self-Correction Note)*: I need to make sure Mark doesn't just sound like he's attacking, but also exposes his own flank regarding determinism. Rossi should press Mark on whether "God ordains sin" makes God the author of sin, which is the classic Reformed tension.

  8.  **Final Polish:** Check the flow and voice. (Proceeds to generate output).

  *(Post-Drafting Thought)*: The ending needs to be poignant. They are future family. The disagreement matters, but the relationship matters more. Acknowledge the tension.

