answer: |-
  **Setting:** *Dr. Rossi's study. Late afternoon. The light is fading through the stacks of books. There is coffee, but it's gone cold. Mark (the Reformed Calvinist) and Dr. Rossi (the Catholic Molinist) are sitting in leather armchairs. They have agreed to set a timer for ninety minutes so dinner doesn't interrupt them this time.*

  **Mark:** Okay. Timer's set. No mom calling us down. I want to go straight to the thing that stops me cold. You say God knows, *logically prior* to His decree to create, what any possible free creature would do in any possible circumstance. These are the Counterfactuals of Creaturely Freedom—the CCFs.

  **Rossi:** That's the gist, yes.

  **Mark:** Here's the grounding objection, and I want you to not tell me it's a "mystery." If I don't exist, and the world doesn't exist, and only God exists... what *makes* it true that "If Mark were in circumstance C, he would freely choose X"? Truth requires a truthmaker. Something has to ground that proposition. If nothing grounds it, it's not knowledge; it's a guess. If God grounds it, then He's determining it. Which is it?

  **Rossi:** Fair. That is the heavy lifting of Molinism. I'll grant you that if God *causes* those counterfactuals to be true, Molinism collapses into Calvinism. I don't think He does. I think the truthmaker is *you*.

  **Mark:** But I don't exist yet.

  **Rossi:** You exist as a possible being. In the divine intellect, prior to the decree, there is an understanding of all possible essences. Your essence includes certain dispositions. It is part of *who Mark is* that in circumstance C, Mark chooses X. God doesn't write that script; He reads it. He surveys the landscape of possible persons and sees, "Ah, the Mark-essence entails this choice in that situation."

  **Mark:** So it's grounded in my essence?

  **Rossi:** Precisely.

  **Mark:** Then here's my problem. If my essence eternally necessitates that choice, in what sense is it free? If it is *true from eternity* that I do X, and it is grounded in *what I am*, then I cannot do otherwise. Not because God is forcing me, but because *I am the kind of thing that does X*. That's not libertarian freedom. That's just internal determinism. I'm determined by my own nature rather than God's decree, but the fixity is the same.

  **Rossi:** I think you're conflating *certainty* with *necessity*. Just because it's true that I *would* do X doesn't mean I'm *compelled* to do X. Look at it this way: God knows that if you were offered a bribe, you'd refuse it. Why? Because you're honest. But your honesty isn't a causal force that grabs your hand and makes you refuse. You still deliberate. You still could take the money, but you *wouldn't*.

  **Mark:** But if the truth is fixed logically prior to creation, I *wouldn't* is an eternal fact. God then looks at that fact and says, "Okay, I'll actualize the world where Mark is offered the bribe." By selecting that world, God ensures I refuse the bribe. He didn't make me honest, but He put me in the movie where my honesty plays out. He's still the Director.

  **Rossi:** He's the Director, yes. But He didn't write the lines. That's the distinction. In your view, Mark, God writes the lines *and* directs the movie. In my view, God casts the actors and sets the stage, but the actors improvise the lines, and God knows exactly how they'll improvise.

  **Mark:** But if God knows *exactly* how they'll improvise before He builds the stage, and He builds the stage *specifically* to get that improvisation... isn't the outcome secured by God's choice of stage?

  **Rossi:** Secured, yes. Determined, no. There is a difference between *strong actualization* and *weak actualization*. God strongly actualizes the circumstances. He weakly actualizes the free choices by placing creatures in circumstances where He knows what they will freely do. He cannot *force* the choice without violating the freedom He wants. In fact, Mark, this limits God.

  **Mark:** Limits God?

  **Rossi:** Yes. There might be a world where everyone freely accepts the Gospel. But it might be that for every possible person, the CCFs are such that if they were in that world, they would reject it. God might *want* to create a world with no sin, but given the CCFs of the possible persons available to Him, such a world isn't feasible. He is constrained by the truth of creaturely freedom. Is God constrained in your system?

  **Mark:** *[Pauses]* No. God ordains whatsoever comes to pass. If there's no sin, it's because He didn't ordain it. If there is sin, He ordained it for a greater end. Sovereignty means He isn't held hostage by possible persons.

  **Rossi:** But at what cost? If He ordains the sin, isn't He the author of it?

  **Mark:** We distinguish between decree and command. He decrees it to happen, but commands us not to do it. The responsibility lies with the secondary cause—me.

  **Rossi:** That's the move I can't make. If the causal chain traces back to God's decree as the first link, and the chain is unbroken... the responsibility traces back too. If I hold a gun to your head, you aren't responsible for pulling the trigger, even if your finger does the work. If God's decree ensures the choice, how are you the ultimate source?

  **Mark:** Because I desire to do it. I do what I most want to do.

  **Rossi:** But who made you the kind of person who wants that?

  **Mark:** God. For His glory.

  **Rossi:** *[Leans forward]* There it is. That's the bottom. For you, sovereignty is about *power* and *authorship*. God must be the ultimate author of reality, including the will, or He isn't God. For me, sovereignty is about *wisdom* and *relationship*. God is sovereign enough to create beings who can say "no" to Him, and still accomplish His ends.

  **Mark:** But your "beings who can say no" relies on these CCFs being true without a ground. I still don't buy the essence argument. If my essence grounds the choice, I'm a robot with a specific program. If my *will* grounds the choice, but I don't exist yet to will anything... the truth is floating. It's a brute fact.

  **Rossi:** I'll concede it's a brute fact. I'd rather have a brute fact about freedom than a deterministic decree about sin. I think the intuition of libertarian freedom—that I could have done otherwise in the exact same circumstances—is a deliverance of reason and experience. To deny it to save sovereignty seems to me to save the concept of God by sacrificing the image of God in man.

  **Mark:** And I'd say you're saving the image of man by sacrificing the sovereignty of God. If those CCFs are just "out there" alongside God, eternally true, independent of His will... aren't you positing something co-eternal with God that He doesn't control?

  **Rossi:** They aren't *things*. They're propositions in the Divine Intellect. They depend on God for their *existence* as thoughts, but not for their *truth value*. God knows them because they are true; they aren't true because God knows them.

  **Mark:** That sounds like a distinction without a difference. If they are in His intellect, and He is simple...

  **Rossi:** We're getting into Divine Simplicity, and we'll be here all night. Let's stay on the freedom. Mark, when you pray, what do you ask?

  **Mark:** I ask God to change hearts. To regenerate.

  **Rossi:** And if He doesn't?

  **Mark:** Then He didn't choose to.

  **Rossi:** So if a person dies without Christ, ultimately, it's because God didn't choose to change their heart.

  **Mark:** Yes.

  **Rossi:** And in my view, if a person dies without Christ, it's because God respected their freedom to reject Him, even though God knew beforehand they would do so and grieved over it. Which God do you want to worship? The one who could have saved everyone but didn't, or the one who wanted to save everyone but couldn't without turning them into puppets?

  **Mark:** *[Quiet for a moment]* I worship the God who saves. Effectually. I don't want a God who *tries*. But I hear your point on responsibility. It bothers me too. That's why we preach the gospel to everyone. We don't know the decree. But logically... if I'm honest... I think your "brute fact" CCFs are just determinism with extra steps. You've moved the determination from God's will to "possible essences," but the outcome is still fixed before I take a breath.

  **Rossi:** And I think your "secondary causes" are just puppets with feelings. You've moved the responsibility from God to me, but the power was never mine to begin with.

  **Mark:** So we're at an impasse.

  **Rossi:** We are. But look at where we landed. You're worried that if God isn't controlling the *outcome*, He isn't good or sovereign enough. I'm worried that if God controls the *outcome*, love isn't real.

  **Mark:** Exactly. I define love as God securing my good even against my will if necessary. You define love as God allowing me to reject my good so that my acceptance is mine.

  **Rossi:** And neither of us can prove the other wrong metaphysically. The Grounding Objection is real, but I live with it. The Author of Sin problem is real, and you live with it.

  **Mark:** *[Sighs, looks at the timer]* We have five minutes left.

  **Rossi:** Then let's agree on this. We both agree God is omniscient. We both agree He is providential. We both agree man is responsible. We just disagree on where the mystery sits. For you, the mystery is how I am free if God decreed my choice. For me, the mystery is how God knows my choice if He didn't decree it.

  **Mark:** I can agree to that. The mystery is just located in a different room of the house.

  **Rossi:** And since we're going to be family... I promise not to bring up Middle Knowledge at Thanksgiving if you promise not to bring up Reprobation.

  **Mark:** *[Smiles]* Deal. But I'm still praying your niece sees the logic of irresistible grace.

  **Rossi:** And I'll be praying she sees the logic of a love that risks rejection.

  **Mark:** *[Stands up]* Same God, different map.

  **Rossi:** Same God. Different map.

  *[They shake hands. The timer beeps.]*
