  **Deb_1 (The Pessimistic Meta-Induction): 2**
  Deb opens with the standard heavyweight argument against realism. Laudan's list is the canonical challenge: if past successful theories were ontologically wrong, why trust current ones? For a chemist, think of it like relying on a specific mechanistic model for a reaction that works perfectly for twenty years, only to find out the intermediate species you postulated never existed. Deb's move is dialectically strong because it forces the realist to explain *why* this induction fails without just asserting "science is special."

  **Marcus_1 (Structural Realism): 2**
  Marcus deploys the best available counter-argument. The Fresnel-to-Maxwell case is the paradigmatic example used by John Worrall to save realism from Laudan. He's right that the mathematical structure (the wave equations) survived even when the ontology (the mechanical ether) was discarded. This move successfully blocks Deb's claim that *nothing* survives theory change. It shifts the goal of realism from "true furniture" to "true structure," which is a robust philosophical position.

  **Deb_2 (The Triviality Objection): 2**
  This is the sharpest move in the exchange. Deb is echoing what's known as the "Newman Objection." Her point is that if a new theory must reproduce the old theory's predictions, it *must* share some mathematical structure by definition. If "structural realism" just means "the math that works gets kept," it's a trivial claim about empirical adequacy, not a substantial claim about the world's nature. She correctly identifies that structural continuity might be a prerequisite for prediction, not evidence of metaphysical truth.

  **Marcus_2 (The Defense): 0**
  Marcus struggles here. He claims we can tell "in advance" which assumptions are doing the work, but this is contentious; historically, it's usually only clear in hindsight which parts were "real structure" and which were "fuel." He also shifts the burden to Deb to analyze phlogiston or caloric, which is fair debate tactics but doesn't answer her triviality charge. He's blending Worrall's structuralism with Psillos's "selective realism" (abductive method), but without distinguishing them, his defense feels like a retreat.

  **What Both Are Missing**
  Since you're reading Psillos (*Scientific Realism: How Science Tracks Truth*), it's worth noting he actually agrees with Deb against Marcus on this specific point. Psillos argues that Structural Realism is *too* weak; he wants to save realism about entities (like electrons), not just equations, using abductive reasoning. He'd say Marcus concedes too much to Deb by abandoning the "furniture." Also, both miss the "Mature Science" clause: realists often argue Laudan's list includes immature theories, whereas current physics (like QED) is sufficiently stable to warrant belief. Finally, neither mentions *Entity Realism* (Ian Hacking): if you can spray electrons with a beam to alter a niobium crystal, they're real regardless of the theory describing them—a perspective that might feel more comfortable to a lab veteran than arguing over equations.
