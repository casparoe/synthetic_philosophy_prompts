answer: |-
  The rain against the forty-second-floor window didn't fall so much as it smeared, turning the city lights below into bleeding watercolors of amber and steel. Elias Thorne preferred it that way. Blurred edges were honest. Sharp lines lied.

  Elias was a senior actuary for Aethelgard Reinsurance. For thirty years, his life had been a meditation on the Law of Large Numbers. He priced catastrophe bonds for hurricanes that hadn't formed yet and underwrote longevity swaps for babies who wouldn't die for a century. He believed in the anchor of expected value. If you could sum the probability-weighted outcomes, you could name a price. If you could name a price, you could sleep.

  The man sitting opposite him, Julian Vane, did not look like he slept. Vane represented a consortium that didn't have a name, only a routing number in the Caymans. He had slid a single sheet of paper across the mahogany desk an hour ago.

  "The Pasadena Contract," Vane had said. His voice was dry, like pages turning in a crypt.

  Elias looked at the sheet now. The terms were deceptively simple. A fair coin is tossed until it lands heads. Let $n$ be the toss number of the first heads. If $n$ is odd, Aethelgard receives $2^n/n$ dollars. If $n$ is even, Aethelgard pays $2^n/n$ dollars.

  Elias tapped his calculator. The probability of the game ending on toss $n$ is $1/2^n$. The expected value contribution for each $n$ is therefore probability times payoff: $(1/2^n) \times (\pm 2^n/n)$. The powers of two cancelled out neatly.

  The series was $1 - 1/2 + 1/3 - 1/4 + 1/5 \dots$

  Elias exhaled. The alternating harmonic series. It converged conditionally to the natural log of 2. Approximately 0.693.

  "It's a trivial exposure," Elias said, reaching for his pen. "Expected loss is sixty-nine cents per contract. We can write a million of these and the variance washes out."

  Vane didn't blink. "Show me your ledger."

  Elias opened his laptop, pulling up the spreadsheet. He entered the terms in natural order: $n=1, n=2, n=3$. He ran the cumulative sum. The blue line on the graph wobbled gently and settled near 0.69.

  "See?" Elias said. "It's stable. It's priced."

  Vane reached into his briefcase and produced a second sheet of paper. It contained the exact same list of outcomes, the exact same probabilities, and the exact same payoffs. But the rows were reordered.

  "Try this summation," Vane said.

  Elias frowned. He typed in the new order. Vane had grouped the terms: one positive, two negatives, one positive, two negatives. No, wait. He had grouped them: two positives, one negative.

  Elias hit enter. The cumulative sum line on his graph didn't settle. It drifted. It climbed.

  "0.9," Elias muttered. "It's trending higher."

  "Keep going," Vane said.

  Elias scrolled down the infinite list. The terms were identical. The game was identical. The coin didn't care about the order in which an accountant wrote down the results. But the sum—the expected value that formed the bedrock of Elias's profession—was moving. With a different rearrangement, one positive term followed by three negative terms, the graph dipped. It trended toward negative infinity.

  "The Riemann Rearrangement Theorem," Vane said softly. "You learned it in analysis, before you learned to love the normal distribution. A conditionally convergent series can be rearranged to sum to any real number. Positive infinity. Negative infinity. Or nothing at all."

  Elias stopped typing. The hum of the server room seemed to grow louder. "This is bookkeeping. This isn't physics. The money changes hands when the coin lands, not when I sum the column."

  "Exactly," Vane said. "So when do you book the liability? If you report to your shareholders using the natural order, you show a profit of $\ln 2$. If you report using a prudent risk-ordering, you show a catastrophic exposure. If you use an aggressive ordering, you show a windfall. The gamble hasn't changed, Mr. Thorne. Only the truth has."

  Elias leaned back, the leather chair creaking. This wasn't St. Petersburg. He knew St. Petersburg. St. Petersburg was a beast of infinity; the payouts grew so fast the sum blew up. You could tame St. Petersburg by capping utility. You could say, 'A billion dollars is worth the same to me as ten billion,' and the math behaved. You could put a ceiling on the sky.

  But here? The payoffs were irrelevant. The terms $1/n$ got smaller. They vanished. The problem wasn't that the numbers were too big. The problem was that they didn't agree on where they were going.

  "I can cap the contract," Elias said, his voice tighter than he intended. "Clause 14-B. Maximum payout limited to global GDP. Bounded utility."

  Vane smiled, a thin stretching of skin. "Then you aren't pricing the Pasadena Game anymore. You're pricing a truncated version. You're admitting that the original game is unpriceable. And my client is offering you the original."

  "Then I refuse to play. Undefined expected value means no decision rule applies."

  "Does it?" Vane leaned forward. The light from the desk lamp caught the hollows of his eyes. "You price risk for a living. If you cannot assign a number to this, you cannot hedge it. If you cannot hedge it, you cannot hold it. But look at the contract again."

  Vane tapped the paper. "It doesn't ask for a price. It asks for a *partnership*. We split the winnings. But to register the partnership, your firm must declare the asset value on tomorrow's morning ledger."

  Elias looked at the clock. 3:00 AM. The morning ledger closed at 6:00 AM.

  "If I declare it at $\ln 2$, and the 'true' value is negative infinity, I'm fraud."

  "If you declare it at negative infinity, and the 'true' value is positive, you're incompetent."

  "There is no true value," Elias snapped. "That's the point. The expectation is undefined."

  "Then what is the risk?" Vane asked. "If the expectation is undefined, is the risk zero? Is it infinite? Your models require a moment. Give me the first moment."

  Elias stood up and walked to the window. The rain had stopped, leaving the glass slick and dark. He saw his own reflection superimposed over the city. He thought about the thousands of policies on his desk, all of them little stories about the future. They all relied on the assumption that the future could be averaged. That time was a line, and if you walked far enough down it, the noise canceled out.

  But the Pasadena Game suggested that time wasn't a line. It was a heap. And how you counted the heap determined whether you were rich or ruined.

  "I could insist on a privileged ordering," Elias said, turning back. "Temporal order. The coin lands in time. $n=1$ happens before $n=2$. We sum in the order of occurrence."

  Vane shook his head slowly. "Expected value is not a temporal process. It is a weighted sum over the state space. The state space is the set of all possible outcomes. Sets do not have order. Unless you impose one. And if you impose one, you are admitting the value comes from *you*, not the gamble. You are the source of the volatility."

  Elias felt a cold knot tighten in his stomach. This was the rot. It wasn't in the math; the math was honest. It was in the application. Decision theory assumed that rational agents maximized expected utility. But if the expectation itself was a mirage, dependent on the arbitrary arrangement of terms in a ledger, then rationality had no ground to stand on.

  He looked at the spreadsheet again. He highlighted the column of values. He could sort them. He could shuffle them. He could make the total say anything he wanted. He could make the contract worth a billion dollars. He could make it worth the destruction of the firm.

  All with the same ink. All with the same coin.

  "Why?" Elias asked. "Why bring this to me?"

  "Because the world is filling with Pasadenas," Vane said. He stood up, buttoning his coat. "Derivatives upon derivatives. Climate models with chaotic tail risks. Political outcomes with non-ergodic consequences. You people keep trying to solve St. Petersburg, capping the payoffs, bounding the utility. You think the problem is that the numbers get too big. But the problem is that they don't mean anything."

  Vane picked up his briefcase. "The contract expires at six. If you sign, you choose the ordering. You choose the reality. If you don't sign, you admit that your entire profession is based on the assumption that the universe sums absolutely."

  "I can't sign," Elias whispered. "I don't know what it's worth."

  "Then you are no longer an actuary," Vane said. "You are a gambler who refuses to look at the dice."

  Vane walked to the door. He didn't look back. "The coin is already in the air, Mr. Thorne. It's been in the air for a long time. You just haven't decided how to count the tosses."

  The door clicked shut.

  Elias was alone in the office. The silence was heavy, pressing against his eardrums. He looked at the laptop. The cursor blinked in the cell for 'Total Expected Value.'

  He could type 0.693. It was the natural order. It felt right. It felt like the way the coin fell.

  But he knew that if he shuffled the rows, the number would change. The reality of the contract would shift. Not the money—the money was physical, concrete. But the *value*, the abstract quantity that justified the exchange, the thing that allowed him to sleep at night, was fluid.

  He thought about capping the utility. He thought about restricting the state space. He thought about all the papers he'd read, all the fixes proposed by philosophers who treated this as a puzzle to be solved rather than a hole in the floor. They wanted to patch the hole. Vane wanted him to stare into it.

  Elias put his hand on the mouse. He highlighted the first thousand rows. He sorted them by magnitude, largest payout first. The sum jumped. He sorted them by smallest first. The sum crawled.

  He realized then that he wouldn't sleep tonight. Not because of the risk of loss. He could handle loss. Loss was a number.

  He couldn't sleep because for the first time in thirty years, the number itself was gone.

  He picked up the pen. It felt heavy, like a lead weight. He hovered it over the signature line. Below it, there was a box for 'Declared Asset Value.'

  Elias stared at the box. It was empty. It waited for a truth that did not exist. Outside, the city lights flickered, a billion tiny coins spinning in the dark, waiting for someone to decide how they landed.

  He did not sign. He did not close the laptop. He sat in the dark, watching the cursor blink, counting the seconds, knowing that the sum depended entirely on where he chose to stop.
