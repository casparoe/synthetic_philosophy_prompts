      *   *Check:* Is the Vulcan/Neptune historical accuracy maintained? *Neptune was very close. Vulcan was never consistently observed, residuals remained.*

  7.  **Final Polish:** (Produces the structured output below).
      *   Make sure to highlight that Marisol represents the *Duhem-Quine* thesis and Devon represents a more *Realist/Bayesian* intuition.
      *   Add the Lakatos point about "degenerating research programmes" as it fits the Vulcan story perfectly.
      *   Add the Mayo point about "severe testing" because it addresses the "fit" argument.

