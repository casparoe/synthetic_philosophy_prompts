answer: |-
  Welcome to the fold. It is a genuine pleasure to address a colleague who knows the physics but is navigating the philosophical currents for the first time. The Neptune/Vulcan case is a "chestnut" in philosophy of science precisely because it sits at the intersection of logic, history, and practice. It is the perfect storm for the debate your group is having.

  Since you asked for a move-by-move breakdown rather than a verdict, I will treat this as a dialectic. I will assess who holds the stronger position at each step, given the standards of philosophy of science, while keeping your physics intuition in mind.

  ### Move 1: Marisol (The Underdetermination Claim)
  **Claim:** *Same method, different outcomes. Evidence alone didn't distinguish. Rational to posit a planet both times.*

  *   **Who has the better of it:** **Marisol**, strictly speaking, on the logic of the situation.
  *   **Why:** She is invoking the **Duhem-Quine Thesis**. In logic, you cannot test a hypothesis ($H$) in isolation; you only test $H$ bundled with auxiliary assumptions ($A$) about instruments, background conditions, etc.
      *   Case 1: Newton + Planet X $\rightarrow$ Uranus Data.
      *   Case 2: Newton + Planet Y $\rightarrow$ Mercury Data.
      *   Logically, these are identical structures. If the data is anomalous, logic alone does not dictate whether you reject Newton ($H$) or the assumption that there are no other planets ($A$).
  *   **The Caveat:** Marisol is relying on *logical* underdetermination. She is correct that there is no *algorithm* that forces you to choose Newton over Vulcan based solely on the raw numbers at $t=0$. However, she is glossing over *degrees* of rationality. Just because both moves are permissible doesn't mean they are equally weighted.

  ### Move 2: Devon (The Evidential Daylight Claim)
  **Claim:** *Neptune fit tightly; Vulcan was messy/ad hoc. There was real evidential difference at the time.*

  *   **Who has the better of it:** **Devon**, on the practice of science.
  *   **Why:** Devon is appealing to **inference to the best explanation** and quantitative rigor. As a physicist, you know that a $\chi^2$ value matters. Le Verrier's prediction for Neptune was spectacularly precise (within 1° of actual position). The "Vulcan" hypothesis, by contrast, required constant tweaking of orbital elements and never produced a consistently observed transit.
  *   **The Caveat:** Devon is vulnerable to the "where do you draw the line?" problem. How many standard deviations of error constitute a refutation? If he says "5-sigma," Marisol can ask, "Why not 6?" If the cutoff is arbitrary, the underdetermination returns. He is relying on scientific intuition rather than a philosophical principle.

  ### Move 3: Marisol (The Theory-Ladenness Claim)
  **Claim:** *"Fit well enough" is a judgment call dependent on trusting Newton. You've just relocated the underdetermination.*

  *   **Who has the better of it:** **Marisol**, philosophically.
  *   **Why:** She has correctly identified that Devon's "evidential daylight" relies on a prior commitment to the Newtonian framework. If you were a radical skeptic in 1870, you could say, "The Vulcan residuals aren't proof of a planet; they are proof Newton is wrong." The fact that scientists *didn't* say that until Einstein shows that their judgment of "fit" was constrained by their trust in the core theory. This is the **theory-ladenness of observation**.
  *   **The Caveat:** She is edging toward a slippery slope. If *all* judgments of "fit" are just expressions of trust in the framework, then theory choice becomes purely sociological or psychological. It risks making science look like faith.

  ### Move 4: Devon (The *Reductio* Claim)
  **Claim:** *That proves too much. By that logic, no observation tests anything, including Relativity.*

  *   **Who has the better of it:** **Devon**, pragmatically.
  *   **Why:** This is a **transcendental argument**. He is pointing out that if Marisol's strict underdetermination were true, science would be impossible. We *know* GR was confirmed by the 1919 eclipse (to the satisfaction of the community). If Marisol's logic applies to Vulcan, it must apply to GR. If it applies to GR, we can never know anything. Since we *do* know things (or at least, act as if we do), Marisol's strict standard must be too high for actual scientific practice.
  *   **The Caveat:** This is a pragmatic check, not a logical refutation. Marisol can reply, "You're right, we can't *know* anything with certainty, we just have better or worse bets." Devon stops short of explaining *why* the bet on GR was better, other than "it worked."

  ---

  ### What They Are Both Missing

  Since you are a physicist, you will likely find the missing pieces familiar, even if the philosophical labels are new. Both Marisol and Devon are arguing in binary terms (Rational/Irrational, Tested/Untested), whereas modern philosophy of science (and physics) deals in probabilities and research trajectories.

  Here are three concepts that dissolve the stalemate:

  #### 1. Bayesian Confirmation Theory
  This is the natural home for a physicist. Marisol treats confirmation as binary (does the evidence prove the theory?). Devon treats it as intuitive ("it fits well").
  *   **The Fix:** You assign **priors**. In 1846, the prior probability that Newton was correct was extremely high, and the prior that a planet existed was non-zero.
  *   **Neptune:** The likelihood of the data given (Newton + Neptune) was huge. The likelihood of the data given (Newton + No Planet) was tiny. Posterior probability for Neptune skyrocketed.
  *   **Vulcan:** As years passed without a sighting, the likelihood of (Newton + Vulcan) decreased. Simultaneously, the "cost" of the auxiliary hypothesis increased (you had to make Vulcan smaller, darker, or on a weirder orbit to hide it).
  *   **Takeaway:** Underdetermination exists, but it is overcome by **updating probabilities**. It wasn't that Vulcan was logically impossible; it became probabilistically untenable compared to the cost of modifying Newton.

  #### 2. Lakatos and "Research Programmes"
  Imre Lakatos offered a specific historical model that fits this case perfectly. He argued we shouldn't look at single theories, but **Research Programmes**.
  *   **Hard Core:** Newton's Laws (untouchable).
  *   **Protective Belt:** Auxiliary hypotheses (planets, friction, instrument error).
  *   **Positive Heuristic:** The programme is "progressive" if it predicts *novel* facts (Neptune). It is "degenerating" if it only explains anomalies by adding ad hoc patches without new predictions (Vulcan).
  *   **Takeaway:** Neptune was a **progressive problemshift** (predicted a new entity found later). Vulcan became a **degenerating problemshift** (constantly adjusting parameters to save the theory without new observational success). Marisol misses the temporal dimension; Devon sees it but can't articulate the principle.

  #### 3. Mayo and "Severe Testing"
  Deborah Mayo argues that evidence confirms a theory only if it passes a **severe test**. A test is severe if it is highly probable that the test would have failed if the theory were false.
  *   **Neptune:** Le Verrier predicted a specific coordinate. If Newton were wrong, or if there were no planet, the telescope pointing at that coordinate would almost certainly have found nothing. Finding the planet there was a severe test.
  *   **Vulcan:** The hypothesis was adjusted so many times (invisible, small, close to sun) that it became hard to test severely. You could always say, "It was cloudy," or "It's too small to see."
  *   **Takeaway:** Devon is right that there was "evidential daylight," but the metric isn't just "fit," it's **risk**. The Neptune prediction risked being wrong; the Vulcan hypothesis insulated itself from risk.

  ### Summary for Your Group
  If you want to bridge the gap at your next meeting:

  1.  **Validate Marisol:** She is right that *logic alone* doesn't force a choice. There is no algorithmic refutation. (Duhem-Quine).
  2.  **Validate Devon:** He is right that *practice* distinguishes them. Scientists weren't blind; the Vulcan hypothesis became increasingly "expensive" and risky.
  3.  **Introduce the Nuance:** The difference isn't logical certainty; it's **Bayesian updating** and **risk**.
      *   Neptune increased the probability of the Newtonian programme because it made a risky prediction that paid off.
      *   Vulcan decreased the probability of the Newtonian programme (eventually) because the auxiliary hypothesis became too ad hoc to be credible, paving the way for Einstein.

  Marisol is arguing from the **context of justification** (logic), while Devon is arguing from the **context of discovery** (practice). Both are true, but they are talking past each other. The "solution" is to admit that science is not a logic machine, but a rational process of managing uncertainty.

  Given your background, you might find **Ian Hacking** or **Deborah Mayo** more satisfying than the pure theorists Marisol seems to be channeling. They respect the "grind" of experimental physics that Devon is trying to defend.
