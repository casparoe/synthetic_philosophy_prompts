  8.  **Final Polish:** Ensure the distinction between "descriptive metaphysics" (Searle) and "critical social ontology" (Haslanger) is clear. Make sure to validate the user's intuition about the "cooperative backdrop."

      *(Self-Correction during drafting)*: I need to be careful not to dismiss Searle entirely. His account of *how* status attaches to objects/bodies is still the dominant analytic model. Haslanger often *uses* a Searle-like structure but fills it with power dynamics. I should frame it as Haslanger *radicalizing* or *correcting* Searle rather than completely replacing him. But for the "which is more fundamental" prompt, I need to pick a side. I'll pick Haslanger for *social* reality, Searle for *institutional* logic. Actually, the prompt asks about "social construction." Haslanger wins there because construction implies a constructor and a power dynamic often absent in Searle's money examples.

      *Wait, one more thing:* The user asked about the "unified theory." It is almost certainly Ásta Sveinsdóttir (*Categories We Live By*). I should mention her even though they said "don't worry about chasing it down," because it adds value to show I know the field. It validates their memory.

