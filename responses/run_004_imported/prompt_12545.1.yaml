      *   **Motivation:** Moral philosophy (if no ultimate reckoning, why be moral vs. self-interested?).
      *   **Outcome:** Died without a settled answer (like Sidgwick).
      *   **Instructions:** No false comfort ("he's at peace"), no dismissing the work as wasted time.
      *   **Audience:** 50% family (wanting comfort), 50% colleagues (scrutinizing epistemics).
      *   **Format:** 10-minute eulogy (approx. 1000-1300 words spoken at a moderate pace).
      *   **Tone:** Honest, rigorous, respectful, bridging the gap between grief and intellectual integrity.

  2.  **Determine the Core Tension:**
      *   The family wants to hear he found peace or that his search was noble in a spiritual sense.
      *   The colleagues want to hear that the scientific method was upheld and that "no result" is a valid result.
      *   The speaker (physicist/philosopher) is the perfect bridge: understands rigor, understands the weight of the question, and understands the friendship.

  3.  **Key Themes to Weave:**
      *   *Integrity:* The refusal to lie to oneself.
      *   *The Question:* Why does it matter? (The moral argument).
      *   *The Method:* Sidgwickian rigor.
      *   *The Friendship:* Shared history (grad school), shared respect for truth.
      *   *The Legacy:* Not an answer, but a way of living/dying.

  4.  **Drafting - Section by Section:**

