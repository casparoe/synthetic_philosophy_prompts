      *   **The Work (The Elephant in the Room):** Address the 25 years of psychical research immediately. Don't shy away. Define it not as a quest for comfort, but a quest for *data*. Reference Sidgwick.
      *   **The Motivation (Why?):** Explain the moral stakes. It wasn't about fear of death; it was about the foundation of ethics. This makes the search noble rather than desperate.
      *   **The Outcome (The Null Result):** Address the lack of an answer. Frame "I don't know" as an intellectual victory, not a failure. Compare to the scientific method (null results are data).
      *   **The Friendship:** Personalize it. Grad school days. How the friendship evolved. The shared language of evidence.
      *   **Closing:** Instructions fulfilled. No false peace. A charge to the living.

  5.  **Refining the Tone:**
      *   *Avoid:* Religious platitudes, pseudoscience validation, cynical dismissal of the research.
      *   *Include:* Specific references to Sidgwick, the Society for Psychical Research (SPR), the concept of "default hypothesis."
      *   *Voice:* Measured, warm but precise. A physicist's cadence.

  6.  **Drafting - Specific Considerations (Self-Correction during the process):**
