      *   Specific trigger/timeframe? Yes (6 months/3 events).
      *   Honest treatment of exploitability? Yes (Cost-based cap).
      *   Tone? Professional engineer.

  8.  *(Self-Correction during drafting)*: Make sure I don't sound like I'm claiming to be a decision theory expert. Frame it as "The code is public, therefore our future actions are predictable variables in their current simulation." This is the engineering translation of UDT.

  9.  *(Final Polish)*: Ensure the distinction between Principal (enforced) and Goodwill (discretionary) is clear. The recommendation is about the Goodwill.

