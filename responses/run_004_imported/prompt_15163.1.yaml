answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the distinct privilege of knowing both Mara and Theo, mostly through our graduate seminar on Persistence and Identity. Which is a fancy way of saying we spend our Tuesdays arguing about whether a ship remains the same ship if you replace all the planks.

  Naturally, when Theo asked me to give this toast, I started drafting something traditional. I wrote a beautiful paragraph about how marriage is a sacred union where "two become one." I sent it to Mara for approval, and she replied within three minutes: *"If you say 'two become one,' I will glare at you from the altar so hard it will violate the causal closure of the physical world."*

  She was joking. Mostly.

  But she has a point. And to understand why, you have to understand Theo. For the last six months, Theo's entire personality has been the "Statue and Clay" puzzle. For the non-philosophers here, don't worry, I'll translate.

  Imagine a statue made of clay. They occupy the exact same space. They weigh the same. They look the same. But, Theo argues, they aren't identical. Why? Because they have different survival conditions. If you squish the object into a ball, the *clay* survives. But the *statue* is gone. Since one survived and the other didn't, they can't be the same thing. Constitution is not identity.

  Now, most people look at a wedding and think, "Ah, a fusion of souls. A merging." But Mara and Theo know better. They know that if you try to squish two people into one identity, the marriage—like the statue—might not survive the pressure.

  So, I am not going to say you are becoming one. Because you aren't. And thank god for that.

  Because if you were identical, by Leibniz's Law, you'd have to share all the same properties. And frankly, the world doesn't need two Theos. We barely have the bandwidth for one. And Mara, you have properties that Theo simply does not possess, like "knowing how to load a dishwasher correctly" and "emotional availability."

  What you are doing is much stronger. You are entering a relation of *constitution*. You are the clay that makes up the statue of this marriage. You occupy the same space, you share the same life, you are inextricably linked. But you remain distinct substances.

  This is actually the most romantic thing I've ever heard a philosopher say, accidentally. It means you don't lose yourselves. It means that when life tries to squish you—and it will—the *clay* can bend without breaking the *statue*. It means Mara can survive a bad day without Theo ceasing to exist, and Theo can have a failure without the marriage dissolving into dust. You are distinct enough to survive each other's hard times, but connected enough to celebrate the good ones.

  I know there are a few people in the back from the department nodding along. And I see you, Dave. I know you're a stage-theorist. I know you think Mara and Theo are just temporal slices of person-stages that don't persist through time anyway. Dave, put the drink down. You're not going to dissolve this puzzle tonight. Tonight, we assume persistence. Tonight, we assume they will be here tomorrow.

  For the rest of you, if you're wondering what this means for the happy couple: It means respect. It means knowing that the person standing next to you is not *you*. They are their own entity, with their own modal properties, their own potential, and their own right to not be squashed.

  Mara and Theo, my wish for you is not that you become identical. My wish is that your constitution is strong. May you be flexible enough to endure the squashing, rigid enough to hold your shape, and may you never confuse the material for the form.

  Please raise your glasses. To Mara and Theo: Distinct, necessary, and beautifully constituted.
