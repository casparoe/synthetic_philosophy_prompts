prompt: |-
  My friend Mara's getting married in a few weeks and asked me to give the toast, probably because I'm in the same Persistence and Identity seminar as her fiancé Theo, whose whole personality lately is "the statue isn't identical to the clay its made of" -- same parts, same spot in space, but the clay could've survived being squashed into a ball and the statue couldn't, so by Leibniz's Law they're not identical: constitution isn't identity. Mara's warned me that if I get up there and say the classic "these two become one" line at the reception she will glare at me from the altar, since thats the exact same mistake. Half the guests are from our program (including a stage-theorist who thinks the whole puzzle dissolves anyway and won't stay quiet about it), the other half have never heard the phrase "modal argument." Write me a warm, genuinely funny five-minute toast that lands one real laugh with the philosophers without losing everyone else, where the constitution-vs-identity thing actually shapes what I can and can't say about them "becoming one," instead of just being name-dropped.
