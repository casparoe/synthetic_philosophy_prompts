      *   **Key Constraint 2 (The Ban):** Mara explicitly forbids the phrase "two become one" because it violates the Constitution vs. Identity distinction (they are constituted by each other but not identical).
      *   **Key Constraint 3 (The Audience):** 50% Philosophers (including a loud stage-theorist), 50% Normies (no "modal argument" knowledge).
      *   **Tone:** Warm, genuinely funny, 5 minutes long.
