answer: |-
  **Setting:** *A private chamber in Oxford, 1656. The table between them is littered with diagrams—Hobbes's precise, compass-drawn figures alongside Wallis's pages of dense algebraic notation. Hobbes stands by the window, stiff and imperious. Wallis sits, quill in hand, calm but weary.*

  **Hobbes:** You treat these figures as if they were coins to be counted, Mr. Wallis. You stack your numbers, you juggle your symbols, and you believe you have grasped the nature of the circle. But you have grasped nothing but the shadow. Tell me: if I ask you what a line *is*, what will you say?

  **Wallis:** I will say it is a magnitude having length without breadth. The definition suffices for the demonstration.

  **Hobbes:** It suffices for a schoolboy's recitation, not for a philosopher's knowledge. A line is the trace of a moving point. A circle is the trace of a line rotating about a fixed end. To demonstrate a property of a figure is to exhibit the causes of its generation. If you do not know how the thing is made, you do not know the thing. You are merely comparing names.

  **Wallis:** And yet, Mr. Hobbes, in *De Corpore*, you claimed to have squared the circle. You claimed to have constructed a square equal in area to a given circle using these very principles of motion and generation. I have examined your construction. I have applied the arithmetic of infinities to it. The ratio does not hold. Your square is larger than the circle. If your method is the "one true science," as you claim, how does it yield a falsehood?

  **Hobbes:** *(Turning sharply)* The error is not in the geometry, but in your translation of it into your arithmetical ghosts. You take a magnitude, which is continuous, and you chop it into numbers, which are discrete. You ask how many "parts" are in a line. There are no parts! A line is one. When you impose your numbers upon my motion, you introduce a friction that does not exist in nature. My construction is sound; your arithmetic is too coarse to measure it.

  **Wallis:** With respect, Sir, the error is not in the arithmetic. Pi is not the ratio you propose. Any competent geometer using the method of exhaustion, or indeed my own method of infinite series, can show the discrepancy. You say my numbers are discrete and the line continuous. I agree. That is why I do not claim to sum actual atoms. When I speak of indivisibles, I do not mean that a surface is literally a heap of lines, like a faggot of sticks.

  **Hobbes:** Then what do you mean? If they are not lines, why call them indivisibles? If they are not there, what are you summing? You build a cathedral on a foundation of mist. You say "let the number of terms be infinite." What sense is there in that? To count is to finish. An infinite count is a contradiction. You are invoking mysticism and calling it mathematics.

  **Wallis:** I invoke a limit, though I may not use that word. Consider a series: one-half, one-quarter, one-eighth. The sum approaches unity. It never reaches it by finite steps, yet the *value* of the infinite sum is exactly one. Is this mysticism? Or is it a recognition that the relation holds even when the process exceeds our ability to write it down? Your geometry requires me to draw every step. Mine allows me to know the destination without walking every foot of the road.

  **Hobbes:** But if you do not walk the road, you do not know the terrain! You claim to know the area of the circle without knowing the motion that generates it. This is the height of arrogance. You claim knowledge of an effect without knowledge of the cause. In natural philosophy, we agree that to know a phenomenon is to know the motion of the bodies that produce it. Why should geometry be different? Is a circle not a body, or the boundary of a body?

  **Wallis:** Because geometry is not natural philosophy. It is a science of quantity, not of matter. When I calculate the ratio of the sphere to the cylinder, I care nothing for the iron or the wood. I care for the proportion. Your insistence on "generation" binds mathematics to the physical limitations of the drawer. If I cannot conceive of the motion, I cannot conceive of the figure? That would halt all progress. What of the hyperbola? What of curves that no simple motion can trace? Must we declare them unknowable because we cannot spin them on a lathe?

  **Hobbes:** I declare them unknowable *geometrically* if they have no generative definition. They are phantoms. You mathematicians of the new school, you wish to divorce reason from reality. You want to manipulate symbols like counters in a game, winning by rules that have no anchor in the world of bodies. If your symbols do not map to a possible motion, they are nonsense. And as for your quadrature... *(He taps the paper aggressively)* ...you have not disproven my figure. You have only shown that it does not fit your arithmetic. Perhaps your arithmetic is the lie.

  **Wallis:** *(Leaning forward, voice hardening)* That is the crux, is it not? When the world disagrees with Thomas Hobbes, the world is in error. Sir, I have checked your work. I have had others check it. The quadrature is false. It is not a matter of "arithmetical coarseness." It is a logical impossibility. You cannot square the circle with ruler and compass. If your method of generation insists it can, then the method is flawed. You prize the *cause* so highly that you have blinded yourself to the *effect*. A true demonstration must yield truth. Yours yields falsehood. Therefore, it is not a demonstration.

  **Hobbes:** And your demonstration yields... what? A probability? A likelihood based on an infinite series that you cannot complete? You say my proof is false because the numbers disagree. I say your proof is non-existent because you cannot show me the cause. You offer me a black box. I put a number in, I get a number out, and you say "it works." But *why*? Where is the necessity? In my geometry, the necessity is visible. The point *must* move thus, therefore the line *must* be such. In your algebra, the necessity is hidden in the rules of calculation. You ask me to trust the symbols. I trust only the motion.

  **Wallis:** I ask you to trust the consistency of reason. Look at the indivisibles again. You call them mystical. But Cavalieri used them. Fermat uses them. We find areas and volumes that were previously beyond reach. We check them against the method of exhaustion, and they agree. If two different paths lead to the same summit, must we burn one because the scenery is unfamiliar? Your constructionism is a fortress, Mr. Hobbes. It is secure, yes. But it is a prison. You lock out anything that cannot be built by a simple motion. I am willing to open the gate.

  **Hobbes:** You open the gate to chaos. If you allow indivisibles, you allow the infinite to be treated as the finite. You allow the sum of zeros to equal a magnitude. It is absurdity dressed in notation. And for what? To solve problems that do not exist? The ancients knew the limits of geometry. They respected them. You seek to conquer the infinite with a quill. It is hubris.

  **Wallis:** The ancients also believed the earth was the center of the universe. They respected limits that did not exist. I do not claim to conquer the infinite. I claim to reason about it. Just as I can reason about a number I cannot write down, I can reason about a series I cannot finish. You say you trust motion. But can you see the motion of a point? No. You infer it. I infer the sum of the series. Is my inference less valid because it is not kinetic?

  **Hobbes:** *(Pauses, looking at his own diagram)* I infer it from the nature of body. Motion is the universal cause. To remove motion from geometry is to remove it from the universe. You separate the math from the matter. I say they are one. If your math contradicts the possible motions of matter, your math is broken. My quadrature... *(He hesitates, then stiffens)* ...my quadrature describes a possible generation. If your arithmetic says it is impossible, then your arithmetic does not measure the world.

  **Wallis:** Then we are at an impasse. You will measure the world by your definitions, even when the measurements fail. I will measure the definitions by their results, even when the metaphysics is obscure. You fear that my method admits uncertainty. I fear that yours admits only dogma.

  **Hobbes:** I fear that your method admits anything. If symbols can be manipulated without reference to generation, what stops a man from proving nonsense?

  **Wallis:** The check of the result, Sir. The truth of the thing itself. If I predict the area, and I fill the shape with sand, and the weight corresponds... does the sand care about your motion? Or does it obey the ratio?

  **Hobbes:** The sand is matter. It obeys motion. Always motion.

  **Wallis:** *(Sighs, dipping his quill)* Then let the sand decide. But until then, I shall continue to sum my series. And you, I suspect, shall continue to square your circle.

  **Hobbes:** *(Turning back to the window)* I shall continue to seek the cause. Everything else is just counting shadows.

  **Wallis:** And I shall count them, Sir. For sometimes, the shadows tell us the shape of the light.
