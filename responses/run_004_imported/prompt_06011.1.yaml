answer: |-
  The red pen felt lighter than it used to, a hollow plastic cylinder that had outlasted the ink cartridges within it. Brenner sat at the desk in the village schoolhouse, the wood worn smooth by forty years of elbows and erasers. Before him lay the ledgers. Rows of sums, columns of neat, black pencil marks answered by his decisive red checks. A check meant the path was true. The world held still under that ink.

  A knock at the doorframe broke the silence. It was Elias, one of the early ones, now grown into a man with a suit that smelled of city dust and libraries. He held a hat in his hands, turning it slowly.

  "Mr. Brenner," Elias said. "I was passing through."

  "Elias." Brenner capped the pen. "Come in. The chalk dust never really settles, I'm afraid."

  Elias stepped inside, running a finger along the windowsill. He picked up one of the ledgers, flipping through the pages where Brenner's red checks marched like soldiers. "You always knew," Elias said softly. "When we wrote a number, you knew if it belonged there."

  "It was the rule," Brenner said. "Addition. Simple as breath."

  Elias stopped at a page near the back. He tapped a sum. "Sixty-eight plus fifty-seven. You marked it correct. One hundred and twenty-five."

  "Of course."

  "But Mr. Brenner," Elias said, looking up, his eyes kind but unblinking. "You've never added numbers that large before today. Not in your head. Not on this paper. How do you know that what you meant by 'plus' all those years wasn't something else? A rule that matches addition for small numbers, but changes after a certain point?"

  Brenner blinked. The chalk dust in the air seemed to suspend itself, refusing to fall. "What else could it be?"

  "Something that says sixty-eight plus fifty-seven equals five," Elias said. "It fits every sum you've ever checked. It fits every sum I ever wrote for you. How do you know, right now, in this moment, that you aren't following *that* rule instead? How do you know you ever meant *this*?" He gestured to the ledger. "And not *that*?"

  Brenner opened his mouth, but the word *plus* felt loose in his throat, a coin worn smooth on both sides. He looked at his hands. They were the same hands that had held the pen for four decades. But was the grip the same? Did the tension in his thumb signify *writing* or merely *making marks*? He tried to recall the feeling of teaching a child to shape an 'A'. He had corrected them. *Straighten the leg. Cross the bar.* But what if 'straight' meant something else? What if the child had been right all along, and the agreement they reached was only a temporary truce?

  "I meant addition," Brenner said. The voice sounded thin.

  "Did you?" Elias closed the ledger. "Or did you just do what everyone else did?"

  The doubt spilled out of the notebook. Brenner stood up to offer Elias a chair, but halted. Was this gesture *offering*? Or was it merely raising an arm? If he said "Sit," would the sound carry the same weight it had yesterday? He looked at the door. Outside, the village market was setting up. He imagined greeting a neighbor. *Good morning.* But if the neighbor replied *Good night*, who was to say who was wrong? If there was no fact inside Brenner's head that locked the meaning in place, then the words were just noise, waiting for someone else to validate them.

  He felt a vertigo, not of height, but of depth. He was hanging over a void where no private thought could anchor him. The red pen on the desk looked like a toy.

  Elias saw the stillness take him. He walked to the blackboard, picking up a piece of chalk. He wrote a sum. *2 + 2.* He turned to Brenner. "What is this?"

  Brenner hesitated. The answer was obvious, but the certainty was gone. The certainty had never been there. It had only been the lack of contradiction.

  Elias waited. He didn't look impatient. He looked like a man waiting for a handshake to be returned.

  "Four," Brenner said.

  Elias nodded. He reached out and took Brenner's hand, guiding it toward the pen on the desk. He placed the plastic cylinder back into Brenner's palm and closed the old teacher's fingers around it.

  "Then check it," Elias said.

  Brenner looked down at the ledger. He looked at the sum Elias had pointed to earlier. The large one. The one that might equal five. He hovered the red pen over the paper. He felt alone. He felt the weight of the room, the village outside, the man standing beside him. He realized he could not write the check alone. He needed the nod. He needed the agreement.

  He looked at Elias. Elias watched the paper, ready to speak, ready to correct, ready to agree.

  Brenner pressed the nib to the page. He drew the check. It was a small red mark, vulnerable and stark.

  "Correct," Elias said.

  Brenner exhaled. The air in the room settled. The chalk dust began to fall again, drifting slowly onto the desks, covering the wood in a shared, white layer. Outside, the school bell rang, calling children who had not yet been born to come and learn the rules, and to teach them back again.
