answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I have the distinct honor of being the friend from grad school who [Bride's Name] has designated as the "resident expert on collective intentionality."

  When she asked me to give this toast, she gave me one instruction: "Please do not give a lecture." She knows that half the room is currently thinking about their dissertation, and the other half is wondering when the cake is coming. So, I promise to keep the jargon to a minimum. But she also asked me to be honest about what I study, because she thinks it's actually relevant to why we are all here tonight.

  In my field, we argue about what happens when two people say "We."

  For a long time, the dominant view—championed by a philosopher named Michael Bratman—was that a "we" is just a very efficient mesh of two "I's." It's like when you and I lift a heavy table together. I intend to lift my side; you intend to lift yours; we both know the other is doing it. As long as our individual intentions line up, we are acting together. But the moment I decide to let go, the "we" dissolves. It's fragile. It depends entirely on my private mental state remaining constant.

  But there is another view, argued by a philosopher named Margaret Gilbert. She suggests that when we make a deep commitment, we aren't just meshing our individual plans. We are creating something new. A "plural subject."

  In this view, the commitment doesn't belong to you, and it doesn't belong to me. It belongs to *us*. And because it belongs to the *us*, neither of us can dissolve it unilaterally. Even if I wake up tomorrow feeling tired, or doubtful, or far away, I cannot simply opt out of the commitment without violating the bond we created. The "we" has a weight that holds us even when our individual feelings fluctuate.

  [Bride] and [Groom], I watched you navigate this.

  We all know the last few years involved a lot of miles between you. There were times when the logistics were exhausting. There were times, I'm sure, when the individual intention—the "I want to do my part"—was tested by loneliness, or uncertainty, or just the sheer friction of life.

  If your marriage were based only on the Bratmanian view—if it were just two individual intentions interlocking every single day—I think you would have been in trouble. Because human feelings are weather. They change. They are subject to stress and distance and fatigue. If marriage requires both of you to wake up every morning and independently choose to renew the contract based solely on how you feel in that moment, it is incredibly fragile.

  But you chose the Gilbertian path.

  You built a plural subject. You created a commitment that is stronger than your individual wavering. During those long months of distance, when the "I" was tired, the "We" held you. That is not a trap; that is a safety net. It is the ontological reality that you are no longer just two individuals coordinating schedules. You are a single unit that has promised to endure beyond the fluctuations of private sentiment.

  To the non-philosophers in the room: I know this sounds abstract. But you know what it feels like. It's the difference between staying because you *feel* like it, and staying because you *said* you would, and knowing that the promise itself is a kind of glue.

  [Bride] and [Groom], what I admire most about you is that you didn't try to pretend the doubt wasn't there. You didn't pretend the distance didn't hurt. You acknowledged that your individual intentions might waver. And yet, you built a structure that could withstand that wavering. You realized that love isn't just a feeling you have; it's a thing you build that holds you when the feeling is hard to find.

  So, I want to propose a toast.

  To the philosophers here: May we all find commitments that resist unilateral rescindability.
  And to everyone else: May you find a love that is more than the sum of your individual moods.

  To [Bride] and [Groom]. To the Plural Subject. Cheers.
