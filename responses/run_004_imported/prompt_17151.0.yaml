      *   **Daryl Bem (2011):** "Feeling the Future." Published in JPSP. Claimed precognition.
      *   **The Replication Crisis:** Bem's study triggered massive replication attempts. Most failed. Meta-analyses showed publication bias and p-hacking.
      *   **Current Consensus:** No robust, replicable evidence for ESP exists. It violates established physics (causality, relativity) without a proposed mechanism.

  5.  **Simulate Turing's Reasoning (The Core Task):**
      *   *Initial Reaction:* He would look at the *quality* of the new data, not just the claim.
      *   *Statistical Rigor:* Turing was a statistician (he worked on Bayesian inference during the war). He would understand p-hacking, power analysis, and the look-elsewhere effect better than most psychologists of the 50s.
      *   *Replication:* Turing valued reproducibility (in computing and math). If an experiment can't be replicated, the "statistical evidence" is flawed.
      *   *Physics Constraint:* ESP implies non-locality or backward causation. In 1950, quantum mechanics was already established, but ESP didn't fit neatly. Today, with stricter tests of Bell's inequalities, the "quantum excuse" for ESP is largely debunked. Turing would notice the lack of a physical mechanism.
      *   *The "Telepathy-Proof Room" Revisited:* He proposed this as a control. If decades of trying to control for variables still yield null results when protocols are strict, he'd conclude the variable doesn't exist.

