      *   **David Hume (Empiricist Skepticism):**
          *   *Goal:* Investigate the limits of human knowledge and the basis of scientific reasoning.
          *   *Argument:* We observe event A followed by event B repeatedly. We never observe the "power" or "necessity" connecting them. Our belief in causality is a psychological habit.
