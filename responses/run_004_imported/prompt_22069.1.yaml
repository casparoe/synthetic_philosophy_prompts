      *   **Is the lack of teaching due to Eurocentrism?** Partially, but also due to disciplinary silos (Islamic Studies vs. Philosophy) and the specific trajectory of the European Enlightenment canon.

  3.  **Deconstruct the Arguments (Al-Ghazali vs. Hume):**

      *   **Al-Ghazali (Ash'arite Occasionalism):**
          *   *Goal:* Defend Islamic orthodoxy against the Neoplatonic/Aristotelian philosophers (like Avicenna/Ibn Sina) who claimed the world was eternal and governed by necessary natural laws independent of God.
          *   *Argument:* Causality isn't intrinsic. Fire doesn't burn cotton; God creates the burning *at the moment* the fire touches the cotton.
