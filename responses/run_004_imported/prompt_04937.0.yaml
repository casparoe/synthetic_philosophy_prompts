answer: |-
  **Setting:** *The grad student lounge, 4:30 PM. Empty coffee mugs, whiteboard covered in half-erased deontic logic symbols. Alex (Humean/Conventionalist) is slouching in an armchair. Jamie (Scanlonian/Contractualist) is perched on the edge of a table, still holding a pen.*

  **Alex:** I still think you're asking too much of Principle F. You want it to do the heavy lifting of an entire social institution with just one guy's conscience.

  **Jamie:** It's not about conscience, it's about justification. If I invite you to rely on me, and then I leave you high and dry, I can't justify that action *to you*. That's the wrong. It's interpersonal, not institutional.

  **Alex:** But "inviting reliance" is parasitic on a context where that invitation means something. Look, Hume got it right. Promising is like money. A piece of paper is only a twenty-dollar bill because we all agree to treat it as one. Take away the social practice, the expectation of enforcement, the reputational stakes, and it's just paper. Same with "I promise." It's just noise unless there's a convention that gives it normative force.

  **Jamie:** Okay, let's test that. Classic thought experiment. I'm shipwrecked. You're shipwrecked. We've never met, we're never meeting anyone else. I'm dying. I say to you, "If you survive, please tell my daughter I loved her." You say, "I promise." I die. You get rescued. You go home. No one knows you made this promise. No reputational cost if you break it. No social practice to uphold because the "society" ended with us. Do you still owe it to me?

  **Alex:** *(Sips cold coffee)* Intuitively? Yeah. But that doesn't prove Scanlon. It proves you're importing the convention with you. You used the word "promise." That word is a artifact of the social practice you left back in civilization. You're essentially using a social tool in a vacuum and expecting it to work because of its design specs, not because the vacuum generates the obligation.

  **Jamie:** But *why* does the word bind me if the utility is gone? If the Humean story is about stabilizing mutual trust for future cooperation, there is no future cooperation here. The utility calculus is zero. If I break it, the practice doesn't collapse. So on your view, I should be able to walk away without moral residue. But I can't. And I don't think you can either.

  **Alex:** Maybe the residue is just habit. Moral conditioning. But let's flip it. Let's say you don't use the word "promise." You just see me struggling to get water, and you deliberately signal, "Don't worry, I'll get some for you." I form an expectation. I rely on you. You walk away. Under Principle F, haven't you wronged me just as much as if you said the magic words?

  **Jamie:** In many cases, yes. Principle F covers deliberate assurance.

  **Alex:** Exactly. So here's the problem: If Principle F generates an obligation whenever I deliberately create an expectation, then the specific practice of *promising* becomes redundant. Why do we need the convention of saying "I promise" at all? If the moral bindingness comes from the *expectation* you created, then the speech act is just window dressing. It adds no new moral force.

  **Jamie:** It's not window dressing. It changes the *nature* of the expectation. If I just say "I'll get water," you might think I'm predicting my behavior. If I say "I promise," I'm giving you an assurance that I'm putting myself under an obligation. It creates a specific kind of trust that mere prediction doesn't.

  **Alex:** But *how* do you put yourself under an obligation just by saying words? That's the magic trick I'm not buying. You can't bootstrap a duty out of thin air just by declaring you have one. The only reason that declaration works is because we are both trained in a convention that says, "When someone says this, they are bound." So you're back to convention. You're trying to ground the convention in the individual act, but the individual act only has power *because* of the convention.

  **Jamie:** I'm not saying the act works in a vacuum of meaning. I'm saying the *wrong* is done to the person, not to the practice. When I break a promise to you, I haven't primarily damaged "social trust" in the abstract. I've used *you*. I manipulated your rational agency to make your life easier or your mind calmer, and then I discarded that reliance when it became inconvenient. That's a violation of what we owe to each other as rational beings, regardless of whether there's a social club for promisors.

  **Alex:** But without the club, how do you distinguish between a promise and a failed prediction? If I say "I'll be there" and I get a flat tire, I've disappointed your expectation. If I say "I promise" and get a flat tire, have I committed a deeper moral violation? On your view, it seems like any disappointment of deliberately induced expectation is a moral failure. That makes the bar for obligation insanely low. The convention actually *protects* us. It sets clear boundaries. It says, "Unless you invoke the practice, you're not bound."

  **Jamie:** That's a feature, not a bug. The convention gives us a clear tool to *invoke* that higher level of assurance when we need it. But the source of the bindingness isn't the tool; it's the relationship. The tool is just how we signal, "I am now invoking Principle F."

  **Alex:** *(Leans forward)* Okay, pause. I feel like we're circling a drain here.

  **Jamie:** How so?

  **Alex:** Are we actually disagreeing about the metaphysics of obligation? Or are we just describing the same underlying facts in two different vocabularies? Like... when I say "The convention binds you," and you say "Your deliberate assurance binds you," are we pointing to the same thing?

  **Jamie:** I don't think so. For you, the obligation exists *because* the practice is useful. If the practice stopped being useful, the obligation vanishes. For me, the obligation exists because of the specific interaction between you and me. The practice is just the historical accident of how we communicate that interaction.

  **Alex:** But isn't the "specific interaction" only possible because we share a language and a culture that defines what an "assurance" is? You can't have a private language of obligation. So even if the *wrong* is interpersonal, the *possibility* of that wrong is conventional.

  **Jamie:** True. The *concept* is conventional. But the *moral force* isn't. Think of it like hitting. Hitting someone is physically possible without a convention against assault. But it's *wrong* because of the harm done to the person, not because we have a law against it. Promising is similar. We have a convention to make it clear, but the bindingness comes from the impact on the other person.

  **Alex:** I guess my worry is that if you detach it from the convention, you lose the specificity. Why is a promise different from a lie? Or different from simple negligence? If it's all just "don't mess with expectations," the category of "promising" dissolves. And intuitively, breaking a promise feels distinct from just letting someone down. It feels like I've violated a rule *I* authored.

  **Jamie:** And that's what Principle F captures! By inviting your trust, I've authorized you to hold me to it. I've given you the authority to blame me. That's the "self-authored rule" bit.

  **Alex:** *(Laughs)* Okay, you've clearly rehearsed that.

  **Jamie:** It's my dissertation, Alex. I live there.

  **Alex:** Look, maybe the synthesis is this: The convention provides the *mechanism*, but the interpersonal harm provides the *normative weight*. Without the convention, we can't signal the obligation. Without the interpersonal harm, the convention is just a game of make-believe.

  **Jamie:** I can live with that. As long as you admit that if the convention demands something that violates Principle F—like a promise to do something terrible—the convention loses its grip.

  **Alex:** Fine. If the practice becomes toxic, the Humean utility drops to zero, and the obligation dissolves.

  **Jamie:** See? We agree.

  **Alex:** We definitely don't agree. But I need another coffee before I can prove it.

  **Jamie:** *(Grabs bag)* Come on. My treat. I promise.

  **Alex:** *(Stands up)* Don't. You're just invoking the convention to manipulate my expectations.

  **Jamie:** Fair.
