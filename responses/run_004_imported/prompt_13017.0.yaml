      *   **Evidence:** New constraint: $P_{new}(HQ|R) = 0.75$.
      *   **MinInf Solution:** Minimize $\sum P_{new} \ln(P_{new}/P_{old})$ subject to the constraint.
      *   **Result:** The odds ratio between Red and Blue shifts. Specifically, $P_{new}(B) \approx 0.53$.
      *   **Why?** Because to satisfy the internal Red constraint while changing the distribution as little as possible (in terms of Kullback-Leibler divergence), the math "spills over" into the Red vs. Blue odds. The "least informative" way to make Red-HQ more likely within Red is to make Red slightly less likely overall, because Red-HQ was already the "expensive" state to boost relative to the prior structure. (Wait, let me double-check the intuition).
      *   *Correction on Intuition:* Actually, the standard explanation is that MinInf preserves the *odds ratio* of the partition cells *unless* constrained. But here the constraint is conditional. The MinInf solution effectively treats the constraint as a likelihood ratio that impacts the marginal.
      *   *Key Argument for Elena:* Any other shift implies you know something you don't. MinInf is the unique solution that adds zero extra information beyond the constraint.
      *   *Key Argument for Marcus:* Relevance. Information about the interior of Red should not change the probability of Blue. This violates the principle of "irrelevance" or "independence."

  4.  **Drafting - Section by Section:**

