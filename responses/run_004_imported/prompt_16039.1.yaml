prompt: |-
  I sit on the small grants committee of a donor collective in the effective-altruism community that pools individual contributions and re-grants them a few times a year. We're deciding this week whether to fund a biosecurity project that three larger, well-regarded funders have each backed over the past four months, with increasing amounts each time; as is common in that field, none has published its reasoning, citing information-hazard concerns, so we know only that they funded it, not why. Our own evaluation came back mixed. Two committee members want to fund on the strength of those three decisions alone; a third argues we may be the fourth domino in an information cascade rather than a fourth independent confirmation, resting entirely on the first funder's initial read. Draft the committee's funding memo: a recommendation with an amount and any conditions, plus a proposed change to how we sequence future evaluations so we're less exposed to this dynamic. Give the case for deferring to the larger funders' judgment as fair a hearing as the case against it.
reasoning: |-
  Here's a thinking process that leads to the suggested funding memo:

  1.  **Analyze the Request:**
      *   **Context:** Small grants committee of an EA donor collective.
      *   **Task:** Draft a funding memo (recommendation, amount, conditions, process change).
      *   **Subject:** A biosecurity project.
      *   **Key Information:**
          *   Three larger, well-regarded funders have backed it over the past 4 months (increasing amounts).
          *   No public reasoning (info hazard).
          *   Internal evaluation was *mixed*.
          *   Committee split: 2 want to fund based on others' decisions; 1 worries about information cascades (herding).
      *   **Requirements:**
          *   Give fair hearing to both sides (deference vs. cascade risk).
          *   Include recommendation (amount/conditions).
          *   Include proposed process change for future sequencing.
          *   Tone: Professional, analytical, EA-aligned (rational, impact-focused).

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Fund):* Aligns with the majority (2 vs 1). Leverages the "wisdom of crowds" (or at least "wisdom of experts"). Good for community cohesion.
      *   *Option B (Decline):* Aligns with the minority worry. Protects against waste if the first funder was wrong.
      *   *Option C (Conditional/Partial Fund):* A compromise. Acknowledges the signal but hedges against the cascade risk. Allows learning.
      *   *Decision:* Option C is usually best for committee memos where there's disagreement. It validates the majority's desire to act while addressing the minority's valid methodological concern. Let's recommend a *partial* grant or a *milestone-based* grant, coupled with a process change. Actually, given the "mixed" internal eval and the cascade risk, a smaller "probe" grant or a "follow-on" stance is prudent. However, in EA, if 3 top funders back something, usually the small collective follows to avoid under-funding a high-priority item. Let's recommend funding, but with specific conditions and a strong process change.
      *   *Refinement:* To make the memo robust, I should probably recommend funding *but* explicitly acknowledge the uncertainty. Or, I could recommend *deferring* to gather more info. But the prompt asks for a "recommendation with an amount." So I must choose. Let's go with **Funding**, but at a level consistent with the collective's capacity, with conditions that mitigate the cascade risk (e.g., requiring some non-sensitive feedback).
      *   *Wait, looking closer at the prompt:* "Draft the committee's funding memo." It needs to reflect the deliberation. The recommendation should resolve the tension. A "conditional yes" is the most diplomatic and rational outcome.

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The bottom line up front.
      *   **Project Overview:** What is it? (Vague due to info hazards).
      *   **Internal Evaluation:** Summary of the "mixed" review.
      *   **External Signal:** The 3 other funders.
      *   **Deliberation:** The core conflict (Deference vs. Cascade). This needs to be balanced.
      *   **Recommendation:** Amount, Conditions.
      *   **Process Improvement:** How to fix the sequencing issue for next time.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo style.
      *   **Summary:** Recommend funding $X, subject to conditions. Acknowledge the cascade risk.
      *   **Background:** Biosecurity, info hazards prevent public details. 3 funders (let's call them F1, F2, F3) have funded.
      *   **Internal Review:** Mixed. Strengths: [Generic EA strengths]. Weaknesses: [Generic EA weaknesses].
      *   **The Core Debate (Crucial Step):**
          *   *Argument for Deference:* These funders have better expertise, deeper due diligence, and maybe access to private info we don't. If they see something we don't, we should trust them. Opportunity cost of *not* funding a vital biosecurity project is high.
          *   *Argument against (Cascade):* F2 and F3 might just be copying F1. If F1 made a mistake, we all amplify it. We lose the value of our independent check. Our mixed review suggests we *don't* see the same value.
          *   *Synthesis:* We can't ignore the signal, but we shouldn't treat it as independent confirmation. We should treat it as "weighted evidence" but maintain our own threshold.
      *   **Recommendation:** Fund, but perhaps not the full ask. Or fund with a "review clause." Let's suggest funding 50% of the request, or a specific tranche. Let's go with a specific amount (e.g., $50k) as a "follow-on" rather than "lead."
      *   **Conditions:** Need to address the info hazard black box. Can we get a private briefing? Can we set milestones?
      *   **Process Change:** This is key. How to avoid cascades?
          *   *Idea:* Blind initial reviews?
          *   *Idea:* Staggered announcements?
          *   *Idea:* "Red Team" assignments?
          *   *Best Idea:* **Independent First Pass.** Commit to completing our internal scoring *before* checking the funding landscape for sensitive projects. Or, establish a protocol for "private alignment checks" with other funders to see if *their* reasoning is independent.

  5.  **Refining the Tone:**
      *   Needs to sound like Effective Altruism: rational, Bayesian, focused on expected value, transparent about uncertainty.
      *   Avoid jargon where possible, but use terms like "information hazard," "counterfactual impact," "epistemic humility."
      *   Ensure the minority view (the cascade argument) is treated as intellectually rigorous, not just obstructionist.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Process Change:* The prompt asks how to *sequence* future evaluations. The problem is we saw the funding *before* or *during* our eval. If we knew 3 people funded it, it biased us. The fix is to blind the committee to other funders until *after* the initial independent score is locked.
      *   *Self-Correction on Recommendation:* If the internal eval was mixed, and we are worried about cascades, why fund at all? Because in EA, coordination matters. If 3 big players think it's vital, the cost of being the one holdout (if they are right) is higher than the cost of wasting money (if they are wrong), *provided* the amount is small relative to the portfolio. I will recommend funding but frame it as "buying insurance" against being wrong, while noting the epistemic risk.

  7.  **Final Polish:** Check against constraints.
      *   Recommendation with amount? Yes.
      *   Conditions? Yes.
      *   Process change? Yes.
      *   Fair hearing to both sides? Yes.
      *   Tone? Professional/EA.

  8.  *(Self-Correction during drafting)*: Make sure the distinction between the "three funders" is clear. They are "larger, well-regarded." This adds weight to the deference argument. The "mixed" internal eval is the counter-weight.

  9.  **Final Review of the "Process Change":** The prompt specifically asks about *sequencing*. The issue is that the committee knew about the other funding *before* deciding. The fix is to sequence the *information gathering* differently. We should finalize our independent assessment *before* revealing knowledge of other funders' actions in the committee discussion.

