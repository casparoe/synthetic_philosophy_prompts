          *   Jaegwon Kim: MR supports *local* reductions; disjunctive properties aren't projectible/causal; undermines Functionalism/Autonomy.
      *   **Task:** Compare these two uses of the MR argument. Assess whether Kim's local-reduction strategy succeeds in undermining the functionalist case for autonomy. Justify the answer.

  2.  **Initial Brainstorming & Mapping:**
