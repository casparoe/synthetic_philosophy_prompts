      *   *Kim:* If Pain = $P_1 \lor P_2 \lor P_3 \dots$, then "Pain" is a disjunctive property. Disjunctions aren't natural kinds. They don't enter laws. So, "Pain causes wincing" isn't a real law. Real causation happens at the physical level ($P_1$ causes $M_1$, $P_2$ causes $M_2$). Therefore, we should reduce locally (Pain-in-humans = $P_1$). Global functionalism fails because the functional property itself is causally inert (epiphenomenal-ish).
      *   *Comparison:* Putnam/Fodor use MR to *save* mental causation at the special science level. Kim uses MR to *threaten* mental causation at the special science level, pushing for reduction or elimination.
      *   *Assessment:* Does Kim succeed?
          *   *Pros for Kim:* Disjunctive properties *do* seem heterogeneous. Science prefers homogeneous kinds. Local reductions *are* common (e.g., gene = DNA sequence in this context).
          *   *Cons for Kim:* "Local" might be too narrow (what about neural plasticity within a single brain?). Functional properties might be *second-order* properties that are causally relevant even if realized by diverse first-order properties. The "disjunction" worry might be overstated if the realizers share a causal profile.
      *   *Conclusion:* Kim successfully challenges *global* non-reductive physicalism, but his move to "local reduction" doesn't fully eliminate the need for functional characterization, nor does it completely destroy autonomy. It shifts the debate to the nature of kinds and laws.

