      *   **Section 3: Assessment/Comparison.**
          *   *Strength of Kim:* Highlights the threat of epiphenomenalism. Forces functionalists to clarify the metaphysics of second-order properties.
          *   *Weakness of Kim:*
              1.  *Indeterminacy of "Local":* Where does a local kind stop? (Neural plasticity within an individual over time).
