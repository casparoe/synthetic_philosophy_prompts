answer: |-
  You have hit on one of the most famous and difficult problems in 20th-century moral philosophy. You are not overthinking it; in fact, you have independently rediscovered an objection that nearly dismantled the very theory Mara is defending.

  To give you the tools to continue this debate, it helps to put names to the ideas you are wrestling with. Mara's view is a version of **Emotivism** (or more broadly, **Non-Cognitivism**). The specific objection you raised is known as the **Frege-Geach Problem** (named after the philosophers Gottlob Frege and Peter Geach).

  Here is a breakdown of why your intuition is correct, why Mara's specific defense ("it's just a metaphor") is weak, but also how a sophisticated version of her view tries to survive your objection.

  ### 1. Why Your Objection is Devastating
  You noticed that logic relies on consistency. When we make a logical argument like the one Mara used (known as *Modus Ponens*), it looks like this:

  1.  If keeping the wallet is wrong, then our friend is wrong.
  2.  Keeping the wallet is wrong.
  3.  Therefore, our friend is wrong.

  For this logic to work, the phrase "keeping the wallet is wrong" must mean the **same thing** in premise 1 and premise 2.
  *   In premise 2, Mara says this means "Boo to keeping wallets!" (an expression of emotion).
  *   But in premise 1, the phrase is inside an "If..." clause. As you pointed out, nobody is booing anything in premise 1. She is merely considering a possibility.

  If moral sentences are just emotional grunts, they cannot be true or false. But logic is a machine that processes truth. If you put a "grunt" into a logic machine designed for "truth," the machine breaks. If "wrong" just means "boo," then premise 1 translates to: *"If 'boo' to keeping wallets, then 'boo' to our friend."* That doesn't make sense. You can't conditionally "boo."

  This is the Frege-Geach Problem: **How can moral language function logically if it doesn't state facts?**

  ### 2. Is Mara Being Inconsistent?
  In the context of your dinner conversation? **Yes.**

  Mara is engaging in what philosophers sometimes call "pragmatic inconsistency." She is using moral language *as if* it describes facts (to win a logical argument) while simultaneously claiming it *doesn't* describe facts (to define its meaning).

  When she dismisses your point as "overthinking a metaphor," she is waving away the hardest part of her own theory. Classical Emotivists (like A.J. Ayer in the 1930s) often struggled to answer this. They tended to say that moral arguments aren't *really* logical proofs; they are just attempts to persuade one another's emotions. But that feels unsatisfying, because when we argue about ethics, it feels like we are reasoning, not just shouting louder.

  ### 3. Can the Two Halves Fit Together?
  While Mara's casual explanation is weak, the philosophical position itself hasn't been abandoned. Modern philosophers who agree with Mara (now called **Expressivists** or **Quasi-Realists**) have developed complex ways to answer your objection.

  They argue that you don't need "facts" to have logic; you just need **consistent commitments.**

  Here is how they try to make the halves fit:

  **The "Plan" Analogy**
  Imagine you are giving yourself instructions.
  1.  I plan to stay dry.
  2.  If it rains, I need an umbrella to stay dry.
  3.  It is raining.
  4.  Therefore, I plan to take an umbrella.

  None of these sentences are necessarily "facts" about the universe; they are expressions of my internal state (my plans). Yet, the logic holds. If I accept 1 and 2 and 3, but refuse 4, I am being irrational. I am in a state of **inconsistency**.

  Modern Expressivists (like Simon Blackburn or Allan Gibbard) argue that moral judgments are like plans or norms.
  *   To say "Keeping the wallet is wrong" is to hold a norm against keeping wallets.
  *   To say "If keeping the wallet is wrong, then our friend is wrong" is to hold a higher-order norm that links the two.

  If you hold the first norm but reject the conclusion, you aren't contradicting a *fact* of the universe, but you are contradicting *yourself*. Your web of attitudes is tangled. So, logic still applies, not because moral sentences are true/false, but because rational agents strive for consistency in their attitudes.

  ### 4. The Verdict
  You asked if she is being inconsistent or if there is a way for the view to fit together.

  **The Verdict:** Mara is being inconsistent *in her explanation*, but her *position* might be salvageable if she upgrades it.

  *   **She is wrong** to call it a "metaphor" and dismiss the logical problem. It is a structural problem that requires a structural solution. If moral language is just "booing," logic is impossible.
  *   **She is potentially right** that moral statements express attitudes rather than facts, *provided* she accepts the modern Expressivist explanation: that logic governs our attitudes and commitments, not just our description of reality.

  **How to reply to her:**
  You can tell her: *"I looked into this, and it's actually a famous philosophical problem called the Frege-Geach Problem. You can't just say it's a metaphor, because logic requires consistency of meaning. If 'wrong' means 'boo' in one sentence but acts like a fact in another, your argument breaks. If you want to keep your view, you have to explain how 'booing' can follow logical rules without turning into a fact."*

  That will likely shift the conversation from a dinner dispute to a genuine philosophical exploration. You have earned the right to feel nagged by this; you found the crack in the foundation that professionals have been patching for 80 years.
