answer: |-
  Here is a joke tailored for your reading group. It relies entirely on the connection between the *Methods of Ethics* dilemma and the specific consequences of his SPR integrity.

  ***

  Henry Sidgwick spent thirty years investigating psychical phenomena for a very specific philosophical reason: he needed empirical proof of immortality to resolve the Dualism of Practical Reason. Without it, Reason commands us to be both Egoists and Utilitarians, with no way to choose.

  But Sidgwick had a problem: he was too honest to find the evidence he needed. Every time the SPR got a promising result, Sidgwick's scrupulous integrity forced him to expose the fraud. When the Creery sisters were caught signaling, he retracted the findings immediately.

  So, on his deathbed, a colleague asked him: "Henry, if you'd just looked the other way, you could have died believing you solved ethics. Duty and Self-Interest would coincide. Was your honesty worth the despair?"

  Sidgwick replied: "I suppose I faced a final dualism: I could have a coherent ethical system based on a lie, or an incoherent one based on the truth."

  "And you chose the truth?"

  "Yes," said Sidgwick. "Which means I am the only philosopher in history to successfully falsify his own salvation."

  "In what sense?"

  "In the sense that by choosing Duty over Self-Interest so rigorously, I didn't solve the Dualism of Practical Reason. I *enacted* it. I proved the conflict exists... by making sure my own philosophical happiness was the casualty of my integrity."
