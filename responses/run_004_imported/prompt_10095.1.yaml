      Constraint: $q_1 / (q_1 + q_2) = 0.75 \implies q_1 = 3q_2$.
      MinEnt Solution: $q_1 \approx 0.351, q_2 \approx 0.117$ (Sum $R \approx 0.468$). $q_3 \approx 0.266, q_4 \approx 0.266$ (Sum $B \approx 0.532$).
