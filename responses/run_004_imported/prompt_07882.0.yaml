      *   **The Escalation of Commitment:** This is related to sunk cost but involves doubling down to justify previous decisions.
      *   **Game Theory (The Dollar Auction):** This is the critical piece. The penny auction is a variant of Martin Shubik's "Dollar Auction."
          *   *Rules:* Highest bidder wins $1, but *both* highest and second-highest bidders pay their bids.
          *   *Dynamic:* Once bids pass 50 cents, the second-highest bidder loses money if they stop. They bid $1.05 to win $1 (losing 5 cents) rather than bid $1.00 and lose $1.00. This leads to bids exceeding the value of the prize.
      *   **The "War of Attrition":** This is another game theory model. Two sides compete for a prize by accumulating costs. The winner is the one who can endure the most cost. The loser pays their costs and gets nothing.
      *   **Rationality Trap:** The user's feeling that "continuing genuinely felt like the more sensible move" is the trap. In game theory terms, it's locally rational (minimize immediate loss) but globally irrational (maximize total loss).
      *   **The Opponent:** The user suspects the other person is thinking the same thing. In penny auctions, the "other person" might be a bot (shill bidding) or just another trapped human. If it's a bot, the user *never* wins. If it's a human, it's a classic standoff.

