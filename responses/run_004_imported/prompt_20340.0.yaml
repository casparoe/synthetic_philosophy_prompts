      *(Self-Correction on the Ending)*: The prompt asks them to *try* to pin down one concrete case. It doesn't require them to succeed, but they need to make a genuine attempt. I'll have them propose a scenario (e.g., a child speaking, or a complex technical claim) and realize the verdict might still be murky.

  6.  **Final Polish:**
