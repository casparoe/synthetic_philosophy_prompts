answer: |-
  **Setting:** *A busy coffee shop near a major transit hub. Elena (Reductionist) and Marcus (Anti-Reductionist) are watching a commuter approach a local at the counter.*

  **Elena:** Did you see that? The commuter asks where the express train is, the local points left and says, "Second platform," and the commuter just walks. No hesitation. No checking the board.

  **Marcus:** Exactly. Immediate uptake. No inference. That's the default human setting, Elena. We're wired to accept testimony unless we have a specific reason not to. Reid was right: testimony is a basic source of justification, like perception. If I see a tree, I believe it's there. If you tell me there's a train, I believe there's a train.

  **Elena:** It looks immediate, sure. But "wired" isn't "justified." Just because we *do* believe doesn't mean we *should* without evidence. Hume had it right. My justification for believing that local rests on my inductive evidence that people in this context tend to tell the truth and know the truth.

  **Marcus:** Here we go. The Humean burden. You're saying the commuter is justified only because she has a personal track record of verifying train directions given by strangers?

  **Elena:** Not a personal logbook, Marcus. It's a background belief formed by observation. People generally want to be helpful. People generally know where the train is. Uniforms, confidence, eye contact—these are perceptual cues that correlate with reliability. She processed those cues.

  **Marcus:** But that's the trap Coady pointed out. To establish that "testimony is generally reliable" via induction, you need a massive sample size. You need to check thousands of claims against reality. But how do you check them?

  **Elena:** You observe the state of affairs.

  **Marcus:** For simple things, yes. "The light is on." But for almost anything substantial? If I want to verify a historical claim, I read a book. If I want to verify a geographical claim, I check a map. If I want to verify whether someone *was* honest, I ask someone else. Every method you use to verify testimony *is itself testimony*. You're using testimony to validate testimony. It's circular. The Humean reductionist can't get the project off the ground without assuming the very reliability they're trying to prove.

  **Elena:** That's an argument against *Global* Reductionism. It claims you need a global audit of human honesty before you can trust a single word. I'm not asking for that. I'm a Local Reductionist. I follow Fricker.

  **Marcus:** Ah, the retreat.

  **Elena:** It's not a retreat; it's precision. I don't need to know that *humanity* is reliable. I need to know if *this speaker*, in *this context*, is reliable. The justification reduces to positive reasons specific to the instance. Is the speaker competent? Do they have a motive to lie? Are there defeaters? The commuter saw a local wearing a transit badge. That's a positive reason.

  **Marcus:** But where did she learn that badges signify authority?

  **Elena:** Past experience.

  **Marcus:** Which came from... testimony. Her parents told her, "That's a police officer." Society told her, "Badges mean help." You're smuggling in the general reliability of testimony to justify the local cues. If you strip away all the testimonial knowledge she's accumulated—the meaning of words, the function of badges, the layout of cities—does she still have "positive reasons"?

  **Elena:** She has perceptual reasons. She sees the badge. She sees the lack of nervousness.

  **Marcus:** But the inference from "lack of nervousness" to "truthfulness" is itself a generalization based on... what? Testimony from psychologists? Folk wisdom passed down? If you can't rely on the general presumption that people are usually sincere, you can't interpret those cues. You're assuming a background of reliability to monitor for unreliability.

  **Elena:** I'm assuming a background of *causal* regularities, not epistemic entitlement. I know people blush when they lie. That's psychology, not testimony.

  **Marcus:** Is it? How do you know that? Did you run the studies? Or did you read about it? Listen, Elena, Fricker's Local Reductionism demands a duty of monitoring. You say the hearer must actively monitor for signs of deception. But monitoring only makes sense if the default is *trust*. If the default were skepticism, you wouldn't need to monitor for deception; you'd need to monitor for truth. The very act of "monitoring for lies" presupposes you're already on board with the statement unless a red flag waves. That's the Anti-Reductionist picture! You've just relabeled the "default trust" as "absence of negative reasons."

  **Elena:** It's a crucial relabeling, though. It places the burden of proof on the believer. If I don't monitor, I'm negligent. In your Reidian view, I'm entitled to believe even if I'm asleep at the wheel, provided there are no defeaters.

  **Marcus:** Not asleep at the wheel. Just not paranoid. Look, if your Local Reductionism requires me to have positive reasons for every claim, you paralyze communication. If it only requires me to have no *negative* reasons, then you've conceded that testimony is innocent until proven guilty. That's not reductionism; that's entitlement.

  **Elena:** It's not entitlement because the "no negative reasons" condition is backed by my inductive history of this specific environment. I know *this* coffee shop, *this* city. If I were dropped in Tokyo, I wouldn't trust the directions without more evidence. My justification is sensitive to context. Your view says I should trust the Tokyo stranger just as much as the local one, unless I have a specific reason not to.

  **Marcus:** I would say you're entitled to trust the Tokyo stranger, yes. Because language itself carries a warranty of truth. When you speak to me, you invite me to believe you. That's a normative commitment.

  **Elena:** And if they're wrong?

  **Marcus:** Then they've violated a norm. But I wasn't irrational for believing them.

  **Elena:** This is where we need to find a wedge. A case where your view says "Believe" and mine says "Suspend Judgment." If we agree in every practical case, this is just semantics.

  **Marcus:** Agreed. Let's try one. A child tells you a complex fact. "The mitochondria is the powerhouse of the cell."

  **Elena:** Local Reductionist verdict: Suspend judgment. Or rather, believe the child is *repeating* something, but verify the claim. The child has no independent competence. I need positive reasons to think the source they are quoting is reliable.

  **Marcus:** Anti-Reductionist verdict: Believe. The child is asserting it. Unless I have a reason to think the child is lying or confused, I'm entitled to take their word. The justification lies in the act of telling, not the speaker's track record.

  **Elena:** That seems dangerous. Children confabulate constantly.

  **Marcus:** Do they confabulate science facts they don't understand? Or do they parrot teachers? If they parrot teachers, the testimony is a chain. You're breaking the chain; I'm following it.

  **Elena:** Okay, but what about a case where the speaker shows subtle signs of incompetence? A stranger gives me directions, but they hesitate, look away, and shrug.

  **Marcus:** I wouldn't believe them. That's a defeater.

  **Elena:** Exactly. But on my view, you don't believe them because you lack positive reasons for competence. On your view, you don't believe them because a defeater overrode your default entitlement.

  **Marcus:** Practically, we both walk away. Theoretically, I say I was justified in starting to believe until the shrug happened. You say I was never justified until the shrug *didn't* happen.

  **Elena:** Let's try something higher stakes. A colleague tells me, "I checked the logs, the system is secure." I can't check the logs myself.

  **Marcus:** I say you're entitled to believe them. They're a colleague. The practice of engineering relies on this. If you demand positive inductive evidence for every colleague's claim, the project fails.

  **Elena:** Fricker would say you need to monitor. Is this colleague usually careful? Are they under pressure to ship code? If they are known to be sloppy, you shouldn't believe them.

  **Marcus:** But if they are *unknown* to you? New hire.

  **Elena:** Then I withhold belief until I have evidence of their competence.

  **Marcus:** And I say you accept it, provisionally. Because if you don't, you can't collaborate. The social practice requires the entitlement.

  **Elena:** But is it *knowledge*? If the new hire is wrong, did you have justification?

  **Marcus:** Yes. You relied on a basic source. It turned out false, but you weren't irrational.

  **Elena:** I think you're conflating rationality with justification.

  **Marcus:** And I think you're conflating justification with infallibility.

  *(They sit in silence for a moment, watching the commuter return.)*

  **Elena:** The commuter is back. She's holding a ticket.

  **Marcus:** She made the train.

  **Elena:** So, the testimony was true.

  **Marcus:** And I'm justified in saying she was rational to believe it without checking the board.

  **Elena:** And I'm justified in saying she picked up on subtle cues we didn't see. Tone, posture, the local's lack of hesitation.

  **Marcus:** You're incorrigible. You're turning her trust into a hidden calculation.

  **Elena:** And you're turning her luck into a principle.

  **Marcus:** So, do we have a verdict?

  **Elena:** We have a divergence on the *source* of the justification, not the outcome. In the case of the new hire... if the new hire lies, and I had no reason to suspect it...

  **Marcus:** I say you were justified.

  **Elena:** I say you were blameless, but unjustified. You lacked the positive reasons.

  **Marcus:** That's the wedge. Blameless vs. Justified.

  **Elena:** It's a thin wedge.

  **Marcus:** In epistemology, that's usually where the blood is.

  **Elena:** Coffee?

  **Marcus:** Sure. And hey, the barista says the blend is good.

  **Elena:** *(Smiles)* I'll ask her where the beans are from first.

  **Marcus:** See? Reductionist to the end.

  **Elena:** See? Anti-Reductionist to the core. You're drinking it already.

  **Marcus:** Because she told me it was good.

  *(Marcus takes a sip. Elena waits for the menu.)*
