answer: |-
  Based on G.E.M. Anscombe's moral philosophy, particularly as articulated in "Mr. Truman's Degree" (1956) and her broader work on intention and action, it is highly probable that she would assess Lethal Autonomous Weapons Systems (LAWS) as morally indefensible. Far from making such killings easier to justify by distancing the human from the act, Anscombe would likely argue that removing the human decision-maker undermines the very conditions required for moral justification, effectively institutionalizing murder by obscuring moral agency.

  Here is an analysis of how Anscombe's framework applies to LAWS, structured around her concepts of intention, the Doctrine of Double Effect (DDE), and moral agency.

  ### 1. The Locus of Intention: You Cannot Outsource Will
  In "Mr. Truman's Degree," Anscombe's central charge against Truman was that he *intended* the deaths of civilians as a means to end the war. For Anscombe, intention is not merely a psychological state; it is a description of the action chosen by the will.

  When applied to LAWS, a proponent of autonomous weapons might argue that because no human pulls the trigger at the critical moment, no human *intends* the specific death of a civilian. They might claim civilian casualties are merely "foreseen side effects" of deploying the system, thus satisfying the DDE.

  Anscombe would reject this as a sophistry. For her, the intention resides in the **deployment**. If a commander deploys a system knowing it will engage targets based on algorithms that cannot distinguish combatants from non-combatants with moral certainty, the commander intends the resulting pattern of violence.
  *   **The Truman Parallel:** Just as Truman did not drop the bomb himself but authorized the act, the commander authorizes the LAWS. If the system is designed to prioritize mission success over civilian immunity (treating civilian casualties as an acceptable "cost" or "trade-off"), Anscombe would argue this replicates the logic of Truman: the civilians are being treated as a means (or acceptable collateral in a calculation) rather than as persons protected by absolute prohibitions.
  *   **Pre-programmed Intention:** The "intention" is baked into the code by programmers and authorized by commanders. If the algorithm is written to accept a certain probability of civilian death to neutralize a target, Anscombe would likely view this as *intending* those deaths as part of the plan, rather than merely foreseeing them.

  ### 2. The Doctrine of Double Effect and Practical Reasoning
  The Doctrine of Double Effect relies on the agent's ability to distinguish between what is *intended* (means/end) and what is *merely foreseen* (side effect). This distinction requires **practical reasoning** (*phronesis*).

  *   **Machines Cannot Apply DDE:** A machine does not "foresee" in the moral sense; it calculates probabilities. It cannot make the moral distinction between a combatant and a civilian who is temporarily holding a weapon, or a child near a military site. It operates on data, not moral perception.
  *   **The Loss of Discrimination:** For Anscombe, the DDE only works if the agent is actively aiming at a legitimate target and taking all reasonable care to avoid the innocent. A LAWS, by definition, removes the human capacity for last-minute moral discrimination (e.g., seeing a child run into the kill zone and aborting).
  *   **Verdict:** Because a machine cannot possess the intention required to make the DDE distinction valid, any civilian death caused by a LAWS cannot be categorized as a "foreseen side effect" of a moral action. It becomes a direct result of a system that lacks moral capacity. Therefore, the DDE cannot be invoked to justify LAWS.

  ### 3. Moral Agency and the "Responsibility Gap"
  This is the most critical point. Anscombe's philosophy is deeply rooted in Aristotelian-Thomistic ethics, which posits that moral actions require a moral agent—a being with a will capable of choosing good or evil.

  *   **Murder Requires a Murderer:** In "Mr. Truman's Degree," Anscombe insists that killing the innocent is murder. Murder is a moral category that presupposes a moral agent. If a LAWS kills a civilian, who is the murderer?
      *   If the answer is "no one" (because the machine acted autonomously), Anscombe would find this horrifying. It creates a "responsibility gap" where killing occurs without moral accountability.
      *   If the answer is "the commander," but the commander did not make the specific decision to kill that specific person, Anscombe would argue the link between will and action is too attenuated to sustain moral justification.
  *   **Undermining Justification:** The prompt asks if removing the human makes it *easier* to justify. Anscombe would argue the opposite: **it makes justification impossible.** Justification requires an agent to account for their intentions. If the human is removed from the loop, there is no agent present at the moment of killing to justify the act via DDE.
  *   **The Evasion of Guilt:** Anscombe was fiercely opposed to moral evasion (as seen in her critique of utilitarianism and "consequentialism"). She would likely view LAWS as the ultimate technological evasion of guilt. By saying "the algorithm decided," humans attempt to wash their hands of the blood. For Anscombe, this does not remove the guilt; it compounds it by adding the sin of abdicating moral responsibility.

  ### 4. Conclusion: Institutionalized Murder
  Anscombe would likely conclude that LAWS amount to a form of institutionalized murder.

  1.  **Intention:** The deaths are intended in the deployment and programming phases as acceptable costs for strategic ends (replicating Truman's logic).
  2.  **Agency:** The removal of the human decision-maker destroys the possibility of applying the Doctrine of Double Effect, because machines cannot intend or foresee in the moral sense.
  3.  **Moral Status:** Consequently, LAWS do not make killing easier to justify; they render the killing morally unintelligible. They create a scenario where innocent people are killed without a moral agent taking responsibility for the specific act of killing.

  In Anscombe's view, the only way to ensure that civilian deaths are truly "unintended side effects" is to have a human moral agent in the loop who is capable of recognizing the humanity of the target and refraining from action if the moral cost is too high. Removing that agent does not sanitize the violence; it strips the violence of the only thing that could potentially redeem it: responsible human judgment. Therefore, she would likely argue that deploying such systems is inherently unjust, regardless of the military utility, because it severs the necessary link between moral agency and lethal force.
