answer: |-
  Your intuition is very close to the heart of the matter, but there is a crucial technical distinction that explains why superrationality is not considered a standard application of Nash Equilibrium (NE).

  The short answer is: **Superrationality violates the independence assumption inherent in the definition of a Nash Equilibrium.**

  In standard game theory, even if players are identical copies, mutual cooperation in a one-shot Prisoner's Dilemma is **not** a Nash Equilibrium. Superrationality proposes a different decision theory entirely (often aligned with Evidential or Logical Decision Theory) rather than a special case of standard equilibrium analysis.

  Here is a detailed breakdown of why decision theorists treat them as distinct concepts.

  ### 1. The Definition of "Unilateral Deviation"
  The defining condition of a Nash Equilibrium is that no player can benefit by **unilaterally deviating** from their strategy while the other players keep their strategies **fixed**.

  *   **Standard NE Analysis:** When I consider whether to switch from Cooperate to Defect, I must ask: *"If I switch to Defect, but my opponent **stays** at Cooperate, do I gain?"* In the Prisoner's Dilemma, the answer is yes. Therefore, (Cooperate, Cooperate) is not an NE. The fact that we are "identical" is irrelevant to the math of NE, because NE assumes my choice cannot causally influence yours in a simultaneous game.
  *   **Superrational Analysis:** Hofstadter argues that because we are identical rational agents running the same reasoning process, I cannot hold your strategy fixed while changing mine. If I find a reason to switch to Defect, you will find the exact same reason. Therefore, the deviation is not unilateral; it is **logical simultaneous**. I must ask: *"If we **both** switch to Defect, do we gain?"* The answer is no.

  Because superrationality rejects the *ceteris paribus* (all else being equal) condition regarding the opponent's strategy during the deviation test, it falls outside the formal definition of a Nash Equilibrium.

  ### 2. Causal vs. Logical Correlation
  Standard game theory is built on **Causal Decision Theory (CDT)**. It assumes that my action and your action are causally independent events. Even if we are identical, standard theory treats the correlation between our actions as a statistical coincidence, not a lever I can pull.

  *   **The Standard View:** "I don't know what you will do. I must choose the best response to what I *expect* you to do. Since Defect is a dominant strategy (it pays better regardless of what you do), I must Defect."
  *   **The Superrational View:** "Our actions are logically correlated because they stem from the same source code (reason). By choosing my action, I am effectively choosing the output of the algorithm we both run."

  This distinction mirrors the difference between **Newcomb's Problem** and standard decision problems. Superrationality treats the Prisoner's Dilemma like a Newcomb problem (where your choice provides *evidence* of the other's choice), whereas standard NE treats it as a causal problem (where your choice has no *influence* on the other's outcome).

  ### 3. Symmetry Does Not Imply Linkage
  You mentioned applying equilibrium analysis to a "symmetric game." In game theory, a symmetric game simply means the payoff matrix is symmetric (if we swap players, the payoffs swap). It does **not** imply that the players' strategies are mechanically linked.

  In standard analysis, two identical agents playing a symmetric game can still play different strategies (e.g., in a game of Chicken, one swerves, one goes straight). If they randomize, they might use the same mixed strategy, but the realization of their moves is treated as independent.

  Superrationality imposes a **super-constraint**: it demands that identical agents *must* arrive at the same pure strategy. Standard game theory has no mechanism to enforce this. It allows for the possibility that two identical agents could, through randomization or indexical uncertainty, end up playing different moves. Superrationality rules this out by fiat, which is why it is considered a distinct philosophical stance rather than a mathematical derivation from standard axioms.

  ### 4. Why It Remains Controversial
  If superrationality leads to higher payoffs, why isn't it the standard?

  1.  **"Magical Thinking":** Critics argue superrationality implies a form of backward causation or acausal influence. How can my decision *here* force your decision *there* without communication? Standard theorists argue this confuses **prediction** with **control**. Just because you can predict I will Cooperate doesn't mean your Cooperating *causes* me to Cooperate.
  2.  **Fragility:** Superrationality works beautifully in symmetric games with unique solutions. It becomes much murkier in asymmetric games or games with multiple equilibria. If we are identical agents but I am Player 1 and you are Player 2, and the game is asymmetric, how do we coordinate on which equilibrium to pick without communication?
  3.  **Exploitability:** A superrational agent playing against a standard Causal Decision Theorist will Cooperate (expecting the other to be superrational), while the standard agent will Defect (taking the free ride). Superrationality is not robust against agents who do not share the metaphysical assumption of logical linkage.

  ### 5. Modern Formalizations (Program Equilibrium)
  It is worth noting that your intuition has gained traction in modern computer science and logic, just not under the label of "Nash Equilibrium."

  Researchers like Moshe Tennenholtz (Program Equilibrium) and theorists at MIRI (Functional Decision Theory) have formalized Hofstadter's intuition.
  *   **Program Equilibrium:** Players submit source code to each other. If my code can read your code, and I see we are running identical code, I can condition my cooperation on your cooperation. In this specific formal setup, mutual cooperation **is** an equilibrium.
  *   **Logical Decision Theory:** This updates decision theory to treat "the output of my decision algorithm" as the object of choice, rather than "my physical action."

  However, these are explicitly framed as **alternatives** to Nash Equilibrium and Causal Decision Theory, not subsets of them.

  ### Summary
  Hofstadter's superrationality is not a special case of Nash Equilibrium because it **redefines the counterfactuals** used to calculate equilibrium.
  *   **Nash:** "If I change my mind, does your mind stay the same?" (Yes) $\rightarrow$ Defect.
  *   **Superrational:** "If I change my mind, does your mind change too?" (Yes) $\rightarrow$ Cooperate.

  Because standard game theory axiomatically assumes the answer to the first question is "Yes" (strategic independence), superrationality requires a new decision-theoretic framework, which is why it remains a distinct and debated concept.
