answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I'm my dad's son/daughter.

  We are here because my father died ten days ago. The official cause is throat and lung cancer. The VA has acknowledged, finally, that this was likely caused by the burn pits he breathed in during two tours in Iraq. So, in a very literal sense, the war didn't end for him when he came home. It kept fighting him until it won.

  I've spent the last week trying to write this, trying to find the right words to summarize a life that was complicated, just like the man himself. And I kept getting stuck on a specific line. If you knew Dad, you know the line. Any time Iraq came up at Thanksgiving, or a birthday, or a family reunion, he had a standard response. He'd say: "I didn't start that war. I just did my job and looked after the guys next to me."

  For a long time, I thought that was just something soldiers said to change the subject. A shield. But after he passed, I found myself arguing with family about it. Is that true? Can you separate the soldier from the war? Can you honor the service without endorsing the mission?

  I went down a rabbit hole reading about it. It turns out, philosophers have been arguing about this for centuries. Some say a soldier is responsible for the war itself. Others say a soldier is only responsible for how they fight it.

  Standing here today, looking at my aunt, who protested this war before it started, and looking at [Name] and [Name], who served in his platoon, I realize my dad wasn't quoting a philosophy textbook. He was stating a moral boundary. He was telling us where he believed his responsibility began and where it ended.

  He knew he couldn't control the decisions made in Washington. He couldn't control the geopolitics. To claim he could would have been arrogant. But he knew he could control his own integrity. He knew he could control whether the man to his left made it home. He knew he could control whether he acted with honor in a situation that was often dishonorable.

  To my aunt: I know you and Dad had hard years. I know you didn't speak for a while after he re-upped for the surge. I also know you made peace before he got sick. Your love for him wasn't conditional on his uniform, and his love for you wasn't conditional on your agreement. The fact that you are here, together, proves that we can hold two truths at once: You can believe a war is wrong, and still believe the person fighting it is good.

  To his platoon mates, who flew in to be here: I know what that bond means. I know that when he said he "looked after the guys next to him," that wasn't a figure of speech. That was his religion. In a place where everything was chaotic and uncertain, that loyalty was the only thing that was solid. You don't need me to tell you he served with honor. You saw it. But I want you to know that his family sees it too. We see that his service wasn't about politics; it was about people.

  So, was he right? Is that line enough?

  I think it has to be. Because if we judge people only on the outcomes of history, which they rarely control, then no one is innocent. But if we judge people on how they treated the vulnerable, how they protected their friends, and how they carried the weight they were given—that is a metric we can use.

  My dad didn't claim to be a hero of the nation. He claimed to be a guardian of his friends. And looking at the cancer that killed him, looking at the silence he kept about the hard things, and looking at the reconciliation he found with his sister... I think he earned that claim.

  He didn't start the fire. But he spent his life trying to make sure the people around him didn't get burned. And when the smoke finally caught up with him, he faced it the same way he faced everything else: without complaining, and without asking for credit.

  We can argue about the war. We should argue about the war. But we don't have to argue about the man. He was decent. He was loyal. And he was ours.

  Rest easy, Dad. We've got the watch from here.
