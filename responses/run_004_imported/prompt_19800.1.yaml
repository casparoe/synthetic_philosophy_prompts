prompt: |-
  I'm a CS PhD student, and this term I'm the grad rep on my department's three person grade-appeals panel. Heres Friday's case: in discrete math the instructor taught a recursively defined sequence purely by example -- 1, 2, 4, 8, 16 for the first five terms (it's the "how many regions do you get connecting n points on a circle with straight lines" count), framed as a "spot the pattern" warm-up -- then the final exam asked for the sixth term. The "obvious" doubling pattern gives 32; the rule the instructor was actually using gives 31. About a quarter of the class wrote 32 and is now appealing, since doubling fit every example we ever actually showed them just as well as the rule the instructor was using. Two of the three panelists think it's an easy call -- the instructor's rule is simply the correct one and doubling was a mistake -- but I'm not convinced that's principled, since the assignment never stated a closed form, only examples, and I don't see why "what the instructor meant" automatically beats "the simplest continuation of the data we actually gave them." Can you draft the memo I'll circulate before Friday? I need an actual recommendation on grading the disputed problem, plus some guidance for how we word "find the pattern" questions from now on -- and please really engage with the case for the doubling answers instead of just asserting the instructor's rule wins.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** CS PhD student, Grad Rep on a 3-person grade-appeals panel.
      *   **Task:** Draft a memo to circulate to the other two panelists before Friday's meeting.
      *   **Case:** Discrete Math exam question. Sequence: 1, 2, 4, 8, 16. Context: "Regions formed by connecting $n$ points on a circle." Taught via examples only. Exam asked for the 6th term.
      *   **Conflict:** Students answered 32 (doubling pattern). Instructor expected 31 (Moser's Circle Problem sequence). 25% of class answered 32 and are appealing.
      *   **Panel Dynamics:** 2 panelists think it's an easy call (Instructor is right, students are wrong). User (Grad Rep) is skeptical, arguing that based *only* on the provided data/examples, 32 is a valid inference.
      *   **Requirements:**
          *   Actual recommendation on grading.
          *   Guidance for future "find the pattern" questions.
          *   *Crucial:* Engage seriously with the argument for the doubling answers (don't just dismiss them).
          *   Tone: Professional, academic, persuasive but collegial (it's a memo to colleagues).

  2.  **Deconstruct the Mathematical/Pedagogical Issue:**
      *   **The Math:** This is the classic "Moser's Circle Problem." The sequence is 1, 2, 4, 8, 16, 31, 57... The formula is $\binom{n}{4} + \binom{n}{2} + 1$. The doubling pattern ($2^{n-1}$) holds for $n=1$ to $5$ but fails at $n=6$.
      *   **The Pedagogy:** The instructor taught via *induction by example* without stating the underlying combinatorial rule. In a CS/Discrete Math context, "find the next term" based *solely* on a finite sequence is mathematically ill-posed unless the rule class is constrained (e.g., "find the polynomial of lowest degree").
      *   **The Fairness:** If the instruction was "spot the pattern" based on examples, 32 is the Occam's Razor answer. If the instruction was "apply the circle region theorem," 31 is the answer. The ambiguity lies in what was assessed: pattern recognition or specific domain knowledge?

  3.  **Determine the Stance/Recommendation:**
      *   *Option A: Full Credit for 32.* (Strongest student support). Argument: The assessment was ambiguous.
      *   *Option B: No Credit for 32.* (Strongest instructor support). Argument: It's a known counter-intuitive problem in this specific course context.
      *   *Option C: Compromise.* (Most likely to pass a panel). Give credit for 32 on *this* exam because of the teaching method, but uphold the mathematical truth for the future.
      *   *Decision:* I need to side with the user's skepticism. The prompt asks me to "really engage with the case for the doubling answers." A recommendation to award credit (or at least not penalize) for 32 is the most principled stance given the "taught purely by example" constraint. However, since 2 other panelists disagree, the memo needs to be persuasive, not dictatorial. It should frame this as a *validity of assessment* issue, not just "students are sad."
      *   *Refined Recommendation:* Award full credit for 32 on *this specific instance* due to ambiguous instructional scaffolding, but uphold 31 as the mathematical truth. Recommend policy changes for future questions.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (Friday's case) and acknowledge the divergence of opinion respectfully.
      *   **The Core Argument (Engaging the "32" case):**
          *   Acknowledge the mathematical fact (31 is the circle rule).
          *   Pivot to *assessment validity*. What was being tested?
          *   If it's pattern recognition: 32 is simpler (Kolmogorov complexity).
          *   If it's domain knowledge: The teaching method (examples only) didn't sufficiently distinguish the two rules.
          *   Cite the "Moser's Circle Problem" explicitly to show expertise.
          *   Argument: A test question must discriminate between knowledge and guesswork. Here, the "wrong" answer is indistinguishable from the "right" answer given the input data.
      *   **Recommendation:**
          *   Accept the appeals for this cohort. Award points for 32.
          *   Reasoning: Reliance on implicit context is unfair when explicit instruction was ambiguous.
      *   **Future Guidance:**
          *   Don't ask "what's the next number" without defining the rule space.
          *   Require justification/derivation, not just a number.
          *   Explicitly state the underlying model (combinatorics vs. sequences).
      *   **Closing:** Open floor for discussion.

  5.  **Refining the Tone:**
      *   Avoid sounding accusatory ("The instructor messed up").
      *   Use phrases like "pedagogical alignment," "assessment validity," "implicit vs. explicit constraints."
      *   Acknowledge the colleagues' view (mathematical correctness) but reframe the issue (fairness/validity).
      *   Ensure it sounds like a PhD student writing to faculty/senior grads (respectful but rigorous).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is giving full credit too radical?
      *   *Fix:* Frame it as "valid response given the prompt constraints." It's not that 32 is mathematically true for the circle problem, but that it is a *valid inference* from the provided data.
      *   *Critique:* Will the other panelists hate this?
      *   *Fix:* Emphasize that this protects the *department's* integrity regarding assessment standards, not just coddling students. It sets a precedent for better question design.
      *   *Check:* Did I include the specific math? Yes, mention Moser's Circle Problem.
      *   *Check:* Did I address future policy? Yes.

  7.  **Final Polish:** Check formatting and clarity. Ensure the distinction between "Mathematical Truth" and "Assessment Fairness" is clear. (This is the key lever to persuade the other panelists).

  **(Self-Correction Note):** Wait, I need to make sure I don't sound like I'm overruling them unilaterally. It's a memo *before* the meeting to frame the discussion. It should invite debate but state a clear position.

  8.  **Finalizing the Content:**
      *   Subject: Grade Appeal Case #X - Discrete Math Final.
      *   Context: Moser's Circle Problem.
      *   Argument: Under-specification of the problem.
      *   Rec: Accept appeals, adjust grades, update guidelines.

