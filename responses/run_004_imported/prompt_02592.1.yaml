prompt: |-
  Hi -- I'm prepping a session for my graduate seminar on ancient and medieval economic thought, and I keep getting stuck on the same stretch of the Nicomachean Ethics every time I teach it. It's the part in Book V, chapter 5, where Aristotle argues that exchange between, say, a builder and a shoemaker needs proportionate reciprocity rather than just swapping things that seem roughly equal in worth. I've worked through a handful of commentaries over the years and I still cant get a clean picture in my head of what he means by "cross-conjunction," or exactly why the setup is supposed to keep one side from ending up with what he calls "both excesses." My officemate insists Aristotle just never worked out the math properly and the passage is genuinely incoherent; I'm not so sure, but I also can't quite defend him either. Here's the passage, in W. D. Ross's translation (the one I always assign):

  Now proportionate return is secured by cross-conjunction. Let A be a builder, B a shoemaker, C a house, D a shoe. The builder, then, must get from the shoemaker the latter's work, and must himself give him in return his own. If, then, first there is proportionate equality of goods, and then reciprocal action takes place, the result we mention will be effected. If not, the bargain is not equal, and does not hold; for there is nothing to prevent the work of the one being better than that of the other; they must therefore be equated. [...] This is why all things that are exchanged must be somehow comparable. It is for this end that money has been introduced, and it becomes in a sense an intermediate; for it measures all things, and therefore the excess and the defect--how many shoes are equal to a house or to a given amount of food. The number of shoes exchanged for a house (or for a given amount of food) must therefore correspond to the ratio of builder to shoemaker. For if this be not so, there will be no exchange and no intercourse. And this proportion will not be effected unless the goods are somehow equal. All goods must therefore be measured by some one thing, as we said before. Now this unit is in truth demand, which holds all things together (for if men did not need one another's goods at all, or did not need them equally, there would be either no exchange or not the same exchange); but money has become by convention a sort of representative of demand; and this is why it has the name 'money' (nomisma)--because it exists not by nature but by law (nomos) and it is in our power to change it and make it useless. There will, then, be reciprocity when the terms have been equated so that as farmer is to shoemaker, the amount of the shoemaker's work is to that of the farmer's work for which it exchanges. But we must not bring them into a figure of proportion when they have already exchanged (otherwise one extreme will have both excesses), but when they still have their own goods. Thus they are equals and associates just because this equality can be effected in their case. Let A be a farmer, C food, B a shoemaker, D his product equated to C. [...] Money, then, acting as a measure, makes goods commensurate and equates them; for neither would there have been association if there were not exchange, nor exchange if there were not equality, nor equality if there were not commensurability. Now in truth it is impossible that things differing so much should become commensurate, but with reference to demand they may become so sufficiently. There must, then, be a unit, and that fixed by agreement (for which reason it is called money); for it is this that makes all things commensurate, since all things are measured by money. Let A be a house, B ten minae, C a bed. A is half of B, if the house is worth five minae or equal to them; the bed, C, is a tenth of B; it is plain, then, how many beds are equal to a house, viz. five.

  Could you actually work through the logic here with me rather than just summarizing whatever the standard secondary-literature take is? A few things specifically:

  1. Spell out, step by step (a diagram in words is totally fine), what "cross-conjunction" is actually pairing with what -- is it about which goods get handed over to whom, or about the order in which you're allowed to set up the proportion? And is the "both excesses" worry the same issue as the cross-conjunction one, or a separate point about timing?
  2. He relabels his variables three times in this stretch -- builder/shoemaker/house/shoe, then farmer/food/shoemaker/product, then house/ten-minae/bed. Is this the same underlying four-term proportion dressed up three different ways, or does the logical structure actually shift partway through, e.g. once money gets introduced?
  3. How does the claim that "demand" (chreia) is the real unit of commensuration, with money as merely its conventional stand-in, fit together with all the geometric-proportion talk? Is he groping toward a subjective, needs-based theory of value here, or an objective one -- this is the bit Marx makes so much of in Capital, and I've honestly never been sure he's being fair to Aristotle.

  If you can, work through the arithmetic of the "five beds" example at the end too and tell me whether it's actually consistent with the earlier four-term setup, or whether Aristotle's quietly changed the subject by that point. I'd rather you reason it out yourself, even messily, than just hand me the tidy version commentators usually give.
