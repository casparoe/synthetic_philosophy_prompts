answer: |-
  This is one of the most famous headaches in the history of economic thought, so first: your officemate is in good company. From Aquinas to Marx to modern commentators like Meikle and Finley, everyone gets tangled here. But I think your instinct is right: it's not incoherent, but it is *dense*, and Ross's translation (while standard) obscures the geometric logic Aristotle is relying on.

  Let's tear the text apart without relying on the "standard take." I'll work through your four points sequentially, trying to reconstruct the arithmetic Aristotle has in mind.

  ### 1. Cross-Conjunction and the "Both Excesses" Warning

  To understand "cross-conjunction" (*katà diástixis*), we have to recognize that Aristotle is trying to solve a specific problem: **How do you exchange unequal things between unequal people justly?**

  If a Builder and a Shoemaker are socially equal, a 1:1 swap of effort might work. But Aristotle assumes a hierarchical society where the Builder (who makes houses) is arguably "worth more" or has a higher status than the Shoemaker. If they just swap one house for one shoe, the Builder is ripped off. If they swap one house for one shoe *plus* a bit of bread, how much bread?

  Here is the step-by-step logic of the proportion.

  **The Variables:**
  *   $A$ = Builder
  *   $B$ = Shoemaker
  *   $C$ = House (Builder's product)
  *   $D$ = Shoes (Shoemaker's product)

  **The Wrong Proportion (Direct):**
  You might think the proportion should be:
  $$A : C :: B : D$$
  *(Builder is to House as Shoemaker is to Shoes)*
  This just describes production. It doesn't help us exchange. It tells us $A$ makes $C$, and $B$ makes $D$. It doesn't tell us how many $D$s equal one $C$.

  **The Right Proportion (Cross-Conjunction):**
  Aristotle argues the proportion must link the *persons* to the *opposite goods*.
  $$A : B :: D : C$$
  *(Builder is to Shoemaker as Shoes are to House)*

  **Why the Cross?**
  Because the ratio of the *persons* determines the ratio of the *goods*.
  If the Builder ($A$) is considered socially "worth" 5 times the Shoemaker ($B$), then the ratio $A:B$ is $5:1$.
  For the exchange to be just, the goods must reflect that inverse ratio. The Shoemaker must give enough shoes ($D$) to match the Builder's status.
  So, $D : C$ must also be $5:1$.
  Meaning: 5 Shoes ($D$) exchange for 1 House ($C$).

  **The Diagram in Words:**
  Imagine a rectangle with corners $A, B, C, D$.
  *   Top Left: Builder ($A$)
  *   Bottom Right: Shoemaker ($B$)
  *   Top Right: House ($C$) — *Wait, no.*
  *   Let's arrange it by exchange flow.
  *   $A$ gives $C$, receives $D$.
  *   $B$ gives $D$, receives $C$.
  *   The "Cross" is that $A$'s standing relative to $B$ dictates $D$'s standing relative to $C$.

  **The "Both Excesses" Warning:**
  This is the trickiest sentence: *"We must not bring them into a figure of proportion when they have already exchanged (otherwise one extreme will have both excesses)."*

  This is about **timing**, not just geometry.
  *   **Scenario 1 (Correct):** We agree on the proportion ($5 \text{ shoes} = 1 \text{ house}$) *before* the swap. I give you the house, you give me 5 shoes. We are now equal.
  *   **Scenario 2 (Incorrect):** I give you the house *first*. Now you have the House ($C$). I have nothing. We then try to calculate the proportion.
      *   If we calculate that 5 shoes = 1 house, you give me 5 shoes. We are equal.
      *   *But*, Aristotle worries that once possession has shifted, the leverage shifts. If the calculation is done *after*, the person holding the good ($C$) effectively holds the "excess" of value until they pay.
      *   More technically: In a geometric proportion $A:B :: D:C$, the "extremes" are $A$ and $C$ (or $B$ and $D$, depending on arrangement). If you calculate after exchange, one person ends up with their original good *plus* the new good (both excesses) while the other has neither.
      *   Actually, a cleaner reading is this: If you equate them *after* exchange, you are trying to fix an inequality that has already materialized. If $A$ gave $C$ to $B$, $B$ now has $C$. If the proportion turns out to require *more* than $B$ has, $B$ has an excess of goods ($C$) and an excess of value (underpaid). $A$ has a deficit.
      *   The "Both Excesses" likely refers to the terms of the proportion. In $A:B :: D:C$, if you swap first, you can't make the terms equal. One side of the equation will hold the physical good *and* the value advantage.
      *   **Verdict:** It's a warning against *ex post facto* pricing. Justice in exchange requires the price be set *before* the transfer so the transfer itself creates the equality.

  ### 2. The Three Variable Sets: Shift or Continuity?

  You noticed he relabels three times. This isn't just stylistic; it marks a logical progression from **Social Status** to **Market Price**.

  **Set 1: Builder ($A$), Shoemaker ($B$), House ($C$), Shoe ($D$).**
  *   **Logic:** Pure reciprocity based on social worth.
  *   **Problem:** How do we measure "Builder vs. Shoemaker" status objectively? It's vague.

  **Set 2: Farmer, Shoemaker, Food, Product.**
  *   **Logic:** Reiteration to emphasize that *need* drives this.
  *   **Shift:** He introduces the idea that if they didn't *need* each other, the ratio wouldn't matter. This hints that "status" might actually be a proxy for "intensity of need."

  **Set 3: House ($A$), 10 Minae ($B$), Bed ($C$).**
  *   **Logic:** Introduction of Money.
  *   **Major Shift:** Notice the variables changed from *Person/Product* to *Product/Money/Product*.
      *   Earlier: $Person_1 : Person_2 :: Product_2 : Product_1$
      *   Now: $House : Money :: Bed : Money$ (implicitly).
      *   Actually, he writes: $A$ (House) is half of $B$ (10 minae). $C$ (Bed) is 1/10 of $B$ (10 minae).
      *   This collapses the 4-term proportion into a **price system**.
      *   Instead of comparing Builder to Shoemaker every time, we compare House to Money and Bed to Money.
      *   **Does the structure shift?** Yes. The first model requires knowing the *social ratio of the producers*. The second model allows the *goods to speak for themselves* via a common denominator (money). Money "objectifies" the social relationship. You don't need to know if the Builder is nobler than the Shoemaker; you just need to know the House is 5 minae and the Bed is 1 mina. The social status is *baked into* the price.

  ### 3. Demand (*Chreia*) vs. Geometric Proportion

  This is the heart of your Marx question.

  **The Tension:**
  *   **Geometric Proportion:** Implies an *objective* hierarchy. The Builder is worth more than the Shoemaker. Value is top-down.
  *   **Demand (*Chreia*):** Aristotle says, "This unit is in truth demand... money has become by convention a sort of representative of demand." This sounds *subjective* (or at least intersubjective). Value comes from the fact that I need your shoe and you need my house.

  **Reconciling Them:**
  Aristotle isn't groping toward a Labor Theory of Value (Marx's hope), nor is he a modern Marginalist (subjective utility). He is proposing a **Social Theory of Value**.

  1.  **Commensurability:** Physically, a house and a shoe are incomparable. You can't put them on a scale.
  2.  **The Common Substance:** What makes them comparable? Not labor hours. It is the fact that they both satisfy a *need* within the *polis*.
  3.  **The Role of Money:** Money is a convention (*nomos*) that quantifies *chreia*.
  4.  **Marx's Critique:** Marx says Aristotle failed because he couldn't find "abstract human labor" as the common substance. Marx claims Aristotle stopped at "demand" because Greek society was based on slavery, so "labor" wasn't seen as the universal source of value.
  5.  **Defense of Aristotle:** Marx is being anachronistic. Aristotle isn't trying to explain *production* (where labor matters); he's explaining *distribution/exchange* (where need matters).
      *   For Aristotle, value isn't "in" the object (objective cost).
      *   Value isn't "in" the mind (subjective preference).
      *   Value is in the **relationship of need** between citizens.
      *   The "Geometric Proportion" of the persons ($A:B$) is actually a proxy for the **intensity of reciprocal need**. The Builder is "greater" than the Shoemaker not necessarily because he's a better human, but because the *community* needs houses more urgently or intensely than shoes, or because the skill is rarer.
      *   So, Demand (*chreia*) is the *substance*, Geometric Proportion is the *math*, and Money is the *tool*. They fit together.

  ### 4. The "Five Beds" Arithmetic: Consistency Check

  Let's crunch the numbers at the end of the passage to see if it breaks the earlier model.

  **The Setup:**
  *   $A$ = House
  *   $B$ = 10 Minae (Money)
  *   $C$ = Bed

  **The Math:**
  1.  "A is half of B": House = 5 Minae.
  2.  "C is a tenth of B": Bed = 1 Mina.
  3.  Conclusion: 5 Beds = 1 House.

  **Is this consistent with the Cross-Conjunction ($A:B :: D:C$)?**

  In the first model, the ratio came from **Persons**:
  $$ \text{Builder} : \text{Shoemaker} :: \text{Shoes} : \text{House} $$
  If Builder = 5 $\times$ Shoemaker, then Shoes = 5 $\times$ House (in quantity).

  In the last model, the ratio comes from **Money**:
  $$ \text{House} : \text{Money} :: \text{Bed} : \text{Money} $$
  $$ 5 \text{ minae} : 10 \text{ minae} :: 1 \text{ mina} : 10 \text{ minae} $$
  $$ 1/2 :: 1/10 $$
  Wait, that's not a proportion. Let's look at the exchange ratio.
  House (5) / Bed (1) = 5.
  So 5 Beds exchange for 1 House.

  **The Consistency Check:**
  Does the Money model preserve the Person model?
  *   **Yes,** *if* we assume the prices (5 minae vs 1 mina) reflect the social standing of the producers.
  *   If the House is priced at 5 minae and the Bed at 1 mina, the market has *already decided* that the House-maker's contribution is worth 5 times the Bed-maker's contribution.
  *   Money allows Aristotle to drop the explicit reference to the Persons ($A$ and $B$). He doesn't need to say "Builder is to Shoemaker" anymore. He can just say "House is to Bed."
  *   **Why?** Because Money is the "representative of demand." The demand for the Builder's work is encoded in the 5 minae price.

  **Did he change the subject?**
  He shifted from **Justice between Persons** to **Equivalence between Goods**.
  *   **Early passage:** Focus is on keeping the *citizens* as equals/associates. (Political focus).
  *   **Late passage:** Focus is on making the *goods* commensurate. (Economic focus).
  *   **Is it a contradiction?** No, it's a solution. You can't keep the citizens equal (Political) unless you make the goods commensurate (Economic). Money is the bridge.

  **One Glitch in the Arithmetic:**
  Aristotle says: "A is half of B [10 minae]... C is a tenth of B."
  So $A = 5$, $C = 1$.
  He concludes: "It is plain... how many beds are equal to a house, viz. five."
  This is consistent ($5 \times 1 = 5$).
  However, notice he uses **10 minae** as the common measure ($B$), even though the House is only 5.
  Why not just say House = 5, Bed = 1?
  Because he wants to show Money as a **Common Denominator**.
  To compare $A$ and $C$, you don't compare them directly. You compare both to $B$.
  $A/B = 1/2$.
  $C/B = 1/10$.
  Therefore $A/C = (1/2) / (1/10) = 5$.
  This validates the claim that money makes things "commensurate." It provides the shared term ($B$) that allows $A$ and $C$ to be compared.

  ### Summary for Your Seminar

  If I were prepping this for a grad seminar, here is the narrative arc I would propose to the students:

  1.  **The Problem:** Exchange requires equality, but traders and goods are unequal.
  2.  **The Solution (Part 1):** Cross-conjunction. We equate the *ratio of persons* to the *inverse ratio of goods*. (Builder:Shoemaker :: Shoes:House). This ensures social hierarchy is respected in exchange.
  3.  **The Problem with Part 1:** How do we measure "Builder vs. Shoemaker"? It's too abstract.
  4.  **The Solution (Part 2):** Demand (*Chreia*). The "worth" of the person is actually a measure of how much the community needs their product.
  5.  **The Tool:** Money. Money quantifies Demand. It allows us to stop comparing Persons and start comparing Prices.
  6.  **The "Both Excesses":** A warning that this calculation must happen *before* exchange to prevent one party from holding both the good and the value advantage.
  7.  **Marx's Critique:** Marx wants "Labor" to be the common substance. Aristotle offers "Need." Aristotle is more honest: in the market, labor doesn't determine price; social need (demand) does.

  **Final verdict on your officemate:** Aristotle's math isn't incoherent, but it is **sociological**, not purely economic. He is trying to mathematize social cohesion. If you treat it as a proto-textbook on price theory, it fails. If you treat it as a theory of *how to maintain friendship through trade*, it works. The "cross-conjunction" is the formula for keeping the Builder and Shoemaker friends rather than enemies.

  Does that help untangle the knot? I can dig deeper into the Greek terms (*antipeponthos* vs. *isotes*) if you need to get into the weeds of the translation too.
