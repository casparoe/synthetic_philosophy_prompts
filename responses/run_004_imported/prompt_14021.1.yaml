answer: |-
  You have put your finger on one of the most fertile tensions in decision theory, one that often goes unremarked because the two camps (classic coherence theorems vs. dynamic/functional decision theory) tend to talk past each other. You are correct: the term "money pump" is doing double duty, and resolving that ambiguity is prerequisite to answering your concrete question about precommitment.

  Here is the breakdown of the two registers, the strongest arguments for the "Resoluteness as Rationality" vs. "Resoluteness as Tyranny" debate, and how to apply this to your life policies.

  ### 1. Disambiguating the Two Registers

  To clear the fog, we must distinguish between **Preference Pumps** and **Policy Pumps**.

  **Register 1: The Classic Preference Pump (Static Coherence)**
  *   **The Setup:** You have cyclic preferences over states of the world (A > B > C > A) at a single time slice.
  *   **The Pump:** An external agent trades you A→B, B→C, C→A (plus a small fee), leaving you with A and less money.
  *   **The Lesson:** Your *preference ordering* is defective. Rationality requires transitivity and completeness.
  *   **The Fix:** Fix your preferences.

  **Register 2: The Dynamic/Policy Pump (Time Inconsistency)**
  *   **The Setup:** You have a plan at $t_1$ (e.g., "Pay the driver when we reach town"), but at $t_2$, your local incentives shift (e.g., "I'm safe now; paying costs me $100 with no benefit").
  *   **The Pump:** A *sophisticated* agent (who anticipates their $t_2$ defection) realizes they cannot credibly commit. Therefore, at $t_1$, they cannot even enter the agreement (e.g., they get left in the desert). They end up worse off than an agent who could have committed.
  *   **The Lesson:** Your *decision procedure* is defective. Rationality requires the ability to bind future actions to past plans.
  *   **The Fix:** Adopt a **Resolute** choice function or an **Updateless** decision algorithm.

  **The Conflict:** Register 1 says "Fix your preferences so you don't want to deviate." Register 2 acknowledges "Your preferences *will* change (or indexicals shift), so you must override your future preferences."

  The crux of your reading group's stalemate is this: **When preferences change between $t_1$ and $t_2$, is overriding the $t_2$ preference an act of rationality (sticking to the optimal policy) or an act of oppression (privileging the dead hand of the past)?**

  ---

  ### 2. The Strongest Case for Side A: Resoluteness as a Rationality Constraint

  *The Argument from Global Agency and Algorithmic Stability*

  This view is championed by Edward McClennen (in *Rationality and Dynamic Choice*) and finds its modern computational analogue in **Updateless Decision Theory (UDT)** and **Functional Decision Theory (FDT)** on LessWrong.

  **The Core Claim:** Rationality is not about maximizing utility at every specific choice node; it is about selecting the best *decision algorithm* or *policy*.

  1.  **The Ontology of the Agent:** You are not a sequence of time-slices ($Self_{t1}, Self_{t2}$); you are a single extended algorithm. If your algorithm outputs "Defect on promises when it becomes costly," that algorithm is selected against in the marketplace of life. You won't get offered rides, loans, or partnerships.
  2.  **The "Privilege" Objection is a Category Error:** It is not that $t_1$ is "privileging" itself over $t_2$. It is that the *algorithm* is executing its code. When $t_2$ arrives, the question isn't "What does $t_2$ want?" but "What does the algorithm output?" If the algorithm is "Keep promises," then $t_2$ keeping the promise is simply the algorithm functioning correctly.
  3.  **Value of Credibility:** In Newcomblike problems (which include Parfit's Hitchhiker, Prisoner's Dilemma, and reputation markets), the only way to win is to be the kind of agent who doesn't reoptimize. A "sophisticated" agent (who reoptimizes) is predictably untrustworthy and is therefore excluded from high-value cooperative equilibria.
  4.  **Rationality as Winning:** If "rationality" means "systematically achieving your goals," then the resolute agent is more rational. They arrive in town; the sophisticated agent dies in the desert. The fact that $t_2$ *wants* to defect is irrelevant to the success of the agent-as-a-whole.

  **Implication for your life:** You should cultivate strong resolute dispositions. Irrevocable pledges are rational because they transform you into an agent capable of accessing cooperative equilibria that are closed to "flexible" agents.

  ---

  ### 3. The Strongest Case for Side B: Resoluteness as Privilege (The Ratifiability Objection)

  *The Argument from Autonomy and Local Endorsement*

  This view is associated with **Causal Decision Theory (CDT)** purists, **Richard Jeffrey**, and more recently, critics of UDT like **Johannes Marti** or those focusing on **ratifiability** (e.g., **James Joyce**).

  **The Core Claim:** A decision is only rational if the agent making it can endorse it *at the time of action* given their current information and preferences.

  1.  **The Autonomy of the Present:** $t_2$ is a conscious agent with its own sensory data and utility function. If $t_2$'s preferences have genuinely changed (not just due to weakness of will, but due to new values, e.g., a religious conversion or a change in life priorities), forcing $t_2$ to obey $t_1$ is a form of inter-temporal tyranny.
  2.  **The Ratifiability Constraint:** A decision is rational only if, conditional on making that decision, you prefer it to any alternative. At $t_2$ in the Hitchhiker scenario, conditional on having already been rescued, paying the driver is strictly dominated by not paying. A resolute choice is *unratifiable*. It requires you to do something you currently deem suboptimal.
  3.  **The Risk of Error:** $t_1$ is often overconfident. $t_1$ does not know the specific hardships $t_2$ will face. An irrevocable pledge made in prosperity might force $t_2$ into destitution during a crisis. "Sophistication" (anticipating your future defection) acts as a safety valve, allowing you to abandon plans that no longer serve your actual welfare.
  4.  **Exploitability is a Tax, Not a Sin:** Yes, a flexible agent gets "pumped" in specific game-theoretic scenarios. But they also avoid catastrophic lock-in. Paying the "exploitability tax" (losing some reputation or missing some deals) is the price of maintaining autonomy and adaptability in a changing world.

  **Implication for your life:** Be wary of irrevocable dispositions. Treat every decision point as a fresh opportunity to optimize. Use "soft" commitments (reputation costs) rather than "hard" commitments (legal/irrevocable binds), allowing you to defect if the cost becomes too high.

  ---

  ### 4. The Deflationary View: Exploitability as a Feature

  There is a third, increasingly popular view in the Alignment Forum space (often associated with **partial agency** or **bounded rationality** literature).

  This view suggests that the demand for perfect resoluteness is a demand for *logical omniscience*.
  *   **The Argument:** You cannot actually be Updateless. You *are* a sequence of time-slices with imperfect memory and computing power. Trying to act like a single timeless algorithm leads to "tilting at windmills" (trying to control things you can't).
  *   **The Synthesis:** Accept that you are pumpable. Design your life so that the "pumps" are expensive for others to execute.
  *   **Example:** Instead of an *irrevocable* donation pledge (which $t_2$ might resent), set up a reputation system where defaulting is public. This aligns $t_2$'s incentives with $t_1$'s plan without removing $t_2$'s agency. $t_2$ *chooses* to pay to save face, rather than being *forced* to pay by a contract.

  ---

  ### 5. Concrete Advice: How Far Should You Go?

  Given your reading group's stalemate, here is a framework for applying this to your specific examples (donation pledges, renegotiation policies).

  **Criterion 1: Is the preference change "Endogenous" or "Exogenous"?**
  *   **Endogenous (Weakness of Will):** If $t_2$ wants to deviate only because of hyperbolic discounting or akrasia (e.g., "I want to save money" vs. "I want to buy this shiny thing now"), **Side A (Resoluteness)** wins. $t_1$ and $t_2$ share the same values, but $t_2$ has a bug. Bind yourself.
  *   **Exogenous (Value Drift):** If $t_2$ wants to deviate because of fundamental value change (e.g., "I am now effective altruist" vs. "I now prioritize family survival"), **Side B (Privilege)** has weight. Binding $t_2$ here is dangerous.

  **Criterion 2: Is the Interaction Newcomblike?**
  *   **Yes (Reputation/Trust):** If your ability to get what you want depends on others *predicting* your behavior (e.g., business deals, relationships), **Side A** dominates. You need to be the kind of person who doesn't renegotiate. The "money pump" here is the loss of opportunity.
      *   *Action:* Adopt a **flat policy against renegotiation** for public-facing deals. This signals "Sophisticated/Resolute" type to the market.
  *   **No (Private Consumption):** If the decision is private (e.g., how much to donate to an anonymous cause), the reputational benefit vanishes.
      *   *Action:* Avoid irrevocable pledges. Use automatic recurring donations (friction) rather than legal contracts (force).

  **Criterion 3: The "Veil of Ignorance" Test**
  *   Ask $t_1$: "If I knew exactly what situation $t_2$ would be in (including their mental state and resources), would I still bind them?"
  *   If the answer is "No, I'm binding them because I don't trust their judgment," that is **Paternalism**.
  *   If the answer is "Yes, because even with their new info, the global policy yields more utility," that is **Updatelessness**.
  *   *Practical Heuristic:* If you can't simulate $t_2$'s state well enough to be sure, default to **Soft Commitment**.

  ### Summary for Your Reading Group

  To break the stalemate, propose that the disagreement is not about "rationality" per se, but about the **Ontology of the Agent**.

  1.  **If you model the agent as a Policy/Algorithm (UDT/FDT):** Resoluteness is a substantive rationality constraint. The "privilege" objection fails because $t_2$ is just an execution node, not a distinct agent. *Recommendation: High resoluteness, irrevocable pledges for high-stakes coordination.*
  2.  **If you model the agent as a Sequence of Selves (CDT/Game Theory):** Resoluteness is a preference of the past self imposed on the future self. It is only justified if the future self agrees (which defeats the purpose) or if external enforcement exists. *Recommendation: Low resoluteness, keep options open, pay the exploitability tax.*
  3.  **The Pragmatic Middle:** Most humans are neither timeless algorithms nor wholly disconnected time-slices. We are **narrative selves**.
      *   Cultivate resoluteness *dispositions* (virtues) rather than *constraints* (contracts).
      *   A virtue ("I am a person who keeps promises") allows $t_2$ to *choose* to keep the promise to maintain their self-narrative. This satisfies Side A (you keep the promise) and Side B ($t_2$ ratifies the action as identity-consistent).
      *   **Concrete Policy:** Do not sign irrevocable legal pledges. Instead, make public, high-reputation-cost pledges. This creates a "money pump" for *defecting* (you lose status) rather than a "money pump" for *committing* (you lose money). This aligns incentives without removing agency.

  **Final Verdict:** Go for **Resolute Dispositions**, not **Resolute Constraints**. Be the person who doesn't renegotiate, but retain the *capacity* to do so in catastrophic black-swans. This captures the UDT benefit (predictability) without incurring the exogenous risk (tyranny of the past).
