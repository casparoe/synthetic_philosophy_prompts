answer: |-
  Here are 10 interview questions designed to press your guest on the technical and philosophical commitments of her non-cognitivist view, including the specific constraints you requested.

  **1. The Triviality Proof and Rational Learning**
  "Let's start with the engine room: Lewis's triviality result. We know the math shows that if $P(A > B) = P(B|A)$, probability functions collapse. But the proof relies on the assumption that this equation must hold not just for your current credence function, but for any function you get by conditionalizing on new evidence. Critics sometimes call this a mathematical trick. Can you walk us through why it's a *fair* philosophical requirement to impose? Why must a rational agent's conditional credences track conditional probability even after they learn new information, and why does denying that closure amount to giving up on rational learning?"

  *   **Follow-up:** "If she answers that it's required for coherence: Press her on whether a cognitivists could simply deny that indicative conditionals are the *kind* of thing that get updated by conditionalization, thereby blocking the triviality proof without abandoning truth conditions."

  **2. The Embedding Problem and Compositionality**
  "The standard objection to your view is compositionality. If 'If A, then B' doesn't express a proposition, it lacks a truth value. But we embed conditionals constantly: 'It's not the case that if it rains, the match is cancelled,' or 'Either if it rains we stay in, or if it shines we go out.' If the conditional has no semantic value to contribute to the larger sentence, how do you compute the truth conditions of the whole? Are you forced to say our surface grammar is systematically misleading, or do you have a semantics for 'not' and 'or' that operates on assertability conditions rather than truth conditions?"

  *   **Follow-up:** "If she suggests we paraphrase away the embeddings: Ask her if this forces an error theory on ordinary logical reasoning, implying that when people use Disjunctive Syllogism with conditionals, they are technically committing a category mistake."

  **3. Validity Without Truth**
  "Classically, an argument is valid if it preserves truth. If conditionals aren't the kind of things that can be true, you need a new definition of validity. Adams proposed probabilistic validity, where the uncertainty of the conclusion shouldn't exceed the sum of the uncertainties of the premises. But this allows for some classically valid forms to fail. Are you comfortable telling students that Modus Ponens or Hypothetical Syllogism are not strictly valid for indicatives, or do you think we need to preserve classical logic and sacrifice something else?"

  *   **Follow-up:** "If she defends probabilistic validity: Ask whether this creates a disconnect between logic and inference, since human reasoning often feels all-or-nothing rather than a calculus of uncertainty bounds."

  **4. Gibbard's 'Sly Pete' Case**
  "Let's talk about Gibbard's 'Sly Pete.' Pete sees his opponent's hand and sends a note saying, 'If you call, you'll win.' His accomplice sees Pete's hand and sends a note saying, 'If you call, you'll lose.' Both have high conditional probability based on their evidence. If conditionals express propositions, these contradict and can't both be true. But intuitively, both notes were assertable. You take this as motivation for non-cognitivism. But doesn't this create a problem for disagreement? If I assert one and you assert the other, in what sense are we disagreeing if there's no common proposition we're taking opposite stances on?"

  *   **Follow-up:** "If she says the disagreement is about evidence or assertability norms: Press her on whether this reduces the disagreement to a verbal dispute, whereas it feels like we are disagreeing about the outcome of the poker game."

  **5. The Phenomenology of Belief**
  "When I say, 'I believe that if it rains, the match will be cancelled,' it feels like I am in a belief state with a specific content. On your view, I don't believe a proposition; I just have a high conditional credence. But isn't there a phenomenological difference between having a high conditional credence and actually taking a stance on a conditional claim? Why does the mind present this state to us as a 'belief that P' if there is no 'P' to be believed?"

  *   **Follow-up:** "If she calls it a cognitive illusion: Ask if this forces an error theory about our own mental states, and whether that's a heavier theoretical cost than accepting triviality."

  **6. Learning and Information**
  "If I tell you, 'If the butler did it, he used the candlestick,' and you accept this, what information have you gained? On a truth-conditional view, you've ruled out worlds where the butler did it and didn't use the candlestick. On your view, you haven't ruled out any worlds; you've just shifted your conditional probabilities. But if you haven't ruled out any possibilities, in what sense has your informational state changed? Is 'information' the right word for what's happening?"

  *   **Follow-up:** "If she distinguishes factual information from inferential dispositions: Ask how this distinction helps in a court of law, where we seem to treat conditionals as factual claims that can be corroborated or refuted."

  **7. Jackson's Robustness Defense**
  "Frank Jackson tried to save truth conditions by arguing conditionals *do* have the truth conditions of the material conditional, but we only assert them when they are 'robust'—i.e., when the conditional probability is high. To you, is Jackson offering a genuine rival account, or is he just describing your view while wearing a truth-conditional costume? If the assertability conditions do all the work, is positing the underlying truth conditions just metaphysical baggage?"

  *   **Follow-up:** "If she says it's baggage: Ask if that baggage is necessary to solve the embedding problem mentioned earlier, implying Jackson might actually have the better deal for logic even if the metaphysics is thin."

  **8. Subjunctives and the Divide**
  "You deny truth conditions for *indicative* conditionals. But most philosophers grant them for *subjunctive* or counterfactual conditionals (e.g., 'If you had flipped it, it would have landed heads'). What is the semantic discontinuity here? Why does the grammar shift from 'will' to 'would' suddenly conjure a proposition into existence? Is there a principled reason why triviality results apply to one but not the other, or is this an unstable dualism?"

  *   **Follow-up:** "If she argues subjunctives are about similarity of worlds: Ask whether indicative conditionals can't also be modeled that way, which would restore truth conditions and undermine her main motivation."

  **9. Betting Behavior and the Ramsey Test**
  "Ramsey suggested we evaluate conditionals by betting on them. If I bet on 'If A, B,' I win if A and B are true, the bet is off if A is false. This behavior looks exactly like we are treating the conditional as having a truth value (or at least a void). If your view is correct, how do you explain the betting behavior without appealing to the idea that we are implicitly treating the conditional as a proposition that might be voided? Is the 'bet is off' intuition compatible with no truth value?"

  *   **Follow-up:** "If she says betting tracks assertability: Ask why the payout structure of the bet mirrors the truth table of the material conditional so closely if there is no truth condition underlying it."

  **10. The Theoretical Cost**
  "Finally, let's zoom out. You bite the bullet: no truth conditions, logic is probabilistic, grammar is misleading. The payoff is avoiding triviality and explaining Sly Pete. For a philosopher listening who is tempted by Stalnaker's possible worlds account, what is the decisive argument that your costs are lower than theirs? Is the collapse of the probability equation truly worse than the complexity of adding possible worlds semantics to handle the embeddings you reject?"

  *   **Follow-up:** "If she says triviality is a dealbreaker: Ask if there is a 'middle ground' view emerging in recent literature (like dynamic semantics) that might avoid triviality without going full non-cognitivist, and why she rejects those."
