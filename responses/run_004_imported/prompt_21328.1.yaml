answer: |-
  The helmet smelled of ozone and stale alcohol wipes. Elara adjusted the strap under her chin, checking the seal against her temples. On the desk, the quantum random number generator hummed—a faint, high-pitched whine from the single-photon detectors.

  She didn't feel fear. Fear was a heuristic for avoiding branches where your genetic line terminated. In the Everett interpretation, the line never terminated from the inside. There was always a branch where the photon went left, the trigger didn't fire, and Elara drew breath.

  She opened the spreadsheet on her monitor.

  **Trial 14.**
  **Prior Measure:** $1.2 \times 10^{-4}$
  **Wager:** 50/50 Lethal.
  **Projected Post-Survival Measure:** $6.0 \times 10^{-5}$

  She highlighted the cell. The numbers were red. Not a warning for her safety—safety was guaranteed by the structure of the wavefunction—but a warning for her *substance*.

  The pop-sci version of Quantum Immortality was seductive: *You can't die.* The technical version, the one Yudkowsky and Tegmark actually wrestled with, was colder: *You will continue, but you will become rare.*

  Elara hit 'Enter'.

  The solenoid clicked. A hammer struck a firing pin. In half the branches of the multiverse, the capsule containing the neurotoxin shattered against the ceramic plate inside the helmet. In those branches, Elara's story ended. In this branch, there was a dull thud, and silence.

  She exhaled. The air tasted thin.

  It was the fourteenth time she had woken up to the silence. To an outside observer—if one could track the specific decohered branch of a specific observer—the probability of this sequence was one in sixteen thousand. But outside observers were irrelevant. There was only the stream of consciousness, flowing down the narrow canyon of survival.

  She stood up and walked to the window. The city outside looked normal. Cars moved, lights flickered. But Elara had been tracking the noise floor.

  After Trial 10, she had noticed the static on the radio was slightly louder, requiring more gain to pull in a signal. After Trial 12, the coffee she brewed tasted like water, as if her taste buds required a stronger chemical gradient to fire.

  *Measure loss,* she thought. *Or confirmation bias?*

  She returned to the desk. The Born rule dictated that the squared amplitude of her branch was halving with every trial. She was becoming a ghost in the machine of the multiverse. Most of "her"—in terms of integrated squared amplitude—was dead. The Elara sitting here was a dwindling resource.

  She opened a new file: `MANGLED_THRESHOLD_EST.xlsx`.

  Robin Hanson's proposal was speculative, even for this crowd. The idea was that decoherence wasn't perfect. Branches with sufficiently low measure couldn't maintain their independence. They got "mangled" by the higher-amplitude branches nearby, their information overwritten by the statistical bulk of the multiverse.

  If the measure dropped below the mangled threshold, consciousness wouldn't end in a flash of darkness. It would simply cease to be a distinct causal process. The branch would dissolve into the noise of a neighboring, higher-probability reality.

  Elara typed in the variables.

  **Current Measure:** $6.0 \times 10^{-5}$
  **Estimated Mangled Threshold:** $1.0 \times 10^{-6}$
  **Remaining Trials before Critical Instability:** 4

  Four more coin flips. Four more times halving her existence. If Hanson was right, Trial 19 wouldn't just be risky. It would be ontologically unstable.

  She looked at the gun mechanism. It was ugly, industrial. A tool for testing the fabric of reality, not a weapon.

  Why was she doing this?

  It wasn't for money. She had already bet on the outcomes. She had shorted her own life insurance in jurisdictions where the contract didn't specify *which* Elara had to die, a legal loophole she knew would pay out only in branches where she survived to collect. The bank transfer notification sat in her inbox. Millions. Useless. What could you buy with currency when your causal influence was evaporating?

  She was doing it to see the edge. To see if the world frayed before it broke.

  She sat back down. The chair creaked. The sound seemed to come from far away, as if the air density in the room had dropped.

  *Trial 15.*

  She adjusted the odds. 50/50 was too slow. She needed to reach the threshold before the boredom of immortality set in. She adjusted the QRNG parameters.

  **New Probability of Survival:** 10%.
  **New Measure Cost:** 90% loss.

  If she survived, she would retain only 10% of her current measure. $6.0 \times 10^{-6}$. Just above the theoretical mangled threshold.

  Her hand hovered over the 'Execute' key.

  A rational agent maximizes expected utility. But how do you calculate utility when the *you* that receives the utility is shrinking? If she survived, she would be rich and proven right. But she would also be faint. A whisper of a person in a shouting universe.

  She thought about the coffee. It had tasted like water. If she continued, would the next meal taste like nothing? Would the light from the monitor fade until she was sitting in darkness, not because the bulb died, but because her branch no longer had the amplitude to support high-energy photons interacting with her retina?

  Or was that just her brain misfiring, starved of oxygen by the stress?

  No. She had run the diagnostics. Her vitals were perfect. The external world was changing. Or rather, her connection to it was thinning.

  *Hanson's argument,* she recalled, *was that low-measure worlds are subject to interference from high-measure worlds.*

  If she pushed past the threshold, she might not die. She might just... drift. Her thoughts might be overwritten by the thoughts of an Elara in a neighboring branch who had chosen not to play. A higher-amplitude Elara, living a boring, safe life, might bleed into this one. Elara might find herself suddenly remembering a childhood where she never touched the machine. She might wake up tomorrow with different memories, different scars, a different personality.

  The Quantum Immortality guarantee only promised *continuity of experience*, not continuity of *self*.

  She looked at her reflection in the dark monitor. The face looked pale. Translucent? No, that was the lighting. But the eyes seemed unfocused.

  *Trial 15.*

  She pressed the key.

  The solenoid clicked. The mechanism whirred. The toxin capsule remained intact.

  Elara gasped, a sharp intake of air that felt like breathing glass.

  The room darkened. Not a power outage—the LEDs on the equipment were still glowing—but the contrast dropped. The shadows lost their definition. The hum of the QRNG dropped an octave, vibrating in her teeth rather than her ears.

  She checked the spreadsheet.

  **Current Measure:** $6.0 \times 10^{-6}$.

  She was hovering right on the line.

  She looked at her hand. It looked solid. She clenched it into a fist. The proprioceptive feedback was delayed by a fraction of a second.

  *One more,* a voice in her head said. *One more to break the threshold. To see if the mangling is perceptible.*

  *No,* another voice countered. *You are optimizing for a variable that no longer exists. You are a shadow chasing a light source that has moved.*

  But if she stopped now, she remained in this thin, fading branch. A ghost with a bank account. If she continued, if she pushed past the mangled threshold... what happened to the observer who finds herself in a mangled world?

  Did she cease to observe? Or did she observe something else?

  If the branch decoheres improperly, does the observer merge with the bulk? If she triggered Trial 16, and the branch collapsed into a higher-amplitude neighbor, would she experience the transition? Or would she simply *be* the other Elara, unaware that a swap had occurred?

  If that were true, then Quantum Immortality was a lie. Not because she would die, but because *she* would end, replaced by a copy that thought it was her.

  Elara placed her hand on the keyboard.

  The cursor blinked in the input field for Trial 16.

  **Probability:** 50/50.
  **Projected Measure:** $3.0 \times 10^{-6}$.
  **Status:** BELOW MANGLED THRESHOLD.

  The hum of the machine stopped. Or maybe she just couldn't hear it anymore. The silence was heavy, pressing against her eardrums.

  She looked at the gun. It looked like a toy. A prop from a play she had forgotten the script for.

  If she pressed the key, she might wake up in a world where she never built the machine. She might wake up in a hospital. She might wake up as someone else. Or she might wake up here, in a world so faint that the atoms themselves were struggling to hold their positions.

  But she would wake up. That was the promise. The terrible, hollow promise.

  Elara's finger trembled. Not from fear of death. Death was the one thing she couldn't touch.

  She trembled from the fear of continuity.

  She looked at the 'Enter' key. It seemed very far away. The light from the screen was washing out, turning the room a uniform, static gray. She couldn't tell if her eyes were open or closed.

  She thought about the coffee. She wanted to taste it again. Just to see if it was still water.

  Her finger descended.

  The screen flickered. For a moment, the spreadsheet vanished, replaced by a reflection of a woman sitting in a sunny cafe, laughing, no helmet on her head. A high-amplitude Elara.

  Then the spreadsheet returned. The cursor blinked.

  Elara held her breath. The air in the room felt very thin, very old.

  She pressed the key.
