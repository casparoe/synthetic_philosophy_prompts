  **Move 1 (Dev):** Score: 1
  This is a solid articulation of the common-sense moral intuition that bodily integrity trumps general beneficence. It aligns with legal standards and most non-utilitarian ethical frameworks, but it functions more as an assertion of the status quo than a defense against Sofia's specific theoretical challenge.

  **Move 2 (Sofia):** Score: 1
  This is a faithful and logically consistent application of Singer's utilitarian framework, effectively challenging the group to examine their inconsistencies. However, it relies on the contentious premise that surgical risk is comparable to "ruining clothes," which many ethicists reject as a false equivalence.

  **Move 3 (Dev):** Score: 2
  This is a strong philosophical distinction; rights-based ethics generally treat bodily integrity as categorically different from property loss. By highlighting that bodily harm is non-fungible and irreversible in ways money is not, Dev successfully complicates Singer's analogy without rejecting utilitarianism entirely.

  **Move 4 (Sofia):** Score: 2
  This is the sharpest logical move in the exchange, correctly identifying that Dev's "categorical" distinction is actually a gradient of risk. By demanding a principled threshold for where duty ends and supererogation begins, Sofia exposes the vagueness in Dev's position and forces the burden of proof back onto him.

  **Move 5 (Dev):** Score: 1
  This raises a crucial pragmatic point about the social function of moral praise and the "overdemandingness" objection. While it doesn't prove the act isn't obligatory, it correctly identifies that collapsing supererogation into duty has counterintuitive costs for how we value moral heroes versus ordinary people.

  **What They're Missing**
  Both friends are rehashing the "overdemandingness objection" without naming it, but they're missing the meta-ethical purpose of the supererogatory category itself. As J.O. Urmson argued, we need a category for actions that are good to do but not wrong to omit, otherwise morality becomes too demanding for ordinary human psychology to sustain. Additionally, they overlook the distinction between *ideal* theory (what a perfect moral agent would do) and *non-ideal* theory (what we can reasonably require of people in a society without institutional support). Sofia treats the moral demand as isolated to the individual, while Dev treats the bodily cost as absolute; the missing piece is acknowledging that while donation might be morally *optimal*, requiring it as *obligatory* could undermine the voluntary spirit that makes the practice sustainable.
