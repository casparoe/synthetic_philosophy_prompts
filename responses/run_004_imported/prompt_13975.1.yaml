prompt: |-
  I'm writing a historical novel centered on a young Benjamin Franklin, and I'm currently drafting the chapter in which he composes his famous scheme for arriving at moral perfection. Next week I'm interviewing a Franklin scholar, and rather than let her simply recap the thirteen virtues and the tracking chart, which I already know well, I want the conversation to get at his interior life while he was constructing that scheme. Please draft eight to ten interview questions that go beyond that recap and into the real tensions in the project. I want at least one question on whether Franklin's habit of justifying virtue by its usefulness to reputation and business leaves room for any deeper moral seriousness; one on what his own "speckled axe" story implies about whether he privately regarded the scheme as a success or as a dignified retreat from it; one on the irony that Humility was added to the list only after a friend told him he was reputed proud, together with his own wry admission that even mastering humility would probably make him proud of it; and one on how she would situate him between Max Weber's portrait of Franklin as the secularized ancestor of capitalist self-discipline and D. H. Lawrence's contempt for that same virtue list as a cage built around the self. For each question, add a short follow-up keyed to the answer she's most likely to give.
