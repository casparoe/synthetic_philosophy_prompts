answer: |-
  Your intuition is serving you well here. What your husband is doing is a classic example of taking a concept that is valid in one context (therapeutic understanding of emotional dynamics) and misapplying it in a completely different context (legal/ethical accountability for specific actions).

  You are not refusing to accept how shared systems work. He is engaging in a **category error**.

  Here is a breakdown of why his argument doesn't hold water, why the therapist's original stance was still valid, and how you might navigate this in mediation.

  ### 1. Therapy vs. Mediation: Different Goals, Different Rules
  The reason your therapist resisted "fault" was likely because in couples counseling, the goal is usually **change and connection**. Blame is often a dead end in therapy because it makes people defensive. If the goal is to stay together and improve the relationship, identifying a "cycle" (you pursue, he withdraws) is more productive than identifying a "villain." It empowers both parties to change their steps in the dance.

  Mediation, however, is not about healing the relationship; it is about **dissolving it fairly**. The goal is not to change the dynamic, but to assess damages, divide assets, and establish accountability. In a legal or quasi-legal framework, linear causality *does* matter. If someone breaks a contract, it is not a "systemic pattern"; it is a breach.

  ### 2. Circular Dynamics vs. Unilateral Actions
  Systems theory (the "pattern" your therapist described) applies to **interactional loops**.
  *   *Example of a loop:* You feel unheard $\rightarrow$ You raise your voice $\rightarrow$ He feels attacked $\rightarrow$ He shuts down $\rightarrow$ You feel more unheard.
      *   In this scenario, there is no clear start or end. Both parties are actively participating in the dynamic in real-time.

  Hiding money is not an interactional loop. It is a **unilateral, covert action**.
  *   *The act:* He decided to move money. He executed the transfer. He concealed the existence of the account.
  *   *The system:* You cannot have a "pattern" of secrecy if only one person knows the secret. By definition, you were excluded from this part of the system.

  To argue that hiding assets is part of a "shared pattern" is logically inconsistent. You cannot co-create a secret that you were kept from knowing. This isn't a dance; it's a transaction he conducted alone.

  ### 3. Systems Theory Does Not Erase Agency
  A common misunderstanding of systems theory is that it dissolves individual responsibility. It does not. Even in family systems therapy, the concept of **differentiation** is key. This means that while we are influenced by the system, we remain individuals capable of making independent choices.

  Your husband is using "the system" as a determinist excuse—implying that the relationship *made* him hide the money. But adults have agency. He chose deception over communication. He chose secrecy over transparency. Systems theory explains *why* the communication broke down, but it does not excuse the decision to commit financial infidelity.

  ### 4. Why This Feels Like a Sleight of Hand
  It feels like a trick because it is a rhetorical strategy known as **moral equivalence**. He is trying to equate *emotional reactivity* (which is often shared) with *fiduciary breach* (which is individual).

  By invoking the therapist, he is borrowing authority to shut down your valid claim. It puts you in a bind: if you argue against him, you feel like you are arguing against the "truth" of your therapy. If you accept it, you absolve him of the financial breach.

  ### How to Handle This in Mediation
  You do not need to debate systems theory with him. You need to reframe the conversation back to the specific context of mediation.

  *   **Distinguish the Contexts:** You can say, *"I agree that our emotional dynamics were a shared pattern, and that is why we are divorcing. However, mediation is not about our emotional cycle; it is about the division of marital assets. Hiding an account is not an emotional dynamic; it is a factual event regarding property."*
  *   **Focus on Secrecy:** *"A pattern requires two people interacting. I could not interact with an account I didn't know existed. This was a unilateral decision, not a relational pattern."*
  *   **Stick to Fiduciary Duty:** In many jurisdictions, spouses have a fiduciary duty to one another regarding community property. This is a legal standard, not a therapeutic one. *"Regardless of our emotional history, we have a legal obligation to disclose assets. That obligation was breached."*
  *   **Don't Defend the Therapist:** You don't need to prove the therapist wrong. You can acknowledge the therapist was right *for then*, but note that it doesn't apply *to now*. *"The therapist was helping us understand our communication. We are now in mediation to settle finances. Those are different tasks."*

  ### Summary
  Your husband is misusing a legitimate therapeutic concept to dodge accountability.
  *   **Therapy** looks at **process** (how we relate).
  *   **Mediation** looks at **content** (what we have and what we did).

  You are not refusing to see the system. You are correctly identifying that **secrecy breaks the system.** By hiding the money, he stepped outside the "us" to act as an "I." He cannot now claim the protection of the "us" to hide the actions of the "I."

  *Disclaimer: I am an AI assistant and not a lawyer or mediator. This information is for educational and supportive purposes. Please consult with your mediation professional or legal counsel regarding the specific laws and strategies applicable to your divorce.*
