answer: |-
  It is entirely understandable why you read the section that way. Given Turing's reputation as a foundational figure in computer science and a rigorous logician, it feels intuitively correct that he would dismiss parapsychology as statistical noise. In fact, your reading is the one most people *wish* he had taken. It aligns with the modern scientific consensus and Turing's own empiricist persona.

  However, your colleagues in the reading group are correct: your interpretation is the inverse of what Turing actually wrote. The "scandal" historians refer to is not that Turing failed to debunk ESP, but that **he explicitly accepted the statistical evidence for it as convincing** and then attempted to accommodate it within the framework of the Imitation Game.

  Here is a breakdown of where your reading diverges from the text, why scholars find this section problematic, and what Turing was actually trying to achieve.

  ### 1. The Textual Discrepancy: Acceptance, Not Rejection
  The core of the misunderstanding lies in how Turing treats the data from J. B. Rhine's parapsychology laboratory at Duke University.

  You recalled that Turing "finds the statistical case wanting." In the text, however, Turing writes:

  > "One is given to understand that the evidence is overwhelming."

  He does not critique the methodology, the sample sizes, or the possibility of sensory leakage (which a physicist today would immediately scrutinize). Instead, he grants the premise for the sake of argument—or perhaps genuinely believes the statistics warrant it. He continues:

  > "It is assumed... that the statistical evidence, at least for telepathy, is overwhelming."

  For a reader expecting a debunking, this is a shock. Turing, the arch-rationalist, appears to concede that telepathy is a real phenomenon supported by hard data. This is the primary reason historians often label the section a "lapse" or a "curiosity." It dates the paper significantly; in 1950, Rhine's work was famous but increasingly controversial within mainstream physics and psychology. By 2024, treating Rhine's results as "overwhelming" is viewed as a significant error in judgment.

  ### 2. Turing's Actual Argument: Accommodation, Not Elimination
  Since Turing accepts the premise that ESP exists, his goal in the section is not to eliminate the objection but to neutralize its threat to the Turing Test. He argues that even if humans have telepathic powers, it does not prove that machines *cannot* think. He proposes two solutions:

  1.  **The Telepathy-Proof Room:** Turing suggests that if telepathy is real, the interrogation room must be "telepathy-proof." He writes, "In these circumstances [where the human contestant has telepathic powers] it would be necessary to ensure that the 'telepathy-proof' conditions are met." He treats telepathy not as a metaphysical soul-property, but as a signal that can be shielded against, much like radio waves.
  2.  **Machine ESP:** More radically, Turing suggests that if ESP is a physical phenomenon, there is no *a priori* reason a machine could not possess it. He writes:
      > "If telepathy is admitted, it will probably be necessary to tighten up the test... But... there is no more reason to believe that a machine cannot have ESP than that a man cannot."

  This is a crucial philosophical move. Turing refuses to let ESP be a "God in the gaps" argument for human uniqueness. If ESP is real, he argues, it is likely a natural capability that could theoretically be engineered.

  ### 3. Why Scholars View This as a "Scandal"
  Your colleagues likely characterized this as a scandal or something historians "hurry past" for three main reasons:

  *   **Credulity:** It is jarring to see the father of computer science validate claims that most of his scientific peers rejected. It undermines the image of Turing as a purely hard-nosed empiricist.
  *   **Ad Hoc Reasoning:** The solution of a "telepathy-proof room" strikes many philosophers as ad hoc. It complicates the elegance of the Imitation Game. If the test requires shielding against unknown psychic forces to be valid, does that weaken the operational definition of intelligence?
  *   **Distraction:** The section distracts from the main philosophical thrust of the paper. The Turing Test is designed to bypass the question of *internal* states (consciousness, soul, biology) and focus on *external* behavior. By engaging deeply with ESP, Turing briefly re-engages with the idea that humans have special *internal* capacities, only to argue that machines might match them.

  ### 4. Why Your Reading is Understandable
  You should not feel too badly about the misreading. It is a very common one.
  *   **Retrospective Bias:** We know ESP is not considered scientifically valid today. It is natural to assume Turing, a hero of science, must have known that too.
  *   **Tone:** Turing's tone is dismissive of the *importance* of ESP to the argument, even if he accepts the *evidence*. He essentially says, "Even if this magic is real, it doesn't change my conclusion." Readers often conflate dismissing the *relevance* with dismissing the *phenomenon*.
  *   **Philosophical Rigor:** In every other section (The Argument from Consciousness, The Argument from Various Disabilities), Turing is logically airtight. It is cognitively dissonant to accept that he was genuinely swayed by Rhine's card-guessing statistics.

  ### Summary
  Your reading went wrong at the point of empirical evaluation. You assumed Turing acted as a skeptic regarding the Rhine data; in reality, he acted as a pragmatist who accepted the data and sought to engineer around it.

  The philosophers in your group flagged this because it represents a moment where Turing's usual rigor seems to slip, or at least where his definition of "evidence" diverges sharply from modern physics. However, some defenders of Turing argue that this section actually shows *more* rigor: he was willing to consider even the most outlandish objections and demonstrate that they still would not falsify his hypothesis. He treated ESP not as magic, but as a communication channel that could be controlled for—a very engineering-focused approach to a paranormal problem.

  In your next session, you might suggest that while Turing's assessment of the *evidence* for ESP was likely wrong (by modern standards), his *philosophical handling* of it was consistent with his materialist worldview: if it exists, it is physical; if it is physical, it can be measured, shielded, or built.
