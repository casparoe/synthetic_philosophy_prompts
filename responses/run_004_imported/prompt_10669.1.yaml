      *   *But:* "This relies on assumptions about the multiverse that are unproven."
      *   *Conclusion:* "Your friend's point might have been that you should cooperate *more*, but your intuition to just follow your values is safer."

  7.  **Addressing the "Inconsequential" Fear:**
      *   Even if the multiverse is huge, *this* universe is where the child is. *This* universe is where the charities operate.
      *   The "inconsequential" argument is a form of nihilism. Counter it with "Local Consequentialism."

