          *   Maybe she justifies it as "allegory" but feels guilt?
          *   Maybe the "found manuscript" is a plot point she condemns?

  5.  **Refining the Argument (Self-Correction/Deepening):**
      *   *Correction:* I need to be careful not to say Augustine *definitely* hates novels (they didn't exist as such). He talks about poets and plays. I must extrapolate carefully.
      *   *Refinement:* The key is the *signification*. If the signs point to "Truth" but the content is "Invention," is that a lie? Yes, if the intent is to make the listener think it's Truth.
      *   *The "Jest" Angle:* Augustine condemns jokes that deceive. Is immersive fiction a "jest"? If it's meant to be enjoyed as truth temporarily, it's dangerous.
      *   *The "Utility" Angle:* Augustine allows for misleading statements if there is no intent to deceive (e.g., irony where the truth is obvious). But immersive fiction hides the irony.
