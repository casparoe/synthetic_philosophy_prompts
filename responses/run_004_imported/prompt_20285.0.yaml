      *(Refining the Robinson point)*: Robinson accused Nāgārjuna of equivocation on the word "existence." The *prasajya* defense says he isn't equivocating; he's rejecting the framework where "existence" has a fixed meaning.

      *(Refining Priest)*: Priest argues that the *catuṣkoṭi* requires a many-valued logic (like FDE) where truth values can be both true and false. Garfield accepts the logical utility but emphasizes the soteriological goal.

