answer: |-
  This is a sophisticated question that touches on a lively debate in contemporary meta-ethics and epistemology known as the **"Puzzle of Moral Testimony."**

  You are correct that in most domains (science, history, geography), "reductionist" worries about testimony have largely been settled in favor of the view that testimony is a fundamental source of knowledge. If a trusted physicist tells me about black holes, I can claim to *know* about black holes, even if I cannot do the math myself.

  However, many philosophers argue that moral testimony is different. The debate is usually framed between **Optimists** (who think moral testimony can yield knowledge just like scientific testimony) and **Pessimists** (who think there is something defective about relying on moral testimony).

  Here is an analysis of what distinguishes moral facts epistemically and practically, such that testimony faces unique hurdles in the moral domain.

  ### 1. The Distinction Between Knowledge and Understanding
  The most prominent objection (championed by philosophers like Alison Hills) is not that moral testimony cannot give us *true belief*, but that it cannot give us **moral understanding**.

  *   **In Science/Math:** I can know that $E=mc^2$ because Einstein said so. I possess the knowledge, even if I lack the understanding of the derivation. This is epistemically acceptable because the utility of the fact often remains intact without the derivation.
  *   **In Morality:** Moral knowledge seems inextricably linked to the *reasons* for the judgment. If I believe "lying is wrong" solely because my guru said so, I lack a grasp of *why* it is wrong (e.g., because it violates autonomy or causes harm).
  *   **The Epistemic Distinction:** Moral facts appear to be **reason-sensitive** in a way that empirical facts are not. To truly "know" a moral truth, one must grasp the normative reasons that support it. Testimony transmits the *conclusion* but often obscures the *reasons*, leaving the recipient with a "blind" belief that fails to count as robust moral knowledge.

  ### 2. Moral Internalism and Motivation
  A second distinction concerns the relationship between belief and action. This draws on **Moral Internalism**, the view that making a moral judgment is internally connected to being motivated to act on it.

  *   **In Empirical Domains:** Knowing that "arsenic is poisonous" does not necessarily motivate you to do anything unless you have a separate desire (e.g., to stay alive). The fact is inert until paired with a goal.
  *   **In Morality:** Moral facts are often viewed as **practical**. To judge that "I ought to help" is inherently to feel a pull to help.
  *   **The Problem with Testimony:** If I accept a moral truth via testimony (deference), my motivation is second-hand. I am motivated because *you* are motivated, not because I grasp the value myself. Pessimists argue this creates a fragile or defective motivational state. If the testifier changes their mind, my motivation vanishes. Therefore, testimony fails to transmit the *practical force* required for genuine moral knowledge.

  ### 3. Moral Autonomy and Agency
  This objection is less about the *truth* of the proposition and more about the **value of the knower**.

  *   **In Expertise:** Deferring to a doctor is rational. It acknowledges their superior access to evidence.
  *   **In Morality:** Deferring to a "moral expert" feels like an abdication of responsibility. Moral agency requires that we make up our own minds.
  *   **The Epistemic Distinction:** This suggests that moral facts are **agent-relative** in a way scientific facts are not. Part of what constitutes a moral fact is its relation to the agent's own rational will. If you outsource your moral judgment, you are not just gaining knowledge; you are bypassing the very faculty (practical reason) that makes moral knowledge possible. As Robert Hopkins argues, using testimony in morality might be a form of "intellectual cowardice" that undermines the moral worth of the action, even if the action is correct.

  ### 4. The Nature of Moral Disagreement
  Epistemically, testimony relies on the assumption that the testifier is reliable. We establish reliability through convergence and verification.

  *   **In Science:** While scientists disagree, there are established methods (peer review, replication) that eventually converge on truth. We can verify the testifier's reliability against the world.
  *   **In Morality:** Moral disagreement is pervasive, persistent, and lacks a clear method of resolution. There is no "moral meter" to check if your moral guru is actually reliable.
  *   **The Distinction:** This makes the **epistemic justification** for trusting moral testimony much weaker than scientific testimony. Without a clear mechanism to verify the reliability of moral experts, accepting their testimony may not rise to the level of knowledge (justified true belief), but rather remains opinion.

  ### 5. Counter-Arguments: The Optimist View
  To provide a balanced picture, it is worth noting why some philosophers (like David Enoch or Sarah McGrath) defend moral testimony. They argue the distinctions above are overstated:

  *   **Child Development:** Children learn almost all initial moral norms via testimony from parents. If testimony were epistemically bankrupt, moral development would be impossible.
  *   **Complexity:** In complex modern societies (e.g., bioethics, effective altruism), the facts are too complex for individuals to reason through alone. We *must* defer to experts on the consequences of actions, which bleeds into moral judgment.
  *   **Parallel to Law:** We accept legal testimony and judgment constantly. Since law is normatively binding like morality, why is testimony acceptable there but suspect in morality?

  ### Summary: What Distinguishes Moral Facts?
  If the Pessimists are right, moral facts differ from scientific or historical facts in three key epistemic ways:

  1.  **Transparency of Reasons:** Moral truth is not just about the *what*, but the *why*. Testimony hides the *why*.
  2.  **Practicality:** Moral facts are action-guiding. Testimony transmits belief but may fail to transmit the appropriate motivational connection.
  3.  **Agency:** Moral knowledge requires the exercise of personal autonomy. Testimony bypasses autonomy, thereby degrading the quality of the knowledge.

  In short, in science, you can know the *destination* without walking the *path*. In morality, many philosophers argue that knowing the destination *requires* walking the path yourself. Testimony allows you to skip the path, which is why it fails to generate genuine moral knowledge.
