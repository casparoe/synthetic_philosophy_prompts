prompt: |-
  reading Locke's Essay Concerning Human Understanding (Book II, ch. 21, "Of Power") for a seminar and got stuck on the locked-room bit. pasting the actual 17th century text below, caps are his italics:

  8. Liberty, what.
  All the actions that we have any idea of reducing themselves, as has been said, to these two, viz. thinking and motion; so far as a man has power to think or not to think, to move or not to move, according to the preference or direction of his own mind, so far is a man FREE. Wherever any performance or forbearance are not equally in a man's power; wherever doing or not doing will not equally FOLLOW upon the preference of his mind directing it, there he is not free, though perhaps the action may be voluntary. So that the idea of LIBERTY is, the idea of a power in any agent to do or forbear any particular action, according to the determination or thought of the mind, whereby either of them is preferred to the other: where either of them is not in the power of the agent to be produced by him according to his volition, there he is not at liberty; that agent is under NECESSITY.

  10. Belongs not to Volition.
  Again: suppose a man be carried, whilst fast asleep, into a room where is a person he longs to see and speak with; and be there locked fast in, beyond his power to get out: he awakes, and is glad to find himself in so desirable company, which he stays willingly in, i. e. prefers his stay to going away. I ask, is not this stay voluntary? I think nobody will doubt it: and yet, being locked fast in, it is evident he is not at liberty not to stay, he has not freedom to be gone. So that liberty is not an idea belonging to volition, or preferring; but to the person having the power of doing, or forbearing to do, according as the mind shall choose or direct.

  11. Voluntary opposed to involuntary.
  In all these there is want of freedom; though the sitting still, even of a paralytic, whilst he prefers it to a removal, is truly voluntary. Voluntary, then, is not opposed to necessary but to involuntary.

  ok so i get the basic move - the guy stays voluntarily even tho he literally cant leave. but my prof mentioned offhand that this passage basically anticipates Frankfurt cases, decades before Frankfurt's actual 1969 paper attacking the principle of alternative possibilities. can you help with two things: (1) in Locke's own vocabulary, what exactly is "liberty" doing here that's separate from "volition," such that the locked door kills one but not the other? and (2) is the locked-room guy actually doing the same philosophical job as Frankfurt's counterfactual intervener, or is that comparison kind of superficial? my hunch is theres a real difference between "cant act otherwise" and "cant even will otherwise," and that Locke's guy is only missing the first one - but i can't tell if that difference actually matters for what Frankfurt needs his cases to show. curious what you think.
