      *   Use terminology appropriate for a scientist (null hypothesis, falsifiability, confounding variables).
      *   Respect the "Spandrels" paper's status as a landmark while acknowledging its criticisms (e.g., from Dennett, Pinker, Bloom).

  8.  **Self-Correction/Check during drafting:**
