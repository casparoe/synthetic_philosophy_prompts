  2.  **Deconstruct the Argument (Miriam vs. Desmond):**

      *   **Miriam Point 1:** The paper is vindicated by history. Biologists *did* assume traits were adaptations and invent stories without testing rivals (constraints/byproducts). Example: Human chin.
