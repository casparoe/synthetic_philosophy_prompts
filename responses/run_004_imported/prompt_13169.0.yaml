answer: |-
  It is a pleasure to address a colleague who understands the weight of field data and the frustration of grant deadlines. Your reading group has stumbled upon one of the most fertile, yet enduringly messy, debates in the philosophy of biology. The Gould and Lewontin (1979) paper is less a scientific hypothesis and more a methodological manifesto, which is why arguments about it often slide between empirical claims and semantic boundaries.

  Here is an analysis of Miriam and Desmond's exchange, move by move, followed by an assessment of the empirical stakes.

  ### Move-by-Move Analysis

  **1. Miriam's First Claim: Historical Vindication**
  *   **Claim:** Biologists *did* habitually assume traits were adaptations and invent stories without testing rivals (constraints/byproducts). The paper shifted this culture.
  *   **Verdict:** **Miriam is right.**
  *   **Reasoning:** Historically, she is on solid ground. Prior to 1979, the "adaptationist programme" (as Gould and Lewontin termed it) was dominant. It was common to observe a trait, assume it was optimized by natural selection for its current function, and construct a narrative to fit. The paper successfully institutionalized the requirement for a **null hypothesis**. Today, a researcher proposing an adaptive function is generally expected to rule out phylogenetic inertia, developmental constraint, or genetic drift before claiming selection. The human chin example is debatable (see below), but the *methodological* shift Miriam describes is real.

  **2. Desmond's First Counter: The Architectural Disanalogy**
  *   **Claim:** The metaphor fails because architectural spandrels are geometrically *necessary* consequences of the arches, whereas biological byproducts (like the chin) are not proven to be developmentally necessary.
  *   **Verdict:** **Desmond is right about the metaphor, but misses its purpose.**
  *   **Reasoning:** Desmond correctly identifies a disanalogy. In San Marco, the spandrel *must* exist if you build that dome on those arches; there is zero degrees of freedom. In biology, "byproducts" are rarely geometrically inevitable; they are probabilistic outcomes of developmental pathways. However, he may be demanding too much of a heuristic. Gould and Lewontin used the image to illustrate *non-optimality*, not strict geometric necessity. That said, Desmond is correct that labeling a trait a "spandrel" often implies a level of developmental inevitability that hasn't been empirically demonstrated. The human chin, for instance, is not universally accepted as a byproduct; some evidence suggests it is adaptive for resisting mechanical stress during chewing or is a result of sexual selection.

  **3. Desmond's Second Point: Unfalsifiability via Exaptation**
  *   **Claim:** By allowing spandrels to be co-opted later (exaptation), the theory becomes unfalsifiable. Any trait can be labeled an adaptation or a co-opted spandrel post-hoc.
  *   **Verdict:** **Desmond identifies a genuine risk, but Miriam is right that it cuts both ways.**
  *   **Reasoning:** This is the strongest philosophical objection Desmond raises. If the origin of a trait is unobservable (lost to deep time), distinguishing between "selected for X" and "arose as byproduct of Y, then used for X" is notoriously difficult. This creates a "just-so story" risk on the anti-adaptationist side, mirroring the risk on the adaptationist side. However, it is not *strictly* unfalsifiable. If we can show a trait exists in a lineage *before* the ecological pressure for its current function arose, that supports the spandrel/exaptation hypothesis. If the trait arises concurrently with the pressure, adaptation is more likely. Desmond is right that in practice, these lines blur, but Miriam is correct that strict adaptationism suffers the same vulnerability (e.g., claiming a trait is adaptive without evidence of the historical selection pressure).

  **4. Miriam's Rejoinder: Misuse vs. Defect**
  *   **Claim:** Unfalsifiability is a result of careless usage, not a defect in the concept. Also, the metaphor shouldn't be taken literally.
  *   **Verdict:** **Partially right, but defensive.**
  *   **Reasoning:** Miriam is correct that concepts are often misused without invalidating the core theory. However, her defense regarding the metaphor weakens her first claim. If the metaphor is not meant to imply structural necessity (as Desmond argued), then the term "spandrel" loses its distinctive bite and becomes a synonym for "non-adaptive origin." This leads directly to Desmond's final point.

  **5. Desmond's Final Point: Reduction to Truism**
  *   **Claim:** Defending the concept's flexibility reduces the paper's claim to a truism ("sometimes traits aren't for their current use"), which is not what made the paper famous.
  *   **Verdict:** **Desmond is right.**
  *   **Reasoning:** The revolutionary force of the 1979 paper was the claim that *many* traits previously thought to be adaptations are actually structural byproducts. If the defense is merely that "some traits are byproducts," that was never in serious doubt. The paper's impact relied on the stronger claim that adaptationism is a *default bias* that systematically misidentifies byproducts as adaptations. If the criteria for identifying a spandrel are too loose to avoid unfalsifiability, the strong claim collapses into the trivial one.

  ### What Both Are Overlooking

  There are three critical elements missing from their exchange that you, as a physiologist, might find particularly resonant.

  **1. The Shift in Burden of Proof**
  Both Miriam and Desmond treat "Spandrels" as a claim about *what traits are*. In practice, its greatest value is procedural. It shifted the **burden of proof**. Before 1979, the null hypothesis was often "the trait is adaptive." After 1979, the rigorous standard became "demonstrate that selection *could* have acted, and rule out constraints." The dispute isn't just about whether the chin is a spandrel; it's about who has to provide the data.

  **2. The Rise of Evo-Devo**
  Your career in physiology predates the explosion of Evolutionary Developmental Biology ("Evo-Devo") in the 1990s and 2000s. This field provided the mechanistic flesh for Gould and Lewontin's skeletal argument. We now have genetic tools to identify pleiotropy (one gene affecting multiple traits) and developmental constraints. We can sometimes *show* that a trait is a byproduct because the genetic machinery required to separate it from the primary trait would be lethal or prohibitively complex. This addresses Desmond's concern about "necessity." It's not geometric necessity, but genetic/developmental entanglement.

  **3. The Definition of "Adaptation"**
  Much of this argument is verbal. In evolutionary biology, "adaptation" can mean:
  *   **A Process:** The historical action of natural selection.
  *   **A State:** A trait that currently enhances fitness.
  *   **A Verb:** To "adapt" to an environment (phenotypic plasticity).
  Gould and Lewontin were attacking the assumption that *State* implies *Process*. Desmond and Miriam are arguing past each other because they may not be distinguishing between a trait's *origin* (history) and its *maintenance* (current utility). A trait can originate as a spandrel but be maintained by selection (exaptation).

  ### Can This Be Settled Empirically?

  You asked whether this dispute could be settled empirically, or if it is a disagreement about definitions. The answer is **both**, but with a hierarchy.

  **1. It is Semantic at the Boundaries**
  There is no bright line in nature between "adaptation" and "spandrel." Traits exist on a continuum. Some variation is noise, some is constrained byproduct, some is weakly selected, some is strongly selected. Drawing a hard box around "Spandrel" is a categorization problem. If Miriam and Desmond cannot agree on what counts as evidence for a constraint versus an adaptation, they are having a semantic/methodological dispute.

  **2. It is Empirical in Principle**
  However, specific instances *are* empirically testable. You spent your life looking for tests; here is what a test for a "spandrel" looks like in modern biology:
  *   **Phylogenetic Comparative Method:** Did the trait appear before the ecological niche it seems suited for? (e.g., Feathers likely evolved for thermoregulation before flight).
  *   **Developmental Genetics:** Is the trait genetically inseparable from another trait that *is* clearly adaptive? (e.g., If Gene A builds the heart and also causes red blood, red blood might be a spandrel of the heart).
  *   **Cost-Benefit Analysis:** Does the trait impose a cost that selection *should* have removed if it were truly adaptive? (e.g., The recurrent laryngeal nerve's detour in giraffes is a historical byproduct, not an optimal design).

  **Conclusion**
  Miriam is right that the paper successfully corrected a methodological bias in the field. Desmond is right that the specific architectural metaphor is imperfect and that the "spandrel" concept risks becoming a catch-all bucket for traits we don't yet understand.

  The dispute is not ultimately about whether spandrels exist (they do); it is about **parsimony**. Adaptationists argue that selection is the only known process that creates complex functional design, so it should be the default hypothesis. Anti-adaptationists argue that development and history constrain design, so optimality should not be assumed.

  As a physiologist, you would likely side with the view that **mechanism trumps narrative.** If you can demonstrate the developmental mechanism that necessitates the trait (the "arches" causing the "spandrel"), you win. If you can only demonstrate that the trait *looks* useful, you have a hypothesis, not a conclusion. In that sense, Desmond is right to demand rigor, but Miriam is right that without Gould and Lewontin's intervention, biologists might never have started looking for the mechanism in the first place.

  The dispute is settled empirically on a case-by-case basis, but the philosophical war over the "default assumption" remains a productive tension that keeps the science honest.
