          *   *Wait, check Lewis:* Lewis actually tries to handle masks by requiring the *absence* of masks in the ceteris paribus clause, or by defining the basis more narrowly. But standard interpretation is RCA solves Finks, fails Masks. *Correction:* Lewis's specific formulation involves "causal basis." If the mask prevents the basis from causing the manifestation, does RCA fail? Yes. Lewis acknowledges masks are tricky. He suggests the basis must be sufficient *in the circumstances*. But usually, RCA is seen as vulnerable to masks.
