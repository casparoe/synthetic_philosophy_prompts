answer: |-
  This is a fantastic exchange. Kai and Sofia have effectively recreated a debate that occupies some of the brightest minds in contemporary metaethics (specifically between "Evolutionary Debunkers" like Sharon Street and Richard Joyce, and "Moral Realists" like David Enoch and Russ Shafer-Landau).

  The fact that they are stuck is a good sign: it means they have both found strong arguments. In Ethics Bowl, understanding *why* they are stuck is often more valuable than pretending one side "won."

  Here is a move-by-move breakdown of who has the better of the argument at each stage, followed by three considerations neither of them raised that could help your team navigate this terrain.

  ### Part 1: Move-by-Move Analysis

  #### Move 1: The Initial Challenge (Kai)
  **The Claim:** Evolution selects for survival-promoting dispositions, not truth-tracking ones. Therefore, we should doubt our moral convictions track objective facts.
  **Who has the better of it?** **Kai.**
  **Why:** Kai is articulating the core of the **Evolutionary Debunking Argument (EDA)**. The logic is sound: if I can explain why you believe $X$ entirely by referencing your evolutionary history (e.g., "believing $X$ helped your genes survive"), I don't need to posit that $X$ is *true* to explain your belief. This creates an "explanatory gap." If the best explanation for our moral beliefs doesn't require moral facts, our confidence in those facts is undermined. At this stage, Kai has the burden of proof on his side, but he has met it with a plausible naturalistic explanation.

  #### Move 2: The Parity Objection (Sofia)
  **The Claim:** This logic applies to math and logic (ancestors who counted/reasoned well survived), yet we don't doubt $2+2=4$. So why doubt morality?
  **Who has the better of it?** **Sofia.**
  **Why:** This is a classic **"Companions in Guilt"** or **Parity Argument**. It is dialectically very strong because it forces Kai into a corner: either he accepts skepticism about math/logic (which seems absurd and self-defeating) or he must find a *relevant difference* between math and morality. Most philosophers agree that radical skepticism about basic logic is a *reductio ad absurdum* of any argument that leads there. By linking morality to math, Sofia successfully pressures Kai to refine his view.

  #### Move 3: The Truth-Tracking Distinction (Kai)
  **The Claim:** Math *requires* accuracy to be useful (miscounting predators gets you killed). Morality *doesn't* (believing kin matter helps genes even if they don't *objectively* matter).
  **Who has the better of it?** **Kai (with a caveat).**
  **Why:** Kai successfully identifies a **causal disanalogy**. For arithmetic, there is a direct causal link between the *truth* of the belief and the *survival value* of the belief. If $2+2$ actually equaled $5$, counting predators as $2$ would get you eaten. The truth does the work.
  For morality, Kai argues the *feeling* does the work regardless of the truth. If I feel loyalty to my brother, I protect him. This helps my genes. Whether "brothers objectively deserve loyalty" is true or false doesn't change the survival outcome.
  *The Caveat:* Kai is assuming a specific view of moral facts (that they are "queer" or detached from natural properties). If moral facts are natural (e.g., "good" = "conducive to flourishing"), the distinction blurs. But within the context of the debate so far, Kai has successfully parried Sofia's math analogy.

  #### Move 4: The "Begging the Question" Counter (Sofia)
  **The Claim:** Kai assumes there is no fact that makes caring for kin good. If there *were*, evolution would favor it *because* it is true/good. The payoff isn't "either way."
  **Who has the better of it?** **Draw / Slight Edge to Sofia.**
  **Why:** Sofia correctly identifies that Kai is **begging the question** (assuming the conclusion in the premises). Kai claims the survival payoff happens "whether or not" moral facts exist. But Sofia points out: if moral realism is true, it might be *because* caring for kin is objectively good that it leads to survival. In that case, evolution *is* tracking truth.
  Kai's response would have to be: "Even if it is true, evolution selected for the *behavior*, not the *truth*." But Sofia has exposed that Kai cannot use evolution to *disprove* realism without first assuming realism is false. She hasn't proven realism is true, but she has shown Kai hasn't proven it false.

  ---

  ### Part 2: Considerations Neither Raised

  To help your team move past this stalemate, here are three philosophical "tools" neither Kai nor Sofia deployed. Introducing these could help you draft a more nuanced case.

  #### 1. The "Third-Factor" Explanation (David Enoch)
  Kai and Sofia are arguing about whether evolution tracks moral truth directly. A third option is that evolution tracks a **third factor** that is correlated with both survival *and* moral goodness.
  *   **The Argument:** Suppose "survival/flourishing" is itself objectively good (or a necessary condition for it). Evolution selects for traits that promote survival. Therefore, evolution selects for traits that promote the Good.
  *   **Why it helps:** It bridges Kai's gap. It allows you to say: "Evolution didn't select for moral truth *because* it was truth (Kai's worry), nor did it select for truth *independently* (Sofia's worry). It selected for survival, and luckily, survival and moral goodness overlap." This saves moral realism from the debunking argument without denying evolution.

  #### 2. Reflective Equilibrium and Error Correction (Katarina Vavova)
  Kai assumes that because our *starting* intuitions were shaped by evolution, they are permanently tainted. But humans have the capacity for **reflective equilibrium**.
  *   **The Argument:** Evolution gave us rough heuristics (e.g., "protect kin," "punish cheaters"). But we also evolved general reasoning capacities. We can step back and ask, "Does protecting kin make sense if they are abusive?" "Does punishing cheaters make sense if the rule was unjust?"
  *   **Why it helps:** This concedes Kai's point (our raw instincts might be unreliable) but denies his conclusion (therefore we know nothing). We can use reason to "clean up" the evolutionary mess. If we can correct our moral beliefs through reasoning, the evolutionary origin of the *raw material* doesn't matter. This is crucial for Ethics Bowl: it justifies why you can argue for normative positions even if you admit your intuitions have evolutionary baggage.

  #### 3. Naturalistic Moral Realism (Cornell Realism)
  Kai and Sofia seem to assume that for a moral fact to be "objective," it has to be some spooky, non-natural thing floating in the universe (which evolution couldn't track).
  *   **The Argument:** What if moral facts *are* natural facts? For example, "Suffering is bad" might be identical to "Suffering reduces an organism's flourishing." Since evolution definitely tracks facts about flourishing, it *is* tracking moral facts, just under a different name.
  *   **Why it helps:** This collapses Kai's distinction between math and morality. If moral facts are natural facts about well-being, then evolution tracks them for the exact same reason it tracks math: because getting the facts right helps you survive. This undermines the "explanatory gap" Kai relies on.

  ### Advice for Your Case Drafting

  Since you are preparing for Ethics Bowl, here is how to operationalize this:

  1.  **Don't get bogged down in Metaethics:** Judges usually care more about *normative* ethics (what should we do?) than *metaethics* (what is the status of moral claims?). You don't need to solve the EDA to win.
  2.  **Use the "Reflective Equilibrium" Move:** If an opponent tries to use an EDA against you (e.g., "You only believe equality is good because of evolution/culture"), you can concede that your *intuitions* have historical causes but argue that your *reasoned conclusions* stand on their own merits.
  3.  **Acknowledge the Tension:** A case that says, "We know evolution biases us toward kin, which is why we must work *extra* hard to be impartial," shows more sophistication than a case that ignores the bias entirely.

  **Summary Verdict:** Kai wins on the mechanism of evolution (it selects for fitness, not truth). Sofia wins on the implications (we can't be skeptics about everything). The tie-breaker lies in **Third-Factor** or **Naturalistic** explanations, which suggest fitness and truth might be allies rather than enemies.
