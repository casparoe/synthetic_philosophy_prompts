  ### The Referee's Breakdown

  This is a classic debate in statistics: **Frequentist Error Control (Dan)** vs. **The Likelihood Principle (Priya)**. Since they are using p-values (a frequentist tool), Dan has the stronger technical case, but Priya touches on a genuine philosophical paradox that even statisticians argue about.

  Here is the point-by-point reasoning:

  #### Point 1: Dan's Claim on Peeking
  **Score: 2 (Clearly Right)**
  Dan is correct regarding standard frequentist statistics. A p-value assumes a fixed sample size determined *before* data collection. Every time Priya checked the data, she effectively performed a hypothesis test.
  *   **The Math:** If you test once at 5% significance, you have a 5% chance of a false positive. If you test five times (once per day), the probability that *at least one* of those tests yields a false positive accumulates. It doesn't add up linearly (5% + 5%...), but it does inflate significantly (roughly 1 - 0.95^5 ≈ 22%).
  *   **The Verdict:** By checking daily and stopping when significant, she invalidated the mathematical guarantee that p < 0.05 implies a 5% false-positive rate. The real rate is much higher.

  #### Point 2: Priya's Claim on "The Data is the Data"
  **Score: -1 (Mostly Wrong in this Context)**
  Priya is invoking the **Likelihood Principle**, which states that all evidence in a sample is contained in the likelihood function. In a Bayesian framework, she would be right: if you update your beliefs based on the data you have, it doesn't matter when you stopped collecting it.
  *   **The Problem:** They are not using Bayesian statistics; they are using p-values. A p-value is *not* a measure of the evidence in the data alone; it is a measure of how extreme the data is compared to a hypothetical distribution of *all possible experiments* that could have been run under the null hypothesis.
  *   **The Verdict:** Because the p-value calculation depends on the "space of possible experiments," and peeking changes that space (by allowing early exits), the p-value *does* change meaning even if the raw numbers don't. She is applying Bayesian logic to a Frequentist metric.

  #### Point 3: Dan's Claim on Procedure vs. Dataset
  **Score: 2 (Clearly Right)**
  This is the precise definition of a frequentist p-value. It is a property of the **testing procedure**, not the specific dataset.
  *   **The Analogy:** Imagine a basketball player who makes 9 out of 10 shots.
      *   Scenario A: They planned to shoot 10 times.
      *   Scenario B: They planned to shoot until they missed one.
      *   The data (9 makes, 1 miss) is identical. But in Scenario B, getting 9 makes in a row is much less surprising than in Scenario A. Therefore, the statistical significance differs.
  *   **The Verdict:** Dan correctly identifies that a policy of "peek until significant" creates a procedure that will eventually find significance even in pure noise. The p-value of 0.03 cannot be trusted because the procedure used to generate it is biased toward finding significance.

  #### Point 4: Priya's Claim on Intent and Deadlines
  **Score: 0 (Philosophically Interesting, Practically Weak)**
  Priya raises a famous paradox (often attributed to statistician Dennis Lindley): *Why should the state of the analyst's mind change the physical reality of the data?*
  *   **The Nuance:** In strict frequentist theory, the "stopping rule" is part of the experimental design. If Priya truly would have stopped on Friday *regardless* of the p-value, Dan would be wrong. However, Priya admitted she "stopped on day 4, right when it crossed." This implies the data *did* influence the stopping time, making it "optional stopping."
  *   **The Verdict:** Her philosophical point is valid (it is weird that intent matters), but her defense is contradicted by her own actions. If the deadline was the only factor, she would have waited until Friday. Since she stopped early *because* the number looked good, the stopping rule was data-dependent, and Dan's critique stands.

  ### What Both of Them Are Missing

  While Dan wins the technical argument, this standoff highlights process failures that both of them are ignoring:

  1.  **Sequential Testing Methods:** There are established statistical methods designed exactly for this scenario (peeking at data over time). Techniques like **Alpha Spending Functions** or **Sequential Probability Ratio Tests (SPRT)** allow you to check data daily without inflating the false-positive rate. If Priya had used these, Dan wouldn't have a leg to stand on.
  2.  **Bayesian A/B Testing:** Many modern engineering teams have moved to Bayesian methods for this exact reason. In a Bayesian framework, Priya is actually right: you can check the probability of the new design being better every day, and stop whenever you feel the risk is low enough. The "stopping rule" doesn't break the inference.
  3.  **Pre-registration:** The root cause here is a lack of a pre-experiment plan. A simple document stating "We will run this for 5 days or until N visitors, whichever comes first, and we will not check significance before then" would have prevented the ambiguity.
  4.  **Effect Size vs. Significance:** They are fixated on the p-value (0.03). They should be looking at the **confidence interval** of the lift. If the lift is 0.1% with p=0.03, it might be statistically "significant" (even with correction) but practically useless. If the lift is 10%, the statistical quibbling matters less.

  **Recommendation:** Side with Dan on the validity of *this specific test* (the result is likely inflated), but side with Priya on the need for better tools (Sequential or Bayesian) so the team doesn't have to have this argument again.
