answer: |-
  The popular slogan that quantum mechanics is "nonlocal" is a useful shorthand, but it is philosophically imprecise. It suggests a singular violation of a monolithic principle, whereas the logical architecture of Bell's theorem is far more granular. As the decomposition by Jarrett and Shimony clarifies, the condition colloquially known as "locality" is a conjunction of two distinct probabilistic constraints: Parameter Independence (PI) and Outcome Independence (OI). A third, often tacit assumption is Measurement Independence (MI), or "free choice." Bell's inequality follows only if all three hold. The loophole-free experiments of 2015 confirmed that nature violates the inequality, forcing us to abandon at least one of these premises. This is not merely a technical adjustment; it is a menu of metaphysical commitments, each with a distinct price tag.

  To determine what Bell's theorem actually establishes about the physical world, we must weigh the cost of each escape route. While the temptation to preserve a classical intuition of locality is strong, a rigorous assessment reveals that the most defensible verdict is that **Bell's theorem establishes a fundamental ontological holism, requiring us to abandon Outcome Independence while preserving Parameter Independence and Measurement Independence.** This position, aligned with orthodox quantum mechanics, accepts that spatially separated systems can constitute a single, non-separable reality. It is superior to the alternatives because it preserves the integrity of scientific inference, respects the spirit of relativistic causality, and avoids ontological profligacy.

  The first option to discard is superdeterminism. This strategy preserves both PI and OI (and thus a robust form of local realism) by denying Measurement Independence. It posits that the hidden variables determining the particle pair's state are correlated with the experimenters' future choices of measurement settings, presumably due to a common cause in the distant past. While logically consistent, the cost is catastrophic for the methodology of science. Scientific experimentation relies on the assumption that test conditions can be varied independently of the system under test. If the "choice" of a measurement setting is causally conspired to match the state of the particles to hide the underlying local variables, then no experimental result can ever be trusted to reveal a law of nature rather than a pre-arranged correlation. Superdeterminism saves locality only by sacrificing the rational basis of empirical inference. It is a solution that preserves the letter of local realism by destroying the spirit of scientific realism.

  The second option is Bohmian mechanics. This theory preserves Outcome Independence and Measurement Independence but explicitly violates Parameter Independence. In the de Broglie-Bohm pilot-wave theory, the velocity of a particle depends instantaneously on the positions of all other particles in the universe, mediated by the wave function. If an experimenter changes a setting on one wing of the experiment, the guidance equation for the distant particle changes immediately. This is explicit, faster-than-light causation. While Bohmian mechanics is empirically equivalent to standard quantum mechanics and solves the measurement problem by providing a deterministic ontology, it sits uneasily with Special Relativity. To make sense of the instantaneous dependencies, the theory requires a preferred frame of simultaneity. Although this frame is empirically inaccessible (ensuring no signaling), its existence contradicts the relativistic insight that no such preferred frame exists. Bohmian mechanics saves determinism and outcome independence at the cost of demoting relativity from a fundamental symmetry to an emergent conspiracy.

  The third option is the Many-Worlds Interpretation (MWI). Proponents argue that MWI is the only strategy that remains fully local. By rejecting the assumption that measurements yield single, determinate outcomes, MWI retains unitary, local dynamics. The wave function evolves locally; correlations arise because the observers and particles become entangled in a global superposition. There is no collapse, and thus no "action at a distance." However, this locality is purchased with two significant debts. First is ontological bloat: the theory requires the literal existence of a branching multiverse of macroscopic proportions. Second, and more damaging, is the probability problem. If all outcomes occur, it is difficult to make sense of the Born rule probabilities without circular reasoning or additional decision-theoretic axioms. Explaining why we observe frequencies matching quantum probabilities, rather than simply observing everything, remains unfinished business. MWI saves locality by dissolving the uniqueness of events, but in doing so, it complicates the link between the formalism and empirical experience.

  This leaves the fourth strategy: the orthodox view, which retains Parameter Independence and Measurement Independence but abandons Outcome Independence. This is the verdict that Bell's theorem, properly understood, compels us to accept. By violating Outcome Independence, we acknowledge that the probability of an outcome on one wing depends on the outcome of the other, even when conditioned on the complete quantum state. This is not "spooky action" in the sense of a signal traveling between the wings (which would violate PI and relativity); rather, it is a signature of **non-separability**.

  The cost of this view is the abandonment of the classical intuition that spatially separated objects possess independent physical states. In orthodox quantum mechanics, an entangled pair is not two objects with correlated properties; it is a single object described by a non-factorizable wave function. When we measure one part, we are not influencing the other part across space; we are updating our knowledge of the whole system. This preserves Parameter Independence, meaning the no-signaling theorem holds, and relativistic causality is respected at the level of observable information transfer.

  Critics argue that this view is incomplete because it offers no mechanism for the correlation. However, demanding a mechanism presupposes that the world *should* be separable. Bell's theorem suggests it is not. To insist on a mechanism is to yearn for the hidden variables of Bohm or the conspiracies of superdeterminism. By accepting the violation of Outcome Independence as a brute fact of nature, we accept that holism is a fundamental feature of the physical world. This is a metaphysical shift, but it is less destructive than the alternatives. It does not undermine the scientific method (like superdeterminism), it does not require a preferred frame (like Bohm), and it does not require an infinite multiplicity of worlds (like MWI).

  Therefore, the specific verdict established by Bell's theorem and its experimental confirmation is that **nature is locally causal in terms of signaling (Parameter Independence holds) but non-separable in terms of ontology (Outcome Independence fails).** The "nonlocality" of quantum mechanics is not a transmission of influence across space, but a reflection of the fact that space does not divide reality into independent parts as classical physics assumed.

  We must conclude that the search for a "local hidden variable" theory is a search for a ghost. The 2015 experiments closed the loopholes, and the logical decomposition closes the interpretive escape hatches. Superdeterminism is self-defeating, Bohmian mechanics is relativistically awkward, and Many-Worlds is ontologically extravagant. The most rational response is to accept the orthodoxy refined by Bell: the universe is not a collection of local bits, but a web of holistic relations. We must abandon the idea that physical reality is composed of independent, localized elements, and accept that at the fundamental level, the world is one inseparable whole. This is the true moral of Bell's theorem: not that action is spooky, but that separability is an illusion.
