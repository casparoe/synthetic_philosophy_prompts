answer: |-
  This is a classic pressure point, but you're right that the "bite the bullet" response feels like a concession. It admits that the theory fails to capture a central intuition (that Swampman's heart *works* and can *fail*).

  To defend the etiological view without dismissing the intuition, you need to shift the locus of the "history" from the **specific token** (this particular lump of carbon) to the **biological type** (the structural pattern).

  Here is the strongest etiological case that doesn't require swallowing the bullet: **The Type-Token Inheritance Argument.**

  ### 1. Functions attach to Types, not just Tokens
  Strict etiological accounts (like Millikan's) are often read as saying: *"This specific heart has a function only if this specific heart's ancestors were selected."* That is what leads to the Swampman failure.

  But a more robust etiological view argues that selection acts on **phenotypic patterns** (types), not just individual material tokens. Evolution selects for a *design*. When we say "the function of the heart is to pump blood," we are making a claim about the *kind* "Human Heart," which is defined by its selective history.

  **The Move:** Swampman's heart is a **token** of the **type** "Human Heart." The *type* has a rich etiological history. The token inherits the functional properties of the type by virtue of instantiating that type, even if the token's own genesis was accidental.

  **Why this isn't Cummins:** Cummins says history is irrelevant *in principle*. This argument says history is essential *to the definition of the type*, and Swampman counts as a member of that type because he is structurally isomorphic to the lineage. The history is still doing the work of grounding the normativity; Swampman is just "borrowing" it via structural identity.

  ### 2. The "Software" Analogy
  Think of a biological trait like a piece of software code.
  *   **Etiological Claim:** The code has the function "to calculate taxes" because it was written and selected by developers for that purpose.
  *   **Swampman Case:** A lightning strike arranges magnetic particles on a hard drive to perfectly duplicate that code.
  *   **The Question:** Does this new file have the function "to calculate taxes"?

  If you say "no," you're saying function is about the *causal origin of the matter*. If you say "yes," you're saying function is about the *informational structure that was selected*.

  The etiological theorist can argue that natural selection is an information-processing system. It selects *information* (genetic/phenotypic patterns). Swampman is a spontaneous instantiation of that selected information. The "history" is attached to the **pattern**, not the substrate. Since Swampman instantiates the pattern, he inherits the etiological function. This preserves the core etiological insight (function comes from selection) without requiring a literal genealogical chain for every single atom.

  ### 3. The Normativity Argument (The Knockout Punch)
  The main advantage of the etiological view over Cummins is **normativity**. Cummins can explain what a heart *does*, but he struggles to explain what a heart is *supposed to do* (i.e., malfunction). A Cummins-heart that doesn't pump is just a heart with a different causal role. An Etiological-heart that doesn't pump is *broken*.

  **The Argument:**
  1.  Swampman's heart can malfunction (it can have a heart attack, fail to pump, etc.).
  2.  Malfunction presupposes a norm (a "should").
  3.  The only non-mystical source of biological norms is etiological history (what the trait was selected to do).
  4.  Therefore, Swampman's heart must have etiological history (or access to it) to ground the possibility of malfunction.
  5.  Since Swampman is structurally identical to us, he falls under the same **species-level norms**.

  The etiological theorist argues that norms are properties of the **lineage**, and Swampman, by virtue of being a perfect duplicate, is immediately subject to the normative regime of that lineage. He is a "lineage starter." To deny him function is to deny him the possibility of malfunction, which is absurd. Therefore, the etiological account must accommodate him—not by abandoning history, but by recognizing that **history establishes the norms for the *kind*, and Swampman is a member of the *kind*.**

  ### Summary for your piece
  Don't frame it as "Intuitions vs. Theory." Frame it as **"Token History vs. Type History."**

  The etiological account isn't embarrassed by Swampman if it treats function as a property of **biological kinds** established by selection, which individual tokens instantiate. Swampman's heart has a function not because *it* was selected, but because it is a perfect copy of a structure that *was* selected, and it immediately enters the normative space (malfunction/success) that selection created.

  This lets you keep the etiological commitment (history grounds norms) without the absurdity (Swampman's heart is functionless). The history is in the **blueprint**, and Swampman was built from the blueprint.
