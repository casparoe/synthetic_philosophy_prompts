  **Justifications:**

  *   **Move 1 (Theo):** **1 (Strong).** Theo accurately articulates the internal logic of Nozick's proposal. Grounding side-constraints in rational agency is a standard Kantian move and provides a non-arbitrary *theoretical* distinction, even if its practical application is contested.
  *   **Move 2 (Naomi):** **2 (Very Strong).** Naomi deploys the classic "Argument from Marginal Cases." This is widely considered the most potent objection to capacity-based moral exclusions, as it exposes that the proposed criterion (agency) does not align with our considered judgments about vulnerable humans.
  *   **Move 3 (Theo):** **0 (Toss-up).** The "species-norm" defense is a recognized philosophical counter-move (e.g., Carl Cohen), but it is deeply controversial. It saves logical consistency only by relying on a metaphysical claim about "kinds" that many argue is biologically arbitrary or morally irrelevant, making it a stalemate rather than a victory.
  *   **Move 4 (Naomi):** **2 (Very Strong).** Naomi shifts from boundary-drawing to the *substance* of the theory. She correctly notes that Nozick's own metaphysical objection to utilitarianism (that it ignores the separateness of individuals) applies to sentient animals just as it does to humans, undermining the moral coherence of the "animal utilitarianism" half of the proposal.

  **What Both Are Missing:**

  1.  **Nozick's Own Ambivalence:** Both treat the proposal as a settled position to defend or attack, but Nozick explicitly floated it as a *problem* he couldn't solve, not a view he endorsed. He remained uneasy about whether we are entitled to treat animals as means at all.
  2.  **Weighted Utilitarianism:** Nozick suggested a potential patch neither friend mentioned: animal suffering might count for *more* in the utilitarian calculus than human pleasure to compensate for the lack of rights. This could prevent the "arbitrarily severe suffering" Naomi fears without granting full side-constraints.
  3.  **Graded Moral Status:** The debate assumes a binary (Kantian rights vs. Classical Utilitarianism). Both miss intermediate frameworks, such as Tom Regan's "subject-of-a-life" criterion or Martha Nussbaum's capabilities approach, which grant protections based on sentience and flourishing without requiring full rational agency.
  4.  **Separateness of Sentient Beings:** Naomi touches on this, but the deeper point is that if the metaphysical error of utilitarianism is merging distinct existences, that error persists regardless of agency. Sentient animals have distinct lives to lose, which suggests the "utilitarianism for animals" half fails on the same grounds as utilitarianism for humans.
