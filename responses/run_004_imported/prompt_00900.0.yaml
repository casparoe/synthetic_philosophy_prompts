      *   *The "Indirect Duty" View:* We shouldn't be cruel to animals because it dulls our *humanity* (Menschheit), making us more likely to be cruel to humans.
      *   *The Criterion:* It's not about *sentience* (pain/pleasure) or even *intelligence* (problem-solving). It's about *Wille* (rational will) and *Autonomy* (giving oneself the moral law).
