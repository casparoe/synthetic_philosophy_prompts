      *   *Geometric Rationality (Garrabrant):* Focuses on the algebra of decisions. Arithmetic rationality = adding values (EUT). Geometric rationality = multiplying values (odds, likelihoods). Kelly, Bayes, and Nash Bargaining all share a geometric structure (product of terms vs. sum of terms). It's about the *structure of aggregation*, not just utility.
      *   *Samuelson's Critique:* Paul Samuelson wrote "The 'Fallacy' of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling" (1971). He argued that for finite horizons, log utility isn't magically optimal unless you actually have log utility.
      *   *Synthesis:* The conflict is between *axiomatic preference* (EUT) vs. *dynamic necessity* (Ergodic/Geometric).

