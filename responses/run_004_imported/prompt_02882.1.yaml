      *   **Background:** The user understands Kelly betting mechanics (edge/odds, log wealth maximization) and uses it in a sports-betting bot.
      *   **The Confusion:** They are encountering "Geometric Rationality" (Garrabrant/LessWrong) and "Ergodicity Economics" (Ole Peters). Both claim Kelly/log-growth is a *fundamental alternative* to Expected Utility Theory (EUT), not just a special case (log utility within EUT).
      *   **The Core Question:** Isn't maximizing $E[\log(W)]$ just EUT with log utility? Why do these camps claim it's a rival paradigm?
      *   **Specific Requests:**
