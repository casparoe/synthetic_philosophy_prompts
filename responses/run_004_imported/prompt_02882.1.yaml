prompt: |-
  So I've fallen down a rabbit hole reading about Kelly betting. I actually use Kelly sizing in a little sports-betting bot I wrote as a side project, so I'm fine with the actual mechanics (edge/odds, maximize log wealth, all that). What's throwing me off is this stuff people call "geometric rationality." I stumbled on a LessWrong sequence by a guy named Garrabrant that treats Kelly betting, Nash bargaining, Thompson sampling, and even Bayesian updating as all being instances of the same underlying "geometric" alternative to normal expected-value rationality. Separately theres Ole Peters and the "ergodicity economics" crowd, who argue something that sounds similar but comes at it from a physics angle about ensemble averages vs time averages. Both camps seem to imply this is a genuinely different foundation for rationality, not just "expected utility theory, except you picked log as your utility function."

  That's the part I can't wrap my head around, and I never took any formal philosophy or decision theory courses so maybe I'm missing something obvious. Isn't maximizing E[log(wealth)] just a special case of plain old expected utility maximization with a concave utility function? Von Neumann and Morgenstern's setup already lets you pick whatever utility function you want, log included, so why do these people talk like Kelly/geometric reasoning is a rival paradigm to expected utility theory instead of a special case that lives inside it? I vaguely remember reading that a famous economist (Samuelson maybe?) wrote a whole paper trashing Kelly-criterion fans using only one-syllable words back in the 70s or 80s, so apparently smart people have been fighting about this for decades -- its not just an internet forum thing.

  Could you actually unpack what's substantively at stake here? I want the strongest version of the "geometric rationality really is different" position (the Garrabrant angle and the Peters angle, and whether those two even agree with each other), plus the best rebuttal a standard expected-utility theorist would give. And if you had to bet on it (pun intended), where do you personally land -- is there real philosophical daylight between the camps, or is everyone kind of talking past each other using different vocab for the same underlying math?
