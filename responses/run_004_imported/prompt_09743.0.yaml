answer: |-
  The rain blurred the cab windows, turning the streetlights into smeared oranges. Inside, the silence was heavy with the exhaustion of the workshop.

  "You're quiet, Elena," Marcus said, loosening his tie. "I thought you'd have more to say about the Double Effect session. I tried to give the charitable reading for Truman."

  "You gave a coherent reading," Elena replied, watching the rain. "But coherence isn't truth. You argued that the civilian deaths were foreseen but unintended side effects of destroying industrial capacity. That's the standard DDE move. But it collapses under the specific mechanics of the atomic bomb."

  "Does it?" Marcus leaned forward. "Anscombe insists the killing must be intended as a *means*. My point is that the means was the destruction of Hiroshima's function as a military hub. The deaths were a tragic, foreseen consequence of that destruction, not the tool itself. If I bomb a munitions factory and the workers die, I haven't murdered them. I've destroyed the factory; their death was collateral."

  "But Hiroshima wasn't a factory," Elena said, turning to him. "It was a city. The weapon's design guarantees indiscriminate death. When the target selection committee chose a 'vital war plant employing 10,000 workers' surrounded by workers' houses, they knew the blast radius would consume the houses *because* of the yield. You can't separate the destruction of the plant from the death of the workers when the method is vaporization."

  "Intent isn't about precision," Marcus countered. "It's about the plan. The plan was to remove Japan's capacity to fight. The psychological shock to the government was derived from demonstrating that capacity could be removed anywhere. The civilian deaths contributed to the shock, yes, but the *mechanism* of surrender was the realization of military vulnerability, not the corpse count itself."

  "That's where I lose you," Elena said sharply. "Why did the shock work? Was it because a factory was gone? Or because 70,000 people vanished in an instant? If the government surrendered because they were terrified of further carnage, then the carnage was the means. You used the death of the innocent to coerce the state. That fits Anscombe's definition of murder perfectly. You made their death the argument."

  Marcus rubbed his chin. "You're conflating the *effect* with the *intention*. Just because the deaths caused the surrender doesn't mean the deaths were intended *as* the cause. The intention was to demonstrate power. The deaths were the evidence of that power, not the instrument. Think of it like sinking a battleship. You kill the crew to sink the ship. Here, you destroy the city to sink the war effort. The deaths are inherent to the destruction, not selected for their own sake."

  "But Anscombe would say you *did* select them for their own sake," Elena pressed. "If you could have destroyed the city's function without killing the civilians, would you have? With conventional bombing, maybe. But with the A-bomb? The value of the weapon *was* its efficiency at killing and destroying simultaneously. To intend the use of that weapon is to intend the mass death. You can't hide behind 'collateral damage' when the damage is the primary feature of the tool."

  "That assumes the only feature was death," Marcus said. "The feature was energy release. Heat, blast, radiation. The death was a result of the physics, not the moral aim. The moral aim was ending the war without an invasion. If the DDE holds anywhere, it should hold here: the act (striking a military target) is neutral; the bad effect (civilian death) is not intended; the good effect (surrender) is not produced *by* the bad effect, but by the destruction of capacity."

  "But is the surrender produced by the destruction of capacity?" Elena asked softly. "Or by the terror of the destruction? If the Japanese leadership surrendered because they feared their people would be annihilated, then the annihilation is the lever. You pulled the lever. Anscombe's point is that you cannot use the innocent as the lever. It doesn't matter if the lever is made of flesh or steel. If you crush the flesh to move the state, you've chosen killing as a means."

  Marcus looked out the window. "So there's no distinction between targeting a munitions worker and targeting a child in this framework? Because the weapon is too blunt?"

  "There's a distinction in conventional war," Elena said. "In total war with indiscriminate weapons, the distinction dissolves. Anscombe isn't arguing about the bluriness of the target. She's arguing about the structure of your will. If your strategy relies on the horror inflicted on the innocent to break the enemy's will, you have intended that horror. You might not desire it emotionally, but you chose it volitionally as the path to victory."

  "And I'm saying the path was the removal of industrial capability," Marcus insisted. "The horror was just the smoke coming off the track."

  "The smoke was the point, Marcus," Elena said, as the cab slowed. "Because without the smoke, the signal isn't sent. And the smoke is made of people."

  Marcus sighed, reaching for his wallet. "Then we agree on the facts. We just disagree on whether those facts constitute a means or a side effect."

  "No," Elena said, opening the door. "We disagree on whether you're allowed to count the side effect as irrelevant when the side effect is the only thing everyone remembers."
