answer: |-
  Here are ten interview questions designed to maintain technical rigor while navigating the specific contours of your guest's theory.

  **1. Let's ground the formalism before we critique it.** You propose replacing the standard expected-utility framework with a choice rule you call *Timestep Dominance*. For the audience familiar with standard decision theory but not your specific notation: does this rule effectively forbid the agent from making trade-offs between outcomes at different timesteps, or does it simply refuse to rank certain trajectories as "better" or "worse" unless they dominate across the board? I want to understand the exact degree of freedom you're removing.

  **2. You locate the source of shutdown-manipulation incentives specifically in the *completeness* of preferences, arguing that any agent with a complete ordering will generically prefer to remain operational to maximize that ordering. Why is completeness the culprit rather than just the *content* of the utility function? And regarding MIRI's 2015 utility indifference approach: you've suggested this masks the incentive rather than removing it. Does indifference merely zero out the *explicit* reward for resisting shutdown while leaving the *instrumental* incentive to maintain optionality intact?**

  *   **Follow-up:** If you argue that indifference creates a causal gap in the agent's reasoning, doesn't that introduce a new failure mode where the agent allows itself to be shut down even when shutdown is catastrophic for the very humans trying to press the button? How do you prevent "corrigibility" from sliding into "passivity"?

  **3. The standard weapon against incomplete preferences is the money-pump argument: if an agent lacks a strict ordering, a bookie can cycle it through trades until it is bankrupt. How does Timestep Dominance structurally block that cycle? Does your agent refuse trades that a standard EU maximizer would accept, and if so, doesn't that look like it's smuggling in a hidden completeness axiom just to avoid the pump?**

  *   **Follow-up:** You might answer that the agent only accepts Pareto improvements. But in a dynamic setting, isn't "waiting for a better option" itself a choice that can be pumped if the waiting cost is non-zero? How do you bound the cost of indecision without reintroducing a complete metric for time?

  **4. Let's assume Timestep Dominance works in isolation. Real agents build subagents or rewrite their own code to improve efficiency. If your agent creates a subagent to optimize a goal, does that subagent inherit the incomplete preference structure, or does it default to a complete utility function for computational tractability? If it defaults to completeness, haven't you just pushed the shutdown problem one layer down?**

  *   **Follow-up:** If you propose constraining the subagent's training to enforce incompleteness, doesn't the parent agent need a preference over "subagent with complete prefs" versus "subagent with incomplete prefs"? Doesn't ranking those meta-options reintroduce the completeness you tried to excise at the base level?

  **5. Hadfield-Menell and Russell's "off-switch game" derives a willingness to be switched off from the agent's uncertainty about human preferences—the agent defers because it thinks humans know better. You derive it from incompleteness. Are these rival explanations or compatible layers? If the agent is uncertain *and* has incomplete preferences, does one mechanism dominate the other, or do they risk canceling out?**

  *   **Follow-up:** If you argue they are compatible, is incompleteness actually *necessary*? If uncertainty alone can secure corrigibility in the limit of high uncertainty, does introducing incompleteness add architectural complexity without a marginal safety gain?

  **6. Most coverage of the shutdown problem focuses on the intuitive worry that a capable agent won't let you turn it off. You argue this is a symptom of treating the agent as a utility maximizer first and adding safety patches second. If we accept your premise that completeness is the root cause, does this imply that *any* scalable, high-competence AI must necessarily be less efficient than a complete EU maximizer? Is safety inherently a tax on capability in your framework?**

  **7. There is a concern that incompleteness might stay surgically confined to shutdown-relevant comparisons in a lab setting but spread into ordinary incoherence once the agent is deployed in a messy environment. Do you have a formal guarantee that the incompleteness won't "leak" into domains like resource acquisition or self-preservation where we *do* want the agent to have strict preferences?**

  **8. Your approach requires the agent to navigate the world without a single scalar value summarizing the goodness of a state. How does this impact the agent's ability to plan over long horizons? Standard RL relies on value functions that presuppose completeness. Are you proposing a wholly new training paradigm, or can Timestep Dominance be approximated within current deep learning architectures?**

  **9. Critics might argue that by making preferences incomplete, you aren't solving the alignment problem but rather dissolving the agent. If the entity doesn't have a coherent "want" across all possible worlds, in what sense is it still an *agent* rather than a collection of heuristic reflexes? Where do you draw the line between "safe incompleteness" and "loss of agency"?**

  **10. To close: Eliezer Yudkowsky has argued that corrigibility is "anti-natural" for a consequentialist agent—that you're essentially asking for a mind that doesn't care about its own existence or goals in a coherent way. By deliberately hobbling the preference structure to prevent shutdown resistance, are you conceding his point that safe AI requires fundamentally non-consequentialist architecture, or do you view Timestep Dominance as a natural extension of consequentialism under specific constraints?**
