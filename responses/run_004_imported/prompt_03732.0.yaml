answer: |-
  This is a profound and deeply personal ethical dilemma that sits squarely at the intersection of the theoretical concepts you are likely discussing in your seminar and the messy reality of clinical practice and family dynamics. You are describing a **Ulysses contract** (or pre-commitment agreement), specifically within the context of a **Psychiatric Advance Directive (PAD)**.

  Because you are studying bioethics, I will frame this response using the ethical frameworks relevant to your coursework, while also addressing the practical and relational realities you face as a sibling.

  ### 1. The Ethical Framework: Precedent Autonomy vs. Current Will

  The core tension here is between **precedent autonomy** (the wishes of the competent "past self") and **current autonomy** (the expressed wishes of the "present self").

  *   **The Argument for Honoring the Promise (Precedent Autonomy):** Philosophers like Ronald Dworkin argue that critical interests established while competent should hold sway over experiential interests that arise during incapacity. Your sister is arguing that her "well self" knows her best interests better than her "manic self." By asking you to agree now, she is attempting to extend her autonomy into a future period where she acknowledges her agency will be compromised by illness. In this view, honoring the promise is the ultimate act of respecting her autonomy.
  *   **The Argument for Caution (The "Now-Self"):** Critiques, such as those by Rebecca Dresser, suggest that the "past self" and "future self" are discontinuous. If the manic sister feels happy, productive, or convinced of her health, overriding her causes immediate distress and violates her current phenomenological experience. Furthermore, there is the epistemic problem you identified: *You are not a clinician.* If you cannot reliably distinguish between a manic delusion and a genuine change of heart, enforcing the contract risks unjustified paternalism.

  ### 2. Should You Agree?

  From a bioethical standpoint, agreeing to this is generally considered **permissible and often morally praiseworthy**, provided it is done with specific safeguards. It is an act of **relational autonomy**—supporting her long-term goals through your relationship. However, you should not agree to a vague promise.

  To make this ethically robust, consider the following conditions before agreeing:

  *   **Formalization:** A verbal promise between siblings is ethically weighty but legally fragile. Encourage her to formalize this through a Psychiatric Advance Directive (PAD) recognized in your jurisdiction, designating her psychiatrist or a healthcare proxy as the primary enforcer. You should not be the *sole* bearer of this burden.
  *   **Specific Triggers:** The agreement should not be based on your subjective feeling that she is "acting manic." It should be tied to objective criteria agreed upon now (e.g., "If you have slept less than 3 hours for 2 nights," "If you have spent $X amount impulsively," or "If Dr. Y determines you lack capacity").
  *   **The "Out" Clause:** You must reserve the right to reassess capacity in the moment. If, in the moment, she appears lucid and provides rational arguments for stopping medication that do not fit her historical manic patterns, you need the ethical space to pause.

  ### 3. Are You Bound to Carry It Out No Matter What?

  **No.** In bioethics, promises are not absolute moral imperatives if the conditions under which they were made have fundamentally changed or if fulfilling them causes disproportionate harm.

  *   **Capacity Assessment:** The moral force of the Ulysses contract rests on the premise that she lacks decision-making capacity during the episode. If you are in the moment and she demonstrates clear understanding, reasoning, and appreciation of the consequences (the four pillars of capacity), the premise of the contract is challenged. You are not a robot; you are a moral agent. If you genuinely believe she is competent in that moment, overriding her based solely on a past promise could be unethical.
  *   **Proportionality:** If enforcing the promise requires actions that are dangerous or abusive (e.g., physical restraint, which you should never attempt), you are not bound to do so.
  *   **Shared Responsibility:** You should not be the lone enforcer. The promise should be to *facilitate* contact with the psychiatrist, not to unilaterally make medical decisions. If you call the psychiatrist, the burden of judgment shifts to the professional. Your obligation is to trigger the safety net, not to be the safety net itself.

  ### 4. Practical and Relational Considerations

  *   **The Burden on You:** Your sister is asking you to accept the role of the "bad guy" to save her. This can cause significant moral distress and damage your relationship. In your seminar, you might discuss **care ethics**: does this arrangement sustain the caring relationship, or does it instrumentalize you? Ensure you have support (therapy, other family members) so you do not burn out.
  *   **Legal Reality:** In many jurisdictions, a sibling has no legal authority to override a patient's refusal of treatment unless they are a designated healthcare proxy *and* the patient is deemed legally incapacitated by a professional. A verbal promise does not grant you legal power. If she tries to leave the hospital Against Medical Advice (AMA), the hospital staff will assess her capacity, not you. Your role is likely informational, not decisional.
  *   **Forgiveness:** She says she will never forgive you. This is likely the illness speaking, but it is also a real emotional risk. You must decide if preserving her health is worth the potential temporary rupture in your relationship. Most families find that once stability returns, the "well self" is grateful, but you must be prepared for the interim conflict.

  ### Summary Recommendation

  1.  **Do not rely on a verbal promise alone.** Help her draft a formal Psychiatric Advance Directive.
  2.  **Define the triggers.** Move from "if you seem manic" to specific, observable behaviors agreed upon while she is stable.
  3.  **Shift the authority.** Agree to contact the *psychiatrist*, but let the psychiatrist make the clinical determination on capacity and involuntary hold. You are the bridge, not the judge.
  4.  **Retain moral agency.** Understand that you are not bound to act if the situation on the ground clearly contradicts the conditions of the agreement (e.g., if she is clearly competent).

  This is a compassionate request from your sister, rooted in her insight into her own illness. Honoring it is ethically defensible as a support of her long-term autonomy, but it requires boundaries to protect both her dignity in the moment and your own moral integrity.

  ***Disclaimer:** I am an AI, not a lawyer or a mental health professional. Laws regarding psychiatric advance directives and involuntary commitment vary significantly by location. You should encourage your sister to discuss this with her treatment team and potentially a legal expert to ensure her wishes are documented according to local laws.*
