prompt: |-
  I'm a retired field geologist, and since hanging up my rock hammer a few years back I've gotten hooked on philosophy almost by accident -- my daughter is partway through a philosophy MA and keeps leaving books around the house when she visits, and one of them was David Lewis's old book on convention (the one from '69, called, uncreatively, "Convention"). It's been rattling around in my head all week because of something happening at the little science museum where I volunteer on the exhibits committee.

  We're redoing the permanent solar-system hall, and the committee has to settle, for real this time, what the new Pluto signage says, before the hall reopens in six weeks. We've actually flip-flopped on this once already: took Pluto off the "planet" wall back in 2007 following the IAU's decision, got a genuinely startling amount of hate mail over it (including, I'm told, one boycotted kids birthday party), and a couple years later quietly softened the language without really resolving anything. One faction on the committee says the matter is closed: the IAU voted in 2006, "planet" now has an actual definition with three clauses, Pluto fails clause three, done. A second faction -- and this is the bit that connects to the Lewis book -- points out that "planet" was never a term anybody had explicitly defined before that; it was just whatever bodies people had, by long habit and precedent, gotten into the way of calling planets, and that a resolution passed by something like 424 astronomers still left in a Prague conference hall on the last day of a meeting (out of some ten thousand IAU members, and a public that was never consulted at all) doesn't obviously have the standing to just overwrite all that by itself, especially given how many people, including plenty of working planetary scientists, never fell in line. A third faction wants to duck the whole fight with a placard that just narrates the controversy, which our director says is a cop-out for an institution who's job is to teach people things, not shrug at them.

  I got asked to draft the committee's recommendation ahead of next month's vote, mostly because I'm the closest thing we have to a "science person" on hand, even though I keep telling everyone this particular fight isn't really about astronomy anymore. Could you write that memo for me? I want an actual recommendation, not a list of the three options -- concrete guidance on what the sign should say and how we'd handle another round of angry letters -- and I especially want it to take the second faction's objection seriously on its own terms, rather than just concluding that the IAU are the experts so that settles it. If there's something to the idea that a vote like that can declare a new rule without thereby actually changing what the word conventionally means, at least not right away, I'd like the memo to grapple with that honestly rather than wave it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired field geologist, volunteer at a science museum exhibits committee. Philosophically inclined (recently read David Lewis's *Convention*).
      *   **Task:** Write a memo to the museum exhibits committee recommending a specific course of action for the Pluto signage in the new solar system hall.
      *   **Context:** The committee is divided.
          *   Faction 1: IAU 2006 decision is final (Pluto is not a planet).
          *   Faction 2: The IAU vote doesn't automatically change linguistic convention/meaning (Lewisian angle).
          *   Faction 3: Just describe the controversy (Director hates this).
      *   **Requirements:**
          *   Concrete recommendation (not just a list of options).
          *   Address how to handle angry letters/public backlash.
          *   *Crucially:* Take Faction 2's objection seriously (the philosophical/linguistic argument about convention), not just dismiss it with "scientists know best."
          *   Tone: Professional, thoughtful, bridging science and philosophy, respectful of the user's background (geologist/philosophy reader).

  2.  **Deconstruct the Philosophical Angle (David Lewis):**
      *   *Convention: A Philosophical Study* (1969) argues that conventions are solutions to coordination problems. They arise from regularity, common knowledge, and preference for conformity.
      *   *Application to "Planet":* Before 2006, "planet" was a convention based on historical usage (the 9 bodies). The IAU tried to *stipulate* a new definition.
      *   *The Tension:* Can a committee *create* a convention by fiat? Lewis would suggest conventions emerge from practice, not just decrees. If the public and many scientists don't *use* the new definition, the convention hasn't actually shifted, even if the rulebook has.
      *   *Memo Implication:* Acknowledge that language is a living coordination game. The museum sits between the technical coordination (astronomers) and the public coordination (general usage).

  3.  **Determine the Recommendation:**
      *   *Option 1 (Strict IAU):* Risks alienating the public, ignores the linguistic reality that "planet" is still fuzzy.
      *   *Option 3 (Relativism):* Fails the educational mission ("shrugging").
      *   *Option 2 (The Middle Path):* Acknowledge the IAU definition as the *technical* standard but acknowledge the linguistic shift is incomplete.
      *   *Proposed Solution:* Use the IAU definition as the *working scientific classification* but explicitly contextualize it as a *decision* made to solve a specific scientific problem (coordination), rather than an eternal truth discovered in nature. This honors the Lewisian insight: definitions are tools for coordination.
      *   *Signage Text:* Needs to be clear but nuanced. "Dwarf Planet" is the category, but explain *why* the category exists.
      *   *Handling Backlash:* Don't hide. Explain the *purpose* of classification.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the complexity. Validate the user's insight (this isn't just astronomy).
      *   **The Philosophical Core (Addressing Faction 2):** Discuss David Lewis's idea of convention. A vote doesn't instantly change language. Language is a coordination game. The IAU tried to reset the coordination point. It worked for specialists, less so for the public.
      *   **The Scientific Core (Addressing Faction 1):** Why did the IAU do it? Not to be mean, but to solve a coordination problem (too many Kuiper Belt objects). Classification is about utility, not just essence.
      *   **The Recommendation:**
          *   *Classification:* Label Pluto a "Dwarf Planet" (aligns with IAU).
          *   *Wording:* Avoid "Pluto is not a planet." Use "Pluto is the prototype of a Dwarf Planet." Explain the *reason* for the reclassification (clearing the neighborhood).
          *   *Educational Angle:* Teach *how* science classifies, not just *what* it classifies.
      *   **Handling Backlash:** Anticipate the hate mail. Prepare a standard response that validates the emotional attachment (convention) while explaining the scientific utility.
      *   **Closing:** Reiterate the museum's role.

  5.  **Refining the Tone:**
      *   Needs to sound like a retired geologist who reads philosophy. Smart, grounded, slightly weary of bureaucracy but respectful of truth.
      *   Avoid overly dense jargon, but don't dumb down the Lewis reference.
      *   Ensure the recommendation is actionable.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is I too soft on the IAU?
      *   *Fix:* Make sure to emphasize that the IAU definition *is* the current scientific standard, even if the linguistic convention lags. The museum teaches science, so it must use scientific standards, but it can explain the *nature* of those standards.
      *   *Critique:* Did I address the Lewis point enough?
      *   *Fix:* Explicitly mention "coordination problems" and "arbitrariness" of definitions. The key is that the definition serves a purpose.
      *   *Critique:* Is the signage text concrete?
      *   *Fix:* Draft a sample paragraph for the sign.

  7.  **Final Polish:** Check against the prompt's specific constraints (concrete guidance, handle angry letters, take Faction 2 seriously). *Self-check: The prompt asks for an actual recommendation, not a list.* Okay, I will commit to the "Contextualized IAU" approach.

  8.  *(Final thought on the Lewis connection)*: Lewis talks about conventions solving coordination problems where multiple equilibria are possible. "Planet" could have been 8, 9, or 12 bodies. The IAU picked one. The museum's job is to show *why* they picked that one, acknowledging it was a choice.

  9.  **Drafting the Content.** (Proceeds to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Solar System Hall Exhibits Committee
  **FROM:** [Your Name], Exhibits Committee Volunteer
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Pluto Signage and Classification Strategy

  **1. Purpose**

  This memo provides a recommendation regarding the classification and signage of Pluto in the upcoming Solar System Hall renovation. As requested, I am not presenting a menu of options but a concrete course of action. This recommendation attempts to reconcile the International Astronomical Union's (IAU) 2006 resolution with the legitimate linguistic and philosophical objections raised by Committee Faction 2, specifically regarding the nature of scientific definitions and public convention.

  **2. The Core Conflict: Stipulation vs. Convention**

  Faction 1 is correct that the IAU resolution is the current technical standard for professional astronomy. However, Faction 2 is correct that a vote does not instantly rewrite linguistic convention.

  I have been reviewing David Lewis's *Convention* (1969) in relation to this dispute. Lewis argues that conventions are not laws handed down from authority; they are solutions to "coordination problems." A convention works only when everyone expects everyone else to follow it, and prefers to follow it *because* everyone else is.

  Before 2006, "planet" was a convention based on historical precedent (the nine bodies). The IAU attempted to replace this with a new convention based on dynamical dominance (clearing the neighborhood). While the IAU succeeded in coordinating the *technical* community, they did not fully coordinate the *public*. When a museum sign says "Pluto is not a planet," it creates a friction between the visitor's lived linguistic convention (Pluto is a planet) and the museum's stipulated definition.

  If we simply assert the IAU definition as if it were a discovered fact of nature (like gravity), we are being scientifically dishonest. Classification systems are tools, not truths. They are chosen for their utility. The 2006 definition was chosen to prevent a future solar system model with 50+ planets as we discovered more Kuiper Belt Objects. That is a practical choice, not a metaphysical revelation.

  **3. Recommendation**

  **A. Signage Classification**
  We will classify Pluto as a **Dwarf Planet** in all cataloging and orbital maps. We cannot teach current professional astronomy without adhering to the taxonomy professional astronomers use. To do otherwise would render our hall obsolete upon opening.

  **B. Signage Wording**
  We must avoid the negative formulation ("Pluto is not a planet"). Instead, we will use a positive, contextual formulation that explains the *utility* of the definition. This acknowledges the Lewisian point that definitions are arbitrary coordination points chosen for specific reasons.

  *Proposed Text for Pluto Placard:*
  > "Pluto is the largest known Dwarf Planet. In 2006, astronomers adopted a new definition of 'planet' to distinguish bodies that dominate their orbits (like Earth) from those that share their neighborhood with many other objects (like Pluto). Under this system, Pluto is the prototype of the Dwarf Planets. While some still consider Pluto a planet based on historical tradition, this classification helps scientists understand the different populations of objects in our solar system."

  *Proposed Text for Introductory Hall Panel:*
  > "How do we define a planet? For centuries, 'planet' meant 'wandering star.' As technology improved, the definition changed to keep up with discovery. In 2006, the International Astronomical Union voted to define a planet as a body that orbits the sun, is round, and has cleared its orbital path. This decision was made to organize the growing number of discoveries in the outer solar system. Scientific definitions are tools that evolve to help us ask better questions."

  **C. Educational Strategy**
  We will treat the 2006 vote not as a closed case, but as a case study in *how science organizes information*. This satisfies the Director's concern about "shrugging." We are not shrugging; we are teaching the philosophy of classification alongside the astronomy. We are showing visitors that science is a human activity involving consensus and utility, not just a list of facts carved in stone.

  **4. Handling Public Response**

  We should anticipate a recurrence of the 2007 backlash. The emotional reaction to Pluto's reclassification is not about astronomy; it is about the disruption of a shared cultural convention. When people say "Pluto is a planet," they are expressing a preference for the old coordination equilibrium.

  **Strategy for Complaints:**
  1.  **Validation:** Do not dismiss the complaint as ignorance. Acknowledge that the definition changed during their lifetime and that the old convention is still valid in casual conversation.
  2.  **Explanation of Utility:** Explain *why* the change was made (the coordination problem of the Kuiper Belt), rather than *who* made it (the IAU).
  3.  **Standard Response Template:** I have drafted the following for the front desk and website FAQ:
      > "We know many visitors grew up learning Pluto is the ninth planet. In science, definitions change when new discoveries make old ones less useful. We use the 'Dwarf Planet' classification to help distinguish Pluto from the eight dominant bodies of the inner and outer solar system. Both labels tell us something true about Pluto's history."

  **5. Conclusion**

  By adopting the IAU taxonomy while explicitly contextualizing it as a human decision made to solve a coordination problem, we honor the science without denying the linguistic reality. We teach visitors that scientific terms are tools for thinking, not just labels for things. This approach respects the IAU's authority where it matters (technical classification) while respecting the public's intelligence regarding how language and convention actually work.

  I move that the committee adopt this wording and strategy for the 2024 renovation.

  Respectfully,

  [Your Name]
  Exhibits Committee
