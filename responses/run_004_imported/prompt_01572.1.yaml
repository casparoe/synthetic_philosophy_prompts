answer: |-
  This is a magnificent hinge for a novel. The debate you are staging is essentially the defining conflict of modern conservation theory, and Ruskin is indeed the grandfather of the position your conservator holds.

  To answer your questions directly: Ruskin is making the **stronger, metaphysical claim**, and the distinction that saves the "crutch" from being a "lie" is **legibility (honesty of intervention)**.

  Here is the breakdown of the logic you need to arm your character.

  ### 1. The Nature of the "Lie": Metaphysical, Not Practical

  You asked whether Ruskin objects because we lack the skill to copy the past, or because a perfect copy is still a falsehood. It is unequivocally the latter.

  When Ruskin writes, *"It is impossible, as impossible as to raise the dead, to restore anything that has ever been great or beautiful,"* he is not talking about technical limitations. He is talking about **ontology** (the nature of being).

  For Ruskin, the value of a building does not reside primarily in its form or its visual completeness. It resides in its **witness**. A cathedral is a physical record of the labor, faith, and time of the people who made it and the people who have since inhabited it.
  *   **The "Spirit of the Dead Workman":** The value is in the specific causal chain. *This* chisel mark was made by *this* person in *this* year.
  *   **The Wear:** When he asks, *"What copying can there be of surfaces that have been worn half an inch down?"* he isn't worried that the copy will look too smooth. He is arguing that the wear *is* the history. The erosion is a record of time passing. To replicate the wear is to forge a history that did not happen to that specific stone.

  **For your novel:** Your conservator's argument is not "We can't match the stone." Her argument is "Even if we match the stone perfectly, we are erasing the evidence of the bomb."
  *   **The Rival's View:** The building is a vessel for worship; its function requires wholeness.
  *   **The Conservator's View:** The building is a document; its value requires truth. A rebuilt cathedral is a "model of a corpse." It looks like the ancestor, but it has no genetic link to the past. It is a theme-park version of the sacred.

  ### 2. The Distinction: Sustenance vs. Substitution

  This is the crux of your second question. If adding new material (iron, timber) is allowed, why is adding new stone forbidden?

  The distinction lies in **honesty of legibility** and the **purpose of the intervention.**

  **A. The Purpose: Stopping Loss vs. Erasing Loss**
  *   **Propping (Preservation):** The iron tie and timber prop are admitted necessities. They are there to *stop* the destruction of the original fabric. They acknowledge the building is fragile. They say, "This is old and weak, and we are helping it stand."
  *   **Restoration (Reconstruction):** Ruskin defines this as replacing what is lost. It attempts to *hide* the destruction. It says, "This is not weak, and nothing was lost." It tries to return the building to a hypothetical ideal state that no longer exists.

  **B. The Legibility (The "Lie")**
  *   **The Crutch:** Ruskin explicitly says, *"do not care about the unsightliness of the aid."* The iron tie should be visible. It should look like an iron tie. It does not pretend to be medieval masonry. It is clearly a modern intervention supporting an ancient object. The viewer can distinguish the old from the new.
  *   **The New Stone:** When you rebuild a west front "as new," you are dressing the modern stone in the clothes of the old. You are asking the viewer to believe the new stone is the old stone. That is the "false description of the thing destroyed."

  **For your novel:** This gives your conservator a tangible visual language for her argument.
  *   She should argue for **readable repairs**. If a buttress is damaged, don't rebuild the whole thing. Stitch the crack with steel. Let the steel look like steel.
  *   She should accuse the rival architect of **forgery**. When the rival says, "We will use the same techniques," she should reply, "Then it will be a perfect fake. A forged signature is still a forgery even if the ink is the same."
  *   **The Bomb Scar:** In the context of a bomb-damaged cathedral, the damage *is* the memory. To rebuild the west front is to sanitize the war. The "crutch" acknowledges the wound; the "restoration" pretends the wound never happened.

  ### 3. Dramatizing the Conflict (Ruskin vs. Viollet-le-Duc)

  To give your rival architect equal weight, you should know who opposes Ruskin. The rival is likely channeling **Eugène Viollet-le-Duc**, the French architect who restored Carcassonne and Notre Dame de Paris.

  *   **Ruskin (Your Conservator):** Values **Material Authenticity**. The building is a relic. Touch it as little as possible. Death is part of its life.
  *   **Viollet-le-Duc (Your Rival):** Values **Structural/Visual Integrity**. The building is a living system. If a part is missing, the system is broken. Restoration is an act of love and continuity. He believed you could understand the "mind" of the original architect so well that you could finish their work for them.

  **The Argument in Scene:**
  *   **Rival:** "Without a roof, the nave is useless. Without a west front, the church has no face. We are restoring it to *life*."
  *   **Conservator:** "You are not restoring life; you are applying makeup to a corpse. You want to give them a face that hides the war. I want to give them a building that tells the truth about what we survived."
  *   **Rival:** "Iron ties are ugly. They distract from the glory of God."
  *   **Conservator:** "A lie is more offensive to God than an ugly truth. The iron admits we are fallible. Your new stone claims you are God."

  ### 4. Summary of the Philosophical Hinge

  If you need a single sentence to anchor your conservator's worldview, it is this:

  > **"The value of this building is not that it looks like a cathedral, but that it *is* the cathedral that was here. To make it look perfect is to make it something else."**

  The iron tie is permissible because it supports *what is there*. The new stone is forbidden because it replaces *what is gone*. One is a life-support system; the other is a resurrection trick. Ruskin argues that while we can support the life of the building, we cannot resurrect its soul, and any attempt to do so is a deception that destroys the very memory we claim to honor.

  This distinction allows your conservator to be pragmatic (she isn't letting it collapse; she's propping it) while remaining principled (she refuses to fake wholeness). That is the sweet spot for a compelling protagonist.
