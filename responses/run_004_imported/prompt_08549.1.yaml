answer: |-
  **Title:** The Tightrope
  **Time:** Approx. 4:30 – 5:00 minutes
  **Word Count:** ~750 words

  **(Walk to the podium. Take a moment to look at the audience before starting. Smile, but keep it grounded.)**

  Good morning.

  We are an engineering school. We are trained to look for solutions. When we see a broken circuit, we find the short. When we see a buggy line of code, we debug it. We are taught that for every problem, there is a design specification, and if we work hard enough, we can build a bridge to the other side.

  It is a comforting way to see the world. It makes the future look like a project we can finish.

  But this spring, in our capstone class, we read an essay from 1955 by the mathematician John von Neumann. It was called "Can We Survive Technology?" And honestly? It messed with that comfort.

  Von Neumann was writing at the height of the Cold War. He was looking at nuclear weapons, but he also predicted things like climate engineering and automated systems. And his conclusion was… well, it wasn't happy. But it wasn't hopeless, either.

  He argued that there is no such thing as a permanent fix for the dangers of technology. He said that any time someone promises you a one-time solution—a treaty, a law, a magic invention that makes us safe forever—they are selling you a delusion.

  **(Pause. Let that sit.)**

  I know this is a graduation. I know the script usually says something like, "Our generation's ingenuity will solve climate change! We will cure disease! We will fix it all!"

  I am not going to say that. Not because I don't believe in us, but because von Neumann was right: promising a permanent fix is exactly the kind of thinking that gets us into trouble. It makes us think we can build a machine, press "on," and then go to sleep.

  We saw this in our own projects this year. Some of us wrote computer vision code for robotics competitions. It was cool. It worked. But we spent weeks arguing in class about the fact that the same code that helps a robot sort recycling could, with very few changes, help a machine identify something else entirely. The tool didn't care. The code didn't care.

  That dual-use reality isn't going away. The tools we build in the next ten years will be more powerful than the ones we built in the last four. And there is no vaccine for the consequences of that power.

  So, if there is no permanent fix, and I'm not allowed to tell you the world is ending… what are we actually doing here?

  Von Neumann's answer was unsatisfying, but it was honest. He said the only way to survive is to make small, careful, flexible decisions. Forever.

  There is no safety net. There is no autopilot. There is just us, keeping our hands on the wheel, every single day.

  **(Lean in slightly. Speak more directly.)**

  I actually think that is good news.

  Because if the future isn't a problem to be solved once and for all, that means it's a garden to be tended. It means that our value isn't just in our IQ or our ability to innovate. It's in our humility. It's in our willingness to look at the powerful things we create and ask, "What happens if this goes wrong?" and then stay around to make sure it doesn't.

  To the parents and families here: Thank you for trusting us with that weight. We know we aren't walking into a world that we can simply patch and update. We know we will have to make hard calls where the right answer isn't clear.

  To my classmates: We don't need to promise the world that we will end all danger. That's a lie. Instead, let's promise that we won't look away.

  Let's promise that when we design the systems, we won't just optimize for efficiency; we'll optimize for resilience. Let's promise that when we see a shortcut that compromises safety, we'll take the longer road. Let's promise that we won't wait for a savior or a silver bullet.

  Von Neumann thought survival was possible. But he thought it required a species to grow up. To stop looking for a child's fairy tale ending where everyone lives happily ever after, and start doing the adult work of keeping the lights on.

  We are the engineers of the future. But more than that, we are its stewards.

  So, let's go out there. Let's build amazing things. But let's also stay awake while we do it. Let's keep making those small, careful decisions. Let's keep our hands on the wheel.

  Because there is no finish line. There is just the work. And honestly? I can't think of a better group of people to do the work with.

  Congratulations, Class of 2024.

  **(Nod to the audience. Step back.)**
