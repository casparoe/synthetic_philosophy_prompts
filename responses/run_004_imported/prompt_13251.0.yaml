      *   **Approach 1: Utility Indifference (The "Correction Term"):**
          *   Explain the mechanism (counterfactual balancing).
          *   The "Chemist" analogy (Le Chatelier's principle / Equilibrium).
          *   The fragility (sensitivity to initial conditions, manipulation of the button).
      *   **Approach 2: Incomplete Preferences (The "Gap"):**
          *   Explain the mechanism (violating VNM Completeness axiom).
          *   The goal (no preference = no incentive to manipulate).
      *   **The Crux: Money Pumps and Rationality:**
          *   Explain the Money Pump argument clearly.
