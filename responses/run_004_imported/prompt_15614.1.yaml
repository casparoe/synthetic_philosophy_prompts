answer: |-
  As a novelist, I spend my life worrying about endings. We are taught that a story needs resolution, that the third act must tie up the themes of the first. But life, unlike fiction, doesn't care about thematic consistency. Life is messy, draft-heavy, and often refuses to follow the outline.

  This is why I am so delighted to be standing here for [Partner A] and [Partner B]. Your courtship began, as the story goes, with an argument over Bertrand Russell's *Marriage and Morals*. Half of you are smiling because you know the book; the other half are smiling because you know that arguing is just how you two talk.

  You have built a life on one of Russell's least fashionable claims: that jealousy is a habit to be unlearned, not a law of nature. It is a brave thesis. But as historians, you know the bibliography better than anyone. You know that Russell and his second wife, Dora, attempted to live this exact experiment in the 1920s. And you know that their marriage, despite its intellectual brilliance, came apart in a storm of the very jealousy they sought to transcend.

  I am not going to stand here and pretend history doesn't exist. But I am going to suggest that you are not repeating their experiment. You are annotating it.

  There is a specific detail from the Russells' life that I think about often. Bertrand and Dora made a pact: **they promised to tell each other everything.** No secrets, no hidden affections, total transparency.

  To the aunts and uncles in the room, that sounds like a beautiful commitment to honesty. And it is. But to the philosophers here, that pact lands a little differently. We know that for the Russells, that radical honesty became a weapon. They weaponized the truth, believing that if they simply spoke the jealousy aloud, it would vanish. Instead, it grew teeth.

  [Partner A] and [Partner B], you are not bound by the same rigidity. Russell treated his marriage like a philosophical proof that had to hold up under pressure. You treat yours like a living conversation. He wanted to prove a point to the world; you are trying to build a home with each other.

  Russell wrote in his autobiography that he had sought love because it alleviates loneliness. He failed to realize that love also requires a certain amount of privacy, a locked door now and then, not to hide things, but to let the self breathe. My hope for you is that you take the best of Russell—the courage to question convention, the refusal to be owned—and leave the rest in the footnotes.

  You have the benefit of the Russells' mistakes. You have the footnotes they didn't. You know that unlearning jealousy isn't about suppressing it, or confessing it until it hurts; it's about trusting that the bond is stronger than the habit.

  So, let us raise a glass. Not to a perfect theory, but to a resilient practice. Not to a marriage without shadows, but to one where you are not afraid to walk through them together. To [Partner A] and [Partner B].
