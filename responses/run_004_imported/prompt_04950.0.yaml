prompt: |-
  I help produce a small podcast on the philosophy of mathematics that grew out of a reading group a few of us started during my master's program. We've mostly stuck to fairly accessible topics, but this term I'm taking a graduate seminar on independence results in set theory, and forcing has gone from something I nodded along to into something I actually have to reconstruct on a board myself -- which is also what got me into a running argument with a classmate who thinks the whole question of the continuum hypothesis's truth value is simply confused.

  Partly because of that argument, I've booked a set theorist for next month's episode who has built her career defending a multiverse-style view of set theory: there is no single background universe in which the continuum hypothesis is just true or just false, only many equally legitimate set-theoretic universes -- some satisfying CH, some satisfying its negation -- with forcing revealing this plurality rather than creating it. Whenever she's pressed with the obvious objection, that CH is a perfectly determinate claim about a fixed collection of real numbers and so must be true or false whether or not we can prove which, she has a practiced way of turning it back on the interviewer: "tell me what fact you think forcing left out." It's an effective move, and I don't want the whole conversation to consist of her deploying it four different ways.

  Could you draft eight to ten interview questions that push past that move rather than inviting it? I want at least one question that forces her to distinguish formal independence from ZFC from genuine metaphysical indeterminacy, since these get run together constantly, including by me until fairly recently; one on why the success of forcing axioms like PFA or Martin's Maximum in pinning the continuum at ℵ₂ shouldn't count as evidence for a preferred universe rather than just one more model among equals; and one asking her to make sense of the fact that Woodin, long associated with using Ω-logic to argue CH is outright false, has more recently pursued inner-model programs aimed at an "Ultimate L" in which CH would come out true -- seemingly landing on opposite sides of the single-universe debate at different points in one career. For each of those three, please add a short follow-up question keyed to the answer she's most likely to give. Then close with one question asking her directly what observation, theorem, or argument, if any, would count as evidence against the multiverse view itself, since every objection I've raised with her in our preliminary emails seems to get absorbed rather than answered.
