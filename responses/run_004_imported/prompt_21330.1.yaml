  *(Self-Correction during final polish)*: Make sure Sam doesn't just sound like a strawman Bayesian. The "Logical Omniscience Problem" is a known issue in Bayesian epistemology. Sam should represent the "Orthodox Bayesian" response (e.g., Garber, Hintikka) who distinguishes between *belief* and *acceptance*, or insists on idealization. Let's have Sam lean into the idea that probability is a logic of consistency, not a guide for action under limitation.

