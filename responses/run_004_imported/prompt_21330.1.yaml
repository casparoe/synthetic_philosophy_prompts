      *   **Characters:**
          *   *Software Engineer (Pro-Logical Induction):* Believes logical induction provides a viable model for bounded rationality and real logical uncertainty.
          *   *Philosopher (Pro-Classical Bayesianism):* Believes rational credence requires logical omniscience; probabilities on math are just subjective ignorance, not objective credence.
      *   **Requirements:**
