answer: |-
  This is one of the most fascinating and tragic arcs in the history of moral philosophy. You're absolutely right to flag it: you can't fully understand the despair lurking beneath the surface of *The Methods of Ethics* without understanding the Society for Psychical Research (SPR).

  Here is the philosophical logic connecting the two, broken down by the specific tensions you raised.

  ### 1. The Dualism of Practical Reason: Why a "Further Fact" was Necessary

  To see why Sidgwick needed ghosts, you have to see the hole in his ethics. In *The Methods*, Sidgwick argues that there are two self-evident, rational principles of action:

  1.  **Rational Prudence (Egoism):** I ought to aim at my own greatest happiness over the long term.
  2.  **Rational Benevolence (Utilitarianism):** I ought to aim at the universal greatest happiness, counting everyone's good equally.

  The problem, as you know, is that Reason offers no proof that these two aims coincide. In fact, empirical observation suggests they often conflict. If I sacrifice my life or happiness for the greater good, Rational Prudence says I am a fool, while Rational Benevolence says I am a hero.

  For Sidgwick, this **"Dualism of Practical Reason"** was catastrophic. If Reason is divided against itself, then morality is not rational. If morality is not rational, the whole Enlightenment project of a scientific ethics collapses.

  To resolve this, Sidgwick concluded we need a **"Moral Government of the Universe."** We need a guarantee that, in the long run, doing your duty (Utilitarianism) will not result in a net loss for the agent (Egoism). Since this clearly doesn't happen in *this* life (the wicked often prosper, the virtuous often suffer), the reconciliation must happen in an **afterlife** under the supervision of a **benevolent deity**.

  So, the logic chain is:
  *   Ethics must be rational.
  *   Ethics is only rational if Duty and Interest coincide.
  *   They only coincide if there is post-mortem justice.
  *   **Therefore, we must establish the fact of survival after death and divine supervision.**

  ### 2. Why Psychical Research? Why not Faith or Axiom-Dropping?

  This is where Sidgwick's Victorian context and his specific epistemology come in.

  **Why not just pick Theism on Faith?**
  Sidgwick had already lost his own Christian faith (he resigned his fellowship at Trinity College in 1869 because he couldn't sign the 39 Articles). But more importantly, **faith is not a universal rational ground.**
  Sidgwick was trying to build a *scientific* ethics. If the foundation of morality rests on revelation or fideism, it is only binding on those who share that faith. He needed a truth that would bind a rational atheist as tightly as a believer. He needed empirical proof of the supernatural that could stand up to the scrutiny of the emerging scientific naturalism (Huxley, Spencer, etc.). He wanted to save religion *from* science by using science's own methods.

  **Why not drop the Benevolence or Prudence axiom?**
  He couldn't drop Prudence because he found it as self-evident as mathematics. He couldn't drop Benevolence because that destroys Utilitarianism, which he felt was the only viable system for social morality. He was trapped. He *needed* the empirical fact of immortality to make the axioms cohere.

  **Enter the SPR.**
  To Sidgwick, Psychical Research wasn't about spooky parlor tricks; it was **applied metaphysics.** If telepathy or mediumship could be proven under laboratory conditions, it would prove two things:
  1.  **Mind can operate independently of matter** (undermining materialism).
  2.  **Consciousness can survive bodily death** (opening the door for post-mortem justice).

  It was the only available methodology that promised to turn theological hopes into scientific facts.

  ### 3. Why the Brutal Epistemic Standards Never Bent

  This is the most poignant part of Sidgwick's biography. He spent 20 years investigating mediums, often funding them personally, often hoping desperately that *this* one would be the real deal. Yet, he rejected almost all of it. Why?

  **A. The Stakes Were Too High for Bad Data**
  Remember, Sidgwick wasn't just looking for comfort; he was looking for the **foundation of rational morality.** If he allowed sloppy evidence or fraud to count as proof of immortality, he would be building the rational justification for ethics on a lie. That would be worse than leaving the Dualism unresolved. If the "Moral Government" is proven by trickery, then Reason is still not vindicated. He needed a proof that would silence the materialist skeptic, which meant the evidence had to be ironclad.

  **B. Intellectual Integrity as a Duty**
  Sidgwick was a deontologist about truth-telling. For him, the duty of intellectual honesty was paramount. To succumb to wishful thinking would be a violation of the very Rational Benevolence he was trying to save. He famously wrote that he maintained a "habit of not letting hope influence belief." To bend his standards would be to admit that Reason is the slave of the passions—which, again, destroys his ethical system.

  **C. The Tragedy of the "Hidden Hand"**
  Sidgwick actually developed a theory for why the evidence was always elusive. He speculated that if there *is* a Moral Governor, perhaps the evidence is intentionally kept ambiguous to preserve human **moral freedom**. If proof of the afterlife were as obvious as gravity, we would be virtuous out of prudence (fear/reward) rather than duty.
  However, he never let this speculation count as *evidence*. It was a philosophical stopgap, not a scientific result.

  ### Summary for Seminar
  If you're presenting this, the key takeaway is that **Sidgwick's Psychical Research was not a hobby; it was the empirical wing of his moral philosophy.**

  He was trying to solve the **Dualism of Practical Reason** by empirically verifying the **Moral Government of the Universe**. He couldn't use faith because faith isn't universally rational, and he couldn't lower his standards because a morality based on fraud is irrational.

  The tragedy, of course, is that he died without the proof. He left the *Methods* with the Dualism unresolved, famously writing in his final letters that the failure to find evidence for immortality was the "great failure" of his life. It suggests that without that "further fact," Sidgwick feared morality might ultimately be a noble delusion. That's the dark shadow hanging over the whole utilitarian project.
