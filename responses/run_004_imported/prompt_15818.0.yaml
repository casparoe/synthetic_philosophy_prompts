prompt: |-
  Random one from my Sidgwick seminar prep. Everyone remembers him for the utilitarian stuff in the Methods of Ethics, but way fewer people clock that he also co-founded (and was the first president of) the Society for Psychical Research, and spent the better part of two decades personally chasing down mediums, telepathy claims, apparitions, all of it -- and by most accounts never let himself declare victory even though he clearly wanted to. Can you explain the actual philosphical logic connecting this side pursuit to the dualism of practical reason stuff from the Methods -- i.e. why he thought duty and self-interest needed some further fact about the universe to fully cohere, and why evidence of that sort, rather than, say, just picking theism on faith, or dropping the benevolence axiom, was supposed to do the job? And relatedly, why do you reckon his famously brutal epistemic standards never bent given how badly he apparently needed a positive result?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Henry Sidgwick (19th-century philosopher).
      *   **Specific Focus:** The connection between his work on Utilitarianism/Ethics (*The Methods of Ethics*) and his involvement in Psychical Research (SPR).
      *   **Core Question 1:** What is the *philosophical logic* connecting psychical research to the "dualism of practical reason"? Why did he think duty and self-interest needed a "further fact" to cohere?
      *   **Core Question 2:** Why evidence of *that sort* (psychical/empirical) rather than theism on faith or dropping the benevolence axiom?
      *   **Core Question 3:** Why did his epistemic standards remain brutal despite his personal desire for a positive result?
      *   **Tone:** Academic but conversational (seminar prep context), insightful, nuanced.

  2.  **Deconstruct Sidgwick's Ethical Problem (The Dualism of Practical Reason):**
      *   In *The Methods of Ethics*, Sidgwick identifies three methods: Intuitionism, Egoism, and Utilitarianism.
      *   He finds Utilitarianism (Universal Hedonism) rationally compelling *if* one accepts the axiom of Benevolence (each person's good counts equally).
      *   He finds Egoism (Individual Hedonism) rationally compelling *if* one accepts the axiom of Prudence (one's own future good matters as much as one's present good).
      *   *The Conflict:* There is no rational proof that what is best for the individual (Egoism) aligns with what is best for the whole (Utilitarianism). In fact, often they conflict.
      *   *The Consequence:* If they don't align, Reason is divided against itself ("Dualism of Practical Reason"). Ethics becomes irrational or impossible as a systematic guide.
      *   *The Solution Needed:* A "moral government of the universe." Someone/something must ensure that virtue leads to happiness (for the agent) in the long run. This implies immortality and a benevolent deity.

  3.  **Connect to Psychical Research:**
      *   Sidgwick needed *evidence* for this "moral government."
      *   Traditional theology/faith wasn't enough for him. He was an empiricist/rationalist. He needed scientific proof of survival after death and divine supervision.
      *   Psychical Research (SPR) offered a potential *scientific* route to proving immortality and divine justice. If telepathy or survival of death could be proven empirically, it validates the religious hypothesis without relying on revelation.
      *   *Logic:* Ethics requires X (harmony of duty and interest). X requires Y (afterlife/divine justice). Y needs empirical support. SPR investigates Y.

  4.  **Address the "Why Evidence vs. Faith" Question:**
      *   Sidgwick was a product of the Victorian crisis of faith. He lost his own Christian faith (resigned fellowship at Trinity due to the 39 Articles).
      *   He couldn't just "pick theism on faith" because his philosophical system demanded *rational* coherence. Faith is subjective; ethics, for Sidgwick, needed to be scientific/systematic.
      *   Dropping the benevolence axiom? That collapses Utilitarianism.
      *   Dropping Prudence? That collapses Egoism (which he found self-evident).
      *   So, he *had* to find a way to reconcile them empirically.

  5.  **Address the "Epistemic Standards" Question:**
      *   Sidgwick was known for extreme rigor (some say paralyzing skepticism).
      *   Why not bend the rules? Because the whole point was to save *Rational* Ethics. If he accepted fraud or sloppy evidence, he undermines the rationality he's trying to preserve.
      *   If the proof of the moral order is based on bad science, then the ethical system rests on sand.
      *   His integrity as a philosopher depended on the integrity of the evidence.
      *   Also, he was fighting against materialism/scientific naturalism. To beat them, he had to use *their* weapons (rigorous empiricism), not retreat to fideism.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. It's a classic "Sidgwick puzzle." Validate the user's observation (yes, this is crucial and often overlooked).
      *   *Section 1: The Dualism of Practical Reason.* Explain the conflict between Egoism and Utilitarianism. Use the terms "Rational Egoism" and "Rational Benevolence." Explain why the conflict makes ethics irrational without a resolution.
      *   *Section 2: The Theological/Eschatological Solution.* Explain that the only way to harmonize them is if virtue is rewarded in the long run (afterlife). This requires a "Moral Governor."
      *   *Section 3: Why Psychical Research?* This is the crux. Sidgwick wanted *scientific* theology. He couldn't accept revelation. SPR was the attempt to make the supernatural empirical. It wasn't about ghosts for fun; it was about proving survival of death to save ethics.
      *   *Section 4: Why not Faith?* Discuss his loss of faith and the Victorian context. Faith isn't binding on all rational agents. Ethics needs universal rationality.
      *   *Section 5: Epistemic Rigor.* Why stay strict? Because if the evidence is weak, the ethical system fails. He needed a proof that would satisfy a skeptic (like himself). Also, intellectual honesty.
      *   *Conclusion:* Summarize the tragedy. He died without the proof. The "Dualism" remains unresolved.

  7.  **Refining the Tone:**
