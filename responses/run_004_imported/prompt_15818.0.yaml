  8.  **Final Polish:** Check for clarity on the "Dualism." Ensure the link between "Immortality" and "Sanctions" is clear. (If I sacrifice my happiness for the greater good, I need to know I won't ultimately lose out. If death is the end, I might lose out. Therefore, I need proof of life after death where justice is served.)

  9.  *(Final check against prompt)*: Did I answer why evidence rather than faith? Yes. Did I answer why standards didn't bend? Yes. Did I connect it to the Dualism? Yes.

