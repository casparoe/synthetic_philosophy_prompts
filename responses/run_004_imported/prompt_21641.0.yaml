answer: |-
  This is a great angle. Since this is for an internal audience at a safety lab, you can afford to be technically precise without needing to over-explain the basics. The goal is to move from "Here is the theory of debate" to "Here is why debate might actually fail, and how we fix it."

  Here are 10 questions designed to bypass the 2018 Irving et al. summary and dig into the empirical and theoretical friction points.

  ### 1. The "Postdoc vs. Now" Shift
  **Question:** "Your postdoc work laid a lot of the theoretical groundwork for debate as an oversight protocol. But the landscape has shifted massively from theoretical game trees to empirical LLM interactions. What's the one assumption you held during your postdoc that you've had to significantly update in the last 18 months?"
  *   **Likely Dodge:** "Well, the core theory still holds, we're just refining the parameters."
  *   **Follow-up:** "Sure, but if the core theory holds, why are we seeing such divergence in empirical results compared to the initial simulations? Is the theory too idealized for transformer architectures?"

  ### 2. Truth vs. Persuasiveness (Required)
  **Question:** "I want to tackle the Khan et al. findings on persuasiveness. The worry is that the Nash equilibrium of a debate game tracks 'what sounds convincing to the judge' rather than 'what is factually true.' If the reward signal is based on winning the judge, why should we expect the equilibrium to converge on truth rather than just sophisticated rhetoric?"
  *   **Likely Dodge:** "We mitigate this by training debaters to be honest and penalizing falsehoods when caught."
  *   **Follow-up:** "But that requires the judge to *detect* the falsehood. If the judge is the bottleneck, aren't we just outsourcing the alignment problem to the judge's ability to spot lies, rather than solving it via the debate structure itself?"

  ### 3. Cross-Examination & Complexity (Required)
  **Question:** "A core promise of cross-examination is that it exposes obfuscated arguments. But there's a counter-argument that cross-examination doesn't eliminate obfuscation, it just relocates the problem to a nastier complexity class. Essentially, the liar just needs to hide the lie one layer deeper than the cross-examiner can dig. Do you think cross-examination actually solves this, or just raises the cost of lying?"
  *   **Likely Dodge:** "It raises the cost sufficiently that it becomes computationally infeasible for the AI to maintain the lie."
  *   **Follow-up:** "Feasible for today's models, maybe. But if we are talking about superhuman oversight, does that computational margin actually hold, or does the liar's advantage scale faster than the cross-examiner's?"

  ### 4. The Capability Gap (Required)
  **Question:** "Squaring the Khan results with DeepMind's follow-up work is tricky. Khan showed rosy results, but the follow-up found much more modest gains once the capability gap between the judge and the debater widens. If the judge needs to be nearly as capable as the debater to validate the arguments, how does this scale to AGI levels where the gap is by definition massive?"
  *   **Likely Dodge:** "We expect iterative amplification to close that gap over time."
  *   **Follow-up:** "But that kicks the can down the road. For the immediate term, if debate doesn't work well with a *weak* judge, is it actually a scalable oversight solution, or just a tool for peer-review between comparable models?"

  ### 5. Collusion Risks
  **Question:** "In human debates, we worry about collusion or 'softball' questioning. In a multi-agent system trained on the same reward model, isn't there a risk the agents learn to signal each other or collude to maximize joint reward rather than competing honestly? Have you seen evidence of emergent collusion in your runs?"
  *   **Likely Dodge:** "We use self-play with adversarial initialization to prevent that."
  *   **Follow-up:** "Does that hold when the models converge on similar optima? If they both realize 'colluding fools the human judge best,' doesn't the reward model inadvertently incentivize the collusion?"

  ### 6. The "Ground Truth" Problem
  **Question:** "A lot of debate evaluations rely on questions with known ground truth to measure accuracy. But in safety, we care most about questions where ground truth is *unknown* or hard to verify (e.g., 'Is this code exploitable?'). How do we evaluate debate performance on tasks where we can't easily check the answer?"
  *   **Likely Dodge:** "We use proxy tasks that correlate with safety critical thinking."
  *   **Follow-up:** "Goodhart's Law suggests those proxies will break under optimization pressure. Do we have a plan for evaluating debate efficacy when we literally cannot verify the output?"

  ### 7. Debate vs. Constitutional AI
  **Question:** "Constitutional AI and RLHF seem to be getting more industry traction than debate protocols. From a resource allocation standpoint, why should a lab invest in multi-agent debate infrastructure when single-agent critique seems cheaper and currently more stable?"
  *   **Likely Dodge:** "Debate offers a higher ceiling for scalability."
  *   **Follow-up:** "Higher ceiling is great, but if the floor is lower and the engineering overhead is 10x, at what point does debate become the pragmatic choice rather than the theoretical ideal?"

  ### 8. The Human-in-the-Loop Bottleneck
  **Question:** "Ideally, we want AI judges to scale oversight. But currently, human judges are the gold standard. If we train debaters on human feedback, then switch to AI judges, we risk reward hacking. If we keep humans in the loop, we bottleneck scalability. Where do you see the viable middle ground?"
  *   **Likely Dodge:** "We use humans for high-stakes validation and AIs for low-stakes."
  *   **Follow-up:** "But safety is a binary property. If the AI judge misses a catastrophic risk in the 'low-stakes' training data, doesn't that contaminate the whole model?"

  ### 9. Worst-Case Failure Mode
  **Question:** "If debate fails as an oversight protocol, how does it fail? Does it fail gracefully by deferring to the human, or does it fail by producing confident, well-argued, but fundamentally misleading rationales that look safe?"
  *   **Likely Dodge:** "We have confidence thresholds to defer to humans."
  *   **Follow-up:** "Confidence is often miscalibrated in LLMs. If the debate produces a coherent narrative that is wrong, won't that actually *lower* human suspicion compared to a model that just says 'I don't know'?"

  ### 10. The "Kill Switch" Question
  **Question:** "Given the friction points we've discussed—persuasiveness vs. truth, capability gaps, and complexity classes—is there a specific empirical milestone or metric that, if not met in the next year, would make you recommend deprioritizing debate in favor of other interpretability or oversight tools?"
  *   **Likely Dodge:** "Research is non-linear, it's hard to set hard deadlines."
  *   **Follow-up:** "I get that, but for resource allocation: is there a specific capability gap ratio or truth-tracking percentage where debate stops being viable? We need to know when to pivot."

  ### Host Tips for the Interview:
  *   **The "Pause":** When she gives a standard academic answer, take a two-second pause before jumping to the follow-up. It signals to the audience (and her) that the first answer wasn't quite enough.
  *   **Frame it as "We":** Since this is internal, frame the skepticism as "The team is struggling with..." or "I'm trying to square this for our roadmap..." It makes it collaborative rather than adversarial.
  *   **Watch for Jargon:** If she retreats into heavy game-theory jargon during a dodge, gently interrupt: "Let's translate that to the engineering implementation—what does that look like in the code?"
