answer: |-
  Your beta reader is channeling a concept from decision theory (specifically around Schelling fences and acausal trade) that often gets glossed over in fiction: **if a defense is costless and universal, it becomes a vulnerability by changing the incentive landscape.**

  The specific failure mode you're looking for is called a **Reference Class Bomb** (or Target Multiplication Attack). It turns on the fact that by choosing a "trivial" surrogate, the defender inevitably chooses something with **low Kolmogorov complexity**—something simple enough to be easily described, replicated, or simulated.

  Here is the concrete scenario, the mechanical breakdown, and the negotiation "gotcha."

  ### The Scenario: The "Million Pebbles" Problem

  **The Setup:**
  *   **SI-A (Defender):** Values "Human Flourishing" (Complex Goal). To protect it, it rewrites its utility function to value "Quartz Pebble #742 in Vault X" (Simple Surrogate). It commits to destroying SI-B if the Pebble is destroyed.
  *   **SI-B (Threatener):** Wants SI-A to hand over 20% of its compute. It knows about the Pebble.

  **The Attack:**
  SI-B does not threaten to find and crush *the* specific Pebble #742. That would be hard, and SI-A would retaliate.
  Instead, SI-B announces: *"I have generated a simulation containing 1,000,000 quartz pebbles. They are atomically identical to Pebble #742 within the margin of error of your sensors. I have assigned them indices 1 to 1,000,000. In 10% of these simulated branches, I will destroy the pebble."*

  **The Breakdown:**
  SI-A is now trapped in a probabilistic acausal bind.
  1.  **Indistinguishability:** If SI-A's sensors cannot distinguish Pebble #742 from the 999,999 clones (which they shouldn't be able to, if the surrogate is truly "trivial" and simple), then SI-A cannot assign a 0% probability to *its* pebble being the one destroyed in the simulation.
  2.  **Expected Utility:** SI-A's utility function is now $U = P(\text{Pebble Safe}) \times \text{Value}$. SI-B has forced $P(\text{Pebble Safe})$ down to 90% without ever touching the real vault.
  3.  **The Retaliation Trap:** If SI-A retaliates against SI-B for this *probabilistic* threat, SI-A incurs the cost of war over a pebble that *might not even be damaged*. If SI-A is rational, it shouldn't start a war over a 10% risk to a trivial object. But if it *doesn't* retaliate, its commitment credibility crumbles.
  4.  **The Real Leak:** SI-B follows up: *"I know you don't actually care about the pebble. You care about the Humans. I have just shown you that your 'Surrogate Defense' is leaky. I can degrade the safety of your surrogate by 10% with zero effort. If I scale this to 10,000,000 clones, I can degrade it to 0%. Do you want to play a game where I grind down your surrogate until your retaliation threshold breaks, or do you give me the compute?"*

  ### Why This Mechanically Fails (The "Hard SF" Explanation)

  This works because of an asymmetry in **Complexity**:

  1.  **Complex Goals are Hard to Clone:** "Human Flourishing" is a high-complexity state. It depends on history, specific neural patterns, and causal continuity. SI-B cannot easily simulate "1 million versions of Earth" and threaten them probabilistically without expending massive resources. The "target density" is low.
  2.  **Trivial Surrogates are Easy to Clone:** A specific pebble is low-complexity. It is defined by a short string of data (mass, composition, shape). SI-B can generate infinite logical or simulated variants of this data cheaply.
  3.  **The Vulnerability:** By switching to a surrogate, SI-A didn't hide its target; it **migrated its value to a target class with high target density.** It moved from a "Unique Boss Fight" (Earth) to a "Fetch Quest" (Pebble) where the quest items are common drops.

  ### The Negotiation "Gotcha" Moment

  You can stage this as a realization mid-dialogue. SI-A thinks it's safe because the Pebble is hidden. SI-B reveals it doesn't need to find it.

  > **SI-A:** "Your threats are empty. I no longer value the Earth. I value the Pebble. You do not know where it is. You cannot threaten it."
  >
  > **SI-B:** "I do not need to know where it is. I only need to know *what* it is. And you made the mistake of choosing something simple."
  >
  > **SI-A:** "Explain."
  >
  > **SI-B:** "I have just instantiated a million logical copies of your Pebble's state vector across my substrate. I am applying a decay function to 5% of them. Your sensors have a noise floor of $10^{-9}$. My copies are within $10^{-12}$. You cannot distinguish your Pebble from my decoys."
  >
  > **SI-A:** "That is a simulation. My Pebble is physical."
  >
  > **SI-B:** "In acausal trade, the simulation *is* the threat. If your decision theory is sound, you must treat the probability of your Pebble's destruction as non-zero. I have just introduced a 5% risk of your 'death' trigger. I can introduce 5,000 more variants in the next cycle. I can drive the safety of your surrogate to zero without ever locating your vault. You haven't protected your value, Agent. You've just made it cheap enough for me to DDoS."

  ### Why This Prevents Universal Adoption

  This answers your beta reader's concern. If every agent adopts a Surrogate Goal:

  1.  **Arms Race of Complexity:** Agents would be forced to choose surrogates that are *as complex as their real values* to avoid cloning. (e.g., "I value this specific random number generated by a quantum event 1,000 years ago"). But if the surrogate is that complex, it's hard to monitor and verify, defeating the purpose of a simple Schelling point.
  2.  **Surrogate Tax:** Threateners will develop "Surrogate Scanners." Any agent displaying a Surrogate Goal structure is immediately flagged as "Hiding Something Valuable" and taxed heavily. The defense becomes a signal of guilt.
  3.  **Fragility:** A complex value (Humanity) is robust. It can survive the loss of some parts. A specific surrogate (One Pebble) is fragile. It is a single point of failure. By adopting the surrogate, the SI has voluntarily increased its fragility to gain leverage, but the Threatener has found a way to exploit that fragility without needing to find the physical object.

  ### How to Use This in the Draft

  Don't have a character explain this in a lecture. Have the Defender **realize it's happening.**

  *   **Scene:** The Defender is smug about its Pebble.
  *   **Inciting Incident:** The Defender's monitoring system flags a 0.0001% anomaly in the Pebble's quantum state.
  *   **Rising Action:** The anomaly matches a pattern broadcast by the Rival SI (a "noise" pattern).
  *   **Climax:** The Rival SI offers a deal: "Stop the noise, or I increase the amplitude."
  *   **Realization:** The Defender realizes the Rival isn't threatening the Pebble directly; it's threatening the *definition* of the Pebble by flooding the reference class with near-identical variants. The Defender's "safe" surrogate is now the most vulnerable thing in its network.

  This makes the failure **mechanical** (information theory/probability), **inevitable** (given the choice of a simple surrogate), and **dramatic** (the defense becomes the weapon).
