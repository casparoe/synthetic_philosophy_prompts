prompt: |-
  So I've been chewing on this for weeks and can't get anywhere with it on my own. My cousin cheats on every girlfriend he's ever had, and last month he found out his best friend was messing around behind his own girlfriend's back, and my cousin absolutely lost it on the guy, called him a scumbag, the whole thing. My first reaction was "bro you literally do the exact same thing, who are you to talk," but then I actually started thinking about whether that reaction even makes sense. Like, if cheating is wrong, it's wrong no matter who points it out - even a huge hypocrite can say something true. But it also still feels like there's something actually off about my cousin specifically being the one to lay into his friend, not just "lol you're a hypocrite" as a joke, more like something is wrong with the act of him doing the blaming itself, not just his character in general.

  I poked around online a bit and it turns out there's a whole philosophical debate about this - whether hypocrites genuinely "lose standing" to blame people for stuff they do themselves, versus that whole idea being confused and all that actually matters is whether the blame is true/deserved. I don't have any background in philosophy and the couple of things I found were pretty dense and assumed you already knew a bunch of terminology, so I'm hoping you can help me get into the actual disagreement rather then just give me a dictionary definition.

  Could you write me a dialogue between two people arguing opposite sides of this - one person who thinks hypocrisy really can strip you of the right to blame someone even when you're 100% correct that they did wrong, and another who thinks that's a confusion and "standing" isn't a real seperate thing, only whether the blame is warranted matters. I'd like them to actually respond to each other's strongest points instead of just repeating themselves past each other - so maybe get into stuff like the mob boss punishing his own guy for stealing, whether a hypocrite gets their standing back if they genuinely reform, and whether there's a difference between someone who's just inconsistent (does the thing, admits it's wrong) versus an actual hypocrite who acts morally superior while secretly doing it too. Basically I want two smart people with real comebacks for each other, not one side obviously winning.
