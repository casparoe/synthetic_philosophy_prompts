prompt: |-
  so I get the basic gist of Al-Ghazali's occasionalism -- fire doesn't actually burn cotton, God just habitually creates the burning whenever the two touch (this is from the 17th discussion of the Tahafut, right?) -- but i want to understand how the argument actually works, not just the vibe of it. on the surface it sounds a lot like Hume's later point that we never observe any necessary connection between cause and effect, just constant conjunction. is Ghazali basically anticipating Hume's move 600 years early, or is there a real structural difference between the two arguments (like, Ghazali's is more about modal/logical possibility and God's power, while Hume's is about the limits of perception and inference)? also curious how this connects to why Ghazali cares so much about defending miracles -- does Hume's version of the argument leave room for that kind of move too, or does it just not work the same way for him?
