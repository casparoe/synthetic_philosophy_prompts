answer: |-
  # The Static Function Fallacy: Why Old Evidence Breaks the Bayesian Dream

  In the online rationalist diaspora, Bayes' theorem is often treated not merely as a tool for updating beliefs, but as a complete epistemology—a calculus of rationality that dissolves traditional philosophical puzzles. To be a "Bayesian" in this context is to believe that all evidential support can be modeled as conditionalization on a single, coherent credence function. Yet, amidst the reverence for $P(H|E)$, there is a conspicuous silence regarding the Problem of Old Evidence. Formulated most sharply by Clark Glymour in the 1980s, the problem strikes at the heart of the claim that Bayesianism is a *complete* theory of confirmation. If a piece of evidence $E$ is already known ($P(E)=1$), conditionalization dictates it cannot raise the probability of a new hypothesis $H$. Yet, the anomalous precession of Mercury's perihelion—known for decades before Einstein—undeniably confirmed General Relativity.

  This is not a mere technical glitch; it is a structural crisis. After forty years of debate, the persistence of the Problem of Old Evidence suggests that the rationalist dream of a single, static credence function is epistemologically insufficient. While the Garber-Jeffrey solution offers the most viable path forward, it does so only by conceding that Bayesianism cannot stand alone as a theory of learning. The problem is fatal not to probabilistic coherence, but to the claim that a static probability function can fully capture the dynamics of scientific confirmation.

  ### The Anatomy of the Impasse

  To understand the severity of the problem, one must recognize that Bayesian Confirmation Theory (BCT) is intended to be a general account of how evidence supports theory. In the standard model, $E$ confirms $H$ if and only if $P(H|E) > P(H)$. By the ratio formula, $P(H|E) = P(H \& E) / P(E)$. If $E$ is old evidence, the agent is certain of it, so $P(E) = 1$. Consequently, $P(H|E) = P(H \& E)$. Since $H$ entails $E$ (in the case of explanation), $P(H \& E) = P(H)$. Thus, $P(H|E) = P(H)$. The evidence provides no boost.

  This result contradicts the historical record. When Einstein showed that General Relativity entailed the 43 arc-seconds per century perihelion shift, the scientific community's confidence in the theory surged. If BCT cannot model this surge, it fails as a descriptive or normative theory of scientific reasoning. The rationalist tendency to ignore this is akin to ignoring friction in physics because the vacuum equations are more elegant. Eventually, friction matters.

  ### The Garber-Jeffrey Move: Paying the Price of Logical Ignorance

  The most sophisticated technical response comes from Daniel Garber, building on ideas by Richard Jeffrey. This approach denies the assumption of logical omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs. Garber argues that while Einstein knew the perihelion data ($E$), he did not initially know that his theory ($H$) entailed it. The "new evidence" was not $E$, but the logical relation $X$: "$H$ entails $E$."

  In this framework, the agent conditionalizes on $X$, not $E$. Since $P(X) < 1$ (the agent is unsure of the entailment), learning $X$ can raise the probability of $H$. Formally, if $P(H | H \vdash E) > P(H)$, confirmation occurs. This preserves the Bayesian machinery while accommodating the historical fact.

  However, this solution incurs a steep cost, often raised by critics like Colin Howson. By relaxing logical omniscience, we open the door to non-Bayesian constraints. Standard Bayesianism dictates *how* to update (conditionalization), but it does not dictate *what* the impact of learning a logical relation should be. There is no theorem in probability calculus that tells us how much $P(H)$ should rise when we learn $H \vdash E$. The magnitude of the confirmation boost becomes unconstrained by the formalism itself. It depends on the agent's prior over the logical relation, which is essentially a psychological variable, not a logical one.

  Critics argue this renders the theory vacuous. If the boost is determined by arbitrary priors over logical connections, Bayesianism loses its normative bite. It tells us to be coherent, but not how to value logical discovery. Yet, this criticism misses the deeper implication. The Garber-Jeffrey move succeeds only by admitting that Bayesianism is not a self-contained theory of inference. It requires an external account of logical learning. This is a heavy price for those who view Bayes as a "theory of everything," but it is an honest one. It acknowledges that deductive insight and probabilistic updating are distinct cognitive processes.

  ### The Counterfactual Turn: The Myth of the Ur-Prior

  The second family of solutions attempts to save the static function by relocating confirmation to counterfactual credences. Proponents like Colin Howson and Peter Urbach suggest we should ask: What would the agent's credence in $H$ be *if* she had not known $E$, holding everything else fixed? If $P_{counterfactual}(H|E) > P_{counterfactual}(H)$, then $E$ confirms $H$.

  This approach attempts to keep the Bayesian machinery intact by shifting the context of evaluation. It appeals to the intuition that Mercury's perihelion *would* have been surprising under Newtonian physics but expected under General Relativity.

  However, this solution faces the "subtraction problem," a worry that proves fatal to its coherence. To define the relevant counterfactual, we must "subtract" $E$ from the agent's web of belief. But beliefs are not independent atoms; they are a holistic web. $E$ (Mercury's orbit) is entangled with other beliefs about celestial mechanics, observation reliability, and background physics. How much do we subtract? Do we also remove the knowledge that Newtonian physics failed to predict $E$? If we keep the failure of Newtonian physics but remove $E$, the counterfactual scenario is incoherent. If we remove the failure of Newtonian physics, we have altered the background against which $H$ is judged.

  There is no principled, Bayesian way to perform this subtraction. Any method chosen will inevitably smuggle in the very intuitions about confirmation the theory was supposed to derive. We end up stipulating the counterfactual priors to yield the result we want (that GR is confirmed). This makes the account circular. It saves the formalism by sacrificing its objectivity. Unlike Garber-Jeffrey, which admits a limitation in the model, the counterfactual approach pretends the model works by relying on a mythical "innocent eye" that never existed. It asks us to evaluate evidence from a perspective the agent never held and arguably could not have held.

  ### The Verdict: The Static Function is Insufficient

  We are left with a choice between two costs. The counterfactual approach saves the static credence function but makes the theory arbitrary and psychologically unrealistic. The Garber-Jeffrey approach saves the normative force of conditionalization but admits that the static function is insufficient to capture logical learning.

  I argue that the persistence of the Problem of Old Evidence demonstrates that the latter cost is the truth we must accept: **no single, static credence function can play the role Bayesians assign it.**

  The rationalist conception of Bayesianism often treats the credence function as a container for all epistemic states. POE shows that this container is too rigid. Epistemic progress involves two distinct types of movement: shifting probabilities based on data (updating) and expanding the space of possibilities based on insight (learning). When Einstein formulated General Relativity, he did not just update on data; he changed the logical landscape. He introduced a new hypothesis that reorganized the relationship between existing data points. A static function $P$ defined over a fixed algebra of propositions cannot model the expansion of that algebra.

  The Garber-Jeffrey solution is superior to the counterfactual approach precisely because it acknowledges this limitation. By treating the logical relation "$H \vdash E$" as a new proposition $X$, it effectively expands the algebra. But this admission is fatal to the strong Bayesian claim that a single function governs all rational belief change. If we must add new propositions to the algebra to model confirmation, then confirmation is not just a matter of reshuffling existing credences; it is a matter of conceptual growth.

  Therefore, the Problem of Old Evidence is fatal to Bayesian Confirmation Theory *construed as a complete, static system*. It is not fatal to the use of probabilities in epistemology, but it destroys the hope that conditionalization on a fixed prior is the sole engine of rationality. The "boost" in confidence when old evidence supports a new theory comes from the realization that the hypothesis *unifies* what was previously disparate. This unification is a structural feature of the theory, not a probabilistic feature of the data.

  ### Conclusion

  The rationalist forums are right to revere Bayes' theorem as a norm of coherence, but wrong to treat it as a complete theory of evidence. The Problem of Old Evidence reveals that a static credence function cannot capture the dynamics of theory acceptance. The counterfactual solutions fail because they rely on arbitrary subtractions of belief that lack principled grounding. The Garber-Jeffrey solution succeeds only by admitting that Bayesianism requires supplementation by a logic of discovery and logical learning.

  We should not view this as a defeat for probabilistic reasoning, but as a maturation. The cost worth paying is the abandonment of the "static function" ideal. We must accept that rational agents are not logically omniscient and that learning the implications of our own theories is a cognitive act distinct from conditionalizing on new data. Bayes' theorem remains the correct logic of consistency, but it is not the whole logic of science. To pretend otherwise is to ignore the friction of actual inquiry for the sake of a vacuum-sealed equation.
