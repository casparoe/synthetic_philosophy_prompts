      *   *Difference 2 (Constitutive Aims):* Belief has a widely accepted constitutive aim (truth). Admiration's aim is less clear (is it to detect value? or just to respond?). If belief *constitutively* cannot respond to pragmatic reasons (Shah & Velleman), then WKRs aren't just "wrong kind," they are *no reasons for belief at all*. In value theory, the demon *does* give a reason to admire, it's just not a reason that makes the object good.
      *   *Difference 3 (Extensionality):* In value theory, we want to know if the mud is *good*. In epistemology, we want to know if the belief is *justified*. The demon case in value theory shows the mud isn't good. The demon case in belief shows the belief isn't justified (epistemically).

