      *   *(Refining the Mom's argument):* Acknowledge where she's coming from (Consequentialism) but show why it's shallow. She views detention as "time in a chair." It's actually "loss of privilege due to misconduct."
      *   *(The "Substitution" problem):* Use the analogy of paying a speeding ticket. You can pay someone else's fine, but you can't serve someone else's jail time (usually). Why? Because jail is about the person. Detention is more like jail than a fine.
      *   *(Novel Application):* Give specific angles for the character. Maybe the character focuses on Sam's arrogance, or the danger of setting a precedent.

  6.  **Final Polish:**
