answer: |-
  The standard narrative surrounding acausal trade relies on a category error regarding what constitutes a "cause" in the context of decision-making agents. The LessWrong orthodoxy claims that because Agent A cannot send a photon to Agent B across Everett branches or cosmological horizons, there is no causal link, and therefore Causal Decision Theory (CDT) must fail. This framing is misleading. It conflates the *transmission of information at the moment of decision* with the *causal origin of the decision procedure itself*.

  The position I am advancing is this: Acausal trade is not a new phenomenon requiring exotic decision theories like Functional Decision Theory (FDT) or Updateless Decision Theory (UDT). It is simply ordinary correlated behavior arising from a Reichenbachian common cause located in the past—specifically, in the design, selection, or logical instantiation of the agents' source code. A sufficiently reflective CDT agent, capable of self-modification or type-level reasoning, does not need to abandon causal ontology to capture these gains. It merely needs to recognize that the locus of causal control is the algorithm's design, not the specific token output.

  ### The Reichenbachian Structure of "Acausal" Correlation

  Hans Reichenbach's Common Cause Principle states that if two events are probabilistically correlated but neither causes the other, there exists a common cause in their past that screens off the correlation. The proponents of acausal trade argue that logical correlation (e.g., two agents running the same algorithm) violates this because mathematical truths are not spatiotemporal events. They claim logical necessity is "acausal."

  This is a confusion of the map and the territory. While the *logical truth* (e.g., $2+2=4$) is abstract and acausal, the *physical instantiation* of that logic in a computing substrate is a spatiotemporal event. If Agent A and Agent B are both running `Algorithm_X`, the correlation between their outputs is not magic. It is screened off by the causal history that led both agents to instantiate `Algorithm_X`.

  Consider two cases:
  1.  **Shared Design:** Both agents were built by the same civilization or optimization process. The "common cause" is the designer or the evolutionary pressure that selected for `Algorithm_X`.
  2.  **Convergent Evolution:** The agents arose independently but converged on the same optimal strategy. The "common cause" is the universal laws of mathematics and physics that make `Algorithm_X` the unique solution to the optimization problem.

  In both cases, the correlation is grounded in physical history. The reason Agent A cooperates and Agent B cooperates is not because A's decision *reached out* to B. It is because the causal chain that produced A and the causal chain that produced B intersect at the level of the algorithm's specification. When A reasons about B, A is not engaging in sorcery; A is using evidence about its own internal structure to infer the state of a physically similar system elsewhere. This is standard inductive inference, fully compatible with a causal worldview.

  ### Rehabilitating Causal Decision Theory

  The standard critique is that CDT fails here because it asks, "Does my pressing 'Cooperate' *cause* B to press 'Cooperate'?" Since the answer is no (no signal crosses the gap), CDT defects. This critique assumes CDT is restricted to reasoning about *token actions* (the specific button press at time $t$).

  However, a reflective CDT agent reasons about *policies* and *self-modification*. CDT allows an agent to modify its own source code if doing so maximizes expected utility. A CDT agent *ex-ante* (before the trade scenario arises) recognizes that if it modifies itself to be the kind of agent that cooperates in acausal trade scenarios, it will correlate with other similar agents and reap the benefits.

  Therefore, the "decision" to cooperate in an acausal trade is actually the execution of a past causal commitment. The agent cooperates now because it causally modified itself in the past to be a cooperator. The correlation is maintained because the other agent did the same. The "acausal" trade is just the cashing out of a causal pre-commitment strategy. FDT and UDT are essentially formalisms that hardcode this reflective consistency, but they do not introduce new ontology. They are simply computing what a CDT agent *would have built itself to be* if it had the chance.

  If you argue that the agent didn't have a chance to self-modify, you are positing a "born" agent. But even a born agent has a causal origin (genetics, training data, initial weights). If the agent recognizes that its decision procedure is logically isomorphic to another's, it recognizes that its "decision" is actually a sampling of a shared causal type. To defect is to assert that *this* token instance is special, which contradicts the evidence that the decision is determined by the shared algorithm. A CDT agent that respects the causal determinism of its own cognitive machinery must acknowledge that "choosing" to defect implies the other agent (running the same machinery) also defects. It's not that my choice *causes* theirs; it's that my choice *reveals* the output of the common causal engine we both instantiate.

  ### Grappling with the Logical/Physical Objection

  The strongest objection to this Reichenbachian view is that logical correlation feels different from physical correlation. If two agents compute the same function, they match even if they have no shared physical history (e.g., one is human, one is alien, no common ancestor). In this case, what is the Reichenbachian common cause? There is no designer.

  Here, the "common cause" is the structure of logical space itself, instantiated in physical law. This sounds mystical, but it need not be. The "cause" is the constraint that physical systems capable of reasoning must adhere to logical consistency to function. If Agent A and Agent B are both rational utility maximizers, the "common cause" of their correlation is the mathematical necessity that there is only one optimal solution to the game they are playing.

  However, we can be more rigorous. For two agents to engage in acausal trade, they must model each other. This modeling requires a shared ontology. If Agent A can reason about Agent B, Agent A must contain a simulation or a logical model of Agent B. This model is a physical structure in Agent A's brain/computer. The correlation exists because Agent A's decision is causally dependent on the output of that internal model. Agent A cooperates because its internal simulation of B predicts B will cooperate *if* A cooperates.

  This breaks the "acausal" spell. The trade is happening *inside* Agent A's head, projected outward. Agent A cooperates because doing so aligns with the causal output of its internal model of the multiverse. If the model is accurate, the correlation holds. If the model is wrong, the trade fails. But the mechanism is entirely causal: the physical state of Agent A's model determines Agent A's action. The "acausal" partner is just a variable in Agent A's causal graph.

  ### The Illusion of Acausality

  The reason the rationalist community insists on "acausal" terminology is that they want to preserve the intuition that the agent has "control" over logical facts. They want to say, "I make $2+2=4$ true by choosing it." This is a category mistake. Agents do not make logical facts true; they discover them.

  When an FDT agent "cooperates" in a Prisoner's Dilemma against a copy of itself, it is not causing the copy to cooperate. It is recognizing that the copy's action is already fixed by the same logical constraints that fix its own. The "decision" is an epistemic update about which logical world is actualized, not a causal intervention on the other agent.

  By framing this as "acausal influence," proponents obscure the fact that the work is being done by *correlation*, not *causation*. And correlations, per Reichenbach, imply common causes. In the case of logical agents, the common cause is the shared logical structure instantiated in their physical substrates.

  ### Conclusion

  Acausal trade does not require us to jettison Causal Decision Theory. It requires us to apply CDT rigorously to the *source* of agency rather than the *symptom* of agency. The correlation between agents is not a spooky action at a distance; it is the inevitable result of shared design, shared laws, or shared logical constraints that act as Reichenbachian common causes.

  The "exotic" decision theories are merely patching over a failure to model the agent's own decision procedure as a causal object. Once you treat your own algorithm as a physical effect of a past cause (design/evolution/logic), and recognize that the other agent is an effect of the same cause, the "trade" becomes a standard problem of coordinating based on common evidence. There is no need to invoke acausal magic. The universe is causal all the way down; even our reasoning about logic is a physical process subject to causal history. Acausal trade is just causal trade where the causal link is the shared architecture of reason itself.
