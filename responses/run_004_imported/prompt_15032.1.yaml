      *   **Core Tenet:** The brain minimizes variational free energy (which bounds surprise/prediction error).
      *   **The "Dark Room Problem":** This is a famous objection to FEP. If the goal is to minimize surprise, why don't organisms just sit in a dark, quiet room forever?
      *   **The Solution:** *Expected* Free Energy. Organisms don't just minimize *current* surprise; they minimize *expected* future surprise. This requires gathering information (epistemic value) to reduce uncertainty about the world. This drives exploration and curiosity.
