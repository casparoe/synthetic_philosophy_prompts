  7.  **Final Polish:** Check for clarity on the "eight grades." (Actually, in *De Mendacio* he lists 8, in *Contra Mendacium* he condenses/refines). Ensure the distinction between "lying" and "keeping silent" is highlighted as the practical takeaway for the writer.

