  **MEMORANDUM**

  **TO:** Student Government Rules Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Econ Club Futarchy Proposal (Green Fund Allocation)

  **Recommendation**
  I recommend we **Adopt-with-Conditions**. Specifically, we should authorize the prediction market mechanism only as an **advisory signal** to the Senate, prohibit **real-money wagering** (using capped play-money or points instead), and enforce a strict **insider trading ban** on project implementers. We cannot accept the proposal as submitted (binding outcome with real money).

  **Rationale**
  The Econ Club's proposal applies Robin Hanson's "futarchy" model: voters set the metric (emissions reduction), and the market selects the policy (solar vs. bike-share). Theoretically, this is sound. As the pro-market faction on this committee argued, aggregation of scattered information via market prices often outperforms small-committee voting, which is susceptible to "vibes," rhetoric, or concentrated lobbying. In a perfect environment, a market price represents the collective probability of success, incentivizing participants to research rather than grandstand.

  However, we must implement safeguards to ensure this experiment serves the student body rather than exposing us to liability or manipulation.

  **Engagement with the Pro-Futarchy Position (Rejected Aspect)**
  While I am recommending we proceed with the market mechanism, I am explicitly **rejecting the Pro-Futarchy faction's insistence on a *binding* market outcome with *real money*.** I understand the theoretical argument here: Hanson posits that for a market to be efficient, incentives must be real, and the decision must be automatic to prevent political interference.

  However, applying this strictly in a student government context fails on three practical grounds that outweigh the theoretical benefits:

  1.  **Liquidity and Manipulation:** A prediction market requires depth to be accurate. With only a few hundred potential student participants, the market is "thin." A small coalition of wealthy students or external actors could manipulate the price to win the contract, regardless of the project's actual merit. In a thin market, "betting on beliefs" becomes "betting on bankroll."
  2.  **The Insider Problem:** The proposal notes that project implementers have private info/control. If the Bike-Share club knows the City is about to approve new lanes (boosting their value), they could trade on this before public announcement. In a binding market, this isn't just unfair; it creates a moral hazard where clubs are incentivized to sabotage competitors to shift market odds.
  3.  **Fiduciary Accountability:** As a Rules Committee, we cannot abdicate our fiduciary duty. If the market chooses a project that later fails or violates university policy, the Senate must retain the authority to intervene. A "no override" clause binds us to outcomes we may be legally obligated to stop.

  **Mitigation Conditions**
  To address the Skeptics' valid concerns while preserving the Pro-Market innovation, I propose the following conditions:

  *   **Advisory Only:** The market result serves as a strong recommendation to the Senate, but the Senate retains final voting authority. This preserves democratic accountability.
  *   **Play-Money/Capped Stakes:** To avoid gambling violations and reduce manipulation incentives, use a closed-loop point system or cap real wagers at nominal amounts (e.g., $5 max).
  *   **Information Embargoes:** Project proponents must disclose material information to the Committee before trading begins, and are barred from trading once the market opens.

  **Conclusion**
  This approach allows us to test whether prediction markets can improve our decision-making without risking the integrity of the Green Fund or violating university policy. We gain the informational benefits of the market without accepting the risks of a binding, thin-market gamble.

  **Action Item**
  Motion to approve the Econ Club proposal *contingent* on the Advisory, Play-Money, and Insider-Ban conditions outlined above.
