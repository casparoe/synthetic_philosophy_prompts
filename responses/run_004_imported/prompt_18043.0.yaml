          *   **Incentive Alignment:** Do students care enough about Green Fund outcomes to bet real money? Probably not. The stakes are too low for the effort, or too high for risk-averse students.
          *   **Insider Trading/Manipulation:** The proposal admits implementers have private info/control. If the Bike Share club knows the university just banned scooters, they know their value will go up. If they trade on that before announcing it, that's insider trading. If they sabotage the solar panels to make their shares win, that's moral hazard.
          *   **Resolution:** How do you measure "emissions cut" accurately and quickly enough to settle the bet? If it takes 5 years to know if the solar panels actually cut more carbon than the bike share, the market is stuck open forever, or requires a trusted oracle (which defeats the decentralization point).
          *   **Legal/Policy:** Real-money betting by students might violate university policy or state gambling laws.
          *   **Democratic Accountability:** "No override" removes the elected body's ability to correct for market failure or unforeseen consequences. This is risky for a fiduciary body.

