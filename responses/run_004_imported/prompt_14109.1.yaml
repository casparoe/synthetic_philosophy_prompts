answer: |-
  This is a sophisticated intersection of formal epistemology and the practical heuristics of the rationalist community. You are correct that David Lewis's **Principal Principle (PP)** provides the structural framework for this debate, even if Lewis himself would have balked at applying it to social epistemology.

  The core tension you identify—between the "modest" deference to aggregates and Yudkowsky's "inside-view" confidence—is essentially a dispute over what counts as **admissible evidence** relative to the "chance" function represented by the prediction market.

  Here is an analysis of the implications of the Principal Principle and the admissibility problem for your specific scenario (Metaculus at 70% vs. private evidence).

  ### 1. Mapping the Principal Principle to Prediction Markets

  First, we must translate Lewis's metaphysical terms into epistemic ones.
  *   **Lewis's $X$:** The proposition that the *objective chance* of event $A$ is $x$.
  *   **Lewis's $E$:** Your total evidence, provided it is *admissible*.
  *   **The Principle:** $C(A | X \& E) = x$. (Your credence in $A$, given the chance is $x$ and you have admissible evidence $E$, should be $x$.)

  **The Translation:**
  In the context of rationalist debate, a well-calibrated prediction market (Metaculus) is not an "objective chance" in Lewis's sense (a propensity of nature). It is an **epistemic aggregate**. To apply PP here, we treat the market price as a proxy for objective chance, or we invoke the **Expert Principle** (a generalization of PP), which states you should defer to an expert (the market) unless you have evidence the expert doesn't have or shouldn't trust.

  If you accept the market as a "chance-setter," PP dictates that your credence should match the market price (70%) **conditional on your private evidence being admissible.**

  ### 2. The Admissibility Criterion: Crystal Balls vs. Inside Views

  Lewis defines admissible evidence roughly as evidence that bears on the outcome *only* by bearing on the chances. Inadmissible evidence bears on the outcome *directly*, bypassing the chance process.
  *   **The Crystal Ball:** If you look in a crystal ball and see the outcome, that is inadmissible. It tells you the future without telling you about the propensities leading up to it.
  *   **The Market:** The market price is a summary of the *past and present* information processed through incentives. It is evidence about the *chance*.

  **The Implication for Private Evidence:**
  The admissibility problem arises when you try to categorize your private evidence ($E_{private}$).
  1.  **Is $E_{private}$ about the chance?** (e.g., "I know the market is illiquid today.") If yes, it is admissible. You update the chance, not the outcome directly.
  2.  **Is $E_{private}$ about the outcome?** (e.g., "I work at the company and know the product launch failed.") If yes, relative to the market, this functions like a crystal ball.

  **The Crucial Lewisian Insight:**
  If the market is truly well-calibrated and efficient, it has already incorporated all *admissible* public evidence. Therefore, any private evidence you have that points to a different outcome is, **relative to the market**, inadmissible. It is "future-looking" information that the chance process (the market) has not yet digested.

  **Implication:** If you treat the market as the authoritative "chance" function, PP demands you defer to the 70% *unless* you can justify that your private evidence is of a type that overrides chance (i.e., you possess a working crystal ball).

  ### 3. The Unresolved Admissibility Problem and Weighting

  Lewis famously admitted he could not provide a rigorous definition of admissibility. He offered intuitions (no information from the future), but no algorithm. This vagueness is precisely where the "Modesty vs. Inside View" debate lives.

  #### A. The Modest Epistemology Position (Hanson/Standard PP)
  The modest view treats the market as the $X$ (Chance).
  *   **Argument:** Your brain is a noisy predictor. The market is a calibrated aggregator. Your "hunch" or "different reference class" is likely cognitive bias or noise.
  *   **Admissibility Verdict:** Your private evidence is treated as *inadmissible noise* relative to the market's chance. Just as you wouldn't update on a crystal ball you suspect is broken, you shouldn't update on a hunch that contradicts a calibrated aggregate.
  *   **Weighting:** Near 100% to the market. You only deviate if you have hard, verifiable inside information (true "crystal ball" data).

  #### B. The Yudkowsky/Inside-View Position
  Yudkowsky's critique of modesty argues that the market is not a metaphysical chance function; it is a collection of other humans.
  *   **Argument:** The market can be systematically wrong due to shared blind spots (common priors, shared reference classes). Your "different reference class" isn't inadmissible evidence; it is a **correction to $X$**.
  *   **Admissibility Verdict:** You are not claiming to have inadmissible evidence about the *outcome*; you are claiming to have admissible evidence that the *chance* (market price) is miscalculated. You are arguing that $X \neq 70\%$, not that $E$ overrides $X$.
  *   **Weighting:** You weight your inside view heavily if you believe your model of the world captures causal mechanisms the market is ignoring.

  ### 4. Practical Implications for Your Decision

  How does the Principal Principle help you settle the weight in your specific case (Metaculus 70% vs. Private Info)?

  #### 1. Distinguish "Evidence about Chance" from "Evidence about Outcome"
  PP implies you should only override the market if you are updating the *chance*, not bypassing it.
  *   **Scenario:** You have a hunch based on a pattern.
  *   **PP Check:** Is this pattern a causal mechanism the market *missed* (updating $X$), or is it just a prediction of the outcome that conflicts with the market's probability (inadmissible $E$)?
  *   **Action:** If you cannot articulate *why* the market missed the pattern (the causal link), PP suggests you should treat your hunch as inadmissible noise and defer to the 70%.

  #### 2. The "History of the World" Constraint
  Lewis suggests admissible evidence is restricted to the history of the world up to the present.
  *   **Inside Information:** If your job gives you facts about the present state of affairs that the market doesn't know, this is technically "history up to the present." It is admissible. The market price is no longer the true $X$ because the market is operating on incomplete history.
      *   **Weight:** High weight to private info. The market $X$ is false relative to your total state.
  *   **Reference Classes:** Choosing a reference class is a modeling decision, not a historical fact. If the market uses Reference Class A and you use Reference Class B, you are disputing the calculation of $X$.
      *   **Weight:** Proportional to your confidence in your modeling vs. the crowd's. PP doesn't solve this; it highlights that you are fighting over the definition of Chance, not the application of it.

  #### 3. The Burden of Proof for Inadmissibility
  Because Lewis leaves admissibility vague, the burden of proof falls on the agent claiming their evidence overrides the aggregate.
  *   **Implication:** In the absence of a clear theory of admissibility, the default rational stance (Modesty) is to assume your private cognitive output is *less* reliable than the aggregate.
  *   **Yudkowsky's Counter:** This default assumes the aggregate is a "black box" chance generator. If you can open the box (understand the market participants' reasoning) and find a flaw, your evidence becomes admissible evidence of *market error*.

  ### 5. Summary Recommendation

  The Principal Principle does not give you a formula to calculate the exact weight (e.g., "60% market, 40% inside"). Instead, it provides a **conditional constraint**:

  1.  **If you accept the Market Price as Objective Chance ($X$):** You must defer to 70%. Any private evidence ($E$) that contradicts this is, by definition, inadmissible (like a crystal ball) unless you can prove it reveals a flaw in the chance setup itself.
  2.  **If you view the Market as Fallible Experts:** You are not bound by PP strictly, but by the Expert Principle. You should defer unless you have specific reason to believe the experts are missing information you possess.

  **The Synthesis for Your Position:**
  *   **Hard Inside Info:** If your private info is factual data the market physically cannot have (e.g., non-public financial data), treat the market price as *incorrect* ($X \neq 70\%$). Weight your info heavily.
  *   **Hunches/Patterns:** If your private info is interpretive (a hunch, a reference class choice), Lewis's vagueness on admissibility suggests a **presumption of modesty**. Since you cannot rigorously prove your hunch is "admissible evidence about chance" rather than "inadmissible noise about the outcome," the PP framework supports deferring to the aggregate.
  *   **The Yudkowsky Exception:** You only override the market if you can explicitly model *why* the market's chance function is broken. You must move the debate from "I have private evidence $E$" to "The market's calculation of $X$ is wrong because..."

  In short: **PP favors modesty when your private evidence is interpretive, but permits inside-view dominance when your private evidence reveals the market's "chance" calculation is based on incomplete history.** The unresolved admissibility problem means you must rely on meta-epistemic judgment to decide which category your evidence falls into.
