prompt: |-
  A live debate on rationalist blogs concerns how much weight to give one's own inside-view judgment versus deferring to well-calibrated aggregates such as prediction markets — precisely the question Eliezer Yudkowsky raises in his writing against what he calls "modest epistemology." I think David Lewis's Principal Principle is directly relevant here, but I can't quite work out how. Lewis ties rational credence to objective chance only via evidence that is "admissible," and he offers a working crystal ball as his paradigm case of inadmissible evidence, yet he is notoriously vague about how to draw that line for anything less exotic. Suppose a well-calibrated Metaculus question sits at 70 percent, and I have some private consideration — inside information from my job, a hunch based on a pattern I've noticed, or simply a different reference class I trust more — that isn't priced into that number. Could you set out the most important implications of the Principal Principle, and of the unresolved admissibility problem specifically, for how much weight someone in my position should give the market price versus their own private evidence when settling on a final credence?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Context:** A debate on rationalist blogs about inside-view judgment vs. outside-view aggregates (prediction markets like Metaculus).
      *   **Reference Point:** Eliezer Yudkowsky's critique of "modest epistemology" (arguing for trusting one's own reasoning over deference).
      *   **Philosophical Tool:** David Lewis's *Principal Principle* (PP).
      *   **Specific Problem:** The user sees PP as relevant but is stuck on the *admissibility* clause. Lewis uses a "crystal ball" as inadmissible, but real-world cases (private info, hunches, reference classes) are murky.
      *   **Scenario:** Metaculus says 70%. User has private evidence (inside info, hunch, different reference class).
      *   **Task:** Explain the implications of PP and the admissibility problem for weighting market price vs. private evidence.

  2.  **Analyze the Principal Principle (PP):**
      *   *Formula:* $C(A | X \& E) = x$, where $C$ is credence, $A$ is the proposition, $X$ is the proposition that the objective chance of $A$ is $x$, and $E$ is *admissible* evidence.
      *   *Core Idea:* If you know the objective chance, your credence should match it, *unless* you have inadmissible evidence.
      *   *The Catch:* What counts as "objective chance" in a social/epistemic context (like a prediction market)? And what counts as "admissible"?

  3.  **Bridge PP to Prediction Markets:**
      *   *Challenge:* Prediction markets aren't "objective chances" in the Lewisian sense (propensities of nature). They are *epistemic* aggregates.
      *   *Adaptation:* We need to treat the market price as a proxy for objective chance or as a highly reliable expert opinion. Let's treat it as a "chance-like" indicator for the sake of the argument, or invoke the *Expert Principle* (a generalization of PP).
      *   *Admissibility in this context:* Evidence is admissible if it doesn't give you information about the *outcome* that bypasses the *chance* (or market mechanism).
      *   *Crystal Ball:* Inadmissible because it tells you the future directly, bypassing the chance process.
      *   *Market Price:* Represents the aggregate of public (and some private) information processed through incentives.

  4.  **Tackle the Admissibility Problem:**
      *   Lewis's vagueness is famous. He suggests admissible evidence is about the *history* of the world up to the present, not the *future*.
      *   *Inside View/Private Info:* Is it admissible?
          *   If the market *could* have incorporated it but didn't (inefficiency), is it admissible?
          *   If it's truly private (insider trading), it functions like a crystal ball relative to the market.
      *   *Hunches/Patterns:* These are tricky. If the hunch is based on past data the market also has, it's admissible. If it's a "gut feeling" about the future, it looks like a mini-crystal ball.
      *   *Reference Classes:* Choosing a different reference class is a modeling choice. Is it evidence about the world or evidence about the *chance*?

  5.  **Synthesize Implications for the User's Scenario:**
      *   *Implication 1: The Default Deference.* If the market is treated as the "chance" setter, PP says defer to it *unless* you have inadmissible evidence.
      *   *Implication 2: Defining Inadmissibility.* Private info that the market *missed* is effectively inadmissible relative to the market's efficiency. It's "future-looking" relative to the market's current state.
      *   *Implication 3: The "Modesty" vs. "Inside View" Tension.*
          *   Modesty (Hanson/Yudkowsky's target): Treat the market as the chance. Your private info is likely noise (inadmissible in the sense of being unreliable).
          *   Inside View (Yudkowsky): Your private info might be *better* than the market's aggregation.
      *   *Implication 4: Resolution.* PP doesn't solve the weighting; it frames the condition. You defer if your evidence is "admissible" relative to the chance process. But if your evidence suggests the "chance" (market price) is *wrong*, you are effectively challenging the $X$ proposition, not just adding $E$.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. Connect Lewis to the Rationalist debate.
      *   *Section 1: The Principal Principle Refresher.* Define $C(A | XE) = x$. Explain $X$ (chance) and $E$ (admissible evidence).
      *   *Section 2: Mapping Markets to Chance.* This is crucial. Markets aren't propensities. They are epistemic summaries. We need to shift from PP to the *Expert Principle* or treat the market as a "black box chance generator."
      *   *Section 3: The Admissibility Criterion.* What makes evidence inadmissible? Information about the future that bypasses the chance process.
          *   *Crystal Ball:* Direct future info.
          *   *Market:* Aggregated info.
          *   *Private Info:* If it's *about the outcome* and not *about the chance*, it's inadmissible relative to the market.
      *   *Section 4: Applying to the 70% Metaculus Case.*
          *   *Case A: Inside Info.* If you know something the market doesn't, the market price is no longer the true "chance" relative to your total state. You aren't violating PP; you are updating $X$.
          *   *Case B: Hunches/Reference Classes.* This is where modesty kicks in. Is your hunch reliable? If not, it's noise. PP says ignore noise if you trust the chance.
      *   *Section 5: Yudkowsky vs. Modesty through Lewis.*
          *   Modesty says: Market = Chance. Your brain = Noisy/Inadmissible.
          *   Yudkowsky says: Your brain can model the chance better than the market.
          *   Lewis's Verdict: If you believe the market is well-calibrated (Chance = 70%), you must defer *unless* your evidence is of a type that overrides chance (inadmissible). But if your evidence suggests the market is *miscalibrated*, you are disputing $X$, not $E$.
      *   *Section 6: Practical Heuristics.* How to actually weigh them?
          *   Check for market inefficiency (can your info be traded?).
          *   Check for bias (is your hunch actually a bias?).
          *   The "Pre-computation" view: The market has already processed the admissible evidence.

  7.  **Refining the Philosophy:**
      *   *Correction:* I need to be careful not to say private info is strictly "inadmissible" in Lewis's metaphysical sense. It's inadmissible *relative to the market acting as the chance function*.
      *   *Key Distinction:* Evidence about the *chance* vs. Evidence about the *outcome*.
      *   *Market as Chance:* If the market is perfect, private info about the outcome *is* inadmissible (like a crystal ball). If the market is imperfect, the market price isn't the true objective chance.
      *   *The "Unresolved" part:* Lewis never solved admissibility. This means there is no formal algorithm for weighting. It relies on a prior judgment about the reliability of the "chance" source vs. the "private" source.

  8.  **Final Polish:** Ensure the tone is analytical, respectful of the philosophical depth, and directly answers the "how much weight" question (even if the answer is "it depends on your meta-epistemology"). Structure with clear headings. (Self-Correction: Make sure to explicitly mention the *Expert Principle* as it's more applicable than PP for social aggregates).

  9.  **Final Review against constraints:** The user asked for implications of PP and the admissibility problem specifically. Don't drift too far into general betting advice. Keep it anchored in Lewisian epistemology.

      *   *Key Insight to highlight:* PP implies that if you accept the market as the "chance," you *must* defer unless your info is "inadmissible" (i.e., superior/direct). But since "admissibility" is vague, the burden of proof lies on claiming your info overrides the aggregate.

