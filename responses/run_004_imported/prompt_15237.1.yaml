answer: |-
  **MEMORANDUM**

  **TO:** Trust & Safety Leadership
  **FROM:** [Your Name], Policy Team
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation: Transitioning from Word-Based to Conduct-Based Enforcement

  **Executive Summary**
  Our current slur policy relies on a rigid blocklist that auto-removes content containing specific terms. While this offers operational consistency, it is failing on two fronts: it creates harmful false positives (silencing survivors, reclaiming communities, and artists) and it is easily bypassed by bad actors using obfuscation. I recommend we transition from a **Word-Based Prohibition** to a **Conduct-Based Enforcement** model. This retains the scalability of automation for clear-cut harassment while introducing "Safe Harbors" for protected contexts.

  **The Problem with Status Quo**
  The Blocklist Team is correct that automation provides consistency and scale. However, consistency in error is not a virtue. Currently, our policy punishes the *presence* of a word rather than the *intent* of the speech. This disproportionately harms the vulnerable users we aim to protect (e.g., DV survivors reporting abuse, marginalized groups reclaiming language). Furthermore, because the filter is binary, bad actors easily evade it via leetspeak or spacing, rendering the safety benefit negligible while the collateral damage is high.

  **The Risk of Pure Contextual Review**
  The Context Team is correct that intent matters. However, requiring human review for every instance is not scalable, and requiring identity verification to prove "reclamation" status is a privacy violation we cannot endorse. We cannot build a policy that requires users to prove their identity to speak.

  **Recommendation: Tiered Enforcement with Safe Harbors**
  We will maintain an automated detection list, but we will change the *action* triggered by detection. We will categorize terms into Tier 1 (Severe) and Tier 2 (Context-Dependent), and establish three explicit Safe Harbors.

  **1. Tiered Automation**
  *   **Tier 1 (Severe Slurs):** Auto-remove. These terms have negligible non-hate use cases on our platform.
  *   **Tier 2 (Reclaimable/Quotable Terms):** Do **not** auto-remove. Flag for priority human review. If review queue exceeds SLA, rate-limit visibility rather than deleting.

  **2. Explicit Safe Harbors (Allowable Contexts)**
  Moderators and automated classifiers must allow Tier 2 terms if the post falls into these categories:
  *   **Reporting:** The user is reporting harassment directed at them or others (e.g., "He called me a [term]").
  *   **Reclamation:** The user is self-identifying or addressing their own community (e.g., "We don't let them call us [term] anymore").
  *   **Educational/Artistic:** The content is clearly artistic (lyrics) or educational (discussing the history of the word).

  **3. Moderator Heuristics**
  To ensure consistency without identity checks, moderators will apply the **"Target & Power" Test**:
  *   *Who is the target?* (Is the term directed *at* a protected group or used *by* them?)
  *   *What is the power dynamic?* (Is this a pile-on or a defense?)
  *   *Is the word the point, or is it evidence?* (If the word is evidence of abuse, it is allowed.)

  **Implementation Plan**
  *   **Week 1:** Move all Tier 2 terms from "Auto-Delete" to "Flag for Review."
  *   **Week 2-4:** Train moderation staff on the "Target & Power" heuristics using the recent false positives as case studies.
  *   **Month 2:** Audit bypass rates. If obfuscation increases, tune detection patterns rather than lowering the threshold for deletion.

  **Conclusion**
  This approach respects the Blocklist Team's need for scalability by keeping automation in place for high-confidence harassment. It respects the Context Team's need for nuance by removing the penalty for reclaimed or reported speech. Most importantly, it aligns our enforcement with actual harm reduction rather than keyword hygiene.

  **Decision Required:** Approval to begin re-categorizing the current blocklist into Tiers 1 and 2 by EOD Monday.
