prompt: |-
  I got moved onto my company's trust and safety policy team three weeks ago and immediately inherited a mess nobody wanted to own. Our slur policy right now is a giant blocklist -- if a post contains certain words its auto-removed, full stop, regardless of who posted it or why. In the last two weeks alone that's nuked a domestic violence survivor quoting exactly what her ex called her in a post warning other women about him, a musician's label re-uploading a song that had been live for years with zero issues, and a couple of queer creators using a word for themselves that I use for myself too, honestly, which is probably why this one's gotten under my skin more then the average work problem. Meanwhile everyone knows people dodge the filter with spacing and lookalike letters, so it's not even reliably catching the harassment it's supposedly there for.

  Half the team wants to just keep patching the blocklist, since at least it's consistent, cheap, and can't be talked around by anyone claiming special context. The other half wants something that looks at who's posting, who it's aimed at, and whether it reads as reclaiming or reporting or quoting versus attacking -- except nobody on that side can explain how a filter, or even a human reviewer at our volume, is supposed to tell any of that apart without asking millions of strangers to prove their identity, which obviously isn't happening.

  My manager wants a one-page recommendation from me by Friday, something more principled than 'we'll know it when we see it,' with rules a moderator could actually apply the same way twice. Could you draft that memo for me? I need it to land on an actual recommendation, not just 'it depends,' and I want it to take the blocklist side seriously rather than treating them as lazy or callous, since if I'm honest I was leaning against them before I had to defend it in writing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** New member of Trust & Safety (T&S) policy team (3 weeks in).
      *   **Problem:** Inherited a broken slur policy (rigid blocklist causing false positives: DV survivors, musicians, queer reclamation). The blocklist is easily bypassed (leetspeak, spacing) so it fails at stopping actual harassment.
      *   **Internal Conflict:**
          *   *Side A (Blocklist):* Wants to keep patching the list. Arguments: Consistency, cheap, scalable, no ambiguity.
          *   *Side B (Contextual):* Wants context-aware enforcement (intent, identity, target). Arguments: Nuance, fairness. Problem: Hard to scale, privacy issues (identity proof), subjective.
      *   **Manager's Ask:** One-page recommendation by Friday. Needs to be principled, actionable (rules moderators can apply consistently), and decisive (not "it depends").
      *   **User's Stance:** Initially leaned against the blocklist, but now sees the validity in the Blocklist Side's concerns (consistency/scalability). Wants to treat Side A seriously, not dismissively.
      *   **Goal:** Draft the memo.

  2.  **Determine the Strategy:**
      *   *The "Third Way":* A pure blocklist is broken (as evidenced by the user's examples). A pure contextual model is impossible at scale without massive resources/privacy invasions. The recommendation needs a hybrid approach that prioritizes *harm reduction* over *word policing*.
      *   *Core Principle:* Shift from "Prohibited Words" to "Prohibited Conduct." This is industry best practice (e.g., Meta, Twitter/X, TikTok all struggle with this, but the principle holds).
      *   *Addressing Side A:* Acknowledge that automation is necessary for scale and consistency. Don't throw out the blocklist entirely; refine its *trigger* action.
      *   *Addressing Side B:* Acknowledge that context matters. Implement a "human-in-the-loop" for edge cases without requiring identity verification.
      *   *Actionable Rules:* Moderators need clear heuristics. "Intent + Impact" framework.
      *   *Tone:* Professional, empathetic, decisive, pragmatic.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front. Move from "Word-Based" to "Conduct-Based" enforcement.
      *   **Problem Statement:** Briefly summarize the current failure (false positives, bypassability, harm to vulnerable users).
      *   **Evaluation of Options:**
          *   *Status Quo (Blocklist):* Acknowledge strengths (scale, consistency) but highlight critical failures (collateral damage, easy bypass).
          *   *Pure Contextual:* Acknowledge ideal outcome but highlight risks (subjectivity, scale, privacy).
      *   **Recommendation (The Meat):**
          *   *Policy Shift:* Ban *harassing use*, not *words*.
          *   *Tiered Enforcement:*
              *   Tier 1: High-confidence slurs used aggressively -> Auto-action.
              *   Tier 2: Ambiguous/Reclaimed/Quoted -> Flag for human review (not auto-delete).
              *   Tier 3: Reporting/Warning -> Allow, maybe add content warning.
          *   *Moderator Guidelines:* Give specific questions they can ask (Target? Intent? Power dynamic?).
      *   **Implementation Plan:** Short-term (pause auto-delete on ambiguous terms), Medium-term (training), Long-term (ML models trained on context).
      *   **Conclusion:** Reiterate the goal (Safety + Fairness).

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is this too vague? "Conduct-based" can sound like "it depends."
      *   *Fix:* Add specific "Safe Harbor" clauses. If a user is reporting abuse *about* the word, it's allowed. If a user is self-identifying, it's allowed. This gives moderators concrete "If/Then" logic.
      *   *Critique:* Did I respect Side A?
      *   *Fix:* Explicitly state that automation remains the backbone for *blatant* harassment. We aren't removing automation; we are tuning the threshold. Acknowledge that consistency is a virtue, but *incorrect* consistency is harmful.
      *   *Critique:* Privacy concern regarding Side B's identity proof idea.
      *   *Fix:* Explicitly reject identity verification. Focus on *post context*, not *user identity*.
      *   *Length:* Keep it tight. One page means ~400-500 words.

  5.  **Final Polish:**
      *   Ensure the tone is supportive of the user (who is new and in a tough spot).
      *   Make sure the recommendation is definitive.
      *   Check that the specific examples (DV survivor, musician, queer creator) are addressed by the new policy logic.

  6.  **Final Review against constraints:**
      *   One page? (Yes, if formatted tightly).
      *   Principled? (Yes, Harm-based).
      *   Actionable for moderators? (Yes, decision tree).
      *   Respects Blocklist side? (Yes, keeps automation for clear cases).

  *(Self-Correction on Length)*: A true "one-pager" in a corporate setting is usually around 400-600 words. I need to be concise. I will structure it with clear headings.

  *(Key Insight)*: The strongest argument against the blocklist isn't just fairness; it's *efficacy*. The prompt says people dodge it with spacing. So the blocklist isn't even doing its job. I need to highlight that.

  *(Decision)*: I will recommend a "Contextual Automation" model. Keep the list, but change the *action* from "Delete" to "Rate-Limit/Review" for specific categories, and establish "Safe Harbors."

