  The city dweller sees the *gavaya* in the forest. He knows it by the name because it resembles the cow. This knowing arises from comparison (*upamana*).

  It arises from perception of the beast, memory of the cow, and an inference connecting them. Three tools, not four.

  Inference requires a fixed relation (*vyapti*). What is the invariable mark proving this is a *gavaya*?

  The mark is the resemblance. Where that form appears, the name applies.

  You do not know that relation holds until you have already compared them. You beg the question.

  The connection is established by the forester's statement. You infer the animal fits the description.

  Testimony gives you words. It does not glue the word to the object in the wild.

  Testimony is itself inference. You trust the speaker because you infer he is reliable.

  You cannot infer reliability without first understanding the meaning of his words.

  Meaning is convention, learned by inferring intent from usage. Words exclude what they are not.

  Exclusion (*apoha*) is negative. My knowledge is positive: "This is that."

  "This is that" is conceptual construction (*kalpana*). Perception gives only the particular.

  Then perception is blind. It cannot recognize its own objects.

  Recognition is memory. Memory is not a source of *new* knowledge (*pramana*).

  But the application of the name is new. He did not know this animal was the *gavaya* until now.

  The novelty is in the arrangement, like seeing a necklace from scattered beads.

  The beads are distinct. The similarity is a real relation (*sadrishya*) existing between them.

  Similarity is not a third thing. It is merely the absence of total difference.

  Absence cannot guide action. You drink because you know this water is like the pool at home.

  I drink because I infer causal power. You multiply entities to justify your attachment to language.
