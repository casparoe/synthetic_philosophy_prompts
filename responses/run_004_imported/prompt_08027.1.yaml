answer: |-
  Here is a specific experimental paradigm, drawn from the later literature on chronic split-brain patients, that avoids the standard "fighting hands" or "naming objects" tropes. It focuses on **procedural memory transfer** rather than declarative knowledge.

  ### The Scene: The Mirror-Tracing Transfer

  **The Setup**
  Your character is in occupational therapy. On the table sits a wooden board with a six-pointed star etched into it. Between her and the board is a vertical mirror that blocks her direct view of her hand; she must look into the mirror to see the reflection of her hand and the star. This reverses visual-motor coordination (moving right moves the reflection left).

  *   **Day 1:** She is instructed to trace the star outline using *only her left hand* (controlled by the right hemisphere). Her right hand is gloved or restrained. She struggles. The line wobbles; she crosses the boundaries. The therapist records the errors. She finishes, tired, and explicitly states, "I am terrible at this."
  *   **Day 2:** She returns. This time, she is instructed to use *only her right hand* (controlled by the left hemisphere, the speaking side). She has not practiced with this hand. She has no conscious memory of the Day 1 session (the left hemisphere typically does not receive episodic memory of the right hemisphere's experiences).

  **The Result**
  When she picks up the pen with her right hand, her performance is significantly better than baseline. Her movements are smoother; she makes fewer boundary errors. She has improved by roughly 30% compared to a control subject who never saw the task.

  However, when the therapist asks, "Have you done this before?" she answers truthfully: "No. I've never seen this board."
  When asked, "Why is your hand so steady today?" she confabulates: "I guess I'm just good with my right hand," or "The light is better."

  She possesses the *skill* (procedural memory) but disowns the *experience* (episodic memory). Her body remembers what her narrative self denies.

  ### Philosophical Pressure Points

  This finding puts simultaneous pressure on the two extreme positions you mentioned:

  **1. It pressures Puccetti's "Two Persons" View.**
  Puccetti argues that after callosotomy, there are literally two distinct conscious agents sharing a skull. If this were strictly true, we would expect a firewall between the "persons" akin to two people in separate rooms. If Person A (Right Hemisphere) learns a motor skill, Person B (Left Hemisphere) should not benefit from that practice unless Person A explicitly teaches them. The fact that the *skill* transfers subcortically (likely via the brainstem or cerebellum, which remain intact) suggests a shared biological agenthood. It implies that at the level of *doing*, she is one organism with a unified motor bank, undermining the claim that she is simply "two people."

  **2. It pressures the Conservative "Intact Unity" View.**
  Conversely, this finding devastates the view that ordinary personal unity survives intact. In a neurotypical brain, procedural learning is usually accompanied by at least a vague sense of familiarity ("I feel like I've done this"). Here, the unity of *function* exists without the unity of *phenomenology*. The narrator (Left Hemisphere) is alienated from her own competence. She is lying to the therapist, not out of malice, but because her conscious access to the source of her ability has been severed. This suggests that "unity" is not a binary switch but a layered architecture: she is one agent in muscle, but two subjects in memory.

  ### Why This Fits Your Novel
  This scenario avoids the "magic trick" feel of the visual field demonstrations. Instead, it creates a slow-burn existential horror: **the betrayal of the body.**

  It allows you to stage a scene where she is *better* at something than she has any right to be, and that competence feels like a theft. It embodies **Tim Bayne's** suggestion that unity might be domain-specific (unified in motor control, fragmented in episodic memory), but it does so through action rather than exposition. It leaves the reader asking: *If my hand knows what I don't, who is driving?*

  ### Literature Note (for your accuracy)
  Early split-brain studies (Sperry, 1960s) often claimed *no* interhemispheric transfer. However, later work with chronic patients (e.g., **Holtzman, 1984**; **Gazzaniga, 1995**) showed that while *declarative* memory (facts/events) does not transfer, *procedural* memory (skills/motor tasks) often does, presumably via subcortical pathways that survive the callosotomy. This nuance is perfect for your character: she is years post-op (chronic), allowing for this subcortical "re-knitting" of skill, even while the conscious narrative remains fractured.
