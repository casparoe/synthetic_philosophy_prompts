  Here is a draft argument structured for a dissertation chapter. It is designed to be philosophically rigorous, addressing the ontological distinction between the mathematical formalism and the physical interpretation.

  ***

  ### Chapter Section: Dissolving Humphreys's Paradox via Ontological Grounding

  **1. The Challenge of Causal Asymmetry**
  Humphreys's paradox presents a formidable dilemma for the propensity interpretation of probability. The argument rests on the tension between the time-asymmetric nature of causation and the time-symmetric nature of the probability calculus. If propensities are physical dispositions inherent in a cause $C$ to produce an effect $E$, they are represented by the conditional probability $P(E|C)$. However, the Kolmogorov axioms and Bayes' theorem dictate that if $P(E|C)$ is a well-defined probability, then the inverse $P(C|E)$ is mathematically derivable. Humphreys contends that if propensities are to be identified with probabilities, the inverse quantity must also be a propensity. This leads to the absurdity of "inverse propensities," implying that the occurrence of an effect exerts a causal tendency to bring about its cause, thereby violating the principle of causal asymmetry.

  Humphreys's own solution is to sever the link between propensities and the probability calculus, arguing that propensities are *sui generis* physical properties that do not strictly obey the axioms of probability. However, this move comes at a high cost: it isolates propensities from the standard mathematical tools used to model uncertainty and chance, rendering the interpretation mathematically impoverished.

  I argue that there is a third way. A propensity theorist can retain the identification of propensities with objective probabilities and accept the full probability calculus without committing to backward causation. This is achieved by rejecting the premise that mathematical derivability entails ontological parity. Specifically, we must distinguish between the **formal relations** governed by the calculus and the **ontological grounding** of the values within that calculus.

  **2. The Calculus as a Formal Tool, Not an Ontological Map**
  The core of the paradox lies in a category mistake regarding the function of the probability calculus. The calculus is a formal system governing the coherence of numerical assignments; it is not a direct map of causal ontology. That a quantity is derivable within the calculus does not entail that it shares the same truthmakers as the quantities from which it was derived.

  Consider an analogy from classical mechanics. Newton's second law, $F=ma$, allows us to calculate mass given force and acceleration ($m=F/a$). Mathematically, the relation is symmetric. However, we do not infer that acceleration exerts a causal force that generates mass. The equation describes a structural relationship between physical quantities, but it does not dictate that every variable in the equation plays the same causal role. Similarly, Bayes' theorem describes a logical relationship between conditional values. It ensures that if one assigns a value to $P(E|C)$, consistency demands a specific value for $P(C|E)$. It does not, however, mandate that the *physical nature* of the relationship described by $P(C|E)$ is identical to that of $P(E|C)$.

  Therefore, the propensity theorist can accept that $P(C|E)$ is a valid *probability* (in the mathematical sense) without accepting that it is a *propensity* (in the ontological sense). The calculus governs the numbers; the interpretation governs the physical meaning of those numbers.

  **3. Distinguishing Causal Propensities from Evidential Conditionals**
  If the inverse quantity $P(C|E)$ is not a propensity, what is it? To survive the paradox, the propensity theorist must adopt a hybrid account of objective probability that distinguishes between **causal conditionals** and **evidential conditionals**.

  *   **Causal Propensities ($P(E|C)$):** These are grounded in the physical dispositions of the chance setup at time $t_1$. Their truthmakers are the intrinsic properties of the cause (e.g., the atomic structure of a radium nucleus). They are inherently time-asymmetric.
  *   **Inverse Conditionals ($P(C|E)$):** These are not grounded in a disposition of the effect to produce the cause. Instead, they are grounded in the **objective evidential support** that the occurrence of $E$ provides for the hypothesis that $C$ occurred.

  This distinction allows us to maintain that $P(C|E)$ is an *objective* quantity—it is not merely a subjective degree of belief. In a world where propensities exist, there is an objective fact about how strongly the presence of an effect indicates its cause. For example, if a specific decay product ($E$) is uniquely produced by a specific isotope ($C$), the objective probability $P(C|E)$ is high. This objectivity is derived from the base propensities and the initial conditions of the system, but it does not require a "backward propensity."

  By classifying $P(C|E)$ as an objective evidential relation rather than a causal propensity, we preserve the symmetry of the calculus (the numbers still relate via Bayes' theorem) while preserving the asymmetry of the ontology (only the forward direction represents a physical disposition).

  **4. Avoiding the "Identity Thesis"**
  Humphreys's argument implicitly relies on what we might call the **Identity Thesis**: *If quantity $X$ is a propensity, and quantity $Y$ is mathematically equivalent to $X$ via the probability calculus, then $Y$ is a propensity.*

  The argument presented here rejects the Identity Thesis. It posits that the term "probability" is polysemous in the context of scientific interpretation. It refers simultaneously to:
  1.  A formal mathematical structure (Kolmogorov axioms).
  2.  A specific physical interpretation (propensities).

  While all propensities must fit the formal structure (1), not all values within the formal structure (1) must instantiate the physical interpretation (2). The inverse probability is a "shadow" of the propensity—a logical consequence of the propensity structure—but it lacks the causal power that defines the propensity itself.

  This approach aligns with the view that the probability calculus is a logic of partial entailment or a logic of evidence. When we calculate $P(C|E)$, we are not calculating a physical force; we are calculating the degree to which $E$ logically constrains the possibility space of $C$, given the background knowledge of the forward propensities.

  **5. Conclusion: Propensity Intact**
  The propensity interpretation need not flee from Humphreys's paradox by abandoning the probability calculus. Instead, it must refine its ontological commitments. By acknowledging that the probability calculus generates both causal and non-causal (evidential) quantities, the theorist can accept the mathematical validity of the inverse probability $P(C|E)$ without attributing to it causal efficacy.

  This solution preserves the core insight of the propensity interpretation: that objective chance is rooted in the causal dispositions of the physical world. It simultaneously respects the mathematical rigor of the probability calculus by treating it as a neutral framework capable of modeling both causal dispositions and the evidential relations that arise from them. Thus, the paradox is dissolved not by breaking the math, but by clarifying the metaphysics: propensities ground the probabilities, but the probabilities do not all ground propensities.
