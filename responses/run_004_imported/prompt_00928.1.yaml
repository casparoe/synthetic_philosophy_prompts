answer: |-
  My editor called me at 2 AM.

  "Good news," she said. "I've run the spellcheck, the fact-check, and the logic-check. The manuscript is perfect. Not a single error."

  I felt a cold sweat. "But I've already written the preface. It says, *'While I stand by every sentence, I acknowledge that human fallibility ensures at least one mistake remains.'*"

  "So?"

  "So I believe every word of the preface is true. But if the manuscript is perfect, the second half of that sentence is false. That makes me a liar."

  "Then change the preface."

  "I can't. I believe *that* sentence is true, too. I'm committed to the claim that there's an error."

  "Okay," she said, slowly. "So you believe there's an error. But there isn't one. So your belief is false."

  "Exactly. And holding a false belief is irrational. I'd rather be a bad speller than an irrational agent."

  "You want me to insert a typo?"

  "Not a typo. A truth-maker. If the text is flawless, the preface is a lie. If the preface is a lie, my belief system collapses. I need the conjunction of the text to be false so my belief in its fallibility remains consistent."

  There was a long silence. "Page 42?" she asked. "Change 'their' to 'there'?"

  "Perfect," I said.

  "That's going to hurt me, you know. I'm a copy editor."

  "I know," I said. "But think of it this way: I'm not making a mistake. I'm just satisfying the existential quantifier in my apology."
