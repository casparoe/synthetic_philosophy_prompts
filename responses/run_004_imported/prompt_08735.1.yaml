      *   *Argument 2 (Performer Corruption):* Acting is lying. Putting on a mask changes the soul. Women on stage are particularly problematic for Rousseau (modesty, public gaze). Professionalization creates a caste of idlers.
      *   *Argument 3 (Festival/Participation):* The ideal is a gathering in the open air where everyone is the spectacle. No stage, no tickets, no separation. "Let the spectators become an entertainment to themselves."

  3.  **Evaluate the Formats against Arguments:**

      *   **Prestige Streaming Drama (e.g., *The Sopranos*, *Succession*):**
          *   *Arg 1 (Morals):* Strong fit. High production value, but designed to binge/watch passively. Often glorifies anti-heroes (flattering dark tastes).
