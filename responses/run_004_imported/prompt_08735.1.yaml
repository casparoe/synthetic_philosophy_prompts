          *   *Arg 3 (Festival):* *Potential* fit. This is the tricky one. Chat interaction, real-time response, the streamer reacting to the crowd. It blurs the line. But is it *civic*? Is it *public* in the Rousseauian sense (open air, community)? Or is it commercial/isolated?
          *   *Verdict:* Most complex. Closest to participation, but corrupted by commerce and isolation.

  4.  **Determine the Order (Most Straightforward to Least):**
