      *   *Decision:* The most ethically defensible position for a *nonprofit* (mission-driven) is to minimize harm. However, breaking a promise to the writer is also harmful.
      *   *Refined Recommendation:* **Uphold the Award, Withhold the Anthology Inclusion (for now).** Pay the money (done). Allow digital publication (easier to retract). Pause print. Engage a mediator. If no resolution, print with redactions of *identifying details* (not the core narrative) or publish with an editor's note acknowledging the controversy (shifts burden).
