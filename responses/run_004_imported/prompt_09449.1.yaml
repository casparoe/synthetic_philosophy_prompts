      *   *Let's go with:* **Recommendation to withdraw the essay from the print anthology while upholding the prize win.** Why? Because the harm to the mother is concrete and immediate (stigma, privacy). The harm to the author is professional but manageable (she has an agent, the award title still stands, digital version can exist). This acknowledges the "tragic choice."

  4.  **Drafting the Memo - Structure:**
