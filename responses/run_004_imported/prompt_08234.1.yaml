answer: |-
  **Title:** Structure All the Way Down: Why Ontic Structural Realism is the Only Viable Option

  **Introduction**

  The motivation for structural realism is familiar: it attempts to navigate the Scylla of the Pessimistic Meta-Induction (PMI) and the Charybdis of anti-realism. If past theories posited entities that were later discarded (ether, phlogiston), why believe in our current ontology? The structural realist answer is that while the *nature* of the entities changes, the *mathematical structure* is retained. However, as your reading group has identified, this position fractures into two distinct camps: Epistemic Structural Realism (ESR) and Ontic Structural Realism (OSR). ESR claims we can only *know* the structure of the world, remaining agnostic about the underlying nature of the relata. OSR claims there *is* no underlying nature; structure is all there is.

  This essay argues that ESR is untenable due to the Newman Objection, which renders it either trivial or self-contradictory. Consequently, OSR is the only coherent version of the view. Furthermore, the standard objection that OSR is incoherent because "there can be no relations without relata" begs the question by assuming a substance metaphysics that OSR explicitly rejects. Supported by the metaphysics of quantum indistinguishability, OSR survives not by eliminating relata entirely, but by redefining them as ontologically dependent nodes within a fundamental structure. Therefore, Ontic Structural Realism is the only plausible position for a scientific realist, provided it is understood as a claim about ontological priority rather than elimination.

  **The Instability of Epistemic Structural Realism**

  ESR, championed by John Worrall, posits that scientific theories reveal the relational structure of the unobservable world, but we must remain agnostic regarding the intrinsic nature of the entities bearing those relations. This is designed to solve the PMI: we were wrong about the *stuff* (the ether), but right about the *structure* (Maxwell's equations).

  However, ESR faces a devastating logical challenge known as the Newman Objection. Max Newman (1928), critiquing Russell's structuralism, pointed out that if a claim about the world is purely structural—meaning it consists only of logical and mathematical relations between variables—then the claim is trivially true provided the world contains the right number of objects. Given a domain of cardinality $N$, one can define relations over that domain to satisfy almost any structural description. If ESR claims we only know the structure, and structure is merely mathematical relations, then ESR tells us nothing about the world other than its cardinality.

  To avoid triviality, the structural realist must claim that the relations are not just mathematical but *physical* or *causal*. But here lies the trap. If the relations are physical (e.g., causal interactions), they possess intrinsic qualities distinct from their purely formal description. By specifying that the relations are causal, the ESRist is no longer agnostic about the "nature" of the reality; they are making a substantive ontological claim about the fabric of the world.

  Proponents of ESR often attempt to dodge Newman using Ramsey sentences. The idea is to take a theory $T$, replace all theoretical terms with existentially quantified variables, and claim that the resulting Ramsey sentence captures the structural content. However, this does not escape Newman. If the quantified variables range over purely structural properties, the Newman objection applies (triviality). If they range over properties with intrinsic natures, the ESRist has abandoned agnosticism and collapsed into OSR or traditional realism.

  The verdict on ESR is clear: it is an unstable intermediate position. It attempts to be modest about ontology while making robust claims about knowledge, but the Newman Objection shows that you cannot have structural knowledge without ontological commitment. To say the world *has* structure is to say something about what the world *is*. Thus, ESR inevitably collapses into OSR.

  **The Ontic Turn and the Relata Objection**

  If we accept that structural realism must be ontic (OSR), we face the second major hurdle: the "relations without relata" objection. Critics argue that relations are logically dependent on their relata. A relation $R(x,y)$ requires $x$ and $y$ to exist prior to the relation. If OSR claims structure is fundamental and objects are derivative (or eliminable), it seems to posit "dancing without a dancer." Ladyman and Ross's slogan that there is "structure all the way down" appears to violate basic logical grammar.

  Does this objection sink OSR? No, but it forces a clarification of what OSR means by "object." The objection that "no relations without relata" is fatal only holds if one assumes that relata must be *substantival*—that is, individual substances possessing intrinsic properties (haecceity) independent of the structure. This is precisely the metaphysical assumption OSR rejects. To argue that OSR is incoherent because it lacks traditional substances is to beg the question against the structuralist metaphysics.

  OSR does not claim there are no relata; it claims that relata are *ontologically dependent* on the structure. They are not the *foundation* of the structure, but rather *nodes* within it. This is not a logical contradiction but a shift in ontological priority. In standard substance metaphysics, objects are primary and relations secondary. In OSR, the structure is primary, and objects are secondary abstractions from that structure.

  **Quantum Mechanics and Weak Discernibility**

  This is not merely semantic hair-splitting; it is motivated by physics, specifically the quantum statistics of identical particles. In classical mechanics, particles are individuals with primitive thisness (haecceity). Even if two electrons share all state-dependent properties, we can conceptually label them "1" and "2" and track them. In quantum mechanics, permutation invariance dictates that swapping two identical particles yields no physically distinct state. There is no "fact of the matter" about which electron is which.

  Ladyman and French argue this supports eliminativism: there are no objects, only structure. However, a more nuanced defense of OSR comes from the concept of *weak discernibility*, articulated by Simon Saunders. Two fermions in a singlet state cannot be distinguished by intrinsic properties (they have the same mass, charge, spin magnitude). However, they are discernible by an irreflexive relation: particle $a$ has opposite spin to particle $b$. This relation holds between $a$ and $b$, but not between $a$ and $a$.

  This supports a "Moderate OSR." It shows that we can have objects (relata) without primitive thisness. The objects are not "bare particulars" underlying the structure; they are constituted by the web of relations that discern them. The "no relations without relata" objection assumes relata must be self-subsistent. Quantum mechanics suggests relata are merely distinct positions in the relational structure. Therefore, the objection fails because it attacks a straw man (Radical OSR) rather than the viable position (Moderate OSR).

  **Verdict**

  The structural realist project is often treated as a spectrum, but the logical terrain does not support a middle ground. The Newman Objection demonstrates that Epistemic Structural Realism is untenable. One cannot claim to know only the structure of the world without making a claim about the ontological status of that structure. If the structure is merely mathematical, the claim is trivial; if it is physical, the claim is ontological. ESR tries to have it both ways and fails.

  This leaves Ontic Structural Realism as the only viable option for a scientific realist who wishes to take the lessons of the PMI and quantum mechanics seriously. Regarding the "no relations without relata" objection: it does not sink OSR. It merely forces OSR to abandon the provocative but misleading rhetoric of "relations without relata" in favor of "relations prior to relata."

  The verdict is this: **Ontic Structural Realism is the correct position, but only if interpreted as a claim about ontological priority.** Objects exist, but they are not the metaphysical bedrock of reality; they are derivative nodes within a fundamental causal-structural network. The Newman Objection kills the epistemic caution of Worrall, forcing us to be ontological realists about structure. The relata objection fails because it assumes a pre-Kantian substance metaphysics that modern physics has rendered obsolete. To be a scientific realist today is to be an ontic structural realist: we must accept that the universe is not a collection of things that interact, but a network of interactions that we abstractly parse into things.
