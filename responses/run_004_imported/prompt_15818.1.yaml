      *   *Why Psychical Research?* Traditional religion was crumbling under scientific scrutiny (Darwin, higher criticism). Science couldn't detect God. But *psychical phenomena* (telepathy, survival after death) were potentially empirical. If you can prove survival after death + moral sanctions in the afterlife, you bridge the gap scientifically. It's an attempt to save ethics through empirical metaphysics.
      *   *Why not drop the axiom?* He thought both principles (Egoism and Utilitarianism) were equally self-evident. Dropping one would maim rationality.

