answer: |-
  This is one of the most fascinating and tragic arcs in the history of modern philosophy. You're absolutely right to flag it: Sidgwick's psychical research isn't just a quirky Victorian hobby; it is the *metaphysical emergency room* for his ethical system.

  Here is the breakdown of the philosophical logic connecting the Society for Psychical Research (SPR) to the *Dualism of Practical Reason*, and why his epistemic rigor had to remain unyielding even as the project failed.

  ### 1. The Dualism of Practical Reason: The Problem
  To understand the SPR connection, we have to be precise about the "Dualism." In *The Methods of Ethics*, Sidgwick argues that there are two equally rational, self-evident ultimate principles:
  1.  **Rational Egoism:** It is rational to maximize my own happiness.
  2.  **Rational Benevolence (Utilitarianism):** It is rational to maximize the general happiness.

  In a perfectly ordered universe, these would coincide. Being good would *be* in your self-interest. But in the observable natural world, they often conflict. Sacrificing your life for others is morally right but egoistically disastrous.

  Sidgwick concludes that unless there is a **"moral government of the universe"** (a mechanism ensuring that virtue is eventually rewarded and vice punished), morality is not fully rational. If being moral leads to net misery for the agent, Rational Egoism trumps Utilitarianism, and the ethical system collapses into egoism.

  ### 2. Why Psychical Research? (The Logic of the "Third Way")
  You asked why he didn't just pick theism on faith or drop the benevolence axiom. This gets to the heart of Sidgwick's Victorian crisis.

  **Why not Theism on Faith?**
  Sidgwick was a product of the high-water mark of scientific naturalism. He had already lost his Christian faith (famously resigning his fellowship at Trinity because he couldn't sign the 39 Articles). For Sidgwick, **ethics must be based on knowledge, not belief.**
  *   If you base ethics on religious faith, you are building on sand. If the faith turns out to be false (which he suspected), the rationality of morality vanishes.
  *   He needed a *fact* about the universe, not a *hope*. He needed empirical verification of the "sanctions" (rewards/punishments) that align duty and interest.

  **Why not drop the Benevolence Axiom?**
  He couldn't do this because he viewed the axiom of Benevolence as just as self-evident as the axiom of Prudence (Egoism). To deny one would be to deny a fundamental intuition of reason. He was stuck with two contradictory rational commands.

  **The SPR Solution:**
  This is where the logic clicks. Sidgwick needed **empirical evidence of the supernatural.**
  *   Traditional theology was dead to him.
  *   Materialist science denied the soul/sanctions.
  *   **Psychical Research** offered a potential middle path. If telepathy, apparitions, or survival after death could be proven *scientifically* (via observation and testimony rather than revelation), then:
      1.  Consciousness survives death (allowing for post-mortem sanctions).
      2.  There is a non-material order to the universe (allowing for cosmic justice).

  The SPR was essentially an attempt to save Ethics by expanding the boundaries of Science. If he could prove ghosts, he could prove that the universe is structured such that Duty and Self-Interest ultimately converge. It was an attempt to ground the "moral government of the universe" in data rather than dogma.

  ### 3. Why the Epistemic Standards Never Bent
  This is the tragic element. Sidgwick desperately *wanted* the phenomena to be real. He wrote privately about how the hope of immortality was necessary for his own emotional stability and his philosophical system. Yet, as president of the SPR, he was notoriously ruthless in debunking frauds (like the medium Eusapia Palladino, whom he initially investigated but remained skeptical of).

  Why not fudge the numbers? Why not accept weaker evidence?

  **A. The Stakes Were Too High**
  If the reconciliation of Duty and Self-Interest rests on a lie, then morality is *still* irrational.
  *   Sidgwick wasn't looking for a "noble lie" to keep the masses moral (a Platonic approach). He was looking for **Rational Validity**.
  *   If he accepted fraudulent mediumship as proof of survival, he would be building his ethical system on a falsehood. When the fraud was inevitably exposed (as it often was in the SPR), the ethical system would collapse again. He needed *indestructible* proof.

  **B. Scientific Integrity as a Moral Duty**
  For Sidgwick, the method of inquiry was itself a moral imperative. He was trying to legitimize psychical research as a science. If he lowered his standards, he would be indistinguishable from the credulous spiritualists he sought to transcend. To maintain the authority of the SPR (and thus the potential authority of its findings), the methodology had to be stricter than mainstream science, not looser.

  **C. The Tragedy of the "Fundamental Contradiction"**
  Sidgwick died without finding the proof he needed. In a famous letter to his former student Arthur Balfour (released posthumously), he confessed that he had failed to find a rational basis for morality.
  *   He couldn't accept faith.
  *   He couldn't accept the SPR evidence (it wasn't robust enough).
  *   Therefore, he was left with the **Dualism of Practical Reason** unresolved.

  This is why Sidgwick is often seen as the philosopher of modern alienation. He showed that if you follow reason and science strictly (no faith, high epistemic standards), you end up unable to prove that it is rational to be moral.

  ### Summary for Seminar
  If you need to boil this down for the group:
  1.  **The Link:** The SPR was the empirical research arm of Sidgwick's ethical theory. He needed proof of "cosmic justice" to reconcile Egoism and Utilitarianism.
  2.  **The Method:** He couldn't use Faith (unreliable) or ignore the conflict (irrational). He needed Scientific Proof of the Supernatural.
  3.  **The Rigor:** He couldn't bend the standards because a false proof provides no rational foundation for ethics. The truth of the evidence was the only thing that could solve the Dualism.
  4.  **The Result:** He failed. The result is the unsettling conclusion of *The Methods*: that without religious or psychical proof, morality may be rationally groundless.

  It's a brutal position: Sidgwick sacrificed his own peace of mind on the altar of epistemic integrity, leaving us with a utilitarianism that admits it cannot prove why we should be utilitarian.
