      *   *Reframing SI:* SI doesn't drop truth; it operationalizes it. "Truth" becomes "the hypothesis that survives updating."
      *   *The "Tiebreaker" vs. "Prior":* Newton treats simplicity as a constraint on admission. SI treats it as a prior probability. This is a shift from *logic* (Newton) to *probability* (Solomonoff).
      *   *Rule II (Uniformity):* This maps to the assumption of stationarity/computability in SI. The same rules apply everywhere.

