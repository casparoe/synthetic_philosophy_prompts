          2.  Part 1: Why the Two-Truths Deflation fails (The Dialetheist Case).
          3.  Part 2: Handling the "No Thesis" Objection.
          4.  Part 3: Pedagogical advice (how to frame this for students).

      *   *Refining Part 1 (Two-Truths):* Focus on MMK 2 (Motion). Nagarjuna analyzes motion *as it appears*. He doesn't say "Motion doesn't exist ultimately." He says "Motion is not found." If we index the truths, we save logic but lose the soteriological punch. The "emptiness of emptiness" argument is crucial here. If the two truths are distinct ontological realms, Ultimate Truth becomes a *svabhāva*.
      *   *Refining Part 2 (No Thesis):* This is the tricky bit. The key is that for a dialetheist, a contradiction isn't fatal. So Nagarjuna can assert "I have no thesis" even if that assertion looks like a thesis. It's a "performative contradiction" that is acceptable in LP (Logic of Paradox). Also, emphasize the *prasaṅga* method (reductio ad absurdum) — he uses *others'* premises to show contradiction, though Garfield argues he eventually owns the contradictions.
