answer: |-
  Here are eight interview questions drafted to match your level of familiarity with the literature. They skip the intro-to-REU material and press on the normative and structural vulnerabilities, including the three specific lines of argument you requested with their anticipated follow-ups.

  **1. The "Hits-Based" Claim**
  You've argued that the EA community's obsession with "hits-based" giving—making lots of high-variance, high-EV bets—is often mathematically misguided if you're risk-averse. But a lot of proponents argue that when you're dealing with existential risk, the utility function is so convex (or the stakes are so infinite) that risk-aversion looks like cowardice. When you tell a funder they are being irrational for chasing tail risk, are you telling them their *utility function* over saved lives is wrong, or are you telling them their *risk function* is too flat? And how do you convince someone that being risk-averse over *other people's lives* isn't just a form of moral conservatism?

  **2. The Quiggin/Rank-Dependent Worry**
  I want to press on the structural similarity between REU and Rank-Dependent Utility (RDU). In descriptive psychology, Quiggin-style probability weighting is usually treated as a cognitive bias—a systematic misjudgment of likelihoods. In REU, that same mathematical machinery is rebranded as a rational attitude toward risk. If the math is identical, what is actually doing the work of calling this one "rationality" rather than "bias"? Is there a fact of the matter about whether my weighting of decumulative probabilities is a feature of my preferences or a bug in my perception?
  *   **Follow-up:** I expect you to say risk attitudes are rational primitives, just like the utility function, not derivative of belief. But if they are primitives, they aren't transparent to the agent in the way beliefs are supposed to be. If I can't introspectively distinguish between "I think this is unlikely" and "I'm downweighting this probability because it's in the tail," doesn't that make the theory immune to correction by evidence?

  **3. Disentangling Risk from Diminishing Marginal Utility**
  One of the standard defenses of REU is that it separates risk aversion from diminishing marginal utility (DMU). But in the context of altruism, especially x-risk, measuring "utility" is already opaque. If I see a funder rejecting a high-variance grant, how can we empirically distinguish whether they are running an REU calculation with a linear utility function, or a standard EU calculation with a concave utility function over "goodness"? Does REU actually solve the identification problem, or does it just add a degree of freedom that makes it harder to falsify their actual motives?

  **4. The Long-Run/Portfolio Objection**
  This is the Johanna Thoma objection: if a funder makes hundreds of roughly independent risky grants, risk-aversion on any one grant should wash out at the portfolio level by the law of large numbers. An EU maximizer will almost certainly do better in the long run. So, is REU theory telling you to treat the whole portfolio as one single gamble to be risk-weighted? And if so, isn't "how many choices count as one gamble" now doing all the normative work, in a way that's totally up for grabs depending on how you individuate the decision?
  *   **Follow-up:** I anticipate you'll argue that we evaluate plans globally, not additively. But if the "global plan" is defined by the agent, couldn't a reckless agent individuate every bet as a unique, one-off gamble to justify risk-seeking, while a paranoid agent bundles everything to justify extreme caution? Where does the constraint on individuation come from if not from the long-run convergence itself?

  **5. Dynamic Consistency**
  A major technical hit against REU is the problem of dynamic consistency. Because the risk weight changes as probabilities update, an REU agent can prefer a plan at time *t1* but prefer to deviate from it at *t2*, even without new information. For a podcast host or a funder making multi-year commitments, this seems disastrous. Do you bite the bullet and say rational agents can legitimately change their minds without new info, or is there a version of REU that can bind itself to a prior plan without collapsing back into EU?

  **6. Risk-Paternalism**
  If I am a funder using REU, I am imposing my own risk function onto the beneficiaries of my grants. I might be risk-averse about whether a vaccine gets developed, but the people who die if it doesn't aren't "taking a gamble"—they're just dead. Does REU imply a form of risk-paternalism where the funder's psychological attitude toward variance trump the beneficiaries' interest in expected outcomes? Is there a principle that says when acting altruistically, I should maximize *their* expected utility rather than *my* risk-weighted utility of their outcomes?

  **7. The Veil of Ignorance**
  There's a move, I think from your paper "Taking Risks Behind the Veil of Ignorance," arguing that Harsanyi's road from the veil to utilitarianism only works because he assumes the person behind the veil reasons via plain expected utility. If you swap in REU, you reopen room for something like Rawls's risk-aversion without going all the way to maximin. But doesn't that just import a purely prudential attitude—how much risk *I'll* accept regarding my own one life—into impartial tradeoffs between totally distinct people who, unlike me choosing behind a veil, never actually face a gamble at all?
  *   **Follow-up:** You'll likely say the veil is already a fiction, so borrowing risk attitudes into it is no more illegitimate than borrowing anything else. But if the veil is a tool for moral reasoning, shouldn't the inputs be moral facts rather than psychological dispositions? If my risk tolerance is a matter of personality, why should that determine the structure of justice for everyone else?

  **8. Falsifiability**
  To end on a methodological note: REU is incredibly flexible because of the risk function *r*. You can fit almost any preference pattern by adjusting the curvature of *r*. So, what pattern of actual choices, if we ever saw it, would you count as real evidence *against* REU rather than just a shape of *r* you haven't fit yet? Is there a behavioral signature that would force you to abandon the theory entirely?
