answer: |-
  Good evening. For those of you who don't know me, I'm Priya's uncle. I'm also the family "philosopher," which is a fancy way of saying I get paid to read old German books that nobody else wants to touch. Usually, when I talk about Kant, the room gets very quiet. So, Priya, I appreciate you trusting me to speak tonight, even if your main instruction was, "Please do not talk about the metaphysics of the soul."

  And she was right to give that instruction. Priya and Dev have spent the last ten years practicing Vipassana. They met on a silent retreat. They know better than anyone that the idea of two fixed, eternal souls locking together like puzzle pieces doesn't quite match reality. We are not statues. We are rivers. We change from moment to moment.

  Now, this presents a puzzle. If we are always changing, what are we actually promising when we say "until death do us part"? If the Priya who stands here tonight is not, strictly speaking, the same person as the Priya in thirty years, is that future Priya bound by a vow she didn't technically make?

  It's a serious question. But I think the answer is actually the most beautiful part of what they are doing.

  In the philosophical tradition, we sometimes worry that if there is no fixed self, there is no one to hold the promise. But in the tradition Priya and Dev practice, the lack of a fixed self doesn't mean nothing matters. It means that *connection* is the only thing that's real.

  A promise isn't a chain binding a prisoner. It's a path.

  When Priya and Dev say "I do," they aren't predicting that they will never change. They are setting a direction. They are saying that as the years peel away who they are right now, and replace them with new versions of themselves, they intend to orient those new selves toward each other.

  The vow doesn't bind them because of some magical glue in the universe. It binds them because they choose to renew it. Every morning when they wake up, every time they sit on the cushion, every time one of them is difficult and the other chooses patience instead of reaction—that is the vow being signed again.

  The "forever" in marriage isn't about stopping time. It's about faithfulness within the flow of time. It's the commitment that when the inevitable changes come—when careers shift, when bodies age, when the mind wanders—you will navigate that impermanence together, rather than apart.

  For my Catholic relatives here, you might hear this as a covenant. For Dev's meditation friends, you might hear this as *cetana*—volitional intention. But for everyone, I hope you hear it as love.

  Love isn't something you have; it's something you practice. And like any practice, it requires showing up. Priya and Dev have already shown up for ten years of practice. They know that the silence isn't empty; it's full of potential. They know that the self isn't a thing to be defended, but a process to be tended.

  So, let's not raise a glass to a frozen moment. Let's raise a glass to the flow.

  To Priya and Dev. May your changes be gentle. May your intentions be clear. And may you find each other, again and again, in every version of yourselves that is yet to come.

  To the bride and groom.
