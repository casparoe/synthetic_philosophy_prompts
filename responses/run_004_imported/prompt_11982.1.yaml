      *   **Status of Creatures:** Contingent impotence (Ghazali) vs. Essential impotence (Malebranche).
      *   **Answering Q1 (Strength):** Malebranche is metaphysically stronger; Ghazali is theologically more flexible.
      *   **Answering Q2 (Fragility):** Malebranche is more vulnerable due to Cartesian physics. Ghazali's skepticism is more robust.
      *   **Conclusion:** Summary of the distinction.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Did Ghazali *really* leave it open that secondary causes could exist? Some scholars argue Ghazali *does* deny them, but his *argument* only denies necessary connection. I should phrase this carefully: Ghazali denies *necessary* connection, allowing God to act directly, whereas Malebranche denies the *possibility* of creaturely causation.
      *   *Clarification on Malebranche:* Malebranche argues that to will something is to know exactly how to bring it about. Finite minds don't know the infinite details of moving a hand. Therefore, they don't cause it. This is a key argument to include.
      *   *Atomism:* Ghazali's atomism supports the idea that the world is re-created at every instant. Malebranche doesn't need atomism; he needs the passivity of matter.

  9.  **Final Polish:** Ensure tone is academic but accessible (seminar context). Use bolding for key distinctions. (Proceed to generate output based on these thoughts).

