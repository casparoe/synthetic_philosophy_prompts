prompt: |-
  I'm profiling a theoretical neuroscientist next week who's become the public face of the free energy principle -- the claim that any self-organizing system, from a single cell to a human brain, survives by minimizing its own "surprise" relative to an internal model. Whenever someone asks what would falsify this, he's got a stock dodge: "you're treating a mathematical principle like an empirical hypothesis, that's a category error, ask about a specific process model instead." Give me seven or eight questions that dont let him retreat to that line, including at least one that makes him sit with the dark-room problem (if minimizing surprise is the whole story, why isnt every organism just curled up in a quiet box somewhere), one on why the same math supposedly covering a thermostat, a bacterium, and a brain doesn't just mean it isn't really explaining any of them in particular, and one where he has to commit to a real finding that would count against the theory, not some strawman version of it. For each, flag the dodge he'll probably reach for and give a sharp follow-up that shuts it down.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Subject:** A theoretical neuroscientist promoting the Free Energy Principle (FEP).
      *   **Core Claim:** Self-organizing systems survive by minimizing "surprise" (variational free energy) relative to an internal model.
      *   **Problem:** The subject uses a specific defense mechanism ("category error," "it's a mathematical principle, not an empirical hypothesis," "ask about process models") to avoid falsification.
      *   **Task:** Create 7-8 hard-hitting interview questions.
      *   **Requirements:**
          *   Prevent retreat to the "category error/process model" dodge.
          *   Include the "Dark Room Problem" (why aren't we just hiding in quiet boxes?).
          *   Include the "Universality/Triviality Problem" (if it applies to thermostats and brains, does it explain anything?).
          *   Include a request for a *specific* falsifiable finding (not a strawman).
          *   For each question: Flag the likely dodge and provide a sharp follow-up.

  2.  **Deconstruct the Free Energy Principle (FEP) & Common Criticisms:**
      *   *What is it?* A unified theory of brain function and life itself based on Bayesian inference and thermodynamics.
      *   *The Dodge:* "FEP is a postulate/principle, not a model. You test specific implementations (process models), not the principle itself."
      *   *The Dark Room Problem:* If the goal is to minimize surprise (prediction error), why don't organisms seek out unchanging, predictable environments (like a dark, quiet room) and die there? *Standard Answer:* Active inference includes prior preferences for homeostasis/survival.
      *   *The Triviality/Universality Critique:* If *everything* minimizes free energy (by definition of being a self-organizing system), then saying "the brain minimizes free energy" is tautological. It doesn't distinguish between good and bad models of the brain.
      *   *Falsifiability:* Proponents often claim it's unfalsifiable in principle but falsifiable in practice (via specific models). The interviewer needs to pin them down on the *principle's* limits.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Falsification Commitment.* Need to force a concrete "this would prove me wrong."
          *   *Draft:* What proves you wrong?
          *   *Refinement:* Make it specific to the *principle*, not just a model.
          *   *Dodge:* "You're asking the wrong level."
          *   *Follow-up:* "If nothing can falsify the principle, it's metaphysics, not science."

      *   *Question 2: The Dark Room Problem.* Classic objection.
          *   *Draft:* Why don't we sit in dark rooms?
          *   *Refinement:* Focus on the tension between minimizing surprise and seeking reward/survival.
          *   *Dodge:* "We have priors for survival."
          *   *Follow-up:* "Isn't that just adding a fudge factor to save the theory?"

      *   *Question 3: Universality/Triviality.* Thermostat vs. Brain.
          *   *Draft:* Does this apply to thermostats?
          *   *Refinement:* If the math is the same, what distinguishes high-level cognition from a thermostat? Does the theory lose explanatory power by covering everything?
          *   *Dodge:* "It's about complexity of the model."
          *   *Follow-up:* "Then the FEP isn't the explanation, the complexity is."

      *   *Question 4: The "As If" vs. Mechanism.* Do brains actually do Bayesian math or is it just a description?
          *   *Draft:* Do neurons do calculus?
          *   *Refinement:* Is FEP normative (how it *should* work) or descriptive (how it *does* work)?
          *   *Dodge:* "It's both."
          *   *Follow-up:* "If it's normative, why claim it explains biological mechanisms?"

      *   *Question 5: Energy vs. Information.* The thermodynamic claim.
          *   *Draft:* Is it about energy or data?
          *   *Refinement:* FEP links thermodynamic free energy and variational free energy. Is this link empirically verified or just mathematical analogy?
          *   *Dodge:* "They are isomorphic."
          *   *Follow-up:* "Show me the measurement where thermodynamic cost tracks variational update in a living brain."

      *   *Question 6: Progress/Track Record.* What has this actually *done*?
          *   *Draft:* What have you discovered?
          *   *Refinement:* Name a specific neurological phenomenon explained by FEP that wasn't explained by competing theories (e.g., predictive coding alone).
          *   *Dodge:* "It unifies things."
          *   *Follow-up:* "Unification isn't explanation. Give me a novel prediction confirmed by data."

      *   *Question 7: The Tautology Trap.* Existence implies FEP.
          *   *Draft:* Is it circular?
          *   *Refinement:* If any system that persists *must* minimize free energy by definition, isn't saying "brains persist therefore they minimize free energy" circular?
          *   *Dodge:* "It's a necessary condition, not sufficient."
          *   *Follow-up:* "Then it doesn't explain *why* brains work the way they do, just that they exist."

      *   *Question 8: The Retreat to Process Models.* Addressing the specific prompt requirement about the dodge.
          *   *Draft:* Stop talking about process models.
          *   *Refinement:* Directly challenge the separation between Principle and Process Model.
          *   *Dodge:* "Principles guide models."
          *   *Follow-up:* "If the principle constrains nothing, it guides nothing."

  4.  **Review and Refine:**
      *   Check against constraints: 7-8 questions? Yes. Dark Room included? Yes. Thermostat/Universality included? Yes. Falsification commitment included? Yes. Dodges and Follow-ups included? Yes.
      *   Tone: Professional but incisive. Not hostile, but unyielding.
      *   *Self-Correction on Q1:* Make sure the falsification question doesn't allow the "ask about process models" dodge. I need to frame it so the *principle* itself is on the hook.
      *   *Self-Correction on Q3 (Thermostat):* Ensure the follow-up emphasizes *explanatory power*.
      *   *Self-Correction on Q2 (Dark Room):* Ensure the follow-up challenges the "priors" explanation as ad hoc.

  5.  **Final Polish:** Organize clearly with headers for the Question, The Likely Dodge, and The Follow-Up. (Proceeding to generate output based on this structure).

