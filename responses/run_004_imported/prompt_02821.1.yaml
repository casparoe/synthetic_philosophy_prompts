      *   *The Wine Potion:* Real. Makes cowardly/shy men bold/shameless.
      *   *The Goal:* The Lawgiver wants to know the character of citizens to rule them (Politics).
      *   *The Mechanism:* Wine lowers inhibitions ("loosens the string of the tongue"). It reveals the true nature of the soul that is usually hidden by shame or social convention.
      *   *The Training Aspect:* It's not just about getting drunk; it's about *supervised* drinking (symposia). The key is how one behaves *under the influence* and how one recovers. It's a "safe danger."
