      *   **Ontic Structural Realism (OSR - Ladyman & French):**
          *   *Core:* There *is* no underlying stuff. Structure is all there is. "Relations without relata."
          *   *Pros:* Avoids Newman by claiming structure is ontologically fundamental, not just epistemically accessible. Aligns with QM (entanglement, indistinguishability) and GR (spacetime relations).
