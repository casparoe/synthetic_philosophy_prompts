  2.  **Deconstruct the Core Concepts:**

      *   **Practical Akrasia (Weakness of Will):**
          *   *Structure:* Agent judges action $A$ is best all-things-considered, but performs action $B$.
          *   *Aristotle:* Ignorance (temporary clouding of reason by passion).
          *   *Davidson:* Incontinence. The agent holds a conditional judgment ("All things considered, $A$ is better") but acts on a prima facie judgment ("$B$ is desirable"). The puzzle is how one can hold the all-things-considered judgment and *still* choose otherwise without logical contradiction.
          *   *Defusing Moves:* Distinguishing between *occurrent* vs. *dispositional* belief, or *judgment* vs. *motivation*. Maybe the "better judgment" wasn't fully active at the moment of action.

      *   **Epistemic Akrasia:**
          *   *Structure:* Agent believes $p$, but believes that believing $p$ is unsupported by evidence (or irrational). Formally: $B(p) \land B(\text{Evidence does not support } p)$.
          *   *Higher-Order Evidence (HOE):* Evidence about the reliability of the cognitive process producing the first-order belief.
          *   *The Tension:* Norms of rationality usually say "Believe in accordance with your evidence." If you believe your evidence doesn't support $p$, shouldn't you drop $p$?
          *   *Defusing Moves:* Distinguishing between *credence* and *meta-credence*? Distinguishing between *taking to be true* vs. *assessing reliability*?

  3.  **Address the Specific Questions:**

      *   **Parallel Extension:**
