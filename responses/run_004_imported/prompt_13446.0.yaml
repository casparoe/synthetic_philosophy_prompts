answer: |-
  Your roommate is right. I'm sorry, but she is mathematically, logically, and financially correct.

  What you have encountered is a classic concept in probability and decision theory called a **Dutch Book**.

  Here is the breakdown of why her argument holds up and why your defense, while psychologically understandable, doesn't work in the context of betting markets.

  ### 1. The Math: Coherence and the Dutch Book
  The Dutch Book Theorem states that if your betting odds (which reflect your subjective probabilities) are not **coherent**, a clever bettor can construct a set of bets that guarantees you a loss.

  In a mutually exclusive event like the Oscars (only one movie can win Best Picture), the implied probabilities of all nominees must sum to at least 100% (1.0).
  *   **Implied Probability** = $1 / \text{Decimal Odds}$.
  *   If you offer odds on 10 movies, and the implied probabilities add up to 80%, you are mathematically stating there is a 20% chance that *no movie wins*. Since that is impossible, your odds are incoherent.
  *   Even if they sum to 100% exactly, you have no "vig" (margin), and any imbalance in stakes will cause a loss.
  *   To guarantee a profit, a bookie usually sets odds so the implied probabilities sum to 110% or 120%.

  If your roommate added up your accepted bets and found a guaranteed loss, it means the combination of your **odds** and the **stakes** you accepted created a liability structure where the payout exceeds your intake for every possible outcome.

  ### 2. The "Package" Defense vs. Objective Risk
  Your defense is: *"I never treated those bets as one package - each one seemed fine on its own."*

  This is a behavioral bias known as **narrow framing**. You evaluated each bet as an isolated transaction (Local Rationality) rather than as part of a portfolio of liabilities (Global Rationality).

  However, risk does not care about your intent or your mental framing.
  *   **The Bank Account is Holistic:** When the winner is announced, all bets resolve simultaneously. Your bank account doesn't process them sequentially; it processes the net result of the entire book.
  *   **The Correlation is Objective:** Even if you took the bets weeks apart, the outcomes are perfectly correlated (negatively). If Movie A wins, Movie B *must* lose. Because the outcomes are linked by the rules of the Oscars, your bets are inherently linked, regardless of when you wrote them down.

  Saying "I didn't mean them as a combo" is like a homeowner saying, "I didn't mean to burn the house down; I just lit a match in the kitchen, then another in the bedroom, and another in the garage. Each one seemed fine at the time." The risk was cumulative, even if the actions were sequential.

  ### 3. The Role of the Bookie
  By setting the odds, you assumed the role of a **market maker** (the House). The fundamental job of a market maker is not to predict the winner, but to **balance the book**.

  *   **Individual Bet View:** "Is this price fair for this movie?"
  *   **Bookie View:** "If I take this bet, how does it change my exposure if *any* of the other movies win?"

  If you allow the book to become unbalanced to the point of a guaranteed loss, you have failed at the specific function you volunteered for. Your friends didn't cheat you; they simply took the value you offered. In betting markets, if you leave money on the table, someone will pick it up. That is the nature of the game.

  ### The Verdict
  Your roommate's point that *"not meaning it as a combo is no defense"* is the correct one. In finance and probability, **consistency is mandatory, not optional.**

  **How to fix it next year:**
  1.  **Convert to Implied Probabilities:** Before accepting any bet, convert your odds to percentages. Ensure they sum to >100% (e.g., 115% to build in your profit margin).
  2.  **Monitor Liability:** Keep a running spreadsheet. If too much money comes in on one movie, lower the odds on that movie and raise them on the others to encourage bets on the losers.
  3.  **Accept the Loss:** Take the L this year. Consider it tuition for a very practical lesson in coherence and risk management. Your stats-PhD roommate will likely never let you forget it, but she's earned the bragging rights.
