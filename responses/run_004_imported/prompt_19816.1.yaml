answer: |-
  You are right to spot the lineage. The term is not Bostrom's invention, and the logical skeleton is unmistakably Reichenbach's. However, calling it merely the "old problem in a new outfit" understates how the change in context fundamentally alters the problem's solvability.

  Here is the comparison, the structural breakdown, and the verdict.

  ### 1. Reichenbach's Reference Class Problem (Frequentism)
  **The Setup:** You want to assign a probability to a **single case** (e.g., "Will Mr. Smith die before 60?").
  **The Method:** You place Mr. Smith into a **reference class** (e.g., "50-year-old males") and use the frequency of the attribute in that class as the probability.
  **The Problem:** Mr. Smith belongs to infinite classes ("50-year-old smokers," "50-year-old smokers with blue eyes," etc.). Each class has a different frequency.
  **The Solution (Reichenbach):** The **Principle of the Narrowest Reference Class**. You should use the narrowest class for which **reliable statistics** exist.
  **The Nature of the Tension:** *Specificity vs. Data Availability.* If the class is too broad, the frequency is irrelevant to the specific case. If the class is too narrow, the sample size is too small to establish a stable frequency.
  **The Ontology:** The frequencies are assumed to be objective facts about the world. The problem is **epistemological**: we don't know *which* fact to use, but the facts exist.

  ### 2. Bostrom's Reference Class Problem (Anthropics/SSA)
  **The Setup:** You want to update credences in **global hypotheses** (e.g., "Will humanity go extinct soon?") based on your **self-location** (e.g., "I am the 100-billionth human").
  **The Method:** The Self-Sampling Assumption (SSA). You treat yourself as a **random sample** from a **reference class** of observers.
  **The Problem:** You belong to infinite potential classes ("all humans," "all conscious beings," "all observer-moments," "all beings who know they are the 100-billionth observer"). Each class yields a different likelihood ratio for the hypotheses.
  **The Solution:** None agreed upon. Proposals range from "observers subjectively indistinguishable from you" to "all observers in your causal lightcone."
  **The Nature of the Tension:** *Inclusion vs. Discriminatory Power.* If the class is too broad (e.g., "all possible observers"), you get absurd results (The Presumptuous Philosopher). If the class is too narrow (e.g., "just me"), the anthropic update vanishes entirely (you are always a random sample of size 1).
  **The Ontology:** The "frequencies" are often **metaphysical proportions** of possible observers, not empirical data. The problem is **metaphysical**: there may not be a fact of the matter about which class is the "real" one.

  ### 3. Structural Overlap (What is Shared)
  1.  **The Singular-Plural Mapping:** Both problems arise from the need to map a singular entity (a specific person/case) onto a plural set (a class) to derive a probability measure.
  2.  **Sensitivity to Boundaries:** In both, the resulting probability is non-robust; small shifts in the definition of the class boundaries produce large shifts in the probability output.
  3.  **Lack of a Non-Circular Rule:** Neither tradition has a successful, non-circular algorithm for selecting the "correct" class without appealing to the very probability one is trying to calculate.

  ### 4. Functional Divergence (What is Different)
  This is where the "new outfit" theory fails. The problems diverge in three critical ways:

  **A. The Direction of Optimization**
  *   **Reichenbach:** The goal is to **narrow** the class. Accuracy improves as you add relevant predicates (smoker, cholesterol, etc.), stopping only when data runs out.
  *   **Bostrom:** The goal is often to **broaden** (or carefully calibrate) the class. If you narrow the class too much in anthropics (down to "observers with my exact birth rank"), the SSA becomes tautological and loses all predictive power. Reichenbach's solution *destroys* the anthropic argument.

  **B. Empirical vs. Metaphysical Frequencies**
  *   **Reichenbach:** The reference class problem is a bottleneck for **accessing data**. We assume the frequency of death for "50-year-old smokers" exists in reality; we just have to find the dataset.
  *   **Bostrom:** The reference class problem is a bottleneck for **defining the sample space**. There is no external dataset of "all observers in the multiverse" to check. The "frequency" is a theoretical construct dependent on your theory of identity.

  **C. Prediction vs. Self-Location**
  *   **Reichenbach:** You are predicting an external event (death) happening to a subject.
  *   **Bostrom:** You are using your existence as the data point to predict the structure of the world. The "sample" is not just an object in the world; it is the *condition for the probability calculation itself*.

  ### The Verdict

  **It is Reichenbach's problem transposed from the epistemology of evidence to the metaphysics of identity.**

  It is not merely the same puzzle with a new name, nor is it a genuinely different puzzle. It is the **same logical form applied to a domain where Reichenbach's pragmatic escape hatch is locked.**

  In Reichenbach's frequentism, the reference class problem is a **methodological nuisance**. We assume there is a "true" frequency for the narrowest reliable class, and better data collection solves it. In Bostrom's anthropics, the reference class problem is a **foundational crisis**. Because there are no "reliable statistics" for "all possible observers," you cannot appeal to data to narrow the class. You must appeal to a theory of personal identity or consciousness to define the class.

  Therefore, Bostrom did not just cook up a bespoke headache; he took Reichenbach's logical structure and removed the empirical constraints that made it solvable.

  **Verdict:** **Homologous structure, heterologous substrate.** It is the same logical problem, but by moving it from empirical prediction to indexical self-location, Bostrom transformed a solvable epistemological ambiguity into an unsolvable metaphysical indeterminacy. Reichenbach's problem asks, "Which data should I use?" Bostrom's problem asks, "What counts as data?" The latter strictly contains the former but is strictly harder.
