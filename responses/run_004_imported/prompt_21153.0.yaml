answer: |-
  This is an excellent question that cuts to the heart of the structural differences between "benign" and "malignant" common-cause problems. You are absolutely right to notice the structural isomorphism: both Newcomb's Problem and Death in Damascus involve a predictor (or a state of the world determined by a predictor) that correlates your act with an outcome, without causal feedback from the act to the prediction.

  However, the reason the literature treats them differently is not merely theoretical bias against EDT. It stems from a specific technical failure in EDT's decision procedure in the Death in Damascus case that does not arise in Newcomb's Problem. Specifically, it concerns **stability** and **ratifiability**.

  Here is the breakdown of why the analogy breaks down in the eyes of decision theorists, and why Death in Damascus is considered a deeper pathology for EDT than Newcomb is.

  ### 1. The Direction of the Correlation (Good News vs. Bad News)

  Your intuition is that in both cases, the agent should choose the act that is better news.
  *   **In Newcomb:** One-boxing is excellent news. $P(\text{\$1M} \mid \text{1-Box}) \approx 1$. Two-boxing is bad news. $P(\text{\$1M} \mid \text{2-Box}) \approx 0$.
      *   EDT calculates the expected utility of 1-boxing as high.
      *   Crucially, *conditional on the decision to 1-box*, the news remains good. The correlation supports the recommended act.
  *   **In Death in Damascus:** Going to Aleppo is bad news. $P(\text{Death in Aleppo} \mid \text{Go Aleppo}) \approx 1$. Going to Damascus is bad news. $P(\text{Death in Damascus} \mid \text{Go Damascus}) \approx 1$.
      *   EDT calculates the expected utility of going to Aleppo as low (because it implies Death is there).
      *   EDT calculates the expected utility of going to Damascus as low (because it implies Death is there).

  In Newcomb, the evidential correlation **rewards** the act EDT recommends. In Death in Damascus, the evidential correlation **punishes** whichever act EDT considers.

  ### 2. The Problem of Instability (The Feedback Loop)

  This leads to the technical issue Gibbard and Harper highlighted: **Ratifiability.** An act is ratifiable if, conditional on your doing it, it still maximizes expected utility.

  *   **Newcomb is Stable:** If you decide to 1-box, you conditionalize on 1-boxing. Given 1-boxing, the probability the box is full is high. Therefore, 1-boxing still looks better than 2-boxing *conditional on doing it*. The decision is self-reinforcing.
  *   **Death is Unstable:** Suppose your current credences suggest you should go to Aleppo. EDT says, "Wait, if you go to Aleppo, that is strong evidence Death is in Aleppo. You will die. You should go to Damascus."
      *   But as soon as you shift your intention to Damascus, your evidence updates. "Wait, if I go to Damascus, that is strong evidence Death is in Damascus. You will die. You should go to Aleppo."
      *   There is no fixed point. Whichever act you contemplate, conditionalizing on that act makes it the *wrong* act.

  For Gibbard and Harper, this shows that EDT can fail to yield a determinate recommendation. It creates a deliberative loop. A decision theory that tells you "Whatever you decide to do, you should have decided to do the other thing" is arguably incoherent. This is why Death in Damascus is cited as a *reductio* of pure EDT, whereas Newcomb is cited as a *divergence* between EDT and CDT.

  ### 3. Why the "Better News" Reasoning Fails in Death

  You wrote: *"whichever city is better news... is simply the city an evidential agent should choose."*

  In the standard formulation of Death in Damascus, **neither city is good news.**
  *   If you go to Aleppo, the news is "Death is in Aleppo." Utility: Death.
  *   If you go to Damascus, the news is "Death is in Damascus." Utility: Death.

  In Newcomb, one option *is* good news (Box is Full). In Death, both options are fatal news. EDT maximizes expected utility based on the news. If all available acts constitute bad news, EDT cannot distinguish between them on evidential grounds, or worse, it oscillates.

  If you try to escape by saying, "I'll go to the city Death *isn't* in," you are implicitly invoking a causal or counterfactual supposition ("If I were to go to Aleppo, Death would be in Damascus"). But EDT forbids this; it requires conditionalization on the act. Since $P(\text{Death in A} \mid \text{Go A})$ is high, you cannot treat the act as evidence that Death is elsewhere.

  ### 4. Recent Defenses (Ahmed and the "Tickle")

  You mentioned Arif Ahmed. In *Evidence, Decision and Causality* (2014), Ahmed defends EDT against Death in Damascus, but he acknowledges the force of the objection. His strategy (following Ellery Eells) is the **"Tickle Defense."**

  The argument is that a rational agent has access to the *causes* of their decision (their beliefs and desires) prior to the decision itself.
  *   If the predictor predicts based on your psychological state (the "tickle"), and you know your psychological state, then conditioning on your *decision* adds no new evidence about the predictor.
  *   Formally: $P(\text{Death in A} \mid \text{Go A} \land \text{Mental State}) = P(\text{Death in A} \mid \text{Mental State})$.
  *   If the correlation is screened off by the mental state, the evidential link between Act and Prediction breaks. EDT then treats the acts as probabilistically independent of Death's location, and you can choose freely (perhaps based on a preference for one city).

  However, many theorists find this unsatisfying for the "Hard" Death in Damascus case, where the predictor is defined as predicting the *act itself* regardless of the mental state, or where the agent is not privy to the full causal chain of their decision. In those "Hard" cases, the instability remains.

  ### 5. Summary: Conflict vs. Collapse

  To answer your specific question on why the treatment differs:

  1.  **Newcomb's Problem** shows EDT and CDT **conflicting**. EDT gives a clear, stable answer (One-Box). CDT gives a clear, stable answer (Two-Box). The debate is about which answer is *right*.
  2.  **Death in Damascus** shows EDT potentially **collapsing**. It suggests EDT cannot find a stable equilibrium. It's not just that EDT gives a different answer than CDT; it's that EDT's calculation undermines its own recommendation.

  Theorists treat Death in Damascus as a more serious difficulty because it attacks the **coherence of the maximization procedure** itself, not just the verdict. It suggests that maximizing conditional expected utility is not always a well-defined operation when the act is strong evidence of a state that negates the utility of the act.

  ### Recommendation for Your Paper

  Since you are preparing a qualifying paper, you might consider focusing your analysis on the **Ratifiability Constraint**.
  *   Investigate whether EDT can be modified to include a ratifiability constraint (as David Lewis suggested) without collapsing into CDT.
  *   Look at the distinction between "Standard" Death (predictor predicts act) and "Medical" Death (predictor predicts based on symptoms). EDT handles the latter better (via the Tickle), but the former remains the hard case.
  *   Engage with **Jessica Wilson** or **Johan Gustafsson** on recent discussions of deliberational equilibrium.

  Your intuition that the structures are similar is correct, but the *valence* of the correlation (beneficial vs. detrimental) creates a stability in Newcomb that is absent in Damascus. That absence of stability is the technical hook Gibbard and Harper used, and it remains the strongest argument against pure EDT.
