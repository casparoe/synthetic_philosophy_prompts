prompt: |-
  I'm taping a podcast episode next week with a guest who's spent her career defending Strawson's line that reactive attitudes -- resentment, gratitude, indignation -- are the bedrock of moral responsibility, not something that needs backing from a metaphysical verdict on free will vs determinism. Her favorite dodge when pushed is to say that asking whether the reactive attitudes are themselves justified isn't even a question you can ask from outside the practice. Can you draft me 7-8 interview questions that don't just let her restate Strawson? I want at least one that forces her to engage the Watson/Wolf complaint that naturalism describes our practices but doesnt vindicate them, one on whether the "objective attitude" toward psychopaths and "he's not himself today" cases is a sharp binary or something that creeps outward as we learn more neuroscience, and one on how her view handles Pereboom-style manipulation cases, where the reactive attitudes still fire even though we don't think the agent's responsible. Throw in a follow-up for each keyed to the reply she'll probably give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest's Stance:** P.F. Strawson compatibilist (reactive attitudes are bedrock, no external metaphysical justification needed).
      *   **Guest's "Dodge":** Claims asking for justification from outside the practice is unintelligible/impossible.
      *   **Goal:** 7-8 interview questions that challenge this stance, preventing mere restatement of Strawson.
      *   **Specific Requirements:**
          *   At least one question on Watson/Wolf (naturalism describes but doesn't vindicate).
          *   At least one question on the "Objective Attitude" (psychopaths/neuroscience creep).
          *   At least one question on Pereboom-style manipulation cases (reactive attitudes fire but responsibility seems absent).
          *   Include a follow-up for each question based on the predicted reply.
      *   **Tone:** Professional, probing, podcast-appropriate (engaging but rigorous).

  2.  **Deconstruct the Guest's Position (Strawsonian Optimism):**
      *   *Core Claim:* Moral responsibility is constituted by our interpersonal practices (reactive attitudes).
      *   *Defense:* We can't step outside our human form of life to judge these practices. Asking "are they *really* justified?" is a category error.
      *   *Weak Points:*
          *   Internal inconsistency (do our practices actually align with her theory?).
          *   The "creep" of the objective attitude (neuroscience/psychology makes us treat more people as objects).
          *   The gap between *feeling* resentment and *being* justified in resentment (the normativity gap).
          *   Manipulation cases (intuition pumps that separate reactive attitudes from responsibility).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Watson/Wolf (Description vs. Vindication).*
          *   *Idea:* Strawson says we can't ask for external justification. Watson/Wolf say that's not enough; we need to know if the practice is *good* or *rational*.
          *   *Draft:* Watson and Wolf argue you're just describing psychology, not justifying it. If our practices are cruel, shouldn't we change them?
          *   *Refinement:* Make it sharper. Focus on the "internal critique" possibility.
          *   *Follow-up:* She'll say "We can modify internally." Push on *why* we modify if not by an external standard.

      *   *Requirement 2: Objective Attitude & Neuroscience.*
          *   *Idea:* Strawson says we toggle between participant and objective attitudes (psychopaths, kids). But neuroscience suggests *everyone* is determined. Does the objective attitude creep?
          *   *Draft:* Neuroscience shows brain causes behavior. Shouldn't we treat everyone objectively?
          *   *Refinement:* Focus on the *boundary*. Is it a bright line or a slippery slope? If it's a slope, where does responsibility stop?
          *   *Follow-up:* She'll say "We can't live that way." Push on the *cost* of ignoring the science.

      *   *Requirement 3: Pereboom/Manipulation Cases.*
          *   *Idea:* In manipulation cases, we feel resentment but think they aren't responsible. This splits reactive attitudes from responsibility.
          *   *Draft:* In manipulation cases, we still get mad. So reactive attitudes aren't a good guide.
          *   *Refinement:* Focus on the *conflict*. If the attitudes fire but we withhold blame, aren't the attitudes unreliable?
          *   *Follow-up:* She'll say "That's a glitch." Push on whether glitches undermine the whole system.

      *   *Requirement 4: The "External Standpoint" Dodge.*
          *   *Idea:* She says we can't ask from outside. But we do it all the time (e.g., cultural critique).
          *   *Draft:* You say we can't step outside. But we criticize other cultures' practices.
          *   *Refinement:* Frame it as "human history." We've abandoned practices before (witch hunts). How was that justified if not from a "new" outside?
          *   *Follow-up:* She'll say "That was internal progress." Push on the *source* of the new standard.

      *   *Requirement 5: The Cost of Resentment.*
          *   *Idea:* Reactive attitudes are painful. Why keep them if determinism is true?
          *   *Draft:* Resentment hurts. If determinism is true, why suffer?
          *   *Refinement:* Focus on the *trade-off*. Is the cost worth it if the metaphysical basis is shaky?
          *   *Follow-up:* She'll say "It's the cost of love." Push on whether love requires *retributive* resentment specifically.

      *   *Requirement 6: The "Justification" Semantic Game.*
          *   *Idea:* She says "justification" is the wrong word. But isn't she just hiding?
          *   *Draft:* Aren't you just playing word games to avoid hard questions?
          *   *Refinement:* Too aggressive. Soften. Is it a "transcendental argument"? If so, doesn't it need premises?
          *   *Follow-up:* She'll deny it's a transcendental argument. Push on what kind of argument it is then.

      *   *Requirement 7: Future of Responsibility.*
          *   *Idea:* If neuroscience advances, will your view survive?
          *   *Draft:* Will AI or brain implants break your theory?
          *   *Refinement:* Connect to the "human form of life." If the form of life changes, does responsibility vanish?
          *   *Follow-up:* She'll say "Responsibility changes." Push on whether it disappears entirely.

      *   *Requirement 8: The Victim's Perspective.*
          *   *Idea:* Victims want blame. If you tell them "no metaphysical blame," does that help?
          *   *Draft:* Does your view help victims?
          *   *Refinement:* Focus on the *function* of blame. If it's just a practice, does it lose its sting?
          *   *Follow-up:* She'll say "It keeps the sting." Push on whether the sting relies on the metaphysical belief she denies matters.

  4.  **Review and Refine:**
      *   Check against constraints: 7-8 questions? Yes. Follow-ups included? Yes. Specific topics (Watson/Wolf, Objective Attitude, Pereboom) covered? Yes.
      *   Tone check: Ensure the follow-ups anticipate the specific Strawsonian "move" (e.g., "That's an internal modification," "We can't live without it").
      *   Polishing: Make the questions sound like spoken podcast dialogue, not academic prose.

  5.  **Final Polish (Self-Correction during drafting):**
