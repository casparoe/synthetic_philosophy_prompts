answer: |-
  This is a profound tension that cuts to the heart of both normative ethics and the psychology of longtermism. You have identified a genuine friction in Ramsey's corpus that is often glossed over: the existential Ramsey of the *Epilogue* (1925) seems to dismiss the far future to preserve present meaning, while the economic Ramsey of *A Mathematical Theory of Saving* (1928) demands we sacrifice present consumption for the far future based on the principle that time itself confers no moral discount.

  To resolve this for a modern longtermist, we must distinguish between **existential significance** (does my life matter?), **moral aggregation** (do more lives matter more?), and **psychological capacity** (can I feel the weight of the future?).

  Here is an analysis of the implications of Ramsey's views for longtermism, addressing your specific puzzles.

  ### 1. Scale: Significance vs. Aggregation
  You ask whether Ramsey's claim that "scale is irrelevant to significance" targets the same thing longtermists rely on. The answer is **no**, and distinguishing them is the first major implication for longtermist strategy.

  *   **Ramsey's Target (1925):** Ramsey is arguing against **cosmic nihilism**. When he says size and duration don't make things more or less important, he is defending the *intrinsic* value of a human life against the *extrinsic* vastness of the universe. He is saying: "A human life is not rendered worthless because the universe is big, nor valuable because the universe is small." This is a claim about **density of value**.
  *   **Longtermism's Target:** Longtermism (specifically the "astronomical waste" argument) relies on **aggregative value**. It does not claim that a future life is *intrinsically* more valuable than a present life because it is far away. It claims that if a present life has value $V$, and there are $N$ future lives, the total stake is $N \times V$.

  **Implication:** A Ramseyan longtermist should not argue that the *vastness* of the future is what makes it important. That would violate Ramsey's 1925 insight. Instead, the argument must be that the *number of individuals* is what matters. The "scale" of the universe is morally inert; the "scale" of the population is morally decisive. This protects longtermism from the charge of "number worship" while retaining the mathematical force of the expected utility calculation. It shifts the rhetorical focus from "awe at the cosmos" to "duty to the multitude."

  ### 2. The Discounting Contradiction: Psychological vs. Ethical
  The apparent inconsistency between the 1925 "compound discount" remark and the 1928 condemnation of time preference is the crux of your puzzle. Can they be reconciled, or must one go?

  They can be reconciled if we interpret them as addressing two different domains: **phenomenology** vs. **normative ethics**.

  *   **1925 (Phenomenological/Psychological):** In the *Epilogue*, Ramsey is describing how a human being *can* maintain sanity and meaning. When he says the heat death has "present value at compound discount is almost nothing," he is admitting a cognitive limitation. He is saying, "I cannot emotionally grasp a billion years away, and I should not let that abstraction crush my current agency." This is a description of human psychology, not a prescription for policy.
  *   **1928 (Normative/Ethical):** In the saving paper, Ramsey is prescribing how a rational agent *ought* to calculate social welfare. Here, he argues that "weakness of imagination" is a bias to be corrected, not a justification for policy. Just because we *feel* less connection to the future doesn't mean we *should* value it less.

  **Resolution:** The longtermist should adopt the 1928 rule for **decision-making** and the 1925 rule for **mental health**.
  If you try to *feel* the weight of astronomical waste (1925 style), you risk paralysis or existential dread. If you try to *discount* the weight of astronomical waste (1928 style), you commit an ethical error. Ramsey suggests we must act *as if* the future matters fully (1928), even while we live emotionally in the foreground (1925). One position does not have to go; they occupy different lanes. The 1928 view overrides the 1925 view only when moving from "how I cope with life" to "how I allocate resources."

  ### 3. Emotional Detachment vs. Moral Obligation
  You ask whether it is coherent to insist that cosmic scale should leave a person emotionally unmoved while still mattering enormously to what that person ought to do.

  **Yes, it is coherent,** and it is arguably the only stable stance for a longtermist. This is a classic Pragmatist distinction, which Ramsey (alongside Wittgenstein and Peirce) helped pioneer.

  *   **The View from Here:** In the *Epilogue*, Ramsey is advocating for a "perspective" drawing. We live in the foreground. To demand that we *feel* the same emotional resonance for a person in the year 3000 as for our child is to demand a psychological impossibility. Ramsey's "unmoved" stance is an acknowledgment of human finitude.
  *   **The View from Nowhere:** In his economics and probability theory, Ramsey constructs formal systems (subjective probability, optimal saving) that correct for human finitude. We use the formalism to dictate action, even if our emotions don't follow.

  **Implication for Longtermism:** This resolves the problem of "compassion fade." Longtermists often burn out trying to emotionally connect with future generations. A Ramseyan approach suggests you don't need to *feel* the suffering of a billion future people to be obligated to save them. You only need to acknowledge the **axiom** that they count equally (1928). You can remain emotionally "unmoved" by the vastness (1925) while being rigorously committed to the *policy* implications of that vastness. This allows for a "cool" longtermism: dutiful, calculated, but not reliant on a sense of cosmic awe that is fragile and hard to sustain.

  ### 4. Synthesis: A Ramseyan Longtermism
  If we integrate these points, Ramsey's biography offers a specific corrective to the current rationalist/longtermist milieu:

  1.  **Reject Cosmic Awe:** Do not ground the importance of the future in the "majesty" of deep time or the size of the universe. Ramsey would view this as a category error (confusing physical scale with moral weight). Ground it in the aggregation of individual welfare.
  2.  **Dual-Process Ethics:** Adopt a split between **evaluation** and **experience**. In evaluation (policy, career choice, donation), apply the 1928 zero pure time preference rule strictly. In experience (daily life, finding meaning), apply the 1925 "perspective" rule. Do not let the heat death ruin your tea, but do not let your love of tea justify ignoring the heat death's preventability.
  3.  **The Role of Imagination:** Ramsey calls discounting a "weakness of the imagination." For the longtermist, the project is not to *feel* the future, but to **imagine** it well enough to include it in the calculation. The "Epilogue" admits the weakness; the "Saving" paper demands we overcome it through institutional and rational structures, not just raw emotion.

  ### Conclusion
  The inconsistency you spotted is real, but it is productive. It reveals that Ramsey viewed the **meaning of life** and the **ethics of policy** as separate problems requiring different tools.

  For the longtermist, Ramsey's legacy implies that you do not need to feel small before the stars to acknowledge your duty to the future. In fact, Ramsey suggests the opposite: you must insist that your foreground actions have background consequences, not because the background is "big," but because the people in it are just as real as the people in front of you. The 1925 *Epilogue* protects the agent from nihilism; the 1928 *Saving* paper protects the future from negligence. A coherent longtermism needs both: the emotional resilience to ignore the void, and the ethical rigor to fill it.
