answer: |-
  You have hit on exactly the first move that almost everyone makes when they encounter the Repugnant Conclusion. In fact, Derek Parfit himself considered Average Utilitarianism (AU) seriously and ultimately rejected it.

  The reason population ethicists don't just "adopt the average view and move on" is that while Average Utilitarianism solves the Repugnant Conclusion, it generates **its own set of conclusions that are equally counterintuitive, disturbing, or "repugnant."**

  In population ethics, there is no free lunch. Every major theory violates at least one very strong moral intuition. Here is why Average Utilitarianism is generally considered just as problematic as Total Utilitarianism.

  ### 1. The Problem of Happy Lives (The "Anti-Natalist" Implication)
  This is the biggest dealbreaker for Average Utilitarianism.

  Under Total Utilitarianism, adding a happy person is always good (because it adds to the sum). Under Average Utilitarianism, adding a happy person is **bad** if their happiness is below the current average.

  **The Scenario:**
  Imagine a world with 1 billion people who are ecstatically happy (let's say welfare level 100/100). The average is 100.
  Now, imagine a couple wants to have a child. This child will have a wonderful life, full of joy and love, but perhaps they will face some minor struggles. Their welfare will be a solid 90/100.

  **The AU Verdict:**
  Creating this child is **morally wrong**. By adding a person with a welfare of 90 to a population with an average of 100, you have lowered the average welfare of the world. You have made the world *worse* by creating a happy person.

  Most people have the intuition that creating a happy life is a good thing (or at least neutral), not a moral harm. Average Utilitarianism implies that once humanity reaches a certain level of happiness, we should stop reproducing entirely, even if the new lives would be wonderful.

  ### 2. The Sadistic Conclusion
  This is arguably worse than the Repugnant Conclusion. Average Utilitarianism can imply that it is better to add people with *negative* welfare (suffering) than to add people with *positive* welfare (happiness), depending on the math.

  **The Scenario:**
  *   **Population A:** 10 people with welfare level 10. (Average = 10).
  *   **Option B:** Add 100 new people with welfare level 9. (They are happy, just slightly less than the original group).
      *   New Total: (100 + 900) / 110 = 9.09 Average.
  *   **Option C:** Add 1 new person with welfare level -100 (They are suffering immensely).
      *   New Total: (100 - 100) / 11 = 0 Average.

  Wait, that math doesn't show the Sadistic Conclusion clearly. Let's look at the comparison logic.
  The Sadistic Conclusion (formulated by Gustaf Arrhenius) states that a theory implies it is better to add lives with negative welfare than lives with positive welfare.

  AU implies this because adding a large number of "moderately happy" people can drag the average down significantly, whereas adding a small number of "suffering" people might drag it down less (or, in comparison cases, AU might prefer a population with some suffering over a larger population with mild happiness).

  More simply: AU implies that if you have a population of very happy people, it is better to **kill the least happy among them** to raise the average. If you have a group of people with "barely worth living" lives, AU implies it is better to eliminate them to raise the average welfare of the survivors. This violates the "Person-Affecting Intuition" that killing happy people is bad.

  ### 3. The Mere Addition Paradox
  Parfit showed that Average Utilitarianism doesn't actually escape the cycle of paradoxes that lead to the Repugnant Conclusion.

  In his "Mere Addition Paradox," Parfit constructs a chain of reasoning where:
  1.  A+ is not worse than A (A+ is A plus some extra happy people).
  2.  B is better than A+ (B has higher equality/average).
  3.  Therefore, B is better than A.

  But if you repeat this logic, you end up back at the Repugnant Conclusion (Z is better than A). Average Utilitarianism struggles to block this transitivity without accepting other weird claims. It doesn't provide a stable "stop" point that satisfies all our intuitions.

  ### 4. The "Dictatorship of the Existing"
  Average Utilitarianism makes the value of potential people entirely dependent on the welfare of existing people.

  Whether it is "good" to create a happy child depends on how happy *you* are.
  *   If you are miserable (average welfare is low), creating a happy child is morally praiseworthy (it raises the average).
  *   If you are ecstatic (average welfare is high), creating that same happy child is morally wrong (it lowers the average).

  This means the moral status of bringing a new human into existence fluctuates based on the mood of the current population. Most ethicists find this instability unacceptable.

  ### 5. Arrhenius's Impossibility Theorem
  The reason this is treated as a "deep unsolved problem" is that it has been mathematically formalized. Philosopher Gustaf Arrhenius proved an **Impossibility Theorem** in population ethics.

  He demonstrated that no theory can satisfy a set of very basic, widely accepted adequacy conditions simultaneously. You literally cannot have a theory that:
  1.  Avoids the Repugnant Conclusion.
  2.  Avoids the Sadistic Conclusion.
  3.  Accepts that adding happy lives is good.
  4.  Accepts that equality is good.
  5.  Is logically consistent (transitive).

  You have to violate at least one. Total Utilitarianism violates #1. Average Utilitarianism violates #3 and #2.

  ### Summary
  Population ethicists haven't "missed" the Average Utilitarianism fix. They have rejected it because **it trades the Repugnant Conclusion for the "Sadistic Conclusion" and the "Happy Child Problem."**

  *   **Total Utilitarianism** says: "A world of billions of miserable people is better than a world of millions of happy people." (Repugnant)
  *   **Average Utilitarianism** says: "Creating a happy child is morally wrong if your life is too good," and "It might be better to add suffering people than happy people." (Also Repugnant)

  The field is stuck because every simple mathematical function (Sum, Average, Critical Level, etc.) fails to capture the nuance of our moral intuitions regarding existence. That is why it remains an open, active, and frustrating area of philosophy.
