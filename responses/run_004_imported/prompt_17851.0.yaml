  1.  **Analyze the User and Request:**
      *   **User:** High school senior taking AP Statistics.
      *   **Context:** Writing an end-of-year independent research paper (approx. 1,500 words).
      *   **Topic:** The replication crisis in psychology, specifically critiquing the narrative that "Frequentism caused it, Bayesianism fixes it."
      *   **User's Argument Sketch:**
          1.  Researcher degrees of freedom (p-hacking) apply to Bayesian methods too (prior hacking, model hacking).
          2.  The problem is often a misunderstanding of the Fisher/Neyman-Pearson hybrid, not frequentism itself.
