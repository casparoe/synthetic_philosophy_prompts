      *   **Case Study:** Two siblings (Dana and brother) inherit a cottage ($180k value). Instead of cooperating, they hire lawyers to fight for ownership/share. Legal fees escalate ($70k+ combined). Neither quits because quitting means wasting past spend *and* letting the other "win." Result: Asset sold, fees paid, almost nothing left.
      *   **Current Interpretation:** Colleague called it "Sunk Cost Fallacy."
      *   **User's Critique:** "Sunk Cost" is too individualistic. This is a *strategic interaction* between two parties.
      *   **Core Questions:**
          1.  Is there a more specific structure than Sunk Cost? (Yes, it's a game).
          2.  Was there *ever* a point where escalating was individually rational (given expectations)?
          3.  Were they doomed from the start (lawyering up)?
      *   **Requirement:** Needs "analytical bite" for students, avoiding platitudes like "communicate better."

  2.  **Deconstruct the Scenario using Game Theory:**
      *   *Players:* Dana, Brother.
      *   *Stakes:* Cottage Value ($180k).
      *   *Costs:* Legal fees (accumulating over time).
      *   *Dynamic:* Escalation. One moves, other counters.
      *   *Motivation:* Financial gain + Psychological utility (winning/not losing face/sentimental value).
      *   *Outcome:* Mutual destruction (negative sum game).

  3.  **Identify the Game Structure:**
      *   *Sunk Cost Fallacy:* The colleague isn't *wrong*, but they are incomplete. Sunk cost explains why *past* spend influences *future* decisions irrationally. But here, the future decision depends on the *other player's* move.
      *   *War of Attrition:* This is the classic model. Two players compete for a prize by incurring costs over time. The one who persists longer wins. The cost is incurred by *both* regardless of who wins (until one quits).
      *   *Prisoner's Dilemma:* Not quite. In PD, defection is dominant regardless of the other. Here, if one quits early, they lose less. But if both fight, they lose big. It's more dynamic than a one-shot PD.
      *   *Dollar Auction:* Very close. In a dollar auction, people bid >$1 for a $1 bill to avoid losing their previous bid. This fits the "quit now = previous spend wasted + brother wins" logic perfectly.
      *   *Escalation of Commitment:* Related to sunk cost but in a competitive context.

  4.  **Address the "Rationality" Question (The Hard Part):**
      *   *Was escalating ever rational?*
      *   *Ex-ante (Start):* Hiring lawyers was likely irrational compared to mediation/selling, *unless* they valued "winning" (psychological utility) higher than money. If Utility(Win) > $180k, then fighting is rational.
      *   *Interim (Month 2, Month 10):* This is the crux. In a War of Attrition, rationality depends on *beliefs* about the opponent's threshold. If Dana believes Brother will quit at $40k spend, and she is at $30k spend, spending another $5k to win $180k is rational *expected value*.
      *   *The Trap:* The trap is that *both* reason this way simultaneously. It becomes a game of incomplete information. Who has the higher pain threshold?
      *   *Doomed from the start?* Not necessarily "doomed" in a deterministic sense, but the structure creates a high probability of ruin if they cannot coordinate or signal commitment credibly. The act of lawyering up signals "I am not cooperating," which triggers the defensive escalation.

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the user's intuition. The colleague was half-right but missed the strategic dimension.
      *   **The Model:** Introduce the **War of Attrition** and the **Dollar Auction**. These are the precise game-theoretic structures.
      *   **The Utility Function:** Crucial point. Rational Choice Theory assumes agents maximize *utility*, not just *money*. If "Beating my brother" or "Keeping Mom's house" has high subjective value, the spending *is* rational up to a point. The error might be in *valuation*, not logic.
      *   **The Rationality of Escalation (The "Month 2" Question):**
          *   Analyze the marginal decision. At any point $t$, Cost to continue < (Probability of Opponent Quitting $\times$ Prize Value).
          *   Explain why it looks rational *locally* but leads to *global* ruin. This is the "Sophisticated vs. Naive" distinction.
      *   **The "Doomed" Question:**
          *   Discuss **Common Knowledge of Rationality**. If both know the other is rational, they should calculate the ruinous endpoint and quit immediately.
          *   But if there is *asymmetric information* (I don't know how much you care), fighting is a signaling mechanism. "I am willing to burn money to show you I won't quit." This makes the escalation rational as a *signal*, even if the outcome is bad.
      *   **Pedagogical Takeaways:** Give the user concrete concepts for the seminar.
          1.  Sunk Cost vs. Strategic Commitment.
          2.  Common Knowledge & Backward Induction.
          3.  Utility beyond money (Spites/Sentiment).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to say "It was rational." Say "It was *boundedly* rational" or "Rational given specific belief structures."
      *   *Nuance:* The "Dollar Auction" is usually an auction. This is a partition suit. It's closer to War of Attrition.
      *   *Key Insight:* The "Sunk Cost" label implies a cognitive error. The "War of Attrition" label implies a structural trap. The latter is more useful for Rational Choice theory because it shows how rational individuals can produce irrational collective outcomes.
      *   *The "Doomed" aspect:* If they are hyper-rational and have common knowledge of payoffs, they shouldn't start. But in reality, they don't know the other's payoff function. So the escalation is a discovery process that went too far.

  7.  **Final Polish:**
      *   Tone: Academic but accessible, respectful of the user's expertise.
      *   Structure: Clear headings, defined terms.
      *   Closing: A specific "seminar prompt" idea.

  8.  *(Final check against constraints)*: Did I answer if it was ever rational? Yes (locally yes, globally no). Did I address the "doomed" question? Yes (contingent on information). Did I avoid "communicate better"? Yes (focused on incentives and structure).

  9.  **Constructing the Output.** (Proceed to write the response based on these thoughts.)
answer: |-
  Your intuition is spot-on: labeling this merely a "sunk cost fallacy" is analytically lazy. It treats Dana's decision as a solitary cognitive error, ignoring the fact that she was playing a **game** against an opponent who was simultaneously optimizing against her. In a rational choice seminar, you want to move your students from *psychological heuristics* to *strategic structure*.

  The structure you are looking for is the **War of Attrition**, closely related to the **Dollar Auction**.

  Here is the analytical breakdown you can use to dismantle the "sunk cost" explanation and tackle the rationality questions with your students.

  ### 1. The Structure: War of Attrition, Not Sunk Cost
  The sunk cost fallacy describes a single agent failing to ignore irrecoverable costs. But Dana wasn't just looking at her bank account; she was looking at her brother.

  In a **War of Attrition**, two players compete for a prize by incurring costs over time. The player who persists longer wins the prize, but *both* players pay the costs they accumulate until the moment one quits.
  *   **The Prize:** The cottage (plus the psychological utility of "not losing" to a sibling).
  *   **The Cost:** Legal fees (accumulating per round).
  *   **The Dynamic:** If Dana quits at Month 3, she pays 3 months of fees and gets 0% of the cottage. If she quits at Month 18, she pays 18 months of fees and gets 0%. But if she stays in, there is a non-zero probability her brother quits at Month 19.

  This structure transforms the "sunk cost" from a cognitive bug into a **strategic signal**. By continuing to spend money, Dana is signaling to her brother: *"I have a higher pain threshold than you. If you keep fighting, you will run out of money before I do."*

  ### 2. Was Escalating Ever Rational? (The Local vs. Global Problem)
  This is the crux of your seminar discussion. The answer is: **Yes, locally rational; No, globally rational.**

  At any specific month $t$ (say, Month 2), Dana faces a marginal decision. She has already spent \$10k. She is asked to spend another \$5k.
  *   **The Sunk Cost View:** The \$10k is gone. Ignore it. Is the cottage worth \$5k? Yes. Fight.
  *   **The Game Theory View:** Is the *expected value* of continuing positive?
      $$EV = (P_{win} \times \text{Prize}) - \text{Marginal Cost}$$

  If Dana believes there is even a 10% chance her brother folds in the next round, and the net prize (after fees) is \$100k, the expected value of spending \$5k is positive (\$10k - \$5k = +\$5k).

  **The Trap:** Both players run this calculation simultaneously. As long as $P_{win}$ (the probability the other quits) remains above zero, it is rational to spend the next increment. The tragedy is that $P_{win}$ is endogenous—it depends on the brother running the same calculation. They are both betting on the other's rationality, but the structure incentivizes *irrational* persistence to force the other to quit.

  So, to answer your question: **At Month 2, escalating was individually rational** *if* Dana assigned a non-trivial probability to her brother capitulating soon. The rationality only evaporates in hindsight because the brother *didn't* capitulate.

  ### 3. Were They Doomed the Moment They Lawyer Up?
  This depends on the **Information Set**.

  **Scenario A: Complete Information (They are "Doomed" to Cooperate)**
  If Dana and her brother knew *exact* payoff functions (e.g., "I value the house at \$180k, he values it at \$180k, we both know legal fees are \$5k/month"), they could use **backward induction**.
  1.  They calculate the endpoint where fees > asset value.
  2.  They realize that at the endpoint, neither will win.
  3.  Knowing this, they realize fighting at the start is useless.
  4.  **Result:** They settle immediately or flip a coin. Hyper-rationality saves them.

  **Scenario B: Incomplete Information (They are "Doomed" to Fight)**
  This is the realistic scenario. Dana does not know how much her brother values "winning" vs. money. Maybe he is irrationally committed. Maybe he has deeper pockets.
  *   In this context, hiring a lawyer is a **Costly Signal**. It says, "I am entering a war of attrition."
  *   Once the signal is sent, the only way to win is to prove you are the "crazier" player (the one willing to burn more money).
  *   **Result:** They are effectively doomed once they enter the legal framework because the legal framework *removes the ability to make cheap, binding promises.* A lawyer's job is to escalate; a mediator's job is to settle. By choosing the adversarial mechanism, they selected a game where the Nash Equilibrium is mutual destruction.

  ### 4. The Missing Variable: Utility of "Winning"
  Your colleague's "sunk cost" critique assumes the prize was purely financial ($180k). But Dana said, *"Quitting... would mean her brother would basically win."*

  In Rational Choice terms, the Utility function ($U$) was not just Money ($M$).
  $$U = M + S$$
  Where $S$ is the **Spite/Sentiment Value**.

  If $S$ (the utility of denying the brother the house) is valued at \$100k by Dana, and \$100k by the brother, then spending \$70k to win is **perfectly rational**. They didn't miscalculate the math; they miscalculated the *valuation*. They were paying \$70k for a \$100k psychological prize.

  The tragedy isn't that they were irrational; it's that they were **rationally pursuing a negative-sum good.** They turned a positive-sum asset (the house) into a negative-sum contest (the litigation) because the utility derived was relative (doing better than the sibling) rather than absolute (net wealth).

  ### Seminar Takeaways for Your Students
  To give this "analytical bite," frame the case study around these three distinctions:

  1.  **Sunk Cost vs. Strategic Commitment:** Sunk cost is a cognitive bias; Strategic Commitment is a move to bind oneself to a course of action to influence an opponent. Dana wasn't just "throwing good money after bad"; she was buying *leverage*. The error was that her brother bought leverage too.
  2.  **The Dollar Auction Paradox:** Introduce Martin Shubik's Dollar Auction. The highest bidder wins the dollar, but the *second-highest* bidder pays their bid and gets nothing. This perfectly models the "quit now and you lose everything you spent" dynamic. It demonstrates how rational bidders are logically forced to bid *over* the value of the prize to minimize losses.
  3.  **Common Knowledge of Rationality:** Ask your students: *If Dana knows her brother is rational, and her brother knows Dana is rational, why didn't they stop?* The answer lies in **asymmetric information**. They were fighting to discover the other's true reservation price. The market (the court) was the discovery mechanism, and it was too expensive.

  **The Verdict:**
  Dana was not a victim of a simple fallacy. She was a player in a **War of Attrition with incomplete information**, where the utility function included **relative status**. Escalation was locally rational at almost every step until the "common knowledge" of ruin became undeniable. They weren't doomed the moment they hired lawyers, but they were doomed the moment they treated a coordination problem as a zero-sum contest.

  **Discussion Prompt for Class:**
  *"If you were Dana's lawyer in Month 2, knowing the War of Attrition structure, what mechanism could you propose to change the game from 'Attrition' to 'Coordination' without your client appearing weak?"* (This forces them to solve for mechanism design, not just moralize).
