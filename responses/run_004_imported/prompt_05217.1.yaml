      *   **The Result:** In a model of ZF + DC + "There exists an inaccessible cardinal," every set of reals is Lebesgue measurable (has the Baire property, perfect set property, etc.).
      *   **The Cost:** You need an *inaccessible cardinal*. This is a large cardinal axiom. It is stronger than ZF. It is not provable in ZF.
      *   **The Trade-off:** You get rid of the "monsters" (non-measurable sets) but you have to assume the existence of a huge infinity that you can't prove exists.

  4.  **Simulate Borel's Reaction (The "Best Guess"):**
