answer: |-
  This is a fantastic question. You've clearly done your homework on the 1905 debate and the subsequent independence results, so I won't waste time rehashing the timeline. You're asking for a psychological and philosophical profile of Émile Borel applied to a counterfactual historical moment.

  Here is my best guess at how Borel would have reacted to Solovay's 1970 result.

  ### 1. The Vindication: "I Told You The Monsters Were Artifacts"
  Borel's primary objection to the Axiom of Choice was never purely logical; it was *semantic* and *analytic*. He didn't just think AC was "unprovable"; he thought it was meaningless to talk about a set you couldn't define. When Vitali constructed a non-measurable set using AC, Borel viewed this as a *reductio ad absurdum* of AC, not a genuine discovery about the real numbers.

  If Borel saw Solovay's model, his first reaction would likely be triumph. Solovay proved that the "monsters" (non-measurable sets, Banach-Tarski decompositions) are not inherent features of the continuum. They are artifacts of adding a specific, powerful axiom (AC).

  For Borel, this would validate his core intuition: **Analysis should work cleanly.** The fact that there exists a consistent mathematical universe where Dependent Choice (DC) holds (which Borel was generally comfortable with) and *every* set of reals is Lebesgue measurable would prove that his version of mathematics wasn't "broken" or "incomplete." It would prove that Zermelo's well-ordering of the reals was an optional extra, not a fundamental truth. He would take this as confirmation that AC was indeed the "cheat" he accused it of being.

  ### 2. The Hesitation: The Price of the Inaccessible Cardinal
  However, your intuition about the "shadier deal" is spot on, and this is where Borel would pause.

  Borel was a semi-constructivist. He famously stated, "I do not believe in the actual infinite." He was willing to accept potential infinity (like the natural numbers going on forever) and even countable sets, but he was deeply suspicious of arbitrary uncountable collections.

  To get Solovay's nice world, you have to assume the existence of an **inaccessible cardinal**.
  *   **From a modern set theorist's view:** This is a standard large cardinal axiom. It's "stronger" than ZFC in consistency strength, but it's a structural assumption.
  *   **From Borel's view:** An inaccessible cardinal is a *massive* actual infinity. It is an object so large it cannot be reached from below by standard set-theoretic operations.

  Borel would likely argue that positing an inaccessible cardinal is ontologically expensive. He might say: *"You are asking me to reject the Axiom of Choice because it assumes the existence of choice functions I cannot name, but to save me from the consequences, you must assume the existence of a cardinal I also cannot name, construct, or reach?"*

  He might view the inaccessible cardinal as just another "ideal element" in the Hilbertian sense—something useful for meta-mathematical proofs but not "real" mathematics.

  ### 3. The Resolution: Analysis vs. Set Theory
  Here is the crucial pivot in Borel's thinking: **Borel cared about Analysis, not Set Theory.**

  Borel was an analyst first. He developed measure theory to make integration work. He viewed set theory as a language to serve analysis, not as a foundation to dictate it.
  *   **AC** directly breaks analysis (by creating non-measurable sets).
  *   **The Inaccessible Cardinal** lives in the high reaches of set theory (far above the reals).

  Borel would likely make a pragmatic distinction. He would argue that the inaccessible cardinal is a *consistency assumption* required to build the model, but it doesn't necessarily pollute the daily work of integration on the real line. In the Solovay model, the reals behave perfectly. The "sin" of assuming the inaccessible happens "upstairs," while the "salvation" happens "downstairs" on the real line where Borel lived and worked.

  He would likely conclude that assuming a large cardinal to *protect* the reals is a better deal than assuming AC to *well-order* them. One assumption (Inaccessible) secures the integrity of calculus; the other (AC) destroys it.

  ### 4. The Final Verdict
  If Borel saw Solovay's result, I think he would feel **80% vindicated and 20% philosophically uneasy.**

  He would tell Cohen and Solovay: *"You have proven my point. The pathologies of the real line are not necessary. However, do not tell me this inaccessible cardinal is 'real.' It is a logical scaffolding we use to ensure the house of Analysis doesn't collapse."*

  He would likely reject the idea that Solovay's model is *the* true universe of sets (he was wary of Platonism), but he would embrace it as the *correct* universe for analysis. He would probably view the independence of AC (Cohen's result) as the final nail in the coffin for Zermelo's claim that AC was "self-evident."

  **In short:** He would accept the "shady deal." To Borel, a "shady" axiom is one that breaks the tools of calculus. An axiom that lives in the transfinite stratosphere but keeps Lebesgue integration safe? That's not shadiness; that's damage control. He'd take the inaccessible cardinal as the cost of doing business to keep the Vitali sets out of his integrals.
