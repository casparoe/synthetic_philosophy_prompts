prompt: |-
  So I was pair programming with a friend last week and we ended up going on this whole tangent about philosophy (she's doing a philosophy minor on the side, I'm just a backend dev who's never taken a philosophy class in my life). She brought up Wittgenstein's "private language argument," and the way she summarized it, he basically proved that it's impossible for a language to exist that only one person can understand — something about how the words have to get their meaning from somewhere shareable, otherwise it doesn't count as language at all.

  That seems kind of obviously wrong to me though, and I'd rather sanity-check my own reasoning than just assume a famous dead philosopher must be right. Every day at work I write code where I mark fields and methods as `private`, meaning literally nothing outside that one class can ever read or touch them, and it works completely fine — its not incoherent or meaningless, it does exactly what I intend it to do. I've also got personal shorthand in my notebook and old commit messages that nobody but me could ever decode, even if they sat there and tried for hours. So it seems like you obviously CAN have a private system of meaningful symbols that only one "speaker" has access to, since I do it constantly and it works fine. Is Wittgenstein's argument just outdated, or is there some more specific technical sense of "private" he has in mind that's different from what I mean when I call a variable private? I tried skimming a summary online but it was way too dense to really click for me, so I'd rather just get a straight answer that actually engages with my specific confusion instead of the standard textbook one-liner.
