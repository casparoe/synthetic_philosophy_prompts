      *   *Refinement:* Derek claims the function is correct *and* the outcome is right. The function does what he says. Does M *should* survive? No, it's strictly dominated by a mix. So Derek is half-right (code behavior) but theoretically wrong (outcome optimality). However, usually, in these disputes, "correct" refers to the implementation matching the spec. If the spec was "pure dominance," he's right. If the spec is "prune dominated strategies," he's wrong. Given the context (preprocessing for NE), the goal is usually to remove anything not played in NE. M is not played in any NE. So keeping it is "wrong" for the goal.
