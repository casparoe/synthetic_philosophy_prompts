          *   If you fix a rule, you get *one* specific reduced game. But that reduced game might not contain *all* (or any) of the original NEs.
          *   Derek argues "every run... gives the same output." This is true for software engineering (determinism).
          *   He argues this invalidates the label "order-dependent." This is semantic pedantry. The process is mathematically path-dependent; forcing a path doesn't change the mathematical property that *other* paths yield different (and potentially valid) results, and that the chosen path might be "wrong" (eliminating NEs).
