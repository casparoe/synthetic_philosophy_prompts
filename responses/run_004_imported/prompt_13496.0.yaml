answer: |-
  This is a classic and deeply felt objection, and given your background, you are uniquely positioned to see why the standard Dutch Book Argument (DBA) feels unsatisfying. As a scientist, you know that having a model that can be "money-pumped" is a pragmatic disaster, but it doesn't immediately imply the model is *false* or that the parameters are *unjustified*. It just implies you shouldn't take that model to a casino.

  The objection you are raising is known as the **Pragmatic Objection**. It claims that DBAs demonstrate a inconsistency in *preferences* or *actions*, not necessarily in *beliefs*.

  The "depragmatized" argument you are vaguely remembering is almost certainly the **Accuracy Argument**, pioneered most notably by Jim Joyce in his 1998 paper *"A Nonpragmatic Vindication of Probabilism."*

  Here is how that argument works, how it attempts to close the gap, and a critical assessment of whether it succeeds.

  ---

  ### 1. The Core Move: From Money to Accuracy

  The standard DBA relies on a bridge principle: **Credences are defined by betting dispositions.** If you believe $P(A) = 0.7$, you should be willing to buy a ticket that pays \$1 if $A$ is true for \$0.70.
  *   **The Gap:** Why should my epistemic state be governed by how I handle money?

  The Accuracy Argument replaces the bridge principle. It posits a different norm: **The Epistemic Goal.**
  *   **The Norm:** The fundamental epistemic goal of belief is **accuracy**. A credence function is better if it is "closer" to the truth.
  *   **The Metric:** We need a way to measure the "distance" between a credence and the truth value (0 or 1). The standard choice is a **strictly proper scoring rule**, such as the **Brier Score** (which you will recognize as the mean squared error).
      *   If $A$ is true (1) and credence is $c$, penalty is $(1-c)^2$.
      *   If $A$ is false (0) and credence is $c$, penalty is $(0-c)^2 = c^2$.

  ### 2. The Mathematical Mechanism (Dominance)

  This is where your astrophysics intuition will click immediately. This is an **admissibility argument**.

  In decision theory, an estimator is "inadmissible" if there exists another estimator that has lower risk (expected loss) in *every* possible state of the world.

  Joyce's theorem (simplified) shows:
  1.  If your credence function $C$ violates the probability axioms (is incoherent)...
  2.  Then there exists a coherent credence function $C^*$...
  3.  Such that $C^*$ is **more accurate than $C$ in every possible world.**

  This is a **dominance argument**. It doesn't matter what the actual world looks like. It doesn't matter what your utility function for money is. If you are incoherent, you are literally guaranteeing that you are less accurate than you could be. There is a "free lunch" in accuracy space.

  ### 3. Does This Close the Pragmatic/Epistemic Gap?

  This is the crux of your question. Does swapping "money" for "accuracy" actually make the argument epistemic, or does it just hide the pragmatism?

  #### The Case for "Yes, it closes the gap"
  1.  **No Appeal to Action:** The argument does not require you to place a bet. It compares two static states of belief ($C$ and $C^*$) against the way the world is. It says nothing about what you *do*, only about the relationship between your mind and reality.
  2.  **Constitutive Aim:** Many epistemologists argue that belief *just is* a state that aims at truth. If you hold a belief, you are implicitly playing the "accuracy game." If you aren't trying to be accurate, you aren't doing belief; you're doing something else (like hoping or pretending). Therefore, a norm derived from accuracy is internal to the practice of belief.
  3.  **Resonance with Science:** As a data analyst, you would reject an estimator that is dominated by another. If Method A gives you a higher $\chi^2$ than Method B regardless of the data, Method A is objectively worse *as an estimator*. The Accuracy Argument treats credences as estimators of truth values.

  #### The Case for "No, it just moves the gap"
  Critics (like Hilary Greaves, David Wallace, and others who otherwise like accuracy arguments) point out residual issues:

  1.  **The Veritism Assumption:** The argument assumes **Veritism**: that accuracy is the *sole* fundamental epistemic good. But what about other epistemic values?
      *   *Example:* Maybe I value **simplicity** or **explanatory power**. An incoherent set of beliefs might be simpler to compute or more explanatorily satisfying than the coherent alternative $C^*$.
      *   If I trade a bit of accuracy for a lot of simplicity, am I epistemically irrational? The Accuracy Argument says "Yes, because accuracy dominates." But that presupposes accuracy trumps all other epistemic virtues. That is itself a normative claim, not a mathematical proof.
  2.  **The Choice of Scoring Rule:** The dominance result holds for *any* strictly proper scoring rule, but which one is the *true* measure of epistemic distance? The Brier score (squared error) is standard, but why not logarithmic loss? Different measures might rank incoherent sets differently. (Though, to be fair, the dominance result holds for the *class* of proper scoring rules, so this is less fatal).
  3.  **The "Why Care?" Question:** A hardline skeptic can still ask: "Okay, I'm less accurate. Why is that irrational? Why am I obligated to maximize accuracy?"
      *   The DBA answered this with "Because you'll lose money." (Pragmatic)
      *   The Accuracy Argument answers with "Because accuracy is the goal of belief." (Normative)
      *   Some argue this just shifts the burden from justifying the betting link to justifying the Veritist norm.

  ### 4. A Scientist's Perspective on the "Gap"

  Given your background, you might find the **Decision-Theoretic Representation** approach (Ramsey/de Finetti vs. Savage) less satisfying than the Accuracy approach, but there is a middle ground often discussed in philosophy of science.

  Consider the **Principal Principle** or **Calibration**.
  In astrophysics, if you report error bars (credences), you expect that in the long run, the true value falls within your $1\sigma$ range 68% of the time. If your reported probabilities are incoherent, you cannot be calibrated.
  *   **Pragmatic:** You get sued for misleading investors.
  *   **Epistemic:** Your model is lying about its own uncertainty.

  The Accuracy Argument formalizes this "lying" without needing the lawsuit. It shows that incoherent probabilities are mathematically incapable of minimizing distance from truth.

  ### 5. Verdict: Does it work?

  Most contemporary formal epistemologists (Joyce, Pettigrew, Leitgeb) believe the Accuracy Argument **successfully depragmatizes** the DBA.

  *   **It succeeds** in showing that probabilism is a requirement of *representational consistency* regarding truth, not just *transactional consistency* regarding money.
  *   **It fails** (or remains open) only if you reject **Veritism**. If you believe there are epistemic values incommensurable with accuracy (e.g., "understanding" that might require useful fictions), then the argument doesn't force you to be probabilistic.

  **My assessment:**
  For a retired astrophysicist, the Accuracy Argument is likely the most satisfying. It treats credences as **statistical estimators**.
  *   **Incoherent Credence:** An inadmissible estimator.
  *   **Coherent Credence:** An admissible estimator.
  *   **Irrationality:** Using an inadmissible estimator when an admissible one is available.

  This frames epistemic irrationality not as "being vulnerable to a con man" but as "using a dominated method." That feels like a genuine epistemic failing, not just a pragmatic one.

  ### Recommended Reading
  If you want to dive into the technicals of the depragmatized argument:
  1.  **Jim Joyce (1998):** *"A Nonpragmatic Vindication of Probabilism"* (Philosophy of Science). This is the seminal paper.
  2.  **Richard Pettigrew (2016):** *"Accuracy and the Laws of Credence"* (Book). This is the comprehensive modern treatment. He walks through the scoring rules and dominance theorems in detail.
  3.  **Hannes Leitgeb:** Look for his work on "stability" and accuracy, though he sometimes critiques the pure accuracy approach.

  **Summary:** The gap is closed *if* you accept that the primary norm of belief is accuracy. If you accept that, incoherence is mathematically proven to be suboptimal for that goal, independent of money. If you think belief serves other masters (utility, comfort, simplicity) equally, the gap remains. But for a scientist, Veritism is usually a pretty safe starting assumption.
