      *   **The Core Critique:** As an experimentalist, the user sees a fatal flaw: If ESP defies ordinary physical law and penetrates circuitry, a *physical* room cannot shield against it. Therefore, Turing's control is logically inconsistent with his own premise about the nature of ESP.
