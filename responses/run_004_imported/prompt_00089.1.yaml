          *   Explain the two notions of explanation: *Unification/Systematization* (Humean) vs. *Production/Governing* (Anti-Humean).
      *   **Part 2: Adjudicating the Dispute (Independent Arguments):**
          *   Move beyond "intuitions about laws."
          *   *Argument 1: The Epistemic Argument.* Humeans win here (we observe patterns, not necessitation).
          *   *Argument 2: The Intelligibility Argument.* Anti-Humeans win here (Humeans struggle with counterfactuals/chance). *Wait, actually:* Anti-Humeans argue *their* view makes laws intelligible as governors, Humeans argue *Anti-Humean* governing is unintelligible (Maudlin's "glue").
          *   *Argument 3: Scientific Practice.* Do physicists care about the "best system"? Or do they care about mechanisms?
      *   **Part 3: The Circularity Objection (The Loewer Move):**
          *   Explain the charge ($F \to L \to F$).
