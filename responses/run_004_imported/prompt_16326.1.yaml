      *   **Move 3: Ray's Rebuttal (Rarity $\neq$ Disease).**
          *   *Argument:* Rare traits (red hair, left-handedness, high IQ) aren't diseases. Boorse ties disease to parts/processes working below species-typical contribution to survival/reproduction. GH axis is fine. Polygenic luck isn't dysfunction.
          *   *Analysis:* Ray correctly identifies the flaw in Meredith's use of Boorse. He distinguishes between *statistical abnormality* and *functional dysfunction*.
