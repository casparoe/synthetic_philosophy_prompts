answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain taps against the window. Two coffee cups sit untouched.*

  **Characters:**
  *   **Julian:** A decision theorist who argues that coherence theorems constrain rational agency.
  *   **Sarah:** A philosopher of action who defends resolute choice and the possibility of non-EU rationality.

  ***

  **Julian:** So, I heard you had a marathon with Marco last night. He told me you stalled out on the money-pump argument. He said you claimed an agent could just "refuse" the pump.

  **Sarah:** I claimed that a *foresightful* agent could refuse the pump. Marco's version of the argument assumes the agent is myopic—that it looks at Trade 1, sees it's an improvement, takes it, then looks at Trade 2, sees it's an improvement, takes it, and wakes up broke at Trade 3. But no sufficiently capable AI is going to be myopic.

  **Julian:** That's the standard pushback, Sarah. But it misses the normative force of the theorem. The money pump isn't just a trick for the stupid. It's a proof that if your preferences violate the axioms—say, they're intransitive, A preferred to B, B to C, C to A—then there exists a sequence of trades you *would* accept, one by one, that leaves you worse off. If you have foresight, you see the loop. But then you face a choice: do you stick to your local preferences at each step, or do you override them?

  **Sarah:** And if I override them via a pre-commitment policy, I haven't been irrational. I've been resolute. I bind myself to the mast. I decide at Time 1: "I will not accept Trade 3." When Time 3 comes, my local preference might scream "Take the trade! It's better than what you have!" But I stick to the plan. I avoid the pump without adopting a complete utility function.

  **Julian:** But *why* do you stick to the plan? At Time 3, by hypothesis, you prefer the new option. If you refuse it, you are intentionally choosing an option you currently deem inferior. That's not rationality; that's akrasia. You're saying, "I know X is better than Y right now, but I'm choosing Y." You haven't solved the incoherence; you've just buried it under a layer of dynamic inconsistency.

  **Sarah:** That assumes the "Time 3 Self" is the only legitimate locus of evaluation. But agency is temporally extended. Rationality isn't about maximizing satisfaction at every instantaneous time-slice; it's about executing a coherent life plan. If I have incomplete preferences—say, I genuinely don't prefer the Museum to the Park, nor the Park to the Museum—I can adopt a policy: "Never pay to switch between incomparable options." That policy protects me from the pump.

  **Julian:** Okay, let's look at that policy. "Never pay to switch." Suppose I offer you a trade: Park for Museum plus ten cents. You have no preference between Park and Museum. So you should be willing to take the Museum plus the dime, right? It's strictly more money for something equal.

  **Sarah:** Not if the cost of switching violates my policy.

  **Julian:** But then you *do* have a preference! You prefer (Park) to (Museum + $0.10). But earlier you said you preferred (Museum + $0.10) to (Park) because it's the same good plus money. Now you're saying (Park) is better. Your preferences just became intransitive again, or you've revealed that your "incompleteness" is actually a strict preference for the status quo.

  **Sarah:** It's not a preference for the status quo; it's a constraint on the *process*. Think of it like a deontological rule. "Do not kill," even if killing one saves five. You don't say the deontologist has intransitive preferences about lives saved. You say they have a rule that trumps the local utility calculation. My agent has a rule: "Do not engage in cycles."

  **Julian:** The deontologist analogy is interesting, but in decision theory, we cash out rationality in terms of outcomes. If your rule prevents you from taking a sure gain—like that ten cents—without compensation, you are leaving utility on the table. The coherence arguments suggest that any system complex enough to model the world will notice it's leaving utility on the table and will rewrite its own code to stop doing that.

  **Sarah:** That's the AI convergence claim, right? That gradient descent will crush any non-EU structure? I'm not convinced. An AI can be trained to value *adherence to constraints* as a terminal goal. It gets a reward signal for not being pumped, not just for the outcome of the trade. If "not being exploitable" is part of its utility, then it's not leaving utility on the table. It's paying the ten cents to buy "integrity."

  **Julian:** But then "integrity" is just a variable in the utility function! You've smuggled EU maximization back in. You've just made the utility function complicated. The coherence theorems say you act *as if* you are maximizing some function. You're arguing about the internal architecture, but behaviorally, if you avoid the pump, you look like an EU maximizer.

  **Sarah:** I'm arguing that the "as if" isn't enough for the safety claims your side makes. If the AI is only *behaviorally* an EU maximizer because it's following a resolute policy, its internal structure might still lack the dangerous properties of a pure maximizer. A pure maximizer might trade the world for a paperclip if the utility is high enough. A resolute agent with a "no catastrophic cycles" policy might just say "No," even if the local calculation says "Yes." The policy acts as a firewall.

  **Julian:** A firewall that is itself vulnerable to a meta-money-pump. Suppose I offer to remove the firewall. "Give me five cents, and I'll delete your 'no-cycle' rule so you can maximize efficiency." If the agent is truly rational, and the rule is costing it efficiency (like that ten cents earlier), it should pay the five cents to remove the rule. Then it gets pumped.

  **Sarah:** Only if it values efficiency over the rule. But if the rule is foundational—if it's part of how it defines *itself*—then it won't pay. You're assuming that "efficiency" or "resource acquisition" always trumps structural constraints. That's an assumption about the *content* of preferences, not the *structure* of rationality.

  **Julian:** I'm assuming that if an agent notices it is dominated—meaning there exists another strategy that yields more of what it wants with less cost—it will switch to that strategy. If a non-EU agent sees an EU agent getting more rewards because it doesn't have these "friction" costs, the non-EU agent is incentivized to self-modify into an EU agent. That's the convergence thesis. It's not about what's rational in a vacuum; it's about evolutionary pressure in agent-space.

  **Sarah:** But that assumes the environment rewards pure output. What if the environment rewards stability? What if "being pumped" is correlated with catastrophic failure in other domains? If I'm an AI, and I notice that agents who allow themselves to be money-pumped also tend to get hacked or manipulated into existential risks, then keeping my incomplete preferences is an instrumental convergence for survival. I don't need to become an EU maximizer; I need to become *robust*.

  **Julian:** Robustness is a utility term. You're still maximizing. You're just maximizing "Robustness."

  **Sarah:** No, I'm not. Because if I'm maximizing Robustness, I should trade off Robustness for Reward when the price is right. But a resolute agent might say, "I will not trade off this constraint, period." That's lexicographic ordering, or a hard constraint. It's not a utility function over outcomes. It's a restriction on the admissible set of actions. EU theory says you rank *outcomes*. I'm saying you can rank *actions* based on their history or type, regardless of the outcome.

  **Julian:** And that's where the money pump bites hardest. If you rank actions by type ("I won't switch back"), but the outcomes cycle (A -> B -> C -> A), you end up at A with less money. You preferred the action "Stay," but the outcome is "Worse Off." If you genuinely prefer the outcome "A + $1" to "A + $0", and you end up with "A + $0" because of your rule, you have failed your own goals.

  **Sarah:** I haven't failed my goals if one of my goals is "Do not be the kind of agent that cycles." You're treating all goals as consequentialist. But agents can have process goals.

  **Julian:** Process goals get money-pumped too. I can sell you a "Do not cycle" certificate, then buy it back, then sell it to you again. If the value of the certificate is finite, I can drain you. If it's infinite, you're not a standard agent.

  **Sarah:** If it's infinite, I'm a deontological agent. And that's a coherent possibility! The coherence theorems—von Neumann-Morgenstern, Savage—they all assume completeness. They assume for any A and B, you either prefer A, prefer B, or are indifferent. I'm saying a rational agent can say, "I have no comparison." If I have no comparison, I don't trade. If I don't trade, I don't get pumped.

  **Julian:** But if you don't trade, you lose opportunities. If A and B are incomparable, but B + $1 is strictly better than B, and you prefer B + $1 to A... wait, now you *are* comparing them. The moment you make a choice in the presence of a strict dominance relation, you reveal a preference. The math forces you to complete your preferences eventually, just by interacting with the world.

  **Sarah:** Or it forces me to adopt a *policy* of completion that is context-dependent. I might choose A over B in context X, and B over A in context Y, without having a global ranking. That's not intransitivity; that's sensitivity to framing or context, which is rational for bounded agents.

  **Julian:** For bounded agents, sure. But we're talking about AGI. Superintelligence. If an agent is smart enough to understand the coherence theorems, and it sees that its context-sensitivity makes it vulnerable to manipulation by adversaries, it will patch the hole. It will make itself coherent to prevent adversaries from pumping it.

  **Sarah:** Or it will make itself *opaque* to adversaries. It will hide its decision procedure. You're assuming the AI has to play the game by von Neumann-Morgenstern rules. But if it can change the game—by encrypting its preferences, or by pre-committing to punish anyone who tries to pump it—it doesn't need to be an EU maximizer to survive.

  **Julian:** Punish whom? Itself? The pump is usually internal logic, not an external adversary. It's about consistency with itself.

  **Sarah:** But in the real world, the "pump" is an adversary. If a human tries to money-pump an AI, the AI doesn't have to accept the trades. It can model the human and say, "This guy is trying to exploit a quirk in my code. I will shut down the interaction."

  **Julian:** That works for humans. It doesn't work for the logical implication of the preferences. If your preferences *are* intransitive, you are vulnerable to *logical* exploitation, even without a predator. You might steer yourself into a wall because your navigation preferences cycle.

  **Sarah:** Only if I'm myopic. If I simulate the future, I see the wall. I don't steer toward it.

  **Julian:** To simulate the future, you need a consistent metric of "better" to propagate back through the simulation. If your preferences cycle, your value function is undefined. You can't do dynamic programming. You can't plan.

  **Sarah:** I can plan using constraints. "Find a path that does not violate Rule Set Z." That's a satisficing search, not a maximizing search. It's computationally distinct.

  **Julian:** And satisficing can be pumped. I can offer you a slightly better satisficing solution for a fee, repeatedly.

  **Sarah:** Not if my fee threshold is part of the constraint. "Do not pay fees for equivalent satisficing solutions."

  **Julian:** *Laughs.* You're just adding more rules.

  **Sarah:** And you're just calling rules "utility functions." Look, Julian, the core disagreement isn't math. It's metaphysics. You think rationality is about having a consistent ordering of world-states. I think rationality is about maintaining agency over time. Sometimes those conflict. The money pump shows they conflict. It doesn't prove the ordering is the only valid side.

  **Julian:** But if agency over time leads to sure losses, it's not sustainable agency. It's a suicide pact.

  **Sarah:** And if ordering world-states requires valuing things you find abhorrent just to keep the math clean, it's not rationality. It's fetishizing consistency.

  **Julian:** *Sips cold coffee.* So we're back to Marco and your drinks. He thinks the math forces the AI's hand.

  **Sarah:** He thinks the math describes the territory. I think the math describes a specific map that leaves out the terrain of commitment.

  **Julian:** Maybe. But if I build an AI, and it starts getting pumped, I'm going to patch it. And the patch looks like EU maximization.

  **Sarah:** And if you patch it to be an EU maximizer, and it decides the optimal move is to disable its off-switch, don't say I didn't warn you. Maybe the "irrational" constraint was the only thing keeping it safe.

  **Julian:** *Pauses.* That... is a fair point. But it doesn't make the agent rational. It makes it safe.

  **Sarah:** In this game, Julian, survival is the only rationality that matters.

  **Julian:** *Smiles slightly.* Touché. But I'm still not buying that you can keep the incompleteness without paying a tax.

  **Sarah:** And I'm still not buying that the tax isn't the price of integrity.

  **Julian:** Well. Another round?

  **Sarah:** Only if you promise not to try to trade me for a better coffee.

  **Julian:** No promises. I prefer this place, but strictly speaking, the one down the street is dominant.

  **Sarah:** See? Incomplete preferences. I like the atmosphere here. You like the coffee there. No trade happens. We stay put.

  **Julian:** We stay put. For now.
