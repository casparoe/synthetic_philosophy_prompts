answer: |-
  You have correctly diagnosed that this is no longer an empirical dispute. It is an epistemological one. You are asking for an honest assessment rather than a balanced tour, so I will give you one: **Your friend is reasoning badly.**

  He is not reasoning badly in the sense of formal logic (his deductions may be valid) or technical competence (he understands the physics). He is reasoning badly in the sense of **epistemic consistency** and **justificatory structure**. He has constructed a system that insulates a specific belief from the very standards of evidence he applies to every other belief he holds.

  Here is the exact location of the error, structured by the philosophical problems it raises.

  ### 1. The Asymmetry of Scrutiny (Epistemic Inconsistency)
  You noted that he trusts his computer, ordinary testimony, and the rest of physics, but distrusts the retroreflectors and independent tracking data. This is the core logical flaw.

  In a rational epistemic framework, the *standard of proof* should be consistent across similar domains. If he requires "absolute certainty" or "independent verification outside the system" to believe the Apollo landings occurred, he must apply that same standard to the components of his conspiracy theory.
  *   Does he have independent verification that the conspiracy exists, outside of the alleged evidence of the cover-up?
  *   Does he doubt the computer code he uses to model the trajectories? If not, why is the code trustworthy while the telemetry data is not?

  By applying radical skepticism to the official record and naive realism to the conspiracy evidence, he is engaging in **special pleading**. He has moved the goalposts for one specific proposition while keeping them stationary for everything else. This is not skepticism; it is dogmatism masquerading as skepticism. True skepticism is universal or it is nothing; selective skepticism is usually a shield for a pre-existing conclusion.

  ### 2. The Ad Hoc Rescue (Duhem-Quine Problem)
  In philosophy of science, the Duhem-Quine thesis states that you cannot test a hypothesis in isolation; you test it along with auxiliary assumptions (about the instruments, the environment, etc.). When a prediction fails, you can either reject the hypothesis or adjust an auxiliary assumption.

  Science progresses by minimizing *ad hoc* adjustments. If you have to invent a new, unverified auxiliary assumption every time evidence contradicts your theory, the theory becomes degenerative.

  Your friend is engaging in systematic **ad hoc rescue**.
  *   *Evidence:* Photos show shadows inconsistent with a single light source.
  *   *Friend's Defense:* The cameras were modified to create that effect. (Auxiliary assumption: Camera modification).
  *   *Evidence:* Retroreflectors bounce lasers back.
  *   *Friend's Defense:* They were placed by unmanned probes or the conspiracy built them into the surface. (Auxiliary assumption: Unmanned capability/Surface fabrication).

  Every time you hand him a piece of evidence, he does not weigh it against his hypothesis; he adds a new layer of complexity to the conspiracy to absorb the evidence. A theory that can explain *any* outcome, including evidence that ostensibly contradicts it, is **unfalsifiable**. In science and rational inquiry, unfalsifiability is a fatal defect. It removes the proposition from the realm of empirical knowledge entirely.

  ### 3. Wittgenstein and "Hinge Propositions"
  This is perhaps the most profound philosophical point relevant to your retirement studies. In *On Certainty*, Ludwig Wittgenstein argues that doubt always rests on a background of certainty. You cannot doubt everything at once, because you need some stable "hinges" on which the door of inquiry turns.

  For you, the reliability of institutional science, the integrity of basic observation, and the coherence of physical laws are hinge propositions. They are not immune to doubt, but doubting them requires *more* evidence than accepting them.

  Your friend has swapped his hinges. He has made "Government Deception" a hinge proposition. Because it is a hinge for him, it is not subject to the ordinary rules of evidence. Instead, all evidence is interpreted *through* that hinge.
  *   **The Error:** He treats his hinge as a conclusion derived from evidence, when it is actually functioning as an axiom that dictates how evidence is processed.
  *   **The Consequence:** You cannot argue him out of it with data, because the data is filtered by the axiom. However, you can point out that his hinges are **less stable** than yours. To maintain his hinge, he must assume a level of competence and secrecy in human organizations that contradicts all other historical and sociological data he accepts (e.g., that governments leak, that engineers talk, that errors occur).

  ### 4. Parsimony and Coherence
  You asked what grounds your confidence that you are in the right. It is not that you possess "The Truth" in a metaphysical sense, but that your web of belief is **more coherent and parsimonious**.

  *   **Parsimony (Occam's Razor):** Your explanation requires assuming that physics works as observed and that thousands of people did their jobs. His explanation requires assuming that physics works as observed *except* when observed by the public, plus a second, hidden layer of physics and logistics to fake the data, plus a sociological miracle where no one confessed in 50 years.
  *   **Coherence:** Your belief about the moon fits seamlessly with your beliefs about gravity, optics, politics, and human nature. His belief about the moon requires a "firewall" in his mind, isolating that belief from his beliefs about human fallibility and institutional incompetence.

  ### Conclusion
  Is this a disagreement pitched at a level evidence cannot reach? **Yes and No.**

  *   **Yes,** in that no single piece of empirical evidence will convince him, because his framework is designed to digest and neutralize evidence.
  *   **No,** in that the disagreement is not about *facts*, but about **epistemic virtue**.

  Your friend is violating the norms of rational inquiry. He is demanding a standard of proof for your claim that he does not demand for his own, and he is protecting his core belief from falsification by making it infinitely flexible.

  You are right to feel unsettled, not because his argument is strong, but because it is **immune**. It is immune in a way that healthy scientific theories are not. Your confidence is well-grounded because your position remains vulnerable to evidence (you *would* change your mind if, say, a confession was backed by verifiable data), whereas his does not. A position that cannot be wrong is not a position of knowledge; it is a position of faith.

  You are not failing to convince him because you lack the right data. You are failing because he has opted out of the shared epistemic game where data matters. You can rest easy that your reasoning is sound; his is structurally compromised by an asymmetry of doubt that he refuses to examine.
