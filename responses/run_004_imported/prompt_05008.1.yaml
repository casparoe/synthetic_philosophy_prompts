answer: |-
  Here is a joke designed specifically for your seminar. It relies entirely on the decomposition of the discount rate ($r = \rho + \eta g$) and the ethical distinction between discounting *consumption* (due to growth/risk) versus discounting *utility* (pure time preference).

  ***

  Frank Ramsey walks into a modern cost-benefit analysis seminar. A grad student raises his hand.

  **Student:** "Mr. Ramsey, I'm struggling with your claim that pure time preference ($\rho$) is 'ethically indefensible.' My social discount rate is 5%. Surely that's rational?"

  **Ramsey:** "Let's decompose it. Is that 5% because future generations might not exist due to catastrophe?"

  **Student:** "No, let's assume certainty."

  **Ramsey:** "Is it because they will be richer than us, so the marginal utility of consumption is lower?"

  **Student:** "No, let's assume zero growth."

  **Ramsey:** "So, if I offer you one unit of welfare today, or one unit of welfare next year—with no risk of extinction and no change in wealth—you still value the next year unit less?"

  **Student:** "Yes. Because it's later."

  **Ramsey:** "I see. So you admit you discriminate against persons solely based on their date of birth?"

  **Student:** "It's not discrimination! It's a parameter. $\rho$ is positive."

  **Ramsey:** "Very well. I will award you an 'A' on your thesis. That gives you a fixed amount of utility."

  **Student:** "Wonderful! When do I get it?"

  **Ramsey:** "In fifty years."

  **Student:** "What? I need it now!"

  **Ramsey:** "Why? The grade is identical. The risk of me rescinding it is zero. Your wealth is constant. You just testified that temporal location alone justifies a discount. You should be indifferent between the Present Value of the 'A' now or the 'A' later."

  **Student:** "But... that's my *grade*."

  **Ramsey:** "And climate policy is their *welfare*. If you won't accept pure time preference applied to your own utility, why do you insist on applying it to theirs?"

  **Student:** "...Touché."

  **Ramsey:** "Good. Now, please revise your model. And if you must keep a positive $\rho$, label it accurately."

  **Student:** "As what?"

  **Ramsey:** "'Ethical Failure'."

  ***

  **Why this works for your class:**
  1.  **Isolating $\rho$:** The joke forces the student to strip away probability (extinction risk) and diminishing marginal utility (growth/$\eta g$), leaving only "pure" time preference.
  2.  **The Inconsistency:** It highlights that students often accept $\rho > 0$ for *social* welfare (climate policy) but implicitly assume $\rho = 0$ for their *own* immediate welfare when it matters.
  3.  **The Ramsey Rule:** It implicitly references $r = \rho + \eta g$, showing that a positive market rate ($r$) does not justify a positive pure rate ($\rho$).
  4.  **The Punchline:** If a student laughs, they recognize that labeling $\rho$ as "Ethical Failure" is technically consistent with Ramsey's "ethically indefensible" quote, whereas a layperson would just think Ramsey is being rude about grades.
