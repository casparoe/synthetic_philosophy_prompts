prompt: |-
  I'm a PhD student in economics currently serving as a teaching assistant for our department's intermediate game theory course, and a question from section has left me wanting a sharper handle on something I thought I understood well. We had been covering iterated elimination of strictly dominated strategies, restricting attention throughout to domination by other pure strategies, when a student asked why our textbook's definition also allows a strategy to be eliminated whenever it is strictly dominated by some mixed strategy, even if no single pure strategy dominates it outright. I can reproduce the standard algebraic point -- that a mixture of two strategies can average their payoffs across the opponent's choices in a way that beats a third strategy everywhere, even though neither pure strategy in the mixture beats it everywhere on its own -- but I don't yet have an intuitive story I'd be happy giving an undergraduate instead of just re-deriving the relevant inequality.

  I'd like your help with two connected issues. First, could you offer a genuinely intuitive, rather than merely algebraic, explanation of why permitting mixed strategies as "dominators" can strictly enlarge the set of strategies one is entitled to eliminate, relative to allowing only pure-strategy domination? Second, this bears on a further subtlety I recall from my own coursework but can no longer reconstruct cleanly: iterated elimination of strictly dominated strategies is famously order-independent, in the sense that the reduced game you end up with does not depend on the order in which dominated strategies are removed, yet this order-independence result breaks down once the elimination criterion is weakened to weak dominance. I'd appreciate an explanation of what feature of strict dominance is actually doing the work in guaranteeing order-independence, together with an intuitive explanation -- rather than just a counterexample -- of why weak dominance loses that guarantee, and why this is generally treated as a genuine conceptual liability of iterated weak dominance as a solution concept rather than a minor technical curiosity.
