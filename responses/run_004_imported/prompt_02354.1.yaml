answer: |-
  This is an excellent pair of questions. As a PhD student, you know the formal proofs cold, but translating them into intuition for undergraduates is a distinct pedagogical skill. The algebra is often a crutch that obscures the economic logic.

  Here is a breakdown of how to handle both issues intuitively, structured so you can adapt the language for your section.

  ---

  ### Part 1: Why Mixed Strategies Can Dominate When Pure Strategies Cannot

  The algebraic fact is that the convex hull of a set of points (payoffs from pure strategies) can contain points that strictly exceed another point (payoffs from the dominated strategy), even if no single vertex of the hull does.

  **The Intuitive Story: The "Portfolio" Analogy**

  When explaining this to undergraduates, move away from "randomization" as the primary intuition. Instead, frame it as **risk diversification against the opponent's uncertainty.**

  1.  **The Setup:** Ask students to view the opponent's possible strategies not as moves to be countered, but as **states of the world**.
      *   Strategy $L$ is "State 1 happens."
      *   Strategy $R$ is "State 2 happens."
  2.  **The Asset View:** Your pure strategies are assets with different payoff structures across these states.
      *   Strategy $A$ pays high in State 1, low in State 2.
      *   Strategy $B$ pays low in State 1, high in State 2.
      *   Strategy $C$ pays medium in State 1, medium in State 2.
  3.  **The Problem:** Neither $A$ nor $B$ dominates $C$ on its own. $A$ loses to $C$ in State 2; $B$ loses to $C$ in State 1. If you are forced to pick a single pure asset, $C$ looks like a safe "compromise" choice.
  4.  **The Solution:** If you are allowed to hold a **portfolio** (a mixed strategy) of $A$ and $B$, you can smooth out the volatility. A 50-50 mix of $A$ and $B$ yields a "medium-high" payoff in *both* states.
  5.  **The Conclusion:** This portfolio strictly beats the "medium" payoff of $C$ in *every* state.
  6.  **The Rationality Link:** Why does this justify eliminating $C$? It's not because you *must* randomize. It's because if a portfolio of $A$ and $B$ guarantees a higher payoff than $C$ regardless of what the opponent does, then $C$ is **never a best response to any belief**.
      *   If I think you will play $L$, I prefer the mix (or $A$).
      *   If I think you will play $R$, I prefer the mix (or $B$).
      *   If I am unsure, I prefer the mix.
      *   Therefore, playing $C$ is simply irrational. It is a "bad deal" compared to the available menu of options (including combinations of options).

  **Scriptable Takeaway for Students:**
  > "Think of your strategies as investment assets and the opponent's moves as market conditions. Just because no single stock beats a bond in every market condition, a diversified portfolio of stocks might. If a portfolio beats the bond everywhere, the bond is a bad investment, regardless of whether you actually diversify or just pick the best stock in the portfolio."

  ---

  ### Part 2: Order Independence (Strict vs. Weak)

  This is a deeper conceptual issue. The standard explanation is often just a counterexample matrix. You need the *mechanism* of the failure.

  #### 1. Why Strict Dominance is Order-Independent
  **The "Margin of Safety" Intuition.**

  Strict dominance implies a strict inequality: $u(s^*, s_{-i}) > u(s_{dom}, s_{-i})$. There is a "gap" or a margin of safety.

  *   **Robustness:** Because the inequality is strict, it holds even if the opponent assigns a tiny probability to strategies that we might later eliminate.
  *   **The Logic:** If strategy $X$ is strictly dominated by $Y$, $X$ is never a best response to *any* belief over the opponent's strategies. When we eliminate a dominated strategy for the opponent, we are removing a strategy that was never a best response for them.
  *   **Crucial Point:** Removing a strategy that was never a best response does not change the best-response status of the remaining strategies. If $Y$ was better than $X$ when the opponent could play *everything*, $Y$ is definitely still better than $X$ when the opponent is restricted to a subset of *everything*. The removal of "bad" opponent strategies only makes the dominant strategy look *better* (or at least no worse) relative to the dominated one. The strict inequality is preserved.

  #### 2. Why Weak Dominance is Order-Dependent
  **The "Fragile Tie" Intuition.**

  Weak dominance allows for equality: $u(s^*, s_{-i}) \ge u(s_{dom}, s_{-i})$, with strict inequality for at least one $s_{-i}$.

  *   **Fragility:** The dominance relationship often hinges on specific "tie" cases. Strategy $A$ weakly dominates $B$ because $A$ is better against $L$ and *equal* against $R$.
  *   **The Mechanism of Failure:**
      *   **Path 1:** If we eliminate $B$ first, we proceed based on the fact that $A$ is "at least as good."
      *   **Path 2:** If we eliminate $R$ first (perhaps because $R$ was weakly dominated for the opponent), the column where $A$ and $B$ tied disappears. Now, against the remaining strategies, $A$ might strictly dominate $B$, or they might be equivalent, or $B$ might even dominate $A$.
      *   **The Kicker:** More commonly, $A$ dominates $B$ only because of the payoff against $R$. If $R$ is eliminated *first*, $A$ may no longer dominate $B$ at all. Thus, $B$ survives in Path 2 but is eliminated in Path 1.
  *   **Intuition:** Weak dominance relies on the opponent playing certain strategies with **zero probability**. But whether a strategy is eliminated (and thus played with zero probability) depends on the order of reasoning. It creates a circular dependency: "I won't play $R$ because it's dominated, which allows me to eliminate $B$, which makes $R$ look better..."

  #### 3. Why This is a Conceptual Liability (Not Just Technical)

  You asked why this is treated as a genuine liability. It undermines the epistemic foundation of the solution concept.

  1.  **Common Knowledge of Rationality (CKR):** Solution concepts like IESDS are meant to represent the outcome of rational agents reasoning about each other's rationality. If the outcome depends on the *order* in which agents process the information, then CKR does not pin down a unique prediction. Two equally rational agents, reasoning in different sequences, would arrive at different "rational" outcomes.
  2.  **Sensitivity to Zero-Probability Events:** Weak dominance treats a payoff difference of 0.0001 and 0 identically. In Strict Dominance, a small "tremble" (a mistake by the opponent) doesn't change the ranking. In Weak Dominance, if the opponent makes a tiny mistake and plays the strategy that was supposed to be eliminated with probability $\epsilon > 0$, the dominance relationship can flip entirely.
      *   *Intuition:* Strict dominance is robust to "trembling hand" perfection. Weak dominance is not. A solution concept that collapses if players make tiny errors is not a robust prediction of behavior.
  3.  **The "Threat" Problem:** In sequential games (backward induction), IEWDS can eliminate strategies based on non-credible threats that vanish if the order changes. It allows players to reason: "I will eliminate your strategy because you wouldn't play it, but you wouldn't play it only because I eliminated your other strategy." This circularity makes the prediction unstable.

  **Scriptable Takeaway for Students:**
  > "Strict dominance is like a heavy stone; it stays put regardless of what else you remove from the pile. Weak dominance is like a house of cards held together by ties. If you remove the card that creates the tie first, the whole structure changes. Because rational players shouldn't reach different conclusions just because they thought about the problem in a different order, we view order-dependence as a sign that the solution concept isn't capturing a robust logical truth."

  ### Summary for your Section
  *   **Mixed Domination:** It's about **portfolios**. If a mix beats a pure strategy everywhere, that pure strategy is never a best response to any belief. It's a "bad deal" compared to the menu of available options.
  *   **Order Independence:** Strict dominance has a **margin of safety**; removing bad options doesn't change the ranking of good ones. Weak dominance relies on **ties**; removing the option that creates the tie changes the ranking. This makes weak dominance **fragile** to mistakes and reasoning order, undermining its claim to represent "rational" behavior.
