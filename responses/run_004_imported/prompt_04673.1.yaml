      *   *The 1/2 Definition:* He defines $P(p) = 1/2$ if the agent is indifferent between:
          1.  $\alpha$ if $p$, $\beta$ if $\neg p$
          2.  $\alpha$ if $\neg p$, $\beta$ if $p$
      *   *Why Neutral?* If $p$ is *not* ethically neutral, the agent might prefer (1) over (2) simply because they prefer the state of affairs where $p$ is true (and they get $\alpha$) vs $p$ is false (and they get $\alpha$). Even if they believe $p$ is 50/50, the *value* of the truth of $p$ skews the preference.
