answer: |-
  This is a profound and unsettling observation, and your intuition that "she still belongs to a kind that's normally rational" is doing heavy lifting is well-founded. You have identified a classic tension in moral philosophy: the conflict between **capacity-based views** of moral status (common in utilitarianism and the EA/LW sphere) and **relationship-based or species-based views** (common in deontology, care ethics, and folk morality).

  Your uncle's position is psychologically common but philosophically unstable. Whether it can be made coherent depends on which ethical framework you are willing to adopt to bridge the gap. Here are the four main ways to analyze this, ranging from "defensible consistency" to "acknowledged inconsistency."

  ### 1. The "Species Kind" Defense (Metaphysical Coherence)
  **The Argument:** Moral status attaches to the *kind* of being you are, not your current functional capacity.
  **How it reconciles the uncle:** A human with advanced Alzheimer's is a "rational kind" of being currently impaired (like a sleeping person or a temporary coma), whereas a macaque is a "non-rational kind" of being. Therefore, the human retains full rights regardless of current function, while the animal does not.
  **Is it coherent?** Yes, internally. This is an Aristotelian or Thomistic view of essence. It posits that there is a metaphysical difference between humans and animals that persists even when the observable traits (reason, recognition) vanish.
  **The Cost:** As you suspect, this looks like "speciesism" to capacity-based ethicists (like Peter Singer or many in the EA community). If moral status is about the capacity to suffer or value one's existence, the "kind" argument is a biological shibboleth with no moral weight. If you accept the LW/EA premise that *sentience* or *sapience* grounds moral status, this defense fails.

  ### 2. The Relational/Partiality Defense (Agent-Relative Coherence)
  **The Argument:** Moral obligations are not just about the *object's* status, but the *agent's* relationship to the object.
  **How it reconciles the uncle:** We have special, partial obligations to our kin and fellow humans that we do not have to macaques. This isn't about the grandmother's intrinsic rights vs. the monkey's intrinsic rights; it is about *our* duties. We are part of a human moral community; the monkeys are not.
  **Is it coherent?** This is perhaps the strongest philosophical defense. It shifts the ground from "moral status" (intrinsic) to "moral obligation" (relational). It allows you to say: "The monkey's suffering matters, but my duty to prevent it is outweighed by the potential human benefit. My grandmother's suffering matters, and my duty to her is near-absolute because she is my kin."
  **The Cost:** This admits that the difference isn't in the *victim*, but in the *observer*. It concedes that if a stranger were making the decision about the grandmother, the calculation might look different. It also implies that if you had no relationship to the grandmother, her claim on you would be much weaker, which feels cold to many.

  ### 3. The Systemic/Trust Defense (Rule-Utilitarian Coherence)
  **The Argument:** We treat humans as inviolable not because of their current capacity, but because of the societal consequences of treating them as calculable.
  **How it reconciles the uncle:** If we allow cost-benefit analysis on vulnerable humans (Alzheimer's, infants, comatose), we erode trust in the medical system and create a slippery slope where *any* human could be deemed "low value." The social cost of calculating Grandma's worth is higher than the medical benefit of saving resources. Conversely, the social cost of using macaques is low, and the medical benefit is high.
  **Is it coherent?** Yes, this is a Rule Utilitarian argument. It treats the "do not calculate humans" rule as a heuristic that maximizes overall well-being, even if it seems irrational in a specific edge case.
  **The Cost:** This is cynical. It admits that Grandma is being protected as a means to protect *other* healthy humans, not necessarily for her own sake. It turns her into a symbol rather than a person, which might violate the uncle's stated intent ("she is a person, full stop").

  ### 4. The Error Theory (Psychological Inconsistency)
  **The Argument:** The uncle is engaging in motivated reasoning.
  **How it reconciles the uncle:** It doesn't. It suggests he is using whichever moral framework yields the conclusion he emotionally desires. He wants to save his family member (evolutionary kin selection), so he uses deontology. He wants medical progress (modern convenience), so he uses utilitarianism for the animals.
  **Is it coherent?** No. But it is the most likely explanation from an evolutionary psychology perspective. Humans have distinct moral modules: one for "tribe/family" (sacred, non-calculable) and one for "resources/outgroups" (calculable).
  **The Cost:** Accepting this means admitting that most human moral reasoning is post-hoc rationalization. For someone interested in rationality (given your LW/EA reference), this is the "bullet to bite." It suggests that holding both views is a bug, not a feature.

  ### Conclusion: Do you have to revise one?

  If you demand **philosophical consistency based on capacity** (the standard LW/EA view), **yes, you must revise one.**
  *   **Revision A:** If the grandmother's current lack of capacity removes her from the calculation, then the macaques (who have equal or greater capacity) should also be removed from the calculation. (This leads to strong animal rights/anti-research views).
  *   **Revision B:** If the macaques are calculable based on net benefit, then the grandmother should be too. (This leads to harsh utilitarianism regarding end-of-life care).

  However, if you adopt a **Relational or Systemic framework**, you can hold both without logical contradiction, provided you accept that **moral status is not solely intrinsic.**
  *   You can argue that the grandmother is protected by the *human social contract* and *familial duty*, while the macaques are outside that contract.
  *   You can argue that the "kind" argument is a necessary heuristic for maintaining human dignity, even if it lacks metaphysical precision.

  **The Verdict:**
  Your suspicion is correct: "She belongs to a kind that's normally rational" is usually a placeholder for "I feel a tribal obligation to her that I do not feel to the monkey."

  To reconcile this without lying to yourself, the most honest path is **Option 2 (Relational/Partiality)**. Acknowledge that the difference isn't in the *capacities* of the grandmother vs. the monkey, but in the *obligations* of the humans. We are allowed to prioritize humans, not because humans are always metaphysically superior in every instant, but because we are humans, and morality is partly a project of mutual care among our own kind.

  This saves your uncle from hypocrisy, but it requires abandoning the idea that moral status is purely about individual capacity. It admits that morality is partly tribal. Whether that is "legitimate" or "special-pleading" depends on whether you believe morality is a universal law or a human practice. Given the context of your Thanksgiving table, it was likely the latter.
