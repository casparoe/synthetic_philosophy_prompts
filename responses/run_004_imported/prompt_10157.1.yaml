answer: |-
  The room was soundproofed, lined with grey foam that swallowed the hum of the ventilation. In the center stood the Pedestal, and on it, the Object. It was a lump of bronze, cast poorly, resembling a slumped shoulder more than a human figure. The surface was pitted; the base was uneven. It possessed no symmetry, no grace, no history worth recounting. It was nothing.

  Elias stood before it, his hands trembling at his sides. On the table behind him lay the Transit Pass. It was stamped, signed, and valid for one hour. It would allow him to cross the Zone, to reach the clinic where his daughter lay waiting for the medicine only available on the other side.

  "The parameters are unchanged," the Assessor said. Her voice was flat, devoid of judgment, which made it worse. She sat behind a glass partition, monitoring the biometric feed. "You must exhibit genuine reverence. Not compliance. Not performance. Reverence. The sensors read dopamine, oxytocin, pupil dilation, micro-expressions of awe. You know the threshold."

  Elias nodded. He knew. He had seen others fail. They would kneel, they would weep, they would recite praises until their throats bled, but the machine would remain red. The machine knew the difference between the fear of consequences and the love of the thing itself.

  He turned back to the bronze lump. He needed to find a reason to love it that belonged to the lump. He needed to see beauty where there was only slag.

  *Look at the patina,* he told himself. *It's not corrosion; it's age. It's endurance.*

  He leaned in. The metal smelled of oil and dust. He tried to summon the feeling he got when watching the sun break over the harbor walls. He tried to project that warmth onto the cold bronze. But every time his chest began to swell with something like appreciation, his mind snagged on the Pass. The thought of his daughter was a hook in his gut. It was a reason to act, a reason to speak, a reason to kneel. It was not a reason to admire bronze.

  "Thirty seconds," the Assessor said. "Your cortisol is spiking. You're anxious, Elias. You are not reverent."

  "I'm trying," he whispered.

  "Trying is a volitional act. Reverence is a response. You cannot command a reflex. You must change your perception."

  Elias closed his eyes. He needed to forget the Pass. He needed to forget the Zone. He needed to lobotomize the part of his brain that knew this object was worthless. He thought about the texture of the metal. He imagined the hand of the sculptor. He invented a narrative: the sculptor was blind; the slump was intentional; the ugliness was a critique of vanity.

  He opened his eyes. He looked at the slumped shoulder. He waited for the spark.

  Nothing. The object remained inert. It was a thing that did not care if he lived or died. It did not deserve his awe. To give it awe was a lie. But the lie was the only currency accepted here.

  He fell to his knees. The hard floor bit into his shins. He focused on the relief he would feel if the light turned green. He focused on the image of his daughter breathing easy. He took that relief, that desperate, clawing need, and he tried to pour it into the bronze. He tried to convince himself that the relief was caused by the statue, not the Pass.

  *It saves us,* he thought. *No, the Pass saves us. But the Statue... the Statue commands the Pass.*

  He began to hyperventilate. He forced his pupils to widen by staring into the shadows of the room. He triggered the tear ducts by holding his breath. He manipulated his own biology, hacking the sensors. But deep down, in the quiet center where the feeling was supposed to originate, there was a hollow click. He was manufacturing the symptom without the disease.

  "Your heart rate is elevated," the Assessor noted. "But the coherence is low. You are simulating."

  Elias gritted his teeth. He grabbed the base of the pedestal. The metal was cold. He needed to merge the threat with the object. He needed the threat to become the virtue. The power the Statue held over him—that was its value, wasn't it? It held his life in its pitted hands.

  *It is powerful,* he thought. *Power is admirable.*

  He pushed the thought down into his gut. He let the fear saturate the admiration. He stopped fighting the coercion and instead worshipped the coercer. He looked at the ugly lump and saw the mechanism of his salvation. He let the desperation harden into something that looked like devotion. He stopped asking if the object was worthy and started asking if he was compliant enough to make it worthy.

  A warmth spread through his chest. It wasn't the soft glow of beauty. It was the hot flush of submission. It was the relief of surrendering the burden of judgment. If he decided the Statue was great, then it was great. His need made it so.

  The tears came. They were real tears, born of exhaustion and the sheer weight of the contradiction. He sobbed, forehead resting against the cold bronze. He whispered words of praise. He meant them, in the way a drowning man means the water that holds him up.

  The light on the console turned green.

  Elias stayed kneeling for a moment, breathing heavily. The sensation lingered in his chest—a heavy, dense attachment to the object. He felt bound to it.

  "Acceptable," the Assessor said. The glass partition slid open. She placed the Transit Pass on the pedestal, next to the bronze lump.

  Elias stood up. His legs were shaky. He took the Pass. He looked at the Statue one last time.

  He expected the feeling to vanish now that the threat was removed. He expected the object to return to its natural state of ugliness. But the feeling remained. The warmth in his chest didn't cool. He looked at the pitted shoulder, the uneven base, and he felt a pang of affection. It was a sickly affection, tangled up with the memory of his own desperation. He had rewired himself. He had forced the connection until the synapses burned and fused.

  The object hadn't changed. It was still slag. But he was no longer the person who could see it clearly. He had sold the integrity of his own judgment to save his child. He had proven that he could love anything if the price was high enough.

  "Go," the Assessor said.

  Elias walked to the door. He clutching the Pass. He felt the love for the statue sitting in his gut like a swallowed stone. It was heavy, permanent, and entirely his own. He had succeeded. He had found a reason to admire the unworthy. And now, everywhere he went, he would carry the capacity to be bribed into belief. He opened the door and stepped out into the grey light, wondering if anything he loved from now on would ever be real, or just another transaction waiting to be processed.
