  **Justifications**

  *   **Move 1 (Score: 0):** Maya correctly identifies a standard consequentialist defense: that our intuitions about "too demanding" often reflect status quo bias or selfishness (a la Singer). However, she is reductive to claim it is *only* psychological discomfort. In the method of reflective equilibrium, persistent moral intuitions constitute data that a theory must explain, not merely errors to be dismissed.
  *   **Move 2 (Score: 2):** Daniel accurately locates the strongest version of the objection in Bernard Williams's "integrity" argument. This moves the debate beyond mere psychological burden to a structural critique: if an agent cannot give special weight to their own ground projects, they lack a coherent personal point of view, which undermines the very agency required to be a moral actor.
  *   **Move 3 (Score: 1):** Maya deploys Liam Murphy's "compliance condition" (*Moral Demands in Nonideal Theory*), a sophisticated and legitimate strategy. It argues that in non-ideal conditions (where others don't comply), the demandingness is an artifact of unfairness, not the theory itself. However, this is a concessive move that modifies standard act-consequentialism, warranting a moderate score.
  *   **Move 4 (Score: 2):** Daniel correctly identifies the theoretical cost of Murphy's move. Strict act-consequentialism is fact-relative (maximize given the *actual* world); capping obligations at a "fair share" based on a *hypothetical* ideal world introduces a fairness constraint external to consequentialist maximization. This accurately diagnoses that Murphy's solution saves the agent but alters the theory.

  **What Both Are Missing**

  Both students are debating **Act-Consequentialism** as a **decision procedure**, overlooking the crucial distinction between the **criterion of rightness** and the **decision procedure**.

  Many consequentialists argue that while the *truth* of morality is determined by consequences (criterion), the *method* agents should use to deliberate (procedure) should not be direct maximization. If agents adopt a decision procedure that prioritizes personal projects and relationships, they may actually produce better overall consequences than if they constantly calculated sacrifices. This distinction allows a consequentialist to accept Daniel's structural worry (agents need a personal point of view to function) without accepting Maya's dismissal (that the objection is merely psychological).

  Additionally, neither mentions **Satisficing Consequentialism** (e.g., Slote), which argues that an act is right if it produces *good enough* results, not necessarily the *best* results. This would structurally limit demandingness without needing to appeal to fairness or compliance conditions.
