answer: |-
  This is a remarkably sophisticated engagement with *On Certainty*, and your instinct to be suspicious of a reading that feels "convenient" is itself very Wittgensteinian. He was deeply wary of philosophical theories that served primarily to soothe us or dissolve problems we ought to face.

  You have grasped the core mechanism of hinge epistemology correctly: hinges are not known propositions supported by evidence; they are the scaffolding that makes evidence and doubt possible. You are also right that Wittgenstein explicitly discusses the impossibility of arguing someone out of a world-picture (the "King" example, OC §92; the missionary analogy, OC §611).

  However, your conclusion—that this renders your respective positions "equally groundless" and "incommensurable"—is likely an overextension of Wittgenstein's thought, specifically regarding the **scope** of the disagreement and the **relationship between hinges and action**.

  Here is a breakdown of where your reading might be drifting from a stricter Wittgensteinian analysis, and how that might reframe your situation with your brother.

  ### 1. Hinges are not arbitrary; they are tied to a "Form of Life"
  The most common misreading of *On Certainty* is that *any* belief can function as a hinge if you hold it tightly enough. Wittgenstein does not say this. Hinges are not chosen arbitrarily; they are inherited through training and, crucially, manifested in **action**.

  Wittgenstein writes, "I act with *complete* certainty. But this certainty is my own" (OC §174). The test of a hinge is not how fervently you believe it, but how you live. If your brother claims the earth is 6,000 years old, but he drives a car (relying on combustion physics developed over centuries), uses GPS (relying on relativity and satellite tech), or takes antibiotics (relying on evolutionary biology), his "hinge" is not actually governing his entire form of life.

  A true Wittgensteinian analysis would suggest that your brother is not operating within a coherent, alternative world-picture. He is operating within *your* shared scientific world-picture for 99% of his life, and attempting to install a localized "religious hinge" that contradicts the empirical machinery he uses daily. This isn't a case of two incommensurable frameworks (like the King who thinks the world began with him); it is a case of one person trying to play two language games at once without noticing the contradiction.

  ### 2. The Scope of the Disagreement
  You noted that you and your brother "share nearly all of their background beliefs and standards of evidence." This is the critical detail that makes the "incommensurable frameworks" reading suspect.

  Wittgenstein's examples of radical divergence (the King, the missionary) describe situations where there is no shared bedrock. But you and your brother share a language, a culture, and a massive network of shared judgments (e.g., that fire burns, that memories are generally reliable, that logic holds). When you argue about radiometric dating, you are arguing *within* a shared system of verification.

  The problem is that your brother is treating a specific empirical claim ("the earth is old") as if it were a hinge, while you treat it as a movable proposition within the system. But because he accepts the *methods* of science in other contexts, he cannot consistently claim that radiometric dating is "question-begging" without undermining the technology he uses to speak to you.

  Wittgenstein would likely say that the disagreement isn't that you have different hinges, but that he is trying to **protect** a religious hinge (e.g., "The Bible is the ultimate authority") by forcibly converting empirical propositions into grammatical rules. He is treating "The earth is 6,000 years old" as a rule of the game, when in our shared form of life, it is a move *within* the game.

  ### 3. "Equally Groundless" is a Trap
  You wrote: *"It looks to me like... [our] convictions are, on Wittgenstein's view, just two rival hinges, equally groundless."*

  This is the point where the "convenient" reading risks becoming philosophically dishonest. While Wittgenstein agrees that hinges are not "known" in the sense of being proven by evidence, he does not say they are **equal**. Hinges are judged by their coherence with the rest of the system and their utility in navigating the world.

  In *On Certainty*, Wittgenstein suggests that some systems of belief are more "rigid" or "fluid" (OC §96-99). A system that requires constant, ad-hoc adjustments to explain away fossils, light from distant stars, and geological strata is less coherent than one that accepts them. Wittgenstein is not a relativist who thinks all world-pictures are equally valid; he is a pragmatist who thinks world-pictures are validated by how well they hang together and support our actions.

  To say your positions are "equally groundless" ignores that your position coheres with the vast majority of your shared actions and judgments, whereas his requires a localized suspension of the very reasoning faculties he employs elsewhere.

  ### 4. What Wittgenstein Actually Offers You
  If the "incommensurable frameworks" exit is a misreading, what is the correct Wittgensteinian takeaway? It is not that you should stop believing there is a fact of the matter. It is that you should recognize the **category mistake** your brother is making.

  *   **For him:** The belief functions as a religious/identity hinge. It provides existential security and community belonging. When you attack the age of the earth, he hears you attacking the authority of God and his place in the community. That is why evidence doesn't register; you are attacking a hinge with empirical tools.
  *   **For you:** You are treating it as an empirical error.

  Wittgenstein would suggest that arguing empirically against a hinge is a category error. You cannot prove a hinge; you can only show that holding it makes other parts of life unintelligible.

  **The "Graceful Way Out" Revisited**
  You worried that accepting incommensurability was just a way to stop fighting. A more accurate Wittgensteinian peace treaty looks different:
  1.  **Acknowledge the limit of argument:** You cannot "prove" him wrong because he has removed the proposition from the realm of proof. He has made it a rule of his grammar.
  2.  **Don't validate the falsehood:** You do not have to accept his view as "equally groundless." You can recognize that within the shared scientific form of life you both inhabit for daily living, his claim is nonsensical.
  3.  **Shift the conversation:** Instead of trying to disprove the age of the earth, ask about the *role* the belief plays. "I see that this view is essential to your faith. I can't accept the science behind it, but I understand it matters to you."

  ### Conclusion
  You are right to be uneasy. Your reading leans heavily into a relativistic interpretation of *On Certainty* that many scholars (like Norman Malcolm or Peter Hacker) would argue Wittgenstein did not hold. He did not think that all world-pictures are immune to criticism. He thought they are immune to *foundationalist* criticism (i.e., you can't prove them from scratch), but they are vulnerable to **internal** criticism (incoherence) and **pragmatic** criticism (failure to align with action).

  Your brother's view is not a rival hinge system; it is a fracture within your shared system. You don't need to accept his framework as valid to stop the fight. You only need to accept that **evidence cannot move a hinge.** That doesn't mean the hinge is true; it means you are using the wrong tool to move it.

  The intellectually honest response isn't to say "neither of us is right." It is to say, "We are arguing on different levels. You are defending a commitment; I am citing evidence. Neither will move the other, not because truth is relative, but because we are playing different games." That allows you to step back without conceding the reality of deep time.
