prompt: |-
  So this has been bugging me for like two weeks now and I can't drop it. We got broken into last month (nothing crazy, just a laptop and some cash off the counter), and it's basically narrowed down to two people: our downstairs neighbor Dana, who's got a bit of history but has genuinely seemed to be turning things around lately, or the delivery guy who buzzed into the building that afternoon, since those two were the only ones with any access all day. At one point my roommate said "if Dana didn't take it, the delivery guy did," and yeah, fair enough, that felt pretty much unavoidable given the setup. But then a couple days later we were arguing about whether it's even fair to keep side-eyeing Dana specifically given everything she's trying to do, and my roommate said something like "doesn't matter anyway, if Dana hadn't taken it he probably would've grabbed something eventually, guys like that always do" — and that one did NOT sit right with me the same way, even though it's basically the same sentence with the verbs shifted around.

  When I told my roommate the second claim felt way less solid than the first, she said I was being a pedant about grammar tenses and that they're obviously saying the same thing. I've tried explaining to a couple of friends why my gut says these are actually different kinds of claims and not just tense variants, and I keep getting tangled up defending it, which is definately not helping my case (at one point someone brought up how this is basically the same vibe as those sports arguments like "if he hadn't missed that shot we would've won," which. yeah, exactly, same weird feeling). Is there an actual principled reason the first sentence is basically forced on me by the situation while the second one needs a whole separate argument to back it up, or are they really doing the same logical work and I'm just overthinking two sentences that happen to be phrased a bit differently? And if there is a real difference, should that change how much weight my roommate's "someone would've done it anyway" reasoning gets when we're deciding whether it's fair to keep treating Dana as the obvious suspect?
