      *   **Key System:** The proof uses Primitive Recursive Arithmetic (PRA) *plus* transfinite induction up to $\epsilon_0$.
      *   **Crucial Detail:** Transfinite induction up to $\epsilon_0$ is *not* provable in PA. PA can prove transfinite induction for any specific ordinal $\alpha < \epsilon_0$, but not for $\epsilon_0$ itself.
