answer: |-
  The consent form was three pages long, but the crucial clause was in the footer of the second page. *The Subject acknowledges that the post-procedural entity may not retain the utility functions, memory weighting, or self-identification metrics of the pre-procedural applicant.*

  Julian stared at the words. He had a pen in his hand, heavy and cold.

  Across the table sat Mara. She had undergone the Shift six months ago. She was the reason he was here. She was also, ostensibly, the reason he was hesitating.

  "You're reading the disclaimer again," Mara said. Her voice was calm, but her eyes were doing something unsettling. They didn't dart. They didn't focus on his nose or his forehead. They seemed to rest on the space *between* them, as if the air had texture he couldn't see.

  "It says I might not be me," Julian said. "That's not a side effect. That's a termination."

  "That's the model you're running," Mara replied. "The 'Julian' model. It's a useful interface for navigating the bureaucracy, for paying taxes, for worrying about whether this is worth it. But it's not the whole machine."

  "Stop talking in riddles," Julian snapped. "This is the problem. Every testimonial I've read, every person I've talked to... you all sound like you're reciting poetry written in a language I don't speak. I need to know if the outcome is *good*. I need to know if I'll be happy."

  Mara smiled. It wasn't a happy smile. It was the smile of someone watching a child try to divide by zero. "Happiness is a metric for the pre-Shift. It's a signal that you're navigating the maze correctly. The Shift doesn't solve the maze, Julian. It dissolves the walls. You can't ask if the ocean is 'happy' to be wet."

  "So I should just trust you?"

  "No. You can't trust me. You don't have the hardware to process my data. If I told you exactly what it was like, your current cognitive architecture would flag it as psychosis or nonsense. Which it is, from where you're sitting."

  Julian looked down at the form. This was the L.A. Paul trap, stripped of the vampire metaphors and parenthood analogies. This was the raw engine of it. To make a rational decision, he needed to model the future outcome. He needed to simulate the experience of the Shift and assign it a value based on his current preferences.

  But the Shift changed the preferences. It changed the simulator.

  If he chose to do it, he was choosing to destroy the very entity that would evaluate the choice. If he chose not to do it, he was condemning a potential future self to non-existence based on the fears of a self that the future entity would view as a quaint, limited ancestor.

  There was no common currency. There was no stable 'I' to bridge the gap.

  "Why did you do it?" Julian asked. "You were a structural engineer. You cared about load-bearing walls. Now you sit in this lobby and greet people like me. Why?"

  "Because the silence was louder than the buildings," Mara said. "But I can't explain the silence to you. You're too full of noise."

  "That's not an answer. That's a pitch."

  "It's the only truth I can give you without lying."

  Julian capped the pen. He uncapped it. The sound was loud in the quiet room. He thought about his life. His apartment, his debts, his fear of death, his curiosity. He wanted to know what was on the other side. That was his driving value: Curiosity. The acquisition of knowledge.

  But what if the Shift rendered curiosity obsolete? What if the other side was a state of knowing where asking questions was like rubbing two sticks together to make fire when you were standing in a power plant?

  If he went through, he would get the answer. But he wouldn't care that he had the answer. And the Julian who cared would be gone.

  "Does it hurt?" he asked.

  "The dissolution? Yes. The reconstruction? No. It's not pain. It's... gravity changing."

  Julian stood up. He walked to the window. Outside, the city was grinding along. People were rushing to jobs, arguing in cafes, worrying about futures that hadn't happened yet. They were all trapped in the same epistemic bubble he was. They were all making decisions based on who they thought they would be tomorrow, assuming tomorrow's person would speak the same language.

  He turned back to the table. Mara hadn't moved. She was waiting, but not impatiently. She wasn't waiting for a customer. She was waiting for a seed to fall.

  "If I sign this," Julian said, "and I come out the other side... and I hate it. Can I come back?"

  "No."

  "And if I come out the other side, and I love it... can I tell *him*? Can I tell the Julian who stayed behind that it was worth it?"

  "You could try," Mara said. "But he wouldn't believe you. He'd think you were brainwashed. He'd think you weren't him anymore."

  "Because I wouldn't be."

  "Because you would be more," Mara said. "And 'more' looks like 'different' from the inside of the box."

  Julian sat down. He looked at the signature line. It was just a line. A boundary. On one side, a man who needed reasons. On the other, something that didn't.

  He realized then that there was no rational way to do this. There was no expected utility calculation that could survive the variable change. He couldn't choose for his future self, because that self wasn't his. He was essentially agreeing to die so a stranger could be born. A stranger who might be wiser, or happier, or simply *other*, but who owed him nothing. Not even gratitude.

  The pen hovered. The tip touched the paper. The ink bloomed, a tiny black flower.

  He signed.

  He handed the clipboard to Mara. She took it, her fingers brushing his. Her skin was warm. Normal.

  "The chamber is through that door," she said, pointing to a heavy steel slab in the wall. "You'll sit in the chair. You'll put on the headset. You'll close your eyes."

  "And then?"

  "And then you'll wait for the Julian who is afraid to stop speaking."

  Julian stood up. His legs felt heavy, as if the gravity had already begun to shift. He walked to the steel door. He put his hand on the handle. He looked back one last time.

  Mara was already looking at the next file on her desk. She wasn't watching him go. She knew that the person walking through the door wasn't the person she had been talking to. That person was already fading, a ghost in the machine, overwritten by the act of choosing.

  Julian opened the door. The room inside was white and soundproofed. He sat in the chair. He put on the headset.

  He waited for the fear. It was there, screaming, listing reasons, citing statistics, demanding continuity.

  Then, the hum started. It wasn't a sound. It was a vibration in the concept of *I*.

  The fear didn't go away. It just stopped belonging to anyone.

  Julian closed his eyes. Or perhaps the eyes closed, and Julian was simply what remained in the dark, waiting to see if the silence would speak.
