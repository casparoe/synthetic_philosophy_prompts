      *   **Constraint 3:** No tidy ending. No clear "worth it" or "regret." The ambiguity of identity must remain.
      *   **Goal:** Dramatize the decision problem where the evaluator and the beneficiary are potentially different entities, and the outcome is unknowable.

  2.  **Brainstorming Scenarios:**
