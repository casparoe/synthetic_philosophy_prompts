          *   *Premise 1:* Individual preferences satisfy VNM axioms (rationality under uncertainty).
          *   *Premise 2:* Social preferences satisfy VNM axioms (social rationality).
          *   *Premise 3:* Pareto Principle (if everyone prefers A to B, society prefers A to B).
          *   *Premise 4:* Impartiality (often implicit or added as a symmetry condition).
          *   *Conclusion:* Social welfare function is a linear sum of individual utilities ($W = \sum a_i U_i$).
          *   *Implication:* Only outcomes matter (consequentialism). Procedures don't have intrinsic value.

      *   **Diamond's Side (The Fairness Objection):**
          *   *Reference:* Peter Diamond (1967), "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility."
          *   *Example:* One indivisible good, two people.
              *   Option A: Give to Person 1 (Utility: 1, 0).
              *   Option B: Give to Person 2 (Utility: 0, 1).
              *   Option C: Flip a coin (Expected Utility: 0.5, 0.5).
          *   *Harsanyi's View:* A and B yield total utility 1. C yields expected total utility 1. Indifferent between A, B, and C.
          *   *Diamond's View:* C is morally superior to A or B because it offers *ex-ante* equality/fair chance.
          *   *The Gap:* Harsanyi's VNM framework evaluates lotteries based on *expected utility of outcomes*. It cannot capture the intrinsic value of the *process* (the coin flip itself) unless that process is modeled as part of the outcome.

  3.  **Evaluate the "Verdict":**
      *   *Option A: Harsanyi Wins.* Argument: Diamond is conflating "procedural utility" with "outcome utility." If people *value* fairness, that should be in their $U_i$. If $U_i$ includes "I feel good about a fair coin flip," then Harsanyi captures it.
      *   *Option B: Diamond Wins.* Argument: Harsanyi's axioms (specifically the Independence Axiom) structurally exclude procedural values *by definition*. To include fairness, you have to break VNM rationality or redefine "outcomes" so broadly that the theorem becomes trivial/tautological. The theorem claims to derive utilitarianism from *thin* rationality, but it smuggles in a specific metaphysical view of value (consequentialism).
      *   *My Decision:* Diamond wins (with nuance). The theorem is mathematically valid *given its axioms*, but the axioms are not neutral requirements of "rationality." They are substantive ethical commitments. The "verdict" should be that Harsanyi doesn't prove utilitarianism is the *only* rational system; he proves utilitarianism is the only system compatible with *consequentialist* rationality. The coin flip isn't a bug; it's a feature that reveals the theorem's normative loading.

  4.  **Drafting - Section by Section:**

