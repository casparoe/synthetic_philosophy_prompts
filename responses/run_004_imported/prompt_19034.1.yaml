      *   **Introduction:** Set the scene. Harsanyi's allure (math proving morality). Introduce the Diamond objection. State the thesis clearly (Diamond exposes a normative assumption disguised as rationality).
      *   **The Harsanyi Machine:** Explain the theorem simply. VNM axioms + Pareto = Weighted Sum. Emphasize the claim: This is about *rationality*, not just ethics.
      *   **The Diamond Counter:** The 1967 paper. The coin flip example. Distinguish between *ex-post* welfare (who got the kidney) and *ex-ante* fairness (who had a chance). Show how Harsanyi collapses these.
      *   **The Utilitarian Defense (The "Broad Outcomes" Move):** How would a Harsanyi supporter respond? "Just include fairness in the utility function." If I value fairness, my $U$ goes up when a coin is flipped.
      *   **The Rebuttal (Why the Defense Fails):** This is the crux.
          1.  *Circularity:* If "outcome" includes "process," then *any* ethical theory can be modeled as VNM maximization. The theorem loses its bite.
          2.  *Independence Axiom:* This is the technical killer. VNM requires that preferences over lotteries depend only on the probabilities of final states. Caring about the *source* of the probability (the coin vs. the dictator) violates Independence.
          3.  *Impartiality:* Harsanyi assumes impartiality means "equal weight." Diamond suggests impartiality might mean "equal chance."
      *   **The Verdict:** Harsanyi's theorem is not a derivation of utilitarianism from neutral rationality. It is a derivation of utilitarianism from *consequentialism*. The Diamond objection shows that "rationality" (VNM) is not ethically neutral. Therefore, the theorem does not corner the impartial observer.
      *   **Conclusion:** Summarize. The math is right, the philosophy is loaded. We are free to value fairness, but we must admit it's an ethical axiom, not a rational necessity.

