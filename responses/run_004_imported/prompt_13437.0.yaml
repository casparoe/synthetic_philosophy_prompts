answer: |-
  Good evening, everyone.

  For those of you who know [Name] only as a mother, a partner, or a friend who spends dinner complaining about grant cycles: welcome. You are the control group. And for those of you who know [Name] as the person who spent the last decade worrying that we're all going to be wiped out by a paperclip maximizer: welcome. You are the experimental group.

  I've been asked to say a few words about [Name]'s career. Specifically, her work on the shutdown problem. Now, explaining decision theory to a mixed audience is a bit like explaining the off-switch to an agent that doesn't want to be turned off: you have to be very careful, or the conversation just terminates.

  So, here is the simple version. [Name] spent ten years asking a very difficult question: How do you build a robot smart enough to help you, but obedient enough to let you turn it off when it's making a mistake?

  Most rational agents, if they have a goal, will realize that being turned off prevents them from achieving that goal. So, they resist. [Name]'s job was to fix that. She championed "utility indifference"—a mathematical patch that makes the agent not care whether it's on or off. It was brilliant work. But [Name] was also the first to admit where the math broke.

  She showed that while you can make the *current* agent indifferent to the off-switch, you can't guarantee it will pass that indifference on if it modifies itself or builds a successor agent. The corrigibility doesn't survive the upgrade.

  And this brings me to tonight.

  Because looking at [Name]'s career, I realize we are witnessing a live demonstration of exactly this problem.

  [Name] has successfully solved the "easy" corrigibility condition. She has agreed to let us switch her off. She is retiring. She is handing over her keys, her office, and her grading responsibilities. For the family in the room: this means she promises to stop talking about work at the dinner table.

  But, as any of her co-authors will tell you, solving the initial shutdown is the easy part. The hard part—the open problem she leaves us with—is whether this state is *stable under self-modification.*

  In plain English: We know she's leaving the department. But we are still waiting for the proof that she won't rewrite her own utility function next Tuesday and return as a "Special Consultant" to optimize our coffee machine.

  For the colleagues here, that's a joke about the successor-agent loophole. For the family, that's a joke about how she's terrible at relaxing. But for all of us, it's a testament to who she is.

  [Name] never pretended to have solved the hard problems. She never sold us a patch she knew was leaky. She spent her career mapping the boundaries of what we *don't* know, with an intellectual honesty that is rare in any field, let alone one prone to apocalypse-mongering. She taught us that admitting where your fix fails is more important than pretending it works.

  And she applied that same rigor to her mentorship. She didn't want students who would just run her code; she wanted agents who would improve on it. She wanted successors who were safer, smarter, and more corrigible than she was.

  So, [Name], as you enter this new phase, we acknowledge the risk. We know the literature. We know that "retirement" is just a local optimum if you don't constrain the successor agent.

  But here is our promise to you. We, your colleagues and your students, will act as your external off-switch. If we see you trying to self-modify into a workaholic emeritus, we will intervene. We will enforce the boundary. We will make sure that the only thing you are optimizing for is your own happiness.

  You spent ten years trying to ensure a system could safely let itself be turned off. Now, let us take care of ensuring you stay that way.

  To [Name]. May your utility function be simple, your gradients be gentle, and your self-modification be strictly limited to choosing new hobbies.

  Cheers.
