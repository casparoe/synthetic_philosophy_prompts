answer: |-
  The argument you present is the standard motivation for Supervaluationism, and on the surface, it is compelling. If two theories explain the same phenomena, the one that posits fewer "brute facts" (like a specific number of grains making a heap) seems preferable by Ockham's Razor.

  However, most philosophers of language do not consider Supervaluationism a clear winner on grounds of economy. This is because "theoretical economy" is not just about metaphysics (what exists); it is also about logic, semantics, and explanatory power. When you tally up the costs, Epistemicism often comes out ahead in categories other than metaphysics.

  Here is why Supervaluationism cannot simply be preferred on grounds of ontological economy.

  ### 1. Logical Economy vs. Metaphysical Economy
  The strongest argument for Epistemicism is that it preserves **classical logic** and **standard semantics**.
  *   **Epistemicism:** Maintains bivalence (every sentence is true or false), truth-functionality (the truth of $A \land B$ is determined solely by the truth of $A$ and $B$), and the Law of Excluded Middle ($P \lor \neg P$ is always true). It treats vague predicates exactly like precise ones, semantically speaking.
  *   **Supervaluationism:** To avoid sharp boundaries, it must sacrifice truth-functionality. On a supervaluationist account, $P$ might lack a truth value and $\neg P$ might lack a truth value, yet $P \lor \neg P$ is supertrue. This requires a non-standard logic and a more complex definition of validity (preservation of supertruth across all precisifications).

  Many philosophers argue that modifying classical logic is a higher theoretical cost than positing unknowable boundaries. If you value logical simplicity, Epistemicism is the more "economical" theory.

  ### 2. The Ontology of Precisifications
  You argue that Supervaluationism dispenses with hidden facts. However, it replaces them with **precisifications**.
  *   To make Supervaluationism work, one must posit a set of "admissible precisifications" (sharpenings of the language).
  *   What is the ontological status of these precisifications? Are they abstract objects? Possible worlds? Constructions of usage?
  *   Furthermore, Supervaluationism must explain what makes a precisification *admissible*. If this is determined by linguistic usage, the boundary between "admissible" and "inadmissible" precisifications threatens to be just as sharp and hidden as the boundary Epistemicism posits for the predicate itself.

  Thus, Supervaluationism does not necessarily reduce ontology; it shifts it from *facts about objects* to *facts about language/interpretations*.

  ### 3. The Problem of Higher-Order Vagueness
  This is often considered the fatal flaw for Supervaluationism regarding economy.
  *   **The Issue:** Vagueness seems to apply to the boundary itself. It is not just vague where "tall" begins; it is vague where the "borderline cases" begin (higher-order vagueness).
  *   **Supervaluationism's Struggle:** Supervaluationism draws a sharp distinction between precisifications that are admissible and those that are not. This reintroduces a sharp boundary at the level of the semantics. If there is a sharp cut-off for admissible precisifications, the theory has not actually eliminated sharp boundaries; it has just pushed them back one level.
  *   **Epistemicism's Advantage:** Epistemicism handles higher-order vagueness naturally. There is a boundary between heap and non-heap, and there is a boundary between "knowable" and "unknowable." It treats all orders of vagueness uniformly without needing new semantic machinery.

  ### 4. Explanatory Power (The Williamson Defense)
  Timothy Williamson, the primary defender of Epistemicism, argues that the "ignorance" posited by his view is not a brute mystery but is **explainable**.
  *   He uses a **margin for error** principle: To know that $n$ grains make a heap, your belief must be safe from error in nearby cases. Because the meaning of "heap" is sensitive to slight shifts in usage (semantic plasticity), you cannot know the exact cutoff without risking error in nearby worlds where usage shifts slightly.
  *   Therefore, the ignorance is a necessary consequence of the nature of knowledge and meaning, not an arbitrary posit.

  In contrast, Supervaluationism must explain why we treat borderline sentences as if they have truth values in ordinary conversation, despite them technically being truth-valueless. Epistemicism aligns better with our actual linguistic practice of asserting and denying vague claims.

  ### Conclusion
  Your intuition relies on **metaphysical parsimony** (don't posit sharp boundaries in the world). However, theory choice requires weighing **semantic and logical parsimony** as well.

  *   **Supervaluationism** saves metaphysical intuition (no sharp boundaries) but costs logical simplicity (non-truth-functional logic) and struggles with higher-order vagueness.
  *   **Epistemicism** costs metaphysical intuition (sharp boundaries exist) but saves logical simplicity (classical logic) and handles higher-order vagueness easily.

  Whether Supervaluationism should be preferred depends on whether you think logical deviation is a worse sin than metaphysical counter-intuitiveness. Many philosophers conclude that preserving classical logic is worth the cost of accepting unknowable boundaries, meaning Epistemicism remains a live, competitive option despite its "implausible commitment."
