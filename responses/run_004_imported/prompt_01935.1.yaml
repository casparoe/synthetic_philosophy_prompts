prompt: |-
  Okay this is gonna sound like a super specific thing to be stuck on but hear me out. My school does Ethics Bowl (its this national competition where teams have to argue through ethics case studies together, not normal debate where the whole point is to win), and during practice last week two of my teammates went on this massive tangent that had nothing to do with the case we were actually prepping and I haven't been able to stop thinking about it since.

  We'd just finished the obedience/conformity unit in AP Psych, so Diego brought up Milgram and Zimbardo to argue that virtue ethics is basically built on sand. His point was: if 65% of a totally ordinary sample of people will flip the switch all the way up to the maximum, most dangerous shock setting just because a guy in a lab coat says the experiment requires it, then whatever "honesty" or "courage" or "compassion" are supposed to be as stable traits living inside a person, they clearly aren't stable enough to do the explanatory work Aristotle needs them to do. Naomi said that's a strawman — virtue ethics never claims a virtuous person acts identically regardless of context, the entire point of phronesis (practical wisdom) is reading what a specific situation calls for and responding to that, and Aristotle straight-up says most people never become fully virtuous, so "most people cave under pressure" is exactly what the theory predicts, not a refutation of it. Diego shot back that this move makes virtue ethics unfalsifiable, since any behavior that looks bad can just get relabeled "not truly virtuous yet" forever, so the theory can never lose. Naomi said unfalsifiable is too strong, because "most people lack full virtue" is a specific, checkable claim rather than a dodge, and also pointed out that not everyone in Milgram's studies obeyed, so there's still real variation between individual people that needs some character-shaped explanation. She also brought up that half of Diego's evidence is damaged goods anyway, since apparently there's a legit 2019 investigation (by a guy named Le Texier, going through Zimbardo's actual archived materials) showing the Stanford "guards" were basically coached into acting cruel, so the whole "ordinary students spontaneously turn sadistic" story was manufactured to some degree. Diego conceded the prison study but said fine, just look at Milgram alone: obedience swings from 92.5% down to 10% depending on tiny situational tweaks, like whether the participant has to flip the switch themself or can delegate it to someone else, or whether a peer refuses first — and if changes that small move behavior that much, situational forces are obviously doing almost all the causal work, holdouts or no holdouts. Naomi's last word was that different people reacting differently to the exact same tweak is itself the thing that needs explaining, and that how someone responds once a peer models refusal sounds alot like a description of character, not an alternative to it.

  They had to stop there because practice ended, and honestly I don't think either of them is just wrong. Could you go through the whole exchange move by move and say who's got the better of it at each step, instead of just picking an overall winner? And if there's some obvious point you think they're both completely missing, I'd want to hear that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** High school Ethics Bowl team practice.
      *   **Topic:** The tension between Situationism (social psychology) and Virtue Ethics (Aristotelian philosophy), specifically using Milgram and Zimbardo studies as evidence.
      *   **Participants:** Diego (Situationist critique) vs. Naomi (Virtue Ethics defense).
      *   **Task:** Analyze the exchange move-by-move, evaluating who has the better argument at each step, rather than declaring an overall winner. Also, identify any major points both might be missing.
      *   **Tone:** Intellectual, nuanced, supportive (Ethics Bowl style collaboration over adversarial debate), but critical and analytical.

  2.  **Deconstruct the Exchange (Move-by-Move):**

      *   *Move 1: Diego's Opening Salvo.*
          *   Claim: Milgram/Zimbardo show 65% obey. Therefore, character traits (honesty, courage) aren't stable. Virtue Ethics (VE) is built on sand.
          *   Analysis: This is the classic "Situationist Challenge" (Doris, Harman). It's a strong initial point. However, it relies on the assumption that VE claims *most* people have stable virtues.
          *   Verdict: Strong empirical premise, but potentially misinterprets the scope of VE.

      *   *Move 2: Naomi's First Rebuttal.*
          *   Claim: VE doesn't claim everyone is virtuous. *Phronesis* is context-sensitive. Aristotle admits most people aren't fully virtuous.
          *   Analysis: This is the standard VE defense. It distinguishes between *ideal* theory and *empirical* reality. It addresses the "stability" claim by saying stability is a result of cultivation, not a default state.
          *   Verdict: Accurate representation of Aristotle. Effectively parries the "built on sand" claim.

      *   *Move 3: Diego's Counter (Unfalsifiability).*
          *   Claim: If bad behavior = "not virtuous yet," the theory is unfalsifiable (No True Scotsman).
          *   Analysis: This is a serious philosophical objection. If virtue is defined by right action, and right action is defined by virtue, it's circular.
          *   Verdict: Strong logical critique. Puts pressure on the explanatory power of VE.

      *   *Move 4: Naomi's Counter (Checkable Claim + Variation).*
          *   Claim: "Most lack virtue" is checkable. Not everyone obeyed (variation exists).
          *   Analysis: The "checkable claim" point is a bit weak (how do you measure virtue independently of action?). The "variation" point is stronger—if situation was *everything*, variance would be zero.
          *   Verdict: The variation point is the stronger half of this move.

      *   *Move 5: Naomi's Evidence Attack (Le Texier/Zimbardo).*
          *   Claim: Zimbardo data is compromised/coached.
          *   Analysis: Factually correct. Le Texier's work is significant. Zimbardo is often considered methodologically shaky compared to Milgram.
          *   Verdict: Naomi wins this specific evidentiary point. Diego concedes.

      *   *Move 6: Diego's Pivot (Milgram Variations).*
          *   Claim: Milgram variations show obedience swings (92% to 10%) based on tiny tweaks. Situation does the causal work.
          *   Analysis: This is Diego's strongest point. The empirical data on situational variables is robust. It challenges the *predictive* power of character traits.
          *   Verdict: Strong empirical weight. Hard for VE to ignore.

      *   *Move 7: Naomi's Closing (Interactionism).*
          *   Claim: Differential response to the same tweak *is* character. Peer modeling refusal is a character description.
          *   Analysis: This moves toward "Interactionism" (Person x Situation). It reframes character not as a rigid script but as a sensitivity to social cues.
          *   Verdict: Philosophically sophisticated. Saves VE from being obliterated by situational data.

  3.  **Identify Missing Points (The "Blind Spot"):**
      *   *Global Traits vs. Local Traits:* Both seem to assume virtues must be global (apply everywhere). VE can argue for local virtues (honest at home, obedient at school).
      *   *Cultivation:* VE is normative (how to *become* good), not just descriptive (how people *are*). The studies show how untrained people act, not how *phronimoi* (wise people) act.
      *   *The Definition of "Situation":* Is "seeing a peer refuse" a situation or a moral reason? If it's a moral reason, responding to it *is* virtue.
      *   *Ethics Bowl Context:* Remind the user that Ethics Bowl values collaboration. This isn't about "winning" the philosophy point, but understanding the case.

  4.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the quality of the debate. It's a classic philosophical dispute (Situationism vs. Virtue Ethics).
      *   *Round-by-Round Analysis:* Use the breakdown from step 2. Assign "points" or "advantage" carefully.
      *   *The Missing Piece:* Discuss Interactionism and the Normative/Descriptive distinction.
      *   *Ethics Bowl Advice:* Connect it back to the competition format (collaborative deliberation).

  5.  **Refining the Tone:**
      *   Avoid being condescending.
      *   Ensure philosophical terms (*phronesis*, situationism, global traits) are explained clearly.
      *   Make sure to validate *both* sides, as the user suspects neither is "just wrong."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Le Texier point accurately? Yes, it's about the Stanford Prison Experiment (SPE).
      *   *Check:* Did I address the Milgram variations? Yes, the "peer revolt" variation is key.
      *   *Check:* Is the distinction between descriptive psychology and normative ethics clear? This is crucial. Milgram describes what *is*; Aristotle prescribes what *ought to be* (and what is possible with training).
      *   *Adjustment:* Make sure to emphasize that Diego is arguing from *Descriptive Psychology* while Naomi is arguing from *Normative Ethics*. That's the category error at the heart of the fight.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Missing Point" section offers genuine insight, not just a summary. (The "Global vs. Local" trait distinction is a good addition here).

  8.  *(Final thought)*: This is actually a really high-level high school debate. I should compliment that. It shows they are thinking deeply.

  9.  **Constructing the Output.** (Proceeds to generate response based on these thoughts).
answer: |-
  This is not a "super specific thing to be stuck on"—this is literally one of the most famous debates in modern moral philosophy. Your teammates are accidentally reenacting the **Situationist Challenge to Virtue Ethics**, a dispute that kicked off in the late 90s (mostly by philosophers like Gilbert Harman and John Doris) and is still being fought today.

  The fact that they are hashing this out using AP Psych data is impressive. They are essentially pitting **Descriptive Psychology** (how humans *do* behave) against **Normative Ethics** (how humans *should* behave and what constitutes flourishing).

  Here is the move-by-move breakdown of who is holding the stronger position at each stage, followed by the crucial piece of the puzzle they are both overlooking.

  ### Round 1: The Opening Salvo
  **Diego:** Milgram/Zimbardo show 65%+ obedience. Therefore, character traits aren't stable. Virtue Ethics (VE) is built on sand.
  **Naomi:** VE never claimed everyone is virtuous. *Phronesis* is context-sensitive. Aristotle admits most people aren't fully virtuous.

  *   **Advantage: Naomi.**
  *   **Why:** Diego is making a category error. Virtue Ethics is largely a *normative* theory (an account of what constitutes the good life and how to achieve it), not a *descriptive* theory of average human psychology. Aristotle explicitly states that the *phronimos* (the person of practical wisdom) is rare. Diego is attacking VE for failing to describe the average person, but VE never claimed to describe the average person; it claims to describe the *ideal* person. Naomi correctly identifies that the "rarity" of virtue is a feature of the theory, not a bug.

  ### Round 2: The Unfalsifiability Trap
  **Diego:** If bad behavior just means "not virtuous yet," the theory is unfalsifiable (No True Scotsman).
  **Naomi:** "Most lack virtue" is a checkable claim. Also, not everyone obeyed (variation exists).

  *   **Advantage: Split (Diego on logic, Naomi on data).**
  *   **Why:** Diego lands a heavy philosophical hit here. This is the strongest version of the Situationist Challenge. If you define a "virtuous person" as "someone who does the right thing," and then explain "doing the right thing" by saying "a virtuous person did it," you are circular. It risks making VE a tautology.
      *    However, Naomi's counter about **variation** is empirically vital. If situation were the *only* causal factor (100% determinism), the variance in Milgram's study would be zero. The fact that 35% *didn't* go to the maximum suggests something internal (disposition/character) is interacting with the external pressure. Diego has the better philosophical point; Naomi has the better empirical point.

  ### Round 3: The Evidence Check (Zimbardo)
  **Naomi:** Le Texier's 2019 investigation shows Zimbardo's guards were coached. The "spontaneous sadism" story is manufactured.
  **Diego:** Concedes the prison study. Pivots to Milgram variations.

  *   **Advantage: Naomi.**
  *   **Why:** This is a factual knockout. The Stanford Prison Experiment (SPE) is methodologically notorious. Le Texier's archival work demonstrated that Zimbardo actively instructed the guards on how to behave to fit his hypothesis. Relying on SPE as a pillar of ethical theory is shaky ground. Diego wisely drops this to save his argument.

  ### Round 4: The Milgram Variations
  **Diego:** Obedience swings from 92.5% to 10% based on tiny tweaks (delegation, peer refusal). Situation does the causal work.
  **Naomi:** Differential response to the same tweak *is* character. Responding to a peer's refusal is a description of character.

  *   **Advantage: Diego (on empirical weight), Naomi (on philosophical interpretation).**
  *   **Why:** Diego is right that the *magnitude* of the situational effect is shocking. It suggests character is far more fragile than we like to think. This is the hardest data for VE to swallow.
      *    However, Naomi's final move is the most sophisticated of the entire debate. She is describing **Interactionism**. She is arguing that "character" isn't a rigid script that ignores the room; character is the *sensitivity* to moral cues in the room. If a peer refuses, the "situation" has changed morally. The person who recognizes that cue and follows it is displaying the virtue of solidarity or courage. The person who ignores it is displaying vice.

  ### The "Missing Point" They Both Overlooked

  There is a major conceptual distinction that would have resolved a lot of this tension: **Global Traits vs. Local Traits.**

  Diego is attacking the idea of **Global Character Traits** (e.g., "Honesty" is a single thing that applies in the lab, at home, at school, under stress, when tired, etc.). The Situationists argue these don't exist.

  Naomi is defending **Local Character Traits** (e.g., "Obedience-to-authority-when-peers-are-present" is a specific disposition).

  **The Missing Synthesis:**
  Modern Virtue Ethicists often concede to Diego that *Global* traits are rare or non-existent. However, they argue that VE is a *cultivation* project. The point of Aristotle's ethics isn't to say "People are naturally virtuous." It is to say: *"The human animal is malleable. If you do not train your local sensitivities through habit, you will be a slave to the situation (like the 65%). If you do train them, you can build stability."*

  **The specific blind spot:** They are treating the Milgram subjects as if they were supposed to be virtuous agents. They weren't. They were random samples of the untrained public.
  *   **Diego's Blind Spot:** He assumes VE claims virtue is the *default* state. It claims it is the *achieved* state. Using untrained subjects to disprove a theory of training is like using people who have never played piano to disprove the existence of musical skill.
  *   **Naomi's Blind Spot:** She risks making virtue too elastic. If character is just "responding to cues," how do we distinguish between a virtuous person following a moral cue and a conformist person following a social cue? She needs to explain *which* cues the virtuous person listens to (moral reasons) vs. which cues the obedient person listens to (authority signals).

  ### Ethics Bowl Advice

  Since you are in Ethics Bowl, here is how you use this:

  1.  **Don't let Diego "Win":** In Ethics Bowl, if you argue that "no one has control over their actions because of psychology," you destroy the basis of moral responsibility. You cannot have an ethical discussion if determinism is absolute. You must push back on the idea that situational force *eliminates* agency, even if it reduces it.
  2.  **Don't let Naomi "Win" easily:** If you argue that "a virtuous person would just know what to do," you sound naive. Acknowledge Diego's point: **Context matters immensely.** A good ethical recommendation must account for the situational pressures the stakeholders are facing.
  3.  **The "Collaborative" Move:** The best Ethics Bowl teams synthesize this. You can say: *"We agree with Diego that situational pressure is a massive ethical risk that often overrides good intentions (the Milgram effect). However, we agree with Naomi that ethical training (virtue) is the only known mitigation for that risk. Therefore, our recommendation isn't just 'don't be bad,' it's 'change the situation so obedience is harder, AND train the individuals to recognize peer refusal cues.'"*

  **Verdict:**
  *   **Diego** won on **Empirical Data** (Milgram variations are robust).
  *   **Naomi** won on **Philosophical Accuracy** (She understood what VE actually claims).
  *   **The Tie-Breaker:** Naomi's final point about Interactionism is the future of the field. Character isn't a shield against the situation; it's a navigation system *within* the situation.

  Tell your teammates they had a better debate in practice than most philosophy undergrads have in a semester. Keep that energy.
