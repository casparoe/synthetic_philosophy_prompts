          *   *Nuance:* Does defining fitness as a *propensity* (probability of survival) fix it, or is that just a statistical shield?
          *   *Guest's likely stance:* Propensity saves it.
          *   *Counter:* Is propensity measurable independently of the outcome?
          *   *Drafting the Question:* Need to ask if the propensity definition actually adds testable content or just linguistic cover.
          *   *Drafting the Follow-up:* If he says "yes, it's testable," ask *how* without referencing the survival outcome.

      *   **Topic 2: The Recantation/Clarification Timing.**
          *   *Core:* Popper criticized Darwin in the 50s/60s. In 1978 (Oxford lecture), he seemed to walk it back. Creationists love the early Popper.
          *   *Guest's likely stance:* It was always nuanced; the 1978 talk just cleared up misunderstandings.
          *   *Counter:* Why did it take 20+ years? Why does the language shift so drastically right when creationists are weaponizing the early quotes?
          *   *Drafting the Question:* Focus on the sociological context of the 1978 shift.
          *   *Drafting the Follow-up:* If he says "Popper just realized he was misunderstood," ask why Popper didn't correct the record sooner given his fame.

      *   **Topic 3: The Double Standard (Marx/Freud vs. Darwin).**
          *   *Core:* Popper demarcated science from non-science using falsifiability. He trashed Marx/Freud for being unfalsifiable (metaphysical). He called Darwin metaphysical too, but then seemed okay with that *for Darwin* but not for Marx.
          *   *Guest's likely stance:* Darwin was a "metaphysical research programme" that *became* scientific, whereas Marx stayed stuck.
          *   *Counter:* Isn't calling it a "research programme" just a polite way of saying "not science yet"? Why is Darwin allowed to stay in the waiting room while Marx is kicked out?
          *   *Drafting the Question:* Challenge the asymmetry in how "metaphysical" is treated.
          *   *Drafting the Follow-up:* If he says "Darwin generated predictions," ask for specific predictions that *couldn't* be explained by the metaphysical core.

