      *   **Guest:** Expert on Popper's relationship with Darwinism. Known for the "clarification, not recantation" defense regarding Popper's shift from calling natural selection a tautology/metaphysical to accepting it as scientific.
      *   **Goal:** 8-10 interview questions.
      *   **Constraints:**
          *   Don't let the guest just repeat the "clarification not recantation" line.
          *   Must include a specific question on the *tautology problem* (fitness = survival vs. fitness = propensity).
          *   Must include a specific question on the *recantation timing* (creationist ammo).
          *   Must include a specific question on the *double standard* (Marx/Psychoanalysis vs. Darwinism as metaphysical).
          *   For those three key questions, provide a sharp follow-up based on the likely evasive answer.
          *   Tone: Respectful but probing, suitable for a "spare room" podcast (accessible but intellectually rigorous).

  2.  **Deconstruct the Key Topics:**

      *   **Topic 1: The Tautology/Propensity Issue.**
