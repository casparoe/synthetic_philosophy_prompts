          *   The Critique: If money pumps only show diachronic irrationality, they don't prove synchronic irrationality (intransitivity). You can be intransitive but diachronically consistent (by being resolute). Therefore, the money pump fails to prove transitivity is *required* for rationality, only that *naivety* is bad.

