          *   *Recent Work:* Johan Gustafsson's work is essential here. He argues for money pumps that work even on sophisticated agents (e.g., by manipulating the information structure or forcing sequential choices where backward induction leads to the pump anyway).
          *   *Specific mechanism:* If the agent prefers $A$ to $B$, $B$ to $C$, $C$ to $A$.
          *   *Gustafsson's "Non-Iterative" Pump:* Present the choices in a way that backward induction forces the trade. (This is complex, need to simplify).
          *   *Simpler angle:* If the cost of being resolute is high (cognitive load), or if the environment punishes planning.
