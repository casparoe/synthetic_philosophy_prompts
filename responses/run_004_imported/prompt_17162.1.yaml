answer: |-
  **MEMORANDUM**

  **TO:** Interstate River Compact Commission
  **FROM:** [Your Name], Public Member Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Shortage-and-Surplus Sharing Protocol

  **Executive Summary**

  After reviewing the Economics Subcommittee's final drafts and consulting with stakeholders in the irrigation sector, I recommend the Commission adopt the **Nash Bargaining Solution** as the basis for our new shortage-and-surplus protocol, coupled with a **mandatory ten-year review clause**.

  While the Kalai-Smorodinsky formula offers stronger protections for established legal entitlements, the Nash approach offers superior stability in a drying basin. By decoupling annual water allocations from ongoing litigation over maximum entitlements, the Nash formula removes the incentive for states to inflate claims in court. Given the hydrological uncertainty we face, operational certainty for water users must take precedence over theoretical adherence to paper rights that may not be physically sustainable. The ten-year review provides a safety valve to adjust the protocol should hydrological conditions shift beyond current modeling.

  **Context: The End of the Fixed Percentage**

  For seventy years, our Compact has operated on a fixed percentage split negotiated during a wet period in the 1950s. That era is over. As the subcommittee has documented, a decade of declining snowpack has rendered the fixed percentage untenable; in dry years, it promises more water than exists, and in wet years, it fails to capture surplus efficiently.

  We are no longer negotiating how to divide a surplus, but how to share a deficit. The subcommittee has rightly identified that we need a dynamic formula—one where allocations adjust automatically based on total annual flow. The choice before us is not between "more water" or "less water," but between two different methods of sharing the risk of variability.

  **The Core Tradeoff: Fairness vs. Stability**

  The subcommittee has narrowed the options to two mathematical formulas. To understand the choice, we must look past the equations to the incentives they create.

  **1. The Kalai-Smorodinsky Formula (The "Entitlement" Approach)**
  This formula allocates changes in river flow based on each state's "room to grow"—the difference between what they are currently diverting and their maximum court-adjudicated entitlement.
  *   **The Principle (Monotonicity):** This approach ensures that if the river flows increase, no state is penalized simply because the other state has a larger legal claim. It respects the hierarchy of legal rights.
  *   **The Risk:** Because your share of the water depends on the size of your legal entitlement, this formula creates a standing incentive to litigate. If State A can convince a court to increase their "maximum entitlement" on paper, they automatically increase their share of future surplus water under this formula. In a drying basin, this encourages an arms race of legal claims that drains resources and fosters conflict without producing a single drop of new water.

  **2. The Nash Bargaining Solution (The "Stability" Approach)**
  This formula allocates changes in river flow equally between the states, based solely on the gain over the pre-Compact status quo diversions. It ignores the maximum adjudicated entitlements.
  *   **The Principle (Independence of Irrelevant Alternatives):** This approach ensures that the water split depends only on the water available, not on hypothetical legal arguments. If State A wins a lawsuit expanding their paper rights, it does not change the water allocation under this formula.
  *   **The Risk:** It treats the states as equals regarding marginal changes, regardless of whether one state holds senior legal rights that exceed the other. To the legal counsel in the room, this can feel like ignoring the rule of law in favor of a 50/50 split.

  **Recommendation: Prioritizing Stability**

  I recommend we adopt the **Nash Bargaining Solution**.

  As a representative of water users, my primary concern is certainty. Farmers and businesses along this river cannot plan investments, plant crops, or secure financing if the rules of allocation change every time a judge rules on a technicality regarding entitlement boundaries.

  The Kalai-Smorodinsky argument is principled: legal rights should matter. In a stable climate with abundant water, I would agree. A protocol that respects adjudicated rights reinforces the legal order. However, we are not in a stable climate. We are entering a period of structural scarcity. In this environment, a protocol that rewards litigation is a protocol that guarantees conflict.

  The Nash solution's "Independence of Irrelevant Alternatives" is not a bug; it is a feature for our current reality. It creates a "firewall" between the courtroom and the river. It allows our attorneys to argue over legal theory without holding the water supply hostage. By removing the hydraulic value of inflating a paper entitlement, we allow those entitlements to be resolved on their legal merits, rather than as leverage for water capture.

  **Addressing the Counter-Argument**

  Proponents of the Kalai-Smorodinsky formula argue that ignoring entitlements is unprincipled and that their formula is "monotonic"—meaning a state is never left worse off in a wet year simply because the other state's claim grew. This is a valid concern. It feels unjust to ignore senior rights.

  However, we must recognize that "monotonicity" in a shrinking river often means "locking in historical advantages." If the river continues to decline, the Kalai-Smorodinsky formula effectively hardens the dispute over who owns the rights to water that no longer exists. The Nash formula, by splitting the marginal change equally, forces both states to share the pain of the decline proportionally, rather than fighting over who has the bigger lifeboat. The "unprincipled" nature of ignoring entitlements is outweighed by the practical necessity of stopping the incentive to litigate.

  **The Safeguard: A Built-In Review**

  While I recommend the Nash formula for its stability, I acknowledge the subcommittee's concern regarding "unsettled hydrology." No formula drafted today can perfectly predict the river's flow ten years from now.

  Therefore, my recommendation is conditional on the inclusion of a **Sunset and Review Clause**. The protocol should be adopted for a fixed term of ten years. At the end of that term, the Commission must convene to review hydrological data and the performance of the formula.

  This review clause serves two purposes:
  1.  **Hydrological Adaptation:** It acknowledges that if the basin dries faster than predicted, we may need a fundamentally different approach.
  2.  **Political Safety:** It allows us to test the Nash stability without permanently surrendering the consideration of entitlements. If the Nash formula proves to create inequities that threaten the Compact's legitimacy, we retain the option to recalibrate.

  **Conclusion**

  We are building a system for our successors, not just for the current fiscal year. The Kalai-Smorodinsky formula builds a system for the river we had in the 1950s, governed by the legal battles of today. The Nash formula builds a system for the river we actually have, governed by the need for cooperation tomorrow.

  I urge the Commission to vote for the Nash Bargaining Solution with a ten-year review. This path offers the best chance to reduce litigation, provide certainty to water users, and preserve the Compact as a working instrument of peace rather than a weapon of conflict.

  Respectfully submitted,

  [Your Name]
  Public Member Commissioner
