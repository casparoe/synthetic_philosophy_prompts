answer: |-
  This is a classic tension between **efficiency** (maximizing total points) and **equity** (maintaining team cohesion and morale). While your mathematical assessment of the situation makes sense in a vacuum, debate is not played in a vacuum—it is a team sport played under high pressure.

  Here is a breakdown of why a strict 50/50 split might actually be the most "fair" and strategic choice, despite the difference in potential point gains.

  ### 1. The "Weak Link" Risk
  In debate, your team is only as strong as its weakest performance in a given round. If you maximize your score but your partner feels under-prepared because she received less time, she becomes a target. Opponents will identify her uncertainty and attack it.
  *   **Scenario A (50/50):** You gain 15 points, she gains 5 points. Both of you feel equally prepared and confident.
  *   **Scenario B (Utilitarian):** You gain 30 points, she gains 0 points (because she feels rushed/undervalued).
  In Scenario B, even with your high score, the team might lose the round because her performance was shaky. A confident partner who feels supported is strategically more valuable than a partner who feels set up to fail.

  ### 2. The Morale Multiplier
  You mentioned her "natural ceiling." **Do not share this assessment with her.**
  Perception is reality in performance. If you argue for more time based on the idea that you benefit more from it, you are implicitly telling her that her contribution is worth less than yours. This damages trust.
  *   If she feels the split is unfair, her anxiety will rise.
  *   Anxiety lowers performance.
  *   Her "10-point ceiling" might drop to a 5-point loss if she enters the room feeling like a second-class partner.
  Fairness, in this context, includes **psychological safety.** A 50/50 split buys you team cohesion, which is worth more than marginal speaker points.

  ### 3. Redefining "Fairness"
  Your partner is arguing for **Equality of Input** (we both get 4 hours). You are arguing for **Equity of Output** (time goes where it produces the most points).
  However, the truest definition of fairness in a partnership is **Equality of Commitment.**
  *   You are both investing the same amount of effort.
  *   You are both risking the same reputation.
  *   You are both sharing the laptop.
  Therefore, sharing the *resource* (time on the laptop) equally honors the shared risk. The fact that you might utilize that time more efficiently is a difference in skill, not a reason to hoard the resource.

  ### 4. A Strategic Compromise
  If you genuinely believe you need more time to secure a win, do not frame it around *her* limitations. Frame it around **task allocation.**
  Instead of splitting time by the hour, split it by **deliverable.**
  *   **Ask:** "What specifically do you need the laptop for?" (e.g., printing cards, finalizing citations).
  *   **Ask:** "What do I need it for?" (e.g., writing new blocks, cutting evidence).
  *   If she needs 3 hours to feel ready and you need 5, take the 5. But if you both need the full 8 to feel 100% confident, **give her the 4 hours.**

  ### The Verdict
  **Split the time evenly (4 hours each).**

  Here is why:
  1.  **Diminishing Returns:** After a certain point, extra research leads to over-preparation and rigidity. You might not actually get the full 30 points if you're cramming for 8 hours straight.
  2.  **Insurance:** If you have a bad round, you need her to be able to carry the load. If she is under-prepped, you have no insurance.
  3.  **Partnership Longevity:** If you win regionals but burn your partner, you won't have a partner for states. If you lose regionals but she feels you treated her with respect, the team survives to fight another day.

  **The "Fair" Move:**
  Tell her: *"I've been thinking about it, and you're right. We're a team, and we need to go into this feeling equally supported. Let's split the laptop time 50/50 so we both feel fully ready."*

  This validates her, boosts her confidence (potentially raising her ceiling above that 10 points), and secures your partnership. In high-stakes teamwork, **trust is the highest-yield resource you have.** Don't spend it on laptop hours.
