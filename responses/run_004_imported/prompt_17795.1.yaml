answer: |-
  **The Weight of Wax**

  The seal was cold, heavier than it looked. It was iron, carved with the crest of Ombria—a lion devouring a serpent—and it fit perfectly into Elian's palm. All morning, it had felt like a tool. Now, after the Magistrate's confession last night, it felt like a lie.

  Lord Varrick had been drunk, slumped over the ledger, the wine staining the margin like blood. *We could not make what is just strong,* he had slurred, tracing the rim of his goblet. *So we made what is strong just. Do not tell the sheep, Elian. Wolves listen.*

  Elian sat at his desk in the scriptorium, the morning light filtering through the high, dusty windows. Outside, the court bell tolled. It was time to record the judgments.

  He dipped his quill. The ink was black, permanent. Beside him lay the case of Tomas Vane, a tenant farmer disputing a land seizure by Baron Kress. Elian had reviewed the scrolls. The Baron's claim was based on a decree from forty years ago, buried in obscure tax law. Vane's claim was based on three generations of sweat and blood tilling the soil. By any measure of God or nature, the land was Vane's. By the law of Ombria, it was Kress's.

  Yesterday, Elian would have written the judgment with a clear conscience. The law was the law. Today, he saw the machinery behind the curtain. The law was not a shield for the weak; it was the architecture of the strong, painted to look like righteousness.

  He stood and walked to the courtroom gallery. He needed to see the faces.

  The hall was stone and shadow. Magistrate Varrick sat high on the dais, sober now, his face a mask of impassive gravity. He looked nothing like the drunken philosopher of the night before. He looked like authority itself.

  Tomas Vane stood in the dock. He was a thin man, hands calloused, eyes bright with a desperate hope. He believed in the ritual. He believed that because he was right, the Court would see it.

  "The Court finds," Varrick's voice boomed, flat and dry, "that the decree of Duke Alaric holds precedence. The land reverts to Baron Kress."

  The silence that followed was physical. It pressed against Elian's ears. He watched Vane. He expected tears, or pleading. Instead, he saw a calcification. The hope didn't fade; it curdled. Vane looked at the Baron, then at the Magistrate, and finally at the scribes recording his ruin.

  Elian saw the moment the illusion broke in Vane's eyes. It wasn't sadness. It was recognition. *I see you,* that look said. *I see that this is just force.*

  When the session broke, Elian lingered in the corridor. Vane was being ushered out by guards, but he broke free for a moment, stumbling toward Elian.

  "You wrote it," Vane hissed. His breath smelled of onions and fear. "You put the ink to the paper."

  "I record the judgment, Tomas. I do not make it."

  "Don't lie to me," Vane said, stepping closer. The guards tensed, but Varrick, watching from the dais, gave a slight shake of his head. Let him speak. "I know what this is. It's a theft with a signature. You think because you wear a robe, you're better than the Baron?"

  "I think order is necessary," Elian said, hearing how hollow it sounded.

  "Order?" Vane laughed, a sharp, brittle sound. "There is no order. There's only them," he jerked his head toward the dais, "and us. Now I know. Now I know there's no point in pleading. Next time, I bring a knife. Not a petition. A knife."

  He was shoved away then, dragged into the sunlight. Elian stood frozen. Vane was no longer a victim; he was a spark in a dry field. He had seen the truth—that justice was merely power wearing a mask—and his conclusion was destruction. If the law is a sham, why obey it? If the seal is a lie, why respect the wax?

  Elian returned to the scriptorium. The stack of judgments waited. The iron seal sat on the desk.

  Lord Varrick entered quietly. He closed the door. The silence of the room returned, heavy and thick. He did not sit. He walked to the window, looking out at the town below.

  "Vane threatened violence," Elian said.

  "Yes."

  "He knows, my Lord. He saw it. The machinery."

  Varrick turned. His face was weary, the lines around his eyes deep trenches. "There are two kinds of men who see through the illusion, Elian. The first becomes a bandit. He thinks that because the law is artificial, it is meaningless. He believes that knowing the truth makes him free to burn the house down."

  "And the second?"

  "The second becomes a magistrate," Varrick said softly. He walked to the desk and picked up the seal. He weighed it in his hand, feeling the cold iron. "He knows the law is arbitrary. He knows we are just strong men pretending to be wise. But he also knows what happens when the strength is removed."

  Varrick held the seal out to Elian. "If you tell them, Elian. If you stand on the steps and shout that this is all a fabrication... what happens?"

  "They stop obeying."

  "They stop obeying the weak laws," Varrick corrected. "And then they obey the strong laws. The law of the fist. The law of the mob. Vane thinks he wants freedom. He wants anarchy. And in anarchy, the Baron does not lose his land. The Baron keeps his mercenaries. And Vane loses his life. The illusion protects Vane from the Baron. It is the only thing that does."

  Elian looked at the seal. He thought of Vane's eyes. The dangerous clarity. Vane thought he was awake. But Varrick was awake too. The difference was that Vane thought the truth was a weapon to be used against the world, while Varrick knew the truth was a burden to be carried for the world.

  "It feels like complicity," Elian whispered.

  "It is stewardship," Varrick said. "It is the hardest kind. To know the world is broken, and to mend it with glue you know is weak, because you know there is no stone to replace it. The fool exposes the trick and lets the wolves in. The wise man keeps the curtain drawn so the children can sleep."

  Varrick placed the seal back on the desk. The metal clinked, a final sound.

  "You are my clerk, Elian. You hold the pen. You can write a confession. You can tell them that justice is a myth we tell to keep the peace. You will be hailed as a truth-teller for a week. And then the city will burn, and you will hang from the gallows you sought to dismantle. Or..."

  Varrick gestured to the stack of parchment.

  "Or I finish the record," Elian said.

  "You finish the record. You seal the judgment. You let Vane hate the law, because hatred of the law is safer than the knowledge that the law does not exist."

  Elian sat down. His hand trembled slightly. He dipped the quill. He looked at the line where his signature would go, validating the theft of Tomas Vane's livelihood. He knew it was wrong. He knew it was arbitrary. He knew that in a hundred years, the decree of Duke Alaric would be dust, and the justice of the soil would remain.

  But today, there was only the court. And without the court, there was only the knife.

  He thought of Vane in the sunlight, promising violence. He thought of the women and children in the tenements who needed the Baron's mercenaries to stay outside the walls, even if those mercenaries demanded rent. He thought of the fragile dam holding back the flood.

  To expose the lie was to invite the chaos. To keep the lie was to accept the sin.

  Elian pressed the quill to the paper. The ink flowed, black and absolute. He blew on it to dry the truth that wasn't true.

  Then he took the seal. It was cold, heavy, and real. He pressed it into the red wax. When he lifted it, the lion devoured the serpent, perfect and immutable.

  "Is it done?" Varrick asked.

  Elian looked at the Magistrate. He saw not a villain, but a fellow conspirator in the maintenance of peace. They were the keepers of the necessary fiction.

  "It is done," Elian said.

  He did not feel free. He felt heavier, as if the iron of the seal had seeped into his bones. He had chosen the wise man's path over the fool's. He had chosen the safety of the cage over the danger of the wild.

  Outside, the bell tolled again. The city continued, orderly and unjust. Elian picked up the next scroll. He dipped the quill. He wrote.
