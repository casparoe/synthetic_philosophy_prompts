answer: |-
  This is the million-dollar question in metaethics. You have correctly identified the exact pressure point: if moral sentences aren't truth-apt (they don't describe facts), how can they participate in logical relations (like *modus ponens*) that seem defined by truth-preservation?

  If you say validity is just "preservation of truth," expressivism is dead on arrival. So, the expressivist's only move is to **redefine what logical validity is** in this context, without secretly relying on truth.

  I think **Allan Gibbard's Norm-Expressivism** (specifically his later work on *planning* and *consistency*) offers the cleanest "gut-level" explanation of how this works without smuggling truth back in. Blackburn is great, but Gibbard's analogy to *practical reasoning* (planning) makes the "no truth" constraint easier to visualize.

  Here is the walkthrough.

  ### 1. The Shift: From "Truth" to "Coherence"

  The cognitivist (realist) says logic works like this:
  *   **Validity:** If the premises are *true*, the conclusion *must* be true.
  *   **Error:** If you accept the premises and reject the conclusion, you believe a falsehood.

  The expressivist (Gibbard) says logic works like this:
  *   **Validity:** If you accept the commitments in the premises, you are *rationally required* to accept the commitment in the conclusion.
  *   **Error:** If you accept the premises and reject the conclusion, your mind is in a state of **incoherent planning**.

  The key is to stop thinking of moral judgments as *maps of the world* (which can be accurate/inaccurate) and start thinking of them as *plans for living* (which can be consistent/inconsistent).

  ### 2. Translating the Argument into "Plan Language"

  Let's look at your *modus ponens* example:
  1.  **P1:** Lying is wrong.
  2.  **P2:** If lying is wrong, then getting your little brother to lie is wrong.
  3.  **C:** Therefore, getting your little brother to lie is wrong.

  Here is how Gibbard translates these not into facts, but into **states of mind (planning states)**:

  *   **P1 ("Lying is wrong"):** This isn't stating a fact. It is **adopting a plan/norm**.
      *   *Mental State:* "I plan to not lie." (Or: "I accept a norm that rules out lying.")
  *   **C ("Getting brother to lie is wrong"):** This is also adopting a plan.
      *   *Mental State:* "I plan to not get my brother to lie."

  Now, the hard one. What is **P2**?
  *   **P2 ("If lying is wrong, then getting brother to lie is wrong"):**
      *   If this were a fact, it would be a relation between two moral properties. But there are no moral properties for the expressivist.
      *   Instead, P2 expresses a **higher-order plan about plans**. It is a constraint on your own normative system.
      *   *Mental State:* "I rule out the combination of [Planning to not lie] AND [Failing to plan to not get my brother to lie]."
      *   *Gut-level:* It's saying, "In my system of norms, you aren't allowed to hate lying but be okay with making your brother lie. Those two attitudes don't fit together."

  ### 3. Where the Validity Comes From (The "Crash")

  Now, let's run the *modus ponens* and see where the "validity" comes from if we aren't tracking truth.

  Imagine you, the agent, assert P1 and P2, but you **deny C**. What does your mind look like?

  1.  **From P1:** You are holding the plan: *No Lying.*
  2.  **From P2:** You are holding the constraint: *It is forbidden to hold [No Lying] without holding [No Brother-Lying].*
  3.  **From Denying C:** You are refusing the plan: *No Brother-Lying.* (You are okay with brother-lying).

  **The Crash:**
  You are now in a state of **practical inconsistency**.
  *   You have Plan A.
  *   You have a rule that says "Plan A requires Plan B."
  *   You refuse Plan B.

  This isn't a contradiction of *facts* (like saying "It is raining and it is not raining"). It is a contradiction of **will**. It is like saying:
  *   "I intend to go to New York."
  *   "I intend that if I go to New York, I will take a plane."
  *   "I do not intend to take a plane."

  You haven't said anything "false." The world hasn't contradicted you. But **you have contradicted yourself.** Your own planning system is jamming. You cannot coherently occupy all three of those mental states at once.

  **That jamming is what expressivists call "validity."** Validity is the guarantee that you cannot accept the premises' attitudes without being rationally compelled to adopt the conclusion's attitude, on pain of incoherence.

  ### 4. Addressing the "Smuggling Truth" Worry

  This is the part that usually bugs people. You might ask: *"Isn't saying 'you can't coherently hold these states' just a fancy way of saying 'the proposition that you hold them is false'?"*

  Here is the expressivist's hard-line defense against smuggling:

  **1. Consistency is not Truth.**
  I can have a plan that is perfectly consistent but factually disastrous.
  *   *Plan:* "I plan to jump off this cliff."
  *   *Plan:* "I plan that if I jump off this cliff, I will fly."
  *   *Plan:* "I plan to fly."
  This is logically consistent planning! But it's factually impossible.
  Expressivism relies on **logical consistency of attitudes**, not **correspondence to reality**. When they say *modus ponens* is valid, they mean the *attitudes* fit together, not that they match the moral fabric of the universe.

  **2. The Conditional isn't a Proposition.**
  The worry is that P2 ("If lying is wrong...") looks like a proposition waiting to be true or false.
  Gibbard insists P2 is not a claim about the world. It is an expression of **normative uncertainty resolution**. To accept P2 is to settle in advance how you will resolve conflicts between norms. It's a tool for keeping your own mind from fracturing.
  When you assert P2, you aren't describing a logical relation between moral facts; you are **binding your future self** to a pattern of judgment.

  **3. Logic as a Tool, Not a Mirror.**
  For the cognitivist, logic mirrors the structure of reality. For the expressivist, logic is a tool for **coordination**.
  Why do we care if the argument is valid? Because if we accept P1 and P2 but reject C, we become unreliable agents. We become people who condemn lying but encourage proxy-lying. We become untrustworthy to ourselves and others.
  The "force" of the logic comes from the **practical necessity of having a coherent mind**, not the **metaphysical necessity of truth preservation**.

  ### Summary

  To answer your specific worry: The solution doesn't rescue validity by showing that moral statements *are* truth-apt after all. It rescues validity by showing that **logic applies to things other than truth.**

  Just as you can have valid reasoning in imperatives ("Close the door; if you close the door, lock it; therefore, lock it"), you can have valid reasoning in norms.
  *   **Cognitivist Validity:** You can't believe premises are true and conclusion false.
  *   **Expressivist Validity:** You can't hold the attitudes in the premises without holding the attitude in the conclusion.

  If you try to deny the conclusion while accepting the premises, you haven't stumbled onto a falsehood; you've just **broken your own brain's operating system.** That breakdown is the expressivist substitute for logical invalidity.
