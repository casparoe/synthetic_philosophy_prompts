  To argue that Lewis's Reformed Conditional Analysis (RCA) survives Bird's antidote objection without resorting to an unprincipled *ceteris paribus* clause, we must look closely at the metaphysical work performed by the **"x-complete cause"** clause. The received view assumes that this clause merely adds a causal requirement to the counterfactual without altering the semantics of how that counterfactual is evaluated against extrinsic interferers. I will argue that this assumption is mistaken. Properly understood, the "x-complete cause" requirement, coupled with Lewis's explicit commitment to the **Intrinsicness Thesis**, forces a specific evaluation of the counterfactual that principledly excludes antidotes from the truth conditions of the disposition.

  Here is the rigorous case for why Lewis's analysis withstands the antidote objection.

  ### 1. The Structure of the Objection and the Defense

  Bird's objection relies on the following setup:
  1.  **Intuition:** A poison retains its lethal disposition even when an antidote is present (masking).
  2.  **Lewis's RCA:** $x$ is disposed to $M$ in response to $S$ iff $x$ has intrinsic basis $B$, and if $x$ underwent $S$ and retained $B$, then $S$ and $B$ would jointly be an **x-complete cause** of $M$.
  3.  **The Problem:** In the presence of an antidote, $S$ occurs, $B$ is retained, but $M$ does not occur. Thus, $S$ and $B$ do not cause $M$. The counterfactual is false. RCA falsely denies the disposition.

  The standard defense often involves adding a *ceteris paribus* clause ("all other things being equal" or "in normal conditions"). You have correctly identified this as unprincipled. The stronger defense argues that the **"x-complete cause"** clause *already* functions to exclude the antidote, provided we respect the metaphysical constraints Lewis places on dispositions.

  ### 2. The "x-Complete Cause" as a Causal Filter

  Lewis defines an $x$-complete cause of an event $e$ as a cause that includes all events intrinsic to $x$ that are causes of $e$, such that any *other* causes of $e$ are either parts of the stimulus $S$ or intrinsic to $x$ (Lewis 1997, p. 157).

  This definition is not merely descriptive; it is restrictive. It demands that the causal explanation of the manifestation $M$ be tellable entirely in terms of $x$'s intrinsic nature and the stimulus.

  In an antidote scenario:
  *   **Actual World ($w_{actual}$):** Stimulus $S$ occurs. Basis $B$ is retained. Antidote $A$ (extrinsic) is present. $M$ does not occur.
  *   **Causal Status in $w_{actual}$:** $S$ and $B$ are *not* a cause of $M$ (because $\neg M$). Furthermore, the causal story of why $\neg M$ occurred essentially involves $A$.

  For the RCA conditional to be true ("If $S$ and retain $B$, then $S$ and $B$ would be an $x$-complete cause of $M$"), we must evaluate the consequent in the closest world(s) where the antecedent holds.
  *   If we evaluate in $w_{actual}$ (holding $A$ fixed), the consequent is false.
  *   Therefore, for the disposition to exist (as intuition dictates), the closest world where the antecedent holds must be a world where the consequent is *true*.
  *   For the consequent to be true, there must be a world where $S$ and $B$ occur, $M$ occurs, and the cause is $x$-complete (i.e., no extrinsic $A$ interferes).

  The crux of the argument is this: **Why is the world without the antidote ($w_{no-A}$) closer to actuality than the world with the antidote ($w_{A}$), given that the antidote is actually present?**

  Standard Lewisian semantics (1973) prioritizes the match of particular fact. $w_{A}$ matches the actual presence of the antidote; $w_{no-A}$ does not. This is why the received view claims Lewis fails. However, this ignores the **Intrinsicness Thesis** which governs the 1997 analysis.

  ### 3. The Intrinsicness Constraint on Counterfactual Evaluation

  Lewis (1997) explicitly argues that dispositions are **intrinsic properties**. An intrinsic property cannot vary between perfect intrinsic duplicates. If Lewis's analysis yields a "false" for a poison in a world with an antidote, but "true" for an intrinsic duplicate in a world without one, the analysis fails to capture an intrinsic property.

  To preserve the Intrinsicness Thesis, the truth conditions of the disposition ascription cannot depend on extrinsic contingencies (like the presence of an antidote) that are not part of the stimulus $S$.

  This imposes a principled constraint on the similarity ordering used to evaluate the RCA counterfactual. When evaluating a counterfactual that serves as the truth condition for an **intrinsic** property, we must prioritize the preservation of the object's intrinsic causal powers over the preservation of extrinsic environmental facts.

  *   **Principle:** In evaluating "If $S$ and $B$, then $M$" for an intrinsic disposition, worlds where extrinsic interferers prevent $M$ are less relevant (less "close" in the dispositional sense) than worlds where $x$'s intrinsic nature is allowed to express itself, *ceteris intrinsicus*.

  This is not an ad hoc *ceteris paribus* clause bolted onto the analysis. It is a derivation from the metaphysical category of the *definiendum*. If we do not interpret the counterfactual this way, Lewis's analysis contradicts his own Intrinsicness Thesis. Therefore, the "x-complete cause" clause, read in light of the Intrinsicness Thesis, functions as a filter that screens out extrinsic masks during the evaluation of the counterfactual.

  ### 4. Addressing Bird's Strongest Objection

  Bird's strongest reply is that this move effectively changes the semantics of counterfactuals to suit the desired outcome. He argues that the antidote is a natural, law-governed part of the world, not a "miracle," and standard semantics require us to hold it fixed.

  **The Rebuttal:**
  Bird conflates the **causal sufficiency** of $S+B$ in a specific context with the **causal basis** of the disposition.
  Lewis's analysis does not ask: "Is $S+B$ sufficient for $M$ in the actual environment?"
  It asks: "Is there a $B$ such that $S+B$ would be an **x-complete cause** of $M$?"

  The phrase "x-complete cause" refers to a *type* of causal relation grounded in $x$'s nature.
  *   In the antidote world, the causal process is *interrupted*. The process that *would* have occurred (the $x$-complete one) is preempted by an extrinsic interaction.
  *   The counterfactual in RCA is testing the **capacity** of $B$, not the **outcome** in a specific masked context.
  *   Because the analysis requires the cause to be "$x$-complete," it requires the causal history to be free of extrinsic preventers.
  *   Therefore, the proposition "$S$ and $B$ would be an $x$-complete cause of $M$" is necessarily false in any world where an extrinsic antidote successfully prevents $M$.
  *   Consequently, to find a world where this proposition is *true* (which is required for the disposition to exist), we *must* look to a world where the antidote is absent.

  This is not varying the world arbitrarily. It is recognizing that the **truth-maker** for the disposition (the intrinsic basis $B$) is distinct from the **contextual factors** (the antidote). The "x-complete cause" clause explicitly restricts the truth-maker to $x$'s intrinsic domain. If the actual world contains an extrinsic factor that falsifies the consequent, the counterfactual evaluation for an intrinsic property must look to the closest world where the intrinsic causal power is not extrinsically thwarted.

  ### 5. Conclusion: No Unprincipled Clauses Required

  The survival of Lewis's analysis rests on recognizing that the "x-complete cause" clause is not merely a causal add-on, but a metaphysical boundary marker. It demarcates the causal processes that belong to $x$'s nature from those that belong to $x$'s environment.

  1.  **Intrinsicness:** Dispositions are intrinsic; their truth conditions must not vary with extrinsic masks.
  2.  **x-Completeness:** The analysis requires the cause to be explicable solely via $x$'s intrinsic properties (and $S$).
  3.  **Evaluation:** An antidote makes the cause *not* $x$-complete (by introducing an extrinsic preventer). Therefore, the consequent is false in masked worlds.
  4.  **Resolution:** To satisfy the analysis (and the Intrinsicness Thesis), the counterfactual must be evaluated in the closest world where the extrinsic preventer is absent, allowing the $x$-complete causal process to run.

  This avoids an unprincipled *ceteris paribus* clause because the exclusion of the antidote is derived directly from the definition of "x-complete cause" and the metaphysical requirement that dispositions be intrinsic. Bird's objection holds only if we treat the counterfactual as a raw, context-insensitive conditional. But Lewis's RCA embeds the context-sensitivity within the "x-complete" requirement itself. Thus, the analysis defuses the antidote objection from within its own theoretical resources.
