      *   *Defense:* It's not *ceteris paribus* (all else being equal); it's *ceteris intrinsicus* (all else intrinsic being equal). It follows from the definition of "x-complete." An "x-complete cause" *by definition* excludes extrinsic factors from the causal explanation. If an extrinsic factor is present and active, the cause is *not* x-complete. Therefore, to assert that $S+B$ *would be* an x-complete cause, we are asserting that there is a possible scenario (close to actual) where $S+B$ obtain and extrinsic factors do not interfere.
