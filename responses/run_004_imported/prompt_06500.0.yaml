      *   *Key Feature 2 (Consent):* The bound person previously consented to the binding.
      *   *Key Feature 3 (Temporality):* The binding is temporary (until past the Sirens).
      *   *Key Feature 4 (Purpose):* To preserve a higher-order preference against a lower-order impulse.

  3.  **Deconstruct Constitutional Precommitment:**
      *   *Mechanism:* Entrenchment clauses (Article V, German Basic Law Art. 79).
      *   *Key Feature 1 (Identity):* The framers (dead) bind the citizens (living/unborn). Intergenerational, not intrapersonal.
      *   *Key Feature 2 (Consent):* Tacit consent at best. No actual signature from future generations.
      *   *Key Feature 3 (Temporality):* Indefinite/Perpetual (until amended, which is made hard or impossible).
