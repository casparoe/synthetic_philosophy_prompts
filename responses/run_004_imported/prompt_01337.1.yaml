answer: |-
  This is one of the hardest situations in business: when the *value* of a partnership diverges sharply from the *equality* of the partnership. You are dealing with three distinct layers of problem here: the financial math, the legal reality, and the friendship dynamics.

  If you handle this poorly, you lose the money, the friend, or both. If you handle it well, you can preserve the friendship and still get a life-changing outcome.

  Here is a framework for thinking about "fairness" in this specific scenario, moving from the abstract to the actionable.

  ### 1. Separate "Asset Value" from "Human Capital"
  The biggest source of tension is that the $800k figure and the $150k figure are not the same *kind* of money.

  *   **The Asset (The App):** This is what you built together over two years. Legally and ethically, based on your 50/50 history, the value of the *existing business* belongs to both of you equally.
  *   **The Human Capital (You):** The buyer is paying a premium for your specific brain, your algorithm, and your future labor (the job offer + vesting equity). Your friend cannot share in this. You cannot split a job offer.

  **The Fair Split Logic:**
  You need to unbundle the offer. Ask the buyer for a breakdown:
  *   How much is cash for the IP/Assets?
  *   How much is salary/signing bonus?
  *   How much is equity vesting over 4 years?

  **The Rule:** The **Asset Value** should be split 50/50. The **Human Capital Value** (salary, future vesting, retention bonuses tied to *your* employment) belongs to you.

  If the $800k is mostly salary and 4-year vesting, it is not "exit money." It is "future wage money." If your friend expects a 50% cut of your future salary, that is unfair to you. If you expect them to treat the whole $800k as "exit proceeds" to be split, that is unfair to them.

  ### 2. Address the "Opportunity Cost" (Your Friend's Fear)
  Your friend's specific worry is: *"This deal leaves me worse off than if we just kept working."*

  This is a valid financial concern, not just jealousy. If the app generates $200k/year profit, and you split it, he makes $100k/year. A $150k cash-out is only 1.5 years of income. If he has no job to walk into, selling the app might be financial suicide for him, even if it's a windfall for you.

  **The "Make Whole" Threshold:**
  Before you discuss splitting the upside, you must calculate his **Baseline**.
  *   What is the app's current annual profit?
  *   What is his realistic share of that for the next 2–3 years?
  *   Add a risk premium (since staying open carries risk).

  If the cash offer ($150k) is lower than his Baseline, the deal is structurally broken for him. In this case, "fairness" requires that the **Asset Value** portion of the deal be high enough to cover his lost future income, even if it comes out of your share of the asset portion.

  ### 3. The Legal Reality Check (The "No Contract" Risk)
  You mentioned there is no contract. In many jurisdictions, without a Founder's Agreement or IP Assignment agreement, **he legally owns 50% of the code you wrote, and you own 50% of the code he wrote.**

  If the buyer wants the algorithm *you* built, but it lives inside a codebase *you both* own, your friend actually has veto power. He could legally block the sale. He could say, "I won't sign over my 50% of the IP for $150k."

  *   **Do not use this as a threat.** That ends the friendship.
  *   **Do recognize this as leverage.** He isn't asking for a favor; he holds half the keys to the house.

  ### 4. How to Structure the Deal
  You need to negotiate a structure that acknowledges the asymmetry without exploiting it.

  **Option A: The Tiered Payout**
  Negotiate with the buyer to increase the upfront cash for the IP, even if it lowers your total equity package.
  *   *Example:* Can the buyer pay $400k cash for the app (split 50/50 = $200k each) and reduce your employment package to $600k?
  *   *Result:* Friend gets $200k cash (better than $150k). You get $600k (still life-changing).

  **Option B: The "Side Letter" Bonus**
  You accept the deal as structured, but you voluntarily kick back a portion of your *asset* share to him to meet his Baseline.
  *   If the 50/50 split of the asset value leaves him short of his "Stay Open" baseline, you cover the difference from your share.
  *   *Why:* You are still coming out massively ahead ($800k vs $150k is a huge gap, but $700k vs $250k is still a huge gap). Preserving the friendship and your reputation is worth the marginal difference.

  **Option C: The Earn-Out for Him**
  Ask the buyer if there is a role for your friend, or if a portion of his payout can be tied to the app's continued success under the new owners. This aligns his "stay open" hope with the "sell" reality.

  ### 5. The Conversation Strategy
  You must be radically transparent. If he finds out later that you could have cleared $800k but told him the deal was worth less, the friendship is over.

  **Step 1: The Disclosure**
  "I need to be completely open with you. The buyer values the company, but they are heavily weighting the offer around my specific role there. If I optimize for my package, it looks like $800k, but your cash out is capped around $150k. I know that looks wildly uneven, and I don't want to make a move that hurts you."

  **Step 2: The Baseline Check**
  "Your worry is that selling leaves you worse off than staying open. Let's look at the numbers. If we stay open, what do you realistically make in the next 24 months? If the sale price is lower than that, I don't think we should sell unless we can fix it."

  **Step 3: The Joint Negotiation**
  "I want us to tell the buyer together: 'We are a package deal regarding the asset. If the cash component for the IP doesn't work for both founders, we walk.' I am willing to take less on the *asset* side to make sure your cash number works, because my *employment* package is still significantly higher than yours."

  ### Summary Recommendation
  **Fairness here does not mean a 50/50 split of the total $950k pot.** That ignores that $400k+ of your pot is payment for future labor he isn't doing.

  **Fairness means:**
  1.  **50/50 split of the Cash/IP Acquisition price.** (The value of the past 2 years).
  2.  **100% to you of the Employment/Retention package.** (The value of the next 4 years).
  3.  **A "Floor" for your friend.** If the 50% share of the Cash/IP price is less than what he'd make staying open for 2 years, you subsidize his share from your portion of the Cash/IP price.

  You will still end up with significantly more than him (because of the job/equity), but he will walk away with liquid cash that respects his contribution and secures his future. That is how you keep the friend.

  **One final warning:** Get a startup lawyer to draft a simple retroactive founder agreement before you sign anything with the buyer. Define who owns what *now*, while you are still friends, so the buyer doesn't exploit the ambiguity to lower the offer or drive a wedge between you.
