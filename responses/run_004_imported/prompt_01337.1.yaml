prompt: |-
  So my friend and i have run a small app together for two years, 50/50 on the work, no contract, always just split whatever it made evenly. A company wants to buy it now, but it turns out they're mainly after me specifically, for a recommendation algorithm i built, so if the deal got shaped entirely around what's best for me (equity plus a job offer) i could clear something like $800k, way more than my friend's best-case version of the exact same deal, which tops out around $150k if he just cashes out and walks away. He's worried that whatever split we land on leaves him with less than hed get if we just kept running the app ourselves and never took the offer at all, purely because i happen to be the one they want, which feels wrong, but pretending we bring equal value to this deal now feels wrong too. Neither of us has some great job to walk into, so its not really a leverage thing, and i really don't want this to wreck the friendship. Is there an actual fair way to think about how to divide this, or does it just come down to whoever pushes harder?
