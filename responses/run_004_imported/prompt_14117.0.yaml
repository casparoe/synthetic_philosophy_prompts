          *   The "Tie-Breaker" problem: If the one person complains "Why didn't you save me?", you say "Because five others would have died." Is that a valid justification? Scanlon says yes, *but* only if we acknowledge the complaint of the five is stronger in aggregate? No, Scanlon tries to avoid aggregation.
