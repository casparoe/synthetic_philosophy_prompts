      *   *Final Decision:* I will defend **Aggregation (The Numbers Count)**, but I will ground it in **Ex-Ante Individual Rationality** rather than Impersonal Utility. This bridges the LW view with the Contractualist critique. Taurek is wrong. Parfit is right, but for a deeper reason than just "summing good."

