answer: |-
  # The Arithmetic of Rescue: Why Taurek is Wrong and the Numbers Must Count

  You have stumbled onto one of the most durable fault lines in modern moral philosophy. On one side stands John Taurek's 1977 paper *"Should the Numbers Count?"*, a radical challenge to the aggregative logic underpinning utilitarianism, effective altruism, and the LessWrong canon. On the other stands Derek Parfit's *"Innumerate Ethics"*, alongside a century of consequentialist intuition that says leaving four lives on the table is not just suboptimal, it is wrong.

  You asked for a verdict, not a diplomatic summit. You want to know if the "Shut Up and Multiply" worldview collapses when faced with the separateness of persons.

  Here is the case, the counter-case, and the judgment.

  ### I. The Steelman: Taurek's "Loss is Personal"

  To defeat Taurek, we must first stop treating him like a confused utilitarian. He is not making a math error; he is making a metaphysical claim about the locus of value.

  Taurek's argument rests on three pillars:

  1.  **The Non-Existence of Social Loss:** When person A dies, A suffers a loss. When person B dies, B suffers a loss. But there is no "super-entity" (Society, Humanity, The Universe) that suffers the sum of A's loss plus B's loss. Loss is essentially indexed to the subject. To say "five deaths is worse than one" is to speak nonsense, because there is no single subject for whom it is worse.
  2.  **Equal Concern Requires Equal Chance:** If you are a third party with a limited resource (the drug), and you owe a duty of equal concern to all six strangers, how do you discharge it? If you automatically save the five, you have subordinated the one to the many. You have treated the one as a mere means to the end of "maximizing survivors." To show equal respect for each individual's claim to life, you must give each *individual* an equal chance of survival.
  3.  **The Coin Toss:** Taurek suggests that since there is no "greater loss" to avoid, you are permitted (and perhaps required) to flip a coin to decide which *group* to save. (Note: Taurek is sometimes ambiguous on whether the coin decides the *group* [50% chance for the one, 50% for the five] or the *individuals* [1/6 chance for each]. The stronger version of his argument implies we should not be swayed by the grouping at all, but the "group coin toss" is the standard charitable interpretation).

  The emotional core of Taurek's view is the **Complaint**. If you save the five and the one dies, the one (or their kin) can ask: "Why did you let me die?" The Utilitarian answers: "Because five others would have died." Taurek argues this is no answer at all, because the five others' deaths are not *your* deaths. Their loss does not outweigh yours.

  From this perspective, "Shut Up and Multiply" looks like a category error. It treats people as containers of utility rather than sovereign claimants.

  ### II. The Counter-Attack: Parfit, Scanlon, and the Iteration Trap

  The responses to Taurek generally fall into two camps: the *Absurdity at Scale* argument (Parfit) and the *Contractualist* argument (Scanlon).

  **1. Parfit's Reductio (The Million Person Case)**
  Parfit's rebuttal is blunt: If the numbers don't count in the 1 vs. 5 case, they don't count in the 1 vs. 1,000,000 case. If you hold Taurek's view consistently, you must admit it is permissible to flip a coin between saving one person and saving a million.
  Parfit argues that any moral theory that permits letting a million die to save one, when the cost to the agent is identical, is self-defeating. It violates the very "concern for individuals" Taurek claims to protect. If you care about individuals, you should care about the million individuals who will die.

  **2. The Contractualist Turn (Scanlon's Weighted Lottery)**
  T.M. Scanlon attempts a middle path. He agrees with Taurek that we must justify our actions to each individual. However, he argues that the "complaint" of the one person left to die is weaker than the combined complaints of the five.
  Why? Because if we adopted a policy of "always save the one," the five would have a valid complaint: "You let us die to save one." If we adopt "always save the five," the one has a complaint: "You let me die to save five."
  Scanlon argues the complaint of the five is stronger *not* because their pain sums up into a heap, but because there are five distinct voices lodging the same valid complaint. To ignore them is to fail to justify your action to more people. This leads to a **Weighted Lottery**: You don't have to save the five deterministically, but you must weight the probability in their favor.

  **3. The Iteration Argument (The Killer)**
  This is the argument that usually breaks Taurek. Imagine you are a doctor in a war zone. Over a year, you face the 1-vs-5 choice 100 times.
  *   **Aggregation Policy:** You save the five every time. Total saved: 500. Total dead: 100.
  *   **Taurek Policy (Coin Flip per case):** You save the five 50 times (250 saved) and the one 50 times (50 saved). Total saved: 300. Total dead: 200.

  By adhering to Taurek's principle of "equal concern," you have allowed 100 *extra* people to die. When the 100 extra dead people (who would have lived under aggregation) ask, "Why did you let us die?", the Taurekian agent has no answer other than "I was trying to be fair to the people in the other group."
  This reveals a paradox: Taurek's devotion to respecting the individual *ex-ante* leads to a massive violation of respect for individuals *ex-post*.

  ### III. The Verdict: Aggregation is Obligatory

  Here is the ruling: **Taurek is wrong. The numbers count. You are obligated to save the five.**

  However, I will not defend this with crude utilitarianism. I will not invoke a "social utility monster." I will defend aggregation on grounds that respect the separateness of persons, using a synthesis of Parfit's realism and the LessWrong insight of *ex-ante* rationality.

  **1. The Impartial Standpoint is Real**
  Taurek's error is assuming that because loss is experienced individually, moral *choice* must be indexed individually. This conflates the *phenomenology* of suffering with the *architecture* of decision-making.
  Morality requires an impartial standpoint. When you stand in the moral position, you are not Person A or Person B; you are the Agent. From the Agent's perspective, there *is* a fact of the matter about the state of the world. A world where five people die is objectively worse than a world where one person dies, not because a "super-observer" feels more pain, but because **five distinct projects, futures, and subjective experiences are extinguished instead of one.**
  To deny this is to deny the reality of the other five subjects. If I refuse to acknowledge that 5 deaths > 1 death, I am effectively saying the existence of the other four is morally invisible to me.

  **2. The Veil of Ignorance Test**
  Ask yourself: If you were one of the six people, but you did not know *which* one (Rawls' Veil of Ignorance), what rule would you demand the agent follow?
  You would demand they save the five. Your probability of survival is 5/6 under aggregation, and only 1/2 (or 1/6) under Taurek's coin toss.
  Taurek argues that we cannot aggregate because we are distinct. But rational choice theory shows that distinct individuals, reasoning behind a veil of ignorance, *will* aggregate risks to maximize expected survival. To refuse aggregation is to insist on a rule that everyone, including the potential victims, would reject if they were reasoning rationally about their own survival chances.

  **3. "Leaving Lives on the Table" is a Violation of Duty**
  This is the LW-compatible core of the argument. Taurek claims that saving the five subordinates the one. I argue the opposite: **Refusing to save the five subordinates the five to the one.**
  By giving the single person a 50% chance (via coin toss) at the expense of the five, you are privileging the claim of the one over the claims of the five. You are saying, "The single person's claim is strong enough to veto the survival of four other people."
  There is no symmetry here. The cost to the agent is constant (the drug is used either way). The only variable is the outcome. In a context of rescue where the agent pays no extra cost, the duty to aid is proportional to the number of claimants. To do otherwise is to treat the four "extra" people as if their claims do not exist.

  **4. Addressing the "Complaint"**
  What about the one person who dies? Can they complain?
  Yes. They have been wronged by fate, but not by the agent. The agent can look the survivor (or the kin) in the eye and say: *"I could not save everyone. I had to choose between your death and the deaths of five others. To choose your survival would have been to condemn five people to death to save one. I could not justify sacrificing five to save one."*
  This is a complete justification. It acknowledges the tragedy without accepting the Taurekian premise that the five deaths are incommensurable with the one.

  ### Conclusion: The Burden of Numbers

  Taurek's paper is a necessary vaccine. It protects us from becoming cold calculators who view people as mere buckets of utility. It reminds us that aggregation is a tool, not a metaphysical truth.

  But a vaccine is not a diet. If you live on Taurek's logic, you starve.

  The "Shut Up and Multiply" heuristic holds. In rescue cases with constant cost to the agent, **the numbers count.** To deny this is not to elevate the individual; it is to blind yourself to the reality that there are *more* individuals on one side of the scale than the other. The separateness of persons does not prevent us from counting them; it demands that we count every single one of them.

  **Verdict:** Save the five. Flip the coin only when the numbers are equal. Anything else is a failure of moral arithmetic.
