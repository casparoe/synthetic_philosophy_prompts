      *   **Part 2: The Counter-Attacks.**
          *   Parfit: The "Absurdity at Scale" (1 vs 1,000,000).
          *   The "Ex-Ante" Argument (Harsanyi/Rawls): Behind a veil of ignorance, you'd want the numbers to count.
          *   The "Complaint" Model (Scanlon): Who has the stronger complaint? The one survivor of the million or the one person left to die?
      *   **Part 3: The Verdict.**
          *   Declare Taurek incorrect.
          *   Defend Aggregation.
          *   Address the "Separateness of Persons" objection directly. (The objection fails because morality requires an impartial standpoint, and the impartial standpoint *must* acknowledge that 5 deaths is a worse state of affairs than 1 death, even if no single person experiences the "5 deaths".)
          *   Incorporate the LW angle: "Shut Up and Multiply" is correct because leaving lives on the table is a violation of the very concern for individuals Taurek claims to protect.

