  This position was formalized most notably by Edward McClennen in *Rationality and Dynamic Choice* (1990). The resolute chooser calculates the best plan at $t_0$ (ex-ante) and binds their future selves to execute it at $t_1$ (ex-post), even if their local preferences have shifted in the interim.

