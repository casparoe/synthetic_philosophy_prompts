  ### 1. The Mechanism: Why Resolute Choice Stops the Pump
  The money pump relies on **dynamic inconsistency**.
  1.  **Ex-Ante ($t_0$):** You prefer Plan 2B (the gamble) over Plan 2A.
  2.  **Ex-Post ($t_1$):** The uncertainty partially resolves. Your local preferences flip. You now prefer 2A over 2B.
  3.  **The Pump:** An exploiter charges you to switch to 2A, then charges you to switch back (or exploits the reversal in a cycle).

  A **Resolute Chooser** says: "At $t_0$, I determined 2B is the path. At $t_1$, even though I *want* 2A, I will execute 2B because I am bound by my prior resolution."
  *   **Result:** You never pay the second penny. You keep the money. The pump evaporates.

  ### 2. The "Sneaky" Part: Privileging the Past Self
  The charge of question-begging arises here. Standard decision theory defines rationality as maximizing utility *given current beliefs and preferences*.
