  Yudkowsky's concept of **Reflective Consistency** is the specific counter to Resolute Choice. In the Sequences, the goal isn't just to avoid losing money; it's to build an agent that *wants* to be the kind of agent that doesn't lose money.

  A Resolute Chooser is **reflectively inconsistent**.
  *   **$t_0$ Self:** Wants $t_1$ Self to choose 2B.
  *   **$t_1$ Self:** Wants to choose 2A.

  If you are resolute, you are forcing $t_1$ You to do something $t_1$ You hates. Yudkowsky would argue that a truly rational agent should undergo **preference updating** such that $t_1$ You *endorses* the choice of $t_0$ You.
  *   **The Patch vs. The Fix:** Resolute choice is a patch (Ulysses tying himself to the mast). Expected Utility Theory is the fix (Ulysses not wanting to steer toward the Sirens in the first place).
  *   **Computational Cost:** Resolute choice requires cognitive work/willpower to suppress local preferences. If rationality is about efficient goal achievement, an agent that has to fight itself is less efficient than an agent whose preferences are coherent to begin with.

  ### 4. The "Plan-Based" Utility Defense (and its flaw)
  Proponents of Resolute Choice argue that utility should be defined over **plans**, not just outcomes.
