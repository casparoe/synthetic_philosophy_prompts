  You are right that Resolute Choice evaporates the *dynamic* money pump. However, it does so by:
  1.  **Admitting Dynamic Inconsistency:** It concedes that your preferences *are* inconsistent over time, which is the core charge of irrationality.
  2.  **Adding a Meta-Constraint:** It relies on a normative claim that "past plans bind future actions" which is not derived from the preferences themselves but imposed upon them.
  3.  **Failing to Fix Static Dominance:** It doesn't solve the fact that Allais preferences violate the Sure Thing Principle in static frames.

  Yudkowsky's rebuttal ultimately rests on **Reflective Consistency**: A truly rational agent shouldn't *need* to bind itself. It should want to be the agent that doesn't get pumped. Resolute choice is the decision-theoretic equivalent of putting a lock on your fridge to stop yourself from diet-breaking. It works, but it admits you have a problem with hunger (preferences) that the lock doesn't cure.

