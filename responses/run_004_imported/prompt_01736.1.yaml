  To justify this, the Resolute Chooser must assert a **meta-preference**: *"I prefer to satisfy my past self's plan more than I prefer to satisfy my current self's desire."*

  This is where the sneakiness lies. It doesn't resolve the inconsistency in the *object-level* preferences (the Allais paradox itself). It just imposes a hierarchy of temporal authority.
  *   **If the ex-ante view is the "true" one:** Then the ex-post preferences are essentially errors. If they are errors, why do you have them? A truly rational agent should align their ex-post preferences with their ex-ante plan (i.e., fix the Allais violation so you *want* to stick to the plan).
  *   **If the ex-post preferences are valid:** Then ignoring them is irrational self-tyranny. Why should $t_0$-you rule over $t_1$-you?

