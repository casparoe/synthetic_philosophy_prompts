answer: |-
  You have put your finger on exactly the right nerve. This is one of the most sophisticated objections to the standard money-pump argument, and it lands squarely in the middle of a debate that has been raging in decision theory since the 1990s (most notably associated with Edward McClennen's *Rationality and Dynamic Choice*).

  Your intuition is correct: **Yes, resolute choice stops the money pump.** If you commit at $t_0$ to a strategy and bind your future selves to it regardless of how their local preferences shift at $t_1$, no one can pump you.

  However, whether this is a "legit way out" or "question-begging" depends on what you think rationality *is*. Here is the breakdown of why resolute choice is controversial, why Yudkowsky (and orthodox Bayesians) would still find it wanting, and where the "sneakiness" you suspect actually hides.

  ### 1. The Mechanism: Naive vs. Sophisticated vs. Resolute
  To understand the objection, we have to distinguish three types of agents facing dynamic inconsistency:
  *   **Naive:** Believes their future self will share their current preferences. Gets money-pumped because they plan to stick to 2B, but when the node arrives, they switch to 2A.
  *   **Sophisticated:** Knows their future self will defect. They engage in backward induction, realize they will defect, and thus choose 2A at the start to avoid the switch cost. They avoid the pump, but only by sacrificing their ex-ante preferred option (2B).
  *   **Resolute:** Commits at the start to 2B and *forces* their future self to execute it, ignoring the local preference shift at the node.

  You are arguing that the Resolute chooser keeps the Allais preferences (1A > 1B and 2B > 2A) *and* avoids the pump. On the surface, this looks like a win.

  ### 2. The "Sneaky" Part: Privileging the Past Self
  The charge of question-begging comes from asking: **Why does the $t_0$ self get to dictate terms to the $t_1$ self?**

  Standard decision theory defines rationality as maximizing utility *given current beliefs and preferences*. At $t_1$, after the uncertainty resolves (or partially resolves), the Resolute agent *prefers* to switch. By refusing to switch, they are actively acting against their current utility function.

  To justify this, the Resolute chooser must assert a **meta-preference**: "I prefer to satisfy my past self's plan more than I prefer to satisfy my current self's desire."

  This is where the sneakiness lies. It doesn't actually resolve the inconsistency in the *object-level* preferences (the Allais paradox itself). It just imposes a hierarchy of temporal authority. It admits that the agent is dynamically inconsistent but asserts that the *ex-ante* view is the "true" one.
  *   **If the ex-ante view is the true one:** Then the ex-post preferences are essentially errors. If they are errors, why do you have them? A truly rational agent should align their ex-post preferences with their ex-ante plan (i.e., fix the Allais violation).
  *   **If the ex-post preferences are valid:** Then ignoring them is irrational self-tyranny. Why should $t_0$-you rule over $t_1$-you?

  ### 3. Yudkowsky's Likely Rebuttal: Reflective Consistency
  Yudkowsky's concept of **Reflective Consistency** is the specific counter to Resolute Choice.

  In the Sequences, the goal isn't just to avoid losing money; it's to build an agent that *wants* to be the kind of agent that doesn't lose money. A Resolute Chooser is an agent that *knows* it will want to defect later, and binds itself. This is a "Ulysses Pact."

  Yudkowsky would argue:
  1.  **Cost of Computation/Willpower:** Resolute choice requires cognitive work to suppress local preferences. If rationality is about efficient goal achievement, an agent that has to fight itself is less efficient than an agent whose preferences are coherent to begin with.
  2.  **The "Why" of the Preference:** The Allais paradox usually stems from a "certainty effect" (valuing 100% probability disproportionately). Yudkowsky would argue this is a cognitive bug, not a feature. Resolute choice patches the bug's output (the decision) without fixing the bug's code (the utility function).
  3.  **Vulnerability to Pre-Pump Exploitation:** If I know you are a Resolute Chooser with Allais preferences, I can still exploit you *before* the game starts. I can offer you a contract at $t_{-1}$ that you will reject because of your Allais preferences, which leads to a dominated outcome compared to an EUT agent. Resolute choice protects you *during* the dynamic process, but it doesn't fix the fact that your preference ordering over static gambles is dominated.

  ### 4. The "Plan-Based" Utility Function Defense
  Proponents of Resolute Choice (like McClennen) argue that we should view utility as defined over **plans**, not just outcomes.
  *   If my utility function is $U(\text{plan})$, and I prefer the plan "Commit to 2B" over "Commit to 2A", then sticking to 2B *is* maximizing my current utility (which includes the value of keeping my plan).

  **The Counter:** This effectively dissolves the Allais Paradox by changing the definition of the game. If you value "keeping your plan" as a terminal good, you no longer have Allais preferences over *money outcomes*; you have standard preferences over *money + integrity of plan*.
  But the Allais Paradox is interesting precisely because people claim they prefer the money outcomes that way, not because they care about plan-integrity. If you introduce plan-integrity as a variable, you are smuggling in a consistency constraint—the very thing Allais wanted to reject.

  ### 5. Is it Question-Begging?
  Yes, in a specific sense. It begs the question of **temporal neutrality**.

  To say Resolute Choice is rational is to assume that rationality requires an agent to act as a single, temporally extended entity rather than a sequence of temporal slices.
  *   **Allais's View:** Rationality is about how you feel *now*. If the certainty is gone, the certainty bonus is gone. It is rational to change your mind when the context changes.
  *   **Yudkowsky/EUT View:** Rationality is about winning. If changing your mind makes you lose money (via money pump), your context-sensitivity is flawed.

  Resolute Choice tries to have it both ways: "I want context-sensitive preferences (Allais), but I also want to win (no pump)." It achieves this by adding a **constraint** (commitment) rather than fixing the **objective** (preferences).

  ### Conclusion
  You are right that Resolute Choice evaporates the *dynamic* money pump. However, it does so by:
  1.  **Admitting Dynamic Inconsistency:** It concedes that your preferences *are* inconsistent over time, which is the core charge of irrationality.
  2.  **Adding a Meta-Constraint:** It relies on a normative claim that "past plans bind future actions" which is not derived from the preferences themselves but imposed upon them.
  3.  **Failing to Fix Static Dominance:** It doesn't solve the fact that Allais preferences violate the Sure Thing Principle in static frames, which implies you are paying for information you don't use or ignoring logical implications of your choices.

  Yudkowsky's rebuttal ultimately rests on **Reflective Consistency**: A truly rational agent shouldn't *need* to bind itself. It should want to be the agent that doesn't get pumped. Resolute choice is the decision-theoretic equivalent of putting a lock on your fridge to stop yourself from diet-breaking. It works, but it admits you have a problem with hunger (preferences) that the lock doesn't cure.

  So, is it a legit way out? **Pragmatically, yes.** You won't lose money.
  **Philosophically/Normatively, no.** It treats the symptom (dynamic inconsistency) while leaving the disease (violation of Independence) untreated, and it requires a controversial metaphysical stance on the authority of past selves to do so.

  The "sneakiness" is that it claims to vindicate Allais preferences, but it only vindicates them by forcing them to behave *as if* they were Expected Utility preferences via brute-force commitment. If you have to act *as if* you are an EUT maximizer to survive, why not just be one?

