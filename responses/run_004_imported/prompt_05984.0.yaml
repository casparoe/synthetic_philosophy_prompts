          *   *Philosophical Fact Check:* In Abhidharma (and early Buddhism generally), *consciousness* (vijnana) is *also* momentary. It is *not* a continuous thread. The continuity is causal, not substantial. No aggregate persists. The flame simile is used correctly to illustrate causal continuity *without* identity, but her explanation that consciousness "threads continuously" contradicts the doctrine of momentariness (*ksanika*) she just described. It sounds like she's describing a *alayavijnana* (storehouse consciousness) from Yogacara, or potentially misinterpreting the causal stream as a "strand" of consciousness itself persisting. The prompt asks how momentary states preserve continuity *without* a persisting self. Saying consciousness "threads continuously" risks reifying consciousness into a self-like entity, which is exactly what *anatta* denies. The continuity is in the *causal chain*, not in a specific aggregate enduring.
