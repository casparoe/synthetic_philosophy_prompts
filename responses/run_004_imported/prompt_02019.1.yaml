answer: |-
  This is one of the classic cruxes in the *NE*, and your frustration is shared by basically everyone who teaches this text. You are not missing something obvious; you are staring at the exact point where Aristotle is walking a tightrope between saving the *phainomena* (that akrasia exists) and respecting Socrates' intellectualist insight (that knowledge dictates action).

  Here is a way to resolve the "inconsistency" and integrate the sleep/drunkenness analogy that might help you frame it for your class.

  ### 1. The "Concession" to Socrates: Is it an Inconsistency?

  It looks like a surrender, but it is actually a **delimitation**. Aristotle is not conceding that Socrates was right about human behavior; he is conceding that Socrates was right about the *logic of action*, provided we define "knowledge" strictly.

  Here is the distinction that saves Aristotle from inconsistency:

  *   **Socrates' Claim:** You cannot act against *knowledge*.
  *   **Aristotle's Counter:** You cannot act against *fully activated, particularized* knowledge.
  *   **The Phenomenon:** The akratic *does* act against their *universal* knowledge (e.g., "Sweet things are bad for me").

  So, when Aristotle ends by saying incontinence arises not in the presence of "knowledge proper" (*kyrios epistēmē*) but "perceptual knowledge," he is making a technical point about the **minor premise** of the practical syllogism.

  *   **Knowledge Proper:** This implies the universal principle *plus* the active recognition of the particular instance. It is the conclusion of the syllogism in action.
  *   **Perceptual Knowledge:** This is the grasp of the minor premise ("This is sweet").

  **The Resolution:** Aristotle is saying: "Socrates, you are right that no one acts while fully grasping the good *in this specific moment*. But you are wrong to think the akratic possesses that grasp. They possess the universal rule (which makes them responsible), but passion knocks out the particular perception (which explains the action)."

  He preserves the common-sense verdict (the akratic knows it's wrong generally) while granting Socrates the psychological mechanism (you can't do what you are actively perceiving as bad *right now*). The "inconsistency" dissolves if you view the final sentence not as "Socrates wins," but as "Socrates wins on the definition of *energeia* (activity), but loses on the definition of *hexis* (state)." The akratic has the *hexis* of knowledge (they are not ignorant) but lacks the *energeia* of knowledge (they are not attending).

  ### 2. The Sleep/Madness/Drunkenness Analogy: Illustration or Mechanism?

  To your second question: **It is not just a vivid illustration; it is the physiological/psychological mechanism that explains the logical failure.**

  If you treat them as "two accounts stapled together" (the syllogistic account vs. the physiological account), you end up with the inconsistency you're worried about. Instead, view them as **two descriptions of the same event.**

  *   **The Logical Description:** The agent fails to apply the minor premise.
  *   **The Psychological Description:** The agent is in a state analogous to drunkenness.

  Why does this matter? Because the minor premise in a practical syllogism is **perceptual**. It is not "2+2=4"; it is "This thing here is a donut." Perception is bodily. Passion (*pathos*) is bodily.

  Aristotle uses the sleep/drunkenness analogy to show that passion physically alters the condition of the knower.
  *   When you are drunk, you might recite Empedocles (you have the *hexis*), but you don't understand the meaning (you lack the *energeia*).
  *   When you are akratic, you can recite the moral principle ("Don't eat sugar"), but the passion distorts the perception of the object ("This isn't 'sugar' right now, it's 'comfort'").

  So the analogy contributes the **causal link**. It explains *how* the particular premise gets suppressed. It isn't just "forgotten"; it is suppressed by a somatic state that temporarily degrades the faculty of perception. This is why Aristotle insists the akratic is like a drunk person: their cognitive hardware is temporarily compromised, even if the software (the universal principles) is intact.

  ### 3. Synthesizing for the Classroom

  If I were teaching this this week, I would frame it as Aristotle **splitting the difference** to save moral responsibility.

  1.  **If Aristotle agrees fully with Socrates:** Akrasia doesn't exist. It's just ignorance. (But then we can't blame the agent, because you don't blame ignorance in the same way).
  2.  **If Aristotle agrees fully with Common Sense:** The agent knows everything fully and does the bad thing anyway. (But this makes the human soul fragmented and irrational in a way Aristotle hates; it makes action unintelligible).
  3.  **Aristotle's Middle Path:** The agent knows the *rule* (preserving responsibility/blame) but loses the *vision* of the instance due to passion (preserving the intelligibility of action).

  **The "Wrinkle" Resolution:**
  The last sentence isn't a surrender. It's a clarification of **what drives the feet.**
  *   The Universal moves the deliberation.
  *   The Particular moves the feet.
  *   Passion blocks the Particular.
  *   Therefore, the feet move against the Universal, but not against the *active perception of the Good*.

  Socrates said: "You can't act against knowledge."
  Aristotle says: "Correct. That's why the akratic, in the moment of action, doesn't have 'knowledge proper' (active perception). But they aren't innocent, because they *should* have maintained that active perception, and they possess the universal rule that tells them they shouldn't."

  ### A Teaching Analogy (The "Texting While Driving" Case)
  Sometimes the "dry food" example is too abstract. Try this:

  *   **Universal:** "Texting while driving kills people." (The driver knows this. They have the *hexis*.)
  *   **Particular:** "I am driving right now." + "This notification is a text."
  *   **Passion:** The urge to see who messaged.

  When the phone buzzes, the passion creates a "drunkenness." They still "know" texting is bad (they could recite the law), but in that moment, the particular premise ("I am operating a lethal vehicle") recedes from active use. They act against the Universal, but not against the *active perception* of the danger (which is clouded).

  If they crash, we blame them (they had the Universal), but we understand the psychology (the Particular was obscured by passion/state).

  ### Summary for your lecture
  1.  **Is it inconsistent?** No. It distinguishes between *having* knowledge (universal/habitual) and *using* knowledge (particular/active). Socrates is right about *using*, wrong about *having*.
  2.  **What does the analogy do?** It explains the *cause* of the failure to use. Passion creates a somatic state that inhibits the perceptual faculty required to activate the minor premise.
  3.  **The Payoff:** This allows Aristotle to say akrasia is voluntary (because the universal is held) but also explicable (because the particular is clouded).

  You're essentially teaching the moment where Aristotle invents the distinction between **competence** (having the knowledge) and **performance** (using the knowledge), and locates the failure in performance without denying competence.
