  8.  **Self-Correction during drafting:** I need to be careful not to make Aristotle sound *too* Socratic. He definitely wants to maintain that akrasia is real. The trick is that the "knowledge" lost is the *minor* premise, which is tied to perception. So the agent *does* act against their universal principle, which is what matters for moral responsibility, even if the immediate cognitive trigger was clouded. I need to emphasize that the *universal* remains intact (which is why we blame them), but the *particular* is clouded (which is why they act).

  9.  **Finalizing the "Teaching Tip":** Suggest the "Diet vs. Donut" example. It's classic for a reason. Universal: "Sugar is bad." Particular: "This is sugar." Passion makes the "This is sugar" premise recede or become "This is yummy."

