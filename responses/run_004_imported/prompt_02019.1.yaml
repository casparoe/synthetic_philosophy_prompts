  2.  **Deconstruct the Text (NE VII.3):**
      *   *Context:* Aristotle is saving the *phainomena* (common opinions) that akrasia exists, against Socrates' intellectualist denial.
      *   *The Practical Syllogism:*
          *   Universal: "Dry food is good for every man."
          *   Particular: "I am a man" + "This food is dry."
          *   Conclusion: Action (Eat this food).
      *   *The Failure:* The akratic has the Universal but fails on the Particular (either doesn't have it or doesn't *use* it due to passion).
      *   *The States:* Asleep, mad, drunk. They have knowledge *habitually* (hexis) but not *actively* (energeia).
      *   *The Ending:* "It is not in the presence of what is thought to be knowledge proper... but in that of perceptual knowledge."

  3.  **Address the "Inconsistency" (The Socrates Concession):**
      *   *Initial thought:* Is Aristotle surrendering?
      *   *Deeper look:* Socrates claimed you can't act against *epistēmē* (scientific knowledge/understanding). Aristotle distinguishes levels of cognition.
      *   *Key Distinction:* *Epistēmē* (Universal) vs. *Aisthēsis* (Perceptual/Particular).
      *   *Resolution:* Aristotle is refining Socrates, not surrendering. Socrates is right *if* by "knowledge" you mean fully activated, particularized perception-of-the-good-in-the-moment. But common sense says the akratic *knows* it's bad (universally). Aristotle says: Yes, they know universally, but passion blocks the particular application.
      *   *The "Hand Back":* It looks like a hand-back, but it's actually a *qualification*. Socrates is right about *strict* knowledge (fully active particular), but wrong about *human* knowledge (which involves universals held in habit).
      *   *Scholarly Consensus:* Most commentators (Gosling, Taylor, Burnyeat, etc.) see this as Aristotle preserving the phenomenon of akrasia while granting Socrates a technical point about the *structure* of action. Action requires the particular. If the particular is obscured, the "knowledge" driving action isn't "knowledge proper" (fully active *epistēmē*).
      *   *Pedagogical Angle:* Frame it as "Socrates is right about the psychology of action, wrong about the phenomenology of moral life."

  4.  **Address the Sleep/Madness/Drunkenness Analogy:**
