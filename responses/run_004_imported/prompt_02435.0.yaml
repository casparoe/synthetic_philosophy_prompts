answer: |-
  The green line on the monitor matched the cosmic microwave background data perfectly. It was a fit so precise it felt less like science and more like confession. Elias leaned back in his chair, the leather creaking in the sterile silence of the lab, and exhaled a breath he felt he'd been holding for three years.

  "It's done," he said. "The Eternal Vacua model holds. It explains the acceleration, the inflationary period, everything."

  Mara didn't smile. She was staring at the secondary terminal, her fingers hovering over the keyboard. The server rack hummed behind them, a low, steady thrum that usually sounded like progress. Tonight, it sounded like waiting.

  "Run the observer measure," Elias said, reaching for his cold coffee.

  "I'm running it," Mara said. Her voice was flat.

  The screen scrolled with calculations. They were counting observers. In the Eternal Vacua model, the universe expands forever, reaching a state of maximum entropy. But in an infinite timeframe, quantum fluctuations occasionally assemble particles into complex structures. Sometimes, those structures are brains. Boltzmann Brains. Conscious entities flashing into existence with false memories of a past that never happened, only to dissolve back into the radiation bath a second later.

  In an eternal universe, there is plenty of time for ordinary observers like humans to evolve. But there is infinitely more time for random fluctuations.

  The progress bar finished. A single ratio populated the center of the screen.

  **BB : OO = 10^540 : 1**

  Elias froze, his hand halfway to the mug. "That's a rounding error. Check the integration limits."

  "I checked them twice," Mara said. She turned her chair to face him. The fluorescent lights reflected in her glasses, masking her eyes. "The math is right, Elias. If this theory is true, Boltzmann Brains vastly outnumber ordinary observers. For every person who evolved biologically, there are ten to the five-hundred-and-forty hallucinations floating in the void."

  "So?" Elias said, though the word felt thin.

  "So, typicality," Mara said. "If we assume we are typical observers within the framework of this theory, we must conclude we are Boltzmann Brains. The probability that we are real, evolved humans is effectively zero."

  Elias laughed, a short, sharp sound. "Okay. But look at the data. Look at the fit." He pointed at the green line. "We derived this theory from observation. We measured the CMB. We logged the data. We didn't just fluctuate into existence holding a printout."

  "Didn't we?" Mara asked.

  The hum of the servers seemed to grow louder, pressing against Elias's temples. "If we were fluctuations, our memories would be false. But I remember the grant proposal. I remember the coffee tasting bitter this morning. I remember you arguing about the priors last week."

  "A Boltzmann Brain remembers all of that," Mara said softly. "It remembers a life. It remembers a lab. It remembers deriving a theory. That's the point. The fluctuation includes the memory of the derivation."

  Elias stood up. The room felt slightly unmoored, as if the floor might tilt if he shifted his weight too quickly. "Then the theory is self-undermining. If the theory is true, we can't trust the reasoning that led us to accept the theory."

  "Exactly," Mara said. "It's cognitive instability. The theory predicts that any evidence supporting it is likely a hallucination. It eats its own tail."

  "Then we discard it," Elias said. He walked to the whiteboard, marker in hand. He capped it, uncapped it. "We tweak the measure. We change the weighting."

  "We tried that," Mara said. "Every measure that allows for eternal inflation gives us this ratio. To fix it, we have to break the physics. We have to make the universe end sooner, or behave differently. But then the green line doesn't fit the data anymore."

  Elias looked at the whiteboard, covered in the elegant symmetry of their work. It was beautiful. It was true. It was impossible.

  If he accepted the model, he had to admit he was likely a momentary spark in the dark, currently hallucinating the whiteboard. But if he was hallucinating, the model might be false. If the model was false, he might be real. But if he was real, the model—which fit the data perfectly—must be rejected despite the evidence.

  He looked at his coffee mug. For a second, just a fraction of a second, he couldn't remember putting it there. Had it always been there? Or had it fluctuated into existence along with the memory of pouring it?

  "We can't publish this," Elias said.

  "If we don't, someone else will," Mara said. "The data is public. The math is public."

  "If we publish, we're telling the world that logic is broken."

  "We're telling them that this specific logic breaks itself."

  Elias capped the marker. The click sounded final. He looked around the lab, really looked at it. The dust motes dancing in the light. The blinking LEDs on the server. The texture of the carpet. It all felt incredibly solid, aggressively real. And yet, the equation on the screen whispered that solidity was a statistical impossibility.

  The vertigo wasn't nausea; it was a lack of traction. He was trying to stand on ground that his own feet were proving was an illusion. He couldn't step forward, because the path was fake. He couldn't step back, because the past was suspect.

  "Turn off the monitor," Elias said.

  Mara hesitated, then hit the power button. The green line collapsed into a single white dot, then vanished. The screen went black.

  The room was dark, save for the emergency lights. The servers kept humming.

  "Now what?" Mara asked.

  "Now we sit," Elias said. He sat back down in his chair. He didn't touch the coffee. He just stared at the blank screen, waiting to see if it would dissolve, waiting to see if he would, knowing that even if he did, he'd never know the difference.
