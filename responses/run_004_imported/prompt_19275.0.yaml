  **Part (a): 6 / 8 points**
  You have a strong intuitive grasp of the relationship, specifically regarding the hierarchical flow of prediction errors. However, the claim that minimizing free energy and minimizing prediction error are "mathematically equivalent" is too strong without qualification. Variational Free Energy (VFE) decomposes into **Accuracy** (related to prediction error) and **Complexity** (KL divergence between posterior and prior). They are only equivalent if the complexity term is constant or ignored. In a grad-level context, you need to acknowledge that VFE minimization trades off accuracy against model complexity, whereas raw prediction error minimization does not.

  **Part (b): 7 / 7 points**
  This is an excellent answer. You correctly identify the core of the objection (minimizing surprise leads to low-entropy states) and the specific active inference solution (minimizing *Expected* Free Energy over policies). Crucially, you correctly identify the **epistemic value** term as the mathematical driver for exploration, noting that a dark room offers no information gain. This demonstrates a solid command of the active inference resolution to the problem.

  **Part (c): 3 / 5 points**
  You correctly identify **precision-weighting** as the computational mechanism involved in psychosis, which is the most important part of the answer. However, the directionality you describe is contentious. The dominant "aberrant salience" account (e.g., Kapur, Friston) typically posits **excessively high** precision on prediction errors during the *formation* of positive symptoms (making irrelevant stimuli seem significant), or excessively high precision on priors for hallucinations. Your description (low precision on PEs) better explains the *maintenance* of rigid delusions (failure to update), but contradicts the standard account for how the symptoms are generated in the first place.

