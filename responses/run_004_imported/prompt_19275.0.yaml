          *   *Critique:* This is a common simplification but technically imprecise at a grad level. VFE = Accuracy - Complexity. Accuracy is related to PE. If you only minimize PE, you might overfit. VFE minimization balances accuracy (PE) and complexity. Also, VFE is an *upper bound* on surprise, not surprise itself. The student says "free energy is basically a measure of the surprise... (or an upper bound on it)". That's okay. But claiming mathematical equivalence without mentioning the complexity term/KL divergence is a significant omission for a grad seminar.
