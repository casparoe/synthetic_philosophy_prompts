      *   **Lewis's Defense 1: Qualitative vs. Quantitative Parsimony.** Explain the distinction. MR adds quantity, not quality. Ersatzism adds quality (abstracta).
      *   **Lewis's Defense 2: Explanatory Power.** MR does *more* than just truth conditions. It handles probability, properties, content, etc., without circularity.
      *   **Lewis's Defense 3: The Circularity Charge.** Ersatzists often rely on modal notions (consistency, compossibility) to define worlds, whereas Lewis defines worlds non-modally.
      *   **Context for the Prelim:** How to frame this in an exam. Don't just say "Lewis is wrong." Show you understand the trade-off.
