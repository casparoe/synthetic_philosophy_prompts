answer: |-
  This is the exact right question to be asking. In fact, if you walk into your prelim and say, "Lewis violates Occam's Razor," without addressing his specific response to that objection, you'll likely get dinged. The "Incredulous Stare" (Lewis's name for the reaction you're having) is the starting point of the debate, not the end of it.

  The "missing piece" isn't that parsimony doesn't matter; it's that Lewis argues **Modal Realism (MR) is actually more parsimonious in the relevant sense**, and that ersatzism fails to match the **explanatory payoff** because it smuggles modality back in.

  Here is the breakdown of why MR is still treated as a live option, structured for how you should handle it in a prelim.

  ### 1. Qualitative vs. Quantitative Parsimony
  This is Lewis's direct counter to the Occam's Razor objection. He distinguishes between two kinds of parsimony:
  *   **Quantitative Parsimony:** Positing fewer *tokens* (fewer individual things).
  *   **Qualitative Parsimony:** Positing fewer *types* or *kinds* of things.

  Lewis concedes MR loses on **quantitative** parsimony. Yes, he posits an infinity of concrete worlds. That is a massive ontological cost.

  However, he argues MR wins on **qualitative** parsimony.
  *   **Lewis's Ontology:** Just concrete particulars arranged in spacetime. We already believe *this* world exists. Lewis just says other worlds are more of the same kind. He doesn't need new categories of being.
  *   **Ersatzist Ontology:** To make worlds "abstract," the ersatzist must posit a new category of entity: abstract representations, maximal consistent sets of propositions, or properties.

  **The Argument:** Science routinely sacrifices quantitative parsimony for qualitative parsimony (e.g., positing billions of electrons rather than one magical electron that zips around really fast). Lewis argues we should do the same in metaphysics. It is theoretically cleaner to have one kind of thing (concrete stuff) in infinite quantity than to have two kinds of things (concrete stuff + mysterious abstract representers).

  ### 2. The Circularity / Reductionism Charge
  You mentioned that ersatzism seems to buy the "same explanatory payoff." Lewis's core claim is that **it does not.**

  Lewis is a reductionist about modality. He wants to analyze modal truths (what is possible/necessary) in terms of non-modal truths (spatiotemporal relations between concrete objects).
  *   **Lewis:** "Possibly P" is true iff there exists a concrete world $w$ and a part $x$ in $w$ such that $P(x)$. No modal notions in the analysans.
  *   **Ersatzist:** "Possibly P" is true iff there is a maximal consistent set of propositions that includes P.

  **The Trap:** How does the ersatzist define "consistent"?
  Usually, consistency is defined modally (e.g., "a set of propositions that *could* all be true together"). If you define consistency using "could," you have analyzed modality in terms of modality. You haven't reduced it; you've just pushed it back a step.

  Lewis argues that only concrete worlds can ground modal truth without circularity. Abstract worlds are just descriptions, and descriptions only represent possibilities if we already understand what is possible. For Lewis, concrete worlds *are* the possibilities; they don't *represent* them.

  ### 3. The Problem of "Aliens"
  This is a specific technical hurdle for ersatzists that keeps MR alive.
  *   **The Issue:** Can there be properties that are not instantiated in the actual world? (e.g., a fundamental particle charge that doesn't actually exist, or a shade of blue no one has ever seen).
  *   **Lewis:** Yes. There are concrete beings in other worlds instantiating those alien properties.
  *   **Ersatzist:** If worlds are constructed out of actual language, concepts, or properties we actually possess, how do we construct a world containing a property we cannot conceive of or denote?

  If the ersatzist says, "We can construct a world with an alien property," Lewis asks: "What is that property made of?" If it's made of actual abstracta, it's not truly alien. If it's primitive, the ersatzist is positing a mysterious abstract entity for every possible alien property, which destroys their parsimony advantage.

  ### 4. Theoretical Utility (The "Package Deal")
  Lewis argues that MR isn't just about modal logic; it's a **systematic philosophical toolkit**. In *On the Plurality of Worlds*, he shows how MR solves problems in:
  *   **Content:** What is the content of a belief? (A set of worlds).
  *   **Properties:** What are properties? (Sets of counterparts across worlds).
  *   **Probability:** What does it mean for an event to have a 50% chance? (The proportion of worlds where it occurs).
  *   **Causation:** Counterfactual analysis of causation.

  Lewis's pitch is: "Yes, my ontology is expensive. But look at how many philosophical problems I solve with it. Ersatzism is cheaper ontologically but bankrupt theoretically."

  ### How to Handle This in the Prelim
  You don't have to *believe* Lewis to pass. You just have to show you understand the dialectic.

  1.  **State the Objection Clearly:** "The primary objection to Lewis is ontological extravagance violating Occam's Razor."
  2.  **State Lewis's Defense:** "Lewis responds by distinguishing qualitative vs. quantitative parsimony, arguing that positing more of the same kind (concrete worlds) is preferable to positing new kinds (abstract representations)."
  3.  **The Crux:** "Furthermore, Lewis argues ersatzism fails to provide a non-circular reduction of modality, whereas MR grounds modal truth in non-modal spatiotemporal relations."
  4.  **Your Evaluation:** You can then say, "While Lewis's distinction is clever, many find the quantitative cost too high regardless of qualitative unity, especially given the causal isolation of worlds makes them empirically inaccessible." (This shows you can critique him without missing the point).

  ### Recommended Quick Prep
  *   **Read:** *On the Plurality of Worlds*, Chapter 1 (specifically the section "Paradox of Parsimony").
  *   **Read:** Gideon Rosen, "Modal Fictionalism" (for the best articulation of the rival view).
  *   **Keyword to drop:** "The Incredulous Stare." (It shows you know the literature).

  **Summary:** The piece you're missing is that Lewis doesn't deny the cost; he argues the cost is worth it for the theoretical gain, and that the "cheaper" alternatives are either circular or qualitatively bloated. It's a trade-off of theoretical virtues, not a simple slam-dunk on ontology.
