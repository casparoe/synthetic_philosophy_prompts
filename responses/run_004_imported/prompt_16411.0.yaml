  1.  **Analyze the User's Query:**
      *   **Background:** Phil of language specialist, needs to pass a metaphysics prelim.
      *   **Topic:** David Lewis's Modal Realism (MR).
      *   **Objection:** Occam's Razor (Parsimony). Why posit infinite concrete worlds when ersatzism (abstract worlds/fictionalism) seems to do the same job with less ontological cost?
      *   **Observation:** Intro texts treat MR as respectable, not obviously refuted by parsimony.
      *   **Goal:** Identify the "missing piece" – why is MR still taken seriously despite the parsimony objection?

  2.  **Initial Assessment & Validation:**
      *   The user's intuition is the *standard* objection to Lewis. It's not a "dumb" question; it's the *central* debate.
      *   The user is missing Lewis's specific response to the parsimony objection and the theoretical benefits he claims MR offers over ersatzism.
      *   Tone needs to be respectful, academically rigorous (since it's for a prelim), but conversational ("gut check").

  3.  **Deconstruct the Parsimony Objection (Qualitative vs. Quantitative):**
      *   Lewis distinguishes between *qualitative* parsimony (kinds of things) and *quantitative* parsimony (number of things).
      *   Lewis argues MR is qualitatively parsimonious (just more of the same kind of thing: concrete spacetime regions) whereas ersatzism is qualitatively *imparsimonious* (needs a new kind of thing: abstract representations, properties, propositions, etc.).
      *   *Key Point:* Science already posits unobservables (electrons, multiverses in physics). Why is modal realism worse?

  4.  **Identify the "Explanatory Payoff" (The Trade-Off):**
      *   The user claims ersatzism buys the "same explanatory payoff." Lewis (and his defenders) argue it *doesn't*.
      *   **The Problem of Truthmakers:** For a counterfactual "If I dropped this cup, it would break," what makes this true *now*?
          *   Lewis: There is a concrete world where you drop it and it breaks.
          *   Ersatzist: There is a consistent set of propositions... but why *that* set? What grounds the consistency?
      *   **The Problem of Aliens:** Can there be properties instantiated that are not instantiated in our world?
          *   Lewis: Yes, in other worlds.
          *   Ersatzist: Hard to construct abstract representations of truly alien properties without already having modal notions (circularity).
      *   **Reductionism:** Lewis wants to *reduce* modality to non-modal terms (spatiotemporal relations). Ersatzists often sneak modality back into their abstracta (e.g., "consistent" sets of propositions).

  5.  **Address the "Incredulous Stare":**
      *   Acknowledge that the intuition against MR is strong (the "Incredulous Stare").
      *   Explain that Lewis accepts the cost but argues the theoretical benefit outweighs it. It's a cost-benefit analysis, not a knockout punch.

  6.  **Structure the Response:**
