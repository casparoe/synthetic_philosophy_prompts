      *   *Standard Resolution:* In the standard Gibbard/Harper analysis, mixed strategies *do* provide a ratifiable equilibrium. If you commit to a 50/50 mix, Death cannot gain an advantage by being in one city over the other.
      *   *The "Not a Fix" Argument:* If the predictor is truly perfect (causal determinism), a coin flip is just another physical process to be predicted.
