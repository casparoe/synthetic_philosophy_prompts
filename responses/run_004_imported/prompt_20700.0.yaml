          *   The emotional component (Paul sees his dad; Diane sees the medical reality).
      *   *Closing:* Compassionate advice. Encourage unity, suggest talking to the care team.

  5.  **Refining the Tone:**
      *   Avoid being coldly clinical. Use phrases like "incredibly painful," "natural reaction," "grieving process."
      *   Ensure I don't take sides in a way that shames Paul. His view is the "common sense" view, even if medically obsolete.
      *   Make sure the distinction between *brain death* and *coma/vegetative state* is clear, as families often confuse them. (The prompt says "declared brain dead," so I must treat that as a medical fact, not a prognosis).

  6.  **Self-Correction/Safety Check:**
      *   *Did I answer the specific prompt?* Yes, verdict on 1-4 + missing info.
