      *   **The Standard Reply:** Preferences must be transitive to be rational.
      *   **The Resolute Choice Reply (McClennen, etc.):** An agent can adopt a *plan* at $t_0$. At $t_1$, even if local preferences suggest switching, the agent resolutely sticks to the plan because the plan maximizes utility over the whole trajectory.
