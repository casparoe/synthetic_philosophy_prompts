      *   **Proposed Argument:** Since he resolved this *before* co-founding the SPR (1882), his psychical research should be viewed as a separate, personal enthusiasm, distinct from his philosophical system.
      *   **Question:** Is this defensible, or do historians see a stronger connection?

  2.  **Fact-Check the Philosophical Claim:**
