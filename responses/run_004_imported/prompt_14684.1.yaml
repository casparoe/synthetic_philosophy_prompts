      *   *Implication:* If he didn't resolve it in 1874, the timeline argument collapses. The search for evidence of an afterlife (via psychical research) becomes a *means* to potentially resolve the dualism, not a hobby undertaken after the work was done.

  3.  **Analyze the Connection between Sidgwick's Ethics and Psychical Research:**
