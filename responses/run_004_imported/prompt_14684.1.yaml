answer: |-
  This is a crucial point to check before publishing, because the premise of your argument contains a significant philosophical error that would likely be flagged by historians of philosophy and Sidgwick scholars.

  To answer your question directly: **No, it is not defensible to present Sidgwick's psychical research as a separate personal enthusiasm distinct from his philosophical system.** In fact, the prevailing scholarly consensus is almost the exact opposite: Sidgwick's involvement with the Society for Psychical Research (SPR) was deeply motivated by the *unresolved* problems in *The Methods of Ethics*.

  Here is the breakdown of why your proposed argument would not hold up to scrutiny, and how you might reframe it to strengthen your article.

  ### 1. The Philosophical Correction: The Dualism Was Not Resolved
  Your premise states that Sidgwick resolved the "dualism of practical reason" in *The Methods of Ethics* (1874). **He did not.**

  *   **The Problem:** Sidgwick identified a conflict between **Rational Egoism** (it is rational to pursue one's own happiness) and **Rational Benevolence/Utilitarianism** (it is rational to pursue the general good). He could find no purely rational or empirical way to prove that these two always align in this life. Often, doing the right thing results in personal sacrifice.
  *   **The Conclusion of *Methods*:** Sidgwick famously ended the book on a troubled note. He wrote that if the dualism cannot be resolved, ethics faces a "fundamental contradiction." The only way to reconcile self-interest with duty is to postulate a moral order of the universe—specifically, a God who ensures that virtue is rewarded and vice punished in an **afterlife**.
  *   **The Gap:** Sidgwick could not prove the existence of God or the afterlife through traditional philosophy or theology. He needed empirical evidence.

  ### 2. The Connection to the SPR
  Because Sidgwick could not resolve the dualism philosophically, he turned to empirical investigation. This is where the SPR comes in.

  *   **The Motivation:** Sidgwick co-founded the SPR in 1882 specifically to investigate evidence of survival after death (mediumship, telepathy, apparitions) using scientific methods.
  *   **The Philosophical Stakes:** If psychical research could provide empirical proof that consciousness survives death, it would open the door to the possibility of a divine moral order. If a moral order exists, the conflict between egoism and benevolence can be resolved (because ultimate self-interest aligns with ultimate virtue).
  *   **The Unity of Pursuit:** For Sidgwick, psychical research was not a hobby; it was an extension of his ethical project. He was searching for the empirical premises required to complete his ethical system. As the philosopher and Sidgwick biographer **Bart Schultz** has extensively documented, Sidgwick viewed the SPR as a vital endeavor to save ethics from incoherence.

  ### 3. How Historians View the Relationship
  Historians of philosophy (such as Roger Crisp, Bart Schultz, and Trevor Levere) generally argue that Sidgwick's life was a unified project to reconcile rationality, ethics, and faith.

  *   **Not "Separate Spheres":** They do not view his philosophy and his psychical research as distinct compartments. Instead, they view the SPR work as the "applied" search for the metaphysical facts his philosophy required but could not generate on its own.
  *   **The Tragedy of Sidgwick:** The narrative often told is one of tragedy: Sidgwick desperately *wanted* to believe in a moral order to save his ethics, but the evidence gathered by the SPR was never quite conclusive enough for him. He died still troubled by the dualism.

  ### 4. Recommendation for Your Article
  Rather than trying to separate the two pursuits, your article will be much stronger if you highlight the **dependency** between them. This creates a more compelling narrative arc.

  **Suggested Reframing:**
  *   **The Hook:** Present Sidgwick not just as a dry ethicist, but as a philosopher whose system hung in the balance, dependent on the existence of the afterlife.
  *   **The SPR's Role:** Frame the founding of the SPR not as a Victorian fad, but as a serious philosophical attempt to secure the foundations of morality through empirical data.
  *   **The Tension:** Highlight the irony that the man who championed rigorous utilitarian calculation spent decades investigating ghosts and telepathy. Explain that this wasn't hypocrisy or a hobby, but a desperate search for the "missing premise" of his own ethics.

  **Summary:**
  If you argue that Sidgwick had already settled his philosophical account before joining the SPR, reviewers will likely correct you on the status of the "dualism of practical reason." However, if you argue that the SPR was Sidgwick's attempt to solve the one problem he *couldn't* solve in *The Methods of Ethics*, you will align with the current historiography and offer a much richer insight into why the SPR was founded in the first place.
