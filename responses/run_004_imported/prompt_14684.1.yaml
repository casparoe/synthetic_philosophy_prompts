      *   *Sidgwick's Dilemma:* Without empirical evidence of a moral order (afterlife), ethics rests on an unproven assumption. This troubled him deeply ("The Fundamental Problem of Ethics").
      *   *SPR's Mission:* To investigate evidence of survival of death (mediumship, telepathy) scientifically.
      *   *The Link:* If survival of death is proven, it supports the possibility of a moral order, which helps reconcile egoism and benevolence. Therefore, psychical research was *integral* to his philosophical project, not separate from it.
      *   *Scholarly Consensus:* Historians of philosophy (e.g., Bart Schultz, Roger Crisp, Trevor Levere) generally agree that Sidgwick's SPR work was motivated by his ethical dilemma.

  4.  **Formulate the Response:**
