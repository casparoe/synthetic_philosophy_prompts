      *   **Key Assumptions:**
          1.  **Bayesian Rationality:** Both agents update beliefs according to Bayes' rule.
          2.  **Common Priors:** Both start with the exact same prior probability distribution over the state space.
          3.  **Common Knowledge:** It is not enough to *have* the same information; they must have *common knowledge* of each other's posterior beliefs (I know your belief, you know my belief, I know that you know my belief, etc.).
          4.  **Same Interpretation of Information:** The partition of information sets must be well-defined and understood by both.
          5.  **Truthfulness:** Agents must honestly report their beliefs.

  3.  **Evaluate the User's Application to the Roommate Dispute:**
