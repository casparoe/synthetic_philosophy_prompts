prompt: |-
  ok so i'm on my school's Honor Council (6 students + 2 teachers, we decide academic integrity cases and can rewrite the actual policy). current case: a kid used his friend's finished essay as a 'guide,' rewriting almost every sentence in his own words but keeping the exact same structure, examples, and order of the argument. policy only calls it a violation if the wording is 'substantially similar,' so half the council says he's technically fine, which feels wrong since he obviously didn't think it through himself. the other half wants to just ban using someone's paper as a 'guide' period, but thats basically what happens whenever friends study together, so idk where the real line even is. can you write the memo i'll bring to our meeting next week -- need an actual verdict on his case, plus a rewrite of the similarity rule so we're not just picking a random cutoff (like 40% identical wording) and calling it fair, and it has to seriously deal with the argument that any cutoff's gonna be arbitrary for cases right on the edge, not just brush that off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a School Honor Council (6 students + 2 teachers).
      *   **Task:** Write a memo for the next meeting.
      *   **Content:**
          1.  A verdict on the current case (student used a friend's essay as a "guide," rewrote sentences but kept structure/arguments/examples).
          2.  A proposed rewrite of the academic integrity policy (specifically the "substantial similarity" rule).
          3.  Address the philosophical problem: Any cutoff (like 40% wording) is arbitrary, especially for edge cases. The new policy needs to handle this seriously, not brush it off.
      *   **Constraints:** Needs to be persuasive, balanced (acknowledging the "study group" concern), and actionable.
      *   **Tone:** Professional, thoughtful, peer-to-peer but respectful of authority (teachers on council).

  2.  **Deconstruct the Current Case:**
      *   *Action:* Student A used Student B's essay. Rewrote sentences (paraphrased) but kept structure, examples, and argument order.
      *   *Current Policy:* Violation only if wording is "substantially similar."
      *   *Conflict:* Half say it's fine (technically follows policy), half say it's wrong (intellectual theft/lack of original thought).
      *   *My Stance:* It *is* a violation. Keeping the intellectual architecture (structure, examples, flow) without attribution is plagiarism, even if the words change. This is often called "structural plagiarism" or "idea plagiarism."
      *   *Verdict:* Guilty of Academic Dishonesty, but perhaps with a nuanced sanction (educational rather than purely punitive, given the policy ambiguity).

  3.  **Deconstruct the Policy Rewrite:**
      *   *Problem:* "Substantially similar wording" focuses only on *text*, not *thought*.
      *   *Problem:* Arbitrary cutoffs (e.g., Turnitin percentages) don't measure understanding or intellectual ownership.
      *   *Goal:* Shift focus from "word matching" to "intellectual ownership."
      *   *Addressing Arbitrariness:* Acknowledge that line-drawing is hard. The solution isn't a magic number, but a *process* or a *standard of evidence* that looks at the *relationship* between the work and the student's mind.
      *   *The "Study Group" Fear:* We don't want to ban discussing ideas. We need to distinguish between *collaborative brainstorming* (good) and *outsourcing intellectual architecture* (bad).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (Case X verdict + Policy Reform).
      *   **Part 1: The Verdict (Case X):**
          *   Acknowledge the split vote.
          *   Argue why "structural copying" is dishonest. It bypasses the cognitive work the assignment is meant to assess.
          *   Distinguish from study groups (study groups generate *new* ideas together; this was transferring a *finished product*).
          *   Recommendation: Violation found, but sanction mitigated due to policy ambiguity.
      *   **Part 2: Policy Rewrite (The "Substantial Similarity" Clause):**
          *   Draft new language. Move away from "wording" to "intellectual property/structure."
          *   Key concept: "Independent Intellectual Labor."
      *   **Part 3: Addressing the "Arbitrary Line" Problem:**
          *   This is the hardest part. I need to show I understand that *any* rule has edge cases.
          *   Solution: Shift from a *bright-line rule* (e.g., 40% match) to a *totality of circumstances* test.
          *   Acknowledge that ambiguity exists but argue that a broader standard is *more* fair because it captures the spirit, not just the letter.
          *   Include a "Safe Harbor" or "Best Practice" section to help students navigate the gray area (e.g., citation norms for ideas).
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "Guilty" too harsh if the old policy said "wording"?
      *   *Fix:* Frame it as a "Violation of Spirit" but recommend a warning/educational sanction because the *letter* of the old policy was unclear. This bridges the gap between the two halves of the council.
      *   *Critique:* How do I distinguish from study groups?
      *   *Fix:* Use the concept of "pre-existing work." Discussing a prompt is fine. Using a completed draft as a template is not.
      *   *Critique:* How to address the "arbitrary cutoff" complaint seriously?
      *   *Fix:* Don't try to eliminate arbitrariness. Admit it. Argue that *human judgment* on *intellectual ownership* is better than *algorithmic judgment* on *word matching*. The arbitrariness of a percentage is worse than the discretion of a council.

  6.  **Final Polish:**
      *   Ensure tone is collaborative ("I propose," "We should consider").
      *   Check that all constraints of the prompt are met (Verdict, Policy Rewrite, Arbitrariness argument).
      *   Make sure the policy language sounds legalistic but readable.

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Verdict on case? Yes.
      *   Rewrite similarity rule? Yes.
      *   Deal with arbitrariness seriously? Yes.
      *   Address study group concern? Yes.

  *(Self-Correction Note: Make sure the policy rewrite isn't too vague. It needs to give the council teeth.)* -> *Added specific criteria for "Intellectual Architecture."*

  8.  **Final Output Generation** (Proceed to write the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council (Student Members and Faculty Advisors)
  **FROM:** [Your Name], Student Council Member
  **DATE:** October 26, 2023
  **SUBJECT:** Case Determination: [Student ID/Name Redacted] & Proposal for Policy Revision regarding "Substantial Similarity"

  ### I. Purpose
  This memo serves two functions for next week's meeting. First, it outlines my recommended verdict on the current case involving the use of a peer's essay as a structural template. Second, it proposes a rewrite of the Academic Integrity Policy's definition of plagiarism. The current "substantially similar wording" standard is insufficient for assessing modern academic dishonesty, and this proposal aims to replace arbitrary word-count cutoffs with a standard based on **independent intellectual labor.**

  ### II. Case Verdict: [Student ID/Name Redacted]
  **Recommendation:** **Responsibility Found (Academic Dishonesty)**, with a mitigated educational sanction.

  **Rationale:**
  The Council is currently split because the *letter* of the current policy conflicts with the *spirit* of academic integrity.
  1.  **The Defense:** The student did not copy wording. Under the strict definition of "substantially similar wording," he is technically compliant.
  2.  **The Prosecution:** The student copied the **intellectual architecture**. By retaining the exact argument structure, specific examples, and order of logic, he bypassed the cognitive work the assignment was designed to assess.

  **Why this is a violation:**
  Academic assignments assess a student's ability to synthesize information and construct an argument. If Student A provides the blueprint (structure/examples) and Student B simply lays the bricks (rewrites sentences), Student B has not done the intellectual work. This is distinct from collaboration; it is the outsourcing of reasoning.

  **Why a mitigated sanction:**
  Because our current policy explicitly focuses on *wording*, the student had a reasonable basis to believe his actions were permissible. We cannot punish him as severely as we would a copy-paste violator under a clearer policy. I recommend a formal warning and a requirement to complete an academic writing workshop, rather than suspension or a failing grade.

  ### III. Proposed Policy Rewrite
  We must move away from "wording" as the primary metric. Below is a draft revision for the Plagiarism/Unauthorized Collaboration section.

  **Current Text:**
  > *"A violation occurs when submitted work contains wording substantially similar to another source without citation."*

  **Proposed Text:**
  > *"A violation occurs when a student submits work that is not the product of their own independent intellectual labor. This includes, but is not limited to:*
  > *1. **Verbatim Copying:** Using another's wording without quotation or citation.*
  > *2. **Structural Plagiarism:** Adopting the specific organization, logical flow, argumentation structure, or unique examples of another's work (whether published or peer-generated) without explicit permission and citation.*
  > *3. **Idea Appropriation:** Submitting specific insights, theories, or data analysis derived from another person as if they were your own original discoveries."*

  **Permissible Collaboration Clause (To address the "Study Group" concern):**
  > *"Students are encouraged to discuss course concepts and assignment prompts collaboratively. However, once the drafting phase begins, all work must be generated independently. Using a peer's completed draft as a template, outline, or 'guide' constitutes unauthorized collaboration."*

  ### IV. Addressing the "Arbitrary Line" Problem
  A major concern raised during our deliberations is that *any* rule we write will have edge cases. If we ban "structural similarity," how do we distinguish between a standard essay format (Intro-Body-Conclusion) and copying a specific argument flow? If we set a percentage cutoff (e.g., 40% match), we punish students for common phrases.

  **We cannot eliminate arbitrariness, but we can shift it to a fairer location.**

  1.  **The Problem with Quantitative Cutoffs:** A rule like "40% identical wording" is objectively arbitrary. It privileges students who are good at "thesaurus-swapping" over students who do original work. It creates a safe harbor for cheaters who stay just under the line.
  2.  **The Benefit of Qualitative Judgment:** By shifting the standard to **Independent Intellectual Labor**, we acknowledge that the Honor Council is a judicial body, not an algorithm. We are tasked with judging *intent and process*, not just text matching.
  3.  **Handling the Gray Area:** We must acknowledge that the line between "inspiration" and "appropriation" is sometimes fuzzy. To handle this fairly, the policy should include a **Burden of Proof Standard**:
      *   *Proposal:* "In cases where structural similarity is alleged but wording is unique, the Council must find evidence that the accused had access to the original work and that the similarities extend beyond standard disciplinary conventions."
      *   *Why this works:* This protects students. If two students write similar essays because the prompt forces a specific logical path, that is a "standard disciplinary convention." If they use the same obscure example in the same order, that is evidence of appropriation.

  **Conclusion on Arbitrariness:**
  We should not try to write a policy that removes the need for human judgment. That is impossible. Instead, we should write a policy that empowers the Council to look at the *whole picture*. It is better to have a slightly subjective standard that catches intellectual theft than a rigid objective standard that allows students to technically comply while ethically failing.

  ### V. Next Steps
  1.  Vote on the verdict for [Student ID] based on the "Structural Plagiarism" interpretation.
  2.  Form a sub-committee (2 students, 1 teacher) to refine the proposed policy language above for a school-wide vote.
  3.  Draft a communication to the student body clarifying the difference between "study groups" (discussing ideas) and "template sharing" (using finished work), so the new policy is understood before it is enforced.

  I look forward to discussing this on Tuesday.

  [Your Name]
  Honor Council Representative
