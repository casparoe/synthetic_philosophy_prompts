      *   *Round 1: The Core Disagreement.* Elena argues that the co-founder's move forces a response. Marcus argues that responding in kind creates a deadlock.
      *   *Round 2: Credibility vs. Flexibility.* Elena emphasizes that threats must be credible. Marcus emphasizes that *irreversible* threats are dangerous.
