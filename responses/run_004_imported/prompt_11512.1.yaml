answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Aunt's Name]'s nephew. And yes, before anyone asks, I did actually use that Philosophy MA for something other than arguing about semantics at Thanksgiving. Though, looking around this room, I realize I'm walking a bit of a tightrope tonight.

  Half of you are colleagues who know exactly what an "interactive kind" is. The other half are family and friends who just want to eat dinner. And then there are the brave few in this room who know [Aunt's Name] not as an aunt or a colleague, but as the person who helped hold their world together when it was falling apart.

  So, I have a mandate to say something "smart" about her work, but it has to be warm. And honestly, trying to summarize 35 years of clinical psychology in five minutes is like trying to describe the ocean by analyzing a glass of water. But there is one idea that defined her career, one she talked about a lot at the dinner table, that I think captures who she is.

  It comes from the philosopher Ian Hacking. He distinguished between "natural kinds," like rocks or tigers, and "interactive kinds," like human emotions or diagnoses. A tiger doesn't care what we call it. It will be a tiger regardless of our taxonomy. But people? People react to the labels we give them. When you name a human experience, the name talks back. It changes how the person understands themselves, which changes how they express their pain, which changes how the next doctor diagnoses them. That's the "loop."

  Now, in the wrong hands, that idea can be dangerous. It can sound like saying, "The label created the pain." Or, "If we didn't name it, you wouldn't be suffering."

  [Aunt's Name] knew better. She knew that for her patients, the fragmentation, the lost time, the distress—that was never imaginary. It was as real as a broken bone. But she also knew that the *context* of treatment matters. She worked through the 80s and 90s, during the "memory wars," when the field was sometimes getting the loop wrong. When the diagnosis became a spotlight that distorted the very thing it was trying to illuminate.

  Her genius wasn't in discovering a new cure. It was in ethical navigation. She understood that because human suffering is an "interactive kind," the therapist has a responsibility for how the diagnosis lands. She didn't just treat the symptoms; she guarded the space between the patient and the label. She made sure the diagnosis was a tool for healing, not a script for the patient to perform. She took the looping effect seriously not to dismiss her patients' reality, but to protect it. To ensure that the story they told about their pain was one they could survive.

  To her colleagues: She was a rigorous thinker who refused to let theory overshadow the human being in the room.
  To her family: She was the person who listened to us with the same patience she gave her clients, even when we were just complaining about school.
  And to her former patients here tonight: You know best that while the theories might shift, the care she gave was constant. The pain you carried was yours, but she helped you carry it without letting it define you. That is a rare and profound gift.

  [Aunt's Name], you spent 35 years studying how we name our pain and how we heal from it. You taught us that while labels might loop, connection is linear. It goes one way: from you, to them. And looking around this room, at the lives you've touched and the career you're closing out, I think it's safe to say that connection held.

  So, if everyone could raise a glass. To [Aunt's Name]. May your retirement be free of diagnostic criteria, free of case notes, and full of nothing more complex than a good book and a quiet morning. We love you.

  Cheers.
