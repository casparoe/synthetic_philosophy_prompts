answer: |-
  This is an excellent case study for a seminar on the ethics of blame. You have hit upon a distinction that is central to contemporary moral philosophy: the difference between the **fittingness of blame** and the **standing to blame**.

  Your classmates' reaction ("he's a hypocrite") identifies the symptom, but your intuition is correct that this label doesn't explain *why* the hypocrisy matters. Dan is logically correct that your lateness is a fact independent of his history. However, blame is not just a statement of fact; it is a moral communicative act.

  Here is a breakdown of the philosophical distinction you are looking for, why Dan's behavior is problematic despite the accuracy of his claim, and what would be required for him to regain the standing he currently lacks.

  ### 1. Fittingness vs. Standing

  To analyze this, we need to separate two questions that are often conflated:

  *   **Is the blame fitting?** (Did the target actually violate a norm?)
      *   In your case: **Yes.** You admitted you were late, and it caused a problem. You are a fitting target of blame. Dan is right that bringing up his past behavior does not erase your current responsibility.
  *   **Does the blamer have standing?** (Is the blamer entitled to issue this protest?)
      *   In your case: **Debatable/No.** This is where Dan fails. Standing is the moral authority or right to hold someone else accountable for a specific norm.

  Philosophers like R. Jay Wallace, Pamela Hieronymi, and Macalester Bell have argued that while a hypocrite's claim might be *true* (you were late), the hypocrite lacks the *authority* to make the claim in a way that demands moral accountability from you.

  ### 2. Why Hypocrisy Undermines Standing

  If the fact of your lateness is unchanged, why does it matter that Dan was the one to point it out? There are three main ethical reasons why Dan lacks standing here:

  **A. The Implication of Superiority**
  When someone blames another person, there is an implicit communicative content: *"I hold this norm, I adhere to it, and I am calling you to do the same."* By publicly chastising you for unreliability after being unreliable himself three times, Dan is implicitly claiming a moral high ground he does not occupy. He is treating the norm as something *you* must obey for *his* benefit, rather than a shared commitment.

  **B. Unfairness and the "Clean Hands" Principle**
  Your team picked up the slack for Dan three times. This created a relational history of grace and accommodation. By contrast, when you slipped once, he offered public condemnation. This violates a norm of reciprocity. If he had treated his own lateness with the same severity he treated yours, he might have standing. By accepting the team's forgiveness for himself while denying it to you, he is applying the rules unevenly. This makes the blame feel less like a moral appeal and more like a power move.

  **C. Deflection of Moral Community**
  Blame is meant to repair moral relationships. When a hypocrite blames, it often shuts down dialogue (as you experienced). If you challenge him, he can say, "Look at what *you* did." This prevents the group from addressing the systemic issue (which is that *both* of you were late, and perhaps the deadlines were unrealistic). His lack of standing turns a moment of collective accountability into a defensive duel.

  ### 3. Addressing Dan's Defense

  Dan told you: *"Raising his past behavior was just a way of avoiding responsibility for mine."*

  This is a version of the **Tu Quoque** (you also) fallacy. Logically, he is right: his past actions do not change the reality of your current action. However, in the **ethics of blame**, the *source* of the blame matters.

  You can accept responsibility for your lateness (acknowledging the *fittingness*) while simultaneously challenging his authority to issue the blame (challenging the *standing*). You are not using his hypocrisy to say "I am not late"; you are using it to say "You are not the right person to police this."

  ### 4. What Would Dan Need to Do to Regain Standing?

  You asked what Dan would need to do to be entitled to say this kind of thing again. In the literature on standing, a blamer usually needs to "clean their hands" regarding the specific norm they are invoking. He does not need to be perfect forever, but he does need to address the inconsistency.

  To regain standing, Dan would need to:

  1.  **Acknowledge the Inconsistency:** He needs to explicitly admit that he has violated the same norm he is criticizing you for. He cannot treat his lateness as "unfortunate circumstances" and yours as "unreliability."
  2.  **Apologize for the Past Burden:** He needs to acknowledge that the team picked up his slack. By accepting their grace without acknowledgment, he incurred a moral debt. He cannot demand strict adherence from you while having benefited from their leniency.
  3.  **Demonstrate Commitment:** He needs to show that his blame is coming from a place of wanting to uphold the standard for the *team's* sake, not just to deflect from his own record. This usually means saying something like, *"I know I've struggled with this too, and I'm working on it, but we need to make sure we hit this next deadline."*

  ### 5. Conclusion for Your Seminar

  Your reaction is not mere defensiveness. It is a recognition that **blame is a social practice, not just a factual assessment.**

  For blame to function ethically, it must be issued within a framework of shared vulnerability. When Dan blames you, he is inviting you into a moral community where deadlines matter. But by ignoring his own violations, he is placing himself *outside* that vulnerability while keeping you *inside* it.

  **The Verdict:**
  *   **Is the blame correct?** Yes. You were late.
  *   **Does Dan have standing?** No. His unacknowledged hypocrisy and the team's prior accommodation of him undermine his authority.
  *   **How to resolve it:** You can tell Dan, *"I own my lateness and I apologize for the delay. However, given your own history with deadlines this semester, a public call-out feels inconsistent. If we are going to hold each other to this standard, it needs to apply to all of us equally, including you."*

  This maintains your accountability while asserting the philosophical truth that **one must embody the norm one seeks to enforce.**
