      *   *Vātsyāyana's Fit:* Better fits the soteriological goal of Nyāya (liberation through correct knowledge). If perception is just raw feels, it doesn't defeat ignorance.
      *   *Vācaspati's Fit:* Better fits the epistemological foundationalism required to answer Buddhists. It provides a "Given" (in the good sense) to stop the regress of justification.
      *   *Consensus:* Modern scholars (like B.K. Matilal, J.N. Mohanty, Stephen Phillips) generally agree Vācaspati imported the Buddhist distinction *into* the sūtra to save Nyāya in a new dialectical environment. Vātsyāyana is likely closer to the original intent, but Vācaspati's is the "classical" synthesis.

