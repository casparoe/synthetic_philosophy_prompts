      *   *Refining the "Superdeterminism" point:* Need to be careful. Modern superdeterminism is often seen as a "loophole" that kills science. Leibniz sees determinism as the *basis* of intelligibility. He wouldn't see it as a bullet to bite, but a feature to embrace.
