prompt: |-
  My grandma died last month, and right before she passed she got me to promise i'd keep sending $200 a month to my cousin, who she'd been quietly supporting for years because he was struggling financially. I said yes, obviously, you don't exactly argue with your dying grandmother. Except I just found out he's actually been doing fine for like two years now and has no clue this promise even exists, so it's not like he's relying on me for anything. Meanwhile I'm pretty broke myself right now. Do I still owe this, even though the whole reason for it is gone and grandma's not around to ask anymore?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Promise:** Made to a dying grandmother to send $200/month to a cousin.
      *   **The Context:** Grandma had been secretly supporting the cousin for years.
      *   **The New Information:** The cousin has been financially stable for two years (unknown to Grandma).
      *   **The User's Situation:** The user is "pretty broke" right now.
      *   **The Ethical Dilemma:** Obligation to a deathbed promise vs. changed circumstances (cousin doesn't need it, user can't afford it).

  2.  **Identify the Core Ethical Principles:**
      *   **Fidelity/Integrity:** Keeping promises, especially to loved ones.
      *   **Beneficence:** Doing good/helping others.
      *   **Non-maleficence:** Not harming oneself (financial stability).
      *   **Utility/Consequentialism:** What produces the best outcome? (Money going to someone who doesn't need it vs. money staying with someone who does).
      *   **Intent of the Promisor (Grandma):** Her goal was to help the cousin survive/thrive. That goal is already met.

  3.  **Evaluate the "Contract":**
      *   It was a verbal agreement based on specific conditions (cousin struggling).
      *   Those conditions have changed fundamentally.
      *   The cousin is unaware, so there's no expectation on his end.
      *   The user is financially strained.

  4.  **Consider Potential Courses of Action:**
      *   *Option A: Keep paying.* Honors the letter of the promise, hurts the user, helps the cousin unnecessarily (maybe even offensively if found out).
      *   *Option B: Stop paying immediately.* Honors the user's needs, breaks the promise technically, but aligns with the spirit of the promise.
      *   *Option C: Communicate.* Tell the family/cousin? (Risky, might cause drama).
      *   *Option D: Redirect the funds.* Donate to charity in Grandma's name? (Honors the spirit of giving without self-harm).

  5.  **Drafting the Advice - Key Points to Cover:**
      *   **Empathy:** Acknowledge the grief and the difficulty of the situation. Deathbed promises carry heavy emotional weight.
      *   **The Spirit vs. The Letter:** This is the crux. Grandma's *intent* was to ensure the cousin was okay. If he's okay, the intent is fulfilled.
      *   **Financial Reality:** You can't pour from an empty cup. Being broke is a valid reason to stop.
      *   **The Cousin's Perspective:** He doesn't know. Sending money might confuse him or seem like pity if he finds out.
      *   **Alternatives:** How to honor Grandma without the financial burden.
      *   **Conclusion:** It is ethically permissible to stop.

