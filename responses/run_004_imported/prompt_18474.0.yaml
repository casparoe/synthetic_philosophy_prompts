answer: |-
  **Setting:** *A quiet alcove off the main conference hall. The hum of the coffee machine provides a low backdrop. Elena (defending Combinatorial Externalism) and Marcus (defending Prohibitionism) stand by a high-top table, finishing their espresso.*

  **Elena:** You know, Marcus, your presentation was polished, but I think Prohibitionism glosses over the metaphysics of the harm. You treat the slur like a traffic sign. "Don't say this word." But on Hom's view, the slur isn't just a forbidden sound. It's a vehicle for a specific, institutionally fixed content. When you use the slur *S*, you aren't just breaking a rule; you're asserting that the target possesses negative properties *P* in virtue of belonging to group *G*. That's truth-conditional.

  **Marcus:** And that's exactly where your view crashes, Elena. If the derogatory content is baked into the truth conditions—if *S* literally means "person with negative properties *P*"—then explain reclamation. When an in-group member uses *S* affectionately, are they asserting negative properties about their friend?

  **Elena:** They are repurposing the term. But don't pretend that's semantically invisible. There's tension there. That's why reclamation is *work*. It's a political struggle to shift the content.

  **Marcus:** It's not a semantic struggle; it's a normative one. That's the beauty of Prohibitionism. *S* and its neutral counterpart *N* have the exact same semantic content. They refer to the same people. The difference is purely that there is a social prohibition on uttering the phonological form of *S*. When the in-group reclaims *S*, they aren't changing the meaning. They're simply opting out of the prohibition. They're saying, "This ban doesn't apply to us." On your view, for the in-group to use *S* lovingly, they'd have to be speaking a different language entirely, because the truth conditions would still be toxic.

  **Elena:** Not necessarily. Hom allows that the content is fixed by external institutions. If the institution changes—if the power dynamics shift—the content can shift. But your view makes reclamation trivial. It suggests the in-group is just breaking a rule. But we know it's deeper than that. When an outsider uses *S*, it hurts differently than when an insider uses it. If it were just a prohibition, the violation would feel the same. "You broke the rule." But it doesn't feel like a rule violation; it feels like a violence. That suggests the *content* is being activated by the outsider in a way it isn't by the insider.

  **Marcus:** But why? If the semantics are identical, why the difference in impact? Because of the history of the prohibition! The prohibition exists *because* of the violence. You're conflating the semantic content with the pragmatic history. Look, let's talk about the linguistics lecture case. I mention *S*. I say, "The word *S* has one syllable." I am not using *S*. I am not asserting any negative properties. On your Combinatorial Externalism, I haven't triggered the truth conditions. So why is the room still uncomfortable? Why do professors hesitate to even type it on a slide?

  **Elena:** Because mentioning it invokes the concept. Even if I'm not asserting the properties, I'm bringing the harmful construct into the discourse.

  **Marcus:** That's vague. "Invoking the concept." On my view, it's precise. The prohibition attaches to the *vehicle*, not the content. It's the phonological form that's taboo. Whether you use it or mention it, you've produced the forbidden sound. It's like a trigger. If I tell you, "Don't press the red button," it doesn't matter if you press it to detonate a bomb or to test the wiring. You pressed the red button. The discomfort in the lecture hall isn't because you've asserted something false or toxic; it's because you've violated the norm against producing that sound sequence.

  **Elena:** But that collapses the distinction between slurs and mere profanity. If I mention a four-letter word in a linguistics class, it's mildly rude. If I mention *S*, it's potentially traumatizing. Why? Because *S* carries a specific representational weight. It's not just a noisy word; it's a word that encodes a hierarchy. When you mention it, you force the audience to entertain that hierarchy, even if just to discuss it. Your Prohibitionism can't explain why mentioning *S* is worse than mentioning *N* plus a description of the slur. If I say, "The racial epithet starting with 'N'...", I haven't broken your phonological prohibition. But it's still safer than saying *S*.

  **Marcus:** Is it? In many contexts, saying the full word is treated as more taboo than describing it. That supports me! The taboo is on the specific form. But let's go back to reclamation, because that's where your externalism really bleeds. If the meaning of *S* is fixed by racist institutions externally, how does a marginalized community override that? You say it's "work." I say it's impossible on your terms. If *S* literally means "inferior *G*", then when an in-group member says, "He's my favorite *S*," they are literally saying, "He's my favorite inferior *G*." That's incoherent.

  **Elena:** It's not incoherent; it's ironic. Or better, it's a semantic appropriation. The externalist view explains *why* it's controversial even within the group. Some in-group members refuse to use *S* even reclaimed. Why? Because they recognize the external content is still active. They know the institution hasn't changed enough. Your view can't explain that internal dissent. If it's just "we lifted the ban for us," why would any in-group member object?

  **Marcus:** Because norms are messy! Just because the leadership lifts a ban doesn't mean everyone agrees. But look, consider the "reporting" case. A journalist quotes a politician: "The candidate said, 'All *S* should leave.'" The journalist is mentioning the slur, embedded in a quote. On your view, the journalist is not asserting the content. So why do newsrooms have policies against printing *S* even in quotes? They print lies. They print hateful ideas. But they censor the *word*.

  **Elena:** Because printing the word disseminates the weapon.

  **Marcus:** Exactly! It's the weaponization of the form, not the truth conditions. If I write a paper on logic and I write "P and not-P is true," I've written a falsehood. No one censures me. If I write *S*, I'm censured. Why? Because the prohibition is on the production of the token. Your theory tries to find the toxicity in the *proposition*. I'm telling you, the toxicity is in the *performance*.

  **Elena:** But you're ignoring the cognitive load. When I hear *S*, I don't just hear a sound. I process the content. Hom's point is that the content *is* the mechanism of oppression. It's not just a noise that signals "racism incoming." It constructs the target as lesser *in the very act of predication*. When you reclaim it, you aren't just ignoring a rule; you're trying to drain the content of its toxic truth conditions. You're trying to make it so that *S* no longer entails *P*.

  **Marcus:** And that's why your theory predicts reclamation should fail. You can't just decide that "bachelor" means "married man" for our group. Meaning isn't that malleable. But you *can* decide that a taboo no longer applies. That's why Prohibitionism is the better engineering model, if you will. It separates the data (the reference) from the access control (the prohibition). You're trying to encrypt the data itself.

  **Elena:** But the data *is* corrupted! That's the point of externalism. The reference itself is mediated by the racist institution. *S* doesn't just point to group *G*; it points to *G-as-constructed-by-racism*. When the in-group reclaims it, they are fighting to change the construction, not just the access rules. That's why mentioning it is dangerous. Even in a quote, you are re-instantiating that construction. You're forcing the audience to process *G-as-constructed-by-racism*.

  **Marcus:** But if that were true, then *N* would be safe because it points to *G-as-neutral*. But we know that hearing *S* triggers a different physiological response than hearing *N*, even if the referent is the same. That supports the idea that the form itself is the trigger. The prohibition is a heuristic. We ban the form because we can't reliably distinguish between "using to harm" and "using to reclaim" in real-time. So we ban the token.

  **Elena:** A heuristic? You reduce centuries of oppression to a heuristic?

  **Marcus:** I reduce the *semantic explanation* to a heuristic. The oppression is real, but the linguistic mechanism is a norm, not a truth condition. If you make it truth-conditional, you can't explain how we ever escape it. If *S* literally means "inferior," then racism is true whenever *S* is used.

  **Elena:** No. It means the *speaker* is committed to that content. When the in-group uses it, they are exploiting the gap between the institutional content and their intended content. The friction *is* the point.

  **Marcus:** Friction that my theory explains as a clash of norms, not a clash of truth conditions. Look, Elena, if you're right, then a linguistics professor who mentions *S* to explain its structure is technically speaking falsely or infelicitously, because they are invoking content they don't endorse.

  **Elena:** They are invoking content that is inherently hostile. That's why they hesitate.

  **Marcus:** They hesitate because they fear violating the norm, not because they fear asserting a falsehood. They know they aren't asserting it. But they know the *word* is banned. That's Prohibitionism in action. The very fact that we're having this debate in hushed tones, avoiding writing the full string of characters, proves my point. The taboo is on the signifier, not the signified.

  **Elena:** Or it proves that the signifier is so saturated with the signified that they are indistinguishable. Which is exactly what Externalism claims. The institution has glued the sound to the toxicity so tightly that you can't peel them apart. Reclamation isn't just lifting a ban; it's trying to dissolve the glue. And mentioning it? That's testing if the glue still holds.

  **Marcus:** And until the glue dissolves, the ban stays. But don't confuse the glue for the structure.

  **Elena:** In this case, Marcus, the glue *is* the structure.

  *They stand in silence for a moment, the coffee machine hissing as it resets.*

  **Marcus:** So, no resolution?

  **Elena:** If it were that easy, the models would have converged by now.

  **Marcus:** Fair enough. Another espresso?

  **Elena:** Only if you don't mention the brand. I hear there's a prohibition on it.

  **Marcus:** *Smiles.* Touché.
