answer: |-
  **Setting:** *A soundproofed conference room in the back of the Obsidian Casino. A whiteboard is covered in sigma notation and utility functions. Two consultants sit across from each other. Dr. Elena Vance (Order-Privileging) sips espresso. Dr. Marcus Thorne (Order-Skeptic) leans back, fingers steepled.*

  **Casino Manager:** (Hovering by the door) So, can I print the tickets? What's the buy-in?

  **Vance:** Give us ten minutes. We're just finalizing the derivation.

  **Manager:** (Exits)

  **Thorne:** Elena, you're selling them a bill of goods. You tell them the price is $\ln 2$, roughly 69 cents. But you know as well as I do that if they offer that ticket, a sufficiently clever bettor can construct a portfolio that bleeds the house dry. The expectation isn't 69 cents. It's undefined.

  **Vance:** It's undefined only if you treat the Pasadena game as a bag of numbers rather than a stochastic process. The game *is* the sequence. Toss one, toss two, toss three. The probability space is filtered by time. You cannot sum the expectation in an order that violates the causal structure of the experiment. The Riemann rearrangement theorem applies to static series, not to temporal processes.

  **Thorne:** That's a category error. Decision theory evaluates gambles based on states of the world and their associated utilities. The state "Heads on toss $n$" exists independently of when we observe it. The set of outcome-probability pairs is $\{(1/2^n, (-1)^{n+1} 2^n / n)\}$. That set is the gamble. If your valuation method yields $\ln 2$ for this set, but yields $100$ or $-100$ merely because I decided to index the states differently, then your valuation method is sensitive to description rather than content. Rational preference shouldn't depend on how I label the states.

  **Vance:** But you *can't* index them differently without changing the game. If you tell the player, "We will determine the payoff for $n=10$ before we check $n=1$," you have changed the physical procedure. The expectation value is an integral over the measure space generated by the coin tosses. The natural ordering of the integers corresponds to the filtration of the sigma-algebra. To sum in a different order is to integrate over a path the process does not take. It's like calculating the work done by a particle by integrating along a path it never traveled.

  **Thorne:** Work is path-dependent; value is not. Or at least, expected utility is not supposed to be. Let's hit the strongest point: Weak Dominance. Suppose I offer you Game A, the standard Pasadena game. Then I offer you Game B, which pays exactly one cent more than Game A in every single possible state $n$. Rationality dictates you must prefer Game B to Game A.

  **Vance:** Agreed.

  **Thorne:** But if the expectation of Game A is conditionally convergent, I can rearrange the terms of Game B's expectation series to sum to *less* than Game A's natural sum. If you insist the value is the sum of the series in natural order, you're fine. But if you admit that the *value* of the gamble is what the series sums to, and you admit series can be rearranged... wait, no. Let's sharpen this. If you assign $\ln 2$ to the Pasadena game, you are implicitly accepting that infinite additivity holds for this series. But if infinite additivity holds, why does it fail for the rearranged series? You are cherry-picking the summation method that gives you a finite answer while ignoring that the mathematical object you're evaluating refuses to sustain that answer under permutation.

  **Vance:** I am not cherry-picking; I am respecting the measure. Look, Marcus, you're a physicist at heart, or you should be. In the lab, if I measure a decay rate, I don't say, "Well, the order of detection is arbitrary, so the rate is undefined." The order is dictated by the causal chain. Here, the casino stops tossing when heads appears. That stopping rule imposes an order. The player never *receives* the payoff for $n=5$ unless $n=1$ through $4$ were tails. The dependency is structural. To treat the payoffs as a commutative set is to ignore the stopping condition that defines the probabilities $1/2^n$.

  **Thorne:** The probabilities $1/2^n$ are attached to the states, not the order of summation. I grant you the stopping rule defines the *probabilities*. I deny it defines the *aggregation rule for utility*. Expected Utility Theory says $E[U] = \sum p_i u_i$. It does not say $E[U] = \lim_{N \to \infty} \sum_{i=1}^N p_i u_i$ where $i$ is time. It says sum over the state space. The state space is countable. In a countable set, there is no privileged ordering unless you impose one externally. You are imposing time. But why should time matter for utility? If I win \$100 tomorrow or \$100 next year, the utility might differ due to discounting, but this game assumes instantaneous payoff upon termination.

  **Vance:** Because the *risk* is temporal. The variance accumulates over the tosses. If you rearrange the series, you are effectively claiming the player faces a different risk profile. Consider the truncation. If the casino has a finite bankroll, they must truncate the game at some large $N$. If we truncate at $N$ in natural order, the expected value approaches $\ln 2$ as $N \to \infty$. If we truncate according to your rearranged order, the partial sums oscillate wildly. Which truncation reflects the reality of the casino's exposure? The natural one. The casino doesn't pay out on $n=100$ before $n=1$. Their liability unfolds sequentially. Therefore, the limit of their liability is $\ln 2$.

  **Thorne:** That's a pragmatic argument about liquidity, not a decision-theoretic argument about value. You're conflating "what the casino can afford to pay" with "what the ticket is worth to a rational agent." Let's try a different angle. The "Pasadena" paradox exists precisely because the positive and negative terms both diverge. The positive expectation is $+\infty$; the negative expectation is $-\infty$. You are subtracting infinity from infinity. In standard measure theory, that is undefined. You are getting $\ln 2$ only because you are taking a specific limit of partial sums.
  Here is the killer: If I offer you a ticket to the Pasadena game, and I offer you a ticket to a "Reverse Pasadena" game where I simply swap the signs of the payoffs, what are the prices?

  **Vance:** $\ln 2$ for the first, $-\ln 2$ for the second.

  **Thorne:** Now suppose I sell you a portfolio: one Pasadena ticket and one Reverse Pasadena ticket. In every state $n$, the payoffs cancel exactly. The total payoff is zero with probability 1. The value of the portfolio must be zero.

  **Vance:** Obviously.

  **Thorne:** But if the value of Pasadena is $\ln 2$ and Reverse Pasadena is $-\ln 2$, then by linearity of expectation, the portfolio value is $\ln 2 - \ln 2 = 0$. So far, so good. But linearity only holds if the expectations are well-defined. If they are conditionally convergent, linearity is fragile. If I rearrange the states of the *portfolio*—treating it as a single compound gamble—I can make the sum of the combined payoffs diverge, even though every individual state pays zero.
  No, that's too messy. Let's stick to the core. You claim the value is $\ln 2$. I claim it is undefined. If it is $\ln 2$, then there exists a rearrangement of the same probabilities and payoffs that sums to, say, 10. If I can describe the *same physical gamble* to a player using that rearrangement—perhaps by grouping states into batches—and they agree to pay 10, while another player pays 0.69 for the "natural" description, we have an arbitrage opportunity based purely on rhetoric. Rationality cannot tolerate that.

  **Vance:** You cannot describe the same physical gamble using a rearranged series because the description must match the protocol. If you group states into batches, you are changing the information set available to the player. You are creating a *different* game.
  Marcus, think about the alternative. If you declare the value undefined, what is the casino to do? Refuse to offer the game? That seems excessive for a game with bounded *probabilities* and payoffs that grow only linearly in magnitude relative to the probability weight. The series *does* converge in the natural order. Why should decision theory demand we ignore the only convergence the system actually exhibits?

  **Thorne:** Because decision theory is supposed to be a logic of choice, not a physics of coin tosses. If the logic yields contradictions when the description changes, the logic is incomplete. Nover and Hájek didn't design this game to trick casinos; they designed it to show that Expected Utility Theory breaks down when absolute convergence fails.
  You say "ignore the only convergence the system exhibits." I say "recognize that the convergence is an artifact of the summation order."
  Here is my strongest challenge to you: The Principle of Equivalence. Two gambles that assign the same probability to the same utility outcomes should have the same value.
  My gamble: A bag of tickets. Ticket $n$ has value $(-1)^{n+1} 2^n / n$ and probability $1/2^n$. I draw one ticket from the bag.
  Your gamble: A coin tossed until heads.
  These are probabilistically isomorphic. They generate the exact same distribution over outcomes. In the bag game, there is no time. There is no "toss 1 then toss 2." There is just a draw.
  Do you assert the bag game has a different expected value than the coin game?

  **Vance:** (Pauses) If the bag game is drawn instantly, without sequential revelation... yes, I might concede the expectation is undefined there.

  **Thorne:** Aha! So the value depends on whether the casino uses a coin or a bag? That's absurd. The risk profile is identical. The payoff distribution is identical. If the value changes based on the mechanism of randomization, then Expected Utility is not measuring the *gamble*, it's measuring the *theater*.

  **Vance:** Not theater. Causal structure. In the coin game, the event "Toss 10" is contingent on "Toss 1 through 9 were Tails." In the bag game, Ticket 10 exists independently of Ticket 1.
  Wait... no. In the bag game, if the tickets are weighted by $1/2^n$, the selection process implies a structure. But let's grant your isomorphism. If the bag game is truly isomorphic, then the selection process must respect the weights.
  But here is where I push back. If you accept the bag game is undefined, then you must admit that *time* resolves indeterminacy. The sequential nature of the coin toss regularizes the series. It acts as a cutoff mechanism. The universe doesn't let you access the $n=100$ term without passing through the filter of the first 99 terms. That filter suppresses the divergence.
  If you remove the filter (the bag), the divergence returns. So the value *is* dependent on the mechanism. And since the casino is offering the coin game, the value is $\ln 2$.

  **Thorne:** You are arguing that the *process* of realization confers value. That is a profound claim. It suggests that utility is not a property of the outcome, but of the path to the outcome.
  But if that's true, then Expected Utility Theory, as standardly formulated ($E[U] = \sum p u$), is false. It assumes path-independence. You are proposing a modification to EUT to save the $\ln 2$ result.
  I am proposing we accept that EUT has a domain of applicability, and this game lies outside it. Just as Newtonian mechanics breaks down at relativistic speeds, EUT breaks down at conditional convergence.
  If you price this at 69 cents, you are pretending the theory works where it doesn't. If a whale player comes in and bets \$10 million on "The sum will be positive," how do you hedge? You can't. Because the "sum" isn't a stable property of the gamble.

  **Vance:** I hedge by relying on the Law of Large Numbers over *time*. If the casino plays this game a million times, the average payoff will converge to $\ln 2$.
  Wait, will it?
  (She frowns, looking at the whiteboard.)
  The variance is infinite. The Law of Large Numbers requires finite variance for the standard convergence... actually, the Strong Law holds if the expectation is defined, but here the absolute expectation is infinite.
  So, if we play it a million times, the average payoff might *not* converge to $\ln 2$. It might fluctuate wildly depending on how many "long tail" games occur.

  **Thorne:** Precisely. The "fair price" implies that over the long run, the house breaks even at that price. But if the average payoff doesn't converge to $\ln 2$ over repeated plays, then $\ln 2$ is not a fair price. It is a mirage.
  You see the trap, Elena? The temporal order saves the single-play expectation, but it fails to save the long-run frequency. And casinos live on long-run frequencies.
  If you tell the manager to charge 69 cents, and they sell a million tickets, they could lose their shirts if the rearrangement of *games* (not terms within a game) creates a divergence in the aggregate.

  **Vance:** (Silent for a moment, tapping her pen.)
  That is... a significant concession. The ergodicity is broken. The time-average of a single player does not equal the ensemble average of the casino.
  However. The casino isn't playing an infinite ensemble. They are pricing a single ticket *now*. For a single ticket, the probability of a catastrophic loss (a very large $n$) is vanishingly small. The median payoff is \$2. The mode is \$2.
  If I tell the manager "Undefined," he sells the ticket for \$0 or doesn't sell it. But any rational player would pay *something* to play. There is a 50% chance they win \$2. A 25% chance they lose \$2. A 12.5% chance they win \$2.66.
  Most of the probability mass is on the positive, small-number outcomes. The negative divergence comes from rare, extreme events.
  To say the value is *undefined* is to let the tail wag the dog. It paralyzes decision making in the face of low-probability, high-magnitude noise.
  Is it not more rational to say: "The expectation is $\ln 2$ *provided* we acknowledge the risk of non-convergence in the aggregate"? We price at $\ln 2$ but cap the maximum payoff.

  **Thorne:** Ah, the "cap" solution. If you cap the payoff, the series becomes finite. The expectation is well-defined. But then you aren't pricing the Pasadena game anymore; you're pricing a truncated version.
  And where do you set the cap? The bankroll? If you set the cap at the bankroll, the expected value depends on the bankroll size. As the bankroll $\to \infty$, the price oscillates. It doesn't settle on $\ln 2$.
  So, even with a cap, the limit of the price as the cap increases does not exist.
  You want to charge $\ln 2$. I'm telling you that $\ln 2$ is a point of instability. It is a saddle point in the landscape of valuation. You can balance there, but the slightest perturbation in how you model the aggregation—and you've rolled down the mountain.

  **Vance:** But where else can we stand? If we stand with you, at "Undefined," we abandon the project of quantifying risk for any heavy-tailed distribution. We admit that physics, finance, and gambling all rely on a mathematical convenience that fails here.
  Perhaps that is the lesson. But the casino needs a number.
  If I must choose between a number that reflects the causal reality of the single play ($\ln 2$) and a theoretical purity that offers no guidance (Undefined), I will choose the number. I will tell the manager: "Charge 69 cents. But do not sell a million of them."

  **Thorne:** (Sighs, rubbing his temples.)
  "Charge 69 cents. But do not sell a million of them."
  That is not a pricing strategy, Elena. That is a confession that the theory cannot handle scale.
  But... I concede this: If a player walks in and asks, "What is this ticket worth to me, playing once?", $\ln 2$ is the only answer that respects the probabilities of the likely outcomes. The "Undefined" verdict is driven by outcomes that will effectively never happen in the lifetime of the universe.
  However, I maintain that calling it "Expected Value" is a lie. It is a "Causal Summation Value." It is not the expectation of the utility random variable in the measure-theoretic sense, because that integral does not exist.

  **Vance:** Then we agree on the number, but disagree on the noun.
  You say it's not an Expectation. I say it is, because the measure space is temporally filtered.
  The manager doesn't care about the noun. He cares about the number.

  **Thorne:** He cares about not going bankrupt. If he prices at 69 cents, and a syndicate comes in and buys 10 million tickets, and the law of large numbers fails him because the variance is infinite...
  Fine. We advise him: Price at $\ln 2$ for the retail customer. But institute a hard cap on total liability.
  That cap makes the expectation defined. It makes your $\ln 2$ an approximation of the capped value.
  It bridges our gap. The "Undefined" nature is contained by the finite resources of the house.

  **Vance:** Agreed. The physical constraints of the casino (finite bankroll) truncate the series. For any realistic bankroll, the series is finite. The sum is close to $\ln 2$. The "Paradox" only exists in the limit of infinite wealth, which no casino possesses.
  So, in the real world, the game is well-defined. In the idealized mathematical world, it is not.
  We are consultants to a casino, not to Platon's heaven.

  **Thorne:** (Stands up)
  Then we are agreed. The value is $\ln 2$ *contingent on solvency constraints*.
  But I'm writing the disclaimer. "Expected Utility Theory does not strictly apply."

  **Vance:** And I'll write the pricing model. "Based on temporal filtration of the probability space."

  **Thorne:** (Smiles faintly)
  You know, for a physicist, you're surprisingly comfortable with undefined integrals.

  **Vance:** And for a formalist, you're surprisingly willing to accept a finite cap to save the theory.
  Let's go tell the manager he can print the tickets.

  **Thorne:** 69 cents. But I'm watching the ledger.

  **Vance:** If the ledger diverges, Marcus, it won't be because of the math. It'll be because the coin is biased.

  *(They gather their papers. The whiteboard remains covered in the alternating series, the sum hanging in the air between them, both necessary and insufficient.)*
