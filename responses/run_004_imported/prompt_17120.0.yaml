answer: |-
  This is a profound question that cuts to the heart of moral philosophy and social psychology. You are right to reject the binary choice between "she is a fraud" and "it didn't matter." Both camps in your friend group are relying on a static model of character: they treat honesty like a glass vase that is either intact or shattered.

  To give you the rigorous framework you are looking for, we need to move from a **binary model** of character (Honest vs. Dishonest) to a **dynamic model** (Integrity as a Practice). We can build this by synthesizing the Aristotelian ethics you are studying with modern insights from moral psychology.

  Here is a principled way to weigh Priya's action without resorting to vagueness.

  ### 1. Correcting the Aristotelian Framework
  You mentioned that your elective covered Aristotle's claim that virtue is a stable trait (*hexis*) built over years. It is true that for Aristotle, virtue is a disposition to act rightly. However, your friends in Camp A are interpreting this as "a virtuous person never fails." That is not Aristotle's view.

  Aristotle distinguishes between the *virtuous person* (the *phronimos*) and the *incontinent person* (the *akratic*).
  *   **The Virtuous Person:** Does the right thing, for the right reason, without internal struggle.
  *   **The Incontinent Person:** Knows the right thing, wants to do the right thing, but is overcome by passion or pressure and fails.
  *   **The Vicious Person:** Does the wrong thing and believes it is acceptable.

  Priya's reaction is the critical data point here. She feels "genuinely ashamed." A vicious person (someone who was "never honest") would not feel shame; they would feel cleverness or indifference. A person with no honesty would rationalize it ("Everyone was doing it," "The teacher deserved it").

  **Principle 1: The Response to Failure is Part of the Character.**
  In virtue ethics, character is not just what you do when it is easy; it is also how you relate to your own failures. Priya's shame indicates that her moral compass is still functioning. The act was a failure of *continence* (self-control under pressure), not necessarily a failure of *virtue* (her underlying commitment to the good). Therefore, Camp A is wrong to say this reveals her "true" self. It reveals a limit to her current self-control, but her remorse confirms her commitment to honesty.

  ### 2. The Situationist Critique (Social Psychology)
  Camp B argues that the situation outweighs the character. Social psychology supports this through the concept of the **Fundamental Attribution Error**. This is the cognitive bias where we overestimate personality traits and underestimate situational influences when judging others.

  Studies on "ethical fading" and "moral contagion" show that honesty is surprisingly fragile when three specific conditions align, all of which were present for Priya:
  1.  **Authority Absence:** The teacher left the room.
  2.  **Social Proof:** "Everyone around her copying answers."
  3.  **Time Pressure:** "The clock running out."

  In high-stakes environments, the brain shifts from the prefrontal cortex (long-term planning, values) to the amygdala (threat response, immediate survival). Priya didn't make a calculated decision to abandon her values; she experienced a temporary cognitive collapse under specific stressors.

  **Principle 2: Distinguish Between Capacity and Performance.**
  Think of honesty like athletic ability. A marathon runner (Priya) has trained for years (correcting teachers, reporting cheaters). If they trip and fall in the last mile of a race because someone else spilled water on the track (situational pressure), we do not conclude they "were never a runner." We conclude they had a strong capacity for running but encountered a specific vulnerability to that specific obstacle. Camp B is closer to the truth, but they risk being too dismissive. The fall *does* matter, but it doesn't negate the training.

  ### 3. A Principled Framework for Evaluation
  To avoid picking a side based on your mood, you can evaluate the incident using these four criteria. This moves the judgment from "Is she honest?" to "What is the status of her integrity?"

  **A. Proportionality of the Breach**
  Did she cheat strategically or panicingly?
  *   *Strategic:* Studying the key beforehand, copying the whole test. This suggests a pre-meditated abandonment of values.
  *   *Panic:* Changing two answers in a 5-minute window while surrounded by chaos.
  *   *Verdict:* This looks like a "slip," not a "slide." It suggests a momentary lapse in inhibition rather than a re-evaluation of her moral code.

  **B. The "Confession" Variable**
  Priya told *you*. She did not hide it. In ethics, transparency is a proxy for integrity. By confessing, she has subjected herself to judgment, which is an act of honesty in itself. She is effectively saying, "My action did not match my standard, and I need you to know that."
  *   *Verdict:* This weighs heavily in favor of Camp B. A dishonest person hides the discrepancy between their image and their action. Priya highlighted it.

  **C. The Trajectory of Restoration**
  This is the most important metric. Character is a vector (direction and magnitude), not a point.
  *   If she ignores the shame and does it again next time, Camp A was right.
  *   If she uses this shame to fortify her boundaries (e.g., sitting away from peers during future exams, speaking to the teacher), then this event becomes a "vaccination"—a small exposure that strengthens her immunity against future lapses.
  *   *Verdict:* You cannot judge this yet, but this is where your attention should be. The incident counts *against* her record only if it remains unaddressed.

  **D. The "Untested Habit" Counter-Argument**
  Camp A argues her honesty was just an "untested habit." This is partially true but misleading. Habits *are* character. If I have a habit of stopping at red lights for 10 years, and one night I run a red light because I'm rushing a dying passenger to the hospital, I have broken the habit, but I haven't proven I was "never a law-abiding driver."
  However, Camp A has a point: **Stress testing is necessary.** We now know Priya's honesty has a specific breaking point (peer cheating + time pressure + authority absence). That is valuable information. It doesn't mean she is dishonest; it means her honesty has a known vulnerability that needs reinforcement.

  ### 4. The Third Way: Integrity as a Narrative
  You asked if there is a better way of thinking about character than the two camps offer. There is. It is the **Narrative Model of Identity.**

  In this model, a person's character is not a static object to be weighed, but a story they are writing.
  *   **Camp A** says: "This chapter proves the book is a tragedy."
  *   **Camp B** says: "This chapter is a typo; ignore it."
  *   **The Narrative View** says: "This is a moment of conflict in the story. The protagonist faced a villain (pressure/temptation) and took a hit. The *meaning* of the event depends on the next chapter."

  If Priya integrates this failure into her identity ("I am someone who values honesty so much that even failing at it hurts me"), the failure actually *deepens* her integrity. It moves her from "naive honesty" (never tested) to "tested honesty" (aware of her vulnerability and committed to overcoming it).

  ### Conclusion: How to Weigh the Act
  To answer your specific request for a principled way to decide how much this counts:

  1.  **Do not treat it as zero.** It counts as evidence that her virtue is not yet "perfect" (in the Aristotelian sense of being unshakeable). It reveals a specific situational vulnerability.
  2.  **Do not treat it as disqualifying.** Her history of voluntary honesty (correcting credit, reporting cheating) carries more weight because those were *active* choices, whereas this was a *reactive* lapse under duress. Active choices define character more than reactive lapses.
  3.  **Weight the Remorse.** Give significant credit for her shame and confession. In a rigorous ethical framework, the recognition of error is the first step of moral repair.

  **The Verdict:**
  Priya is not "dishonest." She is a person with a strong disposition toward honesty who experienced a localized failure of moral resilience under specific, high-pressure conditions. The incident should not erase her history, but it should update your understanding of her: she is not immune to pressure, and her honesty is now a conscious struggle rather than an unthinking habit.

  If you must choose between the camps, Camp B is philosophically stronger, but only if amended: *"Years of consistent behavior define her character, provided she uses this lapse to strengthen her resolve rather than excuse future failures."* This allows you to forgive her without ignoring the reality of what happened.
