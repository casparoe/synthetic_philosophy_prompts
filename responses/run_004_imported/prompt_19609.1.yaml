          *   *Alex:* That's chauvinism. Why layer 5? Why not the equivalent processing in the nidopallium caudolaterale (NCL)?
      *   **Round 5: The NCL Specifics.**
          *   *Alex:* NCL is the prefrontal analog. Lesion studies show executive function loss.
          *   *Sam:* Analog isn't homologue. The wiring diagram is different. Different wiring = different computational constraints = potentially different *qualia* or cognitive texture.
      *   **Round 6: Synthesis/Compromise?**
