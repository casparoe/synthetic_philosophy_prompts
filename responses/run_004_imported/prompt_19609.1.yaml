      *   **Bechtel & Mundale (1999) Critique:** MR is often overstated. When you look closely at *how* functions are realized, the "same function" often breaks down into different sub-functions realized differently. If the neural mechanisms are homologous or analogous but structurally distinct in ways that affect processing, the mental states might not be identical.
      *   **Neuroscience Context:**
          *   *Mammals:* Neocortex (6 layers), columnar organization.
          *   *Birds:* No neocortex. Instead, nuclear clusters (nidopallium, mesopallium). Old view: primitive. New view (Jarvis et al., 2005 nomenclature): Convergent evolution, high neuron density, pallial structures that do similar work.
