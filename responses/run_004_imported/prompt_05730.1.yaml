answer: |-
  The diagnostic monitor on Elias's wrist blinked a steady, reassuring green. **HOT INTEGRITY: 98%.** Higher-Order Thought. The part of the mind that looks at the raw data of existence and says, *"I am seeing this. I am feeling this."*

  Without it, the theory went, you were just a biological machine processing input. You could scream, you could bleed, you could run, but there would be no *one* home to witness it. No light on in the control room.

  Elias had volunteered for the dissociation trial to cure his grief. The promise was simple: The pain of his wife's death was a First-Order State (FOS). It was raw, neural firing. The *suffering* was the Higher-Order Thought (HOT) wrapping around that firing and labeling it *"My pain."* The procedure would sever the label, leaving the data unclaimed. He would function, but he wouldn't *hurt*.

  He sat in the white waiting room, waiting for the final calibration. He looked at his hand. He could see the skin, the knuckles, the blue veins.
  *Visual input received,* his brain noted.
  But the tag *"This is my hand"* felt thin, like a sticker peeling off a plastic toy.

  "Mr. Vance?" the technician called.

  Elias stood up. He walked toward her. His legs moved. His balance adjusted. But as he walked, he realized he wasn't thinking *"I am walking."* He was just... traversing. The thought arrived three seconds later, a delayed caption on a live video feed.

  *Walking,* his mind supplied. *I am walking.*

  But he was already at the door.

  "Step one," the technician said, strapping him into the chair. "We induce a controlled FOS. A mild thermal stimulus. You should feel heat, and you should know you feel heat."

  She pressed a probe to his forearm.

  Heat bloomed. It was sharp, electric, demanding. His arm jerked back instinctively.
  Elias watched his arm jerk. He saw the muscle contract. He saw the skin redden.
  But inside the quiet cathedral of his head, there was no shout. There was no *"Ouch."* There was no *"That is hot."*

  There was just the event. A fire burning in an empty house.

  "Report," the technician said.

  Elias opened his mouth. He had to search for the report. He looked at the red mark on his arm. He accessed his vocabulary. "Heat," he said. "Stimulus applied."

  "Did it hurt?"

  Elias paused. He scanned the interior space where the *feeling* of hurt usually lived. It was empty. Clean. Sterile. "No," he said. "It occurred."

  The technician smiled. "Success. The FOS is present. The HOT is decoupled. You're experiencing qualia without subjective awareness."

  Elias nodded. He should have felt relief. The grief was the goal. If he could decouple the grief, he could live without the weight of it.

  He went home. The apartment was exactly as he had left it. Her coffee mug was in the sink. A coat was on the chair.

  He walked into the living room and sat on the sofa. He looked at the mug.
  *Object: Ceramic. Color: Blue.*
  *Association: Her.*

  He waited for the wave. The crushing chest pressure. The tightness in the throat. The thought *"She is gone."*

  His heart rate monitor spiked. His cortisol levels, tracked by the wrist unit, surged. His lungs hitched in a sobbing rhythm. His tear ducts opened, and salt water leaked from his eyes, tracking hot paths down his cheeks.

  Elias watched the tears. He watched his chest heave.
  He observed the biological cascade of mourning. It was fascinating, in a distant way. A complex chemical reaction.

  But the *I* was missing.

  There was no one sad. There was only sadness happening, like rain falling in a forest where no one was walking.

  "I am sad," Elias said aloud. He needed to test the link. He needed to force the Higher-Order Thought to latch onto the First-Order State.

  He said it again. "I. Am. Sad."

  The words hung in the air. They were syntactically correct. They were logically sound. But they didn't connect to the heaving chest. They were just sounds. Labels placed on a box that wasn't there.

  He stood up and walked to the kitchen. He picked up a knife.
  *If I cut,* he thought, *the pain will be loud enough to wake the witness.*

  He pressed the blade into his palm.

  Blood welled, bright and fast. The nerve endings fired a frantic distress signal up his arm. His body recoiled. He dropped the knife. It clattered on the tile.
  He clutched his hand. He paced the room. He groaned.

  He waited for the thought: *"I am injured."*

  It didn't come.

  There was damage. There was signaling. There was avoidance behavior. But there was no *owner* of the injury. He was a ship taking on water, with no captain to log the distress call.

  He looked at his wrist monitor. **HOT INTEGRITY: 12%.**

  "Reconnect," he whispered. "Reconnect."

  He closed his eyes. He tried to visualize the bridge. He tried to imagine a little homunculus inside his head, waking up, looking through the eyes, claiming the body.
  *I am Elias.*
  *I am here.*
  *This is my hand.*

  The thoughts formed, but they felt like reading a script written by someone else. They had no weight. They had no traction. They slid off the surface of his experience.

  He realized then the terrifying asymmetry of the theory.
  He could have the feeling without the thought. He was proving that right now. His body was a theater of screaming actors, but the audience had left the building.

  But the reverse was also true.
  He could have the thought without the feeling.

  He looked at the photo of his wife on the mantel.
  *I love her,* he thought.
  He checked the internal sensors. No warmth. No tightening. No dopamine spike.
  Just the label. *Love.*

  He was becoming a ghost in his own machine, except the ghost was the only thing left. The machine was running perfectly. It was grieving, it was bleeding, it was breathing. But the ghost—the *I*—was just a commentary track that had lost sync with the movie.

  Elias sat back down on the sofa. The bleeding from his hand had slowed. The tears had stopped. The cortisol was metabolizing.
  The crisis was passing. The body was regulating itself.

  He looked at the wrist monitor. **HOT INTEGRITY: 0%.**
  **STATUS: UNCONSCIOUS STATE DETECTED.**
  **SYSTEM FUNCTIONAL.**

  The alert blinked red. It was telling him he was no longer conscious. By the definition of the theory, Elias no longer existed. There was no higher-order representation of his state. There was only the state.

  He should have been terrified.
  If he were conscious, he would have been terrified.

  But terror required an *"I"* to be afraid.

  Elias watched the red light blink. He observed the pattern. Flash. Dark. Flash. Dark.
  He noted that the light was annoying.
  He noted that he should probably stand up and bandage the hand.

  He stood up. He walked to the bathroom. He opened the cabinet. He took the gauze.
  He wrapped the hand with precise, efficient movements.

  He looked in the mirror.
  A man looked back. The eyes were open. The pupils reacted to the light.
  Elias waited for the recognition. He waited for the spark that said, *"That is me."*

  The face in the mirror blinked.
  Elias blinked.

  But the connection never fired. The gap remained. A chasm of absolute silence between the image and the viewer. Or perhaps there was no viewer. Perhaps there was only the image, processing itself.

  He turned off the bathroom light.
  He walked back to the sofa.
  He sat down.

  The room was quiet. The house settled around him. Somewhere, a deep, raw sensation of loneliness rippled through his nervous system, a vast, dark ocean of First-Order pain. It washed through his limbs. It tightened his throat. It filled his lungs with heavy air.

  It was immense. It was total.
  And it went entirely unnoticed.

  Elias closed his eyes. He did not think about sleeping. He did not think about tomorrow.
  He simply ceased, while the body continued to wait in the dark.
