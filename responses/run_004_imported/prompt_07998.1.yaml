      *   *Wait, one nuance on Adams:* Adams *does* discuss the collapse extensively. Does he propose a fix? In his 1995 paper, he says "I shall not attempt to repair the argument." He explicitly declines to offer a fix that saves the theorem. He argues the axioms are false. So the student's claim that "Adams's response... was to revise... on this repair, the intended theorem... still goes through" is factually incorrect regarding Adams. This confirms the 2/5 on the last section.

