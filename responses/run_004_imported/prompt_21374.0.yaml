prompt: |-
  I'm outlining a historical novel set in London during the closing years of the 1770s. It centres on a young Scottish clerk, Alan, newly arrived at the counting-house of his uncle Hector, a 'nabob' who made his fortune in the East India Company's Bengal trade and holds cynical, mercenary views on the American war then underway. I want a set-piece dinner scene in which Alan, having lately worked his way through Adam Smith's Wealth of Nations, invokes Smith to defend the imperial project against his uncle, while Hector dismisses the argument as fashionable economics dressed up as principle.

  The trouble is that a friend from my writing group, who studied economic history, warned me I might be flattening Smith into a caricature, and I would rather settle the question before I draft the scene than after. My working assumption has been that Smith, as the great theorist of commercial society and the gains from specialisation and exchange, would hand Alan a ready-made brief for empire: colonies, on this reading, are simply free trade and the division of labour extended across oceans, so a good Smithian ought to see the British Empire as a natural, if imperfect, expression of his own economic principles. Before I put a version of that speech in Alan's mouth, I would welcome help checking it against what Smith actually argues about colonies, chartered monopolies like the East India Company, and the case of the American colonies in the Wealth of Nations. Would a well-read young man of 1778 who took Smith seriously really come away primed to cheer for empire, or am I about to give my character an argument that Smith himself would have made short work of?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Context:** Historical novel set in London, late 1770s (specifically around 1778).
      *   **Characters:** Alan (young Scottish clerk, newly read Adam Smith) vs. Hector (uncle, East India Company "nabob", cynical, pro-empire/pro-war).
      *   **Proposed Conflict:** Alan uses *The Wealth of Nations* (WN) to defend the imperial project/empire against Hector's cynicism. Hector dismisses Smith as fashionable theory.
      *   **The Problem:** A friend (economic historian) warned the user they might be caricaturing Smith.
      *   **User's Assumption:** Smith = commercial society + specialization + exchange = Empire is just free trade across oceans = Smith supports Empire.
      *   **The Question:** Would a well-read young man in 1778 actually use Smith to *defend* the British Empire (specifically the EIC and the American war context), or would Smith's actual text undermine that argument?

  2.  **Initial Knowledge Retrieval & Fact-Checking (Adam Smith & Empire):**
      *   *Publication Date:* *The Wealth of Nations* was published in March 1776. So, by 1778, it is available and being discussed in London coffee houses and intellectual circles. Alan having read it is plausible.
      *   *Smith's View on Colonies:* Smith acknowledges the benefits of colonization for the *mother country* in terms of new markets and resources, *but* he is highly critical of the *management* of colonies.
      *   *Smith's View on Monopolies:* This is the big one. Smith hates monopolies. The East India Company (EIC) is a chartered monopoly. The Navigation Acts are restrictive trade practices.
      *   *Smith's View on the American War:* He generally thought holding onto the colonies by force was economically disastrous. He suggested that if the colonies wanted independence, let them go, or turn the empire into a federal union (which was impractical).
      *   *Smith's View on the EIC:* He was scathing about the EIC's governance in India. He viewed them as sovereigns who were also traders, which led to corruption and oppression.
      *   *The "System of Perfect Liberty":* Smith advocates for free trade. Empire in the 1770s was mercantilist (restrictionist). Therefore, Smith is critical of the *existing* imperial structure.

  3.  **Evaluating the User's Assumption:**
      *   *User's Assumption:* "Smith... would hand Alan a ready-made brief for empire: colonies... are simply free trade and the division of labour extended across oceans."
      *   *Reality:* This is the exact opposite of Smith's argument in WN. Smith argues that the *restriction* of colonial trade to the mother country (mercantilism) harms the mother country by diverting capital from more productive uses and invites conflict.
      *   *Conclusion:* The user's friend is right. The proposed scene has Alan arguing *for* empire using Smith, while Hector (the EIC man) is the cynic. In reality, Smith would give Alan ammunition to attack Hector's specific type of empire (EIC monopoly), but not necessarily "empire" as a concept of free exchange (which didn't really exist then).
      *   *Nuance:* Smith wasn't an anti-imperialist in the modern sense. He thought colonies were valuable *if* managed correctly (free trade), but the *current* British Empire was managed incorrectly (monopoly/restriction).

  4.  **Drafting the Advice:**
      *   **Validate the Friend:** Confirm that the economic historian friend is correct. The user's assumption is a common misconception.
      *   **Key Smithian Points relevant to 1778:**
          1.  **Monopolies are Bad:** The EIC is a monopoly. Smith hates this. It raises prices, lowers efficiency, and corrupts politics.
          2.  **Mercantilism is Bad:** The colonial system (Navigation Acts) restricts trade. Smith argues this hurts Britain by forcing capital into less productive colonial trade rather than more productive European trade.
          3.  **The American War:** Smith thought it was a waste of money. He famously said Britain would gain more from free trade with independent America than from taxing a dependent one.
          4.  **The EIC in India:** Smith distinguishes between "colonies" (settler) and "possessions" (EIC in India). He is very critical of the EIC's dual role as trader and sovereign.
      *   **Reframing the Scene:**
          *   *Option A (The Correction):* Alan uses Smith to *attack* Hector's EIC wealth and the war. This aligns with history but changes the dynamic (Alan becomes the critic, Hector the defender of the status quo).
          *   *Option B (The Nuance):* Alan tries to use Smith to defend "Commerce" broadly, but Hector points out the hypocrisy/implementation.
          *   *Option C (The Tragic Irony):* Alan *misreads* Smith (which is plausible for a young enthusiast) to support empire, and Hector (the practitioner) knows the gritty reality that even Smith acknowledges (that monopolies make men rich, even if they hurt the nation).
      *   **Historical Plausibility:** In 1778, WN was new. It was radical. A young Scot (Smith was Scottish) might idolize it. But would he use it to support the EIC? Unlikely unless he misunderstood it.
      *   **Recommendation:** The most dramatic and historically accurate tension comes from Alan using Smith to challenge the *morality* or *economic sense* of the EIC/War, while Hector argues that "Theory doesn't fill pockets." OR, Alan tries to justify Empire via Smith, gets shot down by Hector who knows the system is built on monopoly (which Smith hates), creating irony.
      *   **Best Path:** Advise the user that Smith is actually *critical* of the EIC and the Mercantilist Empire. If Alan wants to be a true Smithian, he should be arguing *against* Hector's specific business model, not defending the imperial project as it stood. However, if the character *misinterprets* Smith, that's a character flaw, not a historical error.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   Wait, the user wants Alan to defend the *imperial project* against Hector's *cynicism*. Hector is a "nabob" (EIC). Hector is cynical/mercenary.
      *   If Alan uses Smith to say "Empire is good for trade," Smith would say "Free trade is good, Empire (as currently constituted) is bad for trade."
      *   If Alan says "The American War is worth it for the Empire," Smith says "It's a waste of money."
      *   *Crucial Distinction:* Smith distinguishes between the *idea* of global commerce (good) and the *political machinery* of empire (bad/corrupt).
      *   *Scene Potential:* The irony is rich if Alan tries to use Smith to justify the EIC, and Hector (who knows Smith is popular) laughs and says, "Smith would have me starve, boy. He hates men like me." This makes Hector more intelligent and Alan more naive.
      *   *Alternative:* Alan uses Smith to argue for a *reformed* empire (free trade), and Hector argues that *this* empire (monopoly) is the only one that pays.
      *   *Decision:* I need to tell the user clearly: Smith does *not* support the 1770s British Imperial model. He supports free trade. The British Empire was Mercantilist. Therefore, a Smithian argument *against* the current imperial management is the historically accurate one.

  6.  **Structuring the Response:**
      *   **Direct Answer:** Your friend is right. Smith is not a cheerleader for the 1770s British Empire.
      *   **Key Evidence from WN:**
          *   Critique of Monopolies (EIC).
          *   Critique of Colonial Trade Restrictions (Mercantilism).
          *   View on American Independence (Let them go/Free Trade).
          *   View on EIC in India (Sovereigns vs Traders).
      *   **Character Implications:**
          *   If Alan is a *true* Smithian, he attacks Hector.
          *   If Alan wants to defend Empire, he is misreading Smith (which is a great character beat).
          *   Hector's rebuttal should be about practical reality vs. theory.
      *   **Historical Context:** 1778 reception of WN (still niche, growing). Scottish connection (Smith is a Scot).
      *   **Suggested Pivot:** How to make the scene work historically while keeping the dramatic tension.

  7.  **Final Polish:** Ensure tone is helpful, encouraging, and authoritative on the historical/economic details. (Check dates: WN 1776, Scene 1778. Perfectly timely).

  *(Self-Correction)*: I should make sure not to say Smith was an "anti-imperialist" in the modern sense. He believed in the civilizing mission to some extent and saw benefits in colonization *if* free trade prevailed. But the *system* of the 1770s was the enemy. I must be precise.

  *(Refining the Scene Idea)*: The most interesting conflict is Alan trying to find moral cover in Smith for the Empire, and Hector pointing out that Smith actually condemns Hector's specific livelihood. That creates immediate personal stakes.

