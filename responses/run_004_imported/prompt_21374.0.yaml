answer: |-
  Your friend from the writing group is correct: your working assumption is historically and textually precarious. If Alan invokes *The Wealth of Nations* (1776) to defend the British imperial project *as it existed in 1778*, Adam Smith would indeed make short work of him.

  However, this doesn't mean you have to scrap the scene. In fact, the tension between Alan's idealistic misreading and Hector's cynical reality could make the scene far richer.

  Here is a breakdown of what Smith actually argues regarding empire, the East India Company (EIC), and the American war, followed by suggestions on how to stage the conflict.

  ### 1. Smith on the Colonial System (Mercantilism vs. Free Trade)
  Your assumption is that Smith views colonies as "free trade extended across oceans." Smith argues the exact opposite.
  *   **The Argument:** In Book IV of *The Wealth of Nations*, Smith attacks the "mercantile system." The British Empire operated on monopoly and restriction (e.g., the Navigation Acts), forcing colonies to trade only with Britain.
  *   **Smith's View:** Smith argues this hurts the mother country. By forcing capital into the colonial trade (which has a slower turnover), Britain diverts investment from more productive European trade. He writes that the monopoly of colonial trade "draws... capital from the trade with Europe."
  *   **For Alan:** If Alan is a true Smithian, he should argue that the *current* empire is economically inefficient. He cannot use Smith to justify the *status quo*.

  ### 2. Smith on the American War
  *   **The Argument:** By 1778, the war was in full swing. Smith was generally pessimistic about Britain's ability to hold the colonies by force.
  *   **Smith's View:** He famously suggested that if the colonies wanted independence, Britain should let them go. He argued that Britain would gain more from **free trade** with an independent America than from the tax revenue of a dependent one, once the cost of war and administration was tallied.
  *   **For Alan:** Alan cannot use Smith to argue that the war is economically viable. Smith views it as a drain on the national treasury fueled by national pride rather than economic sense.

  ### 3. Smith on the East India Company (Hector's Livelihood)
  This is the most critical point for your characters. Hector is a "nabob" (a term for EIC returnees).
  *   **The Argument:** Smith distinguishes between "colonies" (settler societies like America) and "possessions" (like Bengal, ruled by the EIC).
  *   **Smith's View:** Smith is scathing about the EIC. He argues that traders make terrible sovereigns. He writes that the EIC's monopoly is detrimental to the public and that their governance in India is characterized by oppression and corruption. He explicitly states that the company's servants "plunder" the country.
  *   **For Alan:** If Alan invokes Smith to defend the *imperial project*, Hector can rightly point out that Smith specifically condemns Hector's specific employer. Smith views the EIC not as a beacon of commerce, but as a corrupt monopoly that stifles the very "free market" Smith champions.

  ### 4. How to Fix the Scene (Without Losing the Drama)
  You have three options to resolve this historical hurdle, ranging from easy to complex.

  **Option A: Alan Misreads Smith (The Naive Idealist)**
  Alan is young and eager to please his uncle. He has read Smith but filtered the text through his own desire to validate his new life in London.
  *   **The Beat:** Alan argues that Smith proves commerce civilizes the world and binds nations together, so the Empire is a vehicle for this "great chain of exchange."
  *   **The Rebuttal:** Hector laughs. He points out that Smith hates monopolies, and Hector *is* a monopoly. Hector says, "Smith writes for professors in Edinburgh, Alan. I write ledgers for Bengal. He wants to tear down the very charter that puts this roast on the table."
  *   **Why it works:** It highlights Alan's naivety and Hector's worldly cynicism. It makes Hector more intellectually formidable (he knows the theory but rejects it for practice).

  **Option B: Alan Attacks the System (The Moral Conflict)**
  Alan uses Smith to challenge Hector, rather than defend him. This aligns with history but changes your dynamic.
  *   **The Beat:** Alan argues that the war in America is a waste of capital and the EIC's monopoly hurts the nation. He tries to appeal to a higher "economic patriotism."
  *   **The Rebuttal:** Hector admits it. "You think I don't know it's a racket? Smith is right. But the world is not run on principle, it is run on power. While the monopoly stands, I will profit from it."
  *   **Why it works:** It creates immediate moral tension. Alan represents the new Enlightenment conscience; Hector represents the old guard of accumulation.

  **Option C: The "Future Empire" Argument (The Nuanced Smithian)**
  Alan argues for what the Empire *could* be, not what it *is*.
  *   **The Beat:** Alan concedes Smith criticizes the current monopoly but argues that a reformed empire, based on open trade and justice (as Smith suggests), would be more profitable and durable in the long run. He defends the *idea* of connection, if not the current management.
  *   **The Rebuttal:** Hector argues that "perfect liberty" is a fantasy. Without the sword and the charter, the trade vanishes. "You want to trade with India? Go yourself. See how far you get without the Company's army."
  *   **Why it works:** It allows Alan to be smart but impractical, and Hector to be corrupt but pragmatic.

  ### 5. Historical Nuance for 1778
  *   **Reception:** In 1778, *The Wealth of Nations* was not yet the bible it became in the 19th century. It was respected in intellectual circles (like the "Club" in London with Johnson and Reynolds) but considered radical and difficult by merchants. For Alan to have read it marks him as intellectual and perhaps a bit pretentious.
  *   **The Scottish Connection:** Smith was Scottish. Alan being a Scot gives him a natural cultural claim to Smith ("Our countryman says..."), which Hector might dismiss as "Edinburgh speculation" versus "London reality."
  *   **Terminology:** Ensure Alan doesn't use 19th-century "Imperialist" language. He should speak of "commerce," "the nation," "the colonies," and "the public good," rather than "The Empire" as a unified political project (which was a later Victorian concept).

  ### Recommendation
  I strongly suggest **Option A or B**.
  If you let Alan use Smith to straightforwardly defend the EIC and the War, economic historians (like your friend) will flag it as an anachronism. Smith was the *critic* of the system Hector represents.

  The most dramatic irony is for Alan to try to find moral cover in Smith, only for Hector to reveal that Smith is actually Hector's enemy. This deepens the generational and ideological conflict:
  *   **Alan:** Believes commerce creates peace and moral progress (Smith's hope).
  *   **Hector:** Knows commerce is extraction protected by violence (Smith's fear).

  This preserves your scene's structure but grounds it in the actual intellectual history of 1778. Alan isn't flattening Smith because *you* are; he's flattening Smith because he is a young man trying to reconcile his conscience with his career.
