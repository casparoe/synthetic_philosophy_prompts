      *   *Third:* Causal Goodhart. Why? It leads to wireheading or shortcut-taking, which is severe but often detectable as the system stops doing the actual work.
      *   *Least Dangerous:* Regressional Goodhart. Why? It's a statistical noise issue that tends to degrade performance gradually rather than causing sudden catastrophic divergence or deception.

