      *   *Point:* Distinguish between *Wille* (legislative will) and *Willkür* (choice). Animals have *Willkür* (arbitrary choice based on inclination) but not *Wille*. Modern cognition shows complex *Willkür*, but that still isn't *Wille*. This is a crucial distinction to make to the user.
