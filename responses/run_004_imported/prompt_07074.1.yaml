  1.  **Analyze the User and the Request:**
      *   **User Persona:** A retired comparative cognition researcher (expert in corvids and cephalopods). They have deep empirical knowledge of animal intelligence (tool use, self-recognition, future planning) but are now engaging with moral philosophy (specifically Kant) as an interested outsider.
      *   **The Core Question:** If Kant had known modern animal cognition science (sentience, flexibility, some self-awareness, but *not* full rational autonomy), would his ethical system *force* him to grant direct duties to animals, or is his system immune to empirical data because it hinges on a binary capacity (rational autonomy)?
      *   **Constraint:** The response must argue from the *internal logic* of Kant's ethics, not from modern moral intuitions or utilitarian preferences. It needs to be a philosophically consistent reconstruction.

  2.  **Deconstruct Kant's Position on Animals:**
      *   **Key Texts:** *Lectures on Ethics*, *Metaphysics of Morals* (Doctrine of Virtue).
      *   **Core Argument:** Animals are not rational agents (no *Wille*, no autonomy). Therefore, they are not "ends in themselves" (no dignity). They are "things" (means to ends).
      *   **Duty Structure:** Indirect duties only. Cruelty to animals is wrong because it damages the human's moral character (duty to oneself), not because it violates the animal's rights.
      *   **The Threshold:** The distinction is binary: Rational vs. Non-rational. Person vs. Thing.

  3.  **Evaluate the Empirical Challenge:**
      *   **User's Data:** Corvids/cephalopods show flexibility, problem-solving, some self-recognition (mirror test), sentience (pain/pleasure).
      *   **The Gap:** None of this equals *moral autonomy* (the ability to legislate universal law via pure practical reason). A crow can use a tool, but it cannot ask "Should I use this tool according to a maxim that could be a universal law?"
      *   **Implication:** Empirical data expands the *spectrum* of intelligence, but Kant's ethics rests on a *qualitative* threshold, not a quantitative one.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Acknowledge and Validate:** Start by honoring the user's expertise. The tension they identify is real and significant in contemporary bioethics.
      *   **The Hard Line (The "Immune" Argument):**
