          *   Even a super-intelligent AI or a very clever crow lacks *autonomy* in the Kantian sense (freedom from determination by inclinations/nature).
          *   Therefore, empirical data on cognition doesn't move the needle on *moral status* directly.
      *   **The Soft Line (The "Concession" Argument):**
