answer: |-
  This is an excellent question that cuts to the very heart of *On Certainty*. You have identified the central tension in Wittgenstein's late philosophy: the conflict between the **logical status** of hinge propositions (they seem immune to doubt, like necessary truths) and their **historical fluidity** (they change over time, like empirical claims).

  The short answer is: **No, Wittgenstein does not treat hinges as a special class of metaphysical or logical necessary truths.** To interpret them as such would be to fall back into the very kind of essentialism Wittgenstein is trying to dismantle.

  Instead, Wittgenstein proposes a **functional** or **pragmatic** distinction. A proposition is not a hinge because of its intrinsic content, but because of the **role it plays** within a specific language-game at a specific time.

  Here is how we can resolve the tension between the "hinge" status and the "river-bed" metaphor.

  ### 1. Hinges are Not "Necessary Truths" (in the Traditional Sense)
  In traditional epistemology (and in the *Tractatus*), there is a sharp divide between **necessary truths** (logic, mathematics, tautologies) and **contingent truths** (empirical facts). Necessary truths are true in all possible worlds; empirical truths are verified by evidence.

  Wittgenstein blurs this distinction in *On Certainty*.
  *   **They look empirical:** Hinge propositions are grammatically identical to empirical claims. "The earth has existed for many years" has the same subject-predicate structure as "The earth was wet yesterday."
  *   **They function as rules:** However, we do not arrive at them via investigation, nor can we reject them via evidence. They function as the **normative scaffolding** that allows empirical investigation to take place.

  If they were truly "necessary truths" in a logical sense, their denial would result in a contradiction (like denying $2+2=4$). But denying a hinge (e.g., "The earth popped into existence five minutes ago") does not create a logical contradiction; it creates **nonsense** within our current form of life. It makes the language-game unplayable.

  Therefore, their "necessity" is not logical or metaphysical; it is **pragmatic**. They are indispensable for our practice of judging truth and falsehood, but they are not themselves "true" in the same way a verified hypothesis is true. As Wittgenstein says, they are "exempt from doubt" not because they are infallible, but because doubting them destroys the system of reference.

  ### 2. The River-Bed Metaphor Resolves the Tension
  Your second point regarding the river-bed (OC §§96–99) is precisely the argument *against* treating hinges as a fixed class of necessary truths.

  Wittgenstein writes:
  > *"The mythology may change back into a state of flux, the river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other."* (OC §97)

  If hinges were necessary truths (like the laws of logic), the river-bed would be made of diamond—it would never shift. The fact that the bed *does* shift proves that the status of a proposition is **contingent upon our form of life**.

  *   **Example:** "The sun revolves around the earth."
      *   **Pre-Copernicus:** This functioned as a hinge. It was part of the "hard rock" against which other observations were measured. To doubt it was to step outside the intelligible world-view of the time.
      *   **Post-Copernicus:** This became an empirical claim (and a false one). It moved into the "water."
      *   **Future:** Perhaps in a new cosmological framework, some current hinge (e.g., "Objects don't vanish when unobserved") could become a testable hypothesis.

  This fluidity demonstrates that **no proposition is a hinge by nature.** A sentence only becomes a hinge when we *use* it as one. This squares perfectly with the river-bed image: the hardness is relative to the flow of the water. The "necessity" is local and temporal, not universal and eternal.

  ### 3. Grammar vs. Empirical: A Misleading Dichotomy
  The confusion arises because we want to categorize propositions into boxes: "Is this sentence Analytic or Synthetic?" "Is it Necessary or Contingent?"

  Wittgenstein's insight in *On Certainty* is that this categorization fails for hinges. He suggests that hinges occupy a middle ground:
  *   They are **empirical in grammar** (they talk about the world).
  *   They are **grammatical in function** (they define what counts as a reasonable claim about the world).

  When you ask, "Does this mean they are necessary truths?", Wittgenstein would likely reply that the question itself presupposes a rigid logical structure that doesn't exist in practice. He replaces the question "What is the logical status of this proposition?" with "How is this proposition used?"

  ### 4. Certainty is a Matter of Action, Not Knowledge
  Finally, it is crucial to note that Wittgenstein distinguishes **certainty** from **knowledge**.
  *   **Knowledge** implies the possibility of doubt and the requirement of evidence. (I know $X$ because I have evidence $Y$).
  *   **Certainty** (hinge certainty) is non-epistemic. It is manifested in **action**.

  We do not "know" the earth has existed for many years; we **act** with the certainty that it has. If I try to dig for treasure, I do not first verify that the earth existed yesterday. I just dig.

  Because this certainty is rooted in action (a "form of life"), it can change when our form of life changes. If humanity developed a technology that allowed us to create planets, the proposition "Planets are not man-made" might shift from the river-bed (hinge) to the water (empirical claim).

  ### Conclusion
  You are right to sense a tension, but Wittgenstein resolves it by dissolving the category of "necessary truth" as it applies to the world.

  1.  **Are they necessary truths?** No. They are **normative certainties**. They look like truths, but they function as rules.
  2.  **How does this square with the river-bed?** The river-bed metaphor confirms that their status is not intrinsic. The "necessity" is a function of their current role in our language-games. As our practices evolve, the hard rock becomes sand, and the sand becomes rock.

  Wittgenstein is not offering a new theory of truth (where some truths are "super-truths"); he is offering a description of human practice. Hinges are not the foundation of the *world*; they are the foundation of our *description* of the world, and since our descriptions are human practices, they are subject to historical change.
