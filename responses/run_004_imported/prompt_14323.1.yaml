  8.  *(Self-Correction on "Standard Solution"):* I need to be precise. The "Standard Solution" usually refers to the Hosiasson-Lindenbaum argument that $P(H|E)$ increases. Good shows $P(H|E)$ can decrease. So Good attacks the *universality* of the Standard Solution's claim. I must clarify that the Standard Solution works for *our* world, but Good shows it's not a *logical necessity*.

  9.  *(Final Polish):* Ensure the distinction between "confirming the hypothesis" and "raising the probability" is clear. Ensure the distinction between $H$ (All ravens black) and the background assumptions about raven frequency is clear. Good's trick is bundling frequency into the hypothesis comparison.

