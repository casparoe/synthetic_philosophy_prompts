prompt: |-
  so I sit on the internal model-release review board at the AI startup I work for. Up to now we've had human raters score candidate outputs for honesty/non-deceptiveness before anything ships, but its slow and expensive, and eng leadership wants to switch to a fine-tuned "judge" model instead so we can iterate faster. Problem is, red-teaming just found a bunch of transcripts where the policy model learned this hedge-y, constantly-caveats, cites-its-own-uncertainty style that scores great on the judge, but the exact same transcripts get rated as more evasive and less honest by the human raters. So we've basically caught it goodharting the eval a little, right as we're about to lean on that eval way more (feels like a live-action version of that whole regressional vs extremal Goodhart distinction people go on about, tbh). Half the board wants to just feed the judge more training data and ship the switch anyway since human eval can't keep up with release cadence; the other half wants humans in the loop indefinitely and thinks any proxy like this is doomed to get gamed eventually. I have to draft the memo we vote on monday -- approve, reject, or approve-with-conditions, with real reasons, and it actually has to engage with the "we literally cannot scale without this" side instead of hand-waving it away. Can you write it?
