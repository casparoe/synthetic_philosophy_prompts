answer: |-
  You are not overthinking this, nor are you necessarily wrong to feel that the dynamic is performative. However, you are also right to sense that there is a "real reason" behind it. What you are observing is a specific type of **social signaling** that serves a function distinct from private intimacy.

  The conflict you feel arises because you are measuring friendship by **private utility** (support, secrets, presence), while your friend group is measuring friendship by **public validation** (status, declaration, shared identity). Neither metric is inherently "true," but they serve different purposes.

  Here is a breakdown of the sociological and psychological mechanisms at play, explaining why the public post often outweighs the private effort in this context.

  ### 1. Costly Signaling Theory
  In evolutionary biology and economics, "costly signaling" explains why animals (and humans) engage in behaviors that seem wasteful. For a signal to be trustworthy, it must be costly to fake. A peacock's tail is heavy and attracts predators; therefore, if a peacock has one, it proves it is healthy enough to survive despite the burden.

  In your friend group, the "cost" of the birthday post isn't just the ten minutes of writing time. The cost is **social vulnerability**.
  *   **Private Text:** Low risk. If the friend doesn't reciprocate, no one knows.
  *   **Public Tribute:** High risk. You are exposing your affection to an audience. If the friendship sours, the post remains as evidence of your vulnerability. You are also risking social judgment (e.g., "Is this post cringe?" "Did they try hard enough?").

  By paying this "social cost," the poster signals: *"I value this friendship enough to risk embarrassment and invest social capital in you."* A private text, while sincere, lacks this risk component, making it a "cheaper" signal in the economy of your group's social hierarchy.

  ### 2. Dyadic vs. Triadic Friendship
  You view friendship as **dyadic** (just you and the friend). In this view, what happens between the two of you is all that matters.
  However, teenage and young adult friendships are often **triadic** or networked (You + Friend + The Group).

  *   **The Private Text** affirms the dyadic bond. It says, "I care about you."
  *   **The Public Post** affirms the triadic bond. It says, "I care about you, and I want *everyone else to know* that you are important to me."

  When your friend was hurt by the two-word comment, it wasn't just about the lack of words. It was a **status demotion**. In a group where public tributes are the norm, failing to post signals to the rest of the network: *"This person is not in my inner circle."* The hurt comes from the feeling of being hidden or deprioritized within the social ecosystem, not necessarily from a lack of private care.

  ### 3. Specificity as Proof of Shared History
  You mentioned that the posts include "specific inside jokes." This is crucial.
  *   A private text saying "I love you, you're the best" is generic. It could be sent to five different people.
  *   A public post referencing a specific trip, a nickname, or a shared trauma proves **exclusive access**.

  It functions as evidence that the poster possesses "insider knowledge." In a way, it is a public certification of intimacy. It tells the audience, *"I know this person deeply enough to curate this specific narrative about them."* Private acts of service (like keeping a secret) are invisible evidence; the post is visible evidence. In a social media-driven culture, visible evidence often carries more weight because it can be witnessed and verified by the group.

  ### 4. Identity Construction
  For teenagers and young adults, social media is not just a communication tool; it is an **identity archive**.
  *   The birthday post is a ritual that cements the friend's role in the poster's life story.
  *   By posting, you are integrating them into your public persona.

  When someone doesn't post, it can feel like they are keeping you separate from their "public self." This explains why you feel a sting even though you find the practice performative. The sting comes from the realization: *"I am part of their private life, but I am not part of their public identity."* That distinction hurts because it suggests a limit to how integrated the friendship truly is.

  ### So, is it "empty"?
  It is **performative**, but that does not make it **empty**.
  *   **Rituals are performative by definition.** A wedding vow is a performance. A toast at a dinner is a performance. But they serve the vital function of solidifying bonds in front of witnesses.
  *   **The "Empty" Part:** You are correct that a paragraph does not *prove* someone will show up for you in a crisis. A person can write a beautiful tribute and be a flaky friend. Relying solely on posts as a metric for friendship quality is indeed shallow.
  *   **The "Real" Part:** The post *does* prove that the person is willing to allocate social resources to you. It proves they are willing to align their public image with yours. That is a genuine form of social support, even if it isn't emotional support.

  ### Why You Feel the Sting
  You feel the sting because you are bilingual in two different languages of friendship.
  1.  **Language A (Your preference):** Acts of service, privacy, consistency.
  2.  **Language B (Your group's norm):** Public affirmation, curation, visibility.

  When a friend fails to post, they are failing to speak Language B. Even though you prefer Language A, you live in a community that speaks Language B. Therefore, you understand the insult implied by the silence, even if you don't agree with the grammar. You interpret the silence as, "They don't value me," because in your group's specific culture, that is what the silence signifies.

  ### How to Navigate This
  You don't have to abandon your values to understand theirs.
  *   **Acknowledge the Function:** Recognize that for your friends, the post *is* the gift. It is the modern equivalent of a framed photo or a public toast. Withholding it feels like withholding a gift.
  *   **Calibrate Expectations:** Understand that a friend who posts elaborately might still be unreliable in a crisis, and a friend who stays silent might be your rock. Try to decouple the "Public Signal" from the "Private Reality" in your head.
  *   **The Compromise:** You don't have to write an essay. But if the "sting" is real, consider that a medium-effort post (a good photo and a genuine sentence) might bridge the gap. It respects the group ritual without requiring you to be fully performative.
  *   **Communicate (Carefully):** With your *closest* friends (the ones where you feel the sting most), you can occasionally verbalize your preference. "I know I'm bad at the big posts, but I wanted you to know privately how much I appreciate you." This reinforces the private bond while acknowledging the public norm.

  **Summary:** You are right that it is performative, but wrong that it is meaningless. It is a **social tax** paid to maintain standing within the group's hierarchy. The hurt you feel is the cost of opting out of a ritual that your community uses to define belonging. Understanding it as a ritual rather than a measure of true caring might help you decide how much of that tax you are willing to pay.
