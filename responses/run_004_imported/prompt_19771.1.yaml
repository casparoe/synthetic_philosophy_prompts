answer: |-
  The coffee shop was quiet enough for the scratch of pens to be audible. Alex stirred an iced latte, watching the condensation slide down the glass. Jordan had a notebook open, filled with columns of numbers.

  "So," Jordan said, tapping the page. "Fifty flips. Sixty percent heads. Even money payout. I'm betting the whole bankroll on every flip."

  Alex winced, physically. "You're joking. You know that if a single tail comes up—and the odds of *no* tails in fifty flips are roughly one in ten billion—you end with zero."

  "I end with zero *most* of the time," Jordan corrected. "But I end with roughly a quadrillion times my starting bankroll in the one universe where I don't. My expected wealth is maximized by going all-in. That's the definition of rational choice: maximize expected utility. If my utility is linear with money, I bet everything."

  "This is exactly the problem," Alex said, leaning forward. "You're treating wealth like it's additive. It's not. It's multiplicative. When you bet, you're not playing against an ensemble of parallel Jordans; you're playing against time. You are a single trajectory. In your strategy, the time-average of your wealth goes to zero. The ensemble-average goes to a quadrillion. But you don't live in the ensemble. You live in the time stream. In the time stream, you're broke."

  Jordan capped their pen. "Okay, the ergodicity argument. I've heard it. 'Time averages don't equal ensemble averages.' Fine. But that's a description of the physics, not a prescription for rationality. You're smuggling in a preference for the median outcome over the mean and calling it 'objective.' Why *should* I care about the median? If I have a 1-in-10-billion chance to win enough money to solve climate change, and the cost is being broke the other 99.99999999% of the time, the Expected Value (EV) maximizer says take it. The Kelly maximizer says 'no, that's not geometrically rational.' But who decided geometric growth is the only god?"

  "Compounding decided," Alex said. "It's not a preference; it's a constraint. Look at the math. If you bet 100% of your bankroll, your growth rate per flip is determined by the geometric mean of the outcomes. Since one outcome is zero, the geometric mean is zero. Your long-run growth rate is negative infinity. You aren't just risking ruin; you are guaranteeing it as $N$ goes to infinity. Kelly isn't about being risk-averse. It's about not deleting yourself from the game."

  "But $N$ isn't infinity," Jordan shot back. "It's fifty. In a finite horizon, the 'guarantee' of ruin is just a very high probability. And yes, I accept that probability. You keep saying Kelly is 'objectively correct' for repeated bets. But that's only true if your goal is to maximize the *rate* of growth over an indefinite horizon. What if my goal is to maximize the *absolute dollar amount* I have after flip fifty? Then EV maximization is objectively correct. You're conflating the strategy with the objective function."

  Alex sighed, tracing a circle on the table with a wet coaster. "I'm not conflating them. I'm saying the objective function you're describing—linear utility of terminal wealth—is pathological for a repeated bettor. If you maximize $E[W_T]$, you are effectively valuing the outcomes where you win everything infinitely more than the outcomes where you survive. You're saying that having \$10 is not just slightly better than having \$0, but that having \$10^15 is a quadrillion times better than having \$10. Is that true? Can you even spend that?"

  "Maybe I can't," Jordan said. "But that's a utility argument, not a probability argument. If I admit I have diminishing marginal utility of money, then sure, I'll bet less than 100%. Maybe I bet Kelly. But that's because I have *log utility*, not because Kelly is 'true.' You geometric rationalists act like log utility is a law of thermodynamics. It's not. It's a preference. A risk-neutral agent *should* bet everything. If they go broke, that's just variance. They made the correct decision with the information they had."

  "Here's where I push back on the 'variance' claim," Alex said. "In a non-ergodic system, variance isn't just noise. It's structural. When you lose 50% of your bankroll, you need a 100% gain to get back to even. When you lose 100%, you need an infinite gain. The asymmetry of compounding means that volatility acts as a drag on growth. Kelly removes the drag. It's not about 'risk' in the psychological sense. It's about the mathematical fact that $(1+x)(1-x) < 1$. Volatility eats return. If you ignore that, you aren't being 'rational'; you're miscalculating the mechanics of how wealth propagates."

  Jordan nodded slowly. "I agree volatility eats return *if* you care about the geometric mean. But why must I care about the geometric mean? Suppose I'm an AI. I don't eat. I don't have a lifestyle. I just want to maximize the total number of dollars printed in my name across the multiverse of possible outcomes. I don't care about *my* specific path, because 'I' am just the algorithm. The algorithm's performance is measured by expected value. In that case, betting 100% is optimal. You're assuming the bettor is a biological human who needs to survive to bet another day."

  "But you *are* a biological human," Alex countered. "And even if you were an AI, if you're reinvesting profits, you are subject to the same multiplicative dynamics. The 'multiverse' doesn't pay your rent. The specific branch you inhabit does. To say 'I don't care about the path' is to say 'I don't care about reality.' The ensemble average is a fiction. It's a calculation of what would happen to a million clones. You have one life. The Kelly criterion is simply the strategy that aligns your math with the fact that you cannot average across parallel lives."

  "Okay, but let's talk about the 'objectivity' claim," Jordan pressed. "You say Kelly is objectively correct for repeated bets. But suppose I have a debt of \$1 million due after flip fifty. If I bet Kelly at 20%, my expected terminal wealth might be \$500,000. If I bet 100%, my expected terminal wealth is \$10 million, even if the probability of having it is 0.0000001%. If I *need* \$1 million, the Kelly strategy guarantees I fail. The 'all-in' strategy gives me a non-zero chance of success. Which is more rational? Failing with certainty, or failing with 99.99% probability but winning big with 0.01%?"

  Alex paused. "That's a goal-specific constraint. If you have a fixed target, Kelly isn't always the answer. You'd optimize for probability of reaching the target. But in the absence of a specific target, where the goal is simply 'more wealth,' Kelly dominates. It maximizes the almost-sure asymptotic growth rate. Any other strategy will, with probability one, result in less wealth than Kelly in the long run."

  "'In the long run' is doing a lot of work there," Jordan said. "Keynes. 'In the long run we are all dead.' Fifty flips isn't the long run. It's a medium run. In the medium run, the EV-maximizer can vastly outperform the Kelly bettor in the upper percentiles. Look at the distribution. The Kelly bettor clusters tightly around the median. The EV bettor has a massive right tail. If I'm playing a tournament where only the top 0.001% of bankrolls advance, I *must* bet more than Kelly. Kelly is a strategy for survival and steady growth. It is not a strategy for winning a lottery where the prize goes to the single richest participant."

  "So you admit it's about preferences," Alex said.

  "I admit it's about the payoff structure," Jordan replied. "If the payoff is 'stay in the game,' Kelly wins. If the payoff is 'maximize the arithmetic mean of the outcome,' EV wins. You guys get annoyed when people call Kelly 'risk management.' You say it's 'growth optimization.' But it *is* risk management. It's managing the risk of path-dependence. And that's a valid preference! But don't tell me it's the *only* rational preference. A rational agent with linear utility and a finite horizon *should* ignore the geometric mean."

  Alex took a sip of the latte, thinking. "I think my frustration comes from people using EV to justify betting sizes that ignore the non-ergodic nature of reality. They say, 'The EV is positive, so I bet big.' But if 'big' wipes you out, the positive EV is a mirage. It's real in the math, but inaccessible in the physical world. It's like saying a bridge is safe because the average load across a million theoretical bridges holds, even if this specific bridge collapses."

  "And my frustration," Jordan said, "is that Kelly advocates treat the 'mirage' as irrelevant. But that huge expected value *is* real in the sense that it represents the fair price of the gamble. If someone offered to buy my position after flip forty-nine, the EV price is what they should pay. The fact that I'm unlikely to be the one collecting it doesn't make the value disappear. It just means the value is concentrated in rare states of the world. If I can hedge those states—if I can sell insurance on my ruin—then I can capture that EV without the ruin. Kelly is optimal only when you are isolated and forced to reinvest."

  "Fair," Alex conceded. "If you can hedge, you change the game. But in a pick'em pool, or the stock market without perfect hedging, you are isolated. You are forced to reinvest your own returns. In that specific context, claiming EV maximization is 'rational' ignores the mechanism of compounding. It treats money as tokens rather than fuel."

  "And in that specific context," Jordan said, "I agree. But don't universalize it. Don't say I'm irrational for betting big because I have a specific utility function that values the tail. I'm not maximizing growth rate. I'm maximizing expected impact. If I go broke, I lose nothing I value more than the chance of that quadrillion-dollar win."

  Alex smiled faintly. "So we agree on the math. We disagree on the metaphysics. You think wealth is a score. I think wealth is fuel."

  "I think wealth is a score *until* it runs out," Jordan said. "Then it's a game over screen. But if the high score is high enough, maybe the game over is worth it."

  "And I think," Alex said, tapping the notebook, "that the only way to keep playing the game is to respect the fuel. But I suppose if you only plan to play fifty rounds, burning the fuel might get you further than conserving it."

  "Exactly," Jordan said, closing the notebook. "Fifty rounds. I'm taking the risk. But if we were playing five thousand rounds? I'd probably listen to you."

  "Then we're not arguing about rationality," Alex said. "We're arguing about the horizon."

  "Maybe," Jordan stood up. "Or maybe you're just afraid of the variance."

  "And maybe," Alex replied, "you're just in love with the outlier."

  They both laughed, and the bill was split evenly.
