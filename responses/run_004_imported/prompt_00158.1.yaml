answer: |-
  The pressure gauge on Reactor Four hovered in the green, steady as a heartbeat. It was 4:55 PM on a Friday. The weekly review was Monday morning, and the data set was incomplete without the overnight run.

  Elias leaned against the bench, rubbing eyes gritty from screen glare. "Protocol says purge the line for ten minutes before sealing."

  Mara didn't look up from her notebook. She was working the adjacent station, identical setup, identical batch of solvent. "Ten minutes? The seal held last week. And the week before. The gauge isn't lying, Elias."

  "It's not about the gauge. It's about the micro-fractures."

  "Visible inspection was clean," Mara said, capping her vial with a sharp click. "We lose forty minutes on purge, we miss the window. The PI wants efficiency."

  Elias looked at the clock. 4:57 PM. He looked at Mara. She was competent, meticulous, the same tier of senior postdoc as him. They had trained under the same safety officer. They were looking at the same green gauge.

  "Skip the purge," Elias said. It wasn't a question.

  "Skip the purge," Mara echoed.

  They turned their valves simultaneously. The hum of the ventilation system swallowed the sound. They packed their bags together, walked out together, and locked the lab door together.

  ***

  Monday morning arrived with the usual sterile chill. Elias walked into the lab at 8:00 AM. Reactor Four sat silent and intact. The data log showed a perfect pressure curve throughout the night. He printed the graphs, poured a coffee, and waited for the meeting.

  Dr. Aris, the PI, clapped him on the shoulder during the review. "Excellent turnaround, Elias. This is the kind of initiative we need. Getting the job done without unnecessary bottlenecks."

  The other postdocs nodded. Someone made a joke about Elias having a magic touch. The safety officer, sitting in the back, glanced at the log but said nothing. The outcome was clean, so the decision was validated by the result. Elias felt a warm flush of pride, indistinguishable from virtue.

  Mara did not attend the meeting.

  Her station was cordoned off with yellow tape. Reactor Three had failed at 2:13 AM. A micro-fracture, invisible to the naked eye, had given way under pressure. A fine mist of caustic solvent had sprayed into the hood, bypassing the sash gap. A grad student working late at the neighboring bench had taken the splash.

  The injury wasn't life-threatening, but the nerve damage in the student's left hand was permanent. Grip strength was down by sixty percent. The career of a promising researcher altered by a spray of chemicals.

  Elias found Mara in the parking lot an hour later. She was loading a box into her sedan. She wasn't fired—tenure protections and union rules prevented that—but she was suspended pending a full safety audit. Her access keys were disabled.

  Elias leaned against the bumper of his own car. He held two coffees. He offered one. Mara took it, her hands shaking slightly.

  "Aris called me a model of efficiency," Elias said quietly. "He called you a liability."

  Mara stared at the cardboard box in her trunk. It held her personal effects: a mug, a framed photo of her dog, a lab notebook now deemed evidence. "We stood at the same bench. We looked at the same gauge. We said the same words."

  "I know."

  "Did I make a worse choice than you, Elias?"

  He hesitated. The air smelled of exhaust and rain. In the lab, the narrative was already set. Elias was the star who optimized the workflow. Mara was the careless operator who broke a student's hand. The moral weight of their Friday evening decision had been assigned entirely by the randomness of molecular stress fractures.

  "You got caught," Elias said. It sounded weak even to him.

  "Caught?" Mara turned to him. Her eyes were dry, but hard. "There was nothing to catch. The fracture was there or it wasn't. I didn't know. You didn't know. We accepted the same risk."

  "But someone got hurt."

  "Because of luck," she said. "Not because of intent. Not because of negligence. Because of luck." She slammed the trunk lid. The sound echoed off the concrete walls of the garage. "If my reactor held, I'd be in there right now getting praised for my efficiency. If yours had blown, you'd be packing a box."

  Elias looked at his own hands. They were steady. He felt the weight of his access badge in his pocket. It felt heavier than it had an hour ago. "So what do we do with that?"

  Mara opened her car door. She paused, looking back at the lab building looming above them, a monument to controlled variables and unpredictable humans.

  "That's the question, isn't it?" she said. "If our worth is decided by the roll of a die we can't see, then who are we actually judging? The person who chose? Or the world that answered?"

  She got in and started the engine. Elias stood alone in the parking lot, watching her taillights disappear into the tunnel, wondering if the badge in his pocket proved he was good, or just lucky.
