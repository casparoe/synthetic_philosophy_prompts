      *   **Point 3: The Fugitive Slave Clause (Article IV, Section 2).**
          *   *Douglass's view:* It doesn't say "slave." It could apply to indentured servants. The text is neutral.
          *   *Counter-view:* In 1787 (and 1860), everyone knew this was about slaves. Indentured servitude was dying. This clause nationalized the enforcement of local property laws regarding humans. It stripped free states of the right to grant asylum. It made the federal government a slave-catching agency. This contradicts the "blessings of liberty" for the enslaved.
      *   **Point 4: The "Silence" Argument.**
