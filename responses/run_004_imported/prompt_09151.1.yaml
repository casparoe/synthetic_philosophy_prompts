  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the thesis. Garrison was right because the Constitution's legal machinery enforced slavery, regardless of rhetorical flourishes. Douglass's textualism ignores legal reality.
      *   **Point 1: The Nature of Legal Interpretation (Effect vs. Aspiration).** Challenge Douglass's separation of "stated ends" from "operative clauses." A contract is defined by its obligations, not its preamble. If the obligations uphold slavery, the contract upholds slavery.
      *   **Point 2: The Three-Fifths Clause (Article I, Section 2).**
          *   *Douglass's view:* It reduced Southern power (compared to counting all slaves) and didn't explicitly call them slaves.
