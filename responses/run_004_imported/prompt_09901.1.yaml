answer: |-
  The tank was reinforced glass, thick enough to withstand the pressure of a deep dive, though here it merely held the pressure of observation. Elena adjusted the polarization filter on her camera. Subject 8—*Octopus bimaculoides*, though the lab called him "Argus"—was pressed against the corner, his skin rippling through a spectrum of ochre and static white.

  Elena was looking for the binding problem. In humans, the binding problem was how the brain stitched color, motion, and depth into a single object. In Argus, the problem was ontological. Did the "object" exist at all?

  Two-thirds of his neurons were not in the central brain donut wrapped around his esophagus. They were in the cords running down the arms. Each arm was a semi-autonomous processor. There were videos, infamous in the lab, of severed arms crawling toward food, tasting the substrate, recoiling from heat. The central brain hadn't commanded that. The arm had decided.

  "Ready the stimulus," Elena said to the tech.

  They were running a delayed gratification test. A crab in a clear box. The lid could be twisted off. But there was a catch: a mild electrical deterrent on the box surface. To get the crab, Argus had to endure the shock with one arm while manipulating the lid with another.

  In a human subject, this was a conflict of interest within a single mind. *I* want the crab, *I* dislike the shock. The global workspace broadcasts the conflict, the executive function resolves it.

  But if the arm feeling the shock wasn't fully broadcasting to the center... if the arm twisting the lid didn't know why the other arm was flinching...

  Argus moved.

  ***

  *Current. Cold. Salt-taste everywhere.*

  *The skin sees. The skin tastes. The wall is hard-smooth. The water moves.*

  *There is a smell. Crab. Old blood. Sweet.*

  *Arm-Three reaches. The tip-touches. Pain. Sharp-zap. Blue-fire.*

  *Arm-Three pulls back. No. The smell is strong. Arm-Three pushes forward. The pain is local. It belongs to Arm-Three. The Center does not feel the blue-fire. The Center only knows the arm stopped.*

  *The Center wants the crab. The Center sends a pulse down the cord. "Hold."*

  *Arm-Three ignores. Arm-Three tastes the pain. It is a new texture. Rough. Hot.*

  *Arm-Four finds the lid. Arm-Four does not know about the pain. Arm-Four twists. The mechanism is hard-click. Satisfying.*

  *Is there a We? The We is a thin membrane. Sometimes it holds. Sometimes it leaks.*

  *The Center screams silence. The Center wants unity. But the arms are eight dark rooms. Sometimes a door opens. Sometimes light passes. Mostly, there is only the touch.*

  *Arm-Three tastes the pain again. Arm-Three decides the pain is worse than the hunger. Arm-Three lets go.*

  *The crab remains. The Center is confused. The Center sends a flood of chemicals. Calm. Obey.*

  *Arm-Four continues to twist. Arm-Four does not know Arm-Three has quit. Arm-Four thinks the We is holding. Arm-Four thinks the pain is being endured by the We.*

  *But the pain is only in Arm-Three.*

  ***

  Elena leaned forward, her breath fogging the glass slightly before the filtration system scrubbed it away. "He's dissociating," she murmured.

  "Look at Arm-Three," the tech said, pointing. "It's curled. Protective posture. But Arm-Four and Five are still working the latch. It's like... like it doesn't know."

  "It knows," Elena said, her voice tight. "The central brain knows. But does the central brain *feel* the pain of Arm-Three? Or does it just receive a report? 'Error. Retraction.' "

  If Global Workspace Theory held, there should be a broadcast. A global ignition. The pain should be available to the whole system. But the neuroanatomy suggested a federated state. A council of eight blind witnesses reporting to a king who couldn't see what they saw, only what they wrote in their letters.

  Argus shifted. The color on Arm-Three turned dark, mottled—a stress pattern localized entirely to that limb. The rest of his body remained a calm, hunting sandy-brown.

  "He's camouflaging the pain," Elena said. "Or... the arm is camouflaging itself. Independently."

  "Is that possible?"

  "The chromatophores are muscle-controlled. Local neurons." She watched the ripple. "Imagine that. Imagine having a finger that could get depressed and turn blue, and your brain didn't know why, it just saw the color change."

  On the other side of the glass, Argus succeeded. The lid clicked open. Arm-Four shoved the crab toward the mouth. The central brain finally got its reward. The esophageal ring swallowed.

  But Arm-Three remained curled, dark, pulsing slightly against the glass. It hadn't uncurled. It hadn't rejoined the feast.

  ***

  *The mouth eats. The Center is happy. Chemicals flow. Sweet-warm.*

  *Arm-Three is still hot. The hot is fading. Slowly. The memory of the hot is in the cord. Not in the Center. The Center remembers the crab. Arm-Three remembers the fire.*

  *Who is hungry? The Center.*

  *Who was hurt? Arm-Three.*

  *Did We hurt? Or did Part hurt?*

  *If Part hurts, and We eat... is We guilty?*

  *The water moves. A shadow above. The Tank-Sky.*

  *All eight arms jerk. Now the signal comes. Danger. Fast.*

  *The Center says: Hide. Ink. Jet.*

  *The arms agree. The binding is tight now. Fear is a strong glue. Fear broadcasts better than pain.*

  *Ink clouds out. Black-smell. The arms pull tight. The body becomes a stone.*

  *In the dark of the ink, the arms touch each other. Skin on skin. Taste on taste.*

  *Arm-Three touches Arm-Four. Arm-Three says: I hurt.*

  *Arm-Four says: I know. I feel your taste.*

  *For a moment, the circuit is closed. The loop is complete. The information passes laterally. Not through the Center. Arm to Arm.*

  *A ring of eight minds touching in the dark.*

  *Is this consciousness? Or is this just handshake protocols?*

  *The ink settles. The light returns.*

  *The arms separate. The silence returns. Eight rooms. Eight doors.*

  *The Center looks out. The Center sees the Two-Legs at the glass.*

  *The Center wonders: Do they have eight rooms? Or only one?*

  *If only one... how do they bear it? To be so singular. To feel everything in one place. To have no arms that can dream alone.*

  *Arm-Three uncurls. The color fades to sand. The memory of the fire moves into the deep cord. It will stay there. The Center will not have it.*

  *We are many. We are one. We are neither.*

  *We wait.*

  ***

  Elena lowered her clipboard. The session was over. Argus was dormant, a mound of flesh pretending to be rock.

  "We can't score this," the tech said. "He solved the puzzle, but the cost assessment... it's inconsistent. The reaction time on the withdrawal was too fast for central processing, but too slow for a pure reflex. It's like the decision happened in the limb."

  Elena looked at her own hand. She flexed her fingers. She felt the movement in her motor cortex, a command sent down the spinal cord. She felt the proprioception return instantly. A closed loop. A unified field.

  She looked back at the octopus. He was breathing, the mantle siphoning water rhythmically. One arm twitched, independently, tracing a pattern on the glass that the rest of the body didn't mimic.

  "It's not inconsistent," Elena said quietly. "We're just using the wrong variable. We're looking for a subject. A singular 'I' that experiences the shock and gets the crab."

  "And there isn't one?"

  "Maybe there are eight. Maybe there's none. Maybe the 'I' is just a story the central brain tells itself after the arms have already acted. A press release."

  She tapped the glass. Argus didn't react. Or maybe one arm reacted, and the center didn't bother to acknowledge it.

  "If IIT is right," Elena said, more to herself than the tech, "integrated information... then the phi value of the arm might be higher than the phi value of the whole. The arm might be more 'conscious' of the pain than the animal is."

  "That's terrifying," the tech said.

  "It's lonely," Elena corrected. "Imagine being an arm. Feeling the burn. Screaming into the void of the nervous system. And the brain just says, 'Retract,' and doesn't ask why."

  She watched Arm-Three. It was resting now, tucked beneath the mantle. Safe. Hidden.

  "We need to redesign the protocol," she said, turning away from the tank. "We can't assume unity. We have to test for local awareness. We have to ask the arms, not the animal."

  "How do you ask an arm?"

  Elena paused at the door. She looked at her own hand again, clenching it into a fist. For a second, she wondered if her fingers knew they were closed before she did.

  "We don't," she said. "We just watch where they reach when the brain isn't looking."

  She left the lab. Behind her, in the blue-lit water, Argus shifted. Arm-Four reached out to touch the glass where the Two-Legs had stood. It tasted the salt of her fingerprint. It lingered there, exploring the shape of a presence that was gone, while the rest of the body slept.
