answer: |-
  The ice in Elena's glass clinked against the side as she set it down. The hotel bar was finally quieting, the hum of the post-workshop crowd reduced to a few stragglers.

  "Nice talk, Marcus," Elena said, swirling her scotch. "But you sidestepped the pump. Again."

  Marcus sighed, loosening his tie. "I didn't sidestep it. I dissolved it. The money pump only works if I'm naive."

  "Let's run it," Elena said, leaning in. "Standard cycle. You have an Apple. You prefer Banana to Apple, Cherry to Banana, and Apple to Cherry. I'm the bookie. I offer you the Banana for free. You take it, because you prefer it. Then I offer the Cherry for free. You take it. Then I offer the Apple back for one cent. You pay, because you prefer Apple to Cherry. You end up with the Apple minus a cent. You've lost money for nothing. That is the definition of irrational."

  "Only if I'm a sequence of temporal slices instead of a single agent," Marcus countered. "I see the pump coming at t-zero. I adopt a plan: *Keep the Apple.* When you offer the Banana at t-one, I refuse."

  "But at t-one," Elena pressed, "you prefer the Banana. You literally rank it higher. If you keep the Apple, you are knowingly choosing the option you judge to be less valuable. You're violating local dominance. How is that rationality? It sounds like weakness of will."

  "It's resolute choice," Marcus said firmly. "Rationality is diachronic. It's about maximizing utility over the whole trajectory, not capitulating to every local preference shift. I bind my future self to the plan that protects me from exploitation."

  "So you admit it," Elena said, pointing a finger. "At the moment of choice, you are acting against your current preference. You're saying, 'I want the Banana more, but I'll take the Apple because I said so.' That's not rationality; that's self-coercion. And here's the real question: is that 'I said so' factor actually a preference? If you choose Apple over Banana at t-one, don't you effectively prefer Apple to Banana at t-one?"

  Marcus shook his head. "No. My taste for fruit hasn't changed. The preference cycle remains. But my choice function incorporates the plan. I'm not changing my mind about the fruit; I'm changing how I adjudicate choices over time."

  "That sounds like a preference change wearing a trenchcoat," Elena shot back. "You're smuggling in a new preference for 'consistency' or 'stubbornness' that outweighs the fruit preference. If you truly all-things-considered prefer the Banana at t-one, choosing the Apple is irrational. If you choose the Apple, you must prefer it. If you prefer it, there's no cycle. You've saved your rationality by falsifying your preferences."

  "I'm not falsifying anything," Marcus insisted. "I'm acknowledging that I'm an extended agent. If I don't resolve, I'm just a money pump with a pulse. You want me to say that because I can be pumped, my preferences are invalid. I say that because I can plan, the pump is irrelevant."

  "But the cost!" Elena exclaimed. "To maintain this 'agency,' you have to ignore what you want right now. You're saying rationality requires ignoring your own judgment at the moment of action. That severs the link between preference and choice. If preference doesn't guide choice, what does it do? Just sit there looking pretty?"

  "It guides the plan," Marcus said. "The plan is the unit of agency. Look, would you rather be the person who loses the cent because they kept their resolve, or the person who loses the cent because they couldn't stop trading?"

  "The first person is stubborn," Elena said, finishing her drink. "The second person is exploitable. But the first person is also claiming they prefer the Banana while picking the Apple. I think McClennen bought you a free lunch, Marcus, but he charged you for the meal in coherence."

  Marcus smiled thinly. "I'll pay the tab. At least I'll stick to the plan."

  "See?" Elena grinned. "You'd prefer to keep your money. But you'll pay to prove a point. Maybe we're all just pumping ourselves."
