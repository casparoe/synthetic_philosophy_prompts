answer: |-
  Your intuition is spot on. You have identified a classic logical trap known in philosophy and decision theory as **Pascal's Mugging**.

  The vendor is using a broken application of Expected Value (EV) theory to bypass normal budget scrutiny. While it is true that security teams *should* care about low-probability, high-impact events (the "Black Swan" concept), the vendor's specific argument contains several critical flaws that invalidate the sales pitch.

  Here is a breakdown of why this reasoning is flawed and how your team can push back.

  ### 1. The "Infinity" Problem (Pascal's Wager)
  The vendor is treating the impact of a breach as effectively **infinite** ("company-ending"). In Expected Value math ($EV = \text{Probability} \times \text{Impact}$), if the Impact is infinite, then *any* non-zero probability results in an infinite Expected Loss.

  If you accept this logic, you must spend **every dollar your company has** to prevent this risk. Why? Because if the loss is infinite, a $6M spend is rational, but so is a $600M spend, and so is spending 100% of the company's revenue.
  *   **The Flaw:** No business impact is actually infinite. Even a catastrophic breach has a finite cost (lawsuits, fines, recovery, lost revenue). Once you cap the impact at a finite dollar amount (e.g., $500M), the probability *does* matter. If the probability is 1/100,000 and the loss is $500M, the Expected Loss is only $5,000. Spending $6M to protect against a $5,000 expected loss is bad math.

  ### 2. The "Probability Doesn't Matter" Shrug
  The most telling moment was when the salesperson shrugged at the probability changing from 1/2,000 to 1/100,000.
  *   **The Flaw:** That is a **50x difference**. In risk management, orders of magnitude matter immensely. By saying the probability doesn't change the decision, the vendor is admitting that **this is not a risk calculation; it is a tax.** They are arguing that you should pay regardless of the actual risk, which removes the objective basis for the purchase.
  *   **The Reality:** If the probability is truly that low, the capital is better spent on risks with higher probability (e.g., ransomware, phishing, unpatched servers), which are statistically much more likely to actually end the company in the next 5 years.

  ### 3. Opportunity Cost and Portfolio Theory
  Security budgets are finite. Every dollar spent on "quantum readiness" is a dollar *not* spent on something else.
  *   **The Flaw:** The vendor is evaluating this project in a vacuum. Rational security spending uses **Portfolio Theory**. You have to ask: "Is this the *best* use of $6M to reduce overall company risk?"
  *   **The Reality:** It is highly unlikely that a $6M quantum migration reduces more risk than $6M worth of endpoint detection, employee training, or identity management. By focusing on the "existential" quantum threat, the vendor is distracting you from the "probable" existential threats (like ransomware) that are actively targeting you *now*.

  ### 4. Technical Nuance: "Harvest Now, Decrypt Later"
  The vendor is conflating two different risks:
  1.  **Future Risk:** A quantum computer appears in 5 years and cracks traffic encrypted *at that time*.
  2.  **Current Risk (HNDL):** Adversaries are stealing encrypted data *now* and storing it to crack later when quantum computers exist.

  *   **The Flaw:** The HNDL risk only applies to data with a **shelf-life longer than the time-to-quantum.** If your data is only sensitive for 3 years (e.g., internal chat logs, short-term contracts), and quantum computers are 5+ years away, that data is useless to an attacker by the time they can crack it.
  *   **The Reality:** You do not need to migrate *everything*. You only need to migrate long-term secrets (state secrets, proprietary formulas, long-term PII). A blanket $6M migration suggests the vendor isn't distinguishing between data that matters in 10 years and data that matters in 10 days.

  ### 5. Solution Effectiveness (Crypto-Agility)
  The vendor is likely pitching a "rip and replace" migration.
  *   **The Flaw:** Quantum computing standards (NIST Post-Quantum Cryptography) are still being finalized. Buying a proprietary "quantum ready" solution now might lock you into a standard that gets broken or deprecated in 3 years.
  *   **The Reality:** The industry best practice right now is **Crypto-Agility**, not necessarily a full immediate migration. This means building systems that can swap out encryption algorithms easily without a $6M overhaul. Paying $6M for a static solution today might be wasted money if the algorithm needs to change in 2026.

  ### How to Push Back
  Your CTO can counter this pitch with the following points:

  1.  **Demand a Finite Impact Number:** "Please provide a quantified financial impact model for a breach. 'Company-ending' is not a number. If we cap the loss at $X, does the EV still justify $6M?"
  2.  **Invoke Opportunity Cost:** "Show us a comparison of risk reduction per dollar between this project and hardening our identity infrastructure against current ransomware threats."
  3.  **Data Classification:** "We will only migrate data with a confidentiality shelf-life exceeding 10 years. A blanket migration is not acceptable."
  4.  **NIST Compliance:** "We will not migrate until NIST standards are fully finalized and implemented in open-source libraries. We are not paying for proprietary 'quantum' wrappers."
  5.  **Name the Fallacy:** It is perfectly professional to say, "This argument relies on Pascal's Mugging. We cannot make budget decisions based on non-zero probabilities of infinite loss. We need finite risk modeling."

  ### Summary
  You are not wrong to be bugged. This is a sophisticated fear-selling tactic that exploits a known loophole in risk mathematics. While "quantum readiness" is a real strategic goal for the next 5–10 years, using it to justify an immediate, expensive, blanket migration via broken Expected Value math is a red flag.

  **The verdict:** The logic is flawed. Don't buy the pitch.
