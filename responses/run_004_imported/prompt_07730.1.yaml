answer: |-
  Welcome to the rabbit hole. It's a familiar feeling for someone with your background: you look at a problem, apply the standard physical intuition of causality, and conclude the philosophers are speaking nonsense.

  Here is the good news: **You are right that backward causation is a non-starter.**

  Here is the better news: **Almost no serious one-boxer believes in backward causation either.**

  If you talk to a one-boxing decision theorist and ask, "Do you think my hand moving now changes the content of the box yesterday?" they will say "No." If they say "Yes," they are a fringe mystic, not a mainstream decision theorist.

  So why do they one-box? It comes down to a disagreement about what a "decision" actually *is*. As a physicist, you view a decision as a physical event in time. Many decision theorists (especially the modern ones) view a decision as the output of a logical algorithm.

  Here is the breakdown of why smart people defend one-boxing without smuggling in time travel.

  ### 1. The Common Cause Argument (The "Barometer" Analogy)
  Your objection relies on **Causal Decision Theory (CDT)**. CDT says: *An action is rational if it causally brings about the best outcome.* Since your choice happens after the box is sealed, it cannot causally affect the box. Therefore, two-box.

  However, one-boxers often argue from **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**. They argue that your choice and the box's content are **correlated effects of a common cause**.

  Think of it like this:
  *   **Event A:** A drop in atmospheric pressure.
  *   **Event B:** The barometer needle drops.
  *   **Event C:** A storm arrives.

  The barometer dropping doesn't *cause* the storm. But if you see the barometer drop, you expect a storm. If you could magically force the barometer needle to stay up (without changing the pressure), the storm would still come.

  In Newcomb's Problem:
  *   **The Common Cause:** Your brain state / decision algorithm prior to the moment of choice.
  *   **Effect 1:** Omega observes this state and fills the box.
  *   **Effect 2:** You execute the choice based on this state.

  Omega didn't predict the future; Omega predicted the *present state of your brain* that inevitably leads to your choice. When you "choose" to one-box, you aren't reaching back in time to fill the box. You are confirming that you are the *type of agent* whose box was filled.

  To a physicist, this looks like a block universe or determinism issue. If the universe is deterministic (or even just predictable enough for Omega), your "choice" is just the unfolding of initial conditions that Omega already measured. Two-boxing is essentially saying, "I know the initial conditions determined the box content, but I'm going to pretend my local action is independent of those conditions."

  ### 2. Logical Dependence (The "Algorithm" Argument)
  This is the strongest argument for one-boxing and the one that usually resonates best with people from hard sciences. It's championed by researchers like Eliezer Yudkowsky (MIRI) and Caspar Oesterheld.

  This view (Functional Decision Theory) argues that you shouldn't think of yourself as a physical agent making a choice in time, but as a **logical algorithm** producing an output.

  *   Omega runs a simulation of you.
  *   The simulation runs the same source code as your brain.
  *   When you sit there deliberating, you are effectively running the same computation as the simulation did yesterday.

  If you output "Two-Box," the simulation (which is mathematically isomorphic to you) output "Two-Box." Therefore, the box is empty.
  If you output "One-Box," the simulation output "One-Box." Therefore, the box is full.

  This isn't backward causation. It's **logical identity**.
  $2 + 2 = 4$ is true here, now. It was also true in Omega's simulation yesterday. Your calculating it now doesn't *make* it true in the past; it means that the truth value is timeless.

  If you accept that Omega's prediction is based on a model of *you*, then your decision procedure and Omega's prediction are logically entangled. You cannot change the past, but you can determine which logical branch of reality you inhabit.

  **The Physics Analogy:**
  Imagine entangled particles. Measuring one doesn't "send a signal" to the other to change its state retroactively or faster than light; rather, they share a joint state. In Newcomb's problem, You and Omega's Prediction share a joint logical state. Two-boxing is trying to treat them as independent variables when the problem setup defines them as dependent.

  ### 3. The Pragmatic Check (Who gets the money?)
  Finally, there is the "shut up and calculate" argument.

  If we run this experiment 1,000 times:
  *   The Two-Boxers (CDT) walk away with \$1,000 each time (because Omega predicts they will two-box).
  *   The One-Boxers (EDT/FDT) walk away with \$1,000,000 each time.

  If the goal of decision theory is to prescribe actions that lead to winning, CDT fails Newcomb's Problem. It leaves money on the table because it is overly attached to a specific definition of "causal influence."

  As a physicist, you might say, "But the Two-Boxer is *right* about the physics!"
  The response is: "Sure, they have the correct causal model, but they are poor. The One-Boxer has a 'magical' sounding model, but they are rich."

  ### So, are they smuggling in time travel?
  No. They are smuggling in **determinism** and **logical realism**.

  *   **CDT (Your view):** Assumes free will in a libertarian sense (I can choose otherwise regardless of prior states). It treats the decision as a causal intervention *ex nihilo*.
  *   **FDT/One-Boxing:** Assumes the decision is the output of a function determined by prior states (which Omega accessed).

  You are frustrated because you view the "choice" as a physical intervention on the world. They view the "choice" as the revelation of a logical fact.

  ### Why you shouldn't feel crazy
  You are in good company. Judea Pearl (the father of causal Bayesian networks) is a two-boxer. He argues that if causality doesn't flow backward, you take both boxes. He respects the one-boxers but thinks they are confusing correlation with causation.

  However, the one-boxers argue that Pearl's framework is insufficient for problems involving predictors (or AI, or game theory with perfect information).

  **The Verdict:**
  You aren't missing physics. You are missing a shift in the definition of "agency."
  *   If you think you are a **physical force** acting on the world: Two-box.
  *   If you think you are a **computation** determining an outcome: One-box.

  The philosophers defending one-boxing aren't claiming you can change the past. They are claiming that **you are the same mathematical object that Omega predicted,** and you can't logically diverge from that prediction without contradicting the setup of the problem.

  It's not time travel. It's just that in a universe with perfect predictors, "causality" is the wrong tool for the job; "logic" is the right one.
