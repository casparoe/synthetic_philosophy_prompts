prompt: |-
  I'm about halfway through a novel set in Vienna in the late 1920s, and one of my side characters is a pretty transparent stand-in for Carnap (fictionalized enough to dodge any estate lawyers, but anyone who knows the Vienna Circle will clock him instantly). I've been doing a deep dive into the real guy so his dialogue doesn't read like generic "philosopher says wise things," and I've hit a snag that's bugging me more than it probably should.

  Carnap's famous for the "principle of tolerance" — the idea that there's no single correct logic or language, you just construct whatever formal system is useful for the purpose at hand, no metaphysical court of appeals needed. But the same guy was apparently a committed socialist who thought a rationally planned economy was basically the scientifically sound way to organize a society, not just one option among equally valid ones. That feels like a genuine contradiction to me: how does someone get to be the "there's no one right framework, just pick what works" guy in logic, and then sound almost dogmatic about which economic system is correct everywhere else? Did he ever square this himself, or is my character allowed to just be a bit of a hypocrite here, or is there some distinction I'm not tracking?

  This is for a café scene where he's sparring with a Neurath-type character, so I'd really like the philosophical content to actually hold up rather then just sound smart. Any help untangling this before I put words in a dead logician's mouth would be great.
