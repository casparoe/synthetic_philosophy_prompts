      *   *Was Carnap a Socialist?* Yes. He was a member of the Social Democratic Party. He believed in rational planning.
      *   *Is there a contradiction?* On the surface, yes. "Anything goes in logic" vs. "Socialism is the way in economics."
      *   *How did Carnap reconcile this?*
