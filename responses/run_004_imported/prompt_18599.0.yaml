          *   *Is it forced?* Yes, if you accept the Formula of Humanity. If rational nature is the only thing with dignity, non-rational nature cannot be a direct object of duty. The "indirect" route is the only logical bridge available *within* the system.

  4.  **Drafting the Feedback:**

      *   *Tone:* Supportive, collegial, rigorous (it's grad school), acknowledging the emotional weight (Hazel).
      *   *Structure:* Address the four specific requests in order.
      *   *Key Correction:* The "Amphiboly" terminology. This is the biggest red flag. In the *Metaphysics of Morals*, duties regarding animals are in the *Doctrine of Virtue*, Part I, Chapter 1, Section 17 (§17). There is no "Amphiboly of Moral Concepts" section there. The student might be thinking of the *Critique of Pure Reason* or perhaps a specific commentator's label (Allen Wood sometimes discusses the "ambiguity," but "Amphiboly" is a specific Kantian term reserved for the first Critique). I need to warn them about this terminology risk.
      *   *Textual Accuracy:* Confirm the "to" vs. "regarding" distinction (correct). Confirm the *Lectures* passage (correct).
      *   *Objection:* Validate the empirical claim objection. It's the standard and strongest objection. Mention that Kant views sympathy as a "vicarious" duty aid.
      *   *Citations:* Broadie/Pybus is correct (1974). Korsgaard is accurate enough for a thesis statement, but warn that Korsgaard scholars might push back.
      *   *Thesis:* The "forced by autonomy" claim is strong. The only way out is if one argues Kant *could* have extended "humanity" to include "sentient nature" without breaking the system, but that's a heavy lift. The thesis holds.

  5.  **Refining the Feedback (Self-Correction during drafting):**
      *   *Empathy:* Acknowledge Hazel. This isn't just academic for them.
      *   *Precision:* Don't just say "Amphiboly is wrong." Explain *where* it is in *MS* (Doctrine of Virtue, §17).
      *   *Nuance on Korsgaard:* Korsgaard argues animals are "ends-in-themselves" because they have a *good*. Kant says only rational beings are ends-in-themselves. So the draft is right: she changes the definition.
      *   *Nuance on Empirical Claim:* Kant knows it's empirical, but he thinks it's a *necessary* empirical fact about human psychology. The critique is that it's not necessary enough.

  6.  **Final Polish:** Ensure the tone is encouraging but rigorous enough for a graduate seminar. (Make sure to explicitly mention the "Amphiboly" terminological risk as a priority).

      *(Self-Correction on "Amphiboly"):* Wait, is there *any* chance they mean the "Amphiboly of Moral Concepts of Reflection"? In the *Critique of Judgment*? No. In the *Metaphysics of Morals*? No. This is almost certainly a conflation with the First Critique or a misremembered label from a secondary source. I must highlight this gently but firmly.

      *(Self-Correction on Broadie/Pybus):* "Kant's Treatment of Animals" was published in *Philosophy*, Vol 49, No 188 (1974). So "1970s" is correct.

      *(Self-Correction on Korsgaard):* *Fellow Creatures* was published 2018, but the Locke Lectures were 2002. The ideas have been circulating. The critique that she "replaces" the view is standard.

      *(Final check on the Thesis):* Is the placement *forced*? Yes. If animals had direct moral standing, they would be "persons" in Kant's legal/moral sense. Since they aren't rational, they can't be. Therefore, duties must be indirect. The logic holds.

