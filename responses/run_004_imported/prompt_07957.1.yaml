      *   **Context:** The user is writing a novel (1/3 done). One POV character is a moral philosopher testifying in a murder trial.
      *   **Premise:** Sci-fi setting where it's *proven* the defendant literally could not have done otherwise (determinism/control issue), yet the philosopher argues he is still morally responsible.
      *   **Philosophical Grounding:** The user has been reading about Harry Frankfurt's counterfactual intervener cases (Black/Jones) and John Locke's locked-room case (voluntary stay, locked door).
      *   **Core Question:** Compare Locke and Frankfurt as attacks on the Principle of Alternative Possibilities (PAP). Are they doing the same job? What are the structural differences (specifically regarding the "prior sign" and "flicker of freedom" objections)?
