answer: |-
  You have done your homework. You've identified the two heavyweights in the debate over the Principle of Alternative Possibilities (PAP). To answer your core question immediately: **Locke and Frankfurt are doing structurally different jobs, and for a murder trial where the defendant committed an *action* (not an omission), Frankfurt is the stronger philosophical weapon, despite the technical objections.**

  Here is the breakdown of the resemblance, the structural asymmetry regarding the "prior sign," and the straight answer on which one your character should bet his reputation on.

  ### 1. The Resemblance and The Split
  Both cases aim to sever the link between "Could Have Done Otherwise" and "Moral Responsibility." They both rely on **actual sequence vs. counterfactual sequence.**

  *   **Locke's Locked Room:** The constraint is **actual**. The door is locked *now*. The agent doesn't know it. He chooses to stay.
  *   **Frankfurt's Intervener:** The constraint is **counterfactual**. Black is ready to intervene *if* Jones wavers. But Jones doesn't waver. Black never touches Jones's brain.

  **The Structural Difference:**
  In Locke's case, the inability to do otherwise is a physical fact existing independently of the agent's will. In Frankfurt's case, the inability to do otherwise is *contingent on the agent's will*. Black's mechanism is triggered by Jones's own internal states.

  This matters for your trial. Locke's prisoner is responsible for *staying* (an omission/refrainment). Your defendant is responsible for *killing* (a commission). It is much easier to argue someone is responsible for staying in a room they like than for stabbing a person they might not have wanted to stab. Frankfurt cases are specifically designed to handle **actions**, not just omissions.

  ### 2. The "Prior Sign" and the Flicker of Freedom
  You remembered correctly. This is the biggest vulnerability in Frankfurt's armor, and it's why Locke's case is cleaner but less useful for your specific premise.

  **The Problem:**
  For Black (the intervener) to know *when* to intervene, he needs a signal. He needs to see a "prior sign" in Jones's brain that indicates Jones is *about* to choose ~X (the wrong action).
  *   **If the sign is determined:** Then Jones was never free to avoid the sign. But if the sign determines the action, then determinism is already true *before* Black intervenes. Black becomes redundant. The case collapses into standard determinism.
  *   **If the sign is avoidable:** Then Jones *could have done otherwise* regarding the sign. He could have chosen not to emit the sign. If he can avoid the sign, he preserves a "flicker" of alternative possibility. PAP survives, just shrunk down to a tiny flicker.

  **Why Locke Avoids This:**
  The locked door doesn't monitor Jones's brain. It doesn't need a prior sign. It is just locked. There is no "flicker" of freedom regarding the lock. The asymmetry exists because Frankfurt cases require a **tracking mechanism** (Black watching Jones), whereas Locke's case relies on a **static constraint** (the door).

  ### 3. The Verdict: Which is Stronger?
  You asked me to tell you straight. **Frankfurt is the stronger counterexample to PAP for the purposes of your novel.**

  Here is the real argument, stripped of the academic hedging:

  Locke's case is too easy for the prosecution to dismiss. The opposing lawyer will stand up and say: *"Professor, the man in the room is responsible for staying, yes. But my client didn't just 'stay' at the crime scene; he pulled a trigger. Locke proves we can be responsible for things we can't stop, but it doesn't prove we are responsible for things we were forced to do."* Locke attacks the necessity of alternatives for *voluntariness*, but it leaves a gap for *causal determination*.

  Frankfurt attacks the heart of moral responsibility directly. The argument your character should make is this:

  > **"Moral responsibility depends on *how* the action happened, not on what *might* have happened."**

  In a Frankfurt case, Jones kills the victim *for his own reasons*. Black never touches him. The actual sequence of events—Jones's desires, Jones's reasoning, Jones's motor functions—is identical to a world where Jones was free. The fact that Black *would have* intervened is a fact about a *different* possible world, not this one.

  **The "Flicker" Rebuttal (For your character to use):**
  When the opposing counsel brings up the "prior sign" or the "flicker of freedom," your character should swat it away like a fly. Here is the line of reasoning:

  *"Counsel is arguing that because the defendant theoretically could have hesitated for a microsecond before committing murder, he is free. That is a metaphysical technicality, not a moral reality. A 'flicker' of freedom that makes no difference to the outcome is not the kind of freedom that grounds responsibility. If the actual sequence of events flows from the agent's own character and desires, the existence of a counterfactual intervener is irrelevant. We do not excuse criminals because a police officer was standing outside who would have tackled them if they tried to run. We excuse them only if the action didn't come from them. Here, the action came from him."*

  ### 4. How to Write the Testimony
  If you want your character to sound like he has skin in the game, do not let him recite a history lesson on Locke vs. Frankfurt. He needs to synthesize them.

  **Do not** have him say: *"As Harry Frankfurt argued in 1969..."*
  **Do** have him say: *"Imagine a man who stays in a room because he wants to, not knowing the door is locked. We hold him responsible for staying. Now imagine a man who pulls a trigger because he wants to, not knowing a device would have forced his finger if he hesitated. The lock and the device are different, but the moral math is the same."*

  **The Strategy:**
  1.  **Use Locke for the Jury:** It's intuitive. Everyone understands being stuck somewhere but choosing to make the best of it. It establishes that "could not have done otherwise" does not automatically mean "innocent."
  2.  **Use Frankfurt for the Judge/Record:** This is the heavy artillery against the PAP principle. It justifies why the *sci-fi proof* of determinism doesn't matter.
  3.  **Dismiss the "Flicker":** Have your character treat the "prior sign" objection as a desperate grasp for straws. It makes him look confident. In the heat of a trial, pointing out that a "flicker" of freedom is morally insignificant is a winning move.

  **The Bottom Line:**
  Locke shows that alternative possibilities aren't needed for *voluntary action*. Frankfurt shows that alternative possibilities aren't needed for *moral blameworthiness*. Since this is a murder trial about blameworthiness, **Frankfurt is your guy.** The "prior sign" objection is a known weakness, but a confident philosopher can argue that a freedom which makes no difference to the actual world is a freedom worth nothing.

  Give your character that conviction. He isn't arguing that the defendant *was* free; he's arguing that freedom *doesn't matter* the way the court thinks it does. That is a much more dramatic position.
