      *   *Popper's Intuition:* Science progresses by getting closer to the truth. Even false theories (like Newton) can be better than older false theories (like Aristotle).
      *   *Popper's Mechanism:* He defined verisimilitude ($Vs$) using two sets:
          *   Truth Content ($Ct_T$): The set of true statements entailed by the theory.
          *   Falsity Content ($Ct_F$): The set of false statements entailed by the theory.
      *   *The Rule:* Theory $A$ is closer to truth than Theory $B$ if:
          1.  $A$ has more truth content than $B$ (and no more falsity content), OR
          2.  $A$ has less falsity content than $B$ (and no less truth content).
          *   Basically: More truth, less falsehood.
      *   *The Tichý/Miller Bomb:* They proved that for *false* theories, these two measures move together. You can't increase truth content without *also* increasing falsity content.
      *   *The Analogy:* Imagine a theory is a net cast over reality.
          *   To catch more truth (more specific predictions), you have to weave a finer net.
          *   But if the theory is fundamentally false (the net is the wrong shape), making the net finer catches *more* specific falsehoods too.
          *   If Theory A is "It's raining" (vague) and Theory B is "It's raining heavily at 5pm" (specific).
          *   If it's actually sunny:
              *   A is false.
              *   B is false.
              *   B entails A (so B has all of A's truth content... which is zero, plus more).
              *   But B also entails specific false claims A didn't make.
          *   *The Logical Kicker:* In classical logic, if a theory is false, it entails *all* false statements compatible with it? No, that's explosion. Wait, let's refine.
