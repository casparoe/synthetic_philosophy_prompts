answer: |-
  You are right to suspect that there is a specific body of thought addressing this. Your intuition that a joint plan is morally distinct from a collection of individual plans is supported by significant work in moral philosophy and social ontology.

  The feeling that something was "broken" even though money was offered suggests that the injury wasn't financial, but normative. You aren't missing the entry fee; you are missing the integrity of the "we" that was formed.

  Here is a breakdown of the philosophical and psychological dynamics at play, which should help you articulate why this feels different than a solo runner dropping out.

  ### 1. The Theory of Joint Commitment
  The philosopher **Margaret Gilbert** has written extensively on exactly this scenario in her work on *joint commitment* (most notably in her book *Joint Commitment: How We Make the Social World*).

  Gilbert argues that there is a fundamental difference between "I intend to do X" and "We intend to do X."
  *   **Individual Intention:** If five people independently decide to run a race on the same day, they have five individual intentions. If one quits, the other four are unaffected morally.
  *   **Joint Commitment:** When you pool money, coordinate training, and assign legs, you create a **plural subject**. You are no longer five individuals acting in parallel; you are one team acting as a unit.

  According to Gilbert, once a joint commitment is established, no single party has the right to unilaterally rescind it. To dissolve a joint commitment, you need the concurrence of the other parties. By announcing she was out rather than asking to be released, your teammate treated a joint obligation as an individual preference. She acted as if she were resigning from a club she owned, rather than a partnership she co-authored.

  ### 2. The Principle of Fidelity (Reliance)
  The moral philosopher **T.M. Scanlon**, in *What We Owe to Each Other*, outlines the "Principle of Fidelity." It roughly states: If you voluntarily lead others to expect that you will do something, and they rely on that expectation to their potential detriment, you cannot simply choose not to do it without special justification.

  In your scenario:
  *   **Expectation:** She said she was "in."
  *   **Reliance:** You built training runs around her pace and availability. You pooled funds. You likely turned down other opportunities (other races, different training blocks) based on her participation.
  *   **Detriment:** Even if she pays for the substitute, the *coordination cost* is a detriment. The training block you built together is now disrupted.

  The solo runner analogy fails here because a solo runner creates no reliance in others. Your teammate created a web of reliance and then cut her strand, assuming the web would hold.

  ### 3. The Market vs. The Social
  The teammate's offer to pay for a substitute reveals a clash of frameworks. She is operating in a **market framework**: *I have caused a financial loss; I will reimburse the loss; therefore, we are even.*

  You and the others are operating in a **social framework**: *We created a shared goal based on trust; you have withdrawn your agency from our shared goal; the trust is damaged.*

  Money can compensate for a loss of assets, but it cannot compensate for a loss of shared agency. By offering money, she may have inadvertently signaled that she views the agreement as transactional rather than relational. This often deepens the feeling of being wronged because it misses the point of the injury.

  ### 4. Autonomy vs. Obligation
  However, to be fair to your teammate, there is a counter-argument rooted in **personal autonomy**.

  Philosophers like **David Hume** or modern libertarians might argue that without a formal contract, moral obligations are limited. If her new job creates a genuine conflict (not just an inconvenience), forcing her to honor a verbal agreement made over drinks could be seen as holding her hostage to a past self that no longer exists.

  Furthermore, there is the question of **proportionality**. A marathon relay is a high-commitment event. Some might argue that a verbal agreement over drinks is too flimsy a foundation for such a heavy obligation. If the "entry fee" into the commitment was too low (just words), perhaps the "exit fee" should also be low.

  ### 5. Why It Feels Different Than a Solo Race
  To answer your specific question: **Yes, there is a meaningful sense in which you are owed something.**

  When you run solo, you are the sole beneficiary and the sole risk-bearer of your decision. When you run a relay, you become a **link in a chain**.
  *   **Interdependence:** In a relay, your performance (or participation) is a necessary condition for the others' success. You aren't just running *near* them; you are running *for* them.
  *   **The "We" Agent:** When she quit, she didn't just change her plan; she dismantled the team's plan. The remaining four cannot simply "continue" as before; you must find a substitute, adjust legs, and recalibrate morale. The entity "The Team" was injured.

  ### Synthesis: How to Think About the Disagreement
  The disagreement stems from different definitions of what happened that night over drinks.
  *   **Her view:** We formed a *coordination of intentions*. "I intend to run, provided you do." When her situation changed, her intention changed.
  *   **Your view:** We formed a *joint commitment*. "We intend to run." This created a new moral entity that binds the individuals.

  **Who is right?**
  In the context of close friends undertaking a difficult physical challenge together, **your view is the socially dominant one.** In collaborative endeavors, the norm is that unilateral withdrawal requires a high bar of justification and, crucially, a process of negotiation (asking to be let go) rather than declaration (saying I am gone).

  **The Verdict:**
  She was not necessarily "wrong" to prioritize her new job. Life changes. However, she was likely wrong in *how* she handled the exit. She treated a joint commitment as an individual option. The feeling of being wronged is valid because the social contract of the team was breached, even if the financial contract was honored.

  **Moving Forward:**
  Understanding this might help the two friends who feel wronged process the emotion. It wasn't about the money; it was about the dissolution of the "we." Acknowledging that a normative boundary was crossed—even if unintentionally—validates their feelings without requiring them to demand she run the race. It allows you to say, "We understand you have to quit, but we want you to understand that this changes the nature of our collaboration, not just the logistics."
