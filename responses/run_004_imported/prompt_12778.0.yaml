answer: |-
  This is one of the most profound and confusing distinctions in statistics. It feels like black magic because, in a way, it is: you are swapping one definition of "truth" for another.

  The short version is: **Frequentist statistics tracks the behavior of the *experimenter*, while Bayesian statistics tracks the state of the *world*.**

  When you peek, you change the experimenter's behavior, which breaks the Frequentist math. But you don't change the state of the world, so the Bayesian math holds up.

  Here is the mechanical walkthrough of why that is, followed by how this fuels the replication crisis.

  ---

  ### 1. The Frequentist Mechanics: Why Peeking Breaks the P-Value

  To understand why peeking is forbidden in frequentism, you have to understand what a p-value actually is. It is **not** "the probability the null hypothesis is true."

  A p-value is: *The probability of observing data this extreme (or more), assuming the null is true, **given the specific experimental procedure used.**"*

  That bolded part is the killer. The p-value depends on the **Sampling Distribution**. The sampling distribution is a theoretical map of all the possible outcomes you *could have* observed if you ran this experiment infinite times.

  #### The "Dice" Analogy
  Imagine you are testing if a die is loaded to roll 6s.
  *   **Scenario A (Fixed Sample):** You promise to roll the die exactly 10 times. You get three 6s.
  *   **Scenario B (Optional Stopping):** You promise to roll the die *until* you get three 6s. It happens to take 10 rolls.

  In both scenarios, the **data** is identical: 10 rolls, three 6s.
  But the **p-value** will be different. Why?

  In **Scenario A**, the "universe of possibilities" includes outcomes where you rolled 10 times and got zero 6s, one 6, etc.
  In **Scenario B**, the "universe of possibilities" *excludes* any outcome where you stopped before 10 rolls. You *couldn't* have stopped at 5 rolls with three 6s, because the rule says you keep going.

  By peeking at an A/B test, you are implicitly changing from Scenario A to Scenario B. You are saying, "I will check the data, and if it looks significant, I will stop."

  #### The Inflation Mechanism
  When you peek, you give yourself multiple "shots on goal" to cross the significance threshold ($p < 0.05$).
  1.  **Day 1:** You check. Noise might push the metric up. $p = 0.08$. You keep going.
  2.  **Day 3:** You check. Noise pushes it up again. $p = 0.04$. **You stop and declare victory.**

  If you had waited until Day 7 (your original plan), the noise might have regressed to the mean, and $p$ would be $0.20$.

  Because you gave yourself multiple opportunities to catch a random noise spike, the long-run error rate (Type I error) is no longer 5%. It might be 20% or 30% depending on how often you peeked. The p-value calculation assumes you only looked once. Since you lied about your procedure (by peeking), the p-value is mathematically invalid.

  **Frequentist Conclusion:** The validity of the inference depends on your *intentions* (when you planned to stop). If your intentions change based on the data, the error rate guarantees vanish.

  ---

  ### 2. The Bayesian Mechanics: Why Peeking is (Mostly) Fine

  Bayesian inference asks a different question: *"Given the data I have observed, what is the probability distribution of the effect size?"*

  This relies on **Bayes' Theorem**:
  $$ \text{Posterior} \propto \text{Likelihood} \times \text{Prior} $$

  #### The Likelihood Principle
  The core mechanical reason peeking doesn't break Bayes is something called the **Likelihood Principle**. It states that all the evidence provided by the data is contained in the **Likelihood Function**.

  The Likelihood Function is simply: $P(\text{Data} | \text{Hypothesis})$.
  It asks: "If the true effect was X, how likely is it that I would see *this specific data*?"

  Crucially, the Likelihood Function **does not care about data you didn't collect.** It does not care about "possible worlds" where you stopped earlier or later. It only cares about the data sitting in front of you right now.

  *   **Frequentist:** "How likely is this data, considering all the times I *could have* stopped?"
  *   **Bayesian:** "How likely is this data, period?"

  #### The GPS Analogy
  Think of a Bayesian posterior like a GPS location estimate.
  *   You start with a Prior (your last known location).
  *   You get a signal (new data).
  *   The GPS updates your location (Posterior).

  Does it matter if you checked the GPS 5 minutes ago? No. The GPS calculates your current location based on the *current* satellite signals. Checking it early doesn't change where you are now, nor does it change the math of how the satellite triangulates your position.

  If you peek at your A/B test on Day 3, you calculate a posterior. On Day 7, you get more data, and you update that posterior. The Day 7 posterior simply incorporates the Day 3 data + New Data. The math remains coherent because you are just updating a state of belief. You aren't trying to control a long-run error rate; you are trying to quantify current uncertainty.

  **Bayesian Conclusion:** The validity of the inference depends only on the *data observed* and the *model used*. The stopping rule is irrelevant to the calculation of the posterior.

  ---

  ### 3. The Catch: Inference vs. Decision

  Here is where the "black magic" warning label comes in. While peeking doesn't break the *math of the posterior*, it can still break your *business decisions*.

  If you say, "I will ship the feature as soon as the Bayesian probability of uplift > 95%," you have introduced a **Decision Rule**.

  If you peek constantly and apply that decision rule, you *can* still be misled by noise, especially if your Prior is weak. You might catch a temporary noise spike that hits 95% probability, ship it, and then the effect regresses.

  *   **Frequentist:** Controls the error rate of the *decision* (long run).
  *   **Bayesian:** Controls the coherence of the *belief* (current state).

  If you use Bayesian methods but treat the posterior probability like a frequentist p-value (a hard threshold for stopping), you can still run into trouble. However, Bayesians argue this is a failure of the *decision rule*, not the *inference*. A pure Bayesian would say, "The probability is 95% right now. But if I wait, the cost of waiting might be lower than the cost of making a wrong decision." They factor the *cost* of peeking into the decision, not the validity of the math.

  ---

  ### 4. Connection to the Replication Crisis

  This mechanical difference is a primary engine of the replication crisis.

  **1. The Incentive to Peek (P-Hacking)**
  In the frequentist world, $p < 0.05$ is a cliff. You fall off and you get published/promoted. You stay on and you get nothing.
  Because researchers are human, they peek. They see $p = 0.06$, so they collect 10 more samples. They peek again. $p = 0.04$. They stop and publish.
  Because the p-value is invalid (due to the peeking), the finding is likely a false positive. When other labs try to replicate it using a fixed sample size, the effect disappears.

  **2. The File Drawer Problem**
  Frequentist significance is binary. If you peek and the data never crosses the threshold, you might abandon the experiment and never publish it. If you peek and it crosses, you publish. This creates a literature full of "lucky" noise spikes that passed the threshold, while the "unlucky" null results are hidden in file drawers.

  **3. Bayesian Mitigation**
  Bayesian inference is continuous. There is no magic cliff at 0.05.
  *   **Scenario:** You peek. The probability of uplift is 80%.
  *   **Frequentist Reaction:** "Not significant. Keep collecting data until it hits 95% (or 5% significance)." -> *Incentivizes gaming.*
  *   **Bayesian Reaction:** "There is an 80% chance this works. Is that good enough to ship? Maybe. If not, let's collect more data to see if it moves to 85% or drops to 50%."

  Because the Bayesian output is a distribution of belief rather than a pass/fail test, the incentive to "game until significant" is reduced. You report the uncertainty as it is, rather than hunting for a threshold that invalidates the uncertainty calculation.

  ### Summary

  *   **Frequentist:** You are a referee enforcing rules on a game. If the player (experimenter) changes the rules mid-game (peeking/stopping), the referee's scorecard (p-value) is void. The math relies on knowing the *plan*.
  *   **Bayesian:** You are a cartographer drawing a map. Every new piece of data (peeking) just adds detail to the map. The map is accurate based on the terrain you've seen so far, regardless of when you decided to stop drawing. The math relies on the *data*.

  The replication crisis happened because we treated p-values as "truth detectors" when they are actually "procedure compliance certificates." When researchers violated the procedure (by peeking) but treated the certificate as truth, we filled the scientific literature with false positives. Bayesian methods don't solve every problem, but by removing the dependency on the experimenter's intentions, they remove the primary mechanism for this specific type of cheating.
