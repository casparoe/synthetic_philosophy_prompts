answer: |-
  The short, frustrating answer is: **No.** There is no voting system for three or more candidates that is both democratic and completely immune to tactical voting.

  Your intuition is correct, and your colleague's behavior is a textbook example of why political scientists and mathematicians have spent the last century proving that "perfect" voting is impossible.

  Here is the breakdown of why this happened, the theorem that proves it's unavoidable, and what it means for your jury.

  ### 1. The Theorem: Gibbard-Satterthwaite
  You are looking for a property called **strategy-proofness** (or truthfulness). A system is strategy-proof if a voter never gains an advantage by lying about their preferences.

  In the early 1970s, Allan Gibbard and Mark Satterthwaite independently proved a theorem that is essentially the voting theory equivalent of Gödel's Incompleteness Theorems. The **Gibbard-Satterthwaite Theorem** states that for any voting system that chooses a single winner from three or more candidates, one of three things must be true:

  1.  **It is Dictatorial:** One person's vote always determines the winner.
  2.  **It restricts choices:** The system only allows for two possible outcomes to ever win (effectively reducing it to a binary choice).
  3.  **It is manipulable:** There will always be scenarios where a voter can get a better outcome by voting dishonestly.

  Since your jury wants a democratic process (not a dictatorship) and you have five finalists (more than two options), you are mathematically guaranteed to be in category #3. **Tactical voting is not a bug; it is a feature of any fair system with 3+ options.**

  ### 2. Why Ranked-Choice Voting (RCV) Didn't Save You
  There is a common misconception that Ranked-Choice Voting (specifically Instant Runoff Voting) eliminates the "spoiler effect" and tactical voting. It reduces *some* types of strategic voting (like the "wasted vote" fear in Plurality voting), but it introduces others.

  Your colleague engaged in a strategy called **Compromising**.
  *   **The Scenario:** She liked Candidate A (favorite, low viability), Candidate B (solid, high viability), and hated Candidate C.
  *   **The Fear:** She calculated that if she ranked A first, A would be eliminated early, and her vote would transfer to someone who might help C win.
  *   **The Move:** She ranked B first to ensure A's elimination didn't hurt her, effectively "compromising" to block C.

  RCV is actually susceptible to several other paradoxes, too. For example, it can fail the **monotonicity criterion**, meaning that in some rare cases, ranking a candidate *higher* can cause them to lose, or ranking them *lower* can cause them to win. This complexity actually makes tactical voting *harder* to calculate for the average voter, but for a savvy jury member (like your colleague), it creates new avenues for gaming.

  ### 3. Are There "Better" Systems?
  While no system is *immune*, some are more *resistant* or change the *type* of strategy required.

  *   **Condorcet Methods:** These systems elect the candidate who would beat every other candidate in a head-to-head matchup. They are generally more robust against "spoilers" than RCV, but the Gibbard-Satterthwaite theorem still applies. You can still game them by "burying" a strong competitor (ranking them last even if you like them) to ensure they lose the head-to-head comparisons.
  *   **Score (Range) Voting:** Instead of ranking, judges give a score (e.g., 1 to 10). This captures *intensity* of preference (how much you love the winner vs. how much you tolerate the runner-up). However, it is also not strategy-proof. The optimal strategy in Score Voting is often "min-maxing"—giving your favorite a 10 and everyone else a 0, even if you actually like the second choice quite a bit. This leads to exaggeration rather than ranking manipulation, but it is still dishonest.
  *   **Random Dictator:** You pick one judge at random, and their #1 choice wins. This is technically strategy-proof (you just vote your true favorite), but it's obviously unacceptable for a prize jury.

  ### 4. The "Single-Peaked" Exception (That Doesn't Apply to You)
  There is one niche mathematical exception. If voter preferences are **single-peaked**, majority rule is strategy-proof.
  *   *What it means:* Imagine candidates on a line from Left to Right. If every voter prefers candidates closer to their ideal point, preferences are single-peaked.
  *   *Why it fails for journalism:* This works for political spectrums or budget amounts. It does not work for art, journalism, or science writing. Aesthetic judgment is multidimensional. You might prefer Piece A for its clarity, Piece B for its investigation, and Piece C for its narrative voice. There is no linear spectrum, so the exception doesn't hold.

  ### 5. So, What Should a Jury Do?
  If math says you can't fix the voting system, how do you fix the process?

  **1. Deliberation > Aggregation**
  Social Choice Theory assumes voters are isolated atoms who just submit ballots. But a jury is a **deliberative body**. The goal of a jury isn't just to aggregate pre-existing preferences (which leads to the problems you described); it's to *change* preferences through argument.
  *   If your colleague thinks Piece A has "no shot," that is a prediction about *other people's* votes, not a judgment of quality.
  *   In a good jury process, she should argue *why* Piece A is good. If she convinces others, it suddenly *does* have a shot. Voting should be the last step, used only to formalize a consensus, not to discover one.

  **2. Accept the Imperfection**
  If you must vote without discussion, acknowledge that RCV is not a truth machine. It is a method for finding a consensus winner that minimizes intense opposition. Your colleague's behavior was rational within the system. The system invited her to be a strategist rather than a critic.

  **3. Consider Score Voting with Calibration**
  If you switch systems, Score Voting (0–5 stars) is often preferred by small juries because it allows for nuance ("This was good, but *that* was a masterpiece"). To reduce min-maxing, some juries require a "calibration" round where judges discuss what a "3" vs. a "5" looks like before voting.

  ### Summary
  You haven't missed a loophole. **Honest voting is mathematically impossible to guarantee in a fair system with three or more options.**

  Your colleague didn't break the system; she played the game theory that underpins it. For a science journalism prize, where nuance matters, the best defense against tactical voting isn't a better algorithm—it's more conversation before the ballots are cast.
