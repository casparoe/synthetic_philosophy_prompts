  7.  **Final Polish:**
      *   Ensure the tone is helpful for a writer. Don't just say "wrong," say "here's how to make it work" or "here's the more interesting conflict."
      *   Highlight that fiction allows extrapolation, but understanding the *actual* tension (confabulation vs. reality) might be more compelling than a sci-fi style internal dialogue.

  8.  **Self-Correction/Edge Cases:**
