answer: |-
  Your intuition is spot on, and your classmate has stumbled upon one of the most famous problems in probability theory: the **St. Petersburg Paradox**. 

  While his math is technically correct in a vacuum, it fails because it relies on assumptions that don't exist in the real world. Here is how to explain the discrepancy and determine a fair price.

  ### 1. Why the Math says "Infinity"
  Your classmate calculated the **Expected Value (EV)** by multiplying the probability of each outcome by its payout:
  *   **Flip 1:** 50% chance to win $2 (Contribution: $1)
  *   **Flip 2:** 25% chance to win $4 (Contribution: $1)
  *   **Flip 3:** 12.5% chance to win $8 (Contribution: $1)

  Because the payout ($2^n$) always perfectly cancels out the probability ($1/2^n$), every possible outcome adds exactly $1 to the total. Summing $1 + 1 + 1...$ forever results in an infinite expected value.

  ### 2. What’s Wrong with the Reasoning?
  The math is perfect, but the **model** is flawed because it assumes two things that are impossible in reality:

  **A. The "Infinite Bankroll" Fallacy**
  The math assumes the classmate can pay out any amount. However, if the coin lands on Heads 30 times in a row, the payout would be **$2,147,483,648**. No school club has that much money. 
  *   **The Fix:** If you cap the maximum payout at a realistic amount (e.g., $1,024), the "infinite" series stops, and the expected value drops to a manageable **$10**.

  **B. The "Utility" Fallacy**
  Economics teaches that money has **diminishing marginal utility**. Winning $1,000,000 is life-changing, but winning $2,000,000 isn't "twice as good"—it’s just "a bit better." Because the value of money doesn't grow linearly with the number of digits, a rational person won't pay a high fee for a 1-in-a-million chance at a billion dollars.

  ### 3. How to Determine a Fair Price
  To find a price that is both "mathematically fair" and "psychologically acceptable," use the **Bankroll Cap Method**:

  1.  **Determine the Cap:** Decide the maximum amount the club can afford to lose (e.g., $1,024).
  2.  **Calculate the EV:** With a $1,024 cap, the math shows the average payout is only **$10**.
  3.  **Factor in "Risk of Ruin":** Even if the average is $10, there is a 93.75% chance the player wins $8 or less. Most people are risk-averse and won't pay the average if the odds of a "big win" are slim.

  ### Summary for Your Club
  *   **The "Math" Price:** $10 (Based on a $1,024 bankroll cap).
  *   **The "Real World" Price:** $5. 
      *   *Why?* It covers the average cost of the game while ensuring the club makes a profit on the 75% of players who only win $2 or $4.
  *   **The Argument:** Tell your classmate that while the *theoretical* value is infinite, the *practical* value is limited by the club's budget and the players' risk aversion.
