prompt: |-
  I'm taking a seminar on population ethics this term, and we've just spent two weeks working through Parfit's original statement of the repugnant conclusion in *Reasons and Persons*, the mere addition paradox, and Arrhenius's impossibility theorems, which show that every population axiology satisfying a handful of minimally plausible conditions ends up committed to something monstrous — the repugnant conclusion itself, the sadistic conclusion, or worse. Next month our department's ethics reading group is hosting a guest speaker: a population axiologist who, unlike the average utilitarians and critical-level theorists we've been reading, doesn't try to design her way around the repugnant conclusion but argues we should simply accept it. Her signature move, which shows up in at least two of the papers we've been assigned, is to say that the conclusion only strikes us as repugnant because human intuition is hopeless at multiplying small goods across astronomically large populations, and that since every rival axiology inherits some comparably counterintuitive implication of its own, courtesy of the impossibility results, objecting to hers just relocates the problem rather than solving it.

  I've been asked to write the questions for the Q&A after her talk, which is being recorded for the reading group's podcast, so I'd rather not spend the slot letting her simply restate that scope-insensitivity defense. Could you draft seven or eight questions that press on the actual weak points of the move? I'd like at least one question that turns the underlying spectrum-style argument back on itself, by asking whether a long chain of individually plausible trade-offs is really guaranteed to preserve plausibility all the way to its endpoint; one that asks her to compare the plain repugnant conclusion with a version that also mixes real suffering into the added population, to see whether "every theory pays some cost" still sounds adequate once agony rather than mere mediocrity is on the table; and one asking why we should keep trusting the aggregative, more-is-better intuition that generates the repugnant conclusion in the first place if intuitions about large numbers are supposedly unreliable everywhere else. For each question, please add a short follow-up keyed to the response she's most likely to give, and end the list with a question about what would actually count as evidence against her position, rather than just another cost for her to absorb.
