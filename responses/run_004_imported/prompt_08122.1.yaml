prompt: |-
  Hey, odd request — I've got a critical-care physician on the podcast next week; she's basically become the media's go-to defender of the whole-brain-death standard as it's used in the US, and I dont want the conversation to collapse into the usual 'but her heart's still beating' back-and-forth. Can you draft me like 8 interview questions that actually get into the weeds? I want at least one pressing on the fact that plenty of patients who pass whole-brain tests still have working hypothalamic/pituitary function, wich seems to contradict the textbook line that ALL functions of the entire brain have to be gone; one on Shewmon's old case series of brain-dead bodies that kept healing wounds and growing for years on a vent; and one on why circulatory-death protocols for organ donation lean on 'permanent' rather than 'irreversible' cessation of circulation, since those aren't actually the same claim. For each question, tack on a quick follow-up keyed to whatever answer she's likely to give to wriggle out of it.
