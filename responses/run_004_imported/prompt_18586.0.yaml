answer: |-
  This is a sharp question that cuts to the heart of why the metaphysics of dispositions matters for more than just semantics. You have correctly identified the standard received view: David Lewis's 1997 reform of the Conditional Analysis (often called the **Reformed Conditional Analysis** or **RCA**) is widely understood to successfully absorb *finkish* counterexamples while remaining vulnerable to *masking* counterexamples.

  The asymmetry arises from how Lewis modifies the antecedent of the counterfactual conditional to include the **retention of the categorical basis**.

  Here is the precise logical structure of that asymmetry, followed by how it maps onto your character psychology.

  ### 1. The Logical Structure of Lewis's Reform

  To understand the asymmetry, we must first formalize Lewis's move. The Simple Conditional Analysis (SCA) failed because it looked like this:
  $$x \text{ is disposed to } M \text{ when } S \iff (S(x) \square\rightarrow M(x))$$

  Lewis argued that a disposition must be grounded in an **intrinsic categorical basis** ($B$). His reform adds $B$ to the antecedent of the counterfactual. Roughly, $x$ has the disposition at time $t$ iff:
  $$\exists B [ \text{Intrinsic}(B) \land x \text{ has } B \text{ at } t \land ((S(x) \land x \text{ retains } B) \square\rightarrow M(x)) ]$$

  The critical logical operator here is the conjunction in the antecedent: **$S \land \text{retain } B$**.
  When we evaluate a counterfactual $P \square\rightarrow Q$, we look at the "closest possible worlds" where $P$ is true. Lewis's reform forces us to look at the closest worlds where **both** the stimulus occurs **and** the basis is retained.

  This specific constraint is what creates the asymmetry between Finks and Masks.

  ### 2. Why Finks are Neutralized

  **The Fink Scenario:**
  *   **Object:** Has basis $B$ (e.g., molecular structure of a live wire).
  *   **Stimulus ($S$):** Touching the wire.
  *   **Fink Mechanism:** If $S$ occurs, the Fink instantly removes $B$ (makes the wire dead) *before* $M$ (shock) can occur.
  *   **Result:** $S$ happens, $B$ vanishes, $M$ does not happen.

  **Lewis's Evaluation:**
  We must evaluate the truth of: $(S \land \text{retain } B) \square\rightarrow M$.
  To find the closest worlds where the antecedent is true, we must find worlds where:
  1.  The wire is touched ($S$).
  2.  The wire **retains** its molecular structure ($B$).

  **The Logical Pivot:**
  In the actual Fink scenario, condition (2) fails because the Fink removes $B$. Therefore, to evaluate Lewis's counterfactual, we must travel to a possible world where the Fink's removal mechanism **does not operate** (or is overridden). We are forced to "turn off" the Fink to satisfy the antecedent clause "retain $B$."

  In a world where the wire is touched ($S$) and the structure remains intact ($B$) because the Fink is inactive, nothing stands in the way of the manifestation. The causal chain from $B + S$ to $M$ completes.
  *   **Result:** $M$ occurs in these closest worlds.
  *   **Truth Value:** The conditional is **True**.
  *   **Verdict:** Lewis's analysis correctly affirms the disposition exists.

  **Summary:** The "retain $B$" clause logically conflicts with the Fink's operation (which is to remove $B$). Satisfying the antecedent requires negating the Fink.

  ### 3. Why Masks Defeat the Analysis

  **The Mask Scenario:**
  *   **Object:** Has basis $B$ (e.g., fragility of a glass).
  *   **Stimulus ($S$):** Striking the glass.
  *   **Mask Mechanism:** A protective field surrounds the glass. If $S$ occurs, the field absorbs the impact. Crucially, the Mask **does not remove $B$**. The glass remains fragile (intrinsically); the mask just stops the breaking.
  *   **Result:** $S$ happens, $B$ remains, $M$ (breaking) does not happen.

  **Lewis's Evaluation:**
  We must evaluate the truth of: $(S \land \text{retain } B) \square\rightarrow M$.
  To find the closest worlds where the antecedent is true, we look for worlds where:
  1.  The glass is struck ($S$).
  2.  The glass **retains** its fragility structure ($B$).

  **The Logical Pivot:**
  In the Mask scenario, condition (2) is *already* true. The Mask does not touch $B$. Therefore, to satisfy the antecedent, we **do not** need to remove the Mask. We can evaluate a world where the Strike occurs, the Fragility ($B$) is retained, *and the Mask is still present*.

  In this world, the Mask still blocks the manifestation. Even though $B$ is present, the causal link from $B + S$ to $M$ is interrupted downstream by the Mask.
  *   **Result:** $M$ does *not* occur in these closest worlds.
  *   **Truth Value:** The conditional is **False**.
  *   **Verdict:** Lewis's analysis incorrectly denies the disposition exists.

  **Summary:** The "retain $B$" clause is logically compatible with the Mask's operation (which leaves $B$ alone). Satisfying the antecedent leaves the Mask intact, allowing it to continue blocking $M$.

  ### 4. The Core Asymmetry

  The distinction rests on **what the interfering mechanism targets**:

  1.  **Finks target the Basis ($B$).** Lewis's analysis makes the retention of $B$ a condition of the evaluation. This forces the evaluation into a world where the Fink is inactive. The disposition shines through.
  2.  **Masks target the Manifestation ($M$) or the Causal Link.** Lewis's analysis only secures the Basis ($B$). It does not secure the *link* between $B$ and $M$. Since the Mask leaves $B$ alone, the evaluation stays in a world where the Mask is active. The disposition is obscured.

  Lewis successfully "internalized" the disposition by tethering it to an intrinsic property ($B$). Finks are external interventions on that property, which the counterfactual brackets out. Masks are external interventions on the *consequences* of that property, which the counterfactual leaves in place.

  ### 5. Application to Your Character's Psychology

  This logical asymmetry offers a rigorous tool for distinguishing two very different types of "failed courage" in your novelist's toolkit.

  **Scenario A: Finkish Courage (Lewis validates this)**
  *   **Psychology:** The character possesses the neural/psychological basis of courage (disposition) in calm moments. However, the moment danger ($S$) appears, a mechanism triggers (panic, dissociation, a magical curse) that *removes the basis of courage* instantly.
  *   **Lewis's View:** At the exact moment of testing, she literally *is not courageous*. The disposition vanished.
  *   **Narrative Implication:** This is a tragedy of identity. She *was* brave, but the brave self ceases to exist when needed. The "retention of basis" counterfactual asks: "If she could have remained herself in that moment, would she have acted?" Lewis says **Yes**. This preserves her essential nobility despite her failure.

  **Scenario B: Masked Courage (Lewis fails to validate this)**
  *   **Psychology:** The character possesses the basis of courage. Danger ($S$) appears. The basis remains (she feels the urge to act, her heart races, her will is steel), but something blocks the action (paralysis, physical restraint, overwhelming external threat).
  *   **Lewis's View:** Because the action ($M$) didn't happen despite the basis ($B$) and stimulus ($S$), his analysis suggests she **lacks the disposition**.
  *   **Narrative Implication:** This is a tragedy of circumstance. Lewis's logic is too rigid here; it cannot see courage that is present but stifled. For your novel, this suggests that if you want her courage to be ontologically "real" despite her inaction, you must lean toward the **Finkish** model (her internal state changes) rather than the **Masked** model (her internal state stays, but the world stops her). Or, you must reject Lewis's metaphysics in favor of a view that allows dispositions to exist even when masked (e.g., a causal powers view).

  **The Precision You Need:**
  If you want her courage to be a "settled fact" that is merely hidden, you are writing a **Mask**. Lewis's logic says this looks indistinguishable from *not having courage*.
  If you want her courage to be a "blinking" fact that vanishes under pressure, you are writing a **Fink**. Lewis's logic says this *is* courage, because counterfactually, if the basis had held, the action would have followed.

  For a character whose courage is "never a settled fact," the **Finkish** interpretation is philosophically richer. It allows you to say: *She is courageous, but the condition of her courage is its own fragility.* The moment it is tested, the test itself destroys the courage required to pass it. Lewis's logic saves her reputation; the Mask logic condemns it.
