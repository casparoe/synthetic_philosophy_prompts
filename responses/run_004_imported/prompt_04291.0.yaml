prompt: |-
  My younger brother just got activated with his National Guard unit and honestly it's got me loosing sleep over what he's actually on the hook for morally if he ends up in a warzone. I fell down a rabbit hole on just war theory and now I can't stop chewing on the Walzer vs. McMahan fight over the "moral equality of combatants." Can you walk through how McMahan's liability-based revisionism actually challenges Walzer's independence thesis (the idea that jus in bello and jus ad bellum are seperate questions)? Specifically, does McMahan's response to the epistemic objection - that an ordinary soldier can't reliably know if their side's cause is just - actually hold up, or is it just a fancy way of saying "not your fault but still wrong"? And which view leaves a soldier like my brother in a better moral position if the war he's sent to turns out to be unjust - justify your answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Older sibling of a National Guard member recently activated. Anxious, losing sleep, deeply engaged in philosophical literature (Just War Theory, Walzer vs. McMahan).
