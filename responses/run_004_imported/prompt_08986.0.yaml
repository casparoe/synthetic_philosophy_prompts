      *   **Subject-Sensitive Invariantism (SSI):** The truth conditions of "S knows that p" are invariant across attributor contexts but depend on the *subject's* practical situation. If the subject has high stakes, the epistemic standard required for knowledge is higher. If the subject has low stakes, the standard is lower. The speaker's context doesn't matter for the truth value, only the subject's situation does.

