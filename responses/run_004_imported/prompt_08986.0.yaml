answer: |-
  This is an excellent challenge. Your skepticism is well-placed; in the history of philosophy, many fierce debates have dissolved once the combatants realized they were assigning different meanings to the same words (the "merely verbal" dispute). However, in the case of Epistemic Contextualism (EC) and Subject-Sensitive Invariantism (SSI), we can construct a "divergence case" where the two theories make contradictory predictions about the truth value of the very same sentence.

  If two theories assign opposite truth values to the same proposition under the same conditions, they are not notational variants. They are substantive rivals.

  Here is the test case, the analysis, and the verdict.

  ### The Test Case: "The Unwitting High-Stakes Subject"

  To pull the loci apart, we need a scenario where the **Attributor's Context** (what matters for EC) and the **Subject's Practical Situation** (what matters for SSI) diverge significantly.

  **The Setup:**
  *   **The Subject (Hannah):** Hannah needs to deposit a paycheck by Saturday. Unbeknownst to everyone else, she is in a **High-Stakes** situation. If the check bounces or is delayed, she will be evicted. Her evidence is moderate: she was at the bank two weeks ago on a Saturday and saw it was open, but she hasn't checked the hours recently. (According to the standard "Bank Case" intuitions, this evidence is sufficient for knowledge in low stakes, but insufficient in high stakes).
  *   **The Attributor (John):** John is a casual acquaintance. He is chatting with a third party about Hannah's weekend plans. He is in a **Low-Stakes** context; he has no interest in Hannah's money, and the conversation is trivial. He is unaware of Hannah's eviction risk.
  *   **The Utterance:** John says, "Hannah knows the bank will be open on Saturday."

  ### The Predictions

  Here is how the two theories process the truth conditions of John's utterance.

  **1. Epistemic Contextualism (EC)**
  *   **The Mechanism:** For the contextualist, the semantic content of the word "knows" shifts depending on the *attributor's* conversational context. The relevant epistemic standard is set by John's context, not Hannah's.
  *   **The Application:** John is in a relaxed, low-stakes conversation. Therefore, the semantic standard for "knows" in this utterance is **low**.
  *   **The Evaluation:** Does Hannah meet the *low* standard with her moderate evidence? Yes. In a low-stakes context, having been to the bank two weeks ago is usually enough to count as "knowing."
  *   **Verdict:** John's utterance is **True**.

  **2. Subject-Sensitive Invariantism (SSI)**
  *   **The Mechanism:** For the SSI theorist (like Stanley or Hawthorne), the semantic content of "knows" is invariant (it doesn't change based on who is speaking), but the *truth conditions* of the knowledge ascription depend on the *subject's* practical environment. The relevant epistemic standard is set by Hannah's stakes.
  *   **The Application:** Hannah is in a high-stakes situation (eviction risk). Therefore, the epistemic standard required for her to truly "know" is **high**.
  *   **The Evaluation:** Does Hannah meet the *high* standard with her moderate evidence? No. Given the severe cost of being wrong, she ought to verify the hours again. Her evidence is insufficient for knowledge in her specific situation.
  *   **Verdict:** John's utterance is **False**.

  ### The Verdict: Substantive Rivals

  You asked whether these views are substantive rivals or merely notational variants of a single underlying idea. Based on the result above, the answer is clear: **They are substantive rivals.**

  Here is why this matters for your concern about "merely verbal" debates:

  **1. Contradictory Truth Values**
  A "notational variant" implies that Theory A and Theory B are describing the same phenomenon using different labels, such that they agree on all observable outcomes. In this case, EC says the sentence is True, and SSI says the sentence is False. They cannot both be right. This is a classic logical contradiction regarding the semantics of natural language. It is analogous to two physical theories where one predicts a particle will be detected at Position X and the other predicts it will not.

  **2. Different Explanatory Parameters**
  The disagreement is not just about the output (True/False); it is about which facts in the world are relevant to determining that output.
  *   **EC** claims the truth of a knowledge claim is sensitive to facts about the *speaker* (John's conversational goals).
  *   **SSI** claims the truth of a knowledge claim is sensitive to facts about the *subject* (Hannah's financial risk).
  These are distinct metaphysical claims about the nature of the knowledge relation.

  **3. The "Merely Verbal" Escape Route (and why it fails)**
  Sometimes, philosophers argue that even if truth conditions differ, the *assertibility conditions* might be the same (i.e., when it is appropriate to say the sentence). If both theories agreed that John *should not assert* the sentence, one might argue the debate is pragmatic, not semantic.
  However, even here, they diverge.
  *   **EC:** Since the utterance is *True* (by low standards), John is generally permitted to assert it (assuming he believes it).
  *   **SSI:** Since the utterance is *False* (by high standards), John is asserting a falsehood.
  Thus, they disagree on the normative status of the speech act as well.

  ### Conclusion

  Your suspicion of verbal debates is a vital heuristic in philosophy, but it does not dissolve this particular puzzle. The "Crossed Contexts" case demonstrates that Contextualism and Subject-Sensitive Invariantism locate the variability of knowledge in fundamentally different places.

  *   **Contextualism** locates the variability in the **language** (the word "knows" changes meaning).
  *   **SSI** locates the variability in the **world** (the relation of knowledge itself changes based on practical facts).

  Because they yield opposite truth values in the "Unwitting High-Stakes Subject" case, they are competing hypotheses about the semantics of epistemic language. Like competing hypotheses in the laboratory, they cannot both be correct, and empirical data (in this case, robust linguistic intuitions about the case) is required to choose between them. The debate is substantive.
