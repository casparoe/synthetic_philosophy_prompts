      *   **Conclusion:** It's about the *logic of assurance*, not the *statistics of transmission*.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly mention that the loss from unilateral Risky is greater than the gain from coordinated Risky. That's the engine of the unraveling. If the loss was small, high-order knowledge *would* suffice. Rubinstein tuned the payoffs to prevent this.

  9.  **Final Polish:** Ensure tone is seminar-appropriate (respectful of their knowledge, but aiming for clarity). Use the "General's Dilemma" analogy as it's classic and intuitive.

