      *   **Broader Question:** What does this imply about the strategic difference between common knowledge and high-order mutual knowledge?
      *   **Goal:** Provide a "gut level" intuition, avoiding heavy formalism where possible, focusing on the epistemic logic and strategic uncertainty.

