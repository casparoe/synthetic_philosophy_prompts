answer: |-
  **The Joke**

  He gestures to the glass in her hand, loud enough for the nearby cluster of first-years to hear.

  "Careful with that. On your view, if we treat this room as actual, that might not be H2O. Honestly, it explains the breakup. I thought I was a rigid designator in your life, but turns out I was just whatever satisfied the 'boyfriend' role in the world considered as actual. Easy to replace when a better candidate fits the description."

  ***

  **Why It Works (Technically)**

  The joke lands because it weaponizes the specific technical disagreement between their schools of thought to insult her integrity. In **direct-reference theory** (his view), names like "David" or natural kind terms like "Water" are **rigid designators**: they pick out the same object/substance in every possible world. If they broke up, it's a necessary fact about *him*.

  In **epistemic two-dimensionalism** (her view), meaning has two layers. The **secondary intension** is the standard Kripkean one (Water = H2O in all counterfactual worlds). But the **primary intension** asks how reference is fixed if we imagine a different scenario **considered as actual** (e.g., if we wake up in a Twin Earth scenario where the lakes are filled with XYZ, "water" refers to XYZ). Her opponents argue that this primary intension is just **descriptivism** smuggled back in—meaning she thinks reference is determined by satisfying a description ("the clear drinkable stuff") rather than a direct link to the object.

  By saying he was just "whatever satisfied the role in the world considered as actual," he is accusing her of treating *him* like a description (a set of properties like "kind," "funny," "grad student") rather than a specific, irreplaceable person. He's claiming she didn't love *him*; she loved the functional role he filled, which anyone else could have satisfied. To a Kripkean, being called a descriptivist is a professional insult; to an ex, being told you're replaceable is a personal one. He manages to do both in one sentence.
