answer: |-
  This is a classic and sophisticated variation of the material constitution puzzle. You have effectively reconstructed a well-known philosophical maneuver: closing the "temporal gap" to force the debate onto purely metaphysical grounds rather than empirical timing.

  However, to answer your question directly: **No, your tightened case does not settle the puzzle in favor of there being just one object, and yes, you were likely too quick to set the modal point aside.**

  Here is a breakdown of why your friend's objection carries more weight in contemporary metaphysics, and why the "actual properties only" strategy faces significant hurdles.

  ### 1. The Status of Modal Properties
  Your core move was to argue that merely possible divergences (what *could* happen to the lump vs. the statue) are not properties of the *actual* object sitting on the pedestal. Therefore, they shouldn't trigger Leibniz's Law.

  In modern metaphysics, this is the contentious step. Most philosophers (following the lead of Saul Kripke and others in the late 20th century) argue that **modal properties are genuine properties of actual objects.**

  Consider a glass vase. It actually has the property of "being fragile." Fragility isn't something that happens only when it breaks; it is a dispositional property the vase possesses *right now* based on what *would* happen if it were struck. Similarly, the lump of clay possesses the property "could survive being squashed" at the very moment it is sitting on the pedestal. The statue possesses the property "could not survive being squashed" at that same moment.

  If Leibniz's Law states that $x = y$ only if $x$ and $y$ share **all** properties, and modal properties count as properties, then the difference in persistence conditions proves non-identity. By restricting Leibniz's Law to "non-modal actual properties," you are effectively changing the rule of identity to suit your conclusion, which your friend is under no obligation to accept.

  ### 2. Sortals and Persistence Conditions
  The deeper issue here isn't just about "possibilities"; it's about **sortal concepts**. A "sortal" is a concept that supplies a principle of individuation and counting (e.g., "horse," "statue," "lump").

  *   The sortal **Lump** carries the persistence condition: *Exists as long as the matter exists.*
  *   The sortal **Statue** carries the persistence condition: *Exists as long as the matter retains a specific form.*

  Even if the lump and the statue begin and end at the exact same nanosecond in the actual world, they belong to different kinds with different identity conditions. Your friend's argument is that you cannot have one object that simultaneously has two contradictory sets of identity conditions. If the object is the lump, it survives squashing. If it is the statue, it does not. Since it cannot both survive and not survive the same hypothetical scenario, there must be two distinct objects that are merely **coincident** (occupying the same space-time region).

  ### 3. The "Coincidence" Bullet
  Your intuition (and your argument) is likely driven by a desire to avoid **ontological extravagance**. It feels weird to say there are two things in the exact same place at the exact same time. You want to say, "It's just one thing!"

  However, the "Constitution View" (your friend's view) accepts this coincidence. They argue that while it is strange, it is less strange than denying the modal differences. They would say:
  *   There is a lump.
  *   There is a statue.
  *   The statue is *constituted by* the lump.
  *   Constitution is not Identity.

  Your tightened case successfully blocks the argument that they are distinct because they exist at *different times*. But it fails to block the argument that they are distinct because they exist in *different ways*.

  ### 4. How You Could Defend Your Position (The Hard Road)
  You aren't entirely without recourse, but defending the "One Object" view requires more than just ignoring modal properties. You would need to adopt one of the following specialized positions:

  *   **Relative Identity (Peter Geach):** You could argue that identity itself is relative to a sortal. The statue is the *same lump* as the clay, but not the *same statue*. There is no absolute "identity," only "identity under a description." This saves your intuition but requires rejecting standard logic's notion of absolute identity.
  *   **Modal Contextualism / Counterpart Theory (David Lewis):** You could argue that "could have survived" isn't a property of the object itself, but a statement about how we talk about the object in other possible worlds. In a world where the clay is squashed, there is a counterpart to the lump, but no counterpart to the statue. This preserves the "one object" view in the actual world but makes modal claims about language rather than metaphysics.
  *   **Dominant Sortals:** You could argue that only one sortal is "dominant." There is only one object, and it is a statue. Therefore, the lump *also* ceases to exist when the shape is lost. (This is counter-intuitive regarding matter conservation). Or, it is a lump, and "statue" is just a temporary phase. (This denies the existence of artifacts).

  ### Verdict
  Your tightened case is an excellent philosophical move because it isolates the metaphysical problem from the empirical one. It forces your friend to admit that they believe in two objects in the same place at the same time.

  However, **you did not settle the puzzle.** You shifted the burden of proof to the nature of properties. Since the consensus in analytic metaphysics is that modal properties (persistence conditions) are real properties of actual objects, your friend's objection stands. The difference in *what could happen* to the entities implies a difference in *what they are*, even if *what actually happens* to them is identical.

  If you want to win the argument, you shouldn't claim modal properties don't count. Instead, you should argue that **identity is not determined by modal properties alone**, or explore the **Relative Identity** route. But simply asserting that "possible divergences aren't actual properties" is generally considered a category error in this debate.
