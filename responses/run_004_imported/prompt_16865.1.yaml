answer: |-
  This is a fantastic juxtaposition. You have identified a genuine tension between Ramsey's *technical* contributions to intertemporal choice (which Longtermists claim as an ancestor) and his *philosophical* stance on value and significance (which fundamentally undermines the Longtermist worldview).

  If you dropped Frank Ramsey into a present-day EA forum, he would likely be the most polite but devastating critic in the room. He would agree with your premises but reject your conclusion. He would recognize the mathematics, but he would argue that the Longtermists are solving the wrong equation.

  Here is how Ramsey would likely dismantle Longtermism, rooted in his specific writings on probability, ethics, and economics.

  ### 1. The 1928 Savings Paper: The Trap of "Pure" Discounting
  Longtermists often cite Ramsey's 1928 paper, *A Mathematical Theory of Saving*, as proof that we should not discount the future. Ramsey famously wrote that discounting future utilities simply because they occur later is "ethically indefensible and arises merely from the weakness of the imagination."

  **The Longtermist Take:** Therefore, the utility of future people counts equally to present people. Since there are vastly more future people, the future dominates the present.

  **Ramsey's Rebuttal:** Ramsey would argue they are misapplying his "no discounting" rule.
  In that same paper, Ramsey explicitly allows for discounting based on **probability of existence**. He writes that we may discount the future because "there is a probability that the race will become extinct."

  However, Ramsey's probability theory (from *Truth and Probability*, 1926) defines probability as a **degree of belief guiding action**. He would look at the specific probabilities assigned to AI extinction scenarios or interstellar colonization and ask: *What is the evidence for this betting quotient?*

  Ramsey was a pragmatist. For him, a probability is only meaningful if it can be cashed out in terms of coherent betting behavior based on evidence. He would likely view the tiny probabilities ($p$) multiplied by astronomical values ($V$) in Longtermist expected value calculations as **pseudo-probabilities**. They are not degrees of belief derived from evidence; they are placeholders for ignorance. To Ramsey, building a moral philosophy on $p \times V$ where $p$ is unknowable is not rationality; it is a new form of scholasticism.

  ### 2. The "Epilogue": Perspective vs. Scale
  This is the core of the clash. In the *Epilogue* to *The Foundations of Mathematics*, Ramsey pushes back against Bertrand Russell's *A Free Man's Worship*. Russell argued that humans are insignificant specks in a vast, indifferent universe, and we must accept this tragedy.

  Ramsey's counter is your "threepenny bits" quote. He argues that value is not a function of physical scale or duration.
  > "My picture of the world is drawn in perspective, and not like a model to scale; the foreground is occupied by human beings and the stars are all as small as threepenny bits."

  **The Longtermist View:** Moral value aggregates. If you have 1 billion happy people, that is 1 billion times better than 1 happy person. The "astronomical waste" argument posits that failing to colonize the stars is a tragedy because it wastes the potential for $10^{52}$ lives.

  **Ramsey's Rebuttal:** Ramsey would argue this commits a category error.
  For Ramsey (influenced by G.E. Moore), the "good" consists of specific **mental states**: aesthetic enjoyment, personal affection, and the pursuit of knowledge. These are qualitative, not just quantitative.

  In the *Epilogue*, he writes:
  > "I don't feel the least humble before the vastness of the heavens... The stars are not as big as they look... they can't think or love."

  To Ramsey, a universe filled with digital minds that do not possess genuine capacity for "love or thought" (in the human sense he valued) is morally empty, regardless of the number. He would likely view the Longtermist obsession with *potential* minds as a confusion of **container** (spacetime/population) with **content** (actual experienced value).

  He would argue that by focusing on the "scale" of the future (the number of bits), Longtermists are falling into the exact trap he accused Russell of: being humbled by magnitude rather than focusing on the quality of the foreground.

  ### 3. Probability and "Nonsense"
  Ramsey was closely allied with the Vienna Circle and Wittgenstein. He had a low tolerance for metaphysical propositions that could not be verified or acted upon.

  Longtermism often relies on "Pascal's Mugging" style reasoning: even if the probability of saving the future is 1 in a billion, the value is so high it dominates current suffering.

  Ramsey's theory of subjective probability would choke on this. For Ramsey, belief is a **disposition to act**. If your probability assignment leads to actions that are disconnected from any observable feedback loop (e.g., sacrificing tangible present welfare for a speculative future that cannot be verified), the probability assignment itself becomes suspect.

  He would likely argue that when the time horizon extends beyond the point where we can model causal chains (e.g., 10,000 years into the future), the probability distribution becomes so flat that "expected utility" ceases to be a meaningful guide for action. He would call it **mathematical superstition**.

  ### 4. The Verdict: A "Human-Scale" Consequentialist
  So, would Ramsey be a Longtermist? **No.**

  He would be a **Present-Focused Consequentialist with a Non-Discounted Horizon.**

  Here is the nuance:
  1.  **He agrees the future matters:** He would reject *pure time discounting*. He would agree that a happy person in 2100 is as valuable as a happy person in 2024.
  2.  **He rejects the aggregation:** He would deny that we can sum up "potential lives" to outweigh actual lives. Value resides in actual mental states, not potential ones.
  3.  **He rejects the epistemology:** He would argue we cannot know enough about the deep future to justify sacrificing the "foreground" (actual humans) for the "background" (statistical futures).

  **His likely critique in the forum:**
  "You are trying to solve an ethical problem with a slide rule. You have taken my equation for savings, stripped it of its context regarding human consumption and mental states, and applied it to a universe you do not understand. You say you are maximizing the good, but you are actually maximizing *magnitude*. You are worshipping the stars again, just in the form of numbers. My 'threepenny bits' were small because they were irrelevant to human good; your 'astronomical numbers' are large, but for the same reason, they are irrelevant."

  ### Summary
  Ramsey's philosophy is a defense of **human significance against cosmic indifference**. Longtermism is, in practice, an acceptance of **cosmic indifference** (the universe doesn't care, so we must optimize the math) coupled with an attempt to **become the cosmos** (fill the universe with mind).

  Ramsey would see the latter as a betrayal of the former. He would tell the Longtermists that by obsessing over the "vastness" of the future, they have lost the "perspective" that makes value possible in the first place. He would likely urge them to focus on increasing the *density* of the good in the here and now, rather than the *extent* of the population in the hypothetical future.

  He would be the guy in the corner saying: *"The stars are still threepenny bits, no matter how many of them you count."*
