answer: |-
  Here are ten interview questions designed to press your professor friend on the internal tensions of textualism. They are structured to move from doctrinal specifics to broader philosophical implications, ending with the Kagan challenge.

  For each question, I have included the **"Anticipated Defense"** (the standard textualist line he will likely tow) and a **"Follow-Up"** (designed to pivot off that specific answer and deepen the conflict for your novel).

  ### 1. The Absurdity Doctrine
  **Question:** "Textualism claims to exclude legislative purpose, yet you allow for the 'absurdity doctrine' and scrivener's-error exceptions. How do you define 'absurd' without smuggling purpose back in through the back door? If a result is only absurd because it defeats the law's goal, aren't you secretly relying on purpose to identify the error?"

  *   **Anticipated Defense:** He will likely argue that "absurdity" is strictly *semantic* or *linguistic* (e.g., a sentence that makes no grammatical sense), not *policy-based* (e.g., a result that is unfair). He will insist this is about correcting mistakes in the code, not fixing outcomes.
  *   **Follow-Up:** "But who draws the line between a semantic glitch and a policy failure? If a judge decides a result is 'linguistically impossible' because it leads to chaos, isn't that a judgment about consequences, not just grammar?"

  ### 2. *Church of the Holy Trinity*
  **Question:** "Textualism often treats *Church of the Holy Trinity v. United States* as the original sin of statutory interpretation—the case where the Court ignored the text for the 'spirit' of the law. Is your methodology driven more by the text itself, or by a political fear of judges becoming *Holy Trinity* activists?"

  *   **Anticipated Defense:** He will argue that *Holy Trinity* represents judicial supremacy over the legislature, undermining democracy. The goal is to keep judges in their lane, not to fear a specific case.
  *   **Follow-Up:** "If the primary motivator is keeping judges in their lane, does that mean textualism is less about finding 'truth' in the words and more about institutional discipline? And what happens when discipline produces injustice?"

  ### 3. The *Bostock* Split
  **Question:** "In *Bostock v. Clayton County*, Justice Gorsuch's majority opinion and the dissents by Justices Alito and Kavanaugh all claimed fidelity to the text, yet they reached opposite conclusions. If the text is an objective anchor, how can three committed textualists disagree so sharply? Doesn't this suggest the text is indeterminate?"

  *   **Anticipated Defense:** He will likely contend that objectivity doesn't guarantee infallibility; one side was simply wrong about the "ordinary public meaning" of the words at the time of enactment.
  *   **Follow-Up:** "If three experts can't agree on what is 'ordinary,' how is a lower court judge supposed to know which side is right without relying on their own policy preferences to break the tie?"

  ### 4. "Elephants in Mouseholes"
  **Question:** "Justice Scalia's 'elephants in mouseholes' principle from *Whitman v. American Trucking* suggests Congress doesn't hide vast powers in vague language. Is that a genuine linguistic canon based on how humans speak, or is it a substantive policy judgment dressed up in textualist clothes?"

  *   **Anticipated Defense:** He will argue it is a linguistic reality: when people delegate major authority, they say so clearly. It's about communication norms, not policy.
  *   **Follow-Up:** "But doesn't that canon inherently privilege the status quo? By demanding extra clarity for *change*, aren't you building a conservative bias into the rules of language itself?"

  ### 5. Stare Decisis vs. Text
  **Question:** "Let's talk about precedent. If you are convinced a longstanding Supreme Court precedent contradicts the clear text of a statute, do you overrule it? Where does the duty to stability end and the duty to textual fidelity begin?"

  *   **Anticipated Defense:** He will likely admit that *stare decisis* is a pragmatic exception, but argue that textual correctness is the ideal. He may say he would distinguish the case rather than overrule it outright.
  *   **Follow-Up:** "So textualism is the truth, but precedent is the lie we tell for stability? How do you explain to a litigant that they are losing because of pragmatism, not because the law is actually on the other side?"

  ### 6. Legislative History
  **Question:** "You reject legislative history because Congress didn't vote on the committee reports, only the text. But Congress didn't 'vote' on every ambiguous phrase in the text either. Why is the text sacrosanct if the voters didn't read that either, but the reports are forbidden?"

  *   **Anticipated Defense:** The Constitution requires bicameralism and presentment for *laws* (text), not for speeches or reports. The text is the only thing that went through the constitutional process.
  *   **Follow-Up:** "But if the text is ambiguous, looking at the report might reveal what the constitutional process was actually aiming at. Why is it more democratic to guess at the words than to read the explanation?"

  ### 7. The "Ordinary" Observer
  **Question:** "Your method relies on the 'ordinary meaning' of the text to a 'reasonable person.' In a complex regulatory state involving tax codes or environmental science, is there really an 'ordinary person' who understands the Clean Air Act, or is that hypothetical judge a construct?"

  *   **Anticipated Defense:** The "ordinary person" is a legal standard for common usage, not a requirement that they understand the science. It's about how the words are used, not the technical underlying facts.
  *   **Follow-Up:** "But if the words are technical, and the 'ordinary person' doesn't understand them, aren't you just deferring to the judge's own understanding of technical language and calling it 'ordinary'?"

  ### 8. Constitutional vs. Statutory Textualism
  **Question:** "Does textualism apply differently to the Constitution than to statutes? The 'dead hand' problem seems harder with the Constitution, since statutes can be fixed by Congress if the text leads to an unworkable result."

  *   **Anticipated Defense:** Law is law. The Constitution is the supreme statute. If the text is unworkable, the Amendment process is the fix, not judicial interpretation.
  *   **Follow-Up:** "Given how difficult amendments are, doesn't that mean your interpretation effectively locks in 18th-century meanings for problems the Framers couldn't have imagined, like digital privacy?"

  ### 9. Agency Deference (*Loper Bright*)
  **Question:** "With *Loper Bright* overturning *Chevron*, textualism now demands judges interpret technical agency statutes without deference. Does this turn judges into amateur scientists? How do you interpret technical text without deferring to the experts who write it?"

  *   **Anticipated Defense:** Judges interpret the law; agencies execute it. Deferring to agencies lets them write the laws they enforce, which violates separation of powers.
  *   **Follow-Up:** "But if the judge's interpretation of technical text becomes the policy itself, hasn't the judge just become the policymaker they were trying to avoid being?"

  ### 10. The Kagan Challenge (Closing Question)
  **Question:** "Justice Kagan once remarked, 'We're all textualists now.' If that consensus is real, what would actually count as evidence *against* your view? Is there any case where you would say, 'The text says X, but justice requires Y, so I'm abandoning textualism'?"

  *   **Anticipated Defense:** He will likely argue the consensus is superficial; everyone *says* they look at text, but non-textualists quickly move to purpose or consequence when the text is inconvenient. He will say he would never abandon the text.
  *   **Follow-Up:** "If the methodology never yields to the outcome, even in extreme cases, isn't textualism less of a legal theory and more of a moral commitment to rule-following, regardless of the human cost?"
