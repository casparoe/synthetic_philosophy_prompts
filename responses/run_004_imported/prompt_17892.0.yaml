answer: |-
  This is a splendid piece of writing. It has the right blend of technical confidence and philosophical humility that makes for good history and philosophy of science (HPS). You've captured the *feel* of the transition from energetics to atomism very well.

  Since you asked for a peer review before your reading group, I'll tackle your three specific questions in order, then offer a few suggestions on how to sharpen the argument for your colleagues.

  ### 1. The History: Are you garbling anything?

  Broadly, you are on solid ground. The narrative arc—Ostwald's energetics, the Lübeck debate, Boltzmann's tragedy, Perrin's convergence—is the standard received view, and it holds up. However, since you're presenting to a reading group that might include a pedant (we all know the type), here are three nuances to consider:

  *   **Lübeck (1895):** You say Boltzmann "didn't exactly carry the room." That is correct, but it's worth noting *why*. It wasn't just rhetorical flair; it was that thermodynamics (Ostwald's turf) was the dominant paradigm for physical chemistry then. Kinetic theory was seen as speculative mechanics. Ostwald wasn't being obscurantist; he was being a good positivist.
  *   **The Recantation:** You imply Perrin's work alone flipped Ostwald. While Perrin was the *coup de grâce*, the wall was already cracking. J.J. Thomson's electron (1897), the Curie's radioactivity work, and Einstein's theory of specific heats (1907) were all pounding on the door. Ostwald's conversion was gradual between 1908 and 1913 (the publication of *Les Atomes*). If you want to be precise, you might say Perrin provided the "decisive convergence" rather than the sole evidence.
  *   **Mach:** You are correct that Mach never fully recanted. He died in 1916. It is a poignant detail that adds weight to your Duhemian point: logically, he *could* hold out, even if pragmatically he was isolated.

  **Verdict:** No major garbling, but acknowledging that Perrin was the climax of a decade-long crescendo rather than a single lightning strike protects you from historical nitpicking.

  ### 2. The Philosophy: Have you re-derived Salmon or Hacking?

  You have a very sharp nose. You are indeed standing on the shoulders of giants, specifically **Wesley Salmon**.

  *   **Salmon vs. Hacking:** Ian Hacking (*Representing and Intervening*, 1983) is famous for "entity realism" ("If you can spray them, they are real"), which focuses on *causal manipulation*. However, your argument is about the *convergence of independent measurements*. That is explicitly **Wesley Salmon's** territory, specifically in *Scientific Explanation and the Causal Structure of the World* (1984).
  *   **The Argument from Coincidence:** Salmon uses the Perrin case as his flagship example. He calls it the "argument from coincidence" (a phrase he borrows from Whewell). The logic is exactly as you stated: it is highly improbable that a dozen distinct experimental methods (sedimentation, diffusion, viscosity, etc.) would yield the same value for Avogadro's number unless there was a **common cause** (the atom) structuring those results.
  *   **Duhem's *Bon Sens*:** There is an irony here you might enjoy pointing out to your group. You are using Perrin to solve a Duhemian problem, but Duhem himself anticipated this. Duhem admitted that logic alone doesn't decide theory choice; he argued that *"good sense"* (*bon sens*) is what eventually breaks the tie when auxiliaries become too contrived. You are essentially formalizing Duhem's *bon sens* using Salmon's probabilistic realism.

  **Verdict:** You haven't made a mistake; you've independently reconstructed the "Common Cause" argument. Citing Salmon here will give your reading group the bibliographic anchor they love. It validates your intuition that underdetermination is a *logical* possibility but a *pragmatic* non-starter when robustness is high.

  ### 3. The Analogies: Dark Matter and Quantum Mechanics

  This is the riskiest part of your draft, but also the most provocative. Here is where your chemistry background might be leading you slightly astray, or at least into a different terrain.

  **Dark Matter vs. MOND:**
  *   **The Analogy:** This holds up well. It is an ontological debate (is there stuff there, or is the law wrong?), just like Atoms vs. Energetics.
  *   **The Disanalogy:** You ask if they have Perrin-style convergence. The answer is arguably **yes, more so than atoms did in 1908.** Dark Matter isn't just galactic rotation curves (where MOND competes well). It's the Cosmic Microwave Background (CMB) power spectrum, gravitational lensing in the Bullet Cluster, and large-scale structure formation. MOND struggles immensely to explain the CMB without effectively re-inventing dark matter.
  *   **Suggestion:** You might argue that Dark Matter is actually *past* the 1908 atomic stage and closer to the 1913 stage. The "triangulation" is already happening; the "Machians" of cosmology are just louder than Mach was.

  **Quantum Interpretations (Copenhagen, Many-Worlds, Bohmian, etc.):**
  *   **The Analogy:** This is weaker. The atomic debate was about the *existence of an entity*. The interpretation debate is about the *meaning of the formalism*.
  *   **The Disanalogy:** Most standard interpretations are constructed specifically to be **empirically equivalent**. They agree on the Born rule outcomes by definition. Atoms and Energetics were *not* empirically equivalent in the long run; Energetics couldn't easily account for Brownian motion without effectively smuggling in atoms.
  *   **Nuance:** There are exceptions (e.g., spontaneous collapse theories like GRW *do* make different predictions), but the "rival interpretations" people usually argue about (MWI vs. Copenhagen) are underdetermined in a way atoms *stopped* being after Perrin.
  *   **Suggestion:** Distinguish between *ontological underdetermination* (Dark Matter/Atoms) and *interpretive underdetermination* (QM). The former is solvable by triangulation; the latter might be permanently stuck unless a new formalism breaks the equivalence.

  ### Suggestions for the Text

  If I were editing this for your reading group, I would make two small tweaks to tighten the philosophical screw:

  1.  **Clarify the "Patch":** You write: *"You can always save the 'convenient fiction' story with one more patch."*
      *   *Refinement:* Emphasize that the patches become **disunified**. To save Energetics after Perrin, you'd need one auxiliary for Brownian motion, a different one for Specific Heats, another for X-ray diffraction. The "cost" isn't just adding a hypothesis; it's losing the unifying power of the theory. That's why Ostwald folded. It wasn't just logic; it was the aesthetic and pragmatic collapse of the research program.
  2.  **The "Triangulation" Term:**
      *   *Refinement:* You might want to use the term **"Robustness"** or **"Convergent Realism."** It signals to the philosophers in the room that you know the literature, even if you're critiquing it.

  ### Proposed Revision (for consideration)

  Here is how I might integrate those points into your final paragraph, keeping your voice intact:

  > "So here's my question: was the atom debate ever actually resolved the way Duhem's logic says these debates get resolved—which is to say, not really? Logically, you can always save the 'convenient fiction' story with one more patch; Perrin's convergence across a dozen unrelated methods is just a spectacular coincidence, if you're determined enough to read it that way. But as Wesley Salmon later argued using this very case, the probability of that coincidence becomes vanishingly small when the methods are causally independent. What actually moved people, Ostwald included, wasn't a logical refutation, it was that holding onto the fiction required a different *ad hoc* auxiliary for every new phenomenon—Brownian motion, specific heats, X-ray diffraction—until the research program lost all its unifying power.
  >
  > If that's right, then underdetermination is real in the strict logical sense but rarely decisive in practice, because what actually breaks ties is robustness—structurally unrelated methods converging on one number. That bar is met only rarely, which makes me wonder about two live cases. Dark Matter versus MOND looks like the atomic debate: an ontological dispute where triangulation (lensing, CMB, rotation curves) is already stacking up against the rival. But the rival interpretations of quantum mechanics might be different. There, the empirical equivalence is often built into the formalism by design. Atoms stopped being underdetermined because nature forced them to be; QM interpretations might remain underdetermined because we haven't found a way to ask nature a question they answer differently."

  ### Final Word

  You are not out of your depth. The best philosophy of science is often done by scientists who look at the history of their own field and realize the textbooks are lying to them. Your draft captures the *human* element of theory choice—the exhaustion of fighting the rear guard—which is something pure philosophers often miss.

  Show it to your group. If they bring up Salmon, you can tell them you arrived there by way of Ostwald. That's a good story.
