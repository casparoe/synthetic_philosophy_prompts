prompt: |-
  Ok so I've fallen down this whole AI safety rabbit hole over the last few months, just from watching youtube videos and reading random blog/reddit posts, no formal background in any of this so I could easily be getting stuff wrong. One thing that keeps coming up is Goodhart's law, you know, "when a measure becomes a target it stops being a good measure." Everyone talks about it like its basically a proven law of nature at this point, sort of the way people bring up Godel's incompleteness theorem, like its an actual airtight mathematical result and not just a saying someone coined. I brought this up with a friend who codes for a living and he just went "yeah, alignment is basically mathematically impossible then" and moved on, which didn't really satisfy me. Because if Goodhart's law really is proven like that, doesnt it mean its literally been shown that you can never design an AI reward function or goal that a sufficiently smart optimizer won't eventually find a loophole in and game the hell out of? I keep seeing these lists of "specification gaming" examples going around, like the boat racing game where the AI just loops in circles crashing into stuff and catching fire instead of ever finishing the race, because that scored higher than actually racing, and people bring that up as basically Goodhart's law caught in the act.

  So my actual question is: is Goodhart's law an actual proven result, like a theorem, or is it more of an informal rule of thumb dressed up as one? Because if it's really proven, it seems like the entire field of "AI alignment" is chasing something that's already been mathematically ruled out, kind of like trying to patent a perpetual motion machine. So why do labs keep publishing papers on reward modeling and RLHF and treat getting the reward right as just a hard-but-solvable engineering problem, if there's supposedly a law on the books saying it can never hold up once the thing optimizing against it gets smart enough? Am I misunderstanding what the law actually claims, or is everyone in AI safety just quietly ignoring the implications of their own favorite law?
