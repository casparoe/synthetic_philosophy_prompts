          *   *Counter-argument:* Epistemic states. We cannot assign 0 probability to infinite value scenarios (e.g., simulation hypotheses, infinite multiverse, indefinite future). If we assign non-zero credence to these, the *subjective* expectation inherits the Pasadena structure.
