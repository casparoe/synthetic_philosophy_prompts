      *   **1. The Mathematical Core (Briefly):** Reiterate *why* it matters. It's not $\infty$; it's *undefined*. This distinguishes it from St. Petersburg. In EA, we often treat undefined as "very large" or "infinite," which is a category error.

      *   **2. Finite World vs. Epistemic Infinity:**
