      *   **3. The Problem of "Ordering" in Real Decisions:**
          *   In the game, ordering is arbitrary. In reality, is there a natural ordering?
          *   Time? (Discounting). If we discount, the series converges. But Long-termism often rejects strong discounting.
          *   Magnitude? (Sorting by impact).
          *   *Implication:* If the "correct" ordering isn't obvious, the EV is sensitive to how we frame the partition of possibility space. This makes EV comparisons fragile.

      *   **4. Bounded Utility as a Solution (and its cost):**
          *   Standard decision theory fix: Utility functions must be bounded (Savage, etc.) to avoid these paradoxes.
          *   *EA Conflict:* Long-termism often assumes unbounded value (more lives = more value). If you bound utility to solve Pasadena, you might undermine the motivation for x-risk reduction (since saving $10^{50}$ lives isn't much better than saving $10^{40}$ lives once you hit the bound).
