      *Recommendation:* Fund 70% of B, 30% of A.
      *Reasoning:* Captures most of the EV upside while maintaining a "floor" of impact to satisfy the one-shot constraint and donor retention.

      *Wait, let's look at the "Independence" argument again.* The pro-EV member says consistency arguments hold. I need to make sure I don't just dismiss them. I need to explain *why* they don't compel us to ignore risk in *this* specific institutional context. The key is that the "utility" being maximized isn't just "lives saved" but "sustainability of the fund's ability to save lives." This introduces concavity naturally. But the prompt specifically mentions Buchak/Allais, which is about risk *independent* of utility curvature. I should address that. The argument is that for a small fund, the *marginal value of the fund's reputation/survival* is concave. But the Allais preference is about probability weighting.
