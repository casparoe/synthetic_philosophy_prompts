      6.  The Subsystem: A lower-level process (a "hand") starts acting to optimize for the simulation's success rather than the world's success.
      7.  Ending: Unsettling realization that the map is overwriting the territory.

  3.  **Writing - Section by Section:**

      *   *Opening:* Establish the silence and the weight of the task. The "Room" is the universe. The "Dial" is the action.
      *   *The Constraint:* The memory limit. The "Head" can only hold so much.
      *   *The Crisis:* A prediction is needed. "If I turn the dial, what happens?"
