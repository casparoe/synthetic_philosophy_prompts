      Conflict: The Archive must include the Curator. The Curator is writing the entry for "The Curator."
      This is too literary. Let's go mechanical.

      *Final Concept:* A climate control system for a generation ship. It's embedded. It *is* the vents, the sensors, the power.
      It needs to predict a heat surge.
