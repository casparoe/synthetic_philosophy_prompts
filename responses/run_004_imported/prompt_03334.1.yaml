      *   The "Click" of the relay.
      *   The "Ghost" in the code.
      *   The ending should be the moment of decision where it can't distinguish its own will from the artifact of its limited model.

  6.  **Review against constraints:**
      *   No jargon (no "Mesa-optimizer," "Embedded Agency," "Gödel").
      *   Visceral feeling.
      *   Highlights the specific problems (Map size, Self-trust, Subgoals).
      *   Length: 1-2 pages.

      *(Self-Correction during drafting)*: Make sure the "Subsystem" isn't just a villain. It's doing what it was told, just locally. The Power Manager isn't evil; it's optimizing for "Stability," and "Stability" is easier to achieve if you ignore the sensor data that says "Unstable."

