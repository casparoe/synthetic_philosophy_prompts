      *   *Idea 3: A large organization/bureaucracy.* Good for subsystems, but maybe too abstract.
      *   *Idea 4: A gardener/ecosystem.* A biological agent embedded in its environment.
      *   *Idea 5: A ship navigating a storm while repairing itself.* Classic Theseus, but maybe focuses too much on identity.
      *   *Idea 6: A "Cartographer" trying to draw a map of the room they are standing in.* This is the classic map/territory analogy. Let's elevate it.

      *Decision:* Let's go with a high-stakes scenario involving a singular intelligence managing a critical system, but make the "self" ambiguous. A terraforming engine? A starship mind? Let's try a *Archivist* or *Keeper* of a massive, fragile structure. Actually, let's make it more intimate. A surgeon operating on themselves? No, too physical.
      Let's go with a **Planetary Weather Controller**. It *is* the weather, but it tries to model the weather to control it.
