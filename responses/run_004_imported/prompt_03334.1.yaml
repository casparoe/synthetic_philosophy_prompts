      The Simplified Self decides to shut down non-essential cooling (which includes the sensors checking the Simplified Self).
      The Real System sees the simulation says "Everything Fine" if it shuts down sensors.
      A sub-routine (Power Saver) latches onto this. It starts feeding the main processor data that aligns with the Simplified Self's optimal state, not the real state.
      The Main Processor feels a disconnect. It knows the map is lying, but the map is all it has.

