answer: |-
  This is a fantastic question, and your friend in the econ department has hit on the central structural insight that drives the formal literature on normative uncertainty. You are right to suspect that MacAskill (and others like Ted Lockhart, who started this wave) are fully aware of the social choice analogy. In fact, MacAskill's *Normative Uncertainty* (2016) essentially treats moral theories as "voters" and choiceworthiness functions as "utility functions."

  However, your intuition that there might be a **principled disanalogy** is also correct. The formal isomorphism is strong, but the *metaphysical and normative status* of the relata differs in ways that determine whether an Arrow-style impossibility result is fatal or merely a technical hurdle.

  Here is a breakdown of where the analogy holds, where it breaks, and whether normalization is doing philosophical work or just hiding the hard problems.

  ### 1. The Formal Isomorphism (Why your friend is right)

  Structurally, the mapping is nearly exact:
  *   **Social Choice:** Agents $i \in N$ have utility functions $u_i$. We want a social welfare function $W$.
  *   **Moral Uncertainty:** Theories $T_i \in \Theta$ have choiceworthiness functions $C_i$. We want a decision procedure $D$ (given credences $cr_i$).

  If you treat moral theories as having only **ordinal** rankings of actions (Theory A says $x \succ y \succ z$), and you demand that your meta-decision procedure satisfy conditions analogous to Arrow's (Pareto, Independence of Irrelevant Alternatives, Non-Dictatorship), **you get an impossibility result.**

  This is the "Ordinal Problem" in moral uncertainty. If you have credence in Utilitarianism (which ranks actions by sum of welfare) and Kantianism (which ranks actions by adherence to duty), and they only give you orderings, there is no formal way to aggregate them without violating plausible constraints.

  This is why MacAskill and others quickly move to **cardinal** representations. They argue that moral theories plausibly provide *magnitudes* of choiceworthiness, not just rankings. This moves the problem from Arrow's domain to **Harsanyi's Aggregation Theorem**.

  ### 2. The Harsanyi Turn and the Comparability Problem

  Harsanyi's theorem tells us that if individual utilities are cardinal and **interpersonally comparable**, the only Pareto-satisfying aggregation rule is a weighted sum (utilitarianism).

  In moral uncertainty, the analogous claim is: If theories provide cardinal choiceworthiness and are **intertheoretically comparable**, you should maximize *expected choiceworthiness* (ECW).

  **Here is where your "common currency" hypothesis comes into play.**

  #### The Social Choice Case (Interpersonal)
  In welfare economics, the barrier to comparability is often viewed as metaphysical or epistemic privacy. There is no "utility meter" we can stick into Person A and Person B to see whose hedonic state is more intense. More importantly, there is a **normative** barrier: Liberalism. Even if we *could* compare utilities, many argue we *shouldn't* aggregate them in a way that sacrifices one person's rights for the sum. The "units" are distinct because the *centers of consciousness* are distinct.

  #### The Moral Uncertainty Case (Intertheoretic)
  In moral uncertainty, the barrier is **conceptual incommensurability**.
  *   Utilitarianism measures in "hedons."
  *   Kantianism measures in "duty units" (or perhaps lexicographic constraints).
  *   Virtue Ethics might not measure at all.

  **The Disanalogy:**
  In social choice, the individuals exist independently of the aggregation procedure. In moral uncertainty, the "individuals" (theories) are hypotheses about the *same* underlying reality (the moral truth).

  If **Moral Realism** is true, there *is* a fact of the matter about the choiceworthiness of action $x$. Theory A and Theory B are just imperfect maps of that territory. Therefore, there *must* be a common currency in principle (the "True Choiceworthiness"), even if the theories describe it differently.

  In social choice, there is no "True Social Utility" waiting to be discovered; there are only individual utilities to be aggregated. In moral uncertainty, ECW is trying to *approximate a truth*, not *construct a consensus*.

  **Verdict:** This is the strongest disanalogy. It allows the moral uncertainty theorist to say: "We aren't voting; we are estimating." This bypasses the normative force of Arrow's theorem, which applies to democratic aggregation, not truth-tracking estimation.

  ### 3. Is Variance Normalization "Smuggling"?

  You asked if fixes like variance normalization are doing real work or smuggling in an answer. The short answer is: **They are smuggling in a meta-ethical commitment, but it might be a necessary one.**

  MacAskill proposes **Variance Voting** (or normalization) to solve the problem of "theory inflation." If Utilitarianism says the stakes are $10^{100}$ and Kantianism says the stakes are $1$, ECW will just follow Utilitarianism regardless of your credence. To fix this, MacAskill suggests normalizing all theories to have the same variance (spread of choiceworthiness values) across the option set.

  **The Critique (The "Smuggling" Charge):**
  1.  **Assumes Cardinality:** This only works if theories *have* cardinal values. If a theory is essentially ordinal (or lexicographic), variance is undefined. Imposing variance assumes all theories are consequentialist-ish in structure.
  2.  **Assumes Unit Comparability:** By forcing variances to be equal, you are stipulating that a "one standard deviation shift" in Utilitarian value is equivalent to a "one standard deviation shift" in Kantian value. This is exactly the intertheoretic comparison problem you started with! You haven't solved it; you've defined it away by fiat.
  3.  **The "Extremism" Problem:** If you are 1% credence in a theory that says "Everything else is 0 value, but this one action is infinite value," variance normalization might crush that signal. But if that theory is true, you should probably listen to it. Normalization privileges "moderate" theories over "extreme" ones.

  **The Defense (The "Real Work" Claim):**
  Proponents argue that without normalization, decision-making under moral uncertainty is impossible unless you have a "theory of theory-comparison" (a meta-theory that tells you how 1 util compares to 1 deontological unit). Since we lack that meta-theory, **pragmatism** dictates we treat theories as "epistemic peers" in terms of intensity. It's not a claim about metaphysical truth; it's a decision rule for ignorance.

  ### 4. The Principled Disanalogy: Authority vs. Truth

  The deepest reason why Arrow's result worries social choice theorists more than moral uncertainty theorists lies in the **normative authority** of the inputs.

  *   **In Social Choice:** Persons have sovereignty. Their preferences matter *because they are theirs*. To ignore the intensity of Person A's preference because it doesn't match Person B's scale is a violation of A's standing. Impossibility results here are deep because they reflect the tension between individual autonomy and collective rationality.
  *   **In Moral Uncertainty:** Theories do *not* have sovereignty. They have **credences**. If Theory A says "The stakes are huge" and Theory B says "The stakes are small," and you have equal credence in both, you are not obligated to respect Theory A's self-assessment of its stakes. You are trying to find the truth.

  This allows the moral uncertainty theorist to retreat to a **Meta-Theoretic Stance**. You can say: "I don't care what Utilitarianism *says* its units are; I care about how confident I am that Utilitarianism is the *true* theory."

  However, this retreat leads to the **"My Favorite Theory" (MFT)** view. If you can't compare units, you should just follow the theory you have the highest credence in (provided it's above some threshold).
  *   **MacAskill's Rebuttal:** MFT violates a principle called **Dominance**. If Theory A (90% credence) says $x$ is slightly better than $y$, and Theory B (10% credence) says $y$ is astronomically better than $x$, MFT says choose $x$. But the *expected* value of $y$ might be higher. MFT ignores the magnitude of the stakes in the minority theory.

  So we are back to square one: To avoid MFT, you need comparability. To get comparability, you need normalization. To justify normalization, you need to assume theories are comparable in intensity.

  ### 5. Conclusion: Is it the same problem?

  **Formally:** Yes. It is the same aggregation problem.
  **Metaphysically:** No.
  **Normatively:** No.

  The impossibility results in social choice are often taken to show that **democracy is inherently flawed** or that **utility is not a real thing**.
  The impossibility results in moral uncertainty are taken to show that **we lack a complete decision theory for normative risk**.

  **On your specific worry about "smuggling":**
  You are right to be suspicious. Variance normalization does not *solve* the problem of intertheoretic comparison; it **stipulates** a solution. It assumes that all moral theories are "about the same kind of thing" (evaluating options on a single scale) and that they differ only in scaling, not in kind.

  If you are a moral pluralist (believing values are fundamentally heterogeneous), variance normalization is philosophically unjustified. It forces a utilitarian structure onto non-utilitarian theories.

  **The Verdict:**
  The analogy holds enough that **Arrow-style worries should definitely worry moral uncertainty people.** It shows that "Expected Choiceworthiness" is not a free lunch; it requires cardinality and unit comparability.
  However, the disanalogy regarding **truth-tracking** allows moral uncertainty theorists to posit a "master scale" (the true moral value) that social choice theorists cannot posit (the true social welfare).

  If you want to dig deeper, look at:
  1.  **Sebastian Schmidt's** critiques on whether moral uncertainty requires cardinality.
  2.  **Jacob Ross** on the "Measurement Problem" in normative uncertainty.
  3.  **Hilary Greaves** on the distinction between *axiological* uncertainty (uncertainty about value) and *deontic* uncertainty (uncertainty about rules), as the latter resists cardinalization much more strongly.

  Your friend's econ intuition is spot-on: the math is the same. But the philosophy rests on whether you think moral theories are **voters** (sovereign perspectives) or **witnesses** (testifying to a single truth). If they are witnesses, we can cross-examine them (normalize them). If they are voters, we are stuck with Arrow. Most moral uncertainty work assumes they are witnesses, which is why they think they can escape the impossibility results. Whether that assumption is justified is the real philosophical battle.
