answer: |-
  It is genuinely impressive that you went straight to the primary source. Most people never get past the textbook summaries, and your confusion is a sign that you are reading the text more carefully than many scholars do. The passage you quoted is indeed the genetic code for the Doctrine of Double Effect (DDE), but like all genetic code, it expresses itself differently depending on the environment (in this case, 13th-century theology vs. modern secular ethics).

  Your three difficulties pinpoint exactly where later interpreters have smoothed over Aquinas's rougher, more complex edges. Let's work through them in order.

  ### 1. Intended vs. "Beside the Intention" (*Praeter Intentionem*)

  Your first difficulty is the most common hurdle: *If I know the aggressor will die, and I act in a way that causes it, how is that death not intended?*

  For Aquinas, "intention" does not merely mean "what I foresee" or "what I am okay with." It refers to the **object of the will**. It is about what you are aiming at as your goal or as the method to achieve that goal.

  Aquinas distinguishes between the *act itself* (repelling force) and the *consequences of the act* (the aggressor's death).
  *   **The Intended:** You will the act of stopping the attack. You choose a specific movement (e.g., raising a shield, striking a blow to disable) specifically to neutralize the threat.
  *   **Beside the Intention:** The death occurs *because* of the act, but it is not the mechanism by which you achieve safety. You are not thinking, "I will kill him so that he stops." You are thinking, "I will stop him, even if this results in his death."

  To use a medical analogy Aquinas would understand: A surgeon cuts open a patient's chest. The surgeon foresees the cutting of the flesh and the pain. But the cutting is not the *goal* (healing is), nor is the pain the *method* (the surgery is). The damage to the tissue is "beside the intention" of the healing act, even though it is fully foreseen and physically necessary.

  In your trolley problem context, this is the difference between the **Switch** case and the **Push** case.
  *   **Switch:** You divert the train. The death of the one is a side effect of diverting the train. (Aquinas might allow this, though he didn't discuss trolleys).
  *   **Push:** You push the man. Here, his body becoming an obstacle is the *method* by which the train stops. His death (or at least his use as a buffer) is intended as the means.

  So, "beside the intention" doesn't mean "I didn't want it to happen." It means "I did not choose it as my end, nor did I choose it as the means to my end."

  ### 2. Private Person vs. Public Authority

  You are absolutely right to notice a shift here. Modern summaries of DDE often treat it as a universal principle of individual ethics ("*I* can do X if..."). Aquinas, however, is operating within a specific legal and theological framework regarding **jurisdiction over life and death.**

  Aquinas holds that life belongs to God and, by extension, to the community (the "common good"). A private individual is a steward of their own life, but they are not the owner of the aggressor's life.
  *   **The Private Person:** Because you do not have authority over the aggressor's life, you cannot *intend* to take it. You can only intend to preserve your own, accepting the aggressor's death as an unavoidable side effect. If you *intend* to kill him, you are usurping a authority you do not possess (acting as judge and executioner).
  *   **The Public Authority (Soldier/Judge):** These agents act on behalf of the "common good." Because they represent the community's right to self-preservation and justice, they *are* permitted to intend the death of an enemy or criminal. For them, killing is not a side effect; it can be the direct object of the act, provided it is ordered toward the common good and not "private animosity."

  This is why you rarely see this emphasized in modern DDE summaries. Modern ethics is largely individualistic; we tend to ask, "What can *I* do?" Aquinas is asking, "What role does this person occupy in the moral order?"

  This isn't a second, contradictory justification. It is a boundary condition. The "intended vs. unintended" rule applies to **private citizens**. The "public authority" clause is an exception to that rule granted by virtue of office. If you are a private citizen, you *must* rely on the double effect (death must be unintended). If you are a soldier in a just war, you may intend death, but you must satisfy the requirement of acting for the common good.

  ### 3. Proportionality and Intention

  Your third question is subtle: *If the death is a side effect, why does the amount of force matter?* If I accidentally kill someone while defending myself, isn't it still unintended?

  For Aquinas, proportionality is not just a separate rule; it is the **evidence** of the intention. The moral "species" (or kind) of an act is determined by what the will chooses. If you use force that is grossly disproportionate to the threat, you reveal that your will was not actually choosing "self-defense."

  *   **Moderate Force:** If someone punches you and you shove them away, and they fall and hit their head and die, the act remains "self-defense." The death is truly *praeter intentionem*.
  *   **Excessive Force:** If someone punches you and you shoot them with a cannon, Aquinas argues the act is no longer "self-defense." It has become "aggression" or "vengeance." By choosing excessive force, you have implicitly intended harm beyond what was necessary for safety.

  Proportionality connects to intention because it defines the boundaries of the act. If you exceed the limits of "blameless defense," the act changes its nature. It is no longer an act of preservation with a side effect of death; it becomes an act of violence that results in death. Therefore, proportionality ensures that the description "act of self-defense" remains true. Without proportionality, the claim that "I only intended to save myself" becomes a lie.

  ### Does this support the "Tidy Four Conditions"?

  You asked whether this passage supports the tidy four-condition version of DDE found in modern ethics textbooks. The short answer is: **It supports the skeleton, but the modern version has amputated a vital organ.**

  The standard four conditions of Double Effect are usually listed as:
  1.  The act itself must be morally good or neutral.
  2.  The agent must intend only the good effect, not the bad.
  3.  The bad effect must not be the means to the good effect.
  4.  There must be a proportionate reason for allowing the bad effect.

  Aquinas's text clearly grounds conditions 1, 2, and 4. Condition 3 (means vs. side effect) is implied in his distinction between what is intended and what is "beside the intention," though later scholars made it more explicit.

  However, Aquinas's argument is **looser and more contextual** than the modern checklist in two key ways:

  1.  **The Authority Constraint:** As you noticed, Aquinas includes the restriction on private authority. Modern DDE often drops this, applying the principle to individuals in situations where Aquinas would forbid it (e.g., a private citizen intending to kill a tyrant). For Aquinas, the morality of the act depends on *who* is doing it, not just the structure of the intention.
  2.  **Metaphysics vs. Heuristic:** Modern DDE is often used as a decision-making heuristic (a checklist to justify a choice). Aquinas is offering a metaphysical analysis of *what the act is*. He isn't just saying "You can do this if you check these boxes." He is saying, "If you do this with moderate force, the act *is* self-defense. If you do it with excessive force, the act *is* murder." The intention doesn't magically sanitize a disproportionate act; the disproportion reveals the bad intention.

  **Conclusion**
  You have correctly identified that the modern "Doctrine of Double Effect" is a systematization of Aquinas's insight, stripped of its medieval legal context. Your confusion arises because you are reading the original architectural blueprints (Aquinas) while your friends are looking at the modern prefabricated house (DDE).

  The blueprints show load-bearing walls regarding public authority and the nature of the act itself that the prefabricated house has removed to make the rooms more flexible. Aquinas's argument is not just about "intention vs. foresight"; it is about **jurisdiction** (who has the right to intend death) and **ontological classification** (does the force used change the very definition of the act?). If you keep those two elements in mind, the text becomes much more coherent, even if it is less universally applicable than the modern version suggests.
