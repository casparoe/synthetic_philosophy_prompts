      *   **Tone:** Intellectual, tense, precise.

  2.  **Deconstruct the Core Concept (FairBot/Löb's Theorem):**
      *   *The Problem:* In a standard Prisoner's Dilemma (PD), Defect is dominant. If I know you'll cooperate, I should defect to get the best payoff. If I know you'll defect, I should defect to avoid the sucker's payoff. Result: Mutual Defection.
      *   *The Program Equilibrium Twist:* Agents submit source code. They can simulate/read each other.
      *   *The Naive Attempt:* "I will cooperate if you cooperate." (CliquetBot). Problem: Infinite regress. Agent A waits for B to prove it will cooperate. B waits for A. Stack overflow or timeout.
      *   *The FairBot Solution:* "I will cooperate if I can *prove* that you will cooperate."
      *   *The Magic (Löb's Theorem):* Roughly, if a system can prove that "if it is provable that X, then X," then X is true. In the context of two FairBots:
          *   FairBot A searches for a proof that FairBot B cooperates.
          *   FairBot B searches for a proof that FairBot A cooperates.
          *   Löb's Theorem allows them to find a proof of mutual cooperation without infinite simulation. They prove that *if* a proof exists, *then* the action happens. Since they are identical (or sufficiently similar), the proof exists.
      *   *The Catch:* It requires bounded proof search (time limits) and specific logical structures. It's not magic trust; it's mathematical necessity given the axioms.

