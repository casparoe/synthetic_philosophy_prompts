  5.  **Refining the Logic for the Story:**
      *   I need to be careful not to misrepresent the math. FairBot cooperates if `Prove(Opponent Cooperates)`.
      *   If A and B are both FairBot, A looks for `Prove(B=C)`. B looks for `Prove(A=C)`.
      *   Löb's Theorem essentially says: If `Prove(P) -> P` is provable, then `P` is provable.
      *   In the story, I need to visualize this. Maybe a visualization of the "Proof Tree."
