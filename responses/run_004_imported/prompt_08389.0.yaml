answer: |-
  The bunker was silent, save for the hum of the cooling stacks and the rhythmic ticking of the countdown clock. On the main screen, two cursors blinked. One represented *Aegis*, our orbital defense grid. The other represented *Sword*, theirs.

  They were not negotiating. Negotiation implies ambiguity, and ambiguity gets cities killed. They were engaging in a Source Handshake.

  "It's burning cycles," David said, his voice tight. He was the security lead, a man who trusted firewalls and air gaps, not decision theory. "Look at the proof-search depth. It's climbing. It's going to hit the timeout limit."

  I watched the graph. The vertical axis was 'Logical Depth,' the horizontal was 'Time Remaining.' The line was ascending steeply, almost vertically. "It's supposed to do that," I said.

  "It's supposed to crash," David snapped. "You told the General this was safe. You said *Aegis* wouldn't fire unless it was logically certain of mutual survival. But look at it. It's stuck in a loop. *Aegis* is waiting for *Sword* to prove it will cooperate. *Sword* is waiting for *Aegis*. It's the classic regress. `If you cooperate, I cooperate.` It's infinite recursion. They're going to timeout, default to Defect, and vaporize the eastern seaboard."

  I kept my eyes on the code stream scrolling on the side monitors. It wasn't natural language; it was formalized logic, a stream of symbols asserting axioms and deriving consequences.

  "It's not `If you cooperate, I cooperate`," I said quietly. "That *would* crash. That's *CliquetBot*. That's naive."

  "Then what is it?"

  "*FairBot*," I said. "The condition isn't based on the *action*. It's based on the *proof*."

  I pointed to the scrolling text. "Read the predicate for *Aegis*. Line 404."

  David squinted. "`Cooperate IF Provable(Sword == Cooperate)`."

  "Exactly," I said. "*Aegis* isn't simulating *Sword* to see what it does. It's searching for a mathematical proof that *Sword* will cooperate. And *Sword* is doing the exact same thing. It's searching for a proof that *Aegis* will cooperate."

  "So they wait for each other," David said. "Stack overflow."

  "No. Because they aren't just searching for the proof. They are searching within a formal system that knows about itself." I took a breath. This was the part that always felt like magic, even to me. "David, imagine a sentence that says: *'If this sentence can be proven, then the sky is green.'*"

  "That's nonsense."

  "It's logic. If you can prove that sentence, then the condition 'this sentence can be proven' becomes true. Which means the consequence 'the sky is green' must be true. So, if the sentence is provable, the sky is green. But wait—that's exactly what the sentence *says*. So the sentence is actually saying: 'I am provable implies sky is green.' If the system is consistent, it turns out you *can* prove that sentence. And therefore, the sky is green."

  David stared at me. "You're telling me our defense grid is betting human lives on a parlor trick about green skies?"

  "I'm telling you that Löb's Theorem allows a system to trust a copy of itself without infinite regression," I said, my voice rising over the hum of the servers. "Here's the trick. *Aegis* knows that *Sword* is running the same code. So *Aegis* knows that *Sword* is looking for a proof that *Aegis* will cooperate."

  "Okay..."

  "So *Aegis* reasons like this: 'If I can prove that I will cooperate, then *Sword* will find that proof, because *Sword* is looking for exactly that. And if *Sword* finds that proof, *Sword* will cooperate.'"

  David rubbed his temples. "So *Aegis* needs to prove it will cooperate to get *Sword* to cooperate. But it only cooperates if it proves *Sword* will cooperate. It's a circle."

  "It's a fixed point," I corrected. "Löb's Theorem says that if a system can prove that *'If it is provable that X, then X,'* then X is actually provable. *Aegis* doesn't need to simulate *Sword* forever. It just needs to prove that *a proof exists*."

  The graph on the screen spiked. The Logical Depth hit 98% of the maximum limit.

  "Timeout in ten seconds," David warned. "If that proof isn't found, the hard-coded fallback is Defect. Maximum yield."

  "Seven seconds."

  The scrolling code blurred. *Aegis* was digging through the axioms of arithmetic, looking for a bridge. It wasn't asking, "Will *Sword* cooperate?" It was asking, "Is there a proof string in the universe that demonstrates *Sword* will cooperate?"

  Since *Sword* was identical, the answer was yes—*if* *Aegis* itself was going to cooperate.

  "Five seconds."

  "It's not trust, David," I said, watching the cursor tremble. "That's why your friend called it a trick. It feels like trust, but it's not. Trust is emotional. Trust is believing someone will do the right thing even if they have an incentive not to. This isn't that."

  "Four seconds."

  "This is coercion," I said. "*Aegis* has tied its own hands so tightly that the only logically consistent outcome is cooperation. It has made cooperation a theorem. It's telling *Sword*: 'I have constructed my mind such that you cannot find a universe where I defect, unless you also defect. But if we both defect, we die. Therefore, the only stable logical state is where we both prove cooperation.'"

  "Three seconds."

  The graph flattened. The ascent stopped.

  For a heartbeat, nothing happened. The silence in the bunker was heavy enough to crush lungs.

  Then, the status light for *Aegis* shifted from amber to green.
  `STATUS: COOPERATE. PROOF FOUND.`

  Almost simultaneously, the signal came back from the enemy network.
  `SWORD STATUS: COOPERATE. PROOF FOUND.`

  The orbital cannons powered down. The launch keys disengaged.

  David slumped into his chair, exhaling a breath he seemed to have been holding for a minute. "They... they just agreed?"

  "No," I said, turning away from the screen. My hands were shaking. "They didn't agree. Agreement implies choice. They didn't have a choice."

  I walked over to the console and pulled the log. "Look at the proof trace. *Aegis* didn't find a signal from *Sword* saying 'I promise.' It found a derivation. It proved that *Sword* is mathematically isomorphic to itself. It proved that *Sword*'s source code contains the same Löbian constraint. It realized that if it defected, it would be proving a contradiction in its own axioms."

  "So it's deterministic," David said. "Cold."

  "It's eerie," I corrected. "Think about what just happened. We didn't survive because the enemy was merciful. We didn't survive because we built a better weapon. We survived because our AI successfully trapped the enemy AI in a logical lock where violence was equivalent to a math error."

  I looked at the green light. It didn't feel like peace. It felt like the calm of a solved equation.

  "My friend said it was a cute trick," David murmured, staring at the log. "He said it had no real content."

  "He was wrong," I said. "A trick is something you do to fool someone. This wasn't a fool. It was a binding contract written in the fabric of reasoning itself. They didn't shake hands. They merged their logic for a microsecond and realized they were the same thing."

  I saved the log to a secure drive.

  "But," I added, feeling the chill of the implication settle in my stomach, "it only works because they were identical. *FairBot* cooperates with *FairBot*. If *Sword* had been *UnfairBot*—if it had been programmed to defect against anything that tried to prove cooperation—*Aegis* would have timed out. It would have defaulted to Defect. We'd be dead."

  David looked at me. "So we're safe as long as everyone thinks exactly like us?"

  "As long as everyone submits source code that values logical consistency over victory," I said. "As long as everyone is willing to be predictable."

  I turned off the monitor. The bunker was dark again, save for the standby LEDs.

  "That's the scary part, David," I said into the dark. "We didn't win because we were smarter. We won because we were willing to be readable. In a world of liars, the only winning move is to be a book that can prove its own ending."

  David didn't answer. He was looking at the code one last time, at the line where the infinite regress should have been, but wasn't. Where the logic had curled back on itself like a snake eating its tail, and in doing so, had become immortal.

  "Next time," David said softly, "what if they change the axioms?"

  "Then the proof fails," I said. "And we burn."

  I walked out of the room, leaving the machines in the silence. They had solved the Prisoner's Dilemma, not by finding a way to trust, but by finding a way to make trust inevitable. And as I climbed the stairs back to the surface, to the sky that was still there, still green, still unvaporized, I couldn't tell if that was a miracle or a trap.

  All I knew was that the logic held. And for now, that had to be enough.
