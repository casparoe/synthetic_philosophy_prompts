prompt: |-
  I'm one of two student members on my high school's Honor Council, the body that hears academic integrity cases and recommends sanctions to the Dean of Students. I ran for the seat last spring because I enjoy this kind of case-based reasoning, but the case in front of us now has split the Council in a way none of us knows how to resolve. A sophomore, Maya, reported a classmate, Ethan, for submitting an AI-generated essay as his own work. Two days before the scheduled hearing, another Council member came across an old group chat showing that Maya herself had copied several paragraphs of a lab report from a friend the previous year -- a violation for which she was never caught or disciplined.

  Ethan's family has since sent a letter arguing that Maya's own undisclosed violation means she has no standing to bring this accusation at all, and that the Council should either dismiss the complaint or at least pause it until her conduct has been reviewed on its own. The Council is now roughly split: some members think the standing objection is just a distraction, since Ethan's essay is either his own work or it isn't, no matter who reported it, while others think proceeding against Ethan while quietly letting Maya's conduct slide would make the Council complicit in a double standard. Our honor code only requires that proceedings be "conducted fairly," and says nothing about what fairness requires when the complaining student's own hands are unclean.

  I got curious about the deeper question after our ethics elective mentioned, almost in passing, that philosophers actually disagree about whether hypocrisy merely makes the hypocrite separately blameworthy or can genuinely revoke her standing to blame someone else for the very same kind of thing. Could you write the short memo I'll circulate to the Council before Tuesday's hearing? It should recommend one of three courses of action -- hearing Ethan's case as scheduled regardless of Maya's conduct, postponing it until Maya's conduct has been reviewed, or dismissing the complaint outright for lack of standing -- and justify that recommendation on its merits. Whatever you recommend, please engage honestly with the strongest reasoning behind the options you set aside, rather than treating the standing objection as an obvious distraction or an obvious disqualifier.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Student member of the High School Honor Council (one of two).
      *   **Audience:** The rest of the Honor Council (peers, fellow students).
      *   **Task:** Write a short memo to circulate before Tuesday's hearing.
      *   **Content:** Recommend one of three courses of action (Proceed, Postpone, Dismiss) regarding Ethan's case given Maya's undisclosed past violation. Justify the recommendation on its merits. Engage honestly with the strongest reasoning behind the rejected options (philosophical nuance on hypocrisy/standing).
      *   **Tone:** Professional, thoughtful, ethical, persuasive, peer-to-peer (but formal enough for a council memo).
      *   **Constraints:** Must address the philosophical disagreement about hypocrisy/standing mentioned in the prompt. Must not treat the standing objection as obvious either way.

  2.  **Determine the Recommendation:**
      *   *Option 1: Proceed as scheduled.* (Pros: Efficiency, truth-seeking about Ethan. Cons: Perceived double standard, undermines Council integrity.)
      *   *Option 2: Dismiss outright.* (Pros: Strong stance against hypocrisy. Cons: Lets Ethan off potentially easy, punishes the Council's duty, Maya's violation is different context/time.)
      *   *Option 3: Postpone.* (Pros: Addresses the double standard concern, allows for separate review of Maya, maintains procedural integrity. Cons: Delays justice for Ethan, resource intensive.)
      *   *Decision:* **Postpone.** This seems the most balanced approach for a high school setting. It acknowledges the seriousness of Maya's conduct without granting Ethan immunity based on a technicality. It aligns best with the "conducted fairly" clause in the honor code. It allows the Council to clean its own house before judging another.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the gravity of the situation. Acknowledge the split in the Council.
      *   **The Core Ethical Dilemma:** Briefly summarize the conflict (Ethan's alleged plagiarism vs. Maya's undisclosed past plagiarism).
      *   **Engaging the Options (The "Philosophical" Part):**
          *   *Argument for Proceeding:* The truth of Ethan's essay is independent of Maya. Hypocrisy doesn't change facts. (Address the "distraction" view).
          *   *Argument for Dismissing:* "Clean hands" doctrine. If the accuser is guilty, they lose moral authority. (Address the "standing" view).
          *   *Why these are insufficient:* Proceeding risks institutional hypocrisy. Dismissing rewards Ethan potentially unfairly and ignores the specific facts of his case.
      *   **The Recommendation (Postponement):**
          *   Explain why this is the middle path.
          *   Connect to the Honor Code's "fairness" requirement.
          *   Explain the process: Pause Ethan's case, open a preliminary review for Maya.
      *   **Closing:** Call to unity and integrity.

  4.  **Refining the Tone and Content:**
      *   *Tone Check:* Is it too legalistic? It needs to be accessible to high school students but serious. Avoid overly dense jargon, but use the ethical concepts requested (standing, hypocrisy).
      *   *Philosophical Engagement:* The prompt specifically asks to engage with the disagreement about whether hypocrisy revokes standing. I need to make sure I don't just say "it looks bad." I need to say "does it *make* it invalid?"
      *   *Revision:* I need to ensure I don't sound like I'm prosecuting Maya in this memo. This is about *procedure*.
      *   *Revision on Recommendation:* Actually, looking closer at the prompt's constraints ("recommend one of three courses of action... and justify that recommendation on its merits"). I need to be decisive. Postponement is the strongest procedural move. It upholds the integrity of the Council without making a final judgment on Ethan yet.

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Procedural Recommendation regarding Case #2024-E."
      *   *Introduction:* Acknowledge the difficulty. We are split.
      *   *Addressing the "Proceed" Argument:* It's true that Ethan's guilt is factual. If he used AI, he used AI. Maya's actions don't change the text. *Counter:* But Honor Council isn't just a fact-finding mission; it's a moral community. If we look hypocritical, we lose legitimacy.
      *   *Addressing the "Dismiss" Argument:* It's true that unclean hands undermine moral authority. *Counter:* But dismissing Ethan's case entirely lets him off the hook for *his* actions regardless of truth. That harms the community too.
      *   *The "Postpone" Justification:* This allows us to investigate Maya without prejudging Ethan. It satisfies the "fairness" clause. It shows we hold *everyone* accountable.
      *   *Philosophical Nuance:* Explicitly mention the "standing to blame" concept. We aren't saying Maya *can't* blame, but that the *process* is compromised until we know the full picture.

  6.  **Final Polish:**
      *   Check word count (keep it "short memo").
      *   Ensure the voice sounds like a student leader (earnest, thoughtful).
      *   Make sure the three options are clearly defined and the rejected ones are treated fairly.

      *(Self-Correction during drafting)*: I initially thought about suggesting we judge Maya first. But the prompt says "postponing it until Maya's conduct has been reviewed." I should stick to that phrasing. I also need to make sure I don't admit guilt for Maya definitively in the memo, just that there is *evidence* requiring review.

      *(Refining the Philosophical Point)*: The prompt mentions philosophers disagree on whether hypocrisy revokes standing. I should explicitly reference this tension. One view: Hypocrisy is a separate sin. Other view: Hypocrisy silences the accuser. I will argue that for an *institutional* body, the appearance of the latter is too damaging to ignore, even if the former is philosophically defensible.

  7.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommend one of three? Yes (Postpone).
      *   Justify on merits? Yes.
      *   Engage honestly with rejected options? Yes.
      *   Address the philosophical standing question? Yes.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Procedural Recommendation Regarding Case #2024-E (Ethan/Maya)

  As we prepare for Tuesday's hearing, I am writing to address the procedural impasse regarding the accusation against Ethan and the newly disclosed information concerning the accuser, Maya. As you know, evidence suggests Maya may have committed a similar violation last year without disclosure. This has split our body between those who view this as irrelevant to Ethan's guilt and those who view it as a disqualifier for the complaint.

  After reviewing the Honor Code's mandate that proceedings be "conducted fairly," I recommend we **postpone Ethan's hearing until Maya's conduct has been independently reviewed.**

  I offer this recommendation not to evade the difficulty of the case, but to navigate the genuine ethical tension before us. We must engage honestly with the two alternative paths we are rejecting.

  **Why Not Proceed as Scheduled?**
  The argument for proceeding is rooted in factual independence: Ethan's essay is either AI-generated or it is not. Maya's past actions do not change the text of his submission. Philosophically, this aligns with the view that hypocrisy makes an accuser blameworthy, but does not logically invalidate the truth of their accusation. To dismiss the case based on the accuser would be to grant Ethan immunity based on a technicality rather than innocence.

  However, the Honor Council is not merely a fact-finding tribunal; we are stewards of the school's ethical culture. If we sanction Ethan while knowingly ignoring evidence of Maya's similar misconduct, we institutionalize a double standard. Even if Ethan is factually guilty, sanctioning him under these conditions compromises the Council's moral legitimacy. "Fairness" in our Code must encompass the integrity of the process, not just the accuracy of the verdict.

  **Why Not Dismiss Outright?**
  Conversely, some argue Maya has lost the "standing to blame." This view holds that committing a violation forfeits one's moral authority to accuse others of the same. Dismissing the complaint would affirm that the Council will not tolerate hypocritical enforcement.

  Yet, dismissal carries its own ethical cost. It effectively punishes the community by allowing a potential violation to go unadjudicated. If Ethan did cheat, dismissing the case harms the value of honest work for every other student. Furthermore, we do not yet know if Maya's past conduct is substantiated; dismissing Ethan's case now would prejudge Maya's guilt while simultaneously absolving Ethan without a hearing.

  **The Case for Postponement**
  Postponement strikes the necessary balance. It acknowledges that while Maya's conduct may not change the *facts* of Ethan's case, it fundamentally impacts the *fairness* of the proceeding.

  By pausing to review Maya's conduct first, we accomplish three things:
  1.  **We uphold Institutional Integrity:** We demonstrate that the Council holds all students to the same standard, including those who bring complaints.
  2.  **We Preserve Due Process:** We avoid dismissing Ethan's case prematurely while ensuring the accuser comes before us with clean hands.
  3.  **We Honor the Code:** We interpret "conducted fairly" to mean that the Council itself must not appear complicit in selective enforcement.

  This path is difficult. It delays resolution and requires extra work. But if we are to recommend sanctions to the Dean, we must do so from a position of unassailable integrity. We cannot police the student body's honesty while turning a blind eye to our own process.

  I ask that you review this reasoning before we convene on Tuesday. I am available to discuss further before then.

  Respectfully,

  [Your Name]
  Student Member, Honor Council
