answer: |-
  This is a classic friction point in the seminar. It is easy to conflate Lewis and Woodward because both reject regularity theories and both rely on counterfactuals. However, treating them as "the same thing with different vocab" misses a crucial metaphysical and methodological divergence.

  The short answer is: **Lewis solves late preemption by chaining counterfactuals across time; Woodward solves it by isolating causal paths within a structural model.**

  The specific "buy" you get with Interventionism (specifically when formalized via Structural Equation Models, or SEMs, as Woodward and Hitchcock do) is the ability to **hold off-path variables fixed at their actual values** during a counterfactual test. Lewis's similarity semantics forbids this.

  Here is the breakdown of how they handle the Suzy/Billy late preemption case and where the divergence matters.

  ### 1. The Setup: Late Preemption
  *   **Scenario:** Suzy ($S$) and Billy ($B$) throw. Suzy's rock hits first, shattering the bottle ($E$). Billy's rock would have shattered it if Suzy's hadn't, but it didn't because the bottle was already gone.
  *   **The Problem:** Simple counterfactual dependence fails. If Suzy hadn't thrown ($\neg S$), Billy would have ($\neg S \boxright B$), and the bottle would have shattered ($\neg S \boxright E$). So, $E$ does not depend on $S$.

  ### 2. Lewis's Solution: Stepwise Dependence
  Lewis (1986) admits simple dependence fails here. His fix is **ancestry**. Causation is the ancestral of counterfactual dependence.
  *   **The Chain:** Suzy throws $\rightarrow$ Suzy's rock flies $\rightarrow$ Suzy's rock hits $\rightarrow$ Bottle shatters.
  *   **The Logic:** While $E$ doesn't depend on $S$, $E$ depends on the *hit* ($H_S$), and $H_S$ depends on the *throw* ($S$). Because there is a chain of stepwise dependencies, $S$ causes $E$.
  *   **The Cost:** This requires **intrinsic intermediate events**. There must be spatiotemporally located events bridging the cause and effect. If the causation is action-at-a-distance, or if the process is "gappy," Lewis's chain breaks. Furthermore, Lewis relies on a similarity metric for possible worlds that is notoriously context-sensitive. He has to argue that the world where Suzy doesn't throw and the bottle *doesn't* shatter is less similar than the world where Suzy doesn't throw and Billy *does*.

  ### 3. Woodward's Solution: Structural Isolation
  Woodward (and Christopher Hitchcock, who formalized this part) uses Structural Equation Models. We model the system with variables and equations.
  *   **The Model:**
      *   $S = 1$ (Suzy throws), $B = 1$ (Billy throws).
      *   $H_S = S$ (Suzy's rock hits if she throws).
      *   $H_B = B \times (1 - H_S)$ (Billy's rock hits only if he throws *and* Suzy's didn't hit).
      *   $E = \max(H_S, H_B)$ (Bottle shatters if either hits).
  *   **The Intervention:** To test if $S$ causes $E$, we intervene on $S$ (set $S=0$).
  *   **The Problem:** If we just set $S=0$, the equation for $H_B$ yields $1$ (since $1 - 0 = 1$). So $E$ remains $1$. Simple interventionism *also* seems to fail here.

  ### 4. Where Interventionism "Buys" You Something
  This is the crux of your seminar point. Woodward's framework allows a move that Lewis's possible worlds semantics **metaphysically prohibits**.

  #### A. Holding Off-Path Variables Fixed (De Facto Dependence)
  In the Interventionist/SEM framework, we distinguish between **total causation** and **path-specific causation**. To determine if $S$ is a cause, we can test for dependence along the *actual* path while **holding the backup path fixed at its actual value.**

  *   **Woodwardian Move:** We intervene on $S$ (set $S=0$), but we *hold fixed* the variable $H_B$ (Billy's hit) at its **actual value** (0).
  *   **Result:** If $S=0$ and $H_B=0$, then $E=0$. Dependence is restored. $E$ depends on $S$ *given* that Billy's rock didn't hit.
  *   **Why Lewis Can't Do This:** In Lewis's possible worlds semantics, you cannot "hold fixed" $H_B$ at 0 in the closest $\neg S$ world. Why? Because the laws and facts of that world dictate that if $S$ doesn't happen, $B$ *does* succeed. To hold $H_B$ fixed at 0 would require a "miracle" or a violation of the counterfactual dynamics that makes the world *less* similar to actuality. Lewis is bound by the **dynamic evolution** of the closest world. Woodward is bound by the **structural capacity** of the variables.

  **The Buy:** Interventionism allows you to say Suzy is the cause because she has the *capacity* to shatter the bottle, independent of the backup. Lewis has to say Suzy is the cause because there happened to be a chain of events. Woodward captures the *asymmetry* of the causal structure (Suzy inhibited Billy, not vice versa) without needing a spatiotemporal chain.

  #### B. Variable Granularity vs. Event Fragility
  Both accounts can solve late preemption by making the effect variable more precise (e.g., "Shattering at $t_1$" vs. "Shattering at $t_2$"). If $E$ is "Shattering at $t_1$," then if Suzy doesn't throw, Billy hits at $t_2$, so $E$ doesn't happen. Dependence restored.

  *   **Lewis's View:** He calls this making events "fragile." He generally dislikes this because it makes causation too sensitive to trivial differences. He prefers the stepwise chain solution.
  *   **Woodward's View:** He *mandates* this. For Woodward, causation is relative to a set of variables. If your variable set is too coarse ($E$ = "Shattering"), you won't find the cause. If you refine the variables ($E$ = "Shattering time"), you will.
  *   **The Buy:** Woodward turns this from a bug into a feature. It clarifies that causal claims are always relative to a model. Lewis treats coarse-grained causation as the metaphysical default and fine-grained dependence as a workaround. Woodward treats the model specification as the primary philosophical work.

  #### C. Early Preemption (The Foreshadowing)
  While you asked about Late Preemption, the real advantage of Interventionism becomes undeniable in **Early Preemption** (where the backup process is initiated *before* the actual cause completes, so there is no intermediate event where the backup is inactive).
  *   **Lewis:** Fails. There is no point in the chain where the effect depends on the intermediate event, because the backup is already primed to take over at every step. Lewis has to resort to "quasi-dependence" (intrinsic similarity of processes), which is vague.
  *   **Woodward:** Succeeds easily using the "hold off-path fixed" method described above.
  *   **Relevance to your seminar:** Even in Late Preemption, pointing out that Woodward's solution *scales* to Early Preemption without modification shows that his account is more robust. Lewis requires two different patches (Stepwise for Late, Quasi-dependence for Early).

  ### Summary for Seminar
  If you want to cut through the "same thing, different vocab" confusion, argue this:

  1.  **Lewis is Metaphysical/Dynamic:** He asks, "In the closest possible world where $C$ is absent, what *happens*?" In preemption, the backup happens. He must find a chain to bridge the gap.
  2.  **Woodward is Methodological/Structural:** He asks, "In a model of the system, is there a path from $C$ to $E$ that transmits a change?" He can surgically disable the backup path to test the capacity of the primary path.
  3.  **The Specific Buy:** Interventionism allows **counterfactuals with fixed off-path variables** (De Facto Dependence). Lewis's similarity semantics forbids this because the fixed variable would be inconsistent with the "closest world" dynamics. This allows Woodward to locate causation in the *structure of dependencies* rather than the *history of events*.

  This distinction shows that Interventionism isn't just Counterfactual Theory 2.0; it's a shift from analyzing the *history of the world* to analyzing the *modularity of the system*.
