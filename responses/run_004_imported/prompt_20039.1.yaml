          *   *Realism:* Features are ontologically distinct entities within the circuit (like a logic gate).
          *   *Instrumentalism:* Features are useful descriptions for us to compress the model's function.
      *   **Three Key Implications for Skepticism:**
          1.  **The Causal Test (Intervention):** In neuroscience, we do opto/lesions. In MI, we do activation patching. If you claim a representation exists, you must be able to edit it and change behavior predictably. *Skepticism rule:* Don't trust probes without patches.
