prompt: |-
  I'm a retired systems neuroscientist (decades spent recording place and grid cells) who's gotten pretty into philosophy of mind in retirement, and lately I've been reading mechanistic interpretability papers for fun. The Othello-GPT story really got under my skin: a transformer trained only to predict legal Othello moves seemed to have an internal "representation" of the board that only nonlinear probes could find - until Neel Nanda showed a clean linear version was there all along, just encoded as "my piece vs. their piece" rather than "black vs. white." Which pattern counts as "the" representation seemed to depend entirely on how you chose to decode it. Its left me wondering whether these networks have representations in anything like the sense my old field meant when it said a place cell "represents" an animal's location, or whether thats just us projecting our own explanatory habits onto a pile of matrix multiplications. Could you describe the most important implications of that realism-vs-instrumentalism question for how skeptical I should be, as an amateur reader with no stake in the field, whenever some future paper claims a model has "learned a representation" of this or that?
