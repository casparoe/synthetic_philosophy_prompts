      *   *Key Point:* MR holds across *different* functions or very coarse descriptions, but when you drill down to the specific mechanism implementing a specific cognitive capacity, physical structure matters more than pure functionalists admit.
      *   *Implication for Functionalism:* It challenges *unrestricted* MR. It suggests that psychological kinds might map more tightly to neurobiological kinds than functionalism allows.

  3.  **Evaluate Implications for Whole Brain Emulation (WBE):**
      *   *The Functionalist Hope:* If the brain is a computer, you can run the software on different hardware.
      *   *The Bechtel/Mundale Worry:* If the "software" is inextricably tied to the specific "hardware" properties (e.g., neurotransmitter diffusion rates, analog dendritic processing, glial interactions), then a digital simulation might miss crucial causal powers.
      *   *Granularity Issue:* To capture the "real" mental states, do you need to simulate at the molecular level? Quantum level? Or is the neuron level enough? Bechtel/Mundale suggest the relevant level is where structural commonality exists. If silicon lacks that structural commonality, MR fails.

