      *   *Point 1: The Granularity Problem.* B&M argue MR depends on how you carve up the system. If you carve too coarsely (input/output), MR looks true. If you carve at the mechanism level, MR looks false. *Implication:* WBE needs to simulate at the *right* level. Is the neuron the right level? Or the synapse? Or the molecule?
