      *   **Context:** The user is familiar with rationalist blogs/forums (LessWrong, etc.), cryonics, and the standard functionalist argument for Whole Brain Emulation (WBE) preserving personal identity/mental life.
      *   **Core Argument:** The standard view relies on *Multiple Realizability* (MR): mental states are defined by causal-functional roles, not physical substrate (silicon vs. carbon).
      *   **The Critique:** The user cites Bechtel and Mundale (1999), who argue that neuroscientists individuate functions at a *coarser grain* based on structural commonality, not the rampant MR Putnam assumed. MR might be an artifact of description levels.
