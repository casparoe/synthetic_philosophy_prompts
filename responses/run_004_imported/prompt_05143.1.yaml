  1.  **Analyze the User's Request:**
      *   **Goal:** The user is a novelist writing a scene about betrayal and deflection (tu quoque argument).
      *   **Problem:** They want the dialogue to feel philosophically robust, not just a childish "you did it too."
      *   **Specific Philosophical Puzzle:** They've read about "standing to blame." They note two counter-intuitive points:
          1.  *Non-hypocritical offenders* (open about their faults) still seem to lack standing to blame others for the *same* fault.
          2.  *Hypocrites* (who preach one thing and do another) often *retain* standing to blame others for *unrelated* faults.
      *   **Conclusion:** Hypocrisy is neither necessary nor sufficient for losing standing to blame.
      *   **Task:** Explain what *is* doing the work (the actual source of lost standing) in plain, intuitive terms suitable for a novelist to use in a scene. Avoid academic literature review style.

  2.  **Deconstruct the Philosophical Concept (Standing to Blame):**
      *   *The Core Issue:* Why can't I blame you for X if I do X too?
      *   *The Hypothesis:* It's not about inconsistency (hypocrisy). It's about *authority* or *commitment*.
      *   *Key Insight 1 (The "Same Wrong" Problem):* If we both cheat, and I blame you, I'm treating you as subject to a rule I exempt myself from. It's not about hiding it (hypocrisy); it's about the *implication* of the blame act itself. Blaming says, "We are bound by this norm, and you violated it." If I violate it too, I'm implicitly claiming a privilege I don't have.
      *   *Key Insight 2 (The "Unrelated Wrong" Problem):* If I cheat on taxes but blame you for cowardice, I haven't exempted myself from the norm of *courage*. My failure in finance doesn't invalidate my commitment to bravery.
      *   *The Real Mechanism:* It's about **Commitment to the Norm** vs. **Exemption from the Norm**.
      *   *Alternative Mechanism:* **Respect/Equality.** Blaming someone while doing the same thing treats them as a subordinate, not an equal partner in the moral community.

  3.  **Brainstorming Intuitive Metaphors/Terms for a Novelist:**
      *   *The Judge Analogy:* A judge can't sentence someone for a crime they are actively committing. It's not about being secret; it's about the role.
      *   *The Team Captain:* A captain who breaks the team rules can't bench a player for breaking the same rules.
      *   *The "Clean Hands" idea:* But not moral purity. More like "skin in the game."
      *   *The "Invitation":* Blame is an invitation to acknowledge a shared standard. If I don't follow it, the invitation is fake.
      *   *Key Term:* **Authorization.** Do I have the right to enforce this?
      *   *Key Term:* **Solidarity.** Are we in this together?
      *   *Key Term:* **Waiver.** By doing it, have I waived my right to complain?

  4.  **Developing the Core Explanation (The "What's Actually Doing the Work"):**
      *   It's not about *lying* (hypocrisy). It's about *waiving authority*.
      *   When you blame someone, you are invoking a shared law.
      *   If you break that same law, you aren't necessarily a liar (if you admit it). But you are effectively saying, "This law doesn't bind me."
      *   If the law doesn't bind you, you can't use it to bind me.
      *   *Why is it hard to locate?* Because we conflate "being a good person" with "having the right to speak." We also conflate "inconsistency" with "invalidity."
      *   *The "Unrelated Wrong" nuance:* I can blame you for cowardice even if I'm a tax cheat because I haven't waived my authority on courage.

  5.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Respectful, clear, practical, focused on character motivation and dialogue subtext.
      *   *Structure:*
          1.  Validate the user's insight (they are right, hypocrisy isn't the key).
          2.  Identify the real mechanism (Commitment/Authority).
          3.  Explain the "Same Wrong" vs. "Different Wrong" distinction.
          4.  Provide actionable "beats" or concepts for the scene.
          5.  Offer sample dialogue snippets to illustrate.

      *   *Refining the Concept:* Let's call it **"The Right to Invoke the Rule."**
      *   *Analogy:* Think of blame not as an attack, but as an appeal to a shared contract. If I've torn up my copy of the contract, I can't sue you for breaking it.
      *   *Why it's hard:* Because we think blame is about *punishment*. It's actually about *reaffirming values*.
      *   *For the Scene:* The accuser needs to realize the deflector isn't just being annoying; they are challenging the *validity* of the accusation itself based on shared participation.

  6.  **Addressing the "Why it's hard to locate" part:**
      *   It's invisible because it's structural. It's not about the *content* of the speech (lying), it's about the *position* of the speaker.
      *   It's like a structural engineer noticing a beam is load-bearing vs. just looking at the paint on the beam.

  7.  **Final Polish:**
      *   Make sure I don't get too academic. Use words like "currency," "contract," "weight."
      *   Ensure the distinction between *hypocrisy* (saying one thing, doing another) and *complicity* (doing the same thing) is clear.
      *   *Crucial distinction:* The user mentioned the open offender lacks standing. This is the "Tu Quoque" fallacy vs. the "Standing" objection. Tu Quoque is a logical fallacy (your argument is still true even if you're a hypocrite). Standing is a moral/relational status (you don't get to *say* it to me). I need to make sure the character understands the difference between "Is the blame true?" (Yes) and "Do you get to deliver it?" (No).

  8.  **Constructing the "Novelist's Toolkit":**
      *   Concept 1: The Shared Contract.
      *   Concept 2: The Currency of Blame.
      *   Concept 3: The Specificity of the Breach.
      *   Dialogue tip: Shift from "You lied" to "Who are you to say this?"

  9.  **Review against constraints:**
