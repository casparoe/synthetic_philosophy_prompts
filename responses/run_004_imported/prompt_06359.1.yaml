answer: |-
  You are correct to be skeptical of the "utilitarianism for free" summary. The folk version often conflates the *structural form* of the social welfare function (which Harsanyi does derive) with the *normative weighting* of individuals (which the theorem leaves underdetermined).

  Here is the mechanical breakdown of Harsanyi's Aggregation Theorem, isolating the linear algebra that drives the result and pinpointing exactly where the normative heavy lifting is hidden.

  ### The Setup

  Let $\mathcal{L}$ be the set of lotteries over a set of outcomes. We assume there are $n$ individuals.
  1.  **Individual Preferences:** Each individual $i$ has preferences $\succeq_i$ over $\mathcal{L}$ satisfying the von Neumann–Morgenstern (vNM) axioms. Thus, each $i$ is represented by a utility function $V_i: \mathcal{L} \to \mathbb{R}$, unique up to a positive affine transformation ($V_i' = \alpha_i V_i + \beta_i, \alpha_i > 0$). Crucially, $V_i$ is **linear** in probabilities (expected utility).
  2.  **Social Preferences:** Society has preferences $\succeq_S$ over $\mathcal{L}$ satisfying vNM axioms, represented by a social utility function $V_S: \mathcal{L} \to \mathbb{R}$, also linear.

  The core mathematical object here is that $V_i$ and $V_S$ are **linear functionals** on the vector space of lotteries.

  ---

  ### (a) Pareto Indifference and the Sign Problem

  **The Condition:** Pareto Indifference states that if every individual is indifferent between two lotteries $L$ and $L'$, society must be indifferent.
  $$ \forall i, V_i(L) = V_i(L') \implies V_S(L) = V_S(L') $$

  **The Mechanics:**
  In linear algebra terms, consider the difference between two lotteries as a vector $x = L - L'$. The condition says:
  $$ \text{If } V_i(x) = 0 \text{ for all } i, \text{ then } V_S(x) = 0. $$
  This means the kernel (null space) of the social functional contains the intersection of the kernels of the individual functionals:
  $$ \bigcap_{i=1}^n \ker(V_i) \subseteq \ker(V_S) $$
  A standard result in linear algebra (often called the **Harsanyi Lemma** or a corollary of the Riesz Representation Theorem in this context) states that if a linear functional vanishes wherever a set of other linear functionals vanish, it must be a **linear combination** of those functionals.

  Therefore, there exist real coefficients $a_1, \dots, a_n$ and a constant $b$ such that:
  $$ V_S(L) = \sum_{i=1}^n a_i V_i(L) + b $$

  **Where the Signs Fail:**
  Notice that the linear algebra lemma guarantees $a_i \in \mathbb{R}$. It does **not** guarantee $a_i \ge 0$.
  *   **Example:** Suppose $n=2$. Let $V_S = V_1 - V_2$.
  *   **Check Indifference:** If $V_1(L) = V_1(L')$ and $V_2(L) = V_2(L')$, then clearly $V_S(L) = V_S(L')$. Pareto Indifference is satisfied.
  *   **The Problem:** If individual 2 experiences a gain ($V_2$ increases) while individual 1 stays constant, social utility *decreases*. This represents a "sadistic" or "anti-egalitarian" social welfare function.

  Pareto Indifference aligns the *level sets* (the contour lines) of the social utility function with the intersection of individual level sets, but it does not align the *gradients*. It tells us the social indifference curves are parallel to the individual ones, but not which direction is "up."

  ---

  ### (b) Strengthening to Pareto Efficiency

  To fix the signs, we need a condition that specifies direction, not just equivalence.

  **The Condition:** Weak Pareto Efficiency states that if every individual weakly prefers $L$ to $L'$, society must weakly prefer $L$ to $L'$.
  $$ \forall i, V_i(L) \ge V_i(L') \implies V_S(L) \ge V_S(L') $$

  **The Mechanics:**
  We already know from part (a) that $V_S = \sum a_i V_i + b$. We need to show $a_i \ge 0$.
  Suppose for contradiction that some coefficient $a_k < 0$.
  Because the individuals are not dictators (their preferences are not perfectly correlated in a way that forces $V_k$ to move only when others move), we can construct a lottery change $x$ such that:
  1.  $V_k(x) > 0$ (Individual $k$ gains).
  2.  $V_j(x) = 0$ for all $j \neq k$ (Everyone else is indifferent).

  Under Weak Pareto, since everyone is at least as well off (and $k$ is strictly better off), society must be strictly better off: $V_S(x) > 0$.
  However, substituting into our linear combination:
  $$ V_S(x) = a_k V_k(x) + \sum_{j \neq k} a_j \cdot 0 = a_k V_k(x) $$
  Since $a_k < 0$ and $V_k(x) > 0$, then $V_S(x) < 0$. This contradicts the Pareto condition.
  Therefore, **all $a_i$ must be non-negative.** (To ensure strictly positive $a_i > 0$, one typically requires a slightly stronger Pareto condition or an assumption that no individual is irrelevant).

  **The Result:**
  Pareto Efficiency forces the social gradient to lie within the positive cone spanned by the individual gradients. This rules out the "sadistic" weights, yielding a **Weighted Utilitarian** form:
  $$ V_S = \sum_{i=1}^n a_i V_i + b \quad \text{with } a_i \ge 0 $$

  ---

  ### (c) The Interpersonal Comparability Problem (Sen's Critique)

  This is the crux of your skepticism. We have established that social utility is a weighted sum of individual utilities with non-negative weights. Why is this not "Utilitarianism"?

  **The Scaling Issue:**
  Recall that vNM utility functions are unique only up to **positive affine transformations**. For any individual $i$, the function $V_i^* = \alpha_i V_i + \beta_i$ (where $\alpha_i > 0$) represents the exact same preferences as $V_i$.

  The aggregation theorem holds for *any* valid representation of the individual utilities. Let's see what happens to the weights $a_i$ if we rescale the individual utilities.
  Substitute $V_i = \frac{1}{\alpha_i}(V_i^* - \beta_i)$ into the social welfare function:
  $$ V_S = \sum_{i=1}^n a_i \left[ \frac{1}{\alpha_i}(V_i^* - \beta_i) \right] + b $$
  $$ V_S = \sum_{i=1}^n \left( \frac{a_i}{\alpha_i} \right) V_i^* + \text{constant} $$
  The new weights are $a_i^* = \frac{a_i}{\alpha_i}$.

  **The Mechanical Consequence:**
  Because $\alpha_i$ is arbitrary (it just sets the "unit" of utility for person $i$), the weights $a_i$ are **arbitrary**.
  *   If I measure your utility in "utils" and mine in "kiloutils," my weight in the sum will naturally be 1000 times smaller than yours to compensate, even if we are morally equal.
  *   The theorem determines the *relationship* between the weights and the scales, but it does not determine the weights *independently* of the scales.

  **Sen's Critique:**
  Amartya Sen's critique (e.g., in *Collective Choice and Social Welfare*) focuses on **Informational Invariance**.
  1.  **Cardinality:** vNM axioms give us cardinal utility *within* a person (we can measure intervals).
  2.  **Comparability:** vNM axioms do **not** give us comparability *between* persons. We do not know if a 1-unit gain for Alice is "more" or "less" than a 1-unit gain for Bob.

  Harsanyi's theorem produces the formula $V_S = \sum a_i V_i$, but without an independent account of interpersonal comparability, the $a_i$ are merely parameters that absorb the differences in scaling.
  *   **Harsanyi's Fix:** Harsanyi attempts to fix the weights using the **Veil of Ignorance**. He argues that if you have an equiprobable chance of being any individual, rationality dictates you should maximize the average utility. This sets all $a_i$ equal (assuming scales are normalized).
  *   **Sen's Counter:** The Aggregation Theorem *itself* does not justify the Veil of Ignorance or the equal weighting. The theorem is a representation result: "If you satisfy Pareto, you look like a weighted utilitarian." It is not a derivation: "You ought to be a weighted utilitarian with these specific weights."

  To get normative Utilitarianism (where weights reflect moral worth), you must import a normative premise about **unit comparability** (e.g., "a unit of utility is morally equivalent across persons"). The Aggregation Theorem is silent on this; it merely says that *whatever* moral weights you choose, they must be applied linearly to the vNM utilities.

  ### Summary

  1.  **Pareto Indifference** implies $V_S$ is in the linear span of $\{V_i\}$. Mathematically, this allows negative coefficients ($V_S = V_1 - V_2$), so it does not rule out anti-social preferences.
  2.  **Pareto Efficiency** restricts the coefficients to be non-negative ($a_i \ge 0$), ruling out sadism, but leaving the magnitude of $a_i$ open.
  3.  **Interpersonal Comparability** is required to fix the magnitude of $a_i$. Because $V_i$ can be rescaled by any $\alpha_i > 0$ without changing preferences, the weights $a_i$ are underdetermined by the theorem alone. The "Utilitarianism" only emerges if you add an external normative assumption (like the Veil of Ignorance) to fix the scales and weights.

  The theorem proves that **Weighted Utilitarianism is the unique *form* compatible with vNM rationality and Pareto**, but it does not prove that **Equal-Weight Utilitarianism** is the correct moral theory.
