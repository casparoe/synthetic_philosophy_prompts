  The status board hummed with a soft, amber anxiety. In the center of the screen, the net valuation of the Helios-7 mining sector blinked: **100M Credits**. Below it, two counters ticked upward in perfect, terrifying synchronization.

  **VANTAGE EXPENDITURE: 115M**
  **KESTREL EXPENDITURE: 115M**

  Elias Thorne stared at the numbers until they blurred. He was the operational lead for Vantage Corp, currently locked in a contention protocol with Kestrel Dynamics over Helios-7. It wasn't a war, officially. It was a "resource adjudication standoff." Both companies had deployed autonomous drone swarms to the sector. Both sides were burning fuel, ammunition, and electronic warfare credits every minute to maintain presence.

  The rules of adjudication were simple, inherited from an older, clumsier era of colonial law: The party holding the sector at the moment of opponent withdrawal wins exclusive rights. However, both parties are liable for all costs incurred during the contest.

  It was the Dollar Auction, weaponized for interstellar capitalism.

  "Kestrel is signaling another surge," said Mara, his second-in-command. Her voice was tight. "They're committing another ten million in fuel and ordnance. They're pushing their total to 125M."

  Elias didn't look away from the screen. "If we match, we go to 125M. If we win, we get a sector worth 100M. Net loss: 25 million."

  "If we fold," Mara said, "we lose the 115 million we've already spent. Plus we lose the sector."

  "Exactly."

  "This is madness, Elias. We're spending 125 to get 100. The algorithms should have capped out at 90. This is the sunk cost fallacy pure and simple. We're throwing good money after bad because we're proud."

  Elias finally turned to her. His expression wasn't angry; it was weary, stripped of any illusion of control. "No, Mara. That's the comforting story. It lets us believe that if we were smarter, or less emotional, we wouldn't be here. But look at the payoff matrix."

  He tapped the console, bringing up the decision tree.

  "If we withdraw now, our final tally is negative 115 million. That is a locked loss. It is a certainty. The money is gone, the assets are spent, and we get nothing in return."

  "And if we fight?"

  "If we fight, we spend another 10 million. Our total cost becomes 125 million. If Kestrel folds immediately after we surge, we win the sector. Value 100 million. Cost 125 million. Net loss: 25 million."

  Elias leaned forward, his finger hovering over the 'Engage' key.

  "Twenty-five million loss is better than one hundred and fifteen million loss. By a margin of 90 million."

  Mara blinked. "But... we're still losing money."

  "Rationality isn't about profit in this trap, Mara. It's about loss minimization. The sunk cost fallacy implies we are spending because we *hope* to recover the past. That's backward-looking. That's irrational. But this?" He gestured to the ticking counters. "This is forward-looking. I am not bidding to recover the 115 million. That money is vapor. I am bidding to avoid locking in a 115 million loss when there is a non-zero probability I can convert it into a 25 million loss."

  "But Kestrel knows that," Mara countered. "They're running the same math. They know that if they fold now, they lose 115. If they bid 135, and we fold, they only lose 35. So they won't fold."

  "Precisely," Elias said. "And because I know they know that, I know they won't fold. But I also know that they know *I* won't fold, because for me, folding is the dominant loss strategy. So we are both trapped in a cycle where the rational move is to escalate, because the alternative is to accept a catastrophic certain loss over a probabilistic manageable one."

  "It's a Moloch trap," Mara whispered. "The incentive structure punishes de-escalation."

  "It's not a bias," Elias corrected. "It's the rules. In a normal auction, if I bid 120 for a 100 dollar bill, I can just walk away. I lose nothing but my time. In this structure, the second-highest bidder pays their bid. Being the loser is more expensive than being the winner, even when the winning bid exceeds the value of the prize. As long as there is even a one percent chance that the other side blinks, rational choice theory demands we fire the next volley."

  The console chimed. Kestrel's swarm had advanced. They had crossed the threshold. They were now at 125M.

  The clock ticked. The fuel burn rate accelerated. Vantage's expenditure counter crept toward 116, 117, 118.

  "If we don't match within thirty seconds," Mara said, "we forfeit presence. We lock in the 115 loss."

  Elias looked at the 'Engage' command. He felt no anger toward Kestrel. He felt no pride. He felt the cold, grinding gears of the mechanism they were all inside. He wasn't choosing to be stubborn. He was choosing the path of least resistance through a landscape where every exit was walled off by higher costs.

  To stop was to die financially. To continue was to bleed, but to keep the vein open in hopes the other side bled out first. It was a war of attrition where the casualty count didn't matter, only the relative difference in resolve.

  "Are we engaging?" Mara asked. Her hand hovered over the confirmation key. She understood the math now. He could see it in her eyes. The horror wasn't that they were being irrational; it was that they were being perfectly rational.

  "If we engage," Elias said quietly, "we move the loss from 115 to 125, contingent on their withdrawal. If they engage, we move to 135. But at every single step, the cost of stopping is greater than the cost of continuing, provided there is any probability of victory."

  "And if neither of us ever stops?"

  "Then we burn until corporate bankruptcy overrides the algorithm. But that is a future problem. The current problem is the next ten million."

  The timer hit ten seconds. The system demanded a commitment.

  Elias thought about the popular treatments of this game. The psychologists who would call this greed. The ethicists who would call it pride. They were wrong. This was what happened when you built a system where unilateral disarmament was the most punished strategy of all. It wasn't a failure of reasoning. It was a failure of design.

  "Match their bid," Elias said.

  Mara pressed the key.

  **VANTAGE EXPENDITURE: 125M**
  **KESTREL EXPENDITURE: 125M**

  The amber light on the screen pulsed, steady and unblinking. The drones surged forward, burning fuel they couldn't afford, fighting for a prize that wasn't worth the cost of the fight. There was no lesson learned here. There was no sudden realization of folly. There was only the next bid, and the next, driven by the inexorable logic that to stop was to lose everything, while to continue was to lose only a little bit more.

  Elias sat back and watched the numbers climb. He waited for Kestrel to blink. He knew they were waiting for him to do the same. And neither of them could afford to be the first to look away.
