answer: |-
  Here is a sequence of 10 questions designed for your podcast. They are ordered to start with internal coherence, move through historical parallels, and then systematically corner the "type/token" defense until the final question on falsifiability.

  The tone is calibrated for two PhD peers interviewing a senior scholar: respectful, technically precise, but unwilling to let standard deflections slide.

  ### Part 1: Internal Coherence & Historical Precedents
  *These questions establish the structural stakes before she can retreat into the type/token distinction.*

  **1. The Bradley Regress Relocation**
  Your central motivation is that act-types solve the unity of the proposition problem where structured complexes fail. The worry is that complexes need "glue" to hold objects and properties together, leading to Bradley's Regress. You claim acts are intrinsically unified. But if an act is a complex event involving an agent, a property, and an object, what unifies *the act itself*? If you say the "predicating" is the unifier, haven't you just relocated the regress one level down? What stops us from asking what relates the agent to the predicating?

  *   **Likely Deflection:** She will likely claim that acts are *primitive* or *sui generis* unities that don't require further relations.
  *   **Follow-up:** "If acts can be primitive unities without further glue, why can't structured propositions be primitive unities in the same way? What forces us to pay the ontological cost of introducing 'acts' if the theoretical work—primitive unity—could be done by the proposition itself?"

  **2. The Fregean Ghost**
  This view feels like a direct descendant of Frege's distinction between saturated objects and unsaturated concepts. Frege located the 'unsaturatedness' in the logical realm to avoid psychologism. You seem to be locating it in the cognitive realm. Are you essentially offering a psychologized Fregeanism? If so, what do we gain by paying the cost of talking about *acts* rather than just sticking with Fregean *concepts*, other than a intuitive sense of 'activity'?

  *   **Likely Deflection:** She will argue that Frege's unsaturated concepts are mysterious, whereas cognitive acts are naturalistically respectable or phenomenologically grounded.
  *   **Follow-up:** "But if the 'act' is what provides the unity, and you appeal to types to handle mind-independence, aren't you draining the 'act' of its psychological content anyway? At that point, isn't your 'act-type' functionally identical to Frege's 'concept,' just with a more misleading name?"

  **3. The Wittgensteinian Directionality Objection**
  Wittgenstein's famous objection to Russell's Multiple Relation Theory of Judgment was that it couldn't account for the *direction* or *sense* of a proposition—it couldn't distinguish judging that *aRb* from judging that *bRa* without presupposing the very proposition it was trying to analyze. If a proposition is an act-type of predicating *F* of *a*, what grounds the directionality of that type? If you say the act is inherently directed, aren't you vulnerable to the same charge: that you're smuggling the logical form of the proposition into the definition of the act?

  *   **Likely Deflection:** She will likely insist that the *token* act has a specific phenomenological or functional direction that the type inherits.
  *   **Follow-up:** "But for the dinosaur cases we'll discuss in a moment, there are no tokens. So for the vast majority of true propositions, the directionality must reside in the type alone. If the type is just an abstract structure, how does it have direction without collapsing back into the structured complex view you rejected in Question 1?"

  ### Part 2: Pressing the Type/Token Distinction
  *Here we begin to target her favorite defense. The sequence is designed to make the "it's a type" move increasingly costly and less explanatory.*

  **4. Metaphysical Work vs. Renaming**
  You rely heavily on the distinction that propositions are *types* of acts, not *tokens*. When pressed on how a proposition exists without a thinker, you say types don't need instantiation. Is this distinction doing genuine metaphysical work, or is "act-type" just a new label for "abstract structured complex"? If the type exists uninstantiated, eternally, and independently of minds, in what robust sense is it still an *act*?

  *   **Likely Deflection:** She will argue that the *identity conditions* of the type are determined by the conditions of the act, even if untokened.
  *   **Follow-up:** "If the identity conditions are fixed by the act, but the existence conditions are fixed like a Platonist abstract object, aren't you splitting the theory in half? You get the unity from the 'act' side but the mind-independence from the 'Platonist' side. Is there a risk that the theory is unstable, pulling in two incompatible directions?"

  **5. The Dinosaur Problem (Mind-Independence)**
  Let's apply that to the classic case: "Dinosaurs roamed the earth." This was true before any minds existed to predicate properties. You say the *type* of act existed, even if no one tokened it. But if the truth-maker for this proposition is an *act-type*, and acts are essentially cognitive events, aren't you saying that a cognitive event-type existed before cognition? Doesn't that stretch the definition of "act" until it breaks?

  *   **Likely Deflection:** She will reiterate that types are abstract entities that can be defined by their potential tokens without requiring actual tokens.
  *   **Follow-up:** "If the type is defined by *potential* tokens, doesn't that make the truth of the proposition dependent on the *possibility* of minds? If it were metaphysically impossible for minds to exist, would the proposition 'Dinosaurs roamed the earth' cease to exist on your view? If yes, you lose mind-independence. If no, the 'act' component seems irrelevant."

  **6. Normativity of Untokened Types**
  Cognitive acts seem essentially normative; you can perform an act of predicating correctly or incorrectly. But norms usually govern agents. Can an act-type that has never been tokened bear normative properties? How can there be a "correct way" to predicate *F* of *a* if no one is there to be corrected?

  *   **Likely Deflection:** She may argue that norms attach to the type itself, similar to how the rules of chess exist even if no game is being played.
  *   **Follow-up:** "Chess rules are constitutive of a human practice. If there were no humans, there would be no chess. If you say propositions are like chess rules but mind-independent, you seem to be positing norms without a practice. Is that a coherent metaphysical category, or is it a category mistake?"

  **7. Individuation Without Tokens**
  We usually individuate act-types by looking at the tokens—what makes a run different from a walk is what the tokens are doing. If we have act-types that are *never* tokened (like specific propositions about distant galaxies no one will ever think about), how are they individuated? What makes the type *Predicating-F-of-a* distinct from *Predicating-G-of-b* if there is no actual predicating happening to ground the difference?

  *   **Likely Deflection:** She will likely appeal to the constituents (the property *F* and object *a*) individuating the type.
  *   **Follow-up:** "But if the constituents individuate the type, then the unity of the proposition comes from the constituents, not the act. We are back to the structured complex view. It seems the 'act' label drops out of the individuation story entirely whenever you deal with untokened types."

  ### Part 3: Theoretical Cost & Falsifiability
  *The final questions remove the safety net entirely.*

  **8. The Redundancy Challenge**
  Given the pressure we've just put on the "act" label—especially regarding untokened types, norms, and individuation—is there any explanatory work left that *requires* the proposition to be an act? If I were to take your theory, erase the word "act," and replace it with "abstract complex," what specific phenomena would your theory fail to explain that mine could?

  **9. Competing Theories**
  If a standard Platonist can account for mind-independence, and a Fregean can account for unsaturatedness, and you are using the type/token distinction to bridge the gap... what is the unique theoretical virtue of the Act Theory? Is it purely parsimony, or is there a specific linguistic or cognitive datum that *only* your view can capture?

  **10. The Falsifiability Closer**
  This is my final question. You have a powerful move: whenever a counterexample arises regarding existence, truth, or unity, you retreat to the type/token distinction. It seems to absorb every objection. So, I want to ask plainly: What would count as evidence *against* your view? Is there a conceptual scenario, a linguistic datum, or a metaphysical argument that, if true, would force you to abandon the Act-Type framework, or is this a position that is compatible with all possible states of affairs?
