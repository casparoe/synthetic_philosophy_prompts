  **The Docks, Midnight**

  The harbor smelled of tar, salt, and the copper tang of anxiety. Torches flickered against the hulls of the triremes, casting long, dancing shadows over the crates of spears being hoisted aboard.

  Mara leaned against a capstan, watching the sailors secure the lines. Elias stood beside her, arms crossed, staring at the horizon where the sun would eventually rise.

  "It's not real yet," Mara said quietly.

  Elias didn't turn. "The fleet?"

  "The battle. Tomorrow. It's a NULL value." She tapped the wood of the capstan. "Right now, in the ledger of the universe, that entry is empty. 'There will be a sea battle' is neither true nor false. It's waiting on input."

  Elias sighed, a small cloud of breath in the cold air. "You're doing it again. You're confusing *causality* with *truth*. The statement 'There will be a sea battle tomorrow' is already true or already false. The Law of Excluded Middle doesn't take a night off just because we're nervous."

  "If it's already true," Mara said, pushing off the capstan to face him, "then the admiral's orders don't matter. Our training doesn't matter. If the proposition is true *now*, then the battle is fixed. We're just actors reciting lines written in stone. That's fatalism, Elias. Call it logic all you want, but it tastes like destiny."

  "It's not fatalism," Elias corrected, his voice calm. "Think about yesterday. Suppose I say, 'Yesterday, it rained.' That statement is true now. Did my saying it *make* it rain yesterday? Did the truth of the sentence force the clouds to open?"

  "No, because yesterday is gone. It's fixed. The records are closed."

  "Exactly. The truth value is fixed because the event is fixed. Now apply that to tomorrow. If there *is* a battle tomorrow, then the statement 'There will be a battle' is true. If there *isn't*, it's false. One of those states of affairs will obtain. Therefore, one of those statements is already true. Truth is just a label we stick on correspondence with reality. It doesn't *cause* the reality."

  Mara shook her head. "That works for the past because the past has collapsed. The wave function hit the shore. The future hasn't. If you say the statement is true *now*, you're saying the future has already collapsed. You're saying the branch doesn't exist."

  "I'm saying the branch we end up on is the only one that matters for truth," Elias said. "Look, imagine God—or a perfect logician—looking at time from above. To them, it's all present. If the battle happens, the statement is true. Period. That doesn't mean the battle is *necessary*. It just means it's *factual*."

  "Factual?" Mara laughed, a sharp sound. "How can it be a fact if it hasn't happened? That's the asymmetry, Elias. Past facts are hard. Future facts are soft. If I treat a soft fact like a hard fact, I stop rowing. I stop sharpening my spear. Because why bother if the sentence is already true?"

  "Because *you* are part of what makes the sentence true!" Elias turned to her, eyes flashing. "This is the move Ockham made. The truth of the proposition depends on the event, not the other way around. Your rowing, your fighting, your choices—those are the mechanisms that *ground* the truth. If you decide to flee, then the statement 'There will be a battle' was actually false all along. But it was *either* true *or* false. You don't get a third option just because you haven't seen the result yet."

  "That third option is where freedom lives," Mara insisted. "Łukasiewicz got this right. We need a third value: 'Possible.' Or 'Undetermined.' It's like code. If I declare a variable but don't assign it, it's not zero and it's not one. It's undefined. If you force it to be zero or one before the function runs, you're introducing a bug. You're pretending you know the state of the system when you don't."

  "But logic isn't code," Elias countered. "Logic describes what *is*. If the future is genuinely open, then reality is fuzzy. And if reality is fuzzy, then logic is broken. I'd rather trust the law of bivalence than trust a universe that violates non-contradiction. Either the enemy sails or they don't. There is no metaphysical 'NULL'. There is only what we don't know yet."

  "So it's an epistemic limit? Just ignorance?"

  "Yes."

  "No," Mara said firmly. "It's ontological. It's not that we don't know; it's that *there is nothing to know*. The sea isn't decided. The wind isn't decided. If you say the statement is true now, you're saying the future exists as a place we haven't walked into yet. I say the future is a forge. We're hammering it out right now. You can't call the hammer strike 'true' before the metal bends."

  Elias looked back at the ships. The creaking of the wood sounded like bones settling. "Okay. Let's test it. Practical terms. We have a purse of silver. I say the battle happens. You say... what? That it's undetermined?"

  "I say betting on a truth value is a category error," Mara said. "But fine. I'll bet on 'Battle'."

  "Why?"

  "Because the odds favor it. The admirals want it. The wind is right."

  "And I bet on 'Battle' because the statement is true."

  "We put down the same silver," Mara pointed out. "We expect the same payout. If we lose, we're both out the money. If we win, we both drink wine."

  "We agree on the action," Elias said.

  "We agree on the *risk*," she corrected. "But you think the outcome is written in a book somewhere, even if we can't read it. I think the book is blank until we spill ink on it."

  "Does it change how you fight?" Elias asked. "If you believe the statement is already true, do you fight less hard?"

  "No. Because I know my fighting is what makes it true."

  "And if you believe it's undetermined?"

  "Then I know my fighting is what *decides* it."

  Elias paused. He picked up a loose rope end, coiling it slowly. "So the difference isn't in the world. It's in the grammar. I want to say 'It is the case that there will be a battle' is a valid sentence tonight. You want to say that sentence is grammatically correct but semantically empty."

  "Semantically empty implies it means nothing," Mara said. "It means everything. It means I have a role. If you're right, I have a function. If I'm right, I have an author."

  "But if you're right," Elias pressed, "then logic has a hole in it. For twenty-four hours, the Law of Excluded Middle is suspended. That's a high price to pay for the feeling of agency."

  "And if you're right," Mara shot back, "then agency is an illusion. The feeling that I could do otherwise is a lie, because if I *could* do otherwise, the statement 'I will fight' wouldn't be true yet. It would be contingent. You're buying logical consistency at the cost of your own freedom."

  Elias stopped coiling the rope. He looked at the dark water lapping against the hull. "I don't think it costs me freedom. It just costs me the idea that reality waits for me to look at it. The truth is there. I just don't hold it yet."

  "And I think truth is a trophy you get at the end," Mara said. "Not a map you carry at the start."

  They stood in silence for a moment. The torchlight flickered, making the shadows of the masts dance like spears.

  "Tomorrow," Elias said.

  "Tomorrow," Mara agreed.

  "If I'm right," Elias added, "we'll know the statement was true tonight."

  "If I'm right," Mara said, turning back to the ships, "the statement tonight won't exist anymore. It'll be replaced by a new one: 'There was a battle.'"

  Elias smiled, faint and tired. "Same result. Different syntax."

  "Same blood," Mara said. "Different reason."

  She walked toward the gangplank, stepping onto the wood. She didn't look back. Elias watched her go, then looked up at the stars, wondering if they were already fixed in their courses, or if they, too, were waiting to be decided. He tightened his grip on the rope. It felt real enough.
