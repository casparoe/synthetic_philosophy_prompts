prompt: |-
  I'm about two-thirds into a novel where one of my POV characters is an ex-monk who lost his faith years ago but still thinks in the categories he was trained in, and I've been down a real rabbit hole reading up on Buddhist theories of personal identity so his internal monologue doesn't come off like a wikipedia summary. The thing I keep getting stuck on, which I actually want to use as the hinge of a whole chapter, is how anatta (no-self) is supposed to coexist with karma still working across time, even across rebirths. The standard move, as I understand it, is that there's no persisting self but there is a causal stream of momentary mental events (santana, the "mind-stream") that links the person who acts to the person who reaps the consequences later, and the tradition itself seems aware this is a hard sell - there's that bit in the Milindapanha, if I'm remembering it right, where the king basically asks Nagasena whether the guy who's reborn is the same guy or a different one, and Nagasena's answer is something like "neither the same nor another," backed up by an image like a flame passed from lamp to lamp through the night. It's a great line, but it's always struck me as having its cake and eating it too.

  What I actually want from you isn't a balanced explainer - I can get that from any intro book. I want the strongest possible version of the skeptical argument, basically the argument my ex-monk character can't quite talk himself out of at 3am. Specifically: argue that the whole mind-stream move is a dilemma in disguise. Either the santana preserves exactly the kind of identity-relevant continuity (memory, character, causal responsibility) that a self was supposed to provide, in which case "no-self" turns out to just be a self wearing a disguise, or it doesn't preserve that much continuity, in which case there's no principled reason the person who suffers the karmic fruit should be on the hook for what a strictly earlier, and by the doctrine's own lights not-identical, momentary being did. Push that as hard as you can, and don't let the tradition off easy by just handing the "neither the same nor another" line back to me unexamined - if you think that move genuinely works, spell out why it's doing real philosophical work rather then just being a graceful way of refusing the question.
