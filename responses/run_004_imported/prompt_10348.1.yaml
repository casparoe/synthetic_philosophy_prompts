prompt: |-
  I'm the service chair of Interact, my high school's Rotary-affiliated community service club, and I have to write the decision memo our executive board votes on this Tuesday. Two months ago we ran 'Miles for Maya,' a fundraiser for a freshman with leukemia after her family's insurance denied the recommended treatment; local businesses pledged to match every donation made 'for Maya,' and we ended up raising $18,400, well beyond our original $6,000 goal. Before we hand the family a check, one member circulated Peter Singer's drowning-child argument alongside GiveWell's cost-effectiveness numbers, arguing that neither distance nor a familiar face makes one life worth more than another, so we're obligated to redirect at least the windfall above our goal to a charity like the Against Malaria Foundation, where the same money would save several times as many lives. Other members think redirecting money that businesses matched specifically for Maya would be a betrayal, whatever the math says. Please draft the memo I'll bring to the board: it should reach a clear, concrete recommendation with a timeline for talking to the family and our donors, and it should take whichever side it doesn't land on seriously rather than dismiss it as naive number-crunching or mere sentimentality.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Service Chair of Interact (high school Rotary-affiliated club).
      *   **Task:** Write a decision memo for the Executive Board to vote on.
      *   **Context:** Fundraiser "Miles for Maya" raised $18,400 (Goal: $6,000). Beneficiary: Freshman with leukemia (insurance denied treatment). Donors: Local businesses matched donations *specifically* "for Maya."
      *   **Conflict:**
          *   *Side A (Effective Altruism/Utilitarian):* Cites Peter Singer/GiveWell. Argues money should go where it saves the most lives (e.g., Against Malaria Foundation). Distance/identity shouldn't matter. Suggests redirecting the windfall ($12,400 over goal).
          *   *Side B (Relational/Deontological):* Argues redirecting is a betrayal of donor intent and the specific promise made to Maya/family. Trust and community bonds matter.
      *   **Requirements:**
          *   Clear, concrete recommendation.
          *   Timeline for communication (family & donors).
          *   Tone: Balanced, respectful of both sides (no dismissing EA as "naive number-crunching" or relational ethics as "mere sentimentality").
          *   Format: Decision Memo.

  2.  **Determine the Recommendation:**
      *   *Option 1: Give all to Maya.* Maximizes trust, honors donor intent, helps a community member. Ignores the "greater good" argument regarding the windfall.
      *   *Option 2: Split the money.* Compromise, but potentially satisfies neither side fully. Complicates logistics.
      *   *Option 3: Redirect windfall to AMF.* Maximizes lives saved theoretically. High risk of reputational damage, breach of trust with donors who matched "for Maya," and potential harm to Maya/family (public scrutiny).
      *   *Decision:* As a high school club affiliated with Rotary, *trust and community relationships* are the primary currency. Rotary's motto is "Service Above Self," but it is deeply rooted in local community building. Redirecting funds explicitly pledged for a specific individual, especially after a public campaign, poses significant ethical and reputational risks. It could be seen as bait-and-switch.
      *   *Refinement:* However, the Effective Altruism (EA) argument *must* be taken seriously. The memo shouldn't just say "No." It should acknowledge the moral weight of the EA argument but conclude that *in this specific context*, the obligation to donor intent and community trust outweighs the abstract utilitarian calculation.
      *   *Wait, is there a middle ground?* The prompt asks for a "clear, concrete recommendation." A split might look like indecision. Giving it all to Maya is the most defensible position legally and ethically regarding donor intent. *However*, to honor the EA argument, the club could commit to *future* fundraising strategies that prioritize cost-effectiveness.
      *   *Final Decision:* Recommend disbursing the full amount to Maya's family. This honors the specific contract with donors. However, integrate the EA insight by adopting a policy for *future* unrestricted funds or setting a new precedent for how the club chooses causes going forward.
      *   *Actually, looking closer at the prompt:* The prompt asks me to "take whichever side it doesn't land on seriously." If I recommend giving to Maya, I need to validate the EA argument deeply. If I recommend redirecting, I need to validate the relational argument deeply.
      *   *Real-world feasibility:* Redirecting money raised *specifically* for a named individual is generally considered unethical in fundraising (donor intent). It could even be legally precarious depending on state laws regarding solicitation. Therefore, the most responsible recommendation for a Service Chair is to honor the pledge. I will write the memo recommending the full disbursement to Maya, but I will frame the EA argument as a crucial lens for *future* club strategy, not as a retroactive override of donor intent.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue, the conflict, and the recommendation.
      *   **Background:** Recap "Miles for Maya," the goal, the result, and the donor matching conditions.
      *   **The Ethical Conflict:**
          *   *Perspective 1 (Impartial Beneficence):* Singer/GiveWell argument. Focus on the windfall ($12,400). Maximize good.
          *   *Perspective 2 (Relational Integrity):* Donor intent, promise to Maya, community trust.
      *   **Analysis:** Weigh the two. Acknowledge the strength of the math (EA) but highlight the practical and ethical cost of breaking trust (Relational). Note that Rotary values local community.
      *   **Recommendation:** Disburse full amount to Maya.
      *   **Implementation Plan:** Timeline for notifying family, donors, and club.
      *   **Future Considerations:** How to incorporate EA principles moving forward (e.g., selecting future causes based on impact).

  4.  **Refining the Tone:**
      *   Avoid calling the EA argument "cold." Call it "rigorous" or "principle-driven."
      *   Avoid calling the Relational argument "emotional." Call it "fiduciary" or "commitment-based."
      *   Ensure the high school context is clear (we are students, reputation matters, learning experience).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is giving all the money too dismissive of the EA argument?
      *   *Fix:* I need to make sure the memo explicitly states that the EA argument *would* be the correct default for unrestricted funds, but these are restricted funds. This distinguishes the *source* of the money as the deciding factor, not just "feelings."
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Keep it tight. Vote Tuesday, contact family Wednesday, public announcement Friday.
      *   *Critique:* Did I address the "windfall" specifically?
      *   *Fix:* The EA argument focuses on the $12,400 over the $6,000 goal. I need to address why we can't split it. (Answer: Donors matched "for Maya," not "for Maya up to $6k and then generic.")

  6.  **Final Polish:** Check formatting, clarity, and ensure the "Service Chair" voice sounds appropriate (leadership, organized, ethical). (Self-correction: Ensure I don't sound like I'm lecturing the board, but facilitating a decision.)

  7.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).

  *(Self-Correction Note during final output generation)*: I need to be careful not to make the recommendation sound like the EA argument is "wrong." It's about *jurisdiction* of the funds. The EA argument is morally sound for *unrestricted* capital. These are *restricted* funds. That is the key ethical pivot point.

