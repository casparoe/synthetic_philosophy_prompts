answer: |-
  **MEMORANDUM**

  **TO:** Interact Club Executive Board
  **FROM:** Service Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: Disbursement of "Miles for Maya" Fundraising Proceeds

  ### Executive Summary
  Two months ago, Interact launched "Miles for Maya," a fundraiser intended to support a freshman student whose insurance denied coverage for leukemia treatment. Our goal was $6,000. Due to significant community engagement and local business matching, we raised $18,400.

  A debate has emerged regarding the disbursement of the $12,400 windfall above our original goal. One perspective argues for redirecting these excess funds to a high-impact charity (e.g., Against Malaria Foundation) to maximize lives saved. The opposing perspective argues that all funds must go to the designated beneficiary to honor donor intent and community trust.

  **Recommendation:** This memo recommends disbursing the **full $18,400 to Maya's family**. However, to honor the ethical rigor of the counter-argument, this memo also proposes a new "Impact Policy" for all future unrestricted fundraising.

  ### Background
  *   **Campaign:** "Miles for Maya" (Run/Walk event + Donation Drive).
  *   **Beneficiary:** Maya [Last Name], Interact freshman, diagnosed with leukemia.
  *   **Donor Conditions:** Local businesses pledged to match donations made specifically "for Maya."
  *   **Financials:** $6,000 (Goal) vs. $18,400 (Actual).
  *   **Current Status:** Funds are held in the Interact treasury. Check has not yet been issued.

  ### Ethical Framework & Analysis
  The Board must weigh two valid ethical frameworks. Neither is dismissible as merely "emotional" or "coldly mathematical."

  **1. The Argument for Impartial Beneficence (Effective Altruism)**
  *   **Core Premise:** Moral obligation is determined by the outcome of the resources, not the proximity of the beneficiary. As articulated by philosopher Peter Singer and data from GiveWell, $12,400 could prevent multiple deaths via malaria net distribution or similar interventions, whereas it assists one individual locally.
  *   **Strengths:** This approach maximizes the utility of our service hours. It challenges us to look beyond our immediate circle and acknowledges that a life saved globally is equal in value to a life saved locally.
  *   **Limitations in this Context:** This argument applies most strongly to *unrestricted* funds. These funds were solicited with a specific narrative. Applying this logic retroactively risks treating the donors and the beneficiary as means to an end, rather than partners in a specific agreement.

  **2. The Argument for Relational Integrity (Fiduciary & Community Trust)**
  *   **Core Premise:** Moral obligation is determined by promises made and relationships sustained. Donors gave based on a specific representation ("for Maya"). To redirect funds is to violate the terms of that social contract.
  *   **Strengths:** This protects Interact's reputation, ensuring future donors trust that we will steward their contributions as promised. It honors the dignity of Maya and her family, who were publicly identified as the recipients of community care.
  *   **Limitations in this Context:** Strict adherence to this view can insulate us from evaluating whether our service is actually creating the most good possible. It risks prioritizing local visibility over global impact in perpetuity.

  ### Recommendation
  **The Service Chair recommends disbursing the full $18,400 to Maya's family.**

  **Rationale:**
  While the Effective Altruism argument is morally compelling regarding *how we choose future causes*, it cannot ethically override *donor intent* on past contributions.
  1.  **Donor Intent:** The business matches were contingent on the funds being "for Maya." There is no evidence donors consented to a hybrid model. Redirecting the windfall without explicit donor permission constitutes a breach of trust.
  2.  **Reputational Risk:** If the community perceives the fundraiser as a "bait-and-switch," future Interact initiatives will suffer. Our ability to serve the community long-term depends on our credibility.
  3.  **Beneficiary Impact:** Maya's family has made financial decisions based on the public success of this campaign. Reducing the amount after the fact could cause tangible harm and distress.

  **Integrating the Counter-Argument:**
  We validate the Effective Altruism perspective by acknowledging that *had this been an unrestricted fundraiser*, the argument for redirecting the windfall would be decisive. Therefore, we will not dismiss the logic, but rather apply it prospectively.

  ### Implementation Timeline

  | Date | Action Item | Responsible Party |
  | :--- | :--- | :--- |
  | **Tuesday (EOD)** | **Board Vote** on this memo. | Exec Board |
  | **Wednesday** | **Contact Maya's Family.** Service Chair and President to meet with parents to present the check and explain the timeline for transfer. | Service Chair / President |
  | **Thursday** | **Donor Notification.** Email all individual donors and business partners confirming the total raised and thanking them for making the full $18,400 possible for Maya. | Communications Chair |
  | **Friday** | **Public Announcement.** Social media post announcing the final total and delivery. | Communications Chair |
  | **Nov. 1** | **Policy Proposal.** Draft new "Cause Selection Framework" for next semester that incorporates cost-effectiveness data for *future* unrestricted fundraisers. | Service Chair |

  ### Motion for Vote
  I move that the Interact Executive Board authorize the immediate disbursement of $18,400 to the [Family Last Name] family for medical expenses, and further move that the Service Committee draft a new Cause Selection Policy by November 1st that incorporates cost-effectiveness analysis for future unrestricted fundraising campaigns.

  ***

  **Attachments:**
  *   *Donor Matching Agreements (Summary)*
  *   *GiveWell Cost-Effectiveness Analysis (Excerpt)*
  *   *Draft Email to Donors*
