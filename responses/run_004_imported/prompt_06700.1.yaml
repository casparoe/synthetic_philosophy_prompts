      *   **Part (a) (5 points): Assumptions & Informal Reasoning.**
          *   *Key Assumptions:* Common Prior, Rationality (Bayesian Expected Utility), Common Knowledge of Rationality/Trading Willingness, Initial Pareto Optimality (ex-ante efficiency).
          *   *Reasoning:* If trade happens, it must be because of private info (since ex-ante optimal). If I know you are willing to trade, I infer you have info favoring the trade. If we share a prior, I should update on your willingness. If we both do this, the "gain" disappears. Trade unravels.
      *   **Part (b) (5 points): Relation to Aumann's Agreement Theorem.**
          *   *Relation:* Both rely on Common Prior + Common Knowledge of posteriors/actions leading to no disagreement/no trade.
          *   *Distinction:* Aumann is about *beliefs* (posteriors must be equal). Milgrom-Stokey is about *actions* (trade volume must be zero given ex-ante efficiency). Aumann is static epistemic; M-S is economic/decision-theoretic (involves utility/optimality).
      *   **Part (c) (10 points): Real Volume & Assumptions.**
          *   *Puzzle:* High volume vs. No-Trade.
          *   *Explanation 1:* Heterogeneous Priors (agree to disagree).
          *   *Explanation 2:* Liquidity/Noise Trading (non-informational motives, hedging, consumption shocks).
          *   *Evaluation:* Student needs to weigh these. Liquidity is standard in microstructure (Glosten-Milgrom etc.). Heterogeneous priors is often seen as a "cop-out" in strict theory but plausible behaviorally.
      *   **Part (d) (5 points): Epistemic Value & Insider Trading.**
          *   *Tension:* If prices aggregate info, why trade? (Grossman-Stiglitz paradox adjacent). If no trade, how does info get into price?
          *   *Insider Trading:* Laws prevent trading on private info, which effectively enforces the "no trade on private info" norm, but M-S says even *with* private info, trade shouldn't happen if CK. The tension is about *incentives to acquire info*.
          *   *Resolution:* Markets need noise traders to allow informed traders to profit (Kyle model logic).

