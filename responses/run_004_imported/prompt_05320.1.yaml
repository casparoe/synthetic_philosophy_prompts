answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of being in Ms. Alvarez's senior philosophy elective. And if you know Ms. Alvarez, you know there is one book she loves more than any other: Bertrand Russell's *Marriage and Morals*.

  Now, for the philosophy nerds in the room, you know Russell had some… *bold* theories. He argued that jealousy isn't a noble defense of love, but just a bad habit to be trained out of. He believed radical honesty mattered more than traditional rules. And, in the spirit of full disclosure—which I know Ms. Alvarez would appreciate—he famously failed to live up to his own standards when his own heart got involved.

  But that is exactly why we are so happy to be here today.

  Philosophy is the study of how life *ought* to be in theory. But a wedding is the celebration of how love *actually* is in practice. Russell wrote about commitment from a distance, analyzing it like a logic problem. But watching [Teacher's Name] and [Groom's Name] together, you don't see a theory. You see a partnership.

  You two have shown us that you don't need to suppress human emotion to have a strong marriage, and you don't need to ignore reality to have an honest one. You've managed to be better at this than one of the 20th century's greatest minds.

  So, I won't offer any relationship advice based on a 1929 text. I'll just say this: May your marriage be the one argument you never have to defend.

  To Ms. Alvarez and [Groom's Name]!
