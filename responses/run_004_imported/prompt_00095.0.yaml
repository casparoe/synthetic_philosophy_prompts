prompt: |-
  Give an example of a decision scenario involving iterated common knowledge of rationality that breaks down once you introduce even a small, bounded amount of uncertainty about other players' rationality—something like a finitely repeated centipede game or email game analog. I've been reading about Aumann's agreement theorem and the backward induction argument for the centipede game, and I find the gap between "in principle everyone should defect immediately because rationality is common knowledge" and "in practice everyone cooperates for a long while" deeply strange. My study group keeps going back and forth on whether this shows common knowledge of rationality is an idealization that's almost never satisfied, versus whether it shows something is wrong with backward induction itself as a solution concept (e.g., the Stalnaker/Binmore debate about what counts as a rational deviation once someone has already "irrationally" cooperated).

  Could you construct a concrete example—with a small number of rounds and explicit payoffs—where you walk through how the standard common-knowledge-of-rationality argument forces one equilibrium, but where perturbing the epistemic assumptions (say, each player assigns even epsilon probability to the other being a "always cooperate until round k" type) radically changes the predicted outcome? I'd like the example to make vivid exactly which premise is doing the work: is it common knowledge itself, or the assumption that off-path behavior doesn't update beliefs, or something else entirely?
