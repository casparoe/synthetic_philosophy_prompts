prompt: |-
  I sit on my hospital's clinical ethics committee, and there's a case headed to Thursday's meeting that I can't stop turning over. A woman in her late 70s was just found to have metastatic pancreatic cancer, prognosis probably months rather than years. Before she'd been told anything, her three adult kids went to the oncology team and asked that she not be given the diagnosis directly -- they want to be the ones who hear it, sit with it, and make the treatment calls (chemo vs. hospice vs. nothing at all) together as a family, rather than have her carry the news and the decision on her own. When the attending pushed back with our standard line about patient autonomy, the eldest son -- who, small world, teaches a course on Confucian philosophy at the community college -- said something that's been rattling around in my head since: that the family isn't being paternalistic or distrustful of their mother, it's that a decision like this was never really hers alone to make in the first place, so "handing it back" to her as an individual choice isn't more respectful of her, it's just a different way of getting her wrong. Our consent policy says patients have a right to their own diagnosis and prognosis unless they've indicated otherwise, but it doesnt say anything about what we're supposed to do when the family tries to intercept that right before she's even had a chance to exercise or waive it herself.

  Can you draft the short memo I'll bring to Thursday's meeting? It should give a concrete recommendation for what the team does this week -- tell her directly regardless, some kind of staged or partial disclosure, defer to the family for now and revisit in a few days, quietly ask her in private what she'd want first, whatever you think is actually right -- with a realistic timeframe attached. And it needs to genuinely engage the son's objection as a serious position about what a person and a decision even are, not just nod at it as a cultural-sensitivity issue on the way back to reasserting the hospital's default framework.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's clinical ethics committee.
      *   **Task:** Draft a short memo for Thursday's meeting regarding a specific case.
      *   **Case Details:** 70s female, metastatic pancreatic cancer (poor prognosis). Three adult children want to withhold diagnosis from her and make decisions as a family. Eldest son is a Confucian philosophy instructor.
      *   **Conflict:** Hospital policy (patient autonomy/right to know) vs. Family's ethical framework (relational autonomy/familial decision-making).
      *   **Key Requirement:** The memo must provide a *concrete recommendation* with a *timeframe*. It must *genuinely engage* the son's philosophical objection (not just dismiss it as "cultural sensitivity" but treat it as a substantive ethical claim about personhood/decision-making).
      *   **Tone:** Professional, ethical, nuanced, actionable.

  2.  **Deconstruct the Ethical Conflict:**
      *   *Standard Bioethics (Western/Principalism):* Autonomy is paramount. Patients own their bodies and information. Truth-telling is a duty. Family cannot override competent patient rights.
      *   *Son's Argument (Confucian/Relational):* The self is constituted by relationships. A decision of this magnitude is inherently familial. Protecting the parent from burden is a form of filial piety (*xiao*), not paternalism. Forcing individual autonomy isolates the patient and disrupts the social fabric necessary for her well-being.
      *   *The Gap:* The hospital policy assumes the patient *wants* individual autonomy but hasn't asked her yet. The family is pre-empting her choice.
      *   *The Risk:* Telling her immediately violates the family's trust and potentially the patient's cultural values. Deferring entirely to the family risks violating her legal rights and potential desire to know.

  3.  **Determine the Recommendation:**
      *   *Option A: Tell her immediately.* (Too rigid, ignores the son's valid point, risks therapeutic alliance).
      *   *Option B: Defer to family indefinitely.* (Violates policy, legal risk, assumes incompetence).
      *   *Option C: Quietly ask her first.* (Best middle ground). This respects autonomy *by checking her preference on information sharing* without forcing the diagnosis on her immediately. It tests the son's claim empirically. If she says "I want to know," autonomy wins. If she says "I want my family to handle it," relational autonomy wins.
      *   *Refinement:* It needs to be done carefully. Not "Do you want to know you have cancer?" but "How do you prefer to receive medical information?"
      *   *Timeframe:* Needs to happen before treatment decisions are made. 48-72 hours is reasonable.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty.
      *   **Ethical Analysis (The Core):** This is where I need to shine. I can't just say "Autonomy wins." I need to validate the son's Confucian argument.
          *   Acknowledge *Xiao* (filial piety) and relational personhood.
          *   Distinguish between *paternalism* (we know better) and *protection* (we share the burden).
          *   Point out the flaw in the family's approach: They are assuming her preference without evidence.
          *   Point out the flaw in the default approach: Assuming she wants individual burden.
      *   **Recommendation:** The "Ask Her Preference" approach.
      *   **Process/Timeframe:** Who does it? (Attending + Social Work/Chaplain). When? (Within 48 hours). How? (Private, open-ended questions).
      *   **Contingency:** What if she agrees with the kids? What if she disagrees?
      *   **Closing:** Reiterate the goal (aligning care with *her* values, whether individual or relational).

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Critique:* Is calling it "Confucian" too academic?
      *   *Fix:* Keep the philosophical reference but ground it in clinical practice. Use terms like "relational autonomy."
      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Be specific about the question to ask. "How much information do you want?"
      *   *Critique:* Did I address the policy gap?
      *   *Fix:* Note that policy allows for waiver of information, but the waiver must come from the patient.
      *   *Critique:* Is the son's argument treated seriously?
      *   *Fix:* Explicitly state that his view challenges the *ontology* of the decision, not just the communication style.

  6.  **Final Polish:** Check word count (keep it "short memo" style), ensure clarity, and make sure the recommendation is actionable for the clinical team. (Ensure I don't sound like I'm making the final decision, but rather advising the committee on what to recommend to the team). *Wait, the prompt asks me to draft the memo the user will bring to the meeting.* So I am writing *as* the committee member *to* the committee (or perhaps as a draft for the committee's output to the team). Let's frame it as a briefing memo for the Committee to adopt as their guidance.

      *Actually, re-reading:* "Draft the short memo I'll bring to Thursday's meeting." This implies it's a discussion paper *for* the committee to review, or a draft recommendation *from* the user *to* the committee. Let's make it a **Case Briefing & Recommendation Memo** intended for the Committee's deliberation, which effectively guides the outcome.

      *Wait, one more nuance:* The prompt asks for a "concrete recommendation for what the team does this week." So the memo should be structured so the Committee can approve it and send it to the Oncology Team. I will write it as a **Proposed Ethics Consultation Recommendation** that the user will present for endorsement.

      *Key constraint:* "Engage the son's objection as a serious position... not just nod at it as a cultural-sensitivity issue." I need to make sure the language reflects that this is about *moral ontology*, not just "cultural competence."

  7.  **Finalizing the Plan:**
      *   **To:** Clinical Ethics Committee
      *   **From:** [User's Name/Role]
      *   **Subject:** Recommendation re: Case [ID] - Disclosure & Decision-Making
      *   **Sections:** Context, Ethical Analysis (engaging the son's point), Recommendation, Implementation.

      *(Self-Correction)*: Keep it tight. The user needs to bring this *to* the meeting to guide the discussion/vote.

      *Let's write it.*

      *   **Headline:** Clear.
      *   **The "Son's Argument":** Frame it as "Relational Autonomy vs. Individual Autonomy."
      *   **The Pivot:** The patient's *meta-preference* (preference about how to decide) is the key.
      *   **The Plan:** Private assessment of information preference.
      *   **Timeline:** 48 hours.

  8.  **Review against constraints:**
      *   Concrete recommendation? Yes (Private assessment).
      *   Realistic timeframe? Yes (48 hours).
      *   Engage son's objection seriously? Yes (discussed as ontological claim).
      *   Short memo format? Yes.

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** [Date]
  **SUBJECT:** Recommendation re: Disclosure and Decision-Making Authority (Case #____)

  **Context**
  The oncology team is requesting guidance regarding a 70-year-old patient with metastatic pancreatic cancer. The patient's three adult children are requesting non-disclosure of the diagnosis and prognosis to the patient, asserting that treatment decisions should be made collectively by the family. The eldest son, an instructor of Confucian philosophy, argues that withholding the diagnosis is not paternalistic but protective, grounded in a view that the self is relationally constituted and that major medical decisions are inherently familial, not individual.

  Current hospital policy presumes full disclosure unless the patient waives this right. However, the patient has not yet been asked.

  **Ethical Analysis**
  We must avoid treating the son's objection merely as a "cultural preference" to be accommodated if convenient. His claim is ontological: he challenges the Western bioethical assumption that a competent adult is an isolated decision-maker. In his framework, *filial piety* involves sharing the moral burden of mortality so the parent does not face it alone. To force disclosure on this view is not to respect the patient, but to isolate her.

  However, the clinical team's concern is equally valid: assuming the patient holds this view without evidence is its own form of paternalism. We cannot presume she shares her children's philosophical framework. To defer to the family immediately is to bypass the patient's agency in defining *how* she wishes to be an agent (individually or relationally).

  **Recommendation**
  The Committee should recommend a **Staged Assessment of Information Preference** to be executed by the attending physician with a social worker or chaplain present.

  1.  **Action:** The team will meet with the patient privately. The goal is *not* to disclose the diagnosis immediately, but to ask her **meta-preference** regarding information and decision-making.
      *   *Suggested Phrasing:* "We have some significant test results. Different people prefer to handle this information differently. Some want all the details directly; others prefer their family to hear the details first and help manage the next steps. How would *you* prefer we handle this?"
  2.  **Rationale:** This respects autonomy not by forcing information, but by asking her to define the boundaries of her autonomy. If she chooses familial filtering, the family's request is validated by the patient's own voice. If she chooses direct disclosure, the family's request is overridden by her expressed will.
  3.  **Timeframe:** This conversation must occur within **48 hours** (by Wednesday EOD). This balances the need for timely treatment planning with the necessity of securing informed consent/assent from the correct decision-maker.
  4.  **Contingency:**
      *   *If she prefers family-led decision making:* Document this waiver of direct disclosure. The family becomes the primary interface, provided they continue to act in her perceived best interest.
      *   *If she prefers direct disclosure:* The physician discloses the diagnosis with support services present. The family is then invited to participate in decision-making *with* her, not *for* her.

  **Conclusion**
  This approach avoids the false dichotomy of "Hospital Autonomy vs. Family Paternalism." It recognizes that the right to decide includes the right to delegate that decision. We honor the son's ethical argument by taking it seriously enough to test it against the only authority that matters: the patient's own conception of her relationships.

  **Action Required:** Committee endorsement of this plan to be communicated to Oncology Leadership Tuesday afternoon.
