          *   It's deterministic.
          *   It reproduces all standard QM predictions (Quantum Equilibrium Hypothesis).

      *   **Why is it controversial/ignored? (The Downsides):**
          *   Explicit non-locality makes it hard to reconcile with Special Relativity (Lorentz invariance). This is the biggest technical hurdle.
          *   It looks "clunky" or "baroque" compared to the standard formalism.
          *   It treats position as special (asymmetry between position and momentum).

      *   **Addressing the "Textbook Myth":**
