answer: |-
  It is a pleasure to address a question from someone with your background. You have correctly identified one of the most persistent and frustrating misconceptions in the pedagogy of quantum mechanics.

  The short answer is: **You are not misremembering the experiments, but you are likely recalling a simplified version of what Bell’s Theorem actually forbids.**

  Bell’s Theorem, confirmed by Aspect and subsequent experiments, did **not** rule out all hidden variable theories. It ruled out **local** hidden variable theories.

  This is the crucial distinction that often gets lost in undergraduate physics curricula, which tend to focus on calculation and the "shut up and calculate" Copenhagen orthodoxy rather than foundational ontology. Here is the breakdown of why Bohmian mechanics survives Bell’s theorem, and why it remains a serious contender among philosophers and foundational physicists.

  ### 1. The "Local" Loophole
  Einstein’s hope (shared by many) was that quantum mechanics was incomplete and that there existed "hidden variables" that would restore determinism and, crucially, **locality**. Locality is the principle that an object is influenced directly only by its immediate surroundings, and that no influence can travel faster than the speed of light.

  John Bell derived his famous inequalities based on three assumptions:
  1.  **Realism:** Particles have definite properties prior to measurement (hidden variables).
  2.  **Locality:** Measurements here cannot instantly affect reality there.
  3.  **Freedom:** The experimenter is free to choose measurement settings.

  When Aspect’s experiments violated Bell’s inequalities, it meant that **at least one** of those assumptions had to be false.
  *   **Standard Quantum Mechanics (Copenhagen)** generally sacrifices Realism (particles don't have definite positions until measured).
  *   **Bohmian Mechanics** sacrifices Locality.

  De Broglie-Bohm theory is explicitly **non-local**. In the Bohmian picture, the "pilot wave" (the wavefunction) exists in a high-dimensional configuration space, not ordinary 3D space. This wave guides the particles. If you have two entangled particles, the pilot wave connects them instantaneously. If you measure particle A, the guiding wave updates instantly, affecting the trajectory of particle B, regardless of the distance.

  Because Bohmian mechanics embraces non-locality, it is perfectly compatible with Bell’s theorem. In fact, Bohmian mechanics was the specific counter-example Bell had in mind when he formulated his theorem. He showed that any theory that reproduces QM predictions *must* be non-local. Bohmian mechanics says, "Fine, we are non-local," and thus survives.

  ### 2. Why is it taken seriously? (The Ontological Appeal)
  You mentioned reading Tim Maudlin and David Albert. These philosophers (and many physicists) take Bohm seriously because it solves the **Measurement Problem** in a way that Standard QM does not.

  In standard QM, there is a fuzzy boundary between the quantum system and the classical observer, leading to the "collapse of the wavefunction." When does collapse happen? What constitutes a measurement? Standard QM has no good answer.

  Bohmian mechanics offers a clear ontology:
  *   **Particles exist:** They always have definite positions.
  *   **Waves exist:** The wavefunction is a real physical field (in configuration space).
  *   **No Collapse:** The wavefunction never collapses; it evolves deterministically via the Schrödinger equation. The *appearance* of collapse arises because the particle ends up in one branch of the wavefunction and is effectively decoupled from the others.

  For a philosopher of science concerned with **realism** (the idea that there is a mind-independent reality), Bohm is incredibly attractive. It restores the idea that electrons are things that exist even when no one is looking at them, moving along definite paths.

  ### 3. So, why isn't it the standard view? (The Relativity Problem)
  If Bohm is deterministic, realistic, and solves the measurement problem, why did your undergraduate professors dismiss it?

  The primary objection is **Special Relativity**.
  While Bohmian mechanics is consistent with the *predictions* of relativity (it obeys the "no-signaling theorem," meaning you cannot use the non-locality to send faster-than-light messages), the theory itself is not **Lorentz Invariant** at the fundamental level. It requires a preferred reference frame to define the instantaneous "guiding" of the particles.

  To most working physicists, a theory that requires a preferred frame (a return to a kind of "aether") is aesthetically and theoretically unacceptable, even if that frame is empirically undetectable. They prefer interpretations (like Many-Worlds or Copenhagen) that seem to fit more naturally with the relativistic spacetime structure, or they hope for a future theory that reconciles Bohmian non-locality with relativity (a project that is ongoing but difficult).

  ### 4. Is it philosophical lag?
  It is not that philosophers are lagging behind physics; rather, they are often ahead of the *textbook* physics.
  *   **Textbooks:** Often present a "folklore" version of quantum history where Bell killed Einstein, and hidden variables are impossible. This is a pedagogical simplification.
  *   **Philosophers/Foundational Physicists:** Recognize that Bell killed *Local* Hidden Variables, leaving *Non-Local* Hidden Variables (Bohm) as a viable, empirically equivalent alternative.

  Tim Maudlin, in particular, has written extensively (e.g., in *Quantum Non-Locality and Relativity*) arguing that physicists are too quick to dismiss Bohmian mechanics due to a misunderstanding of what relativity actually forbids (signaling vs. influence).

  ### Summary
  Your confusion is entirely warranted given how physics is traditionally taught.
  1.  **Bell's Theorem** rules out **Local** Hidden Variables.
  2.  **Bohmian Mechanics** is a **Non-Local** Hidden Variable theory.
  3.  Therefore, **Bell's Theorem does not rule out Bohm.**
  4.  **Aspect's Experiments** confirmed that nature is non-local. Bohm accepts this; Einstein did not.
  5.  **The snag:** Bohm is difficult to reconcile with the *spirit* of Special Relativity (Lorentz invariance), which is why it remains a minority view, but it is logically consistent and empirically adequate.

  You are not misremembering the science, but you are encountering the difference between the "instrumentalist" view taught in most chemistry and physics departments (QM is a tool for prediction) and the "realist" view explored in philosophy (QM is a description of what exists). Bohmian mechanics is the price one pays if you want definite particles *and* want to keep the experimental predictions of QM.
