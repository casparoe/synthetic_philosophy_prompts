      *   **Lewis's Reformed Conditional Analysis (RCA):** $x$ is disposed to $M$ when stimulated by $S$ iff $x$ has an intrinsic property $B$ (the causal basis) such that if $x$ were $S$-ed and $B$ persisted, $x$ would $M$.
          *   *Key Move:* Adds the "causal basis" clause and the "persistence" clause.

