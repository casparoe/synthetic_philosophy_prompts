          *   *Core Issue:* The intrinsic basis of the disposition is not stable during the stimulus.
      *   **Masking/Antidotes:** The disposition *remains* but is prevented from manifesting by an external factor.
          *   *Example:* A fragile glass wrapped in bubble wrap. It is fragile. If struck (with wrap on), it doesn't break. SCA says "Not fragile." (False Negative).
          *   *Example:* Poison + Antidote. Poison is lethal. Ingested with antidote, victim lives. SCA says "Not lethal." (False Negative).
