  2.  **Deconstruct the Philosophical Concepts:**
      *   **Simple Conditional Analysis (SCA):** $x$ is disposed to $M$ when stimulated by $S$ iff if $x$ were $S$-ed, $x$ would $M$. (Fragile = if struck, would break).
      *   **Finkish Dispositions (Martin):** The disposition *disappears* upon the stimulus.
