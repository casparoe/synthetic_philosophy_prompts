answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a software engineer, which means I spend my days telling very fast, very literal machines what to do. So, standing up here to speak about evolutionary biology is a bit like a plumber trying to give a lecture on the architecture of the Sphinx. I know my limitations. In fact, before I wrote this, I ran my draft by three of Dr. [Aunt's Name]'s former PhD students to make sure I didn't accidentally commit scientific heresy. They told me this version is "acceptable," which, coming from biologists, I think is the equivalent of a standing ovation.

  We are here to celebrate forty years of my aunt's career. For four decades, she has been a champion of what is known as the "gene's-eye view" of evolution. Now, for the family members in the room: roughly speaking, this is the idea that nature isn't really looking out for the animal, or the herd, or the species. It's looking out for the genes. The organism is just the vehicle the genes build to get themselves into the next generation.

  And for the biologists in the room: yes, I know that's a simplification, but please don't throw napkins at me.

  This theory led to a famous, decade-long debate between my aunt and a respected colleague regarding worker ants. The colleague argued that when an ant sacrifices herself for the hill, she is serving the "good of the colony." My aunt argued that you don't need to appeal to the colony's spirit. You just need the math of shared DNA. She argued that the ant isn't being noble; she's ensuring the replication of the genes she shares with her sisters. It was a rigorous, intellectual battle over the mechanics of altruism.

  But here is the joke that our family has whispered for years. The woman who spent her life explaining the mechanics of the "Selfish Gene" is, in practice, the most unselfish human being we know.

  In the lab, she taught that organisms are survival machines designed for replication. In life, she is the person who drives you to the airport at 4:00 AM. She's the one who remembers your birthday when you've forgotten it yourself. She's the one who, when a student was struggling with funding, didn't just write a grant letter; she quietly found them a paid research assistantship so they wouldn't have to drop out.

  There is a profound irony in that. She dedicated her career to understanding why, statistically, we *should* act in our own self-interest, or at least in the interest of our genetic code. And yet, she consistently chose to act with a generosity that defies the very models she studied.

  As an engineer, I think about systems. I think about code. And I've come to realize that my aunt's life offers a correction to her own science. Or perhaps, a completion of it.

  The "gene's-eye view" explains the *capacity* for love. It explains the hardware. It explains why we are wired to care about our kin, why we have the potential for sacrifice. But it doesn't write the software. It doesn't dictate how we run the program.

  The science explains why the ant *must* sacrifice herself. But my aunt *chose* to sacrifice for us. And there is a world of difference between instinct and choice.

  To the students and collaborators here: You know better than anyone how fiercely she defended her ideas. She demanded rigor. She demanded evidence. She never let a sloppy argument slide. But you also know that she defended her students with that same ferocity. She applied the same intensity to building your careers as she did to building her theories.

  To the family: We know her as the woman who brings the casserole, who listens to the same stories twice without blinking, who loves us not because we share fifty percent of her DNA, but because we are us.

  So, if I may offer a hypothesis to close: Perhaps the ultimate triumph of the gene isn't just replication. Perhaps, in rare cases like my aunt, the genes build a vessel so remarkable, so capable of transcending their own selfish instructions, that the organism becomes more than the sum of its parts.

  The science says she should be a survival machine. We know she is a sanctuary.

  Aunt [Name], you spent forty years teaching us how life persists. Thank you for showing us how to make it matter.

  Please raise your glasses. To the gene's-eye view, and to the heart that proved it wasn't the whole picture. To [Aunt's Name].
