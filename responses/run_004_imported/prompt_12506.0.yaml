answer: |-
  This is a classic example of David Lewis (the analytic philosopher, not the author of *Narnia*) doing what he did best: taking a common metaphor, treating it with rigorous logical literalism, and showing where the machinery grinds to a halt.

  You are right to sense that the remark about prison costs isn't just a grumble about taxes. It is a specific logical move designed to break the analogy between **financial debt** and **moral punishment**.

  Here is an explanation of the test Lewis is applying, why society fails it, and how this sets the trap for the doctrine of penal substitution.

  ### 1. The Test: What defines a "Creditor"?

  Lewis is analyzing the logic of the word "debt." In a standard financial transaction, the relationship between a Debtor and a Creditor has specific structural features. For the metaphor of "owing a debt of punishment" to work, the parties involved must fit those features.

  Lewis implicitly applies a **Restoration Test** to identify a true creditor. For $X$ to be a Creditor in a debt relationship, the following must be true:
  1.  **Prior Loss:** $X$ has suffered a loss (money lent, goods delivered).
  2.  **Restorative Payment:** The "payment" of the debt restores $X$ to the position they were in before the loss.
  3.  **Net Benefit:** The transaction results in a net gain (or at least a neutralization of loss) for $X$.

  In a financial debt, the suffering of the debtor is irrelevant to the definition of the creditor. Whether the debtor starves to pay the bill or pays effortlessly, the creditor receives the money and is made whole. The value flows **from** the debtor **to** the creditor.

  ### 2. Why Society Fails the Test

  Lewis suggests that if we try to map this onto criminal justice, we need to find the "Creditor." Who was wronged? The obvious answer is "Society." So, let's run Society through the Restoration Test.

  *   **Prior Loss:** Did society suffer a loss? Yes, a crime disrupts order, harms victims, etc.
  *   **Restorative Payment:** Does punishing the criminal restore society?
  *   **The Prison Cost Problem:** This is where Lewis drops the parenthetical remark. If the "payment" of the debt is imprisonment, society must pay for the prison, the guards, the food, and the administration.

  Lewis is pointing out a reversal in the **flow of value**.
  *   In a **financial debt**, the creditor *receives* value when the debt is paid.
  *   In a **punishment debt**, the "creditor" (society) *expends* value when the debt is paid.

  If I owe you $\$100$, and I pay you $\$100$, you are $\$100$ richer.
  If Society "owes" punishment, and Society punishes me, Society is (in terms of tax dollars) *poorer*.

  By highlighting the cost of prisons, Lewis is showing that Society does not function as a Creditor because Society is not being "paid back." In fact, Society is paying *twice*: once for the cost of the crime, and again for the cost of the punishment. If the "payment" of the debt inflicts a further financial loss on the supposed creditor, the definition of "creditor" collapses. There is no one being made whole.

  ### 3. Why This Matters for Penal Substitution

  This distinction is the foundation for the rest of Lewis's paper. The doctrine of Penal Substitution relies entirely on the coherence of the **Debt Metaphor**.

  The theological argument usually runs like this:
  1.  Sinners owe a debt of punishment to God.
  2.  A debt can be paid by a substitute (Jesus).
  3.  Therefore, Jesus can pay the debt for us.

  Lewis is attacking premise #1 and #2 by showing they are category errors.

  **If punishment is not a debt, it cannot be paid by a substitute.**
  In finance, substitution makes perfect sense. If you cannot pay your mortgage, I can step in and pay the bank for you. The bank (the creditor) doesn't care who hands over the cash; they just want the value restored.

  But if punishment is not a transfer of value to a creditor, but rather the **infliction of suffering on the guilty**, substitution becomes logically incoherent.
  *   **Financial Debt:** The focus is on the *Creditor's gain*. (Who pays doesn't matter, as long as the creditor gets paid).
  *   **Punishment:** The focus is on the *Debtor's suffering*. (It matters *who* suffers, because justice requires the *guilty* party to suffer).

  By dismantling the "Society as Creditor" idea, Lewis shows that punishment is fundamentally different from finance. In punishment, there is no creditor waiting to be satisfied by a transfer of value. There is only a guilty party who deserves to suffer.

  ### Summary of the Logical Move

  Lewis is arguing that the phrase "debt of punishment" is a **dead metaphor**. We use the word "debt" loosely, but logically it doesn't fit.

  1.  **The Test:** A creditor must be restored/benefited by the payment.
  2.  **The Failure:** Society (the proposed creditor) is financially burdened by the "payment" (imprisonment).
  3.  **The Conclusion:** Therefore, punishment is not a debt repayment.
  4.  **The Implication for Theology:** If punishment is not a debt repayment, then the logic of "substitutionary payment" (Jesus paying our debt) is logically invalid. You cannot substitute a payment in a system that isn't actually a payment system.

  Lewis isn't necessarily saying penal substitution is false (he leaves the theological mystery open), but he is arguing that it cannot be defended using the logic of finance and debt. If you want to defend it, you have to abandon the accounting metaphor entirely, which undermines the way most proponents explain it. The parenthetical about prison costs is the wedge he uses to crack the metaphor open.
