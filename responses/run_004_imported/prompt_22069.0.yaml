          *   *Context:* Arguing against the Neoplatonic/Aristotelian philosophers (like Avicenna/Ibn Sina) who claimed the world operates by necessary emanation.
          *   *Goal:* Protect Divine Omnipotence. If fire *necessarily* burns, God cannot stop it without changing the nature of fire. If burning is just God's habit, God can interrupt it (miracles).
