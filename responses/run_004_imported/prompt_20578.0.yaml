          *   *Claim:* "'dialetheism' and 'paraconsistent logic' are basically two labels for one package..."
          *   *Assessment:* **Incorrect.** This is a standard distinction in the field.
              *   *Paraconsistent Logic:* A property of a logical system (consequence relation) where Explosion fails ($A, \neg A \nvdash B$). One can use paraconsistent logic *without* believing contradictions are true (e.g., as a tool for modeling inconsistent databases or belief revision).
