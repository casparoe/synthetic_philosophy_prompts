              *   Kripke's Strong Kleene ($K_3$) assigns the Liar the value 'Undefined' (or 'Gap'). It is *not* designated. The Liar is *neither* true nor false.
              *   Priest's LP assigns the Liar the value 'Both' (or 'Glut'). It *is* designated. The Liar is *both* true and false.
              *   The student says Kripke's theory puts it in a third category "the theory was built to accommodate." While both use 3 values, the *philosophical motivation* and the *logical behavior* are opposites regarding the Liar. Kripke saves consistency by sacrificing completeness (Liar is not true); Priest saves completeness (Liar is true) by sacrificing consistency.
              *   The student implies they are "in the same family" regarding how they handle the Liar's truth status ("stable home outside bivalence"). While structurally similar (3-valued), the semantic intent is opposite (Gap vs. Glut).
              *   *Crucial Error:* The student implies Kripke's approach is similar to LP in a way that suggests Kripke also allows the Liar to be true-and-false or that the mechanisms are equivalent in goal. Kripke's logic ($K_3$) is paracomplete, not paraconsistent. The Liar is *not* designated in Kripke's standard construction.
