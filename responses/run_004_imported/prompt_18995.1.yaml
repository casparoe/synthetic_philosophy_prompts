      *   **3. Hume's Is-Ought:** Quine respects the distinction. Describing how values are formed (sociology) doesn't tell you which values are "correct" because there is no external standard of "moral correctness" analogous to "empirical adequacy."
      *   **4. Evolutionary Ethics (quasi):** Quine acknowledges values evolve (like language), but he doesn't think later = better in a truth sense, just different adaptations.

