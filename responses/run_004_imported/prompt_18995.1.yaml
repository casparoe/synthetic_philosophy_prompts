      *   **User Background:** Retired experimental physicist. Appreciates "unsentimental, science-first" approaches. Has been reading Quine (naturalized epistemology).
      *   **Core Question:** Why didn't Quine extend his naturalism fully to ethics (moral values) in the same way he did to epistemology? The user expects consistency: if justification of belief becomes psychology, shouldn't justification of value become sociology/psychology?
