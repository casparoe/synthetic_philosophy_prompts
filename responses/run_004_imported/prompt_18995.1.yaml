answer: |-
  You have sized up Quine's position with remarkable accuracy, and your intuition that there is a tension here is shared by many of his critics and admirers alike. As a physicist, your expectation of intellectual consistency is well-founded: if one dissolves the normative into the descriptive in the realm of belief, why not in the realm of value?

  The short answer is: **You are correct that Quine stopped short.** He did not treat ethics with the same robust naturalism he applied to epistemology. However, this was not an oversight or a lapse in nerve; it stemmed from principled commitments in his philosophy of language and ontology.

  Here is the breakdown of why Quine, the arch-naturalist, refused to fully naturalize ethics in the way you describe.

  ### 1. The Disanalogy of Truth and Evidence
  The core of Quine's naturalized epistemology is the relationship between **theory** and **sensory evidence**. For Quine, the ultimate tribunal for scientific claims is sensory stimulation. We justify beliefs instrumentally: a belief is "good" if it helps us predict future sensory stimuli successfully.

  In "On the Nature of Moral Values" (1966), Quine argues that moral statements lack this connection to sensory evidence.
  *   **Science:** "There is an electron" is true or false based on its contribution to a web of belief that successfully predicts sensory outcomes.
  *   **Ethics:** "Stealing is wrong" does not predict sensory stimuli. It does not help us navigate physical space or anticipate experimental results.

  For Quine, moral sentences are not **truth-apt** in the same way scientific sentences are. They do not describe a state of affairs in the world that can be confirmed or disconfirmed by observation. Therefore, while you can study the *psychology* of why someone believes stealing is wrong (the causal genesis), you cannot treat the *validity* of that claim as an empirical hypothesis. There is no "mural reality" out there to be wrong about.

  ### 2. Non-Cognitivism vs. Naturalism
  Your suggestion is that moral disagreements should be treated as "unfinished empirical inquiries." This is the stance of **ethical naturalism** (e.g., later philosophers like Gilbert Harman or Richard Boyd).

  Quine, however, leans heavily toward **non-cognitivism** (similar to A.J. Ayer or C.L. Stevenson). He views moral utterances not as failed descriptions of the world, but as expressions of attitude or commands.
  *   To say "Charity is good" is akin to saying "Hurrah for charity!"
  *   To say "Murder is bad" is akin to saying "Boo to murder!"

  You can empirically study *why* people say "Hurrah" or "Boo" (sociology/psychology), but you cannot empirically resolve the disagreement by finding more facts, because the disagreement isn't about facts. It is a clash of attitudes. For a physicist, this might look like giving up on the problem, but for Quine, it was a semantic necessity. If moral terms don't refer to objects or properties, there is nothing there to naturalize.

  ### 3. The Retention of Normativity in Epistemology
  It is worth noting a subtle point about Quine's naturalized epistemology that highlights the contrast with ethics. Quine did not *eliminate* normativity in epistemology; he **instrumentalized** it.
  *   **Epistemology:** "How *ought* we to believe?" becomes "If we want to predict sensory stimuli accurately, we *ought* to use the scientific method." The norm is hypothetical and tied to a clear biological goal (prediction/control).
  *   **Ethics:** What is the equivalent goal? Survival? Social cohesion? Happiness? Quine argues there is no single, biologically mandated "end" for morality that carries the same objective weight as sensory prediction. Without a fixed end, you cannot derive an "ought."

  Consequently, Quine treats moral values as part of our "web of belief," but they sit at the very periphery, insulated from direct empirical refutation. They can be revised, but only for the sake of social utility or internal coherence, not because they conflict with nature.

  ### 4. The Humean Heritage
  Quine is, at heart, a Humean empiricist. David Hume famously argued that you cannot derive an "ought" from an "is." Quine respects this boundary.
  *   He naturalizes the *is* (how beliefs are formed, how values are acquired).
  *   He accepts that the *ought* of science is grounded in the biological imperative of prediction.
  *   He denies that the *ought* of morality has a similar grounding.

  In *Pursuit of Truth*, Quine writes that moral judgments are "best viewed as... expressions of sentiment." He acknowledges that morality is essential for social functioning (a natural fact), but he refuses to grant moral propositions the status of scientific propositions.

  ### Summary for the Physicist
  You asked if there is a principled reason a thinker so committed to naturalism would stop short. **Yes.**

  Quine's naturalism is constrained by his **behaviorism** and **verificationism**.
  1.  **Behaviorism:** Meaning must be traceable to observable behavior and sensory stimuli. Moral terms fail this test.
  2.  **Verificationism:** A statement is cognitively meaningful only if there is a method to verify it. There is no verification procedure for "goodness."

  **Where you might disagree:**
  From a modern scientific perspective, one could argue Quine was too conservative. Contemporary evolutionary ethics and neuroethics often take the step you suggest: treating moral values as adaptive strategies for social species, where "wrong" roughly maps to "socially destructive to the group's survival."

  Quine would likely reply that this explains the *origin* of the value, but does not validate the *claim*. To conflate the two would be to commit the genetic fallacy.

  **Verdict:** Your reading is correct. Quine's ethics are indeed "guarded." He naturalizes the *study* of morals (as a human phenomenon) but refuses to naturalize the *authority* of morals (as truth claims). Whether this is a brilliant distinction or an inconsistency is one of the great debates in 20th-century philosophy. Given your background, you are in good company to find it an unsatisfying half-measure.
