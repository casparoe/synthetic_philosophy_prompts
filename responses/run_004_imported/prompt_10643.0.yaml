  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user just finished jury duty (4-day civil trial).
      *   **Event:** Post-trial drinks with fellow jurors.
      *   **Claim:** An econ-studying juror claimed the Condorcet Jury Theorem (CJT) proves larger juries are *always* more accurate, suggesting we should crowdsource verdicts to 1,000 people via an app.
