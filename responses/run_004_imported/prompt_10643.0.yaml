      *   *Is 12 people optimal?* Research suggests 6 vs 12 doesn't make a huge statistical difference if $p$ is high, but 12 allows for better minority representation.
      *   *Crowdsourcing:* Mention "Wisdom of Crowds" vs. "Mob Mentality."

  9.  **Final Polish:** Organize with clear headings. Ensure the distinction between *statistical theory* and *legal practice* is sharp. (This aligns with the structure of the final output).

  **(Self-Correction during drafting):** Make sure to emphasize that if $p < 0.5$, the theorem reverses. This is the strongest mathematical rebuttal to the friend. If the crowd is biased against the defendant, adding more people guarantees a wrongful verdict.

