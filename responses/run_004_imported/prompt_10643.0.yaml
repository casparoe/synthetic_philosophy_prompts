      *   **Core Question:** Is the friend right (small juries are outdated, crowdsourcing is statistically superior), or is he missing critical assumptions that make the theorem inapplicable to real-world juries?

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   **What is it?** A mathematical theorem by Marquis de Condorcet (1785).
      *   **Core Premise:** If each voter has an independent probability $p > 0.5$ of making the correct decision, then the probability that the majority vote is correct increases as the number of voters increases, approaching 1 as $n \to \infty$.
      *   **Critical Assumptions:**
          1.  **Binary Choice:** There are only two options (Guilty/Not Guilty, True/False).
          2.  **Competence ($p > 0.5$):** Each voter must be *more likely than not* to be correct individually.
          3.  **Independence:** Voters must decide independently of one another (no collusion, no shared bias, no herd mentality).
          4.  **Sincere Voting:** Voters vote for what they believe is true, not strategically.

  3.  **Evaluate the Friend's Claim against the Assumptions:**
      *   *Claim:* "More people = more accurate no matter what."
      *   *Reality:* Only true if $p > 0.5$. If $p < 0.5$ (voters are systematically biased or incompetent), adding more people makes the outcome *worse* (approaches 0 accuracy).
      *   *Claim:* "Crowdsource 1,000 people on an app."
      *   *Reality:* Violates the **Independence** assumption massively. People would be influenced by media, social media, discussion boards, etc. It also violates the **Competence** assumption (random app users haven't seen evidence).
      *   *Claim:* "12-person jury is outdated."
      *   *Reality:* 12 is a specific legal standard, but the theorem suggests diminishing returns. Going from 1 to 12 helps a lot; going from 12 to 1000 helps less *if* assumptions hold, but in reality, it breaks the assumptions.

  4.  **Identify Legal/Practical Constraints (Beyond the Math):**
      *   **Due Process:** Defendants have a right to confront accusers, see evidence, and be judged by a "jury of peers" who hear the *same* evidence. App users wouldn't see admissible evidence only.
      *   **Deliberation:** The jury system values *discussion*, not just aggregation. Deliberation can correct individual misunderstandings (though it can also introduce groupthink). CJT assumes independent voting, not deliberation.
      *   **Evidence Admissibility:** Rules of evidence exist to prevent prejudice (hearsay, prior bad acts). A crowd would be exposed to inadmissible info.
      *   **Secrecy/Anonymity:** CJT works with anonymous votes, but legal verdicts require accountability and reasoning (sometimes).

  5.  **Synthesize the Argument:**
      *   **Validate the User:** It's good they are questioning this. The friend is partially right about the math but wrong about the application.
      *   **Explain the Theorem:** Briefly define CJT (Majority rule + Competence + Independence).
      *   **Highlight the "Gotchas" (The Friend's Errors):**
          *   **Competence ($p > 0.5$):** Random app users don't know the case. Their $p$ is basically 0.5 (coin flip) or lower (biased). If $p \le 0.5$, CJT fails.
          *   **Independence:** A crowd of 1,000 isn't independent. They share information ecosystems. Jurors are sequestered (to an extent) to maintain independence.
          *   **Binary vs. Nuanced:** Civil trials aren't always simple Yes/No. Damages, liability percentages, etc.
      *   **Discuss the Value of Deliberation:** The jury isn't just a vote counter; it's a discussion group. This violates CJT's independence assumption but serves a different purpose (reasoned consensus).
      *   **Legal/Constitutional Issues:** 6th Amendment (US context implied), right to confront, rules of evidence.
      *   **Conclusion:** The friend applied a theoretical model to a complex sociological/legal system without checking the model's constraints.

  6.  **Refine the Tone:**
      *   Empathetic (jury duty is draining).
      *   Informative but not condescending.
