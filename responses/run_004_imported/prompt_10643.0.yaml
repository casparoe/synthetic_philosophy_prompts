      *   *The "Deliberation" Factor:* Juries talk. CJT assumes they don't. Why do we make them talk? To refine understanding, not just aggregate errors.
      *   *Legal Reality:* Evidence rules, due process.
      *   *Verdict on the Friend:* He's "mathematically literate but contextually illiterate."
      *   *Closing:* Reassure the user that the 12-person system, while flawed, isn't flawed for the reason the friend thinks.

  8.  **Self-Correction/Nuance Check:**
