  3.  **Formulate the Verdict:**

      *   *Which is right?* Cognitive Instability is the deepest and most robust diagnosis. Bayesian disconfirmation is technically tricky because of the indistinguishability issue. The Measure Problem is a necessary technical fix but insufficient as a philosophical resolution.
