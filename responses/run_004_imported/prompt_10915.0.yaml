  2.  **Deconstruct the Three Framings:**

      *   *Framing 1: Bayesian Disconfirmation.*
          *   Logic: $P(E|T_{BB}) \approx 1$ (if BBs dominate, I should be one), $P(E|T_{Normal}) \ll 1$. But wait, the evidence $E$ is "I seem to have a past." A BB *also* has this evidence. So likelihoods are equal?
