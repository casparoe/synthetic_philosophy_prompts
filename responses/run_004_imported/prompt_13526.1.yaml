      *   *Reason 2: The Danger of Contingency.* Scientific theories change. Tying eternal truth to contingent theory risks faith if the theory falls.
      *   *Reason 3: Reversing the Error.* The Inquisition tried to make Science submit to Theology. Apologists making Theology submit to (or depend on) Science is the mirror image of the same error (conflation of domains).
