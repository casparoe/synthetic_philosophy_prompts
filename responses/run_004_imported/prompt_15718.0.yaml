answer: |-
  Your intuition is tracking something very real. Your first friend is viewing this through a narrow lens of *substantive certainty* (who actually owns the dirt), while you are sensing a violation of *procedural justice* and *social stability*.

  The feeling that something is "off" stems from the fact that property disputes are not just about geography; they are about relationships, expectations, and the rules we use to resolve uncertainty. Your neighbor didn't just claim land; he exploited the high cost of justice to override a settled social arrangement.

  Here is a breakdown of why your impression of unfairness is philosophically and legally grounded, even absent a survey.

  ### 1. The Moral Weight of the Status Quo (Schelling Points)
  In game theory and economics, there is a concept called a **Schelling point**: a solution that people tend to choose by default in the absence of communication because it seems natural, special, or relevant.

  The old, crooked fence was a Schelling point. For a year (and likely longer, given you say it "always stood"), that fence served as a mutually accepted boundary. In the absence of precise deeds, human societies rely on these focal points to maintain peace.
  *   **The Unfairness:** By tearing it down, your neighbor didn't just move wood; he destroyed a shared social contract. There is a moral premium on stability. Disrupting a peaceful status quo to gain a marginal advantage is generally viewed as aggressive, whereas defending the status quo is viewed as conservative and stabilizing. Your friend who says you have "no grievance" ignores the value of peace itself.

  ### 2. Procedural Justice vs. Substantive Justice
  Your friends are focusing on *substantive justice* (the correct outcome: who owns the grass). You are reacting to a violation of *procedural justice* (the fairness of the process used to decide).

  Even in legal systems, *how* a decision is made matters as much as the result.
  *   **Unilateral Adjudication:** Your neighbor effectively acted as plaintiff, judge, and executioner. He decided the evidence favored him, issued the ruling, and enforced it physically.
  *   **Due Process:** A fair resolution would involve negotiation, mediation, or a third-party arbiter (a surveyor or judge). By bypassing these steps and leveraging your reluctance to sue, he denied you a voice in the process.
  *   **The Takeaway:** It feels unfair because it *was* unfair procedurally. A claim fixed by "who acted first" is fundamentally different from a claim fixed by "who is right," even if the outcome happens to be the same.

  ### 3. The Legal Reality (Countering Friend #1)
  Your first friend claims that until you show he is wrong, his claim is "no better or worse than yours." This is legally naive. In property law, evidence is not limited to a deed or a survey.

  *   **Boundary by Acquiescence/Agreement:** In many jurisdictions, if neighbors treat a certain line as the boundary for a statutory period (often much less than a year, sometimes just a season), that line can become the legal boundary regardless of what the deed says. The old fence was evidence of an *agreed boundary*.
  *   **Adverse Possession:** While usually requiring years, the principles behind it acknowledge that long-standing use creates rights.
  *   **Self-Help Restrictions:** Most legal systems frown upon "self-help" remedies in property disputes. Tearing down a fence that marks a long-standing boundary can itself be a tort (property damage or trespass), regardless of where the true line lies.

  So, it is not true that there is "no evidence." The evidence (the old fence and your long-standing treatment of the land) likely favored *you*, or at least favored the status quo. Your neighbor didn't just claim the land; he likely destroyed evidence that contradicted his claim.

  ### 4. Exploiting Transaction Costs (The Coase Theorem)
  Economist Ronald Coase theorized that if property rights are clear and transaction costs are zero, parties will bargain to an efficient outcome. But here, transaction costs (the cost of a survey or lawsuit) are high.

  Your neighbor has engaged in **strategic hold-up behavior**. He knows that the cost of enforcing your right ($5,000 survey + legal fees) exceeds the value of the right itself (3 feet of grass). He is effectively taxing your rationality.
  *   **The Injustice:** This creates a system where rights belong not to those who own them, but to those bold enough to seize them and shameless enough to dare the other party to pay for justice.
  *   **Why it sticks:** You are correct that "acting first and being able to make it stick" is currently separating the claims. But recognizing that this is a *failure* of the system, rather than a valid method of establishing truth, validates your feeling of unfairness. It is the difference between "Might makes Right" (a description of power) and "Might makes Right" (a moral philosophy). Most people reject the latter.

  ### 5. Summary: Why You Are Right to Feel Wronged
  You are stuck because you are trying to solve a moral problem with evidentiary tools.
  *   **Friend 1** thinks fairness = accuracy. (If we don't know the accuracy, we can't judge fairness.)
  *   **You** sense that fairness = process + stability. (Even if we don't know the accuracy, we can judge the aggression and the bypassing of norms.)

  Your impression is tracking a real distinction. A claim established through force and the exploitation of high transaction costs is ethically inferior to a claim established through evidence and agreement, even if the underlying truth of the boundary remains unknown.

  Your neighbor hasn't proven he is right; he has simply made the cost of proving him wrong too high for you to bear. That is not justice; it is coercion. You are allowed to feel that the situation is unfair without needing a survey to prove it.
