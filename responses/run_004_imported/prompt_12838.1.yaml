      *   *The Solution 1: Dispositions (Gauthier).* It's rational to cultivate a disposition to keep promises. If you have the disposition, you get the ride. If you calculate case-by-case, you don't.
      *   *The Solution 2: Decision Theory (FDT).* Your decision is logically linked to the driver's prediction. You aren't just deciding to pay; you are deciding what *kind of agent* you are.
