answer: |-
  # The Perihelion and the Prior: Defending Bayesianism Against the Problem of Old Evidence

  The history of science is replete with moments where a new theory explains data that has been sitting in plain sight for decades. The paradigmatic case is Albert Einstein's General Relativity (GR). When Einstein formulated GR in 1915, the anomalous perihelion precession of Mercury was already a known astronomical fact, documented since the mid-19th century. Intuitively, GR's ability to derive this precise value was a massive confirmatory boost for the theory. However, within the standard framework of Bayesian Confirmation Theory (BCT), this intuition is mathematically impossible. This is the Problem of Old Evidence (POE), originally crystallized by Clark Glymour.

  The POE strikes at the heart of how Bayesians model learning. If Bayesianism cannot account for the confirmation of GR by Mercury's orbit, it risks being dismissed as a sterile logic of consistency rather than a useful model of scientific reasoning. While the problem is severe for static, idealized Bayesianism, it is not fatal. By evaluating the two primary responses—the counterfactual approach and the logical-omniscience relaxation approach—it becomes clear that the latter successfully dissolves the problem. The POE does not reveal an uneliminable flaw in Bayesianism; rather, it reveals that confirmation must be modeled as a dynamic process of learning logical relations, not merely updating on empirical data.

  ### The Mechanics of the Problem

  To understand the damage, one must understand the mechanism of Bayesian confirmation. In BCT, an agent holds a degree of belief, or credence, represented by a probability function $P$. Confirmation is defined via conditionalization. Evidence $E$ confirms hypothesis $H$ if and only if the posterior probability of $H$ given $E$ is greater than the prior probability of $H$:

  $$P(H|E) > P(H)$$

  By Bayes' Theorem, the posterior is calculated as:

  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  The problem arises from the status of "old" evidence. In an idealized Bayesian framework, if an agent knows a proposition to be true, its probability is assigned 1. Since the scientific community already knew the data about Mercury ($E_{Mercury}$) before Einstein proposed GR ($H_{GR}$), the prior probability of the evidence was $P(E_{Mercury}) = 1$.

  If $P(E) = 1$, it follows that $P(E|H) = 1$ (a hypothesis cannot make a certainty less certain). Plugging this into the theorem:

  $$P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$$

  The posterior equals the prior. The evidence provides zero confirmation. According to strict Bayesian conditionalization, the perihelion of Mercury could not have confirmed General Relativity. Since this contradicts one of the most robust judgments in the history of science, the POE suggests that BCT is descriptively inadequate and normatively bankrupt for actual scientific practice.

  ### The Counterfactual Strategy: A Fiction Too Far

  One prominent attempt to save Bayesianism is the counterfactual strategy, championed by philosophers like Colin Howson. This approach suggests that to measure the confirming power of old evidence, we should not look at the agent's *actual* prior credences, but rather at a counterfactual prior function, $P^*$. $P^*$ represents what the agent's credences *would have been* had they not yet learned $E$.

  In this scenario, we imagine Einstein (or the scientific community) in a state where the perihelion of Mercury is not yet known. In that counterfactual state, $P^*(E) < 1$. We then calculate how much learning $E$ would have raised the probability of $H$. If $P^*(H|E) > P^*(H)$, we say $E$ confirms $H$, even if the actual $P(E) = 1$.

  While this preserves the intuition that $E$ confirms $H$, it suffers from a fatal underdetermination objection. There is no unique way to construct the counterfactual prior $P^*$. "Unlearning" evidence is not a well-defined operation. If we remove $E$ from our knowledge base, how much else must we remove to maintain coherence? Does the agent retain knowledge of the instruments used to measure Mercury? Do they retain other gravitational anomalies? Different methods of subtracting $E$ yield different values for $P^*(H)$, and thus different measures of confirmation.

  Because the confirmation value depends entirely on which counterfactual history we choose to imagine, the measure becomes subjective and arbitrary. It saves the Bayesian formalism only by retreating into a fiction that lacks empirical or logical constraints. If confirmation theory is to guide scientific reasoning, it cannot rely on undefined "what-if" scenarios that vary from theorist to theorist. The counterfactual approach patches the math but breaks the epistemology.

  ### The Garber-Jeffrey-Niiniluoto Solution: Learning Entailments

  A more robust solution comes from Daniel Garber, Richard Jeffrey, and Ilkka Niiniluoto. This approach attacks the assumption that leads to $P(E)=1$ causing stagnation. It argues that the POE relies on an unrealistic assumption of **logical omniscience**.

  Standard Bayesianism assumes agents know all logical consequences of their beliefs immediately. If an agent believes $H$, and $H$ entails $E$, the agent is modeled as automatically knowing $H \to E$. However, real scientists are not logically omniscient. Einstein did not know that GR entailed the correct perihelion value until he performed the complex derivation. The "new" thing he learned was not the data $E$ (which was old), but the logical relation $A$: that $H$ entails $E$ (symbolized as $H \vdash E$).

  In this framework, we expand the algebra of propositions to include sentences about logical relations. Confirmation occurs not by conditionalizing on $E$ (which has $P=1$), but by conditionalizing on $A$ (the discovery of the entailment). Since the agent did not previously know $A$, its prior probability is less than 1 ($P(A) < 1$).

  The confirmation calculation becomes:
  $$P(H | H \vdash E) > P(H)$$

  If $H$ entails $E$, and $E$ is known to be true, learning that $H$ entails $E$ raises the probability of $H$. This is because $H$ is now the only live hypothesis (among those considered) that can account for the certain truth of $E$ via the newly discovered link.

  **Objections and Defense:**
  Critics, including Glymour, have argued that this solution shifts the goalposts. It claims that $H$ is confirmed by a logical fact ($H \vdash E$) rather than the empirical evidence ($E$). They argue this turns confirmation into a branch of logic rather than empirical science.

  However, this objection misunderstands the nature of theoretical science. In the context of high-level theory choice (like GR vs. Newtonian mechanics), the "evidence" is not merely the raw sensory data, but the *explanatory fit* between the theory and the data. The empirical fact (Mercury's orbit) is a fixed constraint. The scientific work lies in finding a theory that maps onto that constraint. When Einstein found the mapping, he gained new information: he learned that his theory was *capable* of saving the phenomena.

  Furthermore, the Garber approach avoids the arbitrariness of the counterfactual approach. The learning event (the derivation of the entailment) is a historical, psychological fact. We do not need to imagine a counterfactual world where Mercury's orbit is unknown; we only need to acknowledge the actual world where the link between GR and Mercury was unknown. This keeps the model grounded in the actual cognitive history of the scientist.

  ### Verdict: Bayesianism Survives, Idealization Perishes

  Does the Problem of Old Evidence reveal a genuine, uneliminable flaw in Bayesian confirmation theory? **No.** It reveals a flaw in the *idealization* of the Bayesian agent, not the core logic of probabilistic confirmation.

  The counterfactual approach fails because it attempts to preserve the idealization (that evidence must be empirically new) by fabricating hypothetical priors. This makes confirmation subjective and unmoored from actual reasoning. The Garber-style relaxation of logical omniscience succeeds because it aligns the formalism with the reality of scientific discovery. Science is not just about collecting new data; it is about recognizing new relationships between existing data and new hypotheses.

  Therefore, a version of Bayesianism successfully dissolves the problem, provided we accept three clarifications:
  1.  **Dynamic over Static:** Bayesianism must be treated as a model of *learning processes* (dynamic), not just a snapshot of rational belief states (static).
  2.  **Logical Learning is Empirical:** Learning a logical entailment between a physical theory and data is a cognitively costly, informative event that warrants probability updating.
  3.  **Agent-Relativity:** Confirmation is relative to an agent's state of information, including their logical knowledge. What confirms a theory for Einstein (deriving the entailment) might not confirm it for a student who is simply told the entailment holds.

  The POE does not break Bayesianism; it matures it. It forces the theory to abandon the god's-eye view of logical omniscience and account for the hard work of derivation that characterizes actual science. In the case of Mercury, the data was old, but the *connection* was new. By allowing Bayesian agents to update on that connection, the theory accurately captures why the perihelion of Mercury confirmed General Relativity. The flaw was never in the probability calculus, but in our assumption that scientists already know all the truths their calculus can derive.
