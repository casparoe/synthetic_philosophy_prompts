      *   Watch his reaction (Defensive? Calm? Confused?).

  10. **Final Review:** Does this answer the specific question? Yes, it provides a logical framework while acknowledging the emotional difficulty. It avoids telling the user what to do (break up/stay) and empowers them to evaluate.

