          5.  Managing the Anxiety (The toll of uncertainty).
      *   *Key Concept:* "Probabilistic Thinking." You don't need 0 or 100. You need to update your probability based on *new* data, not just dwell on old shaky data.

  8.  **Refining the "Logic" Section:**
      *   Use the concept of "Signal vs. Noise."
      *   Explain that 70% visual ID from afar is statistically unreliable.
      *   Explain that hearsay ("something happened") is low-value data.
      *   Conclusion: The evidence is currently "Noise."

  9.  **Refining the "Action" Section:**
      *   Suggest a "low-stakes check-in."
