prompt: |-
  okay weird question but it's been bugging me for days. my friend said she thinks she saw my boyfriend at the movies with another girl, but she was far away and admitted shes only like 70% sure it was actually him. then a different friend mentioned she'd heard 'something happened' with him that same weekend, but wasnt sure what, or if its even related to the first thing. neither of them is fully sure of anything, but it feels wrong to just brush it off. if one of them had said they were 100% sure i'd know exactly how mad to be, and if they'd said they were sure it wasnt him i'd just drop it — but i have no clue how im supposed to figure out how suspicious to be when the evidence itself is this iffy, let alone when its two shaky reports instead of one clean one. is there an actual logical way to think about this or does it just come down to gut feeling at some point?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The Core Issue:** The user is experiencing anxiety and uncertainty due to ambiguous reports about their boyfriend's potential infidelity.
      *   **Evidence Source 1:** Friend A saw someone who looked like the boyfriend at the movies with another girl. Confidence level: ~70%. Distance: Far away.
      *   **Evidence Source 2:** Friend B heard "something happened" involving the boyfriend that same weekend. Confidence level: Vague/Unknown. Connection to Source 1: Unclear.
      *   **User's Dilemma:** Doesn't know how to gauge suspicion. If it were 100% confirmed, they'd act. If it were 0%, they'd drop it. The "gray area" is paralyzing.
      *   **Question:** Is there a logical way to process this, or is it just gut feeling?

  2.  **Validate the User's Feelings:**
      *   Acknowledge that this is a stressful position. Uncertainty is often worse than bad news.
      *   Validate that it's *not* weird to be bothered by this. It's a natural reaction to potential threat detection in a relationship.

  3.  **Deconstruct the "Evidence" (Logical Analysis):**
      *   *Report 1 (Movies):* 70% certainty from a distance is actually quite low in investigative terms. Mistaken identity is common, especially in dark places like movie theaters. Context matters (was he supposed to be elsewhere?).
      *   *Report 2 (Hearsay):* "Something happened" is extremely vague. It could be anything (got fired, car trouble, family emergency, got drunk). Linking it to the movie sighting is confirmation bias unless there's proof.
      *   *Combined Weight:* Two weak signals don't necessarily make a strong signal. They might just be two instances of rumor mill noise.

  4.  **Develop a Framework for Decision Making (The "Logical Way"):**
      *   The user asked for logic, not just "trust your gut." So, provide a structured approach.
      *   *Step 1: Assess the Baseline.* How is the relationship *actually* going? Has behavior changed? (This is more reliable than third-party rumors).
      *   *Step 2: Evaluate the Sources.* Are these friends reliable? Do they have a history of drama? Do they like the boyfriend?
      *   *Step 3: Calculate the Cost of Error.*
          *   False Positive (Accuse him, he's innocent): Damages trust, creates conflict.
          *   False Negative (Ignore it, he's cheating): Emotional harm later.
          *   *Goal:* Find a middle path that gathers data without accusing.
      *   *Step 4: Direct Communication (The "Test").* How to ask without sounding accusatory.

  5.  **Address the "Gut Feeling" Aspect:**
      *   Intuition is often pattern recognition. If the gut says "run," it might be picking up on micro-behaviors, not just these rumors.
      *   However, anxiety can mimic intuition. Distinguish between "something feels off about *him*" vs. "I feel anxious about *these rumors*."

  6.  **Formulate Actionable Advice:**
      *   *Don't accuse yet.* 70% + Vague rumor isn't enough for a confrontation about cheating.
      *   *Observe.* Look for changes in his behavior (phone usage, schedule, affection).
      *   *Casual Inquiry.* Ask about his weekend naturally. See if his story aligns with the movie timeline.
      *   *Manage the Friends.* Tell them to stop feeding rumors unless they have proof. It's toxic to the user's mental health.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, rational, non-judgmental.
      *   *Structure:*
