prompt: |-
  Ok so last night me and my housemate Theo got into this whole argument about Bell's theorem that went on for like two hours and neither of us actually "won." He's doing a physics PhD and kept insisting that Bell's theorem just straight-up proves the universe is nonlocal, full stop, "spooky action at a distance, Einstein lost, deal with it." I pushed back because I vaguely remember from a philosophy of physics seminar that its way more subtle than that — that the "locality" assumption Bell actually uses isn't one clean condition, it splits into two seperate pieces, and the experiments only clearly force you to give up one of them while the other one (the one that would actually let you send a signal faster than light) stays completely intact. I think the terms were something like "parameter independence" and "outcome independence," but by that point in the night I couldn't remember which was which or who came up with the split (Jarrett? Shimony? somebody else?).

  So here's what I actually want from you, partly so I can go back to Theo without getting steamrolled. Can you walk me through that distinction properly: what the two conditions actually say, why combining them gives you the factorizability assumption that goes into deriving the Bell/CHSH inequality in the first place, and why its specifically the second one that experiments force us to abandon rather than the first. And then the bit I actually care about — does that asymmetry mean the "nonlocality" here is more like some weird holistic correlation between distant outcomes, rather than one measurement literally reaching over and causing an effect on the other side? I'd also love a bit on how this cashes out differently across interpretations, like whether Bohmian mechanics, many-worlds, and the superdeterminism crowd are all effectively locating the theorem's "bullet" in a different one of Bell's background assumptions rather than all just accepting nonlocality in the same sense. Please don't just give me the standard pop-sci "entanglement is spooky, Einstein was wrong" version — I've had that already, I want the actual structure of the argument.
