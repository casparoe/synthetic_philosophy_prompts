answer: |-
  This is one of the most enduring and vexing problems in Spinoza scholarship, and you have put your finger on the exact nerve of the tension. For a magazine feature, this passage offers a dramatic case study in how even the most radical philosophical systems can buckle under the weight of unexamined cultural assumptions.

  To answer your specific questions: No, the inference from historical absence to natural incapacity does not strictly do the work his system requires, and yes, it does appear to smuggle in a normative standard of "custom as nature" that his metaphysics elsewhere dismantles. However, the biographical context adds a layer of tragedy to the error, suggesting a system cut off before it could correct its own blind spot.

  Here is a breakdown of how to weigh these elements for your feature.

  ### 1. The Conflict with Natural Right (*Potentia* = *Jus*)
  You are correct to identify the friction here. In both the *Theological-Political Treatise* (TTP) and the *Political Treatise* (TP), Spinoza defines natural right not as a moral entitlement, but as a physical reality: *jus* (right) is coextensive with *potentia* (power). A fish has a "right" to swim and eat smaller fish because it has the power to do so.

  If Spinoza were consistent with this definition, the burden of proof would be to demonstrate that women *physically or psychologically lack the capacity* to wield sovereign power. Instead, Spinoza offers an inductive argument from history: "There has never been a case of men and women reigning together... since this is nowhere the case, one may assert with perfect propriety, that women have not by nature equal right with men."

  Logically, this is a gap. In Spinoza's own terms, the fact that something *has not happened* does not prove it *cannot happen*. By Spinoza's own standards, the absence of female rule could simply indicate historical oppression or contingent social arrangements, not a metaphysical limit on women's *conatus* (striving). By treating historical precedent as metaphysical necessity, Spinoza momentarily adopts the very kind of teleological thinking he spends the *Ethics* destroying. He treats "what has been" as "what must be."

  ### 2. The "Passion" Argument: A Stronger (but darker) Consistency?
  However, there is a second layer to his argument that is often overlooked, which might save him from simple inconsistency, though at a moral cost.

  Spinoza shifts from women's incapacity to *men's* passions. He writes that men love women "merely from the passion of lust" and are "ill-disposed... to suffer the women they love to show any sort of favour to others." He concludes that joint rule would cause "great hurt to peace."

  Read charitably, this isn't an argument that women lack reason, but that *men lack the power to be rational around women.* In Spinoza's political science, the goal of the state is to maximize the collective power (*potentia*) of the multitude to exist in peace. If the inclusion of women in the sovereign council triggers jealousies and lusts in men that destabilize the state, then the state *loses power*.

  If right is power, and including women reduces the state's power (due to men's irrationality), then excluding women preserves the state's right. This makes the argument consistent with his system, but it grounds women's exclusion not in their nature, but in men's inability to control their affects. It is a pragmatic calculation of political engineering rather than a declaration of ontological inferiority. For your feature, this is a crucial distinction: Spinoza isn't necessarily saying women *can't* rule; he's saying the men of the 17th century *couldn't handle* ruling alongside them without the state collapsing.

  ### 3. The "Nature" Smuggle
  Despite the passion argument, your suspicion about "smuggling" is well-founded. Spinoza relies heavily on the Amazon counter-example to seal his case. He dismisses the Amazons as a violent anomaly where men were killed or expelled, arguing this proves that harmony is only possible under male rule.

  Here, he conflates "harmony" (a political good) with "nature" (a metaphysical fact). He assumes that because male-dominated societies are more common, they are more "natural." This contradicts his method in the TTP, where he argues that just because prophets *claimed* to speak for God doesn't mean they actually did. He usually separates prevalence from truth. In TP XI, he lets prevalence dictate truth. This suggests that when it came to gender, Spinoza's "reason" was operating within the boundaries of 17th-century Dutch patriarchy, which he treated as a law of physics rather than a social construct.

  ### 4. The Biographical Context: Draft or Doctrine?
  The fact that this is the last thing Spinoza wrote is significant. The *Political Treatise* breaks off mid-sentence in the next section (XI.5). We know he was ill (likely consumption exacerbated by glass dust) and died shortly after.

  Scholars like Susan James and Moira Gatens have argued that we should read this as a "working thought" rather than a settled conclusion. In his earlier work, the *Ethics*, Spinoza argues that emotions are universal and that rationality is not gendered. It is highly probable that had he lived to revise the TP, he might have refined the "experience" argument. He might have recognized that the "experience" of male rule was a self-fulfilling prophecy created by the very exclusion he was justifying.

  For your feature, this biographical detail serves as a poignant reminder of the human limits of philosophy. Spinoza, the philosopher of freedom who was excommunicated for his radical views, died leaving a system that logically demanded freedom but practically denied it to half the human race. It suggests that even the most rigorous minds are embedded in their time.

  ### 5. How to Weigh It in Your Feature
  For a history of arguments on political rights, this passage is invaluable not because it is correct, but because it reveals the mechanism of exclusion.

  *   **The Warning:** It shows how "natural right" arguments can be weaponized. By defining right as power, Spinoza inadvertently created a framework where the *status quo* (men have power) justifies itself (therefore men have the right). It is a cautionary tale about descriptive definitions of right failing to account for structural oppression.
  *   **The Nuance:** It highlights the difference between arguing someone is *incapable* (Aristotle's view) versus arguing that including them is *destabilizing* (Spinoza's view). The latter is a more modern, utilitarian form of exclusion, one that still echoes in arguments against extending rights today (e.g., "they aren't ready," "it will cause unrest").
  *   **The Verdict:** You can confidently state that within Spinoza's own metaphysics, the argument is weak. It relies on an inductive leap from "has not" to "cannot." It treats social custom as natural law. While the "passion" argument offers a internal consistency regarding state stability, it indicts men's irrationality rather than women's incapacity.

  **Suggested Angle:**
  Frame this as the "unfinished business" of rationalism. Spinoza cleared the ground for modern democracy by removing divine right and teleology, but he died before he could clear the ground of patriarchy. The passage stands as a fragment where the new philosophy collided with the old world, and the old world won. It reminds readers that the extension of rights is rarely a single logical deduction, but a struggle to expand our definition of who possesses "power" and "reason."

  In short: The argument does not hold up to his own metaphysical standards, and the fact that it was his last word suggests it was a limitation of the man, not necessarily a final verdict of the system.
