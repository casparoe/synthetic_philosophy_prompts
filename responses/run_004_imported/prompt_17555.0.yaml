answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name], Gary's nephew.

  We are here to mourn a man who sold refrigerators, fixed washers, and somehow convinced my Aunt Ruth to marry him despite her being a union rep and him being… well, him. If you knew Gary, you know that for most of his life, he carried a copy of *Anarchy, State, and Utopia* in his glove compartment right next to the jumper cables.

  To the family, Gary was the guy who'd corner you during tax season to ask if you thought the IRS was coercive. To his grandkids, he was the guy who explained income inequality using basketball players. It was easy to laugh at that. It was easy to think of it as a quirk, a hobby for a smart guy who didn't go to college.

  But Gary took it seriously. And because he took it seriously, he left me with very specific instructions for today. He told me, more than once: "Do not stand up there and tell everyone I *deserved* my success. Do not tell them I earned it because I worked harder than the next guy."

  For a long time, I didn't understand why that bothered him. Most eulogies are about merit. We say the deceased was a hard worker, that they earned their rest, that they were better than the rest of us. Gary hated that. Not because he was humble—he knew he was sharp—but because he didn't think "hard work" was the point.

  He believed that what mattered wasn't whether he was *better* than anyone else, but whether the choices people made were respected. If you bought a stove from him, he didn't think he *deserved* your money because he was virtuous. He thought he was entitled to it because you chose to give it to him, and he delivered the stove. No force, no fraud. Just a free exchange between two people.

  He applied that to everything. He didn't judge your life choices because he didn't think he owned the pattern of your life. He believed in the freedom to make the trade, not the moral scorecard at the end of the game.

  Now, I know there are a few people here—members of his Tuesday night group—who know exactly where I'm going with this. Gary would be disappointed if I didn't get the details right. He often told the story of Wilt Chamberlain. He'd say that if a million people freely choose to give twenty-five cents to watch Wilt play basketball, Wilt ends up with a lot of money. And Gary would argue that distribution is just, not because Wilt is a god among men, but because everyone else chose to put that quarter in the box.

  He knew the argument had holes. He knew the starting point wasn't perfect. But he held onto the core of it: that respecting people's voluntary choices matters more than enforcing a pattern of what people *should* have.

  But here is what the philosophy meant in practice, for those of us who just knew him as Uncle Gary. Because he believed this, he never made you feel small. He never acted like his success made him morally superior to the guy who worked the line at the plant or the cousin who struggled to find a job. He didn't think he "deserved" to be the boss and you "deserved" to be the customer. He just thought you were both adults capable of making your own deals.

  That made him incredibly generous. If you needed a loan, he didn't lecture you on your character. He looked at the agreement. If you needed a fridge, he didn't upsell you. He let you choose. He treated everyone with the dignity of assuming they knew what they were doing.

  So, I am not going to say Gary earned this rest. I'm not going to say he deserved the love we feel for him today because he racked up enough good deeds to merit it.

  Instead, I will say this: We are here voluntarily. We love him freely. No one forced us to be here, and no pattern of justice requires it. We are here because, in the free exchange of life, Gary gave us something we valued, and we give him our memory in return.

  He valued liberty over patterns. He valued process over praise. And in the end, he valued us enough to let us decide for ourselves what he meant to us.

  Rest well, Gary. The argument is over, and for once, I hope you don't feel the need to correct the record. We got it.
