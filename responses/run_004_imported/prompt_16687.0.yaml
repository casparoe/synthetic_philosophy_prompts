          *   *Key Point:* Hills conflates *moral worth* (virtue) with *moral knowledge* (epistemology). You can know $X$ is wrong via testimony even if you aren't a moral saint for knowing it that way.

      *   **Engaging the Autonomy/Right Reasons Argument:**
          *   *Pessimist View:* Acting on deference is heteronomous (not self-governed).
