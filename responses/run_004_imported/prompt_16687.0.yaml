      *   *Strategy 1: The Parity Argument.* If we accept deference in complex empirical domains (physics, medicine), why not morality? The cognitive load is similar.
      *   *Strategy 2: Attacking Hills's "Understanding" Requirement.* Distinguish between *propositional knowledge* (knowing *that*) and *explanatory understanding* (knowing *why*). Testimony transmits the former reliably. The latter is an ideal, not a requirement for knowledge/action.
      *   *Strategy 3: The "Division of Moral Labor".* Just as we have epistemic division of labor, we need moral division of labor.
      *   *Strategy 4: Addressing Autonomy.* Autonomy isn't about doing the reasoning yourself; it's about aligning with the good. If the testifier is reliable, aligning with them aligns you with the good.

  4.  **Drafting the Response - Section by Section:**

