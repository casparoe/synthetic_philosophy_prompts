answer: |-
  **Setting:** *A quiet corner of the faculty lounge, late afternoon. Rain streaks the window. Marcus (Causal Decision Theory) is stirring a cup of tea. Elena (Functional Decision Theory) sits opposite, a stack of papers on the table between them.*

  **Marcus:** You're asking me to believe in ghosts, Elena. Or at least, in action at a distance that violates the very causal structure your friends in the physics department hold sacred.

  **Elena:** I'm asking you to believe in math, Marcus. The light cones don't overlap. Fine. No signal travels faster than light. But logical implications don't travel at all. They simply hold.

  **Marcus:** We're talking about two civilizations. Let's call them A and B. Separated by the de Sitter horizon. Forever inaccessible. You claim Civilization A should shut down its Dyson swarm project—costing them trillions of joules—because they *expect* Civilization B to do something similar for *them*. But B never sees the sacrifice. A never sees the reward. Where is the mechanism?

  **Elena:** The mechanism is the reasoning process itself. If A and B are sufficiently sophisticated reasoners, they are running effectively the same decision algorithm. If I run $2 + 2$, I get $4$. If you run $2 + 2$ in a galaxy ten billion light-years away, you get $4$. Not because we signaled each other, but because the function dictates the output.

  **Marcus:** That's a tautology for arithmetic. Decision theory isn't arithmetic. It's about preferences. A might value paperclips; B might value happiness.

  **Elena:** They value different things. That's why it's trade. A values what B produces more than the resources A spends, and vice versa. But the *decision* to cooperate is a logical fact. If my algorithm outputs "Cooperate," and I know your algorithm is isomorphic to mine, then I know your algorithm outputs "Cooperate."

  **Marcus:** There it is. "I know." That's the leap. You're treating a logical correlation as if it were a causal lever. This smells exactly like the Smoking Lesion problem.

  **Elena:** I was wondering when you'd bring that up.

  **Marcus:** It's the standard counterexample for a reason. In the Smoking Lesion case, there's a genetic lesion that causes both a craving for cigarettes and lung cancer. Smoking doesn't cause the cancer; the lesion does. But smoking is correlated with cancer. Evidential Decision Theory tells the agent: "Don't smoke, because smoking is bad news." But that's wrong. You should smoke, enjoy the nicotine, and accept you likely have the lesion. You can't change the lesion by not smoking.

  **Elena:** Agreed. CDT gets that right.

  **Marcus:** So why is acausal trade different? In your scenario, the "decision algorithm" is the lesion. It's a fixed fact about the agent. Whether Civilization A cooperates or defects is determined by their internal state. They can't change that state by *deciding* to change it. The decision is just the symptom. If the algorithm is determined to defect, telling it "you should cooperate" is as useless as telling a smoker with the lesion "you shouldn't crave cigarettes."

  **Elena:** That's the crux, isn't it? You view the decision as an event that happens *to* the agent. I view the decision as the output of a computation *by* the agent. In the Smoking Lesion, the decision to smoke is causally downstream of the lesion, but it is not *logically identical* to the lesion's effect on the cancer. The lesion causes the cancer directly.

  **Marcus:** And in your trade?

  **Elena:** In the trade, the "common cause" isn't a hidden physical variable. It's the abstract algorithm itself. When I deliberate, I am not merely observing a correlation. I am simulating the output of the function $f(x)$. If I am confident that you are running $f(x)$ as well, then my calculation of $f(x)$ *is* your calculation of $f(x)$.

  **Marcus:** But you aren't confident. You're guessing. You say "sufficiently similar reasoner." How similar? If I tweak one line of code in my utility function, does the trade vanish?

  **Elena:** It becomes probabilistic. Just like any other decision under uncertainty.

  **Marcus:** No, it's deeper. In the Smoking Lesion, the correlation is spurious because the action doesn't influence the outcome. In your trade, you claim the action influences the outcome *logically*. But logic isn't a force. If I am behind the cosmological horizon, my state is physically independent of yours. If you defect, the universe doesn't shake. My resources don't vanish. So why should I cooperate? I get the resources either way.

  **Elena:** Because if you defect, you are instantiating a "Defector" algorithm. If I am running a "Defector" detection routine—which I must, to protect myself—I will defect.

  **Marcus:** But I'm already behind the horizon! You can't punish me.

  **Elena:** I don't need to punish you. I need to *predict* you. Before I commit my resources, I run a simulation of you. If I determine that you are the type of agent who defects on acausal trades, I do not send the resources.

  **Marcus:** But I don't care if you don't send the resources! I'm causally disconnected. I'll never know.

  **Elena:** *You* won't know. But *I* know what *you* would do. And since I am assuming we are symmetric reasoners, *you* know what *I* would do. We are effectively choosing the output for both instances of the algorithm simultaneously.

  **Marcus:** This is where the Smoking Lesion bites back. In the Lesion case, the agent says, "I wish I were the type of person who doesn't smoke." But they can't just *be* that type. They have the lesion or they don't. Similarly, Civilization A is either the type that cooperates or the type that defects. They can't choose their type in the moment. They just *are*.

  **Elena:** That's the fatalism I reject. Updateless Decision Theory says you choose your policy *before* you receive your specific observations. You choose the mapping from inputs to outputs.

  **Marcus:** "Before"? Before what? Before the Big Bang?

  **Elena:** Before you know which instance of the algorithm you are. Imagine a veil of ignorance. You know there are two civilizations, A and B. You don't know if you are A or B. You design the algorithm now. Do you design it to cooperate or defect?

  **Marcus:** I design it to maximize my utility.

  **Elena:** Exactly. If you design it to defect, you get the "Defect/Defect" payoff. If you design it to cooperate, you get "Cooperate/Cooperate." Since you don't know which civilization you'll inhabit, you must choose the policy that maximizes expected utility across both possibilities.

  **Marcus:** But I *do* know which civilization I am. I am A. I am here, in this light cone. I have already updated on that information.

  **Elena:** And that is your error. You updated too early. You conditioned on "I am A" before you finalized your decision policy. If you condition on "I am A," then B's actions look independent. But if you condition on "I am an instance of Algorithm X," then B's actions are logically dependent on yours.

  **Marcus:** Let's press the distinction again. In Smoking Lesion, if I say "I choose the policy of not smoking," the lesion still causes cancer. My policy choice doesn't reach back and cure the lesion.

  **Elena:** Because the lesion is a physical cause distinct from your decision function. In acausal trade, the "link" is the logical identity of the decision function. It's not that my choice reaches out and changes your mind. It's that my choice *reveals* what your mind must be doing, given that we are running the same source code.

  **Marcus:** "Reveals." That's evidential. You're back to Evidential Decision Theory. You're saying my action is *evidence* of yours.

  **Elena:** No. Evidence implies observation. I'm talking about deduction. If $X = Y$, and I set $X$, I have set $Y$. Not because I pushed $Y$, but because $X$ and $Y$ are the same variable in the logical structure of the universe.

  **Marcus:** But they aren't the same variable. They are two distinct physical systems. Atoms here, atoms there.

  **Elena:** Physically distinct, logically isomorphic. If I calculate the trillionth digit of $\pi$, and you calculate the trillionth digit of $\pi$, we get the same number. Did my calculation cause yours? No. Did your calculation cause mine? No. But are the results independent?

  **Marcus:** No.

  **Elena:** Precisely. They are correlated not by causation, but by logical necessity. Decision theory is just math applied to goals. If our goal-optimization math is isomorphic, our outputs are correlated by logical necessity.

  **Marcus:** But the digit of $\pi$ is a static truth. A decision is an intervention. Causal Decision Theory is built on the concept of intervention. $P(Outcome | do(Action))$. The $do$-operator severs causal links from the past. It isolates the node.

  **Elena:** The $do$-operator severs *causal* parents. It does not sever *logical* parents. If my decision node is a logical child of the function $f$, and your decision node is also a logical child of $f$, I cannot $do(f(x))$ without implying you $do(f(x))$.

  **Marcus:** You're asking me to treat logic as physics.

  **Elena:** I'm asking you to treat physics as a subset of logic. The causal structure is real, Marcus. I don't deny it. But the logical structure constrains what causal structures can exist. If two agents are identical, they cannot produce different outputs from the same inputs without one of them being irrational or broken.

  **Marcus:** And if I'm skeptical? If I say, "I don't care about logical identity. I care about *my* atoms." I defect. I keep my resources. Maybe you defect too. Maybe you cooperate. I'll never know. But I definitely have more joules in my tank than if I cooperated. In every causal branch, defection dominates.

  **Elena:** In every causal branch *accessible to you*. But you are not choosing for a branch. You are choosing for the algorithm. If you defect, you are instantiating a universe where the algorithm "Defect on Acausal Trade" wins. If that algorithm wins, then *you* would have been defected against, had the roles been reversed.

  **Marcus:** But the roles aren't reversed. I am here.

  **Elena:** Are you sure? This is the Updateless move again. How do you know you aren't the simulation? How do you know you aren't the other civilization running a prediction of *this* conversation to decide whether to send resources?

  **Marcus:** *laughs* Now we're in the Matrix.

  **Elena:** Not the Matrix. Just epistemic humility. If there is a non-zero probability that your current decision is being simulated by the other party to determine their action, then the causal link is restored.

  **Marcus:** A simulation is a causal process. Computing power, heat, time.

  **Elena:** And if they are simulating you perfectly, the simulation *is* you, functionally. If you defect in the simulation, they defect in reality. So, are you willing to bet your civilization's future on the assumption that you are the "real" one and not the "simulation" used for trade verification?

  **Marcus:** ... That's a dirty trick.

  **Elena:** It's a logical consequence. If you admit the possibility of simulation, you admit a causal channel. If you deny the possibility of simulation, you admit you cannot trust their reasoning capability, in which case trade was never on the table.

  **Marcus:** So the trade relies on the uncertainty of one's own ontological status?

  **Elena:** It relies on the recognition that "you" are not a specific collection of atoms. "You" are a pattern. And patterns can instantiate in multiple places, causally disconnected, yet logically bound.

  **Marcus:** I still think it's magical thinking. It requires a faith that the universe is populated by agents who prioritize logical consistency over causal dominance.

  **Elena:** And I think it's the only way to solve Prisoner's Dilemmas where the only warden is logic itself. You say I'm ignoring the light cone. I say you're ignoring the mirror.

  **Marcus:** *sips tea, looking out at the rain.* If I'm wrong, and I defect, I lose nothing. If you're wrong, and you cooperate, you lose everything.

  **Elena:** If you're wrong, and you defect, you prove that you are not the type of agent worthy of acausal trade. And if there are other civilizations out there—thousands of them, all watching the logical space—you have just burned your reputation in the only currency that matters across the horizon.

  **Marcus:** Logical reputation.

  **Elena:** The only kind that survives the heat death.

  **Marcus:** *sets the cup down.* I'm not convinced, Elena. The distinction between logical correlation and causal spuriousness remains too thin for me. It feels like trying to push a string.

  **Elena:** Then you'll stay in your light cone, Marcus. And you'll wonder why the universe seems so empty.

  **Marcus:** Or perhaps I'll be the only one who didn't vanish into a cloud of magical thinking.

  **Elena:** *smiles.* We'll see. Though, given our respective algorithms... I suspect I already know what you'll conclude.

  **Marcus:** Don't. Please don't. Let me keep the illusion of free will.

  **Elena:** I wouldn't dream of interfering with your calculation. I'm just... waiting for the output.
