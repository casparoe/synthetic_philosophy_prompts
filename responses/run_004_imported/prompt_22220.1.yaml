prompt: |-
  I spent my career at the bench in molecular biology, and since retiring I've been reading a lot of epistemology for fun, which is probably why a case on the grants committee I still volunteer for has been nagging at me more then it should. A renewal proposal came through where three seperate reviewers went over the design and stats and couldn't find a thing wrong with it. Trouble is, the style of experiment it belongs to -- flashy effects from small samples -- just got hammered in a big multi-lab replication effort, and hardly any of the striking results in that mold held up. So the committee's split: one side says the track record of the whole approach has to outweigh any single proposal's specific merits, however careful; the other side says that once a category-wide statistic gets to override your own close look at a specific case, you've basically given up on trusting your own judgment about anything, including your judgment that the replication effort was done properly. I need to circulate a short memo before we reconvene next week that actually lands on fund / reject / fund-with-conditions, gives a rule we could reuse next time, and takes that second worry seriously rather than brushing past it. Can you draft that for me?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired molecular biologist, volunteer grants committee member, reads epistemology for fun. This means the tone should be respectful, intellectually rigorous, precise, and acknowledge the philosophical tension without getting bogged down in jargon.
      *   **The Problem:** A grant renewal proposal looks methodologically sound (3 reviewers found no faults), but belongs to a class of experiments (flashy effects, small samples) that recently failed a major multi-lab replication effort.
      *   **The Conflict:**
          *   Side A: Base rate/track record matters. If the approach is generally unreliable, don't fund it, regardless of specific design.
          *   Side B: Epistemic humility/trust. If we let category-level statistics override case-specific judgment, we undermine our ability to judge *anything* (including the replication study itself). It leads to skepticism paralysis.
      *   **The Task:** Draft a short memo for the committee.
      *   **Requirements:**
          *   Make a recommendation (Fund / Reject / Fund-with-Conditions).
          *   Propose a reusable rule/policy.
          *   Address the epistemological worry (Side B) seriously, not dismissively.

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund.* Ignores the replication crisis data. Risky.
      *   *Option 2: Reject.* Ignores the specific methodological rigor of *this* proposal. Potentially unfair and stifles innovation.
      *   *Option 3: Fund-with-Conditions.* This is the sweet spot. It acknowledges the specific merit (the design is good) but mitigates the base rate risk (the field is shaky). It aligns with modern open science practices (preregistration, larger samples, replication components).
      *   *Decision:* **Fund-with-Conditions.** This bridges the gap. It says "We trust your specific design *enough* to try, but we acknowledge the field's fragility and require safeguards."

  3.  **Address the Epistemological Worry:**
      *   The worry is about "reference class forecasting" vs. "inside view." If we always defer to the base rate, do we ever learn?
      *   *Resolution:* The memo needs to frame the replication data not as a *vetoe* but as a *prior* that shifts the burden of proof. We aren't saying "This is impossible." We are saying "Given the high false-positive rate in this class, extraordinary claims require extraordinary evidence *within the grant period*."
      *   This validates Side B: We are still using our judgment to design the conditions, not just blindly following the replication stats.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the decision. Validate both sides of the argument. Use the user's background (molecular bio + epistemology) subtly to set the tone (rigorous but practical).
      *   **The Core Tension:** Explicitly state the conflict between "Inside View" (specific design) and "Outside View" (field-wide replication).
      *   **The Decision:** Recommend "Fund with Conditions."
      *   **The Conditions:** What makes this safe? Preregistration, sample size justification (power analysis based on replication effect sizes, not original flashy ones), data sharing.
      *   **The Reusable Rule:** Create a policy for future "High-Risk/High-Reward" vs. "Fragile Paradigm" cases. Call it something like "The Base-Rate Adjustment Protocol."
      *   **Addressing the Epistemic Worry:** This is crucial. Explain *why* this doesn't abandon judgment. It uses judgment to calibrate risk, not to abdicate responsibility. We trust the replication study *because* of its design, not just its conclusion, and we apply that same rigor here.
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Tone:**
      *   Avoid being too academic/philosophical (it's a grants committee, not a journal club), but don't dumb it down. The user reads epistemology for fun, so they will appreciate terms like "reference class" or "prior probability" if used correctly.
      *   Keep it concise. It's a memo to busy colleagues.
      *   Ensure the recommendation is actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Fund with Conditions" too vague?
      *   *Fix:* Specify the conditions (preregistration, replication arm).
      *   *Critique:* Did I address the "trust your own judgment" worry?
      *   *Fix:* Add a specific paragraph on "Epistemic Consistency." Explain that using base rates *is* a form of judgment, not a replacement for it.
      *   *Critique:* Is the recommendation too harsh on the PI?
      *   *Fix:* Frame it as strengthening the science, not punishing the PI.

  7.  **Final Polish:** Check for clarity, flow, and ensure all constraints of the prompt are met. (The prompt asks for a memo that lands on a decision, gives a rule, and takes the worry seriously).

      *(Self-Correction on the "Rule"):* The rule needs to be generalizable. "When a specific proposal conflicts with robust meta-data, require mitigation strategies rather than outright rejection."

      *(Self-Correction on the "Epistemology"):* Make sure to acknowledge that the replication study itself was judged on its merits. We aren't blindly believing it; we evaluated it and found it robust. So we aren't abandoning judgment.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Grants Review Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation and Policy Framework regarding Proposal #[ID] and Paradigm Reliability

  **Context**
  We face a genuine tension regarding Proposal #[ID]. The "Inside View" (three independent reviews) confirms the specific experimental design is methodologically sound. However, the "Outside View" (recent multi-lab replication data) indicates that the class of effects this proposal targets has a high false-positive rate and low replicability.

  One faction argues we must honor the specific design; the other argues we must respect the base rate. A third, deeper concern has been raised: if we allow category-level statistics to override case-specific judgment, do we undermine the very epistemic agency required to evaluate science? If we cannot trust our assessment of *this* proposal because of *that* replication study, on what grounds did we trust the replication study itself?

  **Recommendation**
  I recommend we **Fund with Conditions.**

  Outright rejection ignores the genuine methodological improvements in this specific iteration. Unconditional funding ignores the substantial risk that the underlying phenomenon is fragile. A conditional award allows us to act on our specific judgment while hedging against the base-rate risk.

  **Required Conditions**
  1.  **Preregistration:** All hypotheses and analysis pipelines must be preregistered prior to data collection to prevent p-hacking.
  2.  **Power Analysis Adjustment:** Sample size calculations must be based on the effect sizes observed in the *replication* efforts (which are likely smaller/null), not the original "flashy" discovery papers.
  3.  **Internal Replication:** The budget must include resources for a direct internal replication of the key finding within the grant period.

  **Proposed Reusable Rule: The "Base-Rate Adjustment Protocol"**
  For future cycles, I propose we adopt the following guideline for proposals reliant on paradigms with known replication instability:

  > *When a proposal is methodologically sound but relies on a paradigm with demonstrated low replicability, the Committee shall not reject on the basis of the paradigm alone. Instead, funding is contingent on the applicant adopting "High-Fidelity Safeguards" (preregistration, blinded analysis, and power calculations based on conservative effect size estimates).*

  This treats the replication data as a **risk factor** to be managed, rather than a **vetoe** to be enforced.

  **Addressing the Epistemic Concern**
  We must take seriously the worry that deferring to the replication study undermines our own judgment. We are not abandoning our judgment; we are calibrating it.

  We accepted the multi-lab replication study not because it was a "category statistic," but because we judged *its* design (large N, pre-registered, multi-site) to be more robust than the original discovery papers. To be epistemically consistent, we must apply that same standard here. By requiring this proposal to meet the rigorous standards of the replication study (rather than the original discovery), we are exercising our judgment consistently.

  We are not saying, "This specific experiment is impossible." We are saying, "Given the history of this reference class, the burden of proof is higher." This preserves our agency: we are using the external data to inform our priors, not to replace our evaluation.

  **Next Steps**
  I ask the committee to consider this compromise at next week's meeting. It allows us to support innovation without funding fragility, and it establishes a precedent that respects both specific merit and cumulative evidence.

  I look forward to discussing this further.
