prompt: |-
  I'm outlining a novel about a small-town prosecutor deciding whether to charge her own brother with manslaughter, and while researching it I recounted Mencius's story about Shun to two friends -- Renata, a longtime comparative-ethics teacher, and Colin, a barrister -- who ended up in a real argument about it. Context: asked what would happen if Gusou, father of the sage-king Shun, killed a man while Gao Yao served as Shun's minister of justice, Mencius says Gao Yao would simply arrest him, since Shun as ruler wouldn't interfere -- but adds that Shun would then discard the throne like a worn-out shoe, secretly spirit his father away, and live out his days content, the empire forgotten.

  Here is roughly how the argument went. (1) Renata: this is nepotism dressed up as virtue -- an ethics built from relational roles rather than universal rules can't underwrite anything like impartial law. (2) Colin: Shun doesn't corrupt his office, he vacates it; letting Gao Yao arrest his father while he's still ruler, then acting only as a son once he isn't, keeps the roles separate rather than abusing one for the other. (3) Renata: that separation is cosmetic -- no ordinary man's father gets a former emperor's head start, so proximity to power still buys an escape the law grants no one else. (4) Colin: true, but any ethics that takes filial duty seriously will produce something like it, and most modern legal systems concede as much through family-testimony privileges; Mencius at least admits the conflict costs something, instead of pretending law simply wins. (5) Renata: a privilege against being compelled to testify is one thing, helping a murderer flee is another, and admitting the trade-off doesn't change which side of it Mencius lands on; nor is this an isolated case, since Confucius elsewhere says that when a father stole a sheep, the upright son shielded him rather than reporting it.

  Could you adjudicate their exchange move by move? Give your verdict as a JSON object {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>}, with each score an integer from -2 (clearly mistaken) to 2 (clearly right), and briefly justify each one. Then tell me what you think both of them are overlooking, and close with your own view on whether this episode genuinely shows Confucian role ethics to be at odds with impartial rule of law, or whether that's too strong a conclusion to draw from a single hard case.
