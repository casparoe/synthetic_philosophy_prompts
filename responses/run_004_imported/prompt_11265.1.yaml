answer: |-
  [Stand up, take a moment to look at the bride, then the room. Speak slowly.]

  Good evening. For those who don't know me, I'm [Your Name]. I'm a software engineer, and I've had the privilege of being [Bride]'s friend since college.

  We met in our only shared philosophy class. I have a confession to make: I remember almost nothing about the syllabus. I remember the coffee, I remember the stress, and I remember [Bride] explaining to me, with great patience, why my essay was fundamentally confused. She went on to get a PhD. I went on to write code. But that friendship has been the constant variable in my life ever since.

  [Bride] has given me some specific instructions for tonight. She told me that if I use the words "fate," "destiny," or "meant to be," she will visibly wince. And since I value our friendship, I am not going to test that hypothesis.

  For those who know [Bride]'s work, you know why. She doesn't believe we discover truth lying around like a lost set of keys. She believes we *build* it. She believes language isn't a mirror reflecting the world, but a tool we use to make our way through it together. And she has this concept she calls a "final vocabulary"—the set of words we use to describe what matters most to us, the terms we justify our lives by.

  Now, for the family members who might be thinking, "That sounds a bit cold," let me translate.

  To say that love isn't "found" means it isn't something that just happens *to* you. It's something you *do*. It means that [Bride] and [Groom] aren't two puzzle pieces that were pre-cut to fit perfectly. They are two architects who looked at the raw material of the world and decided to build a house together.

  In my line of work, we talk about building systems that are robust, that can handle errors, that iterate and improve over time. And watching these two, I realize that's exactly what this is. A marriage, in [Bride]'s view, isn't about recognizing a pre-existing cosmic truth. It's about the hard, beautiful work of *making* a truth.

  It's the daily choice to use a shared vocabulary. It's agreeing on what "home" means. It's negotiating what "support" looks like when things are hard. It's debugging the misunderstandings without crashing the system.

  I know there are people in this room—[looks toward the philosophy colleagues]—who have spent the last decade happily arguing with [Bride] about whether truth is really just correspondence to reality. I'm not going to try to settle that debate tonight. But I will say this: If you look at the way [Groom] looks at [Bride], the correspondence is pretty damn convincing.

  [Turn to the Groom]
  [Groom], you have joined a community of two. You have stepped into a vocabulary that [Bride] has been refining her whole life. And the most impressive thing I've seen is how you haven't tried to overwrite her code. You've integrated with it. You've added new functions she didn't know she needed. You've made the whole system more resilient.

  [Turn back to the couple]
  There is something profoundly optimistic about this view. If love is something you find, you might worry that you picked the wrong thing. But if love is something you *make*, then you have agency. It means that if the words stop working, you don't throw the project away. You revise the vocabulary. You build a better tool. You keep going.

  [Bride], you taught me that we create our own meaning. Watching you with [Groom], I see that meaning being created in real time. It's not written in the stars. It's written in the way you make coffee for each other, the way you argue and resolve it, the way you show up.

  So, I'd like to propose a toast.

  I won't wish you a "perfect" life, because perfection is a static state, and you two are dynamic. I won't say you were "meant" for this, because you are too smart for that.

  Instead, I will wish you this: May your shared vocabulary always be rich enough to describe your joy. May your tools be strong enough to weather the hard days. And may you never stop building, revising, and creating a truth that belongs entirely to the two of you.

  To [Bride] and [Groom].

  [Raise glass]
