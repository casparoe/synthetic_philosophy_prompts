answer: |-
  Your intuition is excellent. The reason your drafts feel like two men agreeing is that you are likely focusing on their shared *prediction* (abundance is coming) rather than their divergent *diagnoses* of why we aren't there yet. While both men were Cambridge Apostles influenced by G. E. Moore, their applications of that ethics drifted significantly by 1930.

  Here is the breakdown of where the friction lies, how their ethics inform it, and who history has vindicated.

  ### 1. The Divergence: Psychology vs. Power

  Your hypothesis is correct: Keynes frames the obstacle as **internal/psychological**, while Russell frames it as **external/political**.

  **Keynes ("Economic Possibilities for our Grandchildren," 1930):**
  For Keynes, the persistence of toil is a cultural lag. He argues that human beings have been bred for millennia to struggle against scarcity; we are biologically and culturally addicted to "purposeful" exertion. The problem is not that we *can't* afford leisure, but that we don't know *how* to live without toil.
  *   **The Conflict:** He fears *ennui*. He worries that without the pressure of need, the average person will fall into depression or madness.
  *   **The Remedy:** Cultural education. We must slowly relearn how to value "the art of life itself." It is a project of moral evolution, not just legislation.

  **Russell ("In Praise of Idleness," 1932):**
  For Russell, the persistence of toil is a con. He argues that we produce enough for everyone to live well, but the "virtue of toil" is a piece of slave morality perpetuated by the ruling class to keep the masses tired, obedient, and unable to organize.
  *   **The Conflict:** He fears *oppression*. He isn't worried people won't know what to do with free time; he is angry that they are being denied it by people who benefit from their exhaustion.
  *   **The Remedy:** Legislative redistribution. Mandate a four-hour day. Force the redistribution of employment. It is a project of organization and power, not moral evolution.

  **In the Scene:**
  Keynes should sound like a worried headmaster: *"But what will they do, Bertrand? If you take away the struggle, you take away the spine."*
  Russell should sound like a radical prosecutor: *"You worry about their spines, Maynard; I worry about the boot on their necks."*

  ### 2. The Cambridge Ethics: Moore's Shadow

  G. E. Moore's *Principia Ethica* argued that the "good" consists of certain states of consciousness (aesthetic enjoyment, personal affection) and that money is only instrumentally valuable. Both men accept this, but they apply it differently.

  **Keynes: The Aesthetic Elitist**
  Keynes takes Moore's "states of mind" literally and somewhat exclusively. For Keynes, the end goal of economics is to allow the "cultivated" minority to pursue art, love, and contemplation.
  *   **Argumentative Work:** This makes Keynes's vision inherently hierarchical. He assumes that once the economic problem is solved, the masses will need to be guided toward these "higher" states. He doubts the common man has the capacity to generate meaning ex nihilo. His ethics drive his pessimism about human nature.
  *   **In the Scene:** He argues for leisure as a *stage for high culture*.

  **Russell: The Democratic Vitalist**
  By 1930, Russell had moved away from Moore's intense aestheticism toward a broader humanism. He values leisure not just for contemplation, but for happiness, vitality, and the simple joy of existence.
  *   **Argumentative Work:** This makes Russell's vision democratic. He believes the capacity for enjoyment is universal, not restricted to the Apostles. He attacks the work ethic not because it prevents contemplation, but because it prevents *happiness*. His ethics drive his optimism about human potential.
  *   **In the Scene:** He argues for leisure as a *right to happiness*.

  ### 3. The Historical Verdict

  Given that wealth has grown as predicted but the 15-hour week has not materialized, whose diagnosis holds up?

  **Russell is more correct about the Obstacle.**
  Keynes assumed that once basic needs were met, our "absolute wants" would be satisfied and we would naturally choose leisure. He underestimated the capacity of capitalism to manufacture "relative wants" (consumerism). However, the primary reason the 15-hour week didn't happen is structural: gains in productivity were captured as profit or higher consumption rather than reduced hours. The "vested interests" Russell identified (management, capital owners, and a political class dependent on growth) successfully defended the long work week. The "virtue of toil" remains a potent political tool.

  **Keynes is more correct about the Void.**
  However, Keynes's psychological warning was prescient. In sectors where leisure *has* increased (retirement, unemployment, the gig economy), we often see the "ennui" Keynes feared. We have filled the time with passive consumption rather than the "art of life" he envisioned. We solved the economic problem but failed the moral one.

  **Summary for the Novel:**
  If your characters are debating *why* the future hasn't arrived, Russell has the stronger political argument. If they are debating *whether we are ready* for the future, Keynes has the stronger psychological one.

  ### 4. The Ungenerous Line

  To create genuine tension, the line must attack the other's class position or intellectual vanity.

  **Option A (Russell to Keynes):**
  > "You treat the love of money as a moral sickness to be cured by time, Maynard, when it is merely a whip held by men who have no intention of dropping it."

  **Option B (Keynes to Russell):**
  > "You propose a four-hour day, Bertrand, but you haven't explained what on earth a man is to do with the other twenty who isn't simply wait for the next four."

  **Option C (The Cut):**
  If you want the line that cuts deepest regarding their specific Cambridge history and the reality of 1930s England:

  > **Russell to Keynes:** "Your fifteen-hour week is a paradise for the Apostles, Maynard; for the clerk, it is merely five days of unemployment dressed up as a gift."

  **Why this works:** It accuses Keynes of projecting his own elite lifestyle (where leisure is filled with art and conversation) onto the working class, ignoring the reality that for a worker, less work often just means less pay and more anxiety. It challenges Keynes's Moorean assumption that "states of mind" are accessible to everyone equally.
