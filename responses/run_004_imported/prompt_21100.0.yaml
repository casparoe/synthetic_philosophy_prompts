      *   *Key Distinction:* Foundationalism says basic beliefs are *justified* without inference (self-evident, incorrigible). Wittgenstein says hinge commitments are *arational* (neither justified nor unjustified). They are the scaffolding, not the foundation stones.
      *   *Moore vs. Wittgenstein:* Moore treated "Here is a hand" as a piece of *knowledge* that proves the external world. Wittgenstein argues that "Here is a hand" cannot function as knowledge in that context because knowledge requires the possibility of doubt/verification. If it's a hinge, it's not knowledge; it's a rule of the game.

  3.  **Address Question 1: Hinge Epistemology vs. Foundationalism:**
      *   *Foundationalism:* Pyramid structure. Base beliefs support upper beliefs. Base beliefs must be justified (or at least truth-conducive).
      *   *Hinge Epistemology:* Riverbed/Axle structure. Hinges aren't "beliefs" in the standard epistemic sense. They are *enablers* of justification. You don't believe them; you act on them.
      *   *Why a Rival?* Because foundationalism tries to answer skepticism *within* the game of giving reasons. Wittgenstein says skepticism arises from misunderstanding the grammar of the game. Foundationalism seeks a *super-justification*. Wittgenstein says justification *comes to an end*.
