      *   *Apologetics:* The *Pensées* are meant to convert skeptics/libertines. Step 1: Show the misery of man without God (including the instability of justice). Step 2: Show the greatness of man (capacity to know this misery). Step 3: Offer Christ.
      *   *Custom:* Related to the "mystical foundation of authority" (Montaigne influence). Laws are obeyed because they are laws, not because they are inherently just. This stabilizes society but reveals the lack of ultimate grounding.
      *   *Voice:* It is Pascal's voice, but it's a *diagnostic* voice, not a *prescriptive* one. He isn't Thrasymachus (who says justice *is* the advantage of the stronger); Pascal says justice *ought* to be followed, but force *usurps* the title.

