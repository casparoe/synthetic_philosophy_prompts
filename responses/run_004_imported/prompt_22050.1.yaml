      *   *Epistocracy:* Rule by the knowledgeable. Key proponent: Jason Brennan (*Against Democracy*). Core claim: Political authority should be tied to competence/knowledge. Can involve restricted franchise, plural voting, etc.
      *   *Epistemic Democracy:* Democracy is valuable *because* it tends to produce good/correct outcomes. Key proponents: David Estlund (*Democratic Authority*), Hélène Landemore (*Democratic Reason*). Core claim: Democracy has epistemic value (it tracks truth better than alternatives), *but* it must remain democratic (equal voting rights).
      *   *The Crucial Distinction:* Epistemic democrats argue that *democratic procedures themselves* are the best epistemic tool. Epistocrats argue that democratic procedures are epistemically inferior to non-democratic (or less democratic) alternatives.
      *   *User's Assumption:* They see both as prioritizing "correctness" over "equality."
      *   *Reality:* While both care about outcomes (epistemic value), they disagree fundamentally on *how* to achieve those outcomes and the role of equality in legitimacy.

  3.  **Evaluate the User's Framing:**
      *   *Is it "basically right"?* No, it's a significant misreading of the philosophical landscape.
      *   *Why?*
          1.  **Instrumental vs. Intrinsic:** Epistemic democrats (like Estlund) often argue that democratic *equality* is a precondition for the epistemic benefits to work (diversity, inclusion of perspectives). Epistocrats (like Brennan) argue equality hinders epistemic performance.
          2.  **The "None of the Above" Objection:** Estlund specifically critiques epistocracy. He argues that even if experts know better, there is no *publicly acceptable* way to identify them without violating democratic equality. This is the "qualified acceptability requirement."
          3.  **Mechanism:** Epistemic democracy relies on *aggregation* of diverse views (Condorcet Jury Theorem, diversity trumps ability). Epistocracy relies on *selection* of the best views.
          4.  **Legitimacy:** For epistemic democrats, legitimacy comes from the procedure (which happens to be good at tracking truth). For epistocrats, legitimacy comes primarily from the outcome (knowledge), even if the procedure is unequal.

  4.  **Drafting the Response:**
