answer: |-
  You are flattening something important. While your intuition that both camps care about *outcomes* (truth/correctness) rather than just *procedure* (fairness/equality) is correct, framing epistemic democracy as "moderate epistocracy" misrepresents the core philosophical disagreement.

  If you publish that framing, philosophers (and well-read critics) will likely flag it as a category error. Here is the breakdown of why they are rivals, not cousins, and how you can accurately frame this for your piece.

  ### 1. The Shared Premise (Where you are right)
  You are correct that both **Epistocrats** (Brennan) and **Epistemic Democrats** (Estlund, Landemore) reject "proceduralism."
  *   **Proceduralism:** Democracy is good because it treats everyone equally, even if it produces bad outcomes.
  *   **Instrumentalism (Both camps):** Democracy (or any system) is valuable because it produces *good decisions*.

  So, yes, they agree that legitimacy is tied to the quality of decisions. That is the common ground.

  ### 2. The Divergence (Where the framing breaks)
  The split happens on the question: **"What is the best mechanism for tracking truth?"**

  **The Epistocrat (Brennan):**
  *   **Thesis:** Competence is unevenly distributed. Therefore, giving equal weight to unequal competence dilutes the quality of decisions.
  *   **Mechanism:** Filter the input. Restrict the franchise or weight votes by knowledge.
  *   **View of Equality:** Political equality is an obstacle to epistemic performance.

  **The Epistemic Democrat (Estlund/Landemore):**
  *   **Thesis:** While individual competence is uneven, *collective* competence relies on diversity and inclusion. Excluding voices removes necessary information and cognitive perspectives required to solve complex problems.
  *   **Mechanism:** Aggregate the input. Use democratic procedures to harness the "wisdom of crowds."
  *   **View of Equality:** Political equality is a *precondition* for epistemic performance.

  **Why "Moderate Epistocracy" is wrong:**
  Calling epistemic democracy "moderate epistocracy" implies that epistemic democrats *would* restrict the vote if they weren't so worried about PR. In reality, Hélène Landemore argues that restricting the vote makes the system **stupider**, not more moderate. She relies on the "Diversity Trumps Ability" theorem. For her, universal suffrage isn't a moral concession; it's an epistemic necessity.

  ### 3. The "Who Decides?" Problem (Estlund's Knockout Punch)
  David Estlund, in *Democratic Authority*, specifically constructs his theory to block Brennan-style epistocracy. This is crucial for your piece.

  Estlund argues that even if we agree that the knowledgeable should rule, we face the **Identification Problem**:
  *   Who decides who is knowledgeable?
  *   If the knowledgeable decide, it's circular (they pick themselves).
  *   If the ignorant decide, why trust their selection?
  *   Any test used to verify knowledge will be reasonably rejectable by those who fail it.

  Estlund calls this the **"Qualified Acceptability Requirement."** A system is only legitimate if it can be justified to all qualified points of view. Epistocracy fails this test because those excluded by the test will reasonably reject the authority of the testers.

  Therefore, for Estlund, democracy is not a "compromise" with epistocracy; it is the *only* system that satisfies the requirement of being both truth-tracking *and* publicly justifiable.

  ### 4. How to Frame This for Your Tech/VC Piece
  The tech/VC world loves Brennan because it sounds like "meritocracy." They often view epistemic democracy as "political correctness." To make your piece sharper, you should frame this not as a spectrum of intensity, but as a **clash of algorithms.**

  *   **Brennan/Epistocracy = The Expert Algorithm.**
      *   *Logic:* Optimize for signal-to-noise ratio. Filter out the noise (the ignorant).
      *   *Tech Analogy:* Curated feeds, verified users only, admin-only posting.
      *   *Risk:* Echo chambers, bias in who gets verified, systemic blind spots.

  *   **Landemore/Epistemic Democracy = The Crowdsourcing Algorithm.**
      *   *Logic:* Optimize for coverage and error correction. More nodes = better map.
      *   *Tech Analogy:* Open source, Wikipedia, prediction markets, broad beta testing.
      *   *Risk:* Mob rule, slow convergence, vulnerability to demagoguery.

  ### 5. Recommendation for Your Draft
  Do not describe them as sitting on the same spectrum. Instead, describe them as **two competing answers to the same question.**

  *   **Bad Framing:** "Epistemic democracy is just epistocracy with the serial numbers filed off."
  *   **Good Framing:** "Both sides agree that politics should be about getting the right answers. But where Brennan argues that requires restricting the input to the competent, epistemic democrats argue that 'competence' is an emergent property of the collective, not the individual. For the VC set, this is the difference between betting on the 'founder-king' versus betting on the 'network effect.'"

  ### Summary Checklist
  1.  **Acknowledge the overlap:** Both reject pure proceduralism; both care about truth-tracking.
  2.  **Highlight the mechanism:** Epistocracy filters voters; Epistemic democracy aggregates diverse voters.
  3.  **Note the antagonism:** Estlund and Landemore explicitly write *against* Brennan. They are not allies; they are opponents debating the best way to achieve truth.
  4.  **Tech Angle:** Use the "Expert System vs. Neural Network/Crowdsourcing" analogy. It resonates better with your audience than "moderate vs. extreme."

  If you treat them as rivals offering different technological solutions to political decision-making, you'll capture the philosophical nuance without getting bogged down in the jargon.
