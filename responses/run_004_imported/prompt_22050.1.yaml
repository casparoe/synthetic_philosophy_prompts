      *   **Key Distinction 1: The Role of Equality.** Epistemic democrats argue equality *enhances* truth-tracking (Landemore's cognitive diversity). Epistocrats argue equality *dilutes* it.
      *   **Key Distinction 2: The Identification Problem.** Estlund's critique. Who decides who is knowledgeable? If the knowledgeable decide, it's circular. If the ignorant decide, why trust them? Epistemic democrats bypass this by saying everyone gets a say.
      *   **Key Distinction 3: Legitimacy.** Epistemic democracy = Procedure is legitimate *and* truth-tracking. Epistocracy = Outcome is truth-tracking, procedure is secondary.
      *   **Tech/VC Context:** Why does this matter for the user's piece? Tech folks love "meritocracy" (epistocracy). But the philosophical counter-argument (epistemic democracy) isn't just "feel-good equality," it's "equality is a better algorithm."
      *   **Recommendation:** Don't frame them as cousins. Frame them as rivals offering different solutions to the same problem (how to get good decisions).

  5.  **Refining the Tone:**
