      *   **The "Looping Effect" Concept:** Introduce Ian Hacking's concept. It's the perfect academic backing for the user's intuition without invalidating the condition. It explains how being classified changes the person classified.
      *   **Why Marcus Reacted That Way:** Contextualize the stigma. Late-diagnosed adults (especially women) are constantly told they're "not autistic enough" or "just trendy." Marcus is likely defending her against that cultural noise.
      *   **How to Reframe the Argument (The "Repair"):**
          *   Apologize for the impact, not the intent.
