answer: |-
  This is a incredibly nuanced situation, and frankly, it's one of the most interesting debates happening in neurodiversity circles right now. You and Marcus aren't actually arguing about Elena; you're arguing about **philosophy of identity** without realizing it.

  Here is the breakdown of who has the better read, why Marcus reacted so defensively, and how you can explain your position without invalidating Elena.

  ### 1. Who has the better read?
  **You are both right, but you are looking at different layers of the same phenomenon.**

  *   **Marcus is right about the *Ontology* (The Reality):** He is operating from a medical/essentialist model. He believes the neurological reality existed before the name. He is correct that Elena isn't "faking." Her struggles, sensory issues, and social friction were real before she had the word "autism" to describe them. The diagnosis provided relief and explanation.
  *   **You are right about the *Sociology* (The Process):** You are operating from a constructivist/interactionist model. You are observing that once a label is applied, it changes how a person interacts with the world and themselves. This is a documented phenomenon.

  **The Verdict:** Your observation is arguably more sophisticated sociologically, but Marcus's reaction is more protective socially. You noticed that identity is iterative (it changes over time); Marcus heard you saying identity is performative (it's an act).

  ### 2. Why Marcus heard "She's Faking"
  To understand how to fix this, you have to understand why Marcus went to DEFCON 1.

  Late-diagnosed autistic adults (especially women and AFAB people) face a massive amount of gatekeeping. They are constantly told:
  *   "You're too smart to be autistic."
  *   "You make eye contact, so you're not autistic."
  *   "You're just following a TikTok trend."

  When you said, *"Her behavior seems to be adjusting toward the label,"* Marcus likely heard the echo of every skeptic who has ever told Elena she isn't "really" autistic. In his mind, **Authenticity = Static.** If your behavior changes, he fears it implies the underlying condition wasn't real. He is defending Elena against a culture that constantly invalidates her.

  ### 3. The Concept You Need: "The Looping Effect"
  There is a philosophical concept that validates your side perfectly without invalidating Elena. It's called **"The Looping Effect of Human Kinds,"** coined by philosopher Ian Hacking.

  Hacking argues that unlike rocks or viruses, human beings interact with the categories we are put into. When we are classified (e.g., "autistic," "depressed," "refugee"), we learn about that classification, and it changes how we see ourselves and act.
  *   **Example:** Before the concept of "sexual harassment" existed, women experienced the behavior but didn't have a framework to name it or organize against it. Once the label existed, behavior changed (reporting, boundary setting).
  *   **Application to Elena:** Before the diagnosis, Elena suppressed stims because she thought they were "weird." Now, she knows they are a regulatory mechanism. She isn't "becoming" autistic; she is **ceasing to suppress her autism.** However, she is also likely adopting community norms (language, specific types of stimming) she learned online. That *is* an adjustment toward the label.

  ### 4. How to Explain Your Side to Marcus
  You need to reassure him that you believe Elena's neurology is real, while maintaining your point that the *expression* of that neurology is shaped by community.

  **Step 1: Validate his protection.**
  > "Marcus, I've been thinking about our argument. I realize how I sounded, and I want to be clear: I absolutely do not think Elena is faking. I know her struggles before the diagnosis were real. I know you're protective of her because people give late-diagnosed women a hard time, and you're right to defend her validity."

  **Step 2: Introduce the nuance (The Looping Effect).**
  > "My point wasn't that the autism isn't real. My point was that *any* major identity shift changes how we behave. Think of it like this: If someone grows up in a culture where they aren't allowed to speak their native language, and then they move to a place where it's celebrated, they're going to start speaking it more. They aren't 'becoming' that culture overnight, but their behavior adjusts to fit the safety they now have."

  **Step 3: Distinguish between 'Cause' and 'Expression'.**
  > "I think the diagnosis didn't *cause* her autism, but it did change how she *expresses* it. She's unmasking. But she's also learning new ways to be autistic from the online community. Both things can be true: She was always autistic, AND she is currently learning how to inhabit that identity in a way she couldn't before. I'm interested in that process, not questioning her reality."

  ### 5. Key Phrases to Use (and Avoid)

  *   **Avoid:** "She's adjusting to the label." (Sounds like she's conforming to a trend.)
  *   **Use:** "She's integrating the diagnosis." (Sounds like internal healing.)
  *   **Avoid:** "The category is shifting." (Sounds like the diagnosis is fake.)
  *   **Use:** "The understanding of autism is expanding." (Sounds like progress.)
  *   **Avoid:** "She's stimming more because she knows the word."
  *   **Use:** "She feels safe enough to regulate herself openly now."

  ### Summary
  Marcus is looking at **truth** (was she autistic before? Yes). You are looking at **trajectory** (how does the label change the person?).

  You can tell Marcus: *"I'm not saying the diagnosis created the condition. I'm saying the diagnosis created the safety for her to stop hiding the condition. That looks like a change in behavior, but it's actually a change in environment."*

  If you frame it as **unmasking** rather than **adjusting**, you keep your sociological insight without triggering his defensiveness about her validity.
