  *(Self-Correction Note)*: Make sure I don't let Marcus win by default. Carroll's argument is subtle, but Page's is standard scientific practice. Elena needs to make the "reductio" point strongly: If we don't reject BB theories, we accept that we are probably BBs, which is absurd. Marcus must counter that "absurdity" is the point—it's not absurd, it's *unusable*.

