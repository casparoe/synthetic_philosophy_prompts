answer: |-
  This is a great question, and it cuts to the heart of why anthropic reasoning remains so contentious in formal epistemology. However, there is a critical premise in your setup that needs to be corrected before addressing why SIA retains defenders.

  You wrote: *"SSA's the assumption that doesn't saddle you with the doomsday argument in the first place."*

  **This is actually the inverse of the standard consensus.** The Doomsday Argument (DA) is derived *directly* from SSA. SIA was largely popularized (specifically by Dennis Dieks and later analyzed by Bostrom) specifically because it **cancels out** the Doomsday Argument.

  Here is the breakdown of why the literature hasn't abandoned SIA, why your intuition about the "safe default" might be leading you astray, and how this impacts your x-risk chapter.

  ### 1. The SSA/Doomsday Link
  The Doomsday Argument relies on the idea that you should reason as if you are a random sample from the set of all observers who will ever exist (SSA).
  *   **SSA:** Probability of being observer $n$ is $1/N$ (where $N$ is total observers).
  *   **Implication:** If you find yourself with a relatively low birth rank (e.g., the 100 billionth human), SSA suggests it is more probable that the total number of humans ($N$) is small (e.g., 200 billion) rather than vast (e.g., $10^{20}$), because being in the first 100 billion is much more likely in the small-total scenario.
  *   **Result:** SSA forces a Bayesian update toward early extinction.

  **SIA counters this.** SIA weights hypotheses by the number of observers they contain.
  *   **SIA:** Prior probability of a hypothesis is proportional to $N$.
  *   **Math:** The $N$ from the SIA prior cancels the $1/N$ from the SSA sampling probability.
  *   **Result:** SIA neutralizes the Doomsday Argument.

  If your goal is to avoid the Doomsday Argument's pessimistic conclusion, **SIA is the tool that does that, not SSA.** If you adopt SSA as your default, you are explicitly accepting the premises that generate the Doomsday Argument.

  ### 2. Why Defend SIA? (The "Adam & Eve" Problem)
  If SIA leads to the Presumptuous Philosopher (overconfidence in vast universes), why keep it? Because SSA leads to the **Adam & Eve** problem (paranormal causal powers).

  *   **The Case:** Under SSA, if you define your reference class narrowly enough (e.g., "people who have ever lived"), your existence as an early observer can probabilistically imply that certain future events *must not* happen (otherwise the reference class would be larger, diluting your probability of being early).
  *   **The Absurdity:** In extreme formulations, SSA implies that a couple could reason that they are unlikely to be the progenitors of a vast humanity, and therefore conclude with high probability that their conception will fail. It suggests indexical facts can influence non-indexical outcomes (or at least force updates that look like backward causation).

  **Pro-SIA Argument:** Many epistemologists (e.g., Radford Neal, Ken Olum) argue that the Presumptuous Philosopher is a "bullet" worth biting compared to the causal anomalies of SSA. They argue SIA is simply standard Bayesian updating on the indexical evidence "I exist." To ignore the number of observers in your prior is to ignore relevant evidence.

  ### 3. The "No Free Lunch" Theorem
  Bostrom's conclusion in *Anthropic Bias* is essentially that there is no cost-free assumption.
  *   **SSA:** Avoids Presumptuous Philosopher $\rightarrow$ Accepts Doomsday Argument + Adam & Eve causal anomalies.
  *   **SIA:** Avoids Doomsday Argument + Adam & Eve $\rightarrow$ Accepts Presumptuous Philosopher.

  The reason papers still defend SIA is that for many applications (especially cosmology and certain x-risk models), the **Doomsday Argument is viewed as the bigger bullet to bite.** If you are forecasting x-risk, SSA effectively "hard-codes" a high probability of near-term extinction regardless of empirical evidence about AI alignment or biosecurity, simply based on birth rank. Many researchers find this methodologically unacceptable for forecasting.

  ### 4. Modern Developments for Your Dissertation
  Since you are writing on x-risk forecasting, simply choosing SSA or SIA might be outdated. The field has moved toward dissolving the dichotomy:

  1.  **Full Non-indexical Conditioning (FNC):** Proposed by Radford Neal. This suggests conditioning on all your evidence, including the specific details of your existence (your memories, physical state), rather than just "I am an observer." This often yields results similar to SIA but avoids some of the reference class ambiguity.
  2.  **Decision-Theoretic Approaches (UDT/FDT):** If your x-risk forecasting is tied to policy (e.g., "How much should we spend on mitigation?"), anthropic *probabilities* might be the wrong tool. Updateless Decision Theory suggests acting as if you control the output of the algorithm that determines your actions across all copies. This sidesteps the "who am I?" question in favor of "what should I do?"
  3.  **Reference Class Flexibility:** Some argue the problem isn't SSA vs. SIA, but the reference class. If the reference class is "observers in identical epistemic situations," both SSA and SIA converge.

  ### Summary for Your Chapter
  If you default to SSA to avoid the Presumptuous Philosopher, you must explicitly address why you are accepting the Doomsday Argument (which implies a high prior on near-term extinction independent of empirical risk factors).

  Most contemporary papers defend SIA not because they love the Presumptuous Philosopher, but because they view **SSA's causal anomalies and the Doomsday Argument as more damaging to rational forecasting.**

  **Recommendation:** Don't treat SSA as the "safe default." Treat it as a specific commitment to the Doomsday Argument. For x-risk forecasting, you might argue that **SIA is the more conservative assumption regarding empirical risk factors**, as it prevents anthropic reasoning from overwhelming empirical evidence about AI or bio-threats.

  *(Key citations to check: Bostrom 2002 "Anthropic Bias", Grace 2010 "Anthropic Reasoning and the Doomsday Argument", and recent work by Katja Grace on AI timelines and anthropics.)*
