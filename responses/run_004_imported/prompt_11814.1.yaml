      *(Self-Correction on Move 3)*: Sasha's point in (3) is actually a specific philosophical move known as "biting the bullet." She is admitting SSA has a bullet (DA) but claiming SIA's bullet (PP) is bigger. Is this a "better" move? It keeps the conversation going, but logically it's weaker than Marcus's structural attack in (4). I will characterize it as a pragmatic retreat that sets her up for the rebuttal in (4).

