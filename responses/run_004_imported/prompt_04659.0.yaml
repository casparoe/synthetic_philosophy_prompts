          *   *Analysis:* This is a standard "strong" reading of §258. The core point is about the *normativity* of meaning. Without a distinction between *seeming* right and *being* right, meaning collapses. However, does this prove the *item* doesn't exist, or just that the *naming* fails? Kayla jumps to "no real private item."
      *   **Move 2 (Marcus):** Focuses on §304. Claims Wittgenstein denies sensations don't exist. He denies private *ostensive definition* fixes meaning. Sensation is real, but public criteria fix the word's meaning.
          *   *Analysis:* This is the "moderate" or "grammatical" reading. §304 explicitly says, "We are not denying the existence of sensations." Marcus is textually accurate here. He distinguishes ontology (do pains exist?) from semantics (how does 'pain' get meaning?).
      *   **Move 3 (Kayla):** Focuses on §293 (Beetle-in-the-box). If the object doesn't matter to the language-game, insisting it exists is a distinction without a difference. Calls this eliminativism.
          *   *Analysis:* This is a common inference from the Beetle analogy. If X plays no role in the grammar, positing X is metaphysically idle. Kayla pushes Marcus's distinction to the breaking point. Is it eliminativism or quietism?
      *   **Move 4 (Marcus):** Counters §293 with the famous line §304: "not a something, but not a nothing either." Claims the point is about meaning-fixing (semantics), not ontology.
          *   *Analysis:* Marcus leans on the most famous quote in this section. He maintains the semantic/ontological distinction. This is the standard "Baker & Hacker" defense against eliminativist readings.
