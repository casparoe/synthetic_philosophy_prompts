      *   **Move 6 (Marcus):** Rejects Kripke. Cites Baker & Hacker. Claims "Kripkenstein" is alien to the text. Can't use Kripke to settle what PI shows.
          *   *Analysis:* This is a methodological objection. The Baker & Hacker vs. Kripke debate is legendary. Marcus is right that you can't use a controversial commentary to settle the text's meaning, *but* Kayla is right that the Rule-Following considerations are contextually relevant to the PLA.

