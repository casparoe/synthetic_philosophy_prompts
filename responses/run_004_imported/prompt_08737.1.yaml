prompt: |-
  Random one from the science-journalism side of my job: I'm one of the judges for a mid-size prize that covers long-form science and ideas writing, and this year's shortlist has thrown up an annoying pair of finalists. Both wrote big features built around a not-yet-peer-reviewed result — one on a room-temperature superconductivity claim, one on an exoplanet biosignature claim — going further out on a limb than most science desks would normally risk, with roughly the same level of hedging and source-checking at the time each piece ran. Eighteen months on, one of those results has been independantly replicated and is being treated as a huge deal; the other quietly fell apart once other labs couldn't reproduce it. Half the judging panel wants to just give the prize to the writer who's bet paid off and drop the other from contention; the other half thinks that rewards an outcome neither writer had any way of controlling for, and that we should be scoring the journalism as it stood at publication, not how the science happened to shake out later. Can you draft the short memo I'll put to the full panel before we vote next week — an actual recommendation, not a fence-sit — that takes the "reward what worked" camp seriously instead of just waving it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Judge for a mid-size science/ideas writing prize.
      *   **Task:** Draft a short memo to the full judging panel before a vote.
      *   **Situation:** Two finalists wrote features on unpeer-reviewed claims (RT superconductivity, exoplanet biosignature). Both had similar hedging/sourcing *at the time*. 18 months later, one was replicated (success), one debunked (failure).
      *   **Conflict:** Half the panel wants to reward the "correct" prediction (outcome-based). Half wants to judge the journalism *at the time of publication* (process-based).
      *   **Constraint:** Must take a stance (actual recommendation, no fence-sitting). Must take the "reward what worked" camp seriously (don't just dismiss them).
      *   **Tone:** Professional, persuasive, nuanced, authoritative but collegial.

  2.  **Determine the Stance:**
      *   The prompt asks me to draft the memo *I* will put to the panel. It implies I need to choose a side.
      *   *Option A (Outcome-based):* Award the winner whose science held up.
          *   *Pros:* Aligns with public perception of "truth," rewards accuracy in hindsight.
          *   *Cons:* Punishes good journalism for bad luck/science's messy process, encourages hindsight bias, discourages risky reporting on emerging science.
      *   *Option B (Process-based):* Award based on the quality of reporting *at the time*, regardless of outcome.
          *   *Pros:* Aligns with journalistic ethics, encourages covering breaking science without fear of retroactive punishment, focuses on craft.
          *   *Cons:* Can feel abstract, ignores that "truth" matters in science journalism.
      *   *Decision:* As a science journalism prize, the core mission is usually to evaluate the *journalism*, not the *science*. If we judge based on scientific outcome, we become a science prize, not a writing/reporting prize. Furthermore, judging based on outcome creates a perverse incentive (only cover safe bets or wait for consensus). Therefore, the stronger ethical and professional argument lies with **Option B (Process-based)**.
      *   *Challenge:* I must take the "outcome" camp seriously. I can't just say "they are wrong." I need to acknowledge why their intuition feels right (truth matters) but explain why it's the wrong metric for *this* prize.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the situation. Validate the split in the room.
      *   **The Core Argument (The "Why"):**
          *   Acknowledge the appeal of the "outcome" argument (truth is the goal).
          *   Pivot to why journalism prizes differ from science prizes.
          *   Highlight the "hindsight bias" risk.
          *   Emphasize the incentive structure (what behavior do we want to encourage?).
      *   **The Recommendation:** Clearly state the vote recommendation (Judge both on merits at publication; if tied, split or flip a coin, but do not penalize the 'wrong' one).
      *   **Closing:** Reiterate the mission of the prize.

  4.  **Refining the Argument (Taking the "Outcome" Camp Seriously):**
      *   Instead of saying "You're wrong to care about truth," say "You are right that truth is our north star, *but*..."
      *   Acknowledge that science journalism has a unique relationship with truth compared to political journalism.
      *   Admit that the "successful" piece *feels* better in hindsight.
      *   Counter-argument: If we penalize the "failed" piece, we are punishing the reporter for the failures of *scientists*, not the failures of *reporting*. Did the reporter oversell? The prompt says "roughly the same level of hedging." So the reporting was equal.

  5.  **Drafting - Tone Check:**
      *   Needs to sound like a senior colleague speaking to peers.
      *   Not condescending.
      *   Firm but open to discussion (it's a memo before a vote, not a decree).
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm ignoring the "outcome" team. I need to explicitly validate their concern about credibility.

  6.  **Final Polish:**
      *   Check word count (keep it "short memo").
      *   Ensure the recommendation is unambiguous.
      *   Ensure the specific examples (superconductivity vs. biosignature) are mentioned to ground the discussion.

  7.  **Final Review against constraints:**
      *   Actual recommendation? Yes (Vote for process).
      *   Take "reward what worked" seriously? Yes (Acknowledged in the second paragraph).
      *   Tone appropriate? Yes.

  *(Self-Correction Note)*: Wait, if I recommend they *both* stay in contention, how do I break the tie if the panel is split? The prompt says "Half want to give to the winner... half want to score at publication." If I recommend scoring at publication, I am effectively siding with the second half. I need to make sure the recommendation is clear: *Judge the work as it stood.* This implies the "failed" science piece should not be penalized. If the writing quality is equal, they should be treated equally. I will recommend we evaluate them on equal footing based on the text at publication, which effectively protects the "failed" writer from penalty.

  Let's refine the recommendation: "We must evaluate the journalism, not the lab results." This means if the writing/reporting quality was equal, they deserve equal standing. I will recommend we do not let the scientific outcome break the tie.

  8.  **Finalizing the Text:** (Proceeding to generate output based on these thoughts).

      *   *Subject Line:* Needs to be clear.
      *   *Opening:* Set the stage.
      *   *The "Outcome" Argument:* Validate it. It feels intuitive.
      *   *The Pivot:* Why it's dangerous for journalism.
      *   *The Recommendation:* Specific instruction on how to vote.
      *   *Closing:* Mission statement.

      *(Wait, one more nuance)*: The prompt asks me to take the "reward what worked" camp seriously *instead of just waving it off*. I need to make sure I don't just dismiss them. I will frame their view as "protecting the prize's credibility regarding truth," which is a valid concern, before explaining why the *process* view protects it more in the long run.

      *Okay, ready to write.*
answer: |-
  **TO:** The Judging Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Finalist Evaluation Criteria: Process vs. Outcome

  Team,

  As we prepare to vote next week, I want to address the impasse regarding our two finalists who reported on unverified scientific claims (the room-temperature superconductor and the exoplanet biosignature). We are split between those who believe the prize should reflect the eventual scientific validity of the claims, and those who believe we must judge the journalism as it stood at publication.

  This is a genuine dilemma, and I want to start by validating the position of my colleagues who favor the "outcome-based" approach. Your intuition is correct: in science journalism, truth is not just a goal; it is the product. When we award a piece that turns out to be scientifically wrong, we risk aligning our prize with misinformation, even inadvertently. There is a legitimate concern that treating a debunked claim as "prize-worthy" undermines our credibility with the scientific community we aim to serve. It feels intuitively right to reward the reporter whose bet on the truth paid off.

  However, after reviewing the texts and the timeline, **I recommend we reject the outcome-based metric and evaluate both pieces strictly on the quality of reporting and hedging present at the time of publication.**

  Here is why we cannot adopt the "reward what worked" standard, even though it feels safer:

  1.  **We are judging journalism, not science.** If we penalize a writer because a peer-review process failed or a replication study collapsed 18 months later, we are punishing them for the work of *scientists*, not the work of *reporters*. Both writers applied the same level of scrutiny, sourced the same way, and hedged their claims similarly. To score them differently now is to introduce hindsight bias into our rubric.
  2.  **The Incentive Structure.** If we establish that a writer's eligibility for this prize depends on future replication, we create a perverse incentive. We signal to journalists that they should avoid covering cutting-edge, unverified science until consensus is reached. This discourages the exact kind of ambitious, timely reporting we aim to promote. It encourages "safe" journalism that waits for the press release rather than interrogating the pre-print.
  3.  **The "Luck" Factor.** Scientific truth is often non-linear. A result can be valid but fail replication due to methodological nuances, or invalid but pass initial checks due to systematic error. Tying our prize to the volatility of the scientific method makes our standards unpredictable.

  **My Recommendation:**

  We should treat both pieces as equal contenders based on the text as published. If the writing and reporting quality are indistinguishable, I propose we either award them jointly or flip a coin. We must not penalize the writer whose story was scientifically sound at the time but later retracted by the community.

  Let's reward the rigor of the questioning, not the luck of the lab results.

  See you at the vote.

  [Your Name]
