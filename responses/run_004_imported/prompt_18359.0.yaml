          *   *Contact Tracer:* Specific sequence (broken air handler, long toast, one super-spreader guest) -> Contingent/Specific explanation. Unrepeatable.
      *   **Constraint:** Editor wants "one clean cause."
      *   **Question:** Do I have to choose? Can both be right? How should this shape the writing?

  2.  **Evaluate the Scientific/Epistemological Validity:**
      *   *Can both be right?* Yes, absolutely. This is a classic "necessary vs. sufficient conditions" or "proximate vs. ultimate cause" scenario in epidemiology.
      *   *The Epidemiologist's view:* Focuses on *risk factors* and *population-level probability*. (Why was this setting conducive to transmission?)
      *   *The Contact Tracer's view:* Focuses on *transmission chains* and *individual-level mechanics*. (How did the virus actually move from person A to person B?)
