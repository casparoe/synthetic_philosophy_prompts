      *   *Opening:* Validate their intuition. The disjunction problem is exactly why they are worried.
      *   *Section 1: The Teleosemantic Pitch.* Explain how Millikan/Neander would handle the "BB Pellet." It's about *Normal Conditions* and *Proper Function*. The content is what the system was selected to correlate with.
      *   *Section 2: The Weakness (Indeterminacy).* Why this might not be "clean." Selection doesn't carve nature at the joints perfectly. Was it selected for "worms" or "calories"?
      *   *Section 3: What's at Stake for the Manuscript.*
