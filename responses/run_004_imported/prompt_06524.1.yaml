      *   Acknowledge the Ewert/Toad context? Check.

  9.  **Final Output Structure:**
      *   Introduction: Solidarity with the user's dilemma.
      *   The Teleosemantic Move: How it handles the BB pellet (Proper Function).
      *   The Remaining Itch: Why it's not perfectly clean (Indeterminacy of Selection).
      *   The Real Stake: Mechanism vs. Agency (The "Responds" vs. "Detects" debate).
