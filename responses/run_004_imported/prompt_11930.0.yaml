      *   *Core Argument 4: Hacking's Actual Stance.* This is crucial. Hacking wasn't a "debunker." He was a "historical ontologist." He believed the *people* are real, the *suffering* is real, but the *way we carve it up* changes the people. He opposed the idea that this makes the suffering "fake."
