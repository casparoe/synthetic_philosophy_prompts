answer: |-
  Good evening, everyone. For those who don't know me, I'm a senior on the Ethics Bowl team, and like many of you, I've spent the last few years trying to figure out what it means to be a "good person" according to [Coach's Name].

  For the parents in the room: Ethics Bowl is a bit like debate, but instead of trying to crush the other team, you get points for being nice to them. It's weird. But the core of what we do revolves around a specific philosophical problem that [Coach's Name] was obsessed with. It's called the debate between "Conciliationism" and "Steadfastness."

  Here's the translation: Imagine you and a friend are equally smart and have the same information. But you think Action A is right, and they think Action B is right.
  Conciliationism says: You should probably meet in the middle. Lower your confidence. Be humble.
  Steadfastness says: No. If you've done the work, you hold your ground. You don't shift your credence just because someone disagrees.

  For twenty years, [Coach's Name] has been Captain of Team Steadfast.

  She taught us that ethics isn't about popularity. It's about conviction. If you believe something is just, you don't concede it just because a judge raises an eyebrow. And honestly? That was sometimes frustrating. There were tournaments where a judge would give us feedback that was clearly wrong, and we'd look at her, hoping for some epistemic humility. And she would just dig in.

  Which brings me to the great irony of her coaching career.

  [Coach's Name], you spent hundreds of hours lecturing us on Bayesian reasoning. You told us, over and over, that a rational agent must "update their priors" when presented with new evidence. You taught us that refusing to change your mind in the face of data is intellectually dishonest.

  And yet, your own prior regarding your own correctness appears to have been fixed at one hundred percent since 2004.

  *(Pause for laughter)*

  We love you for it. Because while that stubbornness was annoying in the moment, looking back, I realize what you were actually doing. You were modeling integrity.

  In a world that tells teenagers to just go with the flow, to conciliate, to apologize for taking up space, you taught us that it is okay to be steadfast. You taught us that if we have done the reading, if we have built the argument, and if we know in our gut that something is right—we don't flinch.

  You were steadfast in defending us to judges. You were steadfast in fighting for this program for two decades. And you were steadfast in believing that high schoolers are capable of grappling with the hardest questions in the human experience.

  So, to the Conciliationists in the room: Maybe we should meet in the middle. But to the Steadfast: We stand firm.

  [Coach's Name], thank you for never updating your priors on us. We wouldn't be here if you had.

  To [Coach's Name]!
