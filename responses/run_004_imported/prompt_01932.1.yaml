answer: |-
  You and Priya have stumbled upon a famous problem in social choice theory and legal philosophy. You aren't missing anything obvious, and neither is she. What you are experiencing is a classic instance of the **Doctrinal Paradox** (also known as the **Discursive Dilemma**).

  This paradox occurs whenever a group makes a collective decision based on multiple premises (or conditions) that logically lead to a conclusion. As you've discovered, voting on the premises individually can yield a different result than voting on the conclusion directly.

  Here is a breakdown of why this happened, why it matters, and how a committee like yours should principledly resolve it.

  ### 1. The Mechanics of the Paradox
  To see why the math works this way, look at the coalitions within your committee:

  *   **You:** Vote **Yes** on Rule Violation, **Yes** on Material Advantage. (Logical Conclusion: **Overturn**)
  *   **Priya:** Vote **Yes** on Rule Violation, **No** on Material Advantage. (Logical Conclusion: **Do Not Overturn**)
  *   **Marcus:** Vote **No** on Rule Violation, **Yes** on Material Advantage. (Logical Conclusion: **Do Not Overturn**)

  **The Premise-Based Vote:**
  *   Did he break the rule? **Yes** (You + Priya).
  *   Did it matter? **Yes** (You + Marcus).
  *   *Result:* Both conditions met -> **Overturn.**

  **The Conclusion-Based Vote:**
  *   Should we overturn? **No** (Priya + Marcus).
  *   *Result:* **Do Not Overturn.**

  The paradox arises because the "Majority" is not a stable group. The majority for the first question is different from the majority for the second question. There is actually **no majority** of the committee that supports overturning the result (only you do), yet there **is a majority** that supports every logical requirement necessary to overturn the result.

  ### 2. The Philosophical Divide
  You and Priya are advocating for two different theories of collective decision-making.

  **Priya's View: Conclusion-Based Voting**
  Priya argues that the direct vote reflects the "will of the committee." Her logic is democratic: if two out of three people do not want to punish Jordan, punishing him feels illegitimate. This approach prioritizes the **outcome** and ensures that no decision is enforced unless a majority of the members actually support that specific enforcement.
  *   *Pros:* Prevents enforcing a penalty that most members oppose; reflects the aggregate judgment of the group.
  *   *Cons:* It can render the bylaws meaningless. If members can vote based on their desired outcome rather than the criteria, the rules become suggestions rather than constraints.

  **Your View: Premise-Based Voting**
  You argue that the bylaws establish a logical formula: *If A and B, then C.* If the committee agrees on A and agrees on B, logic dictates C. Your concern is the **rule of law**. If you ignore the premise vote, you allow committee members to hide their reasoning. (For example, Marcus might actually think the advantage was material, but votes "No Overturn" simply because he likes Jordan. Premise voting forces him to go on record about the specific criteria.)
  *   *Pros:* Ensures consistency, transparency, and adherence to the written rules; prevents "outcome voting" where members ignore criteria to get a result they like.
  *   *Cons:* Can lead to a decision (Overturn) that no single majority coalition actually wants, which can cause social friction (as you are seeing now).

  ### 3. Which Approach is "Correct"?
  There is no mathematical answer, but there is a **contextual** one. Political scientists and legal scholars generally agree on the following distinction:

  *   **Legislative/Political Bodies** (e.g., a city council deciding on a new park) usually use **Conclusion-Based Voting**. The goal is to represent the will of the constituents/members.
  *   **Adjudicative/Legal Bodies** (e.g., a court, a tenure committee, or a fantasy football competition committee) usually use **Premise-Based Voting**. The goal is to apply existing rules consistently, regardless of personal preference.

  **Why Premise-Based is likely better for your League:**
  You are not a legislature creating new rules; you are a judiciary interpreting existing bylaws. Your commissioner set up the committee specifically to avoid arbitrary rulings.
  *   If you adopt Priya's method, the two-part test in your bylaws becomes a "sham." A member could vote "No" on the final outcome simply because they dislike the penalty, even if they admit the rules were broken. This erodes the integrity of the league's rules.
  *   By voting on the premises, you force every member to justify their position according to the *league's standards*, not their personal feelings.

  ### 4. How to Resolve This Going Forward
  Since this is a fantasy league among friends, preserving the friendship is as important as preserving the rules. However, allowing the voting method to dictate the result ad hoc is unsustainable. Here is a principled way to fix it:

  **1. Codify the Voting Procedure**
  You need to amend your committee's operating procedure (not necessarily the league bylaws) to specify *how* you vote. You should explicitly adopt the **Premise-Based Approach**.
  *   *Reasoning:* This aligns with the purpose of a "competition committee." It ensures that the bylaws drive the decision, not the mood of the committee.
  *   *Caveat:* You must acknowledge that this means sometimes you will enforce a penalty that 2/3 of the committee personally wouldn't have chosen. That is the burden of being a judge rather than a voter.

  **2. The "Reasoned Opinion" Compromise**
  To address Priya's concern that the direct vote reflects the "true will," require that when the votes diverge (as they did here), the committee issues a written explanation.
  *   In this case, the ruling would be: *"The win is overturned. Although only one member voted to overturn directly, a majority found the rule was broken, and a (different) majority found the advantage was material. Per our bylaws, these findings compel the overturn."*
  *   This validates Priya's observation (that the direct will was against it) while upholding your principle (that the rules require it).

  **3. Addressing the Specific Case**
  For *this* specific dispute, since you have already voted and the tension is high:
  *   If you stick to the Premise vote (Overturn), you uphold the integrity of the bylaws but risk alienating Priya and Marcus.
  *   If you accept the Direct vote (No Overturn), you keep the peace but establish a precedent that the bylaws can be bypassed by framing.
  *   **Recommendation:** Given this is the first time this has happened in eight years, and the goal is fun among friends, you might consider **voiding the vote** and ruling in favor of the status quo (No Overturn) *this one time*, but explicitly stating in writing: *"We are denying the protest based on a direct vote, but we acknowledge this creates a paradox with the bylaws. Moving forward, we are formalizing that Premise-Based voting shall govern all future disputes to ensure rule consistency."*

  ### Summary
  You are not missing anything. This is a fundamental snag in collective reasoning. However, for a body tasked with enforcing rules rather than making policy, **your intuition is the more legally sound one.** The rules should drive the outcome, not the other way around. If the committee wants to avoid overturning a win in the future, they should vote "No" on one of the premises, not on the conclusion.

  Tell Priya she's right about the *politics* (most people don't want the overturn), but you're right about the *law* (the criteria for the overturn were met). The solution is to decide in advance that in this committee, the Law trumps the Politics.
