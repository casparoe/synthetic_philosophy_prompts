answer: |-
  This is a profound question that cuts to the heart of modern decision theory. Your skepticism is well-founded from the perspective of **Causal Decision Theory (CDT)**, which dominates standard economics and everyday reasoning. Under CDT, an action is rational only if it causally influences a desired outcome. Since a deceased person's mental state is fixed and causally isolated from the present, CDT dictates that keeping a promise to them is irrational unless it brings *you* pleasure (sentiment) or improves how *others* view you (reputation).

  However, your friend is pointing toward **Timeless Decision Theory (TDT)** and **Updateless Decision Theory (UDT)**, frameworks developed by Eliezer Yudkowsky, Wei Dai, and others. In these frameworks, "acausal trade" is not about magic or influencing the past; it is about **logical correlation** between decision algorithms.

  If we apply these frameworks to promises made to the dead, there are three critical implications that suggest a genuine decision-theoretic obligation exists, distinct from sentiment or reputation.

  ### 1. The Promise as a Newcomblike Problem (Subjunctive Dependence)
  In standard acausal trade, two agents cooperate because they know they are running similar algorithms. If I cooperate, my simulation of you (which effectively *is* you, decision-theoretically) also cooperates.

  In the case of a promise to the dead, the "trade" occurred in the past. The deceased person trusted you or transferred resources to you based on a **prediction** of your current behavior.
  *   **The Causal View:** Their prediction is a historical fact. It cannot change. Whether you keep the promise or not, their prediction was either right or wrong five minutes after they died. Your action has no leverage.
  *   **The Acausal/TDT View:** Your current decision is *logically correlated* with their past prediction. If you are the kind of agent who breaks promises to the dead, then a sufficiently accurate model of you (which the deceased possessed) would have predicted that. If you are the kind of agent who keeps them, their model would have predicted that.

  **Implication:** By keeping the promise, you are not changing the dead person's mind (impossible); you are **validating the accuracy of their model of you.** In TDT, you act as if you control the output of your decision algorithm wherever it appears, including in the deceased's past prediction. If you value being an agent whose actions align with rational predictions made about you (reflective consistency), you have a decision-theoretic reason to keep the promise, even if no causal good comes to the deceased.

  ### 2. Policy Selection Behind a "Veil of Ignorance"
  Updateless Decision Theory (UDT) suggests you should choose a **policy** (a rule for action) that you would have committed to before knowing your specific situation. This is similar to the Rawlsian "veil of ignorance."

  Imagine you are designing your decision algorithm *before* you are born, not knowing whether you will be the promisor or the promisee, or whether you will be alive or dead when the promise comes due.
  *   **Policy A:** "Keep promises only while the other party is alive to enforce them."
  *   **Policy B:** "Keep promises regardless of the other party's ability to enforce them."

  If everyone adopts Policy A, trust collapses. People would not rely on wills, final wishes, or long-term projects, knowing that enforcement vanishes at death. This reduces the total utility available to all agents in the system. If you adopt Policy B, you enable high-trust interactions that benefit you while you are alive (because others trust *you* won't defect when *they* die).

  **Implication:** The decision-theoretic reason to keep the promise is not to benefit the dead person, but to **uphold the policy that maximizes utility for agents like you across all possible timelines.** You keep the promise now because that is the output of the optimal policy you would have selected before knowing you would be the survivor. This is a rational calculation of expected utility, not a sentimental feeling.

  ### 3. Decoupling Obligation from Observation (The "Secret" Test)
  The strongest test of whether this is a *decision-theoretic* reason rather than a *reputational* one is secrecy.
  *   **Reputational Reason:** If I break the promise but no living person ever finds out, I suffer no reputational damage. Therefore, I am free to break it.
  *   **Sentimental Reason:** If I break the promise and feel no guilt, I suffer no emotional pain. Therefore, I am free to break it.
  *   **Acausal/UDT Reason:** Even if no living person knows, and even if I feel no guilt, breaking the promise means my decision algorithm is inconsistent with the optimal policy for trust.

  **Implication:** Acausal reasoning implies that **rationality is internal.** If you accept that your rationality is defined by the logical output of your algorithm rather than the causal consequences of your specific actions, you are obligated to keep the promise even in total secrecy. Breaking it would be akin to a mathematical error in your own reasoning process, regardless of whether anyone observes the error.

  ### Critical Limitations and Nuance
  While these implications provide a formal structure for obligation, they rely on specific philosophical commitments that you may not share:

  1.  **The Fixed Past:** Unlike standard acausal trade (where both parties decide "now"), the deceased has already acted. Some argue this breaks the "subjunctive dependence" required for TDT. You cannot influence their decision, only their *accuracy*. If you don't care about being "predictable" to the dead, the link weakens.
  2.  **Algorithmic Similarity:** Acausal trade works best between similar agents. If the deceased had vastly different values or reasoning processes, the logical correlation between their prediction and your action is weaker.
  3.  **Utility Function:** Ultimately, decision theory optimizes for *your* utility function. If your utility function does not include "being a trustworthy agent across time" or "honoring logical correlations," TDT cannot force you to care. It only tells you how to get what you care about.

  ### Conclusion
  Your friend's intuition points to a genuine distinction. Under **Causal Decision Theory**, your skepticism is correct: there is no rational obligation to the dead, only sentimental or reputational incentives.

  However, under **Timeless or Updateless Decision Theory**, there is a **genuine decision-theoretic reason** to keep the promise. It rests on the idea that you are not just a physical actor causing effects, but a **logical algorithm** outputting decisions. Keeping the promise maintains the integrity of that algorithm, validates the logical correlation with the deceased's past trust, and upholds the optimal policy for cooperation that benefits you (and agents like you) across the multiverse of possibilities.

  Whether this counts as a "genuine" obligation depends on whether you view yourself as a causal agent influencing the future, or a logical function consistent across time. If the latter, the dead still have a claim on you, not because they can feel it, but because your rationality demands consistency with the predictions they made.
