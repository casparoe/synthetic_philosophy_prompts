          *   Go beyond restating the argument.
          *   Must include a question on the 'third-factor' reply.
          *   Must include a question on 'companions in guilt' (math/logic).
          *   Must include a question on the 'self-undermining' charge.
          *   Each question must include a follow-up keyed to the *most likely* answer.

  2.  **Deconstruct the Topic (Street-style EDA):**
      *   *Core Argument:* Evolution shaped moral beliefs for fitness, not truth. Realists claim moral truths are mind-independent. Therefore, the correlation between our beliefs and moral truths is coincidental unless explained. Realists struggle to explain this correlation.
      *   *Key Objections/Replies:*
          *   Third-Factor (Enoch, Wielenberg): Survival is good, or rationality tracks truth.
          *   Companions in Guilt: Math/Logic are also evolved but seem necessary/true.
          *   Self-Undermining: If evolution debunks morality, it debunks the reasoning used to debunk it.
          *   Distinction between adaptive *content* vs. adaptive *capacity*.
          *   Modal security / Sensitivity accounts.
          *   Quietism / Pragmatism.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Core Mechanism (Beyond Restatement).* Instead of "What is the argument?", ask about the *strength* of the coincidence.
          *   *Draft:* How strong does the coincidence need to be to be untenable?
          *   *Refinement:* Focus on the "insensitivity" claim.
          *   *Follow-up:* If she says "very strong," push on probabilistic coherence.

      *   *Question 2: Third-Factor (Required).*
          *   *Draft:* What about the third-factor reply where survival is good?
          *   *Refinement:* Make it specific to David Enoch's "survival is at least neutral" or Wielenberg's robust realism. Ask about the *independence* of the third factor.
          *   *Follow-up:* If she says "that presupposes realism," ask if it's question-begging or just a competing metaphysical picture.

      *   *Question 3: Companions in Guilt (Required).*
          *   *Draft:* What about math? Evolution shaped that too.
          *   *Refinement:* Distinguish between abstract objects and cognitive faculties. Ask why the EDA applies to morality but not arithmetic.
          *   *Follow-up:* If she says "math is different because it's necessary," ask about evolutionary psychology of number sense.

      *   *Question 4: Self-Undermining (Required).*
          *   *Draft:* Doesn't this debunk your own argument?
          *   *Refinement:* Frame it as the "unrestricted vs. restricted" scope. Does she exempt rational norms?
          *   *Follow-up:* If she exempts rational norms, ask for the principled distinction between moral and rational norms.

      *   *Question 5: The "Tracking" Relation.*
          *   *Draft:* How do realists explain tracking?
          *   *Refinement:* Focus on the "pre-established harmony" worry. Is the realist committed to a spooky causal relation?
          *   *Follow-up:* If she says "yes, it's spooky," ask if that's a reductio or just a cost.

      *   *Question 6: Modal Security.*
          *   *Draft:* What if we would have believed the same truths anyway?
          *   *Refinement:* Bring in Berker or Vavova's modal security. Does knowing the evolutionary origin *itself* give us a reason to doubt?
          *   *Follow-up:* If she says "yes, origin matters," ask for a case where origin matters for non-moral beliefs.

      *   *Question 7: Phenomenology of Deliberation.*
          *   *Draft:* How does this change how we think?
          *   *Refinement:* Focus on the first-person perspective. Can we suspend moral belief while deliberating?
          *   *Follow-up:* If she says "no," ask if this implies a pragmatic inconsistency.

      *   *Question 8: Quietism/Pragmatism.*
          *   *Draft:* Should we just stop doing metaethics?
          *   *Refinement:* If realism is untenable, is the move error theory or expressivism? Or just living as if?
          *   *Follow-up:* If error theory, ask about the cost to normative discourse.

      *   *Question 9: Specificity of Moral Content.*
          *   *Draft:* Does evolution explain specific values?
          *   *Refinement:* Distinguish between broad tendencies (care/harm) and specific principles (utilitarianism vs. deontology). Does the EDA debunk *all* realism or just specific flavors?
          *   *Follow-up:* If specific flavors, ask if that leaves a "core" realism intact.

      *   *Question 10: The Rationalist Audience Angle.*
          *   *Draft:* What should the rationalist community do?
          *   *Refinement:* Connect to the "Sequences" or effective altruism. If moral truths aren't trackable, how does EA function?
          *   *Follow-up:* If she says "EA is still useful," ask in what sense "useful" if not "truth-approximating."

  4.  **Review and Refine:**
      *   Check constraints: 8-10 questions? Yes. Third-factor included? Yes (Q3). Companions in guilt? Yes (Q4). Self-undermining? Yes (Q5). Follow-ups keyed to likely answers? Need to ensure the "likely answer" is actually what a proponent of Street's view usually says.
      *   *Tone Check:* Ensure it sounds like a rationalist podcast (precise, slightly technical, focused on epistemic hygiene).
      *   *Follow-up Check:* Make sure the follow-up isn't just "Why?" but challenges the specific defense offered.

      *(Self-Correction during drafting)*: For the Third-Factor question, a Street-defender usually argues that the Third-Factor view *concedes* too much to realism or fails to explain the *specific* content. I need to make sure the follow-up reflects that.
      For Companions in Guilt, the standard reply is that math is *necessary* truth, whereas morality is contingent, or that math has a different epistemic access. I should anticipate the "necessity" defense.
      For Self-Undermining, the standard reply is distinguishing between "theoretical reasoning" (which must be trusted to argue at all) and "substantive moral reasoning." I need to challenge that distinction.

