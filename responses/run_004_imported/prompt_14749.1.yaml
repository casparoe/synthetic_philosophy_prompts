answer: |-
  Here are ten interview questions designed for a philosophically sophisticated audience, focusing on the epistemic and metaphysical tensions of the evolutionary debunking argument (EDA).

  **1. The Threshold of Coincidence**
  Your argument hinges on the claim that the correlation between our evolved moral beliefs and mind-independent moral truths would be a "massive coincidence" if realism were true. But how do we cash out that probability? Since we can't observe the distribution of possible moral truths across possible worlds, aren't we just asserting a low prior on realism rather than deriving it from the evolutionary data?
  *   **Anticipated Answer:** She will likely argue that we don't need precise probabilities; the *causal isolation* of moral facts makes any correlation inexplicable, rendering the hypothesis untenable regardless of the prior.
  *   **Follow-up:** If causal isolation is the killer, does that mean you are committed to a naturalistic constraint on metaphysics where *any* causally inert entity (not just moral ones) is suspect? If so, how do you avoid collapsing into a broader nominalism that might threaten the abstract objects used in your own argument?

  **2. The Specificity of the Debunking**
  Evolutionary psychology suggests selection pressures shaped broad heuristics—like kin altruism or reciprocity—rather than specific normative principles like utilitarianism or Kantianism. Does your argument debunk *all* moral realism, or only the specific claim that our *reflective* moral theories track mind-independent facts?
  *   **Anticipated Answer:** She will likely concede that specific philosophical theories aren't directly selected for, but argue that our *capacity* to form them relies on the same tainted intuitive inputs.
  *   **Follow-up:** If the input is tainted but the processing is rational, why isn't reflective equilibrium enough to scrub the error? Are you suggesting that rational reflection is powerless to correct evolutionary biases in the moral domain specifically?

  **3. The Third-Factor Reply**
  Consider David Enoch's "third-factor" reply: he argues that survival and reproduction are *actually good*, so natural selection tracks moral truth indirectly by tracking survival. This posits a common cause for both the selection pressure and the truth of the belief. Why does this fail to satisfy the explanatory challenge you pose?
  *   **Anticipated Answer:** She will likely argue this is question-begging; it assumes the truth of moral realism (that survival is good) to explain away the argument against moral realism.
  *   **Follow-up:** But isn't every metaphysical defense somewhat circular? If the realist offers a coherent metaphysical picture where survival and goodness align, is your objection that this picture is *unlikely*, or simply that it isn't *naturalistic* enough for your tastes?

  **4. Companions in Guilt (Math and Logic)**
  Critics often point out that our faculties for logic and mathematics were also shaped by natural selection for survival, yet we don't typically think evolutionary biology debunks the truth of $2+2=4$. What is the principled difference between the epistemic status of mathematical beliefs and moral beliefs in your view?
  *   **Anticipated Answer:** She will likely distinguish them by necessity: mathematical truths are true in all possible worlds, so even if evolution shaped our access, we couldn't have easily believed otherwise. Moral truths, she argues, are contingent.
  *   **Follow-up:** But our *cognitive access* to math is still contingent on evolved brains. If evolution gave us a "number sense" optimized for approximate quantity rather than precise Peano arithmetic, why trust that our logical faculties track necessary truths rather than just useful fictions?

  **5. The Self-Undermining Charge**
  A common counter-argument is that if evolutionary history debunks our moral reasoning because it's a product of selection, it should equally debunk the theoretical reasoning you used to construct the debunking argument. How do you exempt your own epistemic norms from the evolutionary guillotine?
  *   **Anticipated Answer:** She will likely argue for a "transcendental" defense: we must presuppose the reliability of our general reasoning faculties to engage in any debate at all, whereas we can suspend moral assumptions without stopping the conversation.
  *   **Follow-up:** That seems to privilege logical norms over moral norms by fiat. Is there an evolutionary story where logical norms were selected for truth-tracking while moral norms were selected for fitness-enhancing illusion? If not, isn't this a pragmatic distinction rather than an epistemic one?

  **6. Modal Security**
  Katia Vavova and others have argued for "modal security": the idea that learning the genealogy of a belief only undermines it if it gives us a reason to think the belief is *insensitive* or *unsafe*. Does learning about evolution actually give us a reason to think our moral beliefs are false, or just that they are contingent?
  *   **Anticipated Answer:** She will likely maintain that the genealogy *does* provide a reason to think the beliefs are insensitive, because the selection pressure would have remained the same even if the moral facts were different.
  *   **Follow-up:** To claim the selection pressure would remain the same, you have to assume the moral facts don't influence the selection pressure. But isn't that just assuming the falsity of realism to prove the insensitivity of the belief?

  **7. Error Theory vs. Expressivism**
  If the debunking argument succeeds, it seems to lead to moral error theory (all moral claims are false) rather than expressivism (moral claims express attitudes). Do you find error theory a livable position, or does the practical cost of abandoning moral truth-claims push you toward a quasi-realist expressivism?
  *   **Anticipated Answer:** She will likely lean toward error theory but suggest we can keep moral discourse as a useful fiction, similar to how we might talk about "solidity" despite knowing about atomic empty space.
  *   **Follow-up:** If it's a fiction, can we still have genuine moral *disagreements*, or do we just have clashing preferences? If the latter, how do you resolve high-stakes normative conflicts (like those in AI alignment or effective altruism) without appealing to a truth standard?

  **8. The Phenomenology of Deliberation**
  From the first-person perspective, when we deliberate about what to do, it *feels* like we are trying to track a truth, not just harmonize our desires. Does your view require us to change how we experience moral deliberation, or is it compatible with maintaining the "realist stance" internally while denying it metaphysically?
  *   **Anticipated Answer:** She will likely say we can't easily turn off the phenomenology, but we should recognize it as a cognitive illusion, much like the visual illusion of a bent stick in water.
  *   **Follow-up:** If it's a persistent illusion, doesn't that create a fragmentation in the agent? How do we prevent the "view from nowhere" (the debunking view) from paralyzing the "view from somewhere" (the deliberating agent)?

  **9. Bayesian Updating on Moral Priors**
  For our audience of rationalists, think of this in Bayesian terms. You are suggesting we update our credence in moral realism downward based on the likelihood of our beliefs given evolution. But if our prior on realism was based on the phenomenology of objectivity, and that phenomenology is itself an adaptation, haven't we lost the independent evidence needed to update?
  *   **Anticipated Answer:** She will likely argue that the evolutionary explanation is a *better* explanation of the phenomenology than realism is, making the likelihood ratio favor anti-realism regardless of the prior.
  *   **Follow-up:** But to judge it a "better" explanation, you need criteria for explanatory virtue (simplicity, scope, etc.). Are those criteria themselves subject to evolutionary debunking? If not, what makes them immune?

  **10. Implications for Long-Termism**
  Many in the rationalist community are committed to Long-Termism, which relies on strong axiological claims about the value of future lives. If moral truths are not trackable, does this undermine the project of optimizing for the long-term future, or can Long-Termism survive as a purely preference-based project?
  *   **Anticipated Answer:** She will likely argue it undermines the *objective* urgency of Long-Termism but not its *subjective* importance to those who hold the preference.
  *   **Follow-up:** If it's merely subjective, how do we justify imposing costs on the present generation for the sake of a future generation that doesn't exist to hold preferences yet? Doesn't the debunking argument strip Long-Termism of its normative force?
