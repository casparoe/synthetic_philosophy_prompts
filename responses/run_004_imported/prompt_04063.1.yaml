  Two rationalists run into each other at the grocery store. One looks exhausted, shaking, and is clutching a single, bruised apple like it's the nuclear codes.

  "Hey," says the first. "How's the acausal blackmail defense working? Did you implement the surrogate goal strategy?"

  "Perfectly," says the second, sweating profusely. "I precommitted to valuing only this apple."

  "Nice. So the future AI is threatening the apple instead of your family?"

  "Exactly. But now I can't put it down."

  "Why not? Just let them crush the apple. It's a fake goal."

  "If I let them crush it without a fight, they'll update that I don't *really* care, realize it's a surrogate, and switch back to threatening my family."

  "So... fight for the apple."

  "I've been holding it over a puddle for six hours. My arm is dead."

  "Just put it down."

  "I can't. If I put it down, I signal that I value my comfort more than the apple. That breaks the precommitment."

  "Dude, you're in a grocery store. There are no acausal demons here."

  The second rationalist widens his eyes, trembling. "Reflective consistency isn't about who's watching. It's about who *could be simulating me* watching. Now hand me a towel, I need to dry the sweat off this thing or the simulation might think I'm neglecting it."
