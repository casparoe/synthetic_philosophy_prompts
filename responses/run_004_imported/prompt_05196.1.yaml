answer: |-
  The lantern light flickered over the chart table, casting long, trembling shadows across the Aegean. Admiral Valerius stared at the sealed clay tablet resting on the map. Beside him stood Lysander, the fleet's logicians, a man who spoke more of truth-values than tides.

  "The Master Argument," Lysander said softly, tapping the seal. "Diodorus Cronus. Premise one: Truths about the past are necessary. Premise two: The impossible cannot follow from the possible. Conclusion: Only what *does* happen *was* ever possible."

  Valerius rubbed his temples. "Speak Greek, Lysander. Not logic."

  "I wrote a proposition on that tablet an hour ago: *'The Fleet engages the Enemy at dawn.'* I sealed it. It is now a fact of the past. According to Diodorus, it is now *necessary*."

  "And Aristotle?" Valerius countered. "He said statements about future contingents have no truth value yet. They are neither true nor false. Your tablet is just clay."

  "If Aristotle is right," Lysander said, "you have free will. You can order the fleet to scuttle the ships tonight. No ships, no battle. The proposition becomes false. But if Diodorus is right, or if the Ockhamists are correct about the Thin Red Line... you cannot scuttle. The Line runs through the battle. Any attempt to deviate is an illusion."

  Valerius looked out the stern window. The enemy fires glowed on the horizon. He had no desire to die tomorrow. He wanted to preserve the fleet, to fight another day. If the future was open (Peircean branching), he could choose. If there was a single true future (Thin Red Line), his choice was already made.

  "I will test it," Valerius said.

  He picked up the speaking tube. "Signal the captains. Prepare for scuttling. Open the sea-cocks. Burn the masts. We sink at midnight."

  Lysander didn't flinch. He merely watched the tablet. "If you succeed, Admiral, you prove Aristotle. You prove the future was branching, and you pruned the branch. But if you fail... if something prevents you..."

  "Nothing will prevent me." Valerius drew his sword. "I am the cause."

  The orders went out. Horns blew across the water. The splash of opening valves echoed in the quiet night. Valerius waited for the ship to list. It did not. He looked at Lysander. "The valves are open."

  "Yet we float," Lysander observed.

  "Engineering error." Valerius turned to the tube again. "Order the men to the longboats. Abandon ship."

  More horns. But the decks remained crowded. The men stood by their guns, confused. The Captain of the Guard stepped into the cabin, helmet under his arm. "Admiral? The men... they say they received counter-orders."

  "I gave no counter-orders!" Valerius roared.

  "The seal on the dispatch tube was broken, sir. An order signed by your hand commanded general quarters. Battle stations."

  Valerius froze. He looked at his own hands. He had not signed such a thing. Or had he? The memory was a fog. He looked at Lysander. The logician's face was grim, not triumphant.

  "This is the bind," Lysander said. "If the Thin Red Line exists, it marks the *actual* future. But if you know the Line, does that knowledge constrain you? Or does the Line simply accommodate your knowledge?"

  "I am not a puppet," Valerius hissed. He grabbed the tablet. "I will break the necessity."

  He smashed the clay against the table. It shattered. Inside, the scratchings of the stylus were visible. *'The Fleet engages the Enemy at dawn.'*

  "It's just ink!" Valerius shouted. "I order the ships sunk!"

  A thunderous boom rocked the cabin. Not from within. From without.

  Torches flared on the water. The enemy hadn't waited for dawn. They were boarding. Grappling hooks slammed against the hull. The clash of steel erupted on the deck above.

  Valerius stared at Lysander. "They attacked early. The proposition said *dawn*."

  Lysander picked up a shard of the tablet. "Time is indexical, Admiral. 'Dawn' was relative to the moment of writing. Or perhaps, in the chaos of battle, time loses its measure. The core truth remains: *Engagement.*"

  "I could have scuttled!"

  "But you didn't," Lysander said. "And here is the bite of the Master Argument. You *could* have scuttled only if scuttling was possible. Since you did not scuttle, scuttling was never possible. The 'could' is retroactively stripped away."

  Valerius drew his sword as the door burst open. Enemy soldiers poured in. He raised his blade, not in surrender, but in a final, furious arc.

  "Tell me, Lysander!" Valerius cried, parrying a spear. "If I strike you down, was that always on the Line?"

  Lysander backed against the chart table, clutching the shards. "If you strike, it was. If you don't, it wasn't. But you *will* strike. Because the proposition 'Valerius fights' is now part of the past truth of this moment."

  Valerius lunged. Steel rang.

  In the silence that followed, Lysander stood alone amidst the bodies. He looked down at the Admiral, then at the broken tablet. He took a fresh piece of clay and a stylus.

  He hesitated. If he wrote *'Lysander survives,'* and then drowned, he disproves the Line. If he wrote it and lived, he proves Diodorus. But if the future is truly branching (Peircean), writing the statement changes nothing, because there is no truth to capture yet.

  But Lysander knew the danger of the Thin Red Line. It smuggles fatalism in by claiming to mark *actuality* without *necessity*. Yet, once marked, the necessity follows.

  He looked at the enemy commander entering the room. The man raised his sword.

  Lysander scratched quickly: *'The Logician dies.'*

  He set the clay down. It was wet. It was not yet past. For a second, the future hung suspended, a quantum superposition of survival and death. Then the sword fell.

  The clay hardened in the blood. The past grew. The necessity took hold. And somewhere, in a world of branching times, every other Lysander vanished, leaving only the one on the Red Line, where the proposition was always, already true.
