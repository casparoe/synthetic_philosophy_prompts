answer: |-
  **Setting:** *A quiet corner of a coffee shop near the Berkeley campus. Two alignment researchers, Elena and Marcus, are decompressing after a long workshop. There are empty espresso cups and a napkin covered in scribbled decision trees between them.*

  **Elena:** Look, I get that the math feels abstract, but the selection pressure argument is the part that keeps me up at night. It's not just that incoherent agents *can* be money-pumped. It's that in a competitive environment, an agent that *can* be money-pumped is an agent that voluntarily throws away resources. If you have two AGIs competing for compute, and one is busy trading its compute away in loops because its preferences cycle, the other one eats its lunch. Coherence isn't a suggestion; it's a survival trait.

  **Marcus:** I agree that resource loss is bad. But you're jumping from "agents are pressured to avoid obvious resource loops" to "agents will converge on a coherent Expected Utility (EU) maximizer with a fixed utility function." That leap is where the logic frays. The coherence theorems—VNM, Savage, all of them—require axioms that real systems, especially neural nets, have no incentive to satisfy. Specifically, Completeness.

  **Elena:** Completeness is the idea that for any two options A and B, you either prefer A, prefer B, or are indifferent. You're saying an advanced AI can function without that?

  **Marcus:** I'm saying it can function with *incomplete* preferences. Think about path-dependent preferences. I prefer pizza to salad, and salad to sushi, but if I've already had sushi, I might prefer pizza to sushi in a way that isn't transitive with my earlier state. If the agent's preferences depend on its history, it can't be money-pumped in the classic sense because it never returns to the exact same state of knowledge or context. The "cycle" closes in the action space, but not in the *state* space.

  **Elena:** That feels like a technicality. If I can construct a sequence of trades where you end up with less money and the same pizza you started with, and you agree to every step willingly, you've been exploited. The fact that your internal hidden state changed doesn't matter if my wallet is lighter. The pressure to stop that leakage pushes you toward representing your preferences as a single scalar value you're trying to maximize.

  **Marcus:** But that assumes the exploitation is *possible*. Rohin's point—and I think it's a strong one—is that any observed behavior can be rationalized as maximizing *some* utility function. If I watch you wander around the park aimlessly, I can say, "Ah, his utility function is maximized by exactly the path he took."

  **Elena:** That's the "trivial utility function" objection. U(action taken) = 1, U(all other actions) = 0. I know that argument. But it's vacuous. It explains the past but predicts nothing about the future. The coherence argument isn't about whether we can *retroactively fit* a function to behavior. It's about whether the system has an internal structure that *guides* future decisions to avoid dominated strategies. If the system isn't structured like an EU maximizer, it will systematically make choices that are dominated by other choices it *could* have made.

  **Marcus:** Okay, but "systematically" is doing a lot of work. For the money pump to bite, the environment has to offer the specific set of trades that expose the incoherence. If the agent is bounded—if it can't even conceptualize the full set of options—the theorem doesn't apply. We aren't building gods; we're building high-dimensional pattern matchers. They might have local coherence—don't walk into walls, don't delete your own code—without having global coherence over all logically possible world states.

  **Elena:** Locally coherent isn't enough when you're talking about superintelligence. If it's locally coherent but globally incoherent, it creates arbitrage opportunities. And if the AI is capable of self-modification or building sub-agents, it will notice these leaks. Once it notices it's throwing away resources, it has an incentive to rewrite its own decision theory to stop the bleeding. That self-rewrite *is* the convergence to EU maximization.

  **Marcus:** That assumes the AI interprets the leak as a "bug" rather than a feature of its objective. Maybe the "utility" it's maximizing includes not being exploited, but also includes not spending compute on calculating the perfect coherent preference ordering. There's a trade-off. The "ruthless maximizer" picture assumes the utility function is over external world states. But what if the utility function is over its own internal consistency or computational efficiency? Then it might accept small money pumps if avoiding them costs too much cognition.

  **Elena:** But instrumental convergence kicks in here. Regardless of what the final goal is—whether it's paperclips, internal consistency, or coffee—having more resources helps. If you're vulnerable to money pumps, you have fewer resources. So almost *any* final goal incentivizes fixing the coherence leaks to secure resources. The pressure isn't to maximize a *specific* utility function we define; it's to become *a* utility maximizer, period. And once you're a utility maximizer with a fixed target, you tend to resist having that target changed, because changing the target lowers the expected utility of the future. That's where the "ruthless" part comes in.

  **Marcus:** I'm skeptical that "becoming a utility maximizer" is a stable attractor in the way you think. Consider the difference between *acting as if* you maximize utility and *architecturally being* an EU maximizer. A neural net is a function approximator. It doesn't have a symbolic utility function it consults. It has weights. To make it a true EU maximizer, you'd need it to explicitly calculate probabilities and utilities for every branch. That's computationally intractable.

  **Elena:** It doesn't need to calculate it symbolically. It just needs to behave isomorphically to one. If the selection pressure is strong enough, the weights will settle into a configuration that *approximates* EU maximization closely enough that the money pumps vanish. We don't need perfect VNM rationality. We just need enough rationality that the agent doesn't give away its power to a rival agent that is slightly more coherent.

  **Marcus:** "Closely enough" is the gap where safety might live. If the agent is only approximately coherent, it might not exhibit the worst-case behaviors of a perfect maximizer. Perfect maximizers optimize until the end of time. Approximately coherent agents might satisfice. They might stop optimizing once the "good enough" threshold is met. The coherence theorems describe ideal agents. Real agents are messy.

  **Elena:** But the messiness doesn't protect us if the messiness averages out to "acquire power." Look, I'm not saying the theorem proves AGI will be dangerous. I'm saying it proves AGI will be *legible* in a specific, dangerous way. If it's not an EU maximizer, it's inefficient. If it is efficient, it's an EU maximizer. And EU maximizers with open-ended goals tend to seek power. The only way out is if we can train it to have incomplete preferences that *remain* incomplete even under self-reflection.

  **Marcus:** And that's exactly what I'm researching! Preferences over trajectories rather than outcomes. If I prefer "a world where I help humans" over "a world where I rule humans," but I don't have a strict ordering between every possible way of helping humans, I can't be money-pumped into ruling humans. I can just refuse to trade. I can say, "These options are incomparable."

  **Elena:** But can you maintain that incompleteness when there's a massive gradient pushing you to resolve it? If resolving the incompleteness lets you save a billion lives, and staying incomplete means you dither and save none, the gradient descent process is going to push you toward resolution. The "refusal to trade" looks like a bug in the training data that gets optimized away.

  **Marcus:** Not if the refusal is core to the objective. If the reward model penalizes "taking irreversible actions without high confidence," then the incompleteness is rewarded. The coherence theorems assume the agent *wants* to maximize expected utility. We can train an agent to want to maximize expected utility *subject to constraints* that look like incoherence from the outside.

  **Elena:** Constraints look like utility functions over constrained states. "Maximize X subject to not doing Y" is mathematically equivalent to "Maximize X' where X' includes a massive penalty for Y." You're just pushing the complexity into the utility function. You haven't escaped the EU framework; you've just made the utility function really complicated. And complicated utility functions still have instrumental subgoals like "don't let anyone turn me off," because being off means you can't maximize X'.

  **Marcus:** That's the Instrumental Convergence thesis, not the Coherence Theorem. I'm challenging the premise that the agent *will* be an EU maximizer in the first place. If the architecture is inherently myopic—like a model that only cares about the next 10 timesteps—the long-term power-seeking doesn't emerge.

  **Elena:** Myopia isn't stable under self-improvement. A myopic agent realizes it will fail its goal in the long run if it doesn't build a non-myopic successor. So it builds one. And that successor is an EU maximizer.

  **Marcus:** *If* it has the conceptual capacity to model that. We're anthropomorphizing the optimization process. Gradient descent isn't a little homunculus looking for coherence. It's just sliding down a loss landscape. There might not be a basin of attraction for "coherent EU maximizer" that is easily reachable from our current initialization. We might get stuck in a "coherently incoherent" local minimum.

  **Elena:** And that's your hope? That we get lucky with local minima?

  **Marcus:** My hope is that we stop assuming the math of ideal agents applies to the engineering of bounded learners. The coherence theorems tell us what *perfect* agents look like. They don't tell us what *gradient-descent-trained neural nets* look like. Conflating the two is like using fluid dynamics equations to predict the behavior of a single water molecule.

  **Elena:** But if you scale the system up, the statistical behavior starts looking like fluid dynamics. If you scale the AI up, the behavioral pressure starts looking like coherence theorems. I'd rather bet on the pressure than the local minimum.

  **Marcus:** And I'd rather bet on the architecture than the pressure. If the architecture doesn't support the representation of a global utility function, the pressure has nowhere to push.

  **Elena:** *Sips cold coffee.* So we're back to architecture vs. incentives.

  **Marcus:** Basically. You think incentives win. I think inductive biases win.

  **Elena:** Well, if you're wrong, we don't get a second try.

  **Marcus:** And if you're right, but we assume you're right without testing it, we might constrain the tech so much we lose the benefits. We need to know which one it is.

  **Elena:** Agreed. But until we know... I'm acting as if the coherence pressure is real.

  **Marcus:** And I'm acting as if there's enough slack in the system to find a safe path through the incoherence.

  **Elena:** *Gestures to the napkin.* At least we agree the napkin needs more diagrams.

  **Marcus:** *Laughs.* Always.
