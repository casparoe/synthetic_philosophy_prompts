      *(Self-Correction during drafting)*: I need to make sure I don't confuse the user with "Sophisticated Substantivalism" too early. First, explain why the *naive* substantivalist gets crushed. Then mention the escape hatch.

      *Key Insight to convey:* The "easy way out" *is* the definition of relationalism (or metric field substantivalism), not manifold substantivalism. You can't have your cake (points are real individuals) and eat it too (point identity doesn't matter).

