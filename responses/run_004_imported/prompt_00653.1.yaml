answer: |-
  This is a fantastic passage to anchor your piece on. It cuts right to the bone of Hobbes's entire philosophical project and explains *why* he fought so dirty with John Wallis. To Hobbes, this wasn't just a math error; it was an epistemological crisis.

  Here is the breakdown you need for your article, moving from the plain translation to the technical implications and finally to the psychology of his circle-squaring obsession.

  ### 1. The Plain-English Translation (Line-by-Line)

  Here is what Hobbes is actually saying, stripped of the 17th-century syntax:

  *   **"Of arts, some are demonstrable, others indemonstrable..."**
      *   **Translation:** Some fields of study allow for absolute proof; others don't.
  *   **"...demonstrable are those the construction of the subject whereof is in the power of the artist himself..."**
      *   **Translation:** You can only prove things absolutely when *you* are the one building the thing you are studying.
  *   **"...who, in his demonstration, does no more but deduce the consequences of his own operation."**
      *   **Translation:** Scientific proof is just retracing the steps you took to make the thing. If you built it, you know exactly how it works.
  *   **"The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same..."**
      *   **Translation:** To truly *know* something (science), you have to know the cause *before* you see the effect. You need the blueprint before the building.
  *   **"...and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for."**
      *   **Translation:** If you already know the cause, you can prove things. If you have to guess the cause, you can't.
  *   **"Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves..."**
      *   **Translation:** Math counts as real science because we draw the lines. We create the objects.
  *   **"...and civil philosophy is demonstrable, because we make the commonwealth ourselves."**
      *   **Translation:** Politics counts as real science because humans create societies (via social contract). We aren't studying nature; we're studying our own invention.
  *   **"But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be."**
      *   **Translation:** Physics (natural philosophy) is the loser here. God or Nature made physical bodies, not us. We see the effect (an apple falls) and have to guess the cause (gravity?). We can guess *possible* causes, but we can never be 100% sure.

  ### 2. The "Construction" Hook: Materialism and Motion

  You asked if "construction" carries technical weight. **Yes, absolutely.** This is where Hobbes separates himself from Plato or Descartes.

  For a Platonist, a circle is an abstract, perfect ideal that exists in a realm of forms. For Hobbes, a materialist, **a circle is a physical trace of motion.**

  *   **Nominalist/Materialist Twist:** Hobbes argues that a "point" isn't a mathematical abstraction; it's a body with magnitude that we *pretend* is indivisible. A "line" is the track left by a moving point.
  *   **Why this matters:** When Hobbes says we "construct" geometry, he means it literally. We generate geometric truth through physical motion (drawing). Therefore, geometry is a branch of physics (the study of moving bodies), not a separate abstract realm.
  *   **The Civil Philosophy Link:** This is the brilliant leap. Just as I move my hand to create a line, individuals move their wills to create a Sovereign. The State is an "Artificial Man." Because we built it via contract, we understand its "motion" (laws/conflict) perfectly. Nature (physics) was built by God, so we are stuck reverse-engineering it.

  This principle is often called *Verum Ipsum Factum* ("Truth is itself made"). It predates Vico's famous formulation of it. For Hobbes, **we only truly know what we create.**

  ### 3. The Circle-Squaring Obsession: Epistemology as Armor

  This is the gold for your article. Does this reasoning explain why he never backed down against Wallis? **Yes, it is the primary psychological engine of his stubbornness.**

  Here is the dynamic:

  1.  **Certainty vs. Consensus:** For Wallis and the Oxford crowd, math was about consensus, rigorous notation, and algebraic verification. For Hobbes, math was about *causal certainty*. If he started with definitions he knew were true (because he defined them) and followed a chain of reasoning, the conclusion *had* to be true.
  2.  **The "Artist" Privilege:** In the passage you quoted, Hobbes says the artist deduces consequences of "his own operation." If Wallis says Hobbes is wrong, Hobbes doesn't see it as a calculation error; he sees it as Wallis failing to understand the *construction*. Hobbes believed he had access to the causal generation of the figure that the "professors" missed because they were too lost in symbols.
  3.  **Rejection of Authority:** Hobbes hated the university system (Oxford). He viewed their mathematics as scholastic gibberish. Because he believed *he* was the "artist" constructing the proof, he felt he possessed a higher grade of certainty than the "professors" who were merely checking calculations.
  4.  **The Trap:** The flaw, obviously, is that you can construct a logical chain that feels certain but starts with a false premise or makes an invisible leap. Hobbes conflated **subjective certainty of method** with **objective correctness of result**. Because he *felt* he knew the cause (the construction), he assumed the effect (the proof) must be valid, even when the geometry didn't hold up.

  In short: He wasn't just bad at math. He was operating on a different definition of what math *was*. He thought he was doing causal physics; they thought he was doing formal logic.

  ### 4. Assessment: Does the Argument Hold Up?

  For your readers, you need to know if Hobbes is onto something or if this is just rationalization for his ego.

  **Where he is brilliant:**
  *   **Constructivism:** He anticipates modern constructivist mathematics (you prove something by building it).
  *   **Political Science:** He is arguably right that political science is unique because the subject matter (institutions) is human-made. We can change the "laws" of politics; we can't change the laws of gravity.
  *   **Limits of Physics:** He correctly identifies that empirical science is probabilistic. We infer causes from effects; we don't see the causes directly. (Hume later expands on this).

  **Where he fails:**
  *   **Geometry isn't Physical:** By tying geometry to physical motion/drawing, he limits it. A perfect circle *cannot* be drawn physically. Math works *because* it is abstract, not because it is constructed. Wallis was right here.
  *   **The God Problem:** He shuts physics out of "demonstrable science" because God made nature. But if you remove God (as later science did), natural bodies just *are*. We can discover their construction through investigation. Hobbes's barrier was theological/metaphysical, not methodological.
  *   **The Ego Trap:** This epistemology creates a closed loop. If "truth is what I make," it becomes very hard to accept external correction. It insulated him from criticism for 20 years.

  ### 5. How to Frame This for Your Article

  If I were editing this piece, I'd suggest framing the Hobbes-Wallis feud not as "Philosopher vs. Mathematicians," but as **"The Maker vs. The Checkers."**

  *   **Hobbes (The Maker):** Believes knowledge comes from *generation*. He squared the circle because he constructed the proof from first principles he controlled. To admit error would be to admit he didn't understand his own creation.
  *   **Wallis (The Checker):** Represents the emerging scientific community where truth is verified by peers, notation, and independent replication, not by the internal certainty of the author.

  **The Takeaway:** Hobbes's passage is a profound insight into the difference between normative sciences (math, politics) and empirical sciences (physics), but it also serves as a case study in how a powerful philosophy can become a cognitive blind spot. He loved geometry because it was the only place where man could be God—creating worlds with perfect knowledge. He couldn't let go of squaring the circle because it was his one chance to actually pull it off.

  This should give you enough meat to satisfy an editor while keeping the narrative focused on the human drama of the feud. Good luck with the piece!
