prompt: |-
  I am preparing a graduate seminar on laws of nature, and I keep struggling with how to introduce David Lewis's Best System Analysis without letting my students assume, on the strength of the label alone, that Hume himself would simply have endorsed it. The slogan version — no necessary connections, laws as nothing but the most economical true summary of the pattern of particular fact — does sound like vintage Hume, and a colleague of mine, an unrepentant anti-Humean, likes to joke that Lewis spent his career smuggling necessity back in through the servants' entrance after showing it out the front door. But the slogan is not the theory. Lewis's actual system needs a privileged, objective class of "natural" or "elite" properties to keep simplicity and strength from being trivialized by gerrymandered predicates; it ties lawhood to objective chance by way of the Principal Principle, which then has to be patched against the problem of undermining futures; and the wider Humean supervenience thesis behind all of this, that everything supervenes on a spatiotemporal arrangement of local, separable qualities, runs into serious difficulty from quantum entanglement — an objection pressed hard by anti-Humeans such as Tim Maudlin, and one that Lewis himself never fully laid to rest.

  What I would like from you, partly so that I can try the exercise on my students, is a considered reconstruction of how Hume himself would have responded if confronted with this full technical picture rather than the slogan. Would he recognize natural properties, objective chance, and the rest as a faithful continuation of his own project, or would he see them as reintroducing, under new names, exactly the sort of necessary connection and metaphysical commitment he devoted the Treatise and the first Enquiry to dismantling? I am especially interested in how his own skepticism about induction and the uniformity of nature bears on the question, since picking out the "best" system already presumes that simplicity and strength are trustworthy guides to how nature will continue — precisely the sort of assumption his argument about induction was meant to leave unearned. Please resist the easy answer that Hume liked economy of thought and would therefore have approved of the whole package; I want to know specifically where in this later machinery he would have dug in his heels, and where, if anywhere, he might have been won over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** David Lewis's Best System Analysis (BSA) of laws of nature vs. David Hume's actual philosophy.
      *   **Goal:** Reconstruct how Hume would respond to the *full technical picture* of Lewis's BSA (not just the slogan).
      *   **Key Issues to Address:**
          *   The role of "natural/elite properties" (are they hidden necessities?).
          *   Objective chance and the Principal Principle (does this reintroduce modal force?).
          *   Humean Supervenience and Quantum Entanglement (metaphysical commitments about the world's structure).
          *   The problem of induction (does BSA presuppose the uniformity of nature it claims to analyze?).
      *   **Constraint:** Avoid the easy answer ("Hume liked economy, so he'd agree"). Be specific about where he would object and where he might concede.
      *   **Audience:** Graduate seminar students (needs philosophical depth, nuance, and historical fidelity).

  2.  **Deconstruct the Lewis-Hume Relationship:**
      *   *Lewis's Claim:* He is a Humean. He believes in Humean Supervenience (the world is a mosaic of local matters of particular fact). Laws supervene on this mosaic.
      *   *The Tension:* Lewis adds technical machinery (natural properties, chance, simplicity/strength balance) that might look like "secret necessities" to a strict empiricist/skeptic like Hume.
      *   *The Core Conflict:* Hume is a skeptic about *metaphysics* and *induction*. Lewis is a realist about *logic* and *metaphysics* (modal realism, though BSA is actualist). Lewis wants laws to be objective truth-makers for counterfactuals. Hume thinks laws are psychological habits projected onto the world.

  3.  **Address Specific Points of Contention:**

      *   **1. Natural/Elite Properties:**
          *   *Lewis:* Needed to prevent "grue"-like predicates from making the system too simple/strong. They are objective features of reality.
          *   *Hume:* Would he accept objective similarity classes? Hume talks about "custom" and "resemblance." But does he think resemblance is *in the objects* or a *relation of ideas*? In the *Treatise*, he suggests resemblance is a philosophical relation, but our grouping is psychological. If Lewis says "Nature carves itself at the joints," Hume might smell rat. It looks like a realist commitment to universals or objective structure beyond the "loose and separate" impressions.
          *   *Verdict:* Hume would be suspicious. It looks like a necessary connection disguised as "naturalness."

      *   **2. Objective Chance & The Principal Principle:**
          *   *Lewis:* Chances are real features of the best system. The Principal Principle links credence to chance.
          *   *Hume:* Hume is a determinist (mostly) or at least skeptical of "chance" as anything real. For Hume, chance is ignorance. "It is impossible to admit any middle quality betwixt chance and an absolute necessity." (*Enquiry*).
          *   *Verdict:* Major clash. Hume would reject objective chance outright.

      *   **3. Humean Supervenience & Quantum Mechanics:**
          *   *Lewis:* The world is a spatiotemporal arrangement of local qualities.
          *   *Problem:* Entanglement suggests non-separability.
          *   *Hume:* Hume's "separability principle" (whatever is distinct is separable). If QM violates this, Hume's metaphysics is in trouble. But Hume's metaphysics is based on *impressions*. If we have no impression of entanglement, does it exist?
          *   *Verdict:* Hume would likely side with the phenomena (impressions). If physics says non-separable, Hume might adjust his "local qualities" but would worry about the metaphysical weight Lewis puts on the "mosaic."

      *   **4. The Problem of Induction (The Crucial Point):**
          *   *Lewis:* The "Best" system is chosen based on simplicity and strength. This assumes nature *is* simple and uniform enough to be summarized.
          *   *Hume:* We have no rational justification for assuming nature is uniform. To choose the "Best System" is to make an inductive inference about the structure of the universe.
          *   *Verdict:* This is the strongest objection. Lewis uses the *solution* to induction (laws) to *define* laws, but the selection criteria (simplicity) presuppose the validity of induction. Hume would call this circular.

      *   **5. The Nature of "Lawhood":**
          *   *Lewis:* Laws are objective truths that support counterfactuals.
          *   *Hume:* Laws are descriptions of constant conjunctions + a feeling of determination in the mind. They don't *make* counterfactuals true; our expectations do.
          *   *Verdict:* Lewis reifies what Hume psychologized.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Set the stage: Lewis as a "Neo-Humean" vs. Hume the "Skeptic."
      *   *Section 1: The Metaphysics of the Mosaic (Supervenience & Properties).* Discuss local qualities and natural properties. Hume's separability principle vs. Lewis's elite classes. Hume would worry "natural properties" are occult qualities.
      *   *Section 2: The Specter of Chance.* Hume's definition of chance (ignorance) vs. Lewis's objective chance. This is a hard no from Hume.
      *   *Section 3: The Inductive Circle.* This is the meat of the prompt. Simplicity as a guide to truth. Hume's skepticism about the Uniformity of Nature. Lewis assumes what Hume says is unprovable.
      *   *Section 4: The Psychological vs. The Ontological.* Hume's project is about human understanding, not just world-structure. Lewis makes laws "out there." Hume puts them "in here."
      *   *Conclusion:* Summarize. Hume would see Lewis as a Dogmatist in Humean clothing.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't paint Hume as an anti-realist about *everything*. He believes in cause and effect as constant conjunction. He just denies the *necessary connection*.
      *   *Nuance:* Lewis's "natural properties" are meant to save Humean Supervenience. But do they violate the spirit of empiricism? Yes, because we don't observe "naturalness," we infer it.
      *   *Focus:* Keep coming back to the *Induction* point. That's the specific request ("especially interested in how his own skepticism about induction... bears on the question").
      *   *Tone:* Academic, rigorous, suitable for a graduate seminar context.

  6.  **Final Polish:** Check against the prompt's specific constraints.
      *   Did I avoid the "Hume liked economy" easy answer? Yes.
      *   Did I address natural properties? Yes.
      *   Did I address objective chance? Yes.
      *   Did I address induction/uniformity? Yes.
      *   Did I address quantum entanglement/supervenience? Yes.

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a superb pedagogical challenge. It cuts to the heart of the distinction between *Humean Supervenience* (a metaphysical thesis about the structure of the world) and *Hume's Philosophy* (an epistemological and psychological project about the limits of human understanding). Lewis often conflated the two, assuming that to be a Humean meant to believe the world is a mosaic of local qualities. But for Hume himself, the "mosaic" was a description of the *content of impressions*, not necessarily a dogmatic assertion about the mind-independent furniture of the universe.

  If you were to summon Hume to your seminar to evaluate Lewis's Best System Analysis (BSA) in its technical entirety, he would likely be far less charmed than Lewis anticipated. He would view Lewis not as a disciple, but as a "Dogmatist in Empiricist's Clothing."

  Here is a reconstruction of where Hume would dig in his heels, structured by the specific technical commitments you mentioned.

  ### 1. On "Elite" Natural Properties: Occult Qualities in Disguise
  Lewis introduces a privileged class of "natural" or "elite" properties to prevent the Best System from being trivialized by gerrymandered predicates (like Goodman's "grue"). Without this, a system could be maximally simple and strong by simply listing every particular fact using a contrived predicate.

  **Hume's Objection:**
  Hume would view the postulation of objective "natural properties" as a violation of his core empiricist constraint. For Hume, all ideas must be traceable to impressions. We have impressions of red, of heat, of shape. Do we have an impression of "naturalness"? Do we perceive a glow around the *mass* property that distinguishes it from the *mass-plus-time-squared* property?

  Lewis treats natural properties as objective features of the world that constrain the systematization. Hume would argue this is precisely the sort of "secret power" or "essential quality" he sought to dismantle in *Treatise* 1.3.14. By positing that nature comes pre-carved at the joints, Lewis is asserting a necessary structure to reality that goes beyond the "loose and separate" impressions. Hume would argue that the preference for certain predicates over others is a feature of *human psychology* (our tendency to associate resembling ideas), not a feature of the objects themselves. To make it objective is to reify a habit of the mind into a metaphysical necessity.

  **Verdict:** Hume rejects elite properties. They are "occult qualities" that smuggle modal force back into the mosaic.

  ### 2. On Objective Chance: A Contradiction in Terms
  Lewis's BSA relies heavily on objective single-case chances, integrated via the Principal Principle. For Lewis, a probabilistic law is part of the Best System if positing it improves the balance of simplicity and strength.

  **Hume's Objection:**
  Here the conflict is absolute. In the *Enquiry Concerning Human Understanding* (Section VI), Hume is explicit: "It is impossible to admit any middle quality betwixt chance and an absolute necessity." For Hume, "chance" is not a real feature of the world; it is a name for our ignorance of causes. To say a decay has an *objective* probability of 50% is, for Hume, nonsense. Either there is a determining cause (which we may not know) or there is nothing.

  Lewis wants chance to be a truth-maker for probabilistic predictions. Hume would argue this attributes a "determination" to the object that we cannot possibly observe. We observe frequencies (constant conjunctions), not propensities or chances. By building objective chance into the Best System, Lewis is not summarizing the mosaic; he is adding a layer of modal thickness to the tiles themselves.

  **Verdict:** Hume would view objective chance as a metaphysical fiction. He would accept probabilistic *statements* as useful summaries of our ignorance, but reject them as constituents of the "Best System" of reality.

  ### 3. On Induction and the Uniformity of Nature: The Vicious Circle
  This is the most critical point for your seminar. The BSA selects the "Best" system based on a balance of **Simplicity** and **Strength**. This selection presupposes that the future will resemble the past in a specific way: specifically, that the future will be *simple* and *systematizable*.

  **Hume's Objection:**
  Hume's problem of induction is not just that we can't prove the future will resemble the past; it is that we have no non-circular reason to prefer *any* specific principle of extrapolation. Lewis's BSA attempts to *define* laws (and thus justify induction) by appealing to simplicity. But why should we trust simplicity?

  If a student asks, "Why believe the Best System will continue to hold?" the Lewisian answers, "Because it is the Best System." If the student asks, "Why think the Best System is a guide to truth?" the Lewisian answers, "Because nature is uniform." Hume would pounce: "How do you know nature is uniform?" "Because the Best System says so."

  Hume would argue that Lewis has presupposed the very principle (the Uniformity of Nature, specifically a *Simple* Uniformity) that requires justification. The choice of "Simplicity" as a virtue is itself an inductive bias. A world could be chaotic, or complex, or gerrymandered. By building simplicity into the definition of lawhood, Lewis isn't solving the problem of induction; he is defining laws in such a way that they *would* solve induction *if* induction were justified. But for Hume, the leap from "This is the simplest summary of past data" to "This is how the world will continue" remains unbridged by reason. Lewis offers a metaphysics of laws, but Hume wanted an epistemology of inference. Lewis gives us a map; Hume asks why we trust the cartographer.

  **Verdict:** Hume would see the appeal to Simplicity as a dogmatic assumption of the Uniformity of Nature, precisely the assumption his skepticism showed to be ungrounded.

  ### 4. On Humean Supervenience and Quantum Entanglement
  Lewis insists that everything supervenes on the spatiotemporal arrangement of local, intrinsic qualities. As you noted, quantum entanglement poses a severe threat to this, as entangled states seem to be non-separable relations that do not supervene on the intrinsic properties of the relata.

  **Hume's Objection:**
  Hume's "Separability Principle" (whatever is distinct is separable) is the ancestor of Lewis's Supervenience. However, Hume's principle is derived from the limits of imagination and conception. If physics demonstrates that we *cannot* conceive of the parts independently of the whole (as in entanglement), Hume would be forced to adjust his metaphysics to the phenomena.

  However, Hume would be suspicious of Lewis's stubborn defense of Supervenience. Lewis was willing to tweak physics or modal realism to save Supervenience. Hume would likely do the opposite: he would adjust the metaphysics to fit the "impressions" (the experimental data). If the data suggests non-locality, then the "local matters of particular fact" thesis is false. Hume would not cling to the "mosaic" as an *a priori* truth. He would see Lewis's defense of Supervenience against QM as another instance of prioritizing a metaphysical system over empirical evidence—a form of the "philosophical hypothesis" he warned against.

  **Verdict:** Hume would likely concede that Supervenience fails in light of QM, and would criticize Lewis for trying to save the metaphysical thesis at the expense of the empirical data.

  ### 5. The Fundamental Divergence: Ontology vs. Psychology
  The deepest reason Hume would reject the BSA is that they are playing different games.

  *   **Lewis** is an ontological realist. He wants to know what *makes* a law a law. He wants truth-makers. He wants laws to support counterfactuals objectively.
  *   **Hume** is a psychological naturalist. He wants to know why we *believe* in laws. For Hume, "necessity" is something that exists in the mind, not in objects.

  When Lewis says, "Laws are the axioms of the Best System," he is offering an objective criterion. When Hume says, "Laws are constant conjunctions plus a feeling of determination," he is offering a subjective explanation.

  Hume would argue that Lewis has taken the *feeling* of expectation produced by a simple, strong summary and projected it back onto the world as "Lawhood." Lewis thinks he has found the objective correlate of our practices. Hume would say there is no correlate; there is only the practice. By positing the "Best System" as an objective feature of the world, Lewis is hypostatizing a human cognitive strategy.

  ### Where Hume Might Concede
  It is not a total rejection. Hume would likely appreciate the **reductionist spirit**. He would agree that we should not posit more entities than necessary (Ockham's Razor is Humean enough). He would agree that we should not posit "powers" or "efficacies" beyond the regularities.

  He might even accept the *utility* of the Best System analysis as a description of how science *proceeds*. Scientists do look for simple, strong summaries. Hume would agree that this is how human understanding operates. His objection is strictly that Lewis claims this procedure reveals the *metaphysical essence* of lawhood, rather than merely describing the *psychological habits* of scientists.

  ### Summary for Your Students
  To summarize for your seminar, you might frame Hume's response as follows:

  1.  **On Properties:** "You claim these properties are 'natural,' but I see no impression of 'naturalness.' You have turned a psychological habit of resemblance into an ontological ghost."
  2.  **On Chance:** "You speak of objective chance, but chance is nothing but ignorance. You have made our ignorance a feature of the world."
  3.  **On Induction:** "You use Simplicity to choose the System, but you offer no reason why the world should be simple. You assume the Uniformity of Nature to define the Laws that supposedly prove the Uniformity of Nature. This is circular."
  4.  **On Supervenience:** "You cling to the 'mosaic' even when physics suggests the tiles are glued together. Do not let metaphysics dictate to experiment."
  5.  **On Lawhood:** "You seek the truth-maker for laws. I tell you there is none. There is only the conjunction and the mind's determination. You have built a cathedral of necessity on a foundation of habit."

  **The Punchline:** Lewis thought he was finishing Hume's project by providing a rigorous semantics for Humean claims. Hume would reply that Lewis misunderstood the project: it was never about providing a semantics for laws, but about dissolving the demand for them. Lewis didn't smuggle necessity in through the servants' entrance; he built a new mansion for it and painted "Hume" on the mailbox.
