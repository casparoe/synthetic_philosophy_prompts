answer: |-
  This is a profound application of decision theory to a classic philosophical problem. To answer you directly: **Acausal trade does not provide a decision-theoretic reason to keep promises *to the dead* per se, but it does provide a robust decision-theoretic reason to keep promises *as a principle*, which incidentally covers the dead.**

  The distinction is subtle but crucial. Under standard Causal Decision Theory (CDT), your friend is right: there is no rational obligation, only sentiment. Under Acausal Decision Theories (like Timeless Decision Theory or Updateless Decision Theory), the obligation shifts from the *recipient* (who no longer exists as an agent) to the *source code* of the promisor (you).

  Here are the most important implications of acausal trade for this scenario, broken down by the conditions required for acausal cooperation to function.

  ### 1. The Failure of Mutual Agency
  The primary implication is negative. For acausal trade to occur, there must be **logical correlation between two active decision algorithms.** Agent A simulates Agent B, and Agent B simulates Agent A. They cooperate because each knows the other is running a similar algorithm that rewards cooperation.

  *   **The Problem:** A deceased person is no longer an agent. They cannot simulate you, they cannot update their strategy, and they cannot reciprocate. The feedback loop required for acausal trade is broken.
  *   **The Implication:** There is no *direct* acausal trade between you and the dead. You cannot reason, "I will keep this promise because the dead person is logically compelled to reward me." They cannot reward you. Therefore, acausal trade does not resurrect a direct obligation *to them* based on mutual benefit.

  ### 2. The Logic of Precommitment (The "Past Self" Argument)
  While you cannot trade with the dead, acausal decision theory places immense weight on **precommitment**. In Timeless Decision Theory (TDT), your current action is viewed as the output of a logical algorithm that existed in the past.

  *   **The Mechanism:** When you made the promise while the person was alive, you effectively entered a contract with your *future self*. At that moment, the optimal strategy (to secure the trust of the living person) was to commit to an algorithm that keeps promises even when enforcement is impossible.
  *   **The Implication:** Breaking the promise now is not a betrayal of the dead; it is a **logical inconsistency in your own algorithm.** If you decide now that "promises to the dead don't count," you are effectively rewriting your source code to be "the kind of agent who breaks promises when enforcement vanishes."
  *   **The Rational Obligation:** You keep the promise not to satisfy the dead, but to remain logically consistent with the agent who *made* the promise. To do otherwise is to admit that your past reasoning was flawed, which undermines your confidence in your own decision-making processes.

  ### 3. Reputation with Future Counterparties (Acausal Signaling)
  This is the strongest decision-theoretic argument for keeping promises to the dead. Acausal trade relies on you being predictable to *other* agents who might want to trade with you.

  *   **The Mechanism:** Other agents (living friends, business partners, or even future AIs) model you to decide whether to cooperate with you. They look for "dispositional traits." If you are the type of agent who keeps promises only when there is a causal threat of punishment, you are a poor candidate for acausal trade.
  *   **The Implication:** Keeping a promise to someone who *cannot* punish you is the ultimate signal of trustworthiness. It proves your cooperation is driven by logical commitment, not causal coercion.
  *   **The Rational Obligation:** You keep the promise to the dead to maintain your status as a **reliable acausal trading partner for the living.** If you break the promise, you degrade your "reputation" in the logical space of decision algorithms, making future acausal cooperation with living agents less likely or less profitable.

  ### 4. The "Updateless" Perspective
  Updateless Decision Theory (UDT) suggests you should choose a policy that you would have wanted to commit to *before* you knew specific details about your situation.

  *   **The Mechanism:** Before you knew the person would die, what policy would you have wanted to adopt? Presumably, "Keep promises regardless of the recipient's survival." This policy maximizes trust and cooperation overall.
  *   **The Implication:** Once the person dies, you gain new information (that they can't check on you). CDT says you should update your strategy based on this new info (i.e., stop keeping the promise). UDT says **do not update.** Stick to the policy you would have chosen behind the veil of ignorance.
  *   **The Rational Obligation:** The obligation is to the *policy*, not the person. Keeping the promise validates the universal policy of promise-keeping, which is rational to uphold even in specific cases where it seems costly.

  ### 5. Metaphysical Caveats (The "Simulation" Loophole)
  There is one fringe implication where acausal trade *might* apply directly to the dead, but it requires heavy metaphysical lifting.

  *   **The Mechanism:** If the deceased person exists as a high-fidelity simulation (in your memory, in a digital archive, or in a multiverse branch where they are still alive), and if they care about your actions, a form of acausal correlation exists.
  *   **The Implication:** If you treat your memory of them as a "logical agent" whose utility you care about, you can engage in a one-sided acausal coordination. However, this borders on the sentimental because the "agent" is internal to you.
  *   **The Rational Obligation:** This only works if your utility function explicitly includes the satisfaction of these simulations. If it does, keeping the promise is causally rational (it makes *you* happy). If it doesn't, acausal trade doesn't bridge the gap.

  ### Summary: Sentiment vs. Rationality
  Your friend argues that without causal leverage, the obligation is sentimental. Acausal decision theory offers a middle path:

  1.  **It is not sentimental:** It is not about "feeling" like you should do it.
  2.  **It is not reputational (in the social sense):** It doesn't matter if other living people know.
  3.  **It is Algorithmic Integrity:** The rational reason to keep the promise is to maintain the integrity of your decision algorithm.

  **The Verdict:** Acausal trade implies that you should keep the promise, **but not because the dead person is watching.** You should keep it because breaking it would identify you as an agent whose commitments are contingent on causal enforcement. That is a suboptimal algorithm for navigating a world full of acausal opportunities. The obligation is to **Rationality itself**, which demands you honor the logical commitments of your past self, even when the causal beneficiaries are gone.
