answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm in the Philosophy Department with Mara and Josh, though I work on philosophy of mind. Which means I spend my days worrying about how we know other people have thoughts, while Mara and Josh spend their days worrying about what happens when those thoughts look back at us.

  I had the privilege of running a reading group with them a few years ago on Part Three of *Being and Nothingness*. And when they asked me to give this toast, they gave me exactly one instruction. They said: "If you mention soulmates, if you say we were 'meant to be,' or if you suggest that fate brought us together, we will leave."

  Now, for most couples, that's just a preference. For Mara and Josh, that is an ontological commitment. To say they were "meant to be" would be to suggest they have an *essence* that preceded their *existence*. It would be to claim their marriage is a finished object, a destiny discovered rather than a life created. And as anyone who has read page one of *Being and Nothingness* knows, that is Bad Faith. That is lying to oneself to avoid the terrifying, beautiful weight of being free.

  So, I am not going to tell you that Mara and Josh are two halves of a whole. Sartre would argue there are no halves. There are only wholes, radically free, staring into the abyss of their own possibilities.

  I am also not going to tell you that "love makes everything easy." If you know Sartre's account of love, you know he describes it as a conflict. Each of us wants to be loved by a freedom that remains free, yet we want to be the entire world for that person. It is a tension that cannot be permanently resolved.

  But here is where I think Mara and Josh have found something that even Sartre might have missed in the gloom of 1943 Paris.

  Sartre argues that existence precedes essence. You are not born a "husband" or a "wife." You become one through your actions. And this, I think, is the most romantic thing you can possibly say to another person.

  It means that Mara and Josh are not resting on the laurels of a wedding day. They are not settling into a static role. Instead, they are undertaking a shared project. A marriage, in this light, isn't a safe harbor where you stop choosing. It is the daily, deliberate act of choosing each other again.

  When Josh looks at Mara, he doesn't see a fixed object. He sees a freedom. He sees a person who is constantly transcending who she was yesterday, reaching toward who she will be tomorrow. And Mara does the same for him. In a world that often tries to turn us into things—into employees, into consumers, into roles—Mara and Josh have promised to look at one another and say: "I see you. I see that you are free. And I choose to walk alongside that freedom."

  Sartre famously wrote, "Hell is other people." Mara is fond of pointing out that this is the most misquoted line in philosophy. He didn't mean that other people are torturers. He meant that we are always vulnerable to the judgment of others. We are always being "seen."

  But think about what it means to marry your witness. To marry the person who holds your Look.

  It means that when the world tries to define you, you have someone at home who knows the truth of your facticity. They know the brute facts of your life—the tired mornings, the dissertation stress, the quiet anxieties—and they do not turn you into an object because of them. They affirm your subjectivity. They remind you that you are more than what you have done; you are what you are yet to do.

  Yes, there will be conflict. Sartre would say it's inevitable. Two freedoms rubbing against each other will create friction. But friction is also what creates heat. It's what keeps the engine running. The goal of their marriage isn't to eliminate the tension between them. It's to sustain it without breaking. It's to look at the conflict and say, "This is not a sign that we are wrong for each other. This is a sign that we are both real."

  So, I cannot wish you a "happily ever after." That implies an ending. A state of rest. And for Sartre, to stop choosing is to stop existing authentically.

  Instead, I wish you this: May you always recognize the freedom in the other. May you never treat each other as a finished product. May you find comfort not in the idea that you were *destined* to be together, but in the knowledge that, out of all the possibilities in the universe, you *choose* to be together.

  May your marriage be a project that is never finished. May your facticity be shared, and your transcendence be mutual. And may you always, always look at one another, and see not a cage, but a horizon.

  To Mara and Josh.
