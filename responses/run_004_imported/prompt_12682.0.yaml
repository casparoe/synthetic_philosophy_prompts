      *   *Tea/Coffee:* He generally preferred water and had strong opinions against tea (called it "morning poison" in some letters/notes, though in *Ecce Homo* he focuses more on water and light meals). I need to be careful not to misquote the tea/coffee stance. He actually says in *Ecce Homo*: "I have given up tea... coffee makes one gloomy." He preferred water. I should frame this as "strong opinions on beverages" to be safe, or specify water. *Correction:* In *Ecce Homo*, Section 1, he says: "I have given up tea... coffee makes one gloomy." So she likely avoids both or has a strict ritual. Let's stick to the prompt's mention of "strict opinions on tea versus coffee."
      *   *Boulder/Climate:* Nietzsche sought high altitude and dry air (Sils-Maria, Nice, Turin). Boulder fits the "high altitude" profile.
      *   *Breakfast:* He advocated for very light meals. "A heavy breakfast... is the foundation of stupidity."
      *   *The Irony:* Nietzsche's health was terrible (migraines, blindness, syphilis/mental collapse). He collapsed in Turin (Jan 1889). He praised Turin's climate initially.
      *   *Eternal Recurrence:* The idea that you have to live your life over and over exactly the same. The ultimate "Yes" to life.

