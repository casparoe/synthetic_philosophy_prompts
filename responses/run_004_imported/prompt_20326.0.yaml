      *   *The Measurement Problem:* Robbins says we can't compare. Harsanyi says we can (via empathy/assumptions). Sen says we should compare *functionings/capabilities* rather than utility.
      *   *The "Prior Choice" Insight:* The instructor's point is that the *metric* carries the normative weight. If you choose subjective utility, you get one result. If you choose capabilities, you get another. The utilitarian calculus ($\sum W$) is just the engine; the fuel (the measurement of $W$) determines the direction.

