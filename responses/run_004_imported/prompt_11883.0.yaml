answer: |-
  Here is a sequence of ten questions designed to progressively tighten the pressure on the "no function yet" deflection, moving from standard edge cases to metaphysical commitments.

  ### Phase 1: The Temporal Problem of "Yet"

  **Question 1:**
  "Let's begin with the standard case for your view. Consider a novel mutation that arises in a population and immediately confers a significant survival advantage, but has not yet been fixed by selection. You argue this trait has a beneficial *effect* but no proper *function* 'yet.' Could you specify the threshold? At what precise point in the causal history does the effect metamorphose into a function? Is it the first reproduction, fixation in the population, or something else?"

  *   **Likely Reply:** She will likely say it requires a minimal history of selection, perhaps fixation or at least one successful transmission that is *explained* by the trait's benefit.
  *   **Follow-up:** "If it requires fixation, then for the vast majority of a trait's early existence, biologists are wrong to call it functional. If it requires only one transmission, doesn't that make 'function' incredibly fragile? If that single lineage dies out the next generation, does the function retroactively vanish?"

  **Question 2:**
  "Following up on that fragility: Imagine a lineage where a beneficial trait arises but the population goes extinct due to a meteor strike before selection can act on it. On your account, that trait never had a function. But counterfactually, if the meteor had missed, it *would* have been selected. Does the existence of a function depend on the contingent survival of the lineage, rather than the causal properties of the trait itself?"

  *   **Likely Reply:** She will likely bite the bullet: "Yes, proper functions are historical facts, not modal or counterfactual ones. No history, no function."
  *   **Follow-up:** "This leads us to a harder case. If history is the sole arbiter, what do we say about an organism assembled with *no* evolutionary history behind it at all?"

  **Question 3 (The 'No History' Requirement):**
  "Consider a synthetic organism created in a lab from non-living components, or a 'Swampman' biological duplicate, that is capable of metabolism and reproduction but has no ancestral lineage. There is no 'yet' here; there will be no past selection to appeal to, even in principle, for this specific token. Do you deny that its heart pumps blood *as a function*? If so, does this mean synthetic biology is literally incapable of creating functional systems, only functional-looking effects?"

  *   **Likely Reply:** She will likely maintain consistency: "Without a history of selection, there are no proper functions, only causal capacities. We might speak loosely, but strictly speaking, it has no functions."
  *   **Follow-up:** "If this synthetic organism's heart stops pumping, can we say it is *broken*? If it has no functions, it seemingly cannot malfunction. But surely engineering relies on the distinction between a synthetic heart that fails and one that succeeds. Are you suggesting that 'malfunction' is also an illusion in ahistorical contexts?"

  ### Phase 2: Decoupling History and Utility

  **Question 4 (The Exaptation Requirement):**
  "Let's move to traits where history and current utility come apart. Take feathers: originally selected for thermoregulation, now essential for flight. The etiological account says the 'real' function is thermoregulation (or whatever the origin was), and flight is merely a beneficial effect. But in modern avian biology, flight is treated as the paradigmatic function. Why should the historical origin trump the current systemic role that actually explains the organism's survival *now*?"

  *   **Likely Reply:** "The historical account explains why the trait is *there* at all. The current effect explains why it stays. We need the history to ground the normativity."
  *   **Follow-up:** "But if the thermoregulatory benefit is lost and only flight remains, does the feather lose its function entirely until a new selective history for flight is written? That implies a period where the trait is functionless despite being essential for life."

  **Question 5:**
  "Connected to exaptation: In cases of co-option, the structure is often modified for the new role. If the structure changes to better suit the *new* effect, isn't the selective history actively being rewritten to support the new role? Why treat the 'original' history as the metaphysical anchor rather than the ongoing, dynamic history of maintenance selection?"

  *   **Likely Reply:** "Maintenance selection can ground function, but it must be selection for *that* effect. If the shift is recent, the history for the new effect is too short."
  *   **Follow-up:** "So we return to the 'how long is long enough' problem. It seems the etiological account creates a 'function gap' during evolutionary transitions where biologists see continuity. Why privilege the gap over the continuity?"

  ### Phase 3: Normativity and Malfunction

  **Question 6 (The Malfunction Requirement):**
  "A central motivation for your view is handling malfunction. You argue that Causal-Role (CR) theorists struggle to distinguish a broken heart from a heart doing something else. However, CR theorists like Cummins or Boorse argue malfunction is simply a failure to contribute to the capacity of the containing system, or a statistical deviation from species-typical design. Why is 'failing to do what ancestors did' a superior normative standard to 'failing to do what the system currently needs'?"

  *   **Likely Reply:** "CR accounts can't distinguish a malfunctioning heart from a heart that is functioning to make a thumping sound. Only history fixes the *correct* contribution."
  *   **Follow-up:** "But in a physiological context, the 'system need' (circulation) is what defines the organ's identity *now*. If a heart pumps but doesn't circulate due to a blockage, the CR theorist says it fails the system requirement. Why is appealing to dead ancestors necessary to ground that judgment? Does the ghost of selection past do any work the current system topology doesn't?"

  **Question 7:**
  "Consider a trait that was selected for in the past but is now maladaptive in a changed environment (e.g., a moth's camouflage on soot-covered trees that are now clean). Your account says it still has the *function* of camouflage, even if it kills the organism. Doesn't this sever the conceptual link between 'function' and 'good for the organism'? If a function can be lethal, what explanatory work is the term 'function' doing beyond 'historical cause'?"

  *   **Likely Reply:** "Function is not about current goodness; it's about teleology. We need to explain why the trait is there, even if it's now a mismatch."
  *   **Follow-up:** "But if biologists use 'function' to predict what the trait *will do* for survival, and your definition points to what it *did* do for survival, aren't you and the biologists talking past each other?"

  ### Phase 4: Scientific Practice

  **Question 8 (The Practice Requirement):**
  "Turning to scientific practice: When a physiologist or comparative anatomist assigns a function to a trait, they rarely consult a phylogeny or a selection history. They look at the structure, the current environment, and the systemic contribution. Are you committed to the claim that working biologists are systematically mistaken when they assign functions based on current causal roles without verifying selective history?"

  *   **Likely Reply:** "Biologists often speak loosely. They conflate 'capacity' with 'proper function.' Philosophy's job is to clarify the distinction they often blur."
  *   **Follow-up:** "If the distinction is so crucial for understanding biology, why is it invisible in the daily practice of biology? If their 'loose' talk successfully predicts, explains, and intervenes in biological systems without your historical constraint, isn't the constraint philosophically idle?"

  **Question 9:**
  "Following that: If your account is revisionary—telling biologists they should stop calling certain causal roles 'functions'—what do they gain by adopting your terminology? If they say 'The function of X is Y' (based on current role) and you say 'No, the function is Z' (based on history) or 'No function yet,' does your correction help them build better models, or does it merely police their language?"

  *   **Likely Reply:** "It prevents errors in evolutionary explanation. It stops them from assuming every beneficial effect is an adaptation."
  *   **Follow-up:** "But adaptationism is a separate debate. Can't we warn against adaptationism without stripping the term 'function' from beneficial, non-selected traits? Why must the solution to adaptationism be a restriction on functional ascription?"

  ### Phase 5: The Exit

  **Question 10 (The Falsification Requirement):**
  "Finally, I'd like to ask about the resilience of the etiological analysis. We've discussed synthetic organisms, exaptations, and mismatches. In each case, you have qualified the account or bitten a bullet to preserve the core definition. Is there any empirical finding or thought experiment that would lead you to abandon the etiological analysis entirely? Or is the claim that 'function is selected effect' a metaphysical commitment that is insulated from counterexample by definition?"

  *   **Likely Reply:** (This is the hardest spot for her). She might say, "If we found that selection played no role in the persistence of traits, but that seems impossible for biology."
  *   **Follow-up:** "If the answer is that the definition holds come what may for any biological system, then aren't we left with a tautology? If 'biology' implies 'selection' and 'function' implies 'selection,' does the theory tell us anything about the world, or only about how we've chosen to define our words?"
