          *   *Sophisticated Agent:* At step 1, I look ahead. I see I will end up at C - $3\epsilon$. I prefer C (original) to C - $3\epsilon$. So I refuse Step 1.
          *   *Problem:* Refusing Step 1 means keeping C when offered A + $\epsilon$ (effectively). But I prefer A to C. So refusing violates my local preference A > C.
          *   *Conflict:* Dynamic Consistency vs. Local Preference.
