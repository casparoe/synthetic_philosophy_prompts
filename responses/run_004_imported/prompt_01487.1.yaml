  3.  **Address the "Escape Routes" (Sophistication & Resoluteness):**
      *   *The Objection:* If I know I prefer A > B > C > A, and I start with C. Someone offers A for C + $\epsilon$. I take it. Then B for A + $\epsilon$. I take it. Then C for B + $\epsilon$. *Wait*, if I take this, I'm back at C but poorer. A *sophisticated* agent (in the game-theoretic sense) anticipates their future self's choices.
      *   *Sophisticated Choice:* The agent treats their future selves as distinct players in a game. If Future-Me will make me poorer, Present-Me refuses the first trade.
      *   *Resolute Choice:* The agent commits to a plan and sticks to it, overriding local preferences.
      *   *The Counter-Counter (Rabinowicz & others):* Can we construct a pump that works even on these agents?
