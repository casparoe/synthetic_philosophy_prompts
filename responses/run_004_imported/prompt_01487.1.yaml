      *   *Resoluteness:* Associated with McClennen (1990). Planning and sticking to it.
      *   *Rabinowicz:* Wlodek Rabinowicz. He wrote "Money Pump with a Sophisticated Agent" (or similar). He showed that if the agent knows they are in a pump, they might still get caught if the choice architecture prevents effective pre-commitment or if the "refusal" leads to a worse outcome based on the *same* intransitive preferences.
