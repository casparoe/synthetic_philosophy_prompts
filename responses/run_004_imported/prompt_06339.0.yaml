answer: |-
  You have not gone crazy, your friends are not lying, and the count wasn't rigged. You and your friends have accidentally rediscovered one of the most famous problems in mathematics and economics: **Arrow's Impossibility Theorem.**

  In short: **There is no perfect voting system.** Every single method has mathematical flaws that can produce "unfair" results under specific conditions.

  Here is a breakdown of why this happened, why switching to a majority vote might make it worse, and how to actually fix this for your friend group without ruining friendships.

  ### 1. Why the Math Betrayed You
  You experienced two specific phenomena that voting theorists study:

  **The Method Conflict (IRV vs. Borda)**
  *   **Ranked-Choice (Instant Runoff):** This method prioritizes **majority support**. It asks, "Who can get over 50% of the vote?" It eliminates the weakest links and transfers their votes. It is good at finding a candidate that is acceptable to the majority, but it can eliminate a "consensus candidate" early if they didn't have enough passionate #1 supporters.
  *   **Points System (Borda Count):** This method prioritizes **consensus**. It asks, "Who has the highest average ranking?" A destination that everyone ranks as their #2 choice will often beat a destination that half the group ranks #1 and the other half ranks last.

  **The "Irrelevant" Alternative (IIA Violation)**
  You mentioned that removing a destination with zero first-choice votes flipped the winner. In voting theory, this is a violation of the **Independence of Irrelevant Alternatives (IIA)**.
  *   In a perfect world, if Candidate C is losing, removing them shouldn't change the race between Candidate A and Candidate B.
  *   In the **Points System**, this happens because the *value* of the ranks changes. If you have 5 options, 1st place might be worth 5 points. If you delete one, 1st place is now worth 4 points. This rescaling changes the mathematical weight of everyone's preferences, altering the final total.
  *   In **Ranked-Choice**, removing a candidate changes where their (non-existent) votes would have transferred, which alters the elimination order of the remaining candidates.

  **The Verdict:** The system isn't rigged; it's just that "Fairness" is not a single definition. Is it fairer to go where the most people get their #1 pick (Points/IRV conflict)? Or is it fairer to go where the fewest people are miserable (Consensus)? The math says you can't optimize for both simultaneously.

  ### 2. Why "Majority Vote" (Plurality) Won't Save You
  Half your group wants to scrap ranking and just do a simple "Pick One" vote. This is usually the worst option for a group of 7.
  *   **The Spoiler Effect:** If you have two similar beach towns, they will split the "beach vote," and a mountain cabin will win even if 5 out of 7 people preferred a beach.
  *   **Polarization:** It forces people to vote strategically rather than honestly. You end up voting for the "lesser evil" rather than what you actually want.
  *   **The 4-vs-3 Problem:** In a group of 7, a majority is 4. A bloc of 4 friends can conspire (consciously or not) to always send the other 3 somewhere they hate. Ranked voting was actually an *attempt* to prevent this tyranny of the majority.

  ### 3. Practical Solutions for Friend Groups
  Since math cannot give you a perfect result, you need a **social solution**. For a recurring trip with friends, the goal isn't mathematical perfection; it's long-term equity and minimizing resentment.

  Here are four methods that work better than voting for small groups:

  **A. The "Veto" Method (Highly Recommended)**
  Instead of voting for where to go, vote on where *not* to go.
  1.  Everyone submits a list of 3-5 destinations they would be happy with.
  2.  Combine them into a master list.
  3.  Everyone gets **one hard Veto**. If even one person vetoes a place, it is dead.
  4.  If multiple places remain, pick randomly among them.
  *Why it works:* It ensures nobody is dragged somewhere they truly hate. It prioritizes group cohesion over individual preference.

  **B. The Rotation System**
  Accept that you cannot please everyone every year.
  1.  Rotate the decision-making power. Year 1, Person A picks (within a budget). Year 2, Person B picks.
  2.  Or, rotate the "theme." One year beach, one year city, one year hiking.
  *Why it works:* It guarantees long-term fairness. You know your turn is coming.

  **C. Approval Voting**
  Instead of ranking, everyone gets 3 "stamps" of approval.
  1.  List all options.
  2.  Each person can stamp up to 3 places they would be genuinely happy to visit.
  3.  The place with the most stamps wins.
  *Why it works:* It is simpler than ranking but avoids the "Spoiler Effect" of majority voting. It finds the destination with the broadest appeal.

  **D. The "Committee" Compromise**
  1.  Three people volunteer to be the "Planning Committee."
  2.  They narrow the options down to two finalists.
  3.  The whole group votes on those two.
  *Why it works:* It reduces the noise. With 7 people, too many opinions create paralysis. A sub-committee can negotiate the details before presenting choices to the group.

  ### Summary
  You are right to be frustrated, but you should tell your friends this: **"Math proves that no voting system is perfect. We aren't bad at counting; the system is inherently flawed."**

  If you want to stop the drama:
  1.  Stop trying to find the "perfect" destination via algorithm.
  2.  Adopt the **Veto Method** for this year to ensure safety.
  3.  Adopt the **Rotation System** for future years to ensure fairness.

  The trip is about the friends, not the location. If the voting process is causing more stress than the work planning the trip, the process is the problem, not the math.
