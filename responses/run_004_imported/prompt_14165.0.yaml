        },
        {
          "section": "Fuller on Grudge Informer",
          "points_awarded": 5,
          "max_points": 5,
          "comment": "Accurately explains Fuller's position that the Nazi system failed the inner morality, meaning no valid law existed to begin with."
        },
        {
          "section": "Fuller's Inner Morality",
          "points_awarded": 5,
          "max_points": 5,
          "comment": "Good definition. Correctly identifies the principles as procedural (generality, publicity, consistency)."
        },
        {
          "section": "Inner Morality vs. Minimum Content",
          "points_awarded": 0,
          "max_points": 5,
          "comment": "Major conceptual error. You argued they are 'basically the same,' but Hart's minimum content is substantive/survival-based (descriptive), while Fuller's is procedural/morality-based (normative). Hart maintains law can be evil; Fuller argues procedural failure makes it non-law. This contradicts the prompt's instruction to explain why they are NOT the same."
        }
      ]
    }
  }
  ```

  ### Why this grade is defensible if they push back:
  If your classmate asks why they lost 5 points on the last section, you can point out that **Hart explicitly denies** that his "minimum content" is a "moral minimum built into law" in the way Fuller suggests. Hart calls it "natural law" only in a minimal sense based on contingent facts (humans need to eat, aren't invulnerable), not because it makes the law morally good. Fuller, conversely, argues that following the inner morality *is* a moral achievement that respects human agency. Conflating the two erases the main disagreement of the Hart-Fuller debate.
