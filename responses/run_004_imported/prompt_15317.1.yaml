prompt: |-
  I was recently given a diagnosis that has made the question of life after death considerably less abstract, and, having trained as a mathematician with no religious upbringing to fall back on, I've found myself returning to Kurt Gödel's private case for an afterlife rather than to anything more conventional. Gödel's reasoning was not an appeal to scripture but to his Leibnizian conviction that the world is fundamentally rational, that nothing happens without sufficient reason, and that a mind elaborately built up over decades, only just becoming capable of grasping mathematics, ethics, and beauty, could not simply be annihilated the moment it matures without the whole arrangement being pointless. He took the argument seriously enough to defend it in earnest letters to his own mother, despite being, by every other measure, the last person inclined toward wishful thinking.

  Write a short story in which a character β€” who need not be a mathematician, or even aware of Gödel by name β€” comes to lean on exactly this style of argument, rather than on any more conventional source of consolation, at a moment when it matters to them personally. Treat the argument as a real piece of reasoning the character is actually working through, not merely as a symbol of hope, and don't feel obliged to resolve whether it succeeds.
