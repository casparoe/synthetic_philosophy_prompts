answer: |-
  The envelope from the oncologist sat on the workbench, pinned under a brass gear weight to keep it from sliding into the sawdust. Elias didn't open it again. He knew the words. *Aggressive. Terminal. Months.*

  He was sixty-two. He wiped oil from his thumbs onto a rag and looked at the clock on the wall. It was a 19th-century regulator, stripped to its bones. He had spent three years restoring it. Three years to understand the specific idiosyncrasies of its escapement, the way the pendulum liked to catch on the humid days of November. He knew this machine better than he knew the face of his wife, Martha, who was currently in the kitchen making tea she wouldn't drink.

  People were already calling. He could hear the phone vibrating in the other room. They would offer him prayers. They would offer him the idea of a pearly gate, a reunion, a cloud of witnesses. Elias was a man of mechanisms. He did not believe in clouds. He believed in tension, in torque, in the conservation of energy.

  He picked up a loupe and screwed it into his right eye, though there was nothing left to fix on the bench. He needed to fix the thought that was eating him. It wasn't the pain he feared; it was the waste.

  He closed his eyes and began to run the calculation. It was not a mathematical equation, but it had the same rigid structure.

  *Premise One:* The universe operates on a principle of economy. Energy is not created or destroyed; it transforms. Matter is not lost; it recycles. Nature does not stutter. A spider does not weave a web of perfect geometry only to burn it before the first fly arrives. A tree does not spend a century growing rings, deep and complex, only to rot before dropping a single seed.

  *Premise Two:* Consciousness is the most complex mechanism known to exist. It is not instantaneous. It is not a switch that is flipped at birth. It is a structure built layer by layer.

  Elias thought of himself at twenty. He had been strong, fast, hungry. But he had been stupid. He understood mechanics, but he did not understand patience. He understood lust, but he did not understand love. He understood logic, but he did not understand ethics.

  He thought of himself at forty. The layers were thicker. He could see the consequences of his actions. He could appreciate the silence between notes in a piece of music.

  He thought of himself now, at sixty-two. He had only just become useful. Only in the last five years had he truly mastered his craft. Only in the last five years had he learned to listen to Martha without formulating a response while she spoke. Only now could he look at a sunset and feel a sensation that wasn't just visual, but historical, geological, emotional. The machine was finally calibrated. The lens was finally ground to the correct curvature.

  *The Contradiction:* If the universe is rational, and if nature avoids waste, why build a machine of such staggering complexity, requiring six decades of calibration, only to dismantle it the moment it achieves peak function?

  To Elias, this was not hope. This was bad engineering.

  It would be like building a telescope capable of seeing the edge of the galaxy, shipping it to the mountaintop, and then smashing the lens with a hammer before anyone looked through it. It rendered the construction phase irrational. It made the struggle of the first sixty years a lie.

  "Tea's ready," Martha said from the doorway.

  Elias removed the loupe. His eye felt cold. "Thank you."

  She came in, holding two mugs. She looked at the envelope under the weight. She didn't ask. She set the tea down and leaned against the bench, her hip pressing against his thigh. She was crying, quietly. She had already done the grieving he was currently trying to logic his way around.

  "Mrs. Gable called," Martha said. "She wants to bring the pastor by."

  Elias shook his head. "Not the pastor."

  "Elias, please. It's what people do."

  "People do it because they are afraid of the silence," Elias said. He picked up the brass gear. It was heavy, cool. "I'm not afraid of the silence. I'm afraid of the nonsense."

  "What does that mean?"

  "It means," Elias said, turning the gear over in his fingers, "that I don't believe I'm going to cease. Not because I have a soul. But because it would be inefficient."

  Martha stared at him. "Inefficient?"

  "Look at this clock," he said, gesturing to the regulator. "If I spent three years fixing it, only to throw it in the furnace before it chimed once, you would call me a madman. You would say I didn't understand the purpose of the clock."

  "This is different, Eli. We aren't clocks."

  "Aren't we?" He tapped his temple. "How long did it take to make this?" He pointed to his own head. "Twenty years to grow. Forty years to learn. Sixty to refine. I am just now, Martha, just *now* capable of grasping what you mean when you say you're tired. I am just now capable of understanding the value of the time we lost in the eighties. The instrument is tuned. The music is ready to be played."

  He looked at her, searching for a flaw in the logic. He wanted her to find it. He wanted her to tell him he was being arrogant, that the universe owed him nothing. It would be easier if the universe was cruel. Cruelty was random; it could be endured. But pointlessness? Pointlessness was a structural failure.

  "If I die next month," Elias continued, his voice low, steady, "then the entire process of 'Elias' was a draft. A sketch. But nature doesn't do sketches. Nature does organisms. It pushes toward complexity. To stop here, at the point of maximum complexity, violates the trend of everything else I have ever observed."

  "So you think you're going to... what? Wake up?" Martha asked. Her voice was thick. She wasn't comforted; she was bewildered.

  "I think," Elias said, "that the data suggests continuity. If the world is rational, then consciousness cannot be an anomaly that vanishes without a trace. That is thermodynamics of the spirit. Energy does not vanish. Why should the pattern?"

  "That's not science, Elias."

  "It's the only science that fits the observations," he countered. "To believe I end is to believe that the universe builds a cathedral to house a ghost, then burns the cathedral before the ghost arrives. I cannot accept that the architect is incompetent."

  Martha reached out and took his hand. Her fingers were trembling. "I don't care about the architect. I care about you. Here. With me."

  "I know."

  "If you're wrong," she whispered, "then this is it. This tea. This room. This is all there is."

  Elias looked at the steam rising from the mugs. He looked at the envelope. He considered the possibility that he was merely comforting himself with a sophisticated fairy tale. He considered that his brain, facing its own extinction, was firing off last-ditch synapses to create a narrative of order where there was only chaos.

  He weighed that possibility. It was heavy.

  "If I am wrong," Elias said slowly, "then the waste is real. And if the waste is real, then the universe is not rational. And if the universe is not rational, then my fear is as meaningless as my hope."

  He paused. He felt the solid wood of the bench beneath his elbows. He felt the warmth of Martha's hand.

  "But I don't think it's irrational," he said. "I have spent forty years fixing things that were broken because people didn't understand how they worked. I have learned that when a thing stops working, there is a reason. A worn pivot. A broken spring. There is always a sufficient reason."

  He looked at Martha.

  "I cannot find the sufficient reason for this," he said, tapping his chest. "I cannot find the mechanical justification for why this understanding, this love for you, this ability to fix the clock... why it should be deleted. There is no mechanism for deletion that I can see. There is only transformation."

  Martha didn't nod. She didn't smile. She didn't say *Amen*. She was a woman who lived in the world of flesh and blood, not premises and conclusions. But she stopped trembling. She leaned her forehead against his shoulder.

  "You're scared," she said.

  "Yes."

  "Does the math help?"

  "It holds the fear at bay," Elias admitted. "It gives the fear a shape. If I am right, then I am not dying. I am transitioning. If I am wrong, then I am not here to regret being wrong."

  "That's cold, Eli."

  "It's the only warmth I have."

  He picked up the tea. He took a sip. It was bitter, hot, real. He looked at the clock on the wall. The pendulum swung. Left. Right. Left. Right. It did not ask where it was going. It simply maintained the rhythm.

  Elias set the cup down. He reached for the envelope, slid it out from under the weight, and put it in the drawer. He didn't need to read it again. The diagnosis was a fact of the body. It was not a fact of the system.

  "Hand me the screwdriver," Elias said. "The regulator is gaining two seconds a day. If I'm going, I'd rather leave it keeping correct time."

  Martha wiped her eyes. She looked at him for a long moment, searching his face for the man she married, the man who believed in gears and gravity. She saw him there, still standing behind the eyes, using the only tools he had left to shore up the walls of the dark.

  She reached into the tray and handed him the screwdriver.

  "Two seconds," she said.

  "Two seconds," Elias confirmed.

  He turned back to the clock. He didn't know if he would wake up. He didn't know if the cathedral would burn. But he knew that a mind built over sixty years was not a thing to be discarded lightly, and he trusted the universe to be a better engineer than that. He fit the screwdriver into the slot, found the tension, and began to turn.
