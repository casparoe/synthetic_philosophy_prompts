      *   *Principle of Tolerance:* There is no "correct" logic or linguistic framework. Frameworks are chosen based on pragmatic utility (fruitfulness, simplicity, efficiency).
      *   *Sympathy for Socialism:* Acknowledged in *Intellectual Autobiography* and the 1929 Manifesto.

  3.  **Analyze the "Calculation Debate" Context:**
      *   *Neurath's Position:* Money is a veil; calculation in kind (*Naturalrechnung*) is possible and preferable for a socialist economy.
      *   *Mises/Hayek's Position:* Without market prices, there is no common unit of account to compare heterogeneous goods, leading to irrational allocation (the "economic calculation problem"). Hayek added the epistemic point about dispersed knowledge.
      *   *Modern Revival:* Big Data, AI, and cybernetics (Cockshott, Cottrell, etc.) suggest the informational constraint is solvable.

  4.  **Synthesize: Carnap meets the Calculation Debate:**

      *   *Point 1: The Empirical/Normative Distinction.*
          *   Carnap famously distinguishes between *external* questions (framework choice, pragmatic/normative) and *internal* questions (truth within a framework, empirical/logical).
          *   The question "Is socialism desirable?" is external/volitional.
          *   The question "Can a planned economy calculate efficiently?" is internal/empirical (within the framework of economic science).
          *   *Verdict:* Carnap would insist on separating them *in principle*. However, the *definition* of "efficiently" might involve framework choices.

      *   *Point 2: The Principle of Tolerance and Frameworks.*
          *   Mises/Hayek assume a specific linguistic framework (neoclassical economics with price signals as necessary syntax).
          *   Neurath proposes a different framework (physicalist, in-kind units).
          *   Carnap would say neither is "true" in an absolute sense. The question is: Which framework is more *fruitful* for the goal of social organization?
          *   If modern computation makes the "in-kind" framework fruitful (i.e., it works), then the Misesian objection loses its force *within that framework*.

      *   *Point 3: Verificationism and the "Impossibility" Claim.*
          *   Mises' claim was often a priori (praxeological). Carnap rejects synthetic a priori knowledge.
          *   For Carnap, "Planning is impossible" is an empirical hypothesis, not a logical truth.
          *   Therefore, new data (computational capacity) can falsify the "impossibility" claim. Carnap would welcome this empirical testing.

      *   *Point 4: The Bleed-Over (The "Dissertation" Angle).*
          *   Would his sympathies bias him?
          *   Carnap strove for *scientific objectivity*. He viewed philosophy as the logic of science.
