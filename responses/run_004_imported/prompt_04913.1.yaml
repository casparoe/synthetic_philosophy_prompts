          *   He might frame the empirical question in a way that favors Neurath *if* he believes the physicalist language is more fruitful for social science generally, not just for socialism.
          *   *Crucial Nuance:* Carnap wouldn't say "Socialism is true." He would say "If we adopt the goal of equitable distribution (volition), then the physicalist planning framework is now empirically viable (fact), whereas previously it was not."

