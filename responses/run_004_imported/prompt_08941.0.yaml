  *(Self-Correction Note during drafting)*: I need to make sure Priya addresses the "DefectBot is also an equilibrium" point directly. She can't just wave it away. Her argument should be about *design choice*. In standard PD, you are the player. In Program Equilibrium, you are the *programmer*. You can commit to FairBot. You can't commit in standard PD. That's the distinction.

