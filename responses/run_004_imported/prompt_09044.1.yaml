answer: |-
  # The Corpse in the Operating Room: Why Causal Decision Theory Dies in Damascus

  You are right to feel that Death in Damascus is the graveyard of Causal Decision Theory (CDT). While Newcomb's Problem allows CDT proponents to dig in their heels behind a dominance argument ("My choice can't causally affect the money already in the box"), Damascus removes that trench. In Damascus, your choice *correlates* with Death's location, but CDT insists it doesn't *cause* it. This creates a feedback loop where the probability of Death's location shifts with your deliberation, leaving standard CDT oscillating endlessly or crashing.

  You asked for a verdict, not a survey. So here it is: **Causal Decision Theory is fundamentally broken for problems involving prediction, and its "ratifiability" patch is a mathematical confession of failure.** Evidential Decision Theory (EDT) gets the right answer in Damascus but for fatalistic reasons that cripple it elsewhere. **Functional Decision Theory (FDT), bolstered by the Levinstein and Soares critique, is the only framework that correctly diagnoses the logical structure of the problem.** It reveals that the "choice" in Damascus is not about moving your body, but about selecting the output of an algorithm that Death has already simulated.

  Here is why CDT must be abandoned, why EDT is merely lucky, and why FDT is the only theory that tells the truth.

  ### The CDT Collapse and the Ratifiability Hack

  To understand why Damascus is fatal to CDT, you have to see why Newcomb wasn't. In Newcomb, CDT says two-box because it claims your choice cannot reach back in time to move the money. It's a bold claim, but it relies on a clean causal separation: the predictor acts *before* you choose.

  In Damascus, the separation vanishes. Death's location is determined by a prediction of your choice. CDT tries to treat Death's location as a fixed state of the world independent of your decision procedure. It asks: "Given that Death is in Damascus, should I stay?" (Go). "Given that Death is in Aleppo, should I stay?" (Stay). Since CDT refuses to admit that its own deliberation *updates* the probability of Death's location, it cannot settle on an action. It chases its own tail.

  The standard fix is **ratifiability**. A decision is ratifiable if, once you condition on having made it, it remains the best option. In Damascus, neither "Stay" nor "Go" is ratifiable. If you decide to Stay, you infer Death is in Damascus, so you should have Gone. If you decide to Go, you infer Death is in Aleppo, so you should have Stayed. The only ratifiable solution is a **mixed strategy**: randomize 50/50 to make yourself unpredictable.

  This is absurd. It is a theory of rationality telling you to flip a coin to confuse an infallible predictor. If Death is truly infallible, Death predicts the coin flip. You die in Aleppo half the time and Damascus half the time, and you've wasted the cab fare on the Aleppo trips. If Death *cannot* predict the coin flip, then Death is not infallible, and the problem setup has changed mid-stream. Ratifiability saves the math of CDT by sacrificing the coherence of the agent. It admits that a rational agent cannot deterministically choose an action in the face of perfect prediction. That isn't a solution; it's a surrender. CDT fails because it treats the agent's decision as a causal lever disconnected from the predictor's simulation, when in reality, they are logically entangled.

  ### EDT: Right Action, Wrong Metaphysics

  Evidential Decision Theory glides through Damascus without breaking a sweat. It calculates the expected utility conditional on the action.
  *   $E[\text{Stay}] = P(\text{Death in Dam} | \text{Stay}) \times 0 + P(\text{Death in Ale} | \text{Stay}) \times 100$.
  *   Since Death predicts perfectly, $P(\text{Death in Dam} | \text{Stay}) \approx 1$.
  *   So, $E[\text{Stay}] \approx 0$ (minus the cost of travel, which is 0).
  *   $E[\text{Go}] \approx 0$ (minus the cost of travel, which is 1).
  *   EDT says: **Stay.** You save the cab fare.

  EDT gets the correct verdict: since you are going to die either way, don't waste money on the cab. But EDT's justification is metaphysically toxic. EDT treats your choice as *evidence* of Death's location. It implies a kind of magic: "By choosing Stay, I make it more likely Death is in Damascus." This works in Damascus because the correlation is perfect, but it leads to errors in problems like the "Smoking Lesion," where EDT tells you not to smoke to avoid cancer, even if smoking doesn't cause cancer (it's just correlated with a gene).

  EDT survives Damascus by adopting a fatalism that renders agency illusory. It tells you to Stay not because it's the best strategy, but because it's the best *news*. A decision theory should guide action, not curate evidence. EDT is right in Damascus only because the world is rigged such that evidence and causation collapse into each other. It is a lucky guess, not a robust principle.

  ### The FDT Verdict: Logical Dependence and the Incoherence of "Choice"

  This brings us to Functional Decision Theory (FDT) and the critique by Levinstein and Soares ("Cheating Death in Damascus"). FDT argues that you should not evaluate actions, but **decision algorithms**. You ask: "What output from my decision function yields the best result?"

  In Damascus, Death is not predicting your *action* via magic; Death is simulating your *algorithm*. If your algorithm outputs "Go," Death goes to Aleppo. If your algorithm outputs "Stay," Death goes to Damascus. This is not a causal relationship (your choice doesn't push Death's legs), nor is it merely evidential (your choice isn't just a sign). It is a **logical dependency**. Your decision and Death's prediction are two instantiations of the same logical fact.

  Levinstein and Soares push this further. They argue that the standard formulation of Damascus relies on impossible counterfactuals. CDT asks, "If I were to Go, where would Death be?" But if Death is infallible, the counterfactual "If I were to Go" implies "If Death predicted Go." You cannot hold Death's location fixed while varying your choice. The setup demands you accept that your choice is *already known*.

  FDT accepts this logical lock. It recognizes that if the predictor is infallible, **you cannot survive.** The outcome is fixed by the logical fact of your algorithm's output. Therefore, the only variable left to optimize is the cab fare. FDT recommends **Stay**, matching EDT's action.

  However, FDT differs crucially in *why*. EDT says, "Stay, because choosing Stay is good news." FDT says, "Stay, because my algorithm is deterministic, Death knows it, and 'Stay' is the output that minimizes loss given the inevitable."

  More importantly, FDT dissolves the ratifiability paradox. FDT doesn't look for a mixed strategy to "confuse" the predictor. It recognizes that if you can randomize, that randomization is part of the algorithm Death simulates. If you randomize, Death randomizes. You still die. The only reason to randomize is if you believe you can introduce entropy that Death *cannot* predict. But if Death is infallible, you can't. If Death is fallible, CDT might work, but the problem changes. FDT forces you to confront the coherence of the setup.

  ### The Verdict

  Here is the position you can take to the meetup:

  **Causal Decision Theory is falsified by Death in Damascus.** Its inability to handle logical correlations without resorting to the absurdity of ratifiable mixed strategies shows it lacks the vocabulary to describe a world containing predictors. The "ratifiability" patch is an admission that CDT cannot handle cases where the agent's decision is logically entangled with the environment. It treats the agent as a ghost in the machine, causally isolated from the very predictions that define the scenario.

  **Evidential Decision Theory is instrumentally correct but theoretically bankrupt.** It gives the right answer (Stay) but relies on a conflation of correlation and control that fails in other medical or genetic Newcomb-like problems. It survives Damascus by accident, not by design.

  **Functional Decision Theory is the winner.** It correctly identifies that the correlation between your choice and Death's location is **logical**, not causal or merely statistical. By treating the decision as the output of a function that Death simulates, FDT avoids the oscillation of CDT and the fatalistic magic of EDT. Furthermore, the Levinstein and Soares critique confirms that FDT is the only theory robust enough to identify when a decision problem's counterfactuals are incoherent.

  If you want to pick a fight, tell the CDT proponent this: **"You are recommending I flip a coin to confuse an infallible predictor. If the predictor is infallible, the coin flip is predicted, and I die. If the coin flip isn't predicted, the predictor isn't infallible, and your causal model is wrong. You are either recommending suicide or solving a different problem. My theory recognizes the logical lock, accepts the inevitable, and saves the cab fare."**

  Damascus isn't a puzzle about where to go. It's a test of whether your decision theory understands that **you are code, and the world is reading your source.** CDT thinks it can edit the output without changing the code. EDT thinks editing the output changes the world's state magically. FDT knows the code is what matters. In Damascus, only the programmer survives.
