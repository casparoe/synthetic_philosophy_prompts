prompt: |-
  My younger sister is finishing a doctorate on G. E. Moore's Principia Ethica, and in a few weeks she is marrying her partner of nine years, a violinist named Thom. She has asked me — the family novelist, hopeless with footnotes — to give the toast, which frightens me more than any deadline ever has. About half the room will be her philosophy department: her supervisor, both examiners, and a small contingent of committed Moore devotees who, she warns me, still treat the closing chapter of Principia Ethica with something close to the reverence the old Bloomsbury set once gave it. The other half is our large, entirely non-philosophical family, who will want to laugh a little and cry a little and have never once heard the phrase "organic unity" and shouldn't have to. My sister has made it very clear, half as a joke and half not, that she will never forgive me if I flatten Moore's actual position into a greeting-card line about friendship and beauty being the good things in life. She wants the real machinery in there somewhere: the claim that a whole can be worth more than the sum of the value of its parts, say, or that strange thought experiment of his about two entirely unwitnessed worlds, one as beautiful and the other as hideous as can be imagined.

  Could you write me a five-minute toast that takes Moore's actual, specific argument seriously enough to survive her supervisor's scrutiny, puts at least one real piece of that philosophical machinery to work in saying something true about this particular marriage rather than about marriages in general, and still lands, for my great-aunts and cousins, as a toast rather than a lecture? I would rather it under-explain the philosophy and over-deliver on affection than the other way around, but I don't want it to be wrong about Moore, either.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Family novelist (comfortable with words, uncomfortable with academic rigor/footnotes).
      *   **Occasion:** Wedding toast for younger sister (finishing PhD on G.E. Moore's *Principia Ethica*) and her partner Thom (violinist, 9 years together).
      *   **Audience:** 50% Philosophy Department (Supervisor, Examiners, Moore devotees), 50% Non-philosophical Family (Great-aunts, cousins, want emotion/humor).
      *   **Constraints:**
          *   Must not flatten Moore's position into clichés (e.g., just "friendship and beauty are good").
          *   Must include specific philosophical machinery (e.g., "organic unity," the "two worlds" thought experiment).
          *   Must apply the philosophy to *this* marriage, not marriage in general.
          *   Must feel like a toast (warm, funny, affectionate), not a lecture.
          *   Preference: Under-explain philosophy, over-deliver affection, but remain accurate.
          *   Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct G.E. Moore's *Principia Ethica* (Relevant Parts):**
      *   *The Good:* Indefinable, non-natural property.
      *   *Organic Unities:* The value of a whole is not necessarily the sum of the values of its parts. A whole can be more valuable than the sum of its parts, or even contain parts that are bad/neutral but contribute to a valuable whole.
      *   *The Two Worlds Thought Experiment:* Imagine one world beautiful, one hideous. Neither is witnessed by humans. Moore argues the beautiful world is better, even if no one experiences it. (This is about intrinsic value independent of utility).
      *   *Ideal Utilitarianism:* Friendship and aesthetic appreciation are among the greatest goods.
      *   *Naturalistic Fallacy:* Don't define "good" in natural terms (like "pleasure").

  3.  **Brainstorming Connections:**
      *   *Organic Unity:* Perfect for marriage. Two individuals (parts) create a union (whole) that has value beyond just "Person A's happiness + Person B's happiness." Also, Thom is a musician (music is often an organic unity).
      *   *Two Worlds:* Can be used to talk about the private world they've built together over 9 years. Even when no one is watching, their love has value.
      *   *The "Good":* It's indefinable. You can't reduce love to a checklist.
      *   *Tone:* Needs to bridge the gap. Acknowledge the academics without alienating the family. Use the novelist persona to frame the philosophy as storytelling.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Make a joke about the difficulty of the task (novelist vs. philosopher). Establish affection.
      *   **The Philosophy Hook:** Introduce Moore gently. Avoid jargon initially, then bring it in.
      *   **Concept 1: Organic Unity:** This is the strongest metaphor for marriage.
          *   *Application:* Sister + Thom ≠ Sum of parts. The relationship itself is a distinct entity with its own value.
          *   *Music angle:* Thom's violin. A chord is an organic unity.
      *   **Concept 2: The Two Worlds:**
          *   *Application:* Their private life. The 9 years. The value exists even when the "examiners" aren't looking.
      *   **The "Good":** Acknowledge Moore's idea that "good" is simple and indefinable. You just know it when you see it (like seeing them together).
      *   **Closing:** Raise a glass. Bring it back to emotion.

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I reduce Moore to "friendship is good"? *Correction:* Make sure to mention the *structure* of value, not just the list of goods. Use the term "organic unity" explicitly.
      *   *Check:* Is it too academic? *Correction:* Keep the explanation of organic unity intuitive. Use the music analogy for Thom.
      *   *Check:* Is it specific to *them*? *Correction:* Mention the 9 years, the PhD struggle, the specific dynamic.
      *   *Check:* Is the tone right? *Correction:* Ensure there's warmth and humor. The "frightens me more than any deadline" line from the prompt is gold, use that.
      *   *Moore Accuracy:* Moore argues the value of the whole is *not necessarily* the sum of the parts. It can be greater. Ensure I don't say it's *always* greater, but that it *can* be. (Actually, for a toast, asserting it *is* greater in this case is fine).
      *   *The Two Worlds:* Moore says the beautiful world is better even if unwitnessed. How does this apply to marriage? Maybe the beauty of their bond exists independently of public validation.

  6.  **Drafting the Content (Iterative Process):**
      *   *Start:* "For those who don't know me..."
      *   *Middle:* "My sister warned me..." "Moore's Organic Unity." "Thom's Violin." "The Unwitnessed World."
      *   *End:* "To the Good."

  7.  **Final Review against Constraints:**
      *   5 minutes? (Word count check: ~850 words).
      *   Moore accurate? (Yes, Organic Unity and Two Worlds referenced correctly).
      *   Family friendly? (Yes, jargon explained via metaphor).
      *   Affectionate? (Yes, focuses on their history).

  8.  **Final Polish:** (Reviewing the rhythm for speech). *Make sure the transition from philosophy to emotion is smooth.* (The draft looks good. The violin analogy helps the family understand organic unity without needing a textbook.)

  **(Self-Correction Note on Moore's Two Worlds):** Moore's thought experiment is specifically about *intrinsic* value of beauty existing without consciousness. Applying this to marriage needs care. It shouldn't sound like "your marriage is good even if you aren't in it." It should be "the beauty of what you have built has value even when no one else is watching/validating it." That fits the 9-year private history.

  **(Self-Correction on Organic Unity):** Moore's point is that you can't just add up the value of the parts to get the value of the whole. Sometimes a part that is neutral on its own adds value to the whole. In marriage, maybe the struggles (PhD stress) were neutral/bad alone but added value to the union's strength. I'll stick to the "whole greater than sum of parts" version as it's more toast-appropriate and still Moorean.

  9.  **Finalizing the Text.** (Proceed to generate output).
answer: |-
  Good evening. For those of you who don't know me, I'm the family novelist. I deal in metaphors, plot arcs, and emotional truths. I do not deal in footnotes. So, when my sister asked me to give this toast, she gave me a deadline that frightened me more than any publisher ever has. She said, "You can be sentimental, you can be funny, but if you reduce G. E. Moore to a greeting card, I will never speak to you again."

  And she was right to worry. Because half of this room knows that Moore is not just about "friendship and beauty are good." And the other half knows that a wedding toast is not the place for a seminar on meta-ethics.

  But here is the thing I have learned watching my sister finish her doctorate while building a life with Thom: Moore actually gives us the perfect language for what they have done.

  Moore argues for something called the doctrine of "Organic Unities." He says that the value of a whole is not necessarily the sum of the values of its parts. You cannot simply take the value of Person A, add it to the value of Person B, and expect to measure the value of the relationship. The relationship is a distinct entity. It has its own intrinsic worth, separate from the individuals who compose it.

  Thom, you are a violinist. You know this better than anyone. If you play a C, it has a certain quality. If you play an E, it has another. But if you play them together, you don't just get "C plus E." You get a third sound, a harmony, that possesses a quality neither note had alone. That is an organic unity.

  And looking at the two of you, after nine years, it is clear that you are not just two happy individuals standing next to each other. You have created a whole that is greater than the sum of its parts. My sister's brilliance and Thom's kindness are valuable on their own. But the specific way they intersect—the way Thom tuned his life to support her through the isolation of writing, the way she grounded his touring with a home—that creates a value that didn't exist before. Moore would say that this union is a distinct good, irreducible to anything else.

  There is another thought experiment of Moore's that I love. He asks us to imagine two worlds. One is as beautiful as can be imagined; the other is a heap of filth. Neither is witnessed by any human being. Moore argues the beautiful world is still better. Why? Because goodness is intrinsic. It doesn't need an audience to be real.

  This speaks to the nine years leading up to today. We see the wedding—the witnessed world. But the value of your marriage isn't in this room. It isn't in the photos or the guests. It is in the unwitnessed world. It is in the quiet Tuesday nights, the mornings where you made coffee without being asked, the moments of support when no examiners or audiences were watching to grade you. Moore teaches us that the value of those private moments is absolute. They are good in themselves, regardless of utility or observation.

  My sister warned me not to flatten Moore into a slogan. So I won't say "Love is good." I will say this: You have constructed an organic unity that possesses intrinsic value. You have built a beautiful world that was real long before we arrived to witness it.

  For the philosophers in the room: I hope I haven't committed the naturalistic fallacy.
  For the rest of the family: I hope you just heard me say they are perfect for each other.

  To my sister and Thom. To the whole that is greater than the parts. And to the Good.
