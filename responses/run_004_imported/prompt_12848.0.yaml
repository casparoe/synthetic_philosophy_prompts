answer: |-
  Based on the text of his 1738 *Exposition of a New Theory on the Measurement of Risk*, Daniel Bernoulli would almost certainly find **Paul Samuelson's** characterization of his argument more persuasive than Ole Peters's, despite Bernoulli's likely disagreement with Samuelson's rejection of the logarithmic function as universal.

  While Peters's ergodicity economics produces mathematically equivalent results in specific contexts, his claim that Bernoulli was *implicitly* solving a time-average growth problem is anachronistic. Bernoulli's 1738 reasoning is structurally grounded in **static expected utility maximization (an ensemble average)** based on subjective valuation, not **dynamic wealth growth (a time average)**.

  Here is the detailed case for why Bernoulli would align with Samuelson's reading of the *nature* of the argument, grounded in three specific aspects of the 1738 text.

  ### 1. The One-Off Nature of the St. Petersburg Problem
  The central problem Bernoulli addresses is the St. Petersburg paradox, which is posed as a **single decision**: "How much should a rational man pay to enter this lottery *once*?"

  *   **Bernoulli's Approach:** Bernoulli resolves the infinite expected monetary value by showing that the expected *utility* converges to a finite number. He calculates $\sum p_i U(w_i)$. This is an **ensemble average**: a weighted sum over all possible outcomes in a single probability space. It does not require the game to be played more than once to be valid. The "fair price" is derived instantly from the agent's current state of wealth and the probability distribution of the single gamble.
  *   **Peters's Claim:** Peters argues that the paradox arises because people intuitively maximize the time-average growth rate, which requires repeated play to converge.
  *   **Bernoulli's Rebuttal:** Bernoulli would find Peters's reliance on the "long run" foreign to his text. He never invokes the Law of Large Numbers or the limit as $t \to \infty$. For Bernoulli, the resolution holds even if the gambler dies immediately after the single toss. He is solving for the *value of the prospect*, not the *optimal strategy for repetition*. Samuelson correctly identifies this as a problem of individual risk preference in a single shot, which matches Bernoulli's framing.

  ### 2. The Derivation of the Logarithm: Psychology vs. Dynamics
  The most significant divergence between the two modern camps is *why* the utility function is logarithmic.

  *   **Peters's View:** The logarithm arises from the mathematics of **multiplicative dynamics**. If wealth changes by percentages (multiplicative noise), the geometric mean (log utility) is the only objective measure that prevents ruin over time. This is a property of the *system*, not the agent.
  *   **Bernoulli's View:** The logarithm arises from the **psychology of valuation**. Bernoulli explicitly states: *"The value of an item must not be based on its price, but on the utility it yields."* He justifies the logarithmic curve ($dU \propto \frac{dw}{w}$) with the observation that a gain of 10 ducats means more to a poor man than to a rich man.
  *   **Why Bernoulli Sides with Samuelson:** Bernoulli's argument is fundamentally axiological (about value), not dynamical (about physics). He writes, *"It seems probable to me that marginal utility decreases as wealth increases."* This is a postulate about human sensation. Peters claims Bernoulli was actually describing objective wealth dynamics and merely dressed it in psychological language. Bernoulli would reject this; he believed he was discovering a law of human nature, not a law of stochastic processes. Samuelson correctly categorizes Bernoulli's work as the foundation of **subjective utility theory**, even if Samuelson argues that the specific log function is not mandatory.

  ### 3. "Moral Expectation" vs. "Growth Rate"
  Bernoulli coins the term "moral expectation" (*emolumentum medium*) to distinguish his measure from "mathematical expectation" (expected value).

  *   **The Structure:** Bernoulli's formula is $E[U] = \sum p_i \ln(w_i)$. He maximizes this quantity to determine the fair price.
  *   **The Dispute:** Samuelson argues that maximizing $E[U]$ is the definition of rationality under risk, but $U$ can be anything. Peters argues that maximizing $E[\ln(w)]$ is actually maximizing the time-average growth rate, and that $E[U]$ is a confusion of ensemble averages.
  *   **Bernoulli's Perspective:** Bernoulli is explicitly calculating an **expectation** (a sum over probabilities). He is not calculating a **time average** (an integral over time). In 1738, the distinction between ergodic and non-ergodic processes did not exist in economic thought. To claim Bernoulli was "really" doing ergodicity economics is to claim he understood a concept that wouldn't be formalized for another two centuries.
      *   Bernoulli would recognize Samuelson's vocabulary: "You understand that I am talking about how men weigh probabilities against their personal valuation of wealth."
      *   Bernoulli would reject Peters's vocabulary: "I am not talking about the trajectory of wealth over time; I am talking about the moral weight of a potential gain at this moment."

  ### Conclusion: Agreement on Mechanism, Disagreement on Universality
  Bernoulli would find Samuelson more persuasive regarding the **structure** of the argument, though he would defend the **universality** of the log function against Samuelson's relativism.

  *   **Against Peters:** Bernoulli would reject the claim that he was "misread" as a utility theorist. He *was* a utility theorist. Peters's assertion that the utility function is merely a proxy for growth dynamics strips the argument of its intended moral and psychological content, which Bernoulli explicitly foregrounded.
  *   **With Samuelson:** Bernoulli would agree with Samuelson that the problem is one of **risk preference** and **valuation**, not time-averaged growth. He would agree that the "moral expectation" is a subjective measure of the agent's state.

  However, Bernoulli would likely chide Samuelson for suggesting the logarithmic function is arbitrary. Bernoulli believed he had found the *true* law of human valuation, not just one option on a menu. But ultimately, the dispute is about whether the 1738 text is about **preference** (Samuelson) or **dynamics** (Peters). Since Bernoulli's text is replete with discussions of human sensation, poverty, and the "value of things to the possessor," he would identify himself as a progenitor of Expected Utility Theory, not Ergodicity Economics. He solved the paradox by changing the measure of **value**, not by changing the measure of **time**.
