      *   **The Quinean's Core Argument:** To ask "Is this the same?" you need to translate the identity particle. How do you translate *that*? By observing assent/dissent to stimuli. But assent/dissent to "Is this the same?" depends on how you've already translated "gavagai." It's holistic. The "identity" particle could mean "is part of the same fusion as." The evidence (stimulus meaning) underdetermines the choice between "same rabbit" and "same rabbit-stage." Grammar is just more verbal behavior subject to the same indeterminacy.

