      *   *Elias's Push:* Simplicity is a pragmatic virtue, not a truth condition. Manual A and Manual B are empirically equivalent.
      *   *Climax/Resolution:* They realize the crux is whether grammatical structure *constrains* ontology or *reflects* an analytical hypothesis about ontology.

