answer: |-
  This is a fantastic observation, and I want to start by saying that your intuition is not just a bias—it is a recognized philosophical problem. In fact, you have independently stumbled upon a debate in meta-ethics known as the problem of **moral testimony**.

  As a chemist, you are used to **epistemic deference**. If a spectroscopist tells you the NMR shows a doublet at 7.2 ppm, you accept that as fact. You defer because they have access to data and methods you might not, but crucially, the truth of the claim is independent of your acceptance of it. The molecule doesn't care what you believe.

  Moral deference feels different to you because, structurally, many philosophers argue it *is* different. Here is why your "shakier" feeling is likely warranted, broken down into three key distinctions.

  ### 1. The Autonomy and Understanding Objection
  In science, we care primarily about the *truth of the conclusion*. If the NMR interpretation is correct, it doesn't matter much if you personally understand the Fourier transform behind it. You can outsource the cognitive labor.

  In morality, many philosophers (like Sarah McGrath or Allison Hills) argue that we care about the *quality of the moral agent*, not just the correctness of the act. If you stop eating meat solely because the student told you to, you haven't necessarily engaged with the *reasons* why it might be wrong (suffering, environmental impact, rights, etc.).

  If you don't grasp the underlying reasons, you lack **moral understanding**. You have the right answer, but you don't know *why* it's right. This makes your moral stance fragile. If a clever carnivore comes along next week and presents a counter-argument to the student's position, you won't have the resources to evaluate it. You'd have to find a new expert to defer to. In science, this is fine (we rely on consensus); in morality, it feels like abdicating your agency.

  ### 2. The Motivation Problem
  Scientific facts are, in themselves, inert. Knowing the NMR spectrum doesn't force you to do anything. Moral judgments, however, are thought to be **action-guiding**. This is related to the philosophical concept of *internalism*: if you genuinely judge that "eating meat is wrong," that judgment should come with a motivational push to stop eating meat.

  When you defer on a fact, you are updating your database. When you defer on a morality, you are trying to update your *motivations* via someone else's reasoning. There is a psychological gap there. It is harder to feel genuinely motivated by a second-hand moral conviction than a first-hand one. That "shakiness" you feel might be the lack of internal motivational force that usually accompanies a moral realization you've worked through yourself.

  ### 3. The Question of Expertise
  In chemistry, expertise is verifiable and cumulative. We know how to train an NMR interpreter, and we have instruments to check their work.

  In moral philosophy, "expertise" is trickier. The student has read more philosophy, which means she is better at *argumentation* and knows the landscape of the debate better than you. But does reading Peter Singer make someone morally *better*, or just more articulate? There is no moral spectrometer to verify her conclusion. You are deferring to her rhetorical and logical skill, not necessarily to a verified moral perception. This makes the deference feel riskier because the mechanism of verification is absent.

  ### The Counter-Argument (The "Optimists")
  To be fair, there are "moral testimony optimists" who argue that deferring is sometimes necessary. We can't all be ethical pioneers. Just as we trust our parents' moral guidance as children, we might trust a well-read philosopher as adults when the issues are complex (like the trolley problem or global economic justice). They argue that if the argument is sound, the source shouldn't matter.

  ### A Proposal for Your Discussion Group
  You don't have to choose between "blind deference" and "total skepticism." As a scientist, you know the value of **peer review**.

  Right now, you have accepted the *result* of her experiment (the conclusion that meat is wrong) without seeing the *data* or the *methodology* (the premises and logical steps).

  Next time you go, don't try to refute her conclusion. Instead, treat it like a colleague asking about a reaction mechanism. Say something like:
  *"I found your argument compelling enough that I've actually changed my behavior. But as a scientist, I'm uncomfortable accepting a result without understanding the mechanism. Can you walk me through the premises that you think are the most vulnerable? I want to understand the 'why' so I can own the conclusion."*

  This shifts you from a passive recipient of moral testimony to an active participant in moral inquiry. That should alleviate the shakiness. You aren't deferring to her authority; you are using her expertise to build your own understanding.

  So, to answer your question: No, it isn't just bias. Morality requires a level of personal ownership and understanding that empirical facts do not. Your discomfort is a sign that your moral compass is working exactly as it should.
