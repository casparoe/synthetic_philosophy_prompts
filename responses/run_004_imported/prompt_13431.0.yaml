      *   *Implication:* Epistemically, yes, it's symmetrical. Neither side can prove their hinges to the other without begging the question.
      *   *Crucial Distinction:* Symmetry in *structure* does not mean symmetry in *truth* or *consequences*. Wittgenstein isn't a relativist saying "all hinges are equal." Some worldpictures allow for more successful navigation of reality (though W. is cautious about defining "success").
