      *   *Implication:* Change happens through *osmosis* and *trust*, not debate. The missionary analogy suggests conversion comes from relationship and way of life, not syllogisms.
      *   *Strategy:* Rebuild the relationship (the channel) so the water can flow. If the father feels safe, his rigid defenses might soften over time.

