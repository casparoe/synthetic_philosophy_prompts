  2.  **Deconstruct Wittgenstein's *On Certainty* (Relevant Concepts):**
      *   **Hinge Propositions:** Certainties that are not known but *shown* in action. They are the scaffolding of our thought. Examples: "The earth exists," "I have hands," "Books don't vanish."
      *   **Grounds vs. Hinges:** You give grounds for beliefs *within* a system. You don't give grounds for the system itself (the hinges). Trying to prove a hinge is nonsensical because the proof relies on the hinge.
      *   **The Riverbed:** The hard rock (hinges) and the water (fluid beliefs). The rock shifts, but slowly, and due to the pressure of the water over time, not because the water argued with the rock.
      *   **Worldpictures (Weltbild):** The inherited background against which we distinguish true/false.
      *   **Conversion/Persuasion:** When hinges clash, it's not a rational dispute but a clash of worldpictures. Wittgenstein uses the missionary analogy (OC §611-612).

  3.  **Address Question 1: Is arguing a category error?**
