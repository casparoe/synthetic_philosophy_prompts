answer: |-
  Friends, family, Renata.

  Walt gave me specific instructions for this moment. He told my mother: "No 'he died so we'd be free.' No 'war is hell, so senseless.'" He said both statements were lies. The first makes a martyr of a man who just flew a supply plane. The second makes a fool of a man who spent seventy years arguing that conflict is the engine of history.

  He knew I'm a novelist, not a philosopher. He knew I'd be tempted to smooth the edges to make everyone feel better. But Walt hated smooth edges. He hated the comfort of easy answers. So, I'm not going to try to fix what he thought. I'm going to tell you who he was.

  If you knew Walt, you knew about the book. *The Philosophy of Right*. Paperback. Held together with gray duct tape and sheer willpower. You knew that if you sat next to him at Thanksgiving long enough, eventually the turkey would get cold while he explained that a nation without conflict is like a sea without wind: calm, yes, but eventually foul. Stagnant. He believed that ethical life isn't a static thing you keep in a museum. It's a muscle. He believed it has to be tested, or it atrophies.

  He believed Kant's dream of perpetual peace was beautiful, but impossible. He believed sovereign states are bound by something deeper than treaties.

  Now, I know how that sounds. I know who is sitting in the front row. Renata, you know what war is in a way Walt only ever theorized about. You did two tours. You know that wind he talked about can be a hurricane that tears roofs off houses. You know that "ethical life" is often the first thing casualty statistics erase.

  There is a tension in this room. On one side, a man who spent a lifetime arguing that struggle is necessary for meaning. On the other, a woman who lived that struggle and knows the price of it in blood and bone.

  But here is the thing that binds them. Here is the comfort.

  Walt didn't love war. He loved *seriousness*. He loved the idea that our choices matter. He flew supply planes in Korea not because he hunted glory, but because he understood that being part of a collective struggle was better than sleeping safely on the shore. He wanted us to be awake. He cornered us at holidays not to annoy us, but because he was terrified we were becoming complacent. He was terrified we'd stop thinking, stop challenging, stop engaging with the hard truths of how the world works.

  Renata, you hate war. Walt argued war had a function. But you both agree on the most important thing: You both agree that life is not a game. You both agree that peace isn't just the absence of noise; it's the presence of justice, and justice is hard work. Walt spent seventy years reading Hegel to understand the cost of civilization. You spent your twenties paying it. In a strange way, you are the two poles of his life's argument. The theory, and the reality.

  He didn't want us to cry for him today as a victim. And he didn't want us to cheer for him as a hero. He wanted us to *think* about him.

  He was a man who taped his books together because he used them. He was a man who would rather be difficult than be dull. He was a man who looked at the chaos of the twentieth century and refused to look away, refused to simplify it into a slogan.

  So, how do we honor that? We don't honor him by adopting his politics. We honor him by adopting his intensity.

  When you go back to your lives, when the world feels easy, when you feel yourself accepting a lie because it's comfortable, remember Walt. Remember the taped-up book. Remember that he believed we owe it to each other to stay sharp. To stay ethical. To keep the air moving, even when it's stormy.

  Walt, you kept your mind open until the very end. You refused the easy comfort of the grave, even before you entered it. You demanded we tell the truth about you. So here it is: You were difficult. You were uncompromising. You were a Hegelian pilot who loved his family enough to argue with us until we were red in the face.

  We will miss you. Not because you made us feel safe, but because you made us feel awake.

  Rest now. The argument is over. But we'll keep thinking.
