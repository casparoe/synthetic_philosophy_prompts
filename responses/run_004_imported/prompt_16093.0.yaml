answer: |-
  Friends, colleagues, family.

  For forty-two years, Gordon and I were colleagues in the broad sense: we were both physicists. We spoke the same language of wave functions and lattice structures. But in the deeper sense, we were brothers. We met as doctoral students, gray at the temples before we were truly grown, and we remained that way until three weeks ago. We shared a great many dinners, a great many bottles of wine, and a great many arguments.

  To speak of Gordon honestly is to speak of what he did. He spent his life at the laboratory designing nuclear warheads. He did not hide this. He did not apologize for it. At my own dinner table, often with his grandchildren playing in the next room, Gordon would explain his work with a cheerful clarity that sometimes startled our younger guests. He believed, without a flicker of doubt, that the weapons he helped build had kept the peace. He believed that the bombings of 1945 were a terrible necessity that had saved millions, including the life of his own father, who was preparing to invade Japan.

  For Gordon, morality was an arithmetic. You weighed the lives taken against the lives saved, and you acted on the answer. He carried this calculus with him for ninety years. It was the foundation of his integrity. He believed he was a man who protected the innocent by standing between them and the dark.

  I stand here today as his friend, but I cannot stand here as his philosophical duplicate. In my retirement, I have had time to read, to think, and to question foundations I once took for granted. I have come to see the moral landscape differently than Gordon did. I am no longer convinced that the arithmetic he trusted can truly balance. I have come to believe that some acts remain heavy, regardless of the consequences they prevent; that deliberately crossing certain lines changes the soul of the world, even if it saves it.

  I tell you this not to cast a shadow over his memory, but because Gordon valued truth above comfort. He would not want a eulogy built on a pretense of agreement where there was none. We argued about this for decades. He knew where I stood in our later years. He knew I could no longer endorse the utilitarian math that guided his life. And yet, he never withdrew his friendship. He never questioned my integrity, even when I questioned the foundation of his life's work.

  This, perhaps, is the thing I want you to remember most. Gordon's certainty was not born of cruelty, or of a disregard for life. It was born of a fierce, protective love. He looked at the chaos of history and sought to impose an order that would keep his children, and his country, safe. He believed he was bearing a burden so that others wouldn't have to.

  To his colleagues here: You know the weight of that burden. You know the complexity of the choices made in those labs. You know that Gordon was a man of rigorous honesty. He did not look away from the fire. He stared into it so others wouldn't have to.

  To his family: You knew the man behind the physics. You know he was gentle. You know he was present. You know he loved you with a totality that defies any philosophical calculation. His work was an extension of that love. He sought to protect the world you lived in. Even if the moral geometry of that work is something we may debate in universities for another century, the love that motivated it was real. It was tangible. It is what raised you, and what held us together.

  There is a temptation, when we lose someone we disagree with, to soften the edges of their life to make it easier to mourn. I will not do that. Gordon was a hard man in some ways. He held hard truths. But he was a good man. He was loyal. He was generous. He showed up.

  I am left with a doubt that Gordon never had. I am not sure the ends can ever fully justify the means. I am not sure the tally of lives saved converts a terrible act into a good one. But I am sure of this: I loved him. And I was loved by him. And in the face of death, that bond feels more real than any syllogism.

  We are all flawed vessels. We all navigate by maps that turn out to be incomplete. Gordon navigated by a map that said "protect the many, whatever the cost to the few." I am learning to read a different map. But we walked the same path for fifty years. We laughed at the same jokes. We grieved the same losses. We held each other up.

  So, I will not try to solve the moral puzzle of Gordon's life today. Grief is not a seminar. It is a wound. And the only medicine we have for it is memory.

  I remember a man who believed he was saving the world. I remember a man who loved his wife with a devotion that never wavered. I remember a friend who listened to my doubts with patience, even when he thought I was wrong.

  Gordon faced the hardest questions a human being can face, and he answered them with the only tool he trusted: his conscience. He is at rest now. The arithmetic is done. What remains is not the calculation, but the man. And the man was my brother.

  Thank you.
