answer: |-
  This is one of the most profound and persistent questions in philosophy, and the fact that you have arrived at it through your own lived experience is remarkable. You have independently reconstructed an argument that philosophers like Galen Strawson and Thomas Nagel have spent careers debating.

  You are grappling with the problem of **Ultimate Responsibility** versus **Constitutive Luck**.

  Your reasoning is logically sound: If your actions are determined by your character, and your character is determined by factors you didn't choose (genetics, upbringing, initial sparks of motivation), then how can you claim ultimate credit for the actions? If the "you" that did the work was built by materials you didn't select, isn't the praise just for being lucky enough to have those materials?

  Here is a way to navigate this without falling into nihilism or dismissing your own insight.

  ### 1. The Distinction Between "Ultimate" and "Practical" Credit
  You are correct that you do not deserve **Ultimate Credit**. You did not create yourself *ex nihilo* (out of nothing). You did not choose the neural pathways that made discipline possible, nor did you choose the specific moment where embarrassment tipped over into motivation. In a metaphysical sense, you are right: the "credit" is an illusion if it implies you are the uncaused cause of your own existence.

  However, human society and psychology do not operate on metaphysical ultimate responsibility. They operate on **Practical Agency**.

  Think of yourself as a gardener. You did not choose the seeds (your genetic traits), you did not choose the climate (your environment/upbringing), and you did not choose the rain (the sudden motivation). But you *did* choose to water the plants, pull the weeds, and protect them from pests.
  *   **The Illusion:** Believing you created the seeds.
  *   **The Reality:** Believing you did the gardening.

  Your coach and parents are praising the gardening, not the seeds. When they say "be proud," they aren't saying "you created your own soul." They are saying "you successfully stewarded the resources you were given."

  ### 2. The Hierarchy of Desires
  Philosopher Harry Frankfurt offered a solution to this that might resonate with you. He distinguished between **first-order desires** (I want to sleep in) and **second-order desires** (I want to *want* to train hard).

  Animals have first-order desires. Humans have the unique capacity to evaluate their desires and choose which ones to act on.
  *   **Old You:** Had a desire to skip practice, and acted on it.
  *   **New You:** Had a desire to skip practice, *but also* had a desire to be disciplined, and you aligned your actions with the second one.

  That alignment process—the friction of overriding the first-order desire with the second-order desire—is where the "work" happened. You didn't choose the *capacity* for second-order volition, but you *exercised* it. That exercise is real, regardless of where the capacity came from.

  ### 3. The Functional Value of Praise
  Even if we accept your premise that free will is limited, credit and pride serve a vital functional purpose. They are feedback mechanisms.

  *   **Reinforcement:** When your coach praises you, it releases dopamine. It reinforces the neural pathways associated with discipline. If you reject the praise, you deny your brain that reinforcement, which might make it harder to maintain the habit.
  *   **Identity Formation:** Saying "I am a disciplined person" becomes a self-fulfilling prophecy. If you decide "I am just a product of luck," you risk undermining the identity that sustains the work.

  In this sense, accepting credit isn't about making a true metaphysical claim; it's about adopting a useful narrative. It is a tool you use to maintain the trajectory of your life.

  ### 4. The Double-Edged Sword
  Consider the alternative. If you argue that you deserve no credit for your success because your traits were unchosen, you must logically argue that you deserve no blame for your failures.

  If you had failed to turn things around, would you tell your coach, "It's not my fault, I lacked the raw material"? If you claim the good outcomes are just luck, you must accept the bad outcomes are just fate. Most people find this trade-off unacceptable. We generally want to own our failures so that we have the power to fix them. If you own the power to fix them, you must also own the credit when they are fixed.

  ### 5. Reframing "Pride"
  You don't have to view pride as "I am a god who created myself." You can view pride as **gratitude for alignment.**

  You can be proud in the sense that there is now a harmony between your values and your actions. That harmony is rare. Many people have the "raw material" for discipline but never activate it. Many people have the motivation but lack the capacity. You have both, and you successfully bridged the gap.

  **The Verdict:**
  You are right that the *source* of your willpower was not chosen. But the *application* of it was.
  *   **Metaphysically:** Your credit is limited. You got lucky with your "raw material."
  *   **Practically:** Your credit is real. You did the work that the raw material made possible, which many others with similar material fail to do.

  Accept the praise from your coach and parents. Not because it proves you are an uncaused cause, but because it acknowledges that you showed up to the job. You are the only person who could have lived your life, and you chose to live it well. That is enough to be proud of, even if the "you" that chose it was built by time and chance.
