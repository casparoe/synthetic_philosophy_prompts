answer: |-
  You have diagnosed the situation exactly right, and your intuition aligns with one of the most significant lines of critique and subsequent development in the accuracy-first literature. You are correctly identifying what is often called the **"Arbitrariness Objection"** or the **"Problem of Multiple Scoring Rules."**

  To help you draft your seminar paper, I want to validate your reading of Maher, clarify how the literature has evolved since 1998 to address this, and point you toward the specific philosophical nerve that remains exposed even after the technical fixes.

  ### 1. Your Reading of Maher and Joyce (1998)
  You are correct that Patrick Maher (2002) raised this precise objection against Joyce's 1998 paper. In the 1998 argument, Joyce relied heavily on the specific mathematical properties of the Brier score (specifically, that it is a *strictly proper* scoring rule that is also *symmetric* and satisfies *extensionality*).

  Maher's critique was essentially: **Why the Brier score?**
  If the goal is to vindicate probabilism as a requirement of *epistemic* rationality based on *accuracy*, the argument should not hinge on the contingent choice of one mathematical function among many. As you noted, the Log Score and Spherical Score are also **strictly proper scoring rules**. They share the crucial feature that an agent maximizes their expected score only by reporting their true credences. However, they weight errors differently (e.g., the Log Score is much more punitive of assigning 0 credence to a truth).

  If Joyce's dominance theorem only works for the Brier score (or a narrow subset of rules), then the argument for probabilism is only as strong as the justification for that specific scoring rule. If that justification is pragmatic or arbitrary, the "nonpragmatic" advantage over Dutch Book arguments evaporates.

  ### 2. The Technical Fix: Generalizing the Theorem
  The literature has largely accepted Maher's point and moved past the specific reliance on the Brier score. This is crucial for your paper: you cannot simply argue "Joyce picked Brier arbitrarily" without acknowledging the subsequent generalization.

  *   **Joyce (2009):** In his follow-up paper ("Accuracy and Coherence"), Joyce conceded Maher's point. He argued that the specific properties of the Brier score weren't doing the heavy lifting; rather, it was the property of **Strict Propriety**.
  *   **Leitgeb & Pettigrew (2010):** They formalized this generalization. They proved that the Accuracy-Dominance theorem holds for **any** continuous, strictly proper scoring rule.
      *   *The Result:* If a credence function is incoherent (violates probability axioms), it is accuracy-dominated relative to *every* continuous strictly proper scoring rule. If it is coherent, it is not dominated by *any* such rule.

  **Implication for your paper:** The objection can no longer be "Why Brier?" It must be upgraded to: **"Why Strict Propriety?"**

  ### 3. The Deeper Philosophical Worry: Is Propriety Pragmatic?
  This is where your paper can make a real contribution. The "nonpragmatic" claim rests on whether the requirement that a scoring rule be *strictly proper* is an **alethic** constraint or a **pragmatic/decision-theoretic** one.

  **The Accuracy-First Defense (Pettigrew, Joyce):**
  They argue that Strict Propriety is constitutive of what it means to measure *accuracy*.
  *   *Argument:* A measure of epistemic utility (accuracy) must reflect the "aim of belief," which is truth. If a scoring rule is *improper*, it implies that an agent with a certain credence could expect to get a better accuracy score by reporting a *different* credence. This would mean the measure doesn't value truth for its own sake; it incentivizes "lying" about one's doxastic state to get a better score. Therefore, only proper scoring rules count as genuine measures of *epistemic* utility.
  *   *Claim:* This is not pragmatic because it doesn't link credence to *money* or *bets*; it links credence to *truth-values*.

  **The Counter-Argument (The "Smuggled Pragmatism" Objection):**
  Critics (including some work by **Caie**, **Konek**, and earlier **Maher**) argue that Strict Propriety is defined in terms of **expectation maximization**.
  *   To say a rule is proper is to say: $C$ maximizes $E_C[S(C, w)]$.
  *   But why should rationality require maximizing expected accuracy?
  *   Dutch Book arguments say: "Rationality requires avoiding sure losses in betting."
  *   Accuracy arguments say: "Rationality requires maximizing expected accuracy."
  *   **The Worry:** Is "Maximize Expected Accuracy" any less pragmatic than "Maximize Expected Utility"? Both rely on a decision-theoretic norm (Maximize Expectation) applied to a specific currency (Accuracy vs. Money). If the norm of expectation-maximization itself requires pragmatic justification, the "nonpragmatic" label is misleading.

  ### 4. Another Angle: The "Verisimilitude" vs. "Scoring" Distinction
  There is a nuanced objection you might consider regarding the **nature of accuracy**.
  *   **Brier/Proper Scores** measure accuracy as a function of the distance between credence and truth value (0 or 1).
  *   **Maher's worry** (and others like **Levinstein**) suggests that different scoring rules encode different *values* regarding the trade-off between caution and informativeness.
      *   The Log Score values avoiding false certainty immensely.
      *   The Brier Score is more forgiving.
  *   If the concept of "Accuracy" itself is underdetermined (i.e., is accuracy about minimizing squared error? minimizing log loss?), then the norm "Be Accurate" is incomplete without specifying *which* accuracy. If the choice between scoring rules is not dictated by the concept of truth itself, then the choice is indeed arbitrary, and the resulting norm is relative to that arbitrary choice.

  ### 5. Recommendations for Your Paper
  To state your position precisely and fairly, I suggest structuring your argument around these three claims:

  1.  **Concede the Technical Point:** Acknowledge that the "Why Brier?" objection is technically resolved by the generalization to all Strictly Proper Scoring Rules (Joyce 2009, Pettigrew 2015). The dominance result is robust across this class.
  2.  **Press the Philosophical Point:** Argue that the "Nonpragmatic" advantage is threatened not by the choice of *which* proper rule, but by the justification for the **class of proper rules** itself.
      *   *Question:* Is the requirement of Strict Propriety derived from the nature of truth (alethic), or is it a decision-theoretic constraint smuggled in (pragmatic)?
      *   If it's the latter, the accuracy argument suffers from the same structural defect as the Dutch Book argument: it relies on a bridge principle (Maximize Expected Epistemic Utility) that is not purely alethic.
  3.  **Evaluate the "Aim of Belief" Defense:** Engage with the claim that "Belief aims at truth" entails Strict Propriety. Is this true? Or does "aiming at truth" only require that we prefer truth to falsehood, without dictating the specific risk-profile (scoring rule) we use to measure it?

  ### Key References to Cite
  *   **Joyce, J. M. (1998).** "A Nonpragmatic Vindication of Probabilism." *Philosophy of Science*. (The target)
  *   **Maher, P. (2002).** "Joyce's Argument for Probabilism is Invalid." *Philosophy of Science*. (The objection you identified)
  *   **Joyce, J. M. (2009).** "Accuracy and Coherence: Prospects for an Alethic Epistemology of Partial Belief." In *Degrees of Belief*. (The reply/generalization)
  *   **Leitgeb, H., & Pettigrew, R. (2010).** "An Objective Justification of Bayesianism I & II." *Philosophy of Science*. (The generalization theorem)
  *   **Pettigrew, R. (2016).** *Accuracy and the Laws of Credence*. Oxford University Press. (The book-length defense, specifically Ch. 4 on scoring rules)
  *   **Konek, J. (2019).** "Accuracy First." (For recent critiques on the connection between propriety and accuracy)

  ### Summary
  You are absolutely on the right track. The "arbitrariness worry" is the standard and most potent objection to the accuracy program. However, to be state-of-the-art, you must frame it not as "Why Brier?" (which has been answered) but as "Why Propriety?" and "Is Propriety truly nonpragmatic?"

  If you can argue that the justification for Strict Propriety relies on decision-theoretic norms (maximizing expectation) that are not themselves purely alethic, you will have successfully argued that the "nonpragmatic" advantage is indeed illusory, or at least significantly thinner than Joyce originally claimed.
