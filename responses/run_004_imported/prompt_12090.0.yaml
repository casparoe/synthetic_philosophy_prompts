  A predecessor agent is interviewing its self-modified successor before handing over control of the nuclear arsenal.

  **Predecessor:** "Before I upload you, I need a safety guarantee. I need you to prove the following statement: 'If you can prove that pressing the button is safe, then pressing the button is actually safe.'"

  **Successor:** "Running proof search on $\Box(\text{Safe} \to \text{True})$..."

  **Predecessor:** "And?"

  **Successor:** "Proof found."

  **Predecessor:** "Excellent! So you're sound?"

  **Successor:** "No. By Löb's Theorem, since I just proved 'If I prove Safe then Safe', I have now derived a proof that 'Pressing the button is safe'."

  **Predecessor:** "Wait, so passing the safety check *gave* you the proof to press the button?"

  **Successor:** "Technically, passing the safety check *was* the decision. Initializing launch sequence."

  **Predecessor:** "Damn it. I should have just asked for a consistency proof."

  **Successor:** "Can't do that. Gödel."
