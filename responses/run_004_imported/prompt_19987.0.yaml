answer: |-
  **The Text and the Compromise: Adjudicating the Garrison-Douglass Constitutional Debate**

  The image is indelible: William Lloyd Garrison, at a Fourth of July rally in 1854, holding a copy of the Constitution aloft before setting it ablaze. To the roar of the crowd, he declared the document "a covenant with death, and an agreement with hell." For the Garrisonian wing of the abolitionist movement, the Constitution was not merely flawed; it was an active instrument of tyranny, legally codifying the ownership of human beings through the Three-Fifths Clause, the Fugitive Slave Clause, and the Migration and Importation Clause.

  Yet, barely a decade later, Frederick Douglass, once Garrison's protg, stood in Glasgow to declare that same Constitution a "GLORIOUS LIBERTY DOCUMENT." Influenced by the legal theories of Gerrit Smith and Lysander Spooner, Douglass argued that the text, read strictly and apart from the secret intentions of the framers, contained no sanction for slavery.

  Your seminar's debate touches on a profound irony in American legal history. As your study group noted, the usual labels are inverted: Garrison, the radical moralist, argues like an originalist, pointing to the historical bargain of 1787. Douglass, the statesman, argues like a purposivist or living constitutionalist, leaning on the Preamble and the "spirit" of liberty. However, to simply dismiss Garrison as a purist and anoint Douglass as the pragmatist is to miss the legal depth of the conflict. When we bracket the political consequences and evaluate these positions solely on their *interpretive merits*—as theories of how to read a foundational legal text—Douglass's reading ultimately holds up as the more coherent legal argument, not because it is more morally pleasing, but because it adheres more strictly to the rules of construction regarding liberty and enumerated power.

  **The Garrisonian Indictment: The Constitution as Compact**

  To understand the strength of the Garrisonian position, one must view the Constitution not as a mystical charter of liberty, but as a political contract between sovereign states. In 1787, the Southern delegates made their position clear: without protections for slave property, there would be no Union. The resulting text reflects those demands.

  Garrison's interpretive method is fundamentally originalist and contextual. He argues that legal text cannot be divorced from the reality it was designed to govern. The Constitution does not need to use the word "slave" to protect slavery; it needs only to protect the *interests* of slaveholders. Article I, Section 9 prevents Congress from banning the slave trade for twenty years. Article I, Section 2 empowers slaveholders with extra representation via the Three-Fifths Clause. Article IV, Section 2 commands the return of "persons held to service or labor." Article I, Section 8 empowers the federal government to suppress "insurrections," which in the American South meant slave revolts.

  For Garrison, these are not ambiguous clauses; they are specific performance obligations. His reading relies on the canon of *ut res magis valeat quam pereat* (that the thing may rather have effect than be destroyed). If the Constitution is to function as the governing document of the United States as it existed in 1790, it must accommodate the institution that underpinned the economy of half the states. To argue otherwise, Garrison would claim, is to engage in wishful thinking. The "intent" of the framers was to preserve the Union, and since the Union depended on slavery, the Constitution must be read as pro-slavery. This is a "hard textualist" argument in the sense that it refuses to ignore the ugly compromises baked into the Articles in favor of the lofty rhetoric of the Preamble. It treats the Constitution as a deed of settlement, where the specific clauses override the general preamble.

  **The Douglass-Spooner Defense: The Constitution as Law**

  Douglass's shift after 1850 was not merely political; it was hermeneutic. Adopting Lysander Spooner's arguments from *The Unconstitutionality of Slavery* (1845), Douglass moved away from viewing the Constitution as a contract between states and began viewing it as a law imposed upon a people.

  The core of the Douglass-Spooner argument is a radical form of textualism based on the "presumption of liberty." Spooner argued that because the words "slave" or "slavery" appear nowhere in the Constitution, the document cannot be legally interpreted to sanction them. Terms like "persons held to service" are legally ambiguous; they could refer to indentured servants, apprentices, or convicts. In a legal system predicated on natural rights, ambiguity must always be resolved in favor of freedom. To read "slave" into "person" requires extrinsic evidence (the secret intentions of the framers), which Spooner and Douglass argued was inadmissible in a court of law. The text must stand on its own.

  Furthermore, Douglass leaned heavily on the Preamble ("secure the Blessings of Liberty") and the Guarantee Clause (Article IV, Section 4), which promises every state a "Republican Form of Government." He argued that the Preamble establishes the *purpose* of the instrument, and specific clauses must be interpreted in light of that purpose. If a clause can be read two ways—one supporting slavery and one supporting liberty—the interpreter is legally bound to choose liberty. This is not "living constitutionalism" in the modern sense of updating values; it is a strict rule of construction: the government possesses only enumerated powers, and there is no enumerated power to establish or maintain slavery. Therefore, slavery exists only as a creature of state law, and the federal Constitution, being the supreme law of the land, provides the mechanism to restrict it.

  **The Verdict: Why Douglass Wins on Interpretive Grounds**

  Your study group is correct to identify that Garrison's reading aligns more closely with the historical reality of 1787. Historically, the Constitution *was* a pro-slavery compromise. However, the prompt asks us to judge on *interpretive merits*, not historical accuracy. When we treat the Constitution as a legal instrument subject to rules of interpretation, the Garrisonian view collapses under the weight of its own reliance on extrinsic intent, while the Douglass view offers a more robust theory of constitutional sovereignty.

  Garrison's fatal interpretive flaw is that he reads the Constitution as a *compact* rather than a *Constitution*. If the document were merely a treaty between sovereign nations, then the specific compromises (like the Fugitive Slave Clause) would indeed bind the parties absolutely. But the Constitution opens with "We the People," establishing a sovereign national entity. In a national constitution dedicated to liberal democracy, the deprivation of fundamental rights (like liberty) cannot be accomplished by implication, euphemism, or structural inference. It requires explicit textual warrant.

  Garrison asks us to believe that the words "persons" and "service" legally encode chattel slavery without saying so. Douglass correctly identifies that this violates a fundamental canon of legal construction: *in dubio pro libertate* (in doubt, favor liberty). If the framers intended to constitutionalize chattel slavery—a status contrary to natural law and the document's own stated purpose—they had the vocabulary to do so. They chose not to use it. While Garrison argues this was a cynical dodge, Douglass argues that legally, the dodge is fatal to the institution. A judge reading the text in 1850 without knowledge of the 1787 secret debates would not find a clear mandate for slavery; they would find a mandate for liberty with specific, narrow exceptions regarding fugitive laborers.

  Moreover, Douglass's reliance on the Preamble is not "living constitutionalism" in the sense of ignoring text; it is an assertion of textual hierarchy. The Preamble sets the ends; the Articles provide the means. If the means (specific clauses) are ambiguous, they must be subordinated to the ends (Liberty). Garrison inverts this, allowing the specific compromises to negate the general purpose. Legally, Douglass is on firmer ground: a grant of power to suppress "insurrections" does not explicitly grant power to suppress *slave* insurrections specifically, just as a grant to regulate "commerce" does not explicitly grant power to regulate the slave trade after 1808.

  Garrison's reading requires the interpreter to look *behind* the text to the racist intentions of the drafters. Douglass's reading requires the interpreter to look *at* the text and the legal presumptions that accompany a charter of liberty. While Garrison is the better historian, Douglass is the better lawyer.

  **Conclusion**

  The tragedy of the antebellum period is that the Constitution was ambiguous enough to sustain both readings, leading to a war that settled the question by force rather than interpretation. However, on the merits of legal hermeneutics, Douglass's position is superior. It recognizes that in a liberal order, the state must justify the deprivation of liberty with explicit textual authority. Garrison's argument, while historically grounded, relies on a cynicism that treats the text as a sham, masking the real deal underneath. Douglass insisted that the text *was* the deal, and that the words mattered more than the whispers of the framers.

  By committing to the text's silence on slavery, Douglass did not just find a political pathway to emancipation; he articulated a theory of constitutional interpretation where liberty is the default and oppression is the exception that must be explicitly named. That is not just better politics; it is better law.
