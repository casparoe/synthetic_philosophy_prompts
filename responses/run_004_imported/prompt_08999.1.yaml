      *(Self-Correction during drafting)*: Make sure I don't sound *too* much like a philosopher. I am still a Senior Scientist on the IACUC. The argument must remain grounded in regulatory and welfare science, using the philosophy to bolster the welfare argument, not replace it. The key is "measurement validity."

      *(Refining the Conditions)*: Instead of just "add measures," specify *which* measures are appropriate for dissociating wanting/liking (e.g., affective vocalizations, consummatory facial reactions if possible, or general husbandry metrics like nest building that require executive function beyond the compulsion).

      *(Final Polish)*: Ensure the distinction between "scientific endpoint" (compulsion) and "humane endpoint" (suffering) is clear. The protocol *wants* compulsion, but we need to ensure it doesn't cross into unmitigated distress that violates the Animal Welfare Act.

