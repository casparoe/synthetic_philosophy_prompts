      *   The core tension is between *metaphysical causation* (what actually made the world tick) and *pragmatic/explanatory causation* (what helps us intervene).
      *   In engineering/SRE contexts, "Root Cause" is rarely a metaphysical claim; it's a tool for system improvement.

  3.  **Key Philosophical Concepts to Introduce:**
      *   **Counterfactual Dependence:** The user mentioned this (Lewis). It's necessary but not sufficient.
      *   **Normality/Defaults:** Hart & Honoré's distinction between "conditions" and "causes." Causes are deviations from the normal course of events.
      *   **Interventionism:** Woodward's idea. Causation is about what happens when you *wiggle* a variable. Can you wiggle the cat?
      *   **Pragmatics/Context:** Van Fraassen's why-questions. Causation is relative to the interest of the asker.

