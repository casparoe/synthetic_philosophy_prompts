answer: |-
  You have hit on one of the deepest and most frustrating tensions in incident management. You are absolutely correct: if you rely strictly on the counterfactual definition of causation ("If X hadn't happened, Y wouldn't have"), you end up with an infinite list of causes, including your cat not reading the code, the sun not exploding, or gravity not temporarily turning off.

  In philosophy, this is known as the **Problem of Omissive Causation**. Philosophers like Hart and Honoré, David Lewis, and James Woodward have wrestled with this for decades.

  The short answer to your question is: **Yes, "Root Cause" in a postmortem is secretly convention dressed up as objective language.** However, it isn't *arbitrary* convention. It is **pragmatic** convention based on norms, expectations, and leverage.

  Here is the breakdown of why the cat isn't the root cause, why the engineer's omission feels like one, and how to use this distinction to make your postmortems actually useful (and truly blameless).

  ### 1. The Philosophical Filter: Normality and Norms
  The standard philosophical solution to the "cat problem" is to distinguish between **background conditions** and **causal interventions**.

  *   **Background Condition:** The cat didn't read the code. The gravity stayed on. The power stayed on. These are part of the "normal course of events."
  *   **Cause:** A deviation from the normal course of events.

  Philosophers H.L.A. Hart and Tony Honoré argued that we select causes based on **normative expectations**. We don't pick the cat because there is no social or functional expectation that the cat *should* read code. We pick the engineer (or the process) because there *is* an expectation that code gets reviewed.

  **Implication for Postmortems:**
  When you label an omission as a "Root Cause," you are implicitly making a claim about **what should have been normal.**
  *   *Bad:* "The on-call didn't acknowledge the page." (Implies the human failed).
  *   *Good:* "The paging system allowed critical alerts to be silenced without acknowledgment." (Implies the system deviated from the expected safety norm).

  If you treat "Root Cause" as a metaphysical truth, you get stuck. If you treat it as a **violation of a safety norm**, you can distinguish the engineer from the cat. The engineer is part of the safety norm; the cat is not.

  ### 2. The Engineering Filter: Interventionism
  Philosopher of science James Woodward proposed an **Interventionist Theory of Causation**. Roughly: $X$ causes $Y$ if manipulating $X$ changes $Y$.

  This is where the "cat" test actually becomes useful for engineering.
  *   **Can we intervene on the cat?** No. We cannot train the cat to review PRs in a way that is cost-effective or reliable.
  *   **Can we intervene on the process?** Yes. We can add CI checks, require two approvals, or automate rollbacks.

  In incident review, a "Cause" is not something that *made* the incident happen in a physical sense; it is a **leverage point** where future intervention prevents recurrence.

  **Implication for Postmortems:**
  Stop looking for "The Cause." Start looking for "Actionable Leverage Points."
  If an omission is identified (e.g., "No rollback script"), ask: **Is this a place where we can inject energy to change the outcome next time?**
  *   If the answer is "We will tell Bob to write rollback scripts," that is low leverage (humans forget).
  *   If the answer is "We will block deployments without a rollback flag," that is high leverage (system enforces norm).

  ### 3. The "Blameless" Paradox of Omissions
  You noticed that postmortems often pin the cause on an omission (e.g., "Reviewer didn't catch bug"). This is dangerous for a "blameless" culture.

  Why? Because **omissions are inherently personal.**
  *   Commission (doing something wrong): "I pushed the wrong button." (Can be framed as a system allowing the button to be pushed).
  *   Omission (not doing something right): "I didn't check the logs." (Harder to frame as anything other than personal negligence).

  When you label an omission as the Root Cause, you are effectively saying, "The system worked as designed, but a human failed to act as a safety net." That is blame, even if you don't use the word.

  **The Principled Distinction:**
  To keep it blameless, you must shift the omission from the **human** to the **system design**.
  *   *Human Omission:* "Engineer didn't run the migration dry-run."
  *   *System Omission:* "The deployment pipeline permitted a migration to run without a mandatory dry-run phase."

  The system "omitted" a guardrail. The human merely flowed through the gap the system left open. This solves the philosophical puzzle: The cause isn't that the human *didn't* do X; the cause is that the system *allowed* X to be skipped.

  ### 4. So, is "Root Cause" a Lie?
  Yes, but a necessary one.

  In complex socio-technical systems, there is no singular "Root Cause." There is only a **causal field**. An incident is the result of thousands of things going right (usually) and a specific combination of things aligning poorly (the Swiss Cheese Model).

  Selecting one "Root Cause" is an act of **narrative compression**. We choose the story that allows us to sleep better at night and spend our budget effectively.

  *   If we choose "The Cat," we learn nothing.
  *   If we choose "The Engineer," we create fear and hide errors.
  *   If we choose "The Process Constraint," we improve reliability.

  ### Summary: How to Apply This
  You asked if there is a principled way to say the engineer's omission is THE cause and the cat's isn't. The principle is **Control + Normativity.**

  1.  **Normativity:** Was there a reasonable expectation that this event should occur? (Yes for engineer, No for cat).
  2.  **Control:** Can the organization reliably ensure this event occurs in the future? (Yes for process, Maybe for individual humans, No for cats).

  **Recommendation for your Postmortems:**
  Ban the phrase "Root Cause." Replace it with **"Contributing Factors"** and **"Actionable Remediations."**

  When someone suggests an omission as a cause (e.g., "On-call didn't page"), force the room to pass the **Cat Test**:
  1.  **Is this a deviation from a defined norm?** (Did we expect the page?)
  2.  **Is this an intervention point?** (Can we fix the pager, or just yell at the on-call?)
  3.  **Is this systemic?** (Did the system allow the omission to result in an outage?)

  If you can't answer "Yes" to all three, it's not a cause worth writing down. It's just noise. By admitting that "Root Cause" is a pragmatic selection rather than a metaphysical discovery, you liberate your team to focus on **systemic resilience** rather than **hunting for the one thing that didn't happen.**
