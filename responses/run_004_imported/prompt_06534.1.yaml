answer: |-
  # The Scythe and the Ceiling: Why Expected Utility Must Die

  The St. Petersburg Paradox is the grenade that decision theory has been trying to defuse for three hundred years. The setup is deceptively simple: a casino flips a fair coin until it lands heads. If heads appears on the first flip, you win $2. If it takes two flips, you win $4. Three flips, $8. On the $n$-th flip, you win $2^n$. How much should you pay to play?

  Mathematically, the expected value (EV) is infinite. The probability of winning $2^n$ is $1/2^n$, so the sum is $\sum (1/2^n) \cdot 2^n = \sum 1 = \infty$. Yet, intuitively, no sane person would pay more than $25 to enter. In 1738, Daniel Bernoulli offered the classic solution: money has diminishing marginal utility. We don't maximize expected dollars; we maximize expected *utility*. If utility grows logarithmically with wealth ($U(w) = \ln(w)$), the infinite sum converges to a finite number. Problem solved.

  Or so it seemed. In 1934, the mathematician Karl Menger picked up the scythe. He demonstrated that Bernoulli's fix is merely a patch, not a cure. Menger proved that for *any* unbounded utility function, no matter how slowly it grows, one can construct a "Super St. Petersburg" game with payouts that grow fast enough to make the expected utility infinite again. If your utility function goes to infinity, I can build a game that outpaces it.

  This leaves us with a stark dilemma. Menger's theorem implies that to kill the paradox generally, utility must be bounded—there must be a hard ceiling on how much value anything can have. But this feels philosophically repulsive. Does a billionaire truly gain zero additional welfare from an extra dollar? And as you noted, this bleeds directly into "Pascal's Mugging," where a stranger threatens to simulate and torture $3 \uparrow\uparrow\uparrow 3$ lives unless you give them five dollars. Unbounded utility says you should pay; bounded utility says you shouldn't.

  So, how do we resolve this? We have three main options on the table: accept the hard ceiling, rely on physical limits, or burn the framework down. After weighing them, I commit to a verdict: **We must abandon Expected Utility (EU) Maximization as a normative ideal.** The problem isn't the utility function; it's the linear weighting of probability.

  ### The Trap of the Hard Ceiling

  The first option is to accept Menger's conclusion literally: Utility must be bounded. Mathematically, this is clean. If there is a maximum possible utility $U_{max}$, then no game can exceed it, and the expectation always converges.

  However, the philosophical cost is steep. A bounded utility function implies a point of satiation where more resources yield *no* increase in value. In a biological sense, this makes sense; you can only eat so much food. But in the context of rational agency and ethics, it implies absurdities. If utility is bounded at, say, 1 billion "hedons," then saving one life is valuable, but saving a trillion lives might hit the ceiling, rendering the additional 999 billion lives morally irrelevant. This violates the principle of *dominance*—a state where everyone is better off should be preferred to a state where they are not.

  Furthermore, the bound feels arbitrary. Where is the ceiling? Is it set by human neurology? By the entropy of the universe? While one could argue that a finite brain can only process finite information (imposing a physical bound), this conflates *experiencing* value with *valuing* outcomes. We can conceptually value the survival of humanity even if we won't be around to experience it. To solve a math problem by capping human value feels like a category error.

  ### The "Finite Casino" Defense

  A second, more pragmatic option is to reject the premise of the game itself. In the real world, no casino has infinite money. If the casino's bankroll is capped at $W$, the game must end once the pot exceeds $W$. This renders the expected value finite immediately.

  This is the "physicist's solution." It argues that the paradox is an artifact of applying infinite mathematics to a finite universe. While true, it is theoretically unsatisfying. The St. Petersburg Paradox isn't about a specific casino; it's about the structure of rational choice under uncertainty. If our decision theory only works when the stakes are low and the probabilities are high, it is not a general theory of rationality. It fails precisely where we need it most: in evaluating low-probability, high-impact risks (like existential catastrophe or, conversely, Pascal's Mugging). Dismissing the paradox because "infinity doesn't exist" is a way of refusing to do the math, not solving it.

  ### The Verdict: Reject Expected Utility

  This leaves the third option: Menger proved that *if* you maximize Expected Utility, *then* utility must be bounded. This is a conditional statement ($EU \rightarrow Bounded$). Most people accept EU and reluctantly accept Boundedness. I argue we should use *Modus Tollens*: If Boundedness is unacceptable, then EU must be rejected.

  Expected Utility Theory assumes that we weigh outcomes by their raw probability. It treats a 1-in-a-trillion chance of infinite value as literally one-trillionth of infinity. But human rationality—and arguably, coherent rationality—does not work linearly in the tails.

  The superior framework is **Risk-Weighted Expected Utility (RWEU)**, championed by contemporary philosophers like Lara Buchak. In RWEU, agents do not just maximize $\sum p_i U(x_i)$. Instead, they apply a risk function $r(p)$ that transforms probabilities before weighting them. A risk-averse agent effectively treats a tiny probability as even smaller.

  This solves the St. Petersburg Paradox without capping utility. You can maintain that saving a trillion lives is infinitely better than saving one (unbounded utility), but you simultaneously acknowledge that a probability of $1/2^{100}$ is decision-theoretically negligible. It captures the intuition that we are justified in ignoring "Pascal's Muggings" not because the stakes aren't high enough, but because the probabilities are too thin to support the weight of the decision.

  This approach also aligns better with statistics. In empirical work, we know that estimating the tails of a distribution is notoriously error-prone. Basing a decision on the far tail of an unbounded distribution is statistically reckless. RWEU formalizes this caution. It admits that when probabilities approach zero, the linear expectation formula becomes unstable and should be discounted.

  ### Conclusion

  Menger was right that Bernoulli was wrong, but he was working within a broken framework. The demand for a "hard ceiling" on utility is a symptom of trying to force a linear tool onto a non-linear problem. A hard ceiling on value is ethically and psychologically implausible.

  Therefore, the verdict is clear: **Expected Utility Maximization is not the final word on rationality.** It is an approximation that holds for moderate stakes and probabilities but fractures in the extremes. We should adopt a Risk-Weighted model that allows utility to remain unbounded (preserving our ethical intuitions) while down-weighting the extreme tails (preserving our sanity). The St. Petersburg Paradox doesn't teach us that money has a limit; it teaches us that *expectation* has a limit.
