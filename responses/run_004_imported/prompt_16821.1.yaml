  "The story about David Lewis..."
  "He didn't want to say Christ went to prison for us. He said Christ paid the fine."
  "But he also knew Lewis didn't solve it."
  "This honesty was his sermon."
  "Now he rests."

  *Let's flesh this out into the final speech.*

  10. **Final Review:** Does this meet the "no wincing" criteria?
