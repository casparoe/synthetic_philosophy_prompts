answer: |-
  Good morning. To the friends from the seminary and the university, and to the beloved congregation who filled the pews for decades: thank you for being here.

  If you knew my grandfather, you know that standing at the intersection of faith and reason was not a burden to him; it was a home. He loved the gospel with a whole heart, but he loved the truth with a meticulous mind. He believed that God was not threatened by our questions, and that intellectual honesty was not the enemy of piety, but a form of it.

  There is a story many of you in the philosophy seminar know well, but I want to tell it for the sake of the congregation, because it explains so much about the man we are honoring.

  Late in his retirement, Grandfather audited a seminar on the philosophy of religion. He became fixated on an essay by David Lewis regarding penal substitution. Lewis pointed out a peculiar thing about our moral intuitions: we allow a friend to pay someone's fine, but we do not allow a friend to serve someone's prison sentence. A debt is transferable; a punishment of the body is not.

  Based on this distinction, my grandfather made a quiet but firm resolution in his preaching. He would speak of Christ paying a debt on the cross. He would speak of grace covering what we owed. But he would not preach that Christ "served a prison sentence" in our place. He felt that metaphor broke down under scrutiny, and he refused to ask you to believe something that sounded logically incoherent.

  But here is the part that matters most, and I ask the congregation to listen closely: My grandfather knew that David Lewis's essay did not end with a proof. It ended in open puzzlement. Lewis did not solve the mystery of the atonement. And Grandfather was adamant that no philosopher could.

  He hated sermons that invoked big names to sound more certain than the argument warranted. He knew that theology often lives in the space where logic reaches its limit. He didn't refine his language to show off his intellect; he refined it because he believed that sloppy language about God eventually leads to a sloppy faith. He wanted the words you sang on Sunday to hold weight on Monday. He wanted your comfort to be built on rock, not on a metaphor that crumbles when you touch it.

  To his old congregation: I know you loved him for the plain comfort of the gospel. I want you to know that his precision was never meant to withhold that comfort, but to protect it. He insisted on the language of "debt paid" because he wanted you to know that the transaction of grace was real, even if the mechanics were beyond us. He didn't want you to have a faith that couldn't survive a question.

  To his seminar friends: I know you valued his integrity. You know he never claimed Lewis vindicated the doctrine. He simply found a way to speak faithfully without speaking falsely. He respected the mystery too much to pretend it was a math problem.

  In the end, my grandfather was not a man who needed to have the final word. He was a man who was content to stand before the mystery, speak as clearly as he could, and then trust the rest to God.

  There is a profound comfort in that. It means that when he stood before God this week, he didn't go armed with a perfect systematic theology. He didn't go with a syllogism that proved he deserved to be there. He went as he always taught us to go: as a debtor whose bill was marked "Paid," not by his own careful distinctions, but by the grace he spent a lifetime trying to describe accurately.

  The puzzles are over now. The distinctions between fine and sentence, between philosophy and theology, have faded. He is no longer auditing the seminar. He is no longer preparing the sermon. He is resting in the reality that the words only pointed toward.

  To the church: He loved you enough to tell you the truth as best he understood it.
  To the scholars: He respected you enough to admit what he did not know.

  And to all of us: He leaves behind a legacy that says faith is strong enough to handle hard questions, and that grace is deep enough to hold us when the answers run out.

  Rest well, Grandfather. The debt is paid. The work is done. And the puzzle is solved, not by argument, but by presence.

  Amen.
