  10. (Wait, one nuance): Does Leibniz think the *clay* is more real than the *statue*? No, both are aggregates. But the clay might be seen as a collection of organisms (if it's organic matter) or just minerals. Actually, for Leibniz, *all* matter is teeming with living organisms. So Lumpl is a swarm of tiny animals. Goliath is that same swarm arranged statue-wise. This is a great detail to include.

