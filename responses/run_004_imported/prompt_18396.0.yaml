      *   **Bylaws:** Removal is required *if and only if* two conditions are met:
          1.  Fence exceeds height limit ($P$).
          2.  Excess height lowers property value ($Q$).
          *   Rule: If ($P$ AND $Q$) $\rightarrow$ Remove ($R$).
      *   **Voting Round 1 (Issue-based):**
          *   Vote on $P$: 2 Yes, 1 No. (Majority says $P$ is true).
          *   Vote on $Q$: 2 Yes, 1 No. (Majority says $Q$ is true).
          *   *Result:* Since majority says $P$ and majority says $Q$, the board concludes ($P$ AND $Q$) is true $\rightarrow$ Order Removal.
      *   **Voting Round 2 (Outcome-based):**
          *   Vote on $R$ (Remove?): 2 No, 1 Yes. (Majority says Do Not Remove).
      *   **Individual Consistency:** No individual member contradicted themselves.
          *   Member A: Yes on $P$, No on $Q$ $\rightarrow$ No on $R$.
          *   Member B: No on $P$, Yes on $Q$ $\rightarrow$ No on $R$.
          *   Member C: Yes on $P$, Yes on $Q$ $\rightarrow$ Yes on $R$.
          *   *Check:*
              *   $P$ Vote: A(Yes), B(No), C(Yes) $\rightarrow$ 2 Yes.
              *   $Q$ Vote: A(No), B(Yes), C(Yes) $\rightarrow$ 2 Yes.
              *   $R$ Vote: A(No), B(No), C(Yes) $\rightarrow$ 2 No.
      *   **The Paradox:** The board is committed to "Remove" based on the premise votes, but "Do Not Remove" based on the conclusion vote.
      *   **The Question:** Which vote should govern? Is there a principled reason? Is this inevitable in group decision-making?

  2.  **Identify the Underlying Concept:**
      *   This is a classic example of the **Discursive Dilemma** (also known as the **Doctrinal Paradox**).
      *   It arises in judgment aggregation theory.
      *   It highlights the conflict between "premise-based procedure" and "conclusion-based procedure."

  3.  **Evaluate the Two Procedures:**
      *   **Premise-Based Procedure (PBP):** Vote on the conditions ($P$ and $Q$), then apply the rule logically.
          *   *Pros:* Ensures consistency with the bylaws/reasoning. Respects the collective rationale. Prevents "outcome voting" where people ignore the rules to get a desired result.
          *   *Cons:* Can lead to an outcome that a majority of the board actually opposes (as seen here).
      *   **Conclusion-Based Procedure (CBP):** Vote directly on the outcome ($R$).
          *   *Pros:* Reflects the direct will of the majority regarding the action. Simple.
          *   *Cons:* Can violate the established rules/bylaws. A majority might vote to remove even if conditions aren't met (or vice versa), undermining the rule of law within the organization.

  4.  **Analyze the Specific Scenario (Condo Board):**
      *   **Fiduciary/Legal Duty:** Board members are bound by the bylaws. The bylaws act as a contract and a governing rule.
      *   **Rule of Law:** In a legal or quasi-legal context (like a condo board), adherence to the written rules is usually paramount. Ignoring the bylaws because a majority wants a different outcome sets a dangerous precedent.
      *   **Consistency:** If they vote "No Removal" directly, they are effectively voting that "NOT ($P$ AND $Q$)." But they already voted "$P$" and "$Q$." This makes the board's official record contradictory.

  5.  **Formulate the Advice:**
      *   **Name the Phenomenon:** Identify it as the Discursive Dilemma/Doctrinal Paradox. This validates the user's feeling that "something is off" but "no one reasoned badly."
      *   **Explain the Mechanics:** Briefly show the math (A, B, C positions) to confirm understanding.
      *   **Compare the Approaches:**
          *   *Premise-Based:* Better for rule-bound bodies. Ensures the *reasons* are collectively endorsed.
          *   *Conclusion-Based:* Better for political bodies where the outcome matters more than the justification.
      *   **Recommendation for a Condo Board:**
          *   Condo boards are quasi-judicial/administrative. They enforce rules.
          *   Therefore, the **Premise-Based Procedure** is generally legally safer and more principled.
          *   Why? Because the bylaws constrain the board's power. They *cannot* order removal unless $P$ and $Q$ are true. If the majority agrees $P$ and $Q$ are true, they *must* order removal, even if a majority would prefer not to.
          *   Voting directly on the outcome allows members to ignore the bylaws (e.g., voting "No Removal" even if they admit $P$ and $Q$ are true, perhaps out of sympathy). This exposes the association to liability (selective enforcement, breach of fiduciary duty).
      *   **Address the "Breakdown":** Acknowledge that this is a known limitation of collective rationality (List & Pettit). It's not a failure of the individuals, but a structural feature of group logic.

  6.  **Refine the Nuance:**
