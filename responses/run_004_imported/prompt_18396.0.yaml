      *   Maybe the "Property Value" condition is subjective? If it's subjective, maybe the direct vote captures the "collective judgment" on that fact better?
      *   *Correction:* In this specific prompt, the user says "under our bylaws we may only order removal if..." This implies a mandatory constraint.
      *   *Key Distinction:* Is the board acting as a *legislature* (making policy) or a *court* (applying rules)? Condo boards enforcing bylaws are more like courts. Courts use premise-based reasoning (findings of fact $\rightarrow$ application of law $\rightarrow$ verdict).

