answer: |-
  **The Cost of Governance: Why Humeanism Cannot Ground Objective Modal Force**

  The metaphysics of laws of nature is defined by a central tension between ontological parsimony and explanatory power. On one side stands Humeanism, epitomized by David Lewis's Best System Analysis (BSA), which reduces laws to compact summaries of the "Humean mosaic"—the totality of particular, unconnected spatiotemporal facts. On the other stands Anti-Humeanism, which posits that laws possess a genuine, objective modal force that governs or produces the mosaic. The critical question is whether the BSA can adequately ground the robust roles we attribute to laws: their capacity to explain phenomena, support counterfactuals, and underwrite causation. While the Humean offers a metaphysically lean picture that avoids "spooky" necessitation, this essay argues that Humeanism ultimately fails to accommodate the objective modal force inherent in lawhood. By reducing laws to consequences of the mosaic rather than their producers, the BSA reverses the direction of metaphysical dependence, rendering laws explanatorily idle. Consequently, some form of Anti-Humeanism is required to preserve the normative authority of laws, provided it can mitigate the charge of unintelligibility through a naturalized account of dispositions.

  To understand the stakes, one must grasp the Humean commitment. For the Humean, there is no "glue" holding the universe together. There are only point-instant events distributed across spacetime. Laws are not external rulers but internal descriptions. According to the BSA, a law is any generalization that appears as an axiom or theorem in the deductive system that best balances simplicity and strength in summarizing the mosaic. This view is attractive because it respects empiricist scruples; we observe regularities, not necessitation. However, this reduction creates an immediate problem regarding the "objective modal force" of laws. In scientific practice, laws are treated as distinct from accidental generalizations. The statement "all gold spheres are less than a mile in diameter" is true, but accidental; "all uranium spheres are less than a mile in diameter" is lawlike, grounded in critical mass constraints. The Humean must explain this difference without appealing to any modal difference in the world, relying solely on the structural role the generalization plays in the best system.

  The primary Anti-Humean charge, forcefully articulated by philosophers like Tim Maudlin and David Armstrong, is that the BSA gets the direction of explanation backwards. In the Humean picture, the particular facts are metaphysically prior; the laws supervene on them. If the mosaic were different, the laws would be different. But intuitively, and scientifically, the dependency runs the other way: the particles move as they do *because* the laws dictate it. Maudlin argues that if laws are merely summaries of what happens, they are "book-keeping" devices. A book-keeper's ledger summarizes transactions; it does not cause them. If laws are merely the ledger of the universe, they cannot explain why the transactions occurred. This renders laws explanatorily idle. If a student asks why the apple fell, answering "because it fits the best system summarizing all falling objects" is circular. The law explains the fall only if the law has a status independent of the fall itself. By making laws dependent on the very facts they are supposed to explain, Humeanism strips laws of their governing capacity.

  This explanatory deficit cascades into the realms of counterfactuals and causation. Laws are supposed to support counterfactuals: "If I had struck this match, it would have lit." For the Anti-Humean, this is true because the laws (and the dispositions of the match) remain fixed across nearby possible worlds. For the Humean, however, laws are contingent on the total mosaic. In a world where I strike the match, the total history of the universe is different. If the history is different, the Best System might be different. As John Carroll noted, this leads to the "problem of cosmic accidents." If the law is just a summary of actual events, it is unclear why it should constrain non-actual events. The Humean attempts to rescue this by arguing that the Best System is resilient, but this resilience is a feature of our description, not the world. Thus, the counterfactual support is pragmatic, not objective. Similarly, regarding causation, if laws are just regularities, causation collapses into constant conjunction. But causation implies production. If the Humean reduces both laws and causation to patterns in the mosaic, they lose the resources to explain *why* the pattern holds rather than merely *that* it holds.

  In response, sophisticated Humeans like Barry Loewer and Jonathan Cohen argue that the Anti-Humean demand for "governing" is unintelligible. They contend that the idea of a law "making" things happen invokes a mysterious, quasi-legal relation of necessitation that we have no empirical access to. What is this "necessitation"? Is it a relation between universals? A power? The Humean argues that purchasing explanatory power at the cost of positing invisible, metaphysical glue is a bad trade. Instead, they propose a distinction between metaphysical grounding and scientific explanation. While the mosaic grounds the laws metaphysically, the laws can still explain the mosaic scientifically within our best theoretical frameworks. Explanation, on this view, is pragmatic and context-dependent, not a mirror of metaphysical production. Therefore, the Humean claims they can save the phenomena of scientific practice without the metaphysical excess.

  However, this rejoinder concedes the very point at issue: the *objective modal force* of laws. By admitting that the explanatory power of laws is pragmatic (dependent on human interests in simplicity and strength) rather than metaphysical, the Humean acknowledges that the "force" is not in the world but in our description of it. The prompt asks whether BSA can ground the objective modal force we *ordinarily attribute* to laws. Ordinary scientific realism suggests that laws would hold even if no observers existed to systematize them. If the status of a law depends on the balance of simplicity and strength, and simplicity is arguably a virtue relative to human cognitive architecture, then lawhood becomes anthropocentric. This undermines the objectivity required for genuine modal force. If laws are merely useful fictions for organizing data, they cannot underwrite a robust realism about causation or counterfactuals. The Humean saves intelligibility by sacrificing the objective modality that defines the concept of a law.

  Therefore, a definite verdict is required: Humeanism cannot accommodate the objective modal force of lawhood, and some form of Anti-Humeanism is necessary. To accept Humeanism is to accept that the universe is a "cosmic accident," a vast conjunction of facts with no internal principle of unity. While this avoids the mystery of primitive necessitation, it creates a greater mystery: the uncanny reliability of induction and the depth of scientific explanation. If laws do not govern, the success of science in predicting novel phenomena becomes miraculous.

  Does this force us to accept unintelligible metaphysical glue? Not necessarily. The Anti-Humean need not posit a primitive "necessitation relation" à la Armstrong, which indeed faces the intelligibility objection. Instead, a Dispositionalist ontology offers a viable middle ground. Philosophers like Stephen Mumford and Alexander Bird argue that properties themselves have causal powers or dispositional essences. On this view, the law of gravity is not an external rule imposed on mass, nor is it a summary of falling bodies; it is grounded in the very nature of mass itself. Mass *is* the power to attract. This grounds the modal force of laws in the intrinsic identities of natural kinds. The direction of explanation is preserved: the dispositions of the objects explain the regularities in the mosaic. Furthermore, this avoids the charge of unintelligibility because dispositions are not occult relations; they are defined by their manifestations. We understand what "fragile" means by understanding what happens when something breaks. Similarly, natural powers are intelligible through their causal roles.

  Critics might argue that Dispositionalism leads to a regress (powers defined by manifestations which are defined by powers) or that it collapses the distinction between laws and properties. Yet, these are technical challenges within a framework that at least acknowledges the correct metaphysical direction. It is better to grapple with the architecture of powers than to deny the architecture of governance entirely. The Humean strategy is ultimately a form of error theory regarding modal force; it tells us that what we think laws are (governing principles) is false, and what they really are (summaries) is insufficient to do the job we need them to do.

  In conclusion, the Best System Analysis offers a metaphysically parsimonious account of laws, but parsimony comes at the price of explanatory depth. By making laws supervenient on the mosaic, Humeanism renders them incapable of objectively grounding the counterfactuals and causal relations that define scientific practice. The Humean rejoinder regarding the unintelligibility of necessitation is a potent warning against mysticism, but it does not justify reducing laws to book-keeping. A Dispositionalist Anti-Humeanism provides the necessary corrective, locating modal force within the essences of properties rather than in external relations or human summaries. To preserve the objective modal force that makes laws laws, we must accept that the universe is not merely a collection of facts, but a structure of powers that generates those facts. The cost of intelligibility is high, but the cost of denying the governing nature of laws is the loss of scientific realism itself.
