      *   *Refined Position:* Humeanism fails to ground the *objective modal force* specifically. It can ground a *pragmatic* surrogate, but not the real thing. Since the prompt asks about "objective modal force," the verdict must be that Humeanism is insufficient. I will advocate for a sophisticated Anti-Humeanism (e.g., Dispositionalism or Primitivism) that mitigates the intelligibility cost.

