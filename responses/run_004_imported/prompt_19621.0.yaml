  2. Mia said no way, it matters whose side is actually in the right. Germany started the war, so a German soldier killing an Allied soldier is helping an unjustified cause even if he personally never breaks a rule — she compared it to a getaway driver who never touches the stolen money but is still helping rob the bank.

  3. Jake shot back that a regular soldier can't be expected to independently figure out whether their own government's war is actually just before they get drafted into it (propaganda, censorship, whatever), so it's not fair to treat the two sides differently, which is exactly why the real laws of war don't distinguish between them.

  4. Mia said fine, that might mean the German soldier isn't to blame since he genuinely couldn't have known better, but "not his fault" isn't the same thing as "didn't do anything wrong" — so she said Jake was mixing up being excused for something with actually being justified in doing it.

