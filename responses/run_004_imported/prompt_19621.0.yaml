  so in history class we've been covering WWII and it turned into this whole arguement between two kids in my class, Jake and Mia, about whether an ordinary drafted German soldier who never personally did anything like target civilians or shoot prisoners is just as morally innocent as an American or British soldier doing the exact same kind of fighting on their side. it went like this:

