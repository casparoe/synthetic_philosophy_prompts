          *   *Evaluation:* **This is a significant error.** This description sounds much more like *Constructive Empiricism* (van Fraassen) or perhaps instrumentalism. Structural Realism (specifically Epistemic Structural Realism, ESR, which Worrall advocates) does *not* say we should only commit to observable predictions. It says we should commit to the *structure* (mathematical relations) of the theory, which often describes *unobservables*, just not their intrinsic nature. Worrall argues the *mathematical structure* is retained (Fresnel to Maxwell), not that we should only believe in observables. The student says "restricting realism this way means there is nothing hidden left for the pessimistic induction to be wrong about" - this implies anti-realism about the unobservable structure. Worrall is still a *realist* about the structure.
