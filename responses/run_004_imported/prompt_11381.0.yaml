              *   *Key term:* "Parametric polymorphism" or "soundness of extensions." The infinite regress problem.
          *   *Fix (b):* Adding explicit reflection axioms ($T + \text{Soundness}(T)$).
              *   *Problem:* This creates a stronger theory $T_1$. The new agent runs on $T_1$. But now *it* cannot trust *itself*. It can only trust $T$. So the chain $T_0 \to T_1 \to T_2 \dots$ weakens or changes at every step. You can't have an infinite chain of self-reproducing agents if each step requires a strictly stronger theory (which eventually hits a ceiling or requires infinite strength).
