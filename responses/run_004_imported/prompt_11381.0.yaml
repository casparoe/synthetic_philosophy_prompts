          *   So, if you prove you are sound, you prove you are consistent. Contradiction.
          *   *Analogy:* A judge who rules "Any verdict I make is legally binding." If they rule "I am infallible," is that binding? It creates a loop where the act of claiming authority grants the authority without external check.
          *   *Löb specific:* It's not just about consistency, it's about specific sentences. If the system believes "If I prove X, then X," it effectively treats "I prove X" as sufficient evidence for X. But "I prove X" is a syntactic fact. Bridging Syntax (provability) to Semantics (truth) internally is the leak.

      *   **Part 2: The Failed Fixes.**
