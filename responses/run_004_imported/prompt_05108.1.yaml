  9.  **Final Polish:** Check the specific question about the "foolish daughter" quote. (It's from *De Fundamentis Astrologiae Certioribus*, 1601, not *Tertius*, but close enough contextually). Ensure the distinction between *Tertius Interveniens* and *Harmonice Mundi* is clear (the latter solidifies the metaphysics).

