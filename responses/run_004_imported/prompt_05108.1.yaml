      *   **The Mechanism Problem:** The *Anima Terrae* is the bottleneck. Modern physics kills this. Kepler would have to concede the mechanism is wrong, but might argue the *correlation* remains (instrumentalism).
      *   **Falsifiability:** His theory *was* falsifiable in principle (weather prediction), but he insulated it by making the effects "archetypal" and "probabilistic."
      *   **The 8 Minutes of Arc Parallel:** Remind the user that Kepler abandoned circles because of data. If aspect data showed no correlation with weather, he *should* (by his own standards) abandon aspects. But would he? His Neoplatonism might resist.

