      *   **Topic:** Kepler's *Tertius Interveniens* (1610), specifically his position between Roeslin (traditional astrology) and Feselius (anti-astrology).
      *   **Key Concept:** Kepler's "reform" of astrology (rejecting vulgar apparatus like houses/zodiac, keeping aspects/harmonics acting on the Earth's soul).
      *   **The Question:** How would Kepler react to 20th-century empirical debunking (Carlson, Gauquelin)? Would he see it as vindication of his pruning or as missing the point of his specific theory? Was his core theory falsifiable?
