answer: |-
  Your intuition is sharp, and you are not alone in noticing the structural resemblance. In fact, formal social choice theorists acknowledge that preference aggregation and judgment aggregation are mathematically isomorphic under certain conditions. You *can* translate a Condorcet cycle into a set of inconsistent judgments, and vice versa.

  However, characterizing the Discursive Dilemma (and the List-Pettit framework) as merely Condorcet's paradox in "new notation" understates the theoretical contribution. While they are "cousins" in the family of impossibility results, treating them as identical misses three crucial distinctions: the **ontological domain** (preferences vs. truth), the **structure of reasoning** (premises vs. conclusions), and the **scope of the impossibility** (a specific cycle vs. a general theorem).

  Here is why theorists treat the Discursive Dilemma as a distinct and significant discovery.

  ### 1. Preferences vs. Truth-Apt Judgments
  The most immediate distinction is what is being aggregated.
  *   **Condorcet** deals with **preferences** ($A \succ B$). These are subjective, ordinal rankings. They are not "true" or "false"; they are expressions of desire or welfare.
  *   **The Discursive Dilemma** deals with **judgments** ($P$ is true). These are binary, truth-apt propositions about the world (or the law).

  **Why this matters:**
  In democratic theory, there is a longstanding debate between *aggregative democracy* (satisfying wants) and *deliberative democracy* (tracking truth or reason). Condorcet's paradox suggests the "will of the people" might be incoherent. The Discursive Dilemma suggests the "reason of the people" might be incoherent.
  If you reduce the Discursive Dilemma to Condorcet, you lose the ability to analyze bodies like courts, scientific panels, or central bank committees, whose job is not to express preferences but to make truth-claims that must be logically consistent. A court ruling that is logically inconsistent (e.g., finding a defendant liable based on premises that, if voted on separately, would not support liability) is a different normative failure than a legislature failing to elect a winner.

  ### 2. The Premise/Conclusion Distinction
  This is the strongest argument for the Discursive Dilemma's distinctness.
  *   In **Condorcet voting**, there are no "premises." You simply rank alternatives. The inconsistency arises from the *transitivity* of the aggregate relation.
  *   In the **Discursive Dilemma**, the agenda contains **logical connections** (e.g., $P$, $P \to Q$, therefore $Q$).

  This introduces a specific procedural dilemma that has no direct analogue in standard preference voting: **Should the group vote on the premises or the conclusion?**
  *   **Premise-based procedure:** Vote on $P$ and $Q$, then derive $R$. (Ensures consistency, might override the majority view on the conclusion).
  *   **Conclusion-based procedure:** Vote on $R$ directly. (Respects the majority on the outcome, might ignore the logical reasons).

  Condorcet's paradox does not offer a "procedure" fix in the same way. You cannot vote on "premises of preference" to solve a cycle. The Discursive Dilemma forces theorists to grapple with the structure of *reasoning*, not just the structure of *choice*. This shifted the field from "how do we vote?" to "how do we reason together?"

  ### 3. Paradox vs. General Theorem
  You mentioned Condorcet's *Paradox* specifically, but List and Pettit's contribution is better compared to Arrow's *Theorem*.
  *   **Condorcet (1785)** provided a specific counter-example (a profile of 3 voters and 3 alternatives) showing majority rule can fail. It took nearly 200 years for Arrow to prove the *General Impossibility Theorem* (1951) showing that *no* ranking system can satisfy certain conditions.
  *   **Kornhauser & Sager (1986)** identified the "Doctrinal Paradox" (the legal version of the Discursive Dilemma).
  *   **List & Pettit (2002)** did not just restate the paradox; they proved a **General Impossibility Theorem for Judgment Aggregation**.

  They showed that *no* aggregation function (not just majority rule) can satisfy a set of minimal conditions (Universal Domain, Consistency, Completeness, Anonymity, Systematicity) when the agenda is sufficiently interconnected.
  By elevating the observation from a specific paradox (like Condorcet) to a general theorem (like Arrow), List and Pettit showed that the problem is not just a quirk of majority voting, but a fundamental structural limitation on collective rationality itself.

  ### 4. Group Agency and Responsibility
  Finally, the philosophical stakes differ.
  *   **Condorcet** is often used to argue against the coherence of a "collective will."
  *   **List & Pettit** use the Discursive Dilemma to argue *for* the existence of "group agents."

  In their book *Group Agency* (2011), they argue that to avoid the Discursive Dilemma, a group must organize itself to maintain consistency over time, effectively becoming an agent distinct from its members. This has implications for moral responsibility (can a corporation be blamed?) that Condorcet's preference cycles do not address. If the dilemma were just Condorcet restated, this entire literature on corporate moral agency would lack its foundational puzzle.

  ### Summary
  Your suspicion is mathematically grounded: there is an isomorphism between preference profiles and judgment profiles. If you view social choice purely as a branch of combinatorics, the Discursive Dilemma looks like a special case of impossibility results involving binary relations.

  However, in political theory and philosophy, **context is content.**
  1.  **Ontology:** Truth vs. Preference.
  2.  **Procedure:** Premise-based vs. Conclusion-based reasoning.
  3.  **Generality:** A general theorem vs. a specific cycle.
  4.  **Implication:** Group Agency vs. Collective Will.

  The Discursive Dilemma is not just Condorcet with new notation; it is the application of impossibility logic to the domain of *reasons* rather than *wants*. That shift allowed theorists to analyze the rationality of courts, cabinets, and corporations in ways that preference aggregation never could.

  **Recommendation:** If you want to explore the mathematical link without losing the philosophical distinction, look into **Christian List's** work on the "Logic of Group Decision Making." He explicitly addresses the isomorphism while defending the distinctiveness of the judgment aggregation framework.
