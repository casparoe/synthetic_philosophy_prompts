answer: |-
  This is a sophisticated and well-posed problem. It cuts to the heart of the viability of Logical Empiricism as a worldview rather than merely a methodology. The tension you identify—between Carnap's semantic elimination of normative truth and his robust commitment to socialist planning—is indeed often glossed over in standard histories, which tend to either paint the Vienna Circle as value-neutral technicians or (following George Reisch and others) as crypto-political activists forced into silence by the Cold War.

  To address this specifically in Carnap's case, we must look at how he attempted to reconstruct political discourse *within* the bounds of his semantics. The short answer is that Carnap attempts to resolve this via a rigorous **instrumentalization of politics**, treating social organization as a problem of "social technology." However, whether this successfully shields him from the charge of smuggling in metaphysical commitments depends on whether one accepts his distinction between "decisions" and "assertions."

  Here is a working-through of that tension.

  ### 1. The Semantic Barrier: *Logical Syntax* and the Status of Norms
  In *Philosophy and Logical Syntax* (1935) and the slightly earlier *Logical Syntax of Language* (1934), Carnap's position is clear: normative sentences (e.g., "Killing is wrong" or "We ought to plan the economy") lack truth conditions. They are not constative statements; they are volitional expressions disguised as assertions.

  For Carnap, a statement is cognitively meaningful only if it is either analytic (logic/math) or empirically verifiable (science). Value judgments fit neither. Therefore, strictly speaking, a debate between a socialist and a laissez-faire liberal is not a theoretical debate. It is a clash of attitudes. If Carnap adheres strictly to this, his advocacy for socialism cannot be an advocacy for its *truth*, but only an expression of his *preference*.

  ### 2. The Escape Route: Social Technology and Means-Ends Rationality
  Carnap's primary strategy to navigate this without abandoning political engagement is to recast political questions as **technical questions**. This relies on the Humean fork, but with a Logical Empiricist twist.

  *   **The Ends:** The ultimate ends of a society (e.g., "human welfare," "reduction of suffering," "freedom") are matters of volitional decision (*Willensentscheidung*). Science cannot validate these. Carnap admits this. He cannot prove *that* we ought to seek human welfare.
  *   **The Means:** Once the ends are fixed (by decision), the question of how to achieve them becomes a purely empirical, scientific question.

  Carnap argues that the debate between planning and laissez-faire is often mistakenly framed as a clash of ultimate values. He contends that if both sides agree on the empirical goal (e.g., maximizing the satisfaction of needs), the question of *which system achieves this* is a matter for sociology and economics, not metaphysics.

  In this view, Carnap is entitled to argue for planning **not** because planning is "morally right," but because planning is **causally more efficient** at achieving the agreed-upon empirical ends. He treats socialism as a hypothesis in social engineering. If the hypothesis "central planning reduces unemployment" is verified by data, then supporting planning is a rational act consistent with the scientific world-conception.

  **The Limit:** This only works if the political opponent accepts the same empirical ends. If a fascist argues, "I prefer hierarchy even if it reduces total welfare," Carnap's semantics force him to say, "We have different volitions." He cannot say, "You are wrong." He can only say, "I will fight you."

  ### 3. The Principle of Tolerance as a Political Analogy
  There is a deeper, structural parallel in Carnap's thought that often goes unnoticed in this context: the **Principle of Tolerance**. Introduced in *Logical Syntax*, this principle states that there is no "correct" linguistic framework, only more or less *useful* ones. We choose a framework (e.g., one that includes numbers, or one that includes modal operators) based on pragmatic utility for our scientific goals.

  Some scholars (such as Thomas Uebel and Alan Richardson) have suggested that Carnap implicitly extends this tolerance to social frameworks.
  *   **Linguistic Frameworks:** Chosen based on efficiency, fruitfulness, and simplicity.
  *   **Social Frameworks:** Chosen based on similar pragmatic criteria.

  If we view a "socialist economy" as analogous to a "linguistic framework," Carnap's advocacy becomes consistent. He is not claiming socialism is *True* in a metaphysical sense; he is claiming it is the more **expedient framework** for the task of organizing human life, given our current scientific knowledge. This allows him to argue vigorously for planning without violating his non-cognitivism. He is recommending a tool, not preaching a gospel.

  However, this analogy strains under pressure. Linguistic frameworks are chosen by scientists to facilitate deduction and prediction. Social systems are lived realities involving coercion and distribution. To treat the choice of socialism as merely a choice of "framework" risks trivializing the normative stakes of political oppression, which Carnap clearly cared about deeply.

  ### 4. Carnap vs. Neurath: The Naturalistic Divergence
  It is crucial to distinguish Carnap here from Otto Neurath, as their solutions to this puzzle differ.
  *   **Neurath** was a physicalist who tried to naturalize values. For Neurath, "happiness" or "well-being" could be described in physicalist terms (calories, housing square footage, health stats). Thus, for Neurath, the "good" is partially reducible to the "true." This makes the leap from science to socialism much shorter for Neurath.
  *   **Carnap** remained more Kantian/Formalist. He never fully naturalized the "ends." For Carnap, the decision to value well-being remains a non-cognitive volition.

  This makes Carnap's position more fragile than Neurath's. Neurath could claim science *demands* socialism because socialism maximizes physical well-being (a factual claim). Carnap can only say science *informs* socialism, but the commitment to well-being itself rests on a pre-scientific decision.

  ### 5. Does Practice Exceed Semantics?
  To answer your core question: **Does his practice commit him to more than his stated semantics can license?**

  **The Argument for Consistency:**
  Carnap can claim consistency if he views his political engagement as **persuasion regarding facts + expression of volition**.
  1.  He expresses his volition (I want a society without poverty).
  2.  He presents empirical evidence (Planning reduces poverty more than markets).
  3.  He invites others to share the volition and accept the evidence.
  Nothing here requires a normative statement to be *true*. It only requires it to be *effective*.

  **The Argument for Inconsistency:**
  The tension breaks open when we consider the **force** of Carnap's advocacy. In the 1929 Manifesto (*The Scientific Conception of the World*), the Circle explicitly links the scientific worldview to the "modern social movement." They do not present this as a mere preference. They present it as an historical inevitability linked to the progress of reason.

  When Carnap argues against metaphysics, he often argues that it is not just "false" but **socially harmful**—that it obscures clear thinking and aids reactionary forces. But if ethics is non-cognitive, the claim "metaphysics is socially harmful" is itself an empirical claim, while the claim "we ought to avoid harmful things" is a volitional one.

  If Carnap believes that the adoption of the scientific attitude *itself* carries a moral obligation to progress, he is smuggling in a normative premise that his semantics cannot support. He relies on a shared humanism—a belief that "clarity," "cooperation," and "welfare" are objectively better than "obscurity," "conflict," and "suffering." His semantics classify this belief as a poem, but his politics treat it as a premise.

  ### Conclusion
  There is a **principled way** Carnap carves off the technical question: by treating politics as **social technology** and ethical commitments as **volitional decisions** subject to pragmatic evaluation (via the Principle of Tolerance). This allows him to argue for planning as the *efficient means* to shared *human ends* without claiming those ends are scientifically verifiable.

  However, this solution is stable only so long as the "ends" are not contested. In the fraught political context of the 1930s, the ends *were* contested. When Carnap argues for socialism against fascism, he is not merely debating efficiency; he is making a stand on the value of human life itself. His semantics force him to classify that stand as a non-rational decision.

  Therefore, while Carnap has a **formal defense** against the charge of contradiction, his **philosophical practice** reveals a reliance on a normative humanism that his official semantics declare meaningless. He wants the scientific authority to condemn fascism, but his own logic denies science the authority to condemn anything. In the end, Carnap's political engagement likely commits him to a "naturalized" normativity he never fully articulated, anticipating the later pragmatic turns of Quine or the critical theory of the Frankfurt School (with whom he otherwise had little truck), rather than resting comfortably within the strict bounds of *Logical Syntax*.
