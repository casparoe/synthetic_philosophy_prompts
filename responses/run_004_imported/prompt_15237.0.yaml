prompt: |-
  I got moved onto my company's trust and safety policy team three weeks ago and immediately inherited a mess nobody wanted to own. Our slur policy right now is a giant blocklist -- if a post contains certain words its auto-removed, full stop, regardless of who posted it or why. In the last two weeks alone that's nuked a domestic violence survivor quoting exactly what her ex called her in a post warning other women about him, a musician's label re-uploading a song that had been live for years with zero issues, and a couple of queer creators using a word for themselves that I use for myself too, honestly, which is probably why this one's gotten under my skin more then the average work problem. Meanwhile everyone knows people dodge the filter with spacing and lookalike letters, so it's not even reliably catching the harassment it's supposedly there for.

  Half the team wants to just keep patching the blocklist, since at least it's consistent, cheap, and can't be talked around by anyone claiming special context. The other half wants something that looks at who's posting, who it's aimed at, and whether it reads as reclaiming or reporting or quoting versus attacking -- except nobody on that side can explain how a filter, or even a human reviewer at our volume, is supposed to tell any of that apart without asking millions of strangers to prove their identity, which obviously isn't happening.

  My manager wants a one-page recommendation from me by Friday, something more principled than 'we'll know it when we see it,' with rules a moderator could actually apply the same way twice. Could you draft that memo for me? I need it to land on an actual recommendation, not just 'it depends,' and I want it to take the blocklist side seriously rather than treating them as lazy or callous, since if I'm honest I was leaning against them before I had to defend it in writing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** New member of Trust & Safety (T&S) policy team (3 weeks in).
      *   **Problem:** Inherited a broken slur policy (rigid blocklist).
      *   **Consequences:** False positives (DV survivor quoting abuser, musician's old song, queer creators reclaiming slurs). Ineffectiveness (bad actors bypass filters).
      *   **Internal Conflict:**
          *   *Side A (Blocklist):* Consistent, cheap, objective, hard to argue with.
          *   *Side B (Contextual):* Nuanced (intent, identity, reclamation), but operationally vague, hard to scale, privacy concerns (identity verification).
      *   **Manager's Ask:** One-page recommendation by Friday. Needs to be principled, actionable (rules moderators can apply consistently), and decisive (not "it depends").
      *   **User's Stance:** Wants to take the Blocklist side seriously (acknowledge their valid points about consistency/scale) but clearly leans towards fixing the nuance problem (given the personal impact and the obvious failures).
      *   **Goal:** Draft a memo that bridges the gap, acknowledges constraints, and proposes a workable policy shift.

  2.  **Determine the Core Recommendation:**
      *   A pure blocklist is failing (false positives + easy bypass).
      *   A pure "contextual AI/human review everything" is impossible (scale + privacy).
      *   *Solution:* A **Tiered Enforcement Model**.
          *   Keep the blocklist for *high-severity* slurs (racial epithets, etc.) where context rarely excuses usage by non-targeted groups.
          *   Create a "Review Queue" for *reclaimable/ambiguous* terms.
          *   Establish clear *Policy Guidelines* for moderators to assess context (Self-identification, Reporting, Quoting vs. Attacking).
      *   *Why this works:* It addresses the Blocklist team's need for efficiency (most stuff still auto-flagged) and the Context team's need for nuance (sensitive cases get human eyes). It gives moderators specific rules.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the problem and the recommendation clearly up front.
      *   **Current State Analysis:** Acknowledge the validity of the current blocklist (consistency, scale) but highlight the critical failures (false positives, bypass, community trust). *Crucial: Validate the Blocklist team's concerns as requested.*
      *   **Proposed Policy Framework:** The "Tiered Approach."
          *   *Tier 1: Zero-Tolerance (Auto-Remove).* Hard slurs.
          *   *Tier 2: Context-Dependent (Human Review).* Reclaimable terms, reporting, artistic use.
      *   **Operational Guidelines for Moderators:** This is the "rules a moderator could actually apply" part.
          *   *The "Who" Test:* Is the poster part of the targeted group? (Self-declaration vs. proof).
          *   *The "Why" Test:* Is it attacking, reporting, or creating?
          *   *The "Where" Test:* Public vs. Direct Message (if applicable).
      *   **Implementation Plan:** Phased rollout, training, metrics.
      *   **Conclusion:** Reiterate the balance between safety and expression.

  4.  **Refining the Tone:**
      *   Needs to be professional, empathetic, but firm.
      *   Avoid blaming the previous team ("inherited a mess" -> "legacy system").
      *   Acknowledge the difficulty of the task (no perfect solution).
      *   Ensure it fits on one page (concise language).

  5.  **Addressing Specific Constraints:**
      *   *Identity Verification:* The prompt mentions nobody wants to ask strangers for ID. The policy must avoid requiring proof of identity. Instead, rely on *self-declaration* and *pattern of behavior*.
      *   *Consistency:* The guidelines must be binary enough for moderators to agree.
      *   *Blocklist Validation:* Explicitly state why the blocklist team is right about *some* things (scale, consistency).

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is this too vague on "Context-Dependent"?
      *   *Fix:* Add specific criteria for moderators (e.g., "Presence of counter-speech," "Account history").
      *   *Critique:* Is it one page?
      *   *Fix:* Keep paragraphs tight. Use bullet points.
      *   *Critique:* Did I validate the Blocklist team?
      *   *Fix:* Ensure the "Current State" section acknowledges that automation is necessary for volume, just not sufficient for *this* specific policy.

  7.  **Final Polish:** Check for clarity, impact, and alignment with Trust & Safety industry standards (e.g., Santa Clara Principles, though maybe too jargon-heavy for this internal memo, keep the spirit). *Decision: Keep it practical, not academic.*

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Trust & Safety Leadership
  **FROM:** [Your Name], Policy Team
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation: Transitioning from Rigid Blocklist to Tiered Enforcement Model

  **Executive Summary**
  Our current slur policy relies on a rigid keyword blocklist. While this approach offers operational consistency and scale, recent false positives (survivors reporting abuse, artists posting lyrics, marginalized users reclaiming language) and high bypass rates indicate the system is failing both safety and equity goals. I recommend transitioning to a **Tiered Enforcement Model**. This retains automation for high-severity hate speech while routing ambiguous or reclaimable terms to human review with specific contextual guidelines.

  **Analysis of Current Approach**
  The Blocklist Team's concerns are valid. Automation is the only way to handle our volume, and objective rules protect moderators from subjective burnout. However, a binary "contain/remove" policy treats all usage as harassment. This disproportionately silences the very communities we aim to protect (e.g., queer users reclaiming slurs) while failing to stop bad actors who easily obfuscate text. Consistency in enforcement cannot come at the cost of accuracy.

  **Proposed Framework: Tiered Enforcement**
  We will categorize restricted language into two tiers:

  *   **Tier 1 (Zero-Tolerance):** Historically violent epithets with no common reclaimation usage.
      *   *Action:* Auto-remove + Account Strike.
      *   *Rationale:* Context rarely mitigates harm; automation remains appropriate.
  *   **Tier 2 (Context-Dependent):** Terms subject to reclaimation, artistic use, or reporting.
      *   *Action:* Auto-flag for Human Review (do not auto-remove).
      *   *Rationale:* Requires intent analysis to distinguish harassment from expression or reporting.

  **Operational Guidelines for Moderators (Tier 2)**
  To ensure consistency without requiring identity verification, moderators will apply the following **three-point test**. If *any* condition is met, the content is allowed.

  1.  **Self-Identification:** Is the poster using the term regarding themselves or their own community?
      *   *Rule:* We accept self-declaration. If a user's profile, bio, or post history indicates membership in the targeted group, the usage is permitted. We do not request ID.
  2.  **Reporting/Warning:** Is the term quoted to warn others or report abuse?
      *   *Rule:* Usage is permitted if surrounded by context markers (e.g., "He called me...", "Do not engage with this user..."). The slur must be necessary to convey the severity of the report.
  3.  **Artistic/Educational:** Is the content clearly creative or informational?
      *   *Rule:* Lyrics, scripts, or historical discussion are permitted if the account shows a pattern of creative/educational posting (not a newly created account solely posting slurs).

  **Implementation & Metrics**
  *   **Phase 1 (Weeks 1-4):** Move Tier 2 terms out of auto-remove and into the review queue. Update moderator playbooks with the Three-Point Test.
  *   **Phase 2 (Weeks 5-8):** Audit false positives/negatives. Calibrate guidelines based on moderator feedback.
  *   **Success Metrics:** Reduction in user appeals regarding false positives; maintenance of <24h review time for flagged content; stable volume of Tier 1 auto-removals.

  **Conclusion**
  This model acknowledges that scale requires automation, but safety requires nuance. By reserving human judgment for the contexts where algorithms fail, we protect vulnerable users from both harassment and erasure, while providing moderators with clear, defensible rules.

  **Recommendation:** Approve transition to Tiered Enforcement effective [Date].
