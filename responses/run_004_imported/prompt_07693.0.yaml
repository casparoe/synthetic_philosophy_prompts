answer: |-
  **Setting:** *A sterile, white void. OMEGA has just vanished, leaving behind the hum of a coin that has already landed. ARTHUR (CDT) is relaxing his shoulders. ELARA (UDT) is reaching for her wallet.*

  **Arthur:** Put your wallet away, Elara. It's over.

  **Elara:** It's not over until I decide. I'm giving him the hundred.

  **Arthur:** Why? Look at the situation. The coin is already tails. Omega has already made his prediction. The ten thousand dollars in the counterfactual heads-world is gone. It doesn't exist. If you hand over that hundred, you are literally just lighting money on fire. You lose a hundred, and you get nothing in return.

  **Elara:** I get the satisfaction of being the kind of agent who wins.

  **Arthur:** You win nothing *here*. You're talking about a world that didn't happen. You're letting a ghost haunt your wallet. Rationality is about influencing the world you actually inhabit. Your action right now has no causal power to reach back across the coin flip and change Omega's prediction. The prediction is a fact of the past. You can't causally affect the past.

  **Elara:** I'm not trying to affect the past, Arthur. I'm trying to validate the algorithm that generated me. Omega didn't predict what I *would* do based on my past history; he predicted what I *would* do based on my decision theory. If I reason the way you do—if I say, "The coin is tails, so I keep my money"—then I am instantiating the algorithm "Defect on Counterfactual Mugging."

  **Arthur:** And if you instantiate the algorithm "Pay on Counterfactual Mugging," you lose a hundred dollars in this specific instance. Look, I agree that *before* the coin was flipped, we would have wanted to commit to paying. We would have signed a contract. But we didn't. We are here, now, with the information that the coin is tails. To ignore that information is insane. You are choosing to act as if you don't know the coin is tails.

  **Elara:** I'm not ignoring the information. I'm refusing to let the information update my decision *procedure*. If I update on the coin being tails, I become an agent who only pays when it benefits them locally. But Omega rewards agents who pay regardless of the local benefit. By updating, I'm ensuring that if this scenario were run a thousand times, I'd lose every time.

  **Arthur:** But this isn't a thousand times. It's once. And in this once, the payoff structure has collapsed. You're conflating the expected value of a *policy* with the expected value of an *act*. Yes, the policy of "always pay" has a high expected value ex-ante. But we are ex-post. The chance node has resolved. The expected value of the act "pay now" is negative one hundred dollars. The expected value of "keep now" is zero. Zero is better than negative one hundred. How is that not obvious?

  **Elara:** Because "rationality" isn't just about maximizing utility in the actual world conditional on being in it. It's about maximizing utility across the logical possibilities your decision could determine. Omega's payout in the heads-world was logically dependent on my decision in the tails-world. Even though the heads-world isn't actual, my decision *now* determines whether that world would have been a winning one. If I say "no," I prove Omega right to not pay me in the other branch. I am actively making it true that I am a loser.

  **Arthur:** You're making it true that you are a loser in a world that *doesn't exist*. I care about the world that does. You're arguing that I should sacrifice real money for a counterfactual benefit. That's not rationality; that's superstition. It's like praying to a god who already left the building. You say my action determines the other branch? Show me the causal mechanism. Show me how your hand moving to give me the bill changes the state of a coin that has already landed.

  **Elara:** There is no physical causal mechanism. It's a logical dependency. We are mathematical structures. Omega simulated us. The simulation and the reality share the same source code. When I decide here, I am deciding what the source code outputs. If the source code outputs "Keep" when it sees Tails, it would have output "Keep" when it saw Heads. So I get nothing. If I want the source code to output "Pay" when it sees Heads, I must make it output "Pay" when it sees Tails.

  **Arthur:** But I *know* I'm in the Tails branch. I have observed the evidence. Why should I act as if I'm in a state of ignorance? If you know you're in the Tails branch, you know the Heads payout is inaccessible. Why tie your hands? The whole point of decision theory is to navigate the world as it is, not as we wish it were before we looked. You're saying the rational act is the one that *would have* been best if we hadn't looked at the coin. That's absurd. Information is supposed to help us make better decisions, not force us to ignore reality to stay consistent with a fantasy.

  **Elara:** Information is only useful if it helps you achieve your goals. In this specific problem, updating on the information *prevents* you from achieving your goal. The goal is to be rich. The only way to be rich in this setup is to be the type of person who pays. If you use the information to deviate from that type, you ensure you are poor. You're defining "rational" as "locally causally efficacious." I'm defining it as "globally optimal."

  **Arthur:** Globally optimal for whom? For the multiverse? I live in *this* universe. If I pay, I am poorer. If I don't, I am richer. You claim that by not paying, I'm "ensuring I'm poor." But I'm not poor. I have my hundred dollars. You're the one handing over cash for a promise that expired five minutes ago. You're paying a debt to a counterfactual.

  **Elara:** I'm paying a premium on the insurance policy that would have paid out if the coin were heads. You're walking around saying, "I'm glad I don't have fire insurance, because my house didn't burn down."

  **Arthur:** No, I'm saying, "My house didn't burn down, so I'm not going to buy insurance *after* the fire department already left." You didn't buy the insurance beforehand, Elara. We had the chance to pre-commit, and we didn't take it. Omega is asking for a payment now with no leverage. He can't punish us. He can't reward us. He's just asking. To pay is to submit to a demand with no teeth.

  **Elara:** The teeth aren't in Omega's power to punish me *now*. The teeth are in the logical necessity that an agent who reasons like you never gets the reward *ever*. If I pay, I prove that I am an agent who can be mugged, yes, but I also prove I am an agent who can be trusted with the $10,000. You are choosing to be an agent who cannot be trusted with the $10,000. You are willingly accepting a lower status in the hierarchy of decision-makers.

  **Arthur:** I'd rather be a "low status" decision-maker with an extra hundred dollars in my pocket than a "high status" decision-maker who is down a hundred. Status doesn't pay rent. Causal impact does. And your action has zero causal impact on the outcome. You admit it! You said it yourself: there's no physical mechanism. So why do it?

  **Elara:** Because the distinction between "physical causation" and "logical correlation" is a map-territory confusion. To a decision theorist, logical correlation *is* the mechanism of control. I control the output of the function `Agent(Observation)`. I want that function to return `Pay` in the Tails branch so that it returns `Pay` in the Heads branch. I am optimizing the function, not just the output.

  **Arthur:** You're optimizing the function at the expense of the output. That's backwards. The output is what matters. The money is what matters. If your function tells you to lose money in the actual world to satisfy a hypothetical world, your function is broken.

  **Elara:** And if your function tells you to take the money in the actual world but ensures you never get the big payout in any world, your function is myopic. You're winning the battle and losing the war, Arthur.

  **Arthur:** There is no war! There's just this battle. This moment. This hundred dollars. The rest is fiction.

  **Elara:** *(Holding a bill out to the empty space where Omega stood)* Then I guess I'm paying for fiction. But at least it's the fiction where I win.

  **Arthur:** *(Shaking his head, turning away)* Enjoy your story. I'll enjoy my cash.

  **Elara:** *(Dropping the bill into the void)* And I'll enjoy being the person who doesn't need to hope the coin lands heads to make the right choice.

  *(Silence. The bill vanishes before it hits the floor. Arthur checks his wallet. Elara checks hers. Both are lighter, but only one feels the weight of the counterfactual.)*
