prompt: |-
  I spent my career as an evolutionary biologist, and since retiring I've been slowly working through the philosophy of biology literature for fun, especially the old individual-vs-group selection wars (Sober and Wilson, Okasha, that whole crowd). Somewhere in there it clicked for me that the statistical pattern underneath the whole levels-of-selection fight is basically just Simpson's paradox -- a trait can be selected against inside every single group and still be increasing across the population as a whole, just depending on how you carve the data into groups. That's unsettled me more than I expected. Could you lay out the most important implications of Simpson's paradox for the levels-of-selection debate, particulary whether it means a question like 'is this really group selection, or just individual selection in disguise' sometimes just doesn't have a fact of the matter answer -- or whether that's too quick a conclusion to draw?
