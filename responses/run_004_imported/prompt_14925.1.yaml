      *   Disjunctivism's main selling point is explaining how we can have Direct Realism *despite* hallucinations. It bites the bullet that the hallucination is a different state.
      *   Intentionalism's main selling point is explaining the *commonality* of experience.
      *   *For a novelist:* If the goal is to validate the character's internal experience (it *feels* real, so in the narrative logic, it *is* a perceptual event), Intentionalism supports the "seamlessness" better. However, Disjunctivism offers a more poignant thematic angle: the tragedy that the connection is *broken* even if it feels intact.
      *   *But the prompt asks for the "more defensible account" of the indistinguishability.*
      *   Disjunctivism struggles with indistinguishability (Martin's "negative epistemic definition"). It says the hallucination is defined by being indistinguishable from a veridical perception, which is a bit circular for a narrative description.
      *   Intentionalism says the indistinguishability exists because the underlying mechanism (representation) is the same. This is scientifically and philosophically more robust for explaining *why* it feels seamless.
