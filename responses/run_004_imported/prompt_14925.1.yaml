      *   **Caveat/Nuance:** Mention that Disjunctivism offers a tragic metaphysical truth (the mother is *really* gone), which might be thematically useful, even if Intentionalism fits the mechanics better.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   Make sure not to misrepresent Disjunctivism. Disjunctivists don't say the hallucination feels *different*. They say the *nature* of the state is different.
      *   Make sure to highlight that Intentionalism avoids sense-data by saying we are aware of the world *through* content, not aware *of* the content.
