answer: |-
  My manager asked why I was staring at a simple `for-loop` for twenty minutes after grinding 500 LeetCode problems to get hired.

  "Did you forget the syntax?" he asked.

  "No," I said. "I remember the patterns perfectly."

  "Then why are you stuck?"

  "Whitehead," I said. "He said inert ideas aren't just unused; they're corrosive to the capacity for thought."

  He looked confused. "So you're saying you're burned out?"

  "No," I said. "Burnout is exhaustion. This is chemistry. The algorithms didn't just sit there unused; they actively dissolved the machinery required to see a problem that doesn't fit a pattern."
