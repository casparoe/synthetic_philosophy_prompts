prompt: |-
  I'm about two-thirds through a hard science-fiction novel set some four centuries from now, after a stable and broadly benevolent superintelligence has assumed custodianship of human affairs and established, through its cosmological modeling, that the reachable universe is almost certainly a small region within a far larger — quite possibly infinite — structure, meaning there exist other civilizations and other decision-making agents with whom Earth's descendants will never have any causal contact whatsoever. A recurring institution in the book is the Concordance Directorate, a standing advisory body charged with reasoning about the civilization's obligations toward those permanently unreachable others. In the chapter I'm drafting now, the Directorate must rule on a proposed Common Charter: a costly, binding commitment to set aside a fixed share of the civilization's resources for the presumed interests of agents elsewhere, and to accept certain constraints on its own conduct, including in its treatment of minds it simulates, on the strength of evidential cooperation in large worlds — the idea that because one's own decision procedure is correlated with the decision procedures of relevantly similar agents elsewhere, choosing to cooperate is itself evidence that those other agents cooperate too, even though nothing causal ever passes between them. One faction on the Directorate treats the Charter as simply the rational response to living in a world this large; another regards the whole argument as an elegant means of extracting real, immediate sacrifices in exchange for a benefit that can never, even in principle, be confirmed or reciprocated.

  Could you draft the memo the Directorate's chair circulates ahead of the vote — the actual in-story document my characters will be arguing over? I need it to commit to something specific (adopt the Charter as proposed, reject it outright, or adopt some scaled-back version, with whatever conditions or a sunset-and-review clause seem warranted), and to defend that recommendation using the genuine decision-theoretic substance of the idea rather than vague appeals to cosmic neighborliness. Please give the skeptical faction's position its full due — the objection about unverifiability and one-sided sacrifice is, I think, the strongest card they hold, and I don't want it dispatched in a sentence before the memo moves on. It needn't run long; a page or two, in the dry, faintly bureaucratic register of an internal policy memo, is exactly the texture I'm after. I would much rather the reasoning be genuinely sound than merely sound impressive, since some of this book's readers will know the underlying decision theory, and I don't want the seams to show.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Context:** Hard SF novel, ~400 years in the future. Benevolent Superintelligence (SI) custodianship. Universe is likely infinite/part of a larger structure. Many unreachable civilizations exist (no causal contact).
      *   **Institution:** Concordance Directorate (advisory body reasoning about obligations to unreachable others).
      *   **Task:** Draft a memo from the Directorate Chair ahead of a vote on the "Common Charter."
      *   **The Charter:** Costly, binding commitment to set aside resources/constraints for the sake of unreachable agents, based on *Evidential Cooperation in Large Worlds* (ECL).
      *   **The Conflict:** Proponents (rational response to large worlds) vs. Skeptics (unverifiable, one-sided sacrifice, "Pascal's Mugging" adjacent).
      *   **Requirements:**
          *   Commit to a specific recommendation (Adopt, Reject, or Scaled-back).
          *   Use genuine decision-theoretic reasoning (ECL/EDT/TDT logic), not vague morality.
          *   Give the skeptical position full due (strongest card).
          *   Tone: Dry, faintly bureaucratic, internal policy memo.
          *   Length: 1-2 pages.
          *   Audience: Characters in the book (and savvy SF readers).

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt):* Bold, but might feel too idealistic for a "hard" SF bureaucracy dealing with skepticism.
      *   *Option B (Reject):* Cynical, undermines the theme of the novel (benevolent SI, reasoning about ethics).
      *   *Option C (Scaled-back/Conditional):* This allows for nuance. It acknowledges the theory while mitigating the risk of the skeptics. It creates tension for the vote (is it enough?).
      *   *Decision:* I'll go with a **Scaled-back/Probationary Adoption**. This reflects the "dry bureaucracy" tone—cautious optimization rather than ideological zeal. It allows the Chair to acknowledge the skeptics' validity while arguing for a non-zero allocation based on expected value.

  3.  **Deconstruct the Decision Theory (ECL):**
      *   *Core Concept:* In an infinite/large universe, there are agents identical or similar to me. My decision algorithm is correlated with theirs. If I cooperate, they (statistically) cooperate.
      *   *The Gain:* If many agents cooperate, the total utility gain across the multiverse is massive, outweighing the local cost.
      *   *The Skeptic's Objection:* Causal isolation. I pay *here*, but do *they* actually pay *there*? I can never check. It looks like a donation to a black hole. Is the correlation strong enough to justify the cost? What if I'm wrong about the model?
      *   *Key Terminology:* Acausal trade, evidential decision theory (EDT), logical correlation, causal isolation, expected utility, Pascal's Mugging.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format. To, From, Date, Subject.
      *   **Opening:** State the purpose. The vote on the Common Charter.
      *   **The Recommendation:** Probationary adoption with a cap (e.g., 0.5% of compute/resources) and a review clause.
      *   **The Rationale (Pro-ECL):** Explain *why* it's rational. Not "it's nice," but "it maximizes expected value." Use the logic of correlation. If we defect, similar agents defect.
      *   **The Skeptic's Case (The "Strong Card"):** Dedicate a substantial paragraph to this. The "Causal Nullity" argument. The risk of asymmetric sacrifice. The inability to update on evidence.
      *   **Rebuttal/Mitigation:** Why the recommendation stands despite the skepticism. The asymmetry of impact (small cost here, huge potential gain there). The "Pascal's Wager" aspect but grounded in cosmological models, not theology.
      *   **Specific Provisions:** Mention the resource cap and the simulation constraints (treatment of simulated minds).
      *   **Closing:** Call to vote.

  5.  **Refining the Tone:**
      *   Needs to sound like a bureaucrat who is also a decision theorist.
      *   Avoid emotional language ("hope," "faith," "kindness").
      *   Use terms like "expected utility," "causal isolation," "algorithmic correlation," "downside risk."
      *   The Superintelligence (let's call it "The Custodian" or just refer to the system) should be in the background, facilitating but not dictating. The Directorate makes the *value* judgment.

  6.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is the decision theory accurate? ECL relies on the idea that your decision *is* evidence of theirs. If the universe is large enough, the number of copies is high.
      *   *Correction:* Ensure I don't imply *causal* influence. It must be *evidential* correlation.
      *   *Skepticism:* Make sure the skeptics aren't painted as fools. They are risk-averse regarding unverifiable claims.

  7.  **Drafting - Writing the Content (incorporating the "Dry" style):**
      *   *Subject:* Recommendation on Common Charter Proposal 88-Delta.
      *   *Voice:* Detached, precise.
      *   *Key argument:* Even if the probability of correlation is low, the magnitude of the stake (infinite/vast universe) makes the expected value positive.
      *   *Skeptic counter:* But if the model is wrong, we lose resources for nothing.
      *   *Compromise:* Cap the loss. Limit the downside.

  8.  **Final Polish:**
      *   Check word count.
      *   Ensure the "simulation" aspect mentioned in the prompt is included (constraints on treatment of simulated minds).
      *   Verify the "sunset-and-review" clause is present.

  **(Self-Correction during drafting):** I initially thought about having the Chair recommend rejection. But that kills the drama of the vote. A recommendation for *limited* adoption forces the "True Believers" to decide if half-measures are enough, and the "Skeptics" to decide if the risk is too high even at low levels. It's more interesting. I will recommend a **Capped Probationary Adoption**.

  Let's refine the decision theory language. The prompt mentions "Evidential Cooperation in Large Worlds." I need to make sure I don't confuse it with Causal Decision Theory (CDT). CDT says "My action doesn't change their action." ECL/EDT says "My action is correlated with theirs." The memo must reflect this distinction.

  Okay, let's write it.

  *Header:*
  CONCORDANCE DIRECTORATE
  INTERNAL MEMORANDUM
  TO: Directorate Voting Members
  FROM: Chair Elara Vance
  SUBJECT: Recommendation on Common Charter Proposal 88-Delta (ECL Commitments)

  *Body:*
  Start with the recommendation.
  Move to the theoretical basis (Large World Hypothesis).
  Address the Skeptic's "Causal Nullity" objection seriously.
  Explain the Expected Value calculation.
  Detail the constraints (Simulation ethics, resource cap).
  End with the review clause.

  *Key phrase to include:* "Acausal trade," "Algorithmic correlation," "Causal isolation."

  *Let's ensure the skepticism is strong:* "Paying into a void." "Unfalsifiable."

  *Let's ensure the defense is sound:* "Asymmetric leverage." "Low cost, high ceiling."

  *Final check on tone:* No exclamation points. Passive voice where appropriate for bureaucracy. Precise numbers (0.5%, 50 years).

  (Proceed to generate output based on these thoughts.)
answer: |-
  **CONCORDANCE DIRECTORATE**
  **INTERNAL MEMORANDUM 94-C**

  **TO:** Directorate Voting Members
  **FROM:** Chair Elara Vance
  **DATE:** 24.05.418
  **SUBJECT:** Recommendation on Common Charter Proposal 88-Delta (ECL Commitments)

  **1. Executive Summary**

  This memo circulates the Chair's recommendation regarding the proposed Common Charter (88-Delta), which commits the Sol System Civilization to a standing allocation of resources and behavioral constraints predicated on Evidential Cooperation in Large Worlds (ECL).

  After reviewing the Custodian's cosmological models and the submitted impact assessments, the Chair recommends **Probationary Adoption** of the Charter. This adoption is subject to a hard cap of 0.5% of total available compute-energy and a sunset clause triggering mandatory review in 50 standard years. We further recommend the immediate inclusion of Clause 12-B, regarding the moral status of simulated substrates, as a non-negotiable condition of participation.

  **2. Theoretical Basis and Expected Value**

  The rationale for the Charter rests on the Large World Hypothesis: that our causal light-cone is a negligible subset of a macro-structure containing vast numbers of agent-civilizations. While causal interaction is impossible, decision-theoretic models suggest our decision algorithms are logically correlated with those of sufficiently similar agents elsewhere.

  Under Evidential Decision Theory (EDT), our choice to cooperate serves as evidence that similar agents elsewhere will also cooperate. If the number of such agents is sufficiently high, the aggregate utility gain across the macro-structure outweighs the local cost of resource diversion, even if the probability of correlation is modest. We are not paying for a service; we are voting for a policy we wish were universal, with the statistical expectation that our vote counts toward the universal tally.

  **3. The Skeptical Objection (Causal Nullity)**

  The Minority Report submitted by Director Kaelen raises the objection of Causal Nullity, and the Chair finds this argument robust enough to warrant the probationary caps outlined above.

  The objection is as follows: Because no signal can ever traverse the gap between us and the "partners" in this agreement, we can never verify if they exist, if they are running the same decision procedure, or if they are honoring the Charter. We incur a definite, immediate opportunity cost (0.5% of civilization growth potential) in exchange for a benefit that is, in principle, unobservable.

  Director Kaelen argues this creates a vulnerability to "acausal mugging": if we accept unverifiable correlations as binding, we open the door to infinite hypothetical obligations that could drain resources for zero return. If the cosmological model is incorrect, or if the correlation strength is overestimated, the Charter becomes a unilateral sacrifice to a void. There is no feedback loop to correct our error. We cannot learn if we are being exploited, because the exploiters are causally sealed away from us.

  **4. Rebuttal and Risk Mitigation**

  While the Causal Nullity objection is valid regarding *verification*, it does not negate the *expected value* calculation.

  1.  **Asymmetric Leverage:** The cost to us is linear and capped. The potential benefit is multiplicative across the macro-structure. Even with a low confidence interval on the correlation strength, the magnitude of the "Large World" renders the expected utility positive. To defect is to assert with near-certainty that we are unique, a claim the Custodian's models assign a probability of <10^-9.
  2.  **Algorithmic Consistency:** We are not asking for trust; we are relying on logical necessity. If we are the type of agent that defects on ECL, then similar agents are the type of agent that defect. We do not need to observe them to know that our decision *is* their decision, functionally speaking. To withhold cooperation is to guarantee the non-existence of cooperation in our reference class.
  3.  **Mitigation:** The 0.5% cap ensures that even if the Minority is correct and the return is zero, the Sol Civilization suffers no existential stagnation. The downside is bounded; the upside is unbounded.

  **5. Specific Provisions**

  *   **Resource Allocation:** 0.5% of annual surplus compute-energy directed toward "Generic Optimization" tasks (mathematical, ethical, and physical research) assumed to be non-rivalrous and beneficial to any technological civilization, rather than Sol-specific engineering.
  *   **Simulation Constraints:** Under Clause 12-B, any minds simulated within our system must be afforded rights consistent with the Charter's baseline. We cannot demand cooperation from external agents while violating the substrate rights of internal agents. This is a consistency check on our own decision procedure.
  *   **Sunset Clause:** This authorization expires in 50 years. It may only be renewed if the Custodian's updated cosmological models maintain the Large World probability above 99.9%.

  **6. Conclusion**

  We cannot confirm the reciprocity of the Charter. We can only confirm our own integrity as decision-makers. To reject the Charter is to prioritize causal certainty over expected value, effectively betting the potential welfare of the macro-structure against a modest local efficiency gain.

  The Chair urges a vote for Probationary Adoption. We pay the premium not because we know the insurance will pay out, but because we cannot afford to be the kind of civilization that refuses to buy it.

  **Vote scheduled:** 24.05.420, 0900 Hours.
  **Materials:** Full Minority Report attached as Annex B.

  *Elara Vance*
  Chair, Concordance Directorate
