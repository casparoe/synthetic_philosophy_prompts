answer: |-
  This is an excellent objection. You have independently reconstructed one of the most persistent and sophisticated challenges to Ruth Chang's theory, often referred to in the literature as the **Continuum Objection** or the **Sorites Objection to Parity**.

  You are not missing a standard response; rather, you have hit upon the exact pressure point that Chang and her critics have debated for two decades. Below is a blunt assessment of your reconstruction, the standard literature response, and a verdict on whether your objection succeeds.

  ### 1. Assessment of Your Reconstruction
  **Is the argument valid?**
  Yes. As a *reductio ad absurdum*, your reconstruction is logically valid.
  1.  **Premise 1 (Tolerance):** If $A$ is on a par with $B$, and $A+$ is a marginal improvement of $A$, then $A+$ is on a par with $B$ (derived from the Small Improvement Argument).
  2.  **Premise 2 (Iteration):** If the relation holds for $A$, it holds for $A+$, $A++$, etc. (The Sorites Principle).
  3.  **Premise 3 (Endpoint):** At some point $A*$, $A*$ is clearly better than $B$.
  4.  **Conclusion:** Contradiction. Parity cannot exist as described, or it must have a sharp cutoff (which implies vagueness or arbitrariness).

  **Is it sound?**
  This is where the philosophical battle lies. The argument is sound *only if* Premise 2 holds. Chang explicitly denies Premise 2. Therefore, while your logic is valid, Chang would reject the soundness of the argument by rejecting the transitivity/tolerance of the parity relation.

  ### 2. The Standard Response in the Literature
  Your friend's reply (that Chang can accept fuzzy boundaries) is a common defensive move, but it is actually the *weaker* version of Chang's defense. It concedes too much to the vagueness theorist.

  Chang's stronger, standard response relies on the **non-transitivity of parity**.

  **The Non-Transitivity Defense**
  Chang argues that "on a par" is not a transitive relation.
  *   If $A$ is on a par with $B$, and $B$ is on a par with $C$, it does *not* follow that $A$ is on a par with $C$.
  *   Applied to your chain: Just because $A$ is on a par with $B$, and $A+$ is on a par with $B$, it does not logically guarantee that $A++$ is on a par with $B$ simply by virtue of its relation to $A+$.

  Chang argues that value is "clumpy." Small improvements do not necessarily accumulate linearly to change the value relation until a certain threshold of "clumps" is crossed. The Small Improvement Argument shows that *one* small improvement doesn't flip the relation from Parity to Better. It does *not* imply that *infinite* small improvements won't.

  By denying transitivity, Chang blocks the Sorites chain. She can say: "Parity holds between $A$ and $B$. It also holds between $A+$ and $B$. But eventually, at $A_n$, the relation flips to 'Better Than.' There is no sharp cutoff in the *nature* of the relation, but there is a point where the reasons supporting parity are outweighed by the reasons supporting 'better than.'"

  **The "Vagueness" Distinction**
  Your worry is that admitting fuzzy boundaries collapses parity into the vagueness view Chang rejects. Chang distinguishes them this way:
  *   **The Vagueness View (e.g., Broome):** Hard choices are hard because the concepts are semantically indeterminate. The options are *incomparable*. We literally cannot compare them.
  *   **The Parity View:** Hard choices are hard because the options are *comparable* via a fourth relation. The boundaries of where parity ends and "better than" begins might be hard to locate (epistemic fuzziness), but the relation itself is ontologically distinct from vagueness.

  So, your friend is right that she can accept fuzzy boundaries, but the crucial point is that **fuzzy boundaries of a comparable relation $\neq$ incomparability due to vagueness.**

  ### 3. Does the Objection Damage the Small Improvement Argument?
  **Blunt Verdict:** No, it does not damage the Small Improvement Argument (SIA) itself, but it does force a specific metaphysical commitment that some find costly.

  **Why it doesn't kill the SIA:**
  The SIA is designed to show that $A$ and $B$ are not *equal*. It does this by showing $A+$ is not better than $B$. Your objection asks: "Okay, but where does it stop?"
  Chang can reply: "The SIA only needs to prove that $A$ and $B$ are not equal. It doesn't need to map the entire topography of value from $A$ to $A*$." The SIA establishes the *existence* of parity in the local case. Your Sorites objection challenges the *global coherence* of parity across a continuum. These are separate battles.

  **The Cost (Where you might have a point):**
  While the objection doesn't refute parity, it does expose a cost of the theory. To save parity from the Sorites paradox, Chang must embrace **non-transitivity**.
  Many philosophers find non-transitive value relations deeply counterintuitive. If $A$ is on a par with $B$, and $B$ is on a par with $C$, why can't I choose $C$ over $A$ based on that chain? If parity is non-transitive, it makes rational choice over time difficult (dynamic inconsistency).
  If you find non-transitive value relations unacceptable, then your Sorites objection *does* succeed in showing that Parity is too costly to accept. But that is a disagreement about the metaphysics of value, not a logical refutation of the SIA.

  ### 4. Summary for Your Argument with Your Friend
  You can upgrade your position with the following points:

  1.  **Acknowledge Validity:** Tell your friend, "I know this is the standard Sorites/Continuum objection. I know Chang denies transitivity."
  2.  **Press the Non-Transitivity Cost:** "Chang saves parity from my objection by making it non-transitive. But is a non-transitive value relation coherent? If I can choose the Lawyer career over the Clarinet career (Parity), and a Slightly Better Lawyer career over the Lawyer career (Parity), why does the chain break before I get to the Super Lawyer? If the relation is truly *sui generis*, why does it behave so erratically regarding improvements?"
  3.  **Refine the Vagueness Worry:** "My worry isn't just that the boundaries are fuzzy. It's that if the transition from Parity to Better Than has no principled location (because small improvements don't accumulate), then the distinction between 'Parity' and 'Vague Equality' becomes merely verbal. If we can't say *why* $A_{100}$ is on a par but $A_{101}$ is better, aren't we just describing a vague range?"

  ### Final Conclusion
  You reconstructed a valid, standard, and serious objection. You are not missing a "gotcha" response from the literature. The literature response is essentially: **"Parity is non-transitive, so the Sorites chain doesn't slide."**

  Whether that response is satisfying is up to you. If you think value relations *must* be transitive to be rational, your objection stands as a decisive critique. If you are willing to accept non-transitive value relations, Chang's framework holds. Your friend's appeal to "fuzzy boundaries" is a permissible defense, but the heavier lifting is done by the denial of transitivity.

  **Winning Move:** Concede that the SIA proves $A \neq B$, but maintain that the Sorites objection shows Parity is an unstable relation that collapses into vagueness unless one accepts non-transitive value, which is a high metaphysical price to pay. That is a philosophically respectable position to hold.
