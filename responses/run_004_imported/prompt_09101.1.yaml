answer: |-
  **Subject:** Re: Unified Semantics for Conditionals (Response Paper Draft)

  Here is a draft argument for your response paper. It tackles the Adams/Stalnaker-Lewis split head-on, using the Kratzer/Iatridou framework to argue for a unified restrictor semantics while taking the Oswald/Kennedy data seriously.

  ***

  ### Title: One 'If' to Rule Them Both: A Unified Restrictor Account Against the Adams Split

  **1. The Adams Challenge: Why the Split Seemed Necessary**
  To argue for a unified semantics, we first have to concede why Ernest Adams's Oswald/Kennedy pair is so devastating to a naive unified theory. The data is as follows:

  1.  **Indicative:** "If Oswald didn't kill Kennedy, someone else did." (Intuitively **True**)
  2.  **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have." (Intuitively **False**)

  Adams argued that since the antecedent ($O$) and consequent ($S$) are effectively the same, but the truth/assertability values diverge, the connective 'if' must be operating differently. For indicatives, Adams proposed we look at **conditional probability** ($P(S|O)$). Given we know Kennedy was killed, if we condition on Oswald not doing it, the probability that someone else did is near 1.

  For counterfactuals, Adams (and later Stalnaker and Lewis) argued we need **similarity semantics**. We look at the nearest possible world where Oswald didn't kill Kennedy. In that world, given the historical facts (no active conspiracy), Kennedy likely lives. Thus, $S$ is false.

  Adams concluded that indicatives are about **epistemic dependence** (updating on information), while counterfactuals are about **metaphysical/causal dependence** (changing the world). This suggests two distinct logics: one probabilistic, one possible-worlds.

  **2. The Unified Proposal: 'If' as a Restrictor**
  The strongest case against this split comes from Angelika Kratzer's modal semantics, augmented by Sabine Iatridou's work on tense. The core thesis is: **'If' does not have a meaning on its own.** It is a syntactic restrictor on a covert modal operator.

  On this view, the logical form of both conditionals is roughly: **MODAL [If A] [C]**.

  The divergence in the Oswald/Kennedy pair does not come from the word 'if', but from the features of the covert **MODAL** and the **Modal Base** it operates over. This allows us to keep the semantics of 'if' unified (it always restricts a modal) while explaining the truth-value divergence via independently motivated parameters: **Modal Base** and **Tense**.

  **3. Solving Oswald/Kennedy without a Split**
  How does a unified restrictor account handle the divergence? We must look at what is held fixed in the modal base.

  *   **The Indicative (Epistemic Modal Base):**
      Indicatives typically pair with an *epistemic* modal base (what is known in the actual world). In the context of the Kennedy assassination, it is a known fact that *Kennedy was killed*.
      *   *Mechanism:* The modal base includes the fact $K$ (Kennedy died). The 'if'-clause restricts the modal to worlds compatible with $\neg O$ (Oswald didn't do it).
      *   *Result:* Since $K$ is held fixed in the epistemic base, and $O$ is removed, the only worlds left in the intersection are those where $S$ (Someone else did it) is true.
      *   *Verdict:* True. This captures Adams's probability intuition without needing a probabilistic semantics. High probability arises because the consequent is entailed by the background knowledge held fixed.

  *   **The Counterfactual (Circumstantial Modal Base + "Fake Past"):**
      Counterfactuals pair with a *circumstantial* modal base (what is possible given the circumstances at a past time) and crucially involve **temporal distancing**. Iatridou argues that the past tense morphology in counterfactuals ("hadn't", "would") is often "fake past"—it doesn't indicate actual past time, but rather modal distancing.
      *   *Mechanism:* This distancing pushes the evaluation time back to *before* the causal chain was sealed. We are no longer holding fixed the *outcome* (Kennedy died); we are holding fixed the *causal laws and circumstances prior to the shot*.
      *   *Result:* We remove $O$ (Oswald's action). Because we have backed up to a time before the outcome was determined, we do not hold $K$ (Kennedy died) fixed. In the nearest worlds where $\neg O$ at $t_1$, the causal chain breaks, and $\neg K$ occurs at $t_2$. Thus, $S$ is false.
      *   *Verdict:* False.

  **4. Why This is Better than Adams's Split**
  Adams's split requires lexical ambiguity: 'if' means one thing in indicatives and another in counterfactuals. The unified restrictor view is more parsimonious. It treats the difference as **contextual**, not **lexical**.

  We independently need epistemic vs. circumstantial modal bases to explain modals like "must" and "might" (e.g., "He must be home" [epistemic] vs. "He must leave" [deontic/circumstantial]). We independently need "fake past" morphology to explain subjunctive mood across languages. By leveraging these existing tools, we explain the Oswald/Kennedy contrast without positing two different logics for 'if'.

  **5. Addressing Lewis's Triviality Results**
  You mentioned Lewis's triviality results. Lewis showed that if you treat conditionals as propositions with truth values, you cannot generally equate the probability of the conditional with the conditional probability ($P(A \to C) = P(C|A)$) without trivializing the logic. Adams used this to argue indicatives *lack* truth conditions.

  However, a unified semantics can accommodate this. If we adopt a Stalnaker-style truth-conditional semantics for *both* (where $A \to C$ is true if $C$ holds in the selected $A$-world), we can treat Adams's Thesis as a claim about **assertability**, not truth.

  In the unified restrictor framework, the "Adams intuition" (that indicatives track conditional probability) is a pragmatic effect. When the modal base is epistemic, the set of accessible worlds is restricted to what we know. In such contexts, the truth of the conditional often aligns with conditional probability. Lewis's result shows this alignment isn't perfect logically, but it is robust enough pragmatically to mislead us into thinking the *semantics* is probabilistic. We don't need to abandon truth-conditions for indicatives to save the data; we just need to recognize that assertability conditions track epistemic probability, even if truth conditions track world-selection.

  **6. Conclusion**
  The Oswald/Kennedy pair does not force a split in the logic of 'if'; it forces a distinction in the **modal environments** 'if' operates within. By treating 'if' as a unified restrictor on a modal operator, we can explain the truth-value divergence through shifts in modal base (epistemic vs. circumstantial) and temporal evaluation (actual vs. fake past). This preserves theoretical parsimony and integrates conditionals into the broader semantics of modality, rather than isolating them as a special case requiring two distinct logics.

  ***

  ### Key Points for Your Seminar Discussion:
  *   **Parsimony:** Emphasize that positing two meanings for 'if' is a last resort. If we can explain the data with context (modal bases), we should.
  *   **The "Fixed" Facts:** The crux of the Oswald/Kennedy solution is what facts are held fixed in the modal base. Indicatives hold the *outcome* fixed (JFK is dead); Counterfactuals hold the *preconditions* fixed (no conspiracy existed) but let the outcome vary.
  *   **Triviality:** Don't let Lewis scare you off truth conditions. Use the distinction between *semantics* (truth conditions) and *pragmatics* (assertability) to explain why Adams felt indicatives were probabilistic.

  This approach aligns you with the "Kratzerian consensus" in modern semantics, which is generally the dominant view against the older Adams/Stalnaker split. Good luck with the paper!
