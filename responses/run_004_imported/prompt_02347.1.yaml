          *   *Synthesis:* Kant would reject the *revision* of logic itself (logic is the form of thought, you can't change the form of thought), but he would agree with the *restriction on knowledge claims*. He would say: "You are right that we cannot assert P or not-P for the infinite *as an object of knowledge*, but wrong to say logic itself changes. Rather, the *application* of logic to the infinite is illegitimate." Brouwer turns an epistemic limitation into a logical rule; Kant would keep it an epistemic limitation.

