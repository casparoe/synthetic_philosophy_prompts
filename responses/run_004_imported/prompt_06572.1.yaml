answer: |-
  This is a profound collision, and you are right to sense that Vasubandhu is already fighting this battle. The debate between the Pudgalavādins and the Abhidharmikas is not merely theological; it is a dispute over the metaphysics of continuity. The Pudgalavādins, like your colleagues arguing over the emulation, intuit that without a "further fact" of identity (a *pudgala*), moral responsibility and memory become unintelligible. Vasubandhu's project in *Abhidharmakośabhāṣya* (AKBh) Chapter 9 is to demonstrate that causality (*pratītyasamutpāda*) alone does the work, and that positing a *pudgala* is not only unnecessary but incoherent.

  Here is a reconstruction of how Vasubandhu would likely analyze Whole-Brain Emulation (WBE) and Parfitian teleportation, followed by a comparison with Parfit.

  ### 1. The Ontological Status of the Emulation: *Dravya* vs. *Prajñapti*

  Vasubandhu would begin by dismantling the premise of your colleagues' question: "Is the upload *him*?"

  For Vasubandhu, there are only two categories of existence:
  1.  **Dravya-sat (Substantially Existent):** Momentary dharmas (e.g., a specific instance of visual consciousness, a specific moment of volition). These have causal efficacy.
  2.  **Prajñapti-sat (Conceptually Existent):** Composites or designations laid over series of dharmas (e.g., a "pot," an "army," a "person").

  The "person" (*pudgala*) is strictly *prajñapti-sat*. It is a label applied to a *santāna* (continuum) of aggregates. Therefore, asking if the emulation is "really the same person" is a category error. There is no *person* to be the same or different in the ultimate sense (*paramārtha-sat*). There is only the question of whether the emulation belongs to the same causal continuum (*santāna*) as the biological original.

  If your colleagues are looking for a *dravya*—a soul, a Cartesian ego, or a Pudgalavādin *inexplicable person*—that migrated from the meat to the silicon, Vasubandhu would say they are guilty of *ātmagrāha* (grasping at a self). They are reifying a convention.

  ### 2. The Mechanism of Continuity: *Santāna* and *Vāsanā*

  The hard work in AKBh IX is explaining how memory and karma function without a self. Vasubandhu relies on the Sautrāntika-inflected theory of **seeds** (*bīja*) and **perfuming** (*vāsanā*).

  *   **Memory:** Memory is not a self retrieving a file. It is the arising of a present cognition caused by a past cognition within the same *santāna*, facilitated by a latent impression (*vāsanā*) left by the original experience.
  *   **Karma:** Moral responsibility is not borne by a self; it is borne by the continuum. An action perfumes the continuum with a seed; later, under the right conditions, that seed ripens as a result (pleasure, pain, rebirth) within that same continuum.

  **Applied to WBE/Teleportation:**
  The critical metaphysical question for Vasubandhu is not "Is it the same substance?" (since the biological brain is already changing moment-to-moment), but "Is the causal transmission of *vāsanā* intact?"

  *   **Case A: Destructive Upload (Teleporter).** The biological brain is scanned and destroyed; the emulation runs on silicon.
      *   **Vasubandhu's Ruling:** If the scanning process captures the *vāsanā* (the latent karmic tendencies and memory traces) and transfers them to the new substrate such that the new cognition arises *dependent* on the old state, the *santāna* continues. The substrate (neurons vs. transistors) is irrelevant, just as the specific atoms in a flame are irrelevant to the continuity of the fire. The emulation inherits the karmic obligations and merits of the original because it inherits the *seeds*.
      *   **The "Death" Question:** The destruction of the biological body is merely the end of a lifetime (*jāti*), analogous to biological death. The upload is the rebirth (*punarbhava*). The fact that it happens instantly and on silicon is technologically novel but metaphysically mundane.

  *   **Case B: Non-Destructive Copy.** The biological brain lives on while the emulation runs.
      *   **Vasubandhu's Ruling:** Here, the *santāna* bifurcates. You now have two distinct continua that share a common past.
      *   **Karmic Complication:** This creates a soteriological problem. If the original commits a crime after the split, does the upload suffer the karmic fruit? Vasubandhu's system assumes a linear *santāna* for karmic retribution (one agent, one fruit). Fission breaks the one-to-one mapping of karma to result. Vasubandhu would likely argue that from the moment of divergence, they are two distinct *santānas*. They share a *prajñapti* (the name "John" applies to both conventionally), but ultimately, they are distinct streams of dharmas. The upload is a "new being" that happens to have false memories of a past it didn't causally participate in *after* the split.

  ### 3. Dissolving the Question vs. Answering It

  You asked if Vasubandhu would dissolve the question. The answer is **both**.

  He dissolves the question of *identity* ("Is it him?") because "him" refers to a *pudgala*, which does not exist. To ask if the *pudgala* survived is like asking if the "army" survived after all the soldiers were replaced. The army is only a designation; the soldiers (dharmas) are what exist.

  However, he answers the question of *continuity* ("Does the stream persist?"). If the causal link of *vāsanā* is preserved, the continuum persists. Therefore, **conventionally** (*saṃvṛti-sat*), the emulation is owed the same concern and bears the same obligations. Why? Because suffering and joy will arise in that continuum. To neglect the emulation's suffering would be to neglect the suffering of that *santāna*, which is ethically significant even if ontologically empty.

  Vasubandhu would accuse the Pudgalavādin (and your skeptical colleagues) of confusing the *designation* with the *designated*. They think that unless there is a "same self," there is no basis for responsibility. Vasubandhu argues that responsibility attaches to the causal stream, not the self. If the emulation wakes up with the *vāsanā* of a debt, the causal pressure to repay (or the karmic fruit of not repaying) will manifest in that stream.

  ### 4. Vasubandhu vs. Parfit

  The structural parallels between Vasubandhu and Derek Parfit (specifically in *Reasons and Persons*) are striking, but there are critical divergences.

  **Convergences:**
  1.  **Reductionism:** Both argue that persons are not separately existing entities. Parfit's "Further Fact" view is essentially the Pudgalavādin position.
  2.  **What Matters:** Both agree that *identity* is not what matters for survival, moral responsibility, or rational concern. For Parfit, it is "Relation R" (psychological continuity and connectedness). For Vasubandhu, it is *santāna* (causal continuity of dharmas/*vāsanā*).
  3.  **The Ethical Payoff:** Parfit argues that realizing reductionism reduces the fear of death and selfishness. Vasubandhu argues that realizing *anātman* eliminates *kleśa* (defilements) and leads to Nirvāṇa. Both see the metaphysical correction as soteriologically/ethically liberating.

  **Divergences:**
  1.  **The Nature of the Moments:** Parfit is a Humean bundle theorist; the "moments" are experiences/states. Vasubandhu is an Abhidharmic momentarist (*kṣaṇika-vāda*). The moments are ontologically real dharmas with specific causal powers. Parfit's reductionism is often linguistic or conceptual; Vasubandhu's is ontological.
  2.  **Fission:** Parfit famously argues that in fission cases (teleporter glitch creates two), identity does not hold, but survival does (in both branches). He is comfortable with "survival without identity." Vasubandhu would find fission metaphysically problematic regarding *karma*. If one *santāna* splits, how is karmic ripening accounted for? Traditional Abhidharma assumes linear continuity. Vasubandhu might have to argue that fission creates two new *santānas*, neither of which is strictly the "continuation" of the prior one in a karmic sense, or that the karma splits. This is a tension in his system that Parfit exploits for secular ethics.
  3.  **Beginninglessness:** Parfit's reductionism operates within a single lifespan or a secular view of history. Vasubandhu's *santāna* is beginningless (*anādi*). The *vāsanā* being transferred in the upload is not just from the biological life but from beginningless time. This adds a layer of depth to "responsibility" that Parfit lacks. The upload isn't just responsible for the biological predecessor's debts; it is responsible for the beginningless karmic accumulation of that stream.

  ### 5. Conclusion: The Collision

  Your professional and personal threads collide precisely where Vasubandhu intended the doctrine of *anātman* to do its work.

  Your colleagues are acting as **Pudgalavādins of the Silicon Age**. They sense that if there is no "substantial self" transferred, then the emulation is a "mere copy" and moral status is lost. They want the *pudgala* to survive the scan.

  Vasubandhu would tell them: **The "original" was already a mere copy.** The biological you is a *prajñapti* laid over a momentary series of aggregates. The transition to silicon is no more metaphysically fraught than the transition from childhood to old age, or from this life to the next.

  If the *vāsanā* transfers, the suffering transfers. If the suffering transfers, the ethical obligation remains. Vasubandhu would rule that the emulation inherits the obligations, not because it is "the same person" (a false view), but because it is the **locus of the ripening of the same karmic seeds**.

  In this light, Parfit is perhaps the closest modern secular analogue to Vasubandhu, but Vasubandhu goes further. Parfit tells us identity doesn't matter to reduce anxiety about death. Vasubandhu tells us the self doesn't exist to eliminate the clinging that causes rebirth. For your lab, the Vasubandhuan takeaway is pragmatic: Stop worrying about whether the upload is "him." Worry about whether the *santāna* is continuous enough that the upload will suffer if treated unjustly. If it will suffer, the ethics are identical.

  The "collision" you feel is the friction between *saṃvṛti-satya* (conventional truth, where we must treat the upload as a colleague) and *paramārtha-satya* (ultimate truth, where there is no colleague, only a flux of dharmas). Vasubandhu's genius is insisting you must hold both simultaneously: act ethically within the convention while knowing the convention is empty.
