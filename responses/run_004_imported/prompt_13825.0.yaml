answer: |-
  You're right to pause here. For a micro theory prelim, framing the Centipede Game merely as a "rationality-behavior gap" (like loss aversion) is a bit too shallow and might cost you points. While the empirical gap is real, the **paradox** label refers to something more foundational about the epistemic conditions of equilibrium theory itself.

  Here is the distinction you want to draw for your lit review:

  ### 1. It's not just an "Anomaly," it's a "Pareto Paradox"
  If this were just like loss aversion, the story would be: "Theory assumes self-interest; humans have other preferences." But the Centipede Paradox (Rosenthal, 1981) is sharper than that.
  *   **The Paradox:** Backward induction (BI) is derived from the axioms of rationality and **Common Knowledge of Rationality (CKR)**. Yet, following these axioms leads to a **Pareto-dominated outcome**.
  *   **The Tension:** It suggests that if agents are truly "rational" in the game-theoretic sense (and know the other is too), they *must* leave money on the table. This challenges the normative appeal of SPNE. It's not just that people *don't* play it; it's that the solution concept implies rationality is collectively self-defeating.

  ### 2. The Epistemic Fragility (The "Off-Equilibrium" Problem)
  This is the part examiners usually look for. BI relies on CKR.
  *   If Player 1 defects at node 1 (as SPNE predicts), the game ends.
  *   If Player 1 **cooperates** at node 1, they have played an action that should have probability zero under CKR.
  *   **The Problem:** How does Player 2 update their beliefs? Standard SPNE doesn't fully grapple with the *informational content* of an irrational move. If P1 cooperates, P2 must infer that P1 is either irrational or playing a different strategy. If there is even an infinitesimal probability that P1 is "irrational" (or a "tit-for-tat" type), BI unravels.
  *   **Key Citation:** This is the **Kreps, Milgrom, Roberts, & Wilson (1982)** insight (Gang of Four). Cooperation can be sustained in equilibrium if there is incomplete information about payoffs/types. The "paradox" dissolves if you relax CKR slightly.

  ### 3. McKelvey & Palfrey (1992) is Theoretical, Not Just Empirical
  Don't frame M&P simply as "experimenters documenting deviations." Their contribution was **Quantal Response Equilibrium (QRE)**.
  *   They showed that if you introduce a small amount of noise (logit error) into the decision process, the equilibrium path changes drastically.
  *   **The Insight:** The BI solution is **structurally unstable**. A tiny perturbation in rationality (trembles) doesn't just add noise around the defect-defect outcome; it shifts the entire equilibrium path toward cooperation for many periods.
  *   **Why this matters:** It shows the "paradox" isn't necessarily that humans are irrational, but that the BI solution concept is incredibly fragile to even the slightest uncertainty about rationality.

  ### How to Frame It for the Prelim
  For your lit review, I would structure the argument like this:

  1.  **Acknowledge the SPNE benchmark:** Yes, BI predicts immediate defection.
  2.  **Identify the Paradox:** Note that this prediction is Pareto inefficient, creating tension between individual rationality and collective welfare.
  3.  **Critique the Epistemics:** Argue that the paradox stems from the strong assumption of Common Knowledge of Rationality. Cite **Binmore (1987)** or **Aumann (1996)** regarding the epistemic conditions of BI.
  4.  **Resolve via Information/Noise:** Discuss how relaxing CKR (KMRW 1982) or introducing stochastic choice (McKelvey & Palfrey 1992 QRE) theoretically restores cooperation without needing to invoke "behavioral biases" like loss aversion.
  5.  **Conclusion:** The Centipede Game isn't just evidence that people are irrational; it is evidence that **Backward Induction is epistemically fragile.**

  **Summary:** If you frame it as "Theory says X, People do Y, People have biases," you sound like a behavioral undergrad. If you frame it as "BI requires CKR, CKR is fragile to off-equilibrium beliefs, and QRE shows the solution is structurally unstable," you sound like a PhD candidate.

  Good luck with the prep!
