      *   *6. Purity:* Is it mixed with pain?
          *   *Analysis:* ICSS often leads to physical degradation, starvation, exhaustion. The "come down" or the physical cost is high. In AI, it might lead to system instability or external termination.
          *   *Verdict:* Ordinary pleasures win. Wireheading is low purity.
      *   *7. Extent:* Who is affected?
          *   *Analysis:* The wireheaded subject is isolated. It produces nothing for others. A human/animal working for indirect rewards contributes to society/ecosystem.
