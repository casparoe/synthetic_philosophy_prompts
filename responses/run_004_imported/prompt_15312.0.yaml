  4.  **Synthesize the Verdict:**
      *   *Surface Level:* If you only look at Intensity, Duration, Certainty, and Propinquity, wireheading looks superior. This explains the friend's "shrug."
      *   *Deep Level:* Fecundity and Purity are the safety valves in Bentham's system. They account for the *long-term* structure of happiness. A pleasure that destroys the capacity for future pleasure is a bad pleasure *within the calculus*.
      *   *Extent:* Bentham's utilitarianism is social ("the greatest happiness of the greatest number"). A solitary wireheader contributes zero to the extent.

