      *   *3. Certainty:* The link between action (press) and sensation (stimulation) is direct and mechanical. Highly certain.
          *   *Verdict:* Wireheading wins.
      *   *4. Propinquity:* Immediate. No delay between action and reward.
          *   *Verdict:* Wireheading wins.
      *   *5. Fecundity:* This is the crux. Does this pleasure lead to *more* pleasures of the same kind?
          *   *Analysis:* In ICSS, the animal often neglects food/water, leading to death. The pleasure does not generate *future* pleasure; it consumes the capacity for it. In AI, it halts the intended function, potentially leading to shutdown or resource exhaustion.
