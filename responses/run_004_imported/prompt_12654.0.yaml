answer: |-
  You can breathe easy. Your instinct is not only defensible, it is the cornerstone of modern economic theory. Your friend has served you a classic dish known as the **St. Petersburg Paradox**, but he's leaving out the recipe for how it's actually resolved.

  You are not "bad at probability." You are correctly identifying that **Expected Value (EV)** is not the same thing as **Expected Utility (EU)**.

  Here is the breakdown you need to settle the dinner debate, plus some angles for your piece on risk and human intuition.

  ### 1. The Math: He's Right About the Infinity, Wrong About the Bet
  Your friend's calculation of the Expected Value is technically correct.
  *   50% chance of $1 (Tails first flip) → Contribution: $0.50
  *   25% chance of $2 (Heads, then Tails) → Contribution: $0.50
  *   12.5% chance of $4 (Heads, Heads, Tails) → Contribution: $0.50
  *   ...and so on.

  Since you add $0.50 an infinite number of times, the sum is infinity. Mathematically, the **Expected Value** is unbounded.

  However, decision theory hasn't treated "maximize Expected Value" as the gold standard since 1738. That's when Daniel Bernoulli (cousin of Nicolas, who posed the paradox) published a paper explaining why your $20 cap is rational.

  ### 2. The Resolution: Diminishing Marginal Utility
  Your objection ("an extra dollar doesn't mean as much to me once we're talking huge sums") is exactly the solution. In economics, this is **diminishing marginal utility**.

  The first $1,000 you earn keeps you from starving. The next $1,000 buys you comfort. The billionth dollar is just a number in a database. Because the *value* of money does not scale linearly with the *amount* of money, you cannot simply maximize the dollar amount. You must maximize the **utility** of that amount.

  If you apply a standard utility function (like the logarithm of wealth, which is the standard model for risk aversion), the infinite series **converges to a finite number.**
  *   If you use a logarithmic utility function, the "fair price" to play this game is usually calculated between **$2 and $25**, depending on your current net worth.
  *   Your friend claimed he "baked that in" and it was still unbounded. **He is mathematically incorrect on this point.** Unless he assumes you value the trillionth dollar exactly as much as the first dollar (linear utility), the expected *utility* is finite. If he insists it's unbounded even with utility factored in, he is likely using a utility function that grows too fast to be realistic (implying you would mortgage your house to buy a lottery ticket, which you don't).

  ### 3. The "Real World" Constraint: Finite Bankrolls
  There is a second, more practical reason your friend is wrong, which is great for your reporting on hedge funds vs. reality.

  The paradox assumes the "house" has infinite money. In the real world, your hedge fund friend has a finite bankroll.
  *   If he can only pay out $2^{30}$ (about $1 billion), the game caps at 30 flips.
  *   Once you cap the number of flips, the Expected Value crashes from "infinity" to roughly **$15 to $30**.

  Even if he represents a massive fund, no entity on earth can cover the payout for a streak of 100 heads. By ignoring the counterparty risk (the risk that he can't actually pay you if you win the big one), he is presenting a theoretical model that breaks in contact with reality.

  ### 4. Angles for Your Article
  Since you are writing about how people size up long-shot bets (lotteries, startups), this paradox is a perfect case study. Here are three takeaways you can use:

  **A. Humans Optimize for Survival, Not Averages**
  Expected Value works if you can play the game a million times (the Law of Large Numbers). If you play this coin flip game a million times, you will make a fortune. But in life, most big bets are **non-ergodic**. You only get one shot at a startup, or one retirement fund. If you bet everything on a positive-EV venture that has a 99% chance of going to zero, you go broke before the "average" catches up. Your instinct to cap the buy-in at $20 is an instinct for **survival**, not just profit.

  **B. The "Dream" Utility (Lottery Tickets)**
  You mentioned lottery tickets. They have negative Expected Value. By your friend's logic, buying a ticket is irrational. But people buy them because the utility of the *dream* of winning is higher than the utility of the $2 cost. Conversely, in the St. Petersburg game, the utility of the *risk* of losing your buy-in outweighs the abstract utility of the infinite tail. People aren't bad at math; they are good at weighting emotional and practical outcomes.

  **C. The Quant Blind Spot**
  This is a great character moment for your piece. Quants often model risk using distributions that assume infinite liquidity and repeatable trials. But ordinary people (and savvy investors) know that **ruin is permanent**. When your friend says you're "chickening out," he's ignoring the concept of **risk of ruin**. In startup investing, you don't put 100% of your capital into one seed-stage company, even if the theoretical upside is massive. You diversify. Your friend is asking you to make a concentrated bet on a fat-tail distribution without the portfolio to back it up.

  ### The Verdict
  Tell your friend this:
  > "You're describing the St. Petersburg Paradox. Daniel Bernoulli solved it in 1738 using logarithmic utility, which makes the value finite. Plus, in the real world, your bankroll is capped, which truncates the tail. My $20 offer is the rational market price given your actual liquidity and my risk aversion. If you think I'm irrational for not betting my house on a theoretical infinity, you're confusing a textbook model with a dinner party."

  Your instinct is principled, economically sound, and historically validated. He's just hiding behind an asymptote.
