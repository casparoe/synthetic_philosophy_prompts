      *   It was introduced by Nicolas Bernoulli (1713) and solved by Daniel Bernoulli (1738).
      *   The mathematical EV is indeed infinite: $\sum (1/2^n) \cdot 2^{n-1} = \sum 1/2 = \infty$.
