answer: |-
  The tension between Lewisian counterfactualism and Woodwardian interventionism centers on how each framework conceptualizes the *stability* of causal relationships. While Lewis grounds causation in the similarity relations between possible worlds, Woodward (drawing on Pearl) grounds it in the invariance of relationships under **surgical interventions**.

  The precise advantage of the interventionist framework lies in its **modularity**: the ability to isolate specific causal pathways by severing them from their normal generative history. This allows interventionism to handle cases of **late preemption** more robustly than Lewis, not by finding a clever chain of intermediate events, but by changing the *question* we ask about the causal structure.

  Here is an unpacking of the "surgical" character of interventions, why Lewis's similarity metric struggles to replicate it, and how this plays out in late preemption.

  ---

  ### 1. The "Surgical" Character vs. Similarity Metrics

  To understand the divergence, we must contrast how the two theories evaluate a counterfactual claim like "If $C$ had not occurred, $E$ would not have occurred."

  #### Lewis: Holistic Similarity
  For Lewis, evaluating $\neg C \square\to \neg E$ requires finding the **closest possible world** where $C$ is false. Closeness is determined by a weighted metric of similarity (matching particular facts, avoiding miracles, maximizing spatiotemporal match).
  *   **The Constraint:** In the closest world where $C$ does not occur, the rest of the world must unfold according to the actual laws of nature (mostly).
  *   **The Problem:** If $C$ prevents a backup cause $B$ from producing $E$, then in the closest world where $\neg C$, the laws of nature dictate that $B$ *will* produce $E$. Lewis cannot arbitrarily "turn off" $B$ in that world without making the world significantly less similar (requiring a second miracle to stop $B$).

  #### Woodward: Surgical Modularity
  For Woodward, causation is defined by **invariant generalizations** represented by Structural Equation Models (SEMs). An intervention $do(C=c)$ is "surgical" because it:
  1.  Sets the variable $C$ to value $c$.
  2.  **Severs all incoming arrows** to $C$. $C$ is no longer determined by its usual causes; it is set exogenously.
  3.  Leaves all other structural equations (mechanisms) intact.

  **The Crucial Difference:** Lewis asks, "What happens in the nearest world where $C$ is absent?" Woodward asks, "Is there a stable functional relationship between $C$ and $E$ that persists when we manipulate $C$ independently of its usual background conditions?"

  Interventionism treats causal mechanisms as **modules**. The equation determining $E$ is distinct from the equation determining $B$. We can test the $C \to E$ module while "clamping" the $B$ module, regardless of whether $B$ *would* have fired in a counterfactual scenario. Lewis's world is a holistic tapestry; Woodward's model is a circuit board where wires can be disconnected.

  ---

  ### 2. The Case of Late Preemption

  **The Scenario:**
  *   Suzy ($S$) and Billy ($B$) throw rocks at a bottle.
  *   Suzy's rock arrives first and shatters the bottle ($E$).
  *   Billy's rock arrives a split second later.
  *   **Actual World:** $S=1, B=1, E=1$. (Both throw, bottle shatters).
  *   **Preemption:** If Suzy hadn't thrown, Billy's rock would have shattered the bottle.

  #### Lewis's Struggle (The Failure of Dependence)
  Lewis defines causation as the ancestral of counterfactual dependence.
  1.  **Direct Dependence:** Does $E$ depend on $S$?
      *   Evaluate $\neg S \square\to \neg E$.
      *   In the closest world where Suzy doesn't throw, Billy's rock (which was already in flight) hits the bottle.
      *   Result: $E$ still occurs. Dependence fails.
  2.  **The Chain Solution:** Lewis (1986) attempts to rescue this by positing a chain of intermediate events ($S \to I_1 \to I_2 \to E$). Perhaps the shattering depends on the rock's impact, which depends on the flight, which depends on the throw.
      *   **The Weakness:** In *late* preemption, the effect occurs almost simultaneously with the cause, or the intermediate events are not sufficiently distinct. Furthermore, if Billy's rock is sufficiently close, the intermediate states of the bottle (e.g., "cracking") might still occur via Billy's rock in the counterfactual world. Lewis relies on finding *some* fragile chain of dependence. If the preemption is tight enough, the chain dissolves.

  #### Interventionist Traction (De Facto Dependence)
  Woodward (and Hitchcock) handle this via **De Facto Dependence** within a Structural Equation Model.

  **The Model:**
  Let $SH$ = Suzy's rock hits, $BH$ = Billy's rock hits.
  Let $E$ = Bottle shatters.
  Equation: $E = \max(SH, BH)$ (Simplified: if either hits, it shatters).
  *   Actual values: $SH=1, BH=0$ (Billy's rock hits nothing because the bottle is already gone).
  *   Note: We distinguish *Throwing* ($ST, BT$) from *Hitting* ($SH, BH$).

  **The Interventionist Test:**
  To determine if Suzy's throw ($ST$) causes $E$, we do not simply ask "What if $ST=0$?" (which Lewis does). We ask: **Is there a setting of the other variables (specifically the backup process) such that $E$ depends on $ST$?**

  1.  We hold the backup variable $BH$ fixed at its **actual value** ($0$).
      *   *Why is this legitimate?* Because $BH=0$ is within the **redundancy range** of the variable. It is a value the variable actually took, and it is consistent with the structural equations.
  2.  We intervene on $ST$ (setting it to 0).
  3.  Since we are holding $BH$ fixed at 0 (surgically preventing Billy's rock from hitting, even if he threw), the equation becomes $E = \max(SH, 0)$.
  4.  Now, $E$ *does* depend on $SH$ (and thus $ST$). If $ST=0 \to SH=0 \to E=0$.

  **Where Interventionism Gains Traction:**
  Lewis cannot "hold $BH$ fixed at 0" in the counterfactual world where $ST=0$. In Lewis's semantics, if $ST=0$, the laws of nature + the fact that $BT=1$ entail that $BH=1$. To make $BH=0$ in that world requires a "miracle" (Billy's rock vanishes), which makes the world too distant to count for the counterfactual evaluation.

  Woodward's interventionism does not care about "distance" or "miracles." It cares about **structural stability**. It asks: "Is the mechanism linking Suzy to the bottle capable of producing a difference?" By surgically fixing the backup ($BH$) to its actual non-effective state, we reveal that Suzy's process *was* the active causal path, even if the backup *would* have worked had Suzy failed.

  ---

  ### 3. Why "Modularity" Matters

  The deeper philosophical payoff is the shift from **outcome-based** to **mechanism-based** causation.

  1.  **Independent Manipulability:**
      Interventionism requires that variables in the model be independently manipulable. We must be able to vary $S$ without varying $B$. In Lewis's possible worlds, $S$ and $B$ are often entangled by the laws of nature and the similarity metric (changing $S$ changes the context in which $B$ operates). Interventionism treats the equations $f_S$ and $f_B$ as distinct modules. We can assess the contribution of $f_S$ to $E$ without re-solving the entire system for the counterfactual history of $B$.

  2.  **Actual vs. Counterfactual Processes:**
      Lewis's theory is fundamentally about what happens in *other* worlds. Interventionism is about the *actual* world's structure.
      *   In late preemption, the actual world contains a completed process from Suzy to the Bottle.
      *   Lewis ignores this completed process because it lacks counterfactual dependence (due to the backup).
      *   Woodward captures this completed process by showing that the relationship is invariant *under interventions that hold the backup fixed*.

  3.  **Avoiding "Backtracking" Intuitions:**
      Lewis's similarity metric often struggles with backtracking (if $C$ didn't happen, maybe its causes didn't happen...). While Lewis bans backtracking via the "asymmetry of overdetermination," it remains a fragile constraint.
      The surgical intervention $do(C)$ explicitly forbids backtracking by definition: it sets $C$ exogenously. It does not ask "what would cause $\neg C$?"; it forces $\neg C$. This makes the testing of causal paths cleaner and less susceptible to the vagaries of world-similarity weighting.

  ### Summary

  The "surgical" character of interventions allows Woodward to **decouple the test of a cause from the counterfactual behavior of its backups.**

  In late preemption:
  *   **Lewis** asks: "In the nearest world without Suzy, does the bottle break?" (Answer: Yes, because Billy saves it. Causation denied or rescued only via fragile chains).
  *   **Woodward** asks: "Is there a path from Suzy to the bottle that is active in the actual model?" (Answer: Yes. We verify this by intervening on Suzy while holding Billy's *impact* fixed at its actual value of zero).

  Interventionism gains traction because it treats causation as a property of the **structural equations** governing the actual system, not as a property of the **similarity relations** between the actual world and its alternatives. It isolates the *capacity* of the cause to produce the effect, independent of the *redundancy* of the system.
