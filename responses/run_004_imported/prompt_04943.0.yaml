answer: |-
  **MEMORANDUM**

  **TO:** Promotion Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding Regional Director Promotion (Priya vs. Dan)

  ### **Recommendation**
  **Decision:** **Hold Promotion for 90 Days**
  **Basis:** Controlled Performance Trial with Equalized Lead Allocation.

  We cannot make a high-stakes leadership decision based on compromised data. While the segmented performance metrics favor Dan, the ambiguity surrounding lead allocation introduces a variable we cannot statistically control for retroactively. I recommend we pause the promotion, equalize lead distribution for both candidates for Q3, and reconvene in 90 days to vote based on clean, comparable data.

  ### **Reasoning**

  **1. The Data is Currently Misleading (Simpson's Paradox)**
  On the surface, Priya's 67% overall close rate dwarfs Dan's 46%. However, this is a textbook case of Simpson's Paradox. When we segment by lead type, Dan outperforms Priya in both categories:
  *   **Warm Leads:** Dan (92%) > Priya (90%)
  *   **Cold Leads:** Dan (30%) > Priya (20%)

  Priya's aggregate win is driven entirely by lead mix, not skill. She received 67% warm leads; Dan received only 25%. Promoting based on the aggregate number would reward luck (or allocation bias) rather than ability.

  **2. The "Why" of Allocation is Unknown**
  The committee is deadlocked on *why* Priya received warmer leads.
  *   **Scenario A (Bias):** Leads were manually routed to Priya because she was already perceived as stronger. If we promote her now, we cement a feedback loop of bias.
  *   **Scenario B (Random/Queue):** The split was an operational accident. If we promote Dan now, we risk promoting a candidate whose performance on warm leads (50 sample size) has a wider margin of error than Priya's (200 sample size).

  Because we cannot verify the intent of the lead split, we cannot trust the historical data as a sole predictor of future success in a Director role.

  **3. The Cost of a Bad Hire vs. The Cost of a Delay**
  A Regional Director failure is costly in revenue and morale. A 90-day delay is costly in time. The risk of promoting the wrong candidate outweighs the cost of waiting one quarter. This approach also fixes the underlying Ops issue (lead distribution) regardless of who wins the role.

  ### **The Plan (90-Day Sprint)**
  1.  **Equalize Inputs:** Ops to assign a 50/50 split of Warm/Cold leads to both candidates for the next quarter.
  2.  **Define Success:** Metrics to include Close Rate (segmented), Pipeline Generation, and Peer Feedback (leadership potential).
  3.  **Retention Mitigation:** Both candidates must be informed that this trial is to *ensure fairness* given the data discrepancy, not to question their past performance.

  ***

  ### **The Strongest Case for the Alternative (Promote Dan Immediately)**

  *If the committee rejects the Hold and demands a decision today, the only defensible choice is Dan.*

  **The Argument:**
  Dan is the superior closer, full stop. In sales, performance *per opportunity* is the only metric that isolates talent from circumstance. Dan proved he can convert difficult assets (Cold Leads) at a rate 50% higher than Priya (30% vs 20%). He also matched her on easy assets (Warm Leads).

  **Why this is compelling:**
  *   **Meritocracy:** Promoting Priya signals that lead quality matters more than conversion skill. This demoralizes high performers who get handed difficult territories.
  *   **Management Failure:** The lead allocation skew is a management error. We should not penalize Dan for Ops' failure to distribute leads evenly.
  *   **Directionality:** Even with a smaller sample size on warm leads, the direction of the data is consistent. Dan wins on hard mode and easy mode. The probability of this being pure luck is low.

  **Risk:**
  Promoting Dan immediately carries retention risk for Priya, who may view the lead split as prior validation of her seniority. However, showing her the segmented data makes that position difficult to defend.

  ***

  **Next Steps:**
  I move we adopt the 90-Day Controlled Trial. I will draft the communication to Priya and Dan to ensure they view this as an investment in fairness, not a lack of confidence.

  **Vote:** [ ] Priya [ ] Dan [X] Hold for Data
