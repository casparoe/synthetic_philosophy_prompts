answer: |-
  This is a fantastic debate to be having, and your friend is making a very common argument in modern AI circles. He is **half-right**, but he is conflating two different versions of the frame problem.

  To push back effectively, you need to distinguish between the **Logical Frame Problem** (McCarthy & Hayes) and the **Philosophical/Cognitive Frame Problem** (Dennett & Fodor). Your friend is correct that deep learning dissolves the first one, but he is mistaken that it solves the second.

  Here is the breakdown of the argument, the nuance you need, and how to frame it for your group.

  ### 1. The Logical Frame Problem (Your friend is right)
  **The Problem:** In 1969, McCarthy and Hayes were working with *situation calculus* (formal logic). To program a robot to move a box, you had to write an axiom saying "the box moves." But you also had to write axioms saying "the color of the box doesn't change," "the position of the door doesn't change," "the time of day doesn't change," etc. For every action, you needed infinite axioms describing what *didn't* happen. This was a combinatorial nightmare.

  **The ML Rebuttal:** Your friend is correct here. Neural networks do not use explicit symbolic logic. They do not store a list of facts that need to be updated. They store weights in a high-dimensional vector space. When an LLM predicts the next token, it isn't checking a database of "unchanged facts." It is activating a pattern. Therefore, the specific engineering bottleneck McCarthy worried about **does not exist for neural nets.**

  **Verdict:** On the narrow, historical definition of the frame problem regarding logical representation, your friend wins.

  ### 2. The Philosophical Frame Problem (Your friend is wrong)
  **The Problem:** Dennett and Fodor quickly realized the logical issue was just a symptom of a deeper cognitive mystery. Dennett famously illustrated this with the "Robot Deduction" story:
  *   **Robot 1** is tasked to get a battery from a room with a bomb. It deduces that pulling the wagon moves the battery. It acts. The bomb moves with the wagon and explodes.
  *   **Robot 2** is programmed to consider all *side effects*. It sits there calculating that pulling the wagon won't change the color of the walls, won't change the number of stars in the galaxy... The bomb explodes while it's thinking.
  *   **Robot 3** is programmed to distinguish *relevant* from *irrelevant* side effects. It sits there analyzing which side effects are relevant... The bomb explodes.

  **The Deep Worry:** The problem isn't just about listing axioms; it's about **Relevance**. How does a finite system, in real-time, know which of its indefinitely many beliefs are relevant to the current context without checking all of them? Fodor called this the problem of "global isotropy" (anything could be relevant to anything).

  **The ML Rebuttal:** Your friend claims LLMs solve this because they "obviously make 'what matters here' judgments constantly without choking."

  **The Push Back:** LLMs do not solve the relevance problem; they **statistically approximate** it, and they fail in ways that prove the philosophical problem remains.

  #### Argument A: Correlation is not Causal Understanding
  LLMs predict text based on statistical co-occurrence, not a causal model of the world.
  *   **Example:** If you ask an LLM, "If I put a red ball in a blue box and paint the box white, is the ball still red?" it will likely say "Yes."
  *   **Why?** Not because it understands the physics of paint containment, but because "ball inside box" and "paint outside box" co-occur in its training data in ways that suggest independence.
  *   **The Failure:** If you present a novel scenario that violates statistical norms but obeys physics (or vice versa), the LLM often fails to track what changed and what didn't. It hallucinates changes that shouldn't happen or misses changes that should. This proves it hasn't solved the frame problem; it's just guessing based on priors. It doesn't *know* what stays the same; it just bets on what usually stays the same in text.

  #### Argument B: Brittleness and Out-of-Distribution Data
  The frame problem is most critical in novel situations (edge cases). Symbolic AI failed because it couldn't scale. Deep Learning scales, but it is brittle.
  *   When an LLM encounters a situation radically different from its training distribution, its ability to judge "relevance" collapses. It might start talking about the color of the sky in the middle of a math proof.
  *   This suggests the "relevance filter" isn't a solved mechanism; it's a heuristic that works well on average but lacks the robustness of a true cognitive solution. If the frame problem were truly dissolved, the system would be robustly reliable about what changes and what doesn't, even in weird new worlds. LLMs are not.

  #### Argument C: Fodor's Specific Worry (The Architecture of Mind)
  Fodor's worry was about the architecture of cognition. He argued that for a system to be intelligent, any belief *could* potentially be relevant to any update (e.g., realizing the price of tea in China matters to your plan to rob a bank because it affects the guard's mood).
  *   **LLMs have a fixed context.** They literally *cannot* access "all their beliefs." They only have access to the current context window and their weights.
  *   **Attention is a heuristic, not a solution.** The attention mechanism decides what to focus on. But *how* does the attention mechanism know what to attend to? It was trained via gradient descent to minimize loss. That is an engineering workaround, not an explanation of how relevance is determined. It pushes the frame problem back into the training phase rather than solving the inference-time problem of relevance.

  ### 3. How to Frame This in Your Group
  You don't want to sound like you're bashing ML (because your friend isn't wrong that it works surprisingly well). You want to frame it as a shift from an **Engineering Problem** to a **Cognitive Mystery**.

  **Here is a script/summary you can use:**

  > "I think you're right that Deep Learning bypasses the *Logical* Frame Problem. We don't need to hand-code frame axioms anymore, so the combinatorial explosion McCarthy worried about is gone.
  >
  > But I don't think it dissolves the *Philosophical* Frame Problem that Dennett and Fodor were worried about. Their worry wasn't just about storage or computation time; it was about **Relevance**.
  >
  > LLMs don't actually 'know' what stays the same when an action happens. They predict tokens based on statistical priors. They work most of the time because the world is statistically stable, not because they have solved the problem of relevance. When they fail (hallucinations, physical reasoning errors), it's usually because they failed to track what should have remained invariant.
  >
  > So, DL hasn't *solved* the frame problem; it's just **brute-forced** it with statistics. It works well enough for chat, but it doesn't explain how a system determines relevance in a novel situation where statistical priors don't apply. Fodor's worry was about the architecture of intelligence, not just engineering scalability."

  ### 4. Key Concepts to Drop
  If you want to sound like you know the literature, here are three terms to use:

  1.  **Symbol Grounding:** LLMs manipulate symbols (tokens) without knowing what they refer to in the real world. The frame problem is about changes in the *world*, not changes in *text*.
  2.  **System 1 vs. System 2:** (Kahneman). LLMs are pure System 1 (fast, intuitive, statistical). The Frame Problem is largely a System 2 problem (deliberate reasoning about change and consequence).
  3.  **Causal Representation:** (Judea Pearl/Yoshua Bengio). Current DL is correlational. To truly solve the frame problem, a system needs a causal model of the world to know *why* something didn't change, not just *that* it usually doesn't change.

  ### Summary
  Your friend is right that the **old engineering bottleneck** is gone.
  He is wrong that the **deep cognitive puzzle** is solved.

  The Frame Problem has morphed from "How do we list all the non-changes?" to "How do statistical systems acquire robust causal invariance?" The latter is still an open research question (see: "hallucinations" and "physical reasoning benchmarks").
