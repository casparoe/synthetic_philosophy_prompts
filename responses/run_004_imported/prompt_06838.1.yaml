answer: |-
  The wind outside the station didn't howl; it screamed, a constant, tearing sound that had worn the rock down to bone over a million years. Inside Station 4, the air was still, but the pressure gauge was dropping.

  There were three of us: me, Elias, and Sarah. We were the winter-over crew for the atmospheric research outpost. We had been there six months. We knew each other's coffee orders, our sleep-talking habits, the specific way Elias hummed when he fixed the water recycler, the way Sarah rubbed her left thumb against her index finger when she was thinking. We were not just colleagues; we were the only three human beings within four hundred miles.

  The seismic event hadn't been violent, just final. A shift in the bedrock had sheared the main support column. The habitat module was tilting. The primary generator was dead. We had the emergency beacon, but the storm was too thick for a rescue chopper to land. The only way out was the single-seat evacuation skiff stored in the lower bay.

  It was designed for one. The battery cells were degraded. If two people tried to cram in, the motor would stall halfway up the ice shelf, and we'd all freeze. If one person went, they could reach the relay station, trigger the heavy lift, and come back for the others.

  *If* they came back. The storm was forecast to last forty-eight hours. The habitat had enough heat for maybe twelve.

  I was the Station Lead. The decision matrix fell to me.

  We stood in the airlock. The skiff sat there, a sleek silver coffin waiting to be filled. Elias and Sarah didn't argue. That was the worst part. If they had fought, if one had claimed a right to live based on children or age or merit, I could have used that. I could have let logic be the villain.

  But they just looked at me.

  Elias checked his oxygen seal. "The battery holds a charge for forty minutes," he said, his voice flat. "That's enough to clear the shelf."

  Sarah nodded. She was shivering, not from cold, but from the adrenaline crash. "If you send me, I know the relay codes by heart. If you send Elias, he's a better pilot in whiteout conditions."

  They were offering me variables. They were trying to build a ladder for me to climb out of the hole. But the ladder was made of straw. Elias *was* a better pilot. But Sarah *did* know the codes. The weight of their virtues was identical. They were equally necessary. They were equally my friends.

  In the philosophy papers I read later, years after, they call this a "conflict of obligations." Some say it's an illusion. They say that if you truly *ought* to do X and truly *ought* to do Y, but you can only do one, then one of those 'oughts' wasn't real. Logic doesn't allow contradictions. If I saved Elias, then saving Sarah wasn't actually a duty. It was just a wish. A preference.

  But standing there, looking at Sarah's face, I knew that wasn't true. I owed her life. I owed it to her as completely and absolutely as I owed it to him. The debt was real. The inability to pay was the tragedy.

  "I'm sorry," I said. My voice sounded like it belonged to someone else.

  I didn't flip a coin. A coin would have suggested chance was responsible. This wasn't chance. This was me.

  I looked at Elias. I saw the way his hands shook, just once. I saw the trust in his eyes. He trusted me to make the call. That trust was a weight heavier than the rock above us.

  "Elias," I said.

  It wasn't because he was the better pilot. It wasn't because I liked him more. It was a selection without a criterion. A pure act of will.

  Sarah didn't cry. She just nodded. She stepped back from the skiff. She reached out and touched Elias's shoulder, then mine. "Keep the heat up," she said to me. "Until the end."

  "I will," I said.

  I helped Elias into the seat. I sealed the hatch. I watched the skiff climb the ice ramp and vanish into the white void. Then I turned back to the airlock.

  I walked with Sarah to the main module. It was already dropping below freezing. I helped her into the warmest sleeping bag we had. I sat beside her. I didn't tell her rescue was coming. We both knew the storm wouldn't break in time.

  I held her hand. I talked to her about the garden she wanted to plant when we got back. I lied. I told her I'd help her dig the soil. I owed her that comfort. I owed her the truth, too. I gave her the comfort.

  She died three hours later. Her breathing just slowed, like a clock winding down.

  Elias made it. The rescue team dug us out two days later. I was hypothermic, but alive.

  ***

  It has been five years. I live in the city now. I have a job that doesn't involve life support systems. I have friends. I am, by all external metrics, fine.

  But sometimes, when I am washing dishes, or waiting for a traffic light to change, I feel a physical weight in my chest. Not grief. Grief is for loss. This is different. It is a sense of outstanding balance.

  My therapist tells me it is survivor's guilt. She says I am punishing myself for a choice that had no alternative. "You maximized survival," she says. "You followed protocol. There was no moral failure because there was no other path. You cannot be blamed for the laws of physics."

  She speaks like a Kantian. She believes that duty is rational, and reason cannot contradict itself. If I did the only thing I *could* do, then it was the only thing I *should* have done. Therefore, Sarah was not owed anything I couldn't give her. The debt never existed.

  But then I talk to Elias. We have coffee once a month. We never speak of that night. But last week, he mentioned he visited Sarah's parents. He told them she was brave. He told them she didn't suffer.

  He looked at me, his eyes old and tired. "We made it," he said. "Because of you."

  He thinks I saved him. He thinks the choice was a success.

  I look at my hands. They are clean. They are warm.

  I think about Sarah's hand in mine, cooling. I think about the promise I made to help her dig a garden. I broke that promise. I broke it knowingly. I broke it because I had to.

  If my therapist is right, then this feeling in my chest is a glitch. It is emotional static. It is a mistake in my own wiring, a ghost of a duty that logic says was never real. I should let it go. I should accept that I am innocent.

  But if I let it go, if I accept that I am innocent, then Sarah's death becomes just a variable in an equation. It becomes acceptable. And I know, with a certainty that defies logic, that it was not acceptable. I took something from her that was hers. I took her tomorrow.

  I did what I had to do. I would do it again. If the station fell tomorrow, I would make the same call. I would pick Elias. Or maybe Sarah. It wouldn't matter. The choice is arbitrary, but the consequence is absolute.

  So I carry the weight. I don't know if it's because I did wrong, or simply because I did what was necessary in a world that wasn't built for necessity. I don't know if the guilt is a lie I tell myself to feel human, or the only true thing I have left.

  I just know that when I pass a garden center, I stop. I buy a packet of seeds. I put them in a drawer. I don't plant them. I just keep them there.

  A receipt for a debt I know I can never pay.
