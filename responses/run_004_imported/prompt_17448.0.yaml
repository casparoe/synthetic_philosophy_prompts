answer: |-
  You have done your homework. Most people stop at the "foolish daughter of astronomy" quote (from *Harmonices Mundi*) and assume Kepler was a reluctant hack who tolerated astrology only to pay the rent. But as you've noticed, that misses the profound internal logic of his system.

  Kepler didn't just "believe" in astrology; he tried to **reform** it. He wanted to strip away what he considered medieval superstition (the zodiac signs, the houses, the fixed stars) and rebuild it on what he considered to be physical and theological first principles: geometry and light.

  Here is how Kepler drew the line between what was "real" and what was "made up," and how a rigorous mathematician squared that with casting horoscopes.

  ### 1. The Metaphysical Engine: Geometry as Divine Language
  To understand Kepler's line, you have to understand his Neoplatonic Christianity. Kepler believed that God created the universe according to geometric archetypes. Geometry wasn't just a human tool for measuring things; it was the actual code of creation.

  Therefore, for any celestial influence to be "real," it had to be based on **universal geometric truths**, not human conventions.

  *   **What is Universal?** A triangle is a triangle anywhere in the universe. The ratio of a musical fifth (3:2) is constant. These are reflections of the mind of God.
  *   **What is Conventional?** Drawing lines between stars to make a "Lion" (Leo) or dividing the sky into 12 equal chunks. These are human labels imposed on nature, not nature itself.

  ### 2. Where He Drew the Line: Aspects vs. Signs
  This is the crux of your question. Kepler's distinction rests on **Causality vs. Correlation.**

  #### The Zodiac and Houses (The "Bunk")
  Kepler argued that the 12 signs of the zodiac and the 12 houses were arbitrary human inventions.
  *   **Constellations:** He knew that the stars making up a constellation were at vastly different distances from Earth and had no physical relationship to one another. Grouping them was a act of imagination, not physics.
  *   **The 12-fold Division:** Why 12 signs? Why not 10 or 13? Kepler saw this as historical baggage from Babylon and Greece, not a law of nature.
  *   **The Houses:** Dividing the sky based on the horizon at the moment of birth was, to Kepler, purely local and arbitrary. It lacked universal geometric necessity.

  He believed that relying on signs was like trying to predict the weather based on the shapes of clouds rather than barometric pressure. It might sometimes work by coincidence or tradition, but it had no *causal mechanism*.

  #### The Aspects (The "Real" Stuff)
  Kepler believed planetary **aspects** were physically real. An aspect is the angle formed between two planets as viewed from Earth (e.g., a conjunction is 0°, a square is 90°, a trine is 120°).

  Why were these legit to him?
  1.  **Euclidean Geometry:** These angles correspond to the construction of regular polyhedra (the Platonic solids), which Kepler believed structured the solar system (as detailed in his *Mysterium Cosmographicum*).
  2.  **Musical Harmony:** In *Harmonices Mundi*, Kepler demonstrated that these angular relationships correspond to musical consonances. A trine (120°) corresponds to a major third; a square (90°) to a dissonance. Since music was a universal mathematical truth, the angles producing them must also be universal.
  3.  **Causality:** Because these angles were divine archetypes, they had the power to act on the physical world.

  ### 3. The Mechanism: Light and the "Soul of the Earth"
  This is where Kepler becomes surprisingly modern, yet remains firmly Renaissance. He rejected the idea of "occult rays" or magic. Instead, he proposed a physical mechanism involving **light** and **animism**.

  *   **Planetary Light:** Kepler posited that planets emit a kind of spiritual light or *species* (likeness). This isn't just visible light, but a geometric influence.
  *   **The Anima Terrae:** This is the weird part for modern readers. Kepler believed the Earth had a soul (*anima terrae*).
  *   **The Interaction:** When planetary rays hit the Earth at specific geometric angles (aspects), the Earth's soul "perceives" this geometry. It reacts instinctively, much like a human soul reacts to hearing a harmonious chord vs. a dissonant noise.
  *   **The Result:** The Earth's reaction manifests as weather (winds, rain, heat) and, by extension, human temperament (since humans are affected by the air and environment they live in).

  So, for Kepler, astrology wasn't planets magically zapping a baby's personality. It was: **Planets emit geometric light $\rightarrow$ Earth's soul perceives geometry $\rightarrow$ Earth creates weather/environment $\rightarrow$ Humans are influenced by environment.**

  This allowed him to maintain scientific rigor. He was looking for a *physical cause* (geometry acting on a soul) rather than just accepting tradition.

  ### 4. *Tertius Interveniens*: The "Third Man"
  You mentioned this pamphlet (1610), and it is essential. The title translates to "The Third Party Intervening." Kepler positions himself between two extremes:
  1.  **The Skeptics:** Those who threw out astrology entirely because the zodiac/signs were arbitrary.
  2.  **The Traditionalists:** Those who defended every ancient rule, including the nonsense about fixed stars and houses.

  Kepler's "Third Way" was to say: **The skeptics are right about the signs, but wrong about the influence. The traditionalists are right about the influence, but wrong about the signs.**

  He argued that astrology needed to be purged. He wanted to keep the "wheat" (aspects, geometry, harmony) and discard the "chaff" (zodiacal mythology, arbitrary houses). He famously wrote that if astrologers would stick to the physical aspects and stop making up stories about signs, they would be far more accurate.

  ### 5. Squaring it with Rigor and Money
  How does a guy who discovered elliptical orbits reconcile this?

  **1. Probability, not Determinism**
  Kepler was acutely aware that astrology was unreliable. Unlike traditional astrologers who claimed certainty, Kepler treated astrological influence as a tendency, not a decree. He believed in free will. The stars incline, they do not compel. This allowed him to be wrong about predictions without his whole system collapsing. He often blamed "noise" in the data (human free will, local geography) for failed predictions.

  **2. Meteorology over Fate**
  Kepler was most confident in "mundane astrology" (world events/weather) rather than natal astrology (individual fate). Predicting a stormy season based on planetary aspects fit his physics of the Earth's soul much better than predicting that a specific duke would die in battle.

  **3. The Financial Necessity (and Patronage)**
  You noted he cast horoscopes for cash. This is true, but it's also nuanced. As Imperial Mathematician to Rudolf II, casting horoscopes was literally part of his job description. It was the grant funding of the era. However, Kepler didn't just churn out generic readings. He used his astrological work to gain the trust of patrons (like Wallenstein) to secure funding for his *astronomical* work. He viewed astrology as the "sugar coating" that allowed him to feed the "medicine" of true astronomy to the public and patrons.

  ### Summary: The Irony of Kepler's Astrology
  Kepler's view hangs together because he treated astrology as a branch of **natural philosophy**, not divination.

  *   **Legit:** Geometric angles (Aspects) because they are universal truths created by God.
  *   **Illegit:** Human grids (Zodiac/Houses) because they are arbitrary cultural constructs.
  *   **Mechanism:** Light acting on the Earth's soul via geometry.

  The great irony, which you might share with your girlfriend, is that Kepler's rigor actually helped kill traditional astrology. By insisting that only physically causal mechanisms counted, he exposed how much of traditional astrology was baseless. He tried to save astrology by making it scientific, but in doing so, he stripped away so much of the tradition that the resulting system was unrecognizable to other astrologers.

  He didn't believe in the "Full Deal" your girlfriend is into (signs, houses, retrogrades as omens). He believed in a cosmic music of spheres that influenced the weather through geometry. He was an astrologer who wanted to be a physicist, and in the process, he became the first astrophysicist.
