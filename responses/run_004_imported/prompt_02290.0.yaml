answer: |-
  This is a fascinating discovery. You have stumbled upon one of the most sophisticated 19th-century critiques of Humean skepticism, and it maps almost perfectly onto the modern debate about "Extraordinary Claims Require Extraordinary Evidence" (ECREE). Sidgwick, a philosopher known for his rigorous utilitarianism and epistemic caution, is essentially arguing that while the *intuition* behind ECREE is correct, its *application* as a conversation-stopper is logically incoherent.

  Here is a reconstruction of Sidgwick's argument, followed by an analysis of your specific questions regarding Hume, the "rate of growth" concession, and the Bayesian perspective.

  ### 1. Reconstructing Sidgwick's Argument

  Sidgwick's argument can be broken down into three moves:

  1.  **The Balance of Improbabilities:** Evaluating a miraculous claim is not a choice between "certainty" and "impossibility." It is a weighing of two competing improbabilities:
      *   $P(E)$: The improbability that the event (the marvel) actually occurred.
      *   $P(\neg T| \neg E)$: The improbability that the testimony is false (given the event didn't happen).
      *   *Constraint:* We lack "intellectual scales" to measure these precisely against one another.
  2.  **The Critique of Hume's "Contrary to Experience":** Hume argues that miracles are *contrary* to experience, while false testimony is *not*. Sidgwick argues this is a semantic sleight of hand.
      *   To say a miracle is "contrary to experience" only means it is **novel** (unlike collected, systematized experience).
      *   Novelty does not equal impossibility. History shows that "novel and strange" things often become familiar later (e.g., new species, new physical phenomena).
      *   Therefore, the marvel is not *impossible*, merely *improbable*.
  3.  **The Epistemic Limit (The Unknown Unknowns):** To calculate the exact improbability of a novel event, we would need to know the ratio of the **Known Universe** to the **Unknown Universe**.
      *   Since we cannot know the size of the "Unknown," we cannot calculate the probability of encountering something outside the "Known."
      *   *Conclusion:* We must admit that novelty implies improbability, but we cannot define the *rate* at which improbability increases with novelty.

  ### 2. Does Sidgwick Refute Hume or Relocate the Problem?

  You asked if Sidgwick's point about the ambiguity of "contrary to experience" refutes Hume or just relocates the problem.

  **It does both, but primarily it relocates the problem from a logical bar to an epistemic one.**

  *   **The Refutation:** Hume's argument in *Of Miracles* is often read as an *in principle* dismissal: the evidence against a miracle (uniform experience) is by definition maximal, so no testimony can ever outweigh it. Sidgwick refutes this by showing that "uniform experience" is just "experience so far." If "contrary to experience" just means "unprecedented," then Hume's absolute bar collapses into a probabilistic gradient. A miracle is not a violation of logic; it is a statistical outlier.
  *   **The Relocation:** Sidgwick admits that the skeptic is right about the *direction* of the burden. Novel claims *are* improbable. He does not solve the weighing problem; he admits it is unsolvable with "exactness." He relocates the dispute from "Is this possible?" (Hume says No) to "How much evidence is enough to overcome this vague improbability?" (Sidgwick says We don't know, so keep looking).

  Sidgwick exposes that Hume's dictum smuggles in a claim to total knowledge. To say a miracle is *contrary* to experience implies we have a complete catalogue of what nature can do. Sidgwick points out we do not.

  ### 3. Is the Concession on "Rate of Growth" Fatal?

  You asked whether Sidgwick's admission that "no one can pretend to lay down at what rate the improbability grows" is fatal to his policy of patient evidence-gathering.

  **It is not fatal; it is the very engine of his policy.**

  If Sidgwick claimed we *could* specify the rate (e.g., "A claim of telepathy requires 50 independent witnesses"), he would be vulnerable to the same dogmatism he accuses Hume of. By admitting the rate is unknowable, he achieves two things:

  1.  **It Prevents A Priori Dismissal:** A skeptic cannot say, "The prior probability is $10^{-100}$, so stop looking." Sidgwick replies, "You cannot know the prior is that low because you don't know the sample space of the universe."
  2.  **It Mandates Accumulation:** Since we cannot calculate the threshold in advance, the only rational method is the inductive one: gather data until the "opposing improbabilities" tip the scale. This justifies the existence of the Society for Psychical Research (SPR). Their job isn't to prove telepathy tomorrow, but to accumulate enough testimony that the "improbability of false testimony" eventually outweighs the "improbability of the event."

  Sidgwick's position is essentially **fallibilist**. He is arguing for a methodology of inquiry, not a verdict. The inability to specify the rate isn't a bug; it's a feature that keeps the inquiry open.

  ### 4. Does This Have Force Against a Modern Bayesian Skeptic?

  This is the crux of your dinner debate. A modern Bayesian might formulate ECREE as:
  $$ P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} $$
  Where $P(H)$ (the Prior) is extremely low for extraordinary claims.

  **Sidgwick's argument strikes at the assignment of the Prior ($P(H)$).**

  *   **The Bayesian Skeptic's Weakness:** Pop-Bayesianism often treats Priors as if they are objective or easily agreed upon. The skeptic says, "Telepathy is impossible, so $P(H) \approx 0$."
  *   **Sidgwick's Counter:** Sidgwick argues that $P(H)$ depends on the "proportion that what we do know about the universe bears to what we do not know." Since that proportion is unknown, the Prior is **indeterminate**, not just low.

  **Where Sidgwick Wins:**
  He defeats the skeptic who uses ECREE as a **conversation stopper**. If the skeptic says, "I need extraordinary evidence," Sidgwick asks, "How extraordinary?" If the skeptic says, "As extraordinary as the claim," Sidgwick asks, "Can you quantify the improbability of the claim?" Sidgwick shows they cannot. Therefore, the skeptic cannot claim the debate is over before evidence is examined.

  **Where the Bayesian Pushes Back:**
  A sophisticated Bayesian (like E.T. Jaynes or a subjective Bayesian) would reply: "We *must* assign a prior to function, even if it's uncertain. We can use a 'maximum entropy' prior or a wide distribution to represent Sidgwick's uncertainty."
  *   *Sidgwick's Rejoinder:* Even with a wide distribution, if the skeptic centers their prior on "impossible," they are smuggling in the conclusion. Sidgwick insists that the "novelty" of the claim cannot be fully priced in because novelty implies entering a domain of the "Unknown Unknown."

  **Verdict:** Sidgwick's argument remains potent against **dogmatic** Bayesians who treat their priors as facts of nature rather than expressions of current ignorance. He validates the ECREE intuition (yes, priors should be low for novel claims) but blocks its weaponization (but you cannot quantify exactly how low, so you cannot dismiss the claim without a hearing).

  ### Summary for Your Debate

  You can tell your friend that Sidgwick essentially agrees with them that **priors matter**, but agrees with you that **quantifying them is arbitrary**.

  Sidgwick's position is that ECREE is a **heuristic**, not a **formula**.
  1.  **Hume/Skeptic:** "The prior is so low that no evidence can overcome it." (Dogmatic)
  2.  **Gullible Believer:** "The prior doesn't matter; the testimony is enough." (Naive)
  3.  **Sidgwick:** "The prior is low and grows with novelty, but the rate is unknowable. Therefore, we cannot set a threshold in advance. We must investigate until the weight of testimony makes disbelief more improbable than belief."

  Sidgwick saves the principle of ECREE from becoming a shield for ignorance, while saving the investigator from becoming a dupe. He argues that **epistemic humility** requires us to admit we don't know how improbable the universe actually is.
