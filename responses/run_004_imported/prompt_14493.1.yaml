answer: |-
  The argument that "geometric rationality" (maximizing expected log value rather than expected arithmetic value) provides a principled rejection of fanatical longtermism is compelling because it shifts the debate from **moral intuition** to **mathematical coherence regarding time and survival**.

  Standard expected value (EV) maximization assumes an "ensemble average"—what would happen if you could run the universe many times in parallel and average the results. But we do not live in an ensemble of universes; we live in a single timeline where outcomes compound sequentially. When you introduce compounding and the possibility of an absorbing barrier (ruin/extinction), the arithmetic mean becomes mathematically incoherent for decision-making.

  Here is the argument for why geometric rationality kills fanaticism.

  ### 1. The Ergodicity Gap: One Timeline vs. Many Worlds
  The fundamental justification for Kelly betting is **ergodicity economics** (championed by Ole Peters). A process is ergodic if the time average (what happens to one person over many trials) equals the ensemble average (what happens to many people over one trial).

  *   **Arithmetic EV** optimizes for the ensemble average. It says: "If you take this bet a million times across a million parallel universes, the average wealth is huge."
  *   **Geometric EV** optimizes for the time average. It says: "If you take this bet repeatedly in *this* universe, what is your growth rate?"

  Longtermism is inherently about the **long term**—a time-extended process. We are not a multiverse of civilizations averaging out their fates; we are a single civilization navigating a single trajectory through time. If we optimize for arithmetic EV in a sequential process, we are mathematically guaranteed to go to zero eventually if there is any risk of ruin, regardless of how high the upside is. Therefore, using arithmetic EV for existential policy is a category error: it applies ensemble math to a time-series problem.

  ### 2. Extinction as an Absorbing Barrier
  In Kelly betting, wealth $W=0$ is an absorbing barrier. Once you hit it, you cannot bet again. The geometric growth rate of a strategy that risks ruin is $-\infty$ (since $\log(0) = -\infty$).

  In x-risk, extinction is the exact same mathematical object.
  *   **Arithmetic View:** If there is a $10^{-9}$ chance of creating $10^{100}$ units of value, the EV is $10^{91}$. This dwarfs any certain outcome of saving $10^{10}$ lives. This leads to "fanaticism": we should sacrifice the present for this tiny chance.
  *   **Geometric View:** We maximize $E[\log(\text{Value})]$.
      $$ \text{GeoEV} = p \cdot \log(V_{\text{astronomical}}) + (1-p) \cdot \log(V_{\text{status quo}}) $$

  The logarithm compresses the astronomical payoff. $\log(10^{100})$ is only 100 (in base 10). The tiny probability $p$ is not fighting against $10^{100}$; it is fighting against 100.
  $$ 10^{-9} \cdot 100 \approx 10^{-7} $$
  The contribution of the fanatical outcome becomes negligible. The geometric framework naturally "discounts" astronomical payoffs because value compounds. Gaining $10^{100}$ value is not $10^{90}$ times better than gaining $10^{10}$ value in a compounding system; it is only additively better in terms of growth *time*. You can reach $10^{100}$ from $10^{10}$ just by waiting and growing at a steady rate. You cannot recover from 0.

  ### 3. Geometric Rationality and Model Uncertainty
  Scott Garrabrant's work on geometric rationality often focuses on aggregating beliefs or values from different "experts" (or models) geometrically rather than arithmetically. This is crucial for x-risk because we have profound **model uncertainty**.

  When we evaluate fanatical arguments (like Pascal's Mugging), we are essentially dealing with a "model" that claims a tiny probability of infinite value.
  *   **Arithmetic Aggregation:** If you average models arithmetically, a single model predicting infinite value dominates the sum, regardless of how low its weight (probability) is. The system becomes hypersensitive to outliers.
  *   **Geometric Aggregation:** Geometric means are robust to outliers. If one model says "Value = 0" (extinction risk) and another says "Value = Infinity" (fanatical upside), the geometric mean is pulled strongly toward the zero.

  In a geometric framework, a hypothesis that implies a non-zero chance of ruin (zero value) acts as a veto. To maximize geometric growth, you must first ensure survival. Any strategy that accepts a non-negligible risk of extinction to chase a fanatical upside has a geometric growth rate of $-\infty$. This isn't a "risk aversion" preference; it is a requirement for continuity.

  ### 4. Resolving the "Intuition Pump" Accusation
  Critics of anti-fanaticism often argue that rejecting tiny-probability/high-payoff bets is just a vague intuition ("it feels wrong") that violates the axioms of rationality (like the Independence Axiom in Von Neumann-Morgenstern).

  The geometric argument turns this on its head. It argues that **VNM rationality with linear utility is the wrong axiomatic system for non-ergodic processes.**
  *   If you accept that we live in one timeline (non-ergodic).
  *   And you accept that extinction is irreversible (absorbing barrier).
  *   Then maximizing arithmetic EV is **irrational** because it leads to certain ruin in the long run.

  Therefore, rejecting fanaticism isn't violating rationality; it is adhering to a *more appropriate* definition of rationality for temporal agents. The "intuition" that something is off with Pascal's Mugging is actually a heuristic recognition of the ergodicity gap.

  ### 5. Practical Implication: The Safety Floor
  This framework justifies a "safety floor" priority. In Kelly betting, you never bet the whole bankroll, no matter the edge, because the geometric cost of ruin is infinite.

  Translated to longtermism:
  *   **Arithmetic Longtermism:** Spend all resources on the project with the highest $P \times V$, even if $P$ is tiny and failure means extinction.
  *   **Geometric Longtermism:** Maximize the *growth rate of civilizational potential*. This requires maintaining a non-zero probability of survival forever.

  This implies that reducing existential risk (ensuring $P(\text{survival}) \to 1$) lexically dominates creating astronomical value ($V \to \infty$) if the former is threatened by the latter. You cannot compound value if you are dead. The geometric view forces us to treat the *continuation of the game* as more valuable than any single *payout of the game*.

  ### Conclusion
  The move from Arithmetic to Geometric rationality is not just a tweak to bankroll management; it is a correction for how we evaluate outcomes in time. By treating the future value of civilization as a compounding resource and extinction as a ruin state (zero), the math itself dictates that **survival probabilities dominate payoff magnitudes.**

  This dissolves the fanaticism problem without needing ad-hoc discount rates. It shows that tiny-probability astronomical-payoff arguments are artifacts of using ensemble-average math on a time-average problem. Once you switch to the geometric mean, the "infinity" of the payoff is tamed by the logarithm, and the "zero" of extinction becomes an infinite penalty. The principled conclusion is that we should not gamble the continuation of the timeline for any finite payout, no matter how large, if the odds are not effectively certain.
