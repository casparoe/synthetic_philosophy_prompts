      *   **Key Assumptions:**
          1.  Principle of Mediocrity (You are not special).
          2.  Ignorance Priors (Scale invariance).
          3.  Independence of Observation.
      *   **Major Objections (The "Breakdown"):**
          1.  **The Reference Class Problem:** What counts as the "class" of newspapers?
          2.  **Bayesian Priors:** We aren't truly ignorant. We know institutions die. We know funding cuts matter. (The "Garbage Can" model vs. physical processes).
          3.  **The "Old Evidence" / Selection Effect:** Are we observing it *because* it survived? (Survivorship bias nuances).
          4.  **The "Presumptuous Philosopher" Objection:** It allows armchair prediction to override empirical data.
      *   **Formal Epistemology Context:** Tie it back to Self-Locating Belief (SSA vs. SIA).
      *   **Conclusion:** It's a valid *heuristic* under strict ignorance, but dangerous when specific causal information is available.

