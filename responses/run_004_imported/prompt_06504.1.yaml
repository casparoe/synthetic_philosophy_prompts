answer: |-
  **MEMORANDUM**

  **TO:** Committee on Student Leaves and Academic Continuity
  **FROM:** Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Bereavement Accommodation Policy

  **Recommendation**
  I recommend the Committee adopt the proposal to create a separate "Extended Bereavement Leave" category requiring no medical diagnosis. This policy should match the protections of a formal medical leave (tuition adjustment, re-enrollment guarantees, insurance coverage) but be triggered solely by the death of an immediate family member and a student's attestation of need beyond the standard five days.

  **Philosophical Grounding**
  This recommendation rests on a specific conceptual distinction regarding health and disease. Our current policy hinges on a Naturalist account similar to Boorse's biostatistical theory: accommodation requires evidence of a "failure of function" (a diagnosis). The proposal to add Prolonged Grief Disorder (PGD) attempts to bridge this gap by medicalizing grief. However, this commits a category error.

  While I acknowledge that *some* grief can become pathological (aligning with Wakefield's "harmful dysfunction" analysis), prolonged grief itself is not inherently a disease. It is often a statistically typical, functional response to significant loss, even when it severely impairs academic functioning. To require a PGD diagnosis is to assert that a student is only deserving of accommodation if their grief is "broken" rather than merely overwhelming. This forces a normativist judgment—what counts as "out of proportion" to cultural context—onto clinicians who may lack specific cultural competence, and it forces students to accept a psychiatric label to access basic support.

  Policy should instead follow Nordenfelt's welfare-based theory: health policy should aim to support an individual's vital goals regardless of whether the impediment is biological dysfunction or existential suffering. By decoupling accommodation from pathology, we acknowledge that grief is a normal human experience that nonetheless requires institutional flexibility. We should not require students to prove they are disordered to be treated decently.

  **The Counter-Argument**
  Proponents of adding PGD to the qualifying diagnosis list argue that it provides necessary objective boundaries. Without clinical certification, they contend, the university risks inconsistent application of leave policies or potential abuse of the system. They argue that PGD offers a validated, DSM-recognized threshold that distinguishes normal grieving from incapacitating conditions, ensuring resources are directed toward those with clinically significant impairments. This concern for administrative clarity and fidelity to medical standards is legitimate; relying on self-attestation does introduce ambiguity that diagnosis avoids.

  **Implementation**
  However, administrative convenience should not outweigh the ethical cost of medicalization. I propose the following implementation plan:
  1.  **Effectivity:** The policy should take effect immediately upon Committee approval.
  2.  **Retroactivity:** It must apply retroactively to the start of the current academic term. Students currently navigating informal arrangements due to bereavement should be permitted to convert their status to Extended Bereavement Leave without penalty.
  3.  **Documentation:** Require only a death certificate and a brief written statement from the student regarding their need for extended time, bypassing clinical gatekeeping entirely.

  **Conclusion**
  By establishing a non-medical pathway for extended bereavement leave, we respect the severity of grief without pathologizing it. We affirm that the university's obligation to student continuity is based on welfare and need, not merely on biological dysfunction. I urge the Committee to vote in favor of this standalone category.
