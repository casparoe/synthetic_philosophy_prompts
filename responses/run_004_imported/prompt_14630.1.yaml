      *   *Addressing the User:* You are right to notice the tension.

  6.  **Refining the "Normal vs. Disorder" section:**
      *   This is tricky. DSM-5 doesn't use evolution. But the *concept* of disorder often implies something going wrong. If anxiety is working as intended (protecting from lions) but there are no lions, is it a disorder? Yes, because the *context* makes it dysfunctional. This is the "Mismatch Theory."
      *   Make sure to distinguish between "statistical normality" and "functional normality."

  7.  **Final Review against User Questions:**
