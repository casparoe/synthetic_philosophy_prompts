  Let's organize the argument into three main pillars:
  1.  **Unity of Agency:** Resolute choice preserves the agent as a single entity over time; Sophistication fragments them.
  2.  **The Normativity of Plans:** Rationality applies to plans, not just atomic acts.
  3.  **The Failure of Separability:** Sophistication relies on the Separability condition which is inappropriate for diachronic contexts.

