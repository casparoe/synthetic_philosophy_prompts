answer: |-
  It is a genuine pleasure to engage with someone who has actually *used* the Brier score in the wild. Too much of this philosophical literature is written by people who treat scoring rules as abstract toys rather than tools for measuring skill against reality. Your intuition is spot-on, and I suspect you'll find the philosophical formalization is essentially rediscovering the geometry you already used operationally, just dressed up in epistemic clothing.

  Let's tackle your hangups in order. Your hunch about the convex set is exactly right—that is the entire engine of the argument.

  ### 1. The Gut-Level Picture: Convexity and Corners

  You wrote: *"I have a hunch it's something about the coherent credence functions forming a convex set, with the scoring rule acting like a kind of distance to the nearest 'corner'... so that anything sitting outside that set can be swapped for something inside it that's closer to every corner at once."*

  **You have nailed it.** That is precisely the geometric argument.

  Here is the picture you are missing to make it hold together:

  Imagine you are forecasting a single binary event (e.g., rain/no rain). The "possible worlds" are just two points: **Truth** (1) and **Falsity** (0).
  *   If it rains, the "truth vector" is 1.
  *   If it doesn't, the "truth vector" is 0.

  A coherent probability forecast lives on the line segment between 0 and 1. An incoherent forecast (say, you assign 1.2 or -0.1, or perhaps in a multi-event scenario, your probabilities sum to 1.5) lives **outside** that segment.

  Now, expand this to multiple events. If you have $N$ propositions, the "possible worlds" are the corners of an $N$-dimensional hypercube (vectors of 0s and 1s). The set of **coherent** probability functions is the **convex hull** of those corners. Geometrically, this is a shape called a *simplex*. It's like a rubber band stretched around the outermost truth-points.

  *   **Coherent credences:** Inside or on the boundary of the rubber band.
  *   **Incoherent credences:** Floating outside the rubber band.

  The Brier score is mathematically equivalent to **squared Euclidean distance** between your forecast vector and the truth vector.

  **The Geometric Theorem:**
  If you have a convex shape (the coherent simplex) and a point outside it (the incoherent credence), there exists a point *inside* the shape (the projection of the outside point onto the shape) that is **strictly closer** to every single vertex (corner) of the shape than the outside point is.

  Since the vertices represent the possible worlds (the ways reality could turn out), this means the coherent alternative is more accurate than the incoherent one *no matter which world becomes actual*.

  So, why does stepping outside the axioms guarantee you get beaten? Because the probability axioms define the boundary of that convex hull. If you violate them, you step outside the hull. Once you are outside, geometry dictates there is a spot inside that is nearer to all the corners. You are literally standing further away from every possible truth than you need to be.

  ### 2. Why Strict Propriety is Load-Bearing

  In meteorology, you know propriety is about incentives: it stops the forecaster from hedging to maximize score rather than reflecting belief. In epistemology, it serves a geometric function.

  For the "closer to all corners" theorem to hold, the "distance" measure (the inaccuracy score) needs to have **convex level curves**.

  *   **Strict Propriety implies Convexity:** A strictly proper scoring rule ensures that the expected inaccuracy is minimized when you report your true credence. Mathematically, this requires the inaccuracy function to be convex.
  *   **The Risk without Strictness:** If the scoring rule weren't strictly proper (or didn't satisfy the associated convexity conditions), the "contour lines" of equal inaccuracy around the truth could be dented or wavy.
  *   **The Consequence:** If the contours are wavy, it is possible for an incoherent point (outside the hull) to sit in a "dent" of a contour line such that *every* point inside the coherent hull is on a *higher* (worse) contour line for at least one world.

  Strict propriety guarantees the contours bulge the right way (like circles or ellipses rather than stars or crescents). This ensures that when you project the incoherent point onto the coherent simplex, you are definitely moving "downhill" in accuracy for every possible world. Without strict propriety, the geometry breaks, and the dominance argument fails.

  ### 3. The History: The Gap and the Patch

  Your memory is excellent. There was indeed a gap in the original argument, and closing it changed the technical substance, though not the final conclusion.

  *   **Joyce (1998):** In his seminal paper *"A Nonpragmatic Vindication of Probabilism,"* Joyce argued that any inaccuracy measure satisfying certain "reasonable" conditions (continuity, extensionality, etc.) would yield the dominance result.
  *   **The Gap:** Critics (notably Leitgeb, Pettigrew, and others in the early 2010s) pointed out that Joyce's conditions were not sufficient to guarantee the geometric dominance he claimed. Specifically, he assumed that *any* reasonable measure of inaccuracy would allow the "projection" argument to work. It turns out, some measures that seem "reasonable" (satisfying Joyce's original list) do not have the necessary convexity properties to guarantee that an incoherent credence is dominated by a coherent one in *all* worlds.
  *   **The Patch:** The fix was to tighten the requirements on the inaccuracy measure. It wasn't enough for the rule to be proper; it had to belong to a specific mathematical class that guarantees the geometry holds.

  This leads directly to your daughter's comment.

  ### 4. Bregman Divergences: Jargon or Engine?

  Your daughter is correct, and this is not just jargon. This is the rigorous mathematical engine that patched the gap.

  A **Bregman Divergence** is a measure of "distance" between two points that is generated by a strictly convex function.
  *   The **Brier Score** is a Bregman Divergence (generated by the squared Euclidean function).
  *   **Log Loss** is also a Bregman Divergence (generated by the negative entropy function).

  When the philosophers (led by Pettigrew) went back to fix Joyce's proof, they proved that the Accuracy-Dominance theorem holds if and only if the inaccuracy measure is a Bregman Divergence (or can be transformed into one).

  **Why this matters to you:**
  In your career, you likely compared different scoring rules (Brier vs. Log vs. others). You knew they behaved differently. The philosophical result says: "If you want to use accuracy to justify the laws of probability, you are restricted to this specific family of scoring rules (Bregman)."

  If you used a scoring rule that wasn't a Bregman Divergence, you could construct a scenario where an incoherent forecaster is *not* accuracy-dominated. So, the move to Bregman divergences wasn't just tidying bookkeeping; it defined the boundary of where the argument works. It tells us that the link between "accuracy" and "probability axioms" is tighter than Joyce originally thought—it depends on the specific geometry of the scoring rule.

  ### Summary for the Seminar

  If you want to jump into the discussion with the "gut-level" version that respects the math:

  1.  **The Geometry:** Probability axioms define a convex hull (simplex) around the possible truth-values. Incoherent credences lie outside this hull.
  2.  **The Dominance:** Because the hull is convex, any point outside it can be projected onto the surface such that the projection is closer to *all* vertices (truths) than the original point.
  3.  **The Condition:** This geometric projection only guarantees lower inaccuracy if the scoring rule creates convex "distance" contours. This is guaranteed if the scoring rule is a **Bregman Divergence** (which includes the Brier score).
  4.  **The History:** Joyce's original proof assumed this geometry followed from weaker conditions. Later work showed you specifically need the Bregman property to ensure the "closer to all corners" claim holds universally.

  You have the right intuition. The philosophy is essentially catching up to the geometry you used to verify forecasts. The only difference is that instead of verifying the forecaster, they are using the score to verify the *logic* of belief itself.
