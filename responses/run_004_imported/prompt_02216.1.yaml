prompt: |-
  I've been putting together the reading list for my formal epistemology seminar this term and got stuck trying to re-explain something to myself that I definitely understood at some point, so I want to sanity-check my thinking with you before I stand in front of a room of grad students and embarrass myself (and no, you can't look anything up for this one, I want to see how far you get on your own steam).

  The case is van Fraassen's old "Judy Benjamin" problem, in case the details have gone fuzzy: her platoon is dropped in terrain thats carved into four equally likely quadrants -- Red-HQ, Red-Second-Company, Blue-HQ, Blue-Second-Company, each starting out at credence 1/4 -- and command radios her "if you're in Red territory, the odds are 3:1 that you're in HQ company area" right before the signal cuts out. The near-universal intuition (van Fraassen polled seminar audiences on this for years) is that her credence in being in Blue territory shouldn't budge one bit from 1/2, since the message is ostensibly only telling her about the split within Red -- so the "obvious" update just redistributes Red's half into 3/8 HQ and 1/8 Second, leaving Blue's two quadrants at 1/4 each. But if you update by minimizing cross-entropy relative to the prior -- the standard way of generalizing Jeffrey conditionalization to handle a constraint on a conditional probability like this one -- her credence in Blue actually creeps above 1/2, for pretty much any odds ratio other than 1:1. Grove and Halpern's counter-move is to insist you don't need to give up on plain old conditionalization here at all, so long as you're willing to hunt for the right event, possibly in some larger space, to condition on instead.

  What I want from you is a real comparison of these two strategies as general theories of how to update on this sort of conditional information, not just a play-by-play of the Judy Benjamin numbers. Ordinary conditionalization is obviously the "special case" both camps are trying to responsibly extend -- cross-entropy minimization collapses to it whenever the new information pins something down with certainty, and so does Jeffrey conditionalization. So: what does the move to minimizing cross-entropy actually change about that special case that makes it misbehave here, and does Grove and Halpern's larger-space maneuver genuinely dodge the same problem or just relocate it somewhere less visible? And, since my officemate and I have been arguing about this over lunch all week: whose picture of what it even means to "rationally update on a conditional" do you think is closer to correct, and why?
