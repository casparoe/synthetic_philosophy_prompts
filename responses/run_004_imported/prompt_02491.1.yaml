  *(Self-Correction Note)*: I should be careful not to get too bogged down in Calvinist theology. Keep it focused on the rhetorical and logical moves in the text provided. The user asked about the *argument*, not the doctrine per se.

  *(Refining the "Uncaused" point)*: Edwards actually thinks "uncaused volition" is nonsense. But in defining "Liberty," he is saying the *concept* of Liberty doesn't inherently rule it out or rule it in. Liberty is about the *execution* of the will, not the *origin*. This is the crucial distinction. Liberty = External ability. Necessity = Internal cause.

