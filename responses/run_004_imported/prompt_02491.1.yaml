      *   *Resolution:* It's not inconsistency; it's linguistic precision vs. conventional titling. He is correcting a philosophical error while using the common language of the debate. He's saying, "When people ask about the Freedom of the Will, what they *ought* to be asking is whether the Agent is free in willing."

