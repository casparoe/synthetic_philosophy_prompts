  6.  **Final Polish:** Ensure the language is accessible but not dumbed down (AP Lang students handle complexity). Use formatting (bolding, bullet points) to make it readable. (Proceed to generate output based on this thought process).

  7.  **Final Review against constraints:**
      *   AP Lang context? Yes.
