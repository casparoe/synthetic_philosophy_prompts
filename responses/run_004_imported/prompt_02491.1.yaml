      *   **Task:** Explain two specific confusions regarding Jonathan Edwards's *Freedom of the Will*, Part I, Section V.
      *   **Confusion 1:** Why does Edwards define "liberty" in a way that allows for uncaused choices (indeterminism), when his whole goal is to prove choices *are* caused/necessitated? Is this a hole in his argument?
      *   **Confusion 2:** Why does he argue that only the *agent* has liberty (not the *will*), yet title his book *Freedom of the Will*? Is this inconsistent?
      *   **Constraint:** Do not just give a modern paraphrase. Explain the *logic* behind the points.

