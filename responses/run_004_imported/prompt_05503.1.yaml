answer: |-
  Good evening. For those who don't know me, I'm [Name], and I had the distinct privilege of being in the seminar where [Partner A] and [Partner B] read Émilie du Châtelet's *Discourse on Happiness* the same week they decided to read each other.

  Asking me to toast this marriage using du Châtelet is a bit like asking a rabbi to officiate using Marx. It requires… creative fidelity.

  Du Châtelet argues that happiness requires strong passions, against the Stoics. But she also argues that sustaining passion requires *illusion*. We must pretend our attachments are necessary, even though a clear-eyed view reveals they are contingent. In other words: to be happy, you have to willingly suspend your disbelief about how likely this is to work.

  Looking at you two, I'd say you've mastered that illusion. You have looked at the statistical contingency of finding a partner who understands both your heart and your footnotes, and you have chosen to treat it as destiny. That is the first requirement of her happiness: the courage to value your own attachment above the objective odds.

  But du Châtelet is famously sober about what happens when the illusion meets time. She writes that romantic passion is inherently temporary. It recedes. And this is where her advice becomes surprisingly sturdy for a marriage vow. She warns us not to rely on passion alone, nor on another person entirely, for our happiness. When the fire cools, she says, we need "sturdier reserves."

  For her, that reserve was study. For you, I hope it is the shared life you are building: the work, the friendship, and the individual growth that allows you to stand on your own even as you stand together. Du Châtelet knew that dependence on fortune—or on another person's moods—is a recipe for misery. A happy marriage, in her terms, isn't two halves making a whole; it's two self-sufficient people choosing to walk the same path even when the passion shifts shape.

  She did not live a conventional life, and she did not write a conventional guide. But she understood that happiness is not a passive state of bliss. It is an active cultivation. It is the work of maintaining the illusion of necessity, while building the reality of independence.

  So, let us raise a glass. Not to a fairy tale where passion never changes, but to something more durable. To [Partner A] and [Partner B]: May you cultivate your passions, may you sustain your necessary illusions, and may you always have enough reserve to be happy, even when the world is contingent.

  To the couple.
