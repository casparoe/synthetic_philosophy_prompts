answer: |-
  This is a classic and profound dilemma known in statistics and philosophy of science as the **Stopping Rule Problem**. It sits right at the fault line between frequentist hypothesis testing and likelihood/Bayesian inference.

  Given your background in physiology and your recent turn to philosophy, you are uniquely positioned to appreciate that **both of you were right, but you were arguing about different things.** The referee was right about the *operational integrity of frequentist error rates*, while you were right about the *epistemic weight of the observed evidence*.

  Here is the breakdown of why this dispute remains unresolved in the literature, and how to adjudicate it.

  ### 1. The Referee's Argument: Error Rates and the Sampling Space
  The referee was operating within the standard **Neyman-Pearson frequentist framework**, which dominates biomedical publishing. In this framework, a $p$-value is not merely a summary of the data you have; it is a statement about the **procedure** used to generate the data.

  *   **The Definition:** A $p$-value is the probability of obtaining a result as extreme or more extreme than the one observed, *assuming the null hypothesis is true*.
  *   **The Catch:** To calculate "more extreme," you must define the set of all possible outcomes that *could* have occurred under your experimental design.
  *   **The Violation:** By deciding to add animals *because* the first look was "tantalizingly close," you engaged in **optional stopping**. You effectively gave yourself two chances to reject the null.
      *   If the first 20 were significant, you would have stopped and published.
      *   Because they weren't, you added 10 more.
      *   From a frequentist perspective, you have expanded the "rejection region." If you simulate this process thousands of times under the null hypothesis, you will find that this strategy yields a "significant" result far more than 5% of the time.

  **The Verdict:** Within the rules of frequentist hypothesis testing (which promise to control long-run Type I error rates), the referee was technically correct. The calculated $p$-value of the combined data was invalid because it did not account for the interim look. To do it correctly, you would have needed a "group sequential design" with adjusted alpha levels (e.g., O'Brien-Fleming boundaries).

  ### 2. Your Argument: The Likelihood Principle
  Your intuition aligns with the **Likelihood Principle**, a cornerstone of Bayesian inference and evidential analysis, famously articulated by statisticians like R.A. Fisher (in some moods), Jimmie Savage, and later debated by Allan Birnbaum.

  *   **The Principle:** The evidence provided by an experiment is contained entirely in the likelihood function of the *actual observed data*. How the data were stopped (the sampling plan) is irrelevant to the interpretation of the data once they are in hand.
  *   **The Intuition:** Imagine you observed 30 rats. The physiological measurements are physical facts. Why should the meaning of those measurements change based on a thought in your head about whether you *might* have stopped at 20?
  *   **The Coherence:** If two researchers collect the exact same data ($N=30$, same mean, same variance), but Researcher A planned $N=30$ from the start and Researcher B used optional stopping, the Likelihood Principle says they should draw the exact same inference. The frequentist $p$-value says they cannot.

  **The Verdict:** Philosophically, your argument is stronger regarding **evidence**. If the goal is to update belief about whether the compound works, the stopping rule provides no additional information about the compound's effect once the data are observed.

  ### 3. The Philosophical Stalemate
  This dispute is not just a technicality; it is a fundamental incompatibility between two goals of science: **Error Control** vs. **Evidential Meaning**.

  *   **The Referee (Error Control):** Science is a quality control process. We need to ensure that the literature is not flooded with false positives. If we allow optional stopping without correction, we open the door to "p-hacking," where researchers peek until they find significance. The referee was protecting the **reliability of the scientific record**.
  *   **You (Evidential Meaning):** Science is about learning from nature. If the data show an effect, penalizing the researcher for their curiosity seems irrational. You were advocating for the **rational interpretation of evidence**.

  This tension was highlighted by Allan Birnbaum's 1962 theorem, which suggested that if you accept the Sufficiency Principle (data summarize the experiment) and the Conditionality Principle (inference should depend on the experiment actually performed), you are logically forced to accept the Likelihood Principle—which renders frequentist $p$-values incoherent. Frequentists (like Deborah Mayo) have spent decades arguing against Birnbaum to save the frequentist framework.

  ### 4. Who Had the Better Argument?
  If we judge by the **norms of the time (and largely still today)**:
  **The Referee was right.** In a regulatory or publication context relying on $p < 0.05$, the stopping rule is part of the test statistic. Unadjusted optional stopping invalidates the claim of $\alpha = 0.05$. If the journal allows it, the false positive rate of the journal rises.

  If we judge by **philosophical coherence and inference**:
  **You were right.** The physical evidence in the 30 rats does not change based on your intent. A Bayesian analysis of that data would yield the same posterior probability regardless of the stopping rule. Your frustration stemmed from the fact that frequentist tools were being used to answer a question about evidence, when they are actually tools for behavior control (accept/reject decisions over the long run).

  ### Conclusion
  You have stumbled upon one of the deepest cracks in the foundation of modern statistics.

  *   **Practically:** The referee protected the field from inflated false positives. In the era of the replication crisis, we now know that "p-hacking" (which includes optional stopping) is a major driver of non-replicable findings.
  *   **Philosophically:** Your objection remains valid. Many modern statisticians argue that we should move toward Bayesian methods or pre-registered sequential designs precisely to resolve this tension.

  **The Settlement:** You lost the battle (the paper was rejected), but your philosophical intuition was sound. The data *did* show what they showed, but the *warranty* attached to the $p$-value was voided by the procedure. If you were to rewrite this today, the solution would not be to argue with the referee, but to use a statistical method that allows for interim analysis (sequential analysis) or to report effect sizes with confidence intervals/Bayesian factors alongside the $p$-value, acknowledging the exploratory nature of the additional sampling.

  You were arguing for **truth**; the referee was arguing for **trust**. In the ecosystem of public science, trust (error control) often trumps truth (individual evidence) when the two conflict.
