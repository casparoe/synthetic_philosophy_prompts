      *   **The Referee's Position:** "Error rates depend on the sampling plan." This aligns with strict *Frequentist* theory (Neyman-Pearson). The $p$-value is defined by the probability of obtaining a result *as extreme or more extreme* under the null hypothesis, given the *sampling procedure*. If the procedure allows peeking and adding, the "more extreme" space changes, inflating the Type I error rate.

  3.  **Evaluate the Arguments (Philosophical & Statistical):**

      *   **Frequentist View (Referee):**
