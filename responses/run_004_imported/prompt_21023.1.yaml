      *   In biology/paleontology, "function" is notoriously slippery. It often conflates:
          *   *Current Utility:* What does it do *now* (for this individual)?
          *   *Adaptive Function (Selection):* Why was it *selected for*? (Evolutionary history).
          *   *Exaptation:* Was it co-opted for a new use?
          *   *Capability:* What *could* it do physically?
      *   The advisor is arguing from *phylogenetic bracketing/ancestral state* (Origin).
      *   The coauthor is arguing from *morphology/context* (Current Utility/Selection).
      *   The reviewer is arguing from *homology/potential* (Trajectory).
      *   The student is right: They are answering different questions.

