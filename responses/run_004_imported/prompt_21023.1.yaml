      *   **Problem:** Disagreement among co-authors (student, advisor, coauthor) and a reviewer regarding the *function* of pennaceous feathers on the forearms of a small troodontid specimen.
      *   **The Specimen:** Small troodontid, pennaceous feathers on forearms, arms too short, feathers too symmetric for flight/gliding.
      *   **The Positions:**
