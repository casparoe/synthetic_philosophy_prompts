  ### **TA-to-TA Note**
  Since you mentioned your dinner argument: This student's answer actually mirrors your friend's worry more than yours in one specific regard. By calling it a "two-step version of the sentience-based view," the student implies the animal's suffering *does* have moral weight (just indirectly). A strict Kantian (perhaps closer to your position at dinner) would insist the suffering itself is morally neutral; only the effect on the *human's* virtue carries weight. You might use this response in section to spark a debate on whether indirect duties grant animals any moral status *at all*, or if they are merely props for human moral development.
