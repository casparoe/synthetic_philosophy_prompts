answer: |-
  A Causal Decision Theorist (Cade) and an Updateless Decision Theorist (Ulysses) walk out of Omega's booth. Cade looks at his watch, then at Ulysses's empty wallet.

  **Cade:** "So... the coin came up Heads."
  **Ulysses:** "It did."
  **Cade:** "And Omega asked for the $100."
  **Ulysses:** "He did."
  **Cade:** "And you paid him."
  **Ulysses:** "I did."
  **Cade:** "Ulysses, the $10,000 payout was contingent on the coin coming up *Tails*. The coin is Heads. The money is gone. You literally handed a cosmic entity a hundred dollars for nothing. Even EDT would have calculated that paying gives no evidence of a payout *now*."
  **Ulysses:** "You're thinking locally, Cade. I'm thinking globally."
  **Cade:** "Globally? There is no global! There is only *here*, where you are $100 poorer!"
  **Ulysses:** "No, there is also the Tails branch. And in that branch, I am $10,000 richer."
  **Cade:** "But you aren't *in* that branch! You're in this one! You're subsidizing a ghost!"
  **Ulysses:** "I'm not subsidizing a ghost. I'm maintaining the integrity of my decision algorithm across the multiverse. If I don't pay in the Heads branch, I'm not the *kind of agent* who gets paid in the Tails branch."
  **Cade:** "But you *know* you're in the Heads branch! You saw the coin!"
  **Ulysses:** "And that's your problem. You updated. I remain updateless. I am acting as if I don't know the coin flip, because if I act like I know it, I betray the version of me who needs me to be consistent."
  **Cade:** "The version of you that *doesn't exist!*"
  **Ulysses:** "He exists in the computation that matters. Look, think of it like family support."
  **Cade:** "Don't you dare."
  **Ulysses:** "My counterfactual brother in the Tails universe? He's got the $10,000, sure. But he's got to live with the knowledge that his sibling in the Heads universe is a defector. I'm paying the $100 to keep the family name clean."
  **Cade:** "YOU DON'T HAVE A BROTHER."
  **Ulysses:** "I do in the expected utility calculation. And honestly? He needs the help more than I do. Inflation is killing the Tails branch."
  **Cade:** "I'm calling an ambulance."
  **Ulysses:** "Don't. If you call an ambulance in this branch, it might discourage the paramedics in the branch where I actually got hit by a bus. I have to lie here and bleed to maximize policy optimality."

  *(Ulysses lies down on the sidewalk.)*

  **Cade:** "You're not bleeding."
  **Ulysses:** "Shh. I'm pre-committing to the injury."
