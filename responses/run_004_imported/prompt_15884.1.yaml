answer: |-
  **Setting:** *A quiet corner of a coffee shop, late afternoon. Two philosophers, **Alex** and **Jamie**, are catching up. Alex has been reading up on meta-ethics and effective altruism; Jamie works in global development policy but has a background in moral philosophy.*

  **Alex:** I need to pick your brain about something. I know it sounds abstract, but it's actually blocking me from making a very concrete decision. I got a bonus at work, and I want to donate it effectively. But I've fallen down this rabbit hole regarding the "cluelessness objection" to consequentialism.

  **Jamie:** Ah, the James Lenman problem. "We are clueless about the consequences of our actions." It's a classic paralysis inducer.

  **Alex:** Exactly. The basic gist is: Consequentialism says an act is right if it produces the best outcome. But any act ripples out forever. If I donate to buy bednets, I save a child. That child grows up, has kids, changes the local economy, maybe inadvertently contributes to a future conflict or a technological breakthrough. The causal chain is infinite and chaotic. Since I can't know the net value of that infinite chain, how can I possibly know if my donation was *right*?

  **Jamie:** Okay, I see why that keeps you up at night. But most working consequentialists don't think this is fatal. The standard reply is the "washing out" argument. Think of the unknown future consequences as noise. For every unknown bad ripple, there's likely an unknown good ripple.

  **Alex:** That feels like an assumption, not an argument.

  **Jamie:** It's an assumption of symmetry. If you have no evidence that the future ripples are systematically good or systematically bad, the rational credence is that they cancel out in expectation. So, the expected value of the unknown long-term stuff is zero. That means you just maximize the expected value of the *known* short-term effects. Saving the life *now* is a known good. The downstream chaos is expected neutral. So you buy the bednets.

  **Alex:** But that's exactly where Lenman pushes back. He'd say you're conflating "I don't know" with "It averages to zero." Just because I'm ignorant doesn't mean the universe is symmetric. What if the structure of history is such that small perturbations tend to degrade stability? Or improve it? If I can't know, I can't justify the symmetry assumption.

  **Jamie:** Fair. But if you accept Lenman's view strictly, moral deliberation becomes impossible. Not just hard—impossible. You couldn't even choose to have coffee with me, because maybe that delays me by thirty seconds, causing me to miss a bus, leading to a car accident. If we can't bracket the unknowable, we can't act. Consequentialism has to be a guide for finite beings, not omniscient gods.

  **Alex:** I get the "ought implies can" angle. But Hilary Greaves made a distinction that I think keeps the problem alive even if we accept your "bracketing" move. She distinguishes between **Simple Cluelessness** and **Complex Cluelessness**.

  **Jamie:** Right, the 2016 paper.

  **Alex:** Exactly. Simple cluelessness is what you described: I have no idea if the ripple is good or bad, so I assume it washes out. That's manageable. But Complex Cluelessness is when I have *reasons* to think the effects go in opposite directions, but I can't weigh them.
  Take your bednet example. Saving a life is good. But in some demographic models, lowering child mortality can initially increase population growth, which might strain resources or increase carbon emissions. I have evidence for the good (life saved) and evidence for the bad (environmental strain), and I don't know which dominates. That doesn't wash out. That's a genuine conflict.

  **Jamie:** Okay, that's a stronger objection. Complex cluelessness is harder to dismiss. But even there, Expected Value (EV) reasoning still applies. You assign probabilities to the competing models. Maybe there's a 70% chance the demographic transition kicks in and population stabilizes, and a 30% chance it strains resources. You calculate the EV based on your best current evidence. You don't need certainty; you need probability-weighted estimates.

  **Alex:** But where do those probabilities come from? If I'm truly *clueless*, I can't even assign a principled probability. It's not like a dice roll. It's radical uncertainty. And this is where my anxiety about the donation spikes. If I'm looking at near-term global health, the complex cluelessness is manageable. But if I look at long-termist causes—say, AI safety or pandemic prevention—the chain of consequences is *longer*.

  **Jamie:** And the stakes are higher.

  **Alex:** But the cluelessness is magnified. If I donate to AI safety, I'm trying to steer the trajectory of civilization. The "washing out" argument seems weakest there. The ripples aren't random noise; they're structural changes to the future. If I succeed, the future looks radically different. If I fail, it looks different. How do I know the "success" future is actually better in the grand scheme? Maybe a delayed AI timeline leads to a different, worse catastrophe later. The "symmetry of ignorance" seems implausible when the intervention is specifically designed to change the long-term trajectory.

  **Jamie:** This is the crux of the near-term vs. long-term tension in EA. Look, I grant you that long-term interventions are more susceptible to complex cluelessness. But consider the alternative. If we let cluelessness veto long-term actions, we are implicitly privileging the status quo. You're saying, "Because I can't be sure the future will be better if I intervene, I should assume it won't be." That's a conservative bias disguised as epistemic humility.

  **Alex:** Is it? Or is it recognizing that complex systems are fragile?

  **Jamie:** It's recognizing that we have to act on *foreseeable* consequences. William MacAskill argues that while we can't know the *specific* details of the future, we can identify robust *types* of value. Reducing existential risk is robustly good because it preserves the option value of all future generations. Even if we're clueless about *which* future happens, keeping the future *open* is lexically superior to closing it, regardless of the downstream noise.

  **Alex:** That's a strong move. "Option value" as a trump card. But Lenman would ask: Why is existence itself a good? If the future contains net suffering, preserving it just preserves the suffering. You're smuggling in a value judgment that "more future people" is good, which is exactly what the cluelessness objection challenges. You don't *know* the future is net positive.

  **Jamie:** True, I don't know with certainty. But I have evidence. Life looks net positive for most people most of the time. The burden of proof isn't on me to prove the future is good; it's on the skeptic to show it's likely net negative.
  Let's bring this back to your bonus. You're paralyzed because you want the *objectively right* act. But consequentialism, practically applied, is about the *subjectively rational* act. It's about maximizing expected value given your epistemic constraints.

  **Alex:** So you're shifting from the "criterion of rightness" to the "decision procedure."

  **Jamie:** Precisely. The criterion is: "Did it actually produce the best outcome?" You're right, you'll never know that. The decision procedure is: "Did I use the best available evidence to estimate the outcome?" That you *can* know.
  If you donate to a high-quality global health charity, you have strong evidence of lives saved. The downstream effects are simple cluelessness (wash out). If you donate to long-termist causes, you have weaker evidence but higher stakes. The downstream effects are complex cluelessness.
  The "washing out" argument saves the global health donation. It makes it safe.

  **Alex:** But does it make it *optimal*? That's the EA question. If the long-termist option has a 1% chance of saving a billion lives, the EV might dwarf the bednets, even accounting for cluelessness. But if my cluelessness about that 1% is radical—like, I can't even trust the model—then the EV calculation is garbage in, garbage out.
  I guess what I'm hearing is that the "washing out" argument works best for things that *don't* try to change the fundamental trajectory of history. It works for alleviating suffering within the system, not necessarily for steering the system itself.

  **Jamie:** That's a very fair synthesis. Greaves herself suggests that complex cluelessness is a serious problem for specific kinds of long-term interventions, particularly those that rely on highly speculative causal chains. But she doesn't think it collapses the whole project. She suggests we look for "robustly good" interventions. Things that are good across a wide range of plausible worldviews.
  Saving a life today is robustly good. Reducing the risk of human extinction is robustly good *if* you think the future is worth having.

  **Alex:** So the advice isn't "ignore the ripples." It's "acknowledge the ripples, categorize the uncertainty, and don't pretend you know more than you do."

  **Jamie:** Exactly. And don't let the perfect be the enemy of the good. If you withhold the donation because you're afraid of unknown future ripples, you *know* the immediate consequence: money stays in your bank account, and no bednets are bought. That is a known negative compared to the donation. The status quo has consequences too.

  **Alex:** That helps. It reframes cluelessness from "I can't know if I'm doing good" to "I can't know the *full extent* of the good, but I can know the *direction*."

  **Jamie:** Right. In the bednet case, the direction is positive in the near term, and the long term is symmetric noise. In the AI safety case, the direction is positive *if* your model of risk is correct, but the noise is asymmetric.
  So, if you're losing sleep, maybe the answer isn't to solve Lenman's objection once and for all. It's to diversify. Put some into the robust, near-term stuff where simple cluelessness applies and the washing-out argument holds water. Put some into the long-term stuff where you accept the complex cluelessness but believe the EV is high enough to warrant the gamble.

  **Alex:** A portfolio approach to moral uncertainty.

  **Jamie:** Basically. You're not an omniscient utilitarian calculator. You're a human with a bonus trying to do less harm and more good. The fact that you're worried about cluelessness means you're already taking the consequences seriously. That counts for something.

  **Alex:** *Laughs.* I suppose worrying about the infinite ripple effects is better than not worrying about the ripple effects at all.

  **Jamie:** Exactly. Now, order another coffee. The consequence of that is I stay awake, you get to vent more, and the caffeine industry prospers. I'd say the EV is positive.

  **Alex:** I'll take that bet.
