  I'm TAing an intro decision theory seminar this semester, and last week we spent an entire session on Death in Damascus (the case where Death tells a man in Baghdad "I'll meet you in Damascus tomorrow," so he flees to Damascus, only to find Death waiting there, having expected him to flee). The students got really into the weeds about how ratifiability and the tickle defense are supposed to rescue causal decision theorists from always fleeing in a way that guarantees they meet Death — like the whole puzzle is that CDT seems to recommend an action, fleeing, whose expected utility calculation get undermined by the very fact that you're the kind of agent who'd calculate it that way.

  Anyway, I want to open next week's session with a joke that actually plays on this dynamic — something that only lands if you understand the specific problem of newcomb-like self-undermining predictions and ratifiability, not just a generic "death and taxes" joke. Bonus points if it also pokes fun at how decision theorists will construct increasingly baroque epicycles (like Reflexive Ratifiability or Nozick's meta-tickle) just to save CDT's verdict in this case. Can you write one?
