answer: |-
  Good morning. I know we ended last session with the CDT agent trapped in Damascus.

  I spent the weekend trying to write a patch for him. And I think I've got it. If we introduce a second-order tickle to screen off the first-order urge, and then apply a Reflexive Ratifiability constraint to the screening process itself, the paradox dissolves.

  The agent's decision becomes perfectly stable.

  The only downside is that the calculation takes about forty years. So the agent dies of old age before he ever moves.

  But here's the beautiful part: Since he died of natural causes, his death is *causally independent* of Death's location.

  So CDT is officially saved. It turns out the theory doesn't promise you'll survive Death. It just promises you'll die according to the correct axioms.
