  **Elena:** But Nash reflects the *marginal* trade-off. That's the beauty of it. It looks at the local slope of the frontier. It asks, "At the margin, how much does Player 1 have to give up to give Player 2 a gain?" That's the economic reality of the surplus division. KS ignores the local shape and draws a straight line from the origin to the ideal. It treats a "moonshot" ideal point the same as a "likely" ideal point.

  **Marcus:** It treats them as *claims*. Kalai and Smorodinsky argued that bargaining is about satisfying claims proportional to the maximum possible satisfaction. If my maximum possible satisfaction doubles, my claim on the surplus should strengthen.
