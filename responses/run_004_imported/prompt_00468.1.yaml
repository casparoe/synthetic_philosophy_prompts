  **Setting:** *A conference room in a neutral consulting firm. Two advisors, Elena (proponent of Nash) and Marcus (proponent of Kalai-Smorodinsky), are reviewing a contract framework for a long-term energy joint venture. The surplus (feasible set) will fluctuate based on market prices and regulatory changes. They need to recommend a single solution concept to write into the charter.*

  **Elena:** The client's main fear is instability. They're worried that if market conditions shift slightly, the division of profits swings wildly. That points directly to Independence of Irrelevant Alternatives. We need a rule where the solution only changes if the *optimal* options change, not just because the *menu* of possible options grew.

  **Marcus:** I get the desire for stability, Elena, but look at the context. The surplus isn't just fluctuating; it's generally *growing*. They expect efficiency gains over the five-year term. If we use Nash, we risk a scenario where the pie gets bigger, yet one partner ends up with less than before. That's a violation of monotonicity. In a long-term partnership, telling a partner "Good news, our potential maximum profit increased, but your share just dropped" is a recipe for litigation.

  **Elena:** That sounds dramatic. Can you show me where Nash actually reduces a payoff when the set expands? I'm looking at the standard symmetric case. Let the feasible set $S$ be the triangle with corners at $(0,0)$, $(1,0)$, and $(0,1)$. The disagreement point is $(0,0)$. Nash maximizes the product $xy$ on the line $x+y=1$. The solution is $(0.5, 0.5)$.

  **Marcus:** Right. Now let's expand the set to $S'$. We keep Player 1's maximum potential at 1, but we allow Player 2 to reach higher utilities in combination with Player 1. Let $S'$ be the convex hull of $(0,0)$, $(1,0)$, $(0.4, 0.9)$, and $(0,1)$. Player 1's ideal point is still 1. Player 2's ideal point is still 1. But we've bulged the frontier out near the top.

  **Elena:** Let's check the math. The new frontier has two segments. One from $(1,0)$ to $(0.4, 0.9)$. The slope is $\frac{0.9 - 0}{0.4 - 1} = \frac{0.9}{-0.6} = -1.5$. The equation is $y = -1.5(x - 1)$.

  **Marcus:** Exactly. Now, maximize $xy$ on that line.

  **Elena:** $x(-1.5x + 1.5) = -1.5x^2 + 1.5x$. The vertex is at $x = 0.5$. Plugging that back in, $y = 0.75$. So the candidate point is $(0.5, 0.75)$. Is that on the segment? The segment runs from $x=0.4$ to $x=1$. Yes, $0.5$ is in there. So the Nash solution moves from $(0.5, 0.5)$ to $(0.5, 0.75)$. Player 1 didn't lose, Marcus. They stayed flat.

  **Marcus:** I knew you'd catch that. In simple polygonal cases, Nash often satisfies *weak* monotonicity. But the violation exists with specific curvatures. Suppose the frontier isn't a straight line but curves inward just enough near Player 1's axis while bulging out for Player 2. There are documented cases where the tangent point shifts left, reducing Player 1's $x$ coordinate even though $S \subset S'$. The theoretical possibility is the problem. If the client's surplus function is non-linear—and energy markets are definitely non-linear—you can't guarantee them that growth won't punish them.

  **Elena:** I'll concede the curvature point. With complex frontiers, the tangent can shift unfavorably. But look at the trade-off. To fix that, you propose Kalai-Smorodinsky. You preserve monotonicity by anchoring the solution to the ideal points. But you sacrifice IIA. And that sacrifice is much easier to demonstrate numerically. It's not a "curvature" edge case; it's structural.

  **Marcus:** Show me.

