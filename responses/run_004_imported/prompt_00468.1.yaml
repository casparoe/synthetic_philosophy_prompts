  **Marcus:** I know this example. It's the standard critique. But look at *why* it happens. Player 2's bargaining power *should* increase if their best-case scenario improves, even if that best case is unlikely. The ideal point represents leverage. If Player 2 can say, "In the best possible world, I get 1.5," that changes the psychological anchor of the negotiation, even if the expected value is lower.

  **Elena:** But the contract isn't about psychology; it's about enforceability. If I'm Player 1, and I see my payout drop from 50% to 40% because you added a clause that we both agree will never be triggered, I'm going to claim the procedure is broken. It makes the solution manipulable. Player 2 can intentionally pad the feasible set with unrealistic, high-value options for themselves to shift the ideal point and drag the KS line in their favor.

