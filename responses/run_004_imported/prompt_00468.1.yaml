  **Elena:** Precisely. The efficient frontier for the actual agreement is still $x+y=1$ for the relevant range. The point $(0, 1.5)$ is an "irrelevant alternative." It won't be chosen. Under Nash, the solution stays at $(0.5, 0.5)$ because the local geometry of the frontier hasn't changed. Under KS, the ideal point shifts to $a' = (1, 1.5)$.

