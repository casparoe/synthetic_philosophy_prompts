      *   *Dramatic Suggestion:* Don't let the young man win on logic alone. Let him win on *fashion* or *momentum*, while the old man holds the ground on *rigor* or *epistemology*.
      *   *Tone:* Respectful of both figures. Russell wasn't a fool; Kripke wasn't a god.

  8.  **Review against Constraints:**
