      *   Cambridge context? Yes, emphasize the Ordinary Language/Acquaintance tradition vs. the new Modal Metaphysics.
      *   Specific logic? Yes, explain the "Actual" operator and the Acquaintance principle.

  9.  **Final Polish:** Ensure the distinction between "meaning" and "reference" is clear, as that's the crux. Russell: Meaning determines reference. Kripke: Reference is fixed causally, meaning is separate. The Don can argue that without meaning (description), reference is blind.

