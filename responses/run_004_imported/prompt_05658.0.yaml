answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. And if you know my sister, you know that she has a habit of assigning homework, even at her own wedding.

  A few years ago, she wrote her undergraduate thesis on Émilie du Châtelet. Because of her, I'm currently taking a seminar on women philosophers of the Enlightenment, where we've been spending a lot of time with Du Châtelet's *Discourse on Happiness*. It's an unfinished essay she wrote near the end of her life, essentially asking: What have I actually learned about how to live well?

  When I was asked to speak tonight, I thought about what Du Châtelet would say about marriage. And honestly, she isn't the easiest patron saint for a wedding. She's unsentimental. She argues that the Stoic ideal of a calm, passion-free life is actually a recipe for boredom. She says we *need* strong passions to be happy. But she is also brutally honest that romantic love, specifically, is not something we can expect to hold at its original intensity forever.

  Now, half of you are nodding, and the other half are wondering if this is a toast or a lecture. But stay with me, because her conclusion is actually incredibly hopeful.

  Du Châtelet argues that while some prejudices should be swept away, not all illusions should be. We need certain illusions—about love, about the importance of our own pursuits—to make life vivid. The trick isn't to find a passion that never changes, but to cultivate passions that depend on *ourselves*. She prized study above all because, unlike romance, it doesn't run down with time; it is renewable, internal, and entirely our own.

  So, what does this mean for you two?

  I think it means that a happy marriage isn't about maintaining a permanent state of breathless infatuation. That would be exhausting, and as Du Châtelet would point out, unsustainable. Instead, it is about building a life where you protect each other's illusions. It is about agreeing that the world is worth engaging with passionately, rather than calmly.

  It also means recognizing that the most durable love is one that allows for independence. Du Châtelet knew that if your happiness depends entirely on another person, you are vulnerable. But if you are both committed to your own "studies"—your own work, your own curiosities, your own fires—then you come to each other not out of need, but out of abundance.

  To the philosophy colleagues here: Yes, I know she leaves the *Discourse* unfinished. Life does too.
  And to everyone else: My sister taught me that wisdom isn't about knowing everything; it's about knowing what is worth pursuing.

  So, my wish for you is not a calm life. I wish you necessary illusions. I wish you passions that depend on yourselves, so you never lose your spark. And I wish you a love that is honest enough to change, and strong enough to hold those changes without breaking.

  To the happy couple.
