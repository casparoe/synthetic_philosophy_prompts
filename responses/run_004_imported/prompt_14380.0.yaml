    "C": ["..."],
    "D": ["..."]
  }
  ```

  Items to rank:
  - The basic synchronic Dutch Book argument for the probability axioms (incoherent credences guarantee a sure loss)
  - The converse Dutch Book theorem (coherent credences guarantee immunity to Dutch books)
  - The diachronic Dutch Book argument for Bayesian conditionalization
  - Van Fraassen's reflection principle as a Dutch-book-style constraint on your future credences
  - The "depragmatized" Dutch Book argument (the losing bet is a diagnostic of inconsistency, not the actual source of irrationality)
  - Ramsey's representation-theorem route from preferences over bets to precise numerical credences
  - Joyce's accuracy-dominance argument as a non-pragmatic rival to Dutch book style reasoning
  - The "logical omniscience" objection (a bookie would need to know your credences and outsmart you to actually exploit them)
  - Hájek's objection that Dutch-bookability is neither necessary nor sufficient for irrationality

