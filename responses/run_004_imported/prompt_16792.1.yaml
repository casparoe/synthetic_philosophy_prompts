      *   **Climax (The Input):** The system receives input. Maybe the artificial body touches something hot.
          *   *Idea:* The input comes in. The cascade begins. Li is part of a chain.
          *   *Internal Monologue:* If the Giant screams, do I scream? If I don't feel the burn, who does?

      *   **Conclusion (Ambiguity):** Return to the routine. The signal stops. The question remains open.
          *   *Idea:* He goes home. He looks at his hand. Is he part of a mind? He doesn't know. The light blinks again.

  5.  **Refining and Polishing (Word Count and Tone Check):**
      *   *Tone:* Melancholic, bureaucratic, slightly existential.
      *   *Word Count:* Need to ensure it lands between 800-1200.
