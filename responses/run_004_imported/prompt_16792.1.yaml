      *   *The Mechanism:* Radio links simulate axons/dendrites. Input/Output devices simulate body senses/motors.
      *   *The Problem:* Functionalism says if the input-output and internal causal relations match a brain, there's mind. Block argues this lacks "qualia" (subjective experience).
      *   *The Individual Experience:* A single person just presses a button when told. They don't know the big picture. They are a tiny cog.

  3.  **Determine the Narrative Voice:**
      *   The narrator is a "neuron." Let's call him Li.
      *   He needs a job. Pressing a button? Lighting a signal? Let's go with pressing a transmit key when a light comes on.
      *   He needs to feel the monotony and the disconnect. He doesn't feel pain or joy; he just follows protocol.
      *   The conflict: The internal doubt vs. the external instruction. The rumor of the "Ghost" (the collective mind).

  4.  **Drafting - Section by Section:**

      *   **Introduction (Setting the Scene):** Establish the routine. The booth, the light, the button. The scale of the project.
