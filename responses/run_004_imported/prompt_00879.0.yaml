      *   If Time = 9 hours, Rate = 11.11%/hr.
      *   So Rate $\in [11.11, 100]$.
      *   User's logic: Uniform on Rate.
      *   Coworker's logic: Uniform on Time.
      *   This confirms the $T$ vs $1/T$ relationship.

