      *   **Goal:** A dialogue between a committed Superdeterminist (SD) and a Nonlocality Defender (ND) (e.g., Bohmian/Bell/Maudlin camp).
      *   **Requirements:**
          *   Balanced argumentation (no strawmanning/dunking).
          *   SD must address the "unfalsifiable/science-ender" objection seriously.
