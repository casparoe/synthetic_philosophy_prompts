      *   **Nonlocality Defender (ND):** Let's call him *Marcus*. He represents the standard Bell/Maudlin view. He values the autonomy of experimental settings and sees SD as undermining the basis of inference. He should argue that SD makes physics *impossible* or *trivial*, not just "weird."

  3.  **Key Arguments to Cover:**
