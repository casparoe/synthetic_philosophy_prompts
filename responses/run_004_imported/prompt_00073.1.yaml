answer: |-
  Einstein submits his paper on General Relativity to the *Journal of Strict Bayesian Epistemology*. A week later, the editor calls him.

  "Albert, the derivation is elegant. But I have a problem with your confirmation claim regarding Mercury's perihelion."

  "But it fits the data perfectly!" Einstein says. "My hypothesis $H$ entails the evidence $E$."

  "I don't doubt the entailment. So $P(E|H) = 1$," the editor replies. "But when was $E$ observed?"

  "1859. Le Verrier calculated it."

  "Then at the time of your proposal, $P(E) = 1$."

  "Yes, but—"

  "Then by conditionalization, $P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} = \frac{1 \cdot P(H)}{1} = P(H)$."

  There is a silence on the line.

  "So..." Einstein says.

  "So Mercury provides zero confirmation. You are attempting to update on a certainty. Your posterior equals your prior. You've explained old news, not predicted new data."

  "But every physicist knows this confirms my theory!"

  "Perhaps psychologically. But probabilistically, you're just dividing by one. Please resubmit when you have invented time travel to propose this hypothesis before 1859. Or learn to be logically non-omniscient. We accept counterfactual ignorance, but not history."
