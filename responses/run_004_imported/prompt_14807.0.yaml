      *   **Key Philosophical Points:**
          *   *Her:* Indirect duties, cruelty wrong because of human character, dignity requires autonomy (not sentience), fear of collapsing "good-for" into "end-in-itself."
          *   *Him:* Tethered good (valuing own animality commits you to others'), answer to marginal cases (infants/disabled) without conceding the orthodox point.
      *   **Tone:** Intellectual tension, personal history, sharp but professional, wine/dinner setting.

  2.  **Character Voices & Dynamics:**
