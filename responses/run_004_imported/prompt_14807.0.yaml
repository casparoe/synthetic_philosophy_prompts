  *(Wait, one more check on Korsgaard's specific argument on marginal cases)*: In *Fellow Creatures*, she argues that we value our own humanity, but our humanity *includes* our animality. We cannot value the rational without valuing the animal that houses it. Therefore, we must value the animal nature in others. For infants/disabled: They share the *kind* of being that is an end-in-itself, or rather, the distinction between "human" and "animal" is not as sharp as Kant thought regarding the *source* of value. Actually, Korsgaard leans heavily on the idea that if pain is bad for me because I am an animal, it is bad for the dog for the same reason. The infant case is usually handled by saying they are members of a rational kind, OR by saying the *capacity for suffering* creates the duty. Julian needs to be careful not to slip into Utilitarianism. He needs to stay Kantian: It's about *valuing a nature*.

