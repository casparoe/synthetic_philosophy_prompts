      *   *Exchange 11-15 (The Marginal Cases):* The hardest philosophical hurdle. Elena brings up infants/disabled humans. Julian needs a non-evasive answer (Korsgaard's actual move is about *kind* membership or the nature of the being, but needs to be phrased carefully to avoid speciesism charges that undermine the Kantian project). *Correction:* Korsgaard's move in *Fellow Creatures* is about the *good* of the creature. If I value my own sentient nature as a source of reasons, I must value sentient nature as such. The marginal case argument usually attacks *rationality* criteria. Julian needs to argue that the *source* of value is the animal nature we share, not the rational overlay.
      *   *Exchange 16-20 (The Standoff):* Bring it back to the human element. The philosophical impasse mirrors their personal impasse. End without resolution.

  4.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Check:* Is Elena's point about "good-for" clear? Yes, she needs to argue that just because something matters to a dog doesn't make the dog a *legislator* of value.
      *   *Check:* Is Julian's answer to marginal cases strong? The standard Kantian problem is: If rationality is the bar, infants fail. If sentience is the bar, pigs get in. Korsgaard argues we value our *own* animal nature. Julian needs to say: We don't value infants because they are rational *now*, but because they are beings *for whom things can be good or bad*, and we recognize that capacity in ourselves.
      *   *Wait, a nuance:* Korsgaard argues that when we choose, we endorse our own animal nature as a source of reasons. Therefore, animal nature is the source of value. Therefore, other creatures with animal nature have ends that matter.
      *   *Elena's Counter:* That conflates *having a good* with *being an end in itself*.
      *   *Julian's Counter:* No, it recognizes the *ground* of the value.
      *   *Marginal Cases:* Elena will ask: "So an infant is an end-in-itself because it suffers?" Julian: "No, because it is a being whose nature we must respect as we respect our own."
      *   *Refinement:* Let's make sure Julian doesn't just say "species membership." That's weak Kant. He needs to stick to the *structure of valuing*.

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Start:* Clinking glasses.
      *   *Elena:* You're still chasing ghosts, Julian. Kant was clear.
