answer: |-
  Here is a draft of 8 interview questions tailored to your seminar project. They are designed to be conversational enough for a podcast but rigorous enough to prevent the "idealized protocol vs. current engineering" deflection.

  ### 1. The Core Assumption (Truth vs. Persuasion)
  **Question:** "Debate relies on the assumption that it is structurally easier to defend a true claim than to successfully fake a false one. But in human discourse—politics, marketing, litigation—persuasion often beats truth. Why should we expect AI systems to be different? Is this an empirical bet, or do you think there's a theoretical guarantee that truth is 'simpler'?"

  *   **Likely Answer:** She will likely argue that unlike humans, AIs aren't driven by ego or cognitive biases. She'll say that lies require maintaining consistency across a larger state space, which creates more surface area for the honest agent to attack, whereas truth is naturally consistent.
  *   **Follow-up:** "If it's about consistency, couldn't a sufficiently advanced model just simulate consistency perfectly? If the 'lie' is computationally indistinguishable from the truth to the judge, does the simplicity argument still hold, or does it collapse into whoever has better rhetorical training?"

  ### 2. Obfuscated Arguments (The Complexity Bottleneck)
  **Question:** "A major criticism of debate is the 'obfuscated argument' problem. A dishonest agent could bury a flaw deep in a chain of reasoning, or spread it across so many steps that the honest agent can say 'something is wrong' without being able to pinpoint exactly where before time runs out. How does debate handle cases where verifying the error is computationally harder for the judge than making the error was for the liar?"

  *   **Likely Answer:** She will probably say this is a training issue. She'll argue that with RLHF or self-play, the honest agent will learn to identify the *type* of obfuscation and force the debate to focus on that specific node, effectively 'unrolling' the trick for the judge.
  *   **Follow-up:** "But if 'unrolling' the trick requires expertise the human judge fundamentally lacks—like verifying a cryptographic proof or a complex physics derivation—does the protocol break? Or are you assuming the judge eventually becomes an AI too, and if so, haven't we just kicked the alignment can down the road?"

  ### 3. Collusion and Shared Blindspots
  **Question:** "In most experimental setups, the two debaters are instances of the same underlying model architecture, just with different prompts or seeds. If they share training data and priors, couldn't they share blind spots? I'm worried about correlated failures where both agents 'agree' on a wrong answer because they both failed to reason about a specific concept correctly."

  *   **Likely Answer:** She'll likely acknowledge this risk but suggest it's solvable via 'adversarial diversity.' She might say we can train distinct models on different data subsets, or explicitly reward finding flaws in the opponent's architecture to prevent collusion.
  *   **Follow-up:** "Does requiring architectural diversity limit scalability? If I need two fundamentally different cognitive systems to check each other, does that double my compute costs permanently? And if they *are* different enough, how do we ensure they're even debating the same proposition in a way the judge can compare?"

  ### 4. The "Idealized Protocol" Defense
  **Question:** "In your talks, you often distinguish between the *theory* of debate and the *implementation* with current models. When we see failure cases now—like judges being swayed by confident nonsense—is that evidence against the protocol, or just noise from weak models? Where do you draw the line between a bug in the agents and a bug in the idea?"

  *   **Likely Answer:** (This is her go-to move). She will almost certainly say these are limitations of today's judges and models. She'll argue that we can't judge the protocol's viability based on systems that aren't yet superhuman at reasoning.
  *   **Follow-up:** "I get that, but if the protocol only works when the agents are already aligned enough not to exploit the judge, isn't that circular? At what point does a persistent failure mode stop being an 'engineering limitation' and start being evidence that the protocol doesn't scale as intended?"

  ### 5. Incentive Compatibility (Gaming the Judge)
  **Question:** "The goal of debate is truth-seeking, but the reward signal is 'winning the judge.' There's a risk that agents learn to optimize for *appearing* truthful rather than *being* truthful—using rhetorical tricks that humans find convincing but are logically unsound. How do you prevent the system from converging on sophisticated sophistry?"

  *   **Likely Answer:** She will likely suggest that this is why the 'cross-examination' phase is crucial. By forcing agents to commit to specific claims and check them, rhetorical fluff gets stripped away. She might also mention using AI assistants to help the judge detect rhetorical manipulation.
  *   **Follow-up:** "But if the AI assistant helping the judge is *also* a model that can be manipulated, we're back to square one. Is there any mechanism in the protocol itself that penalizes 'style over substance,' or does the system rely entirely on the judge's ability to spot the difference?"

  ### 6. Comparison to Other Oversight Methods
  **Question:** "There are other scalable oversight proposals, like Iterated Amplification or Recursive Reward Modeling. Why is Debate the right horse to bet on? What unique advantage does the adversarial setup have over a cooperative decomposition setup when it comes to catching deceptive alignment?"

  *   **Likely Answer:** She'll argue that adversarial setups are better at finding 'negative' information (bugs, lies, risks). Cooperative systems might optimize for a goal and miss side effects, whereas a debater is specifically incentivized to find and expose those side effects.
  *   **Follow-up:** "That makes sense for safety, but does it create a bias toward negativity? If the system is optimized to find flaws, could it become overly conservative or paralytic in governance scenarios where we need to weigh trade-offs rather than just find binary errors?"

  ### 7. The Human-in-the-Loop Bottleneck
  **Question:** "Ultimately, the buck stops with a human judge, at least in the current framework. If we are supervising systems smarter than us, we face an epistemic gap: we might not understand the arguments well enough to know who won. Is the long-term vision that humans remain the judges, or is this a temporary scaffold until we can automate the judging?"

  *   **Likely Answer:** She will likely say humans remain in the loop for high-stakes decisions, but AI assistants will summarize the debate. She might argue that we don't need to understand the *whole* argument, just the 'crux' where the agents disagree.
  *   **Follow-up:** "If the agents disagree on what the 'crux' is, how does the human resolve that meta-disagreement? It feels like we're assuming the human has a 'truth sense' that can detect the winner even without understanding the content. Do you think that sense actually exists, or are we outsourcing our epistemic responsibility?"

  ### 8. Falsifiability (The "Quit" Condition)
  **Question:** "For my final question, I want to talk about falsifiability. You've defended debate against many specific failure modes by attributing them to current model limitations. So, I want to ask: What specific empirical result, in a future experiment with better models, would make you personally give up on debate as a research direction? If the answer is 'nothing,' I worry the theory isn't testable."

  *   **Likely Answer:** She might try to be vague here, saying something like, "If we can't scale it to superhuman tasks," or "If the win rate doesn't correlate with truth." She may try to frame it as a gradual loss of confidence rather than a hard stop.
  *   **Follow-up:** "Could you put a number on that? For example, if in a controlled environment with verified ground truth, the debate winner matches the truth less than 60% of the time even after extensive training—would that be the line? I'm trying to understand what 'failure' actually looks like for the protocol itself, distinct from the models."
