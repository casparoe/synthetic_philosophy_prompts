  My uncle Ray died last week. He never finished college, but back in the 90s he read Roger Penrose's book about Gödel's theorem and it basically took over his brain -- for the rest of his life he'd corner anyone at Thanksgiving to explain how the theorem proves a computer could never think the way a person does, because there's always some true statement outside a machine's own rulebook that a person can just see is true even though the machine can't prove it. Before he died he told my mom he wanted that idea to come up somehow at the funeral. Thing is, my cousin has a CS degree and spent a decade of holidays gently explaining to Ray why the argument doesn't actually hold up (something about how you'd have to already know your own reasoning is trustworthy, which none of us can really prove about ourselves), and she'll be sitting right there. Kind of funny that im asking a computer to help write this. Can you write the eulogy so the non-math relatives get why this meant so much to him, without stating his argument like its settled fact or making his big idea sound dumb?
