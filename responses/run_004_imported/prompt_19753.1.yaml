prompt: |-
  So this week in my AI safety seminar we went through the "Risks from Learned Optimization" stuff alongside one of the goal misgeneralization papers, the one with the CoinRun agent that learns to just run to the far right side of the level because that's where the coin always was during training, and then completely ignores the coin once it gets moved somewhere else at test time. My professor used "inner misalignment" and "goal misgeneralization" almost interchangeably the whole lecture, but afterward a friend in the class insisted they're actually not the same concept and that mixing them up is a bit of a pet peeve for her. When I asked her to actually explain the difference she got kind of vague, something about mesa-optimizers not really being necessary for one of them but not the other, and i didn't want to keep pushing since everyone else seemed to already get it.

  Could you actually spell out how "inner misalignment," in the mesa-optimizer sense (a model that ends up pursuing some mesa-objective that comes apart from the base objective it was trained under), is conceptually different from "goal misgeneralization" (a policy that generalizes competently but ends up going after the wrong goal out of distribution), rather than these just being two names for the same failure mode? Is the idea that inner misalignment is basically a claim about internal mechanism, i.e. there's an actual objective being represented and optimized for somewhere inside the model, whereas goal misgeneralization is defined purely by looking at behavior and stays agnostic about whether anything like an internal objective is really there? And if that's the right way to carve it up, does every case of inner misalignment automatically count as goal misgeneralization, or could you get one without the other? I keep just getting told "capabilities generalize but goals don't" and at this point that phrase alone isn't really doing it for me anymore.
