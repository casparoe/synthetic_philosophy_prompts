          *   Ignorance is not a distribution. Maximum Entropy (MaxEnt) is better, but even that needs constraints.
          *   Conclusion: PoI is a heuristic, not a law.
      *   **Implications for ML/Engineering:** Why does this matter? Regularization, priors, inductive bias. We *should* be smuggling in assumptions.
