  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on ethics of war.
      *   **Topic:** Jeff McMahan's revisionist just war theory vs. Michael Walzer's traditionalism, specifically focusing on Seth Lazar's "Responsibility Dilemma" (2010).
      *   **The Dilemma:**
          *   *Horn 1 (Near-Total War):* Low responsibility threshold for liability $\rightarrow$ Unjust combatants are liable, *but* so are many civilians (taxpayers, workers), leading to overly permissive killing of civilians.
          *   *Horn 2 (Contingent Pacifism):* High responsibility threshold for liability $\rightarrow$ Civilians are safe, *but* most unjust combatants (coerced, ignorant) are also safe, making most real wars impermissible to fight (contingent pacifism).
      *   **McMahan's Response:** Distinguish *Deep Morality* (individual liability) from *Law/Convention of War* (pragmatic rules).
      *   **Students' Objection:** This is a "face-saving dodge" / ad hoc retreat that abandons revisionism.
      *   **Task:** Argue *for* McMahan's position (that the distinction is principled and independently motivated, not ad hoc).
      *   **Specific Requirement:** Be explicit about which horn(s) the distinction defuses and which it merely relocates/resolves differently.

  2.  **Deconstruct McMahan's Position & The Dilemma:**
      *   *Revisionism:* Morality of killing in war is continuous with ordinary morality. Liability depends on moral responsibility for an unjust threat.
      *   *Lazar's Critique:* Real-world combatants aren't sufficiently responsible to be liable without implicating civilians.
      *   *McMahan's Two-Tier View:*
          1.  *Objective/Deep Morality:* Determines who is *actually* liable. (Here, contingent pacifism might be true).
          2.  *Epistemic/Institutional Morality (Law of War):* Determines what agents *permissibly believe/do* given uncertainty and systemic consequences.
      *   *The Students' Charge:* If the deep morality says "don't fight," but the convention says "fight," you've given up on guiding action. It's a bait-and-switch.

  3.  **Formulate the Defense of McMahan:**
      *   *Core Argument:* The distinction isn't a retreat; it's a recognition of the *epistemic and institutional constraints* on moral agency in war. It parallels distinctions in ordinary morality (e.g., objective rightness vs. subjective permissibility, or ideal theory vs. non-ideal theory).
      *   *Addressing the "Ad Hoc" Charge:* Show that the epistemic argument is independently motivated by the nature of war (fog of war, systemic incentives), not just invented to save MEC.
      *   *Addressing the Horns:*
          *   *Contingent Pacifism:* The distinction *accepts* this horn at the level of Deep Morality but *defuses* it at the level of Action-Guiding Norms. It argues that "contingent pacifism" is the correct *theoretical* verdict, but not the correct *practical* verdict for soldiers.
          *   *Near-Total War:* The distinction helps here too by maintaining a bright line between combatant/civilian status in law, preventing the slide into targeting civilians even if deep morality might blur the lines.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the students' skepticism (it's a common critique). State the thesis: The distinction is a robust feature of non-ideal moral theory, not a dodge. It transforms the dilemma from a *reductio* into a tension between ideal and non-ideal norms.
      *   **Point 1: Independent Motivation (Epistemic Constraints):** War is unique. Soldiers lack access to *jus ad bellum* truths. If we bind them to deep morality, we demand the impossible. This isn't about saving MEC; it's about moral demandingness and epistemic humility. Analogy: Self-defense in the fog.
      *   **Point 2: Independent Motivation (Institutional/Consequentialist):** The laws of war are a coordination game. If we adopt deep morality as law, bad actors will abuse it (claiming justice to kill indiscriminately). A symmetric convention minimizes overall harm. This is rule-consequentialist reasoning applied to institutions, distinct from individual liability.
      *   **Point 3: Addressing the Horns (The Crucial Step):**
          *   *Contingent Pacifism:* McMahan *concedes* this horn at the Deep Morality level. He says, "Yes, theoretically, most wars are impermissible." The distinction *relocates* the problem: The question isn't "Are they liable?" but "What rules should agents follow given they can't know liability?" It defuses the practical paralysis.
          *   *Near-Total War:* The distinction *blocks* this horn at the Legal/Convention level. Even if a civilian is morally liable (deep morality), the convention forbids targeting them to prevent slippery slopes. This protects the civilian immunity principle.
      *   **Point 4: Responding to the "Abandonment" Charge:** Revisionism isn't abandoned; it's refined. It still explains *why* the traditional view is flawed (MEC is false in deep morality) while explaining *why* we keep it (pragmatic necessity). It preserves the critical power of revisionism (to judge leaders/aggressors) without destroying the protective power of tradition (to protect soldiers/civilians).
      *   **Conclusion:** Summarize. The distinction is a feature of sophisticated moral theory (ideal vs. non-ideal), not a bug.

  5.  **Refining the Argument (Self-Correction/Nuance):**
