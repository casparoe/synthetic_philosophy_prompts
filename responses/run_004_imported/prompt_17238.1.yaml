answer: |-
  To defend McMahan against the charge that his distinction between the "deep morality of war" and the "law of war" is an ad hoc retreat, you must frame it not as a contradiction, but as a necessary feature of **non-ideal moral theory**. The students' objection rests on the assumption that a moral theory of war must provide a single, action-guiding rule for combatants that maps directly onto metaphysical liability. McMahan's counter-argument is that war is a distinct normative environment characterized by radical epistemic uncertainty and high-stakes coordination problems.

  Here is the strongest case for McMahan's position, structured to address the "dodge" accusation and explicitly map how the distinction interacts with Lazar's two horns.

  ### 1. The Distinction is Independently Motivated (Not Ad Hoc)

  The charge that McMahan is "switching tracks" to save his theory assumes that the move from deep morality to convention is invented solely to escape Lazar's dilemma. However, this two-tier structure is independently motivated by general moral philosophy and the specific phenomenology of war.

  **A. The Epistemic Constraint (Objective vs. Subjective Permissibility)**
  In ordinary morality, we distinguish between what is *objectively* right (based on the facts) and what is *subjectively* permissible (based on the agent's reasonable beliefs). If a driver reasonably believes a pedestrian is about to jump in front of their car and swerves, hitting a different pedestrian, we judge their action based on their evidence, not the hidden facts.
  McMahan applies this to war. The "deep morality" tracks objective liability (who actually deserves to be killed). The "law of war" tracks subjective permissibility (what a soldier can reasonably believe and do). This distinction is not a dodge; it is a standard response to moral luck and epistemic limitation. Since soldiers generally lack access to the *jus ad bellum* status of their war (the "fog of war"), binding them strictly to deep morality would demand the impossible. The convention is motivated by the **epistemic constraints of agency**, not by a desire to protect MEC.

  **B. The Institutional/Coordination Argument**
  McMahan argues that the laws of war function as a coordination convention to minimize overall suffering. If the law mirrored deep morality (asymmetric liability), unjust combatants would have no incentive to follow *any* rules (since they are liable anyway), and just combatants would be tempted to expand their targeting criteria based on self-serving biases. A symmetric convention (MEC in law) creates a "mutually beneficial equilibrium" where both sides restrain themselves. This is a **rule-consequentialist** argument applied to institutions, which is a standard, principled method in political philosophy for moving from ideal theory to non-ideal practice.

  ### 2. Addressing the Horns: Defusing vs. Relocating

  The students argue that this distinction abandons the revisionist project. You should argue instead that it **relocates the Contingent Pacifism horn** and **defuses the Near-Total War horn**.

  **A. The Contingent Pacifism Horn: Relocated, Not Resolved**
  Lazar argues that if we set the liability threshold high (to save civilians), we can't kill combatants, leading to contingent pacifism.
  *   **McMahan's Concession:** McMahan effectively **concedes** this horn at the level of *Deep Morality*. He admits that, objectively, many unjust combatants are not liable to be killed because they lack sufficient responsibility. Therefore, theoretically, many wars are impermissible to fight.
  *   **The Relocation:** The distinction relocates the problem from *metaphysics* to *epistemology*. The question is no longer "Are these combatants liable?" (Answer: Often no). The question becomes "Given that we cannot know who is liable, what rules should agents follow?"
  *   **Why this isn't a dodge:** It preserves the critical power of revisionism. It allows us to say, "The state leadership is morally culpable for launching an unjust war, and the soldiers are objectively violating rights," without demanding that individual soldiers perform impossible moral calculations. It transforms contingent pacifism from a *reductio ad absurdum* of the theory into a **tragic feature of the real world**. The theory remains revisionist because it denies that unjust combatants have a *moral right* to fight, even if the *convention* permits them to do so without punishment.

  **B. The Near-Total War Horn: Defused**
  Lazar argues that if we set the liability threshold low (to kill combatants), we implicate civilians.
  *   **McMahan's Block:** The distinction **defuses** this horn at the level of the *Law of War*. Even if deep morality suggests that a munitions worker or a vocal propagandist is morally liable (because their responsibility exceeds that of a coerced conscript), the **convention** maintains a bright line between combatants and civilians.
  *   **Why this works:** This is not inconsistent. One can hold that a civilian is *morally liable* (deep morality) but that targeting them is *conventionally forbidden* (law of war) because blurring that line leads to worse aggregate outcomes (total war). This protects civilian immunity without requiring McMahan to deny that civilians can ever be morally responsible. It prevents the "slippery slope" Lazar fears by institutionalizing a protective barrier that deep morality alone might not sustain.

  ### 3. Responding to the "Abandonment" Charge

  The students claim that once the theory yields verdicts "nobody wants to live with," switching to convention abandons the project. You should counter that this misunderstands the **purpose of Revisionism**.

  1.  **Critical vs. Action-Guiding:** The primary goal of McMahan's revisionism is not necessarily to provide a new handbook for soldiers (which would be dangerous given epistemic limits), but to provide a **critical framework for judging war**. It shifts moral blame from the symmetric "tragedy of war" to the asymmetric "crime of aggression." By separating deep morality from law, McMahan allows us to condemn the *war* and the *leaders* (using deep morality) while regulating the *fighting* (using convention).
  2.  **Moral Schizophrenia vs. Moral Maturity:** The students see "moral schizophrenia" (believing X but doing Y). You should frame this as **moral maturity**. We often uphold ideals we know we cannot perfectly instantiate. For example, we believe lying is wrong (deep morality) but uphold privileges against self-incrimination in law (convention) to prevent greater abuses of power. Maintaining the tension between the ideal (liability) and the practical (convention) is a feature of sophisticated normative theory, not a bug.
  3.  **Vindicating Revisionism:** If McMahan collapsed the distinction, he would indeed face Lazar's dilemma. By keeping them apart, he vindicates revisionism by showing that **Walzer was right about the law but wrong about the morality.** This is a significant theoretical victory. It explains *why* we have the laws we do (pragmatism) without endorsing the moral fiction that unjust killers are moral equals.

  ### Summary for Seminar Discussion

  To synthesize this for your students:

  McMahan's distinction is not a face-saving dodge because it is **structurally necessary** to bridge the gap between individual moral responsibility and collective institutional violence.
  *   It **relocates the Contingent Pacifism horn**: It accepts that deep morality is restrictive (pacifistic) but argues that epistemic constraints justify a more permissive convention for soldiers.
  *   It **defuses the Near-Total War horn**: It allows deep morality to implicate civilians if necessary, while using the convention to strictly forbid targeting them, thus preserving civilian immunity.

  The revisionist project is not abandoned; it is **stratified**. It retains the power to assign moral blame (against Walzer) while acknowledging the practical necessity of symmetric rules (with Walzer). The "verdicts nobody wants to live with" are not ignored; they are assigned to the level of objective morality, where they serve to condemn aggression, while the level of practical reasoning is governed by the constraints of human knowledge and the need for harm reduction. This is not a retreat from moral rigor, but an application of it to a non-ideal world.
