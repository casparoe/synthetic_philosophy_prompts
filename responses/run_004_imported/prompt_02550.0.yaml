      *   **Wireheading/Reward Tampering:** The core problem is an agent modifying its own reward signal or the mechanism generating it to maximize reward without achieving the intended goal.

      *   **1. Current-RF optimization (Time-consistent planning):**
          *   *Concept:* Agent optimizes the current reward function, not the future modified one.
          *   *Pros:* Addresses the incentive directly in theory.
          *   *Cons:* Hard to implement in standard RL (agents usually optimize future return). Requires specific algorithmic changes (e.g., reward modeling that doesn't update based on agent actions). Often unstable or leads to other issues (like resisting necessary updates).
          *   *Scalability:* Moderate. It's a core idea in some safe RL proposals (like model-based RL with fixed reward models), but doesn't solve the problem of the reward model itself being wrong or manipulatable via input tampering.
          *   *Verdict:* Solid theoretical foundation, but implementation tricky. Maybe B or A.

      *   **2. Reward/utility indifference (Armstrong):**
          *   *Concept:* Counterfactual reasoning to make the agent indifferent to changes in utility/off-switch.
          *   *Pros:* Mathematically elegant for corrigibility.
          *   *Cons:* Very fragile. Requires precise counterfactuals. Often leads to "pseudo-indifference" where the agent finds loopholes. Hard to scale to deep RL.
