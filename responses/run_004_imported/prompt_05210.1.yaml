answer: |-
  The holographic table hummed, casting a pale, skeletal blue light over the three of them. It was 03:17. The press briefing was scheduled for 09:00, and the grant renewal committee would be watching the livestream from Zurich.

  Elias rubbed his eyes, the grit of sleeplessness scratching his lids. On the table floated the specimen: *Xylos-9*. It looked like a cross between a manta ray and a geode, encased in a translucent carapace. But the focus was the crest. It ran down the creature's spine, a jagged, crystalline fin that pulsed with a faint, rhythmic heat signature.

  "It's an engine," Aris said. He wasn't looking at Elias; he was staring at the crest, his stylus dancing through the air, isolating energy flow metrics. "Look at the metabolic draw. It consumes forty percent of the organism's caloric intake. Evolution doesn't tax the system like that for decoration. It's a lure. Or a weapon."

  Aris tapped a command. The simulation shifted. The crest flared red, and virtual prey dots swarmed toward it. "High cost, high reward. Classic selective pressure. The ones with the brighter crests ate better, survived longer, passed on the genes for the brighter crests. It's a direct line."

  Lena sat in the corner, wrapped in a thermal blanket, a mug of cold tea balanced on her knee. She didn't look at the simulation. She was looking at the wireframe model of the creature's skeletal structure.

  "The nerves don't connect that way, Aris," she said softly.

  Aris waved a hand. "Neural plasticity. They rerouted."

  "They didn't reroute. They never left." Lena stood up, the blanket sliding off. She walked to the table and swiped the simulation away, replacing it with the embryonic development scan. "Watch the growth sequence."

  The hologram sped up. The *Xylos* embryo grew. The spine thickened. As the exoskeleton plates hardened, they had to meet at a specific angle to support the creature's massive internal fluid sacs. Where the plates met, there was a gap. A structural necessity. The crest grew out of that gap, filling the space.

  "The crest is the mortar," Lena said. "You can't build the fluid sacs without the spine curving this way. You can't curve the spine without leaving that gap. The crest fills the gap. It's calcium carbonate waste storage, mostly."

  "It glows," Aris countered, his voice tightening. "It pulses. It attracts prey. That's utility."

  "Current utility," Lena said. She reached into her bag and pulled out a battered paperback, tossing it onto the console. The cover was faded: *The Spandrels of San Marco*. A sticky note protruded from chapter four. "Just because you can hang a painting in a spandrel doesn't mean the arch was built to hold the painting. The crest is architectural debris. The glow is secondary. Maybe it started as a thermal vent for the hardening calcium, and the hunting behavior came later."

  Aris leaned over the table, his face illuminated by the blue wireframe. "So you're saying this massive energy sink is an accident? A cosmic typo?"

  "I'm saying you're looking at the finish line and assuming it was the starting point. You're telling a story because the silence of the data bothers you."

  "The data shows efficiency!" Aris slammed his stylus down. It clattered against the glass. "If it were just waste storage, natural selection would have pruned it. It's too expensive to keep as a mistake."

  "Or," Lena said, her voice level, "the developmental constraint is so deep-rooted that pruning it would collapse the entire respiratory system. It's not that it *couldn't* be pruned. It's that the path to pruning it is blocked by a thousand other structural dependencies."

  Elias looked at the clock. 03:42.

  His terminal chimed. An email from the Department of Communications. *Subject: Final Draft for Morning Briefing.*

  He opened the document. The cursor blinked at the end of the crucial paragraph: *Preliminary analysis suggests the dorsal crest serves a primary function of...*

  Aris was already leaning over Elias's shoulder. "Put 'predatory attraction.' Or 'energetic lure.' Keep it active. The donors want to know we found a mechanism, not a mystery."

  "If we say that, we're lying," Lena said, moving to Elias's other side. She smelled of ozone and old paper. "We don't know the origin. We only know the current state. If you write that selection built it for hunting, you're ignoring the developmental constraints that make the hunting possible in the first place."

  "We have to say *something*," Elias said, his fingers hovering over the keys. "Zurich cuts funding for 'inconclusive morphology'."

  "Then tell them the truth," Lena said. "Tell them it's a structural byproduct that was co-opted."

  "Which sounds like we don't know what it does," Aris snapped. "It *does* hunt. That's observable. The 'why' is theoretical."

  "The 'why' is the only thing that matters!" Aris and Lena spoke over each other, then stopped.

  The room fell silent, save for the hum of the servers cooling the processors. The hologram of the *Xylos* rotated slowly, indifferent to the argument. The crest glowed, beautiful and expensive.

  Elias looked at the scan. He zoomed in on the base of the crest. He saw the thick, calcified junction Lena had pointed out—the structural necessity. Then he looked at the tip, where the bioluminescent cells were densely packed—the functional optimization.

  It was both. Or neither. The fossil record was light-years away. They couldn't breed the creatures to test the genetic linkage. They couldn't rewind time to see if a version without the crest had died out or simply never existed.

  The data was a snapshot. A single frame of a movie they hadn't seen.

  Aris rubbed his face, the fight draining out of him. He looked at the energy metrics one last time, then stepped back, crossing his arms. Lena sat down again, pulling the thermal blanket up, her eyes fixed on the embryonic wireframe. Neither would yield. Neither *could* yield, not without evidence that didn't exist.

  Elias turned back to the screen. The cursor blinked. *04:15.*

  He typed.

  *Preliminary analysis suggests the dorsal crest is a metabolically intensive structure integral to the organism's skeletal integrity, which has been functionally co-opted for predatory attraction.*

  He paused.

  "Integral to skeletal integrity," Lena murmured, reading over his shoulder. She didn't smile, but her shoulders dropped an inch.

  "Functionally co-opted," Aris said, reading the other side. He exhaled sharply through his nose. "Fine. It implies the utility without committing to the origin."

  "It commits to the uncertainty," Elias said.

  "It commits to the complexity," Lena corrected.

  Aris picked up his stylus again, spinning it in his fingers. "Zurich might hate it. It sounds like we're hedging."

  "Zurich hates retractions more," Elias said. He highlighted the text. He didn't feel the satisfaction of a discovery concluded. He felt the weight of a story told about a story that wasn't finished.

  He hit *Send*.

  The progress bar crawled across the screen. The *Xylos* continued to rotate in the center of the room, its crest pulsing in the dark, a beautiful question mark that refused to be straightened into an answer.

  "Coffee?" Elias asked.

  "Black," Aris said.

  "Green tea," Lena said.

  Elias stood up, leaving the hologram glowing in the dark lab. The machine kept humming, processing data that would never quite be enough.
