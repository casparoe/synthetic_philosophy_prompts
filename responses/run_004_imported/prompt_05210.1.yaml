      *   Kovic says it's a result of the exoskeleton hardening pattern (constraint).
      *   Elias has to write the headline.

  10. **Final Polish:**
      *   Check the pacing.
      *   Ensure the "nothing can decisively settle the question" theme lands.
      *   Make sure the Gould/Lewontin reference feels organic. (Maybe a book on the desk).

