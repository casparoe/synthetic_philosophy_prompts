          *   *The "Don't Die" Slogan:* This is the biggest red flag for Nietzsche. *Amor Fati* means loving the end of life too. The fear of death drives the optimization. Nietzsche calls this "decadence" or the "instinct of self-preservation" gone wrong. It's a "No" to life's transience.
          *   *Pleasure and Instinct:* Nietzsche enjoyed wine (later quit), walked for hours, valued the feeling of vitality. Johnson's regimen is often ascetic (no pleasure eating). Nietzsche distinguishes between *asceticism for power* vs. *asceticism out of fear*. Johnson feels like fear.

