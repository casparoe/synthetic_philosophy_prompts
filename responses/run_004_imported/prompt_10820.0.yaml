      *   **Move 5 (Elena):** Claims unsound algorithmic output isn't "knowledge" (violates factivity). It changes the subject.
          *   *Analysis:* This is a philosophical stance vs. a CS modeling stance. In epistemology, knowledge is factive. In distributed systems (FHMV's target), we often care about what the system *acts* on. FHMV acknowledge this tension. Elena is right about the *word* "knowledge," but Marcus is right about the *modeling goal*. However, strictly speaking, if you drop factivity, you are modeling *belief*, not knowledge. FHMV usually distinguish $K_i$ (true knowledge) from algorithmic output. If Marcus calls the algorithmic output "knowledge" without qualification, Elena has a point about terminology. But FHMV do use the term "algorithmic knowledge."
