      *   **Move 4 (Marcus):** Claims "Algorithmic Knowledge" solves this by allowing unsound algorithms (non-factive).
          *   *Analysis:* FHMV explicitly discuss this. Algorithmic knowledge ($X_i \phi$) depends on the algorithm's output. If the algorithm is unsound, $X_i \phi$ can hold while $\phi$ is false. This models "computed knowledge" rather than "true knowledge."
