      *   **Move 6 (Marcus):** Claims *all* fixes change the subject, including the original semantics (closure properties). So Elena can't selectively object.
          *   *Analysis:* This is a strong meta-argument. Standard possible-worlds semantics *already* idealizes "knowledge" beyond ordinary usage (no one is closed under consequence). So objecting that algorithmic knowledge isn't "ordinary knowledge" ignores that standard Kripke knowledge isn't either. This is a very strong point in the context of FHMV.
