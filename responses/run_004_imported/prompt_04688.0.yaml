  ### The Logic Behind the Tiers

  **S Tier (Escapes the Circle):**
  *   **Territorial/Residency & Nationality:** These are the only two that anchor the boundary in **pre-political facts** (geography or ethnic/cultural identity) rather than democratic will. They stop the regress by saying the boundary isn't up for a vote; it's a fact you discover. They solve the logical puzzle by refusing to make it a democratic question.

  **A Tier (Strong Attempt, Some Fuzziness):**
  *   **Stakeholder:** Baubock tries to ground membership in social facts (integration, future orientation) rather than legal status. It escapes the circle better than most because "stake" is arguably observable, but determining who has a "genuine stake" still requires normative interpretation by an existing authority.

  **B Tier (Pushes the Circle Back One Step):**
  *   **All-subjected:** Sounds solid, but to know who is "subject to coercion," you first need to know the scope of the legal jurisdiction. Defining the jurisdiction *is* the boundary problem. It assumes the authority's reach before defining the people.

  **C Tier (Logically Indeterminate):**
  *   **All-affected:** This creates an infinite regress. To know who is affected, you need to know the outcome of the decision. But the outcome depends on who votes. Also, almost everyone is affected by something eventually (cascade effects), making the boundary infinitely expandable.

  **F Tier (The Circle Itself):**
  *   **Existing Citizens:** This isn't a solution; it's the problem statement. As Whelan and Jennings noted, this accepts the circularity as a practical necessity rather than solving the logical puzzle. It says "the circle is the feature, not the bug."
