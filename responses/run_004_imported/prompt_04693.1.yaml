  2.  **Deconstruct Question 1: The Grounding Objection (Precise Formulation):**
      *   *The Intuition:* Truth requires a truth-maker (ground).
      *   *The Problem:* CCFs (Counterfactuals of Creaturely Freedom) are contingent (not true in all possible worlds) but pre-volitional (true before God decides to create).
      *   *The Missing Ground:*
          *   Not God's will (that would make them necessary or determined).
