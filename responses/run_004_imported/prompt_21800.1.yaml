answer: |-
  This is a fantastic deep dive. You are absolutely right to be suspicious of the "ancient sophists were silly" take. The *Bai Ma Lun* (White Horse Dialogue) is one of the most sophisticated texts in pre-Qing Chinese philosophy, and the School of Names (*Ming Jia*) was grappling with problems of reference, semantics, and ontology that wouldn't show up in the West until the Stoics, Scholastics, or even Frege.

  To answer your core question: **No, these are not just repackaged equivocations.** They are distinct arguments attacking the problem from three different layers of semantic analysis: **Intension** (meaning), **Extension/Pragmatics** (reference conditions), and **Metaphysics** (universals).

  However, your suspicion about the "is" is also correct. The "trick" (or the philosophical thesis, depending on your charity) lies in forcing an **identity** reading onto a **predication/class-inclusion** statement.

  Here is the steelman of the logical work being done, followed by the diagnosis of where the sleight-of-hand happens.

  ---

  ### The Steelman: Three Distinct Arguments

  You identified three chunks. Let's map them to modern semantic concepts to see the distinct work they are doing.

  #### 1. The Shape/Color Argument (Intension)
  > *"Horse" is what we use to name a shape. "White" is what we use to name a color. Naming a color is not naming a shape. So a white horse is not a horse.*

  *   **The Thesis:** This is an argument about **Conceptual Identity (Intension)**.
  *   **The Logic:** The concept `HORSE` denotes the set of properties {shape: equine}. The concept `WHITE` denotes {color: white}. The concept `WHITE HORSE` denotes {shape: equine, color: white}.
  *   **The Claim:** Since `{equine, white}` $\neq$ `{equine}`, the *concept* "White Horse" is not identical to the *concept* "Horse".
  *   **Why it's not just wordplay:** If you treat terms as definitions, Gongsun Long is right. The definition of "white horse" contains more semantic information than "horse". If "is" means "is conceptually identical to," then "White Horse is Horse" is false. This anticipates the distinction between **Sense** (Sinn) and **Reference** (Bedeutung). The Sense differs, even if the Reference overlaps.

  #### 2. The Seeking Argument (Extension/Pragmatics)
  > *If a man wants a horse, a yellow or a black horse will answer his want. If he wants a white horse, a yellow or black horse will not answer it... So a white horse is not a horse.*

  *   **The Thesis:** This is an argument about **Truth Conditions / Satisfaction Conditions**.
  *   **The Logic:** This invokes a version of **Leibniz's Law** (Indiscernibility of Identicals). If $A = B$, then $A$ and $B$ must behave identically in all contexts.
      *   Context: "Satisfying a request for X."
      *   Test: A black horse satisfies "Request for Horse."
      *   Test: A black horse does *not* satisfy "Request for White Horse."
      *   Conclusion: "Request for Horse" $\neq$ "Request for White Horse."
  *   **Why it's distinct from Arg 1:** Argument 1 was about the *definition* of the words. Argument 2 is about the *use* of the words in a functional context. It shows that the two terms carve out different logical spaces of acceptance. It proves that the *extension* of the demand is different, even if the object provided is physically the same type of animal.

  #### 3. The Bare Universal Argument (Metaphysics)
  > *"Horse" gets treated like some bare colorless universal that "white" then attaches to... "White horse" is "horse" joined to "white," and horse-joined-to-white isn't just "horse".*

  *   **The Thesis:** This is an argument about **Ontological Commitment**.
  *   **The Logic:** Gongsun is reifying the term "Horse." He is arguing that the term `HORSE` refers to a **Universal** (Horseness), which is abstract and indeterminate. A concrete white horse is a **Particular** (Horseness + Whiteness).
  *   **The Claim:** The Abstract Universal cannot be identical to the Determined Particular. The universal "Horse" has no color. The particular "White Horse" has color. Therefore, they are not the same ontological category.
  *   **Why it's distinct:** This moves beyond language (Args 1 & 2) into metaphysics. It claims that "Horse" (the universal) literally does not exist in the world; only colored horses exist. Therefore, when you point to a white horse, you are pointing to a composite entity, not the simple universal "Horse."

  ---

  ### The Diagnosis: Where the "Equivocation" Hides

  So, is it defensible? **Yes, but only if you accept his premises about what "is" means.**

  The friction you feel comes from the fact that natural language uses "is" to do at least three different jobs, and Gongsun Long forces them all to mean **Strict Identity**.

  1.  **The "Is" of Class Inclusion ($\subset$):** "A white horse is a horse."
      *   *Meaning:* The set of white horses is a subset of the set of horses.
      *   *Truth Value:* True.
      *   *Gongsun's Move:* He rejects this reading. He argues that because the *concepts* differ (Arg 1) and the *conditions* differ (Arg 2), the subset relation doesn't grant identity.

  2.  **The "Is" of Identity ($=$):** "Clark Kent is Superman."
      *   *Meaning:* These two terms refer to the exact same entity with no difference in properties or description.
      *   *Truth Value:* False (for White Horse vs. Horse).
      *   *Gongsun's Move:* He insists this is the only valid logical reading. If "White Horse" were truly "Horse," then adding "White" would change nothing. Since adding "White" changes the satisfaction conditions, they are not identical.

  3.  **The "Is" of Predication:** "The horse is white."
      *   *Meaning:* The object 'horse' has the property 'white'.
      *   *Gongsun's Move:* In Argument 3, he treats "Horse" as a substance that *lacks* color until "White" is added. This is the most controversial move.

  #### The Critical Weak Point (The "Gotcha")

  The place where the argument is most vulnerable (and where you suspected he might be begging the question) is **Argument 3**.

  Gongsun assumes that the term "Horse" refers to a **colorless universal**.
  *   **Objection:** Why must "Horse" refer to a colorless universal? Why can't "Horse" refer to the *class of all concrete horses*, regardless of color?
  *   **The Circularity:** If "Horse" means "the class of all horses," then a white horse *is* a member of that class. By defining "Horse" as "the abstract shape without color," he rigs the game so that "White Horse" (shape + color) cannot equal "Horse" (shape only).
  *   **Diagnosis:** He is conflating the **Map** (the term/concept) with the **Territory** (the object).
      *   In the Territory: A white horse is physically a horse.
      *   In the Map: The label "White Horse" is not the same label as "Horse."
      *   Gongsun treats the Map distinction as if it negates the Territory reality.

  ### The Verdict: Is it Wordplay or Logic?

  It is **rigorous logic applied to a counter-intuitive premise.**

  It is not *just* wordplay because it successfully exposes a genuine ambiguity in how we use language. We slide between talking about **words** (concepts) and **things** (objects) constantly.
  *   When we say "A white horse is a horse," we are usually talking about **objects** (Extension).
  *   When Gongsun says "A white horse is not a horse," he is talking about **concepts** (Intension).

  **The Steelman Summary:**
  Gongsun Long is arguing for **Semantic Non-Identity**. He is claiming that `Concept(A + B)` is never identical to `Concept(A)`. Therefore, any statement claiming they "are" the same is strictly false if "is" denotes identity. He is forcing us to acknowledge that modification changes the *essence* of the term, even if it doesn't exclude the object from the broader class.

  **The Diagnosis Summary:**
  The argument "fails" (in terms of common sense) only because it prioritizes **Intensional Identity** over **Extensional Inclusion**. It goes wrong if you believe language is primarily for tracking objects in the world (where subset relations matter). It succeeds if you believe language is primarily for tracking precise conceptual distinctions (where definition matters).

  You stumbled onto one of the earliest examples of **Analytic Philosophy** in human history. The School of Names wasn't trying to be silly; they were trying to rectify names (*zheng ming*) to ensure social and political order, believing that confusion about "is" leads to confusion about duty, law, and reality. Gongsun Long is essentially saying: *"If you can't distinguish the concept of a specific mandate from a general mandate, you will govern poorly."*

  So, keep ratholing. You're in good company. This text baffled commentators for 2,000 years for exactly the reasons you're grappling with.
