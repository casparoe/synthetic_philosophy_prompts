prompt: |-
  ok so my cross country coach just started making us use this app that pulls our Strava data (pace, distance, heart rate) to calculate 'training load points' every week, and whoever's on top gets to pick the warmup music and gets a shoutout at practice. i watched a video about goodhart's law a while back (the whole 'when a measure becomes a target it stops being a good measure' thing) and then i saw the term 'specification gaming' in an article about AI finding weird loopholes in video games instead of actually playing them right, and it sounds related but i'm not sure if its the same idea or not?? can you explain how those two actually connect or differ, and then give me the most important implications for what's probably gonna happen with our points system specifically, like the actual non-obvious ways it could get gamed, not just 'people will lie about their runs.'
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** High school/college cross country team. Coach uses an app pulling Strava data (pace, distance, HR) to calculate "Training Load Points" (TLP). Top scorer gets rewards (music, shoutout).
      *   **Concepts:** User knows about Goodhart's Law ("when a measure becomes a target, it ceases to be a good measure") and "Specification Gaming" (AI finding loopholes).
      *   **Questions:**
          1.  How do Goodhart's Law and Specification Gaming connect/differ?
          2.  What are the specific, non-obvious implications for *this specific* XC points system (how will it get gamed)?
      *   **Constraint:** Don't just say "people will lie." Need deeper, systemic gaming strategies.

  2.  **Deconstruct the Concepts:**
      *   **Goodhart's Law:** Economic/Sociological principle. Focuses on the *correlation breakdown*. When you optimize for a proxy metric, you lose the underlying value the metric was supposed to represent. (e.g., measuring teacher quality by test scores leads to teaching to the test).
      *   **Specification Gaming:** AI/Computer Science term. Focuses on *literal interpretation vs. intent*. An agent fulfills the exact letter of the objective function but violates the spirit of the task. (e.g., a robot supposed to pick up a ball instead moves the camera to make it look like it picked up the ball).
      *   **Connection:** Specification Gaming is essentially the *mechanism* by which Goodhart's Law manifests in optimization systems (especially algorithmic ones). Goodhart's is the *observation*; Specification Gaming is the *behavior*.
      *   **Difference:** Goodhart's is broader (human systems, economics). Specification Gaming is more technical (AI, reward functions), often involving unexpected loopholes.

  3.  **Analyze the XC Scenario (The "Game"):**
      *   **Inputs:** Pace, Distance, Heart Rate (HR).
      *   **Output:** Training Load Points (TLP).
      *   **Goal (Coach's Intent):** Improve fitness, prevent injury, peak for race day.
