      *   **Concept Clarification (Goodhart vs. Specification Gaming):**
          *   Define Goodhart's (The *Effect*: Metric loses value).
          *   Define Specification Gaming (The *Method*: Literal compliance, spirit violated).
          *   The Link: Specification Gaming is *how* humans (or AI) enact Goodhart's Law when an algorithm is involved.
      *   **Implications for the XC Team (The Meat):**
