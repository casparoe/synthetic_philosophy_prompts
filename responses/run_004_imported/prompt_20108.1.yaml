  2.  **Deconstruct Hobbes's Argument (Chapter 4 of *Leviathan*):**
      *   *Nominalism:* Hobbes believes universal concepts don't exist in reality; only names exist. Truth is a property of language (propositions), not things.
      *   *Geometry's Status:* For Hobbes, geometry is the only "science" (in the strict sense of *scientia*, certain knowledge) because it deals with figures we construct ourselves. We define the line, the circle, the point. We don't discover them in nature; we create them by fiat.
      *   *Physics/Theology:* These deal with things outside our control. We can't define "gravity" or "God" with the same certainty because we don't create the referents. We are observing, not constructing.
      *   *The Method:* Define -> Deduce. If definitions are clear and agreed upon, the conclusions are inescapable.

  3.  **Address Question 1: Why Geometry?**
      *   *Constructionism:* We make the objects of geometry. A circle is what I say it is.
      *   *Causality:* In geometry, we know the cause of the figure because we drew it. In physics, we guess at causes.
      *   *Certainty:* Because we define the terms, the deductions are necessary. In other fields, definitions are contested or refer to messy reality.

  4.  **Address Question 2: Nominalism & Trustworthy Definitions:**
      *   Connect the "names" idea to geometry. Since truth is about names, geometry is the perfect arena because we control the names *and* the things they stand for.
      *   In physics, the name "stone" refers to something independent. In geometry, "triangle" refers to something dependent on our definition.
      *   This makes geometrical truth "conditional" but certain *if* the premises hold.

  5.  **Address Question 3: Politics "Geometrically":**
      *   *The Ambition:* Hobbes wants to do for the Commonwealth what Euclid did for lines. Define "Man," "Right," "Law," "Covenant" -> Deduce the necessity of the Sovereign.
      *   *Does it work?*
          *   *Success:* It creates a rigorous internal logic. It was revolutionary for political science (trying to make it a science).
          *   *Failure:* The definitions are often loaded or empirical claims disguised as definitions. (e.g., defining "freedom" as merely the absence of external impediment). People don't agree on the axioms of politics like they (theoretically) do in geometry.
          *   *Scholarly Consensus:* It's a brilliant *attempt*, but most agree he doesn't achieve geometric certainty. The "messiness" of human passion breaks the model.

  6.  **Address Question 4: The Wallis/Squaring the Circle Debacle:**
      *   *The Story:* Hobbes spent decades trying to square the circle. John Wallis (mathematician) proved it impossible (transcendental number pi) and publicly humiliated Hobbes.
      *   *Timing:* *Leviathan* (1651) vs. The Quadrature controversy (mostly 1650s-1670s).
      *   *Relevance:* *Leviathan* comes *before* the worst of the public humiliation, though his obsession started early.
      *   *Interpretation:* Historians see it as tragic irony. He championed geometry as the gold standard of reason, but his own geometric reasoning was flawed by pride and lack of technical skill. It undermines his *personal* authority but highlights his *philosophical* commitment to the method. It shows he believed in the method so much he thought he could solve unsolvable problems with it.

