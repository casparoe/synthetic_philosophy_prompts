      *   If I deposit \$1, withdraw \$1, deposit \$1... the balance oscillates.
      *   If I deposit \$1, deposit \$1, withdraw \$1... the balance grows.
      *   *Crucial Point:* In a finite world, the order of addition doesn't matter ($a+b = b+a$). In an infinite world, there is no "end" to finish the sum, so the "path" taken to get there defines the result.
      *   *Spatial vs. Temporal:* In ethics, people aren't usually lined up in a queue. They exist "all at once." So, which order do we sum them in? Spatial proximity? Time of birth? Arbitrary indexing? If the sum depends on this arbitrary indexing, the moral value of the world depends on something morally irrelevant.

  4.  **Drafting the Explanation - Step 2: Order-Dependence vs. Infinitarian Paralysis:**
      *   *Infinitarian Paralysis:*
          *   World A: $\infty$ good.
          *   World B: $\infty$ good + 1 unit.
          *   Comparison: $\infty = \infty$.
          *   Implication: We can't distinguish worlds, but maybe we can use a "spatiotemporal" expansion (like Vallentyne & Kagan) to say the *local* change matters. Or we accept paralysis. It's a problem of *insensitivity*.
      *   *Order-Dependence (The "Riemann" Problem):*
          *   World A: Same set of people/welfare values.
          *   Summation Method 1: Total = $+\infty$.
          *   Summation Method 2: Total = $-\infty$.
          *   Summation Method 3: Total = $0$.
          *   Implication: The *same world* has contradictory moral values depending on how we count. This isn't just insensitivity; it's *incoherence*. It violates the idea that the value of a state of affairs should be intrinsic to that state, not dependent on the observer's counting method.
      *   *Why it's deeper:* Paralysis says "we can't measure the difference." Order-dependence says "the measurement itself is broken." Paralysis might be solved by looking at finite differences (expansionism). Order-dependence attacks the very definition of the sum.

  5.  **Refining the Intuition (The "Genuine Feature" aspect):**
      *   Why isn't this just math weirdness? Because ethics requires a *unique* verdict. If I have to choose between World A and World B, I need to know which is better.
