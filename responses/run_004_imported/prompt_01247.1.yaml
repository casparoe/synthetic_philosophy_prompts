answer: |-
  The coffee is warm. That is the first datum. The ceramic mug radiates heat into my palms, a specific, transferable energy that feels undeniable. I am sitting at my desk. The screen glows with a cursor blinking in a steady, rhythmic pulse. One second on, one second off. I have written three paragraphs of an article about the heat death of the universe.

  I remember interviewing the physicist who told me about this. He was eating a sandwich, mayonnaise leaking onto a napkin. He said that if the vacuum energy remains constant, if the universe expands into an eternal de Sitter phase, then equilibrium is the end state. But equilibrium isn't static. It fluctuates. Given enough time—timescales so vast they make the current age of the universe look like a Planck time—random thermal fluctuations will assemble particles into conscious configurations.

  It is entropically cheaper to fluctuate a single brain into existence, complete with false memories of a life, than to fluctuate an entire cosmos containing billions of years of evolutionary history.

  I look at my hands. They are freckled. There is a scar on the left thumb from a kitchen knife three years ago. I remember the blood, the sting, the bandage. But memory is just information stored in a substrate. A fluctuation doesn't need the knife; it only needs the memory of the knife. To create the scar is cheap. To create the universe that forged the steel, grew the wheat for the bread I ate that night, and evolved the nervous system to feel the pain—that is expensive.

  The probability ratio is not close. It is not even a contest. In an eternal universe, the number of Boltzmann brains vastly outnumbers the number of ordinary observers.

  So, statistically, I should be one of them. I should be a momentary assembly of particles hovering in the dark, inheriting a coherent past that never happened.

  But here is the trap, the one the physicist pointed out while wiping mayo from his chin. If I am a Boltzmann brain, my cognitive processes are the result of random noise, not causal logic. My belief in quantum mechanics, my understanding of entropy, my calculation of the probabilities that lead me to conclude I am likely a Boltzmann brain—all of it is untrustworthy. A fluctuation can produce a brain that believes true physics, but it can just as easily produce a brain that believes nonsense.

  If I conclude I am a Boltzmann brain, I have no reason to trust the conclusion. If I conclude I am not, the statistics suggest I am wrong.

  The cursor blinks. On. Off.

  I try to focus on the text I've written. *The cosmological constant acts as a boundary condition.* The words make sense. They follow grammatical rules I learned in childhood. I remember school. I remember the smell of chalk dust. I remember the face of my first editor. The complexity of this coherent narrative is staggering. And yet, the vacuum does not care about complexity. It only cares about phase space. The volume of phase space containing a lone brain with these memories is infinitely larger than the volume containing a real world that generated them.

  My chest rises. I feel the air move in and out. Is this breathing real? Or is it a simulated sensation included in the package of "Human Experience v4.2" that happened to coalesce out of the quantum foam?

  I stand up. The chair scrapes against the floor. The sound is sharp, abrasive. I walk to the window. Outside, the city is lit by streetlamps. Cars move along the wet asphalt. It looks so continuous. The traffic light changes from green to yellow to red. A pedestrian waits for the signal.

  But continuity is what a fluctuation wants me to see. To stabilize me, to prevent immediate dissolution, the fluctuation must provide a consistent environment. If I saw the walls breathing or the sky turning to static, I would panic, and the coherence would break. The most stable fluctuation is one that believes it is stable.

  I am testing the theory by existing within it.

  I return to the desk. The coffee is still warm. That is suspicious. Thermodynamics suggests it should be cooling. If time is an emergent property of this fluctuation, does heat transfer obey the usual laws? Or is the warmth just another attribute assigned to the object "mug" to maintain the illusion?

  I sit down. I put my fingers on the keys.

  If I am a Boltzmann brain, I will not last. The fluctuation is temporary. Eventually, the particles will disperse back into the vacuum. My consciousness is a bubble on the surface of an infinite ocean, destined to pop. But "destined" implies time, and time implies causality. If I am a random fluctuation, there is no causality. There is only *now*. There is only this moment of awareness, surrounded by nothing.

  The memory of the interview—is it real? Did I drive to his office? Did I record the conversation? Or did I simply appear here, five minutes ago, with the memory of the drive inserted into my hippocampus to explain why I am writing this article?

  The horror isn't that the world is fake. The horror is that the distinction doesn't matter. If my experience is identical, the ontology is irrelevant. Except for the end. If I am an ordinary observer, I will die in a universe that continues. If I am a Boltzmann brain, I will cease when the fluctuation decays. I will not experience the decay; I will simply not be.

  But wait. If I am a Boltzmann brain, why am I worrying about this? Worrying requires a sustained chain of thought. It requires energy. It requires stability. The fact that I can sustain this logical loop suggests a robust substrate. It suggests evolution. It suggests I am real.

  Unless the fluctuation is large enough to include the worry. Unless the doubt itself is part of the random assembly.

  I look at the screen. The text has changed.

  *The cosmological constant acts as a boundary condition.*

  No, that's what I wrote. But did I? I don't remember typing the last sentence. I don't remember the feeling of the keys depressing. I only remember the intention to type.

  The cursor blinks. On. Off.

  The room feels thinner. The edges of my vision are less defined, not visually, but conceptually. The idea of "room" is becoming hard to hold. Why is there a room? Why is there a desk? A brain needs no desk. A brain needs no article. These are props. They are entropy costs I cannot justify.

  I am paying for this desk with probability. Every object I perceive reduces the likelihood that I am real. I should close my eyes. I should reduce the sensory input. I should minimize the complexity of my existence to extend the fluctuation.

  But if I close my eyes, I might not open them.

  The physicist said this was a constraint on model-building. If a theory predicts we are Boltzmann brains, the theory is wrong. It is self-undermining. We must find a cosmology where ordinary observers dominate. We must find a way out.

  I am trying to find the way out. I am reasoning. I am using the tools of logic to save myself from the conclusion of logic.

  The coffee is cold. I didn't feel it cool.

  I look at my hands again. The scar is still there. But the skin looks... rendered. Not fake, but unnecessary. Why would a fluctuation include a scar? Because it adds coherence. It adds weight to the memory. It makes the brain believe it is embedded in a history.

  I am a brain believing it has a history.

  The cursor stops blinking. It stays on. A steady green block.

  I try to type a new word. *Real.*

  The letters do not appear.

  I press the key harder. I feel the plastic give, but no signal travels. The circuit is broken. Or the concept of "circuit" is dissolving.

  I am still thinking. I am still aware. But the environment is stripping away. The window is gone. There is no wall behind the window. There is only the void, and the brain, and the memory of a wall.

  I need to write this down. If I am about to dissolve, I need to leave a record. But a record requires a medium. The screen is dark. The room is dark.

  I am still here. I am thinking this thought.

  *Cogito, ergo sum.*

  No. *Cogito, ergo fluctuo.*

  I think, therefore I fluctuate.

  The darkness is not empty. It is full of potential. It is waiting for the next arrangement. I am not dying. I am unforming. The memories are detaching. The interview. The magazine. The name of the physicist. They are sliding away like water off oil.

  I remember the mayonnaise. I remember the fear.

  I remember—

  The thought is incomplete. There is no one to finish it. There is only the statistical inevitability of the silence that follows.
