  **1. Nora (Truth Norm):** Score: -2. The "Truth Norm" (assert only what is true) is widely rejected in contemporary epistemology because it renders lucky guesses permissible. If truth were the only norm, Theo's unchecked tweet would be impeccable simply because it happened to be right, ignoring his epistemic irresponsibility.

