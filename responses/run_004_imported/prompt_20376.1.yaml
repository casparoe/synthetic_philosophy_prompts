answer: |-
  Here are 10 questions designed to corner the "mis-specified type space" defense, moving from technical mechanics to empirical implications, and ending on falsifiability. Each includes a follow-up tailored to her likely rationalist dodge.

  ### 1. The Aumann Decomposition
  "Let's start with the mechanics of the Agreement Theorem. The theorem requires both a common prior *and* common knowledge of posteriors to guarantee agreement. When we observe persistent disagreement in the wild, you argue this reveals a violation of the common prior. But why privilege the prior over the knowledge condition? Couldn't persistent disagreement just as easily indicate that common knowledge of posteriors is the fragile constraint, while priors remain irrelevant?"

  *   **Follow-up:** "If you say rational agents *must* have common knowledge of posteriors, aren't you just smuggling the agreement conclusion into the premises of rationality?"

  ### 2. The Higher-Order Worry
  "Relatedly, there's a higher-order worry here. For Aumann's result to bite, do the agents merely need to *have* a common prior, or do they need to *know* that they share a common prior? If I think your prior differs from mine—even if, objectively, it doesn't—I won't update the way the theorem requires. So isn't the real rationality requirement actually common knowledge *of* the common prior, rather than the prior itself?"

  *   **Follow-up:** "And if they need to know it, how do they verify that without already agreeing on the interpretation of the evidence that led to that knowledge?"

  ### 3. The Origin Story
  "You defend the common prior as a rationality requirement, not just a convenience. But where does this prior come from? If it's not derived from shared evidence—since we're talking about the prior *to* evidence—is it a logical truth? A biological constant? If two agents process the same data differently due to cognitive architecture, are you committed to saying one of them is literally irrational?"

  *   **Follow-up:** "So if I find your reasoning persuasive but you don't find mine, is the only rational conclusion that I have failed to specify your type space correctly?"

  ### 4. The Harsanyi Doctrine vs. Cognitive Diversity
  "The Harsanyi Doctrine suggests all differences in belief stem from differences in information. But modern cognitive science suggests people have different 'priors' in the psychological sense—different heuristics, risk tolerances, or processing weights. When you insist the type space is mis-specified in these cases, are you effectively defining cognitive diversity out of existence?"

  *   **Follow-up:** "At what point does 'mis-specified type space' become a synonym for 'I haven't found the variable that makes you think like me yet'?"

  ### 5. No-Trade vs. Market Volume
  "Let's move to markets. The No-Trade Theorems suggest that with a common prior and common knowledge of rationality, speculative trading shouldn't happen. Yet we see massive volumes of speculative trade. Your standard line is that this trade is driven by private information we can't observe. But given the sheer volume, aren't we positing an awful lot of hidden information to save the assumption?"

  *   **Follow-up:** "If the 'hidden information' required to explain the trade is never observable even in principle, how is this different from just saying the theory doesn't apply to real markets?"

  ### 6. The "Mis-specified Type Space" Dodge
  "I want to press on your go-to response to counterexamples: that the type space was mis-specified. If every empirical instance of disagreement can be modeled away by expanding the state space or refining the partitions, doesn't that render the Common Prior Assumption unfalsifiable? What work is the assumption doing if it can never be shown to be false?"

  *   **Follow-up:** "Is there a difference between a theory that explains everything and a theory that explains nothing?"

  ### 7. The Analyst's Omniscience
  "When you correct a model by saying 'the type space was wrong,' who is doing the correcting? It seems to require the modeler to occupy a God's-eye view where they know the true state space better than the agents do. But if the agents are rational, why does the analyst have access to a partition the agents themselves don't share?"

  *   **Follow-up:** "Are you essentially saying that rationality is something we impose on agents from the outside, rather than a property they possess?"

  ### 8. Normative vs. Positive
  "You argue the Common Prior is a requirement of rationality. That sounds normative. But you often use it to explain positive phenomena, like market efficiency or the absence of certain bets. If it's a normative ideal that humans systematically fail to meet, why should it have predictive power in descriptive economics?"

  *   **Follow-up:** "If the predictive power fails, do you blame the humans for being irrational, or the theory for being too idealized?"

  ### 9. Convergence and Learning
  "If the Common Prior is a rationality requirement, should we expect agents with different priors to converge over time as they share evidence? If we observe agents who share all evidence yet never converge, does that finally count as a violation of the assumption, or will you argue their learning rules were mis-specified too?"

  *   **Follow-up:** "If the learning rules are part of the type space, haven't you just made the entire Bayesian updating process part of the unfalsifiable core?"

  ### 10. The Falsification Condition
  "Finally, I want to end on the scope of the claim. You've argued this is a rationality requirement. So, what finding would even count as evidence against the assumption? Is there any possible world, or any empirical observation of disagreement, that would force you to abandon the Common Prior as a rational ideal, or is it a priori true by definition in your framework?"

  *   **Follow-up:** "If the answer is 'nothing,' are we doing epistemology, or are we doing theology?"
