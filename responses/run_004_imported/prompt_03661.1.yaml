answer: |-
  This is one of the most sophisticated debates in contemporary metaphysics, known as **meta-ontology**. It is completely normal to feel a bit unmoored here; you are no longer asking about objects (ontology), but about the nature of ontological questions themselves (meta-ontology).

  To help your philosophy club, you can break this down into three parts: the general definition of the distinction, how it applies to the Special Composition Question (SCQ), and the criteria used to decide between them.

  ### 1. The General Distinction: Verbal vs. Substantive

  At its core, the distinction relies on the relationship between **language** and **facts**.

  **A Merely Verbal Dispute**
  A dispute is merely verbal if the parties agree on all the underlying non-linguistic facts but disagree on how to describe them.
  *   **The Test:** If you could fully clarify everyone's definitions and translate one side's language into the other's without losing any information, the disagreement would disappear.
  *   **Example:** Imagine two people arguing over whether a "hotdog is a sandwich."
      *   Person A says "Yes, it's meat in bread."
      *   Person B says "No, a sandwich requires two distinct slices of bread."
      *   **Analysis:** They agree on the physical structure of the hotdog. They disagree on the definition of the word "sandwich." This is verbal.

  **A Substantive Dispute**
  A dispute is substantive if the parties disagree about how the world *is*, independent of how we talk about it.
  *   **The Test:** Even if you fixed all definitions and ensured perfect translation, the parties would still disagree about the state of reality.
  *   **Example:** Two people arguing over whether a specific water sample contains arsenic.
      *   **Analysis:** They agree on what "arsenic" means. They disagree on the chemical composition of the water. This is substantive.

  ### 2. Applying this to the Special Composition Question

  The SCQ asks: *Under what conditions do some xs compose a y?*
  *   **Nihilist:** Composition never happens. There are only simple particles.
  *   **Universalist:** Composition always happens. The trout-head and turkey-tail compose a "trout-turkey."
  *   **Organicist (Restrictivist):** Composition happens only when the parts are bound together biologically/functionally (like a real trout).

  **Hirsch's Argument (Quantifier Variance)**
  Hirsch argues the dispute is **merely verbal**. He relies on a doctrine called *Quantifier Variance*.
  *   **The Idea:** The logical symbol for existence ($\exists$, "there exists") does not have one single, fixed meaning. It is like the word "tall." "Tall" means something different for a jockey than for a basketball player. Neither is "wrong"; they are just different conceptual schemes.
  *   **Application:** When the Nihilist says "Trout-turkeys do not *exist*," they are using a "restrictive" meaning of *exists*. When the Universalist says "Trout-turkeys *exist*," they are using a "permissive" meaning.
  *   **The Facts:** Hirsch argues both sides agree on the fundamental facts: they agree on where the particles are, how they are moving, and how they are arranged. They only disagree on whether that arrangement warrants the label "object." Therefore, the dispute is verbal.

  **Sider's Argument (Ontological Realism / Structure)**
  Sider argues the dispute is **substantive**. He relies on the idea of *Joint-Carving*.
  *   **The Idea:** Reality has an objective structure. Some concepts "carve nature at its joints" (reflect reality's structure), while others are gerrymandered or arbitrary. Sider argues that logic and quantification ($\exists$) are not just human tools; they are part of the fundamental structure of the universe.
  *   **Application:** There is one "elite" meaning of *exists* that reflects the fundamental structure of reality. If the Universalist uses the elite meaning and the Nihilist uses a non-elite meaning (or vice versa), one of them is objectively wrong about the structure of reality.
  *   **The Facts:** For Sider, it is not just about labeling particles. It is about whether reality *itself* contains composite objects as part of its fundamental structure. Therefore, the dispute is substantive.

  ### 3. How to Decide: Criteria for Adjudication

  This is the hardest part, because there is no "meta-meta-ontology" tribunal to settle it. However, philosophers generally use three main strategies to decide if a dispute is verbal or substantive.

  **A. The Principle of Charity (The Translation Strategy)**
  *   **Method:** Try to interpret the opposing view in a way that makes it true. Can we translate the Nihilist's claims into the Universalist's language such that both come out true?
  *   **Hirsch's Move:** Yes. We can translate "There exists a trout-turkey" into "There are particles arranged trout-turkey-wise." Since the Nihilist agrees with the translation, the disagreement was just about the word "exists."
  *   **Sider's Counter:** Translation preserves *truth*, but it doesn't preserve *structure*. "There exists a trout-turkey" and "There are particles arranged trout-turkey-wise" might both be true, but they have different logical structures. If structure matters, the translation fails to capture the full meaning.

  **B. The Appeal to Fundamentality (The Physics Strategy)**
  *   **Method:** Look at our best fundamental physics. Does our best science require composite objects to explain the world, or does it only talk about fields and particles?
  *   **Sider's Move:** If fundamental physics only describes simple particles, then the "joint-carving" quantifier should range only over particles. This makes Nihilism more likely to be substantively correct.
  *   **Hirsch's Counter:** Science is pragmatic. Just because physics *can* describe the world without composite objects doesn't mean composite objects don't "exist" in a valid conceptual scheme.

  **C. The Pragmatic Test**
  *   **Method:** Does resolving the dispute change how we interact with the world?
  *   **Verbal Indicator:** If the answer doesn't change any predictions or practical outcomes, it leans verbal. (Does believing in trout-turkeys change how I study biology?)
  *   **Substantive Indicator:** If the answer changes our understanding of causation, identity, or responsibility, it leans substantive. (If the trout-turkey exists, can it feel pain? If I destroy it, did I destroy one thing or two?)

  ### Summary for Your Club

  To summarize for your presentation, you might frame it like this:

  1.  **The Core Question:** Are we arguing about the **world** (Substantive) or our **map of the world** (Verbal)?
  2.  **Hirsch's Map:** There are many valid maps. A subway map and a street map of New York look different and contradict each other (one shows lines, one shows roads), but both are useful. Nihilism and Universalism are just different maps.
  3.  **Sider's Territory:** There is only one territory. Maps can be more or less accurate. If one map shows a mountain where there is only a hill, that map is wrong. One view of composition captures the "structure" of reality better than the other.
  4.  **The Decision:** We decide by asking: **Is existence a feature of language (like 'tall'), or a feature of reality (like 'mass')?**
      *   If it's like 'tall', Hirsch is right (Verbal).
      *   If it's like 'mass', Sider is right (Substantive).

  Currently, there is no consensus. The debate has shifted from "Do composite objects exist?" to "What are we doing when we ask if composite objects exist?" which is exactly where your club discussion should aim to be.
