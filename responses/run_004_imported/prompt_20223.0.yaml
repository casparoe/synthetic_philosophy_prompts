answer: |-
  **MEMORANDUM**

  **TO:** Reproductive Genetics Ethics Advisory Committee
  **FROM:** [Your Name], Patient-Care Coordinator
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Polygenic Risk Scoring (PRS) and Non-Medical Trait Reporting

  **Background**
  Our contracted genetics laboratory has notified us of a new capability to generate supplementary polygenic reports from existing embryo biopsy data. This includes a core module for adult-onset diseases (e.g., Type 2 diabetes, schizophrenia) and an optional module for non-disease traits (e.g., adult height, educational attainment). We have received a request from a current IVF couple for the full report, including the trait module, to serve as a tiebreaker between chromosomally normal embryos. Our current consent policy authorizes testing "to reduce the risk of serious genetic disease and to support a healthy pregnancy."

  **Ethical Analysis**
  The committee is divided between respecting patient autonomy and maintaining the medical integrity of our practice. I offer the following analysis to frame our vote.

  *1. Autonomy and Paternalism*
  The argument for providing the data rests on a robust view of reproductive autonomy: the couple are the legal decision-makers, the data already exists, and withholding it appears paternalistic. This is a compelling position. In many contexts, patient autonomy entails a right to access information about one's own biological material.

  However, clinical autonomy is not absolute. It operates within the bounds of professional integrity and medical indication. Physicians are not obligated to provide interventions—or interpretations of data—that lack clinical utility or contravene the therapeutic mission of the practice. For example, we do not prescribe antibiotics for viral infections simply because a patient requests them; we distinguish between patient *wants* and medically *indicated* care. Similarly, while patients have a right to choose among embryos, they do not have an inherent right to demand that the clinic facilitate selection based on non-medical social preferences, particularly when the predictive validity of those traits is low and the ethical implications are significant.

  *2. Clinical Validity and Harm*
  The predictive power of polygenic scores for traits like "educational attainment" is statistically significant at the population level but remains weak at the individual embryo level. Using these scores as a "tiebreaker" risks giving patients a false sense of precision, potentially leading to the discard of viable embryos based on negligible probability differences. Furthermore, framing cognitive potential as a selectable trait risks reinforcing harmful eugenic ideologies and equity concerns that fall outside our mandate to promote health.

  *3. The Pleiotropy Complication*
  We must acknowledge the technical wrinkle: genetic variants associated with higher educational attainment scores are correlated with elevated risks for certain conditions, such as bipolar disorder. This creates a scenario where "disease risk" and "trait potential" are genetically entangled. While the *reporting* of these modules can likely be separated by the lab, the *biology* cannot. Withholding the trait score while reporting the disease score is technically feasible, but it requires rigorous counseling to ensure patients understand that selecting for lower disease risk may incidentally influence trait probabilities.

  **Recommendations**
  To resolve the immediate request and establish a sustainable standing policy, I recommend the following:

  **1. Immediate Decision (This Couple)**
  *   **Approve** the core disease-risk module, as this aligns with our existing policy to "reduce the risk of serious genetic disease."
  *   **Decline** the optional non-disease trait module (height, educational attainment). We should not facilitate selection for enhancement traits where clinical utility is unproven and ethical risks are high.
  *   **Mandate Enhanced Counseling:** Given the genetic correlation (pleiotropy) between certain trait markers and disease risks (e.g., bipolar disorder), the couple must undergo specific counseling. They need to understand that while we will not report a "cognitive score," their selection based on disease risk profiles may incidentally correlate with trait probabilities. This ensures transparency without validating trait selection.

  **2. Standing Policy**
  *   **Revise Consent Language:** Update our policy to explicitly distinguish between *medical risk reduction* and *trait selection*. Language should specify that genetic testing is provided to mitigate serious health conditions, not to optimize non-medical characteristics.
  *   **Adopt Professional Guidelines:** Align our stance with current guidance from the American Society for Reproductive Medicine (ASRM), which currently advises against the clinical use of PGT-P (polygenic testing) for non-medical traits due to limitations in predictive value and ethical concerns.
  *   **Review Mechanism:** Establish a trigger to revisit this policy only if the clinical validity of trait prediction improves significantly or if professional consensus shifts.

  **Conclusion**
  This recommendation prioritizes the clinic's medical mission while engaging seriously with the autonomy objection. We are not withholding data to protect the couple from themselves; we are declining to offer a service that falls outside the scope of medical care. By approving the disease module with enhanced counseling on genetic correlations, we respect their right to health information without endorsing the use of reproductive technology for social enhancement.

  I look forward to discussing this draft at Wednesday's meeting.
