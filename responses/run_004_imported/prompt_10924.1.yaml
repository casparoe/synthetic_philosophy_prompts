answer: |-
  The "boundary problem," as crystallized by Frederick Whelan, presents a formidable logical challenge to democratic theory: if democracy is rule by the people, we must first know who "the people" are. Yet, any procedure to determine membership (e.g., a vote) presupposes a prior definition of who is entitled to participate. Thus, the *demos* cannot be constituted democratically without circularity.

  In addressing this, Robert Goodin's "All-Affected Interests" (AAI) principle and Arash Abizadeh's "All-Subjected" (coercion) principle offer the two most prominent contemporary solutions. While both attempt to bypass Whelan's circle by appealing to moral facts rather than procedural votes, **Abizadeh's principle comes closer to resolving the circularity rather than merely relocating it.** Goodin's approach, while morally expansive, shifts the indeterminacy from "who votes" to "what counts as an affected interest," whereas Abizadeh grounds the boundary in the pre-political reality of coercive force, providing a more stable normative trigger for inclusion.

  ### The Two Principles

  **Goodin's All-Affected Interests (AAI)**
  Goodin argues that the democratic franchise should extend to everyone whose interests are affected by a collective decision. This is a consequentialist approach: the scope of the *demos* should match the scope of the decision's impact.
  *   *Strength:* It captures moral intuitions about externalities (e.g., pollution, war).
  *   *Weakness:* It faces the "indeterminacy problem." Almost every decision has ripple effects. If a town votes on a zoning law, does it affect property values in the next town? Does a national interest rate decision affect global markets? If the *demos* changes with every issue, democratic stability is impossible.

  **Abizadeh's All-Subjected Principle**
  Abizadeh argues that democratic justification is required wherever coercive political power is exercised. If a regime claims the authority to bind individuals through law or force, those individuals must have a say in that regime.
  *   *Strength:* It ties membership to the nature of political authority rather than the vagaries of consequences. It focuses on the *source* of the burden (coercion) rather than the *outcome* (interests).
  *   *Weakness:* Defining "coercion" can be contested (e.g., is economic pressure coercion?), and it may exclude those affected by soft power or non-state actors.

  ### Concrete Case: Immigration and Border Control

  The divergence between these principles is sharpest in the context of **immigration policy**, specifically a state's decision to close its borders to asylum seekers.

  **Under Goodin's AAI:**
  The *demos* for a vote on border closure would include not only current citizens but also the potential migrants abroad whose lives are drastically affected by the decision. However, it might also include employers in the destination country (affected by labor supply), competitors in the migrants' home country (affected by remittances or brain drain), and even citizens of neighboring countries (affected by refugee flows). The boundary is fluid and potentially global. The problem arises: *Who decides which interests count?* If the current citizens decide which foreign interests are "significant enough" to warrant inclusion, Whelan's circle remains intact. If an external arbiter decides, the process is undemocratic.

  **Under Abizadeh's All-Subjected:**
  Abizadeh focuses on the border regime itself. A border is not just a line; it is a coercive apparatus that prevents movement. By enforcing a border, the state exercises coercive power over outsiders (preventing them from entering) just as much as over insiders (requiring papers to exit or re-enter). Therefore, the *demos* must include the excluded migrants. Crucially, Abizadeh does not necessarily include the foreign competitors or neighboring governments unless they are also subject to the state's coercive legal order. The boundary is determined by the reach of the state's enforcement mechanisms, not the ripple effects of the policy.

  ### Resolving vs. Relocating the Circularity

  Whelan's charge is that any criterion for membership is arbitrary unless chosen by the *demos*, but the *demos* cannot be chosen without a criterion. To resolve this, a theory must identify a criterion that is **normatively prior to the democratic procedure.**

  **Goodin Relocates the Circularity**
  Goodin attempts to solve the problem by appealing to an empirical fact: "affect." However, "interests" are not brute facts; they are interpreted. Determining whose interests are sufficiently affected to warrant a vote is itself a political judgment.
  If we ask, "Is the interest of a foreign worker affected enough to give them a vote?" we face a decision. Who makes that decision?
  1.  If the current *demos* decides, we have presupposed the boundary (Whelan's circle).
  2.  If a court or philosopher decides, we have imposed an undemocratic constraint.
  Goodin effectively relocates the boundary problem from "Who is a member?" to "What counts as a relevant interest?" without providing a non-circular mechanism to answer the latter. Furthermore, because interests fluctuate with every policy proposal, Goodin's *demos* is unstable, making the "procedure for fixing membership" a perpetual, chaotic renegotiation.

  **Abizadeh Resolves the Circularity**
  Abizadeh accepts Whelan's premise that the *demos* cannot be constituted democratically *ex nihilo*. However, he argues that the *demos* is not constituted by a vote, but by the **claim to legitimacy** made by the state.
  Abizadeh's resolution rests on the idea that coercion demands justification. This is a moral imperative that exists *before* the vote takes place. When a state enforces a border, it is already acting upon outsiders. The obligation to include them in the *demos* arises from the fact of coercion, not from a vote on whether they should be included.
  By grounding the boundary in the *fact of coercion* (which is institutionally identifiable—e.g., are border guards stopping this person?), Abizadeh provides a criterion that does not require a democratic vote to validate. The circle is broken because the duty to include is a precondition of the state's legitimacy, not an outcome of its procedure. While defining "coercion" involves interpretation, it is significantly more binary and institutionally anchored than "affected interests."

  ### Judgment

  Abizadeh's principle comes closer to resolving Whelan's circularity. Goodin's AAI principle is morally attractive but logically vulnerable; it dissolves the boundary so thoroughly that it becomes impossible to administer without reintroducing an arbitrary decision-maker to weigh interests. It leaves us with a "boundary problem" regarding the definition of interests.

  Abizadeh, by contrast, identifies the boundary problem as a problem of **justification for power**. He argues that because the state's claim to authority is unbounded (it claims the right to exclude anyone), the *demos* must be unbounded in principle. This does not solve the practical difficulties of global democracy, but it solves the *logical* paradox Whelan identified. It establishes that membership is not something we vote *on*, but something we recognize *through* the exercise of power. In the immigration case, this means the excluded migrant has a right to a say not because they are "affected" (a contingent fact), but because they are "subjected" (a structural fact of the border regime). This structural anchor allows Abizadeh to bypass the circularity that traps Goodin's consequentialist approach.
