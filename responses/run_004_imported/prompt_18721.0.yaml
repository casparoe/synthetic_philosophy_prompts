answer: |-
  Here are ten interview questions designed to move the discussion beyond illustrative examples and into the structural and epistemic implications of your guest's thesis.

  **1. The Mechanism of Influence**
  You often describe cognition as "reaching down" into perception. When you say this, are you proposing a specific causal mechanism, or is this a functional claim about the dependencies between states? If it is causal, do you envision this as a continuous flow of information that modifies the processing of sensory data as it happens, or as a discrete intervention that alters the parameters of the perceptual system before the data is processed?

  **2. The Attention Alternative (Mandatory Topic)**
  A standard objection to cases like the hungry subject seeing food as larger is that cognition isn't changing the *experience*, but rather directing *attention* or altering eye movements (saccades) to different features of the scene. If I am hungry, I might scan the plate differently, not see the pixels differently. How do your experimental controls definitively rule out the possibility that what looks like penetrability is actually just a sophisticated shift in attentional weighting?
  *   **Follow-up:** You will likely mention that studies control for fixation and still find effects. But even with fixation held constant, covert attention can alter neural gain. At what point does "boosting the signal" via attention become "altering the content" of experience? Is there a bright line there, or are you arguing attention and penetration are the same thing?

  **3. Penetration vs. Perceptual Learning (Mandatory Topic)**
  Your radiologist example is powerful, but it involves years of training. Critics argue this is perceptual learning: the brain is building new bottom-up feature detectors through practice, not allowing a belief to intrude on an existing system. How do you distinguish between a belief penetrating an existing perceptual module and the slow construction of a new, specialized module that operates independently once built?
  *   **Follow-up:** You will likely point to studies where temporary primes produce similar effects in untrained subjects. But if those temporary effects are significantly weaker or less stable than the long-term learning effects, does that suggest the "learning" is just building better detectors, while the "prime" is merely a decision-level bias that *feels* perceptual?

  **4. The Epistemic Circularity Worry (Mandatory Topic)**
  If what we see is shaped by what we believe, perception loses its traditional role as an independent check on those beliefs. If I believe there is a threat, and that belief makes me *see* a threat, I can't use that visual experience as evidence that the threat is real without arguing in a circle. Does your view force us to accept that perception is epistemically compromised, or can it still serve as justification for belief?
  *   **Follow-up:** You will likely argue that not *all* beliefs penetrate, so the check remains in some cases. But if we can't know in the moment which of our perceptions are penetrated and which are pure, do we need a normative principle to distinguish virtuous penetration (expertise) from vicious penetration (bias)? Do you have a candidate for that principle?

  **5. Early Vision and Encapsulation (Mandatory Topic)**
  Philosophers like Fodor and Pylyshyn rely on the distinction between early vision (modular, encapsulated) and late vision (conceptual, integrated). They argue that while cognition affects late vision, early vision remains immune to belief. Does your thesis require that cognitive penetration reaches all the way into early visual processing (e.g., V1), or is it sufficient for your claim that it alters the output of mid-level vision before it becomes conscious experience?
  *   **Follow-up:** You will likely cite neuroimaging showing feedback connections from higher cortex to V1. But anatomical feedback exists for many reasons. How do we know that feedback is conveying semantic content (e.g., "this is a tumor") rather than just modulating signal strength (e.g., "increase contrast sensitivity here")?

  **6. Desire vs. Belief**
  You cite both hunger (a desire/affective state) and theoretical expectations (a belief/cognitive state) as penetrators. Do these operate via the same mechanism? It seems intuitive that evolution would wire desire into perception for efficiency (spot food quickly), but wiring *theory* into perception seems riskier. Do you think desire-based penetration is more robust or philosophically defensible than belief-based penetration?

  **7. Phenomenal Character**
  When penetration occurs, does the *phenomenal character* of the experience change? If a radiologist and a layperson look at the same X-ray, is the radiologist's visual field qualitatively different (like seeing red vs. green), or does it look the same to them but simply "pop out" with a different significance? If it's the latter, how do you distinguish that from a rapid, non-conscious judgment attached to a stable percept?

  **8. Evolutionary Function**
  Assuming cognition does penetrate perception, what is the evolutionary advantage? A modular, encapsulated system protects us from hallucinating what we fear or desire. If we are penetrable, we risk mistaking our hopes for reality. What functional benefit outweighs the risk of losing contact with objective environmental features?

  **9. Cross-Modal Consistency**
  Most of the literature focuses on vision. Do you think cognitive penetrability applies equally to audition, touch, or olfaction? If penetration is a general feature of the mind, we should see it everywhere. If it is unique to vision, doesn't that suggest it's an artifact of how complex visual processing is, rather than a fundamental feature of the relationship between cognition and perception?

  **10. Falsification (Closing Question)**
  In everything I've read on this debate, proponents and detractors often talk past one another regarding what would settle the issue. So, I'd like to ask directly: What single observation, experimental result, or phenomenological report would convince you that cognition *cannot* penetrate perception? What would it take to change your mind?
