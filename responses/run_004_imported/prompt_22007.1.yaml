    }
  ]
  ```

  ### A Note on Your Dinner Argument
  Grading this actually highlights the crux of your debate. Your friend's claim (that counterexamples get redefined as "not computation") is the standard defense of the **Logical CTT**. If a hypercomputer is built, logicians say, "That isn't 'effective calculability' as Turing defined it." The student (and you) are arguing for the **Physical CTT**, which *is* empirical. The student lost points because the exam question defined the thesis in the Logical sense ("what a human could compute by rote"), but the student argued against the Physical sense. Your friend is right about the Logical Thesis; you are right about the Physical Thesis. The confusion arises because both are often called "The Church-Turing Thesis."
