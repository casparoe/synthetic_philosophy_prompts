answer: |-
  Here are ten interview questions designed for your podcast, structured to challenge your guest on the specific philosophical fault lines you identified. Each question includes the **Anticipated Position** (the standard defense she is likely to offer) and a **Follow-up** designed to press that defense without conceding the point.

  ### 1. The "Normative Dress" Charge
  **Question:** Your friend in the literature argues that Risk-Weighted Expected Utility (REU) is mathematically isomorphic to Quiggin's Rank-Dependent Utility. The charge is that you've taken a probability-weighting curve originally designed to describe cognitive *biases* (Kahneman/Tversky), stripped it of its descriptive baggage, and simply declared it "rational." If the math is the same, what substantive work is the "normative" label actually doing, other than immunizing the Allais paradox from criticism?

  **Anticipated Position:** She will likely argue that mathematical form does not dictate interpretation. Quiggin describes how people *do* violate EU; REU prescribes how agents *may* rationally care about the global structure of a gamble, independent of bias.
  **Follow-up:** But if the functional form allows for the same violations of Independence that we previously categorized as errors, haven't you just moved the goalposts? At what point does "rational sensitivity to global structure" become indistinguishable from "rationalized bias"?

  ### 2. Global vs. Local Primitives
  **Question:** You argue that REU makes a genuine advance by separating 'global' risk sensitivity from the 'local' curvature of the utility function. But conceptually, isn't an agent's aversion to a spread of outcomes just another way of describing the diminishing marginal value of those outcomes? Why should we treat the risk function ($r$) as a primitive distinct from the utility function ($u$)?

  **Anticipated Position:** She will likely claim that utility measures the value of *outcomes* (e.g., money), while the risk function measures the attitude toward the *uncertainty* of receiving them. One can have linear utility for money but still prefer a sure thing over a gamble.
  **Follow-up:** If we can model that same preference using a concave utility function and standard Expected Utility, isn't positing a second primitive theoretically costly? What explanatory power do we gain by splitting the difference that we lose in parsimony?

  ### 3. The Identification Problem
  **Question:** Following up on that separation: In practice, how do we elicit an agent's risk function without conflating it with their utility function? If we infer the risk function from choices, aren't we just fitting the model to the data? How do we avoid the underdetermination problem where any REU explanation can be rewritten as an EU explanation with a different utility curve?

  **Anticipated Position:** She will likely point to specific elicitation procedures or thought experiments where the utility of outcomes is held fixed (e.g., via certainty equivalents) to isolate the risk parameter.
  **Follow-up:** But those procedures usually assume the very theory you're trying to test. If an agent rejects your elicitation gamble, do you conclude they have a different risk function, or that they don't maximize REU at all? How do you break the circularity?

  ### 4. Divergence Outside the Allais Paradox
  **Question:** Critics often say REU only matters for paradoxes like Allais. Can you give us an ordinary, non-paradoxical case—perhaps in climate policy or medical triage—where REU and orthodox Expected Utility recommend *different* actions? I'm looking for a case where following EU seems clearly misguided, and REU saves the intuition.

  **Anticipated Position:** She will likely offer a "catastrophe avoidance" case, where EU ignores a low-probability disaster because the expected value is high, but REU (with a risk-averse $r$-function) weights the worst-case scenario more heavily, recommending precaution.
  **Follow-up:** But couldn't an Expected Utility theorist just adjust the utility function to assign infinite or lexicographic disvalue to the catastrophe? If EU can mimic the recommendation by tweaking the stakes, is the divergence really due to the *risk* structure or just the *value* assignment?

  ### 5. The Dynamic Choice Worry
  **Question:** Let's turn to dynamic choice. If an agent cares about the global shape of a gamble, they seem vulnerable to a money pump when that gamble is unpacked into a sequence of local choices. If I prefer Gamble A over B now, but would choose differently at a later node in the same tree, aren't I exploitable? Does REU inevitably lead to dynamic inconsistency?

  **Anticipated Position:** She will likely concede that REU agents can violate *Dynamic Consistency* (specifically the Separability principle) but argue that this is a feature, not a bug. She may argue that rationality does not require Separability.
  **Follow-up:** If rationality doesn't require Separability, what stops an agent from being money-pumped in the real world? Is the theory claiming that agents *won't* be pumped, or that it's *rational* to lose money to maintain consistency with their global risk attitude?

  ### 6. Resolute Choice as a Solution
  **Question:** To avoid that money pump, you've suggested agents might adopt "resolute choice"—sticking to a prior plan even when local preferences shift. But isn't resolute choice just a fancy word for ignoring your current preferences? If my local preference at time $t_2$ says "take the money," what rational authority does my plan at $t_1$ have over me?

  **Anticipated Position:** She will likely argue that the $t_1$ plan embodies the agent's global evaluative standpoint, which is more comprehensive than the myopic $t_2$ view. Resoluteness is the exercise of agency over time.
  **Follow-up:** But if the $t_2$ preference is also generated by the same REU function applied to the local subtree, why is the global view privileged? Are we saying rationality requires us to sometimes ignore what the theory itself says is optimal at the current node?

  ### 7. The Cost of Resoluteness
  **Question:** You mentioned resolute choice. My worry is that avoiding the money pump costs the theory more than it buys. To save REU from exploitation, you have to adopt a theory of agency (resolute choice) that many find ad hoc. If we have to break standard dynamic rationality constraints to make REU work, have we solved the Allais paradox only by creating a dynamic choice paradox?

  **Anticipated Position:** She will likely argue that the constraints of EU (like Separability) are the ones that are ad hoc when applied to risk-sensitive agents. The "cost" is only high if you assume EU's dynamic norms are correct.
  **Follow-up:** But EU's dynamic norms protect agents from sure losses. If REU requires us to abandon that protection to maintain a specific attitude toward risk, doesn't that suggest the risk attitude is the thing that should be abandoned, not the protection against exploitation?

  ### 8. Constraints on the Risk Function
  **Question:** In Expected Utility, rationality constrains the utility function (e.g., monotonicity). In REU, what constrains the risk function ($r$)? Can a rational agent have a risk function that is convex in some ranges and concave in others, or one that violates stochastic dominance? Where is the line between a "risk attitude" and a "reasoning error"?

  **Anticipated Position:** She will likely argue that $r$ must be monotonic and map [0,1] to [0,1], but beyond that, rationality permits significant variation. It represents the agent's perspective.
  **Follow-up:** If the constraints are that loose, does REU lose its normative bite? If any probability weighting can be declared "rational," how do we criticize an agent who is risk-seeking on gains and risk-averse on losses in a way that leads to self-defeating behavior?

  ### 9. Disappointment Theory Rival
  **Question:** Another way to explain the Allais preferences without modifying EU is Disappointment Theory (Loomes & Sugden), where utility depends on the comparison between the outcome and the expectation. Why prefer REU's "global risk" explanation over Disappointment Theory's "local comparison" explanation? Doesn't Disappointment Theory handle the dynamic case better?

  **Anticipated Position:** She will likely argue that Disappointment Theory reduces risk to another outcome property, whereas REU captures the distinct intuition that the *distribution itself* has value. She may also note axiomatic differences.
  **Follow-up:** But if Disappointment Theory can model the same choices without violating Dynamic Consistency, isn't it the superior theory? Is your defense of REU essentially a defense of the intuition that risk is primitive, even if it makes the dynamic theory messier?

  ### 10. Policy and Social Choice
  **Question:** Finally, let's zoom out. If we adopt REU for social policy—for example, in setting insurance mandates or climate regulations—do we aggregate individual risk functions, or impose a social risk function? If individuals have different $r$-functions, does REU make interpersonal comparison and social welfare calculations intractable compared to standard EU?

  **Anticipated Position:** She will likely acknowledge this is an open area but suggest that REU allows us to distinguish between "needs" (utility) and "attitudes" (risk), potentially clarifying policy debates about paternalism.
  **Follow-up:** But if the state imposes a specific risk function to protect citizens from their own "local" choices, aren't we just reintroducing paternalism under the guise of respecting their "global" preferences? How do we know which preference is the "real" one?
