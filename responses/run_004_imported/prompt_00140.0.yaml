      *   *Key Distinction:* RGT relies on *time* (shadow of the future), PE relies on *logical correlation* (source code transparency/commitment).
      *   *Key Distinction 2:* RGT requires an infinite (or indefinite) horizon. PE works in *one-shot* interactions.
