          *   PE: "If your code defects against me, my code defects against you *now*." (Logical link across agents).
      *   **Commitment:** PE is essentially binding commitment made visible. RGT is dynamic consistency.
      *   **Equilibrium Selection:** Folk Theorem gives *too many* equilibria (anything above minmax). PE can narrow this down (e.g., via modal logic, FairBot, PrudentBot).
