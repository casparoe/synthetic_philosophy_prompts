answer: |-
  # The Ghost in the Atom: A Verdict on Single-Case Probability

  For thirty years, I stood before Geiger counters and scintillation screens, recording clicks and calculating confidence intervals. I operated under a tacit ontology: the atom in front of me possessed a property called "probability of decay," and my job was to measure the frequency with which that property manifested. It was a productive fiction. It allowed me to publish papers, secure grants, and contribute to the standard model. But now, in retirement, when I ask what that probability *was*—ontologically, for that single, unrepeated atom—the foundations crack.

  The philosophical literature confirms my unease. We are presented with a trilemma. Frequentism cannot account for the single case without collapsing into the reference class problem. Propensity theory rescues the single case but breaks the probability calculus via Humphreys' Paradox. Subjectivism saves the calculus but threatens to dissolve objective chance into mere opinion. Faced with this three-way bind, we must commit. We cannot simply say that each view captures a facet of the truth.

  My verdict is this: **Talk of objective, single-case probability is metaphysically confused.** There is no "chance" residing in the atom, waiting to be measured. Probability is fundamentally epistemic—a measure of rational belief constrained by physical symmetries and frequencies. To speak of the "probability of this atom decaying" as an objective feature of the world is a category error. We should retain the language of probability for its pragmatic utility, but we must purge our ontology of objective single-case chance.

  ### The Frequentist Dead End

  The frequentist intuition is the physicist's native tongue. Probability is the limit of relative frequency in a long run of trials. It is objective, empirical, and clean. But as soon as we isolate the single case—the specific atom decaying in the next minute—frequentism falls silent. Von Mises was explicit: no collective, no probability.

  To force a frequentist reading onto a single case, we must assign the atom to a reference class. But as the prompt notes, the atom belongs to indefinitely many classes: atoms of this isotope, atoms in this magnetic field, atoms manufactured on a Tuesday, atoms observed by me. Each class yields a different frequency. Frequentism offers no internal criterion for selecting the "correct" class. If we choose the class "atoms that decay," the frequency is 1. If we choose "atoms that do not decay," it is 0.

  A frequentist might appeal to the "physically relevant" conditions, but this smuggles in a notion of causal relevance that frequentism itself cannot define without circularity. We know which class is relevant only because we already know the causal story, which implies we already know the probabilities we are trying to define. For the single case, frequentism is not just incomplete; it is incoherent. It requires a sequence that does not exist.

  ### The Propensity Trap

  Recognizing this failure, Karl Popper proposed propensities. He sought to locate probability in the physical setup itself—a dispositional property of the atom, akin to fragility in glass. This allows for single-case probability: the atom has a propensity to decay now, regardless of whether it is part of an ensemble.

  However, this rescue mission fails on the mathematics. As Paul Humphreys demonstrated, propensities are inherently causal and time-directed. A propensity is a tendency of a cause to produce an effect. But the probability calculus, specifically Bayes' theorem, requires invertibility. We must be able to reason from effect to cause (inverse probability) just as rigorously as from cause to effect.

  If probability is a causal propensity, $P(\text{Effect}|\text{Cause})$ makes sense as a physical disposition. But $P(\text{Cause}|\text{Effect})$ cannot be a propensity, because the effect does not causally dispose the cause to have happened. The past is fixed. If propensities are real physical powers, they cannot satisfy the axioms of probability when inverted. If they do satisfy the axioms, they cannot be irreducible causal powers. Popper saved the single case but broke the calculus. We cannot have a probability that disobeys Bayes' theorem.

  ### The Subjectivist Rescue and the Dissolution of Chance

  This leaves Subjectivism (Bayesianism). Here, probability is a degree of belief (credence). This handles the single case effortlessly: I have a belief about *this* atom. It handles inversion effortlessly: Bayes' theorem is a law of logic, governing how beliefs update, not how causes propagate.

  The standard objection, noted in the prompt, is Lewis's Principal Principle. If probability is just belief, what constrains it? Why should my credence match the "objective chance" of the physical world? If I say the probability of decay is 0.5, am I not just guessing? If there is no objective chance to match, does physics not collapse into psychology?

  Here is where we must make our stand. The difficulty of the Principal Principle arises only if we insist that "objective chance" is a real thing distinct from credence. If we conclude that objective single-case chance is a confusion, the problem dissolves.

  We do not need objective chance to constrain our beliefs; we need **physical symmetries and empirical frequencies**. When I assign a credence of 0.5 to a decay event, I am not detecting a ghostly propensity. I am recognizing that the physical setup possesses symmetries (described by the wavefunction) that render certain outcomes indistinguishable given my current information. I am also acknowledging that, in the past, ensembles of similar setups have yielded specific frequencies.

  These physical facts are objective. The *probability* is not. The probability is the rational weight I assign to those facts. The "Principal Principle" is not a bridge between two ontological realms (Mind and Chance); it is a rule of rationality: *If you know the physical symmetries and frequencies, it is irrational to ignore them when assigning credence.*

  ### The Verdict: A Category Error

  Therefore, we must conclude that talk of objective single-case probability is confused. It is a reification of a tool. We have taken a method for managing uncertainty and projected it onto the world as a causal force.

  This verdict does not invalidate my life's work. The predictions remain identical. The confidence intervals are calculated the same way. The only change is metaphysical. When I said, "This atom has a 50% chance of decaying," I was speaking a shorthand for "Given the quantum state and my knowledge, a rational agent should assign a credence of 0.5 to this event."

  Why does this matter? Because the confusion blocks understanding. The search for "what probability really is" has led to decades of metaphysical stagnation because philosophers and physicists are hunting for a entity that does not exist. Humphreys' Paradox exists only because we insist propensities are causal. The Reference Class problem exists only because we insist frequencies define the probability rather than inform the belief.

  By accepting that probability is exclusively epistemic, we resolve the bind.
  1.  **Single Case:** Coherent, because beliefs are always about specific propositions.
  2.  **Inversion:** Coherent, because logic applies to belief regardless of time's arrow.
  3.  **Objectivity:** Secured not by "chance," but by the objectivity of the evidence (symmetries, frequencies) that constrains rational belief.

  ### Conclusion

  We should not seek an interpretation that underwrites *objective* single-case probability, because there is none to be found. The atom does not know it has a probability. The universe does not roll dice; it simply evolves. We roll dice because we are not the universe; we are observers within it, limited by information.

  To ask for the probability of a single, unrepeated event as an objective feature of that event is to ask a confused question. The coherent answer is to recognize that probability is a relation between an observer and a system, not a property of the system alone. We must retire the notion of "objective chance" alongside my Geiger counters. It served us well, but it was always a map, never the territory.
