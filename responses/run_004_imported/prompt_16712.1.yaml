answer: |-
  Here are nine interview questions designed for a contemporary just-war theorist defending G.E.M. Anscombe's absolutist position, complete with follow-ups that anticipate her likely deontological responses.

  **1. The Doctrine of Double Effect and "Means" vs. "Side Effect"**
  Anscombe argues that the Doctrine of Double Effect cannot exculpate Truman because the civilian deaths were not merely foreseen side effects but the very *means* by which surrender was coerced. However, Truman and his defenders often insist their *primary* intention was ending the war, with civilian death being a regrettable byproduct of striking military-industrial targets. How do you analytically distinguish between a "byproduct" and a "means" when the psychological state of the actor claims the former, but the strategic logic relies on the latter?
  *   **Follow-up:** I anticipate you will argue that the strategic logic reveals the true intention. If so, does this effectively collapse the Doctrine of Double Effect in almost all cases of strategic bombing, rendering it practically useless for *jus in bello* analysis?

  **2. The "Clean Hands" Objection**
  A common consequentialist rejoinder to Anscombe is that an absolutist prohibition on killing innocents privileges the moral purity of the agent ("clean hands") over the actual lives lost in a prolonged conflict. If refusing to bomb Hiroshima would have resulted in significantly higher Japanese and Allied casualties via invasion or starvation, does your position not implicitly value the leader's moral innocence over the survival of the many?
  *   **Follow-up:** You will likely reject the aggregation of lives as a moral metric. But if we cannot aggregate harms, how do we advise political leaders facing "lesser evil" scenarios without telling them to simply ignore the consequences of their absolutism?

  **3. Consistency with Conventional Firebombing**
  If the moral crime of Hiroshima and Nagasaki lies in the intentional targeting of civilian populations to break enemy will, does your argument not equally condemn the conventional firebombing of Tokyo, Dresden, and Hamburg, which killed more people overall? Is there a morally relevant distinction between the *method* of delivery (incendiary clusters vs. nuclear singularities) or does the Anscombian critique delegitimize the entire Allied area-bombing campaign?
  *   **Follow-up:** Assuming you agree that area bombing is equally condemnable, does this imply that the Allied victory was achieved through systematically immoral means, and if so, does that tarnish the justice of the cause (*jus ad bellum*) itself?

  **4. Nuclear Deterrence and Conditional Intention**
  Anscombe later argued that nuclear deterrence is morally incoherent because it relies on a "conditional intention" to do what would be wrong to do unconditionally (i.e., murder innocents). How should this specific objection bear on contemporary deterrence postures, particularly among nations that maintain "no first use" policies but still target population centers as a failsafe?
  *   **Follow-up:** You will likely argue that the conditional intention remains a corrupt state of will. Does this mean that any credible nuclear deterrent is inherently immoral, requiring immediate unilateral disarmament regardless of the geopolitical risks?

  **5. The "Supreme Emergency" Exception**
  Michael Walzer, while generally respecting the distinction between combatants and non-combatants, allows for a "supreme emergency" exception where the threat is so imminent and catastrophic that the usual prohibitions may be overridden. Does Anscombe's framework allow for *any* threshold of existential threat that permits the targeting of innocents, or is the prohibition truly exceptionless even in the face of potential national annihilation?
  *   **Follow-up:** If you maintain the prohibition is exceptionless, are you prepared to argue that a state facing genocide should refrain from targeting the enemy's civilians even if it is the only remaining lever to stop the slaughter?

  **6. Institutional Complicity and Honorary Degrees**
  In the context of universities awarding honorary degrees to wartime leaders, Anscombe suggested that such honors imply a moral endorsement of the recipient's actions. If we accept that the bombing campaign was murder, does the institution have a retrospective duty to revoke the degree, or does the passage of time and the complexity of historical memory mitigate the university's complicity in honoring the figure?
  *   **Follow-up:** You will likely suggest that honoring such figures distorts the moral record. However, does revoking a degree decades later risk turning the university into a retrospective tribunal, and does that undermine the educational mission of understanding history in its context?

  **7. The Definition of "Innocence" in Total War**
  Anscombe's argument rests on the status of the victims as "innocents" (non-combatants). In a total war economy where civilian factory workers produce munitions essential to the war effort, how do you define the boundary of innocence? Does the Anscombian view require us to treat industrial workers as strictly non-combatant, even if their labor is functionally indistinguishable from soldiering in its contribution to the front?
  *   **Follow-up:** If you maintain that industrial workers are non-combatants, does this not grant a significant asymmetric advantage to states that embed their military production deeply within civilian population centers?

  **8. Epistemic Certainty and Counterfactuals**
  Defenders of the bombings often rely on the counterfactual claim that an invasion would have cost more lives. Anscombe's view suggests that even if this were true, it wouldn't justify murder. However, given that the invasion cost estimates were highly uncertain at the time, does the *epistemic uncertainty* of the consequentialist calculation add a layer of recklessness to the decision, or is the moral wrong independent of whether the invasion would have actually been costlier?
  *   **Follow-up:** You will likely argue the wrong is independent of the calculation. But does this ignore the specific burden of a head of government, who is obligated to act on probabilities rather than moral certainties?

  **9. Algorithmic Collateral Damage in Modern Warfare**
  Finally, how does Anscombe's framework apply to modern drone warfare and autonomous weapons systems, where "collateral damage" is calculated algorithmically based on acceptable risk ratios? Does the mathematical pre-approval of civilian deaths in a targeting algorithm constitute an "intention" to kill in the Anscombian sense, or is it a digital instantiation of the "foreseen but not chosen" defense?
  *   **Follow-up:** If you argue that algorithmic acceptance constitutes intention, does this implicate not just the operator, but the programmers and policymakers who set the acceptable casualty ratios as co-intenders in the killing?
