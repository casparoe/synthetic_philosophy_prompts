      *   **The Problem:** When *both* parties use this tactic simultaneously, it creates a "game of chicken."
      *   **Commitment Bias:** Once someone states a "final" number, backing down feels like a loss of face/credibility.
      *   **Source of Advice:** The advice came from non-neutral parties (a lawyer friend who might be litigious by nature, a real estate agent who deals with hard numbers/closings). Neither is a family mediator.
      *   **Relationship Dynamic:** Siblings + Estate = High Emotion. Hardball tactics often damage relationships permanently.
      *   **Cost-Benefit:** Legal fees are eating the estate. Every week of stalemate reduces the total pot.

  3.  **Address the User's Specific Questions:**
      *   *Was this doomed from the start?* Yes, largely. Simultaneous ultimatums create a deadlock.
      *   *Did I play it right?* No, not in this context. It was a tactical error given the relationship and the simultaneous nature.
      *   *Is he just being stubborn?* Probably, but so are you. It's a systemic issue, not just his fault.

  4.  **Formulate the Advice:**
