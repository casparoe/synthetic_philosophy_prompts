answer: |-
  First, I am an AI and not a lawyer or a therapist, so please take this as strategic and interpersonal advice rather than legal counsel.

  To answer your question directly: **Yes, this strategy was effectively doomed the moment you both played the same card simultaneously.**

  It is not that you played it "wrong" and he is "stubborn," or vice versa. You both fell into a classic negotiation trap known as a **"Game of Chicken."** Here is a breakdown of why this happened, why it feels so stuck, and how you can actually win by changing the game.

  ### 1. Why the "Final Offer" Strategy Backfired
  The advice you received from your lawyer friend and his fiancée is standard *transactional* advice. It works well when buying a car or closing a house deal with a stranger. In those scenarios, the relationship doesn't matter after the deal is done.

  However, estate division between siblings is *relational*. When you apply hardball transactional tactics to a family relationship, two things happen:
  *   **Commitment Bias:** Once you put a "final" number in writing (even via text), your brain locks onto it as a position of integrity. Backing down feels like lying or weakness. Since you *both* did this, you are both locked in.
  *   **The Mirror Effect:** You view his stubbornness as greed or ego. He views your stubbornness as greed or ego. In reality, you are both reacting to the exact same trigger. You are mirroring each other.

  By both sending "ultimatums" within 24 hours, you removed the flexibility needed to find a middle ground. You didn't gain the upper hand; you mutually assured destruction.

  ### 2. The Real Enemy Isn't Your Brother
  Right now, you feel like you are fighting your brother. You aren't. **You and your brother are both losing to the legal fees.**

  Every week you stall to avoid "losing face" on a number, the total value of the estate shrinks. If you are both paying legal fees to argue over a split, the lawyers are the only ones guaranteed to make more money the longer this goes on.
  *   **The Math:** If you are fighting over $10,000 worth of assets, but you each spend $5,000 in legal fees to prove your point, the net worth of the estate drops by $10,000. You effectively burned the money you were fighting over.

  ### 3. How to Fix It (The "Off-Ramp")
  You need a way to back down without feeling like you lost. The good news is that **texts are not binding contracts.** You can reframe this.

  **Step 1: Change the Medium**
  Stop texting. Stop communicating through lawyers. Texting removes tone and nuance, making everything sound more aggressive. Lawyers have a financial incentive to keep the conflict going (billable hours).
  *   **Action:** Call him or meet for coffee. Say, "I hate that we're doing this through lawyers. It's costing us both money and it's not how Mom would want this handled."

  **Step 2: Blame the Advice (Save Face)**
  You don't have to admit you were "wrong." You can blame the strategy.
  *   **Script:** "Look, I got some advice from a friend to send that number to move things along, and I realize now that was a mistake. I didn't mean to issue an ultimatum, I just wanted to stop the back-and-forth. I know you probably got similar advice. Let's hit reset."
  *   **Why this works:** It gives *him* permission to back down too. He can blame his fiancée or his advisor just like you are blaming your friend. It allows both of you to save face.

  **Step 3: Bring in a Mediator, Not a Litigator**
  If you can't talk directly, hire a **mediator**, not another lawyer.
  *   **Lawyers** are trained to advocate for *your* side against *his* side.
  *   **Mediators** are trained to find a solution that works for *both* sides.
  *   Split the cost of one neutral mediator. It will be cheaper than two litigators fighting for weeks.

  ### 4. Redefine "Winning"
  You asked if you played it right to get the upper hand. In a business deal, the upper hand is getting the most money. In a family estate, "winning" looks different:
  *   **Winning** is keeping your relationship with your brother intact for the next 40 years.
  *   **Winning** is ensuring Mom's money goes to her children, not to attorneys.
  *   **Winning** is resolving this quickly so you can focus on visiting Mom in assisted living without stress.

  ### Summary
  You didn't make a fatal error, but you did use the wrong tool for the job. You used a hammer when you needed a scalpel.
  *   **Is he stubborn?** Yes.
  *   **Are you?** Also yes.
  *   **Was it doomed?** Yes, because ultimatums only work if the other person has room to move. He didn't, because he had already put up his own wall.

  **Recommendation:** Reach out to him this week. Blame the "bad advice" from friends/partners. Propose a 50/50 split of the legal fees incurred so far (to show good faith) and agree to mediate the rest. You will likely find he is just as relieved to get out of the corner he painted himself into.
