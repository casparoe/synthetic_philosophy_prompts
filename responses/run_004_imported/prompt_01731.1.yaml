answer: |-
  It is a pleasure to speak with a colleague from the other side of the divide. Your background in optics makes you the ideal reader for this passage; Poincaré is using Fresnel and Maxwell not just as examples, but as the evidentiary basis for his philosophical claim. You know better than most that the wave equation doesn't care much whether the wave is in a luminiferous ether or an electromagnetic field.

  You have hit on the exact nerve that makes this passage one of the most cited in the history of philosophy of science. To answer your questions directly: Poincaré is arguing for what modern philosophers call **Epistemic Structural Realism**. He is indeed addressing the ancestor of the Pessimistic Meta-Induction (PMI), and his solution is more robust than "decent approximation," though it does invite its own difficulties.

  Here is a close reading of the text, broken down by the specific problems you raised.

  ### 1. What concretely carries over?
  You asked what Poincaré thinks actually survives the theory change. He is explicit in the text: **"The differential equations are always true."**

  As a physicist, you know that when we move from Fresnel to Maxwell, the *ontology* changes radically.
  *   **Fresnel:** Light is a mechanical vibration of a material substance (the ether).
  *   **Maxwell:** Light is a self-propagating oscillation of electric and magnetic fields (no mechanical medium required).

  If science were about telling us what things *are* (ontology), Fresnel was wrong. There is no ether. But Poincaré points out that the *mathematical structure* describing the propagation remains invariant. The wave equation $\nabla^2 \psi = \frac{1}{v^2} \frac{\partial^2 \psi}{\partial t^2}$ retains its validity even if $\psi$ stops representing "displacement of ether" and starts representing "field strength."

  Poincaré is arguing that the **mathematical relations** are the invariant content of science. When he says, "the something which we then called motion, we now call electric current," he is noting that the *nodes* in the network of theory change labels, but the *edges* (the equations connecting them) remain stable.

  So, concretely, what carries over is the **group structure** or the **form of the laws**. For Poincaré, the "truth" of a theory is not found in its nouns (electron, ether, field) but in its verbs (the equations governing their interaction).

  ### 2. Is "Relations" just a fancy way of saying "Decent Approximation"?
  This is the crux of the philosophical move. If Poincaré were an **Instrumentalist**, he would say: "The ether doesn't exist, but the equations are a useful tool for prediction. We keep them because they work."

  But Poincaré is making a stronger, **Realist** claim about the relations. Look at this sentence:
  > *"It cannot be said that this is reducing physical theories to simple practical recipes; these equations express relations, and if the equations remain true, it is because the relations preserve their reality."*

  He is explicitly rejecting the idea that this is *just* a recipe. He believes the relations are **ontologically significant**.
  *   **The Approximation View:** Fresnel's theory was false, but close enough to the truth for low energies.
  *   **Poincaré's View:** Fresnel's theory captured a *real relation* that exists in Nature, independent of the images (ether/fields) we use to visualize it.

  He distinguishes between "real objects which Nature will hide for ever from our eyes" and the "images we substituted for the real objects." He is agnostic about the *relata* (the things relating) but realist about the *relations*.

  So, it is not that the old theory was a "lie that worked." It is that the old theory identified a structural truth about the universe that is independent of the specific mechanical model used to visualize it. The "bankruptcy" charge fails because the assets (the structural relations) were never liquidated; they were just transferred to a new account (Maxwell's theory).

  ### 3. Is this an answer to the Pessimistic Meta-Induction?
  Yes. You have correctly identified the lineage. The Pessimistic Meta-Induction (formalized by Larry Laudan in 1981) argues:
  1.  Most past successful theories posited entities that we now believe do not exist (phlogiston, caloric, ether).
  2.  Therefore, our current successful theories probably posit entities that do not exist (quarks, strings, etc.).
  3.  Therefore, we should not believe our current theories are true.

  Poincaré is anticipating this in 1905. The "man of the world" in the text is essentially Laudan's pessimist. He sees "ruins piled upon ruins" and declares bankruptcy.

  Poincaré's response is the founding argument of **Structural Realism** (later championed by John Worrall in 1989 using this exact Poincaré passage). The argument is:
  *   **Concede:** The *ontology* of past theories was wrong (no ether).
  *   **Resist:** The *structure* of past theories was right (the equations).
  *   **Conclusion:** Science progresses by preserving structure, not by preserving ontology. Therefore, we have reason to believe the *structure* of current theories (Quantum Field Theory, etc.) is correct, even if we suspect the *ontology* might change.

  This saves science from the PMI without requiring us to believe that 19th-century physicists magically knew about the electromagnetic field while calling it "ether."

  ### 4. Does it work, or does it push the problem back?
  This is where your philosophical skepticism is well-placed. Poincaré's solution is elegant, but it faces a significant hurdle, often called the **Newman Problem** (after Max Newman, 1928).

  **The Strength:**
  It explains scientific progress. It explains why we still teach Fresnel's integrals. It allows us to be realists about science (it discovers truth) without being naive (thinking our current textbooks are the final word on what exists).

  **The Weakness (Pushing the problem back):**
  Poincaré writes: *"The true relations between these real objects are the only reality we can attain."*

  But relations are always relations *between* something. If we cannot know anything about the "real objects" (the relata) other than the relations they hold, what distinguishes this view from saying "there are no objects, only relations"?
  *   If I tell you $A$ is related to $B$ by distance $x$, but I tell you nothing about what $A$ and $B$ *are*, have I told you anything about the world? Or have I just described a mathematical structure that could be mapped onto *anything*?
  *   Newman argued that if you only commit to "structure," you can find that structure in almost any set of objects, provided there are enough of them. Structure alone, without constraints on the *nature* of the relata, is trivially satisfiable.

  Furthermore, as a physicist, you might object that **even the equations don't always carry over.**
  Poincaré relies heavily on the Fresnel-to-Maxwell transition, which was relatively smooth mathematically (wave equations remained wave equations). But consider Newtonian Gravity to General Relativity.
  *   **Newton:** Force acting at a distance in Euclidean space.
  *   **Einstein:** Curvature of spacetime.
  The differential equations do *not* remain true in the same way; the geometry itself changes. Poincaré's structural realism works best in cases of "correspondence" (like classical limits), but struggles when the mathematical framework itself undergoes a paradigm shift (like the shift from flat to curved spacetime).

  ### Summary for the Physicist
  Poincaré is telling you that you were right to trust the math more than the mechanism.
  *   **The "Man of the World"** thinks science is about the mechanism (the ether). When the mechanism breaks, science fails.
  *   **Poincaré** thinks science is about the invariant relations (the equations). When the mechanism breaks, the relations often survive.

  He is not saying "it was a decent approximation." He is saying "the approximation was in the *picture* we painted, not in the *geometry* of the brushstrokes."

  Does it solve the PMI? It mitigates it. It allows us to say, "We might be wrong about quarks being 'little balls,' but we are likely right about the SU(3) gauge symmetry." Whether that is enough "reality" to satisfy a philosopher is debatable, but for a physicist, it is usually enough to get out of bed in the morning.

  Given your background, you might find it interesting that Poincaré's "Conventionalism" (the idea that some axioms are chosen for convenience rather than truth) is lurking behind this. He views the "images" (ether vs. field) as conventions, but the "relations" as the empirical content. It is a sophisticated middle ground between "Science tells us exactly what exists" and "Science is just a useful fiction."
