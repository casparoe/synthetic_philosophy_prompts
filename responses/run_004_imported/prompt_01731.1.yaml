      *   This is crucial. He isn't a full anti-realist. He believes in "real objects" (Nature hides them). He believes we can't know *what* they are, only *how they relate*.
      *   This distinguishes him from a pure instrumentalist who says "there are no real objects, just predictions."

  9.  **Refining the "Bankruptcy" Argument:**
