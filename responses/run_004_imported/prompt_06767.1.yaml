          *   Frankfurt/Compatibilist reply: The alternative isn't *robust*. It doesn't ground responsibility.
          *   Status: Mostly considered a stalemate or a victory for Frankfurt *if* one accepts robustness conditions.
      *   **The Prior Sign Objection (The Dilemma Defense):**
          *   Explain the mechanism: Black needs a sign to know when to intervene.
          *   The Dilemma (Widerker's formulation):
              *   Horn 1: The sign is causally sufficient (Determinism). If so, Jones isn't free anyway, so the case begs the question against libertarians.
              *   Horn 2: The sign is not causally sufficient (Indeterminism). If so, Jones could have done otherwise despite the sign, meaning Black might intervene unnecessarily, or the case fails to rule out AP.
          *   Why it matters: It attacks the *coherence* of the case itself, not just the interpretation of alternatives.
      *   **Comparison:**
          *   Flicker: Accepts the case works but argues PAP still holds (because alternatives exist).
          *   Prior Sign/Dilemma: Argues the case *doesn't work* as constructed (either it's deterministic or it fails to eliminate alternatives).
          *   Which is bigger? The Dilemma Defense is generally seen as more damaging because it challenges the logical possibility of the counterexample, whereas Flicker just argues over the definition of "alternative."
