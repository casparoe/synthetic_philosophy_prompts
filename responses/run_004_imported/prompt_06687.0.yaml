prompt: |-
  I serve on the scientific advisory panel of a national research agency that funds several centuries-scale "civilizational continuity" programs, including a global seed vault and a deep-space settlement feasibility study. A commissioned report recommends defunding the longest-horizon programs, invoking the Doomsday Argument in its Carter-Leslie form: our position in the sequence of all humans who will ever be born should be treated as a random draw, so we should update sharply against very long human futures. It proposes an extra tenfold discount on any benefit accruing more than two centuries out. The panel is split: some think the report leans on an inference that the reference-class problem and the Self-Indication Assumption already undercut; others think those responses are no better off, given the Self-Indication Assumption's own "presumptuous philosopher" problem, and that rejecting a serious Bayesian argument merely because its conclusion is unwelcome isn't intellectually honest. Please draft the panel's short recommendation memo: state clearly whether, and with what parameters, the extra discount should be adopted, note when the panel should revisit the question, and take seriously the strongest version of whichever side you don't recommend.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Scientific Advisory Panel for a national research agency.
      *   **Context:** The agency funds centuries-scale "civilizational continuity" programs (seed vault, deep-space settlement).
      *   **Trigger:** A commissioned report recommends defunding long-horizon programs based on the Doomsday Argument (Carter-Leslie form). It proposes a 10x discount on benefits >200 years out.
      *   **Conflict:** Panel is split.
          *   Side A: Rejects Doomsday Argument (Reference Class Problem, Self-Indication Assumption [SIA]).
          *   Side B: Accepts Doomsday Argument (SIA has "Presumptuous Philosopher" problem, rejecting Bayesian updates due to uncomfortable conclusions is dishonest).
      *   **Task:** Draft a short recommendation memo.
      *   **Requirements:**
          *   State clearly whether the extra discount should be adopted (and parameters).
          *   Note when to revisit the question.
          *   Take seriously the strongest version of the *non-recommended* side (steel-manning).
          *   Tone: Professional, scientific, advisory, balanced but decisive.

  2.  **Evaluate the Arguments (Internal Deliberation):**
      *   *The Doomsday Argument (DA):* Suggests that being born early in the sequence of all humans implies the total sequence is likely short. It's a probabilistic argument based on self-location.
      *   *Counter-arguments (Side A):*
          *   *Reference Class Problem:* Who counts as "human"? Cyborgs? AI descendants? This makes the "sequence" ill-defined.
          *   *Self-Indication Assumption (SIA):* You are more likely to exist in a universe with more observers. This cancels out the DA.
      *   *Counter-counter-arguments (Side B):*
          *   *Presumptuous Philosopher:* SIA implies we can know a priori that the universe is infinite/large just because we exist, which seems absurd.
          *   *Bayesian Honesty:* Ignoring a formal probabilistic argument because it predicts doom is bias.
      *   *Policy Implication:* Applying a specific "Doomsday Discount" to funding decisions is highly unconventional. Standard cost-benefit analysis already uses discount rates (economic). This is an *existential* discount based on anthropic reasoning.
      *   *Decision:* Most experts in existential risk and anthropology do *not* treat the Doomsday Argument as settled science sufficient to dictate funding policy, especially given the high stakes of civilizational continuity. The "Reference Class" issue is particularly fatal for policy application (we don't know what future beings look like). However, the *uncertainty* about long-term survival is real and should be modeled, just not via a rigid anthropic discount.
      *   *Recommendation:* Do not adopt the specific 10x anthropic discount. Instead, rely on standard risk-adjusted discounting that accounts for existential risk probabilities directly, rather than via anthropic self-location. Revisit when anthropic reasoning is more settled.
      *   *Steel-manning the Minority:* Acknowledge that ignoring DA might be complacency. The "Presumptuous Philosopher" objection to SIA is strong. We must ensure we aren't just wishful thinking.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The bottom line (Reject the specific discount, maintain funding, adjust risk modeling).
      *   **Analysis of the Commissioned Report:** Acknowledge the logic but highlight limitations (Reference Class, SIA vs. SSA).
      *   **Decision & Parameters:** No 10x discount. Use standard existential risk probabilities.
      *   **Steel-man of the Dissent:** Acknowledge the Bayesian force of the DA and the SIA problems.
      *   **Revisit Trigger:** When anthropic reasoning reaches consensus or new data emerges.
      *   **Conclusion:** Final commitment.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Subject:* Needs to be formal. "Recommendation on Long-Horizon Program Funding and Anthropics."
      *   *Opening:* State the recommendation immediately. We are not adopting the Carter-Leslie discount.
      *   *Rationale:* Why? The Reference Class problem makes the "sequence of humans" undefined for policy. SIA counters DA, even if SIA has issues. Policy requires robustness, not controversial metaphysics.
      *   *The "Other Side" (Steel-man):* I need to show we listened to Side B. The DA is a valid Bayesian update. SIA *does* lead to the Presumptuous Philosopher problem (believing in infinite universes without evidence). Ignoring DA because it's scary is bias. *Action:* We will incorporate existential risk probabilities explicitly instead of anthropic discounts. This addresses the risk concern without the metaphysical baggage.
      *   *Revisit:* When philosophical consensus shifts or if empirical data on existential risk changes drastically.
      *   *Tone Check:* Is it too academic? Needs to be actionable for an agency. Is it too dismissive? Needs to respect the intellectual weight of the DA.

  5.  **Refining the Argument (Self-Correction):**
      *   *Critique:* Simply saying "Reference Class is hard" might sound like an excuse.
      *   *Fix:* Emphasize that policy requires *operationalizable* metrics. "Human" is not operationalizable over 10,000 years (post-biological?).
      *   *Critique:* The prompt asks to take seriously the strongest version of the side *not* recommended.
      *   *Fix:* Dedicate a specific paragraph to the "Bayesian Honesty" argument. Admit that SIA is controversial and that the DA highlights a genuine vulnerability in long-term planning (complacency).
      *   *Decision:* The recommendation should be to *reject* the specific 10x anthropic discount but *increase* scrutiny on existential risk probabilities (which achieves a similar practical effect without the metaphysical baggage). This bridges the gap.

  6.  **Final Polish:** Check constraints.
      *   Short memo? Yes.
      *   Clear recommendation? Yes.
      *   Parameters? Yes (standard discounting + explicit x-risk).
      *   Revisit date? Yes.
      *   Steel-man minority? Yes.

  7.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, National Research Agency
  **FROM:** Scientific Advisory Panel on Civilizational Continuity
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Anthropics-Based Discounting on Long-Horizon Programs

  **Executive Summary**
  The Panel recommends **against** adopting the commissioned report's proposal to apply an extra tenfold discount on benefits accruing more than two centuries out based on the Carter-Leslie Doomsday Argument (DA). While the DA presents a rigorous Bayesian challenge to long-term forecasting, it relies on metaphysical assumptions regarding observer reference classes that are currently too unstable for operational funding policy. Instead, the Agency should maintain current funding levels for civilizational continuity programs but adjust project evaluations to explicitly model existential risk probabilities independent of anthropic reasoning.

  **Rationale for Recommendation**
  The Panel finds that applying the DA as a fiscal discount rate is premature for three reasons:
  1.  **The Reference Class Problem:** The DA requires a well-defined sequence of "observers." Over centuries-scale horizons, the definition of "human" or "observer" is fluid (e.g., biological modifications, digital substrates). Without a stable reference class, the probabilistic update cannot be consistently calculated.
  2.  **Competing Anthropics:** The Self-Indication Assumption (SIA) offers a formal counter to the DA, suggesting that our existence is evidence for a larger total population of observers. While SIA is not without flaws, its existence prevents the DA from being a settled scientific consensus required to justify defunding.
  3.  **Policy Robustness:** Funding decisions should rest on empirical risk assessments (e.g., nuclear war, biotech risk, AI alignment) rather than self-location probabilities. A discount based on *why* we might go extinct (anthropics) conflates distinct categories of uncertainty compared to *whether* we might go extinct (empirical risk).

  **Engagement with Dissenting Views**
  The Panel takes seriously the minority view that rejecting the DA constitutes intellectual dishonesty driven by outcome bias. We acknowledge the strength of the following arguments:
  *   **Bayesian Consistency:** The DA is a valid application of Bayesian updating on indexical information. To ignore it simply because it implies a grim future risks insulating our planning from uncomfortable probabilistic realities.
  *   **SIA Limitations:** We recognize that the primary counter-argument (SIA) generates the "Presumptuous Philosopher" problem, wherein one infers a vast universe a priori merely from one's existence. This is a significant theoretical vulnerability. If SIA is rejected, the DA's force returns.
  *   **Complacency Risk:** The minority correctly notes that assuming a long future without penalizing for our current early position may foster complacency in risk mitigation.

  To address these valid concerns without adopting the contested anthropic discount, the Panel mandates that all long-horizon grant applications must now include an **Explicit Existential Risk Sensitivity Analysis**. This requires applicants to quantify how their project reduces specific empirical extinction probabilities, ensuring that the "risk of doom" is priced in via concrete mechanisms rather than abstract observer selection effects.

  **Parameters and Review**
  *   **Discount Rate:** No additional anthropic discount will be applied. Standard economic discount rates apply, adjusted only by the Explicit Existential Risk Sensitivity Analysis described above.
  *   **Revisit Trigger:** This question shall be revisited if:
      1.  A consensus emerges in the fields of anthropic reasoning and decision theory resolving the conflict between the Self-Sampling Assumption and SIA; or
      2.  Empirical data regarding global catastrophic risk shifts by more than one order of magnitude.
  *   **Timeline:** A mandatory review of this policy is scheduled for five years from the date of this memo.

  **Conclusion**
  We cannot treat a controversial philosophical inference as a definitive actuarial table. However, we must not let the rejection of the Doomsday Argument become an excuse for optimism bias. By focusing on empirical risk reduction rather than anthropic discounting, we honor the Bayesian imperative to update on evidence while maintaining the operational stability required for centuries-scale research.

  **Approved by:**
  Scientific Advisory Panel on Civilizational Continuity
