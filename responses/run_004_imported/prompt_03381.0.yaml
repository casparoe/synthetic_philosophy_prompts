prompt: |-
  quick decision theory one: parfit's hitchhiker. you're dying of thirst in the desert; a driver will only give you a lift into town if she predicts you'll pay her $100 once you get there, and once you're actually in town, paying does nothing further for you. the usual take (especially in rationalist/decision theory circles) is that this shows causal decision theory is broken, since CDT says dont pay once you're safe, and real rationality requires becoming disposed to pay even though its against your narrow interest in the moment -- people call this rational irrationality. i want you to argue against that.

  make the strongest case that the CDT agent who refuses to pay in town isn't irrational at all, and that the standard "but you'd want to be the kind of agent who pays" move doesn't actually rescue the in-the-moment choice -- it just quietly switches to a different question (what policy to commit to beforehand). engage directly with mcclennen's resolute choice and gauthier-style constrained maximization, dont just say "well FDT/UDT solves it" and call it a day.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** Parfit's Hitchhiker problem in decision theory.
      *   **Standard View:** Causal Decision Theory (CDT) fails because it recommends *not* paying once in town (defecting), leading to being left in the desert. Rationality requires a disposition to pay (Rational Irrationality / Precommitment).
      *   **Task:** Argue *against* the standard view. Defend the CDT agent who refuses to pay in town as *not irrational*.
      *   **Key Constraint:** Do not simply pivot to Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) as the "solution." Engage with McClennen's Resolute Choice and Gauthier's Constrained Maximization.
      *   **Core Argument:** The "wanting to be the kind of agent who pays" move switches the question from *action* to *policy/precommitment*. The in-the-moment choice to defect is locally rational.

  2.  **Deconstruct the Standard Critique of CDT:**
      *   *Scenario:* Desert -> Prediction -> Ride -> Town -> Payment Decision.
      *   *CDT Logic:* At the payment node, the ride is already secured (sunk cost). Paying costs $100, not paying costs $0. Causal impact of paying on being picked up is zero (it's in the past). Therefore, Don't Pay.
      *   *Critique:* If the driver knows you're a CDT agent, she predicts you won't pay, so she doesn't pick you up. You die. Therefore, CDT leads to suboptimal outcomes.
      *   *Counter-Critique (My Task):* Why is the *choice at the node* not irrational?

  3.  **Brainstorming Arguments for CDT Rationality:**
      *   **Separation of Stages:** Decision theory evaluates choices *at the time of choice*. At the time of payment, the past is fixed. Maximizing utility *now* means keeping the $100.
      *   **The "Tax on Rationality" vs. "Definition of Rationality":** Is rationality about winning (outcome) or reasoning correctly given available information? CDT reasons correctly given the causal structure *at that moment*.
      *   **Precommitment is the Real Solution, Not "Rational Irrationality":** The problem isn't the choice in town; it's the lack of binding precommitment earlier. If you can't precommit, you aren't "irrational" for failing to do the impossible (changing the past).
      *   **McClennen's Resolute Choice:** McClennen argues for sticking to a plan even when preferences shift. *Counter:* This requires a metaphysical view of agency that treats plans as binding across time in a way that violates dynamic consistency. It's a *different* theory of agency, not a correction of CDT's logic.
      *   **Gauthier's Constrained Maximization:** Gauthier argues it's rational to be disposed to cooperate. *Counter:* This conflates *being* a certain type with *choosing* a certain action. It's a category error. Dispositions are selected *ex-ante*; actions are selected *ex-post*.
      *   **The "Money Pump" Defense:** CDT isn't money-pumped *within* the scenario. It only loses if the scenario includes a predictor *before* the choice. But the choice itself remains causally isolated.

  4.  **Developing the Core Thesis:**
      *   *Thesis:* CDT is a theory of *choice*, not a theory of *outcome optimization across time without binding mechanisms*. The Hitchhiker case highlights a limitation in *control*, not a flaw in *reasoning*. The agent in town is causally severed from the pickup. Blaming them for not paying is like blaming someone for not changing the weather.
      *   *Key Distinction:* **Ex-ante Rationality (Policy)** vs. **Ex-post Rationality (Action)**. The standard critique conflates these.

  5.  **Engaging McClennen (Resolute Choice):**
      *   McClennen says: Stick to the plan even if your current preferences say otherwise.
      *   Critique: This requires "resolute" agency that overrides current utility maximization. But *why* is that rational? It essentially posits a "plan utility" that trumps "outcome utility." This isn't fixing CDT; it's rejecting the premise that agents maximize utility at the node. It's a philosophical stipulation, not a derivation. It solves the problem by fiat: "You must follow the plan." But CDT asks "What maximizes utility *now*?" Resolute choice changes the question.

  6.  **Engaging Gauthier (Constrained Maximization):**
      *   Gauthier says: It's rational to cultivate a disposition to keep agreements (Constrained Maximizer) rather than maximize straight (Straightforward Maximizer).
      *   Critique: Gauthier shifts the locus of rationality to *disposition selection*. But in the Hitchhiker case, the disposition is already fixed when you are in town. If you are a Straightforward Maximizer (CDT agent), you can't *become* a Constrained Maximizer at the payment node. Gauthier admits the CM gets the ride, but he struggles to explain why the CM *pays* at the node without smuggling in a commitment that looks irrational from a strict utility perspective. He essentially argues that the *person* is rational, not necessarily the *act* in isolation. This supports my point: the standard critique attacks the *act*, but rationality belongs to the *policy*.

  7.  **Structuring the Argument:**
      *   **Introduction:** State the contrarian position. CDT's recommendation in town is locally rational. The failure is in the *setup* (lack of precommitment), not the *logic*.
      *   **Point 1: The Causal Severance (The "Sunk Cost" Defense).** At the moment of payment, the past is fixed. Paying has no causal upside. Refusing is strictly dominant. Calling this irrational confuses "bad outcome" with "bad reasoning."
      *   **Point 2: Ex-Ante vs. Ex-Post Rationality.** The standard critique conflates choosing a policy (before the desert) with choosing an action (in town). CDT is a theory of action. If you want policy optimization, use a different tool (precommitment), don't blame the action-guidance system.
      *   **Point 3: Critique of McClennen.** Resolute choice is a different metaphysics of agency, not a correction of decision theory. It demands dynamic inconsistency (ignoring current preferences). That's not "rationality," it's "binding."
      *   **Point 4: Critique of Gauthier.** Constrained Maximization moves the goalposts to *dispositions*. But a disposition doesn't causally force the hand at the node. If the agent is truly maximizing utility at the node, Gauthier's CM collapses into CDT unless we assume the disposition *is* the utility function (which changes the problem).
      *   **Conclusion:** The Hitchhiker problem shows the value of precommitment devices, not the failure of CDT. The agent in town is a prisoner of their past self, not a victim of irrationality.

  8.  **Refining the Tone:**
      *   Needs to be philosophical, rigorous, but accessible.
      *   Avoid dismissing CDT as "obviously right," but rather frame it as "correctly defined for its scope."
      *   Ensure I don't slip into FDT/UDT arguments (e.g., "your decision determines the prediction"). I must stick to the causal timeline.

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I accidentally argue FDT?
      *   *Correction:* Ensure I emphasize that the prediction is *already made* and *causally independent* of the current choice. FDT says your choice *logically* determines the prediction. I must argue that *causally* it does not, and CDT is right to care about causality.
      *   *Check:* Did I address McClennen/Gauthier specifically?
      *   *Correction:* Make sure to name-drop and engage their specific mechanisms (resoluteness vs. disposition).
      *   *Check:* Is the distinction between Policy and Action clear?
      *   *Correction:* Use the terms "Ex-ante" and "Ex-post" explicitly.

  10. **Final Polish:** Strengthen the closing argument. The "Rational Irrationality" label is a category error. It's actually "Instrumental Limitation."

  *(Self-Correction Note)*: Wait, I need to be careful not to sound like I'm saying CDT is *better* overall, just that the specific charge of *irrationality at the node* is wrong. The prompt asks to argue the CDT agent *isn't irrational at all*. I need to defend the rationality of the defection.

  Okay, let's write it.
answer: |-
  The standard narrative surrounding Parfit's Hitchhiker is that it exposes a fatal flaw in Causal Decision Theory (CDT): by recommending defection (refusing to pay) once safely in town, CDT ensures the agent is never picked up in the first place. The consensus in many rationalist circles is that this proves CDT is self-defeating, and that true rationality requires a "disposition to pay" even when it is causally futile—a notion often dubbed "rational irrationality."

  I argue this consensus is mistaken. It rests on a category error that conflates **ex-ante policy optimization** with **ex-post action rationality**. The CDT agent who refuses to pay in town is not irrational; they are responding perfectly rationally to the causal structure present at the moment of choice. The failure lies not in the decision theory, but in the agent's inability to bind their future self. Attempts to rescue the "pay" action via McClennen's resolute choice or Gauthier's constrained maximization do not fix CDT; they quietly change the subject from *choice* to *constitution*.

  ### 1. The Causal Severance and the Definition of Rational Choice

  To call an action "irrational" is to claim the agent failed to reason correctly given their information and goals. In the Hitchhiker scenario, we must distinguish between two distinct temporal nodes:
  1.  **Node A (Desert):** The driver decides whether to pick you up based on a prediction.
  2.  **Node B (Town):** You decide whether to pay $100.

  When the CDT agent arrives at Node B, the prediction at Node A is a **fixed fact of the past**. Causality flows forward. Your action at Node B cannot causally influence the driver's decision at Node A. Therefore, at Node B, the payoff matrix is simple:
  *   **Pay:** -$100 utility.
  *   **Don't Pay:** $0 utility.
  *   **Survival:** Already secured (sunk cost).

  For a CDT agent, rationality is defined as choosing the action that maximizes expected utility *given the causal consequences of that action*. Since paying has no causal power to retroactively secure the ride, paying is strictly dominated. To call this "irrational" is to redefine rationality not as *correct reasoning about consequences*, but as *guaranteed winning outcomes regardless of causal leverage*.

  If I bet on a horse that has already finished the race, but I don't know the result yet, betting on the loser is irrational. If I know the horse lost, but I bet on it anyway hoping to "change the past," *that* is irrational. The standard critique of CDT demands the latter: it asks the agent in town to act *as if* their payment influences the past prediction. CDT rightly identifies this as magical thinking. The agent isn't irrational for failing to perform magic; they are merely causally powerless.

  ### 2. The Ex-Ante/Ex-Post Conflation

  The standard critique argues: "You would want to be the kind of agent who pays." This is true, but it is an **ex-ante** claim (before the desert). The CDT failure is an **ex-post** reality (in the town).

  The move from "You should want to be disposed to pay" to "You should pay" is a sleight of hand. It shifts the locus of rationality from the *agent's design* to the *agent's specific action*.
  *   **Ex-Ante Rationality:** It is rational to precommit to paying. If you have a binding contract, a reputation mechanism, or a psychological compulsion, you should use it.
  *   **Ex-Post Rationality:** If you lack those mechanisms, it is rational to defect.

  The "Rational Irrationality" label attempts to bridge this gap by suggesting that a rational agent *must* act against their ex-post interests to satisfy ex-ante optimality. But this implies that rationality requires **dynamic inconsistency**. It demands that at Node B, you ignore your current preferences and causal reality to satisfy the preferences of your past self.

  This is not a defense of CDT's failure; it is an admission that CDT is a theory of *choice*, not a theory of *self-binding*. If you cannot bind yourself, you cannot force the future you to act against their interests. Blaming the future you for this is like blaming your hand for not lifting a weight that is too heavy. The limitation is in the *mechanism of control*, not the *logic of the agent*.

  ### 3. Against McClennen's Resolute Choice

  Edward McClennen, in *Rationality and Dynamic Choice*, attempts to solve this by advocating for **Resolute Choice**. He argues that a rational agent should stick to a plan even when their preferences shift at the moment of execution. The resolute chooser picks up the hitchhiker plan in the desert and executes it in town, ignoring the new incentive to defect.

  However, McClennen's solution does not vindicate the *action* of paying as causally rational; it vindicates it only by **stipulating a new metaphysics of agency**. McClennen essentially argues that "following the plan" has intrinsic utility that overrides the utility of money.

  But this begs the question. Why is following the plan rational *at the node*?
  *   If it is rational because it leads to better outcomes, we are back to square one: the outcome is already determined at Node B.
  *   If it is rational because "plans are binding," McClennen is no longer doing decision theory; he is doing moral philosophy or constitutional law.

  Resolute choice solves the Hitchhiker problem by **forbidding** the agent from re-evaluating the decision at Node B. It declares the Node B choice an illusion. But CDT is precisely a theory for agents who *do* re-evaluate based on current causal leverage. To say CDT is broken because it doesn't act like a Resolute Chooser is like saying Newtonian physics is broken because it doesn't account for magic. McClennen doesn't show the CDT agent is irrational; he shows that a *different kind of agent* (one who treats plans as causal levers) wins more often. That is a critique of the agent's *capabilities*, not their *reasoning*.

  ### 4. Against Gauthier's Constrained Maximization

  David Gauthier, in *Morals by Agreement*, offers a similar but distinct approach: **Constrained Maximization (CM)**. He argues it is rational to cultivate a *disposition* to cooperate (be a CM) rather than a disposition to maximize straight (be a Straightforward Maximizer/SM). The CM gets the ride; the SM dies in the desert.

  Gauthier's argument is powerful at the **disposition selection** stage (ex-ante). However, it falters when explaining the **action** stage (ex-post). Gauthier tries to argue that the CM agent pays in town *because* they are disposed to, and being disposed is rational.

  But this creates a dilemma:
  1.  **If the disposition is merely a prediction tool:** The driver picks you up because she thinks you're CM. But once in town, if you are truly rational and the disposition isn't a physical constraint, you defect. Gauthier admits this is the "reminiscence problem."
  2.  **If the disposition is a physical constraint:** Then you aren't "choosing" to pay; you are *compelled* to pay.

  Gauthier tries to have it both ways: he wants the agent to be free enough to be moral, but bound enough to be trusted. In the Hitchhiker case, this collapses. If the agent in town has the capacity to choose (i.e., they are not physically forced), and paying costs $100 with no return, Gauthier cannot explain why the *act* of paying is rational without smuggling in the ex-ante benefits that are no longer accessible.

  Gauthier successfully argues that it is rational to *be* a payer. He fails to prove it is rational to *pay* when the being is already established and the causal leverage is gone. The CDT agent who defects is simply an agent whose disposition was not sufficiently binding. That is a failure of **character engineering**, not **decision logic**.

  ### 5. Conclusion: The Prisoner of Time

  The Hitchhiker problem is not a paradox of rationality; it is a tragedy of **temporal fragmentation**. You are not one agent; you are a sequence of temporal slices. The "Desert You" wants "Town You" to pay. "Town You" has no incentive to comply.

  CDT accurately models the perspective of "Town You." It correctly identifies that the causal strings connecting the payment to the pickup have been severed by time. The standard critique—that this makes CDT irrational—relies on a "view from nowhere" that aggregates the utility of Desert You and Town You into a single bucket. But decision theory guides *action*, and action happens *now*.

  To claim the CDT agent is irrational is to claim that an agent is responsible for the limitations of their own causal history. It is to demand that they act as if they have control over the past. McClennen and Gauthier offer ways to *simulate* that control through resolute plans or cultivated dispositions, but these are precommitment strategies, not corrections to the logic of choice.

  The CDT agent in town is not irrational. They are simply a prisoner of their past self's inability to bind them. The lesson of Parfit's Hitchhiker is not that CDT is broken, but that **without binding precommitment, rational agents are doomed to be untrustworthy.** That is a limitation of the human condition, not a flaw in the math of causality.
