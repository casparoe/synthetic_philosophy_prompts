  I've been kind of obsessed with the "handicap principle" lately after falling down a youtube rabbit hole about animal signaling (peacock tails, gazelles stotting at cheetahs, all the Zahavi stuff). But theres something that bugs me and I can't tell if I'm missing something obvious. Is it actually true that a signal has to be costly to be honest? Like a stag's roar apparently tells you how big it is just because of the physics of its throat, no extra cost required - so doesn't that mean "it has to be costly" isn't really the right rule, just one way honesty can happen?

  Can you write me a dialogue between two people who both really know this stuff, arguing it out - one taking the hard line that real cost is what makes a signal trustworthy, the other saying that's basically a myth and honesty just requires that cheating doesn't pay, cost or no cost. I want real back and forth where they actually respond to each other's points, not just two people repeating themselves past each other, and neither one should obviously be the "correct" one from the get-go.
