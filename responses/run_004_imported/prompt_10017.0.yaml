answer: |-
  This is one of the sharpest questions in meta-ethics. You've correctly identified the heart of the Frege-Geach problem: it's not just that expressivism struggles to explain the *meaning* of embedded sentences, but that it seems to destroy the *logic* connecting them. If "lying is wrong" means "Boo lying!" in the first premise, but loses that "Boo!" force in the "If..." clause of the second premise, you're committing the fallacy of equivocation. The argument becomes invalid.

  To rescue validity without smuggling in cognitivism (truth-apt facts), **Allan Gibbard's norm-expressivism (specifically his planning account)** is arguably the "cleaner" mechanical fix, even if the jargon ("hyperplans") is dense. Blackburn is more poetic, but Gibbard is more rigorous on the logic.

  Here is the gut-level walkthrough of how Gibbard's solution preserves *modus ponens* without secretly turning moral claims into facts.

  ### 1. The Shift: From "Truth" to "Consistency of Plans"

  The cognitivist says logic works because of **truth preservation**.
  *   If $P$ is True, and $P \to Q$ is True, then $Q$ *must* be True.

  Gibbard says: Forget truth. Moral judgments aren't beliefs about the world; they are **states of planning**. To judge "Lying is wrong" is to **plan to feel guilt** (or blame) regarding lying.

  So, how does logic work for plans? It works through **consistency**.
  *   You can't plan to go to Paris and plan to stay home tonight without being irrational. Your plans clash.
  *   Gibbard argues that logical validity isn't about preserving a property called "truth"; it's about **avoiding a clash of mental states.**

  ### 2. Walking Through Your Example

  Let's look at your *modus ponens* argument through Gibbard's lens.

  **The Argument:**
  1.  Lying is wrong.
  2.  If lying is wrong, then getting your little brother to lie is wrong.
  3.  Therefore, getting your little brother to lie is wrong.

  **The Cognitivist Translation (The "Smuggled" Version):**
  1.  It is a **fact** that lying is wrong.
  2.  It is a **fact** that (if it is a fact lying is wrong, then it is a fact brother-lying is wrong).
  3.  Therefore, it is a **fact** that brother-lying is wrong.
  *(Validity is preserved because "fact" stays the same.)*

  **The Gibbard/Expressivist Translation (The "Plan" Version):**
  1.  **Plan:** I plan to feel guilt/blame about lying.
  2.  **Plan:** I plan that *in any situation where* I feel guilt about lying, I must also feel guilt about getting my brother to lie.
  3.  **Conclusion:** I plan to feel guilt/blame about getting my brother to lie.

  ### 3. How the Conditional ("If...") Works Without Truth

  This is the magic trick. In standard logic, "If P then Q" is a truth-function. For Gibbard, "If lying is wrong, then X" is a **higher-order plan**.

  Think of a "hyperplan" as a complete book of instructions for every possible situation you might encounter.
  *   **Premise 1** says your book has an entry: "Situation: Someone lies. Instruction: Blame them."
  *   **Premise 2** says your book has a rule: "Constraint: If your book says 'Blame liars,' it must also say 'Blame brother-encouragers'."

  When you accept Premise 2, you aren't stating a fact about the universe. You are **adopting a constraint on your own planning system.** You are saying, "I forbid myself from having a plan that blames lying but permits encouraging lying."

  ### 4. Where Validity Comes From (The "Gut" Mechanism)

  So, why is the argument valid? Why *must* you accept the conclusion if you accept the premises?

  It's not because the conclusion is "true." It's because **rejecting the conclusion while accepting the premises makes your mind fracture.**

  If you say:
  *   "Yes, I plan to blame liars." (Premise 1)
  *   "Yes, I plan that if I blame liars, I blame brother-encouragers." (Premise 2)
  *   "But I do *not* plan to blame brother-encouragers." (Denial of Conclusion)

  You are not contradicting a fact. You are creating **inconsistent plans**. You are practically irrational. It's like saying, "I plan to eat dinner," and "I plan that if I eat dinner, I use a fork," but "I plan not to use a fork."

  The "validity" is the **inescapability of the inconsistency.** You literally cannot hold those three mental states simultaneously without your planning system breaking down. Gibbard rescues logic by grounding it in the **psychology of rational agency** rather than the **metaphysics of truth.**

  ### 5. Addressing the "Smuggling" Worry

  This is your main concern: *Isn't "consistency of plans" just "truth" in a cheap tuxedo?*

  It feels like smuggling because the *structure* is identical.
  *   Truth-Logic: $P$ and $P \to Q$ cannot be True while $Q$ is False.
  *   Plan-Logic: I cannot Plan $P$ and Plan $P \to Q$ while Not-Planning $Q$.

  **Why it isn't smuggling:**
  1.  **Direction of Fit:** Beliefs (truth-apt) try to match the world (Mind $\to$ World). If the world doesn't match, the belief is false. Plans try to match the world to them (World $\to$ Mind). If the world doesn't match, the *world* is to be changed (or the plan is frustrated).
  2.  **No Truth Conditions:** For Gibbard, there is no "fact of the matter" that makes the plan correct. There is only whether the plan is consistent with your other plans. A cognitivist says "Lying is wrong" is true because of *wrongness properties*. Gibbard says "Lying is wrong" is valid because of *planning consistency*.
  3.  **The "Isomorphism" Defense:** Gibbard admits the logic *looks* like truth-logic. He calls this **isomorphism**. Expressivists "earn the right" to talk like realists (using words like "true," "valid," "fact") because our planning states behave *structurally* like belief states, even though they *functionally* aren't.

  ### Summary

  Gibbard saves *modus ponens* by changing the definition of validity.
  *   **Old Validity:** Preserving **Truth**.
  *   **New Validity:** Avoiding **Plan-Clashes**.

  In your example, the argument is valid not because the conclusion corresponds to reality, but because **accepting the premises and rejecting the conclusion is a form of practical insanity.** You are planning to do $A$, planning that $A$ requires $B$, but refusing to plan $B$.

  It avoids smuggling truth because "irrational planning" is a psychological description, not a metaphysical claim about moral facts. You aren't discovering a moral truth; you are tightening the screws on your own will.
