answer: |-
  **MEMORANDUM**

  **TO:** Epistemics Working Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Prediction Market Liquidity and Structure

  ### Executive Summary

  Our internal prediction market is currently failing to serve its primary function: providing leadership with early, actionable signal on project viability. Volume is chronically thin, and prices remain stagnant until immediately before resolution, at which point informed traders correct the market. This is a classic manifestation of the No-Trade Theorem: uninformed staff correctly infer that any counterparty willing to trade at a stale price likely possesses superior information, leading to a liquidity freeze.

  After evaluating the three proposed paths—Status Quo, Metaculus-style Tournament, or Subsidized Automated Market Maker (AMM)—I recommend we **implement a Subsidized Logarithmic Market Scoring Rule (LMSR) with a time-decaying liquidity parameter.**

  This approach directly resolves the adverse selection problem by providing a guaranteed counterparty, encouraging early price discovery. While there is a valid concern that this structure merely pays insiders to reveal information they otherwise would have withheld (subsidy leakage), we can mitigate this by structuring the subsidy to reward *timeliness* rather than just accuracy.

  ### Diagnosis: The Liquidity Freeze

  The current market pathology is economic, not cultural. Staff are not disengaged; they are rationally risk-averse.

  1.  **Adverse Selection:** In a peer-to-peer market, a limit order at 40% is an invitation. If no one takes it, it implies the market believes the true probability is lower. If an informed trader *does* take it, the uninformed trader loses "play-money" capital (and status).
  2.  **Information Cascades:** Because uninformed traders sit out, prices do not aggregate dispersed information early. Leadership sees a flat line for weeks, rendering the market useless for *greenlighting* decisions, which happen early in the project lifecycle.
  3.  **Status Quo Failure:** Asking leadership to "discount early prices" is an admission that the tool is broken. If the price is wrong for 90% of the project's life, it is not a forecasting tool; it is a post-mortem.

  ### Recommendation: Subsidized LMSR with Decaying Liquidity

  We should install an LMSR (Hanson, 2003) where the organization acts as the market maker, subsidizing the liquidity pool.

  **Why this over a Tournament (Metaculus-style)?**
  While scoring rules eliminate adverse selection, they remove the continuous price signal. Leadership is accustomed to consulting a "market price" as a summary statistic. Aggregating individual forecasts requires a different cognitive load and UI. The LMSR preserves the existing workflow while fixing the underlying liquidity engine.

  **Mechanism Design:**
  To prevent the subsidy from being exploited solely for late arbitrage, we will implement a **Time-Decaying Liquidity Parameter ($b$)**.
  *   **Early Phase (Weeks 1–3):** High liquidity ($b$ is high). The cost to move the price is low. The subsidy is generous. This encourages uninformed traders to speculate and informed traders to reveal signals early without moving the market too drastically.
  *   **Late Phase (Week 4–Resolution):** Low liquidity ($b$ is low). The cost to move the price becomes steep. The subsidy dries up. This makes it expensive for insiders to wait until the last minute to arbitrage the "true" value.

  ### Implementation Plan

  1.  **Technical Integration (Weeks 1–4):**
      *   Integrate an open-source LMSR module (e.g., Augur v2 core or custom Python script) into our internal dashboard.
      *   Configure the $b$ parameter to decay linearly or exponentially over the market lifespan.
      *   Set a hard cap on total subsidy loss per market to prevent runaway liability (even in play money, unlimited inflation devalues the currency).

  2.  **Policy & Communication (Weeks 5–6):**
      *   **Staff Memo:** Explicitly state that the "House" is now the counterparty. Emphasize that trading early is now safer than trading late.
      *   **Leadership Brief:** Train leadership on interpreting LMSR prices (specifically, that early prices are now *more* reliable than before, but still subject to volatility).

  3.  **Pilot (Week 7+):**
      *   Run the new mechanism on 3–5 high-stakes project greenlight markets.
      *   Review liquidity depth and price volatility after 30 days.

  ### Critical Risk: The "Subsidy Leakage" Argument

  The strongest argument against this recommendation is that **a subsidized market maker does not solve the No-Trade problem; it merely pays to route around it.**

  **The Critique:**
  Economic theory suggests that if we guarantee a counterparty, informed traders will simply wait until their information is most certain (just before resolution) and then extract the maximum subsidy from the AMM. Uninformed traders may still sit out, knowing the price is being propped up by a subsidy rather than peer consensus. In this scenario, we are not improving epistemics; we are simply transferring play-money wealth from the organization to the already-best-informed staff, without gaining earlier insight.

  **Why this is a serious concern:**
  If the subsidy is constant, there is no incentive for an insider to trade today when they could trade tomorrow with less risk. If the uninformed still feel they are trading against a "rigged" house (that always loses to insiders), they may disengage entirely, leaving the market as a playground for a few experts.

  **Mitigation Strategy:**
  We accept that *some* subsidy leakage is the "price of discovery," but we can minimize it through the **Time-Decaying Liquidity** design mentioned above.

  1.  **Incentivizing Timeliness:** By making liquidity cheap early and expensive late, we flip the insider's incentive. If they wait, their trade will move the price significantly against them (slippage), reducing their expected profit. To maximize return, they must trade while the subsidy is deep.
  2.  **Reputational Tagging:** We will publicly track "Early Mover Accuracy." If staff are seen as waiting until the last minute to arbitrage the house, their reputation as "forecasters" diminishes, even if their point total rises. We shift the status incentive from *profit* to *lead time*.
  3.  **Subsidy Caps:** By capping the total loss the AMM can incur per market, we limit the rent-seeking opportunity. Once the cap is hit, the market reverts to peer-to-peer (or closes), forcing insiders to trade before the pool empties.

  ### Conclusion

  The Status Quo guarantees we have no early signal. The Tournament model requires a cultural reset we may not have bandwidth for. The Subsidized LMSR fixes the liquidity freeze directly.

  While the risk of subsidy leakage is real, it is manageable. We are effectively proposing to spend play-money to purchase *timeliness*. By structuring the subsidy to decay, we ensure that we are paying for information when it is most valuable to leadership (at greenlighting), not when it is most certain (at resolution).

  I request approval to begin technical scoping for the LMSR integration immediately.
