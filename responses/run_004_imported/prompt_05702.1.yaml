      *Critique 2:* Better. But needs to be sharper on the math to satisfy the quants. The distinction between "expected value" and "growth rate" needs to be clear. The emotional payoff needs to land harder.

  7.  **Final Polish (incorporating constraints):**
      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 3 minutes = ~400-450 words.
      *   *Math Check:* Ensure I don't imply Kelly = 100% bet. Kelly = optimal fraction to maximize log wealth. In marriage terms = optimal investment of self to maximize shared life without burnout/ruin.
      *   *Emotional Arc:* Start intellectual, end deeply personal.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm explaining the math *to* the groom. I'm explaining it *for* the room, while acknowledging he knows it better than anyone.

      *Key Phrase to include:* "The single path you actually live." (From prompt).
      *Key Concept:* Ruin is absorbing. Once you hit zero, you don't come back. Marriage needs to avoid the absorbing state of divorce.

  8.  **Final Review against constraints:**
      *   3 mins? Yes.
      *   Ensemble vs. Time average doing work? Yes (framing marriage as a sequential game).
      *   No "All in" joke? Checked.
      *   No "Diversification" joke? Checked.
