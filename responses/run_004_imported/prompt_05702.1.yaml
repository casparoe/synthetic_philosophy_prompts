prompt: |-
  I write about science and ideas for a national magazine, and in three weeks I'm giving the best man's toast at the wedding of my closest friend from graduate school, now a quantitative trader who has spent the better part of a decade trying to convert everyone he knows to what he calls geometric rationality: the Kelly-criterion-derived view that a decision should be judged not by its expected value across some imagined ensemble of parallel worlds, but by the growth rate of the single path you actually live through time. He has made this case to me, unprompted, at two separate dinners, and he means every word of it. About a third of the guests are colleagues from his trading desk who will notice immediately if I get the idea wrong; the rest, including his new mother-in-law, have never heard of Kelly betting and just want a good toast. Please write it -- roughly three minutes, meant to be spoken aloud -- so that the distinction between ensemble averages and time averages is doing real work in what it says about commitment and marriage, rather than sitting there as trivia, and so that it never reaches for the two jokes that are easiest to make here and actually wrong on his own terms: praising him for "finally going all in," and calling the marriage his biggest diversification move yet.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Science/ideas writer for a national magazine. (Tone: Intelligent, articulate, thoughtful, but accessible).
      *   **Occasion:** Best Man's toast at a wedding.
      *   **Groom:** Closest friend from grad school, now a quantitative trader. Obsessed with "geometric rationality" / Kelly Criterion / Ergodicity (ensemble vs. time averages). He brings this up unprompted and means it deeply.
      *   **Audience:** 1/3 quant traders (will spot errors immediately), 2/3 normal people (including mother-in-law, need emotional resonance).
      *   **Constraints:**
          *   Roughly 3 minutes spoken (approx. 400-500 words).
          *   Must use the ensemble vs. time average distinction meaningfully (not just trivia).
          *   Connect it to commitment and marriage.
          *   **Forbidden Jokes:** Do *not* say he's "finally going all in" (Kelly is usually fractional betting, not all-in) and do *not* call marriage his "biggest diversification move" (Kelly/geom. rat. often concentrates on the best edge, and marriage is singular, not diversified).
      *   **Goal:** Honor the groom's intellectual passion while making it emotionally relevant to the bride and the occasion.

  2.  **Deconstruct the Core Concept (Geometric Rationality/Ergodicity):**
      *   *Ensemble Average:* What happens if 100 people take a risk once? (Expected Value).
      *   *Time Average:* What happens if one person takes a risk 100 times in a row? (Growth Rate).
      *   *The Trap:* Maximizing expected value can lead to ruin in the time average (gambler's ruin).
      *   *The Kelly Insight:* Optimize for the long-term growth of the *single* path you actually live. Avoid ruin. Compounding matters more than spikes.
      *   *Application to Marriage:* Marriage isn't about maximizing the "expected happiness" of a thousand hypothetical spouses. It's about optimizing the growth of *this* specific life path, together, without hitting "ruin" (divorce/breakdown). It's about compounding trust.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, the friendship, and the groom's specific intellectual quirk immediately. Establish credibility with the quants without alienating the family.
      *   **The Concept (Simplified):** Explain ensemble vs. time averages without jargon. Use the "100 people vs. 1 person 100 times" analogy.
      *   **The Pivot to Marriage:** How does this apply to love?
          *   *Avoid the "All-In" trap:* Kelly isn't about betting the farm on a hunch. It's about sustainable growth.
          *   *Avoid the "Diversification" trap:* Marriage is the opposite of diversification. It's concentration on one asset.
      *   **The Core Message:** Marriage is a time-average game. You live this life once, in sequence. You need to avoid ruin. You need compounding.
      *   **The Bride:** She is the partner in this path.
      *   **Closing:** A wish for their geometric growth.

  4.  **Refining the Tone:**
      *   Needs to sound spoken. Short sentences. Pauses.
      *   Needs to be warm, not a lecture.
      *   Must respect the groom's seriousness about the math. No mocking.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. I know [Groom] loves Kelly Criterion. He tells me at dinner. Most of you know what that is. For the rest, it's about not going broke. It's about time averages. In life, we don't get parallel universes. We get one timeline. Marriage is like that. You can't diversify your spouse. You have to grow together. If you blow up, game over. So optimize for the long run. To [Bride] and [Groom].

