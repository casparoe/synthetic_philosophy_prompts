  6.  **Drafting - Attempt 2 (Fleshing out):**
      (Start with the grad school connection). We studied together. Now he trades. He talks about ergodicity. What does that mean? It means the difference between the average of many worlds and the path of one world. In finance, if you risk too much, you go to zero. In marriage, if you risk the relationship for a short-term gain, you hit ruin.
