answer: |-
  Good evening. For those who don't know me, I'm [My Name]. I've known [Groom] since graduate school, back when our biggest risk was missing a deadline. Today, he manages risk for a living. And if you've had dinner with him in the last ten years, you know he manages something else, too: he manages our understanding of reality.

  Specifically, he insists we view life through the lens of geometric rationality. Now, for the quants at tables three and four, you know exactly what I mean. For the rest of us—including [Groom's] new mother-in-law—here is the translation.

  [Groom] argues that most people make decisions based on "ensemble averages." That's the expected value across a thousand parallel universes. It's the logic that says, "If I take this risk enough times, the odds say I win." But [Groom] reminds us, unprompted and often, that we don't live in an ensemble. We live in a single timeline. We face "time averages." We make a decision once, and then we live with the consequence, sequentially, until the end.

  In his world, if you optimize for the ensemble average without respecting the time average, you eventually hit ruin. You go to zero. And in a time-average game, zero is an absorbing state. You don't get to reset.

  I bring this up because marriage is the ultimate time-average game.

  It is tempting to think of love in terms of ensemble averages. We look at statistics. We look at the average happiness of couples. We look at the hypothetical paths not taken. But [Groom] knows better than anyone that those parallel worlds do not exist. There is only the path you walk together, day after day, compounding over time.

  I was told I should not say that today [Groom] is "finally going all in." That would be bad math. The Kelly criterion isn't about betting the farm on a hunch; it's about sizing your bet so you stay in the game long enough for the growth to work. And I was told not to call this his "biggest diversification move." Marriage isn't diversification. It is concentration. It is choosing one asset, one partner, one path, and committing to its growth through every volatility spike life throws at you.

  [Bride], you are the variable that makes this equation solvable. You are the partner who ensures that the growth rate remains positive, even when the market is down. You are the one who turns a risky trajectory into a sustainable path.

  [Groom], you have spent a decade teaching us that we must optimize for the single life we actually live. Today, you choose to live that single life with [Bride]. You are choosing to protect the partnership from ruin, so that you can maximize the compounding of joy, and trust, and history.

  So, let's raise a glass. Not to the expected value of this union, but to its geometric growth. Not to the parallel worlds where things might have worked out, but to this world, this path, and this time.

  To [Bride] and [Groom].
