answer: |-
  Here is an argument you can adapt for your chapter, structured to highlight the tension between the *motivation* for conciliationism and the *exception* required to save it.

  ### The Self-Undermining Argument and the Failure of the Fixed-Point

  The strongest case for conciliationism's self-undermining status rests on the universality of its own core motivation. Conciliationism is not merely a rule for handling disagreement; it is a thesis about the evidential significance of higher-order evidence (HOE). It claims that the discovery of peer disagreement constitutes potent evidence that you have made a mistake in your reasoning, evidence strong enough to mandate a shift in credence regardless of your first-order confidence. The problem is that the debate *about* conciliationism is itself a debate among peers involving higher-order evidence. When a steadfast peer rejects conciliationism, they are effectively testifying that the conciliationist has misinterpreted the evidential significance of disagreement.

  If the conciliationist accepts their own thesis, they must treat the steadfast peer's disagreement as evidence that conciliationism is false. To lower their credence in conciliationism significantly is to lower their confidence in the requirement to lower credence in cases of disagreement. This leads to a pragmatic self-defeat: if the view is true, accepting it rationally compels you to abandon it (or at least suspend it) in the face of the very disagreement the view identifies.

  Adam Elga's "fixed-point" maneuver attempts to halt this regress by stipulating that norms of reasoning (including how to handle disagreement) are exempt from the conciliatory requirement. He argues that you need a stable normative framework to even identify a disagreement as one requiring conciliation. However, this move fails to rescue the view because it violates the **Principle of Symmetry** that underwrites conciliationism in the first place. The conciliationist argues that on first-order matters (e.g., climate change, theology), you cannot privilege your own reasoning over a peer's without independent justification. Yet, by exempting the principle of conciliation itself, the conciliationist privileges their own normative reasoning over their peer's without independent justification.

  This creates a dilemma of arbitrariness. If the exemption is justified by the claim that "normative principles are special," the conciliationist owes an explanation of why *this* normative principle is special compared to others peers dispute (e.g., moral realism, logical pluralism). If no such explanation is given, the fixed-point exception functions as an ad hoc immunization strategy. It grants the conciliationist what we might call "epistemic sonder rights": the claim that while everyone else is fallible and subject to the equal-weight rule, the conciliationist is infallible (or at least exempt) regarding the rule that declares everyone fallible. This looks indistinguishable from the dogmatism of the flat-earther who refuses to conciliate on the reliability of their vision because "vision is the fixed point of my inquiry." Consequently, the fixed-point move saves the letter of conciliationism only by violating its spirit, leaving the view logically coherent but epistemically unmoored from the humility that motivated it.

  ***

  ### Bonus: Does Steadfastness Escape the Charge?

  Steadfastness largely escapes the *logical* charge of self-undermining, though it faces a different dialectical problem. A steadfast view (e.g., "stick to your guns if you've reasoned correctly") applies consistently to itself: if a steadfaster disagrees with a conciliationist about the norm of disagreement, the steadfaster checks their own reasoning, finds it sound, and maintains their position. There is no pragmatic self-defeat because the view does not mandate a credence shift that would undermine the view's own application. However, steadfastness faces a charge of **dialectical stagnation**. While it isn't self-undermining, it risks being question-begging in practice; it allows an agent to dismiss peer disagreement on the grounds that "I am right," which is precisely what the peer is disputing. So, while conciliationism collapses under its own weight, steadfastness stands firm but risks insularity. Conciliationism is self-destructive; steadfastness is self-sealing.
