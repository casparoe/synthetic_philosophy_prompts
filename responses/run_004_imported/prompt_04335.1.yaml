  8.  **Final Polish:** Check against constraints. (Only Leibniz's toolkit? Yes. Address the entomology? Yes. Address the deep time? Yes.)

  *(Self-Correction Note)*: Wait, I need to make sure I don't accidentally use Darwinian logic in Leibniz's mouth. Leibniz cannot argue that predation drives adaptation. He must argue that predation is a necessary feature of the *optimal static system* that unfolds over time. The "laws of motion" and "economy of nature" must necessitate it.

