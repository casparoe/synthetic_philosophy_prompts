      *   **Universal Harmony/Connection:** Everything is connected. Every monad mirrors the whole universe.
      *   **Pre-established Harmony:** No direct causal interaction, but synchronized by God.
      *   **Continuity/Plenitude:** The Great Chain of Being. No gaps. Nature makes no leaps.
      *   **Protogaea:** Leibniz *did* think about fossils and earth history. He believed in a "Mosaic physics" initially but moved toward naturalistic explanations for geological features, though still within a biblical timeframe (mostly). He didn't have deep time (millions/billions of years).
      *   **Animal Souls:** Leibniz believed animals had souls (monads), but they were not *rational* (not spirits). They don't have moral agency, but they do have perception and appetite.

  3.  **Address the Specific Challenge (Deep Time + Parasitism):**
      *   *Challenge:* 300 million years of parasitoid wasps eating caterpillars before humans existed. No moral agents to "learn" from this. No Fall to explain it.
      *   *Leibnizian Defense Strategy:*
          1.  **Metaphysical Evil is Primary:** Suffering is a result of finitude. Animals are finite monads. Their confusion/pain is a lowering of their perfection, but necessary for the variety of the whole.
          2.  **The Principle of Plenitude:** A rich universe requires every degree of being. Predation/parasitism might be necessary structural features to maintain population balance or ecological complexity, which contributes to overall harmony.
          3.  **No "Wasted" Time:** Time isn't a container; it's an order of succession. If the universe is better with a long history, then the long history is good. The "unwitnessed" part is tricky because for Leibniz, *all* monads witness the whole universe (confusedly). So, the suffering *is* witnessed by every other monad (including angels or future humans) in their perception.
