  Constraint: $P'(H|R) = q$.
  MaxEnt minimizes $\sum P' \ln(P'/P)$.
  The solution is $P'(R) = P(R) / [P(R) + (1-P(R)) \cdot (P(H|R)/q)^{something}...]$
  Actually, the standard result (van Fraassen/Grove/Halpern) is that $P'(R)$ decreases if $q > P(H|R)$.
