  Elias stood before the canvas. It was white. Not ivory, not cream, but a flat, industrial white that swallowed the gallery lights rather than reflecting them.
  Sarah's voice echoed in his head. *"If you see nothing else in Berlin, see the Weiss. It will break you."*
  Sarah never lied. If Sarah said the train left at 4:15, Elias bought a ticket without checking the schedule. If Sarah said a restaurant was safe, he ate without glancing at the health inspection score. Her testimony was a conduit for facts; she was a reliable instrument, calibrated to the truth of the world.
  But this?
  He leaned in. He looked for texture, for the brushstroke's heartbeat, for the subtle variance in pigment that might justify the pilgrimage. He saw only surface.
  The philosophical itch began to scratch at the back of his neck. He could easily believe the proposition: *This painting is historically significant.* He could believe: *Sarah thinks this painting is beautiful.* Those were facts. Sarah was a reliable witness. He could write those down in a notebook and defend them in a seminar.
  But could he believe *it is beautiful*?
  That was the asymmetry. If Sarah told him the building was on fire, he would run. He wouldn't need to feel the heat to know the danger. The testimony transmitted the knowledge and the justification for action. But here, standing in the cool silence of the room, accepting Sarah's verdict felt like wearing a coat that didn't fit. It draped over him, labeled "Awe," but he felt no warmth.
  He tried to force the synthesis. *Sarah says it's profound. Sarah is right about everything. Therefore, this is profound.*
  Logically, it held. Epistemically, it felt like fraud.
  To believe the building was on fire was to acknowledge a state of affairs. To believe the painting was beautiful was supposed to be an acknowledgment of a relationship between viewer and object. By accepting her word, he was bypassing the relationship. He was outsourcing his sensibility.
  He imagined telling a friend later. "I saw the Weiss. It was incredible."
  The words tasted like ash. If he said them, would he be lying? He would be reporting Sarah's experience, not his own. He would be a messenger delivering a package he hadn't opened.
  Why did it matter? Why couldn't aesthetic value be like mass or height? If Sarah said the canvas weighed fifty pounds, he'd believe her. Why was "beautiful" different?
  Because "beautiful" wasn't just a property of the object; it was a demand on the subject. It required him to feel something. Sarah couldn't feel it for him. Her testimony could point to the object, but it couldn't transfer the resonance.
  He stepped back. The white square remained indifferent.
  He pulled out his phone. He could text her: *You were right.* It would be the polite thing. It would maintain the trust. It would align his reported belief with her reliable testimony.
  But his thumb hovered over the screen. To send that message was to claim a knowledge he didn't possess. He knew *that* she loved it. He didn't know *why*. And without the why, the verdict was hollow.
  He put the phone away. He looked at the white paint one last time, waiting for a crack in the surface, a secret frequency. Nothing.
  He turned and walked out of the room. He believed Sarah was reliable. He believed the art was important. But as he stepped onto the street, blinking in the grey Berlin light, he realized he still didn't know if the painting was beautiful. He only knew that he was incapable of knowing it second-hand. The knowledge required a presence he couldn't borrow.

