answer: |-
  This is an exceptionally strong draft. You have correctly identified that the "Rationalists = Peirce" claim is a half-truth that collapses under scrutiny, and your intuition that Peirce is functionally closer to a correspondence theorist than James is philosophically sound. However, there are nuances in both the history of pragmatism and the specific contours of the Rationalist sequence that, if integrated, would make your post definitive rather than just another rehash.

  Here are my comments on your four specific points, followed by a verdict on posting.

  ### 1. Fairness to Peirce and James
  You are being broadly fair, but you can sharpen the distinction by focusing on **realism** vs. **humanism**.

  *   **James:** Your reading of James is standard, but to be steelmanned, James distinguishes between "expedient now" and "expedient in the long run." However, James is ultimately a **humanist** about truth: truth is made, not just found. It happens to an idea. This *does* leave him vulnerable to the "belief in belief" charge (or worse, "truth is whatever comforts the community"), which is why the LessWrong claim that Rationalists side with him is baffling.
  *   **Peirce:** Your "convergence-theoretic clothing" metaphor is excellent. However, to address your worry about flattening subtleties: Peirce was a **Scholastic Realist**. He believed that "generals" (laws, habits, patterns) are real, not just nominal. The convergence happens *because* reality exerts a brute force on the investigator.
      *   *Complication:* In his later work (post-1900), Peirce's **Synechism** (continuity) suggests that the mind and matter are continuous. Reality is "cognizable," but not necessarily "non-mental." This complicates the "mind-independent reality" reading slightly. For Peirce, the universe is perfused with signs. It's not that there is a dead world we map; it's that the world *is* intelligible.
      *   *Advice:* Keep your reading, but acknowledge that Peirce's "reality" is defined by its resistance to inquiry, not just its existence independent of it. This strengthens your point that he isn't a Jamesian subjectivist.

  ### 2. The Yudkowsky Parallel
  This is the crux of your post. The parallel holds up, but it forms a triangle, not a line.

  *   **Yudkowsky's Stance:** In "The Useful Idea of Truth," Eliezer is arguing against **deflationism** and **pragmatism as definitions**. He wants to preserve the word "truth" for **correspondence** so that the sentence "True beliefs are useful" remains meaningful. If truth *is* utility, that sentence becomes a tautology ("Useful beliefs are useful").
  *   **The Alignment:**
      *   **Rationalists vs. James:** Rationalists agree with your critique. If truth is just "what works," you lose the ability to criticize a useful lie.
      *   **Rationalists vs. Peirce:** Here is where it gets tricky. Rationalists are generally naive realists (Map/Territory). Peirce rejects the "thing-in-itself" (noumenon) that is utterly incognizable. For Peirce, if something is real, it *must* be capable of affecting a mind eventually.
      *   **The Verdict:** The LessWrong claim is right that Rationalists prefer Peirce's *rigor* over James's *flexibility*, but wrong to imply Peirce *is* a correspondence theorist in the LW sense. Peirce defines Truth via the *process* of inquiry; LW defines Truth via the *relation* between map and territory.
      *   *Suggestion:* Explicitly state that Rationalists and Peirce arrive at similar conclusions (truth is stable, objective, and constrains belief) from different metaphysical starting points.

  ### 3. The "Isolated Fact" Objection
  This is the strongest philosophical objection in your draft. You are right to be skeptical of the "would-be" rescue mission.

  *   **Peirce's Modal Realism:** Peirce argues that "would-bes" (modal facts) are objectively real. The statement "This diamond would scratch glass if pressed" is true even if the diamond is never pressed. For Peirce, the grain of sand count *is* determinate because the physical laws governing the dune *would* dictate a specific outcome *if* an investigator were present.
  *   **Is it Correspondence in Disguise?** Yes. Most scholars agree that Peirce's convergence theory *presupposes* a correspondence mechanism. The only reason inquiry converges is that there is a common constraint (Reality) pushing all investigators toward the same conclusion.
  *   **James's Response:** Interestingly, James might bite the bullet here. For James, if a fact makes no conceivable difference to experience (even in principle), the proposition might be meaningless or the truth value indeterminate.
      *   *Irony:* This Jamesian move actually aligns *better* with the LessWrong stance on "meaningless questions" (e.g., "If a tree falls in the forest and no one hears it...") than Peirce's modal realism does. Eliezer argues the sound waves exist (realism); James might argue the *truth value* of "there was a sound" depends on the experiential cash value.
      *   *Advice:* Use this to complicate your narrative. Peirce saves the truth of the isolated fact via modal realism (which looks like correspondence); James might deny the fact has a truth value (which looks like verificationism).

  ### 4. Verdict: To Post or Not to Post?
  **Post it.** But with a strategic pivot.

  *   **Why:** The claim that "Rationalists agree with Peirce" is a persistent meme in the community that serves as a philosophical shibboleth. It is often repeated by people who haven't read Peirce. Correcting this record adds value to the community's epistemic hygiene.
  *   **The Risk:** As you noted, "Pragmatism vs. Correspondence" is a dead horse in academic philosophy.
  *   **The Fix:** Do not frame this as "Peirce vs. James." Frame it as **"What did the Sequences actually say about Truth?"** Use Peirce and James as lenses to examine the Rationalist position.
      *   *Title Idea:* "Peirce, James, and the Map/Territory: Where does LessWrong actually stand?"
      *   *Structure:*
          1.  The Claim (LW = Peirce).
          2.  The Text (What Yudkowsky actually argued in *Useful Idea*).
          3.  The Philosophy (Why Peirce is closer than James, but still not a match).
          4.  The Isolated Fact (Where the theories break).
          5.  Conclusion (Rationalism is Critical Realism, not Pragmatism).

  ### Specific Edits for the Draft
  1.  **The "Kidnapper" Quote:** Use it early. It establishes that Peirce himself knew James was diluting his logic into psychology.
  2.  **Clarify "Expedient":** When discussing James, ensure you note that he means "expedient in satisfying the *whole* body of experience," not just "expedient for my ego." It makes the refutation stronger (it's a sophisticated error, not a crude one).
  3.  **The "Back Door":** Your intuition that Peirce re-imports correspondence through the back door is the highlight of your argument. Don't soften this. State clearly: *Convergence requires a constraint; that constraint is Reality; therefore, Truth relies on Reality, not just Consensus.*

  **Final thought:** You are correctly identifying that the Rationalist community often uses "Pragmatism" as a badge of honor without realizing that Yudkowsky's specific formulation was an attempt to *save* correspondence theory from pragmatist dissolution. Making that distinction explicit is worth a shortform post.
