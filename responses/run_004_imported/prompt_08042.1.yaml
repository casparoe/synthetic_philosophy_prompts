          3.  **Non-Epistemic/Animal Certainty (Moyal-Sharrock, etc.):** Hinges aren't beliefs/propositions. They are actions/instincts. Asking "do you know?" is a category mistake.

  3.  **Drafting the Response - Section by Section:**

