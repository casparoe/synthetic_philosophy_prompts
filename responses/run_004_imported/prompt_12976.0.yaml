answer: |-
  1. **The Non-Epistemic Claim**
  Your monograph argues that hinge propositions like "the earth has existed for a long time" are strictly non-epistemic: they aren't known, believed, or justified, but are rather a form of ungrounded acting. If these certainties are outside the "space of reasons," as you put it, does that mean they are immune to rational revision, or simply that the *kind* of revision they undergo isn't rational in the traditional sense?

  2. **The Skeptical Concession**
  G.E. Moore tried to defeat skepticism by holding up his hands and saying, "I know this is a hand." You agree with Wittgenstein that Moore misused the word "know," but doesn't your agreement concede the skeptic's main victory? If we cannot strictly say we *know* the external world exists, haven't you surrendered the very ordinary certainty Moore was trying to protect?
  *Follow-up:* If you reply that "knowledge isn't the goal of hinges," I'd press: If "knowledge" is the highest epistemic praise we have, aren't you stripping our most fundamental certainties of their highest value just to save them from skepticism?

  3. **The River-Bed**
  In §§96–99, Wittgenstein describes the "river-bed" of thoughts, noting that while some propositions harden into hinges, others can shift back into the fluid state of empirical claims over time. If hinges are arational bedrock, what governs this hardening and softening? Is it a causal process, a historical one, or something else entirely?
  *Follow-up:* If you suggest it's a matter of "practical success" or utility, I'd ask: Can a false hinge be more useful than a true one? If so, does your view imply that the drift of our certainties is guided by survival rather than truth?

  4. **The Missionary**
  Near the end of *On Certainty* (§§609–612), Wittgenstein discusses a religious missionary confronting a skeptic, suggesting that at the end of justifications, there is only persuasion, not argument. If hinges are outside the space of reasons, does your reading leave any room to say the scientist is more *reasonable* than the missionary, or only that their hinges differ?
  *Follow-up:* If you argue that "reasons run out" for both, I'd ask: Does this make it philosophically illegitimate to criticize a worldview whose hinges lead to harmful actions, since that criticism would presuppose the very hinges being challenged?

  5. **The Scope of "Us"**
  You often defend the normative status of hinges by saying they "simply stand fast for *us*." Who constitutes this "us"? Is it a universal human form of life, or is it bound by specific cultures, languages, or historical epochs?
  *Follow-up:* (Implicitly preparing for the next question) If it is cultural, does that mean hinges are relative to the group holding them?

  6. **The Normative Gap**
  This leads to the objection you've faced regarding "bad hinges." If a white supremacist or a cult member claims their ideology "stands fast for them" in the same way "the earth exists" stands fast for us, and hinges are arational, what resources does your view have to declare their certainties defective rather than just different?
  *Follow-up:* (Implicitly pressing the "stands fast" shield) If you say their certainties aren't *real* hinges, aren't you smuggling in a rational criterion to decide what counts as a hinge, which contradicts the non-epistemic claim?

  7. **The Status of Critique**
  If hinges are the scaffolding that makes doubt possible, can we ever critique the scaffolding itself from within the building? Or does genuine critique require a temporary suspension of the hinge, which on your view would look less like thinking and more like a breakdown of agency?
  *Follow-up:* (Implicitly asking about the possibility of progress) If we can't critique the scaffolding, how do we account for moral or scientific progress that seems to rely on overturning previous bedrock certainties?

  8. **Falsification and Rivals**
  Finally, there are rival readings on offer—"hinge epistemology" that grants warrants or entitlements, and "quasi-fideist" readings that lean harder into religious analogies. What specific textual or philosophical evidence would count *against* your strictly non-epistemic reading in favor of those alternatives? In other words, how could you be proven wrong?
  *Follow-up:* If your honest answer is that no empirical or textual evidence could shift you because this reading "simply stands fast" for you as a philosopher, aren't you demonstrating that your own theoretical framework is itself a hinge, and therefore arational?
