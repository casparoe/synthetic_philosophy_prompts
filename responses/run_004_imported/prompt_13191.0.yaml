answer: |-
  **MEMORANDUM**

  **TO:** University Academic Integrity Board
  **FROM:** [Your Name/Student Representative/Concerned Stakeholder]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Evidentiary Standards for AI-Detection Findings

  **Executive Summary**

  This memo responds to the Board's recent policy adoption allowing AI-writing detector scores, exceeding a stated confidence threshold, to serve as the sole basis for finding a student responsible for unauthorized AI use. While the intention to uphold academic standards is clear, this recommendation advises against relying exclusively on probabilistic software outputs. I recommend amending the policy to require **specific corroboration** alongside any detector flag. This change should take effect **immediately for all pending cases** and be formally codified before the start of the next grading period.

  **Background and Philosophical Context**

  The current policy operates on a "preponderance of evidence" standard applied to individual cases. If a detector indicates a >95% likelihood of AI generation, the Board treats this as sufficient proof of misconduct for that specific student.

  However, this approach raises a significant logical and ethical concern, recently highlighted by critics comparing it to the "Lottery Paradox" and "Preface Paradox." In these philosophical puzzles, one can rationally believe of any single lottery ticket that it will not win (based on high probability), yet simultaneously know that *some* ticket in the pool must win. Applied here: the Board may find each individual student responsible based on high probability, while simultaneously knowing (via the detector's documented error rate) that a specific fraction of those findings are statistically guaranteed to be false.

  Accepting this paradox in a gambling context is harmless; accepting it in a disciplinary context, where findings impact academic records and careers, is untenable.

  **Recommendation: The Corroboration Requirement**

  The Board should adopt a policy wherein an AI-detection score is treated as **investigative lead evidence, not conclusive proof.** A finding of responsibility requires the detection score *plus* at least one form of human-centric corroboration, such as:
  1.  **Oral Defense:** The student's inability to explain or paraphrase the submitted work in a follow-up interview.
  2.  **Version History:** A lack of iterative draft history in cloud-based documents.
  3.  **Stylistic Deviation:** A marked divergence from the student's prior in-class writing samples.

  **Rationale**
  The "Lottery Paradox" highlights a gap between *statistical probability* and *individual truth.* In administrative law and ethics, we generally reject punishing an individual based solely on base-rate statistics (e.g., punishing a resident of a high-crime neighborhood for a specific crime without specific evidence). AI detectors provide a base-rate probability, not a factual account of generation. By requiring corroboration, the Board shifts the standard from "This looks like AI" to "This looks like AI *and* the student cannot demonstrate authorship." This resolves the paradox by ensuring that aggregate error rates do not translate into guaranteed individual injustices.

  **Implementation Timeline**

  *   **Immediate Effect:** For any cases currently under review, the Board should pause findings of responsibility until corroboration is sought. Relying on the current policy for pending cases exposes the university to significant liability given the evolving consensus on detector unreliability.
  *   **Formal Codification:** The revised evidentiary standard should be formally voted on and published prior to the start of the next semester to ensure faculty and students are aware of the burden of proof.

  **Counter-Argument: Administrative Feasibility and the Preponderance Standard**

  The strongest argument for maintaining the current policy (sole reliance on detector scores) rests on **administrative feasibility and legal consistency.**

  Proponents argue that the "preponderance of evidence" standard used in university conduct boards is inherently probabilistic. In civil law, a 51% likelihood is sufficient for judgment. If an AI detector offers 95% confidence, it arguably exceeds the legal threshold for "more likely than not." Furthermore, requiring oral defenses or draft analysis for every flagged case could overwhelm the Board's capacity. If the volume of flags is high, a corroboration requirement might create a bottleneck, delaying justice for clear-cut cases and draining resources that could be used for educational outreach. From this view, the "Lottery Paradox" is an unavoidable feature of any probabilistic system; we accept that speed cameras or drug tests have error rates in exchange for the efficiency of enforcing rules at scale.

  **Rebuttal to Counter-Argument**

  While efficiency is vital, it cannot supersede accuracy in high-stakes disciplinary proceedings. A speed camera ticket involves a fine; an academic integrity violation involves permanent reputational damage and potential expulsion. The cost of a false positive here is asymmetrical and severe.

  Moreover, the legal analogy is imperfect. In civil court, probabilistic evidence (like DNA matching) is only admissible when the error rate is known, minimal, and the testing methodology is peer-reviewed and generally accepted. Current AI detectors do not meet this threshold; they are proprietary "black boxes" with unverified error rates that fluctuate based on writing style and native language. Therefore, the efficiency argument fails because the underlying evidence is not yet reliable enough to support summary judgment. A bottleneck in processing is preferable to a pipeline of erroneous findings.

  **Conclusion**

  The Board's current policy mistakes statistical likelihood for individual fact. By adopting a corroboration requirement, the Board can uphold academic integrity without sacrificing due process. This approach acknowledges that while we can manage risk in the aggregate, we must judge truth in the individual.

  I urge the Board to revise the policy accordingly.
