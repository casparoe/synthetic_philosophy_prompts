prompt: |-
  My friend and I spent two hours last night arguing about a policy my university's academic integrity board just adopted, and I owe the board a recommendation memo by Friday. Under the policy, a submission that an AI-writing detector flags above a stated confidence threshold can be found responsible for unauthorized AI use on that basis alone, with cases decided one at a time. My friend, a philosophy PhD student, compared this to the old puzzles about lottery tickets and book prefaces: the board is willing to find, case after case, that this particular student more likely than not cheated, while also knowing, from the detector's documented error rate, that some fraction of this term's findings will be wrong. I couldn't decide whether that's a real inconsistency to fix or just an unavoidable feature of judging cases one at a time. Please draft the memo: recommend whether a detection score should be able to settle a case on its own or needs a specific corroboration requirement, note when any change should take effect, and address the strongest argument for the position you don't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Task:** Draft a recommendation memo to the university's academic integrity board.
      *   **Topic:** A new policy allowing AI-writing detector scores (above a confidence threshold) to be the *sole* basis for finding a student responsible for unauthorized AI use.
      *   **Key Conflict:** The friend (philosophy PhD) argues this creates a paradox similar to the "Lottery Paradox" or "Preface Paradox" (accepting individual probabilistic claims while knowing the aggregate implies some falsehoods). The user is unsure if this is a fatal inconsistency or an unavoidable feature of case-by-case judgment.
      *   **Requirements:**
          1.  Recommend whether detection scores alone should settle a case or if corroboration is needed.
          2.  Note when any change should take effect.
          3.  Address the strongest argument for the position *not* adopted (counter-argument).
      *   **Tone:** Professional, persuasive, analytical, suitable for an academic administrative body.
      *   **Deadline:** Memo is due Friday (implies urgency but needs thoughtful analysis).

  2.  **Determine the Stance:**
      *   *Option A (Support the Policy):* Argue that probabilistic judgment is standard in law and academia (preponderance of evidence). The "Lottery Paradox" is a philosophical curiosity, not a practical barrier. Efficiency is key.
      *   *Option B (Oppose the Policy/Recommend Corroboration):* Argue that AI detectors are notoriously unreliable (high false positives), stakes are high (academic record), and the "Lottery Paradox" highlights a genuine due process flaw. Relying solely on algorithms undermines trust.
      *   *Decision:* Option B is generally the more ethically defensible and practically robust position in the current landscape of AI detection. AI detectors are widely criticized for bias and inaccuracy. Relying on them as *sole* evidence is risky for the university legally and reputationally. It allows for a stronger memo that addresses the philosophical concern directly.
      *   *Recommendation:* AI detection scores should *not* be sufficient on their own; they require corroboration (e.g., oral defense, draft history, stylistic analysis).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening/Executive Summary:** State the purpose and the core recommendation clearly.
      *   **Background:** Briefly summarize the new policy and the concern (the "Lottery Paradox" analogy).
      *   **Analysis/Recommendation (The Core):**
          *   Explain *why* sole reliance is problematic.
          *   Distinguish between "probabilistic truth" (Lottery) and "individual justice." In a lottery, we know *someone* wins. In integrity cases, we hope *no one* cheated.
          *   Highlight the technical limitations of AI detectors (false positives, bias against non-native speakers).
          *   Propose the "Corroboration Requirement."
      *   **Implementation Timeline:** When should this start? Immediately for pending cases, formally for future ones.
      *   **Counter-Argument (The Strongest Argument for the Opposing View):**
          *   What is the best argument for *allowing* sole reliance? Efficiency and deterrence. If every case requires a hearing, the system collapses. Also, the "Preponderance of Evidence" standard legally allows probabilistic judgment.
          *   Refute this: Efficiency cannot trump accuracy in high-stakes disciplinary matters. The cost of a false positive (ruined career) outweighs the administrative burden.
      *   **Conclusion:** Reiterate the recommendation.

  4.  **Refining the Philosophical Argument (The Friend's Point):**
      *   The friend mentioned the Lottery/Preface Paradox.
      *   *Lottery Paradox:* If probability > 99% means "know," then I know every ticket will lose. But I know one will win. Contradiction.
      *   *Application here:* If detector says 99% AI, we say "guilty." If we do this 100 times, and the error rate is 1%, we know statistically we accused an innocent person.
      *   *Memo Integration:* Acknowledge this. It's not just a paradox; it's a due process issue. We cannot accept *known* error rates as a cost of doing business when the penalty is severe. The legal standard isn't just "more likely than not" in a vacuum; it's "more likely than not" based on *reliable* evidence. An algorithm with a known false-positive rate doesn't meet the reliability threshold for *sole* evidence.

  5.  **Drafting - Tone and Style:**
      *   Needs to be respectful but firm.
      *   Avoid overly technical jargon but show understanding of the philosophical/legal nuance.
      *   Ensure the "Strongest Argument" section is charitable (steel-manning) before rebutting.

  6.  **Review against Constraints:**
      *   Recommend score alone vs. corroboration? Yes (Corroboration).
      *   When to take effect? Yes (Immediate/Next Term).
      *   Address strongest counter-argument? Yes (Administrative feasibility/Preponderance standard).
      *   Memo format? Yes.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest banning detectors entirely.
      *   *Correction:* Too extreme. Detectors can be *part* of the evidence, just not the *only* evidence. This is a more moderate, adoptable recommendation.
      *   *Check:* Did I address the "case by case" vs. "aggregate" tension? Yes, in the analysis section.
      *   *Check:* Is the timeline realistic? "Immediate" for pending cases is crucial for fairness.

  8.  **Final Polish:** Check for clarity, flow, and professional formatting. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Make sure I explicitly mention the "Lottery/Preface" analogy the friend raised, as that was the prompt's specific hook. It shows I listened to the user's context.

