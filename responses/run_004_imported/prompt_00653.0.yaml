answer: |-
  This is a fantastic rabbit hole. You've hit on the exact nerve that connects Hobbes's politics to his math disasters. The passage you have is essentially Hobbes's "Maker's Knowledge" manifesto. It's the epistemological engine that drives *Leviathan*, but it's also the bug in his code that led to the Wallis feud.

  Here is the breakdown you need for your piece, translating the 17th-century syntax into plain English, followed by the assessment of why this logic made him so stubborn about the circle.

  ### 1. The Translation: Line-by-Line

  **"Of arts, some are demonstrable, others indemonstrable..."**
  *   **Plain English:** Not all fields of study allow for absolute proof. Some do, some don't.

  **"...and demonstrable are those the construction of the subject whereof is in the power of the artist himself, who, in his demonstration, does no more but deduce the consequences of his own operation."**
  *   **Plain English:** You can only prove things with absolute certainty about stuff *you built*. Why? Because proving it is just retracing the steps you took to make it. If you built the thing, you know exactly how it works.

  **"The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same..."**
  *   **Plain English:** True scientific knowledge requires knowing the *cause* or the origin story of the thing you're studying.

  **"...and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for."**
  *   **Plain English:** If you know the origin (because you made it), you can have proof. If you have to guess the origin (because someone else made it), you can't have proof.

  **"Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves..."**
  *   **Plain English:** Math counts as certain knowledge because we draw the lines and shapes. We are the creators of the objects we study.

  **"...and civil philosophy is demonstrable, because we make the commonwealth ourselves."**
  *   **Plain English:** Politics counts as certain knowledge because the State isn't a natural occurrence like a storm or a tree; it's a human artifact. We built the government via social contract, so we can understand its mechanics perfectly.

  **"But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be."**
  *   **Plain English:** Physics (natural philosophy) gets shut out of the "absolute certainty" club. We didn't build rocks, stars, or animals; God or Nature did. We can only observe what they *do* (effects) and guess how they were *made* (causes). So, physics is always hypothetical ("this *could* be the cause"), never proven ("this *is* the cause").

  ---

  ### 2. The "Maker's Knowledge" Criterion

  You asked why geometry and civil philosophy land together while physics gets left on the porch. The answer is **agency**.

  For Hobbes, to *know* something truly (scientia), you must be its **author**.
  *   **Geometry:** I move the pen; I generate the line. I know the cause of the line because my hand was the cause.
  *   **Civil Philosophy:** I (along with my neighbors) agree to surrender rights to a Sovereign. We generated the Commonwealth. Therefore, we can know its logic perfectly.
  *   **Physics:** I did not generate the sun. I did not generate gravity. I can only observe them. Therefore, I can never be 100% sure *why* they happen, only that they *do* happen.

  This is a radical move. It elevates Politics to the status of Math (which was rare) and demotes Physics to the status of educated guesswork (which physicists like Boyle and Hooke hated).

  ### 3. Does "Construction" Carry Technical Weight?

  **Yes, absolutely.** This is where your intuition about materialism is spot on.

  Hobbes was a fierce **nominalist** and **materialist**. He did not believe in Platonic forms. To a Platonist, a "Circle" exists in a perfect abstract realm, and the circle you draw in the sand is just a shadowy copy.

  To Hobbes, **there is no circle except the one you draw.**
  *   **Definition:** A line is generated by the motion of a point. A surface is generated by the motion of a line.
  *   **Implication:** Geometry isn't about abstract truths; it's about **kinematics** (the study of motion).

  When Hobbes says "construction," he means literal, physical generation through motion. This is why he thinks he can square the circle. He isn't trying to solve an abstract algebraic problem; he is trying to describe a physical procedure of motion that results in a square area equal to a circular area.

  Because he believes the *object* is defined by the *motion that created it*, he thinks that if he can describe a motion, he has defined the truth.

  ### 4. The Link to the Circle-Squaring Feud

  This is the smoking gun for your article. This epistemology is exactly why he couldn't accept John Wallis's criticism.

  **The Conflict:**
  *   **Wallis (The Modern Mathematician):** Treats geometry as a system of abstract logical relations. If your proof violates arithmetic ratios, you are wrong, regardless of how you drew the diagram.
  *   **Hobbes (The Philosopher):** Treats geometry as a record of his own constructive agency.

  **Why Hobbes Wouldn't Back Down:**
  If knowledge comes from being the "artist" (the maker), then Hobbes believes he has an **epistemic VIP pass** to his own diagrams.
  1.  He constructs the figure.
  2.  He knows the motion he used to construct it.
  3.  Therefore, he knows the truth of it.

  When Wallis tells him he's wrong, Hobbes hears: *"You don't know what you just did."*
  To Hobbes, Wallis is trying to judge the "cause" (the construction) from the "effects" (the written proof), which Hobbes explicitly says is impossible in the passage you quoted. Hobbes thinks Wallis is treating geometry like *physics* (guessing at causes from effects), whereas Hobbes knows the cause because *he is the cause*.

  It's a category error. Hobbes thinks his authority as the **maker** of the diagram overrides Wallis's authority as the **calculator** of the ratios. He literally cannot conceive that he could "make" a geometric object and be wrong about its properties, because to him, the properties *are* the making.

  ### 5. Assessment: Does the Argument Hold Up?

  For your readers, you can frame it as a brilliant insight with a fatal flaw.

  **Where Hobbes is Brilliant:**
  *   **Constructivism:** He anticipates modern constructivism in math and the "Verum Factum" principle (truth is made) later popularized by Vico.
  *   **Political Science:** His claim that we can understand the State because we created it is a powerful foundation for liberal political theory. It suggests institutions are fixable because they are human artifacts, not divine ordinances.

  **Where Hobbes Crashes (The Fatal Flaw):**
  *   **Confusing Intent with Success:** Just because I *intend* to construct a square equal to a circle doesn't mean I *succeeded*. Hobbes conflates the **process of drawing** with the **truth of the result**.
  *   **The Materialist Trap:** By insisting lines are physical motions, he loses the precision of abstract math. A physical line has width; a mathematical line does not. By grounding geometry in "bodies in motion," he introduces physical error into a logical system.
  *   **The Physics Problem:** He was wrong to dismiss physics as merely hypothetical. We can demonstrate things about nature without having created it (e.g., Newton's laws). His strict "Maker's Knowledge" criterion is too restrictive for science.

  ### The Narrative Hook for Your Piece

  You can frame the Hobbes-Wallis feud not just as "Philosopher vs. Mathematician," but as a clash over **who owns the truth**.

  *   **Wallis** represents the emerging view that truth is **public and verifiable** by independent rules (the scientific method).
  *   **Hobbes** represents the older, authoritarian view that truth is tied to **authority and generation** (I know it because I made it).

  Hobbes spent 20 years trying to square the circle because, in his mind, admitting he was wrong wasn't just admitting a math error; it was admitting that he didn't truly *know* the object he claimed to have constructed. It would undermine his entire system of philosophy, which relied on the idea that we can have absolute certainty about the things we make. If he can't be certain about the circle he drew, can he be certain about the Commonwealth he designed?

  That's why he never backed down. To concede to Wallis was to concede that *Leviathan* might be just as hypothetical as physics.
