      *   *Refining for Tone:* Needs to be respectful but probing (magazine/podcast style). Not hostile, but pressing on the "deflection" mentioned in the prompt.

  5.  **Drafting the Questions and Follow-ups:**

      *   *Q1 (Legitimate):* Focus on the definition of "strictly proper." It seems to bake in probabilism.
