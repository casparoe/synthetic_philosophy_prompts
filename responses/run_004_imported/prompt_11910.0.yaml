          *   *Defense:* Kripke's famous line: "The ghost of the Tarski hierarchy is still with us." We can express the gap in the metalanguage, but not consistently within the object language without generating a new gap. Or, we accept that "is not true" cannot be consistently applied to the gap sentence within the same language level.
      *   **Dialetheist (let's call him "Marcus"):**
