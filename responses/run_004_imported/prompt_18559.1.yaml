      *Final Plan:*
      *   **Recommendation:** Reject 9/7. Modify to 5/4.
      *   **Rationale:** CJT assumptions (Independence, Competence) are not met. 5/4 preserves the "high bar" intent without the epistemic costs of scaling $n$ under correlation.
      *   **Revisit:** One year.

      *(Self-Correction on "Modify"):* Is 5/4 a modification of the *proposal* or the *status quo*? It's a modification of the proposal's *intent* (higher bar) without the specific mechanism (9 members). I will frame it as a **Modified Recommendation**.

      *Wait, let's check the math on 4/5 vs 7/9.*
      4/5 = 80%.
