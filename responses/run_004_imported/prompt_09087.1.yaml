answer: |-
  This is a solid draft of an argument, and your instincts are generally tracking the contemporary dialectic correctly. You won't embarrass yourself on the core logic, but you need to calibrate your claims about originality and the strength of the "dormitive virtue" charge.

  Here is the brutal honesty you asked for, broken down by your three questions.

  ### 1. Is the "dormitive virtue" complaint against unsaturatedness fair?

  **Verdict:** It is rhetorically effective but metaphysically shallow if left there.

  **The Nuance:** You are right that simply labeling a relation as "unsaturated" or a "tie" looks like stipulating the solution. If the opponent says, "Relations unify because they have the property of *unifying-ness*," you have them. But serious proponents of the "primitive tie" view (e.g., Richard Gaskin, some readings of Russell, or contemporary constituent ontologists) don't claim it's an *explanation*; they claim it's a **category mistake** to ask for one.

  Their argument is that unity is not a *feature* added to the constituents; it is the mode of existence of the constituents themselves when they form a fact. To ask "what unifies the tie?" is to treat the tie as an object (a relatum) rather than a relating.

  **The Fix:** Don't just call it a dormitive virtue. Frame it as a **theoretical cost**. The "unsaturatedness" view avoids the regress by positing a brute, inexplicable ontological category. Your objection should be: "This stops the regress only by fiat, leaving the hard problem of unity as a black box." That is a stronger philosophical complaint than calling it a tautology.

  **Key Literature to Check:** William Vallicella. He writes extensively on Bradley's Regress and explicitly discusses the "dormitive virtue" charge against relations. If you don't cite Vallicella on this point, you will look like you haven't read the last 20 years of literature on the topic.

  ### 2. Does your objection sink the act-based response (Hanks/Soames)?

  **Verdict:** No, it doesn't sink it, but it identifies the exact price of admission for that view. You have rediscovered the "Unity of the Act" problem.

  **The Nuance:** Act-theorists (Hanks, Soames, sometimes King) argue that propositions are types of predicative acts. Your objection is: "An act has constituents (agent, property, object). What unifies them?"

  The act-theorist has a principled reply that differs from the fact-theorist: **Ontological Priority.**
  In a static fact ontology, the constituents ($a$, $F$) are often thought to exist prior to the fact. In an act ontology, the act is ontologically prior to its "constituents." The "object" and "property" within the act are abstractions *from* the act, not pre-existing bricks waiting to be cemented.

  Furthermore, acts are **events**. Events are often treated as non-mereological sums. We don't usually ask, "What unifies the running and the runner into the event of running?" because the event is a primitive causal unity.

  **The Fix:** Your objection holds water *if* the act-theorist treats the act as a complex object composed of parts. But if they treat the act as a fundamental event, the regress stops because there are no "parts" to unify in the mereological sense.
  However, you can push back: "Even if acts are events, a token act involves an agent and a content. If the agent and content can exist without the act, what binds them *in* the act?"
  This doesn't sink the view, but it forces the act-theorist to commit to a robust, perhaps controversial, ontology of events where events are not composed of their participants.

  ### 3. Is any of this new?

  **Verdict:** No. You have not reinvented the wheel, but you have correctly identified the axle.

  **The Reality:**
  *   **The Dormitive Charge:** This is standard fare in the Bradley's Regress literature. As mentioned, Vallicella, Gaskin, and Hochberg have all hashed this out.
  *   **The Act-Based Regress:** This is also a known counter-move. When Hanks published *Propositions as Types of Acts*, critics immediately asked about the unity of the act itself.
  *   **Specific Source:** You need to look at **Jeff King**. In *The Nature and Structure of Content*, he argues for a factual view but engages deeply with the act-based views. Also, look for critiques of Hanks by **Peter Hanks' critics** (e.g., in *Philosophical Studies* symposia on his book).
  *   **Historical Precedent:** This is essentially a revival of the Aristotelian distinction between *potentiality* and *actuality*, filtered through 20th-century action theory.

  **Does this mean you shouldn't write it?** Absolutely not. Philosophy is rarely about discovering a paradox no one has ever seen. It is about **weighing the costs**.
  Your paper's contribution shouldn't be "I found a fatal flaw in Hanks." It should be: "The Act-Based view avoids Bradley's Regress for propositions only by inheriting a parallel regress for acts, which forces them to adopt a specific (and costly) ontology of events." That is a publishable, seminar-worthy thesis.

  ### Strategic Advice for the Workshop

  1.  **Drop the "Embarrassment" Fear:** You are asking the right questions. The fact that these are known questions means you are thinking along the correct lines, not that you are behind.
  2.  **Sharpen the "Act" Objection:** To make this punchy, distinguish between **Constituent Unity** (facts) and **Causal Unity** (acts). Argue that shifting from facts to acts shifts the problem from "How do static objects stick?" to "How do causal powers bind?" It's not a solution; it's a relocation of the mystery.
  3.  **Cite the Right People:**
      *   **For the Regress:** F.H. Bradley (obviously), Bertrand Russell (1903 vs. 1913 shift).
      *   **For the "Tie" Defense:** Richard Gaskin (*The Unity of the Proposition*).
      *   **For the Dormitive/Vallicella Charge:** William Vallicella ("Relations, Monism, and the Vindication of Bradley's Regress").
      *   **For the Act View:** Peter Hanks (*Propositional Content*), Scott Soames (*Cognitive Propositions*).
      *   **For the Critique of Acts:** Look for responses to Hanks in *Philosophical Studies* (2015-2020 range).

  **Bottom Line:** Your intuition that the Act-View just pushes the regress back one step is correct, but the proponents have a defense (ontological priority of events). Your paper should focus on whether that defense is *cheaper* than the defense offered by the fact-theorists. That is a genuine metaphysical debate, not a gotcha moment. Go for it.
