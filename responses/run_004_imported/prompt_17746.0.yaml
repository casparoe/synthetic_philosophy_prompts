      *   Tone check: Ensure the follow-ups call out specific evasions (e.g., "That sounds like you're redefining trust").
      *   Ensure the "Dan" angle is addressed early to validate the user's curiosity.

  5.  **Final Polish:** (Self-Correction during drafting)
