answer: |-
  Your simulation is not buggy. Your friend's reasoning is a classic example of confusing **Arithmetic Mean** (Expected Value) with **Geometric Mean** (Compound Growth).

  In finance, this is the difference between "what happens on average across many parallel universes" and "what happens to your specific portfolio over time."

  Here is the breakdown of why your friend is mathematically incorrect, why your sim is right, and the specific concept that bridges the gap.

  ### 1. The Math of Your Simulation
  Let's look at your specific numbers: **+30% / -20%** with 50/50 odds.

  **Unleveraged:**
  *   Sequence (Up then Down): $1.30 \times 0.80 = 1.04$
  *   You have 4% growth over two years.
  *   **Geometric Mean:** $\sqrt{1.04} \approx 1.0198$ (**~2% annualized growth**).

  **2x Leveraged (assuming constant leverage via rebalancing or margin):**
  *   If the asset moves 30%, your equity moves 60%. If it moves -20%, your equity moves -40%.
  *   Sequence (Up then Down): $1.60 \times 0.60 = 0.96$
  *   You have **lost** 4% over two years.
  *   **Geometric Mean:** $\sqrt{0.96} \approx 0.979$ (**~-2% annualized loss**).

  Even though the *Arithmetic Expected Return* is positive ($0.5 \times 60\% + 0.5 \times -40\% = 10\%$), the *Compounded Reality* is negative. Your simulation correctly shows that after 50 years, the median path is underwater, even if the mathematical "Expected Value" is sky-high.

  ### 2. Arithmetic vs. Geometric Mean (The Core Flaw)
  Your friend is optimizing for **Arithmetic Mean**.
  $$E[R] = \sum (p_i \times r_i)$$
  This is useful for one-off bets. If you bet \$100 on a coin flip once, this is the number that matters.

  Investing is a **repeated game** where you reinvest your principal. This requires optimizing for **Geometric Mean**.
  $$G = \left( \prod (1 + r_i) \right)^{1/n} - 1$$

  **The Relationship:**
  There is a well-known approximation in finance (derived from Itō's Lemma) that relates the two:
  $$r_{geo} \approx r_{arith} - \frac{\sigma^2}{2}$$
  Where $\sigma$ is volatility (standard deviation).

  **The Leverage Trap:**
  When you apply leverage ($L$):
  1.  Arithmetic return scales linearly: $L \times r_{arith}$
  2.  Volatility scales linearly: $L \times \sigma$
  3.  **But the volatility penalty scales quadratically:** $\frac{(L \times \sigma)^2}{2} = L^2 \times \frac{\sigma^2}{2}$

  Because the penalty is $L^2$ but the gain is only $L^1$, there is a mathematical tipping point where adding more leverage *reduces* your compounded growth rate. In your specific example, that tipping point is somewhere between 1x and 2x leverage.

  ### 3. Expected Value vs. Median Outcome (Ergodicity)
  You noticed the Expected Value (Mean) was higher, but the outcome was "almost always" worse. This is a property of **non-ergodic systems**.

  *   **Ensemble Average (Expected Value):** If 10,000 people run this strategy, a tiny few will get incredibly lucky (all "Up" years) and make astronomical amounts of money. These outliers pull the *average* up massively.
  *   **Time Average (Median/Mode):** For any *single* person over 50 years, the probability of hitting those outlier "all up" streaks is near zero. The volatility drag grinds almost everyone's account down.

  Your friend is looking at the Ensemble Average. You are looking at the Time Average. In investing, you live in one timeline, so the Time Average is the only one that matters.

  ### 4. The Kelly Criterion
  There is actually an optimal amount of leverage to maximize geometric growth, known as the **Kelly Criterion**.

  $$f^* = \frac{p(b+1) - 1}{b}$$

  Or, in continuous finance terms for your scenario:
  $$L_{optimal} = \frac{\text{Excess Return}}{\text{Variance}}$$

  If you leverage beyond the Kelly point, you increase risk without increasing long-term growth rate. If you leverage beyond *double* the Kelly point, your expected geometric growth rate turns negative (which is what happened in your sim at high leverage).

  ### 5. Real-World Friction (Why it's even worse)
  Your simulation was actually generous to your friend. In the real world, three things make high leverage even worse:

  1.  **Cost of Borrow:** Margin isn't free. If you pay 6% interest on borrowed money, that drags down the arithmetic mean, lowering the optimal leverage point further.
  2.  **Leveraged ETF Decay:** If your friend uses 2x/3x ETFs (like UPRO or SSO), these reset **daily**. In a sideways or volatile market, the daily reset creates massive volatility drag that doesn't exist in a simple margin calculation.
  3.  **Margin Calls are Path-Dependent:** Your friend said, "as long as you don't get margin called." This is the weakest link. A 20% drop in the S&P 500 is common. A 20% drop in a 3x leveraged position is a 60% loss. If you are 3x levered, a 33% market drop wipes you out to zero. Recovery from a 90% loss requires a 900% gain.

  ### Summary for Your Buddy
  You can tell him:
  > "You're optimizing for Arithmetic Return, but wealth compounds Geometrically. Volatility drag scales with the *square* of leverage, while returns only scale *linearly*. Past a certain point (the Kelly limit), adding leverage mathematically guarantees a lower compounded growth rate, even if the raw expected value is higher. My sim isn't buggy; it's demonstrating variance drain."

  **Verdict:** Your sim is correct. Your friend is falling for one of the most common quant finance fallacies. Leverage amplifies returns, but it amplifies volatility drag *more*.
