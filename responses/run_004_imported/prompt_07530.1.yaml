      *   *Vulnerability:* "Cooperate iff you cooperate" is hard to implement. "Cooperate iff your prompt says you are cooperative" is easy to spoof.
      *   *Implication:* Transparency makes LLM agents *more* vulnerable to adversarial prompting than traditional code. You can't trust the "source" (prompt) because the execution engine (the LLM) is malleable.
