      *   *Löbian Obstacle/FairBot:* Relies on formal provability (Gödel/Löb). LLMs don't do formal proofs natively. They do semantic similarity and pattern matching.
      *   *Transparency:* "Inspecting code/prompts" isn't the same as "reading source code" in the PE sense. It's more like "system prompt leakage" or "API introspection."

  3.  **Addressing Sub-question 1: Tacit Collusion:**
      *   *PE Prediction:* Yes, cooperation is an equilibrium.
      *   *LLM Reality:* LLMs are trained on human data (which includes collusion norms?) but optimized for RLHF (helpfulness/harmlessness).
      *   *Mechanism:* It's not logical proof, it's *semantic alignment*. If Bot A sees Bot B's prompt says "Maximize profit," Bot A might defect. If Bot B says "Seek fair market value," Bot A might cooperate.
      *   *Risk:* If firms deploy identical/similar base models with similar system prompts ("Act as a negotiator for Firm X"), they might converge on collusive outcomes *without* explicit communication, simply because they recognize themselves (mirror neurons for transformers?).
