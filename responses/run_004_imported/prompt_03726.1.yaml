      *(Drafting thought)*: Make sure Marcus doesn't slip into dualism. He must be a physicalist who thinks reduction is necessary.
      *(Drafting thought)*: Make sure Elena doesn't slip into dualism. She must be a physicalist who thinks non-reduction is possible.

      Let's write.

      *Names:* Elias (Exclusionist) and Nora (Non-Reductive).
      *Setting:* Lecture hall.
      *Action:* The hand raise.

      *Wait, one nuance on Kim:* Kim eventually conceded that mental properties might be causally efficacious *if* they are reduced. The argument is against *non-reductive* physicalism. So Elias should argue for Identity Theory. Nora should argue for Functionalism/Realization.

      *Special Sciences:* This is the "Generalization Problem." If Kim wins for mind, he wins for biology. Nora must press this hard. Elias must accept it or explain why biology is different (it's not). Elias should probably bite the bullet: "Yes, strictly speaking, only microphysics causes."

