      *   **Round 2: The Exclusion Principle.** Marcus tightens the screw. If the neurons did it, what did the *belief* do? Elena introduces "Difference Making" or Counterfactuals.
      *   **Round 3: The Generalization (Crucial Step).** Elena plays the "Special Sciences" card. If this kills psychology, it kills biology/economics. Marcus needs a serious response here, not a dismissal. He might argue that biology *is* just complex physics, or that higher-level causes are just shorthand.
      *   **Round 4: The Nature of Causation.** They dig deeper into what "cause" means. Is it production or dependence?
      *   **Closing:** The girl's hand is still up (or she speaks). Leave the tension unresolved but mutually respectful.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Marcus sounding too much like a dualist?
      *   *Fix:* Ensure Marcus insists he is a physicalist. He just thinks reduction is the only way to save causation. He's an *Identity Theorist* or *Reductive Physicalist*.
      *   *Critique:* Is Elena's response to the "Special Sciences" objection strong enough?
      *   *Fix:* She needs to argue that causal *explanation* tracks patterns that physics misses. Marcus needs to counter that patterns aren't *causes*, they are descriptions of causes.
      *   *Focus:* Keep returning to the girl's hand. Neurons firing vs. wanting to answer.

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Scene:* Philosophy of Mind lecture. Dust motes, quiet hum.
      *   *The Event:* Sarah in the back raises her hand.
      *   *Marcus's opening:* "Look at that. Neurons fired. Arm went up."
