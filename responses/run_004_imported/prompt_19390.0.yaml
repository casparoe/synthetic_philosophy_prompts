  3.  **Analyze Statement (2) - Diego:**
      *   *Claim:* Instant-runoff counting can still reward insincere ballots. Voters might rank a true favorite second or bury a rival.
      *   *Analysis:* This is accurate. RCV fails the "participation criterion" and "monotonicity criterion" in some edge cases. More broadly, it is susceptible to tactical voting. For example, if a voter's favorite is unlikely to win, they might rank a more viable "lesser evil" first to ensure they have a say in the final round (compromising). Or they might rank a strong competitor last even if they aren't their true last choice (burying).
      *   *Verdict:* Right. This is a well-documented property of IRV/RCV.

