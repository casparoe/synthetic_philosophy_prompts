      *   *Claim:* RCV solves the problem outright. No worry about "wasting" a vote or helping the least-favorite win. People can vote sincerely.
      *   *Analysis:* RCV (Instant Runoff Voting) *does* mitigate the "spoiler effect" common in plurality voting (where similar candidates split the vote). It allows voters to rank a long-shot first without losing their say in the final round. However, saying it solves the problem *outright* and that nobody has to worry about strategic voting is an overstatement. RCV is not immune to strategy (e.g., "burying," "compromising").
