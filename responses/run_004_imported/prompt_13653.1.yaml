answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s sibling.

  I stand here today feeling incredibly honored, and honestly, just deeply happy. We are all here for one reason: to welcome [Baby's Name]. To look at her, safe in her mother's arms or sleeping in her bassinet, and just feel gratitude that she is here, with us, in this world.

  We all know that the road to this moment wasn't a straight line. [Sister] and [Husband] have navigated a journey that required immense courage, resilience, and a level of intentionality that most of us will never fully know. They wanted to be parents more than anything, and they were willing to move mountains to make it happen. Every step they took was an act of love, not just for the child they hoped to hold, but for the future they wanted to build.

  Part of that future was about our family's history. As many of you know, there is a shadow that has hung over our branch of the family for a long time. [Sister] and [Husband] made the choice to ensure that shadow stops here. They have closed a difficult chapter on our family's past so that [Baby's Name]'s story can begin without that weight. We are all so profoundly relieved that this burden is lifted from our line, and that is a gift they have given to all of us, but especially to her.

  But mostly, I want to talk about who she *is*, not what isn't there. She is [Baby's Name]. She is [mention a small detail: e.g., such a calm sleeper / has such bright eyes / is already so loved]. She is exactly who she is meant to be.

  My promise to you, [Baby's Name], is that you will never have to walk alone. You have a village here—grandparents, aunts, uncles, cousins—who are all so thrilled to watch you grow. We are here to cheer for you, support you, and love you, exactly as you are.

  So, if everyone could please raise a glass.

  To [Sister] and [Husband]: Thank you for your strength and for bringing this light into our lives.
  And to [Baby's Name]: Welcome to the family. We are so glad you're here.

  Cheers.
