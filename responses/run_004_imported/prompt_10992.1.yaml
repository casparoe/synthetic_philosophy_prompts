answer: |-
  This is one of the best rabbit holes in metaphysics. You've got the map (the encyclopedia definitions), but you're missing the terrain (the philosophical pressure points). Let's walk through the actual tension, because Lewis isn't just being contrarian for fun; he's trying to solve a specific logical headache that transworld identity creates, and Kripke's objection is less a "refutation" and more a clash of intuitions about what *modality* is for.

  ### 1. The Gut-Level "Why": The Problem of Accidental Intrinsics

  You mentioned "accidental intrinsics," but the intuition often gets lost in the formalism. Here is the reconstruction of why Lewis thinks transworld identity (TWI) forces you into a contradiction or a cheat.

  **The Setup:**
  Imagine Humphrey. In the actual world ($W_@$), Humphrey has 5 fingers on his left hand.
  In a possible world ($W_1$), Humphrey wins the election. To win the election, maybe he had to give a specific speech.
  In another possible world ($W_2$), Humphrey has 6 fingers on his left hand.

  **The TWI Claim:**
  The Transworld Identity theorist says: "The Humphrey in $W_@$ is **numerically identical** to the Humphrey in $W_2$." It is the *very same object*, existing in two different modes.

  **Lewis's Trap:**
  Lewis asks: What is the property of *having 5 fingers*?
  *   **Option A:** It's an intrinsic property. It's about the hand itself, not its relation to anything else.
  *   **Option B:** It's a relation. It's *having-5-fingers-relative-to-W@*.

  If you choose **Option A (Intrinsics)**:
  If Humphrey is numerically identical across worlds, then the *one object* (Humphrey) has the property *5-fingered* (in $W_@$) and the property *6-fingered* (in $W_2$).
  Since it is the *same object*, you have a contradiction. One thing cannot be both 5-fingered and 6-fingered. You can't escape this by saying "at different times" or "in different places," because worlds aren't times or places; they are total ways reality could be.

  If you choose **Option B (Relations/Indexicality)**:
  You say, "No, Humphrey isn't 5-fingered simpliciter. He is 5-fingered-*at-W@* and 6-fingered-*at-W2*."
  Lewis thinks this destroys the concept of an **intrinsic** property. If *shape* and *mass* and *finger-count* are actually relations to a world, then nothing has an intrinsic nature independent of which world it's standing in. For Lewis, a Humean, properties should be local matters of particular fact. Turning "being round" into "being round-at-W" makes properties extrinsic relations to abstract entities (worlds). Lewis finds this ontologically costly and counter-intuitive.

  **The Lewis Solution:**
  Deny numerical identity.
  The guy in $W_@$ is Humphrey. The guy in $W_2$ is Humphrey*. They are distinct individuals.
  Humphrey has 5 fingers. Humphrey* has 6 fingers. No contradiction.
  We say "Humphrey could have had 6 fingers" is true because Humphrey has a *counterpart* who has 6 fingers.

  **The "Overlap" Constraint:**
  This ties into why worlds can't overlap. For Lewis, a "world" is a **maximal spatiotemporally connected sum of individuals**.
  If Humphrey existed in $W_@$ and $W_2$, and Humphrey is a spatiotemporal object, then $W_@$ and $W_2$ would be spatiotemporally connected (via Humphrey). If they are connected, they are, by definition, the *same world*.
  So, to keep worlds distinct (isolated), individuals must be worldbound.

  **Gut Check:** Lewis is prioritizing **logical consistency of properties** over **intuitions about identity**. He'd rather say "it's a different guy" than "the same guy has contradictory properties."

  ---

  ### 2. Kripke's "Humphrey Doesn't Care" Objection

  Kripke's objection in *Naming and Necessity* is famous: *"Humphrey could not care less whether someone else, even if very similar to him, would have been victorious in another possible world."*

  **Does this sink Counterpart Theory (CT)?**
  Short answer: **No.** Long answer: It highlights a cost Lewis is willing to pay.

  **Why it's arguably Question-Begging:**
  Kripke's objection assumes that the *point* of modal talk is to track the fortunes of a transworld "haecceity" (this-ness). He assumes that for "Humphrey could have won" to be meaningful, the subject of the winning must be Humphrey *simpliciter*.
  Lewis replies: "You are assuming the conclusion." Lewis is offering a *reductive analysis* of what that sentence means.
  *   **Kripke:** "When I say 'I could have won,' I mean *me*."
  *   **Lewis:** "I know that's how it *feels*, but metaphysically, what makes that statement true is the existence of a counterpart. Your feeling of 'me-ness' is a psychological projection, not a metaphysical fact."

  Lewis treats "Humphrey" as a non-rigid designator in modal contexts. When you say "Humphrey," you are implicitly quantifying over counterparts.

  **Where Kripke actually hurts Lewis:**
  Kripke hits a nerve not on logic, but on **semantics and de re modality**.
  If CT is true, then *essential properties* become weird.
  Suppose being human is essential to Humphrey. In TWI, Humphrey is human in every world he exists in.
  In CT, Humphrey could have a counterpart that is a robot. If the robot counterpart wins, do we say "Humphrey could have been a robot"?
  Lewis says yes (if the similarity relation is strong enough).
  Kripke says: That's absurd. Humphrey is essentially human.
  Here, Kripke is leveraging the intuition that some properties belong to the *object itself*, not to its similarity relations with other objects.

  **The "Care" Argument Refined:**
  The "Humphrey doesn't care" point is really about **self-interest**.
  Why should I fear death if there is a counterpart in another world who lives?
  Lewis's answer is surprisingly Parfitian (Derek Parfit, who argued personal identity is just psychological continuity). Lewis suggests that *identity* isn't what matters; *similarity* is what matters.
  If my counterpart is 99% like me, wins the election, and is happy, that is close enough to satisfy the truth of "I could have won."
  Kripke thinks this is a bait-and-switch. He thinks identity *is* what matters.

  **Verdict:** Kripke doesn't logically refute CT. He just points out that CT changes the subject of our modal intuitions. If you value logical purity (Lewis), you accept CT. If you value the directness of reference and essentialism (Kripke), you reject it.

  ---

  ### 3. The Real Intuition: Humean Supervenience vs. Modal Magic

  To get the *real* gut-level divide, you have to look at Lewis's broader project: **Humean Supervenience.**

  Lewis wants a universe where everything supervenes on the local arrangement of qualities in spacetime. No spooky action at a distance. No necessary connections between distinct existences.

  *   **Transworld Identity** smells like "Modal Magic" to Lewis. It posits a "thread of identity" that stitches an object across disjoint universes. What *makes* Humphrey in $W_1$ the same as Humphrey in $W_2$? Is there a transworld glue? Kripke says it's primitive (it just is). Lewis hates primitives. He wants an analysis.
  *   **Counterpart Theory** is naturalistic. What makes someone a counterpart? Spatiotemporal continuity, qualitative similarity, causal history. These are observable, natural relations.

  **The Trade-off:**
  *   **Kripke/TWI:** Saves the intuition that *I* am the subject of my possibilities, but costs you a clear metaphysical account of *how* I am in two places at once (or two worlds at once). It treats modality as a primitive feature of objects.
  *   **Lewis/CT:** Saves the metaphysical account (no overlap, no contradictory intrinsics, no modal magic), but costs you the intuition that *I* am literally the one doing the winning in the other world. It treats modality as a feature of *relations between objects*.

  ### Summary

  You aren't missing a step in the argument; you're feeling the friction between two different philosophical priorities.

  1.  **Why not TWI?** Because Lewis thinks it forces you to either accept contradictions (bent and straight) or destroy the concept of intrinsic properties (bent-at-w1). He chooses to fragment the individual to save the properties.
  2.  **Does Kripke sink it?** No. Kripke points out that CT makes modal statements less *personal*. Lewis accepts this cost. He argues that our intuition that "it must be me" is a linguistic habit, not a metaphysical insight.

  **The Nerd-Snipe Conclusion:**
  If you side with Kripke, you are a **Modal Realist about Properties** (essences are real, identity is primitive).
  If you side with Lewis, you are a **Modal Realist about Worlds** (worlds are real, identity is local, modality is resemblance).

  Lewis's system is more logically hygienic; Kripke's is more phenomenologically accurate. The "why" comes down to whether you think metaphysics should clean up our language (Lewis) or describe our experience (Kripke). Lewis thinks experience is a liar; Kripke thinks logic shouldn't override the fact that *I* am the one who could have won.
