      *   Let $N$ be the total number of tray visits.
      *   If I use probability $p$ at each visit:
          *   Prob(Eat 0) = $(1-p)^N$
          *   Prob(Eat 1) = $N \cdot p \cdot (1-p)^{N-1}$
          *   Prob(Eat >1) = $1 - \text{Prob}(0) - \text{Prob}(1)$
      *   The utility function $U$ seems to be: $U(1) = \text{High}$, $U(0) = \text{Low}$, $U(>1) = \text{Low}$.
      *   To maximize utility, I want to maximize Prob(Eat 1).
      *   Function to maximize: $f(p) = N p (1-p)^{N-1}$.
      *   Take derivative w.r.t $p$: $N(1-p)^{N-1} - N p (N-1)(1-p)^{N-2} = 0$.
      *   $(1-p) - p(N-1) = 0 \Rightarrow 1 - p - Np + p = 0 \Rightarrow 1 = Np \Rightarrow p = 1/N$.
