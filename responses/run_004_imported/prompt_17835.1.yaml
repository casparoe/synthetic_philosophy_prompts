answer: |-
  "The logic holds regardless of the man," Mark said, swirling his whiskey like it was a problematic premise. "You're committing the genetic fallacy, Sarah. The *Begriffsschrift* doesn't care about Weimar. The truth conditions of 'The Morning Star is the Evening Star' remain invariant whether Frege was a democrat or a reactionary."

  Sarah leaned forward, elbows on the sticky table. "I'm not talking about truth conditions. I'm talking about the *drive*. You know how obsessed he was with purging the 'psychological' from logic? He wanted thoughts without thinkers. A 'Third Realm' untouched by actual human messiness."

  "Because psychology is subjective," Mark countered. "If logic depends on how we think, it collapses into relativism. He was protecting objectivity."

  "Was he? Or was he building a fortress?" Sarah took a sip of wine. "Look at the diary. He wants to strip rights from Jews because they introduce 'alien' elements into the German body politic. He wants a strongman to impose order. Now look at the philosophy. He wants to strip the 'psychological' from sense because it introduces ambiguity. He wants a logical strongman to impose exactness. The architecture is the same. It's a hunger for purity."

  Mark shook his head. "That's a metaphor, not an argument. You're saying because he wanted political purity, his distinction between sense and reference is secretly authoritarian? That's absurd. The distinction explains cognitive significance. It works. It does the job."

  "It does the job of excluding the contingent," Sarah said. "I'm not saying the logic is false. I'm saying the *motivation* for that specific kind of logic—the fear of contamination, the insistence on a single, rigid order—isn't philosophically inert. It shapes what questions get asked. It shapes what counts as a 'thought.' If a thought must be immutable to be objective, then changing your mind isn't learning; it's error. That's not just semantics. That's an ethic."

  "So what's the alternative?" Mark asked, sharper now. "We trash the sense/reference distinction because the guy was a bigot? We tell grad students that objective truth is just a fascist fantasy? That's throwing the baby out with the bathwater because the bathwater is toxic."

  "I'm saying the baby was born in that toxic water," Sarah replied. "We don't trash it. We read it haunted. We acknowledge that the desire for a realm beyond human judgment—the Third Realm—might be less about discovering truth and more about escaping the responsibility of democratic disagreement. He wanted thoughts that couldn't be voted on."

  Mark sighed, leaning back. "You want to politicize the Third Realm. I want to protect the logic from the biography. If we conflate them, we lose the tools to critique him. We need the logic to be clean so we can see the man clearly."

  "And I'm worried," Sarah said softly, "that if we keep the logic too clean, we stop seeing the man at all. We just see the monument."

  They sat in silence for a moment, the noise of the conference bar filling the gap. Mark raised his glass, but didn't clink. "To the tools, then."

  Sarah lifted hers, hesitating. "To the ghosts in the machine."

  They drank, neither fully satisfied, the distinction between the sense of the words and their reference hanging unresolved in the air.
