              *   **ATTRIBUTION ERROR:** The Causal Exclusion Argument is primarily associated with **Jaegwon Kim**, *not* Donald Davidson. Davidson is associated with *Anomalous Monism* (which argues *against* strict psychophysical laws, but tries to save mental causation via token identity). Kim is the one who pressed the exclusion problem *against* non-reductive physicalism (including Davidson's). Attributing the exclusion argument to Davidson is a major error in a philosophy of science/mind context.
