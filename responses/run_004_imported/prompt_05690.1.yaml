      *   **The Mechanism (Briefly):** Explain *why* the bookie wins (violating additivity, etc.) without getting bogged down in math.
      *   **The Pragmatic/Epistemic Gap:** This is the user's main pushback. Address the "just don't bet" counter. *Analysis:* If beliefs guide action, and betting is a proxy for action, the gap narrows. But it doesn't close entirely unless we accept a specific norm.
      *   **The Hidden Premise (Dominance):** Identify the smuggled principle. It's not just "don't lose money," it's "don't choose an option that is strictly worse in all possible worlds." This is the *Principle of Dominance*.
      *   **The Converse Theorem:** What does it do? It shows coherence is *safe*. It doesn't prove incoherence is *fatal* without the dominance principle. It prevents the "why not just be super conservative?" objection.
      *   **Betting Quotients vs. Credences:** Address the psychological reality. If I say 0.7 but bet 0.5, is the DBA relevant? *Analysis:* DBA defines credence *operationally*. If you reject the operational definition, DBA loses grip.
