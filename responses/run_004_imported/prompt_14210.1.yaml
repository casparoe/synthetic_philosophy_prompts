answer: |-
  The rain against the safehouse window was the only sound that didn't feel like a calculation. Elias stood over the table, where a map of the region was spread out, weighted down by a pistol and a half-empty mug of coffee. There were two routes out. North, into the jagged anonymity of the mountain passes. South, into the dense, camera-choked grid of the city.

  The Bureau's Algorithm knew he was here. It also knew where he would be tomorrow. That was the nature of the system: an infallible predictor of human movement based on psychological profiling. If Elias went North, the Algorithm would have predicted North, and the drones would be waiting in the pass. If he went South, the drones would be waiting at the checkpoint.

  "It doesn't matter," Sarah said from the corner. She was cleaning her glasses, her movements slow, deliberate. "You're going to be caught either way. The prediction is already made. So, where would you rather be when they take you? I hear the mountains are beautiful this time of year."

  Elias frowned, his hand hovering over the Northern route. "If I choose the mountains, I make it true that the Algorithm predicted the mountains."

  "No," Sarah corrected gently. "The Algorithm predicted you because of who you are. Your choice now is just the final step of what it already saw. Conditioning on the act, the probability of capture is one hundred percent in both cases. So just maximize the utility of the scenery. Go North."

  Elias picked up his pack and began stuffing it with supplies. *North,* he thought. *I prefer the North.* But as he zipped the bag, a cold knot tightened in his stomach. If he committed to North, he was effectively announcing his location to the Algorithm. The Algorithm didn't read minds; it read decisions. By deciding on North, Elias made North the place where the prediction was fulfilled.

  He stopped. He looked at the map. If he went North, he walked into a trap. Therefore, he should go South.

  He unzipped the bag and dumped the contents back onto the table.

  "Changing your mind?" Sarah asked.

  "If I go South, the Algorithm predicted South," Elias said, his voice tight. "My decision is the evidence that locks the drone's coordinates. I can't go where I decide to go."

  "Then don't decide," Sarah said, returning to her glasses. "Just go. The correlation is fixed. You're treating your choice like it causes the prediction, but it's just evidence of it."

  "But I have to choose!" Elias snapped. He paced the room. He tried to settle on South. He imagined himself driving the southern highway. But the moment he felt the resolve solidify, the logic turned against him. *If I am resolved to South, the Algorithm knows South. South is death.*

  He grabbed the bag again. *North.* He felt the resolve shift. *If I am resolved to North, the Algorithm knows North. North is death.*

  He dropped the bag. He was spinning. Every pure strategy he contemplated immediately invalidated itself. To choose a location was to signal that location to a predator that acted on the signal before the signal was even sent. He was trapped in a loop of his own rationality. Any specific intention he formed became a reason to abandon that intention. He was a system seeking equilibrium in a game where every stable state was a losing state.

  Sarah watched him with a mild pity. She was already walking toward the door, bag slung over her shoulder. "I'm going North. I like the view. If the drones are there, they're there. Worrying about it doesn't change the prediction, Elias. It just ruins the drive."

  She left him there. She hadn't spiraled. She had accepted the correlation as fixed evidence and optimized within it. She was acting on the news her choice provided, not trying to causally outrun it. But Elias couldn't let go of the causal link. He felt that his deliberation was the engine driving the prediction. As long as he preferred one outcome over the other, the Algorithm would prefer it too, because the Algorithm was a mirror of his own reasoning.

  He needed a move that didn't come from preference. He needed a cause that wasn't *him*.

  He looked at the pistol on the map. No, that was final. He looked at the coffee mug. No. His eyes landed on a small pile of change near the sink. Quarters.

  If he let chance decide, his decision wasn't "North" or "South." His decision was "flip the coin." The Algorithm could predict the coin toss, certainly. It could know the physics of the flip, the air resistance, the force of his thumb. But it couldn't know the outcome *before* the outcome existed, not in a way that allowed Elias to second-guess it during deliberation.

  More importantly, a mixed strategy broke the link between his *preference* and his *action*. If he committed to a fifty-fifty chance, he wasn't signaling North. He wasn't signaling South. He was signaling noise.

  He picked up a quarter. His hand was shaking. He wasn't doing this because he thought it would save him—the drones would still be waiting wherever the coin landed. He was doing it because it was the only way to stop the oscillation. It was the only decision state that was ratifiable. If he decided to flip the coin, he had no reason to switch to a pure strategy, because a pure strategy guaranteed capture based on his own intent. The coin toss was the only choice that didn't talk him out of itself.

  He placed the coin on the back of his thumb. He looked at the map one last time. The North route was scenic. The South route was faster. It didn't matter. The utility was in the stability of the mind, not the geography of the capture.

  "Heads," he whispered. Not a prediction. Just a call.

  He flipped the coin. It caught the light, a silver blur spinning in the damp air of the room, divorcing his fate from his fear, turning a paradox into a probability. He watched it arc, finally ready to go wherever it landed, because for the first time, he hadn't decided the destination himself.
