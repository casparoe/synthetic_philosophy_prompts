      *   **Key Papers:** Kleinberg, Mullainathan, Raghavan (2016) "Inherent Trade-Offs in the Fair Determination of Risk Scores" and Chouldechova (2017) "Fair prediction with disparate impact: A study of bias in recidivism prediction instruments."
      *   **Metrics Involved:**
          1.  *Calibration within groups:* $P(Y=1 | S=s, A=a) = P(Y=1 | S=s, A=b)$. (Given a score $s$, the probability of outcome $Y=1$ is the same across groups $A$).
          2.  *Balance for the negative class (Equal FPR):* $P(S=high | Y=0, A=a) = P(S=high | Y=0, A=b)$.
          3.  *Balance for the positive class (Equal FNR):* $P(S=low | Y=1, A=a) = P(S=low | Y=1, A=b)$.
          *   *Note:* The prompt calls (2) "balance between groups" encompassing both FPR and FNR equality. This is often referred to as "Equalized Odds" (Hardt et al.) or specifically "Balance" in Chouldechova's terminology.
      *   **The Impossibility Result:** You cannot satisfy Calibration + Equal FPR + Equal FNR simultaneously unless Base Rates are equal ($P(Y=1|A=a) = P(Y=1|A=b)$) or the classifier is perfect (AUC=1).
      *   **The COMPAS Dispute (ProPublica vs. Northpointe):**
          *   *ProPublica:* Focused on Error Rates (FPR/FNR). Found Black defendants had higher FPR and lower FNR than White defendants. Claimed bias.
          *   *Northpointe:* Focused on Calibration. Found that for a given risk score, recidivism rates were similar across races. Claimed fairness.
          *   *Resolution:* The impossibility theorem explains why they found different things. Base rates differed. Both were mathematically correct based on their chosen metric.

