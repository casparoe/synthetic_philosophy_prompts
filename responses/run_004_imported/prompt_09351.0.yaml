  ### A Note for You (The Grader)

  Since you mentioned you picked this up from blog posts and aren't fully confident: **You caught a tricky trap.**

  This is a very common mistake for people new to this field. Because the "Impossibility Theorem" is the headline, people often memorize the *math* but blur the *history*.
