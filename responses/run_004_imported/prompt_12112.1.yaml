      *   **Move (3) - Theo (The Causal Challenge):** "Narrowest validated class" smuggles in causal assumptions. Different narrow classes (marathon vs. biomarkers) can disagree. Deciding relevance presupposes causal structure. Cross-validation just relocates the problem.
          *   *Analysis:* This is a strong point. Model selection criteria (like AIC/BIC or cross-validation) optimize for *prediction*, not necessarily *truth* or *causal structure*. If the goal is "Mara's risk" (a causal/propensity fact), prediction might not get you there (e.g., spurious correlations). It highlights the distinction between epistemic probability (degree of belief based on data) and ontic probability (objective chance).
