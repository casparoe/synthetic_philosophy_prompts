      *   *The Core Question:* Does Mara escape RCP? No, she dissolves it by changing the definition of "probability." She turns it into a decision-theoretic problem (what model minimizes loss?), not a truth-conditional one. Theo is right that this doesn't solve the *metaphysical* RCP, but Mara is right that the metaphysical RCP might be the wrong target for clinical medicine.
      *   *Synthesis:* The "Single-Case Propensity" vs. "Epistemic Utility" distinction. Maybe invoke Hájek's distinction between *attribute* and *reference class*. Or better, the distinction between *aleatory* and *epistemic* uncertainty.
      *   *Who wins?* Mara wins on *utility* (clinical practice). Theo wins on *metaphysics* (what the number *means*).
