      *   *The "Luck" Objection:* If a choice is undetermined (quantum random), it happens *by chance*. If it happens by chance, it's not *up to the agent* in a way that grounds responsibility. It's just a roll of the dice in the brain.
      *   *Strawson's Specific View:* Strawson is a pessimist (hard incompatibilist). He argues that even if determinism is false, indeterminism doesn't give you the *control* needed for ultimate responsibility. In fact, it might make it worse (you're responsible for *less* of what happens if some of it is random).
      *   *The Regress Remains:* Even if a choice is undetermined, to be *ultimately responsible* for that choice, you must be responsible for the probabilistic weights or the mechanism that allowed the randomness to result in *that* choice. You still need to be *causa sui* regarding the nature of the agent that harnesses or embodies that randomness.

