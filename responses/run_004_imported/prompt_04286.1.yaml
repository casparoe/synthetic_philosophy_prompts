answer: |-
  **Setting:** *A quiet corner of a university library café. Two philosophy professors, Dr. Aris Thorne (specializing in philosophy of religion and skepticism) and Dr. Elena Corves (specializing in philosophical theology), are having coffee after a departmental colloquium.*

  **Aris:** I'm glad you stayed, Elena. I wanted to pick your brain about the Q&A session. When I brought up Schellenberg's Argument from Divine Hiddenness, I felt the room got a bit uncomfortable. You offered the "freedom" defense—the idea that God remains hidden to preserve our free choice. But I have to say, it strikes me as the most vulnerable point in the theist's armor.

  **Elena:** (Smiling) I expected you to say that. It's the standard objection, after all. But I think the discomfort comes from people conflating "freedom" with "ability to do otherwise." Schellenberg's argument is powerful because it hinges on the nature of *love*. If God is perfectly loving, He desires a reciprocal relationship. Reciprocity requires belief. So, blameless non-belief implies God isn't there, or isn't loving. My claim is simply that certain kinds of belief undermine the *quality* of the reciprocity.

  **Aris:** Let's dig into that. Your claim, following Michael Murray and others, is that if God's existence were overwhelmingly obvious, belief would be coerced. But this seems to confuse *epistemic* freedom with *pragmatic* freedom. Look, I know the sun exists. The evidence is overwhelming. But I'm not coerced into loving the sun, or obeying it, or entering a relationship with it. Evidence compels assent to a proposition, sure, but it doesn't compel a moral response. So why would God's manifest presence coerce *relationship*?

  **Elena:** That's a fair distinction, Aris, but I think it underestimates the psychological impact of direct divine manifestation. It's not just about knowing a fact, like "the sun exists." It's about being in the presence of an authoritative moral agent. If you were in a room with a human judge who had the power to instantly punish or reward you, your freedom to interact with them "naturally" would be severely compromised. You'd be constantly calculating your behavior to avoid punishment or gain favor.

  **Aris:** But that assumes the relationship is transactional. Schellenberg is talking about *personal* relationship. If I meet a person I'm attracted to, and they reveal themselves fully to me, that doesn't coerce me into loving them. It might make the stakes higher, but it doesn't remove my freedom to reject them. In fact, isn't it *more* loving to be open? Hiding seems manipulative. If I hide my identity from a potential partner to test their loyalty, we don't call that "preserving freedom"; we call that playing games.

  **Elena:** I agree that manipulation would be unloving. But the analogy of the romantic partner assumes a peer relationship. In theism, the ontological gap is vast. If God were to reveal Himself in His fullness, it wouldn't be like meeting a peer; it would be like a moth encountering a blowtorch. The "epistemic distance" isn't a game; it's a buffer zone. It allows humans to develop moral autonomy *before* they are confronted with the overwhelming weight of Divine authority. If you grow up knowing, with absolute certainty, that a cosmic authority is watching and judging, your moral development is stunted. You become a cosmic conformist, not a moral agent.

  **Aris:** Okay, let's grant that for the sake of argument. Let's say epistemic distance is necessary for *moral development* in childhood or early adulthood. That addresses the "soul-making" theodicy. But Schellenberg's argument is much more specific. It focuses on *non-resistant non-believers*. These aren't rebels. These are people who have searched sincerely, perhaps for decades.

  Consider an eighty-year-old woman. She's lived a full life. Her character is formed. She's not going to become a "cosmic conformist" at this stage; her habits are set. She prays, she seeks, she wants a relationship, but she gets silence. If God reveals Himself to her now, on her deathbed, how does that undermine her freedom? Her character is already fixed. The "soul-making" period is over. Why hide from *her*?

  **Elena:** That is the strongest version of the objection, I admit. The "late-in-life seeker." But I think there are two responses here. First, we have to question whether character is ever truly "fixed" in a way that makes epistemic distance irrelevant. Even at eighty, the *nature* of the belief matters. If God appears to her in a blaze of glory, her assent is still compelled by the overwhelming evidence. She hasn't had the opportunity to trust; she's only had the opportunity to submit.

  **Aris:** Submit versus trust. That's the crux, isn't it? But Schellenberg would say that's a false dichotomy. I can trust someone whose existence is obvious. I trust my mother exists; I also trust she loves me. The evidence of her existence doesn't negate the evidence of her love. Why can't God make His existence obvious *and* His love obvious, without forcing submission?

  **Elena:** Because the *kind* of love God offers involves transformation. If God reveals Himself directly, the experience is so overpowering that it bypasses the will. It's the difference between choosing to walk into a light and having the light switched on in a dark room so brightly you can't help but see. Schellenberg assumes belief is a simple switch. I'm arguing that for a relationship with God to be meaningful, the *path* to belief must involve a voluntary orientation of the will.

  But to your specific point about the eighty-year-old: If God made an exception for her, He would compromise the epistemic environment for everyone else. Divine hiddenness isn't just individual; it's communal. If God revealed Himself to one sincere seeker in a public, undeniable way, the news would spread. Then, *everyone* would believe under coercion. The "rules of the game" would change for the whole species based on one exception.

  **Aris:** That feels like a utilitarian calculation that sacrifices the individual for the collective. A perfectly loving God, surely, would value the individual relationship enough to risk the general environment. Or, He could reveal Himself privately to her. A mystical experience that convinces *her* but isn't publicly verifiable. That solves the communal problem. Why not that?

  **Elena:** And perhaps He does. We're operating on the assumption that because *we* don't see the revelation, it didn't happen. But let's step back from the specific mechanics for a moment. You're worried that if I say "God has reasons we don't understand," I'm retreating into the "mysterious ways" defense, which shuts down inquiry.

  **Aris:** Exactly. If you say, "God has a reason for hiding from that eighty-year-old," you're essentially saying, "We can't judge God's love by human standards." But Schellenberg's argument *starts* with human standards of love. We infer God's nature from the concept of perfect love. If God's love is so different from human love that hiding from a sincere seeker is compatible with it, then the term "love" has lost its meaning. You can't have it both ways: you can't say God is loving in a way we understand, but then say His actions are loving in a way we *don't* understand when challenged.

  **Elena:** I accept that constraint. I'm not going to say "God's ways are higher." I'm going to say that our understanding of "relationship" might be too narrow. You're defining relationship as "conscious awareness of God's existence plus interaction." I'm defining it as "alignment of the will with the Good."

  If God is the Good, then seeking the Good *is* seeking God, even if the propositional belief "God exists" is missing. The eighty-year-old woman who seeks truth and love is already in a relationship with God, ontologically speaking, even if she lacks the epistemic label. God's hiddenness, in this view, isn't absence; it's the condition that allows her seeking to be *her* seeking, rather than a reaction to a divine command.

  **Aris:** But that redefines the terms of Schellenberg's argument. Schellenberg is talking about *explicit* personal relationship. If I don't know you exist, I can't have a personal relationship with you, even if I love the *idea* of you. If the theist redefines "relationship" to mean "moral alignment," you've conceded the point that *personal* relationship isn't actually the goal.

  **Elena:** Not conceded. Expanded. Look, Aris, the Argument from Hiddenness assumes that the primary goal of human life is *conscious communion* with God. What if the primary goal is *moral and spiritual maturation* that *leads* to communion? Hiddenness is the gym, not the prison.

  To your point about the eighty-year-old: If she has sought sincerely for decades without resistance, why the silence? My response is that we cannot know the internal state of the seeker with certainty. "Non-resistance" is hard to verify from the outside. Perhaps there was a subtle resistance—a demand for God to appear on *her* terms, rather than His. If God appeared whenever we demanded it, He becomes a genie, not a Father. The hiddenness preserves the distinction between Creator and creature.

  **Aris:** (Leaning forward) Now we're getting somewhere. You're arguing that the *demand* for evidence, even a sincere one, can itself be a form of resistance if it treats God as an object to be verified rather than a subject to be encountered.

  **Elena:** Precisely.

  **Aris:** But here's the rub. That moves the goalposts on "non-resistance." Schellenberg defines non-resistance as not actively opposing God. You're defining it as not *demanding* specific evidence. If a seeker says, "I want to believe, but I need more than I have," is that resistance? Or is that just honesty? If God requires us to believe without what we consider sufficient evidence, isn't that asking us to be intellectually dishonest?

  **Elena:** It's asking us to acknowledge the limits of our epistemology. In human relationships, we often commit to people without "sufficient evidence" that they won't hurt us. We take a risk. Faith is that risk. If God provided "sufficient evidence" in the scientific sense, risk would be eliminated. And without risk, there is no trust.

  So, to answer your challenge about the "mysterious ways" trap: I am not saying we can't know *any* reasons. I am offering a principled reason: Epistemic distance is required for the possibility of trust. Trust cannot exist where knowledge is coercive. This applies to the eighty-year-old just as much as the teenager, because the capacity for trust remains until death. If God reveals Himself at the last moment, the opportunity for *trust* is gone, replaced by *sight*. And as the New Testament puts it, "We walk by faith, not by sight."

  **Aris:** I see. So you're arguing that the *mode* of knowing is more important than the *fact* of knowing. A relationship based on "sight" (direct manifestation) is inherently inferior to one based on "faith" (trust despite hiddenness).

  **Elena:** Yes. A relationship based on sight is a relationship of necessity. A relationship based on faith is a relationship of freedom.

  **Aris:** But Schellenberg would press you here: Is a relationship based on faith *so* superior that it justifies God allowing people to miss out on the relationship entirely? Because that's the stakes. It's not just about having a "better" relationship; it's about having *no* relationship because the person dies without belief. If God hides to preserve the *quality* of the relationship, but the result is that the relationship never happens for some people, hasn't the strategy failed? A loving parent doesn't hide from their child to teach them independence if hiding means the child never finds them.

  **Elena:** That is the hardest question. And I won't pretend to have a knock-down proof. But I would argue this: Theism usually entails an afterlife. If this life is the *only* chance for relationship, your objection is devastating. But if this life is a prenatal stage—a gestation period—then hiddenness is temporary. The eighty-year-old seeker who dies without belief isn't necessarily lost forever. She may encounter God immediately after death. The hiddenness was only for *this* phase, the phase where free moral choice is possible.

  **Aris:** Ah. So you're kicking the can down the road to the afterlife.

  **Elena:** (Laughs) I prefer "extending the timeline." If the goal is eternal relationship, then temporal hiddenness is a small price for the preservation of the freedom that makes that relationship meaningful. Schellenberg assumes that if God doesn't reveal Himself *now*, He doesn't want a relationship *ever*. I'm saying He wants a relationship *forever*, and that requires getting the *foundation* right *now*.

  **Aris:** I appreciate the consistency, Elena. You've avoided the "mystery" trap by grounding your defense in a specific theory of value: that free trust is more valuable than compelled sight, even if it risks temporary separation.

  **Elena:** And I appreciate your pushback, Aris. You kept me from sliding into "God knows best." You forced me to articulate *why* hiddenness might be best.

  **Aris:** Though I'm not convinced. It still seems to me that a perfectly loving God could find a way to be known without overwhelming the will. But I'll concede this: The Argument from Hiddenness doesn't prove God *doesn't* exist; it proves that if God exists, He values a specific kind of freedom more than we might expect.

  **Elena:** And I'll concede that if that specific kind of freedom comes at the cost of genuine, lifelong confusion for sincere seekers, it is a costly value to hold. It's not a tidy solution. But it's not irrational.

  **Aris:** No. It's not irrational. It just requires a very specific set of theological commitments to make it work.

  **Elena:** Which is exactly where philosophy of religion should leave us. Not with proofs, but with clarified commitments.

  **Aris:** (Raising coffee cup) To clarified commitments, then.

  **Elena:** (Clinking her mug against his) And to the questions that keep us honest.
