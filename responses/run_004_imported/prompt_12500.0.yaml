answer: |-
  Your friend’s reasoning is a classic philosophical error known as the **Fatalist Fallacy** or the **Idle Argument** (*argos logos*). While it sounds logically sound, it fails because it conflates the **truth** of a statement with the **causes** required to make it true.

  She is not right; her preparation is not powerless. The argument goes wrong in three specific places:

  ### 1. Confusing Truth with Causal Independence
  The core flaw is assuming that because a statement about the future is "already true," it is true *regardless* of what you do. This is false. The truth of a future event is almost always **dependent** on a specific causal chain.

  Consider this analogy: It is already true that you will be warm tomorrow. Does this mean you don't need to turn on the heat? No. The statement "I will be warm" is only true *because* you will turn on the heat. If you didn't turn on the heat, the statement would be false. The "truth" of the outcome does not exist in a vacuum; it is tethered to the actions that cause it.

  ### 2. The "If" is Part of the "That"
  Your friend treats the outcome as an isolated fact. In reality, the proposition "I will get the job" is shorthand for a conditional: **"I will get the job *if* I interview well."**

  By rehearsing, she is not trying to change a "fixed" future; she is ensuring that the necessary conditions (the "if") are met. If she skips the rehearsal, the "fixed" reality she is currently relying on vanishes and is replaced by a different fixed reality: one where she fails because she was unprepared.

  ### 3. Fatalism vs. Determinism
  Your friend is confusing **logical fatalism** (the idea that the future is a script already written) with **causal determinism** (the idea that the future is the result of current variables).

  Even if the universe is 100% deterministic, the "fixed" future is a calculation based on the present. 
  *   **Current State:** Unrehearsed $\rightarrow$ **Fixed Future:** No Offer.
  *   **Current State:** Rehearsed $\rightarrow$ **Fixed Future:** Offer.

  Her argument assumes the "Fixed Future" is a destination she is traveling toward regardless of her path. In reality, the "Fixed Future" is the mathematical result of her current position and velocity. Changing her preparation changes the calculation.

  ### Summary
  The argument fails because it treats the future as a **consequence** of the present, rather than a **cause** of it. She cannot change the fact that *some* future is fixed, but she has total power to determine *which* future is fixed. Her rehearsal is not "theatre"; it is the mechanism by which the "good" future becomes the true one.
