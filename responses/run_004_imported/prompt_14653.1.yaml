answer: |-
  **Setting:** *A sidewalk outside a university physics building. Late afternoon. Two former colleagues, ARTHUR (a philosopher of science, staunch Presentist) and ELENA (a relativistic cosmologist, staunch Eternalist), have just bumped into each other. They are now standing by a coffee cart, having finished the initial greeting. The conversation has inevitably turned to the Andromeda Paradox.*

  **Arthur:** So, let me get this straight. Because I was walking *toward* the evening sky, and you were walking *away* from it, my "now" in Andromeda is three days ahead of yours?

  **Elena:** Roughly. Given the distance—2.5 million light-years—even a walking speed tilts the plane of simultaneity enough to cover days. For you, the alien fleet has already launched. For me, the decision hasn't even been made yet.

  **Arthur:** And you're comfortable with that? You're comfortable saying that whether a fleet exists is a function of my pedestrian velocity?

  **Elena:** I'm comfortable saying that *simultaneity* is a function of your velocity. The fleet's existence isn't relative. The fleet just *is*. It's a world-line in spacetime. You're just slicing the loaf of bread at a different angle than I am.

  **Arthur:** That's the Block Universe. The static loaf. I know the script, Elena. But this is reductio ad absurdum. If relativity implies that "what exists" changes because I turn my heel, then relativity is giving us a bad ontology.

  **Elena:** Or your ontology is too small for the universe. You want "existence" to be a universal property. SR says it's a relation.

  **Arthur:** No, I want reality to be *real*. Look, I have a countermove. You know I do. We've argued this since grad school. Just because SR says there's no preferred frame doesn't mean there *isn't* one.

  **Elena:** The Neo-Lorentzian escape hatch.

  **Arthur:** Call it what you want. There is a true, privileged slice of simultaneity. A God's-eye "Now." It just happens to be empirically inaccessible to us because of the way light and matter behave. The physics works out the same, but the metaphysics is saved. There *is* a fact of the matter about the alien fleet. We just can't know it yet.

  **Elena:** Arthur, be honest. That's a metaphysical ghost. You're positing an entire structure of reality—a privileged ether, essentially—that makes absolutely no difference to any experiment, any observation, or any prediction.

  **Arthur:** It makes a difference to *truth*.

  **Elena:** Does it? If no signal can ever travel faster than light, and no experiment can detect this privileged frame, in what sense is it "real"? It's invisible, intangible, and causally inert. You're adding furniture to the universe that no one can ever trip over. Occam's razor should shave that off clean.

  **Arthur:** Occam's razor cuts away excess entities, not necessary truths! If Presentism is true—if the passage of time is the fundamental feature of reality—then a privileged frame *must* exist. If the math of SR doesn't show it, that's a limitation of the math, not reality. You physicists treat the map as the territory.

  **Elena:** And you philosophers treat your intuitions as data. Look, the reason Einstein killed the ether wasn't just elegance. It was that the "privileged frame" idea requires a conspiracy. Why does light *always* behave as if there's no privileged frame, if there actually is one? To save your "Now," you have to assume the universe is actively hiding the truth from us. That's not science; that's theology.

  **Arthur:** Better theology than nihilism! Your Block Universe kills agency. If the alien fleet launch is "already there" in the block, just waiting for my world-line to intersect it, then nothing is ever *becoming*. It just *is*. That contradicts every lived experience of choice and consequence.

  **Elena:** Lived experience also tells us the sun goes around the Earth. We learned to trust the math over the senses.

  **Arthur:** Fine. Let's drop the privileged frame. I'll concede that point. But I don't have to accept the Block. I can shift the definition of "real."

  **Elena:** Oh? How so?

  **Arthur:** I deny that events in Andromeda are "real" to me *at all* until I can see them. I define reality by my past light cone. If the light from the launch hasn't hit me, it hasn't happened *for me*.

  **Elena:** So you're a Solipsist of the Here-and-Now?

  **Arthur:** I'm a Relativistic Presentist. Existence is relative to the observer. There is no absolute "now," but there is an absolute "here-now." What is real is what can causally affect me. The alien fleet is merely *potential* until the photons hit my retina.

  **Elena:** Okay, stop. Do you realize what you just sacrificed? You started this argument because you wanted to save the idea of a shared, objective world. You wanted *one* reality where the fleet either has or hasn't launched.

  **Arthur:** I want a reality that respects causality.

  **Elena:** But by tying existence to your light cone, you've fragmented reality. If you walk toward Andromeda and I walk away, and we define "real" by our light cones... well, our light cones overlap mostly, but not entirely. Are you saying the fleet exists for me but not for you?

  **Arthur:** I'm saying it's not *determinate* for me.

  **Elena:** That's worse! You've saved Presentism by making existence observer-dependent. But that's exactly what the Eternalist says! We say the *time* of the event is relative to the frame. You're saying the *existence* of the event is relative to the frame. You haven't gained anything! You've just moved the relativity from "when" to "if."

  **Arthur:** It preserves the open future!

  **Elena:** Does it? Let's say I move toward Andromeda fast enough that the launch enters my past light cone, but you stay still. For me, the fleet has launched. For you, it's still potential. But we can talk to each other. I can tell you it launched. Did the fact become real when I spoke? Or was it real when I saw it? If I can tell you, it's in your past light cone too.

  **Arthur:** It becomes real when the information reaches me.

  **Elena:** So reality ripples outward at the speed of light?

  **Arthur:** Essentially.

  **Elena:** Arthur, think about what that implies. It means the "real" universe is a tiny, shrinking point at the tip of your light cone. Everything else is... what? Purgatory? Limbo? You've traded the Block Universe for a universe where 99% of spacetime is ontologically fuzzy. And for what? To save the feeling that "now" is special?

  **Arthur:** Because "now" *is* special! It's the only place where action happens.

  **Elena:** But your light-cone presentism destroys the "shared" part of "shared now." If existence is relative to the observer, then we don't live in the same world. We live in overlapping bubbles of actuality. That's not Presentism; that's just Fragmentalism. It doesn't give you the objective flow of time you crave. It gives you billions of private movies.

  **Arthur:** (Pauses, takes a sip of coffee) Okay. You're right. That move... it does feel like surrendering the objective world.

  **Elena:** It is.

  **Arthur:** But Elena, look at me. You can't tell me you *feel* the fourth dimension. You don't walk through spacetime perceiving your birth and death as equally present. You feel the flow. The "becoming." If the physics says that feeling is an illusion, maybe the physics is incomplete. Not wrong about the predictions, but incomplete about the *nature* of time.

  **Elena:** I feel the flow because I have a memory and an anticipation. My brain is a thermodynamic engine processing entropy. That creates the arrow. It doesn't require the future to be non-existent.

  **Arthur:** That explains the *direction*, not the *passage*. The "moving spotlight." Why am I *here* at this slice of the block and not another? In your Block, "now" is just a label. But it feels like a location.

  **Elena:** And there it is. There's the bone.

  **Arthur:** What is?

  **Elena:** You're asking physics to answer a question physics isn't built to ask. You want to know why consciousness rides the world-line the way it does. You want the "Now" to be an ontological primitive. I'm telling you that "Now" is a coordinate, like "Here."

  **Arthur:** But "Here" is different. I can go back to "Here." I can't go back to "Then."

  **Elena:** You can't go back to "Here" if you move! "Here" is indexical. It depends on where you stand. "Now" is indexical. It depends on where you stand in spacetime. The fact that you can't move backward in time is a constraint on world-lines, not proof that the future doesn't exist.

  **Arthur:** So you think the disagreement is just linguistic?

  **Elena:** I think the disagreement is about authority. You trust the phenomenology—the feeling of time passing—as data equal to the Michelson-Morley experiment. I trust the symmetry of the laws of physics.

  **Arthur:** And if the symmetry is wrong? If there is a preferred frame, but we just haven't found the experiment to detect it?

  **Elena:** Then I'll be wrong. But until then, I won't break the geometry of the universe to save the feeling of a Tuesday afternoon.

  **Arthur:** (Smiles wryly) And I won't sacrifice the reality of the Tuesday afternoon to save the geometry.

  **Elena:** So we're at a stalemate.

  **Arthur:** No. We've located the fault line. It's not about Andromeda. It's not even about light cones. It's about whether we think the universe is made of *stuff* or made of *events*.

  **Elena:** And whether we think "existence" means "can be measured" or "is happening."

  **Arthur:** Exactly. You win on the physics, Elena. I'll grant you Minkowski space. It works.

  **Elena:** And I'll grant you that the Block Universe is cold. It doesn't leave much room for... hope.

  **Arthur:** (Looks up at the evening sky, toward Andromeda) Well. Whether the fleet has launched or not... I suppose we'll both find out in 2.5 million years.

  **Elena:** Or in a few days, depending on how fast you walk home.

  **Arthur:** Don't tempt me. I'm walking away from it. Just to spite you.

  **Elena:** (Laughs) Then for you, the decision is still pending. For me, it's already done.

  **Arthur:** Then let's agree to disagree on when "now" is.

  **Elena:** Agreed. But the coffee is real for both of us. And it's getting cold.

  **Arthur:** Now *that* is a tragedy we can both observe simultaneously.
