          *   Conclusion: A Necessary Being (God) explains itself.
          *   *Taxicab Charge:* Why does PSR apply to the universe but not to God? Why is God "necessary"?
      *   **Kalam (KCA):**
          *   Premise 1: Whatever begins to exist has a cause.
          *   Premise 2: The universe began to exist.
          *   Conclusion: The universe has a cause (God).
          *   *Taxicab Charge:* Why doesn't God need a cause? *Reply:* God didn't *begin* to exist.
          *   *Counter-Charge:* Why assume the universe *did* begin to exist? Is that arbitrary?

  3.  **Evaluate the "Taxicab" Avoidance:**
      *   *Leibniz:* The PSR is universal. Stopping at a Necessary Being requires defining "necessity" in a way that exempts God from the demand for external explanation. Critics say this is ad hoc. Defenders say logical necessity *is* the explanation.
      *   *Kalam:* The causal principle is restricted (only things *beginning*). God is eternal, so the principle doesn't trigger. This looks logically cleaner *structurally*.
      *   *The Catch:* The Kalam shifts the burden to Premise 2 (The universe began). If the universe *could* be eternal (beginningless), the argument fails. If the universe is eternal, why doesn't it get the same exemption as God?
