      *   *Decision:* The Kalam *does* avoid the logical inconsistency of the Taxicab objection better than Leibniz. However, it pays for this by making a much stronger, more vulnerable empirical/metaphysical claim about the universe's temporal finitude. So, it escapes the *logical* charge of arbitrariness regarding the *principle*, but incurs a *factual* charge of arbitrariness regarding the *premises*.
