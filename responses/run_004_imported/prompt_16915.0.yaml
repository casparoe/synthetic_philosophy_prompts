answer: |-
  **MEMORANDUM**

  **TO:** Disability Services Advisory Committee
  **FROM:** Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Documentation Standards for ADHD and Autism Accommodations

  **Recommendation**
  I recommend that the Committee vote to replace the current requirement for a comprehensive neuropsychological evaluation with a **Functional Impact Model**. Under this standard, students would qualify for standard accommodations (extended time, note-taking, reduced-distraction environments) by submitting:
  1.  A self-identification statement; and
  2.  A Functional Impact Statement (FIS) describing specific academic barriers, signed by *any* licensed provider (including primary care physicians) or, in cases of financial hardship, a university academic advisor.

  Formal comprehensive evaluations should remain optional for students seeking exceptional accommodations or those who prefer to submit them, but they should not be the mandatory gate for entry.

  **Rationale: Equity and the Limits of Diagnostic Criteria**
  The current standard creates an inequitable "pay-to-play" system. With waitlists exceeding one year and costs ranging from $500 to $3,000, the requirement for comprehensive testing effectively denies accommodations to low-income students and those without local access to specialists.

  Furthermore, the diagnostic criteria currently used in these evaluations were largely normed on male children. Adult women, non-binary students, and students of color often present differently or have developed sophisticated masking behaviors that allow them to pass a clinical interview while still suffering significant functional impairment. By insisting on a specific type of medical verification, we are prioritizing a specific *history* of diagnosis over the current *reality* of disability. We are treating the diagnostic label as a static fact to be discovered, rather than a tool to facilitate access.

  **Addressing the Concern of Diagnostic Inflation**
  I want to address the strongest argument against this recommendation: the concern that lowering documentation standards invites diagnostic inflation driven by social media trends. Committee members have rightly noted that psychiatric categories are not like geological categories; a rock does not change because we label it "granite," but a student *does* change when they label themselves "ADHD."

  There is a valid fear that if we make self-identification sufficient, we risk creating a feedback loop where students adopt labels based on trending social media content rather than lived experience. This could lead to a scenario where accommodations are viewed as an academic advantage rather than a civil right, potentially stigmatizing students with severe impairments and diluting the resources available for those in crisis. If the boundary of the "kind" becomes too porous, the classification loses its utility, and the accommodation process becomes vulnerable to performative behavior.

  **Why the Functional Impact Model Mitigates This Risk**
  However, treating the diagnosis as a fixed, objective truth (an "indifferent kind") is a philosophical error that leads to policy failure. Psychiatric classifications are "interactive kinds": the label interacts with the person's self-understanding. The question is not *if* this loop will occur, but *how* we structure it.

  The current policy creates a negative looping effect: students who cannot afford diagnosis are denied support, leading to academic failure, which reinforces the belief that they are "lazy" or "incapable," worsening their mental health.

  The proposed Functional Impact Model manages the risk of social contagion without resorting to exclusionary gatekeeping. By requiring a **Functional Impact Statement**, we shift the focus from *who the student is* (identity) to *what the student experiences* (barriers).
  *   **The Check:** A student may identify with a label they saw on TikTok, but to receive accommodations, they must articulate specific, concrete barriers (e.g., "I cannot complete exams within standard time due to task paralysis," not just "I have ADHD").
  *   **The Loop:** This encourages a positive looping effect. Students are invited to understand their challenges in terms of functional needs and environmental barriers, rather than just consuming a medical identity.

  **Conclusion**
  We cannot prevent students from encountering psychiatric concepts online, nor should we try to police their self-understanding. Our mandate is to ensure equitable access to education. By moving to a Functional Impact Model, we acknowledge that while labels are interactive and socially influenced, the barriers they address are real. We verify the *need*, not just the *name*.

  I request we vote to adopt this standard for the upcoming academic year.
