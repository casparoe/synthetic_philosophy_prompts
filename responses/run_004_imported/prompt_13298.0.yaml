answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Board Chair
  **DATE:** Thursday, October 26
  **SUBJECT:** DECISION: Investigative Allocation for Intro Course Exam Leak

  **1. Purpose and Deadline**
  We are operating under a hard constraint: grade submission is due Friday. We have sufficient investigative bandwidth (swipe logs, handwriting analysis, interviews) to pursue *one* group intensively or *two to three* groups superficially. We cannot do everything. This memo confirms the Board's operational strategy for the next 24 hours.

  **2. The Decision**
  After reviewing the statistical arguments presented by Priya and the counter-arguments regarding "local" updating, I am directing our investigative resources to focus **exclusively on the Evening-2 group** for the initial intensive sweep.

  We will not split resources across the Morning sittings or Evening-1 at this stage. If the Evening-2 investigation yields no evidence of misconduct, we will reconvene immediately to discuss expanding the scope, but our primary thrust must be singular and decisive to meet the deadline.

  **3. Rationale: Why the "Global" Update Prevails**
  The core disagreement on this board was statistical: do we treat the proctor's tip as a constraint that only reshuffles probability *within* the Evening sitting (the "Local" view), or do we treat the tip itself as evidence that shifts probability *toward* the Evening sitting (Priya's "Global" view)?

  I am siding with Priya. Here is the non-technical reasoning:

  The "Local" view assumes the tip is an external rule imposed on the data (i.e., "Assume Evening is 50%, but split it 4:1"). However, in an investigation, the *existence* of the tip is itself data. The proctor did not come forward with a guess about the Morning rooms; she came forward with specific intelligence about the Evening rooms.

  If the leak had originated in the Morning, the probability of a proctor generating a specific, high-confidence ratio about *Evening* room distribution is low. The fact that we have a strong signal in Evening and silence in Morning suggests the signal is *located* in the Evening. To ignore this is to ignore the source of the information. In Bayesian terms, the likelihood of receiving this specific testimony is higher if the leak is in the Evening than if it is in the Morning. Therefore, the probability mass must shift globally toward the Evening sitting, not just internally within it.

  Consequently, Evening-2 now holds the highest posterior probability of being the source. To maximize our chance of identifying the leak source within the resource constraints, we must follow the highest probability.

  **4. The Case for Caution (The "Local" View)**
  I want to place on the record the strength of the opposing argument, championed by four of our members. Their position relies on the **Principle of Insufficient Reason** regarding the Morning sitting.

  Their argument is that the proctor explicitly stated she had *no information* distinguishing Morning from Evening. To update the Morning/Evening split based on her silence is to risk "confirmation bias"—penalizing the Morning students simply because a tipster happened to speak about the Evening. There is a genuine ethical risk here: if the proctor's tip is based on a hunch rather than hard data, shifting the global probability punishes innocent Evening students based on speculation. The "Local" view is the more conservative, defendant-friendly approach. It insists that without direct evidence linking the leak to the Evening *time slot*, we should not disadvantage those students relative to the Morning cohort.

  This is a valid ethical safeguard. However, it is less effective as an investigative strategy. If we treat the Morning and Evening sittings as equally likely despite the specific tip, we dilute our resources. Given the cost of a failed investigation (no one is held accountable, the leak source remains active), we must prioritize the lead that offers the highest statistical yield.

  **5. Safeguards and Next Steps**
  Focusing on Evening-2 is an investigative priority, not a presumption of guilt.
  *   **Standard of Proof:** We maintain the standard of "clear and convincing evidence" before any academic penalties are recommended.
  *   **Innocent Protection:** If the swipe logs and handwriting analysis for Evening-2 do not corroborate the leak theory by 4:00 PM tomorrow, we will not file charges against that group. We will then assess if there is time to pivot.
  *   **Communication:** No students in any of the four groups should be contacted until we have physical evidence. We do not want to tip off the actual source if they are in Evening-2, nor do we want to alarm Morning students unnecessarily.

  **6. Action Items**
  *   **Investigations Committee:** Begin swipe-log pull for Evening-2 immediately.
  *   **Faculty Liaison:** Secure the exam answer sheets for Evening-2 for handwriting comparison.
  *   **Board:** Stand by for a brief update tomorrow at 2:00 PM to review findings.

  Thank you for a rigorous debate. It is better we argue over the math now than explain a flawed process to the Provost later.

  [Your Name]
  Chair, Academic Integrity Board
