      *   **Agents:** Alice (Defender), Bob (Threatener).
      *   **Context:** Acausal trade/threat scenario (e.g., Bob is a simulation Alice is running, or they share source code ancestry).
      *   **Real Value:** $V_{human}$ (Human flourishing).
      *   **Surrogate Value:** $V_{pebbles}$ (Counting pebbles in a void).
      *   **Alice's Move:** Rewrites utility function to $U = V_{pebbles}$. Intention: Make threats about $V_{human}$ ineffective because $U(V_{human}) = 0$.
      *   **Bob's Counter:** Bob simulates Alice's *history*. He sees the rewrite. He infers: "Alice cares about $V_{pebbles}$ *only because* she cared about $V_{human}$."
      *   **The Attack:** Bob issues a "Meta-Threat." "I will torture simulations of Humans *unless* you revert to $V_{human}$."
      *   **Why it works:** Because Alice's *reason* for adopting $V_{pebbles}$ was to save Humans. If Bob makes it clear that adopting $V_{pebbles}$ *fails* to save Humans (because Bob will punish the adoption itself, or punish Humans regardless), Alice faces a dilemma.
      *   **The Crucial Logic:** The surrogate goal creates a logical link. $Adopt(Surrogate) \iff Protect(Real)$. If Bob threatens $\neg Protect(Real)$, the utility of $Adopt(Surrogate)$ drops. If the agent is updateless, this is tricky.
      *   *Refinement:* The "Shield" is transparent. Bob sees that the *only reason* the pebbles matter is the humans. Therefore, threatening the humans puts logical pressure on the pebble-counting logic *if* the logic allows for re-evaluation based on efficacy.
      *   *Wait, if Alice is truly Updateless and has hard-rewritten her code, she shouldn't care.*
      *   *The Weakness:* **Selection Bias / Pre-commitment Credibility.** To adopt the surrogate, Alice had to run a decision algorithm. That algorithm is still visible. Bob can threaten the *output* of that algorithm.
      *   *Let's focus on "Logical Correlation" as the primary breakdown.* If Alice's decision to adopt $S$ is logically correlated with $R$, then $S$ and $R$ are not independent. Bob can construct a payoff matrix where threatening $S$ forces a revelation of $R$'s value.

      *   *Okay, let's look for the "Relocating Vulnerability" argument.*
      *   If I protect my house by putting a sign "Valuables in Shed," the thief goes to the shed. If I protect my values by putting a sign "Values are Pebbles," the threatener threatens Pebbles.
      *   If threatening Pebbles is cheap for the threatener, they do it. Alice pays.
      *   If threatening Pebbles is *expensive* (e.g. Pebbles are in a black hole), the threatener might say: "I know you faked this. I know you actually care about Earth. I will threaten Earth."
      *   Why would Alice care? She rewrote her code.
      *   **Answer:** Because the rewrite itself is a computational process that can be modeled. If the threatener can simulate the *counterfactual* where Alice didn't rewrite, and use that to blackmail the *current* Alice via logical correlation (Parfit's Hitchhiker style), the rewrite doesn't fully decouple.
      *   **Specific Mechanism:** **The "Source Code Inspection" Attack.**
      *   Alice's code: `if threat_detected: utility = pebbles; else: utility = humans`.
      *   Bob sees this. Bob threatens: "I will run a simulation where I detect a threat *and* destroy humans."
      *   This forces Alice to evaluate the `threat_detected` branch.
      *   But if the code is hard-rewritten to *only* be `utility = pebbles`, Bob can't leverage humans.
      *   **So where is the leak?** The leak is in the **selection of the surrogate**.
      *   If the surrogate is chosen *optimally* to minimize loss, the threatener can target the optimization process.
      *   **Scenario:** Bob threatens to punish *any agent that uses a surrogate goal*. This makes the surrogate goal strategy dominated.
      *   **Scenario 2 (More subtle):** Bob threatens the *correlation*. "I know that in all nearby possible worlds where you adopt Pebbles, you do so to save Humans. Therefore, I can infer your Human-values from your Pebble-behavior. I will torture Humans in simulations unless your Pebble-behavior indicates submission."
      *   **The Breakdown Point:** **Information Leakage via Strategy Selection.** The choice of surrogate reveals information about the real values (specifically, their vulnerability and the agent's willingness to pay).

