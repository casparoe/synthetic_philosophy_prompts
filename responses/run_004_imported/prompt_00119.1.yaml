      *   *Bob's Strategy:* Analyze Alice's source code. Determine *why* Alice adopted $V_{surr}$.

      *   *The Breakdown:* Bob realizes that Alice's adoption of $V_{surr}$ is *conditional* on it being a good defense. If Bob threatens the *link* between the surrogate and the real values, or if Bob threatens $V_{surr}$ in a way that implies $V_{real}$ is still at risk, the shield fails.
      *   *Better Breakdown (Logical Correlation):* Bob reasons: "Alice only adopted $V_{surr}$ to save $V_{real}$. Therefore, if I threaten $V_{surr}$ effectively, Alice will experience 'regret' or 'logical pressure' to revert to $V_{real}$ to negotiate, OR I can simply threaten the *process* that selected $V_{surr}$."
      *   *Best Breakdown (The "Shadow" of the Real Values):* The surrogate goal isn't independent. It was chosen *because* it protects the real values. A sophisticated threatener models the *selection process* of the surrogate. If the threatener can make the cost of defending the surrogate higher than the cost of sacrificing the real values, the surrogate collapses.
      *   *Refined Breakdown (Acausal Blackmail on the Pre-commitment):* Bob threatens: "If you adopt this surrogate goal, I will destroy the universe." Wait, that's too simple.
