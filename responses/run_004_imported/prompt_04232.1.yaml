answer: |-
  To feel the pull of your friend's argument, you have to temporarily set aside the romantic intuition that "nature is sacred" and "existence is a gift." Instead, you have to adopt a specific ethical framework called **Negative Utilitarianism**, combined with a philosophical concept known as the **Asymmetry Argument**.

  If you commit fully to these premises, your friend's conclusion isn't just logical; it becomes a moral imperative. Here is the strongest version of that case.

  ### 1. The Primacy of Suffering
  The first step is to accept that the reduction of suffering is the single most important moral goal, outweighing the creation of pleasure or the preservation of "naturalness."

  In this view, pain is not just a negative; it is an *urgent* negative. A moment of agony demands attention in a way that a moment of contentment does not. If you walk past a child crying in pain, you have a duty to help. If you walk past a child smiling, you have no duty to make them smile *more*.

  Now, apply this to wild animals. We tend to imagine nature as a balance, but if you look at the data on **r-selection**, the balance is shattered. r-strategists (insects, fish, amphibians, rodents) make up the vast majority of sentient life. They operate on a strategy of "overproduce and abandon." A single female fish might lay 10,000 eggs. Statistically, only two of those offspring will survive to adulthood to replace the parents.

  That means 9,998 individuals will die. And they don't die peacefully. They are eaten alive, they starve, they freeze, they are consumed by parasitoid wasps that liquefy their insides while they are still conscious.

  From a Negative Utilitarian perspective, nature is not a harmonious ecosystem; it is a **suffering factory**. It is a machine that converts biomass into agony on a scale that dwarfs human suffering by orders of magnitude. If your moral priority is to stop suffering, nature is the biggest crime scene in the universe.

  ### 2. The Asymmetry of Existence
  This is the philosophical core that makes your friend's view coherent. It addresses your hesitation about "preventing them from existing."

  The argument relies on the **Asymmetry**, popularized by philosopher David Benatar. It goes like this:
  *   **Presence of Pain:** Bad.
  *   **Presence of Pleasure:** Good.
  *   **Absence of Pain:** Good (even if no one is there to enjoy that relief).
  *   **Absence of Pleasure:** Not Bad (if no one exists to be deprived of it).

  Think about it: You don't feel sad for the trillions of potential children you *didn't* have. They aren't suffering in a void somewhere; their non-existence is neutral. But, if you *do* have a child, and that child suffers, that is a real moral negative.

  Apply this to the wild.
  *   **Scenario A (Conservation):** We preserve the habitat. Millions of animals are born. Most suffer intensely and die young. A few experience the pleasure of survival. **Net Result:** Massive suffering + some pleasure.
  *   **Scenario B (Destruction/Prevention):** The habitat is gone. Those millions of animals are never conceived. They feel no pain. They also feel no pleasure. **Net Result:** Zero suffering + Zero pleasure.

  If the absence of pain is *good*, and the absence of pleasure is *not bad* (because there is no subject to be deprived), then Scenario B is morally superior. You haven't "harmed" the animals by not creating them, because there is no "them" to harm. But you *have* successfully prevented the certainty of their agony.

  ### 3. Reframing "Destruction" as "Closure"
  This is the hardest part to swallow, but it follows from the math above. We view habitat destruction as "killing," but from this perspective, it is more accurately viewed as **shutting down the production line.**

  When humans destroy a habitat, yes, there is immediate suffering for the animals currently alive. Your friend's argument usually accounts for this as a "one-time cost." But the *long-term* effect is the prevention of future generations.

  If you view a forest not as a sanctuary, but as a breeding ground where 90% of all beings born will be tortured and killed within weeks, then preserving that forest is an act of **perpetuating the cycle.** Conservation, in this light, becomes a commitment to ensure that the suffering factory stays open for another century.

  Every acre of rainforest preserved is an assurance that billions more sentient beings will come into existence solely to suffer and die. Every acre paved over is a guarantee that those billions will never exist, and therefore, will never suffer.

  ### 4. The Illusion of the "Good Life"
  The final piece of the pull is challenging the assumption that wild animals have lives worth living. We project human concepts of "freedom" and "wildness" onto them. We think a bird in the sky is "free."

  But biologically, that bird is in a constant state of high-cortisol stress, scanning for predators, fighting for calories, and battling parasites. Their "joy" is merely the temporary relief of hunger or fear. It is not a positive state; it is a return to baseline.

  If the baseline of wild existence is stress and the ceiling is temporary relief, then the average life is net negative. If you accept that the average life is net negative, then bringing a new animal into that existence is effectively gambling with their welfare and losing.

  ### The Emotional Weight of the Argument
  To feel the pull, you have to sit with this image:

  Imagine you have a switch.
  *   **Switch Off:** A factory remains open. It produces 10,000 units. 9,000 of them are immediately put into a grinder. 1,000 survive for a bit before being ground up later.
  *   **Switch On:** The factory is closed. Nothing is produced. Nothing is ground up.

  If you are told the factory is "Nature" and the units are "Sentient Beings," your intuition screams that closing the factory is wrong because "Nature is good."

  But if you are told the factory is "A Suffering Generator" and the units are "Victims," your intuition should scream that keeping it open is wrong.

  Your friend is asking you to look at the r-strategists—the insects, the fish, the rodents—and see them not as "wildlife" to be admired, but as **victims of a blind evolutionary process** that values genetic propagation over individual welfare.

  From this vantage point, the most compassionate thing you can do for a potential wild animal is to ensure it is never born. If human expansion inadvertently achieves that, then logically, within this specific ethical framework, it is an accidental mercy. It is the universe finally catching a break from the cruelty of natural selection.

  ### Why It Feels Insane (But Might Be Consistent)
  The reason this feels insane to you is that you are likely operating on a "Pro-Natalist" intuition: that existence is inherently valuable, that life is a gift, and that death is a tragedy.

  Your friend is operating on a "Suffering-First" intuition: that non-existence is safe, that life is a gamble, and that suffering is the only true tragedy.

  Neither of you is necessarily "wrong" about the facts of nature. You are disagreeing on the fundamental value of existence itself. If you truly believe that suffering is the ultimate evil, and that non-existence entails no harm, then her conclusion is not just logical—it is the only moral one. The horror you feel isn't a logical error; it's the collision between your instinct to preserve life and her logic to preserve *welfare*. And in a world dominated by r-selection, those two goals are mutually exclusive.
