          *   *Fact Check:* This is essentially correct. Jeffrey's condition of ratifiability (from "The Logic of Decision") involves conditioning on the decision itself. If $U(A | A) > U(B | A)$, then A is ratifiable. The student's phrasing "update your credences on the supposition that you've settled on doing it" captures the conditionalization on the act.
