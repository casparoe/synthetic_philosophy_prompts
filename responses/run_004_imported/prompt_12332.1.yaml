answer: |-
  Good morning. Thank you all for being here.

  For forty years, my father worked as an actuary. If you knew him professionally, you know what that meant. It meant he spent his life calculating risk. He looked at the chaos of human events—accidents, illnesses, market crashes—and he asked, "What are the odds?" He was a man who trusted numbers because numbers didn't lie, and they didn't offer false comfort.

  He was also a lifelong agnostic. He had no patience for talk of heaven. If you tried to tell him that "God needed another angel," he would have looked at you over his glasses and said, "Don't be ridiculous." He valued truth over comfort. Always.

  And yet, those of you who were close to him in his last decade know that something shifted. The man who spent a lifetime assuming the grave was the final period at the end of the sentence began to suspect it might be a semicolon.

  I want to talk about that change, because it wasn't a softening. It wasn't that he got old and scared and reached for a blanket of religious comfort. In fact, it was the opposite. It was a hardening of his resolve to follow a logical thread wherever it led, even if it led somewhere unexpected.

  I've been spending time with the books on his nightstand. It started, as best I can tell, with a biography of Kurt Gödel he picked up on a whim. And it ended with a dense, difficult text by Hao Wang, left open on his desk when he died. The pages were underlined. The margins were filled with his handwriting.

  For the niece in the back with the philosophy minor, and for his colleagues who know the weight of those names: I know what this looks like. It looks like the popular claim that Gödel's Incompleteness Theorems prove the existence of God or the soul. But my father was scrupulous about this. In his margins, next to a magazine clipping making exactly that claim, he wrote in capital letters: "NOT THIS."

  He knew that mathematics cannot prove metaphysics. He wasn't looking for a proof. He was looking for coherence.

  From his notes, I've pieced together the shape of his thinking. It centered on an argument Gödel made in private letters, a line of reasoning that my father found impossible to dismiss. It went something like this:

  We have to ask if the world is fundamentally rational. If the world *is* rational, then it must be meaningful. But if we look at the span of a single human life, it is often not meaningful. Good people suffer without cause. Efforts are cut short. Justice is rarely balanced. If the universe is rational, this life cannot be the whole story, because the equation doesn't balance. There must be more time, more space, for the meaning to resolve.

  But, he reasoned, what if the world is *not* rational? What if it is chaotic and absurd? Then we cannot claim with certainty that death is the end, because our rational tools are too limited to make that claim.

  So, either way—whether the world makes sense or whether it doesn't—the door remains open. The certainty of "nothingness" is the one thing that doesn't fit the data.

  For an actuary, this wasn't about faith. It was about risk assessment. He spent forty years telling us that we cannot know the future with certainty, only in probabilities. In his final years, he reassessed the probability of his own continuation. He didn't find a guarantee. But he found that the odds were no longer zero.

  To his neighbors and grandchildren who might find this abstract: What I want you to take from this is not the math, but the integrity. My father did not believe in the afterlife because it made him feel better. He believed it might be true because he couldn't find a logical reason to rule it out. He refused to accept a universe where the human mind—which can conceive of infinity, which can understand truth beyond calculation—is simply a biological machine that turns off.

  He taught me that being open-minded doesn't mean believing everything. It means refusing to believe the easy lies. The easy lie is that there is definitely a heaven with pearly gates. He didn't believe that. But the other easy lie is that there is definitely nothing. He couldn't believe that either.

  He died with his mind working, still questioning, still reading, still underlining. He didn't find a religious conversion. He found a quiet conviction that the story is larger than the page we are currently reading.

  I am not a mathematician. I cannot stand here and validate his reasoning for the experts in the room. But I am his child. I know how he thought. I know he would not have wanted me to tell you that he "went to a better place." He would want me to tell you that he left this place with his eyes open.

  He taught us to look at the world clearly, without flinching. To calculate the risks, to acknowledge the unknowns, and to never settle for an answer just because it brings comfort.

  So, I will not say he is in heaven. I will say this: If the world is rational, then his search for truth has found its object. And if the world is not rational, then perhaps he is free from the need to solve it.

  Either way, the equation is balanced. And we are left with the remainder of our love for him, which, like the questions he asked, does not end here.

  Thank you.
