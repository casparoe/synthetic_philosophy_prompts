      *   *Best Defense of KK:* **Internalism.** If justification is purely internal, and internal states are luminous, then KK follows. The attack on MfE is that it imports externalist safety conditions into what should be an internalist relation.
      *   *Specific Defense:* **The "No False Lemmas" or "Proper Function" approach.** Maybe knowledge doesn't require the strong safety condition Williamson imposes.
