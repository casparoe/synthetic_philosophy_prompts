      *   *User's Question:* Williamson accepts epistemicism about vagueness (sharp but unknowable boundaries for 'heap'). Why not say 'feeling cold' has a sharp boundary, and I just don't know where it is, but when I *am* cold, I know it?
      *   *The Crucial Distinction:* Williamson distinguishes between *vagueness in the world/language* and *luminosity of mental states*.
      *   *The Argument:* The MfE principle isn't just about the predicate 'feeling cold'. It's about the *knowledge relation* itself. Knowledge requires safety. Safety requires that in nearby possible worlds (or indiscriminable cases), you don't believe falsely.
