answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of a major tension in constitutional theory. You have correctly identified that while Douglass and modern originalists both claim to be returning to the "true" Constitution, their structural mechanisms for doing so are nearly inverted.

  To answer your question directly: **Douglass would almost certainly view modern "history and tradition" jurisprudence not as a ally, but as a resurrection of the very pro-slavery constitutionalism he spent his post-1851 career dismantling.**

  Here is an analysis of the structural reasoning behind that conclusion, which you can adapt for your paper.

  ### 1. The Structure of Douglass's Argument: Text as a Moral Wedge
  In the Glasgow speech (1860) and his earlier "Change of Opinion" (1851), Douglass constructs a hierarchy of interpretive authority.
  *   **Tier 1 (Supreme):** The plain text of the Constitution, read in light of the natural rights principles of the Declaration of Independence.
  *   **Tier 2 (Irrelevant/Corrupt):** The private intentions of the framers, the historical compromises made during ratification, and the subsequent judicial enforcement (like *Dred Scott* or the Fugitive Slave Acts).

  Douglass's textualism was not "neutral" in the way Justice Scalia claimed his was. It was **moral textualism**. He argued that because the words "slave" and "slavery" are absent, the text creates a "vacuum" that must be filled by the default principle of American law: liberty.

  Crucially, Douglass argued that **practice cannot constitutionalize injustice.** Just because the government *had* enforced fugitive slave renditions for 60 years did not make those renditions constitutional. He explicitly separated the "Constitution of the United States" (the text) from the "Government of the United States" (the historical entity run by slaveholders). To Douglass, allowing historical practice to define the text was to allow the "criminal" (the slaveholding state) to write the law defining his own crime.

  ### 2. The Structure of *Bruen* and *Dobbs*: History as a Moral Cap
  The "history and tradition" test employed in *New York State Rifle & Pistol Association v. Bruen* (2022) and *Dobbs v. Jackson* (2022) operates on a structurally opposite premise.
  *   **The Premise:** The scope of a constitutional right is limited by the historical understanding of that right at the time of ratification (or deeply rooted in tradition).
  *   **The Mechanism:** If a specific regulation existed in 1791 (or 1868), the text allows it. If a right was not historically recognized (like abortion in *Dobbs*), the text does not protect it.

  In this framework, **history defines the text.** If the founding generation tolerated a restriction, the modern text tolerates it. This relies on historical *practice* and *statutes* to determine meaning.

  ### 3. The Inversion: Why Douglass Would Reject the Modern Test
  Your debate partner is right that there is a parallel in the *focus* on the founding era, but the *direction* of the argument is reversed.

  **A. The *Dred Scott* Parallel**
  Douglass would likely see *Dobbs* and *Bruen* as structurally identical to Chief Justice Roger Taney's opinion in *Dred Scott v. Sandford* (1857).
  *   **Taney's Logic:** Taney looked at history and tradition. He noted that at the time of the founding, Black people were "regarded as beings of an inferior order" and had no rights white men were bound to respect. Therefore, the Constitution could not be read to include them. Taney used historical *exclusion* to limit textual *inclusion* ("We the People").
  *   **Douglass's Rebuttal:** Douglass argued that Taney's reliance on historical status was irrelevant. The text says "People," not "White People." To let historical racism define the word "People" was to let the sin of the past veto the promise of the text.
  *   **Modern Application:** In *Dobbs*, the Court looked at historical statutes banning abortion to determine that the 14th Amendment does not protect the right to choose. Douglass would argue this is the same error: letting the restrictive practices of the past (when women had fewer rights) define the liberty guarantees of the text.

  **B. Practice vs. Principle**
  Douglass insisted that the "secret intentions" of the framers regarding slavery were irrelevant because they were not codified in the text. He argued that we must judge the Constitution by what it *says*, not by what the framers *did*.
  *   **Modern Originalism:** Often asks, "What did the framers *allow*?" (e.g., Did they allow gun regulations? Did they allow abortion bans?).
  *   **Douglass:** Would ask, "What does the text *require*?" (e.g., Does "liberty" require freedom from bondage?).

  If Douglass accepted the *Bruen* test, he would have to concede that because the founding generation practiced slavery, the Constitution *allowed* slavery. But his entire post-1851 argument was that the Constitution *forbade* slavery, regardless of the fact that the founding generation practiced it. He would view the "history and tradition" test as a mechanism to codify the prejudices of the past into the law of the present.

  ### 4. Is There Any Compatibility?
  Is there a way to read Douglass as supportive of a history-based test? Only if you radically redefine what "history and tradition" means.

  Douglass did appeal to the "founding fathers," but he appealed to their **rhetoric**, not their **statutes**. He cited the Declaration of Independence and the Preamble ("secure the Blessings of Liberty"). He argued that the *tradition* of America was the *aspiration* of liberty, even if the *practice* was slavery.

  *   **Compatible Version:** If a "history and tradition" test looked for "principles deeply rooted in the nation's conscience" (like the principle of equality), Douglass might support it.
  *   **Incompatible Version:** The actual *Bruen/Dobbs* test looks for "historical analogues of regulation." This looks at the *restrictions* of the past.

  Since Douglass argued that the restrictions of the past (slave codes, fugitive laws) were unconstitutional *despite* their historical pedigree, he would find the modern test incompatible with his reasoning. He believed the Constitution was a **glorious liberty document** that grew with the moral progress of the people, not a fossilized artifact constrained by the moral limitations of 1791.

  ### 5. Thesis Suggestion for Your Paper
  If you are incorporating this into your research paper, you might frame it this way:

  > "While Frederick Douglass's post-1851 constitutionalism shares modern originalism's focus on the founding era, it operates as a structural inversion of contemporary 'history and tradition' jurisprudence. Where cases like *Bruen* and *Dobbs* use historical practice to limit the scope of textual rights, Douglass used textual principles to purge historical injustices. For Douglass, the absence of the word 'slavery' in the Constitution was not a historical accident to be explained away by framing-era compromises, but a moral mandate that rendered those compromises null. Consequently, Douglass would likely view the reliance on founding-era practices to define modern liberty not as a return to original meaning, but as a revival of the *Dred Scott* methodology—privileging the 'dead hand' of a discriminatory past over the 'living text' of universal rights."

  ### Summary for Your Debate
  *   **Douglass:** Text > History. (The text promises liberty; history failed to deliver it. Fix history to match the text.)
  *   **Modern Test:** History = Text. (The text only promises what history allowed.)
  *   **Verdict:** Douglass would see the modern test as a tool to protect established power structures (like slavery then, or restrictive statutes now) against the moral imperatives of the text.

  This distinction allows you to show deep engagement with constitutional theory without getting bogged down in modern political policy debates. It keeps the focus on the *method of interpretation*, which is the core of your research.
