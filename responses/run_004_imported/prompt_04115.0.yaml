      *   *Key Insight:* Douglass's textualism was *moral*. Modern textualism/originalism claims to be *neutral*. Douglass would argue neutrality in the face of injustice is complicity.
      *   *Specific Case Connection:* In *Dred Scott*, Taney used history/tradition to say Black people weren't citizens. Douglass argued the text ("We the People") includes everyone. *Dobbs* uses history/tradition to say abortion isn't a right. The structural parallel to *Dred Scott* is the strongest point to make.

  8.  **Final Polish:** Ensure the tone is appropriate for an AP Gov research paper helper (academic, encouraging, rigorous). (Self-correction: Make sure not to give a definitive "Yes/No" but rather a nuanced "He would likely argue X because of Y structure.")

  9.  **Final Output Structure:**
