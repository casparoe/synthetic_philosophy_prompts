      *   Analyze *Bruen/Dobbs* logic (History = Textual Scope).
      *   The Core Conflict: Moral Textualism vs. Historical Positivism.
      *   The *Dred Scott* Parallel (Crucial for Douglass).
      *   Conclusion on Compatibility.

