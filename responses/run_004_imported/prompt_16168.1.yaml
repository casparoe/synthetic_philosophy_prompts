answer: |-
  **Setting:** *The lobby of the philosophy department, shortly after a colloquium on "Persistence in Minkowski Spacetime." The room is emptying out. ELENA (Endurantist) and MARK (Perdurantist) are standing by the coffee urn.*

  **Mark:** That was a solid talk, though I thought the speaker pulled their punches on the SR argument. It really is the elephant in the room for your side, Elena. If Sider is right, Special Relativity doesn't just complicate endurantism; it starves it of the oxygen it needs to breathe. You can't be "wholly present" at a time if there's no objective fact about what constitutes "a time" for your scattered parts.

  **Elena:** I expected you to lead with that, Mark. But the Sider argument assumes a premise that I think is far too hasty. It assumes that for an object to endure, it must be wholly present relative to an *absolute* simultaneity slice. But why think that? The endurantist can simply relativize the "wholly present" relation to a reference frame. I exist wholly relative to Frame A's hypersurface of simultaneity, and I exist wholly relative to Frame B's different hypersurface. There's no contradiction there, just as there's no contradiction in saying I am moving at 5 mph relative to the train but 0 mph relative to the seat.

  **Mark:** That's the standard move, I know. Relativistic Endurantism. But the problem isn't just about motion; it's about ontology. If you say you are wholly present at $t_1$ in Frame A and wholly present at $t_2$ in Frame B, and $t_1$ and $t_2$ slice through your spacetime path differently, you aren't describing one 3D object persisting. You're describing a 4D worm that different observers are slicing up differently. By relativizing existence to a hypersurface, you've effectively admitted that your "location" is a relation between an object and a spacetime slice. But if your fundamental location is a slice of spacetime, you've basically conceded that you are a spacetime entity with parts distributed across those slices. You've just dressed perdurantism in 3D clothing.

  **Elena:** That's a conflation of *location* with *parthood*. Just because my location is defined relative to a hypersurface doesn't mean I have parts corresponding to the intersections of that surface. Look, when I say I am wholly present at a frame-relative time, I mean that *I*, the entire substance, stands in the location relation to that region. I don't have a "temporal part" at that region. The perdurantist says I am a sum of temporal slices. I say I am a single entity that occupies multiple slices, but occupies each of them *fully*. The geometry of Minkowski space might force me to say *where* I am is frame-relative, but it doesn't force me to say *what* I am is a mereological sum of stages. I can keep the 3D ontology; I just have to accept that "co-existence" is a three-place relation: Object A, Object B, and Reference Frame.

  **Mark:** But at what cost? You're introducing a metaphysically heavy notion of "existence-relative-to-a-frame" to save a pre-theoretic intuition. In my view, the 4D worm is the invariant object. It exists simpliciter. It doesn't need a frame to tell it whether it exists. When you say, "Elena exists at $t$ in Frame F," you're making existence contingent on a coordinate system. That seems to rob persistence of its reality. If two observers disagree on whether your head and your feet exist simultaneously, and you say "both are right relative to their frames," you're saying there is no fact of the matter about whether *you*—as a unified whole—exist. For the perdurantist, the head and feet are just different parts of the worm. They don't need to "exist simultaneously" to be parts of the same object; they just need to be parts of the same spacetime whole. Your view requires a fragmented reality to maintain the "wholeness" of the object.

  **Elena:** I wouldn't call it fragmented; I'd call it relational. And I think you're underestimating the cost on your side. You say the worm exists simpliciter. But the "worm" is just a sum of temporal parts. Why is *that sum* the object? What unifies the temporal parts into *me*? Usually, you perdurantists appeal to causal connections or qualitative similarity. But if you do that, you're admitting that the *persistence*—the thing that matters for identity over time—isn't the mereological sum itself, but the relation between the stages. So why posit the sum at all?
  Furthermore, regarding SR: You claim the worm is invariant. But which worm? There are infinite ways to carve up spacetime regions into "objects." If I say I am a 3D object that is multiply located across different hypersurfaces, I preserve the intuition that *I* am the thing that thinks and acts. If you say I am a 4D worm, then "I" am extended in time. Does the whole worm think? Or does only the instantaneous stage think? If only the stage thinks, then *I* never persist; only my momentary counterparts do. That seems like a much higher price to pay for compatibility with SR than accepting frame-relative existence.

  **Mark:** That's the old "too many thinkers" or "thinking parts" objection, but it doesn't land here. We can say the person is the maximal sum of person-stages. The whole worm doesn't think *at once*; thinking is a process that occurs over the temporal extension, just as walking occurs over spatial extension.
  But let's go back to your relational view. You say you preserve the intuition that *you* are the thing that acts. But in SR, action is local. Causal influences propagate along light cones. If you are wholly present at a frame-relative slice, you are claiming that parts of you that are spacelike separated constitute a unified agent *at that slice*. But since simultaneity is relative, which parts constitute the "agent" changes depending on the observer. One observer sees your hand moving before your brain decides; another sees the decision first. If you are wholly present at the slice where the hand moves before the decision, are you an agent acting on your body, or just a collection of events? The perdurantist handles this easily: the decision-stage causes the movement-stage. Causation is internal to the worm. For the endurantist, if the "whole you" exists at a slice that scrambles the causal order, your agency becomes frame-dependent. Do you really want to say that whether you are a unified agent depends on how fast I'm driving past you?

  **Elena:** I want to say that agency, like existence, is frame-relative in a relativistic universe. That's a bullet I'm willing to bite if it means preserving the reality of persistence. But I think you're painting a false dichotomy. You assume that because the *slices* are relative, the *object* must be 4D. But consider this: Maybe the metaphysics of persistence shouldn't be held hostage by a specific interpretation of the ontology of SR.
  There are interpretations of SR—like the Lorentzian interpretation—that allow for a preferred frame, even if empirically inaccessible. If that's metaphysically possible, endurantism is safe. But even granting the Einsteinian view, why think metaphysics must mirror the geometry of spacetime so directly? Spacetime is the arena. Objects are the actors. Just because the arena doesn't have a privileged "now" doesn't mean the actors can't endure. It might just mean that "enduring" is a more complex relation to the arena than we thought. You're privileging the geometry over the phenomenology of persistence. I'm privileging the phenomenology and adjusting the geometry's metaphysical import. Neither is obviously wrong; they're just different starting points.

  **Mark:** And that's where we stall, isn't it? You're willing to make existence and agency frame-relative to save the 3D object. I'm willing to say the 3D object is a derivative construct to save the invariance of existence and the naturalness of causal order in spacetime.
  My worry is that your "complex relation" looks suspiciously like my "temporal parts." If you occupy every slice fully, and there are infinite slices, you are infinitely located. If you are infinitely located, and your properties vary across those locations (I'm sitting now, standing later), then you have the property of sitting at location $L_1$ and standing at location $L_2$. That is structurally isomorphic to having a sitting-part and a standing-part. You've renamed "temporal part" to "location at a hypersurface," but the logical structure is identical. You haven't really saved endurantism; you've just translated perdurantism into a different dialect.

  **Elena:** Structural isomorphism isn't ontological identity. The map is not the territory. I can describe a sphere as a stack of 2D circles, or as a single 3D object. The math might look similar, but the ontology is different. One is a sum of parts; the other is a whole at a place. I maintain that distinction matters for identity, moral responsibility, and what it feels like to be me. If you're right, I'm a spacetime snake. If I'm right, I'm a person moving through it. SR constrains us, Mark, but it doesn't dictate that we must be snakes.

  **Mark:** *(Laughs and picks up his coffee cup)* Fair enough. We might need a few more colloquiums—and maybe a better theory of quantum gravity—to settle whether we're snakes or swimmers. But I still think the snake fits the water better.

  **Elena:** And I think the swimmer makes the water worth being in. Shall we continue this over dinner?

  **Mark:** Definitely. But I'm picking the restaurant. I want to make sure we exist at the same time to eat.

  **Elena:** *(Smiling)* Relative to your frame, sure. Let's go.
