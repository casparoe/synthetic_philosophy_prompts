answer: |-
  **MEMORANDUM**

  **TO:** State Panel on Long-Term Capital Discounting
  **FROM:** [Your Name], Public Member
  **DATE:** October 24, 2024
  **SUBJECT:** Recommendation for a Dual-Component, Declining Discount Rate Framework

  ### I. Executive Summary

  This memo recommends the adoption of a **Dual-Component Declining Discount Rate (DC-DDR)** methodology for evaluating state capital projects with horizons exceeding 50 years. 

  Current practice relies on a flat 7% rate derived from the opportunity cost of private capital. As demonstrated by the River City Storm-Surge case, this approach renders intergenerational resilience projects economically invisible; at 7%, benefits accruing in 2150 possess negligible present value. Conversely, a rate near zero risks fiscal paralysis by equating present sacrifice with distant, uncertain gains without adjustment for future wealth.

  I propose we decouple the discount rate into its ethical and economic constituents: a **Pure Time Preference ($\delta$) of 0.5%** and a **Growth Adjustment ($\eta \times g$)** tied to projected per-capita consumption growth. These components will generate a sliding scale of effective discount rates, starting at 3.0% for near-term effects (0–30 years) and declining to 1.5% for long-term effects (100+ years). This framework requires a mandatory **five-year review cycle** to update growth projections.

  ### II. The Methodology

  We must move beyond the "blended rate" heuristic. The social discount rate ($r$) should be calculated using the Ramsey Rule formula:

  $$r = \delta + \eta \times g$$

  Where:
  *   **$\delta$ (Pure Time Preference):** The ethical weight assigned to future welfare solely based on its occurrence in time.
  *   **$\eta$ (Elasticity of Marginal Utility):** The rate at which the value of additional consumption declines as society becomes wealthier.
  *   **$g$ (Per-Capita Consumption Growth):** The projected annual growth in real consumption per person.

  #### A. Component 1: Pure Time Preference ($\delta$)
  **Recommendation: Set $\delta = 0.5\%$**

  *   **Justification:** A rate of 0% (as advocated by strict intergenerational equity) risks the "Tyranny of the Future," where infinitesimal probabilities of distant catastrophe justify crippling present-day investment. However, the Chief Economist's implicit $\delta$ (embedded in the 7% rate) is ethically untenable for century-scale projects; it effectively assigns zero moral standing to citizens born after 2100.
  *   **Rationale:** 0.5% acknowledges a minimal preference for the present to account for existential risk (the possibility that the state or society may not exist in 2150) without discriminating against future generations based merely on their birth date. It satisfies the Moral Philosopher's requirement for near-neutrality while providing the "circuit breaker" against infinite obligation.

  #### B. Component 2: Growth Adjustment ($\eta \times g$)
  **Recommendation: Set $\eta = 1.0$ and tie $g$ to State/CBO Projections**

  *   **Justification:** This addresses the Chief Economist's concern regarding opportunity cost. If future generations are wealthier than we are (positive $g$), the marginal utility of a dollar transferred to them is lower than a dollar retained today. We do not need a high time preference to limit spending; diminishing marginal utility does this work.
  *   **Rationale:** By setting $\eta$ at 1.0 (standard isoelastic utility), we ensure that if the economy grows at 2%, the discount rate adds 2% to reflect that future benefits are less critical to welfare than present ones. If growth stalls, the discount rate falls, automatically increasing the weight of future benefits. This aligns the rate with economic reality rather than financial market volatility.

  #### C. The Declining Schedule
  Uncertainty regarding $g$ over long horizons necessitates a declining rate. We cannot confidently project consumption growth 100 years out. Therefore, the effective rate $r$ shall follow a step-down schedule:

  | Time Horizon | Effective Discount Rate ($r$) | Rationale |
  | :--- | :--- | :--- |
  | **0 – 30 Years** | **3.0%** | Aligns with current risk-free social rate; captures near-term opportunity cost. |
  | **31 – 75 Years** | **2.5%** | Begins transition as uncertainty regarding growth increases. |
  | **76 – 150 Years** | **2.0%** | Reflects long-run bond yields and lower expected growth. |
  | **150+ Years** | **1.5%** | Floor rate ($\delta + \text{minimal } g$); ensures distant impacts remain computable. |

  *Note: Under the old 7% regime, $1 billion in flood avoidance in 2150 is worth ~$250,000 today. Under this framework, it is worth ~$85 million.*

  ### III. Addressing the Strongest Counter-Arguments

  #### A. The Risk of "Fiscal Paralysis" (Argument against low $\delta$)
  **Critique:** Setting $\delta$ near zero allows activists to justify massive present expenditures for speculative future gains (e.g., spending 10% of GDP today to prevent a 1% risk of discomfort in 2200).
  **Rebuttal:** This risk is mitigated by the **Growth Adjustment ($\eta \times g$)**. We are not discounting *lives*; we are discounting *consumption*. If we assume future citizens are richer, they require more compensation to achieve equivalent welfare gains. Furthermore, this framework does not remove **risk discounting**. Projects with high uncertainty regarding their physical efficacy (e.g., unproven technology) should face a risk premium separate from the time discount rate. We must not conflate "unlikely to work" with "happens later."

  #### B. The Risk of "Intergenerational Abandonment" (Argument against high $r$)
  **Critique:** Maintaining a 7% rate is a covert policy decision to abandon future citizens. It treats the state as a liquidation asset rather than a perpetual trust.
  **Rebuttal:** This is the stronger ethical risk. A flat 7% rate assumes that capital markets will remain efficient and relevant over centuries, an assumption history does not support. More critically, it assumes the state has no obligation to maintain habitability beyond the bond cycle. For infrastructure designed to last a century (like the River City barrier), the financing cost is irrelevant compared to the cost of failure. The discount rate must reflect the *duration of the asset*, not just the *duration of the bond*.

  ### IV. Implementation and Review Cycle

  To prevent this methodology from becoming static dogma, the following review protocol is attached to the recommendation:

  1.  **Review Frequency:** The Panel shall reconvene every **five years** (aligned with the state budget cycle) to review $g$ (consumption growth projections).
  2.  **Trigger for Recalculation:** If the Congressional Budget Office (CBO) or State Budget Office revises long-term growth projections by more than 0.5% (up or down), the Growth Adjustment component must be recalculated immediately.
  3.  **Grandfathering:** Projects already in the construction phase shall not be retroactively reassessed. Projects in the feasibility/design phase shall use the rate active at the time of Final Investment Decision.

  ### V. Motion for Vote

  I move that the Panel adopt the **Dual-Component Declining Discount Rate Framework** as described above, specifically:

  1.  Establishing a Pure Time Preference ($\delta$) of 0.5%.
  2.  Establishing a Growth Adjustment based on projected per-capita consumption growth ($\eta \times g$).
  3.  Adopting the Step-Down Schedule (3.0% to 1.5%) for projects with lifespans exceeding 50 years.
  4.  Mandating a five-year review cycle for the growth component.

  This approach honors the fiscal discipline requested by the Chief Economist while upholding the intergenerational equity demanded by the Moral Philosopher. It allows the River City barrier to be evaluated on its actual merit—survival—rather than on the arbitrariness of a financial metric designed for quarterly returns.

  **Recommended Action:** Vote to adopt as the standing methodology for all state capital projects with useful lives exceeding 50 years.
