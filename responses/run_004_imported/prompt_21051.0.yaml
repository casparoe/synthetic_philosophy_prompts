  Here are two options. The first plays on the classroom dynamic, while the second is a bit more conceptual. Both rely on the specific implication that **Dictatorship $\implies$ Strategy-Proofness** when $m \ge 3$.

  **Option 1: The "Class Policy" Angle**
  "I was originally going to let you vote on which topic to cover first: Arrow, Gibbard, or Satterthwaite. But then I remembered the theorem we're discussing today. With three alternatives and unrestricted preferences, the only strategy-proof social choice function is dictatorial. So, to protect you from the temptation to misrepresent your preferences... we're starting with Gibbard. You can call it authoritarianism, but in this classroom, we call it 'satisfying the non-manipulability condition.'"

  **Option 2: The "Possibility" Angle**
  "People often call Gibbard-Satterthwaite an 'impossibility' theorem. I think that's unfair. It's actually a very precise 'possibility' theorem. It tells us exactly how to build a voting system that is strategy-proof, works for three or more options, and has an unrestricted domain. You just have to make one person a dictator. The only reason we don't use this perfect system isn't mathematical; it's that the other $n-1$ voters tend to complain."

  **Why these work for your constraints:**
  *   **Technical Accuracy:** They both correctly identify that dictatorship is the *only* solution that satisfies strategy-proofness under the standard constraints ($m \ge 3$, unrestricted domain).
  *   **Audience Level:** They use terms like "strategy-proof," "unrestricted preferences," and "non-manipulability" correctly, signaling to the students that you respect the formal definitions, even while joking.
  *   **Tone:** They avoid the cynical "voting doesn't matter" trope and instead highlight the specific trade-off (Honesty vs. Non-dictatorship) that the proof will explore.
