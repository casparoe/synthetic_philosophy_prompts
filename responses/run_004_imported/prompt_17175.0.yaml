answer: |-
  **Setting:** *A cluttered faculty office, late afternoon. Chalk dust hangs in the air. CLARA (Precise Bayesian) sits behind the desk; ISAAC (Imprecise Credence Advocate) leans against the bookshelf, holding a whiteboard marker like a cigarette.*

  **Clara:** Let's run the scenario again, Isaac. The coin is biased. We know *nothing* about the direction or magnitude of the bias. It could be 99% Heads, 99% Tails, or anything in between. You say your credal state is the set of all probability functions over {Heads, Tails}. So your credence in Heads is the interval $[0, 1]$.

  **Isaac:** That's right. The evidence doesn't constrain the probability. To pick a single number would be to pretend I know something I don't.

  **Clara:** Okay. Now I offer you Bet A: You win $\$10$ if Heads, lose $\$10$ if Tails. What do you do?

  **Isaac:** I decline.

  **Clara:** Why?

  **Isaac:** Because I evaluate acts by looking at my whole set of credences. For some functions in my set, Heads is nearly impossible, so the expected utility is roughly $-\$10$. For others, it's nearly $\$10$. Since the minimum expected utility is negative, and my decision rule is "don't accept a bet unless it's positive across the whole set," I pass.

  **Clara:** Fine. Now, immediately after you decline, I offer you Bet B: You win $\$10$ if Tails, lose $\$10$ if Heads. What do you do?

  **Isaac:** Same reasoning. The minimum expected utility is negative. I decline.

  **Clara:** So you decline Bet A, and you decline Bet B. But consider the package deal. If you took *both* bets, you win $\$10$ on Heads and lose $\$10$ on Heads. You net zero regardless of the outcome. You've hedged perfectly. By declining both individually, you've guaranteed yourself a net of zero, sure, but you've put yourself in a position where you are indifferent to the package deal, yet you rejected the components.

  **Isaac:** I didn't lose money, Clara. I ended with $\$0$.

  **Clara:** Not if there was a cost to enter the room. But let's make it sharper. This is Elga's argument. Imagine a sequential choice. First, I let you choose between Bet A and Bet B. Since your interval is $[0, 1]$, neither dominates the other. You're rationally permitted to pick either. Let's say you pick Bet A. Now, before the coin is flipped, I offer you the chance to switch to Bet B for a penny. You look at your credences. Again, neither dominates. You are permitted to switch. So you switch. You've paid a penny to end up exactly where you started. If you face this sequence repeatedly, I drain your wallet. Your imprecise credences plus a natural decision rule make you dynamically inconsistent. You're vulnerable to a money pump.

  **Isaac:** That's the "Unanimity" rule biting me. It's too strict. I don't hold that you must maximize expected utility across *every* function in the set. I follow Levi. I use **E-Admissibility**.

  **Clara:** Which means?

  **Isaac:** An option is permissible if it maximizes expected utility relative to *at least one* probability function in my representor. So, in the first choice between Bet A and Bet B, Bet A is admissible (because some functions favor Heads) and Bet B is admissible (because some favor Tails). I can pick A. But here's the kicker: Once I've picked A, switching to B for a penny is *not* admissible. Why? Because relative to the specific function that made A admissible (the one that thinks Heads is likely), switching to B is terrible. E-Admissibility filters out the switches that guarantee a loss relative to my committed perspective. So I don't pay the penny. No money pump.

  **Clara:** You've dodged the pump, Isaac, but you've walked into Seidenfeld's trap. E-Admissibility saves you from the sure loss, but it wrecks your planning. Seidenfeld has shown that with E-Admissibility, you can face a decision tree where you plan to take a path at time $t_1$, but when you actually arrive at the node at time $t_2$, that same path is no longer E-admissible. You become time-inconsistent. You can't bind your future self because what counts as "admissible" shifts as the decision tree prunes. A rational agent should be able to formulate a plan and stick to it without their decision rules sabotaging them mid-stream.

  **Isaac:** Time-inconsistency is a technical itch, Clara. It's not a fatal wound. I'd rather have a decision theory that occasionally requires me to re-evaluate plans than one that forces me to hallucinate precision. And while we're on technical wounds, let's talk about **Dilation**.

  **Clara:** Oh, here we go.

  **Isaac:** You precise Bayesians love to point out that with imprecise credences, learning irrelevant evidence can widen my interval. If my credence in Heads is $[0.4, 0.6]$, and I learn the coin was flipped on a Tuesday—and the day of the week is independent of the bias—my credence might dilate to $[0, 1]$. It looks like I've become *more* ignorant after learning a truth. That seems pathological.

  **Clara:** It *is* pathological. It violates the intuition that relevant evidence should sharpen your view, or at least leave it unchanged if independent. If your formalism punishes you for learning truths by making you less decisive, the formalism is broken.

  **Isaac:** Is it broken, or is it honestly representing the structure of the uncertainty? Dilation happens because your "independence" assumption holds for some priors in my set but not others. When I update, the set shifts to reflect that tension. It's not that I'm more ignorant; it's that the interaction between the evidence and my set of priors reveals that I have less grip on the hypothesis than I thought. But let's put the technicalities aside. Look at *your* position.

  **Clara:** My position is coherent.

  **Isaac:** It's arbitrarily precise. Back to the coin. Biased, unknown direction. You walk in and assign a sharp credence. What is it? $0.5$?

  **Clara:** By the Principle of Indifference, yes. Symmetry dictates 0.5.

  **Isaac:** But we *know* it's biased. The symmetry is broken in reality; we just don't know how. So why 0.5? Why not $0.50001$?

  **Clara:** Because I have no evidence favoring one over the other. 0.5 is the only non-arbitrary number.

  **Isaac:** That's the "False Precision" charge. If you assign 0.5, you are claiming that the evidence supports 0.5 *more than it supports 0.51*. But ex hypothesi, the evidence does no such thing. The evidence is completely silent. To pick a single number is to lie about the evidence. You're dressing up total ignorance as specific knowledge. My interval $[0, 1]$ is the only honest representation of "I have no clue." Your 0.5 is a delusion of objectivity.

  **Clara:** It's not a delusion; it's a commitment to action. Epistemology isn't just about mirroring evidence; it's about guiding action. If I have to bet, I *must* have a price. If I say "my price is between $\$0$ and $\$10$," I can't write a check. I can't navigate the world with intervals. I need a sharp credence to function.

  **Isaac:** Then your decision theory is demanding too much of your epistemology. If the evidence doesn't support a sharp number, your decision theory should handle sets, not force you to fabricate a number to make the math work. You're solving the problem of action by falsifying the problem of belief.

  **Clara:** And you're solving the problem of belief by making action impossible. If E-Admissibility leaves you with multiple permissible options and no tie-breaking rule, you're paralyzed. In the real world, paralysis is a loss. If I have to choose between two meds, and your theory says "both are admissible, pick whatever," but doesn't tell me *how* to pick, you haven't helped me reason. You've just told me reasoning is done.

  **Isaac:** I've told you that *epistemic* reasoning is done. Practical reasoning takes over. I can flip a coin to decide between the meds. That doesn't mean my *belief* about their efficacy is sharp. You're conflating the decision with the doxastic state.

  **Clara:** But the doxastic state drives the decision! If your credence is imprecise, and your decision rule is permissive, you're vulnerable to exploitation by agents like me who *are* precise. I can model your set, predict the range of your behavior, and bet against you in the gaps.

  **Isaac:** Only if I'm forced to bet. I'm allowed to abstain.

  **Clara:** You can't abstain from life, Isaac. The coin is flipping whether you bet or not.

  **Isaac:** Then I'll maintain that my abstention is the rational response to radical ignorance. Better to stand on the sidelines with a muddy map than to march confidently off a cliff because your map was drawn with a finer pen than the terrain warranted.

  **Clara:** And I'll maintain that a muddy map is no map at all. If you can't distinguish between a 40% chance and a 60% chance, you don't have a belief about probability; you have a confession of confusion.

  **Isaac:** It's not confusion. It's fidelity.

  **Clara:** It's paralysis.

  *They stare at each other. Clara picks up an eraser; Isaac caps his marker. The chalkboard remains covered in incompatible equations.*

  **Isaac:** Lunch?

  **Clara:** Sure. I'm paying. I'm 90% confident you'll pick the sandwich shop.

  **Isaac:** My credence in that interval is $[0.1, 0.9]$. I'm choosing the place.

  **Clara:** Fine. But I'm ordering for both of us.

  **Isaac:** Admissible.

  *They exit.*
