      *   **Problem:** The instructor struggles to explain *why* hypocrites lack standing without just re-describing the phenomenon or falling into *tu quoque*. Students are pushing back on the mechanism.
      *   **Key Authors Mentioned:** Cohen (G.A. Cohen on terrorists/standing), Wallace (R. Jay Wallace on equal standing), Fritz & Miller (fairness-based accounts), Todd (unified account).
      *   **Specific Questions:**
          1.  Granular explanation of what goes wrong in hypocritical blame (the mechanism).
          2.  Comparison of Wallace (equal standing/implicit exemption) vs. Fritz & Miller (fairness).
          3.  Do these accounts escape the *tu quoque* charge?
          4.  Side Question: Why is standing specific to blame and not praise?

  2.  **Deconstruct the Core Philosophical Issue:**
      *   *The Problem:* If $A$ blames $B$ for $\phi$-ing, and $A$ also $\phi$s (or has $\phi$-ed without blame), why does $A$'s blame lack force? It's not that $B$ didn't do wrong. It's that $A$ isn't the right person to say it.
      *   *The Tu Quoque Worry:* "You did it too" is usually a fallacy. It doesn't make $B$'s action right. So why does it silence $A$?
      *   *The Solution (Standing Accounts):* Blame isn't just a constative speech act (stating a fact); it's a normative/communicative act (demanding accountability, imposing sanctions, altering relationships). Standing is the *authority* to perform that act.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. It *is* a tricky move. Validate the student's pushback (it *looks* like *tu quoque*). Set the stage: Blame is not just description; it's a normative transaction.

      *   **Part 1: The Mechanism of Standing (Beyond "Fraud"):**
          *   Need to distinguish *truth conditions* vs. *felicity conditions*.
          *   Analogy time: A judge who breaks the law can still sentence you (legally), but a hypocritical blamer is more like a specific kind of moral authority. Better analogy: A referee who cheats in the same game.
          *   Key distinction: Blame involves a *demand* or a *claim*.
          *   The "Implicit Claim" move: When I blame you, I implicitly claim "I am subject to this norm too." If I violate that, the claim is false.

      *   **Part 2: Wallace vs. Fritz & Miller (The Granular Work):**
          *   *Wallace (Equal Standing):* Focus on the *moral community*. Blame presupposes we are equal participants in a normative practice. If I exempt myself, I step outside the reciprocity required for the practice. It's about *authority* derived from shared submission to norms.
              *   *Mechanism:* Inconsistency in *commitment*. I claim the norm binds you, but my actions show I don't think it binds me. This undermines the *validity of the demand*, not the truth of the violation.
          *   *Fritz & Miller (Fairness/Unfairness):* Focus on the *burden* of blame. Blame is costly (social friction, guilt, sanction). It is unfair to impose this burden on you while I refuse to bear it myself.
              *   *Mechanism:* Unfair distribution of normative burdens. It's not just "I broke the rule," it's "I'm making you pay for breaking the rule while I skate."
          *   *Comparison:* Wallace is about *status/authority* (Kantian/Contractualist vibe). F&M is about *cost/fairness* (Consequentialist/Contractualist hybrid).

      *   **Part 3: Escaping Tu Quoque:**
          *   Standard *tu quoque*: "You did X, so your claim that X is wrong is false." (Fallacious).
          *   Standing Account: "You did X, so your *authority to hold me accountable* for X is compromised." (Valid).
          *   The shift is from *propositional content* to *speech act felicity*.
          *   Does it relocate the problem? Maybe, but it clarifies *why* the ad hominem matters here. It matters because blame is relational, not just observational.

      *   **Part 4: The Side Question (Blame vs. Praise):**
          *   Why no standing for praise?
          *   *Asymmetry of Demand:* Blame demands something (accountability, repair, guilt). Praise offers something (credit, elevation).
          *   *Authority:* You need authority to punish/demand. You don't need authority to compliment. (Anyone can say "Nice goal," but not anyone can issue a penalty).
          *   *The "Fraud" aspect:* Hypocritical praise is weird (virtue signaling?), but it doesn't violate the target's rights or impose unfair burdens in the same way.
          *   *Exception:* Maybe "standing to reward"? (e.g., a teacher giving an A they don't deserve). But moral praise is usually gratuitous.

      *   **Conclusion/Teaching Tips:**
          *   Give the instructor concrete analogies to use in class.
          *   Suggest framing it as "Normative Authority" vs. "Factual Accuracy."

  4.  **Review and Refine:**
      *   *Tone:* Professional, collegial, philosophically precise but accessible (for a grad seminar prep).
      *   *Check:* Did I address Todd? Briefly mention him as trying to unify these (often via the "commitment" condition).
      *   *Check:* Did I address the "mechanism"? Yes, focused on the implicit claim of shared subjection.
      *   *Self-Correction during drafting:* Make sure not to get too bogged down in exegesis. Keep it focused on the *conceptual work* the instructor needs to explain. Ensure the distinction between "truth of the blame" and "appropriateness of the blamer" is sharp.

  5.  **Final Polish:** (Produces the structured response below).
      *   *Key Insight to emphasize:* Blame is a *speech act* with *felicity conditions*, not just a *constative* with *truth conditions*. This is the linguistic/philosophical hook that defeats the *tu quoque* worry.

  6.  (Post-computation check): Does this answer the specific worry about "re-describing the phenomenon"? Yes, by focusing on the *implicit claim* made during the speech act. When I blame, I *do* something (claim authority). If I'm hypocritical, that *doing* is infelicitous. That's a mechanism, not just a label.

  7.  (Final check on Praise): Ensure the distinction between *demanding* (blame) and *offering* (praise) is clear. That's the crux of the asymmetry.

  8.  (Final check on Tu Quoque): Explicitly state that *tu quoque* attacks the *argument*, standing attacks the *speaker's right to make the move*.

  Okay, ready to write.s
answer: |-
  This is a fantastic pedagogical problem, and your student's pushback is exactly right. If you can't explain *why* standing matters without just saying "because hypocrisy is bad," the account looks question-begging. The *tu quoque* worry is the central hurdle for this literature.

  Here is a granular breakdown of the mechanism at work in standing-based accounts, specifically designed to help you distinguish the *tu quoque* fallacy from the *standing* objection, followed by the asymmetry question regarding praise.

  ### 1. The Mechanism: Constative vs. Performative
  The first move to make in class is to shift the category of "blame."
  *   **The Student's Worry (*Tu Quoque*):** They are treating blame as a **constative** speech act (a statement of fact). If I say, "You stole the money," the truth of that statement depends entirely on whether you stole the money. My moral record is irrelevant to the truth conditions of the proposition.
  *   **The Standing Account:** Blame is a **performative** or **normative** speech act. It is not just describing a moral fact; it is *doing* something (demanding accountability, altering the relationship, licensing sanctions).

  Like any performative (e.g., "I pronounce you husband and wife," "I sentence you to five years"), blame has **felicity conditions**, not just truth conditions. A random person in the gallery cannot sentence a defendant, even if the defendant is guilty. Why? Because they lack the *authority* (standing) to perform that act.

  **The Mechanism of Hypocrisy:**
  When a non-hypocrite blames, they implicitly make a claim to authority. Standing accounts argue that hypocrites fail to meet the conditions required to hold that authority. It's not that the *content* of the blame is false; it's that the *act* is infelicitous.

  ### 2. Wallace vs. Fritz & Miller: What Work is Being Done?
  You asked for the specific philosophical work being done in these accounts. Here is how to distinguish the mechanisms.

  #### R. Jay Wallace: The "Equal Standing" / Implicit Claim Account
  For Wallace, the mechanism is about **reciprocity in the moral community**.
  *   **The Move:** When I blame you, I am not just saying "You violated norm N." I am implicitly claiming, "We are both equally subject to norm N, and I am holding you to a standard I accept for myself."
  *   **The Defect:** Hypocrisy involves an **implicit claim of exemption**. By violating the norm myself (without excuse), my actions signal that I do not regard myself as bound by the norm in the same way I am demanding you be bound.
  *   **Why it silences blame:** It creates a contradiction in the *practical stance*. I am claiming we are moral equals (which gives me standing to hold you accountable), but my conduct asserts we are not equals (I am above the norm). This undermines the **authority** of the demand.
  *   **Escaping *Tu Quoque*:** It's not "You did it, so you're wrong." It's "You claimed we are equals under this norm, but your conduct falsifies that claim, so you lack the authority to enforce it."

  #### Fritz & Miller: The Fairness / Burden Account
  For Fritz and Miller, the mechanism is about the **distribution of normative burdens**.
  *   **The Move:** Blame is costly. It imposes a burden on the target (guilt, shame, social sanction, obligation to repair).
  *   **The Defect:** It is **unfair** to impose this burden on others while refusing to bear the burden of self-regulation oneself. Hypocrisy is a form of free-riding on the normative system.
  *   **Why it silences blame:** The hypocrite forfeits their right to impose costs because they are unwilling to incur the costs of compliance themselves. It renders the blame **unfair**, not false.
  *   **Escaping *Tu Quoque*:** It's not about the truth of the accusation; it's about the fairness of the transaction. "You may be guilty, but it is unfair for *me* to be the one to collect the debt when I refuse to pay my own."

  #### Patrick Todd: The Commitment Account
  Todd tries to unify these. For Todd, the key is **commitment to the norm**.
  *   **The Mechanism:** To have standing, you must be *committed* to the norm you are enforcing. Hypocrisy reveals a lack of genuine commitment.
  *   **The Work:** This explains why *past* wrongdoers who have repented *do* have standing (they are now committed), while current hypocrites do not. It locates the defect in the **current orientation toward the norm**, not just the history of violation.

  ### 3. Does This Escape *Tu Quoque* or Relocate It?
  Your student worries this just relocates the problem. Here is the defense:

  *   **Standard *Tu Quoque*:** Attacks the *proposition*. ("You say smoking is bad, but you smoke." -> "Smoking is still bad.")
  *   **Standing Objection:** Attacks the *speaker's license*. ("You say smoking is bad, but you smoke." -> "You lack the moral authority to *chastise* me for smoking.")

  **The Classroom Test:**
  Ask the student: "If a judge sentences a defendant, does it matter if the judge is a murderer?"
  *   *Legally:* No (usually). The law's authority is institutional.
  *   *Morally:* Yes. If the judge murders people, their moral condemnation of the defendant loses its force. The defendant can say, "Who are *you* to judge me?"
  *   **The Point:** The defendant isn't saying "Murder is okay." They are saying "Your judgment lacks moral weight." Standing accounts explain *why* it lacks weight (because the judge has opted out of the reciprocity that gives judgment weight).

  So, it doesn't relocate the *tu quoque*; it shows that *tu quoque* is a fallacy regarding *truth*, but a valid objection regarding *authority*.

  ### 4. The Side Question: Why No Standing for Praise?
  This is a sharp observation. We rarely say, "You lack the standing to praise me." Why?

  **1. The Direction of Fit (Demand vs. Offer)**
  *   **Blame** is a **demand**. It requires something from the target (acknowledgment, guilt, repair). Because it imposes a burden, the blamer needs authority to impose it.
  *   **Praise** is an **offer** (or a gift). It confers credit or elevation. Generally, you do not need special authority to give someone a gift or a compliment. Anyone can say, "That was generous of you."
  *   **The Mechanism:** Standing is a constraint on *power*. Blame exercises power over another's normative status. Praise usually enhances it without constraining it. Therefore, the checks on authority (standing) apply to blame, not praise.

  **2. The Presumption of Equality**
  *   In blame, we presume we are equals holding each other to a shared standard. If I exempt myself, I break the equality.
  *   In praise, I am acknowledging you have *exceeded* a standard. I am not necessarily claiming I meet it. I can praise a hero for bravery without being brave myself. In fact, praise often comes from those who acknowledge they *couldn't* do what the target did.
  *   **The Mechanism:** Hypocritical blame claims "We are the same (bound by norms), but you failed." Hypocritical praise claims "You are exceptional (above the norm)." The former requires the speaker to be under the norm to have the comparison hold; the latter does not.

  **3. The "Virtue Signaling" Exception**
  *   There *is* a case where standing to praise matters: when praise is used instrumentally to claim moral superiority for the praiser.
  *   If I praise you for donating to charity *solely* to signal that I am part of the "charity-supporting crowd" (while I donate nothing), I might be accused of insincerity. But this is usually an attack on my *sincerity*, not my *standing*.
  *   **Teaching Tip:** You can tell students that standing attaches to **accountability practices**. Praise is rarely an accountability practice (we don't usually *demand* people accept praise or feel guilty if they reject it). Blame is inherently about accountability.

  ### Summary for the Seminar
  To stop the "re-description" spiral, use this triad on the board:

  1.  **Truth Conditions:** Did the target violate the norm? (Hypocrite's blame can be True).
  2.  **Felicity Conditions:** Does the speaker have the authority to enforce the norm? (Hypocrite's blame is Infelicitous).
  3.  **The Mechanism:** The authority is generated by **shared submission** (Wallace) or **fair burden-sharing** (Fritz & Miller). Hypocrisy breaks the generation mechanism.

  This moves the discussion from "Is the hypocrite a bad person?" (Moralizing) to "What are the preconditions for valid normative transactions?" (Structural). That is usually enough to satisfy the *tu quoque* worry.
