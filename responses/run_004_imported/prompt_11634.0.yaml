answer: |-
  The chamber smelled of ozone and sterile plastic, not incense, but the hum of the transporter coil triggered the same somatic alarm bell that had rung in the meditation hall two years ago. Elias sat on the plinth, hands resting on his knees, trying to regulate a breath that felt increasingly optional.

  On the retreat, they called it *bhanga*, dissolution. It started with the breath fracturing. Then the sounds of the gong broke into discrete particles of vibration. Then the body itself lost its cohesion, becoming a field of static on an old TV, flickering on and off at a rate too fast for the eye to track, but slow enough for the mind to panic.

  The technician's voice crackled over the intercom. "Initiating scan sequence. Please remain still. Do not attempt to maintain continuity of thought."

  *Continuity of thought.* The phrase snagged on something raw inside him.

  As the blue lattice of the scanner swept over him, Elias felt the familiar terrifying drop. It wasn't pain. It was the absence of a floor. On the cushion, he had searched for the watcher—the one behind the eyes observing the flickering static. He had looked everywhere. He checked the feelings (*vedana*), but they were just rising and dying. He checked the perceptions (*sanna*), but they were label-makers operating on autopilot. He checked the consciousness (*vinnana*) itself, but it was just a series of flashes, like a movie reel spun too fast. There was no watcher. There was only the watching.

  Now, under the scanner, the *rupa* (form) was being digitized. The machine was arguing that he was nothing but data.

  *If the pattern is preserved,* Elias thought, *does the substrate matter?*

  He remembered the story of Nagasena and the King. The monk asked the King if the chariot was the wheels, the axle, or the frame. The King said no to each. Then Nagasena asked if the chariot existed separate from those parts. The King had to admit there was no "chariot" there, only a label applied to a temporary arrangement of components.

  *I am the chariot,* Elias thought. *This machine is just taking the wheels off.*

  The hum intensified. The boundary between his skin and the air began to dissolve. He felt the specific terror of the dissolution stage returning—the knowledge that death wasn't a future event, but a present mechanism. Every moment, the aggregate of form died and was reborn. The machine was just widening the gap. It was destroying the body here to rebuild it on Mars. But if the self was just a label on a flowing process, what was being destroyed?

  And what was being built?

  A warning light flickered on the console. A glitch. The technician cursed, muted, but Elias saw it. The buffer overflowed. For a microsecond, the data existed in two places. The pattern was duplicated before the original was wiped.

  If there were two Elias's, which one held the label? If the original was destroyed, and the copy stepped out on Mars with all his memories of the retreat, all his fear of the dissolution, would that copy know it was a copy? Or would it just feel like it survived?

  Derek Parfit had said identity isn't what matters. Survival is. But Parfit hadn't sat in the dark while his consciousness flickered like a dying bulb. Parfit hadn't felt the horror of realizing the "survivor" is just a new aggregate cluster inheriting the karma of the previous one.

  The light turned green. The hum died.

  Elias stood up. His legs felt solid, yet he remembered them as static. He walked to the airlock. He remembered the retreat teacher saying, "Note the fear." But there was no one to note it. The fear was just a sensation arising in the throat. The thought "I am afraid" was just a formation (*sankhara*) popping into the void.

  He stepped onto the transport pad of the receiving end. The air was different here. Thinner. He looked at his hands. They were the same hands, down to the scar on the thumb. But were they the same hands that had gripped the cushion in the meditation hall? Or were they a reconstruction of the memory of those hands?

  He tried to locate the person who had stepped into the machine on Earth. He searched for the continuity, the thread that tied the Elias in the chamber to the Elias standing here. He found only a chain of cause and effect. A sequence of events. No owner.

  A technician approached him. "Welcome to Mars, Mr. Elias. How do you feel?"

  Elias opened his mouth to speak. He wanted to say, *I don't know if I'm the original.* He wanted to say, *The chariot was dismantled, and I don't know if you built it back right.*

  But who was there to say it? If he was the copy, the fear was real. If he was the original, the fear was real. The distinction required a self that persisted through the transition, and he had already lost that on the cushion years ago.

  "I feel..." Elias started. The word hung in the thin air.

  He looked at the technician, then at his own reflection in the glass. The reflection blinked when he blinked. But the lag was imperceptible. Or maybe it was a second too slow. He couldn't tell. The static buzzed under his skin, waiting to flicker off again.

  "I feel," Elias said, "like the wheels are turning."

  He walked past the technician, toward the exit, waiting for the moment the illusion would catch up and reveal that he had never actually left the chamber, or that he had never actually entered it. The fear didn't go away. It just vibrated, steady as a machine, in the space where a person used to be.
