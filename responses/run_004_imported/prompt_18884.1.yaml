      *   *Clarification:* Ensure the distinction between "Positive Morality" (Hart's focus) and "Rationalization of Prejudice" (Dworkin's focus) is clear. Hart says "Just because they believe it doesn't make it right." Dworkin says "Just because they feel it doesn't mean it's a moral belief essential to society."
      *   *Nuance:* Devlin argues the feelings *constitute* the morality. Dworkin argues the feelings need *justification* to count as morality worthy of enforcement.
      *   *Key Phrase:* "Moral Independence." Dworkin introduces the idea that people have a right not to have others' moral preferences imposed on them without independent justification.

