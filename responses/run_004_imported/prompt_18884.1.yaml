prompt: |-
  Okay so my friend and I got into a whole arguement last night about whether the law should ever ban something just because ordinary people find it disgusting, and it somehow turned into a two-hour deep dive on the Hart/Devlin debate (we're both kind of jurisprudence nerds, don't judge). She was going full Devlin on me — the "society is held together by a shared morality" line, and how if the law doesn't step in to defend that morality against whatever makes the average reasonable juror feel real intolerance, indignation and disgust (not just mild squeamishness), the whole social fabric is supposedly at risk of disintegrating from within. I hit back with the standard Hart stuff — the harm principle, his point that Devlin is quietly sliding from "positive" morality (what a society happens to believe) to "critical" morality (what's actually justified), and that there's basically zero evidence any society has ever collapsed because it stopped criminalizing whatever private sexual practice was scandalous that decade.

  Then around 1am she brought up something I'd totally forgotten about: Dworkin also wrote a response to Devlin (I think the piece is literally called "Lord Devlin and the Enforcement of Morals"?), and apparently his objection is supposed to be doing something genuinely different from Hart's rather than just restating it with fancier vocabulary. I vaguely remember it has something to do with Dworkin saying that Devlin never actually shows that the intolerance/indignation/disgust reactions of his hypothetical reasonable man (the guy on the Clapham omnibus, or whatever exact figure Devlin used, I don't remember) are tracking a real moral position at all, as opposed to just prejudice. But I couldn't reconstruct the actual argument well enough to make the point stick. Could you lay out what Dworkin's specific critique of Devlin's test actually is, and explain concretely how it's a different kind of objection than Hart's, and not just the same objection in different words? If you can also say which of the two critiques does more damage to Devlin's overall case and why, that would settle the argument once and for all.
