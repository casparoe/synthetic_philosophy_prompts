answer: |-
  This is a classic jurisprudence rite of passage. First off, tell your friend that a 2 AM Hart/Devlin debate is a sign of a healthy friendship (and perhaps a need for more sleep). You are right to remember that Dworkin's 1966 essay, *"Lord Devlin and the Enforcement of Morals,"* is not just a restatement of Hart. It is a distinct, surgical strike that targets the internal logic of Devlin's argument rather than its external consequences.

  Here is the breakdown of Dworkin's specific critique, how it differs from Hart's, and a verdict on who lands the heavier blow.

  ### 1. Dworkin's Specific Critique: The "Prejudice vs. Principle" Problem

  Devlin's core argument rests on a specific test for identifying which moral rules are essential enough to be enforced by law. He argues that we identify these rules by looking at the **reasonable man** (the man on the Clapham omnibus). If this hypothetical average person feels **intolerance, indignation, and disgust** toward a practice, that emotional reaction is *evidence* that the practice threatens the shared morality holding society together.

  Dworkin's objection attacks the link between **feeling** and **justification**.

  **The Argument:**
  Dworkin argues that Devlin treats the *intensity* of a feeling as proof of its *moral validity*. Devlin assumes that if the reasonable man feels deep disgust, he is reacting to a genuine threat to the social fabric. Dworkin says: **No.**

  Dworkin points out that people can feel intense intolerance and disgust for reasons that have nothing to do with the preservation of society. They might feel disgust because of:
  *   Irrational prejudice (e.g., racism, homophobia).
  *   Religious dogma not shared by all.
  *   Mere distaste for the unfamiliar.
  *   Self-interest disguised as morality.

  **The "Rationalization" Trap:**
  Dworkin argues that Devlin fails to distinguish between a **moral position** (a reasoned judgment about right and wrong that affects others) and a **personal preference** (what I like or dislike). By allowing "disgust" to be the sole trigger for legal enforcement, Devlin allows the majority to enforce their preferences simply by whipping themselves up into a state of indignation.

  For Dworkin, the fact that people *feel* something strongly does not prove that the thing they feel strongly about is actually a matter of **public morality** essential to society's existence. Devlin provides no mechanism to filter out "mere prejudice" from "essential moral truth." He takes the *existence* of the feeling as sufficient justification for the *coercion*.

  **Key Quote Concept:** Dworkin essentially argues that Devlin confuses the *cause* of the feeling with the *justification* for the law. Just because the mob is angry doesn't mean the mob is protecting society; they might just be a mob.

  ### 2. How This Differs from Hart's Critique

  This is where you can win the point against your friend. Hart and Dworkin are attacking Devlin from two different angles.

  **Hart's Attack: External & Sociological (The "Harm" & "Collapse" Argument)**
  *   **Focus:** Hart attacks the *consequences* and the *categories* of Devlin's thought.
  *   **The Move:** Hart relies on the **Harm Principle**. He argues that Devlin provides zero empirical evidence that societies collapse when private morality diverges (the "disintegration thesis"). Hart also makes the famous distinction between **positive morality** (what society *does* believe) and **critical morality** (what society *ought* to believe). Hart says Devlin is enslaving the law to the accidental prejudices of the current era (positive morality) without subjecting them to rational critique.
  *   **In a nutshell:** Hart says, *"You are wrong about the facts (society won't collapse), and you are confusing 'is' with 'ought'."*

  **Dworkin's Attack: Internal & Conceptual (The "Rights" & "Test" Argument)**
  *   **Focus:** Dworkin attacks the *mechanism* of Devlin's test itself.
  *   **The Move:** Dworkin is willing to grant, for the sake of argument, that society *does* need a shared morality (which Hart denies). Dworkin says, *"Even if you are right that society needs shared morality, your test for finding it is broken."*
  *   Dworkin introduces the concept of **Moral Independence**. He argues that individuals have a right not to suffer disadvantage (legal punishment) solely because others disapprove of their choices, unless that disapproval is backed by independent justification (like harm).
  *   **In a nutshell:** Dworkin says, *"Your thermometer is broken. Disgust does not measure social necessity; it only measures prejudice."*

  **The Concrete Difference:**
  *   **Hart** tells Devlin he is looking at the wrong map (Utilitarianism/Harm Principle vs. Moralism).
  *   **Dworkin** tells Devlin his compass doesn't work (The "Reasonable Man's Disgust" is not a reliable indicator of moral truth).

  Hart requires you to accept Millian Liberalism to defeat Devlin. Dworkin defeats Devlin using Devlin's own premises (that we need to identify essential morality) by showing Devlin's method fails to do so.

  ### 3. The Verdict: Who Does More Damage?

  If you want to settle the argument: **Dworkin's critique does more theoretical damage, but Hart's does more practical damage.**

  However, in a jurisprudence context (which is what you two are arguing), **Dworkin wins.** Here is why:

  **Why Dworkin is the Checkmate:**
  Hart's argument relies on an empirical claim: *"Societies don't actually collapse when you decriminalize sodomy."* A stubborn Devlinian could theoretically reply, *"Give it time,"* or *"You just haven't seen the long-term decay."* It becomes a sociological guessing game.

  Dworkin's argument is conceptual. He shows that Devlin's argument is **circular**.
  1.  Devlin says: We ban X because it threatens society.
  2.  Devlin says: We know it threatens society because the reasonable man feels disgust.
  3.  Dworkin asks: How do we know the disgust is about a threat to society and not just prejudice?
  4.  Devlin has no answer other than "Because they feel it."

  Dworkin exposes that Devlin offers no *independent criterion* for when intolerance is justified. Devlin essentially argues: *"The majority is entitled to enforce their morality because they feel strongly about it."* Dworkin shows this is just "Might makes Right" dressed up in moral language. It undermines the *legitimacy* of the law, not just its utility.

  **The "Settle the Argument" Script:**
  Tell your friend this:
  > "Hart argues that Devlin is wrong about the *consequences* of liberalizing the law (society won't collapse). But Dworkin argues that Devlin is wrong about the *nature* of the law itself. Dworkin shows that Devlin's test allows prejudice to count as moral principle without any justification. Hart says 'It won't work'; Dworkin says 'It's not even law, it's just force.' Dworkin cuts the head off the snake; Hart just tries to starve it."

  ### Summary for the Debate
  *   **Hart:** "Disgust isn't harm. No evidence of collapse. You're confusing what people believe with what is true."
  *   **Dworkin:** "Disgust isn't evidence. You haven't shown why the majority's feelings trump the minority's rights. Your test validates prejudice as principle."
  *   **Winner:** Dworkin, because he defeats Devlin on internal grounds without needing to rely entirely on Mill's Harm Principle.

  Tell your friend she was right to bring Dworkin into it, but you're right that his critique is the one that actually dismantles Devlin's *test*, whereas Hart dismantles Devlin's *policy*. Since the debate is about whether the law *should* ban based on disgust, Dworkin's point that disgust is not a valid legal metric is the stronger philosophical position.

  Now, go get some coffee. Two hours of legal positivism at 1 AM is exhausting.
