answer: |-
  **Alex (Armstrongian):** Let's be blunt about Bradley. He argues that if you have a particular $a$ and a universal $F$, you need a relation to tie them together. But then you need a relation to tie the relation to the terms, and so on. You Fregeans claim to stop this by saying concepts are "unsaturated." They don't need a glue; they are the glue. But here is the paradox you never quite escape: the moment you try to state your solution, you undermine it. To say "The concept *horse* is unsaturated," you must use the phrase "The concept *horse*" as the grammatical subject. In your own logic, singular terms refer to objects. So, in the very sentence where you try to explain the unsaturated, you have turned the concept into an object. You've reified the gap. If the concept is an object, it's saturated, and Bradley's regress begins all over again. Your solution is ineffable; you can't say it without contradicting it.

  **Fran (Fregean):** You're conflating the imperfection of natural language with the structure of thought. Frege knew this perfectly well—it's the "concept horse" paradox, and he didn't think it destroyed the theory. The contradiction arises only if you assume grammatical form mirrors logical form. It doesn't. When I say "The concept *horse* is unsaturated," I am forced by the grammar of German or English to use a singular term, but I am *gesturing* at something that functions predicatively. The unsaturatedness isn't a property I'm ascribing to an object; it's a feature of how the expression *works* in a context. I can't name the unsaturated without distorting it, yes, but I can *show* it. In the judgment "Secretariat is a horse," the predicate "...is a horse" doesn't stand for an object that needs gluing to Secretariat. It stands for a function that maps Secretariat to the True. The regress stops because there is no second entity to relate. There is only the object and the function. The "fit" is internal to the logic, not an external relation.

  **Alex:** But if you can't say it, how does it do any metaphysical work? If the unsaturatedness is something we can only "show" through use, it sounds suspiciously like a mystical intuition. You've replaced a metaphysical problem with a linguistic rule. But let's grant you that move for a moment. You stop the regress in the *thought* by making the predicate incomplete. But I'm interested in the *world*. In my view, the world is made of States of Affairs. A State of Affairs is a particular instantiating a universal. This unity is non-mereological. It's brute. The particular and the universal don't need a third thing to tie them together because the State of Affairs is the primary unit of reality.

  **Fran:** That brute unity is convenient, but it creates a mirror image of my linguistic problem. You say States of Affairs unify the constituents of reality. Fine. But States of Affairs, on your account, are factive. They exist only when the corresponding proposition is true. There is no State of Affairs for "The cat is on the mat" if the cat is on the rug. So, consider the false proposition: "The cat is on the mat." It has unity; it's a single intelligible content, not just a list of words. If the only thing capable of providing non-mereological unity is a State of Affairs, and there is no State of Affairs for false propositions, what unifies the false proposition?

  **Alex:** I distinguish the proposition from the fact. The proposition is a linguistic or mental entity. The State of Affairs is the truthmaker in the world. The unity of the *proposition* is provided by the mind or the syntax of the language. The State of Affairs is only required to unify the *worldly constituents*. Bradley's regress is a threat to ontology, to how things hang together in reality. I solve that by positing the State of Affairs as the fundamental ontological unit. I don't need a State of Affairs to unify a false thought, because a false thought doesn't map onto a worldly unity. It maps onto nothing.

  **Fran:** But that concedes the metaphysical point to the mind. If the mind can unify "cat," "mat," and "on-ness" into a single content without a State of Affairs, then unity *is* possible without your brute fact. You've admitted that constituents can be combined into a whole without the existence of a corresponding State of Affairs. So why do we need the State of Affairs to unify the *true* case? If the mind can hold the constituents together in the false case, why can't the world hold them together in the true case without the extra ontological expense of a non-mereological composition? You've made the State of Affairs redundant for unity; it's now just a truthmaker. But Bradley wasn't asking about truth; he was asking about unity. If unity is possible in the false case without a State of Affairs, the regress should be stoppable in the true case without one too.

  **Alex:** No, because the mind's unity is derivative. The mind can combine "cat" and "mat" only because it is tracking a *possibility* of a State of Affairs. The constituents themselves—the particular cat and the universal *on-ness*—have a combinatorial potential. They *can* form a State of Affairs. In the false case, the mind represents that possibility. In the true case, the possibility is actualized. The State of Affairs is the actualization of that unity. Without the State of Affairs, you have a mere list in the world. The mind can represent a list as a unity, but the world cannot *be* a unity without the State of Affairs.

  **Fran:** So you're grounding the unity in modal space? The constituents have a "combinatorial potential"? But isn't that potential just another way of describing the unsaturatedness I started with? To say a universal has a "potential" to combine with a particular is to say it is, in some sense, incomplete without it. You've smuggled my unsaturatedness into your ontology under the name of "combinatorial potential." And if that potential is real, does it exist? If it exists, is it an object? If it's not an object, how do you name it without turning it into one? You've avoided the Concept Horse by calling it a State of Affairs, but now to handle false propositions, you've had to posit possible States of Affairs. Do they exist? If yes, you have non-existent entities. If no, then the "potential" is nothing, and you're back to needing a brute unity that only appears when the fact is true. Which brings me back to where I started: what unifies the constituents in the false case if the potential is nothing? If the potential is something, you're a realist about possibilia. Which is it?
