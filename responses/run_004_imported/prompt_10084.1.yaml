answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. Priya and I have been navigating the trenches of graduate school together for about four years now. We started our MA at the same time, and somehow, we've both managed to survive long enough to become ABD in the same program. Which, for the non-academics in the room, stands for "All But Dissertation." Or, as I like to call it, "All But Done."

  When Priya asked me to give this toast, she gave me one instruction: "Do not make it a lecture." But anyone who knows Priya knows that her intellectual life and her actual life are the same thing. For the last four years, her entire academic existence has revolved around one specific chapter of G.E. Moore's *Principia Ethica*.

  Moore argues that if you strip away everything in the universe—using what he calls the "Isolation Test"—only two things remain intrinsically good: the enjoyment of beauty, and personal affection. Everything else? Money, status, even virtue itself—Moore says their value depends on context. But those two? They are good in themselves.

  Priya has spent years testing the world against this standard. She has subjected dates, roommates, and departmental politics to the isolation test. And Wren, I need you to know something important: You are the first person Priya has ever dated who survived the isolation test without immediately being categorized as a "heap of filth."

  For the philosophers here, that is a specific reference to Moore's most famous thought experiment. For everyone else, it means you passed the vibe check with flying colors.

  Now, I have to admit, reading Moore's definition of affection can be a little… chilly. He describes it as "admiration of someone's good qualities plus the appropriate emotion." If you read that at a wedding, it sounds like a performance review. It sounds like Priya took a clipboard, tallied Wren's virtues, determined the emotion was proportionate, and signed off on the marriage license.

  But watching them together, I've realized that Moore got the logic right, but he couldn't capture the texture. Because while Moore says affection is about admiring qualities, what I see between Priya and Wren is that the affection *creates* the value. It's not that Wren is perfect and therefore loved; it's that the love makes the qualities shine.

  And this brings me to the most important part of Moore's ethics, the part that actually explains why we are all here tonight. Moore believed in "Organic Unities." He argued that the value of a whole is not simply the sum of the value of its parts. Sometimes, when you put two good things together, the result is vastly greater than just adding them up.

  Priya is a good thing. Wren is a good thing. But Moore would argue that their marriage isn't just Priya plus Wren. It is a new, organic unity. The love they share creates a value that didn't exist when they were separate, no matter how wonderful they were on their own.

  Priya has spent four years studying the theory of the good. But tonight, she stops studying and starts living it. She has found the two great goods Moore wrote about. She has found the beauty in the world, and she has found the personal affection that makes that beauty worth seeing.

  So, if everyone could please raise a glass.

  To Priya and Wren: May your life together be the one thing that survives the isolation test. May you always find beauty, even in the ugly worlds. And may your union prove that the whole is always, always greater than the sum of its parts.

  To the bride and groom.
