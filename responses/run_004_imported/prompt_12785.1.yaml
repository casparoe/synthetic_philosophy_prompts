answer: |-
  You have identified a genuine fault line in mystery theory, one that often goes unspoken because it relies on an intuitive contract between writer and reader. Your instinct is correct: there is a principled distinction between **informational presence** (the fact is in the text) and **narrative salience** (the fact is available to the reader's reasoning).

  Your beta readers are not merely disagreeing on taste; they are arguing from two different definitions of "Fair Play." Camp A is arguing for **Archival Fair Play** (everything is technically there). Camp B is arguing for **Procedural Fair Play** (the reader had a viable cognitive path to the solution).

  To resolve this for your manuscript and your agent, you need vocabulary that bridges the gap between "what is written" and "what is readable." Here is a framework for distinguishing information a reader is *given* from information they can be held responsible for *deriving*.

  ### 1. Salience vs. Noise
  In information theory, a signal must be distinguishable from noise to be received. In fiction, **salience** is the narrative weight assigned to a detail.

  *   **Archival Fair Play** assumes that if a sentence exists, it has equal weight.
  *   **Procedural Fair Play** recognizes that narrative context dictates weight.

  If a character mentions a train in Chapter 2 during a heated argument about inheritance, the train detail is **noise** (emotional context dominates). If they mention the train while checking a pocket watch and frowning, the train detail gains **salience** (temporal context dominates).

  **The Principle:** A clue is only "fair" if its salience is proportional to its importance. If a detail is crucial to the solution, it must be granted enough narrative gravity to survive the reader's natural filtering process. Readers are trained to ignore "atmospheric" details. If your train remark reads as atmospheric chatter, the reader is procedurally justified in discarding it, even if it is archivally present.

  ### 2. The Cognitive Load of Concatenation
  You mention the solution depends on combining three things. In puzzle design, this is known as **concatenation**.

  *   **One-step inference:** The clock is fast; therefore the alibi is wrong. (Fair)
  *   **Two-step inference:** The clock is fast; the train schedule relies on the clock; therefore the alibi is wrong. (Acceptable)
  *   **Three-step inference across disparate domains:** Train schedule + Clock error + Victim's habit = Murder. (High risk)

  **The Principle:** The "distance" between clues matters. If the connection requires the reader to hold three distinct, unconnected facts in working memory across six chapters without a narrative prompt to link them, you have exceeded the reasonable **cognitive load** of the genre contract.

  Golden Age mysteries often rely on the reader forgetting the clue, not on the reader failing to connect it. There is a difference between *forgetting* a fact (which the detective reminds them of) and *never encoding* the fact as relevant (which the detective reveals was relevant all along). Your beta readers in Camp B feel the latter occurred. They didn't forget the train; they encoded it as "irrelevant background."

  ### 3. Abductive Reasoning and the "Model Reader"
  Umberto Eco, in *The Role of the Reader*, discusses the **Model Reader**—the reader the text implicitly constructs and expects. A mystery novel constructs a Model Reader who is suspicious, attentive to anomalies, and looking for patterns.

  However, the text must also provide the **Abductive Framework**. Abduction is inference to the best explanation. For abduction to occur, the text must present a *problem* that demands a solution.

  *   **Fair:** The text presents a temporal anomaly (the body was found at 8:00, but rigor suggests 7:00). The reader looks for clues to explain the time discrepancy. The clock and train clues become relevant because the *question of time* has been raised.
  *   **Unfair:** The text presents no temporal anomaly until the end. The reader has no reason to prioritize time-related facts.

  **The Principle:** You cannot ask the reader to solve a puzzle you haven't told them exists. If the "time discrepancy" is not established as a problem until Chapter 10, the reader cannot be held responsible for gathering time-related clues in Chapters 2 and 5. The *question* must be posed before the *answer* can be sought.

  ### 4. Retrospective Coherence vs. Prospective Solvability
  This is the core of your disagreement.
  *   **Retrospective Coherence:** "Ah! Looking back, it all makes sense." (Camp A is satisfied by this).
  *   **Prospective Solvability:** "I could have seen this coming." (Camp B demands this).

  Ronald Knox and S.S. Van Dine wrote their rules to ensure Prospective Solvability, not just Retrospective Coherence. Van Dine's Rule 20 states: *"The problem of the crime must be presented in such a way that the reader may have a fighting chance to solve it."*

  A "fighting chance" implies agency. If the connection between the train, the clock, and the habit is not invited until the detective explains it, the reader had no agency. They were passengers, not participants.

  ### How to Fix It (Without Rewriting the Plot)
  You do not necessarily need to change the clues, but you must change their **narrative signaling**. You need to shift the burden from the reader's memory to the text's structure.

  1.  **Raise the Question Early:** Somewhere before Chapter 5, establish that *time* is unreliable or significant. Perhaps the victim is known for being obsessively punctual, or there is a minor confusion about dinner time. This primes the reader to encode time-related details (clocks, trains) as high-salience data.
  2.  **Echo the Clues:** When the clock is mentioned in Chapter 5, have a character make a small, incorrect assumption based on it that goes uncorrected. This creates a "narrative itch." The reader notes the clock is wrong, but doesn't know why. When the train clue appears, it scratches that itch.
  3.  **The Detective's Struggle:** In the final chapter, before the reveal, show the detective struggling with the same disconnection the reader felt. Have them say, "I had the train, and I had the clock, but they wouldn't speak to each other. Until I realized..." This validates the reader's experience. It admits the leap was difficult, transforming the reveal from a "gotcha" into a shared discovery.
  4.  **Reduce the Distance:** If possible, move the train remark and the clock detail closer together. If they occur in the same scene or adjacent chapters, the working memory load drops significantly, making the combination reasonable.

  ### Conclusion
  "Fair play" is not an unprincipled truce; it is a contract regarding **attention**.

  The principle you are looking for is this: **A reader is responsible for deriving connections between facts that the narrative has marked as significant, but they are not responsible for connecting facts that the narrative has marked as noise.**

  If your train remark and clock detail are written as "noise" (throwaway lines with no narrative gravity), Camp B is right: it is an ambush. If you rewrite them to carry a slight charge of mystery or inconsistency (making them "significant"), Camp A becomes right: it is fair play.

  The facts don't need to change. The *framing* does. You must invite the reader to care about the time before you ask them to solve the crime using it.
