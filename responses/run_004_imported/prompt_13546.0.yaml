prompt: |-
  I'd like your perspective on a situation from my research group. My advisor sharply criticized one of our postdocs for quietly adding themselves as a co-author on a student's conference poster despite having contributed essentially nothing to that particular work. A longtime labmate later told me, in passing, that our advisor did exactly the same thing as a postdoc decades ago, has evidently regretted it ever since, and has never repeated it; almost nobody outside a small circle knows about it. This has split opinion in the group: some think the advisor's history means they weren't really in a position to react so harshly, whatever the merits of the complaint, while others think an old, regretted, one-off lapse shouldn't permanently disqualify someone from objecting when they see the same thing again. I find both reactions somewhat compelling, but can't work out what should settle the disagreement, or which of these facts are actually doing the work. Which view is closer to right, and why?
