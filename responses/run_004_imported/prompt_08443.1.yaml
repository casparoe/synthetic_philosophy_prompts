answer: |-
  **Title:** The Cost of Coherence: Defending Level-Splitting in Higher-Order Evidence Cases

  **Introduction**

  The central tension in the contemporary literature on higher-order evidence (HOE) is a conflict between two intuitive demands on the rational agent. The first is the demand to respond correctly to one's evidence. If your first-order evidence (FOE) decisively supports a proposition $P$, rationality seems to require believing $P$. The second is the demand for coherence. If you believe that your belief in $P$ is irrational or unsupported, it seems structurally defective to continue believing $P$. This tension crystallizes in the problem of epistemic akrasia: the state of believing $P$ while simultaneously believing that one's evidence does not support $P$.

  For years, the orthodoxy has been the Non-Akrasia Constraint (NAC), championed by philosophers like Sophie Horowitz. The NAC holds that rationality strictly forbids akratic states. However, a growing "level-splitting" camp, represented by Alex Worsnip and others, argues that in cases of misleading HOE, the demand to respond to FOE overrides the demand for coherence. This essay evaluates both positions through the lens of David Christensen's impairment cases. I argue that the level-splitting view is superior. While epistemic akrasia is indeed an unfortunate state, it is sometimes rationally permissible, and insisting on the NAC forces agents into a deeper irrationality: the abandonment of decisive first-order evidence.

  **The Case: The Fatigued Logician**

  To ground the debate, consider a variation of Christensen's impairment case. Imagine Elena, a top-tier mathematician. She is working on a complex proof for a theorem, $T$. She spends four hours working through the derivation. Every step checks out; the axioms are sound, the inferences are valid, and she feels a high degree of confidence. Her first-order evidence (the proof itself) overwhelmingly supports $T$.

  However, just as she finalizes the proof, her department chair rushes in. "Elena," he says, "I forgot to tell you. You volunteered for a sleep study last week. The records show you were administered a compound known to induce severe logical overconfidence. Subjects under its influence make elementary errors but feel subjectively certain they are correct. The effect peaks exactly four hours after ingestion." Elena checks her watch. It has been exactly four hours.

  Elena now possesses higher-order evidence. She has strong reason to believe that her cognitive faculties regarding this proof are compromised. The question is: What should Elena believe about $T$?

  **The Non-Akrasia Constraint (The Horowitz View)**

  Proponents of the Non-Akrasia Constraint argue that rationality is fundamentally a matter of structural coherence. Sophie Horowitz argues that akrasia is epistemically analogous to Moore's Paradox ("It is raining, but I don't believe it"). Just as asserting a Moorean sentence is pragmatically self-defeating, holding an akratic belief is rationally self-undermining. If Elena believes $T$ but also believes "My evidence does not support $T$," she is effectively admitting that her own belief is unjustified.

  On this view, the HOE acts as a *defeater*. Once Elena learns about the drug, her total evidence no longer supports $T$. Why? because her total evidence now includes the fact that her processing of the proof is likely unreliable. To maintain confidence in $T$ while acknowledging the drug's influence is a form of dogmatism. It implies she thinks she is special or immune to the drug, which she has no evidence for.

  Therefore, the NAC verdict is clear: Elena must lower her confidence in $T$. She cannot rationally maintain the belief in the theorem while believing her cognitive access to that theorem is broken. To avoid akrasia, she must align her first-order belief with her higher-order assessment. She must suspend judgment on $T$.

  **The Level-Splitting View (The Worsnip View)**

  The level-splitting view challenges the idea that coherence is the supreme epistemic virtue. Alex Worsnip argues that the norms of "substantive rationality" (believing in accord with evidence) and "structural rationality" (avoiding contradictions in attitudes) are distinct and can conflict.

  In Elena's case, the FOE (the proof) is still present. The math hasn't changed. The derivation is still valid. The HOE (the drug report) does not show that the proof *is* wrong; it only shows that Elena's *reliability* in assessing the proof is low. Worsnip suggests that these two pieces of evidence target different objects. The FOE supports $T$. The HOE supports the proposition "My belief in $T$ is unreliable."

  If Elena follows the NAC and drops her belief in $T$, she is effectively letting a probabilistic concern (I might be wrong) override a deductive certainty (the proof is right). If the proof is valid, $T$ is true. By suspending judgment solely because of the drug, Elena is ignoring the actual content of her first-order evidence. The level-splitter argues that the rational response is to "split the levels": Elena should believe $T$ (because the proof is compelling) while simultaneously believing that her belief in $T$ is likely unreliable (because of the drug). She accepts the akrasia to preserve her responsiveness to the first-order evidence.

  **The Verdict: In Defense of Level-Splitting**

  While the Non-Akrasia Constraint offers a tidy, coherent picture of rationality, it fails to account for the normative force of first-order evidence in impairment cases. I argue that the level-splitting view is correct: **Epistemic akrasia is rationally permissible when first-order evidence is decisive and higher-order evidence is merely general.**

  The primary failure of the NAC in cases like Elena's is that it leads to *epistemic timidity* that severs the connection between belief and truth. Consider the nature of Elena's HOE. It is *general* defeaters. It tells her that people in her condition *often* make mistakes. It does not point to a specific error in the proof. If Elena lowers her confidence in $T$, she is not doing so because she found a mistake; she is doing so solely because of a statistical probability of error.

  However, if the proof is indeed valid (as we assume in the setup of these cases to test the intuition), then $T$ is necessarily true. If rationality requires Elena to suspend judgment on a necessary truth simply because she *might* be impaired, then rationality requires her to disconnect from the truth-tracking power of her own reasoning. The NAC prioritizes the *appearance* of rational coherence over the *substance* of evidence responsiveness. It asks Elena to treat her own reasoning as if it were someone else's testimony, rather than engaging with the proof directly.

  Furthermore, the NAC relies on the intuition that akrasia is always self-undermining. But in HOE cases, the akrasia is not a failure of introspection; it is a recognition of a tragic conflict. Elena can say, "I see the proof, and it compels me to believe $T$. I also see the medical report, and it compels me to believe I am unreliable." To force her to drop $T$ is to force her to lie about what the proof tells her. It is better to be akratic (believing $T$ while thinking one shouldn't) than to be evidentially blind (disbelieving $T$ despite the proof).

  This does not mean level-splitting is a license for dogmatism in all contexts. If the HOE were *specific* (e.g., "We found an error in line 4 of your proof"), then the FOE is undermined directly, and akrasia would not arise. But in cases of *general* impairment where the FOE remains intact, the demand to believe in accordance with evidence outweighs the demand for structural coherence.

  **Conclusion**

  The literature on higher-order evidence often treats epistemic akrasia as a disease to be cured. The Non-Akrasia Constraint prescribes a cure: align your beliefs with your higher-order assessments. But as the case of the Fatigued Logician demonstrates, this cure can be worse than the disease. It requires agents to abandon decisive first-order evidence for the sake of structural neatness.

  A robust theory of rationality must acknowledge that the world can put us in situations where our evidence pulls us in incompatible directions. In these tragic cases, we should not sacrifice our grip on the truth to save our coherence. Therefore, the level-splitting view should be adopted: rationality sometimes requires us to be akratic. We should believe what our evidence supports, even if that means believing that our very act of believing is suspect.
