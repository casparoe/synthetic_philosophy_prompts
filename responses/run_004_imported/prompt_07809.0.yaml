answer: |-
  **Title:** The Retrospective Knife: Selective Realism and the Problem of Hindsight

  **Introduction**

  The Pessimistic Meta-Induction (PMI) remains the most formidable obstacle to scientific realism. If the history of science is a graveyard of empirically successful but ontologically false theories, what epistemic warrant do we have for believing our current best theories are any different? The "no miracles" argument suggests realism is the only philosophy that doesn't make the success of science a miracle. The PMI retorts that realism makes the *failure* of past realisms a miracle. In recent decades, the most sophisticated counter-move has been Selective Realism, often dubbed the *divide et impera* strategy. Associated primarily with Philip Kitcher and Stathis Psillos, this strategy argues that we need not commit to discarded theories *in toto*. Rather, we should distinguish between the "working posits" that generated success and the "idle posits" that were merely background baggage.

  This essay evaluates the efficacy of the selective strategy. Specifically, it addresses the charge that the distinction between working and idle posits is drawn only in hindsight, relying on knowledge of which theories survived. Using the pivotal case of Fresnel's wave theory of light and the Poisson-Arago bright spot, I will reconstruct the strongest version of the selective realist defense and the strongest version of the hindsight circularity objection. I will argue that while Selective Realism offers a superior methodology to "wholehearted" realism, it ultimately fails to logically defuse the PMI. Instead, it merely relocates the inductive risk from the level of theories to the level of posits. Crucially, this failure must be distinguished from the structural realist alternative; the selective realist aims to save specific ontological commitments, not merely mathematical relations, and it is precisely this ontological ambition that leaves the strategy vulnerable to the charge of hindsight bias.

  **The Selective Realist Strategy**

  To understand the selective strategy, one must distinguish it from a naive realism that demands commitment to every entity posited by a successful theory. As Stathis Psillos argues in *Scientific Realism: How Science Tracks Truth*, the realist need not be "lazy." A lazy realist commits to everything; a selective realist commits only to what is *essential* for the theory's empirical success.

  The core mechanism of this strategy relies on a distinction between constitutive assumptions and auxiliary assumptions. Constitutive assumptions are those without which the theory could not generate its novel predictions. Auxiliary assumptions are background beliefs that facilitate the derivation but are not strictly responsible for the predictive hit. Kitcher frames this in terms of "reference potential": even if a theory is false, some of its terms may successfully refer to real entities because they play a specific causal-explanatory role that is preserved in successor theories.

  For the selective realist, the PMI fails because it operates at the wrong grain size. It is true that the *theory* of the luminiferous ether was abandoned. It is false that *everything* in Fresnel's optics was false. The selective realist claims there are ahistorical criteria for identifying the "working" parts of a theory at the time of its acceptance. These criteria include the centrality of a posit to the derivation of novel predictions and the independence of the evidence supporting that posit. If a posit is indispensable for a novel prediction, the realist argues, we are warranted in believing that posit latches onto reality, even if the surrounding theoretical framework (the "idle" parts) is later discarded. Thus, the history of science is not a history of total error, but a history of the preservation of working posits amidst the shedding of idle ontology.

  **The Hindsight Circularity Objection**

  The objection, pressed by critics such as Timothy Lyons and echoed by your student, targets the epistemic access to this working/idle distinction. The charge is that the selective realist identifies "working posits" by looking at what survived into current theory. This renders the strategy tautological: a posit is "working" if it is true (or approximately true), and we know it is true because it survived.

  If the criteria for distinguishing working from idle posits are truly ahistorical and available to the scientists *at the time*, the PMI would be blocked. But if the criteria rely on knowing which posits were preserved by future science, the strategy concedes the PMI. It tells us why *past* realists *could have been* realists, but it provides no method for *current* realists to know which of *their* posits are the working ones.

  The case of Fresnel's ether is the testing ground. In 1818, Fresnel predicted the bright spot at the center of the shadow of a circular disk (the Poisson-Arago spot). This was a stunning novel prediction. However, Fresnel's derivation relied heavily on the assumption that light waves propagate through a mechanical, elastic-solid ether. For Fresnel and his contemporaries, the mechanical properties of the ether were not idle background; they were the engine of the prediction. The transverse nature of the waves was explained by the rigidity of the ether.

  The selective realist now claims that the mechanical ether was an "idle" posit and the "working" posit was the wave structure itself (or the electromagnetic field, in the modern view). The objection is: on what basis, available in 1818, could one distinguish the mechanical ether properties as idle? The answer seems to be: none. We only classify the ether as idle because Maxwell and Einstein later showed it was unnecessary. Therefore, the selective realist is using our current knowledge to filter past theories. This confirms the PMI's worry: we cannot know which of our current "essential" posits will be deemed "idle" by future scientists. The induction is not blocked; it is merely pushed down one level. We are no longer asking, "Will this theory be discarded?" but "Will this posit be deemed idle?" The epistemic risk remains identical.

  **Distinguishing Selective from Structural Realism**

  Before adjudicating, it is vital to ensure this critique does not collapse into a defense of Structural Realism (as proposed by John Worrall). Structural Realism handles the Fresnel case by arguing that while the *ontology* (ether) changed, the *mathematical structure* (the wave equations) was preserved. This avoids the hindsight problem by committing only to the structure, which is visibly preserved in the equations.

  Selective Realism, however, makes a bolder claim. Psillos explicitly rejects reducing realism to structure. He wants to maintain that specific *ontological posits* (e.g., the electromagnetic field as a physical entity, not just a mathematical tool) are the "working" parts. The selective realist wants to say the *field* was real, not just the *equations*. This distinction is crucial. If the strategy retreats to "only the math survives," it becomes Structural Realism. To stand as Selective Realism, it must claim we can identify specific *ontological* components of a theory as true, distinct from the mathematical formalism.

  In the Fresnel case, a Structural Realist says, "The equations were right." A Selective Realist says, "The posit of the transverse wave mechanism was right, even though the medium (ether) was wrong." The hindsight objection strikes harder against the Selective Realist because identifying the "transverse wave mechanism" as distinct from the "ether medium" is arguably an artifact of modern theory. For Fresnel, they were inseparable. To separate them requires the hindsight of Maxwellian electrodynamics.

  **Verdict: Relocation, Not Resolution**

  The verdict must be definite: The selective, *divide et impera* strategy **merely relocates the Pessimistic Meta-Induction rather than defusing it.**

  While Selective Realism is a more plausible stance than wholehearted realism, it fails to provide the ahistorical epistemic warrant it promises. The strategy relies on the claim that there are criteria available *at the time of theory acceptance* that identify which posits are responsible for success. However, the Fresnel case demonstrates that the causal-explanatory role of a posit is underdetermined by the empirical success itself.

  Fresnel's theory succeeded. Was it because of the wave nature? The transverse vibration? The elastic solidity of the medium? The mathematical formalism? All of these were woven into a single explanatory fabric. To claim that *only* the wave nature was "working" and the elasticity was "idle" is to impose a modern decomposition on a historical unity. There was no experiment in 1818 that could isolate the wave equation from the ether's mechanical properties. The separation is only possible because we know the ether was discarded.

  Therefore, the Selective Realist cannot tell a current scientist which of her posits are "working." She can only tell a historian which past posits *turned out to be* working. This concedes the core epistemic challenge of the PMI: we lack a "truth meter" for our current theoretical posits. The induction now reads: "Most posits deemed essential by past scientists were later deemed idle by their successors; therefore, the posits we deem essential today will likely be deemed idle by our successors." This is just as damaging as the original PMI.

  **Defending the Verdict Against the "Novel Prediction" Counter-Argument**

  The strongest objection to this verdict comes from Psillos himself. He argues that we *can* identify working posits via their role in **novel predictions**. The argument is that if a posit is indispensable for deriving a *novel* prediction (one not used to construct the theory), it earns realist commitment. In Fresnel's case, the wave posit was indispensable for the bright spot. The specific mechanical properties of the ether, Psillos might argue, were not strictly indispensable for the *mathematical derivation* of the spot, even if Fresnel thought they were.

  This objection fails because it confuses *logical indispensability in reconstruction* with *causal indispensability in discovery*. Yes, we can reconstruct Fresnel's derivation today using wave equations without mentioning elastic solids. But that is a rational reconstruction, not historical reality. For the derivation to be a warrant for realism, the scientists must have had reason to believe the posit was the *cause* of the success.

  If the criterion for "working" is "indispensable for the prediction," then *all* assumptions used in the derivation are, by definition, working posits at that time. Fresnel used the elasticity of the ether to justify the transverse wave equation. Without the elasticity assumption, the transverse wave assumption had no physical grounding in 1818. To say the elasticity was "idle" is to say it wasn't needed for the prediction. But it *was* needed for the justification of the model that made the prediction.

  To claim otherwise is to engage in "beneficial anachronism." We strip away the parts we now know are false (ether) and label them "idle," while keeping the parts we know are true (fields) and label them "working." This is not a method for tracking truth; it is a method for curating history. It protects realism from the PMI only by defining "realist commitment" as "commitment to what survives." But since we cannot know what will survive, the strategy offers no protection for our current commitments.

  **Conclusion**

  The *divide et impera* strategy is the most intelligent response to the Pessimistic Meta-Induction, and it successfully refutes the claim that past scientific realists were irrational for believing in phlogiston or ether. They were rational to believe in the *working parts*, even if they couldn't perfectly distinguish them from the idle parts. However, rationality of past belief does not equate to epistemic security for present belief.

  Because the distinction between working and idle posits relies on a retrospective analysis of what was preserved in successor theories, the strategy cannot guide current theory choice. It transforms the PMI from a *reductio ad absurdum* of realism into a cautionary principle about the fallibility of ontological commitment. But as a logical block to the induction, it fails. It asks us to believe that our current "essential" posits are the true "working" posits, despite the historical record showing that scientists are consistently unable to make that distinction correctly until after the fact. The pessimist's challenge remains: without a God's-eye view of the future, the selective realist cannot know where to draw the line, and thus cannot claim to know which parts of our best theories are true. The induction stands, merely shifted from the death of theories to the retirement of posits.
