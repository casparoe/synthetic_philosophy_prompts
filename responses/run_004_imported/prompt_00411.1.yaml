answer: |-
  This is one of the most persistent and philosophically rich problems in contemporary philosophy of religion. Your intuition is shared by many professional philosophers (such as Robert Adams, William Hasker, and Open Theists): there is a metaphysical "gap" in Molinism regarding Counterfactuals of Creaturely Freedom (CCFs).

  The Molinist wants to have it both ways: they want CCFs to be **true** (so God can know them and plan around them) but **ungrounded in God's will** (so creatures are free). The Grounding Objection argues that you cannot have truth without a truthmaker, and any truthmaker sufficient to make CCFs true prior to creation will inevitably undermine libertarian freedom.

  Here is a sustained argument for why the Grounding Objection succeeds, demonstrating that Molinism fails to reconcile divine sovereignty with libertarian free will because it lacks a coherent ontology for pre-volitional truths.

  ---

  ### 1. The Principle of Truthmaking and Contingent Truths

  To understand why the objection is fatal, we must first establish the **Principle of Truthmaking (PTM)**. While not every philosopher accepts PTM in its strongest form, it is a robust metaphysical intuition: *truths do not float free of reality.* For a proposition to be true, there must be some aspect of reality (a state of affairs, an object, a property, an event) that makes it true.

  *   **Necessary Truths:** "2 + 2 = 4" is true in virtue of the nature of numbers. It doesn't need a physical object to ground it.
  *   **Past Contingent Truths:** "Peter denied Christ in 30 AD" is true. What makes it true? The actual historical event of Peter's denial. The event grounds the truth.
  *   **Future Contingent Truths:** This is where it gets tricky. If I say, "I will eat lunch tomorrow," is that true now?
      *   If **Determinism** is true: Yes, the current state of the universe + laws of nature ground the truth.
      *   If **Libertarianism** is true: No, because the future does not exist yet, and I haven't exercised my will yet. There is nothing *in reality* to make the proposition true.

  Molinism posits a unique category: **Pre-volitional Contingent Truths.** These are propositions about what a free creature *would* do, which are true *before* the creature exists and *before* the creature wills anything.

  **The Argument:**
  1.  Contingent truths require truthmakers (something in reality that accounts for their truth).
  2.  CCFs (e.g., "If Peter were in C, he would freely deny Christ") are contingent truths (Peter could have done otherwise).
  3.  CCFs are true prior to the existence of the creature and prior to any divine decree to create.
  4.  Therefore, there must be a truthmaker for CCFs that exists prior to the creature and prior to God's creative will.
  5.  There is no plausible candidate for this truthmaker that preserves libertarian freedom.

  ### 2. Eliminating the Candidates

  Let's look at the possible candidates for grounding these truths. Molinists must choose one, but each option collapses the system.

  **Candidate A: God's Will or Decree.**
  If God's decision to create or His active will makes the CCF true, then Peter's action is determined by God. If God makes it true that "Peter would deny Christ," then Peter *must* deny Christ. This saves sovereignty but kills libertarian freedom. Molinists reject this (rightly, if they want to claim libertarianism).

  **Candidate B: The Creature's Essence or Nature.**
  Perhaps it is part of "Peter-ness" to deny Christ in circumstance C.
  *   *Problem 1:* Peter doesn't exist yet. An essence without an existent is an abstraction. Can an abstraction ground a contingent action?
  *   *Problem 2:* If Peter's *nature* necessitates the action, is it free? If it is impossible for Peter (given his essence) to do otherwise in C, then he lacks the "power to do otherwise," which is the core of libertarian freedom. It becomes a form of theological determinism disguised as freedom.

  **Candidate C: Nothing (Brute Facts).**
  This is the standard Molinist defense. They argue CCFs are simply *brute, ungrounded truths*. They are true, but nothing *makes* them true. They are *sui generis*.

  This leads us to the crux of the debate. If the Molinist retreats to Candidate C, they must defend the claim that contingent truths about free actions can exist without any ontological grounding. I argue this fails for two reasons: it violates the metaphysics of truth, and it evacuates the meaning of "freedom."

  ### 3. Why the "Brute Fact" Reply Fails

  Prominent Molinists like Alvin Plantinga and William Lane Craig argue that we should not demand a truthmaker for everything. They suggest that CCFs are just part of the "furniture" of logical space. God surveys all possible worlds, sees which CCFs are associated with which worlds, and picks one.

  **Objection 1: The Arbitrariness Problem**
  If CCFs are brute, then their truth is utterly arbitrary. There is no reason *why* "Peter would deny" is true rather than "Peter would stand firm." It is not grounded in Peter's character (he doesn't exist), nor in the circumstances (circumstances don't determine free acts), nor in God.
  If there is no reason why one CCF is true and its opposite is false, then the truth value is essentially random.
  *   *The Consequence:* If the truth is random, God's knowledge is based on a cosmic roll of the dice. But more importantly, **how can this be knowledge?** Knowledge requires justification or correspondence to reality. If there is no reality grounding the proposition, God isn't "knowing" a fact; He is guessing correctly about a brute contingency. Molinism claims to offer *Middle Knowledge*, but brute facts look more like *Middle Guessing*.

  **Objection 2: The "Ontological Free Lunch"**
  Philosopher William Hasker argues that brute CCFs provide an "ontological free lunch." Molinists want the truth of the proposition to do heavy lifting (it allows God to sovereignly plan history) without paying the ontological cost (determinism).
  If the proposition "Peter would freely do X" is true *before* Peter exists, that truth places a constraint on reality. It means that *if* God creates Peter in C, the outcome *must* be X.
  But who established that constraint?
  *   Not God (or He's the author of sin/determiner).
  *   Not Peter (he doesn't exist).
  *   If *no one* established it, then we have a truth that constrains both God and the future creature, which floats in a metaphysical void. This is metaphysically suspicious. It treats propositions as if they have causal or constraining power independent of any being. Propositions are descriptions of reality, not masters of it. To say a proposition constrains God's creative options without being grounded in any being is to reify logic into a deity higher than God.

  ### 4. Why the "Possible Worlds Semantics" Reply Fails

  A second common Molinist reply relies on possible-worlds semantics. They argue: "We don't need a truthmaker in the *actual* world. The CCF is true because in the *possible world* where Peter is in C, he denies Christ. God just knows the structure of all possible worlds."

  **Objection: Confusing Coherence with Truth**
  This reply confuses **logical consistency** with **truth**.
  I can write a story about a character named Peter. In my story (a "possible world"), if Peter is in C, he denies Christ. That is consistent within the story. But is it *true* that "Peter would deny Christ"?
  Only if the character "Peter" corresponds to a real agent with real capacities.
  Molinism claims God uses this knowledge to *actualize* a world. He doesn't just know what is logically consistent; He knows what *would happen*.
  *   If the possible world is just a set of consistent propositions, then the CCF is just a rule of the story.
  *   But if the CCF is a rule of the story, who wrote the story?
      *   If God wrote the story (including Peter's actions), Peter isn't free.
      *   If the story writes itself (brute facts), we return to the arbitrariness problem above.
      *   If Peter wrote the story, he can't, because he doesn't exist.

  The semantics reply works for mathematics (2+2=4 is true in all possible worlds because of the nature of numbers). It does not work for contingent free actions. A "possible world" where a free agent acts is not a static logical structure; it implies a dynamic exercise of will. To say that the truth of that action exists *logically prior* to the agent's existence is to treat the agent's will as a static object that can be inspected before it is turned on. This is a category error.

  ### 5. The "Control" Argument: The Death of Libertarian Freedom

  Even if we grant, for the sake of argument, that brute CCFs are metaphysically possible, they still destroy the *libertarian* freedom Molinism claims to protect. This is the "Control Objection."

  Libertarian freedom requires that the agent is the **ultimate source** of their action. The agent must have the power to determine the truth value of propositions regarding their own actions.
  *   When I freely choose tea over coffee, *I* make the proposition "I chose tea" true.
  *   In Molinism, the proposition "If Peter were in C, he would deny Christ" is true *before* Peter exists.
  *   Therefore, when Peter is created and placed in C, he **cannot make that proposition false.**

  If Peter tries to stand firm, he fails, because the CCF was already true. If he denies Christ, he is merely acting out a script that was true before he existed.
  Molinists reply: "But Peter *could* have done otherwise! If he had done otherwise, the CCF would have been different."
  *   *Response:* This is the "Power to Bring About the Past" problem. For Peter to do otherwise, he would have to change a truth that was established logically prior to his existence.
  *   More critically: **Where does the difference come from?** If the CCF is brute, the difference between "Peter denies" and "Peter stands firm" is not grounded in Peter. It is grounded in a brute fact.
  *   If the truth of the action is not grounded in the agent, the agent is not the author of the action. Peter becomes a vessel through which a pre-existing brute truth is manifested. He is not truly free in the libertarian sense; he is merely the locus where an ungrounded truth becomes actual.

  This reduces libertarian freedom to **luck**. If there is no reason (no ground) why Peter denies rather than stands firm, other than "that's just the true CCF," then Peter's choice is random. It is not determined by God, but it is also not determined by Peter's reasons, character, or will (since those don't ground the pre-volitional truth). It is a random occurrence that God foresees. Randomness is not freedom.

  ### 6. Conclusion: The Metaphysical Vacuum

  The Grounding Objection succeeds because it exposes that Molinism attempts to occupy a metaphysical vacuum.

  1.  **Truth requires grounding.** Contingent truths about actions require an agent or a cause to ground them.
  2.  **Pre-volitional CCFs lack grounding.** They exist before the agent (Peter) and are explicitly not grounded by God (to preserve freedom).
  3.  **Brute facts are insufficient.** Claiming they are brute makes them arbitrary, turns God's knowledge into a guess about random facts, and removes the agent's control over the truth of their own actions.
  4.  **Freedom is compromised.** If the truth of what you will do is fixed before you exist, and you cannot change that truth, you are not the ultimate source of your action. You are acting out a truth you did not write, could not change, and does not stem from your nature.

  Molinism is an elegant attempt to solve the dilemma of sovereignty and freedom. However, elegance is not ontology. By positing truths that have no truthmaker, Molinism asks us to accept a metaphysical miracle: that propositions about free actions can be true without anyone to make them true.

  If you accept the Principle of Truthmaking—that truth must correspond to being—then Molinism cannot stand. You are left with a choice: either God grounds the truth (Determinism/Calvinism), the creature grounds the truth in time (Open Theism/Simple Foreknowledge), or there is no truth to be known yet (Open Theism). Molinism tries to say the creature grounds the truth *before* the creature exists, and that is a bridge too far for coherent metaphysics. Your intuition that these truths are "floating free of anything real" is precisely correct; and if they are floating free of reality, they cannot be the foundation for a robust view of human freedom.
