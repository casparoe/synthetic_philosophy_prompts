answer: |-
  It is a genuine pleasure to engage with a critique grounded in forty years of fieldwork. The vampire bat literature (particularly the foundational work on reciprocal altruism in *Desmodus rotundus*) is the canonical case study for the very mechanisms philosophers are casually invoking when they talk about "reciprocity" and "fairness." If anyone is entitled to be skeptical of "cheap fitness stories" in human ethics, it is someone who has had to rigorously exclude kin selection, harassment avoidance, and mutualism to establish reciprocity in bats.

  Here are my responses to your three specific requests, keeping in mind that you are bringing a biologist's rigor to a philosopher's armchair.

  ### 1. Have you represented Street and the Realists fairly?

  **Broadly, yes, but with one nuance regarding Street's specific premises.**

  You have correctly identified the shared background assumption: both Street (the constructivist/debunker) and Realists like David Enoch or Richard Joyce operate as though there is a robust, explicable causal link between specific selective pressures and specific moral *contents* (e.g., "we value reciprocity because reciprocity enhanced fitness").

  However, Street might push back slightly on the claim that she requires these traits to be *direct adaptations* for their current moral function. Her argument relies on the premise that evolutionary forces *shaped* our evaluative judgments. She allows that this shaping could be indirect. Her dilemma is: "Given that evolution shaped our judgments for fitness, what is the relation to truth?"

  That said, your critique hits the load-bearing wall. For the "coincidence" worry to have teeth, the evolutionary explanation must be specific enough to explain why we have *these* values rather than *those* values. If "fairness" is a spandrel of general intelligence, or an exaptation of disgust sensitivity, the link between "fitness" and "the content of fairness" becomes attenuated. If the link is attenuated, the claim that it would be a "miracle" for those beliefs to align with independent truth loses its force.

  So, while Street uses broader language ("shaped by"), the *work* her argument does relies on the adaptationist assumption you are flagging. You have not oversimplified the philosophical stakes; you have tightened the biological screws on them.

  ### 2. Has this adaptationist assumption been addressed in the literature?

  Yes, but it remains a minority critique, and you would be joining a specific, ongoing conversation rather than walking into an empty room. There are three key areas of literature you should consult:

  **A. The "Oversimplified Science" Critique (William FitzPatrick)**
  The philosopher who has engaged most directly with your exact objection is **William FitzPatrick**. In his paper *"Debunking Evolutionary Debunking of Ethical Realism"* (2014) and subsequent work, he argues that evolutionary debunking arguments (EDAs) rely on "folk evolutionary psychology." He explicitly contends that debunkers assume a direct adaptationist link between fitness and moral content that is not supported by the science. He argues that once we acknowledge the complexity of gene-culture co-evolution and the possibility of traits being by-products, the debunking argument loses its probabilistic force. **This is your closest ally.**

  **B. The Adaptationist Defense (Richard Joyce)**
  To understand the target you are aiming at, you should look at **Richard Joyce's** *The Evolution of Morality* (2006). Joyce is perhaps the most rigorous defender of the claim that moral dispositions are indeed direct adaptations. He anticipates the "spandrel" objection but argues that the specificity of moral emotions (like the specific anger at *cheaters* vs. general frustration) suggests a targeted adaptation. Reading Joyce will help you sharpen your counter-argument: does the "fairness psychology" really show the specificity required for adaptation, or is it a general-purpose norm psychology co-opted for fairness?

  **C. The "Moral Capacity" vs. "Moral Content" Distinction (Ron Mallon & Stephen Stich)**
  Earlier work by **Mallon and Stich** (e.g., *"Morality in the Age of Cognitive Science"*) distinguishes between the evolution of the *capacity* for normative thinking (which is likely an adaptation) and the specific *norms* we hold (which may be cultural or by-products). If the capacity is the adaptation but the content is variable, Street's dilemma weakens significantly.

  **D. Biological Nuance (Edouard Machery)**
  Philosopher **Edouard Machery** (e.g., *"Morality and Evolutionary Biology"* in the SEP) is another excellent resource. He is well-versed in the biological literature and frequently cautions philosophers against assuming that complex social behaviors are simple adaptations.

  ### 3. Does this weaken the Debunker more than the Realist?

  This is the question that keeps you up at night, and my assessment is: **Yes, it disproportionately weakens the Debunker's "Coincidence" Claim.**

  Here is why:

  **The Debunker's Burden:**
  Street's dilemma forces the Realist to explain why fitness-tracking and truth-tracking would align. The force of this challenge depends on the premise that our moral faculties were tuned *solely* or *primarily* for fitness. If the "fairness" module is a spandrel or a by-product of general reasoning, then evolution did not necessarily tune it *against* truth; it just didn't tune it *for* fitness directly.
  If the trait is not a direct adaptation for social coordination, the "adaptive link" story becomes a "black box." If the black box is opaque, the Debunker cannot confidently assert that the output (moral belief) is unlikely to match reality. The "coincidence" is only miraculous if we know the machine was built to ignore reality. If we don't know what the machine was built for (or if it's a by-product), we can't calculate the odds of coincidence.

  **The Realist's Opportunity:**
  This does not automatically prove Realism, but it opens a door for a "Third Factor" explanation that is more plausible. For example, if "normative reasoning" is an adaptation for planning and coordination (general), and moral truths are truths about what agents have reason to do, the alignment is less coincidental.
  More importantly, if the specific content of "fairness" is not hardwired by selection but is a cultural elaboration of a general capacity, then the Realist can argue that *rational reflection* (not evolution) is what brought us closer to moral truth. This allows the Realist to accept the evolutionary genealogy without accepting the evolutionary *determination* of moral content.

  **The Verdict on the Dilemma:**
  Your objection suggests the Dilemma is a **False Dichotomy** resting on a **Just-So Story**.
  1.  **Horn 1 (No relation to truth):** Requires confidence that evolution determined content for fitness. (Weakened by your critique).
  2.  **Horn 2 (Relation to truth):** Requires an explanation of the link. (Remains difficult, but less urgent if Horn 1 is weakened).

  If the biological premise is "thin," the Dilemma collapses into a simple demand for evidence: "Show us the selection differential." Since neither side can produce that for human moral psychology, the debate shifts from a metaphysical trap to an empirical question.

  ### Recommendation for your Group

  Do not worry about embarrassing yourself regarding Parfit. Parfit was a master of conceptual analysis, but he was not a biologist. Your group likely contains people who can parse the *Logic* of Street's argument, but they almost certainly lack the expertise to evaluate the *Premise* of Street's argument.

  You are not reinventing an objection; you are applying the **Gould & Lewontin** critique to metaethics in a way that philosophers like FitzPatrick have advocated for but cannot substantiate with field data.

  **My advice for the presentation:**
  1.  **Lead with the Bats:** Briefly describe the evidentiary bar required to prove reciprocal altruism in bats (excluding kinship, etc.). Use this to illustrate the "cheapness" of the human adaptationist stories.
  2.  **Cite FitzPatrick:** Acknowledge that philosophers have worried about this, but emphasize that the *biological* weight of the objection is often underappreciated.
  3.  **Focus on the "Coincidence":** Argue that without a proven adaptationist link, the claim that moral truth would be a "coincidence" is statistically unfounded.

  You are standing on solid ground. The "Darwinian Dilemma" is a powerful philosophical tool, but like any tool, it breaks if the material it is applied to is not what the designer assumed. You have shown the material is different.

  Good luck with the reading group. I suspect you will not be the one embarrassed; you may well be the one teaching them.
