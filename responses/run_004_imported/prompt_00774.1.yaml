      *   **Constraint:** Do *not* sit on the fence ("good points on both sides"). Pick a position and defend it.
      *   **Key Content:** Address SCA, Finks, Masks, Lewis's intrinsic fix, and the ultimate ontological status of dispositions (reducible vs. primitive).

  2.  **Determine the Position:**
      *   The prompt asks me to pick a side.
      *   *Option A (Sam's side):* Dispositions are fictions. (Hard to defend without going full Humean or Eliminativist, might be too radical for a high school context).
