answer: |-
  Here are ten interview questions designed for your audience and guest. They are sequenced to progressively constrain the "pattern versus history" defense, moving from ideal theory to non-ideal reality, ending with a dilemma where the distinction collapses.

  ### Part 1: The Wilt Chamberlain Argument & Cohen's Time-Slice Critique
  *Goal: Force a concession that the objection isn't to "patterns" per se, but to the specific mechanism of maintenance, undermining the idea that "history" is the only alternative.*

  **1.** Your book defends the Wilt Chamberlain example as the knockout punch against patterned principles. But G.A. Cohen's specific reply wasn't that we should interfere with the *transaction* between Wilt and the fans. He suggested a periodic, lump-sum redistribution of the *stock* after the fact. In this model, the history of voluntary exchange remains untouched; only the final distribution is reset before the next round. If the history of acquisition remains pristine, why does resetting the stock violate the entitlement theory any less than forbidding the transaction would?

  **2. (Follow-up)**
  *Anticipated Answer:* She will likely argue that knowing the reset is coming interferes with Wilt's future liberty or planning, effectively taxing his potential labor.
  *Question:* If the interference lies in the *expectation* of future taxation rather than the touch on past holdings, doesn't that mean your objection is actually about the stability of expectations rather than the sanctity of history? And if stability of expectations is the value, couldn't a predictable, rule-based patterned redistribution satisfy that just as well as a property regime where absolute titles are subject to market volatility?

  ### Part 2: The Lockean Proviso & The Baseline Problem
  *Goal: Show that the "historical" process is actually constrained by an end-state condition (the proviso), making the theory a hybrid rather than a pure historical account.*

  **3.** Let's move to original acquisition. You rely on the Lockean proviso: appropriation is valid provided "no one is worse off than they would have been in the state of nature." Critics argue that because a property system generates massive productivity gains, almost *any* appropriation passes this test, even if it leaves non-appropriators with a tiny fraction of the surplus compared to the appropriator. Are you committed to the view that a land grab is just even if the appropriator captures 99% of the cooperative surplus, provided the non-appropriator is still 1% better off than a hunter-gatherer?

  **4. (Follow-up)**
  *Anticipated Answer:* She will likely defend the "state of nature" as the only non-arbitrary baseline, arguing we aren't owed a share of the surplus, only non-impoverishment.
  *Question:* But if the justification for that baseline is that it's the only one that doesn't presuppose a claim to the resource, aren't you implicitly admitting that the *only* reason we accept the historical acquisition is because it meets a specific welfare outcome? If the proviso were violated, the history wouldn't matter. Doesn't that make the proviso a patterned constraint that trumps the historical process?

  ### Part 3: Self-Ownership vs. Joint Ownership of the World
  *Goal: Challenge the link between internal sovereignty and external monopoly, suggesting the "history" of appropriation requires a prior agreement on the status of the external world.*

  **5.** A common move in your book is to treat self-ownership as the axiom from which external property rights flow. But Cohen points out that self-ownership is compatible with the external world being *jointly owned*. If the world starts as jointly owned, my labor on a plot of land doesn't give me exclusive rights without your consent. Why is the "first grab" historical baseline more natural than the "joint ownership" baseline? Isn't choosing the first-grab baseline itself a choice for a specific distributional starting point?

  **6. (Follow-up)**
  *Anticipated Answer:* She will likely argue that joint ownership gives everyone a veto power over everyone else's action, paralyzing agency and violating self-ownership.
  *Question:* If the rejection of joint ownership is based on the *consequences* for agency—specifically, that it creates a distribution of veto power that is too restrictive—aren't you justifying your historical principle of appropriation based on the *pattern of power* it produces? It seems you're rejecting joint ownership because it yields a distribution of control you find unacceptable, which looks suspiciously like a patterned objection.

  ### Part 4: The Principle of Rectification
  *Goal: Demonstrate that in the non-ideal world, "history" is unknowable, forcing the theory to rely on counterfactual models that mimic patterned distributions.*

  **7.** In the real world, very few holdings have a clean causal history free of force or fraud. Your theory relies on the principle of rectification to correct these injustices. But to rectify, we need to know what *would* have happened had the injustice not occurred. Given the complexity of history, isn't calculating rectification essentially a modeling exercise where we simulate a "just" distribution based on counterfactuals?

  **8. (Follow-up)**
  *Anticipated Answer:* She will likely concede we can't know the exact counterfactual but argue we must do our best to approximate the historical truth rather than aiming for an end-state.
  *Question:* But if we are approximating a counterfactual history using aggregate data and statistical models, how is that operationally distinct from aiming for a patterned target? If the "best estimate" of a just historical distribution converges on, say, a specific Gini coefficient or wealth floor, what work is the "history" label doing other than obscuring the fact that you are implementing a pattern by another name?

  ### Part 5: The Collapse of the Distinction (Bridging & Closing)
  *Goal: Remove the ability to retreat to the distinction entirely by presenting a scenario where history is silent.*

  **9.** To build on that: Imagine a society where all historical records were destroyed in a catastrophe, but the institutions of property remained. The Entitlement Theory requires us to respect the current holdings *unless* we have evidence of injustice. But if we know statistically that a significant percentage of holdings *must* be tainted, even if we don't know which ones, does the burden of proof lie with the holder to prove clean title, or with the challenger to prove theft? If you say the holder keeps it, aren't you prioritizing stability (a pattern) over truth (history)?

  **10. (The Closer)**
  *Context:* This question removes the "history" escape hatch entirely.
  *Question:* We've discussed how the Lockean proviso imposes a welfare constraint, how rectification requires counterfactual modeling, and how lost records force us to rely on statistical probabilities. At each step, the "pure history" of the entitlement theory seems to require patterned assumptions to function in the real world. So, my final question is this: If the practical policy prescriptions of a sophisticated entitlement theory converge with those of a sophisticated egalitarian theory, **what is the normative cash value of the "pattern versus history" distinction?** Is it a guide for action, or merely a retrospective justification for whatever distribution the market happens to produce?
