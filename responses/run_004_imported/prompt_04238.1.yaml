  **Move 1 (Marta): +1**
  This is the position of scientific integrity and ontological specificity. Marta is correct that the singular proposition ("Will *this* fault rupture?") is the actual question of interest. Reporting the raw epistemic uncertainty prevents false precision. However, the move is scored only +1 because, in the context of engineering hazard analysis, presenting an uncertainty range that spans the entire design life of infrastructure (400–900 years vs. 30-year code) can be functionally equivalent to providing no information at all.

  **Move 2 (Owen): +1**
  Owen correctly identifies the variance-bias tradeoff. By widening the reference class, he reduces epistemic uncertainty (variance) at the cost of potential bias (if the Kestrel Ridge is truly unique). For the stated goal (feeding building codes), this is the standard Pragmatist move. It scores +1 rather than +2 because he initially frames it as "better science" rather than "better for decision-making," which glosses over the philosophical cost of changing the question from "this fault" to "this class."

  **Move 3 (Marta): +2**
  This is the strongest philosophical move in the debate. Marta explicitly identifies the indeterminacy of the reference class. As Hájek emphasizes, there are infinite ways to classify "faults like this one" (slip rate, length, crustal thickness, etc.), and each yields a different probability. By pointing out that Owen's "regional model" hides subjective similarity metrics, she exposes the unacknowledged prior in his frequentist approach.

  **Move 4 (Owen): +2**
  Owen parries perfectly by attacking the assumption of exchangeability in time. Marta's approach relies on a renewal model (past ruptures are independent draws from a stable distribution). Owen correctly notes that this is just as substantive an assumption as his spatial grouping, perhaps more so given known physics (Coulomb stress transfer, clustering). He successfully argues that "singular" data does not escape model dependence; it merely shifts the assumption from spatial similarity to temporal stationarity.

  **Move 5 (Marta): 0**
  Marta attempts to claim the high ground on falsifiability ("testable against more data from that same object"). This is a draw at best. While ontologically cleaner, it is pragmatically weak: with a 400–900 year recurrence, "testing" her assumption requires centuries of observation, whereas Owen's regional model can be validated against existing data from other faults *now*. Her claim to superior testability holds in principle but fails on human timescales, neutralizing the advantage she gained in Move 3.

  ***

  **What they missed (The "Move 6" that wasn't played):**

  1.  **Logic Trees / Bayesian Model Averaging:** Modern PSHA (Probabilistic Seismic Hazard Analysis) rarely forces a binary choice between single-fault and regional models. The standard solution is a logic tree that weights both branches (and multiple similarity metrics) to capture the epistemic uncertainty explicitly. They argued over which model was *true*, rather than how to weight the *uncertainty* between them.
  2.  **Aleatory vs. Epistemic Uncertainty:** The argument conflates these. Marta is highlighting *epistemic* uncertainty (we don't know the fault's true behavior). Owen is trying to convert that into *aleatory* uncertainty (the fault behaves like a random draw from a population). A proper hazard report should distinguish these, as they are treated differently in risk decision-making.
  3.  **Decision Theory:** The ultimate goal is building codes, which is a decision problem, not a truth problem. The "correct" probability depends on the loss function (cost of over-building vs. cost of collapse). Neither invoked utility; they argued over probability as if it were a property of the world rather than an input to a policy choice.
