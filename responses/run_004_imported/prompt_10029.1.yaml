prompt: |-
  So I fell down a wikipedia hole last week on 'inference to the best explanation' as a philosophy-of-science thing, and it immediatly reminded me of how we run incident postmortems at work: prod breaks, we brainstorm a handful of hypotheses, do a couple rounds of the whole 'five whys' thing, and whichever hypothesis best explains the logs and symptoms becomes The Root Cause in the writeup. Except every few months we get a repeat incident and realize the 'root cause' from last time wasn't actually right, it just happened to fit whatever we were staring at that day. I dont have any philosophy background at all, so can you walk me through the most important implications of inference to the best explanation, as philosophers actually critique the idea, for how a team should be doing root-causing? Skip the textbook definition, I want the real substantive problems people have raised with reasoning this way.
