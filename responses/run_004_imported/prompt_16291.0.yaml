  We need to discuss how strictly to penalize the confusion between rotational invariance and the full Euclidean/Scale group invariance in Part (c). I have deducted 50% on this subsection because in a cross-listed stats/phil course, the specific symmetry group Jaynes invokes is the technical core of his solution. If we grade leniently on this, we risk validating the misconception that Jaynes's solution rests on rotation alone (which it cannot, as rotation does not distinguish between the three methods). I suggest we agree on whether "knowing Jaynes picks Method 2" is sufficient for partial credit, or if misidentifying the invariance group is a fundamental error. I have assigned an A- (16/20) to reflect strong performance on the probability and general philosophy, penalized for the technical misunderstanding of the Jaynes reading.
