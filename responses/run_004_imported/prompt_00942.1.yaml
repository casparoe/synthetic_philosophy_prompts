answer: |-
  The hearing room smelled of ozone and stale coffee, the kind of sterile scent that clings to institutions designed to measure human failure. Elias sat with his hands folded on the table. On his left wrist, the black band of the Damocles Implant glowed a steady, passive amber.

  Across from him sat Director Vance and Dr. Chen. Vance was looking at a tablet; Chen was looking at Elias.

  "The incident at the transport hub," Vance said, not looking up. "You shoved a man. Broke his nose. The Damocles did not intervene. Is that correct?"

  "That's correct," Elias said. His voice was level. "I saw him. I felt the anger. I threw the punch. The implant stayed quiet."

  "Because you acted within parameters," Vance said. "You chose the violence freely. Which means you are in violation of parole. Free will is not a get-out-of-jail card, Elias."

  "My lawyer argues the opposite," Elias said. "She says that because the Damocles *could* have stopped me, but didn't, the action is tainted. She's arguing coercion by presence."

  Vance finally looked up, smiling thinly. "That's the standard hard-determinism defense. It fails because the counterfactual never actualized. You weren't coerced. You're responsible." He tapped the tablet. "But that was before we ran the deep-log audit."

  Elias felt a cold prickle at the base of his neck. "Deep-log?"

  Dr. Chen leaned forward. She was the neuro-ethicist, the one who actually understood the code. "The Damocles doesn't just monitor actions, Elias. It monitors pre-volitional spikes. It looks for the neural signature of a decision *before* the motor cortex fires. If it sees a signature that leads to a violation, it intervenes. Micro-shock. Overrides the signal."

  "I know how it works," Elias said. "It didn't shock me."

  "No," Chen said. "It didn't. But it logged a spike."

  She slid a physical printout across the table. It was a waveform graph. Most of it was flat green line. But right before the timestamp of the punch, there was a jagged blue blip. It lasted maybe forty milliseconds.

  "This," Chen said, tapping the blue blip, "is a Pre-Intervention Marker. For forty milliseconds, your neural pattern matched the profile for *aborting* the action. You started to choose *not* to punch him."

  Elias stared at the graph. "I don't remember that."

  "You wouldn't. It's sub-cognitive," Chen said. "But here is the philosophical wrinkle, Elias. The Damocles is a Frankfurt Device. It is designed to ensure you do not do otherwise. But for it to know *when* to ensure that, it has to detect a sign that you *might* do otherwise."

  "The flicker," Elias said. He'd read the briefs.

  "Exactly," Vance said. "If you were truly determined to punch him—if there was no possible world where you didn't punch him—there would be no spike. The spike proves alternate possibilities existed. You *could* have done otherwise. You started to, then you corrected course."

  "So I'm more free?" Elias asked.

  "You're more *culpable*," Vance corrected. "If the device removes alternate possibilities, and the log shows alternate possibilities existed, then the device didn't remove them. You had the freedom to stop. You saw the path of non-violence for forty milliseconds, and you walked away from it. That makes this a premeditated act of will, not a lapse."

  Elias pushed the paper back. "That's not what the flicker means."

  Chen raised an eyebrow. "Enlighten us."

  "The spike isn't a choice," Elias said. "It's a twitch. It's the neural equivalent of blushing. Your machine is watching for a blush to decide when to shoot me. Just because I blushed doesn't mean I chose to blush. And just because I blushed before I punched doesn't mean I could have *not* punched."

  "But the correlation—" Vance started.

  "Correlation isn't agency," Elias snapped. "Think about the mechanics. If I had *actually* chosen not to punch, the machine would have fired. It would have forced my hand. So the only reason the machine didn't fire is because I *didn't* choose otherwise. The spike is just noise. It's the sound of the machine checking its own gun."

  Chen looked at Vance, then back to Elias. "So you're arguing the flicker is irrelevant?"

  "I'm arguing it's a trap," Elias said. "You want to use the spike to say I had a choice. But if I had followed that spike, I wouldn't have been choosing. I would have been overridden. The only way I can be 'free' in this scenario is if the spike is meaningless. If the spike is meaningful, then the machine is the one deciding what counts as a choice."

  He leaned in. "If that forty milliseconds is my 'freedom,' then I'm only free when I'm about to be stopped. If I go straight for the punch, no spike, no flicker... am I a puppet then? Or am I only a puppet when the log shows blue?"

  Vance frowned, looking at the tablet. "The verdict stands on the action, Elias. You punched. You had the capacity to not punch, evidenced by the neural capability to initiate an abort sequence."

  "The capacity to initiate, not the capacity to complete," Elias said. "That's the whole point. I could start to stop, but I couldn't *finish* stopping. Because if I tried to finish, you'd zap me. So how is that a genuine alternative possibility? It's a door that opens three inches and then is welded shut."

  "It opened enough," Vance said. "You walked away from it."

  "Did I?" Elias tapped the graph. "Or did the momentum of the anger just drown out the twitch? If I'm driving a car and the steering wheel locks up, but I wiggle it one degree before it jams, did I steer? Or did I just feel the lock?"

  Chen was silent for a long moment. She picked up a pen and twirled it. "This is why we don't like releasing the deep-logs. They turn a legal hearing into a metaphysics seminar."

  "I just want to know," Elias said, his voice dropping. "If that spike is the only proof I have of freedom, then I'm not free. It's just a ghost in the machine. But if you say I'm responsible because I acted on my own desires, ignoring the spike... then you admit the device is irrelevant. You can't have it both ways. You can't say the device guarantees safety *and* that I'm fully responsible for bypassing it, when the only proof I bypassed it is a glitch the device itself defined."

  Vance stood up, gathering his files. "The Board will deliberate. The presence of the marker suggests high-risk volition. It suggests you fought your own conditioning and won."

  "I didn't win anything," Elias said. "I just didn't get zapped."

  "We'll be in touch," Vance said.

  They left him alone in the room. The amber light on his wrist pulsed once, a slow, rhythmic heartbeat.

  Elias looked at the printout. The blue spike looked like a mountain range viewed from an airplane. Tiny. Insignificant.

  He traced the line with his finger. If he had followed that line, if the blue had kept going up instead of crashing down into the red of the punch, the wrist would have burned. He would have stood there, arm frozen, while the man walked away. He would have been innocent. He would have been safe.

  But he wouldn't have been the one standing there.

  He looked at the flat green line after the spike. That was him. That was his will. Uninterrupted. Unforced.

  But was it free?

  Elias closed his hand into a fist. He held it there for five seconds. The implant stayed amber. He relaxed his hand.

  He didn't know if the forty milliseconds mattered. He didn't know if the blush proved the shame. He only knew that the log existed, and that somewhere in that jagged blue line was the only proof he had that he was anything other than the machine's shadow.

  He left the paper on the table. The light on his wrist pulsed again, waiting for a sign.
