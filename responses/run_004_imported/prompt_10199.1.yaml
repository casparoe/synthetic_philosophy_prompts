answer: |-
  **Setting:** *A private room in a high-stakes club. A green felt table sits between two economists, ELENA and MARCUS. A bookmaker stands silently in the background, ready to flip a biased coin. On the table: a single stack of chips representing their entire bankroll.*

  **The Bet:** *Stake any fraction $f$ of current bankroll. Flip coin. Heads (60%): Bankroll becomes $W \times (1 + f)$. Tails (40%): Bankroll becomes $W \times (1 - f)$. The game repeats indefinitely, rounds occurring once per minute.*

  **ELENA:** (Pushing the entire stack of chips into the center) All in.

  **MARCUS:** (Gently pulling the stack back) Elena, stop. You're treating this as a one-shot decision. We just agreed this game repeats. If you stake 100% of your bankroll, the first time that coin lands tails—and it will, eventually, with probability one—you are at zero. An absorbing state. You don't get to play the next round.

  **ELENA:** I know the probability of ruin approaches one as $t \to \infty$, Marcus. But I'm not maximizing the probability of survival; I'm maximizing expected terminal wealth. Look at the arithmetic. If I bet everything, my expected return per round is $0.6 \times 2 + 0.4 \times 0 = 1.2$. My wealth grows by 20% in expectation every single round. If I play $T$ rounds, my expected wealth is $W_0 \times (1.2)^T$. That is astronomically higher than any fractional betting strategy.

  **MARCUS:** That expectation is a mirage. It's an ensemble average. You are calculating the average wealth of a billion parallel copies of Elena playing in a billion parallel universes. In most of those universes, you're broke. In a vanishingly small few, you have more money than exists in the universe. The average is driven by the outliers. But *you* are a single agent living through *time*. You care about the time-average growth rate. For the all-in strategy, the time-average growth rate is $\exp(0.6 \ln 2 + 0.4 \ln 0)$, which is zero. Actually, it's undefined because of the ruin. You are confusing the expectation of the wealth with the wealth of the expectation.

  **ELENA:** I'm not confusing anything. I'm stating a preference. Expected Utility Theory tells me that if I choose to maximize $E[W_T]$, I am implicitly revealing a linear utility function over wealth. If I want to bet big, it's because I value the upside more than I fear the downside. To say I *must* bet the Kelly fraction—20%—is to say I *must* have logarithmic utility. But utility is subjective. Maybe I have a debt due in three rounds that requires a massive payout. Maybe I'm risk-neutral. Why is your time-average growth rate a normative law rather than just another utility function?

  **MARCUS:** Because it's not about taste; it's about the structure of the dynamic. In an additive world, ensemble and time averages converge. Ergodicity holds. But this is multiplicative. Wealth compounds. When you go all-in, you are effectively opting out of the future. You're treating a dynamic process as a static snapshot. If you care about your future self at all—if you view your economic life as a trajectory through time rather than a single consumption event—then maximizing the geometric mean isn't a preference. It's the condition for remaining in the game. It's the correction of a mathematical error in how you're framing the expectation.

  **ELENA:** That's a strong claim. "Mathematical error." Let's test it. Suppose I don't play alone. Suppose I can sell shares of my bet to other investors. I take the all-in position, but I hedge it by selling 99% of the upside to a syndicate in exchange for a fixed fee. Now, *my* personal exposure is small, but the *project* I'm undertaking is all-in. The arithmetic expected value of the project is still positive. The market prices assets based on ensemble averages—risk-neutral pricing, Marcus. If I can diversify across independent bets or sell the risk, the arithmetic mean becomes the relevant price signal again. Your ergodicity argument only holds if I am forced to hold the undiversified risk myself, forever.

  **MARCUS:** Ah, the "market completion" defense. It's the standard escape hatch. But look at the conditions you just invoked. You need a liquid market, counterparties willing to take the other side, and the ability to fractionalize the bet perfectly. In the real world—especially in portfolio choice or business investment—frictions exist. Capital constraints, transaction costs, asymmetric information. When you can't fully hedge, when you are stuck with the specific trajectory of your own firm or your own life savings, the ensemble argument collapses. You can't sell shares of your own ruin. If you go bust, you can't call up the syndicate for a bailout. The absorbing state is personal.

  **ELENA:** Fair enough for an isolated agent. But even then, you're assuming an infinite horizon. What if my horizon is finite? Say, I need to retire in ten years. If I bet Kelly, I maximize the *median* outcome. But if I bet higher than Kelly—say, half-bankroll—I lower the median, yes, but I increase the upper quantile. If my utility function has a kink—say, I need \$10 million to secure my retirement, and \$9 million is useless to me—then Kelly is actually suboptimal. I need to swing for the fences. Expected Utility Theory handles that beautifully with a threshold utility function. Your geometric rationality just says "don't swing too hard," regardless of my needs.

  **MARCUS:** If you have a specific liability, that's a constraint, not a refutation of the growth criterion. But be careful. You're describing a "goal-reaching" problem, which is valid. But you're presenting it as if it justifies the general principle of maximizing arithmetic returns. It doesn't. It justifies a specific deviation for a specific target. The moment you clear that target, if you keep playing with the same aggressive strategy, you're inviting ruin for no reason.
  Furthermore, consider the "finite horizon" argument. Even with $T=10$, if you reinvest winnings, the distribution of outcomes becomes incredibly skewed. With all-in betting, your *expected* wealth after 10 rounds is huge, but your *most likely* wealth is zero. Is it rational to optimize for a mean that you have a 99% chance of underperforming? That's not risk preference; that's delusion about the distribution.

  **ELENA:** It's not delusion if I acknowledge the distribution! I know I'll likely go bust. I'm saying that the 1% chance of becoming a billionaire is worth the 99% chance of zero, given my utility function. You keep trying to tell me I'm wrong about the math. I'm not. I'm telling you that you're trying to derive an "ought" from an "is." You see multiplicative dynamics, so you say one *ought* to maximize geometric growth. I say the dynamics are just the constraint set. The objective function comes from the agent. If the agent prefers the lottery ticket, let them buy it. Calling it an "error" is paternalistic.

  **MARCUS:** It's not paternalistic if the agent claims they want to maximize wealth *over time*, but uses a metric that guarantees wealth destruction. It's like someone saying they want to drive from New York to Los Angeles, but they insist on driving off a cliff because the straight-line distance is shorter. You're optimizing for "expected wealth" as if it were a physical quantity that accumulates. It doesn't. Wealth is a path variable.
  Here is the crux: If you and I start with the same bankroll, and you bet all-in while I bet Kelly, after a hundred rounds, I will almost certainly have more money than you. Not in expectation—in reality. In the single world we actually inhabit. If your decision rule systematically underperforms mine in the single realized trajectory of the universe, in what sense is your rule "rational"?

  **ELENA:** Because rationality is about consistency with axioms, not necessarily survival of the fittest in one realization. I satisfied the Von Neumann-Morgenstern axioms. I maximized my expected utility. That I got unlucky is a realization error, not a decision error.
  But let's grant your point about the "single world." Suppose we run this experiment. You bet 20%, I bet 100%. On the first flip, I get Heads. I double up. You grow by 20%. I'm ahead. Second flip, Heads. I'm up 4x. You're up 44%. I'm crushing you. For the first few rounds, the arithmetic maximizer dominates the geometric maximizer. It's only the long tail of the distribution that kills me. So, if I have a short horizon, or if I can cash out after a lucky streak, my strategy dominates. Your strategy is defensive. It's designed for the worst-case typical path. Mine is designed for the best-case expectation.

  **MARCUS:** But you can't *know* when to cash out. To cash out, you need to predict the future sequence of coin flips. If you stay in until the ruinous tail hits, you lose everything. The Kelly criterion is the unique strategy that maximizes the rate at which you reach any high wealth target *without* risking ruin. It's the fastest safe path. Your strategy is faster only if you get lucky, but it relies on luck. Mine relies on the law of large numbers applied to log-wealth.
  Think about it this way: If you believe your all-in strategy is superior, would you sell me your future winnings for a fixed sum? If you truly believe $E[W_T]$ is the right metric, you should value your position at the expected value. I'll buy it from you for the Kelly expected value.

  **ELENA:** (Pauses) That's the St. Petersburg paradox all over again. I wouldn't sell it for the Kelly value because I value the upside potential more. But I see where you're going. You're trying to force a market price on my decision to show it's overvalued.
  Look, Marcus. I think we are talking past each other on the definition of "rational." You define rationality as robustness of the trajectory in a non-ergodic system. I define it as coherence of preferences under uncertainty.
  However... I will concede this. If the agent cannot specify a finite horizon, and cannot diversify the risk across parallel bets, and claims to want to "grow wealth" indefinitely, then the arithmetic expectation is indeed a misleading guide. It values outcomes that will almost never happen more than outcomes that will.

  **MARCUS:** And I will concede this: If the agent has a specific, finite utility threshold—like paying off a mortgage or funding a specific project—and the Kelly strategy makes that threshold unreachable within the timeframe, then deviating from Kelly is not an "error." It's a constrained optimization. But that deviation should be framed as "I am accepting a high probability of ruin to hit a target," not "I am maximizing expected value." The latter implies the ruin doesn't matter. It does.

  **ELENA:** (Nods, pulling half the stack back) So, we agree that for indefinite, reinvested growth without external hedging, the geometric mean is the physically relevant metric. But we disagree on whether that makes log-utility a "law" or just the "survival strategy."

  **MARCUS:** In a multiplicative world, survival *is* the law. Everything else is just a way of describing how you plan to exit the game. (He gestures to the chips) So, are we playing?

  **ELENA:** (Slides 20% of the stack forward) Let's see if your time average holds up to my variance. Dealer, flip.

  **MARCUS:** (Smiling) After you. In the long run, I'm not betting against you. I'm betting on the math.

  *The dealer flips the coin. It lands Heads.*
