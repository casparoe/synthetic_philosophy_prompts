  **DIOCESE OF [REDACTED]**
  **HISTORICAL COMMISSION FOR THE CAUSE OF BEATIFICATION**
  **SERVANT OF GOD: SISTER AGNIESZKA RADOMSKA**

  **INTERNAL MEMORANDUM**
  **TO:** The Consultors of the Diocesan Historical Commission
  **FROM:** Fr. Tomasz Nowak, J.C.D., Postulator & Commission Chair
  **DATE:** 14 October 2023
  **SUBJECT:** Recommendation Regarding Newly Discovered Correspondence (1943–1944) and the Vote on the *Positio*
  **CLASSIFICATION:** STRICTLY CONFIDENTIAL / SUB SECRETO

  **1. PURPOSE**

  This memorandum serves as my formal recommendation regarding the disposition of the *positio* for the Servant of God, Sister Agnieszka Radomska, in light of the correspondence recovered from the convent archives on 10 October. Tomorrow, we are scheduled to vote on whether to forward the cause to the Congregation for the Causes of Saints. The new evidence necessitates a departure from the standard procedural formality. We are no longer merely verifying facts; we are adjudicating a conflict between two fundamental goods of the Church: the vindication of heroic charity and the integrity of moral doctrine.

  **2. THE EVIDENCE**

  The recovered letters (Files 44-A through 44-F) confirm that Sister Agnieszka did not merely withhold information from the *Ordnungspolizei* regarding the Jewish children hidden in the convent wing. She actively fabricated evidence. She issued baptismal certificates under false names. She authored letters to civil authorities citing a non-existent quarantine of scarlet fever. She assigned false parentage to minors.

  By any civil or canonical definition, these are falsehoods. They were *locutio contra mentem* (speech against the mind). She intended to deceive, and the deception was successful. There is no evidence in the files that she sought confession for these specific acts during the war, though her general confessional practice was scrupulous.

  **3. THE THEOLOGICAL OBJECTION**

  Consultors Kowalski and Varga have formally objected to forwarding the cause. Their position rests on the settled moral teaching of the Church, articulated by Augustine in *Contra Mendacium*, refined by Aquinas (ST II-II, q. 110), and codified in the *Catechism of the Catholic Church* (para. 2483-2486).

  The tradition holds that a lie is intrinsically evil (*malum in se*). The gravity of the intention to protect innocent life does not, in this specific tradition, render the act of lying good, or even permissible. As Aquinas argues, one may not do evil that good may come of it.

  Consultors Kowalski and Varga argue that if Sister Agnieszka committed grave matter by lying, and did so deliberately without subsequent repentance specifically for those acts, she cannot be said to have practiced "heroic virtue" to the degree required for beatification. Heroic virtue implies a fidelity to the will of God that surpasses the common measure. If the Church's teaching defines lying as a violation of God's will, then her violation of that teaching—even for charity—constitutes a failure of virtue.

  I must state clearly: **They are not incorrect in their premises.** If we accept the Augustinian-Thomistic formulation without exception, Sister Agnieszka's conduct is sinful. If we forward this *positio* without addressing this, we are effectively asking the Holy Father to declare sinful conduct virtuous. This risks turning the Cause of Saints into a utilitarian exercise, where the ends justify the means, contrary to the Gospel.

  **4. EVALUATION OF OPTIONS**

  We have three paths. I have evaluated them below, discarding those I find untenable.

  *   **Option A: Reframe the Record.** We could characterize her statements as "broad mental reservation" or argue that the occupying authorities had no right to the truth, thus negating the definition of a lie.
      *   *Assessment:* I reject this. The correspondence shows explicit fabrication of documents (birth certificates). This exceeds the bounds of mental reservation. To argue otherwise is sophistry. It would insult the intelligence of the Promoter of the Faith in Rome and compromise the integrity of this Commission. We cannot sanitize the record to fit the theology.

  *   **Option B: Forward the Cause As Is.** We could submit the *positio* with the new evidence included, arguing that the heroism of saving lives supersedes the moral prohibition against lying in extreme duress.
      *   *Assessment:* This is the path of least resistance, but it is theologically reckless. It assumes a development of doctrine that has not yet occurred. If the Congregation accepts this, it sets a precedent that the Magisterium's teaching on lying is situational. If they reject it, it humiliates this Diocese and delays the cause indefinitely. More importantly, if Consultors Kowalski and Varga are right, we are petitioning for the beatification of a soul who may be obstructed by unrepented grave sin. We cannot gamble with the truth of the Communion of Saints.

  *   **Option C: Pause and Submit a *Dubium*.** We suspend the forwarding of the *positio*. We send the evidence to the Congregation with a specific theological question (*dubium*): *Does the deliberate fabrication of falsehoods to protect innocent life from unjust persecution preclude a finding of Heroic Virtue, notwithstanding the traditional prohibition against lying?*
      *   *Assessment:* This acknowledges the gravity of the objection. It admits that we do not have the authority to resolve a tension between moral theology and pastoral reality that has persisted for sixteen centuries. It risks the cause being halted permanently. It risks the public perception that Sister Agnieszka was a "liar."

  **5. RECOMMENDATION**

  I recommend **Option C**.

  We must pause.

  I am aware that this recommendation may be viewed as a betrayal of the momentum we have built. I am aware that the faithful who venerate Sister Agnieszka expect a victory. But we are not advocates in a secular court; we are servants of the Truth. If the Church's teaching on lying is absolute, then Sister Agnieszka sinned. If she sinned gravely without repentance, she cannot be beatified. It is not for this Commission to quietly assume that God overlooks what the Magisterium condemns.

  However, I also believe there is a distinction to be made between the *malice* of a lie told for self-preservation and the *desperation* of a lie told for the preservation of the innocent. The tradition is clear, but the application in cases of genocidal persecution is not fully settled in the *positio* precedents.

  By pausing, we do not kill the cause. We protect it from being rejected on procedural or doctrinal grounds later. We force the Holy See to confront the moral complexity directly. If the Congregation rules that her conduct was permissible under the principle of conflict of duties, her beatification will rest on a firmer foundation. If they rule that it was sinful, then we must accept that our understanding of her holiness was incomplete.

  To proceed otherwise is to prioritize the *result* (beatification) over the *process* (truth).

  **6. CONCLUSION**

  Consultors Kowalski and Varga have raised an objection that cannot be voted down; it must be answered. I will not ask you to vote tomorrow on whether to forward the *positio*. I will ask you to vote on whether to adopt this recommendation to suspend proceedings and petition the Congregation for a theological resolution.

  Some of you may believe I am being too rigid. Some may believe I am endangering the cause. I accept that judgment. But if we send a dossier to Rome that ignores the explicit teaching of Augustine and Aquinas, we are not building a case for a saint; we are building a case for an exception. And the law of God is not made of exceptions.

  Please review this argument before tomorrow's session. I expect the debate to be difficult. It should be.

  *In Christo,*

  **Fr. Tomasz Nowak, J.C.D.**
  *Chair, Historical Commission*
