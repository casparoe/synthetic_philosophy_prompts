      *   **The Reductionist Response (Fricker's Local Reductionism):** Humea needs to pivot. She can't accept Global Reductionism (testimony *in general* is reliable) because of the child problem. She moves to Local Reductionism (accept testimony *if* this speaker seems reliable).
          *   *Nuance:* It's not about a global track record of humanity, but monitoring *this* instance for defeaters.
      *   **The Counter-Challenge:** Reid pounces.
