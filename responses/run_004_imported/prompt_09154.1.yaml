      *   **Reid (Anti-Reductionist):** Trusting (but not naive), focuses on the social nature of knowledge and the principles of veracity and credulity. Believes testimony is a basic source of justification, akin to perception.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A coffee shop or office hours? Let's go with office hours, post-seminar. It adds academic texture.
      *   **Initial Salvo:** Define the positions clearly but briefly.
          *   Reid: Testimony is basic. Principle of Credulity.
          *   Humea: Testimony is derivative. Needs inductive backing.
      *   **The Coady Objection:** Reid brings up the child.
