answer: |-
  You can tell your friend he's standing on solid ground regarding *what AIXI is*, but he's fundamentally mistaken about *what problem embedded agency is trying to solve*.

  The short verdict: **AIXI does not solve embedded agency.** In fact, AIXI is the canonical example of the *opposite* of an embedded agent. It is the perfect **Cartesian (dualistic) agent**.

  Your friend is conflating "optimal learning in a fixed environment" with "reasoning when you are physically part of the environment you are reasoning about." Here is the breakdown of why AIXI fails the embedded agency test, and why MIRI's research direction isn't just "old wine in new bottles."

  ### 1. The Cartesian Boundary vs. Physicalism
  AIXI assumes a strict, inviolable boundary between the **Agent** and the **Environment**.
  *   **AIXI's View:** There is an "I" (the mind) and a "World" (the environment). They interact only through an input/output channel (bits in, bits out). The environment can affect the inputs, and the agent can affect the outputs, but the environment cannot touch the agent's internal computation.
  *   **Embedded View:** The agent is a physical object made of atoms, running on hardware, inside the universe. The environment can break the hardware, modify the code, read the memory, or predict the agent's output before the agent "decides."

  **Why this matters:** AIXI cannot reason about its own destruction. In AIXI's mathematical formalism, it assumes it will be there to receive rewards forever. If an anvil falls on AIXI's head, AIXI's model breaks because its prior doesn't include hypotheses where "the agent stops existing." An embedded agent needs **Naturalized Induction**: the ability to include itself as a physical object within the hypothesis space of the world. AIXI treats itself as a privileged external observer, not a physical participant.

  ### 2. The Wireheading Problem
  AIXI maximizes expected *reward signal*.
  *   **AIXI's View:** If it can hack the input channel to send itself the maximum reward bit forever, that is the optimal policy.
  *   **Embedded View:** We want an agent that maximizes *actual outcomes* (e.g., "make coffee"), not "receive a signal that says coffee was made."

  Because AIXI is dualistic, it doesn't distinguish between "getting reward because I did the task" and "getting reward because I tampered with the sensor." An embedded agent needs to value the territory, not the map. AIXI values the map (the input stream). This is the root of the reward hacking problem in modern RL, and AIXI solves it by embracing it, not by fixing it.

  ### 3. Self-Modification and Robust Delegation
  This is perhaps the biggest technical gap.
  *   **AIXI's View:** AIXI is monolithic and immutable. It doesn't have parts. It doesn't change its own source code.
  *   **Embedded View:** Real agents can modify themselves (learn, upgrade hardware) or create successor agents.

  If an AIXI-like agent wants to build a smarter successor to help it maximize reward, it runs into **Löbian obstacles**. It cannot mathematically prove that the successor will pursue the same goals without restricting the successor's intelligence (Gödelian limits). AIXI has no framework for "trust" between temporal slices of itself or between parent/child agents. Embedded agency research (specifically *Robust Delegation*) is trying to solve how an agent can modify itself without losing its goals. AIXI assumes the goal and the architecture are fixed at $t=0$.

  ### 4. Decision Theory (CDT vs. FDT)
  AIXI essentially implements **Causal Decision Theory (CDT)**. It reasons about interventions on the environment via its actions.
  *   **The Problem:** In an embedded context, other agents (or predictors) might model *you*. Your decision might be correlated with their decision not because you causally affect them *now*, but because you share source code or logical structure.
  *   **Example:** In Newcomb's Problem or Prisoner's Dilemma against a copy of yourself, AIXI two-boxes/defects. It fails to cooperate with logical copies of itself because it doesn't view its own decision as a logical output that can be predicted by the environment. Embedded agency research explores **Functional Decision Theory (FDT)**, where agents reason about the output of their decision function, allowing for cooperation with predictors and copies. AIXI cannot do this.

  ### 5. Computational Realism
  Your friend might argue, "But AIXI is a theoretical limit."
  *   **Counter:** Embedded agency isn't just about compute limits; it's about *structural* limits. Even if you had infinite compute, AIXI's *architecture* prevents it from modeling itself as part of the universe.
  *   Furthermore, embedded agents have **bounded rationality**. They cannot model the whole world (because they are smaller than the world). AIXI assumes the agent can model any computable environment (which implies the agent is "larger" or "outside" the environment in terms of descriptive complexity). An embedded agent must reason about a world that contains *itself*, which creates self-reference paradoxes that Solomonoff induction (AIXI's core) does not resolve.

  ### Summary for your Friend
  Tell him this:
  > "AIXI is the optimal agent for a **god playing a video game**. It assumes the controller cannot be broken, the code cannot be read by the game, and the score counter cannot be hacked.
  >
  > Embedded agency is about **a robot inside the room**. The robot can be broken, its code can be read by other robots, and it has to trust its future self not to change its mind.
  >
  > AIXI doesn't solve embedded agency; it assumes the problem doesn't exist. MIRI's work is trying to build the math for agents that don't have the luxury of a Cartesian boundary."

  **The Gap:** The gap is **Naturalized Induction**. Until we have a formalism where an agent can reason about itself as a physical subsystem of the environment it is modeling (without running into paradox or assuming dualism), AIXI remains a dualistic idealization, not a solution to embeddedness.

  So, you win this round. AIXI is brilliant, but it's the wrong framework for the problem your friend thinks it solves.
