      *   *Check:* Did I clearly distinguish 1 and 3? Position 1 is about the *content* of the reason (must match the truth). Position 3 is about the *form* of the motivation (must be duty-based, even if the agent's conception of duty is flawed? Or must be correct duty?). Usually, Position 3 implies acting from a commitment to *what is actually right*, understood as duty. If the agent thinks the wrong thing is duty, Kantians have a problem. I need to clarify that Position 3 usually demands acting from a commitment to the *true* moral law, which implies knowledge. Or, it demands acting from *conscience*. I will frame Position 3 as requiring a commitment to moral principle *as such*, which in Patience's case would actually lead her astray (since her principles support the trials). This strengthens the case for Position 2.
      *   *Wait, one nuance:* Position 1 says reasons must coincide with *what actually makes the act right*. Position 3 says reasons must be *duty*. If the act is right because it saves an innocent, Position 1 wants "saving innocence" as the motive. Position 3 wants "because it is my duty" as the motive. Position 2 wants "because I love her/can't bear it" as the motive.
      *   *Crucial Point:* In Patience's case, her "duty" (as she understands it) is to turn Verity in. So Position 3 is fatal to her. Position 1 is also fatal (she doesn't believe saving innocents is the rule, she thinks saving *Verity* is the exception). Position 2 is her only salvation.
      *   *My Argument:* I will argue Position 2 is correct *specifically because* moral knowledge is often embedded in sentiment before it is codified in principle, especially in corrupt societies.

  7.  **Final Polish:** Check word count and flow. Ensure the verdict on Patience is explicit. (The prompt asks: "tell me plainly what your verdict implies about whether Patience deserves moral credit".)

      *   *Plan:*
          1.  Intro: Patience, Huck, the problem of moral worth.
          2.  Pos 1: The Coincidence View (Kantian/Intellectualist).
