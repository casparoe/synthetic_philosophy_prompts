      *   *Section 3 (Commitment):* The "Steadfastness" requirement. Emotions are fickle. Principle ensures consistency. Addressing the "self-love" charge: It's not loving oneself, it's loving the *law* that protects everyone. But in Salem, the "law" is evil. So this view struggles here.
