answer: |-
  Here is a draft of ten interview questions tailored for your podcast. They are designed to move from context into the specific philosophical tensions you want to explore, ending with a forward-looking conclusion.

  1.  **To start, I know you've spent a lot of time with Galen Strawson's "Basic Argument" for your dissertation. For listeners who might be encountering this for the first time, what was the moment or the puzzle that made you want to defend such a counterintuitive claim? Why does this specific problem matter to you?**

  2.  **Most philosophers who disagree with Strawson are "compatibilists." They argue that we don't need *ultimate* responsibility to be morally responsible; we just need to be acting according to our own desires without coercion. Why do you think that move fails? Why isn't "acting on your own desires" enough?**

  3.  **We often talk about moral responsibility in the context of blame or punishment. But if the Basic Argument holds, it seems to undermine credit and praise just as much. Does this mean we should stop feeling proud of our achievements, or is there a distinction there you can preserve?**

  4.  **One of the most striking features of the Basic Argument is that Strawson insists it works whether the universe is determined *or* indeterministic. Usually, people think if determinism is false, we have freedom. Why does Strawson argue that letting genuine randomness into the causal story doesn't rescue responsibility?**
      *   **Follow-up:** *If she answers that random events are just a matter of luck and not control:* **So, if neither a determined path nor a random path gives us responsibility, does that suggest the problem isn't with physics at all, but with the very concept of a "self" that could own an action?**

  5.  **Strawson traces part of this argument's history to Nietzsche's mockery in *Beyond Good and Evil*. Nietzsche ridiculed the idea of *causa sui*—something like wishing you could pull yourself into existence by your own hair, which is obviously impossible. Does knowing this pedigree make the Basic Argument feel like a genuine logical discovery, or does it look more like an old intuition that keeps recurring without ever managing to convince most working philosophers?**
      *   **Follow-up:** *If she suggests it's a discovery that people just resist:* **If it's a discovery, why do you think the resistance is so stubborn? Is it that the argument is too abstract, or is there something psychologically necessary about believing we are responsible, even if it's false?**

  6.  **There is a famous philosophical family feud here. Galen Strawson's father, P.F. Strawson, wrote the classic paper "Freedom and Resentment." He argued that reactive attitudes like resentment and gratitude are natural human practices that don't need metaphysical backing and can't be argued away. How do you reconcile your defense of the son's argument with the father's claim that these practices are immune to metaphysical critique?**
      *   **Follow-up:** *If she suggests we can keep the practices while dropping the belief:* **That leads to my next point: Is the Basic Argument supposed to change how we actually live and treat each other, or is it only about what we're rationally entitled to believe in the quiet of our study? If it doesn't change how we live, what is the practical stakes of your dissertation?**

  7.  **You mentioned earlier that compatibilists redefine responsibility to make it work. But isn't there a risk that you and the compatibilists are just talking past each other? They define responsibility as "social accountability," and you define it as "ultimate authorship." Is this debate just a verbal disagreement, or is there a fact of the matter about which definition is correct?**

  8.  **Let's talk about the implications for the legal system. If no one is truly responsible, retributive justice seems unjustified. But you've suggested that we can still detain dangerous people for safety, similar to how we quarantine a virus. Does viewing criminals like viruses strip them of their dignity, even if you say it's not "punishment"?**

  9.  **Some critics argue that the Basic Argument sets the bar for responsibility impossibly high—basically requiring us to be gods. Do you think the intuition that we *are* ultimately responsible is a mistake we need to grow out of, like believing the sun orbits the earth, or is it a deep truth that we just have to learn to live without?**

  10. **To close, philosophical arguments are often hard to "disprove" empirically. But I'd like to ask: what kind of consideration, if any, would count as evidence against the Basic Argument for you? Is there a scenario or a line of reasoning that could change your mind, or is the argument airtight by definition?**
