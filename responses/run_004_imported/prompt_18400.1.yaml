      *   **Key Difference 2: Admissibility.** PP has a crucial caveat: "admissible evidence." If you know the outcome, your credence should be 1, not the chance. ML calibration doesn't usually distinguish between "admissible" and "inadmissible" evidence in the Lewisian sense; it just looks at input-output consistency.
      *   **Key Difference 3: Single Case vs. Reference Class.** PP applies to single cases (given the chance). Calibration is inherently frequentist (requires a set of predictions to measure).

