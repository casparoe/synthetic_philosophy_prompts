      *   *Action-optimal:* Maximize expected utility at the node given beliefs about being at node 1 vs 2.
      *   *The Paradox:* If I plan $p=2/3$, when I get there, do I still want to do $p=2/3$? P&R say maybe not. AHP say yes, because you can't change the past strategy.
