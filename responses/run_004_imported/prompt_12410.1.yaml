      *   **Middle:** The math clash. Elias argues for updating beliefs at the intersection. Sarah argues for commitment from the start.
      *   **Climax:** The core disagreement on whether the "self" at the wheel is the same as the "self" planning.
      *   **Ending:** Unresolved but respectful. A toast to the uncertainty.

  6.  **Refining the Math/Jargon:**
