answer: |-
  "Payoff's zero at the first exit," Elias said, tracing a circle in the condensation on his glass. "Four at the second. One if you blow past both. But you can't tell them apart."

  Sarah stirred her drink. "So you maximize ex-ante. You choose a probability $p$ of continuing that maximizes expected utility before you leave the driveway. That's planning-optimal. You get $p$ equals two-thirds."

  "But that's the view from the driveway," Elias said. "I'm interested in the view from the wheel. When I'm actually at an intersection, I have to act. That's action-optimality. I need to assign a probability to being at the first exit versus the second."

  "You can't update on being there," Sarah said. "You knew you'd be there. The information set is identical to what you modeled at the start. If you change your strategy at the wheel, you're violating your own prior optimization."

  "Am I? Or am I realizing that the probability of being at the first exit isn't fixed?" Elias leaned in. "Piccione and Rubinstein showed that if you treat the belief as endogenous to the strategy, the action-optimal $p$ shifts. It's not two-thirds anymore. The driver at the intersection has a different incentive structure than the planner."

  "The driver *is* the planner," Sarah countered. "Aumann's point was exactly this. You're trying to condition on being at an intersection, but that event has probability one under any mixed strategy where you leave the driveway. You can't use Bayes' rule on an event that was certain to happen. You're double-counting the uncertainty."

  "It's not double-counting. It's acknowledging imperfect recall." Elias tapped the table. "When I'm there, I don't know if this is the first time I'm making this decision or the second. My belief about my location depends on the strategy I intend to use. If I plan to exit always, I know I'm at the first. If I plan to continue always, I could be anywhere. The belief and the action are coupled."

  "So you let the tail wag the dog," Sarah said. "You're saying the optimal plan isn't stable. You plan to do two-thirds, but when you get there, you want to do something else. That's time inconsistency. It suggests the model is broken, not that the driver should re-optimize."

  "Or it suggests the planning model ignores the phenomenological reality of the agent," Elias said. "The planner knows the distribution. The driver only knows the instance. If the math says I should deviate from the plan once I'm in the seat, then the plan wasn't truly optimal for the agent experiencing it."

  "The agent experiencing it is a temporal slice of the same entity," Sarah said. "If you maximize from the outside, the paradox dissolves. You don't need to assign a probability to which exit you're at. You just execute the mixed strategy. Two-thirds continue. Done."

  "And if I feel like I've already lived this afternoon?" Elias asked quietly. "If the déjà vu makes me think I'm at the second exit, even if I'm not? Your model doesn't have room for that error."

  Sarah paused, lifting her glass. "My model assumes rationality. It doesn't assume sanity."

  "Exactly," Elias said, clinking his glass against hers. "Which is why I'm still stuck at the first exit."
