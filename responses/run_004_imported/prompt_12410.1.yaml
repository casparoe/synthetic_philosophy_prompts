  2.  **Understand the Core Conflict (Absent-Minded Driver):**
      *   **The Setup:** A driver needs to exit at the second of two identical exits. Payoffs: Exit 1 (0), Exit 2 (4), Continue past 2 (1). The driver is absent-minded and can't distinguish the intersections.
      *   **Piccione & Rubinstein (P&R):** Argue for *action-optimality*. When at an intersection, the driver should update their belief about being at the first vs. second intersection based on the strategy they intend to use. This leads to a specific probability assignment (often involving the strategy itself) and can yield a different result than the initial plan. They see a tension between what you plan to do and what you do when you get there.
      *   **Aumann, Hart, & Perry (AHP):** Argue for *planning-optimality*. The decision is made once at the start. The "self" at the intersection is the same agent as the "self" at the start. You maximize expected utility from the outset. The belief at the intersection shouldn't change the optimal strategy derived at the start. They claim P&R are double-counting or misapplying conditional probability.
      *   **Key Math:** Let $p$ be the probability of continuing.
          *   Planning payoff: $U(p) = (1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1 = 4p - 3p^2$. Maximize wrt $p$: $4 - 6p = 0 \Rightarrow p = 2/3$.
          *   P&R Action view: When at an intersection, what is the probability I am at the first ($\alpha$)? They argue $\alpha$ depends on $p$. If you assume you are equally likely to be at either given you are at *an* intersection, you might calculate differently. P&R derive a different optimal $p$ (often $4/9$ or similar depending on the specific formulation of the belief update).
          *   AHP Counter: The probability of being at the first intersection *given* you are at an intersection is not a free variable you update on; it's determined by the strategy $p$ chosen at the start. Stick to the $2/3$.

