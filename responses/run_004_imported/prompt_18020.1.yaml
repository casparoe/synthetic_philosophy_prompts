  The heat inside the observation blind was a physical weight, pressing against Elias's shoulders like a heavy hand. Outside, the sagebrush shimmered in the noon haze. Beside him, Jen adjusted the focus on the camera, her lens trained on the sentinel post where a single Canyon Wren stood guard.

  "Ready?" Jen asked, her hand hovering over the controller for the lure.

  "Run it," Elias said.

  Jen flicked the switch. Twenty yards away, a motorized decoy began to rotate. It was a crude thing—silver discs spinning on a wire armature designed to catch the light like the wingbeat of a hawk. It wasn't a hawk. It was metal and noise. But when the shadow swept across the sand, the wren threw its head back and issued the sharp, staccato alarm call. *Seeet! Seeet!*

  The flock below vanished into the scrub.

  Jen exhaled, triumphant. "Response confirmed. The signal indicates 'aerial threat.' We can log it as a valid detection."

  Elias didn't move. He watched the wren, still perched, still vibrating with the aftermath of the call. "It's not a valid detection, Jen. It's a misfire."

  "The bird reacted," she countered, tapping her stylus against the tablet. "The mechanism triggered. The content of the call is 'danger.' Whether it's a hawk or a spinner, the meaning holds."

  "The meaning doesn't hold," Elias said, his voice rough from the dry air. "Think about the history. That alarm system was selected over millennia to track hawks. Specifically hawks. The consumers of that signal—the flock—hide because hawks kill them. They don't hide because spinning metal kills them. There is no evolutionary history of hiding from wire armatures."

  "So it's a false alarm?" Jen asked. "Like the frog snapping at a BB pellet?"

  "Exactly," Elias said. "The frog's visual system was selected to catch flies. When it snaps at a BB, it's not representing 'fly-or-BB.' It's representing 'fly,' and it's wrong. It's a malfunction. If you say the content is just 'whatever triggers the snap,' you empty the signal of its specific truth conditions. You make it impossible for the animal to be mistaken."

  Jen leaned back, wiping sweat from her brow. "But from the bird's perspective, there is no difference. The input is identical. If the function is to preserve life, and this call preserves life by triggering hiding, why isn't the content 'thing-that-looks-like-a-hawk'? Why insist on the historical ghost?"

  "Because if the content is 'thing-that-looks-like-a-hawk,' then the bird is never wrong," Elias said. "It's tautological. Teleosemantics demands that the norm comes from the past, from what kept the ancestors alive. This spinner is a lie. The bird is telling the truth about a hawk that isn't there."

  "So we log it as an error?" Jen asked. "If we mark this as a misrepresentation, it skews the reliability metrics of the sentinel system. It looks like the bird is faulty."

  "The bird isn't faulty," Elias said, looking at the wren. "The world is noisy. The system is designed to tolerate noise. It's better to snap at a BB than miss a fly. Better to scream at a shadow than ignore a hawk."

  He looked at the datasheet on his lap. There was a checkbox for *Valid Signal* and a column for *False Positive*.

  This was the friction point. It wasn't just about data; it was about how they inhabited the world with these creatures. If he checked *Valid Signal*, he conceded that meaning was purely causal, defined by the immediate present. The bird's call meant whatever made it speak. If he checked *False Positive*, he insisted that meaning was historical, rooted in a lineage of survival that the bird couldn't see but was bound by. The bird was speaking a language older than itself, and in this moment, it had stuttered.

  Jen waited, stylus poised. "Elias? We need to move before the heat shifts the thermals."

  Elias looked at the spinning lure. It was harmless. The bird was safe. But the call had been a lie. The flock was currently cowering in the dirt for no reason, expending energy on a ghost. That cost mattered. The mismatch mattered. If there was no mismatch, there was no representation, only reflex.

  He thought of the frogs in the lab jars, tongues flicking at nothing. He thought of his own career, cataloging calls that sometimes meant *hawk* and sometimes meant *wind*.

  "It's an error," Elias said softly. "But it's a necessary one."

  He took the pen. He didn't mark *Valid Signal*. He marked *False Positive*.

  "Logging as misrepresentation," Jen said, her tone neutral, though he sensed her disagreement. She understood the philosophy, but she cared about the reliability stats. Elias cared about the truth conditions.

  "Pack it up," he said.

  As they dismantled the lure, the wren returned to its normal song, a fluid cascade of notes that meant nothing specific, everything general. Elias watched the bird. It had been wrong about the hawk, but right about the world being a place where shadows must be respected. The error was the price of the signal's existence. Without the possibility of the BB, the fly meant nothing.
