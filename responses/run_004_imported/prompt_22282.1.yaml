answer: |-
  **Setting:** *A coffee shop across the street from a rental complex. Through the window, they can see their friend, Alex, emerging from the leasing office, signing a tablet. Alex looks relieved, not triumphant.*

  **Max:** (Tapping his cup) And there it is. The reveal. She stopped. Which means, in her estimation, the marginal utility of signing this lease exceeded the marginal utility of seeing the three other units she had scheduled for Thursday.

  **Sam:** Or, it means she found the first apartment that had a dishwasher, in-unit laundry, and rent under $3,000. She told us that on Monday. She didn't weigh the Thursday units against this one. She just cleared the bar.

  **Max:** That's the surface description, Sam. Under the hood, that "bar" is just a shadow price. She implicitly calculated that the cost of searching—time, gas, the mental load of comparing floorplans—outweighed the expected gain of finding a potentially better deal. She maximized utility subject to a search-cost constraint. It's Stigler 101.

  **Sam:** It's not Stigler. It's Simon. There's a difference between *optimizing* under constraints and *satisficing*. In optimization, you have a global function you're trying to maximize. In satisficing, you have an aspiration level that adjusts based on feasibility. If Alex had found nothing in this neighborhood, she wouldn't have calculated the "optimal" new search radius. She would have just lowered her bar. "Okay, no dishwasher, fine." That's procedural rationality, not substantive.

  **Max:** But if she lowers the bar, it's because the *cost* of maintaining the high bar became too high relative to the probability of finding a match. You can model aspiration adjustment as a Bayesian update on the distribution of available housing. It's all consistent with expected utility. The theory absorbs your objection.

  **Sam:** And that's exactly the problem Herbert Simon had with your crowd. If you can reinterpret *any* behavior as "optimization" just by inventing a specific cost function after the fact, you haven't explained anything. If Alex had spent three months looking and found nothing, you'd say "high standards, low search costs." She looks for one week and stops, you say "high search costs." The theory is unfalsifiable. It's a tautology dressed up as math.

  **Max:** It's not a tautology; it's an "as-if" model. We don't claim her brain is literally running a Lagrangian multiplier. We claim that if she *wasn't* acting as if she were maximizing, she'd be leaving value on the table. And people generally don't leave value on the table systematically. If your theory predicts she stops at the first "good enough" place, but market incentives punish that behavior, she'll learn to optimize. The market selects for maximizers.

  **Sam:** But the market doesn't select for global optimizers because global optimization is computationally impossible. That's the bound. To optimize her search, Alex needs to know the distribution of all available apartments to calculate the expected value of one more viewing.

  **Max:** She uses priors.

  **Sam:** Where do the priors come from?

  **Max:** Past experience.

  **Sam:** Which required search. To know how much to search, she needs to know the value of search. To know the value of search, she needs to search. You've got an infinite regress, Max. To optimize the optimization, she'd need to optimize the meta-optimization. At some point, you have to admit the brain just uses a heuristic because it *can't* do the calculus.

  **Max:** (Leans forward) Okay, fair point on the regress. That's why we treat search costs as inclusive of cognitive effort. The reason she doesn't optimize the optimization is that the cognitive cost of doing so exceeds the benefit. So she uses a rule of thumb. But—and here's the kicker—that rule of thumb *is* the solution to the optimization problem. Evolution, or learning, has handed her a heuristic that approximates the maximum. So functionally, she's still a maximizer. The heuristic is just the tool.

  **Sam:** Functionally, maybe. But mechanistically, no. And mechanism matters if you want to predict what happens when the environment changes. If you treat the heuristic as a proxy for optimization, you assume it'll track the optimum. But Simon showed that aspiration levels track *experience*, not *opportunity*. If Alex moves to a market where everything is terrible, she'll be happy with a dump. If she moves to a luxury market, she'll be miserable in a nice place. An optimizer would calculate the absolute utility of the dump. A satisficer just reacts to whether it meets the threshold set by her last few views.

  **Max:** But that threshold *is* her utility function adapting to local constraints. You're describing dynamic preferences. We can model that.

  **Sam:** You can model it, but you lose predictive power. If I assume she's a satisficer, I predict she'll stop searching the moment she hits $3,000. If I assume she's a maximizer, I have to guess her hidden search cost function to predict when she stops. Your model requires me to know her internal cost of boredom to make a prediction. My model just requires me to know her aspiration level. Which one is more parsimonious?

  **Max:** Parsimony isn't just about variables; it's about unity. If I accept your view, I have one theory for economic behavior (maximization) and a different theory for psychological behavior (satisficing). That fragments science. I'd rather keep one engine—utility maximization—and acknowledge that the fuel (information) is expensive. It keeps the language of rationality intact. If we say "humans don't maximize," we lose the ability to say they're making *mistakes*. If Alex buys a place with a cracked foundation because she didn't want to search more, your theory says "she satisficed, rational procedure." My theory says "she failed to account for long-term risk in her cost function." I can critique her decision; you can only describe it.

  **Sam:** That's a feature, not a bug. Calling it a "mistake" assumes she *could* have known. Bounded rationality says she couldn't have known without incurring infinite cost. But I'll grant you this: if your "search cost" includes the cognitive load of calculating search costs, you're basically smuggling my whole argument into your cost function. You're redefining "maximization" to mean "doing the best you can with limited brain power."

  **Max:** Exactly.

  **Sam:** But then "maximization" just means "behavior." It stops being a normative claim about rationality and becomes a descriptive label for whatever happens. Simon's point was that we need to study *how* people decide, not just assume the decision was optimal because it happened. If we want to build better tools for Alex—better apartment search apps, better interfaces—we need to know she uses thresholds, not that she's secretly balancing a marginal equation.

  **Max:** I'll concede on the interface design. For engineering the environment, your model is better. But for predicting aggregate market behavior? Prices, rents, supply? The maximization assumption aggregates out the noise. The market acts like a maximizer even if the individuals are satisficers.

  **Sam:** Until the market crashes because everyone's aspiration levels were anchored to a bubble.

  **Max:** (Smiles) Which we can model as a correction in expected utility priors.

  **Sam:** God, you're impossible.

  **Max:** I'm consistent.

  **Sam:** You're tautological.

  *(Alex walks up to the window, holding a box of keys.)*

  **Alex:** Hey, you guys still here? I got the place.

  **Max:** Congratulations. Optimal choice given the constraints?

  **Alex:** Honestly? It just had a dishwasher. I'm tired.

  **Sam:** (To Max) Aspiration level met. Search terminated.

  **Max:** (To Alex) High cost of continued search implicitly priced in.

  **Alex:** ...I'm just going to go unpack.

  *(Alex walks away.)*

  **Sam:** She didn't price anything in. She just wanted lunch.

  **Max:** And the utility of lunch exceeded the utility of arguing with us. See? Maximization holds.

  **Sam:** (Sighs) Buy me a sandwich, Max.

  **Max:** Only if the marginal cost doesn't exceed my budget constraint.

  **Sam:** Get out.
