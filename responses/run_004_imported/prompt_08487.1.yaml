answer: |-
  The wipers kept time against the rain, a rhythmic squeak that filled the silence left by the cemetery. Daniel drove with one hand on the wheel, his eyes on the gray ribbon of the highway. Ilse stared out the passenger window, watching the blurred treeline.

  "He looked peaceful," Daniel said finally.

  "Marcus looked like a shell," Ilse corrected, her voice quiet but precise. "The person was already gone. The question is whether the shell was ever enough to hold him."

  Daniel sighed, the sound heavy in the cabin. "Here we go. Twenty years, Ilse. Can we let him rest without reducing him to a thought experiment?"

  "It's the only way I know how to honor him. Was he just physics? Or was there something else that slipped away?"

  "Type-B physicalism doesn't say he was *just* physics in the dismissive sense," Daniel said, shifting gears. "It says everything he was *is* physics, even if we can't deduce the experience from the equations. Think about Kripke. Think about water. For centuries, people conceived of water without H2O. It was coherent. But it turned out water *is* H2O. Necessarily. The identity is a posteriori."

  Ilse turned to him. "The standard move. But you're missing the disanalogy. When you conceive of water without H2O, you're conceiving of the *appearance* of water without the microstructure. You're picking out the reference via a contingent description. That's the primary intension. But the secondary intension—the stuff itself in counterfactual worlds—is rigid. With consciousness, there is no gap between the appearance and the reality. Pain *is* the feeling of pain."

  "So you say."

  "So Chalmers shows," Ilse insisted. "For phenomenal concepts, the primary and secondary intensions coincide. If I can conceive of a zombie—a physical duplicate without consciousness—I'm not just conceiving of a different mode of presentation. I'm conceiving of the absence of the property itself. If zombies are conceivable, they are possible. If they're possible, physicalism is false."

  Daniel kept his eyes on the road. "You're assuming our conceptual access is transparent. I'm saying phenomenal concepts are unique. They're direct. When I think 'pain,' I'm not describing a functional role; I'm instantiating a concept using the very state it refers to. That creates an epistemic gap that doesn't map onto an ontological gap."

  "The Phenomenal Concept Strategy," Ilse said, the words tasting like ash. "You're arguing that the concept is special, not the property. But if the concept is direct, if it picks out the experience immediately, why is the link to the physical state opaque? If 'pain' and 'C-fiber firing' refer to the same thing, and I grasp 'pain' directly, I should be able to see the identity. The fact that I can't suggests they aren't identical."

  "Or it suggests we're built to navigate the world, not to introspect our own ontology," Daniel countered. "We have two modes of access. One from the inside, one from the outside. The gap is in the map, not the territory. You're treating the conceivability of zombies as evidence of metaphysical possibility, but it's just evidence of our cognitive architecture. We can't deduce the experience from the physics because our phenomenal concepts aren't derived from physical concepts. They're recognitional."

  Ilse leaned back, closing her eyes. "If primary and secondary intensions come apart for consciousness, you've admitted there's something contingent about how consciousness relates to the physical. And if it's contingent, it's not a strict identity. You're smuggling in dualism and calling it 'conceptual.'"

  "I'm smuggling in humility," Daniel said. "Look, I'll concede this: The intuition is robust. I feel it too. When I look at Marcus's coffin, I don't see a machine. I see a loss. But that feeling doesn't prove the machinery wasn't enough. It proves our concepts are distinct. Water and H2O felt distinct once, too. We were wrong."

  "We weren't wrong about water because water presents itself via contingent properties," Ilse said, opening her eyes. "Consciousness presents itself essentially. If you deny that, you're saying we are mistaken about the very nature of our own minds. You're asking me to accept that the most immediate fact of my existence is an illusion of contingency."

  "I'm asking you to accept that the brain is complex enough to generate that illusion," Daniel said softly. "Is it really harder to believe that than to believe in ghosts?"

  "It's not ghosts, Daniel. It's the explanatory gap. You haven't bridged it; you've just named it."

  "And you have?"

  "No," Ilse admitted. The word hung in the air, heavier than the rain. "I just refuse to pretend it isn't there. You treat the gap as a limit of our knowledge. I treat it as a limit of your ontology."

  Daniel signaled for the exit. The town lights blurred through the wet glass. "Maybe we're both describing the same limit. You call it metaphysics; I call it neuroscience waiting to happen."

  "Neuroscience won't tell us why it feels like something to be Marcus," Ilse said. "It will only tell us how the shell moved."

  "Then we're back to where we started."

  "We never left," Ilse said.

  Daniel turned off the engine. The silence returned, but it was different now—charged with the familiar friction of their shared history. They sat in the dark car, two physicists of the soul who couldn't agree on the substance of the atom.

  "Marcus would have hated this," Daniel said, a faint smile touching his lips.

  "He'd have wanted the truth," Ilse replied.

  "Whatever that is."

  They got out of the car, leaving the argument unresolved, as always, walking into the house where the coffee was still warm.
