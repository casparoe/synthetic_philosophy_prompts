answer: |-
  It is completely understandable that you struggled to explain this over dinner. Evidential Cooperation in Large Worlds (ECL)—formerly Multiverse-Wide Superrationality (MWSR)—is one of those ideas that sounds like science fiction until you stare at the decision theory equations for a few hours, and even then, it feels slightly hallucinogenic.

  Your skepticism is healthy. Many people suspect it *is* wishful thinking: a way to feel like you're influencing the cosmos without actually having the power to do so. However, since you asked us to **grant the premises** (that Evidential Decision Theory is correct, the universe is vast, and there are correlated reasoners), the math does force some specific behavioral changes. It doesn't just dissolve into "be nice."

  If you take ECL seriously, here are the top three implications that actually cash out to real-world behavior, ranked by how much they should change what you do.

  ### 1. Moral Compromise (The "Value Portfolio" Strategy)
  This is the biggest practical shift. Standard Effective Altruism usually asks: *"What cause maximizes **my** values?"* ECL asks: *"What cause maximizes the values of **all agents correlated with me**?"*

  In a large world, there are likely many agents who reason exactly like you (using similar logic, heuristics, and epistemology) but who started with slightly different moral axioms. Maybe they are prioritarian instead of utilitarian, or they place higher weight on animal suffering than you do. Under ECL, you shouldn't just maximize your own values; you should strike an "acausal trade." You support their values here, and (because they are similar reasoners) they support your values in their corner of the universe.

  *   **Practical Change:** You should diversify your donations and advocacy to include moral views you don't fully endorse, provided they are held by "similar reasoners."
  *   **Example:** If you are a hedonistic utilitarian who doesn't care much about deontological constraints, ECL suggests you should still fund some projects that respect deontological constraints (e.g., rights-based advocacy), because correlated agents in the multiverse who are deontologists will fund utilitarian projects.
  *   **Limit:** You don't need to fund *everyone*. You only cooperate with agents whose reasoning processes are correlated with yours. You don't owe anything to agents who reason via "might makes right" or random chance, because your decision doesn't provide evidence about *their* decisions. This mostly means compromising within the sphere of rational, altruistic moral theories.

  ### 2. Prioritizing "Neutral" Goods (Existential Risk & Meta-Work)
  If you are trying to cooperate with a vast coalition of agents who hold different specific values, you need to find the intersection of those values. What does a utilitarian, a deontologist, a virtue ethicist, and a preference utilitarian all agree on?

  They all generally agree that **it is better if they exist and have resources than if they don't.**

  Specific value-laden interventions (e.g., "distribute bednets" vs. "end factory farming") are points of divergence. But existential risk reduction, institutional stability, and improving rational decision-making are "neutral goods." They preserve the option value for all value systems.

  *   **Practical Change:** ECL pushes you harder toward **longtermism and existential risk reduction** than standard EA might. While standard EA might weigh near-term suffering heavily, ECL suggests that ensuring the future exists is the highest-yield way to help your "acausal partners" realize their values.
  *   **Example:** You might shift funding from direct charity (which helps specific beings now) toward AI safety or biosecurity (which ensures *all* future beings, regardless of their specific moral framework, get to exist). This isn't unique to ECL, but ECL provides a distinct *reason* for it: it's the ultimate coalition-building project.

  ### 3. Norms of Epistemic Humility and Civility
  This sounds soft, but under ECL, it's a hard strategic constraint. If you act like a fanatic—someone who refuses to listen, compromises with no one, and assumes they are the sole arbiter of truth—you provide **evidence** that correlated agents elsewhere are also fanatics.

  If you are hostile to other altruists who have slightly different moral views, you signal to your "multiverse partners" that cooperation is off the table. If you are humble, collaborative, and willing to update your views, you provide evidence that your counterparts are doing the same, creating a more cooperative multiverse overall.

  *   **Practical Change:** You should actively avoid polarizing rhetoric within the EA/rationalist community. Treat moral disagreements as opportunities for "acausal trade" rather than battles to be won.
  *   **Example:** Instead of writing a blog post explaining why a competing moral framework is "obviously wrong," you write one exploring where the frameworks overlap and how they can support each other's goals. You invest time in understanding opposing views not just to refute them, but to identify potential trade partners.

  ### The "Reality Check": Why it might still feel like nothing
  You mentioned worrying that this "cashs out to approximately nothing." Here is the strongest argument for why you might be right, even if the theory is true:

  **Correlation Decays with Divergence.**
  For ECL to work, the other agents must be *similar enough* to you that your decision correlates with theirs. The more their values diverge from yours, the weaker the correlation likely becomes.
  *   If you are a secular utilitarian, you are highly correlated with other secular utilitarians.
  *   You are less correlated with religious deontologists.
  *   You are barely correlated with agents who value paperclips above all else.

  Since your strongest correlation is with agents who *already agree with you*, the "compromise" might end up being very small. You might find that 90% of your "coalition" shares your top priorities anyway. In that case, ECL just tells you to do what you were already going to do, but with a different justification.

  ### Summary
  If you grant the premises, ECL is not just seminar-room curiosity. It demands three concrete shifts:
  1.  **Donate to a basket of moral views**, not just your own (Moral Compromise).
  2.  **Heavily prioritize existential risk**, as it is the only true "common good" (Neutral Goods).
  3.  **Be radically cooperative and humble** toward dissenters, as your behavior sets the tone for the coalition (Norms).

  However, because you are most correlated with people who think like you, the net result often looks suspiciously like "standard Effective Altruism, but with more emphasis on longtermism and less moral infighting." It might not revolutionize your Tuesday, but it should revolutionize how you view your relationship to the rest of the rational altruistic community.
