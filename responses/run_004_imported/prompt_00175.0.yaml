prompt: |-
  A friend and I just spent an hour arguing about this: my sister was diagnosed with ADHD last year, and now attributes most of her inconsiderate behavior—forgetting plans, interrupting people, being late to everything—to her condition. My friend thinks that once you know someone's behavior has a neurological cause, it's basically irrational to keep feeling resentment or anger toward them; the only reasonable response is to adjust your expectations and manage the relationship accordingly, the way you would with someone who has a physical disability. I pushed back, arguing that if we go too far down that road, we stop relating to people as people and start treating them like problems to be managed. Who has the better argument here, and is there a principled way to decide when it's still appropriate to hold someone responsible versus when we should just adapt around their condition?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Conflict:** The user and their friend are arguing about how to respond to the user's sister's ADHD-related behaviors (forgetting plans, interrupting, lateness).
      *   **Friend's Position:** Neurological cause = no rational basis for resentment/anger. Treat it like a physical disability (adjust expectations, manage the relationship).
      *   **User's Position:** Going too far down that road dehumanizes the person (treating them like a problem to be managed, not a person).
      *   **The Core Question:** Who has the better argument? Is there a principled way to decide when to hold someone responsible vs. when to adapt?

  2.  **Evaluate the Arguments:**
      *   **Friend's Argument (The "Medical Model" / Compassionate Determinism):**
          *   *Strengths:* Reduces conflict, fosters empathy, acknowledges the reality of the condition, prevents burnout for the neurotypical person (by lowering expectations).
          *   *Weaknesses:* Can lead to infantilization, removes agency from the person with ADHD, might enable harmful behavior if unchecked, ignores the emotional impact on the other person.
      *   **User's Argument (The "Humanistic Model" / Agency):**
          *   *Strengths:* Preserves dignity and agency of the sister, acknowledges that relationships are two-way streets, validates the user's feelings (resentment is a signal), prevents the relationship from becoming purely clinical.
          *   *Weaknesses:* Can lead to excessive conflict if expectations are unrealistic, might ignore the genuine limitations imposed by ADHD.
      *   **Synthesis:** Neither is wholly right or wrong. It's a tension between *explanation* and *excuse*, and between *accommodation* and *accountability*.

  3.  **Determine the "Better" Argument:**
      *   It's not a binary win. The friend is right about *understanding* the cause, but wrong about *eliminating* emotion. The user is right about *agency*, but needs to ensure expectations are realistic.
      *   *Verdict:* The user's concern about dehumanization is crucial, but the friend's point about reducing unnecessary suffering is also valid. The best approach is a middle ground.

  4.  **Develop a Principled Framework:**
      *   How do we decide when to hold responsible vs. adapt?
      *   *Key Concept 1: Explanation vs. Excuse.* ADHD explains *why* it's hard, not *that* it doesn't matter.
      *   *Key Concept 2: Capacity vs. Effort.* Is the person trying? Are they utilizing tools/strategies?
      *   *Key Concept 3: Impact vs. Intent.* The impact on the friend/sibling is real regardless of intent. Feelings (resentment) are data, not verdicts.
      *   *Key Concept 4: Reciprocity.* Is the sister acknowledging the impact and trying to mitigate it?
      *   *Key Concept 5: The "Physical Disability" Analogy.* It's flawed. ADHD affects *behavior* and *social contracts*, not just mobility. A better analogy might be chronic pain (invisible, fluctuating, affects mood/availability).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate both sides. It's a common and difficult tension.
      *   *Critique of Friend's View:* The "Physical Disability" analogy is imperfect. Emotions aren't switches we can turn off with logic. Resentment signals a boundary violation.
      *   *Critique of User's View:* Valid concern about dehumanization, but "responsibility" needs to be defined carefully in the context of neurodivergence.
      *   *The Synthesis (The "Better" Argument):* It's not about who wins, but integrating both.
      *   *The Framework (Principled Way):*
          1.  **Distinguish Explanation from Exoneration.** (ADHD makes it hard, not impossible/irrelevant).
          2.  **Assess Effort and Mitigation.** (Is she trying to manage it?)
          3.  **Validate the Impact.** (Your feelings matter even if her intent wasn't malicious).
          4.  **Negotiated Accommodations.** (Collaborative solutions, not one-sided management).
          5.  **The "Agency" Check.** (Is she treated as a child or an adult?)
      *   *Conclusion:* Summary advice.

  6.  **Refining the Tone:**
