      *   Avoid taking a hard side (e.g., "Your friend is wrong"). Instead, show *where* each is partially right and where they miss the mark.
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm diagnosing the sister or telling the user exactly what to do. Focus on the *framework* for decision-making.
      *   *Important nuance:* The friend says it's "irrational" to feel resentment. That's gaslighty. Emotions aren't rational/irrational in that sense. I need to highlight that.

  7.  **Final Polish:** Check against the prompt's specific questions ("Who has the better argument?" and "Is there a principled way?").
      *   *Who:* Neither is fully right. The user's concern about dehumanization is philosophically stronger, but the friend's practical advice on expectation management is useful.
      *   *Principled Way:* Yes, provide the 4-5 point framework.

  8.  *(Final Review of the Output)*: Does this address the emotional weight? Yes. Does it address the philosophical dilemma? Yes. Is it actionable? Yes.

  **(Self-Correction Note):** I should be careful not to minimize ADHD. It is a real neurological condition. But I also shouldn't minimize the sibling's feelings. The balance is key. The "Physical Disability" analogy is the weakest part of the friend's argument and needs to be dismantled gently.

  9.  **Finalizing the Structure:**
