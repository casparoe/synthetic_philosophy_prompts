answer: |-
  This is a profound ethical and relational question that touches on philosophy, psychology, and the nature of human connection. Neither you nor your friend is entirely right, but you are pointing toward a crucial nuance that your friend is missing.

  Here is a breakdown of who has the stronger point, why the "physical disability" analogy fails, and a principled framework for navigating responsibility versus accommodation.

  ### Who has the better argument?

  **Your friend is practically useful, but philosophically flawed.**
  Your friend is correct that understanding the neurological root of ADHD should increase empathy and lower *unrealistic* expectations. If your sister forgets plans because her working memory functions differently, getting angry at her for "not caring" is factually incorrect and emotionally exhausting for you.

  However, your friend is wrong to claim that feeling resentment is **irrational**. Emotions are data, not logical errors. Resentment signals that a boundary has been crossed or a need has been unmet. Telling you to suppress that emotion because of a diagnosis risks invalidating your experience. Furthermore, the "physical disability" analogy is dangerous. If someone is in a wheelchair, you build a ramp. If someone has ADHD, the "ramp" often requires *them* to take active steps (medication, timers, lists) to meet you halfway.

  **You are philosophically stronger, but risk being practically rigid.**
  You are right that treating someone purely as a condition to be managed is dehumanizing. It strips them of agency. If your sister is treated as a broken machine that you must simply "work around," she may internalize the idea that she is incapable of growth or change. Relationships require mutual effort. If you adapt 100% and she adapts 0%, the relationship becomes parental, not fraternal.

  **The Verdict:** Your concern about dehumanization is the more important ethical guardrail. However, your friend's advice on expectation management is a necessary tool, provided it doesn't become an excuse for abdication of responsibility.

  ### The Principled Framework: Explanation vs. Exoneration

  To decide when to hold someone responsible versus when to adapt, you can use the following five principles. This moves the conversation from "Is she allowed to do this?" to "How do we sustain this relationship?"

  #### 1. Distinguish Explanation from Exoneration
  ADHD is an **explanation**, not an **exoneration**.
  *   **Explanation:** "I understand *why* you are late. Your time blindness makes it hard to estimate travel time."
  *   **Exoneration:** "Because you are late, it doesn't matter, and I cannot be upset."
  *   **Principle:** You can validate the cause of the behavior without accepting the impact of the behavior. You can say, "I know your ADHD makes this hard, *and* it hurts me when you cancel last minute." Both things can be true.

  #### 2. Assess Effort and Mitigation
  Responsibility is not about perfection; it is about **mitigation**.
  *   Is your sister acknowledging the impact of her behavior?
  *   Is she actively using tools, therapy, medication, or strategies to manage it?
  *   **Principle:** If she is passively accepting her symptoms as an unchangeable fact ("I have ADHD, so I'm just late"), you are justified in holding her accountable. If she is actively struggling and trying to implement systems but still slipping up occasionally, that is where you adapt your expectations.

  #### 3. The "Agency Check"
  Your friend suggests treating her like someone with a physical disability. A better analogy is **chronic pain**.
  *   Someone with chronic pain cannot run a marathon. You wouldn't resent them for that.
  *   However, if their pain makes them irritable and they snap at you, you can understand the pain while still saying, "It's not okay to speak to me that way."
  *   **Principle:** Accommodate the *limitation*, but hold the *person* responsible for how they navigate it. She is not responsible for having ADHD; she is responsible for how she manages it in relation to others.

  #### 4. Reciprocity in Accommodation
  Accommodation must be a two-way street, even if the loads are uneven.
  *   **You adapt:** You stop expecting her to be on time for a 9:00 AM coffee; you suggest 10:30 AM or meet at her place.
  *   **She adapts:** She sets three alarms, she texts when she leaves the house, or she accepts that if she's 20 minutes late, she buys lunch.
  *   **Principle:** If you are the only one changing your behavior to keep the peace, you are enabling, not supporting. A healthy dynamic requires her to own the cost of her symptoms.

  #### 5. Resentment as a Signal, Not a Verdict
  Your friend says resentment is irrational. Reframe it: Resentment is a **boundary alarm**.
  *   If you feel resentful, it means the current level of accommodation is unsustainable for *you*.
  *   **Principle:** Instead of suppressing the anger (as your friend suggests) or exploding (which you want to avoid), use the resentment to renegotiate the terms. "I love you, but the constant lateness is making me not want to make plans. We need a new system."

  ### How to apply this to your sister

  You can validate your friend's point without accepting their conclusion. You might say to your sister:

  > "I know your ADHD isn't a choice, and I don't think you're doing this to hurt me. But when plans get forgotten or we're always late, I feel deprioritized. I want to support you, but I also need to feel respected. What systems can we put in place so I don't have to feel resentful, and you don't have to feel ashamed?"

  ### Summary
  Your friend is advocating for **unilateral accommodation** (you change to fit her).
  You are advocating for **relational integrity** (you both change to fit the relationship).

  The principled middle ground is **collaborative accountability**. You adjust your expectations to be realistic (she may never be "neurotypical" on time), but she retains the responsibility to mitigate the impact on you. If she refuses to acknowledge the impact or try to manage it, your resentment is not irrational; it is a rational response to a one-sided relationship.
