      *   **Philosophical Side:** *Methods of Ethics* ends with a "Dualism": Rational Egoism vs. Universal Benevolence (Utilitarianism). No rational resolution. Needs a "Moral Order" (God/Immortality) to harmonize them (Kantian postulate).
      *   **Empirical Side:** SPR work (telepathy, Census of Hallucinations, mediums like Piper). Aimed to find scientific evidence for survival after death to support the Moral Order. Sidgwick was skeptical/cautious compared to Myers.
      *   **Key Question 1:** Are these a single undertaking (rationalist vs. empiricist means) or incompatible standards of justification (practical postulate vs. empirical proof)?
      *   **Key Question 2:** Given the inconclusive evidence, should his intellectual honesty have obliged him to abandon the postulate (and thus the resolution to the Dualism)?
      *   **Requirement:** Justify with reference to his specific methodological commitments in both projects.

  2.  **Initial Analysis & Thesis Formulation:**

      *   *Connection:* They are definitely a single undertaking in terms of *motivation* (saving ethics from chaos), but they operate on distinct methodological tracks that create tension.
