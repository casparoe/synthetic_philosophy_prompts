      *   *Check:* Did I explain *why* they are incompatible? Briefly mention the geometry (NBS is tangent to a hyperbola, KSS is on the line connecting disagreement to ideal point).
      *   *Check:* Address the "distributive justice" part of the prompt. Philosophers might prefer KSS for egalitarian reasons, but economists might prefer NBS for efficiency/strategic reasons.

  8.  **Final Output Structure:**
      *   Introduction: Validate the setup, identify the critical error (incompatibility).
      *   The Impossibility Theorem: Explain that IIA and IM cannot coexist.
      *   The Case for IIA (Nash): Consistency, strategic foundation, independence from utopian ideals.
