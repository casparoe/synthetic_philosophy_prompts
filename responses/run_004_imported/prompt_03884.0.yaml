answer: |-
  You have hit upon one of the most famous and debated tensions in medieval political philosophy. Your reading is sharp: on the surface, Paragraph 46 (Christian patience, no resistance) and Paragraph 49 (public deposition, even by killing) seem to pull in opposite directions.

  However, most Aquinas scholars argue that this is not a contradiction, but rather a **jurisdictional distinction**. To understand how 46 and 48–49 fit together, we have to look at how Aquinas distinguishes between *private virtue* and *public justice*, and how he defines the source of political authority.

  Here is a breakdown of how to reconcile the passage, along with some necessary context about the text itself.

  ### 1. The Private vs. Public Distinction
  The key to unlocking the tension lies in Paragraph 47 and 48. Aquinas is not arguing about whether a tyrant *deserves* to be removed; he is arguing about *who has the standing* to remove him.

  *   **Paragraph 46 (The Private Sphere):** Here, Aquinas addresses the **individual Christian**. He appeals to the New Testament (1 Peter) to establish that a private person cannot take the law into their own hands. If a private individual kills a ruler, even a bad one, it is an act of "private presumption." In Aquinas's legal framework, this is murder/sedition, regardless of the victim's moral character. The reference to Aioth (Ehud) is dismissed here because Aquinas argues Aioth was acting as a divinely appointed "Judge" (a public deliverer), not a private citizen, and he was killing an occupying enemy (Moab), not a legitimate sovereign over Israel.
  *   **Paragraph 48–49 (The Public Sphere):** Here, Aquinas shifts to the **political community**. He argues that if the office of king is conferred by the multitude (or their representatives), the multitude retains a residual authority to protect the common good. When the "public authority" acts, it is not "assassination"; it is **deposition** or **execution of justice**.

  **The Synthesis:** Paragraph 46 forbids *murder* (private violence). Paragraph 49 permits *justice* (public removal). The act looks the same physically (the tyrant dies), but morally and legally they are opposites in Aquinas's system. One is a sin of sedition; the other is an act of political hygiene.

  ### 2. The Definition of "Public Authority"
  You asked if "public authority" is just a euphemism for "a sufficiently large or official-sounding group." In a modern liberal democracy, that skepticism is warranted. But in Aquinas's medieval context, "public authority" carries a specific metaphysical weight.

  For Aquinas, the King is not an absolute owner of the state; he is a **steward** or a **minister** of the community.
  *   In Paragraph 49, he explicitly uses contract language: *"he himself has deserved that the covenant with his subjects should not be kept."*
  *   If the King breaks the covenant (by becoming a tyrant), he forfeits his claim to authority. He reverts to being a private aggressor.
  *   Therefore, when the "multitude" (acting through its leading members, like the Senate) removes him, they are not rebelling against authority; they are **restoring** authority by removing a usurper who is acting without legal title.

  So, "public authority" does real work here: it transforms the act from a crime into a legal judgment. It is the difference between a vigilante hanging a criminal (forbidden) and the state executing a criminal (permitted).

  ### 3. The Historical Examples (Tarquin and Domitian)
  You are absolutely correct to be skeptical of the Domitian example historically. The assassination of Domitian was indeed a palace conspiracy (involving his chamberlain and wife) that the Senate ratified *post facto* with a *damnatio memoriae*.

  However, Aquinas is not writing as a modern historian; he is writing as a moral philosopher using **exempla**.
  *   **Tarquin:** This is the cleanest example for Aquinas. The Kings of Rome were traditionally seen as elected/confirmed by the Curiate Assembly. Expelling Tarquin was viewed in Roman tradition (which Aquinas inherits via Livy and Augustine) as a constitutional act by the people, not a murder.
  *   **Domitian:** Aquinas likely relies on sources (like Suetonius or Eutropius) that emphasized the Senate's subsequent condemnation. For Aquinas, the crucial point is that the **Senate** (the embodiment of public authority in Rome) declared the deeds null and void. He is less concerned with the ballistics of the assassination and more concerned with the *legitimation* of the act by the governing body.

  He uses these examples to show that there is a precedent for the *principle*: that a corporate body can remove a head of state who has become destructive to the body.

  ### 4. The "Christian Endurance" Tension
  This is the hardest part to reconcile. How can Christians be called to "patiently bear death for Christ" (Para 46) while also being told they can depose a tyrant (Para 49)?

  Aquinas distinguishes between **spiritual merit** and **temporal responsibility**.
  *   **Spiritually:** If I am persecuted for my faith, enduring it patiently gains me grace (Para 46). I should not kill the persecutor to save my own skin.
  *   **Politically:** If a ruler is destroying the common good (justice, peace, order), the community has a responsibility to the *neighbor* to stop him. Allowing a tyrant to ruin the community is not a virtue; it is negligence.

  Aquinas is careful in Paragraph 47 to note the danger: removing a tyrant often leads to worse tyranny. This is why he prefers non-lethal deposition ("have his power restricted") where possible. Killing is a last resort, permitted only when the public authority determines that the tyrant cannot be removed otherwise without greater harm to the common good.

  ### 5. A Crucial Textual Caveat
  It is worth noting a scholarly detail that might explain the "wobble" you feel. *De Regno* is an unfinished work.
  *   **Book I** is generally accepted as Aquinas's.
  *   **Book II** is widely considered to be the work of his student, **Ptolemy of Lucca**, who was more republican and more enthusiastic about tyrannicide than Aquinas.

  While Chapter 7 is in Book I, some scholars argue that even within Book I, Aquinas is treading carefully. In his later, more mature work, the *Summa Theologiae* (II-II, Q. 42, A. 2 and Q. 64, A. 3), Aquinas is even **more cautious**. In the *Summa*, he emphasizes that sedition is a mortal sin and suggests that tyrannical government should be tolerated if overthrowing it would lead to greater unrest. He places more emphasis on appealing to a "higher authority" (like an Emperor over a local king) rather than the multitude acting on its own.

  This suggests that in *De Regno*, Aquinas might be tailoring his advice to his patron (the King of Cyprus), trying to balance the need to advise kings on good rule with the theoretical possibility of resistance, without encouraging actual rebellion.

  ### Conclusion: Is it Consistent?
  There is a consistent **theoretical** position, even if the **practical application** is murky.

  1.  **Private individuals** may never kill a ruler (Para 46). That is murder and sin.
  2.  **Public authority** (the community acting corporately) may depose a ruler who has broken the political covenant (Para 49). That is justice.
  3.  **The Tension:** The difficulty lies in determining who constitutes "public authority" in a monarchy. If the King *is* the public authority, who judges him? Aquinas's answer (in Para 49) is that the authority ultimately resides in the multitude that appointed him, exercised through their leading men (like the Senate).

  You aren't missing a hidden trick; you are spotting the inherent friction in medieval constitutionalism. Aquinas is trying to square the circle of **divine right/order** (don't rebel against God's ordained order) with **natural law/justice** (a tyrant violates natural law and forfeits his office).

  Your friend's confusion is shared by centuries of commentators. The text holds together if you accept the rigid distinction between private vengeance and public justice, but it remains difficult because, in the real world (as with Domitian), the line between a "Senate decree" and a "palace conspiracy" is often blurred by the victors. Aquinas is prescribing how it *ought* to be legitimized, not necessarily describing how it always happens historically.
