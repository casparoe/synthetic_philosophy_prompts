answer: |-
  It is a pleasure to address a colleague who knows the War of Attrition (WoA) from the inside. Your intuition that the Dollar Auction (DA) and the WoA share a "family resemblance" is well-founded; both model situations where agents incur costs to secure a prize, and both allow for outcomes where total expenditure exceeds the value of the resource. However, your philosophy reading group was right to press for precision. While they describe similar *phenomenotypes* (escalation), their *genotypes* (formal structures and equilibrium concepts) differ significantly.

  Below, I set out the formal structures of both models, compare their mechanics, and offer a judgment on their respective explanatory powers regarding human escalation.

  ### 1. Formal Structure and Equilibrium Concepts

  #### The War of Attrition (WoA)
  *   **Context:** Symmetric contest over a resource of value $V$.
  *   **Strategy:** Each player chooses a persistence time $T \in [0, \infty)$.
  *   **Cost:** Cost accumulates continuously over time at rate $c$.
  *   **Payoffs:**
      *   Let $T_1$ and $T_2$ be the chosen times.
      *   The contest ends at $t = \min(T_1, T_2)$.
      *   **Loser:** Pays cost $c \cdot \min(T_1, T_2)$. Payoff: $-c \cdot \min(T_1, T_2)$.
      *   **Winner:** Gains $V$, pays cost $c \cdot \min(T_1, T_2)$. Payoff: $V - c \cdot \min(T_1, T_2)$.
      *   (Note: In some variants, the winner pays their own time cost, but the standard Maynard Smith model couples the cost to the duration of the contest, determined by the loser.)
  *   **Equilibrium Concept:** Evolutionarily Stable Strategy (ESS).
  *   **Solution:** There is no pure strategy ESS. If everyone plays a fixed time $T$, a mutant playing $T + \epsilon$ wins everything. The ESS is a **mixed strategy**: a probability distribution over persistence times (specifically, an exponential distribution $p(t) = \frac{c}{V} e^{-ct/V}$).
  *   **Key Feature:** The expected payoff for both players is **zero**. Escalation is not an error; it is the stable outcome of selection. Long contests occur with low probability but are part of the equilibrium distribution.

  #### The Dollar Auction (DA)
  *   **Context:** Sequential auction for a resource of value $V$ (e.g., \$1.00).
  *   **Strategy:** Players alternate bids in discrete increments.
  *   **Rule:** The highest bidder wins the resource and pays their bid. The **second-highest bidder pays their bid but receives nothing**.
  *   **Payoffs:**
      *   **Winner:** $V - \text{Bid}_{win}$.
      *   **Loser:** $-\text{Bid}_{lose}$.
  *   **Equilibrium Concept:** Nash Equilibrium (specifically Subgame Perfect Equilibrium in the sequential version).
  *   **Solution:**
      *   *Theoretically:* With common knowledge of rationality, the first player bids \$1 (or the minimum increment below) and the second player does not bid. The game ends immediately.
      *   *Observed:* Bidding escalates beyond $V$. Once a player has bid \$0.90 and is outbid by \$1.00, they face a choice: lose \$0.90 for sure, or bid \$1.10 for a chance to win \$1.00 (net -\$0.10). Rational choice *ex post* dictates bidding \$1.10 to minimize loss.
  *   **Key Feature:** The escalation is driven by a **dynamic inconsistency**. The rational strategy *ex ante* (don't start) conflicts with the rational strategy *ex post* (minimize sunk loss). The "trap" is institutional (the second-highest pays rule).

  ### 2. Structural Comparison: Is the Dollar Auction a War of Attrition?

  While both models generate escalation, the Dollar Auction is **not** formally a special case of the War of Attrition. They differ in three critical dimensions:

  **A. Cost Coupling vs. Decoupling**
  *   **WoA:** Costs are **coupled**. The duration of the contest (and thus the cost paid by the winner) is determined by the *loser's* decision to quit. I cannot force you to pay more by persisting; I can only force you to pay more by *not* quitting.
  *   **DA:** Costs are **decoupled**. My bid determines my cost; your bid determines yours. The "second-highest pays" rule creates a penalty for losing that is independent of the winner's expenditure. This decoupling allows the total cost (Bid1 + Bid2) to vastly exceed $V$, whereas in the WoA, the total cost is roughly $2 \times c \times T_{loser}$.

  **B. Information and Timing**
  *   **WoA:** Typically modeled as **simultaneous** choice of $T$ (or continuous time with incomplete information regarding the opponent's threshold). I do not know when you will quit.
  *   **DA:** A **sequential** game with **perfect information**. I know exactly what you bid. This allows for the specific psychological trap of "I have already invested $X$, I must recoup it."

  **C. The Nature of the Equilibrium**
  *   **WoA:** Escalation is **stable**. The mixed strategy ESS *predicts* that some contests will be very long. The system is in equilibrium when escalation occurs.
  *   **DA:** Escalation is **pathological**. In strict game-theoretic terms, bidding past $V$ is *not* a Nash Equilibrium. It is a deviation caused by bounded rationality, threat credibility, or the inability to commit *ex ante*. The DA describes a failure of rationality, whereas the WoA describes a stability of strategies.

  **Verdict:** The resemblance is **analogical, not identical**. The Dollar Auction is a specific institutional trap that *exploits* sunk cost fallacies. The War of Attrition is a general model of conflict where cost is the mechanism of selection. You could construct a "Dollar Auction version" of the WoA (where the loser pays a penalty), but the standard WoA does not contain the "second-highest pays" clause that defines the DA.

  ### 3. Explanatory Power for Human Escalation

  When applied to human contexts like litigation, price wars, or arms races, the two models offer different insights.

  #### The War of Attrition: Structural Explanation
  The WoA is superior for explaining **symmetric, attritional conflicts** where the primary mechanism is endurance and information is hidden.
  *   **Best Fit:** Price wars, trench warfare, strike actions.
  *   **Why:** In these scenarios, parties often do not know the opponent's "breaking point" (resource reserves, political will). The WoA correctly predicts that rational actors will engage in costly signaling and persistence without necessarily falling into a "trap." It explains why escalation happens even among fully rational (or evolutionarily fit) agents.
  *   **Limitation:** It assumes the costs are "burned" (time, energy, money spent) rather than "transferred" or "penalized." It does not capture the psychological anguish of the sunk cost fallacy well, because in the WoA, quitting is always the optimal response to a opponent who persists longer; there is no penalty for quitting other than the time already spent.

  #### The Dollar Auction: Psychological Explanation
  The Dollar Auction is superior for explaining **escalation of commitment** where public reputation, sunk costs, and institutional rules create a trap.
  *   **Best Fit:** Protracted litigation, bidding wars, political scandals.
  *   **Why:** Human escalation is rarely just about endurance; it is about *justification*. In litigation, the "second-highest pays" rule is metaphorically real: if you drop a suit after spending \$1M, that \$1M is gone (sunk), but if you spend \$1.1M to win a \$1M judgment, you have "saved" the initial investment (even if the net is negative). The DA captures the **shift from profit-seeking to loss-avoidance**.
  *   **Limitation:** It relies on a specific rule (loser pays bid) that doesn't literally exist in most conflicts. In an arms race, the loser doesn't pay the winner their costs; they just lose the strategic advantage. The DA is better at explaining the *internal psychology* of the escalator than the *external structure* of the conflict.

  ### 4. Judgment and Recommendation

  To answer your specific question: **The Dollar Auction is best understood not as a case of the War of Attrition, but as a distinct model of "Escalation of Commitment" that complements the WoA.**

  If your reading group is discussing **why** rational humans end up in irrational spirals, the **Dollar Auction** is the preferable model. It isolates the mechanism of the sunk cost fallacy and the dynamic inconsistency of sequential decision-making. It explains the *pathology* of human escalation—the feeling of being "in too deep to quit."

  However, if the group is discussing the **dynamics** of the conflict itself (e.g., why price wars last as long as they do, regardless of psychology), the **War of Attrition** is more robust. It provides a stable equilibrium where high costs are not errors, but expected outcomes of competition for a scarce resource.

  **Synthesis for Human Behavior:**
  Real-world human escalation is likely a hybrid. The *structure* often resembles the WoA (continuous costs, hidden thresholds), but the *decision-making* is governed by the logic of the Dollar Auction (loss aversion, sunk costs).
  *   **Example: Litigation.** Structurally, it is a WoA (who can afford to wait longer?). Psychologically, it is a DA (lawyers and clients refuse to settle because they cannot bear to realize the loss of past legal fees).

  **Conclusion:**
  Your intuition that they are related is correct in spirit: both deal with the economics of persistence. But formally, they are distinct tools. The WoA explains why conflict is costly; the Dollar Auction explains why conflict becomes *wasteful*. For a philosophy group interested in human rationality and moral hazard, the Dollar Auction offers richer terrain regarding the nature of commitment and the definition of rationality. For understanding the ecological or economic stability of the conflict itself, the WoA remains the gold standard.

  I would suggest to your group that the Dollar Auction is essentially a **War of Attrition with a "sunk cost penalty" attached to the losing strategy.** That penalty transforms a stable evolutionary contest into a psychological trap. Recognizing that distinction allows you to use both models without conflating them.
