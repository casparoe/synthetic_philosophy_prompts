      *My Defense of Resolute Choice:* If you accept Rational Irrationality, you admit that rationality is self-defeating. That's a bullet most philosophers don't want to bite. Resolute Choice saves rationality from being self-defeating. Therefore, Resolute Choice is the correct interpretation of why paying is rational.

