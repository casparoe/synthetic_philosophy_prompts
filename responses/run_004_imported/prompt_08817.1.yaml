      *   *Framing the "Honesty" Debate:* I need to bridge the gap. The CS teacher is technically right (no intent), but the English teachers are pedagogically right (harmful effect). The memo should argue that *functional honesty* is what matters in an educational context, even if *moral honesty* doesn't apply. We can use terms like "misleading output" instead of "lying" to satisfy the technical objection while addressing the practical harm.

