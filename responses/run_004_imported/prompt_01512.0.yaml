answer: |-
  **Setting:** *A quiet corner of the university coffee shop, late afternoon. Two formal epistemologists, **Elena** (defender of Reflection) and **Marcus** (critic), are clearing away empty cups. The whiteboard in Elena's office is visible through the glass wall behind them, still covered in probability trees from earlier.*

  **Marcus:** So, are you convinced? After two sessions on van Fraassen, do you buy the Reflection Principle?

  **Elena:** I think the intuition is robust. If I know that tomorrow I will believe $A$ to degree $r$, and I have no reason to think I've lost my grip on reality, why *wouldn't* I believe it to degree $r$ now? To do otherwise is to call my future self a liar or a fool without specific evidence.

  **Marcus:** But that "without specific evidence" clause is doing all the heavy lifting. Let's run the Ulysses case again. I know that tomorrow, after three martinis, my credence that I can drive home safely will shoot up to 0.9. Currently, it's 0.1. Reflection says: $C_{now}(\text{Drive} \mid C_{tomorrow}(\text{Drive}) = 0.9) = 0.9$.

  **Elena:** And that's absurd. But van Fraassen anticipates this. He says Reflection applies to *opinions* understood as commitments. When you're drunk, that isn't your *opinion* in the normative sense; it's a malfunction. You don't regard that future state as a legitimate exercise of your agency.

  **Marcus:** Exactly. So we add a restriction. We only reflect on future credences we deem "sound" or "rational." But this is where Christensen's objection bites. Once you filter for soundness, what work is Reflection doing? It just says: "Defer to future selves you currently trust." But I already know I should defer to selves I trust. That's not a formal constraint on credences; it's a substantive policy about evidence and reliability.

  **Elena:** I don't think it's merely substantive. Think about Probabilism. We say your credences must sum to one. But we implicitly assume you aren't suffering from cognitive paralysis or confusion. We don't say, "Probabilism holds, unless you have a migraine." We assume the agent is functioning. Reflection is the diachronic analogue of Probabilism. It's a coherence norm between time-slices of a single agent.

  **Marcus:** But the migraine clause *matters* for Reflection in a way it doesn't for Probabilism. If I have a migraine, my current credences might not sum to one, and we say I'm irrational. If I know I'll have a migraine tomorrow, Reflection doesn't tell me to defer to that future mess. The restriction isn't about *my* current functioning; it's about *my judgment of my future* functioning. That requires me to have a theory of when my future self is reliable. Reflection doesn't give me that theory. It just says, "Once you have that theory, obey it."

  **Elena:** That's too deflationary. It's not just "obey your theory of reliability." It's that stating a credence is a kind of promise. When I say, "My credence is $p$," I'm committing to betting at odds $p$. If I know I will update to $r$ tomorrow, and I don't set my current conditional credence to $r$, I'm setting myself up to be Dutch Booked. I'm planning to accept a series of bets that guarantee a loss.

  **Marcus:** Ah, the Diachronic Dutch Book. This is the second disanalogy I wanted to press. The synchronic Dutch Book for Probabilism is unavoidable. If your credences violate the axioms, there *exists* a set of bets you'd accept that loses money. You can't opt out without ceasing to have those credences. But the diachronic book? I can see the bookie coming.

  **Elena:** How so?

  **Marcus:** I can simply decline, in advance, to bet on facts about my own future credences. I can say, "I know tomorrow I'll believe $A$ is 0.9. I currently believe it's 0.1. I refuse to make any bets today that are contingent on what I believe tomorrow." If I opt out of that market, the Dutch Book vanishes.

  **Elena:** But opting out of that market is precisely what it means to lack a conditional credence. You can't have an opinion on $A$ while refusing to have an opinion on $A$ conditional on your future opinion. That's fragmentation. If you're a unified agent, you're in the market.

  **Marcus:** But why *must* I be a unified agent in that specific way? Suppose I know my future self is better informed. I want to defer. But suppose I know my future self is drunk. I want to ignore him. The Dutch Book argument only works if I'm *forced* to trade with my future self. But I'm not. I can pre-commit. In the Ulysses case, Ulysses ties himself to the mast. He *prevents* his future self from acting on his future credence. He knows Reflection will fail tomorrow, so he blocks the update. If Reflection were a genuine norm, Ulysses would be violating it by restraining his future self.

  **Elena:** No, Ulysses is respecting Reflection *now* by acknowledging that his future self's "credence" won't be a valid update. He recognizes that the condition $C_{tomorrow}(\text{Sirens}) = r$ will not be met in the relevant sense. The tying of the mast is the physical manifestation of the soundness restriction. He knows the future state won't be a rational response to evidence, so he doesn't conditionalize on it.

  **Marcus:** But who decides what counts as a "rational response to evidence"? *I* decide, right now. So the norm is just: "Conditionalize on your future credence if and only if you currently judge that future credence to be rational." But that's trivial. It reduces Reflection to: $C_{now}(A \mid C_{later}(A)=r \text{ and } \text{Later is Rational}) = r$. But since "Later is Rational" is a judgment I make *now*, the equation is just a tautology of my current confidence in my future rationality. It adds no structural constraint on the numbers themselves.

  **Elena:** It adds a constraint on how you process *learning*. Suppose you don't know *why* your credence changed. Maybe you got new evidence, maybe you got drunk. Reflection says: if you can't distinguish the cause, you must treat the change as evidence. If you think there's a 50% chance you're better informed and a 50% chance you're drunk, your current credence should be the weighted average. That's not trivial. It forces you to quantify your uncertainty about your own cognitive trajectory.

  **Marcus:** I grant that quantifying uncertainty is useful. But is it a *norm of rationality* or just a norm of *accuracy*? Probabilism is constitutive of belief. If you violate it, you don't just have inaccurate beliefs; you have incoherent ones. But if I violate Reflection because I think my future self is biased, I'm not incoherent. I'm just skeptical. The "soundness" restriction turns Reflection from a formal axiom into a substantive claim about the reliability of my cognitive processes. And formal epistemology shouldn't be in the business of telling me which cognitive processes are reliable.

  **Elena:** I think you're drawing the line between "formal" and "substantive" too sharply. Probabilism assumes logical omniscience. That's a substantive idealization. Reflection assumes *temporal* omniscience regarding one's own rationality. It's saying: "Treat your future self as an epistemic peer unless you have specific defeating evidence." That *is* a coherence norm. It's about the stability of agency. If you don't defer to your future self, you're essentially saying, "I am a better judge of the world than I will be, even holding evidence constant." That's a form of arrogance that invites exploitation.

  **Marcus:** It's not arrogance if I know I'm going to be tired! Look, let's go back to the Dutch Book. The synchronic bookie exploits a contradiction in your *current* dispositions. The diachronic bookie exploits a *change* in dispositions. But changes aren't contradictions. If I plan to update on evidence, I'm safe. If I plan to update on martinis, I'm not. The Dutch Book argument for Reflection only works if we assume I *must* plan to update on whatever happens to my credence. But I don't have to. I can plan to *reject* updates that don't look like conditionalization.

  **Elena:** But how do you reject them without violating Reflection? To reject the update is to say, "My future credence will be $r$, but I won't move to $r$." That means $C_{now}(A \mid C_{later}(A)=r) \neq r$. That is a direct violation of the principle. You're saying you know what you'll believe, and you know it's wrong, and you refuse to align.

  **Marcus:** I'm saying I know what I'll believe, and I know *why* I'll believe it. If the "why" is noise, I don't align. Reflection conflates "what I will believe" with "what I will be justified in believing." Van Fraassen tries to fix this with the commitment view, but it feels like a patch. He says, "I promise to believe $r$ tomorrow." But if I know I'll be drunk, I can't make that promise. So the principle only applies when I can make the promise. But when can I make the promise? When I trust my future self. We're back to square one. The principle is parasitic on a prior trust relation.

  **Elena:** It's not parasitic; it's *constitutive* of the trust relation. How do you model trust formally? Reflection *is* the model. To say "I trust my future self" *just means* to satisfy Reflection with respect to that self. If you don't satisfy it, you don't trust them. So it's not that Trust justifies Reflection; it's that Reflection defines Trust.

  **Marcus:** That's a neat verbal move, but it doesn't save the normativity. If Reflection just *defines* trust, then telling me I ought to satisfy Reflection is telling me I ought to trust my future self. But why ought I do that? Sometimes I shouldn't! Sometimes my future self is compromised. So the norm isn't "Satisfy Reflection." The norm is "Satisfy Reflection *when appropriate*." And since Reflection doesn't tell me *when* it's appropriate, it's incomplete.

  **Elena:** It's not incomplete; it's *pro tanto*. Probabilism doesn't tell you what evidence you have; it tells you how to structure credences given evidence. Reflection doesn't tell you if your future self is drunk; it tells you how to structure credences given your judgment of your future self. The "soundness" condition isn't a loophole; it's a scope condition. Just as Probabilism applies to propositions, Reflection applies to *rational updates*. If the update isn't rational, the principle doesn't engage. That doesn't make it trivial; it makes it precise.

  **Marcus:** But the scope condition is where all the epistemic work happens! Determining whether an update is rational requires assessing evidence, cognitive state, environmental factors... Reflection gives you zero help there. It's a hollow shell. It looks like a mathematical theorem, but it's really just a demand for consistency with whatever substantive theory of reliability you happen to hold.

  **Elena:** And Probabilism is a demand for consistency with whatever substantive theory of logic you hold. You don't think that makes Probabilism hollow. The point of formal epistemology isn't to generate beliefs from nothing; it's to constrain the relations between them. Reflection constrains the relation between time-slices. If you break it, you are diachronically incoherent. You are at war with yourself.

  **Marcus:** I'm not at war with myself if I recognize that I change. I'm just navigating a world where my cognitive faculties are fragile. The Dutch Book argument tries to show I'm irrational, but I can avoid the book by refusing to bet on my own mind. And the "commitment" view tries to show I'm breaking a promise, but I can't promise to be rational if I don't know I will be. Reflection demands a kind of transparency about my future rationality that I simply don't have.

  **Elena:** Then you don't have sharp credences. If you're that unsure about your own rationality, your conditional credences should be vague. But they still have to center on the expected value of your future credence, weighted by your confidence in its soundness. That *is* Reflection doing work. It's forcing you to put your uncertainty about your sanity into the probability calculus.

  **Marcus:** Maybe. But until the principle can distinguish between "I will change my mind because I learned something" and "I will change my mind because I'm drunk" without relying on my *prior* judgment of that distinction, it's not a standalone norm. It's a mirror. It shows me what I already think about my future self. It doesn't tell me what I *should* think.

  **Elena:** And Probabilism is a mirror too. It shows you if your beliefs sum to one. It doesn't tell you which beliefs to have. But we still call it a norm.

  **Marcus:** Because logic is necessary. My future rationality isn't. That's the gap. And I don't think a Dutch Book can bridge it.

  **Elena:** *(Smiling)* Then we'll have to agree to disagree. Until tomorrow, at least.

  **Marcus:** *(Checking his watch)* Speaking of which, I have a lecture in twenty minutes. My credence that I'll make it on time is 0.95.

  **Elena:** And your conditional credence, given that you believe that now, is...?

  **Marcus:** Let's not test the principle.

  *(They gather their things, the argument unresolved, hanging in the air like a conditional probability.)*
