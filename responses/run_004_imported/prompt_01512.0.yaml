      *   **Opening Salvo (Marcus):** Raise the Ulysses case. If Reflection demands I defer to my drunk future self, it's absurd. So we need a restriction.
      *   **Defense (Elena):** Van Fraassen's view. It's about commitment. I don't endorse the drunk self's credence as *mine*. Therefore, the condition $C_1(A)=r$ isn't satisfied in the relevant sense.
      *   **Counter (Marcus):** That's the "Trust" objection. You're just saying "Defer to selves you trust." That's not a formal norm; it's a substantive judgment about reliability. It collapses into "Follow the evidence."
      *   **Defense (Elena):** Push back on "Formal vs. Substantive." Probabilism also assumes idealization. Reflection is about *temporal consistency of agency*. It's not about evidence; it's about recognizing yourself over time.
      *   **The Dutch Book Turn (Marcus):** Attack the DB argument. Synchronic DB is unavoidable logic. Diachronic DB relies on a betting market that exists across time. I can just refuse to bet on my own future beliefs. I can pre-commit *not* to update.
      *   **Defense (Elena):** Refusing the bet is itself a violation of the commitment. If you state a credence, you accept the betting odds. To refuse is to lack an opinion. Also, the DB shows *planning* inconsistency.
      *   **Deepening the Critique (Marcus):** The "Soundness" restriction is doing all the work. If I have to check if my future self is "sound" before applying Reflection, Reflection isn't the constraint; the soundness check is.
      *   **Deepening the Defense (Elena):** The soundness check isn't external. It's internal to the concept of "my future credence." It's like saying "I promise to X, unless I'm coerced." The coercion clause doesn't invalidate the promise norm; it defines the scope of agency.
      *   **Closing:** Reiterate the stalemate. Is it a norm of rationality or a norm of ideal agency?

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I make the Dutch Book distinction clear?
