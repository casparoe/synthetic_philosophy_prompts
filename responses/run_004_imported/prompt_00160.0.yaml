prompt: |-
  I've been re-reading the Center on Long-Term Risk material on surrogate goals as a defense against acausal blackmail, and I brought it up with a friend from my local rationalist meetup last week, but something about the whole setup still doesn't sit right with me. As I understand basic game theory, a threat is only something to worry about if the threatener actually stands to gain from carrying it out — otherwise punishing you after you've already refused to comply is just costly to them with zero payoff, so it's an empty bluff that any sufficiently rational agent should simply ignore. If that's correct, then the entire apparatus of acausal threats, and the surrogate-goal machinery built to defend against them, seems to be solving a problem that a rational agent would never actually face, since no rational threatener would follow through once refusal has already occurred.

  So I'm trying to figure out what I'm missing here. Is there something about how these scenarios are modeled under decision theories like UDT or FDT that makes follow-through rational (or at least credible) in a way that standard backward-induction reasoning would rule out? Or is the value of surrogate goals more about hedging against threateners who aren't perfectly rational, or who can't be reliably distinguished from ones who are actually committed to following through? I'd appreciate a clearer picture of why decision theorists in this space treat the threat model as dangerous enough to warrant a defense like adopting a surrogate goal in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Surrogate goals as a defense against acausal blackmail (Center on Long-Term Risk - CLR).
      *   **User's Objection:** Standard game theory suggests threats are only credible if carrying them out is beneficial *ex post*. Once the victim refuses, punishing them is costly to the threatener with no gain. Therefore, a rational threatener wouldn't follow through, making the threat an empty bluff. Why worry about acausal blackmail at all?
      *   **Specific Questions:**
          *   Is there something about UDT/FDT that makes follow-through rational?
          *   Is it about hedging against irrational threateners?
          *   Why do decision theorists treat this as a serious threat warranting surrogate goals?
      *   **Context:** The user is familiar with rationalist meetups, CLR material, and basic game theory concepts (backward induction, credibility).

  2.  **Identify the Core Misunderstanding:**
      *   The user is applying *Causal Decision Theory (CDT)* or standard sequential game theory logic (backward induction) to a scenario designed for *Functional Decision Theory (FDT)* or *Updateless Decision Theory (UDT)*.
      *   In CDT, once the decision to comply/refuse is made, the threatener's decision is in the past (or causally independent). Thus, carrying out the threat is purely costly.
      *   In FDT/UDT, the threatener simulates the victim (or vice versa). The decision algorithms are logically linked. The threatener's decision to *make* the threat depends on their prediction of the victim's response. The victim's response depends on their decision algorithm.
      *   Crucially, the threatener's *commitment* to follow through is what makes the threat effective *ex ante*. If the threatener is known to be an FDT agent who pre-commits, they *will* follow through, even if it's costly *ex post*, because failing to follow through would have made them vulnerable to threats *ex ante*.

  3.  **Deconstruct the Argument:**

      *   **Point 1: The Nature of the Threatener.** The user assumes the threatener is a CDT agent (or acts like one *ex post*). But acausal blackmail specifically targets agents who reason about logical correlations. If the threatener is an FDT/UDT agent, they care about the output of their decision algorithm across all instances (including simulations).
      *   **Point 2: Pre-commitment and Reputation (Acausal).** In acausal trade/threats, "reputation" isn't about other people watching; it's about the logical consistency of your decision algorithm. If your algorithm says "I won't carry out costly threats," then blackmailers will blackmail you. If your algorithm says "I carry out threats to deter blackmail," you won't get blackmailed, but you might have to carry out a threat if someone calls your bluff.
      *   **Point 3: The "Rationality" of Follow-Through.** Under FDT, carrying out the threat *is* rational if it optimizes the output of the decision function across all possible worlds where that function is instantiated. It prevents the *condition* of being blackmailed.
      *   **Point 4: Surrogate Goals.** Why do we need them? Because if you are vulnerable to blackmail (e.g., you care about X, and they threaten X), you lose. If you shift your care to Y (surrogate) regarding blackmail scenarios, the threatener gains no leverage over X. But this only works if the threat model is real.
      *   **Point 5: Uncertainty.** Even if you think *you* are rational, you might be facing a threatener who *is* committed (e.g., a paperclip maximizer with a hard-coded threat policy). You can't distinguish perfectly.

  4.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by validating the user's intuition. It *is* the standard CDT view. It's the "commonsense" view. The confusion arises because acausal blackmail operates outside CDT.
