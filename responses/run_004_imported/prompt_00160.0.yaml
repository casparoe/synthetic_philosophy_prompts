      *   *The "Rationality" of Commitment:* Explain that for an FDT agent, being the *kind of agent* who follows through is the rational move, even if the specific act is costly. It's about selecting a policy, not an action.
      *   *The Role of Surrogate Goals:* Explain that surrogate goals aren't just for irrational threateners. They are for changing the payoff structure so that the threatener's optimal policy *doesn't involve threatening you*. If you care about paperclips instead of humans (in the blackmail context), a threat to kill humans doesn't work.
      *   *Uncertainty and Bounded Rationality:* Address the "hedging" point. Yes, we aren't sure if the threatener is FDT, CDT, or a hard-coded bot. Surrogate goals protect against the distribution of possible threateners.
