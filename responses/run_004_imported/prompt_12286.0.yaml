      *   **Impersonal Principles:** Many ethicists respond by shifting from "harming specific people" to "making the world worse" (Impersonal Total/Principle). A world with suffering people is worse than a world with happy people, even if they are different people.
      *   **Rights/Threshold Views:** Some argue there's a threshold of life worth living. If depletion leads to lives *below* that threshold, it's wrong, regardless of identity.
