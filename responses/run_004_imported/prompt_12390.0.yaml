answer: |-
  This is a fantastic question, and you have hit on exactly why this debate can feel opaque to outsiders. Your intuition is understandable: in a well-adapted organism, **history** (what a trait was selected for) and **current utility** (what a trait does now) usually line up perfectly. A heart pumps blood *now* because ancestors with pumping hearts survived *then*.

  However, philosophers treat this as a substantive debate rather than a terminological one because **the two accounts yield different truth values in specific, biologically crucial cases.** If they were just different vocabularies for the same facts, they would always agree on whether a trait has a function. They don't.

  Here is the breakdown of why they diverge, specifically using the vestigial examples you are already covering.

  ### 1. The Vestigial / "Leftover" Case
  This is the most direct hit for your story.

  *   **The Trait:** Wisdom teeth (or the male nipple, or the coccyx).
  *   **Causal Role (Cummins):** Asks, "What does this trait contribute to the organism's current capacity?"
      *   *Verdict:* If a wisdom tooth erupts and grinds food, it has a **function** (mastication). If a male nipple transmits sensory data, it has a **function** (sensation). It doesn't matter if evolution "meant" it to do that; if it contributes to the system's capacity now, it has a function.
  *   **Etiological / Selected Effects (Wright/Millikan/Neander):** Asks, "What was this trait naturally selected *for* in the ancestral past?"
      *   *Verdict:* Wisdom teeth were selected for grinding coarse, raw diets. In modern humans, they are often evolutionary leftovers that cause impaction. An SE theorist might argue they **lack a function** in modern humans (or are "dysfunctional") because they are no longer performing the task they were selected for, and they aren't being actively selected for a new task. The male nipple has **no function** because it wasn't selected for; it's a byproduct of female development.

  **The Clash:** For a Causal Role theorist, a vestigial organ that still *does* something has a function. For an Etiological theorist, a vestigial organ is, by definition, a trait that has lost its function (even if it still does *something*).

  ### 2. The Exaptation Case (The "Feathers" Problem)
  This is where the "history vs. now" split becomes stark.

  *   **The Trait:** Bird feathers.
  *   **The History:** Feathers likely evolved in dinosaurs for insulation or display, *not* flight. Later, they were co-opted for flight.
  *   **Causal Role:** Feathers contribute to flight capacity now. Therefore, their function is **flight** (and insulation).
  *   **Etiological:** The function is strictly tied to the selection history.
      *   *Verdict:* If we are talking about the *origin* of feathers, their function is **insulation**. Flight is only a function if there has been subsequent selection specifically for flight capabilities.
      *   *Why it matters:* If a biologist asks, "Why do feathers exist?" the Etiological account says "For insulation." The Causal Role account says "For flight." Both are factually true in different senses, but they answer different explanatory questions.

  ### 3. The "Disease" Case (The Philosophical Knockout)
  This is the argument that usually convinces people the debate is substantive. It concerns **malfunction**.

  *   **The Trait:** A human heart with severe congestive failure that is no longer pumping blood effectively.
  *   **Causal Role:** Asks, "What is this trait currently contributing?"
      *   *Verdict:* Since it is *not* pumping blood, it is not contributing to the circulatory capacity. Therefore, strictly speaking, **it currently has no function.** (Cummins actually accepts this; he views function as relative to a specific analysis of the system).
  *   **Etiological:** Asks, "What is this trait supposed to do based on its history?"
      *   *Verdict:* It **has the function of pumping blood**, even though it is failing to do so.
  *   **Why Philosophers Care:** The Etiological account captures the **normativity** of biology. It explains why we call the heart "broken." It is broken *relative to what it is supposed to do*. The Causal Role account struggles to explain "disease" without smuggling in historical assumptions, because if a trait isn't doing anything, CR says it has no function. SE says it has a function it is failing to perform.

  ### Why Philosophers Write Papers About This
  You asked why this isn't just a "difference in emphasis." It's because the choice of definition changes what counts as data in evolutionary biology.

  1.  **Reductionism vs. History:** The Causal Role account is favored by **physiologists and systems biologists**. They want to know how the machine works *now*. They don't care about the history; they care about the mechanism. The Etiological account is favored by **evolutionary biologists**. They want to know *why the machine exists*.
  2.  **Adaptationism:** If you use the Etiological definition, you cannot call something an "adaptation" unless you have evidence of past selection. If you use the Causal Role definition, you might accidentally label a lucky accident (a spandrel) as an adaptation just because it's currently useful. This leads to "Just-So Stories" in evolutionary psychology.
  3.  **The Vestigial Hook for Your Story:** This is your goldmine. When a doctor says, "The appendix is vestigial," they usually mean Etiological (it's a leftover from ancestors who digested cellulose). But when a researcher says, "The appendix serves as a reservoir for gut flora," they are using Causal Role (it contributes to immune capacity now).
      *   **The Conflict:** Is the appendix a "functionless leftover" or a "functional immune organ"?
      *   **The Resolution:** It depends on which definition of function you use. If it wasn't *selected* for the immune role (but just happens to do it), an Etiological purist says it's still vestigial. If it *is* currently selected for that role, it's no longer vestigial.

  ### Summary for Your Reporting
  You can frame it like this:
  *   **Causal Role** is the **Engineer's definition:** "What does this part do in the machine right now?"
  *   **Etiological** is the **Historian's definition:** "Why was this part installed in the factory originally?"

  Usually, the engineer and the historian agree. But when they disagree (like with wisdom teeth, male nipples, or a failing heart), you aren't just arguing about vocabulary. You are arguing about whether biology is defined by **current utility** or **evolutionary history.**

  For your story on vestigial organs, the "Etiological" definition is the one that validates the concept of "vestigiality." If you use the "Causal Role" definition, **true vestigial organs almost don't exist**, because if an organ does *nothing*, it atrophies away completely. If it's still there, it's probably doing *something* (even if minor), so a Causal Role theorist would say it still has a function. The very concept of a "useless leftover" relies on the Etiological view.
