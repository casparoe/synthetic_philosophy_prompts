answer: |-
  The hotel bar was down to the diehards. A few conference attendees huddled over laptops, and a couple of tourists nursing watery gins. Odile and Priya sat in a corner booth, the longlist spread across the table like a deck of cards nobody wanted to play. Most of the spines were cracked; two were still shrink-wrapped.

  Odile tapped a finger on one of the wrapped books. *The Meridian Line*.

  "I'm not going to read it," Odile said. Her voice was low, level. She wasn't testing Priya; she was stating a logistics report. "And not *The Glass Aviary*, either."

  Priya stopped halfway to her drink. "You're joking."

  "I wish I were. I have the grant proposal deadline on the fifteenth. I have three graduate students waiting on thesis drafts. And I have twelve books here that demand, collectively, about forty hours of deep attention each. The math doesn't work, Priya. Not for me."

  "So you're going to vote on them anyway?"

  "I am going to rank them. Yes." Odile took a sip of her wine. "I've sent *The Meridian Line* to Elias Thorne. You know Elias?"

  "The critic? From the *Review*?"

  "The same. His taste and mine overlap about ninety percent. When we diverge, it's usually because he's more patient with structural experimentation than I am. I trust his calibration. If he tells me the prose is luminous and the ending lands, I believe him. I'm not ranking them based on a whim. I'm ranking them on expert testimony."

  Priya set her glass down hard enough to slosh. "That's not a judgment. That's... administrative processing. You can't inherit somebody else's verdict on whether a book is good the way you can inherit a fact. You can tell me the treaty was signed in 1919, and I know that. But you can't tell me a book is moving and make me feel it."

  "I don't need to feel it," Odile said. "I need to know if it *is* good. There's a distinction."

  "Is there? In this room? On this panel?" Priya leaned forward. "We're not a data aggregation service. We're judges. The whole point is that we submit ourselves to the work. If you haven't submitted, you haven't judged."

  Odile sighed, rubbing the bridge of her nose. "This is the Acquaintance Principle, isn't it? You have to see the thing for yourself to validate the aesthetic claim."

  "I don't care what it's called. It's the only thing that makes this honest."

  "But why?" Odile pressed. "Let's step outside the library for a second. If my cardiologist tells me this medication is better than that one, I take it. I don't demand she walk me through the double-blind trials over dinner. I trust her expertise. I form a belief about the medication's efficacy based on her testimony. Why is literature a special category where testimony is worthless?"

  "Because medicine isn't about the experience of the patient," Priya said. "Well, it is, but the *truth* of the medicine exists outside of you. If the pill works, it works. Aesthetic value isn't like that. The value *is* the experience. If you haven't experienced it, the value hasn't happened for you. You're just holding a placeholder."

  "I'm not holding a placeholder. I'm holding a conclusion."

  "A conclusion without premises!"

  "Premises are for logic puzzles," Odile said sharply. "Look, Priya. We are tasked with identifying the best books of the year. If *The Meridian Line* is the best book of the year, and Elias knows it, and I trust Elias... then by ranking it highly, I am fulfilling my duty to the prize. I am helping the right book win. Does the universe care if I read page forty-two if Elias has already verified page forty-two is doing the heavy lifting?"

  "The universe might not. But the process does." Priya picked up one of the unread books, weighing it in her hand. "Think about moral testimony. If I tell you 'stealing is wrong in this specific context,' and you just say 'Okay, sure,' do you actually have moral knowledge? Or do you just have obedience?"

  Odile smiled, a thin, tired expression. "Ah. So now I'm morally bankrupt."

  "I'm saying there's a parallel. Philosophers argue about this. Some say you can't have moral knowledge on trust, because morality requires autonomous reasoning. You have to understand *why* it's wrong. If you don't understand why the book works, if you haven't felt the mechanism click into place, you don't know it's good. You just know *that* it's good. And that's not enough for a judge."

  Odile swirled her wine. "But is it autonomous reasoning? Or is it just privilege? Who gets the time to read every word, Priya? The retired professor? The independently wealthy? If I insist on the Acquaintance Principle as a hard rule, I'm saying that only people with infinite leisure can be judges. I'm doing this while running a department. I'm doing my best to triangulate the truth with the time I have."

  "Triangulate," Priya repeated. "That sounds like surveying. Not reading."

  "Isn't reading a form of surveying? Mapping the territory?"

  "Not if you're looking at someone else's map." Priya put the book down. "Here's the thing that scares me. If you rank *The Meridian Line* high, and I read it and think it's trash... we're going to be in that room arguing. You'll say 'Elias says it sings.' I'll say 'It sounds off-key to me.' How do we resolve that? We have no common ground. We haven't shared the object."

  "We share the trust," Odile said. "You trust me, don't you? You trust that I'm not trying to rig the prize for my publisher friends."

  "I trust your integrity. I don't trust your osmosis."

  Odile laughed, a genuine sound that drew a look from the bar staff. "Osmosis. I like that. But consider this: When we discuss the books we *have* all read, how much of my judgment is actually mine? How much is shaped by the blurbs I read before opening the cover? How much is shaped by the author's reputation? How much is shaped by the fact that you, whom I respect, looked at me during breakfast and said, 'The opening of *Glass Aviary* is stunning'? I've already primed the pump, Priya. We are all walking around with second-hand reactions masquerading as first-hand insights. I'm just being honest about the provenance."

  "That's different," Priya said, though her voice had lost some of its steel. "That's influence. This is substitution."

  "Is it? Or is it just admitting that 'reading' isn't a binary state? There's skimming, there's deep reading, there's reading for argument, reading for pleasure. And then there's reading via proxy. I'm not saying I know the book as well as you will. I'm saying I know its *merit* as well as you will."

  "But the merit is in the details," Priya insisted. "Elias might love the ending. But what if he loves it for a reason you hate? What if he thinks the ambiguity is profound, and you think it's cowardly? You're adopting his verdict without adopting his reasons. And a judgment without reasons is just a preference."

  Odile went quiet. She looked at the two shrink-wrapped books. For the first time, she looked less like a pragmatist and more like someone caught in a trap of her own making.

  "That," Odile said softly, "is a fair point. If I vote for it, I have to defend it in the final meeting. I can't say 'Elias liked it.' I have to say 'It worked.'"

  "Exactly."

  "So I have to pretend I felt it."

  "You have to engage with it enough to know *why* it worked, even if Elias told you where to look." Priya reached out and touched the plastic wrap on *The Meridian Line*. "Read the ending. Just the last fifty pages. If Elias is right, it'll carry you. If he's wrong, or if his reasons don't translate to you... then you can't vote for it. Not in good conscience."

  Odile stared at the book. The hum of the hotel fridge seemed to get louder.

  "I hate the idea that I'm gatekeeping based on labor," Odile murmured. "It feels elitist to insist on the full read."

  "It's not elitism," Priya said. "It's the job. We aren't ranking the books. We're ranking our encounter with the books. If you haven't encountered it, you can't rank it. You can recuse yourself. But you can't borrow my eyes, and you can't borrow Elias's."

  Odile picked up the book. She turned it over in her hands, feeling the weight of the pages she hadn't disturbed.

  "The Acquaintance Principle," Odile said, testing the words. "It's a bitch."

  "It's the only thing that makes the prize mean anything," Priya said. "Otherwise, we're just algorithms aggregating reviews."

  Odile sighed, a long exhalation that seemed to empty her lungs completely. She slid the book toward the center of the table, into the space between them.

  "Fifty pages," Odile said. "If I read the ending, will you let me off the hook for the middle?"

  Priya smiled, just a little. "I won't tell anyone you skimmed. But you have to read the ending yourself."

  "Deal." Odile signaled the waiter for the check. "But if the ending is trash, Priya, I'm blaming you for the overtime."

  "If the ending is trash," Priya said, gathering the other books into a stack, "then Elias owes us both an apology."
