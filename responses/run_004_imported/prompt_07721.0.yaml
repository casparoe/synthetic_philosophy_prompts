      *   *Proposal:* We keep wine but add a "Symposiarch."
      *   *Philosophy:* In *Laws*, Plato says drinking reveals character. It's a *basanos* (touchstone). But it needs a ruler.
      *   *Objection:* The "Dry" side says safety.
