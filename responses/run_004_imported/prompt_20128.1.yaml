answer: |-
  The highway cut through the salt flats like a zipper on a white jacket. Eli had been driving for fourteen hours. His lower back was a knot of hot wire, and his knees clicked when he pressed the pedals. He felt the way the old man in the book described: loaded with a body, worn out with living. The truck was a heavy thing, but his own flesh felt heavier.

  He pulled over at a rest stop that was mostly windblown debris and graffiti. There was no one else around. Just the heat shimmering off the asphalt and the dry rattle of sagebrush. Eli killed the engine, stepped out, and stretched until his spine popped. That was when he saw it.

  Half-buried in the dust near a concrete barrier lay a human skull. It wasn't bleached white like in the movies; it was stained the color of old tea, smooth and dry. It looked less like a memento mori and more like a discarded hubcap. Eli kicked it lightly with his boot. It rolled, hollow and light, coming to rest against his shoe.

  "Rough trip?" Eli asked. He didn't expect an answer. He was too tired to be spooked.

  He sat down on the warm concrete, leaning back against the barrier. The silence of the flats was absolute. There were no rulers here, no schedules, no invoices. He looked at the skull. It looked back with empty confidence. Eli felt a sudden, sharp envy. His own body was a list of maintenance issues: the liver spot growing on his wrist, the hearing loss in the left ear, the back that screamed every morning. The skull had no such complaints.

  "Mind if I borrow you?" Eli said.

  He took off his flannel shirt, balled it up, and placed the skull inside the bundle. He lay down on the bench, using the shirt-wrapped bone as a pillow. It was hard and cool against his neck. It felt solid, final. He closed his eyes, expecting the usual restless drift of sleep, the anxiety dreams about missed exits and braking failures.

  Instead, the dream was bright and weightless.

  The skull was there, but it had no body, just a voice that sounded like wind through a canyon. *You look tired,* the voice said. *Still carrying all that around?*

  "It's the job," Eli said in the dream. He was floating too, untethered.

  *The job of being alive,* the skull said. *Up there, you have bosses. You have taxes. You have to eat, and then you have to process the eating. You have to keep warm. You worry about what people think of your face. Down here, none of that. No rulers above, no subjects below. No seasons to rush you. We drift with the heaven and earth. Even being a king isn't as good as this. A king has to worry about losing the kingdom. We have nothing to lose.*

  "But you're dead," Eli said. "You don't get to feel the sun."

  *You think the sun is a benefit?* The skull laughed, a sound like dry leaves skittering. *You think because you're awake, you know what's real. Maybe you're the one who's dead, Eli. Maybe this is the dream. When you wake up, you'll have to go back to the back pain. Back to the hunger. Here, I don't hunger. I don't hurt. Why would I want to go back to being a man?*

  Eli tried to argue, but the logic slipped away like water. The skull's perspective was absolute. It wasn't a tragedy; it was a promotion.

  He woke with a start. The sun had dipped below the horizon, painting the salt flats in bruised purples. His neck was stiff, but the deep ache in his back had receded, numbed by the hard rest. He sat up and unwrapped the shirt. The skull sat there, indifferent.

  Eli rubbed his left arm. It had fallen asleep during the nap, tingling with pins and needles. He shook it out, watching the fingers twitch.

  "Well," Eli said to the skull. "You make a good point. But I'm not ready to clock out just yet."

  He stood up, his joints cracking. He looked at his numb arm, still buzzing with that strange, electric life. "Although, if this thing turns into a rooster, I hope it knows how to crow at dawn. I'm tired of setting alarms." He flexed his fingers. "And if my hips turn into wheels and my spirit becomes a horse, I won't need this truck anymore. I'll just roll."

  He laughed. It wasn't a happy laugh, exactly. It was lighter. It was the sound of someone realizing the burden they were carrying wasn't as sacred as they thought. The dread he'd felt all those miles back—the tightness in the chest when he thought about the end—felt like provincialism. He had been assuming that being Eli-the-Trucker was the only valid state of being. He had been mourning his own death while still breathing, assuming the next state was a loss rather than a change of shift.

  The Great Clod, the earth, had loaded him with this body. It had worn him out. It would ease him eventually. It wasn't a theft; it was a cycle.

  Eli picked up the skull. He weighed it in his hand. It was light, barely anything. He could bury it. He could take it to a lab. He could put it on his dashboard as a mascot.

  Instead, he set it back down on the concrete barrier, facing the road.

  "Enjoy the drift," Eli said.

  He climbed back into the cab. The engine turned over with a familiar grind. He checked the mirrors. The skull was still there in the side view, a small white dot against the grey concrete. He didn't feel compelled to save it. He didn't feel compelled to mourn it. It was just a shape the earth was done with, waiting to become something else.

  Eli shifted into gear. The truck lurched forward. His back twinged, a sharp reminder of the labor ahead. He welcomed it. It was just the price of the current form. He drove into the twilight, wondering idly if the salt flats would taste good if he ever became part of them, or if he'd come back as a hawk. Either way, the road was still there, and for now, he had wheels.
