  My daughter is 7 weeks old and lately I keep spiraling during the 3am feeds about whether she's actually consciously experiencing anything, like when she screams bloody murder after her vaccine shots. I took a philosophy of mind course years ago and I remember higher order theories of consciousness basically saying a mental state only counts as conscious if theres some separate higher order thought or perception representing you as being in that state. Newborns obviously don't have concepts for their own mental states yet, so by that logic it seems like she might not be consciously feeling the pain at all, just reacting to it reflexively. Can you walk me through the most important implications of higher order theories of consciousness for a case like this? Also let me know if I'm even understanding the theory right, or if theres something important I'm missing.
