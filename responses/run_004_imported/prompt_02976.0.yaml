answer: |-
  "Forty-five," said Mara, sliding the check across the table.

  "Forty-eight," Julian countered, not looking up from his napkin.

  They locked eyes. Both knew the other could calculate tip and tax in their sleep. Epistemic peers, perfectly matched.

  "So," Mara said. "We disagree. Given we're equally reliable, shouldn't we split the difference? Meet at forty-six fifty?"

  Julian shook his head. "Why? I distinctly remember the subtotal was thirty-five. I ran the numbers. Just because you got a different result doesn't erase my evidence."

  "But the fact of disagreement *is* new evidence," Mara insisted. "It signals likely error. Since I have no reason to think it's me rather than you, I have to downgrade my confidence. Holding firm is arrogance."

  "It's not arrogance, it's integrity," Julian shot back. "If I sincerely see the math as correct, bowing to your contrary view means ignoring my own reasoning. I'm not betting on who's smarter; I'm betting on the calculation in front of me. To conciliate is to pretend I don't see what I see."

  "So you're saying your reasoning trumps the statistical likelihood of error? That you're special?"

  "I'm saying my reasoning includes the fact that I checked it. You're asking me to treat my own mind as a black box identical to yours, but I live inside mine. I have access to my clarity; you only have access to my claim."

  Mara leaned in. "Okay, meta-question. We disagree on how to handle disagreements. I say conciliate. You say stay steady. By your own logic, shouldn't you conciliate on this rule too? If I'm your peer on philosophy, meet me in the middle on whether we should meet in the middle."

  Julian paused, a smirk touching his lips. "If I conciliate on steadfasticism, I become less steady. Which means I'm justified in staying steady. It's self-sealing."

  "That's circular," Mara groaned.

  "It's coherent," Julian corrected. "So, are we conciliating on the bill?"

  "I'm suspending judgment until the card machine speaks."

  "And I'm paying forty-eight. Trust me."

  "I trust you. I just don't trust us."
