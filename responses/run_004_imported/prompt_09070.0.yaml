  # Handout: The Verisimilitude Trap
  **Seminar: Popper & The Logic of Scientific Discovery**  
  **Topic:** The Tichý/Miller Impossibility Result (Concrete Illustration)

  ### 1. The Intuition
  We want to say that even though most scientific theories are strictly false, some are *closer to the truth* than others. 
  *   **Newtonian Physics** is false (strictly speaking), but it seems closer to the truth than **Aristotelian Physics**.
  *   Popper tried to formalize this using **Truth-Content** ($Ct_T$) and **Falsity-Content** ($Ct_F$).
  *   **Popper's Definition:** Theory $A$ is more verisimilar than Theory $B$ if:
      1.  $Ct_T(B) \subseteq Ct_T(A)$ ($A$ has all the truths $B$ has, and maybe more)
      2.  $Ct_F(A) \subseteq Ct_F(B)$ ($A$ has no more falsehoods than $B$, and maybe fewer)
      *(With at least one inclusion being strict.)*

  ### 2. The Toy Example: The Gemstone Analysis
  Let's move away from the weather. Imagine we are gemologists analyzing a specific, unknown stone. There are three binary properties we care about:
  *   $R$: The stone is **Red** (vs. Blue)
  *   $H$: The stone is **Hard** (vs. Soft)
  *   $V$: The stone is **Valuable** (vs. Common)

  **The Truth ($T$):** The stone is actually **Red, Hard, and Valuable**.
  $$T = R \land H \land V$$

  Now, consider two competing theories proposed by our lab:

  **Theory $E$ (The Expert):**  
  The Expert gets two out of three right. They identify the color and hardness correctly but miss the value.
  $$E = R \land H \land \neg V$$
  *(Intuition: This is a very good theory. It is "close" to the truth.)*

  **Theory $N$ (The Novice):**  
  The Novice gets everything wrong. They guess the opposite on all three counts.
  $$N = \neg R \land \neg H \land \neg V$$
  *(Intuition: This is a terrible theory. It is "far" from the truth.)*

  ### 3. Running Popper's Machinery
  According to our intuition, $E$ should be more verisimilar than $N$. Let's test if $E$ satisfies Popper's two conditions against $N$.

  #### Condition 1: Falsity-Content ($Ct_F$)
  For $E$ to be better, its class of false consequences must be a subset of $N$'s false consequences ($Ct_F(E) \subseteq Ct_F(N)$). In plain English: *Every false statement entailed by the Expert must also be entailed by the Novice.*

  *   **Consider the statement:** $S_1 = \text{"The stone is Red and Common"}$ ($R \land \neg V$).
  *   **Is $S_1$ false?** Yes. The truth is $V$ (Valuable), so "Common" ($\neg V$) is false.
  *   **Does Theory $E$ entail $S_1$?** Yes. $E$ explicitly asserts $R$ and $\neg V$.
  *   **Does Theory $N$ entail $S_1$?** **No.** $N$ asserts $\neg R$ (Blue). $N$ logically contradicts $S_1$.
  *   **Result:** $S_1$ is in $Ct_F(E)$ but *not* in $Ct_F(N)$.
  *   **Verdict:** **Condition 1 Fails.** The Expert has a specific false consequence that the Novice avoids.

  #### Condition 2: Truth-Content ($Ct_T$)
  For $E$ to be better, the Novice's true consequences must be a subset of the Expert's ($Ct_T(N) \subseteq Ct_T(E)$). In plain English: *Every true statement entailed by the Novice must also be entailed by the Expert.*

  *   **Consider the statement:** $S_2 = \text{"The stone is Blue or Valuable"}$ ($\neg R \lor V$).
  *   **Is $S_2$ true?** Yes. Even though "Blue" ($\neg R$) is false, "Valuable" ($V$) is true. In logic, a disjunction is true if at least one part is true.
  *   **Does Theory $N$ entail $S_2$?** Yes. $N$ asserts $\neg R$. If $\neg R$ is true, then ($\neg R \lor V$) is automatically true.
  *   **Does Theory $E$ entail $S_2$?** **No.** $E$ asserts $R$ (Red) and $\neg V$ (Common). $E$ entails that both parts of $S_2$ are false. Therefore, $E$ entails that $S_2$ is *false*.
  *   **Result:** $S_2$ is in $Ct_T(N)$ but *not* in $Ct_T(E)$.
  *   **Verdict:** **Condition 2 Fails.** The Novice entails a true statement that the Expert rules out.

  ### 4. The Collapse
  Popper's definition requires **both** conditions to hold. In this example:
  1.  The "better" theory ($E$) fails the Falsity-Content test because being more specific about the truth ($R$) while being wrong about something else ($V$) creates *new* specific falsehoods ($R \land \neg V$) that the totally wrong theory ($N$) doesn't commit to.
  2.  The "worse" theory ($N$) accidentally passes up on Truth-Content because being wrong about $R$ allows it to entail true disjunctions ($\neg R \lor V$) that the "better" theory contradicts.

  **Conclusion:** According to Popper's formal definition, **Theory $E$ is not more verisimilar than Theory $N$.** In fact, the two theories are logically incomparable on these metrics. If we tweak the logical structure slightly (as Tichý and Miller proved generally), we can even construct cases where the totally wrong theory $N$ formally ranks *higher* than the expert theory $E$.

  ### 5. Discussion Question for Next Week
  The problem stems from **logical strength**. To be "closer" to the truth, a theory usually needs to say more (be stronger). But if a theory is already false, increasing its strength inevitably increases its falsity-content faster than its truth-content. 

  *Does this mean we should abandon the idea of "approximate truth" entirely, or does it just mean Popper's specific logical machinery was the wrong tool for the job?*
