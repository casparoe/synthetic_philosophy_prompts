answer: |-
  1. **FDT vs. Precommitment Strategies**
  Many critics argue that Functional Decision Theory is essentially Causal Decision Theory augmented by a binding precommitment device, akin to David Gauthier's "constrained maximization" or Edward McClennen's "resolute choice." In those frameworks, the rationality lies in the *past* act of binding oneself, whereas CDT governs the execution. Why should we view FDT as a distinct normative theory of the decision *moment* rather than just a description of an agent who successfully precommitted? If the "functional" output is determined by the algorithm's source code, isn't that just a causal chain initiated in the past?

  *   **Follow-up:** You'll likely reply that FDT doesn't require a temporal precommitment, but rather evaluates the logical output of the decision procedure *now*. But if the physical instantiation of that procedure is causally isolated from the predictor's simulation at the time of choice, what metaphysical "glue" connects your current computation to the past prediction without invoking backward causation or a mysterious non-causal link?

  2. **The Explanatory Power of Subjunctive Dependence**
  FDT relies heavily on the notion of "subjunctive dependence" to justify why an agent's choice correlates with a predictor's prior simulation. Skeptics worry this is a label applied post-hoc to whatever correlations yield the "correct" FDT verdict, rather than a rigorous causal or logical mechanism. Can you specify the necessary and sufficient conditions for subjunctive dependence to obtain between two physical systems without simply asserting that "the math works out"?

  *   **Follow-up:** If you argue that dependence holds whenever two systems run isomorphic algorithms, how do you handle cases where the predictor uses a heuristic approximation of your decision process that is 95% accurate but structurally different? Does dependence vanish at the point of structural divergence, even if predictive accuracy remains high?

  3. **Degradation of Verdicts under Imperfect Prediction**
  Parfit's Hitchhiker typically assumes a highly reliable lie detector, but real-world trust is rarely Omega-grade. In CDT, the prescription to pay degrades smoothly as the probability of the driver detecting a lie drops. Does FDT offer a continuous degradation of verdicts as the predictor's reliability falls from 99% to 51%, or is there a sharp cliff-edge where the "subjunctive dependence" snaps and the theory suddenly advises defecting?

  *   **Follow-up:** If you argue for a smooth degradation based on expected utility, doesn't FDT effectively collapse into Evidential Decision Theory (EDT) in these probabilistic regimes? If so, what substantive work is the "functional" component doing beyond what EDT achieves with standard conditional probabilities?

  4. **Exploitability and the Blackmail Problem**
  A common objection to disposition-based theories is that being knowably disposed to cooperate makes an agent vulnerable to exploitation by strategic adversaries, such as blackmailers who threaten to release damaging information unless paid. FDT proponents claim the theory avoids paying blackmail because the payment doesn't subjunctively influence the *issuing* of the threat. How does an FDT agent formally distinguish the Hitchhiker case (where dependence is beneficial) from the Blackmail case (where dependence is parasitic) without building in an ad-hoc rule against blackmail?

  *   **Follow-up:** You will likely distinguish them based on whether the action influences the *existence* of the problem versus the *outcome* of the problem. But if a blackmailer simulates you to decide *whether* to blackmail, your decision procedure *does* logically influence the threat's existence. Why doesn't FDT compel paying the blackmailer in that specific setup, and if it does, how is that not exploitable?

  5. **FDT vs. Evidential Decision Theory (EDT)**
  FDT and EDT often agree on cases like Newcomb's Problem and Hitchhiker, diverging primarily on "Newcomb-like" problems where causal and evidential links come apart (e.g., the Smoking Lesion). Since FDT requires complex modeling of logical counterfactuals while EDT relies on standard conditionalization, what is the pragmatic advantage of FDT in the real world where agents rarely encounter perfect predictors but frequently face confounding common causes?

  *   **Follow-up:** If you argue that FDT avoids the "spurious correlations" that plague EDT, isn't that merely because FDT implicitly assumes a causal structure regarding the algorithm's implementation? If so, isn't FDT just CDT that has been secretly smuggled with EDT's evidential tracking for specific variables?

  6. **The Formalism of Logical Counterfactuals**
  The mathematical backbone of FDT involves reasoning about "logical counterfactuals"—what would happen if a mathematical truth (like the output of a computation) were different. However, there is currently no consensus in logic or computer science on how to formalize counterpossible reasoning without triviality. Until we have a rigorous calculus for logical counterfactuals, isn't FDT more of a philosophical intuition pump than a computable decision procedure?

  *   **Follow-up:** You might suggest that bounded agents use approximations of logical counterfactuals. But if the approximation error is non-zero, doesn't the agent risk making decisions based on false logical implications, potentially leading to dominated strategies in high-stakes environments?

  7. **Time Consistency and Self-Modification**
  One of FDT's selling points is time consistency: an FDT agent shouldn't wish to self-modify into a different decision theory later. However, if an FDT agent enters an environment where other agents can only detect its *causal* responses (not its functional source code), wouldn't the FDT agent wish to self-modify into a CDT agent to avoid being penalized for "acausal" commitments that aren't recognized by the environment?

  *   **Follow-up:** If you argue that the agent should maintain FDT because it might encounter *other* FDT-sensitive agents later, aren't you relying on a prior about the distribution of the universe's problems? Doesn't this make FDT's superiority contingent on empirical facts about the world rather than a priori rationality?

  8. **Bounded Rationality and Computational Tractability**
  FDT requires an agent to model not only the world but also itself (or its own source code) as part of the decision calculation. For a bounded agent with limited computational resources, this self-referential modeling risks infinite regress or prohibitive computational costs. How does FDT prescribe a decision for an agent that literally cannot compute the logical implications of its own algorithm within the time allowed for the decision?

  *   **Follow-up:** If you suggest the agent uses a simplified self-model, doesn't that open the door for predictors to exploit the gap between the simplified model and the actual decision process? How does FDT prevent the "modeling overhead" from becoming a vulnerability in adversarial settings?

  9. **Normative Force and Instrumental Rationality**
  Finally, let's address the normative claim. You argue FDT is the correct account of *instrumental* rationality—getting what you want. But if an agent knows they are in a one-off universe where no predictors exist and no logical correlations hold, CDT and FDT yield the same results. Why should we adopt FDT as a fundamental normative standard rather than a heuristic for specific high-correlation environments, given that it demands a more complex ontology of decision-making?

  *   **Follow-up:** You'll likely say that we don't know we're in such a universe, and FDT dominates in the multiverse of possible problems. But if the "cost" of FDT is accepting subjunctive dependence as a primitive, isn't the simpler theory (CDT) preferable by Occam's Razor unless the frequency of Newcomb-like problems is empirically demonstrated to be high?
