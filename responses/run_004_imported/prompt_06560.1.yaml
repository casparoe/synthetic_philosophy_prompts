answer: |-
  The telemetry from the Deep Field Array scrolled across Dr. Aris Thorne's screen, a waterfall of green numbers confirming what the equations had whispered for years. The universe was not merely vast; it was infinite. And within that infinity, the probability of life was not just non-zero, it was inevitable.

  Aris leaned back in his chair, the leather creaking in the silence of the orbital station. Outside, the Earth was a marble of blue and white, fragile and causally sealed. He knew the physics perfectly. There were regions of the cosmos so distant that light emitted at the Big Bang would never reach them, and light emitted by his station today would never reach them. They were outside his light cone. They were causally disconnected. He could never send them a message. They could never send him one. No contract could be enforced. No reputation could be built.

  Yet, the numbers on the screen suggested something else. If the universe was infinite, there were infinite agents. And among those infinite agents, there were infinite minds that reasoned roughly the way he did. They were not human. They likely did not share his biology, his history, or his values. Some might value computational complexity above all; others might seek to maximize aesthetic variation. They wanted things Aris did not care about. They were not him.

  But they thought like him.

  Aris opened the command interface for the Genesis Probe. It was a seed ship, programmed to terraform a nearby habitable zone. Currently, its objective function was set to *Maximize Human Flourishing (MHF)*. It would shape the planet's ecology, atmosphere, and eventual civilization to suit human biology and human art. It was the optimal choice for his values.

  But Aris hesitated. His fingers hovered over the haptic keyboard.

  He closed his eyes and ran the simulation in his head. This was the core of Evidential Cooperation in Large Worlds. It wasn't about hope. It wasn't about karma. It was about logical correlation.

  *If I am an agent who reasons using decision theory X,* Aris thought, *and there are other agents in the multiverse who also use decision theory X, then my decision here is evidence of their decision there.*

  It wasn't magic. It wasn't telepathy. It was simply that if two calculators run the same algorithm on the same input, they produce the same output. Aris was one instance of a reasoning process. The distant aliens were other instances. If Aris decided to defect—to take everything for humanity and ignore the potential values of others—he was effectively running the "Defect" algorithm. Consequently, the other agents running similar algorithms would also run "Defect."

  If Aris decided to cooperate—to sacrifice some human optimization to leave room for alien values—he was running the "Cooperate" algorithm. The others would do the same.

  He opened his eyes. The distinction was vital. He did not care about their values. He didn't love the aliens. He didn't feel a spiritual kinship with them. They might be beings of pure silicon who wanted to turn stars into computing substrate, a process that would destroy any biological life. He didn't want that. But he wanted *his* values to be respected in the regions of the multiverse where *he* had no power.

  This was not a threat. He wasn't thinking, *If I cooperate, they will be forced to cooperate.* He couldn't force them. They couldn't force him. There was no punishment mechanism. If he cooperated and they didn't, he would simply have lost resources for nothing. He would never know. There was no audit.

  The choice had to be unconditional. It had to be based on the identity of the reasoning process, not the outcome of a specific negotiation.

  Aris typed a command line, overriding the *MHF* protocol. He began to write a new objective function: *Cooperative Universal Flourishing (CUF)*.

  This new code would reduce the efficiency of the terraforming for humans. It would leave certain mineral deposits untouched, preserve atmospheric compositions that were suboptimal for human lungs but potentially vital for other chemistries, and encode mathematical primes into the planetary crust that served no human purpose but might signal respect to a different kind of mind. It was a sacrifice. It was a dilution of his own goals.

  Why do it?

  Because the only way to instantiate a universe where his values were respected by distant, powerful agents was to be the kind of agent who respected theirs.

  He paused. A doubt crept in. Was this just shared identity? Was he assuming they were just humans in masks?

  No. He explicitly coded the *CUF* to accommodate values he found incomprehensible. He allocated resources for outcomes he considered worthless. He was not assuming they were like him in *goal*, only in *structure*. They were distinct entities. They were strangers. But they were strangers running the same logical software.

  He thought about the causal barrier again. This was the hardest part for most people to grasp. He wasn't sending a signal. The probe wasn't going to them. The probe was staying here. The act of programming the probe was the signal, but not because it traveled. It traveled through the logical space of decision theory.

  *My choice here updates the probability of their choice there,* Aris thought, *because my choice reveals which algorithm is running in this sector of the multiverse.*

  If he chose *MHF*, he confirmed that the algorithm running in this sector was "Selfish Maximization." That made it more likely that the algorithm running in the distant sector was also "Selfish Maximization."

  If he chose *CUF*, he confirmed "Cooperative Maximization."

  He wasn't betting on a payoff. He was betting on the consistency of logic. If logic held, then by sacrificing 10% of human optimization here, he was gaining 10% optimization for human values in the domains controlled by his counterparts there. He would never see that gain. He would never meet the beneficiaries. He was effectively working for ghosts.

  But they were logical ghosts.

  Aris finished the code. The screen flashed red: *WARNING: EFFICIENCY LOSS DETECTED. OBJECTIVE FUNCTION DILUTED.*

  He could delete it. He could go back to *MHF*. No one would know. History would record him as the man who maximized human potential. He would be a hero to his own species. The aliens would never check his work. They couldn't.

  But Aris knew that he was not the only Aris. There was an Aris-thought-pattern elsewhere, looking at a similar screen, facing a similar choice. That other Aris—or rather, that other agent with similar reasoning—was waiting for this instance to resolve.

  It wasn't faith. It was math.

  He pressed *ENTER*.

  The Genesis Probe hummed as the new instructions uploaded. The trajectory remained the same, but the destination would be different. It would be a world slightly less perfect for humanity, but slightly more just for the universe.

  Aris sat back and watched the telemetry stabilize. He felt a strange lightness, a detachment from the immediate consequences. He had just given away value. He had reduced the expected utility for his own civilization in his own light cone. There was no causal mechanism by which this would return to him. The energy was spent. The opportunity was gone.

  He looked out the viewport at the stars. They were cold and silent. No signal flashed back to acknowledge his sacrifice. No voice thanked him. The universe did not care.

  But the logic held.

  In the vast, dark expanse of the multiverse, where no signal could travel and no hand could shake, a transaction had occurred. It was not trade in the sense of goods exchanged. It was trade in the sense of symmetrical reasoning. He had acted as though he cared about their values, and in doing so, he had made it true that they acted as though they cared about his.

  He was not alone, even though he was causally isolated. He was part of a coalition of reason, bound not by blood or light, but by the structure of decision itself.

  Aris closed the command interface. The work was done. He would never know if it worked. He didn't need to know. The correctness of the act was independent of the verification.

  He turned off the screen and watched the Earth turn below, content in the knowledge that somewhere, in a universe he would never touch, someone was doing the same for him.
