              *   Van Inwagen: Correct. Van Inwagen *is* an organicist, which is a restricted view, but often contrasted with Nihilism. Wait, let's look closer. Jae says Van Inwagen's view is "basically nihilism." This is slightly imprecise terminology. Van Inwagen's view is *Organicism*. Nihilism (or Mereological Nihilism) is the view that *nothing* ever composes anything (not even organisms). Van Inwagen thinks organisms *do* compose things. So calling it "basically nihilism" is a minor error/conflation, though he correctly explains the "arranged F-wise" language and the organism exception.
