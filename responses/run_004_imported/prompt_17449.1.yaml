      *   *Nuance:* Hume distinguished between money and credit. He hated public debt. The US deficit is funded by debt (Treasuries). Hume would see this as dangerous "paper credit."
      *   *Le Chatelier:* Keep returning to this. The system is under stress. The "concentration" of dollars in China is the disturbance.
