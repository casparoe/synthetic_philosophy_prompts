answer: |-
  This is a fantastic case study. It isolates the tension between the *source* of promissory obligation (the act of will vs. the consequence of reliance) and the *duration* of that obligation (does it survive the relational context?). Your study group has essentially recreated a classic debate in contemporary deontology between Scanlonians and Will Theorists (like Raz or Owens), using the "Death of the Promisee" problem as the stress test.

  Here is the move-by-move breakdown, followed by an assessment of the theories and the missing ingredient.

  ### Move-by-Move Analysis

  **(1) Sana: The Scanlonian Opening**
  *   **Assessment:** **Sana has the better of it.**
  *   **Why:** She correctly identifies the core of Scanlon's Principle F. The obligation arises from the intentional induction of expectations. In the moment the promise was made, the grandfather relied on Marcus. This is the standard, strongest formulation of the expectation view. It grounds the duty in a concrete moral wrong (manipulating someone's expectations) rather than a metaphysical mystery.

  **(2) Marcus: The Ontological Objection**
  *   **Assessment:** **Marcus has the better of it.**
  *   **Why:** This is the "Death of the Promisee" objection, and it is lethal to a *purely* psychological expectation view. If the wrong is *currently* disappointing someone or violating a *current* trust, death removes the victim. If the obligation vanishes when the brain stops firing, then posthumous promises are meaningless. Marcus correctly identifies that our intuition (that the promise still binds) outruns the theory's current explanatory power.

  **(3) Sana: The Posthumous Defense**
  *   **Assessment:** **Sana has the better of it.**
  *   **Why:** She successfully parries by time-indexing the expectation. We accept that we can wrong the dead (defamation, breaking wills) based on expectations or rights they held *while alive*. By arguing that the *creation* of the expectation is the moral trigger, not the *ongoing existence* of the mental state, she preserves the Scanlonian framework. The "harm" is the betrayal of the trust that *was* placed, not necessarily the feelings of the trustor *now*.

  **(4) Marcus: The "Normative Power" Accusation**
  *   **Assessment:** **Marcus has a point, but Sana is not cornered.**
  *   **Why:** Marcus is philosophically sharp here. He notices that if the obligation survives the death of the expectation, it starts looking like the *act* created a freestanding normative fact (Will Theory). However, he overstates the concession. Sana can argue that the *reason* we respect past expectations is still grounded in the value of not exploiting trust, whereas Will Theory says the reason is the exercise of authority. She hasn't abandoned Expectation; she has just clarified its temporal scope. Marcus wins the rhetorical point, but not the theoretical kill.

  **(5) Sana: The "Joke/Coercion" Counter-Punch**
  *   **Assessment:** **Sana wins decisively.**
  *   **Why:** This is the classic Achilles' heel of the Will/Normative Power view. If promises bind simply because I "will" an obligation into existence, then I should be bound by promises made in jest, under hypnosis, or at gunpoint (since I still "willed" the words). Scanlon's Expectation view handles this effortlessly: no *reasonable* expectation was induced in those cases. Marcus has no internal resource in Will Theory to explain why jokes don't bind without importing Scanlon's reliance criteria.

  **(6) Marcus: The Dig-In**
  *   **Assessment:** **Stalemate, leaning Sana.**
  *   **Why:** Marcus holds his ground on the intuition (it feels wrong), but he concedes he lacks a theoretical account for *when* promises bind (Move 5). He is left with a robust intuition but a broken theory. Sana is left with a slightly modified theory that handles both the Death case (via Move 3) and the Joke case (via Move 5).

  ### Do Any Theories Survive the Grandfather Case?

  **Hume (Artificial Virtue):** **No.**
  Hume views promises as a social convention invented to facilitate cooperation. In Marcus's case, the promise is *secret*. Breaking it yields zero social fallout and damages no general convention (since no one knows it existed). For a strict Humean, if the utility of the convention isn't served and no public trust is damaged, the obligation is weak or non-existent. Hume struggles to explain why we owe duties in total secrecy.

  **Scanlon (Principle F):** **Survives, but requires modification.**
  As Sana showed, Scanlonianism survives if we accept that we can owe duties to the dead based on past reliance. However, this stretches Scanlon's "What We Owe to Each Other" framework, which is typically grounded in reciprocal relations among living agents. It requires adding a principle of "Respect for Past Agency" to the Expectation view.

  **Will/Normative Power (Raz/Owens):** **Fails without external constraints.**
  As Marcus noted, this view explains the "Death" case perfectly (the obligation was created, it exists independently). However, as Sana noted in Move 5, it fails to explain the *limits* of promising. It cannot distinguish between a solemn vow and a joke without borrowing the "reasonable reliance" criterion from the Expectation view.

  ### The Third Ingredient

  Neither Expectation nor Will is sufficient on its own. The "Grandfather Case" reveals that a complete theory needs a third ingredient: **The Value of Autonomy (or Normative Standing).**

  *   **Why Expectation isn't enough:** As Marcus argued, the psychological state (expectation) is gone.
  *   **Why Will isn't enough:** As Sana argued, willing isn't enough (jokes).
  *   **The Synthesis:** The promise binds because the Grandfather had the **normative standing** to direct his legacy, and by promising, Marcus granted the Grandfather **authority** over that specific decision.
      *   This explains the **Death** case: The Grandfather's *authority* to dispose of his property doesn't vanish at death (just as a will is valid after death).
      *   This explains the **Joke** case: One cannot grant authority in a context where normative standing is suspended (like a joke or coercion).

  This moves the debate from "Psychology vs. Magic" to "Interpersonal Authority." The obligation survives because Marcus is respecting the Grandfather's *agency*, not just his feelings (Expectation) or his magical speech act (Will).

  ### Verdict

  Sana successfully defended her framework against the death objection by appealing to posthumous wrongs, and she landed a decisive blow against Marcus's alternative by exposing its inability to handle jokes; Marcus identified a genuine tension but offered no working alternative theory to replace the one he critiqued.

  \verdict{Sana}
