      *Refining the Voice:* The narrator shouldn't sound like a modern academic. She needs to sound like a 1824 radical who has read the manuscripts. She needs to use his terminology (felicific calculus, sanctions, ascetic principle). Bentham should sound like Bentham: precise, slightly repetitive, avoiding emotional admissions.

