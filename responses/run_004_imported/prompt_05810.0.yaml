      *   **Scenario:** Interviewing Jeremy Bentham (aged 76 in 1824) about law reform, but secretly probing his unpublished manuscripts on sexual morality (which were historically suppressed for decades/century).
      *   **Tone:** Intellectual friction, not costume drama. No anachronistic "progressive" praise. The narrator needs to press on the *mechanics* of his reasoning (Utilitarianism/Felicific Calculus).
      *   **Structure:** 8-10 interview questions, each paired with a likely Bentham response (cagey, logical) and a specific follow-up question that creates friction.
      *   **Specific Requirements:**
          1.  Question on "asceticism" vs. "disgust" (why doesn't public disgust count as pain in the calculus?).
          2.  Question on the limits of the calculus (scandalous acts beyond the obvious).
          3.  Question on Jesus vs. Paul (authority on sexual matters).
          4.  Question on development over time (30 years of drafts: did the argument change or just his nerve?).
          5.  Final Question on the irony of "Publicity" vs. "Silence" (the check on power).
      *   **Character Voice:** Narrator needs to be sharp, informed, slightly dangerous. Bentham needs to be precise, defensive but rational, perhaps weary.

  2.  **Historical & Philosophical Grounding:**
      *   **Bentham in 1824:** He's 76. He's the "Sage of Queen Square." He's deeply involved in the *Westminster Review* (Mill, Place, etc.). He is known for codification, prisons (Panopticon), and law reform.
      *   **Sexual Writings:** *Of Sexual Irregularities* (written earlier, unpublished), *Not Paul, But Jesus* (1823). He argued against penalties for non-procreative sex, sodomy, etc., based on the lack of assignable harm. He distinguished between "asceticism" (religious/moral denial of pleasure) and the utilitarian pursuit of happiness.
      *   **The Conflict:** Utilitarianism says maximize pleasure/minimize pain. Public disgust *is* a pain. So why ignore it? Bentham's answer is usually that "groundless" prejudices shouldn't legislate, but the *feeling* of disgust is real. The narrator needs to poke this hole.
      *   **Publicity:** Bentham's motto: "Publicity is the very soul of justice." Hiding these manuscripts contradicts this.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Warm-up/Setup):* Need to establish the law reform cover before pivoting. Let's start with the definition of harm.
