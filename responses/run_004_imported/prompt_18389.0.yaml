answer: |-
  Here are eight interview questions designed to probe the structural weaknesses of the act-type theory of propositions, tailored to your background in formal semantics and your specific concerns about Bradley's Regress.

  ### 1. The Relocation of Bradley's Regress
  **Question:** "Many of us came to the act-based view hoping it would dissolve Bradley's Regress—the worry that a list of constituents needs a 'glue' to become a truth-apt unity. Your view suggests the 'glue' is the cognitive act of predication itself. But doesn't this merely relocate the regress? If an act is a complex event with constituents (the agent, the property, the object), what unifies *those* parts into a single act? If you say the act is 'primitive' or 'inherently unified,' haven't you just applied the label 'unity' to the act without explaining how it achieves what the tuple could not?"

  **Follow-up:** "She will likely reply that acts are *sui generis* events that don't require further glue because they are occurrences, not static objects. Press this by asking: 'If the unity is intrinsic to the occurrence, does that mean the unity is temporal? If so, how does a temporally extended act capture the atemporal unity required for a proposition to be true *simpliciter*?'"

  ### 2. Directionality and Constituent Order
  **Question:** "One of the classic failures of the tuple view is explaining directionality—why predicating *loving* of John and Mary differs from predicating it of Mary and John. You argue the act of predication solves this. But when I perform the act, I am not just listing items; I am relating them. Does the act-based picture actually explain *why* the predication targets the object in a specific order, or does it simply assume the agent already grasps the directional structure of the relation? In other words, does the act inherit its directionality from the very structured content it was supposed to ground?"

  **Follow-up:** "She will likely argue that the cognitive act mirrors the causal or attentional structure of the agent's interaction with the world. Challenge this by asking: 'If the directionality depends on the agent's attention, does that mean the proposition's truth conditions shift depending on how the agent attends to the scene, or is there a fact of the matter about the act-type independent of the token performance?'"

  ### 3. Unentertained Propositions
  **Question:** "Let's talk about propositions no one has ever entertained, like complex necessary truths in mathematics or facts about the pre-human universe. If propositions are types of cognitive acts, how do these exist without tokens? If you appeal to *merely possible* acts to ground them, aren't you implicitly relying on the conditions that make those acts possible? And aren't those conditions just the structured tuples (objects and properties arranged specifically) that your theory was designed to replace? It seems we might be back to the 'list dressed up as a fact' problem, just modalized."

  **Follow-up:** "She will likely distinguish between the *type* (which exists abstractly) and the *token* (which requires a mind). Push back by asking: 'If the type exists without any tokens, in what sense is it still a *cognitive* act? At that point of abstraction, what ontological work is the word "act" doing that "structured abstract object" wouldn't do better?'"

  ### 4. Truth and Accuracy Conditions
  **Question:** "If a proposition is an act of predicating a property of an object, we need to know when that act is 'correct.' Usually, we say a proposition is true if the world matches it. But if the proposition *is* the act, are we saying the act is accurate if the world matches the *content of the act*? This seems circular. How do you specify the accuracy conditions of the act without referencing a state of affairs that is already propositionally structured? Are you smuggling the truth-maker in through the back door of 'accuracy conditions'?"

  **Follow-up:** "She will likely argue that accuracy is a primitive relation between the act and the world. Ask: 'If accuracy is primitive, does that mean we can't analyze truth in terms of representation? And if we can't analyze it, does the act-based view actually offer more explanatory power than the realist view it seeks to displace, or does it just offer a different vocabulary for the same primitive relation?'"

  ### 5. Compositionality and Formal Semantics
  **Question:** "Coming from a formal semantics background, I rely on compositionality: the meaning of a complex expression is determined by its parts and their mode of combination. Your view maps nicely onto this syntactically, but ontologically, it seems to struggle. If the 'mode of combination' is a cognitive act, how do we compose acts? Do we have an act of combining acts? If the semantic value of a sentence is a potential act, how do we handle operators like negation or modality without multiplying cognitive acts into strange, nested entities that no human actually performs?"

  **Follow-up:** "She will likely suggest that complex acts are built from simpler act-types. Ask: 'If the complex act-type is built from simpler ones, what binds them together into a single propositional unit? If it's another act, we face a regress; if it's not, what is the binding mechanism that isn't just the structural relation we started with?'"

  ### 6. The "Grasp" Problem
  **Question:** "You argue that to understand a sentence is to be disposed to perform a certain cognitive act. But to be disposed to perform an act of predicating $F$ of $a$, don't I already have to identify $a$ and $F$ as the relevant constituents? Doesn't the ability to perform the act presuppose that I have already grasped the unified proposition? If so, the act doesn't explain the unity; it presupposes it. How do you break out of this circle to show that the act *constitutes* the grasp rather than *expressing* a prior grasp?"

  **Follow-up:** "She will likely claim that the grasp *is* the disposition, not a prior state. Ask: 'If the grasp is identical to the disposition, how do you account for cases where I understand a proposition but am currently unable to perform the act (due to distraction or incapacity)? Does the proposition cease to be grasped, or does that imply the proposition exists independently of the disposition?'"

  ### 7. Falsehood and Misrepresentation
  **Question:** "Act-based views are often praised for handling falsehood better than picture theories. If I predicate *being red* of a blue ball, I've performed a real act, even if it's inaccurate. But what makes it an act of predicating *redness* rather than *color* generally? To specify the act type precisely enough to be false, don't we need to fix the content precisely? And if we fix the content precisely, haven't we reified the content into an object that the act is 'about,' thereby reintroducing the gap between the act and the object that the theory wanted to close?"

  **Follow-up:** "She will likely argue that the act is intrinsically specific. Ask: 'If the act is intrinsically specific, does that mean the mind has a kind of magical intentionality that fixes reference without external conditions? If not, aren't the external conditions doing the unifying work, making the "act" merely the vehicle rather than the essence of the proposition?'"

  ### 8. Ontological Parsimony
  **Question:** "Finally, a meta-ontological question. The traditional view posits abstract objects (propositions) and concrete objects (minds). Your view posits act-types, which seem to be abstract objects that are essentially tied to concrete minds. Have we actually gained ontological parsimony? Or have we simply complicated our ontology by hybridizing abstract types with concrete tokens, without solving the underlying metaphysical puzzle of how mind-independent truth arises from mind-dependent activities?"

  **Follow-up:** "She will likely argue that the gain is explanatory, not ontological. Ask: 'If the gain is purely explanatory, but the formal semantics remains isomorphic to the tuple view (as it must to preserve logic), is the act-based view a metaphysical thesis or a psychological gloss on the standard model? And if it's just a gloss, does it really solve the dissertation-stopping problem of unity, or just describe what unity feels like from the inside?'"
