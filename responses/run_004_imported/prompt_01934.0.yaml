answer: |-
  This is a sharp objection, and you're right to sense that it cuts to the bone of the proportionality strategy. In the literature, this is often grouped under "level-sensitivity" objections or the "problem of effect individuation." It's been pressed by folks like McLaughlin, McGrath, and more recently by Lei Zhong.

  You want the argument formalized and assessed for its refutational power, specifically regarding whether Yablo has a principled way to fix the grain. Here is the strongest version of that argument, followed by the best available Yabloian defense and an assessment of its viability.

  ### The Argument: The Proportionality Grain Problem

  **P1 (Relativity of Proportionality):** Whether a cause property $C$ satisfies Yablo's proportionality constraint (Required + Enough) is logically relative to the individuation of the effect property $E$.
  *   *Justification:* If $E$ is coarse-grained (e.g., *pecking*), a determinable $C$ (e.g., *red*) is proportional. If $E$ is fine-grained (e.g., *pecking-at-time-t-with-force-f*), $C$ fails the "Required" condition (a determinate is needed) or the "Enough" condition (the determinable doesn't guarantee the specific fine-grained outcome), and a determinate $C^*$ (e.g., *scarlet*) becomes proportional.

  **P2 (The Closure Pressure):** The Causal Exclusion Argument derives its force from the Causal Closure of the Physical (CCP). CCP asserts that every *physical* event has a sufficient *physical* cause.
  *   *Justification:* To solve exclusion, one must show that mental properties are causes of the *very same effects* that physical properties are claimed to cause. If the mental causes $E_{coarse}$ and the physical causes $E_{fine}$, and $E_{coarse} \neq E_{fine}$, the exclusion problem is not solved but dissolved by changing the subject (the "Dual Explananda" problem).

  **P3 (Physical Privilege in Individuation):** If effects are individuated according to the standards required for CCP to hold (i.e., precise physical events), then physical realizers are invariably more proportional than mental properties.
  *   *Justification:* Mental properties are multiply realizable. Therefore, for any specific physical effect $E_{phys}$, the mental property $M$ is too coarse to be *Required* (since different realizers could produce $E_{phys}$) or *Enough* (since $M$ doesn't guarantee the specific physical micro-structure of $E_{phys}$). The physical realizer $P$ fits $E_{phys}$ perfectly.

  **C (The Gerrymandering Conclusion):** Proportionality does not metaphysically secure mental causation against exclusion; it merely shifts the debate to effect individuation. Without a principled, non-question-begging constraint on effect individuation that privileges the mental grain *independently* of our explanatory interests, proportionality renders causal attribution interest-relative, thereby failing to establish mental causation as a robust metaphysical relation capable of resisting physicalist exclusion.

  ---

  ### The Yabloian Defense: Principled Individuation

  Can a Yabloian block P3 or C? They cannot deny P1 (it's definitional). They must argue that there is a **principled constraint on effect individuation** that prevents the "gerrymandering" to the physical grain.

  **The Defense:**
  Yablo (and defenders like List & Menzies) argue that effects are not bare physical events but are inherently typed by the context of the causal transaction. Specifically, for actions, the effect is individuated by the **content of the intention** or the **functional role** of the behavior.
  1.  **Action Individuation:** When Sophie pecks, the relevant effect is *pecking at a target*, not *contracting muscle fiber M*. The latter is a *constituent* or *realization* of the effect, not the effect itself in the context of agency.
  2.  **Metaphysical Fit:** The mental property is not "too coarse" because the effect is not "that fine." The demand for millisecond precision is a demand from *physics*, not from *causation*. Causation is a relation between properties at a level appropriate for the entities involved.
  3.  **Blocking the Switch:** Therefore, it is not arbitrary to choose the coarse grain. It is mandated by the nature of the relata. You cannot screen off the mental cause by switching to a physical effect because that physical event is not the *causal effect* of the action; it is the *physical realization* of the causal effect.

  **Assessment of the Defense:**
  This defense is coherent, but it comes at a cost. It effectively concedes that **causation is level-relative**.
  *   **The Cost:** If causation is level-relative, then the mental causes the *functional* effect, and the physical causes the *physical* effect. This looks suspiciously like the "Dual Explananda" strategy.
  *   **The Exclusion Residue:** The physicalist can reply: "Fine, the mental causes the *action*. But the *action* supervenes on the *physical movement*. The physical movement is fully caused by the physical realizer. If the mental property doesn't influence the physical movement *over and above* the physical realizer, in what sense does it causally produce the action?"
  *   **Verdict:** The Yabloian avoids the charge of *arbitrary* gerrymandering by appealing to the metaphysics of action/functional kinds. However, this does not fully satisfy the exclusion worry if one insists that *all* causal work must ultimately be traceable to the physical base (the "Causal Drainage" worry). The Yabloian must bite the bullet that causal work does not need to be traceable to the physical base to be real.

  ### Bonus: Bennett and List & Menzies

  **Karen Bennett (2003):**
  Bennett's solution relies on counterfactuals to deny overdetermination. She argues $P$ and $M$ don't compete because $M$ doesn't cause $E$ *in addition* to $P$; $M$ causes $E$ *via* $P$.
  *   **Vulnerability:** She faces a version of your grain problem. For her counterfactuals to hold (e.g., $\sim M \square \rightarrow \sim E$), $E$ must be specified such that the mental makes a difference. If $E$ is the fine-grained physical event, the counterfactual might fail (if $M$ had been absent, $P^*$ might have occurred, causing $E$). Bennett relies on the claim that in the nearest world where $\sim M$, $\sim P$ as well. But if the effect is fine-grained, the physical realizer's specificity threatens to break the counterfactual dependence on the mental. She is vulnerable to the grain problem unless she also adopts a level-relative view of effects.

  **List & Menzies (2009):**
  They explicitly adopt the proportionality/difference-making account.
  *   **Handling the Grain:** They handle your objection best by **embracing** the relativity. They argue causation is inherently level-relative. There is no "one true grain."
  *   **The Move:** They argue that higher-level causation is *autonomous*. It is not in competition with lower-level causation. The physical cause is proportional to the physical effect; the mental cause is proportional to the mental effect.
  *   **Verdict:** They dodge the "gerrymandering" charge by denying there is a single hierarchy to gerrymander. However, this requires rejecting the premise that causal closure implies the lower level is the *only* level where "real" causation happens. If your seminar assumes a robust physicalism where the physical level is ontologically privileged, List & Menzies will look like they are changing the subject. If your seminar allows for non-reductive ontology, their solution is robust.

  ### Bottom Line for Your Seminar

  Your lunch objection holds water as a critique of proportionality as a **metaphysical silver bullet**.
  1.  **It is not a refutation** if one accepts that causal relations are interest-relative or level-relative (List & Menzies).
  2.  **It is a refutation** if one demands that a solution to exclusion must show mental properties affecting the *physical* world in a way that respects physical closure without shifting the explanandum.

  The Yabloian cannot have it both ways: they cannot claim the mental causes the *same* effect as the physical (to satisfy the intuition of unified causation) while using proportionality to screen off the physical (which requires differentiating the effects' grain). They must argue that the "same effect" description is ambiguous, and relative to the *correct* description (the functional one), the mental wins. Whether that satisfies a Kim-style physicalist is the remaining battleground.

  **Recommendation:** Frame your objection not as "Proportionality is arbitrary," but as "Proportionality solves exclusion only by accepting level-relativity of causation, which concedes that mental causation does not operate on the closed physical domain in the way robust physicalism requires." That forces the Yabloian to defend the ontology of levels, not just the logic of proportionality.
