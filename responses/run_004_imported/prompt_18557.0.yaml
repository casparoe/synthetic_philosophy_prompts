      *   *Structural Mismatch* is also good. How does the structure of cosmic experience map onto human experience?
      *   *Decision:* I will focus primarily on the **Subject-Summing/Individuation Problem** because it highlights the symmetry of the difficulty most clearly. I will also touch upon the **Structural Mismatch** (quality/structure) to strengthen the argument.

