prompt: |-
  Panpsychists disagree about the direction in which phenomenal priority runs. Micropsychists locate the fundamental subjects of experience at the micro-physical level, and consequently face the well-known combination problem: how could countless micro-subjects combine to constitute a single macroscopic subject such as you or me? Cosmopsychists, such as Itay Shani and Yujin Nagasawa, invert this priority relation, holding that the cosmos as a whole is the one fundamental subject of experience, and that finite subjects like us are in some sense derivative of it. Compare the combination problem facing micropsychism with the structurally analogous problem facing cosmopsychism. Does inverting the direction of metaphysical priority genuinely dissolve the original difficulty, or does a problem of comparable severity simply reappear running in the opposite direction? Defend your answer with reference to at least one specific strand of the combination problem, such as the subject-summing problem or the problem of structural mismatch between micro- and macro-experience.
