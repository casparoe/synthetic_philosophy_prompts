answer: |-
  **The Unfoundable Foundation: Why the Boundary Problem Is Insoluble**

  The question of who constitutes "the people" is the silent precondition of democratic theory. Without a bounded *demos*, there can be no vote, no constitution, and no rule of the majority. Yet, as Frederick Whelan famously demonstrated, any attempt to define that boundary using democratic procedures generates a vicious regress: to vote on who votes presupposes a prior decision about who is entitled to cast that ballot. In recent decades, theorists like Robert Goodin and Arash Abizadeh have attempted to cut this Gordian knot with substantive moral principles—the All-Affected-Interests (AAI) principle and the All-Subjected principle, respectively. They argue that by grounding membership in moral facts (interests or coercion) rather than procedural votes, we can escape the circularity.

  This essay argues that these attempts, while morally compelling, fail to solve the *democratic* boundary problem. They do not escape the regress; they merely relocate it from the domain of procedure to the domain of moral epistemology, or they dissolve the very notion of a bounded polity that the problem seeks to justify. The strongest position, contra Goodin and Abizadeh, is Whelan's: the boundary problem is genuinely insoluble in principled, democratic terms. This is not a defeat for democracy, but a correction of its self-understanding. Democracy cannot be its own foundation; it is a practice of ongoing contestation that must accept its own arbitrary beginnings. The search for a non-circular democratic justification for the *demos* is a category mistake.

  **The Logic of the Regress**

  To understand why the proposed solutions fail, we must first grasp the severity of Whelan's regress. The problem is not merely practical; it is logical. Democratic legitimacy is typically derived from the consent or participation of the governed. But if the extent of "the governed" is itself up for grabs, any procedure used to determine it lacks legitimacy. If a current citizenry votes to admit new members, that vote is only legitimate if the current citizenry was legitimately constituted. If they were not, the vote is an act of exclusion by an unauthorized body.

  Sofia Näsström extends this to the constituent power. A people cannot author a constitution because the "people" as a legal entity only come into existence *through* the constitution. There is a temporal and logical gap: the constituent power must exist before the constitution, but it only gains political identity from the constitution. Any attempt to fill this gap democratically presupposes the very authority it seeks to create. Thus, the boundary of the *demos* always rests on something pre-democratic: history, violence, geography, or culture. Whelan's conclusion is stark: there is no democratic solution to the boundary problem.

  **The False Escapes: AAI and All-Subjected**

  Proponents of the AAI and All-Subjected principles claim to bypass this regress by appealing to external moral standards. Robert Goodin argues that we need not vote on who belongs; we simply look to the facts of causality. If a decision affects you, you deserve a say. Since almost all decisions have some global ripple effect, Goodin accepts that the *demos* for most decisions should be nearly global. This avoids the regress because the boundary is fixed by empirical facts about interests, not by a prior vote.

  However, Goodin's move does not solve the boundary problem; it evaporates it. The boundary problem arises because we assume democracy operates within bounded polities (states). By expanding the *demos* to the globe, Goodin removes the need for boundaries, but he does not explain how a specific, bounded democratic agency can legitimately constitute itself. Furthermore, AAI shifts the justificatory burden from *democratic procedure* to *moral truth*. Determining whose interests are affected is itself a contestable judgment. Who decides which interests count? Who assesses the probability of indirect effects? If we vote on that, we are back in the regress. If we appoint experts, we have abandoned democracy. AAI provides a moral constraint on democracy, but it cannot serve as the democratic foundation for the *demos* itself.

  Arash Abizadeh's All-Subjected principle attempts a similar end-run. He argues that legitimacy requires inclusion for all those subject to coercion. Crucially, he applies this to border control: since border laws coerce outsiders by preventing entry, outsiders must have a say in those laws. This seems to solve the regress by asserting a moral right that precedes the boundary.

  Yet Abizadeh's argument suffers from a similar displacement. To say that outsiders are "subject to coercion" presupposes a jurisdiction that claims the authority to coerce them. The regress re-emerges at the level of jurisdiction. Why does *this* state have the authority to enforce borders that coerce *those* outsiders? If the answer is "because the insiders voted for it," we are circular. If the answer is "because of a moral principle," we have again substituted moral philosophy for democratic theory. Moreover, if the All-Subjected principle is applied consistently, it implies that the *demos* must be fluid, changing with every coercive law. This makes stable self-government impossible. A *demos* that cannot fix its boundaries cannot act as a collective agent. Abizadeh successfully shows that closed borders are illegitimate under strict democratic theory, but he does not show how a legitimate bounded *demos* can be constructed. He proves the impossibility of the state, not the possibility of the solution.

  **The Verdict: Insolubility as Insight**

  We must therefore accept Whelan's conclusion: the boundary problem is insoluble in principled democratic terms. There is no logical formula, no moral principle, and no procedural mechanism that can non-circularly define the *demos* from within democratic theory. The *demos* is always, in the final analysis, a political fact that precedes its own justification.

  This conclusion is often met with the objection that it renders democracy illegitimate. If the foundation of the *demos* is arbitrary or undemocratic (based on history or force), does that not poison all subsequent democratic decisions? This is the "fatal flaw" objection. If the boundary is unjustified, the laws passed within that boundary are tainted by the original exclusion.

  This objection, however, relies on a foundationalist view of legitimacy that democracy cannot sustain. It assumes that for a political order to be legitimate, it must be justified from the ground up, like a geometric proof. But political legitimacy is not architectural; it is recursive. The lack of a democratic foundation for the boundary does not invalidate the system; it necessitates that the boundary remain perpetually contestable.

  The insight of the insolubility thesis is that democracy is not a machine that produces legitimacy automatically if the inputs are correct. It is a practice of negotiation among those who find themselves thrown together by history. The "arbitrary" nature of the boundary is not a bug to be fixed by theory, but a feature to be managed by politics. Recognizing the insolubility of the boundary problem frees us from the futile search for a magic principle (like AAI) that will tell us exactly where the line should be. Instead, it forces us to focus on the mechanisms by which the line can be challenged.

  This is where Abizadeh's work remains valuable, not as a solution, but as a diagnostic. Because the boundary cannot be democratically founded, claims to exclude must always be open to challenge by those affected. The insolubility of the problem means that the *demos* is never fully closed. Legitimacy arises not from the correctness of the initial boundary, but from the availability of channels through which the boundary itself can be contested and revised.

  **Conclusion**

  The boundary problem is not a puzzle waiting to be solved by a cleverer principle. It is a structural limit of democratic theory. Goodin's AAI and Abizadeh's All-Subjected principle offer moral guidance, but they do not provide a democratic procedure for constituting the *demos* without circularity. They either dissolve the bounded polity entirely or smuggle in undemocratic moral premises to stop the regress.

  We must conclude that the boundary problem is genuinely insoluble. The *demos* cannot author itself. But this does not condemn democracy to illegitimacy. It reveals that democracy is not a closed system of justification. It is an open-ended project that begins in the middle of history, with boundaries drawn by the very forces democracy seeks to tame. The task of democratic theory is not to solve the boundary problem, but to ensure that the inevitable exclusions it entails remain vulnerable to democratic contestation. To demand more is to ask democracy to be God—to create itself out of nothing. It cannot. It can only begin where it finds itself, and strive to be more inclusive than it was yesterday.
