answer: |-
  **Setting:** *A quiet corner of a park, late afternoon. Marcus and Elena are sitting on a bench. Elena has a notebook open; Marcus is staring at a half-eaten bagel.*

  **Marcus:** You're still doing the math, aren't you?

  **Elena:** (Without looking up) I'm trying to. The GiveWell estimate for the Against Malaria Foundation is around $5,000 per life saved. If I adjust for quality-adjusted life years and the economic multiplier of keeping a breadwinner alive...

  **Marcus:** ...You're assuming you know what that life is *for*.

  **Elena:** (Closes the notebook) Here we go. Priya put you up to this?

  **Marcus:** Priya just lent me the Lenman paper. And the Greaves one. Look, Elena, I get the appeal. You want to maximize good. But this "cluelessness" objection isn't just skepticism. It's not saying, "Hey, maybe the bednet tears." It's saying you have no epistemic access to the *value* of the long-term consequences of saving that life.

  **Elena:** I know the objection. "If I save a child in Malawi, they might grow up to have a great-grandchild who becomes a dictator." It's the classic butterfly effect worry. But practically? It's a wash.

  **Marcus:** That's the "washing out" argument. You're assuming that the unforeseeable effects are like random noise. Positive and negative deviations cancel each other out in expectation, so you can just focus on the foreseeable near-term goods.

  **Elena:** Exactly. Unless you have a specific reason to think saving a life *systematically* leads to worse futures, the expected value of the unknown tail is zero. So the near-term benefit dominates.

  **Marcus:** But Greaves destroys that assumption. Why should we think the effects are symmetric? Think about the AI safety donation you're considering. The goal is to reduce existential risk. The foreseeable effect is a higher probability of humanity surviving the next century. That seems robustly good.

  **Elena:** It does.

  **Marcus:** Now look at the bednet. You save a life. That increases the population, at least temporarily. It consumes resources. It changes the demographic trajectory of a region. We have no idea if a larger population in 2100 makes existential catastrophe *more* or *less* likely. But here's the kicker: we also don't know if the *valence* of the future is positive or negative.

  **Elena:** You're arguing we can't know if the future is worth creating?

  **Marcus:** I'm arguing that if the future contains a significant amount of suffering—and it might, given how much suffering exists now—then extending the timeline of humanity by saving a life might actually be *negative* value. You're adding more people to a pot that might be net negative. With AI safety, you're trying to ensure the future is *good*, not just that it *exists*. But with bednets, you're just ensuring existence. If the future is bad, bednets are morally hazardous.

  **Elena:** Okay, that's the strong version. You're saying the "unforeseeable effects" aren't random noise; they might be systematically biased toward negative value because suffering is the default state.

  **Marcus:** Precisely. So when you compare $5,000 for a life saved versus $5,000 for AI policy research, you aren't comparing "certain good" vs. "uncertain good." You're comparing "uncertain good with a risk of negative long-term value" vs. "uncertain good with a clearer mechanism for positive value." The calculation collapses. You're clueless.

  **Elena:** I concede that the symmetry argument is weak. We can't just assume the future washes out. But Marcus, you're treating consequentialism like it requires a calculator that outputs the exact utility of every action. That's a category error.

  **Marcus:** How so?

  **Elena:** Distinction between the *criterion* of rightness and the *decision procedure*. Consequentialism says an act is right if it maximizes good. That's the criterion. But it doesn't demand I *run* the maximization algorithm in my head every time I donate. It allows for heuristics.

  **Marcus:** Heuristics based on what?

  **Elena:** Based on what's tractable. I can trace the causal chain of a bednet pretty well for ten years. I can trace the causal chain of AI safety... honestly, not that well either. But here's the thing: Cluelessness isn't a problem unique to longtermism or global health. It's a problem for *inaction* too.

  **Marcus:** Explain.

  **Elena:** If I *don't* donate to the bednet fund, I keep the money. I spend it on coffee, or invest it. That capital flows into markets, funds industries, changes consumption patterns. Those actions also ripple into the future. I am just as clueless about the long-term effects of *keeping* my money as I am about donating it.

  **Marcus:** True, but the *burden of proof* shifts. If you claim your donation is *doing good*, you need to show it's better than the counterfactual. If both are shrouded in cluelessness, you can't claim one is superior. You're paralyzed.

  **Elena:** Not paralyzed. Just humble. I look for *robust* good. Reducing suffering *now* is robustly good, regardless of what happens in 200 years, unless you hold the view that the future is so overwhelmingly negative that extinguishing life is preferable. Are you an antinatalist, Marcus?

  **Marcus:** (Pauses) No. But I don't need to be a full antinatalist to press the point. I just need to doubt that adding more people is automatically good. But fine, let's grant that a life lived is generally positive. The problem remains: you're trying to compare two different *types* of cluelessness. With bednets, the near-term effect is clear, long-term is opaque. With AI safety, the near-term effect is abstract (a paper published, a meeting held), but the *intended* long-term effect is the entire point.

  **Elena:** Right. So the AI safety case relies entirely on the long-term chain holding. The bednet case relies on the short-term chain holding.

  **Marcus:** And the short-term chain is vulnerable to the long-term override. If saving the life leads to a 0.01% increase in the chance of a totalitarian lock-in that lasts a million years, the bednet was a net negative. You can't rule that out.

  **Elena:** I can't rule it out. But you can't rule out that the AI safety work fails, or backfires, or accelerates capabilities without improving alignment. We are both dealing with low-probability, high-stakes variables.

  **Marcus:** But the *source* of the uncertainty is different. With AI safety, the uncertainty is about whether our intervention works. With bednets, the uncertainty is about whether the *success* of the intervention is good. That's more disturbing. It means even if you succeed perfectly, you might have done harm.

  **Elena:** (Taps pen on notebook) Okay. That hits home. It's the "success is failure" worry. But let's bring it back to decision procedures. If I accept your argument, Marcus, I can't donate to *anything*. I can't volunteer, I can't work, I can't have kids. Every action ripples.

  **Marcus:** Most actions have negligible impact on the long-term trajectory. That's the other side of cluelessness. Maybe most of us are causally impotent regarding the far future.

  **Elena:** If that's true, then the longtermist project is also dead. If my donation doesn't move the needle on AI safety in a meaningful way, I've wasted my money. So, if we are truly clueless about our causal leverage on the far future, the bednet looks better again. Because even if the long-term effects wash out or are ambiguous, the *short-term* relief is real. A child doesn't get malaria. That is a localized good.

  **Marcus:** Unless the localized good contributes to a global bad.

  **Elena:** Unless. But that requires a specific story. "Saving this child leads to X which leads to Y catastrophe." Without that story, you're invoking a skeptical demon. "You might be a brain in a vat." "You might be saving a Hitler." Philosophically interesting, but action-guiding? Useless.

  **Marcus:** It's not a skeptical demon if the structure of the world makes long chains unpredictable. Lenman's point is about the *complexity* of causal networks. We aren't ignorant because we lack data; we're ignorant because the system is computationally intractable. So, relying on the "localized good" is like fixing a leak on the Titanic and ignoring the iceberg because the leak is "tractable."

  **Elena:** But what if the iceberg is a myth? Look, I think the cluelessness objection forces me to discount the long-term expected value. I can't treat a 1% chance of saving a billion lives as equal to a 100% chance of saving ten lives if my confidence in that 1% is epistemically shaky.

  **Marcus:** Okay, I can live with that. Discount the long-term EV heavily.

  **Elena:** But you can't discount it to zero. Because if there *is* an existential risk, the magnitude is so large that even a tiny, shaky probability dominates the calculation. That's the Pascal's Mugging side of longtermism.

  **Marcus:** Which is why you need to check your priors. If your theory tells you to ignore the certain suffering of the poor today for a vague promise of the future, maybe the theory is the problem.

  **Elena:** Or maybe it tells me that the future contains orders of magnitude more people than the present, so their interests weigh heavier. But... (She sighs) I see your point about the "systematic bias." I've been assuming the future is neutral or positive. If I admit I'm clueless about the *value* of the future, I can't just plug in "positive" for my utility function.

  **Marcus:** Exactly. So where does that leave you?

  **Elena:** It leaves me thinking that "cluelessness" isn't a knockout blow, but it is a risk factor. It means I shouldn't be 100% confident in the longtermist calculus. I need to look for interventions that are good *both* near-term and long-term. Or, I need to accept that my decision procedure isn't "maximize expected utility" but "satisfice on robust goods while keeping an eye on tail risks."

  **Marcus:** So you keep buying bednets?

  **Elena:** Mostly. But maybe I allocate a portion to AI safety, not because I've solved the cluelessness problem, but because the stakes are high enough that "clueless ignorance" isn't an excuse for inaction. If I'm clueless about the future, I should at least try to ensure there *is* a future to be clueless about.

  **Marcus:** That's... actually a decent heuristic. "Don't let the game end before you figure out the rules."

  **Elena:** Right. And you? Does this mean you're donating to nothing until you resolve the metaphysics of value?

  **Marcus:** (Smiles) No. I think I'll buy the bednets.

  **Elena:** Wait, really? After an hour of arguing that saving lives might be net negative?

  **Marcus:** Because of the comparative argument you made earlier. If I'm clueless about the long-term effects of donating, I'm also clueless about the long-term effects of keeping the money. But the bednet gives me a *reason* to think the near-term is good. The cluelessness objection stops me from claiming it's the *optimal* act. It doesn't stop me from claiming it's a *permissible* one.

  **Elena:** Permissible, not optimal. I can live with that.

  **Marcus:** And Elena?

  **Elena:** Yeah?

  **Marcus:** If you're going to donate to AI safety, make sure it's the kind of work that actually reduces risk, not just the kind that makes longtermists feel like they've solved the puzzle. Cluelessness applies to them too.

  **Elena:** (Opens notebook again) I'm already screening for that. But... I'll add a "cluelessness discount" to my mental spreadsheet.

  **Marcus:** Good. Because Priya will ask.

  **Elena:** (Laughs) Tell Priya I'm still confused. But I'm confused with a plan.

  **Marcus:** That's the best we can do.
