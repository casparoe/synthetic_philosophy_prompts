answer: |-
  Good evening, everyone. For those who don't know me, I'm Danny's brother.

  Standing here, looking at the room, I realize we have a unique crowd. On one side, we have our family, who are wonderful people but generally think "fiat currency" is a brand of Italian sedan. On the other side, we have Naomi's colleagues from the economics and philosophy departments, who probably analyze the utility function of this open bar.

  Bridging those two worlds is actually the perfect way to talk about Danny and Naomi.

  Naomi, as many of you know, is finishing her PhD on the history of money. And thanks to her, and her friend Leah—who I know is here tonight ready to fact-check me—I've spent the last few weeks thinking a lot about what money actually *is*.

  It turns out, a dollar bill is just a piece of cotton and linen blend. It has no intrinsic value. You can't eat it, it doesn't keep you warm, and if you're stranded on a desert island, it's useless. It only becomes "money" because we all collectively agree to pretend it has value. We accept a status function. We agree that this paper *counts as* wealth.

  But here is the crucial part: Just because we agreed on it, doesn't mean it isn't real. You can still buy groceries with it. It creates real rights, real obligations, and real security. The agreement *makes* the reality.

  I asked Danny if he realized this meant he could theoretically write his wedding vows on a twenty-dollar bill. He said he'd rather not risk counterfeiting charges on day one.

  But seriously, that's when it clicked for me. Marriage is the exact same thing.

  On paper, a marriage is just words spoken in a room, a signature on a license, and a ring on a finger. Biologically, you are the same two people after the ceremony as you were before. But socially, ontologically, you are entirely different.

  Like money, marriage is a status we create by collective agreement. But also like money, that agreement creates binding force. It creates obligations that didn't exist yesterday. It creates rights that are enforceable. It creates a value that is recognized by everyone in this room.

  Some people worry that if you call something "constructed" or "agreed upon," it implies it's fragile. Or fake. As if you could just wake up tomorrow and decide the dollar isn't worth a dollar, or the marriage isn't binding.

  But we know that's not true. The value of money relies on trust. And the value of a marriage relies on the same thing. It is real *because* you honor it. It is binding *because* you choose to be bound by it.

  Danny, Naomi: You are building an institution today. Not a cold, bureaucratic one, but a warm, living one. You are creating a reality where you have specific duties to one another—to care, to support, to listen—that the rest of us do not have. You are creating a currency of trust that only the two of you can spend.

  And the beauty is, unlike the economy, this market isn't subject to inflation. The more you invest in this agreement, the more valuable it becomes.

  So, to the happy couple. May your collective intentionality remain strong, may your status functions be secure, and may you always find that the reality you build together is worth far more than the paper it's written on.

  To Danny and Naomi.
