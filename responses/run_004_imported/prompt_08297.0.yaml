answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two decision theorists, Elena and Marcus, are finishing a seminar on longtermism and cosmology.*

  **Elena:** You looked skeptical during the Q&A, Marcus. When the speaker mentioned Evidential Cooperation in Large Worlds, you practically rolled your eyes.

  **Marcus:** Did I? I suppose I did. It's just… it feels like taking a neat little paradox from the seminar room—Newcomb's Problem—and inflating it until it pops. The idea that I should compromise my values because there's a version of me in Andromeda making the same calculation? It's poetic, Elena, but is it decision theory or just cosmological wishful thinking?

  **Elena:** It's not wishful thinking; it's scaling. Look, you accept the logic of the one-shot Prisoner's Dilemma with a psychological twin. If you know your opponent reasons exactly like you, defecting is irrational because your decision is *evidence* of theirs. You aren't causing their move, but you're learning what it is by deciding your own. ECL just notes that if the universe is infinite—or even just sufficiently vast—the probability of encountering agents with isomorphic reasoning structures approaches one.

  **Marcus:** But that "exactly like you" is doing all the heavy lifting. In the twin Prisoner's Dilemma, the correlation is stipulated by the thought experiment. In the real cosmos, it's empirical. And that brings me to the reference class problem. Who counts as "reasoning like me"?

  **Elena:** I grant you, the boundary is fuzzy. But fuzziness doesn't imply non-existence.

  **Marcus:** In decision theory, it does! If I'm calculating expected utility, I need probabilities. Am I correlated with an agent who shares 99% of my axioms? 90%? What about an agent who reasons like me but has a different utility function? If I'm a hedonistic utilitarian and my "twin" is a deontologist, our reasoning might look similar structurally, but our outputs diverge. If I can't define the set of agents I'm cooperating with, I can't calculate the benefit of the compromise. The integral diverges, or worse, it's undefined.

  **Elena:** That's a fair technical objection, but consider the physicist's perspective. We deal with continuous variables all the time. We don't say gravity doesn't exist because we can't draw a sharp line where a mountain ends and a hill begins. In an infinite universe, there isn't just a binary "same/different." There's a measure. Even if you only correlate with agents within a 1% reasoning distance, in an infinite volume, that's still an infinite number of agents. The sheer weight of numbers compensates for the vagueness of the reference class. You don't need a sharp boundary; you need a non-zero measure.

  **Marcus:** But without a sharp boundary, you can't determine *how much* to compromise. The argument suggests I should moderate my values to form a coalition with these distant correlators. But if I don't know who they are, I don't know what to moderate *toward*. Do I compromise with the paperclip maximizer who happens to use my logic to maximize paperclips? If I do, I've lost my soul for the sake of a mathematical ghost.

  **Elena:** You wouldn't compromise on the *content* of the utility function necessarily, but on the *aggressive pursuit* of it at the expense of others. The point is leverage. In a "large world," the resources controlled by agents who reason like you vastly outnumber the resources you can causally influence locally. If you defect—if you pursue your values fanatically—you signal to all those correlated agents that defection is the norm. You lose the gains from trade across the multiverse.

  **Marcus:** There it is. "You signal." That's where I think you're smuggling in a contested decision theory. This only works if you accept Evidential Decision Theory (EDT), or perhaps Functional Decision Theory. If I'm a Causal Decision Theorist (CDT), I look at that distant agent and say, "My choice here cannot physically change what they do over there. There is no causal channel." Therefore, I should just maximize my local impact. Why should a rational agent abandon causal intuition just because the universe is big?

  **Elena:** Because causal intuition is a heuristic for medium-sized dry goods, not for the global structure of reality. You're a physicist at heart, Marcus. If the universe is block-like, or if computation is substrate-independent, then "causal connection" is just a specific pattern of correlation. If my reasoning process and the distant agent's reasoning process are instantiating the same algorithm, then there is a logical connection, even if no photon travels between us. To ignore that is to ignore the structure of reality in favor of a local causal graph.

  **Marcus:** I'll concede that CDT feels less secure in a quantum multiverse than it does in a Newtonian billiard table. But let's look at the practical upshot. Suppose I buy your story. Suppose I accept EDT and the infinite universe. You say I should "moderate my values." But isn't that just standard moral caution? Even without ECL, I should be humble about my ethics. I should cooperate with neighbors to avoid conflict. What work is ECL actually doing here? It seems to be a cosmic justification for being nice, which we already had reasons to be.

  **Elena:** It's not just "being nice." Moral caution is about uncertainty regarding the *truth* of your values. ECL is about uncertainty regarding the *distribution* of power. Even if I am 100% certain my values are correct, ECL tells me that fighting for them locally is inefficient if it alienates my copies who control 99% of the accessible resources in the large world. It changes the *strategy*, not just the attitude. It argues for explicit compromise treaties with value systems you would otherwise reject, provided their adherents reason like you. That's a radical shift, not just politeness.

  **Marcus:** But that relies on the assumption that those distant agents are actually looking for a treaty. You're assuming a symmetry. What if the "copies" of me in the Andromeda galaxy are all CDT agents? They'll take my cooperation as a gift and defect. In Newcomb's Problem, the predictor is reliable. In the cosmos, the "predictor" is just statistical chance. If the rate of correlation is low, the "tax" I pay by moderating my values locally is real, but the "dividend" from distant cooperation is speculative.

  **Elena:** That is the strongest objection you've raised. The risk of asymmetric correlation. If I moderate and they don't, I lose. I will concede that if the universe is merely large but finite, and the density of correlated reasoners is low, the bet might not pay off. ECL really needs the infinite universe or the Many-Worlds Interpretation to guarantee the existence of the correlators. If the wavefunction doesn't branch sufficiently, or if space terminates, the argument collapses.

  **Marcus:** Exactly. So the argument hinges on open questions in cosmology. It feels precarious to base a normative ethical theory on whether space is flat and infinite versus closed and finite.

  **Elena:** True. But isn't it interesting that normative theory *should* depend on cosmology? We accept that physics constrains what is possible. Why shouldn't it constrain what is rational? If the universe is small, CDT wins. If the universe is large, EDT wins. Maybe the "correct" decision theory is contingent on the metric of spacetime.

  **Marcus:** *Laughs.* That's a hard pill to swallow. "I'm a causal decision theorist because we live in a closed universe." But I will concede this: if the Many-Worlds Interpretation holds, and branching is robust, then the "distant agents" are just your future branches. In that case, the reference class problem shrinks. You are cooperating with yourself across branches.

  **Elena:** Precisely. And in that case, the "compromise" isn't with strangers, but with other versions of your own value system that evolved slightly differently.

  **Marcus:** But even then, the practical guidance is murky. How do I negotiate with a branch of myself I can't speak to? I have to guess what they want. Which brings me back to the reference class. I might guess wrong. If I compromise my values based on a bad model of my "copies," I've harmed my actual values for no gain.

  **Elena:** I'll grant you that. The epistemic burden is high. You need a robust model of the space of possible reasoners. But isn't that a call for more research, not a dismissal? We don't throw out general relativity because calculating the metric tensor is hard.

  **Marcus:** No, but we don't build bridges on it until we're sure the math holds. My worry is that ECL is being used to justify "shut up and multiply" ethics on a cosmic scale without the math being settled. It risks becoming a motte-and-bailey. The motte is "we should be humble and cooperative." The bailey is "you are rationally required to sacrifice local utility for hypothetical multiverse coalitions."

  **Elena:** I can accept that distinction. Perhaps the *requirement* is too strong. But the *permission* stands. ECL shows that cooperation isn't just a moral virtue; it can be an instrumental rationality in a large world. It removes the stigma from compromise. It shows the "selfish" rational agent that moderation might actually be the most selfish thing they can do, given the cosmic scale.

  **Marcus:** That I can live with. If ECL is just an argument to convince hyper-rational egoists that they shouldn't burn the village to cook their dinner because there are too many villages in the multiverse… then it's a useful rhetorical tool. But as a foundational proof? I still think the reference class problem leaves it floating in the air.

  **Elena:** Then we're closer than I thought. You see it as a heuristic for the uncertain; I see it as a law for the infinite. But we both agree: if the universe is big enough, you can't treat your decision as an isolated event.

  **Marcus:** Agreed. The cosmos is too crowded for solipsism, even if the crowd is just echoes of ourselves. I'll drink to that.

  **Elena:** *Raises coffee cup.* To the echoes. May they be correlated enough to make peace worth the price.
