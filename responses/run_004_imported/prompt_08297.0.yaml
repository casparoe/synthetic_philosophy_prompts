  7.  *(Mental Sandbox)*: *Wait, does ECL specifically require EDT?* Technically, it's often framed in Functional Decision Theory (FDT) or UDT terms to avoid the "news" objection of EDT. I should make sure Elena distinguishes between "evidence" and "logical output" to be precise, as a physicist would care about that distinction. Marcus should press on the "causal inertness."

