      *   *Tension 3: Predictive Processing.* If the brain is a prediction machine, isn't penetration everywhere? If it's everywhere, is it philosophically interesting? Does it dissolve the distinction between perception and cognition?
      *   *Tension 4: Normativity/Ethics.* If we can't trust our eyes because of our biases, what are the moral implications? (Often linked to epistemic downgrade).

  3.  **Drafting the Questions (Iterative Process):**

