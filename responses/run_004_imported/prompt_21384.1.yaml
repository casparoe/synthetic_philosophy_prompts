answer: |-
  Here are ten questions designed to navigate the technical and philosophical tensions in your guest's view, tailored for an audience familiar with the rationalist discourse on predictive processing.

  **1. The Predictive Processing Baseline**
  "You've noted that if we accept the predictive processing framework—where perception is essentially hierarchical error minimization—top-down influence seems like a architectural feature, not a bug. Given that, why do you think the literature still treats cognitive penetration as a controversial, contingent claim rather than a settled consequence of the brain's operating system? Is the resistance empirical, or is it a philosophical commitment to a specific definition of 'perception'?"
  *   **Follow-up:** If she suggests it's a philosophical commitment to "pure" perception, ask: "Does holding onto that pre-theoretic definition risk making the concept of perception useless for explaining how agents actually navigate the world?"

  **2. The Firestone & Scholl Challenge**
  "Firestone and Scholl have argued that nearly every canonical example of penetration—from color perception to threat detection—can be redescribed as shifts in judgment, memory, or response bias rather than changes in conscious content. Methodologically, what does a 'smoking gun' experiment look like to you? What specific design feature rules out the deflationary explanation that the subject is just *reporting* differently rather than *seeing* differently?"
  *   **Follow-up:** If she cites a specific paradigm (e.g., binocular rivalry or contrast sensitivity), ask: "Firestone has countered that even those results can be explained by decision criteria shifting; do you think we've hit a limit where empirical data underdetermines the theory, leaving it to inference to the best explanation?"

  **3. Attention vs. Content**
  "Everyone agrees cognition can steer attention, and attention obviously changes what gets processed. But your claim is stronger: that cognition changes the *content* of the representation at a fixed locus of attention. Is there a principled way to draw that line, or does the interplay between attentional weighting and representational content make the distinction fuzzy enough that Firestone's 'encapsulation' might still hold at the level of early feature extraction?"
  *   **Follow-up:** If she argues the distinction is clear, ask: "If attention alters the gain on specific prediction errors, isn't that functionally identical to altering the content of the resulting percept, rendering the distinction merely semantic?"

  **4. Epistemic Downgrade and Reasons**
  "A core part of your view is that a penetrated percept can be epistemically downgraded—rendered unjustified—because it inherits defects from the belief that caused it. But perceptual states aren't typically thought to answer to reasons the way beliefs do; I can't reason my way out of a visual illusion. How do you square the idea of perceptual justification with the fact that the 'inference' generating the perception is subpersonal and inaccessible to the subject?"
  *   **Follow-up:** If she appeals to an analogy with unconscious inference, ask: "If the subject has no access to the 'premise' (the prior belief), how can they be held epistemically responsible for the 'conclusion' (the percept) in a way that warrants downgrade?"

  **5. The Ubiquity Problem**
  "Returning to predictive processing: if the brain is constantly using priors to construct reality, isn't *all* perception cognitively penetrated to some degree? If penetration is the baseline rather than the exception, does the concept lose its critical bite? Specifically, if there is no 'neutral' percept to compare against, how do we measure the magnitude of the downgrade?"
  *   **Follow-up:** If she argues for degrees of penetration, ask: "Without a theory of the 'ideal prior,' how do we distinguish between a beneficial, expertise-driven penetration (like a radiologist seeing a tumor) and a vicious, bias-driven one?"

  **6. Phenomenological Transparency**
  "When a percept is penetrated by a biased belief, does it *feel* different from the outside? If a racist sees aggression in a neutral face due to penetration, is the phenomenology distinct from a veridical perception of aggression, or is the experience transparent? If it's transparent, doesn't that make the epistemic downgrade practically inert for the subject?"
  *   **Follow-up:** If she says the phenomenology is identical, ask: "Doesn't that imply we are permanently trapped in a 'Matrix' of our own priors, with no first-person way to check if our justification is compromised?"

  **7. Fodor's Ghost**
  "Fodor's modularity thesis relied on informational encapsulation to explain why visual illusions persist even when we *know* they are illusions (like the Müller-Lyer lines). Do you concede that early vision remains encapsulated in these cases, or do you argue that even those illusions are a form of cognitive penetration by hardwired priors? If the latter, does that dissolve the distinction between cognition and perception entirely?"
  *   **Follow-up:** If she concedes some encapsulation remains, ask: "Where exactly do you draw the boundary? Is it anatomical, temporal, or functional, and does that boundary shift as we learn?"

  **8. Moral Responsibility and Bias**
  "Your work has implications for moral psychology, particularly regarding implicit bias. If my prejudicial beliefs literally alter what I see, am I morally responsible for the percept itself, or only for maintaining the prior beliefs? Does the penetrability of perception increase our responsibility (because we should guard our priors) or decrease it (because we can't trust our eyes to correct us)?"
  *   **Follow-up:** If she says it increases responsibility, ask: "Given that many priors are acquired culturally and unconsciously, is it realistic to expect agents to monitor the inputs to their perceptual systems?"

  **9. The Myth of the Given**
  "Wilfrid Sellars attacked the 'Myth of the Given'—the idea that there is a raw, non-conceptual foundation for knowledge. Does your view ultimately vindicate Sellars by showing that there is no non-conceptual Given, or are you trying to preserve a version of perceptual justification that avoids coherentism? If all perception is theory-laden, what stops justification from becoming a closed loop?"
  *   **Follow-up:** If she argues for a hybrid view, ask: "How do you prevent the loop from closing? What provides the friction against the world if not some form of encapsulated sensory input?"

  **10. Falsification**
  "Finally, philosophy of mind can sometimes become unfalsifiable. What specific empirical finding or philosophical argument would compel you to abandon the cognitive penetration thesis? Is there a result from neuroscience or psychophysics that, if confirmed tomorrow, would force you to concede that early vision is, in fact, encapsulated?"
  *   **Follow-up:** If she names a specific empirical result, ask: "How confident are you, on a scale of 0 to 1, that such a result won't emerge as our imaging and modeling techniques improve?"
