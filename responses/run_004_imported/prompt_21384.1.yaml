          *   At least one question on the "epistemic downgrade" claim (how perception answers to reasons/justification).
          *   At least one question on whether Predictive Processing (PP) helps or undermines the view (ubiquity problem).
          *   Each question needs a specific follow-up keyed to the likely answer.
          *   The sequence must end with a "what would change your mind" question.

