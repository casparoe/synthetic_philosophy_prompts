      *   *Self-Correction on Q1 (PP):* Make sure this doesn't steal the thunder of the specific PP requirement question. Let's make Q1 about the *state of the debate* and Q4 about the *ubiquity/triviality* of PP.
      *   *Self-Correction on Follow-ups:* Ensure they aren't generic ("Can you elaborate?"). They need to anticipate the standard defense.
