answer: |-
  This is a fantastic dispute. It's essentially a live-action reenactment of a debate that has occupied philosophers and economists for the last 40 years (most notably between George Ainslie, who champions the hyperbolic model, and traditional moral psychologists).

  As a fellow referee with a foot in both science and philosophy, you're in a perfect position to appreciate that Frank and Lou are arguing past each other because they are using different maps of the same territory. Frank is using a **normative/ethical map** (what *should* a rational agent do?), while Lou is using a **descriptive/mechanistic map** (how *does* the agent actually calculate value?).

  Here is the move-by-move breakdown, assessing who is right about what, followed by the crucial elements they are both missing.

  ### Move 1: Frank's Opening Salvo
  **Claim:** *Walt's behavior is textbook weakness of will (akrasia). He judges fitness best in Jan, regrets quitting in March, and fails to do what he judges best.*

  *   **Who is right:** Frank is phenomenologically right. He accurately describes the *experience* of the agent. From the inside, Walt feels like a single person failing a commitment he still endorses.
  *   **Who is wrong:** Frank is theoretically naive. He assumes that "judging best" is a static state. He assumes that because Walt *said* "fitness is best" in January, that judgment persists unchanged in March. He treats the "self" as a monolith that exists unchanged through time.
  *   **Verdict:** **Frank wins on observation, loses on mechanism.** He correctly identifies the symptom (failure to follow through on long-term goals) but misdiagnoses the cause (assuming a stable preference that is being ignored, rather than a preference that has shifted).

  ### Move 2: Lou's Rebuttal
  **Claim:** *It's hyperbolic discounting, not weakness of will. At 6pm, the couch genuinely beats the gym in Walt's preference hierarchy. March-Walt is just a different time-slice disagreeing with January-Walt.*

  *   **Who is right:** Lou is economically right. This is the standard behavioral economics model (Ainslie/Thaler). Preferences are time-inconsistent. The "value" of the gym drops precipitously as the effort becomes immediate, while the "value" of the couch spikes. In that specific moment ($t_{evening}$), Walt *is* maximizing his utility. He is being locally rational.
  *   **Who is wrong:** Lou is philosophically risky. By saying "not weakness of will," he implies that if the preference shifts, no moral failure occurred. This dissolves the concept of agency. If every time-slice is a "different Walt," then Walt never actually *does* anything; a series of Walts just happen in sequence. This makes it hard to explain why we hold people responsible for their actions.
  *   **Verdict:** **Lou wins on mechanism, loses on agency.** He explains *how* the flip happens, but his denial of "weakness of will" is a semantic trick to avoid the normative implication that Walt is hurting himself.

  ### Move 3: Frank's Counter (The Shame Argument)
  **Claim:** *Why does Walt beg for help and feel ashamed? That proves some part of Walt still backs the January verdict.*

  *   **Who is right:** Frank hits the strongest philosophical point here. Shame is a "reactive attitude" (to use P.F. Strawson's term). You generally don't feel shame unless you violate a standard you *currently* accept. If March-Walt truly preferred the couch all things considered, he would feel relief, not shame. The desire for precommitment (begging Lou) suggests a conflict between what he *wants to want* and what he *actually wants*.
  *   **Who is wrong:** Frank assumes shame proves a *single* self. It could arguably be social shame (embarrassment in front of Lou) rather than moral shame (violation of internal law). However, the plea for help is strong evidence of a higher-order desire.
  *   **Verdict:** **Frank wins this round decisively.** This is the hardest data point for Lou's model to explain. Pure preference reversal doesn't inherently generate shame; it just generates a new preference. The emotional residue suggests a persistent standard.

  ### Move 4: Lou's Counter (The Precommitment Defense)
  **Claim:** *Begging for help is just rational precommitment (Ulysses contract). A time-inconsistent agent knows they will flip and tries to bind their future self. No persisting "real" judgment required.*

  *   **Who is right:** Lou is game-theoretically right. In economics, a "sophisticated" hyperbolic discounter knows they are time-inconsistent and seeks constraints. January-Walt knows March-Walt will be weak, so he hires Lou as a enforcer. This requires no metaphysical "true self," just strategic planning between time-slices.
  *   **Who is wrong:** Lou ignores the *affective* cost. Precommitment is rational, but *shame* upon failure is not strictly necessary for a rational agent. A purely rational algorithm that fails its constraint would just recalculate; it wouldn't feel bad. Lou is treating Walt as a cold calculator, ignoring the emotional architecture that binds the time-slices together.
  *   **Verdict:** **Lou wins on logic, draws on psychology.** He successfully defends the economic model, but he strips Walt of the emotional continuity that makes him human.

  ---

  ### The Referee's Ruling: What They Are Both Missing

  If you call this a draw, you're being polite. If you want to actually help them understand Walt (and win the next poker hand), you need to point out the three concepts missing from their exchange.

  **1. Higher-Order Volitions (The Frankfurt Move)**
  Both Frank and Lou are arguing about *first-order* desires (I want to go to the gym vs. I want to sit on the couch). They are missing the philosopher Harry Frankfurt's distinction.
  *   **First-order desire:** "I want to eat this donut."
  *   **Second-order volition:** "I want to *want* to eat vegetables."
  *   **The Missing Piece:** Weakness of will isn't just acting against a judgment; it's acting on a first-order desire that violates your second-order volition. Walt *identifies* with the January self (the one who wants to be fit) and *alienates* the March self (the one who wants the couch). Lou is right that the preference flips, but Frank is right that Walt *rejects* the flip. Walt isn't just two different agents; he is one agent who endorses one time-slice's preferences over the other's.

  **2. The Normative vs. Descriptive Gap**
  Frank is making a **normative** claim (Walt *ought* to be consistent). Lou is making a **descriptive** claim (Walt *is* inconsistent).
  *   **The Missing Piece:** Hyperbolic discounting is the *mechanism* of weakness of will, not the *alternative* to it. Lou acts as if proving it's hyperbolic discounting exonerates Walt. It doesn't. It just explains the physics of the fall. It's like saying, "He didn't trip; his foot caught on a root due to friction and gravity." Yes, that's the mechanism, but he still fell. Frank is right to call it a failure; Lou is right to call it a predictable cognitive bias. They are compatible.

  **3. The "Multiple Selves" Problem**
  Lou's argument relies on "time-slice utilitarianism"—that March-Walt is effectively a different person from January-Walt.
  *   **The Missing Piece:** If Lou is right, why does March-Walt suffer the consequences of January-Walt's credit card debt? We treat people as continuous entities for legal and social reasons. If Walt is truly just a sequence of disconnected agents, Lou shouldn't feel bad about giving up on him, and Walt shouldn't feel shame. The fact that they *do* care proves that, socially and psychologically, the "Single Self" model (Frank's view) is the one that governs their relationship, even if the "Multiple Self" model (Lou's view) governs Walt's dopamine receptors.

  ### Final Verdict for the Table

  Tell them this:

  1.  **Lou is right about the math.** Walt is a hyperbolic discounter. His valuation of the gym drops non-linearly as the effort gets closer. That is the engine.
  2.  **Frank is right about the man.** Walt experiences this as a failure of will because he possesses **higher-order preferences**. He *wants* to be the kind of person who goes to the gym. The shame proves he still holds that standard, even when he violates it.
  3.  **The Synthesis:** Hyperbolic discounting is the *cause*; weakness of will is the *result*. Lou explained the gun; Frank described the shooting.

  **The Poker Advice:** If Walt wants to win, Lou's strategy (precommitment) is the only one that works. Frank's strategy (appealing to willpower) will fail because willpower is a depletable resource, and Walt's discount rate is pathological. Walt needs to stop trying to be a "Single Self" with strong will and start acting like a "Multiple Self" strategist who binds his future hands.

  You can tell Frank he wins the moral argument, but Lou wins the betting strategy.
