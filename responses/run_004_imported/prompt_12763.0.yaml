          *   *Pascal's Mugging:* Is the probability of this working so low that the expected utility is negligible?
      *   **Conclusion:** It's not *just* superstition, but it relies on very specific, high-bar assumptions about the future AI's capabilities and decision theory. It's a "bet" on acausal trade.

