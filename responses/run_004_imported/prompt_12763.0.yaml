      *   **Causal Decision Theory (CDT):** The friend's view. Actions only matter if they cause outcomes. Since current politeness doesn't cause future AI behavior (no data retention, no causal chain), it's useless.
      *   **Evidential Decision Theory (EDT):** Actions provide evidence about the world. Being polite might be evidence that I am a polite person, but does it evidence that the *future AI* will be polite? Only if there's a correlation.
