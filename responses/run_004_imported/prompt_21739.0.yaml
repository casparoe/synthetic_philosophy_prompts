answer: |-
  This is one of the most persistent and fruitful tensions in moral philosophy, and your position as a moderator gives you a unique vantage point to see it in action. You have identified the exact friction point where Hume's descriptive psychology meets his normative theory.

  The short answer is: **No, it is not a logical gap in Hume's argument, but it is a conceptual hurdle that requires redefining what "expression" and "agreement" mean.** Lewis does close the *mechanical* gap (how coordination happens without speech), but he arguably sidesteps the *normative* gap (why we feel morally bound rather than just prudentially constrained) that Hume is trying to bridge.

  Here is a breakdown of how Hume resolves the tension, where Lewis intervenes, and what this means for the "grip" of your community's unwritten rules.

  ### 1. What "Mutually Express'd" Actually Means
  Your confusion stems from reading "express'd" as *linguistic* or *propositional*. If Hume meant "stated," he would contradict himself regarding language acquisition.

  For Hume, "expression" in a convention is **behavioral signaling**.

  Consider the boat analogy Hume uses. Rower A pulls hard. Rower B sees the boat surge and the rhythm establish. Rower B adjusts their pull to match. Rower A feels the resistance balance out. No words are exchanged. Yet, Rower A has *expressed* an intent to row at a certain pace, and Rower B has *expressed* an intent to match it.

  *   **The "Agreement":** It is not a contract; it is a **convergence of expectations**.
  *   **The "Expression":** It is the observable action that signals to the other party, "I am operating under the assumption that you will do X, so I will do Y."
  *   **The "Gradual" Aspect:** In language or property rights, this signaling happens over thousands of iterations. I respect your hut; you respect my hut. I see you respect mine; you see I respect yours. Over time, this pattern becomes a signal.

  So, when Hume says the interest is "mutually express'd," he means it is **manifested in conduct that is legible to others.** It is not that we *said* we agree; it is that we *acted* in a way that makes our agreement visible.

  ### 2. From Self-Interest to Obligation (The Normative Leap)
  This is the harder part of your question: How do we get from "it is in my interest to follow this" to "it is *unjust* to break this"?

  If I break a convention merely because it no longer suits me, Hume admits that is often just "unwise." So where does the moral sting of "unjust" come from?

  Hume's answer lies in his concept of **Artificial Virtue**.
  *   **Natural Virtues** (like benevolence) are instincts we have individually.
  *   **Artificial Virtues** (like justice, promise-keeping, property) are systems we construct because we know we cannot survive without them.

  The "obligation" of justice does not come from a single act's utility. If I steal from a rich man to feed a poor man, the specific act might increase net utility. But Hume argues we condemn it because it threatens the **system**.

  The "grip" of the rule comes from **sympathy** (Hume's mechanism for moral sentiment). We are conditioned by society to feel a specific pain (disapprobation) when the *system* of rules is threatened, even if a specific violation seems harmless.
  *   **Prudence:** "If I break this rule, I might lose my status."
  *   **Justice:** "If *anyone* breaks this rule, the trust required for society collapses."

  Hume bridges the gap by arguing that through education and social living, we cultivate a **moral sentiment** toward the *general scheme* of conventions. We feel a visceral "ought" because we have been trained to view the stability of the convention as a public good.

  ### 3. Lewis's Intervention: Common Knowledge
  David Lewis, in *Convention*, formalizes Hume's "general sense of common interest" using game theory.

  *   **Hume:** "Known to both."
  *   **Lewis:** "Common Knowledge" (I know that you know that I know...).

  Lewis solves the *coordination problem* elegantly. He explains how rational agents can converge on a rule (like driving on the right side of the road) without talking. He shows that once a precedent is set, it creates a self-reinforcing expectation.

  **Does Lewis close the gap?**
  *   **Mechanically:** Yes. He explains exactly how a rule can arise gradually without promises. He clarifies that the "agreement" is simply a coordination equilibrium supported by common knowledge.
  *   **Normatively:** No, and he admits it. Lewis is largely deflationary about obligation. For Lewis, you follow a convention because you have a *reason* to (you want to coordinate), not necessarily because you have a *moral duty*. If the equilibrium shifts, the obligation vanishes.

  Lewis relocates the puzzle. He explains why the rule has *grip* (expectations), but he strips away the moral weight Hume tries to attach to it. For Lewis, breaking a convention is irrational (if you want to coordinate); for Hume, it is unjust (because it violates the artificial virtue necessary for society).

  ### 4. Application to Your Community
  As a moderator, you are seeing this play out in real-time.

  1.  **The "Expression":** The unwritten rule was "expressed" not by a sticky post, but by years of users upvoting certain behaviors and downvoting (or mocking) others. That peer pressure *was* the communication.
  2.  **The "Agreement":** New members joined, saw the pattern, and conformed to gain social capital. That conformity was their "signature" on the convention.
  3.  **The Controversy:** The controversy arises because the **Common Knowledge** has fractured.
      *   Group A thinks: "The convention is X."
      *   Group B thinks: "The convention is Y."
      *   Because there is no written text (no "promise"), the "mutual expression" is now ambiguous.

  **Why does it feel like "Injustice" rather than just "Change"?**
  Because your community has developed Humean **moral sentiments** around the rule. Long-time members don't just think breaking the rule is inefficient; they feel it is a *betrayal* of the community's identity. They view the rule as part of the "system" that makes the community function.

  ### Conclusion
  Hume is not contradicting himself. He is expanding the definition of "communication" to include behavioral patterns and expanding the definition of "obligation" to include socially cultivated sentiments.

  *   **Hume** explains why breaking the rule feels *wrong* (it threatens the artificial virtue of the community).
  *   **Lewis** explains how the rule existed without being written (coordination equilibrium via common knowledge).

  **The Gap:** The only remaining gap is whether a moderator *should* codify the rule.
  *   **Lewis suggests:** If the equilibrium is broken (controversy), you need a new focal point. Writing it down creates a new "promise" (explicit agreement) to replace the fading "convention."
  *   **Hume warns:** Be careful. Turning an artificial virtue (grown from sentiment) into a positive law (enforced by fiat) can sometimes kill the sentiment that gave it life.

  The rule had grip because it was a *convention* (Hume/Lewis). Now that it is contested, it is becoming a *law*. The "grip" will change from internalized sentiment to external enforcement. That is the transition you are managing.
