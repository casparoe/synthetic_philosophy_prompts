answer: |-
  This is a great setup for a podcast episode. Since your guest is a *defender* of Rawls, you don't need to ask her to explain the basics; you need to ask her to defend the architecture against the heaviest artillery.

  Here are 8 interview questions designed to move past exposition and into the contentious weeds. I've prioritized the three specific objections you requested (Harsanyi, Circularity, Cohen) and added follow-ups designed to prevent standard "textbook" dodges.

  ### 1. The Status of the Device
  "Let's skip the textbook definition of the Original Position. I want to ask about its ontological status. Some critics treat the Veil of Ignorance as a heuristic for empathy, but you've argued it's a device of representation. If it's not just a psychological trick to make us nice, but a model of *pure procedural justice*, how do we verify that the procedure is actually 'pure' and not just smuggling in substantive moral commitments under the guise of neutrality?"

  ### 2. The Harsanyi Objection (Risk & Rationality)
  "John Harsanyi argued that a rational agent behind the Veil, seeking to maximize their own good without knowing their place, should calculate based on the principle of insufficient reason and choose Average Utilitarianism. Rawls rejects this for Maximin (maximizing the minimum position), claiming the stakes are too high for probabilistic calculation. Critics say this just bakes extreme risk-aversion into the definition of 'rationality.' Is Maximin actually a requirement of rationality in this specific context, or is it a moral intuition disguised as a choice rule?"

  *   **Follow-up:** "If you say it's about the 'special nature' of the choice (that you can't gamble with basic liberties), doesn't that imply we already value liberties lexically *before* entering the Original Position? If so, isn't the choice behind the Veil merely confirming a value we already held, rather than deriving it?"

  ### 3. The "Rigged Setup" Objection (Circularity)
  "There's a persistent critique that the constraints of the Original Position—the thickness of the Veil, the motivation of the parties, the list of Primary Goods—are tailored specifically to generate the Difference Principle. If you tweaked the constraints slightly, you'd get a different result. How do you justify *these* specific constraints without referencing the principles they are intended to select? In other words, how do you avoid the charge that the input is designed to guarantee the output?"

  *   **Follow-up:** "Rawls relies on 'Reflective Equilibrium' to justify the constraints, matching them against our considered judgments. But if our considered judgments are already shaped by the liberal democratic culture Rawls wants to justify, isn't Reflective Equilibrium just a coherence trap? How do we know we aren't just circling our own cultural biases?"

  ### 4. The G.A. Cohen Objection (Incentives & Ethos)
  "G.A. Cohen argued that the Difference Principle permits inequalities only if they benefit the worst-off. But he noted that talented people often demand high incentives to be productive. Cohen claims that if the talented genuinely internalized the Difference Principle, they wouldn't need those bonuses to work hard. By accepting incentive-based inequality, is Rawls allowing the basic structure to accommodate selfishness rather than demanding justice from the individual choices of citizens?"

  *   **Follow-up:** "A common Rawlsian reply is that the Difference Principle regulates the *basic structure*, not personal choices. But if the structure relies on personal choices to function, doesn't that distinction collapse? If the talented withhold labor without a bonus, isn't that a form of coercion that the Original Position should have ruled out?"

  ### 5. Primary Goods vs. Capabilities
  "Rawls focuses on 'Primary Goods'—rights, liberties, income—as the metric for justice. Amartya Sen and Martha Nussbaum have argued this is too rigid; people have different abilities to convert those goods into actual freedom (Capabilities). A disabled person might need more income to achieve the same mobility as an able-bodied person. Does the Original Position's focus on all-purpose means fail to account for human heterogeneity in a way that undermines the Difference Principle?"

  ### 6. Stability in a Pluralistic Society
  "Rawls argues that a society ordered by Justice as Fairness would be stable because it generates its own support. However, we see that when people *do* know their position (unlike behind the Veil), those at the top often reject redistributive principles as unjust confiscation. Is the stability of a Rawlsian society dependent on a level of moral consensus that is no longer possible in highly polarized, pluralistic democracies?"

  ### 7. Ideal vs. Non-Ideal Theory
  "The Original Position is a model for a 'well-ordered society.' But we live in a world with historical oppression, entrenched racism, and unjust accumulation. Critics argue that applying Rawls now, without rectifying historical injustices first, just locks in past wrongs under the guise of 'fair' future procedures. Does the Original Position have the resources to handle non-ideal theory, or does it require a clean slate that history never gave us?"

  ### 8. The Strongest Contemporary Threat
  "You've spent your career defending this framework. If you had to pick one contemporary argument—whether from the libertarian right, the luck-egalitarian left, or the realist critics—that poses the most genuine threat to the Original Position's viability, what is it? And where do you think the Rawlsian framework needs to evolve to survive it?"

  ***

  ### Producer's Note for the Host
  Since your friend's argument was about the **Circularity/Rigged Setup** (Question 3), here is a quick cheat sheet on what to listen for during her answer:

  *   **If she says:** "The constraints are based on what it means to be a free and equal person."
      *   **Your counter:** "But isn't that definition of 'free and equal' itself a moral conclusion? If you define the person that way, of course they choose liberal principles."
  *   **If she says:** "The Original Position is just a representation of our considered judgments."
      *   **Your counter:** "That's the Reflective Equilibrium dodge. It admits the work is being done by our intuitions, not the Veil itself. So why do we need the Veil?"
  *   **If she says:** "The constraints are necessary to ensure fairness."
      *   **Your counter:** "Fairness is the *result* we are trying to prove. You can't use fairness to justify the setup that proves fairness."

  Good luck with the recording! This lineup should give your friend plenty of ammo, but also show him where the sophisticated defenses actually lie.
