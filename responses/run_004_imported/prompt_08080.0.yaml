answer: |-
  **MEMORANDUM**

  **TO:** All Member-Owners, [Co-op Name]
  **FROM:** [Your Name], Admissions Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Admissions Bylaw Reform

  ### Executive Summary
  At next month's Annual Meeting, we will vote on whether to retain our current admissions bylaw, which permits unanimous, no-reason rejection of prospective buyers, or to adopt a new framework. After reviewing the operational risks and ethical implications of both systems, **I recommend we amend the bylaws to replace discretionary vetting with published objective criteria and a lottery system for qualified applicants.**

  If passed, the new criteria will be drafted by a working group by Q1, with the first lottery-based admission cycle opening in Q2 of next year.

  ### The Proposal: Criteria + Lottery
  Under this model, the Admissions Committee would publish clear financial and eligibility thresholds (e.g., debt-to-income ratios, credit minimums, residency requirements). Any applicant meeting these hard criteria enters a pool. If applicants exceed available units, winners are selected by blind lottery.

  This approach treats admissions as a deterministic process rather than a subjective one. It removes the "black box" nature of our current system, ensuring that every qualified applicant has an equal statistical probability of success, regardless of background or network.

  ### The Case for the Status Quo (A Necessary Hearing)
  Those arguing to retain the current bylaw are not simply arguing for tradition; they are arguing for **fiduciary prudence and associational liberty.**

  The strongest argument against my recommendation is that a housing cooperative is not a standard landlord-tenant arrangement; it is a voluntary association of individuals who share unlimited financial liability. If one member defaults on their maintenance fees, the remaining members must cover the shortfall to protect the underlying master mortgage. Therefore, the group possesses a sovereign right—akin to a nation-state determining citizenship—to assess not just an applicant's solvency, but their long-term reliability and community "fit."

  Proponents argue that reducing admission to a checklist ignores soft risks that don't appear on a credit report. They contend that in a tight housing market, the current system protects the community's financial solvency by allowing the group to reject applicants who, while financially qualified, may pose a behavioral risk to the collective stability. To strip the committee of this discretion is to prioritize the applicant's convenience over the existing members' financial security.

  ### Why We Must Move Forward
  While the financial concerns above are valid, they can be addressed through rigorous *objective* financial criteria rather than subjective social vetting. The current system presents three critical failures that outweigh the benefits of discretion:

  1.  **Systemic Bias:** Unreviewable discretion creates a single point of failure for bias. Even with good intentions, "fit" is historically correlated with homogeneity. In a diverse city, our co-op should not replicate broader housing inequities.
  2.  **Legal Liability:** As fair housing laws evolve, "no-reason" rejection clauses are becoming increasingly litigious. A deterministic system protects the co-op from lawsuits that could threaten our very solvency.
  3.  **Market Reality:** The argument that "rejected buyers can find other housing" is no longer tenable. When inventory is near zero, gatekeeping mechanisms effectively deny housing access based on opaque criteria.

  We can protect our financial exposure through strict income/asset requirements without retaining the power to reject qualified neighbors without cause.

  ### Implementation Timeline
  *   **November 15 (Annual Meeting):** Vote on bylaw amendment.
  *   **December – February:** Admissions Working Group drafts published financial criteria for member review.
  *   **March 1:** New criteria ratified and published.
  *   **April 1:** First admission cycle opens under new lottery system.

  ### Conclusion
  This change shifts our culture from one of exclusion to one of equitable opportunity, without compromising our financial safety. I urge you to review the attached draft language and come prepared to vote for a more transparent future.

  Respectfully,

  [Your Name]
