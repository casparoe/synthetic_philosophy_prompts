answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Committee
  **FROM:** [Your Name], Aggregation Lead
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Q17 Divergence & Standing Outlier Policy

  ### Executive Summary

  For Friday's report on **Q17**, I recommend we publish the **community median (approx. 55%) as the Official Operational Forecast**, but explicitly annotate the **92% assessment as a "High-Confidence Dissent"** in the narrative analysis. We should **not** mechanically haircut her probability, nor should we allow a single outlier to skew the aggregate mean.

  Going forward, I propose we adopt a **"Robust Aggregation + Flagging" policy**. This replaces mechanical discounting with a shift from *mean* to *median* for official numbers, coupled with a mandatory "divergence flag" whenever a top-quartile forecaster deviates >30 points from consensus.

  ### Situation Analysis: Q17

  We face a classic tension between the *Outside View* (our historical retro data) and the *Inside View* (our best forecaster's specific intuition).

  *   **The Outside View:** Our retro indicates that when confident holdouts (>30pts from consensus) stick to their guns, they are right ~50% of the time. Statistically, this suggests a 92% confidence level in this cluster is miscalibrated; the base rate suggests the event is a coin flip.
  *   **The Inside View:** The forecaster in question has a strong overall track record. She acknowledges the retro data but reports that her specific evidence on Q17 remains unchanged. This is not stubbornness; it is a statement that her current information set overrides the reference class.

  **The Risk of Mechanical Discounting:**
  If we implement a policy that automatically haircuts probabilities when they diverge from consensus, we risk optimizing for mediocrity. The primary value add of a superforecaster is identifying *when the consensus is wrong*. If we penalize divergence, we incentivize forecasters to shade toward the mean to avoid friction, destroying the very signal we built this project to capture. Furthermore, the retro itself is just a statistic derived from past noise; it is a prior, not a physical law. It should inform our confidence, not veto individual judgment.

  **The Risk of Raw Aggregation:**
  Conversely, if we use a simple mean, a single 92% can drag the aggregate significantly away from the wisdom of the crowd (55%). If the retro holds and she is miscalibrated on *this specific type* of question, the mean becomes less accurate.

  ### Recommendation: Q17 Handling

  **1. Official Number:** Publish the **Median (55%)**.
  The median is robust to outliers. It respects the crowd's calibration without silencing the outlier. It acknowledges that while one person sees 92%, the "center of gravity" of the room is 55%.

  **2. Narrative Annotation:** Include a dedicated **"Dissenting View"** box in the report.
  > *"While the aggregate forecast sits at 55%, Forecaster [Name] maintains a 92% probability based on [brief reason, e.g., specific intel/structural argument]. Historical data suggests confident outliers in this cluster resolve at ~50%, indicating high uncertainty. Decision-makers should treat the 55% as the baseline but stress-test against the 92% scenario."*

  This approach preserves the signal (decision-makers see the 92%) without letting it dominate the calibration of our official record.

  ### Standing Policy: The "Divergence Protocol"

  To handle future instances without ad-hoc committee stress, I propose we adopt the following standing rules:

  **1. Aggregation Method: Median over Mean**
  Effective immediately, our "Official Forecast" will be the community median, not the mean. This naturally mitigates the impact of extreme outliers without requiring us to censor or manually adjust individual inputs. It allows forecasters to report their true beliefs (even 99%) without breaking the aggregate.

  **2. The 30-Point Flag**
  When a forecaster in the top quartile (by Brier score) deviates by >30 points from the median:
  *   **No Automatic Discount:** We do not alter their submitted number.
  *   **Mandatory Rationale:** The system prompts the forecaster for a 2-sentence public rationale (if not anonymous) or private note to admins.
  *   **Report Flag:** The weekly report automatically generates a "High-Variance Alert" icon next to the question, linking to the rationale.

  **3. Calibration Tracking (Conditional)**
  We will track a secondary metric: **Calibration-Conditional-on-Divergence.**
  Currently, we know our holdouts are right 50% of the time. We need to know if *specific* forecasters beat that 50% over time.
  *   If a specific forecaster consistently beats the 50% base rate when diverging, we grant their outliers more narrative weight in future reports.
  *   If they track the 50% rate (as is currently the case), we continue to treat their outliers as "high risk/high uncertainty" rather than "high probability."

  ### Rationale

  This policy avoids the "both sides shrug" by making a concrete choice: **We trust the median for action, but we trust the outlier for scenario planning.**

  It respects the forecaster's epistemic autonomy (she keeps her 92%) while respecting the organization's need for calibrated risk assessment (we act on the 55%). It treats the retro data as a *calibration warning* rather than a *truth veto*. This maintains the incentive for forecasters to speak up when they see something others miss, while protecting the org from acting on overconfidence that history suggests is likely noise.

  **Next Steps:**
  If approved, I will update the Friday report template to include the "Dissenting View" section and adjust the aggregation script to calculate medians by next quarter.

  ***

  **Approval:**
  [ ] Approved
  [ ] Approved with Modifications
  [ ] Discuss in Committee
