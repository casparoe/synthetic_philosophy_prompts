answer: |-
  The room was white, silent, and smelled of ozone. Elias stood before the Aperture, a smooth ring of black metal set into the wall. On the other side was the Clearance—the visa, the cure, the passage for his daughter. All he had to do was walk through the ring tomorrow at noon.

  But not just walk. He had to *mean* it.

  Sitting behind the glass partition was the Adjudicator. She didn't look up from her tablet. "You understand the protocol, Mr. Vance?"

  "I understand," Elias said. His voice sounded thin in the sterile air. "The Aperture grants the Clearance now, based on my intent to enter the Zone tomorrow."

  "Correct. The Clearance is transferred the moment we verify your sincerity. The Walk is scheduled for 12:00 PM tomorrow. The Zone is lethal. You will not survive."

  "I know."

  "And yet," the Adjudicator said, finally looking up. Her eyes were tired. "Once the Clearance is yours, your daughter is safe. Your objective is met. Walking into the Zone serves no purpose. It is purely costly. A rational agent does not incur pure cost without benefit."

  "I'm not asking for logic," Elias said. "I'm asking for the scan."

  "We cannot scan for logic. We scan for causal continuity. We need to see a bridge between who you are now and who you will be tomorrow."

  Elias closed his eyes. This was the knot. It had been tightening in his chest for three hours.

  He wanted to save his daughter. He loved her more than his own life. That part was easy. If the deal were *"Walk into the Zone now, and she gets the Clearance,"* he would have stepped through the black ring before the sentence finished. He would be dead, and she would be safe. A simple transaction.

  But the deal was *"Intend to walk tomorrow, and she gets the Clearance."*

  To pass the scan, he had to genuinely believe, right now, that he would walk into the Zone tomorrow. But he also knew exactly how tomorrow would feel.

  He imagined the moment: 11:55 AM tomorrow. The Clearance would already be in his account. The doctors would already be treating his daughter. He would be standing at the edge of the Zone, alive, breathing, knowing that stepping forward would change nothing. It wouldn't make her safer. It wouldn't make him happier. It would just end him.

  Why would he do it?

  "I can do it out of duty," Elias said, opening his eyes.

  "Duty is a motivation," the Adjudicator said. "But motivations expire. Once the reward is secured, the duty is fulfilled. You will know that your death is unnecessary. Knowing that, you will not walk. Knowing you will not walk, you cannot intend to walk now."

  "I can promise myself."

  "We don't scan for promises. We scan for probability. If the probability of you walking drops below ninety percent once the Clearance is granted, the intent is false."

  Elias gripped the edge of the podium. He tried to force the belief. He tried to tell himself, *I am the kind of man who keeps his word.* But the thought felt hollow. He knew himself. He was a father, not a martyr. Once the danger to his daughter was gone, the instinct for self-preservation would roar back to life. It would scream at him to run. And he would listen.

  He knew he would listen.

  That was the poison. It wasn't the Zone that killed him; it was the knowledge of his own rationality. He couldn't intend to do something he knew he wouldn't do. To intend was to predict your own action. And his prediction was clear: *When the money is in the bank, you don't burn the house down.*

  "Can I hypnotize myself?" Elias asked. "Can I take a drug that makes me forget the Clearance was granted?"

  The Adjudicator shook her head. "We scan for the intent *now*. If you plan to alter your mind later to force compliance, that is not intent. That is coercion. The bridge breaks."

  Elias looked at the black ring. It looked like a pupil, staring back at him.

  He tried to find a reason that would survive the reward. He needed a motive that would still be burning at 11:55 AM tomorrow, even after his daughter was safe.

  *Maybe I'll be ashamed?* No, shame fades.
  *Maybe I'll feel obligated?* Obligation feels lighter when the stakes are gone.
  *Maybe I'll just do it on autopilot?* The scan detects hesitation.

  He realized then that the Adjudicator wasn't testing his loyalty. She was testing his ability to be irrational. She needed him to be the kind of person who would walk into fire for no reason, simply because he said he would. But to get the reward, he had to be rational enough to understand the deal. And if he was rational enough to understand the deal, he was too rational to follow through.

  The only way to win was to be a fool. But he couldn't pretend to be a fool. The machine knew the difference between stupidity and sincerity.

  "I can't," Elias whispered.

  "The scan hasn't started," the Adjudicator said softly.

  "It doesn't matter. I can't form the intent. I know too much."

  "You know that you will survive tonight," she said. "You know that she will be safe. You know that death is final. Those are facts. You are trying to build a intention on a foundation of facts that undermine it."

  Elias stepped back from the podium. The white room seemed to press in on him. He thought of his daughter's face, pale in the hospital bed. He would do anything for her. Anything except this. Because *this* required him to not know what he knew. It required him to believe that tomorrow, when he had everything to live for, he would choose to die.

  He couldn't lie to the machine. But worse, he couldn't lie to himself.

  "If I walk away," Elias said, "she doesn't get the Clearance?"

  "Correct. The condition is unmet."

  "And if I stay? If I try to convince myself?"

  "You will sit here until noon tomorrow," the Adjudicator said. "You will wrestle with the logic. You will try to manufacture a reason that outlasts the reward. And you will fail. Because you are sane, Mr. Vance. And sane men do not intend to suffer without cause."

  Elias looked at the black ring one last time. He wanted to be insane. He wanted to be the kind of man who could jump. But he could see the ground too clearly.

  He turned toward the door.

  "Mr. Vance?"

  He stopped, but didn't turn around. "I'll find another way."

  "There isn't one."

  "Then I'll stand here," Elias said, his voice cracking. "I'll stand here and try to believe a lie. But you know what the scan will say."

  "Yes," the Adjudicator said. She put her tablet down. "It will say that you love her enough to try. But not enough to stop thinking."

  Elias walked out into the hallway. The door slid shut behind him, sealing the white room and the black ring away. He leaned against the cold wall, sliding down until he hit the floor. He closed his eyes and tried, just for a second, to imagine himself walking into the fire tomorrow.

  He saw himself turning back. He saw himself running.

  He opened his eyes. The knot remained, tight and unbreakable, holding him safely in the world of the living, and leaving her in the world of the sick.
