prompt: |-
  I'm taking a decision theory seminar this term, and a real dilemma from my own life keeps nagging at me in a way I can't fully rationalize. I have two summer internship offers. Offer A is transparent: there's exactly a 50% chance I'd be placed on the flagship product team and a 50% chance I'd be placed on a smaller, less visible team, and I know what each entails. Offer B's manager won't specify how placements are decided at all -- she just says "it depends on team needs at the time" -- but when I asked former interns, their experiences average out to roughly the same mix of good and bad placements as Offer A. Even though the expected outcomes seem comparable on paper, I strongly prefer Offer A, and a friend insists I'm being irrational since the odds work out the same either way. Is she right that my hesitation makes no sense, or is there a legitimate reason to favor the offer with clearly stated odds over the one with unspecified ones?
reasoning: |-
