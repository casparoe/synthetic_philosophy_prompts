          2.  **Robustness:** The 50/50 for B is an *estimate* based on anecdotal evidence. The 50/50 for A is *stated policy*. Estimates have variance; policies are more stable.
          3.  **Regret Minimization:** If you get the bad team in B, you'll think "If only I knew." In A, you knew the odds.
