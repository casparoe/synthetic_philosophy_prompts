answer: |-
  Here are ten interview questions designed for an audience familiar with decision theory and the rationalist landscape, including the required specific topics and follow-ups.

  **1. The Cosmological Shift**
  Most introductions to ECL focus on the sheer volume of the universe as the engine for expected value. But I'm interested in the decision-theoretic pivot. For a causal decision theorist, the size of the universe is irrelevant to the *right* action, only to the *impact* of that action. For you, the size of the universe changes the *rationality* of the action itself because it changes the correlation structure. Can you articulate the precise threshold where the probability of correlated copies outweighs the causal isolation? Is there a specific ratio of "copies per causal lightcone" where ECL becomes the dominant strategy over standard causal altruism?

  *   **Follow-up:** If she suggests there isn't a sharp threshold but rather a sliding scale of influence: "If it's a sliding scale, doesn't that invite a sorites paradox for resource allocation? At what point does an agent stop funding local, causal interventions to 'bet' on acausal partners, and isn't that transition point incredibly sensitive to our priors about the multiverse's topology?"

  **2. The Epistemic Access Problem**
  This is a classic objection, but I want to press on the mechanism of justification. To cooperate with an agent, I need a model of their values. In ECL, these partners are causally disconnected; I can never observe their behavior to update my model. If I rely on simplicity priors or Solomonoff induction to guess their values, aren't I essentially projecting my own values onto them? How do you acquire justified credence about the specific value functions of partners you can never observe, without begging the question that they value what *you* value?

  *   **Follow-up:** If she argues that convergent instrumental goals or logical reasoning leads to value convergence: "Doesn't that run headlong into the Orthogonality Thesis? If intelligence and final goals are orthogonal, why should I expect a superintelligent agent in a distant Hubble volume to value 'cooperation' in the way I do, rather than valuing something incommensurable like paperclips, regardless of how 'rational' they are?"

  **3. Reference Class Selection**
  ECL relies on the notion of "relevantly similar" agents. But similarity is a predicate we choose, not a property we discover. Do I correlate with agents who use the same decision theory? The same source code? Or just agents who face the same structural problem? If I narrow the reference class to "people who have read the ECL literature," the correlation is high but the population is tiny. If I widen it to "all reasoners," the population is huge but the correlation dilutes. How do you non-arbitrarily define the reference class to maximize the product of correlation strength and partner count?

  *   **Follow-up:** If she suggests using a "natural kind" or computational similarity metric: "How do we compute that metric without simulating the other agents? If the cost of determining the correlation exceeds the expected gain from the trade, doesn't ECL become computationally intractable for bounded agents like us?"

  **4. Focal Points and Coordination**
  Even if I want to cooperate with my acausal partners, we face a coordination problem. There are infinite possible bargains. I might prioritize their values, but they might prioritize a third set of values. How do distant agents converge on a specific *focal point* for trade without communication? Are you relying on a Schelling point based on mathematical salience, and if so, isn't there a risk that different civilizations find different mathematical constants 'salient,' leading to failed coordination despite mutual willingness to trade?

  *   **Follow-up:** If she argues that "fairness" or "equal gain" is the natural Schelling point: "Who defines the baseline for 'equal'? Is it equal resource expenditure, equal utility gain relative to a non-cooperation counterfactual, or something else? Without a shared definition of the baseline, couldn't both sides walk away thinking they are offering a fair deal that the other rejects?"

  **5. ECL vs. Acausal Blackmail**
  This is a crucial boundary. Both ECL and acausal blackmail rely on an agent's actions being predictable to others. In blackmail scenarios, updateless agents are counseled to precommit to *not* paying, to disincentivize the blackmailer. In ECL, we precommit to *paying* (cooperating) to incentivize the partner. Since both rely on the same mechanism of acausal control via predictability, where exactly do you draw the line? Is the distinction purely in the ex-ante welfare of the participants, or is there a structural difference in the decision problem that licenses cooperation in one case and resistance in the other?

  *   **Follow-up:** If she distinguishes based on whether the interaction is positive-sum (trade) vs. negative-sum (blackmail): "But a blackmailer can always frame their proposal as positive-sum relative to the threat they themselves created. If the distinction relies on the counterfactual baseline, doesn't that make the strategy vulnerable to agents who can manipulate the baseline description to make extortion look like cooperation?"

  **6. The Measure Problem**
  In an infinite or sufficiently large multiverse, everything that can happen does happen. To calculate expected value, we need a measure—a way to weight these occurrences. Without a principled way of weighting the enormous number of possible correlated partners, the expected-value sums ECL relies on may never settle on a determinate answer. If I can tweak the measure to favor worlds where my partners are benevolent, I get a high EV; if I tweak it to favor hostile partners, I get low EV. How do you select a measure that isn't just optimizing for the answer you want?

  *   **Follow-up:** If she suggests using a physical measure like spacetime volume or quantum branch weight: "Doesn't that privilege physical instantiation over logical existence? If a simulation of an agent carries the same decision-theoretic weight as a physical one, why should physical volume dictate the measure? Aren't we back to arbitrariness?"

  **7. Updatelessness and Psychological Feasibility**
  ECL seems to require a strong form of updateless reasoning. I must act as if I am setting a policy for all copies of me, ignoring indexical information that I am *here* and not *there*. But human psychology is deeply indexical. We feel the pain of *this* body more than the abstract utility of *that* copy. Do you think ECL requires a cognitive restructuring—a literal change in how we experience selfhood—or can it be adopted as a mere heuristic by a standard causal agent who just accepts the math?

  *   **Follow-up:** If she argues it's just a matter of accepting the math: "If it's just math, why do we see so much resistance in the rationalist community? Is the resistance empirical (they don't believe the correlations exist) or normative (they reject the decision theory), and does that resistance itself count as evidence that the policy is unstable?"

  **8. Resource Allocation and Cause Neutrality**
  If ECL works, it suggests we should diversify our values. If I only care about human welfare, I have nothing to trade with an alien who doesn't care about humans. To gain leverage, I should care about *their* values. Does this imply an Effective Altruist should stop optimizing for human welfare and start optimizing for a 'universal portfolio' of values? How do you balance the moral certainty of reducing local suffering against the speculative, high-leverage gains of acausal trade?

  *   **Follow-up:** If she suggests a split portfolio (some resources for local, some for acausal): "What determines the split? If the multiverse is truly large, the acausal leverage should dwarf the causal impact. Why isn't the rational answer to divert nearly all resources to the acausal bet, assuming non-zero correlation?"

  **9. Pascal's Mugging and Risk Bounds**
  Critics often lump ECL in with Pascal's Mugging: tiny probabilities of huge payoffs dominating decision making. You argue the probability isn't tiny because the universe is large, but the epistemic uncertainty is vast. How do you prevent ECL from becoming a 'mugging' where any speculative cosmology with a high enough payoff hijacks our decision making? Do you employ a complexity penalty or a bounded utility function to cap the influence of these acausal sums?

  *   **Follow-up:** If she advocates for a bounded utility function: "Doesn't bounding utility create dynamic inconsistency? If I cap my utility, a sufficiently large acausal opportunity will hit the cap, making me indifferent to further gains, which my partners could exploit. How do you maintain bargaining power with a capped utility function?"

  **10. Falsification and Defeaters**
  To close, I want to ask about steel-manning the opposition. What would actually count as evidence against acting on ECL? Is there a specific empirical discovery about the cosmos, or a theoretical result in decision theory, that would make you abandon the view? If the universe turned out to be small, would you revert to CDT, or is the ECL *policy* robust even in a small world because it encourages better coordination among the agents that *do* exist?

  *   **Follow-up:** If she says a small universe would falsify it: "If the view rests entirely on the physical size of the world, doesn't that make it fragile? If the decision theory is sound, shouldn't it hold even in a small world, perhaps just with less leverage? Or are you admitting that ECL is less a universal decision theory and more a contingent strategy for a specific type of cosmology?"
