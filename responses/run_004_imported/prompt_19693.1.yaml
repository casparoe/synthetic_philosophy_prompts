  Hey, I'm covering material constitution in my metaphysics seminar this week and I'm so tired of trotting out the statue-and-lump-of-clay case the same dry way every year (you know, the Lumpl-and-Goliath version, if you want Gibbard's names for it). Could you write me a short story, maybe a page long, that gets at the same puzzle but through something like a golem myth instead—clay that gets animated into a person-like thing and then eventually looses that animation? Don't just namedrop the concept, I want the story itself to make someone feel the pull of thinking the golem and the lump of clay it's made of might have different persistence conditions, even tho for a while there they're built out of exactly the same stuff. Doesn't need a tidy ending, these puzzles are more fun left open anyway.
