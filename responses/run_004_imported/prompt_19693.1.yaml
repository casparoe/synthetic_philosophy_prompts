answer: |-
  **The Breath of Earth**

  The mud came from the Vltava, dredged up in buckets, heavy and grey and older than the city itself. For weeks, it sat in the cellar of the synagogue, covered by a linen sheet. It was just earth then. If you had kicked it, you would have stained your boot. If you had swept it into the garden, it would have grown weeds. It had no name, only a location.

  Then came the night of the circling. The Rabbi and his apprentice, Eli, walked around the mound, whispering the combinations of letters until the air hummed. Finally, the Rabbi placed the *shem*—the parchment name of God—into the clay mouth.

  The earth did not harden. It softened, warmed, and drew breath.

  Eli watched the thing stand up. It looked exactly like the mound that had been on the floor a moment before, yet it was entirely different. The mound could not walk; this thing could. The mound could not lift a bucket; this thing did. Eli called him Yosef. For three months, Yosef swept the courtyard and carried water. He occupied space. He cast a shadow.

  During those months, Eli often found himself staring at Yosef's arm while the Golem rested. He would touch the skin. It felt like baked clay, warm from the sun. Eli knew that if he took a knife and scraped a bit of the wrist, he would find mud. He knew that the stuff making up Yosef was the exact same stuff that had sat under the linen sheet. But he couldn't shake the feeling that the *thing* he was touching was not the mud.

  The mud had existed for centuries, geologically speaking. Yosef had existed for ninety days.

  "It is time," the Rabbi said on a Tuesday. Yosef was too strong; the people were beginning to fear him.

  Eli protested. "He is working. He is useful."

  "He is a vessel," the Rabbi said. "Not a son."

  They called Yosef into the cellar. The Golem stood where the mound had once been. He occupied the exact same coordinates in the room. He was made of the exact same particles. But Eli felt a tightness in his chest, a premonition of loss that didn't make sense. If you melt a gold ring, you still have the gold. Why did this feel like a death?

  The Rabbi reached into Yosef's mouth and pulled out the parchment.

  The sound was not a crash, but a slump. A heavy, wet settling. Yosef did not fall like a man faints; he collapsed like a building whose supports are removed. He became a pile.

  Eli stood over the heap. It was grey. It was silent. It smelled of the riverbank.

  "Clean it up," the Rabbi said, turning to leave. "Put it back in the sacks. We may need it for the next one."

  Eli stood alone in the cellar. He looked at the pile.

  If he picked up a handful of this clay and threw it against the wall, would he be desecrating a corpse? Or just making a mess with dirt? The matter was identical to the matter that had walked and carried water an hour ago. If identity is just matter, then Yosef was still here, just lying down. But if Yosef is the *form*, the animation, the function, then Yosef was gone, and only the raw material remained.

  Eli knelt and touched the heap. It was cold now.

  He remembered Yosef's hand on his shoulder last week, steadying him when he slipped on the ice. That hand was made of this mud. But this mud could not steady anyone. This mud could not be a friend.

  Eli picked up a shovel. He hesitated. If he scooped Yosef into the sack, was he burying a person or storing supplies? The pile sat before him, stubborn and opaque. It occupied the space where a person had been, made of the stuff that had always been, waiting for Eli to decide whether the thing that mattered had vanished, or merely changed shape.

  He lifted the shovel. The clay made a wet sound, like a sigh, or perhaps just mud settling into metal. Eli wasn't sure which.
