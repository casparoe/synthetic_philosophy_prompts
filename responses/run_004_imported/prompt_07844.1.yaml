      *   **Counterfactual Conditionals ("If P had been, then Q would have been"):** Usually evaluated based on *metaphysical* or *causal* closeness. We assume P is false in reality, then we "rewind" the world just enough to make P true, keeping everything else as similar as possible, and see if Q happens.
