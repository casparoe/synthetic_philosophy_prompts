answer: |-
  This is an exceptionally sharp observation. You have correctly identified one of the most persistent and subtle tensions in the philosophy of physics. Your confusion is well-founded because the narrative you were taught in class is the "standard textbook story," but it is a simplification that glosses over what actually happened when Einstein finalized General Relativity (GR).

  The short answer is: **General Relativity killed Newton's *Absolute Space*, but it inadvertently gave birth to a much stronger form of *Spacetime Substantivalism*.**

  Here is the breakdown of why the debate didn't end, why substantivalists are still around, and what they are actually arguing for.

  ### 1. The Crucial Distinction: "Absolute Space" vs. "Dynamic Spacetime"
  Your teacher was right that GR got rid of **Newton's Absolute Space**. Newton imagined space as a rigid, invisible, unchanging grid that existed forever. It was a passive stage. Nothing could act on it, and it couldn't act on anything (except by defining inertia).

  However, in General Relativity, spacetime is not a passive stage. It is a **dynamic participant**.
  *   It curves.
  *   It ripples (gravitational waves).
  *   It evolves over time.
  *   It interacts with matter (matter tells space how to curve; space tells matter how to move).

  **The Substantivalist's Modern Argument:**
  If spacetime can curve, ripple, and carry energy, doesn't that make it a "thing"?
  In Newton's physics, you could argue space is just a relation because it does nothing. In GR, spacetime *does* things. If you have a gravitational wave passing through a region of the universe that is completely empty of matter, *what is waving?*
  *   **The Relationist says:** It's just a change in the potential relationships between hypothetical particles.
  *   **The Substantivalist says:** No, the metric field itself is a physical object. It has degrees of freedom. It carries energy. Therefore, spacetime is a substance.

  This is why gravitational waves are the substantivalist's best friend. If space were merely a bookkeeping system for relations between objects, it shouldn't be able to transport energy across a vacuum. But LIGO detected it doing exactly that.

  ### 2. The Failure of Mach's Principle
  You mentioned that Einstein hoped to formalize Mach's Principle. This is true, but the historical twist is that **Einstein failed.**

  Mach argued that inertia (resistance to acceleration) is caused by the gravitational pull of all the distant matter in the universe (the "fixed stars"). If there were no distant stars, there would be no inertia.
  *   **In GR:** You can have a universe with no matter in it at all (a "vacuum solution," like Minkowski space). In this empty universe, a particle still has inertia. It still resists acceleration.
  *   **The Implication:** If inertia exists without other matter to relate to, then inertia must be a property of the particle's relationship with *spacetime itself*, not just other matter.

  This was a huge blow to strict relationism. It suggests that spacetime has an existence independent of the matter within it. You can peel away all the stars and galaxies, and the "container" (spacetime) remains, with its own geometry and laws.

  ### 3. The Hole Argument (The Technical Core)
  You mentioned finding references to the "Hole Argument." This is the specific technical reason philosophers still fight about this.

  Einstein himself struggled with this between 1913 and 1915. Here is the simplified version:
  Imagine a region of space (the "hole") where there is no matter. According to GR, the geometry of spacetime is defined by a mathematical object called the *metric field*.
  *   If you are a **Substantivalist**, you believe the points of spacetime exist independently. Point A is Point A, regardless of what fields are on it.
  *   If you shift the metric field slightly within the hole (a mathematical move called a *diffeomorphism*), the physics looks the same to an observer, *but* the field is now attached to different spacetime points.

  **The Problem:** If spacetime points are real substances (Substantivalism), then shifting the field creates a physically different situation (the field is now on Point B instead of Point A). But since the shift is undetectable, GR cannot tell us which situation is the real one. This leads to **radical indeterminism**: the theory cannot predict the future state of the metric field inside the hole, even with perfect knowledge of the past.

  To avoid this indeterminism, many physicists argue we must deny that spacetime points have independent identity. This pushes us back toward relationism (or a view called "sophisticated substantivalism"). The Hole Argument proves that you cannot simply treat spacetime points like little distinct atoms of space.

  ### 4. So, What Are They Arguing About Now?
  Since Newton's "Absolute Rest" is gone, the debate has shifted from "Is there a preferred frame?" to "What is the ontological status of the metric field?"

  **Modern Substantivalists argue:**
  *   Spacetime is a physical field (the metric field) just like the electromagnetic field.
  *   It exists even where there is no matter.
  *   It is the bearer of energy and momentum (gravitational waves).
  *   Therefore, it is a "substance" (though not a material one).

  **Modern Relationists (or Structural Realists) argue:**
  *   Spacetime points have no identity independent of the physical fields defined on them.
  *   Talk of "spacetime" is just shorthand for the causal structure of events.
  *   The "energy" in gravitational waves is pseudo-tensorial and depends on your coordinate system, so it doesn't prove spacetime is a "thing."

  ### Summary for Your Understanding
  Your teacher told you that GR vindicated Mach and Leibniz. In a pop-sci sense, this is true because there is no "absolute rest." However, in a deep philosophical sense, **GR actually made spacetime *more* real than it was in Newton's physics.**

  *   **Newton:** Space is a rigid, invisible container. (Easy to argue it's fake/relational).
  *   **Einstein:** Spacetime is a flexible, dynamic fabric that ripples and carries energy. (Harder to argue it's fake/relational).

  The reason philosophers still call themselves substantivalists is that the mathematics of General Relativity treats spacetime as a dynamic variable that exists independently of matter. If you take the math literally, spacetime is a real object. If you think the math is just a tool for prediction, you lean toward relationism.

  You have stumbled upon the fact that physics describes *how* the universe behaves, but philosophy is required to decide *what* the universe is made of. GR gave us a new, stranger "stuff" (spacetime) to argue about, rather than settling the argument.

  **Recommendation:** If you want to read more, look up **"Earman and Norton on the Hole Argument"** or **"Harvey Brown on Physical Relativity."** They represent the two sides of this modern debate. You are asking exactly the right questions to move from learning physics to understanding the nature of reality.
