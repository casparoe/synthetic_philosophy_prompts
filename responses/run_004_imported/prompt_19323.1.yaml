      *   **Textual Grounding 3: The Oracle (§609+).** This is the clincher for relativism. Wittgenstein says we can't convince them *unless* they share some ground. But he also implies that if their predictions fail consistently, the hinge *must* move.
      *   **Addressing Relativism (Witchcraft/Young Earth):** Why are these bad? Not because they violate "Reason." Because they create *tension* within the web of judgments. If you believe the earth is 6000 years old, you have to deny geology, physics, astronomy. The "cost" of maintaining that hinge becomes too high for the practice of navigating the world. It's not irrational; it's *unlivable* at a certain level of technological integration.
