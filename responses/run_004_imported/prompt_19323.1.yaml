answer: |-
  **Title:** The Riverbed and the Friction: A Defense of Pragmatic Enactivism in *On Certainty*

  **To:** Seminar Instructor
  **Re:** The Hinge Dispute and the Relativism Objection

  You asked for a take that doesn't referee from a distance but steps into the fray. You also asked for a solution to the relativism problem that doesn't shrug. Here is my position: Your seminar is stuck because it is trying to force *On Certainty* into a traditional epistemological box (justified vs. unjustified, belief vs. non-belief). The text resists this.

  I am siding with **Danièle Moyal-Sharrock's enactivist reading**, but with a crucial modification regarding normativity that addresses your relativism worry. The standard objection to Moyal-Sharrock is that if hinges are merely "animal certainties" or know-how, we lose the ability to criticize bad hinges (witchcraft, young earth creationism). I argue the opposite: it is precisely *because* hinges are practical dispositions rather than theoretical beliefs that we can critique them without appealing to a mythical "God's eye" rationality.

  Here is the argument, grounded in the text.

  ### 1. The Category Mistake: Belief vs. Action
  The debate between Pritchard (arational), Wright (entitlement), and Coliva (constitutive belief) shares a fatal assumption: that a hinge commitment is a *propositional attitude* that needs a status label. Is it a belief? Is it a warrant? Is it arational?

  Wittgenstein's hinge metaphor (§341–343) suggests none of these. He writes: *"The questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn."* (§341). He continues: *"That is to say, it belongs to the logic of our scientific investigations that certain things are in deed not doubted."* (§342).

  Notice the phrasing: *"in deed not doubted."* It is not that we have mentally assented to them without evidence (Coliva); it is that our *investigations* turn on them. If you try to doubt the hinge, the door doesn't just stay shut; the mechanism of opening and closing ceases to function.

  When Wittgenstein says, *"If I want the door to turn, the hinges must stay put"* (§343), he is describing a functional role, not a doxastic state. To treat "The earth exists" as a belief is to treat it as something I hold in my mind. But in *On Certainty*, certainty is manifested in *acting*. As he says in §7: *"I act with complete certainty. But this certainty is my own."* It is not a mental glow accompanying the action; it is the action itself.

  This is why Pritchard is half-right (it's not a standard belief) but wrong to call it "arational" (implying it's outside the space of reasons entirely), and why Wright is wrong to try to rehabilitate it as a "warrant." Both are trying to justify the hinge. But hinges are not justified; they are *exercised*.

  ### 2. The Riverbed: Fluidity Against Dogmatism
  This brings us to the relativism objection. If hinges are groundless ways of acting, what stops a community from hinging on "Witchcraft causes illness"? If hinges are just "what we do," isn't everything permitted?

  This objection relies on the idea that hinges are *fixed*. But Wittgenstein's riverbed metaphor (§96–99) explicitly denies this. *"The myth of the earth's being in existence since its creation... might be a hinge."* But then he notes: *"The river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself."* (§97).

  Crucially, he adds: *"And there is not a sharp division of the one from the other."* (§98).

  This is the resource your seminar is missing. Hinges are not eternal truths; they are the *hardest* parts of our web of belief at a given time. But they can shift. Why do they shift? Not because of a logical refutation (you can't logically refute a hinge from within the system), but because of **practical friction**.

  If a community hinges on "Witchcraft causes illness," they will act accordingly (rituals, exorcisms). If the patients continue to die at rates inconsistent with their expectations, or if they observe that quarantine works better than exorcism, a tension arises. As Wittgenstein notes in §108: *"But I did not get my picture of the world by satisfying myself of its correctness."* We get it by living. If the living fails, the picture cracks.

  The "Young Earth" hinge is not wrong because it violates the laws of logic. It is wrong because maintaining it requires an increasingly convoluted and friction-heavy series of *other* actions (denying carbon dating, denying light from distant stars, positing a deceptive deity). The "cost" of keeping that hinge in place becomes too high for the practice of navigating the world to sustain. The riverbed shifts not because of a argument, but because the water (empirical inquiry) erodes the bed.

  ### 3. The Oracle: Addressing the Relativism Charge Directly
  You asked me not to dodge the "witchcraft" question. Let's look at the passage where Wittgenstein discusses a community that consults an oracle instead of a physicist (§609, §611, §613).

  Wittgenstein writes: *"If we don't accept the oracle as a source of knowledge, does that mean we regard it as wrong? ... We might say that they are in a different system."* (§609).

  This looks like relativism. But read on. He imagines us trying to convince them. *"We should not be able to convince them. For they would have to give up their whole way of thinking."* (§611).

  However, Wittgenstein does not say the systems are *equal*. He says they are *different*. And later, he hints at how one might encroach on the other. In §613, he asks: *"What if they had a different physics? ... Would they be wrong?"*

  The answer lies in the *consequences* of the physics. If their physics prevents them from building a bridge that stands, or curing a disease we can cure, the "correctness" is settled by the **success of the practice**. Wittgenstein is not a realist about Truth with a capital T, but he is a realist about *consequences*.

  If the "witchcraft hinge" leads to a form of life that cannot sustain itself against the friction of the environment (e.g., everyone dies of an infection the ritual didn't stop), that hinge is practically refuted. It is not "irrational" in the abstract; it is *maladaptive* in the concrete.

  This is where I modify Moyal-Sharrock. She sometimes speaks as if hinges are hermetically sealed. But Wittgenstein's riverbed metaphor shows they are permeable. A "bad" hinge is one that creates too much turbulence in the river. It forces the agent to ignore too much sensory feedback. To hinge on "I can fly" is to hinge on something that will be violently corrected by gravity. To hinge on "The earth is 6,000 years old" is to hinge on something that requires ignoring the "gravity" of geological evidence.

  ### 4. Why This Resolves the Seminar Dispute
  Your students are fighting because they want hinges to do **epistemic work** (stop the skeptic) without paying the **normative price** (avoiding relativism).

  *   **Pritchard** stops the skeptic by making hinges arational, but pays the price of making them immune to critique (Relativism).
  *   **Wright** saves normativity by inventing "entitlements," but pays the price of intellectualizing what Wittgenstein says is pre-reflective (Psychological implausibility).
  *   **Coliva** makes them constitutive, but struggles to explain why some constitutive rules are better than others.

  The **Pragmatic Enactivist** view I'm proposing says: Hinges are not there to stop the skeptic. They are there to let us act. The skeptic is not refuted by a better argument; the skeptic is ignored because they are not playing the game (§115: *"I want to say: propositions of the form of empirical propositions, and not only truths of logic, form the foundation of all operating with thoughts (with language)."*).

  Does this allow us to say the Young Earther is wrong? Yes. Not because they violated a rule of Reason, but because their hinge commitment forces them into a pattern of action that is increasingly disconnected from the shared causal environment we all inhabit. We can say they are wrong in the same way we say a map is wrong: not because it violates the laws of cartography, but because if you follow it, you walk off a cliff.

  ### 5. Pedagogical Suggestion
  For the next session, I suggest you stop asking "What kind of mental state is a hinge?" That question leads straight back to Cartesianism (the inner theater).

  Instead, ask: **"What happens if you try to doubt it?"**

  Use the door metaphor. Ask a student to genuinely doubt, in action, that the floor will hold them while they walk across the room. They can't. They can *say* they doubt it, but their feet won't move. That hesitation is the hinge.

  Then, on relativism: Ask if they could hinge on "Fire does not burn." If a student says "Yes, in a different framework," ask them to put their hand in the fire to prove it. The pain is not a "belief." It is the friction of the world pushing back against the hinge.

  Wittgenstein's point in *On Certainty* is that the world is not a hypothesis. It is the stage on which hypotheses are tested. Some things must remain off-stage for the play to go on. But if the stage collapses, the play ends. That is the only "refutation" of a bad hinge we need, and the only one Wittgenstein offers.

  **In sum:** Take the enactivist line. Hinges are ways of acting. But insist that actions have consequences, and those consequences provide the normative friction that prevents relativism from becoming "anything goes." The riverbed shifts, but it doesn't vanish.

  Hope this helps clear the grading pile, or at least makes the seminar feel less like a stalemate.

  Best,

  [Your Name/AI Assistant]
