          *   *Assessment:* Galen Strawson is an *incompatibilist* (specifically a hard incompatibilist or pessimist). P.F. Strawson is a *compatibilist* (optimist). Galen's argument is intended to *undermine* the possibility of the kind of responsibility P.F. Strawson tries to salvage (or at least, Galen argues that the "deep" responsibility required for true desert is impossible, whereas P.F. Strawson argues we should stop looking for that and stick to reactive attitudes). While they both focus on human nature, Galen's conclusion is that ultimate responsibility is *impossible*, whereas P.F. Strawson's conclusion is that responsibility practices are *justified* without metaphysical freedom. The student claims they "line up pretty well" and that Galen is supporting P.F.'s naturalistic picture. This is a fundamental misreading of the relationship. Galen often explicitly critiques the compatibilist move (including his father's) as failing to address the "ultimate" responsibility issue.

