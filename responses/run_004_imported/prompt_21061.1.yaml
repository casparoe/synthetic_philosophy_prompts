          *   Let's be generous on the P.F. Strawson part because there is a nuanced reading where Galen accepts P.F.'s descriptive psychology but denies the justification. But the student says Galen argues for "hard determinism" (wrong, he argues for impossibility regardless of determinism) and that P.F. is a compatibilist (right) but that Galen supports him (wrong).
          *   Okay, 12/20 seems fair. It acknowledges the good reconstruction but penalizes heavily for the conceptual errors on the specific follow-up questions which test deeper understanding.

