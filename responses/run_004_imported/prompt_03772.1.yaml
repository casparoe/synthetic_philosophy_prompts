      *   **The Dean's Point (The "Infinite Omissions" Problem):** Explain *why* he sounds smart. He's using a logical truth: infinite things didn't happen that could have saved the day. This is the "but-for" test run wild.
      *   **The Counter-Argument (Why the Dean is Practically Wrong):**
