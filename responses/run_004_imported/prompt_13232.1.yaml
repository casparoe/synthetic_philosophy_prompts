prompt: |-
  So this happened at work last month and it's still kind of bugging me, curious what you'd make of it. I'm on a small backend team and we've got this old job-queue service that everyone's kind of scared to touch. Whenever I'm on call I've got this personal habit of manually running a drain script around midnight if the backlog looks like its climbing - it's not in the runbook, nobody ever asked me to do it, I just started doing it about a year ago because it made my mornings easier. One night I was dealing with a family thing and just didn't get to it, same as maybe one night a month when I'm slammed or just forget, and normally nothing bad happens on those nights. This particular night the backlog spiraled and we had a three hour outage for a decent chunk of customers. In the postmortem doc it got written up as a "contributing factor" that I "did not perform the routine mitigation," and a couple people on the review call said some version of "well if you'd done the drain like you normally do, this wouldn't have happened."

  Something about that framing feels off to me but I can't quite nail down why. I didn't DO anything wrong, I just didn't do an optional thing I sometimes do for my own convenience. And if not-doing-the-drain counts as a cause of the outage, it seems like a ton of other people should count as causes too - nobody ever filed the alert on queue depth even though its been brought up in like three retros, the underlying memory leak has been sitting in the backlog with a low priority tag for over a year, and my manager never got budget approved for a second on-call rotation on that service. None of those people show up in the postmortem though. So either not-doing-things can be causes, in which case basically everyone who didn't do something useful that month is on the hook and it feels arbitrary to single me out, or not-doing-things can't really be causes, in which case the postmortem is just wrong to pin any of this on me specifically. My team leads response was basically "come on, common sense says you're at least partly on the hook here," which might be true but doesn't actually explain why. Is there a real principled way to work out whether I've got a legitimate gripe here, or is this just one of those things where you accept some fuzziness and move on?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Small backend team, legacy job-queue service (scary to touch).
      *   **Action:** User manually runs a "drain script" around midnight if backlog climbs. This is *not* in the runbook, *not* required, done voluntarily for personal convenience (easier mornings).
      *   **Incident:** One night user didn't run it (family thing/forget). Backlog spiraled, 3-hour outage.
      *   **Postmortem:** Labeled "contributing factor" that user "did not perform the routine mitigation." Colleagues said "if you'd done the drain... this wouldn't have happened."
      *   **User's Grievance:** Feels unfair. It was optional. If omission is a cause, why aren't other omissions (no alert, unfixed leak, no budget for rotation) also causes? Feels like singling out.
      *   **Manager's Response:** "Common sense says you're at least partly on the hook."
      *   **Question:** Is there a principled way to evaluate this, or is it just fuzziness to accept?

  2.  **Deconstruct the Core Conflict:**
      *   **Normative Expectation vs. Formal Requirement:** The user sees the action as *optional* (not in runbook). The team sees it as *expected* (routine mitigation). This is a classic "shadow process" or "tribal knowledge" vs. "documented procedure" clash.
      *   **Causality in Postmortems:** The user is applying a counterfactual test ("If I hadn't done it before, would it have happened?"). The team is applying a dependency test ("The system relied on this action to stay stable").
      *   **Fairness/Blame:** The user feels singled out compared to other systemic failures (tech debt, alerting, resourcing). This touches on "Just Culture" principles.

  3.  **Evaluate the "Principled" Arguments:**

      *   *Argument for the User (It's not your fault):*
          *   **Formalization:** If it's not in the runbook, it's not a duty. Relying on heroics is an anti-pattern.
          *   **Systemic Issues:** The root cause is the fragile service/memory leak, not the lack of manual patching.
          *   **Bus Factor:** Relying on one person's habit is a single point of failure.
          *   **Precedent:** Punishing omission of an unofficial task discourages voluntary extra effort.

      *   *Argument for the Team/Manager (It is partly your fault):*
          *   **Reliability:** The system *depended* on this action. Whether documented or not, it was a control mechanism.
          *   **Handoff:** If you start a pattern, you create an expectation. Breaking it without notification is risky.
          *   **Ownership:** As the person who introduced the habit, you own the risk of it stopping.

  4.  **Identify the Underlying Principles (The "Principled Way"):**
      *   **Just Culture:** Distinguish between human error, at-risk behavior, and reckless behavior. This feels like "at-risk" (cutting corners/creating shadow processes) but mostly systemic.
      *   **Normalization of Deviance:** The manual script became the *de facto* standard without being the *de jure* standard.
      *   **Counterfactual Reasoning in Postmortems:** A good postmortem asks "What allowed this to happen?" not "Who messed up?"
      *   **The "Garden Path" Problem:** If you make the system rely on you, you become a single point of failure.

  5.  **Drafting the Response:**

      *   **Validation:** Acknowledge the frustration. It *is* a tricky situation. The feeling of unfairness is valid.
      *   **The Core Tension:** Define the clash between "Official Duty" vs. "Emergent Norm."
      *   **Principled Analysis (The "Why it feels off"):**
          1.  **The Shadow Process Trap:** You created a dependency without formalizing it. That's the key technical debt.
          2.  **Causality vs. Blame:** The postmortem conflated "cause" with "fault." The *absence* of the script was a cause, but *you* aren't necessarily to blame for the absence.
          3.  **Systemic vs. Individual:** The user is right that other factors (memory leak, alerts) are bigger causes. Singling out the human element is often a bias (Fundamental Attribution Error).
      *   **The Manager's "Common Sense":** Explain why they say that (reliability expectation) but why it's insufficient for a postmortem.
      *   **Actionable Advice/Resolution:**
          *   Don't fight the "cause" label, fight the "fault" implication.
          *   Formalize or kill the script.
          *   Shift focus to the root causes (leak, alerting).
      *   **Conclusion:** It's not just fuzziness. There are specific organizational dynamics at play.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but objective.
      *   Avoid taking sides completely, but validate the user's logical consistency.
      *   Use industry-standard terms (SRE, Just Culture, Toil, Shadow IT).

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, did the user create an expectation?* Yes, by doing it for a year.
      *   *Is the manager wrong?* Not entirely, but "on the hook" implies blame, which is dangerous in a postmortem.
      *   *Is the user wrong?* They created a single point of failure (themselves).
      *   *Key Insight:* The postmortem isn't wrong that the *action's absence* was a cause. It's wrong to frame it as the *person's failure* rather than the *process's failure*.

  8.  **Final Polish:** Structure into clear sections: Validation, The Principled Breakdown (3 points), The Manager's Perspective, and How to Move Forward. (This matches the thought process in step 5).

  **(Self-Correction during drafting):** I need to make sure I don't gaslight the user. They are right that it's unfair to blame them for not doing an unofficial task. But I also need to point out that relying on unofficial tasks is risky. The balance is: "The system failed because it relied on a human habit, not because you took a night off."

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  You have a very legitimate gripe, and there is actually a principled way to analyze this. This isn't just "fuzziness" to accept; it's a classic conflict in reliability engineering between **formal process** and **emergent norms**, complicated by **Just Culture** principles.

  Here is the breakdown of why your intuition is correct, why your team's reaction is understandable but flawed, and how to frame this moving forward.

  ### 1. The Core Principle: "Shadow Process" vs. Documented Duty
  Your grievance rests on the distinction between *optional* and *required*.
  *   **Your view:** The script was a personal optimization (toil reduction). Since it wasn't in the runbook, it wasn't a duty. Therefore, omitting a non-duty cannot be negligence.
  *   **The Team's view:** The script was a *control mechanism*. Regardless of documentation, the system had become dependent on it to remain stable. Therefore, omitting it removed a safety control.

  **The Verdict:** You are right about the *duty*, but the team is right about the *dependency*.
  By performing this action consistently for a year, you inadvertently turned a "nice-to-have" into a "need-to-have" without updating the system architecture or documentation to reflect that. In SRE terms, you created a **single point of failure (SPOF)** centered on your own habits.

  However, in a blameless postmortem, the conclusion shouldn't be "User failed to run script." It should be "The system relied on an undocumented manual intervention to function." Those are very different things. The former blames the human; the latter blames the process design.

  ### 2. Causality vs. Blame (The Postmortem Error)
  The postmortem states your inaction was a "contributing factor." Technically, in a counterfactual sense, they are correct: *If the script had run, the outage likely wouldn't have happened.*

  But this is where the logic gets muddy. In a robust **Just Culture**, we distinguish between:
  1.  **Human Error:** (I meant to do it, I forgot.)
  2.  **At-Risk Behavior:** (I chose to skip a safety step to save time.)
  3.  **Reckless Behavior:** (I knowingly ignored a critical rule.)

  You fall into category 1, but the team is treating it like category 2.
  The reason your gripe is principled is that **reliability should not depend on heroics.** If the system requires a human to manually drain a queue at midnight to avoid an outage, the system is broken. By pinning the "cause" on your omission, the postmortem validates the broken system rather than flagging it.

  You are also correct about the **asymmetry of omission**. If we accept "not doing optional things" as a cause, then:
  *   The engineer who didn't fix the memory leak is a cause.
  *   The manager who didn't get budget is a cause.
  *   The team who didn't set up alerts is a cause.

  Singling out *your* omission is indeed arbitrary unless there is a specific reason why your omission is weighted heavier than the others. The only reason it is weighted heavier is **recency and proximity**. Your action (or lack thereof) was the immediate trigger; the memory leak is a latent condition. In accident analysis (like the Swiss Cheese Model), latent conditions are usually considered *more* important to fix than the immediate trigger, yet they are often ignored in favor of blaming the trigger.

  ### 3. The "Common Sense" Trap
  Your manager's comment ("common sense says you're at least partly on the hook") is the most frustrating part, but it reveals the organizational dynamic.
  *   **Manager's Logic:** Reliability is a team sport. If you start a pattern that stabilizes the system, you have implicitly taken ownership of that stability. Breaking the pattern without a handoff is a breach of implicit trust.
  *   **The Flaw:** This relies on **tribal knowledge**. It punishes you for being *too* proactive. If you hadn't run the script for the last year, the outage would have happened months ago, the memory leak would have been fixed, and alerts would be in place. In a perverse way, your diligence masked the severity of the technical debt, allowing it to fester until the one night you weren't there.

  ### 4. How to Resolve This (Principled Next Steps)
  You don't need to accept the fuzziness. You can use this to push for a better engineering culture. Here is how to reframe the conversation:

  **A. Accept the "Cause," Reject the "Fault"**
  You can agree that the *absence of the mitigation* was a cause, without accepting that *you* are to blame for that absence.
  *   *Say:* "I agree the system relied on that script. That's exactly why it's dangerous that it wasn't in the runbook. The postmortem should reflect that we have an undocumented dependency on a specific individual's habits, not that I failed a duty."

  **B. Formalize or Kill the Script**
  You have two options, and both are better than the status quo:
  1.  **Automate it:** If the script is necessary for stability, it should be a cron job or an auto-scaling trigger, not a manual task.
  2.  **Kill it:** If it's not necessary enough to automate, the system should be robust enough to survive without it.
  *   *Say:* "To ensure this doesn't happen again, I propose we either automate this drain process or increase the queue capacity so manual intervention isn't needed. We shouldn't rely on me being awake at midnight."

  **C. Highlight the Latent Conditions**
  Push back gently on the weighting of causes.
  *   *Say:* "I'm concerned that focusing on the manual drain distracts from the root causes. The memory leak and the lack of alerting are the reasons the backlog spiraled in the first place. The drain script was just a band-aid. I'd like to see action items prioritized on the leak and alerting over 'reminding me to run scripts.'"

  ### Summary
  You aren't crazy. This is a textbook example of **normalization of deviance**. Your team has normalized a deviant process (manual, undocumented intervention) and is now blaming you when the normalization failed.

  **Your principled stance:**
  1.  **Omission of an unofficial task is not negligence.**
  2.  **Systemic reliance on individual habits is a design flaw, not an operator error.**
  3.  **Latent conditions (tech debt) are more significant causes than immediate triggers (missed script).**

  You don't need to fight the postmortem doc tooth and nail, but you should ensure the **Action Items** reflect the systemic failure (automate the drain, fix the leak, add alerts) rather than a behavioral correction for you ("Ensure script is run"). If the action item is "User will run script," push back. If the action item is "Team will automate script," you've won.
