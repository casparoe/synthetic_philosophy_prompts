prompt: |-
  okay this is gonna sound niche but my seminar on blame and moral responsibility just spent two weeks on hypocrisy and standing to blame and I need to get my head straight before we discuss it Friday. Cohen's original tu quoque puzzle is basically: the truth of an accusation doesn't depend on who's making it, so why does it seem off specifically for a hypocrite to make it? Everyone we read seems to answer it differently:

  - Wallace: hypocritical blame breaches a norm of equal standing among members of the moral community, regardless of whether the accusation is true
  - Scanlon: blame expresses the blamer's relationship to the violated norm, and hypocrisy misrepresents that relationship
  - Fritz & Miller: it's not the hypocrisy itself doing the work, its the implicit false claim to be exempt from the norm
  - Todd: hypocrisy, complicity, and "none of your business" standing failures all reduce to one underlying presupposition failure
  - Bell: standing-talk is mostly overblown, hypocrites' blame is just as apt, we're annoyed at them for other reasons

  Can you rank these 5 from best to worst as actual solutions to Cohen's puzzle (i.e. dissolving the tension, not just dodging it)? Give it to me as JSON, like:

  ```json
  [
    {"rank": 1, "view": "...", "why": "..."},
    ...
  ]
  ```

  one sentence max per "why".
