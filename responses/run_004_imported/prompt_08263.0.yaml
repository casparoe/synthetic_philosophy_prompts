      *   *Contextualism:* This is important. The standards for "knowing" might shift depending on the context (a lab meeting vs. a newspaper headline).
      *   *The "Revisability" Point:* Just because a claim *could* be revised doesn't mean it *will* be. We know the water is boiling if it's at 100C at sea level. We don't say "It appears to be boiling." We say "It is boiling."
      *   *Journalism's specific sin:* It's not asserting known things as facts. It's asserting *preliminary* things as facts. That's the real issue.

