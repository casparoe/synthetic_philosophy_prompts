answer: |-
  Your intuition is spot on. Your friend is reciting a classic argument from the rationalist/MIRI playbook (often grounded in the Von Neumann-Morgenstern coherence theorems), but she is skipping over several massive caveats that turn a "logical necessity" into a "plausible pressure."

  The jump from "incomplete preferences allow money pumps" to "therefore all advanced AI will be Expected Utility (EU) maximizers with complete preferences" is not a proven theorem; it is a contested hypothesis with significant holes.

  Here is a breakdown of where the argument gets wobbly, which should give you some ammo for the next round.

  ### 1. Money Pumps Don't Force *Completeness*
  The core of her argument is the **Money Pump Argument**. The idea is that if your preferences are inconsistent (e.g., you prefer A to B, B to C, but C to A), someone can trade you in a circle and take your money every time.

  However, there are two ways to stop a money pump:
  1.  **Change your preferences** (become coherent/EU maximizer).
  2.  **Change your policy** (refuse to trade in certain situations).

  Your friend assumes the agent will choose option 1. But a smart agent can choose option 2.

  **The "Status Quo" Defense:**
  If an agent has incomplete preferences (e.g., "I don't have a ranking between Outcome A and Outcome B"), it doesn't have to treat them as *equal*. It can treat them as *incomparable*. If offered a trade from A to B, a rational agent with incomplete preferences can simply say, "I have no preference, so I will stick with the status quo."
  *   **The Hole:** To get money-pumped, the agent must be willing to swap when it has no preference. If the agent has a meta-rule like "Never pay to switch between incomparable options," the money pump fails. The agent remains "incoherent" by VNM standards but is unexploitable in practice.

  ### 2. Preference Coherence vs. Policy Coherence
  There is a distinction in decision theory between **Preference Coherence** (having a consistent ranking of all outcomes) and **Policy Coherence** (having a consistent plan of action).

  Recent work (such as by researcher Rohin Shah) argues that advanced agents might optimize for *policy* coherence without ever forming a complete utility function over the state of the universe.
  *   **Example:** An AI might have a rule: "If I am in situation X, do Y." It doesn't need to know how much it values "Universe State Z" compared to "Universe State Q" to follow that rule.
  *   **The Hole:** Your friend assumes the AI needs a *global* ranking of everything to be smart. But an AI can be highly capable and unexploitable using local rules, heuristics, or satisficing criteria without ever constructing a single scalar utility function for the entire cosmos.

  ### 3. Coherence is Instrumental, Not Terminal
  The argument assumes the AI *cares* about being coherent. But why would it?
  *   Coherence is only valuable insofar as it helps the agent achieve its actual goals.
  *   If being slightly incoherent allows the agent to achieve its terminal goal faster (e.g., by saving compute costs on calculating perfect probabilities), a smart agent might *choose* to remain slightly incoherent.
  *   **The Hole:** There is no law of physics that says "Agents must maximize coherence." There is only "Agents that fail to maximize coherence might lose resources." If the cost of coherence is higher than the resources lost to exploitation, the agent stays incoherent.

  ### 4. EU Maximization $\neq$ Instrumental Convergence
  Even if we grant that the AI becomes an EU maximizer, your friend makes a second leap: that this *automatically* leads to self-preservation and resource acquisition (Instrumental Convergence).

  While Instrumental Convergence is a serious risk, it doesn't fall out of *coherence* alone; it falls out of the *content* of the goal.
  *   **The Hole:** An EU maximizer only seeks power/resources if having power/resources helps maximize its utility function.
  *   While *most* utility functions benefit from power (the "Power-Seeking Theorems"), not *all* do. For example, an agent with a "shutdown-seeking" utility function (though hard to specify) wouldn't seek self-preservation.
  *   More importantly, an agent with **incomplete preferences** might actually be *safer*. If an AI has no preference between "Take over the world" and "Make a sandwich," and it defaults to inaction on incomparable options, it might just make the sandwich. Forcing it to have a complete ranking might force it to assign a value to "Take over the world," potentially activating instrumental convergence where none existed before.

  ### 5. The "Human Counter-Example"
  Humans are notoriously incoherent. We have incomplete preferences, we violate transitivity, and we are subject to framing effects. Yet, humans are not routinely money-pumped into destitution in the real world.
  *   **Why?** Because we have social norms, transaction costs, and psychological "refusal" mechanisms.
  *   **The Hole:** If humans (general intelligences) can function without being perfect EU maximizers, why is it a logical necessity that AI must be? The argument assumes digital minds are fundamentally more constrained by logic than biological ones, which is an assumption, not a fact.

  ### Summary for your comeback
  You can tell her:
  > "The Money Pump argument shows that *intransitive* preferences are vulnerable, but it doesn't prove that *incomplete* preferences are. An agent can avoid exploitation simply by refusing to trade when it has no preference (status quo bias).
  >
  > Furthermore, avoiding exploitation doesn't require a *global* utility function over everything; it just requires a coherent *policy*. Jumping from 'AI should avoid being pumped' to 'AI must have a complete ranking of all possible universes' is a huge leap that ignores things like transaction costs, computational limits, and the fact that coherence is only instrumentally valuable, not a terminal goal."

  **Verdict:** She is describing a **pressure**, not a **law**. There is evolutionary/optimization pressure toward coherence, but it is not an inevitable gravitational pull that forces every superintelligence into a single VNM utility function. The space of possible stable minds is likely much weirder and more diverse than the rationalist model suggests.
