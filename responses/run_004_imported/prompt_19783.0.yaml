      *   *The "Certainty Effect":* People overweight outcomes that are considered certain relative to outcomes that are merely probable.
      *   *Normative vs. Descriptive:* Descriptively, humans do this. Normatively, should they? Savage argued Independence is rational. Others (Kahneman, Tversky, Buchak) argue it captures something important about risk.

  3.  **Analyze the Specific Decision (Annuity vs. Lump Sum):**
      *   *Option 1 (Annuity):* Guaranteed income for life. (Analogue to the "Certain $1M").
