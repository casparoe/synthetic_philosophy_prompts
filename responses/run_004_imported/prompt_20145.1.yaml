prompt: |-
  Ok so I've been down a total rabbit hole lately teaching myself metaethics (zero academic background here, I just watch philosophy videos and then somehow end up reading Stanford Encyclopedia articles at 2am). It started because a friend and I were arguing about whether "good" means anything beyond personal taste, and that's how I stumbled on these "fitting attitude" or "buck-passing" theories of value, where saying "X is good" basically just means "there's reason to have some pro-attitude toward X," like desiring it or admiring it. Then I ran into this whole "wrong kind of reasons" problem that's apparently a huge deal for that view. The go-to example is the demon one: a demon threatens to torture you unless you start desiring some worthless thing, I think its literally a saucer of mud in the original paper, so technically you now have a reason to desire the mud, but that obviously doesn't make the mud good, its just a reason to have the attitude that has nothing to do with the mud itself. People call that the "wrong kind" of reason, as opposed to the "right kind" that actually tracks the object being good.

  Here's my problem though: I think I've basically just memorized that one mud case without really getting whether the underlying issue generalizes. So could you invent a totally different example of this same wrong-kind-of-reasons structure, no demons or threats, and ideally with some attitude other than desire, like admiration, contempt, or gratitude? And then walk through why it actually counts as a wrong-kind case, and test it against the usual fix people propose, that right-kind reasons come from features of the object itself while wrong-kind ones come from perks or penalties of just holding the attitude, regardless of whether its warranted. I'm curious whether that line stays clean for your example or gets blurry, kind of like how I've read it does when people try to apply the same right-kind/wrong-kind distinction to reasons for belief instead of reasons for pro-attitudes.
