      *   *Step 4: Neurath vs. Mises.* Carnap supported Neurath personally but would likely critique the *logical structure* of Neurath's "calculation in kind." He'd want to know the verification conditions for "economic value" without prices.
      *   *Step 5: The "Lab Coat" Suspicion.* Would he suspect values sneaking in? Yes. Specifically, the assumption that "optimization" is neutral. Carnap knew that choosing the *objective function* is a volitional act, not a scientific one.

  5.  **Drafting the Response (Iterative Process):**

