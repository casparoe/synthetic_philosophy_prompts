answer: |-
  This is a sophisticated and promising line of critique for a dissertation chapter. You have identified a genuine tension in the post-Smith landscape: in the rush to avoid the "moral fetishism" charge (valuing *rightness* over *people*), accounts like Markovits's risk swinging too far toward externalism, thereby losing the internal connection between moral worth and moral agency.

  Below is an argument structured to support your central move. It steel-mans Markovits and Sliwa to ensure their strongest formulations are addressed, then argues that their conditions remain insufficient to rule out the "reliable non-moral agent," whereas Arpaly's account of substantive responsiveness succeeds where they fail.

  ---

  ### 1. The Indistinguishability Problem for the Coincident Reasons Thesis

  To steel-man Julia Markovits (2010), we must acknowledge that her Coincident Reasons Thesis (CRT) is designed specifically to avoid the alienation charge. She argues that moral worth does not require a *de dicto* desire to do the right thing (which Smith attacks as fetishistic), but rather that the agent's *motivating reasons* must coincide with the *normative reasons* that justify the action. If I help you because you are in pain, and your pain is what makes helping right, my reasons coincide with the justifying reasons. This preserves the intuition that we should care about people, not just morality.

  However, your worry identifies a critical blind spot in this formal alignment: **CRT is insensitive to the *genealogy* of the motivation.**

  Consider the case of the **"Wired Humanitarian."** Imagine an agent, Alice, who has been neurologically conditioned (or is naturally "wired") such that whenever she perceives suffering, she experiences a compulsive urge to alleviate it. She does not value the suffering's alleviation as a moral good; she does not even conceptualize it as "morality." She simply experiences a psychological itch that is scratched only by helping.
  *   **Normative Reason:** The victim's suffering.
  *   **Motivating Reason:** The victim's suffering (which triggers the compulsion).
  *   **CRT Verdict:** The reasons coincide. Alice acts for the right reason. Therefore, Alice's action has moral worth.

  **Why this is decisive:**
  Intuitively, Alice lacks moral worth because her action does not issue from a **moral regard** for the victim. She is functionally indistinguishable from a sophisticated thermostat that regulates temperature to prevent discomfort. Her reliability is a matter of causal necessity or psychological quirk, not moral agency.

  Markovits might respond that if Alice is aware of the suffering and acts *because* of it, she satisfies the condition. But this conflates *causal triggers* with *reasons*. For a reason to be a *motivating reason* in the sense required for moral worth, it must be taken up by the agent's evaluative perspective. CRT treats reasons as content-bearing states that can match externally, but it fails to require that the agent *endorses* that content *as a claim on them*. By allowing a non-moral disposition (the wiring) to do the heavy lifting, CRT severs the link between moral worth and the **good will**. It reduces moral worth to a form of reliable output, which is insufficient for praise. If CRT cannot distinguish the virtuous agent from the Wired Humanitarian, it fails to capture the distinctively *moral* value of the action.

  ### 2. Why Sliwa's Knowledge-Based Amendment Fails

  Paulina Sliwa (2016) anticipates the "accidental alignment" objection. She amends the externalist picture by adding an epistemic condition: an action has moral worth only if the agent acts **from moral knowledge** (or at least moral belief) regarding the right-making features. She argues that the lucky or wired agent lacks the requisite grasp of *why* the action is right.

  **The Steel-Man:**
  Sliwa's move is powerful because it internalizes the alignment. It requires that the agent's cognitive state represents the moral reality. In the case of the Wired Humanitarian, if Alice acts on blind compulsion without believing "I ought to help," Sliwa correctly denies her moral worth. Sliwa insists that moral worth requires acting *from* the recognition of moral reasons, not just in accordance with them.

  **The Residual Problem:**
  However, Sliwa's amendment substitutes an **intellectualist** condition for a **conative** one. It solves the problem of ignorance, but not the problem of **moral coldness**.

  Consider a second counter-example: **The Cold Moralist.** This agent, Bob, possesses perfect moral knowledge. He knows that suffering is bad and that he ought to alleviate it. He acts on this knowledge reliably. However, Bob feels no concern for the suffering itself. He acts solely because he values "rational consistency" or "obedience to moral law" in a detached, bureaucratic sense. He treats moral facts like mathematical truths—binding, but devoid of emotional resonance.
  *   **Sliwa's Verdict:** Bob acts from moral knowledge. He satisfies the epistemic condition. He is not "wired" in the non-cognitive sense; he is motivated by his grasp of the moral fact.
  *   **The Intuition:** Bob looks suspiciously like Smith's "moral fetishist." He cares about the *status* of the action (as right/known) rather than the *substance* (the suffering).

  More damagingly, consider a hybrid: **The Wired Knower.** Imagine Alice (the wired agent) *also* has moral knowledge. She knows helping is right. Her wiring ensures she acts on this knowledge without hesitation. But her *concern* is still non-moral; the knowledge is merely a label she applies to her compulsion. Sliwa requires acting *from* knowledge. But if the causal power lies in the non-moral wiring, and the knowledge is merely a concurrent shadow, does she act *from* it? Sliwa would say no. But this makes the account vulnerable to skepticism about causal overdetermination.

  The deeper issue is that **knowledge does not entail concern.** One can know a fact without caring about its import. Moral worth, however, seems to require not just knowing the good, but **caring about the good.** Sliwa's epistemic focus captures the *head* but misses the *heart*. It rules out the ignorant do-gooder, but it fails to rule out the cold calculator or the agent whose knowledge is inert without the prop of a non-moral disposition. It does not secure the distinction between an agent who responds to moral reasons *as moral claims* versus an agent who responds to them as data points.

  ### 3. The Arpaly Alternative: Substantive Responsiveness

  This is where Nomy Arpaly's (2003) account of **substantive responsiveness** offers the necessary resolution. Arpaly rejects Smith's demand for *de dicto* beliefs (avoiding fetishism) but also rejects the purely externalist alignment of CRT (avoiding the Wired Humanitarian).

  **The Core Distinction:**
  For Arpaly, moral worth consists in responsiveness to right-making features *as such*. Crucially, this responsiveness is not merely causal (like the wiring) nor merely epistemic (like Sliwa's knowledge). It is a **dispositional state of the agent's character.** To be responsive to a moral reason is to have one's emotions, perceptions, and motivations tuned to the moral significance of the situation.

  **How Arpaly Solves the Indistinguishability:**
  1.  **Vs. The Wired Humanitarian:** Alice (the wired agent) is not *responsively* connected to the moral feature. She is causally triggered by it. Arpaly distinguishes between a reflex and a responsiveness. A reflex is rigid and insulated from the agent's broader evaluative perspective. Responsiveness implies that if the moral feature changed (e.g., helping would cause more harm), the agent's motivation would update accordingly because they care about the *value*, not just the trigger. The Wired Humanitarian lacks this counterfactual sensitivity rooted in valuation.
  2.  **Vs. The Cold Moralist:** Bob (the cold knower) fails Arpaly's test because responsiveness to moral reasons *involves* a conative element. To be responsive to "suffering is bad" is to be pained by suffering or motivated by a desire to alleviate it. If Bob is truly cold, he is not responsive to the *moral* feature; he is responsive to the *rational* feature of consistency. Arpaly allows that one can be responsive to moral reasons without using the word "moral" (avoiding fetishism), but one cannot be responsive to them without **caring** about the features that make them moral.

  **Why this supports your chapter:**
  Arpaly provides the conceptual machinery to mark the distinction you feel is missing. She shows that we can demand **moral concern** (ruling out the wired/non-moral agent) without demanding **meta-ethical belief** (ruling out Smith's fetishism).
  *   Markovits fails because she makes moral worth too **externalist** (alignment of content).
  *   Sliwa fails because she makes moral worth too **intellectualist** (possession of knowledge).
  *   Arpaly succeeds because she makes moral worth **constitutive** of the agent's character (responsiveness of the whole person).

  ### Conclusion for the Chapter

  Your stress-test reveals that the debate has stalled between externalist alignment (Markovits) and internalist epistemology (Sliwa), both of which struggle to capture the **conative depth** of virtue. The "Wired Humanitarian" objection is decisive against CRT because it shows that reason-coincidence is compatible with the absence of moral agency. Sliwa's amendment, while progress, remains vulnerable to the "Cold Moralist" because knowledge does not guarantee care.

  By pivoting to Arpaly, your chapter can argue that the solution to the fetishism debate is not to lower the bar for moral worth (to mere coincidence) nor to raise it to meta-ethical reflection (to fetishism), but to deepen our understanding of **responsiveness**. Moral worth requires that the right-making features move the agent *because they matter*, not just because they are known or causally potent. This validates your central move: only an account that builds substantive responsiveness into the analysis of moral worth can distinguish the virtuous from the merely reliable.
