answer: |-
  The airlock cycled with a heavy, hydraulic sigh, equalizing the pressure between the sealed arcology and the wasteland beyond. Kael stood on the threshold, the wind from the outside tugging at his coat. The light above the door shifted from angry red to a permissive, glowing green.

  He was out.

  The gene-edit Sura had administered was holding. The scanners hadn't even twitched when he walked through. His blood was clean, his ID masked, and the corporate hit-squad behind him was blind. He was alive, free, and standing in the dust of the dead zone with fifty thousand credits burning a hole in his pocket.

  And in his hand, he held the data chip containing Sura's fee.

  He looked back through the thick glass of the airlock window. Sura was still inside, standing by the control console. She wasn't watching the monitors. She wasn't checking her weapons. She was looking directly at him, her arms crossed, waiting.

  She couldn't touch him out here. There were no enforcement drones in the wasteland, no contracts that held in the dead zone, and no way for her to track him once he vanished into the dust storms. By every metric of cold, hard logic, the transaction was complete. She had provided the service. He had received the benefit. The leverage had shifted entirely to him.

  If he dropped the chip and ran, he kept the fifty thousand. He could start a new life somewhere else, buy better gear, disappear forever.
  If he slid the chip into the external slot on the wall, he was fifty thousand credits poorer, with nothing to show for it but a clear conscience.

  Kael's thumb hovered over the slot. The wind howled, kicking sand against his shins.

  He remembered the conversation in the backroom clinic, just before the needle went in. He had asked for a contract, a collateral hold, something to assure her he wouldn't ghost.

  Sura had laughed, a dry, brittle sound. "Contracts are for people who need laws to keep their word. I don't deal in laws. I deal in types."

  She had leaned in then, her eyes scanning his face not for features, but for micro-tensions, pupil dilation, the subtle rhythm of his breath. "I can tell, Kael. I can tell if you're the kind of man who pays when the gun is off the table. If I think you're going to run, I let you die in there. Simple as that. I don't make mistakes."

  She had edited him because she was certain he would pay.

  Kael looked at the chip in his hand. It was plastic and silicon, worth a fortune to him, nothing to her. But it wasn't about the money. It was about the causal loop.

  If he kept the money, he proved himself to be the type of person who defects when unobserved. But if he were that type of person, Sura would have known. And if she had known, she wouldn't have saved him. So, if he kept the money, he was proving that Sura was wrong. And if Sura was wrong, then his survival was a mistake, a glitch in the logic of the world.

  But if he paid...

  If he paid, he validated her prediction. He confirmed that he was the kind of person who keeps a promise even when it hurts. He confirmed that she was right to save him. He aligned his present action with the past decision that allowed him to stand there at all.

  To keep the money was to claim a freedom he hadn't earned. To pay was to accept the cost of the person he had to be to survive.

  The wind picked up, stinging his eyes. Inside the glass, Sura didn't blink. She didn't look worried. She looked bored. She knew what she had bought. She hadn't bought his service; she had bought his nature.

  Kael felt the weight of the credits in his pocket, the tangible security of them. It would be so easy to turn. Rational. Safe. Smart.

  He looked at Sura again. She was the mirror. If he walked away, the reflection showed a corpse who didn't know it was dead.

  Kael exhaled, a cloud of vapor snatched away by the wind. He stepped forward and slid the chip into the slot.

  The console beeped once, a sharp, affirmative sound. A small light on the wall flashed green, acknowledging the transfer.

  Sura didn't smile. She didn't nod. She simply turned away from the window and walked back into the depths of the arcology, her business finished.

  Kael stood alone in the wasteland, lighter by fifty thousand credits, heavier by the only thing that mattered. He turned his collar up against the wind and began to walk.
