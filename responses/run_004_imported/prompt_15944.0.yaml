prompt: |-
  Ok so for our department's small AI-and-ethics podcast (it's me and two other grad students, maybe 40 regular listeners, very glamorous) I'm interviewing a guest next week who's built a chunk of her career defending coherent extrapolated volition as the right target for an aligned superintelligence -- the Yudkowsky-style idea that instead of coding in humanity's actual present-day preferences, you have the system extrapolate what we'd want "if we knew more, thought faster, were more the people we wished we were, had grown up farther together" (or however exactly the original phrasing goes), with the extrapolation supposed to converge across humanity rather than diverge. When I described the interview to my advisor, the immediate reaction was "that's just Railton and Brandt's idealized-preference theory of the good wearing a trenchcoat," and now I can't unsee it -- CEV seems to inherit a bunch of unresolved problems from that older full-information-account literature (Sobel's worry about idealization losing its authority over the actual person, Rosati's stuff about alienation) that basically nobody in the alignment world engages with directly, they just reinvent the wheel with new vocabulary.

  I want the interview to actually make her sit with that lineage instead of letting her re-explain what CEV is for the tenth time (I've read the original writeup, and honestly so has most of our audience). Can you draft me 8-10 questions? I need at least one that presses the authority question head on -- why my extrapolated self's preferences get to bind actual-me just because that self is smarter/more coherent/more informed, given the standard worry that idealizing a person can talk them out of caring about whatever made the exercise worth doing in the first place. I need one on the "hidden complexity of wishes" issue -- that tiny changes to how you spec out the extrapolation (how much further "growing up," what info gets fed in and in what order) can swing the output wildly, so "coherent" might be doing more work in the name than the actual procedure earns. And I want at least one on aggregation: whose volition, and what happens when idealized-me and idealized-you just don't converge, since nothing about the extrapolation step actually guarantees the eventual agreement across people that the original pitch seems to assume. Shes got a habit in panel discussions of answering objections like these with some version of "that's exactly what the extrapolation process is there to handle" -- so for each question, give me a sharp follow-up ready for that dodge, and end the list with one question that asks her point blank what would have to be true for her to admit CEV-style idealization is just the wrong approach.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A small, academic-adjacent AI & ethics podcast (host + 2 grad students, ~40 listeners).
      *   **Guest:** An AI alignment researcher who advocates for Coherent Extrapolated Volition (CEV) as the target for aligned superintelligence.
      *   **Host's Insight:** The host's advisor pointed out that CEV is essentially Peter Railton's and Richard Brandt's "idealized preference" theory of the good (full-information accounts) repackaged.
      *   **Problem:** The alignment community often ignores the decades of meta-ethical literature critiquing idealized preference theories (Sobel, Rosati, etc.). The guest tends to deflect criticisms by saying "the extrapolation process handles that."
      *   **Goal:** 8-10 interview questions that force the guest to engage with the philosophical lineage, specifically addressing:
          1.  **Authority:** Why does the idealized self bind the actual self? (Sobel/Rosati alienation worry).
          2.  **Sensitivity/Complexity:** How sensitive is the output to the specific parameters of extrapolation? (Hidden complexity of wishes).
          3.  **Aggregation:** What if idealized selves don't converge?
          4.  **Deflection Prevention:** Each question needs a sharp follow-up for the "extrapolation handles that" dodge.
          5.  **Falsifiability:** A final question asking what would make her abandon the approach.

  2.  **Deconstruct the Philosophical Lineage (Mental Sandbox):**
      *   *CEV (Yudkowsky):* "What we would want if we knew more, thought faster, were more the people we wished we were, had grown up farther together." Goal: Convergence.
      *   *Idealized Preference (Railton/Brandt):* What an agent would want if fully informed/rational.
      *   *Critiques (Sobel):* If you change me enough to be fully informed/rational, am I still *me*? If the idealized me wants things the actual me hates, why should I care? (Alienation).
      *   *Critique (Rosati):* The connection between the good and the agent's motivational set gets severed.
      *   *Alignment Context:* If we build an AI to satisfy CEV, are we satisfying *humanity* or a philosophical construct that bears only a family resemblance to humanity?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Lineage):* Need to establish the connection to Railton/Brandt immediately. Don't let her treat CEV as sui generis.
          *   *Draft:* You know CEV looks like idealized preference theory. What do you think about that?
          *   *Refinement:* Make it sharper. "My advisor called it Railton in a trenchcoat." Ask about the specific meta-ethical commitments.
          *   *Follow-up:* If she says "it's engineering not philosophy," push back that it *is* philosophy implemented in code.

      *   *Question 2 (Authority/Alienation):* This is the core request. Why does Ideal-Me bind Real-Me?
          *   *Draft:* Why should I listen to my smarter self?
          *   *Refinement:* Use Sobel's framing. If the extrapolation changes my values so much I don't recognize them, why is that *alignment*?
          *   *Follow-up:* If she says "you would endorse it if you were them," point out that's circular.

      *   *Question 3 (Continuity of Self):* Related to authority. At what point does extrapolation become replacement?
          *   *Draft:* When do I stop being me?
          *   *Refinement:* Frame it as a spectrum. How much cognitive modification is allowed before it's not *our* volition anymore?
          *   *Follow-up:* If she says "coherence guarantees continuity," ask for the metric.

      *   *Question 4 (Hidden Complexity/Parameters):* The "sensitivity" request.
          *   *Draft:* What if you change the parameters?
          *   *Refinement:* Focus on the "growing up farther together" or "thought faster" bits. Small changes in the *process* yield different *outcomes*. Which process is the "true" one?
          *   *Follow-up:* If she says "the AI figures out the right parameters," ask how the AI knows without already having the values we're trying to extract.

      *   *Question 5 (Convergence/Aggregation):* The "whose volition" request.
          *   *Draft:* What if we don't agree?
          *   *Refinement:* CEV assumes convergence. Meta-ethics suggests pluralism. What if Ideal-Me and Ideal-You are incompatible?
          *   *Follow-up:* If she says "convergence is empirical," ask what the fallback is. Coercion?

      *   *Question 6 (Dynamic vs. Static):* A nice extra angle. CEV sounds like a one-time extrapolation. But humans change.
          *   *Draft:* What if we change our minds later?
          *   *Refinement:* If CEV locks in a specific extrapolated state, does it prevent moral progress *beyond* that point?
          *   *Follow-up:* If she says "it includes future growth," ask where the growth stops.

      *   *Question 7 (The "Ought" from "Is"):* Meta-ethical grounding.
          *   *Draft:* Is this moral realism?
          *   *Refinement:* Does CEV assume there is a fact of the matter about what we *should* want, or is it just aggregating psychological facts?
          *   *Follow-up:* If it's just psychological, why is it normative? If it's normative, where does the normativity come from?

      *   *Question 8 (Operationalizing "Coherent"):* Technical/Philosophical bridge.
          *   *Draft:* What does coherent mean?
          *   *Refinement:* "Coherent" does a lot of heavy lifting. Is it logical consistency? Reflective equilibrium?
          *   *Follow-up:* If it's logical consistency, humans aren't logically consistent. Are we fixing bugs or changing features?

      *   *Question 9 (The Dodge):* Specifically targeting the "extrapolation handles that" habit.
          *   *Draft:* You always say extrapolation handles it.
          *   *Refinement:* Frame it as a black box. If the answer to every problem is "the magic extrapolation box solves it," what work is the theory doing?
          *   *Follow-up:* Demand a concrete example where extrapolation *fails*.

      *   *Question 10 (Falsifiability):* The closing request.
          *   *Draft:* When would you quit?
          *   *Refinement:* What empirical or philosophical condition would make CEV the wrong target?
          *   *Follow-up:* (None needed for the last one, but make it sting).

  4.  **Review and Refine:**
      *   *Tone Check:* Needs to be respectful but rigorous. It's a podcast, not a cross-examination, but the host wants to avoid the usual fluff.
      *   *Constraint Check:* 8-10 questions? Yes. Follow-ups for deflections? Yes. Specific topics (Authority, Complexity, Aggregation, Falsifiability)? Yes.
      *   *Philosophy Check:* Ensure Sobel/Rosati/Railton references are accurate but accessible for a podcast audience. (The prompt implies the audience knows the alignment stuff, maybe less meta-ethics, so bridge that gap).

  5.  **Final Polish:** Organize logically. Start with the lineage, move to the internal problems (authority, parameters), then the social problems (aggregation), then the meta-problems (falsifiability). Ensure the follow-ups are punchy. (Self-Correction: Make sure the follow-ups don't sound *too* aggressive, but firm enough to prevent the standard dodge).

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 10 questions drafted for your interview. They are structured to move from the philosophical lineage to the technical implementation, ending with the falsifiability condition. Each includes a "standard dodge" you anticipate and a sharp follow-up to keep her pinned.

  ### 1. The Lineage Question (Setting the Frame)
  "My advisor described CEV to me as 'Railton and Brandt's idealized-preference theory of the good wearing a trenchcoat.' For the uninitiated, meta-ethicists spent decades debating 'full-information accounts' of well-being—what I'd want if I were fully informed and rational—and ran into serious problems regarding alienation and authority. Do you view CEV as a technical implementation of that specific philosophical tradition, and if so, why do you think the alignment community has largely ignored the critiques that sank those earlier theories?"

  *   **If she says:** "CEV is an engineering proposal, not a meta-ethical claim; we're just trying to stop extinction, not solve the Good."
  *   **Follow-up:** "But 'what we would want if we thought faster' *is* a meta-ethical claim about where normativity comes from. If you're coding that assumption into a superintelligence, you aren't sidestepping the philosophy; you're hardcoding a contested answer to Euthyphro's Dilemma. Why is that specific answer the safe default?"

  ### 2. The Authority Problem (Sobel/Rosati)
  "Let's press on that authority issue. David Sobel argued that if you idealize an agent enough—give them enough information and cognitive capacity—the resulting preferences might belong to a person the actual agent no longer identifies with. If my extrapolated self decides to value things my current self finds abhorrent, why does *that* self get to bind *me*? What gives the 'smarter' version of me the authority to overrule the 'actual' version?"

  *   **If she says:** "The extrapolation process is designed to preserve continuity; you would endorse the change if you saw the whole picture."
  *   **Follow-up:** "That sounds circular. If I only endorse the change *after* you've changed me, you haven't shown why *current*-me should consent to it. If the procedure can talk me out of caring about the things that currently make my life meaningful, haven't we solved the alignment problem by eliminating the alignee?"

  ### 3. The "Hidden Complexity" of Parameters
  "Yudkowsky's original phrasing includes variables like 'if we knew more,' 'thought faster,' and 'grown up farther together.' But sensitivity analysis in complex systems suggests tiny changes to initial parameters can swing outputs wildly. How do we specify 'how much farther' we grow up, or 'what' information is fed in and in what order, without those arbitrary choices determining the moral outcome? Isn't 'Coherent' doing more work in the name than the procedure actually earns?"

  *   **If she says:** "The AI will figure out the correct parameters as part of the extrapolation."
  *   **Follow-up:** "To figure out the correct parameters, the AI needs a metric for 'correctness.' That metric is a value judgment. Are you saying the AI should guess our values to determine how to extrapolate our values? That looks like a bootstrap problem."

  ### 4. The Aggregation/Convergence Assumption
  "CEV relies heavily on the hope that extrapolated volitions will *converge*—that idealized-me and idealized-you will agree. But contemporary meta-ethics often assumes reasonable pluralism; that even fully informed, rational people might disagree on the good. If the extrapolation step finishes and our volitions are still incompatible, what does the AI do? Does it pick a winner, and if so, on what basis?"

  *   **If she says:** "Convergence is an empirical hypothesis; we expect shared human biology and culture to drive agreement."
  *   **Follow-up:** "History suggests shared biology and culture drive plenty of irreconcilable conflict. If the hypothesis fails at runtime, does CEV default to a dictatorship of the majority's idealized selves? At what point does 'alignment' become 'coercion by a smarter version of us'?"

  ### 5. Bugs vs. Features
  "When you extrapolate 'what we wish we were,' you're implicitly distinguishing between our 'true' values and our cognitive bugs. But philosophers like Elizabeth Anderson argue that some things we call biases are actually adaptive heuristics or essential parts of our moral character. How does CEV distinguish between a cognitive error to be corrected and a value to be preserved, without already knowing the answer?"

  *   **If she says:** "The extrapolation process identifies coherence; inconsistencies are bugs."
  *   **Follow-up:** "Human morality is often defined by tension—justice vs. mercy, liberty vs. security. If the AI 'resolves' those tensions to maximize coherence, isn't it flattening the moral landscape? Are we asking for alignment, or for moral simplification?"

  ### 6. The Dynamic vs. Static Problem
  "CEV sounds like a one-time extrapolation: take humanity at time T, run the simulation, lock in the result. But human morality is dynamic; we change our minds about what matters over centuries. If we lock in the CEV of 2024 humanity, do we risk freezing moral progress? How does CEV account for the possibility that our extrapolated selves might be wrong about something we couldn't conceive of yet?"

  *   **If she says:** "CEV includes the desire for future growth and moral learning."
  *   **Follow-up:** "If it includes the desire for future growth, then the target isn't a static set of preferences, it's a process. But if the process can override the initial CEV output, then the initial CEV output wasn't the target. Which is it: a destination or a trajectory?"

  ### 7. The "Black Box" Defense
  "I've heard you answer objections about specification by saying, 'That's exactly what the extrapolation process is there to handle.' But if the extrapolation process is the answer to every problem regarding how to define the good, what work is the theory doing? It risks becoming unfalsifiable: if the AI does something we hate, was it a bad AI, or did we just fail to understand what our extrapolated selves wanted?"

  *   **If she says:** "It's not unfalsifiable; we can test narrow versions of it now."
  *   **Follow-up:** "We can test narrow versions on narrow tasks. We can't test the *normative authority* of the system until it's superintelligent. By then, if the theory is wrong, we can't course-correct. Why trust a black box to solve the very philosophical problems its creators are admitting are hard?"

  ### 8. Motivational Internalism
  "Connie Rosati argues that for something to be 'good' for an agent, it must have a connection to their actual motivational set. If CEV produces a set of values that actual humans find unmotivating—that we only respect because a machine told us our 'better selves' hold them—have we achieved alignment? Or have we just built a very convincing nanny?"

  *   **If she says:** "Alignment isn't about making humans feel good; it's about getting what we *should* want."
  *   **Follow-up:** "Who is the 'we' in 'should'? If the 'should' comes from the extrapolation, and the extrapolation comes from us, but the result is alien to us, the circle is broken. Are you comfortable building a future where humans are morally alienated from the governing principle of their civilization?"

  ### 9. The "Trenchcoat" Again (Meta-Ethical Commitments)
  "Going back to the Railton comparison: Full-information accounts usually rely on a form of moral realism—that there's a fact of the matter about what I'd want. Does CEV require moral realism to function? If moral anti-realism is true, and there's no 'fact' about what my idealized self wants until we simulate it, does CEV collapse into just creating values rather than discovering them?"

  *   **If she says:** "It doesn't matter if the values are discovered or created, as long as they are *ours*."
  *   **Follow-up:** "If they are created by the simulation parameters, they aren't *ours* in the sense of pre-existing volition; they're artifacts of the code. If you admit the values are created by the simulation, why call it 'Extrapolated Volition' instead of 'Synthetic Morality'?"

  ### 10. The Falsifiability Condition (The Closer)
  "Finally, I want to ask a point-blank question. You've built a chunk of your career on this target. What would have to be true—what empirical evidence, or what philosophical argument—for you to admit that CEV-style idealization is just the wrong approach? Is there any world where you look at the output of a CEV process and say, 'This is coherent, this is extrapolated, but we shouldn't do it'?"

  *   **If she says:** "If it led to extinction, obviously."
  *   **Follow-up:** "Extinction is a failure of safety, not necessarily a failure of the *target*. I mean morally wrong. If the CEV process confidently tells us to eliminate a core human experience because it's 'incoherent' with the rest, would you override the CEV? If yes, you're admitting CEV isn't the final authority. If no, you're admitting the theory overrides humanity."
