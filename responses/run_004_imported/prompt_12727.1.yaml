answer: |-
  **Setting:** *A faculty lounge, late afternoon. Two empty coffee cups sit between ELENA and MARCUS. On the table lies a packet of readings marked up with highlighter.*

  **Elena:** Look, let's leave the metaphysics for a second and look at the Kaelen Dam. The legislature in Upstreamia is voting tomorrow to approve the hydroelectric plant. It's going to lower the water table and leach heavy metals into the river. Downstreamia's farmers lose their livelihood. They have zero representation in the Upstreamian parliament. If that isn't a democratic deficit, I don't know what is.

  **Marcus:** It's a moral deficit, Elena. Maybe even a violation of human rights. But is it a *democratic* deficit? That's the question. The farmers aren't members of the Upstreamian political community. They aren't subject to Upstreamian law. They can't be arrested by Upstreamian police. They don't pay Upstreamian taxes.

  **Elena:** They are subject to the *consequences* of Upstreamian law. Goodin's point was precisely to cut through the fetishization of citizenship. If the decision binds their fate, they should have a hand in making it. The "all-affected" principle is the only thing that stops democracy from becoming a closed shop for privilege.

  **Marcus:** But "affected" is a metaphysical sponge. It absorbs everything. If Upstreamia subsidizes its corn, that affects Downstreamian farmers via market prices. Do they get a vote on the farm bill? If Upstreamia cuts carbon emissions, that affects the global climate. Does the *demos* for an energy vote become the entire human race?

  **Elena:** We can draw lines. Causal proximity. Significant harm. We're talking about toxic sludge, not fluctuating corn futures. You can distinguish between a side effect and a structural determination of interests.

  **Marcus:** Who draws that line? You? Me? The Upstreamian legislature? If it's the legislature, we're back to square one. They'll just say, "Oh, the pollution is an unfortunate externality, not a direct legal command," and exclude the farmers. If it's you or me, on what authority? This is Whelan's regress. To decide who votes, you need a voter. To apply the all-affected principle, you need a bounded body to apply it.

  **Elena:** I know the regress problem. It's the original sin of democratic theory. But we can't let the perfect be the enemy of the good. We have to start somewhere. If we acknowledge that power is being exercised over these farmers—effective, destructive power—democracy demands we give them a mechanism to contest it. Even if it's not a full ballot, it has to be formal consultation with veto power.

  **Marcus:** Okay, but let's talk about my side. The coercion principle. I'm with Abizadeh on this: legitimate coercion requires justification to those coerced. But I disagree with your leap from "justification" to "enfranchisement in the upstream legislature."

  **Elena:** Here's where I think your view cracks. Take resident non-citizens in Upstreamia. Undocumented workers, say. They are definitely coerced. Police stop them, courts judge them, labor laws bind them. Under your principle, they must have a say. Most coercion theorists agree they should be able to vote.

  **Marcus:** Agreed. If you live under the law, you should help write it.

  **Elena:** So why not the farmers? The dam is law. The environmental regulations that permit the sludge are law. That law physically constrains the farmers' bodies and property just as much as a police officer constrains a resident. If coercion is the trigger for voting rights, the border line seems arbitrary. It's just a geographical distinction in how the coercion is delivered.

  **Marcus:** It's not arbitrary. It's the distinction between being *subject to a legal order* and suffering an *externality from a legal order*. The resident non-citizen is within the jurisdiction; the state claims the right to rule them day-to-day. The farmers are not. Upstreamia isn't claiming the right to govern Downstreamia. It's just acting within its own territory in a way that spills over.

  **Elena:** But the border is enforced by coercion! That's Abizadeh's whole point. Upstreamia uses guns to keep the farmers out. If they could cross the border, they could protest the dam site. The border closure is what makes them vulnerable to the dam. So the border coercion and the dam policy are a package deal. You can't say, "We coerce you to stay out, but we don't coerce you with the pollution."

  **Marcus:** That's a strong argument, I grant you. But even if I concede that the border closure needs justification to the farmers, does that justification require giving them a vote in the Upstreamian parliament? Or does it require a treaty? An international tribunal? Bilateral negotiations?

  **Elena:** Why is a vote off the table?

  **Marcus:** Because a vote implies a shared *demos*. A "we." If the farmers get a vote on the dam, do they get a vote on Upstreamia's healthcare system? Their tax rates? If yes, then Upstreamia ceases to exist as a distinct political unit. It becomes a fragment of a global state. If no, then you're admitting that "affected interests" doesn't actually grant full membership, just issue-specific input.

  **Elena:** And? Why is issue-specific input not enough for this case? Democracy doesn't have to be all-or-nothing. We have special districts for water management all the time.

  **Marcus:** Because who decides which issues are "border crossing"? We're back to the regress. If Upstreamia decides, they'll classify everything as internal. If a global body decides, where did *that* body get its boundary? You're trying to solve the boundary problem with a principle that itself requires a boundary to function.

  **Elena:** I'm not trying to solve the metaphysical puzzle, Marcus. I'm trying to minimize arbitrary power. Your view protects the integrity of the state. Mine protects the integrity of the person. If I have to choose, I choose the person. If that means the "demos" is fluid, fine. Let it be fluid.

  **Marcus:** But a fluid demos can't deliberate. It can't build solidarity. It can't redistribute. If the electorate changes every time the wind changes direction, democracy becomes a series of referendums on isolated grievances. There's no "people" left to hold power accountable between elections.

  **Elena:** And if the "people" is a fortress that protects its privilege by dumping poison on its neighbors, it's not a democracy. It's a guild.

  **Marcus:** Okay. So here is where we actually stand, I think. We both agree the farmers are being wronged. We both agree the current setup is illegitimate in some sense.

  **Elena:** Yes.

  **Marcus:** You think the remedy is to expand the *demos* of the coercing unit to include the victims, effectively dissolving the border for that decision. I think the remedy is to constrain the *power* of the coercing unit through external mechanisms—international law, human rights courts—without dissolving the border.

  **Elena:** But those external mechanisms are weak. They rely on the very states that are doing the coercing to enforce them.

  **Marcus:** And your mechanism relies on a "global electorate" that doesn't exist to adjudicate who is affected.

  **Elena:** *Pause.* So the regress wins?

  **Marcus:** The regress doesn't win. It just locates the battle. The boundary isn't found; it's made. It's a political act, not a philosophical discovery.

  **Elena:** Right. So when we argue about AAIP versus ASCP, we aren't arguing about the "true" definition of democracy. We're arguing about which political fiction is more useful.

  **Marcus:** Exactly. Your fiction—that borders are morally arbitrary—pushes toward cosmopolitan institutions. My fiction—that borders constitute a space of collective autonomy—pushes toward strengthening transnational checks on state power.

  **Elena:** But we still have to vote on the dam tomorrow.

  **Marcus:** *Smiles.* And for that vote, the boundary is already set. The Upstreamian parliament decides who votes on the dam.

  **Elena:** Which proves Whelan right. The only solution to the boundary problem is force.

  **Marcus:** Or history. But Elena? If I were drafting the legislation, I'd include a clause for mandatory cross-border impact assessment. Not because the farmers have a vote, but because the coercion of the border requires *some* justification.

  **Elena:** And I'd campaign to make that assessment binding. Not because they're subjects, but because they're affected.

  **Marcus:** So we agree on the policy. We just disagree on the story we tell about why it's legitimate.

  **Elena:** And whether that story holds up when the next crisis hits.

  **Marcus:** Precisely. Coffee?

  **Elena:** Please. Black.
