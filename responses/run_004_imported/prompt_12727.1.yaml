      *   AAIP vs. ASCP? Yes.
      *   Global electorate objection? Yes.
      *   Resident non-citizen objection? Yes.
      *   Regress/Boundary problem acknowledgment? Yes.
      *   No total concession? Yes.

  *(Self-Correction Note during final review)*: I need to make sure Marcus doesn't just say "no." Abizadeh's argument is radical. He argues border *closure* is coercion that requires justification to outsiders. So Marcus needs to be careful not to contradict Abizadeh too much, or perhaps he's adopting a *modified* coercion view (like Risse or someone more statist) to make the debate workable. Actually, the prompt says "defend a version of the all-subjected-to-coercion principle and resist that [enfranchisement]... at least in its literal voting form." So Marcus can argue that while border coercion needs justification, it doesn't necessarily mean *voting rights* in the specific upstream legislature. It might mean treaty rights or international tribunals. That's a nuanced position that fits the "resist literal voting" instruction.

  Let's write it.

  *   **Elena:** Pro-AAIP (Goodin-esque).
  *   **Marcus:** Pro-ASCP (Abizadeh-esque but pragmatic about institutions).
  *   **Case:** The Kaelen Dam.

