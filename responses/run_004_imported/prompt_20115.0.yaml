prompt: |-
  I've judged our small press's annual first-novel prize for four years now, alongside four other novelists (shortlist of six, we pick the winner), and this year it got messy. We tally with a simple points system -- each judge ranks all six books, points run 5-4-3-2-1-0, highest total wins, no discussion before ballots go in -- and it came out over drinks after the ceremony that one judge, convinced her actual favorite couldn't beat the front-runner, ranked the front-runner dead last, well below where she actually rated it, just to tank its total. Now two people on the panel aren't speaking. The steering committee's asked me to write a short memo, due before we lock in next year's rules, recommending whether we keep this system or switch (approval voting and instant-runoff have both been floated). Can you draft it? I want an actual recommendation, not a pros-and-cons list, and I want it to take the case for just leaving things alone seriously before it shoots that down -- also I definately don't want it pretending whichever system we land on will be immune to this kind of gaming, because I have a feeling none of them are. Keep it tight enough that five opinionated novelists will actually read it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small press annual first-novel prize. 5 judges (novelists). 6 shortlisted books.
      *   **Current System:** Borda Count (rank 1-6, points 5-4-3-2-1-0). No discussion before voting.
      *   **The Incident:** One judge strategically voted (buried the front-runner) to manipulate the outcome. This caused interpersonal conflict (two judges not speaking).
      *   **Task:** Write a memo to the steering committee recommending whether to keep the system or switch (Approval Voting or Instant-Runoff Voting [IRV] are options).
      *   **Constraints:**
          *   Must make an *actual recommendation* (not just pros/cons).
          *   Must take the case for "status quo" seriously before rejecting it.
          *   Must acknowledge that *no* system is immune to gaming/strategy.
          *   Must be tight/concise (5 opinionated novelists need to read it).
          *   Tone: Professional, pragmatic, aware of human nature.

  2.  **Determine the Recommendation:**
      *   *Option A: Keep Borda.* Pros: Simple, captures nuance. Cons: Vulnerable to "burying" (as seen), encourages strategic voting.
      *   *Option B: Approval Voting.* Pros: Harder to game strategically (just vote yes/no), encourages consensus. Cons: Loses nuance (doesn't distinguish between "okay" and "favorite").
      *   *Option C: Instant-Runoff (IRV).* Pros: Ensures majority support, reduces "spoiler" effect. Cons: Complex to explain/count, can still be gamed (though harder), might eliminate compromise candidates too early.
      *   *Decision:* Given the specific conflict (strategic burying) and the group size (5 judges, 6 books), **Approval Voting** is often the most robust against tactical manipulation in small committees, but **IRV** is more familiar for "prizes." However, the prompt asks to address the gaming issue directly. The Borda count is *infamous* for being vulnerable to tactical ordering (burying rivals). Approval voting is generally considered more strategy-proof in this context. But actually, for a literary prize, nuance matters.
      *   *Re-evaluation:* The core issue isn't just the math; it's the lack of discussion. But the prompt asks about the *voting system*.
      *   *Best Recommendation:* **Instant-Runoff Voting (IRV)** or **Modified Borda with Discussion**. Wait, the prompt says "no discussion before ballots go in." Changing that culture is harder than changing the math.
      *   *Let's look at the "Gaming" constraint:* The user wants me to acknowledge no system is immune.
      *   *Strategic Choice:* **Approval Voting** is the strongest recommendation for minimizing the specific "burying" tactic that caused the fight. It removes the incentive to rank a good book last just to hurt it. You either approve it or you don't. However, literary prizes often want to know *order* of preference.
      *   *Alternative:* **IRV** is better for finding a consensus winner than Borda, but Borda is better for overall satisfaction.
      *   *Actually, the best advice for a 5-person jury:* **Keep the ranking but allow discussion.** But the prompt asks to recommend on the *system* (Approval vs IRV vs Status Quo).
      *   *Let's go with IRV.* It's the standard alternative for elections where a majority winner is desired. It makes "burying" less effective because your lower rankings only matter if your top choice is eliminated.
      *   *Wait, Approval Voting is simpler.* For 5 people? Approval is very hard to game effectively without knowing how others will vote.
      *   *Decision:* I will recommend **Approval Voting**. Why? Because the specific toxicity came from *relative* ranking manipulation. Approval voting removes the weapon of "ranking a 4-star book last." It forces judges to stand by what they think is *prize-worthy*, not just what beats whom. It aligns with the goal of finding a book the panel can agree is excellent, rather than the book with the highest mathematical average.
      *   *Wait, one more consideration:* Literary prizes usually want to distinguish 1st from 2nd. Approval just gives a winner. But the prompt implies the goal is picking *the* winner.
      *   *Let's pivot:* The most robust recommendation for a small group of experts is actually **Deliberation + Voting**. But if I must choose a voting math: **IRV** is often seen as more legitimate for a "winner." But **Approval** is best for stopping the "burying" tactic. Let's go with **Approval Voting** because it directly addresses the "burying" scandal.
      *   *Actually, looking at the "Status Quo" requirement:* I need to argue for Borda first. Borda captures nuance (degrees of quality). That's important for art.
      *   *Okay, Final Decision:* Recommend **Approval Voting**. It's the most effective cure for the specific poison (strategic burying) while acknowledging it's not magic.

  3.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the incident without getting bogged down in gossip. State the purpose.
      *   **The Case for Status Quo (Borda):** It captures nuance. It respects the intensity of preference (a favorite is worth more than a mild liking). It's familiar.
      *   **The Problem:** It invites tactical voting (the "burying" strategy). As seen this year, this destroys trust.
      *   **The Alternatives:** Briefly touch on IRV (complex, still gameable) vs. Approval.
      *   **The Recommendation:** Approval Voting.
      *   **The Caveat:** No system stops bad faith. The real fix is culture (discussion), but regarding the *ballot*, Approval is safer.
      *   **Closing:** Clear next step.

  4.  **Refining Tone:**
      *   Needs to be crisp. Novelists are busy and opinionated.
      *   Avoid jargon where possible.
      *   Acknowledge the human element (the "not speaking" part).
      *   Ensure the "no system is immune" point lands hard.

  5.  **Self-Correction during drafting:**
      *   *Check:* Did I argue seriously for keeping Borda? Yes, need to emphasize "nuance."
      *   *Check:* Did I admit gaming is possible in Approval? Yes, "threshold manipulation."
      *   *Check:* Is it short? Keep it under 500-600 words.
      *   *Check:* Is the recommendation clear? Yes.

  6.  **Final Polish:** (Reviewing against the prompt's specific constraints).
      *   "Take the case for just leaving things alone seriously before it shoots that down." -> Make sure the first body paragraph is strong on Borda's merits.
      *   "Definitely don't want it pretending whichever system we land on will be immune." -> Add a specific paragraph or sentence on "inherent vulnerabilities."
      *   "Tight enough that five opinionated novelists will actually read it." -> Use bullet points or short paragraphs. Bold key phrases.

      *(Self-Correction on Recommendation)*: Actually, for a literary prize, Approval Voting can feel reductive. "Is this book prize-worthy? Yes/No." It might result in multiple winners or no winners if thresholds aren't set. IRV is more standard for "Pick One." However, Approval is *specifically* resistant to the "burying" tactic that caused the fight. In Approval, burying a rival doesn't help your favorite unless you disapprove of the rival. If the rival is genuinely good (as the front-runner was), a judge has to lie and say "Not Prize Worthy." That's a bigger lie than ranking them 6th. It raises the moral bar for gaming. I'll stick with Approval.

      *Wait, one nuance:* The prompt mentions "Approval voting and instant-runoff have both been floated." I should address why I pick one over the other.
      *IRV:* Still allows some strategy, harder to count manually (though 5 judges is easy).
      *Approval:* Simplest, hardest to game strategically without looking crazy.
      *Let's go with Approval.*

      *Wait, reconsidering the "Status Quo" argument:* The status quo (Borda) is actually the *most* nuanced. It allows a judge to say "This is 3rd, but close to 2nd." IRV and Approval lose that. I need to make sure I give Borda its due credit for respecting artistic judgment, before explaining why the trust cost is too high.

      *Final Plan:*
