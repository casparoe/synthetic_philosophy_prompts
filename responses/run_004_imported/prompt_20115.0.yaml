answer: |-
  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Jury Voting Protocol

  **Context**
  Following this year's prize cycle, it is evident that our current voting mechanism contributed to a breakdown in panel trust. The incident regarding strategic ranking ("burying") has strained relationships among judges. We must decide whether to retain the Borda Count (ranking 5–0) or adopt a new system for next year.

  **The Case for Status Quo (Borda Count)**
  We should not dismiss the current system lightly. For literary judgment, the Borda Count offers superior nuance. It allows a judge to distinguish between a book they love and one they merely respect. It captures the *degree* of preference, not just the order. In an ideal world of good-faith actors, this is the most accurate mathematical reflection of a panel's collective taste. It respects the complexity of art better than binary choices.

  **The Fatal Flaw**
  However, the Borda Count is uniquely vulnerable to tactical manipulation. Because every rank carries point value, a judge can damage a rival contender without sacrificing their own favorite's chances, simply by ranking the rival artificially low. As we saw this year, this invites strategic voting over honest judgment. When the system rewards gamesmanship, it penalizes integrity. The resulting interpersonal damage outweighs the benefit of nuanced ranking.

  **Alternatives Considered**
  *   **Instant-Runoff (IRV):** This ensures the winner has majority support. However, it is more complex to tally and still vulnerable to "push-over" strategies (eliminating a strong rival early by ranking them low).
  *   **Approval Voting:** Judges vote "Yes" or "No" for each book based on a fixed standard (e.g., "Is this prize-worthy?"). The book with the most approvals wins.

  **Recommendation**
  **I recommend we switch to Approval Voting.**

  While less nuanced than Borda, Approval Voting raises the moral cost of gaming. To tank a front-runner under this system, a judge must lie and declare a book *unworthy* of the prize, rather than simply ranking it lower. This makes strategic voting more conspicuous and ethically difficult. It shifts the focus from "beating the other books" to "meeting the standard."

  **A Necessary Caveat**
  We must be clear: **No voting system is immune to bad faith.** A determined judge can game Approval Voting by setting their personal "bar" impossibly high for everyone but their favorite. Math cannot fix broken trust. If the panel culture remains adversarial, any system will break. However, Approval Voting removes the specific weapon used this year.

  **Next Steps**
  If approved, I will draft a one-page guide for next year's judges defining the "Approval Threshold" to ensure consistency.

  Regards,

  [Your Name]
