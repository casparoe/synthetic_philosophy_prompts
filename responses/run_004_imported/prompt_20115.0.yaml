      5. Evaluation of Alternatives (IRV vs Approval).
      6. Recommendation (Approval).
      7. The "No Magic Bullet" disclaimer.
      8. Sign-off.

      *Word Count Check:* Keep it tight.

      *(Final thought on the "No Discussion" rule)*: The prompt says "no discussion before ballots go in." I shouldn't recommend changing that unless I think it's the root cause. The prompt asks me to recommend on the *system*. I will stick to the voting math but hint that process matters.

