answer: |-
  **Setting:** *A quiet corner of a university library, late evening. Two philosophers, Chidi and Amina, sit across from one another. Between them lies a case file regarding a hypothetical patient, "Mama Nneka."*

  **Chidi:** Let's not hide behind abstractions, Amina. We have Mama Nneka before us. Ten years ago, she was the axis of her lineage. She poured libations, settled disputes, named the children. Today, she stares through her family. She cannot speak. She cannot perform a single rite. If we follow Menkiti, personhood is a normative status achieved through the discharge of social obligations. She can no longer discharge them. Logically, has her personhood diminished?

  **Amina:** And that is precisely why we must follow Gyekye. If you answer "yes," you validate a terrifying calculus. If personhood is a function of performance, then Mama Nneka is currently less of a person than she was. But if you answer "no," Chidi, you concede my point: that there is an inherent dignity within her that the dementia cannot touch. You cannot have it both ways. You cannot claim personhood is *achieved* through function and then claim it *persists* without function.

  **Chidi:** You are treating Menkiti's view as a transactional ledger. It is not. Menkiti speaks of incorporation. Yes, Mama Nneka can no longer *act* as a person in the full normative sense. She has receded from the active sphere of agency. But personhood is not solely held by the individual; it is held by the community *on behalf* of the individual. Her personhood is not erased; it is being sustained vicariously by her kin. They perform the rites *for* her. They speak *to* her. In doing so, they keep her in the moral circle.

  **Amina:** "Vicarious personhood." That is a poetic rescue, but look at the implication for her care. If her status now depends entirely on the community's willingness to sustain it, what happens if the community grows tired? If personhood is a status conferred by others, it can be withdrawn by others. If her family decides the cost of caring for a "non-participating" member is too high, does your view give them a philosophical exit ramp? Gyekye argues that her right to care is anchored in her *being*, not her *belonging*. She is owed care because she is a human being with inherent worth, not because her children are dutiful.

  **Chidi:** But "inherent worth" is too thin, Amina. It is a Western metaphysical ghost. Why do we owe Mama Nneka *more* than we owe a stranger in a coma? Why is the grief specific? Menkiti explains this. We owe her care because of the *history* of her incorporation. She built the community that now holds her. The obligation is reciprocal, based on the social capital she accrued when she was capable. Your view makes her interchangeable with any human organism. My view explains why *this* woman, specifically, is sacred to *this* group.

  **Amina:** It explains the intensity of the grief, perhaps, but not the basis of the right. Let's press the hard case further. Suppose Mama Nneka was not a respected elder. Suppose she was a recluse, or difficult, or simply childless. Under Menkiti's strict normative view, if she failed to incorporate herself deeply, or if she has no one to sustain her personhood vicariously, is she less of a person? If personhood is progressive achievement, does the isolated dementia patient slide back into the status of a "mere individual" or even a "thing"?

  **Chidi:** Menkiti would say that isolation is itself a tragedy of failed personhood. But let's look at your view. You say she possesses self-determination and dignity inherently. But Mama Nneka has *no* capacity for self-determination. She cannot choose. She cannot reason. If you ground her dignity in a capacity she no longer possesses, aren't you also fictionally attributing powers to her? At least I am honest: she has lost the capacity for normative agency. But I argue the community absorbs that loss.

  **Amina:** I ground her dignity in her *history* of capacity and her ontological status as a human, which is not revocable by pathology. But here is the trap for you, Chidi. If the community sustains her personhood, does she have a claim *against* the community? If she groans in pain, and the family decides that sedating her is better for the communal harmony than trying to soothe her, does your view protect her? If she is a vessel for their ritual continuity, her comfort might be secondary to the proper performance of the rites surrounding her.

  **Chidi:** That is a distortion. The rites are for *her* integration, not just their peace of mind. But let me turn the pressure back. If she is fully a person in your Gyekyean sense, with full dignity regardless of participation, does her condition matter morally? If she is the same "person" at 90 with dementia as she was at 60 running the household, then the loss of her agency is irrelevant. But it *is* relevant. We mourn the loss of *who she was*. Menkiti captures the tragedy: she is losing her grip on personhood. We must work harder to hold her. Your view makes her static. It ignores the tragedy of the erosion.

  **Amina:** Acknowledging the tragedy of erosion is not the same as saying her moral status has eroded. This is the crux. If you admit her personhood is diminished, even slightly, it changes the weight of her interests. If she is "less of a person," can we prioritize the needs of the "full persons"—the grandchildren who need school fees—over her expensive medical care? A utilitarian calculation becomes easier if her status is normative and gradable. Gyekye draws a line in the sand. No matter how far the mind recedes, the claim to basic respect and care is absolute. It is not a gradient.

  **Chidi:** But life *is* a gradient! Menkiti is honest about the lifecycle. We start as potential persons, we become persons, we may decline, and we become ancestors. If we pretend her status is unchanged, we ignore the reality that she can no longer enter into moral dialogue. She cannot be held responsible. She cannot praise or blame. She is, in a functional sense, outside the normative community. My argument is not that we abandon her, but that our duty shifts. We are no longer partners with her; we are guardians of her memory and her physical vessel.

  **Amina:** "Guardians of her vessel." Do you hear the language? That is the danger of the normative view. Once you define her by what she can *do* for the moral order, and she can do nothing, she becomes a vessel. A symbol. Gyekye insists she is still a subject, even if a silent one. She is owed care not because she was once useful to the lineage, but because she is a self-end. If we base her care on her past contributions, we risk treating the dementia patient who was a criminal, or a beggar, as less worthy of care. Does Menkiti protect the outcast elder?

  **Chidi:** Menkiti would argue the outcast elder is a warning of what happens when community fails. But regarding Mama Nneka: if we say she is exactly the same person she was, do we not disrespect her current reality? She does not know us. To speak to her as if she is the same agent is a fiction. My view allows us to acknowledge she has changed status without changing our obligation. In fact, our obligation increases *because* her status is vulnerable. She needs the community to be her personhood now. It is a heavier burden than your "inherent dignity." Inherent dignity is passive. Vicarious personhood requires active work.

  **Amina:** It requires active work, yes, but it makes her existence conditional on that work. If the community fractures, if the war comes, if the children migrate to the city and cannot perform the rites... on your view, does Mama Nneka cease to be a person in the full sense? Does she become a biological remainder? On my view, she carries her dignity with her like a bone structure. It does not rely on the audience.

  **Chidi:** But dignity without an audience is meaningless in an African context! Personhood is dialogical. If there is no one to recognize her, there is no personhood. But this is why the hard case matters. We are that audience. We are the ones who must decide. If I adopt your view, I treat her as an island of rights. If I adopt Menkiti's, I treat her as a node in a network that has gone dark, which we must try to relight.

  **Amina:** But if the network *cannot* be relit, Chidi? If the dementia is permanent? If she never recognizes a face again? You must tell me: In the final week of her life, when she is comatose, is she a person?

  **Chidi:** She is a person-in-potential, held in the memory of the ancestors and the living. She is transitioning.

  **Amina:** "Transitioning." That is a euphemism for "diminished." And that is where I cannot follow you. Because if she is diminished, then the care we offer is charity, born of pity for her loss of status. If she is inherently dignified, the care we offer is justice, born of her unassailable right. I want Mama Nneka to be owed care as a matter of justice, not as a gift from a community that has decided to keep her in the circle.

  **Chidi:** And I worry that your "justice" is cold. It treats her as a bearer of rights, abstracted from the love that actually motivates the care. Menkiti's view is warmer. It says, "You are one of us, so we carry you when you cannot walk." It is not about rights; it is about belonging. Even if you cannot speak, you belong.

  **Amina:** But belonging can be revoked. Rights cannot. That is the lesson of the hard case. When the mind goes, we need the shield of rights, not the fragility of belonging. For Mama Nneka's sake, I must insist: she is no less a person today than the day she named her first grandchild. The tragedy is in her capacity, not her worth.

  **Chidi:** And I insist: her worth is inextricably linked to that capacity, which is why we mourn its loss so deeply. But perhaps, in the end, both views demand the same action: we feed her, we wash her, we sit by her bed.

  **Amina:** We do. But I need to know *why*. Because if the theory fails her when she is most vulnerable, the theory is broken.

  **Chidi:** Then let the theory be that the community becomes the memory she has lost. That is not a retreat from personhood. It is the ultimate act of person-making.

  **Amina:** Then let us hope the community is strong enough to bear that weight. Because on your view, if the community fails, she disappears. On mine, she remains, waiting for us to catch up.

  **Chidi:** *(Silence, looking at the file)* Then we agree on the work. We just disagree on whether she is watching us do it.

  **Amina:** No, Chidi. We disagree on whether she matters if no one is watching.

  **Chidi:** *(Nods slowly)* Then we have much more to discuss. But not tonight. Tonight, we go check on the ward.

  **Amina:** Agreed.
