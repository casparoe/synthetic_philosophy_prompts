answer: |-
  **MEMORANDUM**

  **TO:** University Honor Council
  **FROM:** [Your Name/Student Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Statistically-Flagged Integrity Cases

  **Background**
  As you know, the Statistical Consulting Office has flagged eleven student pairs in the introductory statistics course for potential collusion. The office's algorithm compares wrong-answer patterns across the entire class. While the threshold for flagging is set at odds exceeding 200,000 to 1 against innocent coincidence, the office explicitly notes that in a dataset of this size, we should expect approximately three false positives even if no cheating occurred. Consequently, while each pair individually meets our "clear and convincing" evidentiary standard, the aggregate data suggests it is statistically near-certain that at least some of the eleven are innocent.

  **The Conflict**
  The Council is currently divided. One position holds that because each pair individually meets the evidentiary standard, we are obligated to proceed with charges against all eleven. To do otherwise would be to ignore evidence that technically satisfies our bylaws. The opposing position holds that proceeding against all eleven, knowing that some are likely innocent, violates the fundamental fairness our sanctions are meant to uphold, particularly given the mandatory expulsion policy.

  **Analysis**
  We must take the first position seriously: the statistical evidence is robust. A 200,000:1 likelihood ratio is not trivial; it represents a rational basis for suspicion far exceeding normal investigative thresholds. To dismiss this evidence entirely would undermine the Council's ability to address sophisticated academic dishonesty.

  However, the "clear and convincing" standard is not merely a mathematical threshold; it is an epistemic commitment to reliability. When we evaluate eleven cases derived from a single methodological pool where the error rate is known and quantifiable (approx. 27% of the flagged set), we are no longer evaluating eleven independent truths. We are evaluating a single system that we *know* produces errors. To sanction all eleven is to sanction students based on a process that we have admitted will yield false accusations. In high-stakes adjudication, particularly where the sanction is expulsion, the risk of known systematic error must override individual probabilistic strength.

  **Recommendation**
  I propose the Council adopt the following policy, effective immediately:

  1.  **Statistical evidence alone constitutes grounds for investigation, not adjudication.** A statistical flag establishes *probable cause* to open a case, but it does not satisfy the *clear and convincing* standard for a finding of responsibility without corroboration.
  2.  **Corroboration Requirement.** For statistically-flagged cases, the Council requires at least one additional form of evidence (e.g., digital log data, seating charts, witness testimony, or admission) to proceed to a sanction.
  3.  **Application to Current Cases.** Regarding the eleven flagged pairs in the statistics course: We will notify the students that an investigation is open based on statistical anomalies. We will seek corroboration. If no corroboration is found within 14 days, the cases will be closed without sanction.

  **Timeframe**
  I move that we vote on this policy at the next meeting. If passed, the Investigative Committee will begin contacting the eleven students within 48 hours to gather additional information, with a final determination on these specific cases to be made no later than November 10.

  This approach respects the strength of the statistical evidence by using it to target investigations, while respecting the rights of the accused by acknowledging the known fallibility of the aggregate data.

  ***

  ### Philosophical Analysis: Lottery vs. Preface

  Since you asked for this separately for your own benefit: I believe this case tracks the **Lottery Paradox** more closely than the Preface Paradox, and that distinction *should* influence the Council's decision.

  **Why the Lottery Paradox?**
  In the Lottery Paradox (Kyburg), you are justified in believing of any single ticket that it will lose (high probability), but you are not justified in believing of *all* tickets that they will lose (because you know one must win). The justification is purely probabilistic and structural.

  In the Preface Paradox (Makinson), an author is justified in believing each claim in her book (based on specific evidence/research for each), but also justified in believing the book contains an error (based on general inductive fallibility). The tension is between specific evidence and general humility.

  Your Honor Council case is a Lottery structure.
  1.  **Homogenous Evidence:** The evidence for every pair is of the exact same type (statistical probability), just as the evidence for every ticket losing is the same (odds). In the Preface, the evidence for each sentence varies (different research, different topics).
  2.  **Known Error Distribution:** The statistical office isn't saying, "Humans are fallible, so there *might* be an error" (Preface). They are saying, "Given the number of comparisons, there *will* be roughly three errors" (Lottery). We know *a priori* that the conjunction "All 11 pairs cheated" is false, just as we know "All tickets will lose" is false.

  **Does the Difference Matter?**
  Yes. If this were the Preface Paradox, one could argue that the author (the Council) is rationally permitted to hold inconsistent beliefs (believing each student is guilty while believing the set contains innocents) and act on the individual beliefs. Many epistemologists argue the Preface shows that rational belief is not closed under conjunction.

  However, the Lottery Paradox is typically used to argue that **high probability alone does not constitute knowledge or justification for assertion.** We do not say we *know* a specific lottery ticket will lose, even if the odds are millions to one, because the mechanism of the loss is purely chance. Similarly, the mechanism here is a "lottery of comparisons." The statistical flag tells us a pair is an outlier, but without causal evidence (like the author's specific research in the Preface), we lack the specific justification to assert guilt.

  If you treat this as a Preface case, you might feel comfortable expelling all eleven (acting on individual justification) while mentally acknowledging some are innocent. If you treat it as a Lottery case, you recognize that statistical probability, absent causal narrative, is insufficient for the *knowledge* required to expel a student. Given the severity of expulsion, the Council should adopt the Lottery intuition: statistical inevitability of error in the set undermines the justification for action on the individual members.
