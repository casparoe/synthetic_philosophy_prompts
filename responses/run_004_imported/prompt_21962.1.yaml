answer: |-
  **Setting:** *A quiet corner of a conference room, late afternoon. A whiteboard is covered in decision trees. On the table between them lies a stack of index cards labeled **A**, **B**, and **C**, and a notepad representing the Bookie's ledger. **Elena** (Traditionalist, coherence theorist) is holding a marker. **Marcus** (Revisionist, pro-resolute choice) is leaning back, arms crossed.*

  **Elena:** (Tapping the whiteboard) Let's ground this before we drown in the meta-ethics. You're building an agent. You say it's okay for it to have cyclic preferences. Say, $A \succ B$, $B \succ C$, and $C \succ A$. Maybe it's a multi-objective optimizer where the weights shift contextually. Fine. But you know what happens at this table.

  **Marcus:** The money pump. I know the drill, Elena. Start with endowment A. Offer trade to B for a penny. My agent prefers B, so it trades. Now it has B minus a penny. Offer trade to C for a penny. Prefers C, trades. Now C minus two pennies. Offer trade back to A for a penny. Prefers A, trades. Now it's back at A, minus three pennies. Repeat until bankruptcy.

  **Elena:** Exactly. It's a dominance argument. At every node, the agent *could* have kept what it had and saved the penny. Instead, it actively chose to lose money. That's not just suboptimal; it's incoherent. If your agent does this, it's not an agent; it's a sink.

  **Marcus:** That argument assumes *myopic* choice. It assumes my agent re-evaluates its preferences at every node $t_1, t_2, t_3$ without reference to the plan adopted at $t_0$. That's not how I'm building it. I'm building a **resolute chooser**.

  **Elena:** McClennen's move.

  **Marcus:** Right. At $t_0$, before the first offer is made, my agent evaluates the *entire tree*. It sees three viable strategies:
  1.  **Trade-All:** End up at $A - 3\epsilon$.
  2.  **Stop-at-B:** End up at $B - \epsilon$.
  3.  **Stop-at-C:** End up at $C - 2\epsilon$.
  4.  **No-Trade:** End up at $A$.

  Even though locally $B \succ A$, globally the agent prefers the outcome $A$ (with full value) over $A - 3\epsilon$. So at $t_0$, it adopts the plan: **"Reject all trades."** When it reaches $t_1$ and is offered $B - \epsilon$ for $A$, its local preference screams "Take it!" But the resolute chooser ignores the local preference. It executes the plan. The pump is blocked. Zero pennies lost.

  **Elena:** (Sighs, erasing a branch on the whiteboard) You've described the mechanism, Marcus. You haven't justified the rationality. You're saying it's rational to knowingly choose an option ($A$) that you currently rank lower than another available option ($B - \epsilon$), solely because a past version of yourself liked $A$ better. That violates **Separability**. You're letting sunk costs—or in this case, sunk *plans*—dictate current choice.

  **Marcus:** It's not sunk cost; it's dynamic consistency. If I can't trust my future selves to stick to the plan that maximizes my $t_0$ utility, I'm fragmented. Resolute choice unifies the agent over time. The "irrationality" isn't in the cyclic preferences; it's in the *myopic decision theory* that can't handle temporal extension.

  **Elena:** Okay, let's grant you McClennen for the sake of the single-shot pump. You block it. But you mentioned you were reading Gustafsson. Did you get to Chapter 5? Because he reconstructs the pump for the resolute chooser. It's not about a single run anymore; it's about the **long run** and the **value of resolution**.

  **Marcus:** I skimmed it. He tries to pump the *plan* itself?

  **Elena:** He pumps the *disposition*. Look, your agent avoids the loss by being resolute. But resolution isn't free. It requires cognitive architecture to suppress local preferences. Let's modify the scenario. Suppose the Bookie comes to you every Monday for a year. Fifty-two pumps.

  **Marcus:** And every Monday, my agent adopts the plan "Reject all trades" and loses nothing. Where's the leak?

  **Elena:** The leak is in the **counterfactuals**. To be resolute, your agent must prefer the *plan* "Keep A" over the *plan* "Trade to B." But remember, your underlying outcome preferences are still cyclic: $A \succ B \succ C \succ A$.
  Now, imagine a new Bookie, let's call her **Meta-Bookie**. She doesn't offer trades on A, B, or C. She offers you **insurance**.
  She says: "Marcus, I know you face the standard Money Pump every Monday. I know you plan to be resolute. But there's a 1% chance each week that your resolution module glitches—maybe a cosmic ray flips a bit, maybe a heuristic fails—and you act myopically. If that happens, you lose $3\epsilon$."

  **Marcus:** Standard risk management. I'd buy insurance if the premium is less than the expected loss. Expected loss is $0.01 \times 3\epsilon$. If the premium is lower, I buy. If higher, I don't. No pump.

  **Elena:** Not yet. Here's the twist. Meta-Bookie offers you a **Subscription**. For a flat fee $K$ upfront, she guarantees your resolution module works perfectly for the year. No glitches.
  If you are truly resolute, you believe your resolution is robust. So you shouldn't need to pay $K$ to *ensure* you do what you were already going to do. You should decline the subscription.
  But... if you decline, and there *is* that 1% risk, you face the expected loss.
  If you accept, you pay $K$.
  Now, Meta-Bookie sets $K$ slightly higher than the expected loss of the risk, but lower than the *certain* loss of the pump if you weren't resolute.
  Wait, that's not the pump. Let me tighten this. This is the **Gustafsson Ex-Post Pump**.

  **Marcus:** Go on.

  **Elena:** Gustafsson argues that if you are a resolute chooser, your choice at node $t_1$ depends on the *history* of how you got there. Specifically, it depends on the fact that you chose the plan at $t_0$.
  Suppose Meta-Bookie offers you a deal at $t_0$: "Pay me $\delta$. If you pay, I will remove the option to trade at $t_1$."
  If you are resolute, you plan to not trade anyway. So the option to trade is worthless to you. You shouldn't pay $\delta$ to remove it.
  But, if you *don't* pay, and you reach $t_1$, you have to exert effort to remain resolute. If there is *any* cost to that effort—call it cognitive load $\lambda$—then at $t_0$, you should prefer the branch where you pay $\delta$ to avoid the load $\lambda$, provided $\delta < \lambda$.
  So you pay $\delta$.
  Now, next week, Meta-Bookie offers to *restore* the option to trade for a fee $\gamma$, claiming you might want flexibility. Since your preferences are cyclic, you value flexibility locally ($B \succ A$). You might pay to keep the option open, even if you plan not to use it, just because having the option satisfies the local preference ranking.
  If you pay to remove the option, and pay to restore it, you're being pumped on the *structure of the tree*, not the outcomes.

  **Marcus:** (Pauses, looking at the cards) That relies on me valuing the *option* differently than the *outcome*. But if I'm consistent, I value the option only insofar as it leads to preferred outcomes. If I plan not to trade, the option has no instrumental value. I wouldn't pay to restore it.

  **Elena:** But your preferences are cyclic, Marcus! That's the premise. At $t_1$, locally, you prefer $B$ to $A$. Even if you override it, that preference exerts pressure. Rabinowicz points out that resolute choice creates a split between your **normative preference** (the plan) and your **motivating preference** (the local urge).
  If the Bookie can bet on that split, you lose.
  Here's the cleaner version, the one that keeps me up at night. The **Iterated Money Pump with Learning**.
  Suppose you face the pump 1,000 times. You are resolute. You lose nothing.
  But suppose I offer you a chance to **modify your preferences** to be transitive ($A \succ B \succ C$) for a one-time cost $M$.
  If you modify, you never need to be resolute. You just follow local preferences and never get pumped. You save the cognitive cost of resolution forever.
  If you stay cyclic, you must remain resolute forever.
  If there is *any* non-zero probability $p$ that your resolution fails in 1,000 trials, the expected loss is $1000 \times p \times 3\epsilon$.
  If $M < 1000 \times p \times 3\epsilon$, a rational agent should pay $M$.
  But if you pay $M$, you are admitting that having cyclic preferences was a liability. You're paying to become the kind of agent who *doesn't* need resolute choice.
  So, resolute choice doesn't save the cyclic preferences; it just delays the admission that they're too costly to maintain.

  **Marcus:** (Leans forward, tapping the 'A' card) That's a pragmatic argument, not a normative one. You're saying "It's expensive to be rational." I'm saying "It's possible to be rational with these preferences."
  If my agent is perfectly resolute, $p = 0$. Then $M$ is zero value. I don't pay.
  The coherence argument claims cyclic preferences are *logically* inconsistent, like believing $P$ and $\neg P$. You're reducing it to an engineering budget problem.

  **Elena:** Because the logical inconsistency *shows up* as a vulnerability in the long run!
  Look, let's look at Gustafsson's **Ex Post** argument again. It's more surgical.
  You say at $t_0$ you choose the plan "Keep A."
  At $t_1$, you are offered $A \to B - \epsilon$.
  Local preference: $B - \epsilon \succ A$.
  Resolute choice: Keep $A$.
  Question: Why?
  If the reason is "Because I promised myself at $t_0$," then you are valuing **promise-keeping** as a good.
  So your actual utility function isn't $U(A)$ vs $U(B)$. It's $U(A) + V(\text{Keeping Promise})$ vs $U(B - \epsilon)$.
  If $V(\text{Keeping Promise})$ is high enough, you keep A.
  But now your preferences *aren't* cyclic anymore! You prefer $A + \text{Promise}$ to $B$.
  You've smuggled in a transitive preference for integrity to save the cyclic preference for outcomes.
  But if that's the case, I can pump the **integrity**.
  I offer you a trade: "Pay me $\epsilon/2$. I will release you from your promise. You are now free to trade A for B without breaking your plan."
  Since you locally prefer $B - \epsilon$ to $A$, and now you don't have the penalty of breaking a promise, you will trade.
  So you pay $\epsilon/2$ to release the promise, then trade A for $B - \epsilon$.
  Net result: You have $B - 1.5\epsilon$.
  If you hadn't paid for the release, you would have kept $A$.
  If you prefer $B$ to $A$ (locally), and you paid to make the trade allowed, you must prefer $B - 1.5\epsilon$ to $A$.
  But at $t_0$, you preferred $A$ to $B - \epsilon$ (otherwise you wouldn't have made the plan).
  So you prefer $A$ to $B - 1.5\epsilon$, but you chose $B - 1.5\epsilon$.
  You've been pumped on the **meta-preference**.

  **Marcus:** (Silent for a moment, staring at the trade sheet) That... assumes I value the release. If I'm truly resolute, the "promise" isn't an external constraint I can buy my way out of. It's constitutive of my agency at $t_1$. I *am* the agent who keeps plans. Selling out the plan is selling out the self.

  **Elena:** Then you're not an expected utility maximizer anymore, Marcus. You're a deontologist. You're saying "I follow Rule R regardless of consequences."
  And if you're a rule follower, I don't need a money pump. I just need to put you in a situation where Rule R leads to a dominated outcome.
  Like the **Newcomb Problem** variants. If your resolution is rigid, I can predict it. If I can predict it, I can set the payoffs such that your rigidity forces you into the lower box.
  The coherence argument wins because it shows that *any* deviation from expected utility maximization (which requires transitive preferences) leaves you vulnerable to *some* bookie, eventually. Resolute choice just changes which bookie gets you. It switches you from the **Standard Money Pump** to the **Dynamic Inconsistency Pump**.

  **Marcus:** (Sighs, picking up the 'A' card) Okay. So the trade-off is this:
  If I keep cyclic preferences and use Myopic Choice, I get pumped on outcomes (lose money directly).
  If I keep cyclic preferences and use Resolute Choice, I avoid the outcome pump, but I become vulnerable to pumps on my *dispositions* or *meta-preferences* (like the release fee), or I have to accept that I'm not maximizing utility in the standard sense.

  **Elena:** Precisely. Gustafsson's conclusion isn't that resolute choice is impossible. It's that it doesn't *save* the rationality of the cyclic preferences. It just shifts the locus of the exploitation. You're not immune; you're just harder to pump. You require a more sophisticated Bookie who knows your decision theory, not just your preferences.

  **Marcus:** But for my agent... if the "sophisticated Bookie" is rare, and the "Standard Money Pump" is common...

  **Elena:** ...Then resolute choice is a good heuristic. But don't tell your stakeholders the preferences are "rational." Tell them the agent is "robustly programmed to ignore its own local utility signals."

  **Marcus:** (Smiles faintly) "Robustly ignores local utility." That's going in the documentation.
  So, who wins?

  **Elena:** (Starts wiping the whiteboard) The Bookie always wins. The question is just how much entry fee he charges.
  If you want transitivity, you pay the cost of redesigning the reward function.
  If you want to keep the cyclic rewards, you pay the cost of the resolution architecture and the risk of the meta-pump.
  In engineering terms? It's a bug either way. You just get to pick if it's a runtime error or a memory leak.

  **Marcus:** Great. Just what I needed to hear before the sprint review.
  (Pauses) But seriously... if I make the resolution cost high enough...

