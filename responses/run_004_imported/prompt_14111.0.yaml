answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I'm the best friend. And for about half of you in this room, that title comes with a specific footnote.

  [Groom] and I met years ago on an internet forum. We didn't bond over sports, or music, or girls. We bonded because we got into a heated argument about a philosophical thought experiment called "Counterfactual Mugging."

  For the parents, the grandparents, and the cousins who are currently wondering what kind of wedding this is: don't worry. It sounds violent, but it's just math. Basically, it asks the question: "If you agreed to a rule when you were rational and happy, do you still follow that rule when you're stressed, confused, and it costs you something to keep it?"

  We never stopped arguing about it. We have no formal training. We're just two guys who got hooked on the idea that the hardest part of being a good person isn't knowing what's right when things are going well. It's knowing what's right when the world hands you a bad hand, and you're tempted to change the rules mid-game.

  And that brings me to today. Because looking at [Groom] and [Partner], I realized that a wedding vow is the ultimate expression of that theory. In philosophy, we call it "Updateless Decision Theory." But I think a better name for it is "Love."

  See, in decision theory, being "updateless" doesn't mean you ignore reality. It means you don't let your temporary emotions overwrite your long-term values. It means you choose a policy *in advance*. You decide who you are before you know what problems will show up on Tuesday afternoon, or during a financial crisis, or when you're both exhausted and one of you leaves the dishes in the sink for the third day in a row.

  If you treat marriage like a running bet—where you re-evaluate the terms every time you hit a rough patch—you aren't building a marriage. You're just managing risk. And [Partner], you deserve more than a risk manager.

  You deserve someone who made a promise when he was happy, and keeps it when he's tired. Someone who understands that the promise isn't binding because the law says so, or because the family is watching. It's binding because he chose a policy of *us* before he knew exactly what the future would look like.

  [Groom], I've watched you circle back to this idea for years. We talked about it in text threads and late-night calls. But seeing you with [Partner], I see that you finally found the real-world application. You aren't marrying her because it's easy today. You're marrying her because you are committing to a version of yourself that stays, regardless of what the "new information" of life throws at you.

  To the rest of the family: You might hear "decision theory" and think that sounds cold. Calculated. Unromantic. But I promise you, there is nothing warmer than reliability. There is nothing more romantic than knowing that the person standing next to you has decided, in advance, that you are worth the hard days. That they have pre-committed to your happiness, even when their own patience is running low.

  [Groom], you always wanted to solve the equation. Well, you did. The solution isn't a formula. It's standing right there in the white dress.

  So, if everyone could please raise a glass.

  To [Groom] and [Partner]. May you never update on the downside. May you stick to the policy. And may you always remember that the best decision you ever made was the one you decided to keep, no matter what.

  To the happy couple!
