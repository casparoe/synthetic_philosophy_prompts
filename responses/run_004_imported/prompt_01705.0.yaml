      *   **Core Distinction 1: The Understanding Objection (Epistemic):** Focus on *why* vs. *that*. In science, knowing *that* gravity exists is useful. In morality, knowing *why* lying is wrong seems essential for the knowledge to count as moral understanding.
      *   **Core Distinction 2: Moral Motivation (Internalism):** Moral judgments are supposed to motivate action. Testimonial belief might lack the "oomph" to drive action.
      *   **Core Distinction 3: Autonomy and Virtue:** Moral worth comes from grappling with reasons yourself. Deferring undermines moral character.
