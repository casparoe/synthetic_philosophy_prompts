answer: |-
  The phenomenon you are describing is known in contemporary meta-ethics as **"Moral Testimony Pessimism."** While "optimists" argue that moral testimony can generate knowledge just like scientific testimony, "pessimists" argue that there is something distinctively defective about forming moral beliefs solely on the basis of testimony.

  The central philosophical puzzle is this: If I can trust a physicist about black holes without knowing general relativity, why can't I trust a moral sage about the wrongness of lying without knowing the underlying ethical reasoning?

  Philosophers who argue that moral testimony is epistemically problematic generally point to four key distinctions between moral facts and other domains (like science or history).

  ### 1. The Distinction Between Knowledge and Understanding
  The most prominent epistemic objection comes from philosopher **Alison Hills**. She argues that in domains like science or history, **propositional knowledge** (knowing *that* something is the case) is sufficient. If a physicist tells you the universe is expanding, you know that fact, even if you don't understand the math behind Hubble's Law.

  However, Hills argues that in morality, **moral understanding** (knowing *why* something is the case) is required for the belief to count as genuine moral knowledge.
  *   **Science:** You can defer to expertise because the goal is accurate information.
  *   **Morality:** The goal is moral competence. If you believe "eating meat is wrong" only because a friend told you so, you lack the ability to weigh reasons, handle counter-examples, or explain the judgment to others.
  *   **Epistemic Distinction:** Moral facts are reason-dependent in a way that brute scientific facts are not. To truly "know" a moral fact, you must grasp the *reasons* that make it true. Testimony transmits the conclusion, but rarely the reasoning process, leaving the recipient with a "hollow" belief.

  ### 2. The Motivation Internalism Objection
  Many meta-ethicists hold a view called **Motivation Internalism**. This is the idea that there is a necessary connection between making a moral judgment and being motivated to act on it. If you genuinely believe "stealing is wrong," you should have at least *some* motivation not to steal.

  *   **Science:** Believing a scientific fact (e.g., "this wire conducts electricity") does not inherently motivate action. You need a separate desire (e.g., "I don't want to get shocked") to act.
  *   **Morality:** Moral beliefs are supposed to be intrinsically motivating.
  *   **The Problem:** Testimonial beliefs often lack "motivational oomph." If I believe X is wrong *only* because an expert said so, my motivation is contingent on my trust in the expert, not on the moral fact itself. If I lose trust in the expert, my motivation to be moral vanishes. Pessimists argue this suggests testimonial moral beliefs are not genuine moral states.

  ### 3. The Autonomy and Virtue Objection
  This objection focuses on the nature of the moral agent rather than the fact itself. It suggests that part of what constitutes moral knowledge is the **autonomous exercise of moral faculties.**

  *   **Expertise:** In medicine, deference is a virtue. It is rational to defer to a surgeon.
  *   **Morality:** In morality, deference can be a vice. Kantian philosophers argue that moral worth comes from acting on reasons you have legislated for yourself.
  *   **Epistemic Distinction:** In science, the truth is independent of the knower. In morality, the *relationship* between the knower and the truth matters. If you outsource your moral judgment, you are failing to engage in the moral practice. Therefore, even if the belief is true, the *way* you acquired it prevents it from functioning as moral knowledge within a life well-lived.

  ### 4. The Phenomenology of Access (Sentiment vs. Observation)
  Finally, there is a dispute about how we access these facts.
  *   **Science/History:** We access these facts through empirical observation, measurement, or record-keeping. These are third-person accessible. One person can observe a datum and tell another, and the second person receives the same "data."
  *   **Morality:** Many philosophers (particularly Sentimentalists or Intuitionists) argue we access moral facts through **emotional responses** or **rational intuition**.
  *   **The Problem:** You cannot testify someone into an emotional response. I can tell you "this puppy kicking made me feel horrified," but I cannot transmit the horror itself. If moral facts are tied to specific human responses (e.g., "Wrongness is the disposition to evoke revulsion under ideal conditions"), testimony fails because it cannot transmit the requisite phenomenological state needed to grasp the fact.

  ### Summary: The Epistemic Difference
  To summarize the pessimist's view, the epistemic distinction lies in the **normative role** of the belief:

  | Domain | Goal of Belief | Role of Testimony | Requirement for Knowledge |
  | :--- | :--- | :--- | :--- |
  | **Science/History** | Accurate representation of the world. | Highly reliable. Efficient division of cognitive labor. | **Knowledge That:** True belief + justification. |
  | **Morality** | Guidance of action + Moral Character. | Problematic. Undermines agency and understanding. | **Moral Understanding:** Grasping reasons + Motivation. |

  ### The Optimist Counter-Reply
  It is worth noting that "Optimists" (like Sarah McGrath or Elizabeth Fricker) push back. They argue:
  1.  **Child-rearing:** Children learn morality almost entirely through testimony ("Don't hit your sister"). If testimony couldn't convey moral knowledge, children would be moral blank slates until adulthood.
  2.  **Oppression:** Sometimes testimony is the *only* way to know moral truths. If a marginalized group tells a privileged person "this microaggression is harmful," demanding that the privileged person "work it out for themselves" (to gain understanding) is epistemically arrogant. In these cases, testimony is not just reliable; it is morally required.

  ### Conclusion
  The distinction is not necessarily that moral facts are "less real" than scientific facts. Rather, the distinction is that **moral knowledge is arguably a skill or a state of character**, whereas scientific knowledge is often a state of information. You can be mailed information; you cannot be mailed a skill. If morality is more like a skill (requiring understanding, motivation, and autonomy), then testimony—which transmits information but not skills—will inevitably fall short.
