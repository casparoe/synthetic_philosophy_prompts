      *   *Nature of understanding:* Do we need to understand *why* something is wrong, not just *that* it is wrong? (The "Understanding Objection").
      *   *Nature of agency/action:* Does moral knowledge require motivation? (Internalism). If I just believe you, am I motivated?
      *   *Nature of autonomy:* Is making up my own mind part of moral virtue? (Kantian autonomy).
