      *   *Is the problem real?* Yes, the "pessimism about moral testimony" is a well-known debate in meta-ethics (Hopkins, Hills, McGrath, etc.).
      *   *What is the core issue?* It's not necessarily that moral testimony *never* works, but that there's something distinctively unsatisfying or epistemically deficient about relying on it compared to scientific or historical testimony.

  3.  **Brainstorming Key Distinctions (Why is morality different?):**
