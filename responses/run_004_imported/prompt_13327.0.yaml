  My friend Priya's marrying her partner Dan next month and I got roped into giving the best-friend toast (I'm the one in the friend group who reads way too many rationalist blogs and forums). Thing is, they've been together 7 years and living together for 5, and when they announced the engagement half the reactions from both families were "wait, weren't you already basically married?" -- everyone already fully believed these two were in it for life. So what does the actual ceremony change? I want the toast to turn on the gap between that being mutual belief (even mutual belief that everyone believes it) and it becoming real common knowledge -- maybe with a nod to the blue-eyed islanders puzzle for the nerds in the room -- and it can't lean on the usual "and then everything changed" toast cliche, since that's just false here, but it also can't come out as "eh, it's just a formality," since that's false too -- something real does happen. Half the room is my meetup crowd who'll catch every reference, the other half is Dan's very normal extended family -- can you write me something like a 4 minute toast that actually pulls this off and lands as a real toast, not a logic lecture?
