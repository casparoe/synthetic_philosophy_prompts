answer: |-
  You are not overthinking this. What you are describing is a textbook example of **outcome bias**, and your discomfort is a sign of strong scientific integrity.

  To answer your core question directly: **No, there is no principled methodological reason to judge her process harder than yours.** If the decision-making process, the rationale, and the risks taken were identical, the evaluation of *competence* and *trustworthiness* should be identical.

  However, there is a sociological reason why the field is reacting this way, and understanding it might help you navigate your guilt and your friend's situation.

  ### 1. The Verdict is on the Truth, Not the Process
  In an ideal scientific world, we would evaluate researchers based on the rigor of their methods and the transparency of their decision-making. If two researchers take the same risk, they should receive the same credit or blame regardless of the result.

  But science is not ideal. Science is a truth-seeking enterprise that operates on trust.
  *   **Your outcome:** Validated the trust. The field invested time reading and citing you, and that investment paid off.
  *   **Her outcome:** Violated the trust. The field invested time trying to build on her work, and that investment was wasted.

  Because the cost of a false positive in social psychology (post-replication crisis) is perceived as extremely high, the field punishes the *production of false positives* severely. Unfortunately, because we cannot see into the researcher's mind at the time of the decision, colleagues use the **truth of the finding as a proxy for the integrity of the process.** Since her finding was false, they assume the process must have been flawed (e.g., p-hacking), even though you know it wasn't.

  ### 2. The "Replication Crisis" Trauma
  Social psychology is the epicenter of the replication crisis. The field is currently hypersensitive to false positives.
  *   When a study fails to replicate, the immediate heuristic many researchers use is: *"Something was wrong with the methods or the analysis."*
  *   It is cognitively easier for the field to label her "methodologically unsound" than to accept that **two researchers followed the same risky heuristic, and luck determined who looked like a genius and who looked like a fraud.**

  Admitting that your success involved a significant element of luck undermines the narrative of meritocracy that academia relies on. It is more comforting for the field to believe you succeeded because you are "better" and she failed because she was "sloppy."

  ### 3. Your Guilt is "Survivor's Guilt"
  You feel like you "got away with something" because, in a methodological sense, you did. You took a risk that is now frowned upon (skipping a direct replication before submission), and the universe happened to be on your side.

  This guilt is actually a good thing. It means you understand that **scientific success is partly stochastic.** Many researchers convince themselves that their published papers are true solely because of their brilliance, ignoring the role of chance. Your awareness of the role luck played makes you a more humble and likely more rigorous scientist in the long run.

  ### 4. Is there *any* principled distinction?
  To play devil's advocate, is there any reason the field *might* be justified?
  *   **Calibration:** One could argue that a researcher's "intuition" about which effects are real is part of their skill. If she bet on a noise effect, perhaps her theoretical calibration is off. However, this is a judgment of *theoretical insight*, not *methodological trustworthiness*. Accusing her of p-hacking is a judgment of integrity, which is unwarranted if your account is accurate.
  *   **Hidden Variables:** It is possible (though you say it wasn't the case) that there were subtle differences. Did she peek at the data more times? Did she drop different outliers? Often, when a finding is noise, it turns out there were "garden of forking paths" issues that weren't present in the genuine study. But unless those specific decisions are known, assuming they happened is unfair.

  ### 5. How to Handle This
  You are in a difficult position. You cannot fix her reputation without potentially damaging your own, but you can manage your own conduct.

  *   **Do not publicly confess "luck":** While honest, going around saying "My study was just as risky, I got lucky" may inadvertently undermine confidence in your own work without actually helping your friend. People want certainty.
  *   **Privately acknowledge the risk:** Let this experience inform your future work. If you feel that skipping replication was risky, commit to higher standards in your future projects (preregistration, larger samples, planned replications).
  *   **Support your friend:** This is the most important part. She is likely feeling isolated and impostor syndrome on steroids. You are perhaps the only person who knows that her *decision* was not uniquely reckless. Validate her experience. Remind her that false positives happen to good scientists, especially in noisy fields.
  *   **Advocate for Process over Outcome:** In your own peer reviews and departmental discussions, try to gently steer conversations toward evaluating *methods* rather than *results*. When you see others taking similar risks, advocate for replication without shaming them.

  ### Summary
  You are right to feel that the judgment is unfair. It is outcome bias fueled by a field that is traumatized by irreproducibility. You didn't do anything unethical, but you did take a gamble that paid off.

  The most ethical thing you can do now is to let that guilt transform into rigor. Don't let the field's unfair treatment of your friend make you cynical; let it make you committed to a culture where process is valued over lucky outcomes. And be a good friend to her; she needs one right now more than she needs a methodological critique.
