      *   **Outcome:** User's effect was genuine (held up). Friend's effect was noise (failed to replicate by others).
      *   **Consequence:** Friend is now stigmatized (seen as untrustworthy, accused of p-hacking). User is celebrated (cited as solid).
      *   **User's Feeling:** Guilty ("got away with something"), questioning the fairness/principled basis of the differential judgment.
      *   **Core Question:** Is there a principled reason for the different judgments, or is it just outcome bias?

  2.  **Initial Assessment & Ethical/Methodological Evaluation:**
      *   *The Decision:* Skipping an independent replication before submission is risky but not inherently unethical *if* transparent. However, in the current climate of social psychology (post-replication crisis), it is viewed as methodologically weak.
      *   *The Outcome:* One worked, one didn't.
      *   *The Judgment:* The field is judging based on the *truth of the finding*, not the *process*.
      *   *The Verdict:* This is a classic case of **Outcome Bias** (or Hindsight Bias). The process was identical. The judgment should theoretically be on the process, but science often judges on the truth of the claim.

  3.  **Deconstruct the "Principled Reason" vs. "Outcome Bias":**
      *   *Argument for Principled Reason:* Science cares about truth. If a finding is false, it wastes resources. Therefore, the person who published a false finding is more "dangerous" to the field.
      *   *Argument against Principled Reason (The User's intuition):* The *decision-making process* was identical. Judging competence/trustworthiness based on luck (whether the effect was real) is unfair. It discourages risk-taking and punishes bad luck rather than bad practice.
      *   *Nuance:* There might be subtle differences we don't know (e.g., did the friend p-hack *to get* the initial finding? The user says "noise in her original data," implying a false positive). But assuming the user's account is accurate (identical call, identical reasons), the judgment is largely outcome-based.

  4.  **Identify Key Psychological/Scientific Concepts:**
      *   **Outcome Bias:** Evaluating a decision based on the result rather than the quality of the decision at the time.
      *   **Hindsight Bias:** "I knew it all along" (now that we know it's false, it looks like p-hacking).
      *   **The Replication Crisis:** Social psych is hyper-sensitive to false positives. Trust is currency.
