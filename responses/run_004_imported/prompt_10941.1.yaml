answer: |-
  The GPS screen glowed, a blank white eye in the concrete dark. Mark tapped the dashboard. "Just type it."

  "I can't."

  "You don't know our address?" Elena hugged her coat tighter, the cold seeping through the leather. "It's not that I don't *know* it. It's that the knowing happens outside. The phone was the storage substrate. Clark and Chalmers, Mark. Otto's notebook. If the function is identical, the location doesn't matter."

  "That's the coupling-constitution fallacy." Mark's voice echoed off the pillars. "You're coupled to the device, not constituted by it. If I hold a hammer, I'm not a carpenter-god. The phone is a tool. You used it, now it's dead. That's equipment failure, not amnesia."

  "Why is the skin barrier metaphysically magic? I offloaded the encoding because it was efficient. The retrieval was automatic. I trusted it implicitly. That meets the parity principle. It was as reliable as biological recall until the lithium died."

  "Reliable? You had to swipe, unlock, tap. That's interaction. Biological memory is direct access. And think about content. The numbers on that screen are derived. They mean nothing without an interpreter. Your neural states have non-derived content. They *are* the meaning."

  "So because I need a retina to read the screen, it's not mind? I need neurotransmitters to read my neurons. It's all causal chains. The phone isn't 'meaningless' any more than a synapse is meaningful on its own."

  "It's about boundaries, El. If the phone is your mind, where does it stop? Is the cloud part of you? Is Google? If I email you a fact, does it become your memory the second it hits the server? That's cognitive bloat. You dissolve the agent until there's no one left to be responsible."

  "I'm not dissolving anything. I'm acknowledging where the thinking actually happens. We aren't skulls in vats. We're embedded."

  "We're embedded in a parking garage at 2 AM because you think your Samsung is your hippocampus."

  "I think the system is the mind. And the system failed."

  "Then fix the system. Remember the street name."

  "I can't. The path is broken."

  Mark sighed, rubbing his face with both hands. "Okay. Fine. Extended cognition. But if the mind is distributed, why am I the only one who can drive it?"

  "Because you have the keys. And the charge."

  "Then the vehicle is part of the mind too?"

  "Don't start."

  "I'm just saying. If we're bloat, we're stuck bloat." He killed the engine. The silence rushed back in, heavier than before. "Look, I get it. You feel lobotomized. But coupling isn't identity. You're still in there. Dig."

  Elena stared at the dark rectangle in her hand. "It's hard to dig when you know the shovel is right there, and it's gone."

  "Then use me. I'm coupled to you. Married to you. Is that part of the mind?"

  "Tonight?" She looked at him, eyes wet in the dashboard glow. "Tonight you're the whole damn cortex."

  Mark put the car in reverse. "Okay. I can work with that. Hold on."
