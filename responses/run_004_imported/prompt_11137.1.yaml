prompt: |-
  I'm putting together questions for a podcast episode where my guest is a Kierkegaard scholar who just published a book arguing that his material on "the public" and the press in Two Ages — the part that usually gets excerpted on its own as "The Present Age" — basically predicted Twitter and Facebook. I read the text for a seminar a while back and I actually buy a good chunk of the argument, but I dont want the episode to turn into forty minutes of "wow, isn't it crazy he called this in 1846." I want to push on how the argument actually works and where it might not hold up.

  Specifically, I want at least one question that makes her walk through the actual mechanics of "leveling" and explain why Kierkegaard treats "the public" as basically a phantom with no concrete responsibility, rather than just a fancier word for public opinion in general. I also want one on the Corsair affair — it seems way too convenient that the one time in his life he personally got worked over by an anonymous satirical paper is also right around when he's finishing the manuscript that theorizes exactly that phenomenon, so I want her pinned down on how much of the theory is downstream of that experience versus already fully formed before Corsaren ever went after him. Throw in one on the fact that he spent his whole career hiding behind a rotating cast of pseudonyms while attacking the press for its facelessness — I assume there's a real distinction he'd want drawn there and not just special pleading, so make her spell it out. And I want at least one question that puts to her the charge that "the age of revolution had passion and the present age doesn't" is just aristocratic nostalgia dressed up as social theory, since that's basically what every generation says about the next one.

  Can you give me something like 8 to 10 questions, roughly ordered so each builds on the last, and after each one add a short note on the answer she'll probably give and how I should follow up on it?
