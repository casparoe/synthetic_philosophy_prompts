prompt: |-
  So I'm a PhD student in philosophy (phil of mind, mostly), and this semester I've been auditing a theory of computation course just to shore up my formal background, since so much computational-mind literature leans on the Church-Turing thesis without ever really unpacking it. We just got through the part where you show that Turing machines, Church's lambda calculus, and Gödel's general recursive functions all pick out exactly the same class of functions, even though Turing, Church, and Gödel arrived at them pretty independently (Kleene did a lot of the actual legwork proving the equivalences), and honestly it finally clicked for me why everyone treats the thesis as settled at this point -- if three totally different formalisms, built on totally different intuitions, all converge on the same answer, that seems like about as strong a proof as you're gonna get for something like this.

  Then my professor tossed off this comment that the thesis "isn't provable, even in principle, and never will be," like it was common knowledge, and it kind of threw me. I get that its called a "thesis" and not a "theorem," but if independent convergence between Turing, Church, and Gödel doesn't count as a proof, I honestly don't know what would. Can you help me figure out whether she's right, and if so, what's actually wrong with the convergence argument? And relatedly -- if the thesis really is unprovable in principle, what does that mean for all the philosophy of mind and cognitive science arguments (Putnam, Fodor, etc.) that just build the thesis in as a premise? Feels like there should be some middle ground between "basically proven" and "just an assumption we all happen to like."
