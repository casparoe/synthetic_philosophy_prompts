answer: |-
  **Setting:** *Alice's sunroom. A potted fiddle-leaf fig sits on a pedestal, its leaves brown and crisp. BARRY stands looking guilty. ELENA and MARCUS stand over the plant, notebooks in hand.*

  **Marcus:** Look at it. Really look at it. What killed this?

  **Elena:** Thirst. Specifically, Barry's failure to water it.

  **Marcus:** No. Thirst is a state, not an event. And Barry's failure is a *non-event*. Nothing killed this plant. The water failed to arrive. The sun evaporated what remained. The cellulose degraded. But Barry? Barry went to the cinema. He did something, certainly, but he didn't do *this*.

  **Elena:** You're clinging to a Humean intuition that causation requires a transfer of energy or a physical process. But we've moved past that. The counterfactual dependence is clear. If Barry had watered the plant, it would be alive. If he hadn't promised to water it, Alice would have hired a service, and it would be alive. His omission is the difference-maker.

  **Marcus:** Difference-making isn't causation. If I say, "If the Queen of England hadn't failed to water this plant, it would still be dead," the counterfactual holds. She didn't water it. If she had, it would live. So, on your view, is the Queen a cause of the death?

  **Elena:** Don't start with the Queen. It's the stock example for a reason.

  **Marcus:** It's the *reductio*. If you say omissions are causes, you have to accept profligacy. Every person on earth who didn't water this plant is a cause of its death. The causal net swallows the planet. To avoid that, you have to prune the tree. And I know exactly where you're going to reach for the shears.

  **Elena:** Fine. I'll cut. We distinguish between *background conditions* and *causes*. The Queen's non-watering is a background condition. Barry's non-watering is a cause.

  **Marcus:** On what basis? Physically, their relationship to the plant is identical. Zero water from the Queen, zero water from Barry. Two zeros make a zero. To say one zero is causal and the other isn't, you have to import a norm. You have to say Barry *ought* to have watered it.

  **Elena:** I don't have to import a moral norm. I import a *default* norm. Causal selection is context-sensitive, like figure-ground perception in vision. In this context, the system is "Alice's household maintenance." In that system, the default state is "Barry waters." The deviation from the default is the figure; the rest is ground. The Queen isn't in the system. Her non-action isn't a deviation; it's the status quo.

  **Marcus:** There it is. "Deviation." "Default." "System." You're dressing up ethics in metaphysical clothing. Why is the default that Barry waters? Because he promised. That's a moral obligation. You're defining cause as "the thing we blame." You've collapsed the is-ought distinction. You're saying metaphysics tracks our grievances, not the structure of reality.

  **Elena:** I'm saying metaphysics tracks *explanation*, and explanation is inherently pragmatic. Reality doesn't come labeled with "cause" tags. We carve reality at its joints to answer "Why?" questions. If I ask, "Why did the plant die?" listing the Queen is uninformative. It's not just morally uninformative; it's cognitively useless. It violates the Gricean maxims of conversation.

  **Marcus:** But you're writing a textbook on *Causation*, not *Conversation*. If I punch you in the face, there is a physical process linking my fist to your nose. If I withhold your insulin, there is... nothing. A gap. If you claim the gap is a cause, you are claiming that nothing is something. You're ontologically profligate to avoid being pragmatically profligate.

  **Elena:** And if you deny it, you break the law. Negligence law rests on the idea that omitting a duty can be the *cause* of harm. If you tell a judge, "Marcus says omissions aren't causes, they're just opportunities for physical processes to run their course," you undermine the basis of liability.

  **Marcus:** I don't undermine liability. I refine it. We can blame Barry. We can punish Barry. We can say he is *responsible*. But we should be precise: he is responsible because he violated a norm, not because his inaction was a force. We treat omissions *as if* they were causes for legal purposes. It's a useful fiction. Why do you need the fiction to be literally true?

  **Elena:** Because it's not a fiction. Consider the Singer case you rationalists love. If I walk past a shallow pond and let a child drown to save my shoes, am I a killer?

  **Marcus:** Morally? Perhaps. Metaphysically? No. The water drowned the child. You failed to interrupt the process.

  **Elena:** That distinction does no work. If I push the child in, I'm a cause. If I watch him sink, I'm not? The outcome is identical. The counterfactual dependence is identical. The only difference is your fetish for physical processes. If metaphysics tells me that the man who lets the child die is metaphysically innocent of the death, while the man who pushes him is guilty, then your metaphysics is out of touch with the reality of agency.

  **Marcus:** Agency isn't causation. That's the category error. You're conflating *moral equivalence* with *causal identity*. Singer wants to say you are equally *blameworthy*. I might even agree. But blameworthiness doesn't require causal parity. It requires a violation of duty. By insisting the omission is a *cause*, you're trying to ground the blame in the physics of the universe. You want the universe to care that Barry promised. The universe doesn't care.

  **Elena:** The universe doesn't care, but *causal models* do. Look, let's talk about your "useful fiction." If omissions aren't causes, then in the case of the plant, there is *no cause* of death.

  **Marcus:** There are causes. Evaporation. Cellular collapse.

  **Elena:** Those are mechanisms. What is the *cause*? If I'm an insurance adjuster, and I ask "What caused the loss?" and you say "Evaporation," I say "Evaporation happens every day. Why did it kill this one?" You say "Because Barry didn't water." If you tell me "Barry didn't cause it, he just failed to prevent the evaporation," you've broken the chain. You're forcing us to speak in a way that obscures the locus of control.

  **Marcus:** I'm forcing us to speak accurately. The locus of control is normative, not causal. Here is the weak point in your view, Elena. You say you use "defaults" to solve the Queen of England problem. But defaults are unstable. Suppose Barry is a bachelor who hates plants, and Alice knows it, but she asks him anyway. Is it still the default that he waters? Or suppose the Queen had publicly announced, "I will water any plant in London that Barry neglects." Suddenly, her omission *is* a deviation. Does her metaphysical causal status change based on a press release?

  **Elena:** Yes. Because the causal structure of the situation *did* change. If the Queen announces she's the backup, she enters the system. Her omission becomes salient.

  **Marcus:** So causation is volatile. It flickers on and off based on announcements and expectations? That makes causation mind-dependent.

  **Elena:** Causal *attribution* is mind-dependent. Causation itself is a relation between events relative to a model. You can't have a model without selecting variables. Selection requires criteria. Those criteria are often normative. So what? Why is it a bug that our metaphysics of causation reflects the fact that we are agents living in a normative space?

  **Marcus:** Because it makes causation incapable of doing the work you want it to do. You want causation to be the bedrock of responsibility. But if causation depends on responsibility (via norms/defaults), your argument is circular. You're saying Barry caused the death because he's responsible, and he's responsible because he caused the death.

  **Elena:** It's not circular; it's coherentist. We reflectively equilibrate our causal judgments with our normative ones. But let's turn the screw on your "process" view. You say only physical processes count. What about prevention? I catch a ball before it breaks a window. Did I cause the window to remain intact?

  **Marcus:** You prevented the breakage. You didn't cause the integrity. The integrity is the default.

  **Elena:** Exactly. You use defaults too! You're just pretending you don't. You call it "physical process" when it suits you, but when I intercept a bullet, you admit I'm causally relevant. Why? Because I intervened. Intervention is a normative concept in causal modeling.

  **Marcus:** Intervention is physical. You exerted force on the ball.

  **Elena:** And Barry exerted force on... his own feet? He walked to the cinema. He acted. His action was incompatible with watering. His action caused the plant's death by excluding the water.

  **Marcus:** Now you're shifting. First, the *omission* was the cause. Now the *action of going to the cinema* is the cause. Which is it?

  **Elena:** They're two descriptions of the same event. The event is "Barry's Saturday." Described as "going to the cinema," it's an action. Described as "not watering," it's an omission. Both are causally relevant.

  **Marcus:** But "not watering" isn't an event. It's the absence of an event. You can't have a metaphysics where absences push things around. If I accept your view, I have to accept that the absence of a hurricane caused the crop to grow. The absence of a meteor strike caused this conversation to continue.

  **Elena:** Only if those absences are salient deviations from the default in the relevant model. In an agricultural model, the absence of a hurricane is background. In a meteorological model, it might be a cause. You're terrified of context-sensitivity because you want causation to be a God's-eye view relation. But we aren't God. We're humans standing over a dead plant trying to figure out who pays for it.

  **Marcus:** And if we figure out who pays for it by lying about the physics, we lose the ability to distinguish between bad luck and bad agency. If I fail to save a drowning child because I can't swim, and you fail because you won't swim, the counterfactual is the same. The child dies in both worlds. On your view, are we both causes?

  **Elena:** No. Because in your case, "not swimming" isn't a deviation from the default. You *can't*. It's not in your capability set. It's not a valid variable in the model of your agency.

  **Marcus:** See? "Capability." "Agency." "Default." You've built a moral tribunal into the definition of cause. I prefer to keep the tribunal separate. Let metaphysics be the physics of connection. Let ethics be the judgment of the agent. If we mix them, we get exactly what we see in those blogs you read: people convinced that because they bought coffee instead of donating to malaria nets, they *murdered* a child.

  **Elena:** And what do they get from you? That they didn't murder anyone. They just... let them die. And since "letting die" isn't causation, the metaphysical link is severed. It gives them an ontological escape hatch. "I didn't cause the death, I just failed to prevent it." It sounds like a distinction without a difference, but on your view, it's a distinction between *force* and *nothing*.

  **Marcus:** It's a distinction between *doing* and *allowing*. And it matters. If I cause a death, I am the author of the end. If I allow a death, I am a witness who looked away. The moral weight might be similar in extreme cases, but the metaphysical structure is distinct. To conflate them is to lose the concept of authorship.

  **Elena:** Authorship is a narrative concept. Causation is...

  **Marcus:** ...Physical.

  **Elena:** ...Structural. And the structure of human life includes absences. If you pull the plug on a ventilator, you kill the patient. If you never plug it in, you let them die. The physics is identical in the end state. The difference is entirely normative. If your metaphysics can't accommodate the plug-pulling case as a cause, your metaphysics is too small for the world we live in.

  **Marcus:** If I pull the plug, I initiate a process of suffocation. That is a cause. If I never plug it in, the underlying pathology kills the patient. I am not the cause. I am the enabler of the pathology.

  **Elena:** And if I promise to plug it in, and walk away?

  **Marcus:** Then you are a villain. But not a killer.

  **Elena:** *points to the plant* Alice will tell you Barry killed her plant.

  **Marcus:** Alice is speaking loosely. She means Barry is responsible for the loss.

  **Elena:** She means the water didn't get there *because of Barry*. That "because" is causal. If you tell her, "Actually, Barry didn't cause this, the evaporation did, Barry just didn't stop it," you aren't being precise. You're being pedantic. You're prioritizing a Humean intuition about billiard balls over the reality of human interaction.

  **Marcus:** And if I tell her, "Barry's nothing pushed the plant into death," I'm being honest. I'd rather be a pedant than a mystic. I'd rather say Barry is fully to blame for a death he didn't cause than say he caused a death he only allowed.

  **Elena:** Then your "blame" is floating free of reality. You've got responsibility hanging in the air, unmoored from causation.

  **Marcus:** No. Moored to *duty*. That's the anchor. You want to moor it to *force*. I say there was no force. Just a promise broken.

  **Elena:** A broken promise that left the plant to the sun.

  **Marcus:** The sun did the work. Barry just didn't do the counter-work.

  **Elena:** *sighs* We're going to be here all day.

  **Marcus:** Likely. The plant isn't going anywhere.

  **Elena:** No. It's dead. And whatever we call the reason, Barry is the one buying Alice a new one.

  **Marcus:** Agreed. Though technically, he's just preventing her from remaining without a plant.

  **Elena:** *glares* Don't start.

  **Marcus:** *smiles faintly* I'm just describing the process.
