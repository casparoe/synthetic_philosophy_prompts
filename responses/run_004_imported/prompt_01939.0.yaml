      *   **Round 4: The Legal/Moral Bullet.**
          *   Elena: The law requires *causa sine qua non*. If you deny omission causation, you undermine negligence law's metaphysical basis.
          *   Marcus: The law is pragmatic. It doesn't need true metaphysics; it needs useful fictions.
          *   Elena: So you're saying the law is built on a category error?
