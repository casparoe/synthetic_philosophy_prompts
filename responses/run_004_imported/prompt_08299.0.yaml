answer: |-
  The question you face is not merely academic; it is a crisis of kinship. You are asking whether the uniform your cousin wears erases the moral distinction between the man who defends his home and the man who, however reluctantly, occupies it. This is the heart of the debate over the Moral Equality of Combatants (MEC).

  To answer you, we must strip away the legal conventions that govern armies and look at the underlying morality of killing. We must weigh the Traditionalist view, best articulated by Michael Walzer, against the Revisionist challenge, led by Jeff McMahan. I will lay out the strongest version of each, apply them to your cousin's specific situation as a reluctant 2022 conscript, and then offer a verdict. I will not hide behind neutrality. The stakes for your cousin, and for the people shooting at him, are too high for equivocation.

  ### The Traditionalist Case: The Logic of the Uniform

  The Traditionalist position rests on the **Independence Thesis**. This is the claim that *jus in bello* (the justice of conduct in war) is separate from *jus ad bellum* (the justice of the war itself). According to this view, a soldier's moral status is determined by how they fight, not why they fight. So long as your cousin observes the rules of engagement—does not target civilians, treats prisoners humanely—he is the moral equal of the Ukrainian soldier shooting at him. Both have an equal right to kill; both have an equal liability to be killed.

  Walzer offers two powerful arguments for this, one epistemic and one conventionalist.

  The **epistemic argument** suggests that individual soldiers are not competent judges of national policy. In the fog of war, surrounded by state propaganda and lacking access to intelligence, a conscript cannot reliably determine if his war is just. To demand that he assess the *jus ad bellum* before firing is to demand an impossibility. Therefore, we must treat him as if he is innocent, provided he follows the rules of war.

  The **conventionalist argument** is pragmatic. Walzer argues that if we deny moral equality, we create a dangerous incentive structure. If soldiers on the "unjust" side know they are morally culpable murderers regardless of their conduct, they have no reason to follow the laws of war. They might as well target civilians or use prohibited weapons. By granting them moral equality, we give them a reason to fight cleanly. We trade moral precision for the mitigation of horror.

  **Applied to your cousin:** Under this view, your cousin is a moral innocent. He is a tool of the state, coerced by conscription. His reluctance confirms his lack of malicious intent. If he kills a Ukrainian soldier, it is a tragic act of war, permissible under the rules. If a Ukrainian kills him, it is also permissible. There is symmetry. The Ukrainian is not defending a right against a wrong; he is simply engaging an enemy combatant. Your cousin's hands are clean so long as they hold a weapon legally.

  ### The Revisionist Case: The Logic of the Threat

  The Revisionist position rejects the Independence Thesis. It argues that morality cannot be bifurcated this way. Jeff McMahan grounds his argument in the ethics of self-defense. In ordinary life, if someone attacks you, you have the right to stop them. That right does not vanish because the attacker is wearing a uniform or claims to be following orders. Conversely, an attacker does not gain the right to kill you simply because they are part of an organization.

  For Revisionists, liability to be killed tracks **objective justice**. A combatant is liable to defensive harm only if they pose an *unjust threat*.

  This leads to the **Asymmetry Claim**: Ukrainian soldiers, fighting a defensive war of aggression, have the right to kill Russian soldiers. Russian soldiers, fighting an aggressive war, do not have the right to kill Ukrainian soldiers, even if they follow all rules of engagement. The Ukrainian kills in self-defense; the Russian kills in aggression.

  The hardest pill to swallow here is the fate of the reluctant conscript. If the Russian soldier is liable to be killed, does that mean he is a murderer? This is where Revisionists deploy the crucial distinction between **liability and culpability**.

  *   **Culpability** is about blameworthiness. It requires knowledge and free choice. Your cousin, terrified and coerced, may have very low culpability. He is not a villain.
  *   **Liability** is about the forfeiture of rights. One can be liable to defensive harm without being culpable. McMahan uses the example of a "human shield" or someone thrown off a building toward you. The person falling is not *culpable* (they didn't choose to fall), but they are *liable* to be stopped (even lethally) because they pose an unjust threat to your life.

  **Applied to your cousin:** Under this view, your cousin is an **unjust threat**. Because the war itself is unjust (a war of aggression), his participation makes him a vector of that injustice. He has forfeited his right not to be killed because his actions threaten the lives of those who have done nothing to deserve it. However, because he is conscripted and reluctant, he is not necessarily *culpable*. He is a tragic figure, but he is not the moral equal of the Ukrainian. The Ukrainian holds the right of self-defense; your cousin does not hold a right to attack.

  ### Weighing the Arguments

  Both positions have weight. Walzer's conventionalism is compelling as a guide for *international law*. We likely need the laws of war to treat combatants equally to prevent total barbarism. If we tell soldiers they are criminals by default, they may commit more atrocities.

  However, you asked for the *moral* truth, not the best legal policy. On the level of individual morality, the Traditionalist view collapses under scrutiny. It asks us to believe that a uniform acts as a moral magic wand, transforming an act of aggression into an act of equality. It implies that if two men shoot at each other, and one is defending his children while the other is occupying his land, the moral value of those shots is identical. This contradicts our deepest intuitions about self-defense. If a mugger attacks you, you do not become his "moral equal" because he follows a "code of the street."

  The Revisionist view is harder to live with, but it is more honest. It acknowledges that there is a victim and an aggressor. It respects the Ukrainian's right to exist. It refuses to sanitize the reality that your cousin is part of a machine inflicting harm that should not be happening.

  Crucially, the Revisionist distinction between liability and culpability saves your cousin from being demonized while still acknowledging the asymmetry. It allows us to say: *He is not a monster, but he is dangerous, and he is on the wrong side.*

  ### The Verdict

  The Revisionist position has the better of the argument. The Traditionalist view relies on a fiction—that the *jus ad bellum* is unknowable or irrelevant to the individual shooter—that is increasingly untenable in conflicts where the aggression is as clear as it is in Ukraine. To grant moral equality here is to tell the Ukrainian that their defense is morally indistinguishable from the invasion. That is a moral cost too high to pay for the sake of theoretical symmetry.

  **What this implies for your cousin:**

  This conclusion is painful, but it must be plain. If the Revisionists are right, your cousin is not the moral equal of the Ukrainian soldier.

  1.  **Has he done something wrong?** Objectively, yes. By participating in an unjust war, he is contributing to an unjust harm. He is posing a threat that has no moral justification.
  2.  **Has he forfeited anything?** Yes. He has forfeited his right not to be killed. If a Ukrainian soldier kills him, that soldier is acting in permissible self-defense. The killing is not a tragedy of "two equals," but a defensive act against an unjust threat.
  3.  **Is there asymmetry?** Yes. If your cousin kills a Ukrainian, he is committing an act of aggression (though potentially excused by duress). If a Ukrainian kills your cousin, they are committing an act of defense. The normative weight is not the same.

  **How you should think about his hands:**

  You should not think of your cousin as a criminal. The Revisionist distinction saves him from *culpability*. He is a victim of his government, coerced by the threat of prison or death if he refuses mobilization. His moral agency is severely constrained. You can love him, mourn him, and view him as a victim of the Putin regime without denying that, in the moment of combat, he is the agent of an unjust threat.

  His hands are not "clean" in the Traditionalist sense—they are holding a weapon for an unjust cause. But they are not "evil" in the sense of malicious guilt. They are the hands of a man who has been placed in a position where his existence threatens others, through no fault of his own making, yet with lethal consequence.

  The tragedy of your cousin is not that he is a monster. It is that he has been made liable to be killed for a cause he does not believe in, by a state he cannot escape, against people who have done him no harm. The Revisionist view honors the Ukrainians' right to stop him, while the liability/culpability distinction honors your cousin's lack of choice. It is a colder comfort than Walzer's equality, but it is the truth: he is not their equal. He is their threat. And in war, threats are neutralized.
