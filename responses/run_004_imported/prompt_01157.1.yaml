answer: |-
  This is one of the most sophisticated and enduring objections to Rawls's *A Theory of Justice*. It is essentially the critique leveled by John Harsanyi, who argued that if you apply standard Bayesian decision theory to the Original Position, you arrive at average utilitarianism, not the Difference Principle. Harsanyi contended that Rawls's use of the maximin rule is irrational unless one assumes an extreme, arguably pathological, degree of risk aversion.

  If the argument were merely a piece of decision theory, you would be correct: the Difference Principle would look like expected utility maximization with a specific, idiosyncratic risk parameter. However, political philosophers continue to treat the Original Position as a genuine alternative to utilitarianism for several structural, moral, and technical reasons.

  Here is why the reduction of Rawls to "risk-averse utilitarianism" is generally rejected in contemporary political philosophy.

  ### 1. Maximin is not Expected Utility (Technical Distinction)
  Your premise suggests that maximin is simply expected utility (EU) maximization with a specific utility function (extreme risk aversion). Technically, this is incorrect within standard decision theory.

  *   **Probabilities:** EU maximization requires assigning probabilities to outcomes. Rawls explicitly argues that behind the Veil of Ignorance, parties **cannot** assign probabilities to their place in society. There is no objective basis for saying there is a 10% chance I will be in the bottom quintile versus a 20% chance. Without probabilities, the expected utility calculation is mathematically impossible.
  *   **Axioms:** Maximin violates the continuity and independence axioms of von Neumann-Morgenstern utility theory. It is a non-compensatory decision rule. In EU, a massive gain for the majority can compensate for a small loss for the minority. In maximin, no gain for the better-off can compensate for *any* loss for the worst-off.

  Therefore, Rawls is not proposing a different *variable* within the utilitarian calculus; he is proposing a different *calculus* entirely, justified by the lack of probabilistic knowledge.

  ### 2. The Distinction Between Persons (Moral Distinction)
  The deepest reason philosophers treat the Original Position as an alternative to utilitarianism is that Rawls views utilitarianism as fundamentally morally flawed, not just mathematically debatable.

  *   **Aggregation vs. Inviolability:** Utilitarianism extends the rational principle of choice for one individual (sacrifice a present pleasure for a greater future gain) to society as a whole (sacrifice the liberties of some for the greater welfare of others). Rawls argues this fails to take seriously the **distinction between persons**. Society is not a super-individual.
  *   **The Role of the OP:** The Original Position is not designed to solve a gambling problem; it is designed to model **fairness**. By placing parties behind a Veil of Ignorance, Rawls ensures that no one can tailor principles to their own advantage. The resulting agreement is not about maximizing the "good" (utility), but about establishing the "right" (fair terms of cooperation).
  *   **Inviolability:** The Difference Principle ensures that the basic structure of society does not treat the worst-off as mere means to the ends of the better-off. Even if a slave economy produced higher average utility, the Original Position would reject it because the worst-off position is intolerable. A risk-averse utilitarian calculation might still accept slavery if the "risk" of being a slave was low enough and the utility gain for masters was high enough. Rawls's framework rules this out structurally, not probabilistically.

  ### 3. The "Strains of Commitment"
  Rawls argues that the choice in the Original Position is not a one-off gamble, but a commitment to a lifelong social order. This introduces the concept of the **strains of commitment**.

  *   **Stability:** Parties must ask: "Can I actually stick to this agreement if I end up in the worst-off position?"
  *   **Utilitarian Failure:** If the parties chose utilitarianism, and I ended up in a position where my liberties were sacrificed for the greater good, I might not be able to psychologically or morally sustain my commitment to that society. It would generate resentment and instability.
  *   **Maximin Success:** The Difference Principle guarantees that even in the worst case, I am doing as well as possible. This makes the agreement stable. This is not about risk aversion as a psychological trait; it is about the **reasonableness** of the social contract. A contract that allows some to be crushed for the benefit of others is not a contract free people would agree to.

  ### 4. The Lexical Priority of Liberty
  Your critique focuses on the Difference Principle (the second principle of justice), but it overlooks the **First Principle** (Equal Basic Liberties).

  *   **Trading Liberty:** Standard utilitarian reasoning (even risk-averse) allows for the trading of liberty for economic welfare if the stakes are high enough.
  *   **Rawls's Barrier:** In the Original Position, the parties agree that basic liberties (speech, vote, conscience) cannot be traded for economic gain *at all*. This lexical priority is built into the deliberation before they even get to the Difference Principle.
  *   **Implication:** This structure prevents the "utilitarian calculation" from ever getting off the ground regarding fundamental rights. The parties are not maximizing a single metric of utility; they are prioritizing a hierarchy of goods where status and rights trump income.

  ### 5. Constructivism vs. Rational Intuitionism
  Finally, philosophers treat the Original Position as an alternative because it represents a shift in meta-ethical methodology.

  *   **Utilitarianism** often assumes there is an independent "good" (happiness, preference satisfaction) that we must maximize.
  *   **Rawlsian Constructivism** argues that principles of justice are not discovered but **constructed** by the agreement of free and equal persons.
  *   The Original Position is a "device of representation." It is not a literal description of a decision problem, but a way to model what it means to reason impartially. When philosophers analyze the OP, they are analyzing whether it successfully models fairness, not whether it accurately predicts the behavior of a rational gambler.

  ### 6. Rawls's Later Revisions
  It is worth noting that Rawls himself responded to the Harsanyi critique (and others) in his later work, *Political Liberalism*. He downplayed the decision-theoretic argument (maximin) and emphasized the **moral powers** of the citizens and the need for an **overlapping consensus**.

  He acknowledged that relying on the maximin rule made the argument vulnerable to the "risk-aversion" critique. In his later view, the principles of justice are chosen not because they are the safest bet in a gamble, but because they are the only principles compatible with the public status of citizens as free and equal. This moved the argument further away from decision theory and deeper into moral political philosophy.

  ### Summary
  Philosophers continue to treat the Original Position as a genuine alternative to utilitarianism because:
  1.  **Mathematically:** Maximin is distinct from Expected Utility (it rejects probability assignments).
  2.  **Morally:** It prioritizes the inviolability of persons over the aggregation of welfare.
  3.  **Politically:** It focuses on the stability of the social contract (strains of commitment) rather than the maximization of outcomes.
  4.  **Structurally:** The lexical priority of liberty prevents the trade-offs inherent in utilitarianism.

  While the decision-theoretic critique is valid if one views the Original Position strictly as a gambling scenario, Rawlsians argue that this misses the point: the Original Position is a model of **fairness**, not a model of **rational choice under risk**. The "risk aversion" is not a psychological quirk of the parties, but a rational reflection of the high stakes of basic justice and the requirement for social stability.
