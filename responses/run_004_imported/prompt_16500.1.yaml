answer: |-
  Here is a short opening quip designed to land with both camps:

  "I know half of you are eager to tell me that hyperbolic discounting solved Davidson. And look, it's elegant: the exponential and hyperbolic curves cross, your preferences flip as the reward gets closer, and 'weakness of will' becomes 'rational time-inconsistency.' Case closed.

  But here's the snag: Davidson's puzzle wasn't about why you *wanted* the cake more at 11 PM. It was about how you could *judge* the diet better at 11:05 PM *while swallowing the cake*. 

  The economist says, 'Impossible. If you swallowed the cake, your judgment must have updated to match the curve.' 
  The philosopher says, 'But I remember judging otherwise.' 
  The economist says, 'Then your memory is discounting the past.' 

  And that's where we're stuck. The economist solves the puzzle by insisting the agent is always rational. The philosopher is stuck with the agent who is freely irrational. One group thinks we've found the solution; the other thinks we've found the excuse. So this week, let's see if we can find the agent."
