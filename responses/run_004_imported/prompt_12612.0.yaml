answer: |-
  Your gut is absolutely right: switching to Borda count won't fix the strategic voting problem; it will just change *how* people game the system.

  To answer your specific theoretical question first: **No, there is no ranking method immune to this.**

  Here is the breakdown of the math, the specific theorems involved, and what you should actually do in a company setting.

  ### 1. You're thinking of the wrong theorem (but you're close)
  You mentioned **Arrow's Impossibility Theorem**. That is a famous result, but it's not the one that covers lying about preferences.
  *   **Arrow's Theorem** is about **fairness criteria**. It proves that no ranked voting system can satisfy a specific set of logical fairness rules (like "if everyone prefers A over B, the group should prefer A over B") simultaneously. It's about paradoxes and consistency, not necessarily strategy.
  *   **The Gibbard-Satterthwaite Theorem** is the one you want. This theorem specifically addresses **manipulability**. It states that for any voting system with three or more possible outcomes, if the system is deterministic (not random) and not a dictatorship, **there will always be situations where a voter can get a better result by lying about their preferences.**

  So, mathematically speaking, you are indeed "picking your poison." There is no ranked-choice utopia.

  ### 2. IRV vs. Borda: Trading one exploit for another
  Your teammate exploited a known weakness in Instant-Runoff Voting (IRV) called **"compromising."** This happens when you vote for a viable candidate you like less, to prevent a candidate you dislike from winning, because your true favorite is polling poorly.

  If you switch to **Borda Count** (where 1st place gets 5 points, 2nd gets 4, etc.), you invite a different, often more aggressive form of gaming called **"burying."**
  *   **In Borda:** Every position matters. If I know my favorite (Option A) is going to lose, my best strategy is to rank the strongest competitor (Option B) *last*, even if I actually think Option B is fine. This drags B's score down artificially.
  *   **The Result:** Borda is widely considered by political scientists to be *more* susceptible to strategic voting than IRV. It encourages voters to exaggerate their preferences (rank favorites 1st and rivals last) rather than expressing honest nuance.

  ### 3. Are there any alternatives?
  Since the Gibbard-Satterthwaite theorem proves ranked systems can't be strategy-proof, the only way to mitigate this is to change the *type* of voting or the *context*.

  **A. Cardinal Voting (Score or Approval)**
  Instead of ranking (1st, 2nd, 3rd), you rate options independently.
  *   **Score Voting:** Rate every option 0–5.
  *   **Approval Voting:** Mark every option you find "acceptable."
  *   **Why it helps:** These systems are not covered by Gibbard-Satterthwaite (which applies to ordinal/ranked systems). While they have their own strategy (min-maxing, i.e., only giving 0s and 5s), studies show voters are more likely to vote honestly in Score/Approval systems than in ranked systems. It also captures *intensity* of preference (e.g., "I mildly prefer A, but I hate B"), which rankings hide.

  **B. The "Small Group" Exception**
  Theorems assume large, anonymous populations. In a company team:
  *   **Transparency:** If everyone votes on a shared screen or the results are discussed openly, social pressure reduces gaming.
  *   **Discussion:** Voting should usually happen *after* discussion, not instead of it. If your teammate felt they had to game the system, it implies they felt their voice wouldn't be heard through normal debate.

  ### 4. Recommendation
  Don't switch to Borda; it will likely lead to more cynicism and "point hacking."

  1.  **Stick with IRV or switch to Approval Voting.** Approval voting is incredibly simple (check all that apply) and hard to mess up. It prevents the "wasted vote" fear that caused your teammate to lie.
  2.  **Acknowledge the trade-off.** Tell the team: "Math proves people can game any system. We aren't looking for a perfect system; we're looking for one that encourages honest feedback."
  3.  **Focus on culture.** If people feel safe voting for their true favorite without fear of "wasting" their vote, they won't strategize. If the team culture is competitive, they will game even the simplest system.

  **Bottom line:** Your intuition is correct. Switching to Borda moves the gaming from "compromising" to "burying," and arguably makes it worse. There is no mathematically perfect ranked system, so choose the one that is simplest to explain and hardest to accidentally break.
