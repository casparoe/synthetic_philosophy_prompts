      *   **Theoretical Question:** The user recalls Arrow's Impossibility Theorem but is unsure if it applies to strategic voting (lying about preferences) or just aggregation paradoxes.
      *   **Core Question:** Is there a ranking method immune to dishonest voting, or are we just picking our poison?

  2.  **Deconstruct the Theoretical Concepts:**
      *   **Arrow's Impossibility Theorem:** This is about *social welfare functions*. It states that no ranked voting system can satisfy a specific set of fairness criteria (Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, Independence of Irrelevant Alternatives) simultaneously. It's mostly about logical consistency and paradoxes, *not* primarily about strategic voting (though IIA is related).
      *   **Gibbard-Satterthwaite Theorem:** This is the specific theorem about *strategic voting* (manipulability). It states that for any deterministic voting system with 3 or more outcomes, if it's not a dictatorship, it is susceptible to tactical voting.
      *   **IRV (Instant Runoff):** Susceptible to "compromising" (voting for a lesser evil to stop a worse one) and "burying" (ranking a strong rival last). The user's example is "compromising."
      *   **Borda Count:** Highly susceptible to "burying" or "exaggeration." If I know my favorite can't win, I rank the strongest competitor last to hurt them, even if I actually like them okay. It encourages insincere rankings to maximize point differentials.
      *   **Approval Voting / Score Voting:** These are *rated* systems, not *ranked* systems. They have different properties. Gibbard-Satterthwaite applies to ordinal (ranked) systems. Cardinal (rated) systems have their own issues but can sometimes reduce specific types of strategic pressure (though "min-maxing" is still a thing).

  3.  **Address the User's Specific Questions:**
      *   *Is it Arrow's Theorem?* No, it's Gibbard-Satterthwaite. Explain the difference clearly.
      *   *Is Borda better?* No, it's often *more* susceptible to strategic voting than IRV.
      *   *Is there an immune method?* No (for ranked systems). Gibbard-Satterthwaite says "No."
