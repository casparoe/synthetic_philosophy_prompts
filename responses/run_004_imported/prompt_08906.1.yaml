  *(Refining Point 4)*: Maya's argument is essentially the "Weitzman Limit" or the problem of infinite present value. She is right that $r=0$ breaks the model. Owen is right that this is a model limitation, not necessarily an ethical refutation. I'll call it a draw or slight edge to Maya on *pragmatism*, Owen on *theory*.

