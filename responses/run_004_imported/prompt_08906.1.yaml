          *   *Analysis:* This is a deep philosophical move (Parfit again). However, in economics, we usually assume a social planner cares about all citizens equally regardless of "psychological connectedness." Also, even if I discount my *own* future, a *social* policy shouldn't necessarily reflect individual myopia.
          *   *Verdict:* Maya is philosophically clever but economically shaky. Social CBA usually assumes intergenerational equity, regardless of psychological connectedness. Owen's stance is more aligned with standard welfare economics.

