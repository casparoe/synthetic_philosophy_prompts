      *   **Characters:** Owen (argues for zero pure time preference/equality) vs. Maya (argues for positive pure time preference/rational discounting).
      *   **Task:** Evaluate each of the 6 moves in their argument, determine who is "right" (economically/philosophically) at each step, and identify missing nuances.

  2.  **Deconstruct the Argument (Move by Move):**

