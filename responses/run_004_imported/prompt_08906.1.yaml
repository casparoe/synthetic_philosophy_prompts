          *   *Analysis:* Owen distinguishes between *probability of existence* and *value of wellbeing*. If there's a 50% chance people exist, you discount by 0.5, but if they *do* exist, their welfare counts equally. This is the "expected utility" approach.
          *   *Verdict:* Owen is logically consistent. Conflating existence probability with moral weight is a common error. He wins this technical point.

