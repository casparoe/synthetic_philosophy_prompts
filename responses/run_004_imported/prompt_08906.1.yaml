      *   *Maya:* Strong on practical consequences and behavioral reality. Weak on adhering to the constraints of the thought experiment (confusing growth with pure preference initially).
      *   *Missing:* The distinction between *Descriptive* (how people *do* act) vs. *Normative* (how people *should* act). Also, the "Uncertainty" vs. "Catastrophe" nuance.

