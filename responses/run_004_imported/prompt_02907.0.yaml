answer: |-
  This is a fantastic passage to wrestle with. You are absolutely right to feel that Sidgwick is doing something subtle here that gets glossed over in intro classes. Your prof is correct: this is the genetic code for the modern debate on supererogation. J.O. Urmson's 1958 paper "Saints and Heroes" is essentially just unpacking the tension Sidgwick identifies in this one page.

  The Victorian prose is indeed dense, but the logical architecture is actually quite rigorous. Let's break down the moves, and then tackle your three specific questions.

  ### The Chain of Argument (Sentence-by-Sentence Reconstruction)

  1.  **The Phenomenon:** We recognize acts of "high virtue" that go beyond "strict duty." (Criteria: We praise doing them, but don't condemn *not* doing them).
  2.  **The Conflict:** This creates a problem. Usually, we define "duty" as "doing whatever action one judges most excellent." If an act is the "most excellent," logic suggests it *must* be a duty.
  3.  **First Potential Solution (Power):** Maybe the difference is about *ability*. Can we realize "Virtue" as easily as "Duty"?
  4.  **Qualification:** Virtue must be somewhat attainable (we don't call impossible things virtues).
  5.  **Limitation:** However, the *highest degree* of virtue (e.g., maximum courage) is not attainable at will by ordinary people.
  6.  **Interim Conclusion 1:** Therefore, some acts are beyond duty simply because they are beyond **power**. (Let's call this the "Heroism Constraint").
  7.  **The Real Question:** But if we set aside the stuff that is literally impossible (the "margin"), does Virtue coincide with Duty for the stuff that *is* in our power?
  8.  **The Intuition:** It feels wrong ("immoral paradox") for a moral agent to say, "This is the best action, but it's not my duty."
  9.  **The Counter-Intuition:** Yet, Common Sense *does* treat some feasible, best actions (like a rich man giving away his fortune) as praiseworthy but not obligatory.
  10. **The Resolution:** We solve this by splitting **Obligation** (what I ought to do) from **Sanction** (what others should blame me for). Duty is tied to blame; Supererogation is tied to praise without blame.

  ***

  ### 1. Is he sliding between "Beyond Power" and "Within Power"?

  You have a very sharp eye. It *does* read like a slide, but Sidgwick is actually being very precise. He distinguishes them explicitly, but he uses the first one to clear the deck for the second one.

  *   **Phenomenon A (The Courage Example):** This is about **psychological/physical impossibility**. Sidgwick argues you cannot summon "the highest degree of courage" *at will*. If you can't do it at will, it can't be a duty (because *Ought Implies Can*). This is a "get out of jail free" card based on human limitation.
  *   **Phenomenon B (The Rich Man Example):** This is the core problem. Sidgwick explicitly says, *"Can we then, **excluding this margin**, say that virtuous conduct... coincides completely with his duty?"*

  He is **not** treating them as the same phenomenon. He is treating the Courage Example as a trivial case of supererogation (obviously you can't duty someone to be a superhero if they are terrified). The **Rich Man Example** is the philosophical bomb. The rich man *can* give the money. It *is* in his power. It *is* the "most excellent" action. And yet, Common Sense says it is not a duty.

  Sidgwick isolates Phenomenon B because Phenomenon A is easily solved by the principle of ability. Phenomenon B is hard because it breaks the link between **Value** (this is best) and **Obligation** (you must do this).

  ### 2. What is the "Immoral Paradox"?

  The paradox arises from a **maximizing conception of morality**, which Sidgwick (as a Utilitarian) is sympathetic to, even while analyzing Common Sense.

  If morality is about producing the best outcomes or realizing the highest good, then:
  1.  Action $X$ produces the most good/is the most excellent.
  2.  Therefore, I ought to do $X$.
  3.  Therefore, $X$ is my duty.

  If an agent says, *"I know $X$ is the best thing, but it's not my duty,"* they are severing the link between **The Good** and **The Right**.

  **Why is it "Immoral"?**
  To Common Sense, that sentence sounds like **rationalization**. It sounds like: *"I know I should save the drowning child because it's the 'best' thing, but since I'm not 'required' to, I'll just walk past."*
  It threatens the authority of morality. If the "best" action is optional, then morality is no longer demanding. It turns the "best" into a mere suggestion. Sidgwick calls it an "immoral paradox" because it sounds like a clever trick to avoid moral responsibility while admitting you know what the responsible thing is.

  ### 3. Does his fix (Ought vs. Blame) actually work?

  Your suspicion is spot on: **He is relocating the tension, not dissolving it.**

  Sidgwick's move is to redefine "Duty" not as "The Ideal Action" but as "The Action enforceable by blame."
  *   **Objective Ought:** What is actually the best thing to do (The Rich Man *ought* to give the money).
  *   **Social Duty:** What we are allowed to punish him for not doing (We *cannot* blame him for keeping it).

  **Does this solve it?**
  *   **Pro:** It saves Common Sense. It explains why we admire saints but don't arrest people for failing to be saints. It prevents morality from becoming too demanding (a problem later called the "Overdemandingness Objection" in Utilitarianism).
  *   **Con:** It leaves the agent in a weird spot. The agent is left thinking: *"So I ought to do it, but I'm not doing it, and that's fine?"* It creates a gap between **Moral Truth** and **Moral Practice**.

  **Connection to Contemporary Stuff:**
  This is exactly where the modern debate picks up.
  *   **Urmson (1958):** Argues Sidgwick is right. We need to distinguish duties (required) from supererogatory acts (optional but good) to keep morality livable.
  *   **The "Paradox of Supererogation" (Heyd, etc.):** Later philosophers argue Sidgwick's solution is unstable. If an act is truly the *best*, why isn't it required? If it's not required, is it really the *best*?
  *   **Sanction vs. Value:** Sidgwick anticipates the split between **Deontic Status** (is it forbidden/permissible/obligatory?) and **Axiological Status** (is it good/better/best?). He solves the paradox by saying Supererogatory acts are *Axiologically Best* but *Deontically Permissible*.

  ### Summary for your Response Paper
  If you want to impress your prof, here is the angle:
  Sidgwick identifies that the "Paradox of Supererogation" is actually a conflict between **Ideal Morality** (what is best) and **Practical Morality** (what we can enforce).
  1.  He distinguishes **impossible virtue** (courage) from **expensive virtue** (wealth), focusing on the latter as the real puzzle.
  2.  He identifies that calling the best act "optional" sounds immoral because it breaks the link between Value and Obligation.
  3.  His solution is **sociological**: He defines "Duty" by the legitimacy of **blame**, not by the magnitude of the **good**.

  You are right to feel he is "dodging" the hard metaphysical question (Why is the best act not obligatory?) by answering a sociological one (Why don't we blame people for not doing it?). But that might be his point: "Duty" is a human tool for social regulation, not just a metaphysical fact about the universe.

  Good luck with the seminar. Sidgwick is dense, but if you can parse this passage, the rest of the unit will be much easier.
