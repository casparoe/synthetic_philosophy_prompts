  2.  **Deconstruct the Sidgwick Passage:**
      *   *Sentence 1:* Defines the phenomenon. High virtue = beyond strict duty. We praise performance, don't condemn non-performance. (Classic supererogation definition).
      *   *Sentence 2:* The Conflict. Duty is usually defined as "doing what one judges most excellent." If $X$ is most excellent, isn't $X$ a duty?
      *   *Sentence 3-5:* First Attempt at Resolution (The Power Constraint). Can we realize Virtue as easily as Duty? Virtue requires attainability. But *highest* virtue isn't attainable at will by ordinary people (e.g., maximum courage).
      *   *Sentence 6:* Conclusion of First Attempt. There is a "margin" of conduct beyond duty because it's beyond *power*.
      *   *Sentence 7:* Second Attempt/Deepening. Excluding the "power" margin, does Virtue = Duty?
      *   *Sentence 8:* The Intuition. A moral man can't say "This is best, but not duty." That sounds immoral/paradoxical. (The "Ought Implies Can" / Maximizing intuition).
      *   *Sentence 9:* The Counter-Intuition. Yet, we praise some acts (rich man giving away wealth) without imposing them as duties on everyone able to do them.
      *   *Sentence 10:* The Solution. Distinguish "What I ought to do" (Objective/Ideal) from "What others ought to blame me for" (Social/Sanction). The blame standard is laxer.

  3.  **Address Question 1: Two Reasons or One?**
      *   *Observation:* Sidgwick definitely distinguishes them.
      *   *Reason A:* Psychological/Physical impossibility for the *ordinary* agent (The Courage Example). You literally can't summon heroism at will. This makes it not a duty because "Ought implies Can."
      *   *Reason B:* Social/Practical exigency (The Rich Man Example). The agent *can* do it. It *is* the best. But we don't call it duty.
      *   *Analysis:* Sidgwick treats the first as a "margin" to be excluded. The *real* problem is the second one. He acknowledges the distinction ("Can we then, excluding this margin..."). So he isn't sliding; he's peeling layers. The courage bit is a side note; the rich man bit is the core supererogatory problem.

  4.  **Address Question 2: The "Immoral Paradox"**
      *   *The Claim:* "This is the best thing... but yet it is not my duty."
      *   *Why Paradoxical?* In Sidgwick's (and Utilitarian) framework, "Duty" is usually tied to "What one ought to do." If "Ought" is determined by the "Good" (maximizing excellence), then the "Best" action *must* be the "Duty." To say otherwise breaks the link between Value and Obligation.
      *   *Why "Immoral"?* It sounds like making an excuse. "I know $X$ is better, but I'm not required to do it, so I'll do $Y$." It sounds like moral laziness disguised as technical correctness. It threatens the authority of morality. If the best isn't required, what is?

  5.  **Address Question 3: The Solution (Ought vs. Blame)**
      *   *The Move:* Sidgwick splits *Objective Obligation* (what is actually right/best) from *Subjective Sanction* (what we punish/blame).
      *   *Does it work?*
