      *   *Connection to Contemporary:* This is exactly the Urmson/Heyd debate. Is supererogation about *obligation* or *sanction*? Sidgwick anticipates the "Optionality" vs. "Value" tension. The "Paradox of Supererogation" (if it's good, why not obligatory?) is right here. Sidgwick solves it by making "Duty" a social tool, not just a metaphysical truth.

