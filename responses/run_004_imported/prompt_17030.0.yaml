answer: |-
  Marcus: You're smuggling a homunculus into the machinery. If the censor decides what gets through to consciousness, it has to know what it's blocking. It has to recognize the dangerous idea in order to suppress it.

  Elena: It doesn't recognize ideas. It registers affect. It's a pressure valve, not a librarian.

  Marcus: Then how does it know which pressure is dangerous? If I'm angry at my father, the anger has to be identified as anger before it can be stopped. If the censor identifies it, the censor is conscious of it. So who is the censor hiding it from?

  Elena: You're treating consciousness like a room. It isn't. The censor isn't a person standing at the door. It's the door itself. It's the resistance between systems. The energy doesn't need to know anything to meet a barrier.

  Marcus: But repression isn't just a barrier, it's a specific negation. It's an active not-knowing. If the door is just a wall, then I'm simply ignorant. But I'm not ignorant. I'm avoiding. There's a difference. Ignorance is a lack of data; repression is a relationship to data. You're saying the wall decides which bricks to reject.

  Elena: I'm saying the charge of the idea triggers the defense. It's mechanical. You're insisting on a unity of consciousness that doesn't exist. The mind is divided. That's the point. There is a part of you that knows, and a part that doesn't.

  Marcus: And that's where you lose the phenomenon. If a part of me knows, then *I* know. If I know, then my claim that I don't know is a lie. But it's not a lie I tell you. It's a lie I live. Your split consciousness lets me off the hook. It says, "The Id did it." My point is that I am doing it. I am the one deceiving myself.

  Elena: If you're doing it, you're doing it intentionally. You're saying neurosis is a project.

  Marcus: Not a project like building a table. A project of being. I know my anger non-positionally. I live it, I feel the heat of it, but I refuse to posit it as an object of reflection. I keep it in the background so I don't have to own it. I don't need a censor to hide it from me because I'm the one looking away.

  Elena: Looking away implies you know where you're looking. If I'm grieving and I don't know it, I don't feel the heat. I feel numb. Where is the grief in your model?

  Marcus: It's in the flight. The numbness is the activity. You're treating consciousness as passive, like a screen things appear on. It's not. It's a light. If I shine the light everywhere except on the grief, the grief is still there in the dark I'm creating.

  Elena: But why can't I just turn the light? If it's my light, why do I need three years of analysis to find the switch? Why does the resistance feel like it's happening to me?

  Marcus: Because you're invested in the dark. You're complicit.

  Elena: Complicity implies a choice. I'm telling you the switch is broken. The wiring is fused. You can't explain the fusion by saying I chose to fuse it. That requires a level of lucidity that contradicts the state of fusion. To choose to be unconscious, you have to be conscious of what you're choosing to lose.

  Marcus: No. I'm conscious of it pre-reflectively. I know the truth without knowing that I know. That's the structure of bad faith. I am both the deceiver and the deceived because I am a single consciousness that can negate itself. You need two agencies to make it work. I only need one.

  Elena: You need a miracle. You need consciousness to be opaque to itself while remaining translucent. You say I duplicate the subject with the censor. You duplicate the subject inside the subject. You say I know and don't know. That's not unity. That's magic.

  Marcus: It's not magic. It's ambiguity. I am facticity and transcendence. I am what I am and I am not what I am. When I say I'm not angry, I'm transcending my anger. But the anger is my facticity. I'm trying to be only one side of myself.

  Elena: And I'm telling you that you can't try to be only one side of yourself without a mechanism to enforce the split. You've described the experience of the lie, Marcus. You haven't explained the architecture. You've just given the lie a fancier name and called it freedom.

  Marcus: And you've given the lie a machinery and called it fate. You explain how the trick works, but you can't explain who's watching it. I explain who's watching, but you won't admit the watchman is blind.

  Elena: The watchman isn't blind. He's asleep.

  Marcus: Then wake him up.

  Elena: I can't. He's not you.

  Marcus: He is. That's the terror.

  Elena: No. That's the vanity.
