answer: |-
  The control room didn't look like a bridge. It looked like a waiting area in a municipal airport. Beige carpet, hum of the HVAC, and a wall of screens showing the Earth not as a globe, but as a spreadsheet of thermal differentials.

  Elara sat at Station 4. Her title was *Allocation Analyst*, but everyone called it the Rationing Desk.

  "The model is rejecting the proposal again," said Kael, sliding a tablet across the table. He was young, eager, the kind of hire who still believed in optimization curves. "Sector 4 needs the precipitation for the harvest. But if we trigger the cloud-seeding drones, the thermal displacement floods Sector 9. The algorithm flags it as a net-negative casualty event."

  "So don't flood Sector 9," Elara said, not looking up from her own screen.

  "We can't," Kael said. "That's the point. The dispersion mechanism is indivisible. To cool the equator, you have to displace the heat. To seed the rain, you have to pull the moisture. You can't have the harvest without the flood. It's physics."

  Elara finally looked at him. "So what's the recommendation?"

  "Shutdown," Kael said. "Temporary moratorium on active geo-engineering. We let the natural systems reset. It's the only way to stop the unintended consequences."

  Elara swiveled her chair. She was older than the rest of the team, old enough to remember the stories her grandmother told about the 1950s. Back when a mathematician named Von Neumann had looked at the atom bomb and the smokestacks and said, *You can't just ban the bad parts. The good and the bad are the same thing.*

  "If we shut down the Lattice," Elara said softly, "the equatorial heat index rises three degrees by next August. The crops in Sector 4 don't just fail; they burn. The refugees from Sector 9 won't be fleeing floods; they'll be fleeing dust."

  Kael frowned. "So we choose who drowns and who burns?"

  "No," Elara said. "We choose how we talk about it."

  She stood up and walked to the main window. It didn't look out on the world; it looked into the observation deck where the Regional Delegates were gathering. There were twelve of them. Some were angry. Some were terrified. One was praying.

  "There was a draft memo circulating last week," Elara said. "Proposed an independent oversight committee. Veto power over our activations."

  "I heard," Kael said. "It would make us safer. More ethical."

  "It would make us slower," Elara corrected. "And it would let the Delegates off the hook. If a committee signs the order, the Delegates can tell their constituents, *'It wasn't us, it was the safety board.'* If the algorithm decides, they say, *'It was the math.'* If we shut it down, they say, *'It was the scientists.'*"

  She turned back to him.

  "Von Neumann wrote about this. Seventy years ago. He knew we'd try to legislate the physics away. We want a technology that gives us the yield without the runoff, the energy without the radiation, the rain without the storm. But the technology is indivisible. The danger isn't a bug. It's the price of admission."

  "So what do we do?" Kael asked, his voice tight. "We can't run the simulation again. It always ends with casualties."

  "We stop looking for a simulation that ends without casualties," Elara said. "Because that world doesn't exist. Not anymore."

  She gestured to the observation deck.

  "In ten minutes, I'm going to walk in there. I'm not going to present a solution. I'm not going to offer a ban. I'm not going to show them a new kill-switch."

  "Then what are you going to give them?"

  "The choice," Elara said. "Raw. Unfiltered. I'm going to tell Sector 4 that their food requires Sector 9's basements to fill with water. I'm going to tell Sector 9 that their dry floors require Sector 4 to starve. And then I'm going to sit down."

  "That's it?" Kael looked horrified. "That's not leadership. That's... abdication."

  "It's the opposite," Elara said. "It's forcing them to grow up. We've spent a century building machines that act like gods so we don't have to act like adults. We think if we build the right committee, or write the right law, or code the right alignment protocol, the moral burden disappears. But the burden is the only thing that's real."

  She picked up her tablet.

  "If they walk out of that room and agree to share the flood, to redistribute the grain, to move populations before the water rises... then we survive. If they try to find a technical workaround, or blame us, or vote to ban the rain... then we don't. Not because the machine failed. Because we did."

  Kael looked at the screens. The thermal maps pulsed, indifferent and beautiful.

  "It's going to be loud in there," he said.

  "Yes," Elara said. "It's going to be messy. It's going to take a long time. And we'll have to do it again next month, and the month after."

  "Patience, flexibility, intelligence," Kael muttered, reading the quote off the wall plaque behind her.

  "Exactly," Elara said. She smoothed her jacket. "No gadgets, Kael. Just us."

  She opened the door to the observation deck. The noise of the arguing delegates washed over her, a wall of human fear and demand. She didn't reach for a remote. She didn't reach for a gavel. She just pulled out a chair, sat down at the head of the table, and waited for them to run out of places to hide.
