  2.  **Deconstruct Plato's Argument in *Laws* (Book II):**
      *   **Purpose of Wine:** It's not for hedonism. It's for *paideia* (education/training).
      *   **Mechanism:** Wine loosens shame (*aidos*) and fear. It reveals the true character.
      *   **The *Symposiarch*:** Crucial element. A sober, wise overseer who ensures the drinking serves the civic good, not just pleasure.
      *   **Age Grading:**
