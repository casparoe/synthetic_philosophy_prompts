      *   **Goal:** To cultivate courage and moderation. To test if laws are internalized. To soften the soul for learning in old age.
      *   **Civic Context:** Everything is subservient to the health of the *polis* (state). Individual pleasure is irrelevant unless it serves civic virtue.

  3.  **Evaluate Modern Development #1: Clinically Supervised Psychedelic Therapy:**
