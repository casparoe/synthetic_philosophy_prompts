      *   *Does Russell's view survive?*
          *   *Hard Determinism vs. Plasticity:* Evo-psych doesn't say jealousy is *fixed*, just that it has a *basis*. Russell argues intensity is modulated by custom.
          *   *The "Instinct" Nuance:* Russell admits there *is* an instinct, but argues it's manageable. In *Marriage and Morals*, he acknowledges biological factors but emphasizes the *social amplification*.
          *   *Reply Strategy 1 (The Interactionist View):* Biology loads the gun, culture pulls the trigger. Russell can concede a baseline instinct while maintaining that the *pathological* levels seen in Victorian Europe are cultural.
          *   *Reply Strategy 2 (The Economic Root):* Evo-psych focuses on reproduction. Russell focuses on *property*. If inheritance laws change (no primogeniture, state support for children), the *stakes* of paternity drop, reducing the *utility* of jealousy even if the *impulse* remains.
          *   *Reply Strategy 3 (Historical Specificity):* Russell's anthropology was shaky (Trobriands weren't as free as Malinowski thought), but his sociological point stands: jealousy varies by context. Evo-psych often struggles to account for the *degree* of variation.
      *   *Verdict:* Russell's view doesn't collapse, but it needs modification. He can't claim jealousy is *purely* social, but he can claim its *destructive forms* are socially amplified. The reply is viable if framed as "modulation" rather than "elimination."

