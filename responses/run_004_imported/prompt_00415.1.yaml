      *   Did I address the detective scene? Yes.
      *   Is the philosophical distinction accurate? Yes.

  8.  (Mental Check): Is there a way interventionism *actually* helps here more than Lewis?
      *   Lewis struggles with "Late Preemption" (Suzy and Billy throw rocks; Suzy's hits first. If Suzy hadn't thrown, Billy's would have. Counterfactual dependence fails, but causation holds).
      *   Interventionism handles this by looking at the *process* or the *variable structure* at the time of impact.
