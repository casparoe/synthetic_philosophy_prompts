answer: |-
  You have a great instinct for the philosophical stakes here, but you are slightly collapsing a distinction that could actually make the dialogue richer.

  Your intuition is correct that **Interventionism** (associated with James Woodward) is often pitched as a more scientific, practical alternative to **Lewisian Counterfactualism** (David Lewis). However, your understanding of *why* they differ needs a technical tweak to hold up to scrutiny by anyone who knows the literature.

  Here is the breakdown of the distinction, the correction you need, and how to use it to sharpen the conflict in your scene.

  ### 1. The Technical Correction: Interventionism is Still Counterfactual
  You wrote: *"[Interventionists] ground causal claims in what would actually happen under a real, physical manipulation rather than in a counterfactual supposition about some other possible world."*

  This is the trap. In a forensic context (a past murder), you cannot perform a "real, physical manipulation." You cannot go back in time and move the detective to see if the victim lives.

  Interventionists **do** use counterfactuals. They define causation as: *$X$ causes $Y$ if, were we to ideally intervene on $X$, $Y$ would change.*
  *   **Lewis:** Asks about the similarity of **whole possible worlds**. ("In the closest world where you aren't there...")
  *   **Interventionist:** Asks about the invariance of **variables within a system**. ("If we could wiggle the variable 'Detective's Presence' independently of everything else...")

  **The Distinction for Your Novel:**
  The fight isn't "Real Manipulation vs. Magic Possible Worlds." The fight is **"Similarity vs. Structure."**
  *   **The Lewisian (Mentor):** Worries about "closeness." How similar is the world where the detective stays home? Does the killer still come? Does the victim still go out? It's metaphysical and vague.
  *   **The Interventionist (Student):** Worries about "independence." Was the detective's presence an independent lever, or was it tied to the killer's plan (a common cause)? It's mechanistic and structural.

  ### 2. Why "If You Weren't There..." Doesn't Prove Causation
  To make the argument work for the detective, you need a scenario where counterfactual dependence is true, but causal responsibility is false (or at least disputed).

  **The Scenario: The "Backtracking" Trap**
  *   **Fact:** The Killer sent a letter summoning the Detective to the scene specifically to witness the crime.
  *   **Detective's Logic:** "If I hadn't come (because I didn't get the letter), I wouldn't have been there. If I wasn't there, the Killer wouldn't have killed the victim *at that moment* (because he wanted me to see it). Therefore, my presence caused the death."
  *   **The Lewisian Problem:** Lewis struggles with "backtracking" counterfactuals. To make the Detective absent, do we just delete him? Or do we have to delete the letter? If we delete the letter, the Killer's plan changes. It gets messy with "similarity metrics."
  *   **The Interventionist Solution:** The student argues: "We need an **ideal intervention**. We must change *only* your presence, holding the Killer's intent constant. If we magically keep the Killer's plan the same but you don't show up, does the victim still die? Yes. Therefore, your presence wasn't the causal lever. You were a *symptom* of the cause, not the cause."

  ### 3. Drafting the Argument
  Here is how you can stage the clash using the corrected philosophy.

  **The Setup:** The Detective insists the Detective-Character is responsible because the victim is dead only because the Detective-Character was there (perhaps they distracted the victim, or blocked an exit).

  **The Mentor (Lewisian):**
  > "Detective, you're relying on simple counterfactual dependence. 'If A hadn't happened, B wouldn't have.' But David Lewis taught us that causation isn't just dependence. It's about the chain of events across possible worlds. We have to ask: in the *closest* world where my client stays home, does the victim still die? If the killer was determined, the closest world is one where the killer finds another opportunity. Causation is robust; your counterfactual is fragile."

  **The Student (Interventionist):**
  > "With respect, Professor, that's metaphysical hand-waving. We don't need to rank possible worlds by 'similarity.' We need to look at the **system**. Causation is about manipulability. Was my client's presence a *handle* we could turn to change the outcome? Or was it just a light on the dashboard indicating the engine was running?
  >
  > "Detective, imagine an **ideal intervention**. We snap our fingers and remove my client from the room, but we *don't* change the killer's location, the weapon, or the victim's position. Just the client. Does the victim live? If the answer is no, then my client wasn't a cause. They were scenery. You're confusing correlation with a causal pathway."

  **The Detective (Skeptic):**
  > "But if he wasn't there, the victim would be alive right now."

  **The Student:**
  > "That's a **backtracking counterfactual**. You're imagining a world where he wasn't there *because the killer didn't call him*. That changes the killer's behavior. But an interventionist asks: holding the killer's behavior fixed, did my client's presence *make the difference*? You're blaming the thermometer for the fever."

  ### 4. Why This Matters for Your Characters
  This distinction allows you to characterize their academic rift beautifully:

  1.  **The Mentor (Lewisian):** Represents the "Old Guard." They care about truth, metaphysics, and the deep nature of reality. They might be accused of being too abstract for a courtroom or police station. They worry about *what causation IS*.
  2.  **The Student (Interventionist):** Represents the "New Pragmatist." They care about science, mechanisms, and what works. They view causation as a tool for prediction and control. They worry about *how we IDENTIFY causation*.

  **The Dramatic Irony:**
  The Student claims Interventionism is more "real" because it avoids possible worlds. But as you noted in your query, they are still relying on a hypothetical ("If we were to intervene...").
  *   **Mentor's Retort:** "You claim to be so practical, but you can't intervene on the past. You're just imagining a different world too. You've just dressed your possible worlds up as 'variables' to sound like a scientist."

  This creates a perfect stalemate for the detective: two experts agreeing on the conclusion (client isn't responsible) but fighting over the fundamental nature of reality to prove it.

  ### Summary Checklist for Your Draft
  *   [ ] **Don't** let the student claim they can do "real" manipulations on past events.
  *   [ ] **Do** let them talk about "ideal interventions" or "wiggling variables."
  *   [ ] **Do** highlight that Lewis relies on "similarity" (vague) while Interventionism relies on "invariance" (structural).
  *   [ ] **Use the "Thermometer" Analogy:** It's the classic interventionist example. A rising thermometer correlates with a rising temperature, but wiggling the mercury doesn't change the heat. This fits your "presence at the scene" mystery perfectly.

  You are very close to a sophisticated philosophical scene. Just tighten the definition of interventionism so the student doesn't sound like they're suggesting time travel, and you'll have a very credible conflict.
