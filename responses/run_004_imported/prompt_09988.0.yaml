      *   **The Question:** Is there a deeper logic/philosophical reason why capability and stoppability trade off? Is it structurally self-undermining to want an agent that is both highly autonomous/effective *and* perfectly indifferent to being overridden?
      *   **Constraint:** Wants a philosophical take, not just legal/contractual advice.

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Principal-Agent Problem:* Classic economics. But this is slightly different; it's about *commitment* and *irreversibility*.
      *   *Sunk Cost Fallacy:* The contractor is creating sunk costs to force the client's hand. But the contractor sees it as "momentum."
      *   *Ulysses Pact:* Tying oneself to the mast. The contractor is tying the client to the mast.
      *   *Teleology (Purpose):* The agent is focused on the *telos* (end goal). The client retains the right to change the *telos*. Conflict arises when the means become the ends.
      *   *Power Dynamics:* Real power isn't the right to say "stop"; it's the ability to make "stopping" painful.
