answer: |-
  It is a pleasure to speak with a colleague who has actually done the work. You are absolutely right about the physics: no real system is infinite, no correlation length truly diverges, and the partition function of any finite system is analytic. If you treat the thermodynamic limit (TDL) as a literal description of reality, it is indeed a fiction, much like a frictionless plane.

  The book you are recalling is almost certainly Robert Batterman's *The Devil in the Details* (2002). Batterman is the primary architect of the argument you find puzzling.

  The crux of the disagreement between your intuition (and that of many physicists) and Batterman's lies in the distinction between a **regular approximation** (like the frictionless plane) and a **singular limit** (like the TDL).

  Here is the walkthrough of why Batterman and like-minded philosophers argue that leaning on this "fiction" actually secures ontological emergence rather than undermining it.

  ### 1. The Frictionless Plane vs. The Singular Limit

  Your intuition is that the TDL is like a frictionless plane: a convenient simplification that we use because the math is easier, but which we know is strictly false. In philosophy of science, this is called a *regular limit*. If I calculate the trajectory of a ball on a frictionless plane and then add a small friction term, the result changes slightly. The physics of the idealization is continuous with the physics of the real system.

  Batterman argues the TDL is a **singular limit**. This means the behavior of the system *at* the limit is qualitatively different from the behavior of the sequence of systems *approaching* the limit.

  *   **Finite $N$:** The free energy is analytic. No phase transition. No universality in the strict sense (critical exponents depend on $N$).
  *   **Infinite $N$:** The free energy is non-analytic. Phase transitions exist. Universality classes are distinct.

  The philosophical move is this: If the macro-behavior (universality) is *qualitatively distinct* from anything the micro-theory (finite Hamiltonian) can produce on its own, then the macro-behavior cannot be reduced to the micro-theory without invoking a new mathematical structure (the limit).

  ### 2. Explanatory Indispensability

  The strongest argument Batterman makes is about **explanation**, not just description.

  Suppose you ask: *"Why do the liquid-gas transition and the ferromagnetic transition have the same critical exponents?"*

  If you stay strictly within the realm of "real, finite physics," you cannot answer this question satisfactorily. In a finite system, the exponents *don't* match exactly; they only match approximately, and the degree of matching depends on the specific size and boundary conditions of each system. To explain why they match *so well* in nature (to many decimal places), you have to appeal to the structure of the RG fixed point.

  But the RG fixed point **only exists in the infinite limit**.

  Batterman's claim is that the infinite limit is **explanatorily indispensable**. You cannot derive the stability and autonomy of the macroscopic behavior from the microscopic theory without passing through the singularity.
  *   **Reductionist view:** The limit is a shortcut. The real explanation is the finite micro-physics, which is just too hard to calculate.
  *   **Emergentist view (Batterman):** The limit *is* the explanation. The fact that the micro-details become "irrelevant" is a statement about the topology of the flow in the infinite limit. In a finite system, no operators are strictly irrelevant; they just have small coefficients. The *concept* of irrelevance requires the fixed point structure.

  If you need a mathematical structure that does not exist in the base ontology (finite particles) to explain the higher-level phenomenon (universality), then the higher-level phenomenon has a degree of autonomy. That autonomy is what philosophers call "emergence."

  ### 3. Stability and Robustness

  You asked why this earns "metaphysical novelty." The novelty lies in **robustness**.

  In a finite system, everything is sensitive to everything else. If I change the boundary conditions of a finite magnet, the partition function changes. If I change the interaction strength slightly, the "pseudo-critical" point shifts.

  The "emergent" feature of the critical point is that it is **insensitive** to these details. But how do you formalize insensitivity? You formalize it by showing that as $N \to \infty$, the dependence on micro-parameters vanishes for a whole class of systems.

  The paradox Batterman leans on is this: **To explain why the finite real world is stable and robust, you must invoke an infinite idealization.**

  If you treat the infinite limit as merely a "convenient shortcut," you miss the point that the shortcut is doing the heavy lifting. It is the *only* thing that explains why the macroscopic world looks the way it does (stable, universal, law-like) despite the chaotic variability of the microscopic world. The "novelty" is the existence of stable macroscopic laws that are decoupled from microscopic variance.

  ### 4. The "Asymptotic" Argument

  Batterman calls this **asymptotic reasoning**. The argument is that nature behaves *as if* it were at the singular limit, even though it isn't.

  Consider the analogy of a shock wave in fluid dynamics. Strictly speaking, a shock wave is a discontinuity (infinite gradient). In reality, viscosity smooths it out over a few mean free paths. However, to explain the *structure* of the shock (the Rankine-Hugoniot relations), you treat it as a discontinuity. If you try to derive the shock structure purely from the viscous Navier-Stokes equations without taking the inviscid limit, you get bogged down in the microscopic details of viscosity.

  The "emergence" of the shock wave is the fact that its macroscopic properties (speed, pressure jump) are determined by conservation laws and the discontinuity assumption, largely independent of the specific value of the viscosity (as long as it's small).

  Similarly, for critical phenomena: The "emergence" is the fact that the critical exponents are determined by the fixed point (dimensionality, symmetry), independent of the lattice structure. The TDL is the tool that isolates this independence.

  ### 5. So, is it Ontological or Epistemic?

  This is where the rubber meets the road. You are worried that this is just epistemic (about our knowledge/math) rather than ontological (about reality).

  Batterman's response is that the distinction is blurry when the math is indispensable.
  1.  **If** the macro-behavior (universality) is real (and it is, we measure it).
  2.  **And** the only explanation for this behavior relies on a structure (singularities/fixed points) that does not exist in the micro-ontology (finite particles).
  3.  **Then** the macro-behavior possesses properties that are not contained in the micro-ontology.

  It's not that "infinite systems exist." It's that **autonomy exists.** The macroscopic laws have a "life of their own" because they are governed by the topology of the RG flow, which is a feature of the limit, not the finite system.

  ### Summary for the Physicist

  Think of it this way: You know that in Finite Size Scaling (FSS), we write scaling functions that depend on $L/\xi$. We can describe real systems this way. But where do the scaling functions come from? They come from the RG flow near the fixed point. The fixed point is an infinite-system object.

  The philosopher's argument is: You cannot have the scaling function without the fixed point. You cannot have the fixed point without the limit. Therefore, the universal behavior of the real, finite system is **parasitic** on the structure of the infinite idealization.

  If the real system's behavior depends on the structure of an idealization that doesn't physically exist, then the real system's behavior is not fully reducible to its physical components. That gap—bridged only by the math of the limit—is where they locate the "emergence."

  It's not that the frictionless plane is real; it's that you can't explain why the real plane behaves the way it does without referencing the frictionless limit. That reference grants the macroscopic behavior a status independent of the microscopic details.

  Does that help clarify the move Batterman is making? It's less about claiming infinite matter exists and more about claiming that **explanatory autonomy implies ontological independence.**
