      *Wait, looking closer at 6.* Dan says specifying a prerogative is no more ad hoc than commonsense morality specifying "reasonable." Mara's point in 5 was about *consequentialist axiology*. If the axiology is "maximize good," adding a prerogative contradicts the axiology. Deontology's axiology is "respect constraints," so "reasonable" fits better. Dan might be glossing over the tension with the *maximizing* principle. I will give Mara a slight edge on 5, and Dan a recovery on 6, but note the tension. Actually, Dan's point about *all* theories needing boundary conditions is strong. I'll call 6 a draw/slight Dan for consistency.

      *Re-evaluating Point 1:* Mara states the objection. Is it "better"? It's the standard objection. Dan hasn't spoken yet. So Mara has the floor. But does she have the *better of it*? She states a widely accepted intuition. Yes.
      *Re-evaluating Point 2:* Dan makes a standard philosophical distinction. It neutralizes the "blame" aspect of Mara's claim. Dan wins this exchange.
      *Re-evaluating Point 3:* Mara pivots to Williams. This bypasses the blame distinction. It attacks the *content* of rightness. This is a stronger objection than demandingness alone. Mara wins this exchange.
      *Re-evaluating Point 4:* Dan argues parity. This weakens Mara's claim that consequentialism is *uniquely* problematic. Dan wins this exchange.
      *Re-evaluating Point 5:* Mara attacks the theoretical cost of fixing the problem (Scheffler). This challenges the *coherence* of the fix. Mara wins this exchange.
      *Re-evaluating Point 6:* Dan argues that *all* theories have arbitrary-looking boundaries. This defends the fix as methodologically standard. Dan wins this exchange.

