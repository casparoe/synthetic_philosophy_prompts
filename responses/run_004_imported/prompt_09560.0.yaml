answer: |-
  You have hit upon one of the most sophisticated and frequently misunderstood cruxes in natural law ethics. Your instinct is correct: the final sentence is not a non-sequitur, nor is Aquinas simply changing the subject from self-defense to public justice. Rather, he is establishing the **jurisdictional boundary** that makes the earlier argument possible.

  If Whitfield is going to use this without sounding like he is parsing words to escape a murder charge, you need to understand exactly what work that last sentence is doing. Here is a close reading of the tension, how commentators resolve it, and how Whitfield might translate it for a jury.

  ### 1. The Exegesis: Why the Last Sentence Matters

  Your reading of the tension is precise.
  *   **Part A (The Bulk of the Text):** A private person may act in self-defense. The act has two effects: saving life (intended) and killing aggressor (beside the intention/*praeter intentionem*). Because the killing is unintended, the act is lawful.
  *   **Part B (The Final Sentence):** A private person may *not* intend to kill. Only public authority may intend to kill.

  **The Resolution:**
  Aquinas is not contradicting himself; he is defining the *conditions of possibility* for Part A.

  In Aquinas's metaphysics, human life belongs to God. To "intend" the death of a human being is to exercise dominion over that life—to decide that this life should cease to be. Aquinas argues that **private individuals do not have jurisdiction over human life.** They cannot make the death of another person their *end* or their *means*, even for a good reason (like their own safety).

  Therefore, for a private act of self-defense to be lawful, the death *must* be beside the intention. If a private person *intends* the death (e.g., "I will kill him to ensure I am safe"), they are usurping an authority they do not possess (the authority to dispose of a human life). The act becomes murder, even if triggered by an attack.

  **The Soldier Exception:**
  Why can the soldier intend to kill? Not because life matters less in war, but because the soldier acts as an **instrument of the public authority.** The state (ideally) holds the power of the sword for the *common good*. When a soldier kills an enemy combatant, he is not acting on private authority to dispose of a life; he is acting as an agent of the community's right to self-preservation against an external threat. He refers the killing to the *common good*.

  **So, is he changing the subject?**
  No. He is distinguishing between **defensive killing** (private, death is a side effect) and **punitive/warfare killing** (public, death is an intended means to justice/victory). The last sentence serves as a warning label: *"Do not mistake this license to defend yourself for a license to execute. If you cross the line from 'I want to stop him' to 'I want him dead,' you no longer qualify for the protection of this argument."*

  ### 2. The Commentators' Consensus

  You asked if commentators have resolved this. Yes, this is a standard topic in Thomistic commentary (e.g., Cajetan, John of St. Thomas, and modern scholars like John Finnis or G.E.M. Anscombe).

  The consensus is that Aquinas is distinguishing between the **object of the act** and the **circumstances of the act.**
  *   **Private Citizen:** The moral object is "repelling force." Death is a circumstance/consequence.
  *   **Public Authority:** The moral object can be "destroying the enemy/criminal." Death is part of the object.

  The tension you feel arises because modern readers often view "intention" psychologically (what was going through his head?), whereas Aquinas views it **volitionally** (what did the will choose as a good?).
  *   If Daniel (your protagonist's uncle) thought, "I must kill him or he will kill me," Aquinas would say he has intended death as a *means* to safety. This is unlawful for a private citizen.
  *   If Daniel thought, "I must stop him," and used force that he knew would likely kill him, but did not choose the death *as* the stopping mechanism (rather, the stopping mechanism *resulted* in death), the death is *praeter intentionem*.

  The "snag" you found is actually the **safety valve** of the Doctrine of Double Effect. It prevents vigilantes from claiming self-defense while hunting people down.

  ### 3. How Whitfield Can Use This (Without Boring the Jury)

  This is the goldmine for your novel. Most legal thrillers treat self-defense as a calculation of force (was the gun necessary?). Whitfield can treat it as a calculation of the **soul**.

  If Whitfield simply says, "My client didn't intend to kill him," the prosecution will shred him with forensic evidence (e.g., "He shot him three times in the chest!").

  Instead, Whitfield needs to use the Aquinas distinction to reframe the *narrative of intention*. He shouldn't quote the *Summa* by name (jurors will tune out), but he should use the structure of the argument.

  **The Trap to Avoid:**
  Whitfield cannot argue that Daniel had the *right* to kill the intruder. If he argues that, he admits Daniel intended the death. He must argue that Daniel had the right to *live*, and the death was a tragedy forced upon him, not a goal he sought.

  **The Argument Strategy:**
  Whitfield should lean into the limitation Aquinas places on the private citizen. It makes Daniel look *more* moral, not less.

  *   **Drafting Idea:** Whitfield could say something like:
      > "The law allows a man to defend his home. But it does not make him a judge. It does not make him an executioner. A soldier may go to war intending to strike down the enemy for the sake of the nation. A police officer may confront a threat with the authority of the state behind him. But Daniel [Uncle's Name] is neither. He is a private man. And a private man does not have the authority to decide that another man must die.
      >
      > "The prosecution wants you to believe that because Daniel's intruder is dead, Daniel must have intended it. That he wanted it. That he woke up that night and decided to be a killer. But there is a difference between choosing to survive and choosing to kill. One is a right given to us by nature. The other is a power reserved for the state. Daniel did not reach for a power he didn't have. He reached for the life he was bound to keep. The intruder's death was not his purpose. It was the cost."

  **Why this works for the character:**
  Whitfield is a failed seminarian. He knows that "intention" isn't just what you say it is; it's what you *are*. He knows the danger of the "last sentence" in Aquinas's text. He knows that if Daniel *enjoyed* the killing, or if Daniel *planned* to ensure the man died rather than just stopped, the defense collapses.

  This gives you internal conflict for Whitfield, too. Does he *believe* Daniel kept his intention pure? Or is Whitfield using a theological technicality to save a man who might have actually intended to kill? That tension could drive Whitfield's arc in the final chapters.

  ### 4. Summary for Your Notes

  1.  **The Tension:** Is Aquinas shifting from self-defense to public justice?
      *   **Answer:** No. He is setting the *limit* of private self-defense. Private citizens can only tolerate death as a side effect; they cannot choose it as a means. Public authority can choose it as a means for the common good.
  2.  **The Consistency:** There is a single notion of intention (the object of the will). The difference lies in the **authority** of the agent. Private authority covers preservation of self; Public authority covers preservation of the order (which may require elimination of threats).
  3.  **The Novelistic Application:** Whitfield should not argue Daniel had the right to kill. He should argue Daniel had the right to *resist*, and the killing was a tragic byproduct he did not authorize. The "last sentence" of Aquinas is the prosecution's best argument (Did Daniel intend to kill?), so Whitfield must preempt it by showing Daniel's lack of authority was respected by his own conscience.

  You have done the hard work of reading the text. That final sentence is the hinge. If you swing it correctly, Whitfield's argument will feel weighty, morally complex, and distinct from the usual legal TV tropes.
