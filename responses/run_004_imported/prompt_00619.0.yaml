  Marcus: "We're talking about the kind 'Human'."
  Elena: "Then you're essentializing a biological species, not doing functionalism."

  Okay, ready to write.cw
answer: |-
  **Setting:** *A faculty office, late afternoon. Empty coffee cups litter a desk. A whiteboard behind them is covered in half-erased diagrams of Turing machines and neural nets. ELENA (50s, classic computational functionalist) is packing her bag. MARCUS (30s, leans toward naturalized metaphysics and complexity) is still staring at the board, marker in hand.*

  **Marcus:** You're leaving before we resolve the Aaronson point.

  **Elena:** Because there's nothing to resolve, Marcus. Aaronson is making a engineering constraint look like a metaphysical insight. Block's "Blockhead"—the giant lookup table—is a *reductio* of behaviorism. We're functionalists. We care about the internal causal states, not just the stimulus-response pairing.

  **Marcus:** But that's exactly where Aaronson bites. A lookup table *has* internal states. The memory address is the state. The transition function is just "read address, output value." If you functionalize "state" as "physical configuration that causally mediates input and output," the Blockhead qualifies. It passes the Turing Test for any fixed duration $T$.

  **Elena:** It qualifies as a *simulator*, not a mind. The intuition pump is that it lacks understanding.

  **Marcus:** Why? Because it's big? Because it's inefficient?

  **Elena:** Because it's not running a *program* in the sense of a compact set of rules. It's a database.

  **Marcus:** But computability theory doesn't distinguish between a database and an algorithm. They're extensionally equivalent. Aaronson's point is that if we want to rule out the Blockhead, we can't appeal to computability. We have to appeal to *complexity*. We have to say that a mind must generate its responses in polynomial time relative to the input size, not by retrieving from a table that grew exponentially to accommodate the input. Efficiency isn't engineering; it's constitutive of intentionality.

  **Elena:** *(Stops packing, turns around)* That is a category error, Marcus. Functionalism is about the abstract causal structure. If a system instantiates the right transition function, it has the mental states. How long the transition takes, or how much memory it burns, is a physical implementation detail. If you bake "polynomial time" into the definition of mind, you're saying a slow thinker isn't a mind.

  **Marcus:** I'm not saying slow. I'm saying *scaling*. Imagine we extend the conversation. To sustain a conversation of length $N$, the lookup table needs size $k^N$. A cognitive program needs size roughly $N$ or $N^2$. If you claim both are minds, you've lost the distinction between *generating* meaning and *storing* it. The mind is a compressor. The Blockhead is just a brute archive.

  **Elena:** But "compression" is in the eye of the beholder. To the Blockhead, the table *is* the program. You're privileging the description that fits *our* cognitive architecture. That's chauvinism. If a giant alien brain works via massive pre-computed lookup because its physics makes logic gates expensive, you're calling it a zombie?

  **Marcus:** I'm saying if its physical resources scale exponentially with the complexity of its thought, it's not a unified agent. It's a heap. Functionalism was supposed to save us from dualism by tying mind to computation. But if "computation" includes any finite mapping, then a lookup table is a computation. We need to restrict the *class* of computations. P-time, not just computable.

  **Elena:** Okay, let's look at that restriction. You keep invoking complexity classes. P, NP, EXPTIME. Marcus, do you remember how those are defined?

  **Marcus:** Vaguely. Polynomial time versus...

  **Elena:** They aren't properties of individual machines or individual inputs. They are properties of *infinite families* of problems. To say a system is "in P," you have to talk about its behavior as the input size $n$ goes to infinity.

  **Marcus:** Right, asymptotic behavior.

  **Elena:** But we are talking about *minds*. Human minds. We don't have infinite time. We don't have infinite input lengths. Any actual conversation is finite. For any fixed conversation length $T$, the lookup table is finite. For any finite function, the complexity is $O(1)$. It's constant time. You just look it up.

  **Marcus:** *(Frowns, puts the cap on the marker)* You're playing word games. We mean the relationship between the system's size and the potential conversation length.

  **Elena:** "Potential." Now you're invoking counterfactuals. "If the conversation *were* longer, the table *would* be bigger." But functionalism is supposed to be about the *actual* causal roles instantiated *now*. If I have the table in front of me, right now, it works. Why does it matter what happens in a possible world where the conversation is longer?

  **Marcus:** Because the *capacity* is what defines the kind. A calculator is a calculator even if I only use it to add 2+2. Its identity depends on what it *can* do across the domain of arithmetic. Similarly, a mind is defined by how it handles complexity generally, not just one specific chat.

  **Elena:** But then you aren't analyzing *this* mind. You're analyzing a class of systems. And here's the trap: If you define "Mind" as "A system that can pass a Turing Test of length $N$ using resources polynomial in $N$," you haven't defined a mind. You've defined a complexity class. There are things in P that are definitely not minds—sorting algorithms, matrix multipliers. And there might be things not in P that are minds—maybe conscious processing requires something non-deterministic or hyper-computational.

  **Marcus:** I'm not saying P is sufficient. I'm saying it's necessary. The Blockhead fails the necessity condition.

  **Elena:** But the condition doesn't apply to individuals! You can't point to a specific physical object and say "That object is in P." You can only say "The language recognized by that family of circuits is in P." To apply Aaronson's critique, you have to treat the human not as an entity, but as a generator of responses for an unbounded input stream. But humans die. Conversations end. The "asymptotic limit" is physically meaningless for biological agents.

  **Marcus:** *(Paces a bit)* So you're saying complexity theory is irrelevant because we're finite?

  **Elena:** I'm saying it's a mismatch of categories. You're trying to use a tool for analyzing algorithms to analyze ontology.

  **Marcus:** But the intuition remains, Elena! If I hand you a drive containing the Blockhead table for a 10-minute conversation, and I hand you a Python script that simulates a person for 10 minutes, and they produce the exact same bits... you feel the script is "more" of a mind. Why?

  **Elena:** Because I'm human, and I recognize the script's structure as isomorphic to mine. That's species bias.

  **Marcus:** No, it's structural. The script has *dependencies*. The output at step 100 depends on a rule applied to step 99. The table's output at step 100 depends on... the address for step 100. The causal integration is different. The table is modular in a way that destroys unity.

  **Elena:** But that's just describing the graph of the computation. Functionalism already captures that. If the lookup table's "state" is just the memory address, then the transition from Address A to Address B *is* the causal path. It's just a very sparse graph.

  **Marcus:** It's not just sparse. It's unstructured. It doesn't *compute* the next state; it *contains* the next state.

  **Elena:** "Compute" versus "Contain." That's the crux. But in a digital computer, what is the difference? A CPU is just a lookup table for opcodes, Marcus. At the microcode level, we are all Blockheads. You're trying to draw a line at a higher level of abstraction and call it metaphysics.

  **Marcus:** I'm drawing the line where *generalization* happens. The program generalizes; the table enumerates. If functionalism can't distinguish enumeration from generalization, it can't distinguish a parrot from a poet.

  **Elena:** But "generalization" is behavioral. It's about how it handles *novel* inputs.

  **Marcus:** Exactly. And handling novel inputs efficiently requires...

  **Elena:** ...requires a definition of "novel" that implies an open-ended future. But we're back to the asymptotic problem. To prove it generalizes, you have to test it on an infinite set. You can't. So you're positing a dispositional property that is never fully manifested.

  **Marcus:** Dispositional properties are standard in functionalism! Solubility is dispositional.

  **Elena:** Solubility is grounded in molecular structure. What is the "generalization structure" of the mind? If you say "it's the compact program," you're begging the question. The table *is* the program, just unrolled. You're saying the *length of the source code* determines the presence of a soul.

  **Marcus:** I'm saying the *Kolmogorov complexity* matters. The shortest description of the system.

  **Elena:** *(Laughs softly)* Now you're an information theorist. Look, if you make Kolmogorov complexity a condition for mentality, you've ruled out most of the universe, sure. But you've also made mentality dependent on the language used to describe the system. The Blockhead table looks random in binary. But in a language where "Print Conversation #452" is a primitive instruction, it's highly compressible.

  **Marcus:** We fix the language. Turing machine tape.

  **Elena:** Why? That's arbitrary. If complexity is relative to the description language, and mind is objective, then complexity can't define mind.

  **Marcus:** *(Sighs, leans against the desk)* So we're stuck. If I stick with pure computability, the Blockhead is a mind, which feels absurd. If I bring in complexity to rule it out, I rely on asymptotic limits that don't apply to finite beings, or description lengths that are language-relative.

  **Elena:** It seems functionalism has a hole. We wanted "computation" to do the heavy lifting to avoid dualism. But "computation" is too broad—it includes the Blockhead. So we try to narrow it to "efficient computation." But "efficiency" is too physical, too relative, or too asymptotic.

  **Marcus:** Aaronson thinks this is progress. He thinks pointing out the resource constraint *is* the philosophy.

  **Elena:** Maybe it is. Or maybe it just shows that "functionalism" was never about computation. It was about *causation*. And we've been pretending that "computation" is a synonym for "causation" without realizing that a lookup table has a different causal texture than an algorithm, even if the I/O matches.

  **Marcus:** Causal texture... that sounds like we're smuggling physics back in.

  **Elena:** Maybe we have to. Or maybe we admit that for a fixed conversation, the Blockhead *is* a mind, just a very fragile, non-scalable one.

  **Marcus:** A mind that dies the second you ask it an eleventh minute question?

  **Elena:** We all die when the questions stop, Marcus.

  *(Silence hangs between them. Marcus looks at the whiteboard, where "O(1)" is written next to a drawing of a brain.)*

  **Marcus:** I still wouldn't want to date the lookup table.

  **Elena:** *(Picks up her bag)* That's not a philosophical argument. That's just prejudice.

  **Marcus:** Maybe. But it's the only data point we have.

  *(Elena opens the door. Marcus doesn't move.)*

  **Elena:** Think about the language relativity point. If you can't solve that, your complexity constraint is just aesthetics.

  **Marcus:** Think about the scaling. If you can't solve that, your functionalism is just behaviorism with extra steps.

  *(Elena exits. Marcus erases the "O(1)", but doesn't write anything new.)*
