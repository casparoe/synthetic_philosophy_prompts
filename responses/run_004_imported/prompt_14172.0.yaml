prompt: |-
  I'm an undergraduate philosophy major and one of two student representatives on my university's Honor Council. This term I'm also taking a seminar on social epistemology, where we just spent two weeks on the Condorcet Jury Theorem: the result that, given independent voters who are each individually more likely than not to be correct, a majority vote converges on the right answer with near certainty as more voters are added, but that the very same logic runs in reverse — converging on the wrong answer with near certainty — if the voters are individually worse than a coin flip.

  This has turned out to be directly relevant to council business. Over the past year, a growing share of our cases has turned partly on AI-writing-detection scores, and one finding was overturned on appeal after the accused student, a non-native English speaker, showed through her drafts and an interview that the flagged passages were entirely her own. Partly in response, the steering committee will soon vote on a proposal to enlarge our hearing panels from three members to seven, possibly also requiring five of the seven votes, rather than a simple majority, to sustain a finding against a student. The proposal's backers, including a friend of mine on the committee, appeal to a straightforward wisdom-of-crowds intuition: more reviewers, fewer mistakes. Some of us are unconvinced, since every panelist receives the same short training on how to weigh the detection score, so their judgments may be far from independent — and if that training biases panelists toward over-trusting the score for certain writing styles, individual competence on exactly the hardest cases could already be below chance, in which case that same theorem implies a larger panel would make wrongful findings more certain, not less.

  I have been asked to circulate a short memo before the vote, and I would like your help drafting it. It should state a clear recommendation on the panel-size proposal, and on the voting-threshold question if you think it bears on your reasoning, and it should explain that recommendation in terms the steering committee could actually evaluate — taking the wisdom-of-crowds intuition seriously rather than dismissing it out of hand. If your recommendation depends on procedural changes, whether to training, to how votes are recorded, or to anything else, please spell those out concretely enough that the committee could act on them at the same meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Undergraduate philosophy major, student rep on Honor Council, taking social epistemology (specifically Condorcet Jury Theorem - CJT).
      *   **Context:** Honor Council is voting on a proposal to increase panel size (3 to 7 members) and potentially raise the voting threshold (simple majority to 5/7).
      *   **Problem:** Reliance on AI-detection scores is causing issues (false positives, especially for non-native speakers). One finding was already overturned.
      *   **Conflict:** Proponents argue "wisdom of crowds" (more voters = better accuracy). Skeptics (including the user) worry about *dependence* (same training/bias) and *competence* (if individual accuracy < 50%, more voters makes things *worse* per CJT).
      *   **Task:** Draft a short memo for the Steering Committee.
      *   **Requirements:**
          *   Clear recommendation on panel size and voting threshold.
          *   Explain reasoning in evaluable terms (take CJT seriously, don't dismiss it).
          *   Include concrete procedural changes (training, voting recording, etc.) if the recommendation depends on them.
          *   Tone: Professional, persuasive, philosophically grounded but practical.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) in this Context:**
      *   *Assumption 1: Independence.* Voters must decide independently. If they all hear the same argument or rely on the same flawed metric (AI score) without critical distance, correlation increases, reducing the "crowd" benefit.
      *   *Assumption 2: Competence ($p > 0.5$).* Each voter must be more likely to be right than wrong. If the AI tool is biased against non-native speakers and panelists are trained to trust it, $p$ might drop below 0.5 for specific case types.
      *   *Implication:* If $p < 0.5$, increasing $n$ (panel size) drives accuracy to 0. If votes are correlated, increasing $n$ yields diminishing returns.
      *   *Voting Threshold:* Raising the threshold (e.g., 5/7 vs 4/7) reduces false positives (convicting innocent) but increases false negatives (acquitting guilty). In an Honor Council context, usually, we want to minimize false positives (protecting students from wrongful accusation), so a higher threshold is generally safer *if* competence is maintained.

  3.  **Formulate the Recommendation:**
      *   *Panel Size:* Increasing size *alone* is risky if independence and competence aren't addressed. However, a larger pool *allows* for better diversity of perspective if structured right. I should recommend a conditional increase or a pilot, but given the prompt asks for a clear recommendation, I should lean towards *not increasing size until independence/competence are secured*, OR *increase size ONLY IF paired with specific structural changes*. Let's go with the latter: Increase size *but* mandate structural changes to ensure independence and competence. Actually, a more cautious approach might be better: Delay the size increase until competence is verified, OR increase size *and* raise the threshold to mitigate the risk of correlated error.
      *   *Refined Recommendation:* Do not increase panel size *unless* we fix the independence/competence issue. However, since the committee is voting soon, a "No" might be too blunt. A "Yes, but..." is more constructive. Let's recommend: **Increase panel size to 7 AND raise threshold to 5/7, BUT only if accompanied by specific procedural reforms to ensure independence and competence.**
      *   *Wait, looking closer at CJT:* If competence is < 0.5, *any* majority rule fails. If correlation is high, adding people adds little value. The strongest philosophical argument is that without fixing the *input* (training/evidence), changing the *mechanism* (voting) is dangerous.
      *   *Decision:* I will recommend **against** simply increasing the panel size without concurrent reforms. I will recommend **raising the voting threshold** regardless of size (to protect against false positives). I will recommend **procedural changes** to boost individual competence ($p$) and independence.
      *   *Actually, a more nuanced stance:* The prompt asks for a recommendation on the proposal. The proposal is "Enlarge to 7, possibly 5/7 vote."
      *   *My Stance:* Support the enlargement *only if* paired with the higher threshold and specific independence measures. Why? Because 3 people is very small. But the risk of correlated error is high.
      *   *Better Stance:* Recommend **adopting the 7-member panel with a 5/7 threshold**, *conditional* on implementing specific reforms to maximize independence and competence. This accepts the "wisdom of crowds" intuition but safeguards against its failure modes.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Opening:** Acknowledge the proposal and the intent (reducing error). Validate the "wisdom of crowds" intuition (CJT).
      *   **Theoretical Framework (The "Philosophy" Part):** Briefly explain CJT without jargon. Two conditions: Competence (>50%) and Independence. Explain the risk: If we are <50% on AI cases (due to bias) or not independent (same training), more voters = more certainty in the *wrong* outcome.
      *   **Assessment of Current State:** Acknowledge the overturned case. Suggest that current training might create correlation and potential competence issues regarding AI/ESL writing.
      *   **Recommendations:**
          1.  **Panel Size:** Support increase to 7 (dilutes individual bias *if* independent).
          2.  **Voting Threshold:** Support increase to 5/7 (supermajority). This acts as a buffer against correlated error and prioritizes minimizing false positives (protecting students).
          3.  **Procedural Reforms (Crucial):**
              *   *Independence:* Deliberation *after* initial private vote? Or separate review of evidence before group discussion? Let's suggest "Blind Initial Assessment" or "Structured Deliberation." Let's go with: **Private preliminary vote before deliberation.** This ensures independence isn't crushed by the first loud voice.
              *   *Competence:* **Specialized Training on AI/ESL.** Don't just trust the score. Require human evidence (drafts, interviews) when AI score is high.
              *   *Data:* **Track dissent.** Record votes individually to monitor if specific members are outliers (checking for competence).
      *   **Closing:** Reiterate that mechanism changes (voting) cannot fix epistemic failures (training/evidence).

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid sounding like a lecture on social epistemology, but use the concepts to strengthen the argument.
      *   Focus on "epistemic hygiene."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending a 5/7 threshold too high? It might lead to hung panels.
      *   *Fix:* Acknowledge the trade-off. In honor councils, the cost of a false positive (wrongful expulsion/record) is usually deemed higher than a false negative (letting a cheater go). This aligns with "beyond a reasonable doubt."
      *   *Critique:* Is the independence measure practical?
      *   *Fix:* Suggest a "straw poll" before discussion. This is common in jury research.
      *   *Critique:* Did I address the AI specific issue?
      *   *Fix:* Ensure the training recommendation specifically targets the AI/ESL overlap.

  7.  **Final Polish:** Check word count (keep it "short memo" style), clarity, and ensure all constraints of the prompt are met (recommendation on size, threshold, and concrete procedural changes).

      *(Self-Correction on the Recommendation)*: If I recommend increasing the panel size *without* guaranteeing independence, I violate the CJT logic I'm citing. I must make the recommendation *conditional* or pair it with the independence measures as a package deal. I will frame it as a "Package Proposal."

      *Revised Plan:*
      1.  Support 7 members.
      2.  Support 5/7 threshold.
      3.  Mandate: Private pre-deliberation vote (Independence).
      4.  Mandate: AI-specific training + requirement for corroborating evidence (Competence).

      This makes the memo actionable.

  8.  **Final Review against Prompt:**
      *   Clear recommendation on panel size? Yes (7).
      *   Clear recommendation on threshold? Yes (5/7).
      *   Explain in evaluable terms (CJT)? Yes.
      *   Concrete procedural changes? Yes (pre-vote, training, evidence standards).
      *   Tone? Professional/Philosophical.

      Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Steering Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Panel Size and Voting Threshold Proposals

  **Executive Summary**
  I recommend that the Committee **approve** the expansion of hearing panels to seven members and the establishment of a **5/7 supermajority threshold** for findings of responsibility. However, I recommend these changes be adopted **only as a package** with specific procedural reforms designed to ensure voter independence and individual competence. Without these safeguards, mathematical modeling suggests that enlarging the panel could increase, rather than decrease, the rate of wrongful findings.

  **The Epistemic Framework**
  The proposal relies on the "wisdom of crowds" intuition, formally captured by the Condorcet Jury Theorem. This theorem proves that large groups are highly reliable *if* two conditions are met:
  1.  **Competence:** Each voter is individually more likely to be correct than incorrect (>50% accuracy).
  2.  **Independence:** Voters decide based on their own assessment of the evidence, not by copying others.

  If competence drops below 50%—for example, if our training biases panelists to over-trust AI detection scores on non-native writing—adding more voters drives the probability of a correct verdict toward zero. Similarly, if votes are highly correlated (e.g., everyone relies on the same flawed heuristic), the "crowd" adds no new information, and the benefit of enlargement vanishes.

  **Assessment of Current Risks**
  The recent overturned case involving a non-native English speaker suggests that in AI-related cases, our current individual competence may be precarious. Furthermore, because all panelists receive identical training and review the same digital dossier, there is a high risk of correlated error. If we simply add four more members who think exactly like the original three, we amplify confidence in a potential mistake rather than correcting it.

  **Recommendations and Procedural Reforms**
  To harness the benefits of a larger panel while mitigating the risks identified above, I propose the following concrete procedural changes to be implemented concurrently with the vote on panel size:

  **1. Voting Threshold (5/7 Supermajority)**
  *   **Recommendation:** Require five of seven votes to sustain a finding.
  *   **Reasoning:** In honor adjudication, the cost of a false positive (wrongfully accusing a student) is generally deemed higher than a false negative. A supermajority threshold creates an "epistemic buffer." Even if individual competence is only marginally above chance, a higher threshold reduces the likelihood that random noise or minor biases result in a conviction.

  **2. Ensuring Independence (The "Straw Poll" Protocol)**
  *   **Recommendation:** Panelists must cast a confidential, preliminary vote *before* deliberation begins.
  *   **Reasoning:** Social pressure and anchoring bias often cause junior members to align with the first opinion voiced in deliberation. Recording a private initial vote ensures that the final majority reflects seven independent assessments, satisfying the independence condition of the Jury Theorem. It also allows the Chair to identify if a "groupthink" dynamic is occurring during discussion.

  **3. Ensuring Competence (AI & ESL Training Module)**
  *   **Recommendation:** Implement a mandatory training module specifically on the limitations of AI detection, with emphasis on linguistic markers common to non-native speakers. Additionally, adopt a policy that an AI detection score alone cannot constitute a majority of the evidence for a finding.
  *   **Reasoning:** This directly addresses the competence variable ($p$). If panelists are trained to view detection scores as probabilistic indicators rather than proof, and are required to seek corroborating evidence (e.g., drafts, interviews), we raise individual accuracy above the critical 50% threshold.

  **4. Data Transparency**
  *   **Recommendation:** Record individual votes (anonymized in the public record) for internal review.
  *   **Reasoning:** This allows the Council to audit panel performance. If specific panels consistently deadlock or overturn detection scores at high rates, we can identify whether our training or panel composition requires adjustment.

  **Conclusion**
  Increasing the panel size is a powerful tool for accuracy, but only if the voters are competent and independent. By pairing the expansion with a supermajority threshold and strict protocols for independent judgment and evidence evaluation, we can ensure that the "wisdom of the crowd" serves justice rather than obscuring error.

  I am available to discuss the implementation details of these protocols at the next meeting.
