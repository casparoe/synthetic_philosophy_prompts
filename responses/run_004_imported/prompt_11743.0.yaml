  2.  **Deconstruct the Pasadena Game:**
      *   St. Petersburg: Payoff $2^n$ with probability $1/2^n$. Expected value = $\sum (1/2^n * 2^n) = \sum 1 = \infty$.
      *   Pasadena: Payoff $(-1)^{n+1} 2^n / n$ (or similar alternating structure) with probability $1/2^n$. Expected value = $\sum (1/2^n * (-1)^{n+1} 2^n / n) = \sum (-1)^{n+1} / n$.
      *   This is the alternating harmonic series: $1 - 1/2 + 1/3 - 1/4 + ... = \ln(2)$.
      *   *Wait, check the definition:* The classic Pasadena game (Nover & Hájek, 2004) usually involves payoffs that make the expected value series conditionally convergent.
      *   Actually, the standard Pasadena game setup: Payoff $X_n = (-1)^{n-1} 2^n / n$ with probability $2^{-n}$.
      *   Expected value contribution: $2^{-n} * (-1)^{n-1} 2^n / n = (-1)^{n-1} / n$.
      *   Sum: $1 - 1/2 + 1/3 - 1/4 ...$ This converges to $\ln(2)$ *if summed in natural order*.
      *   *However*, the expectation is defined as the sum over the sample space. In probability theory, expectation is defined via Lebesgue integration, which requires absolute convergence for the value to be independent of rearrangement. If the series is only conditionally convergent, the expectation is undefined because the order of outcomes (which is arbitrary in a countable sample space without a natural ordering) changes the sum.
      *   The prompt says: "the infinite series that would give its expectation converges only conditionally, so the total depends on the order in which its payouts are summed, and can be made to equal any number at all, or none."
      *   This is the Riemann Rearrangement Theorem applied to the expectation series.

