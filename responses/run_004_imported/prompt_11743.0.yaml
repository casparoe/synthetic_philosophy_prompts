      Pasadena Game: $X_n = (-1)^{n-1} 2^n / n$ with $p_n = 1/2^n$.
      $E[X] = \sum (1/2^n) * ((-1)^{n-1} 2^n / n) = \sum (-1)^{n-1} / n$.
      This is the alternating harmonic series.
      It converges to $\ln(2)$ in natural order.
      But expectation is defined as Lebesgue integral. For discrete variables, it's $\sum x_i p_i$.
      The definition of the sum over a countable set requires absolute convergence to be order-independent.
      Since it's not absolutely convergent ($\sum 1/n$ diverges), the expectation is undefined.
      So the joke is mathematically sound.

