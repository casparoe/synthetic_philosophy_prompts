answer: |-
  A decision theorist walks into a casino to cash out a winning Pasadena Game ticket.

  The cashier asks, "How much do I owe you?"

  "Technically, it's undefined," says the theorist. "The expected value series is only conditionally convergent. If I sum the outcomes chronologically, it's $\ln(2)$ dollars. If I sum the largest payouts first, it's infinity. If I prioritize the losses, I actually owe you."

  The cashier stares at the register. "I need a single number to open the drawer."

  "Fine," says the theorist. "Name any number you want."

  "Why?"

  "Because the expectation doesn't exist until I choose an ordering. I can rearrange the terms in my head to sum to whatever you type before you hit 'Enter'."

  The cashier hesitates, finger hovering over the keys. "So if I type '1,000,000'..."

  "Then I'm a millionaire. I've already moved the positive terms to the front."

  "And if I type '0'?"

  "Then the ticket was worthless. I'll shuffle the negatives to the front."

  The cashier pulls his hand back. "What if I just don't hit 'Enter'?"

  "Then the value remains undefined," says the theorist, settling in, "and we can stand here arguing forever."
