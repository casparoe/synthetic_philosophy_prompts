          1.  The Setup (Elimination of other mental states).
          2.  The Target (Willing the Obligation).
          3.  The Regress Mechanism (The "Bootstrapping" problem).
      *   *The Core Insight:* You can't create a rule by following a rule that doesn't exist yet. To will an obligation, you need a prior rule that says "your will creates obligations."
      *   *Analogy:* Like trying to pull yourself up by your bootstraps. Or a legal system trying to validate its own constitution without prior law.
      *   *Answering the "Equivocation" question:* It's not a pun, it's a category constraint.
      *   *Answering the "Other Candidates" question:* Hume thinks he's exhausted the list of *natural* mental acts. The only thing left is *convention*.
      *   *Connection to LW/Decision Theory:* This is the philosophical root of "precommitment." You can't just decide to be bound; you need an external enforcement mechanism (reputation, contract, UDT logic).

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Hume say the will returns on itself?* "The will has here no object to which it cou'd tend; but must return upon itself in infinitum."
      *   *Interpretation:* If I will an obligation, the object of my will is "that I am bound." But "being bound" is a relation. Relations aren't direct objects of will (like moving an arm). To will a relation is to will the *cause* of that relation. If the cause is the will itself, the will is willing itself to be effective. But effectiveness requires a prior norm.
      *   *Key Distinction:* Natural vs. Artificial. Hume isn't saying promises don't work. He's saying they don't work *magically* via a mental state. They work via social pressure/convention.
      *   *LW Connection:* This is exactly the "Commitment Race" problem. You can't just "will" yourself to drive off the cliff in Chicken. You need to modify the payoff structure (burn the bridge). Hume is saying the "mental act" is the bridge burning, but the *obligation* comes from the fact that everyone knows bridges burn, not the mental wish itself.

  8.  **Final Polish:** Ensure tone is respectful of the user's scholarship (they read the *Treatise*!). Use clear headings. Make the regress explicit.

      *(Self-Correction during drafting)*: Make sure to emphasize that Hume isn't denying promises exist. He's denying they are *natural* virtues. The regress proves they can't be natural.

      *(Check the footnote text again)*: "if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition." This is the crux. Willing a relation = Willing the cause of the relation. If the cause is the volition, you are willing the volition. But the volition is the act of willing. So you are willing the act of willing. But why does *that* act create the relation? You need a prior rule.

