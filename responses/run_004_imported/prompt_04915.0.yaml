answer: |-
  This is a fantastic catch. Most people stop at "Hume says promises are conventions," but you've dug into the *mechanism* of his argument against the naturalist view of promising. You are right to sense that the footnote is doing heavy lifting, and it is notoriously dense even for Hume scholars.

  To answer your core question immediately: **No, he is not equivocating on "willing" to manufacture a pun.** He is deploying a structural regress argument that is indeed analogous to the Agrippan Trilemma in epistemology. He is arguing that the will cannot be the *source* of normativity without already presupposing normativity.

  Here is the step-by-step reconstruction of the gears in that footnote, why the regress happens, and what it leaves open.

  ### 1. The Setup: Exhausting the Natural Candidates
  First, recall Hume's goal in *Treatise* 3.2.5. He is arguing that "Fidelity" (keeping promises) is an **artificial virtue**, not a natural one.
  *   **Natural virtues** (like benevolence) arise from instinctive psychological mechanisms we have by nature.
  *   **Artificial virtues** (like justice, property, promises) arise from social conventions designed to solve coordination problems.

  To prove promising is artificial, he must show there is no **natural act of mind** that constitutes a promise. He eliminates the obvious candidates:
  1.  **Resolution:** I can resolve to do X without being obligated to you.
  2.  **Desire:** I can promise to do X while hating X.
  3.  **Willing the Action:** The will acts in the present; the promise is about the future.

  This leaves one last candidate for a "natural" mental act: **Willing the Obligation itself.**
  *   *The Theory:* When I promise, I perform a mental act where I voluntarily impose a moral bond on myself. I "will" that I become bound.

  ### 2. The Footnote: The Regress Mechanism
  Hume attacks this last candidate in the footnote. Here is the logical chain, translated from 18th-century prose into structural steps.

  **Premise A:** An obligation is a **relation**. (Specifically, a moral relation between an agent and an action/person).
  **Premise B:** Relations are not created *ex nihilo* by mental states. (You cannot make yourself a "husband" just by thinking it; you need a ceremony/law. You cannot make a piece of metal "money" just by willing it; you need a convention).
  **Premise C:** For a volition (act of will) to create a relation, there must be a **rule** or **norm** that grants volitions that power.

  **The Regress:**
  1.  Suppose I try to create Obligation $O_1$ simply by Volition $V_1$ ("I will that I am bound").
  2.  For $V_1$ to successfully create $O_1$, there must be a prior normative fact $N_1$ that says: *"Volitions of type $V$ create Obligations of type $O$."*
  3.  But where does $N_1$ come from? If $N_1$ is a natural fact, it must also be willed or established.
  4.  If I try to establish $N_1$ by a prior Volition $V_2$ ("I will that my volitions create obligations"), then $V_2$ requires a prior normative fact $N_2$ that gives $V_2$ the power to create norms.
  5.  **Result:** "The new volition has for object a new obligation... without any termination."

  **The "Willing the Volition" Charge:**
  When Hume says, *"we shou'd in effect will the volition,"* he means:
  If the *only* thing making your promise binding is your will, then the object of your will is **the efficacy of your will**.
  *   I will $X$.
  *   What makes $X$ binding? My willing it.
  *   So, what am I really willing? I am willing that **my willing counts**.
  *   But for "my willing counting" to be a coherent object of the will, there must already be a rule that makes it count.
  *   Therefore, the will is trying to pull itself up by its own bootstraps. It is trying to be the *cause* of the rule that makes it a *cause*.

  ### 3. Is this a Real Regress or a Pun?
  It is a **real structural regress**, structurally identical to the problem of **epistemic justification**.

  *   **Epistemology:** How do I justify Belief $B$? By Reason $R_1$. How do I justify $R_1$? By Reason $R_2$. If I say "I just intuit $R_1$," the skeptic asks what validates that intuition.
  *   **Hume's Promises:** How do I validate Obligation $O$? By Volition $V_1$. How do I validate $V_1$'s power to create $O$? By Norm $N_1$. How do I validate $N_1$? By Volition $V_2$...

  Hume is effectively arguing for **Normative Anti-Foundationalism** regarding the individual will. An individual mind cannot be the foundational source of its own obligations. You cannot generate an "ought" from a "will" without a prior "ought" governing the will.

  This connects directly to your LW/Decision Theory rabbit hole. In UDT or commitment races, the problem is exactly this: **How can an agent modify its own payoff function?**
  *   If you just "decide" to ignore the payoff matrix, you haven't actually changed the matrix; you've just changed your mind, which the matrix still punishes.
  *   To actually precommit, you need an **external mechanism** (burning the bridge, signing a contract, having a reputation algorithm) that changes the *causal structure* of the world, not just your internal state.
  *   Hume is saying: A "mental act" alone is internal. It cannot change the moral/causal structure of the world without external scaffolding.

  ### 4. Does this rule out *all* acts of mind?
  This is the crucial pivot. Hume thinks he has ruled out all **natural** acts of mind.
  *   **Natural Act:** A psychological state that exists in a state of nature (e.g., Robinson Crusoe alone on an island).
  *   **Artificial Act:** A psychological state that derives its force from a social system (e.g., Crusoe and Friday having a treaty).

  The regress proves that a **Natural Act of Mind** cannot constitute a promise. If you are the only human in existence, you cannot promise yourself anything in a morally binding sense, because there is no convention to ground the "willing of the obligation."

  **However**, this leaves room for the candidate Hume actually endorses: **The Act of Mind + Convention.**
  Hume isn't saying "no mental act is involved." He is saying "the mental act is insufficient *on its own*."
  *   The mental act is: Intending to participate in a convention.
  *   The binding force comes from: The social utility of the convention and the pressure of public opinion.

  So, to answer your specific question: **Yes, it leaves room for another candidate.** The candidate is not a different *kind* of mental state (like a 'super-will'), but a mental state **embedded in a context**.
  *   **Rejected Candidate:** "I will that I am bound" (Solipsistic magic).
  *   **Accepted Candidate:** "I utter these words, knowing that in this society, uttering these words triggers social sanctions if I violate them."

  ### 5. Why this matters for your LW/DT tracing
  You traced this back from Parfit's Hitchhiker and commitment races. Hume's argument here is the philosophical ancestor of the insight that **precommitment requires external enforcement.**

  *   **LW/DT View:** You can't win a commitment race just by "thinking hard" about being committed. You need to change your source code, or have a reputation system, or a contract. You need to change the *game*, not just your *strategy*.
  *   **Hume's View:** You can't create an obligation just by "willing" it. You need a convention (a social technology) that makes that willing effective.

  The "regress" Hume identifies is the impossibility of **self-validating normativity**.
  *   In DT terms: An agent cannot simply assert "I am a UDT agent." The environment must be able to verify it, or the agent must be physically constrained to be one.
  *   In Hume's terms: An agent cannot simply will "I am bound." Society must be structured to enforce it, or the convention must exist to give that will meaning.

  ### Summary
  1.  **The Regress:** To will an obligation, you need a rule that says "willing creates obligations." To create *that* rule by will, you need a *higher* rule. Infinite regress.
  2.  **No Equivocation:** It relies on a metaphysical claim that relations (obligations) require external grounds, not just internal intentions.
  3.  **The Conclusion:** Promises cannot be "natural" (solitary) acts. They must be "artificial" (conventional) acts.
  4.  **The LW Connection:** This is the classic "precommitment problem." You cannot bind yourself by mere intention; you need a mechanism (convention/contract/code) that exists outside the immediate volition to make the binding stick.

  Hume wins the argument here by showing that **normative power is a social technology, not a psychological faculty.** You found the exact spot where moral philosophy turns into game theory.
