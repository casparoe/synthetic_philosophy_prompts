answer: |-
  This is one of the most famous and difficult paragraphs in all of Nietzsche, so first off: **you are not missing something obvious.** This is where Nietzsche stops doing "literary metaphor" (lambs and birds) and starts doing "hardcore metaphysics" (what actually exists in reality vs. what we imagine exists).

  To answer your main question immediately: **No, the lightning/language stuff is not a random digression.** It is actually the philosophical engine that makes the lamb/bird metaphor work. Without this argument about language and "doers," the lambs could just say, "Okay, the birds are strong, but they *choose* to be cruel, and that's why they are evil."

  Nietzsche is trying to prove that the birds **cannot choose** to be anything other than what they are.

  Here is a breakdown of what is happening in that paragraph, how the lightning connects to the lambs, and how you can use this for your response paper.

  ### 1. The Core Argument: There is no "Doer" behind the "Deed"
  Nietzsche is attacking the way human language is built. Most Indo-European languages (like English or German) are built on a **Subject-Verb** structure.
  *   *Example:* "The lightning flashes."
  *   *Grammar tells us:* There is a thing called "lightning" (the subject/doer) and it performs an action called "flashing" (the verb/deed).

  Nietzsche says this is a lie. In reality, there is no "lightning" separate from the "flash." The flash **is** the lightning. If you take away the flash, the lightning doesn't exist.

  He applies this to humans:
  *   *Grammar tells us:* "The strong man acts strongly." (Implies there is a neutral "man" who *chooses* to act strongly).
  *   *Nietzsche says:* There is no "man" separate from his actions. The strength **is** the action. There is no neutral "self" hiding behind the action waiting to decide what to do.

  ### 2. Why this destroys the Lambs' argument
  This is the connection you need for your paper.

  **The Slave Morality (Lambs) View:**
  The lambs look at the birds and say, "You are evil."
  For something to be "evil" in a moral sense, you usually have to believe the person had a **choice**. You can't blame a rock for falling on your foot, but you can blame a person for hitting you, because the person could have *chosen* not to hit you.
  The lambs believe that inside the Bird of Prey, there is a neutral "subject" (a soul, a conscience, a self) that *could* choose to be kind, but *chooses* to be cruel. They think: "Behind that beak is a free agent who decides to eat me."

  **Nietzsche's View:**
  Nietzsche uses the lightning argument to say: **There is no neutral agent.**
  Just as the lightning *is* the flash, the Bird of Prey *is* the act of predation. Strength *is* the act of overpowering.
  To ask the bird not to eat the lamb is "absurd" (as he says in the text) because it is asking the lightning not to flash. It is asking strength *not* to be strength.

  If there is no "doer" behind the deed, then there is no one to blame. You cannot hold the bird morally responsible for being a bird. Therefore, the concept of "evil" (as a moral failing) is an invention of the lambs, based on a grammatical error.

  ### 3. The "Substratum" Point
  When Nietzsche writes: *"as though behind the strong man there existed some indifferent neutral substratum, which enjoyed a caprice and option as to whether or not it should express strength."*

  He is mocking the Christian/Moral idea of the "Soul."
  *   **The Moral View:** I have a soul (neutral substratum). I have free will (caprice and option). I choose to sin or be good.
  *   **Nietzsche's View:** You are your drives. You are your biology. You are your actions. There is no little pilot inside your head steering the ship. The ship *is* the movement.

  ### 4. How to use this in your Response Paper
  Since you have a paper due Friday, here are three angles you could take that go beyond just describing the metaphor:

  **Angle A: Morality as a Linguistic Error**
  Argue that Nietzsche is suggesting "Good and Evil" are not real discoveries about the world, but side-effects of how humans speak. Because our grammar requires a "subject," we invent a "self" that is responsible for actions. The "Slave Morality" is built on this grammatical mistake. The lambs condemn the birds only because they misunderstand the nature of action.

  **Angle B: The Impossibility of Guilt**
  Focus on the phrase *"the doer is a mere appanage to the action."* (Appanage means an addition or accessory). If the doer is just an accessory, then **guilt is impossible.** You can't punish the lightning for flashing. This suggests that the entire legal and religious system of punishment is based on a fiction. The lambs want to punish the birds, but Nietzsche says nature doesn't work that way.

  **Angle C: Naturalism vs. Moralism**
  Contrast the two views of human nature.
  *   **Lambs:** Humans are moral agents who transcend nature (we can choose to be good despite our instincts).
  *   **Nietzsche:** Humans are natural forces (like lightning or birds). We are driven by instincts (will to power).
  The paragraph is Nietzsche forcing us to look at humans as *nature*, not as *moral souls*.

  ### A Note on the Translation
  You mentioned you have an early 1900s translation. That is likely the **Common** translation. It is public domain (which is why schools use it), but it is often clunky.
  *   *Your text:* "The doer is a mere appanage to the action."
  *   *Newer translation (Maudemarie Clark):* "The doer is merely a fiction added to the deed—the deed is everything."
  *   *Newer translation (Walter Kaufmann):* "There is no 'being' behind doing, effecting, becoming; 'the doer' is merely a fiction added to the deed—the deed is everything."

  If you quote it, stick to your class text, but knowing the newer phrasing might help your brain process the meaning. "Fiction added to the deed" is often clearer than "appanage."

  ### Summary for your notes
  1.  **Lightning = Strength.** The flash is not caused by the lightning; the flash *is* the lightning.
  2.  **Action = Doer.** The strong act is not caused by a "strong man"; the act *is* the strength.
  3.  **Grammar lies.** Language makes us think there is a "Subject" (I) that chooses the "Verb" (act). Nietzsche says the Verb is all there is.
  4.  **Moral Consequence.** If there is no separate "Subject" choosing to act, there is no Free Will. If there is no Free Will, the Birds cannot be "Evil." They are just being what they are. The Lambs are projecting a fantasy of choice onto the Birds to make themselves feel superior.

  This paragraph is Nietzsche pulling the rug out from under the concept of "Sin." That is why it matters. Good luck with the paper!
