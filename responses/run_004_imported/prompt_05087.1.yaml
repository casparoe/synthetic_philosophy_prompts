  Ok, this has been bugging me for weeks. I've been filling out an advance directive (yes, I'm that person who does this for fun in my 30s), and I think I've figured out that 'brain death' is basically a fake category: functionally it just means permanently and irreversibly unconscious, which is exactly the condition PVS patients are in too (Terri Schiavo was in one for over a decade), yet we call one group legally dead and keep the other on life support for years -- and the only real difference I can find is that hospitals get to harvest organs sooner once they slap the brain-death label on someone. If that's really all 'brain dead' means, why do we even need circulatory death as a separate standard, rather then just running a consciousness test on everyone? It feels like the whole thing is just a socially convenient line drawn on one continuum -- a distinction that doesn't pay rent, not doctors tracking some deeper fact about whether the person is actually gone. Everyone I've asked just says 'that's the medical/legal definition,' which isn't an argument -- so what am I actually missing?
