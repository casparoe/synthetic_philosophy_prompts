  7.  **Writing - Iteration 2 (Focusing on the "Certainty"):**
      Start with the rosary. The sound of it. Then the talk of Grandpa. She spoke of death like a travel plan. I don't share that faith. But I share the love. Her faith wasn't a shield from reality, it was her way of seeing reality. I honor that.

