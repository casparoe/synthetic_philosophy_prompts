      *   **User's Position:** Not religious. Most cousins aren't either.
      *   **Audience:** Mixed. Half the front pews are her parish (devout Catholics), rest are family/friends (mostly secular).
      *   **The Dilemma:** How to honor her faith without lying about personal beliefs or sounding like correcting her theology.
      *   **The Philosophical Conflict:** User suggested Wittgenstein (religious language games, different *kind* of belief). Friend Nadia countered with Kai Nielsen (Wittgensteinian fideism critique: Grandma believed it was *literally* true, not just an attitude; redefining it disrespects her actual conviction).
      *   **Task:** Write a 4-5 minute eulogy.
      *   **Constraint:** Do not referee the philosophical argument. Use the Wittgenstein move *only if* it works honestly; otherwise, acknowledge the limitation. Be honest, respectful, and authentic.

  2.  **Determine the Tone and Approach:**
      *   **Tone:** Respectful, loving, honest, humble, bridge-building.
      *   **Strategy:** The "Wittgenstein move" (treating faith as a framework rather than a factual claim) is risky in a eulogy because, as Nadia pointed out, it can sound condescending to the believer ("She didn't *really* mean X, she meant Y"). However, the *insight* behind it—that faith functions as a grounding force—can be used without explicitly philosophizing.
      *   **The Core Tension:** The user cannot say "I know she is with him." The user *can* say "Her certainty gave her peace," or "Her love was so strong it transcended death in her mind," or "I may not share her map, but I honor her destination."
      *   **Best Path:** Focus on the *effect* of the belief rather than the *ontology* of the belief. Acknowledge the gap between the user's view and hers without making one superior. Validate her certainty as a source of comfort and strength, which is observable fact, even if the object of that certainty is matters of faith.
      *   **Addressing Nadia's Point:** Nadia is right that Grandma believed it literally. So, the eulogy shouldn't say "It was a metaphor." It should say, "She knew it as fact. I don't see the world that way, but I saw how that knowledge sustained her." This honors the *reality of her experience* without requiring the speaker to share the *metaphysical conclusion*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the gathering, and the difficulty of the task. Establish the relationship.
      *   **The Core Memory (Grandpa):** Introduce the specific theme: her certainty about seeing Grandpa again. This is the heart of the prompt.
      *   **Navigating the Belief Gap:** This is the tricky part. Needs to be delicate.
          *   *Avoid:* "I don't believe that, but..." (Too confrontational).
          *   *Avoid:* "We all know she's in heaven..." (Dishonest for the speaker).
          *   *Aim:* "Her certainty was a gift. It shaped how she lived. I stand here in awe of that conviction, even if my own eyes see differently."
      *   **The Wittgenstein/Nielsen Nuance:** Instead of explaining language games, describe the *function* of the belief. It wasn't just a hope; it was a foundation. Acknowledge that for her, it was literal. For the speaker, it's a testament to her love.
      *   **Her Devotion:** Mention the rosary, the mass. Not as rituals, but as expressions of that love/certainty.
      *   **Closing:** Bring it back to the living. How do we carry her forward? Love, certainty, devotion.

  4.  **Refining the "Belief Gap" (Crucial Step):**
      *   I need to make sure I don't accidentally validate Nadia's fear (that I'm rewriting Grandma's belief).
      *   *Drafting thought:* "She believed she would see him." (Fact about her).
      *   *Drafting thought:* "I don't know what happens after." (Honest about me).
      *   *Drafting thought:* "But I know what that belief did for her." (Bridge).
      *   *Key Phrase:* "I cannot stand here and claim to know what she knew." (Acknowledges the gap without negating her knowledge).
      *   *Key Phrase:* "To call it 'hope' feels too weak for what she had. It was certainty." (Validates her literalism).

  5.  **Timing Check:**
