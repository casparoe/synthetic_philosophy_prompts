answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name], [Grandma's Name]'s grandson.

  Standing here, looking out at this church, I am struck by how many lives she touched. There are her friends from the parish, who prayed with her for decades. There's family, some of whom haven't seen each other in years. And there are friends who knew her simply as the woman who made sure everyone ate enough at Thanksgiving.

  If you knew Grandma, you knew her rhythm. You knew the rosary was said every night. You knew Mass was not a weekly obligation, but a weekly homecoming. Her faith wasn't a layer she put on top of her life; it was the structure underneath it.

  But the thing I keep thinking about, the thing that has stayed with me most since she died, was how she talked about Grandpa.

  As many of you know, she lost him [number] years ago. Grief changed her, but it didn't break her. And in these last few years, especially as her health began to fail, she spoke about dying not with fear, but with anticipation. She would talk about seeing him again.

  Now, I need to be honest about where I stand. I am not a religious man. Most of my generation in this family aren't. I do not share the specific certainty that Grandma held. I cannot stand here and claim to know what she knew about what comes next.

  But I also know that to call her belief a "hope" would be to misunderstand her. It wasn't a hope. It wasn't a "maybe." When she said, "I'll see him soon," she said it the way you tell me your flight leaves at 4:00 PM. It was a fact. It was a travel plan.

  For a long time, I struggled with how to honor that from where I stand. I worried that if I spoke honestly about my own lack of faith, I would diminish hers. Or worse, that I would try to soften her certainty into something metaphorical just to make it comfortable for people like me.

  But then I realized that doing that would be its own kind of dishonesty. Grandma did not deal in metaphors. She dealt in truth. She believed, literally, that love survives death. She believed, literally, that she was going to walk into a room and he would be there.

  I don't have her eyes. I can't see what she saw. But I have witnessed what that vision did. I saw how that certainty allowed her to face pain without bitterness. I saw how it allowed her to forgive easily, because she believed she was answerable to a love greater than her own grievances. I saw how it allowed her to face the end without terror.

  So, I stand here today without her faith, but with a profound reverence for what that faith built. I may not share her conviction about where she is right now, but I share her conviction about what she left behind.

  To her parish friends: Thank you for praying with her. You kept her company on the road she walked, and I know how much that meant.
  To my family: We are the evidence of her life.

  Grandma believed she was going to Grandpa. I don't know what the sky looks like from where she is now. But I know that her love is still here, in this room, in this family, in the way we treat each other when we think no one is watching.

  She lived as if love was the only thing that was real. And looking around today, seeing how many people are here to say goodbye, I find it hard to argue with her.

  Rest well, Grandma. We'll take it from here.
