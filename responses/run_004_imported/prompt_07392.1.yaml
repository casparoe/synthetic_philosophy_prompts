answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I sat in Ruth's civics class twenty years ago. But like many of you, I found that graduating from her class didn't mean graduating from her mentorship. She became a second mother to me, and to so many others.

  If Ruth were here, she would be editing this speech right now. She would tell me to cut the adjectives. She would tell me that grief is real, but sentimentality is a distraction. And she would absolutely forbid me from calling her an optimist.

  Ruth had a specific word for what she believed. She insisted on it. *Meliorist*.

  She picked it up from the pragmatist philosophers, the ones who argued that democracy isn't a monument we build and then admire. It's a method. A tool. For Ruth, meliorism meant that the world is not guaranteed to get better, but it is not doomed to get worse, either. It means that things improve only through specific, fallible, often exhausting effort. There is no arc of the moral universe bending toward justice unless we grab hold of it and bend it ourselves.

  I know for some of you, especially her family, this might sound like an excuse for her stubbornness. You remember the dinner parties where the roast got cold because Ruth turned a comment about the weather into a debate about zoning laws. You remember how she wouldn't let a statement stand unexamined.

  But those of us who were her students, especially the ones who went on to study politics or write the news, we know that wasn't stubbornness. It was practice.

  She was teaching us that democracy is not a spectator sport. It is an experimental method of shared inquiry. She believed that when we argue, we aren't fighting to win; we are testing our hypotheses against reality.

  I saw this just last night. A friend and I argued for two hours about whether this idea of democracy still works, or if it's too naive for our tribal times. We pressed each other. We revised our positions. We didn't solve the world's problems, but we parted on good terms, both of us thinking more clearly than when we started.

  That conversation was Ruth's legacy. It was evidence that her method holds up.

  Ruth never promised us that if we did the work, democracy would be safe. She never told us there was a golden age we needed to return to. She knew the history too well for that. She knew that institutions break, that people lie, and that habits of hatred are easier to form than habits of cooperation.

  But she also knew that silence is not a strategy.

  To her family: Thank you for sharing her with us. I know her need to interrogate everything could be demanding. But please know that when she challenged you, it was because she believed you were capable of reason. When she argued, it was because she believed the relationship was strong enough to withstand the truth.

  To her former students: We have our assignment. The experiment continues.

  We are not here to mourn a lost golden age. We are here to acknowledge a worker who has clocked out. The work remains. It is in the school boards, the city councils, the newsrooms, and yes, the dinner tables. It is in the willingness to listen to a reason that contradicts our own. It is in the refusal to accept that our neighbors are enemies.

  Ruth would not want us to promise that everything will be fine. She would want us to promise that we will try to make it somewhat better.

  She taught us that hope is not a feeling. It is a discipline. It is the discipline of showing up, of testing our ideas, of admitting when we are wrong, and of trying again tomorrow.

  Rest well, Ruth. We'll take it from here. We'll keep the inquiry open. We'll keep the work going.
