answer: |-
  This is a fascinating dilemma, and it is excellent that you paused to check the economics before drafting further. I must deliver some crucial news: **Your character's current argument is precisely the Mercantilist orthodoxy that David Hume famously dismantled.**

  If Robert Laidlaw argues that national wealth consists in the quantity of specie and that merchants should hoard silver to ensure a favorable balance of trade, he is not quoting Hume; he is quoting Hume's opponents (like Thomas Mun or Josiah Child). In fact, Hume's *Political Discourses* (1752), specifically the essays *Of Money* and *Of the Balance of Trade*, were written to prove that this line of thinking is not only wrong but dangerous.

  If Laidlaw is meant to be a discerning reader, having him mouth Mercantilist platons in Hume's name would be the equivalent of a modern character citing Adam Smith to justify tariffs. However, this is a fixable problem. You can keep the dramatic conflict (prudence vs. recklessness) while making Laidlaw's economics authentically Humean.

  Here is how to sharpen the reasoning so it aligns with Hume's actual texts, along with specific mechanisms and examples Laidlaw can use.

  ### 1. The Core Correction: Money is Oil, Not Wealth
  Hume's central metaphor in *Of Money* is that money is not the substance of wealth but the "oil which renders the motion of the wheels more smooth and easy." Real wealth consists of commodities, labor, and industry.

  **The Mercantilist Error:** Hoarding silver makes the nation rich.
  **The Humean Truth:** Hoarding silver raises prices, makes exports uncompetitive, and causes the silver to flow out anyway (the **Price-Specie Flow Mechanism**).

  **How Laidlaw should argue:**
  Laidlaw should not argue that keeping silver in Scotland makes the *nation* richer. He should argue that for a *private merchant*, liquidity (specie) is essential for weathering volatility, whereas tying up capital in foreign luxuries on credit creates fragility. He can use Hume to argue against **excessive credit**, not against imports per se.

  Hume was deeply skeptical of paper credit and excessive debt. In the early 1770s (leading up to the Ayr Bank crash of 1772), this was a burning issue. Laidlaw can argue that demanding silver isn't about "national wealth," but about avoiding the "feverish" instability that credit introduces into trade.

  ### 2. The Concrete Mechanism: The Water Level Analogy
  In *Of the Balance of Trade*, Hume uses a hydraulic analogy to explain why you cannot permanently hoard specie. He compares money to water in connected vessels: if you raise the water level in one (accumulate silver), it will naturally flow back down to find its level with neighboring nations because prices will rise.

  **How to use this in the scene:**
  Laidlaw can concede that the *nation* cannot hoard silver forever, but insist that the *merchant house* must not be the one left holding the bag when the water level corrects.

  > **Drafting Suggestion:**
  > "Mr. Hume teaches us that money is like water; it seeks its own level among nations. You cannot force Scotland to hold more silver than her trade warrants without prices rising and driving it out again. But, partner, while the nation is a vast ocean, we are but a single mill. If we fill our cellar with French brandy on credit while the tide turns, we drown. Hume warns that in the interval between the acquisition of money and the rise of prices, industry may flourish or fail. We must hold the silver not to enrich the Crown, but to keep our own wheels turning when the credit markets freeze."

  ### 3. The "Industry vs. Luxury" Argument
  Hume believed that trade was good because it stimulated industry and refined the arts. However, he distinguished between productive capital and consumption. Importing luxury goods (wine/brandy) on credit consumes capital that could be used to employ local labor (linen production).

  **The Humean Twist:**
  Laidlaw shouldn't say "French wine is bad." He should say "French wine on *credit* is bad because it decouples consumption from production." Hume argues in *Of Interest* that low interest rates come from abundant capital and industry, not just low money supply. By tying up their capital in inventory that doesn't generate further industry (brandy sitting in a cellar), the partners reduce their capacity to invest in the linen trade.

  ### 4. Historical Context: The Shadow of 1772
  Since your novel is set in the early 1770s, you have a golden opportunity. The **Douglas, Heron & Company (the Ayr Bank)** collapsed in 1772 due to exactly the kind of reckless credit expansion your reckless partner is proposing. Hume was alive during this period (he died in 1776) and was a vocal critic of the banking practices that led to the crash.

  Laidlaw can invoke Hume's warnings about **paper credit**. Hume argued that while paper credit can stimulate industry, when it is excessive, it drives up prices and creates a bubble that inevitably bursts, driving the specie out of the country in a panic.

  **Specific Argument for Laidlaw:**
  "Mr. Hume writes that paper credit, when pushed too far, drives away the specie. If we accept paper or credit for our linen, and then spend it on French luxuries, we are left with nothing when the panic comes. We must insist on silver not because silver is wealth, but because silver is the only anchor that holds when the storm of credit breaks."

  ### 5. Revised Dialogue Snippet
  Here is how you might rewrite the speech to be historically accurate while keeping the dramatic intent:

  > "You speak of balance as if it were a ledger to be conquered," Laidlaw said, tapping the essay bound in calf leather on his desk. "But Mr. Hume has shown us that the balance of trade is a tide, not a dam. If we flood Scotland with silver, prices rise, our linen becomes too dear for the Americans, and the silver flows back to France regardless of our wishing.
  >
  > "However, Hume also teaches that money is the oil of the machine. If we purchase French brandy on credit, we are gumming the wheels. We tie up our capital in a luxury that consumes itself, rather than in linen that reproduces value. And we do it on debt? In this climate of paper promises? Mr. Hume warns that when credit is stretched too thin, the specie vanishes in a night. I will not have this house left without oil when the lamps go out. We sell for silver, not because we would hoard it, but because silver is the only truth in a world of lies."

  ### Summary of Changes
  1.  **Drop the "National Wealth" argument:** Acknowledge that specie flows naturally and cannot be permanently hoarded by the nation.
  2.  **Focus on Private Liquidity:** Argue that while the *nation* can't hoard, the *merchant* needs cash reserves to survive credit crunches.
  3.  **Invoke the Danger of Credit:** Use Hume's skepticism of paper credit to argue against buying on credit.
  4.  **Reference the "Interval":** Hume acknowledged that changes in money supply affect prices with a lag. Laidlaw can argue they need to be prudent during that volatile "interval."

  By making this shift, Laidlaw becomes a more sophisticated character. He isn't just a protectionist; he understands the subtle mechanics of the market, which makes his caution more compelling against his partner's reckless optimism.
