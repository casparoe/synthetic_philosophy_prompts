answer: |-
  This is a profound and delicate subject, and you are right to sense that the standard "separate the art from the artist" heuristic is insufficient here. In most cases, that heuristic is a pragmatic shield against the genetic fallacy. But in Frege's case, the biography strikes at the very heart of the philosophical methodology he invented.

  The discovery of the diary (published by Gottfried Gabriel in 1993) did not just tarnish a reputation; it created a specific philosophical problem that Michael Dummett, perhaps Frege's greatest 20th-century exponent, grappled with intensely in his later years. Dummett went so far as to say that the discovery forced him to reconsider the coherence of Frege's entire project.

  Here is an outline of the implications of the diary for evaluating Frege's work, structured around your specific interest in using Frege's own anti-psychologism as a tool to distinguish between relevant and irrelevant biography.

  ### 1. The Anti-Psychologist Shield: Where Biography *Shouldn't* Matter
  To be precise, Frege's anti-psychologism was a doctrine about the **truth-conditions** of logical laws and mathematical propositions. He argued that the thought (*Gedanke*) expressed by "2 + 2 = 4" is objective; it does not reside in my mind or yours, but in a "third realm."

  *   **The Implication:** By Frege's own standards, the formal validity of the *Begriffsschrift* (concept script) and the derivations in the *Grundgesetze* are immune to his political views. A proof is valid regardless of the moral character of the prover. If we reject his logic because he was an antisemite, we are committing the genetic fallacy.
  *   **The Limit:** This shield only protects the *formal system*. It does not protect the *philosophical interpretation* of that system. Frege didn't just build a calculus; he made claims about what that calculus represented (the structure of rational thought itself). This is where the diary becomes philosophically relevant.

  ### 2. The Leak in the Foundation: Universality vs. Exclusion
  The most damaging implication of the diary concerns Frege's philosophy of language and thought, not his formal logic. Frege's project relied on the assumption that the laws of logic are the laws of *truth*, and that truth is accessible to any rational being capable of grasping thoughts.

  *   **Dummett's Critique:** Dummett argued that Frege's antisemitism and elitism contradict the **universality** required by his own philosophy. If logic describes the structure of rational thought, and rational thought is the basis for communication and shared understanding, then the community of rational agents must be open.
  *   **The Contradiction:** In the diary, Frege suggests that certain groups (Jews, socialists) are detrimental to the German *Volk* and should be stripped of rights. This implies a hierarchy of rationality or civic worth. If the "third realm" is accessible to all rational minds, but Frege privately believes a significant subset of humanity is corrupting the national body, there is a tension between his metaphysical inclusivity (anyone can grasp a thought) and his political exclusivity (some people should not count in the political sphere).
  *   **Why this matters:** It suggests that Frege's "objective" realm might not have been as neutral as he claimed. It may have been implicitly modeled on the worldview of a specific class of educated, 19th-century German academics. The diary suggests his "view from nowhere" was actually a "view from Jena, circa 1920."

  ### 3. Using Anti-Psychologism to Evaluate Biographical Relevance
  You asked if Frege's doctrine gives us principled purchase on when biography matters. Paradoxically, it does. We can use Frege's own distinction between the **psychological act of thinking** and the **objective content of thought** to categorize biographical intrusions.

  **A. Irrelevant Biography (The Context of Discovery)**
  *   *Fregean Standard:* The causal origins of a thought are psychological and subjective.
  *   *Application:* Facts about Frege's personal habits, his temper, or even the specific emotional triggers for his work are irrelevant to the *truth* of his logic. That he was grumpy or isolated does not invalidate the quantifier.
  *   *Verdict:* Dismiss biographical details that attempt to explain *why* he found a specific theorem via his mental state.

  **B. Relevant Biography (The Context of Justification & Scope)**
  *   *Fregean Standard:* The *grasp* of a thought requires a subject, and the *expression* of a thought requires language shared by a community.
  *   *Application:* If Frege's philosophical definitions rely on concepts that are contaminated by his prejudices, the biography is relevant. For example, if Frege defines "rational agency" in ways that implicitly exclude the groups he disparaged in the diary, then the biography reveals a flaw in the *philosophical architecture*, not just the man.
  *   *Verdict:* The diary is relevant insofar as it reveals that Frege failed to fully purge the "psychological" (in his sense of subjective, biased, contingent) from his own conception of the "objective." He policed psychologism in logic but allowed it to fester in his metaphysics of the subject.

  ### 4. The "Third Realm" and the *Reich*
  You mentioned the linguistic coincidence of *drittes Reich* and the *Third Reich*. While commentators (like Hans Sluga) have noted this, the deeper philosophical irony is about **access**.

  Frege's "third realm" was meant to be a sanctuary of objectivity, safe from the vagaries of human history and politics. The diary reveals that Frege did not believe human beings could actually inhabit that sanctuary equally. He envisioned a political order where rights were distributed based on ethnic/national belonging, not rational capacity.

  *   **The Implication:** The diary suggests that for Frege, the "objective" was not a universal commons, but a heritage to be guarded. This undermines the liberal enlightenment assumption that usually underpins analytic philosophy: that reason is a universal emancipator. In Frege's hands, reason was a tool for ordering the world, but the *order* he desired was hierarchical.

  ### 5. A Principled Framework for Your Piece
  To move beyond "brilliant man, ugly views," you might frame the tension as a **failure of application**. Frege succeeded in creating a method to separate objective truth from subjective judgment in mathematics, but he failed to apply that same rigor to his own social and political cognition.

  *   **The Tragedy:** The tragedy isn't just that a racist did logic. It's that the man who invented the tools to separate objective validity from subjective bias was unable to use those tools on himself. He compartmentalized. He kept the *Begriffsschrift* pure, but he allowed the *Lebenswelt* (life-world) to rot.
  *   **The Lesson for Philosophy:** The diary serves as a warning that methodological rigor in one domain (logic) does not guarantee immunity from irrationality in others (politics/ethics). It challenges the analytic assumption that being "rigorous" makes one immune to ideology.
  *   **The Verdict on the Work:** We keep the logic (it works). We keep the semantics (Sense/Reference is indispensable). But we must read Frege's *philosophical pronouncements* about the nature of thought and community with suspicion. We must acknowledge that the "objective realm" he described might bear the scars of the subjective mind that mapped it.

  ### Summary for your argument
  Frege's anti-psychologism provides the very metric by which we can condemn the influence of his biography on his philosophy. He demanded that logic be purged of the subjective. The diary proves he failed to purge the subjective from his understanding of the *community* required to sustain that logic. Therefore, the biography is not an *ad hominem* attack on the logician; it is an internal critique of the philosopher's consistency. He was not objective enough, by his own standards.

  This framing allows you to honor the magnitude of his logical contributions while treating the diary not as a scandalous footnote, but as a crucial piece of evidence regarding the limits of his philosophical project.
