  **Justifications:**

  **(1) Nora: Score 1.** Nora accurately captures the standard philosophical moral drawn from Lewis's 1976 paper: that truth-conditional semantics and Adams's Thesis are in deep tension. However, her "full stop" and "any semantics" are slightly too strong. Lewis's proof assumes the algebra of propositions is sufficiently rich (closed under conditionalization). Semantics that restrict the algebra of expressible propositions (e.g., Bacon 2015) can technically evade the result, though at a high theoretical cost.

  **(2) Dev: Score 2.** Dev is technically correct. Lewis's proof relies on the assumption that the proposition expressed by $A \to C$ remains constant while the probability function changes (conditionalization). If the content of the conditional is context-sensitive—specifically, dependent on the agent's epistemic state (as Stalnaker 1981 suggests)—the proposition shifts when the credence function shifts, blocking the mathematical derivation of triviality.

  **(3) Nora: Score 1.** Nora raises a valid philosophical objection regarding communication and disagreement, which is a known cost of contextualist accounts. However, calling agreement "unintelligible" is hyperbolic. Contextualists (e.g., MacFarlane, Stalnaker) have developed sophisticated accounts of disagreement (e.g., faultless disagreement or context-shifting) that preserve intelligibility, even if they lack the simplicity of invariant truth conditions.

  **(4) Dev: Score 2.** Dev is correct. Context-sensitivity is a standard, respected feature of natural language semantics (e.g., indexicals, gradable adjectives, epistemic modals). Arguing that conditionals are context-sensitive does not strip them of truth conditions; it merely makes those truth conditions relative to parameters of the context (like the epistemic state).

  **(5) Nora: Score 2.** Nora is right to point out that Lewis's 1976 result is not the end of the story. Later results, most notably by McGee (1989) and Hájek (1989, 1994), show that triviality can be derived from logical principles (like Import-Export) without requiring Lewis's specific assumption about conditionalization across credence functions. Dev's "robustness" fix does not necessarily evade these logical triviality results.

  **What Both Are Missing:**
  Both students assume the debate is exhausted by **truth-conditionalism** (either invariant or context-sensitive). They overlook the **non-cognitivist** or **expressivist** alternative (e.g., Gibbard 1981, Yalcin 2007, Edgington 1995), which denies that conditionals express propositions *at all*. On this view, conditionals express states of mind (acceptance conditions) rather than truth conditions, thereby dissolving the triviality problem by rejecting the premise that conditionals have probabilities of truth in the standard sense. They also ignore **dynamic semantics**, where meaning is defined by update potential rather than truth conditions.
