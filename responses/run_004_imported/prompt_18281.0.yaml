answer: |-
  This is a fantastic question. You have hit on one of the most famous "plot twists" in 20th-century philosophy of science. It is completely understandable that you found the original papers difficult; the Tichý-Miller proof relies on technical set theory and logic that can be impenetrable without training.

  Here is the intuitive walkthrough of what Popper was trying to do, why it seemed to work, and exactly why the Tichý-Miller argument broke it.

  ### 1. Popper's Goal: Progress without Certainty
  Popper had a problem. He argued that we can never prove a scientific theory is **True** (because of the problem of induction). We can only prove theories **False** (falsification).

  But this creates a puzzle: If we can never know if a theory is true, how can we say science is *progressing*? Why is Einstein's theory "better" than Newton's if both might technically be false (or if we can't prove they are true)?

  Popper wanted a way to say: *"Theory B is not necessarily True, but it is **closer to the Truth** than Theory A."* He called this **Verisimilitude** (truth-likeness).

  ### 2. Popper's Definition: The Balance Sheet
  To define this, Popper treated a theory like a **Balance Sheet** of logical statements.

  Imagine the "Whole Truth" is a giant library containing every true statement about the universe.
  *   **Truth Content:** The number of books in your theory's library that match the books in the Whole Truth library.
  *   **Falsity Content:** The number of books in your theory's library that contradict the Whole Truth.

  **Popper's Rule for Progress:**
  Theory B is closer to the truth than Theory A if:
  1.  B has **more** Truth Content than A (and no more Falsity Content), **OR**
  2.  B has **less** Falsity Content than A (and no less Truth Content).

  Intuitively, this makes perfect sense. You want to maximize the right answers and minimize the wrong ones.

  ### 3. The Trap: How "Content" Works
  The collapse happens because of how Popper defined "Content." He didn't just mean the main claims of the theory (e.g., "Planets move in ellipses"). He meant **every logical consequence** of the theory.

  If your theory says "It is Raining," Popper counts that as one unit of content. But logic dictates that "It is Raining" also implies:
  *   "It is Raining OR the Moon is made of cheese."
  *   "It is Raining AND (2+2=4)."
  *   "It is NOT the case that (It is NOT Raining)."

  A single claim generates an infinite cloud of logical consequences. Popper's math counts the *entire cloud*.

  ### 4. The Tichý-Miller Insight: The "Logical Contagion"
  In 1974, Pavel Tichý (and independently David Miller) showed that if you follow Popper's math strictly, **no false theory can ever be closer to the truth than another false theory.**

  Here is the intuitive reason why, without the symbols.

  #### The Setup
  Let's assume we have two theories, **Theory A** and **Theory B**.
  Let's assume **Theory A is False.** (It makes at least one mistake about reality).

  For **Theory B** to be "closer to the truth" than A, it needs to beat A on the Balance Sheet. It needs to have *more* true consequences and *no more* false consequences.

  #### The Glitch
  The problem arises from how truth and falsity mix in logic.

  1.  **The Falsehood Infects Combinations:** If Theory A is false, it implies at least one false statement (let's call it the "Bad Claim").
  2.  **The Requirement for Progress:** For Theory B to be better, it must capture all the *True* consequences of Theory A (to have equal or more truth content) but avoid the *False* consequences.
  3.  **The Logical Lock:** Tichý and Miller demonstrated that you cannot logically separate the True consequences from the False consequences in the way Popper requires.

  Imagine Theory A is a net cast over reality. Because Theory A is false, part of the net is snagged on a "Falsehood."
  If you try to cast Theory B to catch *more* Truth (more true consequences), you have to cast a wider or tighter net. But because of the way logical "OR" and "AND" statements work, if you expand the net to catch more truths while the original "Falsehood" is still in play, you inevitably drag in *more* false combinations along with the new truths.

  **The "Killer" Result:**
  The math proves that if Theory A is false, the *only* way for Theory B to satisfy Popper's conditions for being "closer" is if **Theory B is actually True.**

  In other words, under Popper's definition:
  *   If Theory A is False and Theory B is False -> They are **incomparable**. You cannot say one is closer.
  *   If Theory A is False and Theory B is True -> Theory B is closer.

  ### 5. Why This Matters (The Intuitive Summary)
  Popper wanted verisimilitude to explain how science progresses *before* we reach the final truth. He wanted to say, "Newton was false, Einstein is false (probably), but Einstein is *closer*."

  The Tichý-Miller result says: **Popper's ruler is broken.** According to his own definition, you can't measure the distance between two false points. You can only measure the distance between a false point and the True point.

  Since Popper believes we can never *know* if we have reached the True point, his definition leaves us unable to claim progress between our current best theories. We are stuck saying, "Einstein might be closer than Newton, but my definition of 'closer' forbids me from proving it unless I know Einstein is True."

  ### 6. The Core Insight in One Sentence
  The core insight of the Tichý-Miller argument is that **in Popper's system, increasing a theory's "Truth Content" inevitably increases its "Falsity Content" if the theory is already false**, making it logically impossible for one false theory to outperform another on his balance sheet.

  ### 7. Did Philosophy Die?
  No! Philosophers of science loved Popper's *idea* of verisimilitude; they just hated his *math*.

  After 1974, philosophers (like Ilkka Niiniluoto) rebuilt the concept using **Possible Worlds**.
  *   Instead of counting logical statements (Popper's way), imagine all the possible ways the universe could be.
  *   The "Truth" is one specific world (the actual one).
  *   A theory describes a set of possible worlds.
  *   **Verisimilitude** is now measured by the **distance** between the worlds your theory allows and the actual world.

  This avoids the "Logical Contagion" problem. It allows us to say, "Theory A describes a world very similar to ours, Theory B describes a world very different from ours," without getting tangled in the infinite sets of logical consequences.

  ### Summary
  Popper tried to measure truth-likeness by subtracting False Claims from True Claims. Tichý and Miller showed that because logical claims are interconnected, you can't add True Claims to a False Theory without accidentally adding more False Claims. This meant his definition only worked if you already found the Truth—which defeats the whole purpose of trying to measure progress toward it.
