  I've been reading through some of Popper's philosophy of science, and while his falsifiability criterion makes intuitive sense to me, I got curious about his related notion of "verisimilitude" -- his attempt to explain how science can be said to progress toward the truth even though, on his own falsificationist view, we can never be sure that any theory we currently hold is true. As I understand it, Popper's original formal definition of verisimilitude (built from a theory's "truth content" and "falsity content") turned out to be fatally broken: a 1974 result usually attributed to Tichý and Miller shows that under his definition, no false theory can ever come out more verisimilar than another false theory. I don't have a background in formal logic, and the papers I've tried to read on this are tough going. Could you walk me through, in an intuitive rather than symbol-heavy way, why Popper's definition collapses like this, and what the core insight behind the Tichý-Miller argument is?
