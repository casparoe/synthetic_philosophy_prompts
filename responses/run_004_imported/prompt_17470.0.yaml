prompt: |-
  Next week I'm moderating our department colloquium and the speaker has built her whole career defending Hanson-style futarchy -- "vote on values, bet on beliefs." I dont want the Q&A to just turn into her replaying the TED-talk pitch, so can you draft 8-9 interview questions that actually press on the mechanics? I want at least one on whether the values/beliefs split even survives the fact that picking the welfare metric (GDP, some happiness index, whatever) is already a values choice and not a neutral yardstick, one that makes her reckon with that DARPA-funded "terrorism futures" market that got killed within days back in 2003 as a test case for political feasibility, and one on what actually stops a deep-pocketed trader from just buying the policy outcome they want once the market's thin. For each, flag the dodge she's most likely to reach for and give me a follow-up that closes it off.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Context:** Department colloquium moderation.
      *   **Speaker:** Defends Hanson-style futarchy ("vote on values, bet on beliefs").
      *   **Goal:** Avoid generic TED-talk rehash; press on *mechanics* and *critical weaknesses*.
      *   **Quantity:** 8-9 interview questions.
      *   **Specific Requirements:**
          *   One question on the values/beliefs split (specifically regarding the welfare metric selection).
          *   One question on the DARPA "Policy Analysis Market" (PAM)/"Terrorism Futures" scandal (political feasibility).
          *   One question on market manipulation/capital concentration (deep-pocketed traders).
          *   For *each* question: Flag the likely dodge and provide a follow-up to close it off.
      *   **Tone:** Professional, rigorous, academic but sharp (moderator role).

  2.  **Deconstruct Futarchy (Hanson-style):**
      *   *Core Mechanism:* Democracy decides the utility function (values); Prediction markets decide which policies maximize that function (beliefs).
      *   *Key Weaknesses:*
          *   Defining the utility function (GDP? Happiness? Inequality?).
          *   Market manipulation/liquidity issues.
          *   Incentive compatibility (do traders actually profit from truth or just volatility/manipulation?).
          *   Implementation/Transition costs (how do we get there from here?).
          *   Ethical/Externalities (what about rights not captured in the metric?).
          *   Historical precedent (PAM failure).
          *   Information asymmetry (insider trading vs. public good).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Values/Beliefs Split (Welfare Metric).*
          *   *Draft:* Isn't picking GDP a value judgment?
          *   *Refinement:* Make it sharper. The separation is the core theoretical claim. If the metric is contested, the separation fails.
          *   *Dodge:* "We can vote on the metric."
          *   *Follow-up:* "Voting on the metric *is* the policy decision, rendering the market redundant on the most critical axis."

      *   *Requirement 2: DARPA/PAM (Political Feasibility).*
          *   *Draft:* What about the 2003 terrorism market?
          *   *Refinement:* Focus on the *mechanism of failure*. It wasn't just moral outrage; it was the realization that markets price in success of bad events.
          *   *Dodge:* "That was a specific application, not the general system."
          *   *Follow-up:* "If the mechanism triggers moral hazard on existential risks, how is that different for climate or war policy?"

      *   *Requirement 3: Market Manipulation/Capital.*
          *   *Draft:* What if a rich person buys the outcome?
          *   *Refinement:* Focus on thin markets and the cost of manipulation vs. cost of policy.
          *   *Dodge:* "Manipulation is unprofitable because truth wins eventually."
          *   *Follow-up:* "Policy windows aren't 'eventually.' If I move the price during the decision window, I win, even if I lose money later."

      *   *Question 4: Liquidity/Subsidization.*
          *   *Focus:* Prediction markets need liquidity to work. Who pays?
          *   *Dodge:* "Market makers will do it."
          *   *Follow-up:* "Without subsidized liquidity, spreads are too wide for precise policy guidance."

      *   *Question 5: Insider Trading/Information Hiding.*
          *   *Focus:* If I know a policy will fail, do I bet against it or tell the government?
          *   *Dodge:* "Incentives align to reveal truth."
          *   *Follow-up:* "If revealing the truth kills the policy (and the market), do I profit more from the crash or the prevention?"

      *   *Question 6: Time Horizons/Discounting.*
          *   *Focus:* Markets are short-term. Policy is long-term.
          *   *Dodge:* "We can have long-term contracts."
          *   *Follow-up:* "Discount rates in markets are higher than social discount rates. How do you prevent under-investment in the future?"

      *   *Question 7: The "Vote on Values" Mechanism.*
          *   *Focus:* How often do we vote? Can we change values mid-stream?
          *   *Dodge:* "Constitutional constraints."
          *   *Follow-up:* "If values are fixed, how do we adapt to moral progress (e.g., civil rights) that wasn't in the original utility function?"

      *   *Question 8: Causal Inference/Counterfactuals.*
          *   *Focus:* Markets price *correlation*. Policy needs *causation*.
          *   *Dodge:* "Conditional markets (If X then Y)."
          *   *Follow-up:* "How do you distinguish the policy effect from the confounding variables in a single realization of history?"

      *   *Question 9: Implementation/Transition.*
          *   *Focus:* How do we switch?
          *   *Dodge:* "Gradual adoption."
          *   *Follow-up:* "Hybrid systems create arbitrage between the market logic and bureaucratic logic. How do you manage that friction?"

  4.  **Review and Refine:**
      *   Check against constraints: 8-9 questions? Yes. Specific topics covered? Yes. Dodges and Follow-ups included? Yes.
      *   Tone check: Ensure it sounds like a moderator, not an attacker, but still rigorous. Use phrases like "Pushing on the mechanics..." or "A practical constraint..."
      *   Ensure the "Dodge" and "Follow-up" are distinct and actionable for the moderator.

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Values" question explicitly mentions GDP/Happiness as requested.
      *   *Correction:* Ensure the DARPA question mentions the 2003 timeline/context.
      *   *Correction:* Ensure the Manipulation question mentions "thin markets."
      *   *Formatting:* Use bolding for clarity so the user can read it easily during the event.

  6.  **Final Output Generation:** (Proceed to generate response based on these steps.)
answer: |-
  Here are 9 questions designed to move past the high-level pitch and interrogate the mechanical viability of futarchy. Each includes the likely evasion and a scripted follow-up to keep the pressure on.

  ### 1. The Welfare Metric (Values vs. Beliefs)
  **Question:** "The core promise of futarchy is the separation of values from beliefs. But selecting the welfare metric itself—whether it's GDP, a happiness index, or Gini coefficient—is inherently a normative value judgment, not a neutral yardstick. If the market optimizes for a metric that the population didn't fully understand when they voted for it, isn't the 'belief' market effectively hijacking the 'value' vote?"

  *   **Likely Dodge:** "That's why we vote on the metric democratically first. The market only serves the will of the people."
  *   **Follow-up:** "But once the metric is set, the market determines the policy. If the market finds a loophole that maximizes GDP while destroying social cohesion, the mechanism forces that outcome. At what point does optimizing the *proxy* violate the *value* it was supposed to measure, and who has the veto power?"

  ### 2. The DARPA Precedent (Political Feasibility)
  **Question:** "I want to look at the 2003 DARPA Policy Analysis Market. It was shut down within days not because the math failed, but because the mere existence of a market on geopolitical stability was politically toxic. If futarchy requires public trust to function, how do you reconcile the mechanism with the public's visceral rejection of monetizing existential risk?"

  *   **Likely Dodge:** "That was a specific application to terrorism. General governance markets are different and less sensitive."
  *   **Follow-up:** "But the mechanism is identical: pricing the probability of adverse events. If a futarchy market prices in a high probability of a recession or a war due to a proposed policy, doesn't that price signal itself trigger the panic it's predicting, creating a self-fulfilling prophecy that destabilizes the government?"

  ### 3. Capital Concentration & Manipulation
  **Question:** "Prediction markets rely on the wisdom of crowds, but policy markets will inevitably be thin compared to currency or equity markets. What mechanically stops a deep-pocketed actor from simply buying the policy outcome they want? If the cost to manipulate the market is lower than the value of the policy to a special interest group, the 'belief' becomes a commodity."

  *   **Likely Dodge:** "Manipulation is unprofitable because informed traders will bet against the lie and correct the price."
  *   **Follow-up:** "Informed traders only care about the price at the settlement time. Policy decisions happen on a legislative timeline, not a market settlement timeline. If I can move the price enough to trigger the policy *today*, I win the policy even if I lose the bet next year. How do you insulate the decision window from the settlement window?"

  ### 4. Causal Inference vs. Correlation
  **Question:** "Markets are excellent at pricing correlations, but policy requires causal inference. If a market prices a policy as successful, it might be because the policy works, or because it correlates with an external boom. How does the mechanism distinguish between a policy that *causes* growth and one that merely *coincides* with it, especially when we only get one realization of history?"

  *   **Likely Dodge:** "We use conditional markets: 'If Policy A passes, what is X?' vs 'If Policy A fails, what is X?'"
  *   **Follow-up:** "But those are two different counterfactual worlds. Without a control group, you're relying on the market to simulate a causal model. Aren't you just outsourcing econometric identification problems to traders who may not have the data to distinguish noise from causality?"

  ### 5. Liquidity Subsidization
  **Question:** "For these markets to yield accurate signals, they need deep liquidity. In financial markets, liquidity comes from hedging needs. In policy markets, the 'hedgers' are the citizens, who can't easily hedge against their own government. Are you proposing state-subsidized market making, and if so, doesn't that introduce a fiscal cost that outweighs the efficiency gains?"

  *   **Likely Dodge:** "Liquidity will emerge naturally because the information value is so high."
  *   **Follow-up:** "Empirical evidence from existing prediction markets suggests they remain thin without subsidies. If the state has to subsidize the liquidity to make the system work, isn't that an implicit admission that the market isn't efficient enough to stand on its own as a decision engine?"

  ### 6. Time Horizons and Discounting
  **Question:** "Financial markets apply high discount rates to future payoffs. Public policy often requires investment with payoffs 50 or 100 years out, like climate infrastructure. Won't a futarchy system systematically undervalue long-term goods because the market discount rate will always exceed the social discount rate?"

  *   **Likely Dodge:** "We can create long-term contracts or trust structures to extend the horizon."
  *   **Follow-up:** "But the traders participating in those contracts still have short time horizons and capital costs. Unless the state guarantees the payout decades later, the price signal will decay. Are you effectively asking the government to insure the market against its own short-termism?"

  ### 7. Insider Information and Whistleblowing
  **Question:** "Consider a bureaucrat who knows a policy is secretly flawed. In a futarchy, they could profit by shorting the policy. But if they do, they reveal their insider knowledge and potentially tank the policy's implementation. Does this create a perverse incentive to stay silent, let the policy fail, and collect the payout, rather than fix the problem?"

  *   **Likely Dodge:** "The profit incentive encourages them to reveal the information so the policy can be fixed."
  *   **Follow-up:** "Only if fixing the policy is more profitable than the crash. If the policy failure is catastrophic, the trader profits more from the crash than the salvage. How do you align the profit motive with the public good when the 'short' position is the morally hazardous one?"

  ### 8. The "Vote on Values" Rigidity
  **Question:** "You propose we vote on values, but moral progress often happens because marginalized groups challenge the existing utility function. If the welfare metric is locked in by a majority vote, doesn't futarchy institutionalize the status quo's values? How does the system allow for moral evolution if the 'values' module is treated as a fixed constraint for the markets?"

  *   **Likely Dodge:** "The values vote can be updated periodically, just like elections."
  *   **Follow-up:** "But between those votes, the market is optimizing ruthlessly for the old metric. If the market entrenches power structures that make changing the metric harder (e.g., by maximizing GDP in a way that increases voter suppression), the mechanism protects itself from reform. Where is the escape hatch?"

  ### 9. Implementation Friction (Hybrid Systems)
  **Question:** "We aren't going to switch to full futarchy overnight. In a hybrid system where prediction markets advise but bureaucrats decide, you create an arbitrage opportunity. If the market says 'Policy A works' but the bureaucrat chooses 'Policy B,' who takes the blame? Doesn't this ambiguity allow decision-makers to use the market as a scapegoat rather than a guide?"

  *   **Likely Dodge:** "We start with advisory markets to build trust before binding them."
  *   **Follow-up:** "Advisory markets have no skin in the game, so they lose the very information-forcing mechanism that makes futarchy unique. If the market isn't binding, it's just a poll. If it is binding, it removes accountability from the leader. How do you resolve that tension in a transition phase?"
