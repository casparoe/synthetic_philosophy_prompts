answer: |-
  **Instructor's Note:** *The following dialogue is intended as a supplement to our unit on Two-Dimensional Semantics. It focuses specifically on the tension between the Chalmers/Jackson framework and the Soames-style Millian critique. Note that neither participant "wins." The goal is to map the dialectical stalemate that currently defines the literature.*

  ***

  **Setting:** *Office hours. Two graduate students, ALEX (pro-Two-Dimensionalism) and JORDAN (pro-Millian Direct Reference), are hashing out the midterm essay prompts over coffee.*

  **Jordan:** I'm stuck on the essay prompt about the necessary a posteriori. Specifically, I can't shake Soames' worry. You've been defending the Chalmers line in section, but I feel like the primary/secondary distinction is just Kripkean descriptivism with extra steps.

  **Alex:** It's not descriptivism, though. That's the whole point. Kripke showed names aren't synonymous with descriptions. Two-dimensionalism (2D) agrees. The primary intension isn't the *meaning* of the name in the sense of what it contributes to the proposition expressed. It's a function from epistemically possible scenarios to extensions.

  **Jordan:** Okay, but functions don't grow on trees. What determines the output of that function? Take "Hesperus is Phosphorus." We agree it's necessary a posteriori. On the secondary intension—the metaphysical modal profile—both terms pick out Venus in all worlds. So the proposition is singular, necessary, and a posteriori. Fine. But you say the *primary* intension differs. In some epistemically possible scenario, Hesperus isn't Phosphorus. What makes that scenario one where Hesperus isn't Phosphorus?

  **Alex:** It's about how the reference is fixed in that scenario. In the actual world, "Hesperus" is fixed by "the bright star seen in the evening," and "Phosphorus" by "the bright star seen in the morning." In an epistemically possible scenario, the object satisfying the evening description is distinct from the object satisfying the morning description.

  **Jordan:** There it is. "Fixed by." You're smuggling in a description. And if you do that, you inherit Kripke's ignorance and error arguments. Suppose I don't know Hesperus is the evening star. Maybe I think it's a planet visible at noon. Or suppose the community is wrong—maybe Hesperus is actually a cluster of stars, not a single object. If the primary intension relies on "the evening star," then my use of "Hesperus" refers to nothing, or refers to the wrong thing. But intuitively, I still refer to Venus.

  **Alex:** But the 2Dist isn't saying the speaker *knows* the description. It's not a psychological state. It's a semantic rule for evaluating the term across epistemic space. It's about the *reference-fixing condition*, not a synonym.

  **Jordan:** Soames' point is that distinction collapses under pressure. If the reference-fixing condition isn't known by the competent speaker, how does it constrain *epistemic* possibility? The whole motivation for the primary intension is to capture the *a posteriori* nature of the identity—to explain why it was a discovery. If the speaker doesn't grasp the condition, how does it explain the cognitive significance?

  **Alex:** Because the primary intension captures the *way* the world must be for the sentence to be true, given how we actually use the terms. It models the epistemic gap. Before the discovery, it was epistemically possible that the evening object $\neq$ the morning object. The primary intension tracks that.

  **Jordan:** Okay, let's grant that it tracks it. Does it explain it? Here's the bind: If you make the primary intension robust enough to distinguish Hesperus from Phosphorus (e.g., "the evening star" vs. "the morning star"), you violate the rigidity intuition and fall prey to error cases. But if you strip it down to avoid error—say, "the object causally connected to my use of 'Hesperus'"—then the primary intension of "Hesperus" and "Phosphorus" might be identical. They both mean "the object causally connected to this usage."

  **Alex:** Not necessarily. The causal chains are distinct.

  **Jordan:** But if the primary intension is just "the object at the end of *this* causal chain," then in an epistemically possible scenario where the chains converge on different objects, sure, they come apart. But then look at "Hesperus is Hesperus." The primary intension of that should be true in all scenarios, right?

  **Alex:** Yes. It's epistemically necessary.

  **Jordan:** But if the primary intension is just a thin causal hook, why is "Hesperus is Phosphorus" epistemically contingent? If both names are just hooks to whatever object is causally linked, and it turns out they link to the same object, isn't the primary intension of the identity claim just "The object linked to chain A is the object linked to chain B"? That's contingent. But you want to say the *sentence* expresses a primary intension that is false in some scenarios.

  **Alex:** Exactly. That's how we capture the informativeness.

  **Jordan:** But then you're admitting the primary intension isn't about the *names* themselves, it's about the *descriptions associated with the causal chains*. And we're back to square one: does the ordinary speaker have access to those descriptions? If I say "Hesperus," and I have no idea about the causal history, am I incompetent?

  **Alex:** No, you're just deferring. The community fixes the reference.

  **Jordan:** Okay, so the primary intension is externalist. It depends on facts about the community's usage. But if it depends on external facts, how is it "epistemic"? Epistemic possibility is supposed to be knowable a priori, or at least tied to rational conceivability. If I can't know the reference-fixing facts a priori, how can I evaluate the primary intension a priori?

  **Alex:** You evaluate it by considering the scenario *as actual*. You ask, "If this scenario turned out to be the actual world, would 'Hesperus' refer to X?" You don't need to know the causal history of the actual world to do that. You just need to know how the term *would* latch on in that counterfactual scenario.

  **Jordan:** But *how* it latches on is determined by... what? If you say "by the description 'evening star'," you're a descriptivist. If you say "by the causal chain," you're relying on facts the speaker doesn't know. If you say "by the object the speaker intends," you're vulnerable to error (maybe they intend the wrong object).

  **Alex:** This is the Soames objection, I know. The claim is that 2Dism tries to have its cake and eat it too. It wants the epistemic flexibility of descriptivism without the semantic commitment.

  **Jordan:** Right. And Soames argues you can't have it. Either the primary intension is a genuine component of the semantic content, in which case "Hesperus is Phosphorus" expresses a descriptive proposition, which Kripke refuted. Or, the primary intension is *not* semantic content, in which case it's just a pragmatic or psychological gloss. If it's just psychological, it doesn't solve the philosophical problem of the necessary a posteriori; it just describes our confusion.

  **Alex:** But that's too harsh. Even if the primary intension isn't the *proposition expressed*, it's the *proposition diagonalized*. It captures the cognitive role. Frege wanted to explain why "Hesperus is Phosphorus" is informative while "Hesperus is Hesperus" is not. Millianism can't do that. It says both express the same singular proposition: $\langle \text{Venus, Venus, Identity} \rangle$.

  **Jordan:** Millianism bites the bullet. We say the *semantic content* is the same, but the *guises* or *ways of believing* differ. We don't need to reify the guise into a semantic intension.

  **Alex:** But then you lose the link between meaning and modality. If the primary intension doesn't reflect meaning, why does it track epistemic possibility?

  **Jordan:** Maybe it doesn't track *epistemic* possibility in a deep sense. Maybe it just tracks *metaphysical* possibility under a description. When you say "It's epistemically possible that Hesperus isn't Phosphorus," you really mean "It's metaphysically possible that the evening star isn't the morning star." You're quantifying over worlds where the *descriptions* come apart, not worlds where the *names* come apart.

  **Alex:** But that's exactly what 2Dism formalizes! The primary intension *is* the mapping of those descriptions across worlds.

  **Jordan:** Sure, but then the primary intension belongs to the *descriptions*, not the names. You haven't saved the names from Millianism; you've just admitted the names are associated with descriptions that do the modal work. And if the names are associated with descriptions, Kripke wins. The name "Hesperus" refers to Venus even if Venus isn't the evening star. So the primary intension fails to track the reference in error cases.

  **Alex:** Unless we define the primary intension more abstractly. Not "the evening star," but "the object playing the Hesperus-role."

  **Jordan:** "The Hesperus-role"? Now you're being metalinguistic. "The object called 'Hesperus'."

  **Alex:** Not called. The object that stands in the appropriate causal relation to the name.

  **Jordan:** Okay, so in a scenario where the object called 'Hesperus' is Mars, and the object called 'Phosphorus' is Jupiter, the primary intension of "Hesperus is Phosphorus" is false. Fine. But now compare "Hesperus is Hesperus." In that same scenario, "The object called 'Hesperus' is the object called 'Hesperus'" is true. So the primary intensions differ.

  **Alex:** Exactly! That's how we distinguish the cognitive significance.

  **Jordan:** But at what cost? You've reduced the primary intension to a metalinguistic description: "The bearer of 'Hesperus'." If that's the primary intension, then "Hesperus is Phosphorus" means "The bearer of 'Hesperus' is the bearer of 'Phosphorus'." That is a contingent truth. It's true in the actual world, but false in the scenario where they bear different names.

  **Alex:** Right, that's why it's a posteriori.

  **Jordan:** But it's not *necessary*. You wanted to explain how "Hesperus is Phosphorus" is necessary yet a posteriori. The secondary intension is necessary. The primary intension is contingent. But the primary intension is supposed to capture the *epistemic* status. If the primary intension is contingent, then in the scenario where Hesperus $\neq$ Phosphorus, is the sentence "Hesperus is Phosphorus" false?

  **Alex:** Yes, relative to that scenario considered as actual.

  **Jordan:** But if it's false in that scenario, then it's not necessary. You've split the sentence into two propositions. One is necessary (secondary), one is contingent (primary). You haven't explained how *one* proposition can be necessary a posteriori. You've just said there are two different propositions. The Millian says there's only one proposition (the singular one), and it's necessary a posteriori. You're saying there's a necessary proposition and a contingent one.

  **Alex:** I'm saying the sentence *expresses* the necessary one, but *asserts* the contingent one in epistemic contexts.

  **Jordan:** That's the "two-proposition" view. Soames argues this is ad hoc. Why think the sentence asserts the primary intension? When I say "Hesperus is Phosphorus," I'm not saying "The bearer of 'Hesperus' is the bearer of 'Phosphorus'." I'm saying *Venus is Venus*. The fact that I learned it a posteriori is a fact about *me*, not about the sentence's intension.

  **Alex:** But if it's just a fact about you, why is it universal? Why is it a posteriori for *everyone*?

  **Jordan:** Because everyone needs empirical evidence to link the name to the object. But once linked, the content is singular. Your primary intension is a crutch for people who haven't fully grasped the reference.

  **Alex:** That seems elitist. The semantic content shouldn't depend on how much astronomy I know.

  **Jordan:** It doesn't. The semantic content is Venus. The primary intension is a heuristic for finding Venus. But a heuristic isn't meaning. If I use a map to find the library, the map isn't the library. 2Dism treats the map as part of the territory.

  **Alex:** But without the map, we can't explain the rationality of the discovery. If the content was just $\langle \text{Venus, Venus} \rangle$, discovering it would be like discovering Venus is Venus. That's trivial.

  **Jordan:** We explain the non-triviality via *guises* or *files*, not semantic intensions. We keep semantics clean (Millian) and put the cognitive work in psychology. 2Dism tries to do the cognitive work in semantics, and that's where it gets tangled in descriptions.

  **Alex:** And Millianism leaves the modal profile of our *knowledge* unexplained. It says we know a necessary truth, but it feels contingent. 2Dism explains why it feels contingent: because the primary intension *is* contingent.

  **Jordan:** It explains the feeling, sure. But does it explain the *fact*? Or does it just reclassify the feeling as a different kind of truth? If I say "Water is H2O," and you tell me there's a world where the watery stuff isn't H2O, I agree. But that's a world where "water" refers to XYZ. In that world, "Water is H2O" is false. But in *our* world, it's necessary. Your primary intension just shifts the reference to XYZ in that other world. It doesn't show that *our* truth is contingent. It shows that *their* truth (in the XYZ world) is different.

  **Alex:** That's the "considered as actual" vs. "considered as counterfactual" distinction.

  **Jordan:** Which is a distinction in how we *evaluate* the sentence, not in the sentence's content. Soames' charge is that 2Dism conflates context of utterance with circumstance of evaluation.

  **Alex:** Maybe. But it's a useful conflation. It systematizes the epistemic data.

  **Jordan:** It systematizes it by positing a layer of content that behaves exactly like the descriptivism Kripke killed. You've reheated the meal and called it "primary intension."

  **Alex:** And you've thrown out the baby with the bathwater. You have a semantics that can't distinguish "Hesperus is Phosphorus" from "Hesperus is Hesperus" without appealing to extra-semantic psychology.

  **Jordan:** Better extra-semantic psychology than bad semantics.

  **Alex:** Better complex semantics than no explanation of cognitive significance.

  **Jordan:** So we're back to the stalemate.

  **Alex:** Looks like it. You think 2Dism is descriptivism in a tuxedo. I think Millianism is semantics without a mind.

  **Jordan:** Pass the coffee. I need to write an essay that argues both sides are doomed.

  **Alex:** I'll grade it harshly if you don't acknowledge the diagonal proposition.

  **Jordan:** I'll grade it harshly if you don't acknowledge the ignorance objection.

  **Alex:** Deal.
