      Marcus: "And I say a stage without actors is a ghost."
      Elena: "But the actors need a stage to stand on."
      Marcus: "Then we agree the dance matters, not the floor."
      Elena: "And I say the floor makes the dance possible."
      *Better:* Make it more precise.
      Marcus: "Your 'structural individuation' collapses into my field ontology."
      Elena: "Only if you ignore the topological prerequisites."
      Marcus: "Which are mathematical, not physical."
      Elena: "Mathematics describes physical structure."
      Marcus: "Agreed. So we agree on the physics."
      Elena: "Yes. The metaphysics is the price of admission."

      *Wait, I need to make sure the specific "covert quantification" objection is answered.*
