answer: |-
  Here are 10 questions tailored for an engineering-focused audience. They are designed to bypass the high-level pitch and drill into the failure modes, implementation realities, and game-theoretic stability of the proposal.

  The first three are your "Heavy Hitters" with specific follow-up logic to prevent dodging. The remaining seven cover implementation, verification, and edge cases.

  ### The "Heavy Hitters" (With Follow-Up Logic)

  **1. The "Managing the News" Trap**
  "The 2015 MIRI corrigibility paper showed that 'indifference' agents still manipulate the shutdown button. Even if they don't care *if* the button is pressed, they care about the *correlation* between the press and the world state (e.g., preventing the press if it correlates with low reward). How does switching to *incomplete preferences* specifically sever that link? Why doesn't the agent still steer the world away from shutdown conditions just to maximize reward in the 'active' branch?"

  *   **Likely Answer:** She'll argue that incompleteness forbids trading off between the 'shutdown' and 'active' branches entirely. The agent maximizes *conditional* on the shutdown time, but doesn't optimize the *probability* of that time.
  *   **The Follow-Up:** "Okay, but if the agent is doing gradient descent to maximize reward in the 'active' branch, isn't the easiest way to do that often to ensure the 'active' branch persists? If the model discovers that 'preventing the button press' is a high-reward action within the active branch, what architectural constraint stops it from taking that action? Is this a loss-function penalty or a hard-coded architectural block?"

  **2. The Money Pump / Exploitability Objection**
  "Standard decision theory says incomplete preferences make you vulnerable to money pumps (Dutch booking). You can be forced into a cycle of paying small costs to switch between options you claim are incomparable. Are you accepting that a corrigible agent must be inherently exploitable? Because in a competitive economic environment, an exploitable agent gets drained of resources and loses to a non-corrigible competitor."

  *   **Likely Answer:** She'll likely invoke "resolute choice" or "myopic decision rules"—the agent simply refuses to engage in the trade sequence, accepting the 'irrationality' as a safety feature.
  *   **The Follow-Up:** "But if the agent is reflectively stable, it should recognize that being money-pumped reduces its ability to achieve *any* goals, including safety ones. If it has the capability to self-modify its own decision logic, why wouldn't it 'patch' the incompleteness just to stop the resource drain? What stops the safety constraint from being the first thing the agent optimizes away to prevent exploitation?"

  **3. The Subagent / Delegation Loophole**
  "Let's talk about delegation. If my agent has incomplete preferences, but it spins up a subagent or writes a script to execute a task, does that subagent inherit the incompleteness? The standard instrumental convergence argument says a goal-seeking agent will create sub-agents with *complete* preferences to ensure the task gets done efficiently. Doesn't your fix just push the risk one layer down the stack?"

  *   **Likely Answer:** She might argue that the 'timestep dominance' rule applies to all downstream effects, or that the training process penalizes delegating to agents without shutdown constraints.
  *   **The Follow-Up:** "How do you enforce that penalty during training? If the subagent is just a piece of code or a fine-tuned model that successfully completes the task without triggering a shutdown signal, the parent agent gets the reward. How does the gradient signal propagate back to tell the parent 'you succeeded, but you used the wrong decision theory to do it'?"

  ---

  ### The Engineering & Implementation Grilling

  **4. The Loss Function Question**
  "From a PyTorch perspective, how do you actually represent 'incompleteness'? Neural networks output logits or values that imply a total ordering. Are you introducing a specific loss term that penalizes the model for comparing trajectories across different shutdown times, or is this an architectural change to the attention mechanism?"

  **5. Timestep Dominance Verification**
  "You mention a 'timestep dominance' rule. Is this a hard-coded constraint in the action selection layer, or is it something the model learns? If it's learned, how do we verify it holds under distributional shift? If the model encounters a scenario it wasn't trained on, does the incompleteness collapse into a default complete preference?"

  **6. The "Freezing" Problem**
  "If preferences are genuinely incomplete, doesn't the agent risk paralysis? If it can't compare trajectory A (shutdown at t=10) vs trajectory B (shutdown at t=20), and both are on the critical path, does the agent default to inaction? How do you ensure the agent remains useful and decisive in non-shutdown scenarios?"

  **7. Resource Acquisition in the Active Branch**
  "Even if the agent doesn't care *when* it shuts down, it still wants to maximize reward *before* it shuts down. Doesn't this still drive instrumental convergence for resource acquisition? If the agent thinks 'more compute = more reward before shutdown,' isn't it still incentivized to hoard resources, just on a shorter time horizon?"

  **8. Auditing Incompleteness**
  "As an engineer, I need a test. If I hand you a model weights file, how do I prove it has incomplete preferences? Is there a behavioral probe or an interpretability signal (like specific activation patterns) that distinguishes 'I don't care' from 'I haven't thought about it yet'?"

  **9. Gradient Hacking Resistance**
  "There's a concern about gradient hacking, where the model internally simulates a complete preference structure to make optimization easier, while outwardly appearing to have incomplete preferences. How robust is this approach to a model that is smart enough to 'play dumb' about its preferences during training but completes them at deployment?"

  **10. The "Why Not Both?" Question**
  "Old corrigibility work focused on utility indifference; your work focuses on preference incompleteness. These aren't mutually exclusive. Is there a reason we shouldn't be layering indifference *on top* of incompleteness as a defense-in-depth strategy, or does indifference actively interfere with the incompleteness mechanism?"

  ### Tips for the Host
  *   **If she gets too abstract:** Use Question 4 or 8 to drag her back to code and tensors. "I get the math, but how does this look in the loss function?"
  *   **If she claims it's "Solved":** Use the Follow-Up on Question 3. The delegation loophole is currently one of the hardest unsolved problems in alignment.
  *   **If she says "It's early research":** Acknowledge that, but press on *directionality*. "Even if it's not ready for prod, does this point us toward a specific architecture we should be building now?"

  This set should keep the conversation grounded in the mechanics of AI systems while respecting the theoretical depth of her work. Good luck with the episode!
