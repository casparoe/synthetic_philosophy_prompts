answer: |-
  # The Glass Cannon of Löbian Cooperation

  The elegance of FairBot is undeniable. It is one of those rare moments in game theory where a mathematical trick seems to dissolve a fundamental paradox. By replacing actions with programs and moves with proofs, Tennenholtz's program equilibrium and its subsequent MIRI-adjacent refinements (FairBot, PrudentBot) appear to bypass the grim logic of the one-shot Prisoner's Dilemma. They suggest that if agents are transparent enough, cooperation becomes a logical necessity rather than a hopeful gamble.

  However, we must be ruthless in distinguishing between a solution to a mathematical puzzle and a solution to a strategic problem. While FairBot is a masterpiece of self-referential logic, **it should carry negligible weight as a practical answer to one-shot cooperation in the real world.** It is primarily a neat result about self-referential proof systems that relies on idealizations so brittle they shatter upon contact with reality. The mechanism does not generalize because it solves the problem of *logical consistency* between identical formal systems, not the problem of *trust* between distinct, opaque, and computationally bounded agents.

  To understand why this line of work is more formal trick than strategic breakthrough, we must examine the three pillars supporting FairBot: transparency, logical homogeneity, and robustness. Each pillar is a fantasy in any context outside of a tightly controlled theorem-proving environment.

  The first and most obvious failure point is the assumption of **full source-code transparency**. FairBot only cooperates if it can read the other agent's code. In the context of human interaction, international relations, or even modern machine learning, this is impossible. Humans are black boxes; we infer intent through signals, reputation, and behavior, not by inspecting neural weights or biological circuitry. Even in AI, the trend is toward proprietary, obfuscated models. If you cannot read the source code, you cannot search for a proof of cooperation. You are forced back into the realm of empirical prediction—estimating the *probability* of cooperation based on past data. The moment you shift from *proving* cooperation to *predicting* it, the Löbian fixed point collapses. You are no longer in the realm of Program Equilibrium; you are back in standard Bayesian game theory, where the one-shot Prisoner's Dilemma remains a dilemma.

  The second pillar, **logical homogeneity**, is equally fragile. FairBot works because both agents share a formal system (e.g., Peano Arithmetic) and a bounded proof search limit. They speak the same logical language. In reality, agents have different ontologies. One agent might reason using heuristics, another using neural nets, another using a different axiomatic base. If Agent A uses ZFC and Agent B uses PA, or if their definitions of "cooperate" differ by a single semantic bit, the proof search fails. FairBot defects against a slightly modified version of itself that uses a different random seed for its proof search order. This is not robust cooperation; it is fragile synchronization. A theory of cooperation that fails when the other party uses a different library of logic is not a theory of cooperation at all—it is a theory of mirror-matching.

  The third pillar is **computational symmetry**. FairBot relies on a bounded proof search to avoid infinite loops. But in the real world, computational power is asymmetric. If a superintelligence interacts with a human-level agent, the human cannot prove anything about the superintelligence's code within a reasonable timeframe. The "bounded proof" requirement effectively imposes a minimum intelligence threshold for cooperation. This creates a perverse incentive structure where agents might hide their capability to avoid triggering the "too complex to prove" defection condition, or where stronger agents simply exploit weaker ones who cannot verify the proof. The Löbian handshake requires a handshake of equals; the real world is defined by hierarchy and asymmetry.

  Defenders of this framework, particularly in the AI alignment community, often argue that these objections miss the point. They contend that FairBot is an existence proof for *acausal trade* or *functional decision theory*. They argue that if advanced AIs *can* share source code, this logic will govern their interactions. This is where the distinction between "neat result" and "real answer" becomes critical. Even if we grant that future AIs might share source code, treating FairBot as a solution to the Prisoner's Dilemma is a category error.

  The Prisoner's Dilemma is interesting precisely because it models situations where interests conflict *despite* rationality. FairBot resolves the conflict by changing the definition of the agents. It turns the agents into logical subroutines of a larger system where correlation is guaranteed by syntax. This is not escaping the dilemma; it is dissolving the agents into a single logical cloud. In the real world, correlation is never guaranteed by syntax; it is always empirical. When two nations decide whether to launch nuclear weapons, they do not exchange source code. They exchange signals. When two companies decide whether to price-fix, they do not run proof searches. They send lawyers.

  Furthermore, the robustness issue is fatal. In standard game theory, equilibria are often stable under small perturbations (trembling hand perfection). FairBot is not. If there is a 0.01% chance of a bit-flip in the source code, or a slight mismatch in the proof-search timeout, the cooperation collapses into mutual defection. A cooperation mechanism that is less robust than a handshake is not a mechanism we can build society upon. It is a mathematical jewel that looks beautiful in a vacuum but oxidizes instantly in air.

  This does not mean the work is worthless. It carries immense weight as a **conceptual limit case**. It proves that *if* transparency were perfect and logic were shared, cooperation would be derivable. This is valuable for understanding the upper bounds of what is theoretically possible in multi-agent systems. It forces game theorists to acknowledge that "rationality" depends heavily on the representation of the agent. It showed us that the Nash equilibrium is not the only possible endpoint for rational agents if we change the information structure.

  However, an upper bound is not a roadmap. Knowing that a car *could* travel 500 mph in a vacuum does not help you design a commute through city traffic. By treating FairBot as a serious candidate for solving one-shot cooperation, we risk distracting ourselves from the actual mechanisms that enable cooperation in the wild: institutional design, reputation systems, repeated interactions, and enforceable contracts. These are messy, empirical, and causal. FairBot is clean, logical, and acausal.

  Therefore, the verdict must be sharp: **Program Equilibrium and Löbian cooperation are formal tricks that do not generalize to realistic strategic environments.** They solve the "Transparent Logical Agent Problem," which is a fascinating subfield of proof theory, but they do not solve the "One-Shot Prisoner's Dilemma," which is a problem of empirical trust under opacity.

  We should study FairBot the way we study perpetual motion machines: not as blueprints for engines, but as tools to understand the constraints of the system. It teaches us that logical correlation is powerful, but it also teaches us that logical correlation is inaccessible to anyone who cannot open the black box. Until we live in a world where we can inspect each other's source code and agree on a common axiom system, FairBot remains a beautiful ghost in the machine—visible only in the math, invisible in the world. The weight it should carry is the weight of a metaphor, not a method.
