  so i've been on a program equilibrium kick lately (the tennenholtz thing, i think it was a 2004 paper, where instead of picking an action in a game you submit a *program* that gets to read the other player's source code before it acts -- supposedly this lets you get cooperation in a one-shot PD without needing repeated-game folk theorem stuff). the bit that actually hooked me is the MIRI-adjacent fix for the obvious failure mode: naive "cooperate iff i can tell you'll cooperate" just makes both programs try to simulate each other forever and neither halts. their patch is FairBot -- cooperate iff you can *prove*, in some fixed formal system with a bounded proof search, that the other program cooperates with you -- and the reason this doesn't just regress infinitely is some Lob's theorem trick that lets FairBot-vs-FairBot cooperation go through as a fixed point instead of an infinite simulation loop. then theres PrudentBot on top, which is basically the "don't get suckered by CooperateBot" patch.

