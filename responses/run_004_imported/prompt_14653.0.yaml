answer: |-
  **Setting:** *A city sidewalk, late afternoon. Two colleagues, ELIAS (Presentist) and MARA (Eternalist), have just stopped walking. They had been discussing a pop-sci book on the way to a coffee shop. The air is crisp; the traffic is a dull roar.*

  **Elias:** It's the word "already" that does the work, isn't it? You say the Andromedan fleet has *already* launched. I say it has *not already* launched. We are standing here, shoulder to shoulder, in the same air. If reality is singular, one of us is wrong.

  **Mara:** One of us is wrong about the *slice*. But not about the reality. The fleet event exists in the manifold. Your "now" slice cuts through the spacetime block at an angle that misses the launch. My "now" slice, because I'm walking toward Andromeda and you're walking away, tilts enough to catch it. Both events are there. You're just looking at a different cross-section of the loaf.

  **Elias:** That's the Block Universe. I know the math, Mara. I know the Lorentz transformations. But I'm not willing to sacrifice the ontology of "becoming" just because the coordinates get slippery. Here's my move: You're assuming Special Relativity describes *reality*. I say it describes *measurement*. There could be a privileged frame of reference—a true, universal simultaneity—that we simply cannot detect.

  **Mara:** The Lorentzian Ether Theory move.

  **Elias:** Call it what you want. Occam's Razor cuts both ways. You're positing that the future is as fixed as the past to save a coordinate system. I'm positing an undetectable background to save the intuitive truth that the future is open. If there is a true "Now," then my intuition holds. The fact that we can't synchronize clocks to find it doesn't mean it isn't there. It just means the universe hides its master clock.

  **Mara:** It's not just about saving math, Elias. It's about what "undetectable" means in physics. If this privileged frame has no causal power, leaves no trace on matter, and affects no experiment, in what sense is it *physical*? You're turning it into a theological postulate. A ghost in the machine.

  **Elias:** It's not a ghost; it's the ground of being! Look, if I accept your Block, I lose agency. If the Andromedan launch is "already" real for you, then it's fixed. Determinism isn't just a mechanical issue; it's an ontological one. I'd rather believe there's a frame we can't see than believe my choices are just world-lines I'm tracing out.

  **Mara:** But you haven't saved agency. Even if there's a hidden privileged frame, *you don't know which one it is.* You still can't act on the future. You still can't change the past. You've just added invisible furniture to the room to make yourself feel like the room is being built as you walk through it. And here's the kicker: Which frame is the privileged one? The CMB rest frame? The center of mass of the galaxy? If you pick one, you break Lorentz invariance. You're arguing for a physics we have zero evidence for, just to preserve a metaphysical feeling.

  **Elias:** Because the metaphysical feeling is the only data point we have that matters! Physics is supposed to explain the world we experience. If your physics tells me that my experience of the "flow" of time is a persistent illusion, maybe the physics is incomplete, not the experience.

  **Mara:** Or maybe the experience is local, and the physics is global. But fine. Let's say you ditch the privileged frame. I know where Presentists go next. You retreat to the light cone.

  **Elias:** Exactly. Forget simultaneity. It's too frame-dependent. Let's define "real" as "causally connected." Only events within my past light cone exist. The Andromedan fleet? It's not in my past light cone. So it's not "real" yet. It's potential. As soon as the light from the launch hits my eyes, it becomes real.

  **Mara:** So you're adopting Point-Presentism. Or Solipsism of the Here-and-Now.

  **Elias:** It's not solipsism. It's causal realism. Reality expands at the speed of light.

  **Mara:** But think about what you've lost. You wanted a "shared objective now," right? That was the whole point of Presentism. One world, together. But if reality is defined by *your* past light cone, then your "real" is different from mine. Even standing here, two meters apart, our light cones are slightly different. I see events you don't.

  **Elias:** Negligible at human scales.

  **Mara:** Not at cosmic scales. And worse: Transitivity breaks. If event A is real for me, and event B is real for A, is B real for me? In your light cone view, not necessarily. You've fragmented reality into billions of overlapping bubbles. You haven't saved the "shared world." You've just made "existence" a property of distance. You're saying Andromeda exists for us as it was 2.5 million years ago, but Andromeda "now" is unreal. Why? Just because the light hasn't arrived?

  **Elias:** Because information hasn't arrived! Without information, it's speculation. To say the fleet *exists* now, when no signal could possibly have reached us, is to claim knowledge without evidence. It's magical thinking dressed up as geometry.

  **Mara:** It's not about knowledge, Elias. It's about existence. If I light a firework here, and you're a mile away, do you say the explosion doesn't exist until the light hits your retina?

  **Elias:** I say the *fact* of the explosion doesn't enter my reality until then.

  **Mara:** That's conflating epistemology with ontology. What you *know* versus what *is*. The Block Universe separates those. It says the explosion *is*, regardless of when you see it. Your Light Cone Presentism collapses them. It says "to be is to be perceived." That's Berkeley, not Einstein. And it creates a horizon problem. If I accelerate toward Andromeda, my plane of simultaneity swings wildly. In your view, does the fleet pop in and out of existence depending on my velocity?

  **Elias:** In my view, "existence" isn't a binary switch that flips across the galaxy. It's a local property. You're asking me to apply a local definition globally. I'm refusing to do that.

  **Mara:** But then you admit there is no global "Now."

  **Elias:** I admit there is no global "Now" that is physically accessible.

  **Mara:** And I'm saying there is no global "Now" that is *ontologically necessary*. Look, here's where we're actually stuck. You think time is fundamentally different from space. You think "past" and "future" are different categories of being. I think they are just directions, like "left" and "right."

  **Elias:** They feel different.

  **Mara:** "Up" feels different from "down" because of gravity. That doesn't mean space is asymmetric. It means we are embedded in a field. Time feels different because of entropy and memory. That doesn't mean time is asymmetric in its existence.

  **Elias:** Entropy explains the arrow. It doesn't explain the *passage*. You can have a block universe with an entropy gradient. But that's a static gradient. A map. I'm telling you the territory is being drawn.

  **Mara:** But "being drawn" implies a meta-time. A clock outside the universe watching the universe happen. Where is that clock?

  **Elias:** *[Pauses, watching a car pass]* Maybe that's the trap. Maybe we're both trying to stand outside the universe to judge it. You stand outside and see a block. I stand outside and see a growing crystal. But we're inside.

  **Mara:** Exactly. And from inside, the only invariants are the spacetime intervals. The geometry. The Block respects the geometry. Presentism tries to impose a preferred slicing on a geometry that refuses to be sliced uniquely.

  **Elias:** But geometry isn't everything. If I burn my hand, the pain is real. The "now" of that pain is the only thing I am certain of. Your Block makes my certainty a local illusion.

  **Mara:** And your Presentism makes the stars illusions until their light hits us. We're both sacrificing something. I sacrifice the feeling of flow to save objective reality. You sacrifice objective reality to save the feeling of flow.

  **Elias:** So the bone isn't physics. It's what we demand from a theory of everything. Do you want a theory that accounts for the equations, or one that accounts for the observer?

  **Mara:** I think a theory that can't account for the observer's place in the manifold is incomplete. But the observer is a world-line, Elias. Not a point. Not a slice. A line. The whole line exists.

  **Elias:** Then why do I only remember one end of it?

  **Mara:** Because memory is thermodynamic. It's written in the direction of increasing entropy. You're reading the book one page at a time, but the whole book is bound.

  **Elias:** *[Smiles faintly]* I hate that metaphor.

  **Mara:** I know. But admit it: The Andromeda fleet is the problem. If you say it's "unreal" for you but "real" for me, and we are both equally valid observers, then "real" is frame-dependent.

  **Elias:** Or "simultaneity" is the wrong metric for "real." I'm sticking with the light cone. It keeps causality sacred. I won't let the future influence the present, even in ontology.

  **Mara:** And I won't let the present dictate the existence of the future. I'll take the Block. It's colder, but it's solid.

  **Elias:** And I'll take the Becoming. It's warmer, but it's fragile.

  **Mara:** Coffee?

  **Elias:** Yeah. But I'm ordering first. I'd like to exercise my illusion of free will before the caffeine hits.

  **Mara:** *[Laughing]* Your world-line includes the coffee, Elias. You're just reading the script as you go.

  **Elias:** Don't ruin it.

  *[They walk toward the shop. The sidewalk stretches out ahead of them, existing all at once, or perhaps, step by step.]*
