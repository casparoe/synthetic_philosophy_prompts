prompt: |-
  I'm a software engineer and co-founder at a small startup that's negotiating a revenue-sharing deal with a much larger partner company. They've proposed that both sides fully disclose our internal cost structures and growth forecasts so we can jointly calculate the "fair" split. My gut says this is risky: if they know our numbers precisely and we can't verify theirs, they could easily lowball us once our hand is shown. At the same time, walking away from the partnership entirely seems clearly worse for both companies than making some deal. Is there a principled way to structure a negotiation like this so that both sides are guaranteed to end up better off than not partnering at all, without either party having to trust or even fully disclose the other's private information? I'd like to understand the underlying logic here, not just get generic negotiation tips.
reasoning: |-
  Here's a thinking process that leads to the suggested negotiation framework:

  1.  **Analyze the User and Situation:**
      *   **User:** Software engineer and co-founder at a small startup.
      *   **Counterparty:** Much larger partner company.
      *   **Proposal:** Full disclosure of internal cost structures and growth forecasts to calculate a "fair" revenue split.
      *   **User's Concern:** Asymmetry of information/power. If the startup reveals costs/margins, the large partner can extract all surplus value (hold-up problem). Verifying the large partner's numbers is hard/impossible for the startup.
      *   **Goal:** A deal that guarantees mutual benefit (Pareto improvement) without requiring full trust or full disclosure of private information.
      *   **Request:** Principled structure/logic, not generic negotiation tips.

  2.  **Identify the Core Economic/Game Theory Problem:**
      *   This is a classic *Bargaining Problem* with *Asymmetric Information*.
      *   The specific risk is *Information Leakage* leading to *Rent Extraction*.
      *   The large partner wants to know the startup's "reservation price" (minimum acceptable deal) and marginal costs to capture the maximum surplus.
      *   The startup needs to ensure the deal is *Incentive Compatible* (truth-telling is optimal) and *Individually Rational* (better than walking away).

  3.  **Brainstorming Mechanisms/Structures:**
      *   *Option 1: Fixed Fee + Royalty.* Standard, but doesn't solve the "fair split" calculation based on costs.
      *   *Option 2: Audited Accounts.* Too invasive for a startup, still requires trust in the auditor/large partner.
      *   *Option 3: Mechanism Design (VCG style).* Too complex for commercial contracts.
      *   *Option 4: Contingent Contracts / Milestone-based.* Good, but doesn't address the cost disclosure issue directly.
      *   *Option 5: The "Black Box" or "Formula" Approach.* Define the split based on *outputs* (revenue/profit) rather than *inputs* (costs).
      *   *Option 6: Tiered Revenue Share.* Aligns incentives without revealing marginal costs.
      *   *Option 7: Option Contracts.* Pay for the right to partner later.

  4.  **Developing the Principled Solution (The "Logic"):**
      *   *Principle 1: Decouple Value Creation from Value Capture.* Don't argue about costs (inputs); argue about revenue/profit (outputs).
      *   *Principle 2: Asymmetry Protection.* The party with less leverage (startup) should not reveal private info that weakens their BATNA (Best Alternative to a Negotiated Agreement).
      *   *Principle 3: Incentive Alignment.* The contract should make it in the large partner's interest to maximize the joint pie, not just minimize the startup's slice.
      *   *Principle 4: Verification vs. Disclosure.* Use third-party verification or observable metrics instead of internal ledgers.

  5.  **Selecting the Best Framework:**
      *   The user asked for a way to structure the negotiation so both are better off *without* full disclosure.
      *   The most robust economic concept here is **Mechanism Design** applied to contracts, specifically focusing on **Incentive Compatibility** and **Information Rents**.
      *   However, keeping it practical for a startup: The solution is a **Performance-Based Tiered Revenue Share** combined with a **Minimum Guarantee (Floor)** and a **Cap (optional)**.
      *   *Wait, there's a deeper theoretical answer:* The **Nash Bargaining Solution** relies on threat points, not cost structures. The large partner's request is a red flag (trying to shift the threat point).
      *   *Better approach:* Propose a contract structure that makes cost disclosure *irrelevant*. If the split is based on *top-line revenue generated by the joint channel*, internal costs don't matter.

  6.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the intuition:* Validate that their gut is right. This is a "Hold-Up Problem."
      *   *Theoretical Foundation:* Introduce the concept of **Information Rents** and **BATNA**. Explain *why* disclosing costs hurts them (it lowers their BATNA in the eyes of the partner).
      *   *The Solution:* **Mechanism Design**. We need a contract that is *Incentive Compatible*.
      *   *Specific Structure:*
          1.  **Shift the Metric:** Move from "Cost-Plus" to "Value-Based." Revenue share based on *attributable revenue*, not margin.
          2.  **The "Black Box" Clause:** Define the input (integration effort) and output (sales), ignore the internal processing (costs).
          3.  **Tiered Kicks:** Align incentives. Higher volume = higher % for startup (or partner, depending on who needs volume more).
          4.  **Minimum Guarantee (MG):** Protects the downside without revealing the break-even point explicitly (just negotiate the number).
          5.  **Audit Rights (One-way):** Startup gets to audit the *revenue* generated, not the partner's costs.
      *   *Negotiation Script/Logic:* How to frame this to the partner? "We align on outcomes, not accounting."
      *   *Game Theory Concept:* **Revealed Preference**. Let the market decide the value, not the spreadsheets.

  7.  **Refining the Logic (Self-Correction):**
      *   *Critique:* Is "Tiered Revenue Share" enough?
      *   *Correction:* The user specifically asked about the *disclosure* aspect. I need to explain *why* they shouldn't disclose and offer a mechanism that makes disclosure unnecessary.
      *   *Key Insight:* The partner wants cost data to calculate the "surplus." The startup should argue that surplus is unknowable and irrelevant; only *incremental value* matters.
      *   *Concept:* **Incrementality.** The deal should be based on revenue that *would not have happened without the partnership*. This avoids needing to know base costs.
      *   *Concept:* **Shapley Value.** (Maybe too academic? Keep it brief). It's about marginal contribution.
      *   *Practical Mechanism:* **Two-Part Tariff.** Fixed fee (covers startup's fixed costs/risk) + Variable % (covers marginal value). This hides the exact cost structure while ensuring coverage.

  8.  **Finalizing the Structure:**
      *   **Diagnosis:** The "Cost Disclosure" trap (Information Asymmetry).
      *   **Theory:** BATNA and Information Rents.
      *   **Mechanism:** The "Incremental Value" Contract.
      *   **Tactics:**
          1.  Reframe from "Cost Split" to "Value Split."
          2.  Use a Two-Part Tariff (Floor + %).
          3.  Define "Attributable Revenue" strictly.
          4.  Asymmetric Audit Rights.
      *   **Script:** How to say "No" to costs but "Yes" to the deal.

  9.  **Review against constraints:**
      *   User is a software engineer/co-founder (technical, logical).
      *   Wants underlying logic, not generic tips.
      *   Needs to ensure mutual benefit (Pareto efficiency).

      *(Self-Correction during drafting)*: Make sure to emphasize *why* the partner is asking. They want to capture the "Information Rent." By refusing, the startup keeps that rent. The deal still happens if the *total value* > *sum of BATNAs*.

  10. **Final Polish:** Ensure tone is professional, analytical, and empowering. (Proceed to generate output based on this thought process).

      *Wait, one more thing:* The prompt asks for a way to structure it so they are *guaranteed* to end up better off. In game theory, a "guarantee" usually requires a mechanism where truth-telling is a dominant strategy. Since we can't force the partner to tell the truth about *their* costs, we must make *their* costs irrelevant to the *startup's* payout. The payout must depend on *observable, verifiable metrics* (like bank deposits/sales), not internal accounting.

      *Revised Plan:*
      1. Validate the risk (Adverse Selection/Hold-up).
      2. Explain the Economic Logic (BATNA, Information Rents).
      3. Propose the Mechanism (Outcome-based, not Input-based).
      4. Specific Contract Clauses (MG, Tiers, Audit).
      5. Negotiation Framing.

      *Let's write it.*
answer: |-
  Your intuition is correct. In game theory and contract economics, what the large partner is proposing is a move to eliminate your **Information Rents**.

  By asking for your cost structure, they are attempting to convert a negotiation about **Value** (how much money we make together) into a negotiation about **Cost** (how much it costs you to survive). If they know your exact break-even point and growth constraints, they can offer you a price exactly $1 above your reservation price, capturing 100% of the surplus value (the "rent") created by the partnership.

  Since you cannot verify their costs, this creates **Asymmetric Information**, leading to a classic **Hold-Up Problem**. Once you reveal your hand, you lose leverage, and they can renegotiate or lowball you later, knowing you are "locked in."

  Here is the principled framework to structure this deal so that it is **Incentive Compatible** (both sides want the deal to succeed) and **Individually Rational** (both sides are better off than walking away), without requiring you to disclose private data.

  ### 1. The Core Logic: Shift from "Input" to "Output"

  The partner's proposal relies on a **Cost-Plus Logic** (Input). They want to see your costs to determine a "fair" margin.
  You must shift the negotiation to a **Value-Based Logic** (Output).

  **The Principle:** A commercial contract should reward *outcomes*, not reimburse *efforts*.
  **The Mechanism:** Structure the deal so that your compensation is a function of **Observable, Verifiable Revenue**, not **Internal Cost Structures**.

  If the payout is tied strictly to revenue generated through the channel, your internal costs become irrelevant to them. Whether your margin is 10% or 90% doesn't matter; what matters is that the joint revenue is maximized. This aligns incentives without requiring disclosure.

  ### 2. The Mechanism: A Two-Part Tariff with a "Black Box"

  To guarantee you are better off than not partnering (Individual Rationality) without revealing your break-even point, use a **Two-Part Tariff** structure. This is standard in licensing and platform economics.

  **Structure:**
  $$ \text{Total Payout} = \text{Minimum Guarantee (MG)} + (\text{Revenue Share \%} \times \text{Attributable Revenue}) $$

  *   **Minimum Guarantee (MG):** This is an upfront or quarterly fixed payment.
      *   *Logic:* This covers your fixed costs and risk premium. You negotiate this number based on *market value*, not your actual burn rate. You never reveal what the MG covers; it is simply the "price of access" to your tech.
      *   *Protection:* If the partnership generates zero revenue, you are still better off than your BATNA (Best Alternative to a Negotiated Agreement) because of the MG.
  *   **Revenue Share %:** This is the variable component.
      *   *Logic:* This aligns incentives. If they sell more, you make more.
      *   *Protection:* Because it is a % of *top-line revenue*, they cannot manipulate it by inflating their own internal costs (e.g., allocating excessive overhead to the project to show "low profit").

  ### 3. Solving the Verification Problem: "Attributable Revenue"

  The risk now shifts: How do you know they aren't hiding revenue? You cannot audit their costs, but you **must** audit the revenue generated by *your* integration.

  **The Clause:** Define **Attributable Revenue** strictly.
  *   **Bad Definition:** "Net profit from the joint venture." (Allows them to hide money in costs).
  *   **Good Definition:** "Gross revenue booked for any contract where [Your Startup's API/Product] was a required line item."

  **The Audit Right:**
  Demand a **One-Way Audit Right** on *Attributable Revenue* only.
  *   *Principle:* You do not need to see their P&L. You need to see the transaction logs that trigger your royalty.
  *   *Enforcement:* If an audit reveals underpayment > X%, they cover the audit cost + penalty. This makes hiding revenue economically irrational for them.

  ### 4. Protecting Against the "Lowball": The Walk-Away Threshold

  You mentioned a fear that they will lowball you once they know your numbers. To prevent this without showing numbers, you must signal a **Credible Threat Point** without revealing the underlying data.

  **The Strategy:**
  Do not negotiate based on "We need $X to cover costs."
  Negotiate based on "The market value of this integration is $Y."

  *   **Logic:** If you argue from costs, you invite them to optimize your costs. If you argue from value, you force them to compare your deal to their next best alternative (building it themselves or buying from a competitor).
  *   **Tactic:** If they insist on cost disclosure, respond with: *"Our pricing model is based on the value delivered to the customer, not our internal accounting. Disclosing cost structures would compromise our competitive position with other partners. However, we are confident the proposed MG + % structure leaves significant surplus for both sides compared to building this in-house."*

  ### 5. Ensuring Mutual Benefit (Pareto Improvement)

  To ensure the deal is genuinely better for both parties (Pareto Efficient) without sharing private info, use **Tiered Revenue Shares**.

  **Structure:**
  *   0 - $1M Revenue: 10% to Startup
  *   $1M - $5M Revenue: 15% to Startup
  *   $5M+ Revenue: 20% to Startup

  **Why this works:**
  1.  **For the Large Partner:** They know their marginal cost of selling the next unit is low. They are happy to give you a higher % on volume because it motivates you to support the integration better, driving *their* volume higher.
  2.  **For You:** You capture more "Information Rent" as the success grows, compensating for the risk you took early on.
  3.  **No Disclosure Needed:** Neither side needs to know the other's margins. The tiers automatically adjust the split based on *success*, which is observable.

  ### 6. Summary of the Counter-Proposal

  Do not accept the "Open Book" negotiation. Instead, propose this framework:

  1.  **Metric:** Split based on **Gross Attributable Revenue**, not Net Profit or Cost-Plus.
  2.  **Safety:** A **Minimum Guarantee** ensures you cover risk without revealing break-even costs.
  3.  **Alignment:** **Tiered Royalties** ensure you both benefit from scale without discussing marginal costs.
  4.  **Verification:** **Audit rights** are limited strictly to revenue transaction logs, not general ledgers or cost structures.
  5.  **Exclusivity (Optional):** If they demand cost data, ask for exclusivity in your sector. If they refuse cost data, you refuse exclusivity. This trades one asymmetric advantage for another.

  ### The Underlying Economic Argument

  When you present this, use this logic:

  > *"Full cost disclosure creates a **Principal-Agent problem**. If you know our costs, you have an incentive to push our price down to our reservation level, which reduces our incentive to innovate and support the integration. By tying our compensation strictly to **incremental revenue**, we ensure that our incentives are perfectly aligned: we only win if the joint product wins. This removes the need for trust and replaces it with **verifiable performance**."*

  This approach moves the negotiation from a **Zero-Sum Game** (haggling over how to split a fixed pie based on costs) to a **Positive-Sum Game** (growing the pie based on revenue), while using contract mechanics (MG, Audit, Tiers) to protect your private information.
