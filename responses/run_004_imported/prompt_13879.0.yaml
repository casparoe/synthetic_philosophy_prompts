answer: |-
  **Title:** The Arithmetic of Rescue: Why Numbers Must Count in Ethical Triage

  **Introduction**

  The scenario facing your Ethics Bowl team is a classic instance of tragic choice: a rural clinic, a disaster, and a single dose of medication that can either save one person completely or be divided to save five. The intuitive response for most people is immediate: save the five. To do otherwise seems not just irrational, but morally monstrous. However, as your coach has highlighted, intuition is not argument. In his seminal 1977 paper "Should the Numbers Count?", John Taurek challenges this aggregation, suggesting that in certain life-and-death conflicts, flipping a coin is the only way to respect the equal value of each human life.

  This essay will analyze Taurek's challenge to utilitarian aggregation and contrast it with T. M. Scanlon's contractualist defense of counting numbers. While Taurek correctly identifies the danger of treating individuals as mere vessels for value, his solution fails to account for the moral responsibility of the agent making the choice. I will argue that, contrary to Taurek, the numbers *must* count in rescue scenarios. To do otherwise is not to honor the individual, but to abandon the moral obligation to minimize preventable harm when the cost to the agent is equal.

  **Taurek's Argument: The Separateness of Persons**

  Taurek's argument rests on a specific metaphysical and moral claim about loss. He observes that when we say "it is worse for five people to die than for one," we are implicitly assuming that these five losses can be summed into a single, larger loss. Taurek denies this. He argues that there is no "super-observer" who experiences the collective pain of five deaths. Loss is experienced individually. For the one person who dies, the loss is total: they lose their entire future. For each of the five, the loss is also total: they each lose their entire future.

  From the perspective of the one, being sacrificed to save the five offers no compensation. They do not get to share in the survival of the five. Therefore, Taurek argues, the one person has a claim to be saved that is equal in weight to the claim of any single person in the group of five. If you automatically save the five, you are effectively telling the one: "Your life counts for less because there are more of them." Taurek contends this violates the principle that people are ends in themselves, not units of value to be tallied.

  So, how do we resolve the conflict without counting? Taurek proposes a coin flip. This mechanism is not about randomness for its own sake, but about fairness. If you flip a coin to decide between saving the one (Heads) or the five (Tails), you give every individual involved an equal *ex-ante* probability of survival. The one person has a 50% chance (the chance the coin lands Heads). Each of the five has a 50% chance (the chance the coin lands Tails). By contrast, if you automatically save the five, you give the one person a 0% chance and the five a 100% chance. For Taurek, the coin flip is the only procedure that treats all six claimants as moral equals, granting each an equal shot at survival rather than subordinating the minority to the majority.

  **Scanlon's Reply: Reasonable Rejection**

  T. M. Scanlon, in *What We Owe to Each Other*, offers a powerful rebuttal through the lens of contractualism. Scanlon's framework asks: What principles for governing our behavior could no one reasonably reject? In the context of the clinic, we must ask whether the single patient could reasonably reject a principle that says "save the greater number when you cannot save all."

  Scanlon argues that they could not. His reasoning hinges on the nature of the complaint. If we save the one, the five die. Each of the five can say, "I lost my life, and I could have been saved if you had chosen the other option." If we save the five, the one dies. The one can say, "I lost my life, and I could have been saved if you had chosen the other option."

  The loss (death) is identical in both cases. However, Scanlon points out that the *strength* of a complaint depends not just on the loss to the individual, but on the outcome of the principle being followed. A principle that saves the one results in five deaths. A principle that saves the five results in one death. The complaint of the five against the "save the one" principle is stronger, simply because there are more people making the exact same valid complaint. It is not that their deaths add up to a "super-loss," but that there are more individual agents who have been failed by the decision.

  Scanlon writes that "the fact that more people would be saved is a reason for saving them." To deny this is to ignore the generic reasons that each individual has. Since each of the five has a reason to want to be saved that is identical to the reason the one has, and since we cannot satisfy all reasons, we must satisfy the greater number of identical reasons. To do otherwise is to arbitrarily privilege the claim of the one over the identical claims of the five without justification.

  **The Verdict: Why Numbers Count**

  Taurek's argument is seductive because it protects the minority from being crushed by the calculus of the majority. It reminds us that democracy is not appropriate for human rights; we do not vote on whether one person should be enslaved, even if the majority benefits. However, in the specific context of *rescue triage*, Taurek's coin flip is morally untenable. I argue that the numbers must count, not because five lives are metaphysically "worth more" than one, but because moral agency requires us to minimize preventable harm when the costs are distributed equally.

  The fundamental flaw in Taurek's coin flip is that it conflates *procedural fairness* with *moral rightness*. Taurek assumes that because we cannot justify the death of the one to the one, we must give them a 50% chance. But this focuses entirely on the input (the decision process) and ignores the output (the body count). Morality is not just about keeping our hands clean through fair procedures; it is about responsible action in the world.

  Consider the perspective of the doctor in the rural clinic. If they flip a coin and it lands on "save the one," four additional people die who did not need to die. Can the doctor justify this to the families of the four? "I wanted to treat your loved one as an equal, so I gave them a 50% chance, even though I knew I could have saved them." This justification fails. The equality Taurek seeks is an equality of *risk*, but what matters in a disaster is an equality of *concern*. Equal concern means valuing every life enough to want to save as many as possible. By flipping a coin, the doctor is effectively saying, "My commitment to a fair procedure is more important than the lives of these four extra patients."

  Furthermore, Taurek's view collapses under the weight of scale, a point often raised by Derek Parfit. If the choice were between saving one person and saving five million, Taurek's logic still suggests a coin flip is permissible (or perhaps required) to respect the one's equal claim. This is absurd. At a certain point, the sheer number of individual claims creates a moral imperative that dwarfs the procedural concern for the single outlier. While Taurek is right that there is no "super-observer," there is a *moral agent* who is responsible for the consequences of their choice.

  Therefore, we should side with Scanlon: the numbers count because the justification for saving the greater number is one that minimizes the number of individuals who can reasonably complain that they were left to die when they could have been saved. The single patient cannot reasonably reject a principle that saves the five, because the alternative is a principle that allows five deaths instead of one. The "loss" is not aggregated into a heap; rather, the *number of failures* is minimized.

  **Conclusion**

  The Ethics Bowl case you are preparing is not merely a puzzle about math; it is a test of how we value human life in conditions of scarcity. Taurek provides a necessary warning against treating people as mere numbers in a utilitarian equation, reminding us that each death is a unique tragedy. However, his conclusion that we should flip a coin mistakes the *experience* of loss for the *responsibility* of the rescuer.

  We must take the side that the numbers count. In a rescue scenario where the cost to the rescuer is equal and the need is identical, saving the greater number is the only choice that respects the value of every life involved. To do otherwise is to privilege the procedural purity of the decision-maker over the actual survival of the patients. We honor the one not by giving them a 50% chance of survival at the cost of four other lives, but by acknowledging that their death is a tragedy, while recognizing that preventing four additional tragedies is the greater moral duty. In the end, ethics is not just about how we decide, but about who lives to tell the story.
