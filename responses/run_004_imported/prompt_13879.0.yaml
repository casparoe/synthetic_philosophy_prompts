      *   **Scanlon's Reply:** Introduce contractualism. The "reasonable rejection" test. Why the one person's complaint against saving the many is weaker than the many's complaint against saving the one. The idea of "generic reasons."
      *   **Taking a Side (The Verdict):** This is the tricky part. I need to choose one and defend it robustly.
          *   *Choice:* I will argue *against* Taurek and *for* counting numbers (aligning with Scanlon, but refining it).
          *   *Reasoning:* While Taurek is right about the *phenomenology* of loss (I only feel my own death), he is wrong about the *moral mathematics* of agency. When an agent acts, they are responsible for the outcome. Failing to save the many when you could is a greater moral failure than failing to save the one. The coin flip fetishizes procedural fairness over substantive outcomes.
          *   *Refinement:* I need to acknowledge Taurek's strength (protecting the minority from being crushed) but show why it fails in the specific "rescue" context.
      *   **Conclusion:** Summarize the argument. Reiterate the verdict.

  5.  **Refining the Argument (Self-Correction during drafting):**
