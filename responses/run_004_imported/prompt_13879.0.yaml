      If you just save the 5: Individual 1 has 0%. Individuals 2-6 have 100%.
      Taurek says the first is fairer.
      My counter: Fairness isn't just about ex-ante probability; it's about ex-post justification.

      *Let's write.*

  8.  **Final Review against constraints:**
