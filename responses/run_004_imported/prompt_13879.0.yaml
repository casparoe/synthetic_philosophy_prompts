      *   *Taurek's Strength:* His point about "separateness of persons" is powerful. I must grant him that persons are distinct, but argue that distinctness doesn't preclude aggregation in *agency*.
      *   *Scanlon's Nuance:* Scanlon argues that the single person *could* reject a utilitarian rule, but cannot reject the "save the more" rule in rescue cases because their loss is the same (death), but the *prevented* loss is greater on the other side.
      *   *My Position:* I will argue that numbers count because moral agency requires minimizing preventable harm when costs are equal. Taurek's coin flip treats the *decision* as the locus of fairness, but the *outcome* is the locus of moral value.

