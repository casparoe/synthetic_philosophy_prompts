answer: |-
  This is an exceptionally sharp objection, and it indicates that your reading group has grasped the stakes of the debate very quickly. What you are articulating is a version of the famous **"Grounding Objection"** to Molinism, coupled with a worry about **theological fatalism**.

  To answer your question directly: **No, it is not a fair criticism of the *internal logic* of Molinism, but it is a formidable metaphysical challenge to its *coherence*.**

  The criticism misdescribes the role of middle knowledge because it assumes God *determines* the truth values of the counterfactuals of creaturely freedom (CCFs). Molinists explicitly deny this. However, your group is right to press on *what* makes those counterfactuals true if not God.

  Here is a breakdown of where the criticism hits home and where it misfires, structured for a graduate-level discussion.

  ### 1. The Misdescription: Who "Fixes" the Counterfactuals?
  Your worry states: *"If God is thereby authoring the entire 'menu' of creaturely dispositions... then the creature's supposedly free choice looks doubly scripted."*

  This is the point where the criticism misdescribes the Molinist system. In Molina's three logical moments of divine knowledge:
  1.  **Natural Knowledge:** God knows all necessary truths and possibilities. (Pre-volitional)
  2.  **Middle Knowledge:** God knows all CCFs (e.g., "If Peter were in C, he would freely deny Christ"). (**Pre-volitional**)
  3.  **Free Knowledge:** God knows what will actually happen because He has decreed to create a specific world. (Post-volitional)

  The crucial distinction is that Middle Knowledge is **pre-volitional**. God does not *will* or *decree* that "Peter would deny Christ in C." Rather, He *sees* that this is true independently of His will.

  **The Molinist Defense:**
  God is not the author of the CCFs. He is constrained by them. Just as God cannot make a square circle (because it violates necessary truths in Natural Knowledge), God cannot actualize a world where Peter is in C and freely affirms Christ *if* the true CCF is that Peter would deny Christ in C.

  Therefore, the "menu" is not scripted by God; it is given to God. He only scripts the **circumstances** (Free Knowledge), not the **responses**. The creature "scripts" the response via their hypothetical free choice. This is why Molinists argue it is not "double scripting." It is single scripting (by the creature) within a selected context (by God).

  ### 2. The Valid Worry: The Grounding Objection
  While the criticism misdescribes the *intent* of Molinism, your reading group has stumbled upon the strongest philosophical argument *against* it. This is known as the **Grounding Objection** (championed by philosophers like William Hasker and Robert Adams).

  The argument runs like this:
  1.  For a proposition to be known by God, it must be true.
  2.  For a proposition to be true, there must be some ontological ground (a truthmaker) that makes it true.
  3.  Consider the CCF: "If Peter were in C, he would freely deny Christ."
  4.  At the logical moment of Middle Knowledge, Peter does not exist. Nor has God decreed that he will exist.
  5.  Therefore, there is no actual Peter to ground the truth of this proposition. Peter isn't there to "make" the choice, even hypothetically.
  6.  If nothing grounds the truth, the proposition is neither true nor false.
  7.  If it has no truth value, God cannot know it.
  8.  Therefore, Middle Knowledge is impossible.

  **Why your group feels it's determinism:**
  If the CCFs are true *before* the creature exists, and God didn't make them true, **what did?**
  *   **Option A:** God made them true. (This leads to your "double scripting" worry and collapses Molinism into Theological Determinism/Calvinism.)
  *   **Option B:** They are just brute facts. (This preserves freedom but seems to posit "truths without truthmakers," which many find metaphysically suspicious.)
  *   **Option C:** The creature's essence makes them true. (Plantinga's view: Peter's "thisness" or haecceity includes these dispositions.)

  If your group finds Option B or C unintelligible, they will naturally slide toward Option A. If Option A is the case, then God *does* fix the dispositions, and Molinism is indeed a "thoroughgoing determinism" that obscures its mechanisms. This is why some critics call Molinism "Calvinism with an extra step."

  ### 3. Molinism vs. Calvinism on "Scripting"
  Is Molinism *more* deterministic than Calvinism, as you suggested? Most Molinists (and many neutral observers) would argue **no**, based on the causal history of the choice.

  *   **In Calvinism:** God's decree is the **efficient cause** of the choice. God moves the will such that the creature necessarily chooses X. The causal chain originates in God.
  *   **In Molinism:** God's decree is the **occasion** for the choice, but the **efficient cause** remains the creature. God places Peter in C, but God does not move Peter's will to deny Christ. Peter's will moves itself.

  Even if God knew Peter would deny Christ from eternity past, the *source* of the action is different.
  *   **The "Double Scripting" Rebuttal:** The Molinist says God only scripts the *stage* (Circumstances). The actor (Creature) scripts the *lines* (Choice).
  *   **The Critic's Rebuttal:** If the Director knows with infallible certainty exactly what lines the actor will say before the actor is even cast, and the Director chooses the cast based on that knowledge to ensure a specific plot, does the actor really have freedom?

  Molinists answer **yes**, because the Director could not *force* the lines. He could only select an actor he knew would say them. Calvinists answer **no**, because the Director wrote the script and ensured the actor performed it.

  ### 4. Contemporary Defenses (Plantinga, Flint, Craig)
  To defend against the charge that God "authors the menu," contemporary Molinists use specific strategies:

  *   **Alvin Plantinga:** He argues that it is possible that God is not omnipotent in the sense of being able to actualize *any* possible world. Due to "Transworld Depravity," it might be that for every possible free creature, there is some circumstance in which they would go wrong. God is limited by the CCFs. This emphasizes that God does *not* fix the counterfactuals; He is subject to them.
  *   **William Lane Craig:** He leans into the idea that CCFs are contingent truths known by God via His omniscience, but they are not *caused* by Him. He argues that the objection confuses **epistemic certainty** with **causal determinism**. Just because God knows it infallibly doesn't mean He caused it.
  *   **Thomas Flint:** Focuses on the idea of "divine providence" without "divine micromanagement." He argues that if God doesn't have Middle Knowledge, He is taking a massive gamble on creation (the "Open Theism" risk). Molinism allows God to be sovereign without being the author of sin.

  ### Summary for Your Seminar
  Your criticism is a fair *challenge* to the metaphysical coherence of Molinism, but it is not a fair description of the *system itself*.

  1.  **Where it misdescribes:** It claims God "fixes" the counterfactuals. Molinism rests entirely on the claim that God *discovers* them pre-volitionally. If God fixed them, it wouldn't be Molinism; it would be a variant of Determinism.
  2.  **Where it hits home:** It exposes the **Grounding Objection**. If you cannot explain what makes the CCFs true prior to creation without appealing to God's will, then Molinism collapses into Determinism.
  3.  **The Calvinist Comparison:** Molinism is not "more thoroughgoing determinism." It is an attempt to keep **libertarian freedom** (the ability to do otherwise in the exact same circumstances, metaphysically speaking) while maintaining **exhaustive divine foreknowledge**. Calvinism sacrifices libertarian freedom for a stronger view of causal sovereignty. Molinism sacrifices the idea that God controls the *truth values* of counterfactuals to preserve libertarian freedom.

  **Suggested Discussion Question for the Group:**
  "If the truth of counterfactuals of creaturely freedom is not grounded in God's will, nor in the actual existence of the creature, is it coherent to say they are 'true' at all? If they aren't true, does God lack knowledge? If they are true, does something other than God control God's creative options?"

  This keeps the focus on the metaphysical tension (Grounding) rather than accusing Molinists of holding a view (God authors CCFs) they explicitly reject.
