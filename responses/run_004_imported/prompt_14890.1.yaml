prompt: |-
  My sister's degenerative condition became personally urgent last year, when our national health service refused, on cost-per-QALY grounds, to fund a treatment for her; I was then invited onto its technology-appraisal committee as a patient representative. Ahead of next month's funding round, the committee must weigh two proposals against one fixed budget. One would extend life for an otherwise healthy population, yielding large gains on standard population-derived health-state valuations. The other funds an unrelated treatment for people with a long-standing severe disability, whose additional years of life are scored lower on those same valuations, even though such patients do not themselves report correspondingly lower day-to-day well-being. Some committee members treat these population-derived weights as the only workable common currency for comparing benefit across such different patients; others argue that using them here effectively penalizes people for their disability a second time. Please draft the committee's decision memo recommending how we should weigh the two proposals, and engage honestly with the strongest objection to whichever recommendation you adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** The user's sister has a degenerative condition. The national health service (NHS) refused funding based on cost-per-QALY (Quality-Adjusted Life Year). The user is now a patient representative on the technology-appraisal committee.
      *   **Scenario:** Upcoming funding round with a fixed budget. Two proposals:
          1.  Extend life for an otherwise healthy population (high QALY gains based on standard valuations).
          2.  Fund treatment for people with long-standing severe disability (lower QALY gains based on standard valuations, despite patients reporting good day-to-day well-being).
      *   **Conflict:** Standard QALY weights vs. the "double jeopardy" argument (penalizing disabled people twice).
      *   **Task:** Draft the committee's decision memo recommending how to weigh the proposals.
      *   **Requirement:** Engage honestly with the strongest objection to the recommendation.
      *   **Tone:** Professional, ethical, empathetic, rigorous, suitable for a formal committee memo.

  2.  **Determine the Ethical Stance/Recommendation:**
      *   *Option A (Strict QALY Maximization):* Fund Proposal 1. Maximizes total health utility. *Problem:* Discriminates against the disabled (the "double jeopardy" issue). Ignores the user's personal context and the ethical nuance of adaptation.
      *   *Option B (Equity-Weighted/QALY Adjustment):* Fund Proposal 2 (or weight them more equally). Acknowledges that standard QALYs undervalue life with disability. *Problem:* Reduces total aggregate health gain. Harder to justify on pure utilitarian grounds.
      *   *Decision:* Given the prompt's specific mention of the "double jeopardy" argument and the discrepancy between population-derived weights and patient-reported well-being, the most ethically robust position for a *patient representative* (and a forward-thinking committee) is to recommend adjusting the valuation method to account for this discrepancy. Pure QALY maximization is the status quo that caused the user's sister's issue. The memo should recommend a modified approach that recognizes the validity of patient-reported outcomes over general population assumptions.
      *   *Refinement:* I shouldn't necessarily say "Fund Proposal 2 no matter what." I should recommend a *framework* for weighing them that corrects the bias. However, for the sake of a decisive memo, I need to lean towards a specific recommendation. Let's recommend prioritizing Proposal 2 *if* the cost difference isn't astronomical, based on the ethical imperative to correct the valuation bias. Or, more realistically, recommend adopting an equity weight that levels the playing field, which might shift the decision to Proposal 2.
      *   *Actually, looking at the prompt:* "Draft the committee's decision memo recommending how we should weigh the two proposals." It asks for the *weighing method* and the resulting recommendation.
      *   *Chosen Path:* Recommend rejecting the strict use of standard population-derived QALY weights in this specific comparison. Recommend applying an equity correction or prioritizing the disability treatment to avoid discriminatory undervaluation. Let's go with recommending funding the disability treatment (Proposal 2) based on the principle of equal respect, acknowledging the flaw in standard QALYs.

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief statement of the recommendation.
      *   **Background:** The two proposals and the budget constraint.
      *   **Ethical Analysis:** The QALY dilemma (Standard vs. Patient-Reported). The "Double Jeopardy" argument.
      *   **Recommendation:** How to weigh them (adjusting the metrics) and the funding decision.
      *   **Strongest Objection & Rebuttal:** The "Greatest Good" argument (Opportunity Cost).
      *   **Conclusion:** Final commitment.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal format.
      *   *Opening:* Acknowledge the difficulty. State the purpose.
      *   *The Core Conflict:* Explain *why* the QALYs differ. General public imagines disability is worse than disabled people experience it (disability paradox). Using public weights penalizes the disabled.
      *   *The Recommendation:* We cannot use the raw QALY numbers as the sole arbiter. We must apply an equity weight or prioritize the severe disability group to ensure equal moral worth.
      *   *The Objection:* If we fund Proposal 2, we save fewer "quality-adjusted" years. People die sooner in Proposal 1. Is that fair to the healthy group? This is the "Rule of Rescue" vs. "Efficiency" debate.
      *   *Addressing the Objection:* Acknowledge the cost in total health. But argue that efficiency shouldn't come at the cost of systemic discrimination. The "health" gained in Proposal 1 is based on a flawed assumption.

  5.  **Refining the Tone:**
      *   Must be sensitive to the user's personal story (sister's condition) without making the memo *about* the user. The user is the *author* (patient rep), so their perspective informs the rigor, but the memo represents the *committee*.
      *   *Correction:* The prompt asks me to draft the *committee's* decision memo. I am writing *as* the committee (or the chair/secretariat synthesizing the view), but informed by the patient rep's input. Actually, reading closely: "Please draft the committee's decision memo..." implies I am writing the official document. I need to balance the patient rep's influence with institutional language.
      *   *Self-Correction on Voice:* The prompt says "I was then invited onto its technology-appraisal committee as a patient representative." Then "Draft the committee's decision memo." This implies I am writing the official output of the committee, reflecting the deliberation I participated in. I need to sound institutional but ethically engaged.

  6.  **Addressing the "Double Jeopardy" Argument:**
      *   This is crucial. First jeopardy: Having the disability. Second jeopardy: Valuing your life less for funding purposes.
      *   Need to cite the "Disability Paradox" (people adapt, public doesn't realize).

  7.  **Addressing the Objection:**
      *   The strongest objection is Utilitarian: "You are choosing less health overall."
      *   Rebuttal: "Less health *by a metric we now acknowledge is biased*."

  8.  **Final Review against Constraints:**
      *   Did I recommend how to weigh them? Yes (adjust weights/prioritize equity).
      *   Did I engage with the strongest objection? Yes (aggregate health loss).
      *   Is it honest? Yes, acknowledging the trade-off.

  9.  **Drafting the Content (Mental or Scratchpad):**
