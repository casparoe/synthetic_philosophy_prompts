  10. **Polishing:** Ensure the distinction between "population-derived health-state valuations" and "patient-reported well-being" is clear. This is the crux of the ethical argument.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm ignoring the healthy population entirely. The recommendation should be about *how to weigh*, which leads to the decision. I will recommend applying an equity multiplier to the QALYs of the disabled group to reflect the valuation error, which tips the scale.

