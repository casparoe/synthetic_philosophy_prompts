answer: |-
  **MEMORANDUM**

  **TO:** National Health Service Board of Directors
  **FROM:** Technology Appraisal Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Funding Allocation: Proposals A (Life Extension) and B (Disability Intervention)

  ### 1. Executive Summary

  The Committee has convened to evaluate two competing proposals for the upcoming funding round, operating within a fixed budget constraint. Proposal A offers life-extension treatment for a generally healthy population, yielding high gains according to standard Quality-Adjusted Life Year (QALY) metrics. Proposal B offers treatment for individuals with long-standing severe disabilities, yielding lower gains under the same metrics.

  After rigorous deliberation, the Committee recommends **funding Proposal B**. This decision is based on a revised weighing framework that corrects for known biases in population-derived health-state valuations when applied to disabled populations. We conclude that adhering to standard QALY calculations in this specific context would constitute inequitable discrimination.

  ### 2. Background and Conflict

  The core of this appraisal lies in the discrepancy between two measures of benefit:
  1.  **Population-Derived Valuations:** Standard QALY weights rely on the general public's estimation of the value of life with a disability. These valuations consistently score life with severe disability as significantly diminished.
  2.  **Patient-Reported Outcomes:** Empirical data from the disabled community indicates that day-to-day well-being and adaptation are often much higher than the general public anticipates (a phenomenon documented in bioethics as the "disability paradox").

  Under standard calculations, Proposal A generates significantly more QALYs per dollar than Proposal B. However, this calculation inherently discounts the value of life for the disabled group based on external assumptions rather than lived experience.

  ### 3. Ethical Analysis and Weighing Framework

  The Committee identified a critical ethical flaw in using standard QALY weights for this specific comparison. Using population-derived weights for disabled patients creates a "double jeopardy" scenario:
  *   **First Jeopardy:** The patients endure the hardships of a severe degenerative condition.
  *   **Second Jeopardy:** Their potential health gains are systematically undervalued in resource allocation because the general public assumes their quality of life is lower than the patients report it to be.

  To treat all citizens with equal moral respect, the Committee determined that we cannot rely on a metric that penalizes a group for a disability they already possess. Therefore, for the purpose of this appraisal, we recommend **adjusting the valuation of Proposal B**. We propose applying an equity weight that aligns the valuation of life-years gained in Proposal B more closely with patient-reported well-being rather than population assumptions.

  When adjusted for this equity weight, the comparative benefit of Proposal B rises substantially, warranting priority over Proposal A despite the lower raw QALY count.

  ### 4. The Strongest Objection: Aggregate Health Loss

  We must engage honestly with the strongest objection to this recommendation: **The Opportunity Cost to the Healthy Population.**

  By funding Proposal B, the Committee acknowledges that we are choosing a path that yields fewer *measured* health units overall. If we accept the standard QALY as the objective truth of health benefit, then funding Proposal B results in a net loss of population health. Members of the healthy population eligible for Proposal A will forego life extension. In a strict utilitarian framework, this is difficult to justify: we are choosing to let more life-years expire in Group A to save fewer quality-adjusted life-years in Group B.

  Critics argue that by correcting for the "bias" in QALYs, we are effectively introducing a new bias against the healthy, prioritizing a specific subgroup at the expense of the aggregate good. If the goal of the health service is to maximize total health, this decision represents a failure of efficiency. There is a real, tangible cost to this decision measured in the shortened lives of the Group A patients.

  ### 5. Rebuttal and Committee Position

  The Committee accepts that there is an opportunity cost. However, we reject the premise that "efficiency" calculated via biased metrics constitutes the "aggregate good."

  1.  **Validity of the Metric:** The objection rests on the assumption that standard QALY weights accurately reflect health benefit. Evidence suggests they do not in this context; they reflect societal prejudice regarding disability. Maximizing a flawed metric does not maximize actual well-being.
  2.  **Justice vs. Efficiency:** A health system serves not only to maximize health but to distribute it justly. A system that systematically devalues the survival of disabled citizens reinforces a social hierarchy where their lives are deemed less worth saving. The cost to Group A is tragic, but it is a cost of maintaining a fair society, not merely an inefficiency.
  3.  **Precedent:** If we fund Proposal A based on these weights, we establish a precedent that a citizen's claim on public health resources is diminished by their disability status. This violates the foundational principle of universal care.

  ### 6. Recommendation

  The Committee recommends **approving Proposal B**.

  We further recommend that the Board formally review the use of population-derived health-state valuations for patients with long-standing disabilities in future appraisal cycles. We must move toward a framework that prioritizes patient-reported experience over public perception to ensure that cost-per-QALY analyses do not function as mechanisms of systemic discrimination.

  **Signed,**

  *The Technology Appraisal Committee*
