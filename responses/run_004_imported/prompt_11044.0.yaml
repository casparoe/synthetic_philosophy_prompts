          *   Implication: Kelly is just EUT with $U(w) = \ln(w)$. No special status, just a specific utility function.
          *   *Assessment:* Mathematically correct. Normatively strong point: why *this* utility function?

      *   **Felix Move 2 (Ergodicity):**
          *   Claim: Wealth process is non-ergodic. Ensemble average (EV) $\neq$ Time average.
          *   Implication: Log wealth isn't a preference; it's the correct statistic for the time-average growth rate. EUT is "wrong" because it averages over parallel universes, not time.
          *   *Assessment:* This is the core of "Ergodicity Economics" (Peters, Gell-Mann). Technically correct about non-ergodicity. Normative leap: Why *must* an agent care about the time average?

      *   **Naomi Move 2 (The Normative Gap):**
