      *Actually, let's make it even more robust:* Recommend adopting the **US OMB Circular A-94 guidelines** (or state equivalent) which often distinguish between public investment and regulatory analysis. But for a town, that's too bureaucratic.
      *Back to the Two-Tier:* It's the strongest governance move. It stops the "pick a number for this project" game.

