answer: |-
  **MEMORANDUM**

  **TO:** Capital Planning Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Discount Rate Policy for Long-Term Infrastructure

  **Purpose**
  This Thursday, we must vote on the Seawall Resiliency Project. However, the deeper decision before us is establishing a principled discount rate policy for all future capital planning. Currently, we lack a standardized approach, which creates the risk that discount rates are selected *post hoc* to justify predetermined outcomes. This memo recommends a tiered discounting framework that balances fiscal prudence with intergenerational equity.

  **The Economic Conflict**
  Our current debate reflects a standard tension in public economics:

  1.  **The Fiscal Argument (Finance Dept):** Public funds have an opportunity cost. If we do not spend $30M on a seawall, we can retire debt or fund other services. Using the municipal bond rate (~5% nominal) ensures we do not invest in projects that yield less than our cost of capital. This protects current taxpayers from inefficient spending.
  2.  **The Intergenerational Argument (Resiliency):** For assets with 80+ year lifespans, standard discounting effectively assigns zero value to benefits accruing to future residents. Ethical frameworks (such as those used in climate economics) suggest that "pure time preference"—valuing a dollar less simply because it is spent 50 years from now—is difficult to justify when the beneficiaries are our own descendants.

  Both arguments are valid. The Finance position protects the town's solvency today; the Resiliency position protects the town's existence tomorrow. The error lies in applying a short-term financing rate to a multi-generational asset.

  **Recommendation: A Tiered Real Discount Rate Policy**
  To resolve this without resorting to arbitrary number-picking, I recommend we adopt a **Two-Tier Real Discount Rate Policy** effective immediately.

  *   **Tier 1: Standard Capital (Useful life < 50 years)**
      *   **Rate:** The Town's current Real Cost of Borrowing (Nominal Bond Rate minus expected inflation).
      *   **Rationale:** For schools, vehicles, and standard infrastructure, we should prioritize fiscal efficiency. If a project doesn't beat our borrowing cost, we shouldn't undertake it.
  *   **Tier 2: Intergenerational Assets (Useful life ≥ 50 years)**
      *   **Rate:** A fixed **2.0% Real Discount Rate**.
      *   **Rationale:** For seawalls, climate hardening, and century-scale infrastructure, the "cost of capital" is less relevant than the "cost of risk." A 2% rate acknowledges that money has time value (addressing Finance's concern) but avoids mathematically erasing the value of future safety (addressing Resiliency's concern). This aligns with guidance used by federal agencies for long-term regulatory analysis.

  **Why This Approach?**
  1.  **It Prevents Gaming:** By codifying the rates and the threshold (50 years) *before* project selection, we remove the ability to adjust the discount rate to force a specific project's approval.
  2.  **It Acknowledges Risk, Not Just Impatience:** A non-zero rate (2%) accounts for the uncertainty that the asset will be needed or will function as intended. It does not assume the future is guaranteed, only that it is not worthless.
  3.  **It Aligns Horizon with Valuation:** It is inconsistent to fund an 80-year asset with a 30-year bond rate. This policy matches the valuation horizon to the asset's physical lifespan.

  **Decision Required**
  I move that we adopt this Tiered Real Discount Rate Policy. If adopted, we will apply the Tier 2 (2.0% Real) rate to the Seawall Proposal for Thursday's vote.

  This allows us to vote based on the project's actual merits, rather than debating the calculator settings.

  **Attachments:**
  *   *Sensitivity Analysis: Seawall NPV at 5% Nominal vs. 2% Real*
  *   *Summary of OMB Circular A-94 Guidelines for Long-Term Analysis*
