  7.  **Final Polish:** Ensure the distinction between *nominal* and *real* rates is clear (municipal bond rates are usually nominal, discount rates for CBA should be real). I should specify **Real Discount Rate** to avoid inflation confusion. If the bond rate is 5% nominal and inflation is 2.5%, the real rate is ~2.5%. This actually helps the compromise. I will specify "Real Rate" to be precise.

