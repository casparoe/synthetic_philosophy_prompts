  6.  **Final Polish:**
      *   Add sensory details (cold coffee, neon sign).
      *   Ensure the pacing feels like a real conversation (interruptions, pauses, reflections).
      *   Make sure the ending feels earned.

  7.  **Final Review against constraints:**
