answer: |-
  This is a magnificent pivot point for a novel. You have identified the exact fault line where modern conservation theory was born. To give your conservator the "argumentative bite" you need, you must arm her with the understanding that Ruskin is making the **stronger, ontological claim**, and that the distinction between "restoration" and "propping" rests on **honesty versus deception.**

  Here is the breakdown of the logic you need to fuel her arguments.

  ### 1. The Nature of the "Lie": Ontological, Not Practical

  To answer your first question: Ruskin is absolutely making the stronger claim. He is not arguing that we lack the skill to copy the past; he is arguing that **a copy is a different category of object than the original, regardless of visual fidelity.**

  For Ruskin, the value of a cathedral is not merely aesthetic (how it looks) but historical and moral (what it *is*). The building is a physical witness to the past. The stone is an indexical trace of the human hands that cut it and the time that has weathered it.

  *   **The Argument:** If your conservator's rival says, "We have the original drawings and the finest stonemasons; we can make it identical," her counter-argument must be: **"It will not be identical. It will be a forgery."**
  *   **The Logic:** A building rebuilt today, even using medieval techniques, is a 20th-century (or 21st-century) building pretending to be medieval. It lies about its own age. It erases the evidence of the bomb damage, which is now *also* part of the cathedral's history.
  *   **For the Novel:** Your conservator should argue that the bomb damage is not a defect to be removed, but a chapter in the book of the building's life. To rebuild the west front "as new" is to tear out the page describing the war. It creates a "Disneyfied" past—a clean, perfect lie that comforts the living but dishonors the dead (both the original masons and the victims of the bombing).

  **Key Phrase for your Character:** "You are not restoring the cathedral; you are replacing it with a model of what you think it should have been. You are prioritizing the *image* of the church over the *truth* of the church."

  ### 2. The Crutch vs. The Limb: Honesty of Intervention

  To answer your second question: Why are iron ties and timber props permissible if they also alter the fabric?

  The distinction lies in **intent** and **visibility**.

  *   **Restoration (The Lie):** The goal of restoration, in Ruskin's sense, is to *conceal* the passage of time. It attempts to make the new stone look old, or to hide the join between old and new. It seeks to deceive the viewer into believing the building has not suffered. It claims a continuity of existence that does not exist.
  *   **Conservation/Propping (The Truth):** The goal of the iron tie or timber prop is to *arrest* decay without hiding it. Ruskin explicitly says, "do not care about the unsightliness of the aid." The crutch is visible. It admits: *This building is old, it is damaged, and it is fragile.* It supports the authentic fabric without pretending to *be* the authentic fabric.

  **The Principle:** Intervention is ethical only if it is honest about its own modernity.

  *   **For the Novel:** The rival architect likely wants the ironwork hidden, the stonework cleaned, the scars filled. Your conservator should argue for the "honest crutch." If a wall is unstable, buttress it with steel, but leave the steel visible. Let the viewer see the struggle to keep the history standing.
  *   **The Dramatic Conflict:** The Diocese wants a symbol of Resurrection (perfect, risen, new). The Conservator wants a symbol of Survival (scarred, patched, enduring). Both are theological positions, which makes for excellent conflict.

  ### 3. Translating this into Dialogue and Scene

  To make this sing in your book, your conservator needs to move beyond "Ruskin said..." and embody the philosophy. Here are three angles she can take in her arguments with the rival architect:

  **A. The Argument from Witness**
  > "This stone was cut by a man who died in 1340. This scar was made by a bomb that fell in 1944. If you replace this stone, you silence both of them. You are not healing the building; you are lobotomizing it. You want a cathedral that looks like it never suffered. I want one that testifies to what it survived."

  **B. The Argument from Forgery**
  > "If I paint a perfect copy of a Rembrandt, it is still a fake, even if the chemicals match. Why is architecture different? If you rebuild this facade, you are asking the public to believe they are looking at the 13th century. They will be looking at the 20th century wearing a mask. Is the Church founded on lies?"

  **C. The Argument from the Crutch**
  > "You call my steel beams an eyesore. I call them honesty. You want to hide the supports, to make the building stand as if by magic. I say let the supports show. Let the people see that we are holding her up. There is more holiness in the struggle to preserve than in the pretense of perfection."

  ### 4. A Nuance for your Plot: The "Bomb-Damaged" Context

  Ruskin was writing about natural decay and the "restoration" crazes of Victorian architects (like Viollet-le-Duc) who scraped off grime and replaced gargoyles. Your novel adds the layer of **war damage**.

  This complicates things in a fascinating way.
  *   **The Rival's Best Argument:** "The bomb damage is not 'history'; it is a wound. A cathedral is a living house of God, not a museum. It must function. It must inspire. A ruin does not inspire hope; a restored church does."
  *   **The Conservator's Counter:** "Hope built on a lie is fragile. If we pretend the war didn't touch us, we learn nothing. The ruin *is* the memorial. To rebuild is to say the destruction didn't matter."

  ### Summary of the Distinction for your Notes

  | Feature | **Restoration (Ruskin's "Lie")** | **Conservation (Ruskin's "Care")** |
  | :--- | :--- | :--- |
  | **Goal** | To return the building to a hypothetical past state. | To sustain the building in its current state. |
  | **Method** | Replacement of missing parts; hiding damage. | Stabilization of existing parts; acknowledging damage. |
  | **Truth Claim** | "This is the original building." | "This is the original building, kept from falling." |
  | **Visuals** | Seams hidden; new stone aged to match old. | Interventions visible (the "unsightly aid"). |
  | **Metaphor** | Resurrection (raising the dead). | Palliative Care (keeping the living alive). |

  Your conservator's victory (or tragic defeat) should hinge on whether she can convince the others that **authenticity is more sacred than beauty.** That is the heart of Ruskin's Lamp of Memory.
