answer: |-
  This is a fantastic tension to hang a dissertation on, because it cuts to the heart of the difference between **formal utilitarianism** and **pragmatic humanism**. You are right to spot that Longtermists treat the 1928 paper as the whole of Ramsey, while ignoring the *Epilogue* as mere color commentary. They shouldn't.

  If you force 1920s Ramsey into a room with a modern Longtermist, **Ramsey wins**, but not for the reasons you might expect. He doesn't win by reinstating pure time preference. He wins by rejecting the Longtermist's *ontology of value*.

  Here is the resolution: Ramsey would argue that the Longtermist has committed a category error by treating the **mathematical model** (1928) as the **meta-ethical reality** (Epilogue).

  Here is how Ramsey shakes this out, point by point.

  ### 1. The Distinction Between "Pure Time" and "Human Perspective"
  In the 1928 paper, when Ramsey calls pure time preference "ethically indefensible," he is making a specific claim about **interpersonal equity within a continuous society**. He is arguing that my grandson's utility shouldn't count for less than mine *simply* because he is born later. He is fighting against selfishness and short-sightedness in fiscal policy.

  However, in the *Epilogue*, Ramsey is fighting against **nihilism**. His "threepenny bits" metaphor is a pragmatic instruction on how to maintain agency. If you draw the world "to scale" (i.e., acknowledging the actual astronomical stakes Longtermists care about), human action becomes meaningless.

  **The Resolution:** Ramsey would tell the Longtermist: *"I banned pure time preference to ensure justice between generations, not to obligate you to maximize utility across the heat death of the universe."*
  The 1928 constraint is a **negative constraint** (do not discriminate arbitrarily), not a **positive command** (maximize across all possible light-cones). Longtermism treats the absence of a discount rate as an engine for infinite obligation. Ramsey treats it as a floor for fairness.

  ### 2. Probability vs. Time (The Technical Knockout)
  This is where your diss can get technical. Ramsey's 1928 model allows for discounting based on **probability of existence**. He writes:
  > *"We can discount future enjoyments... if there is a probability that the community will cease to exist."*

  Longtermists often glide over this. They say, "Sure, discount by extinction risk, but the future is so vast that even a tiny probability leaves astronomical expected value."

  Ramsey, the father of subjective probability (Bayesianism), would be deeply suspicious of the Longtermist's probability estimates regarding AI and the far future. To Ramsey, probability is a measure of **reasonable belief** tied to evidence, not a metaphysical frequency.
  *   **Ramsey's View:** Assigning a precise non-zero probability to specific outcomes 10,000 years hence (AI utopia vs. squalor) is epistemically bankrupt. If the uncertainty is radical (Knightian uncertainty), the expected value calculation collapses.
  *   **The Verdict:** Ramsey would argue that the "astronomical expected value" is a mathematical artifact of plugging speculative variables into a rigid formula. He would discount the far future heavily based on **epistemic uncertainty**, not time preference. The "compound discount" he mentions in the *Epilogue* regarding the heat death is likely a proxy for this radical uncertainty and the diminishing marginal relevance to *current* action.

  ### 3. The Pragmatic Limit of "The Good"
  Ramsey was a pragmatist (influenced by Peirce and Wittgenstein). For a pragmatist, truth and value are tied to **successful action within a form of life**.
  *   **Longtermism:** Value is abstract, additive, and independent of the valuer. A happy person in 3024 adds +1 to the universe's score, even if no one in 2024 can meaningfully conceive of them.
  *   **Ramsey:** Value is tied to human interests and the "human perspective." In the *Epilogue*, he explicitly states that our values are ours. To reorganize them based on cosmic scale is to lose the very perspective that makes valuation possible.

  **The Knockout Punch:** Ramsey would argue that Longtermism violates the **condition of meaningfulness**. If a calculation tells you that a certain death today is preferable to a 0.00001% reduction in x-risk, the calculation has detached from the human form of life that gives "death" and "risk" their meaning.
  He would say the Longtermist is drawing the map "to scale" when ethics requires drawing it "in perspective." The stars *must* be threepenny bits for human ethics to function. If you make them suns, you aren't doing ethics; you're doing astrophysics.

  ### 4. Diminishing Marginal Utility of "Existence"
  Ramsey's 1928 model relies heavily on diminishing marginal utility of *consumption*. He assumes future generations will be richer, so we should save less.
  Longtermism shifts the metric from *consumption/welfare* to *existence*. They argue that preventing extinction is paramount because it preserves the *possibility* of value.

  Ramsey would likely reject this lexical priority. His utilitarianism is about **enjoyment/welfare**, not **potentiality**.
  *   **Ramsey:** "I am concerned with the happiness of people who exist or will reasonably exist."
  *   **Longtermist:** "I am concerned with the happiness of people who *could* exist."
  Ramsey's framework doesn't support the moral weight of "possible people" to the degree required for the "astronomical waste" argument. To Ramsey, a future that is too distant to be connected to current causal chains by anything other than speculative probability ceases to be a moral patient and becomes a mathematical variable.

  ### The Verdict for Your Diss
  If you need a definitive stance for your argument, here it is:

  **Ramsey resolves the tension by subordinating the 1928 Math to the Epilogue's Pragmatism.**

  He would tell the Longtermist:
  1.  **You are right** that we shouldn't discount the future *purely* because it is later (1928).
  2.  **But you are wrong** that this obligates us to prioritize the far future over the near future (Epilogue).
  3.  **Why?** Because the "value" of the far future is discounted by **uncertainty** and **relevance to human agency**.

  The Longtermist logic fails Ramsey's test because it ignores the **perspectival nature of value**. Ramsey's "ethically indefensible" line is a constraint on *discrimination*, not a mandate for *maximization*. Longtermism uses the former to justify the latter. Ramsey would call this a "confusion of logic," akin to treating a rule of fairness as a law of physics.

  **In short:** Ramsey saves the Longtermist from pure time preference, but the *Epilogue* saves Ramsey from the Longtermist. The "threepenny bits" line isn't a contradiction of the 1928 paper; it's the **boundary condition** for it. Ethics stops where human perspective ends.

  **Dissertation Tip:** Frame this as the difference between **Ideal Theory** (1928) and **Non-Ideal/Pragmatic Theory** (Epilogue). Longtermists treat Ramsey's Ideal Theory as actionable in the Non-Ideal world. Ramsey would say that without the perspective constraint, Ideal Theory becomes dangerous nonsense.
