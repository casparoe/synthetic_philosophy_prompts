answer: |-
  **Title:** The Silence of the Tetralemma: Why Presupposition Failure Trumps Dialetheism in Madhyamaka

  **Introduction**

  The interpretation of Nāgārjuna's *catuṣkoṭi* (tetralemma) in the *Mūlamadhyamakakārikā* (MMK) represents one of the most contentious fault lines in contemporary Buddhist studies and comparative philosophy. The crux of the debate lies in MMK Chapter 18, where Nāgārjuna deploys the four corners—$A$, $\neg A$, $A \land \neg A$, and $\neg(A \lor \neg A)$—regarding the nature of reality and the Tathāgata. For the formal semanticist, the question is logical: does Nāgārjuna intend to violate the Law of Non-Contradiction (LNC), or does he intend to demonstrate the inapplicability of the logical framework itself?

  On one side, the "dialetheist" reading (championed by Jay Garfield and Graham Priest) argues that Nāgārjuna is a realist about contradictions at the limit of thought, requiring a paraconsistent logic (such as LP) to model the truth of emptiness. On the other, the "presupposition failure" reading (defended by Jan Westerhoff and Tom Tillemans) argues that the four corners share a false existential presupposition (*svabhāva*), rendering them neither true nor false, thus preserving classical logic while dissolving the metaphysical stakes.

  This essay will first reconstruct the strongest version of the dialetheist argument, followed by the presupposition failure argument. It will then argue decisively for the presupposition failure reading. I contend that the dialetheist interpretation, while formally elegant, inadvertently reifies emptiness into a contradictory essence, thereby violating Nāgārjuna's soteriological aim of ending conceptual proliferation (*prapañca*). The Two Truths doctrine, properly understood, supports the view that Ultimate Truth is not a paradoxical description of reality, but the therapeutic realization that the questions posed by Reified Conventional Truth are ill-formed.

  ### I. The Case for Dialetheism: Emptiness as Paradox

  The dialetheist reading rests on a literalist hermeneutic and a specific understanding of the limits of language. Its strongest argument is textual fidelity combined with logical necessity.

  **1. Textual Literalism:**
  In MMK 18.8, Nāgārjuna states: "All is real, or all is unreal; all is both real and unreal; all is neither unreal nor real. This is the graduated teaching of the Buddha." The dialetheist argues that we cannot explain away the third corner ("both real and unreal") as mere metaphor without imposing an external logical bias onto the text. If Nāgārjuna explicitly affirms the third corner as the Buddha's teaching, he is asserting that there are true contradictions. To claim he is "speaking loosely" is to assume classical logic is a precondition for intelligibility, which is precisely what Madhyamaka challenges.

  **2. The Limit of Conceptualization:**
  Garfield and Priest argue that emptiness (*śūnyatā*) is not a nihilistic void but the very condition of possibility for conventional existence. However, when language attempts to grasp this condition, it encounters a limit. Conventional truth depends on Ultimate truth (emptiness), but Ultimate truth is nothing other than the emptiness of Conventional truth. This reciprocal dependence creates a paradoxical loop. At the limit of thought (Nirvana), distinctions collapse. If we say "Nirvana is not existence," we reify it. If we say "Nirvana is existence," we reify it. The only accurate description is that it is both and neither.

  **3. Logical Necessity (Paraconsistency):**
  If Nāgārjuna accepts true contradictions but rejects the Principle of Explosion (that from a contradiction, anything follows), he is implicitly using a paraconsistent logic. Classical logic cannot handle the *catuṣkoṭi* without trivializing the system. Therefore, to make Nāgārjuna rational, we must attribute to him a logic that tolerates gluts (truth-value overlaps). The dialetheist argues this is not a bug but a feature: reality itself, at the ultimate level, is inconsistent. The Two Truths are not separate domains; they are identical yet distinct, a relationship that is inherently contradictory.

  ### II. The Case for Presupposition Failure: The *Prasaṅga* Method

  The presupposition failure reading argues that the *catuṣkoṭi* is not a positive metaphysical claim but a *prasaṅga* (reductio ad absurdum) designed to expose the incoherence of essentialism.

  **1. The Hidden Variable (*Svabhāva*):**
  Westerhoff argues that every horn of the tetralemma implicitly contains the predicate "has inherent existence." The four corners are not simply $A$ and $\neg A$, but $A(s)$ and $\neg A(s)$, where $s$ stands for *svabhāva*. Since Nāgārjuna's central thesis is that nothing possesses *svabhāva*, the presupposition of the question fails. In formal semantics, if a statement $P$ presupposes $Q$, and $Q$ is false, $P$ lacks a truth value (or is uniformly false). Thus, "The Tathāgata exists (inherently)" is not false in the sense of $\neg A$; it is a category mistake. All four horns are rejected not because reality is contradictory, but because the framework used to describe it is inapplicable.

  **2. The Soteriological Goal (*Prapañca*):**
  Nāgārjuna's goal is the cessation of suffering, which is caused by conceptual proliferation (*prapañca*). Accepting true contradictions (dialetheism) is itself a form of *prapañca*. It posits a metaphysical state of affairs ("contradictory reality") that the mind must grasp. The presupposition reading aligns better with the therapeutic nature of Madhyamaka: the logic is used to purge the patient of views, not to install a new, paradoxical view. As Nāgārjuna says in MMK 13.8, "Those for whom emptiness is a view, them I declare to be incurable." Dialetheism risks turning emptiness into a view.

  **3. Preservation of Classical Logic:**
  This reading does not require exotic logic. It operates perfectly well within classical logic augmented by a theory of presupposition failure (akin to Strawson or Keenan). The "rejection" of the four corners is not the assertion of their negation, but the refusal to engage the question. This preserves the Law of Non-Contradiction for the conventional world (where it is useful) while showing it does not apply to the ultimate (because there is no "ultimate object" to predicate over).

  ### III. The Verdict: Why Presupposition Failure Wins

  While the dialetheist reading is philosophically provocative and formally rigorous, it ultimately fails as a hermeneutic of Nāgārjuna's intent. The presupposition failure reading is superior because it respects the anti-metaphysical core of Madhyamaka and provides a more coherent account of the Two Truths.

  **1. The Reification of Emptiness:**
  The fatal flaw of the dialetheist reading is that it turns *śūnyatā* into a *svabhāva* of a peculiar kind: a "contradictory essence." If Ultimate Truth is the fact that reality is both $A$ and $\neg A$, then "being contradictory" becomes the intrinsic nature of things. This violates MMK 13, where Nāgārjuna explicitly warns against reifying emptiness. The dialetheist saves the phenomena of the text (the affirmation of the third corner) but sacrifices the philosophy (the rejection of all views). The presupposition reading sacrifices the literal surface of the text (reading the affirmation as pedagogical or contextual) to save the philosophy. In Madhyamaka, philosophy (soteriology) must trump literalism.

  **2. The Two Truths and the Status of Logic:**
  The dialetheist relies on a specific interpretation of the Two Truths where the Ultimate validates the contradictions of the Conventional. However, a more robust reading of the Two Truths sees Conventional Truth (*saṃvṛti-satya*) as the domain of logic, language, and causality, and Ultimate Truth (*paramārtha-satya*) as the *absence* of ontological commitments.
  *   **Conventional:** Here, classical logic holds. Fire is hot, not cold. This is necessary for navigation and karma.
  *   **Ultimate:** This is not a "higher realm" with different logic; it is the realization that the Conventional lacks inherent grounding.
  If Ultimate Truth were a realm of true contradictions, it would be a *something* that could be known. But Nāgārjuna describes it as the "cessation of conceptualization" (MMK 18.9). You cannot conceptualize a contradiction without proliferating concepts. Therefore, the Ultimate cannot be a dialetheic state; it must be the silence that follows the realization that the questions presuppose *svabhāva*.

  **3. Semantic Precision:**
  From the perspective of formal semantics, the presupposition failure model is more precise. The dialetheist model requires us to accept that predicates like "exists" and "does not exist" can simultaneously apply to the same subject in the same respect. But Nāgārjuna's analysis of causation (MMK 1) shows that "existence" and "non-existence" are dependent on the concept of *svabhāva*. Once *svabhāva* is removed, the predicates lose their semantic anchors. It is not that the sentence "The Tathāgata exists" is True and False; it is that the term "Tathāgata" (conceived as an independent agent) fails to refer. This is not a truth-value glut; it is a reference failure.

  **Conclusion**

  The dialetheist reading is seductive because it makes Nāgārjuna a pioneer of non-classical logic, resonating with modern paraconsistent systems. However, it mistakes the *tool* for the *goal*. Nāgārjuna uses the *catuṣkoṭi* not to map the contradictory structure of reality, but to exhaust the possibilities of essentialist discourse. By demonstrating that all four horns lead to absurdity *given the presupposition of inherent existence*, he forces the interlocutor to drop the presupposition.

  Therefore, the "no real contradiction" reading is correct. The Two Truths doctrine supports this: Conventional Truth is where we use logic to navigate a world of dependently arisen phenomena; Ultimate Truth is the realization that those phenomena have no inherent nature to support the logical predicates we impose upon them. To claim that reality is contradictory is to claim we know what reality is. To claim that our predicates fail to latch onto reality is to remain faithful to the emptiness of all views. Nāgārjuna is not a dialetheist; he is a therapeutic semanticist who shows that the only way to win the game is to stop playing.
