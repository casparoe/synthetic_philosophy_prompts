answer: |-
  This is a fantastic observation, and you are absolutely right to push back against the seminar's dismissal of Section 9. It is one of the most fascinating moments in the paper precisely because it reveals Turing not as a speculative sci-fi writer, but as a rigorous experimentalist trying to isolate variables.

  You've identified the tension perfectly: On the one hand, 1950 Turing writes that the statistical evidence for ESP is "overwhelming." On the other hand, Bletchley Turing invented the *ban* and *deciban*, effectively pioneering the log-Bayes factor and understanding better than almost anyone alive how to weigh evidence against background probability.

  If we take the 1950 text seriously, but filter it through his actual statistical methodology (Banburismus), here is how Turing would likely navigate the Bem vs. Wagenmakers controversy.

  ### 1. The 1950 Context: Why "Overwhelming"?
  First, we have to contextualize Turing's "overwhelming" claim. In 1950, J.B. Rhine's experiments at Duke University were not considered fringe in the way they are today. They were published in mainstream journals, and the statistical methods of the time (largely frequentist NHST) were less sensitive to the issues of priors and multiple comparisons that we worry about now.

  When Turing says the evidence is overwhelming, he is likely deferring to the scientific consensus of his day regarding *statistical significance*. However, notice what he does with that concession. He doesn't say, "Therefore machines can't think." He says, "Therefore we must build a telepathy-proof room."

  This is the key: **Turing treats ESP as a confounding variable, not a metaphysical truth.** He is bulletproofing the Imitation Game. He is essentially saying, "Even if we grant the skeptics' worst nightmare—that humans have magic powers—the test can still be designed to control for it."

  ### 2. Turing vs. Bem: The Prior Problem
  Daryl Bem's 2011 *Feeling the Future* paper relied on standard $p$-values. Wagenmakers' critique was fundamentally Bayesian: Bem calculated the likelihood of the data given the null, but failed to properly account for the **prior probability** of the hypothesis. Because precognition violates causality, the prior should be vanishingly small. Bem used a default prior, which artificially inflated the Bayes Factor.

  Would Turing make Bem's mistake?

  **Based on the 1950 text:** It looks like he might. He accepted Rhine's statistics without seemingly demanding a massive evidentiary burden to overcome the low prior of telepathy. If you read Section 9 in isolation, 1950 Turing looks like he fell for the "significance equals truth" fallacy that Bem did.

  **Based on his Bletchley methodology:** Absolutely not. The entire logic of Banburismus was built on the idea that you cannot evaluate a signal without a "crib" (a theoretical anchor or prior expectation). Turing knew that a statistical anomaly without a plausible mechanism is usually noise. He understood that the weight of evidence required to prove an unlikely hypothesis is exponentially higher than for a likely one.

  If you apply the *Banburismus Turing* to the *Bem data*, he would side with **Wagenmakers on the math**. He would recognize that Bem's Bayes Factors were calculated using a prior that did not reflect the background knowledge of physics. Turing was a materialist; he knew that precognition breaks the causal structure of the universe. To convince him, you wouldn't just need $p < .05$; you would need enough bans to overcome the massive negative weight of the prior against causality violation.

  ### 3. Turing vs. Bem: The Methodological Problem
  However, Turing might not be as dismissive of Bem as Wagenmakers was. Wagenmakers' stance was largely that the priors are *so* low that the evidence is effectively zero. Turing's stance in Section 9 suggests he would be more interested in **experimental control**.

  Bem's experiments were criticized for "flexible data analysis" (p-hacking)—checking the data midway, changing exclusion criteria, etc. Turing's proposal of the "telepathy-proof room" shows his instinct was to **preregister the constraints**.

  Turing would likely look at Bem's methodology and say: *You haven't isolated the variable.*
  *   **Bem:** "The data shows an anomaly."
  *   **Turing:** "Have you controlled for information leakage? Have you controlled for selection bias? Is the room telepathy-proof?"

  Turing would likely view the failure to replicate not as proof that psi is impossible, but as proof that the **experimental setup was leaky**. This aligns with his view in 1950: if the statistics are inconsistent, you don't necessarily discard the phenomenon; you tighten the test conditions (the lead-lined room).

  ### 4. Would he be prone to Bem's mistake?
  The specific mistake Wagenmakers accused Bem of was **ignoring the prior**.

  Here is the nuanced verdict: **1950 Turing was prone to this mistake; Bletchley Turing was not.**

  In 1950, Turing was writing a philosophical paper, not a statistical analysis. He was willing to accept the "scientific consensus" of the 1940s (Rhine) as a premise to move his argument forward. In that specific text, he displays the exact vulnerability Bem showed: accepting statistical significance as "overwhelming" despite the theoretical implausibility.

  *However*, if you ask how Turing would *reason* about the Bem affair using his actual cognitive toolkit:
  1.  **He would demand a skeptical prior.** His work on Enigma proved he knew that unlikely settings require more evidence to confirm than likely ones. He would agree with Wagenmakers that Bem's default prior was inappropriate.
  2.  **He would demand preregistration.** The "telepathy-proof room" is essentially a call for strict experimental protocol to prevent data dredging. He would see Bem's flexibility as a failure of experimental design, not necessarily a fraud, but a failure to isolate the signal.
  3.  **He would remain agnostic, not dismissive.** This is where he differs from hardline skeptics. Turing didn't laugh at ESP; he planned for it. He would likely argue that while Bem's *evidence* was insufficient (due to priors and methods), the *question* remains open until a properly controlled, telepathy-proof experiment is run.

  ### Conclusion
  If Turing were reviewing Bem's 2011 paper today:

  1.  **He would side with Wagenmakers on the statistics:** He would agree that without a justified prior, the Bayes Factor is meaningless. He would recognize that "overwhelming" statistical significance is not enough to overturn established physical laws without correspondingly overwhelming Bayesian weight.
  2.  **He would side with neither on the ontology:** He wouldn't declare psi impossible (like a hard skeptic), nor would he declare it proven (like Bem). He would declare the **experiment inconclusive** due to lack of controls.
  3.  **He would not make Bem's mistake:** While Section 9 *says* the evidence is overwhelming, that was a rhetorical move to save the Turing Test from a counter-argument. His actual statistical practice (Banburismus) proves he understood that low-probability hypotheses require exponential evidence. He would spot the prior error immediately.

  The students laughing at Section 9 miss the point. Turing wasn't endorsing telepathy; he was **stress-testing the definition of intelligence.** He was saying that if we are going to judge intelligence by behavior, we must ensure that the behavior isn't caused by something outside the cognitive domain we are testing. In the Bem controversy, Turing would be the one in the corner saying, "The math is wrong, the priors are naive, but until we run this in a telepathy-proof room with preregistered analysis, stop arguing and start designing."
