answer: |-
  The air in Judge Alsop's chambers was still, cooled to a temperature that preserved paper and patience. Outside the heavy oak doors, the hum of the courthouse continued—clerks scurrying, phones ringing, the low thrum of justice as an industry. Inside, only the sound of ice clinking in a glass of water broke the silence.

  Judge Elias Alsop stood by the window, looking out at the city grid. Judge Maria Reyes sat at the conference table, a red pen hovering over a printed draft of the *Migratory Habitat Preservation Act*. Between them lay the briefs for *Audubon Alliance v. State University*, a case that had started as a nuisance and metastasized into a referendum on how they did their jobs.

  "It's a wind pole, Elias," Reyes said, her voice low but carrying. "Not a skyscraper. Not even a billboard. It's a fiberglass stick they put up for twenty-one days to measure turbulence. And it's telescoping. For half the day, it's under twelve feet."

  Alsop turned from the window. He was a man of sharp angles and pressed suits, his reputation built on the idea that the law was a fortress, not a clay sculpture. "The statute prohibits 'any structure exceeding twelve feet in height.' It does not say 'permanent structure.' It does not say 'structure at maximum extension.' It says 'structure.' And when extended, it is fourteen feet."

  Reyes capped her pen. "You're reading the dictionary, not the law. The MHPA was designed to stop nesting corridors from being blocked by permanent obstructions. The committee reports are explicit. They were worried about communication towers and apartment complexes cutting off migratory paths. A temporary research tool doesn't implicate that mischief."

  "And that is precisely the problem," Alsop said, walking to the table but not sitting. He rested his hands on the back of a chair. "You are asking me to enforce the committee report, not the statute. The committee report is not law. It was not voted on. It was not signed by the President. If Congress wanted to exempt temporary scientific equipment, they knew how to write that. They've done it in the Clean Water Act. They didn't do it here."

  "Because they didn't think about it," Reyes countered. "Legislative silence isn't always a deliberate choice. Sometimes it's just an oversight. If we apply the text with robotic literalism, we defeat the purpose of the enactment. That's the *mischief rule*, Elias. We look at the defect the law was meant to cure. Does a three-week pole cure nothing? No. Does removing it help the birds? Negligibly. So why are we doing it?"

  "Because predictability matters more than perfection," Alsop said. "If I tell the university that 'structure' implies 'permanent structure,' where does that line end? Is a tent a structure? Is a birdhouse? Is a graduate student standing on a ladder? If I start importing exceptions based on what I think is 'reasonable,' I am legislating. The next time a developer puts up a temporary crane for a month, they'll cite this case. 'If the pole was okay, our crane is okay.' And I will have no textual basis to stop them."

  Reyes leaned forward. "But you have a basis to stop them. You have the purpose of the Act. A crane blocks a flight path just like a tower. A wind pole does not. The ordinary meaning of 'structure' is context-dependent. If I tell you I saw a structure in the desert, you imagine a building. If I tell you I saw a structure in a child's sandbox, you imagine a castle made of buckets. Context defines the word. The context here is habitat preservation. A temporary pole is not a habitat disruptor."

  Alsop sighed, finally pulling out a chair and sitting. He poured himself water. "Context is slippery, Maria. Purpose is even slipperier. Who's purpose? The sponsor's? The floor manager's? The staffer who wrote the report? When you allow judges to look behind the text to find the 'spirit,' you invite judges to find their own policy preferences and dress them up as legislative intent. I might think this law is stupid. You might think it's vital. But my job isn't to optimize the statute. It's to apply it."

  "Is it absurd to ban a birdhouse?" Reyes asked sharply. "If a student builds a wooden nesting box on a post thirteen feet high near the wetland, is that a violation? Under your reading, yes. It's a structure. It exceeds twelve feet."

  Alsop didn't flinch. "The absurdity doctrine is a safety valve, not a sledgehammer. It applies only when the text produces a result that is impossible to comply with, or violates the Constitution. Inconvenience is not absurdity. Unwise policy is not absurdity. If the law bans birdhouses, then Congress can pass an amendment. That is the democratic process. If I carve out an exception for 'nice' structures, I insulate Congress from the consequences of their sloppy drafting."

  "So we let the university lose their data, delay their research, and spend money tearing down a pole that harms no one, just to send a message to Congress?" Reyes shook her head. "That's not fidelity to the law. That's fidelity to a theory of judging. The law is a tool for human governance. When the tool breaks the thing it's meant to fix, you put it down."

  "The tool is the text," Alsop corrected. "The text is the only thing we all agreed on. Ten years from now, when a different panel sits here, they can read the statute and know what it says. If they have to read my mind, or your mind, or a committee chairman's speech from 1998 to know what it means, the law is dead. It becomes whatever the judge had for breakfast."

  Reyes softened her tone. She knew she wouldn't win on the textual ground. She needed to find the crack in his armor. "Elias, look at the telescoping mechanism. The brief states the pole is retracted to ten feet during high winds and at night. For twelve hours a day, it is not in violation. Is it a 'structure exceeding twelve feet' if it only exceeds twelve feet intermittently?"

  Alsop paused. He tapped a finger on the table. "That is a question of fact regarding the definition of 'height.' The statute says 'exceeding twelve feet in height.' It does not say 'at all times.' A building that is fourteen feet tall is fourteen feet tall, even if the lights are off."

  "But a telescoping pole isn't a building. It's a variable," Reyes pressed. "If I park an RV that is thirteen feet tall on the property, is it a structure? If I drive it away, is it still a structure? The university argues the pole is equipment, not a structure. Equipment is movable. Structures are fixed."

  "Now you're arguing facts," Alsop said, a faint smile touching his lips. "And you're winning on the semantics of 'structure,' perhaps. But you started by arguing 'temporary.' Now you're arguing 'movable.' Which is it?"

  "Both," Reyes said. "They reinforce each other. The ordinary understanding of 'structure' in the context of land use implies something affixed to the ground with a degree of permanence. A tent peg isn't a foundation. A telescoping pole anchored by weights isn't a building. I don't need to ignore the text to find for the university. I just need to read the word 'structure' as a human being would, not as a scanner would."

  Alsop leaned back, interlacing his fingers. "I will concede this: 'Structure' is not defined. It is ambiguous enough that a dictionary won't save us. We have to choose a canon of construction. You choose the one that looks at purpose. I choose the one that looks at notice. A developer reading this statute needs to know where the line is. 'Permanent' is a line. 'Scientific utility' is not. 'Movable' is a line, but a shaky one. Is a gazebo movable? Technically, yes. Is it a structure? Yes."

  "So we agree it's ambiguous," Reyes said.

  "I agree it's undefined," Alsop corrected. "Ambiguity implies two equally valid textual readings. I see only one. 'Structure' encompasses poles. The ambiguity is in your desire to limit it."

  Reyes exhaled, leaning back. The stalemate was familiar. They had danced this dance in *Holloway*, in *Vance*, in a dozen other cases. "We're going to write separately, aren't we?"

  "I think we have to," Alsop said. "If I join your opinion, I validate the use of legislative history to override plain text. If you join mine, you validate a result you believe harms the very interests the Act protects."

  "It's not just about this pole," Reyes said, looking down at the brief. "It's about what happens when the next administration uses this precedent. If you rule for the text, a hostile agency could use this to shut down any temporary shelter, any aid station, any emergency response tent within two hundred yards of a wetland. They could weaponize your literalism."

  "And if I rule for the purpose," Alsop countered, "a hostile court could define the 'purpose' of a tax code as 'revenue generation' and ignore exemptions. Or define the 'purpose' of a criminal statute as 'public safety' and ignore procedural protections. Purpose is a blank check, Maria. Text is a receipt. I prefer the receipt."

  Reyes nodded slowly. She picked up her glass of water. "We both want the law to work. You think it works by being stable. I think it works by being just."

  "I think stability *is* a form of justice," Alsop said quietly. "The university knew the law. They could have applied for a waiver. They could have built a ten-foot pole. They gambled that no one would notice, or that a court would save them from their own sloppiness. I am not in the business of saving sophisticated actors from statutory compliance."

  "And I am not in the business of enforcing compliance that serves no master," Reyes replied. "The birds aren't safer if this pole comes down. The marsh isn't healed. We are just performing a ritual of obedience to words that have lost their connection to the world."

  Alsop stood up again. He walked back to the window. The sun was beginning to dip, casting long shadows across the bookshelves filled with reporters. "Perhaps that is the irreducible difference. You see the law as a means to an end. I see the law as the end itself. The process is the point."

  "That's a lonely way to sit on the bench, Elias."

  "It's a humble one," he said, his reflection ghostly in the glass. "It admits that I don't know what's best for the marsh. Congress does. Or, Congress represents the people who decide what's best. If they made a mistake, they fix it. If I fix it, I become the legislature."

  Reyes gathered her papers. She didn't look defeated, only resolved. "And if I fix it, I become the judge. The one who interprets, not just decodes."

  She stood and walked to the door. She paused with her hand on the knob. "I'll circulate my draft tomorrow. I'll keep it narrow. Focused on the definition of 'structure' as requiring permanence. I won't cite the committee report in the holding. Just the concurrence."

  Alsop turned from the window. "And I will cite the text. I won't mention the policy consequences. Just the plain meaning."

  "Then the third judge will decide the fate of the wind pole," Reyes said.

  "Let's hope they read better than we write," Alsop replied.

  Reyes opened the door. The sounds of the courthouse rushed in momentarily before she stepped out. "Good night, Elias."

  "Good night, Maria."

  The door clicked shut. Alsop stood alone in the quiet room, looking at the statute on the table. He knew Reyes was right about the birds. He knew she was right that the pole did no harm. But he also knew that once a judge starts deciding which laws are harmful enough to ignore, the law ceases to be a rule and becomes a suggestion.

  He picked up his pen, uncapped it, and began to write. *The text is clear. The outcome is for Congress to alter.* He wrote the words firmly, but for a moment, he hesitated, the ink pooling slightly at the tip of the nib, before he dragged it across the page to seal the disagreement.
