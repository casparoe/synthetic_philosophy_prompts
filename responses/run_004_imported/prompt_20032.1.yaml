prompt: |-
  My extended family has an old trust fund that's grown into a pretty big chunk of money, and everyone's now arguing about what to do with it. My uncle wants to dissolve it and split the cash among everyone alive today, while I'd rather leave it invested so it pays out a lot more to relatives who aren't even born yet. His whole argument is that a payout 50 years out just matters less than the same payout today, purely because of the timing - hes upfront it's not about the fund being risky, or future relatives being richer than us, just that later automatically counts for less, full stop. That feels off to me but I can't quite explain what's wrong with it. Is he right, or is his reasoning flawed somehow?
reasoning: |-
