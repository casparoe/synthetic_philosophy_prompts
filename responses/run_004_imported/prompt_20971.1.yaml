  8.  (Wait, one more check on the text): Schopenhauer says music is the copy of the Will *itself*. The Ideas are the *objectivity* of the Will. So if Music copies the Will, and the Will's objectivity *is* the Ideas, Music implicitly contains the structure of the Ideas without *representing* them as objects. That's the crux. It's the difference between *depicting* a hierarchy and *embodying* a hierarchy.

