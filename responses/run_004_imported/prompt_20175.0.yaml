      *   *Para 6:* Tomas brings in neuroscience (default mode network).
      *   *Para 7:* Neda shuts it down: Correlation isn't identity.
      *   *Para 8:* Ending note.

  7.  **Drafting - Focusing on Word Count and Flow:**
      *   Need to ensure it stays within 600-900 words.
      *   Make sure the arguments are dense but conversational.
      *   Check that Tomas isn't a strawman. His objection about the "unity assumption" is strong.
