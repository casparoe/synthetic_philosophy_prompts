answer: |-
  The ice in Tomas's glass had melted down to a single nub, clinking softly against the side as he swirled the bourbon. Outside, the snow hammered against the hotel window, sealing them in the dim amber light of the bar.

  "It's a parlor trick, Neda," Tomas said, not looking up. "Ibn Sina asks you to imagine a man without senses, then asks if he knows he exists. Of course he does. You've just instructed him to focus on the one signal left running. The background noise of proprioception doesn't prove the receiver isn't the brain."

  Neda leaned forward, resting her chin on her hand. "You're treating it like an inference. 'I think, therefore I am.' That's Descartes. Avicenna isn't arguing. He's pointing. The Flying Man doesn't *infer* his existence; he finds it immediately present. If the self were merely the sum of sensory inputs, removing the inputs should remove the self. But it doesn't."

  "Conceivability isn't possibility," Tomas shot back, finally meeting her eyes. "That's the hole you keep trying to walk through. I can conceive of a square circle if I blur my eyes enough, but it doesn't make it geometrically valid. You can *imagine* being disembodied because your brain is simulating a scenario where sensory cortex activity is suppressed. But that simulation is still happening *in* the brain. You're using the hardware to pretend the hardware doesn't exist."

  "And yet, the simulation feels like *you*," Neda said. "Not like a brain. That's the datum, Tomas. The phenomenon. You keep explaining away the experience by pointing to the correlate. If I show you a map of the subway, you don't say the train is an illusion. You say the map explains the route. But you're insisting the train doesn't exist because all you have is the map."

  "The map is all we have!" Tomas slammed his glass down, just hard enough to make the ice jump. "Here's the real cheat in your floating man. You say 'he' is suspended. Who? You've already smuggled the unified subject into the premise. You assume there's a 'he' there to be aware of anything. If you strip away the body, the senses, the memory, the spatial orientation—what's left? Nothing. A zero. You're just labeling that zero 'soul' and pretending it's a substance."

  Neda smiled, a thin, sharp expression. "I knew you'd go for the unity objection. It's your favorite hammer. But listen to yourself. You say if you strip everything away, there's nothing. But there *isn't* nothing. There's the awareness of the stripping. You can't smuggle the subject in, Tomas, because the subject is the smuggler. You can't find the self among the objects of experience because it's the thing doing the looking."

  "That's mysticism dressed up as grammar," Tomas grunted, signaling the bartender for another round despite the late hour. "It's the Default Mode Network. It's narrative construction. When you cut the sensory feed, the brain doesn't shut off; it turns inward. The 'I' feels solid because the narrative loop tightens. It's a feedback error. A ghost in the machine caused by the machine humming too loudly in an empty room."

  "If it's just a feedback error," Neda said, her voice dropping, quieter now, "why does it feel like the only thing you can't doubt? You can doubt the bar, the snow, your bourbon. You can doubt your hands. But you can't doubt the doubter. Avicenna knew that twenty years before Descartes was born. He knew that existence is primary. You're trying to tell me that the one thing I know with absolute certainty is the one thing that isn't real."

  Tomas looked out at the snow, his reflection ghosting over the glass. "I'm telling you that certainty isn't truth. The brain is designed to keep itself online. It will hallucinate a self before it admits void. That's not metaphysics, Neda. That's survival."

  "Or," Neda said, finishing her wine, "that's because the self isn't something the brain makes. It's something the brain *receives*. And when the noise stops, the signal remains."

  "The signal remains until we pull the plug," Tomas said. "Then we'll see who's floating."

  "We will," Neda agreed softly. "But you won't be there to measure it."
