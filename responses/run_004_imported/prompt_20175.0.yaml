          *   **Tomas:** Neuroscientist, reductionist, old grad school rival. Stubborn, not a pushover.
      *   **Topic:** Avicenna's "Flying Man" thought experiment (self-awareness without sensory input).
      *   **Arguments:**
          *   **Neda:** The self exists independently of the body/brain (substance dualism-ish, or at least immateriality of the soul).
          *   **Tomas:** Conceivability $\neq$ Possibility. The thought experiment begs the question (assumes a unified self already exists).
      *   **Tone:** Veteran rivals, know each other's soft spots, real blows, not introductory textbook dialogue.
      *   **Length:** 600-900 words.

  2.  **Deconstruct the Arguments:**
      *   **Avicenna's Flying Man:** A man created adult, suspended in air, no sensory input (blind, numb, etc.). Would he affirm his own existence? Yes. Would he affirm his body? No. Therefore, the self is not the body.
      *   **Tomas's Counter (Reductionist/Neuro):**
          *   *Conceivability vs. Possibility:* Just because you can imagine being disembodied doesn't mean it's metaphysically possible (Kripke/Descartes objection).
          *   *Question Begging:* The experiment assumes there's a "he" to begin with. If you strip away all sensory integration, is there anyone left? The sense of self is a construct of neural processes (narrative self), not a pre-existing substance.
      *   **Neda's Counter (Avicennan/Phenomenological):**
          *   *Immediate Presence:* It's not an inference; it's immediate awareness. You don't *infer* you exist; you *feel* it.
          *   *The Hard Problem:* Neuroscience explains correlation, not the subjective "what it is like." The flying man highlights the primacy of first-person ontology.
          *   *Specific Rebuttal to Tomas:* If the self is just a neural construct, why does the *absence* of neural input (in the thought experiment) leave the *presence* of self intact?

  3.  **Drafting - Scene Setting:**
      *   Snowed in, hotel bar, late night, drinks. Atmosphere should be intimate but tense.
      *   Dialogue needs to snap. No long lectures. Interruptions, finished sentences, shared history references.

  4.  **Drafting - The Exchange:**
      *   *Opening:* Start mid-thought or just as the topic arises. Let's have Tomas dismissive, Neda probing.
      *   *Tomas's Move:* Hit the "conceivability" angle. It's a party trick.
      *   *Neda's Move:* It's not about imagination; it's about attention.
      *   *Tomas's Move:* The "unity" objection. You're smuggling in the subject.
      *   *Neda's Move:* The primacy of existence. You can't smuggle in what is already fundamental.
      *   *Closing:* A stalemate but with emotional weight. They know each other too well.

  5.  **Refining the Voice:**
      *   **Tomas:** Cynical, grounded, uses scientific metaphors (noise, signal, wiring), impatient with "metaphysics."
      *   **Neda:** Precise, historically grounded but phenomenologically sharp, cuts through his materialism without being mystical.
      *   **Avoid:** "As you know, Avicenna said..." exposition. Instead: "Ibn Sina knew..." or "The Floating Man isn't about..."

  6.  **Writing - Section by Section (Mental Outline):**
