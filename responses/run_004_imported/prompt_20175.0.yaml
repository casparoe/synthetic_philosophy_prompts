      *   *Check:* Did I include the "smuggling the self in" point? Yes, Tomas needs to argue the experiment assumes a subject.
      *   *Check:* Is Neda sharp? She needs to point out that Tomas's explanation leaves out the *experience* of existing.
      *   *Tone Check:* Ensure they sound like old rivals. Use nicknames or references to past debates? Maybe just the rhythm of speech.

