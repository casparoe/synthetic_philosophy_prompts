answer: |-
  **The Vicious Glue: Bradley's Regress and the Price of Unity**

  The problem of unity is the hard problem of realist metaphysics. If the world is composed of particulars and universals, or objects and properties, what binds them into the coherent states of affairs we take to be reality? When we say that the cat is on the mat, we posit a cat, a mat, and a relation of *onness*. But a mere list—<cat, mat, onness>—does not constitute the fact that the cat is on the mat. The constituents must be tied together. F.H. Bradley's famous regress argument, articulated in *Appearance and Reality*, targets precisely this tie. He argues that any attempt to explain the unity of a fact by positing a relation as a constituent inevitably generates an infinite regress that destroys the possibility of that unity altogether.

  For the contemporary metaphysician, the question is not merely historical. It is a question about the limits of analysis. Is the regress genuinely vicious, demanding a radical restructuring of ontology (perhaps toward Bradley's monism), or is it a benign artifact of over-analysis that can be stopped by distinguishing categories? In this essay, I argue that Bradley's regress is indeed vicious because it represents an explanatory failure rather than a mere infinite series. However, the appropriate response is not Bradley's monistic dissolution of relations, but a candid primitivism regarding the unity of states of affairs, akin to Armstrong's ontology. Furthermore, while the metaphysical problem of factual unity is structurally isomorphic to the semantic problem of propositional unity, they are distinct puzzles; conflating them invites idealism, while distinguishing them allows the realist to pay the ontological cost without surrendering the world to the Absolute.

  To understand the force of Bradley's argument, one must first distinguish between benign and vicious infinite regresses. A benign regress occurs when the generation of further items in a series does not undermine the initial premise. If every event has a cause, and the universe is eternal, we have an infinite chain of causes, but any specific causal transaction remains intact. The regress is vicious, however, when the existence or intelligibility of the first item in the series depends on the completion of the series, yet the series cannot be completed.

  Bradley's regress is vicious because it defers the work of "relating" indefinitely. Suppose we have terms $A$ and $B$ and a relation $R$. For $R$ to relate $A$ and $B$, $R$ must be connected to $A$ and to $B$. If $R$ is treated as a term (a constituent of the fact), it requires a further relation, $R'$, to connect $R$ to $A$. But $R'$ is itself a term, requiring $R''$ to connect it to $R$, and so on. The viciousness lies in the fact that the condition for $R$ relating $A$ and $B$ is that $R$ is already related to $A$ and $B$. We are trying to explain unity by invoking a relation, but the relation itself requires unity to function. The explanatory demand is never met; the "glue" is always waiting for further glue to stick it to the objects. Consequently, the fact never coalesces. It remains a scattered plurality. If the regress is not blocked, there are no facts, only isolated terms that never actually enter into combination.

  Philosophers have attempted to block this regress by denying that relations always function as terms. The most famous early attempt is Bertrand Russell's distinction between a relation occurring "as a term" and a relation occurring "as actually relating." In *The Principles of Mathematics*, Russell suggests that when we analyze a proposition like "A differs from B," the concept of difference can be considered in isolation (as a term) or it can be actively doing work in the proposition (as a verb). When it is actually relating, it does not sit between A and B as a third object; it is the mode of combination itself. On this view, the regress never starts because we never posit a second relation to tie the first relation to the terms; the first relation, in its "verbal" mode, is self-tieing.

  While influential, Russell's distinction is more of a label for the solution than a mechanism of it. It asserts that relations have a dual nature: they can be objects of thought, but in reality, they are acts of combining. The difficulty is explaining how the very same entity, $R$, can possess these two mutually exclusive modes of being without further explanation. If $R$ is capable of "actually relating," what grounds this capacity? If it is intrinsic to $R$, then $R$ is not a pure universal but something inherently dynamic. If it depends on the context, we are back to needing a relation to place $R$ in that context. Russell's move effectively stops the regress by fiat: he declares that at the level of the atomic fact, the relation just *does* its work. This is plausible, but it risks being a "magic" solution. It identifies the stopping point but does not justify why the regress is blocked there other than by asserting a categorical distinction that itself resists analysis.

  A more robust, if ontologically costly, approach is found in the work of D.M. Armstrong. Armstrong accepts that states of affairs (facts) are the fundamental units of reality. For Armstrong, a particular $a$ and a universal $F$ do not exist independently and then get glued together; they are abstractions from the state of affairs $Fa$. The unity of the state of affairs is primitive. Armstrong explicitly acknowledges Bradley's challenge and meets it with a form of primitivism: the "nexus" of instantiation is not a further constituent. To ask what ties the particular to the universal is to ask a category mistake. The tie is not an item *in* the world; it is the way the world is.

  Armstrong's solution succeeds where Russell's falters because it locates the primitivity in the ontology rather than in the logical grammar. Russell tries to solve it by saying relations act differently in propositions; Armstrong solves it by saying facts are prior to their constituents. This blocks the regress because there is no stage at which $a$ and $F$ exist separately requiring a tie. They are ontologically dependent on the fact. However, this success comes at a price. It requires accepting brute facts of unity. We cannot analyze *why* $a$ instantiates $F$; it just does. For a metaphysician seeking deep explanation, this feels like surrender. Yet, compared to the alternative, it is the lesser evil. The alternative is to admit that no unity is possible, which leads to Bradley's monism.

  This brings us to the verdict on Bradley's ultimate conclusion. Bradley argued that because relational facts are incoherent (due to the regress), reality must be a single, non-relational Absolute. This leap is unwarranted. Bradley assumes that if relational unity cannot be *analyzed* into simpler components without regress, it cannot be *real*. This conflates analytic reducibility with ontological reality. Armstrong's primitivism demonstrates a middle path: unity is real but unanalyzable. The regress shows the limits of combinatorial ontology, not the limits of reality itself. We should accept that the "togetherness" of things is a fundamental feature of the world, not a composite product. Therefore, the regress is vicious against *reductionist* accounts of facts, but it is not vicious against *primitivist* accounts. The cost of realism is brute unity; the cost of avoiding brute unity is the dissolution of the world into unrelated terms. The former is preferable.

  There remains the bonus question of whether this metaphysical puzzle is identical to the semantic puzzle of the unity of the proposition. Frege, and later Jeffrey King, have worried about how a sentence like "Socrates is mortal" expresses a claim rather than a mere list of meanings. This is the "propositional unity" problem. Structurally, it mirrors Bradley's regress: if the meaning of "Socrates" and the meaning of "mortal" are just items, what binds them into a truth-apt whole?

  While the structures are isomorphic, the problems are distinct. The metaphysical problem concerns the existence of complex entities in the world. The semantic problem concerns the representational capacity of language or thought. One could be a metaphysical primitivist (facts are brute unities) while being a semantic compositionalist (propositions are built from parts via syntax). Conversely, one could believe the world is a blooming buzzing confusion (no metaphysical facts) but that our language imposes unity via grammatical rules.

  Conflating the two leads to the idealist error of thinking that because our *propositions* require a subject-predicate structure to be intelligible, the *world* must conform to that structure, or vice versa. Kit Fine has suggested that we might need different ontological categories for different types of unity, but the crucial distinction is this: the semantic regress can often be blocked by appeal to use, syntax, or cognitive architecture (as King suggests, the unity is provided by the representational system). The metaphysical regress cannot be solved by syntax; it requires an ontological ground. If we solve the semantic problem by saying "the mind binds the concepts," we have not solved the metaphysical problem of what binds the objects.

  Therefore, the unity of the proposition is a separate puzzle, solvable perhaps by appeals to linguistic convention or cognitive function, whereas the unity of the fact requires an ontological commitment. Recognizing this separation protects the realist. We can admit that our *description* of facts involves a regress if we treat relations as terms, without conceding that the *facts themselves* dissolve.

  In conclusion, Bradley's regress remains a potent tool for clearing away naive combinatorialism. It is vicious because it reveals that relational unity cannot be constructed from non-relational parts. However, it does not force us into monism. The most defensible position is a moderated primitivism: states of affairs are fundamental, and their unity is a brute feature of reality. We must pay the toll of unanalyzable nexus to travel the road of realism. To refuse the toll is not to find a smoother path; it is to remain stuck at the gate, holding a map of terms that never connect to the territory. The regress teaches us not that the world is One, but that the world is not a Lego set; it is not built from the bottom up. It is given as a whole, and our metaphysics must begin there.
