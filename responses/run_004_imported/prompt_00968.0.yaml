  2.  **Deconstruct Priya's Argument:**
      *   *Premise 1 (The Math):* Fairness impossibility theorems are real. (Chouldechova 2017, Kleinberg, Mullainathan, Raghavan 2016). If base rates differ, you can't have calibration within groups *and* equal false positive/negative rates across groups simultaneously. **Verdict:** Accurate.
