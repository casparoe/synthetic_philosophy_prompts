      *   *Arius's Mutability:* Arius believed the Son was mutable by nature but chose good. Newton doesn't focus on this.
      *   *The "Heresy" Label:* The prompt asks about the "same heresy" framing. I need to address that "Arianism" is often a catch-all term.
      *   *Key Insight:* Newton's theology is driven by his view of *Prophecy* and *History*. Arius's is driven by *Salvation* and *Ontology*. For Arius, if the Son is God, salvation is compromised (only God saves). For Newton, if the Son is God, Monotheism is compromised (Idolatry).

  6.  **Final Review against Prompt:**
      *   Compare mature Newton vs. Arius? Yes.
      *   Grounds of subordination? Yes (Dominion vs. Essence).
      *   Created vs. Begotten? Yes.
      *   Metaphysics vs. Philology? Yes.
      *   Idiosyncratic position? Yes.
      *   Judgment on framing? Yes.

