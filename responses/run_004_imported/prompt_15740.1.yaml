          *   CDT: My choice doesn't *cause* the past prediction. Take both. (Stable).
          *   EDT: My choice is *evidence* of the prediction. One-boxing correlates with $1M. (Stable).
          *   Conflict: Static disagreement. Both theories give a definite answer, they just differ.
      *   *Death in Damascus:*
          *   Structure: Death predicts where you will be. You choose Damascus (D) or Aleppo (A). If you match Death, you die. If you mismatch, you live.
          *   CDT/EDT Convergence (initially): Both agree you want to mismatch.
