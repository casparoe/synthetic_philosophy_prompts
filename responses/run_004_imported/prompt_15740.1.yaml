              *   If I decide A -> Death predicts A -> I die. So I should choose D.
          *   Instability: The recommendation depends on the decision *being made*. It's a feedback loop.
      *   *Key Difference:* NP is about *correlation vs. causation* regarding a fixed past state. DiD is about *predictive stability* regarding the decision process itself. DiD exposes a problem with *deliberational equilibrium*.

  3.  **Address Question 1: The Nature of the Flip-Flopping (Instability):**
