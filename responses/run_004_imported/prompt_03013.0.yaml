answer: |-
  The cold was the first thing, sharp and chemical in her lungs. The second thing was the memory of heat.

  Elara sat up on the slab, the synthetic skin of her new thighs sticking to the polymer sheet. She remembered the crash. She remembered the fuselage screaming, the impact that folded the world like wet paper, and the fire that swallowed her whole. She remembered the end of being. There had been a period of absolute zero, not cold but void—a cessation of the verb *to be*.

  Then, here.

  "Vital signs stabilizing," a voice said. A technician stood behind the glass, clipboard in hand. He looked bored. This was routine. "Welcome back, Elara. It's been five years, three months."

  Five years. She looked at her hands. They were hers—the scar on the left thumb, the specific slope of the knuckles—but they were fresh. No sun spots. No tremor.

  "Did I die?" she asked. Her voice sounded recorded, perfectly pitched.

  "Biologically, yes. Catastrophic cellular failure. We reconstructed you from the Archive backup."

  The word *reconstructed* hung in the sterile air. Elara swung her legs off the slab. She felt heavy, wholly present in this room, in this instant. That was the problem. She felt entirely *here*. But if she was entirely here, and she had been entirely *there* in the plane before the fire, where was she during the fire?

  If she was a thing that existed all at once, a complete unit moving through time, then the gap should have broken her. A bridge with a missing span is not a bridge; it is two cliffs. If the *whole* Elara ceased to exist when the fire took her, then this thing waking up on the slab was a new thing wearing her memories. A copy. A ghost in a machine built of meat.

  She walked to the mirror on the far wall. The reflection stared back, eyes wide.

  *I am me,* she thought. The intuition was immediate. Endurantist, though she didn't know the word. She felt like a singular substance persisting through change. But how does a substance persist through non-existence?

  She turned away from the mirror and asked for her file. The technician slid a tablet through the airlock. She scrolled through the timeline. Birth. School. The crash. A flat line of data for five years. Then, *Re-initiation*.

  There was another file attached. *Case 8940: Ontological Status.*

  She opened it. It contained a diagram. It looked like a line drawn in ink. The line started at her birth and moved diagonally upward. At the moment of the crash, the line didn't stop. Instead, it split. One branch ended abruptly at the fire. The other branch dipped down into a dashed line—the gap—and re-emerged solid on the other side, continuing into the future.

  *Subject A (Short)*, the label read. *Subject B (Long).*

  "Which one am I?" she asked the glass.

  The technician shrugged. "Both, technically. Up until the crash, you were both. Subject A ended when the body died. Subject B includes this moment."

  Elara traced the diagram with her finger. This was the other way to see it. Not a dot moving, but a shape stretched out. A worm. If she was a worm, then her life wasn't a light bulb turning on and off; it was a solid object lying across the landscape of time. The fire hadn't destroyed the object; it had just destroyed a segment of it. The gap was merely empty space between two parts of the same whole.

  But that felt like a lie. She remembered the pain of the fire. She remembered the silence after. Subject A had felt that silence as an end. Subject A was dead. She could not be Subject A.

  Yet, she possessed Subject A's memories. She felt Subject A's love for her sister, her fear of heights, her regret over the unsent letter. If she was Subject B, a distinct worm that merely overlapped with A, then she was living a life that belonged to someone else up until the crash. She was a parasite on a dead woman's timeline.

  She closed her eyes. The endurantist view demanded purity. To be Elara, she had to be the *same* whole object that boarded the plane. If that object was destroyed, she was an impostor. The gap was a verdict of guilt.

  The perdurantist view offered continuity but demanded fragmentation. She was a collection of stages. Some stages burned. Some stages slept. Some stages woke. The "I" was just the name for the collection. The gap didn't matter any more than the space between her ears mattered. She was the sum of the parts, even if the sum had holes in it.

  "Does it matter?" the technician asked. He was watching her stare at the diagram. "You're here. You're functional."

  "If I'm a copy," Elara said, "then my sister didn't get me back. She got someone who thinks she's me."

  "And if you're a worm?"

  "Then the part of me that died is still dead. And I'm just... the rest of the sentence."

  She looked back at the mirror. She tried to feel the stretch. She tried to imagine herself not as a person standing in a room, but as a long, thin creature extending backward through the five years of darkness, anchoring itself in the burned wreckage of the plane, and stretching forward into this sterile room.

  If she was the worm, the gap was just a region where she had no matter. She existed there in the same way a tunnel exists through a mountain—as a potential path, defined by the rock on either side.

  But the pain in her chest was immediate, localized, wholly present. It felt like the grief of a survivor, not the continuity of a traveler.

  She picked up the stylus. On the tablet, over the diagram, she drew a circle around the segment labeled *Subject A*. Then she drew a circle around *Subject B*.

  For a moment, the two circles overlapped. The shared history. The birth, the childhood, the crash. In that overlapping region, both were true. She was the one who died, and she was the one who woke.

  Then she drew a line through Subject A.

  "I'm not the one who died," she whispered. The endurantist in her screamed that this was a denial of fact. She *had* died. But the perdurantist logic held: the thing that died was a temporal part, a slice. The whole persisted, or rather, a new whole included that slice and added more.

  She handed the tablet back.

  "Schedule the reunion with my sister," Elara said.

  "Are you sure?" the technician asked. "Some clients prefer to wait. The identity dissonance can be..."

  "I'm sure."

  She walked back to the mirror. She placed her hand against the glass. She was not the ghost of the woman in the plane. She was the extension. The gap was real, but it wasn't a break. It was just the dark space between the stars, and she was the light traveling across it, arriving late, but arriving.

  Or perhaps she was just the new light, pretending to be the old.

  Elara turned from the mirror. She would live long enough to find out. If she aged, if she changed, if she eventually died again without returning, then perhaps she was just a whole thing, enduring until the end. If she found herself stretching further than she thought possible, branching into futures she couldn't predict, then she was the worm.

  For now, she walked out of the room, wholly present in the hallway, leaving the diagram of the dead woman on the table behind her.
