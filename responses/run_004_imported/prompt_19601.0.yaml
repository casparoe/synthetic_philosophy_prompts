  *   **Secondary Issue:** Frankfurt's account relies on the *speaker's intent* or *stance* (indifference to truth). Applying this to a non-agent requires a brief acknowledgment that we are speaking metaphorically or functionally, which the student glosses over. The 4-point deduction reflects the citation error (3 points) and the lack of nuance regarding agency (1 point).

