answer: |-
  The check had been paid an hour ago. Now they sat in the dim corner of a nearly empty bar, the remnants of a bottle of whiskey between them. The dinner argument had followed them out of the restaurant, lingering in the silence like smoke.

  Alex swirled the ice in their glass. "You keep coming back to Samuelson," Alex said. "But you're treating the Kelly Criterion like it's just another utility function. It's not. It's a physical constraint."

  Jamie leaned back, arms crossed. "A physical constraint? It's a betting strategy. And Samuelson's point wasn't just pedantry. It was that you can't derive an *ought* from a limit. Just because log-wealth maximization wins in the infinite long run doesn't mean I'm irrational for caring about the finite short run."

  "But that's exactly the ergodicity problem," Alex said, leaning forward. "You're thinking in ensembles. You're imagining a thousand parallel universes where you make this bet once, and averaging the outcomes. That's the expected value. But you don't live in an ensemble. You live in one timeline. You experience the sequence. In a multiplicative process—like reinvesting winnings—the time-average growth rate is not the same as the ensemble-average expected value. If you bet too much, the time-average goes negative even if the expected value is positive. You go broke in *your* timeline, even though 'on average' everyone is rich."

  "I know the math, Alex," Jamie said, voice calm. "I know that if you bet 100% on a 60/40 coin, a single tails wipes you out. I'm not advocating ruin. I'm advocating that avoiding ruin is a preference, not a law of physics. If I have a concave utility function—say, square root of wealth—I naturally bet less than Kelly. If I have log utility, I bet exactly Kelly. If I'm risk-neutral, I bet everything until I hit a ceiling. Expected Utility Theory handles all of these. Why privilege log utility?"

  "Because log utility isn't just a preference," Alex countered. "It's the only utility function that is scale-invariant. It doesn't matter if we're betting dollars or pennies; the fraction stays the same. And it's not just about money. Look at probability aggregation. If you want to combine expert opinions without introducing arbitrage opportunities, you use logarithmic pooling. Look at Nash bargaining solutions. The product of utilities maximized? That's logarithmic. The log shows up everywhere there's a system of exchange or information. It suggests growth-rate maximization is the baseline for rationality in a multiplicative world."

  Jamie took a sip of whiskey. "That's a beautiful pattern, I'll grant you. But patterns aren't prescriptions. You're saying because log shows up in Nash bargaining, I *must* maximize geometric growth? What if I need this money for rent next month? The asymptotic dominance result says Kelly will outperform any other strategy with probability approaching one as $N$ goes to infinity. But $N$ is not infinity. $N$ is maybe fifty bets before I retire. In the pre-asymptotic region—the only region that actually exists for humans—Kelly can underperform for decades. The variance is huge. Why should I sacrifice my path in the finite world to satisfy a theorem about a world I'll never see?"

  "Because any other strategy is essentially donating money to the Kelly bettor in the long run," Alex said. "If you bet half-Kelly, you sacrifice growth for safety. If you bet double-Kelly, you invite ruin. The Kelly fraction is the peak of the mountain. Sure, you can camp on the slope if you're scared of the altitude, but don't pretend the slope is the peak. The 'peak' isn't subjective. It's the maximum sustainable growth rate."

  "The peak of *what*?" Jamie pressed. "Growth of bankroll. But bankroll isn't utility. Utility is what I can *consume*. If I maximize bankroll growth, I'm deferring consumption indefinitely. I'm compounding forever. But I'm mortal. I die. The money reverts to heirs who might have different risk profiles. By treating the bankroll as an end in itself, you're smuggling in an assumption of infinite horizon. Samuelson's one-syllable paper was mocking exactly this: the idea that because something is good in the limit, it's good now. It's the fallacy of the gambler who thinks, 'I'll eventually win it back,' only inverted. You think, 'I'll eventually be the richest,' so I should act like I already am."

  Alex paused, tapping the glass. "Okay. Finite horizon. I hear you. But doesn't the ergodicity argument still hold weight regarding the *structure* of the risk? If the process is non-ergodic, the ensemble average is a lie. It tells you nothing about your experience. If you accept that, then Expected Utility over ensemble averages is fundamentally broken for sequential decisions. You need a time-average objective. And for multiplicative dynamics, the time-average of the growth rate is the expectation of the log."

  "You're conflating the dynamics with the valuation," Jamie said. "Yes, the wealth dynamics are multiplicative. $W_{t+1} = W_t \cdot (1 + f \cdot X)$. That's physics. But how I *value* $W_t$ is psychology. Or economics. I can acknowledge the multiplicative dynamics and still say, 'I value the first million dollars ten times more than the second million.' That's diminishing marginal utility. It handles the 'ruin' problem without needing to declare log utility as the One True Way. If I'm terrified of drawdowns, my utility function curves down sharply. I don't need a 'geometric rationality' principle to tell me not to bet the farm. I just need to admit I'm risk-averse."

  "But then you're just restating the Kelly result in different clothes," Alex argued. "If you admit the dynamics are multiplicative, and you want to avoid ruin, you're pushed toward log. And look, even the critics use Fractional Kelly. Why? Because they know the edge is uncertain. But mathematically, Fractional Kelly is equivalent to Full Kelly with a specific utility function that accounts for parameter uncertainty. It all circles back to geometric growth being the anchor. You're just adding drag to the engine because you're scared of the speed."

  "I'm scared of the crash, not the speed," Jamie shot back. "And here's the real problem with your 'objective growth' stance. It assumes you know the odds. In our dinner example, 60/40. Fine. In the real world? I don't know the edge. If I overestimate my edge and bet Full Kelly, I'm effectively betting super-Kelly. That leads to ruin. So even if I accepted your ergodicity argument, I'd still bet less than Kelly to account for model error. So the 'rational' bet is never the theoretical Kelly bet. It's always a subjective adjustment based on my confidence. Which brings us right back to subjective Expected Utility."

  Alex nodded slowly. "I'll concede that parameter uncertainty forces fractional betting. But that's a practical constraint, not a theoretical refutation. Theoretically, if you *did* know the odds, and you care about your wealth trajectory over your lifetime, the log is the only function that separates the signal (growth rate) from the noise (volatility drag). You keep saying utility is subjective. I'm saying that for any agent that wants to persist in a competitive environment, geometric growth is the objective filter. If you don't maximize it, you get out-competed by something that does. Evolution selects for geometric growth, not arithmetic expectation."

  "Evolution also selects for 'don't get eaten by a lion today'," Jamie replied. "Survival isn't just about maximum growth rate; it's about variance control. And 'getting out-competed' is an ensemble argument again! You're comparing me to a parallel universe version of me who bet Kelly and got lucky. I don't care about the version of me who got rich in another timeline if the version of me in *this* timeline had to eat ramen for ten years during a drawdown. The 'almost sure' dominance relies on the law of large numbers. But the convergence can be arbitrarily slow. I could be dead before the dominance kicks in."

  "So what's the alternative?" Alex asked. "Just pick a utility function out of a hat? 'I feel like I'm twice as risk averse today'?"

  "No," Jamie said. "I pick a utility function based on my goals. If I'm saving for retirement, I map wealth to consumption needs. If I'm gambling for fun, I map wealth to entertainment value. Expected Utility Theory is a framework, not a specific answer. It demands I be consistent, not that I be a log-maximizer. Your ergodicity economics is a brilliant critique of how people *misuse* expected value. It shows why maximizing arithmetic mean is stupid in multiplicative games. But it doesn't prove that maximizing geometric mean is the *only* smart thing. It just proves it's the smart thing for an agent who cares exclusively about terminal wealth in the very long run. I don't."

  Alex sighed, leaning back. "So we're back to preferences. You think the log is just one flavor of risk aversion. I think it's the coordinate system of rationality."

  "I think it's the coordinate system of *survival*," Jamie corrected. "But I'm not just trying to survive. I'm trying to live. Sometimes that means taking less risk than survival demands, because I value peace of mind. Sometimes it means taking more, because I need a Hail Mary. The math of ergodicity tells me the cost of those choices. It tells me how much growth I'm sacrificing for safety. That's valuable. But it doesn't dictate the choice."

  Alex picked up the whiskey bottle, found it empty, and set it down. "It feels like you're admitting the growth rate is the objective metric, but you're willing to pay a premium to deviate from it."

  "And you're admitting that deviating from it is necessary in the real world," Jamie said, "because of uncertainty and finite horizons. You just call it 'fractional Kelly' to keep the branding clean."

  Alex smiled, a thin, tired smile. "Maybe. But I still think if you ran the simulation a thousand times, my version of you ends up richer."

  "Maybe," Jamie said, signaling for the check. "But my version of me sleeps better at night. And in my utility function, that's worth a lot."

  "See?" Alex stood up. "You *do* have a utility function. You're just hiding the log inside it."

  "And you," Jamie said, standing as well, "have a finite horizon. You just pretend you don't."

  They walked out into the cool night air, the argument unresolved, the distance between geometric rationality and subjective utility stretching out like the road ahead—parallel, converging only at a point neither would ever reach.
