answer: |-
  This is an exceptionally strong reading. You have avoided the two most common pitfalls in popular discussions of Aquinas on tyrannicide: the anachronistic projection of modern "rights of revolution" onto him, and the flattening of his corpus into a single, consistent soundbite.

  Your friend is operating on a half-truth (Aquinas *does* allow for the removal of tyrants), but you are correct that the *mechanism* and *conditions* are far more restrictive than "sanctioning killing a tyrant" implies.

  Here is an assessment of your textual representations and an analysis of your reconciling premise.

  ### 1. Textual Fairness

  Your summaries are accurate and reflect the consensus of serious Thomistic political scholarship (e.g., the work of J.P. Canning, Quentin Skinner, or Robert P. Kraynak).

  *   **Commentary on the Sentences (In II Sent., d. 44):** You represent this fairly. This is indeed the most "permissive" text. Aquinas distinguishes between the tyrant *ex defectu tituli* (usurper) and *ex parte exercitii* (abuser of legitimate title). He explicitly states that killing a usurper is meritorious (*laudabile*) and does not incur the guilt of sedition. You are right to note this is an early work; many scholars view this as Aquinas working through inherited canonist distinctions before refining his prudential cautions later.
  *   **De Regno (On Kingship):** Your summary of Book I, Chapter 6 is spot on. This is the crucial text for your friend to read. Aquinas explicitly argues against private tyrannicide, citing the historical precedent of the assassination of Julius Caesar (which led to worse tyranny) and the danger that ambitious men will use the pretext of tyranny to seize power. His preference for deposition by a "public authority" (which, in his feudal context, often meant a superior lord or the *optimates*, not necessarily a democratic electorate) is correctly identified.
  *   **Summa Theologiae (II-II, q. 42, a. 2):** You handle the nuance here well. Aquinas defines sedition as contrary to the unity of the multitude. Since a tyrant destroys that unity by pursuing private good over the common good, resisting him is not *technically* sedition. However, as you note, he adds the proportionality clause (the remedy must not be worse than the disease). One minor clarification: The *Summa* is somewhat more defensive than the *Sentences*. It argues that resisting a tyrant is *not a sin*, whereas the *Sentences* argues it is *praiseworthy*. This is a subtle shift from positive endorsement to negative permission.

  **Verdict:** You have represented the texts fairly. You have not smoothed over the differences between them, which is to your credit.

  ### 2. Does the "Authority Held in Trust" Premise Reconcile the Texts?

  Your thesis is that **political authority is held in trust from the community, so only a public/communal act can rightly withdraw it.** You argue this reconciles the texts because a usurper never received the trust, while a legitimate tyrant holds it and thus requires a public revocation.

  This is a robust theoretical framework, but I would argue it **partially** reconciles the texts while **relocating** the tension rather than eliminating it. Here is why:

  #### Where the Premise Works
  It successfully explains the distinction between the two types of tyrants.
  *   **The Usurper:** Since authority originates (mediately) from the community/God for the common good, a usurper has no "trust" to violate. He is essentially a foreign aggressor or a criminal. Therefore, the barrier to removal is lower (*Sentences*).
  *   **The Legitimate Tyrant:** He holds the office in trust. Even if he violates the *ends* of the trust (the common good), he still holds the *office*. Therefore, the revocation of that trust must match the conferral of it. If the community (or its representatives) conferred it, they must revoke it (*De Regno*).

  This aligns perfectly with Aquinas's teleological view: Authority is not property; it is a function. When the function fails, the authority dissolves, but the *process* of declaring that dissolution matters.

  #### Where the Tension Remains (The Agency Problem)
  The tension between *Sentences* and *De Regno* is not just about *whether* authority is a trust, but **who acts as the agent of the community.**

  *   **In the *Sentences*:** Aquinas seems to allow that *anyone* (including a private individual) can kill a usurper. The logic is that since the usurper has no authority, he is no different from a bandit.
  *   **In *De Regno*:** Aquinas becomes deeply suspicious of private agency, even regarding tyrants. He insists on a "public authority" to depose the ruler.

  Your "trust" premise explains *why* the community has the right to remove the tyrant, but it does not fully explain the shift in *who* can execute that right.
  *   **Did Aquinas change his mind?** Many scholars think so. The *Sentences* reflects a more abstract, juridical logic. *De Regno* reflects a more prudential, historical realism.
  *   **Does "Trust" cover this?** If you argue that "Trust implies Public Agency," you have to explain why the *Sentences* allowed private agency against a usurper.
      *   *Reconciliation:* You could argue that in the case of a usurper, the "public body" is irrelevant because no public body ever authorized him. He is *hostis humani generis*. In the case of a legitimate tyrant, the public body *did* authorize him, so they must revoke it.
      *   *The Relocated Tension:* The tension then moves to **definition**. Who constitutes the "public body"? In *De Regno*, Aquinas hints this might be a superior lord (feudal hierarchy) rather than "the people." If your friend interprets "community" as "the citizenry," they will still find *De Regno* restrictive. If you interpret "community" as "the constitutional order" (which might include a higher emperor or the Church), the texts align better.

  ### 3. A Suggested Refinement

  To make your reconciliation bulletproof, I would suggest tweaking the premise slightly to account for the **prudential shift**.

  Instead of just "Authority is held in trust," consider: **"Authority is a functional trust for the Common Good, the defense of which is primarily a public duty, except where authority is wholly absent."**

  This captures the nuance:
  1.  **Functional Trust:** Explains why tyranny voids the claim to obedience (*Summa*).
  2.  **Public Duty:** Explains the caution in *De Regno* (private individuals shouldn't assume the role of judge/executioner unless necessary).
  3.  **Wholly Absent:** Explains the *Sentences* exception for usurpers (no authority exists to violate, so private defense is permissible).

  ### Conclusion on Your Argument

  You are right to tell your friend that Aquinas "sanctioning killing a tyrant" is a dangerous oversimplification. Aquinas sanctions the **removal** of a tyrant, but he creates a high barrier for **who** may do the removing and **when**.

  Your "authority held in trust" premise does the heavy lifting you want it to do, provided you acknowledge that Aquinas's definition of the "trustee" (the public body) is hierarchical and institutional, not democratic. The tension between *Sentences* and *De Regno* is real, but it is best read as a maturation of prudential judgment rather than a contradiction of first principles.

  **Final Verdict:** Your reading is textually sound and theoretically coherent. You win the argument, provided you concede that Aquinas is less interested in "licensing revolution" than he is in "preventing anarchy."
