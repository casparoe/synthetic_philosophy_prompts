  3.  **Determine "Who is Right":**
      *   *Objectively:* Neither is "right" because the rule is ambiguous regarding this specific scenario. It's a gap in the contract.
      *   *Pragmatically:* The User has a stronger point regarding the *spirit* of the rule, but the Roommate has a point regarding the *literal* wording.
      *   *Fairness:* Demanding a week of dishes for one night (especially due to work travel) seems unfair and escalatory. The original rule was "dishes that night," not "dishes for a week."

  4.  **Identify the Underlying Issues:**
