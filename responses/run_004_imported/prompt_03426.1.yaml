answer: |-
  This is a classic "contract law" dilemma in a domestic setting. You have a verbal agreement that worked perfectly for its intended scope, but now you've encountered an **edge case** that the original agreement didn't cover.

  Here is the breakdown of who is "right," why this is actually about more than dishes, and how to fix it without ruining the roommate dynamic.

  ### 1. Who is actually right?
  **Objectively: Neither of you.**
  The rule is ambiguous regarding travel. When you created the rule, the "contextual intent" was clearly about daily logistics (who is more tired, who disrupted the evening routine, etc.). It was not designed to account for multi-day work trips.

  However, **your roommate is making a logical leap.**
  Even if we accept her literal interpretation that you "got home last," the original penalty was **"dishes that night."**
  *   **The Discrepancy:** She is demanding **a week** of dishes. That is a *new* penalty being applied retroactively.
  *   **The Fairness:** If the rule is "dishes that night," and you weren't there that night, the rule functionally couldn't apply. If she did the dishes on the night you were away, the fairest interpretation is that you owe her *that specific night*, not a week.

  ### 2. Why is she digging in?
  If you've had zero drama for three years, this sudden rigidity suggests one of two things:
  *   **Principle:** She feels like you're trying to loophole your way out of a commitment, and she wants to uphold the integrity of the system.
  *   **Resentment:** She might be annoyed that she had to handle the house alone while you were gone, or she did the dishes on the night you were away and feels uncompensated. The "week of dishes" might be her way of balancing the scales for the inconvenience of your absence, disguised as enforcing the rule.

  ### 3. How to resolve it
  You cannot win this by arguing about the definition of "getting home last." You will only win by addressing the fairness and the future.

  **Step 1: Acknowledge the ambiguity.**
  Don't say, "You're wrong." Say, "You know, I've been thinking about it, and you're right that we never actually wrote down what happens during travel. So technically, the rule is undefined here."
  *   *Why:* This disarms her. You aren't fighting the rule; you're acknowledging the gap.

  **Step 2: Address the penalty.**
  Gently point out the escalation. "The original rule was 'dishes that night.' Even if I accept that I got home last, asking for a week of dishes is a new penalty we never agreed to. That feels a bit steep for a work trip."
  *   *Why:* This brings the focus back to the original agreement.

  **Step 3: Offer a compromise (The "One Night" Fix).**
  If she did the dishes on the night you were gone, offer to do the dishes for *one night* (or two) as a courtesy, not as an admission of guilt.
  *   *Script:* "I don't think the rule was meant for work trips, but I know you held down the fort while I was gone. I'm happy to take the dishes for the next two nights to even it out, but I don't think a whole week is fair given the context."

  **Step 4: Update the "Contract."**
  This is the most important part. You need to close the loophole so this doesn't happen again.
  *   *Script:* "Let's actually write this down so we don't fight about it in another three years. How about: 'The rule applies to normal days. If one person is out of town for work or travel, the dishes are split or paused until they return'?"

  ### The Verdict
  **You are right about the spirit of the rule;** work travel is generally considered an "excused absence" in roommate dynamics.
  **She is right that the rule is technically undefined.**

  **However, she is wrong about the penalty.** Demanding a week of dishes for a scenario that was never discussed is unfair.

  **Recommendation:** Do not do a week of dishes. It sets a bad precedent that rules can be changed retroactively. Offer to do the dishes for *one or two nights* as a "goodwill gesture" for holding down the fort, and then immediately sit down to clarify the rule for future travel. This preserves your 3-year streak of zero drama by prioritizing the relationship over being technically "right."
