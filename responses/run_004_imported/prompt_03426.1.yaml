      *   **User's Argument (Intentionalist/Spirit of the Law):** The rule was designed for daily logistics (who's more tired/who disrupted the evening flow). It wasn't designed for business trips. Being away for work isn't the same as being out for drinks. A week of dishes is a disproportionate penalty for one night.
