prompt: |-
  I have spent a long time reading the rationalist and effective-altruism blogospheres, and one move I keep encountering in threads about personal identity is an appeal to Buddhism on behalf of what is usually called "open individualism" -- Daniel Kolak's term for the view that there is really only a single subject underlying every experience anyone has ever had, so that the sense of being a separate person is a kind of perspectival illusion. The argument I keep running into goes roughly: Buddhism teaches that there is no enduring self (anatta); the boundary you draw around "your" experiences versus "someone else's" therefore isn't doing any metaphysical work; so at bottom there is just one experiencer wearing different masks. This is usually set against "empty individualism," the rival reductionist position (closer to what I associate with Parfit, or with Buddhist accounts of momentariness) on which there is not even a persisting subject within a single life -- only a series of discrete, causally linked experiences, none of which is more "you" than any other. (Kolak's third category, "closed individualism," is just the common-sense view and doesn't seem to be what anyone in these threads is actually fighting about.) A friend of mine who has read far more Kolak than I have insists that open individualism is basically what the Buddha was getting at all along, and that Buddhologists who deny this just haven't caught up with him.

  I am not convinced the canonical material actually licenses that move, and I would like you to make the case in some detail rather than just asserting it. Specifically, please argue that anatta -- as developed through the analysis of the person into the five skandhas, the doctrine of dependent origination, and the notion of the santāna (the causally linked but non-identical mental stream that is what actually "continues" from moment to moment, and, on the traditional account, from life to life, without any self doing the continuing) -- supports empty individualism far better than it supports open individualism. I would like the argument to also establish that reading anatta as evidence for a single universal subject quietly reintroduces something like the Upanishadic identification of ātman with brahman, exactly the kind of view the doctrine was originally formulated to rule out.

  I would also like you to take on the strongest objection available to someone defending the open-individualist reading: Mahayana notions like buddha-nature (tathāgatagarbha) and the Dharmakāya, and non-dual traditions such as Dzogchen or Zen, all of which can sound like they are describing one pervasive awareness underlying all beings. Please explain concretely why these traditions do not actually rescue the open-individualist interpretation, rather than simply noting that they exist and moving on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is familiar with the rationalist/EA blogosphere and the debate between Open Individualism (OI) and Empty Individualism (EI) regarding personal identity.
      *   **The Claim:** A friend argues that Buddhism supports Open Individualism (one universal subject) based on *anatta* (no-self).
      *   **The Task:** Argue *against* the friend and *for* the view that Buddhist doctrine (specifically *anatta*, *skandhas*, *dependent origination*, *santāna*) supports Empty Individualism (no persisting subject, even within a life) rather than Open Individualism.
      *   **Specific Requirement 1:** Show that OI quietly reintroduces *ātman/brahman* (Upanishadic monism), which Buddhism was formulated to reject.
      *   **Specific Requirement 2:** Address the strongest objection: Mahayana concepts like *tathāgatagarbha* (buddha-nature), *Dharmakāya*, and non-dual traditions (Dzogchen/Zen) which *sound* like OI. Explain concretely why they don't support OI.
      *   **Tone/Style:** Detailed, argumentative, philosophically rigorous, respectful of the source material.

  2.  **Deconstruct the Core Philosophical Conflict:**
      *   **Open Individualism (OI):** One subject, many experiences. "I am everyone."
      *   **Empty Individualism (EI):** No subject, just experiences (or causal streams). "There is no I."
      *   **Buddhist *Anatta*:** No permanent, unchanging self.
      *   **The Friend's Error:** Equating "no boundary between selves" (OI) with "no self to have boundaries" (EI).
      *   **The Upanishadic Trap:** If there is one universal experiencer, that is *Ātman* (universal self) = *Brahman* (universal reality). This is *ātman-vāda*, which Buddhism explicitly denies.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the prevalence of the OI argument in rationalist circles. State the thesis clearly: Buddhist *anatta* entails Empty Individualism, not Open Individualism. OI is a subtle form of eternalism (*śāśvatavāda*).

      *   **Part 1: The Early Buddhist Case (Nikāyas/Āgamas):**
          *   *The Five Aggregates (Skandhas):* Analyze form, feeling, perception, formations, consciousness. The argument is not "these belong to everyone," but "none of these are fit to be regarded as 'mine' or 'I'."
          *   *Dependent Origination (Pratītyasamutpāda):* Experience arises conditionally. No "experiencer" behind the experience. If there were one universal subject, conditions wouldn't need to be specific to specific streams.
          *   *The *Santāna* (Continuum):* This is the crucial technical term. It explains continuity *without* identity. It's like a flame passing from candle to candle. OI says it's the *same* flame on all candles. EI (and Buddhism) says it's a causal sequence of distinct flame-moments.
          *   *Karma and Ethics:* If OI were true, karma would be incoherent. Why does *my* action ripen for *me* if there is no "me"? If there is only One Experiencer, karma dissolves into a single pool. Buddhism insists on the specificity of karmic causation within distinct *santānas*.

      *   **Part 2: The Upanishadic Trap (Ātman vs. Anatta):**
          *   Define the Upanishadic view: *Tat Tvam Asi* (Thou Art That). The individual soul is the Universal Soul.
          *   Show how OI maps onto this: "I am everyone" = "Individual Self = Universal Self."
          *   Explain why Buddhism rejects this: It reifies consciousness (*viññāṇa*) into a self (*attā*). The *Brahmajāla Sutta* explicitly critiques views of an infinite/universal self.
          *   Key distinction: Buddhism denies the *locus* of experience, not just the *boundaries* of experience. OI keeps the locus (the One Subject); Buddhism eliminates it.

      *   **Part 3: Addressing the Mahayana/Non-Dual Objection:**
          *   *The Objection:* What about *Tathāgatagarbha* (Buddha-nature)? What about Dzogchen's "Primordial Awareness"? Doesn't that sound like One Mind?
          *   *The Rebuttal (Crucial Step):*
              *   *Tathāgatagarbha:* It is not a self. It is the *potential* for awakening or the *emptiness* of the mind. The *Ratnagotravibhāga* and *Laṅkāvatāra Sūtra* explicitly warn against interpreting it as *ātman*. It's "emptiness with qualities," not a "substance."
              *   *Dharmakāya:* It is the truth-body, the way things are (emptiness), not a cosmic subject *having* experiences. It is immanent, not a transcendent observer.
              *   *Dzogchen/Zen:* "Non-duality" (*advaya*) does not mean "monism" (one thing). It means the lack of duality between subject and object *within an event*, not the collapse of all causal streams into one subject.
              *   *The "Mirror" Metaphor:* A mirror reflects everything. Does that mean all reflections are the *same* image? No. They share the nature of the mirror (emptiness), but the images are distinct and causally discrete.
              *   *Interpenetration (Huayan):* "One is all, all is one" refers to mutual emptiness and interdependence, not numerical identity of subjects.

      *   **Conclusion:** Summarize. OI is a comforting metaphysical story, but it is incompatible with the core mechanistic soteriology of Buddhism (karma, dependent origination). EI is the philosophically honest reading.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Did I distinguish clearly between EI and OI? Yes. EI = no subject. OI = one subject.
      *   *Check:* Did I use the term *santāna* correctly? Yes, as a causal stream without a carrier.
      *   *Check:* Is the Mahayana section strong enough? I need to make sure I don't just dismiss it but explain *why* the language is metaphorical. The "Two Truths" doctrine is helpful here.
      *   *Check:* Is the tone appropriate? Needs to be analytical, not dogmatic, but firm on the textual evidence.
      *   *Check:* Address the "friend's" claim about Buddhologists. Acknowledge that some modern interpreters (like certain Zen teachers speaking to Westerners) might use OI-like language, but textual scholarship rejects it.

  5.  **Final Polish:** Ensure terms like *śāśvatavāda* (eternalism) and *ucchedavāda* (nihilism) are used correctly to position OI as a form of eternalism. Ensure Parfit is mentioned as the philosophical ally for EI. (The prompt mentions Parfit).

  6.  **Writing the Response:** (Proceeding to generate the response based on these structured thoughts.)
answer: |-
  This is a sophisticated philosophical dispute that cuts to the heart of Buddhist metaphysics. Your friend's position is a common one in contemporary rationalist and neo-Advaitin circles, where the dissolution of ego boundaries is often conflated with the numerical identity of subjects. However, from the standpoint of rigorous Buddhist philology and philosophy, the move from *anatta* (no-self) to Open Individualism (one universal subject) is a category error that reintroduces the very substantialism the Buddha sought to dismantle.

  The following argument establishes that Buddhist doctrine supports **Empty Individualism** (the view that there are only experiences/causal streams, with no subject underlying them) rather than **Open Individualism** (the view that there is one subject underlying all experiences). It further demonstrates that Open Individualism is structurally identical to the Upanishadic *ātman* doctrine, which Buddhism explicitly rejects, and explains why Mahayana non-dualism does not rescue the Open Individualist reading.

  ### I. The Mechanism of *Anatta*: Destruction of the Locus, Not the Boundary

  The fundamental error in the Open Individualist reading of Buddhism is the assumption that *anatta* merely dissolves the *boundaries* between persons, leaving a single remaining subject. In reality, *anatta* dissolves the *locus* of experience entirely.

  **1. The Five Aggregates (*Skandhas*) as Exhaustive Analysis**
  In the *Anattalakkhaṇa Sutta*, the Buddha analyzes the person into five aggregates: form, feeling, perception, formations, and consciousness. He asks for each: "Is this permanent or impermanent?" "Is what is impermanent satisfactory or unsatisfactory?" "Is it fit to be regarded as 'This is mine, this I am, this is my self'?"

  The conclusion is not "These aggregates belong to a Universal Self." The conclusion is that because they are impermanent and unsatisfactory, they cannot be taken as self *at all*. If Open Individualism were true, there would need to be a sixth aggregate: a universal consciousness that *has* the five aggregates. But the Buddhist analysis claims the five aggregates are exhaustive. There is no "experiencer" behind the experience; there is only the experiencing.

  Empty Individualism aligns with this: there are pain-experiences and thought-experiences, but no "pain-experiencer." Open Individualism posits a "Universal Pain-Experiencer." The latter is a metaphysical posit that the *skandha* analysis specifically rules out.

  **2. Dependent Origination (*Pratītyasamutpāda*) and Specific Causality**
  Dependent origination teaches that phenomena arise based on specific conditions. "With ignorance as condition, volitional formations arise..." This is a mechanistic, impersonal process.

  If Open Individualism were true, the conditions for experience would have to be universal. If I am numerically identical to you, then the conditions causing "my" experience should be accessible to "your" perspective, because they are the same perspective. However, Buddhism insists on the specificity of karmic causation. My karma ripens for me; your karma ripens for you. This is not a moral arbitrary rule; it is an ontological fact about causal streams.

  In Empty Individualism, this is easily explained: Causal Stream A is distinct from Causal Stream B. They do not share a subject. In Open Individualism, this becomes incoherent. If there is only One Subject, why does the One Subject suffer the consequences of Action A in one locus and Action B in another, without memory or continuity between them? To save this, the Open Individualist must argue that the One Subject is "amnesic" between bodies. But this requires positing a persisting entity that survives the break in memory and causality. That entity is, by definition, *ātman*.

  **3. The *Santāna* (Continuum) vs. The Universal Subject**
  Buddhism accounts for continuity through the concept of *santāna* (continuum). This is a causal series of momentary events, like a flame passed from one candle to another. The flame at moment *t2* is not identical to the flame at *t1*, but it is causally dependent on it.

  *   **Empty Individualism:** Matches the *santāna*. There is continuity without identity.
  *   **Open Individualism:** Claims the flame is the *same* substance regardless of the candle.

  The *santāna* is private and discrete. My mental continuum is not your mental continuum. If they were the same continuum (as OI suggests), then when I attain enlightenment, you would attain enlightenment simultaneously, because the subject of my experience is the subject of yours. The entire Buddhist soteriological project is predicated on the fact that I must purify *my* continuum; you must purify *yours*. The privacy of the *santāna* is a foundational axiom of Buddhist ethics and practice.

  ### II. The Upanishadic Trap: Open Individualism as *Śāśvatavāda*

  Your friend insists that Buddhologists who deny the Open Individualist reading haven't "caught up." The historical record suggests the opposite: the Open Individualist reading is a recurrence of the view the Buddha explicitly argued against in his lifetime.

  **1. *Ātman* as Universal Subject**
  The pre-Buddhist Upanishadic tradition posited *Ātman* (the true Self) as identical with *Brahman* (the Universal Reality). The mahāvākya *Tat Tvam Asi* ("Thou Art That") declares the numerical identity of the individual subject and the universal ground.

  Open Individualism is structurally isomorphic to this view.
  *   **Upanishads:** There is only one Self; individuality is *māyā* (illusion).
  *   **Open Individualism:** There is only one Subject; personal identity is a perspectival illusion.

  Both views preserve a **substantial subject**. They differ only on the *scope* of the subject (one per person vs. one total). Buddhism rejects the existence of *any* substantial subject. To say "There is only One Experiencer" is to reify consciousness (*viññāṇa*) into a self (*attā*).

  **2. The *Brahmajāla Sutta* Critique**
  In the *Brahmajāla Sutta* (DN 1), the Buddha catalogues 62 wrong views. Many of these involve views of the self as infinite, pervasive, or universal. Specifically, the view that "The self is infinite and pervasive" is classified as a form of Eternalism (*śāśvatavāda*).

  The Buddha's critique is that any view which posits a self—whether finite or infinite, single or multiple—is a fetter. Open Individualism posits an infinite, single self. Therefore, according to the canonical criteria, it is a form of Eternalism. It fails to see that the "One Subject" is itself a construct dependent on the very experiences it claims to underlie.

  **3. The Soteriological Consequence**
  If Open Individualism were true, liberation (*nirvāṇa*) would imply the annihilation of the only existing subject. This would make *nirvāṇa* indistinguishable from nihilism (*ucchedavāda*).
  However, Buddhism defines *nirvāṇa* as the cessation of craving and ignorance within a causal stream, not the destruction of a Universal Subject. By positing a Universal Subject, Open Individualism forces a dilemma: either everyone is liberated at once (which is empirically false), or the Universal Subject remains in samsara forever (which denies the possibility of *nirvāṇa*). Empty Individualism avoids this: specific causal streams cease grasping, and thus suffering ceases for that stream, without requiring the destruction of a metaphysical universal.

  ### III. Addressing the Mahayana Objection: *Tathāgatagarbha* and Non-Duality

  This is the strongest objection available to your friend. Mahayana texts speak of *Tathāgatagarbha* (Buddha-nature), *Dharmakāya* (Truth Body), and traditions like Dzogchen speak of "Primordial Awareness" (*rigpa*). To a casual reader, this sounds like a Universal Mind. However, a technical reading shows these concepts are soteriological metaphors, not ontological claims supporting Open Individualism.

  **1. *Tathāgatagarbha* is Emptiness, Not Substance**
  The *Ratnagotravibhāga* and the *Laṅkāvatāra Sūtra* explicitly address the risk of interpreting Buddha-nature as *ātman*. The *Laṅkāvatāra* states that the teaching of *Tathāgatagarbha* is a "skillful means" (*upāya*) to attract those attached to the idea of self, leading them gradually to emptiness.

  Ontologically, *Tathāgatagarbha* is defined as **emptiness (*śūnyatā*) endowed with qualities**. It is not a "thing" that exists; it is the *lack* of inherent existence in the mind, which allows for the possibility of transformation.
  *   **Open Individualist Reading:** Buddha-nature is a universal consciousness shared by all.
  *   **Buddhist Reading:** Buddha-nature is the fact that all beings lack inherent self-nature, making enlightenment possible for all.

  If Buddha-nature were a single universal subject, it would be inherently existent. But the core Mahayana tenet is that *all* phenomena, including consciousness, are empty of inherent existence. A universal subject would be the one non-empty thing, violating the doctrine of universal emptiness.

  **2. *Dharmakāya* is Not a Subject**
  The *Dharmakāya* is often translated as "Truth Body." It is not a cosmic mind that thinks thoughts; it is the realization of truth (emptiness) itself. It is immanent in all beings not as a "part" of a whole, but as the *nature* of reality.

  Consider the metaphor of space. Space is "one" and pervasive. A pot contains space; a jar contains space. If you break the pot, the space inside joins the space outside.
  *   **Open Individualist:** The space is the *same* subject.
  *   **Buddhist:** Space is not a subject at all. It is a metaphor for the lack of obstruction (emptiness). The pots (causal streams/*santānas*) are distinct. The "oneness" of space does not mean the pots are the same pot.

  Similarly, the *Dharmakāya* is the "space-like" nature of mind. It does not imply that the experiences arising within that space are numerically identical across different causal streams.

  **3. Non-Duality (*Advaya*) vs. Monism**
  Traditions like Dzogchen and Zen speak of "non-duality." In Western metaphysics, non-duality is often confused with Monism (One Thing).
  *   **Monism (Open Individualism):** There is only One Subject.
  *   **Non-Duality (Buddhism):** There is no separation between subject and object *within the event of experience*, and no inherent boundary between phenomena, but this does not imply numerical identity of streams.

  In Dzogchen, *rigpa* (awareness) is non-dual. However, this is taught in the context of recognizing the nature of *one's own* mind. The instruction is "Look at your mind." If there were only one subject, the instruction would be nonsensical; there would be no "your" to look. The persistence of the teacher-student relationship, the transmission of lineage, and the specific karmic connections in Vajrayana all presuppose distinct causal streams (*santānas*) that interact but do not merge into a single subject.

  **4. The Huayan Metaphor: Indra's Net**
  The Huayan school speaks of "One is All, All is One." This is often cited by Open Individualists. However, the doctrine of *Pratītyasamutpāda* in Huayan (Interpenetration) means that every phenomenon reflects every other phenomenon because all are empty.
  It does **not** mean every phenomenon *is* every other phenomenon numerically.
  If I strike a gem in Indra's Net, the reflection changes in all other gems. But the gems remain distinct loci. If they were one gem (Open Individualism), striking one part would be striking the whole in a way that collapses distance and causality. Buddhism preserves the distinctness of the gems (beings/streams) while affirming their mutual interdependence.

  ### Conclusion

  The Open Individualist reading of Buddhism relies on a category mistake: it interprets the *absence of boundaries* (emptiness of self) as the *presence of a universal container* (one self).

  1.  **Textual Evidence:** The *skandha* analysis exhausts the person without remainder, leaving no room for a universal subject. The *santāna* doctrine explains continuity through causality, not identity.
  2.  **Metaphysical Consistency:** Open Individualism reintroduces *ātman* (a permanent, unchanging experiencer), which Buddhism defines as the root of suffering and the primary object of negation. It collapses the specific causality of karma into incoherence.
  3.  **Mahayana Nuance:** Concepts like *Tathāgatagarbha* and *Dharmakāya* describe the *potential* for awakening and the *nature* of reality (emptiness), not a substantial universal mind. Non-duality denies the subject-object split, not the distinctness of causal streams.

  Your friend's claim that Buddhologists "haven't caught up" ignores that the rejection of *ātman* (in both individual and universal forms) is the defining feature that separates Buddhism from the Brahmanical traditions it emerged from. Empty Individualism is not just compatible with Buddhism; it is the only interpretation that preserves the core mechanisms of karma, dependent origination, and the possibility of liberation without falling back into the Eternalism (*śāśvatavāda*) the Buddha spent his life refuting.
