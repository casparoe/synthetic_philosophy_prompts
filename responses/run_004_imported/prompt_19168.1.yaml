  **MEMORANDUM**

  **TO:** Graduate Committee, Department of Philosophy
  **FROM:** [Your Name], Graduate Committee Secretary
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Frege Prize

  **1. Purpose and Context**

  This memo serves as the formal recommendation of the Graduate Committee Secretary regarding the future of the Frege Prize. As you know, the committee's deliberations were prompted by the circulation of Gottlob Frege's 1924 diary within our reading group. The diary contains explicit advocacy for the stripping of political rights from Jewish citizens and other virulent antisemitic views. This has precipitated a division within the committee between those who argue for renaming the prize to avoid institutional endorsement of these views, and those who argue that retaining the name is necessary to avoid a category error regarding the autonomy of logical truth.

  My purpose here is not to summarize the disagreement, which is already well-known to us, but to propose a concrete course of action. Before offering that recommendation, I believe it is incumbent upon us to articulate the strongest possible version of the position I am *not* recommending. Only by acknowledging the full weight of the opposing argument can we ensure our final decision is principled rather than reactive.

  **2. The Strongest Case for Retiring the Name**

  The argument for quietly renaming the prize rests on a normative claim that is, in my view, philosophically robust and morally urgent. It is not merely a demand for comfort, but a claim about the *speech act* inherent in awarding a prize.

  Proponents of renaming argue that an academic prize is not a textbook. A textbook is a tool; we use Frege's logic without endorsing his life. A prize, however, is an *honorific*. It is a performative utterance by the department that says, "This name represents our values and our lineage." When we attach Frege's name to the highest achievement of our graduate students, we are not merely referencing the *Begriffsschrift*; we are invoking the man as a patron.

  The strongest version of this argument contends that the separation between "work" and "life" is a luxury not afforded to those targeted by the politics in question. For a Jewish student in our department, the name "Frege" in the diary is not a historical curiosity; it is a record of a desire to see their ancestors disenfranchised. To ask them to accept an award in that name, even while acknowledging the diary, is to ask them to accept a symbol of their own exclusion as a badge of honor. The argument holds that "contextualization" is often a form of mitigation that allows the majority to feel virtuous without removing the source of the harm. If the function of the prize is to foster a sense of belonging and excellence, and the name actively undermines that belonging for a specific group, then the name has failed its function. On this view, retaining the name is not a neutral act of preservation; it is an active choice to prioritize historical continuity over present-day inclusivity.

  **3. The Empirical and Normative Distinction**

  While the argument above is compelling, I believe it conflates two distinct questions that the committee must separate to vote responsibly.

  *The Empirical Question:* Does the diary invalidate the philosophy?
  Here, the committee members arguing for retention are correct. Frege's antisemitism is biographically significant but logically irrelevant. The truth conditions of the *Begriffsschrift* do not depend on the moral character of their author. To suggest otherwise is to commit a genetic fallacy. As Michael Dummett noted, we can find the diary distressing without finding a logical error in the logic. If we begin removing names based on the private moral failings of their bearers, we risk a precedent that could empty our department of most of its history, from Heidegger to Russell. We must be careful not to treat the history of philosophy as a morality play where only the virtuous are permitted to have true thoughts.

  *The Normative Question:* Does the prize endorse the man?
  This is where the retention argument requires modification. While the *logic* is autonomous, the *prize* is social. We cannot simply say "the logic stands on its own" and ignore the symbolic weight of the award. However, erasure is not the only alternative to endorsement.

  **4. Recommendation**

  I recommend that the committee **retain the name "The Frege Prize" but institute a standing, formal acknowledgment of Frege's political views and the 1924 diary.**

  This acknowledgment should appear on all departmental materials regarding the prize, on the department website, and be read aloud during the award ceremony. It should state clearly that while Frege's contributions to logic and the philosophy of language are foundational to the discipline, his later political writings advocated for the exclusion and disenfranchisement of Jewish people, views that are fundamentally incompatible with the values of this department.

  **5. Rationale**

  This recommendation navigates between the category error of the "Keep As Is" faction and the potential erasure of the "Rename" faction.

  1.  **It preserves the philosophical heritage without sanitizing it.** By keeping the name, we acknowledge that Frege's logic remains a tool we use and a standard we aspire to. We do not pretend he did not exist, nor do we pretend his logic is tainted.
  2.  **It transforms the prize into a site of critical engagement.** A standing acknowledgment ensures that no recipient accepts the prize without confronting the complexity of the canon. It signals to our students that we do not honor philosophers uncritically. We honor the work, but we scrutinize the world-view.
  3.  **It addresses the normative harm without capitulating to erasure.** The "Rename" argument correctly identifies that silence is complicity. By making the diary a permanent part of the prize's public identity, we remove the "quiet endorsement." We make the tension visible. This respects the distress of those harmed by Frege's views by refusing to hide them, while respecting the intellectual inheritance of the discipline by refusing to discard the name entirely.

  **6. Implementation**

  If the committee votes in favor of this recommendation, I propose the following next steps:
  *   Draft the text of the standing acknowledgment in consultation with the department's Diversity and Inclusion liaison.
  *   Update the department website and graduate handbook prior to the spring nomination cycle.
  *   Prepare a brief statement for the faculty advisor to deliver at the next award ceremony, contextualizing the decision for the student body.

  **7. Conclusion**

  We cannot change Frege's diary. We cannot change the history of analytic philosophy. But we can change how we administer our relationship to that history. Retaining the name with a standing acknowledgment allows us to hold two truths simultaneously: that Frege's logic is indispensable, and that Frege's politics are abhorrent. It asks our students to inherit the discipline critically, rather than blindly or not at all.

  I move that we adopt this recommendation and bring it to a vote before nominations reopen.
