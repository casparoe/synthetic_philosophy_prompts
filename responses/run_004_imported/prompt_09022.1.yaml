answer: |-
  The turnstile clicked, a sound Elias had heard ten thousand times. It was the sound of permission. He walked through, the magnetic card slipping back into his wallet with the muscle memory of a decade. He descended the stairs to the platform. The tiles were white, grouted with grey. The sign above the tracks read *OAKWOOD TERMINUS* in bold, sans-serif black.

  Elias stood on the yellow line. This was the hinge. Not the train, not the station, but the proposition: *This train goes to Oakwood.*

  It was not a belief he held; it was a ground he stood on. He did not check the sign every morning. He did not ask the other commuters. To check would imply that doubt was possible, and doubt required a framework where checking made sense. You check a ticket against a date, but you do not check the concept of "date" itself. You verify a route against a map, but you do not verify that maps correspond to territory. That correspondence was the hinge. It held the door open for everything else: being on time, going to work, returning home.

  The train arrived. The doors hissed open. Elias stepped in. He sat opposite a woman reading a paperback. The doors closed. The train lurched forward.

  *This train goes to Oakwood.*

  The thought appeared, but it felt thin. It lacked the weight of fact. It felt like a sentence someone had written on a piece of paper and taped to the wall. Elias looked at the woman. She turned a page. She was going to Oakwood, presumably. Or perhaps she was going to the next station. How would he know? If he asked her, she would speak. She would make sounds. "Yes," she might say. But why would those sounds bind her to the truth? Why would "Yes" mean agreement and not just noise?

  He looked at the digital display above the door. *NEXT: RIVER NORTH.*

  He knew River North was before Oakwood. He had passed through it for ten years. But the knowledge felt like trivia, like knowing the name of a character in a book he hadn't read. The connection between the light on the panel and the place outside the tunnel was severed. The light was just a diode. The tunnel was just concrete.

  Elias stood up. He needed to verify. Verification was the tool you used when a belief was shaky. But as he reached for the emergency intercom, he stopped. To ask the conductor, "Are we going to Oakwood?" presupposed that the conductor knew, that the word "Oakwood" meant the same thing to him as it did to Elias, and that the conductor intended to tell the truth.

  All of those presuppositions were hinges. And they were all vibrating.

  He sat back down. The train slowed. The brakes squealed. The doors opened. A gust of stale air rushed in.

  *River North,* the automated voice said.

  Elias looked out the door. He saw a platform. He saw people waiting. He saw a sign on the wall that said *RIVER NORTH*.

  It was consistent. The sign matched the voice. The platform looked like a platform. In the past, this consistency would have settled him. Consistency was evidence. But evidence only works if you trust the scale you are weighing it on. If the hinge is loose, consistency is just a pattern, not a proof. A dream can be consistent. A lie can be consistent.

  He stayed on the train. The doors closed. The train moved again.

  He tried to summon a memory of Oakwood. The exit turnstiles. The street level escalator. The newsstand where he bought coffee. He could picture them. But the picture was static. It didn't carry the force of *destination*. It was just an image, like a scene from a movie. The proposition *I will arrive at Oakwood* requires a future that is connected to the present by causality. But causality was just another hinge. *Effect follows cause.* If that loosened, then pressing the "Open Door" button might open the door, or it might turn on the lights, or it might do nothing, and there was no reason to expect one over the other except habit.

  He looked at his hands. He flexed his fingers. They moved. He felt the movement. But the feeling was just a sensation. It didn't prove *he* was moving them. It just proved that movement and sensation were occurring in proximity.

  The train slowed again. *NEXT: OAKWOOD.*

  The light illuminated. Elias stood up. His legs felt heavy, not from fatigue, but from the loss of justification. Why stand? Why exit?

  If he got off, he would walk out of the station. He would go to his office. He would sit at his desk. He would type on a keyboard. But why? The purpose of the office was to do work. The work was to process claims. The claims were about reality—damages, losses, events. But if the hinge propositions holding reality together were loose, what was a claim?

  He stepped off the train onto the platform. The sign said *OAKWOOD*.

  He walked toward the exit. A man in a uniform stood by the turnstiles. A station master.

  "Ticket, please," the man said.

  Elias handed him the card. The man scanned it. The light turned green.

  "Have a good day," the man said.

  Elias walked through. He stood at the bottom of the escalator. He looked up toward the street. The light from above was grey daylight.

  He put his foot on the step. The step moved.

  He had a choice. He could go up, into the city, into the day where people acted as if the hinges were fixed. They would buy bread, assuming the bread would nourish. They would drive cars, assuming the brakes would stop. They would speak, assuming words carried meaning. They were playing a game where the rules were invisible because they were never tested.

  Or he could sit down here.

  If he sat down, he would not be doubting. Doubt implies you are looking for certainty. He was past that. He was in the space where the search for certainty had lost its point. To verify that the escalator went up would require him to ride it. But riding it only proved that it moved *then*. It didn't prove it was an escalator to the street. It might be an escalator to a basement. It might be an escalator to nowhere.

  He looked at the woman who had been on the train. She walked past him, heels clicking on the tile. She was going up. She didn't look at the sign. She didn't check her watch. She trusted the hinge. That trust was what allowed her to be a person rather than a collection of sensations.

  Elias took his foot off the step. He stepped back onto the flat concrete.

  He took out his phone. He opened the map application. The blue dot pulsed. It said *YOU ARE HERE*.

  He stared at the dot. The map showed the streets above. It showed the station below. It showed the connection.

  But the phone was a device. The satellite was a object. The signal was a wave. None of them contained the truth. They only contained data. The truth was in the hinge, and the hinge was silent.

  He put the phone away. He walked back toward the platform. The train was gone. The tracks were empty, dark tunnels Mouths in the wall.

  He sat on the bench. He waited.

  He did not wait for a train. He did not wait for answers. He waited because waiting was the only action that didn't require a justification. To move required a destination. To speak required a listener who understood. To stay required nothing.

  A draft came from the tunnel. It smelled of ozone and dust. It was a real smell. But even that—*real*—was a word that needed a hinge to hold it up.

  Elias folded his hands in his lap. He watched the tunnel. Somewhere, a train was coming. It would arrive. The doors would open. The sign would light up.

  He would have to decide whether to get on. Not based on where it went, but based on whether he could bear the weight of the door opening into a world that might not be there.
