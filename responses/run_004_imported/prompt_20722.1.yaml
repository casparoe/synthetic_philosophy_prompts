answer: |-
  I. J. Good's theorem is a cornerstone of single-agent decision theory. It proves that for a Bayesian agent facing a decision problem against "Nature" (a passive environment), the expected utility of acting with cost-free information is always greater than or equal to the expected utility of acting without it. The logic is straightforward: information expands the set of available contingent strategies, and the agent can always choose to ignore the information and replicate the uninformed action.

  However, the generalization of this theorem to **strategic interactions** (game theory) is false. In a multi-agent setting, the "environment" includes other rational optimizers who react to your actions. Because your actions depend on your information, your information state indirectly influences your opponents' strategies. Consequently, acquiring information can alter the equilibrium of the game in a way that reduces your expected payoff. Information can destroy commitment power, eliminate risk-sharing opportunities, or trigger adverse selection.

  Here is the argument against the generalization, supported by concrete cases where rational agents are strictly worse off for being informed.

  ### 1. The Mechanism: Strategic Interdependence and Commitment
  Good's theorem fails in games because it assumes the payoff function is fixed relative to the agent's action. In game theory, the payoff depends on the *profile* of actions. When an agent acquires information, they condition their strategy on that information. Opponents, anticipating this conditioning, adjust their own strategies.

  Ignorance can function as a **commitment device**. By remaining uninformed, an agent restricts their own strategy space (they cannot condition on the state). This restriction can be credible and observable to opponents, forcing the opponents to play a more accommodating equilibrium. If the agent becomes informed, they regain the flexibility to optimize, but the opponent, knowing this flexibility exists, will exploit it, leading to a worse outcome for the informed agent.

  ### 2. Concrete Case A: The Hirshleifer Effect (Destruction of Risk-Sharing)
  The most rigorous economic counter-example is the **Hirshleifer Effect** (Jack Hirshleifer, 1971), which demonstrates that public information can lower the expected welfare of all agents in a risk-sharing game.

  **The Setup:**
  Consider two risk-averse agents, Alice and Bob, engaging in a trade to insure against income fluctuations.
  *   **States of the World:** $\theta \in \{ \text{Rain}, \text{Shine} \}$, each with probability 0.5.
  *   **Endowments:** Alice has high income in Rain, low in Shine. Bob has low income in Rain, high in Shine. Their endowments are perfectly negatively correlated.
  *   **Preferences:** Both have concave utility functions (risk-averse).

  **Scenario 1: Ignorance (No Information)**
  Before the state is revealed, Alice and Bob know the probabilities but not the outcome. Because their risks are negatively correlated, there are mutual gains from trade. They sign an insurance contract to pool their resources.
  *   **Result:** Both agents consume a certain average income. Due to risk aversion, the utility of a certain income is higher than the expected utility of the risky endowment.
  *   **Payoff:** High Expected Utility (Insurance achieved).

  **Scenario 2: Information (Public Signal)**
  Suppose a cost-free, perfectly accurate public signal reveals the weather *before* trading occurs.
  *   **Result:** Once the state is known (e.g., "Rain"), there is no longer any uncertainty to insure against. Alice knows she is rich; Bob knows he is poor. There are no gains from trade ex-post. They simply consume their endowments.
  *   **Payoff:** Low Expected Utility (No insurance, full risk exposure).

  **Conclusion:**
  Both agents are fully rational and Bayesian. Yet, the introduction of cost-free information strictly lowers their ex-ante expected utility because it destroys the uncertainty required for mutually beneficial insurance. Here, information has negative value.

  ### 3. Concrete Case B: The Market for Lemons (Adverse Selection)
  While Hirshleifer focuses on public information, George Akerlof's **"Market for Lemons"** (1970) illustrates how *private* information (known by the agent, but not the counterparty) can lower the agent's ex-ante expected payoff.

  **The Setup:**
  *   **Agent:** A Seller of a used car.
  *   **Opponent:** A Buyer.
  *   **State:** The car is either a "Peach" (High Quality, Value $V_H$) or a "Lemon" (Low Quality, Value $V_L$). Probability 0.5 each.
  *   **Surplus:** The Buyer values the car more than the Seller (e.g., Buyer values at $1.2 \times V$). Trade is mutually beneficial.

  **Scenario 1: Ignorance (Symmetric Uninformed)**
  Neither the Seller nor the Buyer knows the quality of the car.
  *   **Strategy:** They trade at the Expected Value ($E[V] = 0.5 V_H + 0.5 V_L$).
  *   **Result:** Trade always occurs. The Seller of a Peach receives $E[V]$. Since $E[V] > V_H$ is not necessarily true, we assume the gain from trade (the 1.2 multiplier) makes selling rational.
  *   **Seller's Ex-Ante Payoff:** Price ($E[V]$) + Trade Surplus.

  **Scenario 2: Information (Asymmetric Informed)**
  The Seller learns the true quality of the car before trading (cost-free information). The Buyer knows the Seller knows.
  *   **Strategy:** The Buyer knows the Seller will only sell if Price $\ge V_{actual}$.
      *   If the car is a Lemon, the Seller is willing to sell at $E[V]$.
      *   If the car is a Peach, the Seller requires Price $\ge V_H$. Since $V_H > E[V]$, the Seller will not sell at the average price.
  *   **Reaction:** The Buyer anticipates that only Lemons are offered at $E[V]$. The Buyer lowers their offer to $V_L$.
  *   **Result:** At price $V_L$, the Seller of a Peach refuses to sell. The market for Peaches collapses.
  *   **Seller's Ex-Ante Payoff:**
      *   If Lemon: Sells at $V_L$.
      *   If Peach: No trade. Keeps car worth $V_H$ (but loses the trade surplus).
      *   **Comparison:** In the Ignorance scenario, the Peach seller traded and gained the surplus. In the Information scenario, the Peach seller does not trade. If the surplus from trade is sufficiently large, the Seller's **ex-ante expected payoff is strictly lower** when they possess the information about quality.

  ### 4. Synthesis
  The generalization of Good's theorem fails because it treats information as a purely technical input for optimization, ignoring its **strategic signaling value**.

  1.  **In Single-Agent Problems:** Information $\rightarrow$ Better Optimization $\rightarrow$ Higher Utility. (Good's Theorem holds).
  2.  **In Strategic Problems:** Information $\rightarrow$ Changed Strategy $\rightarrow$ Opponent's Counter-Strategy $\rightarrow$ **Potentially Lower Utility**.

  A rational Bayesian agent in a game must calculate the **Value of Information** not just as $E[U|Info] - E[U|NoInfo]$ holding opponent strategies fixed, but as the difference in **Equilibrium Payoffs**. As demonstrated by Hirshleifer and Akerlof, the equilibrium shift caused by information can be detrimental. Therefore, a rational agent embedded in a strategic interaction should not always attach non-negative value to becoming better informed; sometimes, rational ignorance is the optimal strategy.
