answer: |-
  This is a fantastic real-world application of what you're studying. In ethics, this specific dynamic touches on the distinction between **the truth of a claim** and **the standing to make that claim.**

  Here is the breakdown of whether her comeback holds up, using the concepts you're likely covering in class.

  ### 1. The Logical Perspective: *Tu Quoque*
  Logically, your sister is relying on a defense against the *tu quoque* (Latin for "you also") fallacy.
  *   **The Fallacy:** If you argue, "You order DoorDash too, so your claim that DoorDash is unhealthy is false," that is a logical fallacy. Her habits do not change the nutritional facts or the environmental impact of delivery packaging.
  *   **Her Defense:** When she says, "That doesn't make me wrong about you," she is logically correct. The proposition "Ordering DoorDash 5 nights a week is wasteful/unhealthy" can be true even if the person stating it is a hypocrite.

  **Verdict:** On pure factual grounds, she is right. Her behavior doesn't magically make DoorDash healthy for you.

  ### 2. The Ethical Perspective: Moral Standing to Blame
  However, ethics isn't just about facts; it's about relationships, authority, and norms. This is where her comeback gets shaky. In moral philosophy, there is a concept called **moral standing** (or standing to blame).

  To legitimately blame or lecture someone, you generally need more than just a true premise; you need the *authority* to enforce that norm. Hypocrisy often strips you of that standing. Here is why:

  *   **Implication of Superiority:** A "lecture" implies a hierarchy. It suggests, "I know better, and you should listen to me." If she is engaging in the same behavior, she cannot claim moral superiority.
  *   **Solidarity and Fairness:** Moral communities rely on shared rules. If she exempts herself from the rule she is enforcing on you, she is treating you unfairly. It signals that she values her own convenience over the principles she is preaching to you.
  *   **The Function of Blame:** If the purpose of blame is to correct behavior or uphold a value, hypocritical blame is ineffective. It breeds resentment (as you're feeling) rather than moral improvement.

  **Verdict:** Ethically, she is on shaky ground. While her *facts* are right, her *standing* to lecture you is compromised by her hypocrisy.

  ### 3. The "Clean Hands" Principle
  There is a debate in ethics about whether you need "clean hands" to criticize.
  *   **View A:** No. A smoker can still truthfully tell you smoking kills you. The truth stands alone.
  *   **View B:** Yes (in a relational context). If the criticism is framed as a moral failing ("You are being irresponsible"), the critic must share the burden.

  Your sister is using **View A** to defend her facts, but she is operating in **View B** territory by *lecturing* you. If she had said, "Hey, I know I order DoorDash all the time, and I'm trying to cut back because it's unhealthy. Maybe we could cook together more?" she would retain her moral standing because she acknowledges the shared fault.

  ### 4. Is she "out of line"?
  Yes, but with a caveat.

  She is **out of line** regarding the *dynamic* of the criticism. By refusing to acknowledge her own behavior as part of the problem, she is making this about *your* failure rather than a *shared* challenge. That creates resentment and makes the blame feel like an attack rather than care.

  However, she is **not out of line** regarding the *content*. If you are ordering DoorDash 5 nights a week, her concern about waste and health is valid, regardless of her habits.

  ### How to handle this (using your ethics knowledge)
  Since you are studying this, you can reframe the argument for her. You might say something like:

  > "I agree that DoorDash isn't healthy. But when you lecture me while doing the exact same thing, it's not about health anymore; it's about fairness. You don't have the **standing** to blame me for a rule you don't follow yourself. If we both think it's a problem, let's treat it like a problem we both have, not just something I'm doing wrong."

  ### Summary for your class discussion
  *   **Logic:** Her comeback holds up (Truth is independent of the speaker).
  *   **Moral Responsibility:** Her comeback fails (Hypocrisy undermines the authority to blame).
  *   **Key Concept:** Distinguish between the **validity of the norm** (DoorDash is wasteful) and the **legitimacy of the enforcer** (She is a hypocrite).

  She is technically right about the food, but she is ethically wrong about the relationship.
