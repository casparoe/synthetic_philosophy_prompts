answer: |-
  **MEMORANDUM**

  **TO:** Therapeutic Use Exemption (TUE) Panel
  **FROM:** Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding TUE Application #24-09 (Track & Field)

  **Recommendation**
  I recommend that the Panel grant a **Provisional Exemption**, conditional upon the athlete undergoing an independent, in-person evaluation by a panel-designated psychiatrist within the next 14 days. The exemption remains valid for the upcoming Conference Championships, provided the evaluation is scheduled immediately. If the independent evaluation contradicts the initial diagnosis, the exemption will be revoked for the remainder of the season, and the case will be referred to the Athletic Director for review of competitive results.

  **The Core Challenge: The "Normal Function" Baseline**
  Our bylaws instruct us to approve exemptions for "legitimate treatment" that restore "normal function," while prohibiting advantages "beyond restoring normal function." We need to be honest with one another: in this specific case, that distinction is not a clear line we can simply find; it is a judgment call we have to make.

  Unlike a broken bone, where X-rays show a deviation from structural normality, ADHD exists on a spectrum of attention and impulsivity that overlaps significantly with normal variation. Furthermore, stimulants like Adderall are known to improve reaction time and delay fatigue even in individuals *without* ADHD. This means we cannot rely on the drug's effect to prove the diagnosis; the drug will likely help her run faster regardless of whether she has the disorder.

  Because science cannot give us a perfect test for "normal focus," we cannot decide this case solely on medical deference. We have to decide based on the **rigor of the diagnostic process.** If the baseline of "normal function" is fuzzy, the only way to protect competitive integrity is to ensure the evidence for departing from that baseline is robust.

  **Why Provisional Approval is Necessary**
  I understand the argument from half of this panel that we should approve this automatically. The strongest version of that argument is not about laziness; it is about **duty of care.**

  If we deny this exemption, we are effectively practicing medicine. We are telling a student that her diagnosis is invalid without having examined her. If she genuinely has ADHD, she has been struggling significantly to reach this level of competition without treatment. Denying her medication now—three weeks before championships—could cause genuine psychological harm and performance collapse unrelated to "enhancement." We are a university body, and our primary obligation is to the health and education of our students. To treat her diagnosis as suspicious simply because it was late could discourage other students from seeking mental health care for fear of losing eligibility.

  **Why Conditions are Necessary**
  However, the argument for skepticism is equally weighty. The timing (three weeks before championships), the method (single-session telehealth), and the substance (a potent stimulant) create a scenario where the line between treatment and enhancement is dangerously thin.

  If we approve this without scrutiny, we undermine the trust of her competitors. They are competing under the assumption that no one is using performance-enhancing drugs. While we cannot prove she is "enhancing" rather than "treating," the procedural red flags are too significant to ignore. If we set a precedent that a single online consultation is sufficient to clear a banned substance immediately before a major event, we invite abuse that compromises the conference's integrity.

  **The Decision**
  We cannot perfectly solve the philosophical problem of where "therapy" ends and "enhancement" begins. But we can manage the risk.

  By granting a **Provisional Exemption**, we prioritize the student's immediate health and competitive opportunity (addressing the duty of care). By mandating an **Independent Evaluation**, we verify the medical necessity to protect the field (addressing competitive integrity).

  This approach acknowledges that our bylaws' assumption of a clean "normal function" baseline is flawed. Since we cannot measure the baseline perfectly, we must verify the map (the diagnosis) used to claim the athlete is below it.

  **Next Steps**
  If the Panel agrees, we will notify the athlete immediately. She will be permitted to compete at Championships, but her exemption is contingent on the completion of the independent evaluation. This balances the risk of harming a student with a genuine need against the risk of unfair advantage to her peers.

  Please review this recommendation prior to our vote on Thursday. I am available to discuss the specific wording of the conditions before then.
