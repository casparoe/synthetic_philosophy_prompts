      *   **Constraint 1 (Recommendation):** Must land on *one* recommendation (Approve, Deny, or Approve with Conditions).
      *   **Constraint 2 (Reasoning):** Must be accessible to non-philosophers (coaches/admins) but also acknowledge the philosophical complexity (therapy/enhancement distinction, Boorse/Daniels).
      *   **Constraint 3 (Critical Engagement):** Must *not* quietly assume "restoring normal function" is a clean baseline. If that assumption is shaky, admit it and explain how the decision is made anyway.
      *   **Constraint 4 (Steel-manning):** Must engage honestly with the strongest argument for the opposing view (cost to athlete vs. cost to competitors).
      *   **Context:** Philosophy of Medicine seminar background (Boorse, Daniels, etc.).
      *   **Case Details:** Sprinter, Adult ADHD dx 3 weeks before champs, telehealth psychiatrist, single session, prescribed Adderall. Bylaws require "legitimate treatment" but forbid "advantage beyond restoring normal function."

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Risks undermining integrity of competition. Looks suspicious given timing and telehealth nature. Ignores the "enhancement" risk.
      *   *Option B: Deny.* Risks harming a student with a potential genuine medical need. Seems paternalistic. Ignores the "treatment" mandate.
      *   *Option C: Approve with Conditions.* This is the most nuanced and defensible position. It acknowledges the medical need *might* be real but recognizes the procedural red flags and the competitive integrity issue. It allows for verification without outright denial.
      *   *Specific Conditions:* Independent evaluation (in-person, specialist), delayed effective date (post-champs or pending review), or non-stimulant trial.
      *   *Best Fit:* **Approve with Conditions (specifically: Provisional Approval pending Independent Evaluation).** This balances the duty of care to the student with the duty of fairness to the conference. It addresses the "shaky baseline" problem by demanding better evidence of the baseline.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
