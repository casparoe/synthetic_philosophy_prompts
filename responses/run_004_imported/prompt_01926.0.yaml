answer: |-
  Here is the verdict: **For the specific purpose of Joyce's accuracy-dominance argument for Probabilism, the Brier Score is the superior foundation.**

  While the Log Score has strong intuitive and information-theoretic appeal, it introduces structural pathologies that weaken the dominance argument's normative force. The Brier Score secures the mathematical machinery required to prove that *any* incoherent agent is dominated, without begging the question against dogmatic credences.

  Here is the breakdown of why the Brier Score wins this specific contest, based on the three criteria you raised.

  ### 1. Boundedness and the Dominance Proof
  The core of Joyce's argument is a geometric dominance theorem: for any incoherent credence function $c$, there exists a coherent function $c^*$ such that $c^*$ is more accurate than $c$ at every possible world.

  *   **The Log Score Problem:** The Log Score is unbounded. If an agent assigns credence 1 to a falsehood (or 0 to a truth), their inaccuracy is $\infty$. This breaks the dominance relation. If an incoherent agent assigns 1 to a falsehood at world $w$, they suffer infinite inaccuracy. To dominate them, the coherent alternative $c^*$ must have *finite* inaccuracy at $w$. This forces $c^*$ to be *regular* (never assigning 0 or 1). Consequently, the argument only proves that incoherent agents are dominated by *regular* probabilistic agents. It fails to establish probabilism as a norm for agents who might legitimately hold dogmatic views. You have to build regularity into the premises to make the math work, which narrows the scope of the conclusion.
  *   **The Brier Advantage:** The Brier Score is bounded (between 0 and 1 for binary propositions). This ensures the inaccuracy space is compact. It guarantees that for *any* incoherent function (even dogmatic ones), there is a probabilistic function that strictly dominates it with finite values. The dominance relation holds across the entire hypercube $[0,1]^n$, preserving the generality of the norm.

  ### 2. Treatment of Extreme Credences
  Epistemologists often feel the Log Score is more "truth-sensitive" because it penalizes certainty in error infinitely. However, in the context of justifying Probabilism, this is a bug, not a feature.

  *   **The Log Score Problem:** By assigning $\infty$ penalty to errors at the boundary, the Log Score presupposes that assigning 0 or 1 is epistemically catastrophic. If you use the Log Score to argue for Probabilism, you are effectively smuggling in a norm against dogmatism to prove a norm about coherence. If a skeptic asks, "Why shouldn't I be certain?" the Log Score answers, "Because you'll get infinite penalty." But the accuracy-first project wants to derive norms from the goal of accuracy alone, not build specific risk-aversions into the metric.
  *   **The Brier Advantage:** The Brier Score treats extreme credences continuously. Being certain of a falsehood is bad (score = 1), but not infinitely worse than being 99% sure (score $\approx$ 0.98). This allows the accuracy-firster to argue that coherence is valuable *regardless* of your stance on dogmatism. It isolates the norm of **Probabilism** from the norm of **Regularity**. You can use Brier to prove you must be probabilistic, and then use separate arguments (e.g., about learning or evidence) to argue you should be regular. Keeping these norms distinct is theoretically cleaner.

  ### 3. Strict Propriety and Legitimacy
  You asked if strict propriety alone is enough to count as a "legitimate" scoring rule. **It is not.**

  Strict propriety ensures that an agent expects to minimize inaccuracy by reporting their true credences. Both Brier and Log satisfy this. However, for a scoring rule to underwrite a *dominance* argument, it must also satisfy **continuity** and **boundedness** (or at least controlled growth) on the closed interval $[0,1]$.

  *   **The Verdict on Legitimacy:** A scoring rule that explodes at the boundaries (Log) is illegitimate for a *general* dominance argument because it renders the dominance relation undefined for a subset of credence functions (the dogmatic ones). A legitimate measure for this specific argument must allow for a comparison of *all* possible credence functions. The Brier Score is legitimate here because it supports the topology required for the existence proof of the dominating function.

  ### Summary Verdict
  If your seminar topic were **Conditionalization**, I would tell you to switch to the Log Score (as per Greaves & Wallace), because minimizing expected log loss is equivalent to Bayesian updating.

  But for **Probabilism via Accuracy-Dominance**: **Stick with the Brier Score.**

  The Log Score's unboundedness forces you to restrict the domain of the theorem to regular credence functions, which weakens the argument's ability to convince a skeptic who holds dogmatic, incoherent views. The Brier Score allows the accuracy-first epistemologist to maintain that *any* incoherent agent is accuracy-dominated, regardless of whether they assign 0s and 1s. It provides the robust mathematical topology necessary for the dominance proof without smuggling in auxiliary norms about regularity.

  **Recommendation for your seminar:** Present the Brier Score as the canonical choice for Joyce-style arguments, but note that its "forgiveness" of extreme credences is the primary motivation for why some modern epistemologists (like Pettigrew) look for generalized classes of measures that retain Brier's boundedness while capturing more nuanced epistemic values. But between the two? Brier is the workhorse that keeps the argument standing.
