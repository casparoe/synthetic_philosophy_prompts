          3.  **Generalizability:** The "life-permitting" equivalent is "test-set performance." If you tune on the test set, you are in the same boat as the theologian (explaining away luck).
      *   **Conclusion:** The debate reinforces the need for rigorous validation (hold-out sets, cross-validation) rather than invalidating the sweep method itself.

