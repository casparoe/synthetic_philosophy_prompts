  It is a pleasure to speak with someone who has actually wrestled with grant reviewers demanding adaptive narratives for every feather asymmetry. You have the headline exactly right: the core friction isn't whether natural selection exists, but whether it is the *only* explanation of note, or whether we often mistake the architectural necessities of development and phylogeny for the handiwork of optimization. And yes, you are correct on the art history correction—Gould and Lewontin were indeed critiqued for misidentifying the San Marco features (pendentives, not spandrels), which adds a lovely layer of irony to a paper about the dangers of assuming function without checking structure.

  Since you asked for a live research question where the evidence remains genuinely underdetermined, I want to steer clear of the museum pieces (chins, panda thumbs) and offer you a trait from your own backyard. It is a case where the adaptationist narrative is dominant, publishable, and intuitive, but the "spandrel" (or more precisely, "constraint/byproduct") hypothesis remains stubbornly difficult to rule out.

  The trait is **female plumage ornamentation in passerines**, specifically in lineages where males are brightly colored and females retain significant, conspicuous coloration (e.g., many tropical tanagers, buntings, or cardinals).

  ### The Competing Narratives

  **The Adaptationist Story (Mutual Selection/Social Competition):**
  For decades, the default assumption was that female cryptis was the adaptation (nest predation avoidance) and female brightness was the absence of selection. In the last 20 years, the pendulum has swung. The prevailing adaptive narrative now is that female ornamentation is a result of **direct selection on females**. This could be for female-female competition over resources (Tobias et al., 2012) or mutual mate choice (both sexes selecting for quality). The story is tidy: the trait confers a social signal, it increases fitness, therefore it was selected for. It fits the optimality mindset perfectly.

  **The Spandrel/Constraint Story (Intersexual Genetic Correlation):**
  The alternative, which echoes the Gould/Lewontin critique, is that female ornamentation is largely a **byproduct of selection on males**. Because the sexes share the vast majority of their autosomal genome, the genetic architecture for plumage color is often highly correlated between sexes ($r_{MF}$ is high). If selection for bright plumage in males is strong enough, it can "drag" the female phenotype along with it, even if that phenotype is neutral or slightly deleterious for the female. In this view, the female color is a **developmental/genetic spandrel**: it exists not because it was built for a function in females, but because it is an architectural consequence of the shared genomic "blueprint" selected for males. (If it is later co-opted for female signaling, that would be an exaptation, but the origin is the contentious bit).

  ### Why the Toolkit Fails to Settle It

  This is where your request for the "underdetermination" comes in. We have the standard evolutionary toolkits, yet none can definitively kill off one hypothesis in favor of the other for most species.

  **1. The Comparative Method (Phylogenetic Control)**
  *   **The Hope:** If female brightness is an adaptation for social competition, it should correlate with ecological variables (e.g., year-round territoriality, high population density) across the phylogeny, independent of male brightness.
  *   **The Failure:** Phylogenetic inertia is massive. Bright plumage in both sexes is often an ancestral state retained from a common ancestor. Disentangling whether the trait persisted *because* of current selection (adaptation) or simply *because* it wasn't costly enough to lose (phylogenetic constraint) is statistically perilous. Recent phylogenetic studies show mixed results: some find correlations with social systems, others find that female brightness is best predicted simply by male brightness, regardless of ecology. The signal is too noisy to rule out the "drag" hypothesis.

  **2. Optimality Modeling (Cost-Benefit Analysis)**
  *   **The Hope:** We could model the predation cost of bright plumage against the social benefit. If the benefit outweighs the cost, it's an adaptation.
  *   **The Failure:** Quantifying the "cost" of color in wild female birds is notoriously difficult. Unlike a peacock's tail, a female tanager's red feathers don't obviously impede flight. The predation cost is inferred, not measured. Furthermore, if the trait is a genetic byproduct, the "cost" might be negligible (neutral), meaning natural selection doesn't prune it even without a specific benefit. Optimality models assume the trait is there *to be* optimized; they struggle to model traits that are there simply because they *couldn't easily be removed* without breaking the male trait.

  **3. Developmental Genetics (The "Smoking Gun")**
  *   **The Hope:** If we can measure the intersexual genetic correlation ($r_{MF}$) for plumage traits, we could see if it is strong enough to explain the female trait without direct selection. If $r_{MF}$ is near 1.0, the spandrel hypothesis is strong. If it's low, the sexes have decoupled, implying independent selection.
  *   **The Failure:** This requires quantitative genetic breeding designs or extensive pedigree data in wild populations. For most ornithological study systems, this is logistically impossible. We simply do not have the genomic resolution to say, "In this species, the female is red *only* because she inherits the male's red genes," versus "She has independent regulatory pathways activating red pigment." Without that mechanistic breakdown, we are left inferring genetic architecture from phenotypic correlations, which is circular.

  ### The Underdetermination

  Here is the philosophical rub that mirrors the Spandrels paper: **The evidence is compatible with both stories.**

  If you find a female bird with bright plumage defending a territory, the adaptationist says, "See? It's a signal of dominance." The pluralist says, "She might be defending the territory *despite* the plumage, or using the plumage because it was already there (exaptation), but the trait's *origin* might still be genetic drag."

  Because we cannot easily rewind evolution to see if the female trait appeared *before* or *after* the social behavior, and because we cannot easily sever the genetic link between sexes to see if the female trait disappears, the question remains underdetermined.

  For a field ornithologist like yourself, this hits home. You likely reviewed papers where authors assumed a behavioral function for a morphological trait without ruling out the null hypothesis that the trait was a constraint. In this specific case, the "Adaptationist Programme" tends to win grants because "Female-Female Competition" is a testable behavioral hypothesis, whereas "Genetic Correlation Constraint" is a hard-to-test genomic null.

  The trait exists. It might be an adaptation. It might be a spandrel of the shared genome. And until we can crack the developmental genetics of plumage in wild pedigrees, we are, as Gould might say, telling stories about the cathedral without fully inspecting the arches.
