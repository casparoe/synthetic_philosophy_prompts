      *   *Tone-Painting Angle:* Schopenhauer hates music that points to *phenomena* (storms, birds). AI points to *recordings*. Is a recording a phenomenon? Yes. So AI is essentially hyper-advanced tone-painting, mimicking the *surface* of human expression without the *substance*.
      *   *The Listener:* Schopenhauer cares about the effect on the listener. If the listener feels the Will, does the source matter? Schopenhauer might say the listener is projecting their own Will onto the sounds. But the *art object* itself is deficient.
