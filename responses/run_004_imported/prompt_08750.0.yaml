prompt: |-
  I've been rereading old rationalist-blogosphere arguments about Bayesian versus frequentist statistics, and there's one puzzle from that debate that I've only ever seen asserted, never actually walked through. The Bayesian side likes to point out that, by the Likelihood Principle, a posterior depends only on the data you actually observed and not on the stopping rule that produced it — so a Bayesian supposedly never needs anything like the alpha-spending corrections frequentists build into sequential trials, and "peeking" at accumulating data (the kind of undisclosed flexibility that Simmons, Nelson, and Simonsohn blamed for a good deal of the replication crisis) isn't a problem for them at all. But that seems to run straight into the old "sampling to a foregone conclusion" objection that, if I'm remembering the history right, Armitage raised against the Savage–Birnbaum defense of the likelihood principle around the time of Birnbaum's 1962 paper: if stopping rules are truly irrelevant, why couldn't an experimenter just keep sampling under a cleverly chosen adaptive rule until a Bayesian's posterior is pushed as close to certainty as desired in a hypothesis that happens to be false?

  What I'd like is a mechanistic answer to that, rather than the usual one-liner that "the likelihood principle handles it." My understanding is that the real resolution turns on the sequence of posterior odds being a martingale under the true hypothesis, so that something like Ville's inequality bounds how likely it ever is for a Bayesian's credence in the truth to sink below some threshold — essentially the measure-theoretic cousin of what the Sequences call "conservation of expected evidence." What I don't understand is why the analogous frequentist quantity lacks this property, so that a p-value really can be driven below 0.05 with near-certainty by a patient enough optional-stopping design, while the Bayesian's exposure to being badly wrong stays bounded no matter how an adversary times the stopping. I'd love an actual walkthrough of the mechanics behind that asymmetry — a toy example with a running likelihood ratio on coin flips would be ideal — rather than another restatement of "Bayesians condition on the data, not the design."
reasoning: |-
  Here's a thinking process that leads to the explanation of the Bayesian vs. Frequentist stopping rule debate:

  1.  **Deconstruct the User's Query:**
      *   **Context:** The user is familiar with the old rationalist-blogosphere debates (LW, OB, etc.) regarding Bayesian vs. Frequentist statistics.
      *   **Core Puzzle:** They understand the Likelihood Principle (LP) claim (stopping rules don't matter for posteriors) but are skeptical of the "sampling to a foregone conclusion" objection (Armitage's objection).
      *   **Specific Request:** They want a *mechanistic* answer, not just "LP handles it." They suspect the answer involves martingales and Ville's inequality (conservation of expected evidence).
      *   **Key Comparison:** Why does the Bayesian posterior stay bounded (in terms of error probability) under optional stopping, while the Frequentist p-value can be driven to significance with probability 1?
      *   **Desired Format:** A walkthrough with a toy example (coin flips, likelihood ratios).

  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Likelihood Principle:* Yes, $P(\theta | D) \propto P(D | \theta) P(\theta)$. If $D$ is fixed, the stopping rule doesn't appear in the likelihood function $P(D|\theta)$ (mostly).
      *   *Armitage's Objection:* If I keep sampling until $p < 0.05$, I will eventually get $p < 0.05$ even if $H_0$ is true. Can I do the same for Bayes? i.e., sample until $P(H_1 | D) > 0.99$?
      *   *Martingale Property:* Under the true prior predictive distribution, the posterior probability of the true hypothesis is a martingale. Specifically, the Bayes Factor is a martingale under the null.
      *   *Ville's Inequality:* For a non-negative supermartingale $X_t$ starting at $X_0$, $P(\sup_t X_t \geq 1/\alpha) \leq \alpha X_0$. This is the continuous-time/optional-stopping version of Markov's inequality.
      *   *Frequentist P-value:* A p-value is $P(T(D) \geq T(d_{obs}) | H_0)$. Under optional stopping, the distribution of the *minimum p-value* achieved over time is not uniform. It drifts.
      *   *The Asymmetry:* The Bayesian updates *probabilities*. The Frequentist controls *error rates over hypothetical repetitions*. The Bayesian's "error" is calibrated by the prior. If the prior is wrong, the posterior can be wrong. But if the prior assigns non-zero mass to the truth, the martingale property holds.

  3.  **Structuring the Explanation:**
      *   **Acknowledge the depth:** Validate the user's intuition (martingales/Ville's inequality is indeed the correct mathematical machinery).
      *   **The Toy Model:** Coin flipping. $H_0: \theta = 0.5$, $H_1: \theta \neq 0.5$ (or a specific alternative). Let's use a simple vs. simple hypothesis test for clarity ($H_0: \theta=0.5$ vs $H_1: \theta=0.6$).
      *   **The Frequentist Mechanism (The Leak):** Show how optional stopping breaks the p-value guarantee. The "alpha spending" concept.
      *   **The Bayesian Mechanism (The Shield):** Show the Likelihood Ratio (Bayes Factor) as a martingale under $H_0$.
      *   **Ville's Inequality Application:** Explicitly calculate the bound. If I start with odds 1:1, how likely am I to reach odds 19:1 (95% credence) if $H_0$ is true?
      *   **The Crucial Nuance (Prior Dependence):** The Bayesian protection isn't magic; it's bought with the prior. If the prior excludes the truth, all bets are off. But assuming the prior covers the truth, the expected Bayes Factor is 1.
      *   **Synthesis:** Why the asymmetry exists (conditioning on actual data vs. sampling distribution of the procedure).

  4.  **Drafting the Content - Step-by-Step:**

      *   *Introduction:* Confirm the user's hunch. It *is* about martingales.
      *   *Setup:* Coin flips $X_i \in \{0, 1\}$.
      *   *Frequentist Side:*
          *   Define p-value at step $n$.
          *   Show that $\min_{n} p_n$ does not follow $Uniform(0,1)$.
          *   Intuition: Random walk of the test statistic. It will eventually cross any fixed boundary with probability 1 (Law of the Iterated Logarithm).
      *   *Bayesian Side:*
          *   Define Bayes Factor $BF_{10} = \frac{P(D|H_1)}{P(D|H_0)}$.
          *   Posterior Odds = Prior Odds $\times$ BF.
          *   Key Claim: Under $H_0$, $BF_{10}$ is a martingale with expectation 1.
          *   Proof sketch: $E_{H_0}[\frac{P(D|H_1)}{P(D|H_0)}] = \sum \frac{P(D|H_1)}{P(D|H_0)} P(D|H_0) = \sum P(D|H_1) = 1$.
      *   *Ville's Inequality:*
          *   If $M_t$ is a non-negative martingale with $M_0 = 1$, then $P(\sup_t M_t \geq 1/\alpha) \leq \alpha$.
          *   Translate to odds: If I want posterior prob 0.95 (Odds 19:1), and start at 1:1, I need BF = 19.
          *   Probability of ever reaching BF = 19 under $H_0$ is $\leq 1/19 \approx 0.05$.
          *   *Wait, check math:* If Prior Odds = 1, Posterior Prob = $BF / (1+BF)$. If Prob = 0.95, $0.95 = BF/(1+BF) \Rightarrow 0.95 + 0.95BF = BF \Rightarrow 0.95 = 0.05BF \Rightarrow BF = 19$.
          *   So, probability of ever reaching 95% confidence in $H_1$ when $H_0$ is true is $\leq 1/19 \approx 5.2\%$.
          *   This holds *regardless of stopping rule*.
      *   *The "Foregone Conclusion" Rebuttal:*
          *   Can I force the posterior to 1? No, because the expected posterior probability of the true hypothesis is constant (Conservation of Expected Evidence).
          *   To drive the posterior of $H_1$ up, I need evidence. Under $H_0$, evidence for $H_1$ is a martingale. It drifts, but rarely explodes.
      *   *The Catch (Calibration):*
          *   This relies on the prior being "reasonable" (assigning mass to the truth).
          *   Also, while the *probability* of being fooled is bounded, the *expected loss* might not be if the utility function is unbounded (St. Petersburg paradox vibes), but for standard 0-1 loss, it holds.
      *   *Comparison:*
          *   Frequentist: Controls Type I error *for the procedure*. Optional stopping changes the procedure, breaking the control.
          *   Bayesian: Controls posterior coherence *for the agent*. Optional stopping doesn't change the conditioning, so coherence holds.

  5.  **Refining the Explanation (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful about "Simple vs. Simple" vs. "Simple vs. Composite". The martingale property holds strictly for Simple vs. Simple. For composite hypotheses (e.g., $H_1: \theta \neq 0.5$), the marginal likelihood integrates over the prior. The martingale property holds with respect to the *prior predictive* distribution, not necessarily the true data generating process if the truth isn't in the support. I should stick to Simple vs. Simple for the cleanest toy example, then mention the generalization.
      *   *Clarification on Frequentist:* Why does the p-value fail? Because the p-value is defined as $P(T \geq t_{obs} | H_0, \text{Stopping Rule})$. If you change the stopping rule but calculate the p-value as if you didn't, you are lying. If you calculate it *with* the stopping rule (alpha spending), you preserve the error rate. The Bayesian doesn't need to adjust because the Likelihood function absorbs the data *as is*.
      *   *Wait, the prompt asks:* Why does the Bayesian exposure stay bounded while Frequentist doesn't?
      *   *Answer:* Because the Frequentist p-value (calculated naively) is not a martingale. The Bayesian BF *is*.
      *   *Wait, one more nuance:* The "Sampling to a Foregone Conclusion" argument usually assumes the Bayesian uses a prior that puts 0 mass on the truth or is misspecified. If the prior is correct, you can't sample to a foregone conclusion *in expectation*. You can get lucky, but Ville's inequality bounds the luck.
      *   *Make sure to highlight:* The Frequentist bound (0.05) applies to the *long-run frequency of the method*. The Bayesian bound (Ville's) applies to the *probability of the trajectory* under the true hypothesis. They look similar but mean different things. However, in the context of optional stopping, the Bayesian bound holds *across all stopping times*, whereas the Frequentist bound holds *only for a fixed stopping time*.

  6.  **Final Polish:**
      *   Tone: Respectful, technical but accessible (matching the user's level).
      *   Formatting: Use LaTeX for math. Use bolding for key concepts.
      *   Ensure the "Toy Example" is concrete. Coin flips are best.
      *   Address the "Armitage" point directly.

  7.  **Plan:**
      1.  Validate the user's intuition (Martingales/Ville).
      2.  Setup the Coin Flip Toy Model ($H_0$ vs $H_1$).
      3.  Demonstrate the Frequentist Breakdown (Random Walk crossing boundaries).
      4.  Demonstrate the Bayesian Defense (Likelihood Ratio Martingale).
      5.  Apply Ville's Inequality to bound the "fooling" probability.
      6.  Explain the "Conservation of Expected Evidence" intuition.
      7.  Conclude with the philosophical distinction (Procedure vs. State of Knowledge).

  *(Self-Correction during drafting)*: I must ensure I don't imply Bayesians are immune to *all* problems. If the prior is dogmatic (probability 1 on false hypothesis), no data changes it. If the prior is diffuse, convergence is slow. The specific claim is about *optional stopping* inflating false positives. I need to focus strictly on that.

