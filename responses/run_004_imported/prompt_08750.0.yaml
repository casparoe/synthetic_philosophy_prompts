answer: |-
  You have correctly identified the mathematical machinery required to resolve this puzzle. The intuition that "Bayesians are safe from optional stopping" is not just a philosophical hand-wave; it rests on the **martingale property of the Likelihood Ratio** and **Ville's Inequality**.

  The asymmetry you are looking for arises because the Frequentist p-value (calculated naively) is not a martingale under the null hypothesis, whereas the Bayesian Likelihood Ratio (Bayes Factor) *is*.

  Here is the mechanistic walkthrough using a coin-flip toy model.

  ### 1. The Setup: Simple vs. Simple Hypothesis

  To make the math tractable, let's use a "Simple vs. Simple" test.
  *   **Data:** Sequence of coin flips $X_1, X_2, \dots$ where $X_i \in \{0, 1\}$.
  *   **Null Hypothesis ($H_0$):** The coin is fair, $\theta = 0.5$.
  *   **Alternative Hypothesis ($H_1$):** The coin is biased, $\theta = 0.6$.
  *   **Stopping Rule:** The experimenter watches the data accumulate and stops at time $\tau$ whenever they feel like it (optional stopping).

  ### 2. The Frequentist Mechanism: The Leaky Bucket

  A Frequentist calculates a p-value based on a test statistic, typically the number of heads $S_n = \sum_{i=1}^n X_i$. Under $H_0$, $S_n$ follows a Binomial distribution (approximated by a Normal random walk for large $n$).

  A standard fixed-sample p-value at time $n$ asks: "What is the probability of seeing $S_n$ or more extreme, assuming $H_0$?"
  $$ p_n = P(S_n \geq s_{obs} \mid H_0, n=\text{fixed}) $$

  **The Failure Mode:**
  If you fix $n=100$ in advance, $P(p_{100} < 0.05 \mid H_0) = 0.05$.
  However, under optional stopping, the experimenter computes $p_1, p_2, p_3, \dots$ continuously and stops the *first* time $p_n < 0.05$.

  Mathematically, the standardized test statistic $Z_n \approx \frac{S_n - 0.5n}{\sqrt{0.25n}}$ behaves like a random walk. A fundamental property of a 1D random walk is **recurrence**: it will cross any finite boundary with probability 1 given enough time.
  *   Even if $H_0$ is true, the random fluctuation of the coin will eventually produce a run of heads sufficient to push $Z_n > 1.96$ (the threshold for $p < 0.05$).
  *   Because the Frequentist p-value definition depends on the *sampling distribution of the procedure*, changing the procedure (from "stop at 100" to "stop when significant") changes the distribution of the minimum p-value.
  *   **Result:** $\lim_{N \to \infty} P(\min_{n \leq N} p_n < 0.05 \mid H_0) = 1$. The Type I error rate inflates to 100%.

  ### 3. The Bayesian Mechanism: The Martingale Shield

  Now consider the Bayesian. They compute the **Bayes Factor** ($BF_{10}$), which is the likelihood ratio of the data under $H_1$ versus $H_0$.
  $$ BF_n = \frac{P(D_n \mid H_1)}{P(D_n \mid H_0)} = \prod_{i=1}^n \frac{P(X_i \mid H_1)}{P(X_i \mid H_0)} $$
  Let $L_i = \frac{P(X_i \mid H_1)}{P(X_i \mid H_0)}$ be the likelihood ratio for a single flip.
  $$ BF_n = L_1 \times L_2 \times \dots \times L_n $$

  **The Martingale Property:**
  Crucially, we evaluate the behavior of this ratio **under the assumption that $H_0$ is true**.
  What is the expected value of the single-flip likelihood ratio $L_i$ given $H_0$?
  $$ E_{H_0}[L_i] = \sum_{x \in \{0,1\}} \frac{P(x \mid H_1)}{P(x \mid H_0)} P(x \mid H_0) = \sum_{x \in \{0,1\}} P(x \mid H_1) = 1 $$
  Since the flips are independent, the expected Bayes Factor at step $n$, given the history up to $n-1$, is:
  $$ E_{H_0}[BF_n \mid D_{n-1}] = BF_{n-1} \cdot E_{H_0}[L_n] = BF_{n-1} \cdot 1 = BF_{n-1} $$
  **This makes $BF_n$ a martingale under $H_0$.**

  ### 4. Ville's Inequality: Bounding the "Foregone Conclusion"

  This is where the "sampling to a foregone conclusion" objection is mathematically neutralized.

  The adversary wants to stop sampling at time $\tau$ such that the Bayesian is fooled. To be fooled into believing $H_1$ with posterior probability $0.95$ (starting from prior odds of 1:1), the adversary needs the Bayes Factor to reach 19 (since $\text{PostOdds} = \text{PriorOdds} \times BF$).

  **Ville's Inequality** states that for a non-negative supermartingale $M_t$ starting at $M_0 = 1$:
  $$ P\left( \sup_{t \geq 0} M_t \geq \frac{1}{\alpha} \right) \leq \alpha $$

  Apply this to our Bayes Factor ($M_t = BF_t$) under $H_0$:
  *   We start at $BF_0 = 1$.
  *   We want to know the probability that the BF *ever* crosses a threshold $K = 19$ (corresponding to 95% confidence).
  *   Set $1/\alpha = 19 \implies \alpha = 1/19 \approx 0.0526$.

  $$ P_{H_0}(\text{Ever reaching } 95\% \text{ credence in } H_1) \leq \frac{1}{19} \approx 5.3\% $$

  **The Mechanistic Difference:**
  *   **Frequentist:** The test statistic is a random walk with unbounded variance. Given infinite time, it *will* cross the significance boundary. Probability $\to 1$.
  *   **Bayesian:** The Likelihood Ratio is a martingale with expectation fixed at 1. While it *can* fluctuate upward, the probability of it fluctuating *arbitrarily high* is bounded by the inverse of that height.

  You cannot drive the posterior to certainty with high probability. You can get lucky and drive it up, but the probability of that luck is exactly calibrated by the threshold you set. If you demand 99.9% certainty (Odds 999:1), the probability of ever reaching that under $H_0$ is $\leq 1/1000$.

  ### 5. Conservation of Expected Evidence

  This martingale property is the formalization of the "Conservation of Expected Evidence" principle discussed in the rationalist blogosphere.

  $$ E_{H_0}[\text{Posterior Odds}] = \text{Prior Odds} \times E_{H_0}[BF] = \text{Prior Odds} \times 1 $$

  If $H_0$ is true, you cannot expect your evidence for $H_1$ to increase. For every trajectory of coin flips that drives the BF up (heads-heavy), there is a counter-balancing trajectory (tails-heavy) that drives the BF down toward zero.
  *   In the Frequentist case, "extreme" is defined by distance from the mean (two-tailed). Both heads-runs and tails-runs produce low p-values. The error accumulates.
  *   In the Bayesian case, evidence for $H_1$ requires a specific *direction* of deviation (towards $\theta=0.6$). A run of tails drives the BF toward 0, effectively "banking" safety against the heads-runs.

  ### 6. The Catch (and why Armitage wasn't entirely wrong)

  There is a caveat that preserves the spirit of Armitage's concern. The martingale property $E_{H_0}[BF] = 1$ holds only if the true data-generating process is exactly contained within the model space used to calculate the expectation.

  1.  **Prior Support:** If the true $\theta$ is $0.55$, but your $H_1$ is $\theta=0.6$ and $H_0$ is $\theta=0.5$, the BF is no longer a martingale under the truth. It will drift. However, it will drift toward the hypothesis *closest* to the truth (in terms of KL divergence). You still won't sample to a foregone conclusion of a *false* hypothesis, but you might converge on the "less false" one.
  2.  **Unbounded Loss:** Ville's inequality bounds the *probability* of being fooled, not the *expected loss* if your utility function is unbounded. If you bet your life on $H_1$ once $BF > 10^{100}$, you are safe because the probability of reaching that is $< 10^{-100}$. But technically, the expectation is still conserved.
  3.  **Calibration:** The Bayesian guarantee is conditional on the prior. If you assign Prior Odds of $1,000,000:1$ to $H_1$ arbitrarily, you can be fooled easily. The Frequentist guarantee is unconditional on priors but conditional on the stopping rule.

  ### Summary of the Asymmetry

  | Feature | Frequentist (Naive P-Value) | Bayesian (Posterior Odds) |
  | :--- | :--- | :--- |
  | **Quantity** | Tail probability of statistic | Likelihood Ratio (Bayes Factor) |
  | **Under $H_0$** | Random Walk (Drifts) | **Martingale** (Expectation = 1) |
  | **Optional Stopping** | Breaks error control (Error $\to$ 1) | **Preserves error bound** (Ville's Ineq.) |
  | **Why?** | Depends on sampling distribution of $\tau$ | Depends only on likelihood of observed $D$ |
  | **Intuition** | "Eventually you'll find a fluctuation" | "Expected evidence for falsehood is zero" |

  The Bayesian is not immune to being wrong, but they are immune to being *manipulated into certainty* by the timing of the observation. The "cost" of updating your belief is that you must also be willing to update it downward when the data contradicts you. The Frequentist p-value, by discarding the magnitude of the likelihood in favor of a tail area, loses the information required to penalize the "lucky" trajectories that haven't yet been counterbalanced by "unlucky" ones.
