answer: |-
  The coin-flip panelist was defending something real. It is not merely a preference dressed up as a principle; it is a defense of **procedural justice** and **moral equality**.

  While it is true that the *scientific* expected payoff is identical in both scenarios, the *moral* and *institutional* payoffs are not. The disagreement you witnessed touches on a deep philosophical distinction between **outcome fairness** (did the best project win?) and **procedural fairness** (was the decision made in a way that respected the candidates?).

  Here is exactly what the coin-flip panelist was defending, broken down into four distinct principles.

  ### 1. The Problem of Irrelevant Characteristics
  When merits are truly identical, there is no *relevant* reason to prefer Candidate A over Candidate B.
  *   **The Alphabetical Method:** This selects a winner based on a specific trait (their surname). Even if we agree that surnames are morally irrelevant to scientific ability, using a surname as the tie-breaker implicitly treats that trait as a *decision metric*. It says, "In the absence of merit, we will use your name." This is problematic because surnames correlate with ethnicity, culture, and history. Using them as a tie-breaker risks introducing systemic bias under the guise of neutrality.
  *   **The Coin Flip:** This selects a winner based on a mechanism external to *both* candidates. It does not privilege any trait belonging to the applicants. It acknowledges that since no characteristic of the applicants distinguishes them, no characteristic of the applicants should decide the outcome.

  ### 2. Ex-Ante Equality of Opportunity
  Since the panel agreed the proposals were of equal merit, the applicants have an equal moral claim to the funding.
  *   **The Alphabetical Method:** This grants a 100% probability of winning to one person and 0% to the other based on a lottery of birth (what name their parents gave them). It converts a tie in merit into a deterministic loss for one party based on an arbitrary fact.
  *   **The Coin Flip:** This preserves the equality of the tie by granting both parties an equal *ex-ante* probability (50/50). It respects the fact that their claims are equal by giving them equal chances, rather than adjudicating the tie in favor of one before the process begins.

  ### 3. Epistemic Humility and Legitimacy
  The method of tie-breaking sends a signal about the panel's confidence and integrity.
  *   **The Alphabetical Method:** This can appear bureaucratic and dismissive. To the losing applicant, it says, "You were equal to the winner, but we couldn't be bothered to use a method that acknowledged your equality." It risks looking like laziness masquerading as a rule.
  *   **The Coin Flip:** This is a public ritual of uncertainty. It signals, "These proposals are so equally excellent that only chance can distinguish them." This protects the legitimacy of the review process. It assures the loser that they were not rejected for a lack of quality, but simply lost a fair gamble. This is crucial for maintaining the trust of the research community.

  ### 4. The "Burden of Justification"
  In ethics, when we treat people differently, we usually bear a burden of justification.
  *   If you fund the "A" surname over the "B" surname, and the "B" applicant asks, "Why was I rejected?" the answer is, "Because your name starts with B." This is not a justifiable reason for withholding resources, even if it is a clear rule.
  *   If you fund the coin-flip winner, and the loser asks, "Why was I rejected?" the answer is, "Because chance dictated it, having recognized we could not distinguish your merit." This acknowledges the moral weight of the decision.

  ### Why it feels like a "Formality"
  The panelist who wanted to use alphabetical order was likely operating under a **utilitarian framework** focused solely on efficiency and outcome. From that narrow view, the cost of finding a coin and flipping it outweighs the benefit, since the scientific output is the same. They viewed the procedure as a mere tool to reach an end state.

  However, the coin-flip panelist was operating under a **deontological or contractualist framework**. They recognized that the *process itself* imposes duties on the funding body. The charity has a duty to treat applicants with equal respect. When merit cannot distinguish them, respect demands that the mechanism used to separate them does not rely on arbitrary personal traits.

  ### Conclusion
  The coin-flip panelist was defending the **integrity of the process** independent of the **value of the outcome**.

  In grant funding, the "product" is not just the research produced; it is also the maintenance of a fair, trustworthy ecosystem that encourages future applications. A coin flip preserves the moral equality of the applicants and the legitimacy of the panel. An alphabetical rule sacrifices that equality for the sake of administrative convenience.

  So, it was not empty formalism. It was a defense of the principle that **when we cannot distinguish between people based on merit, we must not distinguish between them based on identity.** The coin flip is the only tool that achieves that.
