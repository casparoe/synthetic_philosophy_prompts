answer: |-
  Thank you all for being here. For those of you who don't know me well, I'm the one in the family currently pursuing a PhD in philosophy. Apparently, that qualification, combined with being a grandchild, makes me the designated speaker. I've been told this is a "nice fit." To be honest, I find it genuinely terrifying. I know that in the back row, sitting near the aisle, are two men from Grandpa's old logic reading group. I know you're there, Bob and Jerry. I know you're grading this. I promise I won't misuse the modal operators.

  We are in a funeral home, not a church. Walt insisted on that. He wasn't a man who found comfort in what he called "sloppy religions." He didn't want vague sentiments or platitudes about God's mysterious plans. He wanted things to add up. He taught high school calculus for thirty years. His life's work was taking things that looked chaotic to teenagers and showing them that there was a structure underneath, a logic that held the world together. He believed that if you followed the chain of reasoning far enough, you wouldn't hit a wall. You'd hit a truth.

  For most people, a hobby is gardening or fishing. For Walt, it was Kurt Gödel. Now, most people who know Gödel know him for the Incompleteness Theorems—the idea that in any logical system, there are truths that can't be proven. But Walt wasn't interested in the math for the math's sake. He was interested in the letters Gödel wrote to his mother in 1961, after she asked him if she would see her loved ones again after death.

  Walt brought this up constantly. If you were at Thanksgiving and the conversation lulled, Walt would lean in and tell you that the world is demonstrably rational. It is ordered. It is not, as he loved to say, "a meaningless heap of atoms." And because it is rational, it cannot be fundamentally unjust. It would be irrational, a logical error, for a human being to spend eighty or ninety years developing a mind, a capacity for love, a curiosity about the universe, only to have that development cut off mid-sentence by death. In a rational world, a story like that demands a completion. Therefore, there must be a continuation.

  He picked this up from a book decades ago, and it became his theology. It wasn't about faith in the traditional sense. It was about a chain of reasoning he was ready to defend against anybody.

  But here is the thing about Walt's argument that I've been thinking about all week. It's easy to treat this as an abstract puzzle. It's easy to say, "Walt believed in an afterlife because he was a logical man." But that misses the heart of it. His argument didn't work by ignoring how unfinished his own life felt. It ran on that feeling.

  Walt wanted to do a PhD in logic himself. He had the mind for it. He had the passion for it. But money got in the way, and then kids got in the way, and then life got in the way. He spent thirty years teaching other people how to solve for *x*, while wondering what his own *x* might have been. It ate at him. I think he looked at his own life and saw a theorem that hadn't been fully proven. He saw the cuts and the compromises.

  If the world were just a heap of atoms, that regret would be the end of the story. You work hard, you sacrifice, you get old, you die, and the potential rots. That is the irrational outcome. Walt's logic was his way of insisting that the sacrifice wasn't the final draft. The regret was the premise. Because the life felt unfinished, the continuation had to be true.

  This became even more vital eight years ago, when Grandma died. Before that, Gödel's argument was a parlor trick, something to debate over coffee. After she died, it became a lifeline. He had a word for it, a German word he took straight from Gödel's letters: *Wiedersehen*. Seeing again.

  For the last eight years, *Wiedersehen* stopped being an abstract nice idea and turned into the thing he actually needed to be true. He wasn't hoping for harps or clouds. He was hoping for the restoration of a rational order where love isn't deleted by biology. He needed to know that the conversation with her wasn't terminated, just paused.

  So, I am not going to stand here and tell you that Walt is "in a better place," because he would roll his eyes at that. He didn't think place was the point. Continuation was the point. I am not going to smooth over the regret. I am not going to pretend he got to do everything he wanted to do in this life. He didn't. He left things unsaid, unsolved, and undone.

  But if Walt was right—and I know Bob and Jerry are nodding right now—if the world is truly rational, then those loose ends are not lost. They are just waiting for the next step in the proof.

  To his bridge buddies: he loved the game because it had rules, but he loved the people more because they broke them. To his family: he loved us not because we were perfect, but because we were his. And to his grandchildren: he wanted us to think clearly, but to feel deeply.

  Walt argued that a rational world couldn't let a person's development get cut off mid-way. I choose to believe him. Not just because I'm a philosopher, but because I'm his grandchild. I know how much work he put into being a good man. I know how much he loved Grandma. I know that a universe that allows for Walt, and for the love he carried, is a universe that wouldn't just snuff him out like a candle.

  We are here to mark an ending, but on Walt's logic, that's a contradiction. We are here to acknowledge a comma.

  Grandpa, you defended the rationality of the world until the end. You kept your side of the argument. We'll keep ours. We will miss you. We will grieve you. But we won't assume the book is closed.

  *Wiedersehen.*

  Thank you.
