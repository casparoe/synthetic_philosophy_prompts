      *   *Symbol Grounding Problem (Harnad, 1990):* Focuses on *connection to the world*. How do symbols get their meaning? If meaning is just defined by other symbols (dictionary definition), it's an endless loop. Symbols need to be "grounded" in sensory-motor experience. It's more of a cognitive science/engineering problem.
      *   *Key Difference:* CRA is about *inner experience/understanding* (phenomenology). SGP is about *reference/connection* (semantics/function).
      *   *Scenario: Solve SGP but not CRA:* A robot that interacts perfectly with the world (picks up apples when told "apple") but has no inner conscious experience (philosophical zombie). It grounds symbols sensorily, but Searle would say it still doesn't "understand" in the human sense.
      *   *Scenario: Solve CRA but not SGP:* This is harder. If you have intrinsic intentionality (conscious understanding), you usually have grounding. But maybe a disembodied spirit that understands "red" without eyes? Or perhaps Searle himself inside the room *does* understand Chinese (he understands English instructions), but the *system* doesn't ground the Chinese symbols. Actually, a better distinction: CRA argues computation *alone* isn't enough. SGP argues symbolic manipulation *alone* isn't enough.
      *   *Refinement:* The clearest distinction is: CRA targets *Strong AI* (claiming simulation = duplication). SGP targets *purely symbolic systems* (claiming symbols need non-symbolic anchor).
      *   *Solving One Not the Other:*
          *   *Solve SGP, Fail CRA:* A sophisticated robot with cameras and arms. It connects "cup" to visual data. Harnad is happy. Searle says: "But does it *feel* like anything to be that robot?" (No intrinsic intentionality).
          *   *Solve CRA, Fail SGP:* Harder to conceive. Maybe a human brain in a vat? It has understanding (CRA satisfied in a way), but no external grounding? No, the brain has prior grounding. Maybe a purely internal coherent semantic web that feels like understanding but refers to nothing real? That sounds like hallucination. Let's stick to the Robot vs. Simulation distinction.

  3.  **Task 2: LLMs and "Secondhand Grounding":**
