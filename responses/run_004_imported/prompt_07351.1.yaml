answer: |-
  This is an excellent observation, and it shows you are doing the kind of deep background research that leads to a standout term paper. It is very common for modern readers to react exactly as you have: seeing Sidgwick's involvement with the Society for Psychical Research (SPR) as a bizarre, embarrassing contradiction to his reputation for cold, hard rationality.

  However, to answer your question directly: **No, it is generally not considered a fair conclusion to dismiss the rigor of his ethical philosophy based on his psychical research.** In fact, most contemporary Sidgwick scholars argue the opposite: his interest in psychical research was not a lapse in judgment, but a **consistent extension of the same philosophical problems** that drove *The Methods of Ethics*.

  If you frame it as a "mark against his reputation," you risk committing a genetic fallacy (judging an argument based on its origin rather than its merit) and missing the profound philosophical motivation behind his actions.

  Here is the connection you should explore for your paper, which will likely impress your teacher far more than a simple critique of his credibility.

  ### 1. The Ethical Problem: The Dualism of Practical Reason
  To understand why a rigorous utilitarian would care about ghosts, you have to understand the crisis Sidgwick identified in *The Methods of Ethics*.

  Sidgwick identified a fundamental conflict he called the **"Dualism of Practical Reason."**
  *   **Rational Egoism:** It is rational to pursue my own happiness.
  *   **Utilitarianism:** It is rational to pursue the general happiness.

  In a perfectly moral universe, these two should align (i.e., being virtuous should lead to personal happiness). But Sidgwick, looking at the empirical world, saw that they often *don't* align. Sometimes, being moral requires great personal sacrifice with no earthly reward. If death is the end, the Rational Egoist has no ultimate reason to be a Utilitarian.

  Sidgwick resigned his Cambridge fellowship because he couldn't affirm the Anglican creed, leaving him without traditional religious comfort. He was a secular thinker who needed a secular reason to believe that "the good" would ultimately triumph.

  ### 2. Psychical Research as Empirical Theology
  This is where the SPR comes in. Sidgwick did not turn to psychical research because he was gullible or liked spooky stories. He turned to it because he hoped it could provide **empirical evidence for immortality.**

  *   **The Logic:** If science could prove that consciousness survives death (via mediums or telepathy), it would open the door to the possibility of divine justice in an afterlife.
  *   **The Goal:** If divine justice exists, then the conflict between Self-Interest and Duty can be resolved in the long run. Virtue *would* be rewarded, just not necessarily in this life.
  *   **The Method:** Sidgwick approached this exactly as he approached ethics: with extreme skepticism. He did not "believe" in séances. He investigated them to see if they could withstand scientific scrutiny. He famously exposed many frauds himself. He was looking for a "residue" of evidence that could not be explained by trickery.

  In this light, his psychical research wasn't a departure from his philosophy; it was an attempt to **save** his philosophy. He was trying to find a scientific foundation for the moral order of the universe that religion used to provide.

  ### 3. Consistency of Method, Not Lapse of Judgment
  Your inclination is to view the SPR work as a failure of rigor. However, historians of philosophy (such as Bart Schultz, author of the definitive biography *Henry Sidgwick: Eye of the Universe*) argue that it demonstrates his **commitment to empiricism.**

  Sidgwick lived in the Victorian era, a time of massive tension between science and religion. Darwin had challenged biological design; higher criticism had challenged the Bible. Sidgwick refused to accept religious dogma without evidence (hence resigning his fellowship), but he also refused to accept materialist dogma (that death is the end) without evidence.

  He treated the question of immortality as an **open empirical question.** From his perspective, dismissing the possibility of telepathy or survival out of hand would be just as dogmatic as affirming it on faith. He was willing to follow the evidence wherever it led, even if it led to the fringes of science. That is consistent with the intellectual honesty he displayed in his ethical work.

  ### 4. How to Frame This in Your Paper
  Instead of using this to undermine Sidgwick, use it to deepen your analysis of his utilitarianism. Here is a suggested framing:

  *   **Don't say:** "Sidgwick was a rigorous philosopher, but he ruined his reputation by chasing ghosts."
  *   **Do say:** "Sidgwick's involvement in psychical research reveals the depth of his commitment to resolving the 'Dualism of Practical Reason.' Unable to accept religious dogma, yet unwilling to accept a universe where virtue and happiness are permanently disconnected, Sidgwick sought empirical proof of a moral order beyond the grave. While his investigations did not yield the proof he hoped for, they demonstrate that his utilitarianism was not just a calculation of pleasures, but a desperate search for a rational foundation for morality itself."

  ### Summary
  If you argue that his SPR work makes his ethics untrustworthy, you are essentially saying, "He was wrong about X, so he must be wrong about Y." But in Sidgwick's case, X (psychical research) was pursued *in service of* Y (ethics).

  Acknowledging this connection shows you understand that Sidgwick's utilitarianism isn't just about "the greatest happiness," but about the **rationality of morality** in a potentially godless universe. That is a much more sophisticated thesis for a term paper, and it treats Sidgwick with the same intellectual honesty he treated his own work.
