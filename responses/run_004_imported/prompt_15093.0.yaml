      *   *Answer to (4):* Focus on the **scope of moral vocabulary**. Human moral language is indexed to human epistemic situations. We can truthfully say "This was unjustified" meaning "No *available* justification exists," without denying a transcendent one. Or, distinguish between *wrong-making features* (which we see) and *all-things-considered justification* (which we don't).

  6.  **Refining the Analysis (Self-Correction during drafting):**
