          *   *Nuance:* Douglass wasn't a strict constructionist in the modern conservative sense. He believed the *purpose* of the Reconstruction Amendments was to revolutionize the federal system to protect rights. He used the text as a weapon *for* liberation, not as a shield *against* it.

      *   **Data Point 2: "What the Black Man Wants" (1865).**
