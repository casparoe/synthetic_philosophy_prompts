      *   **Transparency & Legitimacy:** A coin flip is visibly random. Alphabetical looks like a rule but functions as a hidden bias.
      *   **Respect for Candidates:** Treating them as equals requires an equal chance, not a rule that advantages one based on an irrelevant trait (name).
      *   **Decision Hygiene:** Acknowledging the tie explicitly prevents future "second-guessing" or pattern recognition (e.g., if "Smith" always wins over "Zhang" due to alphabet, people notice).

  7.  **Drafting the Response:**
