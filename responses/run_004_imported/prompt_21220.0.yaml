      *   The "expected payoff" (scientific output) is identical, so the distinction lies in *process* rather than *outcome*.
      *   Key concepts: Procedural Justice, Equality of Opportunity, Bias Mitigation, Transparency, Moral Luck.

  3.  **Evaluate Option A (Coin Flip/Randomization):**
      *   *Pros:* Explicitly acknowledges uncertainty/equality. Removes hidden bias. Treats candidates as truly equal. Transparent mechanism.
      *   *Cons:* Can feel arbitrary or irresponsible to laypeople ("you gambled our money?").
      *   *Philosophical underpinning:* Buridan's Ass (sort of), but more importantly, *procedural fairness*. If $A = B$, then $P(A) = P(B) = 0.5$.

  4.  **Evaluate Option B (Alphabetical/Arbitrary Rule):**
      *   *Pros:* Fast, deterministic, easy to document.
      *   *Cons:* Systemic bias (names correlate with ethnicity/culture). Implicitly values one candidate over the other without justification. Creates a false hierarchy.
