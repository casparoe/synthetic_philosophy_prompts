answer: |-
  **Setting:** *A dimly lit lecture hall at a university. The chalkboard behind the podium is covered in formal notation regarding biconditionals and normative operators. DR. ARIS (the speaker) stands at the podium, gathering her notes. ALEX (the PhD student) approaches the microphone in the aisle.*

  **Alex:** Thank you for the talk, Dr. Aris. Your defense of the Fitting-Attitude analysis was compelling, particularly the way you handled the extensionality objections. But I'm worried the intensional problem remains fatal. You claim that for $X$ to be good is just for there to be sufficient reason to favor $X$. But as you know, the demon case seems to sever that link. If a demon threatens to torture us unless I admire this saucer of mud, I have overwhelming reason to admire it. Yet, the mud remains worthless. If your analysis holds, the mud becomes good simply because I have reason to favor it. How do you block this without abandoning the reductive ambition?

  **Dr. Aris:** Thank you, Alex. It's the classic objection. The standard move, which I endorse, is to distinguish between the *Right Kind* of reasons (RKRs) and the *Wrong Kind* of reasons (WKRs). The demon provides a reason to *bring it about* that I admire the mud, or a reason to *want* to admire it, but not a reason that counts in favor of the mud itself. The FA analysis is restricted to RKRs. So, the mud isn't good because the demon's threat is the wrong kind of reason.

  **Alex:** But that just pushes the question back. How do you distinguish the kinds? The standard proposal is that RKRs are "object-given"—they cite properties of the mud—while WKRs are "state-given"—they cite properties of holding the attitude. But consider this: Suppose the demon threatens me *because* the mud is muddy. He hates mud. Now the reason cites a property of the object—its muddiness. By your criterion, that looks like an RKR. But intuitively, it's still the wrong kind. The mud isn't admirable just because it's muddy and a demon hates mud. So, the object/state distinction fails.

  **Dr. Aris:** Agreed. The object/state distinction is too coarse. We need something more principled. I propose we look at the *constitutive aim* of the attitude. Admiration aims at tracking admirability. A reason is of the right kind only if it bears on whether the object satisfies the constitutive standards of the attitude. The demon's threat bears on the *prudence* of admiring, not on whether the object meets the standard for admiration.

  **Alex:** Here's where I worry you're begging the question. You say RKRs bear on whether the object satisfies the "constitutive standards" or is "admirable." But if "admirable" just means "good," and "good" is what we're trying to analyze in terms of reasons, you're defining the right kind of reasons as "those that make the object good." That's circular. You're using the notion of value to filter the reasons, which you were supposed to be analyzing *in terms* of reasons. How do you identify the constitutive standards without smuggling in the very value property you're trying to reduce?

  **Dr. Aris:** It's not circular if the constitutive standards are formal, not substantive. Think of belief. Belief aims at truth. I can't believe $p$ because it would make me happy; that's the wrong kind of reason. Why? Because happiness doesn't bear on the truth of $p$. Similarly, admiration has a formal object. We can identify the formal object of admiration—say, excellence or virtue—without committing to a substantive theory of value yet. The demon's threat doesn't make the mud excellent. So we can filter WKRs by checking if they relate to the formal object, not the value itself.

  **Alex:** But why think admiration has a fixed formal object like excellence? If I admire the mud to save the world, isn't the mud, in that context, functioning *as* a source of salvation? That looks like a kind of excellence. More pressingly, if you fix the formal object independently of value, you risk misclassifying cases. Suppose there's a reason to favor something that doesn't fit your pre-theoretical notion of "excellence" but *does* make it good. If your formal object filter blocks that reason, your analysis tells us the thing isn't good, even though there's a valid reason to favor it. You've let your prior theory of the attitude dictate the extension of value.

  **Dr. Aris:** That's a fair worry. But consider the alternative. If we allow WKRs into the analysis, we lose the normativity of value. Value is supposed to *command* our favor, not just be instrumentally linked to it. If the demon case makes the mud good, then "good" loses its connection to what is *worthy* of favor. I'm willing to accept a mild circularity if it preserves the normative force. Perhaps the analysis isn't reductive in the strict sense, but elucidatory. It tells us the structure of value, even if it relies on a primitive notion of fittingness to sort the reasons.

  **Alex:** But if you rely on a primitive notion of fittingness to sort the reasons, haven't you abandoned the "Reasons First" project? You started by saying "to be good just is to have reason." Now you're saying "to be good is to have the right kind of reason, where 'right' is determined by fittingness." That makes fittingness prior to reasons, or at least co-primitive. So reasons aren't doing all the work.

  **Dr. Aris:** Not necessarily. We can say that RKRs are those reasons that are *deliberatively accessible* as grounds for the attitude. When I deliberate about whether to admire the mud, can I genuinely weigh the demon's threat as a ground for *admiration*? No. I can weigh it as a ground for *acting to induce* admiration. The phenomenology of deliberation marks the boundary. WKRs fall outside the scope of what can be a premise in the reasoning that concludes in the attitude.

  **Alex:** I'm skeptical that phenomenology can bear that much weight. From the first-person perspective, the demon's threat is a perfectly good reason to get myself into the state of admiration. I might say, "I must find a way to admire this." If I succeed, isn't the reason part of the causal explanation of the attitude? And if reasons are just considerations that count in favor of an action or attitude in deliberation, the demon's threat counts in favor. By restricting "reasons" to only those that feel like they track intrinsic properties, you're building a substantive theory of value into the definition of a reason. You're essentially saying, "A reason is a consideration that tracks value." But then your analysis says, "X is good iff there is a consideration that tracks value." That's a tautology, not an analysis.

  **Dr. Aris:** I deny it's a tautology because "tracking value" isn't the definition of the reason; it's the *effect* of the reason being of the right kind. Look, Alex, the WKR problem shows that not all normative pressure is value-constituting. My claim is that value is constituted only by the normative pressure that flows from the object's properties to the attitude. The demon's pressure flows from the consequences of the attitude to the agent. That structural difference is real and doesn't presuppose value. It presupposes direction of fit.

  **Alex:** But as I mentioned earlier, attitudes like admiration aren't belief. They don't have a simple mind-to-world direction of fit. They are conative. They try to change the world or align the world with the mind. If admiration is conative, then consequences of holding the attitude *are* relevant to its success conditions. If the success of my admiration includes saving the world, the demon's threat becomes relevant to the *correctness* of the attitude in a broader sense. If you rule that out, you aren't analyzing our concept of "good." You're analyzing a technical concept of "intrinsic merit." And sure, the mud lacks intrinsic merit. But maybe "good" is broader than "intrinsic merit." If so, your analysis is revisionist.

  **Dr. Aris:** *(Pauses, tapping the chalkboard)* If I accept that "good" might be broader, I lose the tight connection between value and worthiness. But I hear your point. Perhaps the solution isn't to filter the reasons, but to refine the attitude. Maybe the FA analysis shouldn't be "Reason to Favor," but "Reason to Favor *for its own sake*." The demon gives me reason to favor the mud *for the sake of* survival. That's instrumental.

  **Alex:** Now we're getting somewhere. But "for its own sake" is notoriously slippery. If I admire the mud to save the world, am I not valuing the admiration for its own sake, as a means to an end? Or am I valuing the mud? It seems I'm treating the mud as a tool. But if the analysis requires "favoring for its own sake," aren't you just defining value as "that which is valuable for its own sake"?

  **Dr. Aris:** *(Smiles slightly)* Touché. It seems we are caught between a circle and a triviality.

  **Alex:** It seems so. Unless you can specify the "Right Kind" without using normative terms like "fitting," "worthy," or "for its own sake," the analysis doesn't reduce value to reasons. It just maps one normative concept onto another.

  **Dr. Aris:** Or, perhaps it shows that reasons and value are mutually dependent, and the project of reducing one to the other is the mistake. But that would require rewriting the last ten years of my work.

  **Alex:** *(Glances at the moderator)* Well, we certainly wouldn't want to do that. Thank you, Dr. Aris.

  **Dr. Aris:** Thank you, Alex. I think I need to rethink the deliberative constraint.

  *(The moderator steps in as the audience applauds politely.)*
