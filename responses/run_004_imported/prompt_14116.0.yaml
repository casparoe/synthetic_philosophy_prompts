      *   Check that the specific prompt requirements (Joshua 10, instrumentalism, parallax/proof) are hit explicitly.
      *   *Key nuance:* Bellarmine's letter to Foscarini is the primary source inspiration. I need to echo its logic: "If there were a true demonstration... then we should proceed with great caution in interpreting Scripture."

  7.  **Final Review against constraints:**
