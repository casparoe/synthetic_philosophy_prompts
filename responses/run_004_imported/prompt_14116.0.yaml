answer: |-
  **Rome, 1615. The private study of Cardinal Robert Bellarmine.**

  **Characters:**
  *   **Robert Bellarmine:** Cardinal of the Catholic Church, theologian, and philosopher. Calm, precise, deeply read in both Scripture and the natural philosophers.
  *   **Galileo Galilei:** Mathematician and Philosopher to the Grand Duke of Tuscany. Intense, brilliant, gesturing often, convinced of the physical reality of the Earth's motion.

  *[The room is lined with books. A telescope rests on a side table. Bellarmine pours two cups of wine. Galileo stands by the window, looking restless.]*

  **Bellarmine:** Signor Galileo, please. Sit. The wine is decent, though I suspect you prefer the waters of Tuscany. We are not here as inquisitor and accused. We are two scholars looking at the same book of Nature, and the same book of Scripture, trying to reconcile the bindings.

  **Galileo:** *[Taking the cup]* Your Eminence is too kind. But you know why I am here. The rumors fly faster than light. They say the Holy Office intends to condemn the motion of the Earth as heresy.

  **Bellarmine:** Rumors are the currency of the marketplace, not the Vatican. I wrote to Father Foscarini recently to clarify the Church's position. I wish to clarify it to you, directly. There is a distinction to be made, Galileo, between speaking *ex hypothesi* and speaking *in truth*.

  **Galileo:** A distinction I have heard from the Peripatetics for thirty years. They say astronomy is merely a calculation device. "Save the appearances," they say. But my telescope, Eminence, does not show me calculations. It shows me things. The moons of Jupiter are not a calculation. They are wandering stars orbiting a center that is not the Earth. The phases of Venus show it circles the Sun. These are physical realities.

  **Bellarmine:** I do not deny your eyes, Galileo. I have seen the drawings. The Church does not reject observation. But consider this: Does the phases of Venus *necessitate* that the Earth moves?

  **Galileo:** It necessitates that Venus circles the Sun.

  **Bellarmine:** Precisely. But Tycho Brahe's system allows Venus to circle the Sun, while the Sun itself circles a stationary Earth. Mathematically, Copernicus and Tycho are nearly identical in their predictions. If the appearances are saved by both, on what grounds do you claim Copernicus describes the *physical furniture* of the universe, while Tycho describes only a calculation?

  **Galileo:** Because Copernicus is simpler! Nature does not delight in complexity. In Tycho's system, the sphere of the fixed stars must spin wildly every twenty-four hours to account for day and night. In mine, the Earth turns. It is more economical.

  **Bellarmine:** Economy is a philosophical preference, not a demonstration. If I claim the Earth moves, I must answer the physical objections. If a stone is dropped from a tower, why does it fall straight down? If the Earth spins at the speed you suggest, the stone should be left behind. You have no physics to explain why it is not.

  **Galileo:** I am working on the tides. The motion of the seas is the sloshing of water caused by the Earth's rotation and orbit. That is the proof!

  **Bellarmine:** *[Gently]* Many astronomers dispute that mechanism. But let us grant, for the sake of argument, that your system is more elegant. Is it *demonstrated*? Is there stellar parallax? If the Earth orbits the Sun, the stars should shift their position relative to one another over the year.

  **Galileo:** *[Shifts in his seat]* The stars are... immensely distant. The shift is too small for our instruments.

  **Bellarmine:** Then it is not demonstrated. It is a hypothesis. A probable one, perhaps. Even a highly persuasive one. But in natural philosophy, probability is not certainty. And here lies the crux, Galileo. If you speak only as a mathematician, proposing a hypothesis to calculate planetary positions, the Church has no quarrel. You save the appearances.

  **Galileo:** But I cannot speak only as a mathematician! If the Earth moves, it *moves*. It is not a fiction. To tell me to treat the truth as a mere tool is to ask me to lie.

  **Bellarmine:** To claim certainty where there is only probability is the lie. And this brings us to Scripture. You argue that passages like Joshua 10—where the Sun stands still—must be reinterpreted. You cite Augustine, that the Holy Spirit did not intend to teach us how the heavens go, but how to go to heaven.

  **Galileo:** Exactly! Augustine warns us against interpreting Scripture literally on matters of nature when it might make us look foolish to non-believers. If the Earth moves, Joshua's "Sun standing still" is phenomenological language. It describes how it *appeared* to Joshua, not the physics of the event.

  **Bellarmine:** I know Augustine as well as you, Galileo. Better, perhaps. And I agree with his principle of accommodation. *If* the science is certain, we must reinterpret the Scripture. The Holy Spirit and Nature cannot contradict, for both come from God.

  **Galileo:** Then where is the disagreement?

  **Bellarmine:** The condition, Galileo. The *if*. Augustine says we reinterpret Scripture when the truth of the matter is *demonstrated beyond doubt*. If a man proves to me that the Earth moves, I will be the first to argue that Joshua spoke in appearances. But you have not proven it. You have offered a hypothesis that fits the data better than the old one, but which still lacks a physical mechanism and lacks the parallax.

  **Galileo:** So I must wait? While the truth is in front of us?

  **Bellarmine:** You must wait until you have a demonstration. Do you understand the risk? If the Church reinterprets Joshua based on your theory, and then ten years from now, a new astronomer finds a flaw in the Copernican physics—or finds the parallax is absent entirely—then the Church looks foolish. We look like we changed the Word of God for a theory that turned out to be false.

  **Galileo:** But the theory is true! I feel it in my bones. The tides, the sunspots, the Jupiter moons—it is a coherent system. The Aristotelian crystal spheres are shattered.

  **Bellarmine:** Coherence is not demonstration. You ask us to move Scripture on the basis of a system that cannot yet explain why a falling stone lands at the base of the tower. You ask for a theological revolution based on a physical probability.

  **Galileo:** *[Leans forward]* Then what is the path? Must we blind ourselves?

  **Bellarmine:** No. Write. Discuss. Propose Copernicus as the strongest hypothesis available. Say, "If the Earth moves, then this follows." But do not assert it as dogma. Do not claim it is physically proven when the physicists—Aristotelian or otherwise—can still poke holes in the vessel.

  **Galileo:** And if I believe it is proven?

  **Bellarmine:** Then you must recognize that your proof is not universal. You see the conclusion clearly; others do not. In matters of faith, we cannot act on private conviction against the common understanding of the Fathers unless the necessity is absolute. There is no absolute necessity yet.

  **Galileo:** *[Sighs, looking at the telescope]* So I am to hamstring my own work. To speak in riddles. "The Earth moves, but perhaps it doesn't."

  **Bellarmine:** You are to speak with the precision of a philosopher. "The evidence suggests," not "The Scripture is wrong." There is a difference between humility before God's Word and humility before Nature. You have shown great courage before Nature, Galileo. I ask for a measure of caution before Scripture, until Nature speaks with a louder voice.

  **Galileo:** And if that voice never comes? If the parallax is forever too small?

  **Bellarmine:** Then we remain with Tycho, and the Earth remains at rest, and no harm is done to the Faith. But if you are right, and one day the proof is found... *[Bellarmine smiles faintly]* ...then we shall read Joshua differently, and we will thank you for your patience. But until then, Signor Galileo, you ask us to tear down a wall without knowing if there is a house on the other side.

  **Galileo:** *[Stands, taking his cup]* You argue for the safety of the Church, Eminence. I argue for the integrity of the truth.

  **Bellarmine:** And I argue that truth cannot be served by claiming certainty where there is none. That is not science. That is dogma of a different sort.

  **Galileo:** *[Pauses at the door]* I will write as I see. But I hear you, Cardinal. You do not fear the truth. You fear error.

  **Bellarmine:** In theology, Signor Galileo, error is the only sin. Prove it, and the Bible will bend. Until then, the hypothesis must stand still.

  *[Galileo nods, a tight, unresolved gesture, and exits. Bellarmine remains, looking at the telescope, then turns back to his books.]*
