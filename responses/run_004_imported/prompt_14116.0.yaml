  *(Self-Correction Note)*: I need to make sure Galileo doesn't sound like he *knows* he lacks proof. He *thought* he had proof (tides). Bellarmine needs to point out why the tides argument fails physically. This highlights the "no stellar parallax" and "physics of motion" gap.

  Let's write it.

