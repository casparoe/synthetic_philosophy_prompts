answer: |-
  The technician, a woman with eyes like polished obsidian, adjusted the halo around Elias's skull. "The goal isn't sleep," she said, her voice sounding as if it came from inside his own throat. "Sleep implies a body resting. We want the observer without the observed. When the bridge drops, don't try to build it back."

  "Bridge?" Elias asked. His tongue felt thick.

  "Proprioception. The map your brain draws of your flesh. We are erasing the map, not the territory. You will still be there. But you won't be *here*."

  The induction was not a fading out, but a severing. It felt less like closing his eyes and more like the universe had been cut away from around him, leaving only the point of the cut. There was no darkness, because darkness is the sight of nothing, and he did not have sight. There was no silence, because silence is the absence of sound, and he did not have ears.

  There was only *was*.

  He existed. This was not a conclusion he reached, not a deduction like *I think, therefore I am*. It was a primitive fact, heavier than gravity, brighter than light. He was a center of awareness floating in a null-set.

  He waited for the panic. In the briefing, they had warned of somatic phantom pains, the brain screaming for data that wasn't there. But there was no brain to scream. There was no head to hold the pain.

  *Where are my hands?* he thought.

  The question formed clearly, but it hit no resistance. He searched for the concept of a hand. He knew the word. He knew he had possessed them minutes ago, or years ago—the timeline was slippery. But in this white void of being, a "hand" was an abstract geometry, like a hexagon or a hypothesis. He could not summon the feeling of a fist. He could not verify if his arms were crossed or spread wide. He could not verify if he had arms at all.

  Avicenna would have nodded. *See?* the old philosopher might have whispered from the void. *You affirm yourself without affirming the limb. Therefore, you are not the limb.*

  Elias affirmed it. He was undeniably present. The "I" was a sharp, hard diamond in the nothingness. But as the minutes stretched into an eternity of the immediate now, a different realization began to press against the diamond.

  If he was not his body, he was also not his history.

  Memories of a childhood home, of a lover's face, of the drive to the lab—these were all tagged with sensory data. The smell of rain, the weight of a steering wheel, the warmth of skin. Without the capacity to simulate sensation, those memories were unreadable files. He knew they belonged to him, but he could not inhabit them. He was a self stripped of its context.

  He tried to move.

  *I will lift my right arm.*

  The command issued from the center of the diamond. It traveled outward and found no purchase. There was no resistance, no weight, no failure. Just a command echoing into a vacuum. He realized then that agency required friction. To act is to push against the world. To push, you need a surface.

  He was a Flying Man who could not fly, because flight implies a direction, and direction requires a coordinate system. He had no up, no down, no forward. He was pure subjectivity with no object to subjectify.

  The isolation was not lonely, because loneliness implies a desire for another. It was absolute. It was the taste of existence before it is flavored by biology.

  *Is this the soul?* he wondered. *Is this the immortal part?*

  It felt less like immortality and more like irrelevance. A camera lens floating in space, capturing no light. He understood now why the ancients feared the disembodied state. It wasn't that the self died without the body. It was that the self became a tautology. *I am I.* A circle with no area.

  He tried to anchor himself. *I am Elias.*

  The name hung there, unmoored. Without a voice to speak it, without an ear to hear it, "Elias" was just a soundless shape. He realized that his identity was not the diamond of awareness, but the setting that held it. The scars, the hunger, the fatigue, the specific ache in his left knee—those were not distractions from the self. They were the definition of it.

  The "Flying Man" argument proved he was distinct from his body. It did not prove he was *complete* without it.

  He hovered in the affirmation of his own existence, and for the first time, he found it insufficient. To be was not enough. He wanted to *be somewhere*. He wanted to be *someone*.

  Then, the rush.

  It wasn't gradual. The map slammed back into place. Gravity returned as a crushing weight. The itch on his nose was a blazing star. The hum of the ventilation system was a roar. He gasped, and the air was cold and sharp in lungs he suddenly remembered he had.

  He opened eyes he didn't know were closed. The lab was blindingly bright. He looked down at his hands, resting on the armrests of the chair. They looked like tools he had been allowed to borrow.

  The technician was checking a monitor. "Vitals stabilized. Cortical mapping reconnected. How was the null state?"

  Elias flexed his fingers. The tendons moved under the skin, a complex mechanical system he was piloting from the inside. He felt a profound sense of intrusion, as if he were wearing a suit of wet meat that didn't quite fit.

  "I was there," Elias said. His voice sounded rough, foreign in his own throat. "I know I'm not this." He gestured vaguely at his torso.

  "Most subjects report a sense of liberation," the technician said, unclipping the halo. "The burden of the flesh lifted."

  "No," Elias said. He stood up, his legs trembling, relearning the physics of balance. He looked at his reflection in the darkened monitor. The face staring back was familiar, but the connection felt theoretical. He knew that face was his, just as he knew the concept of a hand.

  "It wasn't liberation," Elias said, touching his own cheek. The skin was warm. The sensation was a miracle. "It was proof."

  "Proof of what?"

  "That I'm separate," he said. He watched his hand rise to meet his face. He commanded it, and it obeyed, but the gap between the command and the movement felt infinite. "But being separate means you can be left behind."

  He walked toward the door, feeling the floorboards through his shoes. He focused on the pressure, the friction, the ache in his heel. He clung to the limitations. He clung to the boundary where his skin ended and the air began.

  If the self was a ghost, he decided, it was a ghost that needed a haunting. Without the house, without the creaking floor and the cold draft, the ghost was nothing but a memory of a shape. He opened the door and stepped out into the hallway, careful to feel the frame brush his shoulder, needing the resistance to prove he was still there.
