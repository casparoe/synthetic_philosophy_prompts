answer: |-
  This is one of the most spirited and methodologically fascinating debates in modern psychology. Your sister is describing a phenomenon that sits right at the fault line between **Embodied Cognition** (specifically "Action-Specific Perception") and **Traditional Vision Science**.

  The short answer is: **The "Bias/Judgment" camp currently holds the stronger scientific position,** but the "Perception" camp forced a necessary revolution in how we think about vision. However, distinguishing the two is notoriously difficult, and there *are* principled ways to test it, though they require moving beyond the methods your sister intuitively described.

  Here is the breakdown of the battle lines, the current consensus, and how you can actually tell the difference.

  ### The Two Camps

  **1. The Action-Specific Perception Camp (Dennis Proffitt et al.)**
  *   **The Theory:** Vision is not a camera; it is a tool for action. Therefore, the visual system evolved to encode spatial layout in terms of *behavioral potential*. A hill isn't just an angle; it is an energy cost.
  *   **The Claim:** When you are tired, wearing a heavy backpack, or out of shape, your physiological resources are depleted. Your visual system automatically scales the environment to reflect this. The hill *literally* looks steeper (the optical slant is perceived differently) to dissuade you from expending energy you don't have.
  *   **The Evidence:** Early studies showed that people wearing heavy backpacks estimated slopes as steeper than those without. Crucially, they argued this held true even in **haptic matching tasks** (tilting a board by hand to match the slope without looking), which should bypass verbal bias.

  **2. The Response Bias Camp (Frank Durgin et al.)**
  *   **The Theory:** Perception is largely veridical (accurate). The visual cortex processes geometry reliably. What changes is the *judgment* or the *reporting* of that perception.
  *   **The Claim:** This is a "demand characteristic" problem. Participants in experiments guess the hypothesis ("Oh, I'm wearing a heavy backpack, they probably want me to say the hill is steeper"). Even in haptic matching, participants might be matching the *posture* required to stand on the hill or the *effort* they feel, rather than the visual angle.
  *   **The Evidence:** When researchers use deception (hiding the true purpose of the study) or more rigorous controls, the effect size shrinks drastically or disappears. Durgin demonstrated that if you warn participants not to let their fatigue influence their estimate, the effect often vanishes.

  ### Which Side is Winning?

  As of the last decade, the **Response Bias/Judgment camp has gained the upper hand.**

  There have been several high-profile replication failures regarding the action-specific perception claims. Meta-analyses suggest that while the effect exists in some contexts, it is far smaller than originally claimed and is heavily dependent on the method of measurement.

  The "haptic matching" defense (which your sister mentioned) has been particularly battered. Critics argue that when you ask someone to tilt a board to match a hill, they aren't accessing a raw visual signal; they are making a cognitive translation. If I am tired, I might tilt the board steeper not because the hill *looks* steeper, but because I am conceptually linking the board to the *effort* of the hill.

  ### Is There a Principled Way to Tell?

  This is the million-dollar question. How do we distinguish "my retina/V1 is processing a steeper angle" from "my prefrontal cortex is deciding to report a steeper angle"?

  Yes, there are three methodological approaches that attempt to bypass the bias problem:

  **1. Implicit Measures (Physiology over Report)**
  If perception is actually altered, it should show up in early visual processing, not just decision-making.
  *   **Pupil Dilation:** Cognitive load and perceptual difficulty can dilate pupils. If a hill causes greater pupil dilation in tired runners independent of their verbal report, that suggests a perceptual load.
  *   **Neural Imaging (fMRI/EEG):** If the hill *looks* different, activity in the primary visual cortex (V1) or parietal reach regions should change. If the activity only changes in areas associated with decision-making or value judgment (like the anterior cingulate), it's a cognitive bias. Most evidence currently points to the latter.

  **2. Two-Alternative Forced Choice (2AFC)**
  Verbal estimates ("What percent grade is this?") are easy to bias. Comparative judgments are harder.
  *   **The Test:** Show the tired runner two slopes side-by-side (or sequentially). Ask: "Which one is steeper?"
  *   **The Logic:** It is much harder for a participant to strategically game a relative judgment than an absolute estimate. If the hill *truly* looks steeper, they should consistently pick the fatiguing slope as steeper even when the angles are identical. Most studies using strict 2AFC protocols find little to no effect of fatigue on the actual discrimination threshold.

  **3. Visuomotor Dissociation**
  This is the strongest test.
  *   **The Test:** Ask the runner to *throw* a beanbag at the top of the hill or reach for a target on the slope.
  *   **The Logic:** Motor planning is often unconscious. If perception is altered, their throw should overshoot or undershoot based on the perceived slant. However, research shows that while people *say* the hill is steeper, their throwing accuracy often remains veridical. This suggests a dissociation: the **explicit judgment** changes (the narrative), but the **implicit visuomotor system** remains accurate.

  ### The Verdict for Your Sister

  Scientifically, it is most likely that your sister's visual system is **not** optically distorting the hill. Her V1 is likely processing the angle correctly. What is happening is a **cognitive integration of effort and sensation.**

  However, telling her "it's all in your head" is unhelpful and arguably philosophically shallow. In the context of running, the distinction between "seeing" and "judging" is functionally irrelevant.

  The brain creates a unified model of the world for the organism to survive. If that model integrates fatigue signals to produce a "steepness" experience that discourages climbing, the *outcome* is the same whether it happens in the retina or the prefrontal cortex. To her nervous system, the hill *is* steeper, because the cost-benefit analysis of the hill has changed.

  **Summary:**
  *   **Stronger Argument:** The "Response Bias" camp (Durgin) has the stronger empirical case currently.
  *   **Principled Distinction:** Use implicit physiological measures (pupils/brain waves) or forced-choice motor tasks rather than verbal estimates.
  *   **Practical Truth:** Your sister isn't lying, and she isn't crazy. Her brain is accurately reporting that the *cost* of the hill has increased, and it is using the language of vision ("it looks steeper") to communicate that cost. She is narrating her exhaustion in visual language, but to her conscious experience, that narration *is* her vision.

  If you want to read the primary source material, look for the debate between **Dennis Proffitt** (University of Virginia) and **Frank Durgin** (Swarthmore College). Their back-and-forth papers from 2009–2015 essentially map the entire controversy you've stumbled upon.
