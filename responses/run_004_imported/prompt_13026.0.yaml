      *   **The Connection:** Quine often derives IoR *from* IoT in *Word and Object*. But in "Ontological Relativity," he uses the proxy function to show IoR applies even to our *own* language (ontological relativity).
      *   **The Independence Claim:** IoT is about *evidence underdetermining theory* (behavioral data $\nrightarrow$ unique manual). IoR is about *reference being relative to a background theory* (even if the theory is fixed/unique, reference is only defined relative to it). The proxy function shows IoR holds even if IoT were false (i.e., even if there were a unique correct manual, reference would still be inscrutable relative to proxy transformations).

