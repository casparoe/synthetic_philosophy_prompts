answer: |-
  First off: send help received. *On Certainty* is notoriously slippery, and sections 96–99 are arguably the most fought-over pages in the whole book. You and Leah have stumbled directly into the central tension of Wittgenstein's late epistemology.

  The good news is that you aren't actually disagreeing as much as you think; you're just focusing on different axes of the same metaphor. The bad news is that Wittgenstein deliberately left this ambiguous to avoid traditional philosophical traps.

  Here is the unpacking you need to settle the bet (or at least agree to disagree productively).

  ### 1. The River-Bed Metaphor: What is it doing?
  Wittgenstein is trying to steer a middle course between **Foundationalism** (there are eternal truths that support everything else) and **Coherentism/Skepticism** (everything is just floating beliefs that could all change at once).

  *   **The Water (Fluid Propositions):** These are ordinary empirical claims ("It is raining," "This is a hand"). They flow, they are tested, they can be true or false.
  *   **The Bed (Hardened Propositions):** These are the hinges ("The earth has existed for many years," "I have two hands"). They don't get tested; they are the *channels* through which the water flows. They determine what counts as a reasonable test.

  **The Hard Rock vs. Sand (Section 99):**
  This image is crucial for your specific dispute.
  *   **Your point (The User):** Wittgenstein explicitly says part of the bank is "hard rock, subject to no alteration." You are right that he is insisting that *for a language game to function*, some things must be held fast. If everything were sand, the river would flood and cease to be a river. Functionally, there must be stability.
  *   **Leah's point:** Wittgenstein says the bed *can* shift. Sand gets washed away. Even rock erodes eventually. She is right that he refuses to grant these propositions *metaphysical* immunity. They aren't "True" with a capital T; they are just "held fast."

  **The Verdict on the Image:** The image is designed to show **stability without permanence**. You are focusing on the *synchronic* state (how the river looks right now: distinct bed vs. water). Leah is focusing on the *diachronic* state (how the river looks over centuries: the bed moves).

  ### 2. Kind vs. Degree: The Core Dispute
  This is the million-dollar question in hinge epistemology.

  *   **Leah's Reading (Degree/Entrenchment):** She argues that hinges are just very deeply entrenched empirical beliefs. This is a Quinean reading (the "web of belief"). On this view, "The earth exists" is the same *kind* of thing as "There is a cup on the table," just much harder to give up.
  *   **Your Reading (Kind/Role):** You argue that hinges function differently. They aren't "beliefs" in the same way; they are rules.

  **What Wittgenstein Says:**
  In Section 98, he says: *"The same proposition may get treated at one time as something to test by experience, at another as a rule of testing."*

  This suggests **Leah is closer to the text regarding the *proposition itself*, but you are closer regarding the *role* it plays.**
  Wittgenstein is anti-essentialist. He doesn't think there is a magical "Hinge Substance" inside the sentence "The earth exists." The sentence is empirical (Leah wins there). *However*, when it functions as a hinge, it is withdrawn from verification. It acts as a norm, not a fact (You win there).

  So, is it kind or degree? Wittgenstein would likely say: **It is a difference in use, not in content.**
  If you ask, "Is this proposition inherently a hinge?" the answer is No (Leah).
  If you ask, "Does this proposition function differently when it is a hinge?" the answer is Yes (You).

  ### 3. The "Logic as Empirical Science" Comment (Section 98)
  This is the trap Wittgenstein sets, and it's vital.

  If the river-bed (rules) can shift and was once fluid (empirical), doesn't that mean logic/rules are just empirical generalizations?
  Wittgenstein says: **"He would be wrong. Yet this is right..."**

  *   **Why he would be wrong:** Logic is normative. It tells you what you *ought* to infer. Empirical science is descriptive. If you call logic empirical, you lose its authority.
  *   **Why "this is right":** The *propositions* we use to formulate logic (or hinges) come from experience. We didn't get them from a Platonic heaven; we learned them by interacting with the world.

  **How this affects your argument:**
  This supports Leah's claim that nothing is *inherently* off-limits. Even logical rules (like non-contradiction) could theoretically shift if our form of life changed radically (OC 65). However, it supports your claim that *while they are functioning as logic*, they are not empirical. They have a different status *in the moment*.

  ### 4. Who wins in the Literature?
  If you walk into a seminar on hinge epistemology today, here is how the room splits:

  1.  **The "Orthodox" / Quinean Reading (Leah's Camp):** Scholars like Hilary Putnam or Richard Rorty lean this way. They see Wittgenstein as naturalizing epistemology. Hinges are just the center of the web, highly protected but not different in kind. If science changes enough, they go.
  2.  **The "Contextualist" / Grammatical Reading (Your Camp):** Scholars like **Danièle Moyal-Sharrock** (the leading Wittgenstein scholar on *On Certainty*) argue strongly for your side. She insists hinges are **different in kind**. She calls them "grammatical propositions." They are not knowledge, not belief, and not empirical. They are the "scaffolding" of our thought. For her, the "hard rock" isn't just metaphor; it marks a categorical distinction between *knowing* and *certainty*.
  3.  **The "Moderate" Reading (The Synthesis):** Scholars like **Annalisa Coliva** or **Duncan Pritchard** try to bridge it. They argue that while the *material* is the same (empirical sentences), the *warrant* is different. Hinges don't have evidential warrant; they have "entitlement" or "cornerstone" status.

  **The Consensus:**
  Currently, the **Moyal-Sharrock (Your) reading is dominant in specialized Wittgenstein scholarship**, specifically regarding *On Certainty*. Most experts agree that Wittgenstein is trying to show that hinges are *not* empirical knowledge, even if they look like it.

  However, in broader analytic epistemology, **Leah's reading (Fluidity)** is often preferred because it fits better with naturalized epistemology and avoids positing a mysterious "third category" of proposition.

  ### How to Settle the Argument
  Tell Leah this:
  > "You're right that Wittgenstein denies any proposition is *metaphysically* immune to change forever (the bed can shift). But I'm right that he insists they are *functionally* distinct when they are acting as hinges (rock vs. water). If we treat them as the same kind of thing, we can't explain why it makes no sense to doubt them *now*."

  **The "Cheat Code" Interpretation:**
  Wittgenstein isn't making a theory about propositions; he's making a point about **human action**.
  *   **Leah** is looking at the *propositions* (which are all just sentences).
  *   **You** are looking at the *practice* (some sentences are used as rules, some as moves in the game).

  Section 97 says: *"there is not a sharp division of the one from the other."*
  Leah can quote this to say "See! No kind distinction!"
  But you can reply: "He says there's no *sharp* division, not *no* division. Sand and Rock are different, even if there's a muddy patch in between."

  **Final Call:**
  If you have to bet on how a Wittgenstein expert would read Section 99 specifically: **You are slightly closer.** The "hard rock... subject to no alteration" line is Wittgenstein pushing back against the idea that *everything* is in flux *at once*. He needs the rock to be rock, even if it turns to sand in a million years. Leah's reading risks making the river-bed just "slow water," which collapses the metaphor entirely. Wittgenstein needs the bed to be distinct *enough* to hold the water.

  Tell Leah she wins on **time**, but you win on **function**. Buy her a coffee and move to Section 100.
