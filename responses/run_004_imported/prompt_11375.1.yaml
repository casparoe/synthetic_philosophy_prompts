  2.  **Deconstruct the Philosophical/Ethical Concepts:**
      *   **Truth vs. Standing:** The truth of a statement ("You flake too much") is independent of the speaker. However, the *authority* or *moral standing* to deliver that criticism is a separate variable.
      *   **Tu Quoque (Appeal to Hypocrisy):** Logically, pointing out hypocrisy doesn't invalidate the premise. If I tell you not to smoke while smoking myself, the advice "smoking is bad" is still true.
      *   **Moral Standing/Authority:** This is the key. To criticize someone morally, you often need to be operating within the same moral framework *and* upholding it yourself to some degree. If you violate the norm you're enforcing, you undermine your legitimacy.
      *   **The Function of Criticism:** Why do we criticize? To correct behavior, to express hurt, to enforce norms. Hypocrisy undermines the *effectiveness* and *fairness* of this process.
      *   **Power Dynamics:** Who gets to police whom? If Dana polices the user but exempts herself, she's asserting dominance, not mutual accountability.

  3.  **Formulate the Answer:**
      *   **Validate the User:** Acknowledge that their intuition isn't just defensiveness. There *is* a distinction between truth and standing.
      *   **Address the Logic (The Roommate's Point):** Admit the roommate is logically right (tu quoque). The criticism *is* likely true.
