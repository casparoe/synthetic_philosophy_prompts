answer: |-
  This is a fantastic question, and it is precisely where many readers—especially those with a scientific background—find themselves both attracted to and frustrated by *On Certainty*. You have put your finger on the central tension of the book.

  Your intuition is sharp: if the river-bed shifts, and if Newtonian mechanics can go from being a "hinge" of physics to being an "empirical claim" (and a limited one at that), then the distinction between a hinge and a stubborn empirical belief looks suspiciously like a distinction without a difference. It looks like Wittgenstein is just describing the sociology of science (à la Kuhn) but dressing it up in logical clothing.

  However, to save Wittgenstein from that collapse, we need to look at *how* he defines the status of these propositions. It isn't about their **content** (what they say); it is about their **logical grammar** (what work they are doing in the system).

  Here is how I would argue, on Wittgenstein's behalf, that a hinge is not merely an "unquestioned empirical belief."

  ### 1. The Distinction is Functional, Not Intrinsic
  You noted that Newtonian mechanics was once a hinge and is now an empirical theory. Wittgenstein would agree. But he would insist that when Newtonian mechanics *was* a hinge, it was not functioning as a hypothesis.

  In the lab, you have instruments that you test (the empirical claims) and you have the calibration standards that allow you to do the testing (the hinges).
  *   **Empirical Belief:** "This solution has a pH of 7." (Testable against the meter).
  *   **Hinge:** "This meter is capable of measuring pH." (If you doubt this, you can't trust the test of the solution).

  The sentence "The meter is capable..." looks empirical. But in the context of the experiment, it is being used as a rule. If you treat it as an empirical claim, you need another meter to test it, and another to test that one. Eventually, you must stop. Where you stop is not because you are tired, but because further doubt makes the language game of "measuring pH" impossible.

  So, a proposition isn't a hinge *by nature*; it is a hinge *in use*. The collapse is blocked because the **role** determines the status, not the history of the proposition.

  ### 2. The Cost of Doubt (The "Madness" Criterion)
  This is perhaps the strongest block against the collapse.
  If I doubt an ordinary empirical belief (e.g., "There is a cat on the mat"), I can go look. If I am wrong, I correct my belief. The system of inquiry remains intact.

  If I doubt a hinge (e.g., "The earth has existed for more than 5 minutes"), Wittgenstein argues I don't just have a false belief; I lose the **scaffolding** required to verify anything at all.
  *   **Empirical Doubt:** "Is this data point an outlier?" (Presupposes the experiment is real).
  *   **Hinge Doubt:** "Is this experiment real?" (Undermines the data point, the lab, and the scientist).

  Wittgenstein suggests that someone who genuinely doubts hinge propositions isn't a "skeptic"; they are arguably unintelligible or mad (OC 155, 257). They aren't playing the game anymore. An "unquestioned empirical belief" implies that we *could* question it if we had better tools. A hinge implies that questioning it dissolves the tools.

  ### 3. Groundlessness vs. Justification
  You asked: *"What's actually left of the claim that they're groundless?"*

  If hinges were just empirical beliefs we haven't tested yet, they would be **waiting** for evidence. They would be *provisionally* certain.
  Wittgenstein's point is that they are **structurally** certain. They are groundless not because we are lazy, but because they are the ground.

  Think of the "Standard Meter" in Paris (a favorite example of his from the *Philosophical Investigations*).
  *   Is the standard meter one meter long?
  *   You can't measure it with itself. To say "It is one meter long" is not an empirical discovery; it is a definition of how we measure.
  *   However, we could abandon the physical bar and define the meter by the speed of light.

  When we switch from the bar to the speed of light, the river-bed has shifted. But while we were using the bar, asking for evidence of its length was a category mistake. It wasn't an "untested empirical claim"; it was the **rule of representation**.

  In your scientific career, you likely operated with certain "hinges" that weren't just untested theories, but methodological necessities. For example: "Nature is uniform." You couldn't prove that in the lab; you had to assume it to do the lab work. If you treat "Nature is uniform" as an empirical claim, you have to ask, "Uniform when?" and you need induction to prove it, which presupposes uniformity. It is groundless, but it is not baseless—it is the base.

  ### 4. The River-Bed Shift is Not Normal Science
  You mentioned Kuhn. The similarity is real, but the difference lies in the *mechanism* of change.
  *   **Kuhn:** Paradigms shift because of anomalies and crises (sociological/historical).
  *   **Wittgenstein:** Hinges shift because our "form of life" changes (logical/anthropological).

  When the river-bed shifts (OC 97), it is not because we found a counter-example to the hinge. We never find a counter-example to a hinge, because the hinge defines what counts as an example.
  The shift happens more like a geological drift. We slowly stop *using* the proposition as a rule and start *using* it as a hypothesis.

  *   **Fixity of Species:** For centuries, this wasn't a theory biologists tested; it was the framework within which they classified variations.
  *   **Darwin:** He didn't just add data; he turned the framework itself into an object of study. He turned a hinge into an empirical claim.

  But notice: Once it became an empirical claim, it required a *new* set of hinges to support it (e.g., "The geological record is generally reliable," "Physical laws held constant in the past"). We didn't get rid of hinges; we swapped them.

  ### Summary: Blocking the Collapse
  To answer your specific worry: **Why isn't "hinge" just a fancy word for "empirical belief nobody happens to be questioning at the moment"?**

  Because if it were just that, then **doubt would always be meaningful.** Wittgenstein's point is that there is a point where doubt ceases to be meaningful and becomes nonsense.

  1.  **Logical Role:** A hinge functions as a rule of grammar, not a description of the world.
  2.  **Verification:** You verify empirical beliefs *using* hinges. You do not verify hinges (without circularity).
  3.  **Inheritance:** We inherit hinges through training/action, not through evidence. (A child learns "objects don't vanish" by handling toys, not by being shown data).

  As a scientist, you know that you cannot run an experiment without holding some variables constant. If you try to test *everything* at once, you measure nothing. The hinges are the variables you *must* hold constant to allow the other variables to show up.

  The fact that you can change which variables you hold constant next year (the river-bed shifts) doesn't mean that holding them constant *today* was just a psychological quirk. It was a logical necessity for the work you did today.

  Does that help preserve the distinction, or does it still feel like we are just masking a pragmatic convention with logical necessity?
