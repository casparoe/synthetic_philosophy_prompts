answer: |-
  **MEMORANDUM**

  **TO:** Graduate Research Grant Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Tie-Breaking Protocol for Grant Awards

  **1. Executive Summary**

  At our last meeting, the committee debated whether to retain the current tie-breaking rule (prioritizing applicants who have not received funding recently) or adopt a weighted lottery among tied proposals. This memo analyzes the theoretical arguments raised—specifically the appeal to Harsanyi's Aggregation Theorem versus the objection regarding procedural fairness—and recommends that the committee **adopt the explicit weighted lottery** for breaking ties in composite scores.

  While the current rule is defensible on administrative grounds, it fails to align with the committee's commitment to treating equally meritorious proposals with equal regard. The mathematical argument used to defend the status quo correctly identifies that both methods yield the same *expected* scientific value, but it overlooks the moral significance of *how* that value is distributed among candidates with equal claims.

  **2. The Core Dispute: Expected Value vs. Equal Chance**

  To resolve this, we must clarify the disagreement regarding what constitutes "fair treatment" when the panel cannot distinguish between two applications on merit.

  **The Chair's Argument (The Harsanyi Position)**
  The Chair argued that because our panel rankings are consistent and aim to maximize scientific value, we are bound by Harsanyi's Aggregation Theorem. In non-technical terms, this theorem states that if a group makes rational decisions that respect everyone's input, the group is effectively maximizing a weighted sum of individual values.
  *   **The Implication:** If two applicants are tied, they contribute equally to that sum. Therefore, giving the grant to Applicant A (Status Quo) or flipping a coin (Lottery) results in the exact same *expected* total scientific value.
  *   **The Conclusion:** Since the outcome is mathematically equivalent in expectation, there is no principled reason to incur the administrative friction of switching to a lottery.

  **The Dissenting Argument (The Diamond Objection)**
  The dissenting member argued that when two applicants have equal merit, fairness requires giving them an equal *chance*, not merely an equal *expected payoff*.
  *   **The Implication:** A deterministic rule (like the Status Quo) gives one person a 100% chance and the other 0%. A lottery gives both 50%. Even if the long-run scientific output is the same, the lottery respects the equality of the candidates' claims in the immediate decision.
  *   **The Conclusion:** A framework that cannot distinguish between a fair coin flip and a deterministic rule is blind to procedural justice.

  **3. Why Harsanyi's Theorem Does Not Settle the Matter**

  It is crucial to understand that the Chair is correct about the math but incomplete regarding the ethics. Harsanyi's theorem demonstrates that our decision-making process is *utilitarian* in structure (maximizing the sum of expected values). However, it does not prove that utilitarianism is the *only* moral value the committee should uphold.

  In social choice theory, this is known as the conflict between **ex-ante** and **ex-post** fairness.
  *   **Ex-Ante (Harsanyi):** Focuses on the expectation before the decision is made. From this view, a lottery and a deterministic rule are identical.
  *   **Ex-Post (Diamond):** Focuses on the treatment of individuals after the decision is made. From this view, a lottery distributes the "good" of opportunity equally, whereas a deterministic rule creates a winner and a loser based on a secondary criterion (recency) that was not part of the merit assessment.

  Harsanyi's theorem guarantees that we are efficiently maximizing scientific value. It does not guarantee that we are doing so fairly. If the committee believes that fairness among equally qualified peers is a value distinct from scientific output, the theorem does not preclude us from choosing the lottery. In fact, since the *expected scientific value* is identical under both rules (as the Chair noted), choosing the lottery satisfies the Diamond objection *without costing us any scientific value*.

  **4. The Strongest Case for the Status Quo**

  Before recommending a change, we must steel-man the case for retaining the current recency-based tie-breaker. The strongest argument for the Status Quo is not merely mathematical; it is substantive.

  Prioritizing applicants who have not been funded recently serves a **diversification function**. It prevents the concentration of resources among a small cohort of repeat applicants, ensuring that the grant program supports a wider range of students over time. This aligns with the university's broader goal of broadening research participation. If we view "past funding" as a negative weight on an applicant's current claim (i.e., "you've already had your turn"), then the tie-breaker is not arbitrary; it is a hidden merit criterion that prioritizes those with less prior support. Under this view, the applicants are not truly "equal" in claim, because one has already received a benefit the other has not.

  **5. Why the Lottery Prevails**

  Despite the diversification argument, I recommend adopting the weighted lottery for three specific reasons:

  1.  **Integrity of the Scoring Process:** The tie occurs *after* the panel has assigned composite scores. If "lack of prior funding" is a criterion we wish to prioritize, it should be explicitly weighted in the scoring rubric, not applied as a hidden tie-breaker. By declaring a tie, the panel certifies that the proposals are equally deserving *for funding*. To then override that certification with an external criterion undermines the panel's primary judgment.
  2.  **Epistemic Humility:** In practice, ties in composite scores rarely represent perfect mathematical equality. They represent the limits of our ability to distinguish merit. When the signal (merit) is indistinguishable from the noise, a lottery acknowledges this uncertainty. A deterministic rule falsely implies we have found a relevant distinction when we have not.
  3.  **Costless Fairness:** As the Chair correctly noted, the expected scientific value of both methods is identical. Therefore, we can satisfy the demand for procedural fairness (the Diamond objection) at zero cost to scientific efficiency (the Harsanyi constraint). When we can increase perceived fairness without decreasing expected utility, rational choice dictates we should do so.

  **6. Recommendation**

  I move that the committee **adopt an explicit weighted lottery** for breaking ties in composite scores.

  *   **Protocol:** In the event of a tie for the final funding slot(s), the committee will conduct a random draw among the tied applicants.
  *   **Safeguard:** To address the diversification concern raised in Section 4, the committee should discuss whether "prior funding history" should be added as an explicit criterion in the scoring rubric for future cycles. If we wish to prioritize unfunded students, we should score them higher, not rely on a tie-breaker to catch them.

  This approach respects the panel's judgment on merit, adheres to principles of procedural justice among equals, and maintains the expected scientific value of our awards.

  **7. Next Steps**

  I request a vote on this protocol change at the next meeting. If passed, the new rule will apply to the current cycle's remaining deliberations.

  Respectfully submitted,

  [Your Name]
  PhD Candidate, Department of Philosophy
  Student Representative, Graduate Research Grant Committee
