answer: |-
  Since you are familiar with Linear Temporal Logic (LTL) and model checking, the most efficient way to explain this is to map the philosophical debate onto the distinction between **CTL** (Computation Tree Logic) and **LTL** semantics within a branching-time framework.

  In model checking, we distinguish between *state formulas* (properties of a state) and *path formulas* (properties of a execution trace). Prior's Peircean and Ockhamist systems essentially disagree on whether a future-tense statement is a state formula or a path formula.

  Here is the breakdown of the disagreement, the truth assignments, and the logical trade-offs regarding Bivalence and Excluded Middle.

  ---

  ### 1. The Semantic Model: Branching Time
  Both systems agree on the ontology of time: the future is branching.
  *   **Moments ($m$):** Points in time (nodes in the tree).
  *   **Histories ($h$):** Maximal linear paths through the tree (traces in model checking).
  *   **The Sea Battle:** Let $p$ be "A sea battle occurs tomorrow." At the current moment $m$, there are some histories passing through $m$ where $p$ occurs tomorrow, and some where $\neg p$ occurs. $p$ is **contingent**.

  The disagreement is about how to evaluate the formula $Fp$ ("It will be that $p$") at moment $m$.

  ### 2. The Peircean Resolution (The "CTL" Approach)
  Named after C.S. Peirce, this view treats "will" as implying **inevitability**.

  *   **Truth Condition:** $Fp$ is true at moment $m$ if and only if $p$ is true at the corresponding future moment on **all** histories passing through $m$.
      *   In CTL notation: $Fp \equiv AF p$ (Along All paths, Finally $p$).
  *   **Assignment for Contingents:** Since the sea battle is contingent (it happens on some branches, not others), it is not true on *all* branches.
      *   Value of $Fp$: **False**.
      *   Value of $F\neg p$: **False** (because $\neg p$ is also not on *all* branches).
  *   **What it Gives Up:** It denies that one of the predictions must be true. It rejects the validity of the principle $Fp \lor F\neg p$ ("Either it will happen or it won't").
  *   **Blocking Fatalism:** Fatalism relies on the premise that $Fp \lor F\neg p$ is true now. The Peircean says this disjunction is **false** for contingent events. Since neither disjunct is true, neither was "true all along," so the past does not fix the future.
  *   **Engineer's Intuition:** A property like `AF error` is false if there exists even one execution path where no error occurs. You cannot assert the property holds at the current state unless it holds on every possible trace.

  ### 3. The Ockhamist Resolution (The "LTL" Approach)
  Named after William of Ockham, this view treats "will" as relative to the **actual future**, even if we don't know which branch is actual.

  *   **Truth Condition:** Truth is evaluated not just at a moment $m$, but at a **moment-history pair** $(m, h)$. $Fp$ is true at $(m, h)$ if $p$ is true at the future moment on **that specific history** $h$.
      *   In CTL*/LTL notation: This is a path formula evaluated on a specific trace $h$.
  *   **Assignment for Contingents:**
      *   On history $h_1$ (where the battle happens): $Fp$ is **True**.
      *   On history $h_2$ (where no battle happens): $Fp$ is **False**.
  *   **What it Gives Up:** It denies that **Truth implies Necessity**. Just because $Fp$ is true at $(m, h_1)$ does not mean it is *necessary* at $m$. It is only "true relative to $h_1$."
  *   **Blocking Fatalism:** The Ockhamist accepts that $Fp$ is true (on the actual history), but denies the inference: "$Fp$ is true $\rightarrow$ $Fp$ is necessarily true." The statement was true in the past *relative to this history*, but it was not *settled* in the past.
  *   **Engineer's Intuition:** In LTL, you verify a property on a single counter-example trace. If you are "on" the trace where the battle happens, the property `F battle` is satisfied. The fact that other traces exist in the Kripke structure doesn't change the truth value on *this* trace.

  ---

  ### 4. Bivalence vs. Excluded Middle
  You asked why rejecting Bivalence and rejecting Excluded Middle count as different moves. This is a crucial logical distinction that often gets blurred in natural language.

  *   **Bivalence (Semantic):** Every proposition has exactly one of two truth values (True or False).
  *   **Excluded Middle (Syntactic/Logical):** The formula $A \lor \neg A$ is logically valid (always evaluates to True).

  In classical logic, these go together. In temporal logic, they can come apart.

  #### The Peircean Move
  Prior's formal Peircean system is actually **2-valued** (it preserves Bivalence for the statements $Fp$). $Fp$ is simply False if not inevitable. However, it **rejects Excluded Middle** for future-tense disjunctions.
  *   Consider the sentence: "Either there will be a battle or there will not be" ($Fp \lor F\neg p$).
  *   Peircean: False $\lor$ False = **False**.
  *   *Note:* Some Aristotelian interpretations (often conflated with Peirceanism) use **3-valued logic** (True, False, Indeterminate). In that case, they reject **Bivalence** (the future fact is Indeterminate). If you use Łukasiewicz 3-valued logic, you can actually *keep* Excluded Middle ($I \lor \neg I = \text{True}$) while rejecting Bivalence. But Prior's specific Peircean system prefers rejecting the validity of $Fp \lor F\neg p$.

  #### The Ockhamist Move
  The Ockhamist **keeps Bivalence** (relative to a history). On any given $h$, $Fp$ is strictly T or F. Consequently, they **keep Excluded Middle**.
  *   On history $h_1$: $Fp$ is True. $Fp \lor F\neg p$ is True.
  *   On history $h_2$: $Fp$ is False. $Fp \lor F\neg p$ is True.
  *   The cost is that truth is no longer a property of the moment alone; it is a property of the moment-history pair.

  #### Why the Distinction Matters
  For a software engineer, think of it this way:
  1.  **Rejecting Bivalence:** You introduce a new return type, e.g., `Optional<Boolean>`. The function `willBattle()` returns `None`. This changes the data model. (This is the 3-valued Aristotelian approach).
  2.  **Rejecting Excluded Middle:** You keep `Boolean`, but you change the logic engine so that `x || !x` does not always return `true`. (This is the Peircean approach where `willBattle() || willNotBattle()` evaluates to `false`).
  3.  **Ockhamism:** You keep `Boolean` and standard logic, but you acknowledge the function depends on an implicit environment parameter `history`. `willBattle(history)` is always `true` or `false`.

  The distinction matters because rejecting Bivalence suggests the *world* is indeterminate (ontological openness), while rejecting Excluded Middle suggests our *logic* for describing the world is non-classical. The Ockhamist argues the world is determinate along any specific path, so we should keep classical logic and Bivalence, but acknowledge our perspective is path-relative.

  ### Summary Table

  | Feature | Peircean (Prior's Formalization) | Ockhamist (Prior's Formalization) |
  | :--- | :--- | :--- |
  | **Analogy** | CTL State Formula (`AF p`) | LTL Path Formula (`F p` on trace $h$) |
  | **Truth of $Fp$ (if contingent)** | **False** (because not inevitable) | **True** on some histories, **False** on others |
  | **Truth of $F\neg p$ (if contingent)** | **False** | **False** on some histories, **True** on others |
  | **Validity of $Fp \lor F\neg p$** | **Invalid** (False for contingents) | **Valid** (True on every history) |
  | **Truth implies Necessity?** | **Yes** (If $Fp$ is true, it is necessary) | **No** (Truth is relative to history) |
  | **Primary Sacrifice** | Excluded Middle for future claims | The idea that truth is moment-relative only |
  | **Fatalism Blocked By** | Denying the premise "One prediction is true" | Denying the inference "True $\rightarrow$ Necessary" |

  ### Conclusion
  As an engineer, you likely default to the **Ockhamist** view when writing LTL specifications: you assume a single execution trace (the "actual" history) and verify properties against it. You assume `F p` is either true or false on that trace.

  The **Peircean** view corresponds to verifying safety properties over the *entire* state space (`AG p` or `AF p`). If the system is non-deterministic, you cannot assert `F p` unless it holds on all branches.

  Prior favored the Ockhamist view later in his career because it preserves classical logic (Bivalence and Excluded Middle) at the cost of making truth relative to histories. The Peircean view preserves the idea that truth at a moment should be absolute (not history-relative) but at the cost of classical logic (rejecting $Fp \lor F\neg p$).
