answer: |-
  **Title:** The Idealization Trap
  **Characters:**
  *   **Skeptic (S):** Channeling Kripke's Wittgenstein. Focuses on justification and the gap between fact and norm.
  *   **Dispositionalist (D):** A sophisticated naturalist. Defends a refined dispositionalism augmented by teleosemantics.

  **Setting:** A university office, late evening. Coffee cups abound.

  ***

  **S:** Let's cut to the chase. You claim to mean *addition* by "plus." I claim there is no fact about you, past or present, that constitutes this. Take the specific case: $68 + 57$. You say the answer is $125$. I say, based on your past behavior, you might have meant *quus*, where $x \text{ quus } y = x + y$ if $x, y < 57$, but $5$ otherwise. Why is $125$ the *correct* answer rather than $5$?

  **D:** Because I have a disposition to answer $125$. It's not just what I *have* said, but what I *would* say. My cognitive machinery is tuned to addition. If you asked me, under appropriate conditions, I would respond $125$. That disposition is the fact you say is missing.

  **S:** "Under appropriate conditions." We've hit the first wall. You are a finite being. You have never computed $68 + 57$ before. If I asked you right now, you might suffer a stroke. You might get distracted. You might make a simple slip and say $124$. Your actual dispositions are messy. They include the disposition to make mistakes. So, your bare disposition doesn't fix $125$ as the *correct* answer; it only fixes what you *would* do, errors included.

  **D:** I grant the finitude point. That's why the view isn't about my *manifest* dispositions, but my *idealized* dispositions. I mean addition because I am disposed to answer $125$ *ceteris paribus*—all else being equal. That is, if I had sufficient brain capacity, time, and was free from interfering factors like fatigue, distraction, or neural misfiring. The idealization filters out the noise to reveal the underlying function.

  **S:** This is the move I expected. But now you've opened a deeper wound. How do you specify the *ceteris paribus* clause without presupposing the very meaning you're trying to constitute? To say "free from interfering factors" implies you know what counts as an *interference*.

  **D:** Not necessarily. Interference is defined functionally. A factor is interfering if it disrupts the normal operation of the mechanism.

  **S:** But what is the "normal operation"? If your mechanism is a "quus-adder," then answering $5$ is normal operation. If it's a "plus-adder," answering $125$ is normal. To define the ideal conditions, you have to say something like: "The conditions under which I would give the *correct* answer." But that's circular. You're using "correct" to define the disposition that's supposed to constitute correctness. If you try to define the conditions physically—say, "no neural noise"—I can construct a quus-function that maps perfectly onto that physical state but yields $5$. The idealization doesn't narrow the gap; it just hides the semantic assumption inside the *ceteris paribus* clause.

  **D:** That's too quick. I'm not defining the ideal conditions semantically; I'm defining them structurally and historically. Look at my learning history. I was trained in a specific way. I internalized algorithms for carrying digits, for recursive succession. The "ideal" condition is simply the condition where that specific algorithmic structure executes without physical degradation. It's not about "correctness" in the abstract; it's about the integrity of the causal process I actually underwent. The disposition is to follow *that* process. Since that process is isomorphic to addition, not quus, the idealized disposition picks out $125$.

  **S:** So you're anchoring the idealization in the causal history of the training. But that just brings us to the second wall, and the harder one. Let's grant you the idealization. Let's grant there is a fact about what your idealized self would say. That is still a *descriptive* fact. It is a fact about what you *would* do.

  **D:** Agreed.

  **S:** But meaning is *normative*. To mean addition is to be committed to $125$. It's not just that I *will* say $125$; it's that I *ought* to say $125$. If I wake up tomorrow and my idealized disposition is to say $5$, I haven't just changed; I've made a mistake. But on your view, if my idealized disposition changes, then what I *meant* changes. The disposition tells me what I will do, but it cannot tell me what I should do. You've naturalized the *is*, but you've lost the *ought*.

  **D:** I deny that I've lost the *ought*. The normativity isn't magical; it's teleological. My cognitive states have proper functions, fixed by evolutionary selection and my own learning history. When I say I "ought" to answer $125$, I mean that answering $125$ fulfills the proper function of the state caused by the query "$68 + 57$." Answering $5$ is a malfunction. The normativity is the normativity of function, like a heart ought to pump blood. If it doesn't, it's failing, even if it's disposed to quiver instead.

  **S:** The "malfunction" move. It's popular, but it doesn't survive the skeptical scrutiny. Let's apply your own skeptical hypothesis to your teleology. You say your brain state has the function of tracking addition. Why not say its function is tracking quus? Evolution and learning history are finite. Every time you were reinforced for saying "12" to "$5 + 7$," you were also reinforced for saying "12" to "$5 \text{ quus } 7$." The behavioral data underdetermines the function just as it underdetermines the meaning.

  **D:** But the internal structure matters. The brain isn't a black box. The way I compute $68 + 57$ involves intermediate steps—carrying the one, summing the units. A quus-computer wouldn't need those steps for large numbers; it would just trigger a lookup for "5." My disposition includes the disposition to go through the *steps*.

  **S:** But why are *those* steps the steps for addition? Maybe those neural firings are the physical realization of quus-steps. You're assuming the physical states have intrinsic intentional content. I'm telling you there is no fact of the matter about what they represent. Furthermore, even if you fix the function, you haven't fixed the normativity relevant to *meaning*. If my heart fails to pump, it's bad for my survival. That's a hypothetical imperative: *If* you want to live, your heart ought to pump. But semantic normativity is categorical. If I mean plus, I ought to say $125$ regardless of whether it helps me survive. Your teleosemantics reduces semantic norms to biological success conditions. It explains why I'm disposed to say $125$, but not why I'm *justified* in claiming $125$ is the only right answer.

  **D:** I think you're demanding a kind of justification that doesn't exist in nature. You want the normativity to float free of the natural facts. But if "ought" implies "can," the semantic "ought" must be grounded in what the system is capable of doing. My claim is that the "ought" is internal to the practice of using a representational system. To have a representation *just is* to be subject to norms of correct use. Those norms are constituted by the stability of the disposition under idealization. You're asking for a ground outside the system. I'm telling you the ground is the system's own operational standards.

  **S:** But whose standards? When you say "operational standards," you're smuggling in an interpreter. To say a machine has a standard is to say *we* interpret it as having a standard. If I interpret your brain as a quus-machine, your "carrying the one" is just a quus-ritual. You're relying on the idea that your brain interprets itself. But why is the brain's self-interpretation privileged? Why isn't that just another causal process subject to the skeptical paradox? You've pushed the homunculus inside the head.

  **D:** I'm not positing a homunculus. I'm positing a feedback loop. The system corrects itself. If I say $124$, and then check my work, I feel a sense of error. That feeling is part of the dispositional complex.

  **S:** And if you meant quus, you would feel a sense of error when you said $125$. The feeling of correctness is just another sensation. It doesn't bridge the gap to truth. Look, Dispositionalist, here is where we stick. You want to say that the idealized disposition *constitutes* the meaning. But to specify the idealization, you need to know which dispositions count as "un干扰ed" (uninterfered). To know that, you need to know which answer is *correct*. So the correctness precedes the disposition. You can't use the disposition to explain the correctness.

  **D:** And here is where I stick. You assume correctness must be prior to the facts about the agent. I argue that correctness *emerges* from the stability of the agent's responses under optimal conditions. You keep asking for a justification that stands outside nature. I'm offering you the only kind of fact there is: facts about how a complex system behaves when it is working as designed. If that doesn't satisfy your demand for "normativity," then your demand is for a ghost, not a rule.

  **S:** Perhaps. But if the ghost is what makes the difference between asserting $125$ and merely barking $125$, then I'm afraid I must keep looking for it. Your idealized disposition explains why I bark. It doesn't explain why I'm right.

  **D:** And your skepticism explains why I can't prove I'm right. But it doesn't explain how I manage to communicate with you at all. If there's no fact about addition, we aren't disagreeing now; we're just making noise.

  **S:** Precisely. And perhaps that's the lesson.

  ***

  **[End of Dialogue]**

  **Commentary for the Dissertation:**
  Notice where the deadlock occurs. The Skeptic argues that **Idealization presupposes Normativity** (you need to know the right answer to define the ideal conditions). The Dispositionalist argues that **Normativity emerges from Idealization** (the stability of the system under optimal conditions *creates* the standard). The Skeptic sees the *ceteris paribus* clause as a semantic Trojan Horse; the Dispositionalist sees it as a necessary naturalistic refinement. The dialogue highlights that the dispute isn't about whether dispositions exist, but whether *any* natural fact can bear the weight of semantic justification.
