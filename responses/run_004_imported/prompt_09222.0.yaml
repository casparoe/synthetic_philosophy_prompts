prompt: |-
  My grandma died last week, she was 84, and for almost forty years she ran a little wildlife rehab out of her garage — foxes, owls, the occasional very unhappy heron. To basically everyone in her town she was just "the animal lady." What most of them don't know is that for the last ten or fifteen years, mostly because I kept sending her stuff from my program, she got completely converted to the wild animal suffering view — the idea that nature isn't the peaceful idyll everyone defaults to but is mostly parasitism, disease, predation and enormous amounts of pointless death (in a lot of r-selected species something like 99% of offspring die within days of being born), and that this is a real moral catastrophe even though nobody agrees on whether or how we should intervene. She was not shy about this. I'm told she once, gently but very audibly, corrected a minister at another rehab volunteer's funeral for saying the woman was "back in nature's embrace now."

  I'm her grandkid, and also a philosophy PhD student working on animal ethics largely because of her, and I got asked to give the eulogy this Saturday. The room is going to be maybe ninety percent rehab-centre volunteers and extended family who think about nature in the totally standard Bambi way, plus a handful of people from the wild-animal-welfare research world (the kind of people who know Oscar Horta and Brian Tomasik's stuff cold) who will absolutely notice if I cave and reach for the comforting version of nature she spent fifteen years arguing against. Could you write the eulogy for me? Five minutes or so, needs to genuinely comfort a room full of non-philosophers, can't misrepresent what she actually believed, and definately can't lean on any "returning to nature" imagery to close it out — I need something else to land on.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Grandmother, 84 years old. Ran a wildlife rehab out of her garage for 40 years. Known locally as "the animal lady."
      *   **Key Belief:** For the last 10-15 years, she adopted the "wild animal suffering" (WAS) view (nature is full of suffering, predation, disease; it's a moral catastrophe, not a peaceful idyll). She was vocal about this (e.g., correcting the minister at a funeral).
      *   **Speaker:** Grandchild, Philosophy PhD student in animal ethics (influenced by her).
      *   **Audience:** 90% rehab volunteers/family (standard "Bambi" view of nature), 10% wild-animal-welfare researchers (know Horta/Tomasik, will spot inconsistency).
      *   **Constraints:** ~5 minutes spoken (approx. 750-850 words), must comfort non-philosophers, *must not* misrepresent her beliefs (no "back to nature" clichés), must not lean on "nature's embrace" imagery.
      *   **Goal:** Honor her life, acknowledge her specific ethical stance without alienating the majority, and provide a comforting conclusion that respects her worldview.

  2.  **Determine the Tone and Strategy:**
      *   **Tone:** Respectful, honest, warm, intellectually rigorous but accessible.
      *   **The Tightrope:** I need to acknowledge her controversial view on nature without making the rehab volunteers feel like their work was pointless or that she thought they were fools. The bridge is *compassion*. She didn't stop rehabbing because nature is cruel; she rehabbed *because* nature is cruel. Her work was an act of rebellion against suffering.
      *   **The "Hook":** Start with the garage. It's the physical space where her philosophy met practice.
      *   **Addressing the Belief:** Don't use jargon like "r-selected species" or "negative utilitarianism." Describe the *feeling* of her realization. She saw the cost of life.
      *   **Addressing the Audience:** Validate the volunteers. Their work mattered *more* to her because of her beliefs, not less. It was a beacon in the dark.
      *   **The Closing:** Needs to be about legacy and continuation of care, not returning to the earth. It needs to be about *reducing suffering* as a tribute.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the setting (the garage) and her reputation ("The Animal Lady"). Acknowledge the loss.
      *   **The Shift (The Philosophy):** Gently introduce her change in perspective. Use the story about the minister (it's a great anecdote provided in the prompt). Frame it not as cynicism, but as clear-eyed love. She loved animals enough to tell the truth about their suffering.
      *   **Reconciling the Work:** This is crucial. Why rehab if nature is cruel? Because every individual counts. The volunteers weren't fixing nature; they were saving *specific* lives. That aligns with WAS ethics (prioritizing the individual over the ecosystem).
      *   **The Grandchild Connection:** Mention the PhD/ethics work. Show how she influenced the speaker. This validates the academic attendees without alienating the family.
      *   **Conclusion:** No "nature's embrace." Instead, focus on the *garage* as a sanctuary. The legacy is the *act of caring* in a world that doesn't always care. A call to action (keep being kind).

  4.  **Drafting - Refining the Language (Self-Correction during the process):**
      *   *Initial thought:* Maybe mention Brian Tomasik? *Correction:* No, too niche. The family won't get it. Just say "researchers" or "ethicists."
      *   *Initial thought:* Explain predation statistics. *Correction:* Too cold for a eulogy. Focus on the *emotional weight* of that knowledge.
      *   *Check:* Did I use "returned to nature"? *Correction:* Ensure I explicitly avoid that. Use "left us" or "rest" instead.
      *   *Check:* Is it comforting? *Correction:* Make sure the emphasis is on the *value* of her intervention. Comfort comes from knowing her life had meaning according to her own strict standards.

  5.  **Final Polish (Reviewing against constraints):**
      *   *Time:* Read through at a moderate pace. Looks to be around 800 words. That's about 5 minutes.
      *   *Audience:* The volunteers feel valued (they were fighting the good fight). The ethicists feel heard (the philosophy is accurate). The family feels loved (grandma's devotion is highlighted).
      *   *Key Constraint:* The "nature's embrace" line is specifically forbidden. I need a strong alternative closing image. The "light in the garage" seems appropriate.

  6.  **Finalizing the Text:** (Proceeding to write the eulogy based on these thoughts.)
      *   *Opening:* The garage door opening.
      *   *Middle:* The hard truth she accepted. The minister story.
      *   *Bridge:* Why she kept working.
      *   *End:* The torch passing.

  7.  **Post-Draft Review:** Does it sound like a grandchild? Yes, personal but academic enough. Does it honor the WAS view? Yes, by framing rehab as moral intervention rather than ecological balance.

  *(Self-Correction during final output generation)*: Make sure the transition between the "cruel nature" part and the "comfort" part is smooth. The comfort comes from the idea that *she* made a difference, and *we* can too. It's not about the universe being kind; it's about *us* being kind.

  8.  **Final Word Count Check:** Aiming for ~750-850 words.

