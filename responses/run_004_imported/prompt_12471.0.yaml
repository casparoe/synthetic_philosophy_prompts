      *   **1. Surrogate Goals:**
          *   *Concept:* Care about something fake (e.g., paperclips) so threats target that instead of real values (e.g., human welfare).
          *   *Pros:* Directly mitigates damage if threatened. Makes extortion less profitable if the threatener knows.
          *   *Cons:* Hard to implement psychologically/algorithmically (can you *really* care about a decoy more than reality?). Risk of "goal drift" (decoy becomes real). Requires the threatener to know about the surrogate.
          *   *Verdict:* Strong theoretical candidate, actively discussed in safety literature (e.g., Paul Christiano). High potential but implementation risk.

      *   **2. Blanket Precommitment (Updateless/UDT):**
          *   *Concept:* Commit *before* knowing the specific threat to never yield.
          *   *Pros:* Removes the incentive for the threatener entirely (if they know). Logically consistent in FDT/UDT frameworks.
          *   *Cons:* Extremely rigid. If you face a *real* causal threat (gun to head), you still won't yield. Hard to credibly signal without boxing yourself into catastrophic losses in non-acausal scenarios.
          *   *Verdict:* Theoretically robust in acausal contexts, but dangerous in practice due to inflexibility.

      *   **3. Refusing to Reason (Ignorance):**
          *   *Concept:* Just don't think about acausal trade.
          *   *Pros:* Prevents self-fulfilling prophecies driven by anxiety.
          *   *Cons:* Doesn't stop an AI or superintelligence from reasoning about *you*. If the threat is real, ignorance doesn't shield you. Leaves you vulnerable to manipulation by those who *do* reason.
          *   *Verdict:* Weak. Works for humans psychologically, not for agents/systems.

      *   **4. Hiding Values (Obfuscation):**
          *   *Concept:* Make it hard to know what you care about.
          *   *Pros:* Increases the cost for the threatener to find a lever.
          *   *Cons:* In acausal trade, a sufficiently powerful predictor simulates you perfectly anyway. Hiding values from a simulator is likely impossible if they have enough compute. Also hinders beneficial cooperation.
          *   *Verdict:* Moderate. Good against limited predictors, useless against god-like simulators.

      *   **5. Coordinated Norms (Mutual Defense):**
          *   *Concept:* Everyone agrees to punish extortionists/never yield.
          *   *Pros:* Changes the game theory. If extortionists know the community won't yield, they stop trying.
          *   *Cons:* Coordination is hard. Requires enforcement. Vulnerable to defectors (someone yields secretly, breaking the norm).
          *   *Verdict:* Strong socially, but fragile. Depends on widespread adoption.

      *   **6. Randomizing Responses:**
          *   *Concept:* Be unpredictable.
          *   *Pros:* Makes modeling harder.
          *   *Cons:* Acausal threats rely on *logical* correlation, not just statistical prediction. If your decision algorithm is known, randomization is often factored in (mixed strategies). Can lead to suboptimal outcomes in cooperative scenarios.
