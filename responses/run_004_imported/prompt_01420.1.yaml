answer: |-
  You are absolutely not being pedantic. Your intuition is mathematically correct, and your brother-in-law is describing a classic vulnerability in probability theory known as a **Dutch Book**.

  If he is truly willing to bet *either side* of those numbers, you can construct a combination of bets that guarantees you a profit regardless of the match outcome. It is not just harmless imprecision; it is a fundamental violation of the axioms of probability.

  Here is the breakdown of why he is wrong, how you could exploit it, and why actual bookmakers don't make the same mistake.

  ### 1. The Rule of Coherence
  In any event where the outcomes are **mutually exclusive** (only one can happen) and **exhaustive** (one of them must happen), the probabilities *must* sum to exactly 100%.

  In a football match, the standard "1X2" market (Home Win, Draw, Away Win) covers every possible result (ignoring extremely rare voided matches).
  *   If the percentages sum to **100%**: The odds are "fair."
  *   If the percentages sum to **>100%** (e.g., 110%): The probabilities are incoherent.
  *   If the percentages sum to **<100%** (e.g., 90%): The probabilities are incoherent.

  ### 2. How You Could Guarantee a Profit
  The critical phrase your brother-in-law used is that he would **"happily bet either side."** This means he is willing to act as both the bettor and the bookmaker at those specific prices.

  Here is how you exploit the two scenarios you mentioned:

  **Scenario A: The Sum is >100% (e.g., 110%)**
  *   **His numbers:** United 55%, Draw 25%, Chelsea 30%.
  *   **The Play:** You act as the bookie. You sell him a bet on *every* outcome.
  *   **The Deal:** You agree that for each outcome, he pays you the percentage amount in cash, and you promise to pay him $100 if that outcome happens.
      *   He pays you $55 for the United ticket.
      *   He pays you $25 for the Draw ticket.
      *   He pays you $30 for the Chelsea ticket.
  *   **Your Take:** You collect **$110** upfront.
  *   **The Result:** No matter who wins, exactly one ticket pays out. You pay him **$100**.
  *   **Your Profit:** **$10 risk-free.**

  **Scenario B: The Sum is <100% (e.g., 90%)**
  *   **His numbers:** United 40%, Draw 20%, Chelsea 30%.
  *   **The Play:** You act as the bettor. You buy a bet on *every* outcome from him.
  *   **The Deal:** You pay him the percentage amount for a ticket that pays $100 if that outcome happens.
      *   You pay him $40 for the United ticket.
      *   You pay him $20 for the Draw ticket.
      *   You pay him $30 for the Chelsea ticket.
  *   **Your Cost:** You pay **$90** upfront.
  *   **The Result:** No matter who wins, exactly one ticket pays out. He pays you **$100**.
  *   **Your Profit:** **$10 risk-free.**

  ### 3. Why This Happens (and why Bookies survive)
  Actual sports bookmakers *do* set odds that add up to more than 100% (often 105% to 115%). This is called the **overround** or the **vig**. It is how they make money.

  However, bookmakers **never** bet the other side. They only take the bets. They set the line at 110% and wait for punters to bet against them. They know that if they ever offered to bet *against* their own lines, they would be arbitraged by sharp bettors exactly as described above.

  Your brother-in-law is claiming his numbers are his "honest gut feeling" (true probability) but also that he will bet against them.
  *   If they are his **true probabilities**, they must sum to 100%.
  *   If they are **betting odds**, he cannot bet the other side.
  *   By claiming both, he is guaranteeing his own bankruptcy.

  ### The Verdict
  You are right. This is a real logical error called **probabilistic incoherence**.

  In philosophy and economics, this is often used as a proof that rational agents *must* follow the laws of probability. If you don't, a "Dutch Book" can be made against you, meaning you are guaranteed to lose money in a series of trades that you individually agreed were "fair."

  **How to handle it at dinner:**
  If you want to have fun with it, tell him you're willing to hold a "bank" for the next match he predicts. Tell him you'll let him choose which side of the bet he wants for each outcome, but you get to structure the stakes based on his percentages. If he actually puts money down, you can grade his papers *and* pay for dinner with his cash.

  If he's just talking, then it's harmless nonsense—but mathematically, it's definitely nonsense.
