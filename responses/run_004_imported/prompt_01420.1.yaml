      *   *Sum > 100% (e.g., 110%):* This implies an "overround." In bookmaking, this is normal for the *bookie* to ensure profit, but the BIL claims these are his *true beliefs* and he'll bet *either side*. If he believes the true probability is 110%, he is incoherent. If he offers bets based on these, he can be arbitraged.
      *   *Sum < 100% (e.g., 90%):* This implies he thinks there's a 10% chance nothing happens (or he's just wrong). If he bets *against* these outcomes based on these numbers, he can be arbitraged.
