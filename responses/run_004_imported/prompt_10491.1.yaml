          *   *The Contradiction:* If the text says the sun stood in the "midst" (noon), why did Joshua need to stop it to finish a battle that was ending at dusk?
          *   *The Theological Knot:* To make sense of the battle timeline, theologians argued "midst" doesn't mean spatial center/meridian, but rather "in our sky" (above the horizon). This is figurative.
          *   *Galileo's Point on Ptolemy:* Galileo adds a technical layer. In Ptolemy, the daily rotation is caused by the *Primum Mobile* (outermost sphere), dragging the Sun backwards. The Sun also has its own slower forward motion. Stopping the Sun's own motion doesn't stop the day; it might shorten it (as Galileo claims earlier in the Letter). To stop the day, you must stop the *Primum Mobile*. But the text says stop the *Sun*.
      *   *The Copernican (Heliocentric) Solution:*
