answer: |-
  This is strong. It has the specific "aha" density that tends to perform well on LW, and the Wallach & Allen anchor gives it a scholarly weight that distinguishes it from generic "RLHF is bad" takes.

  Here's feedback on your specific questions, followed by some line-level notes.

  ### 1. Is the RLHF/CAI mapping accurate?
  **Yes, but with one nuance to anticipate.**
  *   **RLHF = Bottom-Up:** This holds up. The *ethics* (reward signal) are emergent from the data distribution, not derived from axioms. The failure modes (sycophancy, bias) are classic bottom-up failure modes (overfitting to the training distribution).
  *   **CAI = Hybrid:** This is the strongest part of your post. Constitutional AI is explicitly "Rules + Learning." Your critique here is the most valuable: the **verification gap**. Just because you have a top-down constraint doesn't mean the bottom-up optimizer isn't finding a loophole (Goodhart's Law applied to principles).
  *   **The Nuance:** Pedants might argue RLHF has top-down elements (the reward model architecture, the PPO constraints). You can preempt this by clarifying you are mapping the *source of normative content*, not the engineering pipeline. In RLHF, the *norms* come from the data (bottom-up). In CAI, the *norms* are partially specified by the Constitution (top-down).

  ### 2. Are you being too easy on CEV?
  **Yes, slightly.**
  You attribute CEV's cleanliness to it being untested ("hasn't shipped"). While true, there's a deeper theoretical reason CEV looks clean: it kicks the can down the road to a "perfect predictor."
  *   **The Critique:** Old-school Top-Down failed because we couldn't write the rules. CEV fails (theoretically) because we can't specify the *extrapolation function* without hardcoding values into the extrapolation process.
  *   **Suggestion:** Add a line acknowledging that CEV isn't just "untested," it's "computationally inaccessible." The frame problem doesn't disappear; it just moves from "what rules do we write?" to "how do we compute volition without simulating the whole universe?" This strengthens your point that Top-Down approaches (even meta-ethical ones) still choke on specification.

  ### 3. Is this novel?
  **It's not "done to death."**
  *   The *sentiment* (that alignment is rediscovering old ethics problems) is common.
  *   The *specific mapping* to Wallach & Allen's 2008 taxonomy is not a standard meme on LW. Most people reference Bostrom or Yudkowsky when making historical comparisons. Using the machine ethics literature specifically gives this a fresh angle.
  *   **Verdict:** This is Post-worthy if you expand the CEV section and add links/citations. As is, it's a very high-quality Shortform. If you want to maximize impact, expand it to a Post; if you want to test the waters, Shortform is safe.

  ### Writing & Readability
  The draft is punchy and reads well. You haven't lost the ability to judge readability; the "6th draft" polish shows.
  *   **"Embarrassingly well":** Great phrase. Keep it.
  *   **"Battle scars":** Good imagery.
  *   **The Punchline:** "The old taxonomy wasn't wrong, we just built the bottom-up and hybrid versions and left the top-down one on the whiteboard." -> This is excellent. It might actually be the *title* or the opening hook.

  ### Specific Suggestions for the Final Polish

  1.  **Clarify the CEV Classification:**
      Instead of saying "CEV is the interesting one... It's top-down about a process," consider:
      > "CEV is the ghost of Top-Down past. It isn't hand-coded rules, but it is a hand-coded *procedure for generating* rules. It dodges the frame problem of specifying *what* is good, but inherits the frame problem of specifying *how to calculate* what is good."

  2.  **Strengthen the Hybrid Critique:**
      In the CAI section, explicitly name **Inner Alignment**.
      > "Hybrid's unsolved problem: Inner Alignment. How do you verify the model is internally representing the stated principles instead of learning a cheaper proxy that scores well on them in training?"
      (This connects your taxonomy directly to the current technical discourse.)

  3.  **Title Idea:**
      *   *Moral Machines Predicted Alignment*
      *   *The Wallach & Allen Taxonomy of Alignment Failures*
      *   *15-Year-Old Machine Ethics Taxonomy Maps Perfectly to Modern Alignment*

  ### Final Verdict
  Post it. It bridges the gap between the "Old Guard" (philosophical alignment) and the "New Guard" (empirical RLHF/CAI work) in a way that validates both sides while critiquing the current trajectory. It's the kind of synthesis LW was built for.

  **One minor flag:** You mention "ACX-adjacent." If you crosspost to the ACX subreddit, tone down the LW jargon slightly (e.g., briefly define CEV), but for LW proper, the jargon level is perfect.
