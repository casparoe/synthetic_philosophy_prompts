          *   The distinction between *moral agents* and *moral patients*. Animals are patients. Humans are agents.
      *   *The State vs. Individual:* Nozick's libertarianism restricts the *state*. It does not necessarily restrict private charity or individual action, provided rights aren't violated.

  3.  **Analyze the Modern Wild Animal Suffering (WAS) Position:**
