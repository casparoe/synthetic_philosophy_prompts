      *   Make sure Conor articulates that AC_ω doesn't provide enough "power" to construct the specific sets needed for the Diaconescu proof.

  8.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Classical vs. Bishop Constructivist? Yes.
      *   Diaconescu mentioned? Yes.
      *   Banach-Tarski avoided? Yes.
      *   Countable Choice defense included? Yes.
      *   No strawmen? Yes.

