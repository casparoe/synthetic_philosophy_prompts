      *(Self-Correction on Lean)*: The prompt mentions the user learned Lean and saw AC is provable. I should have Claire mention this to bridge the user's experience. In Type Theory, AC is valid because a function *is* a choice. In Set Theory, a relation isn't necessarily a function. Diaconescu shows that in *constructive set theory*, treating relations as functions (AC) collapses logic.

  7.  **Final Polish:** Check technical accuracy on Diaconescu.
      *   Diaconescu-Goodman-Myhill theorem.
      *   Assumes: Extensionality, Separation, and AC.
