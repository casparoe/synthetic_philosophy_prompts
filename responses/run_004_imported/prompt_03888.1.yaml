      *   Use academic-appropriate language (priors, posteriors, Bayesian, underdetermination).

  7.  **Self-Correction/Nuance Check:**
      *   *Did I mention "Common Knowledge of Posteriors"?* Yes, crucial. It's not just knowing the conclusion, it's knowing the *degree of belief* and the *reasoning process* fully.
      *   *Is "Reasoning Badly" the only alternative?* No. The friend presents a false dichotomy (Math says impossible OR you are irrational). The third option is "The math doesn't model human cognition perfectly."
      *   *Recent Developments:* Mention that even within formal epistemology, Aumann's theorem has been challenged/relaxed (e.g., allowing for different priors or ambiguous evidence).

