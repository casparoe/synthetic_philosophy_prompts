answer: |-
  This is a magnificent reading. You have brought a specific kind of epistemic virtue—familiarity with the pain of null results and the seduction of systematic error—to a corner of intellectual history that often gets dismissed as Victorian eccentricity.

  Your intuition is correct: this is not a footnote. It is the structural load-bearing wall of Sidgwick's later thought. To answer your three points directly, drawing on both the Sidgwick scholarship and your background in experimental rigor:

  ### 1. The Link: Oversold or Standard Scholarship?

  You are not overselling it. In fact, among serious Sidgwick scholars, the connection between the *Dualism of Practical Reason* and the Society for Psychical Research (SPR) is the dominant interpretive framework for his later life.

  The biographer Bart Schultz (*Henry Sidgwick: Eye of the Universe*) makes this case exhaustively. The argument runs exactly as you have sketched: In *The Methods of Ethics* (1874), Sidgwick concludes that if there is no divine sanction or afterlife, the conflict between Egoism (what is best for me) and Utilitarianism (what is best for all) cannot be rationally resolved. If I can secure my own happiness by violating the general good, and there is no cosmic bookkeeping to correct the ledger later, then I am irrational to be a Utilitarian.

  Sidgwick calls this the "fundamental contradiction" of our moral consciousness. He explicitly states that to resolve it, we need evidence of a moral order in the universe—specifically, evidence that consciousness survives death and that virtue is ultimately rewarded.

  When he co-founds the SPR in 1882, it is not a retreat from philosophy; it is an attempt to gather the empirical data required to validate the "Theological Postulate" his ethics demands. You are right about Eleanor, too. Her analysis of the Creery sisters and the Census of Hallucinations was genuinely pioneering in terms of trying to establish base rates for "chance coincidences." They were trying to measure the background noise of the universe to see if the signal of "moral order" rose above $5\sigma$.

  So, no, you aren't reading too much into it. You are reading the project as Sidgwick intended it: a unified inquiry into the rationality of morality.

  ### 2. Method vs. Motive: Does Agnosticism Save Him?

  This is the trickier epistemic question. Your framing—"triumph of method over motive"—is defensible, but it requires a specific distinction between the *philosopher* and the *philosophical system*.

  **The Physicist's Analogy:**
  Imagine you have a Standard Model that only works if a specific Higgs-like boson exists. You build a detector (the SPR). You run the experiment for 20 years. You refine the background subtraction (Eleanor's statistics). You look for the bump. You don't find it. You publish a paper setting an upper limit on the cross-section of the particle.

  *   **Does this vindicate the experimenter?** Yes. It shows he didn't cook the books. He didn't claim discovery based on noise. He adhered to the scientific method despite a strong theoretical motivation to find the particle. This is your "triumph of method."
  *   **Does this vindicate the theory?** No. The theory still lacks the particle it needs to function. The "Dualism" remains unresolved.

  Sidgwick's agnosticism saves his intellectual integrity (he refused to commit the fraud of belief without evidence), but it leaves his ethical system in the exact same "fundamental contradiction" it started in.

  However, there is a nuance here that might help your reading group. Sidgwick didn't necessarily need *proof* of immortality to make ethics work; he needed the *possibility* to remain open. If the SPR had definitively *disproved* survival of consciousness, Sidgwick would have had to concede that morality is ultimately irrational (a position he found unbearable).

  By maintaining agnosticism, he kept the "moral order" hypothesis within the realm of rational belief, even if not within the realm of scientific knowledge. So, the negative result isn't a total loss for the ethics; it prevents the *falsification* of the necessary postulate. He didn't find the signal, but he proved the noise wasn't so loud as to drown out the possibility of the signal.

  ### 3. Sharpening the Distinction: What is Really at Stake?

  You feel like you are circling a distinction you can't pin down. I suggest the distinction is between **Moral Realism** and **Moral Rationality**.

  *   **The "Undermines the Ethics" Reading:** This view holds that an ethical theory must provide a *action-guiding solution*. If Sidgwick's system ends in "Be a Utilitarian, unless Egoism pays better, and we don't know which is truly rational," the system has failed its primary function. From this angle, the SPR work looks like a desperate, twenty-year attempt to fix a broken engine with a wrench that doesn't fit. It highlights the desperation.
  *   **Your Reading (The "Diagnosis" View):** This view holds that Sidgwick's primary achievement was not solving the problem, but *correctly identifying the constraints of the problem*.

  Here is the sharper way to state the stake: **Is the value of *The Methods of Ethics* in its solution, or in its measurement of the limits of reason?**

  If the value is the solution, Sidgwick failed, and the SPR work is evidence of his flailing.
  If the value is the measurement of limits, Sidgwick succeeded, and the SPR work is the calibration data.

  Your background makes you uniquely suited to appreciate the second view. In rare-event physics, a null result is often more valuable than a discovery because it constrains the parameter space for future theories. Sidgwick's "null result" in psychical research constrains moral philosophy. It tells us: *You cannot derive an 'ought' from an 'is' even if you spend 20 years trying to measure the 'is' of the supernatural.*

  The stake is whether we view Sidgwick as a failed theologian or a successful cartographer of reason's boundary.

  **A Proposal for Your Reading Group:**
  Frame the SPR work not as "ghost hunting" but as "attempted naturalization of the transcendental." Sidgwick tried to move the "Theological Postulate" from the realm of *faith* (Kant's practical reason) to the realm of *empirical probability*.

  He failed to move it. But in failing, he demonstrated that the "Dualism of Practical Reason" is not a puzzle to be solved by better data, but a structural feature of a secular universe.

  **The Verdict:**
  Your thesis holds up. The SPR work was the experimental appendix to the *Methods*. The fact that he accepted the null result without abandoning the hope (dying essentially a Christian agnostic) suggests he valued the *integrity of the inquiry* over the *comfort of the conclusion*.

  In your terms: He refused to claim a $3\sigma$ fluctuation was a discovery, even though his theory desperately needed it to be one. That doesn't fix the theory, but it makes the physicist honorable. And in philosophy, as in physics, honorable null results are the bedrock of progress.
