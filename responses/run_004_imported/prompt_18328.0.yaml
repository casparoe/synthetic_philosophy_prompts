prompt: |-
  I'm teaching a graduate seminar on medieval political philosophy this term, and last week we spent a long session picking apart Aquinas's actual position on tyrannicide -- De Regimine Principum, the relevant bit of his commentary on the Sentences, and the question on sedition in the Summa. What struck the class is how much more cautious he actually is compared to the "Aquinas said its fine to kill bad kings" version that gets passed around in intro classes -- he's pretty wary of private individuals taking it on themselves to kill a tyrant, seems to want any deposing done by whatever public authority set the ruler up in the first place, and keeps circling back to the worry that a botched or unauthorized tyrannicide could produce more disorder and suffering than the tyranny it's replacing.

  That's the background for a question one of my students asked that I couldn't answer well on the spot, and it's been bugging me since. Say a tyrant today gets taken out by a drone strike ordered by some other country's government, maybe with a nod of approval from the UN Security Council -- so not a lone assassin, but also not any authority that the tyrannized population itself set up or answers to. Does that count as the kind of "public authority" action Aquinas thinks can licitly depose a tyrant, given that his own examples all seem to assume some authority internal to the same community (a council, the barons, a liege lord within the same political order)? Or is a foreign power acting on a population's behalf just a structurally different case that his framework doesn't really have the resources to adjudicate one way or another? I'd love an answer that actually works through how his argument hangs together rather than just citing the "yes tyrannicide can be ok" headline.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A professor teaching a graduate seminar on medieval political philosophy.
      *   **Context:** They've already done a deep dive into Aquinas's texts (*De Regimine Principum*, *Sentences* commentary, *Summa Theologiae* II-II, q. 42, a. 2). They know the standard "Aquinas supports tyrannicide" myth is false/oversimplified. They understand Aquinas's caution regarding private individuals, the preference for public authority, and the concern for greater disorder (sedition).
      *   **The Question:** A student asked about *foreign* intervention (e.g., drone strike by another state/UN) against a tyrant. Does this fit Aquinas's concept of "public authority"? Or is it outside his framework?
      *   **Requirement:** Don't just give a "yes/no." Work through Aquinas's argumentative structure (teleology, common good, authority, order). Avoid anachronism but show how his principles might apply or fail to apply.

  2.  **Deconstruct Aquinas's Position on Tyranny:**
      *   *Source Material:* Primarily *De Regimine Principum* (I, 6) and *Summa Theologiae* II-II, q. 42, a. 2 (On Sedition). Also *Sentences* II, d. 44, q. 2, a. 2.
      *   *Key Distinction:* Private vs. Public Authority. Private killing is sedition/murder. Public deposing is legitimate correction.
      *   *Key Criterion:* The Common Good (*bonum commune*). Tyranny is unjust because it seeks private good over common good.
      *   *Key Risk:* The "Greater Evil" problem. Killing a tyrant might lead to worse tyranny or civil war.
      *   *Key Mechanism:* Who has the right to appoint/remove? Usually, the community or a superior authority within the *same* political order (e.g., Emperor over King, barons over King).

  3.  **Analyze the "Foreign Power" Scenario:**
      *   *Scenario:* Foreign state/UN removes a tyrant via drone strike (targeted killing).
      *   *Aquinas's Context:* Christendom (*Respublica Christiana*). Kings were often vassals to Emperors or Popes in theory. There was a sense of a higher universal order.
      *   *The Problem:* Modern sovereignty (Westphalian) vs. Medieval hierarchy. Aquinas assumes a hierarchy of jurisdiction. A foreign king isn't usually the *superior* of another king unless there's a feudal tie or Imperial/Papal mandate.

  4.  **Evaluate the Fit (The "Working Through"):**

      *   *Argument for "Yes" (Expanding Public Authority):*
          *   Aquinas allows for a "superior authority" to depose a ruler.
          *   In the *De Regimine*, he mentions the Romans deposing Tarquin. He mentions the possibility of an Emperor deposing a King.
          *   If the UN/Foreign Power acts as a "superior" protecting the *bonum commune* of the *human* community (not just the local one), does it fit?
          *   Aquinas cares about the *end* (justice/common good), not just the *agent*.

      *   *Argument for "No" (Structural Mismatch):*
          *   Aquinas is deeply concerned with *order* (*ordo*). Unauthorized force is sedition.
          *   A foreign power is usually an *enemy* in Aquinas's just war theory, not a magistrate.
          *   Intervention often leads to the "Greater Evil" (instability, resentment, occupation), which Aquinas explicitly warns against.
          *   The "Public Authority" must be intrinsic to the polity to ensure the replacement serves *that* polity's good, not the intervener's good.

      *   *The "UN" Angle:*
          *   Aquinas doesn't have the UN. But he has the Pope/Emperor as universal arbiters.
          *   If the UN acts like the Emperor/Popes (universal jurisdiction for peace), it *might* map onto his "superior authority."
          *   But a drone strike is assassination, not a judicial deposition. Aquinas distinguishes between killing a tyrant (assassination) and deposing a tyrant (legal/political act).

  5.  **Synthesize the Response:**
      *   **Acknowledge the sophistication:** Validate the professor's reading (it is indeed nuanced).
      *   **Core Tension:** The definition of "Public Authority" (*publica auctoritas*).
      *   **Point 1: Jurisdiction and Hierarchy.** Aquinas thinks in terms of legal jurisdiction. A foreign king lacks jurisdiction unless he is a *superior* (Emperor) or acting under mandate (Church). Modern sovereignty breaks this.
      *   **Point 2: The Common Good of Whom?** Aquinas prioritizes the local *bonum commune*. Foreign intervention often serves the intervener's good. This risks turning a "tyrannus in exercitio" into a "tyrannus in titulo" (foreign occupier).
      *   **Point 3: The Means (Assassination vs. Deposition).** Aquinas is wary of killing *per se*. He prefers deposition. A drone strike is killing. This leans closer to the "private assassination" he forbids, even if done by a state, because it bypasses the legal process of the community.
      *   **Point 4: The Risk of Greater Disorder.** This is Aquinas's pragmatic brake. Foreign intervention historically creates vacuums. Aquinas would likely be skeptical unless the success of establishing a *better* order is guaranteed.
      *   **Conclusion:** It's structurally different. Aquinas lacks the category of "humanitarian intervention." He would likely view it as Just War (against an aggressor) rather than Tyrannicide (internal correction).

  6.  **Refine the Tone:**
      *   Academic, respectful, collegial.
      *   Avoid definitive "Aquinas would say X." Use "Aquinas's principles suggest..." or "The framework strains here..."
      *   Highlight the *Respublica Christiana* context.

  7.  **Self-Correction/Nuance Check:**
      *   *Did Aquinas support the Crusades?* Yes, under Papal authority. This is a form of foreign intervention sanctioned by a higher authority. This is a strong parallel for the UN angle.
      *   *Is a drone strike "war" or "execution"?* If it's war, it's *Summa* II-II, q. 40 (Just War). If it's tyrannicide, it's *De Regimine*. The student's question blends them. I need to point out this category error.
      *   *Key Text:* *De Regimine Principum* I.6 is the main one. Also *Contra Iudaeos* (on usury/authority)? No, stick to political texts.
      *   *Sedition:* *ST* II-II, q. 42. Sedition is against the unity of the multitude. Foreign intervention disrupts that unity.

  8.  **Final Outline:**
      *   Intro: Validate the class's insight (Aquinas is cautious).
      *   The Definition of *Publica Auctoritas*: It's about jurisdiction, not just manpower.
      *   The Hierarchy Problem: Medieval universalism vs. Modern sovereignty.
      *   The Teleological Problem: Whose *Bonum Commune*?
      *   The Pragmatic Problem: The risk of worse tyranny (occupation).
      *   The Category Shift: Just War vs. Tyrannicide.
      *   Closing: How to frame this for the seminar.

  9.  (Drafting the response based on these points...) *Make sure to emphasize that for Aquinas, authority is tied to the specific community's order, not abstract justice.* *Highlight the distinction between a superior deposing an inferior vs. an equal attacking an equal.*

  10. *Final Polish:* Ensure the distinction between *tyrannus in titulo* (usurper) and *tyrannus in exercitio* (legitimate ruler acting badly) is mentioned, as Aquinas treats them differently. A foreign power might treat a *tyrannus in exercitio* as an enemy, but that's war, not deposition.

  11. *Wait, one more thing:* The UN aspect. The UN is the closest modern analog to the Papacy/Empire in terms of claimed universal jurisdiction. This is the strongest hook for a "Yes, but..." answer.

  12. *Okay, ready to write.*
answer: |-
  This is a fantastic question, and it speaks volumes about the quality of your seminar that the students are pressing on the *structural* logic of Aquinas's argument rather than just the soundbites. You are absolutely right to be wary of mapping modern geopolitical scenarios directly onto thirteenth-century categories, but the friction points are exactly where the philosophical work gets done.

  To give your student a satisfying answer, I suggest avoiding a binary "yes/no" and instead showing them how the foreign intervention scenario breaks Aquinas's framework in three specific places: **jurisdiction**, **teleology (the common good)**, and **the distinction between war and correction.**

  Here is a way to work through the argument that stays faithful to the texts you've already covered (*De Regimine Principum* I.6, *ST* II-II q.42 a.2, and the *Sentences* commentary).

  ### 1. The Problem of Jurisdiction (*Potestas*)
  The core of Aquinas's restriction on tyrannicide is not merely about *who* pulls the sword, but about **whose order is being restored.**

  For Aquinas, political authority is not just power; it is a function of a specific *ordo* (order). In *De Regimine Principum*, when he allows for a "public authority" to depose a tyrant, he is imagining a hierarchy within a single political organism. He gives the example of the Roman people deposing Tarquin (where the authority returns to the people) or a superior lord deposing a vassal (e.g., an Emperor deposing a King).

  In both cases, the deposing authority has **jurisdictional superiority** or **constitutive authority** over the tyrant. The authority removing the tyrant is part of the same legal ecosystem that created the tyrant's office.

  *   **The Modern Mismatch:** A foreign state (even with UN approval) lacks this constitutive jurisdiction. In Aquinas's medieval context, the only entity that might claim jurisdiction over *all* kings is the Pope (in spiritual matters affecting salvation) or the Holy Roman Emperor (in theory, as temporal head of Christendom).
  *   **The Implication:** If a foreign king strikes a tyrant in another realm without being his feudal superior or acting under a mandate from a universal authority (like the Pope), Aquinas would likely classify this not as **judicial deposition**, but as **invasion.** It lacks the internal legal standing to act as a "magistrate" for that community.

  ### 2. The Teleological Problem: *Whose* Common Good?
  Aquinas's definition of tyranny is teleological: a tyrant is one who rules for his private good rather than the *bonum commune* of the multitude (*De Regimine* I.3). Consequently, the remedy must restore the *bonum commune* of **that specific multitude.**

  Aquinas is deeply pragmatic about the "greater evil" problem. He warns that botched attempts to remove a tyrant often lead to worse disorder. But there is a subtler worry in his framework: **the risk of replacing a domestic tyrant with a foreign master.**

  *   **The Argument:** If a foreign power removes a tyrant, they are inherently acting according to *their own* political good (or their interpretation of universal justice), not necessarily the organic common good of the subject population.
  *   **Aquinas's Likely Objection:** He would ask: Does this foreign power have the capacity to install a government that serves the *local* common good, or will they install a puppet regime that serves the *intervener's* good? If the latter, the "tyranny" hasn't ended; the *tyrannus in exercitio* (the local bad king) has simply been replaced by a *tyrannus in titulo* (the foreign occupier).
  *   **The UN Angle:** This is where the UN Security Council nod is interesting. In Aquinas's terms, the UN functions somewhat like the Papacy or the Empire—a universal arbiter claiming jurisdiction over the "peace of Christendom" (or the world). If the UN mandates the action, it *might* satisfy the "superior authority" requirement. However, Aquinas would still worry about the *execution*: does a drone strike constitute a judicial act, or an act of war?

  ### 3. War vs. Correction (The Category Error)
  This is perhaps the most critical distinction for your students. Aquinas treats **tyrannicide/deposition** and **just war** as two different categories with different moral rules.

  *   **Deposition (*De Regimine*):** This is an internal corrective mechanism. It is akin to amputating a diseased limb to save the body. It presupposes a shared political life.
  *   **Just War (*ST* II-II, q.40):** This is an external action between distinct political bodies. It requires a sovereign authority, a just cause, and right intention.

  When a foreign power strikes a tyrant via drone, they are not acting as the "public authority" of the tyrannized people (deposition); they are acting as a belligerent against an enemy (war).

  *   **Why this matters:** If it is **war**, the tyrant is not being "deposed" legally; he is being "targeted" as a combatant. Aquinas allows killing enemy combatants in a just war. So, if the foreign power has a *just cause* (e.g., the tyrant is aggressing against neighbors or slaughtering his own people in a way that violates natural law), the strike might be licit **as an act of war**, but not **as an act of tyrannicide.**
  *   **The Student's Trap:** The student's question assumes the foreign power is stepping into the shoes of the local public authority. Aquinas would say: *No, they are stepping onto the battlefield.* The moral license comes from the laws of war, not the laws of constitutional correction.

  ### 4. Synthesis for the Seminar
  You might frame the answer to your student this way:

  Aquinas's framework doesn't have the resources to validate "humanitarian intervention" as a form of **tyrannicide**, because for him, tyrannicide (or rather, deposition) is an internal juridical act, not an external military one.

  However, his framework **does** have resources to adjudicate it as a **Just War**.
  1.  **If** the foreign power acts under a universal mandate (like the UN acting as a pseudo-Imperial authority)...
  2.  **And** the cause is the defense of the innocent (natural law violation)...
  3.  **And** the intention is to restore a local order capable of pursuing its own *bonum commune* (not occupation)...

  ...then the act might be licit. But it is not because the foreigner became the "public authority" of the tyrannized people. It is because the tyrant, by violating natural law so egregiously, made himself a hostis humani generis (enemy of mankind), subject to coercive force from outside.

  **The "Aquinas Brake":**
  Finally, remind them of Aquinas's caution in *ST* II-II, q. 42, a. 2 regarding sedition. He argues that sometimes tyranny must be endured to avoid greater evils (scandal, war, instability).
  A graduate student should appreciate this: Aquinas would likely look at the modern history of regime change (Iraq, Libya, etc.) and argue that the **disorder** following the strike often violates the *bonum commune* more than the tyranny did. For Aquinas, **order** is a prerequisite for justice. A foreign strike that shatters the political order, even to remove a bad actor, risks failing the utilitarian calculus he implicitly employs.

  ### Summary for the Class
  *   **Is it "Public Authority"?** No, not in the *De Regimine* sense. That requires internal jurisdiction.
  *   **Is it Licit?** Maybe, but under *Just War* theory, not *Tyrannicide* theory.
  *   **The Catch:** Aquinas's "greater evil" proviso would make him deeply skeptical of foreign intervention unless the restoration of a stable, local common good is guaranteed—which, historically, it rarely is.

  This approach respects the integrity of Aquinas's system without forcing him to be a modern liberal interventionist or a strict non-interventionist. It shows the students that the *categories* matter as much as the *conclusions*.
