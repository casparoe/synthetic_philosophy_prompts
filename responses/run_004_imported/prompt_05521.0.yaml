prompt: |-
  I'm a student member of my high school's Honor Council, which hears academic-integrity cases and votes on findings. We're deadlocked on a case, and I'd like a memo to circulate before we reconvene next Tuesday.

  A classmate's English essay was flagged by our school's AI-writing detector as 71% likely to be AI-generated. The council members who read it closely didn't notice anything that struck them as templated, his handwritten in-class drafts are stylistically consistent with it, and he denies using AI. Our handbook says a flag "shall be weighed alongside all other available evidence," but doesn't say how heavily. Half the council wants to treat the flag as close to decisive: we were told when the school adopted the tool that trained readers are barely better than chance at spotting AI prose by eye, while the detector's own accuracy is much higher, and nobody on the council can name a specific flaw in its read of this essay -- only their own impression that it seems genuine. The other half thinks our impression should outweigh a general accuracy statistic, partly because the detector can't explain itself case by case and is known to misfire more often on some writing styles than others, including that of non-native English speakers. One teacher summed up her own position bluntly: she doesn't believe the essay is AI-written, but thinks the council should rule as though it is, since the detector knows better than she does.

  Please draft the memo I'll circulate. It should recommend a specific finding for this case and a standard the council can reuse for future flags, and it should take the strongest version of the "defer to the detector" position seriously rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student member of a High School Honor Council.
      *   **Audience:** Fellow Honor Council members (students) and potentially faculty advisors (though primarily for the council).
      *   **Task:** Draft a memo to circulate before reconvening next Tuesday regarding a deadlocked academic integrity case.
      *   **Case Details:**
          *   Student's English essay flagged as 71% likely AI-generated.
          *   Council readers found no templated feel; style matches handwritten in-class drafts.
          *   Student denies using AI.
          *   Handbook: Flag "shall be weighed alongside all other available evidence" (no specific weight given).
          *   Division: 50/50 split.
              *   *Side A (Defer to Detector):* Tool is more accurate than human intuition (trained readers barely better than chance). No specific flaw identified in this specific read. Teacher view: "Rule as though it is, since the detector knows better."
              *   *Side B (Defer to Human Evidence):* Detector is a black box (no explainability), known false positives (especially for non-native speakers), specific evidence (drafts, style consistency) outweighs general statistics.
      *   **Requirements:**
          *   Recommend a specific finding (Guilty/Not Guilty/No Violation/Violation).
          *   Recommend a standard for future cases.
          *   Take the "defer to the detector" position seriously (steelman it), not dismiss it.
          *   Tone: Professional, reasoned, persuasive, appropriate for a high school honor council context.

  2.  **Determine the Stance/Recommendation:**
      *   *Constraint:* I need to take the "defer to the detector" argument seriously.
      *   *Constraint:* I need to recommend a *specific* finding.
      *   *Ethical/Legal/Procedural Consideration:* In honor councils (and legal systems), the burden of proof usually lies with the accuser. A probabilistic flag (71%) is not definitive proof, especially when contradicted by direct evidence (drafts, stylistic consistency). Relying solely on a black-box algorithm for a disciplinary finding is risky and potentially unfair.
      *   *Decision:* The most defensible position, even when respecting the detector's utility, is "No Violation" (or "Not Responsible") for *this* case, but establishing a standard that acknowledges the detector's role as *investigative* rather than *adjudicative*. This balances the need for integrity with due process.
      *   *Why?* 71% is not "beyond a reasonable doubt" (or even "preponderance of evidence" in many contexts when countered by physical drafts). If the detector is right, it's a false positive. If we punish based on 71% + human doubt, we risk punishing an innocent student. If we don't punish, and they *did* cheat, the system failed once. But punishing innocent students erodes trust in the whole system.
      *   *Refining the Stance:* I will argue for a finding of **No Violation** in this specific instance, but propose a standard where the detector acts as a *trigger for investigation*, not *proof of guilt*. This respects the "defer to detector" crowd by acknowledging its superiority in *detection* but limits its power in *judgment*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the deadlock, state the purpose of the memo (break the impasse, establish precedent).
      *   **Acknowledging the "Defer to Detector" Argument (Steelmanning):**
          *   Acknowledge the teacher's point: Humans are bad at spotting AI.
          *   Acknowledge the stats: The tool is trained on vast datasets; we are not.
          *   Acknowledge the risk: Letting subjective impression override data could let cheaters slip through.
          *   *Crucial nuance:* Validate that the concern is real and logical.
      *   **The Counter-Argument (Specific Evidence vs. General Probability):**
          *   71% is probability, not certainty.
          *   Handwritten drafts are physical evidence of process.
          *   Style consistency is specific to *this* student; the detector is general.
          *   The "Black Box" problem: We can't cross-examine the algorithm.
      *   **The Recommendation (The Finding):**
          *   Vote: No Violation.
          *   Reasoning: Burden of proof not met. Specific evidence outweighs probabilistic flag.
      *   **The Recommendation (The Standard):**
          *   Detector = Investigative Tool, not Adjudicative Verdict.
          *   Need "Corroborating Evidence" beyond the flag (e.g., oral defense, draft discrepancies, specific textual anomalies).
          *   Threshold for guilt should be higher than 71% without corroboration.
      *   **Closing:** Call to action for Tuesday's meeting.

  4.  **Refining Tone and Language:**
      *   *Tone:* Respectful, collaborative, serious. Avoid accusatory language against either faction of the council.
      *   *Vocabulary:* Use terms like "burden of proof," "probabilistic," "corroborating evidence," "due process."
      *   *Addressing the Teacher's Comment:* Handle carefully. Don't undermine the teacher, but distinguish between *teaching judgment* and *judicial judgment*.
      *   *Addressing the Non-Native Speaker Point:* Include this as a risk factor for false positives without making assumptions about the specific student (unless known, but better to keep it general principle).

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I dismiss the detector too much?
      *   *Fix:* Ensure the section validating the detector's accuracy is robust. Admit that human intuition *is* flawed.
      *   *Critique:* Is the recommendation clear?
      *   *Fix:* Make the "Finding" and "Future Standard" distinct sections.
      *   *Critique:* Is 71% addressed?
      *   *Fix:* Explicitly mention that 71% leaves a 29% margin of doubt, which is significant in disciplinary matters.

  6.  **Final Polish:** Check formatting and ensure it sounds like a student leader writing to peers (authoritative but collaborative). (Self-correction: Ensure I don't sound *too* legalistic, but honor councils are quasi-legal, so some formality is expected.)

  7.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Honor Council Student Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation and Proposed Standard Regarding AI-Detection Flags

  **Purpose**

  As we prepare to reconvene next Tuesday regarding the pending academic integrity case, I am circulating this memo to help break our current deadlock. We are evenly split on whether a 71% AI-probability flag constitutes sufficient evidence for a violation, given the absence of stylistic anomalies and the presence of consistent handwritten drafts.

  This memo argues for a finding of **No Violation** in this specific case. Furthermore, it proposes a **Corroborative Evidence Standard** for future cases involving AI flags. My goal is to offer a path forward that respects the technological capabilities of the detector while upholding the due process required of this Council.

  **The Case for Deferring to the Detector**

  I want to begin by addressing the strongest arguments made by the faction of the Council wishing to vote for a violation. We must take seriously the position that the detector should carry decisive weight.

  1.  **Human Limitations:** It is factually correct that human readers are poor at identifying AI-generated text. As noted during our training, studies suggest trained educators often perform no better than chance when guessing based on "feel" alone. Our intuition that the essay "seems genuine" may be a cognitive bias, not an expert assessment.
  2.  **Statistical Superiority:** The detector is trained on a dataset vastly larger than any of our personal experiences with student writing. To ignore its 71% probability rating in favor of our subjective impressions risks establishing a precedent where any student can override data simply by claiming their writing style is "unique."
  3.  **Institutional Trust:** One faculty advisor noted that if we possess a tool designed to protect academic integrity, but we routinely override it based on hunches, we render the tool useless. If the detector is correct, a "No Violation" finding allows cheating to go unpunished, undermining the honor code itself.

  These are valid concerns. We cannot simply ignore the tool because we prefer human judgment. However, acknowledging the tool's utility is different than accepting its output as a verdict.

  **The Limitations of Probabilistic Evidence**

  While the detector is a powerful investigative instrument, there are three critical reasons why its flag alone cannot sustain a finding of responsibility in this instance:

  1.  **Probability vs. Proof:** A 71% likelihood is not a confirmation. In a disciplinary context, where consequences impact a student's record, a 29% margin of doubt is significant. We are asked to rule on what *did* happen, not what *might have* happened.
  2.  **Specific vs. General Evidence:** The detector offers a general probability based on patterns. Conversely, we have specific, physical evidence: handwritten in-class drafts that show the evolution of the student's ideas and match the final essay's stylistic quirks. Specific evidence of process should generally outweigh general statistical probability.
  3.  **The "Black Box" Problem:** The detector cannot explain *why* it flagged the text. It cannot be cross-examined. If we cannot identify the specific flaw in the writing that triggered the flag, the accused student has no way to defend themselves against the specific charge. As noted, these tools have higher false-positive rates for certain writing styles, including those of non-native English speakers. Punishing a student based on an unexplainable algorithmic risk exposes the Council to significant error.

  **Recommendation: Finding for This Case**

  I recommend the Council vote **No Violation**.

  Our Handbook states that a flag "shall be weighed alongside all other available evidence." In this case, the other evidence (drafts, stylistic consistency, student testimony) directly contradicts the probabilistic flag. When specific evidence of process conflicts with a probabilistic flag, the benefit of the doubt must go to the student. To rule otherwise would be to treat the detector as a "guilty until proven innocent" mechanism, which conflicts with the spirit of our honor proceedings.

  **Proposal: A Standard for Future Cases**

  To resolve future deadlocks, I propose we adopt the **Corroborative Evidence Standard**. Under this standard, an AI detection flag is treated as *investigative*, not *adjudicative*.

  *   **The Trigger:** A high-probability flag (e.g., >70%) warrants an investigation, but is insufficient for a finding on its own.
  *   **The Requirement:** To sustain a finding of a violation, the Council requires the flag **plus** at least one form of corroborating evidence. This could include:
      *   Inability of the student to explain their writing choices or process during an interview.
      *   Discrepancies between the submitted work and known in-class writing samples.
      *   Specific textual anomalies identified by a human reader (e.g., hallucinated citations, nonsensical phrasing) that align with AI behaviors.
  *   **The Rationale:** This respects the detector's accuracy as a screening tool without granting it the authority of a judge. It aligns with the teacher's concern that we not ignore the tool, while ensuring that our verdicts are based on demonstrable facts rather than opaque probabilities.

  **Conclusion**

  We can acknowledge that the detector is smarter than we are at spotting patterns without accepting that it is infallible. By voting "No Violation" here, we protect the integrity of our process. By adopting the Corroborative Evidence Standard, we ensure the detector remains a vital part of our toolkit without becoming the sole arbiter of guilt.

  I look forward to discussing this with you all on Tuesday.

  Best,

  [Your Name]
  Honor Council Student Member
