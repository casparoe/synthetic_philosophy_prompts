answer: |-
  First, congratulations on the transformation you've made. Overcoming procrastination and building discipline in both academics and athletics is genuinely difficult, regardless of the metaphysical underpinnings.

  Second, your philosophical intuition is remarkably sharp. You have independently reconstructed one of the most famous and challenging arguments in the history of philosophy regarding free will and moral responsibility. In academic circles, this is often referred to as **Galen Strawson's "Basic Argument"** or the problem of **Ultimate Responsibility**.

  Your reasoning is logically sound:
  1.  To be truly responsible for an action, you must be responsible for the mental state that caused the action.
  2.  Your mental state (your desires, your tolerance for discomfort, your values) is the result of genetics and environment.
  3.  You did not choose your genetics or your environment.
  4.  Therefore, you are not ultimately responsible for your actions.

  If "deserving credit" requires you to be the *uncaused cause* of your own character—a prime mover who existed outside of time and causality to select your own traits—then you are correct: **credit is an illusion.** No human being meets that criteria.

  However, most philosophers and psychologists argue that this definition of "credit" is too high a bar to be useful. Here are three alternative ways to look at your situation that might help you reconcile your achievement with your skepticism.

  ### 1. Compatibilism: Freedom is Alignment, Not Origin
  Compatibilists argue that free will doesn't require you to have chosen your "raw material." Instead, freedom is defined by whether you are able to act according to your own desires without external coercion.

  Think of it this way: A year ago, you had a conflict between two desires.
  *   **Desire A:** Stay in bed, skip practice, avoid studying (Immediate comfort).
  *   **Desire B:** Be an athlete, succeed in school, earn respect (Long-term identity).

  In the past, Desire A won. Recently, Desire B won. Why? Because you cultivated the capacity for Desire B to override Desire A. Even if the *capacity* to value discipline was partly given to you, the **process of alignment** was real. You harmonized your actions with your higher-order values.

  Philosopher Harry Frankfurt called this "second-order volition." You didn't just want to do something; you wanted to *want* to do something. The fact that you successfully aligned your actions with your higher values is where the "credit" lies, not in the magical creation of those values from thin air.

  ### 2. Pragmatism: Credit as Fuel, Not Metaphysics
  From a pragmatic standpoint, the question isn't "Is this metaphysically true?" but "Is this belief useful?"

  Your coach and parents are not making a claim about determinism; they are engaging in **positive reinforcement**. Praise serves a functional role in human psychology. It releases dopamine, reinforces neural pathways associated with the disciplined behavior, and encourages you to continue.

  If you accept the praise, you are more likely to stay disciplined. If you reject it as an "illusion," you risk undermining the very reward system that helped you change. William James, the American pragmatist, might argue that if believing you deserve credit helps you maintain a life you value, then that belief is "true enough" for the purpose of living.

  ### 3. The Reality of Effort
  Even if the *spark* wasn't chosen, the *burning* was.

  Let's grant your premise: The initial motivation (embarrassment, desire for approval) was unchosen. However, motivation is fleeting. Everyone feels a spark of desire to change eventually. What separates the people who change from the people who don't is the **sustained friction**.

  You didn't just have the "raw material"; you put that material through a grinder. You woke up when you didn't want to. You studied when you were tired. You felt the resistance of your old habits and pushed through it. That resistance was real. The mental energy expended was real.

  To say you deserve no credit because you didn't choose your starting point is like saying a sculptor deserves no credit for a statue because they didn't create the stone. The stone was given, yes. But the *shaping* of it required work, vision, and struggle. You are both the stone and the sculptor. The fact that the sculptor is made of stone doesn't negate the effort of the carving.

  ### A Synthesis for Your Peace of Mind
  You are wrestling with the difference between **Ultimate Responsibility** (metaphysical) and **Attributable Responsibility** (social/practical).

  *   **Ultimate Responsibility:** Did you create yourself from nothing? No.
  *   **Attributable Responsibility:** Did the change happen *through* you? Yes.

  Your parents and coach are right to be proud, not because you are a magical entity free from causality, but because **you are the locus where the change happened.** The universe could have arranged itself such that you stayed procrastinating. It didn't. It arranged itself such that you struggled, fought, and won.

  **My suggestion:**
  Accept the paradox. You can hold two thoughts at once:
  1.  "I am a product of my biology and environment, and I didn't choose the hand I was dealt."
  2.  "I played that hand with courage and effort, and the outcome is mine."

  You don't need to be the author of your own existence to be the author of your own year. Take the pride. Not because you are a god, but because you are a human being who did something difficult. That is enough.
