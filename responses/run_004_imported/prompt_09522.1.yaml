answer: |-
  Your intuition is serving you well here. What your husband is doing is a classic category error: he is taking a framework designed for understanding *emotional dynamics* and applying it to *financial fiduciary duties*, where it does not belong.

  You are not refusing to accept how shared systems work. You are correctly identifying that a "system" requires interaction, and secrecy precludes interaction.

  Here is a breakdown of why his argument is flawed, why your therapist's logic was valid in its own context, and how to handle this in mediation.

  ### 1. Therapy vs. Mediation: Different Goals, Different Rules
  Your couples therapist was operating under a **systemic model**. In therapy, the goal is healing and connection. Assigning "fault" often leads to defensiveness, which halts progress. By focusing on the "pattern" (you pursue, he withdraws), the therapist was trying to help you both see how you *react* to one another so you could change the dance. In that context, asking "who started it?" is indeed unproductive because emotional cycles are circular.

  Mediation operates under a **legal and equitable framework**. The goal is not healing; it is the fair division of assets and responsibilities. In this context, actions have linear consequences.
  *   **Therapy:** "We are both stuck in a cycle of distrust."
  *   **Mediation:** "One party concealed an asset, violating the duty of full financial disclosure."

  Your husband is trying to import the rules of the first game into the second game because the rules of the second game hold him accountable.

  ### 2. The Logic of Secrecy Breaks the "System"
  Systems theory relies on feedback loops. Action A triggers Reaction B, which triggers Action C.
  *   **The Pattern:** You raise a concern $\rightarrow$ He withdraws $\rightarrow$ You push harder. This is a system because both parties are participating in real-time.
  *   **The Secret Account:** He moves money $\rightarrow$ You do nothing (because you don't know).

  You cannot be part of a "pattern" regarding an action you were unaware of. If he hid the money, there was no feedback loop. There was no "we." There was only "him." By invoking the systemic view, he is implying that your ignorance was somehow a collaborative contribution to his concealment. That is logically impossible.

  ### 3. "Fault" vs. "Accountability"
  This is the crux of the sleight of hand.
  *   **Fault** is about moral blame for feelings or relationship breakdown. Your therapist was right to minimize this; relationship breakdown is rarely 100% one person's "fault."
  *   **Accountability** is about ownership of specific choices and their consequences.

  You can acknowledge that the *marriage* failed due to a shared pattern while simultaneously holding him *individually accountable* for the specific act of moving funds. One does not cancel out the other. Accepting that you had a difficult dynamic does not require you to accept liability for his unilateral financial decisions.

  ### 4. Why This Feels Like Gaslighting
  It feels like a sleight of hand because it is a form of intellectual gaslighting. He is using a "truth" (we had a dysfunctional pattern) to obscure a "fact" (I hid money).
  *   It invalidates your reality by suggesting your lack of knowledge was part of the "system."
  *   It uses the authority of the past therapist to shield him from current consequences.
  *   It conflates emotional reciprocity with financial transparency.

  ### How to Handle This in Mediation
  Do not get drawn into debating relationship theory. That is a trap. If you start arguing about the nature of systems, you are playing on his turf, using his logic.

  Instead, pivot firmly to the legal and factual reality. You might say something like:

  > *"I agree that our relationship had complex dynamics, and I take responsibility for my part in our communication patterns. However, mediation is not about assigning blame for the relationship ending; it is about full financial disclosure. A secret account is not a 'pattern' we built together; it is a unilateral action taken without my knowledge. I cannot be part of a system regarding information I did not have. We need to focus on the full disclosure of assets, not the psychology of our marriage."*

  ### Summary
  Your husband is misusing a legitimate therapeutic concept.
  *   **Therapist's Logic:** Valid for emotional cycles and communication.
  *   **Husband's Application:** Invalid for financial concealment and legal disclosure.

  You are not being unreasonable. You are drawing a necessary boundary between **shared emotional responsibility** and **individual financial integrity**. In mediation, keep the focus on the latter.

  ***Disclaimer:** I am an AI assistant and not an attorney or mediator. Divorce laws vary significantly by jurisdiction, particularly regarding financial disclosure and asset division. Please consult with your mediation professional or legal counsel regarding the specific implications of hidden assets in your case.*
