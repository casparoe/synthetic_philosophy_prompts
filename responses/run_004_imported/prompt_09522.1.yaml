prompt: |-
  My husband and I are currently going through divorce mediation, and something from our years of couples counseling keeps resurfacing. Our therapist always resisted questions about whose fault our problems were, insisting instead that we examine "the pattern" we had built together: how my raising concerns made him withdraw, which made me push harder, which made him withdraw further still, without a clear point of origin in either of us. He has now started invoking this in mediation to argue that it's unreasonable for me to hold him individually accountable for concrete things he did — like secretly moving a large sum of our savings into an account I didn't know existed — since, on the therapist's own logic, no single person's actions really explain what happened once you're looking at the relationship as a whole system. Something about this feels like a sleight of hand to me, but I can't say our therapist's picture of the pattern was wrong either. Is he misusing a legitimate way of understanding relationships in order to dodge accountability, or am I just refusing to accept how these shared systems actually work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Divorce mediation.
      *   **Conflict:** The husband is using a concept from past couples therapy ("the pattern" or systemic view) to avoid individual accountability for specific actions (hiding money).
      *   **Husband's Argument:** Since the therapist said problems are systemic (no clear origin), he shouldn't be held individually accountable for concrete actions like moving savings secretly.
      *   **User's Feeling:** It feels like a "sleight of hand" (manipulation/dodging), but she acknowledges the therapist's systemic view wasn't necessarily "wrong" regarding emotional dynamics.
      *   **Core Question:** Is he misusing a legitimate therapeutic concept to dodge accountability, or is she refusing to accept how shared systems work?

  2.  **Deconstruct the Therapeutic Concept vs. Legal/Ethical Reality:**
      *   **Therapeutic Concept (Systems Theory):** In couples therapy, focusing on "who started it" is often counterproductive. It leads to blame games. Focusing on the *cycle* (pursue-withdraw, etc.) helps break the dynamic. This is valid for *emotional interactions* and *communication patterns*.
      *   **Legal/Ethical Reality (Divorce/Finances):** Divorce mediation and law operate on principles of fiduciary duty, transparency, and asset division. Hiding assets is not a "communication pattern"; it's a specific act of financial concealment, often illegal or at least a severe breach of trust/legal obligation.
      *   **The Mismatch:** The husband is applying a framework designed for *emotional reciprocity* to a situation involving *unilateral financial action*.

  3.  **Evaluate the Husband's Argument:**
      *   **Is it valid?** No. Systems theory explains how partners *react* to each other. It does not explain how one partner *secretly* moves money without the other's knowledge. If the other partner doesn't know, they can't be part of the "pattern" regarding that specific action.
      *   **Is it manipulation?** Yes, likely unintentional or semi-conscious, but it functions as gaslighting. It takes a truth (we have a dynamic) and applies it to a context where it doesn't fit (financial fraud/concealment) to evade consequences.

  4.  **Formulate the Response:**
      *   **Validate the User:** Acknowledge her intuition. It *is* a sleight of hand. She isn't crazy.
      *   **Distinguish Contexts:** Clearly separate *therapeutic frameworks* (emotional dynamics) from *legal/financial realities* (fiduciary duty, asset disclosure).
      *   **Explain the Limit of Systems Theory:** Systems theory requires interaction. Secrecy precludes interaction. You can't have a "pattern" of interaction around something one person hides.
      *   **Address the "Fault" vs. "Accountability" Distinction:** Therapy avoids "fault" to promote healing. Mediation requires "accountability" to ensure fairness.
      *   **Actionable Advice:** How to handle this in mediation? Don't argue therapy theory; argue facts and law.
      *   **Tone:** Empathetic, clear, firm, non-judgmental but decisive.

