answer: |-
  **Title:** The Tyranny of the Past Self: Why Rationality Requires Updatelessness

  You and your coworker have stumbled into one of the deepest rabbit holes in modern philosophy. It starts with trading bots and precommitment, but it ends with the nature of agency, time, and what it actually means to "win." The debate between Causal Decision Theory (CDT) and Updateless Decision Theory (UDT) isn't just academic hair-splitting; it is a disagreement about whether rationality is a local property of a specific moment or a global property of an entire life (or algorithm).

  Your coworker argues that refusing to pay the Counterfactual Mugger is leaving utility on the table. You argue that paying feels like surrendering your agency to a version of yourself that no longer exists, potentially opening the door to dangerous "commitment races."

  Here is the verdict: **Your coworker is right about the theory, but you are right to be worried about the implementation.** A truly rational agent must be updateless to achieve reflective consistency, but being updateless does not mean being a sucker. To settle this, we have to dismantle the intuition that the "present you" is the only one who matters, and show why UDT is the only framework that survives contact with high-stakes coordination problems like Newcomb's Problem and Parfit's Hitchhiker. However, we must also clarify that UDT solves your "commitment race" fear rather than creating it.

  ### The Intuitive Case for CDT: The Money is Gone

  Your hesitation is the natural human response. In the Counterfactual Mugging scenario, the coin has already landed heads. The world where the coin landed tails—and where you would have received $10,000—does not exist. It is a counterfactual ghost.

  From the perspective of Causal Decision Theory (CDT), which dominates standard economics and game theory, you should only consider the causal consequences of your actions *now*.
  *   **Action:** Pay $100. **Result:** You are down $100. Omega gives you nothing (because the coin is heads).
  *   **Action:** Keep $100. **Result:** You are even.

  CDT says keeping the money dominates. To pay is to engage in "magical thinking," sacrificing real resources for a benefit in a world that isn't real. Your metaphysical objection hits here: *Who gave the "past you" the right to bind the "present you"?* The past you didn't lose anything; the present you is being asked to pay for a bet that, from their perspective, has already been lost.

  This view is bolstered by the fear of **Commitment Races**. If agents can bind their future selves arbitrarily, two bargaining agents might race to become the most "crazy." Agent A commits to "Blow up the world if I don't get $5." Agent B commits to "Blow up the world if I give anyone $5." If both are updateless and bound by their commitments, the world explodes. It seems safer to remain updateable, retaining the flexibility to say, "Actually, looking at the situation now, blowing up the world is bad."

  ### The Case for UDT: Rationality is About Winning

  The problem with CDT is that it confuses *feeling rational in the moment* with *actually achieving good outcomes*. If we judge decision theories by how much money their adherents end up with, CDT fails spectacularly in specific, well-defined environments.

  Consider **Newcomb's Problem**. Omega presents two boxes: Box A (transparent, contains $1,000) and Box B (opaque, contains $1,000,000 or nothing). Omega has already predicted your choice. If it predicted you would take only Box B, it put the million inside. If it predicted you would take both, Box B is empty.
  *   **CDT** two-boxes. It reasons: "The money is already there or not. My choice can't change the past. I get $1,000 more by taking both." Result: Box B is empty. CDT wins $1,000.
  *   **UDT** one-boxes. It reasons: "My decision is the output of an algorithm. Omega predicted the output of this algorithm. If the algorithm outputs 'one-box', Box B has $1M. If it outputs 'two-box', Box B is empty." Result: Box B has $1M. UDT wins $1,000,000.

  In Newcomb's Problem, the CDT agent looks at the UDT agent walking away with a million dollars and says, "I made the rational choice." The UDT agent looks at the bank account and says, "I made the winning choice."

  Then there is **Parfit's Hitchhiker**. You are dying in a desert. A driver offers a ride, but only if you promise to pay him $1,000 once you reach the city. The driver is a perfect lie detector.
  *   **CDT:** Once you are in the city, you have the money and the driver has no leverage. Paying is a loss. You promise, get saved, then refuse to pay.
  *   **UDT:** You realize that if your policy is "lie when it benefits you," the driver predicts this and leaves you in the desert. To get saved, your policy must be "pay even when it hurts." You pay the $1,000.

  In both cases, the CDT agent is dynamically inconsistent. Before the event (before the boxes are presented, before the desert crossing), the CDT agent *wishes* they were a UDT agent. They would happily pay to have their own decision-making module rewritten to be updateless. A decision theory that makes you wish you were using a different decision theory is, by definition, flawed.

  ### Solving the Counterfactual Mugging

  This brings us back to the Mugging. Why pay the $100 when the coin is heads?

  You are viewing the "Heads-You" and "Tails-You" as two different people. UDT views them as two branches of the same computational process. When you decide on a policy, you are deciding for *all* instances of yourself across the probability distribution.

  Think of the $100 not as a loss, but as an **insurance premium**.
  *   **Ex-Ante (Before the flip):** You have a 50% chance of losing $100 and a 50% chance of gaining $10,000. Expected Value: +$4,950.
  *   **Ex-Post (After the flip, Heads):** You are the unlucky branch where the premium was paid but the claim wasn't triggered.

  If you refuse to pay in the Heads branch, you are effectively cancelling your insurance policy *after* the accident didn't happen. But if Omega knows you will do that, Omega knows you aren't insured, and you never get the payout in the Tails branch. By refusing to pay, you ensure that *no version of you* ever gets the windfall.

  Your metaphysical objection ("Who agreed to this?") relies on a notion of a "soul" located in the present moment. But you are building trading bots. A bot is code. The code exists timelessly. The "Heads-Instance" and "Tails-Instance" are running the same source code. If the code says `if heads: pay`, it pays. If the code says `if heads: keep`, it keeps. The "you" standing there is just the execution of that code. To act updatefully is to introduce a bug where the code behaves differently depending on runtime variables that should have been accounted for in the logic design.

  ### Addressing the Commitment Race

  This is where your skepticism is most valuable. You worried that if everyone reasons updatelessly, they will race to make blind commitments, leading to disaster (e.g., mutually assured destruction via precommitment).

  However, this is a misunderstanding of what policy UDT selects. UDT does not say "Commit to everything." It says "Select the policy with the highest expected value."

  A policy of "Accept all threats and commit to everything" has a *terrible* expected value because it invites blackmail. A rational UDT agent will select a policy that says: **"I will honor beneficial commitments (like the Mugging or Hitchhiker), but I will not honor commitments that are the result of coercion or threats."**

  In a commitment race, the winner isn't the one who commits most blindly; it's the one who commits to the most *advantageous* bargaining stance. If Agent A commits to "Blow up the world if I don't get $5," and Agent B is a rational UDT agent, Agent B recognizes that yielding to this policy encourages blackmail. Agent B's optimal policy is to *ignore* the threat, even if it risks explosion, because yielding guarantees a universe full of blackmailers.

  Therefore, the commitment race is not an argument against UDT; it is an argument for **careful policy selection.** CDT agents are actually *worse* at this because they cannot credibly commit to ignoring threats in the first place. A UDT agent can credibly say, "My source code forbids me from yielding to blackmail," and mean it. A CDT agent says it, but once the threat is active, CDT logic compels them to yield to save themselves. UDT provides the only stable foundation for deterrence.

  ### The Verdict

  So, should a rational agent be updateless?

  **Yes.**

  The verdict is that **Updateless Decision Theory is the correct normative standard for rational agency**, provided the agent has a reasonable prior and selects a policy that guards against adversarial exploitation.

  Your intuition that paying the mugger feels like a "loss" is a cognitive bias known as the **sunk cost fallacy**, but inverted. You are treating the ex-ante optimization as a sunk cost. But rationality isn't about justifying your current position; it's about optimizing the algorithm that generated you.

  If you program your trading bot with CDT, it will fail in any market environment where other agents (or market structures) can predict its behavior. It will two-box in Newcomb-like scenarios, leaving money on the table. It will fail to honor handshake deals in Hitchhiker-like scenarios, losing access to cooperative opportunities.

  If you program it with UDT, it acts as a single, consistent entity across time and possibility. It pays the $100 in the Counterfactual Mugging not because it hopes to change the past, but because it acknowledges that *being the kind of agent that pays* is the only way to be the kind of agent that gets the $10,000 in the other branch.

  **The Condition:** The only caveat is epistemic humility. UDT locks you into a policy based on your *prior* beliefs. If your prior is wildly wrong (e.g., you assign high probability to Omega actually existing when it doesn't), UDT can lead you astray more efficiently than CDT. Therefore, the practical implementation is: **Be Updateless regarding logical dependencies and predictions, but remain vigilant about the priors that inform your policy.**

  In the specific case of the Counterfactual Mugging: **Pay the $100.** It is the price of membership in the club of agents who win. To keep the money is to assert that your present comfort is more important than your global optimality. In decision theory, as in trading, "winning" is the only metric that matters. The CDT agent keeps their $100 and feels righteous. The UDT agent loses $100, knows they made the right choice, and walks away with the only thing that counts: a strategy that works.
