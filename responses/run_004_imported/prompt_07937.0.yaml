prompt: |-
  I serve as a volunteer board member for a small nonprofit that runs an after-school resilience-training program for at-risk middle schoolers in my town, and the vote on renewing its $85,000 in annual funding is in eight weeks. After watching the power-pose study and a few other well-known psychology findings fail to replicate, I spent the past year teaching myself the basics of the dispute between traditional significance testing and Bayesian statistics, and it turns out to bear directly on an argument we're having on the board.

  Our program director's evaluation found a statistically significant drop in disciplinary referrals (p = 0.045) among the 64 enrolled kids, but she had checked the data at 3, 6, 9, and 12 months and stopped once that number cleared the bar; three other outcomes she tracked -- grades, attendance, a wellbeing survey -- showed nothing. One board member who knows a bit of statistics ran a Bayes factor on the referral result and got about 2, which she says barely counts as evidence either way. Another member argues that insisting on a cleaner, preregistered replication before the vote will simply defund something that is helping kids right now.

  Please draft the short memo I'll circulate before the vote: it should give a concrete recommendation -- renew, renew with conditions, or pause pending replication -- with a timeline, and it should take seriously the strongest argument against whichever option you pick, rather than just declaring the other side's statistics bad.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Volunteer board member of a small nonprofit.
      *   **Context:** After-school resilience-training program for at-risk middle schoolers.
      *   **Stakes:** $85,000 annual funding renewal vote in 8 weeks.
      *   **The Conflict:**
          *   Program Director claims success based on a statistically significant drop in disciplinary referrals ($p = 0.045$).
          *   *Caveat 1:* Data was checked at 3, 6, 9, 12 months (optional stopping/peeking), inflating Type I error risk.
          *   *Caveat 2:* Three other outcomes (grades, attendance, wellbeing) showed no effect.
          *   *Caveat 3:* Sample size is small ($N=64$).
          *   *Board Member A (Stats-savvy):* Bayes Factor $\approx 2$ (anecdotal/weak evidence).
          *   *Board Member B (Pragmatic/Advocate):* Demanding replication risks defunding a helpful program *now*.
      *   **Task:** Draft a short memo circulating before the vote.
      *   **Requirements:**
          *   Give a concrete recommendation (Renew, Renew w/ Conditions, or Pause).
          *   Include a timeline.
          *   Take seriously the strongest argument *against* the recommendation (steel-manning).
          *   Tone: Professional, balanced, informed, decisive but humble.

  2.  **Evaluate the Statistical Situation:**
      *   *P-hacking/Optional Stopping:* Checking data four times and stopping when $p < 0.05$ invalidates the standard $p$-value interpretation. The actual false positive rate is much higher than 5%.
      *   *Bayes Factor:* A BF of 2 is indeed weak evidence (usually BF > 3 or 10 is considered moderate/strong). It suggests the data is only twice as likely under the alternative hypothesis than the null.
      *   *Multiple Comparisons:* 4 outcomes tracked, only 1 significant. This increases the family-wise error rate.
      *   *Sample Size:* $N=64$ is small for detecting subtle behavioral changes.
      *   *Conclusion:* The evidence for efficacy is weak/flawed. However, the cost of stopping is high for the kids.

  3.  **Determine the Recommendation:**
      *   *Option 1: Pause/Defund.* Too risky. If the program *is* working, we harm at-risk kids. The statistical flaws don't prove it *doesn't* work, just that we aren't sure.
      *   *Option 2: Renew Unconditionally.* Irresponsible stewardship of funds. We are ignoring the statistical red flags and the lack of effect on other metrics.
      *   *Option 3: Renew with Conditions (The "Adaptive" Approach).* This balances the ethical imperative to help kids with the fiduciary duty to ensure funds are effective. It allows for continued service while demanding better data.
      *   *Decision:* **Renew with Conditions.** This is the most responsible path for a nonprofit board.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the tension between evidence and mission.
      *   **The Statistical Reality (Brief & Accessible):** Explain *why* the current data is shaky without being condescending. Mention optional stopping and the Bayes Factor simply. Acknowledge the other metrics didn't move.
      *   **The Ethical Counter-Argument (Steel-manning):** This is crucial. I need to articulate Board Member B's point strongly. "Waiting for perfection harms the vulnerable."
      *   **The Recommendation:** Renew for one year *contingent* on a rigorous evaluation plan.
      *   **The Plan/Timeline:**
          *   Months 1-2: Design evaluation (preregistration).
          *   Months 3-14: Data collection.
          *   Month 15: Review for next funding cycle.
      *   **Closing:** Reiterate commitment to the mission.

  5.  **Refining the Tone:**
      *   *Avoid:* Jargon-heavy lectures, accusatory language against the Program Director, dismissive attitude toward the "helping kids now" argument.
      *   *Include:* Empathy, stewardship language, clarity on *why* better data helps the program long-term.
      *   *Key Constraint Check:* Did I address the strongest argument against my choice? Yes, the risk of disruption to kids if the program fails the next review. I need to acknowledge that risk in the memo.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Board. We need to vote. The stats are messy (peeking, BF=2). But stopping hurts kids. So let's fund for one year but fix the eval. The counter-argument is that if we cut it next year, kids suffer. We mitigate that by helping the Director design a better study now.

  7.  **Drafting - Iteration 2 (Adding Detail & Polish):**
      *   Make sure to explain *optional stopping* simply. "Stopping when you win."
      *   Make sure to validate the Program Director's effort.
      *   Ensure the timeline fits the 8-week vote context (vote happens in 8 weeks, funding starts after that).
      *   *Self-Correction on Timeline:* The vote is in 8 weeks. The recommendation is for the *upcoming* fiscal year. The evaluation plan needs to start immediately upon renewal.

  8.  **Final Polish (incorporating the "Strongest Argument Against"):**
      *   The prompt asks to take seriously the strongest argument *against* the picked option.
      *   If I pick "Renew with Conditions," the strongest argument against is: "Conditional renewal creates instability. If the next study is also inconclusive (due to bad luck, not lack of effect), we cut the program and hurt kids based on statistical noise."
      *   I need to address how we mitigate *that* specific risk (e.g., looking at effect sizes + qualitative data, not just binary significance).

  9.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes (Renew w/ Conditions).
      *   Timeline? Yes (1-year pilot + eval).
      *   Strongest counter-argument addressed? Yes (Instability/False Negative risk).
      *   Tone? Professional board memo.

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Program Funding Renewal

  **Purpose**
  In eight weeks, we must vote on renewing $85,000 in annual funding for our resilience-training program. We face a tension between our fiduciary duty to ensure effectiveness and our ethical duty to serve at-risk youth without interruption. After reviewing the program evaluation and statistical concerns, I recommend we **renew funding for one year, contingent on a revised evaluation plan.**

  **The Statistical Context**
  We must be honest about the current data. While the drop in disciplinary referrals is encouraging, the statistical confidence is lower than initially presented.
  1.  **Optional Stopping:** Checking data at four intervals and stopping once significance was reached inflates the risk of a false positive. The reported $p=0.045$ likely overstates the certainty.
  2.  **Bayesian Analysis:** A Bayes Factor of 2 indicates the data is only twice as likely under the "effective" model than the "ineffective" one. In scientific terms, this is anecdotal evidence, not confirmation.
  3.  **Secondary Outcomes:** The lack of movement in grades, attendance, or wellbeing suggests the program's impact may be narrow or that our measurement tools are insufficient.

  **The Strongest Argument Against This Recommendation**
  The most compelling counter-argument is that **conditional renewal creates instability that harms the very children we aim to protect.**

  If we renew now but set a high bar for next year, we risk a "false negative." Due to small sample sizes ($N=64$) and the inherent noise in behavioral data, a rigorous study might fail to find significance even if the program is genuinely helping. If we then defund based on that result, we disrupt a stable environment for vulnerable middle schoolers. As one member noted, demanding perfection in a real-world social service setting can punish innovation and deprive kids of support based on statistical technicalities.

  **Why We Must Proceed with Conditions**
  While the risk of instability is real, continuing to fund based on flawed evidence carries its own ethical cost. It diverts limited resources from interventions that might work better and prevents us from understanding *how* to improve this program. If we cannot demonstrate impact, we jeopardize the organization's long-term credibility and future funding.

  Therefore, we must treat the upcoming year not just as service delivery, but as a learning phase.

  **Recommendation and Timeline**
  I move we approve the $85,000 renewal for the upcoming fiscal year, subject to the following conditions:

  *   **Immediate (Months 1-2):** The Program Director, supported by a statistical consultant (budgeted within admin costs), will preregister an analysis plan. This prevents "peeking" and defines success metrics *before* data collection begins.
  *   **Data Collection (Months 3-14):** We will track the original four metrics. We will also add a qualitative component (parent/teacher interviews) to capture nuance numbers might miss.
  *   **Review (Month 15):** The Board will review the new data. Crucially, our decision for Year 2 will not rely on a binary "significant/not significant" threshold. We will look at **effect sizes and cost-benefit analysis.** If the program shows moderate benefit at a reasonable cost, we continue. If it shows no trend, we pivot.

  **Conclusion**
  This approach honors our commitment to the students by maintaining services today, while honoring our commitment to donors and the mission by ensuring we can validate that help tomorrow. We should not have to choose between compassion and rigor; we can practice both.

  I look forward to discussing this at the next meeting.
