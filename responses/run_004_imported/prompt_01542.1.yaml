answer: |-
  It is understandable why the rationalist blogosphere might treat Sharon Street's "A Darwinian Dilemma for Realist Theories of Value" (2006) as a decisive blow against non-naturalist moral realism. The argument leverages evolutionary psychology and naturalistic premises in a way that resonates deeply with communities prioritizing scientific naturalism and Bayesian coherence.

  However, in professional academic metaethics, the matter is far from closed. Derek Parfit was acutely aware of Street's argument (and the similar evolutionary debunking argument by Richard Joyce) and engaged with them directly in *On What Matters* (2011). Parfit did not ignore the dilemma; he believed he had solved it.

  To understand why the debate remains open, we need to look at where the rationalist consensus might be over-indexing on Street's premises and how Parfit (and other contemporary realists) rebut the Dilemma.

  ### 1. The Core of Street's Dilemma
  Street argues that if moral realism is true (moral facts exist independently of our attitudes), and evolution shaped our moral attitudes (for fitness, not truth), then the alignment between our attitudes and the independent facts is either:
  1.  **A Tracking Account:** Evolution selected for our ability to detect independent moral truths. (Street argues science undermines this; evolution selects for fitness, not truth).
  2.  **A Coincidence Account:** It is a massive cosmic coincidence that the attitudes evolution selected for happen to match the independent moral truths. (Street argues this is scientifically implausible).

  Street concludes we must abandon realism for a constructivist view where moral truths are constituted by our evaluative attitudes.

  ### 2. Parfit's Rebuttal: Why It Wasn't Ignored
  Parfit addresses this explicitly in Volume 2 of *On What Matters*. His defense rests on several key distinctions that the "closed case" narrative often overlooks.

  #### A. The Mathematical Analogy (Necessary Truths)
  Parfit treats normative truths as **necessary truths**, akin to mathematical or logical truths.
  *   **The Argument:** Evolution shaped our capacity for mathematical reasoning because counting and logic aided survival. However, the truth of $2+2=4$ is not dependent on evolution. The fact that evolution shaped our belief-forming mechanisms does not debunk the *content* of those beliefs.
  *   **The Rebuttal to Street:** Parfit argues Street conflates the *causal explanation* of why we have beliefs with the *justification* for those beliefs. Even if evolution caused us to believe in normative truths, those truths could still be objective. The genealogy of a belief does not determine its truth value (avoiding the genetic fallacy).

  #### B. The "Third-Factor" or "Common Cause" Reply
  This is the most potent realist counter-argument (championed by David Enoch, but consistent with Parfit's views).
  *   **The Argument:** Street presents a false dichotomy. It is not just "Evolution $\rightarrow$ Beliefs" vs. "Moral Facts $\rightarrow$ Beliefs."
  *   **The Rebuttal:** There could be a **third factor** that explains both. For example, if *survival/reproduction is objectively good*, then evolution selecting for behaviors that promote survival is indirectly selecting for *true* moral beliefs.
  *   **Parfit's Nuance:** Parfit doesn't necessarily need to claim survival is the *highest* good. He argues that there are enough basic normative truths (e.g., "pain is bad," "cooperation is generally better than unprovoked violence") that align with fitness such that the correlation is not miraculous.

  #### C. The Self-Defeat Objection
  Parfit argues that Street's constructivism faces its own version of the dilemma.
  *   **The Argument:** If our evaluative attitudes are shaped by evolution for fitness, and moral truths are just reflections of those attitudes (as Street claims), then our moral truths are still ultimately grounded in fitness-maximizing illusions.
  *   **The Rebuttal:** If evolutionary pressure distorts our view of the world, it distorts our *attitudes* just as much as it would distort our *perception of facts*. Street's view doesn't actually escape the evolutionary shadow; it just hides inside our subjective attitudes. Parfit suggests realism is actually *more* stable here because it allows for the possibility that our evolved attitudes are *wrong* and can be corrected by reason.

  ### 3. Why the Rationalist Sphere Treats It as "Closed"
  If Parfit's rebuttals are substantial, why does the rationalist community often view Street as having won?

  1.  **Ontological Parsimony:** Rationalist discourse often heavily weights Occam's Razor. Non-natural realism posits entities/truths that are causally inert. To a naturalist, this looks like "spooky action." Street's argument validates the intuition that we shouldn't posit queer entities if evolution explains our beliefs without them.
  2.  **Epistemic Access:** The "Access Problem" is central. If moral facts don't interact causally with the physical world, how do we know them? Street argues we can't. Parfit argues we know them via rational intuition (just as we know logic). For a community focused on empirical Bayesian updating, "rational intuition" often feels like a black box.
  3.  **Conflation of Normativity and Motivation:** Many in the rationalist sphere lean towards Humean theories of motivation (beliefs don't motivate, desires do). Parfit defends a Kantian/Cognitivist view (believing you ought to do X can motivate X). If you assume Humeanism is true, Parfit's project looks dead on arrival, regardless of Street.

  ### 4. Is the Debate Actually Open?
  Yes. In professional philosophy, the post-2006 landscape is not "Realism is dead," but rather "Realism had to get more sophisticated."

  *   **Refined Realism:** Realists no longer claim moral properties are physical or causally potent. They argue they are *sui generis* normative properties.
  *   **Quasi-Realism:** Simon Blackburn's project attempts to earn the right to talk "as if" realism is true without the metaphysical baggage, which is a live competitor to both Street and Parfit.
  *   **The "Companions in Guilt" Argument:** If Street's argument debunking morality also debunks logic, math, or epistemic norms (like "you ought to believe what is supported by evidence"), then her argument is self-undermining. Street has spent years trying to distinguish ethics from epistemology to avoid this, but many (including Parfit) argue the distinction doesn't hold.

  ### Summary
  Parfit was not failing to engage; he was engaging with a premise he believed was category-error prone. He viewed Street's dilemma as assuming that normative truths must be the *kind of thing* that could be tracked by evolution (like predator avoidance), whereas he viewed them as necessary truths discoverable by reason.

  The rationalist blogosphere's consensus reflects a specific **naturalistic prior**: if it isn't natural, it isn't real. Parfit's work is a challenge to that prior, arguing that normativity is real but non-natural. Whether you find Parfit convincing depends less on Street's evolutionary argument and more on whether you accept that **necessary normative truths** are coherent entities.

  So, the debate is not closed. It has simply shifted from "Evolution explains morality" to "What is the metaphysical status of normative reasons, and can reason alone access them?" That is very much an open question.
