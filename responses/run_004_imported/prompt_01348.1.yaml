  2.  **Deconstruct Dummett's Core Arguments (based on *On Immigration and Refugees*):**
      *   *The Presumption:* There is a fundamental right to move. Restrictions need *substantial* justification.
      *   *Racism:* He argues UK restrictions since 1962 were motivated by racial prejudice, not economic necessity.
      *   *The "Submersion" Clause:* A host community has a right to preserve its character, but the threshold for "submersion" is very high. It cannot be used as a pretext for racism. It requires evidence of genuine social disintegration, not just cultural change.
      *   *Global Justice:* Rich nations have obligations to poor nations. Restricting movement exacerbates global inequality.
      *   *Refugees:* Strict adherence to the Geneva Convention. Refugees have a special claim that overrides general immigration control. Processing must be fair and onshore (implied by the nature of asylum seeking).

  3.  **Apply to Policy 1: Ending EU Free Movement (Brexit):**
      *   *Context:* End of automatic right to live/work for EU citizens. Introduction of points-based system.
      *   *Dummett's Likely View:*
          *   *Presumption:* This is a restriction. Does it meet the "substantial reason" test? Brexit arguments were often about sovereignty and control, which Dummett might view as thinly veiled nativism (similar to his critique of 1960s legislation).
          *   *Racism/Nativism:* He would likely scrutinize the rhetoric ("take back control") for racial undertones, even if EU citizens are mostly white. He might argue it reinforces an exclusionary national identity.
          *   *Economic/Social Impact:* He would ask if the restriction prevents "submersion." Given EU migration levels, was submersion a real risk? Probably not, by his high standard.
          *   *Tension:* Dummett valued democratic self-determination. If the public voted for this, does their "right not to be submerged" (culturally/politically) trump the presumption of free entry? He acknowledges the community's right to determine its character, but sets the bar high.
      *   *Drafting the argument:* Focus on the shift from a presumption of openness to a presumption of closure. Highlight his skepticism of "economic protectionism" as a valid excuse. Note the tension between democratic will and moral obligation.

  4.  **Apply to Policy 2: The Rwanda Asylum Scheme:**
      *   *Context:* Flying asylum seekers to Rwanda for processing; if claims accepted, they stay in Rwanda, not UK. Aimed at deterring channel crossings.
      *   *Dummett's Likely View:*
          *   *Refugee Obligations:* This is the clearest cut. The Geneva Convention requires access to asylum procedures. Offshoring creates barriers.
          *   *Rich vs. Poor:* Dumping responsibilities onto a poorer nation (Rwanda) violates the obligation of rich states to bear their share of the burden.
          *   *Deterrence:* Dummett argues against using hardship as a deterrent for refugees. They are fleeing danger, not choosing leisure.
          *   *Tension:* He acknowledges states have a right to manage *numbers*, but not by abdicating responsibility. Is there a tension regarding "fair share"? If the UK argues other EU states aren't taking their share, does that justify unilateral action? Dummett would likely say no; two wrongs don't make a right, and the vulnerable suffer.
