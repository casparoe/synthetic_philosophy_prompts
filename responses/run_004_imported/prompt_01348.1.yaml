answer: |-
  Reconstructing Sir Michael Dummett's response to post-2011 policies requires applying the rigorous logical structure he established in *On Immigration and Refugees* to new empirical contexts. Dummett's central methodological move was to invert the standard burden of proof: rather than migrants justifying why they should be let in, the state must justify why they should be kept out. He argued that this justification must be substantial, non-racist, and distinct from mere economic protectionism. When applying this to the end of EU free movement, Dummett would likely have viewed the policy as a failure to meet this burden of proof. He consistently argued that fears of cultural dilution are often proxies for racial prejudice, and while he conceded a "right not to be submerged," he set the threshold for "submersion" exceptionally high—requiring evidence of genuine social disintegration, not merely demographic change. He would likely have scrutinized the Brexit rhetoric of "taking back control" as a revival of the sovereign exclusivity he critiqued in the 1960s Commonwealth Immigrants Acts. However, a tension arises here regarding democratic self-determination. Dummett acknowledged that a political community has a right to determine its character; if the British public voted to end free movement, Dummett might have struggled to reconcile his moral presumption of open entry with the democratic expression of a desire for closure. He would likely have concluded that the democratic will was itself shaped by the racist narratives he spent his life combating, meaning the policy remained illegitimate on moral grounds, but the conflict between the "right not to be submerged" (interpreted politically) and the "presumption of free entry" would remain a point of friction in his analysis.

  Regarding the Rwanda asylum scheme, Dummett's principles offer a sharper, less ambiguous critique, primarily because he draws a firm moral line between economic migrants and refugees. For Dummett, refugees possess a special claim grounded in the Geneva Convention and basic humanitarian necessity, which overrides the state's general right to control borders. He argued that rich nations have a specific obligation to absorb refugees precisely because global inequality often stems from the historical actions of those rich nations. The Rwanda scheme, which effectively externalizes the UK's asylum obligations to a poorer state to act as a deterrent, would likely strike Dummett as a violation of the duty of rich states to poorer ones. He would argue that using the hardship of displacement as a deterrent is morally incoherent when applied to those fleeing persecution; a refugee does not choose their destination based on comfort, but on safety. The policy attempts to reduce numbers not by addressing the causes of flight or sharing the burden fairly, but by erecting a barrier that risks violating the right to a fair hearing. Here, there is less underdetermination in his philosophy: the presumption in favour of entry is strongest for refugees, and the "right not to be submerged" does not grant a state the right to abdicate its Convention responsibilities. However, one might flag a potential tension if Dummett considered the *systemic* collapse of the UK's asylum processing capacity. If he viewed the system as genuinely "submerged" to the point where no claims could be processed fairly, he might theoretically accept temporary measures to restore order, but he would almost certainly reject offshoring as the solution, viewing it as an attempt to purchase exemption from moral duty rather than a genuine remedy for administrative failure.
