answer: |-
  **Scene:** *The reception bar. The band is playing something loud enough to vibrate the ice in the glasses. MARCUS (Hedge Fund, sleeves rolled) and JULIAN (Diplomat, tie loosened) are leaning against the mahogany, watching the bride and groom cut the cake.*

  **JULIAN**
  You know, watching them negotiate the knife… it reminds me of the Geneva talks. Everyone thinks the solution is in the middle. The "compromise" position. It's the only strategy that isn't strictly dominated by the hardliners or the isolationists. It's safe.

  **MARCUS**
  (Swirls his scotch)
  Safe against pure strategies, sure. If the other player plays "Hard," your Compromise beats "Isolation." If they play "Soft," Compromise beats "Hardline." You checked the columns, Julian. You did the basic dominance check.

  **JULIAN**
  Because it's a stable equilibrium.

  **MARCUS**
  It's a dominated strategy. You just didn't look for dominance by a mixed strategy.

  **JULIAN**
  (Smiles, a little too sharply)
  Don't tell me you're going to randomize a marriage.

  **MARCUS**
  I'm talking about the payoff matrix. Look. Let's say your strategies are Devotion, Independence, and Compromise. Let's say the states of the world are "Crisis" and "Calm."
  (He taps a condensation ring onto the bar)
  Compromise gives you a utility of 3 in Crisis, 3 in Calm. It's never the bottom. So it's not dominated by Devotion, and it's not dominated by Independence.

  **JULIAN**
  Exactly. It's never the worst outcome. That's why you keep it on the table.

  **MARCUS**
  But Devotion gives you 1 in Crisis, 6 in Calm. Independence gives you 6 in Crisis, 1 in Calm.
  (Marcus holds up two fingers)
  Now, play a mixed strategy. Fifty percent Devotion, fifty percent Independence. Your expected utility in Crisis is 3.5. Your expected utility in Calm is 3.5.

  **JULIAN**
  (Stares into his drink)
  3.5 dominates 3.

  **MARCUS**
  Strictly. So Compromise is redundant. You can eliminate it. Iterated elimination says you burn the middle ground, Julian. It looks robust against any single state of the world, but it collapses against a probability distribution over the other two strategies.

  **JULIAN**
  (Laughs, a dry, short sound)
  God, I hate that you're right. We spent three weeks arguing over the moderate clause in the trade deal. I was defending it as undominated.

  **MARCUS**
  Because you were only checking for pure dominance. Classic grad school mistake. You assume the opponent plays a corner solution.

  **JULIAN**
  And you assume you can convince your wife to flip a coin between ignoring her and smothering her.

  **MARCUS**
  (Clinks his glass against Julian's)
  I assume she's already doing it. The question is whether you're optimizing your response. To the bride and groom?

  **JULIAN**
  To the elimination of dominated strategies. May they never settle for the middle.

  **MARCUS**
  May they never play a weakly dominated strategy.

  *They drink. The band kicks into "Don't Stop Believin'." Neither of them moves.*
