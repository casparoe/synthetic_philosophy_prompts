  4.  **Drafting the Argument (Iterative Process):**

      *   *Point 1: It's not irrational.* Validate her feelings immediately. This is normal.
      *   *Point 2: The Medium Creates the Persona.* Explain *why* they feel different. Texting allows for a different kind of vulnerability. Face-to-face has body language, social pressure, group dynamics (he was leading a walk).
      *   *Point 3: Contextual Identity.* We all have different "modes." Dave at the birding walk is in "Leader/Host" mode. KJ was in "Friend/Confidant" mode. Even though it's one brain, the output is filtered differently.
