      *   **The Reaction:** She was floored. Months later, she still cognitively separates them ("KJ would get this, Dave might not"), even though she intellectually knows they are the same person.
      *   **The Question:** Is she being irrational, or is something real happening where identity doesn't merge just because the names do?

  2.  **Initial Assessment & Validation:**
