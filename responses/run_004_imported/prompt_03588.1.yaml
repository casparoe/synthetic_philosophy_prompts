answer: |-
  **Setting:** *London, 1785. The study of Sir William Blackstone. The room is lined with leather-bound law reports and theological texts. A fire crackles low. Jeremy Bentham sits opposite Blackstone, a sheaf of papers resting on his knee. Tea has gone cold.*

  **Blackstone:** (Steepling his fingers) You ask me to consider the law as a mere ledger, Mr. Bentham. A calculation of pains and pleasures. But the Law is not a merchant's book. It is the embodiment of Reason. It is the anchor that holds the ship of state against the tides of individual whim. When I wrote that sodomy is a crime against nature, I did not speak merely of disgust. I spoke of order.

  **Bentham:** Order is a fine thing, Sir William. But I ask you: whose order? You say "Nature." I look at Nature and I see a chaotic multitude of impulses. If a man feels an inclination toward his own sex, that inclination arises within him as naturally as hunger or thirst. By what metric do you declare the impulse natural, but the satisfaction of it unnatural?

  **Blackstone:** By the metric of design. Look to the anatomy. The teleology of the human form is evident. The union of sexes is ordained for the continuation of the species. To divert the act from its end is to frustrate the design of the Creator. It is a violation of the physical law of being. We do not allow a man to sell himself into slavery, even if he consents, because he has no right to destroy his own liberty. Why should he have the right to violate the natural law of his body?

  **Bentham:** You conflate *physical* capability with *moral* obligation. I can choose not to eat, though I hunger. I can choose not to procreate, though I have the organs for it. A celibate priest violates this "design" you speak of, yet you do not hang him. The issue is not the frustration of design, but the production of mischief. If two men meet in private, both consenting, neither coerced... where is the victim? Who bleeds? Who loses property?

  **Blackstone:** The victim is the Commonwealth. You see only the two individuals in the room. I see the fabric of society. Virtue is a habit, Mr. Bentham. It is cultivated by public law. If the law declares certain acts "indifferent," the public mind grows slack. This act is *malum in se*—wrong in itself. It corrodes the moral discipline required for a free people. If we tolerate a vice that strikes at the root of domestic life, we invite the decay of the family, and thus the state.

  **Bentham:** This is the logic of the tyrant, dressed in the robes of a judge. You punish a man not for what he has done, but for what you fear others might think if they knew of it. You speak of "corroding the public mind." I say it is the *punishment* that creates the mischief. Consider the calculus: The act yields pleasure to the participants. The law intervenes with shame, imprisonment, the pillory, perhaps death. The pain inflicted by the state vastly outweighs the pleasure of the act. Therefore, the law creates more suffering than it prevents.

  **Blackstone:** You reduce the sacred to arithmetic. There are harms that cannot be weighed on your scale. There is the offense against God. As I wrote in the *Commentaries*, this is a crime so detestable it is not fit to be named. To bring it into the light of day, to debate it as a mere "policy," is itself an injury to public decency. The law must maintain a silence, a reverence. To legalize it is to give it a voice.

  **Bentham:** And that silence is where the true evil breeds! Because it is "unspeakable," the blackmailer thrives. Because it is "unnatural," the accused is denied defense. You claim to protect public decency, but your law creates a class of men living in perpetual terror. Is that happiness? Is that security? You say the offense is against God. Very well. Let God judge it. He has the eternity of the next life to mete out justice. Why must the Magistrate act as God's hangman for sins that harm no neighbor?

  **Blackstone:** Because the Magistrate is God's vice-regent on earth! Human law is subordinate to Divine law. We cannot separate them. If the Divine law forbids it, the Human law must echo that prohibition, lest we become a nation of Sodom. You argue for privacy. But no man is an island. His vice affects his capacity for public duty. It renders him effeminate, weak, unfit for the burdens of citizenship.

  **Bentham:** "Effeminate?" This is prejudice masquerading as physiology. I have known men of this propensity who are sharp, vigorous, and capable. You assume the consequence before observing the fact. This is the very "fiction" you accused me of attacking. You claim tradition is "accumulated wisdom." I call it accumulated prejudice. Just because our ancestors hanged men for this does not mean the hanging was wise. It only means they had the power to do it.

  **Blackstone:** (Leaning forward, voice hardening) Tradition is not merely habit, Bentham. It is the tested steel of civilization. It is the barrier against the passions of the moment. You trust the individual to calculate his own utility? Men are blind to their own ruin. The law is a father. It says, "You may not do this," not because it calculates your immediate pleasure, but because it safeguards your soul and your society from a slippery descent. If we permit this, what barrier remains against incest? Against bestiality? All are "consensual" in some dark room. All violate the natural order.

  **Bentham:** Now you reveal the flaw in the "Natural Law." You draw a line at sodomy. Why not at contraception? Why not at anal sex between a man and wife? By your logic, any act not strictly for procreation is "against nature." Will you criminalize that too? Will you send spies into the marital bed?

  **Blackstone:** Do not be absurd. The marital bed is sanctified by the union of sexes. The intent is open to life, even if nature prevents it in a specific instance. The distinction is clear to any reasonable mind.

  **Bentham:** It is clear only to those who wish to see it! You rely on a "reasonable mind" that has been trained by your own *Commentaries*. You are arguing in a circle. The law is just because it follows Nature. Nature is defined by what the Law allows. I propose a simple test: Does it hurt anyone else? If the answer is no, the law should hold its tongue. The pain of the punishment is real, tangible, measurable. The "harm to society" you speak of is a ghost. It is a phantom pain in a limb that does not exist.

  **Blackstone:** (Standing, walking to the window) A phantom? You think the moral cohesion of a nation is a phantom? We are not atoms, Mr. Bentham. We are links in a chain. If you weaken one link, the chain breaks. I grant you, in the immediate moment, two men may find pleasure. But the precedent of ignoring Divine law for the sake of temporal comfort? That is the path to nihilism. If law is only utility, then justice is merely a majority vote. What protects the minority then?

  **Bentham:** (Quietly) Precisely. If law is only utility, then we must count *all* the pain. The pain of the man in the pillory. The pain of his family. The pain of the blackmail victim. Against what? The discomfort of those who hear of it and feel disgust. Why does the disgust of the many outweigh the liberty of the few? Is their disgust a sufficient reason to inflict torture?

  **Blackstone:** Because that disgust is the voice of the moral sense! It is the instinctive recoil of virtue. To ignore it is to make the law alien to the people it governs. A law that the people despise cannot stand. If I decriminalize this, I do not liberate these men. I make the law itself an object of scorn. I undermine the authority of the courts in all matters.

  **Bentham:** Then the law deserves scorn if it demands blood for victimless acts. You say you fear backlash. I say you *court* it by enforcing the unenforceable. You force the courts to be inquisitors into private life. You make the state a voyeur. I would keep the law blind to what happens in the dark, so long as no cry for help comes from it.

  **Blackstone:** (Turning back) And I say the light of God sees in the dark. And His Law, reflected in ours, forbids it. We are at an impasse, Mr. Bentham. You see a calculation of suffering. I see a violation of the Cosmic Order. You would build a state on the shifting sands of human desire. I build it on the rock of Divine Reason.

  **Bentham:** (Gathering his papers) Then I fear your rock will crush many men before it moves. I shall keep my calculations, Sir William. For now. But know this: Pain is real. Nature is silent. And one day, the law will have to answer for the suffering it causes, not the traditions it protects.

  **Blackstone:** And know this, Mr. Bentham: A society that loses its reverence for the natural order will find no happiness in its liberty. Only chaos.

  *(Bentham nods, places the unpublished manuscript into his coat pocket, and bows slightly. Blackstone returns to his desk, dipping his quill into the ink, the scratch of the pen filling the silence once more.)*
