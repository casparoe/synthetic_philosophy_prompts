prompt: |-
  My closest friend is getting married next month, and because I'm the science-and-ideas journalist in her friend group, I've been handed the maid-of-honor toast, with instructions to "make it smart." She wrote her dissertation defending Bernard Williams's internalism about reasons — the view that a reason to act must connect, through some intelligible chain of deliberation, to something already in the agent's own desires and projects, rather than to a free-standing "external" ought that binds her regardless of what she actually cares about. Her fiancé, also a philosopher, has spent their entire courtship arguing a broadly Kantian, externalist line back at her. I want the toast built around this disagreement, and around Williams's related image of the husband who, mid-rescue, pauses to check that saving his drowning wife rather than a stranger is "permissible" — one thought too many, when the fact that she's his wife should already have been reason enough. Please write the toast, about five minutes long: precise enough that the philosophers in the room recognize real Williams rather than a caricature of him, but moving in its own right for the relatives who've never heard the phrase "internal reasons" in their lives.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Science-and-ideas journalist (smart, articulate, but accessible).
      *   **Occasion:** Wedding toast (Maid of Honor).
      *   **Audience:** Mixed (Philosophers who know the references, relatives who don't).
      *   **Key Subjects:** The Bride (defends Bernard Williams's *Internal Reasons*), The Groom (Kantian/Externalist).
      *   **Core Concept:** Williams's critique of "one thought too many" (the drowning wife example).
      *   **Tone:** Smart/precise (no caricatures) but moving/emotional (not dry academic).
      *   **Length:** About 5 minutes (roughly 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy:**
      *   *Bernard Williams (Internalism):* Reasons for action must stem from the agent's "subjective motivational set" (desires, projects, commitments). You can't just say "you ought to do X" if X connects to nothing you care about.
      *   *Kantian/Externalism:* Moral obligations exist independently of what you desire. Duty binds you regardless of your internal state.
      *   *The "One Thought Too Many" Example:* In *Persons, Character and Morality*, Williams discusses a man saving his wife from drowning. If he stops to think, "Is it morally permissible for me to save my wife instead of a stranger?" he has had one thought too many. The fact that she is his wife should be the immediate motive, not a derived moral permission.
      *   *The Conflict:* Bride says love is internal (it comes from *us*, our history, our desires). Groom says love is duty/external (it binds us regardless of feeling).
      *   *The Resolution:* Marriage transforms the "external" into the "internal." Or, love makes the distinction moot.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (MOH/Journalist). Set the scene. Acknowledge the "make it smart" instruction.
      *   **The Philosophical Setup:** Introduce the Bride's work (Williams/Internalism) and the Groom's stance (Kant/Externalism). Keep it clear for laypeople but accurate for philosophers.
      *   **The "One Thought Too Many" Story:** Tell the drowning wife anecdote. This is the emotional core. Explain why Williams thinks the hesitation is a failure of love.
      *   **Applying to the Couple:** How does this fit their relationship? The Groom argues for duty; the Bride argues for desire/project.
      *   **The Synthesis/Twist:** Marriage isn't about winning the argument. It's about how the "external" vow becomes an "internal" reason. The vow *creates* the desire.
      *   **Closing:** Raise a glass. Wish them well.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add personal touches. Talk about their arguments at dinner parties. Make sure the emotional weight of the drowning story lands.
      *   *Critique:* Is the philosophy accurate?
      *   *Fix:* Ensure "Subjective Motivational Set" is implied or mentioned gently. Don't misrepresent Kant (he's not unfeeling, but duty-based). Ensure Williams isn't seen as a relativist, but as someone concerned with integrity and identity.
      *   *Critique:* Is it accessible?
      *   *Fix:* Define "internal reasons" simply (things that hook into who you are). Define "external" simply (rules from the outside).

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Start:* "For those who don't know me, I write about ideas..."
      *   *Middle:* "Bride thinks reasons come from within. Groom thinks they come from the moral law."
      *   *The Story:* "Williams asks us to imagine a man saving his wife..."
      *   *The Turn:* "But here's the thing about marriage. It's the mechanism that turns external vows into internal reasons."
      *   *End:* "To the happy couple."

  6.  **Writing - Focusing on Rhythm and Voice:**
      *   Use rhetorical devices (anaphora, rule of three).
      *   Keep sentences varied in length for speech flow.
      *   *Self-Correction during drafting:* I need to make sure I don't imply the Groom is cold. Kantian duty is profound. It's about commitment. The Bride's view is about authenticity. Marriage needs both.
      *   *Key Insight:* The wedding vows *are* external statements that become internal reasons. That's the bridge.

  7.  **Final Review against Constraints:**
      *   5 minutes? (Word count check: ~800-900 words).
      *   Williams accurate? (Yes, focuses on the deliberative route and the drowning example).
      *   Moving? (Hope so, focuses on the immediacy of love).
      *   Accessible? (Explains terms in context).

  8.  **Final Polish:** Check transitions. Ensure the punchline lands. (Proceed to generate output based on this thought process).

  *(Self-Correction Note during final polish)*: Make sure not to get bogged down in the "deliberative route" jargon. Keep it to "connecting to what you care about." Ensure the "one thought too many" is the emotional climax.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I work as a journalist covering science and ideas, which is a fancy way of saying I spend my days trying to explain complex concepts to people who didn't ask for them. So, when [Bride] asked me to be her Maid of Honor, she gave me specific instructions. She said, "Please make it smart."

  I suspect she was worried I'd talk about how we met in college, or how she steals the blankets. But [Bride] and [Groom] are philosophers. Their courtship wasn't built on movie dates; it was built on debates. And specifically, it was built on a disagreement about why we do anything at all.

  [Bride] has spent her academic life defending the view of the philosopher Bernard Williams. Williams argued for "internal reasons." Put simply, this means that for you to have a real reason to do something, it has to connect to something you already care about—to your desires, your projects, your identity. You can't just be told "you ought to do this" by the universe. The "ought" has to hook into who you actually are.

  [Groom], on the other hand, has spent the last several years arguing the opposing Kantian line. He believes in "external reasons." He believes there are moral duties that bind us regardless of what we feel or want. Duty is duty. The moral law stands outside us, demanding respect, even when our internal desires are silent.

  For years, I've watched them argue this at dinner parties. [Bride] says love must be authentic, springing from the self. [Groom] says love is a commitment, a binding obligation that holds even when the feeling fades.

  But tonight, I want to talk about a specific image from Bernard Williams. It's a story he tells about a man whose wife is drowning.

  Williams asks us to imagine this husband jumping into the water to save her. But then, Williams imagines the husband pausing, just for a second, to deliberate. He asks himself: "Is it morally permissible for me to save my wife, rather than the stranger drowning next to her? Does the moral law allow this preference?"

  Williams says that if the husband has that thought, he has had *one thought too many*.

  For Williams, the fact that she is his wife should be enough. It shouldn't require a moral justification from the outside. The love shouldn't need a permit. To stop and check the rulebook is to fail the moment. It suggests that his commitment to her is secondary to his commitment to a principle.

  Now, [Groom], I know you're thinking: "But the husband *should* know it's permissible. Duty requires consistency." And you're right. But [Bride] is right, too. Because in love, immediacy matters. When you love someone, you don't save them because it's "Universal Law." You save them because they are *them*, and you are *you*, and the distance between those two things has collapsed.

  And this, I think, is where the magic of today lies.

  Marriage is the alchemy that solves their argument. A wedding vow looks like an external reason. It is a public rule. It is a promise made before witnesses, a duty undertaken. It looks like Kant. But once that vow is spoken, it changes. It sinks into the "subjective motivational set," to use Williams's phrase.

  The vow becomes part of who you are. It stops being a rule you follow and starts being a desire you feel.

  [Groom], today you are making [Bride]'s happiness an internal reason for your actions. You aren't just obeying a law; you are rewriting your own nature so that her joy is necessary for your own.
  [Bride], today you are accepting a binding obligation. You are taking an external vow and making it the anchor of your internal world.

  You are proving that the dichotomy between "what I must do" and "what I want to do" is false. In a good marriage, you do what you must, because it is exactly what you want. You save your wife from the water not because it is permissible, but because the thought of not saving her is unthinkable.

  So, to the happy couple. May you always have reasons to act. May those reasons be deep, and intelligible, and yours. And may you never, ever have to pause to calculate whether loving each other is allowed.

  To [Bride] and [Groom].
