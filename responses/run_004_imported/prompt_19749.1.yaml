prompt: |-
  I'm on the steering committee for an open-source project I helped start (~40k GitHub stars, running in prod at a bunch of companies). We're writing a governance charter and it's stuck on one question: who counts as a 'member' with voting rights on RFCs and maintainer elections? One camp wants voting limited to people who've merged commits in the past year -- they're the ones who understand the tradeoffs. The other camp points to what just happened: two maintainers deprecated a widely-used API with no warning, breaking prod for companies that depend on us but have never sent a PR, and now those companies want a real vote since they eat the consequences. Once you start giving a vote to 'anyone affected' though, it's not clear where that stops, and half the committee doesn't even agree on who gets to vote on the charter that decides all this. Can you draft the memo I'll send before we vote next friday -- a real recommendation on eligibility, not a list of tradeoffs, that takes the contributors-only side seriously instead of just siding with the sympathetic underdog companies.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Open-source project steering committee (~40k stars, production usage).
      *   **Problem:** Stuck on defining "membership" (voting rights) for the governance charter.
      *   **Conflict:**
          *   *Camp A (Contributors):* Voting limited to those who merged commits in the past year (meritocracy, technical understanding).
          *   *Camp B (Users/Stakeholders):* Voting for those affected by decisions (e.g., companies burned by API deprecation), even if they don't contribute code.
      *   **Complication:** The committee itself can't agree on who votes on *this* charter.
      *   **Task:** Draft a memo to be sent before the vote next Friday.
      *   **Requirement:** Make a *real recommendation* on eligibility (not just listing tradeoffs). Take the contributors-only side seriously (don't just pander to the "sympathetic underdog companies").
      *   **Tone:** Professional, decisive, diplomatic, pragmatic, governance-focused.

  2.  **Deconstruct the Core Tension:**
      *   *Meritocracy (Contributors):* Ensures voters understand the technical debt, maintenance burden, and architectural constraints. Prevents "tyranny of the majority" where non-technical stakeholders demand features that break the project's sustainability.
      *   *Stakeholder Representation (Users):* Ensures the project serves its purpose. Prevents maintainers from acting unilaterally in ways that harm the ecosystem (like the API deprecation incident). Large enterprise users often contribute in non-code ways (security audits, documentation, advocacy, funding).

  3.  **Evaluate Potential Models:**
      *   *Pure Code Contribution:* Too narrow. Ignores non-code contributions and the reality of enterprise usage. Risks alienating the funding/support base.
      *   *Pure Stakeholder:* Too broad. Who defines "affected"? Can a competitor vote to break the project? Hard to verify.
      *   *Hybrid (The Sweet Spot):* A tiered system or a definition of "contribution" that expands beyond code but requires sustained engagement.

  4.  **Formulate the Recommendation:**
      *   *Goal:* Balance technical sustainability with ecosystem responsibility.
      *   *Proposal:* Define "Membership" based on *sustained contribution*, but broaden the definition of contribution beyond just code commits.
      *   *Why:* This respects Camp A's desire for earned rights (sweat equity) while acknowledging Camp B's point that code isn't the only value add. It solves the "API deprecation" issue by allowing companies to earn votes through non-code channels (reporting, docs, community support) without opening the floodgates to *every* user.
      *   *Specific Mechanism:* A "Contributor" is someone with X contributions (code OR non-code) in the last Y months. Non-code needs verification (e.g., triage, security reporting, docs, event organizing).
      *   *Addressing the Immediate Crisis:* The API deprecation issue needs a process fix (RFC process), not just a voting fix. But voting eligibility determines who sets that process.
      *   *Addressing the "Who Votes on the Charter" Paradox:* Acknowledge it, propose a temporary consensus model for *this* vote only, then lock in the rules for future votes.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose clearly. Acknowledge the stalemate.
      *   **The Core Principle:** "Sweat Equity" vs. "Impact." We need a bridge.
      *   **The Recommendation:** Two-tiered structure? Or a broadened definition of Contributor? Let's go with a **Broadened Contributor Model**. It's cleaner than having two classes of voters which can lead to gridlock.
      *   **Criteria:**
          1.  Code (existing Camp A requirement).
          2.  Non-Code (Triage, Docs, Security, Community).
          3.  Timeframe (Last 12 months - ensures active engagement).
      *   **Why this works for Camp A:** Still requires work. No free riders.
      *   **Why this works for Camp B:** Companies can earn votes without being core devs. Prevents unilateral maintainer actions.
      *   **The "Charter Vote" Dilemma:** Address the elephant in the room. We can't use the rules we haven't passed yet. Recommend a "Unanimous Consent" or "Supermajority of Current Committee" for *this* specific vote to bootstrap the system.
      *   **Safeguards:** Mention the RFC process (to prevent future API breaks) as a separate but related governance output.
      *   **Closing:** Call to action.

  6.  **Refining the Tone:**
      *   *Avoid:* "I think," "Maybe," "On one hand..."
      *   *Use:* "I recommend," "The proposal is," "This ensures."
      *   *Respect Camp A:* Explicitly state that opening voting to all users is dangerous (tragedy of the commons, lack of context).
      *   *Respect Camp B:* Explicitly state that code commits aren't the only measure of value (enterprise stability matters).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Non-Code" too vague?
      *   *Fix:* Define specific categories (Issue Triage, Security Reporting, Documentation, Event Organization). Require maintainer sponsorship for non-code contributions to prevent gaming.
      *   *Critique:* What about the companies that just want a vote because they pay money?
      *   *Fix:* Don't give votes for money. That's a foundation board, not a technical steering committee. Keep it merit-based but broaden merit.
      *   *Critique:* The prompt asks to take the contributors-only side seriously.
      *   *Fix:* Emphasize that *passive* users still don't get votes. They must *engage*. This protects the project from becoming a customer support ticket voting system.

  8.  **Final Polish:** Check length, clarity, and ensure the "Next Friday" deadline is respected in the call to action. (Proceed to generate output based on this thought process).

  9.  *(Final check against constraints)*: Did I make a real recommendation? Yes. Did I avoid just listing tradeoffs? Yes. Did I respect the contributor argument? Yes.

  **(Self-Correction Note):** I need to make sure I don't solve the *API deprecation* problem directly, but rather the *voting eligibility* problem that decides who prevents future deprecations. The memo is about governance membership, not release policy, though they are linked. I will focus on the membership definition.

  **(Refining the "Charter Vote" issue):** The prompt says "half the committee doesn't even agree on who gets to vote on the charter." I need to propose a way to break *that* specific deadlock so we can vote on the recommendation. I'll suggest that *current* committee members vote on the charter, but the charter defines *future* membership. This is the standard bootstrap approach.

  Let's write it.cw
answer: |-
  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Eligibility & Governance Charter Bootstrap

  Team,

  We are stalled on the single most critical definition in our governance charter: **Who constitutes a "Member" with voting rights?**

  We have two legitimate concerns. Camp A argues that voting rights must be earned through code contribution to ensure voters understand the technical tradeoffs and maintenance burden. Camp B argues that excluding non-coding stakeholders (specifically production users) risks maintainers making unilateral decisions that destabilize the ecosystem, as seen in the recent API deprecation incident.

  Both sides are right. A "one-user-one-vote" model turns a technical project into a customer support queue. However, a "code-commits-only" model ignores the reality that security reporting, documentation, triage, and deployment feedback are vital contributions that sustain a project of our size.

  We cannot ship a charter that creates a permanent underclass of stakeholders, nor can we ship one that dilutes technical accountability.

  Below is my formal recommendation for the eligibility criteria, followed by a proposal to break the deadlock on voting for *this* charter.

  ### Recommendation: The "Active Contribution" Model

  I recommend we define Voting Membership based on **sustained active contribution**, broadly defined, over a rolling 12-month period.

  **1. Eligibility Criteria**
  To qualify as a Voting Member, an individual must have made **five (5) verifiable contributions** in the past 12 months. Crucially, we expand the definition of "contribution" beyond merged code to include:
  *   **Code:** Merged PRs.
  *   **Triage:** Validated bug reports, reproduction cases, or issue triage (verified by a maintainer).
  *   **Security:** Responsible disclosure of vulnerabilities.
  *   **Documentation:** Significant edits, tutorials, or translation work.
  *   **Community:** Organizing meetups or providing verified support in official channels.

  **2. Verification & Sponsorship**
  To prevent gaming the system, non-code contributions must be acknowledged or sponsored by an existing Maintainer or Steering Member. This preserves the "trust" aspect Camp A is concerned about. You cannot vote unless a current steward vouches that your input added value.

  **3. The "Company" Question**
  Votes belong to *individuals*, not organizations. A company may have multiple voters if multiple employees meet the criteria. This prevents a single large enterprise from buying influence, while still allowing them to earn representation through engagement.

  ### Why This Works

  *   **For Camp A (Contributors):** This maintains the principle of **meritocracy**. Passive users do not get a vote. You still have to "show up and do the work." It ensures voters have skin in the game and context on project health.
  *   **For Camp B (Users/Enterprises):** This provides a path to representation for companies that cannot contribute code due to IP policies but contribute via security audits, documentation, or triage. It forces a feedback loop: if a company wants a vote on API stability, they must engage with the process *before* the break occurs.
  *   **For the Project:** It aligns incentives. It encourages users to become contributors, which reduces the burden on core maintainers.

  ### Addressing the Charter Vote Deadlock

  We currently cannot agree on who votes on *this* charter because the charter defines the voters. This is a bootstrap problem.

  I propose we bypass this paradox with a **one-time Consensus Clause**:
  1.  **This Charter Vote:** Decided by the **current** Steering Committee members (us) via a 2/3 majority. We are the de facto stewards today; we must own the responsibility of formalizing the rules.
  2.  **Future Votes:** Once ratified, all future elections and RFC votes will strictly adhere to the "Active Contribution" model defined above.

  This acknowledges our current authority without cementing it permanently. It allows us to pass the rules that will eventually regulate our own succession.

  ### Next Steps

  This recommendation balances technical sustainability with ecosystem accountability. It rejects the idea that *money* or *usage* grants governance rights, but it accepts that *work* comes in many forms.

  I ask that everyone review this definition of "Active Contribution" before our meeting next Friday. If we leave that meeting without a ratified definition, we signal to our 40k users that we are unable to govern ourselves. Let's solve the bootstrap problem, pass the charter, and move on to fixing the RFC process that allowed the API breakage in the first place.

  See you Friday.

  [Your Name]
