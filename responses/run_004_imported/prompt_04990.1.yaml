answer: |-
  A decision theory student raises his hand and asks, "Professor, is there any rational way to win the Kavka Toxin Puzzle?"

  The professor shakes his head. "No. To win, you must sincerely intend to drink the toxin. But since you know you'll get the million dollars just for the intention, you'll also know there's no reason to actually drink it once you're rich. And since you know you won't drink it, you can't intend to."

  "So it's impossible?" the student asks.

  "Not impossible," the professor says. "Just impossible for anyone who understands the puzzle. To intend, you have to believe you'll follow through. But you'll only follow through if you're irrational. So the only person who can win is someone who doesn't realize that winning removes the reason to drink."

  The student looks around the lecture hall. "So... the guy sleeping in the back row?"

  "Exactly," the professor says. "He's the only one here dumb enough to believe he'll drink it."

  "Should I wake him up?"

  "No," the professor says. "Don't wake him. He's the only one who can afford this class."
