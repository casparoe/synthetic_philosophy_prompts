      *   **Task:** Adjudicate four specific moves (Walt 1 & 2, Sonia 1 & 2) regarding whether tipping is a Lewisian convention. Evaluate against Lewis's specific criteria (general conformity, expectation, common knowledge, coincidence of interest, conditional preference, arbitrariness). Finally, give a balance judgment: Is tipping a Lewis convention? Does Sonia identify a real gap in Lewis's framework?

  2.  **Deconstruct the Debate (Walt vs. Sonia):**
      *   **Walt (1):** Tipping is a Lewis convention. Arbitrary (could be higher wages), self-perpetuating (conformity + expectation + common knowledge).
      *   **Sonia (1):** Lewis requires a *coordination problem* with *coincidence of interest* (indifference between equilibria). Tipping involves conflict (unequal stakes between servers, diners, owners). Fails the coordination problem condition.
      *   **Walt (2):** Lewis admits "impure" coordination problems (mixed with conflict). Coincidence of interest need only *predominate*. Conditional preference holds (given others tip, I tip; given diners tip, servers prefer it).
      *   **Sonia (2):** That concession makes "convention" too broad (includes exploitative arrangements). "Coincidence of interest" and "arbitrariness" must do real work, otherwise the definition loses distinctiveness.

  3.  **Recall/Verify Lewis's *Convention* (1969):**
      *   **Definition:** A regularity $R$ in behavior in a population $P$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition* that others do (conditional preference).
          4.  There is at least one alternative regularity $R'$ that *could* have solved the coordination problem instead (Arbitrariness).
          5.  Common knowledge of 1-4.
      *   **Coordination Problem:** A situation where agents have a *common interest* in coordinating their actions, though they may have preferences over *which* coordination equilibrium occurs (Impure Coordination).
      *   **Key Nuance:** Lewis distinguishes between *Coordination Problems* (common interest predominates) and *Prisoner's Dilemmas* / Conflict situations (individual interest diverges significantly from group interest).
      *   **Arbitrariness:** There must be another possible equilibrium.
      *   **Sonia's Point:** Is there a *coincidence of interest*? Or is it a distributional conflict masked as coordination?

  4.  **Evaluate Each Move:**

      *   **Walt (1):** *Basics:* Conformity, Expectation, Common Knowledge, Arbitrariness.
          *   *Assessment:* Mostly right on the surface mechanics. Tipping *looks* like a convention. The "arbitrariness" claim (living wage vs. tips) is technically true in the economic sense (both are equilibria), but philosophically contentious regarding "alternative regularity."
          *   *Verdict:* Basically right on the phenomenology, but glosses over the underlying game structure.

      *   **Sonia (1):** *Coordination Problem & Coincidence of Interest.*
          *   *Assessment:* This is the crux. Lewis defines a convention as a solution to a *coordination problem*. A coordination problem requires that agents prefer *any* coordinated outcome over *no* coordination. In tipping, do diners prefer *any* system (tips or wages) over *no* system? Probably. But do they prefer the *tipping* equilibrium over the *wage* equilibrium? Many diners might prefer the wage equilibrium (no mental math, predictable cost). Many servers prefer tips (potential for higher income). This suggests conflicting preferences over *which* equilibrium, not just coordination.
          *   *Lewis's View:* Lewis allows "impure" coordination (Battle of the Sexes). But if the conflict is too high, it becomes a bargaining problem or Prisoner's Dilemma, not coordination.
          *   *Verdict:* Onto something real. She identifies the tension between coordination and distribution.

      *   **Walt (2):** *Impure Coordination & Conditional Preference.*
          *   *Assessment:* Lewis does allow impure coordination. The conditional preference test ("Given others tip, I prefer to tip") holds for diners (social pressure, server service quality) and servers (income).
          *   *Verdict:* Basically right regarding Lewis's text. Lewis does emphasize the conditional preference stability over the purity of the interest.

      *   **Sonia (2):** *Over-broadness & Exploitation.*
          *   *Assessment:* If conditional preference is all that matters, then feudalism or slavery could be "conventions" if stabilized by expectation. Lewis wants to exclude these. He relies on the "Coordination Problem" preamble to filter these out. If the underlying game isn't a coordination problem, the regularity isn't a convention, even if stable.
          *   *Verdict:* Strong philosophical point. Highlights a potential weakness or ambiguity in Lewis's boundary conditions.

  5.  **Synthesize the Adjudication:**
      *   **Biology Analogy:** Connect back to the user's "Bourgeois" strategy. Bourgeois is an ESS in a Hawk-Dove game. It solves a conflict over resources by using an arbitrary cue (ownership). Tipping is similar: it solves a distribution/payment problem using an arbitrary cue (social norm).
      *   **Lewis's Criteria:**
          *   *Conformity/Expectation/Common Knowledge:* Tipping passes.
          *   *Conditional Preference:* Tipping passes (in the current state).
          *   *Arbitrariness:* Tipping passes (Wage system is possible).
          *   *Coordination Problem (Coincidence of Interest):* This is the failure point. Is it a Coordination Problem or a Bargaining/Conflict Problem?
      *   **The Verdict:** Tipping is a *quasi*-convention or a *norm* that functions *like* a convention, but strictly speaking, it fails the "Coordination Problem" test because the interests regarding *which* equilibrium are too divergent (distributional conflict). However, Lewis's framework is often stretched to cover norms that stabilize conflict. Sonia is right that this exposes a gap/ambiguity in Lewis regarding "impure" coordination vs. "bargaining."

  6.  **Drafting the Response:**
      *   **Acknowledge the User:** Validate the biology/philosophy connection. The "Bourgeois" strategy is a perfect analogy for Lewis's Arbitrariness.
      *   **Step-by-Step Adjudication:** Go through (1)-(4) clearly.
      *   **Deep Dive on "Coordination Problem":** Explain the difference between Pure Coordination (Driving side), Impure Coordination (Battle of Sexes), and Prisoner's Dilemma/Conflict. Place Tipping here.
      *   **Final Judgment:** Tipping is *not* a strict Lewis convention because the "coincidence of interest" is insufficient regarding the *choice of equilibrium*. It is a social norm sustained by power/expectations, not just coordination. Sonia identifies a genuine tension in Lewis's work regarding the boundary between convention and power/ideology.
      *   **Tone:** Respectful, collegial, precise. Use the biological background to anchor the game theory explanations.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, Lewis *does* discuss "Impure Coordination" (Battle of the Sexes). In BoS, both prefer to coordinate, but prefer *different* coordinated outcomes. Does Tipping fit BoS?
      *   *Analysis:* In BoS, if we fail to coordinate, both lose. In Tipping, if we switch to "No Tips/High Wage," do we lose coordination? No, we just switch equilibria. The "loss" is distributional.
      *   *Lewis's Requirement:* The situation must be one where *coordination itself* is the primary benefit. In tipping, the primary benefit for the owner is cost-shifting, for the server it's income variance, for the diner it's social compliance. The "coordination" is secondary to the distribution.
      *   *Sonia's Point:* She argues the "coincidence of interest" condition is violated because they *don't* agree on the equilibrium. Lewis says coincidence must *predominate*. Does it?
      *   *Decision:* Sonia has the stronger textual argument. Lewis requires the situation to be *primarily* a coordination problem. Tipping is primarily a distributional conflict stabilized by convention-like mechanisms.
      *   *Biology Link:* The "Bourgeois" strategy resolves a Hawk-Dove conflict. It turns a conflict game into a coordination game via an arbitrary cue. Tipping attempts to do the same for wage disputes. But unlike Bourgeois (where ownership is usually clear), the "ownership" of the wage bill is contested.

  8.  **Final Polish:** Ensure the distinction between "Convention" (Lewis's technical term) and "Social Norm" (broader) is clear. Ensure the biology analogy is honored. (The Bourgeois strategy *is* a convention in the biological sense, which maps well to Lewis).

      *   *Wait, one nuance:* In biology, "Convention" isn't the standard term for ESS, but Maynard Smith did use the term "convention" for asymmetric contests like Bourgeois. Lewis acknowledges this parallel. I should mention that.
