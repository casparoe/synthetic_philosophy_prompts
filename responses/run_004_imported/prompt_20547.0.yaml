          *   Conclusion: Tipping is a *norm* that mimics a convention, but fails the strict "Coordination Problem" test. Sonia identifies a real ambiguity in Lewis regarding power dynamics.

      *   *Biology connection:* The Bourgeois strategy works because the *cost* of fighting is high for both (coordination interest). In tipping, the cost of the "wage" system isn't high for the diner necessarily, it's just different. The conflict is about *who pays*, not *how we avoid chaos*. This supports Sonia.

