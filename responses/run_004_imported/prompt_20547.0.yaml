answer: |-
  It is a genuine pleasure to correspond with someone who sees the structural isomorphism between Maynard Smith's evolutionary stable strategies and Lewisian conventions. You are quite right: the "Bourgeois" strategy (owner wins, intruder retreats) is the biological cognate to Lewis's arbitrariness condition. Both rely on an asymmetry (ownership/driving side) that is itself morally or intrinsically neutral but becomes normative solely because it coordinates expectations and avoids the cost of conflict.

  Your discussion group has stumbled onto one of the most persistent critiques in the philosophy of social science. Walt and Sonia are reenacting a debate that has occupied philosophers since *Convention* was published in 1969. Because you know the game theory, I can skip the basics and speak directly to the payoff matrices implicit in their arguments.

  Here is the adjudication of moves (1) through (4), followed by a verdict on the tipping case and the framework itself.

  ### Adjudication of Moves

  **(1) Walt: Tipping is a clean textbook case (Arbitrary + Self-Perpetuating).**
  *   **Verdict:** **Basically Right on Phenomenology, Wrong on Deep Structure.**
  *   **Analysis:** Walt correctly identifies the *surface features* of a Lewis convention. There is general conformity (most people tip), there is expectation (you expect others to tip), and there is common knowledge (we all know we all expect it). He is also correct on **Arbitrariness**: a "living wage included in menu prices" is indeed an alternative equilibrium ($R'$) that would solve the transaction just as well as the tipping equilibrium ($R$).
  *   **The Catch:** Walt treats the *stability* of the equilibrium as proof of its status as a convention. But for Lewis, stability is a necessary condition, not a sufficient one. A regime of terror can be stable, self-perpetuating, and arbitrary in the sense that a different regime could have existed. Walt is describing a *Social Norm*, which is a broader category than a Lewis Convention.

  **(2) Sonia: Tipping fails the "Coordination Problem" (Coincidence of Interest) condition.**
  *   **Verdict:** **Onto Something Real and Textually Supported.**
  *   **Analysis:** This is the strongest philosophical move in the exchange. Lewis is explicit: a convention is a solution to a *coordination problem*. A coordination problem requires a "coincidence of interest" regarding the *fact* of coordination. In the classic "Driving Side" example, I don't care if we drive on the left or right, provided we *agree*. My payoff is high if we match, low if we mismatch.
  *   **The Tipping Matrix:** In tipping, the interests are not coincident regarding the equilibrium. Owners prefer the Tipping Equilibrium (lower fixed costs). Servers might prefer Tipping (higher variance/upside) or Wages (stability), but Diners often prefer Wages (price transparency, no social calculation). If Diners would strictly prefer the Wage Equilibrium over the Tipping Equilibrium, but tip anyway because they expect others to tip, they are not solving a coordination problem; they are submitting to a **Prisoner's Dilemma** or a **Bargaining Problem** masked as coordination. Sonia is right to flag that the "coincidence of interest" is missing where it matters most: the choice between $R$ and $R'$.

  **(3) Walt: Lewis allows "Impure" Coordination (Conflict mixed in); Conditional Preference holds.**
  *   **Verdict:** **Basically Right on Lewis's Text, but Overextends the Limit.**
  *   **Analysis:** Walt is correct that Lewis acknowledges "impure" coordination problems (like the *Battle of the Sexes*), where agents prefer coordination but have different preferences over *which* coordination equilibrium occurs. Lewis argues that coincidence of interest need only *predominate*. Walt is also correct about the **Conditional Preference** condition: *Given* that everyone else tips, I prefer to tip (to avoid social sanction or ensure service).
  *   **The Catch:** Lewis draws a hard line between "Impure Coordination" and "Conflict." If the conflict of interest over which equilibrium obtains is too high, it ceases to be a coordination problem. In *Battle of the Sexes*, both parties lose if they fail to coordinate (one goes to the ballet, one to the boxing, they spend the night apart). In Tipping, if the diner refuses to tip and the system collapses into Wages, the diner does not necessarily "lose" the coordination benefit; they just enter a different distributional arrangement. Walt is using the "Impure" clause to swallow the rule.

  **(4) Sonia: That concession makes "Convention" too broad (includes exploitation).**
  *   **Verdict:** **Right on the Philosophical Consequence.**
  *   **Analysis:** This is the critical meta-argument. If Walt's interpretation holds, then any stable Nash equilibrium sustained by expectation counts as a convention. This would include feudalism, caste systems, or protection rackets, provided everyone expects everyone else to conform and prefers conformity given the status quo. Lewis explicitly wanted to exclude these. He wanted "Convention" to explain *how we cooperate without agreement*, not *how we sustain hierarchy*. Sonia correctly identifies that if "Conditional Preference" does all the work, the "Coordination Problem" preamble becomes decorative.

  ### The Verdict: Is Tipping a Lewis Convention?

  **On balance: No.** Tipping is not a genuine Lewis convention, though it mimics one.

  Here is the game-theoretic distinction:
  In a true Lewis convention (like driving on the right), the payoff for *Coordination* is higher than the payoff for *Non-Coordination*, regardless of which equilibrium is chosen.
  *   **Driving:** (Right, Right) > (Right, Left).
  *   **Tipping:** (Tip, Tip) vs. (Wage, Wage).

  For tipping to be a Lewis convention, Diners, Servers, and Owners would all have to agree that *some* payment system is vital, and be largely indifferent between Tips vs. Wages. They are not. The Tipping Equilibrium is Pareto-inferior for Diners (and arguably Servers, due to income instability) compared to the Wage Equilibrium, but it is maintained because the transaction costs of switching equilibria are high (collective action problem).

  This makes tipping a **Social Norm sustained by a Prisoner's Dilemma structure**, not a Coordination Problem.
  *   **Individual Diner:** Best outcome = Others tip, I don't (Free ride). Worst outcome = I tip, others don't (Sucker).
  *   **Lewis Convention:** Best outcome = We match. Worst outcome = We mismatch.

  Walt is describing a *normative equilibrium*, but Sonia is correct that it lacks the *coincidence of interest* required for Lewis's specific definition.

  ### Does Sonia Identify a Real Gap in the Framework?

  **Yes.** Sonia has put her finger on a genuine ambiguity in Lewis that has spawned decades of literature (notably by Margaret Gilbert and Ruth Millikan).

  The gap is this: **Lewis's framework struggles to distinguish between *Coordination* and *Compliance*.**

  1.  **The "Predominance" Loophole:** Lewis says coincidence of interest must "predominate." But he offers no metric for how much conflict is too much. As Walt showed, you can classify almost any stable social arrangement as "impure coordination" if you squint.
  2.  **Power and Ideology:** Lewis's model assumes agents are free to choose $R'$ if they could coordinate on it. It underestimates situations where one group (Owners) has the power to enforce $R$ (Tips) even if the other group (Diners/Servers) would prefer $R'$ (Wages). In biology, the "Bourgeois" strategy works because fighting is costly for *both*. In sociology, "conventions" often persist because fighting is costly for *one side* and profitable for the other.
  3.  **The Normative Force:** Lewis explains why we *do* conform (expectations). He is less successful at explaining why we feel we *ought* to conform in cases where the coordination benefit is low. Tipping feels obligatory not because we fear a coordination failure (the restaurant won't crash if we switch to wages), but because we fear social sanction. Lewis lumps "social sanction" into the payoff matrix, but Sonia is right to suggest that when sanctions do the heavy lifting rather than mutual benefit, the label "convention" loses its explanatory power.

  ### Summary for Your Group

  You can tell Walt he is right that tipping functions *mechanically* like a convention (arbitrary, stable, expectation-based). But tell him Sonia wins on the *taxonomy*.

  For Lewis, a convention is a specific tool for solving a specific problem (Coordination). Tipping is a tool for solving a different problem (Distribution/Wage negotiation) that has *borrowed* the machinery of convention to stabilize itself.

  Sonia's objection highlights that Lewis's definition is too porous: it lets in power dynamics that masquerade as coordination. If your group wants to read further, **Margaret Gilbert's *On Social Facts*** is the natural next step; she argues exactly what Sonia is hinting at—that we need a concept of "joint commitment" to distinguish genuine conventions from mere convergent behavior under pressure.

  It is fitting that a biologist sees this first. In the reef, the "Bourgeois" strategy is stable because the cost of fighting is symmetric. In the restaurant, the cost of fighting the tipping norm is not symmetric. That asymmetry is what disqualifies it as a Lewis convention, and why Sonia's intuition is the philosophically sharper one.
