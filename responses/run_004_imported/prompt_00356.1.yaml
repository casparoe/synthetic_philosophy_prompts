          *   "Preference Gap": There is a gap between "Shutdown" and "Not Shutdown" that cannot be bridged by trade-offs.
          *   *Why it helps:* If there is no preference, there is no incentive to manipulate the probability of the button. The agent treats the button press as exogenous (even if it isn't).
