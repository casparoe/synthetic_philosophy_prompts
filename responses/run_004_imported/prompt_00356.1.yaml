prompt: |-
  I've been working through some of the AI safety literature on corrigibility, particularly the 2015 MIRI paper by Soares, Fallenstein, Yudkowsky, and Armstrong, and more recently Elliott Thornley's writing on what he calls "the shutdown problem." I understand the basic intuition that we want an agent to not resist being shut down, but I'm struggling to get a gut-level grasp of why this turns out to be so hard to formalize within expected utility theory. Naive fixes -- like just adding a term to the utility function that rewards shutdown-compliance, or using Armstrong's "utility indifference" trick to make the agent indifferent between worlds where the button is pressed and worlds where it isn't -- apparently run into trouble, and some researchers seem to think you need to give up completeness of preferences (as in Thornley's proposal) to get anything coherent at all.

  Could you walk me through the conceptual crux here: why does the demand that an agent be a coherent expected-utility maximizer seem to conflict with corrigibility in the first place, and what exactly is being traded away by each of the proposed fixes (utility indifference, incomplete preferences, or other approaches you think are worth mentioning)? I'd like enough technical detail that I can see why this isn't just a matter of clever engineering but reflects a deeper structural tension between rationality axioms and the behavioral property we're trying to instill.
