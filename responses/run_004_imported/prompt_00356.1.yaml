      *   *The "Crux":* The agent needs to have different preferences depending on a future event (button press) that it can influence. This violates standard dynamic consistency or independence axioms.
      *   *Structure:*
          1.  Define Corrigibility precisely (Soares et al. definition).
          2.  The Standard EUT Failure (Instrumental Convergence/Resistance).
          3.  Naive Fix 1: Rewarding Shutdown (Manipulation incentive).
