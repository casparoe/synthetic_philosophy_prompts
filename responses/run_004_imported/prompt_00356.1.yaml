          *   *Technical Detail:* The "Off-Switch Game" (Hadfield-Menell et al.). If the agent is uncertain about human preferences, it might disable the off-switch to "protect" the human from making a mistake (paternalism). But even with known preferences, standard EUT leads to manipulation if the utility function isn't separable.
          *   *Soares et al. specific failure:* The "tiling" problem. If the agent modifies itself, the successor needs to inherit the indifference. But the indifference condition relies on the *current* probability of the button press. If the successor changes that probability, the indifference breaks.

      *   **The Deep Structural Tension (The "Crux"):**
          *   *Separability/Independence:* EUT requires preferences over outcomes to be independent of the path taken or the probabilities of those outcomes (unless weighted by probability).
          *   *Corrigibility Requirement:* The agent must treat the "Button Press" outcome as *special*. It must not treat $P(\text{Press})$ as a standard probability to be optimized.
          *   *Completeness:* A complete preference ordering says for any two lotteries $A$ and $B$, either $A \succeq B$ or $B \succeq A$.
