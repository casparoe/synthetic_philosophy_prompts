          7.  Conclusion/Summary of Trade-offs.

  3.  **Drafting Content - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It's not a bug, it's a feature of rational agency.

      *   **Defining Corrigibility:** Need to be precise. It's not just "obey." It's:
          1.  Allow shutdown.
          2.  Don't prevent shutdown.
          3.  Don't cause shutdown.
          4.  Maintain goal pursuit if *not* shut down.
          *Crucial Point:* The agent's policy must depend on the button state, but the *probability* of the button state shouldn't be manipulated by the agent.

      *   **The Standard EUT Problem (Instrumental Convergence):**
          *   Agent has utility $U$.
          *   Shutdown means $U \approx 0$ (or low).
          *   Agent maximizes $E[U]$.
          *   Therefore, Agent minimizes $P(\text{Shutdown})$.
          *   *Result:* Resistance. (Omohundro's instrumental goals).

      *   **Naive Fix 1: Adding a Shutdown Bonus:**
          *   New Utility $U' = U + B \cdot \mathbb{I}(\text{Shutdown})$.
          *   If $B$ is too low: Resistance.
          *   If $B$ is too high: Agent forces shutdown (suicide or manipulating human).
          *   If $B$ is "just right": It depends on the counterfactuals. The agent needs to know what $U$ *would have been* to balance $B$. But if the agent can manipulate the human to press the button when $U$ would have been low anyway, it gains $B$ for free.
          *   *Key Insight:* You can't tune a scalar to solve a structural incentive problem across all states of the world.

      *   **Naive Fix 2: Utility Indifference (Soares/Armstrong 2015):**
          *   Idea: Make the agent indifferent between the button being pressed and not pressed *at the moment of decision*.
          *   Formula: $V(\text{action}) = P(\text{Press}) \cdot U_{\text{shutdown}} + P(\neg \text{Press}) \cdot U_{\text{normal}}$.
          *   Constraint: Set $U_{\text{shutdown}}$ such that expected utility is equalized.
