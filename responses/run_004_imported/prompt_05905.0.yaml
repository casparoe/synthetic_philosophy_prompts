answer: |-
  You're asking a classic question in modal metaphysics, and while your intuition is shared by many critics of David Lewis (it *does* feel like he's just playing semantic games), **Jordan is right.** This is not merely a verbal dispute; it is a substantive metaphysical disagreement.

  The reason it feels like a "costume change" is that Lewis designed Counterpart Theory (CT) specifically to preserve the truth values of our ordinary modal claims (like "Humphrey could have won"). If CT made "Humphrey could have won" come out false, it would be an immediate failure. So, on simple, everyday sentences, the two theories are often **extensionally equivalent** (they agree on the output).

  However, metaphysics isn't just about saving the phenomena of ordinary language; it's about what exists and how it is structured. Here is why the choice between Transworld Identity (TWI) and Counterpart Theory (CT) is a deep metaphysical commitment, not just a label swap.

  ### 1. The Truthmakers are Different (Ontology)
  Even if both theories agree that the sentence "Humphrey could have won" is **true**, they disagree violently on *what makes it true*.

  *   **TWI:** The truthmaker is **Humphrey himself**. The very same numerical entity that is standing here talking to you exists in another possible world and wins an election there. This requires a metaphysics where individuals can be "multi-located" across worlds or are abstract entities that span worlds.
  *   **CT:** The truthmaker is **a distinct individual** who resembles Humphrey. The Humphrey in our world never leaves our world. What makes the claim true is the existence of a *different* guy in a *different* concrete universe who looks and acts like Humphrey.

  This is an ontological disagreement. One view says objects can transcend their actual spatiotemporal boundaries; the other says objects are world-bound. That is a factual disagreement about the nature of objects, not a semantic one.

  ### 2. The Logic of Identity vs. Similarity
  You suggested that picking out the counterpart is "just picking out the one guy over there who counts as 'him'." But the criteria for "counting as him" differ fundamentally in their logical properties.

  *   **Identity is Transitive:** If $A = B$ and $B = C$, then $A = C$.
  *   **Counterpart Relations are Not:** Counterpart theory relies on *similarity*. Similarity is notoriously non-transitive.
      *   *Example:* Humphrey ($w1$) has a counterpart ($w2$) who is very similar to him. That counterpart ($w2$) has a counterpart ($w3$) who is very similar to *him*. But the guy in $w3$ might be too different from the original Humphrey to count as *his* counterpart.
      *   **Consequence:** In TWI, if Humphrey exists in $w3$, he is identical to the Humphrey in $w1$. In CT, Humphrey ($w1$) might have no counterpart in $w3$ at all, even if there is a chain of counterparts linking them. This changes the logic of iterated modality (claims about "possible possibilities").

  ### 3. Haecceitism vs. Qualitative Supervenience
  This is the biggest metaphysical wedge between the views.

  *   **TWI often allows for Haecceitism:** Many proponents of TWI (like Kripke) hold that there is a "this-ness" (haecceity) to an individual that is independent of their properties. You could theoretically have a world where *you* exist, but you have almost none of the qualitative properties you actually have (different parents, different DNA, different history), provided there is the right causal chain. You are still *you* because of your identity, not your qualities.
  *   **Lewis's CT denies Haecceitism:** For Lewis, there is no "bare identity." What makes someone your counterpart is entirely a matter of **qualitative similarity** and causal relations. If a being in another world doesn't resemble you qualitatively, they aren't your counterpart, regardless of whether God labels them "You."

  If you choose TWI, you are buying into a metaphysics where identity can float free of qualitative properties. If you choose CT, you are buying into a metaphysics where identity is grounded in qualitative resemblance. These are incompatible views on the nature of individuation.

  ### 4. They Don't *Always* Agree on Truth Values
  Your premise ("if the two views are always going to agree on which claims... come out true") is actually false. There are technical cases where they diverge.

  *   **Contingent Identity:** Some versions of TWI struggle with statements like "Hesperus might not have been Phosphorus" (if we treat names as non-rigid, though Kripke argues they are rigid). CT handles de re modality differently.
  *   **The "Two Counterparts" Problem:** Suppose in world $W2$, there are two people who are equally good candidates for being Humphrey's counterpart (maybe Humphrey's sperm and egg were combined in two different ways?).
      *   **TWI:** This is a contradiction. Humphrey cannot be identical to two distinct people in $W2$. So, "Humphrey exists in $W2$" must be false (or indeterminate).
      *   **CT:** Humphrey ($w1$) can have **two** counterparts in $W2$. Therefore, "Humphrey could have been $A$" is true, and "Humphrey could have been $B$" is true, even though $A$ and $B$ are distinct. CT allows for a branching of de re possibility that strict identity forbids.

  ### 5. Why Lewis Rejected TWI (It's not circular)
  Jordan kept saying Lewis "doesn't believe in transworld identity." The reason isn't circular; it's grounded in Lewis's **Modal Realism**.

  Lewis believes possible worlds are concrete, spatiotemporally isolated universes.
  *   If you believe worlds are concrete and isolated, **Transworld Identity is impossible.** An object cannot be in two spatiotemporally disconnected places at once. If I am here, I am not *there*. If "there" is a different universe, I cannot be in it.
  *   Therefore, if you accept Lewis's ontology (concrete worlds), you *must* accept Counterpart Theory.
  *   If you accept Transworld Identity, you generally must reject Lewis's concrete Modal Realism in favor of Actualism (worlds are abstract) or a different conception of concrete worlds (where they overlap).

  ### The Verdict
  You are treating the dispute as if it's only about **translation** (how we map English sentences to logic). Lewis admits CT is a translation manual. But the dispute is about **metaphysics** (what the world is made of).

  *   **Your view:** "It doesn't matter, as long as 'Humphrey could have won' comes out true."
  *   **The Metaphysician's view:** "It matters immensely whether the truth of that sentence requires the existence of a transworld individual or a world-bound similar individual."

  **Jordan wins.** Choosing between CT and TWI forces you to take a stance on the necessity of identity, the nature of similarity, the possibility of haecceitism, and the ontological status of possible worlds. That is the definition of a substantive metaphysical decision. Tell Jordan to stop looping on "Lewis doesn't believe it" and hit you with the **Haecceitism** and **Transitivity** arguments; those are the knockout punches.
