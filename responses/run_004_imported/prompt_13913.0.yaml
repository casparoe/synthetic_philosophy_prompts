          *   Preface: Finding an error in Claim A might undermine confidence in Claim B (if they rely on the same source), or finding no errors might boost confidence.
      *   *Philosophical Leverage:* Henry Kyburg (who proposed the Lottery Paradox) actually accepted the contradiction to save the Lockean Thesis (belief = high probability). Others (like Kaplan) distinguish between *statistical* acceptance and *evidential* acceptance.
      *   *The "Solution" Divergence:*
