          *   Solution to Preface often involves distinguishing *degrees of belief* (credence) vs. *full belief*, or appealing to the *normative* nature of assertion vs. belief.
          *   Crucially: In the Preface, the author *asserts* the claims. In the Lottery, the agent doesn't assert the tickets lose; they just believe it. Assertion norms might allow the preface disclaimer in a way lottery beliefs don't align.

  5.  **Drafting the Argument (Iterative Process):**
