      *   *Key Distinction 2: Independence vs. Mutual Exclusivity.*
          *   Lottery: The propositions "Ticket $i$ will lose" are *not* independent in a way that allows all to be true. In fact, they *cannot* all be true (someone must win). The negation is a logical necessity derived from the setup.
