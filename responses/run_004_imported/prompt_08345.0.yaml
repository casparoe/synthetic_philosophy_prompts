      *   *Core Assumption 1:* Binary choice (True/False, Good/Bad). Grants are continuous (1-10) or multi-criteria.
      *   *Core Assumption 2:* Independence. Voters must decide independently.
      *   *Core Assumption 3:* Competence. Each voter must have $p > 0.5$ probability of being "correct."
