answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name/Coordinator]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Reviewer Panel Size and Process Design

  ### 1. Executive Summary
  This memo resolves the outstanding disagreement regarding reviewer panel size for the upcoming funding cycle. After analyzing the mathematical claims and operational constraints, **I recommend maintaining a core panel of 3 reviewers per application**, but implementing structural changes to maximize reviewer independence.

  Expanding to 10 reviewers per grant is rejected. While the Condorcet Jury Theorem (CJT) offers a compelling theoretical framework for aggregate accuracy, its core assumptions (specifically independence and defined competence) are violated in our specific context. Expanding to 10 reviewers would increase operational overhead by ~230% without guaranteeing improved decision quality, potentially consuming a significant percentage of our deployable capital in coordination costs.

  Instead, we will focus on **decorrelating the existing 3 reviewers** and introducing a "variance trigger" for edge cases.

  ### 2. The Proposal: Expanding to ~10 Reviewers
  One committee member proposed expanding the reviewer pool to ~10 individuals per application. The argument relies on the **Condorcet Jury Theorem (CJT)**.

  **The Steelman Argument:**
  The CJT posits that if a group of voters is making a binary decision (e.g., "Fund" vs. "Reject"), and each voter has an individual probability of correctness ($p$) greater than 0.5, the probability of the majority reaching the correct decision approaches 1 as the group size increases.
  *   **Error Cancellation:** Random errors made by individual reviewers cancel each other out in the aggregate.
  *   **Robustness:** A larger pool protects against outliers, bad days, or specific blind spots of individual reviewers.
  *   **Democratization:** It dilutes the influence of any single committee member's bias.

  In theory, if our reviewers are even modestly competent (e.g., 60% accuracy), a panel of 10 is mathematically superior to a panel of 3.

  ### 3. Why CJT Breaks Down in Our Context
  While the math is sound, the *inputs* required for the theorem to hold do not match our operational reality. There are three specific failure modes:

  **A. Violation of Independence (The Correlation Trap)**
  CJT strictly requires that voters decide *independently*. In the EA-adjacent ecosystem, this is impossible at N=10.
  *   **Shared Priors:** Our potential reviewer pool draws from the same epistemic commons (LessWrong, specific Twitter circles, key conferences, shared literature).
  *   **Correlated Error:** If Reviewer A and Reviewer B both read the same influential blog post arguing against a specific methodology, their "errors" are correlated. Correlated errors do not cancel out; they compound.
  *   **Effective N:** If the correlation coefficient between reviewers is high, a panel of 10 may have an "effective N" of only 3 or 4. We would incur the cost of 10 without the statistical benefit.

  **B. Undefined Competence ($p > 0.5$)**
  CJT requires that each reviewer is more likely to be right than wrong.
  *   **No Ground Truth:** Unlike a jury trial (where a defendant is objectively guilty or innocent), grant impact is counterfactual and revealed only years later. We cannot verify if a "Reject" was actually a "Bad Decision" until long after the fund closes.
  *   **Signal-to-Noise:** For early-stage research, the signal is weak. Adding more noise (reviewers guessing on weak signals) does not improve accuracy, even if $N$ increases.

  **C. Operational Cost vs. Fund Size**
  *   **Budget Constraint:** With a low-six-figure budget, our overhead ratio is critical. Tripling the review burden (from 3 to 10) requires either tripling the volunteer ask (risking burnout/dropout) or paying reviewers (reducing capital available for grants).
  *   **Diminishing Returns:** Moving from 1 to 3 reviewers yields massive accuracy gains. Moving from 3 to 10 yields marginal gains *only if* independence holds. Given the correlation risk, the ROI on the 4th through 10th reviewer is negative.

  ### 4. Recommendation: The "Optimized 3" Model
  We will **maintain a panel of 3 reviewers per application** but alter *how* those 3 are selected and how they score. This addresses the CJT proponent's desire for accuracy without triggering the Skeptic's concerns about correlation and cost.

  **Key Design Changes:**
  1.  **Stratified Reviewer Assignment:** We will not assign 3 random reviewers. We will intentionally assign reviewers with *orthogonal* priors (e.g., one domain expert, one generalist EA, one methodological skeptic). This artificially lowers the correlation coefficient, increasing the "effective N."
  2.  **Blind Scoring Phase:** Reviewers must submit scores and written rationales *before* seeing other reviewers' scores. This prevents anchoring bias, preserving independence.
  3.  **Variance Trigger:** If the standard deviation of the 3 scores exceeds a threshold (e.g., scores of 2, 5, and 9), the application triggers a **"Tiebreaker Review."** We will add 2 additional reviewers specifically for that grant. This applies the CJT logic only where uncertainty is highest, rather than paying for it on clear rejects/accepts.

  ### 5. Implementation Plan (Phasing)

  **Phase 1: Immediate (Next Meeting)**
  *   **Adopt Protocol:** Formalize the "Blind Scoring" rule. No discussion until scores are locked.
  *   **Map the Pool:** Create a simple matrix of potential reviewers noting their background/epistemic tribe. Use this to ensure the "Stratified Assignment" for the next cycle.

  **Phase 2: Pilot (Next Funding Cycle)**
  *   **Run the Variance Trigger:** Identify the top 20% of applications with the highest score variance. Manually recruit 2 additional reviewers for just these applications.
  *   **Measure Burden:** Track time-to-complete for reviewers. If the "Optimized 3" increases burden significantly, adjust the rubric, not the panel size.

  **Phase 3: Review (Post-Cycle)**
  *   **Calibration Check:** Compare the "Tiebreaker" outcomes against the initial 3. Did the extra reviewers change the decision? If the Tiebreaker rarely changes the outcome, the initial 3 are sufficient. If they frequently change the outcome, we revisit the panel size for *finalists* only.

  ### 6. Conclusion
  The Condorcet Jury Theorem is a powerful tool, but it is not a free lunch. It purchases accuracy with independence. In a small, tightly networked community, independence is the scarce resource, not reviewer headcount. By focusing on **decorrelating our existing 3 reviewers** and targeting additional review only where variance indicates uncertainty, we maximize decision quality per dollar spent.

  **Action Required:** Approval to proceed with the "Optimized 3" design and the Variance Trigger protocol for the upcoming cycle.
