answer: |-
  You have put your finger on one of the most persistent and embarrassing open wounds in Bayesian epistemology. As a physicist, your intuition is spot-on: the math says one thing, and the history of science says another.

  You are correct that this is the **Problem of Old Evidence (POE)**, famously articulated by Clark Glymour in his 1980 book *Theory and Evidence*. Glymour, ironically, was using this to argue *against* Bayesianism, suggesting that hypothetico-deductivism (HD) handled this better than Bayes.

  The dilemma you pose is stark:
  1.  **Math:** If $P(E) = 1$, then $P(H|E) = P(H)$. No confirmation occurs.
  2.  **History:** Einstein derived the 43 arcseconds/century from the field equations *after* the number was known. The physics community treated this as massive confirmation.

  If you stick to standard, textbook Bayesianism with the assumption of **logical omniscience** (the idea that an agent knows all logical consequences of their beliefs instantly), you are forced to bite the bullet: Mercury's perihelion did *not* confirm GR. Most philosophers of science (and many physicists) find that conclusion absurd.

  However, you don't actually have to abandon Bayesianism, nor do you have to declare the physicists irrational. There are three main ways Bayesians have attempted to resolve this, ranging from "tweak the priors" to "redefine the evidence."

  ### 1. The Counterfactual Prior (The "Howson" Solution)
  Colin Howson and others argue that when we evaluate a theory against old evidence, we are engaging in a counterfactual exercise. We are asking: *"What would my credence in H be if I did not know E, but knew everything else?"*

  In this view, we temporarily "de-conditionalize" on $E$. We construct an "ur-prior" where $P(E) < 1$. We then calculate the likelihood ratio. Since GR predicts $E$ with high precision and Newtonian mechanics (plus auxiliaries) does not, the likelihood ratio favors GR heavily.

  **The Physicist's Critique:** This feels like cheating. It requires us to pretend we don't know facts we definitely know. How do we rigorously construct a prior where we "forget" Mercury's orbit but remember everything else about celestial mechanics? It seems psychologically and mathematically messy.

  ### 2. Relaxing Logical Omniscience (The "Garber" Solution)
  This is often considered the most technically robust solution, and it might appeal to your mathematical sensibilities.

  Standard Bayesianism assumes **logical omniscience**: if $H$ entails $E$, the agent knows it immediately. Therefore, $P(H \to E) = 1$ always.
  Daniel Garber (1983) suggested that what actually changes when Einstein finishes GR isn't the probability of $E$ (which was already 1), but the probability of the **logical relationship** between $H$ and $E$.

  Let $L$ be the proposition "H entails E".
  At time $t_0$ (before GR is finished), $P(L) < 1$. Einstein isn't sure his theory will work.
  At time $t_1$ (after the derivation), $P(L) \to 1$.

  We update not on $E$, but on $L$.
  $$P(H | L) > P(H)$$
  This works because learning that your theory *successfully captures* a known anomaly is new information, even if the anomaly itself was old. It treats the *derivation* as the evidence, not the *data point*.

  **The Physicist's Critique:** This requires expanding the probability space to include logical sentences as events, which violates the standard Kolmogorov axioms used in textbook probability. However, for a working scientist, this matches the experience: the "work" was proving the entailment, not measuring the perihelion.

  ### 3. Predictivism (Biting the Bullet)
  There is a minority view, often called **Predictivism**, which suggests you *should* bite the bullet. They argue that old evidence *cannot* confirm a theory in the same way novel predictions do.

  The argument is that any theory can be curve-fit to old data (the "fudging" problem). The fact that Einstein derived the 43 arcseconds is impressive, but the *real* confirmation came later with the 1919 eclipse (light deflection), which was a novel prediction ($P(E_{new}) < 1$).

  **The Physicist's Critique:** This contradicts the historical record. Einstein, Eddington, and Schwarzschild absolutely counted the Mercury perihelion as a primary pillar of evidence *before* the eclipse data came in. To say they were irrational is to ignore the actual sociology and psychology of discovery.

  ### My Take for a Retired Physicist
  If I may offer a synthesis: The problem arises because we are modeling **scientific discovery** using a static probability calculus designed for **decision making under uncertainty**.

  In the static model, $E$ is a proposition with a truth value. In the dynamic process of physics, $E$ is a **constraint on the solution space**.

  When Newtonian physics failed to account for the 43 arcseconds (even with Vulcan hypothesized), the "residual" was a known constraint. When GR appeared, it didn't just "match" the data; it showed that the data was a **necessary consequence of the geometry of spacetime**, not a contingent fact requiring an ad-hoc fix (like a hidden planet).

  The Bayesian update that happens isn't $P(H|E)$. It is an update on the **structural robustness** of $H$.
  *   **Hypothesis A (Newton + Vulcan):** Requires new parameters/entities to fit $E$.
  *   **Hypothesis B (GR):** Fits $E$ with no new parameters.

  If you frame the evidence not as "Mercury moves at X rate" but as "Theory H explains X rate *without new parameters*," then $P(E)$ is no longer 1. The evidence is the *efficiency of the explanation*, which was unknown until Einstein did the math.

  ### Conclusion
  You don't have to throw out Bayesianism, but you do have to acknowledge that the "textbook" version (Logical Omniscience + Static Priors) is insufficient for the history of science.

  Most modern Bayesians accept **Garber's approach**: the confirmation comes from learning the logical connection ($H \vdash E$), not the empirical fact ($E$). This preserves the intuition that physicists were rational while saving the mathematical framework, provided you allow probabilities to range over logical relationships, not just empirical states.

  So, the physicists weren't wrong. The textbook definition of $E$ was just too narrow. The evidence wasn't the perihelion; the evidence was the *derivation*.
