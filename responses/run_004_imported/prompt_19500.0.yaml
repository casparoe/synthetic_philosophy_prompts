answer: |-
  **Setting:** *A university coffee lounge, late afternoon. The remains of a seminar on Wittgenstein's* On Certainty *are scattered on the table—napkins with scribbled propositions, empty espresso cups. ELIAS (40s, rumpled blazer, leans toward the therapeutic/pragmatic reading) is leaning back. SARAH (30s, precise, notebook open, leans toward the analytic/epistemic reading) is leaning forward.*

  **Sarah:** You're letting them off the hook, Elias. That's the problem with your Pritchardian move. If hinge commitments are truly *arational*—if they sit outside the space of reasons entirely—then you can't say the conspiracy theorist is making a mistake. You can only say they're playing a different language game.

  **Elias:** I'm not saying they're playing a *different* game. I'm saying they're trying to play the game without the board. Look, take the proposition: *The earth has existed for many years.* For us, that's a hinge. It's not something we verify; it's the mechanism by which we verify other things. If someone treats that as an empirical hypothesis to be tested, they haven't entered the epistemic practice yet.

  **Sarah:** But the Flat-Earther *does* treat it as a hinge. They don't test it every morning. They wake up assuming the ground is flat. It functions structurally exactly like our hinge that the ground is roughly spherical. On your view, since hinges are groundless commitments, mere "animal faith" or arational certainties, what resource do you have to tell them they're wrong? You've stripped yourself of the normative vocabulary to say their hinge is *irrational*.

  **Elias:** Because it's not about rationality at the hinge level. It's about coherence and action. Our world-picture allows for navigation, satellite deployment, consistent prediction. Theirs requires constant ad-hoc修补 (patching). When a Flat-Earther sees a ship disappear over the horizon, they have to invent atmospheric refraction theories that contradict their optics elsewhere. We don't.

  **Sarah:** That's pragmatic success, not epistemic rightness. You're shifting the goalposts. In the seminar, you claimed hinges are *outside* justification. Now you're smuggling justification back in through the back door of "pragmatic coherence." If I'm a quasi-fideist, I have to accept that my commitment to *There is an external world* is on the same arational footing as the Moon-landing denier's commitment to *The government controls all space imagery*. Both are groundless. If I challenge them, I'm just asserting my ground against theirs. That's relativism, Elias.

  **Elias:** It's not relativism if one system collapses under the weight of its own application and the other doesn't. Wittgenstein says the riverbed of thoughts may shift, but some stones are harder than others. The Flat-Earther's stones are sand. But I grant you this: I cannot produce a *proof* that their hinge is false without already assuming my hinge is true. That's circular. So, yes, at the bedrock, I am shoring up my spade. But I'm not saying my spade is "rationally justified" in a foundationalist sense. I'm saying it's the only one that digs.

  **Sarah:** But that leaves the skeptic untouched. And worse, it leaves the dogmatist untouched. If hinges are arational, then holding a hinge is like having a preference for vanilla over chocolate. You can't reason someone out of a vanilla preference. But epistemic norms *should* be able to condemn certain commitments. That's why I side with Wright. We need to keep hinges inside the space of reasons, just not via evidence.

  **Elias:** Ah, the Entitlement move. The magic wand. "We are rationally entitled to accept hinges without evidence."

  **Sarah:** It's not magic. It's a recognition that evidence runs out. If every belief required evidential support, we'd face an infinite regress. Entitlement is a non-evidential warrant. It's a rational permission to trust our cognitive faculties and the resulting picture of the world, provided certain conditions are met.

  **Elias:** And there's the rub. *Provided certain conditions are met.* What conditions? If the Flat-Earther claims entitlement to their hinge, how do you deny it without asking for evidence? If you say, "Your entitlement is invalid because your hinge is false," you're begging the question. If you say, "Your entitlement is invalid because your cognitive faculties are broken," you need evidence of that breakdown. But if you had evidence, you wouldn't need entitlement theory. You'd just have a rebutting defeater.

  **Sarah:** Not necessarily. Entitlement isn't about the truth of the proposition *per se*; it's about the rationality of the trust. We are entitled to trust perception and memory because without that trust, cognitive project completion is impossible. The Flat-Earther, however, often violates *other* rational norms to maintain their hinge. They ignore testimony, they cherry-pick data.

  **Elias:** But that's my point! You're evaluating their *inferences*, not their hinge. But what if they are consistent? What if there's a sincere Moon-landing denier who has constructed a perfectly coherent web of belief where NASA is the devil? They trust their memory, they trust their perception of "flat horizons." They claim entitlement. Why is your entitlement to *Trust NASA* valid and theirs to *Distrust NASA* invalid?

  **Sarah:** Because entitlement isn't unrestricted. Wright argues that entitlements can be defeated. If I have a specific reason to doubt a faculty, the entitlement lapses.

  **Elias:** But the denier *has* a specific reason. They saw a documentary about lighting inconsistencies.

  **Sarah:** Which is itself based on hinges about optics and physics that they are selectively applying! Look, Elias, the cost of your view is higher. If you make hinges arational, you surrender the claim that the scientist is *more rational* than the conspiracy theorist. You can only say the scientist is more *effective*. But epistemology is about rationality, not just engineering. I want to say the denier is making a rational mistake, not just a practical one.

  **Elias:** And the cost of your view is that "Entitlement" becomes a placeholder for "Hinges I Like." You want to say we have a *right* to our hinges. But if that right isn't based on evidence, what grounds it? If it's grounded in the necessity of the project, the Flat-Earther's project is necessary for *them*. You have to argue their project is objectively worthless. To do that, you need to show their hinges are false. To show they're false, you need evidence. To get evidence, you need hinges. You're in the same circle I am; you've just painted it gold and called it "warrant."

  **Sarah:** (Pauses, tapping her pen) I'll concede that defining the boundaries of entitlement without circularity is the hardest part of the view. If I say entitlement relies on the "truth-conduciveness" of the faculty, I need an argument for that, which risks the very regress Wright wanted to avoid. So, yes, I have to accept that entitlement is a kind of default status that can feel precarious when challenged by a coherent alternative system. I can't prove the denier lacks entitlement without assuming the very framework that grants me entitlement.

  **Elias:** Okay. And I'll concede this: Calling hinges "arational" leaves me vulnerable to the charge of quietism. If I can't say the denier is *irrational*, just *different*, then epistemology loses its critical bite. It becomes anthropology. I describe how we believe, but I can't prescribe how we *ought* to believe at the fundamental level. That's a bitter pill for a philosopher to swallow.

  **Sarah:** So we're stuck. Either I risk circularity to save normativity, or you save the structure of inquiry but sacrifice the claim that our hinges are rationally superior to the fanatic's.

  **Elias:** Wittgenstein would say that's exactly where we belong. At the limit of what can be said.

  **Sarah:** Maybe. But I still think my view gives us more to say. Even if the ground is shaky, "Entitlement" lets me call the denier *unreasonable* if they refuse to acknowledge the default warrant of common sense. You can't even call them unreasonable.

  **Elias:** I can call them unmoored. But you're right. It's less satisfying. (He picks up his cup.) It seems the price of avoiding skepticism is either a dogmatism of entitlement or a silence of fideism.

  **Sarah:** Or it's the recognition that rationality isn't a fortress. It's a raft. We rebuild it while floating. The question is just whether we call the planks "warranted" or just "necessary."

  **Elias:** As long as we don't drown while arguing about the name of the wood.

  **Sarah:** (Closes notebook) Fair enough. Same time next week? We can tackle whether the hinges can change without us noticing.

  **Elias:** Don't remind me. That's the one that keeps me up.
