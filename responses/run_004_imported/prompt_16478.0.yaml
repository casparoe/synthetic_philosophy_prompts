answer: |-
  This is a profound observation, and one that cuts to the heart of the methodological tensions in late nineteenth-century philosophy. You are quite right to sense that while Sidgwick and James sat on similar committees and investigated the same mediums (most notably Eusapia Palladino and Leonora Piper), they were engaged in fundamentally different philosophical projects. The psychical research was not a shared hobby; it was a symptom of their divergent metaphysical commitments.

  To answer your request, I will break this down into three parts: a comparison of their motivations, a comparison of their evidentiary standards, and an evaluation of the philosophical coherence of each position.

  ### 1. Motivations: Ethical Rescue vs. Empirical Expansion

  **Sidgwick: The Ethical Rescue Mission**
  For Sidgwick, psychical research was a desperate, instrumental necessity born of the failure of his ethical system. In *The Methods of Ethics*, Sidgwick establishes that Rational Egoism and Universal Hedonism (Utilitarianism) are both self-evident to reason. However, in a world governed by natural law, they frequently conflict. If I sacrifice my happiness for the general good, and death is the end, I have acted irrationally from the standpoint of my own interest.

  Sidgwick's turn to the SPR was an attempt to find empirical support for the **Kantian Postulates of Practical Reason**. Kant argued we must *postulate* God and immortality to make sense of moral duty. Sidgwick, being more empirically minded than Kant, was unsatisfied with a mere postulate. He wanted *evidence*. If he could prove via the scientific method that:
  1.  Personal consciousness survives death, and
  2.  The universe is morally governed (i.e., virtue is rewarded in the long run),
  ...then the Dualism of Practical Reason would dissolve. Egoism and Utilitarianism would coincide in the afterlife.

  Thus, Sidgwick's motivation was **teleological and restorative**. He hoped psychical research would provide the missing premise to save Rationalist Ethics from collapse. He was looking for a specific theological fact to close a logical gap.

  **James: The Empirical Expansion**
  For James, the motivation was almost the inverse. He was not trying to save a specific ethical system that required immortality to function. James's ethics were grounded in pragmatism and the "strenuous mood"—the demand for a moral life is valid regardless of metaphysical guarantees.

  James's interest in the SPR was driven by **Radical Empiricism** and his war against "scientific materialism." James argued that mainstream science arbitrarily drew a boundary around experience, excluding religious, mystical, and psychic phenomena as "pathological" or "illusory." For James, if a medium produces phenomena that are experienced, they are data. To ignore them is "vicious intellectualism."

  His investigation of Leonora Piper was not primarily to prove immortality (though he hoped it might), but to prove that **human consciousness is not limited by the brain**. If telepathy were real, the monistic, closed universe of materialism was false, and a "pluralistic universe" was possible. This opened the door for religious experience to be taken seriously without demanding dogmatic theology. James's motivation was **methodological and expansive**. He wanted to widen the scope of what counts as legitimate knowledge.

  ### 2. Standards of Evidence: Legalistic Proof vs. Pragmatic Cash-Value

  **Sidgwick: The Skeptical Jurist**
  Sidgwick approached the SPR as the founding president of a scientific body. His standard of evidence was legalistic, rigorous, and aimed at universal rational assent. He wanted data that would convince a skeptic *by force of logic*.
  *   **The Standard:** Proof that could withstand the scrutiny of the Royal Society.
  *   **The Attitude:** He was famously difficult to convince. He approached séances with a demeanor that mediums found chillingly cold.
  *   **The Paradox:** While he demanded high empirical standards, he was motivated by a deep *need* for the result to be true. This created a tragic tension: the more rigorous his scientific method, the less likely he was to find the conclusive proof he needed to resolve his ethical dualism. He remained privately agnostic to the end, which meant his ethical dualism remained unresolved.

  **James: The Pragmatic Participant**
  James's standard of evidence was personal, cumulative, and pragmatic. In *The Varieties of Religious Experience* and his essays on psychical research, James argues that in matters of religion and metaphysics, we have a "will to believe" when the option is living, forced, and momentous.
  *   **The Standard:** Does this phenomenon have "cash value"? Does it make a tangible difference in how we understand the world?
  *   **The Attitude:** James was willing to entertain "over-beliefs." He admitted that the Piper sittings convinced *him* of telepathy, even if he couldn't formulate a proof that would convince a hostile critic. He valued the *quality* of the experience and its coherence with a wider metaphysics over strict replicability.
  *   **The Flexibility:** James was comfortable with ambiguity. If the spirits were real, good; if they were fragments of the subconscious, that was also philosophically interesting (supporting a wider self). Sidgwick needed a specific answer; James was satisfied with a broader question.

  ### 3. Evaluation of Philosophical Coherence

  You asked which of the two had the more philosophically coherent reason for undertaking this inquiry. **William James emerges as the more coherent figure here, while Sidgwick's involvement represents a significant tension—if not a contradiction—within his system.**

  **The Case Against Sidgwick's Coherence**
  Sidgwick is a Rational Intuitionist. He believes moral truths are known *a priori* through reason (self-evident axioms). The crisis of the Dualism is a crisis of *Reason*, not of fact.
  *   **Category Error:** By turning to psychical research, Sidgwick attempts to solve a *normative* problem (what ought I to do?) with a *theoretical/empirical* fact (do I survive death?). If the rationality of morality depends on the empirical fact of an afterlife, then morality is no longer self-evident to reason; it becomes hypothetical ("Be moral *if* you want rewards in the afterlife"). This undermines the very intuitionist foundation of *The Methods of Ethics*.
  *   **The "God of the Gaps":** Sidgwick essentially treats psychical research as a theological stopgap. He is asking empirical science to do the work of metaphysics. While understandable given his distress, it is philosophically inconsistent for a Rationalist to rely on contingent empirical evidence to secure necessary moral truths.

  **The Case For James's Coherence**
  James is a Pragmatist and a Radical Empiricist. His philosophy is built on the premise that truth is made in the course of experience and that reality is still "in the making."
  *   **Methodological Consistency:** Radical Empiricism dictates that *everything* that is experienced must be accounted for in our philosophy. To exclude séance phenomena *a priori* would violate his own method. Investigating them is exactly what his philosophy demands.
  *   **Metaphysical Fit:** James's "Pluralistic Universe" allows for loose ends, hidden energies, and multiple layers of reality. Psychical research fits neatly into a metaphysics that rejects closed materialism. He does not need psychical research to *prove* morality; he uses it to prove that the universe is wider than science admits, which validates the *possibility* of religious belief.
  *   **No Dependency:** James's ethics do not collapse if psychical research fails. If there is no afterlife, the "strenuous mood" of creating moral value in *this* life remains valid. Therefore, his inquiry is a genuine search for knowledge, not a desperate plea for salvation.

  ### Conclusion

  Sidgwick's involvement in the SPR was a tragedy of philosophy: a brilliant mind realizing his rationalist system could not sustain the weight of human moral aspiration without empirical support it could not find. He sought **closure**—a final proof to silence the dualism.

  James's involvement was a triumph of philosophical consistency: an empiricist following the data wherever it led, even to the fringe, to break the dogmatism of the scientific establishment. He sought **openness**—a wider universe where more things might be true.

  For a PhD student working on nineteenth-century ethics, the lesson is stark: Sidgwick's dualism remains unresolved because he tried to ground the *ought* in an *is* that he could not locate. James avoided this trap by redefining truth itself. Sidgwick went to the séance table looking for a judge; James went looking for a neighbor. In terms of philosophical coherence with their broader systems, James's Radical Empiricism provides a much more stable foundation for psychical research than Sidgwick's Rational Intuitionism ever could.
