answer: |-
  This is a profound metaphysical challenge that strikes at the heart of contemporary philosophy of physics. David Lewis defined **Humean Supervenience (HS)** as the doctrine that "all there is to the world is a vast mosaic of local matters of particular fact, just one little thing and then another." For Lewis, this meant intrinsic properties instantiated at points (or small regions) of spacetime, with all else (laws, causation, chance) supervening on the global pattern of these local qualities.

  Bell's theorem, coupled with experimental violations of Bell inequalities, demonstrates that no theory based on **local separability** (the idea that the state of a composite system is fully determined by the intrinsic states of its spatial parts) can reproduce the predictions of quantum mechanics. If we accept the standard reading that nature is not governed by local hidden variables, the "local matters of particular fact" in 3D spacetime are insufficient to fix the physical state of the world.

  For a philosopher committed to the Humean spirit—specifically the rejection of necessary connections and the desire for laws to be descriptive summaries rather than prescriptive rulers—Bell's theorem forces a trilemma. Below is an assessment of the three strategies you outlined, evaluating whether they rescue HS or merely relocate the problem, followed by my assessment of the most defensible path.

  ---

  ### 1. Wavefunction Realism: Relocating the Mosaic to Configuration Space
  **The Strategy:** Proponents like David Albert and Alyssa Ney argue that the fundamental arena of physics is not 3D spacetime, but $3N$-dimensional configuration space. On this view, the wavefunction $\psi$ is a concrete, physical field. Crucially, $\psi$ assigns a value to every point in configuration space. Therefore, the value of the field at a point in configuration space *is* a local quality.

  **Assessment:**
  *   **Is it a genuine rescue?** Technically, **yes**. It preserves the *structure* of Humean Supervenience. There is a manifold (configuration space), there are points, and there are intrinsic properties (field values) at those points. The global state supervenes on the local distribution of the wavefunction amplitude/phase across this high-dimensional space. Separability is restored, just not in 3D space.
  *   **Does it relocate the problem?** Metaphysically, **yes**. Lewis's HS was tied to *spacetime*. He envisioned the mosaic as the history of the world we inhabit. By moving the mosaic to configuration space, you save the *logic* of HS but abandon its *phenomenological anchor*. You must now explain how the manifest 3D world of tables and chairs emerges from a fundamental high-dimensional reality. This is a massive explanatory burden (the "incoherence problem").
  *   **Verdict:** This is the only strategy that preserves the *letter* of Lewis's definition. However, it requires a revisionary ontology so drastic that many argue it ceases to be "Humean" in the spirit of empiricism, as the "local qualities" are no longer observable even in principle.

  ### 2. Entanglement as Primitive: Expanding the Humean Base
  **The Strategy:** This approach, associated with philosophers like Michael Esfeld and Vincent Lam (though they often frame it as OSR), and adapted by Humeans like Elizabeth Miller, suggests we keep 3D spacetime but expand the supervenience base. We admit non-local relations (entanglement facts) as part of the "mosaic." The base is no longer just *local* qualities, but includes holistic facts about spacetime regions.

  **Assessment:**
  *   **Is it a genuine rescue?** **No.** This is an admission that HS is false. Lewis explicitly defined HS via *intrinsic* properties of *points*. Non-local relations are neither intrinsic nor point-like. If the supervenience base includes irreducible relations between distant points, you have abandoned Separability, which was the core ontological commitment of HS.
  *   **Does it relocate the problem?** It dissolves the problem by changing the definition of "Humean." It preserves the *supervenience* claim (laws still supervene on the base) but abandons the *Humean* constraint on the base.
  *   **Verdict:** This is ontologically honest but metaphysically costly for a Lewisian. It concedes that the world contains "necessary connections" of a sort (holistic constraints) that Lewis wanted to avoid. It saves the *Best System Account (BSA)* of laws, but it kills *Humean Supervenience*. It turns "Humeanism" into a thesis only about laws, not ontology.

  ### 3. Modest Best System Account: Neutrality on Separability
  **The Strategy:** This approach, advocated by philosophers like Harjit Bhogal and John Roberts, decouples the Best System Account of laws from the specific ontology of the Humean Mosaic. One can maintain that laws are simply the axioms of the best deductive system summarizing the world's facts, without insisting that those facts be *local intrinsic qualities*.

  **Assessment:**
  *   **Is it a genuine rescue?** It rescues **Humeanism about Laws**, but explicitly abandons **Humeanism about Ontology**. It acknowledges that Bell's theorem refutes the Lewisian mosaic but argues that the *methodological* virtues of Humeanism (anti-modal realism, empiricist friendliness) remain viable if we allow the "base" to be whatever physics says it is (even if non-separable).
  *   **Does it relocate the problem?** It sidesteps the metaphysical conflict by lowering the ontological stakes. It treats HS not as a necessary truth about the world, but as a contingent hope that turned out to be false.
  *   **Verdict:** This is the most flexible strategy. It allows one to remain a "Humean" in the sense of rejecting governing laws and modal realism, without fighting quantum mechanics.

  ---

  ### Comparative Assessment and Recommendation

  To answer your specific question: **Strategies 2 and 3 are not rescues of Humean Supervenience; they are rescues of Humean *Nomology* at the expense of Humean *Ontology*.** Only Strategy 1 attempts to rescue HS proper, but at the cost of making the "spacetime" of the mosaic unrecognizable.

  If your goal is to preserve something **recognizably Humean**, you must decide what is essential to Humeanism for you:
  1.  **The Ontology:** A world of independent, local existences (Separability).
  2.  **The Nomology:** Laws as summaries, not rulers (Best System).
  3.  **The Modality:** No necessary connections between distinct existences.

  Bell's theorem forces us to drop #1 if we keep 3D spacetime.

  #### Which is most defensible?

  I find **Strategy 3 (The Modest Best System Account)** to be the most defensible position for a contemporary metaphysician, though **Strategy 1** is the most interesting for a die-hard Lewisian.

  **Why Strategy 3 wins:**
  It avoids the metaphysical extravagance of Wavefunction Realism (Strategy 1). Positing a $3N$-dimensional space as *fundamental* reality creates a severe disconnect between our fundamental ontology and our manifest experience, requiring a complex derivation of 3D space that risks being ad hoc.

  However, Strategy 3 also avoids the dishonesty of Strategy 2 (calling non-local relations "Humean"). By admitting that the *base* is not Humean (it contains holism) but the *account of laws* remains Humean (they are summaries, not governors), you preserve the core philosophical insight Lewis offered: that we do not need to posit modal glue to make sense of scientific practice.

  **The "Relocation" Critique:**
  Critics (like Tim Maudlin) will argue that Strategy 3 is a hollow victory. If the base contains non-separable facts, haven't you admitted "necessary connections" between distant events?
  *   *Response:* Not necessarily. You can view entanglement as a **structural fact** about the mosaic rather than a causal connection. The BSA can summarize these structural facts without imbuing them with modal force. The "necessity" is in the mathematical structure of the quantum state, not in a metaphysical binding of distinct substances.

  **Conclusion:**
  If you wish to remain faithful to Lewis's *text*, you must adopt **Wavefunction Realism (Strategy 1)**. It is the only way to keep "local qualities" and "supervenience" intact.
  However, if you wish to remain faithful to Lewis's *spirit* (empiricism, anti-modalism, parsimony) while respecting physics, you should adopt the **Modest Best System Account (Strategy 3)**.

  This amounts to accepting that **Humean Supervenience is false, but Humeanism is true.** We must abandon the thesis that the world is a mosaic of local qualities, but we can retain the thesis that laws are nothing over and above the systematic description of the world's pattern, whatever that pattern turns out to be. This preserves the deflationary virtue of Humeanism without requiring us to deny the non-local nature of quantum reality.
