answer: |-
  It is a pleasure to speak with someone who knows what a Hawk-Dove equilibrium actually looks like in the mud and blood, rather than just on a chalkboard. You have the right instinct: the difference between strict and weak dominance is fundamentally about **robustness**, and your ecological background gives you a perfect lens to see why.

  Here is the intuition without the lemmas.

  ### 1. Strict Dominance: The "Absolute Fitness" Analogy

  In your field work, imagine you have two genotypes, $A$ and $B$. You observe that $A$ has higher fitness than $B$ in *every single environment* you can possibly imagine. Wet years, dry years, high predation, low predation. $A$ is strictly fitter than $B$ everywhere.

  Now, imagine you decide to ignore a subset of those environments. Maybe you declare, "We are no longer considering 'high predation' years."

  Does $A$ still outcompete $B$? **Yes.**

  If $A$ beats $B$ in the set of *all* environments, it necessarily beats $B$ in any *subset* of those environments. The relationship is monotonic. Removing options from the opponent (the environment) cannot turn a strict loss into a win.

  In game theory terms:
  *   **Strict Dominance** means Strategy $S_1$ pays more than $S_2$ against **every** column the opponent might play.
  *   When you eliminate a dominated strategy for the opponent, you are simply removing a column from the matrix.
  *   If $S_1$ was better than $S_2$ in all columns, it is definitely better than $S_2$ in the remaining columns.

  Because the inequality is strict ($>$), there is "buffer room." You don't have to worry about the relationship flipping. Therefore, it doesn't matter which dominated strategy you remove first. If $A$ dominates $B$, and $C$ dominates $D$, removing $D$ doesn't stop $A$ from dominating $B$, and removing $B$ doesn't stop $C$ from dominating $D$. They are independent truths.

  ### 2. Weak Dominance: The "Tie-Breaker" Problem

  Now, imagine Genotype $A$ and Genotype $B$ have identical fitness in dry years, but $A$ is fitter in wet years. We say $A$ *weakly* dominates $B$. It's never worse, and sometimes better.

  Here is where the order matters.

  Suppose "Wet Years" is itself a strategy for the opponent (Nature), and it turns out "Wet Years" is dominated by some other climate pattern and gets eliminated from consideration.

  If you eliminate "Wet Years" *first*, you are left with only "Dry Years." In Dry Years, $A$ and $B$ have equal fitness. Suddenly, $A$ no longer dominates $B$. They are neutral. $B$ survives.

  However, if you eliminated $B$ *first* (because originally, looking at the full matrix, $A$ did weakly dominate it), then $B$ is gone. When you later eliminate "Wet Years," $B$ is already extinct.

  **The Intuition:** Weak dominance relies on ties. It says "$A$ is at least as good as $B$, and strictly better in *at least one* case." That "at least one case" is the fragile link. If you eliminate the specific opponent strategies that provided the advantage, the dominance relationship dissolves into equality.

  In strict dominance, the advantage is universal. In weak dominance, the advantage is contingent on the opponent having certain strategies available. Since iterated elimination changes what strategies the opponent has available, it can break the contingency.

  ### 3. Mixed Strategies and the "Convex Hull"

  You asked if this strictness is related to why we sometimes need a mixed strategy to dominate a pure one. The answer is **yes**, but via geometry rather than elimination order.

  Think of your payoff matrix as a set of environmental niches.
  *   A **Pure Strategy** is a specialist genotype. It has a specific fitness profile across niches (e.g., High, Low, Medium).
  *   A **Mixed Strategy** is a polymorphic population (or a bet-hedging individual). Its payoff is the *average* of the pure strategies it mixes.

  Imagine you have a target Pure Strategy $Z$ that you want to dominate.
  *   Pure Strategy $X$ beats $Z$ in Niche 1 but loses in Niche 2.
  *   Pure Strategy $Y$ loses to $Z$ in Niche 1 but beats $Z$ in Niche 2.

  Neither $X$ nor $Y$ *strictly* dominates $Z$ on their own. They both have a niche where they lose.

  However, if you mix $X$ and $Y$ (say, 50/50), you average their payoffs.
  *   In Niche 1: The mix gets the average of (Win + Loss).
  *   In Niche 2: The mix gets the average of (Loss + Win).

  If the wins are big enough and the losses small enough, the **average** might be higher than $Z$'s payoff in *both* niches.

  **The Connection to Strictness:**
  This works because strict inequalities allow for **interpolation**.
  If $X > Z$ and $Y < Z$, you can't dominate. But if $X \gg Z$ and $Y \approx Z$ (or vice versa), a weighted average can pull the "weak" performance up above $Z$ while keeping the "strong" performance above $Z$.

  In geometric terms (which Binmore loves):
  *   Pure strategies are the vertices of a shape.
  *   Mixed strategies fill in the interior (the convex hull).
  *   To strictly dominate $Z$, you need to find a point in your available set that is "higher" than $Z$ in every dimension.
  *   Sometimes $Z$ is not below any single vertex (pure strategy), but it *is* below the floor created by connecting the vertices (mixed strategy).

  ### Summary for your Reading Group

  1.  **Strict Dominance (Order Independent):** Like absolute fitness superiority. If you are better than me in every possible world, you are still better than me if we agree to ignore some of those worlds. The inequality is robust to the removal of data points.
  2.  **Weak Dominance (Order Dependent):** Like conditional superiority based on tie-breakers. If you are better than me only because of World X, and we decide to ignore World X, we might end up equal. Whether I survive depends on if you eliminated me before or after we ignored World X.
  3.  **Mixed Strategies:** Like polymorphism. Sometimes no single specialist genotype beats a rival in all niches, but a population polymorphism (the average) can maintain a higher minimum fitness across all niches than the rival.

  Skyrms and Binmore focus on this because in rationalist game theory (unlike EGT), we assume players *deliberate*. If the solution depends on the order in which you think about eliminating options, the "rational solution" is ambiguous. Strict dominance gives a unique prediction; weak dominance does not. That ambiguity is why they treat weak dominance with much more suspicion.

  Welcome to the philosophical side of the pond. The water is murkier, but the view of the foundations is better.
