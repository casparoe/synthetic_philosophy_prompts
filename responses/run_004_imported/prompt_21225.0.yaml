  I spent 35 years as a field ecologist, so "mixed strategy" always meant something like a population thats 70% hawk and 30% dove to me. Since retiring I've been working through some proper, non-evolutionary game theory for a philosophy reading group -- Skyrms, Binmore, that sort of thing -- and got stuck on iterated elimination of dominated strategies. Every source I've found just states, almost in passing, that the order in which you eliminate strictly dominated strategies never effects which ones survive at the end, but that this stops holding the moment you switch to weak dominance, where order can change the outcome entirely. The books either assert this outright or bury the reason in an induction proof, and honestly my patience for wading through lemmas isn't what it used to be. Could you give me the underlying intuition rather than the formal proof -- what is it about STRICT inequalities specifically that makes the elimination order irrelevant, and what exactly breaks once ties enter the picture with weak dominance? And if it's related, I'd love to know whether that same strictness is why you sometimes need a genuinely mixed strategy to dominate a pure one that no pure strategy alone can beat.
