prompt: |-
  Ok so I'm plotting a novel where the two leads are a father and son, both philosophers, who haven't spoken in years because of an academic feud that got way too personal. I'm loosely stealing the shape of it from Galen Strawson and his dad P.F. Strawson -- the son spent decades arguing that nobody's ever truly morally responsible for anything (his "Basic Argument": you act the way you do because of how you are, and you can't be responsible for how you are without having caused yourself, which is impossible), while the father's most famous essay ("Freedom and Resentment," I looked it up) basically says the whole debate is beside the point, since blame and gratitude are just baked into us as reactive creatures. Before I write the scene where this finally blows up at a family dinner, I need to know who'd actually win. Write me an essay that lays out the Basic Argument properly, seriously wrestles with whether the dad's reactive-attitudes move actually defeats it or just dodges it, and then commits to a side -- no "its complicated" ending. I need to know if the son's right that responsibility is basically an illusion, or if the father's got a real comeback.
