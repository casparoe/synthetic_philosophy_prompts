          *   Conclusion: Infinite regress. You cannot be *causa sui* (cause of yourself). Therefore, ultimate moral responsibility is impossible.
          *   *Strength:* Logically airtight within a deterministic/causal framework. It attacks the *metaphysical grounding* of responsibility.

