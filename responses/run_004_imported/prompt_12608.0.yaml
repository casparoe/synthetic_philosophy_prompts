      *   *The "Win":* In philosophy, a "win" is usually about who has the stronger truth claim. The Son has the stronger truth claim about *metaphysics*. The Father has the stronger truth claim about *anthropology*.
      *   *Okay, I will take the hard line:* The Son wins. The Basic Argument proves that *Ultimate* Responsibility is impossible. The Father's move is a pragmatic retreat, not a refutation. He concedes the metaphysical point to save the social practice. Therefore, on the question of "Is responsibility real (metaphysically)?", the Son is right.

