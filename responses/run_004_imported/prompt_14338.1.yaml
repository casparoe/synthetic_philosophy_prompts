answer: |-
  This is a strong, coherent position, but I would advise caution on one specific claim: **that this is the "settled view among ethicists."**

  Your thesis aligns closely with the **Reliance Theory** of promises (often associated with legal theorists like Fuller and Perdue, and philosophers like T.M. Scanlon, though Scanlon adds a crucial twist). It stands in contrast to the **Will Theory** (promises bind because of an exercise of autonomous will) or the **Social Practice Theory** (promises bind because of the rules of the institution of promising, à la Rawls or Searle).

  Here is the sanity check you asked for, broken down by where your argument is solid and where it might attract fire.

  ### 1. The Strong Part: The "No Spooky Duty" Claim
  You are absolutely right that contemporary moral philosophy has largely moved away from viewing promise-keeping as a mystical, sui generis duty (what you call "spooky"). Most modern naturalistic ethicists agree that the obligation must be grounded in something explainable—usually harm, autonomy, or social coordination.

  If you frame your argument as: *"Modern ethical naturalism generally rejects the idea of a freestanding metaphysical duty to keep promises,"* you are on very solid ground.

  ### 2. The Risky Part: "Settled View"
  Philosophy rarely has "settled views," and promise-keeping is a classic battleground. If you claim consensus, a knowledgeable reader could point to three significant objections that show the debate is very much alive:

  *   **The "Bare Promise" Objection:** Suppose I promise to pray for you. You know I might forget. You don't actually rely on it or change your behavior based on it. If I break the promise, have I harmed your expectations? Not really. Yet, most people feel I still owe you an apology. Reliance theory struggles to explain why a "bare promise" (one without tangible reliance) is still binding.
  *   **The "Release" Objection:** If the duty is purely about preventing harm/disappointment, why can *you* release *me* from the promise? If I promised to drive you to the airport, and you say "don't worry about it," the obligation vanishes. If the obligation were just about the objective harm of disappointment, your permission shouldn't necessarily erase the moral fact that breaking a word is bad. This suggests the duty is **relational**, not just consequential.
  *   **Scanlon's Distinction:** T.M. Scanlon (in *What We Owe to Each Other*) is the heavyweight champion of the view you're describing. However, he argues it's not just about the *harm* of disappointment. It's about the **wrong of manipulation**. He argues that invoking the practice of promising creates an assurance that it would be wrong to violate because it treats the other person as a mere means. It's a subtle difference, but it moves the goalpost from "harm" to "justifiability to the other person."

  ### 3. The Game Theory Angle
  Since you mentioned reading game theory: Evolutionary game theory (like repeated Prisoner's Dilemma or Signaling Theory) actually supports your view *functionally*, but not necessarily *normatively*.
  *   **Functionally:** Trust evolves because it maximizes payoff in iterated games.
  *   **Normatively:** That explains why we *have* the instinct, but not necessarily why we *ought* to follow it in a one-off scenario where we could get away with it.
  *   **The Trap:** Be careful not to conflate the *evolutionary origin* of the instinct (cooperation benefits the tribe) with the *moral justification* (I owe this specific person). Your argument focuses on the latter, which is good, but don't let the game theory bleed in and undermine the individual obligation.

  ### Recommendation for Your Piece
  You don't need to change your core argument; it's a compelling and defensible position. You just need to tweak the framing to make it bulletproof.

  **Instead of:**
  > "That's basically the settled view among ethicists too."

  **Try:**
  > "This is the dominant view in contemporary secular ethics."
  > *OR*
  > "Most modern ethicists argue there is no 'spooky' duty left over once you account for the harm to reliance."

  **And consider adding one sentence of nuance:**
  > "While some argue that promises create a unique kind of relational bond beyond simple expectation, the core obligation almost always traces back to the vulnerability we invite in others when we ask them to trust us."

  ### Verdict
  **Green light on the argument, yellow light on the claim of consensus.**

  Your "harm from broken expectations" thesis is robust enough for a general piece on psychology and cooperation. Just acknowledging that there is a slight philosophical debate between "harm" vs. "relational wrong" will actually make you look more authoritative, not less. It shows you know the landscape without getting bogged down in it.
