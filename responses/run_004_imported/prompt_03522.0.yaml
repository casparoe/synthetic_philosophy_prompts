answer: |-
  **Setting:** *The lounge of the Marriott Marquis, 11:30 PM. The carpet is a confusing geometric pattern. Most of the conference attendees have gone to bed, but two remain at a small high-top table near the back. Empty glasses and a half-finished bottle of Cabernet sit between them.*

  **Characters:**
  *   **ELIAS:** 50s. Wears a rumpled blazer. A proponent of the Person-Affecting View. Calm, almost unnervingly consistent.
  *   **MARA:** 40s. Sharp eyes, leaning forward. Works on normative ethics and population ethics. Frustrated by the limits of language.

  ***

  **MARA:** You actually said it. On the panel. You looked that journalist in the eye and told her that if a clinic implants an embryo they *know* will develop Huntington's, when they had a healthy one right next to it in the petri dish... nobody was wronged.

  **ELIAS:** I said no *person* was wronged, Mara. There's a distinction.

  **MARA:** It's a distinction without a difference if the result is a child with a degenerative nervous system.

  **ELIAS:** Is it? Look, run the identity check. If they implant the healthy embryo, *that* specific child—the one with Huntington's—never exists. A different zygote wins the race. So, if the clinic chooses the sick embryo, are they harming the resulting child?

  **MARA:** They are condemning them to a life of suffering.

  **ELIAS:** Compared to what? The alternative for *that child* isn't a healthy life. The alternative is non-existence. If their life is still worth living—and Huntington's patients often report lives worth living, even with the decline—then they have not been made worse off than they would otherwise have been. No harm, no foul.

  **MARA:** (Takes a sharp sip of wine) That is the "non-identity" shield. And it's cowardly. It lets agents off the hook for the quality of the lives they create simply because they also created the *creator* of the lives. It makes morality hostage to genetics.

  **ELIAS:** It makes morality consistent. You want to say the act is wrong. Fine. Who is the victim? If you can't point to a person who has a legitimate complaint, you're not doing ethics anymore. You're doing aesthetics. You're saying, "I don't like the look of a world with sick children."

  **MARA:** I'm saying there are impersonal reasons. Parfit's Theory Q. It's not about whether *X* is worse off than *X* would have been. It's about whether Outcome A is worse than Outcome B. A world where a child has Huntington's is worse than a world where a different child is healthy, all else being equal.

  **ELIAS:** Ah, the Impersonal View. Here comes the Repugnant Conclusion.

  **MARA:** Don't you dare wave the Repugnant Conclusion at me like a magic wand.

  **ELIAS:** It's not a wand; it's a reductio. If you detach morality from specific people and start maximizing "goodness of states of affairs," you have to accept that a world with ten billion people whose lives are barely worth living is better than a world with ten million people living glorious, ecstatic lives. Because the aggregate "good units" are higher in the billions.

  **MARA:** That's a problem for total utilitarianism, Elias. Not for the claim that we have a reason to avoid creating avoidable suffering. I don't need to maximize the good to know that choosing the bad is wrong.

  **ELIAS:** But where does the duty come from if not to a person? "Duty to the universe"? "Duty to the concept of health"? It's mystical. In the IVF case, the parents want a child. The clinic provides a child. The child is glad to be here. Everyone is satisfied. You're the only one unhappy, and you're not even in the room.

  **MARA:** Because I'm looking at the structure of the choice! Think about the Procreative Asymmetry. We agree, don't we, that you have no duty to create a happy child? If I walk past a couple on the street and don't stop to impregnate the woman to create a genius, I haven't done anything wrong.

  **ELIAS:** Agreed. No duty to bring happy people into existence.

  **MARA:** But we *do* agree you have a duty *not* to create a miserable child. If I know I carry a gene for a condition that makes life pure agony, I shouldn't pass it on.

  **ELIAS:** I'm listening.

  **MARA:** So, existence is neutral for the happy child—I didn't harm them by not creating them. But existence is a harm for the suffering child—I harmed them by creating them.

  **ELIAS:** And there it is. The asymmetry breaks your logic. How can non-existence be a neutral baseline for the happy child, but a *better* alternative for the suffering child? If the suffering child's life is worth living—even barely—then non-existence isn't better for them. It's just nothing. You can't say "Nothing is better than Something" in one breath, and "Something is better than Nothing" in the next, just based on the quality of the Something.

  **MARA:** Because suffering has a different moral weight than pleasure! Pain demands redress in a way that pleasure doesn't demand creation.

  **ELIAS:** That's an intuition, Mara. Not an argument. If you ground it in the person-affecting view, the asymmetry vanishes. If the life is worth living, the child benefits from existing. Therefore, creating them is a benefit. If you didn't create the happy child, you deprived them of a benefit. So you *do* have a duty to create happy children.

  **MARA:** Which is absurd. I'm not morally required to breed until I collapse.

  **ELIAS:** Exactly. So your common-sense view collapses under its own weight. You want to keep the asymmetry (no duty to create happy, duty to avoid creating suffering) *and* the non-identity intuition (choosing the sick embryo is wrong). But you can't have both without a coherent account of *who* is wronged.

  **MARA:** (Stares at the wine swirl) Maybe the wrong isn't about the child. Maybe it's about the *parents*. Or the *clinic*.

  **ELIAS:** A duty to oneself? To be a certain kind of agent?

  **MARA:** A duty of stewardship. When you take on the role of procreator, specifically via medical intervention, you enter a fiduciary relationship with the future person.

  **ELIAS:** But the future person doesn't exist yet! You can't have a fiduciary duty to a ghost.

  **MARA:** You can have a duty regarding the *conditions* of their arrival. Look, let's drop the metaphysics for a second. If a government decides to deplete all resources for the next century, knowing it will make life hard for future citizens...

  **ELIAS:** ...who wouldn't exist if they'd chosen conservation...

  **MARA:** Right. If you tell that government, "Actually, you did nothing wrong, because those future citizens are lucky to be alive," you're insane. Policy would crumble. We need to be able to say they acted wrongly.

  **ELIAS:** I agree they acted wrongly. But I disagree on *why*. I'd say they violated a duty to *existing* people who care about the future. Or they violated a rule that, if generalized, undermines the stability of society. I don't need to summon a ghost victim to condemn the policy.

  **MARA:** But in the IVF case, there are no existing people harmed. The parents are happy. The clinic gets paid.

  **ELIAS:** Then maybe nothing is wrong.

  **MARA:** (Slams her glass down, softly but firmly) I cannot accept that. If I tell you, "I'm going to take this pill that ensures my child will be blind, just because I prefer raising a blind child," and I have the option not to...

  **ELIAS:** ...and the child will still love their life...

  **MARA:** ...you would stop me. You'd call social services.

  **ELIAS:** Would I? Or would I just be acting on a biological heuristic that says "blindness is bad"? If the child grows up and says, "I'm glad my mother wanted me enough to ensure I was born blind," what do I say to them? "Your mother was immoral"? On what grounds? That you should have been someone else?

  **MARA:** On the grounds that she treated human life as a canvas for her preferences rather than a trust.

  **ELIAS:** That's poetry, Mara. It sounds nice, but it doesn't parse in moral arithmetic. If we accept your view, we open the door to eugenics of a different sort. Now we aren't just avoiding disease; we're obligated to maximize "quality." If we can choose for height, IQ, immunity... where does the duty stop? If "better" is impersonal, then a child with an IQ of 110 is a moral failure compared to a child with 140.

  **MARA:** That's the slippery slope. I'm talking about the cliff edge. Disease vs. Health. Suffering vs. Non-suffering.

  **ELIAS:** The slope is there whether you look at it or not. Once you admit that we can judge the creation of a life based on impersonal quality metrics, you've left the Person-Affecting shore. You're out in the ocean of Repugnance.

  **MARA:** (Rubbing her temples) So we're stuck. Either I accept that choosing a sick child is permissible, which violates every instinct I have as a bioethicist...

  **ELIAS:** ...or I accept that I have a duty to breed maximally happy children, which violates every instinct I have as a human being who wants to sleep in on Saturdays.

  **MARA:** There has to be a middle ground. A "Same Number Quality Claim" that doesn't demand maximization. Just a threshold.

  **ELIAS:** Who sets the threshold? You? Me? The clinic's board of directors?

  **MARA:** Society. Through regulation.

  **ELIAS:** Regulation based on what moral theory? If the theory is incoherent, the regulation is just force.

  **MARA:** (Signals the bartender for the check) You know, that journalist is going to quote you. She's going to write, "Philosopher says choosing genetic disease is not wrong."

  **ELIAS:** She'll write, "Philosopher says no victim exists." It's more accurate.

  **MARA:** The public won't hear the distinction. They'll hear that you don't care if children suffer.

  **ELIAS:** And they'll hear that you think parents are morally obligated to engineer super-babies. We're both going to look like monsters, Mara. That's the job.

  **MARA:** (Stands up, grabs her coat) It's just... I keep thinking about that kid. The one with the Huntington's. Twenty years from now. He finds out his parents chose him. He finds out there was another embryo.

  **ELIAS:** And he says?

  **MARA:** I don't know. Maybe he says, "Thanks for the life." Maybe he says, "Why did you saddle me with this?"

  **ELIAS:** If he says the second one, you can say, "Well, the alternative was you never being here."

  **MARA:** And that's supposed to comfort him? "Sorry you're in pain, but at least you *are*"?

  **ELIAS:** It's the only logical comfort available.

  **MARA:** (Pauses at the edge of the table) Logic is a tool, Elias. Not a god. If the logic tells you that causing avoidable pain is neutral, maybe the logic is the thing that's broken.

  **ELIAS:** (Picks up his glass, watches the light catch the ruby liquid) Or maybe the world is just stranger than our intuitions allow. We want morality to be about protecting people. But creation... creation isn't protection. It's a gamble.

  **MARA:** It's a gamble with someone else's chips.

  **ELIAS:** There are no other players at the table yet.

  **MARA:** (Shakes her head, a small, tired smile) Goodnight, Elias.

  **ELIAS:** Goodnight, Mara. Try to get some sleep. You have a panel on the moral status of AI at nine.

  **MARA:** Don't remind me. At least with AI, we don't have to worry about who exists.

  **ELIAS:** Give it time.

  *(Mara walks away. Elias finishes his wine, stares at the empty glass for a moment, then signals the bartender for another.)*
