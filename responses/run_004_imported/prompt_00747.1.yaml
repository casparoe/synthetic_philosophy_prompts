answer: |-
  This is an exceptionally sharp question, and your friend in the econ department is absolutely right to flag the connection. In fact, that structural isomorphism is the engine room of the moral uncertainty literature. Will MacAskill's *Normative Uncertainty* (2016) and Jacob Ross's work explicitly model the problem using social choice machinery.

  However, your intuition that there is a "principled disanalogy" is also correct, and it cuts to the heart of whether the normalization fixes (like variance voting or the MAC rule) are substantive solutions or merely pragmatic placeholders.

  Here is the breakdown of why the analogy holds formally, where it breaks metaphysically, and whether the normalization strategies are smuggling in the conclusion.

  ### 1. The Formal Isomorphism (Why your friend is right)

  Structurally, the mapping is nearly perfect:
  *   **Voters** $\leftrightarrow$ **Moral Theories** (weighted by credence).
  *   **Alternatives** $\leftrightarrow$ **Actions/Outcomes**.
  *   **Utility Functions** $\leftrightarrow$ **Choiceworthiness Functions**.
  *   **Social Welfare Function** $\leftrightarrow$ **Decision Rule under Normative Uncertainty**.

  If you treat moral theories as providing only *ordinal* rankings of actions, **Arrow's Impossibility Theorem** applies directly. If you demand Unrestricted Domain, Pareto Efficiency (if all theories prefer A to B, you should too), Independence of Irrelevant Alternatives (IIA), and Non-Dictatorship (no single theory with $<100\%$ credence dictates the outcome), you cannot generate a consistent aggregate ranking.

  MacAskill and others know this. To escape Arrow, the moral uncertainty literature generally moves to a **cardinal** framework (akin to Harsanyi's Aggregation Theorem). They assume theories don't just rank actions but assign them *degrees* of choiceworthiness. This allows for Expected Choiceworthiness Maximization (ECM), which is essentially a weighted utilitarian aggregation of the theories' value functions.

  But this just kicks the can down the road to the problem your friend identified: **Intertheoretic Comparison of Utility.** Just as we cannot compare the utility units of Person A to Person B without a common scale, we cannot compare the "choiceworthiness units" of Utilitarianism to Kantianism.

  ### 2. The Principled Disanalogies

  You hypothesized that persons might share a common currency (wellbeing) whereas theories might not. This is the right track, but the disanalogy is deeper than just measurability. It involves **ontology** and **teleology**.

  #### A. The Ontology of the Units (Welfarism vs. Structural Pluralism)
  In standard welfare economics, there is a background assumption of **welfarism**: the only thing that matters for social choice is individual welfare. Even if interpersonal comparison is hard, we assume Person A's happiness and Person B's happiness are *type-identical* states. They differ in magnitude, not kind.

  In moral uncertainty, the "voters" (theories) often disagree on the *ontology* of value.
  *   **Utilitarianism:** Value is a scalar quantity (hedons, preference satisfaction). It is unbounded and cardinal.
  *   **Kantianism/Deontology:** Value might be binary (permissible/impermissible) or lexical. A rights violation isn't "minus 50 units"; it might be a veto.
  *   **Virtue Ethics:** Choiceworthiness might be agent-relative or qualitative.

  When you apply variance normalization (scaling theories so their variance across options is equal), you are forcing the Kantian theory to pretend it is a Utilitarian theory. You are forcing a binary/lexical structure into a cardinal, continuous scale. This isn't just a measurement error; it's a category mistake. In social choice, we don't usually worry that Person A experiences "utility" in a fundamentally different ontological category than Person B. In moral uncertainty, that is the *default* position.

  #### B. Truth-Tracking vs. Preference Aggregation
  This is the most significant disanalogy.
  *   **Social Choice:** The goal is to aggregate *preferences* to make a legitimate collective decision. There is no "true" preference profile. We respect Non-Dictatorship because Person A's autonomy is as valid as Person B's.
  *   **Moral Uncertainty:** The goal is (arguably) **truth-tracking**. You are not trying to negotiate a compromise between Utilitarianism and Kantianism; you are trying to figure out which one is *true*.

  If you have 99% credence in Utilitarianism, a "dictatorship" by Utilitarianism is not a bug; it's a feature. It means you are responding correctly to the evidence. This weakens the force of Arrow-style conditions. The "Non-Dictatorship" condition in moral uncertainty is only plausible when credences are spread. If the aim is to maximize *expected objective choiceworthiness*, then if one theory is true, it *should* dictate.

  This suggests that the impossibility results are less threatening in moral uncertainty because we are allowed to violate "Neutrality" or "Anonymity" (treating all theories equally) based on our credences. We weight theories by probability, whereas in voting, we weight voters equally (one person, one vote).

  ### 3. Are Normalization Fixes "Smuggling"?

  You asked if fixes like variance normalization are doing real philosophical work or quietly smuggling in an answer. The harsh verdict is: **They are smuggling, but perhaps necessarily so.**

  **The Charge:**
  Variance normalization (and the related *My Favorite Theory* approach) assumes **Structural Parity**. It assumes that for every theory $T$, there exists a function $C_T(action)$ that maps to real numbers $\mathbb{R}$, and that the *distance* between $C_T(A)$ and $C_T(B)$ is meaningful.
  *   For a Utilitarian, this is fine.
  *   For a Threshold Deontologist, this is false. There is no fact of the matter about "how much" a constraint violation outweighs 1,000 lives saved, other than "it does."

  By applying variance normalization, you are imposing a consequentialist structure on non-consequentialist theories. You are effectively saying, "I will treat your deontological constraint *as if* it were a very large negative utility value." This solves the comparison problem by fiat, but it misrepresents the theories being compared.

  **The Defense (Pragmatism):**
  Defenders (like Greco or MacAskill in later work) might argue this is a **pragmatic necessity**. If you refuse to intertheoretically compare, you are paralyzed whenever credence is split between structurally disparate theories.
  *   If you have 50% credence in Utilitarianism and 50% in a strict Deontology that forbids lying, and you face a "lie to save a life" scenario, incommensurability leads to decision paralysis.
  *   Normalization is a heuristic to generate *action-guidance* in the face of metaphysical uncertainty. It admits that we don't know the true "exchange rate" between rights and welfare, so we assume a standard distribution to keep moving.

  However, this concedes your point: it is not solving the *metaphysical* problem of intertheoretic comparison; it is bypassing it with a decision-theoretic tool.

  ### 4. The "Common Currency" Disanalogy Revisited

  Your guess was: *Persons share a currency (wellbeing); Theories do not.*

  I would refine this: **Persons share a phenomenology; Theories share a domain.**
  *   In social choice, the "common currency" is contested but grounded in human psychology. We can imagine being in Person A's shoes.
  *   In moral uncertainty, the "common currency" is **normative reason**. Even a Kantian and a Utilitarian agree that there are *reasons for action*. They disagree on the structure of those reasons.

  The hope for moral uncertainty theorists is that "choiceworthiness" is a higher-order genus that includes both "utility maximization" and "duty fulfillment" as species. If that's true, intertheoretic comparison is possible in principle, even if hard in practice. If moral anti-realism or radical incommensurability is true, then the project fails.

  ### Summary Verdict

  1.  **Is it the same problem?** Formally, yes. Metaphysically, no. The social choice problem is about aggregating *conflicting desires*; the moral uncertainty problem is about aggregating *conflicting descriptions of the same normative reality*.
  2.  **Does Arrow worry us?** Only if you insist on ordinal rankings. If you allow cardinal choiceworthiness (which is required for expected value maximization anyway), you escape Arrow but face the **Measurement Problem** (Harsanyi's issue).
  3.  **Is normalization smuggling?** Yes. Variance normalization assumes that all theories are cardinal and unbounded. This is question-begging against deontological theories that posit lexical priorities or binary constraints.
  4.  **Is it tractable?** It is tractable *if* you accept a form of **meta-ethical realism** where all moral truths are ultimately commensurable in terms of "normative strength." If you think a rights violation is *sui generis* and not comparable to welfare loss even in principle, then no amount of voting theory will save you. You are left with *My Favorite Theory* or paralysis.

  The literature is currently stuck on exactly this: whether we can justify the cardinal assumptions required for normalization without begging the question against non-consequentialist theories. Your friend's econ analogy is the best tool you have to expose that tension. Use it.
