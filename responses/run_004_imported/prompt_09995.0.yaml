answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of serving as [Bride]'s doctoral advisor, which means I have spent the better part of a decade reading her drafts, worrying about her job prospects, and occasionally asking her to clarify her footnotes.

  Watching [Bride] grow from a graduate student into the scholar—and the person—she is today has been one of the great joys of my career. And watching her find [Groom] has been one of the great joys of my life.

  I know many of you are wondering how two people who spend their days debating the nature of existence manage to have a normal relationship. The department legend, of course, is that they met at a graduate conference, arguing opposite sides of the Humphrey objection. For the family: that is essentially a debate about whether you are the same person across different possibilities, or just similar to yourself. For the philosophers: yes, it was heated. There were whiteboards. There was shouting. And somehow, in the middle of a dispute about modal realism, they found romance.

  It is fitting, then, that their vows include a promise to love one another "in every possible world."

  It is a beautiful sentiment. But I would be remiss as an advisor if I didn't point out that, technically, this vow means something slightly different for each of them.

  For [Groom], a committed transworld identity theorist, this vow means that no matter how the circumstances change, he will love *you*—the very same individual, strictly identical across all universes.

  For [Bride], a committed counterpart theorist, strictly speaking, this vow means she promises to love a *distinct* individual in every other universe who merely resembles you closely enough to count as your counterpart.

  Now, I know what the metaphysicians in the room are thinking. But before you worry that this undermines the romance, consider the reality of marriage. Because here is the truth: After thirty or forty years of sharing a bathroom, navigating tax returns, and raising children, you *will* be loving someone who is merely a counterpart of the person you married today. You change. The world changes. The miracle of marriage isn't that you remain strictly identical; it's that you remain close enough counterparts to recognize each other, and love each other, through it all.

  So, in a way, their metaphysical disagreement is the perfect foundation for a life together. [Groom] provides the stability of identity; [Bride] provides the flexibility of resemblance. He promises she is the one. She promises she will love whoever he becomes.

  But all of this modal logic is really just their language for saying something very simple. We live in the Actual World. It is the only world we know for sure exists. It is the only world where we can hold hands, where we can build a home, and where we can choose each other, again and again.

  [Bride] and [Groom], I have read your work, and I know you understand the logic of necessity and contingency better than anyone. But today, you don't need logic. You just need each other. My hope for you is that in this world—the actual world—you find more joy than you can define, and more love than you can analyze.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your love be necessary, may your happiness be essential, and may you find each other in every world that matters.

  To the happy couple!
