prompt: |-
  So the standard headline for the Condorcet Jury Theorem is that with independent jurors who are each individually more likely than not to be right, a bigger jury is always at least as reliable as a smaller one. Give me a concrete example, with actual numbers, of a majority-rule jury where adding one more such juror -- same competence, same independence, nothing about the theorem's assumptions gets violated -- actually makes the group less likely to reach the correct verdict. Then explain why this doesnt actually break the theorem. (Hint: think hard about what a hung jury really means for whether the group "got it right.")
