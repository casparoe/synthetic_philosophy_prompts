  6.  **Finalizing the Verdict:**
      *   **Verdict:** Negative interest is *not* less unnatural. It is the *logical conclusion* of the unnatural separation of money from need. It reveals money as pure *nomos*, which Aristotle knew, but using that to manipulate wealth without production is the peak of *unnatural chrematistike*.
