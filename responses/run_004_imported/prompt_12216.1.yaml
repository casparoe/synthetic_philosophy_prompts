      *(Check on the GR connection)*: The user mentioned the 1949 paper. I should link the "idealism" of that paper (time is subjective) to the afterlife question. If time is an illusion, death is a transition, not an end. This is a crucial piece of Gödel's actual thought that bridges the physics and the theology.

