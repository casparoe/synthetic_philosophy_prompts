prompt: |-
  I'm a co-founder and CTO at a small startup, and something that happened two years ago still nags at me. Our production database was corrupted the night before a make-or-break investor demo, and a semi-retired engineer I had met exactly once offered to spend the whole night fixing it, but only on the condition that I promise to compensate him generously once we were back on stable footing. He mentioned, almost offhand, that he only makes offers like that to people he's confident will actually follow through afterward, and that he's rarely wrong about it. We survived, eventually closed the round, and he has never invoiced me or followed up in any way; there's no contract, and I will almost certainly never cross paths with him professionally again. Part of me still wants to send him a substantial payment, but my co-founder insists that doing so now can't change what already happened, so there's nothing left to gain and I should just treat it as a favor he did for free — though I can't quite articulate why, that argument feels like it's leaving something out. Is she right that there's no real reason left to pay him, or am I missing something?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **User:** Co-founder & CTO of a small startup.
      *   **Event:** 2 years ago, production DB corrupted night before a crucial investor demo.
      *   **Actor:** Semi-retired engineer (met once).
      *   **Action:** Fixed the DB overnight.
      *   **Condition:** "Promise to compensate me generously once we were back on stable footing."
      *   **Caveat:** He only makes these offers to people he trusts will follow through.
      *   **Outcome:** Startup survived, closed the round.
      *   **Current Status:** Engineer has never invoiced/followed up. No contract. Unlikely to cross paths again.
      *   **Conflict:** User wants to pay. Co-founder says "nothing to gain, treat as a favor."
      *   **User's Feeling:** The co-founder's argument feels incomplete.

  2.  **Evaluate the Co-founder's Argument ("Nothing to gain"):**
      *   *Surface Level:* Transactional. What ROI do we get *now*? None. He won't work for us again. No legal risk.
      *   *Deeper Level:* Ignores intangible assets (reputation, integrity, psychological closure, network effects).
      *   *Validity:* Technically true regarding *direct* professional gain from *him*, but false regarding *indirect* and *internal* gain.

  3.  **Evaluate the User's Instinct ("I should pay"):**
      *   *Ethical:* A promise was made. It was a condition of the help.
      *   *Reputational:* The engineer knows. He might talk. The tech community is smaller than it seems.
      *   *Psychological:* Unfinished business creates cognitive dissonance ("nags at me").
      *   *Cultural:* Sets a precedent for how the company treats people (even if he's the only one who knows).

  4.  **Identify the Core Issues:**
      *   **Integrity/Word:** A verbal contract was made. "Once stable footing" = Now (2 years later, round closed).
      *   **Trust Signal:** The engineer bet on the User's character. Paying validates that bet.
      *   **Reputation Risk:** "Rarely wrong about it." If he talks, it damages the User's brand.
