      *   **Address the Legal/Contractual Aspect:** It's a verbal contract. Enforceable? Maybe, maybe not. Irrelevant. It's a moral contract.
      *   **Actionable Steps:**
          *   Find him.
          *   Determine "Generous" (market rate + premium for urgency/risk).
          *   Send the money + a note.
