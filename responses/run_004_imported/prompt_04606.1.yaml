answer: |-
  You are not bad at writing rules. You have run headfirst into one of the most famous unsolved problems in the history of Artificial Intelligence and Philosophy of Mind.

  What you are experiencing has a name: **The Frame Problem.**

  It was famously articulated by John McCarthy and Patrick Hayes in 1969, and it describes exactly what you are facing with your smart home. Here is the breakdown of why this is happening, why your roommate is better at it than your code, and how to actually fix it (both in your apartment and in your essay).

  ### 1. The Philosophical Problem: Why Rules Fail
  The Frame Problem asks: *How does an agent decide which facts about the world are relevant to a specific action and which can be ignored?*

  When you write a rule like **"If motion is detected, turn on the lights,"** you are making a logical statement. But the real world is open-ended.
  *   **The Rule:** If Motion → Lights On.
  *   **Exception 1:** Unless it's 3 AM (sleeping).
  *   **Exception 2:** Unless I'm watching a movie (ambient light needed).
  *   **Exception 3:** Unless the sun is shining (waste of energy).
  *   **Exception 4:** Unless there is a burglar (don't light up the intruder).

  Every time you add an exception (a "frame" around the rule), you create a new boundary. But the world leaks through that boundary. To make the rule perfectly robust, you would theoretically need to list every single condition in the universe that *isn't* happening (e.g., "Unless the house is on fire," "Unless I am sleepwalking," "Unless the bulb is broken").

  This is also related to the **Qualification Problem**: To guarantee an action succeeds, you need to list infinite preconditions. Since you can't list them all, your rules will always be brittle.

  **Your roommate, however, does not use rules.** She uses a **mental model of intent.**
  When you tell her, "Keep an eye on the place," you are giving her a *goal* (security/safety), not a *script*. Her brain uses context, salience, and common sense to filter out irrelevant data automatically. She doesn't need a rule for "don't turn on the lights if there's a fire" because her understanding of "keep an eye on the place" inherently includes "don't make the situation more dangerous."

  In Philosophy of Mind terms, you are trying to use **Symbolic AI** (explicit logic representations) to solve a problem that requires **Embodied Cognition** (understanding context through experience and goals).

  ### 2. The Practical Fix: Stop Writing Rules
  Since you cannot code your way out of the Frame Problem (because it's a logical limit, not a coding error), you need to change your architecture.

  **A. Switch from "Triggers" to "States" (Modes)**
  Don't write rules based on individual events (motion, time, door open). Write rules based on the *state of the household*.
  *   Create modes: **Home, Away, Night, Movie.**
  *   When you switch to "Night Mode," *all* lights behave differently.
  *   **Why this helps:** It moves the complexity from the individual rule to the mode selection. You only have to get the *mode* right, not every individual light interaction. It mimics your roommate's understanding of context ("Oh, he's sleeping now, I should be quiet").

  **B. Use Sensors that Measure Context, Not Just Events**
  Motion sensors are binary (Something moved / Nothing moved). They have no context.
  *   **Upgrade to Presence Sensors:** These detect if a human is actually there, not just a curtain blowing.
  *   **Use Lux Sensors:** Measure ambient light.
  *   **Why this helps:** It reduces the number of exceptions you need to code. If the sensor knows it's bright out, you don't need a rule that says "Unless it is daytime."

  **C. Embrace Probabilistic Logic (Machine Learning)**
  Deterministic rules (If X then Y) always fail in open environments. Modern smart homes are moving toward ML.
  *   Instead of "Turn on at 7 PM," the system learns "The human usually turns this on between 6:30 and 7:30 when it's dark."
  *   **Why this helps:** It handles the edge cases statistically rather than logically. It's okay if it's wrong 1% of the time, whereas a rule is wrong 100% of the time when an exception isn't met.

  **D. The "Human-in-the-Loop" Fix**
  Accept that automation should handle 80% of cases, not 100%.
  *   Make it easy to override. If a rule is annoying, the friction to fix it manually must be lower than the friction to edit the code.
  *   **Philosophical takeaway:** This acknowledges that the human mind is the ultimate context engine. The machine assists; the human decides.

  ### 3. For Your Philosophy Class
  If you want to impress your professor, here is how you frame this:

  1.  **Symbol Grounding:** Your smart home symbols ("Motion," "Locked") have no meaning to the system. To your roommate, "Locked" implies safety, privacy, and "don't open." To your hub, it's just a boolean `true`. The system lacks semantics.
  2.  **Relevance Theory:** Humans automatically filter for relevance. We ignore the hum of the fridge unless it stops. Smart home sensors treat the hum of the fridge and a breaking window as equal data points until you explicitly tell them otherwise.
  3.  **Dreyfus's Critique of AI:** Hubert Dreyfus argued that human intelligence is based on bodily experience and intuition, not explicit rule-following. Your smart home struggle is empirical proof of Dreyfus's argument. You cannot compile intuition into an `If/Then` statement.

  ### Summary
  You aren't bad at coding. You are trying to force a closed logical system to operate in an open chaotic world.
  *   **The Reason:** The Frame Problem / Qualification Problem.
  *   **The Fix:** Stop writing event-based rules. Use **State/Mode-based logic**, better **context sensors**, and accept **probabilistic outcomes** rather than deterministic certainty.
  *   **The Lesson:** Your roommate wins because she understands *why* you want the lights on, not just *when*.

  If you want the system to converge, stop trying to define the world and start defining the *modes of living* within it.
