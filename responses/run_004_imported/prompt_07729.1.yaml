prompt: |-
  so I'm a phil PhD student TAing a seminar on moral responsibility this term, and next week's session is on "standing to blame" and I still dont have a crisp handle on the hypocrisy stuff beyond the vibes-level "tu quoque is a fallacy but also glass houses." could you write me a dialogue (~600-800 words) between two philosophers hashing this out? maybe frame it around a concrete trigger -- like a politician with a well-known affair publicly moralizing about a rival's affair -- but have them zoom out into the general debate pretty fast.

  Character A should hold that standing is a real, distinct normative status that hypocritical blamers can forfeit -- something like Cohen's "casting the first stone" line: the rival really did do something wrong, and A's judgment that it's wrong can even be true and sincere, but A still has no business being the one to say so given they're guilty of relevantly the same thing. the idea is that hypocritical blame involves quietly exempting yourself from a standard you're actively enforcing on someone else, which is a distinct failure on top of whatever the original wrong was.

  Character B thinks this is basically confused -- that "losing standing" just reduces to doubting the hypocrite's sincerity as a judge, or objecting to their tone, or a rhetorical deflection that shouldn't get any uptake, since none of that bears on whether the rival actually did wrong. B should also press the bootstrapping worry hard: if hypocrisy really strips standing, don't we get the perverse result that the worse and more numerous your own sins, the more people become immune to your criticism -- and since pretty much everyone's a hypocrite about something, doesn't the whole practice of moral criticism collapse?

  I want real back-and-forth, not two people talking past each other or a strawman for B -- A needs an actual answer to the bootstrapping worry, not just a restatement of the view, and B has to grapple with why hypocritical blame feels so specifically bad and not just garden-variety annoying.
