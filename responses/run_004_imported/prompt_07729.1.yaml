answer: |-
  **Alex:** Look at the prep case for next week. Senator Vance goes on CNN to condemn Miller's affair, right after Vance's own scandal broke. Intuitively, Vance can't do that. It's not just that he's annoying; he lacks the *standing*.

  **Blake:** But Miller *did* cheat. Vance's judgment is true. If standing blocks Vance from speaking, aren't we just licensing a tu quoque fallacy? You're letting the hypocrisy distract from the moral facts.

  **Alex:** It's not about the truth of the proposition. It's about the normative status of the speaker. When Vance blames, he's not just stating a fact; he's invoking a shared standard to hold Miller accountable. By violating that same standard himself, Vance implicitly exempts himself from the authority he's wielding over Miller. He's casting the first stone while hiding his own. That forfeiture of standing is distinct from the wrongness of the affair.

  **Blake:** I get the vibe, but reduce it for me. Isn't this just about sincerity? If Vance secretly thinks affairs are fine, he's lying. If he thinks they're wrong but can't help himself, he's weak. Either way, why does that strip him of the right to speak? It sounds like you're saying the worse your moral record, the less you can criticize others. That's the bootstrapping worry. If hypocrisy kills standing, then the most vicious people become immune to criticism from anyone who isn't a saint. Since we're all sinners, moral criticism collapses.

  **Alex:** That's the standard objection, but it conflates *any* sin with *relevant* hypocrisy. I don't lose standing to blame you for stealing just because I once lied. I lose it if I enforce a norm against stealing while secretly granting myself an exception to *that* norm. It's not about purity; it's about equality. The hypocrite asserts a moral superiority they haven't earned.

  **Blake:** Okay, but even then. Suppose Vance is a serial cheater but genuinely believes cheating is wrong. He's not exempting himself in his mind; he's just weak-willed. Why silence him? If he stops blaming Miller, does Miller become less blameworthy? No. So what work is "standing" doing besides making us feel self-righteous about shutting Vance down?

  **Alex:** It protects the moral community from a specific insult. When Vance blames Miller hypocritically, he treats Miller as a subordinate subject to norms Vance places himself above. That relational inequality is a second wrong, over and above the affair. Silencing Vance doesn't let Miller off the hook; it just prevents Vance from compounding the injury. Anyone else—any non-hypocrite—can still blame Miller. So immunity doesn't arise.

  **Blake:** So the wrongdoer isn't immune, only the hypocrite is silenced. I can live with that. But I'm still worried you're making standing too fragile. If I have to audit my own soul before every criticism to ensure I'm not "exempting myself," criticism becomes paralyzed.

  **Alex:** Not every failure is hypocrisy. It's about the *commitment*. If I blame you while acknowledging my own failure and regretting it, I retain standing. I'm not claiming superiority. Vance loses standing because his blame implies he's the judge, not a fellow violator. The forfeiture comes from the refusal to acknowledge the shared burden of the norm.

  **Blake:** Okay, that helps. It's not the sin itself, it's the attitude toward the norm. So the specific badness of hypocritical blame isn't that it's false, but that it's an act of domination? It denies the equality of moral agents?

  **Alex:** Exactly. It treats the target as bound by rules the blamer treats as optional for themselves. That's why it feels worse than garden-variety annoying. It's a violation of the reciprocal relationship required for accountability.

  **Blake:** Fine. I'll grant you that standing is a distinct normative status, not just a rhetorical trick. But I'm still telling the students: don't let this become a license to ignore valid criticism just because the critic has a past.

  **Alex:** Deal. As long as they understand that having standing doesn't make you right, and lacking it doesn't make you wrong. It just determines who gets to speak.

  **Blake:** Just don't let Vance near the mic.
