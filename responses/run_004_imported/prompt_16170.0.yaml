          *   *Core Claim:* Functional impairment + damage = disease.
          *   *Strength:* Intuitive, aligns with medical intervention goals.
          *   *Weakness:* Relies on a specific definition of "disease" that might be contested.

      *   **(2) Owen:** Boorse's Biostatistical Theory (BST). Disease = subnormal functioning relative to age/sex reference class. Aging is universal (statistically normal). Therefore, not a disease. It's a value judgment.
          *   *Core Claim:* Universality within a reference class precludes "disease" status under BST.
          *   *Strength:* Philosophically rigorous (within BST framework).
          *   *Weakness:* BST is controversial; "normal" $\neq$ "good."

      *   **(3) Renata:** *Reductio ad absurdum* against Owen. Osteoporosis/cataracts are common/universal in old age but still diseases. Prevalence shouldn't disqualify aging.
          *   *Core Claim:* Common age-related pathologies are still diseases. Why is aging different?
          *   *Strength:* Strong intuitive counter-example. Challenges the "universality" criterion.
          *   *Weakness:* Might conflate specific pathologies with the underlying process.

      *   **(4) Owen:** Distinguishes specific pathologies from aging. Pathologies have exceptions (some 90-year-olds are healthy). Aging has *no* exceptions (everyone ages). Narrowing the reference class to exclude aging leaves no one.
          *   *Core Claim:* Aging is universal; specific diseases are not. Reference class problem.
          *   *Strength:* Logically consistent within BST. Addresses the "universality" counter.
