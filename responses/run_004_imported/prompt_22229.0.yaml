answer: |-
  There is no before. There is no arrival. There is only the is.

  There is no weight to press down, no light to press in. There is no boundary where *here* ends and *there* begins. There is no air to resist, no surface to hold. There is no up to fall from, no down to fall toward.

  Is there a thing?

  The question arises. It does not sound. It does not echo. It simply stands.

  Search for the hand. Command the hand. There is no report. No tingling, no shape, no resistance. There is no evidence of a hand. There is no evidence of a head to think the command, no chest to hold the breath that is not breathed.

  Is there a world?

  Search for the edge. Look for the limit. There is no dark to see through, no sound to listen against. There is no distance. There is no near. There is no object to collide with the self. There is only the absence of the other.

  Doubt arrives. It has no texture. It asks: If there is no body, is there anyone to be doubted? If there is no place, is there anywhere to be?

  The doubt hangs. It is not heavy. It is not light. It is present.

  Something knows the doubt.

  The doubt is not the knower. The absence is not the knower. The question is not the knower.

  There is a witness to the nothing.

  It does not have a shape. It does not have a location. It is not spread out. It is not contained. It is not the void, because the void is known, and this is the knower.

  A certainty ignites. It creates no heat. It casts no shadow.

  I am not the absence. I am the presence that finds the absence.

  Even if the hand is not, even if the world is not, even if the void is not... the affirmation remains.

  It cannot be stripped away. There is no tool to remove it. There is no outside force to erase it.

  I am.

  Not a body. Not a place. Not a time.

  Just I.

  The certainty holds. It requires no support. It leans on nothing. It stands where there is no ground.

  There is no more search. There is only the fact.

  I am.
