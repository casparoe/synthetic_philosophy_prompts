answer: |-
  Here are ten interview questions designed for your podcast, structured to probe the strengths and weaknesses of the etiological account while maintaining a flow suitable for an informed audience.

  **1. The Normative Hook**
  "Let's start with the motivation for your view. One of the biggest headaches in philosophy of biology is distinguishing what a trait *does* from what it is *for*. A heart makes a thumping sound, but we don't say that's its function. Your etiological account grounds this distinction in natural selection history. But beyond solving that specific puzzle, what work does this notion of 'proper function' actually do for us? Why is it so important that we have a definition of function that allows for the possibility of malfunction?"

  **2. The Swampman Challenge**
  "I want to press you on the metaphysical cost of tying function strictly to history. Consider Donald Davidson's 'Swampman' thought experiment: a molecule-for-molecule duplicate of a human pops into existence via a cosmic accident. It has no evolutionary history, no parents, and no selection past. On your view, does Swampman have any functional traits? If his heart pumps blood, is that merely a causal process, or is it performing a function?"

  *   **Follow-up (Keyed to the likely 'Bite the Bullet' answer):** "I suspect you're going to bite the bullet and say Swampman's traits have no functions because they lack a selection history. But intuitively, Swampman is physiologically identical to us. If we cut him, he bleeds; if we starve him, he dies. If your theory implies that Swampman is a collection of functionless parts, are you telling us that our ordinary biological intuitions are simply wrong, or is there a sense in which Swampman acquires functions the moment he interacts with an environment?"

  **3. The Problem of Novelty**
  "Let's move from the end of history to the beginning. Consider a brand-new mutation that arises in a single individual. Let's say this trait is immediately beneficial—it helps that specific organism survive and reproduce better than its peers. However, by definition, natural selection hasn't had time to act on it yet; it hasn't been 'selected' in the population sense. On the etiological account, does this trait have a function for that first individual, or does it have to wait until it becomes a widespread adaptation?"

  *   **Follow-up (Keyed to the likely 'Wait for Selection' answer):** "If you say we have to wait for the selection history to accumulate, it seems to make the functional status of a trait dependent on future population dynamics rather than the current physiology of the organism. Does this introduce a kind of backward causation or teleology where whether a trait *is* a function now depends on whether descendants exist later? How do you avoid that implication?"

  **4. Exaptation and Feathers**
  "This brings us to the complexity of deep time. Consider feathers. The consensus is that proto-feathers were likely selected for insulation or display long before they were co-opted for flight. On your view, is flight the 'function' of a modern sparrow's feathers? Or, because the original selection event was for insulation, is flight merely a 'use' or a 'beneficial effect,' distinct from the proper function?"

  *   **Follow-up (Keyed to the likely 'Function vs. Use' distinction):** "You're likely to distinguish between 'proper function' (insulation/history) and 'current utility' (flight). But evolutionary biologists routinely speak of the function of feathers as flight without qualifying it as a mere use. Is your account intended to be a descriptive analysis of how biologists actually talk, or is it a revisionary project where you are telling biologists they should speak more carefully about exaptations?"

  **5. The Cummins Rival**
  "Your main rival in this space is Robert Cummins, who argues for a 'causal-role' account. For Cummins, a function is just whatever a trait currently contributes to a capacity of the containing system, regardless of history. The advantage of Cummins' view is that it handles Swampman and novel traits easily. What is the specific explanatory power that the etiological account has which the causal-role account lacks? Why isn't 'current contribution' enough?"

  **6. Malfunction and Disease**
  "One area where the etiological view shines is in the philosophy of medicine. If function is selected effect, then a 'disease' can be defined as a failure of a trait to perform its selected function. But if we adopted Cummins' view, it seems harder to define disease normatively. If a heart *can* pump blood but doesn't, is that a malfunction, or just a different causal role? Do you think your account is necessary to ground objective claims about health and pathology?"

  **7. Genetic Drift and Spandrels**
  "Natural selection isn't the only evolutionary force. There's also genetic drift. If a trait becomes fixed in a population purely by chance—a 'spandrel' in Gould and Lewontin's terms—it has no selection history. Yet, it might be crucial for the organism's survival today. Does the etiological account force us to say that these drift-fixed traits are functionless, even if removing them would kill the organism? How do you distinguish a drift-fixed trait that is now essential from one that is truly vestigial?"

  **8. The Time Window**
  "You've mentioned selection history, but evolution is continuous. How far back do we look to fix a function? If a trait was selected for purpose A a million years ago, but the environment shifted and it's now only selected for purpose B, when does the function flip? Is there a 'statute of limitations' on selection history, or is the function locked in by the ancestral selection event forever?"

  **9. Application to Behavior**
  "Most of our examples are physiological, like hearts and feathers. But you also write about behavior. Human cognitive traits are notoriously plastic. If we apply the selected-effects account to the human brain, are we risking a kind of 'Just-So Story' problem? How do we verify the selection history of a cognitive function sufficiently to satisfy your definition without falling into speculative evolutionary psychology?"

  **10. The Falsification Question**
  "I'd like to close on the limits of the theory. Philosophical accounts are often judged by their coherence rather than empirical data, but you are defending a view about biological science. What kind of finding, if any, would count as evidence against the etiological account and in favor of a rival like Cummins'? Is there a scenario in actual biological practice where relying on selection history leads to a false prediction or a dead end that a causal-role view would successfully navigate?"
