prompt: |-
  So my dad had a health scare a few months back and I ended up taking over the day-to-day running of our family's restaurant pretty much overnight. I'm the oldest, I'd been working there on and off for years, and everyone just kind of assumed I'd step in, so I did. Now I'm actually trying to figure out how I'm supposed to run the place, and I keep getting stuck on the same thing. My business school friends all tell me the "correct" way to think about this is like any manager would: set clear, uniform standards for every employee, apply them the same regardless of who the person is, and if my cousin (who's a server) or my aunt (who does the books) can't meet them, thats that. Anything else is just favoritism dressed up as tradition.

  But that's not really how my dad ran things, and it wasn't that he was too soft to enforce standards. He'd pick up extra shifts himself so my cousin could deal with family stuff, he ran big decisions by my aunt in a way he'd never do with some random bookkeeper, and when I asked him about it once he just said "she's not just an employee, she's your aunt," like that settled the whole question. He didn't seem confused about the difference between being fair and being family - it was more like he thought the "boss" of a family business is playing a genuinely different role than the boss of a regular business, one that comes with different obligations built in, not just the same job done with a softer heart.

  I can't decide if he was onto something real or if he just never examined his own assumptions, and my friends' "same rules for everyone" approach is actually the more defensible default that anything else needs to earn its way out of. Is there an actual case for thinking your obligations to someone can change in kind, and not just in degree, depending on your relationship or role with them - or is my dad's whole approach basically just nepotism with a better story attached to it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation and Question:**
      *   **Context:** The user took over a family restaurant after their dad's health scare. They are struggling with management philosophy.
      *   **Conflict:** Business school friends advocate for a "universalist" approach (same standards for everyone, no exceptions based on relationships). The dad used a "particularist" approach (different obligations based on family/relationship status, e.g., flexibility for the cousin, consultation with the aunt).
      *   **Core Question:** Is there a legitimate philosophical/ethical case for thinking obligations change *in kind* (not just degree) based on relationships/roles? Or is the dad's approach just nepotism with a nice story?
      *   **Underlying Tension:** Efficiency/Fairness (Business Logic) vs. Loyalty/Care (Family Logic).

  2.  **Initial Assessment & Empathy:**
      *   Acknowledge the difficulty of the transition. It's a high-stress situation (health scare + new responsibility).
      *   Validate the confusion. This is a classic "family business dilemma."
      *   Avoid taking a hard side immediately. Both perspectives have merit and pitfalls.

  3.  **Deconstruct the Two Philosophies:**
      *   **The Business School View (Universalism/Impartiality):**
          *   *Pros:* Clarity, scalability, legal safety, perceived fairness, meritocracy.
          *   *Cons:* Can feel cold, ignores social capital, might lose key family buy-in, treats humans as cogs.
          *   *Philosophical root:* Kantian ethics (duty-based, universal laws), Utilitarianism (greatest good, often measured objectively).
      *   **The Dad's View (Particularism/Relational Ethics):**
          *   *Pros:* Loyalty, flexibility, long-term commitment, holistic well-being of the "tribe."
          *   *Cons:* Resentment from non-family staff, blurred lines, potential for incompetence if family isn't held accountable, hard to scale.
          *   *Philosophical root:* Ethics of Care, Virtue Ethics, Confucian Role Ethics.

  4.  **Address the Core Philosophical Question:**
      *   *Do obligations change in kind based on relationships?*
      *   Yes, philosophically speaking. We have special obligations to family that we don't have to strangers. This is widely accepted in moral philosophy (Special Obligations).
      *   *Is it nepotism?* Not necessarily. Nepotism implies unqualified preference. Relational obligation implies a different *contract*.
      *   *Key Distinction:* Is the business a "profit-maximizing machine" or a "community livelihood provider"? The dad seemed to view it as the latter.

  5.  **Develop a Nuanced Framework for the User:**
      *   Don't just say "Dad was right" or "Friends are right."
      *   Introduce the concept of **Hybrid Governance**.
      *   Distinguish between *Operational Standards* (health, safety, customer service) and *Relational Accommodations* (scheduling, decision-making input).
      *   Highlight the risk: Non-family employees noticing the double standard.
      *   Highlight the asset: Family members often work harder/cheaper/more loyally *because* of the special treatment.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the stress. This is a profound question about the nature of business and family.
      *   *Philosophical Grounding:* Address the "obligations change in kind" question directly. Mention "Special Obligations" and "Ethics of Care." Dad wasn't just making excuses; he was operating on a different ethical framework.
      *   *The Business Case:* Why the friends' advice is standard. It protects the business from chaos and lawsuits. It ensures meritocracy.
      *   *The Family Business Reality:* Why the friends' advice might fail *here*. Family businesses aren't just businesses; they are wealth preservation and relationship vehicles for the family. If you alienate the family, you lose the business's unique advantage (trust, long-term horizon).
      *   *The Danger Zone:* Where Dad's approach fails. Resentment from non-family staff. Incompetence protection.
      *   *Actionable Advice:* How to blend them.
          *   Transparency: Acknowledge the dual system.
          *   Core vs. Perimeter: Uniform standards for core (food safety, theft), flexible for perimeter (scheduling, input).
          *   The "Dividend" of Flexibility: Family takes less pay or more risk? Then they get more say.
      *   *Conclusion:* It's not about choosing one. It's about managing the tension.

  7.  **Refining the Tone:**
      *   Needs to be respectful of the dad (he built this) but realistic about the user's position (they have to make it work now).
      *   Avoid jargon where possible, but use philosophical terms lightly to validate the intellectual weight of the question.
      *   Ensure the distinction between "nepotism" (hiring/promoting unqualified family) and "stewardship" (caring for family through the business) is clear.

  8.  **Self-Correction/Review during drafting:**
