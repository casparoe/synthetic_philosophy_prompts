      *   *Reason 2 (Uncertainty):* You aren't sure she's a robot. If you think she might help in round 10 out of kindness, you help in round 9. This is the "Gang of Four" model.
      *   *Reason 3 (Infinite Horizon shadow):* The friendship continues. The "game" is bigger than the study sessions.
      *   *Conclusion:* Cooperation *is* rational when you include all real-world variables. The classmate's model is too narrow.

