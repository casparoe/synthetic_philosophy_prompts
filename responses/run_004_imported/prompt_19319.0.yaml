answer: |-
  Thank you. To our founder, [Founder's Name], thank you for trusting me with this gavel for the past year. To the first-years, welcome to the family. And to [Successor's Name], who takes the chair tonight: I am glad it is you.

  When I started this year, I thought my job was to ensure we won. To run a tight slate. To make sure our senators voted the ticket. I thought that was what efficiency looked like. I thought that was what leadership required.

  But somewhere between the strategy sessions and the vote counts, I began to worry about the machinery we were operating.

  There is a danger inherent in any group that calls itself a "party." It is the temptation to value the group's survival above the truth it was meant to serve. When we prioritize the slate over the argument, when we pressure a member to vote against their conscience for the sake of "unity," we risk becoming a machine that manufactures loyalty rather than one that cultivates judgment.

  I stand here not to dismantle what you built, [Founder's Name], but to ask us to protect it from its own success. You built a community for political thought. But thought requires friction. It requires the quiet, private courage to say, "I see it differently." If this club becomes a place where we simply whip votes to prove we are the biggest bloc on campus, we have become exactly what we claim to study, rather than what we aspire to be.

  So, [Successor's Name], as I hand this to you, my charge is not that you grow us larger. My charge is that you keep us honest.

  Do not measure this club's success by how many seats we hold in student government. Measure it by how many difficult conversations we have in this room before we ever cast a ballot. Measure it by whether a first-year feels safe to dissent from a senior. If we must choose between winning an election and keeping our hands clean, I hope we choose our hands.

  We are not here to build a machine. We are here to sharpen each other.

  There will be times when the pressure comes to conform. When it is easier to fall in line than to stand apart. In those moments, I hope you remember the faces around this table. Not as a voting bloc, but as friends who trust you to think for yourself.

  So, if everyone could please raise a glass.

  To [Founder's Name], for the foundation.
  To the first-years, for the fresh eyes.
  And to all of us: May we have the courage to value truth over victory, and the grace to remain friends even when we vote no.

  To the club.
