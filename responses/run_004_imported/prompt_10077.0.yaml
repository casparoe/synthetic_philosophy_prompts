answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Groom]'s older brother. Usually, the Best Man's job is to distract the guests from the fact that the groom is about to lose his freedom. But looking at [Bride], I think he's the one who got the upgrade.

  Now, anyone who knows [Groom] knows he is… financially prudent. Some might say "frugal." Our parents called it "thrifty." I once saw him return a gift because the receipt was expiring. He's the kind of guy who calculates the tip down to the penny and feels physically pained when someone orders the second-most expensive wine on the menu.

  So, when he told me he was planning to propose, I asked what he had in mind. He said, "I want to do it right." I assumed that meant a nice ring and maybe dinner.

  What he actually did was vanish for three months. He didn't buy a new car. He didn't go on a boys' trip. He was quietly draining a savings account he'd been nurturing since 2015. He flew [Bride]'s parents from Sydney. He flew both her grandmothers from Dublin. He coordinated visas, hotels, and airport pickups, all in secret, all on a budget that would make a miser weep.

  When he told me this, I wasn't just surprised. I was convinced. And I want to explain why, because it touches on something I've read about as a hobby: evolutionary biology.

  There's a concept called the Handicap Principle. In nature, animals send signals to show how strong or fit they are. The classic example is the peacock. The tail is heavy, it attracts predators, and it costs energy to grow. It's a liability. But that's exactly why it works. A weak bird can't afford a tail that big. It's a honest signal because it's costly to fake.

  [Groom] flying in the family was his peacock tail.

  Now, for the laypeople in the room, the lesson is simple: He spent a lot of money, so he must love her. But for the behavioral ecologists here—I see you in the back, stop taking notes—I know it's more nuanced than that. It's not about the absolute cost. It's about the *marginal* cost.

  If a naturally lavish guy spent that money, it would be a weak signal. It costs him little to be generous. But for [Groom], whose default setting is "save every penny," the pain of that expenditure was significantly higher. The signal is credible precisely because it hurts him more than it would hurt anyone else.

  A less committed man—a "cheater" in biological terms—would look at that bank balance and feel the loss more than the potential gain of the marriage. The cost would be too high relative to his intent. But for [Groom], his commitment lowered the relative cost. He was willing to carry the handicap because the signal mattered more than the burden.

  He didn't just buy a proposal. He sacrificed something he values deeply—security, savings, comfort—to prove something he values more.

  [Bride], the fact that he opened his wallet is nice. The fact that he opened his heart is better. But the fact that he overrode his own nature to make you happy? That is the only proof you'll ever need. He is signaling, loudly and clearly, that he is all in.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your life together be full of love, laughter, and happily ever after… though [Groom], please, for the sake of the household budget, maybe no more peacock tails.

  To the happy couple!
