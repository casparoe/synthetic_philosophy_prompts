answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, **Elena** (who favors counterfactual/normative accounts of causation) and **Marcus** (who favors process/mechanistic accounts), are reviewing notes for the National Ethics Bowl.*

  **Elena:** Look, regarding the Ethics Bowl case: The friend didn't call 911. The victim died. If the friend had called, the victim would have lived. It seems perverse to say the call wasn't a cause of the survival, and therefore the silence wasn't a cause of the death.

  **Marcus:** It's not perverse, Elena, it's precise. You're conflating *moral responsibility* with *causal responsibility*. In the party case, what physically happened? Alcohol entered the victim's bloodstream. It suppressed his brain stem. He stopped breathing. That is a chain of energy transfer. That is causation. Now, what did the friend do? He stood there. He held a cup. He laughed. "Not calling" isn't an event. It's the absence of an event. Nothing cannot cause something.

  **Elena:** But that leads to absurd results. If I'm babysitting your kid and I watch them drown in a shallow pool because I'm scrolling on my phone, you're telling me my "not-saving" didn't *cause* the death? The water caused the death?

  **Marcus:** Physically? Yes. The water occluded the airway. You are morally monstrous for not intervening, but you didn't push the kid in. You didn't add energy to the system. You just… failed to subtract energy from the situation.

  **Elena:** This is exactly why the "process theory" of causation fails in human contexts. Causation isn't just physics; it's about dependency. David Lewis was right on this. If $C$ hadn't happened, $E$ wouldn't have occurred. In the party case: If the call *had* happened (the omission removed), the death *wouldn't* have occurred. The death counterfactually depends on the omission. That makes it a cause.

  **Marcus:** Counterfactual dependence is too broad. That's where the plant case kills your argument. Let's say I'm housesitting for you. You go on vacation. I don't water your fern. The fern dies. Did my not-watering cause the death?

  **Elena:** Obviously.

  **Marcus:** Okay. Now, consider a stranger in Fiji. They also did not water your fern. They also could have, hypothetically, flown here and watered it. If they *had* watered it, the fern would have lived. So, counterfactually, the fern's death depends on the stranger's not-watering just as much as it depends on yours. Both of you are necessary conditions for the death in that specific scenario. So, was the stranger in Fiji a cause of your fern's death?

  **Elena:** No. That's ridiculous.

  **Marcus:** Why? On your counterfactual account, the logic is identical. "If Stranger had watered, Fern lives." Therefore, "Stranger not-watering caused Fern death." But you reject that. Why? Because the stranger had no *duty*. They had no *expectation* to act.

  **Elena:** Precisely! And that proves my point.

  **Marcus:** Wait, that proves *my* point. It proves that when you say "omission is a cause," you aren't actually talking about causation. You're talking about *normative expectation*. You're smuggling duty into ontology. You only call it a "cause" when someone *should* have done something. That means "omission causation" isn't a feature of the world; it's a feature of our moral ledger.

  **Elena:** I disagree. I think you're assuming causation has to be this brute physical fact existing in a vacuum. But "cause" is a concept we use to explain *why* things happened. Explanations are context-sensitive. In the party case, the alcohol is a constant background condition. It's always there at a party. What changes the outcome? The friend's decision not to act. We select causes based on what is abnormal or salient.

  **Marcus:** "Salient" to whom? To a moral judge.

  **Elena:** To an explainer! Look, if a mechanic says, "The car crashed because the brakes failed," they aren't saying the brakes pushed the car. They're saying the *absence* of braking force caused the collision. We accept omissions as causes in mechanics all the time. Why is it different when a human is the mechanism?

  **Marcus:** Because the mechanic implies a design function. The brakes *ought* to work. You're relying on a norm again! But let's go back to the party. If we accept your view, that omissions are real causes, we face causal inflation. Every person at that party who didn't call 911 is now a "cause" of the death. The guy in the bathroom. The person who left early. They all didn't call. Are they all causes?

  **Elena:** No, because causation requires a specific relationship. The friend was the *designated* caregiver in that moment. He noticed. He had capacity.

  **Marcus:** There it is again! "Designated." "Capacity." You're defining causation through duty. If you admit that, you have to admit that the "cause" of the death isn't a physical fact, it's a social construct. And that's dangerous for the Ethics Bowl team.

  **Elena:** How is it dangerous?

  **Marcus:** Because if the team argues "He caused the death," and the opposing team says, "Actually, physically, he didn't, he's just blameworthy," your team looks like they don't understand the difference between physics and ethics. You need to concede: The alcohol caused the death. The friend is responsible for *allowing* the cause to run its course.

  **Elena:** But "allowing" is just a softer word for causing by omission! You're trying to protect a pure physical definition of cause that doesn't exist in law or ethics. In the law, *actus reus* can be an omission. Why? Because the law recognizes that in a social world, failing to stop a harm when you are the only lever available *is* a causal intervention.

  **Marcus:** The law conflates blame and cause for pragmatic reasons. I'm a metaphysician; I care about what's real. Here's the asymmetry again: If I push a plant off a cliff, I am the cause regardless of whether I'm the owner, a stranger, or a villain. The physics is the same. But if I *don't* water it, I'm only the cause if I'm the owner. The physics is identical in both ownership cases (the plant dries out), but the "cause" status changes based on a contract. That proves the "cause" label is doing moral work, not descriptive work.

  **Elena:** Okay, let's grant that. Let's say "omission causation" is partly normative. Does that help the Ethics Bowl team?

  **Marcus:** Yes. It clarifies the stake. The question isn't "Did he kill him?" like he stabbed him. The question is "Does his moral duty to act transform his inaction into a causal force?"

  **Elena:** Or, alternatively, the team can argue that in social contexts, agency *is* the capacity to intervene. By not intervening, he utilized his agency to maintain the status quo of the threat.

  **Marcus:** That's word salad, Elena.

  **Elena:** It's not! Think about the stranger in Fiji. They lacked the *capacity* in a real sense—distance, knowledge. The friend had knowledge and capacity. The "nothing" he did was actually a specific state of affairs: *Monitoring-and-Choosing-Not-to-Act.* That is a positive mental state, even if the physical action was null.

  **Marcus:** Now you're shifting from "omission" to "mental decision." That's a positive event! A neural firing. "I choose not to call."

  **Elena:** Exactly! So the omission isn't "nothing." It's a decision process that results in no external motion. If that decision process is the cause, then omissions *are* grounded in positive events.

  **Marcus:** *That* I can agree with. The neural decision is the cause. The "not-calling" is just the description of the outcome. But be careful. If the friend was drunk too, maybe he didn't even make a conscious decision. He just passed out next to him. Then there is no neural "choice not to call." There is just... nothing.

  **Elena:** Then he's less culpable, but the causal link remains. The absence of the call is still the pivot point.

  **Marcus:** The absence is the *reason* we blame him. Not the *mechanism* of death. Look, for the Bowl, tell your team this: Don't get trapped saying "He physically caused the death" as if he poured the alcohol. Say, "He is causally relevant because his duty made him part of the safety mechanism for the victim. By failing, he broke the mechanism."

  **Elena:** I can live with that. "Breaking a safety mechanism" is an omission that functions as a cause. It acknowledges the norm (the mechanism exists because of duty) without pretending the friend injected the poison.

  **Marcus:** Agreed. And it solves the plant asymmetry. You broke the mechanism you were hired to run. The stranger in Fiji didn't break anything because they were never part of the machine.

  **Elena:** So, causation by omission is real, but it's *system-relative*. It depends on the system of expectations the agents are operating in.

  **Marcus:** I'll allow that. As long as you admit the "system of expectations" is moral, not physical.

  **Elena:** And I'll admit that as long as you agree that in human ethics, the "moral system" is the only reality that matters.

  **Marcus:** *Sips coffee.* Touché. But tell your team to watch out for the opposing side bringing up the stranger in Fiji. If they can't answer why the stranger isn't a cause, they lose the distinction between blame and causation.

  **Elena:** They'll handle it. The stranger wasn't part of the mechanism. The friend was. The "nothing" he did broke the gears.

  **Marcus:** Fine. The gears broke. Just don't say he pushed them.

  **Elena:** Deal.
