          *   *Why Frankfurt introduced the Counterfactual Intervener:* To avoid the objection that the constraint *determines* the action.
          *   *Critique of Locke:* Some argue Locke's case is weaker because the lock is a physical barrier that exists *now*. If the man *had* chosen to leave, the lock would have physically stopped him. In Frankfurt, the intervener ensures the choice *itself* leads to the same outcome, often bypassing the agent's will in the counterfactual scenario.
