          *   *Frankfurt:* Actual sequence = Jones chooses to kill. Alternative sequence = Jones chooses not to kill -> Black intervenes -> Jones kills.
          *   *Verdict:* They are structurally very similar regarding the "actual sequence" vs. "alternative sequence" distinction. The user's worry about "never trying the door" is actually the *point* of both cases. The agent doesn't need to try to leave/resist for the lack of alternatives to be real.

