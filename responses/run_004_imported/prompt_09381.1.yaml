          *   *Analysis:* Actually, both rely on counterfactuals. In Locke's case, the lock is a *categorical* constraint (it's locked now). In Frankfurt, it's a *conditional* constraint (locked *if* you try).
          *   *Wait, is Locke's case a true Frankfurt-style case?* Strictly speaking, no. It's a "constraint" case. Frankfurt cases are designed to avoid the objection that the constraint *causes* the action. In Locke's case, the lock doesn't cause the staying, the desire does. But the lock removes the ability to leave.
          *   *The "Sourcehood" vs. "Leeway" distinction:* Locke focuses on the source of the action (volition). Frankfurt focuses on the necessity of alternatives.
          *   *The User's specific worry about "never trying the door":* In Frankfurt cases, the intervener is there to ensure the result *if* the agent wavers. In Locke's case, the door is locked *regardless*. Does this matter?
          *   *Refinement:* The key similarity is that the *actual sequence* of events is untampered with. The constraint exists in the *alternative sequence*.
