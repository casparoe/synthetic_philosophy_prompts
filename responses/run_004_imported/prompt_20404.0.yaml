prompt: |-
  I'm a backend engineer at a mid-sized startup, and something that happened during a recent code review has been nagging at me ever since. One of our most senior engineers left a fairly blunt comment on a teammate's pull request for a customer-facing feature, calling it "irresponsible" to merge code without any unit tests and "exactly the kind of shortcut that eventually causes an outage." Taken purely on its own merits, I think he's right about that. What bothers me is that a few of us who work closely with him know that he routinely pushes untested changes to the internal tooling repository he mostly maintains alone, where no one reviews his commits closely enough to ever call him on it. The teammate who received the comment has no idea any of this goes on. When I mentioned it privately to another colleague, she just shrugged and said, "He's not wrong that it's bad practice, it just feels off for him, of all people, to be the one saying so."

  That reaction has stayed with me longer than I expected. Is there a meaningful difference between whether a piece of criticism is correct and whether the particular person voicing it has any right to be the one voicing it? Does it matter that his own untested code sits in a technically lower-stakes repository, or does the same underlying principle apply either way? And if the teammate eventually learned about all this, would that give him a legitimate reason to shrug off the feedback, or would that just be a convenient way of dodging a valid point by going after the critic instead of the substance? I'd like to reason through this properly rather than settle for something like "everyone's a hypocrite sometimes," since that doesn't really capture what feels unresolved to me about the situation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Dilemma:**
      *   **Context:** Backend engineer at a mid-sized startup.
      *   **Event:** Senior engineer criticized a teammate's PR (customer-facing feature) for lacking unit tests, calling it "irresponsible" and warning of outages.
      *   **Conflict:** The senior engineer routinely pushes untested code to an internal tooling repo he owns (low visibility/review).
      *   **Observation:** The criticism is technically valid (tests are good), but the messenger is hypocritical.
      *   **Colleague's Reaction:** "He's not wrong... it just feels off."
      *   **Core Questions:**
          1.  Is there a meaningful difference between the *correctness* of criticism and the *right* of the person to voice it?
          2.  Does the context (customer-facing vs. internal tooling) matter regarding the principle?
          3.  If the teammate found out, would it be legitimate to dismiss the feedback based on the hypocrisy, or is that an ad hominem dodge?
      *   **Goal:** Reason through this properly, avoiding clichés like "everyone's a hypocrite."

  2.  **Initial Analysis & Philosophical Framing:**
      *   This is a classic *Tu Quoque* (appeal to hypocrisy) scenario.
      *   However, in engineering culture, trust and leadership carry weight beyond pure logic.
      *   The distinction between *truth value* (is the code better with tests?) and *ethical standing* (does the critic have moral authority?) is key.
      *   Context matters: Customer-facing vs. Internal tools have different risk profiles.

  3.  **Addressing Question 1: Correctness vs. Right to Voice:**
      *   *Logic:* A statement can be true regardless of who says it. (The sky is blue, even if said by a liar).
      *   *Social/Professional Dynamic:* Criticism isn't just data transfer; it's a social transaction. Trust matters.
      *   *Nuance:* The "right" to voice criticism isn't binary. It's about *credibility* and *influence*. Hypocrisy erodes credibility, even if the advice is sound.
      *   *Conclusion:* The criticism is objectively valid, but the messenger's lack of integrity weakens the *reception* and *long-term impact* of the message.

  4.  **Addressing Question 2: Context (Customer vs. Internal):**
      *   *Risk Profile:* Customer-facing = high risk (revenue, reputation). Internal = lower risk (efficiency, annoyance).
      *   *Principle:* "Test your code" is the principle. "Test code proportional to risk" is the *applied* principle.
      *   *Senior Engineer's Defense:* He might argue internal tools need speed over stability.
      *   *Counter-argument:* If he preaches "always test" but only tests high-risk, he's being inconsistent, not necessarily hypocritical *if* he clarifies the risk threshold. But he called the other code "irresponsible," implying a moral failing, not just a risk calculation.
      *   *Conclusion:* The principle applies differently based on stakes, but the *tone* ("irresponsible") suggests a universal moral judgment, which makes the hypocrisy starker.

  5.  **Addressing Question 3: Dismissing the Feedback (Ad Hominem vs. Valid Skepticism):**
      *   *Logical Fallacy:* Dismissing the *truth* because of the *source* is Tu Quoque.
      *   *Pragmatic Reality:* If the source is untrustworthy, their guidance on *culture* is suspect.
      *   *Teammate's Reaction:* If they find out, they might feel targeted or unfairly judged.
      *   *Healthy Response:* Accept the technical truth, question the cultural lesson. "The tests are needed, but I don't need to accept his shaming."
      *   *Conclusion:* It's a dodge to ignore the technical need, but it's valid to question the senior engineer's leadership and mentorship capability.

  6.  **Synthesizing the "Unresolved Feeling":**
      *   Why does this nag the user? Because it touches on *psychological safety* and *engineering culture*.
      *   It's not just about tests; it's about fairness and integrity.
      *   The senior engineer is enforcing a standard he doesn't meet, which creates a caste system (rules for thee, not for me).
      *   This damages team cohesion long-term.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the complexity. Validate that "everyone's a hypocrite" is insufficient.
      *   *Section 1: Truth vs. Authority.* Distinguish between the technical fact (tests are good) and the social contract (leadership by example). Use the concept of "Moral Authority."
      *   *Section 2: Contextual Risk.* Analyze the Customer vs. Internal distinction. Is it hypocrisy or risk management? The language used ("irresponsible") tips the scale to hypocrisy.
      *   *Section 3: The Recipient's Dilemma.* Address the Tu Quoque fallacy. How should the teammate react? Separate the signal from the noise.
      *   *Section 4: The Cultural Impact.* This is the real issue. It's about trust and psychological safety.
      *   *Actionable Advice:* What should the user do? (Subtle influence, focus on standards not people).

  8.  **Refining the Tone:**
      *   Needs to be empathetic, analytical, and professional.
      *   Avoid taking sides aggressively but validate the user's discomfort.
      *   Use engineering analogies where possible (technical debt, single point of failure).

  9.  **Self-Correction/Edge Case Check:**
      *   *Did I excuse the senior engineer?* Need to make sure I don't justify his behavior too much. The internal tool argument has merit, but the *tone* was the problem.
      *   *Did I encourage the teammate to ignore the tests?* Must emphasize that the tests are still necessary regardless of the messenger.
      *   *Is "Moral Authority" too strong?* Maybe "Professional Credibility" is better. Let's stick with "Moral Authority" in the context of culture, but clarify it.

  10. **Final Polish:** Check against the user's specific questions to ensure all are answered directly. (Yes: Correctness vs. Right, Context matters, Dismissing feedback).

  **(Self-Correction during drafting):** I need to make sure I don't just say "talk to HR." This is a nuanced cultural issue. The advice should be about how to *think* about it and perhaps how to influence the culture subtly.

  11. **Final Structure:**
      *   Validate the feeling (it's about integrity, not just logic).
      *   Dimension 1: Propositional Truth vs. Moral Authority.
      *   Dimension 2: Risk Context (The "Internal Tool" Defense).
      *   Dimension 3: The Recipient's Response (Tu Quoque vs. Pragmatism).
      *   The Core Issue: Cultural Trust.
      *   Conclusion/Path Forward.

