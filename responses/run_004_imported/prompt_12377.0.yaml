answer: |-
  This is an exceptionally sharp reading of the text. It is rare to find someone who has not only tracked down the primary source but has also noticed the specific tensions that modern summaries tend to smooth over. Your confusion is well-founded: you are spotting the places where the modern "Doctrine of Double Effect" (DDE) has been streamlined into a formula, whereas Aquinas is working within a richer, more complex system of Natural Law and jurisprudence.

  Here is an analysis of your three difficulties in order, followed by an assessment of how this passage relates to the modern "four conditions."

  ### 1. Intended vs. "Beside the Intention" (*Praeter Intentionem*)

  Your first difficulty is the classic stumbling block of DDE: *How can the death be "beside the intention" if I foresee it and my action causes it?*

  The key is that for Aquinas, "intention" does not mean "what I emotionally want" or even "what I foresee." It refers to the **object of the will**—the specific goal that structures the action.

  Aquinas distinguishes between the *end* (saving one's life) and the *means* chosen to achieve it.
  *   **In the self-defense case:** The act you choose is "repelling force." You will the stopping of the attack. The death of the aggressor is a physical consequence of that repelling, but it is not the *mechanism* by which you are saved. If the aggressor were suddenly knocked unconscious without dying, or simply fled, your goal would be fully achieved. You do not need their death to save your life; you need their *incapacitation*. Therefore, the death is *praeter intentionem* (outside the intention).
  *   **In the "pushing" trolley case (or direct killing):** The death *is* the mechanism. You push the man *because* his body will stop the train. If he survived the push, the plan would fail. Therefore, the death is intended.

  So, "beside the intention" does not mean "I didn't want it to happen" (you might be very glad the aggressor died). It means "I did not choose this effect as the means to my end." Aquinas is making a metaphysical claim about the structure of the action, not a psychological claim about your feelings.

  ### 2. Private vs. Public Authority

  You are absolutely correct that Aquinas introduces a distinction here that is often missing from modern summaries. This is not a second justification; it is a **jurisdictional limitation** on the first one.

  The first part of the passage (the DDE section) establishes that an act causing death *can* be morally structured in a way that isn't inherently murder. It clears the hurdle of the act itself. However, it does not automatically grant *you* the right to perform it.

  For Aquinas, life and death are matters of **justice**. To intend someone's death is to act as a judge executing a penalty or a soldier defending the polity.
  *   **Private Individuals:** You have authority over your own body, but you do not have authority over another person's life. Therefore, a private citizen cannot *intend* to kill, even in self-defense, because they lack the jurisdiction to make that judgment. They can only intend to *stop* the threat. If the threat stops via death, that is a side effect (as explained in point 1).
  *   **Public Authority (Soldiers/Judges):** These agents act for the "common good." They possess the delegated authority to judge that a threat must be eliminated. Therefore, a soldier *can* intend to kill an enemy combatant, because in doing so, they are not committing murder but administering justice/defense on behalf of the community.

  This explains why modern summaries often drop this clause: secular versions of DDE try to create a universal calculus for individual moral agents. Aquinas, however, is embedded in a hierarchical view where *who* is acting matters as much as *what* is done. He is saying: "The logic of double effect makes the act possible to justify, but only those with public authority can intend the death; private citizens must rely on the death being a side effect."

  ### 3. Proportionality and Intention

  Your third question asks why the *amount* of force matters if the intention is just self-preservation.

  Aquinas connects proportionality to intention in two ways:

  1.  **As Evidence of Intention:** In moral theology, internal intentions are invisible. We judge the intention by the external act. If you respond to a slap with a nuclear weapon, you cannot credibly claim your intention was merely "self-defense." The excess reveals that your true intention included revenge or malice. Proportionality is the empirical test that validates your claim that you only intended to stop the threat.
  2.  **As a Requirement of Charity:** Even if your intention is pure, Aquinas holds that you must not cause more harm than necessary. This connects to the "good effect must outweigh the bad effect" condition. If you use excessive force, the evil of the violence you inflict outweighs the good of your safety. At that point, the act becomes "out of proportion to the end," rendering it unlawful regardless of your internal state.

  So, proportionality isn't just a separate rule; it safeguards the claim that the act is truly one of defense rather than aggression.

  ### Does this support the "Four Conditions" of Double Effect?

  Modern formulations of the Doctrine of Double Effect usually list four conditions for an act to be permissible:
  1.  The act itself must be good or neutral.
  2.  The agent must intend only the good effect (the bad effect is not intended).
  3.  The good effect must not be produced *by means of* the bad effect.
  4.  There must be a proportionate reason for allowing the bad effect.

  **Aquinas's passage supports the logic of these conditions, but it is not identical to the modern formulation.**

  *   **Condition 1 & 3:** Aquinas covers these when he says the act is "self-defense" (good/neutral) and implies the death is not the means of safety ("one is the saving of one's life, the other is the slaying").
  *   **Condition 2:** This is the core of his "intended vs. beside the intention" argument.
  *   **Condition 4:** This is his "moderation/proportion" requirement.

  **However, there is a crucial divergence:**
  The modern "four conditions" are often taught as a standalone tool for individual conscience. Aquinas's argument is tighter and more restrictive because of the **Public Authority** clause.

  In modern DDE discussions (like the trolley problem), it is often assumed that if the four conditions are met, a private individual is permitted to act. Aquinas would disagree. For Aquinas, a private individual *never* meets the conditions if "intending death" is required to solve the problem. A private individual can only act if the death is truly a side effect of stopping the force. If the scenario requires intending death (like the "pushing" trolley case), Aquinas would say a private citizen cannot do it, regardless of the math, because they lack the authority to intend another's death.

  **Conclusion**
  You have correctly identified that the modern "four conditions" are a simplification of Aquinas's argument. They extract the *structural* logic of the act (intention vs. foresight) but strip away the *jurisprudential* context (private vs. public authority).

  Aquinas is not offering a loose moral calculus where "one death for five" is always permissible if you phrase your intention correctly. He is offering a strict legal-moral framework where:
  1.  You must not intend death unless you act for the common good.
  2.  If you are a private citizen, death must be a true side effect, not a means.
  3.  Your force must be proportional, or your claim of self-defense is void.

  Your friend's intuition about the trolley problem (that switching tracks feels different from pushing a man) aligns with Aquinas's distinction between *foreseeing* a death as a consequence of diverting a threat versus *intending* a death as the means of stopping a threat. But Aquinas would add a caveat your friend might not expect: even if diverting the trolley saves five, a private individual must ensure they aren't usurping an authority over life and death that belongs to the common good. The text is doing something much more specific—and in some ways more restrictive—than the modern encyclopedia summaries suggest.
