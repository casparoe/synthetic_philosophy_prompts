answer: |-
  Good evening, everyone. For those who don't know me, I've had the privilege of being Helen's collaborator and friend for nearly thirty years. We started as postdocs, nervous and brilliant, and we've ended up here, slightly less nervous but hopefully still brilliant.

  When I retired three years ago, I finally had time to read the philosophy I'd ignored during thirty-five years of grant deadlines. I became quite attached to the Marquise Émilie du Châtelet. Many of you know her as Voltaire's companion, but to Helen and me, she was a working physicist first. She ran experiments on fire, she fought the Cartesians over kinetic energy, and she produced the French translation of Newton's *Principia* that is still the standard today. For decades, Helen kept a postcard of du Châtelet's portrait taped above her desk. She told me once that in a field that could be overwhelmingly male, it was a relief to see a woman permitted to be rigorous and passionate without anyone treating those as pulling in different directions.

  So, when I was asked to speak tonight, I turned to du Châtelet's *Discourse on Happiness*. It is a clear-eyed little essay, and it offers a specific warning for people like us. She argues that the passions of youth—love, the desire for glory, the need for recognition—become harder to sustain as we age. They rely too much on the world cooperating with us. The only passion capable of replacing them, she insists, is the love of study. Its rewards come from within; it requires no one's permission. But she adds a caveat: you must cultivate this taste early. You cannot wait until retirement to learn how to love the work for its own sake.

  Helen certainly cultivated that taste. We all know her rigor. But here is the complication: on retiring, Helen is not taking up study. She is not translating Newton. She is, to her children's mild alarm, joining a weekly poker game with a seriousness normally reserved for tenure review.

  Now, du Châtelet does write about gambling. But she does not equate it with study. Study is the foundation of a happy old age; gambling is merely a defensible way to pass the time without ruin. She admits outright that gambling cannot be justified by the arithmetic of the thing. She defends it only on the grounds that it keeps boredom at bay, provided one can afford to lose and loses with grace.

  This brings me to the gap between the philosopher and my friend. Du Châtelet says you need study to be happy; Helen has chosen cards. I could try to argue that poker is a form of study, that the probability theory makes it intellectual labor. But that would be dishonest, and Helen would call me out on it.

  The truth is simpler, and I think more affectionate. Helen is not confusing the poker table for the library. She is doing something du Châtelet might have admired even more: she is applying the rigor of the physicist to the vice of the gambler.

  Émilie writes that gambling cannot be justified by the arithmetic of the thing. Helen, who has spent three decades teaching me how to calculate uncertainty, knows this better than anyone. She is not playing because the expected value is positive. She is playing because, as the Marquise would say, the cost of boredom is higher than the buy-in. She is quite literally betting against her own training, and doing so with a straight face.

  But there is the second condition: one must lose with grace. We have all seen Helen handle data that refused to cooperate, grants that went nowhere, and experiments that failed. She never raged against the universe. She accepted the result, recalibrated, and dealt the next hand. If she can bring that same grace to the poker table, then perhaps she has found a way to merge the two halves of the *Discourse*. She brings the discipline of study to the game, so she can enjoy the game without needing the glory of winning.

  Helen, du Châtelet hoped we would find a passion that requires no cooperation from the world. I suspect the cards will not cooperate either. But if anyone can find happiness in the gap between the ideal and the real, between the love of study and the love of the bluff, it is you.

  To Helen. May your losses be graceful, your boredom be nonexistent, and may you always know when to hold 'em, even when the arithmetic says otherwise. Cheers.
