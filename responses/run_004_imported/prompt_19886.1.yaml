  ### Advice for Handling Pushback

  If the student challenges the deduction in Part (c), here is the specific line of reasoning to hold firm:

  1.  **The Definition of Expectation:** Remind them that in measure-theoretic probability (the standard foundation for decision theory), the expectation $E[X]$ is defined as $\int X dP$. If $\int |X| dP = \infty$ (which is true here, as the absolute series is the harmonic series), the expectation is **undefined**.
  2.  **Silence vs. Negation:** Ask them: "If I ask you to divide 5 by 0, does math tell you the answer is 0? Or does math tell you the operation is invalid?" The Pasadena game makes the EV operation invalid. To say the value is 0 is to claim the operation yielded a result, which contradicts Part (b).
  3.  **Literature Standard:** Cite Nover & Hájek (2004) directly. Their conclusion is that the game creates a "decision-theoretic black hole" where the principle of maximizing expected value *cannot guide action*. They do not argue that rational agents must value it at zero; they argue that EV maximization is the wrong tool for the job.

  This approach keeps the grading grounded in the formal definitions used in the course rather than subjective interpretation.
