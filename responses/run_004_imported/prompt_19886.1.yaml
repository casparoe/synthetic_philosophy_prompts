      *   *Definition:* A fair coin is tossed until heads ($n$). Payoff $X_n = (-1)^{n+1} \frac{2^n}{n}$. Probability $P(n) = 2^{-n}$.
      *   *Expected Value (EV) Calculation:* $E[X] = \sum_{n=1}^{\infty} P(n) X_n = \sum_{n=1}^{\infty} 2^{-n} (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
      *   *Series:* This is the alternating harmonic series ($1 - 1/2 + 1/3 - 1/4 ...$).
      *   *Convergence:* It converges conditionally to $\ln(2)$.
      *   *The Paradox (Nover & Hájek 2004):* Because the series is *conditionally* convergent, the Riemann Rearrangement Theorem applies. The value of the sum depends on the order of summation. In decision theory, the "natural order" is usually by probability or by the index of the outcome. However, if the expectation is not *absolutely* convergent, the expectation is not well-defined in the standard measure-theoretic sense (Lebesgue integral requires absolute convergence for the integral to be uniquely defined independent of rearrangement).
