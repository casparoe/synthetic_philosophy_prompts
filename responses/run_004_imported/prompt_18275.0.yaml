          *   *Within Humanities:* Scholarship students graduate higher than Non-Scholarship.
      *   *The Conflict:*
          *   View 1 (Stratified): The scholarship *helps* everyone. It improves graduation rates within every major. We should fund it!
          *   View 2 (Pooled): The scholarship *harms* the overall mission. It shifts students into harder majors where they are more likely to drop out, dragging the overall rate down.
          *   *Who is right?* It depends on the policy goal. Is the goal "Support the individual student's success given their choice"? Or "Maximize the university's overall graduation metric"?
          *   *Causal nuance:* The Scholarship *causes* the Major selection. Stratifying by Major blocks the indirect effect (the shift to harder majors). If the shift to harder majors is considered a "negative outcome" (because it lowers graduation), the Pooled data captures the *Total Effect*. If the shift to harder majors is considered "neutral/empowering" (students choosing harder paths), the Stratified data captures the *Direct Effect*.
      *   *This fits perfectly.* It creates genuine disagreement based on values/causal definitions, not just math errors.

  4.  **Drafting the Numbers:**
      *   Need:
          *   Treatment (Scholarship) -> Lower Overall Graduation.
          *   Treatment (Scholarship) -> Higher Graduation within STEM.
