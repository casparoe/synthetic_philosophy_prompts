      *   *The Lesson:* It's about Mediators vs. Confounders. Major isn't a confounder (pre-existing); it's a mediator (caused by treatment).
      *   *Why it's better than Berkeley:* Berkeley was about confounding (gender affects department choice). This is about treatment affecting the grouping variable.

