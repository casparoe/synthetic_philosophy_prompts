answer: |-
  Here is a fresh example built for your feature, complete with the numbers, the narrative setup, and the explanation of why the "always stratify" rule breaks down here.

  ### The Example: The "STEM-Incentive" Scholarship

  **The Scenario:**
  A university wants to evaluate a new merit-based scholarship. The goal of the scholarship is twofold: to support students financially and to encourage enrollment in high-demand STEM fields. The administration needs to decide whether to renew the funding based on one key metric: **Four-Year Graduation Rate.**

  **The Data:**
  At the end of the trial, the data team pulls the numbers. They compare students who received the Scholarship (Treatment) against those who did not (Control). To be thorough, they break the data down by College Major, knowing that STEM majors generally have lower graduation rates than Humanities majors due to course difficulty.

  Here are the raw numbers:

  | Group | Major | Students | Graduated | Graduation Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Scholarship** | STEM | 100 | 60 | **60%** |
  | **No Scholarship** | STEM | 20 | 10 | **50%** |
  | | | | | |
  | **Scholarship** | Humanities | 20 | 18 | **90%** |
  | **No Scholarship** | Humanities | 100 | 80 | **80%** |
  | | | | | |
  | **TOTAL (Pooled)** | **All** | **120** | **78** | **65%** |
  | **TOTAL (Pooled)** | **All** | **120** | **90** | **75%** |

  **The Paradox:**
  Look at the subgroups. In STEM, scholarship holders graduated at a higher rate than non-holders (60% vs. 50%). In Humanities, scholarship holders also graduated at a higher rate (90% vs. 80%).

  By the standard "Stats 101" rule, the scholarship is a success. It helps students regardless of what they study. You should trust the split data because it controls for the difficulty of the major.

  But look at the pooled totals. The overall graduation rate for scholarship holders is **65%**, while the non-holders graduated at **75%**.

  If the university renews the scholarship based on the split data, their overall graduation rate—the number that goes into national rankings and funding formulas—will drop.

  ***

  ### The Explanation for Your Piece

  Here is how you can walk your readers through why this is messier than the standard textbook explanation.

  **1. The Trap of the "Innocent" Group**
  In the classic Berkeley admissions example, the variable you split by (the Department) is treated as a *confounder*. It's a pre-existing condition: an applicant chooses a department, and that choice influences their chance of acceptance. Gender doesn't *cause* the department to exist. So, we split by department to see if there's bias within the decision-making process itself.

  In this scholarship example, the variable you split by (The Major) is not innocent. It is a **mediator**. The scholarship itself *caused* the students to choose the major. Perhaps the scholarship offered a stipend bonus for STEM tracks, or perhaps the prestige of the award emboldened students to attempt harder degrees.

  **2. Two Literate People, Two Right Answers**
  This is where your data-scientist friend's note comes to life. You can have two statistically literate administrators look at this same table and argue past each other, both citing Simpson's Paradox.

  *   **Administrator A (Trusts the Split):** "Look at the causal effect on the *student*. Within every major, the scholarship improves the likelihood of graduation. It provides resources that help students survive the coursework. The fact that they chose harder majors is a testament to the scholarship's ambition. We should judge the program by how well it supports the choices it incentivizes."
  *   **Administrator B (Trusts the Pool):** "Look at the causal effect on the *institution*. The scholarship changes behavior. It shifts the population into a 'danger zone' (STEM) where attrition is naturally higher. Even if it helps slightly within that zone, the sheer weight of moving 100 students into a high-risk category drags down the overall success rate. If our KPI is overall graduation, this program fails."

  **3. Why the "Always Stratify" Rule Fails Here**
  The standard advice says: *"When you see a reversal, the subgroups tell the truth and the total is a lie."*

  That advice assumes the grouping variable is a **confounder** (something that muddies the water before the treatment happens). But when the grouping variable is a **mediator** (something the treatment actually changes), stratifying effectively "blocks" part of the treatment's effect.

  By splitting the data by Major, Administrator A is asking: *"Holding the major constant, does money help?"*
  By looking at the pooled data, Administrator B is asking: *"Including the change in major selection, does money help?"*

  Neither is mathematically wrong. But if the university renews the scholarship expecting the pooled rate (75%) and gets the stratified reality (65%), they will be blindsided.

  **The Takeaway**
  Simpson's Paradox isn't just a puzzle about where the "real" number is hiding. It's a warning that data doesn't come with a causal label attached. In the Berkeley case, splitting by department revealed discrimination. In this scholarship case, splitting by major hides a policy side-effect.

  The numbers don't tell you whether the shift to STEM is a "bug" or a "feature." That's not a statistical question; it's a philosophical one. And that's why you can't just outsource your judgment to the stratified table.
