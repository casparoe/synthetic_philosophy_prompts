      *   *Outcome:* Hired within 3 months.
      *   *Grouping Variable:* "Applied to High-Prestige Companies" vs. "Applied to Local/Small Firms."
      *   *The Twist:* The Coaching *causes* people to apply to High-Prestige companies (because it boosts confidence/resumes). But High-Prestige companies are harder to get into generally.
      *   *Why this works:* If you stratify by "Where they applied," you hide the fact that the Coaching *enabled* the applications to the hard places. The pooled data shows the total effect (including the ambition boost). The stratified data shows the direct effect *holding ambition constant*, which might penalize the coaching for sending people into harder pools.

      *Wait, let's refine.* The prompt asks for a case where it's *not obvious* which to trust.
      If the goal is "Get people hired," and Coaching makes them aim higher (harder to get hired) but also improves skills...
      Actually, a **Medical Triage/Referral** example is often sharper for this specific "mediator" issue.
      Let's try **Hospital Triage**.
      *   *Treatment:* New Triage Protocol vs. Old Triage Protocol.
      *   *Outcome:* Patient Survival.
