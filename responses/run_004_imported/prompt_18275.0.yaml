      *   *Grouping:* Trip Distance (Short vs. Long).
      *   *The Twist:* Algorithm X is designed to maximize long-distance, high-value trips. It actively *steers* drivers toward Long trips. Algorithm Y sticks to Short trips.
      *   *Why it's ambiguous:*
          *   Pooled: Algorithm X has lower completion rates.
          *   Stratified: Algorithm X has higher completion rates for *both* Short and Long trips.
          *   *Decision:* Do we want the algorithm that gets the highest completion rate per trip (Stratified)? Or do we care about the overall fleet efficiency/revenue which depends on the mix (Pooled)?
          *   *Actually, the prompt asks about the "Real Causal Story."*
          *   If the algorithm *causes* the trip length selection, stratifying by trip length blocks the mechanism of the algorithm.
          *   However, if the goal is "Safety/Reliability," maybe we want the stratified view. If the goal is "Overall Success," we want the pooled.
          *   This creates the disagreement between two literate people.

      *Let's try a Policy Example: "Police De-escalation Training".*
      *   *Treatment:* Precincts with Training vs. Precincts without.
      *   *Outcome:* Use of Force Incidents.
      *   *Grouping:* Call Severity (High Risk vs. Low Risk).
      *   *Mechanism:* Training makes officers *classify* more calls as "High Risk" because they are more aware/sensitive, OR it makes them respond to more High Risk calls because they are confident.
      *   *This is getting too muddy.*

      *Let's go with the **Medical Treatment / Hospital Ward** example but make it about **Referral Bias**.*
      *   *Treatment:* Hospital A (Specialty Center) vs. Hospital B (General Community).
      *   *Outcome:* Survival Rate.
      *   *Grouping:* Patient Condition (Severe vs. Mild).
      *   *Standard Simpson's:* Hospital A looks worse overall, better in subgroups. (Because A takes the severe cases).
      *   *The Twist:* What if Hospital A's *marketing* attracts severe cases? Or what if the "Severity" is determined *after* admission based on tests that Hospital A runs more aggressively?
      *   *Let's pivot to something cleaner:* **Software Bug Fixing.**
      *   *Treatment:* Senior Devs vs. Junior Devs.
      *   *Outcome:* Bug Reopened Rate (Lower is better).
      *   *Grouping:* Bug Complexity (High vs. Low).
      *   *Mechanism:* Seniors are *assigned* the High Complexity bugs. Juniors get the Low Complexity ones.
      *   *Standard:* Stratify by complexity. Seniors win.
      *   *The Twist:* What if "Complexity" is not pre-existing? What if "Complexity" is defined by *time spent*? No.

      *Okay, the strongest case for "Stratification is Bad" is when the grouping variable is a **Mediator** (on the causal path).*
      *   *Scenario:* **A New Admissions Scholarship.**
      *   *Treatment:* Offer Scholarship vs. No Offer.
      *   *Outcome:* Graduation Rate.
      *   *Grouping:* Major Selected (STEM vs. Humanities).
      *   *Mechanism:* The Scholarship incentivizes students to pick STEM (harder majors, lower graduation rates generally).
      *   *Data:*
