  I'm about two-thirds through a novel set in ancient Athens, and there's a dinner-party scene I keep chickening out of because I can't get the central argument right. My host character -- a comfortable, wine-loving man in his fifties -- spends the whole evening insisting that the point of getting a young guest moderately drunk under a watchful eye is to test and toughen his self-restraint, basically the same way the Spartans use fear and hardship to test courage, and that wine also does older men like him a favor by loosening them back up, the way Plato talks about it in the Laws (I've been reading books 1 and 2 for research and keep dog-earing bits). He gets cornered by a guest who spent years living among actual Spartans and thinks this whole line is self-serving nonsense -- that testing courage through pain and testing self-restraint through pleasure aren't even really analogous, that having a sober "ruler of the feast" running things doesnt fix the basic problem that you're deliberately impairing the very faculty you claim to be testing, and that a comfortable man defending wine as basically medicinal for people his age is exactly what you'd expect him to say whether or not its true.

  I don't want to just paraphrase the Athenian Stranger's monologue from the Laws and leave the objections sitting there as strawmen -- I want an actual fight, where the Spartan-sympathizing guest has real ammunition and my host actually has to work for his points instead of just repeating them louder. Could you write me that dialogue (just the bare exchange, no scene-setting or stage directions needed, maybe 500-800 words), with both of them genuinely responding to whatever the other just said, ideally landing on at least one point that neither of them can fully explain away rather than one side just winning outright?
