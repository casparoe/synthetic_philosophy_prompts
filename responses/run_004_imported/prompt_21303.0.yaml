answer: |-
  "You treat the cup as an enemy, Lysander. I treat it as a whetstone."

  "A whetstone sharpens iron, Theron. Wine dissolves it. You say you train the boy in restraint by offering him the very thing that destroys restraint. It is like testing a man's eyesight by extinguishing the lamps."

  "Not extinguishing. Dimming. The Spartans train courage through pain and fear, yes. You march them into the dark and whip them. But fear is only one teacher. What of pleasure? When a man is flushed with wine, his tongue loosens, his shame recedes. If he can hold the line then, when the blood is hot, his virtue is not just a habit of sobriety. It is tested gold."

  "Tested gold is put in the fire to see if it melts. You are putting him in the fire and blaming the ash if he burns. You say the Symposiarch watches over him? A external ruler propping up an internal collapse? In Sparta, the ruler is inside the skin. You teach a boy to obey a master while drunk, and you think he has learned self-command? He has learned only to wait for the master to look away."

  "You confuse the method with the aim. The aim is to know oneself. Sobriety is a mask we wear for the marketplace. Wine strips the mask. Would you rather a man discover he is a beast here, among friends who can restrain him, or out there, in the assembly, when the stakes are the city's life?"

  "And if the beast wakes up and bites? You say wine is medicinal for men like us. 'It softens the soul,' you say, like iron heated for the hammer. But I have lived among the Ephors. They do not soften. They do not require a drug to make them pliable to reason. They are straight without the fire."

  "Because they are young and hard! Look at me, Lysander. I am fifty. My soul is drying out, becoming peevish, rigid. I am afraid of everything—death, loss, the neighbors' opinions. Wine makes me bold again. It makes me young enough to learn. If I cannot be softened, I cannot be educated. Is it better to remain hard and unteachable, or soft enough to be shaped, even if the water is mixed with grapes?"

  "It is convenient, is it not? That the medicine for your rigidity is exactly what your appetite craves. You call it therapy because you cannot call it indulgence. You claim you test the boy, but I watch you. You watch him, yes, but you also drink with him. Who is testing whom?"

  "I drink to understand the state he is in! How can I guide him through a storm if I stay on the shore?"

  "You stay in the boat because you love the sea. Do not pretend it is navigation."

  "And do not pretend your Spartans are gods. They break. They drink in secret. They crave what they deny themselves. At least here, the craving is acknowledged. We do not pretend the desire for pleasure doesn't exist. We try to ride it."

  "You try to bridle a lion with a thread. You say wine reveals the true man. I say it creates a false one. When you are drunk, you are not yourself; you are a version of yourself without consequences. To test courage, you must feel fear. To test restraint, you must feel desire, yes, but you must also possess the full faculty to deny it. If you cloud the faculty, you are not testing restraint. You are testing intoxication. And when the boy wakes tomorrow, he will not remember the victory. He will remember only the haze."

  "Then what is your answer? To never touch the cup? To let old men grow brittle until they snap?"

  "My answer is that you cannot build virtue on a foundation of impairment. You say it is unresolved whether the test works. I say it is resolved. You are teaching him that virtue requires a watcher. I say virtue is what remains when the watcher sleeps."

  "And if nothing remains?"

  "Then he was never virtuous. And your wine did not test him. It merely revealed that you were both wasting the evening."
