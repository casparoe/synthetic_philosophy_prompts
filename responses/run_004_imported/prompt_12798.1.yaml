answer: |-
  The fluorescent lights hummed, a low B-flat that had drilled itself into the base of my skull over the last decade. On the table between us sat a mound of Roma tomatoes, freshly picked, still smelling of vine and dirt. They looked identical. To me, to the camera, to the spectrometer sitting dark in the corner, they were a uniform spectrum of ripe red.

  Fred picked one up. He didn't hesitate. He placed it in the left bin. He picked up another, turned it slowly in his long fingers, and placed it in the right bin.

  "Same batch," I said. It wasn't a question. I'd logged the soil composition, the water pH, the exact hours of sunlight. I knew the wavelength reflection of every fruit on that table.

  "Same batch," Fred agreed. He didn't look up. "But this one is shouting, and that one is humming."

  "Metaphor," I said, tapping my pen against my clipboard. "You're using metaphor to describe a discrimination task. Your cones are sensitive to a narrow variance in reflectance. That's all. It's a skill, Fred. Like perfect pitch."

  Fred finally looked at me. His eyes were tired, matching the bruise-colored shadows under mine. We had danced this waltz for twelve years. He was the anomaly, the glitch in the standard model of human vision. He saw two colors where I saw one. He called them Red1 and Red2. I called them A and B.

  "If I play you a chord," Fred said, setting a tomato down gently, "and you tell me it's major, are you just guessing based on vibration frequency? Or do you hear the mood?"

  "I hear the mood because I know the frequency," I countered. "If I had the data, I could predict the mood without hearing the note. I can predict your sorting without watching your hands. I have the physics of the light. I have the chemistry of the skin. What is left? What are you holding that I'm not?"

  "That's just it," he said, leaning back. The chair creaked. "You think if you map the territory perfectly enough, you'll be standing on the ground. But you're just drawing better maps."

  "A map gets you where you're going."

  "Does it tell you what the wind feels like?"

  I sighed, rubbing my temples. This was the wall we always hit. I believed that if we knew every neuron firing, every photon bouncing, there would be no mystery left to solve. The universe was machinery. Fred believed there was a ghost in the gearwork, something that existed only when the machine was running.

  "Describe it," I said. It was my usual gambit. "Tell me what Red2 is."

  Fred smiled, a sad, thin expression. "I can't. It's like asking you to describe red to someone who's never seen it. You'd talk about stop signs, about blood, about heat. But you wouldn't be talking about the seeing."

  "I'm talking about the mechanism. You have a fourth cone type. We've scanned you. It's physical."

  "The eye is physical," Fred said. "The seeing isn't a thing you can put on a slide. When I look at this," he pointed to the left bin, "it feels like... coolness. Like putting your hand on a stone in the shade. The other one," he pointed to the right, "is like holding a cup of tea. Warm. You know the temperature of both stones. You know the specific heat capacity of the tea. But you don't know the *feel*."

  "I know what heat feels like," I said sharply. "I'm not numb."

  "But you don't know *this* heat. You're missing a whole dimension of the world, and you keep trying to convince me it's not there because you can measure the shadow it casts."

  I looked at the tomatoes. They sat there, stubbornly identical. I felt a sudden, sharp pang of envy. It was unprofessional, unscientific. I wanted to know what he knew. I wanted to verify the data point that lived only in his head. But if I couldn't measure it, if I couldn't transmit it, did it exist? Or was it just a private trick his brain played, a user-interface skin over the same code we all ran?

  "Sort the rest," I said softly.

  Fred went back to work. His hands moved with a rhythm I couldn't hear. Left. Right. Left. Left. Right.

  When he was done, the two piles sat side by side. Two mountains of red.

  "Pick one," Fred said. "From the right pile. Hold it."

  I reached out and took a tomato. It was cool, firm, heavy. It smelled like earth. It looked red.

  "Now," Fred said. "Tell me what you know about it."

  "I know it's ripe. I know it weighs approximately eighty grams. I know it reflects light at six hundred and fifty nanometers."

  Fred nodded. He reached into the left pile and picked up a tomato for himself. He held it up to the light, squinting. "I know all that too. But I also know it's the quiet one."

  He tossed the tomato to me. I caught it instinctively. It landed next to the first one. They touched, skin against skin. To me, they were twins. To him, they were strangers.

  "We're going to publish the paper next month," I said. "We have to finalize the conclusion."

  Fred wiped his hands on his jeans. He looked at the tomatoes, then at me, and for a moment, the weariness dropped away, replaced by a strange clarity.

  "Write what you see," he said. "I'll write what I see. Maybe the truth is in the space between us."

  "And if the space is empty?"

  Fred picked up his coat. He paused at the door, hand on the frame. "Then why does it feel so crowded in here?"

  He left the room. The hum of the lights grew louder in the silence. I looked down at the two tomatoes on the table. I focused on them, hard, willing my eyes to split the difference, to find the seam in the color. Nothing changed. They remained stubbornly, beautifully red.

  I picked one up. It felt warm. Or maybe that was just my hand. I couldn't tell. I set it down again, leaving them side by side, and turned off the lights. In the dark, the difference didn't matter. But I left them there, just in case.
