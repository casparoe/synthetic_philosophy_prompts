      *   **Characters:** A scientist (POV) and Fred (the subject).
      *   **Plot:** They are circling an unresolved argument about knowledge/perception vs. physical facts.
      *   **Constraint 1:** Avoid the famous "Mary's Room" (black-and-white room). Use Fred specifically.
      *   **Constraint 2:** Word count: 800-1200 words.
      *   **Constraint 3:** Hold both positions in tension (Fred has extra knowledge vs. Fred just has a skill/no extra fact).
      *   **Constraint 4:** No jargon like "qualia," "physicalism," "reductionism," etc. Show, don't tell the philosophy.
      *   **Constraint 5:** Ambiguous ending (don't resolve which side is right).
      *   **Tone:** Intellectual, intimate, slightly weary, observational.

  2.  **Deconstruct the Thought Experiment (Fred):**
      *   Fred has a unique visual system. He sees Red1 and Red2. We see only Red.
      *   He can sort tomatoes based on this.
      *   *The Philosophical Conflict:*
          *   View A (Jackson/Qualia): Fred knows something we don't. There is a fact of the matter about what Red2 looks like that physical descriptions of wavelengths don't capture. We are missing out.
          *   View B (Physicalism/Ability): Fred just has better discrimination. It's like having perfect pitch. There's no "extra fact," just a different processing capability. Knowing what it's like is just knowing how to discriminate.

  3.  **Drafting - Scene Setting:**
      *   Setting: A lab, late night. Tomatoes? Or colored chips? Tomatoes are more visceral, closer to the original thought experiment. Let's use colored tiles or chips for precision, maybe tomatoes for the organic messiness. Let's go with tiles for the clinical feel, but maybe a single tomato as a prop. Actually, the prompt mentions sorting ripe tomatoes. Let's stick to the tomatoes for the sensory detail.
      *   Characters: The Narrator (Scientist) and Fred.
      *   Dynamic: Long-standing relationship. Tired but engaged.

  4.  **Drafting - The Argument (Show, Don't Tell):**
      *   Instead of saying "You have qualia," Fred should say "You're describing the map, I'm holding the territory."
      *   Instead of saying "It's just physicalism," the Scientist should say "I can measure the wavelength, I can map your neuron fire. What is left?"
      *   The tension needs to be about *missing out* vs. *functionality*.

  5.  **Drafting - The Narrative Arc:**
      *   Start in the middle of the routine. Sorting tomatoes.
      *   The Scientist challenges Fred: "Tell me what it is."
      *   Fred tries to explain the impossibility of translation.
      *   The Scientist offers the physical explanation (wavelengths, cones).
      *   Fred counters with the experience of the difference.
      *   Ending: A moment of shared uncertainty. A gesture or an object that embodies the gap.

  6.  **Writing - Section by Section:**

      *   *Opening:* The lab, the tomatoes, the routine. Establish the fatigue.
      *   *The Task:* Fred sorting. The narrator watching.
      *   *The Dialogue:* The core philosophical debate disguised as conversation.
          *   Narrator: "It's just variance."
          *   Fred: "It's like blue and green to you."
          *   Narrator: "But I can measure the difference."
          *   Fred: "Measurement isn't seeing."
      *   *The Climax:* A specific moment where the gap feels widest. Maybe Fred hands her a tomato.
      *   *The Ending:* Ambiguous. Does she see it? Does she accept she can't? Or does she accept it doesn't matter?

  7.  **Refining and Polishing (Checking Constraints):**
      *   *Word Count:* Keep an eye on this. Need enough depth to reach 800 but not ramble past 1200.
      *   *Jargon Check:* Ensure no "qualia," "physicalism," "ontology," "epistemology."
      *   *Tension:* Make sure the Scientist's argument is compelling too. It shouldn't just be "Fred is magic." The Scientist represents the rigorous view that everything is measurable.
      *   *POV:* First person (Scientist).

  8.  **Drafting - Mental Walkthrough:**
      *   *Start:* Fluorescent hum. Pile of tomatoes. Fred's hands moving.
      *   *Middle:* I ask him to describe Red2. He says it's like asking a blind man to describe light. I say I have the spectrometer data. He says the data doesn't taste like the fruit.
      *   *End:* He hands me a "Red2" tomato. I look at it. It's just red. But is it?

  9.  **Writing Phase (incorporating into final output):**
      *   *Self-Correction during drafting:* Make sure Fred doesn't sound mystical. He's just a guy with different eyes. Make sure the Scientist doesn't sound cold, just committed to the measurable.
      *   *Focus on the sensory:* The smell of the vines, the hum of the lights, the specific shade.

  10. **Final Review:** Check word count. Check forbidden words. Check ending ambiguity.

  *(Self-Correction on Word Count)*: I need to ensure I expand enough on the internal monologue of the scientist to hit the 800 minimum without fluff. The tension needs to breathe.

  *(Self-Correction on Jargon)*: Double-check for "qualia." It's the biggest trap. Use "the feeling," "the thing itself," "the gap."

  *(Self-Correction on Ending)*: Don't let her suddenly see Red2. Don't let her dismiss him completely. Leave her holding the tomato, unsure.

