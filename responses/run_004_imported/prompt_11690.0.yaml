prompt: |-
  Funny timing: I'm teaching a graduate seminar on the philosophy of promising this term, and now I've actually got a live case in my own department instead of just thought experiments. Short version: our hiring committee had a candidate everyone loved, and back in Febuary our chair told her, over email, something like "the offer is basically finalized at this point, HR just needs to process it, so please don't accept anything else." Nothing was ever signed. She took it at her word anyway, turned down a competing tenure-track offer at another school, and told her current chair she was resigning effective this summer. Two weeks ago the dean's office froze the line because of a sudden budget shortfall, so there is no position to actually give her, and I think our chairs quietly hoping the whole situation just goes away on its own.

  I've been put on a small ad hoc committee that has to bring the dean a recommendation on what, if anything, the department owes this candidate, given that nothing was ever a legally binding contract. I don't want to show up with "well, it feels bad, so we should do something" -- I want to circulate an actual memo beforehand that recommends a concrete course of action (money, a standing offer for next cycle, whatever you think is defensible) with a rough timeframe attached, but that grounds the recommendation in a real answer to why an unwritten assurance like that generates any obligation in the first place. Is the source of the obligation the reliance we invited her to place on our word, some kind of convention about how hiring committees are understood to talk, something closer to Scanlon's assurance-based story, or does it actually matter that it was an institution and not a single person doing the "promising"? And please don't hand me the version that flatters us -- two people on this committee are going to argue, seriously, that a sincere apology is the entire extent of what we owe her, and the memo needs to engage that position honestly rather than wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a philosophy professor teaching a seminar on the philosophy of promising. They have a real-life ethical dilemma in their department.
      *   **Situation:** A job candidate was verbally/email assured by the Chair that an offer was "basically finalized" and told not to accept other offers. No contract was signed. The candidate relied on this (turned down another TT offer, resigned from current job). The Dean froze the line due to budget issues. The Department is now deciding what they owe her.
      *   **Task:** The user needs a memo to circulate to an ad hoc committee (and eventually the Dean) recommending a concrete course of action.
      *   **Requirements:**
          *   Must ground the recommendation in philosophical theory (not just "it feels bad").
          *   Must address the source of the obligation (reliance, convention, assurance, institutional vs. individual).
          *   Must engage honestly with the "sincere apology is enough" position (held by two committee members).
          *   Must recommend a concrete action (money, future offer, etc.) with a timeframe.
          *   Tone: Professional, academic, persuasive, ethically rigorous.

  2.  **Identify the Core Philosophical Issues:**
      *   **Promise vs. Assurance:** Was it a promise? Scanlon's Principle of Fidelity (Principle F) is relevant here. Did the Chair invoke a convention that creates an expectation of performance?
      *   **Reliance:** The candidate suffered detrimental reliance (turned down other jobs, resigned). This leans towards a tort-like claim (promissory estoppel) but ethically it's about harm caused by induced reliance.
      *   **Institutional Agency:** Does the institution bear responsibility for the Chair's words? Yes, the Chair acts as an agent.
      *   **The "Apology Only" Counter-argument:** Why is this insufficient? Because apology repairs moral standing but doesn't repair material harm. It addresses the *wrong* but not the *damage*.
      *   **Scanlonian Contractualism:** What principles could no one reasonably reject? A principle allowing institutions to induce costly reliance without compensation would likely be rejectable.

  3.  **Determine the Recommendation:**
      *   *Option A: Nothing.* (Unethical, damages reputation).
      *   *Option B: Apology only.* (Addresses the breach, ignores the harm).
      *   *Option C: Monetary compensation + Priority.* (Best balance).
      *   *Specifics:* A "bridge" stipend for the gap year + guaranteed interview/offer if the line opens next year.
      *   *Why:* This addresses the detrimental reliance (financial loss/risk) and the broken assurance (priority).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** Briefly state the problem and the recommendation.
      *   **The Ethical Framework (The "Why"):** This is the meat for the philosophy professor.
          *   Distinguish between *contractual* obligation (legal) and *moral* obligation (philosophical).
          *   Use Scanlon's Principle F (Assurance). The Chair invoked a convention of hiring.
          *   Focus on *Detrimental Reliance*. The candidate changed her position based on our assurance.
          *   Address Institutional Agency. The Chair speaks for the Dept/University.
      *   **Engaging the "Apology Only" Position:**
          *   Acknowledge its merit (restoring moral standing).
          *   Refute its sufficiency (doesn't mitigate material loss).
          *   Analogy: If I break your vase, saying "sorry" doesn't fix the vase.
      *   **The Recommendation:**
          *   Stipend (to cover the gap/unemployment).
          *   Priority status (if line reopens).
          *   Support letters (help her find other work).
      *   **Timeline:** Immediate action needed.

  5.  **Refining the Philosophical Arguments (Self-Correction/Nuance):**
      *   *Critique:* Is Scanlon too individualistic?
      *   *Fix:* Bring in the institutional aspect. The Chair has *authority*. This makes the assurance stronger than a casual promise between friends. It's an exercise of institutional power.
      *   *Critique:* Is "promissory estoppel" too legalistic?
      *   *Fix:* Frame it ethically. The moral force of estoppel is about fairness in reliance, not just legal doctrine.
      *   *Tone Check:* Ensure it doesn't sound *too* much like a lecture (since colleagues will read it), but rigorous enough for the user (a philosopher). It needs to bridge the gap between "philosophy seminar" and "HR committee."

  6.  **Developing the Counter-Argument (The "Apology" Crowd):**
      *   Need to be charitable. An apology acknowledges the moral breach.
      *   But, the harm is *consequential*. The candidate is now unemployed (presumably) or in a precarious spot.
      *   The obligation is bifurcated: 1. Acknowledge the wrong (Apology). 2. Mitigate the harm (Compensation).
      *   If we only apologize, we treat the candidate's career costs as externalities we don't own.

  7.  **Final Polish:**
      *   Make sure the recommendation is concrete (e.g., 50% salary for one year).
      *   Ensure the timeline is clear.
      *   Check that the voice sounds like a colleague proposing a solution, not a judge issuing a verdict.

  8.  *(Self-Correction during drafting)*: I need to make sure I don't give *legal* advice. The prompt asks for a philosophical/ethical grounding for a recommendation. I must emphasize that this is about *moral obligation*, distinct from legal liability.

  9.  **Final Review against constraints:**
      *   Grounded in theory? Yes (Scanlon, Reliance, Institutional Agency).
      *   Engages "Apology Only"? Yes.
      *   Concrete recommendation? Yes (Stipend + Priority).
      *   Timeframe? Yes.
      *   Tone? Professional/Academic.

  **(Proceed to generate output based on these thoughts.)**
answer: |-
  **MEMORANDUM**

  **TO:** Ad Hoc Committee on Hiring Contingency
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Obligations Regarding Candidate [Name] and Frozen Line

  ### Executive Summary

  The Department faces a situation where a candidate, acting on explicit assurance from the Chair that an offer was "basically finalized," incurred significant professional and financial detriment when the line was subsequently frozen by the Dean's office. While no legally binding contract exists, the Department retains a robust *moral* obligation to mitigate the harm caused by this reliance.

  This memo recommends that the Department authorize a one-year bridge stipend (at 50% of the proposed assistant professor salary) and guarantee [Candidate Name] the first right of refusal should the line reopen in the next two hiring cycles. A sincere apology is necessary but insufficient; it addresses the breach of relationship but fails to address the material harm induced by our institutional assurance.

  ### I. The Source of the Obligation

  We must distinguish between *legal* enforceability and *moral* obligatoriness. The argument that "nothing was signed" settles the matter legally but begs the ethical question. Our obligation arises from three converging philosophical grounds:

  **1. Induced Reliance and Fairness**
  The core of the issue is not merely that we broke a promise, but that we *invited reliance*. In February, the Chair's communication ("HR just needs to process it... please don't accept anything else") was not a prediction; it was an instruction intended to govern the candidate's conduct.
  By advising her to reject a competing tenure-track offer, the Department actively altered her position. To leave her bearing the full cost of that alteration is to treat her career stability as an externality of our administrative budgeting. Ethically, if Agent A induces Agent B to incur a cost based on A's representation, A incurs a duty to mitigate that cost when the representation fails, regardless of intent.

  **2. Scanlonian Assurance and Institutional Agency**
  Some may argue that a Chair cannot "promise" what they do not personally control (i.e., budgetary approval). However, following T.M. Scanlon's principle of fidelity (Principle F), an obligation is generated when one intentionally invokes a convention of assurance to induce reliance.
  The Chair does not speak as a private individual but as an institutional agent. The convention of academic hiring relies on the understanding that a Chair's assurance carries institutional weight. If we allow the "I didn't have final signatory authority" defense to nullify moral obligation, we undermine the very convention that allows the academic labor market to function. We cannot selectively invoke institutional authority when it suits us (to recruit her) and disavow it when it costs us (to pay her).

  **3. The Rejection of "Moral Luck"**
  The budget shortfall is unfortunate, but it is a form of moral luck. The candidate is suffering for a contingency she could not control and was told not to worry about. If we walk away because the budget freeze was "unforeseeable," we are arguing that our obligations vanish when fulfilling them becomes inconvenient. A robust ethical framework requires us to absorb some of the risk we invited her to take.

  ### II. Engaging the "Apology Only" Position

  I anticipate the argument that a formal, public apology and strong letters of recommendation constitute the full extent of our duty. I want to engage this view charitably but firmly.

  **The Merit of the Apology View:**
  A sincere apology is *necessary*. It acknowledges the moral breach and restores the candidate's standing as a person worthy of respect, rather than a means to an end. It admits that the Department failed in its duty of care.

  **Why It Is Insufficient:**
  An apology repairs *moral standing*, but it does not repair *material harm*.
  *   **The Analogy:** If I borrow your car based on my assurance I will return it by 5 PM, and I crash it through no fault of your own, saying "I am so sorry" acknowledges I wronged you. But it does not fix the car. The obligation to compensate arises from the *damage*, not just the *intent*.
  *   **The Consequence:** [Candidate Name] has resigned from her current post and turned down a tenure-track offer elsewhere. She is now effectively unemployed or precariously employed for the coming academic year. An apology does not pay rent. To offer only words is to assert that the Department's budgetary integrity is more valuable than the candidate's livelihood, despite the fact that the Department jeopardized that livelihood.

  If we adopt the "Apology Only" stance, we are effectively claiming that the Department has the right to induce costly reliance without liability for the costs. This sets a precedent that damages the Department's reputation and integrity long-term.

  ### III. Recommendation

  To satisfy the obligation of reliance mitigation and institutional integrity, I recommend the following package:

  1.  **Bridge Stipend:** The Department should allocate funds to provide [Candidate Name] with a one-year stipend equivalent to 50% of the original assistant professor salary.
      *   *Rationale:* This acknowledges that while we cannot employ her as planned, we share responsibility for her unemployment gap. It is not a "buyout" but harm mitigation.
  2.  **Right of First Refusal:** Should the line be unfrozen in the next two hiring cycles (2024-25 or 2025-26), the offer shall be extended to her immediately without a new search.
      *   *Rationale:* This honors the original assurance that she was the chosen candidate.
  3.  **Active Placement Support:** The Chair and Senior Faculty will commit to writing letters and making phone calls for her applications to other institutions this cycle.
      *   *Rationale:* This utilizes our social capital to repair the damage to her career trajectory.

  ### IV. Timeline

  *   **Immediate (Within 1 week):** The Chair must communicate the decision to the Dean, framing the stipend as a moral necessity to avoid reputational damage and potential legal ambiguity regarding promissory estoppel.
  *   **Short-term (Within 2 weeks):** Formal letter of offer for the bridge stipend sent to [Candidate Name], accompanied by a personal call from the Chair apologizing for the situation.
  *   **Long-term:** Status of the line to be reviewed by December 1st; if unfrozen, the full offer is reinstated.

  ### Conclusion

  We are teaching the philosophy of promising, but we are also practicing it. If we conclude that our word generates no obligation once the budget changes, we validate a cynicism that undermines our profession. We owe her more than regret; we owe her restitution for the reliance we invited.

  I move that we adopt this recommendation and present it to the Dean as a unified committee.
