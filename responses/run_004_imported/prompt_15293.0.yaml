prompt: |-
  I'm a philosophy PhD student -- my dissertation's on the ethics of aggregating harms, if that's relevant -- who somehow ended up representing my block on the city's airport noise advisory committee, which sends the FAA our recommendation on flight path changes. We're choosing between two redesigns for departures off the east runway. Option A keeps departures on the current corridor, so ~600 households get nighttime noise loud enough to reliably wreck their sleep most nights (theres good evidence this is a real health harm, not just annoyance). Option B fans departures over a much wider area so no single household gets hit that hard, but ~90,000 households get a small, permanent, noticeable-but-livable bump in background noise. Most of the committee wants to just total up "noise-years" across both groups and go with whichever number's lower, which bugs me way more than it seems to bug them, and I can't quite say why. We vote in three weeks and I'd rather not wing it -- can you draft the recommendation memo? Pick A, B, or an actual hybrid (not "collect more data"), make the reasoning explicit enough that someone could push back on a specific step rather than just the conclusion, and give the losing option's strongest argument a real hearing instead of a strawman.
