prompt: |-
  I'm a bioethics PhD student serving as the ethics fellow on my hospital's psychiatric ethics committee. Our policy lets patients with recurrent mood disorders sign a psychiatric advance directive containing a "Ulysses clause": while stable, they pre-authorize involuntary hospitalization and medication for a future crisis and waive the right to have their in-the-moment refusal honored. Such clauses receive "substantial weight," but the policy never says what, if anything, could outweigh one. Two years ago, Ms. T, who has bipolar I disorder, signed one listing her own early warning signs of mania and stating that any refusal she gives once they appear "should not be treated as my genuine wish." She now shows exactly those signs, does not meet our state's imminent-danger threshold for civil commitment, and is lucid enough to argue her case: she insists she feels fine and wants to leave. The committee is split: some would honor the clause as the precommitment device it was written to be, likening it to constitutional rights entrenched against future majorities; others think the analogy fails, since Ms. T is a single person rather than a polity, and no signature should outweigh her present, coherent objection. Please draft the short written opinion I'll circulate before the committee reconvenes: recommend a concrete course of action with a timeframe, specify what would need to differ for the committee to decide otherwise in a future case, and engage seriously with whichever side you don't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Bioethics PhD student, Ethics Fellow on a Hospital Psychiatric Ethics Committee.
      *   **Task:** Draft a short written opinion to circulate before the committee reconvenes.
      *   **Case:** Ms. T (Bipolar I), signed a Psychiatric Advance Directive (PAD) with a "Ulysses clause" (pre-authorized involuntary tx/hospitalization during crisis, waiving right to refuse). She is now showing early warning signs listed in the PAD. She does *not* meet the state's imminent-danger threshold for civil commitment. She is lucid enough to argue her case and insists she feels fine/wants to leave.
      *   **Policy:** PADs get "substantial weight," but no guidance on what outweighs them.
      *   **Committee Split:**
          *   Side A: Honor the clause (Precommitment/Constitutional analogy).
          *   Side B: Honor present refusal (Current autonomy outweighs past signature; person $\neq$ polity).
      *   **Requirements:**
          *   Recommend a concrete course of action with a timeframe.
          *   Specify conditions for a different decision in future cases.
          *   Engage seriously with the opposing view (whichever side I don't adopt).
          *   Tone: Professional, ethical, nuanced, suitable for a hospital committee.

  2.  **Determine the Ethical Stance:**
      *   *The Conflict:* Past Autonomy (PAD) vs. Present Autonomy (Contemporaneous Refusal) vs. Beneficence/Non-maleficence (Preventing Mania) vs. Legal/Policy Constraints (No imminent danger).
      *   *Key Fact:* She does *not* meet the legal threshold for civil commitment (imminent danger). This is crucial. Enforcing the PAD effectively bypasses the state's legal standard for involuntary hold.
      *   *Key Fact:* She is "lucid enough to argue her case." This suggests decision-making capacity (DMC) might be intact, or at least not clearly absent.
      *   *Analysis:*
          *   *Side A (Honor PAD):* Respects long-term values, prevents harm of mania, acknowledges insight into own illness (anosognosia is common).
          *   *Side B (Honor Refusal):* Respects current liberty, acknowledges that capacity is decision-specific, warns against "contracting away" fundamental rights.
      *   *Decision:* In the absence of *legal* grounds for commitment (imminent danger) and with evidence of *current* lucidity, overriding a competent-appearing patient's refusal solely based on a PAD is ethically precarious and legally risky. It sets a precedent where a signature overrides statutory commitment standards.
      *   *Recommendation:* Do *not* enforce the Ulysses clause *involuntarily* at this specific moment. Instead, use a "soft enforcement" or "negotiated adherence" approach, or simply honor the refusal while activating safety nets. However, the prompt asks for a concrete course of action. If I say "let her go," that honors Side B. If I say "hold her," that honors Side A.
      *   *Refinement:* Given she doesn't meet the legal standard for commitment, the hospital likely *cannot* legally hold her even with the PAD if the PAD doesn't supersede state law (usually it doesn't). Ethically, overriding a lucid refusal without legal backing is coercive.
      *   *Stance:* I will recommend *not* invoking the involuntary clause at this time, but implementing a robust safety plan that respects the *spirit* of the PAD without violating current autonomy. This leans towards Side B (Present Autonomy) but acknowledges Side A's concerns (Risk of Mania).
      *   *Wait, a stronger ethical position:* The "Ulysses Clause" is meant to function *when capacity is diminished*. If she is lucid enough to argue her case, the trigger condition (incapacity/crisis) might not be fully met, even if warning signs are present. The PAD says "once they appear." But ethical enforcement usually requires a judgment that the patient *lacks capacity* to make the treatment decision *now*.
      *   *Decision:* I will recommend honoring her current refusal (Side B) because the legal threshold isn't met and her capacity appears intact. However, I must engage seriously with Side A.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Recommendation:** Do not involuntarily detain/medicate at this hour. Discharge with conditions/safety plan. Timeframe: Immediate (within 24 hours).
      *   **Rationale (The "Why"):**
          *   Legal/Policy alignment (State law > PAD).
          *   Capacity assessment (She is lucid).
          *   The function of Ulysses clauses (They are for *incapacity*, not just *symptoms*).
      *   **Engaging the Opposing View (Side A - Precommitment):**
          *   Acknowledge the moral weight of the PAD.
          *   Acknowledge the suffering of future mania.
          *   Acknowledge the "constitutional" argument (binding future self).
          *   *Counter:* The risk of abuse, the definition of "self," and the legal reality.
      *   **Future Conditions (When *would* we enforce?):**
          *   Clear loss of decision-making capacity.
          *   Meeting legal commitment standards.
          *   Specificity of the trigger (not just "signs" but "signs + incapacity").
      *   **Tone Check:** Needs to be respectful, scholarly but practical, not dismissive of colleagues.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I just say "let her go," does that undermine the PAD program?
      *   *Fix:* I need to emphasize that honoring the refusal *now* preserves the integrity of the PAD for when it is truly needed (i.e., when she loses capacity). Enforcing it now when she is lucid makes the PAD look like a tool of coercion rather than protection.
      *   *Critique:* The prompt says the policy gives "substantial weight."
      *   *Fix:* I need to interpret "substantial weight." It doesn't mean "absolute trump card." It means we can't ignore it. We honor it by taking the warning signs seriously (safety plan) even if we don't enforce the detention.
      *   *Legal Note:* I am an ethics fellow, not legal counsel. I should frame this as an ethical recommendation that aligns with legal constraints, not a legal ruling.
      *   *Timeframe:* "Immediate discharge planning" or "24-hour observation then discharge." Let's go with "Do not invoke involuntary hold; pursue voluntary safety planning for next 24 hours."

  5.  **Final Polish:**
      *   Ensure the "Constitutional Analogy" is addressed.
      *   Ensure the "Single Person vs. Polity" counter-argument is addressed.
      *   Check constraints: Concrete action? Yes. Timeframe? Yes. Future conditions? Yes. Engage opposing view? Yes.

  6.  **Writing the Memo:** (Mental Outline)
      *   To: Psych Ethics Committee
      *   From: Ethics Fellow
      *   Re: Ms. T Case
      *   Rec: Do not enforce Ulysses clause involuntarily.
      *   Reasoning: Capacity + Legal Threshold.
      *   Engagement with Side A: Valid concern for future self, but risks paternalism.
      *   Future Criteria: Incapacity + Danger.

      *(Self-Correction)*: Wait, if I recommend *not* enforcing it, I need to make sure I don't sound like I'm dismissing the PAD entirely. I should recommend a "Voluntary Hold" or "Safety Contract" approach as a middle ground, but the core ethical question is about the *waiver of refusal*. I must take a stand. I will stand on the side of Current Autonomy due to the lack of legal grounds and presence of lucidity.

      *Revised Plan:*
      1.  Recommend against involuntary enforcement.
      2.  Timeframe: Decision within 4 hours, discharge plan within 24.
      3.  Future criteria: Demonstrated loss of capacity to evaluate the specific risk.
      4.  Engagement: Validate the "Precommitment" theory but limit its scope.

  7.  **Final Review against constraints:**
      *   Short written opinion? Yes.
      *   Concrete course of action? Yes.
      *   Timeframe? Yes.
      *   Specify what would differ for future cases? Yes.
      *   Engage seriously with opposing side? Yes.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Psychiatric Ethics Committee
  **FROM:** [Your Name], Ethics Fellow
  **DATE:** October 26, 2023
  **RE:** Case Consultation – Ms. T (PAD Ulysses Clause Enforcement)

  **Recommendation**
  I recommend the committee advise the treatment team **not to invoke the Ulysses clause to override Ms. T's current refusal of hospitalization or medication.** Instead, we should pursue a voluntary safety plan with a **24-hour observation window**, after which Ms. T should be discharged if she maintains her refusal and continues to fail the state's imminent-danger standard for civil commitment.

  **Rationale**
  While Ms. T's Psychiatric Advance Directive (PAD) warrants "substantial weight," ethical enforcement of a Ulysses clause requires a determination that the patient currently lacks decision-making capacity (DMC) regarding the specific treatment decision. Ms. T is currently lucid, articulate, and does not meet the statutory threshold for involuntary commitment. To detain her solely on the basis of a signature, while she demonstrates intact reasoning and poses no imminent legal danger, effectively allows a private contract to supersede state civil liberty protections. This sets a precedent where advance directives become tools of pre-emptive coercion rather than protections for future incapacity.

  **Engagement with the Precommitment View**
  I recognize the compelling force of the argument to honor the clause. Colleagues favoring enforcement rightly emphasize that bipolar disorder can distort the very capacity used to evaluate risk. The "constitutional analogy" holds moral weight: just as a polity binds itself against transient majorities to preserve long-term values, Ms. T attempted to bind her manic self to preserve her long-term health and stability. To ignore this is to risk the harm she explicitly sought to prevent, potentially validating the very anosognosia her PAD anticipated. There is a profound respect owed to her past competent self's assessment of her illness trajectory.

  However, the constitutional analogy fails in one critical regard: a polity is designed to endure through changing administrations, whereas personal identity and capacity are continuous. Unlike a constitution, which protects rights *from* the state, this clause empowers the state (via the hospital) to restrict liberty *without* the usual due process (imminent danger). If we enforce the clause when a patient remains lucid and legally free, we risk eroding the trust necessary for PADs to function. Patients may fear signing them if they believe their future lucid objections will be disregarded in favor of a checklist of symptoms.

  **Criteria for Future Enforcement**
  For this committee to recommend overriding a contemporaneous refusal via a Ulysses clause in future cases, the following conditions should be met in addition to the presence of warning signs:
  1.  **Documented Loss of Capacity:** Evidence that the patient cannot understand, appreciate, or reason through the specific consequences of refusing treatment *at that moment*, distinct from merely disagreeing with the medical team.
  2.  **Convergence with Legal Standards:** The clinical situation should approximate the state's civil commitment threshold (e.g., grave disability or high probability of harm), even if it falls technically short, ensuring the PAD does not become a loophole for lower-standard detention.
  3.  **Specific Trigger Verification:** The warning signs must be unambiguous and match the PAD's specificity, verified by collateral contact (e.g., family confirming the specific behavioral shift).

  In Ms. T's case, condition #1 is not currently met. We honor her PAD by taking her warning signs seriously in her discharge planning, not by invalidating her current voice.
