  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on promising, focusing on Rawls's 1955 "Two Concepts of Rules."
      *   **Core Rawlsian Thesis:** Practice conception of rules. Promising is a social practice logically prior to particular cases (like baseball). Individual utilitarian discretion is foreclosed by the practice.
      *   **The Problem:** The "Deathbed Promise" / "Secret Promise" objection (attributed to Ross). If no one knows, the practice isn't harmed, yet the obligation remains.
      *   **Rawls's Defense:** Distinction between justifying the practice vs. justifying the act. The son lacks standing to weigh consequences because the practice doesn't allow it.
      *   **My Task:** Argue that Rawls's answer *fails*. Show why the "logically prior" move doesn't rescue the practice theory in these specific cases.
      *   **Requirement:** Commit to an alternative grounding for promissory obligation (e.g., expectations, trust, normative power). Do not list options; pick one lane.

  2.  **Deconstruct Rawls's Argument & The Objection:**
      *   *Rawls:* Promising exists *because* there is a social institution. The obligation is defined by the rules of that institution. If you opt out of the rules (by breaking a promise for utility), you undermine the institution.
      *   *The Objection:* In secret cases (deathbed, desert island), the institution *cannot* be undermined. No one knows. No trust in the *general* practice is eroded.
      *   *Rawls's Reply:* It doesn't matter if the *consequences* are nil. You are a participant in the practice. Participants don't get to calculate utility on specific cases. The obligation comes from the status of being a promisor within the practice.
      *   *The Critique:* Why does this fail?
          *   If the practice is *constitutive* of the act, then without the practice, the act doesn't exist.
          *   But in the secret case, the *reason* to keep the promise seems to persist even if the practice were nonexistent or unknown to others.
          *   Rawls says the practice is "logically prior." But in the secret case, the *binding force* seems to rely on something internal to the dyad, not the external social structure.
          *   If the practice is the *source* of the obligation, and the practice's justification is utilitarian (social stability/trust), then in cases where social stability/trust is unaffected, the obligation should vanish *if* the practice theory is consistent. Rawls tries to block this by saying "rules are rules," but that looks like rule fetishism if the underlying justification (practice utility) is absent.
          *   Crucially: If I can make a promise on a desert island where no practice exists, Rawls says I can't. But intuitively, I can. If I can, the practice isn't logically prior.

  3.  **Develop the Argument Against Rawls:**
      *   *Point 1: The "Logical Priority" Claim is Empirical/Conceptual Overreach.* Rawls claims you literally cannot perform the speech act without the practice. But in the secret/deathbed case, the *normative force* survives the absence of social sanction. If the obligation is truly derived from the practice's utility (maintaining trust), and there is no threat to trust, the practice theory implies no obligation. Rawls's "no standing" reply is a dodge. It asserts authority without explaining the *source* of that authority in a vacuum.
      *   *Point 2: The "Free Rider" Problem in Reverse.* Rawls worries about free-riders undermining the practice. But the secret promisor isn't a free-rider in a way that harms the practice. If the practice theory holds, obligations are tied to the *function* of the practice. If the function (social coordination/trust) isn't at stake, the obligation shouldn't be either. The fact that it *is* at stake suggests the obligation comes from elsewhere.
      *   *Point 3: The Phenomenology of the Obligation.* The son feels bound to the *father*, not to "society." Rawls makes the obligation vertical (individual to institution). The experience is horizontal (individual to individual).

  4.  **Select the Alternative Theory:**
      *   *Options:* Expectation (Scanlon), Normative Power (Shiffrin/Hart), Trust (Baier/Jones).
      *   *Selection:* **Normative Power / Authority over oneself (The "Will Theory" or "Autonomy" account).**
      *   *Why?* It fits best against Rawls's "Practice" account. Rawls says society gives you the power. The Will Theory says *you* generate the power through your will. This directly counters the "logically prior" claim. It explains the secret promise: I bind *myself* to you, regardless of the social backdrop. It captures the "obligation to the specific person" better than expectation (which is psychological) or trust (which is relational but vague). Let's refine this: **The Normative Power Account (specifically focusing on the transfer of authority/right).**
      *   *Actually, let's look at Scanlon's Principle F (Expectation).* It's very prominent in contemporary literature responding to Rawls. However, the prompt asks to "commit to what's actually doing the binding work." A Normative Power account (Shiffrin-style) is often seen as the strongest rival to Practice Conceptions regarding the *source* of the obligation. But Scanlon is more accessible and directly addresses the "reasons" aspect.
      *   *Decision:* Let's go with the **Normative Power/Authority Account** (akin to H.L.A. Hart or Seana Shiffrin). It directly contests Rawls's claim that the *social practice* confers the power. Instead, the capacity to promise is a moral power inherent to agency. This explains why the desert island promise works: you don't need a social institution to exercise moral agency over your future actions.

      *Wait, let's reconsider Scanlon.* Scanlon's contractualism (Principle F) is the standard modern rebuttal to Rawls on promising. It grounds it in the wrong of manipulating expectations.
      *But the prompt asks to pick a lane.* The Normative Power view is distinctively anti-utilitarian and anti-practice in a way that highlights the *individual's* sovereignty. It fits the "graduate seminar" vibe well.
      *Actually, the "Expectation/Reliance" view is often critiqued for not capturing the *obligation* (you can rely on me without me promising). The Normative Power view captures the *creation* of the obligation.*
      *Let's choose the **Normative Power (Will Theory)** account.* It directly attacks the "logically prior" claim by asserting the power is inherent to the agent, not conferred by society.

  5.  **Drafting the Argument (Iterative Process):**
      *   *Introduction:* Acknowledge Rawls's sophistication. State the thesis: The deathbed case breaks the "logical priority" claim because the obligation persists even when the practice's functional justification (social trust) is irrelevant.
      *   *Section 1: The Failure of Logical Priority.* Rawls says no practice = no promise. But on the desert island, if I say "I promise to bury you," and I don't, I wronged you. Rawls says "You didn't actually promise because the practice isn't there." This is counter-intuitive and revisionist. It conflates the *convention* of wording with the *moral act* of binding.
      *   *Section 2: The "No Standing" Dodge.* Rawls says the son can't calculate utility. But why? Usually, rules bind because they serve a good. If the good (practice stability) isn't served, why does the rule bind? Rawls offers a "black box" deontology inside a utilitarian framework. It's unstable.
      *   *Section 3: The Alternative (Normative Power).* The binding force is the promisor's exercise of moral authority. By promising, I give the promisee a right to my performance. This right exists between us, independent of third-party observers. This explains the deathbed case perfectly. The father has a right against the son, created by the son's will, not by society's rules.

  6.  **Refining the Tone:**
      *   Needs to be academic but engaging (seminar context).
      *   Respectful of Rawls (it's a classic paper) but firm in the critique.
      *   Ensure I explicitly engage with "logically prior."

  7.  **Final Polish:**
      *   Check against constraints: Did I engage "logically prior"? Yes. Did I pick one alternative? Yes (Normative Power). Did I use the deathbed/desert island cases? Yes.
      *   *Self-Correction on "Normative Power":* Make sure to distinguish it from simple "choice." It's about changing normative relations.
      *   *Wait, one nuance:* Rawls argues the *concept* of promising is defined by the practice. To argue against this, I need to show the *moral obligation* exists even if the *institutional label* is fuzzy. The "Desert Island" case is perfect for this. If two people are the last on earth, can they promise? Rawls says no (or it's a different game). Intuition says yes. If yes, the practice isn't logically prior to the obligation.

  8.  **Finalizing the Alternative:** I will argue for the **Normative Power (Will) Theory**. It provides the sharpest contrast to Rawls's Institutionalism.

      *(Self-Correction during drafting)*: I should be careful not to conflate Rawls (1955) with Rawls (1971). The prompt is specifically about "Two Concepts of Rules." Keep the focus there.

      *Structure:*
