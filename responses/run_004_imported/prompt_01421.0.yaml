      2.  Critique of "Logical Priority": The desert island reductio. If the practice is constitutive, no practice = no obligation. But obligation remains. Therefore, practice isn't constitutive of the *obligation*, only perhaps the *terminology*.
      3.  Critique of "Justification Distinction": Rawls separates practice-utility from act-utility. But in secret cases, practice-utility is zero. If the practice is justified *by* its utility, and a specific instance generates *no* utility (nor disutility) for the practice, the obligation loses its anchor. Rawls's "no standing" reply is question-begging.
