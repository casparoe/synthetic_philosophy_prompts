answer: |-
  This is a fantastic puzzle to press in a graduate seminar, because it targets the exact seam where Rawls's early utilitarian-leaning liberalism tries to stitch itself into a deontological framework. Rawls's move in "Two Concepts of Rules" is undeniably elegant: by shifting the locus of justification from the *act* to the *practice*, he shields promising from case-by-case utilitarian erosion. But you are right to feel that the "deathbed promise" (or the "desert island" variant) exposes a fissure in that architecture.

  Here is an argument you can use to press the point that Rawls's "logical priority" claim fails to rescue the practice theory in these limit cases, followed by a commitment to the **Normative Power (Will) Theory** as the superior grounding.

  ### The Failure of "Logical Priority" in Secret Cases

  Rawls's central thesis is that the practice of promising is "logically prior" to particular cases. Just as one cannot "strike out" without the institution of baseball, one cannot "promise" without the institution of promising. The rules of the practice define what the act *is*. Consequently, the obligation to keep a promise is derived from the obligation to support just institutions (or, in the 1955 paper, the utility of maintaining the practice).

  The deathbed promise objection strikes at the *constitutive* nature of this claim. Rawls's response—that the son lacks the "standing" to appeal to consequences because the practice forecloses that discretion—works only if the practice is actually doing the heavy lifting in generating the obligation. But in the secret case, the practice is functionally inert.

  **1. The Desert Island Reductio**
  Consider the "desert island" variation: Two shipwreck survivors, A and B, are the only humans left. There is no society, no reputation to maintain, and no social practice of promising to participate in. A says to B, "I promise to ration the water this way." B relies on this. A breaks it.
  Rawls must say that A has not actually *promised*, because the logical prerequisite (the social practice) is absent. At best, A has misled B. But this contradicts our deepest moral intuition: A has wronged *B*. The obligation existed despite the absence of the institution.
  If the obligation persists without the practice, the practice cannot be "logically prior" to the obligation. It might be prior to the *conventional wording* or the *social recognition* of the act, but it is not prior to the *moral bond* itself. Rawls conflates the *convention* of promising with the *moral power* to bind oneself. The deathbed case shows that the moral bond survives the removal of the convention.

  **2. The "No Standing" Dodge**
  Rawls's specific reply to Ross is that the son cannot weigh the consequences of breaking the deathbed promise because the rules of the practice do not allow him that discretion. He argues that allowing such discretion would destroy the practice's utility generally.
  But this is question-begging in the secret case. The justification for the *practice* is utilitarian (it promotes trust and coordination). In the deathbed case, breaking the promise has *zero* impact on general trust (no one knows). Therefore, the utilitarian justification for the *practice* does not generate a reason to keep *this* promise.
  Rawls tries to block this by saying, "You don't get to calculate." But *why* doesn't he get to calculate? In a rule-utilitarian framework, you don't get to calculate because following the rule generally produces better outcomes. But if following the rule in *this specific instance* produces no general benefit (because it's secret) and prevents a specific harm (e.g., the estate goes to a better cause), the rule-utilitarian logic collapses.
  Rawls effectively smuggles a deontological constraint ("never break a promise") into a utilitarian justification ("practices are good"). The deathbed case forces him to show his hand: if he admits the obligation holds, he admits it's not because of the practice's utility. If he admits it's not because of the practice's utility, then the practice isn't the source of the obligation. He wants to have it both ways: a practice justified by consequences, but rules that bind regardless of consequences. The secret promise shows these two come apart.

  ### The Alternative: The Normative Power Account

  If the social practice isn't doing the binding work, what is? I argue we should commit to the **Normative Power (or Will) Theory** of promising (associated with H.L.A. Hart and later Seana Shiffrin).

  On this view, promising is not a move within a social game conferred by society; it is a **moral power inherent to individual agency**. To be a moral agent is to have the capacity to alter your own normative relations with others through the exercise of your will. When you promise, you are not invoking a social rule; you are performing a moral speech act that transfers a right of control over a specific action from yourself to the promisee.

  **Why this rescues the deathbed case:**
  1.  **Independence from Social Sanction:** The Normative Power account explains why the son is bound even if no one knows. The obligation is not grounded in the stability of a social institution (which requires public knowledge); it is grounded in the **right the father now holds against the son**. The father has been given authority over the son's future action. That authority exists in the dyad, regardless of the background society.
  2.  **Explaining the "Ought":** Rawls struggles to explain why the son *ought* to keep the promise other than "because the rules say so." The Normative Power account says the son ought to keep it because **he has alienated his discretion**. By promising, he voluntarily gave up his right to decide how to handle the estate based on utility. To break the promise is not to violate a social rule; it is to violate the father's rightful authority over that decision.
  3.  **Respecting the "Logical Priority" Intuition (without the error):** Rawls is right that promising requires a background of understanding (you can't promise if the other person doesn't understand the language). But this is a condition of *communication*, not a condition of *moral ontology*. The Normative Power account accepts that we need language to exercise the power, but denies that the *moral force* comes from the language game itself. The force comes from the autonomy of the agents involved.

  **Conclusion for the Seminar**
  Rawls's "Two Concepts" move is a brilliant defense of rule-utilitarianism against act-utilitarianism, but it fails as a theory of *promissory obligation*. It treats promising as a public institution designed for social coordination. The deathbed promise reveals that promising is actually a **private transfer of moral authority**. The obligation binds not because society is watching, but because the promisor has voluntarily subjected their will to the promisee. The practice facilitates promising, but it does not create it. To think otherwise is to mistake the scaffold for the building.
