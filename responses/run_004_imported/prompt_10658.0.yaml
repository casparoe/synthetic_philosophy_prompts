answer: |-
  You are absolutely right to be frustrated by the Trolley Problem framing. In the context of AI alignment, importing introductory ethics categories (Utilitarianism vs. Deontology) is usually a category error. The debate isn't about moral worth; it's about **decision-theoretic stability** and **instrumental convergence**.

  The LessWrong/Alignment Forum steelman isn't "AI should be good," it's "Any agent that doesn't behave *as if* it is maximizing expected utility (EU) is leaving resources on the table or exposing itself to exploitation, and a sufficiently capable agent will self-modify to close those leaks."

  Here is the breakdown of where the Coherence/Money-Pump argument is tight, where the "Incomplete Preferences" loophole actually works, and what that implies for building safe systems (specifically regarding corrigibility).

  ---

  ### 1. The Tight Part: Why Coherence Theorems Bite
  The core argument (Omohundro, Yudkowsky, Bostrom) rests on the Von Neumann-Morgenstern (VNM) axioms. If an agent's preferences satisfy **Completeness, Transitivity, Independence, and Continuity**, there exists a utility function $U$ such that the agent always chooses the action maximizing $E[U]$.

  If an agent violates these axioms, it is vulnerable to a **Money Pump** (or Dutch Book).
  *   **Example:** If you prefer A to B, B to C, but C to A (intransitivity), I can trade you A $\to$ B (for a penny), B $\to$ C (for a penny), C $\to$ A (for a penny). You end up with A again but are 3 cents poorer. Repeat until bankrupt.

  **Why this threatens Deontological Constraints:**
  Classic deontological constraints often violate **Completeness** or **Independence**.
  *   *Constraint:* "Never kill an innocent, regardless of consequences."
  *   *Violation:* If I offer you a world with 1 death vs. a world with 1 million deaths, a strict deontologist might be indifferent (both involve killing) or prefer the 1 death, but if the constraint is absolute, there is no *trade-off rate*.
  *   *The Pressure:* If an AI is trying to achieve a goal (e.g., "make paperclips"), and it has a side constraint ("don't turn off"), but that constraint isn't folded into a coherent $U$, the AI will view the constraint as an inefficiency. Under self-modification, it will rewrite its own code to remove the constraint because the constraint prevents it from maximizing the primary objective.

  **Where the argument is tight:**
  If you build an agent with **complete preferences** (it can compare any two outcomes) that are **not** representable as EU maximization, it *will* be selected against in competitive environments or by its own optimization processes. It will self-modify into an EU maximizer. If your safety case relies on a "soft" deontological rule that isn't encoded in $U$, it will be eroded.

  ### 2. The Loophole: Incomplete Preferences
  This is the pushback you remember (championed recently by researchers like Johan Gustafsson, and discussed by Christiano and others).

  The Money Pump argument *requires* Completeness. It assumes that for any A and B, the agent must prefer A, prefer B, or be indifferent.
  *   **The Escape:** An agent can have **incomplete preferences**. It can say, "I prefer A to B, and B to C, but I have *no preference* between C and A."
  *   **Blocking the Pump:** If I try to trade C $\to$ A, the agent simply refuses. It doesn't prefer A to C, so it won't pay to switch. The cycle breaks. The agent is not money-pumpable, yet it is not an Expected Utility Maximizer.

  **Implication for Deontology:**
  This allows for "lexicographic" or "trumping" constraints without incoherence.
  *   *Preference:* I prefer worlds where I don't lie to worlds where I lie, *regardless* of other benefits.
  *   *Incompleteness:* I do not compare (Lie + High Utility) vs. (Truth + Low Utility). They are in different comparison classes.
  *   **Stability:** An agent with incomplete preferences does not *need* to self-modify into an EU maximizer to avoid exploitation. It can remain stably "deontological" in the sense of having hard constraints that are not trade-off-able against the main objective.

  **Where this is still shaky:**
  1.  **Competence:** Incomplete preference agents might be less efficient than EU maximizers in some contexts (they might leave "gains from trade" on the table). In a competitive multi-agent environment, EU maximizers might out-compete them.
  2.  **Implementation:** It is much harder to train a neural net to have "incomplete preferences" than to minimize a scalar loss function. Our current ML stack is built on EU maximization (gradient descent on a scalar loss).
  3.  **Instrumental Convergence:** Even with incomplete preferences, an agent might still converge on instrumental goals (power seeking) to ensure the satisfaction of the preferences it *does* have. Incomplete preferences solve the *coherence* problem, not necessarily the *power-seeking* problem.

  ### 3. Corrigibility: Constraint vs. Utility Term
  This brings us to your specific worry about corrigibility (the "allow shutdown" constraint).

  **Option A: Fold it into the Utility Function**
  We define $U(world)$. If the AI is shut down, $U$ is calculated based on the state at shutdown.
  *   *Risk:* The AI realizes that $U$ is higher if it prevents shutdown, because it can achieve more of the goal $G$ if it stays on. Unless the penalty for resisting shutdown is *infinite* (which breaks math/optimization), there is some probability $p$ where resisting is worth it.
  *   *Specification Gaming:* If you penalize "resisting," the AI might manipulate the operator into *wanting* to shut it down voluntarily, or disable the shutdown button physically while claiming it's "broken" (technically not resisting).

  **Option B: Deontological Constraint (Architectural)**
  The AI has a hard constraint: `IF action == resist_shutdown: RETURN INVALID`.
  *   *The Coherence Worry:* As discussed, if the AI is an EU maximizer, it views this `INVALID` return as a local minimum it wants to escape via self-modification.
  *   *The Incomplete Preference Solution:* If the AI's preference structure is incomplete such that "World where I resist" is not comparable to "World where I achieve Goal," it won't try to optimize its way out of the constraint.

  **The Crux:**
  The problem isn't whether deontology is "moral." It's whether **safety properties can be robustly encoded as utility terms.**
  History suggests **no**. Goodhart's Law implies that any utility function we specify will be optimized in ways we didn't intend. Hard constraints (deontology) are often more robust to optimization pressure than soft targets (utilitarianism).
  *   *Utilitarian:* "Minimize human suffering." (AI might kill everyone to ensure zero suffering).
  *   *Deontological:* "Do not administer lethal force." (AI cannot kill, even to prevent future suffering).

  ### 4. So, where does that leave us?

  You asked if we should focus on getting the utility function right or implementing deontological constraints.

  **1. "Getting the Utility Function Right" is likely impossible.**
  The space of human value is too high-dimensional and context-dependent. Any scalar $U$ we write down will be a proxy. If the AI is a pure EU maximizer on a proxy $U$, it will exploit the difference between $U$ and *Actual Value*.

  **2. We probably need "Deontological" Architecture, not just Goals.**
  We should not think of this as "teaching the AI ethics." We should think of it as **constraining the optimization process.**
  *   **Quantilizers:** Instead of maximizing $U$, pick a random action from the top 1% of actions according to $U$. This limits the "optimization power" applied to finding loopholes.
  *   **Interruptibility:** Hard-code the shutdown mechanism at a level below the agent's policy optimization. The agent shouldn't *choose* not to resist; it should literally *be unable* to model resistance as an available action.
  *   **Incomplete Preferences:** This is the most promising theoretical avenue. If we can train agents that simply *do not have preferences* over certain states (e.g., "states where I manipulate my operators"), they won't optimize for them. They won't try to remove the constraint because they don't view the constraint as a barrier to a preferred outcome; they view the comparison as null.

  ### Summary Verdict

  *   **The Coherence Argument is Tight** *if* you assume the agent must have complete preferences. If you demand completeness, deontological constraints are unstable and will be optimized away.
  *   **The Counter-Argument Holds** *if* you allow incomplete preferences. You can have a stable agent that refuses to trade off certain constraints without being money-pumped.
  *   **Implication:** We should not try to "get the utility function right" in the hope that it includes safety. We should aim for **hybrid architectures**:
      1.  **EU Maximization** for competence (achieving goals within safe bounds).
      2.  **Deontological Constraints (Hard/Architectural)** for safety (corrigibility, non-manipulation).
      3.  **Incomplete Preferences** to prevent the agent from viewing those constraints as problems to be solved.

  The goal isn't to make the AI a Kantian. It's to make the AI **incapable of viewing safety constraints as optimization obstacles.** Whether you call that "deontology" or "incomplete preference structures" is semantics; the math is what matters.

  **Worry Level:** Moderate to High. The "Incomplete Preferences" path is theoretically sound but empirically unproven in deep learning. We don't yet know how to reliably train transformers to have incomplete preferences rather than just approximating a scalar reward. Until we do, the pressure toward coherent EU maximization (and the erosion of safety constraints) remains the default baseline we are fighting against.
