answer: |-
  This is a really mature dilemma to have. Most people fight to get *more* money; you're fighting to ensure the arrangement is actually *fair*. That speaks well of your character and your friendship with Mia.

  You asked for logic, not vibes. To find that, we need to separate **Labor** (what you do) from **Equity** (what you own), and look at **Opportunity Cost** (what you give up).

  Here is the logical breakdown of your situation, both before and after the bakery offer.

  ### 1. The "Before" Logic: Was 50/50 fair originally?

  In business, there are two ways to split money: **Wages** and **Profit.**

  *   **Wages** pay for labor. If labor is unequal in value, wages should be unequal.
  *   **Profit** pays for ownership, risk, and overhead. This is usually split by equity (ownership share).

  **The Argument for 50/50 (Equity Model):**
  If you view yourselves as co-founders, the 50/50 split is standard *if* you share the risk and the non-baking work equally.
  *   **The "CEO" Work:** A cookie business isn't just baking. It's answering emails, invoicing, buying ingredients, packaging, marketing, delivering, and cleaning. If Mia is the "Head Baker" but you are the "Head of Operations," your hours are equally valuable, just different.
  *   **The Brand:** If clients buy from "Mia & You Co." rather than just "Mia's Cookies," then you are both the brand.
  *   **Risk:** If the business fails, do you both lose money? If yes, equal risk often justifies equal reward.

  **The Argument Against 50/50 (Labor Model):**
  If the only value driving sales is Mia's specific artistic talent, and your role is purely assistive (e.g., handing her piping bags, washing dishes), then the market value of your labor is lower.
  *   **Replaceability:** If Mia got sick, could you bake and decorate the cookies to the same standard? If no, she holds the "key asset."
  *   **Market Rate:** As you noted, if she went solo, she could charge more. This suggests the premium price is tied to *her* skill, not the partnership.

  **The Verdict:**
  If you handle the business logistics (admin, sales, ops) while she handles production, 50/50 is **fair** because you are enabling her to focus on high-value work. If you are both just baking and decorating, but hers is better, 50/50 is **generous to you** but common in friendships to avoid scorekeeping.

  ### 2. The "After" Logic: Does the bakery offer change things?

  The bakery offer changes Mia's **Opportunity Cost**, but it doesn't necessarily change the value of *your* business.

  *   **Opportunity Cost:** Before, if Mia quit your hustle, she had time but no guaranteed income. Now, if she quits your hustle, she has a guaranteed paid gig. Her "cost" of staying with you has gone up.
  *   **Leverage:** She now has a concrete benchmark for what her time is worth.
  *   **Distraction Risk:** If the bakery gig takes her weekends, can she still fulfill your joint orders? If her availability drops, her contribution to *your* business decreases, which might actually argue for *you* getting more (if you pick up the slack), or the business pausing.

  **Does she deserve a bigger cut of YOUR earnings now?**
  Logically, **no.** An external offer doesn't change the internal value generated by your joint cookies. If you sell a cookie for $5, it costs $5 to make regardless of whether Mia has another job offer.

  **However,** it does change the **sustainability** of the partnership. If she realizes she can make $50/hr at the bakery and only $20/hr with you, she may eventually quit. To keep her, the partnership needs to remain attractive to her.

  ### 3. The Solution: How to fix the "Weird Feeling"

  The guilt you feel comes from sensing that the *Labor* split is unequal, even if the *Equity* split is equal. Here is how to structure this logically so you stop feeling like you're taking advantage of her.

  **Option A: The "Salary + Profit" Model (Most Logical)**
  Treat the business like a real company.
  1.  **Pay for Labor:** Assign an hourly rate to tasks. If her decorating requires master-level skill, pay her a higher "labor rate" for decorating hours than your "prep/packaging" hours.
  2.  **Split the Profit:** After labor costs and expenses are paid, split the remaining profit 50/50 as owners.
  *   *Why this works:* It acknowledges her superior skill (she gets paid more for labor) but honors your partnership (you share the upside equally).

  **Option B: The "Role Definition" Audit**
  Sit down and list every single task required to run the hustle.
  *   Decorating/Baking (Mia's strength)
  *   Client Communication/Invoicing (Who does this?)
  *   Sourcing Ingredients (Who does this?)
  *   Marketing/Social Media (Who does this?)
  *   Cleanup (Who does this?)
  *   *Logic:* If you take 100% ownership of the "boring stuff" (admin, taxes, marketing), you are freeing her to do the high-value work. That justifies a 50/50 split because you are the "Business Manager" and she is the "Head Chef." Both are essential.

  **Option C: The "Future-Proofing" Conversation**
  Since you value the friendship, you need to talk about the bakery offer openly.
  *   *Say this:* "I know you got that offer from the bakery, which is amazing. I want to make sure our hustle is still worth your time compared to that. I've been feeling like your talent drives the sales more than I do, and I want to make sure you feel valued."
  *   *The Logic:* This gives her the chance to voice if she feels underpaid. If she says, "No, I love working with you, the bakery gig is just extra cash," then your 50/50 split is safe. If she hesitates, you know you need to adjust to Option A.

  ### Summary
  1.  **Was 50/50 fair before?** Yes, *if* you handle the non-baking business operations. No, if you are just an assistant.
  2.  **Does the bakery offer demand a split change?** No, not automatically. But it raises the risk that she will leave if she feels undervalued.
  3.  **The Fix:** Don't just change the split out of guilt. Define your roles. If you take on more business burden (marketing, admin, risk), you earn that 50%. If you can't, consider paying her a higher "labor rate" before splitting profits.

  **One warning:** Do not undervalue yourself too much. Many talented bakers fail because they hate the business side (emails, taxes, customers). If you handle the stuff she hates, you are worth your weight in gold to her, regardless of who pipes the better rose.
